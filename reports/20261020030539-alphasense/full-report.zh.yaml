  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              AlphaSense
              的相关市场窄于全部商业智能软件，但宽于单纯文档搜索。核心边界是企业为授权市场与金融内容、专家访谈记录、搜索与综合、内部知识集成及研究工作流软件支付的订阅支出。相邻支出包括结构化财务数据，以及将分析推进到
              Excel、PowerPoint 和周期性监控的自动化。执行导向型终端、纯 SEO 或社交聆听产品，以及独立专家访谈服务不在边界内，除非它们属于同一研究工作流。现状替代方案仍然重要：买方可以组合通用
              AI、既有终端、新闻数据库、内部搜索和分析师手工工作。这一定义避免把每一笔分析或生成式 AI 支出都算作 AlphaSense 可触达的市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
      - number: '2.2'
        title: 市场规模视角与未解的 SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              独立估算只能提供方向性规模，不能组成干净的 TAM/SAM/SOM 链条。Sacra 估算 AlphaSense 的核心金融和市场情报市场为 $13 billion annually，并认为商业智能和分析领域还有
              $15 billion-plus 的相邻市场，但保留文本没有给出自下而上的方法。IntuitionLabs 引用另一项行业预测，称市场规模将从 2025 年的 $12.38 billion 扩大到 2033 年的
              $28.96 billion，CAGR 为 11.2%；其类别边界也未被复现。AlphaSense 披露的 2026 年第二季度 ARR 超过 $700
              million，只能作为公司规模代理指标。它不是市场收入，用它除以任何宽泛估算都会制造虚假的可比性。地理范围、符合条件的买方数量、席位密度、支付意愿和可实现渗透率仍未披露。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              用户群覆盖金融服务分析师、企业战略与业务发展团队以及专业服务研究人员。Sacra 描述投资分析师、投资组合经理和对冲基金分析师是最初的核心用户，而 AlphaSense
              现在也将平台定位给企业和咨询公司。实际采用路径是先落地再扩张：研究密集型团队先购买更快的发现与综合能力，随后更广泛的部署加入内部内容、监控、结构化数据和工作流输出。Sacra 估算的年度席位价格为
              $10,000-$20,000，典型企业交易为 $50,000-$100,000-plus，这说明预算归属更可能在部门或企业，而不是个人自助购买。不过，公开证据没有确认审批门槛、实施成本、回本周期或续约
              cohort。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM016
      - number: '2.4'
        title: 增长驱动、采用约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              非结构化商业数据不断增加，企业对 AI
              辅助分析的需求上升，推动市场增长；但采用不仅取决于速度，也取决于信任。在受监管或高风险工作流中，买方需要来源授权、最新证据、可追溯性、权限控制和可重建的输出。因此，AlphaSense
              的授权内容既能形成差异化，也会让产品依赖第三方授权条款和成本。Sacra 还警告，AlphaSense 可能仍只是既有金融数据平台的补充工具；如果既有平台补上 AI
              搜索缺口，它在预算审查中就会变得脆弱。对估值而言，最强证据是公司规模和品类增长；最弱环节是从宽泛 TAM 到可服务买方、持久留存和可实现份额的桥接。这些缺口意味着，任何只基于 headline
              市场规模的判断都应打折。
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把 headline TAM 资本化
            body: 宽泛的品类预测和相邻市场估算不能证明 AlphaSense 的可服务市场或可实现份额。估值应把已观察到的 ARR 和客户规模，与仍未验证的 SAM/SOM 桥接分开。
            calloutType: risk
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              买方可以通过几条不同路径解决研究任务。AlphaSense 作为一体化市场情报平台直接竞争；Bloomberg 以及 FactSet、S&P Capital IQ
              等结构化数据既有厂商，在实时市场数据、消息、筛选和量化工作流上仍有优势。Factiva 是相邻的新闻聚合选项；通用 AI
              正快速成为基础搜索和摘要的替代方案；内部知识库加手工网络研究仍是现状。这些替代方案并不等价。指定证据将 Bloomberg 描述为交易和公开市场数据最强，AlphaSense
              擅长授权定性内容和带引用的综合，内部自建则更可控但更碎片化。公开证据没有证明每个替代方案的可比规模或融资，因此相关单元保留为未知，而不是自行估算。
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP010
              - CP013
              - CP014
              - CP016
      - number: '3.2'
        title: 能力、分发与信任姿态
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 的防御性组合不只是文档搜索引擎。公司材料称其拥有超过 5 亿份文档的资料库、券商研究、专家访谈记录、结构化财务数据、带引用的生成式回答、工作流代理，以及连接内部系统的连接器。公司还声称拥有
              SOC 2 Type II 和 ISO/IEC 27001 认证、权限镜像以及客户自管密钥或存储桶等企业安全控制。一份引用 2026 年 Forrester 评估的公司新闻稿称，AlphaSense 在 29
              项标准中的 14 项取得最高分，但该新闻稿不是底层报告的独立副本。公司页面称其 2026 年至少有 7,800 家客户，说明分发能力可观，但证据没有披露替代方案的可比客户数。
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
              - CP010
              - CP014
      - number: '3.3'
        title: 定价、打包与切换经济性
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 采用年度、定制报价的订阅模式，而非公开价目表。独立来源提供了不应混在一起的不同定价视角：一份评测引用英国一份年化 £81,900 的公开合同，以及 38 笔由 Vendr 撮合购买的
              $17,500 中位数；Sacra 则估算每席位 $10,000-$20,000，平均企业交易规模为 $50,000-$100,000-plus。这些数字的分母、货币和方法不同，不是已实现价格的同类比较。打包还把
              Expert Calls 和 Canalyst 模型单独计费。年度承诺、上线、内部内容摄取、连接器、权限和周期性工作流自动化都可能提高切换摩擦，但证据没有量化续约率、迁移成本或合同锁定。若 Bloomberg 或
              FactSet 提供 AlphaSense 无法替代的实时或结构化数据，多头并用仍然合理。
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP012
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP015
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              护城河建立在授权及供应商拥有的内容、专有专家访谈、大型索引语料库、领域检索和融入周期性交付物的集成之上。与复现通用搜索或摘要相比，这些资产更难直接复制。同一结构也带来依赖：Sacra
              将内容授权列为重大风险，若供应商改变条款、提高费用或终止访问，风险会显现。通用 AI 可能让基础综合能力商品化，既有厂商也可以加入文档 AI，同时保住安装基础和数据优势。AlphaSense
              的应对是进一步进入代理、PowerPoint、Excel、内部知识和专家工作流。扩展能提高工作流粘性，但不能证明留存持久。因此，投资判断是：当前产品护城河强，但合同持久性尚未量化，功能趋同风险可信。
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP010
              - CP014
              - CP016
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 护城河是内容加工作流，不只是搜索
            body: AlphaSense 把授权内容、专有专家材料、内部数据连接器、带引用的综合和周期性代理组合起来。这个组合比任何单一 AI 功能都更难替代，但持久性仍取决于内容权利和客户留存。
            calloutType: strength
            claimRefs:
              - CP001
              - CP011
              - CP016
          - type: callout
            title: 功能趋同会维持多工具并用压力
            body: Bloomberg 和结构化数据既有厂商可以加入 AI，通用模型也在提升综合能力。客户可能继续为多套工具付费，但如果 AlphaSense 无法证明增量工作流价值，它就可能只是可裁剪的可选层。
            calloutType: risk
            claimRefs:
              - CP005
              - CP010
