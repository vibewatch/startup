        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              AlphaSense 由 Jack Kokko 和 Raj Neervannan 于 2011 年创立，公司目前仍将两人分别列为 CEO 和 CTO。产品定位为 AI 市场情报与工作流平台，把领域软件和 500
              million 份优质商业文档接到一起。Sacra 描述了年度订阅模式，并估算每席位定价为
              $10,000-$20,000，但这只是第三方分析，不是公开价目表。近期私募融资支持其属于后期私有公司的判断，但不能据此确定 IPO 时间表。现有证据无法可靠确认当前总部地址，因此该字段保持开放，不根据新闻稿
              dateline 推断。
