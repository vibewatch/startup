      - CE010
      - CE011
      - CE016
  - id: FU001
    title: 有证据支持的客户采用与扩张旅程
    type: journey-map
    summary: 这是从首次研究使用到更广泛企业部署的概念路径；顺序不代表经过测量的转化率。
    data:
      items:
        - label: 初始企业采购
          detail: 以年度订阅进入，价格和交易规模随席位数量与套餐而变化。
          touchpoints:
            - 研究负责人
            - 采购
            - 安全审查
        - label: 外部内容研究
          detail: 用户搜索优质文档、申报文件、转录、新闻和金融数据。
          touchpoints:
            - 分析师工作流
            - 市场监测
            - 尽调
        - label: AI 辅助使用
          detail: Generative Search、Grid 及相关工作流增加可重复的 AI 研究活动。
          touchpoints:
            - 自然语言查询
            - 带引用的综合
            - 工作流智能体
        - label: 嵌入团队工作流
          detail: 已点名的应用涵盖竞争情报、战略、投资研究和尽职调查。
          touchpoints:
            - 共享研究
            - 提醒
            - 决策支持
        - label: 内部内容集成
          detail: Enterprise Intelligence 将专有内部内容与外部市场情报结合起来。
          touchpoints:
            - 连接器
            - 有权限控制的知识
            - 跨来源搜索
        - label: 企业扩张
          detail: Sacra 估计每客户 ARR 上升，AlphaSense 则报告 Enterprise Intelligence 交易快速增长。
          touchpoints:
            - 更多席位
            - 更多内容
            - 更多工作流
