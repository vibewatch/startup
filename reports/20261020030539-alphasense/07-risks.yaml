  evidenceGaps:
    - type: missing-source
      severity: material
      topic: adverse-records
      missingEvidence: Current regulator, court, breach-notification, status-page, and outage records tied to AlphaSense.
      whyItMatters: Public silence in the assigned pool cannot establish the absence, severity, or remediation of legal and operational incidents.
      diligencePath: Search primary regulator and court databases, review the status-page history, and obtain management's litigation and incident schedules.
      relatedQuestionRefs: [QR004, QR009]
      relatedTableRefs: [TR001]
    - type: private-evidence-only
      severity: material
      topic: security
      missingEvidence: Current SOC reports, penetration-test results, subprocessor inventory, permissioning exceptions, and customer control-test outcomes.
      whyItMatters: Company-described security architecture does not establish operating effectiveness or the frequency of access-control failures.
      diligencePath: Review reports under NDA and independently test role inheritance, revocation, cross-tenant isolation, logging, and incident response.
      relatedQuestionRefs: [QR006, QR009]
      relatedTableRefs: [TR001, TR002]
    - type: private-evidence-only
      severity: material
      topic: content-licensing
      missingEvidence: Top content-provider concentration, renewal calendar, pricing escalators, termination rights, indemnities, and active rights disputes.
      whyItMatters: Loss or repricing of differentiated content could weaken product quality, differentiation, and gross margin.
      diligencePath: Inspect the top provider contracts and quantify revenue, usage, and gross-margin sensitivity to each major content relationship.
      relatedQuestionRefs: [QR005, QR010]
      relatedTableRefs: [TR001, TR003]
    - type: private-evidence-only
      severity: material
      topic: financial-opacity
      missingEvidence: Audited profitability, gross margin after content and inference costs, cash burn, cash balance, debt, and runway.
      whyItMatters: Customer and usage scale do not establish sustainable unit economics or sufficient financing capacity.
      diligencePath: Obtain audited statements, monthly cash bridge, unit-cost cohorts, budget-to-actual results, and downside runway scenarios.
      relatedQuestionRefs: [QR010]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: retention-opacity
      missingEvidence: NRR, GRR, logo churn, cohort expansion, top-customer concentration, contract duration, and renewal concessions.
      whyItMatters: The durability and concentration of subscription economics cannot be inferred from total customer scale.
      diligencePath: Review monthly cohort curves and the top-customer schedule, then reconcile renewals, concessions, usage, and product adoption.
      relatedQuestionRefs: [QR010]
      relatedTableRefs: [TR003]
    - type: private-evidence-only
      severity: material
      topic: reliability
      missingEvidence: Historical uptime, severity-one incidents, RTO/RPO results, citation-error rates, model-routing concentration, and failover test results.
      whyItMatters: AWS and external-model dependencies are disclosed, but their actual reliability and concentration cannot be quantified.
      diligencePath: Obtain SLA reports, incident postmortems, disaster-recovery tests, model routing by volume, and benchmarked citation-integrity results.
      relatedQuestionRefs: [QR004, QR005, QR007, QR009]
      relatedTableRefs: [TR002, TR003]
