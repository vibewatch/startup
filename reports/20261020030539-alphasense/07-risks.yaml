    title: "Risk heatmap: residual exposure by likelihood, impact, and mitigation maturity"
    type: matrix
    summary: >-
      Ordinal assessments emphasize evidence gaps and dependency consequences; they do
      not represent measured incident probabilities.
    data:
      columns:
        - label: Likelihood
          detail: Based on assigned evidence, not a historical incident rate.
        - label: Impact
          detail: Consequence if the failure mode occurs.
        - label: Mitigation maturity
          detail: Publicly disclosed design versus independently verified operation.
        - label: Residual severity
          detail: Diligence priority after disclosed mitigations.
      rows:
        - label: AI output quality
          note: Agent scale is disclosed; independent quality statistics are not.
          values:
            - label: Unknown
              tone: warning
            - label: High
              tone: critical
            - label: Designed
              tone: neutral
            - label: High
              tone: critical
        - label: Content licensing / IP
          note: Contract concentration and renewal protections are undisclosed.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Partial
              tone: warning
            - label: High
              tone: critical
        - label: Cloud / model dependency
          note: AWS and external LLM reliance are disclosed without concentration data.
          values:
            - label: Medium
              tone: warning
            - label: High
              tone: critical
            - label: Designed
              tone: neutral
            - label: Medium-high
              tone: warning
        - label: Privacy / permissioning
          note: Company-described controls are substantial but not independently tested here.
          values:
            - label: Unknown
              tone: warning
            - label: High
              tone: critical
            - label: Designed
              tone: neutral
            - label: Medium-high
              tone: warning
        - label: Contract / pricing friction
          note: Signal comes from competitor or adjacent-vendor reviews.
          values:
            - label: Medium
              tone: warning
            - label: Medium
              tone: warning
            - label: Unclear
              tone: neutral
            - label: Medium
              tone: warning
        - label: Financial / retention opacity
          note: Profitability, cash durability, retention, and concentration are not disclosed.
          values:
            - label: Unknown
              tone: warning
            - label: High
              tone: critical
            - label: Undisclosed
              tone: warning
            - label: High
              tone: critical
    approximationNotes: >-
      Qualitative likelihood, impact, and mitigation bands are analyst judgments tied
      to retained claims; no numeric probability, loss estimate, or incident frequency
      is implied.
    claimRefs: [CR002, CR005, CR006, CR007, CR008, CR009, CR010, CR011, CR012, CR013, CR015]
callouts:
  - calloutType: risk
    title: Evidence-bound conclusion
    body: >-
      No retained regulator, court, breach, or outage record was assigned to this
      chapter. That evidence gap prevents a clean-history conclusion and requires
      primary-record and management diligence before underwriting incident risk.
    claimRefs: [CR014]
  - calloutType: recommendation
    title: Thesis-break triggers
    body: >-
      Reassess the investment if AlphaSense loses material licensed content, cannot
      demonstrate repeatable citation and permission integrity, misses contractual
      availability objectives, or shows weakening renewals alongside worsening
      content and inference economics.
    claimRefs: [CR005, CR006, CR007, CR010, CR011, CR012, CR013]
