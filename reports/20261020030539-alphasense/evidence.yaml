evidenceGaps:
  - type: missing-source
    severity: material
    topic: company-profile
    missingEvidence: Current headquarters, employee count, and complete operating-location roster.
    whyItMatters: These facts are needed to assess organizational scale, geographic concentration, and operating footprint.
    diligencePath: >-
      Request a current organization chart and office roster, then verify the headquarters through corporate
      registration records.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: >-
      Revenue, gross margin, profitability, cash burn, cash balance, runway, gross retention, net retention, and
      customer concentration.
    whyItMatters: ARR and funding alone cannot establish cash generation, capital efficiency, or revenue durability.
    diligencePath: Obtain audited financial statements, monthly cash reports, customer cohorts, and a revenue-to-ARR reconciliation.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-stakeholder-tables
    missingEvidence: Complete executive roster, board membership, ownership, voting rights, preference stack, and investor list.
    whyItMatters: The partial public roster cannot establish succession depth, governance control, or dilution exposure.
    diligencePath: Obtain the current cap table, charter, voting agreements, board minutes, and complete management roster.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-size
    missingEvidence: >-
      A bottom-up SAM/SOM model with eligible account counts, seat density, realized pricing, geographic scope, product
      eligibility, and attainable penetration.
    whyItMatters: >-
      Broad category estimates cannot support a company-specific revenue ceiling or market-share calculation without a
      comparable denominator.
    diligencePath: >-
      Obtain management's market model and cohort-level bookings by segment and geography, then reconcile it against
      independently sourced account and seat populations.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: customer-scale
    missingEvidence: >-
      A dated disclosure reconciling the August 2026 figure of 7,800 customers with the undated current product-page
      claim of more than 8,000 enterprise customers.
    whyItMatters: >-
      The direction is consistent with growth, but the undated page cannot establish the timing or exact magnitude of
      net customer additions.
    diligencePath: Request the quarter-end customer series, customer definition, and gross and net adds through the run date.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Independent procurement data on budget ownership, implementation cost, payback period, switching cost, renewal
      rate, and deployment duration by customer segment.
    whyItMatters: Price points alone do not show adoption friction, return on investment, or retention durability.
    diligencePath: >-
      Review anonymized contracts and renewal cohorts, interview buyers in each segment, and benchmark total cost
      against incumbent-tool displacement.
  - type: private-evidence-only
    severity: material
    topic: retention-and-switching
    missingEvidence: >-
      Gross retention, net retention, cohort expansion, renewal pricing, and measured migration cost by customer
      segment.
    whyItMatters: >-
      These metrics determine whether workflow integration creates durable economic lock-in rather than only
      implementation friction.
    diligencePath: >-
      Request anonymized cohort retention, renewal uplift, seat expansion, and churn-reason data from management and
      validate selected records with customers.
    relatedQuestionRefs:
      - QP006
      - QP010
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: content-dependency
    missingEvidence: >-
      Contract duration, exclusivity, renewal economics, concentration, and termination rights for major broker, news,
      and expert-content licenses.
    whyItMatters: >-
      The content corpus is central to differentiation, but adverse supplier changes could weaken coverage or compress
      margins.
    diligencePath: >-
      Review the top content contracts, supplier concentration schedule, renewal calendar, and recent pricing changes
      under NDA.
    relatedQuestionRefs:
      - QP007
      - QP010
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-scale
    missingEvidence: >-
      Comparable current revenue, customer, funding, and product-adoption measures for each private or divisional
      competitor.
    whyItMatters: >-
      Without common denominators, the profile table cannot rank distribution power or investment capacity across every
      alternative.
    diligencePath: >-
      Build a dated comp sheet from competitor filings, procurement records, and management diligence after normalizing
      product scope.
    relatedQuestionRefs:
      - QP002
      - QP010
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited revenue, gross margin and COGS detail, gross and net retention, cohorts, CAC, commissions, and payback.
    whyItMatters: >-
      These inputs determine revenue durability, sales efficiency, and whether content and AI delivery scale
      economically.
    diligencePath: >-
      Request audited financials, ARR policy and bridge, cohort exports, sales-capacity metrics, and gross-margin
      schedules by product and content package.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, debt, monthly burn, working-capital needs, acquisition and content commitments, preference terms,
      runway, and next-round trigger.
    whyItMatters: A financing amount does not establish cash available or the duration of the operating plan.
    diligencePath: >-
      Request the current balance sheet, debt and preference schedules, monthly cash-flow forecast, use-of-funds plan,
      and board-approved financing scenarios.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: minor
    topic: customer-count
    missingEvidence: A dated, consistently defined current customer count reconciling the 7,800 and 8,000+ company disclosures.
    whyItMatters: The denominator affects ARR-per-customer and expansion analysis.
    diligencePath: Request quarterly active-customer counts with definitions, acquisitions, churn, and segment splits.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-controls
    missingEvidence: >-
      Independent audit reports, certification scopes, penetration-test summaries, and evidence that documented controls
      operate effectively.
    whyItMatters: >-
      Company-issued security descriptions do not independently establish control effectiveness for regulated customer
      data.
    diligencePath: >-
      Review SOC 2 and ISO scope documents under NDA, inspect recent penetration-test remediation, and interview the
      security owner.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Historical uptime, severity-one incidents, recovery performance, connector synchronization failures, and customer
      support service levels.
    whyItMatters: >-
      Research and monitoring workflows can become operationally critical, while the assigned pool contains no
      reliability record.
    diligencePath: >-
      Request status-page exports, incident postmortems, SLA attainment, connector error rates, and reference calls with
      administrators.
    relatedQuestionRefs:
      - QE004
      - QE006
  - type: private-evidence-only
    severity: material
    topic: ai-quality
    missingEvidence: >-
      Task-level precision, recall, citation correctness, hallucination rates, latency distributions, and model-change
      evaluation results.
    whyItMatters: Citations improve auditability but do not establish completeness or correctness of generated analysis.
    diligencePath: >-
      Run a blinded benchmark on representative licensed and internal documents and review AlphaSense's evaluation and
      release-governance process.
    relatedQuestionRefs:
      - QE005
      - QE006
  - type: missing-source
    severity: minor
    topic: technical-architecture
    missingEvidence: >-
      Low-level architecture for model routing, retrieval ranking, tenant isolation, data residency, and scaling
      behavior.
    whyItMatters: >-
      The public functional architecture is sufficient to understand the product, but not to underwrite performance or
      concentration risk.
    diligencePath: >-
      Conduct a technical architecture review with engineering leadership and obtain current system, data-flow, and
      dependency diagrams.
    relatedQuestionRefs:
      - QE003
      - QE008
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: NRR, GRR, logo and revenue churn, renewal rates, contract duration, and cohort expansion by segment.
    whyItMatters: Customer growth and ARR do not establish renewal quality or durable net expansion.
    diligencePath: >-
      Request board-ready cohort tables, renewal schedules, churn bridges, and NRR and GRR definitions for at least the
      last eight quarters.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-ten, segment, geography, channel, and product-bundle shares of ARR.
    whyItMatters: Broad logo coverage can coexist with material revenue concentration and procurement exposure.
    diligencePath: >-
      Obtain anonymized ARR concentration tables, contract renewal dates, and sensitivity to loss of the largest
      customers and content partners.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: >-
      A complete customer-reference inventory with deployment stage, seat count, go-live date, measured outcome, and
      renewal status.
    whyItMatters: Vendor-selected stories prove use cases but cannot establish production depth or representative outcomes.
    diligencePath: >-
      Sample reference calls across financial services, corporate, and professional-services cohorts and reconcile them
      to CRM and billing records.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: minor
    topic: enterprise-penetration
    missingEvidence: A dated, internally reconciled denominator and customer list supporting the 88% versus 92% S&P 100 claims.
    whyItMatters: The same-date company release appears with two different penetration figures, weakening precision.
    diligencePath: >-
      Request the dated S&P 100 account roster, customer-status definition, and release revision history from
      management.
    relatedQuestionRefs:
      - QU010
  - type: missing-source
    severity: material
    topic: adverse-records
