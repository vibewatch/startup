schemaVersion: "report-v2"
artifact: competitors
slug: alphasense
runDate: 2026-10-20
company:
  name: AlphaSense
chapter:
  number: 3
  title: Competitors
  summary: >-
    AlphaSense is differentiated by the combination of licensed business content, cited AI
    synthesis, internal-content connectors, and workflow agents rather than by search alone.
    Its principal competitive pressure comes from entrenched data terminals, structured-data
    incumbents, general-purpose AI, and internal/manual workflows; opaque pricing, onboarding
    effort, and dependence on licensed content weaken the durability of the advantage.
sections:
  - id: competitive-landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      Buyers can solve the research job through several distinct routes. AlphaSense competes
      directly as an integrated market-intelligence platform, while Bloomberg and structured-data
      incumbents such as FactSet and S&P Capital IQ retain advantages in live market data,
      messaging, screening, and quantitative workflows. Factiva is an adjacent news-aggregation
      option; general-purpose AI is a rapidly improving substitute for basic search and
      summarization; and internal repositories plus manual web research remain the status quo.
      These alternatives are not interchangeable. The assigned evidence portrays Bloomberg as
      strongest for trading and public-market data, AlphaSense as strongest for licensed
      qualitative content and cited synthesis, and internal build as more controllable but
      fragmented. Public evidence does not establish comparable scale or funding for every
      alternative, so those cells remain unknown rather than estimated.
    claimRefs: [CP005, CP006, CP010, CP013, CP014]
    tableRefs: [TP001]
  - id: capability-and-trust
    title: Capability, distribution, and trust posture
    body: >-
      AlphaSense's defensible bundle is broader than a document search engine. Company materials
      describe a 500-million-plus-document library, broker research, expert transcripts,
      structured financial data, cited generative answers, workflow agents, and connectors for
      internal systems. The company also claims enterprise security controls including SOC 2
      Type II and ISO/IEC 27001 certification, permission mirroring, and customer-managed key or
      bucket options. A company-issued release quoting the 2026 Forrester evaluation says
      AlphaSense received the highest possible score in 14 of 29 criteria, but the release is not
      an independent copy of the underlying report. Company-issued pages report at least 7,800
      customers in 2026, indicating meaningful distribution, while the evidence does not disclose
      comparable customer counts for the alternatives.
    claimRefs: [CP001, CP002, CP004, CP009]
    tableRefs: [TP002]
  - id: pricing-and-switching
    title: Pricing, packaging, and switching economics
    body: >-
      AlphaSense uses annual, custom-quoted subscriptions rather than a public rate card.
      Independent sources provide different pricing lenses that should not be collapsed: one
      review cites a £81,900 annualized UK public contract and a $17,500 median across 38
      Vendr-brokered purchases, while Sacra estimates $10,000-$20,000 per seat and
      $50,000-$100,000-plus average enterprise deal sizes. Those figures have different
      denominators, currencies, and methodologies and are not realized-price equivalents.
      Packaging adds Expert Calls and Canalyst models separately. Annual commitments, onboarding,
      internal-content ingestion, connectors, permissions, and recurring workflow automation can
      increase switching friction, but the evidence does not quantify renewal rates, migration
      costs, or contractual lock-in. Multi-homing remains rational where Bloomberg or FactSet
      supplies live or structured data that AlphaSense does not replace.
    claimRefs: [CP003, CP007, CP008, CP012, CP013, CP015]
    tableRefs: [TP003]
  - id: moat-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The moat rests on licensed and vendor-owned content, proprietary expert interviews, a large
      indexed corpus, domain-specific retrieval, and integration into recurring deliverables.
      These assets make a direct replica harder than reproducing generic search or summarization.
      The same structure creates a dependency: Sacra identifies content licensing as a material
      risk if providers change terms, raise fees, or terminate access. General-purpose AI can
      commoditize basic synthesis, and incumbents can add document AI while preserving their
      installed bases and data advantages. AlphaSense's response is to move further into agents,
      PowerPoint, Excel, internal knowledge, and expert workflows. This broadening improves
      workflow attachment but is not proof of durable retention. The underwriting conclusion is
      therefore a strong current product moat with unquantified contractual durability and a
      credible risk of feature convergence.
    claimRefs: [CP010, CP011, CP012, CP016]
    figureRefs: [FP001]
