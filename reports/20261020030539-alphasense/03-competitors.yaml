  - id: TP002
    title: Capability and trust matrix
    columns:
      - Buying criterion
      - AlphaSense
      - Bloomberg
      - FactSet / Capital IQ
      - General AI / internal build
    rows:
      - ["Licensed broker and expert content", "Strong: broker research and proprietary expert transcripts", "Partial: broker research and GLG transcripts are described in a company-authored comparison", "Unknown from assigned evidence", "General AI lacks the licensed corpus; internal access varies"]
      - ["Real-time market data", "Not presented as the core advantage", "Strong: live multi-asset market data", "Strong structured and quantitative orientation", "Unknown or dependent on external feeds"]
      - ["Cited unstructured synthesis", "Strong company claim; citation-linked search and agents", "Emerging ASKB document capabilities in company-authored comparison", "Review evidence describes weaker document discovery", "General AI capability is improving, but premium-source access is absent"]
      - ["Structured financial analysis", "Financial data and Canalyst models included or packaged", "Strong analytics and modeling", "Strong screening and quantitative analysis", "Internal build varies; public AI evidence is insufficient"]
      - ["Internal-content integration", "Connectors for 20+ systems plus permissions", "Unknown from assigned evidence", "Unknown from assigned evidence", "Internal build can access firm data; controls and breadth vary"]
      - ["Expert workflows", "Expert transcripts, calls, and AI-led interviews", "GLG transcripts described via ASKB; no live calls in company-authored comparison", "Unknown from assigned evidence", "No bundled expert network established"]
      - ["Security and auditability", "Company claims SOC 2 Type II, ISO 27001, citations, BYOK/BYOB, and permission mirroring", "Unknown from assigned evidence", "Unknown from assigned evidence", "Implementation-specific and not established"]
    notes: >-
      Strong, partial, and unknown are qualitative evidence labels, not benchmark scores. Bloomberg
      comparisons come from AlphaSense-authored material and are retained as vendor positioning;
      unsupported competitor cells remain unknown.
    claimRefs: [CP001, CP004, CP005, CP006, CP010, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Product or lens
      - Price or contract model
      - Included or separate capabilities
      - Evidence qualification
      - Buyer implication
    rows:
      - [AlphaSense subscription, "Annual, custom quote; no public list price", "Market Intelligence and Enterprise Intelligence tiers", "SpendHound and independent review; realized pricing remains private", "Requires a sales process and scope negotiation"]
      - [AlphaSense observed buyer data, "£81,900 annualized UK public contract; $17,500 Vendr median across 38 purchases", "Contract scope varies", "Third-party review; currencies, seats, vintages, and purchase scopes differ", "Useful anchors, not a universal per-seat price"]
      - [AlphaSense estimated range, "$10,000-$20,000 per seat; $50,000-$100,000+ average enterprise deal", "Annual subscription", "Sacra estimates, not company list prices or buyer contracts", "Treat as directional negotiation context only"]
      - [Bloomberg Terminal, "$27,660-$31,980 annual figures across assigned third-party and vendor-comparison sources", "Terminal bundles market data, analytics, news, and messaging", "Sources differ and package or vintage is not reconciled", "Premium incumbent benchmark, not directly comparable scope"]
      - [FactSet / Factiva, "FactSet $12,000 entry floor in one review; Factiva about $5,000 in Sacra", "Modular structured data or news aggregation", "Third-party figures only; scope and add-ons vary", "Lower entry points may fit narrower jobs"]
      - ["General AI / internal build", "Unknown and not comparable", "Public AI or firm-specific tooling", "No total-cost benchmark in assigned evidence", "Lower license cost may trade off against content, controls, and labor"]
    notes: >-
      All figures are annual or total-contract-value references exactly as labeled; they are not
      normalized across seats, currencies, packages, dates, discounts, or content rights. No
      realized AlphaSense price distribution or renewal pricing was publicly verified.
    claimRefs: [CP003, CP007, CP015]
figures:
  - id: FP001
    title: Evidence-constrained competitive positioning
    type: quadrant
    summary: >-
      An ordinal view of workflow breadth and curated business-content depth, showing why
      AlphaSense can coexist with data terminals and low-friction substitutes.
    data:
      xAxis:
        label: "Workflow breadth: narrow (1) to end-to-end (5)"
        min: 1
        max: 5
      yAxis:
        label: "Curated business-content depth: public-only (1) to proprietary (5)"
        min: 1
        max: 5
      points:
        - label: AlphaSense
          x: 5
          y: 5
          detail: "Licensed content, internal data, agents, models, and deliverable integrations"
        - label: Bloomberg
          x: 4
          y: 4
          detail: "Broad public-market data and workflow; less private-market and agentic depth in the assigned comparison"
        - label: FactSet / Capital IQ
          x: 3
          y: 4
          detail: "Deep structured and quantitative workflows; document synthesis is less differentiated"
        - label: Factiva
          x: 2
          y: 3
          detail: "Broad news aggregation with narrower AI and workflow scope"
        - label: General-purpose AI
          x: 3
          y: 1
          detail: "Broad synthesis interface without AlphaSense's licensed premium content"
        - label: Internal build / manual
          x: 2
          y: 2
          detail: "Firm-specific control but fragmented external content and manual integration"
    approximationNotes: >-
      Scores are analyst-authored ordinal positions from 1 to 5, not measured market benchmarks.
      They encode the cited qualitative evidence only; a one-point difference is not a quantified
      performance gap, and unknown competitor capabilities were scored conservatively.
    claimRefs: [CP001, CP005, CP006, CP010, CP014, CP016]
callouts:
  - calloutType: strength
    title: The moat is content-plus-workflow, not search alone
    body: >-
      AlphaSense combines licensed content, proprietary expert material, internal-data connectors,
      cited synthesis, and recurring agents. This bundle is harder to replace than any single AI
      feature, although its durability still depends on content rights and customer retention.
    claimRefs: [CP001, CP011, CP016]
  - calloutType: risk
    title: Feature convergence preserves multi-homing pressure
    body: >-
      Bloomberg and structured-data incumbents can add AI while general-purpose models improve
      synthesis. Customers may continue paying for multiple tools, but AlphaSense can be the
      discretionary layer if its incremental workflow value is not demonstrated.
    claimRefs: [CP005, CP010, CP013]
