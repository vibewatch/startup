- id: milestones-and-reset
  title: Milestones, strategic reset, and current state
  body: 'Fabric’s milestone path breaks into three phases. The first phase was technical proof: the 2018 Tel Aviv
    launch and the ability to fit automation into small urban footprints. The second phase was expansion and validation:
    the 2020 FreshDirect launch, 2021 Walmart and Instacart announcements, and the 2021 unicorn financing. The third
    phase was retrenchment and repositioning. CTech’s April 2024 report indicates Fabric had already cut 150 jobs
    in July 2022 and planned another 30-person reduction in 2024, while also moving from a full-stack robotic warehouse
    sales model toward selling technology and software. That could be read as distress, but not necessarily terminal
    distress. Fabric’s 2024 Save A Lot and Uber launch and its 2025 Orchestra release show the company was still
    shipping product and still trying to translate robotics into a more software-defined operating model. The core
    diligence question is therefore not whether Fabric still exists; it clearly does. The question is whether the
    reset improved capital efficiency and commercial viability enough to justify a stale unicorn valuation benchmark.'
