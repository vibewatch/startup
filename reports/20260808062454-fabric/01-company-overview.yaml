company:
  name: Fabric
chapter:
  number: 1
  title: Company Overview
  summary: 'Fabric is an Israeli-founded robotic micro-fulfillment company that began as CommonSense Robotics in
    2015, launched a 6,000-square-foot Tel Aviv micro-fulfillment center in 2018, and reached unicorn status in
    October 2021 with a $200 million Series C at a valuation above $1 billion. Public evidence shows a later strategic
    reset: by April 2024 the company had completed large layoffs, shifted away from selling full robotic warehouses
    toward technology and software, and disclosed new co-CEO leadership. Despite that reset, 2024-2025 sources show
    ongoing operations through the Save A Lot and Uber Brooklyn launch and the 2025 Orchestra software launch. Public
    metrics remain incomplete on current revenue, board governance, and current headcount.'
sections:
- id: identity-and-footprint
  title: Identity, headquarters, and operating model
  body: 'Fabric, formerly CommonSense Robotics, was founded in 2015 to make dense urban fulfillment economically
    viable for grocery and other retail categories. The company’s public identity is slightly bifurcated: Craft
    currently lists the headquarters in Tel Aviv-Yafo, while Fabric’s 2021 unicorn financing release emphasized
    offices in New York City, Tel Aviv, and Atlanta and described active operations in New York City, Washington,
    D.C., and Tel Aviv. Taken together, the evidence supports an Israeli-founded company with an operating footprint
    spanning Israel and the United States rather than a purely single-jurisdiction profile. The product proposition
    has also become broader over time. Fabric’s current home page positions the business as purpose-designed for
    grocery, with tri-temperature automation, order consolidation, urban deployment flexibility, and multiple fulfillment
    form factors ranging from larger centralized facilities to compact Micro Fulfillment Centers, Nano Express modules,
    and Quick-Pick stations. This operating model matters for diligence because it shows Fabric is not selling a
    single warehouse box; it is marketing a family of hardware-software systems that can fit different retail real-estate
    and service models.'
