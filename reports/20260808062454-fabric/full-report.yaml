      - number: '1.2'
        title: Founders, leadership transition, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Fabric’s founding bench is clearer than its current governance structure. Early and later reporting
              identifies Ori Avraham, Eyal Goren, Elram Goren, and Shay Cohen as founders, with Elram Goren serving as
              the externally visible CEO and co-founder in 2018 and 2021 sources. The latest public leadership signal
              located in this run is less straightforward: CTech reported in April 2024 that Avi (Jack) Jacoby had taken
              over the CEO role in 2022 and that Curt Avallone had been appointed co-CEO only weeks before the layoff
              announcement. Fabric’s 2025 Orchestra release still names co-founder Ori Avraham as vice president of
              product, showing at least some founder continuity in the executive team. What remains notably absent is
              equivalent public disclosure on the board, formal governance, or ownership control. That gap matters
              because the company went through major layoffs and a strategy reset after its unicorn round, yet outside
              observers have little direct visibility into who now governs capital allocation, product direction, or
              turnaround accountability.
