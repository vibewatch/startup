      - number: '2.3'
        title: Buyers, users, and the operational problems being purchased away
        blocks:
          - type: paragraph
            body: >-
              The budget owner is usually a retailer, grocer, or wholesale/distribution operator, but the user and pain
              points vary by workflow. Large grocery distributors such as Pattison Food Group buy automation to improve
              store-replenishment throughput and split-case handling across thousands of SKUs. Urban MFC buyers use a
              different logic: they are buying order density, speed, and service quality inside constrained real estate.
              Grocery automation also has to reconcile multiple modes at once—store replenishment, curbside, and
              same-day or next-day delivery—so the buyer is often trying to compress several workflows into a single
              operating backbone. Public competitor evidence suggests the market is not choosing between ‘software’ and
              ‘hardware’ so much as between different full-stack combinations of storage density, throughput,
              orchestration quality, and integration burden. That is why the buyer map for Fabric includes grocers,
              digital retailers, and operators that want staged deployment rather than a single regional mega-project.
            claimRefs:
