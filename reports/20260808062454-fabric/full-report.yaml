      - number: '1.3'
        title: Funding history, investor base, and customer validation
        blocks:
          - type: paragraph
            body: >-
              The capital story is the clearest part of Fabric’s public profile. CommonSense Robotics raised a $20
              million Series A in early 2018 after an earlier $6 million seed phase, then closed a $200 million Series C
              in October 2021 led by Temasek and a large syndicate that included Koch Disruptive Technologies, CPP
              Investments, and others. That round established the company at a valuation above $1 billion and publicly
              marked Fabric as a robotics fulfillment unicorn. Public sources diverge, however, on total capital raised:
              the 2021 official release cited $336 million to date, while 2024 and 2025 sources cite $375 million.
              Customer and partner proof is stronger than public financial disclosure. Fabric appears in strategic
              fulfillment announcements with Instacart, Walmart, FreshDirect, and later Save A Lot and Uber. The
              customer evidence spans pilots, retailer deployments, and partner-led workflows, which is more meaningful
              than undifferentiated logo slides. Even so, there is still no public revenue, ARR, or margin disclosure to
              show how much of this relationship map translated into durable, scaled economics.
