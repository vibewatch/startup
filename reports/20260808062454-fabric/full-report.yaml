  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, privacy, and regulatory risk
        blocks:
          - type: paragraph
            body: >-
              The public record gives enough information to identify real compliance exposure, but not enough to close
              it. Fabric’s privacy policy shows that the company does collect and process identifiable and behavioral
              data at least on its public website, while its legal terms require arbitration and limit remedies. Those
              facts do not prove a problem by themselves, but they show that legal and privacy governance is not
              hypothetical. Because Fabric operates in grocery and warehouse environments, OSHA safety obligations and
              FDA/FSMA food-handling expectations also matter. The problem is evidentiary depth: the source set does not
              surface a customer-facing public security certification package, a detailed food-safety control framework,
              or a broader litigation map. The patent announcement helps on the offensive-IP side, but it does not
              answer freedom-to-operate, enforceability, or infringement risk. The result is a moderate-to-high legal
              and regulatory burden with only partial public mitigation. In practice, that means legal diligence would
              need to move beyond public web policies and into customer, supplier, and insurer documentation before risk
              could be considered fully mapped for investment purposes at current visibility levels.
