      - number: '4.2'
        title: Public traction and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The source set shows genuine commercial activity across multiple years, but not the metrics investors
              would ideally want. Instacart used Fabric in a fulfillment initiative, FreshDirect expanded with
              Fabric-supported automation in the Washington market, and Save A Lot launched an automated delivery
              proposition with Fabric and Uber in Brooklyn in late 2024. Those references support the existence of real
              customer relationships and some ability to convert them into operating business. They also imply an
              enterprise GTM motion involving long sales cycles, multi-stakeholder approvals, and customer-specific
              deployment planning rather than quick transactional sales. That GTM can create valuable reference
              customers, but it usually suppresses sales efficiency in the near term because each deployment requires
              technical validation, workflow design, and ongoing operating support. Without disclosed CAC, payback,
              booked ACV, or win-rate data, the prudent conclusion is that traction is visible while sales efficiency
              remains mostly opaque. The FreshDirect evidence is also unusually well corroborated across trade outlets,
              which makes it more credible as operating-history proof than a single promotional announcement would be.
