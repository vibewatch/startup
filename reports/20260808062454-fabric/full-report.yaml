            body: >-
              The strongest public durability signal is the Super-Pharm expansion, which reads like a returning-customer
              case rather than a one-off pilot. FreshDirect also suggests land-and-expand logic because the D.C.
              deployment was described as a blueprint for future market upgrades. Orchestra creates one more possible
              expansion vector by reaching beyond the initial install into planners, operators, and managers. However,
              the public record is thin on the usual customer-health metrics. There is no disclosed NRR, GRR, churn,
              renewal rate, contract length, customer count, or pilot-to-production conversion data. Because the named
              set is small and high profile, concentration risk is a live concern. Fabric may have other customers, but
              the public story does not show whether revenue is broadly distributed or anchored in a few logos and
