  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Fabric delivers in customer workflow terms
        blocks:
          - type: paragraph
            body: >-
              Fabric’s public surface now reads like a portfolio of fulfillment building blocks rather than one fixed
              MFC package. The company markets centralized fulfillment centers for larger metros, local MFCs for dense
              urban demand, Nano Express for low-cost tri-temperature full-basket fulfillment, Quick Pick for essentials
              and fast-moving items, and storage/sortation buffers for staged orders and remote pickup. On top of those
              physical formats, it maps specific workflows such as Fulfill, Replenish, Combine, and storage buffering.
              This matters because it means the product is framed around customer jobs rather than around a single robot
              architecture. The same retailer can, in theory, choose different site formats and workflow layers
              depending on whether it needs larger centralized capacity, local same-day speed, store replenishment, or
              partner-enabled click-and-collect. Public evidence is strong enough to describe the menu, even if real
              deployment frequency by module is undisclosed.
