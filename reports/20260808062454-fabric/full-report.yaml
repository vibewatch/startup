  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and who Fabric appears to sell to
        blocks:
          - type: paragraph
            body: >-
              The named-account pattern suggests Fabric sells into complex operators rather than into a broad base of
              light customers. Grocery and adjacent retail dominate the public story: FreshDirect, Save A Lot,
              Super-Pharm, Instacart-enabled retailers, and Walmart-related local-fulfillment activity all point to
              buyers with demanding inventory and service requirements. At the same time, Fabric’s Dallas launch with
              Chill Brands and its public Maersk reference show it has also tried to position its technology for broader
              e-commerce or enterprise fulfillment use cases. The use-case pages add a second layer of segmentation.
              Fabric is not only targeting consumer delivery; it also targets store replenishment, cross-channel
              partnerships, and nearby inventory nodes. That suggests the buyer can be a grocer, a retailer, a
              platform-linked operator, or a logistics-heavy brand that is willing to redesign fulfillment around speed
              and density. The pattern also suggests Fabric is selling where fulfillment is strategic enough to justify
              operational change, which usually means fewer, larger accounts rather than a long tail of transactional
              customers.
