  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, substitutes, and adjacent threats'
        blocks:
          - type: paragraph
            body: >-
              A retailer evaluating Fabric is not choosing among startup lookalikes alone. The direct peer set includes
              dense-storage and micro-fulfillment specialists such as Attabotics and the historical Takeoff model. The
              adjacent set includes AutoStore plus integrators, Exotec, and Symbotic, each of which can claim labor,
              throughput, or density gains even when their primary operating model differs from an urban grocery MFC.
              The incumbent set includes Ocado and Dematic/KION, which bring public-market visibility, grocery
              references, and broader implementation resources. Finally, the substitute set includes manual store
              picking, semi-mechanized backroom processes, and retailer-led multi-vendor architectures like Walmart’s
              local-fulfillment approach. This means Fabric is competing on more than product features; it is competing
              against buyer trust in scale, channel access, and implementation certainty. In practice, the most relevant
              question is often which architecture the buyer trusts to deliver service gains without operational
              fragility. Smaller component vendors also matter at the margin, because a buyer can sometimes solve part
              of the workflow with modular storage and keep more of the surrounding stack in-house.
            claimRefs:
