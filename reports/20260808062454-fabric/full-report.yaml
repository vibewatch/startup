      - number: '3.2'
        title: How Fabric differs from the closest startup-style peers
        blocks:
          - type: paragraph
            body: >-
              Fabric’s strongest peer-level story is that it is not merely selling a robot module. Its own materials
              position the product across B2C fulfillment, B2B replenishment, and an AI-native orchestration layer that
              coordinates inventory, labor, orders, delivery, and robotics. That is broader than a cube-storage pitch
              but narrower than a global warehouse-automation generalist. Attabotics is the closest structural analog
              because it also emphasizes dense cubic storage, dark-store suitability, and modular deployment. Exotec
              overlaps more on throughput, labor productivity, and grocery workflow flexibility. Takeoff matters even in
              failure because it represents the category-specific downside: a retailer-friendly use case does not ensure
              a durable vendor business. Fabric’s post-2024 shift toward technology and software also matters
              competitively, because it suggests management is trying to differentiate with workflow intelligence rather
              than win an arms race in custom hardware deployments alone. Trade coverage of the 2025 launch also
              reinforces that this repositioning is visible outside Fabric’s own website.
