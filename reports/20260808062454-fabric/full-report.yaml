      - number: '2.4'
        title: Growth drivers, adoption constraints, and what could break the thesis
        blocks:
          - type: paragraph
            body: >-
              The structural case for automation is strong: labor remains expensive and hard to find, service windows
              are tightening, and omnichannel grocery is now mainstream. Yet the market is more constrained than the
              headline growth curves suggest. Exotec and AutoStore emphasize the physical upside—less walking, higher
              throughput, denser storage, better uptime—but Future Market Insights and Logistics Viewpoints make clear
              that integration, dispatch logic, and replenishment quality can still destroy ROI. The Takeoff bankruptcy
              is the clearest negative case in the source set: demand for local grocery fulfillment existed, but the
              business still generated heavy losses and had to enter chapter 11. That failure case matters because it
              shows the key question is not whether retailers want speed; it is whether a given architecture produces
              service gains at acceptable capital intensity and operating cost. Fabric’s market opportunity is therefore
              real, but the execution bar is high and the obtainable share cannot be inferred from TAM slogans alone.
            claimRefs:
