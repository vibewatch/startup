chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and operating model
        blocks:
          - type: paragraph
            body: >-
              Fabric, formerly CommonSense Robotics, was founded in 2015 to make dense urban fulfillment economically
              viable for grocery and other retail categories. The company’s public identity is slightly bifurcated:
              Craft currently lists the headquarters in Tel Aviv-Yafo, while Fabric’s 2021 unicorn financing release
              emphasized offices in New York City, Tel Aviv, and Atlanta and described active operations in New York
              City, Washington, D.C., and Tel Aviv. Taken together, the evidence supports an Israeli-founded company
              with an operating footprint spanning Israel and the United States rather than a purely single-jurisdiction
              profile. The product proposition has also become broader over time. Fabric’s current home page positions
              the business as purpose-designed for grocery, with tri-temperature automation, order consolidation, urban
              deployment flexibility, and multiple fulfillment form factors ranging from larger centralized facilities
              to compact Micro Fulfillment Centers, Nano Express modules, and Quick-Pick stations. This operating model
              matters for diligence because it shows Fabric is not selling a single warehouse box; it is marketing a
              family of hardware-software systems that can fit different retail real-estate and service models.
