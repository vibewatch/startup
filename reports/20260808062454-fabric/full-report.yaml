  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the slice that matters for Fabric
        blocks:
          - type: paragraph
            body: >-
              Public sources describe at least three overlapping arenas. The first is the broad micro-fulfillment
              market: compact warehousing capacity positioned close to urban demand and often evaluated as part of local
              delivery economics. The second is the narrower micro-fulfillment automation market, which isolates the
              robotic storage, picking, and software systems used inside those sites. The third is the still narrower
              orchestration layer that coordinates inventory, labor, robotics, and order flow across mixed fulfillment
              environments. Fabric sits across all three, but not equally. Its marketing is explicitly grocery-oriented,
              and its product family spans physical site formats plus workflow software. That means a generic
              warehouse-automation TAM overstates the directly relevant market, while a tiny pure-software lens
              understates the operational scope Fabric is trying to own. The right market frame for diligence is
              therefore the grocery-focused segment where compact automation and software orchestration have to work
              together in live retail operations.
            claimRefs:
              - CM001
