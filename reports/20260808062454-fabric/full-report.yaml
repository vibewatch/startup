      - number: '4.4'
        title: Capital adequacy, financing dependency, and final verdict
        blocks:
          - type: paragraph
            body: >-
              Fabric clearly raised enough capital to build a serious business, but current adequacy is unknown. The
              2021 Series C raised $200 million, and reporting at the time said Fabric had raised more than $336
              million. Later materials and coverage cite roughly $375 million in cumulative capital, creating a public
              inconsistency that is explainable but not cleanly reconciled in the open. More importantly, the
              present-tense numbers that matter—cash on hand, monthly burn, debt, backlog, gross margin, and remaining
              runway—are not disclosed. The 2022 and 2024 layoffs strongly suggest management has been forced to manage
              burn and reset strategy. At the same time, ongoing launches and customer references indicate the company
              is still shipping product and not merely preserving a shell. The right verdict is therefore mixed: Fabric
              has revenue-quality signals and market demand, but the investment case remains financing-dependent until
              management provides current financial disclosures. In other words, public evidence supports continuity of
              operations, not sufficiency of capital.
