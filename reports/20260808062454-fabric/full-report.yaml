        Rows include the highest-signal public and private references from the reviewed source pack: direct company
        anchor, scaled public automation leaders, strategic incumbents, and downside analogs.
  - id: TV005
    title: Financing context and price-discipline table
    columns:
      - Item
      - Current public evidence
      - Underwriting read
      - Pricing implication
    rows:
      - - Last priced round
        - 2021 Series C at >US$1B
        - Real historical validation, but old
        - Cannot be used at face value today
      - - Total capital raised
        - US$336M official in 2021 vs US$375M cited later by CTech
        - Capital history is not perfectly clean
        - Need cap-table and financing reconciliation
      - - Restructuring history
        - Layoffs reported in 2022 and 2024
        - Execution and runway pressure likely mattered
        - Apply a stress discount
      - - Current operating proof
        - Save A Lot, Super-Pharm, FreshDirect, Orchestra
        - Enough substance to keep case alive
        - Do not underwrite zero, but do not pay premium blindly
      - - Current missing metrics
        - No public revenue, margin, backlog, cash, or utilization pack
        - Core valuation inputs are absent
        - Demand discount or deeper diligence
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV027
      - CV028
      - CV029
      - CV039
      - CV040
    notes: Pricing implications are judgment calls that explicitly penalize missing financial and cap-table information.
  - id: TV006
    title: Public evidence-quality and diligence friction table
    columns:
      - Surface
      - Run-date observation
      - Why it matters
      - Effect on confidence
    rows:
      - - Press room
        - Returned no readable text
        - Harder to review current announcements efficiently
        - Negative for diligence speed
      - - Labor-focused blog URL
        - '404'
        - Public narrative around labor economics is less reviewable
        - Negative for confidence
      - - FreshDirect customer page
        - '404'
        - Important customer proof now depends on older artifacts
        - Negative for customer-proof freshness
      - - Independent Grocery Dive explainer
        - '404'
        - Removes a contextual third-party explainer from easy review
        - Negative for triangulation
      - - No current financial pack
        - Still no public revenue / margin / cash disclosure in retained set
        - Valuation must stay range-based and discounted
        - Strong negative for pricing confidence
      - - Progressive Grocer FreshDirect URL
        - '404'
        - Another independent proof path for a known customer is less reviewable now
        - Negative for triangulation
    notes: >-
      These are not thesis-killers individually; they matter because public financial disclosure was already thin and
      several historical proof paths are now harder to review.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV029
      - CV049
      - CV051
  - id: TV007
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Further restructuring
        - Another meaningful layoff or defensive financing before better operating proof
        - Signals worsening runway or demand mismatch
        - Pause or re-price case sharply
      - - Flagship-customer rollback
        - Save A Lot or Super-Pharm contraction without offsetting wins
        - Breaks current durability narrative
        - Increase concentration discount or avoid
      - - Software-layer disappointment
        - No sign of Orchestra adoption or major workflow failure
        - Weakens software-upside thesis
        - Move toward lower-end base/bear view
      - - Data-room failure
        - Management cannot produce current revenue, gross margin, cash, and backlog data
        - Leaves core valuation inputs unresolved
        - Do not pay near prior mark
      - - Disclosure deterioration
        - More broken surfaces or inability to restore proof trails
        - Reduces trust in reporting maturity
        - Downgrade recommendation
    claimRefs:
      - CV031
      - CV035
      - CV039
      - CV040
      - CV042
      - CV043
      - CV050
    notes: Triggers are chosen for fast transmission into value, financing, or customer durability.
  - id: TV008
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue and gross margin
        - Current revenue bridge, gross margin by site/software/service
        - Needed to judge whether 2021 mark is defensible
        - Request board pack or QoQ KPI deck
      - - Cash, debt, and runway
        - Cash balance, debt terms, covenant status, financing plan
        - Determines near-term survival and bargaining power
        - Request treasury / financing update
      - - Site count and utilization
        - Live sites, ramp cohorts, fill-rate / capacity data
        - Separates installed logos from productive assets
        - Request operating dashboard by site
      - - Customer concentration and renewals
        - Top-customer revenue share, contract terms, renewal cohort
        - Measures fragility and durability
        - Request sales-finance cohort view
      - - Cap table and preferences
        - Preference stack, liquidation terms, secondary overhang
        - Changes common-equity attractiveness materially
        - Request latest cap table and financing docs
      - - Security / compliance pack
        - SOC / ISO status, food-safety controls, incident history
        - Required for enterprise-grade diligence and exit readiness
        - Request assurance binder from legal / ops
    claimRefs:
      - CV026
      - CV029
      - CV039
      - CV040
      - CV042
      - CV043
      - CV050
    notes: These asks are prioritized for their ability to move recommendation, confidence, or scenario range.
