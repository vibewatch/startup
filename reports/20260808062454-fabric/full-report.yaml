      - number: '4.3'
        title: Cost structure, ROI logic, and margin path
        blocks:
          - type: paragraph
            body: >-
              The economics of grocery automation are demanding. Public comparator materials from Dematic and Exotec
              make clear that buyers want relief from labor intensity, manual walking, service complexity, and tight
              retail margins. Fabric’s own software narrative adds another layer: reducing shrink, lowering training
              cost, simplifying onboarding, and improving day-to-day operational decisions. Those are all economically
              meaningful, but they do not erase the cost of capital equipment, implementation, service, and support.
              That is why the company’s shift toward software matters so much financially. A larger share of value
              delivered through orchestration software could improve margin mix and potentially make each live site more
              valuable over time, but the sources do not disclose whether that transition is already material. The best
              public evidence therefore supports a plausible margin-improvement story, not a verified one. NIQ’s 2026
              omnichannel demand work further supports the idea that grocers will keep spending on fulfillment
              economics, but it still does not solve Fabric’s private margin-disclosure gap. OSHA’s warehousing guidance
              is a reminder that robotics reduces some labor burdens but does not eliminate compliance, training, and
              safety-management obligations.
