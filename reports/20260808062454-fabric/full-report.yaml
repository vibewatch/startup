  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The public financing record is good enough to anchor the discussion, but not good enough to close it.
              Fabric’s October 2021 Series C at more than a $1 billion valuation remains a real late-stage validation
              signal, and the company’s later operating record is not blank: Super-Pharm expanded, Save A Lot launched a
              Brooklyn micro-fulfillment program with Uber in 2024, and Fabric kept pushing the story upward into
              Orchestra software. That combination is enough to reject a simplistic “dead unicorn” framing. The pricing
              problem is transparency. Public sources still do not establish current revenue, gross margin, backlog,
              cash, debt, customer concentration, or site utilization, while layoff reports in both 2022 and 2024 imply
              a company that has had to resize along the way. Broken or empty current content surfaces further reduce
              confidence. The IC-ready call is therefore research-more, not buy, with explicit price discipline around
              any attempt to use the 2021 mark as a live reference.
