companyProfile:
  summary: >-
    Fabric is an Israeli-founded robotic micro-fulfillment company that began as CommonSense Robotics in 2015 and now
    sells a family of fulfillment systems spanning centralized fulfillment centers, micro-fulfillment centers, Nano
    Express nodes, Quick Pick stations, and software layers such as Flow, Stack, Elevate, and Orchestra. Public customer
    proof includes early Tel Aviv deployments, Super-Pharm, FreshDirect, Walmart-linked local fulfillment activity, and
    the 2024 Save A Lot + Uber Brooklyn launch. The company reached unicorn status in October 2021 with a US$200 million
    Series C at a valuation above US$1 billion, but later public reporting showed layoffs and a strategic shift toward
    technology and software. Fabric remains operational and strategically relevant, yet its current revenue, margins,
    customer concentration, and runway remain undisclosed.
