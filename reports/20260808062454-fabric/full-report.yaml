              - CV049
              - CV051
      - number: '8.3'
        title: Scenario framework and comparable context
        blocks:
          - type: paragraph
            body: >-
              Because Fabric does not disclose current revenue or profitability, every valuation range here is
              explicitly estimated rather than observed. The bull case assumes that the software layer becomes
              monetizable, that repeat proofs like Super-Pharm and Save A Lot widen rather than stall, and that no
              emergency financing interrupts execution. Under that path, a valuation slightly above the old unicorn
              anchor can still be defended. The base case is more conservative and more realistic for current evidence:
              Fabric remains alive, differentiated, and relevant, but capital intensity and selective customer proof
              keep the market from rewarding it like a clean software name. The bear case matters because the category
              has already produced painful outcomes and GTM resets. Takeoff’s bankruptcy and Attabotics’ later
              restructuring/relaunch evidence show that automation demand can coexist with weak equity outcomes. Public
              comps such as Symbotic, Ocado, AutoStore, Dematic, and KION are helpful directional references, but they
              are not direct multiple-transfer matches for Fabric’s mixed business model and far thinner disclosure.
            claimRefs:
              - CV015
              - CV016
              - CV017
