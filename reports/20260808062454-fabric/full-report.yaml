      - number: '5.4'
        title: Trust, safety, compliance, and product risks
        blocks:
          - type: paragraph
            body: >-
              The trust picture is mixed. Fabric does provide some operational specifics: chilled workstations, optional
              fire suppression, tri-temperature operation, a monitored control room, and integration patterns suited to
              enterprise systems. OSHA and FDA sources also clarify that grocery fulfillment sits inside real safety and
              food-handling obligations, so the deployment burden is operationally serious. But several things are still
              missing in public. The source set does not provide verified uptime or MTBF, formal public security
              certifications, extensive public API docs, or independent performance testing. That absence does not prove
              weakness, but it keeps the diligence burden high. The main adverse product reminder comes from the
              category itself: Takeoff’s failure shows that attractive MFC workflows can still unravel when
              implementation complexity, economics, or customer fit do not hold. The correct verdict is that Fabric’s
              product vision is specific and credible, while its public proof on reliability and trust remains
              incomplete. For diligence purposes, that means engineering depth looks more believable than the assurance
              package, and buyers would still need a private validation room before treating the platform as fully
              de-risked in production settings today.
