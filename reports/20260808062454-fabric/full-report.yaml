  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization shape
        blocks:
          - type: paragraph
            body: >-
              Fabric does not look like a clean recurring-software company. Its historical materials emphasize
              automation deployments designed to make rapid grocery fulfillment profitable, which implies revenue from
              hardware, system design, installation, and launch activity. More recent materials widen that picture. The
              2025 Orchestra launch explicitly positions Fabric as a software and intelligence layer spanning inventory,
              labor, orders, delivery, and robotics. That suggests a deliberate attempt to monetize not only the
              physical fulfillment site, but also the operating system that coordinates it. The financial implication is
              important: project revenue can create visibility through contract milestones, but it is usually lumpier
              and more capital-intensive than recurring software. If Fabric can successfully attach workflow software
              and ongoing optimization to existing deployments, the mix could improve over time. Public sources are
              enough to support the shape of that transition, but not enough to quantify current recurring revenue,
              implementation revenue, or services mix.
