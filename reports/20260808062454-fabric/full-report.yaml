      - number: '2.2'
        title: 'Sizing lenses: broad micro-fulfillment, narrow automation, and demand backdrop'
        blocks:
          - type: paragraph
            body: >-
              The market is large enough to matter, but the exact number depends on what is being counted. The Business
              Research Company’s 2026 overview places the broad micro-fulfillment market at $13.13 billion, while Future
              Market Insights places the narrower automation market at $1.3 billion in the same year. That spread is not
              noise; it captures a genuine difference in scope. On the demand side, the addressable retail environment
              continues to expand. The U.S. Census Bureau reported e-commerce at 16.9% of total U.S. retail in Q1 2026,
              while FMI and NIQ say online grocery already represents about one-fifth of total grocery spending and
              could reach $452 billion by 2028. Nearly all grocery households now blend store and digital channels. That
              combination supports a durable demand backdrop for faster fulfillment, but it does not automatically
              validate every automation vendor. Fabric’s SAM is narrower than the broad TAM because it is concentrated
              in grocery and local retail workflows that justify dense automated nodes.
