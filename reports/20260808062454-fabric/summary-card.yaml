summary:
  headline: >-
    Fabric remains a live but opaque robotic fulfillment platform: current customer proof and software repositioning
    justify continued diligence, but repeated layoffs and missing financial disclosure leave the 2021 unicorn mark
    looking stretched.
  overallScore: 5.8
  recommendation: research-more
