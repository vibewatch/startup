evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: board-and-governance
    missingEvidence: Current board composition, voting control, and governance structure after the 2024 reset.
    whyItMatters: >-
      Turnaround accountability and financing negotiations depend on who actually controls the company and its
      preferences.
    diligencePath: Request board roster, board observer rights, and latest financing documents.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: current-revenue
    missingEvidence: Current revenue, ARR, gross margin, and site-level economics.
    whyItMatters: The stale unicorn valuation cannot be underwritten without current commercial performance.
    diligencePath: Request management KPI pack, monthly revenue bridge, and gross margin by facility type.
    relatedQuestionRefs:
      - QO027
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: Reconciled total capital raised figure explaining $336M versus $375M public totals.
    whyItMatters: >-
      Capital history affects dilution, runway analysis, and whether there were undisclosed bridge financings after the
      Series C.
    diligencePath: Request complete round-by-round cap table and proceeds schedule.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO003
  - type: stale
    severity: minor
    topic: headcount
    missingEvidence: A current employee count after the April 2024 layoffs and 2025 Orchestra launch.
    whyItMatters: Headcount is a proxy for whether the reset stabilized or continued to contract the operating base.
    diligencePath: Request current org chart and people count by geography and function.
    relatedQuestionRefs:
      - QO015
  - type: conflicting-data
    severity: material
    topic: sam-definition
    missingEvidence: >-
      A directly sourced Fabric-specific SAM that cleanly isolates grocery-focused compact automation plus orchestration
      software.
    whyItMatters: >-
      A broad warehouse-automation TAM would exaggerate the spend Fabric can realistically pursue, but public sources do
      not isolate a company-specific serviceable market.
    diligencePath: Build bottom-up SAM from target accounts, site density, average contract value, and deployment model.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: obtainable-share
    missingEvidence: Fabric win-rate, active pipeline, average deployment value, and conversion data by customer segment.
    whyItMatters: Without conversion and pricing evidence, SOM cannot be estimated from public market reports alone.
    diligencePath: Request funnel, proposal volume, and live-site rollout data by customer class.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: minor
    topic: regional-sam
    missingEvidence: Region-specific grocery automation spending splits for the U.S. and selected international markets.
    whyItMatters: Fabric’s market opportunity is likely regionally concentrated rather than globally uniform.
    diligencePath: Use paid analyst segmentation or buyer interviews to isolate regional spend pools.
    relatedQuestionRefs:
      - QM023
  - type: stale
    severity: minor
    topic: market-comparables
    missingEvidence: A single source that reconciles local MFCs versus regional-DC automation in one common economic framework.
    whyItMatters: Buyers often compare those architectures during procurement, but public sources usually discuss them separately.
    diligencePath: Collect customer procurement documents or consultant frameworks comparing deployment archetypes.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Fabric win/loss data by competitor class and buyer segment.
    whyItMatters: >-
      Public positioning cannot show whether Fabric actually wins against incumbents, private peers, or manual
      alternatives.
    diligencePath: Request last-12-quarter competitive pipeline outcomes with reasons lost.
    relatedQuestionRefs:
      - QP025
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: Contract pricing, payback thresholds, and discount patterns across Fabric and core rivals.
    whyItMatters: Competitive intensity and gross-margin durability depend on pricing behavior, which is mostly opaque publicly.
    diligencePath: Collect proposal documents or customer interviews to compare package economics.
    relatedQuestionRefs:
      - QP017
  - type: private-evidence-only
    severity: material
    topic: software-stickiness
    missingEvidence: Live Orchestra usage, attach rate, and renewal/expansion behavior.
    whyItMatters: The software layer is the strongest plausible moat, but its real stickiness is not yet publicly visible.
    diligencePath: Request site-level software adoption metrics and customer references.
    relatedQuestionRefs:
      - QP023
  - type: stale
    severity: minor
    topic: alert-innovation
    missingEvidence: A current direct source on Alert Innovation’s competitive posture in 2026.
    whyItMatters: Alert appears in Walmart’s local-fulfillment architecture but was not independently profiled in the fetched set.
    diligencePath: Add fresh official or independent source coverage for Alert if it appears in active deals.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Current revenue, gross margin, cash balance, monthly burn, and runway.
    whyItMatters: These numbers determine whether Fabric is a durable business or still financing-dependent.
    diligencePath: Request latest board package or lender/investor update with P&L and cash bridge.
    relatedQuestionRefs:
      - QI008
      - QI021
  - type: conflicting-data
    severity: material
    topic: capital-raised
    missingEvidence: A reconciled explanation for the shift from >$336M raised in 2021 coverage to ~$375M in later materials.
    whyItMatters: Capital history affects dilution analysis and adequacy judgments.
    diligencePath: Request round ledger with close dates, proceeds, and any venture debt or extension financings.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Fabric-specific deployment cost stack, software attach rate, service margin, and customer payback.
    whyItMatters: Without them the margin-improvement thesis remains hypothetical.
    diligencePath: Request site-level economics and cohort expansion data.
    relatedQuestionRefs:
      - QI024
  - type: missing-source
    severity: minor
    topic: debt-obligations
    missingEvidence: Any equipment finance, lender covenants, or customer financing structures.
    whyItMatters: Debt can change runway and downside risk materially.
    diligencePath: Request debt schedule and covenant summary.
    relatedQuestionRefs:
      - QI022
  - type: private-evidence-only
    severity: material
    topic: reliability-metrics
    missingEvidence: Fabric-specific uptime, MTBF, pick accuracy, error rate, and throughput by module.
    whyItMatters: Without them the product cannot be benchmarked credibly against other automation platforms.
    diligencePath: Request customer before/after ops data and reliability dashboards.
    relatedQuestionRefs:
      - QE017
      - QE023
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: Public security, privacy, and software assurance package for Orchestra / Flow / Stack.
    whyItMatters: Enterprise retailers often need this before procurement and integration.
    diligencePath: Request SOC 2 / ISO docs, pen-test summaries, and architecture review.
    relatedQuestionRefs:
      - QE018
      - QE024
  - type: private-evidence-only
    severity: material
    topic: api-surface
    missingEvidence: Real API docs, auth model, event model, and integration implementation guide.
    whyItMatters: Integration claims are central to the product story but cannot be assessed from marketing copy alone.
    diligencePath: Request partner/integration documentation and reference architectures.
    relatedQuestionRefs:
      - QE011
      - QE023
  - type: private-evidence-only
    severity: minor
    topic: module-adoption-mix
    missingEvidence: How many live customers use each module or software layer.
    whyItMatters: Portfolio breadth is visible, but actual adoption concentration is not.
    diligencePath: Request installed-base split by module and workflow.
    relatedQuestionRefs:
      - QE022
  - type: private-evidence-only
    severity: material
    topic: concentration / TU003 coverage
    missingEvidence: Revenue share by top customers and number of live production sites.
    whyItMatters: A few named accounts may dominate commercial value, but the public record cannot quantify that concentration.
    diligencePath: Request top-customer revenue concentration and live-site roster.
    relatedQuestionRefs:
      - QU011
      - QU024
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
