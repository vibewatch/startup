- id: differentiation
  title: Differentiation and visible maturity
  body: >-
    Fabric’s differentiation story is increasingly software-led. Trade and practitioner coverage repeatedly stress
    that topology, orchestration logic, and workflow intelligence matter as much as robots. That matches the product
    pages: Flow, Stack, Elevate, and Orchestra are not peripheral accessories but explicit product surfaces. The
    public materials also remain tightly grocery-specific, with tri-temperature handling, replenishment logic, dispatch
    staging, cross-channel partnerships, and cold-chain language woven through multiple modules. That said, several
    physical claims are no longer unique. Competing literature from Exotec, Dematic, and Modula shows that labor
    relief, density, urban fit, and throughput improvement are common category narratives. As a result, Fabric’s
    moat—if it exists—likely depends on how well the software and operational logic make the modular hardware actually
    work in live retail settings. Public evidence shows coherent product maturity in description, but sparse independent
    proof of module-by-module performance.
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE025
  - CE026
  - CE027
  - CE033
  tableRefs:
  - TE005
  - TE007
- id: trust-and-risk
  title: Trust, safety, compliance, and product risks
  body: >-
    The trust picture is mixed. Fabric does provide some operational specifics: chilled workstations, optional fire
    suppression, tri-temperature operation, a monitored control room, and integration patterns suited to enterprise
    systems. OSHA and FDA sources also clarify that grocery fulfillment sits inside real safety and food-handling
    obligations, so the deployment burden is operationally serious. But several things are still missing in public.
    The source set does not provide verified uptime or MTBF, formal public security certifications, extensive public
    API docs, or independent performance testing. That absence does not prove weakness, but it keeps the diligence
    burden high. The main adverse product reminder comes from the category itself: Takeoff’s failure shows that
    attractive MFC workflows can still unravel when implementation complexity, economics, or customer fit do not
    hold. The correct verdict is that Fabric’s product vision is specific and credible, while its public proof on
    reliability and trust remains incomplete. For diligence purposes, that means engineering depth looks more believable
    than the assurance package, and buyers would still need a private validation room before treating the platform
    as fully de-risked in production settings today.
  claimRefs:
  - CE028
  - CE030
  - CE031
  - CE032
  - CE034
  - CE035
