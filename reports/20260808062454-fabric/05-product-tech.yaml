- id: TE008
  title: Product gaps and dependency table
  columns:
  - Gap or dependency
  - Current evidence
  - Why it matters
  - Exact diligence path
  rows:
  - - Independent uptime / MTBF
    - Not public
    - Needed to judge reliability and service risk
    - Request uptime, incident, and failure-rate history by module
  - - Throughput benchmarks
    - Not public for Fabric itself
    - Needed for head-to-head technical comparison
    - Request Fabric-specific performance tests or customer before/after data
  - - Public API / docs surface
    - Only integration methods described
    - Needed to assess implementation friction and ecosystem potential
    - Request API docs, event model, auth/security architecture
  - - Security / privacy certification
    - No public package found
    - Needed for enterprise trust and procurement
    - Request SOC 2 / ISO / penetration-test summary
  - - Food-safety and cold-chain validation
    - Only high-level claims visible
    - Needed for grocery deployment diligence
    - Request HACCP/FSMA operating controls and audit evidence
  - - Supplier / component dependency
    - Not public
    - Needed to assess hardware resilience and lead times
    - Request BOM concentration and alternate-supplier plan
  notes: These are the key blockers to underwriting product durability from public evidence alone.
