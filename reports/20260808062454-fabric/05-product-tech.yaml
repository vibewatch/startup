company:
  name: Fabric
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Fabric now presents a broad fulfillment platform rather than a single robotic cell. The public product family
    includes centralized and local fulfillment formats, specialized quick-deploy and buffer modules, multiple workflow
    modes, and a growing software layer spanning inventory planning, task orchestration, personalization, and operator
    assistance. The strongest public differentiation is not a unique public throughput metric; it is the combination
    of grocery-specific workflows, temperature-aware designs, modular formats, and orchestration software derived
    from live operating environments. The weak point is proof: public materials are rich in module descriptions
    but thin on independently validated reliability, performance, and security evidence.
sections:
- id: product-scope
  title: What Fabric delivers in customer workflow terms
  body: >-
    Fabric’s public surface now reads like a portfolio of fulfillment building blocks rather than one fixed MFC
    package. The company markets centralized fulfillment centers for larger metros, local MFCs for dense urban demand,
    Nano Express for low-cost tri-temperature full-basket fulfillment, Quick Pick for essentials and fast-moving
    items, and storage/sortation buffers for staged orders and remote pickup. On top of those physical formats,
    it maps specific workflows such as Fulfill, Replenish, Combine, and storage buffering. This matters because
    it means the product is framed around customer jobs rather than around a single robot architecture. The same
    retailer can, in theory, choose different site formats and workflow layers depending on whether it needs larger
    centralized capacity, local same-day speed, store replenishment, or partner-enabled click-and-collect. Public
    evidence is strong enough to describe the menu, even if real deployment frequency by module is undisclosed.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
