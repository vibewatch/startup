- id: architecture
  title: 'Architecture: physical system, software layers, and integration model'
  body: >-
    The architecture description is unusually concrete for a private company website. Fabric decomposes the system
    into stations, storage, robots, software, and support layers. Stations cover picking, decanting, quality control,
    and dispatch via the Express Counter. The storage system emphasizes flexible shelving, configurable tote/bin
    structures, and optional fire suppression. The robot layer uses a centralized intelligence model with specialized
    lift and ground robots and in-process charging. Above that, software modules such as Elevate, Stack, Flow, and
    Orchestra target personalization, replenishment logic, operational workflows, and AI-assisted decision support.
    Integration is described in modern enterprise terms—RESTful APIs, message queues, cloud infrastructure, WMS/ERP
    connectivity, and delivery-platform links—suggesting Fabric wants to be treated as part of the retailer’s digital
    operations stack, not just as a physical automation vendor. The architecture therefore looks modular and layered,
    but the public proof stops short of formal API docs or reliability benchmarks.
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
