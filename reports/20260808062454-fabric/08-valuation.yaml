- id: TV005
  title: Financing context and price-discipline table
  columns:
  - Item
  - Current public evidence
  - Underwriting read
  - Pricing implication
  rows:
  - - Last priced round
    - 2021 Series C at >US$1B
    - Real historical validation, but old
    - Cannot be used at face value today
  - - Total capital raised
    - US$336M official in 2021 vs US$375M cited later by CTech
    - Capital history is not perfectly clean
    - Need cap-table and financing reconciliation
  - - Restructuring history
    - Layoffs reported in 2022 and 2024
    - Execution and runway pressure likely mattered
    - Apply a stress discount
  - - Current operating proof
    - Save A Lot, Super-Pharm, FreshDirect, Orchestra
    - Enough substance to keep case alive
    - Do not underwrite zero, but do not pay premium blindly
  - - Current missing metrics
    - No public revenue, margin, backlog, cash, or utilization pack
    - Core valuation inputs are absent
    - Demand discount or deeper diligence
