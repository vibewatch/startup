- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Value range
  - Probability signal
  - Key triggers
  rows:
  - - Bull
    - Orchestra monetizes, repeat customers expand, no financing stress, and compact-node economics scale
    - US$1.2B-US$1.6B
    - Possible, but needs non-public proof
    - Current revenue and utilization surprise to the upside
  - - Base
    - Fabric remains relevant, wins selective expansions, but capital and disclosure stay constrained
    - US$0.6B-US$0.9B
    - Most consistent with current evidence
    - No major blow-up, but no clear evidence to justify 2021 mark
  - - Bear
    - Further contraction, customer rollback, or financing pressure leads to down-round or asset sale
    - US$0.2B-US$0.5B
    - Material downside path
    - More layoffs, weak diligence-room data, or flagship-customer loss
  notes: Ranges are scenario estimates anchored to the evidence pack, not a mechanical valuation model.
