  - CV039
  - CV040
  - CV042
  - CV043
  - CV050
  notes: Triggers are chosen for fast transmission into value, financing, or customer durability.
- id: TV008
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue and gross margin
    - Current revenue bridge, gross margin by site/software/service
    - Needed to judge whether 2021 mark is defensible
    - Request board pack or QoQ KPI deck
  - - Cash, debt, and runway
    - Cash balance, debt terms, covenant status, financing plan
    - Determines near-term survival and bargaining power
    - Request treasury / financing update
  - - Site count and utilization
    - Live sites, ramp cohorts, fill-rate / capacity data
    - Separates installed logos from productive assets
    - Request operating dashboard by site
  - - Customer concentration and renewals
    - Top-customer revenue share, contract terms, renewal cohort
    - Measures fragility and durability
    - Request sales-finance cohort view
  - - Cap table and preferences
    - Preference stack, liquidation terms, secondary overhang
    - Changes common-equity attractiveness materially
    - Request latest cap table and financing docs
  - - Security / compliance pack
    - SOC / ISO status, food-safety controls, incident history
    - Required for enterprise-grade diligence and exit readiness
    - Request assurance binder from legal / ops
  claimRefs:
