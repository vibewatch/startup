- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Current support
  - What would change the view
  rows:
  - - Market demand is real
    - FMI, NIQ, and Census all support durable e-commerce fulfillment demand
    - Demand slowdown alone would not break thesis; company-level economics matter more
  - - Customer proof is real but selective
    - Super-Pharm, FreshDirect, and Save A Lot all support live use cases
    - Broader disclosed customer roster or renewals would improve confidence
  - - Software optionality could raise value
    - Orchestra and integration materials show higher-layer ambition
    - Evidence of actual software revenue or adoption would move the view up
  - - Financial opacity is severe
    - No current public revenue, margin, cash, or backlog pack
    - Audited or board-grade operating data would move call toward track
  - - Category downside is real
    - Takeoff failure and Attabotics reset show vendor risk
    - Sustained customer expansion without financing stress would mitigate this
  - - Evidence quality is weaker than expected for a mature unicorn
    - Broken pages and empty press-room surface reduce diligence efficiency
    - Restored disclosure surfaces and updated operating proof would improve pricing confidence
