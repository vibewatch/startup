- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public status / anchor
  - What it shows
  - Relevance to Fabric
  - Limitation
  rows:
  - - Fabric (2021 Series C)
    - Private round at >US$1B valuation
    - Historical top-of-cycle private anchor
    - Direct company-specific price reference
    - Stale and not supported by current disclosure
  - - Symbotic
    - Public, with large disclosed backlog and major retail relationships
    - Automation can become a very large public-equity story
    - Best upside-scale reference
    - Scale and disclosure are far beyond Fabric
  - - Ocado
    - Public grocer-automation platform with current results cadence
    - Grocery automation can sustain strategic value despite complexity
    - Model-adjacent grocery benchmark
    - Mixed business model and public-market noise reduce transferability
  - - AutoStore
    - Public automation platform with investor disclosure
    - Dense automated storage can support durable category value
    - Closest architecture-style reference on modular automation
    - Not a direct managed-fulfillment analog
  - - KION / Dematic
    - Large incumbent with audited reports and grocery deployments
    - Strategic buyers exist and category value can live inside broader automation groups
    - Useful exit and benchmark reference
    - Conglomerate structure obscures pure-play multiples
  - - Takeoff / Attabotics
    - Distress or GTM-reset references
    - Demand does not eliminate equity downside
    - Downside and restructuring analogs
    - Not a precise pricing benchmark
  notes: >-
    The comparable set is selected for model relevance, strategic benchmarking, and downside framing rather than
    for direct multiple transfer.
