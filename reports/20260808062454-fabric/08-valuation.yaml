- id: exit-readiness-and-final-diligence-asks
  title: Exit readiness and final diligence asks
  body: >-
    Fabric is not underwritten enough for an IPO-style view. The more plausible exit set is a strategic sale into
    a larger automation or logistics platform, a structured insider-led financing, or a flat/down private round
    after deeper diligence closes the information gap. What would move the call upward is straightforward: current
    revenue and gross margin evidence, credible site-level utilization data, clearer customer-concentration metrics,
    and hard information on the cap table and runway. What would move it downward is equally clear: another restructuring,
    loss of a flagship customer, inability to produce a diligence-room assurance pack, or more evidence that public
    disclosures are decaying rather than improving. That is why the recommendation remains research-more rather
    than track or buy. There is enough substance here to keep watching, but not enough current proof to underwrite
    the historical price anchor with conviction.
