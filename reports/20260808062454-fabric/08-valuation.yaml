  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-financial-pack
    missingEvidence: Current revenue, gross margin, EBITDA or cash burn, backlog, and runway.
    whyItMatters: These are the core inputs required to decide whether the 2021 price anchor still works.
    diligencePath: Request current board package and monthly KPI deck.
    relatedQuestionRefs:
    - QV002
    - QV005
    - QV016
    - QV025
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Latest cap table, preference stack, liquidation terms, secondary or insider overhang, and debt
      terms.
    whyItMatters: Common-equity attractiveness can change materially even if enterprise value looks acceptable.
    diligencePath: Request financing documents and latest cap table from counsel or finance.
    relatedQuestionRefs:
    - QV004
    - QV021
    - QV025
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-site-metrics
    missingEvidence: Top-customer concentration, renewal cohorts, live-site count, utilization, and ramp curves.
    whyItMatters: These data determine how much real earning power sits behind the visible customer logos.
    diligencePath: Request customer cohort and site-operations dashboards.
    relatedQuestionRefs:
    - QV015
    - QV016
    - QV025
  - type: missing-source
    severity: minor
    topic: disclosure-surface-quality
    missingEvidence: A clean, current public investor-relations or operating-results surface.
    whyItMatters: The current mix of broken, empty, or stale pages lowers confidence and slows external diligence.
    diligencePath: >-
      Ask management to restore or provide a current operating-proof binder covering product, customer, and financial
      updates.
    relatedQuestionRefs:
    - QV006
    - QV019
    - QV029
    relatedTableRefs:
    - TV004
