- id: TV007
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Further restructuring
    - Another meaningful layoff or defensive financing before better operating proof
    - Signals worsening runway or demand mismatch
    - Pause or re-price case sharply
  - - Flagship-customer rollback
    - Save A Lot or Super-Pharm contraction without offsetting wins
    - Breaks current durability narrative
    - Increase concentration discount or avoid
  - - Software-layer disappointment
    - No sign of Orchestra adoption or major workflow failure
    - Weakens software-upside thesis
    - Move toward lower-end base/bear view
  - - Data-room failure
    - Management cannot produce current revenue, gross margin, cash, and backlog data
    - Leaves core valuation inputs unresolved
    - Do not pay near prior mark
  - - Disclosure deterioration
    - More broken surfaces or inability to restore proof trails
    - Reduces trust in reporting maturity
    - Downgrade recommendation
  claimRefs:
  - CV031
