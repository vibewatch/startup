- id: TP001
  title: Competitor profile table
  columns:
  - Competitor / substitute
  - Category
  - Scale / evidence
  - Target customer
  - Differentiation
  - Limitation vs Fabric
  rows:
  - - Ocado
    - Global grocery-automation incumbent
    - Public reporting, active 2026 momentum
    - Large grocers and enterprise retailers
    - End-to-end grocery automation heritage and strong references
    - Likely heavier and more enterprise-oriented than Fabric’s modular story
  - - AutoStore + integrators
    - Platform / component ecosystem
    - Public company plus integrator channel
    - Retailers, 3PLs, grocery, ecommerce
    - Dense cube storage, high uptime, broad channel reach
    - Less grocery-specific operations layer than Fabric claims
  - - Symbotic
    - Large-scale adjacent incumbent
    - SEC-reported $22.4B backlog and Walmart scale
    - Large retailers and distributors
    - Full stack, AI layer, enormous reference customer
    - More regional-DC oriented than compact urban sites
  - - Attabotics
    - Direct private analog
    - Dark-store and dense-storage positioning
    - Urban fulfillment and space-constrained operators
    - 3D robotics, 85% footprint reduction, modularity
    - Less visible grocery-specific software narrative than Orchestra
  - - Exotec
    - Adjacent startup-scale competitor
    - Performance and grocery workflow claims plus partner channel
    - Retailers and omnichannel operators
    - High throughput, flexible grocery workflows, partner ecosystem
    - Not framed as grocery-only local MFC specialist
  - - Dematic / KION
    - Incumbent systems integrator
    - Large parent company and grocery references
    - Large grocers and distribution operators
    - Implementation scale and incumbent trust
    - Heavier incumbent model may be less modular than Fabric
  - - Manual / semi-mechanized operations
    - Status quo substitute
    - Still widespread in supply chains
    - Most retailers and grocers
    - No transformation capex and operational familiarity
    - Lower productivity and service performance
  - - Retailer multi-vendor build
    - Internal-build substitute
    - Walmart-style assembly with automation plus manual workflows
    - Very large retailers
    - Lets buyer avoid single-vendor dependence
    - Higher integration burden for the retailer
  notes: >-
    The table separates direct startup-style peers from substitute architectures, because the buyer often compares
    those options in the same procurement process.
