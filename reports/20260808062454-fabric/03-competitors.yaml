- id: TP005
  title: Switching cost and lock-in table
  columns:
  - Layer
  - Lock-in source
  - Buyer pain if changed
  - How multi-homing changes
  rows:
  - - Physical storage geometry
    - Facility design and robotics layout
    - Retrofit or replacement can disrupt operations and capex plans
    - Low multi-homing at single site
  - - Execution software
    - Process logic, labor routines, dashboards, alerts
    - Retraining and workflow redesign are required
    - Some multi-homing possible across network
  - - Inventory and order rules
    - Retail-specific SKU flows and exception handling
    - Risk of service degradation during migration
    - Moderate multi-homing if APIs are clean
  - - Integrator relationships
    - Service, maintenance, upgrade path
    - Changing vendors can reset trust and support arrangements
    - Buyer may dual-source only at portfolio level
  - - Retail operating data
    - Historical performance, shrink, replenishment tuning
    - Loss of accumulated optimization insight
    - Higher stickiness if software becomes decision layer
  notes: >-
    The highest lock-in comes after go-live, but the hardest competitive fight is usually won earlier when trust
    and implementation risk are being priced in.
