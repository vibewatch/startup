- id: TP006
  title: Moat durability / competitive risk register
  columns:
  - Moat claim or risk
  - Threat
  - Severity
  - Current evidence
  - Diligence ask
  rows:
  - - Dense automation form factor
    - Hardware commoditization
    - High
    - Multiple vendors claim density and labor gains
    - Request objective benchmark data and install-base proof
  - - Grocery-specific positioning
    - Incumbents broaden into grocery
    - Medium
    - Dematic, Ocado, Exotec all speak directly to grocery workflows
    - Ask for win/loss records by buyer segment
  - - Software orchestration
    - Buyer treats it as add-on rather than core moat
    - Medium
    - Orchestra is new and reference depth is not yet public
    - Request live usage, renewal, and attach-rate data
  - - Balance-sheet durability
    - Customers prefer larger vendors
    - High
    - Public peers and incumbents have more visible scale
    - Request cash runway and support commitments
  - - Category economics
    - Peer failure despite real demand
    - High
    - Takeoff bankruptcy is direct warning evidence
    - Request site-level unit economics and ramp curves
  notes: >-
    Fabric’s best path to durability appears to be workflow intelligence plus operational data, not simply claiming
    denser hardware.
