company:
  name: Fabric
chapter:
  number: 3
  title: Competitors
  summary: >-
    Fabric competes in a crowded and layered field. The most obvious startup analogs are dense, modular automation
    vendors such as Attabotics and the now-bankrupt Takeoff, but the more formidable pressures may come from adjacent
    incumbents such as Ocado, Dematic/KION, AutoStore plus integrators, and Symbotic, each of which attacks overlapping
    retailer budgets with greater scale, references, or channel power. Fabric’s credible differentiation is not
    raw robot novelty alone; it is the combination of grocery-specific site formats, support for B2C plus B2B replenishment,
    and an orchestration layer that tries to bridge automation and retail operations. The weakness is that physical
    automation is increasingly crowded, pricing is opaque, switching costs are high, and the category already has
    one prominent failure case.
sections:
- id: landscape
  title: 'Landscape: direct peers, incumbents, substitutes, and adjacent threats'
  body: >-
    A retailer evaluating Fabric is not choosing among startup lookalikes alone. The direct peer set includes dense-storage
    and micro-fulfillment specialists such as Attabotics and the historical Takeoff model. The adjacent set includes
    AutoStore plus integrators, Exotec, and Symbotic, each of which can claim labor, throughput, or density gains
    even when their primary operating model differs from an urban grocery MFC. The incumbent set includes Ocado
    and Dematic/KION, which bring public-market visibility, grocery references, and broader implementation resources.
    Finally, the substitute set includes manual store picking, semi-mechanized backroom processes, and retailer-led
    multi-vendor architectures like Walmart’s local-fulfillment approach. This means Fabric is competing on more
    than product features; it is competing against buyer trust in scale, channel access, and implementation certainty.
    In practice, the most relevant question is often which architecture the buyer trusts to deliver service gains
    without operational fragility. Smaller component vendors also matter at the margin, because a buyer can sometimes
    solve part of the workflow with modular storage and keep more of the surrounding stack in-house.
  claimRefs:
  - CP001
  - CP006
  - CP008
  - CP011
  - CP015
  - CP023
  - CP025
  - CP026
  - CP037
  - CP038
  tableRefs:
  - TP001
- id: fabric-vs-peers
  title: How Fabric differs from the closest startup-style peers
  body: >-
    Fabric’s strongest peer-level story is that it is not merely selling a robot module. Its own materials position
    the product across B2C fulfillment, B2B replenishment, and an AI-native orchestration layer that coordinates
    inventory, labor, orders, delivery, and robotics. That is broader than a cube-storage pitch but narrower than
    a global warehouse-automation generalist. Attabotics is the closest structural analog because it also emphasizes
    dense cubic storage, dark-store suitability, and modular deployment. Exotec overlaps more on throughput, labor
    productivity, and grocery workflow flexibility. Takeoff matters even in failure because it represents the category-specific
    downside: a retailer-friendly use case does not ensure a durable vendor business. Fabric’s post-2024 shift toward
    technology and software also matters competitively, because it suggests management is trying to differentiate
    with workflow intelligence rather than win an arms race in custom hardware deployments alone. Trade coverage
    of the 2025 launch also reinforces that this repositioning is visible outside Fabric’s own website.
  claimRefs:
  - CP002
  - CP003
  - CP004
  - CP005
