- id: durability-and-risk
  title: Moat durability, lock-in, and what could break the competitive thesis
  body: >-
    This category has both high switching costs and high commoditization risk. Once a retailer installs a physical
    automation system, storage geometry, WES logic, labor design, and exception-handling processes create genuine
    lock-in. Yet at the same time, many vendors now make similar claims around density, throughput, uptime, and
    labor savings, which means the hardware story alone is not a durable moat. Pricing is also hard to compare publicly,
    reinforcing the view that vendors compete through custom solutioning and procurement negotiation instead of
    transparent packaging. The Takeoff bankruptcy adds a sharper warning: a strong narrative and real retailer demand
    can coexist with poor vendor economics. For Fabric, the most plausible durable moat is therefore not a robot
    box or shuttle by itself but workflow intelligence, retailer-specific operational data, and software that becomes
    painful to displace after go-live. Without that, the company risks being bracketed by larger incumbents above
    and hardware commoditization beside it. That is especially true if buyers view compact automation as modular
    equipment that can be swapped or assembled from multiple suppliers rather than as a unique operating system.
  claimRefs:
  - CP027
  - CP028
  - CP029
  - CP030
  - CP031
  - CP035
  - CP036
  - CP037
  tableRefs:
  - TP006
