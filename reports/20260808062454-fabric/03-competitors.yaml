- id: incumbent-and-channel-power
  title: Where incumbents and partner ecosystems may overpower a smaller private vendor
  body: >-
    The public-company and integrator-backed competitors have obvious strengths. Ocado’s 2026 results still point
    to active commercial momentum in grocery automation, while Symbotic’s backlog and Walmart exposure demonstrate
    how much retailer capex can concentrate around a single scaled provider. AutoStore, Attabotics, and Exotec each
    also show the importance of channel power: Fives, SAVOYE, Komar, and other ecosystem partners expand sales reach
    and reduce implementation friction. Dematic adds another type of threat—an incumbent integrator with grocery
    references and the balance-sheet support of KION. These factors matter because automation deals are rarely won
    on benchmarked throughput alone. Buyers want implementation confidence, service coverage, and a path to integrate
    automation into broader warehouse workflows. Fabric may offer a sharper grocery-specific story, but it has less
    visible evidence of channel breadth and balance-sheet durability than the largest public or integrator-backed
    players. Symbotic’s own investor-facing materials also underline that food-and-beverage supply chains are part
    of its intended domain, making it harder to dismiss as non-overlapping.
  claimRefs:
  - CP007
  - CP009
  - CP010
  - CP012
  - CP013
  - CP014
  - CP018
  - CP022
  - CP024
  - CP032
