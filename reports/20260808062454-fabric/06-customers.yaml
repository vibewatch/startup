runDate: '2026-08-08'
company:
  name: Fabric
chapter:
  number: 6
  title: Customers
  summary: >-
    Fabric has real named-customer proof, but it is selective rather than comprehensive. The strongest durability
    evidence is Super-Pharm, where Fabric presents a multi-year, expanded relationship with claimed operational
    results. FreshDirect is heavily corroborated and shows expansion-style use into a new geography, while Save
    A Lot provides the freshest proof that Fabric was still operating commercially in late 2024. Instacart, Walmart-linked
    activity, Chill Brands, and Maersk broaden the story but do not all carry the same proof weight. The gap is
    denominator data: public sources do not reveal overall customer count, retention, contract values, or concentration
    by revenue.
sections:
- id: segments
  title: Customer segmentation and who Fabric appears to sell to
  body: >-
    The named-account pattern suggests Fabric sells into complex operators rather than into a broad base of light
    customers. Grocery and adjacent retail dominate the public story: FreshDirect, Save A Lot, Super-Pharm, Instacart-enabled
    retailers, and Walmart-related local-fulfillment activity all point to buyers with demanding inventory and service
    requirements. At the same time, Fabric’s Dallas launch with Chill Brands and its public Maersk reference show
    it has also tried to position its technology for broader e-commerce or enterprise fulfillment use cases. The
    use-case pages add a second layer of segmentation. Fabric is not only targeting consumer delivery; it also targets
    store replenishment, cross-channel partnerships, and nearby inventory nodes. That suggests the buyer can be
    a grocer, a retailer, a platform-linked operator, or a logistics-heavy brand that is willing to redesign fulfillment
    around speed and density. The pattern also suggests Fabric is selling where fulfillment is strategic enough
    to justify operational change, which usually means fewer, larger accounts rather than a long tail of transactional
    customers.
  claimRefs:
  - CU001
  - CU002
  - CU015
  - CU017
  - CU019
  - CU026
  tableRefs:
  - TU001
  - TU002
- id: named-proof
  title: 'Named customer proof: strongest accounts and what they actually prove'
  body: >-
    Super-Pharm is the strongest proof point because it combines claimed operating metrics with repeat-customer
    behavior. Fabric says Super-Pharm shifted 90% of home-delivery volume to micro-fulfillment, increased fulfillment
    250%, achieved 99% pick accuracy, and expanded to a second site after a successful initial deployment. FreshDirect
    is the best independently corroborated customer, with multiple trade outlets describing the D.C. expansion and
    the company itself calling the relationship a blueprint for future upgrades. Save A Lot is the freshest proof
    point. Multiple outlets in October 2024 treated the Brooklyn launch as a live operating deployment involving
    Fabric and Uber. Together these customers prove more than experimental interest: they show real operations,
    repeat buying in at least one case, and continued relevance in 2024. What they do not prove is how broad Fabric’s
    installed base is beyond this visible set.
  claimRefs:
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
