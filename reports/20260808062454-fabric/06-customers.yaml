- id: durability
  title: Durability, expansion, and concentration
  body: >-
    The strongest public durability signal is the Super-Pharm expansion, which reads like a returning-customer case
    rather than a one-off pilot. FreshDirect also suggests land-and-expand logic because the D.C. deployment was
    described as a blueprint for future market upgrades. Orchestra creates one more possible expansion vector by
    reaching beyond the initial install into planners, operators, and managers. However, the public record is thin
    on the usual customer-health metrics. There is no disclosed NRR, GRR, churn, renewal rate, contract length,
    customer count, or pilot-to-production conversion data. Because the named set is small and high profile, concentration
    risk is a live concern. Fabric may have other customers, but the public story does not show whether revenue
    is broadly distributed or anchored in a few logos and partner-mediated deployments. In other words, the public
    record is better at proving that Fabric can win notable logos than at proving that it can retain a broad cohort
    of them over time.
  claimRefs:
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU028
  - CU032
  - CU033
  tableRefs:
  - TU005
  - TU006
- id: verdict
  title: Customer verdict and what remains unresolved
  body: >-
    The customer case for Fabric is good enough to reject the idea that the company never found real users. Super-Pharm,
    FreshDirect, and Save A Lot each provide different kinds of proof—operating metrics, independent corroboration,
    and freshness. Instacart and Walmart-related evidence suggest that Fabric also earned attention from larger
    platform and retailer ecosystems. But there is still a major gap between named proofs and underwritten customer
    quality. CTech’s 2024 layoff coverage is the main disconfirming reminder that visible customer logos do not
    ensure smooth commercial scaling. The right conclusion is therefore balanced: Fabric has credible production-level
    customer evidence and at least one clear repeat account, yet public data is still insufficient to assess concentration,
    retention breadth, or lifetime value with confidence. Any investment view that assumes low concentration or
    strong cohort retention would therefore be importing facts not present in the public record. That caution matters materially.
  claimRefs:
  - CU016
  - CU020
  - CU027
  - CU029
  - CU031
  - CU035
