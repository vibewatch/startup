      - number: '7.3'
        title: 商业、客户和财务 / 模型风险
        blocks:
          - type: paragraph
            body: >-
              最重的剩余风险仍是商业和财务。Fabric 的具名客户证明真实存在，但仍有选择性：Super-Pharm 是最好的复购账户证据，FreshDirect 历史上印证充分，Save A Lot
              是最新的上线运营证明。这足以反驳 Fabric 从未达到市场适配的说法，但不足以证明广泛客户多元化或耐久经济性。2022 年和 2024
              年反复裁员让资本故事始终处在中心。业务看起来还活着，但当前现金、积压订单、债务和毛利率仍未披露。品类历史也不友好：Takeoff
              破产直接警示，零售商对微型履约的兴趣可以与供应商经济性薄弱共存。与此同时，Symbotic
              等更大玩家带着更多规模和持久力进入采购竞争，抬高了竞争生存门槛。正是这种不透明度让风险评级保持高位，即便公司仍显示市场相关性的证据。
