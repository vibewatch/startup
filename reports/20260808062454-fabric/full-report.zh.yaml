      - number: '6.4'
        title: 客户结论和仍未解决的问题
        blocks:
          - type: paragraph
            body: >-
              Fabric 的客户案例足以反驳「公司从未找到真实用户」的说法。Super-Pharm、FreshDirect 和 Save A Lot 各自提供了不同证明——运营指标、独立印证和新鲜度。Instacart 和
              Walmart 相关证据说明 Fabric 也获得了更大型平台和零售生态关注。但具名证明和可承销客户质量之间仍有重大缺口。CTech 2024
              年裁员报道是主要反证提醒：可见客户标识不保证商业扩张顺畅。正确结论因此是平衡的：Fabric
              有可信的生产级客户证据，且至少有一个清晰复购账户，但公开数据仍不足以有把握评估集中度、留存广度或客户终身价值。任何假设低集中度或强队列留存的投资观点，都是把公开记录中不存在的事实带入模型。这个谨慎点非常重要。
