      - number: '6.3'
        title: 耐久性、扩张和集中度
        blocks:
          - type: paragraph
            body: >-
              最强的公开耐久性信号是 Super-Pharm 扩张，它读起来像回头客案例，而不是一次性试点。FreshDirect 也暗示落地后扩张逻辑，因为 D.C. 部署被描述为未来市场升级蓝图。Orchestra
              通过触达计划人员、运营人员和经理，又创造了一个可能的扩张向量。不过，公开记录在常见客户健康指标上很薄。没有披露
              NRR、GRR、流失率、续约率、合同期限、客户数量或试点到生产转化数据。由于具名客户集小且高调，集中度风险是真实问题。Fabric
              可能还有其他客户，但公开故事没有说明收入是广泛分散，还是锚定在少数客户标识和伙伴中介部署上。换句话说，公开记录更擅长证明 Fabric 能赢下知名客户标识，而不擅长证明它能随时间留住一组广泛队列。
