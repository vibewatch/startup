      - number: '1.3'
        title: 融资历史、投资者基础和客户验证
        blocks:
          - type: paragraph
            body: >-
              资本故事是 Fabric 公开画像中最清楚的部分。CommonSense Robotics 在更早 US$6 million 种子阶段之后，于 2018 年初完成 US$20 million Series A
              轮；随后在 2021 年 10 月完成 US$200 million Series C 轮，由 Temasek 领投，大型财团包括 Koch Disruptive Technologies、CPP
              Investments 等。该轮把公司估值推到 US$1 billion 以上，并公开把 Fabric 标记为机器人履约独角兽。不过，公开来源对累计融资存在分歧：2021 年官方新闻稿称截至当时为 US$336
              million，而 2024 年和 2025 年来源引用 US$375 million。客户和伙伴证明强于公开财务披露。Fabric 出现在 Instacart、Walmart、FreshDirect，以及后来的
              Save A Lot 和 Uber 战略履约公告中。客户证据横跨试点、零售商部署和伙伴主导工作流，比无差别 logo 幻灯片更有意义。即便如此，仍没有公开收入、ARR
              或利润率披露，无法说明这张关系图有多少转化为耐久、规模化经济性。
