      - number: '5.4'
        title: 信任、安全、合规和产品风险
        blocks:
          - type: paragraph
            body: >-
              信任图景是混合的。Fabric 确实提供了一些运营细节：冷藏工作站、可选消防抑制、三温区运营、受监控控制室，以及适合企业系统的集成模式。OSHA 和 FDA
              来源也说明，杂货履约处在真实安全和食品处理义务之内，因此部署负担在运营上很严肃。但公开层面仍缺少几件事。来源集没有提供经验证正常运行时间或 MTBF、正式公开安全认证、广泛公开 API
              文档或独立性能测试。缺席并不证明弱点，但会抬高尽调负担。主要负面产品提醒来自品类本身：Takeoff 失败说明，吸引人的 MFC 工作流在实施复杂度、经济性或客户适配撑不住时仍会解体。正确结论是，Fabric
              的产品愿景具体且可信，但其可靠性和信任公开证明仍不完整。对尽调而言，这意味着工程深度比保障包更可信；买方今天若要把平台视为生产环境中已充分去风险，仍需要私有验证室。
