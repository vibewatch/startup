  - id: FI001
    title: 资本密集度 / 现金流图
    type: matrix
    layout: wide
    summary: Fabric 的现金流画像，一端受资本密集部署成本影响，另一端受软件扩张改善利润率影响。
    data:
      columns:
        - 方向
        - 公开证据
        - 财务含义
      rows:
        - label: 硬件部署收入
          values:
            - 正向现金流入
            - 项目型安装
            - 合同金额可能很大但不平滑
        - label: 实施劳动力
          values:
            - 负向现金流出
            - 企业站点启动
            - 可能压缩项目利润率
        - label: 软件编排
          values:
            - 正向组合转移
            - Orchestra 发布
            - 最有希望成为经常性、高利润率收入
        - label: 服务 / 支持负担
          values:
            - 负向或混合
            - 由运营站点暗示
            - 如果过于劳动密集，会侵蚀可扩展性
        - label: 客户来自节省劳动力的 ROI
          values:
            - 正向需求驱动
            - 来自 Exotec 的可比基准
            - 帮助证明资本开支并扩大管线
        - label: 客户来自损耗 / 培训节省的 ROI
          values:
            - 正向需求驱动
            - Fabric 软件主张
            - 可提高支付意愿
        - label: 裁员 / 烧钱控制
          values:
            - 对跑道正向、对增长负向
            - 2022 年和 2024 年裁员
            - 显示主动保存现金
        - label: 未披露积压订单
          values:
            - 负向信息缺口
            - 没有公开 Fabric 积压订单
            - 让预测变难
        - label: 未披露现金余额
          values:
            - 负向信息缺口
            - 没有公开现金披露
            - 无法估计现金跑道
        - label: 需求顺风
          values:
            - 正向收入背景
            - FMI 和 Census 需求数据
            - 支撑客户支出兴趣
        - label: 同行失败风险
          values:
            - 负向品类信号
            - Takeoff 破产
            - 抬高单位经济性证明门槛
        - label: 公开同行规模差距
          values:
            - 负向竞争信号
            - Symbotic / Ocado / KION 规模
            - Fabric 必须在可见资本深度更弱的情况下证明效率
