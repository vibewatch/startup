  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和对 Fabric 真正重要的切片
        blocks:
          - type: paragraph
            body: >-
              公开来源至少描述了三个重叠场域。第一是广义微型履约市场：靠近城市需求的紧凑仓储能力，通常作为本地配送经济性的一部分来评估。第二是更窄的微型履约自动化市场，隔离出这些站点内使用的机器人存储、拣选和软件系统。第三是更窄的编排层，用来在混合履约环境中协调库存、劳动力、机器人和订单流。Fabric
              横跨三者，但权重并不相同。它的营销明确面向杂货，产品家族覆盖实体站点形态加工作流软件。这意味着，通用仓库自动化 TAM 会夸大直接相关市场，而过小的纯软件视角又会低估 Fabric
              想要拥有的运营范围。尽调时正确的市场框架，是聚焦杂货的细分市场：紧凑自动化和软件编排必须在真实零售运营中一起跑通。
