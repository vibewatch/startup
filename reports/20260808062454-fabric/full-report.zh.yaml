      - - 软件层执行
        - Orchestra 采用不及预期或重大 bug 事故
        - 没有运营员采用牵引力，或出现重大 AI / 工作流事故
        - 下调软件护城河投资逻辑
      - - 合规 / 信任
        - 无法提供安全或食品安全保障包
        - 尽调室没有可信企业保障包
        - 将其视为受监管杂货商部署的投资逻辑破裂
    notes: 触发器聚焦会快速传导到融资、客户或估值损害的事件。
    claimRefs:
      - CR029
      - CR037
      - CR038
      - CR039
      - CR040
      - CR049
      - CR050
  - id: TR007
    title: 运营缓释摘要表
    columns:
      - 缓释
      - 帮助解决的问题
      - 证据
      - 剩余局限
    rows:
      - - 控制室和监控
        - 防止中断
        - '>95% 问题解决声称'
        - 未经独立审计
      - - Ops Pilot 和培训工具
        - 入职和运营员一致性
        - Flow 和 Orchestra 材料
        - 没有公开生产率 / 错误数据
      - - 伙伴计划
        - 实施触达
        - Partner Elite Program
        - 渠道质量不由公司直接控制
      - - Reply 连接器
        - WMS 集成速度
        - Reply 合作
        - 依赖第三方路线图
      - - 专利多周转箱设计
        - 功能差异化
        - 2024 年专利公告
        - 没有公开执行历史
    notes: 缓释存在，但大多数仍是公司撰写的证明。
    claimRefs:
      - CR007
      - CR015
      - CR037
      - CR047
      - CR050
  - id: TR008
    title: 风险排名摘要表
    columns:
      - 风险集群
      - 当前评级
      - 主要证据
      - 投资含义
    rows:
      - - 资本 / 现金跑道不透明
        - 高
        - 裁员 + 当前现金未披露
        - 需要对融资敏感的承销
      - - 运营 / 部署复杂度
        - 高
        - 三角站点、三温区工作流、集成层
        - 要求标准化和事故控制证明
      - - 客户集中度 / 耐久性
        - 高
        - 选择性具名客户集，分母有限
        - 需要头部客户暴露和续约数据
      - - 合规 / 信任证据缺口
        - 中高
        - 隐私 + FSMA/OSHA 背景，没有深度保障包
        - 需要安全和食品安全尽调室
      - - 竞争生存压力
        - 中高
        - Symbotic 规模、客户利润率紧张
        - 细分差异化必须保持锐利
    notes: 高风险不等于马上失败；它意味着投资逻辑高度敏感于公开来源无法闭合的隐藏变量。
    claimRefs:
      - CR032
      - CR033
      - CR034
      - CR049
      - CR050
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 结论
      - 证据
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 真实运营证明存在，但当前财务披露弱
        - 承销价格前做更多工作
      - - 置信度
        - 中
        - 运营有足够相互印证；经济性不足
        - 避免虚假精确
      - - 风险评级
        - 高
        - 裁员、不透明和品类下行类比仍然重大
        - 使用对下行敏感的条款
      - - 估值立场
        - 按 2021 年标记看偏高
        - 上一次公开价格相对今日证据已经过时
        - 要求折价或更好数据
      - - 当前行动
        - 观察名单，带尽调触发器
        - 监控融资、客户扩张和披露恢复
        - 准备有条件报价，而不是立即出价
    notes: 本表把本章主张集转化为投委会速记式决策框架。
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV039
      - CV040
      - CV043
      - CV050
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 当前支撑
      - 什么会改变观点
    rows:
      - - 市场需求真实存在
        - FMI、NIQ 和 Census 都支持电商履约需求具备耐久性
        - 单纯需求放缓不会打破投资逻辑；公司层经济性更重要
      - - 客户证明真实但有选择性
        - Super-Pharm、FreshDirect 和 Save A Lot 都支撑上线用例
        - 更广披露的客户名单或续约会提高信心
      - - 软件选择权可能提升价值
        - Orchestra 和集成材料显示更高层雄心
        - 实际软件收入或采用证据会抬高观点
      - - 财务不透明很严重
        - 没有当前公开收入、利润率、现金或积压订单包
        - 经审计或董事会级运营数据会把判断推向观察
      - - 品类下行真实存在
        - Takeoff 失败和 Attabotics 重置显示供应商风险
        - 持续客户扩张且无融资压力会缓释这一点
      - - 对成熟独角兽而言，证据质量低于预期
        - 页面损坏和新闻室空白降低尽调效率
        - 恢复披露界面并更新运营证明会提高定价信心
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV013
      - CV017
      - CV018
      - CV025
      - CV029
      - CV045
      - CV046
      - CV047
      - CV049
    notes: 论点是方向性的，取决于公开证据包，而非管理层尽调室。
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 价值区间
      - 概率信号
      - 关键触发器
    rows:
      - - 乐观
        - Orchestra 变现、复购客户扩张、无融资压力，紧凑节点经济性规模化
        - US$1.2B-US$1.6B
        - 可能，但需要非公开证明
        - 当前收入和利用率向上超预期
      - - 基准
        - Fabric 仍有相关性，赢下选择性扩张，但资本和披露仍受限
        - US$0.6B-US$0.9B
        - 与当前证据最一致
        - 没有重大爆雷，但也没有清晰证据支撑 2021 年标记
      - - 悲观
        - 进一步收缩、客户回滚或融资压力导致 down-round 或资产出售
        - US$0.2B-US$0.5B
        - 实质下行路径
        - 更多裁员、尽调室数据弱，或旗舰客户流失
    notes: 区间是锚定证据包的情景估算，不是机械估值模型。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 公开状态 / 锚点
      - 说明
      - 与 Fabric 的相关性
      - 局限
    rows:
      - - Fabric (2021 Series C)
        - 私募轮估值 >US$1B
        - 历史周期高点私募锚点
        - 直接公司专属价格参考
        - 已过时，且当前披露不支撑
      - - Symbotic
        - 上市，披露大型积压订单和主要零售关系
        - 自动化可以成为非常大的公开股权故事
        - 最好的上行规模参考
        - 规模和披露远超 Fabric
      - - Ocado
        - 上市杂货自动化平台，有当前业绩节奏
        - 尽管复杂，杂货自动化仍可维持战略价值
        - 模型相邻的杂货基准
        - 混合商业模式和公开市场噪音降低可迁移性
      - - AutoStore
        - 上市自动化平台，有投资者披露
        - 高密度自动化存储可支撑耐久品类价值
        - 模块化自动化上最接近的架构风格参考
        - 不是直接托管履约类比
      - - KION / Dematic
        - 大型既有企业，有经审计报告和杂货部署
        - 战略买方存在，品类价值可嵌入更广自动化集团
        - 有用的退出和基准参考
        - 集团结构遮蔽纯业务倍数
      - - Takeoff / Attabotics
        - 困境或 GTM 重置参考
        - 需求不能消除股权下行
        - 下行和重组类比
        - 不是精确定价基准
    notes: 可比集合是为模型相关性、战略基准和下行框架而选，不是为直接迁移倍数而选。
    claimRefs:
      - CV001
      - CV015
      - CV016
      - CV017
      - CV018
      - CV032
      - CV041
      - CV044
    enumerationScope:
      coverage: sample
      basis: >-
        Rows include the highest-signal public and private references from the reviewed source pack: direct company
        anchor, scaled public automation leaders, strategic incumbents, and downside analogs.
  - id: TV005
    title: 融资背景和价格纪律表
    columns:
      - 项目
      - 当前公开证据
      - 承销解读
      - 定价含义
    rows:
      - - 最近定价轮
        - 2021 年 Series C 轮，估值 >US$1B
        - 真实历史验证，但已很旧
        - 今天不能按面值使用
      - - 累计融资
        - 2021 年官方为 US$336M，后续 CTech 引用 US$375M
        - 资本历史并不完全干净
        - 需要股权结构表和融资调节
      - - 重组历史
        - 2022 年和 2024 年报道裁员
        - 执行和现金跑道压力可能很重要
        - 应用压力折价
      - - 当前运营证明
        - Save A Lot、Super-Pharm、FreshDirect、Orchestra 等证据
        - 有足够实质让案例继续成立
        - 不应按零承销，但也不能盲目支付溢价
      - - 当前缺失指标
        - 没有公开收入、利润率、积压订单、现金或利用率包
        - 核心估值输入缺失
        - 要求折价或更深尽调
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV027
      - CV028
      - CV029
      - CV039
      - CV040
    notes: 定价含义是判断题，并明确惩罚财务和股权结构信息缺失。
  - id: TV006
    title: 公开证据质量和尽调摩擦表
    columns:
      - 界面
      - 运行日期观察
      - 重要性
      - 对置信度的影响
    rows:
      - - 新闻室
        - 没有返回可读文本
        - 更难高效审阅当前公告
        - 对尽调速度为负面
      - - 劳动力主题博客 URL
        - '404'
        - 围绕劳动力经济性的公开叙事更难审阅
        - 对置信度为负面
      - - FreshDirect 客户页面
        - '404'
        - 重要客户证明现在依赖更旧材料
        - 对客户证明新鲜度为负面
      - - 独立 Grocery Dive 解释文章
        - '404'
        - 从易审阅路径中移除了一个背景性第三方解释
        - 对三角验证为负面
      - - 没有当前财务包
        - 保留集中仍无公开收入 / 利润率 / 现金披露
        - 估值必须保持区间化和折价
        - 对定价信心为强负面
      - - Progressive Grocer FreshDirect URL
        - '404'
        - 一个已知客户的另一条独立证明路径现在更难审阅
        - 对三角验证为负面
    notes: 这些单独看不是投资逻辑杀手；它们重要，是因为公开财务披露本就偏薄，且若干历史证明路径现在更难复核。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV029
      - CV049
      - CV051
  - id: TV007
    title: 投资逻辑破裂和否决触发器表
    columns:
      - 触发器
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 进一步重组
        - 在更好运营证明出现前，又发生有意义裁员或防御性融资
        - 显示现金跑道或需求错配恶化
        - 暂停或大幅重新定价案例
      - - 旗舰客户回滚
        - Save A Lot 或 Super-Pharm 收缩，且没有抵消性赢单
        - 打破当前耐久性叙事
        - 提高集中度折价或回避
      - - 软件层不及预期
        - 看不到 Orchestra 采用迹象，或出现重大工作流失败
        - 削弱软件上行投资逻辑
        - 转向基准 / 悲观低端判断
      - - 数据室失败
        - 管理层无法提供当前收入、毛利率、现金和积压订单数据
        - 核心估值输入仍未解决
        - 不接近上一轮标记付款
      - - 披露恶化
        - 更多页面损坏，或无法恢复证明路径
        - 降低对报告成熟度的信任
        - 下调建议
    claimRefs:
      - CV031
      - CV035
      - CV039
      - CV040
      - CV042
      - CV043
      - CV050
    notes: 触发器按能快速传导到价值、融资或客户耐久性的事件选择。
  - id: TV008
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入和毛利率
        - 当前收入桥、按站点 / 软件 / 服务划分的毛利率
        - 判断 2021 年标记是否站得住所必需
        - 要求董事会材料或 QoQ KPI deck
      - - 现金、债务和跑道
        - 现金余额、债务条款、契约状态、融资计划
        - 决定近期生存能力和议价能力
        - 要求资金 / 融资更新
      - - 站点数量和利用率
        - 上线站点、爬坡队列、填充率 / 产能数据
        - 区分已安装 logo 和生产性资产
        - 要求按站点提供运营仪表盘
      - - 客户集中度和续约
        - 头部客户收入占比、合同条款、续约队列
        - 衡量脆弱性和耐久性
        - 要求销售财务队列视图
      - - 股权结构表和优先权
        - 优先股堆叠、清算条款、老股悬挂
        - 实质改变普通股吸引力
        - 要求最新股权结构表和融资文件
      - - 安全 / 合规包
        - SOC / ISO 状态、食品安全控制、事故历史
        - 企业级尽调和退出准备所必需
        - 向法务 / 运营要求保障资料夹
    claimRefs:
      - CV026
      - CV029
      - CV039
      - CV040
      - CV042
      - CV043
      - CV050
    notes: 这些要求按能移动建议、置信度或情景区间的能力排序。
