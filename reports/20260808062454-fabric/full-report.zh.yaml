      - number: '7.2'
        title: 运营、技术和伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              Fabric 的运营模型恰恰在最难执行的地方最有力量。公司声称能把自动化装进非常规空间，跨多个温区工作，并通过不断扩展的软件层编排复杂履约流。这在商业上有吸引力，但同时提高工程、安全和可靠性风险。技术故事也超出
              Fabric 自己的机器人：公司依赖云平台、API、WMS/ERP 连接、配送伙伴，以及 Reply 等第三方集成关系。渠道风险也类似。Fabric 自己的 Partner Elite Program
              显示，公司希望借助集成商、推荐伙伴和 OEM 的帮助，这能扩大触达，也会减少直接控制。公开缓释故事真实存在——控制室监控、95%
              问题解决声称、入职工具和模块化话术——但大多仍是自我描述，而非独立审计。硬件、软件、食品处理和伙伴集成组合在一起，使这成为系统之系统风险，而不是单一组件风险。
