      - number: '1.4'
        title: 里程碑、战略重置和当前状态
        blocks:
          - type: paragraph
            body: >-
              Fabric 的里程碑路径可分为三段。第一段是技术证明：2018 年 Tel Aviv 启动，并证明自动化能塞进小型城市空间。第二段是扩张和验证：2020 年 FreshDirect 启动、2021 年
              Walmart 和 Instacart 公告，以及 2021 年独角兽融资。第三段是收缩和重新定位。CTech 2024 年 4 月报道显示，Fabric 已在 2022 年 7 月裁掉 150 个岗位，并计划
              2024 年再裁 30 人，同时从全栈机器人仓库销售模型转向销售技术和软件。这可以被解读为困境，但未必是终局困境。Fabric 2024 年 Save A Lot 和 Uber 启动，以及 2025 年
              Orchestra 发布，说明公司仍在交付产品，也仍在尝试把机器人转译成更软件定义的运营模型。因此，核心尽调问题不是 Fabric
              是否仍存在；它显然存在。问题是这次重置是否足以改善资本效率和商业可行性，从而支撑一个已经过时的独角兽估值基准。
