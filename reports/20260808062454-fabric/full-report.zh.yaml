  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同行、既有企业、替代方案和相邻威胁
        blocks:
          - type: paragraph
            body: >-
              评估 Fabric 的零售商并不只是在一批相似创业公司之间选择。直接同行包括 Attabotics 等高密度存储和微型履约专家，以及历史上的 Takeoff 模型。相邻集合包括 AutoStore
              加集成商、Exotec、Symbotic；即便它们主要运营模型不同于城市杂货 MFC，也都能声称带来劳动力、吞吐或密度收益。既有企业集合包括 Ocado 和
              Dematic/KION，它们带来公开市场可见度、杂货引用客户和更广实施资源。最后，替代集合包括门店人工拣选、半机械化后场流程，以及 Walmart 本地履约方法这类零售商主导的多供应商架构。这意味着
              Fabric
              竞争的不只是产品功能；它还在和买方对规模、渠道触达、实施确定性的信任竞争。实践中，最相关的问题往往是：买方相信哪种架构能交付服务收益，同时不带来运营脆弱性。较小组件供应商也在边际上重要，因为买方有时可以用模块化存储解决部分工作流，并把更多外围技术栈留在内部。
