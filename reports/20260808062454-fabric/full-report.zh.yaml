      - number: '8.4'
        title: 退出准备度和最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Fabric 还不足以按 IPO 视角承销。更可能的退出集合是卖给更大的自动化或物流平台、由内部主导的结构化融资，或在更深尽调闭合信息缺口后进行持平 /
              下行私募轮。能把判断上调的因素很直接：当前收入和毛利率证据、可信的站点层利用率数据、更清楚的客户集中度指标，以及关于股权结构表和现金跑道的硬信息。会把判断下调的因素也同样清楚：再次重组、失去旗舰客户、无法产出尽调室保障包，或更多证据显示公开披露在衰退而非改善。因此，建议仍是继续研究，而不是观察或买入。这里有足够实质值得持续关注，但没有足够当前证明，让人有把握地按历史价格锚点承销。
