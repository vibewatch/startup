  - id: FV002
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: IC 风格评分卡，总结 Fabric 在当前公开证据下的强项和弱项。
    data:
      items:
        - label: 市场吸引力
          value: High
          note: 在线生鲜杂货和城市履约的需求背景仍然真实
        - label: 客户证明
          value: Medium
          note: 真实客户标识和复购信号存在，但缺少分母数据
        - label: 产品 / 软件选择权
          value: Medium
          note: Orchestra 和集成层有帮助，但公开证据尚未证明变现
        - label: 财务透明度
          value: Low
          note: 审阅材料中没有当前公开收入、利润率、积压订单或现金包
        - label: 资本风险
          value: High
          note: 裁员和不透明度让融资敏感性保持高位
        - label: 可比公司支持
          value: Medium
          note: 有可用的公开可比公司，但没有一个能直接套用
        - label: 2021 年估值标记下的吸引力
          value: Low
          note: 若没有私有尽调支撑，历史独角兽价格很难站住
        - label: 证据质量
          value: Low-Medium
          note: 足够进入观察名单尽调，不足以支持有把握买入
    approximationNotes: 评分来自支撑性主张和披露质量，是投委会速记，不是模型生成结果。
