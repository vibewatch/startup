            body: >-
              Super-Pharm 是最强证明点，因为它把公司声称的运营指标与复购客户行为结合起来。Fabric 称 Super-Pharm 将 90% 的送货上门量转到微型履约，履约量增长 250%，拣选准确率达到
              99%，并在首次部署成功后扩张到第二个站点。FreshDirect 是独立印证最好的客户，多家行业媒体描述 D.C. 扩张，公司自身也称这段关系是未来升级蓝图。Save A Lot 是最新鲜的证明点。2024 年
              10 月多家媒体把 Brooklyn 启动视为一项涉及 Fabric 和 Uber 的上线运营部署。合起来看，这些客户证明的不只是实验性兴趣：它们显示真实运营、至少一个案例中的复购，以及 2024
              年仍有相关性。它们不能证明的是，在这组可见客户之外，Fabric 的装机基础有多广。
