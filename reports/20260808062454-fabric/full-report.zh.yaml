chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部和运营模型
        blocks:
          - type: paragraph
            body: >-
              Fabric 前身为 CommonSense Robotics，2015 年创立，目标是让杂货和其他零售品类的高密度城市履约在经济上可行。公司的公开身份略有分叉：Craft 目前列示总部在 Tel
              Aviv-Yafo，而 Fabric 2021 年独角兽融资新闻稿强调其在 New York City、Tel Aviv、Atlanta 设有办公室，并描述 New York City、Washington,
              D.C.、Tel Aviv 有活跃运营。综合来看，证据支持的是一家在以色列创立、运营足迹横跨以色列和美国的公司，而不是纯单一司法辖区画像。产品主张也随着时间变得更宽。Fabric
              当前首页把业务定位为专为杂货设计，强调三温区自动化、订单合并、城市部署灵活性，以及从更大的集中式设施到紧凑 Micro Fulfillment Centers、Nano Express 模块和
              Quick-Pick 工作站的多种履约形态。这个运营模型对尽调重要，因为它说明 Fabric 卖的不是单个仓库盒子；它营销的是一组软硬件系统，可适配不同零售地产和服务模型。
