      - number: '3.4'
        title: 护城河耐久性、锁定效应和可能打破竞争投资逻辑的因素
        blocks:
          - type: paragraph
            body: >-
              这个品类既有高切换成本，也有高商品化风险。一旦零售商安装实体自动化系统，存储几何结构、WES
              逻辑、劳动力设计和异常处理流程会形成真实锁定。与此同时，许多供应商现在围绕密度、吞吐、正常运行时间和劳动力节省提出相似主张，因此单靠硬件故事不是耐久护城河。公开比较定价也很难，进一步说明供应商是通过定制方案和采购谈判竞争，而不是透明包装。Takeoff
              破产给出更尖锐警示：强叙事和真实零售商需求可以与糟糕供应商经济性共存。对 Fabric
              来说，最可能耐久的护城河因此不是单独的机器人盒子或穿梭车，而是工作流智能、零售商专属运营数据，以及上线后替换会带来痛感的软件。否则，公司会面临上方大型既有企业和旁侧硬件商品化的夹击。若买方把紧凑自动化视为可从多个供应商替换或组装的模块化设备，而不是独特操作系统，这一点尤其成立。
