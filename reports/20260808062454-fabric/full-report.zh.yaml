      - number: '4.4'
        title: 资本充足度、融资依赖和最终结论
        blocks:
          - type: paragraph
            body: >-
              Fabric 显然融到足够资金来搭建一家严肃业务，但当前充足度未知。2021 年 Series C 轮融资 US$200 million，当时报道称 Fabric 已融资超过 US$336
              million。后续材料和报道引用累计资本约 US$375
              million，造成一个公开不一致；这个差异可以解释，但公开资料中没有干净调节。更重要的是，真正关键的当前数字——手头现金、月度烧钱、债务、积压订单、毛利率和剩余现金跑道——均未披露。2022 年和 2024
              年裁员强烈暗示管理层被迫管理烧钱并重置战略。同时，持续发布和客户引用又说明公司仍在交付产品，而不只是保留一个空壳。正确结论因此是混合的：Fabric
              有收入质量信号和市场需求，但在管理层提供当前财务披露前，投资案例仍依赖融资。换句话说，公开证据支持运营延续性，不支持资本充足性。
