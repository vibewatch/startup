      - number: '2.3'
        title: 买方、用户和被采购解决的运营问题
        blocks:
          - type: paragraph
            body: >-
              预算负责人通常是零售商、杂货商或批发 / 分销运营商，但用户和痛点会随工作流而变。Pattison Food Group 等大型杂货分销商购买自动化，是为了提升门店补货吞吐和跨数千 SKU 的拆箱处理。城市
              MFC
              买方逻辑不同：他们购买的是受限地产内的订单密度、速度和服务质量。杂货自动化还必须同时调和多种模式——门店补货、路边取货、当日或次日配送——因此买方往往试图把几条工作流压缩进同一个运营骨干。公开竞争证据表明，市场并不是在「软件」和「硬件」之间做选择，而是在不同的全栈组合之间选择：存储密度、吞吐、编排质量和集成负担。因此，Fabric
              的买方图谱包括杂货商、数字零售商，以及想要分阶段部署、而不是单个区域巨型项目的运营商。
