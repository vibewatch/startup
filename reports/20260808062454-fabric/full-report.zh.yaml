              具名账户模式说明 Fabric 卖给复杂运营商，而不是大量轻量客户。公开故事由杂货和相邻零售主导：FreshDirect、Save A Lot、Super-Pharm、Instacart 赋能零售商，以及
              Walmart 相关本地履约活动，都指向库存和服务要求很高的买方。同时，Fabric 在 Dallas 与 Chill Brands 的启动，以及公开 Maersk
              引用，说明它也尝试把技术定位到更广电商或企业履约用例。用例页面增加了第二层细分。Fabric
              不只瞄准消费者配送；它也瞄准门店补货、跨渠道合作和附近库存节点。这说明买方可以是杂货商、零售商、平台关联运营商，或愿意围绕速度和密度重设计履约的重物流品牌。这个模式也暗示 Fabric
              在履约足够战略化、值得进行运营改变的地方销售；这通常意味着客户更少但更大，而不是长尾交易型客户。
