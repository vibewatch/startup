        blocks:
          - type: paragraph
            body: >-
              Fabric 的创始团队比当前治理结构更清楚。早期和后续报道把 Ori Avraham、Eyal Goren、Elram Goren、Shay Cohen 列为创始人，其中 Elram Goren 在 2018
              年和 2021 年来源中是对外可见的 CEO 兼联合创始人。本次运行找到的最新公开领导层信号没那么直接：CTech 2024 年 4 月报道称 Avi (Jack) Jacoby 已于 2022 年接任
              CEO，Curt Avallone 则在裁员公告前几周刚被任命为联席 CEO。Fabric 2025 年 Orchestra 新闻稿仍把联合创始人 Ori Avraham
              列为产品副总裁，显示高管团队至少保留了一些创始人延续性。明显缺席的是对董事会、正式治理或所有权控制的同等公开披露。这个缺口重要，因为公司在独角兽轮次后经历了大规模裁员和战略重置，但外部观察者很难直接看清现在谁在治理资本配置、产品方向或转型问责。
