  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Fabric 以客户工作流交付什么
        blocks:
          - type: paragraph
            body: >-
              Fabric 的公开界面现在读起来像一套履约构件组合，而不是一个固定 MFC 套餐。公司营销面向较大都会区的集中式履约中心、面向高密度城市需求的本地 MFC、面向低成本三温区全篮子履约的 Nano
              Express、面向必需品和快消品的 Quick Pick，以及面向分阶段订单和远程取货的存储 / 分拣缓冲。在这些实体形态之上，它还映射 Fulfill、Replenish、Combine
              和存储缓冲等具体工作流。这一点重要，因为产品围绕客户任务来定义，而不是围绕单一机器人架构。同一家零售商理论上可根据自己需要更大集中式产能、本地当日速度、门店补货或伙伴赋能线上下单线下自提，选择不同站点形态和工作流层。公开证据足以描述这张菜单，即便各模块真实部署频率未披露。
