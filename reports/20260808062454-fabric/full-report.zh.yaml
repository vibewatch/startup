companyProfile:
  summary: >-
    Fabric 是一家在以色列创立的机器人微型履约公司，2015 年以 CommonSense Robotics 起步，如今销售一组履约系统，覆盖集中式履约中心、微型履约中心、Nano Express 节点、Quick Pick
    工作站，以及 Flow、Stack、Elevate、Orchestra 等软件层。公开客户证明包括早期 Tel Aviv 部署、Super-Pharm、FreshDirect、Walmart 相关本地履约活动，以及 2024 年
    Save A Lot + Uber Brooklyn 启动。公司 2021 年 10 月以 US$200 million Series C 轮、估值超过 US$1 billion
    达到独角兽状态，但后续公开报道显示裁员，并向技术和软件战略转移。Fabric 仍在运营且具备战略相关性，但当前收入、利润率、客户集中度和现金跑道仍未披露。
