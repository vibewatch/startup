      - number: '2.2'
        title: 规模测算视角：广义微型履约、窄口径自动化和需求背景
        blocks:
          - type: paragraph
            body: >-
              市场大到值得关注，但具体数字取决于统计对象。The Business Research Company 2026 年概览把广义微型履约市场定为 US$13.13 billion，而 Future Market
              Insights 将同年更窄的自动化市场定为 US$1.3 billion。这个差距不是噪音；它反映了范围上的真实差异。需求侧，可服务零售环境仍在扩张。U.S. Census Bureau 报告称，2026 年
              Q1 电商占美国零售总额 16.9%；FMI 和 NIQ 则称，在线杂货已经约占杂货总支出的五分之一，并可能到 2028 年达到 US$452
              billion。几乎所有杂货家庭现在都混合使用门店和数字渠道。这种组合为更快履约提供了耐久需求背景，但不会自动验证每个自动化供应商。Fabric 的 SAM 比广义 TAM
              更窄，因为它集中在能证明高密度自动化节点合理性的杂货和本地零售工作流。
