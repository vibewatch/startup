  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、隐私和监管风险
        blocks:
          - type: paragraph
            body: >-
              公开记录足以识别真实合规暴露，但不足以闭合风险。Fabric
              的隐私政策显示，公司至少在公开网站上收集和处理可识别及行为数据；其法律条款要求仲裁并限制救济。这些事实本身不证明有问题，但说明法律和隐私治理不是假设。由于 Fabric 在杂货和仓库环境中运营，OSHA
              安全义务和 FDA/FSMA 食品处理预期也很重要。问题在于证据深度：来源集没有浮现面向客户的公开安全认证包、详细食品安全控制框架，或更广诉讼地图。专利公告在进攻性 IP
              侧有帮助，但不能回答运营自由、可执行性或侵权风险。结果是中高法律和监管负担，公开缓释只有部分。实践中，这意味着法律尽调需要从公开网页政策走向客户、供应商和保险方文件，才能在当前可见度下把投资风险视为已充分映射。
