      - number: '8.2'
        title: 投资逻辑、反向逻辑和估值视角
        blocks:
          - type: paragraph
            body: >-
              投资逻辑有证据支撑，但很窄。在线杂货和电商持续需要更密、更快履约，Fabric 参与的是一个真实结构性需求故事。公司也有证据说明其系统能在真实客户场景中工作：Super-Pharm
              提供最好的复购账户证据，FreshDirect 提供历史印证，Save A Lot 显示公司在 2024 年底仍有商业活动。产品上，Orchestra
              以及支持和集成层重要，因为它们创造了通向更高价值软件和服务的路径，而不是纯硬件中心的承销。反向逻辑是，Fabric 仍像一家对执行敏感的自动化公司，而不是已去风险的软件平台。公开来源暴露了成本重置、Takeoff
              这类直接下行类比，以及一个远落后于投资者本能想使用的公开可比公司的披露画像。正确估值视角因此是混合模型且重折价：一部分机器人集成商，一部分工作流软件，一部分托管履约运营商，并给予显著不透明度折价。
