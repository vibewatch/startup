      - number: '3.2'
        title: Fabric 与最接近创业型同行的差异
        blocks:
          - type: paragraph
            body: >-
              Fabric 最强的同行层叙事，是它并非只卖一个机器人模块。其自有材料把产品定位在 B2C 履约、B2B 补货，以及一个 AI-native
              编排层之上，用来协调库存、劳动力、订单、配送和机器人。这比立方体存储推介更宽，但又比全球仓库自动化通才更窄。Attabotics
              是最接近的结构类比，因为它同样强调高密度立方体存储、暗店适用性和模块化部署。Exotec 在吞吐、劳动生产率和杂货工作流灵活性上重叠更多。Takeoff
              即便失败也很重要，因为它代表品类专属下行：零售商友好的用例并不保证供应商业务耐久。Fabric 2024
              年后的技术和软件转向也有竞争意义，因为这暗示管理层正在用工作流智能做差异化，而不是只在定制硬件部署军备竞赛中取胜。2025 年发布的行业报道也强化了这一重新定位已经在 Fabric 自有网站之外可见。
