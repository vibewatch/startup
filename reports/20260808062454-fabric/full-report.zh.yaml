      - number: '3.3'
        title: 既有企业和伙伴生态可能压过较小私营供应商的地方
        blocks:
          - type: paragraph
            body: >-
              上市公司和集成商背书的竞争者优势明显。Ocado 2026 年业绩仍显示杂货自动化商业动能活跃；Symbotic 的积压订单和 Walmart
              暴露则说明零售商资本开支可以围绕单一规模化供应商高度集中。AutoStore、Attabotics 和 Exotec 也分别显示渠道力量的重要性：Fives、SAVOYE、Komar
              和其他生态伙伴扩大销售触达并降低实施摩擦。Dematic 增加了另一类威胁——一家有杂货引用客户、并有 KION
              资产负债表支持的既有集成商。这些因素重要，因为自动化交易很少只靠基准吞吐赢下。买方想要实施信心、服务覆盖，以及把自动化接入更广仓库工作流的路径。Fabric
              可能提供更锐利的杂货专属故事，但其渠道广度和资产负债表耐久性的可见证据少于最大的上市或集成商背书玩家。Symbotic 自身面向投资者的材料也强调食品和饮料供应链属于其目标领域，使其更难被视作不重叠。
