      - number: '4.3'
        title: 成本结构、ROI 逻辑和利润率路径
        blocks:
          - type: paragraph
            body: >-
              杂货自动化的经济性要求很高。来自 Dematic 和 Exotec 的公开可比材料表明，买方希望缓解劳动密集、人工走动、服务复杂度和零售利润率紧张。Fabric
              自身的软件叙事又增加一层：减少损耗、降低培训成本、简化入职，并改善日常运营决策。这些都具有经济意义，但不能抹掉资本设备、实施、服务和支持成本。因此，公司向软件转移在财务上非常关键。若更多价值通过编排软件交付，可能改善利润率组合，并随着时间让每个上线站点更有价值；但来源没有披露这一转型是否已经达到实质规模。最好的公开证据因此支撑的是一个可信的利润率改善故事，而不是一个已验证故事。NIQ
              2026 年全渠道需求工作进一步支持杂货商会继续为履约经济性花钱，但仍不能解决 Fabric 私有利润率披露缺口。OSHA 仓储指南也提醒我们，机器人减轻部分劳动力负担，但并不消除合规、培训和安全管理义务。
