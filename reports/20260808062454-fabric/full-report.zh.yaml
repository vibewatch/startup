      - number: '8.3'
        title: 情景框架和可比背景
        blocks:
          - type: paragraph
            body: >-
              因为 Fabric 不披露当前收入或盈利能力，这里的每个估值区间都明确是估计值，而非观察值。乐观情景假设软件层可以变现，Super-Pharm 和 Save A Lot
              这类复购证明扩宽而非停滞，并且没有紧急融资打断执行。在这条路径下，略高于旧独角兽锚点的估值仍可辩护。基准情景更保守，也更符合当前证据：Fabric
              仍活着、有差异化且相关，但资本密集度和选择性客户证明让市场无法像奖励干净软件公司那样奖励它。悲观情景重要，因为品类已经出现痛苦结果和 GTM 重置。Takeoff 破产和 Attabotics 后续重组 /
              重启证据显示，自动化需求可以与糟糕股权结果共存。Symbotic、Ocado、AutoStore、Dematic 和 KION 等公开可比公司是有帮助的方向性参考，但并不是 Fabric
              混合商业模式和更薄披露的直接倍数迁移对象。
