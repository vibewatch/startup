      - number: '4.2'
        title: 公开牵引力和销售效率代理
        blocks:
          - type: paragraph
            body: >-
              来源集显示公司跨多年有真实商业活动，但没有投资者最想要的指标。Instacart 在一个履约计划中使用 Fabric；FreshDirect 在 Washington 市场扩张 Fabric
              支持的自动化；Save A Lot 于 2024 年底在 Brooklyn 与 Fabric 和 Uber
              一起推出自动化配送主张。这些引用支撑真实客户关系的存在，也支撑公司有一定能力把关系转化为运营业务。它们还暗示 Fabric 的企业 GTM
              动作包含长销售周期、多利益相关方审批和客户专属部署规划，而不是快速交易式销售。这种 GTM 可以创造有价值的引用客户，但短期通常会压低销售效率，因为每次部署都需要技术验证、工作流设计和持续运营支持。没有披露
              CAC、回本周期、已预订 ACV 或赢单率数据时，审慎结论是牵引力可见，而销售效率大多不透明。FreshDirect 证据还罕见地得到多个行业媒体印证，因此作为运营历史证明，比单一宣传公告更可信。
