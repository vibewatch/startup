      - number: '2.4'
        title: 增长驱动、采用约束和可能打破投资逻辑的因素
        blocks:
          - type: paragraph
            body: >-
              自动化的结构性理由很强：劳动力仍然昂贵且难找，服务窗口正在收紧，全渠道杂货已成主流。但市场受到的约束比标题式增长曲线暗示的更强。Exotec 和 AutoStore
              强调实体侧收益——少走路、更高吞吐、更密存储、更好正常运行时间——但 Future Market Insights 和 Logistics Viewpoints 明确显示，集成、调度逻辑和补货质量仍可能摧毁
              ROI。Takeoff 破产是来源集中最清晰的负面案例：本地杂货履约需求存在，但业务仍产生重亏并进入 Chapter 11
              破产程序。这个失败案例重要，因为它说明关键问题不是零售商是否想要速度；而是某个架构能否以可接受的资本密集度和运营成本带来服务提升。因此，Fabric 的市场机会真实存在，但执行门槛很高，可获取份额不能只从 TAM
              口号推断。
