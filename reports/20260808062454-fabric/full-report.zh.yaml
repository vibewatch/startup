  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议和价格纪律
        blocks:
          - type: paragraph
            body: >-
              公开融资记录足以锚定讨论，但不足以结束讨论。Fabric 2021 年 10 月 Series C 轮、估值超过 US$1
              billion，仍是真实的后期验证信号；公司后续运营记录也不是空白：Super-Pharm 扩张，Save A Lot 2024 年在 Brooklyn 与 Uber 推出微型履约项目，Fabric
              还继续把故事向上推到 Orchestra 软件。这个组合足以反驳简单的「死掉的独角兽」框架。定价问题在于透明度。公开来源仍未证明当前收入、毛利率、积压订单、现金、债务、客户集中度或站点利用率；而 2022 年和
              2024 年裁员报道暗示公司一路上不得不调整规模。当前内容界面损坏或空白也进一步降低信心。因此，投委会可用结论是继续研究，而不是买入；任何试图把 2021 年标记当作活参考的动作，都必须有明确价格纪律。
