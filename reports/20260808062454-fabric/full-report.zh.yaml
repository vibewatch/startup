      - number: '5.2'
        title: 架构：实体系统、软件层和集成模型
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司网站而言，这套架构描述相当具体。Fabric 把系统拆成工作站、存储、机器人、软件和支持层。工作站覆盖拣选、拆箱、质量控制，以及通过 Express Counter
              调度。存储系统强调灵活货架、可配置周转箱 / 料箱结构和可选消防抑制。机器人层采用中央智能模型，配备专用升降和地面机器人，并支持处理中充电。在其上，Elevate、Stack、Flow、Orchestra
              等软件模块面向个性化、补货逻辑、运营工作流和 AI 辅助决策支持。集成用现代企业术语描述——RESTful APIs、消息队列、云基础设施、WMS/ERP 连接和配送平台链接——暗示 Fabric
              希望被视为零售商数字运营栈的一部分，而不只是实体自动化供应商。因此，架构看起来模块化、分层，但公开证明止步于正式 API 文档或可靠性基准之前。
