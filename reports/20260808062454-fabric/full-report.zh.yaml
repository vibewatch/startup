  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和变现形态
        blocks:
          - type: paragraph
            body: >-
              Fabric 看起来不像一家干净的经常性软件公司。其历史材料强调为快速杂货履约盈利而设计的自动化部署，这意味着收入来自硬件、系统设计、安装和启动活动。较新的材料拓宽了图景。2025 年 Orchestra
              发布明确把 Fabric
              定位为一个横跨库存、劳动力、订单、配送和机器人的软件与智能层。这暗示公司有意不只变现实体履约站点，也要变现协调站点的操作系统。财务含义很重要：项目收入可以通过合同里程碑创造可见度，但通常比经常性软件更不平滑、资本更密集。如果
              Fabric 能成功把工作流软件和持续优化附加到既有部署上，收入组合可能随时间改善。公开来源足以支撑这种转型形态，但不足以量化当前经常性收入、实施收入或服务组合。
