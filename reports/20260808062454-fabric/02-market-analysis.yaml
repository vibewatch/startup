tables:
- id: TM001
  title: Market definition table
  columns:
  - Market slice
  - What is included
  - What is excluded
  - Why it matters to Fabric
  rows:
  - - Broad micro-fulfillment market
    - Local automated fulfillment sites, associated services, and retail-use workflows
    - Generic linehaul logistics and pure last-mile delivery platforms
    - Shows the outer TAM often cited by market researchers
  - - Micro-fulfillment automation market
    - Robotic storage, piece picking, shuttles, AMRs, ports, and operating software inside local sites
    - Broader retail software and non-automated dark-store operations
    - Closer to Fabric’s physical product layer
  - - Warehouse-orchestration software layer
    - Inventory, labor, robotics, and order-flow coordination across facilities
    - Traditional WMS without real-time automation logic
    - Closer to Fabric’s software value proposition
  - - Regional grocery DC automation
    - Large distribution-center automation used for grocery replenishment
    - Pure local-node deployments only
    - Important because buyers compare MFCs against regional DC automation budgets
  notes: >-
    The same public source can support more than one layer, which is why market-size numbers diverge. Fabric competes
    across slices rather than inside one perfectly isolated category.
  claimRefs:
