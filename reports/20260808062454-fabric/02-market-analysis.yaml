  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: sam-definition
    missingEvidence: >-
      A directly sourced Fabric-specific SAM that cleanly isolates grocery-focused compact automation plus orchestration
      software.
    whyItMatters: >-
      A broad warehouse-automation TAM would exaggerate the spend Fabric can realistically pursue, but public sources
      do not isolate a company-specific serviceable market.
    diligencePath: >-
      Build bottom-up SAM from target accounts, site density, average contract value, and deployment model.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: obtainable-share
    missingEvidence: Fabric win-rate, active pipeline, average deployment value, and conversion data by customer
      segment.
    whyItMatters: Without conversion and pricing evidence, SOM cannot be estimated from public market reports alone.
    diligencePath: Request funnel, proposal volume, and live-site rollout data by customer class.
    relatedQuestionRefs:
    - QM024
  - type: missing-source
    severity: minor
    topic: regional-sam
    missingEvidence: Region-specific grocery automation spending splits for the U.S. and selected international
      markets.
    whyItMatters: Fabric’s market opportunity is likely regionally concentrated rather than globally uniform.
    diligencePath: Use paid analyst segmentation or buyer interviews to isolate regional spend pools.
    relatedQuestionRefs:
    - QM023
  - type: stale
    severity: minor
    topic: market-comparables
    missingEvidence: >-
      A single source that reconciles local MFCs versus regional-DC automation in one common economic framework.
    whyItMatters: >-
      Buyers often compare those architectures during procurement, but public sources usually discuss them separately.
    diligencePath: Collect customer procurement documents or consultant frameworks comparing deployment archetypes.
    relatedQuestionRefs:
    - QM025
