- id: TM007
  title: Constraints and failed paths table
  columns:
  - Constraint / adverse signal
  - Evidence
  - Why it matters
  - Implication for Fabric
  rows:
  - - Integration and dispatch quality
    - FMI
    - Storage speed alone does not solve inventory or planning failures
    - Fabric must prove orchestration quality, not just robot density
  - - Capital intensity and hardware mix
    - FMI hardware share 58%
    - Physical systems absorb a large share of project spend
    - ROI case must survive slow ramp or volatile order density
  - - Complex grocery workflows
    - Exotec / Dematic
    - Fresh, ambient, full-case, and each-pick flows must be reconciled
    - Fabric needs reliable exception handling and order consolidation
  - - 'Failure precedent: Takeoff'
    - Delaware bankruptcy filing
    - A well-known micro-fulfillment vendor still failed economically
    - The category is real, but not every operator or design makes money
  - - Incumbent competition
    - Ocado, Symbotic, Dematic, AutoStore
    - Public peers have larger installed bases or balance sheets
    - Fabric’s obtainable share is narrower than TAM narratives suggest
  notes: >-
    These constraints are the main reason public TAM claims should not be translated directly into revenue expectations
    for any one private company.
