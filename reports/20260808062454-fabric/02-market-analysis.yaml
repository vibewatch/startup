- id: buyers-and-workflows
  title: Buyers, users, and the operational problems being purchased away
  body: >-
    The budget owner is usually a retailer, grocer, or wholesale/distribution operator, but the user and pain points
    vary by workflow. Large grocery distributors such as Pattison Food Group buy automation to improve store-replenishment
    throughput and split-case handling across thousands of SKUs. Urban MFC buyers use a different logic: they are
    buying order density, speed, and service quality inside constrained real estate. Grocery automation also has
    to reconcile multiple modes at once—store replenishment, curbside, and same-day or next-day delivery—so the
    buyer is often trying to compress several workflows into a single operating backbone. Public competitor evidence
    suggests the market is not choosing between ‘software’ and ‘hardware’ so much as between different full-stack
    combinations of storage density, throughput, orchestration quality, and integration burden. That is why the
    buyer map for Fabric includes grocers, digital retailers, and operators that want staged deployment rather than
    a single regional mega-project.
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM015
  - CM016
  - CM027
  - CM028
  - CM031
  - CM033
  tableRefs:
  - TM005
  - TM006
- id: drivers-and-constraints
  title: Growth drivers, adoption constraints, and what could break the thesis
  body: >-
    The structural case for automation is strong: labor remains expensive and hard to find, service windows are
    tightening, and omnichannel grocery is now mainstream. Yet the market is more constrained than the headline
    growth curves suggest. Exotec and AutoStore emphasize the physical upside—less walking, higher throughput, denser
    storage, better uptime—but Future Market Insights and Logistics Viewpoints make clear that integration, dispatch
    logic, and replenishment quality can still destroy ROI. The Takeoff bankruptcy is the clearest negative case
    in the source set: demand for local grocery fulfillment existed, but the business still generated heavy losses
    and had to enter chapter 11. That failure case matters because it shows the key question is not whether retailers
    want speed; it is whether a given architecture produces service gains at acceptable capital intensity and operating
    cost. Fabric’s market opportunity is therefore real, but the execution bar is high and the obtainable share
    cannot be inferred from TAM slogans alone.
  claimRefs:
