company:
  name: Fabric
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Fabric sells into a real and growing market, but public evidence describes several overlapping markets rather
    than a single clean TAM. Broad micro-fulfillment estimates reach roughly $13.13 billion in 2026, while narrower
    automation-only estimates are closer to $1.3 billion, reflecting scope differences between full market activity
    and the physical automation slice. Demand is supported by the continued rise of e-commerce, online grocery,
    labor scarcity, and the need to support same-day or rapid grocery workflows; however, adoption remains constrained
    by integration risk, inventory accuracy, working-capital sensitivity, and the reality that some micro-fulfillment
    models have failed economically. For Fabric, the most relevant market is the grocery-specific intersection of
    compact automation and orchestration software rather than generic warehouse robotics.
sections:
- id: market-boundary
  title: Market boundary and the slice that matters for Fabric
  body: >-
    Public sources describe at least three overlapping arenas. The first is the broad micro-fulfillment market:
    compact warehousing capacity positioned close to urban demand and often evaluated as part of local delivery
    economics. The second is the narrower micro-fulfillment automation market, which isolates the robotic storage,
    picking, and software systems used inside those sites. The third is the still narrower orchestration layer that
    coordinates inventory, labor, robotics, and order flow across mixed fulfillment environments. Fabric sits across
    all three, but not equally. Its marketing is explicitly grocery-oriented, and its product family spans physical
    site formats plus workflow software. That means a generic warehouse-automation TAM overstates the directly relevant
    market, while a tiny pure-software lens understates the operational scope Fabric is trying to own. The right
    market frame for diligence is therefore the grocery-focused segment where compact automation and software orchestration
    have to work together in live retail operations.
  claimRefs:
  - CM001
  - CM002
  - CM006
  - CM031
  - CM032
  tableRefs:
  - TM001
  - TM002
- id: market-sizing
  title: 'Sizing lenses: broad micro-fulfillment, narrow automation, and demand backdrop'
  body: >-
    The market is large enough to matter, but the exact number depends on what is being counted. The Business Research
    Company’s 2026 overview places the broad micro-fulfillment market at $13.13 billion, while Future Market Insights
    places the narrower automation market at $1.3 billion in the same year. That spread is not noise; it captures
    a genuine difference in scope. On the demand side, the addressable retail environment continues to expand. The
    U.S. Census Bureau reported e-commerce at 16.9% of total U.S. retail in Q1 2026, while FMI and NIQ say online
    grocery already represents about one-fifth of total grocery spending and could reach $452 billion by 2028. Nearly
    all grocery households now blend store and digital channels. That combination supports a durable demand backdrop
    for faster fulfillment, but it does not automatically validate every automation vendor. Fabric’s SAM is narrower
    than the broad TAM because it is concentrated in grocery and local retail workflows that justify dense automated
    nodes.
  claimRefs:
