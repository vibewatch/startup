  topStrengths:
    - Super-Pharm、FreshDirect、Walmart 相关项目和 Save A Lot 提供了多年真实运营证据，不只是融资 PPT 叙事。
    - 产品覆盖多种实体形态，并叠加持续扩展的编排软件层，比单一用途机器人厂商多出更多选择权。
    - 2021 年 10 月 US$200 million Series C 轮以 >US$1 billion 估值完成，Temasek 等高质量投资人给出了真实后期验证。
    - 零售商需要更快履约、缓解用工压力，并改善本地库存经济性，生鲜杂货自动化需求仍有结构性支撑。
    - Save A Lot 和 Orchestra 说明，公司在 2021 年后的重置期之后仍在上线产品、迭代平台。
  topRisks:
    - 当前收入、毛利率、订单积压、现金、债务和现金跑道都未披露，很难给出精确承销价格。
    - 2022 年和 2024 年反复裁员，说明独角兽轮之后融资和执行压力真实存在。
    - 公开证据选择性强，缺少分母，客户集中度风险可能不低。
    - 生鲜杂货自动化赛道已经出现 Takeoff 破产等痛苦下行情景，行业也经历多轮重置。
    - 作为成熟私营公司，Fabric 的公开披露质量弱于预期；多个页面失效或空白，削弱了置信度。
  unresolvedGaps:
    - 公开证据仍缺少当前收入、毛利率、EBITDA 或烧钱速度、订单积压和现金跑道。
    - 公开来源对累计融资额说法冲突，既有 US$336 million，也有 US$375 million。
    - 股权结构表、清算优先权、债务条款，以及任何内部人或老股交易压力都未知。
    - 头部客户收入集中度、续约队列、上线站点数量和利用率数据均未公开披露。
    - Fabric 的软件层究竟已经贡献有意义的经常性收入，还是主要承担叙事转向功能，目前仍不清楚。
