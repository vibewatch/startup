  topStrengths:
    - Real multi-year operating proof across Super-Pharm, FreshDirect, Walmart-linked activity, and Save A Lot rather than a pure slideware narrative.
    - Product breadth spans multiple physical formats plus a growing orchestration software layer, giving Fabric more optionality than a single-purpose robotics vendor.
    - The October 2021 US$200 million Series C at a >US$1 billion valuation was genuine late-stage validation from high-quality investors including Temasek.
    - Grocery-automation demand remains structurally relevant as retailers seek faster fulfillment, labor relief, and better local-inventory economics.
    - Save A Lot and Orchestra show that the company was still launching product and evolving its platform after the post-2021 reset.
  topRisks:
    - Current revenue, gross margin, backlog, cash, debt, and runway are undisclosed, making the company difficult to underwrite at any precise price.
    - Repeated layoffs in 2022 and 2024 suggest real financing and execution pressure after the unicorn round.
    - Customer-concentration risk is likely material because public proof is selective and denominators are missing.
    - Grocery automation has already produced painful downside outcomes, including Takeoff’s bankruptcy and other category resets.
    - Public disclosure quality is weaker than expected for a mature private company, with several broken or empty pages reducing confidence.
  unresolvedGaps:
    - Current revenue, gross margin, EBITDA or burn, backlog, and runway are still unavailable in public evidence.
    - Public sources conflict on lifetime capital raised, citing both US$336 million and US$375 million.
    - Cap-table structure, liquidation preferences, debt terms, and any insider or secondary overhang are unknown.
    - Top-customer revenue concentration, renewal cohorts, live-site count, and utilization data are not publicly disclosed.
    - It is still unclear whether Fabric’s software layer is producing meaningful recurring revenue or mainly narrative repositioning.
