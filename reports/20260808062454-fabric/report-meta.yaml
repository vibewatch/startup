companyProfile:
  summary: Fabric is an Israeli-founded robotic micro-fulfillment company that began as CommonSense Robotics in 2015 and now sells a family of fulfillment systems spanning centralized fulfillment centers, micro-fulfillment centers, Nano Express nodes, Quick Pick stations, and software layers such as Flow, Stack, Elevate, and Orchestra. Public customer proof includes early Tel Aviv deployments, Super-Pharm, FreshDirect, Walmart-linked local fulfillment activity, and the 2024 Save A Lot + Uber Brooklyn launch. The company reached unicorn status in October 2021 with a US$200 million Series C at a valuation above US$1 billion, but later public reporting showed layoffs and a strategic shift toward technology and software. Fabric remains operational and strategically relevant, yet its current revenue, margins, customer concentration, and runway remain undisclosed.
  foundedDate: '2015-01-01'
  foundingLocation: Tel Aviv, Israel
  headquarters: Tel Aviv-Yafo, Israel
  productSummary: Robotic grocery and adjacent-retail fulfillment systems including centralized and micro-fulfillment facilities, Nano Express and Quick Pick formats, storage/sortation buffers, and orchestration software covering order flow, replenishment, support, customer-experience features, and AI-assisted operations.
  customerFocus: Grocery retailers, food and health-and-beauty chains, and adjacent retail or D2C operators that need dense, fast local fulfillment and store-replenishment workflows.
  businessModel: Mix of automation deployment revenue, integration and launch services, support and optimization services, and an expanding software / orchestration layer intended to improve recurring value per live site.
  stage: Late-stage private / post-Series C
  fundingStatus: Raised US$200 million Series C in October 2021 at a valuation above US$1 billion; later public sources cite US$375 million total raised, but current financing status and cap-table details are undisclosed.
