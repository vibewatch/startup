  columns:
  - Question
  - Public evidence
  - Status
  - Why it matters
  - Diligence ask
  rows:
  - - Capital raised
    - 2021 Series C $200M; public totals of $336M and later ~$375M
    - Partially known
    - Sets historical financing depth
    - Reconcile round-by-round cash-in and cumulative proceeds
  - - Current cash on hand
    - Not disclosed
    - Unknown
    - Most direct runway input
    - Request latest cash and restricted cash
  - - Monthly burn
    - Layoffs imply control, but number undisclosed
    - Unknown
    - Needed to translate cash into runway
    - Request normalized monthly burn before and after layoffs
  - - Debt or project finance
    - Not disclosed in public source set
    - Unknown
    - Debt could materially change risk
    - Request lender terms, covenants, and equipment finance
  - - Next-round trigger
    - Not disclosed
    - Unknown
    - Determines financing dependency
    - Request board planning assumptions and minimum cash threshold
  - - Customer commitments / backlog
    - Not disclosed publicly
    - Unknown
    - Would anchor near-term revenue visibility
    - Request bookings, backlog, and cancellation rights
  notes: The core problem is not lack of history but lack of current-state disclosure.
