- id: TI007
  title: Comparable financial benchmark table
  columns:
  - Comparable
  - Public scale signal
  - What it shows
  - Implication for Fabric
  rows:
  - - Symbotic
    - ~$22.4B backlog
    - Large retailers can support huge automation commitments
    - Fabric’s disclosed scale is far below the biggest public benchmark
  - - Ocado
    - Public 2026 reporting and active commercial program
    - Scaled grocery-automation peers can remain capital-intensive for years
    - Fabric likely faces similar implementation burdens without equal disclosure
  - - KION / Dematic
    - Full annual-report infrastructure
    - Incumbents have stronger balance-sheet signaling
    - Fabric must overcome trust gap with private metrics
  - - Takeoff
    - ~$60M loss and bankruptcy filing
    - Category demand does not guarantee vendor economics
    - Fabric needs stronger evidence of unit economics than narrative peers did
  notes: >-
    Comparable scale and failure cases are more informative than trying to guess Fabric revenue from sparse public
    clues.
  claimRefs:
  - CI021
  - CI022
  - CI023
- id: TI008
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Impact on verdict
  - Exact diligence path
  rows:
  - - Revenue / ARR
    - Needed for valuation and revenue-quality assessment
    - Material
    - Request audited or board-level trailing 12-month revenue
  - - Gross margin by stream
    - Needed to judge software-mix thesis
    - Material
    - Request P&L split by hardware, software, and services
  - - Cash, burn, runway
    - Needed for capital-adequacy view
    - Material
    - Request latest treasury snapshot and budget
  - - Bookings / backlog
    - Needed for near-term visibility
    - Material
    - Request signed backlog with cancellation terms
  - - Customer concentration
    - Needed to quantify account dependence
    - Material
    - Request revenue share by top five customers
  - - Deployment cost stack
    - Needed for customer ROI and Fabric margin math
    - Material
    - Request BOM, integration, and service-cost breakdown
  - - Software attach / renewal
    - Needed to test moat and mix shift
    - Material
    - Request attach rate, renewal cohort, and expansion stats
  notes: These gaps are the reason the final verdict remains cautious despite visible customer proof.
