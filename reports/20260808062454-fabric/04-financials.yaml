figures:
- id: FI001
  title: Capital intensity / cash-flow map
  type: matrix
  layout: wide
  summary: >-
    Fabric’s cash-flow profile is shaped by capital-heavy deployments on the cost side and by software expansion
    on the margin-improvement side.
  data:
    columns:
    - Direction
    - Public evidence
    - Financial implication
    rows:
    - label: Hardware deployment revenue
      values:
      - Positive cash in
      - Project-based installations
      - Large contract values possible but lumpy
    - label: Implementation labor
      values:
      - Negative cash out
      - Enterprise site launches
      - Can compress project margins
    - label: Software orchestration
      values:
      - Positive mix shift
      - Orchestra launch
      - Best candidate for recurring, higher-margin revenue
    - label: Service/support burden
      values:
      - Negative or mixed
      - Implied by operating sites
      - Can erode scalability if too labor-heavy
    - label: Customer ROI from labor savings
      values:
      - Positive demand driver
      - Comparator benchmarks from Exotec
      - Helps justify capex and expand pipeline
    - label: Customer ROI from shrink/training savings
      values:
      - Positive demand driver
      - Fabric software claims
      - Can improve willingness to pay
    - label: Layoffs / burn control
      values:
      - Positive for runway, negative for growth
      - 2022 and 2024 cuts
      - Signals active cash preservation
    - label: Undisclosed backlog
      values:
      - Negative information gap
      - No public Fabric backlog
      - Makes forecasting hard
    - label: Undisclosed cash balance
      values:
      - Negative information gap
      - No public cash disclosure
      - Runway cannot be estimated
    - label: Demand tailwinds
      values:
      - Positive top-line backdrop
      - FMI and Census demand data
      - Supports customer spending interest
    - label: Peer failure risk
      values:
      - Negative category signal
      - Takeoff bankruptcy
      - Raises bar for unit-economics proof
    - label: Public-peer scale gap
      values:
      - Negative competitive signal
      - Symbotic / Ocado / KION scale
      - Fabric must prove efficiency with less visible capital depth
