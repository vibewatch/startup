tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public status
  - Revenue quality view
  - Diligence ask
  rows:
  - - Automation system sale
    - Robotic storage/picking deployment tied to site buildout
    - Supported by product and customer references
    - Likely large-ticket but lumpy
    - Request booked revenue by deployment stage
  - - Integration / launch services
    - Design, implementation, commissioning, workflow setup
    - Inferred from enterprise deployments
    - Useful for landing accounts but probably lower-margin
    - Request implementation gross margin
  - - Software / orchestration
    - Orchestra intelligence layer across labor, orders, inventory, delivery, robotics
    - Explicit in 2025 launch materials
    - Best candidate for margin improvement and recurring revenue
    - Request ARR, attach rate, and renewal data
  - - Support / optimization services
    - Ongoing operating support and site tuning
    - Implied but not quantified
    - Could improve stickiness but may be labor-intensive
    - Request support attach rates and service margin
  - - Expansion revenue
    - Additional sites, modules, or market rollouts for existing customers
    - Supported by FreshDirect / Save A Lot style expansions
    - Higher quality if customers expand after first site
    - Request net revenue retention and expansion ACV
  notes: Public evidence supports stream shape, not current mix.
  claimRefs:
  - CI001
  - CI003
  - CI016
  - CI027
