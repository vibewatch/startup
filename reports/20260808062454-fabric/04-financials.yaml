    - Not public
    - Enterprise negotiated project
    - Faster profitable fulfillment
    - Price opacity makes revenue forecasting difficult
  - - Software orchestration
    - Not public
    - Likely enterprise subscription or bundled license
    - Lower labor friction, shrink, and better decisions
    - Could improve margins if separately monetized
  - - Customer expansions
    - Not public
    - Add-on deployment or site expansion
    - Faster rollout to adjacent markets or formats
    - Expansion economics are unknowable from public data
  - - Support / service
    - Not public
    - Ongoing support agreement or embedded project margin
    - Operational reliability and optimization
    - Service burden may dilute software margin benefits
  notes: >-
    No source publishes list pricing, so monetization must be described structurally rather than numerically.
