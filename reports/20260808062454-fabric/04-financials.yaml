    - Request customer count and active-site count
  - - Partner-led selling
    - Instacart and Uber-linked rollouts
    - Mixed
    - Can accelerate access but reduce direct control
    - Request channel economics and co-sell terms
  - - Deployment complexity
    - Site-specific operational redesign
    - Negative for near-term efficiency
    - Long cycles and technical validation suppress CAC efficiency
    - Request median sales cycle and pilot-to-rollout conversion
  - - Expansion motion
    - FreshDirect / Save A Lot style follow-on activity
    - Potentially positive
    - Existing-customer expansion is usually cheaper than new-logo acquisition
    - Request expansion share of bookings
  notes: These are proxies, not measured sales-efficiency metrics.
