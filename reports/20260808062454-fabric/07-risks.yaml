- id: commercial-financial
  title: Commercial, customer, and financial/model risk
  body: >-
    The heaviest residual risk is still commercial and financial. Fabric’s named-customer proof is real, but it
    remains selective: Super-Pharm is the best repeat-account evidence, FreshDirect is historically well corroborated,
    and Save A Lot is the freshest live-operations proof. That is enough to rebut the idea that Fabric never reached
    market fit, but not enough to show broad customer diversification or durable economics. Repeated layoffs in
    2022 and 2024 keep the capital story front and center. The business appears alive, yet current cash, backlog,
    debt, and gross margin remain undisclosed. Category history is also not friendly: Takeoff’s bankruptcy is a
    direct warning that retailer interest in micro-fulfillment can coexist with weak vendor economics. Meanwhile,
    larger players such as Symbotic raise the competitive survival bar by bringing much more scale and staying power
    into procurement contests. That same opacity is what keeps the risk rating high even though the company still
    shows evidence of market relevance.
  claimRefs:
  - CR022
  - CR023
  - CR024
  - CR025
