- id: verdict
  title: Mitigations, thesis-break triggers, and final risk verdict
  body: >-
    The key question is not whether Fabric has any mitigation; it clearly does. The key question is whether those
    mitigations are strong enough to offset the residual exposure created by capital opacity, operational complexity,
    and concentrated public proof. Publicly visible mitigations include a repeat customer, ongoing 2024 activity,
    patent-backed product evolution, a partner and integration program, and a remote monitoring stack. What is missing
    is equally important: independent uptime evidence, current financial disclosure, deep security/compliance artifacts,
    customer concentration data, and a broader live-site roster. That makes the right risk rating high, not critical:
    the business still has evidence of life and customer utility, but several thesis-break triggers remain close
    enough to matter in any investment decision.
  claimRefs:
  - CR049
  - CR050
  tableRefs:
  - TR008
