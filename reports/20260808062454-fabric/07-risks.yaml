  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-and-assurance
    missingEvidence: Customer-grade security certifications, DPA package, uptime/SLA history, and incident record.
    whyItMatters: Trust and operational reliability are central to enterprise procurement, but public proof is thin.
    diligencePath: Request SOC 2 / ISO materials, incident summaries, and customer SLA reports.
    relatedQuestionRefs:
    - QR002
    - QR019
    - QR029
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash, debt, backlog, gross margin, and runway.
    whyItMatters: These variables drive the severity of layoffs, financing dependency, and going-concern risk.
    diligencePath: Request current board package or financing update with cash bridge and backlog.
    relatedQuestionRefs:
    - QR013
    - QR014
    - QR028
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, live-site count, renewal cohorts, and site utilization by account.
    whyItMatters: Public proof is selective, so concentration and durability cannot be quantified.
    diligencePath: Request top-customer concentration and cohort retention data.
    relatedQuestionRefs:
    - QR021
    - QR022
    - QR029
  - type: missing-source
    severity: minor
    topic: formal-compliance-pack
    missingEvidence: >-
      A public or diligence-room package covering food safety, safety training, and insurance / liability controls.
    whyItMatters: Operational and regulatory risk is manageable only if those controls are documented.
    diligencePath: Request HACCP/FSMA SOPs, training logs, insurance certificates, and safety audits.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR030
