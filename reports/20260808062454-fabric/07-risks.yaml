slug: fabric
runDate: '2026-08-08'
company:
  name: Fabric
chapter:
  number: 7
  title: Risks
  summary: >-
    Fabric’s risk profile is high. The company still shows credible operating activity and some mitigating evidence—repeat
    behavior at Super-Pharm, current operations at Save A Lot, a patent around storage flexibility, a partner ecosystem,
    and a formal support/integration layer—but the residual risk stack remains heavy. The biggest exposed areas
    are capital adequacy after repeated layoffs, concentration in a small set of visible customer proofs, execution
    complexity in grocery fulfillment, partner and integration dependence, and incomplete public proof on security,
    compliance, and reliability. The correct investment posture is to treat Fabric as an execution-sensitive automation
    company rather than as a de-risked software platform.
sections:
- id: legal-regulatory
  title: Legal, privacy, and regulatory risk
  body: >-
    The public record gives enough information to identify real compliance exposure, but not enough to close it.
    Fabric’s privacy policy shows that the company does collect and process identifiable and behavioral data at
    least on its public website, while its legal terms require arbitration and limit remedies. Those facts do not
    prove a problem by themselves, but they show that legal and privacy governance is not hypothetical. Because
    Fabric operates in grocery and warehouse environments, OSHA safety obligations and FDA/FSMA food-handling expectations
    also matter. The problem is evidentiary depth: the source set does not surface a customer-facing public security
    certification package, a detailed food-safety control framework, or a broader litigation map. The patent announcement
    helps on the offensive-IP side, but it does not answer freedom-to-operate, enforceability, or infringement risk.
    The result is a moderate-to-high legal and regulatory burden with only partial public mitigation. In practice,
    that means legal diligence would need to move beyond public web policies and into customer, supplier, and insurer
    documentation before risk could be considered fully mapped for investment purposes at current visibility levels.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR018
  - CR019
