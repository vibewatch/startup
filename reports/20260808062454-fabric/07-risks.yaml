  - TR002
- id: operational
  title: Operational, technical, and partner dependency risk
  body: >-
    Fabric’s operating model is powerful precisely where it is hardest to execute. The company claims it can fit
    automation into unconventional footprints, work across multiple temperature zones, and orchestrate complex fulfillment
    flows through a growing software layer. That is attractive commercially, but it increases engineering, safety,
    and reliability risk at the same time. The technical story also extends beyond Fabric’s own robots: the company
    relies on cloud platforms, APIs, WMS/ERP connectivity, delivery partners, and third-party integration relationships
    such as Reply. Channel risk is similar. Fabric’s own Partner Elite Program shows the company wants help from
    integrators, referral partners, and OEMs, which can widen access while also reducing direct control. The public
    mitigation story is real—control-room monitoring, 95%-issue-resolution claims, onboarding tools, and modularity
    rhetoric—but it remains mostly self-described rather than independently audited. The combination of hardware,
    software, food handling, and partner integrations makes this a system-of-systems risk problem rather than a
    single-component one.
  claimRefs:
