company:
  name: Svante Technologies
chapter:
  number: 6
  title: Customers
  summary: Svante's public customer evidence is concentrated in pilots, demonstrations, and development collaborations across heavy industry, pulp and paper, and direct-air-capture. The evidence shows broad use-case reach and several named counterparties, but does not establish recurring revenue, retention, customer concentration, or a large production fleet.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: >-
      Svante sells into a technically complex B2B workflow rather than a self-serve software motion. Public descriptions place the core buyer among hard-to-abate industrial operators in cement, pulp and paper, refining, steel, energy, and related process industries, while project developers and carbon-removal companies can act as channels or integration partners. The user and payer are not always the same: an industrial operator may host the capture equipment, a developer may arrange the project, and a downstream partner may handle utilization, liquefaction, transport, or storage. Svante's own technology page describes filters and modular rotary contactor machines for industrial emissions and air capture, while the Invest Vancouver case study identifies cement, pulp and paper, and refineries as served sectors. This is a credible segmentation signal, but the public record does not disclose customer counts, annual contract value, average sales cycle, or the share of revenue by segment.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and deployment maturity
    body: The adoption record progresses from demonstration to pilot and pre-commercial engineering rather than a disclosed base of contracted production customers. The CCS Knowledge interview reports a 30-tonne-per-day pilot with Cenovus that was operating, a similarly sized Chevron facility commissioned in California, and a smaller Lafarge unit collecting data. The Mercer project had advanced to FEL-2, which is engineering and commercial-viability work rather than a final investment decision. Svante also announced a Södra pilot planned for early 2026 to test the technology in a Swedish pulp operation and evaluate future large-scale capture. These milestones demonstrate repeated industrial engagement and learning across different flue-gas environments, but they should not be treated as evidence of commercial revenue, fleet utilization, or completed full-scale deployments.
    claimRefs: [CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof
    title: Named customer and partner proof
    body: Named counterparties provide stronger evidence than undifferentiated logo claims, but the quality of proof varies by project stage. Cenovus and Chevron are described in an industry interview as hosts of industrial-scale pilots; Lafarge is associated with a cement demonstration and data collection; Mercer is associated with a FEL-2 pulp-mill project; Södra is associated with a future pilot and evaluation of scale-up; and Climeworks is described as using Svante filters in next-generation direct-air-capture systems. A separate collaboration with Carbon America is framed around identifying and deploying United States CCUS projects, while Project CO2MENT links Svante with Lafarge and Dimensional Energy in a utilization demonstration. The named relationships support market access and technical validation, but several are pilots, collaborations, or development phases, so outcomes, contract economics, renewal behavior, and customer-funded deployment remain unverified.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU008, CU010]
    tableRefs: [TU003]
  - id: durability-and-gaps
    title: Retention, expansion, and concentration risk
    body: >-
      Public evidence does not disclose net retention, gross retention, churn, renewal rates, contract duration, customer concentration, repeat purchase, or utilization by installed unit. The available proof instead shows a land-and-expand style opportunity: pilots can generate operating data, then support engineering, financing, and final-investment decisions for larger projects; partnerships can also extend from capture equipment into utilization, direct-air capture, or source-to-sink development. That pathway is commercially plausible but remains an operating hypothesis until Svante provides a customer cohort, order book, signed-versus-pilot project list, and project-level economics. The Redwood manufacturing facility and broad sector coverage may improve delivery capacity, but manufacturing capacity is not the same as customer demand or realized revenue. The principal customer diligence question is therefore conversion from pilots and FEED-stage work into financed, operating projects with repeatable economics.
    claimRefs: [CU009, CU011, CU012, CU013, CU014]
    tableRefs: []
    figureRefs: []
