    claimRefs: [CU003, CU006, CU008, CU009, CU013]
callouts:
  - calloutType: strength
    title: Cross-sector referenceability
    body: Named pilots and collaborations span cement, pulp and paper, refining or energy, utilization, and direct-air capture, giving Svante a broader reference surface than a single-site demonstration.
    claimRefs: [CU003, CU004, CU005, CU008, CU010]
  - calloutType: risk
    title: Pilot-to-production conversion is unproven
    body: The retained evidence is strongest for pilots, demonstrations, planned tests, and FEL-2 work; it does not disclose a production fleet, recurring revenue, or final investment decisions for the named projects.
    claimRefs: [CU005, CU006, CU011, CU012]
  - calloutType: recommendation
    title: Request a project-stage and cohort schedule
    body: Diligence should reconcile every named project to signed contract status, customer-funded scope, FID, commissioning, operating performance, and renewal or expansion terms.
    claimRefs: [CU011, CU012, CU014]
  - calloutType: assumption
    title: Manufacturing capacity is not demand
    body: The Redwood facility's stated capacity is a supply-side capability and should not be treated as realized customer demand, revenue, utilization, or order-book coverage.
    claimRefs: [CU009, CU013]
