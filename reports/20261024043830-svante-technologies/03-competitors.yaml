      - ["Primary application", "Industrial point source plus filters for DAC partners", "Industrial point source", "Industrial point source", "Direct air capture", "Direct air capture"]
      - ["Modularity", "Modular filters and rotary contactors", "Just Catch modular units; Big Catch tailored systems", "Compact modular positioning", "Large standardized plants", "Modular collector units"]
      - ["Public operating proof in reviewed pool", "Pilots and demonstrations; no normalized fleet-hours disclosure", "More than 60,000 hours claimed in competitor profile", "49 facilities and 1.7m metric tons reported as of 2022", "Future Stratos scale reported; current delivered performance not established here", "Orca and Mammoth capacities reported; availability not established here"]
      - ["Integration and channel", "Kiewit, Technip Energies, BASF, Chevron, Samsung, Storegga, and Chart partner network", "Capture, project execution, and SLB value-chain integration", "Fabrication and industrial partnerships", "Occidental infrastructure and storage integration", "Removal service portfolios and storage partners"]
    notes: >-
      Cells summarize the reviewed public descriptions rather than test results.
      "Not established here" means the assigned source pool did not provide the
      comparable metric; it does not assert that the provider lacks that capability.
    claimRefs: [CP001, CP002, CP003, CP004, CP005, CP006, CP007, CP008, CP009, CP014]
  - id: "TP003"
    title: "Pricing and packaging comparison"
    columns:
      - "Provider"
      - "Commercial package"
      - "Published price or cost signal"
      - "Included scope"
      - "Underwriting implication"
    rows:
      - ["Svante", "Bespoke B2B installation, equipment, and support arrangements", "No list price; Preqin says terms vary by scale and complexity", "Filters, rotary contactors, engineering, digital services, and project-development support may be contracted in different combinations", "Request matched-stream bid with equipment, energy, replacement, service, warranty, and integration costs separated"]
      - ["SLB Capturi", "Standardized Just Catch and tailored Big Catch projects", "No contract price in reviewed source", "Capture plant and execution scope; capacity ranges are public", "Compare guaranteed availability, energy use, solvent management, and EPC boundary"]
      - ["Carbon Clean", "Retrofit capture technology and partner-led deployment", "No current customer price in reviewed source", "Technology package and integration depend on project", "Do not convert reported capture rates into cost without site energy and balance-of-plant data"]
      - ["Climeworks", "Removal credits and portfolios", "CarbonCredits reports USD 600-800 per tonne for credits", "Removal outcome with storage pathway; not point-source equipment", "Treat as a different procurement objective, not a direct equipment-price benchmark"]
      - ["Carbon Engineering", "Large DAC project and long-term offtake model", "CarbonCredits reports USD 250-600 per tonne capture cost, not customer price", "Large plant, storage or fuel pathway, and offtake", "Separate modeled capture cost from delivered removal price and financing assumptions"]
    notes: >-
      Prices and cost ranges retain the source's units and are not normalized for
      transport, storage, financing, energy, permanence, or project vintage. Unknown
      values are diligence gaps, not zero-cost entries.
    claimRefs: [CP006, CP008, CP009, CP012]
