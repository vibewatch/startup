callouts:
  - calloutType: "strength"
    title: "Differentiation is architectural, not yet economic"
    body: >-
      Svante combines proprietary sorbent material, structured filters, rotary
      contactors, manufacturing, and partner-enabled project delivery. The reviewed
      evidence does not yet prove that this architecture wins on total installed or
      lifecycle cost.
    claimRefs: [CP001, CP003, CP004, CP016]
  - calloutType: "risk"
    title: "The status quo competes for capital"
    body: >-
      Project cancellation and delay can beat every technology vendor when policy,
      transport, storage, and financing conditions are uncertain.
    claimRefs: [CP010, CP011]
