callouts:
  - calloutType: insight
    title: The addressable market is infrastructure-constrained
    body: "Demand can be large while near-term conversion remains limited by storage permits, transport networks, public support, and project finance. Underwriting should therefore use project-level milestones rather than headline CCS TAM."
    claimRefs: [CM012, CM013, CM014]
  - calloutType: risk
    title: A broad TAM does not establish Svante's SAM
    body: "The evidence does not disclose Svante's realized pricing, share of qualified projects, FID conversion rate, or recurring service economics. Those gaps prevent a defensible company-specific SAM/SOM."
    claimRefs: [CM014, CM015]
