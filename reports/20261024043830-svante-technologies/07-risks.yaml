callouts:
  - calloutType: risk
    title: Highest residual exposure
    body: Svante cannot control the full permit-to-storage chain, and public evidence does not yet prove durable fleet economics or factory utilization at commercial scale.
    claimRefs: [CR001, CR003, CR009, CR015]
  - calloutType: recommendation
    title: Diligence priority
    body: Require project-level permit and FID evidence, independent operating data, supplier protections, customer concentration, and a current liquidity schedule before treating capacity and strategic backing as proof of commercial scale.
    claimRefs: [CR006, CR009, CR010, CR012, CR016]
