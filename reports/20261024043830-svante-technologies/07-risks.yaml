company:
  name: Svante Technologies
chapter:
  number: 7
  title: Risks
  summary: Svante's largest evidenced exposures are CCUS permitting and storage-rights uncertainty, industrial scale-up, project-finance dependence, and conversion of pilots into durable commercial operations. The company has credible mitigations in modular manufacturing and a BASF sorbent relationship, but public evidence does not resolve fleet reliability, customer concentration, liquidity, or company-specific legal status.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      CCUS deployment depends on permits, pore-space rights, financial assurance, transport, and storage that sit outside
      Svante's filter-manufacturing control. Arnold & Porter's 2026 update says California's draft concepts include
      monitoring, emergency-response, financial-responsibility, and potentially 100-year post-injection obligations.
      The same issuer reports that North Dakota courts invalidated a pore-space amalgamation statute and reversed related
      permit orders, while Louisiana had a Class VI moratorium and a 31-project queue. Texas had transferred 18 projects
      after assuming primacy but had not issued a permit since. These are sector-level developments, not findings of a
      Svante violation. They nevertheless create schedule and bankability risk wherever customers depend on storage
      approvals. The assigned evidence does not establish Svante-specific litigation, enforcement, licensing, or IP
      disputes; silence is therefore a diligence gap, not proof of absence.
    claimRefs: [CR001, CR002, CR003, CR004, CR015]
    tableRefs: [TR001]
  - id: operational-technology
    title: Operational, technology, and quality risk
    body: >-
      Svante's system requires the sorbent, laminate filters, rotary contactors, regeneration process, and customer
      balance-of-plant to perform together under variable industrial conditions. The company says CALF-20 is best suited
      to CO2 concentrations of 12% or more and offers BASF's liquid-amine process for lower-concentration streams,
      making feed-gas fit a real design constraint rather than a universal-product assumption. Svante also identifies
      BASF as its MOF scale-up partner, which mitigates supply risk but creates a named dependency whose capacity,
      quality remedies, and alternate sourcing are not public. Independent coverage reports a 141,000-square-foot
      factory with stated filter capacity for up to 10 million tonnes of annual capture, yet nameplate output is not
      evidence of utilization, yield, warranty performance, or profitable commercial throughput.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR015]
    tableRefs: [TR002]
  - id: partner-financial-execution
    title: Partner, financial, and execution risk
    body: >-
      Commercialization remains tied to counterparties and project milestones. Carbon Herald describes Chevron Kern
      River and Lafarge Richmond as pilot sites, so those references support deployment activity but not recurring
      production revenue or final-investment-decision conversion. Preqin reports a CAD 15 million November 2024
      financing, while Multiples describes a Canada Growth Fund commitment of up to US$100 million in convertible notes
      split into project-linked tranches. CGF's own policy says it can use price assurances and offtake to address demand
      risk when private demand is still developing. Together, these sources point to capital availability but also to
      reliance on financing structures, sponsors, and downstream project economics. Multiples also reports the March
      2026 acquisition of Carbon Alpha, adding project-development capability and integration risk. Audited liquidity,
      backlog quality, and customer concentration remain private-evidence gaps.
    claimRefs: [CR010, CR011, CR012, CR013, CR014, CR016]
    tableRefs: [TR003]
  - id: monitoring-kill-criteria
    title: Monitoring indicators and thesis-break triggers
    body: >-
      Monitoring should be project-specific and measurable. For regulation, track permit filings, approval dates,
      appeals, pore-space contracts, financial-assurance amounts, and storage-route changes. For operations, require
      independent capture-rate, uptime, sorbent-replacement, energy-use, factory-yield, warranty, and delivered-cost
      data. For commercial execution, separate pilots and feasibility studies from funded construction, final
      investment decisions, accepted equipment, and cash collections. Escalation triggers are a permit reversal, loss
      of storage rights, repeated failure against customer guarantees, inability to finance committed projects, or
      factory working capital growing faster than contracted demand. Thesis-break events are sustained field
      underperformance, loss of a critical sorbent source without a qualified substitute, or a liquidity shortfall
      before projects reach customer-funded construction. Public sources do not quantify Svante's thresholds, so
      management, customers, suppliers, insurers, and lenders must supply the evidence.
    claimRefs: [CR002, CR003, CR005, CR006, CR009, CR010, CR012, CR015, CR016]
    figureRefs: [FR001]
