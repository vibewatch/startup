company:
  name: Svante Technologies
chapter:
  number: 4
  title: Financials
  summary: Svante has commissioned meaningful manufacturing capacity and describes several equipment, project, and carbon-credit monetization paths, but the assigned public evidence does not establish realized revenue, gross margin, burn, cash, or runway. Financial underwriting therefore depends on contract-level economics, factory utilization, project final investment decisions, and a reconciled financing ledger.
sections:
  - id: revenue-model
    title: Revenue model and revenue quality
    body: >-
      Svante's disclosed commercial architecture is industrial and project-led, not a subscription model. The company manufactures structured adsorbent filters and rotary adsorption machines, delivers machinery with balance-of-plant equipment, and participates in project development. Its 2026 strategy also proposes monetizing captured biogenic CO2 through removal credits. These mechanisms could produce equipment, engineering, service, or credit revenue at different stages, but the evidence does not provide recognized revenue by stream, booked backlog, acceptance milestones, warranty exposure, or recurring-service attach rates. Nameplate capture capacity therefore cannot be treated as sales, and an announced project cannot be treated as revenue before financing, contracting, delivery, and accounting recognition are demonstrated.
    claimRefs: [CI001, CI002, CI011, CI014]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-go-to-market
    title: Pricing, incentives, and go-to-market
    body: >-
      Public pricing evidence is limited to economic reference points rather than executed Svante contracts. Forbes reported CEO Claude Letourneau's statement that the technology can remove carbon for $150 per tonne, while the same article cited U.S. Section 45Q credits of $85 per tonne for underground storage and $60 per tonne for utilization. These figures use different concepts: the first is a company-asserted capture cost and the others are policy incentives, not Svante list prices or realized revenue. The go-to-market motion appears consultative and project-specific, spanning studies, integration, equipment delivery, and credit development. Underwriting requires actual quotations, discounting, payment milestones, customer contributions, and the allocation of transport and storage costs.
    claimRefs: [CI003, CI004, CI010, CI012]
    tableRefs: [TI002]
  - id: cost-structure-and-traction
    title: Cost structure, operating leverage, and traction
    body: >-
      Redwood is the clearest public indicator of fixed-cost and operating leverage. Independent and company-distributed accounts describe a 141,000-square-foot facility able to manufacture filters supporting up to 10 million tonnes of annual CO2 capture and associate the facility with a US$145 million capital investment. Those figures show scale and capital intensity, not utilization or margin. Relevant cost drivers include factory yield, filter material, machinery, commissioning, energy, sorbent replacement, field service, warranties, working capital, and depreciation. A DOE-supported pre-FEED study provides project-development evidence, but the source describes funding of up to $1.5 million and a future final-investment-decision condition rather than an operating deployment or customer revenue.
    claimRefs: [CI005, CI006, CI010, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial verdict
    body: >-
      Capital raised or invested is not cash available. InBC quoted Svante's CEO saying that investors had made C$800 million of capital investment over the prior decade, while Tracxn's fetched profile reports US$493 million across 18 funding rounds. Currency, date, and scope are not reconciled, and neither figure establishes current liquidity. The adverse sector benchmark is also material: DeSmog's account of IEEFA analysis on a different Canadian CCS project warns that costs can exceed per-tonne revenue without efficiency gains. That evidence is not a Svante performance record, but it reinforces the need for cash, burn, debt, project-finance, subsidy, utilization, and unit-cost data. The financial verdict is research-more until those inputs and contracted economics are disclosed.
    claimRefs: [CI007, CI008, CI013, CI014, CI015]
