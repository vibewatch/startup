      - ["U.S. 45Q underground storage credit", "$85 per tonne", "Policy incentive", "Reported statutory reference", "Customer or project incentive, not Svante revenue by default"]
      - ["U.S. 45Q utilization credit", "$60 per tonne", "Policy incentive", "Reported statutory reference", "Customer or project incentive, not Svante revenue by default"]
      - ["Filters and machinery", null, "Realized contract price", "Unavailable", "No public price, discount, warranty, or payment schedule in retained evidence"]
      - ["CDR credit offtake", null, "Realized credit price", "Unavailable", "No executed offtake price or recognized credit revenue in retained evidence"]
    notes: The per-tonne figures have different denominators and economic owners and must not be combined into a Svante margin estimate.
    claimRefs: [CI003, CI004, CI011, CI014]
  - id: TI003
    title: Unit economics and capital-adequacy checklist
    columns: [Metric, Public value, Confidence, Why it matters, Diligence request]
    rows:
      - ["Redwood facility size", "141,000 square feet", "high", "Indicates fixed operating footprint", "Provide capex ledger, depreciation, staffing, maintenance, and fixed-cost budget"]
      - ["Filter manufacturing capacity", "Supports up to 10 million tonnes of annual CO2 capture", "high", "Defines nameplate scale but not factory utilization", "Provide annual filter output, contracted capacity, yield, utilization, and ramp"]
      - ["Redwood capital investment", "US$145 million", "high", "Demonstrates capital intensity", "Reconcile funding sources, capitalized costs, remaining commitments, and asset ownership"]
      - ["Ashdown study support", "Up to US$1.5 million", "medium", "Shows external study funding rather than commercial revenue", "Provide scope, cost share, milestones, and conversion probability"]
      - ["Capture cost per tonne", null, "low", "Determines customer payback and potential gross margin", "Provide measured energy, sorbent, labor, maintenance, transport, and storage costs"]
      - ["Revenue and gross margin", null, "low", "Required to test revenue quality and operating leverage", "Provide audited FY2025 and 2026 year-to-date statements by stream"]
      - ["Cash, burn, debt, and runway", null, "low", "Required to assess financing dependency", "Provide current cash, monthly burn, debt schedule, restricted cash, and downside runway"]
    notes: Capacity, funding, and facility investment are not revenue, gross profit, cash availability, or runway; null fields are explicit underwriting gaps.
    claimRefs: [CI005, CI006, CI007, CI008, CI010, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: The public commercial sequence links project development to equipment delivery and captured CO2, but financing, FID, verification, and customer acceptance separate activity from recognized revenue.
    data:
      nodes:
        - id: host
          label: Industrial host or biogenic source
          detail: A customer or project identifies a capture opportunity.
        - id: development
          label: Study and project development
          detail: Pre-FEED, engineering, integration, and financing precede deployment.
        - id: fid
          label: Contracting and final investment decision
          detail: Terms, capital, incentives, and counterparties must be committed.
        - id: equipment
          label: Filters, rotary machines, and balance of plant
          detail: Svante manufactures and delivers the capture equipment.
        - id: operation
          label: Capture and concentration
          detail: Operating performance determines tonnes captured and service needs.
        - id: disposition
          label: Transport, storage, or utilization
          detail: Downstream infrastructure is required before permanent disposition.
        - id: monetization
          label: Equipment, service, or credit revenue
          detail: Recognition depends on contract terms, acceptance, and verified delivery.
    approximationNotes: Ordered evidence-based mechanism only; it is not a revenue forecast, conversion funnel, or assertion that announced projects reach monetization.
    claimRefs: [CI001, CI002, CI010, CI011, CI012]
callouts:
  - calloutType: risk
    title: Capacity is not revenue
    body: Redwood establishes manufacturing capability, but public evidence does not disclose utilization, contracted output, recognized sales, or gross margin.
    claimRefs: [CI005, CI006, CI014]
  - calloutType: recommendation
    title: Underwrite from contracts and cash
    body: Reconcile current liquidity and obligations, then model each signed project from customer FID through acceptance, operating cost, and cash collection.
    claimRefs: [CI013, CI014, CI015]
