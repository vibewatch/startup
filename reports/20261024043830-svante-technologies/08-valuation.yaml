company:
  name: Svante Technologies
chapter:
  number: 8
  title: Valuation
  summary: Svante has credible strategic financing, manufacturing scale-up evidence, and a differentiated carbon-capture platform, but public evidence still does not establish a current post-money valuation or operating economics. The appropriate stance is research-more, with entry discipline tied to verified project contracts, commercial revenue, cash runway, and financing terms.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The evidence supports research-more rather than buy or pass. GE Vernova described its
      participation in Svante's US$318 million Series E and a joint-development agreement,
      while the company describes a platform spanning filters, rotary contactors, and process
      design. Those are meaningful strategic validation signals, but they are not a substitute
      for a current equity price or audited operating record. Preqin's accessible profile
      identifies a November 2024 CAD 15 million InBC transaction, while Multiples reports a
      separate August 2024 US$50 million round and describes Svante as privately held. Those
      data points do not reconcile a complete capitalization record or disclose the securities'
      economic terms. The market-data
      references provide public-company context, not a directly comparable valuation for a
      pre-revenue or commercially scaling equipment supplier. An investment decision should
      therefore be conditioned on a dated cap table, security terms, post-money valuation,
      conversion mechanics, backlog, recognized revenue, gross margin, burn, and cash runway.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The positive thesis is that Svante has converted a materials proposition into a
      manufacturing and ecosystem proposition. GE identifies the filters' use across multiple
      industrial sectors and reports that GE invested alongside the Series E; Innovation in
      Textiles reports BASF and 3M supply and manufacturing agreements; and independent
      coverage describes the 141,000-square-foot Redwood facility and a stated capacity to
      support filters for up to 10 million tonnes of annual capture. These facts improve the
      plausibility of scale and strategic distribution. The anti-thesis is that capacity and
      partnerships do not prove utilization, cash generation, or project-level returns.
      Exoswan's 2026 sector discussion shows direct-air-capture economics remain difficult,
      including a cited Mammoth output of 675 tonnes in the first half of 2026 against 36,000
      tonnes of designed annual capacity, although that observation concerns a customer or
      adjacent market rather than Svante's own results. Svante's own site claims 95% capture
      and sub-60-second cycles, but those are company claims requiring independent operating
      validation. The thesis changes positively with audited recurring commercial revenue and
      funded projects; it changes negatively with delayed FIDs, low factory utilization,
      material sorbent replacement costs, or a down round.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenarios, comparables, and diligence
    body: >-
      A conventional revenue-multiple valuation cannot be responsibly applied from this pool
      because Svante's current revenue and margin base are undisclosed. Finerva reports a
      Q1 2026 median EV/Revenue multiple of 5.4x for a broad green-energy cohort and a median
      EV/EBITDA multiple of 16.3x, but explicitly frames the data as a general benchmark and
      the cohort is composed of listed companies whose metrics differ from younger startups.
      Multiples lists public-company EV/Revenue examples including GE Vernova at 4.6x LTM and
      Bloom Energy at 14.5x LTM, but these are not operating or capital-structure matches.
      The defensible scenario range is therefore qualitative: bull requires contracted,
      financed projects, repeatable factory utilization, and auditable gross-margin
      progression; base assumes continued strategic funding but incomplete disclosure and
      pre-FID projects; bear assumes commercialization delays, dilution, and multiple
      compression before cash generation. Diligence should obtain the cap table and
      preference stack, the Canada Growth Fund note terms and draw status, project FIDs and
      economics, customer acceptance data, and audited FY2025/H1 2026 financials before any
      price is accepted.
    claimRefs: [CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Evidence-supported view, Decision implication]
    rows:
      - ["Recommendation", "research-more", "Do not underwrite a purchase without current financing and operating disclosure"]
      - ["Confidence", "medium", "Strategic evidence is credible; price and economics remain unverified"]
      - ["Risk rating", "high", "Commercialization, financing, and project-execution uncertainty remain material"]
      - ["Valuation stance", "unknown", "No verified current post-money valuation or defensible company-specific multiple"]
      - ["Entry discipline", "conditional", "Require dated cap table, terms, revenue, margin, runway, backlog, and FIDs"]
    notes: Public sources mix company claims, partner announcements, database previews, and market benchmarks; unknown means unsupported by this assigned evidence, not zero.
    claimRefs: [CV001, CV003, CV004, CV005, CV011, CV015]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Strategic validation", "GE announced a JDA and equity investment in the Series E; BASF and 3M agreements are reported", "Verify commercial scope, economics, and binding commitments"]
      - ["Manufacturing scale", "Redwood is described as a 141000-square-foot facility with stated 10-million-tonne annual capture capacity", "Verify installed utilization, yield, capex, and customer orders"]
      - ["Technology differentiation", "Svante claims MOF filters, 95% capture, and sub-60-second capture and release", "Obtain independent field data, degradation curves, and lifecycle cost"]
      - ["Commercialization risk", "Public evidence does not disclose audited revenue, margin, burn, runway, or current valuation", "Provide audited accounts, backlog conversion, and cash forecast"]
      - ["Capital-structure risk", "Public databases describe multiple 2024 financings, but terms and a reconciled cap table are unavailable", "Reconcile cap table, note conversion, preferences, and dilution"]
    notes: The table separates evidence-supported positives from unresolved underwriting conditions; no row implies that a partnership equals revenue.
    claimRefs: [CV002, CV006, CV007, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull", "Financed projects reach FID, factory utilization scales, and audited revenue and margin improve", "Use verified company-specific revenue and margin multiples; no numeric range is supportable now", "Conditional and unpriced", "Project cancellations or inability to verify utilization"]
      - ["Base", "Strategic funding continues but operating disclosure and project economics remain incomplete", "Hold valuation unknown and require a risk-adjusted entry price", "Most consistent with current public evidence", "No audited accounts or note terms"]
      - ["Bear", "Commercial projects slip, capital intensity and replacement costs rise, and a down round is required", "Principal loss through dilution and repricing is plausible", "Material downside case", "Failed FIDs, weak orders, or liquidity pressure"]
      - ["Exit readiness", "Repeatable commercial deployments and transparent financial reporting enable strategic or public-market optionality", "Reassess only after measurable revenue, gross margin, and backlog evidence", "Not established", "Continued private financing without operating milestones"]
    notes: Scenario logic is qualitative because the assigned sources do not disclose current revenue, EBITDA, cash, valuation, conversion terms, or probability estimates; probability signal is a directional underwriting label, not a statistical forecast.
    claimRefs: [CV003, CV004, CV011, CV012, CV013, CV014, CV015, CV016]
