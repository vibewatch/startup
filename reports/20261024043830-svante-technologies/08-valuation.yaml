callouts:
  - calloutType: recommendation
    title: Research-more
    body: Strategic validation is meaningful, but public evidence does not establish a current price, post-money valuation, revenue base, margin profile, or runway.
    claimRefs: [CV001, CV003, CV004, CV015]
  - calloutType: risk
    title: The key risk is underwriting opacity
    body: Multiple public descriptions of 2024 financing and unavailable conversion terms make dilution and downside impossible to price from this evidence alone.
    claimRefs: [CV003, CV004, CV016]
