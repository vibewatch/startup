figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: The disclosed operating chain links site conditioning to solid-sorbent capture, regeneration, purification, and downstream CO2 handling.
    data:
      layers:
        - label: Feed and conditioning
          detail: Customer-specific flue gas is cooled and conditioned before capture.
          items:
            - label: Gas characterization
              detail: Composition and flow determine the site design.
            - label: Cooling and conditioning
              detail: Direct-contact cooling prepares gas for adsorption.
        - label: Structured filter
          detail: CALF-20 structured adsorbent selectively binds CO2.
          items:
            - label: MOF-coated media
              detail: Structured solid sorbent is the replaceable capture material.
        - label: Rotary adsorption
          detail: The machine moves adsorbent beds through operating zones.
          items:
            - label: Adsorption zone
              detail: Conditioned gas contacts the solid sorbent.
        - label: Regeneration
          detail: Low-pressure steam releases concentrated CO2.
          items:
            - label: Steam zone
              detail: Heat regenerates the adsorbent for reuse.
        - label: Purification and compression
          detail: Captured CO2 is conditioned for its downstream specification.
          items:
            - label: Cryogenic or catalytic purification
              detail: Configuration depends on purity and utility requirements.
        - label: Downstream disposition
          detail: Product CO2 moves to transport, storage, or utilization.
          items:
            - label: Site-specific interface
              detail: Compression, transport, permits, and storage remain external dependencies.
    approximationNotes: >-
      This source-based sequence is not a complete P&ID and does not imply that every installation
      uses identical equipment, utilities, or purification.
    claimRefs: [CE008, CE011, CE012, CE015]
callouts:
  - calloutType: strength
    title: Defined hardware and process architecture
    body: >-
      Named machine classes, a specified sorbent, and a disclosed adsorption-regeneration sequence
      make the technical proposition more concrete than a generic capture claim.
    claimRefs: [CE008, CE009, CE010, CE011]
  - calloutType: risk
    title: Factory capacity is not fleet performance
    body: >-
      Redwood's stated filter capacity does not establish factory utilization, installed-system
      availability, sorbent replacement cost, or customer acceptance at commercial scale.
    claimRefs: [CE003, CE004, CE013]
