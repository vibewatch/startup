company:
  name: Svante Technologies
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Svante's product is a physical carbon-capture system built around structured solid-sorbent
    filters, rotary adsorption machines, and project-specific balance-of-plant integration.
    Public evidence supports a defined architecture and commissioned filter manufacturing, but
    most deployment proof remains pilot- or engineering-study based, while fleet reliability,
    realized sorbent life, security controls, and current project economics remain diligence gaps.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: >-
      Svante's disclosed offering combines nanoengineered solid-sorbent filters, modular rotating
      contactor machines, and integration into a customer's wider capture chain. In customer terms,
      an industrial emitter or direct-air-capture developer must first characterize the gas stream,
      condition it, pass it through the adsorption equipment, regenerate the sorbent with steam,
      and then purify and compress the concentrated CO2 for use, transport, or storage. The capture
      module therefore does not remove the need for utilities, downstream infrastructure, or
      permitting. Public use cases span cement and energy pilots, filters supplied for Climeworks'
      direct-air-capture equipment, and a planned pulp-sector pilot at Sodra's Varo site. Those
      examples demonstrate application breadth, but they do not by themselves establish uniform
      commercial performance across different feed gases and site configurations.
    claimRefs: [CE001, CE002, CE006, CE007, CE016]
    tableRefs: [TE001, TE002]
  - id: architecture-and-performance
    title: Architecture and disclosed performance
    body: >-
      The clearest public technical description comes from the International CCS Knowledge Centre's
      summary of a Linde, Svante, and Kiewit pre-FEED study. It describes structured CALF-20
      adsorbent beds inside a rotary adsorption machine, with adsorption and regeneration occurring
      as the machine rotates through different zones. Conditioned flue gas contacts the sorbent;
      low-pressure steam releases concentrated CO2; and purification and compression prepare the
      product for downstream specifications. The study names URSA 1000 and URSA 2000 machine
      classes and models two URSA 2000 units in parallel. Its approximately 92% combined-flue-gas
      capture result, five-year projected sorbent life, and purification trade-offs are design-study
      outputs, not fleet-wide warranties or independently observed operating results.
    claimRefs: [CE005, CE008, CE009, CE010, CE011, CE012, CE013, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: manufacturing-and-deployment-maturity
    title: Manufacturing and deployment maturity
    body: >-
      Manufacturing readiness is more visible than operating-fleet maturity. Svante reported that
      it commissioned the Redwood facility in May 2025, and described the site as 141,000 square
      feet with nominal filter output sufficient for up to 10 million tonnes of annual CO2 capture.
      Carbon Herald and DecarbonFuse repeated the facility scale and cited pilot activity, but their
      accounts largely track the company's launch claims rather than supplying production audits.
      The assigned evidence also identifies Chevron Kern River and Lafarge Richmond pilot sites,
      while the November 2025 pulp-sector item described Sodra testing as planned for early 2026.
      The evidence pool contains no completion result for that plan. Commissioned factory capacity,
      pilot installation, and sustained commercial availability should therefore remain separate
      maturity categories in underwriting.
    claimRefs: [CE003, CE004, CE006, CE007, CE016]
  - id: differentiation-controls-and-risk
    title: Differentiation, controls, and technical risk
    body: >-
      Svante's differentiated elements are the structured MOF-coated filter, continuous rotary
      adsorption and regeneration architecture, named machine sizes, and an attempt to standardize
      filter manufacturing. The evidence does not establish that these attributes produce lower
      delivered cost or higher availability than alternatives at every site. The pre-FEED summary
      reports an environmental, health, and safety assessment and a hazard-identification review
      that found no high-potential risks requiring immediate attention, while still generating 50
      recommendations for design or FEED follow-through. It also models lower power and capital
      requirements for catalytic oxidation than for cryogenic purification, showing that technical
      outcomes depend on downstream purity requirements and utility choices. Public evidence does
      not disclose current quality certifications, cyber or control-system safeguards, incident
      history, factory yield, warranty performance, or multi-year field degradation data.
    claimRefs: [CE005, CE008, CE013, CE014, CE015]
