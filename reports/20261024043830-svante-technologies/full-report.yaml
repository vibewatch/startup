        - No verified current post-money valuation or defensible company-specific multiple
      - - Entry discipline
        - conditional
        - Require dated cap table, terms, revenue, margin, runway, backlog, and FIDs
    notes: >-
      Public sources mix company claims, partner announcements, database previews, and market benchmarks; unknown means
      unsupported by this assigned evidence, not zero.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV011
      - CV015
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Strategic validation
        - GE announced a JDA and equity investment in the Series E; BASF and 3M agreements are reported
        - Verify commercial scope, economics, and binding commitments
      - - Manufacturing scale
        - Redwood is described as a 141000-square-foot facility with stated 10-million-tonne annual capture capacity
        - Verify installed utilization, yield, capex, and customer orders
      - - Technology differentiation
        - Svante claims MOF filters, 95% capture, and sub-60-second capture and release
        - Obtain independent field data, degradation curves, and lifecycle cost
      - - Commercialization risk
        - Public evidence does not disclose audited revenue, margin, burn, runway, or current valuation
        - Provide audited accounts, backlog conversion, and cash forecast
      - - Capital-structure risk
        - Public databases describe multiple 2024 financings, but terms and a reconciled cap table are unavailable
        - Reconcile cap table, note conversion, preferences, and dilution
    notes: >-
      The table separates evidence-supported positives from unresolved underwriting conditions; no row implies that a
      partnership equals revenue.
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Financed projects reach FID, factory utilization scales, and audited revenue and margin improve
        - Use verified company-specific revenue and margin multiples; no numeric range is supportable now
        - Conditional and unpriced
        - Project cancellations or inability to verify utilization
      - - Base
        - Strategic funding continues but operating disclosure and project economics remain incomplete
        - Hold valuation unknown and require a risk-adjusted entry price
        - Most consistent with current public evidence
        - No audited accounts or note terms
      - - Bear
        - Commercial projects slip, capital intensity and replacement costs rise, and a down round is required
        - Principal loss through dilution and repricing is plausible
        - Material downside case
        - Failed FIDs, weak orders, or liquidity pressure
      - - Exit readiness
        - >-
          Repeatable commercial deployments and transparent financial reporting enable strategic or public-market
          optionality
        - Reassess only after measurable revenue, gross margin, and backlog evidence
        - Not established
        - Continued private financing without operating milestones
    notes: >-
      Scenario logic is qualitative because the assigned sources do not disclose current revenue, EBITDA, cash,
      valuation, conversion terms, or probability estimates; probability signal is a directional underwriting label, not
      a statistical forecast.
    claimRefs:
      - CV003
      - CV004
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
