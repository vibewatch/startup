      - number: '5.2'
        title: Architecture and disclosed performance
        blocks:
          - type: paragraph
            body: >-
              The clearest public technical description comes from the International CCS Knowledge Centre's summary of a
              Linde, Svante, and Kiewit pre-FEED study. It describes structured CALF-20 adsorbent beds inside a rotary
              adsorption machine, with adsorption and regeneration occurring as the machine rotates through different
              zones. Conditioned flue gas contacts the sorbent; low-pressure steam releases concentrated CO2; and
              purification and compression prepare the product for downstream specifications. The study names URSA 1000
              and URSA 2000 machine classes and models two URSA 2000 units in parallel. Its approximately 92%
              combined-flue-gas capture result, five-year projected sorbent life, and purification trade-offs are
              design-study outputs, not fleet-wide warranties or independently observed operating results.
            claimRefs:
              - CE005
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE015
