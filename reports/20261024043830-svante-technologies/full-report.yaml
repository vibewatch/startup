      - number: '5.3'
        title: Manufacturing and deployment maturity
        blocks:
          - type: paragraph
            body: >-
              Manufacturing readiness is more visible than operating-fleet maturity. Svante reported that it
              commissioned the Redwood facility in May 2025, and described the site as 141,000 square feet with nominal
              filter output sufficient for up to 10 million tonnes of annual CO2 capture. Carbon Herald and DecarbonFuse
              repeated the facility scale and cited pilot activity, but their accounts largely track the company's
              launch claims rather than supplying production audits. The assigned evidence also identifies Chevron Kern
              River and Lafarge Richmond pilot sites, while the November 2025 pulp-sector item described Sodra testing
              as planned for early 2026. The evidence pool contains no completion result for that plan. Commissioned
              factory capacity, pilot installation, and sustained commercial availability should therefore remain
              separate maturity categories in underwriting.
            claimRefs:
              - CE003
              - CE004
              - CE006
              - CE007
              - CE016
      - number: '5.4'
        title: Differentiation, controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Svante's differentiated elements are the structured MOF-coated filter, continuous rotary adsorption and
              regeneration architecture, named machine sizes, and an attempt to standardize filter manufacturing. The
              evidence does not establish that these attributes produce lower delivered cost or higher availability than
              alternatives at every site. The pre-FEED summary reports an environmental, health, and safety assessment
              and a hazard-identification review that found no high-potential risks requiring immediate attention, while
              still generating 50 recommendations for design or FEED follow-through. It also models lower power and
              capital requirements for catalytic oxidation than for cryogenic purification, showing that technical
              outcomes depend on downstream purity requirements and utility choices. Public evidence does not disclose
              current quality certifications, cyber or control-system safeguards, incident history, factory yield,
              warranty performance, or multi-year field degradation data.
            claimRefs:
              - CE005
              - CE008
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Defined hardware and process architecture
            body: >-
              Named machine classes, a specified sorbent, and a disclosed adsorption-regeneration sequence make the
              technical proposition more concrete than a generic capture claim.
            calloutType: strength
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: callout
            title: Factory capacity is not fleet performance
            body: >-
              Redwood's stated filter capacity does not establish factory utilization, installed-system availability,
              sorbent replacement cost, or customer acceptance at commercial scale.
            calloutType: risk
            claimRefs:
              - CE003
              - CE004
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Svante sells into a technically complex B2B workflow rather than a self-serve software motion. Public
              descriptions place the core buyer among hard-to-abate industrial operators in cement, pulp and paper,
              refining, steel, energy, and related process industries, while project developers and carbon-removal
              companies can act as channels or integration partners. The user and payer are not always the same: an
              industrial operator may host the capture equipment, a developer may arrange the project, and a downstream
              partner may handle utilization, liquefaction, transport, or storage. Svante's own technology page
              describes filters and modular rotary contactor machines for industrial emissions and air capture, while
              the Invest Vancouver case study identifies cement, pulp and paper, and refineries as served sectors. This
              is a credible segmentation signal, but the public record does not disclose customer counts, annual
              contract value, average sales cycle, or the share of revenue by segment.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU010
      - number: '6.2'
        title: Adoption trajectory and deployment maturity
        blocks:
          - type: paragraph
            body: >-
              The adoption record progresses from demonstration to pilot and pre-commercial engineering rather than a
              disclosed base of contracted production customers. The CCS Knowledge interview reports a 30-tonne-per-day
              pilot with Cenovus that was operating, a similarly sized Chevron facility commissioned in California, and
              a smaller Lafarge unit collecting data. The Mercer project had advanced to FEL-2, which is engineering and
              commercial-viability work rather than a final investment decision. Svante also announced a Södra pilot
              planned for early 2026 to test the technology in a Swedish pulp operation and evaluate future large-scale
              capture. These milestones demonstrate repeated industrial engagement and learning across different
              flue-gas environments, but they should not be treated as evidence of commercial revenue, fleet
              utilization, or completed full-scale deployments.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU005
              - CU006
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU006
              - CU008
              - CU009
              - CU013
      - number: '6.3'
        title: Named customer and partner proof
        blocks:
          - type: paragraph
            body: >-
              Named counterparties provide stronger evidence than undifferentiated logo claims, but the quality of proof
              varies by project stage. Cenovus and Chevron are described in an industry interview as hosts of
              industrial-scale pilots; Lafarge is associated with a cement demonstration and data collection; Mercer is
              associated with a FEL-2 pulp-mill project; Södra is associated with a future pilot and evaluation of
              scale-up; and Climeworks is described as using Svante filters in next-generation direct-air-capture
              systems. A separate collaboration with Carbon America is framed around identifying and deploying United
              States CCUS projects, while Project CO2MENT links Svante with Lafarge and Dimensional Energy in a
              utilization demonstration. The named relationships support market access and technical validation, but
              several are pilots, collaborations, or development phases, so outcomes, contract economics, renewal
              behavior, and customer-funded deployment remain unverified.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU010
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU008
              - CU010
      - number: '6.4'
        title: Retention, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose net retention, gross retention, churn, renewal rates, contract duration,
              customer concentration, repeat purchase, or utilization by installed unit. The available proof instead
              shows a land-and-expand style opportunity: pilots can generate operating data, then support engineering,
              financing, and final-investment decisions for larger projects; partnerships can also extend from capture
              equipment into utilization, direct-air capture, or source-to-sink development. That pathway is
              commercially plausible but remains an operating hypothesis until Svante provides a customer cohort, order
              book, signed-versus-pilot project list, and project-level economics. The Redwood manufacturing facility
              and broad sector coverage may improve delivery capacity, but manufacturing capacity is not the same as
              customer demand or realized revenue. The principal customer diligence question is therefore conversion
              from pilots and FEED-stage work into financed, operating projects with repeatable economics.
            claimRefs:
              - CU009
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-sector referenceability
            body: >-
              Named pilots and collaborations span cement, pulp and paper, refining or energy, utilization, and
              direct-air capture, giving Svante a broader reference surface than a single-site demonstration.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
              - CU010
          - type: callout
            title: Pilot-to-production conversion is unproven
            body: >-
              The retained evidence is strongest for pilots, demonstrations, planned tests, and FEL-2 work; it does not
              disclose a production fleet, recurring revenue, or final investment decisions for the named projects.
            calloutType: risk
            claimRefs:
              - CU005
              - CU006
              - CU011
              - CU012
          - type: callout
            title: Request a project-stage and cohort schedule
            body: >-
              Diligence should reconcile every named project to signed contract status, customer-funded scope, FID,
              commissioning, operating performance, and renewal or expansion terms.
            calloutType: recommendation
            claimRefs:
              - CU011
              - CU012
              - CU014
          - type: callout
            title: Manufacturing capacity is not demand
            body: >-
              The Redwood facility's stated capacity is a supply-side capability and should not be treated as realized
              customer demand, revenue, utilization, or order-book coverage.
            calloutType: assumption
            claimRefs:
              - CU009
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              CCUS deployment depends on permits, pore-space rights, financial assurance, transport, and storage that
              sit outside Svante's filter-manufacturing control. Arnold & Porter's 2026 update says California's draft
              concepts include monitoring, emergency-response, financial-responsibility, and potentially 100-year
              post-injection obligations. The same issuer reports that North Dakota courts invalidated a pore-space
              amalgamation statute and reversed related permit orders, while Louisiana had a Class VI moratorium and a
              31-project queue. Texas had transferred 18 projects after assuming primacy but had not issued a permit
              since. These are sector-level developments, not findings of a Svante violation. They nevertheless create
              schedule and bankability risk wherever customers depend on storage approvals. The assigned evidence does
              not establish Svante-specific litigation, enforcement, licensing, or IP disputes; silence is therefore a
              diligence gap, not proof of absence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
      - number: '7.2'
        title: Operational, technology, and quality risk
        blocks:
          - type: paragraph
            body: >-
              Svante's system requires the sorbent, laminate filters, rotary contactors, regeneration process, and
              customer balance-of-plant to perform together under variable industrial conditions. The company says
              CALF-20 is best suited to CO2 concentrations of 12% or more and offers BASF's liquid-amine process for
              lower-concentration streams, making feed-gas fit a real design constraint rather than a universal-product
              assumption. Svante also identifies BASF as its MOF scale-up partner, which mitigates supply risk but
              creates a named dependency whose capacity, quality remedies, and alternate sourcing are not public.
              Independent coverage reports a 141,000-square-foot factory with stated filter capacity for up to 10
              million tonnes of annual capture, yet nameplate output is not evidence of utilization, yield, warranty
              performance, or profitable commercial throughput.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR015
      - number: '7.3'
        title: Partner, financial, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Commercialization remains tied to counterparties and project milestones. Carbon Herald describes Chevron
              Kern River and Lafarge Richmond as pilot sites, so those references support deployment activity but not
              recurring production revenue or final-investment-decision conversion. Preqin reports a CAD 15 million
              November 2024 financing, while Multiples describes a Canada Growth Fund commitment of up to US$100 million
              in convertible notes split into project-linked tranches. CGF's own policy says it can use price assurances
              and offtake to address demand risk when private demand is still developing. Together, these sources point
              to capital availability but also to reliance on financing structures, sponsors, and downstream project
              economics. Multiples also reports the March 2026 acquisition of Carbon Alpha, adding project-development
              capability and integration risk. Audited liquidity, backlog quality, and customer concentration remain
              private-evidence gaps.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Monitoring indicators and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Monitoring should be project-specific and measurable. For regulation, track permit filings, approval
              dates, appeals, pore-space contracts, financial-assurance amounts, and storage-route changes. For
              operations, require independent capture-rate, uptime, sorbent-replacement, energy-use, factory-yield,
              warranty, and delivered-cost data. For commercial execution, separate pilots and feasibility studies from
              funded construction, final investment decisions, accepted equipment, and cash collections. Escalation
              triggers are a permit reversal, loss of storage rights, repeated failure against customer guarantees,
              inability to finance committed projects, or factory working capital growing faster than contracted demand.
              Thesis-break events are sustained field underperformance, loss of a critical sorbent source without a
              qualified substitute, or a liquidity shortfall before projects reach customer-funded construction. Public
              sources do not quantify Svante's thresholds, so management, customers, suppliers, insurers, and lenders
              must supply the evidence.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
              - CR010
              - CR012
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR009
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest residual exposure
            body: >-
              Svante cannot control the full permit-to-storage chain, and public evidence does not yet prove durable
              fleet economics or factory utilization at commercial scale.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR009
              - CR015
          - type: callout
            title: Diligence priority
            body: >-
              Require project-level permit and FID evidence, independent operating data, supplier protections, customer
              concentration, and a current liquidity schedule before treating capacity and strategic backing as proof of
              commercial scale.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR009
              - CR010
              - CR012
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports research-more rather than buy or pass. GE Vernova described its participation in
              Svante's US$318 million Series E and a joint-development agreement, while the company describes a platform
              spanning filters, rotary contactors, and process design. Those are meaningful strategic validation
              signals, but they are not a substitute for a current equity price or audited operating record. Preqin's
              accessible profile identifies a November 2024 CAD 15 million InBC transaction, while Multiples reports a
              separate August 2024 US$50 million round and describes Svante as privately held. Those data points do not
              reconcile a complete capitalization record or disclose the securities' economic terms. The market-data
              references provide public-company context, not a directly comparable valuation for a pre-revenue or
              commercially scaling equipment supplier. An investment decision should therefore be conditioned on a dated
              cap table, security terms, post-money valuation, conversion mechanics, backlog, recognized revenue, gross
              margin, burn, and cash runway.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV011
              - CV015
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Svante has converted a materials proposition into a manufacturing and
              ecosystem proposition. GE identifies the filters' use across multiple industrial sectors and reports that
              GE invested alongside the Series E; Innovation in Textiles reports BASF and 3M supply and manufacturing
              agreements; and independent coverage describes the 141,000-square-foot Redwood facility and a stated
              capacity to support filters for up to 10 million tonnes of annual capture. These facts improve the
              plausibility of scale and strategic distribution. The anti-thesis is that capacity and partnerships do not
              prove utilization, cash generation, or project-level returns. Exoswan's 2026 sector discussion shows
              direct-air-capture economics remain difficult, including a cited Mammoth output of 675 tonnes in the first
              half of 2026 against 36,000 tonnes of designed annual capacity, although that observation concerns a
              customer or adjacent market rather than Svante's own results. Svante's own site claims 95% capture and
              sub-60-second cycles, but those are company claims requiring independent operating validation. The thesis
              changes positively with audited recurring commercial revenue and funded projects; it changes negatively
              with delayed FIDs, low factory utilization, material sorbent replacement costs, or a down round.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, comparables, and diligence
        blocks:
          - type: paragraph
            body: >-
              A conventional revenue-multiple valuation cannot be responsibly applied from this pool because Svante's
              current revenue and margin base are undisclosed. Finerva reports a Q1 2026 median EV/Revenue multiple of
              5.4x for a broad green-energy cohort and a median EV/EBITDA multiple of 16.3x, but explicitly frames the
              data as a general benchmark and the cohort is composed of listed companies whose metrics differ from
              younger startups. Multiples lists public-company EV/Revenue examples including GE Vernova at 4.6x LTM and
              Bloom Energy at 14.5x LTM, but these are not operating or capital-structure matches. The defensible
              scenario range is therefore qualitative: bull requires contracted, financed projects, repeatable factory
              utilization, and auditable gross-margin progression; base assumes continued strategic funding but
              incomplete disclosure and pre-FID projects; bear assumes commercialization delays, dilution, and multiple
              compression before cash generation. Diligence should obtain the cap table and preference stack, the Canada
              Growth Fund note terms and draw status, project FIDs and economics, customer acceptance data, and audited
              FY2025/H1 2026 financials before any price is accepted.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV011
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              Strategic validation is meaningful, but public evidence does not establish a current price, post-money
              valuation, revenue base, margin profile, or runway.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV015
          - type: callout
            title: The key risk is underwriting opacity
            body: >-
              Multiple public descriptions of 2024 financing and unavailable conversion terms make dilution and downside
              impossible to price from this evidence alone.
            calloutType: risk
            claimRefs:
              - CV003
              - CV004
              - CV016
