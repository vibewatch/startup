  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer economics
        blocks:
          - type: paragraph
            body: >-
              The relevant market is point-source carbon capture and associated capture-equipment, modular-contactors,
              sorbent filters, engineering, and project-development services for industrial and biogenic emitters. It
              includes cement, pulp and paper, ethanol, waste-to-energy, refining, natural-gas processing, and selected
              power applications, plus adjacent direct-air-capture filter demand where the same filter platform is used.
              It excludes the full value of CO2 transport and geological storage unless those services are bundled into
              a project, and it excludes generic carbon offsets that do not require capture equipment. Svante's official
              product page describes a package built around structured adsorbent filters in a contactor using rapid
              temperature-swing adsorption, while the RBC Capital Markets interview identifies biogenic sectors as an
              initial affordability wedge because CO2 monetization is otherwise a deployment barrier. The status quo is
              continued emissions, efficiency-only retrofits, solvent or other incumbent capture systems, and internal
              project development; each substitute can win when permitting, energy use, or storage access outweighs
              filter performance.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and conversion risk
        blocks:
          - type: paragraph
            body: >-
              The available market estimates are not interchangeable. Fortune Business Insights reports a USD 4.51
              billion global CCS market in 2025 and USD 5.31 billion in 2026, forecasting USD 19.98 billion by 2034 at
              an 18.03% CAGR; its scope covers capture, transport, and storage and reports North America at 59.65% of
              2025 market share. A separate RBC interview frames a potential USD 25 billion annual opportunity at USD
              100 per tonne and 250 million tonnes of annual deployment, but this is a scenario derived from an
              affordability threshold rather than observed revenue. Global Cement's 2026 tracker discussion is a more
              constrained deployment lens: more than 175 cement projects are mapped, yet less than 2% of cement-industry
              emissions are expected to be captured by 2035 and LeadIT forecasts approximately 58 Mt/yr from 38
              commercial-scale cement projects in 2035. These lenses imply substantial demand but also a wide funnel
              from announced projects to permitted, financed, operating assets. Svante's 2023 presentation contains
              project case studies and an internal commercialization path, but its estimates are company material rather
              than independent market sizing.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
      - number: '2.3'
        title: Adoption path, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The buyer is generally an industrial asset owner or project developer; the plant operator uses the
              equipment, the corporate decarbonization or operations team sponsors the project, and the payer is the
              asset owner, a project-finance vehicle, or a public-private funding structure. The trigger is a
              combination of emissions obligations, a credible CO2 offtake or storage route, and a financeable value
              stack. Section 45Q can materially improve that stack: the reviewed guide states that the current credit
              values for 2024-2026 are $85 per metric ton for qualifying industrial or power capture and $180 per metric
              ton for direct air capture, subject to thresholds, monitoring, and recapture exposure. World Oil's 2026
              review shows permitting is improving but still slow: 106 Class VI applications covering 387 wells were
              under review at the end of Q1 2026, while only five projects were actively injecting CO2. Global Cement
              reports that early projects depend on government finance and CO2 transport and storage infrastructure, and
              that two major cement projects had stalled. These constraints raise switching costs and extend sales
              cycles even where the capture technology is technically suitable.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM015
              - CM016
      - number: '2.4'
        title: Implications for Svante's market conversion
        blocks:
          - type: paragraph
            body: >-
              Svante's strongest market-fit evidence is concentrated in modular point-source capture for industrial and
              biogenic emitters. Its official product description states that filters are inserted into a contactor that
              captures and releases high purity CO2 every 60 seconds, and the 2025 RBC interview identifies a current
              sweet spot of 12-20% CO2 flue gas for pulp, paper, and cement, with development work aimed at lower
              concentrations. A 2023 Svante presentation describes two 10-kta units as in operation or processing flue
              gas and presents case studies with estimated 10% CAPEX and 43% OPEX reductions in one refinery
              configuration; those savings remain company material and should not be treated as independently verified.
              The addressable market therefore should be underwritten from named projects, capture tonnage, storage
              access, and financing status rather than the broad CCS TAM. The same 2023 presentation includes 416 TPD
              refinery and 2,777 TPD cement case examples, but those figures remain company material rather than
              independently verified operating results. The principal diligence gaps are the share of announced projects
              reaching FID, realized equipment pricing and gross margins, long-run sorbent durability and replacement
              cost, and the proportion of Svante's pipeline that has a permitted storage and bankable offtake path.
            claimRefs:
              - CM009
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The addressable market is infrastructure-constrained
            body: >-
              Demand can be large while near-term conversion remains limited by storage permits, transport networks,
              public support, and project finance. Underwriting should therefore use project-level milestones rather
              than headline CCS TAM.
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
              - CM014
          - type: callout
            title: A broad TAM does not establish Svante's SAM
            body: >-
              The evidence does not disclose Svante's realized pricing, share of qualified projects, FID conversion
              rate, or recurring service economics. Those gaps prevent a defensible company-specific SAM/SOM.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant competitive set is broader than solid-sorbent vendors. Industrial emitters can buy modular
              solvent systems from SLB Capturi or Carbon Clean, pursue larger engineered systems associated with
              incumbents such as Mitsubishi Heavy Industries, select a direct-air-capture pathway from Climeworks or
              Carbon Engineering for removal rather than point-source abatement, build a bespoke integration around
              licensed components, or defer the project. That final option is economically material: independent
              reporting says some United States projects have been cancelled or paused after federal support was
              reduced. Svante therefore competes not only on capture performance but on whether its modular equipment,
              engineering partners, and project-development support can make a customer's full project financeable. The
              public sources establish the categories and selected operating indicators, but they do not provide a
              normalized, independently tested ranking of cost, capture rate, sorbent life, or availability.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
      - number: '3.2'
        title: Capability, deployment evidence, and route to market
        blocks:
          - type: paragraph
            body: >-
              Svante's core product claim is unusually specific: CALF-20 solid sorbent is positioned for flue streams
              with carbon-dioxide concentrations of 12% or more, while the company offers BASF OASE blue liquid-amine
              systems for lower concentrations. This broadens addressable use cases but also puts Svante into more
              direct competition with mature solvent suppliers. SLB Capturi presents the strongest public operating
              counterpoint in this pool, citing more than 60,000 operating hours, third-party certification,
              standardized Just Catch units, and larger tailored Big Catch systems. Svante is building a different
              commercialization stack around proprietary filters, rotary contactors, engineering alliances, digital
              services, and project development. Its use of Rescale computing may shorten simulation and prototyping
              cycles, but that partner-oriented account is not an independent performance benchmark.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP014
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.3'
        title: Pricing, packaging, and switching
        blocks:
          - type: paragraph
            body: >-
              Public pricing remains the largest comparison gap. Preqin describes Svante's transactions as bespoke
              business-to-business installations and support arrangements whose terms vary with project scale and
              complexity; Svante's own reviewed pages publish no list price or realized cost per captured tonne. SLB
              Capturi separates standardized modular plants from tailored large systems, while removal-focused providers
              sell different outcomes, including credits or long-term offtake, so their headline per-tonne figures are
              not directly comparable with point-source equipment prices. Switching costs arise from plant-specific
              front-end engineering, permitting, heat integration, sorbent or solvent supply, operator training, and
              transport-and-storage interfaces. Svante's alliances can reduce integration friction, but they also create
              dependency on partners for materials, engineering, construction, and storage. Multi-homing is most
              plausible before final technology selection; after design freeze, changing capture platforms would likely
              require material re-engineering.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Svante's defensibility appears to rest on the combination of CALF-20 materials, structured filters, rotary
              contactors, manufacturing know-how, and a partner network rather than on any single published performance
              metric. The 2026 Fast Company recognition is a positive visibility signal, but it was announced by Svante
              and does not substitute for comparative field data. Low-cost chemical incumbents can improve solvent
              systems, engineering majors can bundle capture into complete plants, and direct-air-capture providers can
              win budgets aimed at removals rather than facility abatement. Public evidence also leaves sorbent
              replacement intervals, degradation under contaminants, uptime, warranty terms, and total lifecycle cost
              unresolved. The moat is therefore promising but not demonstrated as durable at fleet scale. Underwriting
              should require comparable bids and operating datasets from matched flue streams before assigning a cost or
              reliability premium to Svante.
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP009
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is architectural, not yet economic
            body: >-
              Svante combines proprietary sorbent material, structured filters, rotary contactors, manufacturing, and
              partner-enabled project delivery. The reviewed evidence does not yet prove that this architecture wins on
              total installed or lifecycle cost.
            calloutType: strength
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP016
          - type: callout
            title: The status quo competes for capital
            body: >-
              Project cancellation and delay can beat every technology vendor when policy, transport, storage, and
              financing conditions are uncertain.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Svante's disclosed commercial architecture is industrial and project-led, not a subscription model. The
              company manufactures structured adsorbent filters and rotary adsorption machines, delivers machinery with
              balance-of-plant equipment, and participates in project development. Its 2026 strategy also proposes
              monetizing captured biogenic CO2 through removal credits. These mechanisms could produce equipment,
              engineering, service, or credit revenue at different stages, but the evidence does not provide recognized
              revenue by stream, booked backlog, acceptance milestones, warranty exposure, or recurring-service attach
              rates. Nameplate capture capacity therefore cannot be treated as sales, and an announced project cannot be
              treated as revenue before financing, contracting, delivery, and accounting recognition are demonstrated.
