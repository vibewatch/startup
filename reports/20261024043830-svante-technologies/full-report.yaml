      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Capital raised or invested is not cash available. InBC quoted Svante's CEO saying that investors had made
              C$800 million of capital investment over the prior decade, while Tracxn's fetched profile reports US$493
              million across 18 funding rounds. Currency, date, and scope are not reconciled, and neither figure
              establishes current liquidity. The adverse sector benchmark is also material: DeSmog's account of IEEFA
              analysis on a different Canadian CCS project warns that costs can exceed per-tonne revenue without
              efficiency gains. That evidence is not a Svante performance record, but it reinforces the need for cash,
              burn, debt, project-finance, subsidy, utilization, and unit-cost data. The financial verdict is
              research-more until those inputs and contracted economics are disclosed.
