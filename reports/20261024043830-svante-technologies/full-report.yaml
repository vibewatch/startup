  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Svante Technologies is presented by Preqin as established in 2007 in Burnaby, British Columbia, while
              Svante's own materials describe a company with more than 15 years of operating history. Its stated
              business is to make filters and machines that capture or remove CO2 from industrial emissions and the air.
              The core approach uses solid sorbents and metal-organic frameworks in structured filters, with captured
              CO2 concentrated to pipeline-grade purity for storage or use. The model is therefore more than a component
              sale: it combines engineered equipment, materials, manufacturing, and project support for hard-to-abate
              industrial customers. The available record supports commercial intent and manufacturing scale-up, but not
              a verified recurring-revenue or installed-base metric.
