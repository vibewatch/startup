        title: Pricing, incentives, and go-to-market
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is limited to economic reference points rather than executed Svante contracts.
              Forbes reported CEO Claude Letourneau's statement that the technology can remove carbon for $150 per
              tonne, while the same article cited U.S. Section 45Q credits of $85 per tonne for underground storage and
              $60 per tonne for utilization. These figures use different concepts: the first is a company-asserted
              capture cost and the others are policy incentives, not Svante list prices or realized revenue. The
              go-to-market motion appears consultative and project-specific, spanning studies, integration, equipment
              delivery, and credit development. Underwriting requires actual quotations, discounting, payment
              milestones, customer contributions, and the allocation of transport and storage costs.
            claimRefs:
