  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Svante's disclosed offering combines nanoengineered solid-sorbent filters, modular rotating contactor
              machines, and integration into a customer's wider capture chain. In customer terms, an industrial emitter
              or direct-air-capture developer must first characterize the gas stream, condition it, pass it through the
              adsorption equipment, regenerate the sorbent with steam, and then purify and compress the concentrated CO2
              for use, transport, or storage. The capture module therefore does not remove the need for utilities,
              downstream infrastructure, or permitting. Public use cases span cement and energy pilots, filters supplied
              for Climeworks' direct-air-capture equipment, and a planned pulp-sector pilot at Sodra's Varo site. Those
              examples demonstrate application breadth, but they do not by themselves establish uniform commercial
              performance across different feed gases and site configurations.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
