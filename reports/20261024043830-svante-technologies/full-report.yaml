      - number: '4.3'
        title: Cost structure, operating leverage, and traction
        blocks:
          - type: paragraph
            body: >-
              Redwood is the clearest public indicator of fixed-cost and operating leverage. Independent and
              company-distributed accounts describe a 141,000-square-foot facility able to manufacture filters
              supporting up to 10 million tonnes of annual CO2 capture and associate the facility with a US$145 million
              capital investment. Those figures show scale and capital intensity, not utilization or margin. Relevant
              cost drivers include factory yield, filter material, machinery, commissioning, energy, sorbent
              replacement, field service, warranties, working capital, and depreciation. A DOE-supported pre-FEED study
              provides project-development evidence, but the source describes funding of up to $1.5 million and a future
              final-investment-decision condition rather than an operating deployment or customer revenue.
