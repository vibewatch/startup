company:
  name: Svante Technologies
chapter:
  number: 1
  title: Company Overview
  summary: Svante is a Vancouver-area carbon-management company developing solid-sorbent filters, rotary contactors, and project-development services for industrial capture and carbon removal. Public evidence supports a commercialization-stage manufacturing and project platform, but does not establish a post-money valuation, audited revenue, or cash runway.
sections:
  - id: identity-and-business-model
    title: Identity, product, and operating model
    body: >-
      Svante Technologies is presented by Preqin as established in 2007 in Burnaby, British Columbia,
      while Svante's own materials describe a company with more than 15 years of operating history. Its
      stated business is to make filters and machines that capture or remove CO2 from industrial emissions
      and the air. The core approach uses solid sorbents and metal-organic frameworks in structured filters,
      with captured CO2 concentrated to pipeline-grade purity for storage or use. The model is therefore
      more than a component sale: it combines engineered equipment, materials, manufacturing, and project
      support for hard-to-abate industrial customers. The available record supports commercial intent and
      manufacturing scale-up, but not a verified recurring-revenue or installed-base metric.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-dependence
    title: Leadership, partners, and key-person exposure
    body: >-
      The public materials identify Claude Letourneau as President and CEO and Richard Laliberte as COO,
      while Scott Gardner is identified as President of Svante Development. Letourneau is repeatedly the
      executive quoted on strategy, manufacturing scale, and project finance, making him a visible
      decision-maker and a potential key-person dependency. The operating model also depends on external
      industrial and financial relationships: BASF supplies scaled CALF-20 material under a commercial
      agreement, Mercer is evaluating a pulp-mill project, and Microsoft is an anchor buyer for North Star
      carbon-removal credits. These relationships broaden functional coverage, but they do not constitute
      evidence that projects have reached final investment decision or that offtake converts to Svante
      product revenue.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: financing-and-scale
    title: Financing, manufacturing scale, and disclosure limits
    body: >-
      Svante's 2024 Canada Growth Fund announcement describes up to US$100 million of convertible-note
      financing, split between an immediate US$50 million tranche and a potential US$50 million second
      tranche subject to project-specific requirements and approvals. Independent coverage also describes
      the Redwood facility as a 141,000-square-foot Burnaby plant designed for filters capable of capturing
      up to 10 million tonnes of CO2 annually, while company-issued material describes a US$145 million
      capital investment in the manufacturing facility. These are financing commitments and engineering
      capacity claims, not revenue, cash available, or valuation. No assigned source establishes a current
      post-money valuation, audited revenue, burn rate, or runway, so those metrics remain diligence gaps.
    claimRefs: [CO009, CO010, CO011, CO012]
    figureRefs: [FO001]
  - id: milestones-and-execution
    title: Milestones and execution status
    body: >-
      The milestone record shows a progression from founding and materials development to industrial
      supply, factory commissioning, and project-level commercialization. The 2023 BASF announcement
      describes CALF-20 scale-up and a commercial supply agreement; 2025 coverage describes Redwood and
      pilot deployments at Chevron's Kern River site and Lafarge's Richmond cement plant. In 2026,
      Microsoft offtake coverage describes 626,000 tonnes of credits over 15 years for North Star, with
      commercial operation planned for early 2029, while Mercer-related coverage places a Peace River
      project in engineering and commercial-viability evaluation. The evidence therefore supports a
      credible development pipeline, but also shows that several economic and construction milestones are
      future or conditional rather than completed operating results.
    claimRefs: [CO013, CO014, CO015, CO016]

