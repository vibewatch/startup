evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited GAAP income statements, cash flow statements, and gross margin breakdowns.
    whyItMatters: >-
      Essential to evaluate underlying operational profitability, gross margins, and cash burn independent of high-level
      ARR estimates.
    diligencePath: Request audited historical GAAP financial statements and tax filings through transaction dataroom disclosures.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: cohort-retention
    missingEvidence: Audited net revenue retention (NRR), gross dollar retention, and enterprise cohort expansion data.
    whyItMatters: >-
      Crucial for determining whether single-digit ARR growth stems from customer churn, seat contraction, or pricing
      resistance.
    diligencePath: Review cohort renewal schedules, seat utilization trends, and contraction rates by enterprise account tier.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-coverage
    missingEvidence: Complete cap-table breakdown and exhaustive minority shareholder ledger for table TO003.
    whyItMatters: >-
      Table TO003 captures a representative sample of major institutional leads and strategic corporate investors, but
      omits smaller secondary holders, angel participants, and employee option pools.
    diligencePath: Inspect official capitalization table and transaction shareholder registers in closing dataroom.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: retention-and-nrr
    missingEvidence: >-
      Audited enterprise net revenue retention (NRR), gross renewal rates, and cohort seat expansion/contraction
      metrics.
    whyItMatters: >-
      Without cohort retention data, it is impossible to verify whether Miro's $600M ARR plateau is driven by logo churn
      or enterprise seat down-scoping.
    diligencePath: Request audited cohort renewal schedules and expansion bridge waterfall during confirmatory merger due diligence.
    relatedQuestionRefs:
      - QM003
  - id: GM002
    type: missing-source
    severity: material
    topic: ai-monetization
    missingEvidence: Disaggregated revenue, pricing uplift, and paid attach rates for Miro AI Workflows and Sidekicks.
    whyItMatters: >-
      Determines whether AI features drive incremental ARR or merely serve as defensive features to mitigate churn
      against bundled suites.
    diligencePath: >-
      Analyze SKU-level packaging revenue breakdown and token/consumption usage billing in enterprise customer
      contracts.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: material
    topic: figjam-displacement-churn
    missingEvidence: >-
      Granular enterprise account seat reduction and churn metrics specifically resulting from FigJam zero-cost bundling
      in Figma-licensed accounts.
    whyItMatters: >-
      Determines whether incumbent bundling poses an existential revenue risk to Miro's design department expansion or
      merely slows incremental seat growth.
    diligencePath: >-
      Audit customer procurement renewal data, net revenue retention (NRR) cohorts for design personas, and enterprise
      contract renegotiation terms.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-margins
    missingEvidence: >-
