      workflows created inside the product. This turned customers into contributors, giving Miro a constant stream of
      fresh, practical content produced largely by the community rather than the marketing team alone... Rather than
      beginning with large enterprise sales contracts, Miro grew by letting individual employees, designers and small
      teams start using the free version for their own projects. Once a product proved useful inside pockets of a large
      organisation, Miro's sales team could then approach that company with evidence of existing internal usage to sell
      a company-wide licence.
