chapter:
  number: 8
  title: "Valuation"
  summary: "Miro's valuation history reflects one of enterprise SaaS's sharpest market resets, transitioning from a peak $17.5 billion Series C valuation in 2022 to an agreed $1.355 billion enterprise value ($1.79 billion equity value net of cash) sale to Bending Spoons in September 2026. At an implied multiple of 2.3x ARR on roughly $600 million in annual recurring revenue, the transaction demonstrates severe late-stage preference compression while establishing an attractive, cash-flow-supported entry price for a scaled, profitable collaboration platform."
sections:
  - id: "investment-thesis-antithesis"
    title: "Investment Thesis and Anti-Thesis"
    body: "The core investment thesis for Miro rests on its entrenched enterprise footprint, robust scale, and profitability, now accessible at a compressed valuation multiple of approximately 2.3x ARR. Generating approximately $600 million in ARR with nearly 90% derived from business and enterprise accounts, Miro serves over 250,000 organizations, including more than 750 enterprise customers contributing over $100,000 annually. The company carries $435 million in net cash and operates profitably, insulating it from capital depletion and near-term refinancing pressures. Furthermore, Miro has expanded beyond generic digital whiteboarding into an AI Innovation Workspace, deploying collaborative AI Workflows and integrations into enterprise ecosystems like Microsoft Teams, Jira, and Slack. Conversely, the anti-thesis underscores severe top-line deceleration, intense competitive pressure from bundled workplace suites (notably Microsoft Whiteboard, Google Workspace, and Figma/FigJam), and an abrupt valuation collapse that wiped out common equity value for post-2021 hires. The 92% valuation compression from its $17.5 billion Series C peak highlights that Miro was priced in 2022 as an indispensable enterprise platform but matured into a slower-growing, mid-multiple software utility."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV005"
    tableRefs:
      - "TV002"
    figureRefs: []
  - id: "financing-valuation-reset"
    title: "Financing Context, Valuation Trajectory, and Deal Mechanics"
    body: "Miro's capital history encompasses $476 million in cumulative equity funding across institutional rounds, culminating in its landmark $400 million Series C in January 2022 led by ICONIQ Growth, Accel, and Atlassian, with participation from Salesforce Ventures and Dragoneer at a post-money valuation of $17.5 billion. That round priced Miro at an extreme forward multiple exceeding 25x-30x on estimated 2022 revenues. On September 10, 2026, Italian digital holding company Bending Spoons entered into a definitive agreement to acquire Miro in an all-cash transaction valued at $1.355 billion enterprise value, representing roughly $1.4 billion headline transaction value and $1.79 billion in total equity value when adding Miro's $435 million in net cash balance. The transaction mechanics reveal crucial cap-table dynamics: the $1.79 billion equity value successfully clears the liquidation preference stack for preferred venture investors, ensuring full capital recovery for late-stage backers while leaving 2021-and-later employee stock options entirely underwater. Demonstrating strategic alignment and confidence in the operating model, certain Miro shareholders agreed to roll $295 million of their deal proceeds into newly issued equity of public acquirer Bending Spoons."
    claimRefs:
      - "CV001"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV010"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "comparable-benchmarks-scenarios"
    title: "Comparable Multiples, Scenario Analysis, and Diligence Asks"
    body: "In private software market comparables, Miro's transaction mirrors the acquisition of collaboration peer Airtable by Bending Spoons, which was agreed at $1.285 billion enterprise value (approx. $2.25 billion equity value) against roughly $480 million in ARR (a 2.7x ARR multiple), down over 80% from its $11 billion peak 2021 valuation. Across private and public peers, collaboration and productivity software multiples have sharply deflated from pandemic-era highs of 20x-50x ARR to mid-single-digit levels (2.0x-4.0x) for mature businesses growing under 15% annually. Our scenario analysis indicates that under a base case reflecting Bending Spoons' operational playbook—involving aggressive cost rationalization, restructuring, and stabilization of enterprise ARR—Miro generates durable free cash flow supporting an equity valuation of $1.79 billion to $2.20 billion (2.3x-2.8x ARR). A bull case where AI Workflows reaccelerate seat expansion across Fortune 500 accounts yields $2.50 billion (3.5x ARR), whereas a bear case marked by enterprise seat consolidation and customer attrition to bundled suites compresses valuation to $1.20 billion (1.8x ARR). Key diligence asks include verifying exact customer renewal cohort retention, post-acquisition engineering turnover, and the closing timeline before the September 2027 outside date."
    claimRefs:
      - "CV002"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV003"
    figureRefs: []
