callouts:
  - calloutType: "insight"
    title: "The Great SaaS Valuation Unwinding"
    body: "Miro's valuation trajectory highlights the profound repricing of growth-stage collaboration software. In 2022, zero-rate market conditions allowed growth investors to price Miro at $17.5 billion—a multiple exceeding 40x trailing revenue. By late 2026, an acquirer operating under disciplined cash-flow economics purchased the asset at 2.3x ARR ($1.355 billion EV), echoing Airtable's recent sale at 2.7x ARR. The business expanded revenues to $600 million and maintained profitability, demonstrating that multiple compression, rather than fundamental operational collapse, drove the 92% valuation reset."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV006"
      - "CV011"
  - calloutType: "risk"
    title: "Cap Table Preferences and Employee Equity Exposure"
    body: "While the $1.79 billion equity value clears the $476 million cumulative preference stack held by Series A through Series C venture investors (including ICONIQ, Accel, and Atlassian), employee equity holders who joined during or after the 2022 Series C round face severe option impairment. Diligence on post-acquisition performance must focus on whether key product and engineering staff accept retention packages or depart under Bending Spoons' historical restructuring playbook."
    claimRefs:
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV013"
