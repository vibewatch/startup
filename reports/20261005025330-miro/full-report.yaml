        title: Exhibits
        blocks:
          - type: callout
            title: Infinite Canvas Concurrency and Ecosystem Breadth
            body: >-
              Miro's core strength lies in its real-time multi-user rendering engine capable of maintaining smooth
              visual synchronization for hundreds of concurrent participants across thousands of canvas elements,
              reinforced by an extensive ecosystem of 250+ enterprise application integrations.
            calloutType: strength
            claimRefs:
              - CE003
              - CE005
          - type: callout
            title: Canvas Drift vs Code-Centric Architecture
            body: >-
              Because Miro diagrams operate on a visual canvas rather than a reusable underlying code or semantic data
              model, technical architecture diagrams risk drifting from production reality unless engineering teams
              manually reconcile visual layouts with Git repositories and deployment pipelines.
            calloutType: risk
            claimRefs:
