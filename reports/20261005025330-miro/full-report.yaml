      - number: '7.3'
        title: Regulatory Compliance, AI Governance Safeguards, and Third-Party Confusion
        blocks:
          - type: paragraph
            body: >-
              On legal, privacy, and compliance fronts, Miro maintains an extensive enterprise compliance posture
              designed to mitigate regulatory exposure under global data frameworks such as GDPR and CCPA. Miro's Trust
              Center documents external validation under ISO/IEC 42001 for artificial intelligence management systems,
              coupled with annual ISO and NIST risk assessments, immutable AI activity audit logging, and strict data
              handling restrictions that exclude customer enterprise data from foundational model training. Miro Legal
              enforces a comprehensive global Code of Conduct across its corporate subsidiaries covering
              anti-discrimination, voluntary labor, conflicts of interest, and mandatory employee certifications under
              penalty of termination. Additionally, external commercial confusion arises from distinct legal entities
              sharing the 'Miro' brand name, such as West African forestry operator Miro Forestry Developments Limited,
              requiring corporate diligence teams to maintain strict identity separation between software assets and
              unrelated international industrial operators.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Reset and Human Capital Flight Risk
            body: >-
              The 92% valuation compression to $1.355B EV clears senior liquidation preferences but leaves post-2021
              employee stock options deeply underwater. With Bending Spoons' historical restructuring playbook
              frequently cutting up to 70% of staff, unvested talent retention represents Miro's single largest
              operational fragility prior to deal closure.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Procurement Friction in Collaborative Work Management
            body: >-
              While entry-level pricing starts at $8 to $20 per member monthly, enterprise buyers face compounding
              friction when inactive viewers inadvertently convert into paid seats. Clear role governance and
              contractually defined renewal true-downs are essential to prevent post-pilot bill shock.
            calloutType: insight
            claimRefs:
