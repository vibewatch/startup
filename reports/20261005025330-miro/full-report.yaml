      - number: '7.2'
        title: Enterprise Total Cost of Ownership, Workflow Governance, and User Friction
        blocks:
          - type: paragraph
            body: >-
              Beyond corporate ownership transitions, Miro faces distinct operational and procurement hurdles in
              enterprise customer accounts. Procurement assessments across Collaborative Work Management buyers
              emphasize that first-year total cost of ownership escalates rapidly beyond entry seat pricing due to
              administrative role governance, complex integration overhead, and emerging AI credit consumption. A
              prominent operational vulnerability arises from license assignment mechanics: mistaking passive board
              viewers or external collaborators for paid licensed members frequently triggers unexpected billing shocks
              and procurement friction at annual renewal. Furthermore, while Miro actively integrates with enterprise
              trackers such as Jira, user sentiment highlights workflow friction when visual canvases duplicate
              structured ticketing systems, risking adoption fatigue if teams treat boards as non-essential busy work.
              Miro's rapid expansion of community templates and multi-step AI Workflows introduces secondary operational
              risks surrounding template sprawl, uncurated board maintenance, and performance degradation across
              long-lived enterprise canvases.
            claimRefs:
