  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Miro operates a dual-engine commercial model spanning product-led self-serve adoption and top-down
              enterprise expansion across more than 250,000 customer organizations and 100 million aggregate users
              globally. The customer base bifurcates into high-volume self-serve teams—primarily product managers,
              designers, agile coaches, and engineering squads—and centralized enterprise buyer organizations where
              procurement, IT, and security govern seat provisioning. Enterprise demand is concentrated among Fortune
              100 technology, financial services, consulting, and retail organizations requiring enterprise-grade
              administrative controls, single sign-on, and compliance architectures. While self-serve adoption provides
              rapid departmental entry without sales friction, large account monetization relies on converting
              fragmented team licenses into standardized enterprise agreements. In mature enterprise deployments,
              cross-functional innovation initiatives drive usage beyond pure product development into business
              transformation, strategic planning, and operational workflows.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU011
