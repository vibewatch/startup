      - - Investment Thesis
        - Category-Leading Visual AI Innovation Canvas
        - Successful rollout of collaborative AI Workflows and 250+ application ecosystem integrations.
        - Enterprise customers abandoning Miro for native Microsoft 365 Copilot and FigJam canvases.
      - - Anti-Thesis
