      - number: '5.4'
        title: Enterprise Governance, Security Controls, and Monitoring
        blocks:
          - type: paragraph
            body: >-
              For enterprise deployments, Miro implements institutional security, access governance, and compliance
              infrastructure necessary for large multinational organizations [CE010]. Administrative controls encompass
              Single Sign-On (SSO) authentication, automated identity provisioning via SCIM protocols, and granular
              role-based access permissions governing board editing and sharing [CE010]. The underlying data
              infrastructure enforces encryption both at rest and in transit across all collaborative assets, backed by
              compliance certifications including SOC 2 Type II, ISO 27001, GDPR, and HIPAA [CE010]. To satisfy
              enterprise operational compliance and IT auditability, Miro integrates with third-party observability
              platforms such as Datadog via dedicated monitoring plugins, providing automated health checks, ingestion
              of audit logs, and status validation for enterprise security operations centers [CE011]. Commercial
              packaging tiers range from credit-capped entry tiers to managed Business and Enterprise plans with
              governance add-ons [CE012].
            claimRefs:
              - CE010
              - CE011
              - CE012
