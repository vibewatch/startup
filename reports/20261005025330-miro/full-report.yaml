      - number: '6.4'
        title: Retention Dynamics, Procurement Scrutiny, and Strategic Durability
        blocks:
          - type: paragraph
            body: >-
              Despite extensive customer adoption, Miro faces intensifying procurement scrutiny and retention headwinds
              as enterprise technology budgets rationalize horizontal collaboration software. Customer concentration
              risk is low at the account level given a diversified installed base featuring more than 750 accounts
              paying over $100,000 in ARR, but category vulnerability is acute. Unlike mission-critical systems of
              record such as core databases, identity providers, or financial ledgers, visual whiteboarding tools sit
              closer to discretionary spending and are highly susceptible to consolidation into bundled vendor suites
              such as Microsoft 365. To address seat monetization friction, Miro manages pricing and packaging as an
              iterative product discipline spanning self-serve and enterprise tiers. Nevertheless, broader unit economic
              pressures, slowing top-line expansion, and margin normalization culminated in Bending Spoons agreeing to
              acquire Miro in September 2026 for $1.355 billion in enterprise value—a steep valuation reset reflecting
              market demands for durable cash flow efficiency over unmonetized user volume.
            claimRefs:
              - CU003
              - CU011
              - CU012
