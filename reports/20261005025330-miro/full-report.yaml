      - number: '5.2'
        title: Platform Architecture, Scalability, and AI Orchestration
        blocks:
          - type: paragraph
            body: >-
              The core technical foundation of Miro rests on a high-concurrency infinite canvas rendering engine built
              to maintain low-latency synchronization across distributed global teams [CE005]. The engine is engineered
              to handle massive collaborative sessions involving hundreds of simultaneous participants and thousands of
              visual elements per board without performance degradation or state desynchronization [CE005]. Beyond basic
              whiteboard mechanics, Miro has layered multi-step collaborative AI workflows consisting of Flows,
              specialized conversational agents termed Sidekicks, and visual context processing that treats board
              contents as structured prompt context [CE006]. The architecture provides multi-model flexibility by
              integrating leading foundation model providers including OpenAI, Anthropic, and Google, while connecting
              to enterprise knowledge graphs such as Microsoft Copilot, Glean, and Gemini Enterprise to ground
              generative tasks in corporate data [CE006]. Miro exposes model context protocols and custom API
              interfaces, enabling automated architectural documentation generation and decision record capture [CE007].
            claimRefs:
