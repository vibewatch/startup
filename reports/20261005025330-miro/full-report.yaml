  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Miro rests on its entrenched enterprise footprint, robust scale, and
              profitability, now accessible at a compressed valuation multiple of approximately 2.3x ARR. Generating
              approximately $600 million in ARR with nearly 90% derived from business and enterprise accounts, Miro
              serves over 250,000 organizations, including more than 750 enterprise customers contributing over $100,000
              annually. The company carries $435 million in net cash and operates profitably, insulating it from capital
              depletion and near-term refinancing pressures. Furthermore, Miro has expanded beyond generic digital
              whiteboarding into an AI Innovation Workspace, deploying collaborative AI Workflows and integrations into
              enterprise ecosystems like Microsoft Teams, Jira, and Slack. Conversely, the anti-thesis underscores
              severe top-line deceleration, intense competitive pressure from bundled workplace suites (notably
              Microsoft Whiteboard, Google Workspace, and Figma/FigJam), and an abrupt valuation collapse that wiped out
              common equity value for post-2021 hires. The 92% valuation compression from its $17.5 billion Series C
              peak highlights that Miro was priced in 2022 as an indispensable enterprise platform but matured into a
              slower-growing, mid-multiple software utility.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV009
      - number: '8.2'
        title: Financing Context, Valuation Trajectory, and Deal Mechanics
        blocks:
          - type: paragraph
            body: >-
              Miro's capital history encompasses $476 million in cumulative equity funding across institutional rounds,
              culminating in its landmark $400 million Series C in January 2022 led by ICONIQ Growth, Accel, and
              Atlassian, with participation from Salesforce Ventures and Dragoneer at a post-money valuation of $17.5
              billion. That round priced Miro at an extreme forward multiple exceeding 25x-30x on estimated 2022
              revenues. On September 10, 2026, Italian digital holding company Bending Spoons entered into a definitive
              agreement to acquire Miro in an all-cash transaction valued at $1.355 billion enterprise value,
              representing roughly $1.4 billion headline transaction value and $1.79 billion in total equity value when
              adding Miro's $435 million in net cash balance. The transaction mechanics reveal crucial cap-table
              dynamics: the $1.79 billion equity value successfully clears the liquidation preference stack for
              preferred venture investors, ensuring full capital recovery for late-stage backers while leaving
              2021-and-later employee stock options entirely underwater. Demonstrating strategic alignment and
              confidence in the operating model, certain Miro shareholders agreed to roll $295 million of their deal
              proceeds into newly issued equity of public acquirer Bending Spoons.
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Comparable Multiples, Scenario Analysis, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              In private software market comparables, Miro's transaction mirrors the acquisition of collaboration peer
              Airtable by Bending Spoons, which was agreed at $1.285 billion enterprise value (approx. $2.25 billion
              equity value) against roughly $480 million in ARR (a 2.7x ARR multiple), down over 80% from its $11
              billion peak 2021 valuation. Across private and public peers, collaboration and productivity software
              multiples have sharply deflated from pandemic-era highs of 20x-50x ARR to mid-single-digit levels
              (2.0x-4.0x) for mature businesses growing under 15% annually. Our scenario analysis indicates that under a
              base case reflecting Bending Spoons' operational playbook—involving aggressive cost rationalization,
              restructuring, and stabilization of enterprise ARR—Miro generates durable free cash flow supporting an
              equity valuation of $1.79 billion to $2.20 billion (2.3x-2.8x ARR). A bull case where AI Workflows
              reaccelerate seat expansion across Fortune 500 accounts yields $2.50 billion (3.5x ARR), whereas a bear
              case marked by enterprise seat consolidation and customer attrition to bundled suites compresses valuation
              to $1.20 billion (1.8x ARR). Key diligence asks include verifying exact customer renewal cohort retention,
              post-acquisition engineering turnover, and the closing timeline before the September 2027 outside date.
            claimRefs:
              - CV002
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV011
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Great SaaS Valuation Unwinding
            body: >-
              Miro's valuation trajectory highlights the profound repricing of growth-stage collaboration software. In
              2022, zero-rate market conditions allowed growth investors to price Miro at $17.5 billion—a multiple
              exceeding 40x trailing revenue. By late 2026, an acquirer operating under disciplined cash-flow economics
              purchased the asset at 2.3x ARR ($1.355 billion EV), echoing Airtable's recent sale at 2.7x ARR. The
              business expanded revenues to $600 million and maintained profitability, demonstrating that multiple
              compression, rather than fundamental operational collapse, drove the 92% valuation reset.
            calloutType: insight
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
          - type: callout
            title: Cap Table Preferences and Employee Equity Exposure
            body: >-
              While the $1.79 billion equity value clears the $476 million cumulative preference stack held by Series A
              through Series C venture investors (including ICONIQ, Accel, and Atlassian), employee equity holders who
              joined during or after the 2022 Series C round face severe option impairment. Diligence on
              post-acquisition performance must focus on whether key product and engineering staff accept retention
              packages or depart under Bending Spoons' historical restructuring playbook.
            calloutType: risk
            claimRefs:
              - CV006
              - CV009
              - CV010
