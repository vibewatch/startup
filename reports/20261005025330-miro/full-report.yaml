chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Founding Roots, and Governance Structure
        blocks:
          - type: paragraph
            body: >-
              Miro operates as an enterprise visual collaboration and AI innovation workspace platform co-headquartered
              in Amsterdam, Netherlands, and San Francisco, California. The business was originally established in Perm,
              Russia, in 2011 under the corporate entity RealtimeBoard, Inc., by co-founders Andrey Khusid and Oleg
              Shardin. The platform was created out of Khusid's desire to communicate visual design concepts to remote
              agency clients without requiring co-located meetings. Rebranded as Miro in 2019, the company transitioned
              from a digital whiteboarding point solution into a multiplayer cross-functional workplace system
              connecting product management, engineering, UX design, marketing, and operational teams. Leadership is
              anchored by Chief Executive Officer Andrey Khusid alongside key executives including Chief Product and
              Technology Officer Jeff Chow, who leads technical platform evolution and AI integration. The company
              employs over 1,600 personnel distributed across 14 global office hubs, reflecting an international
              footprint built through bottom-up product-led growth.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: Capitalization History, Valuation Trajectory, and Strategic Acquisition
        blocks:
          - type: paragraph
            body: >-
              Miro's financing trajectory spans early bootstrapping to mega-round venture financing, culminating in
              strategic consolidation. The company raised $400 million in a Series C round in January 2022 co-led by
              ICONIQ Growth, Accel, and Atlassian, with participation from Salesforce Ventures, Dragoneer Investment
              Group, GIC, and individual software executives, bringing lifetime equity funding to $476 million. The
              Series C round established a peak private valuation of $17.5 billion, representing an aggressive trailing
              revenue multiple exceeding 40x on estimated 2022 top-line revenues of $420 million. Independent secondary
              benchmarks and private market comps tracked slowing top-line expansion, with Sacra estimating 2024 annual
              recurring revenue of $665 million (5.6% year-over-year growth from $630 million). On September 10, 2026,
              Italian digital app holding company Bending Spoons agreed to acquire Miro in an all-cash strategic
              takeover valued at $1.355 billion enterprise value (approximately $1.4 billion headline transaction value
              and $1.79 billion equity value net of cash). The acquisition implies a 2.3x multiple on approximately $600
              million in ARR, marking an 89% valuation compression from the 2022 peak.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO008
              - CO010
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO006
              - CO007
              - CO010
              - CO011
      - number: '1.3'
        title: Operating Scale, Product Evolution, and AI Innovation Workspace Expansion
        blocks:
          - type: paragraph
            body: >-
              Miro maintains immense enterprise reach, reporting more than 100 million total users across 250,000
              organizations, including enterprise customers such as Salesforce, Deloitte, Cisco, Nike, PepsiCo, and
              ASOS. Industry estimates indicate penetration across roughly 95% of Fortune 100 corporations,
              demonstrating high enterprise footprint across product discovery, agile sprint planning, and architecture
              diagramming. To combat whiteboarding commoditization and expanding competition from Figma, FigJam,
              Lucidchart, and Microsoft Whiteboard, Miro launched its AI Innovation Workspace and enterprise AI
              Workflows in January 2026, combining visual multi-step Flows, task-specific Sidekick agents, and deep
              enterprise knowledge integrations into Microsoft Copilot, Google Gemini Enterprise, Amazon Q, and Glean.
              In addition, Miro introduced its Model Context Protocol (MCP) server in February 2026, which surpassed 16
              million cumulative agent calls by September 2026 across 15 connected client environments led by Claude
              Desktop, Claude Code, and ChatGPT. Despite substantial operational scale and profitability, audited
              financial statements, net revenue retention rates, and module-level AI monetization remain undisclosed.
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Valuation Reset and Market Realignment
            body: >-
              The agreed $1.4B acquisition by Bending Spoons in September 2026 represents a dramatic 89% valuation
              compression from Miro's 2022 Series C benchmark of $17.5B. While Miro demonstrated remarkable user
              expansion to 100 million accounts and reached an estimated $600M-$665M in ARR, top-line growth moderated
              into the single digits amid intense suite-bundling from Microsoft Whiteboard and FigJam. The acquisition
              multiple of 2.3x ARR reflects mature SaaS private-market multiples rather than hypergrowth collaborative
              software pricing.
            calloutType: insight
            claimRefs:
              - CO007
              - CO008
              - CO010
              - CO011
          - type: callout
            title: Private Disclosures and Diligence Opacity
            body: >-
              Despite boasting 250,000 corporate customers and 95% Fortune 100 penetration, Miro has remained a private
              entity with undisclosed GAAP profitability, cash burn, and cohort retention. Diligence requires verifying
              the final terms of the Bending Spoons transaction, including the $295 million shareholder equity rollover,
              employee retention terms across its 1,600-person staff, and whether post-acquisition operations will
              maintain independent R&D investment in enterprise AI capabilities.
            calloutType: risk
            claimRefs:
              - CO005
              - CO011
              - CO013
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Category Segmentation, and Status-Quo Substitution
        blocks:
          - type: paragraph
            body: >-
              The visual collaboration market sits at the intersection of team collaboration software, digital
              diagramming, agile workflow management, and generative AI productivity tools. Miro originally established
              leadership within the browser-based interactive whiteboarding category, which industry benchmarks value at
              $4.82 billion in 2024 and project to reach $7.30 billion by 2030, expanding alongside a broader $31
              billion workflow automation market. Core included spend comprises dedicated SaaS per-user and enterprise
              enterprise-wide licenses for real-time multiplayer whiteboarding, sprint planning, systems architecture
              diagramming, and cross-functional brainstorming. Conversely, excluded spend includes asynchronous office
              documentation suites, core issue trackers like Jira, and specialized engineering computer-aided design or
              prototyping environments like core Figma. The primary adoption barrier is not specialized point
              competitors but status-quo inertia and free office suite bundling, notably Microsoft Whiteboard embedded
              within Microsoft 365 and Google Workspace integrations, which satisfy baseline brainstorming needs without
              incremental vendor procurement.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Evidence-Constrained SOM'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Miro's market opportunity requires triangulating multiple sizing lenses rather than relying on
              top-down vendor projections. Top-down industry estimates define the total addressable market (TAM) across
              global enterprise workflow automation ($31 billion by 2026) and visual interactive whiteboards ($4.82
              billion expanding to $7.30 billion by 2030 at moderate single-digit to low double-digit compound growth).
              However, Miro's realistic serviceable addressable market (SAM) is bounded by organizations actively paying
              for specialized visual collaboration platforms, as opposed to relying on bundled suite utilities or ad-hoc
              sketching tools. DNS and web telemetry data from TechnologyChecker.io tracks 17,400 active corporate
              domains deploying Miro, where mid-market and enterprise entities account for over 91% of identifiable
              installations. Miro's serviceable obtainable market (SOM) is reflected in its reported $600 million in
              ARR, demonstrating meaningful category leadership but also evidencing market saturation across core North
              American and European enterprise accounts that prompted single-digit growth rates.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Pathways
        blocks:
          - type: paragraph
            body: >-
              Miro's commercial penetration relies on a hybrid product-led growth (PLG) motion that transitions
              grassroots end-user adoption into centralized enterprise procurement. Individual designers, agile coaches,
              product managers, and software engineers typically adopt Miro's freemium tier without procurement
              intervention, utilizing an extensive library of over 6,000 templates and community-contributed Miroverse
              boards to map sprints and architectures. As team usage broadens, commercial budget ownership shifts to
              engineering leads, heads of product operations, or corporate IT and procurement executives who negotiate
              enterprise agreements for security, administrative controls, and single sign-on. Enterprise accounts
              represent over 90% of Miro's annual recurring revenue across more than 250,000 organizations, with over
              750 enterprise customers contributing more than $100,000 annually. However, enterprise adoption faces
              friction from 18-month average enterprise sales cycles and procurement scrutiny during macroeconomic
              belt-tightening.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Macro Growth Catalysts, Adoption Bottlenecks, and Enterprise Governance
        blocks:
          - type: paragraph
            body: >-
              Market demand is propelled by permanent hybrid workplace structures, cross-functional agile development
              cadences, and enterprise demand for AI-driven workflow acceleration. Miro's launch of collaborative AI
              Workflows and Sidekick agents directly addresses enterprise requirements to compress discovery cycles from
              weeks into days, supported by deep API integrations across 250+ tools including Slack, Atlassian Jira, and
              cloud data repositories. Nevertheless, significant adoption bottlenecks temper long-term expansion. Miro's
              premium pricing carries an estimated 35% premium over entry-level competitors, while economic headwinds
              have led an estimated 40% of enterprises to rationalize redundant collaboration software spend.
              Furthermore, stringent data residency, privacy regulations, and enterprise concerns over feeding
              proprietary corporate schematics into external AI models introduce compliance hurdles that delay
              full-scale enterprise rollout.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market Maturation and Sizing Ceiling
            body: >-
              While market sizing models frequently cite multi-billion dollar expansion for digital collaboration,
              Miro's operational metrics demonstrate that standalone visual collaboration encounters a structural
              ceiling. Reaching $600 million in ARR across 250,000 organizations represents dominant market share within
              specialized whiteboarding, but revenue growth deceleration to single digits indicates that converting
              broader enterprise knowledge workers beyond technical, design, and product roles requires competing
              directly against ubiquitous office productivity suites.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: callout
            title: Enterprise Procurement Headwinds and Suite Bundling
            body: >-
              Enterprise software consolidation poses an acute risk to standalone collaboration economics. With 40% of
              enterprises cutting software spend and Microsoft aggressively bundling Whiteboard within Microsoft 365,
              Miro's 35% pricing premium and 18-month sales cycles expose it to renewal pressure unless its
              collaborative AI Workflows deliver non-replicable business ROI.
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Enterprise Collaboration Landscape and Direct Peer Dynamics
        blocks:
          - type: paragraph
            body: >-
              Miro operates as the category benchmark in enterprise online whiteboards and digital collaboration spaces,
              supported by an extensive template ecosystem, infinite canvas architecture, and structured facilitation
              tooling. Within enterprise accounts, Miro functions as a collaborative innovation workspace spanning
              product management, user experience design, agile sprint ceremonies, and cross-functional planning.
              However, the competitive landscape has divided into distinct strategic tiers. Direct peers such as Mural
              compete for formal executive workshops and enterprise training sessions through structured facilitation
              and guided workflows, while Miro maintains broader sandbox flexibility. Simultaneously, design-adjacent
              software ecosystems, agile diagramming specialists, and AI-native visual canvases challenge Miro's
              account-level seat expansion.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP007
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP008
              - CP009
      - number: '3.2'
        title: Incumbent Bundling Pressure and Per-Seat Economic Trade-offs
        blocks:
          - type: paragraph
            body: >-
              The most pronounced commercial friction in Miro's expansion motion stems from platform bundling by
              entrenched design and productivity suites. Most notably, Figma bundles its FigJam collaborative whiteboard
              with paid Figma design seats at zero incremental license cost, creating immediate resistance when
              procurement teams evaluate dedicated whiteboard line items for product and design groups. Concurrently,
              enterprise software buyers encounter substantial license cost escalation at scale under Miro's traditional
              per-seat pricing tiers. Low-overhead diagramming alternatives like Whimsical and flat-rate accounts like
              Storyflow, which offers workspace access from $7.99 to $9.99 per month billed flat rather than per user
              seat, target cost-conscious cross-functional teams seeking visual synthesis without enterprise seat bloat.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: AI Workflows, Enterprise Scale, and Strategic Moat Durability
        blocks:
          - type: paragraph
            body: >-
              To defend its pricing power and transition beyond transient ideation whiteboards, Miro has introduced
              Collaborative AI Workflows, integrating specialized AI agents called Sidekicks, visual context processing,
              and automated canvas flows. Rather than treating artificial intelligence as a disconnected text prompt,
              Miro leverages existing visual artifacts such as journey maps, retrospectives, and architecture diagrams
              as contextual prompt grounding. Customer deployments at enterprise organizations such as EPAM and FREITAG
              demonstrate measurable operational cycle reductions, including up to 50% savings in project delivery and
              workshop evaluation timelines. Nevertheless, maintaining differentiation requires proving sustained
              workflow conversion against both entrenched suite incumbents and agile AI-native alternatives.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Ecosystem Bundling and Per-Seat Budget Scrutiny
            body: >-
              Miro's enterprise expansion faces growing procurement resistance as Figma bundles FigJam at zero
              incremental cost for paid users, while flat-rate AI challengers like Storyflow highlight the mounting
              overhead of per-seat licensing at scale.
            calloutType: risk
            claimRefs:
              - CP005
              - CP006
              - CP007
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Streams, and Contracting Structure
        blocks:
          - type: paragraph
            body: >-
              Miro operates primarily as a subscription-based enterprise collaboration and innovation workspace
              software-as-a-service (SaaS) business [CI001]. The platform monetizes through tiered subscription plans
              offering digital whiteboarding, diagramming, agile planning, visual workflows, and generative artificial
              intelligence capabilities [CI002, CI007]. Historically driven by a product-led growth (PLG) self-serve
              acquisition engine that leveraged viral collaboration loops and freemium workspaces to onboard end-users
              [CI008], Miro successfully shifted its commercial mix toward enterprise organizations: nearly 90% of its
              roughly $600 million annual recurring revenue (ARR) is generated by business and enterprise customer
              accounts [CI003, CI005]. Enterprise monetization relies on annual and multi-year contractual commitments,
              enterprise security controls, centralized administration, and dedicated customer success management
              [CI002, CI005, CI009]. However, realized seat pricing, contractual discounting schedules, and standalone
              monetization metrics for recent product additions—specifically its AI Workflows and specialized agents—are
              not broken out in public disclosures, presenting an underwriting gap regarding incremental software gross
              margins [CI007, CI014].
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI007
