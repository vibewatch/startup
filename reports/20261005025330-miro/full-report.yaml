      - number: '6.2'
        title: Adoption Trajectory, Enterprise Scale, and AI Evolution
        blocks:
          - type: paragraph
            body: >-
              The company's adoption trajectory expanded from a pre-pandemic digital whiteboarding base of 50 million
              users in April 2023 to more than 100 million users and 250,000 paying customer organizations by early
              2026. This user expansion was accompanied by revenue growth reaching approximately $600 million in annual
              recurring revenue, with nearly 90% derived from business and enterprise accounts. To deepen account
              engagement and expand beyond synchronous whiteboarding, Miro introduced AI-powered workflow orchestration,
              including Miro Assist and Collaborative AI Workflows built on cloud container infrastructure. Early
              enterprise adopters report significant cycle-time reductions, compressing multi-week workshop evaluations
              and discovery phases into days or hours. However, public disclosures do not report active daily or monthly
              user counts alongside total registered accounts, leaving the true proportion of recurring daily active
              collaborators unquantified.
            claimRefs:
              - CU001
