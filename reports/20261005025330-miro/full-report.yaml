figures:
  - id: FO001
    title: Miro Corporate Evolution and Milestone Timeline
    type: timeline
    summary: >-
      Chronological development of Miro from agency design tool to multi-billion valuation and subsequent private
      acquisition.
    data:
      items:
        - date: '2011'
          label: Founding as RealtimeBoard
          details: >-
            Founded in Perm, Russia by Andrey Khusid and Oleg Shardin as an online whiteboard tool for design agency
            client collaboration.
          tone: neutral
        - date: 2018-11
          label: Series A Financing
          details: Secured Series A funding led by Accel at a $140M post-money valuation to support US and European expansion.
          tone: positive
        - date: '2019'
          label: Rebranding to Miro
          details: >-
            Rebranded from RealtimeBoard to Miro and established dual global headquarters in Amsterdam and San
            Francisco.
          tone: positive
        - date: 2020-04
          label: Series B Growth Round
          details: >-
            Raised $50M Series B financing led by ICONIQ Growth as remote work accelerated enterprise visual
            collaboration demand.
          tone: positive
        - date: 2022-01
          label: Series C Mega-Round at $17.5B Valuation
          details: >-
            Raised $400M in Series C financing co-led by ICONIQ, Accel, and Atlassian, reaching a peak $17.5B enterprise
            valuation.
          tone: positive
        - date: 2024-10
          label: Innovation Workspace Launch
          details: >-
            Unveiled Miro Innovation Workspace repositioning the product from a whiteboarding canvas to an enterprise
            innovation platform.
          tone: positive
        - date: 2026-01
          label: Enterprise AI Workflows & 100M Users
          details: >-
            Launched AI Workflows with Flows and Sidekicks while reporting 100M+ registered users across 250,000
            customer organizations.
          tone: positive
        - date: 2026-09
          label: Bending Spoons Acquisition Agreement
          details: >-
            Agreed to an all-cash acquisition by Bending Spoons at a $1.355B EV ($1.4B headline), resetting private
            equity value.
          tone: negative
    approximationNotes: Dates and valuation milestones represent announced transaction dates and primary product release announcements.
