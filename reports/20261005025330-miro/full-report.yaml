      - number: '6.3'
        title: Named Customer Deployments and Workflow Proof
        blocks:
          - type: paragraph
            body: >-
              Enterprise reference deployments demonstrate tangible productivity gains when Miro is embedded into
              repeatable operating models. Global technology consultancy Endava deployed Miro enterprise-wide across its
              workforce of nearly 12,000 employees as the core collaboration layer for its proprietary AI-native
              delivery framework, compressing artifact generation and workshop alignment from weeks to days. In
              commercial operations, lifestyle brand FREITAG and systems partner Smart System Guild achieved an 80%
              acceleration in data analysis speed during an enterprise software replacement project while establishing
              living project documentation. Similarly, global digital consultancy EPAM embedded Miro's AI Sidekicks into
              rapid client discovery engagements, accelerating proof-of-concept validation cycles. Complementing
              external client workflows, internal go-to-market teams at Miro integrated automated data pipeline tools to
              eliminate operational bottlenecks across high-velocity sales pipelines.
            claimRefs:
              - CU004
              - CU007
