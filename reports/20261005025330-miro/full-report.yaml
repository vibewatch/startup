              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Discretionary Collaboration Vulnerability
            body: >-
              Miro's dual challenge in late-stage growth stems from category positioning: while deeply loved by product
              and design practitioners, visual collaboration boards sit closer to discretionary operating expense than
              core infrastructure systems of record. When macroeconomic pressure forces corporate vendor consolidation,
              tools lacking deep programmatic technical lock-in face severe license reduction and budget pruning.
            calloutType: insight
            claimRefs:
              - CU014
              - CU016
          - type: callout
            title: Enterprise Valuation Reset and Unit Economics
            body: >-
              The stark contrast between Miro's January 2022 $17.5 billion peak valuation and its September 2026 $1.355
              billion acquisition agreement by Bending Spoons highlights the market's aggressive repricing of
              collaboration SaaS. Acquirers now price mature recurring revenue at modest cash-flow multiples (roughly
              2.3x ARR) when net retention and durable pricing leverage remain unproven under rigorous enterprise
              procurement reviews.
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: M&A Execution, Workforce Disruption, and Capital Structure Downside
        blocks:
          - type: paragraph
            body: >-
              The primary operational and financial risk confronting Miro in late 2026 stems from its definitive
              agreement to be acquired by Milan-based digital roll-up platform Bending Spoons for an enterprise value of
              $1.355 billion. This transaction represents a steep 92% valuation contraction from Miro's peak January
              2022 Series C post-money mark of $17.5 billion, despite underlying annual recurring revenue expanding to
              roughly $600 million across more than 250,000 organizational deployments. Although the acquisition
              structure clears the liquidation preference stack across its $476 million in historical venture capital
              raised, common equity holders and employees who joined after 2021 face substantially impaired option
              value. Furthermore, public regulatory filings disclose key employee retention as a material transaction
              risk, compounded by historical post-acquisition operating playbooks at Bending Spoons that feature
              engineering restructuring and deep staff reductions reaching up to 70% of headcount across prior portfolio
              assets. With a long-stop closing window extending through September 10, 2027, the protracted merger
              clearance interval threatens customer-facing delivery, core product engineering momentum, and key account
              stability.
