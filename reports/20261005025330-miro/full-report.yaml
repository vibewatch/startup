      - number: '5.3'
        title: Technical Diagramming, Cloud Integrations, and Competitive Limits
        blocks:
          - type: paragraph
            body: >-
              To support technical documentation and cloud infrastructure design, Miro provides native technical
              diagramming capabilities, including official AWS shape libraries and direct bidirectional integrations
              with cloud platforms [CE008]. Through its AWS Well-Architected Tool integration and AWS Cost Calculator
              application, cloud engineering teams can import architecture remediation tasks directly onto visual
              boards, estimate component costs, and track infrastructure remediation alongside visual topologies
              [CE008]. However, independent evaluations identify clear architectural limitations when Miro is evaluated
              as a dedicated software architecture modeling tool [CE009]. In contrast to code-first architecture
              frameworks that maintain reusable data schemas, YAML definitions, Git versioning, and CI/CD
              synchronization, Miro remains fundamentally canvas-first; diagrams do not inherently bind to a centralized
              underlying software model and are susceptible to visual drift as software evolves [CE009].
            claimRefs:
              - CE008
