        title: 展示项
        blocks:
          - type: callout
            title: 生态捆绑与按席位预算审查
            body: Figma 为付费用户提供零增量成本的 FigJam，统一费率的 AI 挑战者 Storyflow 则凸显了大规模按席位许可不断上升的开销；在此背景下，Miro 的企业扩张正面临越来越强的采购阻力。
