      - number: '7.2'
        title: 企业总拥有成本、工作流治理与用户摩擦
        blocks:
          - type: paragraph
            body: >-
              除公司所有权变更外，Miro 在企业客户账户中还面临独特的运营和采购障碍。协作式工作管理买方的采购评估强调，首年总拥有成本会迅速超过入门席位价格，原因包括管理角色治理、复杂的集成开销和日益增加的 AI
              额度消耗。一个突出的运营脆弱点来自许可分配机制：把被动看板浏览者或外部协作者误判为付费许可成员，经常会在年度续约时触发意外账单冲击和采购摩擦。此外，虽然 Miro 积极与 Jira
              等企业跟踪器集成，但用户情绪显示，当可视化画布重复结构化工单系统时会产生工作流摩擦；如果团队把看板当成非必要的忙碌劳动，采用疲劳风险就会上升。Miro 快速扩张的社区模板和多步骤 AI Workflows
              还带来模板泛滥、无人维护看板以及长期企业画布性能下降等次生运营风险。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
