      - number: '6.4'
        title: 留存动态、采购审查与战略持久性
        blocks:
          - type: paragraph
            body: >-
              尽管客户采用广泛，随着企业技术预算重新审视横向协作软件，Miro 正面临越来越严格的采购审查和留存逆风。按账户看，客户集中风险较低：分散的安装基础中有 750 多个账户的年度经常性收入超过 $100,000；
              但品类层面的脆弱性很高。与核心数据库、身份供应商或财务总账等关键记录系统不同，可视化白板更接近可自由裁量支出，很容易被 Microsoft 365 等供应商套件整合。为解决席位变现摩擦，Miro
