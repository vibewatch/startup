      - number: '5.2'
        title: 平台架构、可扩展性与 AI 编排
        blocks:
          - type: paragraph
            body: >-
              Miro 的核心技术基础是高并发无限画布渲染引擎，目标是在分布式全球团队之间保持低延迟同步 [CE005]。该引擎能处理数百名参与者同时协作、每块画布包含数千个可视化元素的大型会话，同时避免性能下降或状态不同步
              [CE005]。除基础白板机制外，Miro 还搭建了多步骤协作式 AI 工作流，包括 Flows、名为 Sidekicks 的专业对话代理，以及把画布内容作为结构化提示上下文的可视化上下文处理
              [CE006]。架构通过接入 OpenAI、Anthropic 和 Google 等领先基础模型供应商，提供多模型灵活性；同时连接 Microsoft Copilot、Glean 和 Gemini
              Enterprise 等企业知识图谱，让生成式任务以公司数据为依据 [CE006]。Miro 暴露模型上下文协议和定制 API 接口，可自动生成架构文档并捕捉决策记录 [CE007]。
            claimRefs:
