  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Miro 的核心投资论点建立在其深厚的企业覆盖、强劲规模和盈利能力上；如今公司可按约 2.3 倍 ARR 的压缩估值倍数获得。Miro 生成约 $600M ARR，其中接近 90% 来自商业和企业账户；它服务超过
              25 万家组织，包括 750 多家每年贡献超过 $100,000 的企业客户。公司持有 $435M 净现金且实现盈利，能够缓冲资本耗尽和短期再融资压力。此外，Miro 已从通用数字白板扩展为 AI
              Innovation Workspace，并推出协作式 AI Workflows，接入 Microsoft Teams、Jira 和 Slack
              等企业生态。反论点则强调营收增速严重放缓、来自捆绑式办公套件（尤其是 Microsoft Whiteboard、Google Workspace 和 Figma/FigJam）的激烈竞争，以及估值骤降导致
              2021 年后入职员工的普通股价值归零。相对 $17.5B C 轮峰值估值压缩 92%，说明 Miro 在 2022 年曾被按不可或缺的企业平台定价，但后来成熟为一家增长更慢、处于中等倍数区间的软件工具。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
