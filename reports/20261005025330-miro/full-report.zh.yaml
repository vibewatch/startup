chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创立根基与治理结构
        blocks:
          - type: paragraph
            body: >-
              Miro 是一家企业级可视化协作与 AI 创新工作空间平台，总部位于荷兰阿姆斯特丹和美国旧金山。公司最初由联合创始人 Andrey Khusid 和 Oleg Shardin 于 2011 年在俄罗斯彼尔姆以
              RealtimeBoard, Inc. 的名义创办。Khusid 希望在无需同地开会的情况下，把视觉设计概念传达给远程代理客户，于是打造了这一平台。公司于 2019 年更名为
              Miro，并从数字白板单点工具转型为连接产品管理、工程、UX 设计、市场和运营团队的多人跨职能工作场所。公司由 CEO Andrey Khusid 领导，核心高管还包括负责技术平台演进和 AI
              集成的产品与技术负责人 Jeff Chow。公司在全球 14 个办公地点分布着 1,600 多名员工，体现出公司靠自下而上的产品驱动增长搭建的国际化布局。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO004
      - number: '1.2'
        title: 资本化历史、估值轨迹与战略收购
        blocks:
          - type: paragraph
            body: >-
              Miro 的融资历程从早期自筹资金一路走到大型风险投资轮，最终进入战略整合阶段。公司于 2022 年 1 月完成 $400M 的 C 轮融资，由 ICONIQ Growth、Accel 和 Atlassian
              联合领投，Salesforce Ventures、Dragoneer Investment Group、GIC 及多位软件行业高管跟投，使累计股权融资达到 $476M。C 轮融资将公司私募估值推至峰值
              $17.5B；按估算的 2022 年 $420M 营收计算，追踪营收倍数超过 40 倍。独立二级市场基准和私募市场可比公司显示营收增速放缓；Sacra 估算 Miro 2024 年 ARR 为 $665M，较
              $630M 同比增长 5.6%。2026 年 9 月 10 日，意大利数字应用控股公司 Bending Spoons 同意以 $1.355B 企业价值、约 $1.4B 的交易 headline value
              及扣除现金后 $1.79B 的股权价值，全现金收购 Miro。该交易按约 $600M ARR 计算的倍数为 2.3 倍，较 2022 年峰值估值压缩 89%。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
