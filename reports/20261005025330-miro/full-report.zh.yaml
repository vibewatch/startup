      - number: '4.2'
        title: 上市路径、销售效率代理指标与成本结构
        blocks:
          - type: paragraph
            body: >-
              Miro 的商业打法把自下而上的病毒式产品采用与纪律严明的企业销售团队结合起来 [CI008, CI009]。在初期增长阶段，自助式病毒传播机制推动跨职能团队广泛采用，使综合获客成本保持在相对较低水平
              [CI008]。当业务从超过 $400M ARR 继续扩大至 $600M 时，上市结构越来越需要正式的企业销售资格审查、多利益相关方交易推进，以及围绕 Jira、Confluence、Slack 和 Zoom
              等主要生产力技术栈的技术集成评估 [CI001, CI009]。交付和基础设施环节的销售成本来自云托管、实时多人画布同步、数据存储，以及在包括 Google 在内的基础模型合作伙伴处调用外部人工智能模型推理
              [CI007]。第三方财务分析称，Miro 自约 2020 年起持续盈利，单位经济性有纪律 [CI005]；但经审计的毛利率、销售与市场营销回收期、净收入留存率和毛收入流失率仍是严格未披露的私有数据
              [CI010, CI014, CI015]。
