  - id: FE001
    title: Miro 产品架构与技术栈
    type: stack
    summary: 分层呈现 Miro 的技术架构，覆盖演示画布、AI 编排、集成和企业基础设施。
    data:
      layers:
        - label: 视觉演示层
          detail: 无限交互式白板画布，支持多人便签、思维导图、表格、文档和交互式演示模式。
        - label: 协作工作流与原型层
          detail: 结构化看板、交互式线框图、原型验证和引导式工作坊工具，帮助跨职能团队对齐。
        - label: 智能体与工作流层
          detail: 多步骤 Flows、对话式 Sidekick 智能体和视觉上下文处理，由多模型 LLM 推理路由提供支持。
        - label: 企业知识与扩展层
          detail: Model Context Protocol（MCP）服务器、企业知识搜索连接器（Copilot、Glean、Gemini）及 API 集成。
        - label: 云与 DevOps 集成层
          detail: AWS 架构形状包、Well-Architected Tool 修复任务导入及云基础设施成本估算计算器。
        - label: 企业安全与治理层
          detail: 单点登录（SSO）、自动 SCIM 用户配置、Datadog 审计日志、静态 / 传输加密，以及 SOC 2 / ISO 27001 合规。
    approximationNotes: 架构分层根据官方技术架构手册和开发者平台规格进行概括。
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: Miro 企业客户旅程图与扩张循环
    type: journey-map
    summary: 展示从自助式自然激活，到企业合规整合和 AI 工作流扩张的端到端过程。
    data:
      items:
        - label: 1. 自然团队发现
          description: 设计师、产品经理或敏捷负责人注册免费画板，开展临时工作坊和头脑风暴。
          touchpoints:
            - 通过 Google/SSO 自助注册
            - 选择预制模板库
            - 通过 Slack/邮件发送同事邀请链接
        - label: 2. 部门扩散与落地
          description: 多个小组采用付费 Starter 或 Business 席位，以突破画板限制并持续维护冲刺画板。
          touchpoints:
            - 团队信用卡采购
            - Jira 和 Confluence 集成
            - 定期回顾冲刺画布
        - label: 3. 企业整合
          description: IT 和采购部门发现未受管理的影子 IT 实例；Miro 销售将分散账户转化为集中式企业许可协议。
          touchpoints:
            - 单点登录（SSO）和 SCIM 配置
            - 企业安全与数据治理审查
            - 批量席位定价谈判
        - label: 4. 跨职能扩张
          description: 平台采用从研发扩展到高管战略、市场营销、人力资源和业务运营。
          touchpoints:
            - 季度业务回顾规划
            - 高管战略异地会议制图
            - 跨部门项目仪表盘
        - label: 5. AI 转型与扩张
          description: 使用 Miro Assist、Sidekicks 和协作式 AI Workflows，压缩端到端交付周期。
          touchpoints:
            - 自定义工作流智能体集成
            - 企业知识接地（Copilot/Glean）
            - 以结果为导向的流程加速
        - label: 6. 续约与供应商防守
          description: 面对捆绑式办公生产力套件和闲置席位的 ROI 审查，进行年度采购防守。
          touchpoints:
            - 许可证使用率和活跃度审计
            - 对照 M365 审查供应商整合
            - 谈判多年期合同续约
    approximationNotes: 各阶段综合了 Miro 高管访谈、定价案例研究和企业客户披露中记录的典型企业软件采用模式。
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU008
      - CU012
      - CU014
