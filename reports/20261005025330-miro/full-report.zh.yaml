        title: 企业治理、安全控制与监控
        blocks:
          - type: paragraph
            body: >-
              面向企业部署，Miro 实施大型跨国组织所需的制度化安全、访问治理和合规基础设施 [CE010]。管理控制包括单点登录（SSO）认证、通过 SCIM
              协议自动配置身份，以及管理看板编辑和共享的细粒度基于角色的访问权限 [CE010]。底层数据基础设施对所有协作资产在静态和传输过程中均加密，并获得 SOC 2 Type II、ISO 27001、GDPR 和
              HIPAA 等合规认证 [CE010]。为满足企业运营合规和 IT 可审计性，Miro 通过专用监控插件接入 Datadog 等第三方可观测平台，提供自动健康检查、审计日志采集和企业安全运营中心的状态验证
              [CE011]。商业套餐从受额度限制的入门级方案，到带治理增值组件的 Business 和 Enterprise 方案不等 [CE012]。
