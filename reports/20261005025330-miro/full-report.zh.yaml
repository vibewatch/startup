  - id: FV001
    title: 建议逻辑与估值立场决策链
    type: flow
    summary: 从运营规模和竞争压力，经估值重置，推导至“跟踪”建议的逻辑链。
    data:
      nodes:
        - id: scale
          label: 运营规模与盈利能力
          description: 拥有 250,000 家企业客户，ARR 为 $600M，净现金余额为 $435M
        - id: headwinds
          label: 市场逆风与放缓
          description: 疫情后的 SaaS 理性化，以及 Microsoft 和 Figma 激烈的套件捆绑竞争
        - id: valuation-reset
          label: 估值重置超过 90%
          description: 与 Bending Spoons 达成收购协议，企业价值 $1.355B（ARR 倍数 2.3 倍，相比 2022 年 $17.5B 峰值）
        - id: liquidation-stack
          label: 优先股堆叠吸收
          description: $1.79B 股权价值足以覆盖 $476M 优先股堆叠；2021 年后普通股期权处于水下
        - id: stance
          label: 合理估值立场
          description: 2.3 倍 ARR 对成熟软件资产而言属于合理、由现金流支撑的价格
        - id: recommendation
          label: 建议：跟踪收购方
          description: 跟踪 Bending Spoons 收购后的执行情况及滚存表现
      edges:
        - from: scale
          to: headwinds
        - from: headwinds
          to: valuation-reset
        - from: valuation-reset
          to: liquidation-stack
        - from: liquidation-stack
          to: stance
        - from: stance
          to: recommendation
    approximationNotes: 流程图展示综合已核实财务数据和交易结构后形成的定性决策路径。
    claimRefs:
      - CV001
      - CV004
      - CV007
      - CV009
      - CV010
      - CV011
