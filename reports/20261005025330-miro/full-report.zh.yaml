      - number: '8.2'
        title: 融资背景、估值轨迹与交易机制
        blocks:
          - type: paragraph
            body: >-
              Miro 的资本历史包括机构轮次累计 $476M 股权融资，最终在 2022 年 1 月完成标志性的 $400M C 轮，由 ICONIQ Growth、Accel 和 Atlassian
              领投，Salesforce Ventures 和 Dragoneer 跟投，投后估值为 $17.5B。该轮按估算的 2022 年营收给 Miro 定出的远期倍数超过 25–30 倍。2026 年 9 月 10
              日，意大利数字控股公司 Bending Spoons 达成最终协议，以企业价值 $1.355B、全现金方式收购 Miro；计入 Miro $435M 净现金余额后，headline transaction
              value 约为 $1.4B，总股权价值为 $1.79B。交易机制揭示了关键的股权结构表动态：$1.79B 股权价值成功覆盖优先风险投资者的优先股堆叠，确保后期投资者收回全部资本，却让 2021
              年及以后授予的员工股票期权完全跌破水面。为体现战略一致性和对运营模式的信心，部分 Miro 股东同意把交易所得中的 $295M 滚存为上市收购方 Bending Spoons 新发行的股权。
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
