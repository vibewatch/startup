        - 资本结构受损与人才留任
        - C 轮优先股堆叠吸收股权收益；2021 年后员工期权仍处于水下。
        - 核心工程管理层留任，并在新所有权下实现成功的股权激励对齐。
    notes: 对比评估 Miro 平台产生现金的能力与结构性市场逆风。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV009
  - id: TV003
    title: 情景估值与回报分析表
    columns:
      - 情景
      - 隐含估值
      - ARR 倍数
      - 核心运营假设
      - 下行 / 上行触发因素
    rows:
      - - 乐观情景
        - $2.50B 股权价值（$2.10B 企业价值）
        - 3.5x ARR
        - AI Workflows 将增长重新加速至 15%+；750+ 个头部账户扩大企业席位。
        - 成功实现 AI Sidekicks 变现；向 Bending Spoons 生态强力交叉销售。
      - - 基准情景
        - $1.79B 股权价值（$1.355B 企业价值）
        - 2.3x ARR
        - 增长稳定在 5-8%；严格削减成本，使运营 EBITDA 利润率达到 25%+。
        - 当前与 Bending Spoons 达成的确定性交易价格；2026 年第四季度完成交割。
      - - 悲观情景
        - $1.20B 股权价值（$0.95B 企业价值）
        - 1.6x - 1.8x ARR 倍数
        - 供应商整合推动企业客户转向 Microsoft Whiteboard；激进裁员损害 UX。
        - 大客户取消合同；监管审查延长，导致交易交割推迟至 2027 年之后。
    notes: 情景分析以公开报道的 $600M ARR 基准、$435M 净现金头寸及已核实的可比交易倍数为锚。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV011
      - CV013
figures:
  - id: FO001
    title: Miro 公司演进与里程碑时间线
    type: timeline
    summary: 按时间梳理 Miro 从代理设计工具发展为数十亿美元估值企业、随后被私募收购的历程。
    data:
      items:
        - date: '2011'
          label: 以 RealtimeBoard 创立
          details: Andrey Khusid 和 Oleg Shardin 在俄罗斯彼尔姆创立该公司，提供在线白板工具，帮助设计代理与客户协作。
          tone: neutral
        - date: 2018-11
          label: A 轮融资
          details: Accel 领投 A 轮，以 $140M 投后估值完成融资，用于支持美国和欧洲扩张。
          tone: positive
        - date: '2019'
          label: 更名为 Miro
          details: 从 RealtimeBoard 更名为 Miro，并在阿姆斯特丹和旧金山设立双全球总部。
          tone: positive
        - date: 2020-04
          label: B 轮增长融资
          details: 由 ICONIQ Growth 领投，完成 $50M B 轮融资；远程办公加速了企业对视觉协作的需求。
          tone: positive
        - date: 2022-01
          label: $17.5B 估值的 C 轮超大额融资
          details: 由 ICONIQ、Accel 和 Atlassian 共同领投，完成 $400M C 轮融资，企业估值达到峰值 $17.5B。
          tone: positive
        - date: 2024-10
          label: 创新工作区上线
          details: 推出 Miro Innovation Workspace，将产品从白板画布重新定位为企业创新平台。
          tone: positive
        - date: 2026-01
          label: 企业 AI Workflows 与 100M 用户
          details: 推出包含 Flows 和 Sidekicks 的 AI Workflows，并披露已覆盖 250,000 家客户组织、100M+ 注册用户。
          tone: positive
        - date: 2026-09
          label: Bending Spoons 收购协议
          details: 同意由 Bending Spoons 以 $1.355B 企业价值（标题金额 $1.4B）进行全现金收购，重置私募股权价值。
          tone: negative
    approximationNotes: 日期和估值里程碑以公布的交易日期及主要产品发布公告为准。
    claimRefs:
      - CO002
      - CO006
      - CO007
      - CO010
      - CO011
      - CO012
      - CO014
