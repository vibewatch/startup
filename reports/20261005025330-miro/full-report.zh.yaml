  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现渠道与合同结构
        blocks:
          - type: paragraph
            body: >-
              Miro 主要是一家订阅制企业协作与创新工作空间 SaaS 公司 [CI001]。平台通过分层订阅方案变现，提供数字白板、制图、敏捷规划、可视化工作流和生成式人工智能能力 [CI002,
              CI007]。早期，公司依靠产品驱动增长（PLG）的自助获客引擎，通过病毒式协作循环和免费增值工作空间吸引终端用户 [CI008]；随着发展，商业结构成功转向企业组织：约 $600M ARR 中接近 90%
              来自商业和企业客户账户 [CI003, CI005]。企业变现依靠年度及多年期合同承诺、企业安全控制、集中管理和专属客户成功管理 [CI002, CI005,
              CI009]。不过，公开披露没有拆分实际席位价格、合同折扣安排，以及近期新增产品（尤其是 AI Workflows 和专业代理）的独立变现指标，因此软件增量毛利仍存在投资判断缺口 [CI007, CI014]。
