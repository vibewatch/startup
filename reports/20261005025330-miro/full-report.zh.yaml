      - number: '8.3'
        title: 可比倍数、情景分析与尽调要求
        blocks:
          - type: paragraph
            body: >-
              在私有软件市场可比交易中，Miro 的交易与协作软件同行 Airtable 被 Bending Spoons 收购的案例相似：该交易约定企业价值为 $1.285 billion（股权价值约 $2.25
              billion），对应约 $480 million ARR（ARR 倍数为 2.7x），较其 2021 年 $11 billion 的估值峰值下跌超过
              80%。横向比较私有和上市同行，协作与生产力软件的估值倍数已从疫情时期 20x-50x ARR 的高位大幅回落；对于年增长率低于 15% 的成熟企业，目前中个位数水平约为
              2.0x-4.0x。我们的情景分析显示，在反映 Bending Spoons 运营打法的基准情景下——大力压缩成本、重组并稳定企业 ARR——Miro 可产生持久自由现金流，支撑 $1.79 billion 至
              $2.20 billion 的股权价值（2.3x-2.8x ARR）。若 AI Workflows 让《财富》500 强客户的席位扩张重新加速，乐观情景下估值可达 $2.50 billion（3.5x
              ARR）；悲观情景则因企业席位整合、客户流失至捆绑式套件，估值压缩至 $1.20 billion（1.8x ARR）。重点尽调事项包括核实客户续约队列的确切留存率、收购后的工程团队流失，以及 2027 年 9
              月最终截止日前的交割时间表。
            claimRefs:
              - CV002
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
