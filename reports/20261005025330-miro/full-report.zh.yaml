      - number: '7.3'
        title: 监管合规、AI 治理保障与第三方混淆
        blocks:
          - type: paragraph
            body: >-
              在法律、隐私和合规问题上，Miro 建立了广泛的企业合规体系，旨在降低 GDPR 和 CCPA 等全球数据框架下的监管风险。Miro Trust Center 记录了 ISO/IEC 42001
              对人工智能管理系统的外部验证，以及年度 ISO 和 NIST 风险评估、不可篡改的 AI 活动审计日志和严格的数据处理限制；后者不允许把客户企业数据用于基础模型训练。Miro Legal
              在各公司子公司执行全面的全球行为准则，覆盖反歧视、自愿劳动、利益冲突，以及不遵守即可能被解雇的强制员工认证。此外，共享“Miro”品牌名的不同法律实体也会造成外部商业混淆，例如西非林业运营商 Miro
              Forestry Developments Limited；因此，公司尽调团队必须严格区分软件资产和无关的国际工业运营商。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 估值重置与人力资本流失风险
            body: >-
              估值压缩 92% 至 $1.355B EV 足以覆盖高级清算优先权，却让 2021 年后员工的股票期权严重跌破水面。Bending Spoons 的历史重组方式经常削减最多 70%
              的员工；在交易完成前，未归属人才的留任是 Miro 最大的运营脆弱点。
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
          - type: callout
            title: 协作式工作管理中的采购摩擦
            body: 虽然入门级价格为每位成员每月 $8–$20，但当非活跃浏览者意外转化为付费席位时，企业买方会遭遇不断累积的摩擦。明确的角色治理和合同中约定的续约席位下调机制，是避免试点结束后账单冲击的关键。
            calloutType: insight
            claimRefs:
              - CR007
