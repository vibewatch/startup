              - CV013
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: SaaS 估值大回撤
            body: >-
              Miro 的估值轨迹凸显了成长期协作软件经历的深度重估。2022 年，零利率市场环境让成长型投资者将 Miro 定价至 $17.5 billion——对应超过 40x 的历史收入倍数。到 2026
              年底，一家遵循严格现金流经济学的收购方以 2.3x ARR（$1.355 billion EV）买下该资产，呼应 Airtable 最近以 2.7x ARR 出售的交易。公司收入增长至 $600 million
              且保持盈利，说明这次 92% 的估值重置主要由倍数压缩驱动，而非基本运营崩溃。
            calloutType: insight
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV011
          - type: callout
            title: 股权结构表与员工股权敞口
            body: >-
              $1.79 billion 的股权价值足以覆盖 Series A 至 Series C 风投投资者持有的 $476 million 优先股堆叠（包括 ICONIQ、Accel 和 Atlassian），但在
              2022 年 Series C 轮期间或之后加入的员工股权持有人将面临严重的期权减值。对收购后表现的尽调，必须聚焦产品和工程团队的关键成员是否接受留任方案，还是会按照 Bending Spoons
              历来的重组打法离开。
            calloutType: risk
            claimRefs:
