        blocks:
          - type: paragraph
            body: >-
              为支持技术文档和云基础设施设计，Miro 提供原生技术制图能力，包括官方 AWS 形状库，以及与云平台的直接双向集成 [CE008]。通过 AWS Well-Architected Tool 集成和 AWS
              Cost Calculator 应用，云工程团队可以把架构整改任务直接导入可视化看板，估算组件成本，并在可视化拓扑旁跟踪基础设施整改 [CE008]。不过，独立评估认为，若把 Miro
              当作专用软件架构建模工具，其架构局限很明显 [CE009]。与保有可复用数据模式、YAML 定义、Git 版本管理及 CI/CD 同步的代码优先架构框架不同，Miro
              本质上仍以画布为先；图表不会天然绑定到底层集中式软件模型，软件演进后也容易出现可视化漂移 [CE009]。
