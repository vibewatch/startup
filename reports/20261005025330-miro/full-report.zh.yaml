  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分与买方动态
        blocks:
          - type: paragraph
            body: >-
              Miro 的商业模式由双引擎驱动，覆盖产品驱动的自助式采用和自上而下的企业扩张，全球客户组织超过 25 万家、用户总数超过 1
              亿。客户基础分成两类：高量自助式团队，主要由产品经理、设计师、敏捷教练和工程团队组成；以及由采购、IT 和安全团队管理席位配置的集中式企业买方组织。企业需求集中在《财富》100
              强中的科技、金融服务、咨询和零售组织，它们需要企业级管理控制、单点登录和合规架构。自助式采用可以让部门快速进入且无需销售介入，但大客户变现依赖把分散的团队许可转化为标准化企业协议。在成熟的企业部署中，跨职能创新计划会推动使用场景超出单纯的产品开发，进入业务转型、战略规划和运营工作流。
