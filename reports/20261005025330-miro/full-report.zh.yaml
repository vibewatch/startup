            title: 企业估值重置与单位经济
            body: >-
              Miro 2022 年 1 月 $17.5B 的峰值估值，与 2026 年 9 月 Bending Spoons $1.355B 的收购协议形成鲜明对比，凸显协作 SaaS
              被市场激进重定价。当净留存和可持续定价能力在严格的企业采购审查下未经证明时，收购方会按适度的现金流倍数（约 2.3 倍 ARR）为成熟经常性收入定价。
            calloutType: risk
            claimRefs:
              - CU011
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 并购执行、员工扰动与资本结构下行风险
        blocks:
          - type: paragraph
            body: >-
              2026 年末 Miro 面临的首要运营和财务风险，来自其与总部位于米兰的数字化并购平台 Bending Spoons 达成的最终收购协议，企业价值为 $1.355B。尽管底层 ARR 已扩大至约
              $600M、覆盖超过 25 万个组织部署，该交易仍意味着相对 Miro 2022 年 1 月 C 轮 $17.5B 投后估值下跌 92%。收购结构足以覆盖历史募得 $476M
              风险资本对应的优先股堆叠，但普通股股东和 2021 年后加入的员工将面临大幅缩水的期权价值。此外，公开监管文件把关键员工留任列为重大交易风险；Bending Spoons
              历史上的收购后运营方式还包括工程重组，以及在此前资产组合中最多削减 70% 员工的深度裁员。交易交割的 long-stop 窗口延至 2027 年 9 月 10
              日，漫长的合并审批期可能威胁面向客户的交付、核心产品工程进度和关键账户稳定性。
