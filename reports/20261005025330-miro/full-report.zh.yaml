  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与协作工作流能力
        blocks:
          - type: paragraph
            body: >-
              Miro 将其软件定位为 AI Innovation Workspace，旨在连接跨职能企业团队的创意、规划和运营执行
              [CE001]。平台不只是空白数字白板，而是把便签、流程图和思维导图等非结构化协作工具，与看板、交互式表格、文档界面和实时演示幻灯片等结构化产物结合起来
              [CE002]。其核心设计重点是减少产品管理、工程、设计和运营组织之间的信息碎片，把发现与交付工作流集中到共享的无限可视化环境中
              [CE003]。协作模式支持实时多人编辑、上下文评论和引导式工作会议，也延伸到实时交互原型及结构化工作坊，帮助利益相关方在工程交接前达成一致 [CE004]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
