      - number: '3.2'
        title: 在位者捆绑压力与按席位经济权衡
        blocks:
          - type: paragraph
            body: >-
              Miro 扩张中最明显的商业阻力来自成熟设计与生产力套件的平台捆绑。最典型的是，Figma 把 FigJam 协作白板与付费 Figma
              设计席位捆绑，且不额外收取许可费用；采购团队为产品和设计部门评估独立白板预算项时，马上会遇到阻力。与此同时，企业软件买方在 Miro 传统按席位定价下扩张时，会面临显著的许可成本上升。Whimsical
              等低开销制图替代产品，以及 Storyflow 等统一费率账户，瞄准的是希望以可控成本完成可视化综合、又不想承担企业席位膨胀的跨职能团队；Storyflow 按工作空间每月 $7.99–$9.99
              的固定费用收费，而不是按用户席位计费。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: AI Workflows、企业规模与战略护城河持久性
        blocks:
          - type: paragraph
            body: >-
              为守住定价权并超越短暂的创意白板使用，Miro 推出了 Collaborative AI Workflows，把名为 Sidekicks 的专业 AI 代理、可视化上下文处理和自动化画布流程整合起来。Miro
              没有把人工智能当作孤立的文本提示，而是把旅程地图、复盘和架构图等既有可视化产物作为上下文提示基础。EPAM 和 FREITAG 等企业客户部署显示，项目交付和工作坊评估周期最多可节省
              50%。不过，要保持差异化，仍需证明其工作流转化能长期胜过成熟套件在位者和敏捷的原生 AI 替代产品。
            claimRefs:
