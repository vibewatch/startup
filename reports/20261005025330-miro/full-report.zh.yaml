      - number: '1.3'
        title: 运营规模、产品演进与 AI 创新工作空间扩张
        blocks:
          - type: paragraph
            body: >-
              Miro 覆盖超过 1 亿名用户和 25 万家组织，其中包括 Salesforce、Deloitte、Cisco、Nike、PepsiCo 和 ASOS 等企业客户。行业估算显示，Miro 已渗透约 95%
              的《财富》100 强企业，在产品发现、敏捷冲刺规划和架构制图等场景拥有广泛的企业覆盖。为应对白板工具商品化以及 Figma、FigJam、Lucidchart 和 Microsoft Whiteboard
              的竞争，Miro 于 2026 年 1 月推出 AI Innovation Workspace 和企业 AI Workflows，把可视化多步骤 Flows、面向特定任务的 Sidekick 代理，以及与
              Microsoft Copilot、Google Gemini Enterprise、Amazon Q 和 Glean 的深度企业知识集成结合起来。此外，Miro 于 2026 年 2 月推出 Model
              Context Protocol（MCP）服务器；截至 2026 年 9 月，在 15 个已连接的客户端环境中累计代理调用超过 1,600 万次，主要来自 Claude Desktop、Claude Code 和
              ChatGPT。尽管运营规模庞大且实现盈利，经过审计的财务报表、净收入留存率及模块级 AI 变现情况仍未公开。
            claimRefs:
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO006
              - CO007
              - CO010
              - CO011
              - CO012
              - CO014
      - number: '1.4'
        title: 展示项
        blocks:
          - type: callout
            title: 战略估值重置与市场再调整
            body: >-
              Bending Spoons 于 2026 年 9 月达成的 $1.4B 收购，意味着 Miro 相对 2022 年 C 轮 $17.5B 基准估值压缩了 89%。Miro 的账户数扩张至 1 亿、ARR
              达到估算的 $600M–$665M，但在 Microsoft Whiteboard 和 FigJam 强力套装捆绑的背景下，营收增长放缓至个位数。2.3 倍 ARR 的收购倍数体现的是成熟 SaaS
              私募市场的定价，而非高增长协作软件的估值水平。
            calloutType: insight
            claimRefs:
              - CO007
              - CO008
              - CO010
              - CO011
          - type: callout
            title: 私有披露与尽调不透明度
            body: >-
              尽管 Miro 拥有 25 万家企业客户、覆盖 95% 的《财富》100 强企业，但公司一直是私营实体，GAAP 盈利能力、现金消耗和 cohort 留存率均未披露。尽调需要核实 Bending Spoons
              交易的最终条款，包括 $295M 的股东股权滚存、1,600 名员工的留任安排，以及收购完成后是否继续独立投入企业 AI 能力研发。
            calloutType: risk
            claimRefs:
              - CO005
              - CO011
              - CO013
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类细分与现状替代
        blocks:
          - type: paragraph
            body: >-
              可视化协作市场处于团队协作软件、数字制图、敏捷工作流管理和生成式 AI 生产力工具的交汇处。Miro 最初在基于浏览器的交互式白板品类中建立领先地位；行业基准估算该市场 2024 年规模为 $4.82B，预计
              2030 年达到 $7.30B，并与更广泛的 $31B 工作流自动化市场同步扩张。核心支出包括面向实时多人白板、冲刺规划、系统架构制图和跨职能头脑风暴的专用 SaaS
              按用户及企业全员许可。相反，不纳入的支出包括异步办公文档套件、Jira 等核心问题跟踪器，以及核心 Figma 等专业工程 CAD
              或原型设计环境。主要采用障碍不是专用单点竞争产品，而是现状惯性和免费办公套件捆绑，尤其是嵌入 Microsoft 365 的 Microsoft Whiteboard 及 Google Workspace
              集成；它们无需新增供应商采购就能满足基础头脑风暴需求。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM012
      - number: '2.2'
        title: 市场规模视角：TAM、SAM 与受证据约束的 SOM
        blocks:
          - type: paragraph
            body: >-
              评估 Miro 的市场机会，需要将多个规模视角交叉验证，而不能只依赖供应商自上而下的预测。自上而下的行业估算把全球企业工作流自动化（2026 年 $31B）和可视化交互式白板（从 $4.82B 增长到 2030
              年 $7.30B，复合增速处于中个位数至低两位数）定义为总可服务市场（TAM）。但 Miro
              现实中的可服务市场（SAM）受限于真正付费购买专业可视化协作平台的组织，而不是依赖套装工具或临时涂鸦工具。TechnologyChecker.io 的 DNS 和网页遥测数据显示，有 17,400
              个企业域名正在部署 Miro，其中中型市场和企业客户占可识别安装量的 91% 以上。Miro 的可获取服务市场（SOM）体现为披露的 $600M
              ARR，说明其在品类中拥有重要领导地位，但也显示北美和欧洲核心企业客户的市场已趋于饱和，并促使增长率降至个位数。
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM007
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
      - number: '2.3'
        title: 买方细分、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Miro 的商业渗透依靠混合型产品驱动增长（PLG）：先从基层终端用户采用起步，再转向集中式企业采购。个人设计师、敏捷教练、产品经理和软件工程师通常无需采购介入即可采用 Miro 的免费增值层，利用超过
              6,000 个模板和社区贡献的 Miroverse 看板来梳理冲刺和架构。团队使用范围扩大后，商业预算归属会转向工程负责人、产品运营主管，或代表企业 IT
              与采购的高管；他们围绕安全、管理控制和单点登录协商企业协议。企业账户占 Miro ARR 的 90% 以上，覆盖超过 25 万家组织；其中 750 多家企业客户每年贡献超过
              $100,000。不过，在宏观经济收紧期间，平均 18 个月的企业销售周期和采购审查会给企业采用带来阻力。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 宏观增长催化剂、采用瓶颈与企业治理
        blocks:
          - type: paragraph
            body: >-
              市场需求来自长期存在的混合办公结构、跨职能敏捷开发节奏，以及企业对 AI 驱动工作流提速的需求。Miro 推出的协作式 AI Workflows 和 Sidekick
              代理，直接回应了企业把发现周期从数周压缩至数日的要求；平台还通过 API 深度集成 250 多种工具，包括 Slack、Atlassian Jira 和云端数据仓库。不过，显著的采用瓶颈限制了长期扩张。Miro
              的溢价定价比入门级竞争产品高出估算的 35%，而经济逆风促使约 40% 的企业重新审视重复的协作软件支出。此外，严格的数据驻留和隐私监管，以及企业担心把专有公司图纸输入外部 AI
              模型，都会造成合规障碍，延迟全面企业部署。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场成熟与规模上限
            body: >-
              市场规模模型经常引用数字协作的数十亿美元扩张空间，但 Miro 的运营指标显示，独立可视化协作存在结构性上限。Miro 在 25 万家组织中实现 $600M
              ARR，说明其在专业白板市场拥有主导份额；但营收增速降至个位数，表明要把更广泛的企业知识工作者——而不仅是技术、设计和产品岗位——转化为客户，就必须直接对抗无处不在的办公生产力套件。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
          - type: callout
            title: 企业采购逆风与套装捆绑
            body: >-
              企业软件整合给独立协作软件的经济模型带来直接风险。在 40% 的企业削减软件支出、Microsoft 又积极把 Whiteboard 捆绑进 Microsoft 365 的情况下，Miro 35% 的价格溢价和
              18 个月的销售周期会带来续约压力，除非其协作式 AI Workflows 能交付无法复制的业务 ROI。
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
              - CM014
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 企业协作格局与直接同业动态
        blocks:
          - type: paragraph
            body: >-
              Miro 凭借丰富的模板生态、无限画布架构和结构化引导工具，成为企业在线白板与数字协作空间的品类基准。在企业账户中，Miro
              是覆盖产品管理、用户体验设计、敏捷冲刺仪式和跨职能规划的协作式创新工作空间。不过，竞争格局已分成不同战略层级。Mural 等直接同业通过结构化引导和带指导的工作流争夺正式高管工作坊和企业培训场景，而 Miro
              保持更宽泛的沙盒灵活性。同时，设计相邻的软件生态、敏捷制图专业产品和原生 AI 可视化画布也在挑战 Miro 的账户级席位扩张。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
