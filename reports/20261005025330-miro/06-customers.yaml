  title: "Customers"
  summary: "Miro has demonstrated massive horizontal reach across more than 250,000 organizational customers and 100 million registered users, anchored by high-velocity self-serve adoption and enterprise penetration in over 750 accounts generating more than $100,000 in ARR. However, commercial durability faces severe vendor consolidation pressures and procurement friction, underscored by unit economics compression and Bending Spoons' September 2026 acquisition agreement at roughly 2.3x ARR."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Dynamics"
    body: "Miro operates a dual-engine commercial model spanning product-led self-serve adoption and top-down enterprise expansion across more than 250,000 customer organizations and 100 million aggregate users globally. The customer base bifurcates into high-volume self-serve teams—primarily product managers, designers, agile coaches, and engineering squads—and centralized enterprise buyer organizations where procurement, IT, and security govern seat provisioning. Enterprise demand is concentrated among Fortune 100 technology, financial services, consulting, and retail organizations requiring enterprise-grade administrative controls, single sign-on, and compliance architectures. While self-serve adoption provides rapid departmental entry without sales friction, large account monetization relies on converting fragmented team licenses into standardized enterprise agreements. In mature enterprise deployments, cross-functional innovation initiatives drive usage beyond pure product development into business transformation, strategic planning, and operational workflows."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "adoption-trajectory-and-usage"
    title: "Adoption Trajectory, Enterprise Scale, and AI Evolution"
    body: "The company's adoption trajectory expanded from a pre-pandemic digital whiteboarding base of 50 million users in April 2023 to more than 100 million users and 250,000 paying customer organizations by early 2026. This user expansion was accompanied by revenue growth reaching approximately $600 million in annual recurring revenue, with nearly 90% derived from business and enterprise accounts. To deepen account engagement and expand beyond synchronous whiteboarding, Miro introduced AI-powered workflow orchestration, including Miro Assist and Collaborative AI Workflows built on cloud container infrastructure. Early enterprise adopters report significant cycle-time reductions, compressing multi-week workshop evaluations and discovery phases into days or hours. However, public disclosures do not report active daily or monthly user counts alongside total registered accounts, leaving the true proportion of recurring daily active collaborators unquantified."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-and-case-proof"
    title: "Named Customer Deployments and Workflow Proof"
    body: "Enterprise reference deployments demonstrate tangible productivity gains when Miro is embedded into repeatable operating models. Global technology consultancy Endava deployed Miro enterprise-wide across its workforce of nearly 12,000 employees as the core collaboration layer for its proprietary AI-native delivery framework, compressing artifact generation and workshop alignment from weeks to days. In commercial operations, lifestyle brand FREITAG and systems partner Smart System Guild achieved an 80% acceleration in data analysis speed during an enterprise software replacement project while establishing living project documentation. Similarly, global digital consultancy EPAM embedded Miro's AI Sidekicks into rapid client discovery engagements, accelerating proof-of-concept validation cycles. Complementing external client workflows, internal go-to-market teams at Miro integrated automated data pipeline tools to eliminate operational bottlenecks across high-velocity sales pipelines."
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "retention-pricing-and-concentration"
    title: "Retention Dynamics, Procurement Scrutiny, and Strategic Durability"
    body: "Despite extensive customer adoption, Miro faces intensifying procurement scrutiny and retention headwinds as enterprise technology budgets rationalize horizontal collaboration software. Customer concentration risk is low at the account level given a diversified installed base featuring more than 750 accounts paying over $100,000 in ARR, but category vulnerability is acute. Unlike mission-critical systems of record such as core databases, identity providers, or financial ledgers, visual whiteboarding tools sit closer to discretionary spending and are highly susceptible to consolidation into bundled vendor suites such as Microsoft 365. To address seat monetization friction, Miro manages pricing and packaging as an iterative product discipline spanning self-serve and enterprise tiers. Nevertheless, broader unit economic pressures, slowing top-line expansion, and margin normalization culminated in Bending Spoons agreeing to acquire Miro in September 2026 for $1.355 billion in enterprise value—a steep valuation reset reflecting market demands for durable cash flow efficiency over unmonetized user volume."
    claimRefs:
      - "CU003"
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
