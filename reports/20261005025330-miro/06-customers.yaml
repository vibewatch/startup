figures:
  - id: "FU001"
    title: "Miro Enterprise Customer Journey Map and Expansion Loops"
    type: "journey-map"
    summary: "Illustrates the end-to-end progression from self-serve organic activation through enterprise compliance consolidation and AI workflow expansion."
    data:
      items:
        - label: "1. Organic Team Discovery"
          description: "Individual designers, product managers, or agile leads sign up for free boards to run ad hoc workshops and brainstorms."
          touchpoints:
            - "Self-serve registration via Google/SSO"
            - "Pre-built template library selection"
            - "Peer invite links across slack/email"
        - label: "2. Departmental Sprawl & Land"
          description: "Multiple squads adopt paid Starter or Business seats to overcome board limitations and maintain ongoing sprint boards."
          touchpoints:
            - "Team credit card purchasing"
            - "Jira and Confluence integrations"
            - "Recurring retrospective sprint canvases"
        - label: "3. Enterprise Consolidation"
          description: "IT and procurement discover unmanaged shadow IT instances; Miro sales converts fragmented accounts into centralized enterprise license agreements."
          touchpoints:
            - "Single Sign-On (SSO) and SCIM provisioning"
            - "Enterprise security and data governance review"
            - "Volume seat pricing negotiation"
        - label: "4. Cross-Functional Scaling"
          description: "Platform adoption broadens beyond R&D into executive strategy, marketing, human resources, and business operations."
          touchpoints:
            - "Quarterly business review planning"
            - "Executive strategy offsite mapping"
            - "Cross-departmental project dashboards"
        - label: "5. AI Transformation & Expansion"
          description: "Deployment of Miro Assist, Sidekicks, and collaborative AI Workflows to compress end-to-end delivery cycles."
          touchpoints:
            - "Custom workflow agent integration"
            - "Enterprise knowledge groundings (Copilot/Glean)"
            - "Outcome-focused process acceleration"
        - label: "6. Renewal & Vendor Defense"
          description: "Annual procurement defense against bundled office productivity suites and ROI scrutiny on underutilized seats."
          touchpoints:
            - "License utilization and activity audits"
            - "Vendor consolidation review against M365"
            - "Negotiation of multi-year contract renewals"
    approximationNotes: "Progression stages synthesize typical enterprise software adoption patterns documented across Miro's executive interviews, pricing case studies, and enterprise customer disclosures."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU004"
      - "CU008"
      - "CU012"
      - "CU014"
callouts:
  - calloutType: "insight"
    title: "Discretionary Collaboration Vulnerability"
    body: "Miro's dual challenge in late-stage growth stems from category positioning: while deeply loved by product and design practitioners, visual collaboration boards sit closer to discretionary operating expense than core infrastructure systems of record. When macroeconomic pressure forces corporate vendor consolidation, tools lacking deep programmatic technical lock-in face severe license reduction and budget pruning."
    claimRefs:
      - "CU014"
      - "CU016"
  - calloutType: "risk"
    title: "Enterprise Valuation Reset and Unit Economics"
    body: "The stark contrast between Miro's January 2022 $17.5 billion peak valuation and its September 2026 $1.355 billion acquisition agreement by Bending Spoons highlights the market's aggressive repricing of collaboration SaaS. Acquirers now price mature recurring revenue at modest cash-flow multiples (roughly 2.3x ARR) when net retention and durable pricing leverage remain unproven under rigorous enterprise procurement reviews."
    claimRefs:
      - "CU011"
      - "CU014"
      - "CU015"
