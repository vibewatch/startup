callouts:
  - calloutType: "insight"
    title: "Market Maturation and Sizing Ceiling"
    body: "While market sizing models frequently cite multi-billion dollar expansion for digital collaboration, Miro's operational metrics demonstrate that standalone visual collaboration encounters a structural ceiling. Reaching $600 million in ARR across 250,000 organizations represents dominant market share within specialized whiteboarding, but revenue growth deceleration to single digits indicates that converting broader enterprise knowledge workers beyond technical, design, and product roles requires competing directly against ubiquitous office productivity suites."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM007"
  - calloutType: "risk"
    title: "Enterprise Procurement Headwinds and Suite Bundling"
    body: "Enterprise software consolidation poses an acute risk to standalone collaboration economics. With 40% of enterprises cutting software spend and Microsoft aggressively bundling Whiteboard within Microsoft 365, Miro's 35% pricing premium and 18-month sales cycles expose it to renewal pressure unless its collaborative AI Workflows deliver non-replicable business ROI."
    claimRefs:
      - "CM004"
      - "CM011"
      - "CM014"
