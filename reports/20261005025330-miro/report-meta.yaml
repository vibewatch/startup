companyProfile:
  summary: >-
    Miro is a late-stage collaboration software company that combines visual whiteboarding, diagramming, docs, tables,
    slides, and AI-assisted workflows into a single enterprise workspace. Founded as RealtimeBoard in 2011 by Andrey
    Khusid and Oleg Shardin, it built a broad self-serve and enterprise footprint, reached roughly $600 million in ARR,
    and agreed in September 2026 to be acquired by Bending Spoons.
