callouts:
  - calloutType: "insight"
    title: "Enterprise Revenue Durability Diverges from Multiple Contraction"
    body: "Miro's financial profile presents an extraordinary divergence between commercial scale and valuation multiples: the business successfully scaled from approximately $111 million ARR in 2021 to $600 million ARR by 2026 while maintaining positive cash flow and accumulating $435 million in net cash. Nonetheless, its enterprise valuation contracted from $17.5 billion (2022) to $1.355 billion (2026), reflecting a collapse in trailing ARR multiple from over 40x to 2.3x. This multiple compression signals an industry-wide transition where late-stage SaaS businesses are priced on terminal cash generation rather than speculative top-line growth."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI011"
      - "CI012"
      - "CI013"
  - calloutType: "risk"
    title: "Private Unit Economics and Retention Data Restrict Underwriting Rigor"
    body: "Despite confirmed $600 million ARR and 4 million paying users, complete absence of public disclosure on cohort gross churn, net revenue retention (NRR), and GAAP gross margins limits independent underwriting. If seat retention among its 750 high-value accounts softens under Bending Spoons' aggressive operating model—which historically emphasizes deep cost cutting and subscription price hikes—revenue could decay rapidly without offsetting growth."
    claimRefs:
      - "CI003"
      - "CI005"
      - "CI010"
      - "CI012"
      - "CI014"
      - "CI015"
