company:
  name: "Miro"
chapter:
  number: 4
  title: "Financials"
  summary: "Miro generated approximately $600 million in annual recurring revenue across roughly 4 million paying users and over 250,000 organizations, but its enterprise multiple compressed drastically in its September 2026 definitive acquisition agreement by Bending Spoons for $1.355 billion in enterprise value ($1.79 billion equity value including $435 million in balance sheet cash). While historically cash-generative with nearly 90% of revenue derived from business and enterprise accounts, full underwriting remains blocked by the complete absence of public audited gross margin, net retention, customer acquisition cost, and modular AI monetization disclosures."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue Model, Monetization Streams, and Contracting Structure"
    body: "Miro operates primarily as a subscription-based enterprise collaboration and innovation workspace software-as-a-service (SaaS) business [CI001]. The platform monetizes through tiered subscription plans offering digital whiteboarding, diagramming, agile planning, visual workflows, and generative artificial intelligence capabilities [CI002, CI007]. Historically driven by a product-led growth (PLG) self-serve acquisition engine that leveraged viral collaboration loops and freemium workspaces to onboard end-users [CI008], Miro successfully shifted its commercial mix toward enterprise organizations: nearly 90% of its roughly $600 million annual recurring revenue (ARR) is generated by business and enterprise customer accounts [CI003, CI005]. Enterprise monetization relies on annual and multi-year contractual commitments, enterprise security controls, centralized administration, and dedicated customer success management [CI002, CI005, CI009]. However, realized seat pricing, contractual discounting schedules, and standalone monetization metrics for recent product additions—specifically its AI Workflows and specialized agents—are not broken out in public disclosures, presenting an underwriting gap regarding incremental software gross margins [CI007, CI014]."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI005"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI014"
    tableRefs:
      - "TI001"
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "gtm-efficiency-and-cost-structure"
    title: "Go-to-Market Motion, Sales Efficiency Proxies, and Cost Structure"
    body: "Miro's commercial motion combines bottom-up viral product adoption with a disciplined enterprise sales force [CI008, CI009]. In the initial growth phase, self-serve viral mechanics drove broad organizational penetration across cross-functional teams, keeping blended customer acquisition costs relatively low [CI008]. As the business scaled beyond $400 million ARR toward $600 million, the go-to-market structure increasingly required formal enterprise sales qualification processes, multi-stakeholder deal navigation, and technical integration evaluations across major productivity stacks such as Jira, Confluence, Slack, and Zoom [CI001, CI009]. On the delivery and infrastructure side, Miro's cost of goods sold is driven by cloud hosting, real-time multiplayer canvas synchronization, data storage, and external artificial intelligence model inference calls across foundation model partners including OpenAI, Anthropic, and Google [CI007]. Although third-party financial analysis describes Miro as having been operating profitably since roughly 2020 with disciplined unit economics [CI005], audited gross margins, sales and marketing payback periods, net revenue retention rates, and gross revenue churn remain strictly undisclosed private figures [CI010, CI014, CI015]."
    claimRefs:
      - "CI001"
      - "CI005"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI014"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-acquisition"
    title: "Capital Adequacy, Balance Sheet Cash, and the Bending Spoons Transaction"
    body: "Over its operational history prior to sale, Miro raised a cumulative $476 million in venture capital across primary equity financing rounds, culminating in a January 2022 Series C funding round of $400 million that valued the company at $17.5 billion post-money [CI004, CI006, CI011, CI012]. Rather than exhausting its cash reserves through unconstrained operating burn, Miro preserved significant capital liquidity, maintaining approximately $435 million in balance sheet net cash as of September 2026 [CI005, CI011, CI013]. On September 10, 2026, Italian software holding company Bending Spoons announced a definitive agreement to acquire 100% of Miro for an enterprise value of $1.355 billion in an all-cash transaction, representing an equity valuation of approximately $1.79 billion after accounting for Miro's net cash [CI003, CI004, CI005, CI011, CI012]. Certain existing Miro shareholders elected to reinvest $295 million of transaction proceeds into newly issued Bending Spoons equity [CI003, CI004, CI005, CI011, CI013]. The transaction cleared at an enterprise valuation multiple of approximately 2.26x to 2.3x ARR, representing an enterprise valuation discount of over 90% compared to the peak 2022 valuation mark and establishing a definitive liquidation benchmark for late-stage collaboration software [CI004, CI005, CI006, CI011, CI012, CI013]."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI011"
      - "CI012"
      - "CI013"
  - id: "financial-verdict-and-underwriting-blockers"
    title: "Financial Verdict, Revenue Quality, and Underwriting Diligence Blockers"
    body: "From an underwriting perspective, Miro demonstrates high baseline revenue durability, supported by roughly $600 million in recurring revenue, an installed base of over 250,000 customer organizations, 4 million paying users, and more than 750 high-value customer accounts each generating over $100,000 in ARR [CI003, CI004, CI005]. Furthermore, its robust cash position of $435 million prior to acquisition indicates that the transaction was driven by growth deceleration and valuation multiple reset rather than balance-sheet insolvency or immediate liquidity failure [CI005, CI011, CI013]. However, the 2.3x ARR transaction multiple reflects market skepticism regarding terminal standalone organic growth rates, competitive commoditization against bundled alternatives, and potential post-acquisition operational disruptions [CI004, CI005, CI011, CI013]. For investment and credit underwriting, critical diligence gaps persist: audited GAAP/IFRS financial statements, cohort-level net revenue retention (NRR), customer acquisition payback dynamics, and departmental gross margins remain confidential and unverified [CI010, CI014, CI015, CI016]."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI010"
      - "CI011"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
