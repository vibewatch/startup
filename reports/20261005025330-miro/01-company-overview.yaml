company:
  name: "Miro"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2011 as RealtimeBoard and co-headquartered in Amsterdam and San Francisco, Miro scaled its visual collaboration canvas to over 100 million registered users across 250,000 organizational customers. After raising $476 million in total equity funding and reaching a peak $17.5 billion valuation in 2022, Miro expanded into an enterprise AI Innovation Workspace before agreeing to a $1.4 billion acquisition by Bending Spoons in September 2026."
sections:
  - id: "identity-governance"
    title: "Corporate Identity, Founding Roots, and Governance Structure"
    body: "Miro operates as an enterprise visual collaboration and AI innovation workspace platform co-headquartered in Amsterdam, Netherlands, and San Francisco, California. The business was originally established in Perm, Russia, in 2011 under the corporate entity RealtimeBoard, Inc., by co-founders Andrey Khusid and Oleg Shardin. The platform was created out of Khusid's desire to communicate visual design concepts to remote agency clients without requiring co-located meetings. Rebranded as Miro in 2019, the company transitioned from a digital whiteboarding point solution into a multiplayer cross-functional workplace system connecting product management, engineering, UX design, marketing, and operational teams. Leadership is anchored by Chief Executive Officer Andrey Khusid alongside key executives including Chief Product and Technology Officer Jeff Chow, who leads technical platform evolution and AI integration. The company employs over 1,600 personnel distributed across 14 global office hubs, reflecting an international footprint built through bottom-up product-led growth."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
    figureRefs: []
  - id: "capitalization-ma"
    title: "Capitalization History, Valuation Trajectory, and Strategic Acquisition"
    body: "Miro's financing trajectory spans early bootstrapping to mega-round venture financing, culminating in strategic consolidation. The company raised $400 million in a Series C round in January 2022 co-led by ICONIQ Growth, Accel, and Atlassian, with participation from Salesforce Ventures, Dragoneer Investment Group, GIC, and individual software executives, bringing lifetime equity funding to $476 million. The Series C round established a peak private valuation of $17.5 billion, representing an aggressive trailing revenue multiple exceeding 40x on estimated 2022 top-line revenues of $420 million. Independent secondary benchmarks and private market comps tracked slowing top-line expansion, with Sacra estimating 2024 annual recurring revenue of $665 million (5.6% year-over-year growth from $630 million). On September 10, 2026, Italian digital app holding company Bending Spoons agreed to acquire Miro in an all-cash strategic takeover valued at $1.355 billion enterprise value (approximately $1.4 billion headline transaction value and $1.79 billion equity value net of cash). The acquisition implies a 2.3x multiple on approximately $600 million in ARR, marking an 89% valuation compression from the 2022 peak."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO001"
      - "TO003"
    figureRefs: []
  - id: "scale-ai-evolution"
    title: "Operating Scale, Product Evolution, and AI Innovation Workspace Expansion"
    body: "Miro maintains immense enterprise reach, reporting more than 100 million total users across 250,000 organizations, including enterprise customers such as Salesforce, Deloitte, Cisco, Nike, PepsiCo, and ASOS. Industry estimates indicate penetration across roughly 95% of Fortune 100 corporations, demonstrating high enterprise footprint across product discovery, agile sprint planning, and architecture diagramming. To combat whiteboarding commoditization and expanding competition from Figma, FigJam, Lucidchart, and Microsoft Whiteboard, Miro launched its AI Innovation Workspace and enterprise AI Workflows in January 2026, combining visual multi-step Flows, task-specific Sidekick agents, and deep enterprise knowledge integrations into Microsoft Copilot, Google Gemini Enterprise, Amazon Q, and Glean. In addition, Miro introduced its Model Context Protocol (MCP) server in February 2026, which surpassed 16 million cumulative agent calls by September 2026 across 15 connected client environments led by Claude Desktop, Claude Code, and ChatGPT. Despite substantial operational scale and profitability, audited financial statements, net revenue retention rates, and module-level AI monetization remain undisclosed."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs: []
    figureRefs:
      - "FO001"
