callouts:
  - calloutType: "insight"
    title: "Strategic Valuation Reset and Market Realignment"
    body: "The agreed $1.4B acquisition by Bending Spoons in September 2026 represents a dramatic 89% valuation compression from Miro's 2022 Series C benchmark of $17.5B. While Miro demonstrated remarkable user expansion to 100 million accounts and reached an estimated $600M-$665M in ARR, top-line growth moderated into the single digits amid intense suite-bundling from Microsoft Whiteboard and FigJam. The acquisition multiple of 2.3x ARR reflects mature SaaS private-market multiples rather than hypergrowth collaborative software pricing."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO010"
      - "CO011"
  - calloutType: "risk"
    title: "Private Disclosures and Diligence Opacity"
    body: "Despite boasting 250,000 corporate customers and 95% Fortune 100 penetration, Miro has remained a private entity with undisclosed GAAP profitability, cash burn, and cohort retention. Diligence requires verifying the final terms of the Bending Spoons transaction, including the $295 million shareholder equity rollover, employee retention terms across its 1,600-person staff, and whether post-acquisition operations will maintain independent R&D investment in enterprise AI capabilities."
    claimRefs:
      - "CO005"
      - "CO011"
      - "CO013"
