              放在远超新兴公司规模的位置，大体接近上市工程同行，而不是创业公司可比组。官方服务栈随后解释了这些收入可能来自哪里：机械和嵌入式产品工程、软件平台工作、硅工程、测试、维持、运营和供应链，以及制造或售后支持。它更可能是项目收入、托管服务收入和经常性生命周期支持混合账本，而不是纯咨询组合。缺失的是构成。保留证据集中没有公开来源按垂直、地域、客户集中度或合同模型拆分收入，所以营收顶线可用，但顶线质量只露出一部分。这个限制应始终放在前台。
