      - number: '2.4'
        title: 增长驱动、约束与结构性风险
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但并非没有摩擦。支持增长逻辑的同一批报告，也指出了压力点。Nasscom 强调 AI 工业化、GCC 扩张，以及服务向产品化平台转化。Mordor
              指出半导体激励、数字孪生采用和国防本地化是需求驱动，但也提示工资通胀、人员流失、数据安全担忧，以及受监管行业对可解释性的迟疑。对 Quest
              而言，这些约束重要，因为它们可能先挤压利润率，再阻止收入增长。客户越来越想要成果导向或风险共担合同；在这样的行业里，工程服务公司必须让领域专家保持可计费，投入 AI
              和网络安全工具，同时守住交付经济性。结果是，一个结构上利好能力型公司的市场，若利用率、技能组合或合规执行滑坡，强公司也可能跑输。因此，市场质量本身不能替代对交付、留存、定价和执行纪律的整体尽调。
