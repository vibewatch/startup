      - number: '8.3'
        title: 上行空间取决于增长兑现、半导体势能和 IPO 准备度
        blocks:
          - type: paragraph
            body: >-
              公开上行情景有三部分。第一，管理层提出的五年 $2.5B 收入目标意味着可信的增长跑道，前提是 Quest 能把航空航天、工业、医疗科技和半导体需求转化为大型多年期项目。 第二，借助
              BITSILICA、硅工程能力以及 2026 年多项 ISG 认可，半导体扩张可能让市场给出高于传统工程外包的质量认知。 第三，如果印度 IPO 和 reverse flip 跑通，Quest
              可能打开更完整的披露、更广的投资人参与，并在财务数据站得住时争取更强的公开市场倍数。 难点在于，每根上行支柱仍要靠执行兑现。收入雄心不等于订单，能力扩张不等于盈利规模，IPO 选择权也不等于 IPO 成功。
              投资人能看见路径，但还看不到证明。因此，上行空间应做概率加权，而不是照单全收。没有申报文件和招股书里的数字或利润率，单靠叙事强度填不上估值缺口。
            claimRefs:
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
