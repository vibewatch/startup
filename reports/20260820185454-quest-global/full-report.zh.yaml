companyProfile:
  summary: >-
    Quest Global 是一家后期私营工程服务公司，成立于 1997 年，把自己定位为面向硬工程行业的独立纯产品工程伙伴。公司总部在新加坡，运营根基深扎印度，在 20 个国家和 104 个中心拥有 23K+
    名员工，服务航空航天、能源、医疗技术、工业、半导体、汽车和铁路客户。2026 年 2 月的公开报道把 Hillhouse 少数股权投资与约 $4.5B 的隐含估值联系起来，也引用管理层说法称收入约达 $1.1B，五年目标为
    $2.5B。
