              - CV033
      - number: '8.4'
        title: 下行风险来自不透明、集中度，以及估值跑在证据前面的可能
        blocks:
          - type: paragraph
            body: >-
              下行情景很直接。如果 Quest 未披露的利润率只是平均水平，如果客户集中度偏高，如果半导体扩张不如宣传中重要，或者公开市场因不透明给出折价，那么 $4.5B 定价就可能显得偏满。
              即便没有崩塌叙事，只要投资人要求在支付溢价倍数前看到更清楚的现金生成、留存和集中度控制证据，公司价值仍可能低于私募市场标题估值。
              这不意味着当前定价错误，而是说明现阶段举证责任仍很高。因此，正确的公开市场框架应是一组估值区间：可信中点靠近 Hillhouse 定价，由规模和定位支撑； 但在 IPO
              级披露出现前，缺失的经济性会压住上限。在此之前，谨慎是投资逻辑和任何买方投资备忘录中理性的组成部分。当前，这个倍数仍需要经济性验证，才可能赢得广泛的公开市场支持。
            claimRefs:
