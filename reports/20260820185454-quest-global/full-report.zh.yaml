  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Quest Global 实际所在的市场
        blocks:
          - type: paragraph
            body: >-
              不应按泛化 IT 外包商给 Quest Global 定价。它自己的服务页面、Reuters
              评论和行业报告都指向同一条更窄的赛道：面向硬件密集行业的工程研发、产品工程、生命周期维持和数字工程转型。这一点关键，因为 ER&D 需求驱动不同于企业 IT。买方通常是业务单元工程负责人，而不是
              CIO；项目围绕安全、合规和实体产品里程碑推进；工作落在产品开发和维持预算里，而不是可自由裁量的应用支出。实际看，Quest 是把工程产能和领域专门知识卖给 OEM 项目，这些 OEM
              正在数字化机械系统、电气化平台、重做硅设计，或支持已安装设备群。这比通用 IT 咨询拥有更好的长周期定位，但也意味着公司同时与聚焦型工程公司、多元化 IT 巨头，以及能力越来越强的自建 GCC
              组织竞争。多边竞争是这个市场的定义特征，不是脚注。
            claimRefs:
