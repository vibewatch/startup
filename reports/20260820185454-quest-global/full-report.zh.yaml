      - number: '2.2'
        title: 市场规模、增长与印度的位置
        blocks:
          - type: paragraph
            body: >-
              尽管不同来源的方法论不一致，2026 年市场数据方向上仍然强劲。Nasscom 2026 年 2 月战略评论称，印度技术行业到 FY26 应突破 $315B，并强调 ER&D
              正成为越来越重要的增长向量。Reuters 另行报道，同一场会议上 Nasscom 估计 ER&D 将在 2026 财年增长 6.8% 至 $63B，快于核心 IT 服务增长。较早的 Nasscom-BCG
              采购研究仍有结构性参考价值：该研究预测 2023 至 2030 年全球 ER&D 支出以 8–9% CAGR 增长，印度在全球 ER&D 采购中的份额升至 22%，印度采购市场价值从 2023 年约
              $44–45B 扩大到 FY30 的 $130–170B。Mordor 的 2026 年市场模型对印度 ER&D 服务市场更乐观，给出 2026 年
              $147.3B，但该估计采用更宽的定义框架。三个视角的共同结论很清楚：印度工程产能的战略重要性仍在上升。
