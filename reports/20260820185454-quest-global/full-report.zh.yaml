      - number: '1.3'
        title: 资本结构、投资者与 IPO 路径
        blocks:
          - type: paragraph
            body: >-
              2026 年 Quest Global 的所有权故事由两条并行主线定义：新资本进入股权结构表，企业逐步迈向公开市场准备。2026 年 2 月 Hillhouse
              交易通过新股和老股交易引入了一家新的全球投资者，多篇新闻报道交叉指向该交易约占公司 5%，估值约 $4.5B。公开报道还把 Carlyle 放在主要外部机构投资者位置，创始人 Ajit Prabhu
              保留大额持股，其他财务支持方则包括 ChrysCapital、True North、Bain、Advent、GIC，以及不同报道中提到的其他投资者。Hillhouse 公告三天后，Reuters
              报道称管理层目标是在随后 12–18 个月于印度 IPO，并推动反向翻转回印度。Moneycontrol 后来报道称 Warburg Pincus
              可能按同一估值进行少数股权投资。合在一起看，公司像是在执行典型的上市前剧本：收紧治理、更新投资者基础，并在提交文件前测试公开市场叙事。
