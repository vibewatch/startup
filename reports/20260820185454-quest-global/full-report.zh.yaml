  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 可比公司、规模与 Quest 的位置
        blocks:
          - type: paragraph
            body: >-
              Quest Global 的正确可比集合不是某一家镜像公司，而是一组上市工程和数字工程公司，每家公司照亮 Quest 轮廓的一部分。EPAM 展示了数字工程在规模和披露上的上限。LTTS
              是最自然的印度工程服务可比公司，因为它把多垂直工程深度、公开市场纪律和十亿美元级收入结合起来。Cyient 代表规模较小但仍有意义的纯工程基准，并与航空航天和电信有关。Tata Elxsi
              是最接近的设计导向工程同行；HCLTech 和 Wipro 则展示了更广泛 IT 平台把工程包进更大客户关系后能做到什么。放在这组公司中，Quest 呈现中等规模：大于小型利基供应商，低于 EPAM，战略意图接近
              LTTS 但公开可见度尚未达到 LTTS，更偏工业而非若干软件重型同行。这个相对中间车道在战略上有用，但对估值敏感。
