        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Quest Global 仍呈现后期私营公司常见的创始人主导特征。Ajit Prabhu 仍是联合创始人兼 CEO，历史页面继续围绕创始人的移民工程师故事，以及从 Schenectady
              两人办公室成长为跨国工程平台的路径讲述公司叙事。领导层页面同时显示创始人延续性，以及交付、战略、人才和董事会职能上的更厚梯队；2026 年 8
              月董事会扩充公告则显示，公司正在积极引入具备航空航天、技术和治理背景的独立董事。这一点重要，因为公司正准备潜在 IPO 和反向翻转，治理准备已不再只是门面。同时，关键人物依赖并未消失：Ajit Prabhu
              仍是战略、投资者沟通和文化的主要外部面孔。运营结论偏正面，但风险尚未完全释放——公司提升董事会成熟度的速度，快于降低创始人中心性的速度。
