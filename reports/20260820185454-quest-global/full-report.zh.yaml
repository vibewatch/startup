      - number: '2.3'
        title: 买方分群与预算流向
        blocks:
          - type: paragraph
            body: >-
              Quest Global 最好的需求口袋，可能在实体系统软件含量提升、OEM 同时需要成本杠杆和领域可信度的地方。Nasscom-BCG 把软件、汽车和半导体列为到 2030 年印度 ER&D
              份额的最大贡献来源；Reuters 则引用 Ajit Prabhu 说法，特别指出能源和国防需求是 Quest 近期增长驱动。Mordor 同样把汽车列为 2025
              年最大垂直领域，把半导体和电子列为增长最快领域，把嵌入式工程列为高增长服务线，并把国防抵消安排视为航空研发本地化的顺风。这些信号与 Quest 自身行业选择高度吻合。商业含义是，公司无需赢下整个 ER&D
              市场才能复合增长。它需要在那些艰难、安全关键、周期长的预算里持续获胜，而其既有客户关系和印度交付模型已经在这些行业具备可信度。
