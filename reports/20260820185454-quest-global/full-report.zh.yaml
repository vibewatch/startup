  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: Hillhouse 交易提供了当前主要估值锚点
        blocks:
          - type: paragraph
            body: >-
              Quest Global 的公开估值叙事始于 2026 年 2 月的 Hillhouse 交易。Quest 官方披露的是一笔少数股权投资， 包含新股资金和老股交易。随后多家媒体把经济条款拼到一起：持股约
              5%，隐含企业价值约 $4.5B。几天后， Reuters 又引述管理层称，上一年收入已达 $1.1B，公司正考虑在 reverse flip 后赴印度 IPO。三条信息合起来，
              给估值提供了可用坐标：一个真实的私募市场定价、一个当前收入锚，以及一条可再次检验该定价的公开市场路径。 关键在于，市场上确实存在这个估值，但支撑披露仍不完整。投资人可以引用这个定价，却还不能完全穿透验证它。 在
              IPO 文件公开之前，任何投资备忘录或投委会讨论都应按这个差别来决定该给这个锚多大权重。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV019
              - CV023
              - CV024
      - number: '8.2'
        title: 相对规模和同业框架让估值说得通，但并非不证自明
        blocks:
          - type: paragraph
            body: >-
              $4.5B 估值之所以看起来合理，是因为 Quest 已有规模，而不是因为公开证据证明它具备异常出色的经济性。 Reuters 给出的 $1.1B 收入锚显示，按收入量级看，Quest 高于 Cyient
              DET、低于 EPAM，大致处在与 LTTS 相同的后期工程服务梯队。 公司聚焦硬工业、卡位半导体，并拥有长期客户关系，这些都支撑它拿到高于通用外包倍数的质量评价。但上市同业也暴露了 Quest 尚未披露的内容：
              利润率、现金流、分部结构，以及更稳定的投资人沟通。因此，相对规模足以支撑一场严肃的估值讨论，但相对透明度仍要求谨慎。
              换句话说，收入基盘让这个估值可以被讨论；披露缺口让它还谈不上理所当然。这就是相对价值的核心张力。规模解释了这场讨论为何存在； 今天真正配置资本的投资人，信念更多由透明度决定。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
