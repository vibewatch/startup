      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: $4.5B 定价可以作为可信的私募市场锚
            body: 规模、客户质量和增长定位足以让报道中的 Hillhouse 估值成为一个可信的实时市场数据点。
