- id: tech-gaps
  title: Technical differentiation is visible, but productization and IP economics remain under-disclosed
  body: 'Quest’s technology story is strongest when it can show end-to-end engineering in hard industries. It is weaker when investors ask product-company questions: what percentage of work is repeatable IP, how much revenue comes from platforms versus custom services, what proportion of delivery uses proprietary accelerators, and whether AI tooling materially improves margin. Public materials make repeated claims about AI, digital twins, predictive maintenance, Industry 4.0 or 5.0, and connected ecosystems, but they do not publish the operating metrics needed to translate those capabilities into economic differentiation. Even external recognitions like ISG mainly validate positioning, breadth, and execution narrative. They do not substitute for disclosed attach rates, reuse metrics, platform adoption, or software gross margins. The right judgment is therefore balanced: the stack appears modern enough to win sophisticated work, but not yet transparent enough to prove software-like leverage. That missing bridge limits how much multiple expansion the stack alone can justify in public markets today.'
