  topStrengths:
    - 20 个国家、104 个中心、23K+ 员工的规模，支撑其承接全球 OEM 项目的交付可信度。
    - 作为私有工程服务公司，客户质量异常强，航空航天、能源、医疗科技和工业龙头都有具名敞口。
    - 2026 年 2 月 Hillhouse 投资提供了新的第三方估值锚，约 $4.5B，不是过期融资标记。
    - 通过 BITSILICA 扩张半导体能力，再叠加 2025-2026 年多项行业认可，说明公司不只停留在传统机械外包。
    - 印度 IPO 选择权可能显著提升披露质量和公开市场可比性。
  topRisks:
    - 利润率、现金流、在手订单和客户集中度的合并口径公开披露仍有限。
    - $4.5B 估值隐含不低的收入倍数，仍部分依赖叙事质量，而不是完整公开的经济性。
    - 客户组合偏向长周期工业和航空航天项目；一旦需求走弱，项目集中度和纠偏速度都会成为压力。
    - 员工规模披露方向上很强，但官方与第三方来源之间并未完全对齐。
    - 如果投资者给出不透明折扣，未来 IPO 定价可能低于私有市场标记。
  unresolvedGaps:
    - 合并口径、经审计的毛利率、EBITDA 和自由现金流披露。
    - 集团层面的客户集中度、留存和在手订单指标。
    - 分部或垂直行业收入结构，用来判断半导体和更高复杂度工作贡献了多少价值。
    - Hillhouse 及任何后续少数股权交易后的清晰持股表。
    - IPO 申报时间表，以及 reverse-flip 完成到什么程度。
