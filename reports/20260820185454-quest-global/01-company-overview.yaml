company:
  name: Quest Global
chapter:
  number: 1
  title: Company Overview
  summary: Quest Global is a Singapore-headquartered engineering-services platform founded in 1997 that now spans 23K+ employees, 20 countries, and 104 delivery centers. February 2026 minority investment from Hillhouse established a fresh pre-IPO valuation anchor around $4.5B while management simultaneously disclosed India IPO plans, a reverse-flip process, and a five-year revenue ambition of $2.5B from $1.1B. The core diligence takeaway is that the company has clear scale, marquee customers, and improving governance, but still limited public disclosure on audited group financials, exact ownership, and segment economics.
sections:
- id: overview-identity
  title: Identity, footprint, and business model
  body: 'Quest Global positions itself as the largest private independent pure-play engineering services company, with a business model centered on outsourced product engineering, lifecycle support, and digital-transformation programs for hard-engineering industries. The company’s current public identity is unusually consistent across its home page, corporate pages, and recent transaction press releases: it is headquartered in Singapore, employs 23K+ people, operates in 20 countries, and runs 104 delivery centers and offices. The company’s service stack spans software, embedded, silicon, mechanical, supply-chain, and testing workflows, which gives it a broad enough surface area to serve aerospace, energy, medtech, rail, industrial, and semiconductor customers through both project-based and managed-service engagements. Management’s stated ambition is to solve “the world’s hardest engineering problems,” which is brand language, but the underlying commercial positioning is concrete: mission-critical
    engineering work where OEMs care about domain depth, cost arbitrage, and long-duration delivery continuity.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
