- id: overview-leadership
  title: Founders, leadership, and governance
  body: 'Quest Global still looks founder-led in the way a late-stage private company often does. Ajit Prabhu remains co-founder and CEO, and the history pages continue to frame the enterprise narrative around the founders’ immigrant-engineer story and the progression from a two-person Schenectady office into a multinational engineering platform. Leadership pages show both founder continuity and broader bench depth across delivery, strategy, people, and board functions, while the August 2026 board-expansion release shows the company actively adding independent directors with aerospace, technology, and governance backgrounds. That is important because the company is preparing for a potential IPO and reverse flip, so governance readiness is no longer cosmetic. At the same time, key-person dependence has not disappeared: Ajit Prabhu is still the principal external face of strategy, investor communications, and culture. The operating takeaway is positive but not fully de-risked — the company
    is adding board maturity faster than it is reducing founder centrality.'
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
