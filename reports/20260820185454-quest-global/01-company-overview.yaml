  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Exact fully diluted ownership, board-rights, and share-class terms after the Hillhouse deal.
    whyItMatters: The valuation headline is less useful without governance rights, liquidation preferences, and founder-control mechanics.
    diligencePath: Obtain current cap table and shareholder rights schedule from management or IPO draft.
