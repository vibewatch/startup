  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Disclosure and governance risk remain the primary underwriting concern
        blocks:
          - type: paragraph
            body: >-
              The single biggest risk in the public record is disclosure insufficiency rather than proven operating
              failure. Quest has a fresh valuation anchor, a reported IPO path, and improving governance optics, yet
              investors still lack audited public group financials, clear customer concentration data, margin
              visibility, and consolidated entity transparency. The February 2026 Reuters interview and related coverage
              are useful, but they do not substitute for prospectus-grade reporting. Board expansion helps: adding four
              independent directors and moving to a 12-member board signals institutionalization ahead of an IPO. Even
              so, governance progress and disclosure depth are not the same thing. Until the company publishes fuller
              financial statements and sharper ownership or operating metrics, the main investment risk is that the
              valuation is moving faster than public diligence evidence. That can quickly change investor sentiment if
              equity markets turn less forgiving. This remains the central underwriting bottleneck and the main reason
              diligence should remain skeptical today.
            claimRefs:
