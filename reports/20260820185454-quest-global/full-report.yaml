              Relative to public peers, Quest’s main financial weakness is not obvious lack of scale; it is disclosure
              incompleteness. On topline alone, the company appears larger than Cyient DET, below EPAM, and roughly
              around LTTS magnitude. That can support a serious late-stage valuation discussion. But without margin,
              free-cash-flow, utilization, or concentration data, investors cannot yet distinguish whether Quest
              deserves a premium for industrial depth or a discount for opacity. The public record also supports a
              simple estimated productivity lens: $1.1B of revenue against 23K+ official employees implies roughly $48K
              of revenue per employee, which is directionally useful but too rough for underwriting. The more prudent
