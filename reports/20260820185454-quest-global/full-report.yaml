      - number: '4.3'
        title: Capital adequacy, funding, and balance-sheet signals
        blocks:
          - type: paragraph
            body: >-
              The February 2026 Hillhouse transaction and May 2026 Warburg-discussion reporting suggest Quest is
              actively refreshing capital ahead of a possible listing. Officially, the Hillhouse deal included primary
              capital plus secondary liquidity for select shareholders, and management told Reuters it was pursuing an
              India IPO within 12 to 18 months. That combination points to a pre-IPO capital strategy rather than a
              distressed raise. Still, the balance-sheet picture is incomplete. Public group-level cash, debt, and net
              leverage remain undisclosed. TheCompanyCheck adds a narrow but useful India-entity lens: the Indian
              operating company reported FY25 revenue of ₹2,620.05 crore, paid-up capital of ₹208.75 crore, and open
              charges of ₹391.94 crore. Those data should not be overread as the whole group balance sheet, but they do
              show that local leverage and filed charges exist. Investors should therefore treat Quest as funded and
              capital-markets active, but not yet financially transparent. That distinction matters for IPO readiness,
              diligence sequencing, and investor confidence.
