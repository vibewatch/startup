      - number: '1.3'
        title: Capital structure, investors, and IPO path
        blocks:
          - type: paragraph
            body: >-
              Quest Global’s ownership story in 2026 is defined by two concurrent themes: fresh capital entering the cap
              table and a gradual move toward public-market readiness. The February 2026 Hillhouse transaction
              introduced a new global investor through both primary and secondary capital, while multiple news reports
              triangulated the deal at roughly 5% of the company and about a $4.5B valuation. Public reporting also
              places Carlyle as the lead external institutional investor, with founder Ajit Prabhu retaining a large
              ownership position and other financial backers spanning ChrysCapital, True North, Bain, Advent, GIC, and
              others mentioned across coverage. Three days after the Hillhouse announcement, Reuters reported that
              management was targeting an India IPO in the following 12–18 months and was pursuing a reverse flip back
              to India. Moneycontrol later reported a possible Warburg Pincus minority investment at the same valuation.
              Taken together, the company appears to be running a classic pre-IPO playbook: tighten governance, refresh
              the investor base, and test a public-market narrative before filing.
