  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The Hillhouse deal provides the main current valuation anchor
        blocks:
          - type: paragraph
            body: >-
              Quest Global’s public valuation story starts with the February 2026 Hillhouse transaction. Officially,
              Quest disclosed a minority investment comprising both primary capital and secondary share sales. Multiple
              press reports then triangulated the economic terms at roughly a 5% stake and an implied enterprise value
              of about $4.5B. Reuters followed days later with management commentary that revenue had reached $1.1B in
              the prior year and that the company was considering an India IPO after a reverse flip. Those three pieces
              together create a usable valuation frame: a real private-market mark, a current revenue anchor, and a
              public-markets path that could test the mark again. The crucial point is that the valuation exists in the
              market, but the supporting disclosure remains incomplete. Investors can reference the mark, but not yet
              fully underwrite it. That distinction should govern how much weight the anchor carries in any memo or
              committee discussion before an IPO filing appears publicly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
