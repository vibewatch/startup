chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Quest Global positions itself as the largest private independent pure-play engineering services company,
              with a business model centered on outsourced product engineering, lifecycle support, and
              digital-transformation programs for hard-engineering industries. The company’s current public identity is
              unusually consistent across its home page, corporate pages, and recent transaction press releases: it is
              headquartered in Singapore, employs 23K+ people, operates in 20 countries, and runs 104 delivery centers
              and offices. The company’s service stack spans software, embedded, silicon, mechanical, supply-chain, and
              testing workflows, which gives it a broad enough surface area to serve aerospace, energy, medtech, rail,
              industrial, and semiconductor customers through both project-based and managed-service engagements.
              Management’s stated ambition is to solve “the world’s hardest engineering problems,” which is brand
              language, but the underlying commercial positioning is concrete: mission-critical engineering work where
              OEMs care about domain depth, cost arbitrage, and long-duration delivery continuity.
            claimRefs:
