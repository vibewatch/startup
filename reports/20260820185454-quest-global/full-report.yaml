  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market Quest Global is actually in
        blocks:
          - type: paragraph
            body: >-
              Quest Global should not be underwritten as a generalist IT outsourcer. Its own service pages, Reuters
              comments, and industry reports all point to the same narrower lane: engineering research and development,
              product engineering, lifecycle sustenance, and digital-engineering transformation for hardware-heavy
              industries. That matters because ER&D demand drivers differ from enterprise IT demand drivers. Buyers are
              often business-unit engineering leaders rather than CIOs; programs run against safety, compliance, and
              physical-product milestones; and work is anchored in product-development and sustainment budgets rather
              than discretionary app spend. In practical terms, Quest is selling engineering capacity and domain
              know-how into programs where OEMs are trying to digitize mechanical systems, electrify platforms, redesign
              silicon, or support installed fleets. This creates a better long-cycle positioning than generic IT
              consulting, but it also means the company competes simultaneously with focused engineering firms,
              diversified IT majors, and increasingly capable captive GCC organizations. That multi-sided competition is
              a defining feature of the market, not a footnote.
            claimRefs:
              - CM001
              - CM002
