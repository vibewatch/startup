  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue base, streams, and headline growth path
        blocks:
          - type: paragraph
            body: >-
              The strongest public financial anchor for Quest Global comes from Reuters: management said revenue rose to
              $1.1B last year and could reach $2.5B over the next five years. That single data point matters because it
              places Quest well beyond emerging-company scale and broadly in line with listed engineering peers rather
              than startup comparables. The official services stack then helps explain where that revenue likely comes
              from: mechanical and embedded product engineering, software platform work, silicon engineering, testing,
              sustenance, operations and supply chain, and manufacturing or aftermarket support. This is likely a
              blended book of project revenue, managed-services revenue, and recurring lifecycle support rather than a
              pure consulting mix. The missing piece is composition. No public source in the retained set breaks revenue
              by vertical, geography, customer concentration, or contract model, so the topline is usable, but the
              quality of that topline remains only partially visible. That limitation should stay front of mind.
