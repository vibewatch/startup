      - number: '8.4'
        title: Downside risk comes from opacity, concentration, and the possibility that the mark outran the evidence
        blocks:
          - type: paragraph
            body: >-
              The downside case is straightforward. If Quest’s undisclosed margins are only average, if customer
              concentration is high, if semiconductor expansion proves less material than advertised, or if public
              markets assign a discount for opacity, then a $4.5B mark could look full. Even without a collapse
              narrative, the company could still be worth less than the private-market headline if investors demand
              clearer evidence of cash generation, retention, and concentration control before paying a premium
              multiple. That does not mean the current mark is wrong. It means the present burden of proof remains high.
              The right public-market framing is therefore a valuation range with a credible midpoint near the Hillhouse
              mark, supported by scale and positioning, but capped by missing economics until IPO-grade disclosure
              arrives. Until then, caution is a rational part of the thesis and of any investment memo today for buyers.
              The multiple still needs economic validation before broad public-market sponsorship right now.
            claimRefs:
