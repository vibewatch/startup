  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Peer set, scale, and where Quest fits
        blocks:
          - type: paragraph
            body: >-
              The right peer set for Quest Global is not a single-company mirror. It is a portfolio of public
              engineering and digital-engineering firms that each illuminate one part of Quest’s profile. EPAM shows the
              upper bound of scale and disclosure in digital engineering. LTTS is the most natural India-origin
              engineering-services comp because it combines multi-vertical engineering depth with public-market
              discipline and billion-dollar revenue. Cyient represents a smaller but still meaningful pure-play
              engineering benchmark with aerospace and telecom relevance. Tata Elxsi is the closest design-led
              engineering peer, while HCLTech and Wipro demonstrate what broader IT platforms can do when they wrap
              engineering into larger account relationships. Against that set, Quest appears mid-scaled: larger than
              smaller niche providers, below EPAM, near LTTS by strategic intent but not yet by public visibility, and
              more industrial than several software-heavy peers. That relative middle-lane position is strategically
              useful but valuation-sensitive.
            claimRefs:
