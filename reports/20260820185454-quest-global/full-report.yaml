  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Full-stack engineering breadth is real, but it remains services-led
        blocks:
          - type: paragraph
            body: >-
              Quest Global’s official service pages describe a genuinely broad technology stack: software engineering,
              embedded engineering, silicon engineering, mechanical engineering, digital engineering, testing, and
              lifecycle support. Across these pages the recurring strategic message is that Quest is not selling one
              isolated engineering function; it is trying to connect semiconductor design, device engineering, cloud
              enablement, analytics, and sustainment into a single delivery model. The “Silicon to System to Cloud”
              language matters because it signals horizontal integration across the engineering stack, not merely
              capability shopping-list breadth. That said, the public evidence still points to a services-led model. The
              technology assets are organized as engineering capabilities sold into customer programs, not as a
              self-disclosed portfolio of proprietary platforms with separately reported product revenue. Investors
              should therefore view the stack as commercially useful and technically credible, but not as proof that
              Quest has escaped the economics of engineering services. The distinction between capability breadth and
              product leverage is essential for valuation underwriting.
