      - number: '2.2'
        title: Market size, growth, and India’s position
        blocks:
          - type: paragraph
            body: >-
              The 2026 market data are directionally strong even if methodologies differ across sources. Nasscom’s
              February 2026 strategic review said India’s technology sector should cross $315B by FY26 and highlighted
              ER&D as an increasingly important growth vector. Reuters separately reported at the same conference that
              Nasscom estimated ER&D would grow 6.8% to $63B in fiscal 2026, outpacing core IT services growth. The
              earlier Nasscom-BCG sourcing study remains useful for structural context: it projected global ER&D spend
              growing at 8–9% CAGR from 2023 to 2030, India’s global ER&D sourcing share rising to 22%, and India’s
              sourcing-market value expanding from roughly $44–45B in 2023 to $130–170B by FY30. Mordor’s 2026 market
              model is even more bullish on the India ER&D services market at $147.3B in 2026, though that estimate
              includes a broader definitional frame. Across all three lenses, the common conclusion is clear:
              India-based engineering capacity is still gaining strategic importance.
            claimRefs:
