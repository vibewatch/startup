      - number: '2.3'
        title: Buyer segments and where budgets are moving
        blocks:
          - type: paragraph
            body: >-
              Quest Global’s likely best pockets of demand sit where physical systems are gaining more software content
              and where OEMs need both cost leverage and domain credibility. Nasscom-BCG highlighted software,
              automotive, and semiconductors as the largest contributors to India’s ER&D share by 2030, while Reuters
              quoted Ajit Prabhu pointing specifically to energy and defense demand as near-term growth drivers for
              Quest. Mordor likewise identified automotive as the largest 2025 vertical, semiconductor and electronics
              as the fastest-growing, embedded engineering as a high-growth service line, and defense offsets as a
              tailwind for aero-R&D localization. These signals line up well with Quest’s own sector choices. The
              commercial implication is that the company does not need to win the full ER&D market to compound. It needs
              to keep winning the hard, safety-critical, long-duration budgets in the sectors where its existing
              customer relationships and Indian delivery model are already credible.
