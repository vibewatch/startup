      - number: '1.4'
        title: Scale milestones, workforce, and disclosure boundaries
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a company that expanded first through domain-led delivery relationships and
              then through a broader portfolio-and-geography strategy. Quest Global’s history page traces a path from
              the 1997 founding to a Bengaluru footprint in 1998, automotive expansion via acquisition, a GE Energy
              engineering development center, an aerospace SEZ in Belgaum, and later acquisitions in Europe and hi-tech.
              Recent milestones matter more for underwriting: the Hillhouse investment, the reverse-flip and IPO
              planning, the 2026 board expansion, and the BITSILICA acquisition that deepened semiconductor capability.
              Workforce disclosure is directionally helpful but not perfectly reconciled: official pages say 23K+
              employees, some February news reports cited more than 21,000, and Revelio Labs estimated a larger March
              2026 workforce. The cleanest conclusion is not to overfit any one figure. Instead, investors should treat
              Quest as clearly scaled, but still privately disclosed, with better visibility on headline footprint than
              on audited group operating metrics.
