- id: risk-compliance
  title: Compliance, data, and supply-chain controls are visible on paper but hard to score operationally
  body: Quest’s website provides a meaningful policy footprint around privacy, applicant data, ethics, data-subject access, sustainable procurement, supplier standards, and modern slavery. That is better than many private companies of similar size and suggests management understands the compliance expectations that come with serving regulated customers. The privacy policy references GDPR alignment, applicant notices describe criminal-record checks and cross-border data handling, and the supplier or procurement pages show explicit expectations for counterparties. The limitation is that these are governance artifacts, not proof of operational outcomes. Public sources do not reveal incident history, audit findings, whistleblower volumes, supplier-compliance breach rates, or whether any material privacy or labor complaints have arisen. Investors should therefore treat the compliance framework as directionally positive but not enough to eliminate execution, cybersecurity, or third-party oversight
    risk. It lowers baseline concern without closing the case. Operational evidence still matters more in diligence practice overall.
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
