- id: risk-execution
  title: Execution risk spans customers, M&A integration, and public-market transition
  body: 'Quest’s execution risk is multi-layered. First, customer concentration may be high because the public success stories skew toward large aerospace and regulated-industry accounts. Second, the BITSILICA acquisition and broader semiconductor push create integration and capability-delivery risk if the acquired expertise does not translate into scaled wins. Third, the reverse-flip and IPO path could force changes in governance, legal structure, and disclosure discipline on a compressed timetable. Finally, policy sprawl can itself be a risk if operational systems are less mature than the public documents suggest. None of these points amount to evidence of present distress. Instead, they define the main areas where a late-stage private engineering company can disappoint: a few key accounts matter too much, talent costs move faster than pricing, acquisitions underdeliver, or reporting readiness lags capital-markets ambition. Those risks are manageable, but only with unusually disciplined
    execution by management and tight operating review mechanisms. Public investors will demand that discipline consistently.'
