- id: risk-people
  title: Talent and culture risk look manageable but not fully transparent
  body: Quest’s people story is mixed in the way many scaled private companies are mixed. Officially, Quest reports 23K+ employees, highlights women-in-engineering initiatives, and cites Great Place To Work recognition. External signals are thinner and less flattering. Revelio Labs estimates a much larger 2026 workforce than Quest publicly states, which raises methodology or disclosure-reconciliation questions. Teamblind shows only a small review base and a middling score, while Breakroom has almost no review depth. These are weak data points, but they still show that independent employee signal around Quest is not especially deep. That matters because engineering-services economics depend on talent retention, managerial consistency, and the ability to scale specialized teams without culture drift. The current evidence does not prove a people problem, yet it does leave room for attrition, wage pressure, or integration risk to surprise investors. It is a monitorable risk, not a closed issue
    for investors today externally.
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
