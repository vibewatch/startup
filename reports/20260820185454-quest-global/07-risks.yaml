company:
  name: Quest Global
chapter:
  number: 7
  title: Risks
  summary: 'Quest Global’s risk profile is defined less by a single acute red flag than by a stack of disclosure, concentration, talent, and execution uncertainties typical of a private engineering-services company approaching public-market readiness. The positive side is visible: formal privacy notices, ethics language, supplier-code materials, ESG commitments, workforce initiatives, and a 2026 board expansion all indicate institutionalization. The negative side is equally clear: public financial disclosure remains thin, customer concentration remains unknown, workforce data are inconsistent across sources, and external employee-signal sources are sparse. The key diligence judgment is that Quest looks governable and likely resilient, but still materially under-disclosed for the valuation it is seeking to support.'
sections:
- id: risk-disclosure
  title: Disclosure and governance risk remain the primary underwriting concern
  body: 'The single biggest risk in the public record is disclosure insufficiency rather than proven operating failure. Quest has a fresh valuation anchor, a reported IPO path, and improving governance optics, yet investors still lack audited public group financials, clear customer concentration data, margin visibility, and consolidated entity transparency. The February 2026 Reuters interview and related coverage are useful, but they do not substitute for prospectus-grade reporting. Board expansion helps: adding four independent directors and moving to a 12-member board signals institutionalization ahead of an IPO. Even so, governance progress and disclosure depth are not the same thing. Until the company publishes fuller financial statements and sharper ownership or operating metrics, the main investment risk is that the valuation is moving faster than public diligence evidence. That can quickly change investor sentiment if equity markets turn less forgiving. This remains the central underwriting
    bottleneck and the main reason diligence should remain skeptical today.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
