company:
  name: Quest Global
chapter:
  number: 4
  title: Financials
  summary: Quest Global has enough public evidence to anchor scale, funding momentum, and likely revenue streams, but not enough to underwrite margins, cash conversion, or capital efficiency with high confidence. Reuters put last-year revenue at $1.1B and management’s five-year target at $2.5B; February and May 2026 deal coverage shows capital coming in ahead of a potential IPO; and the India operating-entity profile offers one additional but incomplete lens on local revenue and capital structure. The chapter-level judgment is that Quest looks like a sizeable and still-growing engineering-services company, yet one whose valuation requires much more economic disclosure than the public record currently supplies.
sections:
- id: financial-revenue
  title: Revenue base, streams, and headline growth path
  body: 'The strongest public financial anchor for Quest Global comes from Reuters: management said revenue rose to $1.1B last year and could reach $2.5B over the next five years. That single data point matters because it places Quest well beyond emerging-company scale and broadly in line with listed engineering peers rather than startup comparables. The official services stack then helps explain where that revenue likely comes from: mechanical and embedded product engineering, software platform work, silicon engineering, testing, sustenance, operations and supply chain, and manufacturing or aftermarket support. This is likely a blended book of project revenue, managed-services revenue, and recurring lifecycle support rather than a pure consulting mix. The missing piece is composition. No public source in the retained set breaks revenue by vertical, geography, customer concentration, or contract model, so the topline is usable, but the quality of that topline remains only partially visible.
    That limitation should stay front of mind.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
