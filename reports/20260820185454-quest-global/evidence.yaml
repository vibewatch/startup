evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: Exact fully diluted ownership, board-rights, and share-class terms after the Hillhouse deal.
    whyItMatters: >-
      The valuation headline is less useful without governance rights, liquidation preferences, and founder-control
      mechanics.
    diligencePath: Obtain current cap table and shareholder rights schedule from management or IPO draft.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited group-level revenue by segment, margin, EBITDA, cash, and leverage.
    whyItMatters: Company overview can establish scale and fundraising but cannot alone prove economic quality.
    diligencePath: Request consolidated audited financials or draft prospectus financial section.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: entity-reconciliation
    missingEvidence: Reconciliation between the India operating entity filing and the global group narrative.
    whyItMatters: Entity-level Indian disclosures may not map one-to-one into group-level economics or headcount.
    diligencePath: Map legal entities, intercompany structure, and revenue attribution in diligence.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO003
      - TO004
  - type: missing-source
    severity: material
    topic: market-share
    missingEvidence: Quest-specific market-share and vertical-revenue split data.
    whyItMatters: A strong TAM case does not automatically reveal whether Quest is over- or under-indexed to the best subsectors.
    diligencePath: Request sector mix, top-vertical revenue, and backlog disclosures from management.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: Customer and program-level data needed to size Quest’s realistic SAM and SOM by vertical.
    whyItMatters: >-
      Without account concentration and win-rate data, valuation must rely on broad market growth rather than
      company-specific capture math.
    diligencePath: Build SAM/SOM using customer mix, delivery capacity, and win-rate evidence in the data room.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
      - TM003
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-map
    missingEvidence: Named buyer-role examples by vertical and geography.
    whyItMatters: The current buyer map is structurally correct but still broad.
    diligencePath: Request case studies or pursuit examples naming the engineering owner, payer, and deployment scope.
    relatedQuestionRefs:
      - QM016
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: peer-margin-comparison
    missingEvidence: Peer-normalized Quest margin, utilization, and revenue mix metrics.
    whyItMatters: Relative scale is knowable, but relative quality is not without private company unit economics.
    diligencePath: >-
      Request management P&L by vertical, utilization, attrition, and top-account contribution against public-peer
      benchmarks.
    relatedQuestionRefs:
      - QP024
      - QP025
    relatedTableRefs:
      - TP001
      - TP003
  - type: missing-source
    severity: minor
    topic: pricing-detail
    missingEvidence: Named Quest deal structures or customer-level pricing constructs comparable with listed peers.
    whyItMatters: Public service language suggests outcomes and managed services, but not enough to benchmark actual packaging.
    diligencePath: Obtain SOW examples, pricing models, and managed-services contracts in diligence.
    relatedQuestionRefs:
      - QP016
      - QP017
    relatedTableRefs:
      - TP003
