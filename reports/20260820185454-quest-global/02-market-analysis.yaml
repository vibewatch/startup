    - TM003
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: Customer and program-level data needed to size Quest’s realistic SAM and SOM by vertical.
    whyItMatters: Without account concentration and win-rate data, valuation must rely on broad market growth rather than company-specific capture math.
