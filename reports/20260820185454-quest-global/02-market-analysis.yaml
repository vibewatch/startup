    whyItMatters: A strong TAM case does not automatically reveal whether Quest is over- or under-indexed to the best subsectors.
    diligencePath: Request sector mix, top-vertical revenue, and backlog disclosures from management.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
