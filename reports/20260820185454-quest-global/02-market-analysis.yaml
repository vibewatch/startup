- id: market-drivers
  title: Growth drivers, constraints, and structural risks
  body: The market is attractive, but not frictionless. The same reports that support the growth case also identify the pressure points. Nasscom emphasized AI industrialization, GCC expansion, and the conversion of services into productized platforms. Mordor pointed to semiconductor incentives, digital-twin adoption, and defense localization as demand drivers, but also flagged wage inflation, attrition, data-security concerns, and explainability hesitancy in regulated industries. For Quest specifically, these constraints matter because they can squeeze margins before they stop top-line growth. In a sector where clients increasingly want outcome-based or risk-sharing contracts, an engineering-services firm must keep domain experts billable, invest in AI and cyber tooling, and still protect its delivery economics. The result is a market that is structurally good for capable firms, but even strong firms can underperform if utilization, skill mix, or compliance execution slip. This is why market
    quality alone cannot substitute for overall delivery, retention, pricing, and execution diligence discipline.
