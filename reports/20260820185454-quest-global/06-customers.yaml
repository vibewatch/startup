- id: customer-proof
  title: Named reference accounts show real embedment in aerospace and connected-product workflows
  body: The strongest named customer proof is in aerospace. Airbus-related releases show Quest as a preferred supplier in manufacturing and later as part of the EMES3 strategic-supplier program with Derichebourg. The Pratt & Whitney release shows a relationship dating back to 2002 and says more than 400 professionals supported the customer across product development, manufacturing engineering, aftermarket, testing, and purchase-order management. Andretti Formula E broadens the evidence into modern motorsport data operations and future vehicle development, including support for remote race operations and the GEN4 car program. These are not lightweight logo placements; they indicate operational embedment in customer processes. The common thread is that Quest is being trusted with high-consequence engineering, operations, and lifecycle tasks rather than superficial digital experiments. Public proof is limited in count but strong in depth. The reference set is curated, yet materially impressive
    for diligence.
  claimRefs:
  - CU010
  - CU011
