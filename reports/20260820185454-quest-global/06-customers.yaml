company:
  name: Quest Global
chapter:
  number: 6
  title: Customers
  summary: 'Quest Global’s customer evidence supports a strong thesis around blue-chip, long-cycle industrial relationships rather than a broad SMB or transactional customer base. Official materials repeatedly emphasize work with top-10 enterprises across major verticals, and the clearest named proofs center on Airbus, Pratt & Whitney, Andretti Formula E, medical-imaging sustainment, and connected industrial devices. The operating implication is favorable: Quest appears embedded in demanding workflows where engineering continuity matters. The caution is equally clear: public evidence does not disclose customer concentration, contract economics, renewal rates, or the exact commercial scale of named accounts. This looks like a high-quality reference base with incomplete economic visibility.'
sections:
- id: customer-base
  title: Quest’s customer base appears concentrated in large OEMs and hard-industry enterprises
  body: 'Quest Global’s public materials consistently frame the company as a partner to leading enterprises in aerospace, energy, industrial, medtech, semiconductors, and adjacent sectors. The home page says Quest works for many of the top 10 companies in each major industry it serves, while the industry and services pages reinforce a focus on mission-critical engineering rather than small, transactional software projects. That matters because it suggests a customer base dominated by large OEMs, platform owners, and industrial operators with long qualification cycles and meaningful switching costs. It also means customer quality is likely high even if customer concentration risk may also be high. The named public references are selective rather than exhaustive, but they point in the same direction: Quest wins where domain trust, lifecycle accountability, and engineering depth matter more than low-cost generic outsourcing. That is usually a healthier customer mix than generic volume outsourcing.
    It also likely lengthens sales cycles but improves defensibility once programs are won over time globally.'
