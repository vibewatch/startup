- id: customer-outcomes
  title: Case studies imply stickiness and cross-sell potential, but public economics remain hidden
  body: Quest’s case studies suggest customer value extends beyond initial engineering design work. The MRI example emphasizes sustaining 8,000+ installed systems while freeing the client to focus on next-generation development. The connected cash-safe example combines hardware, software, cloud, and field-service enablement into a broader operating model that improved efficiency and reduced maintenance costs. Formula E highlights analytics and workflow modernization tied to racing operations. These examples imply a customer strategy that starts with engineering depth and expands into sustainment, productivity, and digital operations. If that model is consistent across the portfolio, it should improve retention and account expansion potential. The problem is that public sources do not reveal whether these proofs are typical, how large the associated contracts are, or how much revenue comes from a small number of such complex relationships. That makes account quality easier to see than account
    economics. It also leaves cross-sell breadth largely inferential from public materials alone today.
  claimRefs:
