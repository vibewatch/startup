- id: customer-risks
  title: Customer quality looks attractive, but the biggest diligence gaps are concentration and renewal economics
  body: From a diligence standpoint, Quest’s customer story is appealing but incomplete. Blue-chip customer names, long-duration engineering scopes, and regulated verticals all argue for better account quality than a generic staffing vendor would have. At the same time, those same characteristics raise classic concentration questions. A company with large aerospace, industrial, or medtech accounts can look high quality while still being overly exposed to a few programs, platforms, or procurement cycles. Public evidence does not disclose top-customer contribution, churn, revenue retention, backlog, or win-loss rates. Nor does it show the balance between engineering-design work, aftermarket support, manufacturing assistance, and digital follow-on services within named accounts. The right conclusion is that Quest likely has strong customer credentials, but the economic durability of those credentials still requires private diligence. This is a quality-rich but disclosure-thin customer story.
    That asymmetry should shape underwriting priorities, scenario analysis, and management diligence requests.
