- id: valuation-relative
  title: Relative scale and peer framing make the valuation plausible but not self-evident
  body: 'A $4.5B value looks plausible only because Quest is already a scaled company, not because public evidence proves exceptional economics. Reuters’ $1.1B revenue anchor places Quest above Cyient DET, below EPAM, and roughly in the same broad late-stage engineering cohort as LTTS by topline order of magnitude. The company’s hard-industry concentration, semiconductor positioning, and long-duration customer relationships argue for quality above a generic outsourcing multiple. But public peers also show what Quest has not yet disclosed: margins, cash flow, segment mix, and more consistent investor communication. Relative scale therefore supports a serious valuation conversation, yet relative transparency still argues for caution. Put differently, the revenue base makes the valuation thinkable; the disclosure gap prevents it from being obviously deserved. That is the central relative-value tension. Scale explains the conversation; transparency determines conviction far more for investors
    allocating real capital today.'
