company:
  name: Quest Global
chapter:
  number: 8
  title: Valuation
  summary: 'Quest Global’s February 2026 transaction created a real late-stage valuation anchor: roughly $4.5B at about a 5% stake according to multiple Indian business outlets, with management later telling Reuters revenue was about $1.1B and could reach $2.5B in five years. On simple public math, that implies about 4.1x trailing revenue, which is a serious but not obviously extreme multiple for a scaled engineering platform with semiconductor momentum, blue-chip customers, and IPO optionality. The key caveat is that almost every variable needed to defend a premium multiple beyond that headline remains under-disclosed. Quest’s valuation case is therefore credible, but still more narrative-supported than fully underwritten.'
sections:
- id: valuation-anchor
  title: The Hillhouse deal provides the main current valuation anchor
  body: 'Quest Global’s public valuation story starts with the February 2026 Hillhouse transaction. Officially, Quest disclosed a minority investment comprising both primary capital and secondary share sales. Multiple press reports then triangulated the economic terms at roughly a 5% stake and an implied enterprise value of about $4.5B. Reuters followed days later with management commentary that revenue had reached $1.1B in the prior year and that the company was considering an India IPO after a reverse flip. Those three pieces together create a usable valuation frame: a real private-market mark, a current revenue anchor, and a public-markets path that could test the mark again. The crucial point is that the valuation exists in the market, but the supporting disclosure remains incomplete. Investors can reference the mark, but not yet fully underwrite it. That distinction should govern how much weight the anchor carries in any memo or committee discussion before an IPO filing appears publicly.'
  claimRefs:
  - CV001
  - CV002
  - CV003
