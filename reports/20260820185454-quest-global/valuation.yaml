- id: valuation-upside
  title: Upside depends on growth conversion, semiconductor momentum, and IPO readiness
  body: The public upside case has three parts. First, management’s five-year revenue target of $2.5B implies a credible growth runway if Quest can convert aerospace, industrial, medtech, and semiconductor demand into large multi-year programs. Second, semiconductor expansion via BITSILICA, silicon engineering capability, and multiple 2026 ISG recognitions could support a higher-quality perception than plain legacy engineering outsourcing. Third, an India IPO and reverse-flip process could unlock fuller disclosure, broader investor participation, and potentially a stronger public-market multiple if the financials hold up. The challenge is that each upside pillar still depends on execution. Revenue ambition is not the same as bookings, capability expansion is not the same as profitable scale, and IPO optionality is not the same as IPO success. Investors can see the path, but not yet the proof. That upside therefore deserves probability-weighting, not blind acceptance. Narrative strength alone
    cannot close the valuation gap without numbers or margins in the filing and prospectus.
  claimRefs:
