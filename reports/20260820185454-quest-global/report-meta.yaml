companyProfile:
  summary: Quest Global is a late-stage private engineering-services company founded in 1997 that positions itself as an independent pure-play product-engineering partner for hard-engineering industries. The company is headquartered in Singapore, has deep operating roots in India, employs 23K+ people across 20 countries and 104 centers, and serves aerospace, energy, medtech, industrial, semiconductor, automotive, and rail customers. Public reporting in February 2026 tied the Hillhouse minority investment to an implied valuation of about $4.5B and to management commentary that revenue reached roughly $1.1B with a five-year target of $2.5B.
  foundedDate: '1997-01-01'
