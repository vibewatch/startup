  topStrengths:
    - 23K+ employee scale across 20 countries and 104 centers supports delivery credibility for global OEM programs.
    - Customer quality is unusually strong for a private engineering-services company, with named exposure to aerospace, energy, medtech, and industrial leaders.
    - February 2026 Hillhouse investment provides a fresh third-party valuation anchor around $4.5B rather than a stale funding mark.
    - Semiconductor capability expansion via BITSILICA and multiple 2025-2026 industry recognitions support relevance beyond legacy mechanical outsourcing.
    - India IPO optionality could materially improve disclosure quality and public-market comparability.
  topRisks:
    - Consolidated public disclosure on margins, cash flow, backlog, and customer concentration remains limited.
    - The $4.5B mark implies a meaningful revenue multiple that still relies partly on narrative quality rather than fully public economics.
    - Customer mix leans toward long-cycle industrial and aerospace programs, which can create program concentration and slower correction if demand weakens.
    - Workforce scale disclosures are directionally strong but not perfectly reconciled across official and third-party sources.
    - A future IPO could price below the private mark if investors apply an opacity discount.
  unresolvedGaps:
    - Consolidated audited gross margin, EBITDA, and free cash flow disclosure.
    - Customer concentration, retention, and backlog metrics at group level.
    - Segment or vertical revenue mix showing how much value is driven by semiconductor and higher-complexity work.
    - Clear ownership table after Hillhouse and any follow-on minority transactions.
    - IPO filing timeline and the extent of reverse-flip completion.
