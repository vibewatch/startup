  headquarters: Singapore, with major operations in India
  productSummary: Quest Global sells outsourced engineering and R&D services spanning software, embedded, silicon, mechanical, testing, and lifecycle support for complex industrial and regulated products.
  customerFocus: Large global OEMs and industrial enterprises in aerospace, defense, energy, industrial, medtech, semiconductor, automotive, and rail.
  businessModel: Project-based and managed-services engineering revenue, monetizing domain-specific engineering labor, lifecycle ownership, and digital-transformation programs.
  stage: Late-stage private / pre-IPO
  fundingStatus: Minority investment from Hillhouse announced in February 2026 at an implied valuation around $4.5B, with an India IPO and reverse-flip process under consideration.
