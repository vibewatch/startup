- id: market-policy-and-geopolitical-shocks
  title: Market, Policy, and Geopolitical Shock Risks
  body: The external market has stopped looking like a one-way tailwind. TrendForce says global NEV sales fell year over year in 1Q26 and that China underperformed; Infineon says customers are still digesting inventory and that slower electromobility growth forced forecast cuts; onsemi explicitly describes a market downturn; and ST is simultaneously reshaping its footprint around 200mm SiC while resizing cost base. For AscenPower this matters in two ways. First, the company’s public positioning is concentrated in exactly those automotive and industrial power markets, so it does not have an obvious buffer if EV-related programs pause or reprice. Second, geopolitical and policy dependencies are real. BIS says the October 2023 control update included semiconductor-manufacturing-equipment restrictions and entity-list additions tied to China. Public local-government and investor materials also show that AscenPower’s buildout is deeply embedded in Guangdong’s industrial-policy push and state-backed
    capital network. That mix can be helpful in good conditions, but it also means the company is exposed both to external controls and to the continued willingness of policy sponsors to support heavy capex through a volatile market window.
