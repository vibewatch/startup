  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-and-concentration-disclosure
    missingEvidence: Named automotive SOP customers, top-customer share, and recurring revenue split between sample work, industrial shipments, and automotive programs.
    whyItMatters: Without named customer and concentration data, public customer counts do not reveal whether demand is durable or dangerously concentrated.
    diligencePath: Request a customer bridge that separates tape-out, sample, industrial batch, and automotive SOP revenue and shows top-5 exposure.
    relatedQuestionRefs:
    - QR008
    - QR010
    - QR031
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: eight-inch-pilot-and-yield-evidence
    missingEvidence: Tool-install dates, pilot-run yield, scrap trend, and customer qualification milestones for the reserved 8-inch line.
    whyItMatters: The 8-inch roadmap is central to the scaling narrative, but current public evidence does not show qualified output or even a dated pilot sequence.
    diligencePath: Request an 8-inch project plan with equipment list, install status, pilot wafer results, and first customer qualification target dates.
    relatedQuestionRefs:
    - QR005
    - QR031
    relatedTableRefs:
    - TR002
    - TR005
  - type: access-blocked
    severity: material
    topic: first-party-process-documentation
    missingEvidence: Readable first-party manufacturing, process-platform, and product pages from AscenPower’s own website or an equivalent PDF pack.
    whyItMatters: The chapter can validate third-party and partner claims, but inaccessible first-party technical pages keep key manufacturing and product assertions one step less auditable.
    diligencePath: Ask management for a mirrored site export, product catalog, or process-platform presentation that can be reviewed without firewall blocks.
    relatedQuestionRefs:
    - QR025
    - QR031
  - type: missing-source
    severity: material
    topic: imported-tool-and-material-exposure
    missingEvidence: Critical-tool list, country-of-origin map, and any export-license dependencies for deposition, metrology, implant, or other constrained manufacturing steps.
    whyItMatters: BIS equipment-control risk is only underwritable when investors know which steps rely on imported tools, software, or process IP.
    diligencePath: Request a red-yellow-green map of restricted tools, replacement options, and current license or localization status.
    relatedQuestionRefs:
    - QR021
    - QR031
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: quality-and-program-conversion
    missingEvidence: Program-level PPAP, AEC, customer audit, FIT/reliability data, and sample-to-SOP conversion rates.
    whyItMatters: Passing IATF16949 is helpful but not enough to prove that automotive customers are accepting the parts into production vehicles.
    diligencePath: Request PPAP packages, reliability dashboards, and a pipeline review by customer, platform, and expected SOP date.
    relatedQuestionRefs:
    - QR009
    - QR027
    - QR031
    relatedTableRefs:
    - TR002
    - TR004
    - TR005
