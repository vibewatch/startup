- id: fab-ramp-quality-and-execution
  title: Fab Ramp, Qualification, and Execution Risk
  body: 'The most immediate underwriting risk is not whether AscenPower has a factory; it is whether the current 6-inch factory can produce repeatable automotive-grade economics quickly enough to justify both the capital already committed and the public ambition around 8-inch scale. Multiple sources say the line reached line-through and mass-production stage, but the same sources still describe active capacity climb, process optimization, customer sample delivery, and qualification work that is not obviously complete. DRAMX is especially important because it frames the 8-inch line as reserved adjacent capacity rather than as a built and qualified output stream. Recruiting evidence points in the same direction: the company is still hiring for CVD, PVD, integration, CIM, manufacturing, and broader engineering roles that directly affect yield, throughput, and excursion control. In other words, AscenPower is already beyond paper-project risk but still inside scale-up risk. In SiC that distinction
    matters, because wafer diameter expansion does not solve the hard physics of crystal growth, defect control, or automotive reliability validation on its own.'
