chapter:
  number: 7
  title: Risks
  letter: R
  summary: 'AscenPower’s risk stack is dominated by capital intensity and timing: the company is trying to prove 6-inch automotive-grade commercialization, preserve customer leverage, and justify an 8-inch roadmap while the broader SiC market is digesting inventory, incumbents are scaling 200mm and defending cost, and Chinese OEMs are internalizing more SiC content. Public evidence supports a real fab ramp, real quality-system progress, and real financing support, but not yet named automotive SOP customers, transparent concentration data, or public 8-inch pilot proof. The cleanest thesis-break event is an 8-inch funding or capex push before the 6-inch line has converted public customer-count claims into named qualified production programs.'
sections:
- id: risk-framework-overview
  title: Risk Framework and Residual Severity Overview
  body: 'AscenPower’s risk profile is dominated by an uncomfortable sequencing problem: the company is trying to prove automotive-grade commercialization and fund a larger-diameter expansion while the external SiC market is digesting inventory, incumbents are defending cost position, and Chinese OEMs are learning to internalize more of the SiC stack. Public evidence is strong enough to say this is a real fab ramp with real payroll, real hiring, state-backed financing, and a line that has moved beyond construction. It is not strong enough to show that the 6-inch line has already translated into named automotive SOP revenue or that the 8-inch plan is anything more than a plausible adjacent expansion. That gap matters because the public capex narrative is measured in billions of renminbi while the visible financing and named customer evidence are still far narrower. Residual severity is therefore highest where those uncertainties interact: capital intensity without full transparency, customer
    concentration opacity during qualification, and an 8-inch roadmap that could arrive into a tougher pricing and demand window than the company’s fundraising story implies.'
