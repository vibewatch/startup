- id: mitigations-monitors-and-kill-criteria
  title: Mitigations, Monitoring Indicators, and Kill Criteria
  body: 'There are real mitigations. AscenPower has passed IATF16949, has a visible operating footprint, and has attracted a syndicate of state-backed and strategic investors rather than relying on a single narrative round. Those facts justify continued diligence. They do not justify ignoring the kill criteria. The first thesis-break signal is operational: if the 6-inch line’s 10,000-wafer-per-month and customer-count narrative does not convert into named qualified automotive programs, then the 8-inch story is arriving before the 6-inch story is bankable. The second thesis-break signal is market-timing: if peer indicators keep showing inventory digestion, demand softness, and aggressive incumbent cost-defense while AscenPower still needs fresh capital to finish scale-up, the company could push larger-diameter capex into a hostile pricing window. The right posture is therefore conditional support with hard monitors, not blind faith in sector growth. The next diligence cycle should focus on
    named customer mix, imported-tool exposure, actual pilot yield, and first-party process documentation.'
