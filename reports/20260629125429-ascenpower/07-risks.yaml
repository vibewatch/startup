- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk cluster
  - Monitorable trigger
  - Threshold or event
  - Action implication
  rows:
  - - 6-inch commercialization
    - Named automotive SOP disclosure
    - No named qualified automotive program by the time additional 8-inch capex is sought
    - Treat scale narrative as unproven and pause underwriting
  - - Customer concentration opacity
    - Customer mix disclosure
    - Management cannot separate top-customer share, sample customers, and recurring automotive programs
    - Assume concentration is high until disproven
  - - 8-inch timing risk
    - Pilot and tool-install evidence
    - No dated tool-install, pilot-yield, and customer-qualification milestones for 8-inch line
    - Do not credit 8-inch economics in base case
  - - External market pressure
    - Peer market signals
    - Continued inventory digestion, weak NEV demand, or new incumbent cost cuts during AscenPower fundraising
    - Raise required return and compress valuation tolerance
  notes: These kill criteria translate the chapter into concrete diligence checkpoints instead of generic caution.
