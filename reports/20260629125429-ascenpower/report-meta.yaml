  topStrengths:
    - >-
      Strong policy-backed capital base: the 2024 Series A brought approximately RMB1 billion from provincial,
      national, and strategic investors aligned with China's semiconductor self-sufficiency agenda.
    - >-
      Real manufacturing ambition, not slideware: public sources describe a line that went online in 2024,
      IATF16949 quality certification, and a 6-inch / 8-inch capacity plan that is unusually large for a young
      automotive-grade SiC startup.
    - >-
      Strategic fit with structural EV and power-electronics demand, especially as China continues to emphasize
      domestic SiC supply for high-voltage EV, industrial, grid, and photovoltaic use cases.
  topRisks:
    - >-
      Public financial opacity is severe: no reviewed source disclosed revenue, gross margin, cash balance,
      wafer yield, or runway, making outside valuation judgment highly uncertain.
    - >-
      Ramp execution is capital-intensive and technically unforgiving: 6-inch phase-one output must scale while
      the reserved 8-inch phase competes against incumbents already investing in 200mm SiC and broader supply chains.
    - >-
      Customer proof is still shallow in public: sources cite 10+ COT customers and 40+ signed/tape-out accounts,
      but do not name a clear set of mass-production automotive customers or completed verification programs.
    - >-
      Chinese OEMs are also verticalizing strategic SiC supply, raising the risk that some of the best downstream
      demand migrates in-house or toward tightly controlled ecosystem partners.
  unresolvedGaps:
    - >-
      Revenue, gross margin, cash balance, burn, and runway are not publicly disclosed, blocking price-sensitive
      underwriting.
    - >-
      Named mass-production customers, PPAP / automotive verification status, and actual revenue-bearing mix between
      sample, tape-out, and production programs remain unclear.
    - >-
      Full board composition, control rights, cap-table percentages, and liquidation preferences for the 2024 Series A
      are not public.
    - >-
      The public project-scale story still contains unresolved tension between RMB7.5B and RMB9B total-investment
      claims.
