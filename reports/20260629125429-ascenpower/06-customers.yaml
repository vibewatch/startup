chapter:
  number: 6
  title: Customers
  summary: AscenPower's public customer evidence is real but still cohort-based rather than account-based. Multiple 2023-2024 sources support a repeatable funnel—40+ signed tape-out customers, 10+ signed COT customers, multiple OEM sample-verification programs, and four customer-specific programs described as at or near mass production—yet no reviewed source names a mass-production automotive account or discloses retention, concentration, or renewal metrics. That leaves the customer thesis dependent on conversion from Chinese design-house and OEM validation activity into durable production wins before OEM vertical integration and cyclical EV demand pressure narrow the addressable pool.
sections:
- id: segment-map-and-buyer-structure
  title: Segment Map and Buyer Structure
  body: 'The public record points to a broader customer map than the startup''s sparse first-party site would suggest, but the segmentation is visible mainly through government, investor, and trade-media descriptions rather than through named case studies. Across those sources, AscenPower is repeatedly framed as serving automotive-grade and industrial-control buyers with SiC SBD/JBS, MOSFET, and sometimes IGBT devices for new-energy-vehicle main drive, industrial power, smart grid, and photovoltaic use cases. That implies at least four economically distinct customer cohorts: OEM and Tier-1 sample-verification programs that need qualified automotive-grade chips; SiC design houses or COT customers that need tape-out, wafer, and process access; industrial and PV power buyers that can adopt faster than car OEMs; and a smaller set of full-solution buyers if the company can sell chip-to-module capability via its parent ecosystem. The important caveat is that public evidence names segments and
    functions much more clearly than it names accounts or purchase volumes, so the chapter must separate segmentation proof from durable revenue proof.'
