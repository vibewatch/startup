tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Public use case
  - Evidence-backed strategic value
  - Main gap
  rows:
  - - OEM and Tier-1 vehicle programs
    - 'Buyer: OEM or Tier-1 inverter / drivetrain team; user: EV powertrain engineers; payer: vehicle platform owner'
    - Main-drive SiC chips for automotive qualification and sample verification
    - Multiple sources explicitly reference delivery to OEMs and sample-verification customers, making automotive qualification the clearest high-value segment
    - No named SOP customer, no platform names, and no disclosed production volumes
  - - COT / SiC design-house cohort
    - 'Buyer: fabless SiC design houses; user: chip-design teams; payer: signed COT accounts'
    - Tape-out, wafer access, and customer-spec product work
    - 40+ signed tape-out customers and 10+ signed COT customers are the strongest public breadth signal
    - No repeat-order data, pricing model, or named design-house logos disclosed
  - - Industrial power buyers
    - 'Buyer: industrial power-system firms; user: power electronics teams; payer: industrial equipment makers'
    - Industrial power supplies and industrial-control devices
    - Industrial-control positioning appears in nearly every company-adjacent profile and in 2023-2024 trade coverage
    - No named industrial customer or shipment cadence disclosed
  - - PV / smart-grid / charging buyers
    - 'Buyer: inverter, grid, and charging-platform companies; user: power-conversion teams; payer: system OEMs'
    - Photovoltaic generation, smart grid, and charging-adjacent power conversion
    - These end markets widen the funnel beyond vehicle programs and may have shorter qualification cycles than automotive
    - Public proof stops at application mentions; no named deployment or module reference is public
  - - Chip-to-module / full-solution buyers
    - 'Buyer: customers needing a module-ready stack; user: drivetrain or power-system integrators; payer: OEM or Tier-1 platform owner'
    - Source chip plus module or solution stack via parent-ecosystem integration
    - SDIC Venture Capital explicitly says the parent ecosystem can provide full chip-to-module solutions for downstream customers
    - No public catalog, module customer name, or attach-rate data shows how large this segment is
  notes: Segments are reconstructed from repeated application and customer-stage disclosures; they describe public evidence of who the company appears to target, not disclosed revenue mix.
