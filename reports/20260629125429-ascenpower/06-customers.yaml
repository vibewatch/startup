- id: public-adoption-funnel-and-proof-depth
  title: Public Adoption Funnel and Proof Depth
  body: AscenPower has more public adoption proof than a paper fab, but the evidence concentrates at the design-in, sample, and early-conversion stages rather than at fully named SOP scale. June 2023 sources say 1200V automotive-grade and industrial-control SiC chips were already being delivered to multiple OEMs and customers for sample verification, with more than 10 COT customers signed and a year-end plan for 10,000 six-inch wafers per month. By March 2024, additional trade reporting said 40-plus customers had signed for tape-out, covering most Chinese SiC design houses, while automotive-grade and industrial-grade chips had successfully taped out and been sampled and were nearing automotive verification. Several outlets also preserved the same four-program signal, but with slightly different wording—some say four customer-specific products were about to enter mass production, while another says four had already completed scale production. The conservative read is that public evidence
    supports four customer-specific programs at or near mass production, not a clean set of named volume accounts. That distinction matters because the funnel from 40-plus signed customers to zero named automotive SOP customers is the single clearest public view of how much conversion work still remains.
  claimRefs:
