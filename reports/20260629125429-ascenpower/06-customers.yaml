  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Public or diligence-room evidence of repeat orders, renewal behavior, or multi-program expansion by cohort.
    whyItMatters: Without repeat-order proof, customer counts could still represent one-time samples rather than durable revenue relationships.
    diligencePath: Request cohort history showing first sample date, first paid shipment date, and follow-on order count for the top ten customer programs.
    relatedQuestionRefs:
    - QU012
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Retention metrics such as NRR, GRR, churn, win-loss, satisfaction, or referenceability by customer segment.
    whyItMatters: Customer durability cannot be underwritten from sample-stage breadth alone; retention is the proof that a design-in becomes a recurring business.
    diligencePath: Ask management for segmented churn / retention metrics or, if too early for revenue cohorts, pipeline conversion and qualification attrition statistics.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Named top customers, revenue concentration, and geographic split of active programs.
    whyItMatters: A few concentrated automotive or design-house accounts could dominate near-term revenue and materially change bargaining power and downside risk.
    diligencePath: Obtain a customer concentration schedule covering top-1, top-3, and top-5 exposure plus China versus overseas program share.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-gap
    missingEvidence: At least one named mass-production automotive, industrial, or PV customer with deployment scope, timing, and outcome.
    whyItMatters: The current proof file is cohort-based; even one named production account would materially improve confidence in conversion and reference quality.
    diligencePath: Ask for permission to reference a named SOP account or at minimum anonymized but auditable customer case details with shipment timing.
    relatedQuestionRefs:
    - QU006
    - QU025
    relatedTableRefs:
    - TU003
