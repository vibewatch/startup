- id: durability-metrics-and-procurement-friction
  title: Durability Metrics and Procurement Friction
  body: 'Durability evidence is where the customer file becomes thin. Public sources do support one useful procurement milestone: AscenPower''s IATF16949 quality-management certification is described by government and investor sources as covering product R&D, procurement, production, inspection, and after-sales, which is exactly the kind of systems evidence automotive buyers expect before deeper qualification work. But that milestone should not be confused with commercial durability. No reviewed source discloses renewal rates, churn, NRR, GRR, contract length, repeat-order ratios, or customer satisfaction data, and none publishes PPAP timing, AEC-style reliability details, or a named SOP award. The result is a customer story that looks credible for sampling and qualification entry, yet still opaque on conversion speed and repeat economics. For underwriting, procurement friction is therefore not a theoretical issue: the public record itself shows the company still moving through the gates
    between sample delivery, automotive verification, customer-specific qualification, and visible multi-program production accounts.'
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU042
  - CU044
