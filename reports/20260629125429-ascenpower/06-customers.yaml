- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Public evidence
  - Impact on customer durability
  - Implication
  - Diligence path
  rows:
  - - Land-and-expand from sample to SOP
    - OEM sample-verification and four customer-specific programs at or near mass production
    - Positive if conversion completes, but still unproven publicly
    - The best upside path is conversion of current validation cohorts into recurring named accounts
    - Ask for qualification funnel by stage, PPAP timing, and 12-month conversion rate
  - - Opaque top-customer concentration
    - No disclosed revenue split, top-customer share, or active account denominator beyond cohort counts
    - Could hide a very concentrated revenue base once production starts
    - Customer concentration risk cannot be priced from public materials today
    - Request top-5 customer share and dependence on any single OEM / design house
  - - Domestic-market concentration
    - 40+ signed tape-out customers reportedly cover most domestic SiC design houses and later sources still discuss market expansion rather than existing global diversity
    - High exposure to Chinese EV and industrial cycles
    - China concentration could help early adoption but raise cyclicality and pricing pressure
    - Request customer mix by China vs overseas and by auto vs industrial
  - - OEM vertical integration
    - BYD and Li Auto are moving deeper into in-house SiC / semiconductor capability
    - Shrinks the available external supplier pool and weakens bargaining power
    - Independent fabs must win where OEMs do not fully internalize SiC
    - Ask management for target-account list segmented by captive vs non-captive OEM ecosystems
  - - System-level co-design with large IDMs
    - Geely-onsemi collaboration shows earlier OEM / supplier integration around 900V platforms
    - Could pull value toward large IDMs or co-design partners rather than standalone fabs
    - AscenPower may need module or solution-layer relevance, not only wafer capacity
    - Request evidence of design support, module attach, or preferred-supplier status
  notes: The table separates conversion upside from structural risks that could cap durable customer value even if public cohort counts keep growing.
