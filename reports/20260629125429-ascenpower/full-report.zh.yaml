      - number: '8.2'
        title: 公开同业波动让收入不透明更危险，而不是更不危险
        blocks:
          - type: paragraph
            body: >-
              可比的上市 SiC 公司让承销问题更清楚。上市同业通过业绩公告、年报或投资者关系档案披露信息；这些披露显示，即便底层技术逻辑仍成立，这一类别的估值也可能剧烈波动。onsemi 报告 2024 年收入下滑，并称
              2025 年充满不确定性。CompaniesMarketCap 的 ST 收入历史页同样显示，收入从 2024 年约 $13.27 billion 降至 2025 年 $11.80 billion，到 2026
              年 6 月 TTM 仅部分恢复至约 $12.37 billion。CompaniesMarketCap 的 Infineon 收入历史页显示，收入从 2023 年约 $17.42 billion 降至 2024
              年 $15.82 billion，随后按 2026 年 6 月滚动十二个月口径恢复至约 $17.18 billion。ST 启动制造足迹重置，但仍优先布局 200mm
              SiC；这提醒投资者，即便已经规模化的既有厂商，在终端需求和回报摇摆时也必须调整成本基数。Infineon、ST、onsemi、ROHM 和 Wolfspeed 都提供实时市值锚点，分化很大：2026 年 6
              月，Infineon 高端约 $117 billion，而 Wolfspeed 约 $2.4 billion；Macrotrends 显示 Wolfspeed 在 2026 年早些时候低至约 $0.41
              billion。SemiconductorX 解释了这对一家私营外售供应商为何重要：200mm 转换仍是近期成本和吞吐量的关键变量，而中国规模化和 Wolfspeed
              重组说明，叙事可以很快从稀缺溢价转向供给过剩和融资压力。在这种背景下，AscenPower 的不透明应被折价，而不是被忽略。
