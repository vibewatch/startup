      - number: '3.4'
        title: 国内相邻玩家与替代方案扩大竞争场
        blocks:
          - type: paragraph
            body: >-
              中国竞争场比一张纯商用 SiC 同行名单更宽。SemiconductorX 把 SICC 识别为重要的全球 SiC 衬底供应商，把 BYD 识别为服务自身 EV 的自用生产方；Li Auto 有 Sanan
              支持的模块项目，则显示器件供给和 OEM 集成可能汇合。Sanan IC 和 Silan 的公开英文页面指向不同方向：Sanan 英文网站强调化合物半导体和 RF 前端制造，Silan
              则突出更宽的功率器件栈，包括用于工业和家电场景的 IPM、IGBT、MOSFET 和栅极驱动。这使得这些公司成为重要的竞争相邻项，即便它们并非与 AscenPower
              完全一一对应。它们仍能影响定价、国内采购偏好，以及客户混用本土供应商、代工伙伴和替代架构的意愿。本轮对 CanSemi 和 SICC
              下游器件路线图的公开证据，弱于一线既有厂商，因此它们应放入观察名单；但核心竞争结论已经成立：AscenPower 置身于密集的国内生态，而不是只在自己和五个西方名字之间的真空中竞争。
