            body: >-
              公开记录指向的客户地图，比这家初创公司稀疏的一手网站所暗示的更宽，但分层主要来自政府、投资方和行业媒体描述，而不是具名案例研究。这些来源反复把 AscenPower 描述为服务车规级和工业控制买方，提供 SiC
              SBD/JBS、MOSFET，有时也包括 IGBT 器件，面向新能源汽车主驱、工业电源、智能电网和光伏场景。这至少暗示四类经济上不同的客户群：需要合格车规级芯片的 OEM 和 Tier-1
              样品验证项目；需要流片、晶圆和工艺接入的 SiC 设计公司或 COT 客户；采用速度可能快于汽车 OEM 的工业和 PV
              电力买方；如果公司能借母生态销售芯片到模块能力，还会有一小类全方案买方。关键限制是，公开证据对细分和功能的命名远比对账户或采购量清楚，因此本章必须把分层证明与耐久收入证明分开。
