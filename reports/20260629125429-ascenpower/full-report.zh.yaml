          description: 公开来源提到 40+ 家已签约流片客户，以及向 OEM 和客户交付样品验证。
        - id: n4
          label: 认证和客户专属项目工作
          description: IATF16949 和客户专属项目措辞指向结构化采购与认证阶段，而不是只做 logo 营销。
        - id: n5
          label: 重复生产账户
          description: 这是公开缺失的一步：已审阅来源没有具名量产车规账户，也没有发布持久重复订单证据。
    approximationNotes: 旅程图描述的是已审阅来源隐含的公开转化路径；它不披露内部销售阶段或赢单率。
