      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图按平台项目分层，而不是按泛半导体需求分层。在 EV 中，经济买方通常是 OEM 车型平台或一级逆变器 / 模块伙伴，用户则是电力电子工程团队，要在 800V
              或更高电压架构上证明续航、热管理和充电收益。可再生能源和储能领域，买方通常是 PV 逆变器或功率转换系统厂商的产品线负责人，应用工程师是用户，P&L
              负责人是付款方。工业驱动和其他功率转换项目对价格更敏感，往往只有在效率、热密度或形态收益明确超过成本时才采用
              SiC。采用路径也不同于软件式销售：收入放量前，design-in、模块验证、汽车认证和锁定产能配额都很关键。这就是为什么 Nio、Li Auto、Zeekr 和 Qingchun
              是有用的市场证据：它们说明买方越来越把 SiC 视为平台关键的供应链选择，而不是商品化零部件采购。
