  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 明确估值锚点存在，但锚的是里程碑，不是经济性
        blocks:
          - type: paragraph
            body: >-
              AscenPower 确实有真实的公开估值锚点；只是这些锚点不能让投资者很有把握地承销内在价值。2024 年 Series A 约 RMB1 billion 已得到充分交叉印证；36Kr
              又给出最强的明确价格标记，报道称投前估值 RMB6 billion、投后估值超过 RMB7 billion。随后 Hurun 给出第二个公开框架：将独角兽定义为估值至少 US$1 billion 的私营公司，并把
              AscenPower 列入广州 2025
              年独角兽新面孔。这些事实重要，因为它们说明公司并不是按无名晶圆厂项目来估值。但它们仍没有回答投资者最关键的问题：在这个价格上，究竟已经证明了什么样的现金生成业务？公开记录在里程碑证据上远强于经济性证据。注册资本、土地、项目预算、客户数量说法、一二期产能规划都可见；实际出货、ASP、利润率、良率、在手订单质量和优先股权利堆栈都不可见。因此，正确姿态是价格纪律，而不是无条件兴奋。当前估值标记未来或许能被证明合理，但公开收入质量披露还没有证明这一点。
