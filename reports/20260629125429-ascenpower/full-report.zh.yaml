        title: 领导层、股东与治理缺口
        blocks:
          - type: paragraph
            body: >-
              可见的领导层图谱比公司的制造叙事更薄。公开登记材料显示徐伟为法定代表人，开放网络二级来源则称肖国伟为董事长。企查查显示的股东栈包括广东芯聚能半导体和 Viridi E-Mobility Technology
              (Ningbo)；百度百科英文条目进一步把 Viridi 与 Geely 关联，并称其持股 40%。这个与 Geely 相邻的产业连接，对尽调有方向性意义，因为它说明公司并不是脱离中国 EV
              供应链独立诞生。即便如此，公开来源没有披露完整董事会、独立董事设置、清算栈，或 2024
              年融资附带的治理权。对投资人来说，公开记录对产业协同的支持强于对实际控制权的支持。因此，治理图景仍是风险投资式、不透明的，还达不到公众公司级别。
