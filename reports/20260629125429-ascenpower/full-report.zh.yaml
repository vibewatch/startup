  - id: FR003
    title: 关键依赖地图
    type: dag
    layout: standard
    summary: AscenPower 的爬坡依赖质量、工艺人才、一手透明度和 8 英寸纪律一起过关。
    data:
      nodes:
        - id: d1
          label: 6 英寸晶圆厂产出
          description: 当前产线必须维持可销售的车规产出。
        - id: d2
          label: CVD / PVD 工艺控制
          description: 薄膜稳定性和良率工程仍是活跃招聘需求。
        - id: d3
          label: 整合 / CIM 栈
          description: 工艺整合、自动化和设备接口驱动可重复性。
        - id: d4
          label: IATF16949 质量体系
          description: 全生命周期职能已有基础质量治理。
        - id: d5
          label: 具名车规项目
          description: 公开证明必须从样品转成可识别的 SOP 项目。
        - id: d6
          label: 8 英寸扩产纪律
          description: 二期资本开支应跟随而不是先于可融资的 6 英寸证明。
        - id: d7
          label: 一手工艺披露
          description: 投资人仍需要可获得的产品和制造文件。
      edges:
        - from: d2
          to: d1
          label: 稳定良率
        - from: d3
          to: d1
          label: 驱动可重复性
        - from: d4
          to: d5
          label: 支撑认证信任
        - from: d1
          to: d5
          label: 供应合格晶圆
        - from: d5
          to: d6
          label: 应证明下一轮资本开支合理
        - from: d7
          to: d5
          label: 降低尽调摩擦
        - from: d4
          to: d6
          label: 必须转移到更大尺寸
    claimRefs:
      - CR009
      - CR010
      - CR012
      - CR014
      - CR018
      - CR019
      - CR031
      - CR043
      - CR044
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 投资判断同时受真实私募估值、真实工业进展，以及同样真实的披露和周期缺口影响。
    data:
      nodes:
        - id: n1
          label: 国资背景融资与独角兽叙事
          detail: RMB1B 融资、RMB6B 投前估值、>RMB7B 投后估值和胡润认可，形成一个可见的私募估值锚。
          tone: positive
        - id: n2
          label: 工业证明点
          detail: 6 英寸产出目标和客户管线说法表明，公司不只是纸面项目。
          tone: positive
        - id: n3
          label: 披露缺口
          detail: 公开资料仍未披露出货量、ASP、利润率、良率、债务或清算优先权。
          tone: warning
        - id: n4
          label: 同业波动
          detail: onsemi 对下行周期的评论、ST 重组、Wolfspeed 估值压缩，都说明 SiC 情绪重置可以很快。
          tone: warning
        - id: n5
          label: OEM 与既有厂商压力
          detail: AscenPower 完全商业化之前，200mm 领先厂商和 OEM 自研 SiC 模块可能先侵蚀外售市场上行空间。
          tone: warning
        - id: n6
          label: 建议：继续研究
          detail: 保持跟进，但在把当前估值视为有吸引力之前，需要看到更好的经济性或更低的价格。
          tone: neutral
      edges:
        - from: n1
          to: n2
          label: 资本支撑扩产
        - from: n2
          to: n3
          label: 证据止步于经济性之前
        - from: n3
          to: n6
          label: 不透明阻断买入结论
        - from: n4
          to: n6
          label: 周期风险收紧纪律
        - from: n5
          to: n6
          label: 竞争压住上行空间
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV007
      - CV011
      - CV014
      - CV036
      - CV041
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 上市 SiC 相关股票的公开估值区间很宽，说明情绪可以多快奖励或惩罚相似的战略叙事。
    data:
      items:
        - label: Infineon 2026 年 6 月
          value: 117.29
          detail: 市值，十亿美元，来自 CompaniesMarketCap。
          tone: positive
        - label: ST 2026 年 6 月
          value: 64.25
          detail: 市值，十亿美元，来自 CompaniesMarketCap。
          tone: positive
        - label: ON 2026 年 6 月
          value: 34.38
          detail: 市值，十亿美元，来自 CompaniesMarketCap。
          tone: neutral
        - label: ROHM 2026 年 6 月
          value: 12.72
          detail: 市值，十亿美元，来自 CompaniesMarketCap。
          tone: neutral
        - label: Wolfspeed 2026 年 6 月
          value: 2.42
          detail: 市值，十亿美元，来自 CompaniesMarketCap。
          tone: warning
        - label: Wolfspeed 2026 年 2 月低点
          value: 0.41
          detail: 十亿美元，来自 Macrotrends Wayback 快照。
          tone: negative
    approximationNotes: 公开同业只按十亿美元口径展示；AscenPower 未纳入该柱状图，因为其明确的私募估值以人民币计价，且条款披露有限。
    claimRefs:
      - CV024
      - CV029
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 可用公开锚点稀少且口径不一，因此合适的区间视角应围绕已披露里程碑，而不是虚构一套 DCF。
    data:
      items:
        - label: AscenPower 已披露融资锚点
          low: 6
          mid: 6.5
          high: 7
          unit: RMB bn
          detail: 36Kr 报道，2024 年 Series A 前后，公司投前估值 RMB6B、投后估值超过 RMB7B。
        - label: 项目预算背景
          low: 7.5
          mid: 8.25
          high: 9
          unit: RMB bn
          detail: 按来源质量不同，公开项目预算口径在 RMB7.5B 至 RMB9.0B 之间。
        - label: Wolfspeed 公开市场重置视角
          low: 0.41
          mid: 0.46
          high: 2.42
          unit: USD bn
          detail: 2026 年快照显示，纯 SiC 公司公开估值可以在一个周期内跌进压力区间。
    approximationNotes: 各行有意保留不同单位和视角，不假装它们可以直接互换，或换算成一个干净的公允价值数字。
    claimRefs:
      - CV004
      - CV005
      - CV009
      - CV010
      - CV029
      - CV030
      - CV037
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 工业相关性得分较高，但按当前估值看，估值吸引力和证据质量得分偏低。
    data:
      items:
        - label: 战略市场相关性
          value: 8
        - label: 工业资产证明
          value: 7
        - label: 客户证明质量
          value: 5
        - label: 披露质量
          value: 3
        - label: 公开可比公司背景
          value: 4
        - label: 当前估值吸引力
          value: 3
    approximationNotes: 分数是基于保留公开证据综合得出的 0-10 序数型尽调判断，并非管理层提供的 KPI。
    claimRefs:
      - CV014
      - CV015
      - CV038
      - CV042
      - CV044
      - CV045
