      - number: '2.5'
        title: 供给瓶颈、采用约束与含义
        blocks:
          - type: paragraph
            body: >-
              主要风险不是 SiC 是否重要，而是商用供应商能否足够快地越过成本、良率和认证门槛，从而守住份额。SemiconductorX
              的供应链框架很有用，因为它显示一条衬底漏斗供应多个终端市场，晶锭生长和外延质量才是真正瓶颈。Technavio 和 VMR 也强化了这一点：大直径晶圆仍面临缺陷、良率和可靠性约束；TrendForce 则明确说
              SiC 在成本和可靠性上仍落后于 IGBT。与此同时，市场并非直线上行：ST 和 onsemi 都提示 2025 年初进入疲弱和不确定状态，尤其是工业需求走软与更广泛低迷，即便它们仍在投入 SiC
              产能。Wolfspeed 2025 年重组说明，即使品类领导者也可能踩错 capex 周期。对 AscenPower
              来说，市场机会是真的，但赢下它不能只靠产能公告：公司必须稳定通过认证，在晶圆迁移中守住成本，并在 OEM 内化供应栈或锁定既有厂商之前拿下项目。
