      - number: '4.4'
        title: 同行下行信号放大收入不透明风险
        blocks:
          - type: paragraph
            body: >-
              如果周边 SiC 周期明确向好，缺失财务披露的影响会小一些。但事实不是这样。独立市场来源仍显示 SiC 需求和 EV 采用有长期增长，但也保留了会惩罚资金不足制造商的短期波动。TrendForce 称，2026
              年一季度 NEV 销量同比下滑 2%，且上游成本压力正在压制汽车需求。onsemi 2025 年一季度仍有 $1.45 billion 收入和 $455 million
              自由现金流，但管理层称公司正靠足迹纪律穿越低迷。ST 2025 年一季度同样显示收入同比下滑 27.3%、毛利率仅 33.4%，二季度指引中有 420 个基点的闲置产能压力；Infineon 则把 2025
              财年投资计划削减至约 €2.3 billion，并预计全年收入小幅下滑。与此同时，到 2026 年 2 月初，Wolfspeed 市值已降至约 $0.41 billion。同一章节还需要纳入客户议价能力：Li
              Auto、NIO 和 Zeekr 相关披露显示，OEM 正在内化 SiC 模块或锁定长期既有厂商供给；公开市场数据仍把这些 OEM 分别定价在约 $11.80 billion、$12.30 billion 和
              $6.84 billion，onsemi 本身约 $34.38 billion。对 AscenPower
              来说，剩余尽调负担本质上是财务问题。除非收入转化、毛利率、良率、营运资金需求和融资栈被披露，否则公司看起来更像一个有前景的资产建设项目，而不是一个已能完整承销的运营业务。
