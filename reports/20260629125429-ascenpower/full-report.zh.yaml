  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 商业和外部市场风险传导到收入质量、融资需求和估值的速度，比传导到表面晶圆产能说法更快。
    data:
      nodes:
        - id: n1
          label: 未具名、送样占比高的客户群
          description: 公开来源提到数量和样品，但没有具名 SOP 收入。
        - id: n2
          label: OEM 垂直整合
          description: Li Auto、BYD、NIO 和 Zeekr 生态动作削弱商用器件供应商议价权。
        - id: n3
          label: 既有厂商 200mm 成本防守
          description: ST、Infineon 和其他同行继续扩产并重塑成本基础。
        - id: n4
          label: SiC 定价权转弱
          description: 初创晶圆厂失去相对既有厂商替代方案溢价定价的空间。
        - id: n5
          label: 客户转化变慢
          description: 认证项目需要更长时间才能变成重复量产订单。
        - id: n6
          label: 融资需求升高
          description: 毛利率证明出现之前，需要更多时间和现金。
        - id: n7
          label: 残余估值压缩
          description: 投资人会按更低倍数和更严格里程碑承销。
      edges:
        - from: n1
          to: n5
          label: 限制可融资积压订单
        - from: n2
          to: n4
          label: 转移议价权
        - from: n3
          to: n4
          label: 压缩定价
        - from: n4
          to: n6
          label: 推迟利润率证明
        - from: n5
          to: n6
          label: 拉长现金周期
        - from: n6
          to: n7
          label: 迫使更严苛条款
        - from: n3
          to: n7
          label: 抬高可比门槛
