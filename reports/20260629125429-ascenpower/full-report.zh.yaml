      - number: '2.2'
        title: TAM、SAM、SOM 视角与估算纪律
        blocks:
          - type: paragraph
            body: >-
              公开市场规模记录彼此差异太大，不足以支撑一个单一的标题 TAM。ResearchAndMarkets 预计 SiC 功率半导体市场 2025 年为 $1.55 billion、2026 年为 $1.95
              billion；TrendForce 的器件口径到 2026 年已经达到 $5.33 billion；Precedence Research 则把更宽的 SiC 市场放在 2025 年 $4.64
              billion、2026 年 $5.19 billion。FMI 和 VMR 因纳入更宽的材料和应用定义，又拉开了更大区间。这个差距不是噪音，而是证据：宽口径 TAM 主张掩盖了范围差异。对 AscenPower
              来说，可辩护的 SAM 是汽车、可再生能源、智能电网和工业功率转换需求中的商用份额，尤其在 APAC 和中国，而不是全球每一种 SiC 用例。当前 SOM 更窄，最好把它定义为供给侧楔子：一条公开披露的
              240,000 片 6 英寸车规级产线，一条预留 240,000 片 8 英寸产线，以及设计公司 / 客户签约，而不是已披露收入份额。
