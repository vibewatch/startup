  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与相关支出
        blocks:
          - type: paragraph
            body: >-
              AscenPower 并不在完整的碳化硅材料宇宙里竞争。相关边界是与高压电能转换相关的商用 SiC
              功率半导体支出：先是汽车牵引逆变器和车载电力电子，然后是光伏逆变器、储能功率转换、工业电机驱动、智能电网设备和充电基础设施。Infineon 和 ROHM
              的公开产品与应用页面与这个边界高度一致，ResearchAndMarkets 的功率半导体分项也显示同样终端市场。同样清楚的是排除项：磨料、耐火材料、仅 RF 的细分市场和其他非功率用途，会把标题口径下的 SiC
              市场数字做大，却不会改善 AscenPower 真正可服务的机会。Semiconductor Today 对 AscenPower
              的画像在这里也很重要，因为它把公司明确放在车规级芯片、光伏和智能电网应用中，强化了可投资问题是电气化中的商用功率器件份额，而不是泛泛的 SiC 材料体量。
