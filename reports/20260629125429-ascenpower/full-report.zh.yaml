      - number: '5.5'
        title: 承销缺口与技术风险
        blocks:
          - type: paragraph
            body: >-
              尽调的关键技术问题已经不是 AscenPower
              是否有真实晶圆厂项目——几乎可以确定有——而是公开里程碑是否已经成熟为可重复的车规级经济性。开放记录保留了四个实质缺口。第一，本轮中本应提供最干净一手工艺平台证据的公司网站页面被爬虫屏蔽，因此公司自述的工艺和制造主张仍缺少完整直接确认。第二，公开来源给出客户数量、送样语言和接近量产的项目数量，但没有具名量产汽车
              SOP 客户。第三，公开记录提到良好测试数据、专利积累和可靠产品，却没有披露经审计良率曲线、专利编号、PPAP 或 AEC 式细节，或晶圆级报废趋势。第四，8
              英寸二期仍是路线图主张，而不是公开工具安装、认证和产出里程碑组合。这些缺口不否定产品故事，但会把技术信心压在投资人锁定可承销产量假设所需位置之下一层。
