      - number: '1.4'
        title: 制造建设、产能与客户信号
        blocks:
          - type: paragraph
            body: >-
              AscenPower 的公开差异化来自制造规模，而不是隐身式 IP 叙事。EE Times China 称，项目经历约 15 个月建设后于 2024 年 3 月 15 日正式上线，年底目标为每月 10,000 片
              6 英寸晶圆。TrendForce 2024 年 3 月市场摘要给出了最清晰的分期逻辑：一期到 2024 年底爬坡至年产 240,000 片 6 英寸车规级 SiC 芯片；相邻预留二期建成后设计年产
              240,000 片 8 英寸芯片。36Kr 把整体项目描述为人民币 75 亿元工程，也是国内最大的专用车规级 SiC 制造项目之一；百度百科英文条目则给出更高的人民币 90 亿元 / 480,000
              片晶圆框架。这个差异是真实存在的，应保留，而不是抹平。客户披露有方向性但不完整：EE Times 提到 10 多个 COT 客户和 4 个近期产品项目，36Kr 和 TrendForce 则报道 40
              多个已签约客户，以及覆盖多数国内 SiC 设计公司的流片。
