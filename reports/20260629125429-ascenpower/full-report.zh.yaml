companyProfile:
  summary: >-
    AscenPower（广东芯粤能半导体有限公司，芯粤能）是一家位于广州南沙的碳化硅芯片制造商，2021 年成立，面向汽车和工业电力应用。公开来源一致把公司放在车规级 SiC SBD/JBS 与 MOSFET
    器件赛道，若干二级来源还提到 IGBT；业务重心是大规模国内制造爬坡，而不是纯 fabless 设计模式。公司在 2024 年 9 月完成约人民币 10 亿元 Series A，由广东集成电路基金二期和国投创业领投；之后又出现在胡润
    2025 年评论中，成为广州新晋独角兽之一。公司正在建设的项目公开目标为年产 240,000 片 6 英寸和 240,000 片 8 英寸车规级 SiC 芯片。
  foundedDate: '2021-05-17'
  foundingLocation: Nansha District, Guangzhou, China
  headquarters: Nansha District, Guangzhou, China
  productSummary: 车规级和工业控制用碳化硅功率器件及相关芯片，以 SiC SBD/JBS 二极管和 SiC MOSFET 为核心，面向 EV 主驱、工业电源、智能电网和光伏系统。
  customerFocus: 需要车规级或高可靠性 SiC 器件的 EV 主机厂、Tier-1 供应商、SiC 芯片设计公司，以及工业 / 电网 / 光伏电力设备客户。
  businessModel: 资本密集型半导体制造与研发：AscenPower 建设并验证国内 SiC 晶圆和器件产能，再把芯片 / 功率器件卖进长周期汽车和工业认证项目。公开来源显示，客户合作通常要先经历流片、送样和认证，再转入全面量产。
  stage: Series A / growth-stage manufacturing
  fundingStatus: >-
    2024 年 9 月宣布约人民币 10 亿元 Series A，由广东集成电路基金二期和国投创业共同领投，深圳资本、广州产业投资、社保背景的大湾区科学基金、博原资本、Fellow Partners
    和玺辰资本参投。公开来源未披露具体股权比例、清算优先权，或 Series A 之后的任何融资。
