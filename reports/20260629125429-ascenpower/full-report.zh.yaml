  - id: FU004
    title: 车规采购流程
    type: flow
    layout: standard
    summary: 公开证据显示，公司正处在车规采购链中段；要形成持久客户证明，还需要认证、重复订单和具名账户披露。
    data:
      nodes:
        - id: p1
          label: 向 OEM / 客户交付样品
          description: 2023-2024 年来源反复称芯片已送至 OEM 和客户做样品验证。
        - id: p2
          label: 电性 / 可靠性数据评审
          description: 行业来源称测试数据良好，但公开市场没有可审计的 AEC 式数据集。
        - id: p3
          label: 质量体系与车规验证关口
          description: IATF16949 有助于进入采购门槛，更广泛的车规验证仍被描述为推进中。
        - id: p4
          label: 客户专属批量认证
          description: 四个客户专属项目被描述为已完成或接近量产，但名称和详细里程碑缺失。
        - id: p5
          label: 具名 SOP 与重复订单
          description: 已审阅来源没有披露具名车规 SOP 账户、续约指标或重复订单历史。
      edges:
        - from: p1
          to: p2
