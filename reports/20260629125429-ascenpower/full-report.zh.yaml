        - 可能高估商业成熟度
        - 要求按产品线提供月度收入和客户集中度明细
      - - 毛利率和良率
        - 制造经济性的核心检验
        - 除工艺里程碑外没有替代项
        - 高 capex 晶圆厂可能放大出货量，却没有合格利润率
        - 要求提供良率材料、报废历史和毛利率桥表
      - - 账面现金和 burn
        - 决定下一轮融资是否迫近
        - 只有 A 轮规模和注册资本
        - Runway 可能远短于项目叙事暗示
        - 要求提供现金余额、月度 burn 和 12 个月现金预测
      - - 债务、供应商信用和补贴
        - 改变真实资本结构和下行优先级
        - 国资背景投资人名单暗示支持，但不等于义务
        - 隐性杠杆或附条件补贴可能扭曲风险
        - 要求提供授信协议、补贴批文和 capex 返还安排
      - - 具名量产客户和绑定订单
