      - number: '1.5'
        title: 反向框架与尽调含义
        blocks:
          - type: paragraph
            body: >-
              同一组证据让 AscenPower 看起来重要，也界定了它的风险面。公开来源没有披露收入、毛利率、现金跑道、良率，或具名量产汽车客户。TrendForce 的车用 SiC 研究明确指出，尽管采用速度加快，SiC
              在成本和可靠性上仍落后于传统 IGBT；也就是说，认证仍是门槛，并不是已经解决的问题。行业层面，STMicroelectronics 正在欧洲扩大 200mm SiC 产能；onsemi 把 2025
              年描述为收入下滑一年后的不确定市场低迷期；Wolfspeed 的市值坍塌显示，资本密集型 SiC 的情绪压缩可以非常剧烈。中国 OEM 也在纵向整合：Li Auto 的自研 SiC
              模块生产说明，一些最有吸引力的下游客户可能试图把战略供给内化。结果是，公司概览支持真实产业可信度，但还不能支撑干净的承销案例。下一步尽调已经不是“这家公司是否存在？”，而是“其已宣布产能、客户管线和认证进展中，有多少已经转化为经济上耐久的产出？”
