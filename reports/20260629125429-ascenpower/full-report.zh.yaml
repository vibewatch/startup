    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局与核心产品
        blocks:
          - type: paragraph
            body: >-
              AscenPower——英文公开写法包括 Ascen Power 或 AscenPower，法定注册名为 Guangdong Xinyueneng Semiconductor Co.,
              Ltd.——是一家位于广州的碳化硅芯片公司，成立于 2021 年 5 月。登记类来源在注册地址上相互一致，均指向南沙区正翔路 10 号，也显示公司处于存续经营状态。CB Insights
              和南沙政府都把公司定义为车规级和工业控制碳化硅器件公司，而不是宽泛的消费半导体策略。复核来源中反复出现的核心产品是 SiC SBD/JBS 二极管和 SiC MOSFET 功率器件，若干二级来源还把 IGBT
              加入其营销产品组合。终端市场在不同来源中也稳定：新能源汽车主驱、工业电源、智能电网和光伏系统。这个边界很关键，因为 AscenPower 所在的半导体环节，客户更看重可靠性、认证纪律和制造规模，而不只是设计新意。
