      - number: '7.2'
        title: 晶圆厂爬坡、认证与执行风险
        blocks:
          - type: paragraph
            body: >-
              最直接的承销风险不是 AscenPower 有没有工厂，而是现有 6 英寸工厂能否足够快地产出可重复的车规级经济性，从而支撑已经投入的资本，以及围绕 8
              英寸规模的公开雄心。多项来源称产线已贯通并进入量产阶段，但同一批来源仍在描述产能爬坡、工艺优化、客户送样和认证工作，这些工作并不显然已经完成。DRAMX 尤其重要，因为它把 8
              英寸产线描述为预留的相邻产能，而不是已经建成且完成认证的出货流。招聘证据也指向同一方向：公司仍在招聘
              CVD、PVD、集成、CIM、制造和更广泛工程岗位，这些岗位直接影响良率、吞吐量和异常控制。换句话说，AscenPower 已经越过纸面项目风险，但仍处在规模化爬坡风险里。在 SiC
              领域，这个区分很关键，因为晶圆直径扩张本身解决不了晶体生长、缺陷控制或车规可靠性验证的硬物理问题。
