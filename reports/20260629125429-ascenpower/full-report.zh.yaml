      - number: '2.4'
        title: 需求驱动与 6 英寸到 8 英寸迁移
        blocks:
          - type: paragraph
            body: >-
              EV 渗透率仍是最强的近端驱动。IEA 记录 2023 年电动汽车销量接近 1,400 万辆，其中中国 810 万辆；即使一季度疲弱，TrendForce 仍预计 2026 年全球 NEV 销量达到 2,335
              万辆。TrendForce 的车用 SiC 备注称，几乎所有 OEM 和 Tier-1 供应商都已经在采用或开发 SiC 组件；Zeekr、Nio 和 Li Auto
              则说明原因：更快充电、更长续航和更高电压架构都会把更多 SiC 拉进传动系统。非汽车需求真实存在，但排在第二位：Infineon 和 ROHM 都强调光伏、储能、EV 充电和工业功率转换，Qingchun
              的出货主张也显示这些品类在中国已经商业化。在供给经济性上，6 英寸生产仍主导当前体量，但 8 英寸和 200mm 迁移是行业降低单颗裸片成本、提高吞吐的主要路径。正因如此，AscenPower 预留的 8
              英寸二期即便尚未上线，也有意义。
            claimRefs:
