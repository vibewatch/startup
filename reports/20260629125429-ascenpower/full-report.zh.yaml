    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 需要成立的前提
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 6 英寸线把客户管线转成具名 SOP 项目，利润率变得可信，8 英寸扩产也能在没有惩罚性稀释的情况下拿到资金。
        - 只要运营证据能把里程碑估值转成盈利能力，当前估值就站得住。
        - 良率、ASP 和客户集中度仍可能低于预期。
        - 多个尽调缺口都要给出正面答案，因此这一信号还没有占主导。
      - - 基准
        - 公司保住战略相关性和产业可信度，但公开资料对商业化和条款的证明仍不完整。
        - 上一轮估值更适合作为持有 / 跟踪锚点，而不是上行空间被低估的证据。
        - 投资人可能在看不清经济性的情况下，为战略稀缺性付出过高价格。
        - 目前公开记录最支持这一判断。
      - - 悲观
        - 客户转化放缓，既有厂商和 OEM 把更多 SiC 价值链内化，后续融资条款也变弱。
        - 即便晶圆厂在技术上真实存在，私募估值也会压缩，或被条款排到更后面。
        - 稀释、优先权压力和资本开支拖累会叠加。
        - 公开可比公司的波动和披露缺口，让这一情景仍有实质可能。
    notes: 情景逻辑保持定性，因为公开来源没有披露收入、利润率、股权结构或现金流输入，无法支撑可信的数字化 DCF。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV039
      - CV040
      - CV041
      - CV045
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 公开锚点
      - 对估值纪律的提示
      - 与 AscenPower 的相关性
      - 局限
    rows:
      - - AscenPower（未上市）
        - 2024 年 Series A 投前 RMB6B、投后 >RMB7B
        - 私募价格锚点明确，但条款和经济性未披露。
        - 最接近的直接入场纪律锚点。
        - 没有公开披露收入、利润率或优先权。
      - - Infineon
        - 2026 年 6 月市值约 US$117.29B
        - 披露充分、业务分散时，规模化既有厂商可以获得很高股权价值。
        - 展示公开可比公司组的上沿。
        - 不是纯 SiC 公司；产品组合更宽，成熟度也高得多。
      - - STMicroelectronics
        - 2026 年 6 月市值约 US$64.25B
        - 即便 2024 年经历回撤，投资人仍会奖励多元化既有厂商。
        - 可作为已披露 200mm SiC 投资的可比参照。
        - MCU、模拟和传感器业务占比更宽，限制了逐项对比。
      - - ON Semiconductor
        - 2024 年收入下滑且 2025 年管理层谈到不确定性后，2026 年 6 月市值约 US$34.38B
        - 公开市场可以一边认可战略相关性，一边给下行周期风险定价。
        - 最适合提示周期风险的已披露汽车功率可比公司。
        - 业务组合不止 SiC。
      - - ROHM
        - 2026 年 6 月市值约 US$12.72B
        - 即便是成熟 SiC 参与者，交易估值也可能远低于西方超大市值同行。
        - 展示一家真正有 SiC 敞口的中等规模上市可比公司。
        - 日本集团公司背景和产品组合不同。
      - - Wolfspeed
        - 2026 年 6 月市值约 US$2.42B，2026 年 2 月某一快照约 US$0.41B
        - 资本结构和商业化一旦失守，纯 SiC 叙事可能被剧烈压缩。
        - 最直接的公开警示：不要在看不清经济性时为稀缺性买单。
        - 重组和 Chapter 11 背景让它更像压力可比对象，而不是正常倍数可比对象。
    notes: 这张表有意混用私募和公开市场锚点；AscenPower 披露的经济性不足，无法搭出干净的同口径倍数桥，因此可比公司主要用于约束纪律和框定下行，而不是直接计算。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private valuation anchors reviewed for this chapter rather than every
        global SiC or power-semiconductor comparable.
    claimRefs:
      - CV004
      - CV005
      - CV017
      - CV018
      - CV019
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
      - CV029
      - CV030
  - id: TV005
    title: 投资论点失效与终止触发表
    columns:
      - 触发项
      - 阈值或事件
      - 如何传导到投资论点
      - 行动含义
    rows:
      - - 商业转化不达标
        - 追加融资后仍没有具名 SOP 客户证据或出货证明
        - 说明产能叙事跑在商业化前面。
        - 暂停投资，按资本开支故事重新承销，而不是按增长故事承销。
      - - 融资条款偏弱
        - 新一轮包含沉重优先权、惩罚性反稀释，或明显的降价融资经济性
        - 推高真实入场价格，也会损害普通股上行。
        - 回避，或要求大幅价格折让。
      - - 运营经济性不达标
        - 良率、ASP 或毛利率披露显著低于当前估值隐含水平
        - 估值逻辑从战略稀缺转成资本陷阱。
        - 下调为回避，直到经济性稳定。
      - - 行业重估持续
        - 公开 SiC 同行继续压缩，同时 OEM 内化更多模块价值
        - 退出窗口变窄，可接受入场倍数被压低。
        - 如果 AscenPower 仍无法披露商业化证据，就从继续研究转为回避。
    notes: 这些触发项特意设计成可监控指标，并且要能改变承销决策，而不只是改变叙事语气。
    claimRefs:
      - CV033
      - CV034
      - CV041
      - CV044
      - CV045
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 股权结构 / 优先权
        - 2024 年融资中的清算优先权层级、参与权、反稀释安排以及任何高级证券
        - 隐藏的高级顺位会让名义上的公平价格在经济上变得不划算。
        - 索取当前股权结构表、融资文件和律师摘要。
      - - 当前商业产出
        - 月度出货量、已接受客户项目、积压订单质量和取消条款
        - 把里程碑估值转成收入质量证据。
        - 获取当前运营看板和客户分群明细。
      - - 单位经济性
        - 晶圆良率、报废率、实际 ASP、毛利率和营运资本周转
        - 决定晶圆厂是在放大价值，还是只是在放大资本开支。
        - 索取工厂 KPI 包和 CFO 桥表。
      - - 资金结构
        - 相对于 RMB7.5B+ 建设叙事，补贴、设备租赁、供应商信用、债务和项目融资支持各占多少
        - 决定稀释风险和扩张的有效成本。
        - 审阅补助文件、租赁排期、债务条款和地方政府支持函。
      - - 客户证明
        - 具名 SOP 客户、审计状态、认证阶段，以及按项目划分的集中度
        - 区分 design-in 热情和可持续量产需求。
        - 做客户访谈，并索取已签署项目证据。
    notes: 这些问题刻意收窄：每一项都可能在一个尽调周期内改变投资建议、信心或可接受入场价格。
    claimRefs:
      - CV036
      - CV037
      - CV046
      - CV047
      - CV048
