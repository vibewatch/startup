  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 最高残余严重度集中在商业化不透明、资本强度和外部市场节奏的交汇处，而不是某一个孤立法律问题。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重度
      rows:
        - label: 6 英寸良率 / 质量转化
          values:
