              SiC
              设计公司；车规级和工业级芯片已成功流片、送样，并接近汽车认证。多个媒体也保留了同样的四项目目信号，但措辞略有不同——有的说四个客户定制产品即将量产，另一个说四个已完成规模化生产。保守解读是，公开证据支持四个客户定制项目处在量产或接近量产阶段，而不是一组清晰具名的批量账户。这个区别很重要，因为从
