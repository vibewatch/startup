  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品族与用例匹配
        blocks:
          - type: paragraph
            body: >-
              公开记录把 AscenPower 描述为一家功率器件制造商和研发运营方，围绕车规级和工业控制碳化硅搭建，而不是围绕泛半导体平台。公司相邻画像、政府或投资方摘要反复提到同样的核心产品族：SiC SBD/JBS 和
              SiC MOSFET 器件，若干二级来源还把 IGBT 加入营销阵容。使用地图在不同来源中也一致：新能源汽车主驱、工业电源、智能电网、光伏系统，以及后来出现的充电相关工业部署信号。最具体的公开规格披露来自
              2024 年底的一篇行业画像，称已披露的 SBD 和 MOSFET 产品线覆盖 650V 到 1700V；量产线行业报道则突出 1200V 器件和 16 毫欧 / 35
              毫欧版本。这个组合很重要，因为它把公司描绘得不像一家追逐单一小众场景的离散芯片初创公司，而更像一个汽车和工业功率器件平台；其公开产品故事锚定在高压 SiC 开关和整流上。
