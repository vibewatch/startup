        title: 商业不透明、客户集中与 OEM 垂直整合
        blocks:
          - type: paragraph
            body: >-
              商业风险不在于完全没有需求，而在于需求实际由谁控制，以及这种控制有多透明。公开来源确实显示出一条管线：超过 10 家 COT 客户、4 个接近量产的客户定制项目，以及超过 40
              家流片客户。但同一批来源没有点名汽车 SOP 客户，也没有披露任何头部客户收入结构。因此，投资者无法判断这条管线是多元且有粘性，还是仍集中在少数工程合作中。背景正在变差，而不是变好。Li Auto 称自家 SiC
              模块和芯片已经内部量产，BYD 称最新 EV 平台包含新的 SiC 功率芯片，NIO 继续推进自家模块路线图，Zeekr
              则锁定了长期既有供应。这些动作不会消灭外部采购需求，但会削弱一家创业晶圆厂可获得的定价权和战略杠杆，而它最强的公开证据仍停留在送样和认证层。如果 AscenPower
              最早的大客户同时也是最强的潜在内制方，集中度风险和议价权风险就会变成同一个问题。
