            body: >-
              AscenPower 的公开路线图足以判断方向，但还不足以证明执行。近端锚点是一条向年产 240,000 片爬坡的 6 英寸产线；相邻 8
              英寸线被公开描述为二期，而不是当前已认证产线。关于第二、第三代工艺平台的招聘语言，加上总裁的“开放平台”表述，说明公司想做的不止一条自用器件线。即便如此，差异化仍需谨慎描述。ROHM 公开展示更宽的 SiC
              生态，包括器件教育、评估板、仿真和应用支持。Infineon 公开强调完整供应链、栅极驱动匹配和数十年 SiC 积累。ST 已经公开 200mm SiC 扩产和 2025 年投产节奏。SemiconductorX
              的行业框架称，中国体量仍主要停留在 150mm，而前沿正在迁移到 200mm。在这个语境下，AscenPower 今天的公开优势更偏国内和战术层面：一个车规级 6 英寸制造基地、一个可信的 8
