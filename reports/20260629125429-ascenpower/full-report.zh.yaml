      - number: '8.3'
        title: 牛熊结果都真实存在，因此基准情形必须受证据约束
        blocks:
          - type: paragraph
            body: >-
              牛市情形可以理解。AscenPower 有国资支持轮融资、明确的私有估值锚点、大额公开项目预算、真实的 6 英寸车规级产能叙事，以及显示公司并非从零起步的客户管线说法。如果公司能把可见客户漏斗转成点名 SOP
              项目，守住可信良率和利润率，并在不遭遇惩罚性稀释的情况下为任何 8
              英寸扩张融资，当前估值标记最终可能显得合理。问题是，公开记录还没有显示这些条件已经成立。因此，基准情形不能假设软件式增长，也不能假设干净的晶圆代工式利用率；它必须把上一轮融资视为一次融资事件，而不是估值有吸引力的证明。熊市情形也很具体，并非假设：200mm
              既有厂商继续推进，Li Auto 等 OEM 正内化更多 SiC 堆栈，公开市场历史也显示，即便是核心 SiC 公司，只要 capex
              跑在变现前面，估值也会剧烈重估。这组因素指向一个现实结论：由于资产建设真实，公司仍值得持续主动尽调；但在经济性追上叙事前，建议应保持继续研究，置信度中等，风险高，估值立场偏高。
