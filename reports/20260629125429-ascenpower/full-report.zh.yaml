      - number: '3.2'
        title: 既有厂商护城河来自供给控制和 200mm 执行
        blocks:
          - type: paragraph
            body: >-
              SiC 的既有厂商护城河，与其说来自单个晶体管规格，不如说来自对制造栈的控制。Infineon 明确营销完整供应链所有权和超过二十年的 SiC 积累。ROHM 称其独立开发从晶圆制造到封装和质量控制的整条链。ST
              正用 200mm 碳化硅产能规划投资和 Catania 200mm 晶圆生产 2025 年第四季度启动计划，强化同样的 IDM 逻辑。SemiconductorX 的行业综合明确指出战略后果：衬底获取和
              150mm 向 200mm 迁移，是近期成本和吞吐的关键变量；完成 200mm 爬坡的运营商，会相对仍以 150mm 或 6 英寸产线为中心的供应商获得结构性优势。因此，AscenPower
              的公开故事在国内产能雄心上很强，但在让既有厂商护城河耐久的具体要素上仍偏薄：自有衬底获取、已公开的 200mm 执行，以及广泛的模块、驱动和长周期汽车认证栈。
