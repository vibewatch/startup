      - number: '7.4'
        title: 市场、政策与地缘政治冲击风险
        blocks:
          - type: paragraph
            body: >-
              外部市场已经不再像单向顺风。TrendForce 称 1Q26 全球 NEV 销量同比下滑，中国表现不及预期；Infineon 称客户仍在消化库存，电动出行增速放缓迫使公司下调预测；onsemi
              明确描述市场下行；ST 则一边围绕 200mm SiC 重塑制造足迹，一边压缩成本基数。对 AscenPower 来说，这有两层影响。第一，公司的公开定位正集中在汽车和工业功率市场；如果 EV
              相关项目暂停或重新定价，公司没有显而易见的缓冲。第二，地缘政治和政策依赖是真实存在的。BIS 称 2023 年 10
              月管制更新包含半导体制造设备限制，以及与中国有关的实体清单新增项。公开的地方政府和投资者材料也显示，AscenPower
              的建设深度嵌入广东的产业政策推进和国资支持资本网络。顺境中，这种组合可以帮忙；但它也意味着，公司同时暴露于外部管制，以及政策出资方在波动市场窗口继续支持重 capex 的意愿。
