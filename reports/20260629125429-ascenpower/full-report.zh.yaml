      - number: '4.2'
        title: 晶圆厂规模、员工数和客户管线是主要公开牵引力代理指标
        blocks:
          - type: paragraph
            body: >-
              AscenPower 不公布收入或利润率，因此最好的公开牵引力指标是接近资产负债表和运营足迹的信号。企查查显示，2025 年申报窗口注册资本为人民币 4.5793 亿元，参保员工 621 人；爱企查描述的是一个
              150 亩项目，总规划投资人民币 75 亿元。行业报道增加了异常具体的制造里程碑：洁净室于 2022 年 11 月投入运行；产线据称在约 15 个月建设后于 2024 年 3 月上线；月度 6 英寸产能达到约
              10,000 片；一期年产量被表述为 240,000 片 6 英寸车规级 SiC 芯片，并预留二期 240,000 片 8
              英寸芯片计划。这些都是有意义的产业信号，因为它们暗示真实资产部署和一定工艺成熟度。但它们仍不是财务证明。客户数量在一个行业来源中披露为 10 多个 COT 客户，在其他来源中披露为 40
              多个已签约客户或流片；但具名大批量生产合同仍很少。换句话说，公开故事在已安装能力上强于在已变现吞吐上。
