      - number: '1.3'
        title: Series A、资本基础与独角兽锚点
        blocks:
          - type: paragraph
            body: >-
              最重要的公开融资事件是 2024 年 9 月下旬的 Series A。政府、投资方和媒体来源一致指向约人民币 10
              亿元融资，由广东集成电路基金二期和国投创业领投，联合投资方包括深圳资本、广州产业投资、社保背景的大湾区科学基金、博原资本、Fellow Partners
              和玺辰资本。资金用途被一致表述为扩产，以及国内外市场开拓。36Kr 给出了该融资窗口内最强的公开估值锚点：投前约人民币 60 亿元，投后超过人民币 70 亿元。按当时汇率，这个数字本身略低于严格的 10
              亿美元门槛，但后续胡润 2025 年榜单给出了方向性确认：胡润把独角兽定义为估值至少 10 亿美元的未上市公司，并把 AscenPower
              列为广州新晋独角兽之一。因此，公开资本故事不只是“资金充足”，而是明确带有国资背书、政策对齐，并随后获得一个公认独角兽指数验证。
