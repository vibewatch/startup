      - number: '3.3'
        title: 切换成本真实存在，但 OEM 在反推
        blocks:
          - type: paragraph
            body: >-
              车用 SiC 确实有切换成本，但不是绝对的。TrendForce 指出，OEM 和 Tier-1 已经深度参与 SiC 模块设计及相关封装决策，这意味着认证、封装和平台电压架构，与底层裸片同样重要。Zeekr 与
              onsemi 的长期供货协议显示，这些决策如何固化为供应商专属采购和 1200V 器件路线图。Infineon 和 ROHM
              的官方供应商页面也把器件与配套驱动或模块生态绑定，说明客户围绕一个系列设计后会形成栈级锁定。与此同时，同一市场也在产生自身的反锁定机制。TrendForce 称 SiC 在成本和可靠性上仍落后于
              IGBT，因此在部分应用中保留了更便宜的现状替代品；Li Auto 和 Nio 则显示，只要 EV 体量足够，OEM 愿意内化模块，或至少内化设计控制。对 AscenPower
              来说，认证能带来粘性，但任何初创公司都不能假设这些关系会永远保持商用外采且无人争夺。
