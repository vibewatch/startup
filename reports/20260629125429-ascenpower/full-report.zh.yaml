      - number: '3.5'
        title: 护城河耐久性与商品化风险
        blocks:
          - type: paragraph
            body: >-
              因此，AscenPower 的护城河问题比标题市场增长故事更窄。多个市场跟踪机构仍认为 SiC 会快速扩张，8
              英寸迁移会改善经济性，所以品类有吸引力。但增长不会自动创造耐久的初创公司差异化。SemiconductorX 认为，衬底获取和 200mm 执行，而不只是器件设计，决定长期成本位置。TrendForce
              保留了反向情形：SiC 在成本和可靠性上仍落后于 IGBT。Wolfspeed 即便有领导者品牌，公开股权规模仍缩水，说明资本强度可以重创一个技术上居中的玩家。在这个背景下，AscenPower
              最强的公开优势是国内车规级产能建设、政策对齐和未来 8
              英寸选项。公开支持最弱的护城河主张，恰恰是投资人通常最关心的几项：全球验证过的认证广度、已披露的自有上游控制、具名量产客户，以及已宣布产能已经转化为定价权或更优单位经济性的证据。竞争结论不是 AscenPower
              没有位置，而是在更强证据出现前，商品化压力和既有厂商反应仍是基准情形。
