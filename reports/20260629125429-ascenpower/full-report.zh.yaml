        title: 晶圆厂建设与运营架构
        blocks:
          - type: paragraph
            body: >-
              AscenPower 最强的技术信号不是一套公开芯片
              datasheet，而是一座看起来正在按规模化制造基地方式招聘、爬坡和集成的晶圆厂运营形态。登记和画像来源描述的是一家获得许可、可以设计、制造、销售和进出口芯片的主体；项目报道则把建设描述为一个约 150
              亩、人民币 75 亿元项目，包括一期 6 英寸产线和规划中的二期 8 英寸产线。多个 2024 年来源称，洁净室于 2022 年底开始运行，产线经历约 15 个月建设后正式上线，6 英寸线达到或目标达到每月
              10,000 片晶圆。招聘信号强化了制造故事：Liepin 上的在招岗位要求动手优化 CVD/PVD、解决量产问题和提升良率；校招覆盖工艺整合、工艺工程、设备、制造和 CIM；CIM 岗位还明确提到
              MES、APC 和 EAP。合在一起看，这个架构像是真正的晶圆厂爬坡，具备工艺、自动化和 NPI 层，而不只是前端产品营销空壳。
