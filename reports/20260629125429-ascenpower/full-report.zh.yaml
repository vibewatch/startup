  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 变现路径存在，但收入质量仍未披露
        blocks:
          - type: paragraph
            body: >-
              公开记录足以说明 AscenPower 打算变现什么，但不能说明这类变现值多少钱。登记和公司画像材料描述的经营范围覆盖芯片设计、芯片制造和芯片销售，行业报道则持续把实际产品集收窄到车规级和工业级 SiC
              SBD/JBS 二极管、MOSFET，以及部分 IGBT 提法。这支持一种围绕类代工晶圆或芯片产出、加离散器件销售的收入模式，而不是软件式经常性收入。它不能支持的是定价权：复核来源没有披露标价、实际
              ASP、合同期限、出货组合、退货或收入确认政策。因此，本章可以解释客户 design-in
              应如何变成收入，却无法承销收入质量。公开牵引力只能从运营代理指标推断——产能、客户数、认证里程碑和招聘规模——而不是从已披露损益表指标中读取。
