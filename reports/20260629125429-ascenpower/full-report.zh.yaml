  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接竞争组与公开规模差距
        blocks:
          - type: paragraph
            body: >-
              公开来源把 AscenPower 放在商用车规级 SiC 器件集合中，但其成熟度与锚定买方 shortlist 的全球既有厂商差距很大。CB Insights 和 EE Times China
              把公司定位在汽车和工业控制 SiC 芯片，而不是宽泛的模拟或 MCU 产品组合；EE Times 加 TrendForce 给出最清晰的公开运营信号：现有 6 英寸产线，年底目标约每月 10,000 片晶圆或年化
              240,000 片，以及相邻规划中的 8 英寸产线。对一家 2021 年成立、中国 Series A
              公司来说，这有意义，但相对公开同行的规模差距仍很大。Infineon、STMicroelectronics、onsemi 和 ROHM 都拥有数十亿美元收入或市值基础；Wolfspeed
              即便承受财务压力，仍把自己定位为横跨材料和功率器件的全球 SiC 领导者。实际结论是，AscenPower
              进入的市场里，客户不仅可以拿它与中国同行对标，也会拿它与认证历史更长、生态更宽、工业规模披露更多的供应商对标。
