        title: 集中度风险与 OEM 纵向整合
        blocks:
          - type: paragraph
            body: >-
              公开记录暗示的集中度，也在重塑客户风险判断。AscenPower 的可见进展高度集中在中国：行业来源称，40 多家已签约流片客户覆盖多数国内 SiC
              设计公司；后续融资报道反复强调国内外市场拓展，而不是已经形成全球多元化；36Kr 的一条股东线索把股权结构连到 Geely 的 Viridi E-Mobility 生态，但并未证明 Geely
              已经贡献规模订单。因此，最有证据支撑的读法是：公司仍以国内客户为主，客户结构不清，头部客户敞口也不清。外部风险背景也不是静态的。TrendForce 的 2026 年 NEV 数据、onsemi 的 2024
              年业绩、ST 对制造足迹的重塑，都指向一个市场：主要供应商仍在处理波动和时点风险。更重要的是，BYD 和 Li Auto 正公开加深自研 SiC 或更广义的半导体自给；Geely 与 onsemi
              也说明，更早的系统级协同设计会把议价权拉向 OEM 和大型 IDM。在这种环境里，AscenPower
              真正的客户挑战不只是拿下样品项目，而是在垂直整合、国内周期波动和不透明客户集中度压缩机会窗口之前，把项目转成收入。
