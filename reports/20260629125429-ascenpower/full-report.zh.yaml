      - number: '4.3'
        title: 可见股权资本仍明显低于公开 capex 叙事
        blocks:
          - type: paragraph
            body: >-
              关键财务问题不是 AscenPower 是否融到过有意义的资金——它融到了——而是公开可见融资是否足以支撑开放来源描述的制造雄心。政府、投资方和媒体报道都指向 2024 年 9 月下旬约人民币 10 亿元
              Series A，由广东集成电路基金二期和国投创业领投，资金用途为扩产以及国内外市场开拓。这是相当可观的早期融资，但相对流传中的晶圆厂叙事仍然偏小。爱企查和多个行业来源描述的是人民币 75
              亿元项目，Semiconductor Today 把一期拆分为人民币 35 亿元，一个质量较低的二级来源则把顶部数字抬到人民币 90 亿元。仅按这套公开数学，2024
              年融资只是部分资金层。同行披露也显示，即便达到规模，功率半导体产能仍非常昂贵：ST 在承担闲置产能费用的同时，维持 2025 年 $2.0-$2.3 billion 净 capex 计划；Infineon 将
              2025 财年投资削减至约 €2.3
              billion，同时仍在准备应对小幅收入下滑。没有已披露账面现金、补贴拨付表、债务额度、设备租赁或项目融资条款，外部人无法核验剩余建设如何融资。因此，承销姿态必须假设公司仍依赖持续融资：更多股权、更多国家支持、更多供应商信用，或这些方式的组合，很可能在完整
              6 英寸 / 8 英寸愿景实现经济去风险前仍然需要。
