      - number: '7.5'
        title: 缓释措施、监测指标与否决标准
        blocks:
          - type: paragraph
            body: >-
              缓释因素确实存在。AscenPower 已通过
              IATF16949，拥有可见运营足迹，且吸引了国资和战略投资者组成的财团，而不是依靠单一叙事轮融资。这些事实足以支持继续尽调，但不足以忽视否决标准。第一个击穿投资逻辑的信号在运营端：如果 6 英寸产线每月
              10,000 片和客户数量叙事无法转化为点名且已认证的汽车项目，那么 8 英寸故事就在 6 英寸故事可融资之前先到来。第二个击穿信号在市场时点：如果同行指标继续显示库存消化、需求疲软和既有厂商激烈防守成本，而
              AscenPower 仍需要新资本完成爬坡，公司可能会把更大直径 capex
              推进一个敌意的价格窗口。因此，正确姿态是带硬监测条件的支持，而不是盲信行业增长。下一轮尽调应聚焦点名客户结构、进口设备敞口、真实试产良率和一手工艺文件。
