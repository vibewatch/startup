      - number: '8.4'
        title: 能改变判断的因素很直接，且主要是财务问题
        blocks:
          - type: paragraph
            body: >-
              未解决的工作并不神秘。投资者不需要 50
              个新的尽调问题；他们需要一小组答案，把当前私有估值标记同经营证据和下行保护连起来。第一，股权结构必须变得可读：清算优先权、参与分配条款、反稀释，以及任何高级证券或项目层债务，都可能实质改变真实入场价格。第二，商业化桥梁必须量化，提供当前月出货、已接受客户项目、良率、ASP
              和毛利率证据。第三，可见轮融资与更大公开 capex 叙事之间的资金堆栈，需要用补贴时间表、租赁、供应商信用、项目融资或后续股权融资假设说清楚。最后，投资者需要知道 8
              英寸故事是近期价值创造者，还是叠加在尚未证明的 6
              英寸爬坡上的又一次资本催缴。如果这些问题回答得好，建议可以很快上调。否则，击穿投资逻辑的触发器很清晰：客户转化延迟、以弱条款引入新资本，或出现晶圆厂叙事跑在商业需求前面的证据。
