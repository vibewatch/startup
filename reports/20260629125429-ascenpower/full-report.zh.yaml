  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险框架与残余严重度概览
        blocks:
          - type: paragraph
            body: >-
              AscenPower 的风险画像主要被一个棘手的顺序问题主导：公司一边要证明车规级商业化，一边要为更大直径扩产融资；与此同时，外部 SiC 市场在消化库存，既有厂商在守成本位置，中国 OEM 也在学习把更多
              SiC 堆栈内化。公开证据足以说明，这是一条真实的晶圆厂爬坡：有真实员工、真实招聘、国资支持融资，以及一条已经越过建设阶段的产线。但这些证据还不足以证明 6 英寸产线已经转化为点名的汽车 SOP
              收入，也不足以证明 8 英寸计划不只是一个可信的相邻扩产方向。这个缺口重要，因为公开 capex
              叙事以数十亿元人民币计，而可见融资和点名客户证据仍窄得多。因此，残余严重度最高的地方，正是这些不确定性交汇之处：资本强度高但透明度不足，客户认证期里的集中度不透明，以及 8
              英寸路线图可能落入比募资故事暗示的更艰难的价格和需求窗口。
