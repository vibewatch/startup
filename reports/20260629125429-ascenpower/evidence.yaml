      Customer durability cannot be underwritten from sample-stage breadth alone; retention is the proof that a
      design-in becomes a recurring business.
    diligencePath: >-
      Ask management for segmented churn / retention metrics or, if too early for revenue cohorts, pipeline conversion
      and qualification attrition statistics.
    relatedQuestionRefs:
      - QU013
    relatedTableRefs:
      - TU004
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Named top customers, revenue concentration, and geographic split of active programs.
    whyItMatters: >-
