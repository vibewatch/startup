evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      Full board composition, independent directors, and investor-rights summary for the 2024 Series A and any
      subsequent secondary or strategic transactions.
    whyItMatters: Control, governance, and downside economics cannot be underwritten from current public sources.
    diligencePath: Request cap table, board roster, and financing documents in dataroom diligence.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, gross margin, cash balance, burn, and wafer-yield metrics.
    whyItMatters: >-
      The company may be industrially credible while still being financially fragile; valuation cannot be judged cleanly
      without operating metrics.
    diligencePath: Obtain management KPI pack and audited or investor-reporting financial statements.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named mass-production customers and dates for completed automotive verification.
    whyItMatters: Customer count without named production wins does not prove durable volume or pricing power.
    diligencePath: Request customer-reference list, design-win schedule, and PPAP / automotive verification status by program.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: minor
    topic: project-scale
    missingEvidence: Reconciled project-investment figure between the RMB7.5B and RMB9B public accounts.
    whyItMatters: The capital-intensity story shapes valuation, dilution risk, and subsidy assumptions.
    diligencePath: Confirm approved project budget and phase-by-phase capex plan with management or government filings.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Exact ownership percentages, board rights, liquidation preferences, and any commercial side letters for the
      visible investor syndicate.
    whyItMatters: >-
      The stakeholder map is intentionally partial because the public record names the syndicate but not the actual
      economic or control terms.
    diligencePath: Request full cap table, subscription documents, and shareholder-rights summary.
    relatedQuestionRefs:
      - QO008
      - QO023
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete founder, leadership, and board roster beyond the legal representative, chairman, and visible
      industrial-shareholder links.
    whyItMatters: >-
      The leadership table is intentionally partial because the public record does not surface a complete executive or
      governance stack.
    diligencePath: Request management-org chart, board roster, and biographies during dataroom review.
    relatedQuestionRefs:
      - QO006
      - QO023
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: china-merchant-sam
    missingEvidence: >-
      A public or paid-data source that isolates China or APAC merchant automotive-grade SiC revenue rather than broader
      SiC materials or global device markets.
    whyItMatters: >-
      Without a region- and application-specific dollar SAM, valuation still relies on layered market lenses rather than
      one tight market number.
    diligencePath: >-
      Request a paid market-cut or customer-qualified demand model segmented by China merchant automotive, renewable,
      and industrial SiC power devices.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: 8-inch-ramp-timing
    missingEvidence: Exact tool installation, pilot-yield, and customer-qualification milestones for AscenPower's reserved 8-inch line.
    whyItMatters: >-
      The 8-inch transition is the company's clearest path to lower cost per die, but public sources stop at a
      reserved-line narrative.
    diligencePath: >-
      Request the internal ramp plan, vendor tool list, and first-customer qualification schedule for the phase-two
      8-inch line.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: named-production-customers
    missingEvidence: >-
      Named mass-production customers, revenue concentration by segment, and evidence of repeat automotive or renewable
      shipments.
    whyItMatters: >-
      Customer names and segment mix are needed to translate design-house agreements into durable market share and
      pricing power.
    diligencePath: >-
      Ask management for current top customers, volume status by program, and which accounts are in sample,
      qualification, SOP, or repeat-production stages.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-scope-drift
    missingEvidence: >-
      A consistent vendor-neutral methodology that reconciles broad SiC-materials estimates with power-device and
      power-semiconductor estimates.
    whyItMatters: >-
      Scope drift is the main reason public TAM figures vary by multiple billions of dollars and can distort valuation
      framing.
    diligencePath: Normalize future market work to one scope definition before using any single TAM number in investment materials.
    relatedQuestionRefs:
      - QM004
      - QM005
      - QM006
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: yield-and-reliability
    missingEvidence: >-
      AscenPower-specific yield curves, defect densities, qualification pass rates, and package-reliability data by
      device family and wafer size.
    whyItMatters: >-
      Market demand alone will not convert into revenue if the company cannot ship automotive-grade devices at
      acceptable yield and field reliability.
    diligencePath: >-
      Request process KPIs, customer qualification status, and any field-return or failure-analysis data by product
      line.
    relatedQuestionRefs:
      - QM020
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: public-pricing
    missingEvidence: >-
      Public realized ASPs, contract terms, or program-level pricing for automotive SiC devices across the main vendor
      set.
    whyItMatters: >-
      Without realized pricing, it is hard to distinguish technology differentiation from simple capacity marketing or
      to judge margin headroom.
    diligencePath: >-
      Request customer contracts, design-win pricing bands, and module BOM assumptions under NDA; supplement with
      teardown or distributor-channel checks where possible.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: named-ascenpower-customers
    missingEvidence: >-
      Named mass-production automotive customers or public SOP proofs for AscenPower beyond pipeline counts and
      signed-customer references.
    whyItMatters: >-
      Qualification depth and customer concentration are central to whether AscenPower is a credible merchant winner or
      still an early pipeline story.
    diligencePath: >-
      Request named design wins, SOP dates, PPAP or automotive qualification milestones, and shipment mix by customer
      under diligence.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: minor
    topic: second-tier-domestic-peer-visibility
    missingEvidence: Direct public downstream device-roadmap evidence for CanSemi and finer-grained SICC positioning versus AscenPower.
    whyItMatters: >-
      These names can matter in domestic sourcing discussions, but open-web English evidence in this run was too thin to
      score them as first-order direct peers.
    diligencePath: >-
      Pull Chinese-language filings, product brochures, or customer references and verify whether either company
      competes mainly upstream, foundry-style, or as a merchant device vendor.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: named-production-customers
    missingEvidence: >-
      Named customers, binding purchase orders, or public production-shipment references that move beyond tape-out and
      sampling counts.
    whyItMatters: Customer-count headlines do not prove durable revenue, concentration, or utilization quality.
    diligencePath: Request top-10 customer list, qualification stage by program, and current booked-revenue contribution by customer.
    relatedQuestionRefs:
      - QI012
  - type: missing-source
    severity: material
    topic: non-equity-capital-stack
    missingEvidence: Debt facilities, subsidy award schedules, supplier-credit terms, and cumulative capex spent to date.
    whyItMatters: Without these items, the gap between disclosed equity and fab budget cannot be reconciled.
    diligencePath: Request debt schedule, subsidy agreements, equipment-finance contracts, and phase-one spend ledger.
    relatedQuestionRefs:
      - QI015
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Yield, ASP, gross margin, inventory turns, receivables, and payables by product family.
    whyItMatters: These are the variables that determine whether the fab can generate cash rather than only consume capital.
    diligencePath: Request operating KPI deck, gross-margin bridge, and monthly working-capital dashboard.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: Cash on hand, monthly burn, and 12-month liquidity forecast.
    whyItMatters: Runway is the most direct test of financing dependency and next-round timing.
    diligencePath: Request current cash balance, monthly cash-burn bridge, and board-approved financing plan.
    relatedQuestionRefs:
      - QI016
      - QI025
    relatedTableRefs:
      - TI005
      - TI006
  - type: missing-source
    severity: material
    topic: named-automotive-customer-proof
    missingEvidence: Named automotive SOP customers, platform names, and start-of-production dates tied to AscenPower devices.
    whyItMatters: >-
      Public customer counts and sample language do not show whether the company has converted engineering activity into
      durable automotive revenue programs.
    diligencePath: >-
      Request a named customer list with SOP dates, PPAP or customer audit milestones, and shipment evidence separated
      by automotive versus industrial end market.
    relatedQuestionRefs:
      - QE016
  - type: access-blocked
    severity: material
    topic: first-party-process-platform-disclosure
    missingEvidence: >-
      Readable first-party process-platform, manufacturing-excellence, or product-service pages from the official
      website.
    whyItMatters: >-
      Without accessible first-party process documentation, the chapter relies heavily on government, investor,
      recruiting, and media summaries for technical interpretation.
    diligencePath: >-
      Ask management for a PDF product catalog, process-platform deck, or mirrored site pages that can be reviewed
      without firewall blocking.
    relatedQuestionRefs:
      - QE025
  - type: missing-source
    severity: material
    topic: yield-reliability-and-8inch-readiness
    missingEvidence: >-
      Audited wafer-yield trends, patent identifiers, automotive reliability datasets, and 8-inch tool-install or
      pilot-run milestones.
    whyItMatters: >-
      Underwriting a power-device fab depends on repeatable yield, qualification progress, and roadmap realism, not only
      on capacity announcements or hiring breadth.
    diligencePath: >-
      Request monthly yield dashboards, reliability test summaries, patent lists, and a dated 8-inch project plan with
      equipment and customer-qualification milestones.
    relatedQuestionRefs:
      - QE026
    relatedTableRefs:
      - TE004
      - TE005
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Public or diligence-room evidence of repeat orders, renewal behavior, or multi-program expansion by cohort.
    whyItMatters: >-
      Without repeat-order proof, customer counts could still represent one-time samples rather than durable revenue
      relationships.
    diligencePath: >-
      Request cohort history showing first sample date, first paid shipment date, and follow-on order count for the top
      ten customer programs.
    relatedQuestionRefs:
      - QU012
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Retention metrics such as NRR, GRR, churn, win-loss, satisfaction, or referenceability by customer segment.
