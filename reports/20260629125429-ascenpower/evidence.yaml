      bargaining power and downside risk.
    diligencePath: >-
      Obtain a customer concentration schedule covering top-1, top-3, and top-5 exposure plus China versus overseas
      program share.
    relatedQuestionRefs:
      - QU014
    relatedTableRefs:
      - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-gap
