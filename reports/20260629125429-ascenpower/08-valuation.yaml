chapter:
  number: 8
  title: Valuation
  summary: AscenPower has credible public financing and unicorn-status anchors, but they are still milestone anchors rather than economics anchors. The explicit private price markers—RMB6 billion pre-money and above RMB7 billion post-money around the 2024 Series A, later reinforced by Hurun’s 2025 unicorn treatment—sit beside a much larger public capex narrative and a weak public disclosure record on shipments, yield, margins, and financing terms. Public SiC peer volatility, OEM verticalization, and capital-intensity risk therefore support a research-more recommendation, medium confidence, high risk rating, and stretched valuation stance until economics and terms become legible.
sections:
- id: valuation-anchors-and-entry-discipline
  title: Explicit Valuation Anchors Exist, but They Are Milestone Anchors Rather than Economics Anchors
  body: 'AscenPower does have real public valuation anchors; they are simply not the kind that let an investor underwrite intrinsic value with much confidence. The 2024 Series A is well corroborated at about RMB1 billion, and 36Kr adds the strongest explicit price marker by reporting a RMB6 billion pre-money and above-RMB7 billion post-money valuation. Hurun then provides a second public framing by defining unicorns as private companies worth at least US$1 billion and listing AscenPower among Guangzhou''s 2025 unicorn newcomers. Those facts matter because they show that the company is not being valued like an anonymous fab project. But they still do not answer the investor question that matters most: what cash-generating business has actually been proven at that price? The public record remains far stronger on milestone evidence than on economics. Registered capital, land, project budget, customer-count claims, and phase-one or phase-two capacity plans are all visible; realized shipments,
    ASPs, margins, yield, backlog quality, and preference stack are not. That is why the right posture is price discipline, not categorical enthusiasm. The current mark may yet prove justified, but it has not been publicly proven by revenue-quality disclosure.'
