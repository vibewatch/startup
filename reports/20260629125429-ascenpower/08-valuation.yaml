- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - What has to be true
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - 6-inch line converts customer pipeline into named SOP programs, margins become credible, and 8-inch expansion is funded without punitive dilution.
    - Current mark can be defended if operational proof turns milestone valuation into earnings power.
    - Yield, ASP, and customer concentration may still disappoint.
    - Needs several diligence gaps to close positively, so signal is not yet dominant.
  - - Base
    - The company keeps strategic relevance and industrial credibility, but public evidence on monetization and terms stays incomplete.
    - Treat the last round as a hold/track anchor rather than evidence that upside is mispriced.
    - Investors may overpay for strategic scarcity without seeing economics.
    - Most consistent with what the public record supports today.
  - - Bear
    - Customer conversion slips, incumbents and OEMs internalize more SiC value, and follow-on capital arrives on weaker terms.
    - Private mark compresses or gets subordinated by terms even if the fab remains technically real.
    - Dilution, preference overhang, and capex drag compound together.
    - Public peer volatility and disclosure gaps keep this case materially live.
  notes: Scenario logic stays qualitative because public sources do not disclose the revenue, margin, cap-table, or cash-flow inputs needed for a defensible numeric DCF.
