- id: final-diligence-asks-and-thesis-breakers
  title: What Would Move the Call Is Straightforward and Mostly Financial
  body: 'The unresolved work is not mysterious. Investors do not need fifty new diligence questions; they need a small set of answers that tie the current private mark to operating evidence and downside protection. First, the cap table has to be made legible: liquidation preferences, participating features, anti-dilution, and any senior securities or project-level debt can materially change the true entry price. Second, the commercialization bridge has to be quantified with current monthly shipments, accepted customer programs, yield, ASP, and gross-margin evidence. Third, the funding stack between the visible round and the much larger public capex narrative needs to be spelled out using subsidy schedules, leases, supplier credit, project finance, or follow-on equity assumptions. Finally, investors need to know whether the 8-inch story is a near-term value creator or just another capital call layered onto an unproven 6-inch ramp. If those questions are answered well, the recommendation can
    move quickly. If not, there are clear thesis-break triggers: delayed customer conversion, fresh capital raised on weak terms, or evidence that the fab story is outrunning commercial demand.'
  claimRefs:
