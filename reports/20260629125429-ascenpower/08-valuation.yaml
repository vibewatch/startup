tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Lens
  - Current view
  - Evidence basis
  - What would upgrade the call
  - What would downgrade the call
  rows:
  - - Recommendation
    - research-more
    - Public valuation anchors exist, but revenue-quality and term-sheet disclosure do not.
    - Named SOP customers, shipment data, yield, margin, and financing-stack disclosure.
    - Down-round terms, delayed customer conversion, or new capital raised before visible monetization.
  - - Confidence
    - medium
    - Financing, unicorn, and peer-volatility anchors are real, but core economics remain private.
    - Filing-grade or audited operating metrics.
    - Conflicting data on cap table, subsidies, or conversion quality.
  - - Risk rating
    - high
    - Capex intensity, peer volatility, OEM verticalization, and 200mm catch-up all pressure the thesis.
    - Proof of durable gross margin and customer concentration below feared levels.
    - Evidence of weak yields, concentrated demand, or punitive financing.
  - - Valuation stance
    - stretched
    - The >RMB7B private mark outruns public disclosure on revenue, margin, and senior securities.
    - Lower effective entry price or strong economics disclosure.
    - Any sign the next financing prices below the last round or adds heavy preference overhang.
  notes: This table summarizes the investment call, not management guidance; each row states what evidence would move the recommendation materially.
