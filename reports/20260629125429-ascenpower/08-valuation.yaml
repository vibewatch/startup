- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Commercial conversion miss
    - No named SOP customer evidence or shipment proof after additional capital is raised
    - Suggests capacity narrative is outrunning monetization.
    - Pause investment and re-underwrite as a capex story, not a growth story.
  - - Weak financing terms
    - New round includes heavy preferences, punitive anti-dilution, or obvious down-round economics
    - Raises the real entry price and can impair common-equity upside.
    - Avoid or require major price concession.
  - - Operating-economics miss
    - Yield, ASP, or gross-margin disclosure lands materially below what the current mark implies
    - Turns valuation from strategic scarcity to capital trap.
    - Downgrade to avoid until economics stabilize.
  - - Sector reset persists
    - Public SiC peers keep compressing while OEMs internalize more module value
    - Narrows exit windows and compresses acceptable entry multiples.
    - Move from research-more to avoid if AscenPower still cannot disclose monetization.
  notes: These triggers are intentionally monitorable and are framed to change the underwriting decision, not just the narrative tone.
  claimRefs:
  - CV033
  - CV034
  - CV041
  - CV044
  - CV045
  - CV046
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Cap table / preferences
    - Liquidation preference stack, participation, anti-dilution, and any senior securities from the 2024 round
    - Hidden seniority can make a nominal fair price economically unattractive.
    - Request current cap table, financing docs, and counsel summary.
  - - Current commercial output
    - Monthly shipments, accepted customer programs, backlog quality, and cancellation terms
    - Turns milestone valuation into revenue-quality evidence.
    - Obtain current operating dashboard and customer cohort detail.
  - - Unit economics
    - Wafer yield, scrap, realized ASP, gross margin, and working-capital turns
    - Determines whether the fab scales value or just capex.
    - Request plant KPI pack and CFO bridge.
  - - Funding stack
    - Subsidies, equipment leases, supplier credit, debt, and project-finance support versus the RMB7.5B+ buildout narrative
    - Determines dilution risk and effective cost of scaling.
    - Review grant files, lease schedules, debt terms, and local-government support letters.
  - - Customer proof
    - Named SOP customers, audit status, qualification stage, and concentration by program
    - Separates design-in enthusiasm from durable production demand.
    - Run customer reference calls and ask for signed-program evidence.
  notes: 'These asks are narrow on purpose: each one could move recommendation, confidence, or acceptable entry price in a single diligence cycle.'
