- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Current support
  - Counter-evidence
  - What would change the view
  rows:
  - - State-backed financing quality
    - Approx. RMB1B round with prominent policy and state-backed investors.
    - A strong investor roster does not prove attractive economics at the current mark.
    - Show that investor quality came with commercially disciplined terms and follow-on support.
  - - Real industrial asset build
    - Public sources support a large 6-inch fab, phase-one output targets, and a reserved 8-inch option.
    - The project budget is much larger than the visible equity layer, so scale can still become a financing burden.
    - Document the full funding stack and current utilization.
  - - Customer pipeline has signal
    - 10+ COT customers and 40+ signed or tape-out relationships indicate real market engagement.
    - Open sources still do not name a confirmed mass-production automotive OEM customer.
    - Provide named SOP programs and shipment volumes.
  - - Sector upside remains real
    - SiC is strategically important and leading peers still invest heavily in 200mm capacity.
    - Public peers also show downturns, restructuring, and violent valuation resets when monetization lags capex.
    - Show AscenPower can monetize through the cycle instead of simply expanding into it.
  notes: Each row pairs a real positive with the most relevant anti-thesis so the recommendation remains price-sensitive instead of narrative-led.
