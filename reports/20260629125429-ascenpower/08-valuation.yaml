  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-terms
    missingEvidence: Current cap table, liquidation preferences, participation rights, anti-dilution mechanics, and any senior securities from the 2024 round.
    whyItMatters: Nominal post-money valuation can overstate common-equity attractiveness if the preference stack is heavy.
    diligencePath: Request the latest cap table and round documents from finance and counsel.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: operating-economics
    missingEvidence: Current monthly shipments, accepted production programs, realized ASPs, gross margin, wafer yield, and scrap trend.
    whyItMatters: These metrics determine whether the current mark reflects a monetizing fab or only a milestone-rich asset build.
    diligencePath: Obtain the current plant KPI pack and monthly operating dashboard.
    relatedQuestionRefs:
    - QV030
  - type: private-evidence-only
    severity: material
    topic: financing-stack
    missingEvidence: Debt facilities, subsidies, leases, supplier credit, project-finance support, and timing assumptions bridging the gap between the round and the project budget.
    whyItMatters: Without the financing stack, investors cannot judge dilution risk or the true cost of the capex plan.
    diligencePath: Review grant files, debt schedules, lease commitments, and local-government support documents.
    relatedQuestionRefs:
    - QV031
  - type: private-evidence-only
    severity: material
    topic: named-sop-customers-tv004
    missingEvidence: Named SOP customers, customer concentration, qualification stage by program, and cancellation or take-or-pay terms.
    whyItMatters: Customer-count claims matter less than evidence of durable production demand and concentration quality.
    diligencePath: Run customer reference calls and review signed-program evidence.
    relatedQuestionRefs:
    - QV030
    - QV032
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: minor
    topic: expansion-sequencing
    missingEvidence: A board-approved timetable for 8-inch expansion and the capital triggers that would justify it.
    whyItMatters: The 8-inch story can be a value multiplier or a premature capital call depending on commercial timing.
    diligencePath: Request the approved capex roadmap and milestone gates for phase two.
    relatedQuestionRefs:
    - QV031
    - QV032
