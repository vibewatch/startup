- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public anchor
  - What it says about valuation discipline
  - Relevance to AscenPower
  - Limitation
  rows:
  - - AscenPower (private)
    - RMB6B pre-money and >RMB7B post-money in 2024 Series A
    - Private price anchor is explicit, but terms and economics are undisclosed.
    - Closest direct anchor for entry discipline.
    - No public revenue, margin, or preference disclosure.
  - - Infineon
    - ~US$117.29B market cap in June 2026
    - Scaled incumbents can command large equity values when disclosure and diversification are deep.
    - Shows the upper end of the disclosed public comp set.
    - Not a pure SiC company; far broader portfolio and maturity.
  - - STMicroelectronics
    - ~US$64.25B market cap in June 2026
    - Investors still reward diversified incumbents even after a 2024 drawdown.
    - Useful as a disclosed 200mm SiC investment comparator.
    - Broader MCU/analog/sensor mix limits like-for-like use.
  - - ON Semiconductor
    - ~US$34.38B market cap in June 2026 after 2024 revenue decline and 2025 uncertainty commentary
    - Public market can still price down-cycle risk while keeping strategic relevance.
    - Best disclosed automotive-power peer for cyclical caution.
    - Business mix extends beyond SiC.
  - - ROHM
    - ~US$12.72B market cap in June 2026
    - Even established SiC participants can trade far below Western mega-cap peers.
    - Shows a mid-scale listed comp with real SiC exposure.
    - Japanese conglomerate context and product mix differ.
  - - Wolfspeed
    - ~US$2.42B market cap in June 2026 and ~US$0.41B on one February 2026 snapshot
    - Pure-play SiC narratives can compress dramatically when capital structure and commercialization break.
    - Most direct public warning against paying for scarcity without economics.
    - Restructuring and Chapter 11 context make it a stress comp, not a normal multiple comp.
  notes: The table mixes private and public anchors deliberately; AscenPower lacks enough disclosed economics for a clean same-metric multiple bridge, so comparable use is about discipline and downside framing rather than direct arithmetic.
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful public and private valuation anchors reviewed for this chapter rather than every global SiC or power-semiconductor comparable.
