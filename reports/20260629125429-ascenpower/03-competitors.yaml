    {
      "id": "domestic-adjacencies-and-substitutes-expand-the-competitive-field",
      "title": "Domestic Adjacencies and Substitutes Expand the Competitive Field",
      "body": "The Chinese competitive field is broader than a narrow list of pure-play merchant SiC peers. SemiconductorX identifies SICC as a significant global SiC substrate supplier and BYD as a captive producer for its own EVs, while Li Auto’s Sanan-backed module effort shows how device supply and OEM integration can converge. Public English surfaces for Sanan IC and Silan point in different directions: Sanan’s English site emphasizes compound-semiconductor and RF front-end manufacturing, while Silan highlights a broader power-device stack including IPM, IGBT, MOSFET, and gate drivers for industrial and appliance use cases. That makes these companies important competitive adjacencies even when they are not perfect like-for-like AscenPower comps. They can still shape pricing, domestic sourcing preferences, and customer willingness to mix local suppliers, foundry partners, and substitute architectures. Public evidence was thinner in this run on CanSemi and on SICC’s downstream device roadmap than on the first-tier incumbents, so they belong on the watchlist, but the central competitive takeaway already holds: AscenPower competes inside a dense domestic ecosystem, not in a vacuum between itself and five Western names.",
