summary:
  headline: >-
    AscenPower has real policy-backed momentum, a credible automotive-grade SiC manufacturing buildout, and a publicly
    recognized unicorn narrative, but revenue opacity, customer-proof gaps, and heavy capex execution risk keep the
    company in RESEARCH-MORE territory rather than a high-conviction buy.
