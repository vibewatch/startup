  evidenceGaps:
  - type: missing-source
    severity: material
    topic: china-merchant-sam
    missingEvidence: A public or paid-data source that isolates China or APAC merchant automotive-grade SiC revenue rather than broader SiC materials or global device markets.
    whyItMatters: Without a region- and application-specific dollar SAM, valuation still relies on layered market lenses rather than one tight market number.
    diligencePath: Request a paid market-cut or customer-qualified demand model segmented by China merchant automotive, renewable, and industrial SiC power devices.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: 8-inch-ramp-timing
    missingEvidence: Exact tool installation, pilot-yield, and customer-qualification milestones for AscenPower's reserved 8-inch line.
    whyItMatters: The 8-inch transition is the company's clearest path to lower cost per die, but public sources stop at a reserved-line narrative.
    diligencePath: Request the internal ramp plan, vendor tool list, and first-customer qualification schedule for the phase-two 8-inch line.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: material
    topic: named-production-customers
    missingEvidence: Named mass-production customers, revenue concentration by segment, and evidence of repeat automotive or renewable shipments.
    whyItMatters: Customer names and segment mix are needed to translate design-house agreements into durable market share and pricing power.
    diligencePath: Ask management for current top customers, volume status by program, and which accounts are in sample, qualification, SOP, or repeat-production stages.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: minor
    topic: market-scope-drift
    missingEvidence: A consistent vendor-neutral methodology that reconciles broad SiC-materials estimates with power-device and power-semiconductor estimates.
    whyItMatters: Scope drift is the main reason public TAM figures vary by multiple billions of dollars and can distort valuation framing.
    diligencePath: Normalize future market work to one scope definition before using any single TAM number in investment materials.
    relatedQuestionRefs:
    - QM004
    - QM005
    - QM006
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: yield-and-reliability
    missingEvidence: AscenPower-specific yield curves, defect densities, qualification pass rates, and package-reliability data by device family and wafer size.
    whyItMatters: Market demand alone will not convert into revenue if the company cannot ship automotive-grade devices at acceptable yield and field reliability.
    diligencePath: Request process KPIs, customer qualification status, and any field-return or failure-analysis data by product line.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM004
