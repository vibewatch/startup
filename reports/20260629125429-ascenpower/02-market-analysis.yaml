callouts:
- calloutType: insight
  title: Why one TAM number is misleading
  body: The public record mixes at least three different scopes—broad SiC materials, power devices, and power semiconductors—so the chapter uses layered lenses instead of one inflated headline.
  claimRefs:
  - CM006
  - CM007
  - CM008
  - CM009
  - CM010
- calloutType: strength
  title: Why AscenPower is pointed at the right demand pools
  body: Its disclosed target uses—automotive-grade chips, photovoltaics, smart grids, and industrial control—sit inside the fastest-adopting power-conversion segments rather than peripheral SiC niches.
  claimRefs:
  - CM002
  - CM003
  - CM004
  - CM005
  - CM022
- calloutType: risk
  title: What can still break the merchant thesis
  body: If 8-inch economics, defect control, or automotive qualification slip while OEMs and incumbents lock up supply, market growth will not automatically translate into share for an independent entrant.
  claimRefs:
  - CM027
  - CM032
  - CM034
  - CM039
  - CM040
