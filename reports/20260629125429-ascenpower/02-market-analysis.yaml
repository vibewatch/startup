- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - EV volume growth and 800V platform migration
    - Driver
    - Current through late 2020s
    - Keeps automotive as the anchor demand pool for merchant SiC devices
    - Quantify how much of AscenPower's pipeline is tied to traction inverters versus other auto power stages
  - - APAC and China concentration
    - Driver
    - Current
    - China-centered EV and power-electronics demand makes domestic qualification strategically valuable
    - Confirm whether AscenPower's signed customers are design houses, tier-ones, or OEM captive programs
  - - PV, energy-storage, and charging efficiency needs
    - Driver
    - Current to medium term
    - Non-automotive programs widen SAM and can absorb merchant device supply earlier than some auto platforms
    - Ask for current revenue mix across automotive, PV/ESS, and industrial accounts
  - - 6-inch to 8-inch / 200mm migration
    - Driver and constraint
    - Medium term
    - Larger wafers are the path to lower cost per die and higher throughput, but execution risk is high
    - Get the exact tool set, yield targets, and qualification plan for AscenPower's reserved 8-inch line
  - - Physics-limited substrate growth and defect-driven yield
    - Constraint
    - Current
    - Upstream boule and epi bottlenecks can delay ramps even when device fabs are funded
    - Request substrate sourcing, defect-density, and yield trend data by node and wafer size
  - - OEM verticalization plus cyclical softness
    - Constraint
    - Current
    - Captive or locked-up supply and market downturns can compress merchant pricing and utilization
    - Validate whether AscenPower has long-term supply or program locks that survive pricing pressure
  notes: Each row links a market tailwind or bottleneck to a concrete diligence request so the market analysis stays tied to execution rather than abstract TAM language.
