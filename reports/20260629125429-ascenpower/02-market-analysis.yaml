- id: demand-drivers-and-wafer-transition
  title: Demand Drivers and the 6-inch to 8-inch Transition
  body: 'EV penetration remains the strongest near-term driver. The IEA recorded nearly 14 million electric-car sales in 2023, including 8.1 million in China, and TrendForce still expects global NEV sales to reach 23.35 million in 2026 even after a weak first quarter. TrendForce''s automotive SiC note says nearly all OEMs and tier-1 suppliers are already adopting or developing SiC components, while Zeekr, Nio, and Li Auto show why: faster charging, longer range, and higher-voltage architectures all pull more SiC into the drivetrain. Non-automotive demand is real but secondary: Infineon and ROHM both emphasize photovoltaics, energy storage, EV charging, and industrial power conversion, and Qingchun''s shipment claims show these categories are already commercial in China. On supply economics, 6-inch production still dominates current volume, but 8-inch and 200mm transitions are the industry''s main path to lower cost per die and higher throughput, which is exactly why AscenPower''s reserved
    8-inch phase matters even before it is online.'
