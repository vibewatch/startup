chapter:
  number: 2
  title: Market Analysis
  summary: 'AscenPower sells into the merchant silicon-carbide power-device stack, but the relevant market is narrower than generic ''SiC'' headlines imply: the near-term revenue pool is concentrated in EV traction and high-voltage power conversion, with renewables, energy storage, charging, and industrial drives as the next most relevant layers. Public sizing sources disagree sharply because they mix broad SiC materials markets, power-device markets, and power-semiconductor subsets; the defensible view is therefore a layered TAM/SAM/SOM lens anchored on applications, buyer programs, and disclosed capacity rather than one single number. Demand remains real, especially in China and APAC, but adoption is still constrained by wafer-transition economics, defect-driven yield, reliability, and OEM verticalization.'
sections:
- id: market-boundary-and-relevant-spend
  title: Market Boundary and Relevant Spend
  body: 'AscenPower does not compete in the full silicon-carbide materials universe. The relevant boundary is merchant SiC power-semiconductor spend tied to high-voltage power conversion: automotive traction inverters and onboard power electronics first, then photovoltaic inverters, energy-storage power conversion, industrial motor drives, smart-grid equipment, and charging infrastructure. Public product and application pages from Infineon and ROHM align closely with this boundary, while ResearchAndMarkets shows the same end markets in its power-semiconductor segmentation. The important exclusion is equally clear: abrasives, refractory materials, RF-only niches, and other non-power uses can make headline SiC market numbers look larger without improving AscenPower''s actual serviceable opportunity. Semiconductor Today''s profile of AscenPower also matters here because it places the company specifically in automotive-grade chips, photovoltaics, and smart-grid applications, reinforcing that
    the investable question is merchant power-device share in electrification, not generic SiC materials volume.'
  claimRefs:
