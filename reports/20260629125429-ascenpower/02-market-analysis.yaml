- id: tam-sam-som-lenses-and-estimate-discipline
  title: TAM, SAM, SOM Lenses and Estimate Discipline
  body: 'The public market-size record is too inconsistent to support one headline TAM. ResearchAndMarkets puts the SiC power-semiconductor market at $1.55 billion in 2025 and $1.95 billion in 2026, while TrendForce''s device lens is already at $5.33 billion by 2026 and Precedence Research places the broader SiC market at $4.64 billion in 2025 and $5.19 billion in 2026. FMI and VMR add still more spread because they include broader material and application definitions. That spread is not noise; it is evidence that broad TAM claims hide scope differences. For AscenPower, the defensible SAM is the merchant share of automotive, renewable, smart-grid, and industrial power-conversion demand, especially in APAC and China, not every global SiC use case. The current SOM is even narrower and best framed as a supply-side wedge: one publicly disclosed 240,000-unit 6-inch automotive-grade line, a reserved 240,000-unit 8-inch line, and signed design-house/customer agreements rather than a disclosed revenue-share
    figure.'
