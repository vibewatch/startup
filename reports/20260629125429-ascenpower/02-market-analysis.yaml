tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to AscenPower
  rows:
  - - Automotive traction and onboard power
    - SiC MOSFETs, diodes, modules for traction inverters, onboard chargers, DC/DC, high-voltage auxiliaries
    - General vehicle semis that do not require SiC power conversion
    - OEM platform teams, tier-one inverter/module suppliers, vehicle program P&L owners
    - Primary current demand pool and strongest valuation driver
  - - Renewable energy and storage power conversion
    - PV inverter stages, ESS PCS, grid-tied converters, EV-charging power stages
    - Commodity balance-of-system hardware outside the power stage
    - Inverter OEMs, PCS vendors, energy-electronics business units
    - Secondary but already commercial and aligned with AscenPower product claims
  - - Industrial drives and smart-grid power electronics
    - Motor drives, SMPS, rail/traction converters, smart-grid converters, industrial high-voltage stages
    - Low-voltage control ICs and non-power electronics
    - Industrial OEMs, automation suppliers, infrastructure program managers
    - Relevant adjacency, but usually more price sensitive than EV adoption
  - - Excluded / non-core SiC layers
    - None beyond directly power-conversion-relevant devices
    - Abrasives, refractories, RF-only niches, broad raw-material volumes, internal captive value not open to merchants
    - n/a
    - Excluded from serviceable market framing because they inflate TAM without improving merchant device revenue access
  notes: Defines the merchant power-device market that matters to AscenPower; broad SiC materials categories are intentionally excluded when they do not translate into merchant automotive or power-conversion demand.
