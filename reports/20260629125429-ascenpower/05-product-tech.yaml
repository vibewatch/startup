  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-automotive-customer-proof
      missingEvidence: Named automotive SOP customers, platform names, and start-of-production dates tied to AscenPower devices.
      whyItMatters: Public customer counts and sample language do not show whether the company has converted engineering activity into durable automotive revenue programs.
      diligencePath: Request a named customer list with SOP dates, PPAP or customer audit milestones, and shipment evidence separated by automotive versus industrial end market.
      relatedQuestionRefs:
        - QE016
    - type: access-blocked
      severity: material
      topic: first-party-process-platform-disclosure
      missingEvidence: Readable first-party process-platform, manufacturing-excellence, or product-service pages from the official website.
      whyItMatters: Without accessible first-party process documentation, the chapter relies heavily on government, investor, recruiting, and media summaries for technical interpretation.
      diligencePath: Ask management for a PDF product catalog, process-platform deck, or mirrored site pages that can be reviewed without firewall blocking.
      relatedQuestionRefs:
        - QE025
    - type: missing-source
      severity: material
      topic: yield-reliability-and-8inch-readiness
      missingEvidence: Audited wafer-yield trends, patent identifiers, automotive reliability datasets, and 8-inch tool-install or pilot-run milestones.
      whyItMatters: Underwriting a power-device fab depends on repeatable yield, qualification progress, and roadmap realism, not only on capacity announcements or hiring breadth.
      diligencePath: Request monthly yield dashboards, reliability test summaries, patent lists, and a dated 8-inch project plan with equipment and customer-qualification milestones.
      relatedQuestionRefs:
        - QE026
      relatedTableRefs:
        - TE004
        - TE005
