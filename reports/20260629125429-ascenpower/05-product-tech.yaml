    title: Trust / quality / compliance table
    columns:
      - Control or certification
      - Public status
      - Scope or signal
      - What it supports
      - Remaining gap
    rows:
      - - IATF16949
        - Passed / publicly disclosed
        - Government and investor sources say the company recently passed the automotive quality-management certification
        - Establishes a baseline automotive-quality operating system
        - No certificate number, audit scope detail, or surveillance cadence disclosed
      - - Quality-system lifecycle coverage
        - Publicly described
        - Sources say the system spans R&D, procurement, production, inspection, and after-sales
        - Suggests process discipline beyond one isolated production step
        - No public quality manual or process metrics disclosed
      - - Electrical / reliability test performance
        - Positive but qualitative
        - AB-SM says 1200V / 16mΩ / 35mΩ products showed good test data
        - Supports early sampling credibility
        - No public FIT, HTGB, HTRB, power-cycling, or AEC-style dataset disclosed
      - - Automotive qualification progress
        - In progress
        - Late-2024 sources say car-grade verification was still advancing toward batch vehicle introduction
        - Indicates the pipeline had moved past lab-only claims
        - Still no named SOP automotive customer or PPAP-style milestone evidence
    notes: Trust and quality controls are directionally credible, but the public layer is more certification-and-stage language than auditable metric disclosure.
