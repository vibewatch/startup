  - id: fab-buildout-and-operating-architecture
    title: Fab Buildout and Operating Architecture
    body: 'AscenPower''s strongest technical signal is not a public chip datasheet set; it is the operating shape of a fab that appears to be staffing, ramping, and integrating like a scaled manufacturing site. Registry and profile sources describe a licensed entity that can design, manufacture, sell, and import/export chips, while project coverage frames the buildout as a RMB7.5 billion program on roughly 150 mu with a phase-one 6-inch line and a planned phase-two 8-inch line. Multiple 2024 sources say the cleanroom started operating in late 2022, the line formally went online after about 15 months of construction, and the 6-inch line reached or was targeting 10,000 wafers per month. Hiring signals reinforce the manufacturing story: a live Liepin role asks for hands-on CVD/PVD optimization, mass-production problem solving, and yield improvement; campus recruiting spans process integration, process engineering, equipment, manufacturing, and CIM; and the CIM role explicitly mentions MES, APC, and EAP. Taken together, the architecture looks like a genuine fab ramp with process, automation, and NPI layers—not just a front-end product-marketing shell.'
