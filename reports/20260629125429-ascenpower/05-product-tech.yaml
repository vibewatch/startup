chapter:
  number: 5
  title: Product & Technology
  summary: 'AscenPower''s public product-technology record is strongest on automotive-grade SiC device scope, the 6-inch-to-8-inch manufacturing roadmap, and the operating signals of a real fab ramp rather than a paper design house. Government, investor, recruiting, trade-media, and peer technical sources support a coherent picture: marketed SiC SBD/JBS and MOSFET lines, recurring IGBT references in secondary materials, a 10,000-wafer-per-month 6-inch line in ramp, explicit IATF16949 quality-system disclosure, and a customer-validation stage that still sits between sample/tape-out proof and named automotive SOP proof. Relative to global incumbents already disclosing broader 200mm ecosystems, AscenPower currently looks more differentiated by domestic automotive-grade manufacturing capacity and foundry-style openness than by a publicly documented toolchain or application-support stack.'
sections:
  - id: product-families-and-use-case-fit
    title: Product Families and Use-Case Fit
    body: 'The public record describes AscenPower as a power-device manufacturer and R&D operator built around automotive-grade and industrial-control silicon carbide rather than around a generic semiconductor platform. Company-adjacent profiles and government or investor summaries repeat the same core families: SiC SBD/JBS and SiC MOSFET devices, while several secondary sources also add IGBT to the marketed lineup. The usage map is also consistent across sources: new-energy-vehicle main drive, industrial power, smart grid, photovoltaic systems, and later charging-related industrial deployment signals. The most specific public specification disclosure comes from a late-2024 industry profile that says the disclosed SBD and MOSFET lines span 650V to 1700V, while trade coverage of the mass-production line highlights 1200V parts and 16-milliohm / 35-milliohm variants. That combination matters because it frames the company less as a discrete-chip startup chasing one niche and more as an automotive and industrial power-device platform whose public product story is anchored in high-voltage SiC switching and rectification.'
    claimRefs:
