  - id: roadmap-and-differentiation-versus-peers
    title: Roadmap and Differentiation Versus Peers
    body: 'AscenPower''s public roadmap is clear enough to frame direction, but not detailed enough to prove execution. The near-term anchor is a 6-inch line ramping toward 240,000 wafers per year; the adjacent 8-inch line is publicly described as phase two, not as a currently qualified production line. Recruiting language about second- and third-generation process platforms, plus the president''s "open platform" framing, suggests the company wants to be more than a captive device line. Still, differentiation should be described carefully. ROHM publicly exposes a broader SiC ecosystem with device education, evaluation boards, simulations, and application support. Infineon publicly emphasizes a full supply chain, gate-driver matching, and decades of SiC heritage. ST is already public about 200mm SiC expansion and 2025 production timing. SemiconductorX''s industry framing says Chinese volume remains largely 150mm while the leading edge is migrating to 200mm. In that context, AscenPower''s public edge today looks domestic and tactical: an automotive-grade 6-inch manufacturing base, a plausible 8-inch roadmap, and enough hiring breadth to suggest an open manufacturing platform—but not yet the openly documented 200mm ecosystem depth of the global leaders.'
    claimRefs:
      - CE035
