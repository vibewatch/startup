  - id: quality-controls-and-customer-verification
    title: Quality Controls and Customer Verification
    body: 'Quality disclosure is public but still intermediate rather than complete. The clearest hard signal is IATF16949: both Nansha government and SDIC Venture Capital explicitly say AscenPower had passed the automotive quality-management certification. Their wording is useful because it does not stop at a badge; it says the system covers product R&D, procurement, production, inspection, and after-sales, which is a broader operational claim than a simple product-level test result. Public validation signals also show where the company stands commercially. Trade coverage says the announced 1200V line products had good test data and were being delivered to OEMs and customers for sample verification; one source says more than 10 COT customers were signed and four customer-specific programs were near mass production, while others say 40-plus customers had signed for tape-out and sampling. Late-2024 industry reporting adds that industrial and charging-related customer products using AscenPower chips had reached batch production, but public sources still stop short of naming a mass-production automotive customer. The quality-control story is therefore credible on system setup and sample-stage progression, yet still incomplete on named SOP wins and audited reliability metrics.'
