  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow or pain point
      - AscenPower role in the workflow
      - Publicly stated benefit
      - Limitation in public proof
    rows:
      - - NEV main-drive power conversion
        - OEMs need higher-voltage, higher-efficiency switching than classic silicon IGBT paths
        - Supplies automotive-grade SiC chips and sample-stage validation into the drivetrain stack
        - Better efficiency, charging, and power-density positioning are repeatedly attached to SiC adoption
        - Public sources do not name a production automotive SOP customer
      - - Industrial power supply / motor-control design
        - Designers need reliable high-voltage switching and rectification with manageable thermal load
        - SBD/JBS and MOSFET lines are positioned for industrial power applications
        - Industrial customer products are publicly said to have reached batch production
        - No public end-customer list or shipment volumes disclosed
      - - PV inverter / charging-pile platform build
        - Operators need higher efficiency and smaller high-power conversion stages
        - AscenPower chips are publicly placed into PV and charging-adjacent end markets
        - Late-2024 reporting says customer products have entered these terminals in batch
        - No public BOM-level or module-level reference design is disclosed
      - - SiC design-house tape-out / foundry engagement
        - Domestic design houses need wafer access, process support, and customer sampling throughput
        - Public sources say 40+ customers signed for tape-out or sample work and 10+ COT customers were signed
        - Open-platform positioning could create a broad domestic funnel beyond one captive OEM family
        - Contract terms, MPW structure, and repeat-order economics are not public
    notes: The workflow table is strongest where public sources describe use cases and customer-stage signals, and weakest where they would need named customers or design collateral.
    claimRefs:
      - CE004
      - CE022
      - CE027
      - CE028
      - CE029
      - CE030
      - CE031
      - CE043
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process component
      - Public role
      - Supporting signal
      - Dependency
      - Risk if weak
    rows:
      - - Device design and NPI
        - New-product introduction, structure optimization, and design-to-process transfer
        - Campus recruiting asks for project technical evaluation, device-structure analysis, and mass-production introduction
        - Requires tight coordination with integration and yield teams
        - Promising products stall before stable release
      - - CVD / PVD process module
        - Thin-film deposition and parameter optimization for stable production
        - Liepin role calls for daily CVD/PVD management, optimization, and mass-production issue solving
        - Depends on experienced tool operators and fast excursion response
        - Yield and cycle time deteriorate
      - - Process integration and yield analysis
        - Defect localization, stable process windows, and new-tech flow construction
        - Recruiting language explicitly mentions advanced data analysis and key yield-link diagnosis
        - Needs cross-functional data and disciplined SPC-style control
        - Public capacity claims do not translate into sellable die output
      - - CIM / factory-control software
        - MES, APC, and EAP maintenance plus new tool automation linkage
        - SCNU posting names MES/APC/EAP and equipment integration directly
        - Depends on equipment interfaces and process data cleanliness
        - Ramp loses traceability and repeatability
      - - Quality-system layer
        - Automotive-quality governance across R&D to after-sales
        - IATF16949 coverage is explicitly stated by government and investor sources
        - Depends on process discipline, documentation, and customer audit readiness
        - Automotive validation can slip even if wafer output grows
    notes: The architecture table is reconstructed from hiring and quality disclosures because direct first-party process pages were not readable in this run.
    claimRefs:
      - CE016
      - CE017
      - CE018
      - CE019
      - CE023
      - CE024
