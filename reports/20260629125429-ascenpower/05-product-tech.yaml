tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Product line / asset
      - Primary user or buyer
      - Public status / maturity
      - Evidence-backed differentiation
      - Diligence gap
    rows:
      - - SiC SBD / JBS
        - EV, industrial, PV power designers
        - Repeated core family in company-adjacent and independent profiles
        - Core rectifier family appears across government, investor, and recruiting materials
        - Need datasheets, qualification status, and customer design-win list
      - - SiC MOSFET
        - EV main-drive and high-voltage power customers
        - Repeated core family with disclosed 650V-1700V range and 1200V examples
        - Public narrative consistently positions MOSFETs at the center of the product story
        - Need device generations, package/module mapping, and lifetime-reliability disclosure
      - - IGBT references
        - Legacy or complementary high-power customers
        - Mentioned in several secondary sources but not universally repeated
        - Suggests broader power-device ambition than pure-SiC rectifiers/transistors alone
        - Need first-party confirmation that IGBT is an active shipping line rather than marketing carryover
      - - 6-inch automotive-grade line
        - Device-design houses, OEMs, and industrial programs
        - In ramp / mass-production stage with ~10k wafers per month publicly cited
        - Domestic auto-grade fab scale is the most defensible differentiation signal today
        - Need audited output, die yield, scrap, and customer qualification detail
      - - Adjacent 8-inch line
        - Future higher-volume SiC customers
        - Planned phase-two asset, not yet publicly proven as qualified production
        - Adjacent-site design shortens the roadmap from 6-inch to larger-diameter scaling if execution holds
        - Need tool-install, pilot-run, and customer-qualification milestones
      - - Open manufacturing / platform service
        - External chip-design and power-device customers
        - Implied by open-platform and tape-out language rather than by a public service catalog
        - Foundry-style positioning could widen the customer funnel beyond captive programs
        - Need MPW, shuttle, mask, PDK, and service-level documentation
    notes: This matrix separates repeatedly evidenced device families from roadmap or service claims that remain less directly documented.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE006
      - CE010
      - CE013
      - CE022
