callouts:
  - calloutType: strength
    title: What is genuinely differentiated today
    body: AscenPower’s strongest public differentiator is not abstract SiC enthusiasm; it is the combination of a real 6-inch automotive-grade fab ramp, explicit quality-system disclosure, and broad enough hiring to suggest a scaled manufacturing platform.
    claimRefs:
      - CE013
      - CE016
      - CE018
      - CE023
      - CE024
  - calloutType: risk
    title: Where the story still stops short
    body: The public record still stops at sampling, qualification, and roadmap language; it does not yet name an automotive SOP customer, disclose audited yield or patent detail, or prove 8-inch execution with public production milestones.
    claimRefs:
      - CE029
      - CE032
      - CE044
