chapter:
  number: 1
  title: Company Overview
  summary: 'AscenPower (Guangdong Xinyueneng Semiconductor, 芯粤能) is a Guangzhou Nansha-based automotive-grade SiC chip manufacturer founded in 2021 and publicly anchored by a roughly RMB1 billion Series A in September 2024. Registry, government, investor, media, and market sources support a coherent spine: automotive and industrial SiC products, a large-scale 6-inch/8-inch manufacturing buildout, IATF16949 certification, and later recognition as one of Guangzhou’s new unicorn entrants in Hurun’s 2025 index. The same record also preserves important diligence gaps on governance, revenue, named customers, and the exact realized economics behind the capacity narrative.'
sections:
- id: identity-footprint-and-core-products
  title: Identity, Footprint, and Core Products
  body: 'AscenPower—publicly rendered in English as Ascen Power or AscenPower and legally registered as Guangdong Xinyueneng Semiconductor Co., Ltd.—is a Guangzhou-based silicon-carbide chip company founded in May 2021. Registry-style sources align on the registered address at No. 10 Zhengxiang Road in Nansha District and on active operating status. CB Insights and the Nansha government both frame the company around automotive-grade and industrial-control silicon-carbide devices, not around a broad consumer-semiconductor strategy. The core product set that appears consistently across reviewed sources is SiC SBD/JBS diodes and SiC MOSFET power devices, with several secondary sources also adding IGBT to the marketed portfolio. The end markets are also stable across sources: new-energy-vehicle main drive, industrial power, smart grid, and photovoltaic systems. That scope matters because it places AscenPower in a part of the semiconductor stack where customers value reliability, qualification
    discipline, and manufacturing scale more than pure design novelty.'
