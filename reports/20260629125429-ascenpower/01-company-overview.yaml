- id: leadership-shareholders-and-governance-gaps
  title: Leadership, Shareholders, and Governance Gaps
  body: The visible leadership picture is thinner than the company’s manufacturing narrative. Public registry material identifies Xu Wei as legal representative, while open-web secondary sources identify Xiao Guowei as chairman. QCC surfaces a shareholder stack that includes Guangdong Xijuneng Semiconductor and Viridi E-Mobility Technology (Ningbo), and the Baidu Baike English entry goes further by linking Viridi to Geely and asserting a 40% stake. That Geely-adjacent industrial connection is directionally important for diligence because it suggests the company did not form in isolation from China’s EV supply chain. Even so, open sources do not disclose a full board, independent-director presence, liquidation stack, or governance rights attached to the 2024 round. For an investor, this means the public record is stronger on industrial alignment than on actual control. The governance picture is therefore still venture-style and opaque, not public-company-grade.
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO018
  - CO019
  tableRefs:
  - TO002
- id: series-a-capital-base-and-unicorn-anchor
  title: Series A, Capital Base, and Unicorn Anchor
  body: The most important public financing event is the late-September 2024 Series A. Government, investor, and media sources converge on an approximately RMB1 billion raise led by Guangdong IC Fund Phase II and SDIC Venture Capital, with a syndicate that included Shenzhen Capital, Guangzhou Industry Investment, a social-security-backed Bay Area science fund, Boyuan Capital, Fellow Partners, and Xichen Capital. The use of proceeds was framed consistently as capacity expansion plus domestic and overseas market development. 36Kr adds the strongest public valuation anchor from that financing window, reporting about RMB6 billion pre-money and above RMB7 billion post-money. That figure alone sits slightly below a clean US$1 billion threshold at contemporary exchange rates, but the later Hurun 2025 list resolves the direction of travel by defining unicorns as private companies worth at least US$1 billion and naming AscenPower as one of Guangzhou’s new entrants. The public capital story is therefore
    not just “well funded”; it is explicitly state-backed, policy-aligned, and later validated by a recognized unicorn index.
  claimRefs:
