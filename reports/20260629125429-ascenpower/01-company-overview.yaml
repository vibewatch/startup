- id: manufacturing-buildout-capacity-and-customer-signal
  title: Manufacturing Buildout, Capacity, and Customer Signal
  body: 'AscenPower’s public differentiation is manufacturing scale rather than stealthy IP rhetoric. EE Times China said the project formally went online on 15 March 2024 after roughly 15 months of construction and targeted 10,000 6-inch wafers per month at year-end. TrendForce’s March 2024 market summary added the clearest phase logic: phase one ramping toward 240,000 6-inch automotive-grade SiC chips annually by the end of 2024 and a reserved adjacent second phase designed for 240,000 8-inch chips annually once built. 36Kr characterized the overall project as a RMB7.5 billion program and one of the largest domestic dedicated automotive-grade SiC manufacturing projects, while Baidu Baike’s English entry offered a higher RMB9 billion / 480,000-wafer framing; that discrepancy is real and should be preserved rather than smoothed over. Customer disclosure is directional but incomplete: EE Times cited more than 10 COT customers and four near-term product programs, while 36Kr and TrendForce
    reported 40-plus signed customers and tape-outs across most domestic SiC design houses.'
