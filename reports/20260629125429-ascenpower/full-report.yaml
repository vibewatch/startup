              new-energy-vehicle main drive, industrial power, smart grid, and photovoltaic use cases. That implies at
              least four economically distinct customer cohorts: OEM and Tier-1 sample-verification programs that need
              qualified automotive-grade chips; SiC design houses or COT customers that need tape-out, wafer, and
              process access; industrial and PV power buyers that can adopt faster than car OEMs; and a smaller set of
              full-solution buyers if the company can sell chip-to-module capability via its parent ecosystem. The
              important caveat is that public evidence names segments and functions much more clearly than it names
              accounts or purchase volumes, so the chapter must separate segmentation proof from durable revenue proof.
