      - number: '1.5'
        title: Adverse Frame and Diligence Implications
        blocks:
          - type: paragraph
            body: >-
              The same evidence that makes AscenPower look important also defines its risk surface. Public sources do
              not disclose revenue, gross margin, cash runway, yield, or named mass-production automotive customers.
              TrendForce’s automotive SiC research is explicit that SiC still trails traditional IGBTs on cost and
              reliability even as adoption accelerates, which means qualification remains a barrier rather than a solved
              problem. At the sector level, STMicroelectronics is scaling 200mm SiC capacity in Europe, onsemi described
              2025 as an uncertain market downturn after a year of revenue decline, and Wolfspeed’s market-cap collapse
              shows how violently sentiment can compress in capital-intensive SiC. Chinese OEMs are also verticalizing:
              Li Auto’s in-house SiC module production is evidence that some of the most attractive downstream customers
              may try to internalize strategic supply. The result is a company overview that supports real industrial
              credibility, but not yet a clean underwriting case. The next diligence step is no longer “does this
              company exist?” but “how much of its announced capacity, customer pipeline, and qualification progress has
              translated into economically durable output?”
            claimRefs:
              - CO034
              - CO035
              - CO037
              - CO038
              - CO039
              - CO040
              - CO041
