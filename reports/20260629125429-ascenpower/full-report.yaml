      - number: '1.2'
        title: Leadership, Shareholders, and Governance Gaps
        blocks:
          - type: paragraph
            body: >-
              The visible leadership picture is thinner than the company’s manufacturing narrative. Public registry
              material identifies Xu Wei as legal representative, while open-web secondary sources identify Xiao Guowei
              as chairman. QCC surfaces a shareholder stack that includes Guangdong Xijuneng Semiconductor and Viridi
              E-Mobility Technology (Ningbo), and the Baidu Baike English entry goes further by linking Viridi to Geely
              and asserting a 40% stake. That Geely-adjacent industrial connection is directionally important for
              diligence because it suggests the company did not form in isolation from China’s EV supply chain. Even so,
              open sources do not disclose a full board, independent-director presence, liquidation stack, or governance
              rights attached to the 2024 round. For an investor, this means the public record is stronger on industrial
              alignment than on actual control. The governance picture is therefore still venture-style and opaque, not
              public-company-grade.
