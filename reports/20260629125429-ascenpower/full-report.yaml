chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Core Products
        blocks:
          - type: paragraph
            body: >-
              AscenPower—publicly rendered in English as Ascen Power or AscenPower and legally registered as Guangdong
              Xinyueneng Semiconductor Co., Ltd.—is a Guangzhou-based silicon-carbide chip company founded in May 2021.
              Registry-style sources align on the registered address at No. 10 Zhengxiang Road in Nansha District and on
              active operating status. CB Insights and the Nansha government both frame the company around
              automotive-grade and industrial-control silicon-carbide devices, not around a broad consumer-semiconductor
              strategy. The core product set that appears consistently across reviewed sources is SiC SBD/JBS diodes and
              SiC MOSFET power devices, with several secondary sources also adding IGBT to the marketed portfolio. The
              end markets are also stable across sources: new-energy-vehicle main drive, industrial power, smart grid,
              and photovoltaic systems. That scope matters because it places AscenPower in a part of the semiconductor
              stack where customers value reliability, qualification discipline, and manufacturing scale more than pure
              design novelty.
