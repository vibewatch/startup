      - number: '8.3'
        title: Bull and Bear Outcomes Are Both Real, so the Base Case Has to Stay Evidence-Constrained
        blocks:
          - type: paragraph
            body: >-
              The bull case is understandable. AscenPower has a state-backed round, an explicit private valuation
              anchor, a large published project budget, a real 6-inch automotive-grade capacity narrative, and
              customer-pipeline claims that suggest the company is not starting from zero. If the company can convert
              its visible customer funnel into named SOP programs, hold credible yield and margin, and fund any 8-inch
              expansion without punitive dilution, the current mark could eventually look reasonable. The problem is
              that the public record does not yet show those conditions. The base case therefore cannot assume
              software-like growth or clean foundry-like utilization; it has to treat the last round as a financing
              event, not as proof that the valuation is attractive. The bear case is also concrete rather than
              hypothetical: 200mm incumbents keep advancing, OEMs like Li Auto are internalizing more of the SiC stack,
              and public-market history shows that even central SiC names can re-rate violently when capex outruns
              monetization. That combination leads to one realistic conclusion. The company still merits active
              diligence because the asset build is real, but the recommendation should stay research-more, confidence
              medium, risk high, and valuation stance stretched until the economics catch up with the narrative.
