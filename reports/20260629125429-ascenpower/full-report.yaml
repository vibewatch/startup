      - number: '4.3'
        title: Visible Equity Capital Still Sits Well Below the Public Capex Narrative
        blocks:
          - type: paragraph
            body: >-
              The key financial question is not whether AscenPower has raised meaningful money—it has—but whether
              publicly visible financing is enough for the manufacturing ambition described in open sources. Government,
              investor, and media coverage converge on an approximately RMB1 billion Series A in late September 2024,
              led by Guangdong IC Fund Phase II and SDIC Venture Capital, with proceeds earmarked for capacity expansion
              and domestic and overseas market development. That is substantial early-stage financing, but it is still
              small relative to the fab narrative in circulation. Aiqicha and multiple trade sources describe a RMB7.5
              billion project, Semiconductor Today breaks phase one out at RMB3.5 billion, and a lower-quality secondary
              source lifts the top-line figure to RMB9 billion. On that public math alone, the 2024 raise is only a
              partial funding layer. Peer disclosures also show how expensive power-semiconductor capacity remains even
              at scale: ST kept a 2025 net-capex plan of $2.0-$2.3 billion while absorbing unused-capacity charges, and
              Infineon cut fiscal-2025 investments to about €2.3 billion while still preparing for a slight revenue
              decline. Without disclosed cash on hand, subsidy schedules, debt facilities, equipment leases, or
              project-finance terms, outsiders cannot verify how the remaining buildout is funded. The underwriting
              posture therefore has to assume continued financing dependency: either more equity, more state support,
              more supplier credit, or some combination of them will likely be needed before the full 6-inch/8-inch
              vision is economically de-risked.
