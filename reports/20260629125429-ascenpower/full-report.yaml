      - number: '8.2'
        title: Public Peer Volatility Makes Revenue Opacity More Dangerous, Not Less
        blocks:
          - type: paragraph
            body: >-
              Comparable public SiC names make the underwriting problem clearer. Listed peers disclose through earnings
              releases, annual filings, or investor-relations archives, and those disclosures show that valuation in
              this category can move violently even when the underlying technology case remains intact. onsemi reported
              lower 2024 revenue and called 2025 uncertain. CompaniesMarketCap's ST revenue history page likewise shows
              revenue falling from about $13.27 billion in 2024 to $11.80 billion in 2025, with only a partial TTM
              recovery to about $12.37 billion by June 2026. CompaniesMarketCap's Infineon revenue history page shows
              revenue falling from about $17.42 billion in 2023 to $15.82 billion in 2024 before recovering to about
              $17.18 billion on a June 2026 trailing-twelve-month basis. ST launched a manufacturing-footprint reset
              that still prioritizes 200mm SiC, which is a reminder that even scaled incumbents have to resize cost
              bases when end demand and returns wobble. Infineon, ST, onsemi, ROHM, and Wolfspeed all provide live
              market-cap anchors, and the dispersion is wide: roughly $117 billion at the high end for Infineon versus
              roughly $2.4 billion for Wolfspeed in June 2026, with Macrotrends showing Wolfspeed as low as about $0.41
              billion earlier in 2026. SemiconductorX frames why this matters for a private merchant supplier: the 200mm
              transition remains the key near-term cost and throughput variable, while Chinese scaling and Wolfspeed's
              restructuring show how quickly the narrative can turn from scarcity premium to oversupply and financing
              stress. In that context, opacity at AscenPower should be penalized rather than ignored.
