  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct Set and Public Scale Gap
        blocks:
          - type: paragraph
            body: >-
              Public sources place AscenPower in the merchant automotive-grade SiC device set, but at a very different
              maturity level from the global incumbents that anchor buyer shortlists. CB Insights and EE Times China
              frame the company around automotive and industrial-control SiC chips rather than around a broad analog or
              MCU portfolio, and EE Times plus TrendForce give the clearest public operating signals: a current 6-inch
              line, a year-end target around 10,000 wafers per month or 240,000 annualized units, and an adjacent
              planned 8-inch line. That is meaningful for a 2021-founded Chinese Series A company, yet the scale gap
              versus public peers is still large. Infineon, STMicroelectronics, onsemi, and ROHM all sit on
              multi-billion-dollar revenue or market-cap bases, while Wolfspeed, despite financial stress, still brands
              itself as a global SiC leader spanning materials and power devices. The practical conclusion is that
              AscenPower is entering a market where customers can benchmark it not only against Chinese peers, but
              against vendors with longer qualification histories, broader ecosystems, and more disclosed industrial
              scale.
