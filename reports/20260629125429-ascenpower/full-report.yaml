companyProfile:
  summary: >-
    AscenPower (广东芯粤能半导体有限公司, 芯粤能) is a Guangzhou Nansha-based silicon carbide chip manufacturer founded in 2021 to
    serve automotive and industrial power applications. Public sources consistently place the company in
    automotive-grade SiC SBD/JBS and MOSFET devices, with several secondary sources also citing IGBT, and position the
    business around a large domestic manufacturing ramp rather than a pure fabless design model. The company completed
    an approximately RMB1 billion Series A in September 2024 led by Guangdong IC Fund Phase II and SDIC Venture Capital,
    later appeared as one of Guangzhou's new unicorn entrants in Hurun's 2025 commentary, and is building a project
    publicly described as targeting 240,000 6-inch and 240,000 8-inch automotive-grade SiC chips annually.
  foundedDate: '2021-05-17'
  foundingLocation: Nansha District, Guangzhou, China
  headquarters: Nansha District, Guangzhou, China
  productSummary: >-
    Automotive-grade and industrial-control silicon carbide power devices and related chips, centered on SiC SBD/JBS
    diodes and SiC MOSFETs, for EV main drive, industrial power, smart-grid, and photovoltaic systems.
  customerFocus: >-
    EV OEMs, Tier-1 suppliers, SiC chip design houses, and industrial / grid / photovoltaic power-equipment customers
    that need automotive-grade or high-reliability SiC devices.
  businessModel: >-
    Capital-intensive semiconductor manufacturing and R&D: AscenPower builds and qualifies domestic SiC wafer and device
    capacity, then sells chips/power devices into long-cycle automotive and industrial qualification programs. Public
    sources suggest customer engagement through tape-outs, sampling, and qualification before full production
    conversion.
  stage: Series A / growth-stage manufacturing
  fundingStatus: >-
    Approximately RMB1 billion Series A announced in September 2024, co-led by Guangdong IC Fund Phase II and SDIC
    Venture Capital, with participation from Shenzhen Capital, Guangzhou Industry Investment, a social-security- backed
    Bay Area science fund, Boyuan Capital, Fellow Partners, and Xichen Capital. Open sources do not disclose the exact
    cap-table percentages, liquidation preferences, or any later post-Series-A financing.
