      - number: '3.5'
        title: Moat Durability and Commoditization Risk
        blocks:
          - type: paragraph
            body: >-
              The moat question for AscenPower is therefore narrower than the topline market-growth story. Multiple
              market trackers still see SiC expanding quickly and eight-inch migration improving economics, so the
              category is attractive. But growth does not automatically create durable startup differentiation.
              SemiconductorX argues that substrate access and 200mm execution, not just device design, shape long-run
              cost position. TrendForce preserves the adverse case that SiC still lags IGBT on cost and reliability.
              Wolfspeed’s reduced public equity scale, despite its leadership branding, shows how badly capital
              intensity can punish even a technically central player. Against that backdrop, AscenPower’s strongest
              public advantage is domestic auto-grade capacity buildout plus policy alignment and a future 8-inch
              option. Its weakest publicly supported moat claims are the ones investors usually care about most:
              globally proven qualification breadth, disclosed captive upstream control, named mass-production
              customers, and evidence that announced capacity already converts into pricing power or superior unit
              economics. The competitive verdict is not that AscenPower lacks a place; it is that commoditization
              pressure and incumbent response remain the base case until stronger proof appears.
