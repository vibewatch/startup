      - number: '3.2'
        title: Incumbent Moats Come from Supply Control and 200mm Execution
        blocks:
          - type: paragraph
            body: >-
              The incumbent moat in SiC is less about a single transistor spec and more about control of the
              manufacturing stack. Infineon explicitly markets complete supply-chain ownership and more than two decades
              of SiC heritage. ROHM says it independently develops the chain from wafer fabrication through packaging
              and quality control. ST is reinforcing the same integrated-device-manufacturer logic with planned
              investment in 200mm silicon-carbide capacity and a stated Q4 2025 start for 200mm wafer production in
              Catania. SemiconductorX’s industry synthesis makes the strategic consequence explicit: substrate access
              and the 150mm-to-200mm transition are the key near-term cost and throughput variables, and operators that
              complete 200mm ramp gain a structural advantage over vendors still centered on 150mm or 6-inch lines.
              AscenPower’s public story is therefore strong on domestic capacity ambition, but still thin on the
              specific ingredients that make an incumbent moat durable: captive substrate access, published 200mm
              execution, and a broad module, driver, and long-cycle automotive qualification stack.
            claimRefs:
