      - number: '1.3'
        title: Series A, Capital Base, and Unicorn Anchor
        blocks:
          - type: paragraph
            body: >-
              The most important public financing event is the late-September 2024 Series A. Government, investor, and
              media sources converge on an approximately RMB1 billion raise led by Guangdong IC Fund Phase II and SDIC
              Venture Capital, with a syndicate that included Shenzhen Capital, Guangzhou Industry Investment, a
              social-security-backed Bay Area science fund, Boyuan Capital, Fellow Partners, and Xichen Capital. The use
              of proceeds was framed consistently as capacity expansion plus domestic and overseas market development.
              36Kr adds the strongest public valuation anchor from that financing window, reporting about RMB6 billion
              pre-money and above RMB7 billion post-money. That figure alone sits slightly below a clean US$1 billion
              threshold at contemporary exchange rates, but the later Hurun 2025 list resolves the direction of travel
              by defining unicorns as private companies worth at least US$1 billion and naming AscenPower as one of
              Guangzhou’s new entrants. The public capital story is therefore not just “well funded”; it is explicitly
              state-backed, policy-aligned, and later validated by a recognized unicorn index.
