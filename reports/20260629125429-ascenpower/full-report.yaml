              cleanroom entered operation in November 2022, the line reportedly went online in March 2024 after about 15
              months of construction, monthly 6-inch capacity reached roughly 10,000 pieces, and phase-one annual output
              was framed at 240,000 6-inch automotive-grade SiC chips with a reserved phase-two plan for 240,000 8-inch
