            body: >-
              For diligence, the key technical question is no longer whether AscenPower has a real fab project—it almost
              certainly does—but whether the public milestones have matured into repeatable, automotive-grade economics.
              The open record preserves four material gaps. First, the company website pages that should have been the
              cleanest first-party process-platform evidence were crawler-blocked in this run, so direct
              company-authored confirmation of process and manufacturing claims remains incomplete. Second, public
              sources give customer counts, sample language, and near-mass-production program counts, but they do not
              name a mass-production automotive SOP customer. Third, the public record mentions good test data, patent
              accumulation, and reliable products, but it does not disclose audited yield curves, patent identifiers,
              PPAP or AEC-style detail, or wafer-level scrap trends. Fourth, the 8-inch phase is still a roadmap claim
              rather than a public tool-install, qualification, and output milestone set. Those gaps do not negate the
              product story, but they do keep technical conviction one layer below where an investor would want it
              before underwritable volume assumptions are locked in.
