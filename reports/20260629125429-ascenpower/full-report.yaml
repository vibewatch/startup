      - number: '6.4'
        title: Concentration Risk and OEM Vertical Integration
        blocks:
          - type: paragraph
            body: >-
              Customer-risk analysis is also shaped by what the open record implies about concentration. AscenPower's
              visible traction is overwhelmingly China-centered: trade sources say the 40-plus signed tape-out customers
              cover most domestic SiC design houses, later financing coverage keeps emphasizing domestic and overseas
              market expansion rather than existing global diversification, and one shareholder line from 36Kr links the
              cap table to Geely's Viridi E-Mobility ecosystem without proving a Geely volume account. That means the
              best supported reading is domestic concentration with unclear customer mix and unclear top-account
              exposure. Meanwhile, the external risk backdrop is not passive. TrendForce's 2026 NEV data, onsemi's 2024
              results, and ST's manufacturing-footprint reshaping all point to a market where major suppliers are still
              managing volatility and timing risk. More importantly, BYD and Li Auto are openly moving deeper into
              in-house SiC or broader semiconductor self-sufficiency, while Geely and onsemi show how earlier
              system-level co-design can pull bargaining power toward OEMs and large IDMs. In that setting, AscenPower's
              real customer challenge is not only winning sample programs but converting them before vertical
              integration, domestic cyclicality, and opaque account concentration compress the opportunity set.
