  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization Exists, but Revenue Quality Is Still Undisclosed
        blocks:
          - type: paragraph
            body: >-
              The public record is sufficient to describe what AscenPower is supposed to monetize, but not how much that
              monetization is worth. Registry and company-profile materials describe a business scope spanning chip
              design, chip manufacturing, and chip sales, while trade coverage consistently narrows the practical
              product set to automotive- and industrial-grade SiC SBD/JBS diodes, MOSFETs, and some IGBT references.
              That supports a revenue model built around foundry-like wafer or chip output plus discrete-device sales
              rather than software-like recurring revenue. What it does not support is pricing power: no reviewed source
              discloses list pricing, realized ASPs, contract duration, shipment mix, returns, or revenue-recognition
              policy. The result is that the chapter can explain how customer design-ins should become revenue, but it
              cannot underwrite the quality of that revenue. Public traction therefore has to be inferred from
              operational proxies—capacity, customer counts, qualification milestones, and hiring scale—rather than from
              disclosed income-statement metrics.
