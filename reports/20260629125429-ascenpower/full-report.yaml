      - number: '3.3'
        title: Switching Costs Are Real, but OEMs Are Pushing Back
        blocks:
          - type: paragraph
            body: >-
              Automotive SiC does have genuine switching costs, but they are not absolute. TrendForce notes that OEMs
              and Tier-1s are already deeply involved in SiC module design and related packaging decisions, which means
              qualification, packaging, and platform voltage architecture matter as much as the underlying die. The
              Zeekr-onsemi long-term supply agreement shows how those decisions can crystallize into vendor-specific
              procurement and 1200V device roadmaps. Official vendor pages from Infineon and ROHM also pair devices with
              complementary driver or module ecosystems, reinforcing stack-level lock-in once a customer designs around
              a family. At the same time, the same market is generating its own antidote to lock-in. TrendForce says SiC
              still trails IGBTs on cost and reliability, preserving a cheaper status-quo substitute in some
              applications, while Li Auto and Nio show that OEMs are willing to internalize modules or at least internal
              design control when EV volume justifies it. For AscenPower, that means qualification can create
              stickiness, but no startup can assume those relationships stay merchant and uncontested forever.
