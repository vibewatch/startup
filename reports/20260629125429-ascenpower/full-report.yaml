      - number: '4.4'
        title: Peer Downturn Signals Make Revenue Opacity More Dangerous
        blocks:
          - type: paragraph
            body: >-
              The missing financial disclosures would matter less if the surrounding SiC cycle were straightforwardly
              favorable. It is not. Independent market sources still show secular growth in SiC demand and EV adoption,
              but they also preserve the near-term volatility that can punish undercapitalized manufacturers. TrendForce
              says first-quarter 2026 NEV sales fell 2% year over year and that upstream cost pressure is pushing
              against auto demand. onsemi’s first-quarter 2025 results still showed $1.45 billion of revenue and $455
              million of free cash flow, yet management said the company was navigating a downturn through footprint
              discipline. ST’s first-quarter 2025 results similarly showed revenue down 27.3% year over year, only 33.4%
              gross margin, and 420 basis points of unused-capacity pressure in second-quarter guidance, while Infineon
              cut fiscal-2025 investment plans to about €2.3 billion and now expects a slight annual revenue decline.
              Meanwhile, Wolfspeed’s market capitalization had fallen to roughly $0.41 billion by early February 2026.
              The same chapter also needs to account for customer bargaining power: Li Auto, NIO, and Zeekr-related
              disclosures show OEMs internalizing SiC modules or securing long-term incumbent supply, and public-market
              data still values those OEMs at roughly $11.80 billion, $12.30 billion, and $6.84 billion, respectively,
              with onsemi itself around $34.38 billion. For AscenPower, that means the remaining diligence burden is
              fundamentally financial. Until revenue conversion, gross margin, yield, working-capital needs, and
              financing stack are disclosed, the company looks more like a promising asset build than a fully
              underwritable operating business.
