  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Relevant Spend
        blocks:
          - type: paragraph
            body: >-
              AscenPower does not compete in the full silicon-carbide materials universe. The relevant boundary is
              merchant SiC power-semiconductor spend tied to high-voltage power conversion: automotive traction
              inverters and onboard power electronics first, then photovoltaic inverters, energy-storage power
              conversion, industrial motor drives, smart-grid equipment, and charging infrastructure. Public product and
              application pages from Infineon and ROHM align closely with this boundary, while ResearchAndMarkets shows
              the same end markets in its power-semiconductor segmentation. The important exclusion is equally clear:
              abrasives, refractory materials, RF-only niches, and other non-power uses can make headline SiC market
              numbers look larger without improving AscenPower's actual serviceable opportunity. Semiconductor Today's
              profile of AscenPower also matters here because it places the company specifically in automotive-grade
              chips, photovoltaics, and smart-grid applications, reinforcing that the investable question is merchant
              power-device share in electrification, not generic SiC materials volume.
            claimRefs:
