      - number: '2.3'
        title: Buyer Segmentation and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is segmented by platform program, not by generic semiconductor demand. In EVs, the economic
              buyer is usually the OEM vehicle platform or a tier-one inverter/module partner, while the user is the
              power-electronics engineering team proving range, heat, and charging gains on 800V or higher-voltage
              architectures. In renewables and storage, the buyer is typically a product-line owner at a PV inverter or
              power-conversion-system vendor, with application engineers as the user and P&L owners as the payer.
              Industrial drives and other power-conversion programs are more price sensitive and often adopt SiC only
              when efficiency, thermal density, or form-factor gains clearly outweigh cost. The adoption path also
              differs from software-style selling: design-in, module validation, automotive verification, and secured
              production allocation all matter before revenue scales. That is why Nio, Li Auto, Zeekr, and Qingchun are
              useful market evidence: they show that buyers are increasingly treating SiC as a platform-critical
              supply-chain choice rather than a commodity component purchase.
            claimRefs:
              - CM011
              - CM015
              - CM016
              - CM017
              - CM018
              - CM019
