              Because AscenPower does not publish revenue or margin, the best public traction indicators are
              balance-sheet-adjacent and operating-footprint signals. QCC shows registered capital of RMB457.93 million
              and 621 insured staff in the 2025 filing window, while Aiqicha describes a 150-acre project with a total
