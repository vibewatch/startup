        title: Exhibits
        blocks:
          - type: callout
            title: Why the story matters
            body: >-
              AscenPower is not just a design-house narrative: the public record repeatedly frames it as a
              capacity-heavy automotive-grade SiC manufacturing project with national and provincial backing.
