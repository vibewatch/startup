      - number: '7.3'
        title: Commercial Opacity, Customer Concentration, and OEM Vertical Integration
        blocks:
          - type: paragraph
            body: >-
              The commercial risk is less about a total absence of demand than about who actually controls the demand
              and how visible that control is. Public sources do show a pipeline: more than 10 COT customers, four
              near-mass-production customer-specific programs, and more than 40 tape-out customers. But those same
              sources do not identify a named automotive SOP customer or disclose any top-customer revenue mix. That
              means investors cannot tell whether the pipeline is diversified and sticky or whether it is still
              clustered in a handful of engineering engagements. The context is worsening, not improving. Li Auto says
              its own SiC modules and chips are already mass-produced in-house, BYD says its latest EV platform includes
              new SiC power chips, NIO continues to push its own module roadmap, and Zeekr secured long-term incumbent
              supply. Those moves do not eliminate merchant demand, but they reduce the pricing power and strategic
              leverage available to a startup fab whose best public evidence still sits at the sample and qualification
              layer. If AscenPower’s earliest large accounts are also its strongest potential insourcers, concentration
              risk and bargaining-power risk become the same problem.
