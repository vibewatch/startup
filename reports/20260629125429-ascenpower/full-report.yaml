  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Explicit Valuation Anchors Exist, but They Are Milestone Anchors Rather than Economics Anchors
        blocks:
          - type: paragraph
            body: >-
              AscenPower does have real public valuation anchors; they are simply not the kind that let an investor
              underwrite intrinsic value with much confidence. The 2024 Series A is well corroborated at about RMB1
              billion, and 36Kr adds the strongest explicit price marker by reporting a RMB6 billion pre-money and
              above-RMB7 billion post-money valuation. Hurun then provides a second public framing by defining unicorns
              as private companies worth at least US$1 billion and listing AscenPower among Guangzhou's 2025 unicorn
              newcomers. Those facts matter because they show that the company is not being valued like an anonymous fab
              project. But they still do not answer the investor question that matters most: what cash-generating
              business has actually been proven at that price? The public record remains far stronger on milestone
              evidence than on economics. Registered capital, land, project budget, customer-count claims, and phase-one
              or phase-two capacity plans are all visible; realized shipments, ASPs, margins, yield, backlog quality,
              and preference stack are not. That is why the right posture is price discipline, not categorical
              enthusiasm. The current mark may yet prove justified, but it has not been publicly proven by
              revenue-quality disclosure.
