- id: TI002
  title: Pricing / monetization table
  columns:
  - Commercial lever
  - What public sources say
  - What remains unknown
  - Implication
  - Source posture
  rows:
  - - List pricing
    - No reviewed source publishes a price list for wafers, die, or packaged SiC devices
    - No list price, floor price, or discount schedule
    - Cannot benchmark pricing power versus peers
    - Adverse by omission
  - - Realized ASPs
    - No source discloses realized average selling prices
    - ASP by voltage class, device type, or customer
    - Revenue cannot be translated from capacity claims
    - Adverse by omission
  - - Contract model
    - Sources mention signed customers, tape-outs, sampling, and automotive verification
    - Purchase commitments, take-or-pay terms, or multi-year contracts
    - Customer-count claims may overstate near-term revenue certainty
    - Mixed
  - - Recognition timing
    - No public disclosure explains when sampled or tape-out work becomes recognized revenue
    - Milestone billing, inventory ownership, and acceptance terms
    - Pipeline milestones cannot be mapped into booked revenue
    - Adverse by omission
  - - Export / overseas monetization
    - Series A proceeds explicitly include domestic and overseas market development
    - Export share, channel economics, and certification bottlenecks
    - International expansion may consume cash before it generates revenue
    - Mixed
  notes: This is a visibility table, not a pricing table in the classical sense; the public record mostly documents what is missing rather than usable commercial terms.
