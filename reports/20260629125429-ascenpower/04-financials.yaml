- id: fab-scale-and-public-traction-proxies
  title: Fab Scale, Headcount, and Customer Pipeline Are the Main Public Traction Proxies
  body: 'Because AscenPower does not publish revenue or margin, the best public traction indicators are balance-sheet-adjacent and operating-footprint signals. QCC shows registered capital of RMB457.93 million and 621 insured staff in the 2025 filing window, while Aiqicha describes a 150-acre project with a total planned investment of RMB7.5 billion. Trade coverage adds unusually specific manufacturing milestones: the cleanroom entered operation in November 2022, the line reportedly went online in March 2024 after about 15 months of construction, monthly 6-inch capacity reached roughly 10,000 pieces, and phase-one annual output was framed at 240,000 6-inch automotive-grade SiC chips with a reserved phase-two plan for 240,000 8-inch chips. These are meaningful industrial signals because they imply real asset deployment and some process maturity. But they are still not financial proof. Customer counts are disclosed as 10-plus COT customers in one trade source and 40-plus signed customers or
    tape-outs in others, yet named high-volume production contracts remain scarce. In other words, the public story is stronger on installed capability than on monetized throughput.'
