- id: TI006
  title: Public financial gaps table
  columns:
  - Missing metric or proof
  - Why it matters
  - Current public substitute
  - Risk if absent
  - Exact diligence path
  rows:
  - - Revenue and revenue mix
    - Needed to test whether the fab is commercially converting design-ins into sales
    - Customer-count and capacity claims
    - Could overstate commercial maturity
    - Request monthly revenue by product line and customer concentration schedule
  - - Gross margin and yield
    - Core test of manufacturing economics
    - None beyond process milestones
    - A high-capex fab can scale volume without acceptable margin
    - Request yield deck, scrap history, and gross-margin bridge
  - - Cash on hand and burn
    - Determines whether the next financing is imminent
    - A-round size and registered capital only
    - Runway may be much shorter than project narrative implies
    - Request cash balance, monthly burn, and 12-month cash forecast
  - - Debt, supplier credit, and subsidies
    - Changes real capital structure and downside seniority
    - State-backed investor roster implies support but not obligations
    - Hidden leverage or conditional subsidies may distort risk
    - Request facility agreements, subsidy awards, and capex reimbursement schedule
  - - Named production customers and binding orders
    - Separates tape-out activity from recurring revenue
    - 10+ / 40+ customer-count claims
    - Utilization and ASP assumptions remain speculative
    - Request top-customer list, contract status, and qualification stage by program
  notes: These gaps are the shortest path from an asset-build narrative to an investable financial model; until they are closed, the chapter’s verdict must stay cautious.
  claimRefs:
