- id: TI005
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Evidence quality
  - Financial read-through
  - Key diligence ask
  rows:
  - - Latest disclosed equity financing
    - Approx. RMB1B Series A
    - High
    - Meaningful policy-backed capital injection but still only a partial funding layer for a large fab
    - Provide round close date, cash proceeds net of fees, and current cash balance
  - - Lead investors
    - Guangdong IC Fund Phase II and SDIC Venture Capital
    - High
    - State-backed capital likely improves strategic support and follow-on access
    - Provide ownership percentages, board rights, and follow-on commitments
  - - Stated use of proceeds
    - Capacity expansion plus domestic and overseas market development
    - High
    - Cash is being allocated to both fixed assets and commercial expansion
    - Provide detailed spend schedule by equipment, hiring, and market buildout
  - - Phase-one capital plan
    - RMB3.5B first phase for 240k 6-inch annual line
    - Medium
    - Publicly visible phase one materially exceeds the A-round alone
    - Provide cumulative phase-one spend-to-date and remaining capex
  - - Full project budget
    - RMB7.5B in multiple sources; higher RMB9B secondary framing also exists
    - Medium
    - Full 6-inch/8-inch buildout likely requires multiple capital layers
    - Reconcile the authoritative total budget and committed funding sources
  - - Debt / project-finance obligations
    - Not publicly disclosed
    - Low
    - Unknown leverage could materially change runway and downside risk
    - Provide loans, leases, subsidies, guarantees, and covenant package
  notes: The table focuses on forward capital adequacy rather than repeating the full funding chronology from Chapter 1; the key issue is financing sufficiency versus project ambition.
