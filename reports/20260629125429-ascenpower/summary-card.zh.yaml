summary:
  headline: AscenPower 有真实政策动能、可信的车规级 SiC 制造建设，以及公开认可的独角兽叙事；但收入不透明、客户证据缺口和重资本开支执行风险，仍把公司留在继续研究区间，而非高确信买入。
