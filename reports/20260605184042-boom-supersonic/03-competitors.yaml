- id: SP002
  title: Readiness and certification posture still separate Boom from hype-only rivals, but not from execution risk
  body: 'Readiness is where the landscape starts to sort itself. Boom has a flown demonstrator in XB-1 and a declared engine program in Symphony, which gives it more visible progress toward an airline product than concept-only peers. But the FlightGlobal reporting is a reminder that this progress has not removed financing and sequencing risk: Boom still has to turn a supersonic demonstrator and engine work into a certified airliner. Hermeus looks faster in pure test cadence because Quarterhorse progressed from first flight to supersonic flight in 2026 and is operating with FAA experimental authorization, but that progress is attached to uncrewed and defense-oriented aircraft rather than a passenger-carrying airline certification path. Spike’s relaunch language, by contrast, reads like an earlier-stage program still building team, supplier, and capital foundations. X-59 is critical in a different way: it is the category’s low-boom regulatory benchmark. The FAA still keeps overland civil supersonic
    flight generally prohibited outside special authorizations, so readiness for any commercial program remains partly a policy question rather than a pure engineering one. Aerion and Exosonic show what happens when impressive narratives fail to cross that readiness gap.'
