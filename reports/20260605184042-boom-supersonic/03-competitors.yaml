- id: SP004
  title: Moat durability is real for Boom, but Aerion and Exosonic show how fragile speed narratives can be
  body: 'Boom does have a relative moat inside this landscape: it is closest to the airline buyer, has the clearest set of named commercial relationships, and has progressed further than most peers toward a certifiable commercial product. But the durable lesson from Aerion and Exosonic is that momentum does not equal survivability. Aerion had backlog language, suppliers, and a high-profile vision, yet still failed on financing and then liquidated. Exosonic combined defense support, venture backing, and subscale flight progress, but still fell into the classic valley between R&D and commercialization. Those outcomes matter for Boom because they show the category’s real bottleneck is not just whether a company can design a fast aircraft; it is whether it can keep capital, certification, and customer trust aligned for years. X-59 and 2026 legislative momentum may improve the regulatory backdrop, but that upside will be shared across the category rather than captured by Boom alone. The strongest
    underwriting conclusion is therefore nuanced: Boom likely leads this set, but its moat is durable only if it converts technical and commercial signals into certification-grade execution before the market loses patience.'
