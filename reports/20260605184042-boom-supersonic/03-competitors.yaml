- id: SP003
  title: Commercial model and buyer fit diverge sharply across Boom, Spike, Hermeus, and status-quo substitutes
  body: 'The commercial models on display are not interchangeable. Boom’s product is an airline fleet decision: carriers must underwrite route economics, premium yield, aircraft integration, and eventually delivery timing. Spike’s model is much narrower and more discretionary, built around private ownership and premium business travel for a 12- to 18-passenger jet. Hermeus today is not really selling a civil transport at all; its visible programs are defense-linked test and uncrewed aircraft, with civil transport positioned as a farther-out derivative. X-59 is purely a government research and standards-enabling program. Those differences matter because buyers do not switch among these options one-for-one. A corporate aviation buyer choosing between a Spike concept and a certified Gulfstream G700 faces a very different trade-off from an airline fleet planner evaluating Boom. The substitute pressure on Spike is immediate and concrete because the G700 is already certified, fast by business-aviation
    standards, and designed for the same high-end travel wallet. Boom’s harder problem is different: it must prove that commercial airlines will accept airline-grade development risk in exchange for materially faster routes.'
