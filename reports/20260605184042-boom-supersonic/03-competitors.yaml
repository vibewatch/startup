- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or advantage claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Boom’s airline relationships and order book
    - Orders / pre-orders may not convert into financed deliveries
    - High
    - Commercial traction is only durable if carriers stay committed through certification and delivery
    - Request firm-order, cancellation, and slot-conversion detail by airline
  - - Boom’s flown demonstrator and engine work
    - A demonstrator and engine announcement still leave full-aircraft certification and reliability ahead
    - High
    - Readiness can look stronger than it is if certification sequencing slips
    - Request integrated aircraft + engine test and certification schedule
  - - Low-boom regulatory upside
    - X-59 and legislation improve the whole category, not Boom alone
    - Medium
    - Shared infrastructure weakens any claim that policy upside is proprietary
    - Model Boom economics without assuming exclusive overland benefit
  - - Spike low-boom business-jet pitch
    - No public validation in the cited set that Spike is near civil certification or production
    - Medium
    - Noise and luxury claims can attract attention without reducing execution risk
    - Request acoustic data, certification path, and funded milestone plan
  - - Hermeus technical tempo
    - Defense-first momentum may not translate into airline certification or passenger economics
    - Medium
    - Fast flight-test learning does not automatically create a direct commercial threat to Boom
    - Separate technology adjacency from actual commercial substitutability
  - - Sector enthusiasm for speed
    - Aerion and Exosonic show category narratives can collapse before monetization
    - High
    - Capital continuity is a gating moat dimension across every high-speed entrant
    - Stress-test Boom runway, supplier resilience, and buyer patience against multi-year delays
  notes: Severity ratings are qualitative and focus on whether the risk directly weakens Boom’s comparative lead, not whether the underlying technology is interesting.
