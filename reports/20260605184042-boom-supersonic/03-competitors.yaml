chapter:
  number: 3
  title: Competitors
  summary: 'Boom is still the closest thing to a direct commercial supersonic contender because it alone combines airline-targeted packaging, a flown demonstrator, and named carrier commitments. Most other visible programs are adjacent rather than directly substitutable: Spike is pursuing a quiet business jet, Hermeus is advancing faster on defense-oriented high-speed flight test, X-59 is a regulatory benchmark, and Aerion plus Exosonic are warnings that narrative momentum can collapse before certification or monetization. The key competitive question is therefore less about who else can build something fast and more about who can align buyer fit, capital durability, and certification path long enough to deliver.'
sections:
- id: SP001
  title: 'Competitive universe: Boom is the direct airline contender, while most others are adjacent or substitute offers'
  body: Boom is the closest thing to a direct competitor in commercial supersonic transport because it is explicitly packaging Overture for airline fleet buyers, not just for wealthy individuals or government users. Boom’s own materials frame a 60- to 80-seat Mach 1.7 aircraft, 600-plus routes, and 130 orders or pre-orders tied to named airline relationships. That puts Boom in a different commercial lane from most of the surrounding field. Spike Aerospace is aiming at premium business-jet buyers; Hermeus is visibly centered on defense and high-Mach test aircraft; NASA and Lockheed’s X-59 is a regulatory data platform rather than a product for sale; and Aerion and Exosonic now function mostly as failure analogs. The most important practical substitute is therefore not another near-term supersonic airliner, but certified premium aircraft and private-aviation options that already exist. This matters because Boom’s competitive set is less about a crowded market of identical aircraft and more
    about whether buyers choose an airline-grade supersonic program over safer, certified, and already-available alternatives.
