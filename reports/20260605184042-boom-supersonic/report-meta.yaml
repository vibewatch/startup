companyProfile:
  summary: Boom Supersonic, founded in 2014 by Blake Scholl, is developing the Overture Mach-1.7 supersonic passenger jet
    with approximately 130 aircraft pre-orders from American Airlines, Japan Airlines, and United Airlines, and the Symphony
    engine. The company has raised $700M+ at a $1.5B post-money valuation, completed XB-1 supersonic demonstrator flights
    (Mach 1.122 in March 2024), and is targeting entry into commercial service in the early 2030s. The Superpower turbine
    program offers a nearer-term revenue bridge through power generation applications for data centers and the grid.
  foundedDate: '2014-01-01'
  founders:
  - name: Blake Scholl
    role: Founder & CEO
    background: Former Amazon engineer and commercial pilot who founded Boom with a mission to make supersonic travel affordable
      and sustainable for everyday passengers.
    claimRefs:
    - CO011
  foundingLocation: Denver, CO, USA
  headquarters: Centennial, CO, USA
  productSummary: Overture supersonic passenger jet (Mach 1.7, 64-80 seats, 4,250 nm range, SAF-compatible); Symphony jet
    engine; Superpower stationary turbine for data centers and power grids; manufactured at the Centennial Superfactory.
  customerFocus: Premium commercial airlines (American Airlines, Japan Airlines, United Airlines) and their transatlantic/transpacific
    business-travel passenger segments; Superpower targets data center and grid infrastructure operators.
  businessModel: Aircraft sales and leases plus engine and power-generation products; all Overture revenue post-EIS in the
    early 2030s; Superpower offers a nearer-term revenue pathway.
  stage: Series B, pre-revenue
  fundingStatus: $300M Series B December 2025 (Darsana Capital, Altimeter, ARK, Bessemer, Y Combinator); total $700M+ raised;
    $1.5B post-money valuation.
