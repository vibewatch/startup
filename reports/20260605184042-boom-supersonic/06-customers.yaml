  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: deposit terms
    missingEvidence: Exact deposit amounts, refundability schedules, and expiry dates for each airline commitment remain undisclosed.
    whyItMatters: Order-book quality depends on how much cash customers have truly put at risk and when they can walk away.
    diligencePath: Request executed commercial summaries or board materials that break out deposits, milestones, and cancellation rights by customer.
    relatedQuestionRefs:
    - QU003
    - QU014
    - QU024
    relatedTableRefs:
    - TU002
  - type: missing-source
    severity: material
    topic: customer reaffirmation
    missingEvidence: There is little recent public reaffirmation from airline management teams beyond Boom’s own continued references.
    whyItMatters: Stale commitments can remain headline assets long after internal airline enthusiasm changes.
    diligencePath: Check airline IR transcripts, fleet-planning commentary, and direct customer diligence calls for refreshed confirmation.
    relatedQuestionRefs:
    - QU012
    - QU024
    relatedTableRefs:
    - TU002
  - type: private-evidence-only
    severity: minor
    topic: route-level economics
    missingEvidence: Boom has not publicly disclosed per-route economics, assumed fares, or airline ROI thresholds by launch customer.
    whyItMatters: Premium demand may exist without airline-level profitability if fares, load factors, or SAF costs miss plan.
    diligencePath: Request launch-customer route models for at least one Atlantic and one Pacific route.
    relatedQuestionRefs:
    - QU009
    - QU025
