  - TU004
  figureRefs:
  - FU003
- id: concentration-risk-and-commercial-verdict
  title: Commercial validation is real, but concentration and conditionality keep the verdict cautious
  body: 'Boom’s customer proof is good enough to matter and concentrated enough to worry. The positive case is straightforward: three recognizable airlines have publicly attached their brands to Overture, and American plus Japan Airlines have gone beyond casual interest by pairing public commitments with financial consideration. That level of proof separates Boom from many speculative aerospace programs. The negative case is equally important. The 130-aircraft narrative is concentrated in a tiny set of carriers, American is the single largest public exposure, and public sources provide very little evidence that the commitments have deepened beyond the original announcements. Analysts such as Forecast International and Air52 still frame the order book as contingent rather than bankable because certification, economics, and timing all remain unresolved. Investors should therefore read the customer chapter as a qualified strength: airline demand exists, the target use case is coherent, and
    the brand validation is meaningful, but the entire book is still an option on future execution rather than evidence of present customer monetization. That is enough for diligence to continue, not enough for customer risk to disappear.'
