- id: conversion-path-and-manufacturing-readiness
  title: The path from airline intent to delivery still runs through certification and factory execution
  body: 'The biggest customer question is not whether airlines are curious about supersonic service; it is whether Boom can convert today’s agreements into delivered aircraft. That conversion path still has several hard gates: final aircraft definition, engine readiness, certification, production scheduling, and then actual airline delivery. Manufacturing progress helps. Boom completed the Overture Superfactory in June 2024 and says the first line is designed for 33 aircraft per year, which matters because customers can now underwrite against a visible production asset rather than a hypothetical factory slide. But factory completion does not erase the timeline gap. Boom remains years away from first delivery, and public sources still lack the details that usually signal a maturing aerospace backlog, such as delivery schedules by customer, escalation formulas, support contracts, or disclosed deposit economics. This makes the customer chapter inseparable from execution risk. Airlines have
    given Boom permission to keep building, but they have not yet given Boom proof that production and certification risk are behind it.'
  claimRefs:
  - CU015
  - CU016
  - CU017
  - CU028
  - CU035
  - CU036
