- id: route-economics-and-buyer-motivation
  title: Customer motivation is concentrated in premium time-saving routes rather than broad fleet replacement
  body: 'The airlines most visibly interested in Overture all share the same strategic logic: they operate premium-heavy long-haul networks where time savings can justify fare premiums. Boom’s route examples are not random. New York to London is the flagship case because halving a transatlantic business trip from about seven hours to roughly three-and-a-half or four hours creates a premium proposition that looks more like a corporate productivity product than a normal cabin upgrade. Los Angeles to Tokyo plays the same role on the transpacific side, with Boom marketing travel times around six hours versus roughly eleven on subsonic aircraft. Overture’s 64-to-80-seat layout, Mach 1.7 cruise speed, and 4,250-nautical-mile design range all reinforce this narrow customer target. This is not an aircraft for broad leisure-market deployment. It is meant for airlines trying to defend premium yield on flagship routes where speed matters more than seat density. That focus is strategically coherent,
    but it also means customer expansion depends on a relatively small pool of global carriers with premium brand positioning and strong business-travel demand.'
  claimRefs:
  - CU018
  - CU019
  - CU020
  - CU021
