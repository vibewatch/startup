      - number: '2.4'
        title: Growth drivers are tangible, but constraints still dominate the near-term market shape
        blocks:
          - type: paragraph
            body: >-
              There are clear demand-side reasons airlines and investors keep revisiting commercial supersonic travel.
              Time savings on long-haul routes are real, premium travelers exist, and sustainability positioning around
              SAF compatibility gives carriers a way to describe a modernized supersonic product rather than a simple
              Concorde remake. Government interest in speed and low-boom research also helps the narrative. But the
              constraint stack is still more concrete than the tailwind stack. Overland supersonic restrictions remain
              in force, legal and environmental barriers remain live, and quiet-flight rule changes are still policy
              aspirations rather than settled market inputs. Forecast International and Daily News both frame timeline
              and industrialization risk as material. The right conclusion is not that the market is absent, but that it
              remains regulation-bound, route-bound, and capital-intensive. That is enough for a niche market thesis,
              but not enough for a mass-adoption thesis.
