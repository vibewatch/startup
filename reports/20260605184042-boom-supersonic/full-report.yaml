  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The relevant market is premium supersonic transport, not the entire supersonic-jet universe
        blocks:
          - type: paragraph
            body: >-
              Headline industry reports use the phrase “supersonic jet market” broadly, but that framing is too loose
              for underwriting Boom. Public market reports include military, defense, and generalized supersonic
              categories that are not directly comparable to Boom’s intended commercial airliner business. Boom’s
              nearer-term market is much narrower: premium long-haul passenger transport on routes where airlines can
              monetize material time savings. That framing immediately excludes large parts of the reported TAM,
              especially military spend and other aircraft classes. It also clarifies the substitute set. Today’s actual
              alternatives are premium subsonic widebody cabins and some business-aviation use cases, not competing
              commercial supersonic fleets already in service. This boundary matters because Boom can be directionally
              right about long-run industry potential while still addressing a much smaller practical market for its
              first decade. The real diligence task is to estimate the premium-route wedge that can support Overture
              economics under current regulation, not to accept headline aircraft-market figures at face value. That
              narrower framing is the starting point for every later valuation and adoption assumption.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM015
              - CM029
              - CM030
