      - number: '4.3'
        title: Capital adequacy remains the central underwriting question
        blocks:
          - type: paragraph
            body: >-
              The single most important financial question is not whether Boom can attract capital — it clearly can —
              but whether current and future capital will be enough to carry both Overture and Symphony to commercial
              readiness without severe dilution or strategic compromise. TechCrunch and FlightGlobal provide the main
              public datapoint: a $300 million 2025 round tied to Superpower commercialization. Tracxn adds context with
              a roughly $700 million cumulative-funding figure. But the essential operating bridge is missing. Public
              sources do not disclose cash on hand, monthly burn, debt, runway, or next-round trigger. That means no
              external analyst can responsibly calculate solvency duration from the public record alone. In practice,
              Boom’s capital adequacy thesis rests on the assumption that Superpower becomes a financeable bridge and
              that certification timelines do not stretch faster than cash access. That is plausible, but it is not yet
              proven. Investors are underwriting a gap between disclosed milestones and undisclosed liquidity.
