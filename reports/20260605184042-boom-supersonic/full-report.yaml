  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Three named airlines create real customer proof, but not yet revenue-grade backlog
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic’s customer story is better than a concept-stage pitch deck, but weaker than a conventional
              airline backlog. Public disclosures consistently identify three named airline customers: American
              Airlines, Japan Airlines, and United Airlines. American is the clearest anchor, with a 20-aircraft
              purchase agreement, 40 options, and a publicly disclosed non-refundable deposit. Japan Airlines supplies a
              different kind of proof because it entered early with a $10 million strategic investment and a 20-aircraft
              partnership. United adds another flagship carrier endorsement through its 15-aircraft agreement and 35
              options. Together these commitments support Boom’s public claim of an approximately 130-aircraft order
              book. The problem is quality, not existence. None of these aircraft has been delivered, the agreements
              remain contingent on certification and performance milestones, and public disclosures do not provide the
              detailed pricing, expiry, penalty, or conversion mechanics that investors would want before treating the
              order book as durable revenue. The result is meaningful demand validation, but not a cash-flow substitute.
