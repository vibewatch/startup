              completion does not erase the timeline gap. Boom remains years away from first delivery, and public
              sources still lack the details that usually signal a maturing aerospace backlog, such as delivery
              schedules by customer, escalation formulas, support contracts, or disclosed deposit economics. This makes
              the customer chapter inseparable from execution risk. Airlines have given Boom permission to keep
