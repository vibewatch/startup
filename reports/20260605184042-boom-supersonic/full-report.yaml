companyProfile:
  summary: >-
    Boom Supersonic, founded in 2014 by Blake Scholl, is developing the Overture Mach-1.7 supersonic passenger jet with
    approximately 130 aircraft pre-orders from American Airlines, Japan Airlines, and United Airlines, and the Symphony
    engine. The company has raised $700M+ at a $1.5B post-money valuation, completed XB-1 supersonic demonstrator
    flights (Mach 1.122 in March 2024), and is targeting entry into commercial service in the early 2030s. The
    Superpower turbine program offers a nearer-term revenue bridge through power generation applications for data
    centers and the grid.
  foundedDate: '2014-01-01'
  founders:
