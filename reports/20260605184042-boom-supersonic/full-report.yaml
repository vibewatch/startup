        title: Multiple sizing lenses point to a constrained but non-trivial opportunity
        blocks:
          - type: paragraph
            body: >-
              The sizing evidence is directionally useful but should be treated as a stack of lenses rather than a
              single number. Fortune Business Insights and The Business Research Company both publish markets in the
              tens of billions of dollars, which tells us the broader industry is large enough to attract capital,
              policy attention, and multiple technical approaches. But those same figures become less actionable once
              the market is segmented into commercial passenger service, then narrowed again to premium long-haul
              overwater routes that do not depend on future no-boom rulemaking. Boom’s own route claims are more useful
              for SAM framing than generic TAM reports because they anchor on where Overture could theoretically
              operate. Even then, 600 potential routes do not equal 600 fleet decisions or 600 profitable aircraft
              slots. The practical market is therefore probably much smaller than published TAM, but still large enough
              that a small number of airline wins could matter economically if certification and route economics hold.
