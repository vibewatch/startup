              Boom can convert today’s agreements into delivered aircraft. That conversion path still has several hard
              gates: final aircraft definition, engine readiness, certification, production scheduling, and then actual
              airline delivery. Manufacturing progress helps. Boom completed the Overture Superfactory in June 2024 and
