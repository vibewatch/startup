      - number: '4.2'
        title: Cost structure is dominated by engine, certification, tooling, and factory spend
        blocks:
          - type: paragraph
            body: >-
              Boom’s public cost structure is easier to describe qualitatively than quantitatively. The company is
              simultaneously building a clean-sheet engine, operating engine test work, buying advanced manufacturing
              equipment, and standing up a factory-scale production footprint. That combination implies high fixed
              engineering spend, high capital expenditure, long working-capital cycles, and meaningful supplier
              dependency before any volume deliveries exist. Reporting on engine development reinforces the point: the
              company is still in a parts, rig-test, and infrastructure phase rather than a stable production phase.
              FlightGlobal’s note that the engine path could cost a few billion dollars is directionally consistent with
              the rest of the evidence even if exact numbers remain undisclosed. The implication is that Boom’s
              gross-margin and payback profile cannot be inferred from orders alone because development and
              industrialization consume so much capital ahead of revenue recognition. This is exactly why private
              unit-cost disclosure matters more than public hype.
