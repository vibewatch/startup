chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and what Boom is actually building
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic is best understood as a late-stage aerospace development company rather than a
              conventional airline-tech startup. Public sources consistently place the company’s founding in 2014 and
              its operating base in Colorado, while the current product narrative spans two linked businesses: Overture,
              the supersonic passenger airliner, and Superpower, a stationary turbine program that Boom now frames as a
              cash-generating bridge to aircraft development. Overture remains the center of the original thesis.
              Official product materials describe a Mach 1.7 aircraft with 60 to 80 seats, 4,250 nautical miles of
              range, and compatibility with 100% sustainable aviation fuel. But the stage matters more than the headline
              specs. Boom has not entered commercial service, has not disclosed public revenue, and still depends on a
              certification and manufacturing path that remains open-ended. The result is a company with unusually
              strong public ambition, tangible milestones, and a still-unfinished underwriting case.
            claimRefs:
