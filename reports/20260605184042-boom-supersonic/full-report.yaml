  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation and Financing Context
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic raised a $300 million Series B in December 2025 at a post-money valuation of $1.5 billion
              — a round led by Darsana Capital Partners with participation from Altimeter Capital, ARK Invest, Bessemer
              Venture Partners, Robinhood Ventures, and Y Combinator. This brings total capital raised to approximately
              $700 million. The $1.5 billion valuation places Boom in a peer group of advanced aviation technology
              companies that have attracted significant venture backing ahead of revenue. For context, Joby Aviation —
              the eVTOL company targeting urban air mobility — is publicly traded with a market capitalization of
              approximately $2.8 billion as of mid-2026, and Archer Aviation carries a market cap of approximately $1-2
              billion. Boom's valuation is thus within range of its broader advanced aviation peer set. However, the
              comparison is imperfect: eVTOL companies are closer to commercial service with FAA type certificates
              anticipated in the near term, while Boom's EIS is a decade away. The $1.5 billion valuation implies
              investors are pricing in a significant probability that Boom delivers a commercially successful Overture
              program — a program with a decade of execution risk ahead of it. Entry discipline is therefore paramount:
              this is not a valuation at which traditional venture or growth investors would typically receive their
              required return multiple, but rather a strategic or patient capital position.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The bull case for Boom Supersonic rests on four pillars: (1) the supersonic commercial aviation market is
              a validated multi-billion dollar opportunity proven by Concorde's 27-year profitable operation on two
              routes, and Overture has the potential to serve 500+ routes globally if certified; (2) the 130-aircraft
              pre-order book from American Airlines, JAL, and United represents the largest commercially committed
              supersonic order book since Concorde, providing genuine demand validation; (3) the June 2025 executive
              order repealing the 52-year overland ban materially expands Overture's addressable route network and
              signals US government support for supersonic aviation; and (4) the Superpower turbine program gives Boom a
              nearer-term revenue pathway independent of aviation certification. The anti-thesis is equally clear: Boom
              has never delivered a revenue-generating aircraft; the FAA certification process for a supersonic
              transport is entirely novel and could take 10-15 years; the company needs $1-3 billion more in capital
              that has not yet been raised; airline pre-orders are conditional and unverified since 2022; and the
              SAF-only operations commitment creates operating cost risk at scale. The fundamental tension is between a
              compelling market vision with validated demand signals and the extraordinary execution difficulty of
              becoming the world's first commercially certified post-Concorde supersonic airliner.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV005
            claimRefs:
              - CV005
              - CV006
              - CV017
              - CV018
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV017
      - number: '8.3'
        title: Comparable Company and Transaction Analysis
        blocks:
          - type: paragraph
            body: >-
              Comparable analysis for Boom Supersonic is necessarily imperfect given the absence of other publicly
              disclosed private supersonic commercial aviation companies at a similar stage. The most relevant comps are
              other pre-revenue advanced aviation technology companies: Joby Aviation is publicly traded at
              approximately $2.8 billion market cap with $2.8 billion raised, targeting eVTOL commercial service in the
              near term and backed by Toyota, Delta, and the US Army; Archer Aviation has a public market cap of
              approximately $1-1.5 billion targeting similar eVTOL markets; and Hermeus is a private Mach 5 company with
              USAF backing and no public valuation. In the broader aerospace context, Lockheed Martin's F-35 program
              required over $400 billion in total program costs from development through production, demonstrating the
              capital intensity of complex aerospace programs even with guaranteed government customers. SpaceX, which
              is developing reusable orbital rockets simultaneously with a Starship human spaceflight system, carries a
              private valuation of approximately $350 billion, illustrating that transformational aerospace programs
              with clear market demand can achieve extraordinary valuations once technology and customer traction are
              proven. Boom at $1.5 billion is orders of magnitude smaller than the aviation market opportunity it
              targets, but also bears enormous execution risk relative to its capitalization.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Bull, Base, and Bear Case Scenarios
        blocks:
          - type: paragraph
            body: >-
              Bull case (probability ~20%): Overture achieves FAA type certification by 2031, enters commercial service
              on six transatlantic and transpacific routes with American Airlines and Japan Airlines, and achieves load
              factors of 70%+ at $6,000 average premium fares. Superpower turbine generates $200M+ in revenue by 2030.
              New airline orders materialize from European carriers following proven certification. Overture scales to
              100+ delivered aircraft by 2038. Implied valuation in this scenario: $10-20 billion at peak, with a path
              for founders and early investors to 10-20x on current valuation. Base case (probability ~45%): EIS slips
              to 2033-2034, American Airlines takes initial deliveries but JAL delays to 2035. Only 30-50 aircraft
              delivered in the first five years of commercial service. Superpower generates modest revenue. Total
              valuation achievable at this stage: $3-5 billion, representing a 2-3x return on current valuation. Bear
              case (probability ~35%): FAA certification extends beyond 2035, major airline cancellation forces program
              re-scoping, capital raise fails at acceptable terms, program enters restructuring. Superpower turbine
              provides nominal revenue but insufficient to fund Overture. Valuation falls below $500 million. Early
              investors face significant write-downs. Weighted expected value at current entry prices suggests a
              marginally positive expected return that does not meet typical venture thresholds without specific
              strategic rationale.
            claimRefs:
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Recommendation, Confidence, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Recommendation: Track. Boom Supersonic is an intellectually compelling program with validated market
              demand, strong investor backing, and genuine regulatory tailwinds from the June 2025 overland ban repeal.
              However, it is inappropriate for return-constrained capital at the current $1.5 billion valuation given
              the decade-long timeline to revenue, unresolved certification pathway, and multi-billion dollar capital
              requirements. For patient strategic capital — airlines, aerospace primes, sovereign wealth funds, or
              governments with an interest in supersonic aviation leadership — the current round's $1.5 billion entry
              may be justifiable as an option on a transformational aviation market. For venture capital with standard
              10-year fund horizons and 3-5x return targets, the path to a satisfying return is extremely narrow at
              current entry prices. Confidence level is medium: the market opportunity is real, Boom's technology is
              validated to the demonstrator level, and the regulatory environment has improved materially. But the high
              weight of execution uncertainty and the capital requirement gap significantly reduce conviction. Key
              remaining diligence asks: (1) financial model with cash balance, burn rate, and runway; (2) Symphony
              engine development schedule with first-run date; (3) airline order reaffirmation letters; (4) Superpower
              customer pipeline; (5) FAA certification plan and milestone schedule; (6) cap table with preference stack
              and anti-dilution provisions.
            claimRefs:
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV004
            claimRefs:
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV006
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV016
              - CV017
              - CV018
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Track: Compelling Vision, Stretched Valuation, Decade-Long Risk'
            body: >-
              Boom Supersonic's $1.5B valuation is justifiable only for patient strategic capital with a multi-decade
              horizon. For return-constrained investors, the combination of pre-revenue status, unproven certification
              pathway, and $1-3B additional capital need makes the expected return marginal at this entry price. Watch
              for: Symphony engine first-run, FAA noise NPRM publication, and any airline reaffirmation or cancellation.
            calloutType: recommendation
            claimRefs:
              - CV016
              - CV017
              - CV018
          - type: callout
            title: 130-Aircraft Order Book Plus June 2025 Regulatory Tailwind Strengthen the Bull Case
            body: >-
              The combination of 130 aircraft in the pre-order book from three major carriers and the executive order
              repealing the overland ban provides the strongest public evidence that Boom's market opportunity is real.
              These two data points together represent the most meaningful validation milestones the company has
              achieved.
            calloutType: strength
            claimRefs:
              - CV006
              - CV007
              - CV013
          - type: callout
            title: 35% Probability Bear Case Carries Capital Impairment Risk
            body: >-
              The bear case — certification beyond 2035, airline cancellations, failed capital raise — is not a tail
              risk but a material 35% probability outcome. Investors should size positions to survive total impairment
              without relying on program success, or avoid the position entirely if loss tolerance is constrained.
            calloutType: risk
            claimRefs:
              - CV015
              - CV017
