      - number: '7.4'
        title: Dependency, financing, and concentration risk remain unusually high for a pre-service program
        blocks:
          - type: paragraph
            body: >-
              Boom's external dependency graph is broad enough to be a thesis variable by itself. The company now
              depends on regulators, launch customers, fuel counterparties, a long list of Tier 1 suppliers, and a new
              data-center turbine business that is supposed to help bankroll aircraft development. That diversification
              is helpful only if it reduces funding risk faster than it adds managerial complexity. TechCrunch shows why
              the question matters: Boom's new Superpower business brings a real first customer and a $300 million
              round, but it also means leadership is trying to scale another heavy-industrial product while still
              developing Overture and Symphony. On the customer side, the public order book remains concentrated around
              three named airlines. JAL's $10 million investment and option for up to 20 aircraft are real, Boom
              continues to cite a 130-aircraft order book, and AP says both American and United have made deposits. But
              none of that yet answers the harder diligence questions about refundability, termination rights, slot
              timing, or how much of the book is economically firm. In other words, Boom is not merely exposed to “will
              airlines want this?” risk. It is exposed to “will a narrow set of customers, suppliers, regulators, and
              financing channels all stay aligned long enough for a pre-service aircraft to reach delivery?” risk.
