  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Two revenue stories now coexist: aircraft and power'
        blocks:
          - type: paragraph
            body: >-
              Boom’s financial model can no longer be described as a single airliner bet. Public materials and reporting
              now describe two distinct commercialization stories. The original story is Overture: a clean-sheet
              commercial aircraft program whose revenue will arrive only after certification, production, and airline
              delivery. The newer story is Superpower: a stationary turbine product that Boom hopes can generate
              earlier, contractable enterprise revenue and help finance the aviation side. That matters because the two
              products have meaningfully different customer types, sales cycles, and recognition profiles. Overture
              revenue is likely to be lumpy and milestone-driven, while Superpower could become a large-ticket
              industrial equipment line if disclosed orders convert into deliveries. The common weakness across both
              lines is the absence of disclosed realized revenue, gross margin, or contribution economics. Public
              signals therefore describe monetization logic more clearly than they describe monetization results today.
            claimRefs:
