      - number: '1.2'
        title: Founder-led leadership with clear key-person concentration
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is thinner than product marketing evidence, but the overall pattern is clear: Boom
              remains founder-led and founder-shaped. Blake Scholl is the public face of the company, the most visible
              spokesperson in customer, fundraising, and policy narratives, and the connective tissue between the
              original aviation thesis and the newer power-generation pivot. Third-party profiles also identify Joe
              Wilding and Joshua Krall as co-founders, but they are materially less visible in current public
              communications. That imbalance matters because Boom’s most difficult work now sits at the intersection of
              strategy, fundraising, policy, and technical sequencing. Even the addition of senior propulsion leadership
              for Symphony does not fully dilute the dependence on Scholl as storyteller, capital allocator, and
              regulatory advocate. For diligence purposes, the leadership story is credible but concentrated: the
              company’s public momentum still looks heavily dependent on one executive’s ability to keep multiple
              stakeholder groups aligned through a long and expensive development cycle.
