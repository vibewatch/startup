      - number: '7.3'
        title: Airline economics, range limits, SAF scarcity, and climate intensity all pressure the demand case
        blocks:
          - type: paragraph
            body: >-
              Even if Boom executes technically, the airline-economics case is not automatically robust. Public
              skepticism is no longer confined to environmental critics; it now includes launch-customer leadership.
              Forbes reported that United CEO Scott Kirby gave Overture only 50-50 odds of flying and said the current
              design lacks enough range to support the West Coast-to-Asia missions that would make the aircraft
              commercially compelling at scale. One Mile at a Time's review is useful because it attacks Boom's own
              demand assumptions rather than the technology itself: the bullish case leans on capturing essentially all
              premium demand on targeted routes, despite range gaps, cargo trade-offs, network cannibalization, and the
              realities of hub-and-spoke airline economics. The fuel and climate side is just as difficult. Boom has
              public SAF offtakes, but IATA, ICAO, and IEA all show a market that remains tiny, policy-fragile, and
              expensive. ICCT goes further, arguing that supersonic aircraft remain dramatically more fuel intensive
              than subsonic alternatives and can consume a disproportionate share of a constrained aviation carbon
              budget. In practice, that means Boom is not just solving speed; it is trying to clear four linked hurdles
              at once: premium-fare willingness, range adequacy, fuel availability, and climate legitimacy. A miss on
              any one of those can weaken the whole route-economics story.
            claimRefs:
              - CR018
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
