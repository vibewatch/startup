              Boom’s public financial story is strong enough to justify diligence but not strong enough to justify
              underwriting on public evidence alone. The company has capital support, customer signals, and now a
              nearer-term enterprise product with a named buyer. Those are real positives. But they do not replace the
              missing fundamentals: revenue run rate, margin bridge, burn, runway, and per-unit economics. Aircraft
              backlog-like signals and turbine order announcements can support a narrative, yet they do not tell an
              investor how much cash is on the balance sheet or how efficiently Boom is converting engineering effort
              into future revenue. The verdict is therefore mixed but clear. Boom is financially interesting because it
              has found ways to keep the story moving; it is financially incomplete because the public record still does
