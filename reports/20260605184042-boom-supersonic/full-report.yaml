  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal uncertainty is still a gating risk, not a solved prerequisite
        blocks:
          - type: paragraph
            body: >-
              Boom's most structural risk remains that the company is trying to commercialize a product category whose
              U.S. operating framework is still moving. The public record now shows two things at once: policy momentum
              has improved, but settled certainty still does not exist. EO 14304 ordered the FAA to repeal 14 CFR
              91.817, create an interim noise-based path, and move toward a Part 36 framework, yet FAA's own materials
              still emphasize that civil aircraft need special authorization to exceed Mach 1 over land, that SFAs
              trigger NEPA review, and that community acceptability and public participation remain part of the process.
              Legal commentary from both the ABA and Leech Tishman reinforces that point: any change can still draw
              litigation, must survive notice-and-comment scrutiny, and must fit federal noise and emissions mandates.
              NASA's Quesst program further underlines that the decisive evidence base for quiet overland operations is
              still being assembled rather than fully accepted. For an investor, that means overland upside should be
              treated as contingent optionality. A friendlier White House or House vote helps, but it does not by itself
              clear the certification, community, or litigation hurdles that determine whether Overture can fly the
              routes that make its economics most attractive.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR044
          - type: table
            tableRef: TR001
            claimRefs:
