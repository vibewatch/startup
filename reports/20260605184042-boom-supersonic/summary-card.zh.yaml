summary:
  headline: >-
    Boom Supersonic 站在 Concorde 之后最可信的超音速航空位置：手里有 130 架飞机预订单，2025 年 6 月陆上超音速禁令废止带来监管顺风，XB-1
    也验证了气动设计；但公司仍未产生收入，距离商业服役还有约十年，因此只适合有耐心的战略资本承受高风险押注。
