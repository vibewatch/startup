company:
  name: Boom Supersonic
chapter:
  number: 8
  title: Valuation & Investment Recommendation
  summary: 'Boom Supersonic''s $1.5 billion post-money valuation from its December 2025 Series B is stretched relative to its pre-revenue, pre-certification status but defensible as an option on a potential multi-billion dollar supersonic aviation market. The recommendation is to track: the June 2025 regulatory tailwind is material, the 130-aircraft order book provides demand validation, and the Superpower turbine adds a nearer-term revenue bridge, but the decade-long path to revenue, high capital requirements, and unproven certification process make this a high-risk speculative position inappropriate for return-constrained capital.'
sections:
- id: valuation-context
  title: Current Valuation and Financing Context
  body: 'Boom Supersonic raised a $300 million Series B in December 2025 at a post-money valuation of $1.5 billion — a round led by Darsana Capital Partners with participation from Altimeter Capital, ARK Invest, Bessemer Venture Partners, Robinhood Ventures, and Y Combinator. This brings total capital raised to approximately $700 million. The $1.5 billion valuation places Boom in a peer group of advanced aviation technology companies that have attracted significant venture backing ahead of revenue. For context, Joby Aviation — the eVTOL company targeting urban air mobility — is publicly traded with a market capitalization of approximately $2.8 billion as of mid-2026, and Archer Aviation carries a market cap of approximately $1-2 billion. Boom''s valuation is thus within range of its broader advanced aviation peer set. However, the comparison is imperfect: eVTOL companies are closer to commercial service with FAA type certificates anticipated in the near term, while Boom''s EIS is a decade
    away. The $1.5 billion valuation implies investors are pricing in a significant probability that Boom delivers a commercially successful Overture program — a program with a decade of execution risk ahead of it. Entry discipline is therefore paramount: this is not a valuation at which traditional venture or growth investors would typically receive their required return multiple, but rather a strategic or patient capital position.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: investment-thesis
  title: Investment Thesis and Anti-Thesis
  body: 'The bull case for Boom Supersonic rests on four pillars: (1) the supersonic commercial aviation market is a validated multi-billion dollar opportunity proven by Concorde''s 27-year profitable operation on two routes, and Overture has the potential to serve 500+ routes globally if certified; (2) the 130-aircraft pre-order book from American Airlines, JAL, and United represents the largest commercially committed supersonic order book since Concorde, providing genuine demand validation; (3) the June 2025 executive order repealing the 52-year overland ban materially expands Overture''s addressable route network and signals US government support for supersonic aviation; and (4) the Superpower turbine program gives Boom a nearer-term revenue pathway independent of aviation certification. The anti-thesis is equally clear: Boom has never delivered a revenue-generating aircraft; the FAA certification process for a supersonic transport is entirely novel and could take 10-15 years; the company
    needs $1-3 billion more in capital that has not yet been raised; airline pre-orders are conditional and unverified since 2022; and the SAF-only operations commitment creates operating cost risk at scale. The fundamental tension is between a compelling market vision with validated demand signals and the extraordinary execution difficulty of becoming the world''s first commercially certified post-Concorde supersonic airliner.'
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV005
  figureRefs:
  - FV002
- id: comparable-analysis
  title: Comparable Company and Transaction Analysis
  body: 'Comparable analysis for Boom Supersonic is necessarily imperfect given the absence of other publicly disclosed private supersonic commercial aviation companies at a similar stage. The most relevant comps are other pre-revenue advanced aviation technology companies: Joby Aviation is publicly traded at approximately $2.8 billion market cap with $2.8 billion raised, targeting eVTOL commercial service in the near term and backed by Toyota, Delta, and the US Army; Archer Aviation has a public market cap of approximately $1-1.5 billion targeting similar eVTOL markets; and Hermeus is a private Mach 5 company with USAF backing and no public valuation. In the broader aerospace context, Lockheed Martin''s F-35 program required over $400 billion in total program costs from development through production, demonstrating the capital intensity of complex aerospace programs even with guaranteed government customers. SpaceX, which is developing reusable orbital rockets simultaneously with a Starship
    human spaceflight system, carries a private valuation of approximately $350 billion, illustrating that transformational aerospace programs with clear market demand can achieve extraordinary valuations once technology and customer traction are proven. Boom at $1.5 billion is orders of magnitude smaller than the aviation market opportunity it targets, but also bears enormous execution risk relative to its capitalization.'
