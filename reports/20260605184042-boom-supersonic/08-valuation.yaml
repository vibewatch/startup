callouts:
- calloutType: recommendation
  title: 'Track: Compelling Vision, Stretched Valuation, Decade-Long Risk'
  body: 'Boom Supersonic''s $1.5B valuation is justifiable only for patient strategic capital with a multi-decade horizon. For return-constrained investors, the combination of pre-revenue status, unproven certification pathway, and $1-3B additional capital need makes the expected return marginal at this entry price. Watch for: Symphony engine first-run, FAA noise NPRM publication, and any airline reaffirmation or cancellation.'
  claimRefs:
  - CV016
  - CV017
  - CV018
- calloutType: strength
  title: 130-Aircraft Order Book Plus June 2025 Regulatory Tailwind Strengthen the Bull Case
  body: The combination of 130 aircraft in the pre-order book from three major carriers and the executive order repealing the overland ban provides the strongest public evidence that Boom's market opportunity is real. These two data points together represent the most meaningful validation milestones the company has achieved.
  claimRefs:
  - CV006
  - CV007
  - CV013
- calloutType: risk
  title: 35% Probability Bear Case Carries Capital Impairment Risk
  body: The bear case — certification beyond 2035, airline cancellations, failed capital raise — is not a tail risk but a material 35% probability outcome. Investors should size positions to survive total impairment without relying on program success, or avoid the position entirely if loss tolerance is constrained.
  claimRefs:
  - CV015
  - CV017
