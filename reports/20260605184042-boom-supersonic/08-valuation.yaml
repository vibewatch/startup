  - CV009
  - CV010
  - CV011
  - CV012
  tableRefs:
  - TV002
  figureRefs: []
- id: bull-base-bear
  title: Bull, Base, and Bear Case Scenarios
  body: 'Bull case (probability ~20%): Overture achieves FAA type certification by 2031, enters commercial service on six transatlantic and transpacific routes with American Airlines and Japan Airlines, and achieves load factors of 70%+ at $6,000 average premium fares. Superpower turbine generates $200M+ in revenue by 2030. New airline orders materialize from European carriers following proven certification. Overture scales to 100+ delivered aircraft by 2038. Implied valuation in this scenario: $10-20 billion at peak, with a path for founders and early investors to 10-20x on current valuation. Base case (probability ~45%): EIS slips to 2033-2034, American Airlines takes initial deliveries but JAL delays to 2035. Only 30-50 aircraft delivered in the first five years of commercial service. Superpower generates modest revenue. Total valuation achievable at this stage: $3-5 billion, representing a 2-3x return on current valuation. Bear case (probability ~35%): FAA certification extends beyond
    2035, major airline cancellation forces program re-scoping, capital raise fails at acceptable terms, program enters restructuring. Superpower turbine provides nominal revenue but insufficient to fund Overture. Valuation falls below $500 million. Early investors face significant write-downs. Weighted expected value at current entry prices suggests a marginally positive expected return that does not meet typical venture thresholds without specific strategic rationale.'
  claimRefs:
  - CV013
  - CV014
  - CV015
  tableRefs:
  - TV003
  figureRefs:
  - FV003
- id: recommendation-diligence
  title: Recommendation, Confidence, and Diligence Asks
  body: 'Recommendation: Track. Boom Supersonic is an intellectually compelling program with validated market demand, strong investor backing, and genuine regulatory tailwinds from the June 2025 overland ban repeal. However, it is inappropriate for return-constrained capital at the current $1.5 billion valuation given the decade-long timeline to revenue, unresolved certification pathway, and multi-billion dollar capital requirements. For patient strategic capital — airlines, aerospace primes, sovereign wealth funds, or governments with an interest in supersonic aviation leadership — the current round''s $1.5 billion entry may be justifiable as an option on a transformational aviation market. For venture capital with standard 10-year fund horizons and 3-5x return targets, the path to a satisfying return is extremely narrow at current entry prices. Confidence level is medium: the market opportunity is real, Boom''s technology is validated to the demonstrator level, and the regulatory environment
    has improved materially. But the high weight of execution uncertainty and the capital requirement gap significantly reduce conviction. Key remaining diligence asks: (1) financial model with cash balance, burn rate, and runway; (2) Symphony engine development schedule with first-run date; (3) airline order reaffirmation letters; (4) Superpower customer pipeline; (5) FAA certification plan and milestone schedule; (6) cap table with preference stack and anti-dilution provisions.'
