  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 真正相关的市场是高端超音速运输，不是整个超音速喷气机宇宙
        blocks:
          - type: paragraph
            body: >-
              行业报告标题常把“超音速喷气机市场”说得很宽，但这个框架对 Boom 投资判断过于松散。公开市场报告包含军用、防务和泛超音速类别，不能直接拿来对比 Boom 计划中的商业客机业务。Boom
              近端市场窄得多：在航司能够把实质性节时货币化的航线上，提供高端长途客运。这个框架立刻排除了报告中很大一部分
              TAM，尤其是军费和其他飞机类别。它也把替代品集合说清楚了。今天真实替代品是高端亚音速宽体客舱和部分公务航空场景，不是已经投入服务、彼此竞争的商业超音速机队。这个边界很重要，因为 Boom
              可以在长期行业潜力方向上判断正确，却在前十年只面对一个小得多的实际市场。真正的尽调任务，是估算在现行监管下能够支撑 Overture
              经济性的高端航线楔子，而不是按表面值接受飞机市场标题数字。这个更窄的框架，是后续所有估值和采用假设的起点。
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM006
              - CM015
