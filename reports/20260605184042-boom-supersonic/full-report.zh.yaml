  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值与融资背景
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 于 2025 年 12 月完成 $300 million Series B 轮融资，投后估值 $1.5 billion；本轮由 Darsana Capital Partners
              领投，Altimeter Capital、ARK Invest、Bessemer Venture Partners、Robinhood Ventures 和 Y Combinator 参投。累计融资约 $700
              million。$1.5 billion 的估值把 Boom 放进一组先进航空技术公司里：它们尚未产生收入，却已经拿到大量风险资本。作为参照，瞄准城市空中出行的 eVTOL 公司 Joby Aviation
              已上市，2026 年中市值约 $2.8 billion；Archer Aviation 的市值约 $1-2 billion。因此，Boom 的估值落在更宽泛的先进航空同业区间内。但这个比较并不完全对等：eVTOL
              公司更接近商业运营，FAA 型号认证预计近期可到；Boom 的 EIS 还在十年之外。$1.5 billion 估值意味着投资人已计入相当高概率：Boom 能把 Overture
              做成商业成功项目，而这个项目未来十年仍充满执行风险。因此入场纪律是核心：这个估值下，传统 VC 或成长投资人通常拿不到所需回报倍数，更像战略资本或耐心资本的仓位。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
      - number: '8.2'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 的乐观情景有四根支柱：（1）超音速商业航空市场是一个已经被验证的数十亿美元机会，Concorde 曾在两条航线上盈利运营 27 年；如果 Overture
              获得认证，全球潜在航线可超过 500 条；（2）American Airlines、JAL 和 United 带来的 130 架预订单，是 Concorde
              之后商业承诺规模最大的超音速订单簿，构成真实需求验证；（3）2025 年 6 月取消 52 年陆上禁令的行政令，显著扩大 Overture
              可服务航线网络，也释放美国政府支持超音速航空的信号；（4）Superpower 涡轮项目给 Boom 提供了一条不依赖航空认证的较近收入路径。反向逻辑同样清楚：Boom 从未交付过可产生收入的飞机；FAA
              对超音速运输机的认证流程完全是新题，可能需要 10-15 年；公司还需要 $1-3 billion 资本，且尚未募集；航司预订单带有条件，2022 年以来也未得到验证；仅使用 SAF
              运营的承诺会在规模化时带来运营成本风险。根本张力在于：市场愿景很有吸引力，也有需求信号支撑，但要成为 Concorde 之后全球首个商业认证的超音速客机，执行难度极高。
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV005
            claimRefs:
              - CV005
              - CV006
              - CV017
              - CV018
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV017
      - number: '8.3'
        title: 可比公司与交易分析
        blocks:
          - type: paragraph
            body: >-
              Boom Supersonic 的可比分析天然不完美，因为公开披露中几乎没有处于类似阶段的私营超音速商业航空公司。最相关的可比对象，是其他尚无收入的先进航空技术公司：Joby Aviation 上市后市值约
              $2.8 billion，累计融资 $2.8 billion，瞄准近期 eVTOL 商业服务，并得到 Toyota、Delta 和 US Army 支持；Archer Aviation 的公开市值约 $1-1.5
              billion，目标市场类似；Hermeus 是一家有 USAF 支持的私营 Mach 5 公司，但没有公开估值。放到更宽的航空航天语境里，Lockheed Martin 的 F-35 项目从开发到生产总成本超过
              $400 billion，说明即便有政府客户兜底，复杂航空航天项目仍极度吃资本。SpaceX 同时开发可重复使用轨道火箭和 Starship 载人航天系统，私募估值约 $350
              billion；这说明，只要技术和客户牵引得到验证，变革性航空航天项目可以拿到极高估值。Boom 的 $1.5 billion
              估值比它瞄准的航空市场机会低几个数量级，但相对于自身资本规模，也承担着巨大的执行风险。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景（概率约 20%）：Overture 在 2031 年前取得 FAA 型号认证，与 American Airlines 和 Japan Airlines 一起在 6
              条跨大西洋和跨太平洋航线上投入商业服务，平均高端票价 $6,000 下客座率达到 70%+。Superpower 涡轮到 2030 年贡献 $200M+ 收入。认证跑通后，欧洲航司带来新订单。到 2038
              年，Overture 累计交付超过 100 架。该情景下的隐含估值：峰值 $10-20 billion，创始人和早期投资人有机会在当前估值上获得 10-20x。基准情景（概率约 45%）：EIS 推迟到
              2033-2034，American Airlines 接收首批交付，但 JAL 推迟到 2035。商业运营前五年只交付 30-50 架飞机。Superpower 贡献温和收入。这个阶段可实现的总估值为 $3-5
              billion，对应当前估值的 2-3x 回报。悲观情景（概率约 35%）：FAA 认证延伸到 2035 年之后，主要航司取消订单迫使项目重新定范围，资本无法以可接受条款募集，项目进入重组。Superpower
              涡轮带来名义收入，但不足以资助 Overture。估值跌破 $500 million。早期投资人面临重大减值。按当前入场价格计算的加权预期价值略为正，但若没有明确战略理由，并不达到典型风险投资门槛。
            claimRefs:
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 投资建议、信心与尽调问题
        blocks:
          - type: paragraph
            body: >-
              建议：观察。Boom Supersonic 是一个在智识上很有吸引力的项目，有经过验证的市场需求、强投资人背书，也受益于 2025 年 6 月取消陆上禁令带来的真实监管顺风。但在当前 $1.5 billion
              估值下，十年级别收入周期、未解决的认证路径和数十亿美元资本需求，让它并不适合受回报约束的资金。对耐心战略资本——航司、航空航天主承包商、主权财富基金，或有意争夺超音速航空领导地位的政府——当前轮次 $1.5
              billion 的入场价，或许可以被视为押注一个变革性航空市场的期权。对标准 10 年基金周期、目标回报 3-5x 的风险资本来说，当前入场价格下，要拿到满意回报的路径极窄。信心等级为中：市场机会真实，Boom
              的技术已验证到演示机层面，监管环境也明显改善。但执行不确定性权重很高，资本需求缺口也明显压低了确信度。仍需尽调的关键问题：（1）包含现金余额、烧钱速度和现金跑道的财务模型；（2）Symphony
              发动机开发时间表及首次运行日期；（3）航司订单重新确认函；（4）Superpower 客户管线；（5）FAA 认证计划和里程碑时间表；（6）含优先股堆叠和反稀释条款的股权结构表。
            claimRefs:
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV004
            claimRefs:
              - CV016
              - CV017
              - CV018
          - type: table
            tableRef: TV006
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV016
              - CV017
              - CV018
      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 观察：愿景有吸引力，估值偏紧，十年风险未消
            body: >-
              Boom Supersonic 的 $1.5B 估值，只适合拥有数十年视野的耐心战略资本。对受回报约束的投资人来说，尚无收入、认证路径未验证、还需 $1-3B
              追加资本，这组条件让当前入场价下的预期回报很薄。重点关注：Symphony 发动机首次运行、FAA 噪声 NPRM 发布，以及任何航司重新确认或取消订单。
            calloutType: recommendation
            claimRefs:
              - CV016
              - CV017
              - CV018
          - type: callout
            title: 130 架订单簿叠加 2025 年 6 月监管顺风，强化乐观情景
            body: 三大航司贡献的 130 架预订单簿，加上取消陆上禁令的行政令，是 Boom 市场机会真实存在的最强公开证据。这两个数据点合在一起，是公司迄今最有意义的验证里程碑。
            calloutType: strength
            claimRefs:
              - CV006
              - CV007
              - CV013
          - type: callout
            title: 35% 概率的悲观情景带有资本减值风险
            body: 悲观情景——2035 年后才完成认证、航司取消订单、融资失败——不是尾部风险，而是概率高达 35% 的实质结果。投资人应把仓位控制在即便全额减值也能承受的水平，不能依赖项目成功；若损失承受力受限，就应完全回避。
            calloutType: risk
            claimRefs:
              - CV015
              - CV017
