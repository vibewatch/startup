  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律不确定性仍是闸门风险，不是已解决的前提条件
        blocks:
          - type: paragraph
            body: >-
              Boom 最结构性的风险仍在于：公司试图商业化的产品类别，其美国运营框架仍在移动。公开记录现在同时显示两件事：政策动能改善了，但确定性尚未落定。EO 14304 要求 FAA 废止 14 CFR
              91.817、建立临时噪声路径，并向 Part 36 框架推进；但 FAA 自身材料仍强调，民用飞机要在陆上超过 Mach 1 需要特殊授权，SFA 会触发 NEPA
              审查，社区可接受性和公众参与仍是流程的一部分。ABA 和 Leech Tishman 的法律评论都强化了这一点：任何变化仍可能引发诉讼，必须经受通知和评论审查，也必须符合联邦噪声和排放要求。NASA 的
              Quesst
              项目进一步说明，决定安静陆上运营的证据基础仍在搭建，而不是已经完全被接受。对投资者来说，这意味着陆上上行应被视为有条件的可选性。更友好的白宫或众议院投票有帮助，但其本身不能清除认证、社区或诉讼障碍；这些障碍才决定
              Overture 能否飞那些让经济性最有吸引力的航线。
