        title: 创始人主导，关键人集中度清晰
        blocks:
          - type: paragraph
            body: >-
              领导层证据少于产品营销证据，但整体模式很清楚：Boom 仍由创始人驱动，也带着创始人的形状。Blake Scholl
              是公司的公众面孔，在客户、融资和政策叙事里最常露面，也是原始航空愿景与后续发电转向之间的连接点。第三方资料也把 Joe Wilding 和 Joshua Krall
              列为联合创始人，但在当前公开传播中，两人的能见度明显低得多。这个失衡很重要，因为 Boom 现在最难的工作卡在战略、融资、政策和技术排期的交叉口。即便 Symphony 增补了资深推进系统负责人，Scholl
              作为讲故事的人、资本配置者和监管倡导者的依赖度也没有被完全稀释。尽调视角下，领导层故事可信，但高度集中：公司公开动能仍很依赖一位高管，在漫长且昂贵的开发周期里持续把多类利益相关方拧在一起。
