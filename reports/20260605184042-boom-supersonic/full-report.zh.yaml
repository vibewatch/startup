        title: 对外依赖、融资和集中度风险，对一个未投入服务项目来说仍异常高
        blocks:
          - type: paragraph
            body: >-
              Boom 的外部依赖图谱已经宽到本身就是投资逻辑变量。公司现在依赖监管方、启动客户、燃料交易方、一长串 Tier 1
              供应商，以及一个新数据中心涡轮业务；这个业务本应帮助为飞机开发输血。只有当这些多元化因素降低融资风险的速度快于增加管理复杂度的速度时，它才有帮助。TechCrunch 说明了为什么这个问题重要：Boom 的新
              Superpower 业务带来了真实首个客户和 $300 million 融资，但也意味着领导层在仍开发 Overture 和 Symphony
              的同时，还要扩张另一个重工业产品。客户侧，公开订单簿仍集中在三家具名航司周围。JAL 的 $10 million 投资和最多 20 架飞机选项是真实的，Boom 继续引用 130 架飞机订单簿，AP 也称
              American 和 United 都支付了定金。但这些都还没有回答更难的尽调问题：可退款性、终止权、交付位时间，或订单簿中到底有多少在经济上坚实。换句话说，Boom
              暴露的不只是“航司会不会想要这个？”风险。它暴露的是“少数客户、供应商、监管方和融资渠道能否足够久地保持一致，让一款未投入服务的飞机走到交付？”风险。
