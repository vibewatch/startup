      - number: '3.2'
        title: 准备度和认证姿态仍把 Boom 与纯炒作对手区分开，但没有消除执行风险
        blocks:
          - type: paragraph
            body: >-
              准备度是这个版图开始分层的地方。Boom 有已飞行的 XB-1 验证机，也宣布了 Symphony 发动机项目；相较只有概念的同行，它朝航司产品推进的可见进展更多。但 FlightGlobal
              的报道提醒我们，这些进展没有移除融资和排期风险：Boom 仍必须把超音速验证机和发动机工作转化成一款已认证客机。按纯测试节奏看，Hermeus 更快，因为 Quarterhorse 在 2026
              年从首飞推进到超音速飞行，并以 FAA 实验许可运行；但这类进展附着在无人和防务导向飞机上，不是载客航司认证路径。相比之下，Spike 的重启表述读起来仍像更早期项目，还在搭团队、供应商和资本基础。X-59
              的重要性不同：它是该类别的低音爆监管基准。FAA 仍把陆上民用超音速飞行一般性禁止，特殊授权除外；因此，任何商业项目的准备度都部分是政策问题，而不只是工程问题。Aerion 和 Exosonic
              则展示了叙事漂亮却跨不过准备度缺口时会发生什么。
