companyProfile:
  summary: >-
    Boom Supersonic 由 Blake Scholl 于 2014 年创立，正在开发 Overture Mach-1.7 超音速客机和 Symphony 发动机，手里有来自 American Airlines、Japan
    Airlines、United Airlines 的约 130 架飞机预订单。公司已累计融资 $700M+，投后估值 $1.5B；XB-1 超音速验证机已完成飞行（March 2024 达到 Mach 1.122），目标是在
    2030 年代初投入商业服务。Superpower 涡轮项目面向数据中心和电网发电应用，为公司提供更近端的收入桥。
