            body: >-
              公开证据支持 Boom 取得了实质性技术进展。XB-1 已飞行并突破音障，在 March 21, 2024 飞行中记录到 Mach 1.122 的最高速度。燃烧、推力和制造更新显示 Symphony
              推进项目在推进。供应商公告显示，航电、航空结构件、MRO
              和测试工作周围的生态正在形成。但各子系统成熟度并不均衡。验证机走在可认证产品前面，产品又走在公开可靠性和工厂良率证据前面。这就是为什么路线图分析比里程碑标题更重要。Overture 的目标投入服务时间指向
              2030
              年代初，但项目级认证里程碑还没有以有约束力的日期公开承诺。一个系统可以在每个子系统上都有进展，却仍可能离稳定量产就绪有多年距离。已审阅的独立来源反复明确提出这个谨慎点，公开招聘和传播信号也强化了“仍在建设中”的判断。
