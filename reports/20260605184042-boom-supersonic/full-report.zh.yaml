      - number: '6.2'
        title: 客户动机集中在高端节时航线，而不是广泛替换机队
        blocks:
          - type: paragraph
            body: >-
              对 Overture 最明显感兴趣的航司，战略逻辑相同：它们运营高端占比高的长途网络，节省时间可以支撑票价溢价。Boom 的航线示例并不随机。New York 到 London
              是旗舰案例，因为把跨大西洋商务旅行从约 7 小时砍到约 3.5 或 4 小时，形成的高端价值主张更像企业生产力产品，而不是普通客舱升级。Los Angeles 到 Tokyo 在跨太平洋侧扮演同样角色，Boom
              营销的旅行时间约 6 小时，而亚音速飞机约 11 小时。Overture 的 64 至 80 座布局、Mach 1.7 巡航速度和 4,250
              海里设计航程，都强化了这个狭窄客户目标。这不是一款用于广泛休闲市场部署的飞机。它面向的是那些试图在速度重要性高于座位密度的旗舰航线上守住高端收益的航司。这个焦点在战略上连贯，但也意味着客户扩张依赖一个相对小的全球承运人池：这些承运人要有高端品牌定位，也要有强商务旅行需求。
