      - number: '2.2'
        title: 多个测算视角指向一个受限但并非微不足道的机会
        blocks:
          - type: paragraph
            body: >-
              市场规模证据有方向性价值，但应看成一组镜头，而不是一个单一数字。Fortune Business Insights 和 The Business Research Company
              都发布了数百亿美元级市场，这说明更广义行业足够大，能够吸引资本、政策注意力和多条技术路径。但一旦把市场切成商业客运，再收窄到不依赖未来无音爆规则制定的高端长途跨海航线，这些数字的可操作性就下降了。相比通用 TAM
              报告，Boom 自己的航线主张更适合拿来框定 SAM，因为它锚定 Overture 理论上能运营的地方。即便如此，600 条潜在航线也不等于 600 个机队决策，或 600
              个有利润的飞机时刻位。因此，实际市场大概率远小于已发布的 TAM；但如果认证和航线经济性成立，少数航司订单仍可能在经济上有意义。
