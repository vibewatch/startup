  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争宇宙：Boom 是直接面向航司的竞争者，多数其他玩家更像相邻方案或替代品
        blocks:
          - type: paragraph
            body: >-
              在商业超音速运输里，Boom 最接近直接竞争者，因为它明确把 Overture 包装给航司机队买方，而不只是卖给富裕个人或政府用户。Boom 自家材料描述的是一款 60 至 80 座、Mach 1.7、覆盖
              600 多条航线、拥有 130 架订单或预订单，并绑定具名航司关系的飞机。这让 Boom 与周边大多数玩家处在不同商业车道。Spike Aerospace 瞄准高端公务机买家；Hermeus 明显围绕防务和高
              Mach 测试飞机；NASA 与 Lockheed 的 X-59 是监管数据平台，不是待售产品；Aerion 和 Exosonic
              现在更多是失败类比。最重要的实际替代品因此不是另一款近端超音速客机，而是已经存在、已经认证的高端飞机和私人航空选项。关键在于，Boom
              的竞争集合不是一群同质飞机挤在一起，而是买方是否愿意选择一项航司级超音速项目，放弃更安全、已认证、已经可用的替代方案。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
