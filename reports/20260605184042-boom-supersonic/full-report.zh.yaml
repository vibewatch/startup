      - number: '7.3'
        title: 航司经济性、航程限制、SAF 稀缺和气候强度都会压制需求情景
        blocks:
          - type: paragraph
            body: >-
              即便 Boom 技术执行到位，航司经济性也不会自动稳固。公开质疑已经不只来自环保批评者，也包括启动客户领导层。Forbes 报道称，United CEO Scott Kirby 认为 Overture
              飞起来的概率只有 50-50，并称当前设计航程不足以支持 West Coast-to-Asia 航线，而这些航线才会让该飞机在规模上具备商业吸引力。One Mile at a Time 的评测有用，因为它攻击的是
              Boom 自己的需求假设，而不是技术本身：乐观情景依赖于几乎捕获目标航线上的全部高端需求，尽管存在航程缺口、货运取舍、网络蚕食和枢纽辐射式航司经济性的现实。燃料和气候侧同样困难。Boom 有公开 SAF
              承购协议，但 IATA、ICAO 和 IEA 都显示，这个市场仍很小、政策脆弱且昂贵。ICCT
              说得更进一步：超音速飞机的燃料强度仍远高于亚音速替代品，并可能消耗受约束航空碳预算中不成比例的一部分。实践中，这意味着 Boom
              解决的不只是速度；它要同时跨过四个相连门槛：高端票价支付意愿、航程充足性、燃料可得性和气候正当性。任何一项失手，都可能削弱整个航线经济性故事。
