      - number: '2.4'
        title: 增长驱动因素看得见，但约束仍主导近端市场形态
        blocks:
          - type: paragraph
            body: >-
              航司和投资者反复回到商业超音速旅行，并非没有需求侧理由。长途航线节时真实存在，高端旅客也存在；围绕 SAF 兼容性的可持续定位，让承运人能把产品描述成现代化超音速，而不是简单复刻
              Concorde。政府对速度和低音爆研究的兴趣也帮了叙事。但约束堆栈仍比顺风堆栈更具体。陆上超音速限制仍在生效，法律和环境壁垒仍然活跃，安静飞行规则变化也还只是政策愿望，不是确定的市场输入。Forecast
              International 和 Daily News 都把时间表和工业化风险视为实质性风险。正确结论不是市场不存在，而是市场仍被监管、航线和资本强度锁住。这足以支撑一个利基市场投资逻辑，但不足以支撑大众采用逻辑。
