chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、阶段，以及 Boom 到底在造什么
        blocks:
          - type: paragraph
            body: >-
              与其把 Boom Supersonic 看成传统航空科技创业公司，不如把它看成一家后期航空航天开发公司。公开来源一致显示，公司创立于 2014 年，总部运营基地在
              Colorado；当下产品叙事横跨两个相连业务：超音速客机 Overture，以及 Boom 现在定位为飞机研发现金桥的固定式涡轮项目 Superpower。原始投资逻辑的核心仍是
              Overture。官方产品材料称，这是一款 Mach 1.7、60 至 80 座、航程 4,250 海里、兼容 100% SAF 的飞机。但阶段比参数更重要。Boom
              尚未投入商业服务，没有披露公开收入，认证和制造路径仍然开放。结果是：公司有罕见的公开雄心、看得见的里程碑，但投资判断还没闭环。
