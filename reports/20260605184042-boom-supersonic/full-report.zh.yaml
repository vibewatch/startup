      - number: '3.3'
        title: Boom、Spike、Hermeus 与现状替代品之间，商业模型和买方适配度差异很大
        blocks:
          - type: paragraph
            body: >-
              这些商业模型不能互换。Boom 的产品是航司机队决策：承运人必须判断航线经济性、高端客单价、飞机集成以及最终交付时间。Spike 的模型窄得多，也更依赖可自由支配支出，围绕一款 12 至 18
              座公务机的私人所有权和高端商务旅行。Hermeus 今天并不真正销售民用运输工具；其可见项目是与防务相关的测试和无人飞机，民用运输被放在更远期的衍生位置。X-59
              则纯粹是政府研究和标准推动项目。这些差异重要，因为买方不会在这些选项之间一比一切换。企业航空买家在 Spike 概念机和已认证 Gulfstream G700 之间选择，面对的权衡，与航司机队规划者评估 Boom
              完全不同。Spike 面临的替代压力直接且具体，因为 G700 已认证、在公务航空标准下速度很快，并为同一个高端旅行钱包设计。Boom 的难题不同：它必须证明商业航司愿意承担航司级开发风险，换取显著更快的航线。
