  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 两条收入故事现在并行：飞机与电力
        blocks:
          - type: paragraph
            body: >-
              Boom 的财务模型已经不能再描述成单一客机押注。公开材料和报道现在讲的是两条不同商业化故事。原始故事是 Overture：一个全新设计商业飞机项目，收入只有在认证、生产和航司交付之后才会到来。新故事是
              Superpower：一款固定式涡轮产品，Boom 希望它能更早产生可签约的企业收入，并帮助融资航空业务。这很重要，因为两款产品的客户类型、销售周期和收入确认画像差异很大。Overture
              收入可能是块状、受里程碑驱动；如果披露订单转化为交付，Superpower
              可能变成大额工业设备产品线。两条线共同的弱点，是缺少已披露的实际收入、毛利率或贡献经济性。因此，公开信号今天更清楚地描述了变现逻辑，而不是变现结果。
