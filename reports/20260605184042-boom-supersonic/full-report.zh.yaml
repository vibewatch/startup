      - number: '1.4'
        title: 里程碑真实存在，但反向背景仍是基准情景的一部分
        blocks:
          - type: paragraph
            body: >-
              Boom 的公司故事现在已有足够里程碑，尽调任务不再是判断有没有进展，而是判断进展是否足够。亮点很容易列：航司协议、Greensboro Superfactory 选址、Symphony 发布、XB-1
              超音速飞行。这些事件说明 Boom 不只是概念阶段。但公开反向证据也很具体。FlightGlobal 描述了短期延误，以及在 Overture 开发前转向发电的战略重排。Forecast
              International 明确把当前投入服务目标视为推测。STM Daily News 指向仍未解决的财务、监管和工业化障碍；American Bar Association
              则把陆上超音速制度概括为法律和行政负担都很重。即便 2026 AIAA 关于美国立法变化提案的说明，也强调 Boom 仍高度依赖未来规则制定。平衡后的结论是：Boom
              已经值得关注，但还没有从资本、认证和政策风险中获得逃逸速度。
