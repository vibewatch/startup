      - number: '4.2'
        title: 成本结构由发动机、认证、工装和工厂投入主导
        blocks:
          - type: paragraph
            body: >-
              Boom
              的公开成本结构，用定性语言比用定量数字更容易描述。公司同时在做全新设计发动机、推进发动机测试、采购先进制造设备，并搭建工厂级生产布局。这组动作意味着：在任何批量交付出现前，公司就要承担高额固定工程投入、高资本开支、漫长营运资本周期和显著供应商依赖。发动机开发报道进一步强化了这一点：公司仍处在零部件、台架测试和基础设施阶段，而不是稳定生产阶段。FlightGlobal
              提到发动机路径可能需要数十亿美元，这与其他证据方向一致，即便确切数字仍未披露。含义是，仅凭订单无法推断 Boom
              的毛利率和回本画像，因为开发和工业化会在收入确认前吃掉大量资本。这也是为什么私下单位成本披露比公开热度更重要。
