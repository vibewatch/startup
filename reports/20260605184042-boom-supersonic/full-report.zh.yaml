      - number: '7.5'
        title: 缓释因素真实存在，但投资判断仍要盯紧里程碑
        blocks:
          - type: paragraph
            body: >-
              Boom 确实有看得见的风险缓释。公司已经不只是概念图：XB-1 进入实际飞行测试，在 Greensboro 建起工厂，2025 年末又融到 $300 million，签下 SAF
              承购协议，也拼出一套比外部粗看更宽的供应商名单。这些都是实质性加分，足以让项目不再只是科学实验。但这不等于可以放松硬里程碑约束。正确的投资姿态，是等待客观外部确认，而不是只听管理层乐观叙事：FAA NPRM
              实际发布且 Part 36 路径站得住脚；Symphony
              和生产工装按计划成熟；客户承诺在经济上更扎实；燃料获取与航线经济性可以并存，不靠英雄式假设。公开记录也给出了清晰的投资逻辑失效信号。如果航程疑虑迟迟解决不了，供应商或认证里程碑延误，SAF 继续稀缺且昂贵，或
              Superpower 没能带来预期的融资弹性，Boom
              最后仍可能拿出漂亮的技术演示，却不是一个有吸引力的风险调整后股权标的。简言之，公司已经走到值得认真尽调的阶段，但还没走到足以让投资人忽略监管、工业化、燃料和客户集中度多重风险的阶段；这些风险仍会决定最终结果。
