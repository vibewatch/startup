      - number: '3.4'
        title: Boom 的护城河耐久性真实存在，但 Aerion 和 Exosonic 说明速度叙事很脆弱
        blocks:
          - type: paragraph
            body: >-
              在这个版图里，Boom 确实有相对护城河：它最接近航司买方，具名商业关系最清楚，也比多数同行更接近可认证商业产品。但 Aerion 和 Exosonic 留下的长期教训是，动能不等于可存活。Aerion
              曾有积压订单话术、供应商和高调愿景，最终仍因融资失败而清算。Exosonic 结合了防务支持、风投资金和亚尺度飞行进展，仍落入 R&D 与商业化之间的经典山谷。这些结局对 Boom
              很重要，因为它们说明该类别真正的瓶颈不只是能不能设计一架快飞机，而是能否多年保持资本、认证和客户信任同步。X-59 和 2026 年立法动能可能改善监管背景，但这部分上行会被整个类别共享，而不是 Boom
              独占。因此，最强的投资判断应当更细：Boom 可能领先这一组，但只有在市场失去耐心之前，把技术和商业信号转成认证级执行，它的护城河才耐久。
