      - number: '7.2'
        title: 全新设计认证、推进系统和制造爬坡仍在彼此叠加
        blocks:
          - type: paragraph
            body: >-
              第二个核心风险是技术执行的复合叠加。Boom 有真实能力证明：XB-1 在 January 2025 突破音障，公司也用这些经验把 Overture
              描述成已验证技术的演进。但这只降低了旅程的一部分风险。Overture 仍需要同时认证完整商业机体、全新设计推进系统和工业生产系统。独立报道正是在这些点上保持怀疑。Associated Press
              说认证会很艰巨，尤其是在 737 MAX 之后的监管环境里；Engadget 则记录了 Rolls-Royce 退出后，成熟发动机厂商最初对该项目兴趣多么有限。AIN 显示 Boom 仍以 2030
              年认证为目标，但目标日期不等于已清除里程碑。制造图景同样是双刃剑：Greensboro 现在是真实资产，有明确的年产 33 架产线和翻倍至 66
              架的计划；但每个工业项目在首件质量、工装流、供应商节奏和劳动力爬坡必须同时跑通之前，在 PowerPoint 上都显得很顺。因此，相关投资者姿态不应是“XB-1 已飞，所以认证风险已在身后”，而应是“XB-1
              证明了物理的一部分，但成本最高的认证和生产步骤还在前面”。
