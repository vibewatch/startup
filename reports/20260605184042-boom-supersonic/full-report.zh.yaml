  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Boom 现在运营的是一套多资产硬科技栈
        blocks:
          - type: paragraph
            body: >-
              Boom 的产品和技术版图已经不只是一个客机项目。Overture 是商业终点，XB-1 是用来消除气动和运营风险的验证机，Symphony 是专用推进系统，Superpower
              是面向地面发电的相邻固定式涡轮衍生品，Superfactory 则是把设计连接到交付硬件的制造骨架。这种多资产结构重要，因为每项资产在商业化路径中扮演不同角色。XB-1 证明飞行包线，Symphony 为
              Overture 提供动力，Superpower 在比喷气机项目更短的商业时间线上变现涡轮
              IP，工厂则支撑最终规模化。这个栈的强项是战略一致：每项资产都在为另一项资产去风险。弱点是，主要商业资产都还没有跨过认证终点线。即便如此，这张资产图谱也比单一飞机概念丰富得多。Boom
              选择自研推进系统，而不是许可一款现有发动机，既出于技术必要性，也出于长期 IP 策略：现有商业涡扇发动机没有一款能满足 Mach 1.7
              跨海客运所需的性能、噪声和油耗包线。这个选择增加执行风险；但如果成功，系统层面的竞争护城河会集中在 Boom 手里，而不是与发动机 OEM 分享。
