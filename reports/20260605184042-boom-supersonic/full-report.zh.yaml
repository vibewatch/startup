      - number: '2.3'
        title: 买方、用户和付款方并不相同——采用将由航司主导
        blocks:
          - type: paragraph
            body: >-
              Boom
              的客户旅程不是消费者主导，尽管终端乘客愿不愿意付费是投资逻辑的中心。直接买方是航司，因为航司必须投入资本、管理认证接口、训练机组，并决定哪些高端航线值得配置差异化高速产品。用户是重视缩短旅程时间的高端旅客；有效付款方则是航司内部网络规划、产品、财务和机队管理共同组成的联盟。这让采用路径既战略化，也很慢。订单和合作是有用信号，但不等于机队层面的广泛部署。采用很可能先从一小组高端跨洋航线开始：节时最容易货币化，监管复杂度也最低。结果是一个买方集中、部署选择性强、扩张曲线慢于通用市场报告暗示的市场。
