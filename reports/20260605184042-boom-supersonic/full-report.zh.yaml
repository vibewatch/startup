      - number: '4.3'
        title: 资本充足性仍是核心投资判断问题
        blocks:
          - type: paragraph
            body: >-
              最重要的财务问题不是 Boom 能不能吸引资本——它显然可以——而是当前和未来资本是否足以把 Overture 与 Symphony 都推到商业就绪，且不发生严重稀释或战略妥协。TechCrunch 和
              FlightGlobal 给出主要公开数据点：2025 年一轮与 Superpower 商业化绑定的 $300 million 融资。Tracxn 又补充了约 $700 million
              累计融资背景。但关键运营桥仍缺失。公开来源没有披露账上现金、月度烧钱、债务、现金跑道或下一轮融资触发条件。这意味着任何外部分析师都无法只凭公开记录负责任地计算偿付能力持续时间。实践中，Boom
              的资本充足性逻辑建立在两个假设上：Superpower 会成为可融资的桥，认证时间表不会比资金获取速度拉长得更快。这个假设可能成立，但还没有被证明。投资者是在承销一个缺口：披露里程碑与未披露流动性之间的缺口。
