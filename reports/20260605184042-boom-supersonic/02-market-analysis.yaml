- id: buyer-and-adoption
  title: Buyer, user, and payer are distinct — and adoption will be airline led
  body: Boom’s customer journey is not consumer-led even though end-passenger willingness to pay is central to the thesis. The direct buyer is the airline, because airlines must commit capital, manage certification interfaces, train crews, and decide which premium routes merit a differentiated high-speed product. The user is the premium passenger who values shorter journey times, while the effective payer is a coalition inside the airline spanning network planning, product, finance, and fleet management. This makes the adoption path both strategic and slow. Orders and partnerships are useful signals, but they are not the same as broad deployment across fleets. Adoption will likely begin on a narrow set of premium transoceanic routes where time savings are easiest to monetize and regulatory complexity is lowest. That creates a market with concentrated buyers, selective deployment, and a slower scaling curve than generic market reports imply.
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM017
  - CM018
  - CM031
  - CM033
  - CM034
