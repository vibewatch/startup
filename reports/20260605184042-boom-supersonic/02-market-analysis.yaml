callouts:
- calloutType: insight
  title: Headline TAM is directionally helpful but not investment-grade on its own
  body: The useful market question is not whether supersonic aviation is a multi-billion-dollar category, but how much of that category is commercially reachable by one premium airline product under current rules.
  claimRefs:
  - CM001
  - CM003
  - CM004
  - CM029
- calloutType: risk
  title: Regulation defines market size as much as customer appetite does
  body: Without broader overland no-boom permissions, the immediately monetizable market remains concentrated in overwater premium routes, limiting scale and slowing fleet adoption.
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM036
- calloutType: strength
  title: A niche market can still be large enough
  body: Boom does not need mass-market aviation demand to matter; a narrow set of high-yield routes and a small group of committed carriers could still support a meaningful business if certification and economics work.
  claimRefs:
  - CM005
  - CM018
  - CM031
  - CM035
