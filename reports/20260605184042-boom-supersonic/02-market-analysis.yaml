company:
  name: Boom Supersonic
chapter:
  number: 2
  title: Market Analysis
  summary: 'Boom’s addressable market is narrower than headline “supersonic jet” reports suggest because real near-term demand is concentrated in premium long-haul overwater routes, a small set of airlines, and a regulatory regime that still blocks routine overland supersonic operations. Third-party market reports suggest a multi-decade market measured in tens of billions of dollars, but those estimates often blend military and commercial demand and therefore materially overstate the immediately contestable commercial opportunity for Boom. The more credible near-term market is a constrained premium-airline wedge: carriers with high-yield transoceanic traffic, willingness to pay for differentiated speed, and balance sheets strong enough to absorb fleet-introduction risk.'
sections:
- id: market-boundary
  title: The relevant market is premium supersonic transport, not the entire supersonic-jet universe
  body: 'Headline industry reports use the phrase “supersonic jet market” broadly, but that framing is too loose for underwriting Boom. Public market reports include military, defense, and generalized supersonic categories that are not directly comparable to Boom’s intended commercial airliner business. Boom’s nearer-term market is much narrower: premium long-haul passenger transport on routes where airlines can monetize material time savings. That framing immediately excludes large parts of the reported TAM, especially military spend and other aircraft classes. It also clarifies the substitute set. Today’s actual alternatives are premium subsonic widebody cabins and some business-aviation use cases, not competing commercial supersonic fleets already in service. This boundary matters because Boom can be directionally right about long-run industry potential while still addressing a much smaller practical market for its first decade. The real diligence task is to estimate the premium-route
    wedge that can support Overture economics under current regulation, not to accept headline aircraft-market figures at face value. That narrower framing is the starting point for every later valuation and adoption assumption.'
  claimRefs:
  - CM001
  - CM003
  - CM004
  - CM006
  - CM015
  - CM029
  - CM030
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Multiple sizing lenses point to a constrained but non-trivial opportunity
  body: The sizing evidence is directionally useful but should be treated as a stack of lenses rather than a single number. Fortune Business Insights and The Business Research Company both publish markets in the tens of billions of dollars, which tells us the broader industry is large enough to attract capital, policy attention, and multiple technical approaches. But those same figures become less actionable once the market is segmented into commercial passenger service, then narrowed again to premium long-haul overwater routes that do not depend on future no-boom rulemaking. Boom’s own route claims are more useful for SAM framing than generic TAM reports because they anchor on where Overture could theoretically operate. Even then, 600 potential routes do not equal 600 fleet decisions or 600 profitable aircraft slots. The practical market is therefore probably much smaller than published TAM, but still large enough that a small number of airline wins could matter economically if certification
    and route economics hold.
  claimRefs:
  - CM001
  - CM003
  - CM005
  - CM016
