  evidenceGaps:
  - type: missing-source
    severity: material
    topic: route-yield-data
    missingEvidence: No reviewed public source disclosed route-level premium pricing, load factor assumptions, or contribution margin for candidate Overture routes.
    whyItMatters: Without route economics, the SAM cannot be translated into aircraft demand or airline ROI.
    diligencePath: Request route-level business cases for sample Atlantic and Pacific city pairs.
    relatedQuestionRefs:
    - QM008
    - QM010
    - QM025
  - type: conflicting-data
    severity: material
    topic: market-definition-vs-headline-tam
    missingEvidence: Public market reports use broad definitions that conflict with Boom’s narrow premium-airline commercial wedge.
    whyItMatters: If the wrong market boundary is used, valuation and adoption expectations become inflated.
    diligencePath: Build a bottom-up route and airline willingness-to-pay model instead of relying on generic category reports.
    relatedQuestionRefs:
    - QM001
    - QM005
    - QM020
    relatedTableRefs:
    - TM001
    - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion
    missingEvidence: No public source reviewed here shows how many airlines beyond announced partners are actively evaluating Overture.
    whyItMatters: The difference between symbolic customer interest and a repeatable sales funnel is critical for market sizing.
    diligencePath: Request pipeline data by airline, route family, and stage.
    relatedQuestionRefs:
    - QM009
    - QM010
    - QM022
    - QM023
    relatedTableRefs:
    - TM003
  - type: stale
    severity: material
    topic: policy-timing
    missingEvidence: Legislative momentum exists, but public evidence does not yet close the timeline for actual FAA rule change and market opening.
    whyItMatters: The timing of policy change directly affects Boom’s practical market and adoption curve.
    diligencePath: Track FAA rulemaking calendar, ICAO low-boom standards work, and X-59 data milestones.
