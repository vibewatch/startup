company:
  name: Boom Supersonic
chapter:
  number: 4
  title: Financials
  summary: 'Boom’s financial story is dominated by capital intensity, pre-service uncertainty, and the recent attempt to create a nearer-term cash engine through Superpower. Public sources support three concrete facts: Boom disclosed a $300 million 2025 financing round, Superpower’s first customer committed to 29 turbines with a claimed $1.25 billion order value, and Overture remains a clean-sheet airliner program whose engine and certification path will require much more capital than public equity raised so far. What public evidence does not provide is equally important: no verified revenue run rate, no cash balance, no monthly burn, no gross margin bridge, and no route-level unit economics. The result is a business that is financeable only on milestone confidence, not on disclosed operating fundamentals.'
sections:
- id: revenue-model
  title: 'Two revenue stories now coexist: aircraft and power'
  body: 'Boom’s financial model can no longer be described as a single airliner bet. Public materials and reporting now describe two distinct commercialization stories. The original story is Overture: a clean-sheet commercial aircraft program whose revenue will arrive only after certification, production, and airline delivery. The newer story is Superpower: a stationary turbine product that Boom hopes can generate earlier, contractable enterprise revenue and help finance the aviation side. That matters because the two products have meaningfully different customer types, sales cycles, and recognition profiles. Overture revenue is likely to be lumpy and milestone-driven, while Superpower could become a large-ticket industrial equipment line if disclosed orders convert into deliveries. The common weakness across both lines is the absence of disclosed realized revenue, gross margin, or contribution economics. Public signals therefore describe monetization logic more clearly than they describe
    monetization results today.'
  claimRefs:
  - CI001
  - CI002
  - CI008
  - CI015
