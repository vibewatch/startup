  - type: missing-source
    severity: material
    topic: governance-and-board
    missingEvidence: Reviewed public sources do not provide a clean, current board roster or committee structure.
    whyItMatters: Governance quality matters more when one founder remains central to strategy, capital raising, and regulatory narrative.
    diligencePath: Request current board list, committee charters, and biographies for independent directors.
