callouts:
- calloutType: strength
  title: Boom has crossed the threshold from concept to public proof
  body: The company now has enough concrete milestones — airline agreements, factory siting, engine announcements, and XB-1 supersonic flight — that diligence should focus on conversion and execution risk rather than on whether the program exists in substance.
  claimRefs:
  - CO015
  - CO018
  - CO020
  - CO021
- calloutType: risk
  title: The adverse case is already visible in public reporting
  body: Independent reporting does not dispute that Boom is making progress, but it does dispute whether the company can certify and industrialize Overture on the marketed timeline without additional delay, capital, or regulatory relief.
  claimRefs:
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
- calloutType: insight
  title: Superpower changes the identity of the company
  body: The 2025 funding round and Crusoe order mean Boom can no longer be analyzed only as an airliner startup; it is now also betting that a power-turbine line can finance and de-risk the longer Overture path.
