company:
  name: Boom Supersonic
chapter:
  number: 1
  title: Company Overview
  summary: Boom Supersonic is a Colorado aerospace company founded in 2014 to revive commercial supersonic travel with the Overture airliner and the XB-1 demonstrator program. Public evidence shows meaningful technical and commercial milestones — including XB-1's 2025 supersonic flight, airline order announcements, and a 2025 $300 million financing tied to the new Superpower turbine business — but also shows that Boom remains a late-stage, pre-revenue aircraft developer whose thesis depends on engine certification, manufacturing scale-up, and regulatory change. The company now sits at the intersection of aviation, advanced propulsion, and power infrastructure, with a broader stakeholder map than a conventional airframe startup.
sections:
- id: identity-and-stage
  title: Identity, stage, and what Boom is actually building
  body: 'Boom Supersonic is best understood as a late-stage aerospace development company rather than a conventional airline-tech startup. Public sources consistently place the company’s founding in 2014 and its operating base in Colorado, while the current product narrative spans two linked businesses: Overture, the supersonic passenger airliner, and Superpower, a stationary turbine program that Boom now frames as a cash-generating bridge to aircraft development. Overture remains the center of the original thesis. Official product materials describe a Mach 1.7 aircraft with 60 to 80 seats, 4,250 nautical miles of range, and compatibility with 100% sustainable aviation fuel. But the stage matters more than the headline specs. Boom has not entered commercial service, has not disclosed public revenue, and still depends on a certification and manufacturing path that remains open-ended. The result is a company with unusually strong public ambition, tangible milestones, and a still-unfinished
    underwriting case.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO006
  - CO011
  - CO012
  - CO013
  - CO031
  - CO035
  - CO037
- id: leadership-and-founder-dependence
  title: Founder-led leadership with clear key-person concentration
  body: 'Leadership evidence is thinner than product marketing evidence, but the overall pattern is clear: Boom remains founder-led and founder-shaped. Blake Scholl is the public face of the company, the most visible spokesperson in customer, fundraising, and policy narratives, and the connective tissue between the original aviation thesis and the newer power-generation pivot. Third-party profiles also identify Joe Wilding and Joshua Krall as co-founders, but they are materially less visible in current public communications. That imbalance matters because Boom’s most difficult work now sits at the intersection of strategy, fundraising, policy, and technical sequencing. Even the addition of senior propulsion leadership for Symphony does not fully dilute the dependence on Scholl as storyteller, capital allocator, and regulatory advocate. For diligence purposes, the leadership story is credible but concentrated: the company’s public momentum still looks heavily dependent on one executive’s
    ability to keep multiple stakeholder groups aligned through a long and expensive development cycle.'
  claimRefs:
  - CO004
  - CO005
  - CO021
  - CO030
  - CO034
  - CO038
  tableRefs:
  - TO002
  figureRefs:
  - FO003
- id: capital-base-and-stakeholders
  title: Capital base, investors, and commercial counterparties
  body: 'Public evidence supports the broad outline of Boom’s capital stack even though it does not close the loop on cap table structure or preferences. Tracxn places lifetime funding at about $700 million and valuation near $1.5 billion, while TechCrunch provides the clearest public detail on the latest known financing: a $300 million round led by Darsana Capital Partners with participation from Altimeter, ARK, Bessemer, Robinhood Ventures, and Y Combinator. Customer and counterparty evidence is similarly real but still pre-delivery. Boom has announced American Airlines, United, and Japan Airlines agreements, and those airline relationships are central to the commercialization narrative, but they are still commitments ahead of certified service rather than delivered fleet revenue. The new Superpower program adds another stakeholder group entirely by bringing in Crusoe as a power-equipment buyer and potentially changing how future investors think about Boom’s cash generation. This is a
    meaningful capital story, but it is not yet a de-risked one.'
  claimRefs:
  - CO007
