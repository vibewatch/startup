- id: milestones-and-adverse-context
  title: Milestones are real, but adverse context remains part of the base case
  body: 'Boom’s company story now includes enough milestones that the diligence task is no longer to determine whether progress exists, but to determine whether that progress is sufficient. The high points are easy to name: airline agreements, the Greensboro Superfactory site, the Symphony launch, and XB-1’s supersonic flight. Those events show that Boom is not merely concept-stage. But public adverse evidence is also concrete. FlightGlobal describes a short-term delay and strategic resequencing toward power generation before Overture development. Forecast International explicitly frames the current service-entry target as speculative. STM Daily News points to unresolved financial, regulatory, and industrial hurdles, while the American Bar Association summarizes the overland supersonic regime as legally and administratively burdensome. Even the 2026 AIAA note on proposed U.S. legislative change underscores how dependent Boom still is on future rulemaking. The balanced conclusion is that
    Boom has earned attention, but not yet escape velocity from capital, certification, and policy risk.'
