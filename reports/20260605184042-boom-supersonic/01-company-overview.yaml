  - type: private-evidence-only
    severity: material
    topic: cap-table-and-round-terms
    missingEvidence: Public sources do not disclose the 2025 round price, liquidation preferences, board rights, or ownership concentration.
    whyItMatters: A $1.5B headline valuation is not enough to underwrite entry without understanding preference stack and governance control.
    diligencePath: Request financing documents, current cap table, and board observer / voting rights summary.
