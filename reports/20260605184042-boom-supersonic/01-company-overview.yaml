    severity: material
    topic: headcount-and-revenue-metrics
    missingEvidence: No high-confidence public source reviewed here disclosed current headcount or revenue run rate.
    whyItMatters: Those metrics are essential for comparing Boom against other late-stage aerospace and industrial startups.
