  topStrengths:
    - >-
      June 2025 Trump executive order lifts 52-year FAA overland supersonic ban — most significant regulatory tailwind
      in aerospace in 50+ years
    - >-
      130-aircraft pre-order book from American Airlines, Japan Airlines, and United Airlines represents largest
      supersonic commercial order book since Concorde
    - XB-1 demonstrator achieved Mach 1.122 in March 2024, validating core aerodynamic design thesis
    - Superpower turbine program provides nearer-term revenue bridge independent of Overture certification timeline
  topRisks:
    - >-
      Decade-long path to EIS (early 2030s) means capital requirements ($1-3B more needed) far exceed current raises
      with no revenue offset
    - >-
      FAA Type Certificate process for a supersonic civil transport is entirely novel; certification standard still
      being written
    - >-
      Pre-orders are conditional and no airline has publicly reaffirmed orders since 2022; cancellation risk is real and
      unquantifiable
    - >-
