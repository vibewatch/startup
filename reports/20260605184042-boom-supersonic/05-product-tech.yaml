- id: maturity-and-roadmap
  title: Maturity is real but uneven across subsystems
  body: Public evidence supports meaningful technical progress. XB-1 has flown and broken the sound barrier, recording a top
    speed of Mach 1.122 on its March 21, 2024 flight. Combustion, thrust, and manufacturing updates show the Symphony propulsion
    program advancing. Supplier announcements show an ecosystem forming around avionics, aerostructures, MRO, and test work.
    But maturity is uneven across subsystems. The demonstrator is ahead of the certifiable product, and the product is ahead
    of public proof on reliability and factory yield. That is why roadmap analysis matters more than milestone headlines.
    Overture's target entry-into-service timeline references the early 2030s, but program-level certification milestones have
    not been publicly committed with binding dates. A system can show progress in every subsystem and still remain years away
    from dependable production readiness. The reviewed independent sources repeatedly make that caution explicit, and public
    hiring and communication signals reinforce that the build is ongoing.
  claimRefs:
  - CE011
  - CE012
  - CE015
  - CE020
  - CE021
  - CE022
  - CE024
  - CE027
  - CE033
  tableRefs:
