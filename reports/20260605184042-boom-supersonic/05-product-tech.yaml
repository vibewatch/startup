  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-and-yield
    missingEvidence: No reviewed public source disclosed reliability statistics, qualification success rates, or factory yield.
    whyItMatters: Those are the decisive proof points for a clean-sheet aerospace program.
    diligencePath: Request reliability, qualification, and yield dashboards by subsystem.
    relatedQuestionRefs:
    - QE017
    - QE022
    - QE025
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: architecture-detail
    missingEvidence: Public sources do not disclose a full controls/software architecture or integration stack.
    whyItMatters: Without that detail, it is hard to test where technical differentiation truly lives.
    diligencePath: Request system architecture diagrams and integration responsibilities by partner.
    relatedQuestionRefs:
    - QE009
    - QE013
    - QE023
    relatedTableRefs:
    - TE003
  - type: conflicting-data
    severity: material
    topic: maturity-vs-timeline
    missingEvidence: Independent sources acknowledge progress but still treat service-entry timing as speculative.
    whyItMatters: Product maturity and delivery timing are the variables that connect technology to finance.
    diligencePath: Request integrated milestone closeout by airframe, propulsion, certification, and factory readiness.
    relatedQuestionRefs:
    - QE019
    - QE020
    - QE024
    relatedTableRefs:
    - TE005
    - TE001
