chapter:
  number: 5
  title: Product & Technology
  summary: 'Boom’s technology stack is broader than a single aircraft: it spans the Overture airframe, the XB-1 demonstrator,
    the Symphony propulsion program, the Superpower stationary turbine, and the manufacturing and supplier infrastructure
    required to industrialize all of them. Public evidence supports genuine technical progress — XB-1 supersonic flight, combustion-system
    testing, 3D-printed engine components, avionics and aerostructure partner announcements, and a growing factory narrative
    — but it also confirms that core system maturity is still pre-certification. The technology case is strongest on integrated
    design intent and partner assembly; it is weakest on published reliability, qualification, and production-proof data.'
sections:
- id: product-stack
  title: Boom now operates a multi-asset hard-tech stack
  body: 'Boom''s product and technology footprint is broader than an airliner program alone. Overture is the commercial endpoint,
    XB-1 is the demonstrator that retires aerodynamic and operational risk, Symphony is the dedicated propulsion system, Superpower
    is the adjacent stationary-turbine derivative for ground-based power generation, and the Superfactory is the manufacturing
    backbone that must connect design to delivered hardware. That multi-asset structure matters because each asset plays a
    different role in the commercialization pathway. XB-1 proves flight envelope, Symphony powers Overture, Superpower monetizes
    turbine IP on a shorter commercial timeline than the jet program, and the factory enables eventual scale. The strength
    of the stack is strategic coherence: each asset de-risks another. The weakness is that none of the major commercial assets
    has yet crossed the certification finish line. Even so, the asset map is materially richer than a single-aircraft concept.
    Boom''s decision to develop an in-house propulsion system rather than license an existing engine reflects both technical
    necessity and long-term IP strategy: no existing commercial turbofan meets the performance, noise, and fuel-burn envelope
    required for Mach 1.7 overwater passenger service. That choice increases execution risk but, if successful, concentrates
    competitive moat in the system rather than sharing it with an engine OEM.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
