    {
      "id": "mitigations-monitors-and-thesis-breaks",
      "title": "Mitigations are real, but the underwriting should stay milestone-driven",
      "body": "Boom does have visible mitigations. The company has moved from concept renderings to an operating XB-1 flight-test campaign, built a real factory in Greensboro, raised another $300 million in late 2025, signed SAF offtakes, and assembled a wider supplier roster than a casual observer might expect. Those are meaningful positives and they prevent this from being a pure science-project story. But they do not remove the need for hard milestone discipline. The right investment posture is to watch for objective external confirmations rather than management optimism alone: a live FAA NPRM and durable Part 36 path, evidence that Symphony and production tooling are maturing on schedule, stronger proof that customer commitments are economically firm, and signs that fuel access plus route economics can coexist without depending on heroic assumptions. The public record also supplies clear thesis-break signals. If range concerns remain unresolved, if supplier or certification milestones slip, if SAF stays scarce and expensive, or if Superpower fails to produce the intended financing flexibility, then Boom can still end up with impressive technical demonstrations but an unattractive risk-adjusted equity case. In short, the company has advanced far enough to deserve serious diligence, but not far enough to let investors underwrite away the stacked regulatory, industrial, fuel, and concentration risks that still govern the outcome.",
