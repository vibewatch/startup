    {
      "id": "certification-engine-and-manufacturing-risk",
      "title": "Clean-sheet certification, propulsion, and manufacturing scale-up still stack on top of one another",
      "body": "The second core risk is compounding technical execution. Boom has real proof of capability: XB-1 broke the sound barrier in January 2025, and the company is using those learnings to frame Overture as an evolution of already-demonstrated technologies. But that de-risks only part of the journey. Overture still requires certifying a full commercial airframe, a clean-sheet propulsion system, and an industrial production system at the same time. Independent reporting remains skeptical on exactly those points. Associated Press says certification will be daunting, especially after the post-MAX regulatory environment, while Engadget documents how little enthusiasm established engine makers initially had for the project after Rolls-Royce exited. AIN shows Boom continuing to target 2030 certification, but target dates are not the same thing as cleared milestones. The manufacturing picture is similarly double-edged: Greensboro is now real, with an explicit 33-aircraft annual line and a plan to double to 66, but every industrial program looks straightforward on PowerPoint before first-article quality, tooling flow, supplier timing, and workforce ramp all have to work simultaneously. The relevant investor stance is therefore not “XB-1 flew, so certification risk is behind us,” but “XB-1 proved a subset of physics while the highest-cost certification and production steps still lie ahead.”",
