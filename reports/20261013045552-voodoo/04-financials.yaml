  - id: TI002
    title: Pricing / Monetization Table
    columns:
      - Price / Unit / Contract
      - List vs Realized Pricing
      - Discounts / Unknowns
      - Source
    rows:
      - - In-App Purchases ($0.99 to $99.99)
        - List tier in app stores; realized is net of 15-30% platform take-rate
        - Platform promotional discounts and bundle offers
        - Voodoo Official & App Store data
      - - Ad Network Placement (CPM basis)
        - Market-driven programmatic CPMs ($5 - $25 depending on geo)
        - Fluctuates based on seasonality and advertiser demand
        - Voodoo Publishing Playbook
      - - Studio Revenue Share (30% - 50% net)
        - Contractual split of net gaming billings after UA costs
        - Custom tiering and recoupment provisions undisclosed
        - Industry publishing benchmarks & GWO
      - - BeReal Ad Inventory (Nascent)
        - Pilot brand advertising rates under development
        - Commercial pricing terms not publicly disclosed
        - Fitch Credit Report & TechCrunch
    notes: Monetization terms reflect published hybrid mobile game conventions, official publishing framework guidelines, and credit rating agency observations.
    claimRefs:
      - CI006
      - CI007
      - CI008
  - id: TI003
    title: Unit Economics Table
    columns:
      - Metric
      - Value / Status
      - Confidence
      - Why It Matters
      - Diligence Ask
    rows:
      - - Reported EBITDA Margin
        - 21.7% (€135M on €623M revenue)
        - Medium
        - Indicates overall operating profitability across portfolio
        - Audited GAAP/IFRS EBITDA bridge
      - - Fitch-Adjusted EBITDA Margin
        - 11.4% (€71M on ~€623M revenue)
        - High
        - Normalizes for capitalized R&D and restructuring costs
        - Reconciliation of Fitch vs company definitions
      - - Free Cash Flow Margin
        - 2.7% (€17M in 2024; forecast 3-6%)
        - High
        - Critical for organic deleveraging and capex coverage
        - Working capital schedule and interest burden
      - - D7 Retention Benchmark
        - 15% - 20% minimum target
        - Medium
        - Baseline filter required before scaling hybrid titles
        - Title-by-title cohort retention curves
    notes: Unit economics metrics reflect 2024 reported operational releases, credit rating agency reconciliations, and executive podcast disclosures.
