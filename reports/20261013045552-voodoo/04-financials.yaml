        - Titles active >2 years (e.g., Mob Control, Paper.io)
        - Share of revenue
        - Nearly 80% of 2024 revenue
        - Resilient recurring player base
        - Decay curve and maintenance capex
      - - Social App Platform (BeReal)
        - Early-stage monetization and advertising integration
        - Contribution status
        - Pre-monetization / loss-making in 2024
        - High execution risk; low visibility
        - Monthly active user trend and ARPDAU
