callouts:
  - calloutType: insight
    title: Hybrid-Casual Transformation Rebalances Revenue Quality
    body: Voodoo's transition away from pure hyper-casual advertising toward in-app purchases has expanded revenue visibility and reduced dependence on volatile ad networks, with IAP reaching 45% of revenue in 2024 compared to just 1% in 2021.
    claimRefs:
      - CI002
      - CI005
  - calloutType: risk
    title: Leverage and Refinancing Vulnerability Under Stan Holding SAS
    body: While Voodoo generated €135 million in company-reported EBITDA in 2024, its leveraged capital structure under Stan Holding SAS—featuring a €220 million term loan—demanded credit agency monitoring and prompted a €175 million debt refinancing in early 2025.
    claimRefs:
      - CI003
      - CI011
