company:
  name: Voodoo
chapter:
  number: 4
  title: Financials
  summary: Voodoo generated record revenue of €623 million in 2024 with €135 million in reported EBITDA, driven by a strategic transformation from ad-reliant hyper-casual games to IAP-heavy hybrid titles. However, credit metrics reveal substantial leverage under Stan Holding SAS with a €220 million term loan refinanced in early 2025, while unproven monetization at BeReal and opaque studio revenue splits present key diligence hurdles.
sections:
  - id: revenue-streams-and-mix
    title: Revenue Streams and Business Model Evolution
    body: 'Voodoo''s commercial financial model has undergone a comprehensive transformation from low-retention hyper-casual mobile titles monetized entirely by programmatic advertisements into sophisticated hybrid-casual games anchored by recurring in-app purchases. In fiscal year 2024, the company recorded consolidated annual revenues of €623 million, marking nearly 20% year-over-year expansion compared to 2023. Historically, hyper-casual games represented 100% of company revenues as recently as 2021; by 2024, that segment compressed to just 22% of top-line revenue as user privacy shifts degraded programmatic advertising yields. Concurrently, in-app purchases scaled aggressively to represent 45% of total revenue, generating more stable multi-month customer monetization. Furthermore, revenue durability is underpinned by long-tail titles: nearly 80% of 2024 revenue originated from games active for more than two years, demonstrating that live operations and meta-progression loops have substantially extended game lifespans beyond ephemeral download spikes.'
    claimRefs:
      - CI001
      - CI002
      - CI005
    tableRefs:
      - TI001
    figureRefs:
      - FI001
  - id: monetization-pricing-and-gtm
    title: Monetization Architecture and GTM Channel Economics
    body: The core monetization engine combines high-volume free-to-play consumer onboarding with layered commercial touchpoints across advertising networks and microtransactions. For hybrid titles, gameplay loops integrate rewarded video advertisements for optional player multipliers alongside microtransaction bundles ranging from $0.99 consumables up to $99.99 progression packages. Following Apple's App Tracking Transparency enforcement, customer acquisition costs increased substantially across casual gaming genres, making pure ad-funded models unsustainable. Voodoo navigated this headwind through proprietary automated testing platforms and cross-channel marketing automation via tools like BidShake, testing roughly 2,000 game prototypes per year to isolate projects with high organic appeal. When a concept demonstrates acceptable early retention, Voodoo deploys performance marketing to scale player cohorts, with hit games like Mob Control and Block Jam 3D achieving gross revenues between $20 million and $100 million annually.
    claimRefs:
      - CI006
      - CI007
      - CI008
    tableRefs:
      - TI002
  - id: cost-structure-and-unit-economics
    title: Cost Structure, Gross Margins, and Unit Economics
    body: Voodoo's cost architecture is shaped by platform distribution take-rates, external partner studio revenue-sharing agreements, paid user acquisition marketing, and engineering payroll across 800 employees. For mobile games distributed via the Apple App Store and Google Play, platform commissions absorb approximately 15% to 30% of gross consumer spend. Additionally, because roughly 75% of commercial releases originate from Voodoo's global network of over 2,000 independent partner studios, contractual royalty splits represent a material operating expense. On an accounting basis, management reported 2024 EBITDA of €135 million, representing a 21.7% reported margin. However, credit rating analysis by Fitch normalized 2024 EBITDA at €71 million (an 11.4% margin), treating software development costs as operating expenses rather than capitalized investments. At the unit level, hybrid greenlighting mandates a strict minimum of 15% Day-7 player retention, ensuring that lifetime customer value exceeds initial customer acquisition expense before live operations teams commit ongoing scaling capital.
    claimRefs:
      - CI004
      - CI009
      - CI010
    tableRefs:
      - TI003
  - id: capital-adequacy-and-leverage
    title: Capital Adequacy, Debt Structure, and Refinancing
    body: The financial health and balance sheet sustainability of Voodoo must be evaluated through its corporate holding structure, Stan Holding SAS, which carries substantial syndicated debt. At year-end 2024, the capital structure was anchored by a €220 million senior secured Term Loan B maturing in November 2025, alongside an undrawn €30 million revolving credit facility. Fitch Ratings placed the Term Loan B on Rating Watch Negative in early 2025 due to near-term maturity concentration. However, refinancing risks were mitigated by €101 million in available year-end cash balances and positive free cash flow generation projected at 3% to 6% of revenue. In April 2025, Voodoo resolved immediate liquidity vulnerabilities by successfully executing a debt refinancing exceeding €175 million with an institutional banking consortium, demonstrating continued access to credit markets and restoring balance sheet flexibility.
    claimRefs:
      - CI003
      - CI011
      - CI012
  - id: financial-verdict-and-underwriting-gaps
    title: Financial Verdict and Diligence Gaps
    body: From an investment diligence perspective, Voodoo displays impressive operational adaptability, having successfully pivoted away from the collapsing hyper-casual ad model into a profitable, recurring hybrid-casual publisher. Nevertheless, prospective investors face notable underwriting obstacles. Foremost among these is the €500 million acquisition of social photo application BeReal in June 2024. BeReal entered the portfolio with minimal commercial monetization, and credit analysts project it will remain loss-making through at least 2026, posing ongoing execution risk and potential drain on operating cash flows. Furthermore, the absence of public audited statutory accounts leaves material discrepancies between management's reported €135 million EBITDA and rating agency figures. Underwriters require audited reconciliation schedules and standalone BeReal cohort retention metrics before validating normalized earnings quality.
    claimRefs:
      - CI013
      - CI014
