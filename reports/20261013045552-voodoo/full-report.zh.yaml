              生态。平台隐私限制，尤其是 Apple 执行 App Tracking Transparency，永久损害了广告归因，推高超休闲和混合休闲品类的获客成本。此外，Fitch Ratings
              的信用评估强调，混合休闲多元化虽然改善了利润率可见度，但短期债务到期风险和整合 BeReal 的持续亏损仍限制财务灵活性。Voodoo 通过裁撤 28 名工程、QA 和营销员工应对 BeReal
              的运营整合，凸显了将未变现社交应用转向盈利所面临的技术和成本挑战。
