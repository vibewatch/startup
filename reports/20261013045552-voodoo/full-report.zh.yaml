  - id: FE001
    title: 产品架构与技术运营栈
    type: stack
    summary: 六层架构展示 Voodoo 端到端的移动发行、客户端运行时、增长自动化及分发基础设施。
    approximationNotes: 架构分层反映公开的技术合作、公司平台披露及信用评级资料。
    claimRefs:
      - CE002
      - CE004
      - CE010
      - CE014
    data:
      layers:
        - label: 分发与应用商店生态
          detail: 通过 Apple App Store 和 Google Play 建立全球分发通道，服务超过 150M 月活跃用户，累计下载量达 8B。
        - label: 移动应用产品组合层
          detail: 覆盖多种品类，包括老牌 Hyper-Casual 产品（Paper.io）、Hybrid-Casual 爆款（Mob Control）及消费者社交应用（BeReal）。
        - label: 嵌入式客户端 SDK 与分析层
          detail: 自研 Unity SDK 套件提供自动化广告聚合、GameAnalytics 遥测、远程配置及应用内购买计费。
        - label: 营销与创意自动化引擎
          detail: 自动化用户获取套件与 Bidshake 引擎通过全球效果营销渠道每年产出 25,000 个广告创意。
        - label: 云后端与 QA 基础设施层
          detail: Tencent Cloud 分布式基础设施与 WeTest 自动化测试环境管理多设备兼容性及 live ops 稳定性。
        - label: 自有广告网络与变现核心
          detail: 内部广告网络每年服务超过 2,500 亿次曝光，并配合预测性留存模型推动 Hybrid 变现。
  - id: FU001
    title: Voodoo 双边客户与创作者旅程图
    type: journey-map
    summary: 展示消费者玩家与外部合作工作室并行经历的获取、入门、变现和扩张阶段。
    data:
      items:
        - label: 消费者 UA 与安装
          stage: 获取
          touchpoints:
            - TikTok 和 Meta 上的定向社交视频广告
            - 通过 App Store 和 Google Play 的自然搜索发现
            - 在 Voodoo 的 150M 月活跃用户网络中交叉推广
          sentiment: positive
        - label: 核心玩法与广告互动
          stage: 激活
          touchpoints:
            - 立即可上手、零摩擦的入门流程
            - 尽早展示插屏广告和激励视频广告
            - 对照 45% 基准跟踪次日留存
          sentiment: neutral
        - label: 元进度与 IAP 转化
          stage: 变现
          touchpoints:
            - 可解锁的冠军角色与季节性 live-ops 活动
            - 去广告礼包与消耗型助推器购买
            - 转化为经常性付费用户，支撑 45% 的 IAP 收入
          sentiment: positive
        - label: 工作室原型提交
          stage: 合作伙伴获取
          touchpoints:
            - Voodoo 发行门户与黑客松提交
            - 集成 Voodoo 轻量级测试 SDK
            - 初始 CPI 与次日留存测试
          sentiment: neutral
        - label: 自动化评估与实时运营
          stage: 合作伙伴扩张
          touchpoints:
            - PipelineIQ Pro 分析筛选，对照 15% 的 D7 门槛
            - 全额分配 UA 营销预算并制作创意
            - 通过收入分成变现，并提供多年扩张支持
          sentiment: positive
        - label: 平台政策与流失风险
          stage: 留存障碍
          touchpoints:
            - Apple ATT 跟踪限制推高获取成本
            - 休闲用户对广告疲劳，导致放弃会话
            - 提前终止不可行原型，以削减损失
          sentiment: negative
    approximationNotes: 该图代表 Voodoo 的运营客户生命周期模型，综合发行指南、高管访谈及评级机构评论得出。
