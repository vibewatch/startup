figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Voodoo 从创立、主导 Hyper-Casual，到转向 Hybrid-Casual 及拓展消费者应用的里程碑。
    data:
      items:
        - date: 2013-2016
          label: 创立与原型开发
          detail: Voodoo 由 Alexandre Yazdi 和 Laurent Ritter 在巴黎创立；从失败的内部问答游戏转向快速原型开发。
          tone: neutral
        - date: 2016-2018
          label: 发行模式与 Paper.io
          detail: 将每周测试和工作室辅导工业化；推出突破性爆款 Paper.io，下载量超过 3,500 万。
          tone: positive
        - date: 2019-2020
          label: Hyper-Casual 规模峰值
          detail: 扩展至 800 家合作工作室，收入达到 $400M；Tencent 于 2020 年 8 月收购战略性少数股权。
          tone: positive
        - date: '2021'
          label: Hybrid 转型与 GBL 投资
          detail: 为应对 Apple IDFA 隐私规则，启动向 Hybrid-Casual 转型；GBL 以 $1.7B 估值投资 $266M。
          tone: positive
        - date: '2023'
          label: Hybrid 爆款扩张
          detail: 将 Mob Control 和 Block Jam 3D 等价值数百万美元的 Hybrid 产品做大，并强化 IAP 变现闭环。
          tone: positive
        - date: '2024'
          label: 收购 BeReal 与 20% 增长
