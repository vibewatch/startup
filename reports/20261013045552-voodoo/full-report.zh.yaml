  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与商业模式演进
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的商业财务模式经历了全面转型：从完全依靠程序化广告变现的低留存超休闲移动产品，转向由经常性内购支撑的成熟混合休闲游戏。2024 财年，公司合并年收入为 €623 million，较 2023
              年增长近 20%。直到 2021 年，超休闲游戏仍占公司收入的 100%；到 2024 年，由于用户隐私变化削弱程序化广告收益，该业务收入占比已压缩至收入端的 22%。与此同时，内购快速增长至总收入的
              45%，带来更稳定的多月期客户变现。此外，收入韧性由长尾产品支撑：2024 年收入中近 80% 来自已运营超过两年的游戏，说明长期运营和元成长循环显著延长了游戏生命周期，超越短暂的下载高峰。
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: figure
