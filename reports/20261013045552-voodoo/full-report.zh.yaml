      - number: '4.2'
        title: 变现架构与 GTM 渠道经济
        blocks:
          - type: paragraph
            body: >-
              核心变现引擎将大规模免费游戏用户导入与广告网络、微交易中的多层商业触点结合。混合休闲产品的玩法循环会加入奖励视频广告，供玩家选择性获得倍率；微交易礼包价格从 $0.99 的消耗品到 $99.99
              的成长礼包不等。Apple 执行 App Tracking Transparency 后，休闲游戏各品类的获客成本大幅上升，纯广告模式难以为继。Voodoo 借助专有自动化测试平台和 BidShake
              等工具进行跨渠道营销自动化来应对这一阻力，每年测试约 2,000 个游戏原型，筛选自然吸引力高的项目。一旦概念证明早期留存可接受，Voodoo 就会投放效果营销以扩大玩家群体；Mob Control 和
              Block Jam 3D 等爆款年毛收入达到 $20 million 至 $100 million。
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: 成本结构、毛利率与单位经济
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的成本结构受平台分成率、外部合作工作室收入分成协议、付费获客营销以及 800 名员工的工程薪酬影响。通过 Apple App Store 和 Google Play
              分发的移动游戏，平台佣金约占消费者总支出的 15% 至 30%。此外，约 75% 的商业发行来自 Voodoo 全球 2,000 多家独立合作工作室，合同约定的版税分成构成一项重大经营费用。管理层按会计口径报告
              2024 年 EBITDA 为 €135 million，对应报告利润率 21.7%。但 Fitch 的信用评级分析将 2024 年 EBITDA 调整为 €71 million（利润率
              11.4%），把软件开发成本视为经营费用而非资本化投资。单个项目要立项，混合休闲产品的 Day-7 玩家留存率至少要达到 15%；只有客户生命周期价值超过初始获客费用，长期运营团队才会继续投入扩张资本。
            claimRefs:
              - CI004
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI009
              - CI010
      - number: '4.4'
        title: 资本充足性、债务结构与再融资
        blocks:
          - type: paragraph
            body: >-
              评估 Voodoo 的财务健康和资产负债表可持续性，必须看其持股架构和承担大量银团债务的 Stan Holding SAS。2024 年末，资本结构由一笔于 2025 年 11 月到期的 €220 million
              高级担保 Term Loan B 和一项未提取的 €30 million 循环信贷额度构成。Fitch Ratings 于 2025 年初将 Term Loan B
              列入负面评级观察，原因是到期集中在短期。可是，年末可用现金余额 €101 million 以及预计占收入 3% 至 6% 的正自由现金流缓解了再融资风险。2025 年 4 月，Voodoo
              与机构银行联合体成功完成超过 €175 million 的债务再融资，解决了眼前的流动性脆弱性，证明其仍能进入信贷市场，也恢复了资产负债表弹性。
            claimRefs:
              - CI003
              - CI011
              - CI012
      - number: '4.5'
        title: 财务结论与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从投资尽调角度看，Voodoo 展现出令人印象深刻的运营适应性，已成功从不断衰退的超休闲广告模式转向盈利且收入经常性的混合休闲发行商。不过，潜在投资者仍面临明显的投资判断障碍。首要问题是 2024 年 6 月以
              €500 million 收购社交照片应用 BeReal。BeReal 进入产品组合时商业变现极少，信用分析师预计其至少到 2026
              年仍将亏损，带来持续执行风险并可能消耗经营现金流。此外，公司缺少公开审计的法定账目，管理层报告的 €135 million EBITDA 与评级机构数据之间存在重大差异。投资判断需要审计后的对账表，以及
              BeReal 独立的用户群留存指标，才能验证调整后盈利质量。
            claimRefs:
              - CI013
              - CI014
      - number: '4.6'
        title: 展示项
        blocks:
          - type: callout
            title: 混合休闲转型重塑收入质量
            body: Voodoo 从纯超休闲广告转向内购，提升了收入可见度并降低了对波动广告网络的依赖；IAP 占收入比重从 2021 年的 1% 增至 2024 年的 45%。
            calloutType: insight
