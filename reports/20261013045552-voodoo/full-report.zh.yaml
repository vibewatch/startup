      - number: '3.3'
        title: 变现模式、产品包装与分发经济
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的收入架构是双引擎变现模式，将高速度程序化广告与不断增长的内购结合。2024 年，内购占总收入的 45%，高于 2021 年的 1%，相比纯广告变现的前代产品显著提升了收入可见度和客户生命周期价值
              [CP002, CP004]。为变现非付费玩家，Voodoo 依靠专有广告网络和自动竞价基础设施，每年在其产品网络投放 250 billion 次广告展示
              [CP010]。为在游戏之外建立自有的自然分发渠道，Voodoo 于 2024 年 6 月以 €500 million 收购社交网络平台 BeReal [CP012]。但进入消费社交应用带来重大执行风险；收购时
              BeReal 没有收入，每月烧钱约 $3 million，必须通过赞助活动谨慎推进变现，而其回报尚未证明 [CP013]。
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP012
              - CP013
      - number: '3.4'
        title: 护城河韧性、平台脆弱性与不利风险
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的竞争护城河受到持续的平台结构性依赖和品类集中度约束。Apple 执行 App Tracking
              Transparency（IDFA）框架后，用户获客单位经济模型被重构，整个游戏生态的单次安装成本上升；缺乏自有社交媒体发现入口的发行商受影响尤为严重 [CP009]。ByteDance 和 Tencent
              等科技集团掌握原生社交网络，而 Voodoo 几乎完全依赖 Apple App Store 和 Google Play 完成商业发现与支付结算 [CP008, CP009]。Fitch Ratings
              的信用评级强调，Voodoo 总体规模相对较小、现金流受爆款驱动而波动、平台多元化有限，因此容易被资本更充足的游戏集团蚕食市场份额 [CP011]。此外，如果 BeReal
              在持续产生正向现金之前用户参与度走弱，其整合和变现要求可能分散经营重点 [CP013]。
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 混合休闲的加速度
            body: >-
              Voodoo 从广告变现的超休闲产品转向 Mob Control 等混合休闲产品，显著稳定了收入端的持续性，并将收入更多元地转向内购（2024 年占比 45%）。但要缩小与 King、Supercell
              等休闲成熟厂商的 ARPU 差距，仍需要深度元游戏设计和长期运营能力，单靠快速原型无法轻易工业化。
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP006
          - type: callout
            title: 平台与广告隐私的非对称暴露
            body: >-
              ByteDance 和 Tencent 等平台原生进入者掌握自有社交信息流，而 Voodoo 仍高度依赖 Apple App Store 和 Google Play 进行分发和广告测量。Apple 的 IDFA
              政策变化等隐私监管执行会永久推高获客成本，迫使发行商仅为维持安装速度就持续进行激进的创意生产和广告技术投入。
            calloutType: risk
            claimRefs:
              - CP008
