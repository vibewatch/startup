        - 同比增速持续降至 10% 以下，或新产品软启动无法维持 15% 以上的 D7 留存。
      - - 投资反向逻辑
        - Stan Holding SAS 旗下的资本结构杠杆、爆款驱动的波动、Apple IDFA 逆风，以及亏损 BeReal 带来的执行拖累。
