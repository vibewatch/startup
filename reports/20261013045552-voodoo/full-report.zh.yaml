      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 从超休闲到混合休闲变现的战略转型
            body: >-
              Voodoo 从依赖广告的超休闲产品转向混合休闲系列，代表了一次重大的运营转型。内购收入占比从 2021 年总收入的 1% 增至 2024 年的 45%，既缓冲了 Apple IDFA
              退化等平台隐私变化的冲击，也延长了游戏生命周期。
            calloutType: insight
            claimRefs:
              - CO010
              - CO013
          - type: callout
            title: 再融资期限与资本结构杠杆
            body: >-
              Voodoo 2024 年 EBITDA 为 €135 million，2025 年初完成 €175 million 的信贷再融资；但 Stan Holding SAS 的 B
              级信用状况和高额债务仍要求公司持续产生经营现金流，并严格执行并购。
            calloutType: risk
            claimRefs:
              - CO004
              - CO008
              - CO012
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与支出分类
        blocks:
          - type: paragraph
            body: >-
              Voodoo 位于移动游戏发行、内部游戏开发和高参与度消费移动应用的交叉地带。公司过去主要立足于超休闲游戏：操作以简单点击为主、上手门槛低、单次游戏时长短，并完全依靠程序化游戏内广告变现。不过，Voodoo
              的商业模式边界已大幅超出超休闲娱乐。如今，Voodoo 主动开发并发行混合休闲游戏、休闲解谜系列，以及 BeReal 和直播购物应用 Jamble
              等消费社交平台。可计入的市场支出包括全球消费者在内购、成长加速器和订阅通行证上的移动消费，以及移动效果营销商投放的程序化广告预算。Voodoo 的目标市场明确不包括高门槛 AAA 主机和 PC
              游戏、云游戏基础设施服务、企业软件平台以及真钱博彩生态。Voodoo 的核心商业机会在于捕获高频数字参与，并通过广告与购买结合的循环，变现大众玩家群体。
            claimRefs:
              - CM001
              - CM004
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM009
      - number: '2.2'
        title: 市场规模与增长预测
        blocks:
          - type: paragraph
            body: >-
              Fitch Ratings 的独立市场分析预计，全球移动游戏行业在 2025 至 2027 年将以中个位数复合年增长率扩张，继续成为整体消费者娱乐支出中增长最快的子行业。在这一宏观背景下，Voodoo
              已展现出较大的收入规模和不断扩大的经营盈利能力。2024 财年，Voodoo 报告合并收入创纪录，达到 €623 million，同比增长约 20%；EBITDA 为 €135 million，比 2023
              年增长 34%。UpMarket 的 IPO 前二级市场分析显示，2025 年收入达到 $778 million，收入端同比增速仍为 16%。更关键的是，Voodoo 收入的质量和可预测性已发生结构性变化：内购在
              2024 年占总收入的 45%，远高于 2021 年的 1%。Mob Control 和 Collect Em All 等旗舰混合休闲系列如今各自产生 $20 million 至 $100 million
              的毛收入，形成拥有多年生命周期的经常性现金流。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM005
              - CM011
      - number: '2.3'
        title: 玩家、工作室与平台生态
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的商业引擎是一个多边生态，连接移动玩家、独立开发工作室和全球广告网络。Voodoo 在全球超过 250 个国家和地区服务 1.5 亿多月活跃用户；自 2013 年成立以来累计下载量超过 80 亿，仅
              2024 年就有 950 million 次下载。在供给侧，Voodoo 与 150 多家外部合作工作室保持商业关系。Voodoo
              不只依赖内部创意团队，还向合作工作室提供专有开发工具、测试看板和自动化获客引擎，每年测试约 2,000 个游戏原型。在广告变现端，Voodoo 每年制作约 25,000 个广告创意，并通过全球广告交易所分发约
              250 billion 次广告展示。广泛的分发版图让 Voodoo 同时成为一流的程序化广告库存供应商和成熟的媒体买方，能够大规模获取用户群体。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM010
      - number: '2.4'
        title: 增长催化剂与行业约束
        blocks:
          - type: paragraph
            body: >-
              推动 Voodoo 战略多元化的根本催化剂，是 Apple 在 iOS 14 中引入 App Tracking Transparency（ATT）并弃用 IDFA。Apple
              的隐私政策限制跨应用行为追踪，使整个移动生态的获客成本大幅上升，侵蚀低 LTV 超休闲产品的单位经济模型，迫使发行商优先开发更深的玩法循环，以支撑更高的客户生命周期价值。Voodoo
              虽然比许多同业更快完成转型，但业务仍面临重大结构性约束。Fitch Ratings 的信用评估指出，Stan Holding SAS 的长期发行人违约评级为 B，且列入负面评级观察，原因是其 €220
              million 定期贷款将于 2025 年 11 月到期、再融资风险较高，同时还承担 BeReal 的持续整合成本。此外，Voodoo 在全球分发上仍结构性依赖 Apple App Store 与 Google
              Play 双寡头，平台政策和商店费率变化可能挤压经营利润率。私有记录中，外部工作室确切的发行商净收入分成仍是关键尽调缺口。
            claimRefs:
              - CM006
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 混合休闲变现范式
            body: Voodoo 从依赖超休闲广告转向混合休闲内购，使 IAP 占比从 2021 年收入的 1% 提高到 2024 年的 45%，从根本上隔离了平台隐私扰动的影响。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: callout
            title: 商店集中度与再融资压力
            body: 移动分发完全依赖 Apple App Store 和 Google Play，再加上 €220 million 债务的短期再融资要求，使公司对平台政策和资本市场高度敏感。
            calloutType: risk
            claimRefs:
              - CM012
