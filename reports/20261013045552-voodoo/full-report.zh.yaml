            title: Stan Holding SAS 下的杠杆与再融资脆弱性
            body: >-
              Voodoo 2024 年公司报告 EBITDA 为 €135 million，但 Stan Holding SAS 下的杠杆资本结构包含一笔 €220 million 定期贷款，因此需要信用机构持续监测，并在
              2025 年初促成 €175 million 的债务再融资。
            calloutType: risk
            claimRefs:
              - CI003
