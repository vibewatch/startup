chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              Voodoo 由 Alexandre Yazdi 与 Laurent Ritter 于 2013 年在巴黎创立，已从独立开发工作室扩展为全球最大的移动游戏和消费应用发行商之一 [CO001]。公司在全球 14
              个国际办公室拥有 800 多名员工，超过 50% 的收入来自欧洲以外 [CO001, CO002]。经过十年的运营，Voodoo 多元化产品组合累计下载量已超过 80 亿，月活跃用户达到 1.5 亿
              [CO002, CO003]。2024 财年，公司收入达到 €623 million，同比增长 20%，EBITDA 为 €135 million；2025 年收入进一步增至 $780 million
              [CO002, CO004]。Voodoo 依靠工业化发行技术栈驱动分发引擎，每年可生成 25,000 个广告创意，并在全球广告网络投放超过 250 billion 次展示 [CO014]。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
      - number: '1.2'
        title: 高管团队与组织架构
        blocks:
          - type: paragraph
            body: >-
              Voodoo 由创始人管理团队领导，Alexandre Yazdi 任首席执行官，Laurent Ritter 任首席运营官 [CO001, CO007]。Yazdi
              负责整体公司战略、工作室收购和资本配置，Ritter 则负责核心发行运营、工作室辅导网络和开发者基础设施 [CO007]。发行运营由专门负责人执行，例如发行负责人 Thibault de
              Vésinne-Larüe 负责协调混合休闲产品的长期运营和游戏软启动，覆盖全球 150 多家合作工作室 [CO007, CO014]。由于 Voodoo
              仍是未上市私营企业，董事会构成、独立董事比例、执行委员会投票门槛和管理层股权归属安排等细致治理信息仍属内部信息，未公开披露 [CO015]。
            claimRefs:
              - CO001
              - CO007
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
              - CO013
              - CO014
      - number: '1.3'
        title: 资本化历史、债务结构与信用状况
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的资本结构由成长股权轮和机构杠杆债务共同组成，债务以母公司 Stan Holding SAS 为核心 [CO005, CO008]。Goldman Sachs 的早期机构成长资金之后，Tencent
              于 2020 年 8 月以据报道 $1.4 billion 的估值收购少数股权 [CO006]。2021 年 7 月，比利时投资控股公司 Groupe Bruxelles Lambert（GBL）完成 $266
              million 的战略投资，对应投后估值 $1.7 billion [CO005]。债务方面，Fitch Ratings 于 2025 年 3 月将 Stan Holding SAS 的发行人违约评级维持在
              B，并将其 €220 million 的高级担保 Term Loan B 列入负面评级观察，原因是短期到期风险 [CO008]。不过，2024 年末预计 €101 million
              的现金余额和预期为正的自由现金流缓冲了流动性；公司于 2025 年 4 月成功完成超过 €175 million 的债务再融资 [CO008, CO009,
              CO012]。详细的股权结构表类别、清算优先权和契约条款仍为非公开信息 [CO015]。
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO009
              - CO012
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO012
              - CO015
      - number: '1.4'
        title: 战略里程碑与消费应用多元化
        blocks:
          - type: paragraph
            body: >-
              在运营发展过程中，Voodoo 进行了关键战略转向，从依赖广告的超休闲产品转向更可持续的混合休闲游戏和高留存消费应用 [CO010]。平台隐私环境变化，尤其是 Apple 的 IDFA
              调整，挤压了超休闲业务的单位经济模型；Voodoo 因此重构游戏机制，引入成长经济和内购（IAP），将 IAP 收入占比从 2021 年的 1% 提高到 2024 年总收入的 45% [CO010]。Mob
              Control 和 Block Jam 3D 等旗舰混合休闲系列各自带来 $20 million 至 $100 million 的经常性年收入 [CO010, CO013]。为拓展游戏之外的业务，Voodoo 于
              2024 年 6 月以 €500 million 收购法国照片分享社交应用 BeReal，同时推出直播购物平台 Jamble，为未来规模化建立多类型娱乐基础 [CO011, CO014]。
            claimRefs:
              - CO010
              - CO011
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
