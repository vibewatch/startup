              - CU014
          - type: callout
            title: 平台依赖与信用评级脆弱性
            body: >-
              尽管经营增长强劲，Voodoo 仍几乎完全依赖 Apple 和 Google 进行获客和支付处理，受此严重约束。Fitch Ratings 因 €220 million 定期贷款的高再融资风险，将 Stan
              Holding SAS 维持在负面评级观察；与此同时，Apple 收紧隐私政策仍在结构性推高移动获客成本。
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与平台守门人风险
        blocks:
          - type: paragraph
            body: >-
              Voodoo 严重暴露于 Apple 和 Google 这两家双寡头移动操作系统守门人。Apple 在 iOS 14.5 推出 App Tracking
              Transparency（ATT）框架，对移动广告归因造成严重结构性冲击，使 Voodoo 超休闲核心业务收入减半，同时推高行业获客成本。此外，Voodoo 还受到 GDPR 和 CNIL
              标准下日益严格的欧洲数据隐私执法约束，必须管理移动广告标识符、追踪同意和青少年数据保护。Voodoo
              虽然通过加快转向内购支撑的混合休闲机制、部署合规同意管理平台来适应变化，但仍结构性暴露于应用商店政策调整、算法变化和平台强制 30%
              分成。工作室生态还必须持续应对与既有第三方产品玩法高度相似所带来的版权和商业外观审查。
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR014
      - number: '7.2'
        title: 财务杠杆、债务再融资与估值悬置
        blocks:
          - type: paragraph
            body: >-
              Stan Holding SAS 旗下的杠杆资本结构给 Voodoo 带来重大财务风险。Fitch Ratings 将 Stan Holding SAS 的长期发行人违约评级维持在 B，并在其高级担保 220
              million euro Term Loan B 于 2025 年 11 月到期前将其列入负面评级观察。Voodoo 于 2025 年 4 月从一流银行和机构合作方组成的财团获得超过 175 million
              euro 的债务再融资，且经营现金流生成能力强，但资本结构再融资风险仍是核心监测点。高杠杆还与 BeReal 交易的持续并购整合成本直接叠加，信用分析师预计其 2025 年和 2026
              年仍将持续经营亏损。此外，二级市场股权估值还受到 Groupe Bruxelles Lambert 于 2021 年 7 月投资 266 million dollar、对应投后估值 1.7 billion
              dollar 的压制；若市场倍数收缩，估值下行风险将上升。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR007
              - CR009
              - CR013
      - number: '7.3'
        title: 运营原型淘汰与产品组合生命周期风险
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的发行引擎依赖工业规模原型测试，淘汰率极高。公司每年评估 1,000 至 2,000 个游戏原型，任一时点约有 100 个原型处于活跃状态，但通过留存门槛并实现商业上线的测试产品仅约
              0.4%。公司从超休闲产品转向混合休闲游戏；超休闲收入占比已从 2021 年的 100% 降至 2024 年的 22%，而混合休闲产品必须达到更高的 Day 1 留存（超过 45%）和 Day 7 留存（超过
              15%），才值得持续投入长期运营。此外，产品组合收入仍高度集中，2024 年收入近 80% 来自已在应用商店运营超过两年的老爆款。同时，以 500 million euro 收购社交媒体平台 BeReal
              带来很大的执行不确定性，因为该平台目前没有任何直接面向消费者的变现渠道。
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: 合作伙伴依赖、论点破坏触发因素与监测指标
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的商业模式依赖由 150 多家独立游戏开发工作室和 100 个内部团队组成的分散合作网络，因此执行上受外部开发人才制约。为留住这些合作伙伴，Voodoo 提供辅导、SDK
              基础设施和自动化创意生产，每年交付 250 billion 次广告展示。潜在投资者需要关注的核心论点破坏触发因素包括：新再融资债务工具下无法维持正自由现金流；BeReal 群组流失持续，或经营亏损扩大至每年超过
              50 million euro；Apple 或 Google 突然实施平台政策制裁或调整费率；新上线混合休闲产品 Day 1 留存降至 40% 以下。尽调必须严格审查 BeReal
              经审计的独立财务报表、债务契约余量和工作室收入分成合同。
            claimRefs:
              - CR003
              - CR006
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR011
              - CR012
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: Term Loan B 再融资与 BeReal 整合并行压力
            body: >-
              2025 年，Stan Holding SAS 同时面临资本结构到期和并购执行压力：一边整合未变现的 500 million euro BeReal 收购，一边协商 220 million euro
              高级担保定期贷款的再融资。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: 保护下行风险的尽调重点
            body: 潜在投资者必须评估 BeReal 独立现金消耗，审计老爆款的收入持续性，并核实新再融资的 175 million euro 债务工具下的债务契约合规性。
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR004
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议立场
        blocks:
          - type: paragraph
            body: >-
              Voodoo 已从脆弱的超休闲发行转型为规模化混合休闲模式，持续产生经常性内购收入，运营转型颇具吸引力。Mob Control 等表现最好的混合休闲爆款年毛收入达到 $20 million 至 $100
              million；产品组合中近 80% 的 2024 年收入来自运营超过两年的成熟产品，支撑了组合韧性。不过，这一运营成果仍须结合私募市场进入条款评估。Groupe Bruxelles Lambert 的 2021
              年融资轮设定了 $1.7 billion 估值基准，当前股权定价相对于信用机构的回收基准仍显偏高。我们建议以中等信心维持跟踪立场：收入端势头健康，但底层工作室经济和单位层面毛利率仍不透明。
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
      - number: '8.2'
        title: 资本结构、杠杆与再融资暴露
        blocks:
          - type: paragraph
            body: >-
              Stan Holding SAS 旗下的公司融资结构带来显著的信用和流动性约束，削弱了股权投资吸引力。Fitch Ratings 将 Stan Holding SAS 的长期发行人违约评级维持在 B，并将其
              EUR220 million 高级担保 Term Loan B 评为 B+、列入负面评级观察，反映其在 2025 年末到期前的高再融资风险。尽管 Voodoo 宣布于 2025 年 4 月完成超过 €175
              million 的再融资，并将 Fitch 计算的杠杆从 2022 年的 70x 降至 2024 年末的 3.8x，但大额偿债要求限制了自由现金流弹性。Fitch 估计持续经营 EBITDA 为 EUR38
              million，并在回收情景中采用 5.0x 的困境企业价值倍数，说明若债务滚动条件收紧，下行保护有限。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: 正论、反论与战略并购尽调
        blocks:
          - type: paragraph
            body: >-
              Voodoo 的投资判断，核心矛盾在于工业化发行引擎与激进拓展消费社交应用之间的拉扯。好的一面是，Voodoo 的数据驱动发行平台每年产出 25,000 个创意、测试约 2,000
              个原型，在用户获取和广告变现上形成了难以匹敌的运营敏捷性。另一面是，2024 年 6 月以 €500 million 收购 BeReal 严重拖累执行。预计 BeReal 到 2025 年和 2026
              年仍将亏损；恰逢移动端内购已占总收入 45%，这笔交易又让 Voodoo 暴露在波动更大的社交广告环境中。尽调必须确认 BeReal
              能否实现可持续的病毒式互动和商业可行性，否则核心游戏贡献的经营现金储备可能被持续烧掉。
            claimRefs:
              - CV004
              - CV006
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
      - number: '8.4'
        title: 估值情景、可比公司与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              我们的估值情景分析，按两年投资周期为 Voodoo 描绘了三条不同的风险调整路径。乐观情景下，混合型产品占收入提升至 80%，同时 BeReal 成功扩大广告变现，支持 $2.5 billion 至 $3.0
              billion 的企业估值。基准情景假设游戏业务收入每年稳定增长 6% 至 10%，BeReal 亏损收窄，合理估值为 $1.6 billion 至 $1.9
              billion，与历史交易估值一致。悲观情景下，BeReal 用户持续流失，加上债务再融资阻力，推动估值倍数向 Fitch 的困境恢复倍数 5.0x 压缩，使股权价值降至 $0.8 billion 至 $1.1
              billion。明确的论点失效触发条件包括信用评级降至 B- 以下、新混合型产品无法维持 15% 的 D7 留存率，或非游戏收购持续消耗现金。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 对高估值保持克制
            body: >-
              私人公司 EBITDA 披露尚未验证，Fitch Ratings 已提示 Stan Holding SAS 债务持续面临再融资风险，而 €500 million 收购 BeReal
              的变现模式也未经证明。因此，相比按历史融资轮倍数买入，Voodoo 更适合采取克制的观望建议。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
          - type: callout
            title: 执行阻力与债务再融资
            body: >-
              管理层报告 2024 年 EBITDA 为 €135 million，但 Fitch Ratings 估算信用调整后 EBITDA 仅为 €71 million，并对 EUR220 million B
              期贷款维持负面评级观察。随着 BeReal 整合继续，显著的再融资和现金吸收风险更加突出。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
