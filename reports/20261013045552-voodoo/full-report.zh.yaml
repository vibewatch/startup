  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与同业分类
        blocks:
          - type: paragraph
            body: >-
              移动游戏生态经历了剧烈的结构调整，分化为大众休闲市场的成熟厂商和依赖广告的超休闲开发商。Voodoo 过去主导超休闲发行，按下载量已与 Google、Meta、Tencent 和 ByteDance
              等科技平台并列为全球第三至第五大移动发行商 [CP001]。然而，超休闲发行因进入门槛低、数百家独立工作室持续复制核心玩法而严重商品化 [CP003]。对此，大型发行商积极整合，例如 Zynga 以 $168
              million 收购超休闲专业厂商 Rollic Games，并以 $1.8 billion 收购 Peak Games，以获取分发规模和工作室管线 [CP007]。尽管 Voodoo 累计下载量超过 80
              亿、覆盖面庞大，King 和 Supercell 等休闲成熟厂商仍凭借难以被替代的长青系列占据行业收入的大部分 [CP005, CP014]。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP014
      - number: '3.2'
        title: 能力比较与定位基准
        blocks:
          - type: paragraph
            body: >-
              为应对超休闲利润率压缩，Voodoo 转向混合休闲游戏开发，使超休闲收入贡献从 2021 年的 100% 降至 2024 年的 22% [CP002]。Mob Control 和 Collect Em All
              等混合休闲产品在易上手的核心玩法上叠加成长机制、多人元层和长期运营，每个系列年收入达到 $20 million 至 $100 million [CP006]。King 和 Supercell
              等传统休闲成熟厂商依靠深度内购经济和较高的付费用户平均收入，而超休闲产品过去几乎没有直接购买支出 [CP004]。Voodoo 的竞争优势来自工业化发行引擎：每年测试近 2,000
              个原型，并通过自动化创意生产每年部署超过 25,000 个广告变体，以维持获客速度 [CP010]。与此同时，Tencent 和 ByteDance 等平台原生巨头推出了完全绕开第三方应用商店的社交小游戏
              [CP008]。
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP008
              - CP010
