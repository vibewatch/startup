  - id: FM001
    title: 可触达市场与变现金字塔
    type: pyramid
    summary: 以分层规模视角展示 Voodoo 的可触达范围，从移动应用娱乐经济总量，一直下探到已实现的高 LTV Hybrid-Casual 产品收入。
    approximationNotes: 市场分层综合 Fitch Ratings 行业预测、Voodoo 经审计财务报表及 Game World Observer 发布的单元经济性。下层代表观察到的公司收入运行率，而非可触达市场上限。
    claimRefs:
      - CM002
      - CM005
      - CM011
    data:
      items:
        - label: 全球移动应用经济（广义 TAM）
          value: Macro Mobile Spend
          share: 100%
          detail: 覆盖 iOS 和 Android 应用商店的全球消费者应用下载、数字订阅及移动商务总量。
        - label: 全球移动游戏市场（核心 TAM）
          value: Mid-Single Digit Growth
          share: Sector Core
          detail: 根据 Fitch Ratings 基准，这是 2025-2027 年增速最快的消费者娱乐子行业，复合年增长率为中个位数。
        - label: 免费畅玩休闲与 Hybrid-Casual 游戏（SAM）
          value: Expanded Casual Market
          share: SAM Universe
          detail: 覆盖全球应用商店，通过游戏内广告与应用内微交易组合变现的免费畅玩移动游戏。
        - label: Voodoo 活跃市场触达（广义 SOM）
          value: 150M MAUs / 950M Annual Downloads
          share: Top-5 Global Scale
          detail: 覆盖 250+ 个国家，触达超过 1.5 亿月活跃用户及 80 亿累计下载。
        - label: Voodoo 变现收入基础（核心 SOM）
          value: €623M FY2024 Revenue
          share: 45% IAP / 55% Ads
          detail: 2024 年产生的合并商业收入，其中大部分经常性收入由 Hybrid-Casual 游戏驱动。
        - label: Voodoo Hybrid 超级爆款层（已实现 LTV）
          value: $20M - $100M Per Title
          share: Core Franchise Scale
          detail: Mob Control 和 Collect Em All 等旗舰 Hybrid 产品带来高留存、多年的现金流。
