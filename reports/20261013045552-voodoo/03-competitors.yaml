callouts:
  - calloutType: "insight"
    title: "The Hybrid-Casual Escape Velocity"
    body: "Voodoo's transition from ad-monetized hyper-casual to hybrid-casual titles like Mob Control has meaningfully stabilized top-line recurrence and diversified revenue toward in-app purchases (45% in 2024). However, closing the ARPU gap with casual incumbents like King and Supercell requires deep meta-game design and live-ops capabilities that mobile publishers cannot easily industrialize through rapid prototyping alone."
    claimRefs:
      - "CP002"
      - "CP004"
      - "CP006"

  - calloutType: "risk"
    title: "Asymmetric Platform and Ad Privacy Exposure"
    body: "Unlike platform-native entrants like ByteDance and Tencent who command proprietary social feeds, Voodoo remains heavily dependent on Apple's App Store and Google Play for distribution and ad measurement. Privacy policy enforcement such as Apple's IDFA changes permanently elevates customer acquisition costs, forcing publishers to maintain aggressive creative production and ad-tech spend merely to preserve install velocity."
    claimRefs:
      - "CP008"
      - "CP009"
      - "CP011"

