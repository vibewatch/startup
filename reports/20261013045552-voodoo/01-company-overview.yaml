callouts:
- calloutType: insight
  title: Strategic Transition from Hyper-Casual to Hybrid-Casual Monetization
  body: Voodoo's evolution from ad-dependent hyper-casual titles to hybrid-casual
    franchises represents a major operational turnaround. In-app purchases expanded
    from just 1% of total revenue in 2021 to 45% by 2024, buffering the company against
    platform privacy changes such as Apple's IDFA depreciation while lengthening game
    lifespans.
  claimRefs:
  - CO010
  - CO013
- calloutType: risk
  title: Refinancing Deadlines and Capital Structure Leverage
  body: While Voodoo generated positive EBITDA of €135 million in 2024 and completed
    a €175 million credit refinancing in early 2025, its B credit profile and substantial
    debt load under Stan Holding SAS demand sustained operating cash generation and
    disciplined M&A execution.
  claimRefs:
  - CO004
  - CO008
  - CO012
