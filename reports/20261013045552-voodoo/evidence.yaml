evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-statements
    missingEvidence: >-
      Audited consolidated balance sheet, cash flow statements, and statutory profit-and-loss filings reconciling Stan
      Holding SAS reporting under IFRS or French GAAP.
    whyItMatters: >-
      Issuer reports top-line revenue and EBITDA in press releases and rating agency commentary, but detailed cost of
      goods sold, studio payout splits, and cash balances remain unaudited.
    diligencePath: >-
      Request statutory audited financial statements for Stan Holding SAS from French commercial court registries
      (Infogreffe) or issuer management.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: detailed-cap-table-and-governance
    missingEvidence: >-
      Complete capitalization table specifying share classes, option pool allocation, board representation seats, and
      liquidation preference seniority across Goldman Sachs, Tencent, and GBL.
    whyItMatters: >-
      Without cap table waterfall details, secondary market valuations and investor minority rights cannot be
      underwritten with institutional certainty.
    diligencePath: >-
      Request cap table summary and shareholder agreement excerpts from issuer investor relations or secondary broker
      transaction memoranda.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Audited TAM and SAM breakdown separating pure in-app advertising, in-app purchases, and studio revenue splits
      across geographic markets.
    whyItMatters: >-
      Without segmented financial disclosures, estimating Voodoo's exact market share in hybrid-casual versus casual and
      social apps relies on blended company disclosures.
    diligencePath: Review audited studio publishing agreements and consolidated revenue bridges by segment during formal diligence.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: competitor-unit-economics
    missingEvidence: >-
      Disclosed competitor unit economics including per-title customer acquisition costs (CPI) and return on ad spend
      (ROAS) across hybrid-casual portfolios for direct peers like Rollic and Playrix.
    whyItMatters: >-
      Without title-level competitor marketing economics, assessing whether Voodoo's proprietary ad network and UA
      automation provide a durable structural margin advantage versus peer publishers remains unverified.
    diligencePath: >-
      Request confidential benchmark data or internal cohort performance comparing Voodoo's realized CPIs and D7/D30
      ROAS against commercial publisher medians in key tier-1 geographies.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: ebitda-reconciliation
    missingEvidence: >-
      Audited consolidated financial statements reconciling management-reported €135M EBITDA with Fitch-adjusted €71M
      operating profit across 2024 and 2025.
    whyItMatters: >-
      Material difference in EBITDA definitions affects enterprise valuation multiples, leverage calculations, and debt
      covenant compliance headroom.
    diligencePath: Request audited financial statements and bridge schedules for Stan Holding SAS from management or credit lenders.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: bereal-unit-economics
    missingEvidence: >-
      Granular ARPDAU, user churn rates, and standalone contribution margin figures for the BeReal social app division
      following the €500M acquisition.
    whyItMatters: >-
      Rating agencies anticipate BeReal will be loss-making through 2026, creating potential drag on consolidated free
      cash flow.
    diligencePath: >-
      Obtain BeReal standalone P&L, cohort retention metrics, and commercial monetization roadmap during management
      diligence sessions.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: private-evidence-only
    severity: material
    topic: proprietary-algorithms-and-developer-signal
    missingEvidence: >-
      Audited technical benchmarks and public developer repositories or API documentation verifying the algorithmic
      performance of Voodoo's SDK and Bidshake automation tools.
    whyItMatters: >-
      Without independent developer telemetry or public repository benchmarks, Voodoo's claims of automated creative
      generation and predictive LTV cannot be validated externally.
    diligencePath: >-
      Request proprietary SDK architecture documentation, client latency audits, and sample automated UA campaign log
      files during technical underwriting.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: bereal-technical-infrastructure-and-moderation
    missingEvidence: >-
      Technical infrastructure audit and server telemetry detailing cloud hosting costs, active user retention, and
      content moderation pipeline overhead for BeReal under Voodoo ownership.
    whyItMatters: >-
      BeReal represents a major non-gaming capital allocation whose path to profitability requires substantial
      infrastructure cost optimization and scalable automated moderation.
    diligencePath: >-
      Review BeReal cloud hosting bills (AWS/GCP), content moderation SLA reports, and post-restructuring engineering
      organization charts.
  - type: private-evidence-only
    severity: material
    topic: bereal-active-user-monetization
    missingEvidence: >-
      Audited daily active user (DAU) retention, customer cohort churn, and average revenue per daily active user
      (ARPDAU) for BeReal post-acquisition in 2025 and 2026.
    whyItMatters: >-
      BeReal represents a €500M capital allocation; failure to monetize its user base via ads or subscriptions directly
      compresses corporate cash flow and increases refinancing pressure.
    diligencePath: >-
      Request confidential studio operating metrics, platform revenue attribution logs, and monthly active user
      breakdowns for consumer apps under NDA.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: Regulatory and IP Litigation Disclosures
    missingEvidence: >-
      Comprehensive registry of ongoing EU CNIL privacy investigations, DMA platform compliance audits, and third-party
      copyright infringement settlements.
    whyItMatters: >-
      Assessing potential contingent fines, platform policy sanction risks, and copyright indemnification liabilities
      across Voodoo's publisher and developer contracts.
    diligencePath: >-
      Request litigation schedule, CNIL correspondence, patent/trademark dispute logs, and developer indemnity
      agreements in confidential data room.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: BeReal Standalone Operating Metrics and Cash Burn
    missingEvidence: >-
      Audited cohort retention, daily active user counts, monetization revenue, and monthly EBITDA drain for BeReal
      under Voodoo ownership.
    whyItMatters: >-
      Determines whether BeReal dilutes consolidated operating cash flow and evaluates whether the 500 million euro
      acquisition cost can be recouped.
    diligencePath: >-
      Review management accounts showing BeReal standalone cash burn, active user trajectory post-acquisition, and
      headcount allocation.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: bereal-contribution-margin
    missingEvidence: >-
      Public disclosure of BeReal's post-acquisition daily active users, retention curves, advertising revenue, and
      EBITDA contribution margin.
    whyItMatters: >-
      The €500 million BeReal transaction represents Voodoo's largest capital allocation and introduces social media
