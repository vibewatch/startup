    relatedQuestionRefs:
      - QV008
  - type: conflicting-data
    severity: material
    topic: ebitda-reconciliation
    missingEvidence: >-
      Reconciliation between Voodoo's company-reported €135 million EBITDA and Fitch's €71 million credit-adjusted
