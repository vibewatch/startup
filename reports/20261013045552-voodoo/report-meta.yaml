companyProfile:
  summary: >-
    Voodoo is a Paris-based mobile game publisher and consumer-app developer founded in 2013 by Alexandre Yazdi and
    Laurent Ritter. It operates a global footprint of 800+ employees across 14 offices, has surpassed 8 billion
    cumulative downloads, and reaches roughly 150 million monthly active users while shifting its mix from hyper-casual
    advertising toward hybrid-casual in-app purchases and consumer apps.
