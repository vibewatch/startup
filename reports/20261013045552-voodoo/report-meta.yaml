  topStrengths:
    - Large-scale mobile distribution with 150 million monthly active users and 8 billion cumulative downloads.
    - Successful transition from ad-only hyper-casual games to recurring hybrid-casual and consumer-app revenue.
    - Institutional backing and refinancing capacity support the balance sheet despite leverage.
  topRisks:
    - Stan Holding SAS leverage and near-term debt maturity/refinancing dependence.
    - BeReal monetization, retention, and contribution margin remain unproven.
    - Margin visibility is limited by opaque studio revenue shares, platform fees, and private-company disclosure gaps.
  unresolvedGaps:
    - Audited consolidated revenue and EBITDA bridge reconciling management and credit-agency figures.
    - Gross margin, platform fee splits, and studio revenue-share terms needed to underwrite revenue quality.
    - BeReal daily active users, retention, ARPDAU, and standalone contribution margin remain undisclosed.
    - Full cap table, liquidation preferences, and governance rights tied to minority investor stakes remain private.
