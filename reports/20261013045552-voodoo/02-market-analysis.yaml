          value: "Expanded Casual Market"
          share: "SAM Universe"
          detail: "Free-to-play mobile games monetized via blended in-game advertising and in-app microtransactions across global app stores."
        - label: "Voodoo Active Market Reach (SOM Broad)"
          value: "150M MAUs / 950M Annual Downloads"
          share: "Top-5 Global Scale"
          detail: "Global reach spanning over 150 million monthly active users and 8 billion cumulative downloads across 250+ countries."
        - label: "Voodoo Monetized Revenue Base (SOM Core)"
          value: "€623M FY2024 Revenue"
          share: "45% IAP / 55% Ads"
          detail: "Consolidated commercial revenue generated in 2024, with hybrid-casual games driving the majority of recurring income."
        - label: "Voodoo Hybrid Mega-Hit Tier (Realized LTV)"
          value: "$20M - $100M Per Title"
          share: "Core Franchise Scale"
          detail: "Individual flagship hybrid titles such as Mob Control and Collect Em All generating high-retention multi-year cash flow."
callouts:
  - calloutType: "insight"
    title: "The Hybrid-Casual Monetization Paradigm"
    body: "Voodoo's shift from hyper-casual ad reliance to hybrid-casual in-app purchases has driven IAP from 1% of revenue in 2021 to 45% in 2024, fundamentally insulating the business from platform privacy disruptions."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM006"
  - calloutType: "risk"
    title: "Storefront Concentration and Refinancing Pressures"
    body: "Total dependency on Apple App Store and Google Play for mobile distribution, coupled with near-term refinancing requirements on €220 million of debt, creates structural sensitivity to platform policies and capital markets."
    claimRefs:
      - "CM012"
      - "CM013"
