              - CR006
              - CR014
      - number: '7.2'
        title: Financial Leverage, Debt Refinancing, and Valuation Overhang
        blocks:
          - type: paragraph
            body: >-
              Voodoo's leveraged capital structure under parent entity Stan Holding SAS introduces material financial
              risk. Credit rating agency Fitch Ratings maintained Stan Holding SAS's Long-Term Issuer Default Rating at
              'B' and placed its senior secured 220 million euro Term Loan B on Rating Watch Negative ahead of its
              November 2025 maturity. While Voodoo demonstrated strong operational cash flow generation and successfully
              secured a debt refinancing package of over 175 million euros from a consortium of top-tier banking and
              institutional partners in April 2025, capital structure refinancing risks remain a central monitoring
              point. High leverage interacts directly with ongoing M&A integration costs from the BeReal transaction,
              where credit analysts forecast ongoing operating losses through 2025 and 2026. Additionally, secondary
              market equity valuations face an overhang from the 266 million dollar Groupe Bruxelles Lambert investment
              in July 2021 at a 1.7 billion dollar post-money valuation mark, creating downside valuation risk if market
              multiples compress.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR013
          - type: figure
