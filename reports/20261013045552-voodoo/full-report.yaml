      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Strategic Pivot from Ad Viewers to Paying Customers
            body: >-
              Voodoo's transition from 100% ad-based hyper-casual revenue in 2021 to 45% in-app purchase revenue in 2024
              marks a structural transformation in its customer economics. By introducing metagame mechanics and
              live-ops to titles like Mob Control, the company increased day-7 retention to over 15% and secured revenue
              recurrence, with 80% of 2024 revenue generated by titles older than two years.
            calloutType: insight
            claimRefs:
              - CU004
              - CU010
              - CU011
              - CU014
          - type: callout
            title: Platform Dependence and Credit Rating Vulnerabilities
            body: >-
              Despite robust operating growth, Voodoo remains heavily constrained by its near-total dependence on Apple
              and Google for user acquisition and payment processing. Fitch Ratings maintained Stan Holding SAS on
              Rating Watch Negative due to high refinancing risks surrounding its €220 million term loan, while Apple's
              privacy policy tightening continues to exert structural upward pressure on mobile customer acquisition
              costs.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Privacy, and Platform Gatekeeper Risks
        blocks:
          - type: paragraph
            body: >-
              Voodoo operates under severe structural exposure to the duopolistic mobile operating system gatekeepers,
              Apple and Google. Apple's rollout of the App Tracking Transparency (ATT) framework in iOS 14.5 delivered a
              severe structural shock to mobile ad attribution, halving Voodoo's hyper-casual core business revenue
              while causing user acquisition costs across the industry to surge. In addition, Voodoo remains subject to
              tightening European data privacy enforcement under the GDPR and CNIL standards, governing mobile ad
              identifiers, tracking consents, and youth data protection. While Voodoo has actively adapted by
              accelerating its transition toward hybrid-casual mechanics supported by in-app purchases and implementing
              compliant consent management platforms, the company remains structurally vulnerable to arbitrary app store
              policy adjustments, algorithmic changes, and the mandatory 30 percent platform take rate. Furthermore, the
              studio ecosystem must constantly manage copyright and trade dress scrutiny regarding game mechanics that
              closely mirror established third-party titles.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
