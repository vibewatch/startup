              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Hybrid-Casual Migration
        blocks:
          - type: paragraph
            body: >-
              Voodoo has restructured its mobile entertainment portfolio around an industrialized development
              methodology that tests thousands of concepts annually to identify scalable hits. Historically reliant on
              pure hyper-casual titles monetized through interstitial advertisements, the company executed a strategic
              pivot between 2021 and 2024 toward hybrid-casual games featuring deeper progression loops, meta-mechanics,
              and in-app purchase systems. By 2024, hyper-casual games represented only 22% of total revenue, down from
              100% in 2021, while in-app purchases expanded to 45% of total turnover. Flagship hybrid-casual titles such
              as Mob Control demonstrate substantial revenue durability, generating between $20 million and $100 million
              in annual gross revenue. Simultaneously, Voodoo expanded into consumer social applications through its
              €500 million acquisition of photo-sharing network BeReal in June 2024, diversifying its digital footprint
              beyond gaming into authentic communication networks.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE008
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE008
              - CE010
      - number: '5.2'
        title: Publishing Funnel and Prototyping Workflow
        blocks:
          - type: paragraph
            body: >-
              Voodoo's core operational engine functions as a high-velocity publishing funnel that evaluates external
              and in-house game prototypes against strict empirical hurdle rates. Rather than spending months
              handcrafting game assets, developers produce weekly minimal viable prototypes focused exclusively on core
              mechanics. Voodoo integrates GameAnalytics telemetry directly into every prototype build to track early
              engagement, systematically eliminating approximately 19 out of every 20 tested titles if retention metrics
              fail to clear internal benchmarks. For hybrid-casual titles, the company targets baseline retention
              hurdles of at least 45% Day 1 retention, 15% Day 7 retention, and 10% Day 30 retention before committing
              growth capital. Once a prototype validates its commercial equation, dedicated live-ops teams assume
              operational management, deploying recurring events, progression layers, and economy balance to extend
              title longevity across its catalog of over 8 billion cumulative downloads.
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE008
              - CE013
      - number: '5.3'
        title: Core Technology Stack and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The technical operating architecture supporting Voodoo's publishing ecosystem relies on a modular
              client-server infrastructure designed for automated scaling. External partner studios receive a unified
              SDK package that standardizes ad mediation, telemetry reporting, remote configuration, and in-app purchase
              inventory controls within Unity game projects. On the growth infrastructure layer, Voodoo deploys its
              proprietary Bidshake marketing automation suite, which generates over 25,000 ad creatives annually and
              automates bidding across global ad networks. This engine feeds into an internal ad network that routes
              more than 250 billion impressions each year. Backend scalability and quality assurance are reinforced
              through infrastructure partnerships, including an August 2025 collaboration with Tencent Cloud and WeTest
              to provide automated cross-device compatibility testing and optimized cloud hosting for global
              multi-region deployments.
            claimRefs:
              - CE002
              - CE003
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE009
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE004
              - CE010
              - CE014
      - number: '5.4'
        title: Platform Dependencies, Privacy Enforcement, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              Despite its operational scale, Voodoo's technology and monetization model face severe structural
              vulnerabilities arising from platform dependency and post-acquisition integration hurdles. Mobile game
              distribution and monetization remain entirely beholden to Apple's App Store and Google Play ecosystems.
              Platform-level privacy restrictions, particularly Apple's App Tracking Transparency enforcement, have
              permanently impaired ad attribution, inflating customer acquisition costs across hyper-casual and hybrid
              genres. Furthermore, credit rating assessments from Fitch Ratings emphasize that while hybrid casual
              diversification improved margin visibility, near-term debt maturity risks and ongoing losses from
              integrating BeReal constrain financial flexibility. Voodoo responded to BeReal's operational integration
              by laying off 28 engineering, QA, and marketing staff, highlighting the technical and cost challenges of
              pivoting an unmonetized social application toward profitability.
            claimRefs:
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architectural Shift from Hyper-Casual to Hybrid-Casual
            body: >-
              Voodoo's technical transformation from 100% ad-driven hyper-casual titles to 45% in-app purchase revenue
              represents an intentional architectural pivot toward deeper meta-gameplay and extended player retention.
            calloutType: insight
            claimRefs:
              - CE004
              - CE005
              - CE007
          - type: callout
            title: Distribution Platform Bottlenecks and Privacy Friction
            body: >-
              Voodoo remains heavily exposed to Apple and Google distribution policies, where privacy tightening (IDFA
              deprecation) increases acquisition costs while BeReal restructuring adds integration complexity.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              Voodoo operates an unusual multi-sided commercial architecture in mobile gaming and consumer applications.
              On the consumer side, the company entertains an audience generating over 150 million monthly active users
              across more than 250 countries, with total lifetime portfolio downloads exceeding 8 billion. Historically,
              hyper-casual consumer users were non-paying audience units monetised exclusively through ad impressions
              (interstitial, rewarded, and banner formats), which represented 100% of revenue in 2021. Following
              structural platform privacy headwinds, Voodoo shifted toward hybrid-casual titles such as Mob Control and
              Collect Em All!, where players engage with deeper metagames and recurring in-app purchase (IAP) economies.
              By 2024, in-app purchases accounted for 45% of total corporate revenues, transforming mobile players into
              paying transactors. On the supply side, Voodoo functions as a publishing platform and technology partner
              for over 150 independent mobile game studios. These external partner studios serve as Voodoo's B2B
              customer base, licensing or co-developing game prototypes in exchange for publishing, user acquisition
              financing, analytics tooling, and revenue-sharing support.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
