chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operational Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Founded in Paris in 2013 by Alexandre Yazdi and Laurent Ritter, Voodoo has expanded from an indie
              development studio into one of the world's largest mobile gaming and consumer application publishers
              [CO001]. The company operates a global footprint spanning over 800 employees across 14 international
              offices, with more than 50% of revenue generated outside Europe [CO001, CO002]. Across its ten-year
              operating history, Voodoo's diversified portfolio has surpassed 8 billion cumulative downloads and
              maintains an active audience of 150 million monthly active users [CO002, CO003]. For fiscal year 2024, the
              business delivered €623 million in revenue (reflecting 20% year-over-year growth) and €135 million in
              EBITDA, expanding further to $780 million in revenue in 2025 [CO002, CO004]. Voodoo powers this
              distribution engine via an industrialized publishing technology stack capable of generating 25,000 ad
              creatives annually and delivering over 250 billion impressions across global ad networks [CO014].
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
      - number: '1.2'
        title: Executive Leadership and Organizational Architecture
        blocks:
          - type: paragraph
            body: >-
              Voodoo is steered by its founding executive team, with Alexandre Yazdi serving as Chief Executive Officer
              and Laurent Ritter as Chief Operating Officer [CO001, CO007]. Yazdi directs overarching corporate
              strategy, studio acquisitions, and capital allocation, while Ritter oversees core publishing operations,
              studio coaching networks, and developer infrastructure [CO007]. Publishing operations are executed under
              dedicated leaders such as Head of Publishing Thibault de Vésinne-Larüe, who orchestrates hybrid-casual
              live operations and game soft-launches across more than 150 partner studios worldwide [CO007, CO014].
              Because Voodoo remains an unlisted private enterprise, granular governance parameters—including board of
              directors composition, independent director representation, executive committee voting thresholds, and
              management equity vesting schedules—remain closely held and are not publicly disclosed [CO015].
            claimRefs:
              - CO001
              - CO007
              - CO014
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO007
              - CO013
              - CO014
      - number: '1.3'
        title: Capitalization History, Debt Structure, and Credit Profile
        blocks:
          - type: paragraph
            body: >-
              Voodoo's capitalization reflects a blend of growth equity rounds and institutional leveraged debt
              financing anchored under the parent entity Stan Holding SAS [CO005, CO008]. Early institutional growth
              funding from Goldman Sachs was followed in August 2020 by Tencent acquiring a minority equity stake at a
              reported $1.4 billion valuation [CO006]. In July 2021, Belgian investment holding firm Groupe Bruxelles
              Lambert (GBL) completed a $266 million strategic investment at a $1.7 billion post-money valuation
              [CO005]. On the debt side, Fitch Ratings maintained Stan Holding SAS's Issuer Default Rating at B and its
              senior secured €220 million Term Loan B on Rating Watch Negative in March 2025 due to near-term maturity
              risks [CO008]. However, liquidity is buffered by an estimated €101 million cash position at year-end 2024
              and forecast positive free cash flow generation, leading to a successful debt refinancing of over €175
              million in April 2025 [CO008, CO009, CO012]. Detailed cap table share classes, liquidation preferences,
              and covenant terms remain private [CO015].
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO009
              - CO012
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO012
              - CO015
      - number: '1.4'
        title: Strategic Milestones and Consumer App Diversification
        blocks:
          - type: paragraph
            body: >-
              Over its operating trajectory, Voodoo executed a critical strategic pivot away from ad-reliant
              hyper-casual titles toward sustainable hybrid-casual games and high-retention consumer apps [CO010]. When
              platform privacy headwinds—notably Apple's IDFA changes—pressured hyper-casual unit economics, Voodoo
              restructured its game mechanics to incorporate progression economies and in-app purchases (IAP), driving
              IAP revenue from just 1% in 2021 to 45% of total revenue by 2024 [CO010]. Flagship hybrid-casual
              franchises such as Mob Control and Block Jam 3D generate between $20 million and $100 million in recurring
              annual revenue each [CO010, CO013]. To expand beyond gaming, Voodoo acquired French photo-sharing social
              app BeReal in June 2024 for €500 million, while launching live-shopping platform Jamble, establishing
              multi-genre entertainment foundations for future scale [CO011, CO014].
            claimRefs:
              - CO010
              - CO011
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO008
              - CO010
              - CO011
              - CO012
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strategic Transition from Hyper-Casual to Hybrid-Casual Monetization
            body: >-
              Voodoo's evolution from ad-dependent hyper-casual titles to hybrid-casual franchises represents a major
              operational turnaround. In-app purchases expanded from just 1% of total revenue in 2021 to 45% by 2024,
              buffering the company against platform privacy changes such as Apple's IDFA depreciation while lengthening
              game lifespans.
            calloutType: insight
            claimRefs:
