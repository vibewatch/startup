            title: Refinancing Deadlines and Capital Structure Leverage
            body: >-
              While Voodoo generated positive EBITDA of €135 million in 2024 and completed a €175 million credit
              refinancing in early 2025, its B credit profile and substantial debt load under Stan Holding SAS demand
              sustained operating cash generation and disciplined M&A execution.
