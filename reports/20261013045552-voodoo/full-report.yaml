  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation Stance
        blocks:
          - type: paragraph
            body: >-
              Voodoo presents a compelling operational turnaround from fragile hyper-casual publishing to a scaled
              hybrid-casual model generating recurring in-app purchase revenue. Top-performing hybrid hits such as Mob
              Control generate between $20 million and $100 million in annual gross revenue, anchoring portfolio
              resilience where nearly 80% of 2024 income originates from mature titles live for over two years. However,
              this operational achievement must be evaluated against private market entry terms. With Groupe Bruxelles
              Lambert's 2021 round setting a $1.7 billion valuation benchmark, current equity pricing remains stretched
              relative to credit agency recovery benchmarks. We recommend an investment stance of track with medium
              confidence, reflecting healthy top-line momentum offset by opacity in underlying studio economics and
              unit-level gross margins.
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
      - number: '8.2'
        title: Capital Structure, Leverage, and Refinancing Exposure
        blocks:
          - type: paragraph
            body: >-
              Voodoo's corporate financing structure under Stan Holding SAS introduces significant credit and liquidity
              constraints that temper equity enthusiasm. Fitch Ratings maintains Stan Holding SAS's Long-Term Issuer
              Default Rating at 'B' and its EUR220 million senior secured term loan B at 'B+' on Rating Watch Negative,
              reflecting elevated refinancing risk heading into its late-2025 maturity. Although Voodoo announced over
              €175 million in refinancing in April 2025 and improved Fitch-calculated leverage from 70x in 2022 to 3.8x
              at end-2024, substantial debt service requirements limit free cash flow flexibility. Fitch estimates
              going-concern EBITDA at EUR38 million and applies a 5.0x distressed enterprise value multiple in recovery
              scenarios, demonstrating that downside protection is limited if debt rollover conditions tighten.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Thesis, Anti-Thesis, and Strategic M&A Diligence
        blocks:
          - type: paragraph
            body: >-
              The central tension in underwriting Voodoo lies between its industrialized publishing engine and its
              aggressive diversification into consumer social apps. On the positive side, Voodoo's data-driven
              publishing platform produces 25,000 creatives annually and tests approximately 2,000 prototypes,
              establishing unmatched operational agility in user acquisition and ad monetization. Conversely, the €500
              million acquisition of BeReal in June 2024 introduces severe execution drag. BeReal is projected to remain
              loss-making through 2025 and 2026, re-exposing Voodoo to volatile social advertising dynamics precisely as
              mobile in-app purchases reached 45% of total revenue. Diligence must establish whether BeReal can achieve
              sustainable viral engagement and commercial viability before burning operating cash reserves generated by
              core gaming titles.
            claimRefs:
              - CV004
              - CV006
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
      - number: '8.4'
        title: Valuation Scenarios, Comps, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Our valuation scenario analysis projects three distinct risk-adjusted trajectories for Voodoo over a
              two-year investment horizon. In the bull case, hybrid titles expand to 80% of revenue while BeReal
              successfully scales ad monetization, supporting an enterprise valuation between $2.5 billion and $3.0
              billion. The base case models steady 6% to 10% annual revenue expansion in gaming alongside moderated
              BeReal losses, yielding a fair valuation between $1.6 billion and $1.9 billion consistent with historical
              transaction marks. In the bear scenario, persistent user decay at BeReal and debt refinancing headwinds
              trigger multiple compression toward Fitch's distressed 5.0x recovery multiple, impairing equity value to
              $0.8 billion to $1.1 billion. Explicit thesis-break triggers include a credit downgrade below B-, failure
              to maintain 15% D7 retention on new hybrid releases, or sustained cash drain from non-gaming acquisitions.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Disciplined Stance on Stretched Valuation
            body: >-
              Given the unverified nature of private EBITDA disclosures, persistent refinancing exposure flagged by
              Fitch Ratings on Stan Holding SAS's debt, and the unproven monetization model of the €500 million BeReal
              acquisition, Voodoo warrants a disciplined track recommendation rather than a buy at historical round
              multiples.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
          - type: callout
            title: Execution Headwinds and Debt Refinancing
            body: >-
              While management reported €135 million in EBITDA for 2024, Fitch Ratings estimates credit-adjusted EBITDA
              at €71 million and maintains a Rating Watch Negative status on the EUR220 million term loan B,
              underscoring material refinancing and cash absorption risks as BeReal integration continues.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
