      - number: '6.2'
        title: Adoption Trajectory, Retention Dynamics, and Revenue Durability
        blocks:
          - type: paragraph
            body: >-
              Voodoo's user adoption trajectory demonstrates immense aggregate volume coupled with fundamental changes
              in cohort retention. The company generated 950 million downloads in 2024, maintaining its position as the
              third-to-fifth largest mobile publisher globally by volume behind Google, Meta, and ByteDance. The
              durability of its revenue model has strengthened materially as games mature: in 2024, nearly 80% of
              Voodoo's €623 million in revenue was generated by titles that had been on the market for more than two
              years, led by long-running titles such as Mob Control, Hole.io, and Paper.io 2. This shift contrasts
              sharply with early hyper-casual industry dynamics, where games experienced rapid decay within weeks of
              launch. To maintain this durability, Voodoo enforces strict quantitative retention thresholds across its
              testing pipelines, screening studio prototypes through automated analytics to track day-1 and day-7
              retention, playtime, and cost per install (CPI). Hybrid-casual titles require minimum core day-7 retention
              of 15% (and 20% for puzzle mechanics) alongside day-1 retention above 45% before receiving commercial
              greenlights.
            claimRefs:
              - CU002
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
