  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Evidence Anchor
      - What Would Change View
    rows:
      - - Investment Thesis
        - >-
          Scaled hybrid-casual publisher with proven organic cash generation, recurring live-ops revenue, and top-3
          global download presence.
        - €623M revenue (+20% YoY), €135M EBITDA, 80% revenue from titles older than 2 years.
        - >-
          Sustained deceleration below 10% YoY growth or failure to maintain D7 retention above 15% across new soft
          launches.
      - - Investment Anti-Thesis
        - >-
          Capital structure leverage under Stan Holding SAS, hit-driven volatility, Apple IDFA headwinds, and execution
          drag from loss-making BeReal.
        - Fitch B/RWN rating, EUR220M term loan refinancing risk, BeReal projected loss-making in 2025-2026.
        - Clean refinancing of term debt with maturity extension beyond 2028 and breakeven BeReal monetization.
      - - Market Stance
        - >-
          Late-stage valuation of $1.7B is stretched relative to public comps and credit distress multiples without
          audited segment transparency.
        - UpMarket $1.7B GBL benchmark vs Fitch 5.0x distressed enterprise multiple.
        - Full disclosure of audited IAP unit economics, BeReal contribution margins, and gross margin exceeding 65%.
    notes: Thesis and anti-thesis synthesized against operational scale disclosures and Fitch Ratings credit parameters.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Hybrid-casual revenue grows 15%+; BeReal achieves profitability via social advertising; debt extended on
          favorable terms.
        - $2.5B-$3.0B valuation (12x-14x EBITDA on €180M+ cash EBITDA); strong return for late-stage entry.
        - Platform policy changes by Apple/Google; ad market softening; user attrition at BeReal.
        - 20% (contingent on successful social monetization)
      - - Base Case
        - >-
          Gaming revenue grows 6%-10%; BeReal remains moderate cash drag through 2026; €175M+ refinancing stabilizes
          liquidity.
        - >-
          $1.6B-$1.9B valuation (8x-10x EBITDA on €140M-€150M normalized EBITDA); flat to modest return vs 2021 GBL
          mark.
        - Refinancing cost inflation; higher user acquisition costs; casual competition from Supercell and King.
        - 55% (aligned with Fitch baseline revenue trajectory)
      - - Bear Case
        - Hybrid hit decay; BeReal active user base erodes; TLB refinancing falters leading to debt restructuring.
        - $0.8B-$1.1B valuation (5.0x distressed EV/EBITDA on EUR38M-EUR70M credit EBITDA); 40%+ equity impairment.
        - Debt downgrade below B-; liquidity depletion; studio partner churn.
        - 25% (supported by Fitch Rating Watch Negative flag)
    notes: >-
      Valuation ranges are illustrative scenarios based on Fitch Ratings recovery parameters, historical GBL valuation
      benchmarks, and reported EBITDA.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological milestone progression of Voodoo from founding through hyper-casual dominance, hybrid-casual
      transition, and consumer app diversification.
    data:
      items:
        - date: 2013-2016
          label: Founding & Prototyping
          detail: >-
            Voodoo founded in Paris by Alexandre Yazdi and Laurent Ritter; pivoted from failed internal quiz game to
            fast prototyping.
          tone: neutral
        - date: 2016-2018
          label: Publishing Model & Paper.io
          detail: >-
            Industrialized weekly testing and studio coaching; launched breakthrough hit Paper.io with over 35 million
            downloads.
          tone: positive
        - date: 2019-2020
          label: Hyper-Casual Peak Scale
          detail: >-
            Scaled to 800 partner studios and $400M in revenue; Tencent acquired a strategic minority stake in August
            2020.
          tone: positive
        - date: '2021'
          label: Hybrid Pivot & GBL Investment
          detail: >-
            Initiated transition to hybrid-casual in response to Apple IDFA privacy rules; GBL invested $266M at a $1.7B
            valuation.
          tone: positive
        - date: '2023'
          label: Hybrid Hits Expansion
          detail: >-
            Scaled multi-million dollar hybrid titles including Mob Control and Block Jam 3D with enhanced IAP
            monetization loops.
          tone: positive
        - date: '2024'
          label: BeReal Acquisition & 20% Growth
          detail: >-
            Acquired social platform BeReal for €500M; full-year revenue reached €623M with €135M EBITDA and 950M annual
            downloads.
          tone: opportunity
        - date: '2025'
          label: Debt Refinancing & $780M Revenue
          detail: >-
            Completed €175M+ debt refinancing consortium; annual revenue reached $780M with 800 employees across 14
            countries.
          tone: positive
        - date: '2026'
          label: Current Operating Horizon
          detail: >-
            Portfolio reached 8 billion cumulative downloads and 150 million MAUs while managing Stan Holding SAS debt
            maturities.
          tone: neutral
