              - CR009
              - CR010
      - number: '7.4'
        title: Partner Dependencies, Thesis-Break Triggers, and Monitoring Indicators
        blocks:
          - type: paragraph
            body: >-
              Voodoo's business model relies on a decentralized partner network of over 150 independent game development
              studios and 100 internal teams, creating execution dependencies across external developer talent. To
              retain these partners, Voodoo provides coaching, SDK infrastructure, and automated creative production
              delivering 250 billion ad impressions annually. Key thesis-break triggers for prospective investors
              include: failure to maintain positive free cash flow under newly refinanced debt facilities; sustained
              cohort churn or expanding operating losses at BeReal exceeding 50 million euros annually; sudden platform
              policy sanctions or fee changes imposed by Apple or Google; and degradation of Day 1 retention across
              newly launched hybrid-casual titles below 40 percent. Diligence must rigorously review audited standalone
              financials for BeReal, debt covenant headroom, and studio revenue-share contracts.
            claimRefs:
              - CR003
              - CR006
              - CR011
              - CR012
