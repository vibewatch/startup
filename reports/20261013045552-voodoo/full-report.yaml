        title: Exhibits
        blocks:
          - type: callout
            title: Term Loan B Refinancing and BeReal Integration Concurrency
            body: >-
              Stan Holding SAS faced concurrent capital structure maturity and M&A execution pressure in 2025 as it
              integrated the unmonetized 500 million euro BeReal acquisition while negotiating the refinancing of its
              220 million euro senior secured term loan.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: callout
            title: Diligence Priorities for Downside Risk Protection
            body: >-
              Prospective investors must underwrite BeReal standalone cash burn, audit revenue recurrence across legacy
              hit titles, and verify debt covenant compliance under the newly refinanced 175 million euro debt facility.
            calloutType: recommendation
            claimRefs:
