      - number: '7.3'
        title: Operational Prototyping Attrition and Portfolio Lifecycle Risks
        blocks:
          - type: paragraph
            body: >-
              At the operational layer, Voodoo's publishing engine relies on industrial-scale prototyping that exhibits
              extreme attrition rates. Voodoo evaluates between 1,000 and 2,000 game prototypes each year, with
              approximately 100 prototypes active at any given time, but only about 0.4 percent of tested titles
              successfully clear retention hurdles to achieve a commercial launch. The company's pivot from hyper-casual
              titles—which collapsed from 100 percent of revenue in 2021 to 22 percent in 2024—toward hybrid-casual
              games demands significantly higher Day 1 retention (above 45 percent) and Day 7 retention (above 15
              percent) to warrant ongoing live-ops investment. Furthermore, portfolio revenue remains heavily
              concentrated, with nearly 80 percent of 2024 revenue generated by legacy hits that have been active in app
              stores for more than two years. Meanwhile, the 500 million euro acquisition of social media platform
              BeReal carries substantial execution uncertainty, as the platform currently features zero direct consumer
              monetization channels.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
