          - type: callout
            title: Leverage and Refinancing Vulnerability Under Stan Holding SAS
            body: >-
              While Voodoo generated €135 million in company-reported EBITDA in 2024, its leveraged capital structure
              under Stan Holding SAS—featuring a €220 million term loan—demanded credit agency monitoring and prompted a
              €175 million debt refinancing in early 2025.
            calloutType: risk
            claimRefs:
