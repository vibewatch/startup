  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries and Spend Categorization
        blocks:
          - type: paragraph
            body: >
              Voodoo operates at the intersection of mobile gaming publishing, internal game development, and
              high-engagement consumer mobile applications. The company has historically anchored its market presence in
              hyper-casual gaming—characterized by simple tap mechanics, minimal onboarding friction, short session
              lengths, and complete reliance on programmatic in-game ad monetization. However, the addressable
              boundaries of Voodoo's business model have expanded substantially beyond hyper-casual entertainment.
              Voodoo now actively develops and publishes hybrid-casual games, casual puzzle franchises, and consumer
              social platforms such as BeReal and live-shopping application Jamble. Included market spend encompasses
              worldwide mobile consumer spending on in-app purchases, progression accelerators, and subscription passes,
              alongside programmatic advertising budgets deployed by mobile performance marketers. Explicitly excluded
              from Voodoo's target market are high-friction AAA console and PC gaming markets, cloud gaming
              infrastructure services, enterprise software platforms, and real-money gambling ecosystems. Voodoo's core
              commercial opportunity centers on capturing high-frequency digital engagement and monetizing mass-market
              player cohorts through blended ad-and-purchase loops.
            claimRefs:
              - CM001
              - CM004
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM009
      - number: '2.2'
        title: Market Sizing and Growth Projections
        blocks:
          - type: paragraph
            body: >
              Independent market analysis from Fitch Ratings estimates that the global mobile gaming sector will expand
              at a mid-single-digit compound annual growth rate across 2025 through 2027, maintaining its position as
              the fastest-growing subsector in overall consumer entertainment spend. Within this expanding macro
              backdrop, Voodoo has demonstrated substantial revenue scale and expanding operating profitability. For
              fiscal year 2024, Voodoo reported record consolidated revenue of €623 million, representing approximately
              20% year-over-year expansion, alongside EBITDA of €135 million, up 34% from 2023. Secondary pre-IPO market
              analyses from UpMarket indicate that 2025 revenue reached $778 million, sustaining 16% year-over-year
              top-line momentum. Crucially, the quality and predictability of Voodoo's revenue stream have undergone a
              structural transformation: in-app purchases represented 45% of total revenue in 2024, up dramatically from
              just 1% in 2021. Flagship hybrid-casual franchises such as Mob Control and Collect Em All now reliably
              generate between $20 million and $100 million in gross annual revenue each, establishing recurring cash
              flows with multi-year lifespans.
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM005
              - CM011
      - number: '2.3'
        title: Player, Studio, and Platform Ecosystem
        blocks:
          - type: paragraph
            body: >
              Voodoo's commercial engine functions as a multi-sided ecosystem connecting mobile gamers, independent
              development studios, and global advertising networks. Across its player base, Voodoo engages more than 150
              million monthly active users across over 250 countries and territories, having accumulated more than 8
              billion lifetime downloads since its founding in 2013, with 950 million downloads recorded in 2024 alone.
              On the supply side, Voodoo maintains active commercial relationships with over 150 external partner
              studios. Rather than relying solely on internal creative teams, Voodoo provides partner studios with
              proprietary developer tooling, testing dashboards, and automated user acquisition engines to test
              approximately 2,000 game prototypes each year. On the advertising monetization front, Voodoo produces
              approximately 25,000 ad creatives annually and distributes roughly 250 billion ad impressions across
              global ad exchanges. This extensive distribution footprint allows Voodoo to function simultaneously as a
              top-tier programmatic ad inventory supplier and a sophisticated media buyer capable of acquiring user
              cohorts at scale.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM010
      - number: '2.4'
        title: Growth Catalysts and Industry Constraints
        blocks:
          - type: paragraph
            body: >
              The fundamental catalyst accelerating Voodoo's strategic diversification was Apple's introduction of App
              Tracking Transparency (ATT) and IDFA deprecation in iOS 14. By restricting cross-app behavioral tracking,
              Apple's privacy policy caused customer acquisition costs to spike sharply across the mobile ecosystem,
              eroding the unit economics of low-LTV hyper-casual titles and forcing publishers to prioritize deeper
              gameplay loops capable of sustaining higher customer lifetime values. While Voodoo navigated this
              transition faster than many peers, the business faces material structural constraints. Credit evaluations
              by Fitch Ratings highlight that Stan Holding SAS carries a 'B' Long-Term Issuer Default Rating on Rating
              Watch Negative, driven by high refinancing risk surrounding its €220 million term loan maturing in
              November 2025 and ongoing integration costs from BeReal. Furthermore, Voodoo remains structurally
              dependent on the Apple App Store and Google Play duopoly for global distribution, leaving operating
              margins vulnerable to platform policy revisions and store fee structures. Reconciling exact publisher net
              revenue-share splits across external studios remains a key diligence gap in private records.
            claimRefs:
              - CM006
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Hybrid-Casual Monetization Paradigm
            body: >-
              Voodoo's shift from hyper-casual ad reliance to hybrid-casual in-app purchases has driven IAP from 1% of
              revenue in 2021 to 45% in 2024, fundamentally insulating the business from platform privacy disruptions.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: callout
            title: Storefront Concentration and Refinancing Pressures
            body: >-
              Total dependency on Apple App Store and Google Play for mobile distribution, coupled with near-term
              refinancing requirements on €220 million of debt, creates structural sensitivity to platform policies and
              capital markets.
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Categorization of Peers
        blocks:
          - type: paragraph
            body: >-
              The mobile gaming ecosystem has transitioned through intense structural realignment, bifurcating into
              mass-market casual incumbents and ad-reliant hyper-casual developers. Voodoo historically dominated
              hyper-casual publishing, scaling to become the third-to-fifth largest mobile publisher globally by
              download volume alongside tech platforms such as Google, Meta, Tencent, and ByteDance [CP001]. However,
              hyper-casual publishing suffered severe commoditization as low barrier to entry fostered relentless
              cloning of core game mechanics across hundreds of independent studios [CP003]. In response, larger
              publishers pursued aggressive consolidation, exemplified by Zynga acquiring hyper-casual specialist Rollic
              Games for $168 million and Peak Games for $1.8 billion to capture distribution scale and studio pipelines
              [CP007]. Despite Voodoo's massive lifetime footprint of over 8 billion downloads, casual incumbents such
              as King and Supercell continue to command the majority of industry revenues with durable evergreen
              franchises that resist displacement [CP005, CP014].
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP014
      - number: '3.2'
        title: Capability Comparisons and Positioning Benchmarks
        blocks:
          - type: paragraph
            body: >-
              To counter hyper-casual margin compression, Voodoo executed a strategic pivot toward hybrid-casual game
              development, reducing hyper-casual revenue contribution to 22% in 2024 compared to 100% in 2021 [CP002].
              Hybrid titles such as Mob Control and Collect Em All layer progression mechanics, multiplayer meta-layers,
              and live operations onto accessible core gameplay loops, generating between $20 million and $100 million
              in annual revenue per franchise [CP006]. While traditional casual incumbents like King and Supercell rely
              on deep in-app purchase economies with high average revenue per paying user, hyper-casual titles
              traditionally generated negligible direct purchase spend [CP004]. Voodoo's competitive edge resides in its
              industrialized publishing engine, which tests nearly 2,000 prototypes per year and deploys automated
              creative production producing over 25,000 ad variants annually to sustain user acquisition velocity
              [CP010]. Meanwhile, platform-native giants including Tencent and ByteDance have introduced social
              mini-games that bypass third-party app stores entirely [CP008].
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP008
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP008
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP007
              - CP008
      - number: '3.3'
        title: Monetization Models, Packaging, and Distribution Economics
        blocks:
          - type: paragraph
            body: >-
              Voodoo's revenue architecture reflects a dual-engine monetization model combining high-velocity
              programmatic advertising with expanding in-app purchases. In 2024, in-app purchases expanded to represent
              45% of total revenue, up from just 1% in 2021, providing substantially improved revenue visibility and
              customer lifetime value compared to pure ad-monetized predecessors [CP002, CP004]. To monetize non-paying
              players, Voodoo leverages a proprietary ad network and automated auction infrastructure that serves 250
              billion ad impressions annually across its title network [CP010]. Seeking to establish owned organic
              distribution channels outside gaming, Voodoo acquired social networking platform BeReal for €500 million
              in June 2024 [CP012]. However, expanding into consumer social apps introduces substantial execution risk;
              BeReal was generating no revenue and burning approximately $3 million monthly at acquisition,
              necessitating a delicate monetization rollout via sponsored campaigns that faces unproven returns [CP013].
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
              - CP010
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability, Platform Vulnerabilities, and Adverse Risks
        blocks:
          - type: paragraph
            body: >-
              Voodoo's competitive moat is constrained by persistent structural platform dependencies and genre
              concentration. The enforcement of Apple's App Tracking Transparency (IDFA) framework fundamentally
              restructured user acquisition unit economics, elevating cost per install across the gaming ecosystem and
              disproportionately penalizing publishers lacking proprietary social media discovery surfaces [CP009].
              Unlike tech conglomerates like ByteDance and Tencent that control native social networks, Voodoo relies
              almost entirely on Apple's App Store and Google Play for commercial discovery and payment settlement
              [CP008, CP009]. Credit rating evaluations from Fitch Ratings emphasize that Voodoo's relatively small
              overall scale, hits-driven cash flow volatility, and limited platform diversification leave it vulnerable
              to market share erosion against well-capitalized gaming conglomerates [CP011]. Furthermore, ongoing
              integration and monetization demands from BeReal could dilute operating focus if user engagement softens
              before positive cash generation is sustained [CP013].
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Hybrid-Casual Escape Velocity
            body: >-
              Voodoo's transition from ad-monetized hyper-casual to hybrid-casual titles like Mob Control has
              meaningfully stabilized top-line recurrence and diversified revenue toward in-app purchases (45% in 2024).
              However, closing the ARPU gap with casual incumbents like King and Supercell requires deep meta-game
              design and live-ops capabilities that mobile publishers cannot easily industrialize through rapid
              prototyping alone.
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP006
          - type: callout
            title: Asymmetric Platform and Ad Privacy Exposure
            body: >-
              Unlike platform-native entrants like ByteDance and Tencent who command proprietary social feeds, Voodoo
              remains heavily dependent on Apple's App Store and Google Play for distribution and ad measurement.
              Privacy policy enforcement such as Apple's IDFA changes permanently elevates customer acquisition costs,
              forcing publishers to maintain aggressive creative production and ad-tech spend merely to preserve install
              velocity.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Business Model Evolution
        blocks:
          - type: paragraph
            body: >-
              Voodoo's commercial financial model has undergone a comprehensive transformation from low-retention
              hyper-casual mobile titles monetized entirely by programmatic advertisements into sophisticated
              hybrid-casual games anchored by recurring in-app purchases. In fiscal year 2024, the company recorded
              consolidated annual revenues of €623 million, marking nearly 20% year-over-year expansion compared to
              2023. Historically, hyper-casual games represented 100% of company revenues as recently as 2021; by 2024,
              that segment compressed to just 22% of top-line revenue as user privacy shifts degraded programmatic
              advertising yields. Concurrently, in-app purchases scaled aggressively to represent 45% of total revenue,
              generating more stable multi-month customer monetization. Furthermore, revenue durability is underpinned
              by long-tail titles: nearly 80% of 2024 revenue originated from games active for more than two years,
              demonstrating that live operations and meta-progression loops have substantially extended game lifespans
              beyond ephemeral download spikes.
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI010
              - CI015
      - number: '4.2'
        title: Monetization Architecture and GTM Channel Economics
        blocks:
          - type: paragraph
            body: >-
              The core monetization engine combines high-volume free-to-play consumer onboarding with layered commercial
              touchpoints across advertising networks and microtransactions. For hybrid titles, gameplay loops integrate
              rewarded video advertisements for optional player multipliers alongside microtransaction bundles ranging
              from $0.99 consumables up to $99.99 progression packages. Following Apple's App Tracking Transparency
              enforcement, customer acquisition costs increased substantially across casual gaming genres, making pure
              ad-funded models unsustainable. Voodoo navigated this headwind through proprietary automated testing
              platforms and cross-channel marketing automation via tools like BidShake, testing roughly 2,000 game
              prototypes per year to isolate projects with high organic appeal. When a concept demonstrates acceptable
              early retention, Voodoo deploys performance marketing to scale player cohorts, with hit games like Mob
              Control and Block Jam 3D achieving gross revenues between $20 million and $100 million annually.
            claimRefs:
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Cost Structure, Gross Margins, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Voodoo's cost architecture is shaped by platform distribution take-rates, external partner studio
              revenue-sharing agreements, paid user acquisition marketing, and engineering payroll across 800 employees.
              For mobile games distributed via the Apple App Store and Google Play, platform commissions absorb
              approximately 15% to 30% of gross consumer spend. Additionally, because roughly 75% of commercial releases
              originate from Voodoo's global network of over 2,000 independent partner studios, contractual royalty
              splits represent a material operating expense. On an accounting basis, management reported 2024 EBITDA of
              €135 million, representing a 21.7% reported margin. However, credit rating analysis by Fitch normalized
              2024 EBITDA at €71 million (an 11.4% margin), treating software development costs as operating expenses
              rather than capitalized investments. At the unit level, hybrid greenlighting mandates a strict minimum of
              15% Day-7 player retention, ensuring that lifetime customer value exceeds initial customer acquisition
              expense before live operations teams commit ongoing scaling capital.
            claimRefs:
              - CI004
              - CI009
              - CI010
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI009
              - CI010
      - number: '4.4'
        title: Capital Adequacy, Debt Structure, and Refinancing
        blocks:
          - type: paragraph
            body: >-
              The financial health and balance sheet sustainability of Voodoo must be evaluated through its corporate
              holding structure, Stan Holding SAS, which carries substantial syndicated debt. At year-end 2024, the
              capital structure was anchored by a €220 million senior secured Term Loan B maturing in November 2025,
              alongside an undrawn €30 million revolving credit facility. Fitch Ratings placed the Term Loan B on Rating
              Watch Negative in early 2025 due to near-term maturity concentration. However, refinancing risks were
              mitigated by €101 million in available year-end cash balances and positive free cash flow generation
              projected at 3% to 6% of revenue. In April 2025, Voodoo resolved immediate liquidity vulnerabilities by
              successfully executing a debt refinancing exceeding €175 million with an institutional banking consortium,
              demonstrating continued access to credit markets and restoring balance sheet flexibility.
            claimRefs:
              - CI003
              - CI011
              - CI012
      - number: '4.5'
        title: Financial Verdict and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              From an investment diligence perspective, Voodoo displays impressive operational adaptability, having
              successfully pivoted away from the collapsing hyper-casual ad model into a profitable, recurring
              hybrid-casual publisher. Nevertheless, prospective investors face notable underwriting obstacles. Foremost
              among these is the €500 million acquisition of social photo application BeReal in June 2024. BeReal
              entered the portfolio with minimal commercial monetization, and credit analysts project it will remain
              loss-making through at least 2026, posing ongoing execution risk and potential drain on operating cash
              flows. Furthermore, the absence of public audited statutory accounts leaves material discrepancies between
              management's reported €135 million EBITDA and rating agency figures. Underwriters require audited
              reconciliation schedules and standalone BeReal cohort retention metrics before validating normalized
              earnings quality.
            claimRefs:
              - CI013
              - CI014
      - number: '4.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Hybrid-Casual Transformation Rebalances Revenue Quality
            body: >-
              Voodoo's transition away from pure hyper-casual advertising toward in-app purchases has expanded revenue
              visibility and reduced dependence on volatile ad networks, with IAP reaching 45% of revenue in 2024
              compared to just 1% in 2021.
            calloutType: insight
            claimRefs:
