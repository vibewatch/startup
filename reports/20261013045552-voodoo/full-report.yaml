              - CU010
              - CU014
      - number: '6.3'
        title: Named Studio Deployments, Platform Friction, and Concentration Exposure
        blocks:
          - type: paragraph
            body: >-
              Proof of commercial adoption spans both top-performing gaming franchises and external technology
              deployments. Core hybrid-casual hits demonstrate significant individual revenue scale: titles like Mob
              Control have generated between $20 million and $100 million in annual gross revenue. On the analytics
              infrastructure layer, Voodoo relies on GameAnalytics PipelineIQ Pro across its studio network to evaluate
              thousands of candidate prototypes and track performance across its player base. Nevertheless, Voodoo faces
              substantial platform and concentration vulnerabilities. Credit rating evaluations by Fitch Ratings on Stan
              Holding SAS (maintaining a 'B' Long-Term Issuer Default Rating on Rating Watch Negative in March 2025)
              highlight structural customer-acquisition risks arising from Apple's App Tracking Transparency (ATT) and
              privacy policy changes. Because Voodoo relies almost entirely on Apple's App Store and Google Play for
              digital distribution and user acquisition, elevated CPIs compress margins and increase customer
              acquisition friction. Furthermore, the acquisition of BeReal for €500 million in 2024 exposes the company
              to an unmonetised social app user base where user retention and ad monetisation remain unproven,
              potentially diluting cash generation.
            claimRefs:
              - CU004
              - CU011
