chapter:
  number: 5
  title: "Product & Technology"
  summary: "Voodoo operates an industrialized mobile gaming and consumer app engine that has transitioned from ad-supported hyper-casual titles to hybrid-casual games and social apps. Its proprietary tech stack combines Unity client SDKs, GameAnalytics testing, and automated UA infrastructure, though the company faces structural platform dependencies and BeReal integration overhead."
sections:
  - id: "product-portfolio-and-hybrid-casual-migration"
    title: "Product Portfolio and Hybrid-Casual Migration"
    body: "Voodoo has restructured its mobile entertainment portfolio around an industrialized development methodology that tests thousands of concepts annually to identify scalable hits. Historically reliant on pure hyper-casual titles monetized through interstitial advertisements, the company executed a strategic pivot between 2021 and 2024 toward hybrid-casual games featuring deeper progression loops, meta-mechanics, and in-app purchase systems. By 2024, hyper-casual games represented only 22% of total revenue, down from 100% in 2021, while in-app purchases expanded to 45% of total turnover. Flagship hybrid-casual titles such as Mob Control demonstrate substantial revenue durability, generating between $20 million and $100 million in annual gross revenue. Simultaneously, Voodoo expanded into consumer social applications through its €500 million acquisition of photo-sharing network BeReal in June 2024, diversifying its digital footprint beyond gaming into authentic communication networks."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"
      - "CE008"
      - "CE010"
    tableRefs:
      - "TE001"
  - id: "publishing-funnel-and-prototyping-workflow"
    title: "Publishing Funnel and Prototyping Workflow"
    body: "Voodoo's core operational engine functions as a high-velocity publishing funnel that evaluates external and in-house game prototypes against strict empirical hurdle rates. Rather than spending months handcrafting game assets, developers produce weekly minimal viable prototypes focused exclusively on core mechanics. Voodoo integrates GameAnalytics telemetry directly into every prototype build to track early engagement, systematically eliminating approximately 19 out of every 20 tested titles if retention metrics fail to clear internal benchmarks. For hybrid-casual titles, the company targets baseline retention hurdles of at least 45% Day 1 retention, 15% Day 7 retention, and 10% Day 30 retention before committing growth capital. Once a prototype validates its commercial equation, dedicated live-ops teams assume operational management, deploying recurring events, progression layers, and economy balance to extend title longevity across its catalog of over 8 billion cumulative downloads."
    claimRefs:
      - "CE001"
      - "CE006"
      - "CE007"
      - "CE014"
    tableRefs:
      - "TE002"
  - id: "core-technology-stack-and-operating-architecture"
    title: "Core Technology Stack and Operating Architecture"
    body: "The technical operating architecture supporting Voodoo's publishing ecosystem relies on a modular client-server infrastructure designed for automated scaling. External partner studios receive a unified SDK package that standardizes ad mediation, telemetry reporting, remote configuration, and in-app purchase inventory controls within Unity game projects. On the growth infrastructure layer, Voodoo deploys its proprietary Bidshake marketing automation suite, which generates over 25,000 ad creatives annually and automates bidding across global ad networks. This engine feeds into an internal ad network that routes more than 250 billion impressions each year. Backend scalability and quality assurance are reinforced through infrastructure partnerships, including an August 2025 collaboration with Tencent Cloud and WeTest to provide automated cross-device compatibility testing and optimized cloud hosting for global multi-region deployments."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE009"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "platform-dependencies-and-technical-risks"
    title: "Platform Dependencies, Privacy Enforcement, and Technical Risks"
    body: "Despite its operational scale, Voodoo's technology and monetization model face severe structural vulnerabilities arising from platform dependency and post-acquisition integration hurdles. Mobile game distribution and monetization remain entirely beholden to Apple's App Store and Google Play ecosystems. Platform-level privacy restrictions, particularly Apple's App Tracking Transparency enforcement, have permanently impaired ad attribution, inflating customer acquisition costs across hyper-casual and hybrid genres. Furthermore, credit rating assessments from Fitch Ratings emphasize that while hybrid casual diversification improved margin visibility, near-term debt maturity risks and ongoing losses from integrating BeReal constrain financial flexibility. Voodoo responded to BeReal's operational integration by laying off 28 engineering, QA, and marketing staff, highlighting the technical and cost challenges of pivoting an unmonetized social application toward profitability."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
