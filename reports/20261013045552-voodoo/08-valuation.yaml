      - ["Base Case", "Gaming revenue grows 6%-10%; BeReal remains moderate cash drag through 2026; €175M+ refinancing stabilizes liquidity.", "$1.6B-$1.9B valuation (8x-10x EBITDA on €140M-€150M normalized EBITDA); flat to modest return vs 2021 GBL mark.", "Refinancing cost inflation; higher user acquisition costs; casual competition from Supercell and King.", "55% (aligned with Fitch baseline revenue trajectory)"]
