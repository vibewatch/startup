callouts:
  - calloutType: "recommendation"
    title: "Disciplined Stance on Stretched Valuation"
    body: "Given the unverified nature of private EBITDA disclosures, persistent refinancing exposure flagged by Fitch Ratings on Stan Holding SAS's debt, and the unproven monetization model of the €500 million BeReal acquisition, Voodoo warrants a disciplined track recommendation rather than a buy at historical round multiples."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV006"
      - "CV009"
  - calloutType: "risk"
    title: "Execution Headwinds and Debt Refinancing"
    body: "While management reported €135 million in EBITDA for 2024, Fitch Ratings estimates credit-adjusted EBITDA at €71 million and maintains a Rating Watch Negative status on the EUR220 million term loan B, underscoring material refinancing and cash absorption risks as BeReal integration continues."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV004"
      - "CV006"
