callouts:
  - calloutType: "insight"
    title: "The Strategic Pivot from Ad Viewers to Paying Customers"
    body: "Voodoo's transition from 100% ad-based hyper-casual revenue in 2021 to 45% in-app purchase revenue in 2024 marks a structural transformation in its customer economics. By introducing metagame mechanics and live-ops to titles like Mob Control, the company increased day-7 retention to over 15% and secured revenue recurrence, with 80% of 2024 revenue generated by titles older than two years."
    claimRefs:
      - "CU004"
      - "CU010"
      - "CU011"
      - "CU014"
  - calloutType: "risk"
    title: "Platform Dependence and Credit Rating Vulnerabilities"
    body: "Despite robust operating growth, Voodoo remains heavily constrained by its near-total dependence on Apple and Google for user acquisition and payment processing. Fitch Ratings maintained Stan Holding SAS on Rating Watch Negative due to high refinancing risks surrounding its €220 million term loan, while Apple's privacy policy tightening continues to exert structural upward pressure on mobile customer acquisition costs."
    claimRefs:
      - "CU014"
      - "CU015"
      - "CU016"
