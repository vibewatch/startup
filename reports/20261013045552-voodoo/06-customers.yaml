company:
  name: "Voodoo"
chapter:
  number: 6
  title: "Customers"
  summary: "Voodoo's customer base is structurally bifurcated between a massive consumer audience of 150 million monthly active users across 250 countries and a B2B partner network of over 150 external studios whose prototypes fuel its publishing pipeline. The company has orchestrated a multi-year transition away from hyper-casual ad dependency toward hybrid-casual in-app purchases, expanding IAP to 45% of 2024 revenue while 80% of earnings now stem from titles live over two years. However, platform privacy tightening on iOS, rating agency negative credit watches reflecting heavy leverage and thin free cash flow, and execution opacity surrounding consumer monetisation in social acquisitions like BeReal maintain elevated concentration and durability risks."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Commercial Model"
    body: "Voodoo operates an unusual multi-sided commercial architecture in mobile gaming and consumer applications. On the consumer side, the company entertains an audience generating over 150 million monthly active users across more than 250 countries, with total lifetime portfolio downloads exceeding 8 billion. Historically, hyper-casual consumer users were non-paying audience units monetised exclusively through ad impressions (interstitial, rewarded, and banner formats), which represented 100% of revenue in 2021. Following structural platform privacy headwinds, Voodoo shifted toward hybrid-casual titles such as Mob Control and Collect Em All!, where players engage with deeper metagames and recurring in-app purchase (IAP) economies. By 2024, in-app purchases accounted for 45% of total corporate revenues, transforming mobile players into paying transactors. On the supply side, Voodoo functions as a publishing platform and technology partner for over 150 independent mobile game studios. These external partner studios serve as Voodoo's B2B customer base, licensing or co-developing game prototypes in exchange for publishing, user acquisition financing, analytics tooling, and revenue-sharing support."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-durability"
    title: "Adoption Trajectory, Retention Dynamics, and Revenue Durability"
    body: "Voodoo's user adoption trajectory demonstrates immense aggregate volume coupled with fundamental changes in cohort retention. The company generated 950 million downloads in 2024, maintaining its position as the third-to-fifth largest mobile publisher globally by volume behind Google, Meta, and ByteDance. The durability of its revenue model has strengthened materially as games mature: in 2024, nearly 80% of Voodoo's €623 million in revenue was generated by titles that had been on the market for more than two years, led by long-running titles such as Mob Control, Hole.io, and Paper.io 2. This shift contrasts sharply with early hyper-casual industry dynamics, where games experienced rapid decay within weeks of launch. To maintain this durability, Voodoo enforces strict quantitative retention thresholds across its testing pipelines, screening studio prototypes through automated analytics to track day-1 and day-7 retention, playtime, and cost per install (CPI). Hybrid-casual titles require minimum core day-7 retention of 15% (and 20% for puzzle mechanics) alongside day-1 retention above 45% before receiving commercial greenlights."
    claimRefs:
      - "CU002"
      - "CU004"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
  - id: "named-deployments-and-platform-risks"
    title: "Named Studio Deployments, Platform Friction, and Concentration Exposure"
    body: "Proof of commercial adoption spans both top-performing gaming franchises and external technology deployments. Core hybrid-casual hits demonstrate significant individual revenue scale: titles like Mob Control have generated between $20 million and $100 million in annual gross revenue. On the analytics infrastructure layer, Voodoo relies on GameAnalytics PipelineIQ Pro across its studio network to evaluate thousands of candidate prototypes and track performance across its player base. Nevertheless, Voodoo faces substantial platform and concentration vulnerabilities. Credit rating evaluations by Fitch Ratings on Stan Holding SAS (maintaining a 'B' Long-Term Issuer Default Rating on Rating Watch Negative in March 2025) highlight structural customer-acquisition risks arising from Apple's App Tracking Transparency (ATT) and privacy policy changes. Because Voodoo relies almost entirely on Apple's App Store and Google Play for digital distribution and user acquisition, elevated CPIs compress margins and increase customer acquisition friction. Furthermore, the acquisition of BeReal for €500 million in 2024 exposes the company to an unmonetised social app user base where user retention and ad monetisation remain unproven, potentially diluting cash generation."
    claimRefs:
      - "CU004"
      - "CU011"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
