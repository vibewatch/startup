              - CV041
      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Three scenarios frame the range of credible outcomes for a $25B Series C investor over a 4–5 year horizon
              to 2029–2030. The bull scenario requires Reflection to ship a commercially competitive frontier model in
              H2 2026, close the Series C at $25B, and convert the government and enterprise pipeline to $2B+ ARR by
              2030. At 30x forward revenue, that implies $60B–$120B enterprise value—a 2.4x–4.8x return at the Series C
              entry price. The base scenario assumes the Series C closes (possibly at a reduced pre-money), a model
              ships in Q1 2027, and sovereign AI revenues ramp to $750M–$1B ARR by 2029, yielding a $15B–$35B enterprise
              value at 20–25x— approximately flat to the Series C entry price. The bear scenario involves either a
              Series C funding failure, a model that ships significantly behind schedule, or open-weight commoditization
              that undercuts Reflection's value proposition; in this case, a down-round at $5–8B or a distressed sale
              represents the expected floor.

              The valuation sensitivity figure (FV002) shows the revenue needed to justify various market-clearing
              multiples at the Series C entry price. Revenue below $833M at a 30x multiple fails to justify the $25B
              mark on fundamentals. The return range figure (FV003) visualizes outcomes across the three scenarios. The
              probability signals most relevant to tracking the scenarios: Series C closure date and terms; first model
              benchmark release; first government contract with disclosed revenue; and quarterly compute burn versus
              revenue ramp ratio.
            claimRefs:
              - CV042
              - CV043
              - CV044
