      - number: '4.3'
        title: Cost Structure and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Reflection AI's cost structure is compute-dominated. The SpaceX agreement starting July 1, 2026 commits
              the company to $150M per month for Nvidia GB300 chip access at Colossus 2 near Memphis, Tennessee — $1.8B
              annually from a single vendor contract. This is the single largest disclosed operational cost commitment
              for any startup without a live commercial product in recent AI history. Either party may exit with 90
              days' notice after the first three months, limiting the legally committed exposure, but the strategic
              intention is a multi-year compute position through 2029.

              Prior to the SpaceX deal, compute was sourced through GMI Cloud's U.S.-based GPU clusters (announced
              November 2025) and undisclosed predecessor arrangements. Talent costs for approximately 200 senior AI
              researchers and engineers — drawn from DeepMind, OpenAI, and elite academic labs — at typical frontier AI
              fully-loaded compensation of $400K–$700K per head runs an estimated $80M–$140M annually. Three-office
              operations (New York, San Francisco, London) add further overhead. Total pre-SpaceX operating burn is
              estimated at $20–45M per month; post-SpaceX, estimated monthly burn rises to $165–200M.

              Gross margin cannot be computed pre-revenue. At scale, open-weight AI licensing carries structurally high
              potential gross margins (80–90% is typical for pure software licensing) but would be materially compressed
              by ongoing compute obligations and the service-delivery costs of sovereign AI engagements. Capital
              intensity is among the highest observed in venture-backed software — more analogous to infrastructure or
              semiconductor development than to SaaS.
