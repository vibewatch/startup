              As of June 2026, Reflection AI has no publicly disclosed paying enterprise customers for Asimov, no
              commercial ARR, and no retention metrics. The $25 billion valuation is supported entirely by government
              strategic designations, investor strategic interest, and founder pedigree—not by a demonstrated commercial
