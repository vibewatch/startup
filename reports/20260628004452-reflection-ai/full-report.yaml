      - number: '5.2'
        title: Technical Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Asimov's core technical design is a retriever-combiner multi-agent architecture. Multiple small
              long-context retriever agents scan discrete data sources simultaneously—one might parse a Go module graph
              while another reads recent Slack migration discussions. These agents operate in separate context windows,
              allowing the system to process far more material than any single model could hold. The outputs of all
              retrievers flow to a single short-context combiner agent that synthesizes the distilled signal into a
              coherent answer. By keeping the combiner's context focused on extracted signal rather than raw source
              material, Asimov concentrates reasoning capacity where it matters. This parallelized retrieval
              architecture is architecturally distinct from single-model agentic coding tools such as Claude Code or
              Cursor, which use a generation-first loop within a shared context window. Asimov currently uses
              third-party foundation models for both retriever and combiner roles; Reflection states it is actively
              training proprietary models to replace them.

              Reflection's frontier model training platform is built on a large-scale LLM and reinforcement learning
              stack designed to train massive Mixture-of-Experts models at what the company describes as frontier scale.
              MoE architecture routes input tokens to specialized expert sub-networks, enabling frontier capability at
              reduced per-inference compute. The RL training methodology draws on the team's deep experience producing
              AlphaGo, AlphaZero, MuZero, PaLM, Gemini 1 and 1.5, and AlphaCode 2. Reflection uses human annotators and
              synthetic example generation to produce training data and states that no customer code or private
              communications enters the external training corpus. The company's GitHub organization contains forks of
              microsoft/playwright, web-arena-x/webarena, and openai/codex, indicating internal research tooling
              interest, but no original model weights, training code, or published papers have been released.
