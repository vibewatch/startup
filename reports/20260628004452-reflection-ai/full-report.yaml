      - number: '7.2'
        title: Regulatory, Legal, and Export-Control Risk
        blocks:
          - type: paragraph
            body: >-
              The June 2026 U.S. Commerce Department/BIS export-control action against Anthropic's Fable 5 and Mythos 5
              models is the defining regulatory risk precedent for Reflection AI. That action — the first time a live
              commercial AI model was disabled by U.S. export-control authority — demonstrated that BIS can require a
              company to globally disable its models without public court proceedings, on the basis of a classified
              national-security assessment. Reflection, which holds a Pentagon IL6/IL7 classified networks agreement
              signed in May 2026, operates in the same regulatory perimeter. While Reflection's positioning as an
              open-weight, sovereign-AI provider partly insulates it against closed-API restrictions, open-weight
              releases are themselves becoming a flashpoint: published weights cannot be recalled once distributed,
              meaning a misuse event or capability threshold crossing could trigger regulatory scrutiny that is
              structurally harder to remediate than a closed model withdrawal.

              The EU AI Act is fully operative for General Purpose AI (GPAI) systems as of August 2, 2026, introducing
              mandatory transparency, technical documentation, and incident reporting obligations for any frontier model
              distributed in or accessible from the EU. Fines reach €35M or 7% of global turnover. Reflection has not
              publicly disclosed an EU AI Act compliance program; the company's weights-released-without-training-code
              approach creates a compliance ambiguity: it may qualify for open-source carve-outs on some dimensions
              while falling under GPAI obligations on others. Enforcement risk is heightened by Reflection's bilateral
              sovereign-AI engagements (South Korea under the U.S. AI Exports Program), which span multiple regulatory
              jurisdictions simultaneously.

              Training-data copyright litigation is the third regulatory vector. Over 70 AI copyright lawsuits are
              active in the U.S. as of early 2026, with total claimed damages exceeding $50B. The Bartz v. Anthropic
              $1.5B settlement has established a per-work pricing benchmark ($3,113/book) and has been treated as a
              replicable litigation playbook by music publishers and news organizations. Reflection has disclosed no
              training data provenance certification, no licensing agreements for copyrighted content, and no settlement
              reserves. A single successful claim by a large rights holder could impose a settlement cost commensurate
              with a full funding round at current benchmark rates.

              Export controls on AI model weights and outputs are an emerging fourth risk. The Just Security analysis
              (2026) and SIPRI backgrounder both identify U.S. EAR and Wassenaar Arrangement controls as being actively
              extended toward AI models with dual-use capabilities. Reflection's sovereign-AI focus — explicitly
              targeting governments and militaries — places it in the highest-scrutiny tier under dual-use export
              control frameworks. Any misuse event involving Reflection-released weights in a sanctioned jurisdiction or
              by a restricted end-user could trigger an enforcement action under the Export Administration Regulations.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
