  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing
        blocks:
          - type: paragraph
            body: >-
              Reflection AI's revenue model is pre-commercial as of the report date. No frontier product has shipped and
              no revenue has been publicly confirmed. The declared commercial thesis targets two broad segments. First,
              large enterprises — seeking open-weight AI with full audit trails, infrastructure portability, and cost
              control — would license Reflection's models and pay for custom fine-tuning, inference API access, or
              on-premises deployment contracts. CEO Misha Laskin has explicitly stated that at scale enterprises "want
              something you will have ownership over" and frames this as the primary addressable market. Second,
              sovereign governments and national institutions require AI they can inspect, modify, and operate on
              domestic infrastructure without dependency on closed U.S. or Chinese providers — a niche elevated by White
              House AI policy and geopolitical tensions with China.

              Revenue recognition at commercialization would likely follow software license and subscription models.
              Enterprise open-weight licenses typically combine a one-time deployment fee with recurring support,
              fine-tuning, and SLA contracts. Sovereign AI engagements — notably the South Korea joint venture with
              Shinsegae Group — would generate revenue through JV equity participation, data center operation fees, and
              model customization services. List pricing for any product has not been disclosed; any pricing estimates
              in this chapter are structural inferences, not company-stated figures. The company's definition of "open"
              is weights-available only — training data and pipelines remain proprietary — which creates an enterprise
              support moat but limits true open-source comparisons.
            claimRefs:
              - CI015
