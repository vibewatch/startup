      - number: '2.3'
        title: Buyer and Segment Dynamics
        blocks:
          - type: paragraph
            body: |
              Reflection AI addresses three primary buyer archetypes, each with distinct budget
              ownership, procurement triggers, and contracting dynamics.

              Large Enterprises (1,000+ employees) in regulated sectors represent the primary near-term
              commercial opportunity. Financial services leads AI adoption at 87%, followed by technology
              (85%), healthcare (74%), and manufacturing (68%). These buyers prioritize model customization,
              infrastructure control, and cost predictability over closed-model convenience. As CEO Misha
              Laskin stated publicly, large enterprises "paying some ungodly amount of money for AI" want
              to own, customize, and optimize models for their specific workloads—a value proposition
              only open models can satisfy. Budget ownership typically sits with the CTO or CISO for
              infrastructure decisions, with business unit heads controlling application-layer spend.
              Enterprise AI budgets averaged $11.6M in 2026, up 65% year-over-year.

              The Sovereign AI / Government Segment is Reflection AI's most differentiated and highest-
              barrier opportunity. A June 2026 IDC survey commissioned by Dell found 52% of government
              leaders plan sovereign AI investments within 12-18 months, and 73% of enterprise IT
              decision-makers are actively implementing or piloting sovereign AI capabilities (Omdia).
              This segment operates on multi-year framework contracts with ministry-level procurement
              approvals; Reflection's DOE Genesis Mission partnership (announced May 2026) represents
              the prototypical commercial entry point. McKinsey estimates up to 40% of global AI spending
              may be shaped by sovereignty requirements.

              The Developer and Research Community adopts Reflection AI's model weights freely, driving
              ecosystem adoption, benchmarking visibility, and talent pipeline signal. This segment does
              not generate direct revenue under Reflection's current model, but it is critical for
              market penetration and competitive positioning against Meta, Mistral, and DeepSeek.

              SMBs (under 500 employees) show only 42% AI adoption versus 78% for enterprises, reflecting
              data, talent, and budget constraints that make them poor near-term foundation model customers
              despite their aggregate market size.
