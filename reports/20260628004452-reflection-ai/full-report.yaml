      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >-
              Reflection's partner portfolio creates concentrated single-point dependencies at every level of the value
              chain. At the compute layer, SpaceX is the sole training-infrastructure provider. At the chip layer,
              Nvidia is simultaneously a $800M equity investor and the exclusive hardware vendor at Colossus 2. At the
              government channel layer, the U.S. AI Exports Program and the South Korea-Shinsegae JV are the primary
              articulated commercialization paths, and both are unproven contracts with no confirmed revenue. At the
              defense layer, the Pentagon classified-network agreements are not quantified in contract value or
              deployment timeline, and the Anthropic precedent shows that government AI relationships can be withdrawn
              rapidly on security grounds.

              The Shinsegae JV, targeting a 250MW sovereign AI data center in South Korea, is contingent on Korean
              government approvals, U.S. AI Exports Program eligibility (which is geopolitically dependent on ongoing
              Korea-US relations), Shinsegae's own capital execution capacity, and Reflection shipping a model that
              South Korean government clients are willing to deploy. Any one of these dependencies failing delays or
              eliminates Reflection's first major international revenue event. The JV is denominated in long-duration
              capital commitments (data center construction), not in immediate software licensing revenue, meaning the
              revenue ramp is inherently back-weighted.

              The GMI Cloud partnership (November 2025) provides inference distribution but is a non-exclusive
              arrangement with no disclosed revenue commitment. The DoE Genesis Mission partnership provides legitimacy
              and potentially R&D co-funding, but sovereign research partnerships are subject to budget cycles,
              administration changes, and programmatic reviews that could delay or terminate them without notice.
              Concentration in government and sovereign partners creates a correlated risk: a shift in U.S. AI export or
              national security policy could simultaneously impair the South Korea JV, Pentagon contracts, and DoE
              partnership in a single policy cycle.
