      - number: '1.2'
        title: Founders, Leadership, and Key-Person Risk
        blocks:
          - type: paragraph
            body: >
              Reflection AI was co-founded by Misha Laskin and Ioannis Antonoglou, two researchers from the frontier of
              Google DeepMind's AI program. Laskin serves as CEO and has a theoretical physics PhD from the University
              of Chicago, completed postdoctoral reinforcement learning research at UC Berkeley, and before founding
              Reflection was a Staff Research Scientist at Google DeepMind where he led reward modeling for the Gemini
              project. He also founded Claire AI, a Y Combinator-backed startup focused on retailer product demand
              prediction, giving him operational startup experience beyond research.

              Antonoglou serves as CTO and President. He was DeepMind's sixth-ever researcher, making him one of the
              original architects of DeepMind's research culture. He is best known for co-creating AlphaGo, the first AI
              system to defeat a human world champion at the board game Go in 2016, and for subsequent work on AlphaZero
              and MuZero. His expertise in reinforcement learning and large-scale RL systems is directly relevant to
              Reflection's model strategy. The company's research page lists contributions to Deep Q Networks (2015),
              AlphaGo (2016), AlphaZero (2017), MuZero (2019), PaLM (2022), GPT-4 (2023), Gemini 1 (2023), AlphaCode 2
              (2023), Gemini 1.5 (2024), and Gemini 2.5 (2025) across the collective team.

              Key-person risk is high for both founders. Laskin is the primary investor-facing CEO and public voice;
              Antonoglou owns the core technical vision. Board composition and governance structure are not publicly
              disclosed, which is a material diligence gap. No material leadership changes or departures have been
              identified in public sources as of the run date.
