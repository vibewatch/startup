      - number: '8.3'
        title: Financing Context and Cap-Table Overhang
        blocks:
          - type: paragraph
            body: >-
              Reflection AI has raised $2.13B+ through the October 2025 Series B, with a separate data point of $3B
              including an intermediate September 2025 close. If the Series C closes at $2.5B, total raised reaches
              approximately $4.6B—making Reflection one of the most heavily funded pre-revenue AI startups on record.
              The investor pool spans strategics (Nvidia: $800M), institutional VC (Sequoia, Lightspeed, DST Global, B
              Capital, CRV), sovereign/government-adjacent capital (GIC Singapore), and growth/crossover investors
              (Disruptive AI, 1789 Capital, Eric Schmidt, Eric Yuan, Citigroup, JPMorgan's Security and Resiliency
              Initiative).

              Cap-table and liquidation preference details are not disclosed, representing a material diligence gap.
              Standard Series B documents for a $2B raise at $8B post-money typically carry 1x non-participating
              liquidation preferences with anti-dilution provisions; participating preferred structures—increasingly
              common at extreme valuations—could absorb a disproportionate share of exit proceeds in a moderate or
              down-round scenario, leaving Series C investors and common holders behind. Multiple secondary-market SPV
              filings in May–June 2026 (HII Reflection AI Series I; ID8 Growth Opportunities Reflection AI) confirm
              institutional demand at valuations consistent with the $8–25B primary range, and imply that secondary
              prices have not collapsed despite no commercial product shipping.

              The AI startup multiple compression phenomenon documented in Q1 2026 Finro data—median Series B multiples
              of 39–41x compressing to 26x at Series C for frontier AI agents—suggests that even the stated $25B Series
              C would price Reflection at well above the market-clearing frontier multiple if applied to any plausible
              near-term revenue estimate. Without revenue, the multiple is technically undefined; the valuation is
              entirely optionality-priced. Investors must evaluate the $25B against strategic entry price, not a
              fundamental revenue multiple.
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
