      - number: '3.5'
        title: Moat Durability, Lock-in, and Displacement Risk
        blocks:
          - type: paragraph
            body: >-
              Open-weight model weights alone provide minimal durable moat: any sufficiently resourced actor can fork,
              fine-tune, or distill a published model into a competing product within weeks. Durable moats in the
              open-weight AI market migrate to compute access (scale of pretraining), proprietary fine-tuning data, RLHF
              pipelines, downstream tooling and orchestration, and brand trust with government and enterprise buyers.
              Reflection AI's $6.3 billion SpaceX compute contract—$150 million per month for Nvidia GB300 chips at
              Colossus 2 through 2029—secures frontier-scale compute access, though its allocation is significantly
              smaller than Anthropic's $1.25 billion and Google's $920 million per month at the same facility. Nvidia's
              cross-investment across OpenAI, Anthropic, Reflection AI, and Mistral ensures chip supply relationships
              but also means Nvidia is funding all sides simultaneously. The most credible adverse evidence is Forbes'
              characterization of Reflection AI as "a lab that has not shipped": it has committed $1.8 billion annually
              in compute before any public model or revenue stream exists. The 90-day exit clause in the SpaceX contract
              is a partial mitigation, but the capital burn before commercial traction creates serious execution risk.
              DeepSeek's cost advantage ($0.87 per million output tokens versus hundreds of dollars for on-premises
              closed alternatives) creates commoditization pressure on any premium pricing Reflection might attempt. The
              security concerns around Chinese-origin open-weight models—including Cisco's identification of algorithmic
              jailbreak vulnerabilities in DeepSeek R1—are the primary demand driver for Reflection AI's sovereign
              positioning, but sustained policy alignment and government procurement cycles cannot be assumed. Switching
              costs between open-weight models are low at the weight level but materially higher once a customer has
              built fine-tuning pipelines, orchestration logic, and compliance frameworks around a specific model
              family.
