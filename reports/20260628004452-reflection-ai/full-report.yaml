      - number: '8.6'
        title: Exit Readiness and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Reflection AI is not IPO-ready as of June 2026. A public market exit requires GAAP-audited financials,
              disclosed revenue, demonstrable customer traction, and a clear path to profitability or at minimum a
              credible roadmap—none of which exist in public evidence. Given that Anthropic and OpenAI filed IPO
              documents in June 2026 after reaching $47B and $20B+ ARR respectively, the precedent is clear: frontier AI
              labs go public on revenue, not narrative. The most likely exit path for Reflection AI within 5 years is a
              strategic acquisition by a hyperscaler (Google, Amazon, Microsoft), a defense/national security prime
              contractor (Anduril, Palantir), or a sovereign-adjacent institution—scenarios where the strategic premium
              for team, training infrastructure, and government relationships could justify the $8–25B range even
              pre-revenue. The Cohere/Aleph Alpha merger at $20B combined provides the nearest analog: two sovereign AI
              companies with disclosed revenue creating a transatlantic platform through M&A rather than IPO.

              Secondary market SPV activity (three Form D filings in 2025–2026) confirms that institutional buyers are
              pricing the equity at the primary market range, providing a floor estimate, but secondary prices are not
              equivalent to IPO or M&A exit prices.
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
