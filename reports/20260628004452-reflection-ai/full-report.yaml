            body: >-
              Reflection AI's go-to-market motion is direct enterprise and government sales, amplified by strategic
              institutional channel leverage from Nvidia. Nvidia's $800M direct investment in the Series B is not
              passive capital; it signals preferential compute allocation, chip access priority, and potential ecosystem
