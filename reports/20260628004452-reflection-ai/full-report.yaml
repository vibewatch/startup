      - number: '1.4'
        title: Products, Technology Stack, and Market Traction
        blocks:
          - type: paragraph
            body: >
              Reflection AI's first product is Asimov, a multi-agent code comprehension tool that launched publicly in
              July 2025. Unlike standard code generators, Asimov is designed to ingest entire codebases, architecture
              documentation, GitHub threads, Slack messages, emails, and project history to build persistent
              organizational memory for engineering teams. The system uses a retriever-combiner multi-agent
              architecture: many small long-context retrieval agents collect relevant fragments from large codebases and
              pass them to a single large reasoning agent that synthesizes a coherent answer. Asimov deploys within
              customer virtual private clouds, keeping all data inside customer infrastructure.

              In a company-conducted blind survey, developers working on large open-source projects preferred Asimov
              answers 82% of the time versus 63% for Anthropic's Claude Code. However, MIT computer scientist Daniel
              Jackson cautioned that the benefits of this approach remain unproven by broad independent research and
              that the system could increase computation costs and create security risks from reading private
              communications. This constitutes a material adverse signal for product claims validation. The current
              release of Asimov uses third-party open-source models; Reflection is training its own models to eventually
              power Asimov and planned frontier releases.

              The company has built a large-scale LLM and reinforcement learning platform capable of training
              Mixture-of-Experts models at frontier scale—a capability previously limited to the largest closed AI labs.
              No public frontier open-weight model has been released as of June 28, 2026. The planned frontier model is
              expected to be trained on tens of trillions of tokens, with release anticipated later in 2026.
            claimRefs:
              - CO027
              - CO028
