      - number: '1.3'
        title: Capital Base, Investors, and Funding History
        blocks:
          - type: paragraph
            body: >
              Reflection AI has executed three disclosed funding rounds in rapid succession. The company emerged from
              stealth in March 2025 with $130 million in financing: a $25 million seed round and a $105 million Series
              A, valuing the company at approximately $545 million. Seven months later, on October 9, 2025, the company
              closed a $2 billion Series B led by Nvidia, which reportedly invested approximately $800 million. The
              Series B valued the company at $8 billion—a 15x step-up from the Series A valuation in a single
              fundraising cycle, one of the largest valuation leaps in recent AI startup history.

              Series B investors include Nvidia, Eric Schmidt (former Google CEO), Citigroup, 1789 Capital (the venture
              firm linked to Donald Trump Jr.), Lightspeed Venture Partners, Sequoia Capital, DST Global, B Capital,
              CRV, Disruptive, GIC, and Eric Yuan (Zoom CEO). Earlier backers included LinkedIn co-founder Reid Hoffman
              and Meta executive Alexandr Wang. Wilson Sonsini Goodrich & Rosati served as legal counsel on the Series
              B. Total capital raised across all rounds is approximately $2.13 billion.

              By early March 2026, Reflection was reported by ROIC and the Financial Times to be in discussions at a
              valuation exceeding $20 billion. By late March 2026, the Wall Street Journal reported discussions for a
              $2.5 billion raise at a $25 billion pre-money valuation with potential JPMorgan participation through its
              Security and Resiliency Initiative. These discussions have not been confirmed as a closed round as of the
              run date. The pace of valuation escalation—from $545 million in March 2025 to a reported $25 billion
              target in March 2026, a roughly 46x increase in twelve months—reflects the intensity of investor
              enthusiasm for frontier AI and the specific geopolitical premium attached to Reflection's open-source-U.S.
              positioning.
