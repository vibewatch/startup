      - number: '3.2'
        title: 'Closed-Source Frontier Labs: OpenAI, Anthropic, and Google'
        blocks:
          - type: paragraph
            body: >-
              OpenAI is the dominant commercial AI platform, reaching annualized revenue exceeding $20 billion in 2025,
              with over 800 million weekly active users and adoption across 92% of Fortune 500 companies. GPT-5,
              launched in August 2025, is priced at $1.25 per million input tokens and $10 per million output tokens;
              the o3 reasoning model is priced at $2.00 input and $8.00 output per million tokens. OpenAI's enterprise
              business plan starts at $20 per user per month (Business tier) with custom pricing for enterprise-scale
              contracts. The company raised $40 billion at a $300 billion valuation in March 2025 and subsequently
              reached a $500 billion valuation following a secondary share sale. OpenAI's distribution moat—ChatGPT
              consumer mindshare, Azure OpenAI Service, and Microsoft Copilot—is structurally difficult for any
              standalone lab to replicate. OpenAI has also begun releasing its first open-weight models under
              API-accessible pricing, signaling defensive acknowledgment of the open-weight threat. Anthropic has grown
              faster than any comparable AI company, filing for an IPO at a $965 billion valuation in June 2026 after
              closing a $65 billion Series H in May 2026 and a $30 billion Series G in February 2026. Sacra estimated
              annualized revenue at $47 billion as of May 2026—up from $9 billion at end-2025. Claude Code alone
              generates $2.5 billion in annualized revenue, with 29 million daily installs on VS Code. Anthropic has
              over 300,000 business customers and more than 1,000 spending over $1 million annually; eight of the
              Fortune 10 are now Claude customers. Claude Opus 4.6 is priced at $5 per million input tokens and $25 per
              million output tokens. The U.S. government's ban on Anthropic's Fable 5 and Mythos 5 closed models in
              mid-2026 directly prompted enterprises and governments to reassess exclusive dependence on closed AI,
              creating the single most important structural catalyst for open-weight providers like Reflection AI.
              Google DeepMind's Gemini family is deeply embedded in Google Workspace and Android, providing a
              distribution advantage of hundreds of millions of existing enterprise users that no standalone AI lab can
              match. Gemini 2.5 Pro is priced at approximately $1.25 per million input tokens and $10 per million output
              tokens, and Google has committed $920 million per month to SpaceX Colossus for additional compute capacity
              while its own data centers scale.
