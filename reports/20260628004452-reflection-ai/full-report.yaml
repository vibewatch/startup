  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: |
              The market relevant to Reflection AI encompasses three overlapping spend pools: (1) open
              foundation model licensing, enterprise support contracts, and fine-tuning services built
              around freely distributed model weights; (2) sovereign AI model infrastructure for
              governments and regulated industries requiring data residency, explainability, and national
              control over model parameters; and (3) AI-assisted software development tooling, anchored
              today by Reflection's Asimov coding-agent API and expanding toward general agentic reasoning.

              Excluded from the primary addressable market are hyperscaler IaaS/GPU cloud revenue (which
              underpins model delivery but flows directly to AWS, Azure, and GCP), closed-model API
              services from OpenAI, Google, and Anthropic (direct substitutes that define the alternative
              choice, not a revenue pool for Reflection), and downstream application-layer SaaS products
              that embed AI as a feature rather than purchasing model services directly.

              Status-quo substitutes buyers face include: closed-model API access (lowest friction,
              highest vendor lock-in risk), self-hosting existing open models (Meta Llama 4/5, Mistral
              Large 3, DeepSeek V3/V4), fine-tuning a base model via a hyperscaler marketplace, or
              traditional rule-based software automation. For sovereign governments, the alternatives are
              non-adoption or costly internal model development programs.

              Adjacent markets—software development automation tooling, national AI strategy platforms,
              and enterprise MLOps infrastructure—represent both future revenue adjacencies and early
              entry points into Reflection AI's commercial pipeline.
            claimRefs:
