      - number: '8.5'
        title: Comparable Valuation Set
        blocks:
          - type: paragraph
            body: >-
              The comparable set spans four categories: closed-source frontier labs (Anthropic, OpenAI), open-weight
              challengers (Mistral AI, xAI pre-merger), enterprise sovereign AI platforms (Cohere, Cohere+Aleph Alpha),
              and pure sovereign AI government platform companies (Dream). Anthropic's IPO filing at $965B on $47B ARR
              (approximately 20x) and OpenAI's at $852B on $20B+ ARR (approximately 42x) anchor the high end of the
              range; both have disclosed, multi-billion-dollar revenue bases that Reflection lacks entirely. The most
              direct comparable is Mistral AI: open-weight, similar sovereign AI thesis, and raising at approximately
              €20B on $400M ARR—a 50x ARR multiple that still implies Reflection's $25B mark requires $500M ARR at the
              same multiple just to reach parity. Cohere, with $240M ARR at a $7B valuation (29x), is an equally
              instructive comp: it trades at less than one-third of Reflection's Series B valuation with actual
              commercial proof.

              Dream's $3B valuation on approximately $300M in contracted revenue (10x revenue multiple) establishes the
              sovereign AI government platform premium in its purest form and sets a benchmark: $2.5B in contracted
              sovereign revenue would be needed just to justify the $25B mark at Dream's multiple. xAI's pre-merger
              $230B valuation on $500M ARR at approximately 460x illustrates the extremity of platform-distribution
              premiums not applicable to Reflection. Cohere's April 2026 acquisition of Aleph Alpha for a combined $20B
              entity provides the only available M&A exit comparable in the sovereign AI space, and it occurred with
              disclosed revenue on both sides.
            claimRefs:
              - CV023
