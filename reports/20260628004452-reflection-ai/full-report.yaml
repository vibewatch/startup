      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: |
              Foundation model market sizing requires precise boundary definition before any estimate
              can be interpreted. Published figures span two orders of magnitude, reflecting genuinely
              different market definitions rather than competing forecasts of the same phenomenon.

              The narrowest definition—core foundation model weights, APIs, and direct licensing—
              yields IntelMarketResearch's estimate of $1.38B in 2026 growing to $4.91B by 2034 at
              a 13.2% CAGR. A broader scope, including enterprise integration and managed services
              around foundation models, produces Research and Markets' $10.6B for 2025 ($12B in
              2026) at a 13.5% CAGR to $19.89B by 2030. The open-source AI model market specifically
              (the segment most directly analogous to Reflection AI's commercial model) is estimated
              at $23.08B in 2026, growing 21% year-over-year from $19.05B in 2025, per The Business
              Research Company.

              At the enterprise AI level, IDC's Worldwide AI Spending Guide projects total enterprise
              AI spending at $407B in 2026 (+34.8% YoY), with generative AI specifically reaching
              $127B (+59% YoY)—the fastest-growing segment in enterprise IT. Gartner's broader view
              of total AI spending (including infrastructure and hyperscaler buildout) reaches $2.59T
              in 2026, growing 47% YoY, with the AI models segment specifically growing 110% in 2026
              adding $6B. Goldman Sachs baseline modeling projects $765B in annual AI CapEx in 2026,
              growing to $7.6T cumulatively through 2031.

              A serviceable addressable market for Reflection AI's sovereign AI and regulated enterprise
              vertical cannot be isolated from current public data. McKinsey estimates up to 40% of AI
              spending may be shaped by sovereignty requirements globally, implying a potential SAM of
              $50-163B within the $407B enterprise AI pool, though this range is highly uncertain and
              depends on adoption rate and willingness to switch from incumbents.

              The agentic AI market, a forward-looking opportunity as Reflection expands beyond coding
              agents, is estimated at $33-48B TAM for 2026 by Information Matters using a bottom-up
              methodology, representing a near-term strategic adjacency.
