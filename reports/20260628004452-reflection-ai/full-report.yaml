      - number: '8.7'
        title: Thesis-Break and Kill Triggers
        blocks:
          - type: paragraph
            body: >-
              Six events would individually break the investment thesis for Reflection AI at the $25B entry price and
              require an immediate re-evaluation toward an Avoid recommendation. First, a Series C failure or closing at
              materially below $25B pre-money collapses the capital adequacy narrative and creates runway crisis within
              9–17 months. Second, an Nvidia chip allocation reduction or public investment in a directly competing
              open-weight lab eliminates the core infrastructure-differentiation hypothesis. Third, failure to ship any
              publicly benchmarked frontier model by Q2 2027 invalidates the product timeline and investor credibility
              necessary for subsequent fundraising. Fourth, Meta or DeepSeek shipping a model within 5% capability
              parity on key enterprise benchmarks—with Apache or MIT license—commoditizes Reflection's open-weight
              premium before it can be monetized. Fifth, departure of either Misha Laskin or Ioannis Antonoglou removes
              the founding vision and triggers investor confidence collapse. Sixth, a U.S. policy reversal on
              open-source AI exports or a mandatory federal shift to closed-model-only procurement eliminates the
              sovereign AI government channel thesis.

              Each trigger is monitorable through public signals (SEC filings, benchmark leaderboards, executive
              announcements, policy notices), making active thesis monitoring feasible without requiring insider access.
            claimRefs:
              - CV043
              - CV044
              - CV045
              - CV046
              - CV047
          - type: table
            tableRef: TV005
            claimRefs:
              - CV038
              - CV039
