  - id: capability-pricing-gtm
    title: Capability, Pricing, and GTM Comparison
    body: >-
      Closed-source frontier models (GPT-5, Claude Opus 4.6, Gemini 2.5 Pro) are priced at $1.25–$5
      per million input tokens and $8–$25 per million output tokens, with enterprise contracts negotiated
      at volume discounts. Self-hosted open-weight models are orders of magnitude cheaper at scale:
      DeepSeek V4-Pro at $0.87 per million output tokens via API; effectively zero marginal cost for
      enterprises running on their own hardware. The pricing gap is the central value proposition for
      high-volume enterprise workloads, and Reflection AI will need to price competitively against both
      DeepSeek's API and the zero-marginal-cost economics of self-hosting Llama or Mistral.
      GTM strategies diverge sharply by camp. OpenAI and Anthropic use managed API plus direct enterprise
      sales with deep cloud integration across AWS Bedrock, Azure OpenAI Service, and Google Vertex AI.
      Meta distributes Llama freely to build its developer ecosystem with no direct monetization from the
      model itself. Mistral uses a hybrid freemium funnel: open-weight models for developer adoption,
      paid API tiers for production workloads, and nine-figure enterprise contracts for on-premises
      deployments in regulated industries. Cohere focuses entirely on enterprise sales with zero consumer
      surface. Reflection AI, with no model released and no customer base as of June 2026, will likely
      need to adopt a Mistral-style playbook anchored on U.S. government and sovereign-enterprise early
      adopters. Misha Laskin has explicitly stated that large enterprises by default want an open model
      for infrastructure ownership, cost control, and customization—this is Reflection's target
      customer archetype. Multi-homing is structurally easy in the open-weight tier: enterprises can run
      multiple models on their own infrastructure simultaneously. However, durable lock-in emerges from
      surrounding tooling, fine-tuning pipelines, orchestration layers (such as Mistral's Workflows
      product), and proprietary integrations—not from the base weights themselves.
