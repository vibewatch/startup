  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: Reflection AI model roadmap
      missingEvidence: >-
        Reflection AI has not published any model release timeline, capability targets, benchmark
        goals, or architecture details for its first frontier model as of June 2026.
      whyItMatters: >-
        Without a public model, no direct capability comparison against DeepSeek V4-Pro, Meta
        Llama 5, or Mistral is possible; competitive positioning rests entirely on company
        statements and funding signals.
      diligencePath: >-
        Request model release roadmap and early benchmark results from Reflection AI; ask
        specifically about target Artificial Analysis Intelligence Index score and SWE-bench
        Verified target for the first model.
      relatedQuestionRefs:
        - QP010
        - QP013

    - type: missing-source
      severity: material
      topic: DeepSeek security vulnerabilities
      missingEvidence: >-
        The Cisco-published full analysis of DeepSeek R1 algorithmic jailbreak vulnerabilities
        was not located and fetched; only a secondary reference in TechStartups confirmed the
        finding.
      whyItMatters: >-
        The severity and patchability of these vulnerabilities materially affects whether
        DeepSeek's Chinese-origin security concerns are durable or transient competitive
        advantages for Reflection AI.
      diligencePath: >-
        Locate and review the Cisco AI Security Threat Report on DeepSeek R1; assess whether
        subsequent DeepSeek V4 releases address these specific vulnerabilities.
      relatedQuestionRefs:
        - QP014

    - type: private-evidence-only
      severity: material
      topic: Nvidia cross-investment strategy
      missingEvidence: >-
        Nvidia's rationale for simultaneously investing in Reflection AI, OpenAI, Anthropic,
        Mistral, and other competing AI labs has not been publicly articulated beyond chip
        demand cultivation.
      whyItMatters: >-
        Understanding whether Nvidia maintains neutral compute allocation or provides preferential
        treatment to portfolio companies affects assessment of Reflection AI's supply chain
        advantage versus competitors.
      diligencePath: >-
        Request Reflection AI's disclosed Nvidia investment terms and any committed GB300
        allocation priority; compare against publicly known Anthropic and OpenAI Nvidia
        arrangements.
      relatedQuestionRefs:
        - QP024

