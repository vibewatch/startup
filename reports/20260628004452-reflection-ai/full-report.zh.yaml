      - number: '1.2'
        title: 创始人、领导层与关键人物风险
        blocks:
          - type: paragraph
            body: >
              Reflection AI 由 Misha Laskin 和 Ioannis Antonoglou 共同创立，两人都来自 Google DeepMind AI 项目的前沿研究团队。Laskin 担任 CEO，拥有
              University of Chicago 理论物理学博士学位，曾在 UC Berkeley 做强化学习博士后研究；创办 Reflection 前，他是 Google DeepMind 员工研究科学家，负责
              Gemini 项目的奖励建模。他还创办过 Claire AI，这是一家获 Y Combinator 支持、专注零售商产品需求预测的初创公司，因此除研究外也有运营初创公司的经验。

              Antonoglou 担任 CTO 兼总裁。他是 DeepMind 有史以来第六位研究员，也是 DeepMind 研究文化的早期塑造者之一。他最知名的成就是共同创造 AlphaGo——2016
              年第一个击败围棋人类世界冠军的 AI 系统，并随后参与 AlphaZero 和 MuZero。他在强化学习和大规模 RL 系统上的经验，直接支撑 Reflection 的模型策略。公司研究页面列出团队集体参与过
              Deep Q Networks（2015）、AlphaGo（2016）、AlphaZero（2017）、MuZero（2019）、PaLM（2022）、GPT-4（2023）、Gemini
              1（2023）、AlphaCode 2（2023）、Gemini 1.5（2024）和 Gemini 2.5（2025）。

              两位创始人的关键人物风险都很高。Laskin 是面向投资人的核心 CEO 和公开声音；Antonoglou
              掌握核心技术愿景。董事会构成和治理结构没有公开披露，这是重要尽调缺口。截至报告日期，公开来源未发现重大领导层变动或离职。
