      - number: '3.4'
        title: 能力、定价与 GTM 对比
        blocks:
          - type: paragraph
            body: >-
              封闭源前沿模型（GPT-5、Claude Opus 4.6、Gemini 2.5 Pro）每百万输入 token 定价 $1.25–$5，每百万输出 token 定价
              $8–$25，企业合同按量谈判折扣。自托管开放权重模型在规模化后便宜几个数量级：DeepSeek V4-Pro 通过 API 每百万输出 token
              $0.87；企业在自有硬件上运行时，边际成本实际上为零。定价差距是高用量企业工作负载的核心价值主张，Reflection AI 需要在价格上同时对抗 DeepSeek API 和自托管 Llama 或
              Mistral 的零边际成本经济性。GTM 策略按阵营显著分化。OpenAI 和 Anthropic 采用托管 API 加直接企业销售，并通过 AWS Bedrock、Azure OpenAI Service 和
              Google Vertex AI 进行深度云集成。Meta 免费分发 Llama 以建设开发者生态，模型本身没有直接商业化。Mistral 采用混合免费增值漏斗：开放权重模型拉动开发者采用，付费 API
              层服务生产工作负载，受监管行业的本地部署拿下九位数企业合同。Cohere 完全聚焦企业销售，没有消费者端入口。Reflection AI 截至 2026 年 6 月尚未发布模型，也没有客户基础，很可能需要采用类似
              Mistral 的打法，以美国政府和主权企业早期采用者为锚点。Misha Laskin 明确表示，大型企业默认想要开放模型，以获得基础设施所有权、成本控制和定制能力——这就是 Reflection
              的目标客户画像。开放权重层的多归属在结构上很容易：企业可以同时在自有基础设施上运行多个模型。但持久锁定来自周边工具、微调流水线、编排层（如 Mistral 的 Workflows
              产品）和自有集成，而不是基础权重本身。
