  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与服务定义
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 运营着双产品组合。第一个也是唯一已商业部署的产品是 Asimov，这是一个代码理解代理，2025 年 7 月 16 日发布，截至运行日期以选择性早期访问形式提供。Asimov
              明确不是代码生成工具；它瞄准工程时间中约 70% 用于理解既有代码库、而非编写新代码的部分。放在客户工作流里，Asimov 是一个 AI 驱动的机构知识系统：它摄取软件团队的代码仓库、架构文档、GitHub
              讨论、Slack 历史和项目管理记录，按需回答关于代码库的复杂技术问题。一个差异化功能是 Memories 系统，资深工程师可显式教 Asimov 组织事实（“@asimov remember X works
              in Y way”），并配合基于角色的访问控制，让组织知识持续积累，即便团队人员流动也不丢失。

              产品组合中的第二个产品，是一个正在积极开发、尚未命名的开放权重前沿语言模型。Reflection AI 于 2025 年 10 月确认，已搭建大规模 LLM 和强化学习训练平台，能够以前沿规模训练巨型
              Mixture-of-Experts（MoE）模型。首个模型——一个以文本为主、计划用数十万亿 token 训练的语言模型——原定 2026 年初发布，但截至 2026 年 6
              月运行日期尚未出货。公司计划公开发布训练后的模型权重，同时像 Meta 的 Llama 和 Mistral 一样，将训练数据集和流水线保密。目前 Asimov 运行在第三方基础模型之上，Reflection
              正训练自有替代模型。核心产品组合之外，Reflection 已获得政府部署承诺：在 Genesis Mission（2026 年 5 月）下成为美国能源部全部 17 个国家实验室的 AI 模型提供方；获得
              Pentagon IL6/IL7 机密网络使用许可（2026 年 5 月）；并与韩国 Shinsegae Group 签署 MOU，建设一座 250 兆瓦主权 AI 工厂。
