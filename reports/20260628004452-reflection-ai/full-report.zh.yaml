      - number: '2.3'
        title: 买方与细分动态
        blocks:
          - type: paragraph
            body: >
              Reflection AI 面向三类主要买方画像，每类都有不同的预算归属、采购触发点和合同动态。


              受监管行业中的大型企业（1,000+ 员工）代表近端主要商业机会。金融服务以 87% 的 AI
              采用率领先，其后是科技（85%）、医疗（74%）和制造业（68%）。这些买方更重视模型定制、基础设施控制和成本可预测性，而不是封闭模型的便利。CEO Misha Laskin 曾公开表示，大型企业「为 AI
              支付某种离谱金额」后，想要拥有、定制并优化适配自身工作负载的模型——只有开放模型能满足这种价值主张。基础设施决策的预算通常归 CTO 或 CISO，应用层支出则由业务部门负责人控制。2026 年企业 AI
              预算平均为 $11.6M，同比增长 65%。


              主权 AI / 政府细分是 Reflection AI 最差异化、壁垒最高的机会。Dell 委托 IDC 于 2026 年 6 月开展的调查显示，52% 的政府领导者计划在 12-18 个月内投资主权
              AI；73% 的企业 IT 决策者正在积极实施或试点主权 AI 能力（Omdia）。该细分采用多年期框架合同，并需要部委级采购批准；Reflection 的 DOE Genesis Mission 合作（2026
              年 5 月宣布）就是典型商业切入口。McKinsey 估计，全球最多 40% 的 AI 支出可能受主权要求影响。


              开发者和研究社区免费采用 Reflection AI 的模型权重，推动生态采用、基准可见度和人才管线信号。按 Reflection 当前模型，该细分不产生直接收入，但对市场渗透以及对 Meta、Mistral 和
              DeepSeek 的竞争定位至关重要。


              SMB（500 人以下）AI 采用率只有 42%，而企业为 78%；数据、人才和预算约束使其短期内并非理想的基础模型客户，尽管总量市场规模可观。
