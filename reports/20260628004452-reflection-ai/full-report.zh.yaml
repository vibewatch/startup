      - number: '6.3'
        title: 商业牵引力与留存证据缺口
        blocks:
          - type: paragraph
            body: >-
              公开商业指标缺失，是本章最具分析意义的发现。截至 2026 年 6 月，Reflection AI 未在任何新闻稿、SEC
              文件或可信第三方数据源中披露客户数、ARR、收入运行率、净收入留存、总收入留存、流失率或合同续约数据。公司没有发布客户案例、带量化业务结果的证言或 cohort 数据。唯一间接商业信号，是据称 Asimov
              报价为每名用户每年 $15,000–$25,000（据 Sacra 和 ToolRadar），以及公司称计划向企业部署和主权 AI 服务收费。

              行业分析师和批评评论者在描述这一缺口时措辞尖锐。AInvest 于 2026 年 3 月写道：“整个风投生态都在密切观察：要么 Reflection 最终交付一个变革性的开放权重 AI
              模型，要么它成为这个时代最戏剧性的 AI 炒作远超现实案例。”AI2.work 的分析《Reflection AI's $25B Valuation Surge With Nothing Yet to
              Show》直接将零可识别企业收入和失效 waitlist 识别为重大风险。这些立场不利的来源佐证了商业证明的缺失。

              Asimov 的 VPC 部署架构在客户上线后会创造理论上的留存优势——深度代码库索引和机构知识积累会提高切换成本——但如果付费客户群接近零，这一优势就无关紧要。没有 NRR、GRR 或 cohort
              数据可评估少数访问过 Asimov 的试点客户是否续约或扩张。Sacra 画像指出早期访问合同为年度合同，这提供了最低合同期限下限，但实际续约证据不存在。留存尽调需要公司提供受 NDA 保护的商业数据。
