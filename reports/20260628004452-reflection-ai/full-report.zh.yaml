      - number: '3.2'
        title: 封闭源前沿实验室：OpenAI、Anthropic 和 Google
        blocks:
          - type: paragraph
            body: >-
              OpenAI 是占主导地位的商业 AI 平台，2025 年年化收入超过 $20 billion，每周活跃用户超过 800 million，并被 92% 的 Fortune 500 公司采用。GPT-5 于
              2025 年 8 月推出，定价为每百万输入 token $1.25、每百万输出 token $10；o3 推理模型定价为每百万输入 token $2.00、每百万输出 token $8.00。OpenAI
              企业商业计划从每用户每月 $20（Business tier）起，企业级合同采用定制定价。公司在 2025 年 3 月以 $300 billion 估值融资 $40 billion，随后在二级股权出售后达到
              $500 billion 估值。OpenAI 的分发护城河——ChatGPT 消费者心智、Azure OpenAI Service 和 Microsoft
              Copilot——对任何独立实验室都很难复制。OpenAI 也开始以 API 可访问定价发布首批开放权重模型，释放出防御性承认开放权重威胁的信号。Anthropic 的增长快于任何可比 AI 公司：2026 年
              6 月以 $965 billion 估值提交 IPO 申请，此前在 2026 年 5 月完成 $65 billion Series H，并在 2026 年 2 月完成 $30 billion Series
              G。Sacra 估计其截至 2026 年 5 月年化收入为 $47 billion，高于 2025 年底的 $9 billion。仅 Claude Code 就贡献 $2.5 billion 年化收入，在 VS
              Code 上日安装量达 29 million。Anthropic 拥有超过 300,000 家企业客户，其中超过 1,000 家年消费超过 $1 million；Fortune 10 中已有 8 家是
              Claude 客户。Claude Opus 4.6 定价为每百万输入 token $5、每百万输出 token $25。美国政府在 2026 年中期禁止 Anthropic 的 Fable 5 和 Mythos
              5 封闭模型，直接促使企业和政府重新评估对封闭 AI 的独家依赖，成为 Reflection AI 这类开放权重供应商最重要的结构性催化。Google DeepMind 的 Gemini 家族深度嵌入
              Google Workspace 和 Android，带来数亿既有企业用户的分发优势，这是任何独立 AI 实验室都无法匹配的。Gemini 2.5 Pro 定价约为每百万输入 token $1.25、每百万输出
              token $10；同时 Google 已承诺每月向 SpaceX Colossus 支付 $920 million 以获得额外算力容量，并在自有数据中心扩张期间支撑需求。
