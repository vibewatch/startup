      - number: '6.2'
        title: 具名客户证明与采用证据
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 有三项公开确认的“客户”关系，全部属于政府或战略伙伴类别。最实质的一项是美国能源部 Genesis Mission，2026 年 5 月由 Axios
              独家披露。在这一安排下，Reflection AI 被指定为一项联邦计划的基础 AI 智能层，该计划覆盖全部 17 个 DOE National
              Laboratories，涵盖能源、生物技术、量子系统和国家安全等科学工作负载。该任务的 $293M 联邦承诺，标志着美国政府首个重大的开源 AI 采用合同。MeriTalk 和 CDO Magazine
              佐证了该公告，确认其为真实项目——但模型版本、部署时间表或合同支出均未公开披露。

              第二个政府客户是美国国防部。2026 年 5 月，国防部与包括 Reflection AI 在内的八家公司签署机密 AI 网络协议，允许通过 130 多万 Pentagon 人员使用的 GenAI.mil
              平台，部署到 Impact Level 6（Secret）和 IL7（高度机密）军事网络。DOD 公告出现在 Department of War 官方新闻稿页面，属于一手层级证据。Anthropic
              因安全护栏和供应链风险分歧未被列入名单，进一步抬高了 Reflection AI 的联邦定位。

              国际上，Shinsegae 合作（2026 年 3 月）是伙伴—客户混合体：Shinsegae Group 正使用 Reflection AI 的模型和基础设施栈建设一座 250 MW 韩国主权 AI
              云工厂，主要服务韩国政府机构、零售、物流和金融企业。PR Newswire 联合新闻稿确认了合作；Korea Times 和 DataCenter Dynamics
              佐证了范围细节。公司尚未披露生产里程碑、首个客户或上线部署日期。

              对企业编码代理 Asimov 而言，公开记录中没有任何具名付费客户。Sequoia 在 2025 年中发布的合作文章正面描述了 Asimov；Slashdot 和 ToolRadar
              上少数独立评测者认为其代码库理解能力强，但也指出围绕完全自主的承诺仍处早期。多个来源称 waitlist 失效或无法使用，限制了真实商业采用证据。
