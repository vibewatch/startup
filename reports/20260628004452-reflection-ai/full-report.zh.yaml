      - number: '5.4'
        title: 技术差异化与知识产权
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 的主要技术差异化，在于团队把强化学习大规模用于 LLM 后训练的综合专长。团队履历覆盖 Deep Q
              Networks（2015）、AlphaGo（2016）、AlphaZero（2017）、MuZero（2019）、PaLM（2022）、GPT-4 贡献（2023）、Gemini 1、Gemini 1.5 和
              2.5，以及 AlphaCode 2；这套履历可被公开验证，并被用作其声称已独立搭建前沿规模 MoE 训练栈的依据。过去这种能力只存在于最大型封闭实验室中，因此一家初创公司能否复制这套能力，就是核心技术主张。

              Reflection 的开放权重分发模式，是其在企业和政府市场的战略差异化。公司对开放性的定义类似 Meta 的
              Llama：公开发布训练后权重，同时保留训练数据和流水线为专有资产，让客户可在自有基础设施上定制、微调和部署，而无需把敏感数据经由第三方 API。随着 Meta 部分退出完全开放的 Llama
              发布，Reflection 被定位为唯一一家由美国主导、且具备这一算力画像的开放权重前沿实验室。在产品层面，Asimov 的 Memories
              系统配合基于角色的访问控制，能够持续积累组织知识，这是无状态编码代理无法复制的。理解优先的检索器—组合器架构，相比生成优先的单模型工具是一种不同设计押注，尽管尚未被独立基准验证。
