      - number: '8.6'
        title: 退出准备度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Reflection AI 尚未具备 IPO 条件。公开市场退出需要 GAAP
              审计财务、披露收入、可展示的客户牵引，以及清晰的盈利路径，至少也要有可信路线图——公开证据中这些都不存在。Anthropic 和 OpenAI 在分别达到 $47B 和 $20B+ ARR 后，于 2026 年
              6 月提交 IPO 文件，先例已经很明确：前沿 AI 实验室靠收入上市，不靠叙事。未来 5 年内，Reflection AI
              最可能的退出路径是被超大规模云厂商（Google、Amazon、Microsoft）、国防 /
              国家安全主承包商（Anduril、Palantir）或主权相邻机构战略收购；在这些情景下，团队、训练基础设施和政府关系的战略溢价，可能让 $8–25B 区间即便在未收入阶段也能成立。Cohere/Aleph
              Alpha 以 $20B 合并的交易提供了最近的类比：两家披露收入的主权 AI 公司，通过 M&A 而非 IPO 打造跨大西洋平台。

              二级市场 SPV 活动（2025–2026 年三份 Form D 备案）确认，机构买家正在按一级市场区间给股权定价，提供了一个底部估计；但二级价格并不等同于 IPO 或 M&A 退出价格。
