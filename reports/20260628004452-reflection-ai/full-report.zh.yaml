      - number: '4.2'
        title: GTM 与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 的 go-to-market 动作是直接面向企业和政府销售，并由 Nvidia 的战略机构渠道杠杆放大。Nvidia 在 Series B 中直接投资
              $800M，并非被动资本；它释放出优先算力分配、芯片获取优先级，以及通过 Nvidia 企业 AI 平台和 2026 年 3 月 GTC 上启动的 Nemotron 开放 AI 联盟进行生态集成的信号。Trump
              政府的公开背书——白宫 AI 主管 David Sacks 公开呼吁美国开源 AI 领导力——以及 U.S. AI Exports Program，形成了多数 AI 初创公司无法获得的政府渠道顺风。

              DoE Genesis Mission 合作和据报 Pentagon AI 项目接触，都是早期管线指标，说明公司拥有美国政府客户或准客户；但合同金额和收入状态均未确认。GMI Cloud 合作（2025 年 11
              月）增加了算力基础设施分发渠道。Shinsegae JV 在韩国建立了一个由政府支持的分发和执行伙伴，也是 U.S. AI Exports Program 下的首个项目。

              公司没有披露 CAC、LTV、回本周期、销售周期长度或胜率指标。在没有上线商业产品的情况下，所有销售效率代理指标都必须作为开放尽调问题处理。商业运营启动后，管线质量和客户集中度将成为关键承销输入。
