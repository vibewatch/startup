      - number: '1.3'
        title: 资本基础、投资方与融资历史
        blocks:
          - type: paragraph
            body: >
              Reflection AI 在短时间内完成了三轮已披露融资。公司 2025 年 3 月走出隐身状态，宣布 $130 million 融资：$25 million 种子轮和 $105 million Series
              A，公司估值约 $545 million。七个月后，2025 年 10 月 9 日，公司完成由 Nvidia 领投的 $2 billion Series B；据报 Nvidia 投入约 $800
              million。Series B 将公司估值推至 $8 billion——单轮融资周期内较 Series A 估值跃升 15 倍，是近年 AI 初创公司中最大的估值跳升之一。

              Series B 投资方包括 Nvidia、Eric Schmidt（前 Google CEO）、Citigroup、1789 Capital（与 Donald Trump Jr.
              相关的风投公司）、Lightspeed Venture Partners、Sequoia Capital、DST Global、B Capital、CRV、Disruptive、GIC 和 Eric
              Yuan（Zoom CEO）。早期投资方包括 LinkedIn 联合创始人 Reid Hoffman 和 Meta 高管 Alexandr Wang。Wilson Sonsini Goodrich &
              Rosati 担任 Series B 法律顾问。所有轮次累计融资约 $2.13 billion。

              到 2026 年 3 月初，ROIC 和 Financial Times 报道 Reflection 正在以超过 $20 billion 的估值洽谈融资。到 2026 年 3 月下旬，Wall Street
              Journal 报道其正在讨论一轮 $2.5 billion 融资，投前估值 $25 billion，JPMorgan 可能通过 Security and Resiliency Initiative
              参与。截至报告日期，这些洽谈尚未被确认为已完成融资。估值从 2025 年 3 月的 $545 million 到 2026 年 3 月据报目标 $25 billion，十二个月内约 46 倍，反映出投资人对前沿
              AI 的热度，以及 Reflection 开源—美国定位所附带的地缘政治溢价。
