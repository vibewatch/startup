              - CR001
              - CR002
              - CR003
          - type: callout
            title: 负面信源提示：Turing Post 与 AI2.Work 指出的交付缺口
            body: >-
              多名独立分析师指出，Reflection AI 的估值已脱离产品现实。TuringPost（2026 年 3 月）和 AI2.Work 的分析都强调，公司成立 27
              个多月后，没有发布公开前沿模型，没有发表研究论文，唯一商业产品 Asimov 仍停留在邀请制等候名单内。AI2.Work 的反方分析称估值飙升「全靠叙事和履历，几乎没有真实用户或业务牵引」。Medium
              分析（2026 年 3 月）指出公司「在未发布模型的情况下融资 $4.6 billion」，并将 Series C 定位为一场尚未交割的市场信心投票。这些是真实的负面市场信号，不是边缘批评。
