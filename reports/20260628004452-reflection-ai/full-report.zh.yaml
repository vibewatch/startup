      - - 论点
        - 开放权重发布带来开发者生态，也形成企业主权部署护城河
        - Mistral 先例：开放权重 Apache 策略带来 $400M ARR；Meta Llama 下载量 10M+
        - 前沿开放权重市场被 Meta / DeepSeek 以免费许可和能力追平商品化
      - - 反论点
        - $25B 目标估值对应零收入，在商业 AI 实验室的这一融资阶段没有先例
        - 截至 2026 年 6 月 28 日未披露收入、客户或标价
        - 首个披露企业合同且明示收入金额超过 $10M
      - - 反论点
        - 收入前已有资本密集度（$1.8B / 年算力），制造攸关生死的跑道风险
        - 若按 7 月之后的烧钱速度且没有 Series C，估算跑道为 9–17 个月；现金头寸 $1.7–2.8B
        - Series C 确认以 ≥$20B 投前估值完成，并明确承诺跑道达到 24+ 个月
      - - 反论点
        - Meta（Apache 2.0）和 DeepSeek（MIT 许可）让开放权重模型迅速商品化
        - 截至 2026 年 Q2，DeepSeek V4 和 Llama 4.5 已以零成本逼近前沿能力
        - Reflection 模型相对免费替代品拿出可衡量的领先表现（SWE-Bench 高出 >10 分）
      - - 反论点
        - 主权 AI 市场由政策驱动，政治周期性强；美国行政令可能逆转
        - 白宫 AI 政策停留在行政令层面，缺少法律支撑
        - 拿下多年期 DoD / DoE 合同，锁定收入承诺并获得国会授权
      - - 反论点
        - 尚无披露的产品、定价或客户能验证 $25B 商业化论点
        - 截至 2026 年 6 月 28 日，Asimov 仍在不可加入的等待名单上；前沿模型尚未发布
        - Asimov 或前沿模型公开发布，并披露采用率或收入指标
    notes: 正反论点来自多位独立分析师和新闻报道；“哪些证据会改变判断”条目代表分析师对门槛证据的判断。
