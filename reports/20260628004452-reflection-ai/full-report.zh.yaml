      - number: '5.5'
        title: 信任、安全与产品前风险
        blocks:
          - type: paragraph
            body: >-
              Reflection AI
              宣称的安全理念，拒绝以保密换安全，转而支持严格的开放科学——其论点是，公开模型权重能让更广泛的研究社区参与安全研究和风险识别，而不是把这些决策交给少数封闭实验室。发布前承诺包括：模型发布前进行能力和风险评估、开展反滥用安全研究，以及遵守负责任部署标准。截至运行日期，公司尚未发布第三方审计、外部安全报告或独立红队发现。

              Asimov 的 VPC 部署架构，是当前产品的主要隐私控制：系统摄取的所有数据都留在客户自有云环境内。Memories 系统的 RBAC 层控制谁可以更新组织知识。不过，MIT 计算机科学家 Daniel
              Jackson 提出担忧：一个读取团队私密消息和文档的系统会引入内在安全暴露面，而且这种方法可能抬高计算成本。Asimov 尚未发布独立安全审计。

              本章最大风险，是已投放资本与已交付产品之间的执行缺口。截至运行日期，Reflection AI 已融资至少 $4.6B，并承诺每月向 SpaceX 支付 $150M
              算力费用，却尚未发布任何公开前沿模型，也没有发表研究论文。Asimov 基准（相较竞争工具获得 60-80% 偏好）完全由供应商报告并自行委托，没有独立复现。2026 年 3 月，Asimov waitlist
              被描述为无法使用。Claude Code、OpenAI Codex、Meta Llama 等前沿模型竞争者均已全面可用，并有可见牵引力。对 SpaceX 的资本承诺形成时间压力：Reflection
              必须在月度支出累积成不可持续烧钱前交付前沿模型。
