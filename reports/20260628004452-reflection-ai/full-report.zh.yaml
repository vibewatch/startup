      - number: '7.4'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Reflection 的伙伴组合让价值链每一层都压在少数单点上。算力层，SpaceX 是唯一训练基础设施提供方。芯片层，Nvidia 既是 $800M 股权投资人，也是 Colossus 2
              的独家硬件供应商。政府渠道层，U.S. AI Exports Program 和韩国 Shinsegae 合资公司是目前说得最清楚的商业化路径，但两者都是未经验证的合同，也没有确认收入。国防层，Pentagon
              机密网络协议没有披露合同金额或部署时间表；Anthropic 的先例说明，政府 AI 关系可能因安全理由迅速撤回。

              Shinsegae 合资公司计划在韩国建设 250MW 主权 AI 数据中心，能否落地取决于韩国政府审批、U.S. AI Exports Program 资格（又受持续的韩美关系地缘政治影响）、Shinsegae
              自身资本执行能力，以及 Reflection 能否交付韩国政府客户愿意部署的模型。任一依赖失效，都会拖延甚至取消 Reflection
              首个重大国际收入事件。合资公司的承诺以长期资本投入（数据中心建设）计价，而不是即时软件许可收入，因此收入爬坡天然后置。

              GMI Cloud 伙伴关系（2025 年 11 月）提供推理分发，但安排非独家，且未披露收入承诺。DoE Genesis Mission 伙伴关系带来合法性，也可能带来 R&D
              共同资助；但主权科研合作受预算周期、政府更迭和项目审查约束，可能在没有通知的情况下延后或终止。政府和主权伙伴集中带来相关风险：美国 AI 出口或国家安全政策一旦转向，韩国合资公司、Pentagon 合同和 DoE
              伙伴关系可能在同一个政策周期内同时受损。
