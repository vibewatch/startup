      - number: '5.2'
        title: 技术架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              Asimov 的核心技术设计，是检索器—组合器式多代理架构。多个小型长上下文检索代理同时扫描不同数据源——一个可能解析 Go 模块图，另一个阅读近期 Slack
              迁移讨论。这些代理运行在独立上下文窗口中，让系统处理的材料远超任何单个模型可容纳的范围。所有检索器的输出流向一个短上下文组合器代理，由它把提炼后的信号合成为连贯答案。组合器的上下文只放提取信号，而不是原始材料，Asimov
              因而把推理能力集中在真正关键的位置。这种并行检索架构，与 Claude Code 或 Cursor 这类单模型代理式编码工具在架构上不同；后者是在共享上下文窗口内执行生成优先循环。Asimov
              目前在检索器和组合器两个角色上都使用第三方基础模型；Reflection 称其正积极训练自有模型来替换。

              Reflection 的前沿模型训练平台建立在大规模 LLM 和强化学习栈之上，目标是按公司所称的前沿规模训练巨型 Mixture-of-Experts 模型。MoE 架构把输入 token
              路由到专门的专家子网络，在降低单次推理算力的同时获得前沿能力。RL 训练方法借鉴团队在 AlphaGo、AlphaZero、MuZero、PaLM、Gemini 1 和 1.5、AlphaCode 2
              上的深厚经验。Reflection 使用人工标注者和合成样例生成来制作训练数据，并称客户代码或私密通信不会进入外部训练语料。公司的 GitHub 组织包含
              microsoft/playwright、web-arena-x/webarena 和 openai/codex 的 fork，显示内部对研究工具有兴趣；但公司尚未发布原创模型权重、训练代码或论文。
