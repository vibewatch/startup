    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              Reflection AI 是一家美国 AI 公司，总部位于纽约布鲁克林 Williamsburg。法律实体 Reflection AI, Inc. 于 2024 年 2 月 12 日注册成立，公司在 2024
              年 3 月正式推出。截至报告日期，公司处于 Series B 融资阶段，仍为私营公司，没有公开财务、IPO 申报或监管披露。其网站将使命表述为打造「前沿开放智能，并让所有人都能使用」。

              运营模式把访问权与开发过程拆开。Reflection 计划公开发布训练后的模型权重，供研究和开发者使用，同时把训练流水线和数据集保留为自有资产——类似 Meta 的 Llama 和 Mistral
              的做法。目标客户包括需要可定制、可审计、且能在自有基础设施上运行 AI 的大型企业，以及因法律和安全约束而不能依赖封闭美国实验室或中国供应商的主权政府。CEO Misha Laskin 将其描述为对
              DeepSeek 等中国开源 AI 进展引发的「现代版 Sputnik 时刻」的回应，并主张全球智能的默认标准必须由美国打造。白宫 AI 与加密事务主管 David Sacks 在 2025 年 10
              月融资公告后公开背书公司的开源使命，显示其与美国 AI 主权政策优先事项一致。收入预计主要来自企业部署和政府主权 AI 合同，而不只是 API 消费。
