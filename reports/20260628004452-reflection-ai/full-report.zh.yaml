      - number: '2.2'
        title: 多视角市场规模测算
        blocks:
          - type: paragraph
            body: >
              基础模型市场规模必须先精确定义边界，任何估算才有解释意义。已发布数字横跨两个数量级，反映的是真正不同的市场定义，而不是对同一现象的竞争性预测。


              最窄的定义——核心基础模型权重、API 和直接授权——对应 IntelMarketResearch 的估算：2026 年 $1.38B，并以 13.2% CAGR 增长至 2034 年
              $4.91B。更宽的范围，包括围绕基础模型的企业集成和托管服务，对应 Research and Markets 对 2025 年 $10.6B（2026 年 $12B）的估算，并以 13.5% CAGR 增至
              2030 年 $19.89B。专门的开源 AI 模型市场（最接近 Reflection AI 商业模型的细分）据 The Business Research Company 估算，2026 年为
              $23.08B，较 2025 年 $19.05B 同比增长 21%。


              在企业 AI 层面，IDC 的 Worldwide AI Spending Guide 预计 2026 年企业 AI 总支出为 $407B（同比 +34.8%），其中生成式 AI 达到 $127B（同比
              +59%）——是企业 IT 中增长最快的细分。Gartner 对 AI 总支出的更宽口径（包括基础设施和 hyperscaler 建设）在 2026 年达到 $2.59T，同比增长 47%；其中 AI 模型细分在
              2026 年增长 110%，新增 $6B。Goldman Sachs 基准模型预计 2026 年年度 AI CapEx 为 $765B，到 2031 年累计增至 $7.6T。


              目前公开数据无法单独隔离 Reflection AI 的主权 AI 和受监管企业垂直的可服务可寻址市场。McKinsey 估计，全球最多 40% 的 AI 支出可能受主权要求影响，这意味着在 $407B 企业
              AI 支出池内，潜在 SAM 为 $50-163B；但该区间高度不确定，取决于采用率和从既有供应商迁移的意愿。


              智能体 AI 市场是 Reflection 从编码智能体向外扩展后的前瞻机会。Information Matters 用自下而上方法估算，2026 年 TAM 为 $33-48B，是一个近端战略邻近市场。
