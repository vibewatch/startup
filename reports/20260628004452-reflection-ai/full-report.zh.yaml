      - number: '4.3'
        title: 成本结构与利润率驱动因素
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 的成本结构由算力主导。自 2026 年 7 月 1 日起生效的 SpaceX 协议，要求公司每月支付 $150M，以使用田纳西州孟菲斯附近 Colossus 2 的 Nvidia
              GB300 芯片——单一供应商合同每年就是 $1.8B。这是近年 AI 史上，尚未上线商业产品的初创公司披露过的最大运营成本承诺。前三个月之后，任一方可提前 90
              天通知退出，法律上锁定的风险敞口因此受限；但战略意图是拿到一段延续至 2029 年的多年算力仓位。

              在 SpaceX 交易之前，算力来自 GMI Cloud 位于美国的 GPU 集群（2025 年 11 月宣布）以及未披露的早期安排。约 200 名资深 AI 研究员和工程师来自 DeepMind、OpenAI
              和顶尖学术实验室；按前沿 AI 人才常见的全成本薪酬每人 $400K–$700K 计算，人才成本估计每年为 $80M–$140M。纽约、旧金山、伦敦三地办公室还会增加开支。SpaceX 之前的总运营烧钱估计为每月
              $20–45M；SpaceX 之后，估计月度烧钱升至 $165–200M。

              尚未产生收入，无法计算毛利率。规模化之后，开放权重 AI 授权在结构上有较高潜在毛利率（纯软件授权通常为 80–90%），但持续算力义务和主权 AI
              项目的服务交付成本会显著压缩毛利。资本强度在风投支持的软件公司中处于最高区间，更像基础设施或半导体开发，而不是 SaaS。
