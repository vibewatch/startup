      - number: '8.5'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              可比公司覆盖四类：闭源前沿实验室（Anthropic、OpenAI）、开放权重挑战者（Mistral AI、合并前的 xAI）、企业主权 AI 平台（Cohere、Cohere+Aleph
              Alpha），以及纯主权 AI 政府平台公司（Dream）。Anthropic 以 $47B ARR、$965B 估值提交 IPO 文件（约 20 倍），OpenAI 以 $20B+ ARR、$852B 估值提交
              IPO 文件（约 42 倍），锚定了区间高端；二者都披露了数十亿美元收入基础，而 Reflection 完全没有。最直接的可比对象是 Mistral AI：开放权重，主权 AI 论点相近，正以约 €20B
              估值、$400M ARR 融资——50 倍 ARR 倍数意味着，即便按同一倍数，Reflection 的 $25B 标记也需要 $500M ARR 才能打平。Cohere 同样有参考价值：$240M
              ARR、$7B 估值（29 倍），有实际商业证明，但交易估值不到 Reflection Series B 估值的三分之一。

              Dream 以约 $300M 合同收入支撑 $3B 估值（10 倍收入倍数），展示了主权 AI 政府平台溢价最纯粹的形态，也给出一个基准：按 Dream 倍数，仅要支撑 $25B 标记就需要 $2.5B
              主权合同收入。xAI 合并前以 $500M ARR 支撑 $230B 估值、约 460 倍，说明平台分发溢价可以极端到什么程度，但这不适用于 Reflection。Cohere 在 2026 年 4 月收购
              Aleph Alpha 后形成 $20B 合并实体，这是主权 AI 领域唯一可用的 M&A 退出可比案例，且交易双方均披露了收入。
