        - 到 2026 年 9 月仍无官方完成公告，或确认完成估值低于 $18B
        - 资本充足性危机；跑道低于 9 个月；可能被迫火线出售或以持平轮重新定价
        - 下调至回避；若没有资本支撑每月 $165–200M 烧钱，论点即坍塌
      - - Nvidia 芯片配额减少
        - 公开宣布减少 Reflection AI GPU 配额，或向竞争性开放权重实验室投资 $200M+
        - 抹掉核心算力获取差异化和生态渠道论点
        - 立即重新评估；加强对竞品芯片获取和 Nemotron 状态的尽调
      - - 前沿模型未能在 2027 年 Q2 前发布
        - 到 2027 年 6 月 30 日仍没有公开基准测试的前沿模型或商业产品
        - 收入论点坍塌；团队可信度受损；后续轮次无法按 Series C 倍数完成
        - 下调至回避；产品交付是最核心的执行与可信度关口
      - - Meta 或 DeepSeek 追平开放权重能力
        - 竞品以 Apache / MIT 许可发布模型，在 SWE-Bench / MMLU 基准上差距控制在 5% 内
        - Reflection 变现差异化之前，开放权重溢价先被商品化
        - 重新评估；按季度监控基准差距；判断企业支持护城河是否还守得住
      - - 关键人物离职（Laskin 或 Antonoglou）
        - 任一联合创始人公开宣布离职或长期休假
        - 创始愿景载体和投资者信心主锚消失
        - 立即升级尽调；高信念持有需要两位创始人都在位
      - - 美国 AI 政策逆转开放源码出口
        - 行政令要求联邦使用闭源模型，或暂停 AI Exports Program
        - 主权 AI 政府渠道论点消失；白宫顺风被拿掉
        - 监控 OSTP / NSC 政策信号；量化政府收入占总管线比例
