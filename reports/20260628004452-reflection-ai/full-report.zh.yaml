      - number: '7.6'
        title: 缓释因素、监测指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Reflection 主要结构性缓释来自三点：以 Nvidia 为锚的投资者基础，美国政府关系深度（Pentagon IL6/IL7、DoE、AI Exports
              Program），以及相较受出口管制影响的闭源模型同行，开放权重带来的差异化。Anthropic 禁令给开源主权 AI 带来真实的短期顺风，也验证了支撑 Reflection 定位的市场叙事。SpaceX
              交易中的 90 天终止条款是一把双刃剑，但它也防止 Reflection 被一笔坏交易锁满三年。Nvidia 既是投资人又是硬件供应方，这种循环关系提供隐性补贴：作为旗舰 GB300
              参考客户，Reflection 成功符合 Nvidia 的强商业利益。

              需要持续跟踪的监测指标包括：（1）Series C 交割日期，以及最终估值相对 $25B 锚点的位置；（2）前沿模型公开发布日期，以及相对同期 Meta/Mistral/DeepSeek
              发布的基准位置；（3）Asimov 等候名单开放情况，以及早期访问披露的任何 ARR；（4）SpaceX 合同使用率及任何重谈公告；（5）Reflection 关于 EU AI Act
              的合规申报或公开声明；（6）任何点名 Reflection 或其训练数据方法的版权诉讼；（7）Pentagon IL6/IL7 部署上线公告和合同金额披露；（8）Shinsegae
              合资公司开工和韩国政府审批状态；（9）团队规模和高管离职公告。

              论点失效触发器——会迫使投资者实质性重估牛市情景的事件——包括：Series C 未能交割，或交割估值低于 $20B；政府主导、针对 Reflection 模型权重的任何出口管制行动；点名
              Reflection、索赔超过 $500M 的重大版权诉讼；任一创始合伙人离开；模型发布前 SpaceX 终止算力合同；Reflection 首个公开模型发布时在 MMLU/HumanEval/GPQA
              基准上低于开源同行前五；或任何确认的安全事件，涉及 Reflection 模型权重部署给受限方。
