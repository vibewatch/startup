      - number: '8.8'
        title: 附录
        blocks:
          - type: callout
            title: 美国政府与 Nvidia 的战略对齐
            body: >-
              Reflection AI 享有其他开放权重实验室拿不到的独特政策与投资者对齐：White House AI Czar 直接背书，首个主权部署是 U.S. AI Exports Program
              项目（韩国合资公司），并参与 DoE Genesis Mission 和 Pentagon，同时获得 Nvidia $800M 联合投资，把 Reflection 接入 GPU 生态和 Nemotron
              联盟。战略资本、政府渠道和政策顺风的组合，构成主权 AI 论点的结构性分发护城河；Mistral、Cohere，甚至拥有开放 Apache 许可的 Meta Llama，都难以轻易复制。
            calloutType: strength
            claimRefs:
              - CV003
              - CV006
              - CV007
          - type: callout
            title: 收入前所未有的资本强度
            body: >-
              从 2026 年 7 月 1 日起，Reflection AI 在尚未确认任何收入前，每月就要为算力支付 $150 million。按估计的 $165–200M/月总烧钱速度，若没有 Series
              C，公司将在未来 9–12 个月消耗 $1.65–$2B。这是近年 AI 历史上披露规模最大的未收入运营成本承诺，也让公司生死系于 $25B Series C 能否快速交割。如果 Series C 条款滑落到
              $15B 以下，或交割延后到 2026 年 9 月之后，在商业产品产生抵消收入前，现金跑道就会变得极度紧张。
            calloutType: risk
            claimRefs:
              - CV009
              - CV010
              - CV013
          - type: callout
            title: 跟踪——在 Series C 交割和首个收入信号时重估
            body: >-
              TRACK（跟踪）建议反映了 $25B 入场价下不对称的风险回报：出色输入（团队、投资者、政策对齐）被商业证明完全缺席所抵消。上调触发器是二元且可观察的：（1）Series C 以 ≥$20B
              投前估值交割，并确认投资者名单；（2）公开基准测试的前沿模型展现竞争力；（3）首份企业或政府收入合同以有实质内容的形式宣布。在 Series C 前后入场的投资者，应准备持有 4–7
              年，把基准情景建模为持平到温和回报，并按二元结果控制仓位——而不是假设当前估值能被传统倍数证明。
            calloutType: recommendation
            claimRefs:
              - CV045
