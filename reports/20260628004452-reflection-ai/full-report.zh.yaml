      - number: '3.5'
        title: 护城河耐久性、锁定与替代风险
        blocks:
          - type: paragraph
            body: >-
              单靠开放权重模型权重，几乎无法形成持久护城河：任何资源足够的参与者，都可以在数周内 fork、微调或蒸馏已发布模型，做出竞争产品。开放权重 AI
              市场中的持久护城河会迁移到算力获取（预训练规模）、自有微调数据、RLHF 流水线、下游工具与编排，以及政府和企业买方的品牌信任。Reflection AI 与 SpaceX 签订的 $6.3 billion
              算力合同——到 2029 年在 Colossus 2 使用 Nvidia GB300 芯片、每月 $150 million——锁定了前沿规模算力，尽管其配额显著小于 Anthropic 在同一设施每月 $1.25
              billion 以及 Google 每月 $920 million 的承诺。Nvidia 横跨 OpenAI、Anthropic、Reflection AI 和 Mistral
              投资，保证了芯片供应关系，但也意味着 Nvidia 同时资助所有阵营。最可信的反向证据，是 Forbes 将 Reflection AI 称为「尚未交付的实验室」：在任何公开模型或收入流出现之前，公司已经承诺每年
              $1.8 billion 的算力。SpaceX 合同中的 90 天退出条款提供了部分缓冲，但商业牵引出现前的资本消耗制造了严重执行风险。DeepSeek 的成本优势（每百万输出 token
              $0.87，而本地部署封闭替代方案成本可达数百美元）会压缩 Reflection 可能尝试的任何溢价定价。围绕中国来源开放权重模型的安全担忧——包括 Cisco 发现 DeepSeek R1
              存在算法越狱漏洞——是 Reflection AI
              主权定位的主要需求驱动；但持续的政策一致性和政府采购周期不能被视为必然。开放权重模型之间在权重层面的切换成本很低，但一旦客户围绕特定模型家族建立微调流水线、编排逻辑和合规框架，切换成本就会显著上升。
