  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与定价
        blocks:
          - type: paragraph
            body: >-
              截至报告日期，Reflection AI
              的收入模型仍处于商业化前阶段。公司尚未发布前沿产品，也没有公开确认收入。已宣示的商业命题面向两个宽泛细分。第一，大型企业希望获得具备完整审计轨迹、基础设施可迁移性和成本控制的开放权重 AI，因此会授权
              Reflection 模型，并为定制微调、推理 API 访问或本地部署合同付费。CEO Misha Laskin
              明确表示，规模化后企业「想要拥有某种你有所有权的东西」，并将其定义为主要可寻址市场。第二，主权政府和国家机构需要能够检查、修改并在国内基础设施上运行的 AI，避免依赖封闭的美国或中国供应商；白宫 AI
              政策和与中国的地缘政治紧张抬高了这一利基的重要性。

              商业化后的收入确认很可能遵循软件授权和订阅模式。企业开放权重授权通常把一次性部署费与经常性支持、微调和 SLA 合同组合起来。主权 AI 合作——尤其是与 Shinsegae Group 的韩国合资项目——会通过
              JV
              股权参与、数据中心运营费和模型定制服务产生收入。任何产品的标价尚未披露；本章所有定价估计都是结构性推断，不是公司口径。公司对「开放」的定义只是权重可用——训练数据和流水线仍为自有——这创造了企业支持护城河，但也限制了与真正开源的可比性。
