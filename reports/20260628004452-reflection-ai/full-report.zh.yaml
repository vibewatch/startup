  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >
              与 Reflection AI 相关的市场包括三个相互重叠的支出池：（1）围绕免费分发模型权重建立的开放基础模型授权、企业支持合同和微调服务；（2）面向政府和受监管行业的主权 AI
              模型基础设施，这些客户要求数据驻留、可解释性，以及对模型参数的国家级控制；（3）AI 辅助软件开发工具，目前以 Reflection 的 Asimov 编码智能体 API 为锚点，并向通用智能体推理扩展。


              不纳入主要可服务市场的是 hyperscaler IaaS/GPU 云收入（它支撑模型交付，但收入直接流向 AWS、Azure 和 GCP）、OpenAI、Google 和 Anthropic 的封闭模型 API
              服务（这些是定义替代选择的直接替代品，而不是 Reflection 的收入池），以及把 AI 嵌入为功能、而非直接购买模型服务的下游应用层 SaaS 产品。


              买方面对的现状替代方案包括：封闭模型 API 访问（摩擦最低、供应商锁定风险最高）、自托管现有开放模型（Meta Llama 4/5、Mistral Large 3、DeepSeek V3/V4）、通过
              hyperscaler 市场微调基础模型，或使用传统规则型软件自动化。主权政府的替代方案则是不采用，或投入高成本自研模型项目。


              相邻市场——软件开发自动化工具、国家 AI 战略平台和企业 MLOps 基础设施——既是未来收入邻近区，也是在 Reflection AI 商业管线中的早期切入口。
