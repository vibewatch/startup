        title: 公开牵引力与指标缺口
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 提供过的最具体公开指标，是员工规模轨迹：2025 年 10 月 Series B 完成时约 60 人；据 Forbes，2026 年 4 月增至约 150 人；据
              TipRanks，2026 年 6 月下旬约 203 人——九个月扩张 3 倍，与 Series B 资金推动的快速招人相符。其他常规牵引力指标——收入、ARR、GMV、客户数、API
              调用量、活跃用户——均未见公开披露。

              Asimov 编码代理是公司唯一具名产品，截至 2026 年 3 月下旬仍处在无法加入的 waitlist。公司尚未发布研究论文、模型基准或开放权重。政府项目（DoE Genesis
              Mission、Pentagon AI 项目）显示早期政府管线，但并非已确认的收入事件。Shinsegae MOU 只是意向文件——没有已签署协议、披露条款或财务承诺的报道。

              公司自己的营销材料声称具备竞争优势（据称 Asimov 在盲测中 60–80% 的时间优于 Claude 和 Cursor），但这些说法来自公司本身；没有上线产品就无法验证。多位独立分析师——包括 AI2Work
