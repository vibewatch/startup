      - number: '8.2'
        title: 建议、信心与估值立场
        blocks:
          - type: paragraph
            body: >-
              在 $25B 投前 Series C 目标下，建议为 TRACK（跟踪）。信心为中等，风险评级为 HIGH（高），估值立场为
              EXPENSIVE（偏贵）。这一组合反映出证据结构不对称：定性输入很强（创始团队、投资者阵容、政策对齐），但商业证明几乎缺席（未披露收入、未发布前沿模型、Series C 尚未确认交割）。

              给一家未产生收入的实验室定价 $25B，投资者必须同时假设：在 2026 年 7 月 SpaceX 烧钱让现金跑道变得紧张之前，Series C 能按既定条款交割；前沿模型发布且达到企业级基准；到
              2028–2029 年，政府和企业收入能形成足够规模，支撑 20–30 倍 ARR 倍数；在 Reflection 建立差异化之前，开放权重市场不会被 Meta 的 Llama（Apache 2.0，免费）或
              DeepSeek（MIT 许可，开放权重）商品化。每个假设单独看都说得通；四个假设必须同时兑现，$25B 才能被证明公平。

              若满足以下条件，建议可上调至 BUY（买入）：（1）Series C 以 ≥$20B 投前估值交割，且投资者名单和条款得到确认；（2）前沿模型公开对标 Llama 和 Mistral
              同类模型；（3）首笔企业或政府收入以有实质合同的形式宣布。在这些催化剂出现前，耐心跟踪能保留选择权，而不必追逐叙事驱动的热度。
