      - number: '1.5'
        title: 里程碑、合作伙伴与反向背景
        blocks:
          - type: paragraph
            body: >
              Reflection AI 的公开里程碑压缩在两年半内，但覆盖了创立、重大融资、产品推出，以及高价值政府和基础设施合作。2024 年 3 月创立后，公司很快在 2025 年 3 月以 $130 million
              融资走出隐身状态，2025 年 7 月推出 Asimov，并在 2025 年 10 月完成 $2 billion Series B。

              2026 年，公司拿下两项标志性合作。2026 年 5 月，Axios 独家报道称，Reflection 被选为美国能源部 Genesis Mission 的 AI 模型供应商；Genesis Mission
              是一项加速科学研究的联邦计划，Reflection 将为全部 17 个美国国家实验室提供基础智能层。公司还签署了一项协议，将其 AI 部署到 Pentagon 机密网络。2026 年 6 月，Reflection
              与 SpaceXAI 签署算力协议，在 Colossus 2 数据中心使用 Nvidia GB300 芯片；自 2026 年 7 月 1 日起至 2029 年，每月支付 $150 million，总承诺最高
              $6.3 billion——这是迄今宣布的最大开放 AI 基础设施承诺。国际上，公司宣布与韩国 Shinsegae Group 合作，建设韩国主权 AI 云。

              核心反向事实仍然是：截至报告日期，尽管已融资超过 $2 billion，并承诺 $6.3 billion 算力，公司仍没有任何公开前沿模型。Hugging Face CEO Clem Delangue 承认
              2025 年 10 月融资是「美国开源 AI 的好消息」，但也公开指出「挑战在于展现高速度分享开放 AI 模型和数据集」，指向中国开源实验室的竞争节奏。2026 年 7 月开始的每月 $150 million
              SpaceX 承诺，意味着仅算力一项的最低年化消耗就达 $1.8 billion，还未计入人力和运营成本。截至报告日期，公开来源未发现诉讼、监管执法行动或治理纠纷。
