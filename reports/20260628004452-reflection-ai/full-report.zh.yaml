      - number: '7.2'
        title: 监管、法律与出口管制风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 6 月美国 Commerce Department/BIS 针对 Anthropic 的 Fable 5 和 Mythos 5 模型采取的出口管制行动，是 Reflection AI
              面临的定义性监管风险先例。该行动是美国出口管制机构首次停用一个在线商业 AI 模型，说明 BIS 可基于机密国家安全评估，在没有公开法院程序的情况下，要求公司在全球范围停用模型。Reflection 于 2026
              年 5 月签署 Pentagon IL6/IL7 机密网络协议，处在同一监管边界内。尽管 Reflection 作为开放权重、主权 AI 提供商的定位，使其部分免受封闭 API
              限制影响，但开放权重发布本身正成为争议焦点：权重一旦发布便无法召回，若发生滥用事件或跨越能力阈值，可能触发监管审查，而这种风险在结构上比撤回封闭模型更难补救。

              EU AI Act 自 2026 年 8 月 2 日起对 General Purpose AI（GPAI）系统全面生效，对任何在欧盟分发或可从欧盟访问的前沿模型施加强制透明度、技术文档和事件报告义务。罚款最高达
              €35M 或全球营业额的 7%。Reflection 尚未公开披露 EU AI Act 合规计划；公司“发布权重但不发布训练代码”的做法制造合规歧义：某些维度可能符合开源豁免，另一些维度则落入 GPAI
              义务。Reflection 的双边主权 AI 项目（美国 AI Exports Program 下的韩国项目）同时跨越多个监管辖区，进一步抬高执法风险。

              训练数据版权诉讼是第三条监管向量。截至 2026 年初，美国有 70 多起 AI 版权诉讼在审，索赔总额超过 $50B。Bartz v. Anthropic 的 $1.5B
              和解确立了按作品计价的基准（$3,113/本书），并被音乐出版商和新闻机构视为可复制的诉讼剧本。Reflection
              未披露训练数据来源认证、受版权保护内容的许可协议，也未披露和解准备金。大型权利人若赢下一项索赔，按当前基准费率，和解成本可能相当于一整轮融资。

              针对 AI 模型权重和输出的出口管制，是正在出现的第四项风险。Just Security 分析（2026）和 SIPRI 背景资料均指出，美国 EAR 和 Wassenaar Arrangement
              管制正主动延伸至具备双用途能力的 AI 模型。Reflection 聚焦主权 AI——明确瞄准政府和军方——使其处于双用途出口管制框架下的最高审查层级。若 Reflection
              发布的权重在受制裁辖区或由受限终端用户参与滥用事件，可能触发 Export Administration Regulations 下的执法行动。
