  - id: TM004
    title: 增长驱动因素与采用约束——基础模型市场
    columns:
      - 因素
      - 类型
      - 方向 / 时间
      - 对 Reflection AI 的影响
      - 尽调问题
    rows:
      - - 主权 AI 政策动能
        - 驱动因素
        - 加速——2026-2028 年
        - 扩大政府和受监管企业的可触达客户池；验证开放权重论点
        - 确认目标地区的政府采购周期和预算节奏
      - - 闭源模型访问风险（Anthropic 2026 年 6 月事件）
        - 驱动因素
        - 急性——2026 年 Q2；持续
        - 加快企业迁移到开放模型的意愿；构成短期销售催化
        - 量化 2026 年 H2 从迁移意愿到签署协议的转化率
      - - 开源模型能力接近同档
        - 驱动因素
        - 持续——2025 年至 2026 年
        - 消除企业采用开放模型的技术异议；企业部署无需牺牲能力
        - 跟踪其在企业任务上相对 Llama、Mistral、DeepSeek 的基准领先度
      - - 企业 GenAI 支出增长（同比 +59%，$127B）
        - 驱动因素
        - 当前——2026 年
        - 更多买家进入模型底座评估漏斗；总体可触达客户池扩大
        - 当前沿模型发布后，建模 Reflection AI 在 GenAI 支出中的渗透率
      - - Agentic AI 工作流迁移
        - 驱动因素
        - 显现——2026-2027 年
        - Agent 调用规模放大后，开放模型在成本和定制化上更占优；IDC 预计 40%+ 企业应用受益
        - 估算企业规模下每个 agent 的 token 经济性，并与闭源 API 按 token 计费对比
      - - EU AI Act 执法（2026 年分阶段落地）
        - 驱动与约束并存
        - 生效——2026 年+
        - 推高可解释性需求，利好可审计开放模型；同时增加合规成本
        - 跟踪该法案下高风险 AI 应用的执法指引
      - - 企业 ROI 缺口（仅 29% 取得显著 ROI）
        - 约束
        - 持续——仍在延续
        - 拉长采购周期；试点困境限制从评估到生产协议的转化
        - 监测 2026 年 H2 的项目放弃率趋势，判断其稳定还是恶化
      - - 电力与基础设施瓶颈
        - 约束
        - 当前——2026-2028 年
        - 同时限制 Reflection AI 训练规模和客户部署能力；40% 项目延迟
        - 核验 SpaceX Colossus 2 交易执行情况及 2026 年 7 月爬坡所需电力交付时间表
      - - 数据就绪障碍
        - 约束
        - 持续——仍在延续
        - 拖慢企业将模型部署到生产环境的决策；60% AI 项目因数据问题被放弃
        - 识别 Reflection AI 是否计划建立数据就绪合作或集成
      - - 训练成本与资本强度（每个前沿模型 $10M+）
        - 约束
        - 结构性
        - 推动集中化——只有资本充足的实验室能持续前沿训练；竞争供给受限
        - 监测 Reflection AI 的烧钱速度，相对其算力承诺和已融资本
    notes: >-
      严重度和时间判断基于 Gartner、IDC、McKinsey 的分析师共识及一手报道。各因素并非彼此独立——ROI 缺口、 数据就绪障碍和组织变革挑战会相互强化。2026 年 6 月 Anthropic
      事件是最急性的短期催化，也高度贴合当下时点。
    claimRefs:
      - CM026
      - CM029
      - CM030
      - CM031
      - CM032
      - CM034
      - CM039
