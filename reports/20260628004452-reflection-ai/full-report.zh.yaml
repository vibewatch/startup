  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 财务与模型风险
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 的财务风险画像，是 2026 年所有 AI 初创公司中最尖锐的一类。截至运行日期，公司没有确认收入，已通过三轮融资筹集约 $2.13B+，同时从 2026 年 7 月 1 日起每月向
              SpaceX 承诺 $150M——若没有新资本进入，这一合同性烧钱率会在约 13 个月内耗尽整个 Series B 所得。Series C（据报以 $25B 投前估值融资 $2.5B）在 2026 年 3
              月报道中被描述为正与 JPMorgan 作为潜在基石投资者“深入洽谈”，但截至运行日期尚未完成。任何交割延迟，都会拉长公司在商业化前收入状态下背负大额固定基础设施义务的窗口。

              算力承诺结构引入第二层财务风险：即使 Series C 以更低估值或不利条款完成，每月 $150M 义务仍然存在。SpaceX 的 90 天退出条款意味着 Reflection
              理论上可以离场，但若在训练中途退出，会打断模型开发并摧毁已沉没的算力支出。美国 Federal Reserve 在 2026 年正式将 AI
              列为系统性金融风险；多家机构分析师也将该行业投资与收入之间的缺口——估计约为 4:1——识别为典型调整前信号。对 Reflection
              这类估值水平的收入前公司来说，调整风险很尖锐：任何负面信号（模型发布延迟、企业合同失败、政治干预）都可能触发 down round 或投资者信心流失，使估值从 $25B 锚点被压缩。

              资本结构还制造了一个循环风险：Nvidia 向 Reflection 投资 $800M，同时也是 Colossus 2 的主要芯片提供方。若 Nvidia 因商业或政治原因重新分配算力优先级或调整 GB300
              分配政策，Reflection 会同时承受来自单一交易对手的供应商和投资者压力。SpaceX-Nvidia-Reflection
              三角不是一段公平市场交易关系；它是一条垂直对齐的依赖链，基础设施层面的结构性竞争有限。
