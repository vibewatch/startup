      - number: '3.3'
        title: 开放权重挑战者：Meta、DeepSeek、Mistral、xAI 和 Cohere
        blocks:
          - type: paragraph
            body: >-
              Meta 是开放权重 AI 生态的既有巨头，核心是 Llama 家族。Llama 4 Scout 和 Maverick（2025 年 4 月）采用 mixture-of-experts 架构，上下文窗口最高达
              10 million token。Meta 于 2026 年 4 月在 Apache 2.0 等价许可证下发布 Llama 5，面对社区对封闭权重 Muse Spark 模型的反弹，重新确认其开源承诺。Meta
              的 Llama Community License 限制月活超过 700 million 的公司未经单独谈判许可不得部署——这是针对大型平台竞争者的豁免条款。Llama
              生态拥有数亿次下载，是全球最大的开放权重开发者社区。Meta 不从 Llama 直接产生收入，而是用它巩固自身 AI 平台地位，并规模化积累开发者好感。DeepSeek 是对 Reflection AI
              定位最直接的性价比威胁。DeepSeek V4-Pro 于 2026 年 4 月 24 日按 MIT 许可证发布，总参数 1.6 trillion，每 token 激活 49 billion，在
              SWE-bench Verified 达到 80.6%——开放权重最高分；定价为每百万输入 token $0.435、每百万输出 token $0.87。按该价格，V4-Pro 每输出 token 比
              Claude Opus 4.8 便宜约 28.7 倍。Artificial Analysis Intelligence Index 给它 52 分（最佳封闭模型 57 分），并在 GDPval-AA
              智能体排行榜中领先所有开放模型。Reflection AI 面临的主要竞争风险是地缘政治：美国政府和企业部署中国来源 AI 基础设施会面临法律和安全暴露——这正是 Reflection AI
              被明确融资来解决的问题。Cisco 安全研究人员通过算法越狱发现 DeepSeek R1 存在可利用漏洞，说明企业对来源不明、广泛可用开放模型的安全担忧。Mistral AI 于 2026 年 6 月以 €20
              billion 估值完成 $3.5 billion 融资，较 2025 年 9 月 €11.7 billion 的 Series C 几乎翻倍。Sacra 估计其截至 2026 年 1 月 ARR 为 $400
              million，其中约 60% 收入来自欧洲客户。Mistral 是 Reflection AI 美国政府和受监管企业定位在欧洲的对应物：为受 GDPR 约束、无法使用美国封闭模型或中国开放权重模型的客户提供主权
              AI。xAI 在 2026 年 2 月合并后被纳入 SpaceX，累计融资超过 $22 billion，并运营 Colossus 超级计算机（555,000 GPUs）。Grok 在 2026 年 1 月达到美国
              AI 聊天机器人市场 17.8% 份额，仅次于 ChatGPT 和 Gemini，较一年前的 1.9% 大幅上升。按独立口径，xAI 在 2025 年底年化 AI 收入约 $500 million，不同于 X
              的广告收入。Cohere 拥有 $240 million ARR、约 70% 毛利率和 $7 billion 估值，面向企业 RAG、文档智能和搜索，核心模型为 Command R+（104 billion
              参数）。其本地部署能力和企业优先打法，使其成为 Reflection AI 企业战略最近的结构性类比，尽管能力规模低于前沿。
