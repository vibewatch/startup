      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              据 Tracxn，Reflection AI 截至 2025 年 10 月已通过三轮融资累计筹集 $2.13B+（TipRanks 将 2025 年 9 月的中间交割计入后称为 $3B）。仅 Series B
              一轮就以 $8B 估值带来 $2B，其中 Nvidia 贡献约 $800M。截至 2026 年 3 月下旬，公司正深入洽谈以 $25B 投前估值融资 $2.5B——据称 JPMorgan Chase 考虑通过其
              Security and Resiliency Initiative 参与，现有投资方 Disruptive 预计跟投。Wall Street Journal 将 $25B
              作为投前目标估值引用；截至本报告日期，该轮尚未确认完成。

              现金余额和月度烧钱未披露。按信号估算：2025 年 10 月至 2026 年 6 月九个月，SpaceX 之前算力和运营成本为每月 $20–45M，意味着 SpaceX 计费开始前已消耗
              $180M–$405M。假设已融资 $2.13B–$3B，进入 2026 年 7 月的剩余现金估计为 $1.7B–$2.8B。SpaceX 每月 $150M 的承诺将隐含总月度烧钱推升至
              $165–200M；若没有 Series C，跑道约为 9–17 个月。若 Series C 以 $2.5B 完成，按 SpaceX 之后的烧钱水平，估计跑道延长至 22–35 个月。

              与 Shinsegae Group 的韩国 JV（250MW 数据中心，总项目成本 ≥$6.8B）代表一项重大未来资本事件，其结构尚未披露。按 MOU 条款，Shinsegae
              承担土地和建设成本，Reflection 负责设计与运营，从而限制 Reflection 的直接资本开支。但芯片采购和工程投入仍可能带来可观的未来现金流出。二级市场 SPV——包括 HII Reflection
              AI Series I（SEC Form D，2026 年 5 月）和 ID8 Growth Opportunities Reflection AI LLC（2026 年 6
              月）——确认二级市场交易活跃，并间接证明投资者愿意按与 $8–25B 一级市场区间一致的估值购买 Reflection 股权。
