      - number: '2.5'
        title: 采用约束与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >
              尽管宏观顺风强劲，几个结构性约束仍会限制基础模型服务的近端采用；任何市场评估都必须谨慎建模。


              企业 ROI 缺口是最关键的约束。投资生成式 AI 的公司中，只有 29% 报告显著 ROI；42% 在 2025 年放弃了大多数 AI 项目（前一年为 17%）。Gartner 预测，到 2026 年，60%
              的 AI 项目将因缺乏 AI 就绪数据基础设施而被放弃。平均每家企业同时运行 14 个 AI 项目，但少于一半能交付可衡量业务价值。这种「试点炼狱」模式说明，企业 AI
              支出增长不会线性转化为基础模型采购；许多买方仍在为实验花钱，而不是承诺生产部署。


              电力和基础设施约束已经把 AI 的瓶颈从芯片供应转向电力。Microsoft、Google、Amazon 和 Meta 计划在 2026 年投入超过 $320B 建设 AI 基础设施，其中超过 60% 的
              capex 将流向电力基础设施、冷却和数据中心建设，而不是计算硬件。AI 带来的数据中心电力需求预计到 2026 年将在全球达到 1,000 TWh——相当于德国全部用电量。约 40% 已宣布的 AI
              数据中心项目因电力瓶颈而不是芯片供应而面临建设延迟。即使 SpaceX 算力交易已经到位，这也会约束 Reflection AI 扩大训练能力。


              监管合规负担是一把双刃剑。EU AI Act 于 2026 年分阶段执行，创造了对合规开放模型的需求，但也带来认证和治理基础设施成本，而多数企业尚未建立这些能力。多数组织缺乏成熟的自治 AI
              智能体治理模型，只有五分之一的公司拥有足够的监督框架。


              训练成本和资本强度为新进入者设置了结构性壁垒，也限制了竞争供给。训练和微调大型基础模型需要 GPU 集群，单个模型运营支出超过 $10M。这造成集中化动态：只有少数资本充足的实验室能以前沿规模运营。


              相互矛盾的市场估算：基础模型市场规模估算从 $1.38B（IntelMarketResearch 窄口径核心）到 $10.6-12B（Research and Markets），再到 $120B+（2030
              年更宽生态系统预测），差异达 87 倍，反映出不可调和的范围定义。企业 AI 采用率同时被报告为 78%（McKinsey，至少一个职能）和 64%（NVIDIA 调查，运营中主动使用 AI），14
              个百分点差距来自不同调查方法。开源 AI 模型约占生产中模型使用量的 20%，但开源 AI 模型市场估值为 $23B；看似矛盾，实则因为市场价值包括基础设施、集成服务和企业支持收入，而不是原始推理量。
