  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - Series C 状态和资本充足性
        - 确认的完成日期、投资者名单、最终投前估值和交割后现金余额
        - 资本充足性关乎生死：按 7 月之后烧钱速度，若无 Series C，跑道仅 9–17 个月
        - 要求公司直接确认；监控 SEC Form D 备案和新闻
      - - 首个前沿模型表现和时间表
        - 对比 Llama 4.5、Mistral Large 2、GPT-5 等价模型的基准结果；算力效率指标
        - 论点取决于公司能否发布一个相对免费开放权重替代品具备可衡量竞争力的模型
        - 要求获得私有模型演示权限或早期访问协议；投资前必须披露基准
      - - 政府管线和合同金额
        - DoE Genesis Mission 合同金额；Pentagon AI 项目范围；韩国 JV 收入和时间表
        - 收入质量和时间点；主权 AI 论点需要合同收入，而不是只有 MOU
        - 要求管理层在 NDA 下展示 LOI / 合同条款和管线
      - - 股权结构和清算优先权结构
        - 完整股本表；Series B 清算优先权类型和金额；反稀释条款
        - $2B Series B 的参与型优先股可能在持平 / 下行退出中吃掉大部分 Series C 上行
        - 将披露完整股本表和 Series A / B / C 条款清单作为投资条件
      - - 董事会构成和治理
        - 独立董事；投资者董事会代表；保护性条款；审计职能
        - 公司尚无收入却估值 $25B，且缺乏公开问责，治理风险偏高
        - 将董事会观察员权利或任命独立董事作为投资条件
      - - 单位经济和财务模型
        - CAC、LTV、毛利率、企业合同规模和收入爬坡的内部假设
        - 验证或推翻场景假设；若没有模型，所有场景分析都只是没有约束的猜测
        - 管理层会议；作出任何承诺前，要求提供一份披露假设的 3 年财务模型
    notes: 尽调主题反映截至 2026 年 6 月 28 日公开证据的缺口；优先级权重为分析师判断，可能不反映公司自身披露时间表。
