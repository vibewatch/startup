      - number: '5.3'
        title: 部署、集成与路线图
        blocks:
          - type: paragraph
            body: >-
              Asimov 部署在客户的虚拟私有云内，因此所有摄取数据——代码、通信和文档——都留在客户自有基础设施中。这种 VPC 优先模式直接回应企业数据主权顾虑，也是监管行业和政府部署的架构基础。部署仍具选择性：自
              2025 年 7 月发布以来，Reflection 一直逐个接入工程团队；截至运行日期，公司尚未宣布全面可用。

              Reflection 的算力基础设施由一笔与 SpaceX 的 $6.3B 交易锚定：从 2026 年 7 月到 2029 年，公司每月支付 $150M，使用田纳西州孟菲斯附近 Colossus 2 数据中心的
              Nvidia GB300 GPU。Colossus 2 设施最初由 xAI 建设，如今租给头部 AI 实验室；继 Anthropic 和 Google 之后，Reflection
              是第三家加入的主要实验室。初始三个月之后，任一方可提前 90 天通知退出。该交易被描述为迄今最大的开放 AI 基础设施承诺之一，并提供训练前沿规模 MoE 模型所需算力。

              公司的两步超级智能路线图，是先交付一个超级智能自主编码系统，再把这套蓝图扩展到所有基于计算机的工作。首个开放权重前沿文本模型原定 2026 年初推出，但仍未发布。多模态能力规划在未来世代加入。政府部署已在推进：在
              Genesis Mission 下，Reflection 是 DOE 17 个国家实验室的基础智能层；已获 Pentagon IL6/IL7 机密网络许可；并与 Shinsegae Group 签署
              MOU，为韩国一座 250 兆瓦主权 AI 工厂提供模型和全栈工程。
