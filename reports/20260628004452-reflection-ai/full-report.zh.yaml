      - number: '7.5'
        title: 执行、人才与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 由两个人创立：Misha Laskin（CEO）和 Ioannis Antonoglou（CTO），二人均曾在 Google DeepMind 工作；截至 2026 年中，公司约
              60–80
              人。机构知识高度集中在两位创始人身上，形成二元关键人物风险：任一创始人离开，都可能显著削弱公司执行前沿模型路线图、重谈机构合同或维持投资者信心的能力。公司没有披露董事会层面的继任计划，除两位创始人外没有公开任命的高管团队，也没有证据显示
              CTO 之下有足够深的运营或科研领导层。

              2026 年 AI 人才市场竞争达到历史高点。为招募前沿研究员，Meta 据称开出了六年最高 $1.5B 的个人激励包。xAI 人才外流——2026 年初有 80 多名研究员离开——说明即使资金充足、且有
              Elon Musk 光环的实验室，文化、工作强度或方向不匹配时也留不住人。以 Reflection 目前团队规模，10–15 名核心研究员离开就会吃掉相当一部分技术产能。公司依赖强化学习专长（Antonoglou
              的专长），如果 RL 团队集中流失，技术路径可能整体脱轨，因为改用其他训练范式需要大幅重定向研究项目。

              执行风险进一步放大人才风险：Reflection 自 2024 年 3 月成立以来尚未发布公开产品；截至运行日已超过 27 个月。2025 年 10
              月的公开博客仍是最近一次公开研究沟通。市场批评其「开源」定义更像上市定位，而非真正开放承诺（仅开放权重，不开放训练代码或数据）。如果公司不能在 Series C
              资本周期结束前发布首个前沿模型，以当前估值证明产品市场契合的窗口会急剧收窄。TuringPost 采访 Antonoglou 时问到交付时间表，他的回答是「你还得等」；考虑到竞争对手发布速度，这一回答被认为不足。
