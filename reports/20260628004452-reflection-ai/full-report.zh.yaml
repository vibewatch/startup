      - number: '8.3'
        title: 融资背景与股权结构压力
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 10 月 Series B，Reflection AI 已融资 $2.13B+；另有一个包含 2025 年 9 月中间交割的数据点为 $3B。如果 Series C 以 $2.5B
              交割，累计融资将达到约 $4.6B，使 Reflection 成为有记录以来融资最重的未收入 AI 创业公司之一。投资者池覆盖战略方（Nvidia：$800M）、机构
              VC（Sequoia、Lightspeed、DST Global、B Capital、CRV）、主权 / 政府相邻资本（GIC Singapore），以及成长 / 跨界投资者（Disruptive AI、1789
              Capital、Eric Schmidt、Eric Yuan、Citigroup、JPMorgan 的 Security and Resiliency Initiative）。

              股权结构和清算优先权细节未披露，这是重大尽调缺口。以 $8B 投后估值融资 $2B 的标准 Series B 文件，通常带有 1
              倍非参与型清算优先权和反稀释条款；在极端估值中越来越常见的参与型优先股结构，可能在温和退出或降价轮情景下吸收不成比例的退出收益，让 Series C 投资者和普通股持有人落后。2026 年 5–6 月多份二级市场
              SPV 备案（HII Reflection AI Series I；ID8 Growth Opportunities Reflection AI）确认，机构需求对应的估值仍与 $8–25B
              一级市场区间一致，也暗示尽管商业产品尚未发布，二级价格并未崩塌。

              Finro 2026 年 Q1 数据记录的 AI 创业公司倍数压缩现象——前沿 AI 智能体的 Series B 中位数倍数为 39–41 倍，到 Series C 压缩至 26 倍——说明即便按披露的 $25B
              Series C 估值，若套用于任何可信的近期收入估计，Reflection 也会显著高于市场出清的前沿倍数。没有收入时，倍数在技术上没有定义；估值完全按选择权定价。投资者必须用战略入场价格评估
              $25B，而不是用基本面收入倍数。
