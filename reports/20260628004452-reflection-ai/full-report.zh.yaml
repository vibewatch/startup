      - number: '1.4'
        title: 产品、技术栈与市场牵引
        blocks:
          - type: paragraph
            body: >
              Reflection AI 的第一款产品是 Asimov，一个多智能体代码理解工具，于 2025 年 7 月公开推出。不同于标准代码生成器，Asimov 被设计成可以摄取完整代码库、架构文档、GitHub
              讨论、Slack
              消息、电子邮件和项目历史，为工程团队搭建持久的组织记忆。系统采用检索器—组合器多智能体架构：多个小型长上下文检索智能体从大型代码库中收集相关片段，再交给一个大型推理智能体综合成连贯答案。Asimov
              部署在客户虚拟私有云内，所有数据都留在客户基础设施中。

              在公司主导的盲测中，处理大型开源项目的开发者 82% 的时候更偏好 Asimov 的答案，而 Anthropic 的 Claude Code 为 63%。不过，MIT 计算机科学家 Daniel Jackson
              提醒，这种方法的收益尚未被广泛独立研究证明，系统读取私人通信可能增加计算成本并带来安全风险。这构成了产品主张验证上的重要反向信号。当前版本的 Asimov 使用第三方开源模型；Reflection
              正在训练自有模型，最终为 Asimov 和计划中的前沿模型发布提供动力。

              公司已经搭建起大规模 LLM 和强化学习平台，能够以前沿规模训练 Mixture-of-Experts 模型——这种能力此前只掌握在最大型封闭 AI 实验室手中。截至 2026 年 6 月 28
              日，公司尚未发布公开的前沿开放权重模型。计划中的前沿模型预计将用数十万亿 token 训练，并预计在 2026 年晚些时候发布。
