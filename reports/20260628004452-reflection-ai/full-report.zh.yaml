      - number: '2.4'
        title: 增长驱动因素
        blocks:
          - type: paragraph
            body: >
              五股结构性力量正在加速对开放、可主权部署基础模型的需求。


              主权 AI 政策正从政府愿景转化为预算现实。Gartner 预测，到 2028 年，65% 的政府将引入技术主权要求；71% 的政府领导者已经认为智能体 AI 将加速政府采用（IDC/Dell）。EU AI
              Act 自 2026 年开始分阶段执行，正在创造对可解释、可审计模型的具体需求，而专有黑箱 API 无法满足这一点。


              封闭模型访问风险在 2026 年 6 月骤然升温：Anthropic 在白宫压力后限制模型访问，立刻引发企业关于迁移到开放模型的讨论。单一事件验证了 Reflection AI
              的核心市场命题：独家依赖封闭模型，会让企业和政府暴露在不可接受的运营风险下。Reflection 发言人也直接把这点作为 SpaceX 算力交易的理由。


              开源模型能力已经基本追平专有系统。Meta Llama 4/5、DeepSeek V3/V4 和 Mistral Large 3 在标准基准上已经达到或接近封闭模型表现；开放模型约占生产中模型使用量的
              20%，但运营成本低 10-30 倍。IBM 和 Red Hat 于 2026 年 5 月承诺向开源 AI 投入 $5 billion，释放出机构背书信号。


              企业 AI 支出加速正在扩大漏斗。2026 年企业 GenAI 支出达到 $127B，且同比增长 59%，选择模型底座的企业管线正在快速扩张。智能体 AI 工作流——IDC 估计到 2028 年超过 40%
              的企业应用将受益于此——需要模型定制和推理成本控制，而开放模型比按 token 计费的封闭 API 更能提供这些能力。


              Reflection AI 于 2026 年 6 月签署的 $6.3B SpaceX Colossus 2 交易保障了算力安全，使公司能够以前沿规模训练，并为发布首个公开前沿模型、直接竞争 hyperscale
              训练模型创造条件。这降低了此前推迟商业模型发布的主要技术风险。
