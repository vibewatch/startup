      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 论点失效情景：Series C 交割失败
            body: >-
              如果 $2.5B Series C 未能在 2026 年 7 月 1 日算力义务起始日后约 90 天内交割，Reflection AI 将面临急性现金跑道危机。没有收入、每月烧钱 $150M
              的情况下，若没有过桥融资，公司披露的 Series B 后 $130M 现金储备不足一个月就会耗尽。这不是投机性风险，而是有明确日历约束的算术问题。投资者若考虑以 $25B 估值入场，必须先给 Series C
              交割概率定价，再做任何其他分析。
            calloutType: risk
