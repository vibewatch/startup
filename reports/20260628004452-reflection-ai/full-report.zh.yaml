      - number: '6.4'
        title: 扩张、集中风险与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 两项公开确认的“生产阶段”客户关系——DOE 和
              DOD——在当前阶段几乎全部集中于美国联邦政府渠道。若任一关系停滞、在联邦预算周期变化中被降级优先级，或遭遇竞争性替代，Reflection AI 将没有公开确认的商业客户基础来支撑运营。Shinsegae
              韩国交易是渠道合作，不是直接客户，并取决于 Shinsegae 向韩国政府和企业终端用户销售的能力——这是第二层渠道风险。

              Go-to-market 渠道依赖集中在三个基础设施和分销伙伴上：SpaceX（通过 $6.3B Colossus 2 交易提供算力）、NVIDIA（通过约 $800M Series B 投资提供芯片和背书）和
              Shinsegae（韩国市场准入）。NVIDIA 的战略利益制造了隐性分销优势——NVIDIA 将开放权重模型验证为一种主权 AI 玩法，并拥有强企业关系——但这也意味着 Reflection AI 的早期
              go-to-market 部分受战略投资者控制，而非独立销售控制。GMI Cloud 以美国和亚洲布局提供 GPU-as-a-service 交付渠道，增加部署选项。

              Asimov 的落地—扩张逻辑在结构上可成立：一次索引代码库的 VPC
              部署会制造切换成本，从而推动席位扩张。但由于没有披露初始客户，公开层面上“落地”这一步尚未发生。企业客户的采购摩擦很高：公司没有全面可用产品，Asimov waitlist
              据称失效，买方还必须为一个母公司尚未发布前沿模型的工具，证明每名用户每年 $25,000 的投入合理。联邦采购更慢、合规负担更重，但 DOE 和 DOD 交易说明 Reflection AI
              能走通这条路径。关键风险在于，政府项目本身是战略验证，而非可规模化商业收入渠道。
