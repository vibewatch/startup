      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              三种情景框定了 $25B Series C 投资者在 2029–2030 年、4–5 年周期内可能面对的可信结果区间。牛市情景要求 Reflection 在 2026 年 H2 发布具备商业竞争力的前沿模型，以
              $25B 交割 Series C，并在 2030 年前把政府和企业管线转化为 $2B+ ARR。按 30 倍远期收入计算，对应 $60B–$120B 企业价值；以 Series C 入场价计，回报为
              2.4–4.8 倍。基准情景假设 Series C 交割（投前估值可能下调）、模型在 2027 年 Q1 发布、主权 AI 收入到 2029 年爬升至 $750M–$1B ARR；按 20–25
              倍计算，企业价值为 $15B–$35B，约等于 Series C 入场价附近。熊市情景则是 Series C 融资失败、模型发布显著落后计划，或开放权重商品化削弱 Reflection 价值主张；此时，$5–8B
              降价轮或困境出售构成预期底部。

              估值敏感性图（FV002）展示了在 Series C 入场价下，支撑不同市场出清倍数所需的收入。按 30 倍倍数，收入低于 $833M 就无法从基本面支撑 $25B
              标记。回报区间图（FV003）可视化了三种情景下的结果。跟踪这些情景最相关的概率信号包括：Series C 交割日期和条款；首个模型基准发布；首份披露收入的政府合同；以及季度算力消耗与收入爬坡比率。
