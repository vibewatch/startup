  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层与战略重点
        blocks:
          - type: paragraph
            body: >-
              Reflection AI 面向三个清晰客户群，每个群体的购买标准、采购路径和证据水平都不同。第一也是最高优先级的群体，是大型企业——具体包括 Fortune 500
              公司的软件工程组织、受监管金融机构、医疗系统和能源公司——它们需要可定制、可审计、运行在自有基础设施上的 AI，且不依赖封闭的美国 API 提供商或中国开放权重模型。瞄准这一群体的主要产品是
              Asimov，一个代码理解与自主编码代理；据称价格为每名用户每年 $15,000–$25,000，部署在客户 VPC 内以确保数据主权。

              第二个群体是主权政府和盟友国家。Reflection AI 的论点是，受数据驻留法规、安全密级要求或对中国 AI
              的地缘政治限制约束的政府，需要一个可信、开放权重、由美国提供的前沿模型，并能运行在国家级基础设施上。韩国 Shinsegae 合作（2026 年 3 月）是首个已确认的国际实例，目标是通过一座 250 MW 主权
              AI 云工厂服务韩国政府机构和企业。

              第三个群体是美国联邦政府，Reflection 通过 DOE Genesis Mission（2026 年 5 月）和 Pentagon 机密网络协议（2026 年 5
              月）服务该群体。这些项目主要是研究、安全和任务就绪合同，而不是商业 SaaS 订阅。第四个新生群体——开源开发者社区——仍完全停留在愿景阶段：Reflection AI 尚未发布公开前沿模型，GitHub
              公开存在感也很弱，开发者只能等待正式发布。公司的 Series B 投资方 Citigroup 被认为是潜在企业金融行业客户，但尚未宣布客户关系。收入预计来自企业部署、主权 AI
              许可和政府合同，但没有任何一项被公开确认。
