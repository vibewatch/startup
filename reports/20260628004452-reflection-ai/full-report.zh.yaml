  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              2026 年中期的前沿 AI 模型市场，由一条清晰分叉定义：一边是 OpenAI、Anthropic 和 Google DeepMind 等封闭源 API 供应商，它们保持前沿能力领先并收取溢价；另一边是
              Meta、DeepSeek、Mistral、xAI 和 Cohere 等开放权重挑战者，它们正在压缩能力差距和推理成本。到 2026 年 5 月，最佳开放权重模型（Kimi K2.6）在 Artificial
              Analysis Intelligence Index 上得分 54，而最佳封闭模型为 57，这是该类别历史上最小差距。DeepSeek 的 V3 模型训练成本约 $5.5 million，并在多数基准上匹配
              GPT-4o，证明前沿开放权重模型不再需要 hyperscaler 级预算。仅 2026 年 4 月至 5 月，Moonshot、Z.ai、DeepSeek、Xiaomi、Google、Alibaba 和 Ant
              Group 就发布了多个新的开放权重模型，显示前沿已经按月推进。Reflection AI 属于开放权重阵营，定位独特：为中国开放权重模型提供美国原生、主权级替代方案，也在政府和企业需要可审计、可自托管 AI
              时，成为封闭源实验室的西方替代品。公司组建了背景横跨 PaLM、Gemini、AlphaGo、AlphaCode 和 AlphaProof 的非凡团队，并已在两轮融资中筹集 $4.5 billion——2025
              年 10 月以 $8 billion 估值融资 $2 billion，以及 2026 年 3 月目标以 $25 billion 估值融资 $2.5 billion——另有 2026 年 7 月开始的 $6.3
              billion SpaceX 算力承诺。但公司尚未发布任何公开前沿模型，因此目前主要是在定位、团队和算力获取上竞争，而不是靠已证明的模型质量。本章将两大阵营中的八类主要竞争者逐一映射。
