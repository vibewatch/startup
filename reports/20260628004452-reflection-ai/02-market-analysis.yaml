callouts:
  - calloutType: insight
    title: Sovereign AI Window Is Narrow and Accelerating
    body: >-
      The combination of 52% of government leaders planning sovereign AI investments within
      12-18 months, the June 2026 Anthropic model access restriction, and Reflection AI's DOE
      Genesis Mission contract creates a compressed, high-stakes window to establish trusted
      open-model relationships with governments before incumbent hyperscalers lock in those
      relationships through sovereign cloud offerings. Reflection AI's credibility depends on
      releasing a public frontier model before this window closes.
    claimRefs:
      - CM020
      - CM029
      - CM030
      - CM031

  - calloutType: risk
    title: Enterprise ROI Crisis Threatens Market Growth Assumptions
    body: >-
      Despite $127B in enterprise GenAI spending in 2026, only 29% of investing companies
      report significant ROI and 42% abandoned most AI projects in 2025. If enterprise AI
      spending growth is driven by experimentation rather than committed production deployment,
      foundation model market demand may be significantly more volatile and cycle-sensitive
      than the published CAGR forecasts suggest. Reflection AI should monitor pilot-to-production
      conversion rates closely as leading indicators of market health.
    claimRefs:
      - CM011
      - CM032
      - CM033
      - CM035

