  - id: adoption-constraints
    title: Adoption Constraints and Contradictory Estimates
    body: |
      Despite strong macro tailwinds, several structural constraints limit near-term adoption
      of foundation model services and must be modeled carefully in any market assessment.

      The Enterprise ROI Gap is the most consequential constraint. Only 29% of companies
      investing in generative AI report significant ROI, and 42% abandoned most AI initiatives
      in 2025 (up from 17% the prior year). Gartner predicts 60% of AI projects will be
      abandoned through 2026 due to lack of AI-ready data infrastructure. The average enterprise
      runs 14 AI projects simultaneously but fewer than half deliver measurable business value.
      This pilot-purgatory pattern suggests that enterprise AI spending growth does not translate
      linearly into foundation model procurement; many buyers are still spending on experiments
      rather than committed production deployments.

      Power and Infrastructure Constraints have shifted AI's binding constraint from chip supply
      to electricity. Microsoft, Google, Amazon, and Meta plan to spend over $320B on AI
      infrastructure in 2026, with more than 60% of that capex going to power infrastructure,
      cooling, and data center construction rather than compute hardware. Data center power demand
      from AI is projected to reach 1,000 TWh globally by 2026—equivalent to Germany's entire
      electricity consumption. Approximately 40% of announced AI data center projects face
      construction delays due to power bottlenecks, not chip supply. This constrains Reflection
      AI's ability to scale training capacity even with the SpaceX compute deal in place.

      Regulatory Compliance Burden is a double-edged constraint. The EU AI Act's phased
      enforcement in 2026 creates demand for compliant open models but also imposes certification
      and governance infrastructure costs that most enterprises have not yet built. Most
      organizations lack mature governance models for autonomous AI agents, with only 1 in 5
      companies having adequate oversight frameworks.

      Training Cost and Capital Intensity impose structural barriers to new entrants and limit
      competitive supply. Training and fine-tuning large foundation models demands GPU clusters
      with operational expenditures exceeding $10M per model. This creates a concentration
      dynamic where only a small number of well-capitalized labs can operate at frontier scale.

      Contradictory Market Estimates: Foundation model market size estimates range from $1.38B
      (IntelMarketResearch narrow core) to $10.6-12B (Research and Markets) to $120B+ (broader
      ecosystem projection for 2030)—an 87x variation reflecting irreconcilable scope definitions.
      Enterprise AI adoption is simultaneously reported at 78% (McKinsey, at least one function)
      and 64% (NVIDIA survey, actively using AI in operations), with the 14-point gap reflecting
      different survey methodologies. Open-source AI models capture approximately 20% of model
      usage in production, yet the open-source AI model market is valued at $23B—a seeming
      contradiction explained by the fact that market value includes infrastructure, integration
      services, and enterprise support revenue, not raw inference volume.
