  - id: growth-drivers
    title: Growth Drivers
    body: |
      Five structural forces are accelerating demand for open, sovereign-ready foundation models.

      Sovereign AI policy is converting from governmental aspiration to budget reality. Gartner
      predicts 65% of governments will introduce technological sovereignty requirements by 2028;
      71% of government leaders already believe agentic AI will accelerate adoption in government
      (IDC/Dell). The EU AI Act—beginning phased enforcement in 2026—is creating concrete demand
      for explainable, auditable models that proprietary black-box APIs cannot satisfy.

      Closed-model access risk became acute in June 2026 when Anthropic restricted model access
      following White House pressure, triggering immediate enterprise discussion about open-model
      migration. This single event validated Reflection AI's core market thesis: exclusive
      dependency on closed models exposes enterprises and governments to unacceptable operational
      risk. Reflection's spokesperson directly cited this as rationale for the SpaceX compute deal.

      Open-source model capability parity with proprietary systems has been largely achieved.
      Meta Llama 4/5, DeepSeek V3/V4, and Mistral Large 3 now match or approach closed-model
      performance across standard benchmarks, with open models capturing approximately 20% of
      model usage in production but at 10-30x lower operating cost. IBM and Red Hat pledged
      $5 billion to open-source AI in May 2026, signaling institutional buy-in.

      Enterprise AI spending acceleration is creating a larger funnel. With $127B in enterprise
      GenAI spending in 2026 growing at 59% YoY, the pipeline of enterprises selecting a model
      substrate is expanding rapidly. Agentic AI workflows—where IDC estimates over 40% of
      enterprise applications will benefit by 2028—require the model customization and inference
      cost control that open models enable better than per-token closed API pricing.

      Compute security through Reflection AI's $6.3B SpaceX Colossus 2 deal (June 2026) enables
      training at frontier scale, positioning Reflection to release its first public frontier model
      and compete directly with models trained at hyperscale. This reduces the primary technical
      risk that had delayed commercial model release.
