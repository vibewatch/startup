  - id: TM004
    title: Growth Drivers and Adoption Constraints — Foundation Model Market
    columns:
      - Factor
      - Type
      - Direction / Timing
      - Implication for Reflection AI
      - Diligence Ask
    rows:
      - - Sovereign AI policy momentum
        - Driver
        - Accelerating — 2026-2028
        - Expands addressable government and regulated-enterprise pool; validates open-weight thesis
        - Confirm government procurement timelines and budget cycles in target geographies
      - - Closed-model access risk (Anthropic June 2026 incident)
        - Driver
        - Acute — Q2 2026; ongoing
        - Accelerates enterprise migration intent to open models; near-term sales catalyst
        - Quantify conversion rate from intent to signed agreements in H2 2026
      - - Open-source model capability parity
        - Driver
        - Sustained — 2025 through 2026
        - Eliminates technical objection to open models; enables enterprise deployment without capability trade-off
        - Track benchmark leadership relative to Llama, Mistral, DeepSeek on enterprise tasks
      - - Enterprise GenAI spending growth (+59% YoY, $127B)
        - Driver
        - Current — 2026
        - Creates larger funnel of buyers evaluating model substrate; growing total addressable pool
        - Model Reflection AI's penetration rate within GenAI spend as frontier model is released
      - - Agentic AI workflow transition
        - Driver
        - Emerging — 2026-2027
        - Favors open models for cost/customization at agent-call scale; IDC projects 40%+ of enterprise apps benefit
        - Estimate per-agent token economics vs per-token closed API cost at enterprise scale
      - - EU AI Act enforcement (2026 phase-in)
        - Mixed driver / constraint
        - Active — 2026+
        - Creates explainability demand favoring auditable open models; adds compliance cost burden
        - Track enforcement guidance for high-risk AI applications under the Act
      - - Enterprise ROI gap (only 29% significant ROI)
        - Constraint
        - Persistent — ongoing
        - Slows procurement cycles; pilot-purgatory limits conversion from evaluation to production agreements
        - Monitor abandonment rate trend into H2 2026 to assess whether it stabilizes or worsens
      - - Power and infrastructure bottleneck
        - Constraint
        - Current — 2026-2028
        - Constrains both Reflection AI training scale and customer deployment capacity; 40% of projects delayed
        - Verify SpaceX Colossus 2 deal execution and power delivery timeline for July 2026 ramp
      - - Data readiness barrier
        - Constraint
        - Persistent — ongoing
        - Delays enterprise decision to deploy models in production; 60% of AI projects abandoned due to data issues
        - Identify whether Reflection AI plans data-readiness partnerships or integrations
      - - Training cost and capital intensity ($10M+ per frontier model)
        - Constraint
        - Structural
        - Creates concentration — only well-capitalized labs can sustain frontier training; limits competitive supply
        - Monitor Reflection AI burn rate relative to compute commitments and capital raised
    notes: >-
      Severity and timing assessments are based on analyst consensus from Gartner, IDC, McKinsey,
      and primary reporting. Factors are not independent — the ROI gap, data readiness barrier,
      and organizational change challenges are mutually reinforcing. The June 2026 Anthropic
      incident is the most acute near-term catalyst and is specific to the current moment.
