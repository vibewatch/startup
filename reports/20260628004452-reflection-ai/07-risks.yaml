chapter:
  number: 7
  title: Risks
  summary: >-
    Reflection AI faces a cascading set of existential and material risks rooted in its pre-commercial
    state: zero revenue against a $150M/month compute obligation beginning July 1, 2026; a $2.5B Series C
    not yet closed as of the run date; a single-site, single-vendor compute dependency on SpaceX's
    Colossus 2 facility; open-weight model release obligations that create irreversible IP exposure;
    and an unprecedented precedent—the June 2026 Anthropic export-control ban—demonstrating that the
    U.S. government can disable a commercially deployed frontier model mid-cycle. Combined with an
    intensifying AI copyright litigation wave, EU AI Act GPAI obligations active from August 2026,
    sovereign AI partner execution uncertainty, and a thin founding team in one of the most competitive
    talent markets in history, the risk profile at the current $25B valuation is high.

sections:
  - id: financial-model-risk
    title: Financial and Model Risk
    body: >-
      Reflection AI's financial risk profile is among the most acute of any AI startup in 2026. The company
      has no confirmed revenue as of the run date, has raised approximately $2.13B+ across three rounds, and
      is simultaneously committing $150M per month to SpaceX beginning July 1, 2026 — a contractual burn
      rate that would exhaust the entire Series B proceeds in roughly 13 months if no new capital arrives.
      The Series C ($2.5B at a reported $25B pre-money valuation) was described in March 2026 reporting as
      being "in advanced talks" with JPMorgan as a potential anchor, but has not closed as of the run date.
      Any closing delay extends the window during which the company operates with pre-commercial revenue
      against a large fixed infrastructure obligation.

      The compute commitment structure introduces a second order of financial risk: if the Series C closes
      at a lower valuation or with unfavorable terms, the $150M/month obligation remains regardless.
      SpaceX's 90-day exit clause means Reflection can theoretically walk away, but doing so mid-training-run
      would disrupt model development and destroy sunk compute spend. The U.S. Federal Reserve formally
      listed AI as a systemic financial risk in 2026, and analysts at multiple institutions have identified
      the sector's investment-to-revenue gap — estimated at approximately 4:1 — as a classic pre-correction
      signal. For pre-revenue companies at Reflection's valuation, the correction risk is acute: any
      negative signal (delayed model release, failed enterprise contract, political intervention) could
      trigger a down round or loss of investor confidence, compressing valuation from the $25B anchor.

      The capital structure also creates a circular risk: Nvidia invested $800M in Reflection and is the
      primary chip provider at Colossus 2. If Nvidia reallocates compute priorities or modifies GB300
      allocation policies — whether for commercial or political reasons — Reflection faces simultaneous
      supplier and investor pressure from a single counterparty. The SpaceX-Nvidia-Reflection triangle
      is not an arms-length market relationship; it is a vertically aligned dependency chain with limited
      structural competition at the infrastructure layer.
