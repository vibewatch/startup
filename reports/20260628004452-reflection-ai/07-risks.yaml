callouts:
  - calloutType: risk
    title: "Thesis-Break Scenario: Series C Closure Failure"
    body: >-
      If the $2.5B Series C does not close within approximately 90 days of the July 1, 2026 compute
      obligation start date, Reflection AI faces an acute runway crisis. At $150M/month burn with no
      revenue, the company would exhaust its reported $130M post-Series B cash reserves in under a
      month without bridge financing. This is not a speculative risk — it is a time-bound arithmetic
      problem that resolves itself on a known calendar. An investor considering commitment at the $25B
      valuation must assign a probability to Series C close before taking any other analytical step.
    claimRefs:
      - CR001
      - CR002
      - CR003

  - calloutType: risk
    title: "Adverse Source Highlight: Turing Post and AI2.Work on Delivery Gap"
    body: >-
      Multiple independent analysts have identified Reflection AI's valuation as disconnected from
      its product reality. The TuringPost (March 2026) and AI2.Work analyses both emphasize that
      27+ months post-founding, the company has released no public frontier model, published no
      research papers, and kept its only commercial product (Asimov) behind an invite-only waitlist.
      AI2.Work's adversarial analysis describes the valuation surge as "all narrative and pedigree,
      with little real user or business traction." The Medium analysis (March 2026) notes the company
      "raised $4.6 billion without releasing a model" and frames the Series C as a market-confidence
      vote that has not yet closed. These represent genuine adverse market signals, not fringe criticism.
    claimRefs:
      - CR031
      - CR032
      - CR033

  - calloutType: insight
    title: "Anthropic Precedent as a Double-Edged Signal for Reflection"
    body: >-
      The June 2026 U.S. government export-control action against Anthropic created a genuine tailwind
      for Reflection's sovereign open-source AI positioning — but simultaneously demonstrated that the
      U.S. government is willing and legally empowered to intervene in frontier model deployment without
      legislative process. For Reflection, this is both a market opportunity (enterprises and sovereigns
      reassessing closed-model dependency) and a regulatory threat (open-weight releases cannot be
      recalled, and any misuse event could trigger a similar or more complex enforcement action).
      Investors should not treat Reflection's post-Anthropic-ban positioning as inherently protective.
    claimRefs:
      - CR009
      - CR010
      - CR015

