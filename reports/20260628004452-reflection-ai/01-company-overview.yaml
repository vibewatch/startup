callouts:
  - calloutType: strength
    title: World-class RL and frontier AI team with proven DeepMind pedigree
    body: >-
      Both founders led or contributed to the most important AI breakthroughs of the last decade at
      DeepMind. The team's collective history on Gemini, AlphaGo, and frontier LLM training gives
      Reflection credibility to execute on its frontier model plans that few other startups could claim.
    claimRefs:
      - CO009
      - CO012
      - CO013
      - CO014
  - calloutType: risk
    title: No public frontier model despite $2B+ raised and $6.3B compute commitment
    body: >-
      Reflection AI has raised more capital than most frontier AI startups in a single year, yet as
      of June 28, 2026, no open-weight frontier model has been released. The $150 million per month
      compute commitment beginning July 2026 implies cash burn of $1.8 billion per year from compute
      alone. Execution risk is real if the first model does not achieve competitive performance with
      DeepSeek, Llama, or Mistral equivalents.
    claimRefs:
