company:
  name: Reflection AI
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Reflection AI is a Brooklyn-based open-source frontier AI company founded in March 2024 by former
    Google DeepMind researchers Misha Laskin (CEO) and Ioannis Antonoglou (CTO). The company raised
    $2 billion at an $8 billion valuation in October 2025, secured a $6.3 billion SpaceX compute
    deal in June 2026, and partnered with the U.S. Department of Energy, but has yet to release a
    public frontier model as of the run date.
sections:
  - id: identity-mission-operating-model
    title: Identity, Mission, and Operating Model
    body: >
      Reflection AI is an American AI company headquartered in the Williamsburg neighborhood of Brooklyn,
      New York. The legal entity Reflection AI, Inc. was incorporated on February 12, 2024, and the company
      formally launched in March 2024. As of the run date the company is at the Series B funding stage and
      remains private, with no public financials, IPO filing, or regulatory disclosure. Its website
      describes the mission as building "frontier open intelligence and making it accessible to all."

      The operating model separates access from development. Reflection plans to release trained model
      weights publicly for research and developer use while keeping training pipelines and datasets
      proprietary—mirroring Meta's Llama and Mistral's approach. The target customer segments are large
      enterprises requiring customizable, auditable AI they can run on their own infrastructure, and
      sovereign governments that cannot depend on either closed U.S. labs or Chinese providers due to
      legal and security constraints. Misha Laskin, the CEO, has described this as a response to a
      "modern day Sputnik moment" driven by Chinese open-source AI advances from DeepSeek, arguing that
      the global default standard of intelligence must be built by America. White House AI and Crypto
      Czar David Sacks publicly endorsed the company's open-source mission after the October 2025
      funding announcement, reflecting alignment with U.S. policy priorities around AI sovereignty.
      Revenue is expected to come from enterprise deployments and government sovereign AI contracts
      rather than API consumption alone.
