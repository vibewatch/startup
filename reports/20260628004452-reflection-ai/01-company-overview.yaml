  - id: milestones-partnerships-adverse
    title: Milestones, Partnerships, and Adverse Context
    body: >
      Reflection AI's public milestone record is compressed into two and a half years but covers
      founding, major financing, product launch, and high-value government and infrastructure
      partnerships. The founding in March 2024 was quickly followed by the $130 million March 2025
      stealth emergence, the July 2025 Asimov launch, and the $2 billion October 2025 Series B.

      In 2026, the company secured two landmark partnerships. In May 2026, Axios reported exclusively
      that Reflection was named the AI model provider for the U.S. Department of Energy's Genesis
      Mission, a federal initiative to accelerate scientific research, serving as the foundational
      intelligence layer for all 17 U.S. National Laboratories. The company also signed a deal to
      deploy its AI on Pentagon classified networks. In June 2026, Reflection signed a compute
      agreement with SpaceXAI for access to Nvidia GB300 chips at the Colossus 2 data center, paying
      $150 million per month starting July 1, 2026 through 2029 for a total commitment up to $6.3
      billion—the largest announced open AI infrastructure commitment to date. Internationally, the
      company announced a partnership with South Korea's Shinsegae Group to build a Korean sovereign
      AI cloud.

      The key adverse fact remains the absence of any public frontier model as of the run date, despite
      more than $2 billion in raised capital and a $6.3 billion compute commitment. Hugging Face CEO
      Clem Delangue acknowledged the October 2025 raise as "great news for American open-source AI"
      but publicly flagged "the challenge will be to show high velocity of sharing of open AI models
      and datasets," referencing the competitive pace from Chinese open-source labs. The $150 million
      per-month SpaceX commitment beginning July 2026 implies a minimum annualized compute burn of
      $1.8 billion from compute alone before headcount and operations costs. No lawsuits, regulatory
      enforcement actions, or governance disputes have been identified in public sources as of the run date.
