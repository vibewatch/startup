  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: financials
      missingEvidence: >-
        Revenue, ARR, gross margin, burn rate, and customer count. Reflection AI is a private company
        and has made no public financial disclosures.
      whyItMatters: >-
        Without financial metrics, the business model's commercial scalability and unit economics
        cannot be assessed. The sustainability of the open-source model requires evidence of enterprise
        revenue conversion that is entirely unverified at this stage.
      diligencePath: >-
        Request audited financials, customer cohort data, and enterprise contract details under NDA
        during investor due diligence.
      relatedQuestionRefs:
        - QO012
    - type: missing-source
      severity: material
      topic: frontier-model
      missingEvidence: >-
        Technical specifications, architecture, parameter count, training data, and release timeline
        for Reflection AI's planned frontier open-weight model.
      whyItMatters: >-
        The company's core value proposition—competing with DeepSeek and frontier closed labs—depends
        on releasing a model that achieves competitive benchmark performance. Without a released model,
        the frontier AI thesis is unverified.
      diligencePath: >-
        Monitor for model release announcements and benchmark results in H2 2026; assess third-party
        evaluations against Llama, Mistral, and DeepSeek equivalents upon release.
      relatedQuestionRefs:
        - QO023
      relatedTableRefs:
        - TO004
    - type: private-evidence-only
      severity: minor
      topic: headcount
      missingEvidence: >-
        Official headcount as of the run date. Third-party databases and press statements provide
        estimates of 60 (Oct 2025) and approximately 111 (Feb 2026), but no official figure exists.
      whyItMatters: >-
        Headcount trajectory is a proxy for scaling pace and burn rate; material undercount or overcount
        would affect the cost and runway analysis.
      diligencePath: >-
        Confirm with the company directly; LinkedIn employee count may provide an additional data point.
      relatedQuestionRefs:
        - QO010
    - type: private-evidence-only
      severity: minor
      topic: cap-table
      missingEvidence: >-
        Full cap table including individual ownership percentages, preference stack, liquidation rights,
        angel investors, secondary transactions, and option pool size. Only publicly confirmed institutional
        investors from press and legal filings are included in the stakeholder table.
      whyItMatters: >-
        Without the full cap table, economic dilution, control provisions, and liquidation preference
        overhangs cannot be modeled. The partially complete investor list may omit early angels or
        insider secondaries that affect founder alignment.
      diligencePath: >-
        Request capitalization table and supporting schedule of preferred shares and common option pool
        from the company during investor due diligence.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO003
    - type: missing-source
      severity: minor
      topic: comparison
      missingEvidence: >-
        Detailed comparison of Reflection AI's open-source strategy versus Meta Llama, Mistral, and
        DeepSeek in terms of open-source scope (training code, data, weights), business model, and
        commercial traction.
      whyItMatters: >-
        Without comparative evidence, the claim that Reflection is a viable third option between
        closed U.S. labs and Chinese open-weight providers cannot be fully evaluated.
      diligencePath: >-
        Analyze published model cards, licensing terms, and enterprise revenue disclosures from Meta
        Llama, Mistral, and DeepSeek once Reflection's frontier model is released.
      relatedQuestionRefs:
        - QO018
    - type: private-evidence-only
      severity: minor
      topic: governance
      missingEvidence: >-
        Board composition, investor board seats, governance documents, and executive team below the
        co-founder level (VP Engineering, VP Research, etc.).
      whyItMatters: >-
        Governance opacity creates key-person risk; with only two named executives, the company's
        resilience to founder departure is unassessable.
      diligencePath: >-
        Request org chart, board observer rights, and governance documents in due diligence.
      relatedQuestionRefs:
        - QO024
      relatedTableRefs:
        - TO002
