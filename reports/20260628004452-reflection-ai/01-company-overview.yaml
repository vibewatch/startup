  - calloutType: assumption
    title: Open-source business model sustainability depends on enterprise conversion
    body: >-
      The revenue model assumes large enterprises will pay meaningfully for deployment, customization,
      and sovereign AI services on top of freely released model weights. This model is unproven at
      frontier scale: no open-weight frontier lab has demonstrated sustainable unit economics at
      Reflection's implied burn rate. Hugging Face CEO's caution about high-velocity model sharing
      reflects the competitive pressure from Chinese open-source labs with faster release cadences.
    claimRefs:
      - CO006
      - CO007
      - CO040
      - CO041
      - CO045
