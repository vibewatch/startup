      - CO035
      - CO039
      - CO044
  - calloutType: insight
    title: Geopolitical demand thesis is government-validated but commercially unproven
    body: >-
      The DOE Genesis Mission partnership and Pentagon classified-network deal validate the
      sovereign AI demand thesis. However, enterprise commercial revenue, customer count, and pricing
      are entirely undisclosed, leaving the business model's commercial scalability unverified at
      this stage.
    claimRefs:
