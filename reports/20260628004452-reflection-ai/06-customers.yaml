  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: asimov-enterprise-customer-base
      missingEvidence: >-
        Named paying Asimov enterprise customers, their company names, contract values,
        deployment scope, and renewal status under NDA or disclosed publicly.
      whyItMatters: >-
        Without any named commercial customer, the $25B valuation rests entirely on strategic
        government designations and future model release expectations; a single named paying
        enterprise customer would materially change the commercial credibility assessment.
      diligencePath: >-
        Request full customer list and ARR breakdown under NDA; inspect first-year renewal
        cohort data and pipeline CRM to assess conversion from waitlist to paying customer.
      relatedQuestionRefs:
        - QU003
        - QU007
      relatedTableRefs:
        - TU003

    - type: missing-source
      severity: blocking
      topic: customer-retention-metrics
      missingEvidence: >-
        NRR, GRR, churn rate, contract renewal schedule, and cohort retention data for
        Asimov enterprise customers and government contract renewals.
      whyItMatters: >-
        Retention metrics are the primary evidence of durable value delivery; their complete
        absence makes it impossible to assess whether Asimov delivers sufficient ROI to justify
        the $15–25K/user/year price point or whether government contracts will renew.
      diligencePath: >-
        Request NRR waterfall and cohort retention schedule for all Asimov contract cohorts
        to date; inspect government contract renewal language and budget allocation evidence.
      relatedQuestionRefs:
        - QU009

    - type: private-evidence-only
      severity: material
      topic: doe-genesis-live-deployment-status
      missingEvidence: >-
        Confirmation that Reflection AI models are live and running workloads within DOE
        National Laboratories, including model version, deployment architecture, and at
        least one lab director endorsement or technical outcome.
      whyItMatters: >-
        The DOE partnership is a strategic designation, not necessarily a signed contract
        with confirmed spend; live deployment confirmation would substantially upgrade the
        evidence quality from "partnership announced" to "production deployed."
      diligencePath: >-
        Request DOE contracting officer confirmation under FOIA if undisclosed, or a direct
        reference from a National Lab principal investigator who has used Reflection models.
      relatedQuestionRefs:
        - QU011

    - type: stale
      severity: material
      topic: open-model-frontier-release-customer-impact
      missingEvidence: >-
        A released, publicly benchmarked frontier model from Reflection AI, with HuggingFace
        download counts, fine-tuning activity, and enterprise adoption metrics in the 90 days
        following release.
      whyItMatters: >-
        The entire developer and enterprise customer acquisition funnel is gated on the model
        release; without it, developer traction, OSS ecosystem, and enterprise consideration
        all remain at zero. Every week of delay transfers ecosystem momentum to Llama 4,
        DeepSeek V4, Mistral 3, and other available open-weight models.
      diligencePath: >-
        Obtain model release roadmap from Reflection AI with committed milestones; track
        SpaceX Colossus 2 compute utilization as a proxy for training progress; monitor
        Hugging Face for any soft-launch or early-model publication.
      relatedQuestionRefs:
        - QU026

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >-
      All tables include notes documenting data sources, estimation basis, partial coverage,
      and what null or "not disclosed" values mean. The tableNotes acknowledgment is added
      because TU004 (retention table) and FU004 (retention matrix) contain structurally null
      cells that represent documented evidence absence, not data-entry omissions. Each
      null cell reflects a verified absence of public disclosure, not an authoring gap.
  - dimension: figureType
    reason: >-
      The planned cohort figure (retention/repeat cohort) was converted to a matrix because
      cohort figures require numeric 0–100 retention percentages, and Reflection AI has
      disclosed zero retention data for any customer segment as of June 2026. A matrix
      figure is used to document the absence of retention metrics without fabricating
      numeric values; the analytical intent (retention visibility) is fully preserved.
