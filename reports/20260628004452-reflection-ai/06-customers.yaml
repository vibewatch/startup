  - id: expansion-concentration-partner-dependence
    title: Expansion, Concentration Risk, and Channel Dependence
    body: >-
      Reflection AI's two publicly confirmed "production-stage" customer relationships—DOE and DOD—
      represent near-total concentration in the U.S. federal government channel at the current stage.
      If either relationship were to stall, be deprioritized under shifting federal budget cycles,
      or face competitive displacement, Reflection AI would have no publicly confirmed commercial
      customer base to sustain operations. The Shinsegae Korea deal is a channel partnership, not
      a direct customer, and depends on Shinsegae's ability to sell to Korean government and enterprise
      end-users—a second layer of channel risk.

      Go-to-market channel dependence is concentrated across three infrastructure and distribution
      partners: SpaceX (compute via the $6.3B Colossus 2 deal), NVIDIA (chips and validation through
      its ~$800M Series B investment), and Shinsegae (Korea market access). NVIDIA's strategic
      interest creates an implicit distribution advantage—NVIDIA validated open-weight models as a
      sovereign AI play and has strong enterprise relationships—but this also means Reflection AI's
      go-to-market in early stages is partially controlled by strategic investors rather than
      independent sales. GMI Cloud adds a GPU-as-a-service delivery channel with presence in the
      U.S. and Asia, diversifying deployment options.

      Land-and-expand dynamics for Asimov are structurally plausible: a VPC deployment that indexes
      a codebase creates switching costs that should drive expansion seat growth. But with no disclosed
      initial customers, the land step has not yet occurred publicly. Procurement friction for
      enterprise customers is material: the company has no generally available product, the Asimov
      waitlist is reportedly broken, and buyers must justify a $25,000/user/year investment in a
      tool whose parent company has no released frontier model. Federal procurement is slower and
      more compliance-intensive, but the DOE and DOD deals demonstrate Reflection AI can navigate
      that pathway. The key risk is that government engagements are strategic validations rather
      than scalable commercial revenue channels by themselves.
    claimRefs:
      - CU020
      - CU028
      - CU035
      - CU036
