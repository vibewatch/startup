  - id: named-customer-adoption-evidence
    title: Named Customer Proof and Adoption Evidence
    body: >-
      Reflection AI has three publicly confirmed "customer" relationships, all in the government or
      strategic-partner category. The most substantive is the U.S. Department of Energy Genesis Mission,
      announced via Axios exclusive in May 2026. Under this arrangement Reflection AI was named the
      foundational AI intelligence layer for a federal initiative that spans all 17 DOE National
      Laboratories, covering scientific workloads in energy, biotechnology, quantum systems, and
      national security. The mission's $293 million federal commitment marks the first major U.S.
      government open-source AI adoption contract. The announcement was corroborated by MeriTalk and
      CDO Magazine, confirming it as a real engagement—though no model versions, deployment timelines,
      or contractual spend are publicly disclosed.

      The second government customer is the U.S. Department of Defense, which in May 2026 signed
      classified AI network agreements with eight companies including Reflection AI, enabling
      deployment on Impact Level 6 (Secret) and IL7 (highly classified) military networks via the
      GenAI.mil platform used by over 1.3 million Pentagon personnel. The DOD announcement appeared
      on the Department of War official press release page, making it primary-tier evidence.
      Anthropic's exclusion from this list—due to disagreements over safety guardrails and supply
      chain risk—further elevates Reflection AI's federal positioning.

      Internationally, the Shinsegae partnership (March 2026) is a partner-customer hybrid: Shinsegae
      Group is building a 250 MW Korean sovereign AI cloud factory using Reflection AI's models and
      infrastructure stack, primarily serving Korean government agencies, retail, logistics, and
      finance enterprises. A PR Newswire joint press release confirmed the partnership; Korea Times
      and DataCenter Dynamics corroborated scope details. No production milestone, first customer,
      or live deployment date has been disclosed.

      For Asimov, the enterprise coding agent, there are zero named paying customers in the public
      record. Sequoia's mid-2025 partnership post described Asimov positively; a few independent
      reviewers on Slashdot and ToolRadar assessed it as strong on codebase comprehension but noted
      promises around full autonomy remain early. The waitlist has been described as broken or
      non-functional by multiple sources, limiting evidence of real commercial adoption.
