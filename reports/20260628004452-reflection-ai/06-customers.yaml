callouts:
  - calloutType: risk
    title: Zero Named Commercial Customers at a $25 Billion Valuation
    body: >-
      As of June 2026, Reflection AI has no publicly disclosed paying enterprise customers for
      Asimov, no commercial ARR, and no retention metrics. The $25 billion valuation is supported
      entirely by government strategic designations, investor strategic interest, and founder
      pedigree—not by a demonstrated commercial customer base. This is the primary customer-chapter
      risk: the absence of public proof is not an artifact of stealth disclosure but a structural
      absence of commercial evidence that any due-diligence process must address directly.
    claimRefs:
      - CU030
      - CU031
      - CU032

  - calloutType: risk
    title: Extreme Customer Concentration in U.S. Federal Government
    body: >-
      All confirmed Reflection AI "customer" relationships at the current stage are with the
      U.S. federal government (DOE + DOD). A shift in federal AI policy, budget cycle, or
      competitive award to a different provider would eliminate the only publicly confirmed
      customer base. The Shinsegae Korea partnership is a channel arrangement, not a direct
      customer, and adds geographic concentration risk rather than diversification.
    claimRefs:
      - CU035
      - CU036

  - calloutType: strength
    title: DOE and Pentagon Engagements Validate Sovereign AI Demand Thesis
    body: >-
      The DOE Genesis Mission selection and Pentagon IL6/IL7 classified-network agreement,
      both in May 2026, confirm that the U.S. federal government is willing to adopt an
      open-weight AI provider at the highest classification levels. These engagements establish
      Reflection AI as a credible sovereign AI platform—a validation that no purely commercial
      traction metric can provide—and position the company well for allied-nation government
      contracts following the Shinsegae Korea blueprint.
    claimRefs:
      - CU007
      - CU013
      - CU020

  - calloutType: assumption
    title: Enterprise and Developer Adoption Fully Contingent on Frontier Model Release
    body: >-
      All enterprise, developer, and open-source customer acquisition paths require a publicly
      released, benchmarked frontier model. Reflection AI has not released one as of June 2026.
      The SpaceX $6.3B compute deal signals imminent training capacity, but the release timeline
      remains unannounced. Each month of delay allows Llama 4, DeepSeek V4, Mistral 3, and
      competing models to deepen enterprise integration and developer ecosystem lock-in.
    claimRefs:
      - CU038
      - CU040

