company:
  name: Reflection AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Reflection AI's customer base as of June 2026 consists of two publicly confirmed U.S. government
    engagements—the Department of Energy Genesis Mission and Pentagon classified-network agreements—plus
    a Korean sovereign AI cloud partnership with Shinsegae Group. Zero named paying enterprise customers
    for the Asimov coding agent have been disclosed, the waitlist is reportedly non-functional, and no
    commercial revenue, NRR, or retention metrics have been published. The absence of public proof
    is a core finding: Reflection AI has secured strategic government validation but not yet converted
    that to measurable commercial traction at its $25 billion valuation.

sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Strategic Focus
    body: >-
      Reflection AI addresses three distinct customer segments, each with different buying criteria,
      procurement paths, and evidence levels. The first and highest-priority segment is large enterprises—
      specifically software engineering organizations at Fortune 500 firms, regulated financial
      institutions, healthcare systems, and energy companies—that need customizable, auditable AI
      running on their own infrastructure without dependency on closed U.S. API providers or Chinese
      open-weight models. The principal product targeting this segment is Asimov, a code-comprehension
      and autonomous coding agent priced at $15,000–$25,000 per user per year, deployed within
      customer VPCs to ensure data sovereignty.

      The second segment is sovereign governments and allied nations. Reflection AI's thesis holds
      that governments—especially those bound by data-residency laws, security classification
      requirements, or geopolitical constraints on Chinese AI—need a trusted, open-weight U.S. frontier
      model they can run on national infrastructure. The Shinsegae partnership in South Korea (March
      2026) is the first confirmed international instance, targeting Korean government agencies and
      enterprises through a 250 MW sovereign AI cloud factory.

      The third segment is the U.S. federal government, which is being served through the DOE Genesis
      Mission (May 2026) and Pentagon classified-network agreements (May 2026). These engagements are
      primarily research, security, and mission-readiness contracts rather than commercial SaaS
      subscriptions. A fourth nascent segment—the open-source developer community—remains entirely
      aspirational: Reflection AI has not released a public frontier model and has minimal GitHub
      public presence, leaving developers waiting ahead of any formal release. The company's Series B
      investor Citigroup is identified as a potential enterprise financial-sector customer, but no
      customer relationship has been announced. Revenue is expected from enterprise deployments,
      sovereign AI licenses, and government contracts, but none has been publicly confirmed.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
