  topStrengths:
    - Founders and early technical team bring rare DeepMind pedigree and frontier-RL credibility.
    - Reflection has secured unusually strong capital access and strategic backers, including Nvidia, Sequoia, and Lightspeed.
    - DOE, Pentagon, and Shinsegae partnerships show credible sovereign and regulated-market demand for an open-weight alternative.
  topRisks:
    - No publicly confirmed commercial customer base, revenue, or GA frontier model supports the reported 2026 valuation discussions.
    - Compute obligations and capex intensity could force continued dependence on very large financing rounds.
    - The open-weight moat may erode quickly if Meta, DeepSeek, Mistral, or other labs commoditize the same market before Reflection ships.
  unresolvedGaps:
    - Whether the reported March 2026 Series C actually closed, on what terms, and with what investor rights remains unverified.
    - Public evidence still does not disclose revenue, ARR, gross margin, burn, cash balance, or customer retention metrics.
    - The timing, benchmark performance, and commercialization path for Reflection's proprietary frontier models remain unclear.
