companyProfile:
  summary: Reflection AI is a founder-led frontier AI startup pursuing an open-weight and sovereign-AI thesis rather than a closed API model. The company has raised unusually large amounts of capital for its age and secured high-profile federal and infrastructure partnerships, but public evidence still shows a business earlier in product and commercialization maturity than its valuation implies.
  foundedDate: '2024-03-01'
  founders:
    - name: Misha Laskin
      role: Co-founder and CEO
      background: Former Google DeepMind staff research scientist who led reward-modeling work on Gemini after earlier research at UC Berkeley and a prior startup.
      claimRefs: [CO003, CO009, CO010, CO011]
    - name: Ioannis Antonoglou
      role: Co-founder, CTO, and President
      background: Former Google DeepMind researcher and AlphaGo co-creator who also contributed to AlphaZero and MuZero.
      claimRefs: [CO003, CO012, CO013]
  foundingLocation: null
  headquarters: Brooklyn, New York, USA
  productSummary: Reflection AI's public product footprint centers on Asimov, a VPC-deployed code-comprehension agent built with a retriever-combiner multi-agent architecture, while the broader company thesis is to commercialize proprietary open-weight frontier models for sovereign and regulated customers.
  customerFocus: Sovereign governments, U.S. federal agencies, and large regulated enterprises with data-sovereignty requirements.
  businessModel: Enterprise software subscriptions for code-comprehension agents plus future licensing and sovereign-AI infrastructure revenue from enterprises and governments deploying Reflection models.
  stage: late-stage private
  fundingStatus: Confirmed through a $2.0B Series B at an $8B post-money valuation in October 2025; a further $2.5B round at a $25B pre-money valuation was reported in talks in March 2026 but not publicly confirmed closed by the run date.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO019, CO024, CE001, CE012, CE041, CU001, CI016, CI006]
