  - id: public-traction
    title: Public Traction vs Metric Gaps
    body: >-
      The most concrete public metric Reflection AI has provided is its headcount trajectory:
      roughly 60 employees at the October 2025 Series B close, growing to ~150 in April 2026
      per Forbes, and ~203 by late June 2026 per TipRanks — a 3x headcount expansion in nine
      months, consistent with rapid talent acquisition enabled by Series B capital. All other
      conventional traction metrics — revenue, ARR, GMV, customer count, API call volume,
      active users — are absent from public disclosures.

      The Asimov coding agent, the company's only named product, remained on a non-joinable
      waitlist as of late March 2026. No research papers, model benchmarks, or open weights
      have been published. Government engagements (DoE Genesis Mission, Pentagon AI programs)
      signal early-stage government pipeline but are not confirmed revenue events. The
      Shinsegae MOU is an intent document only — no executed agreements, disclosed terms, or
      financial commitments have been reported.

      The company's own marketing claims competitive advantage (Asimov reportedly outperforms
      Claude and Cursor in blind tests 60–80% of the time), but these claims are company-
      originated and unverifiable without a live product. Multiple independent analysts —
      including AI2Work's March 2026 analysis and Forbes contributor Jon Markman — have
      specifically noted that $25B valuation against zero confirmed revenue is historically
      unusual even for deep-tech frontier labs.
    claimRefs:
      - CI018
