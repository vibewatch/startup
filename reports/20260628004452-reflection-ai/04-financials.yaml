  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: burn
      missingEvidence: Actual monthly operating burn rate and cash position as of July 1, 2026
      whyItMatters: Without actual burn data, runway estimates carry ±100% uncertainty; investors cannot assess Series C urgency or solvency risk.
      diligencePath: Request audited financial statements or board-approved budget with burn schedule; cross-reference against monthly wire records to SpaceX starting July 2026.
      relatedQuestionRefs:
        - QI007
        - QI027

    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: Any signed customer contract, pilot agreement, or LOI with confirmed contract value
      whyItMatters: The entire revenue quality and ramp assessment is impossible with zero commercial data; valuation multiples are incalculable.
      diligencePath: Request commercial pipeline deck with customer names, contract status, deal size, and expected revenue recognition date.
      relatedQuestionRefs:
        - QI004

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: Gross margin structure and COGS breakdown for planned enterprise and sovereign AI contracts
      whyItMatters: Cannot assess long-term profitability, price-to-value relationship, or whether the business can be economically viable at current compute cost levels.
      diligencePath: Request unit economics model for at least three deal archetypes (enterprise license, sovereign AI contract, inference API); compare against comps from Mistral and Cohere.
      relatedQuestionRefs:
        - QI020

    - type: private-evidence-only
      severity: material
      topic: government-contracts
      missingEvidence: Contract values, scope, and revenue-generating status for DoE Genesis Mission and Pentagon AI programs
      whyItMatters: If government engagements are pre-revenue MOUs rather than funded contracts, the revenue pipeline is empty; if funded, they represent material near-term revenue.
      diligencePath: Request program documents or executive summaries confirming contract award status, funded value, and revenue recognition timeline for each government engagement.
      relatedQuestionRefs:
        - QI024

    - type: private-evidence-only
      severity: material
      topic: Series-C
      missingEvidence: Series C closure date, final terms (valuation, structure, anti-dilution provisions), and investor roster
      whyItMatters: Series C closure is a binary event that determines whether the company has sufficient runway through 2027; deal-fall-through triggers crisis recapitalization.
      diligencePath: Request term sheet or executed purchase agreement for Series C; confirm JPMorgan Security and Resiliency Initiative participation; verify closing expected timing.

    - type: private-evidence-only
      severity: material
      topic: South-Korea-JV
      missingEvidence: Final JV agreement terms, Reflection AI's committed equity contribution, revenue-sharing formula, and construction timeline
      whyItMatters: MOU-stage only; until a final agreement is signed, the JV could be restructured, repriced, or abandoned — and Reflection's actual financial obligation is unknown.
      diligencePath: Request final JV agreement; confirm Shinsegae financing, Reflection's equity stake, and milestones for the $6.8B data center project.

    - type: missing-source
      severity: material
      topic: pricing
      missingEvidence: Any disclosed list pricing, contract structure, or enterprise go-to-market playbook for planned commercial AI offerings
      whyItMatters: Without pricing data, revenue model cannot be stress-tested; open-source competitors (Meta, Mistral, DeepSeek) provide free or very low-cost weight access, making Reflection's pricing power uncertain.
      diligencePath: Request pricing strategy memo or comparable enterprise deals; cross-reference against Mistral Large 2 and Cohere command enterprise pricing public benchmarks.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: minor
      topic: capital-intensity
      missingEvidence: Confirmed pre-SpaceX monthly compute spend and GMI Cloud contract terms
      whyItMatters: Pre-SpaceX burn estimate carries wide uncertainty; confirming historical compute spend would calibrate the runway model.
      diligencePath: Request GMI Cloud contract terms and any prior compute provider invoices to anchor burn estimates.
      relatedQuestionRefs:
        - QI021

