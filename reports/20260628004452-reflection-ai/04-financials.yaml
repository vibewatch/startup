  - id: capital-adequacy
    title: Capital Adequacy and Financing Dependency
    body: >-
      Reflection AI has raised a total of $2.13B+ across three rounds through October 2025
      per Tracxn (TipRanks cites $3B when including a September 2025 intermediate close).
      The Series B alone delivered $2B at an $8B valuation, with Nvidia contributing
      approximately $800M. As of late March 2026, the company was in advanced discussions
      to raise $2.5B at a $25B pre-money valuation — with JPMorgan Chase reportedly
      considering participation through its Security and Resiliency Initiative, and existing
      investor Disruptive expected to re-up. The Wall Street Journal sourced the $25B figure
      as a pre-money target; the round has not been confirmed closed as of the report date.

      Cash position and monthly burn are not disclosed. Estimating from signals: pre-SpaceX
      compute and operating costs of $20–45M/month for nine months October 2025–June 2026
      implies $180M–$405M consumed before the SpaceX meter starts. Assuming raised capital
      of $2.13B–$3B, remaining cash entering July 2026 is estimated at $1.7B–$2.8B. The
      SpaceX commitment of $150M/month raises implied total monthly burn to $165–200M/month,
      yielding approximately 9–17 months of runway without the Series C. If the Series C
      closes at $2.5B, estimated runway extends to 22–35 months at post-SpaceX burn rates.

      The South Korea JV with Shinsegae Group (250MW data center, ≥$6.8B total project cost)
      represents a major future capital event whose structure has not been disclosed. Under
      the MOU terms, Shinsegae bears land and construction costs while Reflection handles
      design and operations, limiting Reflection's direct capex. However, chip procurement
      and engineering contributions could still represent substantial future cash outflows.
      Secondary market SPVs — including HII Reflection AI Series I (SEC Form D, May 2026)
      and ID8 Growth Opportunities Reflection AI LLC (June 2026) — confirm active secondary
      market activity and provide indirect evidence of investor appetite for Reflection equity
      at valuations consistent with the $8–25B primary market range.
