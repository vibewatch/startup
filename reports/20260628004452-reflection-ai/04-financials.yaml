callouts:
  - calloutType: risk
    title: Existential Financing Dependency
    body: >-
      Post-July 2026, Reflection AI's estimated monthly burn rises to $165–200M/month from
      the SpaceX compute commitment alone. Without closing the Series C ($2.5B in talks),
      the company faces 9–17 months of runway on estimated current cash — an existential
      risk horizon for a lab that has not yet shipped a commercial product. If the Series C
      is delayed or repriced, Reflection may need to exercise the 90-day exit clause on
      the SpaceX contract to preserve capital, undermining its model training timeline.
    claimRefs:
      - CI038
      - CI043
      - CI014

  - calloutType: risk
    title: Zero Revenue Against $25B Valuation
    body: >-
      As of late March 2026, Reflection AI had not generated meaningful revenue per multiple
      independent sources citing Wall Street Journal reporting. The $25B pre-money valuation
      implies a revenue multiple that is incalculable against zero revenue. No comparable
      pre-revenue AI startup has sustained a valuation at this level without shipping a
      product or securing confirmed multi-year government contracts with disclosed value.
      Investors are pricing future execution probability — not current performance.
    claimRefs:
      - CI009
      - CI030
      - CI044

  - calloutType: insight
    title: Sovereign AI as Structural Market
    body: >-
      The U.S. AI Exports Program, Gartner's $80B+ sovereign cloud IaaS forecast for 2026,
      and the Shinsegae JV structure all indicate that sovereign AI is a policy-backed
      structural market, not just a marketing position. If Reflection can ship a competitive
      open-weight frontier model, the sovereign demand signal (DoE, Pentagon, South Korea,
      allied governments) is credible and potentially large enough to justify the capital
      investment. The strategic bet is rational; the execution is unproven.
    claimRefs:
      - CI015
      - CI027
      - CI042

  - calloutType: recommendation
    title: Defer Underwriting Until Series C Closes and First Model Ships
    body: >-
      Financial underwriting cannot be completed on Reflection AI with available public
      information. Revenue is zero, unit economics are unknown, and the company's survival
      past 2027 depends on closing a $2.5B round. Any investment decision should be
      conditional on (1) confirmed Series C closure with known terms, (2) release of the
      first frontier open-weight model with published benchmarks, and (3) confirmation that
      at least one government contract is revenue-generating rather than pre-commercial.
    claimRefs:
      - CI009
      - CI018
      - CI038

