  - id: trust-safety-risk
    title: Trust, Safety, and Pre-Product Risk
    body: >-
      Reflection AI's stated safety philosophy rejects security through obscurity in favor of
      rigorous open science—arguing that public model weights enable the broader research
      community to participate in safety research and risk identification rather than delegating
      these decisions to a handful of closed labs. Pre-release commitments include capability
      and risk evaluations before model release, security research against misuse, and
      responsible deployment standards. No third-party audit, external safety report, or
      independent red-team finding had been published as of the run date.

      Asimov's VPC deployment architecture is the primary privacy control for the current
      product: all data ingested by the system remains inside the customer's own cloud
      environment. The Memories system's RBAC layer controls who can update organizational
      knowledge. However, MIT computer scientist Daniel Jackson raised the concern that a
      system reading private team messages and documentation introduces inherent security
      exposure, and that the approach could increase computational costs. No independent
      security audit of Asimov has been published.

      The largest risk in this chapter is the execution gap between capital deployed and
      product delivered. Reflection AI had raised at least $4.6 billion and committed
      $150 million per month to SpaceX compute as of the run date, yet had not released a
      single public frontier model and had published no research papers. The Asimov benchmark
      (60-80% preference over competing tools) is entirely vendor-reported and self-commissioned
      with no independent replication. The Asimov waitlist was described as non-functional in
      March 2026. Frontier model competitors including Claude Code, OpenAI Codex, and Meta
      Llama are all generally available with demonstrated traction. The capital commitment
      to SpaceX creates time pressure to deliver a frontier model before monthly outlays
      compound into an unsustainable cash burn.
