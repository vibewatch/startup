chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Reflection AI operates a two-product portfolio: Asimov, a code comprehension agent in early-access
    since July 2025 that uses a retriever-combiner multi-agent architecture deployed inside customer VPCs,
    and a frontier open-weight MoE language model under development on a RL training platform but not yet
    publicly released as of the run date. The company has secured government deployment partnerships with
    the DOE, Pentagon, and South Korea, but the absence of any public frontier model despite $4.6B+
    raised and a $6.3B SpaceX compute commitment represents the chapter's central product risk.

sections:
  - id: product-portfolio
    title: Product Portfolio and Service Definition
    body: >-
      Reflection AI operates a two-product portfolio. The first and only commercially deployed product
      is Asimov, a code comprehension agent launched July 16, 2025 and available in selective early
      access as of the run date. Asimov is explicitly not a code generation tool; it targets the
      approximately 70 percent of engineering time spent understanding existing codebases rather than
      writing new code. In customer workflow terms, Asimov acts as an AI-powered institutional knowledge
      system that ingests a software team's code repositories, architecture documentation, GitHub
      discussions, Slack histories, and project management records to answer complex technical questions
      about the codebase on demand. A distinguishing feature is the Memories system, through which senior
      engineers can explicitly teach Asimov facts about the organization ("@asimov remember X works in
      Y way") with role-based access control, enabling persistent organizational knowledge that survives
      team turnover.

      The second product in the portfolio is an unnamed frontier open-weight language model under
      active development. Reflection AI confirmed in October 2025 that it had built a large-scale LLM
      and reinforcement learning training platform capable of training massive Mixture-of-Experts (MoE)
      models at frontier scale. The first model—a primarily text-based language model planned for
      training on tens of trillions of tokens—was originally targeted for early 2026 release but had
      not shipped as of the June 2026 run date. The company intends to release trained model weights
      publicly while keeping training datasets and pipelines proprietary, in the tradition of Meta's
      Llama and Mistral. Asimov currently runs on third-party foundation models while Reflection trains
      proprietary replacements. Beyond the core portfolio, Reflection has secured government deployment
      commitments: as the AI model provider at all 17 US Department of Energy national laboratories
      under the Genesis Mission (May 2026), Pentagon clearance for IL6/IL7 classified network use
      (May 2026), and an MOU with South Korea's Shinsegae Group for a 250-megawatt sovereign AI factory.
