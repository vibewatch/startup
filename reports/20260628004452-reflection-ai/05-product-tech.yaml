callouts:
  - calloutType: strength
    title: World-Class RL-to-LLM Pedigree Is Genuinely Rare
    body: >-
      CTO Ioannis Antonoglou co-created AlphaGo and led RL research across AlphaZero, MuZero, and
      AlphaCode 2 at DeepMind, while CEO Misha Laskin led RLHF reward modeling for Gemini. The
      combination of both pretraining-scale LLM expertise and RL-at-scale specialization in a single
      founding team is rare outside Google, OpenAI, and Anthropic — and the team's ability to build
      a frontier-scale MoE training platform independent of a hyperscaler is the central technical claim.
    claimRefs:
      - CE022
      - CE007

  - calloutType: risk
    title: No Public Frontier Model Despite Extraordinary Capital Committed
    body: >-
      Reflection AI has raised over $4.6 billion, committed $150 million per month to SpaceX compute,
      and secured government deployment agreements — yet as of June 28, 2026, has not released a single
      public frontier model, published a research paper, or opened Asimov to general availability. The
      frontier model release was originally targeted for early 2026. Every government and enterprise
      deployment contract is contingent on model delivery. The SpaceX cash commitment creates time
      pressure that makes further delays increasingly costly.
    claimRefs:
      - CE003
      - CE025
      - CE030
      - CE035

  - calloutType: assumption
    title: Asimov Currently Uses Third-Party Models — Identity Unconfirmed
    body: >-
      Reflection AI has confirmed that Asimov runs on third-party foundation models rather than
      proprietary Reflection models. The identity of those third-party models has not been publicly
      disclosed. Given the company's investor relationships and the timing, it is assumed to include
      models from Anthropic, OpenAI, or both, but this is unverified. The transition to proprietary
      Reflection models is stated to be underway but no timeline has been published.
    claimRefs:
      - CE015

  - calloutType: insight
    title: VPC Deployment Is a Strategic Moat for Government and Regulated Enterprise
    body: >-
      Asimov's architecture — which deploys entirely inside a customer's virtual private cloud —
      is not merely a security feature but a strategic positioning choice. It enables Reflection to
      serve customers who cannot expose code or communications to external APIs: regulated banks,
      defense contractors, intelligence agencies, and sovereign governments. The combination of
      VPC isolation, open-weight model weights for customization, and Pentagon/DOE clearances creates
      a defensible niche that neither closed-API labs (Anthropic, OpenAI) nor open-weight peers
      without US government trust (DeepSeek) can easily occupy.
    claimRefs:
      - CE012
      - CE023
      - CE041
      - CE042

