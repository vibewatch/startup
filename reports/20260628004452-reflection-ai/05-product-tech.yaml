  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: architecture
      missingEvidence: >-
        Identity and licensing terms of the third-party foundation models currently powering
        Asimov's retriever and combiner agents.
      whyItMatters: >-
        Knowing which models power Asimov determines switching costs, vendor concentration risk,
        and the viability of the proprietary model transition; undisclosed dependency on Anthropic
        or OpenAI models would create contractual and competitive risks.
      diligencePath: >-
        Request from Reflection AI directly: list of third-party model API providers, contract
        terms, and transition plan with milestones for migrating to proprietary models.
      relatedQuestionRefs:
        - QE010

    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: >-
        An official Reflection AI roadmap with specific dates for (a) proprietary model
        integration into Asimov, (b) frontier model GA release, and (c) government deployment
        milestones.
      whyItMatters: >-
        The $150M/month SpaceX compute commitment starting July 2026 imposes a cash burn
        that is only sustainable if a revenue-generating model ships in a timely fashion;
        without a confirmed roadmap, the timeline risk cannot be quantified.
      diligencePath: >-
        Obtain internal roadmap document from Reflection AI as part of due diligence data room;
        request committed delivery dates for frontier model release and Asimov GA with milestones.
      relatedQuestionRefs:
        - QE015

    - type: missing-source
      severity: material
      topic: safety-policy
      missingEvidence: >-
        Published compliance framework, export control strategy, responsible use license,
        and certification roadmap for the planned open-weight frontier model.
      whyItMatters: >-
        Open-weight models can be fine-tuned for harmful uses; without a published responsible
        use license and export control framework, enterprise and government customers face
        compliance uncertainty, and Reflection AI's stated safety commitments are unverifiable.
      diligencePath: >-
        Request draft model card, safety evaluation methodology, responsible use license terms,
        and export control legal opinion from Reflection AI; check whether they have engaged
        with NIST AI Risk Management Framework or equivalent standards body.
      relatedQuestionRefs:
        - QE022

    - type: missing-source
      severity: minor
      topic: benchmarks
      missingEvidence: >-
        Independent third-party replication of Asimov's 60-80% preference benchmark against
        Cursor Ask and Claude Code in a controlled evaluation not designed by Reflection AI.
      whyItMatters: >-
        All published benchmark figures are vendor-commissioned with open-source maintainers
        selected by Reflection AI; independent replication would significantly strengthen the
        product differentiation claim and accelerate enterprise sales.
      diligencePath: >-
        Commission an independent evaluation using a standardized code comprehension benchmark
        suite (e.g., SWE-bench comprehension tasks or CodeSearchNet) with blind assessors not
        affiliated with Reflection AI.
