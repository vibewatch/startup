  - id: deployment-roadmap
    title: Deployment, Integration, and Roadmap
    body: >-
      Asimov is deployed inside customers' virtual private clouds so that all ingested data—code,
      communications, and documentation—remains on the customer's own infrastructure. This
      VPC-first model directly addresses enterprise data sovereignty concerns and is the
      architectural foundation for regulated and government deployments. Deployment is selective:
      Reflection has individually onboarded engineering teams since the July 2025 launch, and
      general availability had not been announced as of the run date.

      Reflection's compute infrastructure is anchored by a $6.3 billion deal with SpaceX for
      access to Nvidia GB300 GPUs at the Colossus 2 data center near Memphis, Tennessee, at
      $150 million per month from July 2026 through 2029. The Colossus 2 facility was originally
      built by xAI and is now leased to leading AI labs; Reflection is the third major lab to
      join alongside Anthropic and Google. Either party may exit with 90 days notice after the
      initial three months. The deal is described as one of the largest open AI infrastructure
      commitments to date and provides the compute capacity required to train a frontier-scale MoE
      model.

      The company's two-step superintelligence roadmap calls for first delivering a
      superintelligent autonomous coding system, then expanding that blueprint to all
      computer-based work. The first frontier open-weight text model was originally targeted for
      early 2026 but remains unreleased. Multimodal capabilities are planned for future
      generations. Government deployment is already underway: Reflection is the foundational
      intelligence layer for DOE's 17 national laboratories under the Genesis Mission, is cleared
      for Pentagon IL6/IL7 classified networks, and has signed an MOU to supply models and
      full-stack engineering for a 250-megawatt sovereign AI factory in South Korea with
      Shinsegae Group.
