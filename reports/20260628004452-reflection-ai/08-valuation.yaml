callouts:
  - calloutType: strength
    title: U.S. Government and Nvidia Strategic Alignment
    body: >-
      Reflection AI benefits from a unique policy and investor alignment unavailable to other
      open-weight labs: direct endorsement from the White House AI Czar, a U.S. AI Exports Program
      project as its first sovereign deployment (South Korea JV), DoE Genesis Mission and Pentagon
      engagement, and an $800M Nvidia co-investment that links Reflection into the GPU ecosystem
      and Nemotron coalition. This combination of strategic capital, government channel, and policy
      tailwind constitutes a structural distribution moat for the sovereign AI thesis that cannot
      be easily replicated by Mistral, Cohere, or even Meta's Llama despite its open Apache license.
    claimRefs:
      - CV003
      - CV006
      - CV007

  - calloutType: risk
    title: Unprecedented Capital Intensity Before Revenue
    body: >-
      Reflection AI is paying $150 million per month for compute starting July 1, 2026, before
      earning a single dollar of confirmed revenue. At an estimated $165–200M/month total burn,
      the company will consume $1.65–$2B over the next 9–12 months without the Series C. This is
      the single largest disclosed pre-revenue operational cost commitment in recent AI history
      and creates an existential dependency on the $25B Series C closing quickly. If the Series C
      terms slip below $15B or the close delays past September 2026, runway becomes critically short
      before a commercial product can generate offsetting revenue.
    claimRefs:
      - CV009
      - CV010
      - CV013

  - calloutType: recommendation
    title: Track — Re-evaluate at Series C Close and First Revenue Signal
    body: >-
      The Track recommendation reflects the asymmetric risk-reward at the $25B entry price: exceptional
      inputs (team, investors, policy alignment) are offset by an absence of any commercial proof.
      The upgrade triggers are binary and observable: (1) Series C closing at ≥$20B pre-money with
      confirmed investor list, (2) publicly benchmarked frontier model showing competitive performance,
      and (3) first enterprise or government revenue contract announced with substance. Investors
      who enter at or before the Series C should plan for a 4–7 year hold, model the base case as
      flat-to-modest returns, and size the position for binary outcomes—not for the current valuation
      being justified by conventional multiples.
    claimRefs:
      - CV045
      - CV046
      - CV047

