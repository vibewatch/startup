  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Series C status and capital adequacy
        - Confirmed close date, investor list, final pre-money valuation, and post-close cash balance
        - "Capital adequacy is existential: 9–17 months runway without Series C at post-July burn"
        - Request direct confirmation from company; monitor SEC Form D filings and press
      - - First frontier model performance and timeline
        - Benchmark results vs Llama 4.5, Mistral Large 2, GPT-5 equivalents; compute efficiency metrics
        - Thesis depends on shipping a model measurably competitive with free open-weight alternatives
        - Demand private model demo access or early access agreement; require benchmark disclosure prior to investment
      - - Government pipeline and contract values
        - DoE Genesis Mission contract value; Pentagon AI program scope; South Korea JV revenue and timeline
        - Revenue quality and timing; sovereign AI thesis requires contracted revenue, not just MOUs
        - Request management presentation with LOI/contract terms and pipeline under NDA
      - - Cap table and liquidation preference structure
        - Full capitalization table; Series B liquidation preference type and amount; anti-dilution provisions
        - Participating preferred at $2B Series B could absorb most Series C upside in flat/down exit
        - Require full cap table and Series A/B/C term sheet disclosure as investment condition
      - - Board composition and governance
        - Independent directors; investor board representation; protective provisions; audit function
        - Governance risk is elevated at a pre-revenue $25B valuation without public accountability
        - Demand board observer rights or independent director appointment as investment condition
      - - Unit economics and financial model
        - Internal assumptions for CAC, LTV, gross margin, enterprise contract size, and revenue ramp
        - Validates or undermines the scenario assumptions; without a model, all scenario analysis is unconstrained speculation
        - Management meeting; require a 3-year financial model with disclosed assumptions before any commitment
    notes: >-
      Diligence topics reflect gaps in publicly available evidence as of June 28, 2026;
      priority weighting is analyst judgment and may not reflect company's own disclosure timeline.
