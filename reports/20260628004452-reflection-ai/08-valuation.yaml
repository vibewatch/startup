  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Side
      - Argument
      - Evidence Basis
      - What Would Change the View
    rows:
      - - Thesis
        - DeepMind-pedigree founders with proven frontier AI track record in RL and large-scale training
        - Antonoglou co-created AlphaGo and AlphaZero; Laskin led Gemini reward modeling at Google DeepMind
        - Key-person departure or failed model launches at competitive benchmarks
      - - Thesis
        - Nvidia $800M co-investment creates compute access priority and ecosystem integration
        - Series B co-investment; Nemotron open AI coalition membership since March 2026 GTC
        - Nvidia publicly reallocates chip allocation to competing open-weight labs
      - - Thesis
        - U.S. government structural tailwinds via AI Exports Program, DoE, and Pentagon engagement
        - South Korea JV, DoE Genesis Mission, White House endorsement, U.S. Commerce Secretary attendance
        - Policy reversal mandating closed models for federal use or terminating open-source AI Exports Program
      - - Thesis
        - SpaceX Colossus 2 compute at $150M/month provides training-scale differentiation through 2029
        - $6.3B contract through 2029; GB300 Nvidia chips exclusively at Colossus 2 near Memphis
        - Compute contract canceled via 90-day exit clause or competitor secures equivalent scale
      - - Thesis
        - Open-weight release creates developer ecosystem plus enterprise sovereign-deployment moat
        - "Mistral precedent: $400M ARR on open-weight Apache strategy; Meta Llama 10M+ downloads"
        - Frontier open-weight market commoditized by Meta/DeepSeek at capability parity with free license
      - - Anti-Thesis
        - Zero revenue at $25B target is unprecedented for a commercial AI lab at this funding stage
        - No disclosed revenue, customers, or list pricing as of June 28, 2026
        - First disclosed enterprise contract with stated revenue value above $10M
      - - Anti-Thesis
        - Capital intensity ($1.8B/year compute) before revenue creates existential runway risk
        - Estimated 9–17 months runway without Series C at post-July burn; cash position $1.7–2.8B
        - Series C confirmed closed at ≥$20B pre-money and explicit runway commitment of 24+ months
      - - Anti-Thesis
        - Open-weight models rapidly commoditized by Meta (Apache 2.0) and DeepSeek (MIT license)
        - DeepSeek V4 and Llama 4.5 approaching frontier capability at zero cost as of Q2 2026
        - Reflection model demonstrates measurably superior performance (>10 points on SWE-Bench) vs free alternatives
      - - Anti-Thesis
        - Sovereign AI market is policy-driven and politically cyclical; U.S. executive orders can reverse
        - White House AI policy is executive-order level with no statutory underpinning
        - Multi-year DoD/DoE contracts with locked revenue commitments and congressional authorization
      - - Anti-Thesis
        - No disclosed product, pricing, or customer validates the $25B commercial thesis
        - Asimov still on non-joinable waitlist; no frontier model shipped as of June 28, 2026
        - Asimov or frontier model public launch with disclosed adoption or revenue metrics
    notes: >-
      Thesis and anti-thesis arguments sourced from multiple independent analysts and news reports;
      "What Would Change the View" entries represent analyst judgment on threshold evidence.
