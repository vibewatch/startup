  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - Series C fails to close at $25B
        - No official close announcement by September 2026 or confirmed close below $18B
        - Capital adequacy crisis; runway under 9 months; potential fire-sale or flat-round repricing
        - Downgrade to Avoid; thesis collapses without capital to sustain $165–200M/month burn
      - - Nvidia chip allocation reduction
        - Public announcement of reduced Reflection AI GPU allocation or $200M+ investment in competing open-weight lab
        - Eliminates core compute-access differentiation and ecosystem channel thesis
        - Immediate re-evaluation; strengthen diligence on competitor chip access and Nemotron status
      - - Frontier model fails to ship by Q2 2027
        - No publicly benchmarked frontier model or commercial product by June 30, 2027
        - Revenue thesis collapses; team credibility impaired; future rounds unavailable at Series C multiples
        - Downgrade to Avoid; product delivery is the primary execution and credibility gate
      - - Open-weight capability parity from Meta or DeepSeek
        - Competitor ships model within 5% on SWE-Bench/MMLU benchmarks with Apache/MIT license
        - Open-weight premium commoditized before Reflection monetizes its differentiation
        - Re-evaluate; monitor benchmark gap quarterly; assess whether enterprise support moat survives
      - - Key-person departure (Laskin or Antonoglou)
        - Public announcement of departure or extended leave of either co-founder
        - Eliminates founding vision carrier and primary investor confidence anchor
        - Immediate diligence escalation; high-conviction hold requires both founders present
      - - U.S. AI policy reversal on open-source exports
        - Executive order mandating closed models for federal use or suspending AI Exports Program
        - Eliminates sovereign AI government channel thesis; removes White House tailwind
        - Monitor OSTP/NSC policy signals; quantify government revenue as share of total pipeline
    notes: >-
      Trigger thresholds are analyst estimates based on public evidence and scenario analysis;
      monitoring indicators should be confirmed and refined with company management under NDA.
