  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "SHINE is best understood as an accelerator-driven neutron and radiochemistry platform that already ships several real products while using those operating surfaces to de-risk bigger bets. The strongest public proof is around current SPECT diagnostics, FLARE neutron testing, and commercial Lu-177 precursor supply; Mo-99 at Chrysalis is technically well advanced but still awaiting full operating transition, while nuclear-fuel recycling remains an early but unusually concrete process program. The investment question is not whether SHINE has real technology, but whether it can convert a complex, regulated stack of neutron generation, hot-cell chemistry, QA release, and licensing into repeatable large-scale output."
  },
  "sections": [
    {
      "id": "platform-products-and-customer-jobs",
      "title": "Platform products and the customer jobs they serve",
      "body": "SHINE does not sell a single fusion product. It sells a layered operating platform whose current public outputs span routine SPECT diagnostics, Lu-177 precursor supply, neutron-testing services, and adjacent neutron applications, while using the same scientific base to expand toward Mo-99 and fuel recycling. The nuclear-medicine surface is now broader than a startup isotope pitch because SHINE owns TechneLite and a set of established SPECT radiopharmaceutical products already embedded in hospital workflows. In parallel, the company markets Ilumira as a Lu-177 precursor for radiolabeling, and FLARE as a dedicated radiation-effects testing service for defense, aerospace, and advanced-energy customers. This matters for diligence because the company\u2019s technology stack is not valuable only if fusion power arrives; it is already being monetized through highly regulated, time-sensitive customer jobs. The analytical challenge is to separate what is already delivered today from what is still roadmap or scale-up.",
