    {
      "id": "isotope-production-workflow-and-architecture",
      "title": "Isotope-production workflow and operating architecture",
      "body": "The product architecture is easiest to understand through the isotope workflow. On the diagnostic side, SHINE\u2019s Mo-99 approach uses an accelerator-driven neutron source and a liquid target, then depends on radiochemical separation and purification steps that have to deliver current-industry purity under tight half-life constraints. The historical Argonne Mini-SHINE demonstration is important because it showed the production, separation, and purification chain rather than only a physics proof. On the therapeutic side, Lu-177 is not sold as a finished drug on SHINE\u2019s public site; it is sold as a precursor that partners combine with targeting molecules. The underlying radionuclide has a multi-day half-life and dual beta/gamma properties that make it valuable for both therapy and imaging, but quality requirements remain stringent because these materials sit inside patient-care workflows. Public evidence is therefore strongest where SHINE has shown process flow, purity, handling, and product-label detail, and weakest where it would need batch-release metrics, yields, or spoilage data that remain private.",
