    {
      "id": "neutron-systems-and-adjacent-applications",
      "title": "Neutron systems and adjacent applications",
      "body": "FLARE shows the most direct expression of SHINE\u2019s core neutron platform outside medicine. The public materials are unusually specific for a startup service: FLARE is described as a steady 14 MeV neutron source, with flux ranges, activation-foil validation, ITAR compliance, and physical constraints on test articles. That specificity supports the view that FLARE is a real operating service rather than a concept demo. The same neutron-generator base also spills into other adjacencies. DHS selected SHINE for a cargo-screening prototype program, while UKAEA\u2019s LIBRTI program plans to use a SHINE deuterium-tritium source to test tritium-breeding materials for future fusion blankets. These programs do not prove future fusion economics, but they do show that SHINE\u2019s neutron hardware can be repurposed into multiple customer workflows with different value propositions: rad-hard qualification, contraband detection, and fusion-materials validation. That adjacency breadth is a genuine differentiation, although it also increases dependence on hardware uptime, target lifetime, and specialist operations.",
