    {
      "id": "quality-regulatory-controls-and-roadmap",
      "title": "Quality, regulatory controls, and the public roadmap",
      "body": "Because SHINE operates in nuclear medicine and neutron services, trust is built less through software-style usage growth and more through documented controls. The nuclear-medicine portfolio includes explicit safety and handling language for TechneLite, CardioLite, NeuroLite, and Xenon, which confirms that SHINE is working inside heavily regulated radiopharmaceutical procedures. The NRC operating-license process for Chrysalis is another major de-risking signal: SHINE publicized a final safety evaluation report after years of technical review, while DOE and NNSA describe a facility that is already substantially built and intended to operate without HEU. For fuel recycling, the public roadmap is unusually concrete compared with many fusion-adjacent concepts. SHINE\u2019s site lays out a three-step recycling pathway, and the NRC regulatory engagement plan spells out specific chemical-separation stages and target throughputs for a pilot facility. At the same time, roadmap clarity is not the same as maturity: public sources still do not show full process economics, full quality-system documentation, or commissioning data at scale.",
