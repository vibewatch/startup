  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "SHINE\u2019s risk profile is not typical startup software risk; it is a tightly coupled nuclear-operations risk stack in which regulation, engineering, logistics, supply, and financing all transmit directly into customer outcomes. The positive side is that the company has already cleared unusually deep review milestones, has public policy support, and now owns operating channels in both diagnostics and therapeutics. The negative side is that the largest value step still requires flawless execution across Chrysalis licensing, construction completion, commissioning, supply reliability, and customer service under radioactive-decay constraints. The right underwriting stance is not that SHINE is unusually risky for a nuclear company, but that several high-severity risks remain acceptable only if the company continues converting regulatory progress and platform breadth into boring, repeatable operations."
  },
  "sections": [
    {
      "id": "regulatory-and-legal-risk-stack",
      "title": "Regulatory and legal risk stack",
      "body": "The first layer of SHINE\u2019s risk stack is legal and regulatory, and it is materially more complex than a normal industrial build. Chrysalis is governed by NRC licensing rules that treat permit and license transfers, operating-license qualification, environmental review, and public intervention rights as consequential gating events. The risk is not merely whether SHINE can eventually win permission to operate; it is whether each corporate, financing, and operating step stays consistent with the licensing basis. The good news is that multiple official sources show real progress: ACRS completed its 2022 review with no open items, the NRC later approved the 2026 construction-permit transfer, and DOE/NNSA continue to frame Chrysalis as a policy-supported domestic Mo-99 project. The caution is that policy support does not eliminate legal exposure. The recycling program still contemplates regulatory strategy questions and possible exemptions, the DOE financing path still has conditions, and SHINE remains responsible for obtaining permits and approvals beyond high-level federal support. Investors should treat regulatory risk as better de-risked than at a seed stage, but still central to the thesis.",
