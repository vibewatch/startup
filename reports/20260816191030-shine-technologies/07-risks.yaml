    {
      "id": "mitigations-thesis-breaks-and-diligence-priorities",
      "title": "Mitigations, thesis-break triggers, and diligence priorities",
      "body": "The central mitigation is that SHINE is not starting from zero. It has ACRS support, DOE/NNSA policy support, an installed SPECT channel, named therapeutic accounts, and a broader executive bench than a typical early-stage fusion company. Those are real buffers. But they are not enough to neutralize the thesis-break triggers. The near-term investment thesis breaks if Chrysalis materially slips, if DOE-related financing or license conditions fail, if hospital-facing reliability degrades during scale-up, or if the company cannot demonstrate that its platform is economically sustainable rather than just technically impressive. The recycling option value also weakens materially if exemptions, pilot economics, or partner demand prove much worse than the current roadmap implies. The right diligence outcome is not simply a list of risks; it is a monitored dashboard with explicit kill criteria tied to schedule, uptime, quality, supply resilience, customer retention, and financing close conditions.",
