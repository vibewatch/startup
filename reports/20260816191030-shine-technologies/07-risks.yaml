      "id": "operational-safety-and-quality-risks",
      "title": "Operational, safety, and quality risks",
      "body": "The second layer is operational. SHINE\u2019s technical model lives inside hot cells, irradiation units, time-decaying isotopes, safety analyses, and shipping constraints; that means ordinary execution errors can become patient-access problems quickly. Official and filing sources show why. ACRS describes a first-of-a-kind facility with eight irradiation units, hot-cell processing, hazard analysis, digital-asset security considerations, and accident scenarios such as off-gas-system failure and tritium-system failure. Lantheus\u2019 filing shows how the diagnostic channel depends on same-day or near-immediate manufacturing and shipment windows, foreign Mo-99 processors, weekly standing orders, and sole-source points like Xenon bulk supply and certain manufacturing partners. The public operational upside is that SHINE has already commercialized some of this complexity through SPECT, Lu-177, and FLARE; the downside is that reliability expectations are unforgiving. A single prolonged outage, shipping disruption, quality event, or staffing gap can flow directly into hospitals, radiopharmacies, clinical trials, or defense schedules. That makes operations and quality the most important non-regulatory diligence category.",
