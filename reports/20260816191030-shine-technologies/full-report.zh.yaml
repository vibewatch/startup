      - number: '1.2'
        title: 领导层、治理与关键人物集中度
        blocks:
          - type: paragraph
            body: >-
              Greg Piefer 仍是创始人兼首席执行官，也仍是把 SHINE 应用聚变业务同长期能源逻辑连接起来的公开战略人物。2026 年的领导层调整引入了后期规模化人才： Kyle Stacey
              加入担任首席财务官，David Willbrand 加入担任首席法务官，Chris Lee 从 CFO 转为首席战略官，Ralph Alexander 加入董事会。Lantheus SPECT 收购还带来了
              Michael Rossi，他出任 SHINE SPECT USA CEO，为公司补上深厚的放射性药物运营经验。 制度化建设由此受益，因为 SHINE
              正从创始人主导融资，转向跨放射性药物、回收和政府支持项目的多地点执行。即便如此，关键人物依赖仍然明显。 Piefer 仍承载外部融资、产品叙事和长期战略定位；Lee 任职时间很长，Rossi
              又承担整合任务，两人都是重要执行节点。公开材料没有给出每个主要投资人的完整治理权利图， 因此仅靠公开证据，董事会控制权和保护性条款尽调仍不完整。
