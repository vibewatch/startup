      - number: '2.3'
        title: 分细分市场的买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              SHINE 至少面对五种不同的购买动作。在 Mo-99 和 SPECT 诊断中，医院影像中心、放射性药房和下游诊断产品分销商关心供应连续性、 监管处理和工作流适配。在 Lu-177
              治疗中，直接买方通常是放射性药物公司或临床申办方，最终用户则是治疗中心或试验点，
              它们需要可靠的前体供应来保证患者排期。中子测试又不同：买方是航天、国防或先进能源工程组织，采购辐射效应数据，预算常来自项目而非医疗。 面向 UKAEA 这类客户的聚变材料测试落在公共 R&D
              和工业实验室预算中；乏燃料回收仍是面向公用事业、DOE 和未来燃料循环运营商的相邻机会， 而不是当前高量级业务线。这种拆分说明，SHINE
              的采用路径更少依赖泛化品牌认知，更多依赖每个工作流内部的可靠性证明、物流、许可和产能扩张。
