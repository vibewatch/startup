            body: >-
              当前私募价格未披露，SHINE 的估值应采用宽场景区间和明确假设，而不是假精确数学。悲观情景假设 Chrysalis 延期、美国本土 Mo-99 经济性不及预期，投资人仍主要把 SHINE
              视为资本开支很重的特种供应商，SPECT 提供一些现金流支撑。基准情景假设 SPECT 整合延续、Lu-177 采用扩大、Chrysalis
              继续推进但还没有产出足够披露级别的经济性；这足以支撑可观的数十亿美元估值，但不足以说明任何未披露轮次显然便宜。乐观情景要求更多：Chrysalis 可靠爬坡、整条同位素到分销的整合栈确实跑通，并且运营透明度足以让
              SHINE 与溢价放射性药物平台可信比较。在这些条件下，公开可比对象指向真实上行。缺少这些条件，正确动作是跟踪，而不是追高。因此，建议并不是看空公司，而是反对假精确。SHINE
              可能最终值高得多，但前提是调试、利用率和融资结构问题收窄。
