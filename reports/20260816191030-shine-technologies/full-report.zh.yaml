  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 阶段 / 指标
      - 估值或状态
      - 为何对 SHINE 有参考价值
      - 关键局限
    rows:
      - - SHINE Technologies
        - 非上市综合同位素 / SPECT / Lu-177 / Mo-99 平台；融资轮价格未披露
        - 累计融资 >$1B；2026 年 Series E 轮金额 $240M
        - 直接研究对象；检验投资者愿意为一个商业化真实但仍不透明的综合同位素基础设施故事支付什么价格
        - 未披露投后估值、股权结构表或合并经济性
      - - Telix Pharmaceuticals
        - 上市商业化放射性药物平台
        - 2026 年 8 月市值约 $4.01B；Q2 收入 $247M；FY26 收入 + 其他收入 >$1B
        - 最能说明强商业执行的放射性药物平台在公开市场值多少钱
        - 披露多得多，治疗业务占比更高，且已经上市
      - - Lantheus / Curium 交易
        - 规模化诊断业务叠加诊疗一体化的战略组合
        - 2026 年 8 月 Lantheus 市值约 $6.58B；Curium 同意最高以约 $8.0B 收购
        - 说明诊断和治疗基础设施合并后，更宽的放射性药物平台可以拿到什么价格
        - 现金流成熟度和既有组合远高于 SHINE
      - - BMS / RayzeBio 交易
        - 临床阶段放射性药物平台 M&A
        - 交易价值约 $4.1B
        - 可作为锚点，观察买方如何在全面商业化前给差异化制造 + 管线定价
        - 治疗管线可比对象，不是同位素供应或诊断整合可比对象
      - - Lilly / POINT 交易
        - 后期放射性配体平台 M&A
        - 交易价值约 $1.4B
        - 对拥有管线和制造、但平台宽度不及 SHINE 目标的公司，这是有用的低端战略锚点
        - Point 是更传统的治疗平台，没有 SHINE 的 Mo-99/SPECT 组合
      - - Curium 资本重组
        - 非上市规模化放射性药物平台
        - Curium 称，2025 年资本重组对集团估值约 $7B
        - 说明私人市场投资者也会给规模化同位素分销和制造平台很高估值
        - Curium 已是全球化平台，运营成熟度也高得多
      - - ITM Radiopharma
        - 非上市综合同位素 + 后期治疗公司
        - 2025 年最高 $262.5M 债务融资；估值未披露
        - 有用信号：基础设施叠加后期资产，不上市也能拿到大额资本
        - 融资规模不等于股权价值
      - - Nusano
        - 非上市同位素基础设施建设者
        - 2024 年 Series C 轮 >$115M；估值未披露
        - 可作为低端基础设施参照，观察市场对同位素供应扩建的资本胃口
        - 阶段早得多，商业多元化也弱于 SHINE
    notes: 这组可比对象有意混合，而不是纯机械筛选。SHINE 横跨诊断、治疗性同位素供应，以及未来 Mo-99 / 聚变期权价值，所以战略交易往往比单看收入倍数更有用。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful 2026 public radiopharma platform anchors and adjacent private financing signals
        reviewed for this chapter, but not every isotope or nuclear-medicine company.
