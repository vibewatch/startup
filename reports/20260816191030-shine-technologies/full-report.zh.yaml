      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动是结构性的。诊断买方需要美国本土韧性，因为 Mo-99/Tc-99m 链条仍容易受到反应堆停机和运输衰变损失影响。随着 Pluvicto、 Lutathera 等基于 Lu-177
              的肿瘤药物商业化放量，以及更多放射性配体管线寻找可靠前体供应，治疗需求正在上升。SHINE 也受益于整合： SPECT 收购创造了一条进入医院和影像中心的下游路径，Sumitomo 和 UKAEA
              关系则支持地域和应用扩张。但约束同样真实。 放射性同位素衰变太快，无法囤货，因此供应链几乎必须实时运转。Lu-177 需要富集原料、有许可的处理能力和专门物流。诊断和治疗市场也会惩罚执行滑坡，
              因为漏发可能直接打乱患者排期。最后，Mo-99 机会有明确经济风险：NorthStar 退出表明，如果海外补贴产能继续压低价格， 爱国式本土供应逻辑不会自动转化为盈利生产。
