            body: >-
              SHINE 各项业务的公开定价透明度都很低，因此承销必须聚焦变现机制，而不是公开价目表。SPECT 诊断业务卖进成熟的放射性药房和医院渠道， 报销机制和可变对价比标价更关键。Lantheus 的 10-K
              有参考价值，因为它显示诊断放射性药物经济性如何被常规订单、返利和报销政策塑造。 Lu-177 方面，SHINE 的 GTM 看起来像典型 B2B 供应：与 ImaginAb、GlyTherix、Telix
              等开发商签合同， 价值来自纯度、可靠性和符合监管级要求的交付，而不是终端市场品牌拉动。Mo-99 方面，SHINE 历史上的 HTA 和 GE 协议显示，
              公司策略是接入既有发生器链条，而不是重建一条链。公司最好的公开销售效率代理因此不是 SaaS 指标，而是供应协议、地域覆盖、重复订购逻辑、 SPECT 渠道复用，以及 Chrysalis 上线后的交叉销售潜力。
