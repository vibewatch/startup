  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险叠加
        blocks:
          - type: paragraph
            body: >-
              SHINE 的第一层风险来自法律和监管，复杂度明显高于普通工业项目。Chrysalis 受 NRC 许可规则约束；这些规则把许可和执照转让、运行执照资质、环境审查、公众介入权都视为关键闸口。风险不只是 SHINE
              最终能否获准运营，而是每一步公司、融资和运营动作能否始终贴合许可基础。好消息是，多份官方来源显示进展扎实：ACRS 在 2022 年完成审查且没有未决事项，NRC 后续批准了 2026
              年建设许可证转让，DOE/NNSA 仍把 Chrysalis 定位为受政策支持的美国本土 Mo-99 项目。需要谨慎的是，政策支持不能消除法律敞口。回收项目仍有监管策略问题和潜在豁免需要处理，DOE
              融资路径仍附带条件，SHINE 也仍需在高层联邦支持之外取得各类许可和批准。投资人应把监管风险视为比种子期显著降险，但它仍是投资逻辑的核心。
