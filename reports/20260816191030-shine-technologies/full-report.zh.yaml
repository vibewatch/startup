  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - 股权结构表和优先权
        - Series E 后股数、清算优先权、认股权证、契约条款，以及任何优先融资索取权
        - 决定表面的私人市场估值标记能否转化为真实普通股价值
        - 索取股权结构表、条款清单摘要和董事会融资材料
      - - SPECT 经济性
        - 收购标的按产品拆分的收入、毛利率、营运资本情况和整合计划
        - 说明诊断基础是在资助增长，还是只是在增加复杂度
        - 索取交割模型、产品 P&L 和整合仪表盘
      - - Lu-177 持续性
        - 复购率、定价、贡献利润率，以及相对剂量产能的利用率
        - 需要用它判断治疗性供应是否配得上平台溢价倍数
        - 索取客户队列视图和制造良率资料包
      - - Chrysalis 就绪度
        - 调试计划、包销假设、产量预期和停机应急方案
        - 这是当前估值支撑通往未来综合现金流的主桥梁
        - 索取总进度表、就绪评审和首年运营模型
      - - 市场力量与多源采购
        - 客户集中度、独家性和切换成本证据
        - 决定 SHINE 在战略市场里实际有多少定价权
        - 索取头部客户组合、合同期限和续约行为
      - - 独立价格支撑
        - 任何支持 2026 年价格的 409A、老股交易、要约或外部估值标记
        - 区分真实市场出清估值与融资动能、叙事带来的估值托举
        - 索取最新董事会估值材料和任何老股交易证据
    notes: 每一行都对应一个缺失输入。它可能让 SHINE 从值得关注的独角兽变成可执行投资，也可能让这家看似有前景的平台变成定价过高的风险。
    claimRefs:
      - CV010
      - CV039
      - CV040
