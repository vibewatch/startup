  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - 继续研究 / 观察
        - 平台信号强，但没有公开轮次价格、股权结构表或合并经济性
        - 不要把「独角兽以上」叙事自动当成买入理由
      - - 置信度
        - 中
        - 许多核心战略和商业事实已公开，但决定估值的输入仍未公开
        - 采用宽区间，投入新钱前必须先尽调
      - - 风险评级
        - 高
        - 调试、融资结构和供应链执行都可能显著改变股权价值
        - 先测算下行和稀释，再看上行期权
      - - 估值立场
        - 宽口径 $2.0B-$3.5B 基准区间合理；精确价格支撑不足
        - 公开可比公司支撑数十亿美元潜力，但不支持虚假精确
        - 价格纪律优先于追涨
      - - 偏好的入场纪律
        - 等待更低价格，或明显更强的证据
        - 最佳证据关口是 Chrysalis 准备状态、一体化利润率和披露条款
        - 只有证据改善快于价格上涨，才积极重审
      - - 可能退出判断
        - 仅凭公开数据，战略出售仍比近期 IPO 更清晰
        - 行业 M&A 活跃，但 SHINE 还需要更多运营证据
        - 退出要按情景建模，不能当作可兑现结果
    notes: 建议明确对价格敏感。公司好不代表投资好；如果轮次条款不透明，或价格已经打满，仍可能是一笔差投资。
    claimRefs:
      - CV002
      - CV003
      - CV010
      - CV028
      - CV036
      - CV037
      - CV038
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 当前判断
      - 支撑证据
      - 改变判断的因素
    rows:
      - - 资本可得性
        - 投资逻辑
        - 累计融资 >$1B、新近 $240M 轮次和 DOE 支持，显示融资承接很深
        - 若出现降价轮、惩罚性资本结构，或条件未能达成，该逻辑会迅速走弱
      - - 商业证明
        - 带保留的投资逻辑
        - 收购 SPECT 加上 Lu-177 发货，让 SHINE 比纯未来聚变故事更实
        - 需要真实分部收入、利润率和复购数据，证据才足以支撑投资
      - - 平台整合
        - 带保留的投资逻辑
        - Mo-99、SPECT 和 Lu-177 放在一起，可能拼出少见的一体化同位素平台
        - Chrysalis 爬坡弱或整合差，会显著削弱优势
      - - 披露质量
        - 反向逻辑
        - 没有公开投后估值、股权结构表、烧钱速度或合并收入桥
        - 完整融资和运营资料包会显著提升确信度
      - - 客户议价力
        - 混合
        - 已有具名合作伙伴，但 Telix 采用多源采购，Sumitomo 仍有条件约束
        - 独家或粘性更强的商业合同会增强定价权
      - - 行业背景
        - 正面但拥挤
        - 放射性药物 M&A 和上市可比公司显示，战略买家对平台胃口很大
        - 如果 SHINE 证明经济性之前行业倍数降温，溢价可能被压缩
    notes: 本表把「SHINE 具有战略重要性」的证据，与「当前任何私人市场价格有吸引力」的证据拆开看。两者不是同一个问题。
