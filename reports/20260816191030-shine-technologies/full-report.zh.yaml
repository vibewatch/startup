  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台产品与其服务的客户任务
        blocks:
          - type: paragraph
            body: >-
              SHINE 卖的不是单一聚变产品，而是一个分层运营平台。当前公开产出覆盖常规 SPECT 诊断、Lu-177 前体供应、中子测试服务和相邻中子应用， 同时用同一套科学基础向 Mo-99
              和燃料回收扩张。核医学表面现在比创业公司的同位素推介更宽，因为 SHINE 拥有 TechneLite 和一组已嵌入医院工作流的成熟 SPECT 放射性药物产品。与此同时，公司把 Ilumira
              定位为放射性标记用 Lu-177 前体， 把 FLARE 定位为面向国防、航天和先进能源客户的专门辐射效应测试服务。尽调必须看到，公司技术栈的价值并不只在聚变发电到来时才成立；
              它已经通过高度受监管、时间敏感的客户任务变现。分析难点是把今天已经交付的东西，同仍在路线图或扩产阶段的东西分开。
