  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方 / 用户角色与渠道
        blocks:
          - type: paragraph
            body: >-
              SHINE 的客户基础不是一个同质市场。诊断业务通过成熟 SPECT 渠道卖给医院、影像中心、放射性药房和核医学临床医生。 Lu-177 业务向上游卖给放射性药物开发商、学术实验室、癌症中心和研究机构，它们把
              Ilumira 当作前体或研究输入，而不是成品药。 第三类客户包括购买中子测试或材料验证服务的工业、国防和聚变相邻账户。最后，SHINE 正通过 Sumitomo 等合作伙伴，以及在欧洲通过 EMA
              许可产品准入，建设分销和市场准入渠道。这种拆分很重要，因为每个群体的购买摩擦、证明标准和耐久度都不同。医院 / 放射性药房需求往往运营黏性强，
              但依赖渠道；生物技术项目能释放强信号价值，但如果试验失败，也可能消失；分销伙伴关系扩大触达，却不等于终端客户拉动。
