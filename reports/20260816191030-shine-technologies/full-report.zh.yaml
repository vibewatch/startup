      - number: '3.4'
        title: 中子测试替代方案与 FLARE 独特性的边界
        blocks:
          - type: paragraph
            body: >-
              FLARE 有差异化，但差异并不来自对有意义中子测试替代方案的独占准入。Los Alamos 的 LANSCE/WNR 设施提供类似宇宙射线的中子能谱， 通量超过大气通量 1 million
              倍，可用于半导体器件加速测试；Sandia 的 ACRR 则被描述为具备脉冲能力和专用辐照腔的一座独特反应堆。
              对某些政府或先进研究工作负载而言，这些设施在原始束流特征或历史信任上可能强于商业服务。因此，SHINE 的竞争切口更窄、更实用： FLARE
              被定位成专门商业服务，提供可靠束流时间、高稳态通量，并比供不应求的公共设施有更快周转。这足以赢下一些紧急商业工作，
              尤其当提案周期、用户协议、场地准入或运输规则让公共实验室使用变得繁琐时。但正确的承销立场是，FLARE 比拼的是便利性、排期和客户服务， 而不是它没有可信替代品。
            claimRefs:
