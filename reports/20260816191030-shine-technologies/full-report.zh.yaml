  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格信号与披露缺口
        blocks:
          - type: paragraph
            body: >-
              SHINE 的估值争论始于一种少见组合：实力强，但不透明。实力确实存在：公司公开披露 2026 年 $240 million 股权融资，称累计融资已超过 $1 billion，拿到 DOE 最高 $263
              million 的有条件承诺，还完成 Lantheus SPECT 收购，让公司立刻拥有一个持续运转的诊断业务，而不只是面向未来的聚变故事。不透明也同样真实：公开材料仍未披露 2026
              年投后估值、股权结构表、优先股堆叠、合并收入、毛利率、现金或烧钱速度。这很重要，因为估值纪律取决于企业已经变现多少，以及新资金在普通股之前占据多高的权利顺位，而不是故事讲得多好。换句话说，SHINE
              显然释放了严肃的市场出清资本信号，但公开证据更能证明相关性，还不能证明入场价格。因此，估值底部比当前价格上限更容易辩护。只要投资人还看不到最新资本买到的具体经济权利，理性姿态就是把对 SHINE
              战略进展的认可，和愿意支付某个具体轮次价格分开。
