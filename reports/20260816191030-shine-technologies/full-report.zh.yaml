  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与公开收入流
        blocks:
          - type: paragraph
            body: >-
              SHINE 的公开收入模型现在有四层。第一，2026 年 1 月 Lantheus SPECT 收购带来了一组运营中的诊断产品组合，已嵌入医院和放射性药房工作流。 第二，SHINE
              向治疗性放射性药物开发商和临床项目销售 Lu-177 前体供应。第三，FLARE 以服务业务形式变现中子测试。 第四，Chrysalis 计划之后增加美国本土 Mo-99
              和其他同位素收入，但这部分收入今天仍处于商业化前。与典型聚变创业公司相比， 这一组合显著改善了 SHINE 的财务画像，因为市场里已经有产品和服务活动。同时，公开披露对收入流存在性的说明，仍远多于对规模的说明。
              SHINE 反复提到即时收入、客户发货和供应协议，但未披露合并收入、细分组合或毛利率。最有用的外部代理是被收购 SPECT 卖方的监管文件， 它显示真实诊断需求模式，也说明 SHINE
              买下的业务有实质意义，而非象征性资产。
