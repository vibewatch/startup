      - number: '3.5'
        title: 护城河耐久度、切换成本与最可信的替代风险
        blocks:
          - type: paragraph
            body: >-
              SHINE 最有防御性的竞争故事，不是垄断供应某一种同位素，而是有机会成为一个横跨治疗性 Lu-177 供应、未来美国本土 Mo-99 生产、 下游 SPECT
              分销和中子衍生相邻业务的一体化美国平台。这种宽度超过多数单一模态同行；如果执行到位，它可能比海外同位素既有企业或单品创业公司更好地触达客户。
              但宽度也有反面。平台逻辑会制造管理注意力风险，因为专业同行可以完全聚焦一个模态或一个客户群。最强外部威胁不是某家创业公司在功能战里“打败” SHINE，而是既有生态和买方多源采购让 SHINE
              只是众多合格供应商之一。反应堆既有企业仍比 SHINE 公开 Mo-99 足迹更大、更成熟；
              一体化治疗公司和医院买方也可以用替代供应商绕开任何单一厂商议价。护城河是可能成立的，但前提是运营执行把平台宽度转成客户端更低摩擦和更高可靠性。
