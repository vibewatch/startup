  - id: TV005
    title: 投资逻辑破裂与放弃触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - Chrysalis 时间表延误
        - 调试或爬坡显著不及当前预期
        - 切断 SHINE 当前叙事通往综合 Mo-99 现金流的最重要桥梁
        - 在新的已验证时间表出现前，将估值区间下修至接近悲观情景
      - - 惩罚性下一轮融资
        - 降价轮、沉重优先权，或昂贵结构化资本
        - 说明表面的融资金额没有转化为有吸引力的普通股价值
        - 在资本堆叠经济性清楚前，将建议重置为回避
      - - 综合毛利率偏弱
        - SPECT + Lu-177 未能显示有吸引力的合并毛利率画像
        - 削弱 SHINE 应享有高溢价放射性药物平台待遇的判断
        - 按专业供应商而非平台给 SHINE 估值
      - - 渠道转化失败
        - Sumitomo 或其他商业渠道仍只是期权价值，没有重复性终端需求
        - 降低对地理扩张规模化变现的信心
        - 把增长故事视作早期阶段，并大幅折价
      - - Lu-177 利用率不足
        - 产能口径仍高，但复购订单和利用率维持低位
        - 削弱目前最强、且贴近治疗业务的验证信号
        - 压缩乐观和基准情景
      - - 只有政策支持、缺少经济性
        - 本土供应的战略重要性仍高，但价格 / 成本数据继续隐藏
        - 说明公共政策价值没有转化为可支撑投资判断的业务质量
        - 没有证据前，不要支付战略溢价倍数
    notes: 这些是估值触发项，不是泛泛风险。每一项都会直接改变商业化概率，或改变新投资者可获得的价值。
