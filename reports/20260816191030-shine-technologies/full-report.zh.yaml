companyProfile:
  summary: >-
    SHINE Technologies 是一家位于 Wisconsin Janesville 的私营核技术公司，由 Greg Piefer 于 2010 年创立。公司使用聚变驱动的中子系统生产医用同位素， 现在通过收购来的
    Lantheus 业务销售 SPECT 诊断产品，向放射性药物项目供应 Lu-177 前体材料，通过 FLARE 提供中子测试服务， 并在建设 Chrysalis 设施，把美国本土 Mo-99
    生产推进为更一体化的“同位素到分销”平台。在打着聚变标签的创业公司里， 公开证据显示 SHINE 已有少见的真实商业触点，但多数可用于承销的财务细节仍未披露。
