            body: >-
              最有用的可比对象不是其他聚变公司，而是放射性药物平台、供应链资产和战略交易；它们说明市场愿意为稀缺同位素基础设施和商业化路径付多少钱。Telix
              提供了一个公开证明点：一家快速增长的放射性药物公司，在年收入运行率超过 $1 billion 时，可以支撑约 $4 billion 的股权价值。Lantheus 和 Curium
              说明，规模化诊断加诊疗一体化基础设施的平台价值可以更高。RayzeBio 和 POINT 则显示，只要临床阶段放射性药物平台带来差异化制造和供应能力，买方仍愿意支付高额溢价。但 SHINE
              和其中任何一家都不完全可比。它把 SPECT 分销、Lu-177 前体供应、Mo-99 雄心、中子服务，以及长期回收 / 聚变期权放在一起。因此，可比公司适合作为估值锚，而不是机械套倍数。
