chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、地点与商业化模型
        blocks:
          - type: paragraph
            body: >-
              SHINE Technologies 于 2010 年在 Wisconsin Janesville 正式注册，业务至今仍扎根当地。公司把自己定位成一个商业驱动的聚变平台，
              而不是单一项目型科学公司：它用源自聚变的中子源销售中子测试服务、生产用于诊断和癌症治疗的医用同位素、建设未来乏燃料回收业务， 最终还计划推进聚变发电。当前运营足迹覆盖 Janesville 占地 105
              英亩的总部园区，内含 Chrysalis、Cassiopeia 和 Building One； Wisconsin Fitchburg 的系统与制造园区；以及 2026 年 1 月 Lantheus
              交易完成后纳入的 Massachusetts North Billerica SPECT 制造基地。运营足迹很关键，因为 SHINE 已不只是一个开发阶段的聚变叙事：它已经发货
              Lu-177，运营受监管的核医学基础设施， 并收购了一项成熟的诊断分销业务。因此，核心商业模式主张具备可信度，但 Chrysalis Mo-99 扩产的时间表和经济性仍是尽调核心问题。
