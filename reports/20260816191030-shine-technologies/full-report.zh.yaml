      - number: '4.3'
        title: 成本结构、营运资本与单位经济性可见度
        blocks:
          - type: paragraph
            body: >-
              成本驱动因素比实际利润率数字更容易识别。SHINE 的同位素业务处在一个困难的物理系统里：放射性材料衰变很快，速度、开工率和发货纪律都会影响财务表现。 Lantheus 文件显示 TechneLite
              存在每周常规订单，因为半衰期压缩了补货周期；SHINE 自己的 Mo-99 页面也呼应了这种物流压力。 成本端，资本设备、近似反应堆的核系统、cGMP 处理、监管合规和原材料采购都很重要。DOE 环境函确认
              Chrysalis 是在建中的大型资产， Lantheus 文件则强调了 Mo-99 上游供应商集中度。SHINE 未来在 Lu-177 上可能有可观毛利率优势，因为它生产自己的 Yb-176 原料，
              并已建成显著剂量产能，但这仍是假设，不是已披露结果。公开资料没有披露毛利率、损耗率、发货经济性或各业务线贡献利润率， 因此单位经济性仍主要是尽调占位项。
