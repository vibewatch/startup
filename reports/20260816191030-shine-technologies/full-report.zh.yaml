  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              承销 SHINE 时，应把它看成多线核技术供应商，而不是纯粹的未来电力公司。到 2026 年，公司通过 Lantheus SPECT 收购已经真实接触诊断放射性药物市场， 通过 Ilumira Lu-177
              供应治疗性同位素前体，通过 FLARE 提供辐射效应测试，并布局更远期的回收和聚变能源项目。因此，市场边界包括诊断同位素制造和分销、
              面向放射性药物管线的治疗性同位素前体销售，以及付费中子测试服务。边界明确排除大宗电网电力收入，因为 SHINE 尚未销售电力； 也排除成品药经济性，因为 Ilumira
              销售的是前体，而不是已获标签的药品。现状替代方案因工作流而异：诊断端是海外反应堆 Mo-99 供应和既有 SPECT 示踪剂，治疗端是反应堆和回旋加速器 Lu-177
              供应，中子服务端则是供不应求的反应堆测试设施。边界逻辑很重要， 因为单一的聚变能源 TAM 标题会遮住一个事实：SHINE 已经在多个采购系统里竞争，买方、时间线和风险承受力各不相同。
