      - number: '2.2'
        title: 规模测算视角与受证据约束的需求代理
        blocks:
          - type: paragraph
            body: >-
              公开数据支持几种有用的规模测算视角，但没有一个干净、通用的 SAM。最宽的视角下，SHINE 称已完成的 SPECT 收购让公司立刻进入一个 $19 billion 的核医学市场。更窄的诊断视角聚焦
              Mo-99/Tc-99m：SHINE 自己的 Mo-99 页面称，它覆盖约 85% 的核医学诊断扫描， 美国每天约 56,000 例患者检查；DOE 和 Argonne
              则称，美国接近全球需求的一半，却仍依赖进口。治疗视角更容易用收入量化： 一个市场来源称 2026 年 Lu-177 供应市场为 $1.63 billion，另一个来源把更广的 Lu-177 市场估为 2025 年
              $2.85 billion、 2026 年 $3.80 billion。这些估计在增长方向上一致，但范围并不完全相同，因此应保留为区间，而不是强行合成一个数字。 含义是，SHINE
              的近期价值创造来自服务已被验证、且供应可靠性稀缺的临床同位素需求，而不是说服世界相信聚变能源本身市场很大。
