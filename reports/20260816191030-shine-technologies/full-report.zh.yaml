      - number: '4.5'
        title: 财务结论、公开缺口与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开证据支持一个比“尚未产生收入的聚变公司”更有利的财务判断，但还不足以完整承销。收入质量已经改善，因为 SHINE 现在拥有真实诊断产品组合， 在重复发生的放射性药房工作流中运营，并有多个外部 Lu-177
              合作方，加上 FLARE 服务业务。资本基础也足够深，可以继续建设。 但决定投资纪律的数字仍缺失：分细分市场收入组合、实际成交定价、毛利率、烧钱速度、营运资本画像，以及 SPECT 现金流中有多少能资助
              Chrysalis， 而不是仅与它并存。这个缺口很重要，因为 SHINE 的财务未来取决于一个问题：Chrysalis 会成为盈利、可扩张的美国本土 Mo-99 资产，
              还是会继续成为需要外部融资支撑的资本黑洞？在管理层披露或尽调确认这些指标之前，正确结论是收入可选性改善，但利润率和现金跑道风险仍未解决。
