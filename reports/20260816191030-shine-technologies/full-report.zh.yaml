      - number: '2.5'
        title: 相互矛盾的估计与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              主要分析陷阱是把相邻市场误当成可互换市场。SHINE 最宽的叙事连接核医学、聚变中子测试、乏燃料回收和最终聚变发电， 但每条线的需求单位和客户经济性都不同。公开 Lu-177
              市场报告在范围和增长率上分歧明显，因此后续估值应使用情景，而不是单一共识数字。 公开证据对终端市场需求的支持强于对 SHINE 精确获取机制的支持：仍没有干净的公开收入拆分，能区分
              Lu-177、SPECT、中子测试或商业化前 Mo-99。 同样，公开资料显示燃料回收可能变得重要，但尚未证明存在一个近期开启采购的成熟市场。尽调中决定性的缺项是分细分市场收入组合、 各产品线签约量、SPECT
              整合后的毛利率结构，以及 Chrysalis 能否按计划把显而易见的买方需求转成商业产出。
            claimRefs:
              - CM020
              - CM021
              - CM030
