              当前最有决策价值的估值工作，不是猜一个遥远的 EBITDA 倍数，而是找出哪些证据真正会改变判断。第一块缺失拼图是股权经济性：Series E 后的持股、优先权、契约条款，以及任何与 DOE
              背书融资绑定的优先索偿权。第二块是运营质量：收购来的 SPECT 毛利结构、Lu-177 重复订单、实现价格、损耗，以及相对于 SHINE 声称产能的利用率。第三块是 Chrysalis
