            body: >-
              SHINE 的扩张逻辑很有吸引力：先拿下 Lu-177 和 SPECT 客户，增加分销伙伴，等 Chrysalis 上线后，再交叉销售更完整的诊断加治疗平台。公司 2025-2026 年的动作——EMA
              批准、收购 Lantheus、拓展 Sumitomo 渠道、继续推进临床供应合作——都支撑这个叙事。但同一组公开记录也暴露了集中风险。许多具名 Lu-177
              账户仍是商业化前的生物制药公司或研究用户，未来收入可能压在少数推进中的项目和狭窄渠道上。诊断侧，SHINE 接手的装机基础更耐久，但也继承了 SPECT
              业务的渠道集中和供应链执行预期。因此，客户故事更准确的说法是：证明点已经多元，经济贡献却可能集中。公开证据支持扩张潜力；但扩张后的收入基础是否均衡、是否抗压，仍未披露。
