  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估计估值区间（USDb）
      - 对入场价格的含义
      - 概率信号
    rows:
      - - 悲观
        - Chrysalis 延误，Mo-99 经济性仍未证明，投资者主要只给 SPECT 和有限的 Lu-177 期权价值定价
        - 1.2-2.0
        - 没有私人证据抵消时，任何高于 $2B 出头的价格都显得偏高
        - 如果调试和融资延误叠加，就会构成实质信号
      - - 基准
        - SPECT 完成整合，Lu-177 扩张，Chrysalis 推进，但经济性和融资条款大多仍不公开
        - 2.0-3.5
        - 除非入场价接近区间低端，或尽调质量改善，否则最多只能算合理
        - 按当前公开证据看最可能
      - - 乐观
        - Chrysalis 稳定爬坡，整合分销跑通，运营披露开始接近优质放射性药物平台
        - 3.5-5.5
        - 如果投资者还能在 SHINE 被按成熟上市可比公司定价前进入，就有上行空间
        - 需要多个验证关口通过，而不是一条头条消息
    notes: 区间是估计的企业价值带，来自战略交易锚点、上市放射性药物可比公司，以及 SHINE 罕见的多资产平台形态。它们不是 DCF 结果。
