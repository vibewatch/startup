            body: >-
              通过同位素工作流最容易理解产品架构。诊断端，SHINE 的 Mo-99 路径使用加速器驱动中子源和液态靶，随后依赖放射化学分离和纯化步骤， 在紧张的半衰期约束下交付当前行业纯度。历史上的 Argonne
              Mini-SHINE 示范很重要，因为它展示的是生产、分离和纯化链条， 而不只是物理学证明。治疗端，Lu-177 在 SHINE
              公开网站上不是成品药，而是供合作方与靶向分子结合的前体。这个底层放射性核素有数天半衰期， 同时具备 beta/gamma
              属性，对治疗和成像都有价值；但质量要求仍然严格，因为这些材料进入患者护理工作流。因此，公开证据在 SHINE 展示工艺流程、
              纯度、处理和产品标签细节的地方最强；在需要批放行指标、收率或损耗数据的地方最弱，而这些仍是私有信息。
