            body: >-
              Lu-177 领域已经足够拥挤，SHINE 不能只靠本土品牌立足。ITM、Isotopia、Nusano 和一体化治疗生态都构成可信替代方案或议价参照。 ITM 把自己定位为临床和研究用例供应商；Isotopia
              强调同时提供 n.c.a. 和 c.a. Lu-177，并在以色列和美国生产；Nusano 把自己营销成药企、医院和诊所的稳定性提供者；TBRC 则列出更广的一组 Lu-177 主要参与者，包括
              Novartis、Telix、Curium、 Nusano 和 ITM。Telix 自己的披露尤其重要，因为它显示买方会有意搭建多供应商网络，而不是依赖单一来源，切换成本也因此弱于某些医疗科技市场。
              因此，SHINE 的优势必须来自服务水平、质量和触达客户的路径，而不是假定的独家性。SHINE 自身的规模和原材料策略是有意义的利好， 但 Isotopia 等竞争者也提出了很强的可靠性和全球足迹主张。
