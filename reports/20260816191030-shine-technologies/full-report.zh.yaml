              耐久度是公开记录明显变薄的地方。部分 SHINE 客户关系并非一次性，证据令人鼓舞：SPECT 业务带来几十年的既有工作流， 同位素需求因衰变和常规成像需求而天然重复，SHINE 也公开提到高 OTIF
              表现和不断扩大的地域覆盖。但这些都还不是已披露的 NRR、 GRR、流失率、合同期限或账户集中度。即便是具名 Lu-177 客户集合，也以开发阶段或研究导向关系为主，购买节奏会随着试验设计、
              监管进展或资本可得性迅速变化。公开客户显然重视可靠性——这个主题出现在 Telix、Rossi 的医院评论、Cincinnati Children’s 故事和 UW-Madison
              引述中——但投资人仍需要硬性的重复订单数据，才能判断 SHINE 是在成为深度嵌入式供应商，还是只是一个有前景的替代方案， 进入了一个本来就有意多源采购的市场。
