              渠道、具名治疗账户，以及比典型早期聚变公司更完整的高管团队。这些都是实打实的缓冲。但它们不足以中和会推翻投资逻辑的触发点。近期投资逻辑会在以下情形下破裂：Chrysalis 出现重大延期；DOE
              相关融资或许可条件落空；扩张期面向医院的可靠性下降；或者公司无法证明平台在经济上可持续，而不只是技术上亮眼。如果豁免、试点经济性或伙伴需求明显弱于当前路线图暗示，回收业务的期权价值也会大幅削弱。正确的尽调产出不只是风险清单，而是一张监控仪表盘，把排期、正常运行时间、质量、供应韧性、客户留存和融资交割条件绑定到明确的终止标准。
