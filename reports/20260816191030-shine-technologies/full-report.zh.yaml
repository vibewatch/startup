      - number: '1.5'
        title: 里程碑、监管进展与反向背景
        blocks:
          - type: paragraph
            body: >-
              作为一家私营聚变公司，SHINE 的里程碑记录可信且少见地宽。15 年公司回顾提到：2010 年注册成立，2011 年获得 DOE 合作支持， 2015 年 Argonne 验证同位素工艺，2016
              年获得首个基于聚变的医用同位素设施 NRC 施工许可，2019 年 Chrysalis 开工， 2020 年首次销售 Lu-177，2021 年收购 Phoenix，2023 年 NRC
              最终安全评估取得进展，2024 年 Cassiopeia 首批 Ilumira 剂量出货，2025 年入选 UKAEA LIBRTI 中子源项目，以及 2026 年围绕融资、SPECT 整合、DOE 贷款进展和
              AI 赋能回收工作的多项里程碑。 监管证据同样扎实：NRC 于 2023 年就运营许可证申请发布最终安全评估报告，DOE 于 2026 年完成潜在联邦融资的环境审查。 关键反向背景是，SHINE
              下一段增长仍取决于很难执行的项目交付。Radiology Business 指出，NorthStar 退出美国本土 Mo-99， 原因是无法在经济性上竞争，这说明技术可行并不保证大规模供应能盈利。同样，SHINE
              的乏燃料回收业务仍处于 NRC 预申请沟通阶段， 许可、保障措施和经济性距离证明仍有多年。
