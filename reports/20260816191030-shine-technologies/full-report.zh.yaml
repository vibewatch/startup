      - number: '1.4'
        title: 设施、产品与运营状态
        blocks:
          - type: paragraph
            body: >-
              公开运营证据显示，SHINE 正在多条战线同时推进。Janesville 的 Cassiopeia 已在生产 Ilumira，即 SHINE 的无载体添加 Lu-177 前体，年产能 100,000
              剂，并称有扩至 200,000 剂的路径。公司材料称，Ilumira 自 2024 年推出以来，已向四大洲 19 个国家的客户发货， OTIF 高于 95%。2026 年 1 月的 Lantheus 收购带来了
              TechneLite、Cardiolite、NEUROLITE、Xenon Xe-133、 North Billerica 的既有制造足迹，以及长期服务医院和影像中心的客户关系。Chrysalis
              是下一个主要规模释放点：DOE 2026 年 5 月的完成函称， 这个 Mo-99 项目位于 Janesville 占地 91 英亩的场地，约完成 75%。在医学之外，FLARE 及相关中子测试服务表明，
              SHINE 已把源自聚变的工业能力卖进国防和航天工作流。共同主线是，公司把同一套中子专业能力复用到相邻收入池。
