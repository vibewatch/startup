  - id: TR005
    title: 缓释措施与放弃标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - Chrysalis 许可 / 调试延误
        - 进度里程碑后移
        - 显著偏离管理层计划，或准备状态里程碑失败
        - 升级到投资逻辑失效复核；降低近期 Mo-99 经济性的权重
      - - DOE 融资失败
        - 先决条件状态
        - 未能满足关键技术、法律、环境或财务条件
        - 重新测算资本结构和项目完工可行性
      - - 医院 / 放射性药房服务可靠性下滑
        - OTIF、停摆、短缺或错过生产日的证据
        - 服务反复失约，或上游停摆时无法覆盖需求
        - 质疑既有客户基础耐久性和交叉销售假设
      - - 供应商集中 / 停摆压力
        - 处理商或反应堆停机
        - 一个或多个关键站点长期停摆，且没有替代覆盖
        - 重新评估 SPECT 渠道韧性和营运资本敞口
      - - 回收监管或经济性不达预期
        - 豁免清单、试点范围、capex/opex 差异
        - 试点需要明显更宽的豁免，或成本结构不具经济性
        - 大幅下调第三阶段期权价值
      - - 领导层或专业劳动力流失
        - 关键角色流失
        - 调试期间许可、运营或放射化学负责人意外流失
        - 上调执行风险权重，并索取应急人员配置计划
    notes: 放弃标准是用于持续尽调的可监测触发因素，不是一次性报告文字。
