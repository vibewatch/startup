      - number: '1.3'
        title: 融资历史、投资人基础与已披露资本支持
        blocks:
          - type: paragraph
            body: >-
              SHINE 已搭起应用聚变和核医学领域最深的私营资本堆栈之一，但公开记录对融资金额的披露远多于估值。官方时间线显示，2018 年 Deerfield 提供 $150 million 融资承诺，2019 年
              Oaktree 融资 $50 million，2020 年 Series C 轮 $80 million，2021 年由 Koch Disruptive Technologies 领投的 Series C-5 轮
              $150 million，以及 2026 年 2 月由 NantWorks 领投、Fidelity、 Sumitomo、Pelican、Deerfield 和 Oaktree 参与的 Series E 轮
              $240 million。SHINE 另称累计融资现已超过 $1 billion。 除股权融资外，公司还获得 DOE 对 Chrysalis 最高 $263 million
              的有条件承诺，以及更早与美国本土同位素生产相关的 DOE/NNSA 支持。
              正面解读是，投资人继续为一个越来越具体的平台买单，而不再只是资助纯实验室假设。负面解读是，公开估值仍未披露，类似债务的政府支持绑定具体项目，
              不能证明整体自由现金流韧性。结果是，公开数据对入场价格和稀释压力的约束仍严重不足。
