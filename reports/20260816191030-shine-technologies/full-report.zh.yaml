      - number: '4.4'
        title: 资本充足性、项目融资与融资依赖
        blocks:
          - type: paragraph
            body: >-
              SHINE 已披露的融资历史显示，公司持续能拿到资本，但也确认这门业务建设成本很高。公司公开宣布：2018 年 Deerfield 承诺 $150 million， 2019 年 Oaktree 融资 $50
              million，2020 年 Series C 轮 $80 million，2021 年 Series C-5 轮 $150 million， 以及 2026 年 Series E 轮 $240
              million。SHINE 还称累计融资现已超过 $1 billion。2026 年 4–5 月，DOE 专门绑定 Chrysalis 的支持进一步加固了资本堆栈，包括最高 $263 million
              的有条件承诺和已完成的环境审查。Sumitomo 2026 年投资也为亚洲市场商业化提供支持。 这是方向性利好：相比典型单资产聚变创业公司，SHINE
              显然有更多融资选项。但资本充足不等于财务自给。公开资料未披露手头现金、月度烧钱速度、 契约条款或现金跑道；2026 年股权轮也明确同时资助当前产品线和更长期的回收 / 聚变雄心。这意味着融资依赖仍是核心承销变量。
