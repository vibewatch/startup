      - number: '7.2'
        title: 运营、安全和质量风险
        blocks:
          - type: paragraph
            body: >-
              第二层是运营风险。SHINE 的技术模型跑在热室、辐照装置、随时间衰减的同位素、安全分析和运输约束里；普通执行失误很快就会变成患者可及性问题。官方和监管文件说明了原因。ACRS 描述的是一座首创设施，包含 8
              套辐照装置、热室处理、危害分析、数字资产安全考虑，以及排气系统故障、氚系统故障等事故场景。Lantheus 的文件则显示，诊断渠道依赖当日或近实时制造和发运窗口、海外 Mo-99
              加工商、每周常规订单，以及氙气大宗供应和部分制造伙伴等单一来源节点。公开层面的运营上行在于，SHINE 已通过 SPECT、Lu-177 和 FLARE
              把其中一部分复杂度商业化；下行在于，可靠性预期几乎不留余地。一次长期停机、发运中断、质量事件或人员缺口，都可能直接传导到医院、放射性药房、临床试验或国防排期。因此，运营和质量是最重要的非监管尽调类别。
