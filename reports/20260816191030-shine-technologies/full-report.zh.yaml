            body: >-
              诊断竞争集合仍由大型成熟组织主导，它们比 SHINE 早了几十年。NRG PALLAS 称自己是全球最大的辐照 Mo-99 靶材生产商， 并强调由 Curium 负责分离的单地点欧洲供应链。Curium
              称其产品在 60 多个国家受到信任；IRE 称自己是 Mo-99 生产领导者之一， 并披露了有意义的 2025 年运营规模。独立来源强化了这一点：这不是绿地市场。Exiger 把 Curium 和 IRE
              指为全球反应堆供应链中的核心处理商， Radiology Business 则通过记录 NorthStar 退出 Mo-99 生产，显示本土替代有多难。SHINE 2026 年 1 月收购 Lantheus，
              把一条历史悠久的医院和影像中心下游路径内化，部分改变了这种平衡，但没有消除核心挑战：既有诊断链条已经拥有规模、许可历史和嵌入式客户行为， SHINE 仍必须靠 Chrysalis 执行来替代它们。
