  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局框架：竞争者类别与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              并不存在一个单一的“SHINE 竞争对手”。公司同时与基于反应堆的诊断同位素既有企业、治疗性同位素供应商、一体化放射性药物生态， 以及公共实验室中子测试替代方案竞争。在诊断中，相关替代方案是今天的海外
              Mo-99/Tc-99m 供应链，以及医院围绕这些供应链建立起来的工作流。 在治疗中，SHINE 的 Lu-177 业务与 ITM、Isotopia、Nusano
              等供应商及其他网络竞争，买方可以把这些网络组合使用，而不必一对一替换。 在中子测试中，FLARE 与其说在对抗另一家创业公司，不如说在对抗国家实验室设施；后者能提供独特中子环境，但往往带来提案或准入摩擦。
              这个框架很重要，因为各条线的替代动力完全不同：Mo-99 是触达客户和可靠性的竞争，Lu-177 是质量和冗余的竞争， FLARE 是速度和便利性的竞争。因此，投资人应在每个市场里拿 SHINE
              对照现状承销，而不是要求一个通用可比倍数或一个通用护城河论点。
