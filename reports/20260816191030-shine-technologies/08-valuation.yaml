    {
      "id": "thesis-breakers-and-final-diligence-asks",
      "title": "Thesis-break triggers and final diligence asks",
      "body": "The most decision-useful valuation work now is not guessing a distant EBITDA multiple; it is identifying what evidence would actually change the call. The first missing block is equity economics: post-Series E ownership, preferences, covenants, and any senior claims tied to DOE-backed financing. The second is operating quality: acquired SPECT margin profile, Lu-177 repeat ordering, realized pricing, spoilage, and utilization versus SHINE's stated capacity. The third is Chrysalis readiness: commissioning schedule, off-take assumptions, early yields, and the degree to which domestic Mo-99 can become a dependable cash generator rather than another capital sink. Public evidence already shows why this diligence matters. Sumitomo remains conditional, Telix multi-sources, and domestic isotope history shows that strategic importance alone does not guarantee equity returns. A premium rerating requires proof; a missed commissioning or punitive financing cycle would break the thesis quickly.",
