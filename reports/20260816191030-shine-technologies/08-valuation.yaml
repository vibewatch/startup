    {
      "id": "comparable-anchors-and-platform-validation",
      "title": "Comparable anchors and platform validation",
      "body": "The most useful comparables are not other fusion companies; they are radiopharma platforms, supply-chain assets, and strategic transactions that show what the market will pay for scarce isotope infrastructure and commercialization paths. Telix provides a public proof point that a fast-growing radiopharma company can support a roughly $4 billion equity value while generating revenue above a $1 billion annual run-rate. Lantheus and Curium show even larger platform value for scaled diagnostics-plus-theranostics infrastructure. RayzeBio and POINT show that buyers will still pay large premiums for clinical-stage radiopharma platforms when they bring differentiated manufacturing and supply capabilities. But SHINE is not a clean match to any of them. It combines SPECT distribution, Lu-177 precursor supply, Mo-99 ambition, neutron services, and long-range recycling/fusion optionality. That justifies using comps as valuation anchors rather than as mechanical multiples.",
