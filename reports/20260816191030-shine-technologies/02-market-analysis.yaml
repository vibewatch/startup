      "id": "growth-drivers-and-constraints",
      "title": "Growth drivers and adoption constraints",
      "body": "The strongest demand drivers are structural. Diagnostics buyers want domestic resilience because the Mo-99/Tc-99m chain remains vulnerable to reactor outages and decay losses in transport. Therapeutic demand is rising as Lu-177-based oncology drugs such as Pluvicto and Lutathera scale commercially and as more radioligand pipelines seek dependable precursor supply. SHINE also benefits from integration: the SPECT acquisition created a downstream route into hospitals and imaging centers, while Sumitomo and UKAEA relationships support geographic and application expansion. But the constraints are equally real. Radioisotopes decay too quickly to warehouse, so supply chains must work almost in real time. Lu-177 requires enriched feedstock, licensed handling, and specialized logistics. Diagnostic and therapeutic markets also punish execution slips because missed deliveries can directly disrupt patient schedules. Finally, the Mo-99 opportunity has clear economic risk: NorthStar\u2019s exit showed that patriotic domestic-supply logic does not automatically translate into profitable production if foreign subsidized capacity keeps pricing under pressure.",
