      "id": "sizing-lenses-and-demand-proxies",
      "title": "Sizing lenses and evidence-constrained demand proxies",
      "body": "Public data supports several useful sizing lenses, but not one clean universal SAM. On the broadest lens, SHINE says the completed SPECT acquisition gives it immediate scale in a $19 billion nuclear-medicine market. A narrower diagnostics lens focuses on Mo-99/Tc-99m: SHINE\u2019s own Mo-99 page cites roughly 85% of nuclear-medicine diagnostic scans and about 56,000 U.S. patient studies per day, while DOE and Argonne describe the U.S. as nearly half of world demand yet still import-dependent. A therapeutic lens is easier to quantify in revenue terms: one market source puts the Lu-177 supply market at $1.63 billion in 2026, while another values the broader Lu-177 market at $2.85 billion in 2025 and $3.80 billion in 2026. Those estimates are directionally consistent on growth but not on exact scope, so they should be preserved as a range rather than forced into one number. The implication is that SHINE\u2019s near-term value creation comes from serving proven clinical demand in isotopes where supply reliability is scarce, not from convincing the world that fusion energy itself is large.",
