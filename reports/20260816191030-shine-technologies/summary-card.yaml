  topStrengths:
    - >-
      Unusually strong platform breadth for a private nuclear startup: SPECT diagnostics, Lu-177 supply, neutron
      testing, and future Mo-99 integration
    - >-
      Public capital support is deep, with a $240M 2026 round, cumulative funding above $1B, and DOE conditional
      financing support
    - >-
      The completed Lantheus SPECT acquisition gives SHINE immediate diagnostic workflow exposure rather than purely
      future-state revenue hopes
    - >-
      Ilumira international shipments and >95% OTIF indicate real operating traction in a difficult isotope-supply
      market
  topRisks:
    - The 2026 post-money valuation, cap table, preferences, revenue, margin, burn, and runway remain undisclosed
    - >-
      Chrysalis commissioning and integrated Mo-99 economics are the main bridge from current narrative strength to
      premium radiopharma valuation support
    - >-
      Radiopharma customers often multi-source, which can limit SHINE's pricing power even when the company is
      strategically relevant
    - >-
      Domestic isotope importance and policy support do not guarantee attractive equity outcomes if execution slips or
      financing becomes punitive
  unresolvedGaps:
    - Post-Series E valuation, ownership, liquidation preferences, and any financing covenants are not public
    - Acquired SPECT revenue, gross margin, working-capital profile, and integration economics remain undisclosed
    - Lu-177 repeat-order rates, pricing, utilization, and contribution margins are not public
    - Detailed Chrysalis commissioning schedule, early-yield assumptions, and off-take visibility are still missing
