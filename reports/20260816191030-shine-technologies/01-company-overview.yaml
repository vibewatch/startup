    {
      "id": "funding-and-capital-base",
      "title": "Funding history, investor base, and disclosed capital support",
      "body": "SHINE has assembled one of the deepest private capital stacks in applied fusion and nuclear medicine, but the public record is better on funding amounts than on valuation. The official chronology shows a $150 million Deerfield financing commitment in 2018, a $50 million Oaktree financing in 2019, an $80 million Series C in 2020, a $150 million Series C-5 in 2021 led by Koch Disruptive Technologies, and a $240 million Series E in February 2026 led by NantWorks with Fidelity, Sumitomo, Pelican, Deerfield, and Oaktree participating. SHINE separately says total funding now exceeds $1 billion. In addition to equity, the company received a DOE conditional commitment for up to $263 million for Chrysalis and earlier DOE/NNSA support tied to domestic isotope production. The positive read is that investors continue to fund an increasingly tangible platform rather than a pure laboratory thesis. The negative read is that public valuation remains undisclosed and debt-like government support is project-specific rather than proof of broad free-cash-flow resilience. That leaves entry pricing and dilution overhang materially underdetermined from public data.",
