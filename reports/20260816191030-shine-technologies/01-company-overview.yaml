    {
      "id": "milestones-regulation-and-adverse-context",
      "title": "Milestones, regulatory progress, and adverse context",
      "body": "SHINE's milestone record is credible and unusually broad for a private fusion company. The 15-year company retrospective cites incorporation in 2010, DOE partnership backing in 2011, Argonne validation of its isotope process in 2015, the first NRC construction permit for a fusion-based medical-isotope facility in 2016, Chrysalis construction in 2019, first Lu-177 sales in 2020, Phoenix acquisition in 2021, final NRC safety-evaluation progress in 2023, first Ilumira doses from Cassiopeia in 2024, UKAEA selection for the LIBRTI neutron source in 2025, and multiple 2026 milestones around funding, SPECT integration, DOE loan progress, and AI-enabled recycling work. Regulatory evidence is also substantive: NRC issued a final safety-evaluation report in 2023 for the operating-license application, and DOE completed environmental review for potential federal financing in 2026. The key adverse context is that SHINE's next growth leg still depends on hard-to-execute project delivery. Radiology Business noted that NorthStar exited domestic Mo-99 because it could not compete economically, underscoring that technical feasibility does not guarantee profitable large-scale supply. Likewise, SHINE's used-fuel recycling business remains in pre-application NRC engagement, with licensing, safeguards, and economics still years from proof.",
