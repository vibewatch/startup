    {
      "id": "operational-status-and-products",
      "title": "Facilities, products, and operational status",
      "body": "Public operating evidence shows SHINE progressing on multiple fronts at once. Cassiopeia in Janesville is already producing Ilumira, SHINE's non-carrier-added Lu-177 precursor, at an annual capacity of 100,000 doses with a stated expansion path to 200,000 doses. Company materials say Ilumira has shipped to customers in 19 countries across four continents with better than 95% on-time, in-full delivery since its 2024 launch. The January 2026 Lantheus acquisition added TechneLite, Cardiolite, NEUROLITE, Xenon Xe-133, an installed manufacturing footprint in North Billerica, and longstanding hospital and imaging-center relationships. Chrysalis is the next major scale unlock: DOE's May 2026 completion letter described the Mo-99 project as roughly 75% complete on a 91-acre Janesville site. Outside medicine, FLARE and related neutron-testing services show that SHINE already sells fusion-derived industrial capability into defense and aerospace workflows. The common thread is platform reuse of the same neutron expertise across adjacent revenue pools.",
