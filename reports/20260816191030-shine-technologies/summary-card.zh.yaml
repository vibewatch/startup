  topStrengths:
    - 作为私营核创业公司，平台宽度少见：SPECT 诊断、Lu-177 供应、中子测试，以及未来 Mo-99 集成。
    - 公共资本支持很深：2026 年 $240M 融资、累计融资超 $1B，且获得 DOE 有条件融资支持。
    - 已完成的 Lantheus SPECT 收购让 SHINE 立即接触诊断工作流，而不只是押注未来收入。
    - Ilumira 国际出货和 >95% OTIF 显示，公司在艰难的同位素供应市场已有真实运营牵引。
  topRisks:
    - 2026 年投后估值、股权结构、优先权、收入、毛利率、烧钱速度和现金跑道均未披露。
    - Chrysalis 投产和一体化 Mo-99 经济性，是从叙事强度走向高端放射性药物估值支撑的关键桥。
    - 放射性药物客户往往多源采购；即便 SHINE 具备战略价值，定价权也可能受限。
    - 国内同位素重要性和政策支持，并不保证股权回报好；一旦执行滑坡或融资惩罚性增强，结果可能走弱。
  unresolvedGaps:
    - Series E 后估值、所有权、清算优先权以及任何融资契约未公开。
    - 被收购 SPECT 业务的收入、毛利率、营运资本画像和整合经济性仍未披露。
    - Lu-177 复购率、定价、产能利用率和贡献毛利率未公开。
    - 详细 Chrysalis 投产时间表、早期良率假设和包销可见度仍缺失。
