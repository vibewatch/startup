        - Best public comp for what strong commercial radiopharma execution can be worth
        - Far more disclosed, more therapeutics-heavy, and already public
      - - Lantheus / Curium transaction
        - Scaled diagnostics plus theranostics strategic combination
        - Lantheus ~ $6.58B market cap in Aug. 2026; Curium agreed to buy it for up to ~$8.0B
        - Shows what a broader radiopharma platform can command when diagnostics and therapy infrastructure combine
        - Much more mature cash flow and established portfolio than SHINE
      - - BMS / RayzeBio transaction
        - Clinical-stage radiopharma platform M&A
        - ~$4.1B transaction value
        - Useful anchor for how buyers value differentiated manufacturing plus pipeline before full commercialization
        - Therapeutic pipeline comp, not isotope supply or diagnostic integration comp
      - - Lilly / POINT transaction
        - Late-stage radioligand platform M&A
        - ~$1.4B transaction value
        - >-
          Useful lower strategic anchor for a company with pipeline and manufacturing but less platform breadth than
          SHINE aspires to
        - Point was a more conventional therapy platform without SHINE's Mo-99/SPECT mix
      - - Curium recapitalization
        - Private scaled radiopharma platform
        - Curium said its 2025 recap valued the group at about $7B
        - Shows private investors also place large values on scaled isotope distribution and manufacturing platforms
        - Curium is already global and much more mature operationally
      - - ITM Radiopharma
        - Private integrated isotope plus late-stage therapeutics company
        - Up to $262.5M debt financing in 2025; valuation undisclosed
        - Useful signal that infrastructure plus late-stage assets can access sizable capital without public markets
        - Financing size is not the same thing as equity value
