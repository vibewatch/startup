      - number: '6.4'
        title: Retention, durability, and repeat-usage visibility
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public record becomes much thinner. There is encouraging evidence that some SHINE
              customer relationships are not one-off: the SPECT operation comes with decades of installed workflow,
              isotope demand is inherently recurring because of decay and routine imaging needs, and SHINE publicly
              cites high OTIF performance plus growing geographic coverage. Yet none of this amounts to disclosed NRR,
              GRR, churn, contract duration, or concentration by account. Even the named Lu-177 customer set is
              dominated by development-stage or research-oriented relationships where purchase cadence can change
              quickly with trial design, regulatory progress, or capital availability. Public customers clearly value
              reliability—this theme appears in Telix, Rossi’s hospital comments, the Cincinnati Children’s story, and
              the UW-Madison quote—but investors still need hard repeat-order data to know whether SHINE is becoming a
              deeply embedded supplier or simply a promising alternative in a market that intentionally multi-sources.
