      - number: '3.3'
        title: Lu-177 supplier landscape and buyer multi-sourcing behavior
        blocks:
          - type: paragraph
            body: >-
              The Lu-177 field is crowded enough that SHINE cannot rely on domestic branding alone. ITM, Isotopia,
              Nusano, and integrated therapy ecosystems all present credible alternatives or bargaining references. ITM
              positions itself as a supplier to clinical and research use cases; Isotopia emphasizes dual n.c.a. and
              c.a. Lu-177 forms plus production in Israel and the U.S.; Nusano markets itself as a stability provider to
              drugmakers, hospitals, and clinics; and TBRC identifies a broader set of major Lu-177 participants that
              includes Novartis, Telix, Curium, Nusano, and ITM. Telix’s own disclosure is especially important because
              it shows a buyer intentionally building a multi-supplier network rather than depending on one source. That
              means switching costs are weaker than in some medtech markets. The implication is that SHINE’s advantage
              must come from service level, quality, and route-to-customer, not presumed exclusivity. SHINE’s own scale
              and raw-material strategy are meaningful positives, but competitors such as Isotopia also make strong
              reliability and global-footprint claims.
