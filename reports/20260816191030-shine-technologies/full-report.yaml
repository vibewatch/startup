      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Cap table and preferences
        - Post-Series E share count, liquidation preferences, warrants, covenants, and any senior financing claims
        - Determines whether the headline private mark translates into real common-equity value
        - Request cap table, term-sheet summary, and board financing materials
      - - SPECT economics
        - Acquired revenue by product, gross margin, working-capital profile, and integration plan
        - Shows whether the diagnostic base funds growth or simply adds complexity
        - Request closing model, product P&Ls, and integration dashboard
      - - Lu-177 durability
        - Repeat-order rates, pricing, contribution margin, and utilization versus dose capacity
        - Needed to know whether therapeutic supply deserves premium platform multiples
        - Request customer cohort view and manufacturing-yield pack
      - - Chrysalis readiness
        - Commissioning plan, off-take assumptions, yield expectations, and downtime contingency
        - This is the main bridge from current valuation support to future integrated cash flow
        - Request master schedule, readiness reviews, and first-year operating model
      - - Market power versus multi-sourcing
        - Customer concentration, exclusivity, and switching-cost evidence
        - Determines how much pricing power SHINE actually has in a strategic market
        - Request top-account mix, contract durations, and renewal behavior
      - - Independent price support
        - Any 409A, secondary, tender, or outside marks supporting the 2026 price
        - Separates a real market-clearing valuation from financing momentum and narrative carry
        - Request latest board valuation materials and any secondary transaction evidence
    notes: >-
