      - number: '7.3'
        title: Partner, dependency, and customer-side risks
        blocks:
          - type: paragraph
            body: >-
              SHINE’s platform breadth creates a wide dependency map. Some dependencies are positive because they
              validate the market: Telix, UKAEA, Sumitomo, DOE/NNSA, and hospital channels all show real external pull.
              But those same dependencies also cap control. Buyers like Telix intentionally multi-source; distribution
              partners like Sumitomo are conditional; government financing remains subject to conditions; and
              hospital/radiopharmacy customers expect continuous supply regardless of upstream complexity. The SPECT
              acquisition also changes the customer-risk profile. It gives SHINE an installed channel and operating
              history, but it inherits the operational burden of serving hospitals across North America and Canada with
              products that cannot tolerate delivery slippage. This is why partner risk should not be reduced to vendor
              concentration alone. It includes counterparty optionality, channel conversion, customer switching, and the
              fact that SHINE’s most visible growth accounts in Lu-177 are still often developmental rather than fully
              scaled commercial buyers.
