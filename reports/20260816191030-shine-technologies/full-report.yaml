      - number: '1.2'
        title: Leadership, governance, and key-person concentration
        blocks:
          - type: paragraph
            body: >-
              Greg Piefer remains the founder and chief executive officer and is still the public strategist linking
              SHINE's applied-fusion businesses to its long-term energy thesis. The 2026 leadership reshuffle added
              late-stage scaling talent: Kyle Stacey joined as chief financial officer, David Willbrand joined as chief
              legal officer, Chris Lee shifted from CFO to chief strategy officer, and Ralph Alexander joined the board.
              The Lantheus SPECT acquisition also brought in Michael Rossi as CEO of SHINE SPECT USA, adding deep
              radiopharmaceutical operating experience. This is directionally positive for institutionalization because
              SHINE is moving from founder-led capital formation into multi-site execution across radiopharma,
              recycling, and government-backed projects. Even so, key-person dependence remains meaningful. Piefer still
              anchors external fundraising, product narrative, and long-range strategic positioning, while Lee's long
              tenure and Rossi's integration mandate make them important execution nodes. Public materials do not
              provide a full governance-rights map for every major investor, so board-control and protective-provisions
              diligence remains incomplete from public evidence alone.
