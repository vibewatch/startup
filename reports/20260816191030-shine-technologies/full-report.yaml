  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price signal versus disclosure gap
        blocks:
          - type: paragraph
            body: >-
              SHINE's valuation debate starts with an unusual mix of strength and opacity. The strength is real: the
              company publicly disclosed a $240 million 2026 equity round, says total funding now exceeds $1 billion,
              added a DOE conditional commitment for up to $263 million, and completed the Lantheus SPECT acquisition
              that immediately gave it a standing diagnostic business instead of a purely future-state fusion story. The
              opacity is equally real: public materials still do not disclose the 2026 post-money valuation, cap table,
              preference stack, consolidated revenue, gross margin, cash, or burn. That matters because valuation
              discipline depends less on storytelling quality than on how much of the enterprise is already monetizing
              and how much of the new money sits ahead of common equity. In other words, SHINE clearly has a serious
              market-clearing capital signal, but public evidence is still better at proving relevance than proving
              entry price. The valuation floor is therefore easier to justify than the current price ceiling. Until
              investors see exactly what economic rights the latest capital bought, the rational posture is to separate
              admiration for SHINE's strategic progress from willingness to pay any specific round mark.
            claimRefs:
              - CV001
              - CV002
