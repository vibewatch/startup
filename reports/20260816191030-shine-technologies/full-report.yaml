              outputs span routine SPECT diagnostics, Lu-177 precursor supply, neutron-testing services, and adjacent
              neutron applications, while using the same scientific base to expand toward Mo-99 and fuel recycling. The
              nuclear-medicine surface is now broader than a startup isotope pitch because SHINE owns TechneLite and a
              set of established SPECT radiopharmaceutical products already embedded in hospital workflows. In parallel,
              the company markets Ilumira as a Lu-177 precursor for radiolabeling, and FLARE as a dedicated
              radiation-effects testing service for defense, aerospace, and advanced-energy customers. This matters for
              diligence because the company’s technology stack is not valuable only if fusion power arrives; it is
              already being monetized through highly regulated, time-sensitive customer jobs. The analytical challenge
              is to separate what is already delivered today from what is still roadmap or scale-up.
