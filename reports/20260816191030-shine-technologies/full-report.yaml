  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              SHINE should be underwritten as a multi-line nuclear-technology supplier rather than as a pure-play future
              electricity company. In 2026 the company has tangible exposure to diagnostic radiopharmaceuticals through
              the Lantheus SPECT acquisition, therapeutic isotope precursor supply through Ilumira Lu-177,
              radiation-effects testing through FLARE, and longer-dated recycling and fusion-energy programs. That means
              the relevant market boundary includes diagnostic isotope manufacturing and distribution, therapeutic
              isotope precursor sales into radiopharma pipelines, and paid neutron-testing services. It explicitly
              excludes bulk grid-power revenue because SHINE does not yet sell electricity, and it excludes
              finished-drug economics because Ilumira is sold as a precursor rather than as a labeled medicine. The
              status quo substitutes differ by workflow: foreign reactor-based Mo-99 supply and incumbent SPECT tracers
              in diagnostics, reactor and cyclotron Lu-177 supply in therapeutics, and oversubscribed reactor test
              facilities in neutron services. This boundary logic matters because a single headline fusion-energy TAM
              would hide the fact that SHINE already competes in multiple procurement systems with different buyers,
              timelines, and risk tolerances.
