  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation starts with strong funding and commercial-surface proof, then subtracts missing economics,
      financing-structure opacity, and commissioning risk before landing on research-more / track.
    approximationNotes: This is a qualitative decision map, not a weighted scorecard.
    data:
      nodes:
        - id: funding
          label: 'Strong capital signal: $240M 2026 round and >$1B cumulative funding'
          type: input
        - id: commercial
          label: 'Commercial proof: SPECT acquisition + Lu-177 shipments + FLARE'
          type: input
        - id: policy
          label: 'Strategic support: DOE conditional commitment + domestic isotope relevance'
          type: input
        - id: gaps
          label: 'Evidence gap: no public post-money valuation, cap table, burn, or margin bridge'
          type: process
        - id: commission
          label: 'Execution risk: Chrysalis commissioning and integration quality'
          type: process
        - id: rec
          label: 'Recommendation: RESEARCH-MORE / TRACK until price support improves'
          type: output
      edges:
        - from: funding
          to: rec
          label: supports interest
        - from: commercial
          to: rec
          label: supports interest
        - from: policy
          to: rec
          label: supports strategic case
        - from: gaps
          to: rec
          label: constrains conviction
        - from: commission
          to: rec
          label: constrains price paid
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV007
      - CV010
      - CV036
      - CV038
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Illustrative midpoint valuation estimates show that the biggest swing factor is whether SHINE clears integration
      and commissioning proof before the next financing cycle.
    approximationNotes: Values are estimated USD millions based on milestone-adjusted radiopharma comparison, not management guidance.
    data:
      items:
        - label: Capital signal only
          value: 1800
        - label: Plus clean SPECT integration
          value: 2400
        - label: Plus stronger Lu-177 utilization proof
          value: 2900
        - label: Plus on-time Chrysalis ramp
          value: 3800
        - label: Plus disclosed integrated margins and durable demand
          value: 5000
    claimRefs:
      - CV005
      - CV007
      - CV017
      - CV023
      - CV029
      - CV035
      - CV045
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Bear, base, and bull valuation bands highlight that SHINE is clearly worth more than a generic early fusion
      startup, but still lacks enough public evidence for a narrow target price.
    approximationNotes: >-
      Ranges are estimated USD billions derived from public strategic transactions, public-market radiopharma comps, and
      SHINE's integrated-platform ambitions.
    data:
      items:
        - label: Bear case
          low: 1.2
          high: 2
          unit: $B
        - label: Base case
          low: 2
          high: 3.5
          unit: $B
        - label: Bull case
          low: 3.5
          high: 5.5
          unit: $B
    claimRefs:
      - CV032
      - CV033
      - CV034
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring shows SHINE strongest on strategic relevance and capital access, middling on commercial proof,
      and weakest on disclosure quality and price transparency.
    approximationNotes: Scores are analyst judgments on a 1-5 scale derived from the public evidence reviewed for this chapter.
    data:
      items:
        - label: Market tailwind
          value: 4.5
          unit: /5
          note: Diagnostic and therapeutic isotope demand is real and growing.
        - label: Capital support
          value: 4.5
          unit: /5
          note: Funding depth and DOE support are unusually strong for a fusion-branded startup.
        - label: Commercial proof
          value: 3.5
          unit: /5
          note: SPECT and Lu-177 proof are meaningful but still disclosure-light.
        - label: Platform differentiation
          value: 4
          unit: /5
          note: Integrated isotope-to-distribution story is uncommon and strategically appealing.
        - label: Execution certainty
          value: 2.5
          unit: /5
          note: Chrysalis and integrated-margin proof remain ahead.
        - label: Economics disclosure
          value: 1.5
          unit: /5
          note: No public post-money valuation, revenue bridge, gross margin, or burn.
        - label: Valuation support
          value: 2.5
          unit: /5
          note: Multi-billion value is plausible, but the current private price is not underwritable from public data alone.
    claimRefs:
      - CV002
      - CV010
      - CV017
      - CV023
      - CV033
      - CV036
      - CV037
      - CV038
