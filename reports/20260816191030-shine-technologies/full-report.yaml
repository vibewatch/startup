      - number: '2.3'
        title: Buyer, user, payer, and adoption path by segment
        blocks:
          - type: paragraph
            body: >-
              SHINE sells into at least five distinct buying motions. In Mo-99 and SPECT diagnostics, hospital imaging
              centers, radiopharmacies, and downstream diagnostic-product distributors care about continuity of supply,
              regulatory handling, and workflow fit. In Lu-177 therapeutics, the direct buyer is usually a
              radiopharmaceutical company or clinical sponsor, while the end user is a treatment center or trial site
              that needs reliable precursor supply to keep patient schedules on track. Neutron-testing is different
              again: the buyer is an aerospace, defense, or advanced-energy engineering organization procuring
              radiation-effects data, often on program budgets rather than healthcare budgets. Fusion-materials testing
              for UKAEA-like customers sits in public R&D and industrial-lab budgets, while used-fuel recycling remains
              an adjacency aimed at utilities, DOE, and future fuel-cycle operators rather than a present high-volume
              line of business. This segmentation shows why SHINE’s adoption path depends less on generic brand
              awareness and more on reliability proof, logistics, licensing, and capacity expansion within each
              workflow.
