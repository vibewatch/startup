        title: 'Diagnostic incumbents: reactor-based Mo-99 chains and SPECT distribution'
        blocks:
          - type: paragraph
            body: >-
              The diagnostic competitive set is still led by large, mature organizations that predate SHINE by decades.
              NRG PALLAS describes itself as the world’s largest producer of irradiated Mo-99 targets and highlights a
              one-location European supply chain with Curium performing separation. Curium says its products are trusted
              in more than 60 countries, while IRE says it is one of the leaders in Mo-99 production and discloses
              meaningful 2025 operating scale. Independent sources reinforce that this is not a greenfield market:
              Exiger points to Curium and IRE as central processors inside the global reactor-based supply chain, and
              Radiology Business shows how difficult domestic displacement has been by documenting NorthStar’s exit from
              Mo-99 production. SHINE’s January 2026 Lantheus acquisition partially changes this balance by
              internalizing one historic downstream route to hospitals and imaging centers, but it does not eliminate
              the core challenge: incumbent diagnostic chains already possess scale, licensing history, and embedded
              customer behavior that SHINE still has to displace through Chrysalis execution.
