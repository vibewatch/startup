      - number: '1.4'
        title: Facilities, products, and operational status
        blocks:
          - type: paragraph
            body: >-
              Public operating evidence shows SHINE progressing on multiple fronts at once. Cassiopeia in Janesville is
              already producing Ilumira, SHINE's non-carrier-added Lu-177 precursor, at an annual capacity of 100,000
              doses with a stated expansion path to 200,000 doses. Company materials say Ilumira has shipped to
              customers in 19 countries across four continents with better than 95% on-time, in-full delivery since its
              2024 launch. The January 2026 Lantheus acquisition added TechneLite, Cardiolite, NEUROLITE, Xenon Xe-133,
              an installed manufacturing footprint in North Billerica, and longstanding hospital and imaging-center
              relationships. Chrysalis is the next major scale unlock: DOE's May 2026 completion letter described the
              Mo-99 project as roughly 75% complete on a 91-acre Janesville site. Outside medicine, FLARE and related
              neutron-testing services show that SHINE already sells fusion-derived industrial capability into defense
              and aerospace workflows. The common thread is platform reuse of the same neutron expertise across adjacent
              revenue pools.
            claimRefs:
              - CO024
              - CO029
              - CO030
              - CO031
              - CO036
      - number: '1.5'
        title: Milestones, regulatory progress, and adverse context
        blocks:
          - type: paragraph
            body: >-
              SHINE's milestone record is credible and unusually broad for a private fusion company. The 15-year company
              retrospective cites incorporation in 2010, DOE partnership backing in 2011, Argonne validation of its
              isotope process in 2015, the first NRC construction permit for a fusion-based medical-isotope facility in
              2016, Chrysalis construction in 2019, first Lu-177 sales in 2020, Phoenix acquisition in 2021, final NRC
              safety-evaluation progress in 2023, first Ilumira doses from Cassiopeia in 2024, UKAEA selection for the
              LIBRTI neutron source in 2025, and multiple 2026 milestones around funding, SPECT integration, DOE loan
              progress, and AI-enabled recycling work. Regulatory evidence is also substantive: NRC issued a final
              safety-evaluation report in 2023 for the operating-license application, and DOE completed environmental
              review for potential federal financing in 2026. The key adverse context is that SHINE's next growth leg
              still depends on hard-to-execute project delivery. Radiology Business noted that NorthStar exited domestic
              Mo-99 because it could not compete economically, underscoring that technical feasibility does not
              guarantee profitable large-scale supply. Likewise, SHINE's used-fuel recycling business remains in
              pre-application NRC engagement, with licensing, safeguards, and economics still years from proof.
            claimRefs:
              - CO026
              - CO027
              - CO028
              - CO032
              - CO033
              - CO034
              - CO035
