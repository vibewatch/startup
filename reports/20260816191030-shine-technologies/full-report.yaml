            body: >-
              Public pricing transparency is poor across SHINE’s businesses, which means underwriting has to focus on
              monetization mechanics rather than published price cards. For SPECT diagnostics, the acquired business
              sells into established radiopharmacy and hospital channels where reimbursement mechanics and variable
              consideration matter more than list price. Lantheus’s 10-K is useful because it shows how diagnostic
              radiopharmaceutical economics are shaped by standing orders, rebates, and reimbursement policy. For
              Lu-177, SHINE’s GTM looks like classic B2B supply: contracts with developers such as ImaginAb, GlyTherix,
              Telix and others, with value created through purity, reliability, and regulatory-grade delivery rather
              than end-market brand pull. For Mo-99, SHINE’s historic HTA and GE agreements show a strategy of plugging
              into the existing generator chain instead of rebuilding it. The company’s best public sales-efficiency
              proxies are therefore non-SaaS indicators: supply agreements, geographic reach, repeat ordering logic,
              channel reuse from SPECT, and cross-sell potential once Chrysalis comes online.
