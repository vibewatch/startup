      - number: '7.4'
        title: People, model, and execution risks
        blocks:
          - type: paragraph
            body: >-
              Even if licensing progresses, SHINE still has to execute a demanding model. Public documents show that
              this is not just an engineering challenge but a sequencing challenge: equipment systems are still being
              completed, the licensing basis has evolved to support phased operations, specialized radiopharmaceutical
              workforces remain thin, and the company is trying to integrate diagnostics, therapeutics, neutron
              services, recycling, and long-range fusion into one platform. The leadership bench looks deeper than many
              startups—SHINE publicly lists experienced executives across operations, technology, people, legal,
              finance, strategy, government affairs, and SPECT—but bench breadth is a mitigant, not proof. The critical
              execution risk is whether management focus gets diluted across too many fronts before Chrysalis and the
              nuclear-medicine platform become operationally routine. Investors should therefore separate admirable
              ambition from monitorable execution: staffing depth, system completion, commissioning cadence, and the
              ability to keep the highest-value programs on schedule matter more than visionary scope alone.
