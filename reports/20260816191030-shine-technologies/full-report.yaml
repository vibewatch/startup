              Children’s Hospital. These references matter because they cover multiple stages of adoption: preclinical
              work, clinical supply, hospital calibration, and geographic distribution. The SPECT business adds a
              separate proof layer because it comes with an installed diagnostic workflow already serving hospitals and
              imaging centers across North America. But the proof quality varies. Some references include named users
              and specific outcomes, such as Cincinnati Children’s urgent dose delivery or UW/WARF preclinical results;
              others are still announcement-led clinical supply agreements with limited public follow-through. The right
              read is that SHINE has real customer activity across multiple subsegments, but not every logo should be
