      - number: '4.4'
        title: Capital adequacy, project finance, and financing dependence
        blocks:
          - type: paragraph
            body: >-
              SHINE’s disclosed funding history shows persistent access to capital, but also confirms that the business
              is expensive to build. The company publicly announced a $150 million Deerfield commitment in 2018, a $50
              million Oaktree financing in 2019, an $80 million Series C in 2020, a $150 million Series C-5 in 2021, and
              a $240 million Series E in 2026. SHINE also says cumulative funding now exceeds $1 billion. In April-May
              2026, that capital stack was reinforced by DOE support tied specifically to Chrysalis, including a
              conditional commitment for up to $263 million and a completed environmental review. Sumitomo’s 2026
              investment adds commercialization support in Asian markets. This is directionally positive: SHINE clearly
              has more financing options than a typical single-asset fusion startup. But capital adequacy is still not
              the same as financial self-sufficiency. Public sources do not disclose cash on hand, monthly burn,
              covenant terms, or runway, and the 2026 equity round was explicitly funding both current product lines and
              longer-range recycling/fusion ambitions. That means financing dependency remains a central underwriting
