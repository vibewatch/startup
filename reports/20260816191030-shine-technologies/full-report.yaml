        - Strong platform signal, but no public round price, cap table, or consolidated economics
        - Do not treat the unicorn-plus narrative as an automatic buy
      - - Confidence
        - Medium
        - Many core strategic and commercial facts are public, but the decisive valuation inputs remain private
        - Use broad ranges and require diligence before underwriting new money
      - - Risk rating
        - High
        - Commissioning, financing structure, and supply-chain execution can all change equity value materially
        - Underwrite downside and dilution before upside optionality
      - - Valuation stance
        - Broad $2.0B-$3.5B base range is plausible; exact price support is insufficient
        - Public comps support multi-billion potential but not false precision
        - Prefer price discipline over momentum-chasing
      - - Preferred entry discipline
        - Wait for either lower price or materially better proof
        - Best proof gates are Chrysalis readiness, integrated margins, and disclosed terms
        - Revisit aggressively only if evidence improves faster than the price
      - - Likely exit posture
