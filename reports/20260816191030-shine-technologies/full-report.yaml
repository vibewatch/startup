chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, location, and commercialization model
        blocks:
          - type: paragraph
            body: >-
              SHINE Technologies officially incorporated in Janesville, Wisconsin in 2010 and still anchors the business
              there. The company frames itself as a commercially driven fusion platform rather than a single-project
              science company: it uses fusion-derived neutron sources to sell neutron-testing services today, to produce
              medical isotopes for diagnostics and cancer therapy, to build a future used-fuel recycling business, and
              ultimately to pursue fusion energy generation. The current operating footprint spans a 105-acre Janesville
              headquarters campus that includes Chrysalis, Cassiopeia, and Building One; a Fitchburg, Wisconsin
              systems-and-manufacturing campus; and, after the January 2026 Lantheus transaction, a North Billerica,
              Massachusetts SPECT manufacturing site. That operating footprint matters because SHINE is no longer only a
              development-stage fusion narrative: it already ships Lu-177, operates regulated nuclear-medicine
              infrastructure, and has acquired an established diagnostic distribution business. The core business-model
              claim is therefore credible, but the timing and economics of Chrysalis Mo-99 scale-up remain central
              diligence questions.
