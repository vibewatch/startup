      - number: '3.4'
        title: Neutron-testing substitutes and the limits of FLARE uniqueness
        blocks:
          - type: paragraph
            body: >-
              FLARE is differentiated, but not by exclusive access to meaningful neutron-testing alternatives. Los
              Alamos’s LANSCE/WNR facilities provide cosmic-ray-like neutron spectra at more than a million times
              atmospheric flux for accelerated testing of semiconductor devices, and Sandia’s ACRR is described as a
              one-of-a-kind reactor with pulsing capability and specialized irradiation cavities. For some government or
              advanced research workloads, those facilities are likely stronger than a commercial service on raw beam
              characteristics or legacy trust. SHINE’s competitive wedge is therefore narrower and more practical: FLARE
              is positioned as a dedicated commercial service with reliable beam time, high steady-state flux, and
              faster cycle times than oversubscribed public facilities. That can be enough to win urgent commercial
              work, especially when proposal cycles, user agreements, site access, or shipping rules make public-lab
              access cumbersome. But the correct underwriting stance is that FLARE competes on convenience, scheduling,
              and customer service, not that it faces no credible substitute.
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP036
      - number: '3.5'
        title: Moat durability, switching costs, and the most credible displacement risks
        blocks:
          - type: paragraph
            body: >-
              SHINE’s most defensible competitive story is not monopoly supply of any one isotope. It is the prospect of
              becoming an integrated U.S. platform spanning therapeutic Lu-177 supply, future domestic Mo-99 production,
              downstream SPECT distribution, and neutron-derived adjacencies. That breadth is broader than most
              single-modality peers and, if executed well, could create a better route to customer than either foreign
              isotope incumbents or single-product startups. However, breadth cuts both ways. The same platform logic
              creates management-focus risk, because specialized peers can concentrate entirely on one modality or one
              customer set. The strongest external threat is not one startup “beating” SHINE in a feature war; it is
              entrenched ecosystems and buyer multi-sourcing making SHINE just one acceptable supplier among many.
              Reactor incumbents remain larger and more mature than SHINE’s public Mo-99 footprint, while integrated
              therapy companies and hospital buyers can use alternative suppliers to negotiate around any one vendor.
              The moat is plausible, but only if operational execution turns platform breadth into lower friction and
              higher reliability for customers.
