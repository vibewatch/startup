  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments, buyer/user roles, and channels
        blocks:
          - type: paragraph
            body: >-
              SHINE’s customer base is not one homogeneous market. Its diagnostic business sells into hospitals, imaging
              centers, radiopharmacies, and nuclear-medicine clinicians through established SPECT channels. Its Lu-177
              business sells upstream into radiopharmaceutical developers, academic labs, cancer centers, and research
              institutions that use Ilumira as a precursor or research input rather than a finished drug. A third
              category includes industrial, defense, and fusion-adjacent accounts buying neutron-testing or
              material-validation services. Finally, SHINE is building distribution and market-access channels through
              partners such as Sumitomo and, in Europe, through EMA-cleared product access. This segmentation matters
              because each group has different buying friction, proof standards, and durability. Hospital/radiopharmacy
              demand tends to be operationally sticky but channel-dependent; biotech programs create strong signaling
              value but can disappear if trials fail; and distribution partnerships improve reach but are not the same
              thing as end-customer pull.
