  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public revenue streams
        blocks:
          - type: paragraph
            body: >-
              SHINE’s public revenue model now has four distinct layers. First, the January 2026 Lantheus SPECT
              acquisition brought an operating diagnostic product portfolio with established hospital and radiopharmacy
              workflows. Second, SHINE sells Lu-177 precursor supply into therapeutic radiopharmaceutical developers and
              clinical programs. Third, FLARE monetizes neutron-testing as a services business. Fourth, Chrysalis is
              intended to add domestic Mo-99 and other isotope revenue later, but that revenue remains pre-commercial
              today. This mix materially improves the company’s financial profile versus a typical fusion startup
              because there is already product and service activity in market. At the same time, public disclosure is
              still far better on the existence of revenue streams than on their scale. SHINE repeatedly cites immediate
              revenue, customer shipments, and supply agreements, but does not disclose consolidated revenue, segment
              mix, or gross margin. The most useful outside proxy is the acquired SPECT seller’s filing, which shows
              real diagnostic demand patterns and suggests the business SHINE bought is meaningful rather than symbolic.
