            body: >-
              The cost drivers are easier to identify than the actual margin numbers. SHINE’s isotope businesses live
              inside a difficult physical system: radioactive materials decay quickly, making speed, uptime, and
              shipping discipline financially important. Lantheus’s filing shows weekly standing orders for TechneLite
              because half-lives compress replenishment cycles, and SHINE’s own Mo-99 page echoes that logistics
              pressure. On the cost side, capital equipment, reactor-adjacent nuclear systems, cGMP handling, regulatory
              compliance, and raw-material sourcing all matter. The DOE environmental letter confirms Chrysalis is a
              very large asset under construction, while Lantheus’s filing highlights upstream supplier concentration in
              Mo-99. SHINE may have a meaningful future gross-margin advantage in Lu-177 because it produces its own
              Yb-176 feedstock and built significant dose capacity, but that remains a hypothesis rather than a
              published result. Public sources do not disclose gross margin, spoilage rate, shipment economics, or
