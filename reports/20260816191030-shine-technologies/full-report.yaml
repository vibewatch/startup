              source, with flux ranges, activation-foil validation, ITAR compliance, and physical constraints on test
              articles. That specificity supports the view that FLARE is a real operating service rather than a concept
              demo. The same neutron-generator base also spills into other adjacencies. DHS selected SHINE for a
