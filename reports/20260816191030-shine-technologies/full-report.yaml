companyProfile:
  summary: >-
    SHINE Technologies is a Janesville, Wisconsin private nuclear-technology company founded in 2010 by Greg Piefer. The
    company uses fusion-driven neutron systems to produce medical isotopes, now sells SPECT diagnostic products through
    the acquired Lantheus business, supplies Lu-177 precursor material to radiopharma programs, offers neutron-testing
    services through FLARE, and is building the Chrysalis facility to bring domestic Mo-99 production into a more
    integrated isotope-to-distribution platform. Public evidence shows unusually real commercial surfaces for a
    fusion-branded startup, but it still leaves most underwriting-grade financial details undisclosed.
