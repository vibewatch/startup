        title: Exhibits
        blocks:
          - type: callout
            title: Nuclear medicine, not electricity, drives the investable near-term market
            body: >-
              Public evidence shows SHINE already has commercial and distribution exposure in isotopes, while fusion
              energy remains a long-range aspiration. Investors should therefore underwrite isotope reliability,
              route-to-customer, and integration execution before assigning major value to future power generation.
            calloutType: insight
            claimRefs:
