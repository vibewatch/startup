  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Chrysalis timing slip
        - Commissioning or ramp materially misses current expectations
        - Removes the most important bridge from SHINE's current narrative to integrated Mo-99 cash flow
        - Cut the range toward bear case until a new verified schedule exists
      - - Punitive next financing
        - Down round, heavy preferences, or expensive structured capital
        - Shows current headline funding did not translate into attractive common-equity value
        - Reset recommendation to avoid until stack economics are clear
      - - Weak integrated margins
        - SPECT plus Lu-177 fail to show attractive combined gross-margin profile
        - Undercuts the idea that SHINE deserves premium radiopharma-platform treatment
        - Value SHINE more like a specialty supplier than a platform
      - - Channel conversion failure
        - Sumitomo or other commercial channels remain option value without recurring end demand
        - Reduces confidence that geographic expansion will monetize at scale
        - Treat growth story as early and discount heavily
      - - Lu-177 utilization shortfall
        - Capacity headline remains high but repeat orders and utilization stay low
        - Weakens the best current therapeutics-adjacent proof signal
        - Compress bull and base cases
      - - Policy support without economics
        - Domestic-supply strategic importance remains high but price/cost data stay hidden
        - Shows public-policy relevance is not converting into underwritable business quality
        - Do not pay strategic-premium multiples without proof
    notes: >-
      These are valuation triggers rather than generic risks. Each one directly changes either commercialization
      probability or the value available to new investors.
