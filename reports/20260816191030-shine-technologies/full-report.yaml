      - number: '2.5'
        title: Contradictory estimates and remaining diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The main analytical trap is to confuse adjacent markets with interchangeable markets. SHINE’s broadest
              narrative connects nuclear medicine, fusion-neutron testing, used-fuel recycling, and eventual fusion
              power, but each line has different units of demand and different customer economics. Public Lu-177 market
              reports disagree materially on scope and growth rate, so later valuation work should use scenarios instead
              of a single consensus number. Public evidence is also better on end-market demand than on SHINE’s precise
              capture mechanics: there is still no clean public split of revenue by Lu-177, SPECT, neutron testing, or
              pre-commercial Mo-99. Similarly, public sources show that fuel recycling could become economically
              important, but they do not yet prove a mature market with near-term procurement velocity. For diligence,
              the decisive missing items are segment-level revenue mix, contracted volume by product line, gross-margin
              structure after the SPECT integration, and evidence that Chrysalis can convert obvious buyer need into
              commercial output on schedule.
            claimRefs:
              - CM020
              - CM021
              - CM030
              - CM031
              - CM035
              - CM036
              - CM037
              - CM038
