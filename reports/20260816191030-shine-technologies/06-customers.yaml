  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "SHINE now has a more tangible customer base than most fusion-adjacent companies, but the proof is uneven by segment. The strongest evidence sits in nuclear medicine: an acquired SPECT business already serving hospitals and imaging centers, named Lu-177 customers across clinical, hospital, university, and biotech settings, and growing geographic reach for Ilumira. The weakest evidence is on durability and concentration. Public sources prove adoption surfaces and some delivery quality, yet they do not disclose renewal, top-account share, or segment revenue mix. Investors should treat SHINE as a company with real customer traction and multiple validated use cases, while still requiring hard diligence on repeat ordering, concentration, and conversion from clinical accounts into scaled commercial demand."
  },
