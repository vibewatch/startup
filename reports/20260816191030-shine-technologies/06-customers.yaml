    {
      "id": "expansion-loops-and-concentration-risk",
      "title": "Expansion loops and concentration risk",
      "body": "SHINE\u2019s expansion logic is compelling: win Lu-177 and SPECT customers, add distribution partners, then cross-sell a broader diagnostic-plus-therapeutic platform once Chrysalis comes online. The company\u2019s 2025-2026 moves\u2014EMA approval, the Lantheus acquisition, Sumitomo channel development, and continued clinical-supply partnerships\u2014support that story. However, the same public record also shows concentration risk. Many named Lu-177 accounts are still precommercial biopharma or research users, which means future revenue may be concentrated in a small number of progressing programs and a narrow set of channels. On the diagnostic side, SHINE inherits stronger installed-base durability, but that also means it inherits channel concentration and supply-chain execution expectations from the SPECT business. The customer story is therefore better described as diversified proof with potentially concentrated economics. Public evidence supports expansion potential; it does not yet disclose how balanced or resilient the resulting revenue base will be.",
