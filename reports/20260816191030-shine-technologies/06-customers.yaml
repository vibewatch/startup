      "id": "adoption-trajectory-and-geographic-expansion",
      "title": "Adoption trajectory and geographic expansion signals",
      "body": "The public adoption trajectory is clearest for Ilumira and for the SPECT expansion. SHINE says Ilumira launched in June 2024 and by June 2025 had reached customers in 19 countries across four continents with over 95% on-time, in-full delivery. The same post names several customers and research accounts, suggesting the product is not confined to one sponsor or one geography. In 2026, European centralized marketing authorization and the completed Lantheus SPECT acquisition materially widened the addressable buyer base by adding diagnostic manufacturing, Canadian operations, and a cleaner path into EU customers. These are meaningful adoption signals, but they should be read carefully. They indicate widening market access and real shipments, not disclosed segment revenue or retention. The same is true for Sumitomo and UKAEA: each expands the map of who will consider SHINE, but neither alone proves recurring high-margin volumes.",
