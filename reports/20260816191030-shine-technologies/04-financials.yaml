  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "SHINE is no longer a pure pre-revenue fusion narrative: it owns an established SPECT diagnostic business, has real Lu-177 commercial shipments and partner supply agreements, and sells neutron-testing services. But public disclosure remains thin on the metrics investors actually need to underwrite revenue quality and burn. The available evidence points to improving revenue diversity and much stronger capital access after the Lantheus acquisition, 2026 Series E, and DOE conditional support; however, margin structure, cash runway, and realized pricing remain largely private, so the key financial question is whether Chrysalis converts obvious market demand into profitable output rather than merely absorbing more capital."
  },
  "sections": [
    {
      "id": "revenue-model-and-streams",
      "title": "Revenue model and public revenue streams",
      "body": "SHINE\u2019s public revenue model now has four distinct layers. First, the January 2026 Lantheus SPECT acquisition brought an operating diagnostic product portfolio with established hospital and radiopharmacy workflows. Second, SHINE sells Lu-177 precursor supply into therapeutic radiopharmaceutical developers and clinical programs. Third, FLARE monetizes neutron-testing as a services business. Fourth, Chrysalis is intended to add domestic Mo-99 and other isotope revenue later, but that revenue remains pre-commercial today. This mix materially improves the company\u2019s financial profile versus a typical fusion startup because there is already product and service activity in market. At the same time, public disclosure is still far better on the existence of revenue streams than on their scale. SHINE repeatedly cites immediate revenue, customer shipments, and supply agreements, but does not disclose consolidated revenue, segment mix, or gross margin. The most useful outside proxy is the acquired SPECT seller\u2019s filing, which shows real diagnostic demand patterns and suggests the business SHINE bought is meaningful rather than symbolic.",
