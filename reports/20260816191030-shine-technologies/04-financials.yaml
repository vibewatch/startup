    {
      "id": "cost-structure-and-unit-economics",
      "title": "Cost structure, working capital, and unit-economics visibility",
      "body": "The cost drivers are easier to identify than the actual margin numbers. SHINE\u2019s isotope businesses live inside a difficult physical system: radioactive materials decay quickly, making speed, uptime, and shipping discipline financially important. Lantheus\u2019s filing shows weekly standing orders for TechneLite because half-lives compress replenishment cycles, and SHINE\u2019s own Mo-99 page echoes that logistics pressure. On the cost side, capital equipment, reactor-adjacent nuclear systems, cGMP handling, regulatory compliance, and raw-material sourcing all matter. The DOE environmental letter confirms Chrysalis is a very large asset under construction, while Lantheus\u2019s filing highlights upstream supplier concentration in Mo-99. SHINE may have a meaningful future gross-margin advantage in Lu-177 because it produces its own Yb-176 feedstock and built significant dose capacity, but that remains a hypothesis rather than a published result. Public sources do not disclose gross margin, spoilage rate, shipment economics, or contribution margin by business line, so unit economics are still mostly diligence placeholders.",
