    {
      "id": "financial-verdict-and-diligence-blockers",
      "title": "Financial verdict, public gaps, and diligence blockers",
      "body": "The public evidence supports a more favorable financial view than \u201cpre-revenue fusion company,\u201d but not a fully underwritable one. Revenue quality has improved because SHINE now owns a real diagnostic portfolio, operates within repeat radiopharmacy workflows, and has multiple external Lu-177 partners plus a service business in FLARE. The capital base is deep enough to keep building. However, the numbers that decide investment discipline remain missing: segment revenue mix, realized pricing, gross margins, burn, working-capital profile, and the amount of SPECT cash flow that can fund Chrysalis instead of merely coexisting with it. That gap matters because SHINE\u2019s financial future turns on one question: does Chrysalis become a profitable, scaling domestic Mo-99 asset, or does it remain a capital sink that requires ongoing outside financing? Until management discloses or diligence confirms those metrics, the right verdict is improved revenue optionality with unresolved margin and runway risk.",
