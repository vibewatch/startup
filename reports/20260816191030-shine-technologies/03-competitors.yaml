    {
      "id": "landscape-and-substitute-frame",
      "title": "Landscape frame: competitor classes and status-quo alternatives",
      "body": "There is no single \u201cSHINE competitor.\u201d The company is simultaneously contesting reactor-based diagnostic isotope incumbents, therapeutic isotope suppliers, integrated radiopharmaceutical ecosystems, and public-lab neutron-testing substitutes. In diagnostics, the relevant alternatives are today\u2019s foreign Mo-99/Tc-99m supply chains and the hospital workflows already built around them. In therapeutics, SHINE\u2019s Lu-177 business competes against suppliers such as ITM, Isotopia, Nusano, and other networks that buyers can combine rather than replace one-for-one. In neutron testing, FLARE competes less against another startup than against national-lab facilities that offer unique neutron environments but often impose proposal or access friction. This framing matters because the displacement dynamics differ sharply by line: Mo-99 is a route-to-customer and reliability fight, Lu-177 is a quality-and-redundancy fight, and FLARE is a speed-and-convenience fight. Investors should therefore underwrite SHINE against the status quo in each market instead of asking for one universal peer multiple or one universal moat claim.",
