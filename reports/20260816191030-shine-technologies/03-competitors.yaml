  "chapter": {
    "number": 3,
    "title": "Competitors",
    "summary": "SHINE competes against ecosystems, not one single peer set. In diagnostics, the main challenge is displacing entrenched reactor-based Mo-99/Tc-99m supply chains and the long distribution relationships attached to them; in therapeutics, SHINE faces a field of Lu-177 suppliers that compete on purity, redundancy, and logistics rather than transparent price; and in neutron testing, national-lab facilities remain credible substitutes for some workloads even if FLARE is commercially more convenient. SHINE\u2019s best comparative position is its growing U.S. integration across isotope production and distribution, but the hardest displacement risk remains incumbent scale and customer multi-sourcing."
  },
