    title: "Do not mistake missing incident evidence for a clean record"
    body: >-
      The assigned pool contains no authoritative Factorial incident history, regulator
      record, concentration schedule, or financing agreement. Underwriting should remain
      conditional on those primary materials rather than converting public silence into
      proof of control effectiveness.
