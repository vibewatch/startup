  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "security-incidents"
      missingEvidence: >-
        Authoritative incident and outage history, severity definitions, customer
        notifications, root-cause records, recovery times, and current security assurance.
      whyItMatters: >-
        Factorial processes sensitive employee and payroll data, so public silence cannot
        establish reliability or control effectiveness.
      diligencePath: >-
        Obtain the incident register, status-page export, penetration-test executive
        summary, certifications, insurer loss runs, and board security reporting.
      relatedQuestionRefs:
        - "QR009"
      relatedTableRefs:
        - "TR002"
    - type: "private-evidence-only"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: >-
        Revenue concentration, gross and net retention cohorts, churn reasons, contract
        duration, renewal pipeline, and exposure by country, product, and channel.
      whyItMatters: >-
        Customer counts and financing announcements do not establish durable recurring
        revenue or resilience to the loss of a large account, segment, or partner.
      diligencePath: >-
        Review anonymized customer-level ARR, cohort retention, top-20 contracts,
        renewal schedules, churn interviews, and channel-attributed pipeline.
      relatedQuestionRefs:
        - "QR010"
      relatedTableRefs:
        - "TR003"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "regulatory-legal-register"
      missingEvidence: >-
        Complete jurisdiction-by-jurisdiction licenses, labor and payroll obligations,
        regulator contacts, complaints, litigation, IP disputes, and enforcement history.
      whyItMatters: >-
        The assigned public pool supports a partial risk register but cannot establish
        exhaustive legal coverage across Factorial's reported operating footprint.
      diligencePath: >-
        Reconcile counsel's legal register to every operating and customer jurisdiction,
        then inspect regulator, court, trademark, employment, and privacy records.
      relatedTableRefs:
        - "TR001"
