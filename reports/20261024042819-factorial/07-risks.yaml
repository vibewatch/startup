company:
  name: "Factorial"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Factorial's principal public-evidence risks are privacy and payroll-control
    obligations, integration and product-depth dependencies, and execution pressure
    from rapid expansion against well-capitalized competitors. The assigned evidence
    does not establish a company-specific breach, outage, regulatory action, or
    customer-concentration event, so those areas remain explicit diligence gaps
    rather than inferred incidents.
sections:
  - id: "risk-posture"
    title: "Risk posture and prioritization"
    body: >-
      The highest residual exposure is governance rather than a documented incident.
      Factorial handles workflows involving employee records, time, payroll, documents,
      and permissions, while GDPR Article 28 places concrete contracting, subprocessor,
      security, assistance, deletion, and audit duties on processors. Public company
      material recognizes that worker data is sensitive, but the assigned pool does not
      provide Factorial's current DPA, subprocessor inventory, security audit results, or
      incident history. That makes privacy assurance a high-impact, medium-likelihood
      diligence risk. Product-depth and integration risks rank next because independent
      review evidence identifies limits in advanced reporting and integrations, while
      partner material shows payroll data moving bidirectionally between systems.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR005"
      - "CR006"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-control"
    title: "Operational, quality, and security exposure"
    body: >-
      Operational risk concentrates where HR records become payroll inputs and where
      configuration crosses product boundaries. Factorial's payroll page says more than
      17,000 companies use the product daily but separately identifies 1.65 thousand
      active payroll customers; those are different populations and should not be
      conflated. The same page promotes external payroll software and consultants, and
      BrynQ describes a bidirectional Sage 50 connection whose setup it manages. These
      facts imply reconciliation, access-control, and vendor-management checkpoints,
      not evidence of failure. A review also reports limited custom reporting and
      advanced analytics, while Capterra's mobile-access score was 3.9 from only 15
      ratings, a small denominator that warrants targeted reference checks rather than
      a broad reliability conclusion.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
    tableRefs:
      - "TR002"
  - id: "capital-and-dependencies"
    title: "Capital, expansion, and ecosystem dependencies"
    body: >-
      The financing record reduces near-term funding scarcity but raises execution and
      underwriting questions. A company-issued 2024 release described an $80 million
      go-to-market facility designed to finance upfront customer-acquisition cash
      outflows. In March 2026, Tech Funding News reported preliminary terms of up to
      $200 million near a $2 billion valuation with size and valuation undecided; in
      June, Reworked reported a $150 million Series D at $2.5 billion and up to $540
      million of additional Customer Value Fund commitments. Commitments are not cash
      available. Germany expansion, a planned Munich office, hiring, and the YepCode
      acquisition create simultaneous integration and operating demands. HiBob and
      Lucca disclosures also show that rival platforms can fund product and geographic
      expansion at meaningful scale.
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
  - id: "monitoring-and-kill-criteria"
    title: "Monitoring indicators and thesis-break triggers"
    body: >-
      The investment case should be monitored with evidence that converts broad
      assurances into controls. Before closing, obtain the current DPA, subprocessor
      list, transfer mechanism, penetration-test executive summary, security
      certifications, incident and outage log, payroll-error and correction rates,
      and customer concentration and renewal cohorts. Monitor implementation time,
      integration support tickets, reconciliation exceptions, Germany hiring against
      revenue milestones, and the realized cash and economics of Customer Value Fund
      commitments. Thesis-break triggers are a material unresolved privacy or payroll
      control deficiency, repeated severe outages, a top-customer exposure that makes
      growth brittle, financing covenants that impair flexibility, or expansion spend
      rising without independently verified retention and unit-economics progress.
      None of those trigger events is established by the assigned public evidence.
    claimRefs:
      - "CR001"
      - "CR003"
      - "CR008"
      - "CR011"
      - "CR012"
      - "CR014"
      - "CR015"
