          detail: "Company claim without a comparable market denominator."
    approximationNotes: >-
      This is a non-additive evidence ladder, not a proportional or nested
      TAM/SAM/SOM calculation. Values have different scopes and units; no
      conversion, averaging, or implied penetration rate is shown.
    claimRefs: [CM002, CM004, CM005, CM007, CM009, CM010]
callouts:
  - calloutType: insight
    title: Category growth does not establish obtainable share
    body: >-
      Broad HR software and narrower HRIS forecasts support category momentum,
      but underwriting Factorial requires a bottom-up bridge from qualifying SME
      accounts to realized price, conversion, retention, and expansion.
    claimRefs: [CM002, CM004, CM005, CM016]
  - calloutType: risk
    title: Integration remains part of the buying path
    body: >-
      All-in-one positioning reduces some tool sprawl, but partner evidence for
      Factorial-to-Sage 50 data exchange shows that payroll and accounting
      connections can remain necessary; implementation value should not assume a
      fully self-contained stack in every country.
    claimRefs: [CM009, CM013]
