      - ["Multi-site or shift workforce", "Operations and HR", "Site managers and hourly employees", "Operations or HR budget", "Time, attendance, shifts, compliance", "Standardize dispersed workforce processes"]
      - ["Multi-country SME", "Group HR and finance", "Local HR teams and employees", "Group or regional budget", "Employee data, local payroll connections, reporting", "Coordinate country-specific workflows"]
      - ["Finance-adjacent buyer", "Finance or operations leader", "Employees, approvers, payroll team", "Finance budget", "Expenses, payroll handoff, accounting integration", "Reduce re-entry and reconcile employee data"]
    notes: >-
