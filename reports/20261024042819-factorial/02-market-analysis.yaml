company:
  name: Factorial
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Factorial addresses an SME-oriented portion of the HR software market that
    combines core employee administration with time, payroll-adjacent, talent,
    and expense workflows. Independent estimates support a growing category,
    but their different definitions and the absence of regional account,
    pricing, and penetration data prevent a defensible Factorial-specific SAM or
    SOM.
sections:
  - id: market-boundary
    title: Market boundary and status-quo substitutes
    body: >-
      The investable market is narrower than all spending described as human
      resources technology. The relevant boundary is cloud software that
      centralizes employee records and automates recurring workforce workflows
      for SMEs, with time, attendance, payroll data, recruiting, performance,
      documents, self-service, and expenses included when they are bought in the
      same operating suite. Outsourced payroll labor, consulting, general
      accounting, learning-only products, and enterprise software that does not
      replace these workflows sit outside the core boundary. The practical
      substitutes are spreadsheets, email approvals, paper files, payroll
      bureaus, and collections of point tools. Factorial's official positioning
      and independent reviews support the all-in-one SME wedge; a favorable
      comparison source provides useful product-boundary evidence but is not
      treated as an independent benchmark.
    claimRefs: [CM001, CM006, CM009, CM011, CM012]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses, not a synthetic TAM
    body: >-
      Two analyst estimates illustrate why a single headline TAM would be
      misleading. The Business Research Company defines a broad HR software
      market at $58.93 billion in 2026 and $78.44 billion in 2030, while Mordor
      Intelligence defines the narrower HRIS market at $19.86 billion in 2026
      and $37.82 billion in 2031. Those values use different scopes, periods,
      and methodologies and should not be averaged. Mordor reports that SMEs
      are the fastest-growing organization-size segment at a 15.76% CAGR through
      2031. Germany provides a demand-context lens with 3,243,418 SMEs and
      21,315,033 SME employees in the Commission's 2025 estimate, but enterprise
      counts are not software spend. Factorial's claim of more than 17,000
      companies is traction evidence, not market share, because the public pool
      lacks a matching geographic and account denominator.
    claimRefs: [CM002, CM003, CM004, CM005, CM007, CM010, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      HR or people leaders are the natural functional buyers, while finance and
      operations can own or approve the budget where payroll, expenses, labor
      cost, or multi-site scheduling drive the project. Managers and employees
      become daily users through approvals, time entry, leave requests,
      documents, and self-service. Capterra's broad HR review population ranks
      payroll management, HR management, and employee databases among the
      highest-priority capabilities, supporting a consolidation-led buying
      thesis. A separate review describes Factorial as suitable for small and
      midsized businesses seeking the full employee lifecycle in one system,
      and partner evidence shows that some buyers still require payroll and
      accounting integration. Adoption therefore progresses from replacing
      spreadsheets and manual approvals to adding modules, rather than requiring
      every customer to replace every system at initial deployment.
    claimRefs: [CM009, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: drivers-constraints-and-diligence
    title: Growth drivers, constraints, and diligence implications
    body: >-
      Category growth is supported by cloud migration, integrated HR suites,
      self-service, analytics, AI-enabled workflows, remote work, and rising
      compliance requirements. The same forces create friction: Mordor identifies
      privacy and security concerns, legacy switching costs, scarce HR-technology
      administrators, and limited SME budgets as restraints. Macro timing also
      matters. The Commission reports that German SME employment and real value
      added declined in 2025 before forecasting a modest 2026 recovery, and it
      explicitly warns that the forecast predates additional geopolitical
      uncertainty. Valuation work should therefore separate category expansion
      from Factorial's obtainable share. The missing bridge requires country and
      employee-band account counts, realized price, win rates, implementation
      burden, module attach, retention cohorts, and a consistent active-customer
      definition; no retained public source supplies that full denominator.
    claimRefs: [CM008, CM014, CM015, CM016]
