artifact: company-overview
slug: factorial
runDate: 2026-10-24
company:
  name: Factorial
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Factorial is a Barcelona-founded workforce-software company whose public evidence
    shows expanding customer scale, a $150 million Series D at a $2.5 billion valuation,
    and a product reset around Factorial One. The growth case is credible but remains
    qualified by unreconciled scale metrics, private financing terms, and limited public
    governance and audited financial disclosure.
sections:
  - id: identity-and-product
    title: Identity and product model
    body: >-
      Factorial was founded in Barcelona in 2016 by Jordi Romero, Bernat Farrero, and
      Pau Ramon. Its operating identity is consistent across company and third-party
      sources: an all-in-one workforce platform aimed principally at small and
      mid-sized businesses, combining employee records, time and absence management,
      documents, performance, and payroll-adjacent workflows. The company now frames
      the product more broadly as workforce operations across HR, finance, and IT,
      centered on Factorial One and two accountable AI agents. That repositioning
      expands the addressable workflow but does not remove practical boundaries.
      Independent reviews still identify third-party payroll integrations, no native
      employer-of-record service, and limited deep integration or workflow
      configurability as buyer diligence points.
    claimRefs: [CO001, CO002, CO014, CO015, CO016]
    tableRefs: [TO001]
  - id: funding-and-scale
    title: Funding, valuation, and operating scale
    body: >-
      The current financing milestone is a $150 million Series D led by General
      Catalyst at a reported $2.5 billion valuation, with Atomico and Four Rivers also
      named as participants. Separately, General Catalyst committed up to another
      $540 million through its Customer Value Fund, bringing announced capital
      committed through the combined relationship above $700 million. That commitment
      is not equivalent to unrestricted cash on Factorial's balance sheet: the
      published structure links returns to customer value created by funded sales and
      marketing. Operating scale also requires dated treatment. A September 2025
      report cited more than $100 million of ARR, over 14,000 customers in 10
      countries, and more than 1,400 employees; 2026 sources report higher customer
      and headcount figures without audited reconciliation.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: leadership-and-governance
    title: Leadership and governance visibility
    body: >-
      Founder continuity remains evident. Current public listings consistently place
      Jordi Romero in the chief executive role and Pau Ramon in the chief technology
      role, while Bernat Farrero remains a senior founder-operator. His title is not
      consistent across retained sources: Highperformr listed him as chief growth
      officer in April 2025, whereas Tech Funding News described him as chief revenue
      officer in 2026. The public roster also names people and customer chiefs, but it
      does not establish a complete current executive or board population. No retained
      source supplies board committees, voting rights, founder ownership, succession
      planning, or current cap-table percentages. The table is therefore a partial
      leadership map rather than evidence of complete governance coverage.
    claimRefs: [CO001, CO012, CO013]
    tableRefs: [TO002]
  - id: milestones-and-diligence
    title: Milestones and diligence implications
    body: >-
      The milestone record depicts a company moving from a 2016 HR-software founding
      into a scaled European platform: reported ARR passed $100 million in 2025, the
      customer base rose from more than 14,000 in September 2025 to more than 16,000
      in 2026 financing materials, and the official site stated more than 17,000
      companies by the October 2026 access date. These figures are directionally
      coherent but use different dates and issuers, so they should not be merged into
      a single audited growth rate. The same caution applies to headcount, which moved
      from more than 1,400 in a September 2025 report to around 2,600 in 2026
      reporting. Investment diligence should reconcile active paying customers, users,
      employees, contractors, financing availability, and revenue quality before
      relying on the valuation or growth narrative.
    claimRefs: [CO003, CO004, CO005, CO008, CO009, CO010, CO011, CO014]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Demonstrated scale with current financing support
    body: >-
      Independent reporting corroborates the Series D amount and valuation, while
      dated customer and ARR disclosures show a business operating beyond early-stage
      scale.
    claimRefs: [CO006, CO008, CO009]
  - calloutType: risk
    title: Capital commitments and operating metrics need reconciliation
    body: >-
      Customer Value Fund commitments are not cash on hand, and public customer and
      headcount figures span different dates and definitions.
    claimRefs: [CO003, CO005, CO007, CO010, CO011]
