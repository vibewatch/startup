        blocks:
          - type: paragraph
            body: >-
              Founder continuity remains evident. Current public listings consistently place Jordi Romero in the chief
              executive role and Pau Ramon in the chief technology role, while Bernat Farrero remains a senior
              founder-operator. His title is not consistent across retained sources: Highperformr listed him as chief
              growth officer in April 2025, whereas Tech Funding News described him as chief revenue officer in 2026.
              The public roster also names people and customer chiefs, but it does not establish a complete current
