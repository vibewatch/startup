  - id: TV003
    title: Bull, base, bear, and no-deal scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - >-
          Audited growth, gross margin, retention, and module adoption validate the scale narrative; debt is
          non-constraining.
        - >-
          Invest only at a price that leaves a credible growth-adjusted return after dilution; no numeric range is
          supportable publicly.
        - Signal is audited metric confirmation; trigger is material underperformance versus verified diligence figures.
      - - Base
        - Adoption grows, but reporting remains private and competitive breadth limits pricing power.
        - Hold valuation open until verified ARR, revenue quality, and fully diluted ownership permit a return model.
        - Signal is consistent cohorts and efficient expansion; trigger is weak retention or margin conversion.
      - - Bear
        - Debt and preferences amplify downside while product parity slows growth or raises acquisition cost.
        - Require a substantially de-risked entry structure or decline; public evidence cannot quantify the discount.
        - Signal is financing dependence or declining quality metrics; trigger is covenant pressure or a down round.
      - - No-deal
        - Cap-table, debt, cohort, or accounting evidence cannot be reconciled.
        - No valuation is investable when ownership and downside cannot be modeled.
        - Trigger is refusal or inability to provide complete primary documentation.
    notes: >-
      Scenarios are conditional and intentionally omit numeric valuation ranges, probabilities, and target returns
      because the assigned evidence lacks the required audited inputs and current price.
    claimRefs:
