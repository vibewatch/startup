  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing
        blocks:
          - type: paragraph
            body: >-
              Factorial appears to monetize a recurring software relationship through a core HR subscription plus paid
              modules. Two current independent reviews report different entry prices: Dormy Technology Consulting and
              People Managing People cite $8 per user per month before a tailored quote, while European Purpose reports
              approximately EUR 5.75 per employee per month with price varying by module selection and company size.
              Those figures are list-price observations, not realized average revenue per user. The product breadth
              supports expansion revenue through time, talent, finance, IT, payroll-adjacent and expense workflows, but
              no retained source breaks out subscription versus services, payments, cards, implementation, or
              country-specific payroll revenue. The mobile listing confirms that time and expense workflows are
              available in the product, not that they generate a particular level of usage or revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
