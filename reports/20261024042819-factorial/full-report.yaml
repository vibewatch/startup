  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than all spending described as human resources technology. The relevant
              boundary is cloud software that centralizes employee records and automates recurring workforce workflows
              for SMEs, with time, attendance, payroll data, recruiting, performance, documents, self-service, and
              expenses included when they are bought in the same operating suite. Outsourced payroll labor, consulting,
              general accounting, learning-only products, and enterprise software that does not replace these workflows
              sit outside the core boundary. The practical substitutes are spreadsheets, email approvals, paper files,
              payroll bureaus, and collections of point tools. Factorial's official positioning and independent reviews
              support the all-in-one SME wedge; a favorable comparison source provides useful product-boundary evidence
              but is not treated as an independent benchmark.
            claimRefs:
              - CM001
              - CM006
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.2'
        title: Multiple sizing lenses, not a synthetic TAM
        blocks:
          - type: paragraph
            body: >-
              Two analyst estimates illustrate why a single headline TAM would be misleading. The Business Research
              Company defines a broad HR software market at $58.93 billion in 2026 and $78.44 billion in 2030, while
              Mordor Intelligence defines the narrower HRIS market at $19.86 billion in 2026 and $37.82 billion in 2031.
              Those values use different scopes, periods, and methodologies and should not be averaged. Mordor reports
              that SMEs are the fastest-growing organization-size segment at a 15.76% CAGR through 2031. Germany
              provides a demand-context lens with 3,243,418 SMEs and 21,315,033 SME employees in the Commission's 2025
              estimate, but enterprise counts are not software spend. Factorial's claim of more than 17,000 companies is
              traction evidence, not market share, because the public pool lacks a matching geographic and account
              denominator.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM007
              - CM010
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM007
              - CM009
              - CM010
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              HR or people leaders are the natural functional buyers, while finance and operations can own or approve
              the budget where payroll, expenses, labor cost, or multi-site scheduling drive the project. Managers and
              employees become daily users through approvals, time entry, leave requests, documents, and self-service.
              Capterra's broad HR review population ranks payroll management, HR management, and employee databases
              among the highest-priority capabilities, supporting a consolidation-led buying thesis. A separate review
              describes Factorial as suitable for small and midsized businesses seeking the full employee lifecycle in
              one system, and partner evidence shows that some buyers still require payroll and accounting integration.
              Adoption therefore progresses from replacing spreadsheets and manual approvals to adding modules, rather
              than requiring every customer to replace every system at initial deployment.
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Category growth is supported by cloud migration, integrated HR suites, self-service, analytics, AI-enabled
              workflows, remote work, and rising compliance requirements. The same forces create friction: Mordor
              identifies privacy and security concerns, legacy switching costs, scarce HR-technology administrators, and
              limited SME budgets as restraints. Macro timing also matters. The Commission reports that German SME
              employment and real value added declined in 2025 before forecasting a modest 2026 recovery, and it
              explicitly warns that the forecast predates additional geopolitical uncertainty. Valuation work should
              therefore separate category expansion from Factorial's obtainable share. The missing bridge requires
              country and employee-band account counts, realized price, win rates, implementation burden, module attach,
              retention cohorts, and a consistent active-customer definition; no retained public source supplies that
              full denominator.
            claimRefs:
              - CM008
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Category growth does not establish obtainable share
            body: >-
              Broad HR software and narrower HRIS forecasts support category momentum, but underwriting Factorial
              requires a bottom-up bridge from qualifying SME accounts to realized price, conversion, retention, and
              expansion.
            calloutType: insight
            claimRefs:
              - CM002
              - CM004
              - CM005
              - CM016
          - type: callout
            title: Integration remains part of the buying path
            body: >-
              All-in-one positioning reduces some tool sprawl, but partner evidence for Factorial-to-Sage 50 data
              exchange shows that payroll and accounting connections can remain necessary; implementation value should
              not assume a fully self-contained stack in every country.
            calloutType: risk
            claimRefs:
              - CM009
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set and strategic pressure
        blocks:
          - type: paragraph
            body: >-
              Factorial competes across several layers rather than against one clean peer group. Personio is the
              clearest European SME and mid-market analogue: its 2022 funding snapshot covered 6,000 companies and more
              than 500,000 employees, and management kept its target at 10 to 2,000 employees. Rippling attacks from an
              adjacent direction by combining HR, IT, and finance products, while Workday, SAP, Oracle, ADP, and UKG
              anchor the incumbent end of the market. Local payroll providers, specialist tools, and spreadsheets remain
              substitutes when migration risk outweighs consolidation benefits. Factorial therefore wins only when
              buyers value an accessible, localized system of record more than the depth or scale of alternatives.
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP007
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.2'
        title: Capability breadth, distribution, and partner access
        blocks:
          - type: paragraph
            body: >-
              Evidence from buyer-facing pages supports Factorial's strength in core HR administration, time,
              payroll-adjacent workflows, and employee data, but does not establish leadership on every module.
              Capterra's review data scores payroll management, HR management, and employee database capabilities above
              four out of five, while a Factorial-Sage 50 connector shows how partners can preserve incumbent payroll
              tools rather than force immediate replacement. Factorial's 2026 IT launch extends the shared employee
              record into devices, applications, access, and compliance evidence. That expansion increases wallet share
              and workflow embeddedness, but also puts the company into direct competition with broader suites and
              raises the execution burden beyond traditional HR software.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP008
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
              - CP012
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP009
              - CP012
              - CP014
              - CP015
      - number: '3.3'
        title: Pricing, switching cost, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Public pricing is not decision-grade: three independent pages display entry points of $4.50, $5.75, and $8
              per user per month, without a common module, geography, service level, or implementation basis. Buyers can
              also multi-home by keeping payroll in Sage 50 while synchronizing employee data through BrynQ, which
              lowers migration friction but shares account control with a partner. At the enterprise end, Mordor
              Intelligence estimates that a 10,000-employee move from on-premise HRIS to cloud can cost $2 million to $4
              million and take up to two years. Those figures do not describe Factorial's SME deployments directly, but
              they show why incumbent data, connectors, and payroll validation can be stronger moats than headline
              feature breadth.
            claimRefs:
              - CP001
              - CP006
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP009
              - CP010
              - CP011
              - CP012
              - CP015
      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Factorial's defensibility is operational and regional rather than based on an exclusive technology. The
              platform can accumulate employee records, approvals, time data, documents, integrations, and device
              controls, making a broad deployment harder to unwind. Against that, SpotSaaS flags mobile, customization,
              and US-localization limits; People Managing People identifies weaker custom reporting and configurable
              workflows; and Software Finder includes a one-star account alleging inflexibility, hidden costs, and poor
              support. Rippling's willingness to remain unprofitable while funding a suite of more than 20 products
              shows the intensity of adjacent competition. The underwriting implication is a qualified moat:
              localization and workflow depth can retain SMEs, but only current cohort retention, module-activation,
              win/loss, and implementation data can establish durable advantage.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP008
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Localized system-of-record wedge
            body: >-
              Factorial can consolidate recurring SME HR workflows while preserving selected payroll systems through
              integrations.
            calloutType: strength
            claimRefs:
              - CP004
              - CP006
              - CP008
          - type: callout
            title: Breadth is not exclusive
            body: >-
              Personio, Rippling, and scaled incumbents can fund overlapping automation, integrations, and adjacent
              modules.
            calloutType: risk
            claimRefs:
