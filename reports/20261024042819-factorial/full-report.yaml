      - number: '5.2'
        title: Delivery model, integrations, and differentiation
        blocks:
          - type: paragraph
            body: >-
              The strongest technical maturity signal in the assigned pool is company-issued engineering material
              stating that full-stack engineers can take initiatives from conception to production and that Factorial
              deploys 20 to 40 times daily. That indicates an active delivery process, not measured reliability: no
              change-failure rate, rollback rate, incident history, or service-level record is disclosed. Integration
              evidence is more tangible. Official help material enumerates connected SaaS applications and distinguishes
              provisioning, group, role, license, and single-sign-on capabilities; an independent review also lists
              common workplace integrations and an open API. A comparison page argues that Factorial trades a smaller
              catalog for more native functionality, but its promotional posture means this is a hypothesis to test, not
              an independent benchmark.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE009
              - CE010
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
