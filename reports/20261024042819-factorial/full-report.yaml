  - id: FP001
    title: Competitive position by SME accessibility and suite breadth
    type: quadrant
    summary: >-
      Analyst-coded ordinal positions show Factorial and Personio closest to the European SME wedge, while Rippling and
      incumbents bring broader suites with different implementation burdens.
    data:
      xAxis:
        label: SME accessibility
        min: 1
        max: 5
        low: Lower
        high: Higher
        scale: ordinal
      yAxis:
        label: Suite breadth
        min: 1
        max: 5
        low: Narrower
        high: Broader
        scale: ordinal
      points:
        - label: Factorial
          x: 5
          'y': 4
          detail: SME-oriented core HR with evidenced payroll integration and company-claimed IT expansion
        - label: Personio
          x: 5
          'y': 3
          detail: Direct European SME peer with HR automation and 100 integrations reported in 2022
        - label: Rippling
          x: 3
          'y': 5
          detail: More than 20 HR, IT, and finance products with global expansion
        - label: Scaled HCM incumbents
          x: 2
          'y': 5
          detail: Broad suites and compliance resources, but heavier implementation posture
        - label: Local payroll or point tools
          x: 4
          'y': 2
          detail: Jurisdiction or workflow specialization without a fully evidenced unified suite
        - label: Spreadsheet status quo
          x: 3
          'y': 1
          detail: Accessible but fragmented, with unquantified manual and compliance costs
    approximationNotes: >-
      Coordinates are qualitative 1-5 ordinal judgments from the cited evidence, not measured market shares, product
      benchmarks, or value-proportional scores.
