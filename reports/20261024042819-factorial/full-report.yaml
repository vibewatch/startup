  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: >-
      The public product can be mapped from user surfaces through workflow modules and integrations, while the
      underlying data and control plane remains undisclosed.
    data:
      layers:
        - label: User surfaces
          detail: Web and mobile experiences for employees, managers, HR, and hiring teams
          items:
            - name: Employee mobile actions
              detail: Clock-in, leave, shifts, documents, expenses, tasks, calendar, and profile updates
            - name: Manager and HR workspace
              detail: Records, approvals, workforce processes, reporting, and administration
        - label: Workflow modules
          detail: Connected employee-lifecycle and finance-adjacent processes
          items:
            - name: Core HR and documents
              detail: Employee data, onboarding, self-service, documents, and signatures
            - name: Time and workforce operations
              detail: Attendance, leave, shifts, tasks, and approvals
            - name: Talent and recruiting
              detail: Recruiting, performance, goals, and learning-related capabilities
            - name: Expenses and payroll-adjacent work
              detail: Receipt capture, expense approvals, and payroll-management surfaces
        - label: Data and extensibility
          detail: Reporting and connections to workplace systems
          items:
            - name: Analytics and reports
              detail: Workforce and operational reporting described in product listings
            - name: Connected SaaS and API
              detail: Provisioning, role, license, SSO, common integrations, and an open API
        - label: Delivery and controls
          detail: Product operations that require private diligence
          items:
            - name: Continuous delivery
              detail: Company-issued material reports full-stack ownership and 20 to 40 deployments daily
            - name: Security and resilience
              detail: >-
                Architecture, certification scope, reliability metrics, and recovery controls are not disclosed in the
                assigned evidence
        - label: Country execution
          detail: Localized HR and payroll-adjacent workflows whose availability varies by market
          items:
            - name: Local workflow configuration
              detail: Time, leave, employee-data, and payroll-related requirements depend on country rules
        - label: User feedback loop
          detail: Marketplace ratings and reviews provide external signals on usability and product limitations
          items:
            - name: Review evidence
              detail: Feature ratings coexist with reports of bugs, support gaps, and limited customization
    approximationNotes: >-
      The layer order is analytical and not a company-disclosed system diagram; no hosting, tenancy, or data-flow
      implementation is inferred.
    claimRefs:
      - CE002
      - CE003
      - CE007
      - CE009
      - CE010
      - CE016
  - id: FU001
    title: Customer journey from SME evaluation to expansion
    type: journey-map
    summary: >-
      The public evidence supports a workflow journey from SME need discovery through core HR adoption and possible
      module expansion, with retention and production proof remaining unresolved.
    data:
      nodes:
        - id: segment
          label: SME need
          description: Small or growing companies seek to reduce manual HR administration.
          touchpoints:
            - Compliance
            - onboarding
            - time off
            - employee data
        - id: evaluate
          label: Evaluate
          description: HR or operations buyers compare all-in-one suites for EU and UK SMEs.
          touchpoints:
            - Features
            - pricing
            - usability
            - implementation
        - id: deploy
          label: Deploy core workflows
          description: Teams start with employee records, time off, documents, and related administration.
          touchpoints:
            - Employee database
            - time tracking
            - documents
        - id: self-service
          label: Employee self-service
          description: Employees update information, request leave, and access documents.
          touchpoints:
            - Leave requests
            - documents
            - payslips
        - id: expand
          label: Expand modules
          description: Payroll, recruiting, performance, and adjacent workflows provide potential expansion surfaces.
          touchpoints:
            - Payroll
            - ATS
            - performance
            - integrations
        - id: prove
          label: Prove durability
          description: Renewal, active usage, outcomes, and concentration must be verified in private diligence.
          touchpoints:
            - GRR
            - NRR
            - cohorts
            - top-customer share
