      - number: '1.2'
        title: Funding, valuation, and operating scale
        blocks:
          - type: paragraph
            body: >-
              The current financing milestone is a $150 million Series D led by General Catalyst at a reported $2.5
              billion valuation, with Atomico and Four Rivers also named as participants. Separately, General Catalyst
              committed up to another $540 million through its Customer Value Fund, bringing announced capital committed
              through the combined relationship above $700 million. That commitment is not equivalent to unrestricted
              cash on Factorial's balance sheet: the published structure links returns to customer value created by
              funded sales and marketing. Operating scale also requires dated treatment. A September 2025 report cited
              more than $100 million of ARR, over 14,000 customers in 10 countries, and more than 1,400 employees; 2026
              sources report higher customer and headcount figures without audited reconciliation.
