      - number: '4.2'
        title: Traction and legal-entity performance
        blocks:
          - type: paragraph
            body: >-
              The public traction record is directionally positive but mixes incomparable measures. European Purpose
              reports more than 10,000 customer companies in over 65 countries, while Capterra exposes a review base of
              320; neither measure is recognized revenue, retention, or active-seat volume. A 2020 EU-Startups article
              reported eightfold revenue growth in 2019, which is historical context rather than a current growth rate.
              More useful, eInforma's profile for Everyday Software S.L. reports 72.83% sales growth from 2023 to 2024.
              That figure belongs to the Spanish legal entity and should not be presented as audited consolidated group
              revenue or ARR. It nevertheless provides a concrete growth signal that is more decision-useful than review
              counts or undated customer claims.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Unit economics and margin path
        blocks:
          - type: paragraph
            body: >-
              The available evidence does not support a complete SaaS unit-economics bridge. eInforma reports a negative
              2024 operating return of 26.17% and return on equity of negative 47.62%, despite the reported sales
              growth. Dormy also flags slow support responses for non-premium tiers, a reminder that implementation and
              support intensity may affect the cost-to-serve profile, although the source does not quantify that cost.
              Gross margin, contribution margin, customer acquisition cost, sales cycle, payback, churn, net revenue
              retention and cohort expansion are all missing. Accordingly, the evidence supports neither a claim of
              attractive SaaS margins nor a claim about cash burn: accounting loss, operating profitability and cash
              consumption are different measures. The correct diligence posture is to treat margin scalability as
              unproven.
            claimRefs:
              - CI004
              - CI006
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Current capital adequacy cannot be underwritten from the retained public record. eInforma says
              indebtedness increased 186.78% between 2023 and 2024 and identifies 2024 as the latest available filed
              balance. It also lists both a capital increase and a capital reduction dated 21 October 2026, but the
              public page does not disclose transaction values or whether either action changed cash available to the
              operating business. The round-by-round financing history is addressed in Company Overview; the forward
              question is current liquidity, debt terms, burn and next-round triggers. Strong sales growth alongside
              negative returns may be compatible with deliberate investment, but without current cash flow and
              obligation data it is not possible to distinguish funded growth from financing dependency. The financial
              verdict is therefore positive on revenue model plausibility, cautious on margin quality, and blocked on
              runway.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Growth is visible; runway is not
            body: >-
              The Spanish entity's 2024 sales-growth signal coexists with negative operating and equity returns, rising
              indebtedness and no current public cash-flow bridge. Funding raised or capital actions must not be treated
              as cash available without transaction values and obligation terms.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Factorial is delivered as an integrated operating surface for SME people workflows rather than as a
              single-function time or leave tool. Third-party product listings describe onboarding, employee data,
              attendance, leave, documents, performance, recruitment, analytics, compliance, and payroll-related
              functions, while company-issued descriptions frame the product around centralizing administrative work.
              The mobile listings make the workflow more concrete: employees can clock in, request leave, review shifts,
              handle documents, submit expense receipts, manage tasks, and update profile information; managers can act
              on absence requests. This breadth can reduce handoffs among point products, but feature presence does not
              establish equal depth, country availability, adoption, or control quality.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
          - type: table
            tableRef: TE001
