  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports the commercial sequence, but not the conversion rates, realized prices or gross-profit
      output.
    data:
      nodes:
        - id: customer
          label: SMB customer
          detail: Customer organization selects Factorial for HR and adjacent operations.
        - id: seats
          label: Covered employees or users
          detail: Published entry pricing uses a per-employee or per-user monthly unit.
        - id: core
          label: Factorial Core
          detail: Directory, onboarding, offboarding and e-signature form the plan base.
        - id: modules
          label: Selected modules
          detail: Time, talent, finance and IT modules expand the package.
        - id: activity
          label: Workflow activity
          detail: Time, expense, document and payroll-adjacent workflows are available across web and mobile.
        - id: recognized-revenue
          label: Recognized revenue
          detail: Subscription, services and transaction mix is not publicly disclosed.
        - id: gross-profit
          label: Gross profit
          detail: Gross margin and cost-to-serve are unavailable in the retained evidence.
