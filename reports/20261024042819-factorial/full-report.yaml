chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product model
        blocks:
          - type: paragraph
            body: >-
              Factorial was founded in Barcelona in 2016 by Jordi Romero, Bernat Farrero, and Pau Ramon. Its operating
              identity is consistent across company and third-party sources: an all-in-one workforce platform aimed
              principally at small and mid-sized businesses, combining employee records, time and absence management,
              documents, performance, and payroll-adjacent workflows. The company now frames the product more broadly as
              workforce operations across HR, finance, and IT, centered on Factorial One and two accountable AI agents.
              That repositioning expands the addressable workflow but does not remove practical boundaries. Independent
              reviews still identify third-party payroll integrations, no native employer-of-record service, and limited
              deep integration or workflow configurability as buyer diligence points.
            claimRefs:
              - CO001
              - CO002
              - CO014
              - CO015
              - CO016
