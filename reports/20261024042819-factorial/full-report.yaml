  - id: FM001
    title: Evidence ladder from category scale to obtainable market
    type: pyramid
    summary: >-
      Published values narrow from broad category estimates toward company reach, but the evidence stops before a
      defensible Factorial SAM or SOM.
    data:
      items:
        - label: Broad HR software market
          value: $58.93B
          unit: 2026 global revenue
          detail: The Business Research Company definition includes software and services.
        - label: Narrower HRIS market
          value: $19.86B
          unit: 2026 global revenue
          detail: Mordor Intelligence uses a narrower HRIS scope.
        - label: HRIS software component
          value: 67.12%
          unit: 2025 market share
          detail: Mordor reports software's share; this is not a Factorial SAM.
        - label: SME segment growth
          value: 15.76%
          unit: 2026-2031 CAGR
          detail: Mordor's organization-size forecast, not a spend value.
        - label: Germany SME demand universe
