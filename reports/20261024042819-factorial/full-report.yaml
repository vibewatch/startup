  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Ordered evidence chain from financing and adoption signals through disclosure and competitive constraints to a
      track / research-more recommendation.
    data:
      nodes:
        - id: historical-capital
          label: Early capital formation
          detail: NovoBrief reported a €2.8 million financing in Factorial's early history.
        - id: current-financing
          label: Current financing momentum
          detail: Tracxn reports $369 million across eight rounds, including a $150 million Series D in June 2026.
        - id: scale-signal
          label: Adoption signal
          detail: Factorial says more than 17,000 companies use the platform.
        - id: disclosure-gap
          label: Valuation evidence gap
          detail: The 2026 post-money valuation and audited operating metrics are not disclosed in the retained evidence.
        - id: downside
          label: Downside complexity
          detail: Debt financing, product limitations, and broad competitor suites raise underwriting risk.
        - id: decision
          label: Decision
          detail: Track and research more until price, capitalization, debt, retention, and margins are verified.
    approximationNotes: >-
