      - [Factorial, "$5.75/user/month billed yearly on SpotSaaS", "Core HR workflows and browser/mobile access", "Module basis, service level, and realized discount", "Shows low-friction SME positioning"]
      - [Factorial, "$8/user/month on People Managing People", "Core HR and payroll-oriented scope", "Plan vintage, module basis, and implementation", "Divergence across reviews makes precise comparison unsafe"]
      - [Personio, "Not disclosed in assigned evidence", "HR, payroll, recruiting, automation, and integrations", "Current list price, discounting, and services", "Scale is visible; current price competitiveness is not"]
      - [Rippling, "Not disclosed in assigned evidence", "More than 20 HR, IT, and finance products", "Current list price, bundles, discounting, and services", "Broad bundle may expand wallet share"]
      - ["Spreadsheets or point tools", "No comparable consolidated price", "Selected manual or specialist workflows", "Labor, error, integration, and compliance cost", "Status quo can prevail when migration risk is high"]
    notes: "Displayed prices are third-party observations, not realized contract value, ARR, revenue, or total cost of ownership."
    claimRefs: [CP001, CP009, CP010, CP011, CP012, CP015]
figures:
