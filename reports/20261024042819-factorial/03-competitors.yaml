      - ["Workday, SAP, Oracle, ADP, and UKG", "Scaled incumbents", "Mordor estimates the five largest vendors hold roughly 45-50% of HRIS", "Large and complex organizations", "Suite expansion, AI, analytics, payroll, and compliance", "Grouped market share does not show vendor-level overlap with Factorial"]
      - ["Local payroll providers and point tools", "Adjacent specialists", "Southern European payroll markets remain fragmented", "Buyers prioritizing local payroll or one workflow", "Jurisdiction depth and narrow specialization", "No comparable vendor-level pricing or retention data in the pool"]
      - ["Spreadsheets and internal processes", "Status quo substitute", "No reliable scale or funding metric", "Small teams tolerating manual administration", "Low software commitment and familiar workflows", "Labor, error, and compliance costs are not quantified"]
    notes: "Coverage is representative rather than exhaustive; metrics retain their cited dates and grouped estimates are not attributed to individual vendors."
    claimRefs: [CP007, CP009, CP010, CP011, CP012, CP013, CP014]
