      - Factorial
      - Personio
      - Rippling
      - Incumbents or status quo
    rows:
      - ["Core HR system of record", "Supported in review evidence", "Supported in cited company profile", "Supported within workforce platform", "Supported by HCM incumbents; fragmented in status quo"]
      - ["Payroll posture", "Payroll management and Sage 50 integration evidenced", "Payroll included in cited scope", "Payroll included in cited scope", "Incumbents and local providers compete here"]
      - ["Workflow automation", "Core approvals and HR workflows evidenced", "Approvals, e-signatures, and task automation evidenced", "Broader product suite reported; workflow detail not compared", "Unknown on a like-for-like basis"]
      - ["IT and finance adjacency", "Factorial IT is company-claimed; finance detail not compared", "Not established by this pool", "More than 20 HR, IT, and finance products reported", "Large suites vary; no normalized comparison"]
      - ["Integration and partner access", "Open API and Sage integrations reported; BrynQ offers a connector", "100 integrations reported in 2022", "Current connector count unavailable", "Mature connectors may favor incumbents"]
      - ["Customization, mobile, and localization", "Independent reviews flag gaps in customization, mobile depth, and US localization", "Current comparable evidence unavailable", "Current comparable evidence unavailable", "Requires vendor-by-vendor diligence"]
    notes: "Supported means the assigned sources describe the capability; it does not establish equivalent depth, implementation quality, or regulatory coverage."
    claimRefs: [CP002, CP003, CP004, CP006, CP008, CP009, CP012, CP014]
  - id: TP003
