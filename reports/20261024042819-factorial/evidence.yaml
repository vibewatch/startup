evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited revenue, ARR-to-revenue reconciliation, retention cohorts, gross margin, cash conversion, and current
      balance-sheet detail.
    whyItMatters: Reported ARR and valuation cannot establish durable revenue quality or cash economics.
    diligencePath: >-
      Request audited statements, monthly recurring-revenue bridges, cohort retention, gross-margin history, and
      cash-flow detail under NDA.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: structured-financing
    missingEvidence: >-
      Customer Value Fund draw conditions, return cap, covenants, repayment mechanics, deployed amount, and any other
      debt or credit obligations.
    whyItMatters: >-
      Announced capital committed does not show cash available or the downside obligations attached to funded
      acquisition spend.
    diligencePath: >-
      Review executed fund and financing agreements, draw schedules, covenant calculations, and management's
      sources-and-uses plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board roster, committee structure, executive tenure, founder ownership, voting rights, and succession
      plan.
    whyItMatters: >-
      Founder-led international expansion creates key-person and governance concentration risk that public role listings
      cannot resolve.
    diligencePath: >-
      Obtain the current cap table, board and committee rosters, voting agreements, executive organization chart, and
      succession materials.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-metrics
    missingEvidence: >-
      A dated management schedule reconciling customers, active paying accounts, users, employees, contractors,
      countries, and offices.
    whyItMatters: >-
      Public figures use different dates and denominators, so combining them would overstate current scale and growth
      precision.
    diligencePath: >-
      Request metric definitions, as-of dates, geographic scope, and bridges from each public figure to the current
      operating dashboard.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: >-
      Comprehensive jurisdiction-specific evidence on litigation, regulatory actions, sanctions, material outages,
      breaches, and customer disputes.
    whyItMatters: >-
      The assigned pool documents product limitations but cannot prove the absence of legal, regulatory, or operational
      incidents.
    diligencePath: >-
      Run jurisdiction-specific legal and regulator checks, review incident logs, and obtain management representations
      and customer references.
    relatedQuestionRefs:
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      A bottom-up qualifying-account universe by country and employee band, linked to realized price, win rate, module
      attach, and attainable penetration.
    whyItMatters: >-
      Without a consistent denominator and commercial assumptions, broad category forecasts cannot establish Factorial's
      SAM, SOM, or market share.
    diligencePath: >-
      Reconcile management's pipeline, active-account definition, pricing, wins, churn, and expansion cohorts to
      official SME counts by country.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Buyer-level implementation time, integration cost, realized ROI, retention, and module-attach data segmented by
      country and customer size.
    whyItMatters: >-
      Category demand and product breadth do not establish adoption speed, willingness to pay, or durable revenue
      quality.
    diligencePath: Review implementation cohorts, customer references, renewal data, and module-level bookings under NDA.
    relatedQuestionRefs:
      - QM006
      - QM007
