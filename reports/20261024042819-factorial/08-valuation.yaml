schemaVersion: "report-v2"
artifact: valuation
slug: factorial
runDate: 2026-10-24
company:
  name: Factorial
chapter:
  number: 8
  title: Valuation
  summary: >-
    Factorial shows current financing momentum, a broadening product surface, and company-reported
    adoption, but the assigned public evidence does not disclose the June 2026 round's post-money
    valuation or provide audited operating metrics. The resulting recommendation is track and
    research more: entry price, debt terms, retention, margins, and fully diluted ownership must be
    verified before a return case can be underwritten.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation is track / research more, with high underwriting risk and an indeterminate
      valuation stance rather than a price-insensitive endorsement. Tracxn reports $369 million of
      total funding across eight rounds and a $150 million Series D dated June 3, 2026, but its
      funding table leaves that round's post-money valuation blank. It also lists $120 million and
      $80 million conventional-debt rounds in 2025 and 2024, respectively. Those records establish
      capital availability, not cash on hand, revenue quality, or a safe entry price. Factorial's
      claim that more than 17,000 companies use the product is encouraging, but it is not a
      substitute for audited ARR, retention, margin, debt, preference, and capitalization data.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that Factorial can turn a broad HR, finance, and IT workflow surface into a
      durable system of record for smaller businesses. The official site describes that scope and
      reports more than 17,000 company users; a payroll-integration partner also documents a
      bidirectional Factorial-to-Sage 50 workflow. The anti-thesis is that product breadth is not
      unique: Rippling and HiBob market similarly integrated workforce platforms, while an
      independent review flags limits in custom reporting, advanced analytics, integrations, and
      configurable workflows. Capterra's payroll score provides a positive product signal, but its
      54-rating feature denominator is far narrower than Factorial's company-count claim and cannot
      validate retention or willingness to pay.
    claimRefs: [CV006, CV007, CV009, CV010, CV011, CV012, CV013, CV014]
    tableRefs: [TV002]
  - id: conditional-scenarios
    title: Conditional bull, base, and bear cases
    body: >-
      Public evidence does not support numeric valuation ranges or target returns because the latest
      post-money valuation, current audited ARR, growth, gross margin, net retention, dilution, and
      debt economics are unavailable. StartupRadar lists $80 million ARR, 100% year-over-year
      revenue growth, and 75% gross margin, but supplies no visible methodology; these figures are
      therefore low-confidence diligence leads, not valuation inputs. The scenario framework is
      deliberately conditional. A bull case requires audited confirmation of efficient growth and
      durable retention; the base case requires price discipline while evidence remains private;
      the bear case assumes financing complexity and competitive parity overwhelm the scale signal.
    claimRefs: [CV004, CV005, CV006, CV008, CV009, CV013, CV014, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness cannot be established from the assigned public evidence. A financing history,
      acquisitions, and a widening product scope can support strategic optionality, but none proves
      an IPO timetable, buyer interest, or realizable secondary liquidity. Before investment, the
      data room should reconcile audited ARR to accounting revenue, disclose cohort retention and
      gross-margin trends, identify the fully diluted share count and preference stack, and provide
      debt covenants, maturity, security, and repayment schedules. The thesis should break if
      diligence cannot reconcile financing records to the cap table, if verified retention or
      margins fail to support the growth narrative, or if the requested price assumes public-quality
      disclosure without providing it.
    claimRefs: [CV002, CV004, CV005, CV008, CV009, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision field
      - Current position
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research more
        - Current financing is visible, but valuation and audited operating inputs are not.
        - Do not underwrite a purchase until the data-room gaps close.
      - - Confidence
        - Medium on financing facts; low on value
        - Third-party funding records identify round amounts, while the latest post-money value is blank.
        - Separate confidence in capital raised from confidence in valuation.
      - - Risk rating
        - High
        - Two disclosed debt rounds and missing debt, preference, retention, and margin terms create downside uncertainty.
        - Require downside protection and complete capitalization review.
      - - Valuation stance
        - Indeterminate / price-sensitive
        - The public record does not support a current enterprise value or defensible return range.
        - Evaluate only against verified ARR, quality metrics, and fully diluted entry terms.
    notes: >-
      Decision labels are analytical judgments; financing amounts come from Tracxn, while missing
      valuation and operating inputs are treated as gaps rather than estimated.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence signal
      - What would change the view
    rows:
      - - Thesis
        - Factorial has a meaningful distribution signal in its SME-focused platform.
        - The company reports more than 17,000 customer companies.
        - Audited paid-customer, retention, and cohort data would strengthen the signal.
      - - Thesis
        - HR, finance, and IT workflow breadth can increase product surface and switching costs.
        - Factorial markets a connected suite, and Brynq documents a bidirectional Sage 50 integration.
        - Usage depth, attach rates, and module-level retention must confirm cross-sell.
      - - Anti-thesis
        - Competitive breadth limits evidence that Factorial's platform scope is unique.
        - Rippling markets HR, IT, and finance with 600+ apps; HiBob spans core HR, talent, payroll, planning, and finance.
        - Superior win rates, retention, or unit economics would rebut parity concerns.
      - - Anti-thesis
        - Product limitations may constrain larger or more complex customers.
        - An independent review flags weaker custom reporting, advanced analytics, integrations, and configurable workflows.
        - Product telemetry and enterprise-reference calls should show those limits are not material.
    notes: >-
      Company, partner, competitor, and independent-review evidence is kept distinct; product breadth
      is not treated as an independent valuation benchmark.
    claimRefs: [CV006, CV007, CV009, CV011, CV012, CV013, CV014]
  - id: TV003
    title: Bull, base, bear, and no-deal scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Audited growth, gross margin, retention, and module adoption validate the scale narrative; debt is non-constraining.
        - Invest only at a price that leaves a credible growth-adjusted return after dilution; no numeric range is supportable publicly.
        - Signal is audited metric confirmation; trigger is material underperformance versus verified diligence figures.
      - - Base
        - Adoption grows, but reporting remains private and competitive breadth limits pricing power.
        - Hold valuation open until verified ARR, revenue quality, and fully diluted ownership permit a return model.
        - Signal is consistent cohorts and efficient expansion; trigger is weak retention or margin conversion.
      - - Bear
        - Debt and preferences amplify downside while product parity slows growth or raises acquisition cost.
        - Require a substantially de-risked entry structure or decline; public evidence cannot quantify the discount.
        - Signal is financing dependence or declining quality metrics; trigger is covenant pressure or a down round.
      - - No-deal
        - Cap-table, debt, cohort, or accounting evidence cannot be reconciled.
        - No valuation is investable when ownership and downside cannot be modeled.
        - Trigger is refusal or inability to provide complete primary documentation.
    notes: >-
      Scenarios are conditional and intentionally omit numeric valuation ranges, probabilities, and
      target returns because the assigned evidence lacks the required audited inputs and current price.
    claimRefs: [CV004, CV005, CV006, CV008, CV009, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Ordered evidence chain from financing and adoption signals through disclosure and competitive
      constraints to a track / research-more recommendation.
    data:
      nodes:
        - id: historical-capital
          label: Early capital formation
          detail: NovoBrief reported a €2.8 million financing in Factorial's early history.
        - id: current-financing
          label: Current financing momentum
          detail: Tracxn reports $369 million across eight rounds, including a $150 million Series D in June 2026.
        - id: scale-signal
          label: Adoption signal
          detail: Factorial says more than 17,000 companies use the platform.
        - id: disclosure-gap
          label: Valuation evidence gap
          detail: The 2026 post-money valuation and audited operating metrics are not disclosed in the retained evidence.
        - id: downside
          label: Downside complexity
          detail: Debt financing, product limitations, and broad competitor suites raise underwriting risk.
        - id: decision
          label: Decision
          detail: Track and research more until price, capitalization, debt, retention, and margins are verified.
    approximationNotes: >-
      The ordered flow expresses decision logic only; it does not quantify probabilities, conversion
      rates, valuation, or expected return.
    claimRefs: [CV001, CV002, CV004, CV006, CV009, CV013, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price discipline is the gating issue
    body: >-
      Financing scale and customer adoption justify continued diligence, but the retained public
      evidence does not support a current entry value or target return.
    claimRefs: [CV002, CV003, CV005, CV006, CV015, CV016]
  - calloutType: risk
    title: Capital raised is not cash available
    body: >-
      Tracxn's cumulative funding figure includes equity and disclosed debt rounds; it should not be
      interpreted as unrestricted liquidity or runway without primary financial statements.
    claimRefs: [CV002, CV004, CV016]
