        Debt lender, drawn balance, interest rate, maturity, amortization, covenants, collateral,
        warrants, and change-of-control provisions for the disclosed 2024 and 2025 debt rounds.
      whyItMatters: >-
        Funding raised cannot be treated as available cash, and debt seniority may materially alter
        equity downside and exit proceeds.
      diligencePath: >-
        Obtain executed credit agreements, covenant certificates, payoff letters, warrant schedules,
        and the latest cash and liquidity reconciliation.
      relatedQuestionRefs: [QV001, QV009, QV010]
