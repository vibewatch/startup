  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation
      missingEvidence: >-
        The June 2026 Series D post-money valuation, fully diluted share count, preference stack,
        option pool, secondary component, and ownership available at the proposed entry price.
      whyItMatters: >-
        Without current price and dilution terms, neither ownership nor downside-adjusted return can
        be modeled.
      diligencePath: >-
        Obtain the signed financing documents, current cap table, option schedule, and proposed term
        sheet; reconcile every security and conversion right.
      relatedQuestionRefs: [QV002, QV010]
    - type: private-evidence-only
      severity: material
      topic: operating-metrics
      missingEvidence: >-
        Audited accounting revenue, ARR definition and bridge, gross margin, net retention, logo
        retention, cohort expansion, customer concentration, CAC payback, and cash-flow history.
      whyItMatters: >-
        These inputs determine whether reported adoption and low-confidence third-party operating
        metrics can sustain a premium software valuation.
      diligencePath: >-
        Review audited statements, monthly recurring-revenue schedules, cohort files, customer-level
        billing exports, churn logs, and board-approved operating plans.
      relatedQuestionRefs: [QV006, QV010]
    - type: private-evidence-only
      severity: material
      topic: debt
