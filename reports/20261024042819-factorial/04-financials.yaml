callouts:
  - calloutType: "risk"
    title: "Growth is visible; runway is not"
    body: >-
      The Spanish entity's 2024 sales-growth signal coexists with negative operating and equity
      returns, rising indebtedness and no current public cash-flow bridge. Funding raised or capital
      actions must not be treated as cash available without transaction values and obligation terms.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
