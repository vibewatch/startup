      - "Underwriting implication"
    rows:
      - ["European Purpose review", "Approximately EUR 5.75", "Employee per month", "Modular; varies with selected modules and company size", "Realized discount and geography not disclosed", "Useful list-price anchor only"]
      - ["Dormy and People Managing People reviews", "From USD 8", "User per month", "Core plus tailored add-on quote", "Term, minimum seat count and discount not disclosed", "Different currency and packaging prevent direct comparison"]
      - ["Customer contracts and invoices", null, null, "Unavailable", "Realized price, renewal uplift and services allocation unavailable", "Primary diligence blocker for revenue quality"]
    notes: "Third-party list-price observations use different currencies, units and packaging descriptions; they are not normalized into a single price and do not represent realized revenue."
    claimRefs: [CI001, CI002, CI003]
  - id: "TI003"
    title: "Unit economics and capital-adequacy scoreboard"
    columns:
      - "Metric"
      - "Value or status"
      - "Period"
      - "Confidence"
      - "Why it matters"
      - "Diligence ask"
    rows:
      - ["Spanish legal-entity sales growth", "72.83%", "2023-2024", "Medium", "Concrete growth signal, but not consolidated ARR", "Reconcile to group revenue and ARR"]
      - ["Operating return", "-26.17%", "2024", "Medium", "Indicates the legal entity remained operationally loss-making", "EBITDA bridge and cost-center allocation"]
      - ["Return on equity", "-47.62%", "2024", "Medium", "Shows negative equity returns in the latest visible accounts", "Equity roll-forward and consolidated net income"]
      - ["Indebtedness change", "+186.78%", "2023-2024", "Medium", "Raises financing-dependency and obligation questions", "Debt schedule, rates, covenants and maturity"]
      - ["Gross margin and contribution margin", null, "Current", "Low", "Required to test software margin scalability and service burden", "Audited gross profit and module-level cost of revenue"]
      - ["CAC, sales cycle and payback", null, "Current", "Low", "Required to assess GTM efficiency", "Cohort CAC, fully loaded sales cost and payback"]
      - ["Cash, burn and runway", null, "Current", "Low", "Required to assess next-round dependency", "Monthly cash flow, unrestricted cash and committed obligations"]
    notes: "Reported ratios come from eInforma's Everyday Software S.L. profile and are not treated as consolidated Factorial group metrics; null means the retained public evidence does not disclose the metric."
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
