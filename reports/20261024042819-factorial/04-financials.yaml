company:
  name: "Factorial"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Public evidence supports a modular, per-employee subscription model and strong historical
    sales growth at the Spanish legal entity, but it does not disclose realized pricing, revenue
    mix, gross margin, retention, cash burn, or runway. The latest visible 2024 accounts still show
    negative operating and equity returns, making current capital adequacy the central underwriting
    blocker rather than topline traction.
sections:
  - id: "revenue-model-and-pricing"
    title: "Revenue model and pricing"
    body: >-
      Factorial appears to monetize a recurring software relationship through a core HR subscription
      plus paid modules. Two current independent reviews report different entry prices: Dormy
      Technology Consulting and People Managing People cite $8 per user per month before a tailored
      quote, while European Purpose reports approximately EUR 5.75 per employee per month with price
      varying by module selection and company size. Those figures are list-price observations, not
      realized average revenue per user. The product breadth supports expansion revenue through time,
      talent, finance, IT, payroll-adjacent and expense workflows, but no retained source breaks out
      subscription versus services, payments, cards, implementation, or country-specific payroll
      revenue. The mobile listing confirms that time and expense workflows are available in the
      product, not that they generate a particular level of usage or revenue.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: "traction-and-entity-performance"
    title: "Traction and legal-entity performance"
    body: >-
      The public traction record is directionally positive but mixes incomparable measures.
      European Purpose reports more than 10,000 customer companies in over 65 countries, while
      Capterra exposes a review base of 320; neither measure is recognized revenue, retention, or
      active-seat volume. A 2020 EU-Startups article reported eightfold revenue growth in 2019, which
      is historical context rather than a current growth rate. More useful, eInforma's profile for
      Everyday Software S.L. reports 72.83% sales growth from 2023 to 2024. That figure belongs to
      the Spanish legal entity and should not be presented as audited consolidated group revenue or
      ARR. It nevertheless provides a concrete growth signal that is more decision-useful than
      review counts or undated customer claims.
    claimRefs: [CI007, CI008, CI009, CI010]
  - id: "unit-economics-and-margin-path"
    title: "Unit economics and margin path"
    body: >-
      The available evidence does not support a complete SaaS unit-economics bridge. eInforma reports
      a negative 2024 operating return of 26.17% and return on equity of negative 47.62%, despite the
      reported sales growth. Dormy also flags slow support responses for non-premium tiers, a reminder
      that implementation and support intensity may affect the cost-to-serve profile, although the
      source does not quantify that cost. Gross margin, contribution margin, customer acquisition
      cost, sales cycle, payback, churn, net revenue retention and cohort expansion are all missing.
      Accordingly, the evidence supports neither a claim of attractive SaaS margins nor a claim about
      cash burn: accounting loss, operating profitability and cash consumption are different measures.
      The correct diligence posture is to treat margin scalability as unproven.
    claimRefs: [CI004, CI006, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: "capital-adequacy-and-verdict"
    title: "Capital adequacy and financial verdict"
    body: >-
      Current capital adequacy cannot be underwritten from the retained public record. eInforma says
      indebtedness increased 186.78% between 2023 and 2024 and identifies 2024 as the latest available
      filed balance. It also lists both a capital increase and a capital reduction dated 21 October
      2026, but the public page does not disclose transaction values or whether either action changed
      cash available to the operating business. The round-by-round financing history is addressed in
      Company Overview; the forward question is current liquidity, debt terms, burn and next-round
      triggers. Strong sales growth alongside negative returns may be compatible with deliberate
      investment, but without current cash flow and obligation data it is not possible to distinguish
      funded growth from financing dependency. The financial verdict is therefore positive on revenue
      model plausibility, cautious on margin quality, and blocked on runway.
    claimRefs: [CI010, CI011, CI012, CI013, CI014, CI015]
