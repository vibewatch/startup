company:
  name: Factorial
chapter:
  number: 5
  title: Product & Technology
  summary: Factorial has a broad web-and-mobile product surface spanning core HR records, time, absence, documents, performance, recruiting, expenses, analytics, and payroll-adjacent workflows. The assigned evidence supports active delivery and meaningful integration breadth, but it does not disclose enough current architecture, security-control, or reliability evidence to underwrite the platform as technically differentiated.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: "Factorial is delivered as an integrated operating surface for SME people workflows rather than as a single-function time or leave tool. Third-party product listings describe onboarding, employee data, attendance, leave, documents, performance, recruitment, analytics, compliance, and payroll-related functions, while company-issued descriptions frame the product around centralizing administrative work. The mobile listings make the workflow more concrete: employees can clock in, request leave, review shifts, handle documents, submit expense receipts, manage tasks, and update profile information; managers can act on absence requests. This breadth can reduce handoffs among point products, but feature presence does not establish equal depth, country availability, adoption, or control quality."
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006]
    tableRefs: [TE001, TE002]
  - id: delivery-and-extensibility
    title: Delivery model, integrations, and differentiation
    body: "The strongest technical maturity signal in the assigned pool is company-issued engineering material stating that full-stack engineers can take initiatives from conception to production and that Factorial deploys 20 to 40 times daily. That indicates an active delivery process, not measured reliability: no change-failure rate, rollback rate, incident history, or service-level record is disclosed. Integration evidence is more tangible. Official help material enumerates connected SaaS applications and distinguishes provisioning, group, role, license, and single-sign-on capabilities; an independent review also lists common workplace integrations and an open API. A comparison page argues that Factorial trades a smaller catalog for more native functionality, but its promotional posture means this is a hypothesis to test, not an independent benchmark."
    claimRefs: [CE007, CE008, CE009, CE010, CE011]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-user-signal
    title: Maturity and user evidence
    body: "Marketplace evidence suggests that Factorial's core modules are established enough to attract substantial user feedback, but it also shows uneven depth. Capterra reports separate feature ratings for payroll management, HR management, and employee database capabilities, each with its own denominator; these scores should not be treated as usage rates or service-level measures. Software Advice shows a 4.3 overall score across 320 reviews, yet its review summary and recent individual comments identify bugs, post-onboarding support problems, integration limits, and insufficiently adaptable reporting or approvals. The Apple listing showed version 26.10.3 and a release note for improvements and bug fixes three days before retrieval, which supports current maintenance but not roadmap execution or production quality."
    claimRefs: [CE004, CE005, CE006, CE013, CE014, CE015]
  - id: trust-and-diligence
    title: Trust, safety, and technical diligence
    body: "Factorial's product necessarily handles sensitive employee identity, attendance, document, expense, and potentially payroll-related data. The assigned sources show product-level mechanisms such as document signing, administrative roles, provisioning, single sign-on dependencies for some connected applications, and app-store privacy disclosures. They do not provide a current system architecture, hosting and tenancy model, data-region design, encryption boundaries, audit scope, independent certification, penetration-test summary, uptime history, incident postmortems, recovery objectives, or API reliability metrics. Accordingly, the principal product risk is not evidence that these controls are absent; it is that public evidence is insufficient to assess them. Security, resilience, country-specific compliance, and integration failure handling remain material diligence workstreams."
    claimRefs: [CE003, CE009, CE014, CE016]
callouts:
  - calloutType: strength
    title: Broad workflow consolidation
    body: Factorial has credible public evidence of a single product spanning employee records, time and absence, documents, performance, recruiting, expenses, mobile actions, analytics, and integrations.
    claimRefs: [CE001, CE003, CE009]
  - calloutType: risk
    title: Delivery speed is not reliability proof
    body: A reported 20 to 40 daily deployments is a useful engineering-cadence signal, but the assigned sources provide no change-failure, uptime, incident, or recovery metrics.
    claimRefs: [CE007, CE016]
