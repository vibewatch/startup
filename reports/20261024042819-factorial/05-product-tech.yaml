      - ["Time, attendance, leave, and shifts", "Employees and managers", "Web and mobile workflows are publicly described", "Combines employee action and manager approval", "Verify labor-rule coverage and payroll handoff by country"]
      - ["Documents and signatures", "HR and employees", "Document upload, review, and signing are described in mobile listings", "Keeps document execution inside the employee workflow", "Verify audit trail, retention, and signature enforceability"]
      - ["Performance, goals, and recruiting", "HR and hiring managers", "Listed across product and company-issued material", "Extends the platform beyond system-of-record functions", "Verify module adoption, ATS depth, and outcome evidence"]
      - ["Expenses and payroll-adjacent workflows", "Employees, finance, HR", "Receipt capture and payroll-management capabilities are listed", "Connects employee operations with finance-adjacent work", "Verify reconciliation, payment controls, and native versus partner coverage"]
      - ["Analytics and reporting", "HR and managers", "Workforce reporting and analytics are listed capabilities", "Uses centralized records for operational visibility", "Verify metric lineage, freshness, customization, and exportability"]
    notes: Public descriptions and marketplace listings establish stated capability or workflow presence, not equal module depth, geographic availability, production adoption, or control effectiveness.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE012]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Prior fragmented workflow, Factorial surface, Supported benefit, Limitation]
    rows:
      - ["Maintain employee records", "Files, spreadsheets, or a basic HR database", "Central employee data and self-service", "Fewer record-maintenance handoffs", "No quantified error or time reduction in the assigned evidence"]
      - ["Manage attendance and leave", "Timesheets, email, and disconnected calendars", "Clock-in, leave request, manager approval, and shift views", "One employee-manager workflow across web and mobile", "Country-rule accuracy and payroll reconciliation are unverified"]
      - ["Execute employee documents", "Paper or emailed attachments", "Upload, review, and sign through the app", "Shorter operational path from issue to signature", "Audit, retention, and legal-control evidence is unavailable"]
      - ["Process employee expenses", "Receipt collection and separate approval tools", "Receipt photo submission and approval tracking", "Brings spend requests into the employee workflow", "Payment, fraud, and accounting-control effectiveness is unverified"]
      - ["Run recruiting and performance processes", "Separate ATS, review, and goal tools", "Recruiting, appraisals, goals, and related workflows", "Broader lifecycle coverage from hiring through development", "Depth and customer adoption by module are not public"]
    notes: Supported benefits are workflow implications from described functions; the sources provide no controlled before-and-after productivity measurements.
    claimRefs: [CE001, CE002, CE003, CE012]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Evidence-bounded layer, Role, Public dependency or signal, Risk or diligence question]
    rows:
      - ["Web and mobile experience", "Delivers employee, manager, and HR actions", "App-store listings and product reviews", "Verify feature parity, accessibility, offline behavior, and release support"]
      - ["People and workflow core", "Coordinates records, approvals, documents, time, expenses, and lifecycle modules", "Shared records and configurable workflows", "Verify authorization boundaries, auditability, and country-specific rules"]
      - ["Integration and identity layer", "Connects collaboration, identity, productivity, and specialist SaaS tools", "Provisioning, roles, licenses, SSO, open API, and third-party APIs", "Verify API limits, credential isolation, monitoring, retries, and versioning"]
      - ["Reporting and analytics", "Produces workforce and operational views", "Centralized product data and listed reporting capabilities", "Verify data lineage, refresh intervals, definitions, and row-level access"]
      - ["Delivery and operations", "Moves product changes into production", "Company-reported full-stack ownership and 20 to 40 daily deployments", "Verify test automation, change-failure rate, rollback, uptime, and recovery objectives"]
    notes: This is an evidence-bounded operating model, not a disclosed system architecture; implementation details and operational-control metrics remain private-evidence requests.
    claimRefs: [CE003, CE007, CE008, CE009, CE010, CE016]
figures:
  - id: FE001
    title: Evidence-bounded product architecture map
    type: stack
    summary: The public product can be mapped from user surfaces through workflow modules and integrations, while the underlying data and control plane remains undisclosed.
    data:
      layers:
        - label: User surfaces
          detail: Web and mobile experiences for employees, managers, HR, and hiring teams
          items:
            - name: Employee mobile actions
              detail: Clock-in, leave, shifts, documents, expenses, tasks, calendar, and profile updates
            - name: Manager and HR workspace
              detail: Records, approvals, workforce processes, reporting, and administration
        - label: Workflow modules
          detail: Connected employee-lifecycle and finance-adjacent processes
          items:
            - name: Core HR and documents
              detail: Employee data, onboarding, self-service, documents, and signatures
            - name: Time and workforce operations
              detail: Attendance, leave, shifts, tasks, and approvals
            - name: Talent and recruiting
              detail: Recruiting, performance, goals, and learning-related capabilities
            - name: Expenses and payroll-adjacent work
              detail: Receipt capture, expense approvals, and payroll-management surfaces
        - label: Data and extensibility
          detail: Reporting and connections to workplace systems
          items:
            - name: Analytics and reports
              detail: Workforce and operational reporting described in product listings
            - name: Connected SaaS and API
              detail: Provisioning, role, license, SSO, common integrations, and an open API
        - label: Delivery and controls
          detail: Product operations that require private diligence
          items:
            - name: Continuous delivery
              detail: Company-issued material reports full-stack ownership and 20 to 40 deployments daily
            - name: Security and resilience
              detail: Architecture, certification scope, reliability metrics, and recovery controls are not disclosed in the assigned evidence
        - label: Country execution
          detail: Localized HR and payroll-adjacent workflows whose availability varies by market
          items:
            - name: Local workflow configuration
              detail: Time, leave, employee-data, and payroll-related requirements depend on country rules
        - label: User feedback loop
          detail: Marketplace ratings and reviews provide external signals on usability and product limitations
          items:
            - name: Review evidence
              detail: Feature ratings coexist with reports of bugs, support gaps, and limited customization
    approximationNotes: The layer order is analytical and not a company-disclosed system diagram; no hosting, tenancy, or data-flow implementation is inferred.
    claimRefs: [CE002, CE003, CE007, CE009, CE010, CE016]
