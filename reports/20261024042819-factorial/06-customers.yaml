    notes: Sources describe target segments and workflows; scale/strategic-value labels are analytical implications, not reported revenue bands. Null-equivalent gaps identify missing denominators.
    claimRefs: [CU001, CU002, CU003, CU004]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Source and confidence, Implication, Missing denominator]
    rows:
      - ['Reported customer base', 'More than 17,000 companies', 'Current page accessed 2026-10-24', 'Factorial official surface; medium confidence because company-claimed', 'Broad reach signal', 'Paying/active/production definition']
      - ['Historical customer base', '70 to over 10,000', 'From 2019 to article publication', 'Innovation Open Lab article; medium confidence', 'Indicates substantial historical growth', 'Exact publication date and current bridge']
      - ['Review score', '4.4/5', 'Review page accessed 2026-10-24', 'People Managing People; medium confidence', 'Positive usability signal', 'Review count and sampling method']
      - ['Feature ratings', 'Payroll 4.2 (54); HR 4.3 (39); employee database 4.4 (52)', 'Capterra page accessed 2026-10-24', 'Capterra; medium confidence', 'Core workflows align with buyer priorities', 'Whether ratings represent Factorial-only verified customers']
    notes: Values retain the source's wording and periods. The rows are not a comparable funnel and do not establish active usage, retention, or revenue conversion.
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: Public customer-reference and testimonial pages retrieved for Factorial in the assigned 2026-10-24 source pool; underlying customer universe is not exposed.
    columns: [Customer or reference, Segment, Deployment or use case, Production vs pilot, Reported outcome, Limitation]
    rows:
      - ['FRS Co-Op', 'Not stated', 'Performance-review workflow', 'Not stated', 'The AI tool summarizes performance reviews, saving managers time on every single one.', 'Single testimonial; no baseline or measured time saving']
      - ['Unspecified customer set', 'Small and medium businesses', 'HR lifecycle automation across recruitment, onboarding, time, payroll, and performance', 'Not stated', 'Reference directory lists 13 reviews and 14 case studies', 'Individual identities and outcomes not exposed in fetched text']
      - ['Unspecified European SMEs', 'European SME segment', 'Time tracking, payroll, and talent management', 'Not stated', 'Startup directory identifies European SMEs as main clients', 'No named deployment, revenue, or activity data']
    notes: This is a partial public-reference sample. Customer logos, directory counts, and testimonials do not prove active production use, renewal, or quantified ROI.
    claimRefs: [CU009, CU014, CU015]
figures:
