  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: "Cohort-level logo and revenue retention, churn, renewal, contract duration, and expansion by module and customer segment."
      whyItMatters: "Scale claims and positive reviews do not establish durable customer economics or whether Factorial expands after initial HR adoption."
      diligencePath: "Request monthly cohort files and reconcile them to billing, CRM, product usage, and renewal records for the last 24 months."
      relatedQuestionRefs: [QU006]
      relatedTableRefs: [TU002]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: "Named customers with verified production status, deployment dates, employee counts, use cases, and measured outcomes."
      whyItMatters: "Reference directories and logos can overstate active adoption when pilots and testimonials are not separated."
      diligencePath: "Obtain a reference ledger and independently call a stratified sample of current customers across size, geography, and tenure."
      relatedQuestionRefs: [QU004, QU005]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: "Top-10 customer revenue and ARR share, channel share, geographic mix, and largest renewal dates."
      whyItMatters: "Concentration can create downside even when aggregate customer counts are growing."
      diligencePath: "Request an anonymized customer concentration schedule with direct versus partner-sourced accounts and renewal calendar."
      relatedQuestionRefs: [QU006, QU007]
    - type: missing-source
      severity: minor
      topic: outcome-measurement
      missingEvidence: "Baseline and measured time savings, implementation time, adoption rates, and support burden for named deployments."
      whyItMatters: "The available testimonial is directional but cannot establish repeatable ROI."
      diligencePath: "Request pre/post workflow metrics and implementation retrospectives for at least five customers."
      relatedQuestionRefs: [QU004, QU007]
