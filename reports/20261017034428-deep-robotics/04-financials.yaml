  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: runway-and-cash
      missingEvidence: Current cash balance, monthly burn, debt or project-finance obligations, and management's runway assumptions versus IPO timing.
      whyItMatters: Without cash and burn evidence, investors cannot determine whether current profitability translates into sufficient self-funding or whether another financing event is required before the IPO process resolves.
      diligencePath: Request monthly cash bridge, debt schedule, covenant package, and 12- to 18-month runway model from management.
      relatedQuestionRefs: [QI008]
    - type: private-evidence-only
      severity: material
      topic: cap-table-and-preferences
      missingEvidence: Round-by-round cap table, liquidation preferences, VAM or other special-rights terms, and dilution waterfall for existing shareholders.
      whyItMatters: Financing structure can change downside protection, IPO break-even value, and the real economic ownership of a new investor even when operating metrics improve.
      diligencePath: Obtain the shareholder register, financing documents, and preference summary cited indirectly by private-market intermediaries.
      relatedQuestionRefs: [QI008]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration-and-after-sales
      missingEvidence: Named top-customer concentration, repeat-order cohorts, realized discounting, warranty reserve, service attach, and installation/support cost by product line.
      whyItMatters: Hardware gross margin is much less durable if revenue is concentrated, if discounts are heavy, or if service obligations absorb the headline product margin.
      diligencePath: Request customer cohort analysis, gross-to-net pricing waterfall, warranty accrual history, and support P&L by major SKU.
      relatedQuestionRefs: [QI008]
      relatedTableRefs: [TI001, TI002, TI003]
    - type: missing-source
      severity: material
      topic: primary-filing-financial-schedules
      missingEvidence: The retained pool does not include the underlying STAR filing schedules needed to reconcile product revenue, operating cash flow, and capex directly from the issuer.
      whyItMatters: The current chapter relies on secondary retellings for several key metrics, which is enough for directional analysis but not for final underwriting.
      diligencePath: Add the primary prospectus schedules and inquiry responses covering revenue recognition, capex, depreciation, and working capital.
      relatedQuestionRefs: [QI008]
