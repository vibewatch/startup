schemaVersion: report-v2
artifact: financials
slug: deep-robotics
runDate: 2026-10-17
company:
  name: Deep Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a real industrial hardware business with disclosed 2025 revenue,
    first-time profitability, improving gross margin, and product-level ASP evidence for the
    X-series and Lite lines. The underwriting problem is not whether Deep Robotics sells robots;
    it is that cash, burn, customer concentration, realized discounting, and warranty/service
    burden remain private while management is simultaneously funding an IPO path, humanoid
    commercialization, and capacity expansion.
sections:
  - id: revenue-model-and-traction
    title: Revenue model and public traction
    body: |-
      Deep Robotics is monetizing industrial robotics rather than a pure software subscription. Company-issued materials describe a business spanning the R&D, production, sales, and service of quadruped robots, humanoid robots, and core robotic components, with deployments in power inspection, emergency response, industrial operations, security patrol, and education/research workflows. Independent summaries then fill in the commercial picture: 2025 revenue reached roughly RMB 337 million, gross margin moved above 52%, and embodied-intelligence robots accounted for the vast majority of main business revenue. Product-level evidence suggests the current revenue base is still anchored in quadruped and wheeled-legged systems rather than humanoids, so the right financial lens is industrial hardware monetization plus attached deployment/service work, not SaaS-style recurring revenue. [CI001][CI002][CI004][CI006][CI007]
    claimRefs: [CI001, CI002, CI004, CI006, CI007]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-unit-economics
    title: Pricing signals and unit economics
    body: |-
      The retained public record is strongest on realized product economics, not public list pricing. Robotichina reports that the X-series generated RMB 196 million from 681 units in 2025, implying roughly RMB 287.5 thousand per unit with a 54.4% gross margin, while the Lite series generated RMB 51.3 million from 1,850 units, implying roughly RMB 27.7 thousand per unit. Those disclosed economics are useful because they show Deep Robotics already sells premium industrial systems at much higher monetization than its lighter research/field platforms. But they do not answer the underwriting questions that matter most for forward revenue quality: contract duration, implementation fees, service attach, warranty reserve, realized discounting, or customer concentration. The company therefore has enough public evidence to show product-market monetization, but not enough to show how durable or repeatable the current margin profile will be. [CI008][CI009][CI014]
    claimRefs: [CI008, CI009, CI014]
    tableRefs: [TI002, TI003]
  - id: capital-needs-and-financing-dependency
    title: Capital needs and financing dependency
    body: |-
      The latest clearly disclosed financing event is the December 2025 Series C round of more than RMB 500 million, which management said would support R&D, production-capacity expansion, and market development. Tech in Asia also reported that Deep Robotics had entered IPO guidance with preparatory work expected to finish by June 2026, while later independent summaries and company-linked releases described a STAR filing, new humanoid/embodied-AI ambition, and early 2026 commercial deployment efforts. That combination means Deep Robotics is not simply funding working capital for an already-stable business: it is trying to finance a broader scale-up that spans industrial quadrupeds, wheel-legged systems, humanoids, and production infrastructure. Because no retained public source discloses cash on hand, monthly burn, debt obligations, or runway, capital adequacy still depends more on financing access than on public operating cash evidence. [CI003][CI010][CI011][CI015]
    claimRefs: [CI003, CI010, CI011, CI015]
  - id: underwriting-view-and-blockers
    title: Financial verdict and diligence blockers
    body: |-
      The core positive is that Deep Robotics has crossed the threshold from robotics narrative into documented industrial revenue, first profitability, and credible product-level ASP evidence. The core negative is that the next phase requires investors to underwrite capital intensity and execution with incomplete disclosure: one independent analysis argues humanoid sales were still de minimis, the same source flags sub-80% utilization against an aggressive expansion plan, and EquityZen explicitly markets deeper cap-table, revenue/financial, and risk-factor materials only to accredited private-market users. In practical terms, that leaves public investors able to see growth and product economics, but not the cash conversion, concentration, preference stack, or support burden that determine whether today’s gross-margin improvement can survive a capacity and humanoid buildout. The right financial verdict is “commercially real, but not yet transparently underwritable.” [CI005][CI012][CI013][CI016]
    claimRefs: [CI005, CI012, CI013, CI016]
callouts:
  - calloutType: insight
    title: Industrial hardware, not subscription software, is carrying the model today
    body: >-
      The strongest public revenue evidence comes from quadruped and wheeled-legged deployments,
      product-level unit sales, and gross margin progression; public humanoid monetization is
      still early and should be treated as upside rather than the core base case.
    claimRefs: [CI004, CI007, CI008, CI013, CI015]
  - calloutType: risk
    title: Profitability can be fragile if capacity expands ahead of verified demand
    body: >-
      Public sources support first profitability, but they also point to utilization risk,
      limited disclosed humanoid volume, and no public runway data while the company is scaling
      manufacturing and pursuing an IPO.
    claimRefs: [CI005, CI013, CI014]
  - calloutType: recommendation
    title: Ask for the private underwriting pack before taking valuation comfort from 2025 profit
    body: >-
      Management should provide cash, burn, backlog quality, customer concentration, warranty
      burden, preference terms, and realized discounting by product line before investors rely on
      the public gross-margin and revenue trajectory as durable.
    claimRefs: [CI003, CI005, CI012]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - Industry-grade X-series quadrupeds
        - Hardware sales for utility, inspection, hazardous-environment, and emergency workflows
        - Units plus RMB revenue
        - 681 units and RMB 196M in 2025; ASP about RMB 287.5K and 54.4% gross margin
        - Independent secondary summary, not a retained primary filing
        - Obtain filed revenue, gross margin, and service attach by major account
      - - Lite-series quadrupeds
        - Lower-priced robot sales for research and field deployment
        - Units plus RMB revenue
        - 1,850 units and RMB 51.3M in 2025; ASP about RMB 27.7K
        - Independent secondary summary only
        - Confirm channel mix, geography mix, and realized discounts
      - - Core robotic components and joint modules
        - Component sales alongside complete robots
        - Modules / component revenue
        - Official sources confirm components are sold, but retained public evidence does not disclose standalone revenue contribution
        - Official business-model evidence without monetization split
        - Request component revenue, margin, and attach to system sales
      - - Humanoid / embodied-AI systems
        - Pilot deployments and early industrial commercialization
        - Units / pilot projects
        - DR02 commercial deployment was announced for 2026, but one independent analysis says only four humanoid units sold over the prior two years
        - Mixed public evidence; scale remains unclear
        - Request booked orders, realized ASP, and acceptance milestones by deployment
    notes: >-
      Source mix combines official company disclosures with independent summaries; null-style
      descriptions mean the retained public sources did not disclose a numeric monetization split.
    claimRefs: [CI001, CI008, CI013, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - X-series industrial quadrupeds
        - About RMB 287.5K implied 2025 ASP
        - Realized ASP from independent summary, not public list pricing
        - Contract length, installation, software, and maintenance pricing undisclosed
        - SI006
      - - Lite-series quadrupeds
        - About RMB 27.7K implied 2025 ASP
        - Realized ASP from independent summary, not public list pricing
        - Channel discounts and education/research pricing tiers undisclosed
        - SI006
      - - DR02 humanoid deployments
        - No public unit price in retained evidence
        - Public evidence shows deployment status, not realized pricing
        - Volume breaks, warranty terms, and support pricing undisclosed
        - SI002, SI008
      - - Series C financing
        - More than RMB 500M raised
        - Capital source rather than customer pricing
        - Security terms, post-money valuation, and liquidation preferences undisclosed publicly
        - SI003, SI004, SI005
    notes: >-
      Pricing evidence is strongest on implied realized ASPs and weakest on published list prices
      or commercial terms; blanks indicate undisclosed public pricing rather than zero value.
    claimRefs: [CI003, CI008, CI009, CI012, CI015]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2025 revenue
        - RMB 337M to RMB 337.5M in secondary summaries
        - Medium
        - Confirms a real industrial revenue base before the IPO
        - Reconcile against the filed audited revenue schedule
      - - 2025 net profit
        - RMB 28.68M to RMB 28.7M after a 2024 loss
        - Medium
        - Shows first profitability, but not cash generation quality
        - Break out non-recurring items and operating cash flow
      - - 2025 gross margin
        - 52.82% to 52.83%
        - Medium
        - Indicates improving product mix and delivery economics
        - Provide margin bridge by product line and after-sales burden
      - - Overseas revenue share
        - About RMB 61M, a little over 18% of 2025 revenue
        - Medium
        - Export can diversify growth but adds compliance and policy exposure
        - Split revenue by region, channel, and local service cost
      - - X-series product economics
        - 681 units, RMB 196M revenue, about RMB 287.5K ASP, 54.4% gross margin
        - Medium
        - Gives the clearest public view of enterprise hardware monetization
        - Confirm warranty reserve, implementation cost, and software content
      - - Capacity / utilization risk
        - Existing facilities below 80% utilization versus a much larger expansion plan
        - Medium
        - Profitability can reverse quickly if capacity is built ahead of booked demand
        - Provide utilization, capex schedule, and order-backed expansion assumptions
    notes: >-
      Values come from retained public summaries rather than the primary filing itself; ranges
      reflect close-but-not-identical public retellings and should be reconciled in diligence.
    claimRefs: [CI004, CI005, CI006, CI009, CI010, CI014]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence points from industrial deployments to concentrated hardware revenue and
      improving margins, while humanoid monetization remains early-stage.
    data:
      nodes:
        - id: workflows
          label: Industrial inspection and emergency workflows
          detail: >-
            Company materials describe power inspection, emergency firefighting, security patrol,
            industrial operations, and research/education use cases across China and overseas.
          claimRefs: [CI002]
        - id: products
          label: Robot families and components
          detail: >-
            The current commercial stack includes quadrupeds, wheeled-legged systems, humanoids,
            and core robotic components rather than a single-SKU business.
          claimRefs: [CI001]
        - id: buyers
          label: Enterprise and public-sector deployments
          detail: >-
            Official deployment examples and overseas/utility references indicate project-based
            industrial selling rather than self-serve volume software.
          claimRefs: [CI002, CI016]
        - id: revenue
          label: Recognized 2025 hardware revenue
          displayValue: RMB 337M+
          detail: >-
            Independent summaries report roughly RMB 337 million of 2025 revenue, with embodied
            robots accounting for 95.69% of main business revenue.
          claimRefs: [CI004, CI007]
        - id: gross-profit
          label: Gross-profit conversion
          displayValue: 52.82%-52.83% GM
          detail: >-
            Public product economics show materially better monetization in X-series industrial
            systems than in the Lite line.
          claimRefs: [CI006, CI008, CI009]
        - id: humanoid-upside
          label: Forward humanoid upside, still early
          detail: >-
            Company-linked releases describe 2026 commercial deployment, but an independent
            analysis says humanoid unit sales were still tiny before the scale-up push.
          claimRefs: [CI013, CI015]
      edges:
        - from: workflows
          to: products
          label: creates demand for
          claimRefs: [CI002]
        - from: products
          to: buyers
          label: sold into
          claimRefs: [CI001, CI002]
        - from: buyers
          to: revenue
          label: converts to
          claimRefs: [CI004, CI007]
        - from: revenue
          to: gross-profit
          label: supports
          claimRefs: [CI006, CI008]
        - from: gross-profit
          to: humanoid-upside
          label: funds but does not prove
          claimRefs: [CI003, CI013, CI014, CI015]
    approximationNotes: >-
      The figure is a public-evidence logic map, not a quantified waterfall; it links observed
      deployments, product families, and disclosed economics without inferring hidden conversion
      rates or recurring-revenue shares.
    claimRefs: [CI001, CI002, CI003, CI006, CI007, CI013, CI015]
