  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Deep Robotics' biggest open risks are execution and disclosure rather than demand narrative: the company is pushing a capital-intensive humanoid and IPO agenda while public evidence on cap-table terms, certifications, service levels, and incident history remains thin. Official materials show real hazardous-field deployments and enterprise validation, but those same facts raise the downside if reliability, overseas support, or funding cadence slips."
  },
  "sections": [
    {
      "id": "capital-and-regulatory-exposure",
      "title": "Capital-market and regulatory exposure",
      "body": "Deep Robotics' capital-market risk is not whether investor interest exists, but whether disclosure catches up before the IPO window closes. Tech in Asia says the company entered IPO guidance and expected preparatory work to finish by June 2026, while RobotChina says a STAR Market filing was accepted in May 2026 and targets roughly RMB 2.5 billion of fundraising at a reported RMB 13.9 billion valuation. Humanoids Daily separately says the company is using a revenue-generating quadruped base to fund a more capital-intensive humanoid push. That combination makes financing risk real even after the reported 500 million yuan round: investors still lack public cap-table terms, liquidation preferences, and accessible primary filing detail. Kill criteria are monitorable: if filing milestones slip, if valuation moves ahead of disclosed unit economics, or if humanoid-scale spending rises before the quadruped business shows durable cash conversion, the risk should remain a track-not-buy condition.",
      "claimRefs": [
        "CR004",
        "CR005",
        "CR006",
        "CR007",
        "CR012"
      ],
      "tableRefs": [
        "TR001"
      ],
      "figureRefs": [
        "FR001"
      ]
    },
    {
      "id": "operational-and-serviceability-exposure",
      "title": "Operational, quality, and serviceability exposure",
      "body": "The core operating risk is that Deep Robotics is marketing robots into environments where failure costs are unusually high. Company-issued materials place the systems in substations, tunnels, landslides, flood control, hazardous chemical operations, and disaster rescue, which means uptime, autonomy quality, and operator support matter more than a demo-grade success narrative. The same support terms that help document the product also show friction: there are no returns, free warranty coverage excludes a long list of misuse and harsh-environment scenarios, the customer may bear shipping and paid-repair costs, and the published after-sales terms are explicitly limited to mainland China. Public materials therefore prove real use, but not yet a robust global service stack. Investors should treat field-failure rates, warranty claims, overseas spare-parts coverage, and safety or cybersecurity certifications as explicit diligence gates rather than assuming them from the deployment logos.",
      "claimRefs": [
        "CR001",
        "CR002",
        "CR003",
        "CR008",
        "CR009",
        "CR013"
      ],
      "tableRefs": [
        "TR002"
      ]
    },
    {
      "id": "concentration-and-dependency-exposure",
      "title": "Concentration and dependency exposure",
      "body": "The partner and revenue base still looks narrower than the product narrative suggests. The U.S. about page highlights a short list of enterprise names-State Grid, China Southern Power Grid, Baosteel, and Fluke-which is strong validation but also evidence that a few industrial accounts and channels matter a lot. RobotChina additionally says quadruped and wheeled robots still drive more than 95% of revenue, so the humanoid line is strategically important without yet being proven as a second economic engine. That means diversification risk operates on both the customer axis and the platform axis. If a utility or heavy-industry spending cycle pauses, or if humanoid scale-up absorbs capital faster than it wins production demand, the company could face margin pressure even with solid top-line momentum. The most useful monitoring indicators are repeat orders outside energy inspection, disclosed revenue mix by product family, and conversion of reported orders on hand into cash collections.",
      "claimRefs": [
        "CR010",
        "CR011",
        "CR012",
        "CR013"
      ],
      "tableRefs": [
        "TR003"
      ]
    }
  ],
