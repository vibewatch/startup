  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: Renewal rates, contract duration, churn, service attach, and any NRR or GRR by product line or customer segment.
      whyItMatters: Without durability metrics, visible deployments cannot be translated into recurring economics or predictability.
      diligencePath: Request cohort, renewal, and service-revenue schedules by product line and top ten accounts during management diligence.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Top-customer revenue share, repeat-order mix, and revenue concentration across State Grid, China Southern Power Grid, and other major accounts.
      whyItMatters: The chapter's named proof is utility-heavy, so concentration could be materially higher than the broad deployment headlines imply.
      diligencePath: Request customer concentration tables, top-account ARR or revenue, and repeat-order history tied to utility customers.
      relatedQuestionRefs: [QU005]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: A fuller public or private list of named production customers outside the China utility base, including counterparties, site counts, and whether deployments are paid pilots or scaled contracts.
      whyItMatters: Global footprint claims are broader than the named-customer evidence, which limits confidence in cross-border and cross-vertical expansion.
      diligencePath: Ask management for a referenceable deployment roster and customer interview list segmented by production, pilot, and channel-led projects.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: minor
      topic: humanoid-commercialization
      missingEvidence: Independent customer evidence for DR02 or later humanoid deployments, including named operator, unit count, and operating outcomes.
      whyItMatters: Humanoid commercialization is part of the expansion narrative but remains weakly corroborated compared with the quadruped base.
      diligencePath: Request signed customer references or third-party deployment evidence before underwriting humanoid upsell in the customer thesis.
      relatedQuestionRefs: [QU007]
