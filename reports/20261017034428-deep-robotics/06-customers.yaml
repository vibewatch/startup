          detail: "Research surfaces broaden awareness but do not yet prove enterprise monetization depth."
        - label: "Humanoid expansion option"
          value: "Future industrial upsell"
          touchpoints:
            - "DR02 commercial-deployment claim in 2026"
            - "Independent evidence still shows only one humanoid unit sold in 2025"
          detail: "Humanoids are a strategic extension, not a meaningfully proven customer base today."
    claimRefs: [CU003, CU004, CU007, CU008, CU009, CU012, CU013]
callouts:
  - calloutType: insight
    title: Utility inspection is the real customer proof
    body: >-
      The investment-grade customer story is not generic embodied AI demand; it is a narrower but more credible
      wedge in utility inspection, where named accounts, usage metrics, and long-term partnership language
      actually exist.
    claimRefs: [CU003, CU004, CU006]
  - calloutType: risk
    title: Durability is still a diligence question, not a disclosed metric
    body: >-
      Public evidence does not reveal customer concentration, renewals, cohort expansion, or service attach, so
      the leap from visible deployments to durable recurring economics still requires private diligence.
    claimRefs: [CU010, CU011, CU012]
