schemaVersion: "report-v2"
artifact: customers
slug: deep-robotics
runDate: 2026-10-17
company:
  name: Deep Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Customer proof is strongest in utility inspection, where Deep Robotics has the clearest production evidence
    with State Grid and China Southern Power Grid plus published utilization signals around 100+ substations and
    more than 1 million inspection kilometers. Public materials also point to broader industrial, emergency, and
    overseas deployments, but retention, concentration, repeat-order cohorts, and most named customer economics
    remain undisclosed, so expansion evidence is directional rather than durable.
sections:
  - id: customer-segments
    title: Customer base is industrial-first, with utilities as the commercial anchor
    body: >-
      Public evidence consistently places Deep Robotics with professional rather than consumer buyers. Official
      company materials describe deployments across energy, emergency response, industrial operations, and
      education, while independent profiles align that the X-series and related systems are used for industrial
      inspection, hazardous-site entry, and research programs rather than broad consumer adoption. That mix matters
      because it implies a buyer set dominated by utilities, industrial operators, public-safety agencies, and
      technical institutions with procurement and integration budgets, not impulse hardware demand. The strongest
      customer fit is power-grid inspection, with other sectors appearing as adjacent workloads or developer
      seeding channels rather than equal commercial pillars.
    claimRefs: [CU001, CU002, CU003, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof
    title: Named customer proof exists, but it is concentrated and uneven in quality
    body: >-
      The clearest production proof is in utility inspection. Independent and official sources both point to
      deployments across more than 100 substations with State Grid and China Southern Power Grid, and the same
      disclosures frame those relationships as long-term rather than one-off demos. Outside the Chinese utility
      base, the picture becomes thinner. Company and profile sources mention Singapore national-grid surveys,
      tunnel and corridor inspection, and deployments across dozens of countries, but they do not identify most
      counterparties, unit counts, contract terms, or what share of the footprint reflects paid recurring work
      versus pilots, showcases, or integrator-led projects. As a result, Deep Robotics has real adoption proof,
      but named proof is still narrower than the global footprint headline suggests.
    claimRefs: [CU003, CU004, CU005, CU006, CU007, CU010]
    tableRefs: [TU002, TU003]
  - id: durability-expansion
    title: Durability and expansion remain under-disclosed, with humanoid traction still mostly roadmap-level
    body: >-
      The company has enough external evidence to show real demand, but not enough to underwrite durability.
      Independent writeups still note that Deep Robotics has not shared customer counts, cohort behavior, or
      segment-level revenue split, which makes it difficult to judge concentration, renewal depth, or service
      attach. The disclosed financial and order figures show continued momentum in industrial quadrupeds, yet they
      do not separate new-logo demand from follow-on fleet expansion. The same caution applies to the humanoid
      story: public 2026 deployment language comes primarily from a paid company release, while the best
      independent evidence still describes the humanoid line as early and commercially negligible versus the core
      quadruped base. That leaves the customer thesis investable on utility inspection today, but speculative on
      broader land-and-expand and humanoid upsell.
    claimRefs: [CU008, CU009, CU011, CU012]
