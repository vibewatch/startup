  - id: TV002
    title: 正题 / 反题表
    columns:
      - 视角
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正题
        - 工业落地证据已经足够真实，不能忽略：公司及其区域网站都提到电网、隧道、应急响应和工业合作。
        - 若有独立数据证明落地规模、复购订单和服务附加率，判断会更坚定。
      - - 正题
        - 2025 年融资轮和 IPO 指导流程表明，融资渠道和潜在流动性路径已经启动，并非假设。
        - 经核实的交易所申报或已披露融资条款，才能让这一融资信号进入投资判断。
      - - 反题
        - 公开证据仍未披露当前估值、股权结构、清算优先权，或经审计的收入与利润。
        - 最新定价备忘录、董事会批准的股权结构表或公开申报，都会显著削弱这一反对理由。
      - - 反题
        - 人形机器人及更广泛的具身 AI 扩张，可能在四足业务透明地产生现金之前就消耗大量资本。
        - 分部利润率、出货量数据，以及可盈利的经常性服务收入证据，都能缓解这一担忧。
    notes: 这张表把投资判断中的正面因素与对价格敏感的阻碍分开；私募市场条款缺失仍是核心缺口。
