  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据将 Deep Robotics 放在广义腿式机器人竞争中，而不是单一产品竞赛里。其公开产品组合覆盖 Jueying 四足机器人、LYNX 轮足系统、DR
              人形机器人和关节部件；公司自身材料则将这些产品定位于电力巡检、应急响应、隧道、建筑和科研场景。现有独立证据中最明确的直接同行是 Unitree，其 IPO 申请被描述为与 Deep Robotics
              并行推进。公开讨论也会提到 Boston Dynamics 和 Unitree
              作为参照，但这些讨论属于轶闻，不能证明性能可比。固定式巡检设备、人工巡检团队和客户自行构建的集成方案仍是具有经济意义的解决路径，但现有材料没有量化它们的成本或性能。因此，竞争格局表将已有证据的公司事实与仍需一手尽调的替代方案区分开来。
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP006
              - CP011
              - CP012
              - CP016
      - number: '3.2'
        title: 能力与产品组合定位
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 的差异化主张建立在纵向整合的感知—决策—执行技术栈，以及一条从兼容 ROS2 的科研平台延伸至工业四足机器人、轮足机器人和早期人形机器人的产品梯队上。美国官方网站称 Lite3
              支持开放 SDK、LiDAR、深度摄像头和 NVIDIA Jetson Xavier
              NX，这可能降低科研买方的原型开发门槛。公司材料还声称具备自主导航、SLAM、实时适应能力，并已部署在复杂工业环境中。这些是有意义的能力范围信号，但大多来自公司自身，并非独立基准测试结果。因此，定位图只按商业成熟度和工业专业化的序数轴评估
              Deep Robotics 自身产品组合，没有凭空制造竞争对手坐标。核心竞争问题是：工业部署经验能否在部件和运动能力商品化之前，更快转化为可重复的产品优势。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
