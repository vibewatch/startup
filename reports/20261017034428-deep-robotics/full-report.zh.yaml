chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、覆盖范围与阶段
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics 将自己定位为一家专注工业和危险环境部署的具身 AI
              机器人公司，而不是纯研究实验室。公司在官方中文页面和面向美国的页面中，都将产品描述为覆盖四足机器人、人形机器人和核心机器人系统；美国网站则突出四足机器人当前在工业巡检、应急响应、地下导航和科学研究中的应用。现有来源支持公司成立于
              2017 年、总部位于杭州，但不足以让读者准确了解客户数、员工数、收入或公司自报覆盖范围之外的地点。


              现有材料中最有分量的规模表述，是管理层在 2025 年 12 月称公司已覆盖中国全部 34 个省级地区，以及海外 44 个国家 /
              地区。这可以作为商业化信号，但仍是公司发布的证据，不能等同于独立基准验证的装机量数据。就公司阶段而言，现有证据更支持“私有公司 / 按 IPO 前市场交易追踪”，而不是已经上市：EquityZen 将 Deep
              Robotics 列为 IPO 前标的，并提供股东流动性基础设施，但材料没有确认已提交招股书、交易所流程已完成或当前估值。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO006
              - CO007
      - number: '1.2'
        title: 领导层披露、创始人市场匹配与治理缺口
        blocks:
          - type: paragraph
            body: >-
              现有证据对领导层的披露很有限。最明确的高管是 Zhu Qiuguo，融资公告称其为创始人兼 CEO；其他保留材料对创始团队和更广泛技术班底的描述则较为笼统。EquityZen
              称创始团队根植于浙江大学；美国关于页面称，已披露的核心团队来自浙江大学、上海交通大学、北京理工大学、武汉大学、NYU、UIUC、Georgia Tech 和 Dortmund University of
              Technology 等高校。这支持其在腿式机器人和自主技术上的创始人市场匹配，但不能替代完整的高管名单或董事会图谱。


              因此，治理是当前真正的尽调缺口。现有来源没有披露董事会名单、委员会结构，也没有在创始人 / CEO
              之外点名其他非创始人高管，这会加剧公开记录中的关键人集中度。融资尽调同样受到这一缺口影响：公司显然正走向更机构化的股东基础，但现有证据没有说明谁在管理投资者权利、监督如何安排，或 Series C
              之后的报告纪律是否已与商业化进程同步成熟。
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO010
      - number: '1.3'
        title: 资本形成与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              材料中证据最充分的融资事件是 2025 年 12 月的 Series C。Deep Robotics 称融资超过 RMB 500 million，CMB International 和 ChinaAMC
              担任联合领投，China Telecom 和 China Unicom
              关联基金进行战略投资。同一公告还列出一长串新老支持者，这很重要，因为它说明该轮融资不只是财务融资，也带有生态布局色彩：电信关联基金、产业投资者和此前专注机器人的资本都出现在投资者名单中。


              即便如此，证据距离完整的股权结构仍相差甚远。现有来源没有披露投后估值、优先权条款、清算保护、老股转让规模、债务工具，或任何投资者是否拥有普通股权之外的治理权或分配权。因此，这张利益相关方图谱可以帮助判断哪些参与者对公司重要，但还不能替代可用于尽调的所有权模型。
            claimRefs:
              - CO003
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
      - number: '1.4'
        title: 近期里程碑与材料中的主要负面信号
        blocks:
          - type: paragraph
            body: >-
              保留的里程碑证据集中在 2025—2026 年，显示公司正尝试突破单一机器人形态。管理层称，2025 年推出了 Lynx M20 轮足平台、发布 DR02 工业人形机器人、建立具身 AI 试点生产基地，并在
              2025 年 12 月融资公告时完成股份制改革。2026 年 7 月的一则付费 WAIC 公告随后称，DR02
              已通过变电站精细化作业测试，并进入电力巡检、危险化学品作业和灾害救援的商业部署。这些里程碑合在一起，说明公司正从四足巡检起家，转向更广泛的具身 AI 系统商业化。


              现有材料中的主要负面信号不是诉讼或监管行动，而是认知风险。保留的 Reddit
              讨论反复将该机器人平台描述为可能用于军事或社会控制的工具，说明即使官方材料强调工业巡检、救援和科研应用，高机动性演示仍可能触发双重用途焦虑。这并不能证明公司当前存在商业问题，但它确实是可信的声誉观察点，因为双重用途认知可能比正式法律披露更快影响客户、监管机构和出口管制审查。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO007
              - CO011
              - CO012
              - CO013
              - CO015
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开记录的集中风险
            body: 公开记录对产品演示和最新融资轮披露较深，但对董事会构成、更广泛的高管班底、当前估值和私营公司经营指标披露较少。
            calloutType: risk
            claimRefs:
