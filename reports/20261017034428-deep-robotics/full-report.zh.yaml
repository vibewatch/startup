            body: >-
              核心运营风险在于，Deep Robotics
              正把机器人卖到失败代价异常高的环境中。公司材料将系统放入变电站、隧道、滑坡、洪水控制、危险化学品作业和灾害救援场景，因此运行时间、自主能力质量和操作员支持比演示级成功叙事更重要。帮助记录产品的支持条款同时也暴露出摩擦：不接受退货；免费保修排除了长串误用和恶劣环境场景；客户可能承担运输和付费维修费用；公开的售后条款还明确限于中国大陆。因此，公开材料证明了真实使用，却尚未证明稳健的全球服务体系。投资者应把现场故障率、保修索赔、海外备件覆盖和安全或网络安全认证视为明确的尽调门槛，而不能从部署
              logo 中自行推断。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR013
      - number: '7.3'
        title: 集中度与依赖暴露
        blocks:
          - type: paragraph
            body: >-
              合作伙伴和收入基础仍比产品叙事所暗示的更窄。美国关于页面突出一小组企业名称——State Grid、China Southern Power Grid、Baosteel 和
              Fluke——这既是有力验证，也说明少数工业账户和渠道非常重要。RobotChina 还称，四足和轮足机器人仍贡献超过 95%
              的收入，因此人形产品线虽然具有战略重要性，却尚未证明自己是第二个经济引擎。因此，多元化风险同时存在于客户轴和平台轴上。如果公用事业或重工业支出周期暂停，或者人形机器人规模化消耗资本的速度超过其赢得生产需求的速度，公司即使营收顶线保持良好势头，也可能面临利润率压力。最值得监测的指标是能源巡检之外的重复订单、按产品家族披露的收入结构，以及将已报告手头订单转化为现金回款的情况。
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 需要监测的论点破坏触发器
            body: 如果 IPO 进程停滞、估值跑在已披露单位经济性之前、海外支持仍依赖中国大陆，或人形机器人投入上升却没有独立收入引擎承接，就不要据此买入。
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
              - CR012
          - type: callout
            title: 管理层最快可以提供的去风险信息
            body: 如果管理层提供当前申报材料包、股权结构条款、认证地图、海外 SLA 指标、保修索赔数据，以及能够证明人形机器人正在成为商业产品线而不只是战略叙事的产品家族收入结构，本章的风险就能最快下降。
            calloutType: assumption
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与投资判断
        blocks:
          - type: paragraph
            body: >-
              证据支持继续接触，但不支持激进进入。正面来看，Deep Robotics
              拥有新资金、多项已报告的工业部署，以及如今覆盖四足、轮足和人形平台的扩展产品组合。这些要点很重要，因为它们说明公司已不再只是研发故事。然而，公开记录仍缺少决定私募轮或老股转让价格是否有吸引力的变量：当前估值、优先股堆叠、稀释路径，以及从产品
              商业牵引力到持久盈利能力的清晰桥接。因此正确建议是跟踪，而不是买入。公司基本面可能正在改善，但在价格条款和运营质量指标未披露的情况下，投资者会为期权价值付费，却无法判断期权是否已经被充分定价。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: 融资背景、价格支撑与进入纪律
        blocks:
          - type: paragraph
            body: >-
              最新融资和 IPO 信号改善了融资期权性，但并没有确立公允价值。Yicai 和 Tech in Asia 都报道 2025 年融资约 CNY500 million；Tech in Asia 和 Humanoids
              Daily 则提到 A 股 IPO 辅导及已完成的股份制改革，这与上市准备相符。EquityZen
              提供了一个有用的市场信号，因为它说明私募二级市场存在流动性；但其面向公众的页面将股权结构表、按股份类别划分的融资历史、流动性优先权和财务信息锁在认证和登录门槛之后。实际上，公开投资者能观察到获取份额的需求，却拿不到判断二级报价是否干净、是否被优先权悬置负担的必要信息。因此进入纪律必须保持保守：在管理层提供当前估值和条款透明度之前，不要为叙事溢价追价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: 情景框架与可比视角
        blocks:
          - type: paragraph
            body: >-
              乐观情景是，Deep Robotics 在公开市场窗口关闭前把今天的工业立足点变成规模化具身 AI
              平台，利用新资金拓宽产品线，并把更多巡检、公用事业和应急响应部署转成可重复项目。基准情景更克制：四足机器人需求继续，但公开记录对分部利润率、重复订单和服务结构仍过于单薄，无法支撑私募市场溢价。悲观情景并不是公司没有技术，而是人形机器人扩张和
              IPO 准备消耗资本的速度超过了商业指标成熟的速度。公开可比证据也不完整。第三方行业分析将 Deep Robotics 与 Boston Dynamics、ANYbotics 和 Unitree
              对照，Humanoids Daily 明确称其规模落后于 Unitree，但这仍不足以形成真正的估值可比组，因为 Deep 自身没有披露经审计的收入、利润或出货量细节。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: 最终尽调要求与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              剩余尽调清单直接且杠杆很高。第一，索取最新定价轮文件、股份类别结构、清算优先权、反稀释机制，以及与 IPO 时间表相关的任何 VAM 或特殊权利。第二，索取能够把真实商业化与标题叙事的势头
              区分开的经营数据：按产品家族划分的收入、硬件与服务的毛利率、重复订单队列、积压订单、客户集中度、保修成本和现场服务负担。第三，要求管理层将围绕 DR02 和 Lynx
              的商业化故事与实际出货量、已签合同和实现价格对账。如果 IPO 时间表延迟而披露没有相应增加，如果人形机器人投资超过核心四足业务的变现能力，或客户商业牵引力 过于集中而无法支撑私募市场溢价，投资逻辑就会被破坏。
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 跟踪，但不要为获取份额追价
            body: Deep Robotics 看起来比投机性项目更具融资基础，但公开记录仍不支持不计价格地买入。缺失的估值和优先权证据，比产品故事的叙事质量更重要。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV012
          - type: callout
            title: 人形机器人上行仍只是期权价值
            body: 人形机器人布局可能增加上行空间，但公开证据仍将其视为商业化抱负，而不是已披露的现金流引擎。把它作为基准情景价值计入投资判断还为时过早。
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV013
