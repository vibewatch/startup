              - CP015
      - number: '3.3'
        title: 定价、分销与切换动态
        blocks:
          - type: paragraph
            body: >-
              没有任何保留来源提供 Deep Robotics、Unitree 或 Boston Dynamics 的经核实公开价格、实际合同金额、折扣表、服务附加率或可比的总拥有成本。因此无法进行可辩护的性价比排名。Deep
              Robotics 确实披露了 Lite3
              面向科研的开放软件取向，以及覆盖更广泛平台的模块化自主能力套件。这些接口可能降低初始集成摩擦；部署后的客户定制地图、感知、安全、工作流和机队管理工作则可能形成切换成本，但后者只是推断，并非已披露的留存指标。公司还声称与大型工业组织存在现场合作关系，但证据没有说明是否独家、渠道经济性如何、是否有重复采购，或客户是否同时使用多家供应商。因此，买方近期应关注集成深度和服务表现，而不是不存在的公开标价。
            claimRefs:
              - CP007
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP013
              - CP014
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              持久性的最佳证据来自商业表现，而不是舞台效果：第三方报道将 RMB 196 million、占 2025 年收入 58.11% 的收入和 681 台销量归于 Jueying X 四足产品线；报道还称较新的
              Shanmao M 轮足产品线贡献了 RMB 74 million，而人形机器人仅贡献 RMB 823,000。这一结构说明，Deep Robotics
              当前的护城河主要依赖工业四足机器人的部署、产品可靠性和客户集成，而非人形机器人的期权价值。与此同时，匿名讨论 LYNX
              演示时既提到其机动性优势，也担忧电池续航、缠绕和军事化；这些评论是有用的负面信号，但不是工程证据。Unitree 同期推进
              IPO，加上缺乏独立测试的正面对比指标，都提高了替代不确定性。要形成持久差异化，公司还需要重复订单队列、可靠性数据、服务经济性以及与直接同行的经验证性能，而这些在现有材料中都没有出现。
