    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 四足机器人落地持续复合增长，DR02 转化为真实工业合同，IPO 准备披露带来更清晰的价格发现。
        - 只有披露的收入质量和条款能够验证溢价时，才可能支撑私募成长型机器人公司的溢价估值。
        - 人形机器人商业化停滞，或 IPO 窗口在披露改善前关闭。
        - 需要新证据；目前还不是公开证据支持的基准情景。
      - - 基准
        - 核心四足业务继续增长，融资选择仍然开放，但估值、利润率和客户质量的披露仍不完整。
        - 最适合当作跟踪仓位，等待更好的证据或更有吸引力的入场条款。
        - 叙事溢价跑在基本面之前；私募条款仍不利于投资者。
        - 与当前公开证据最一致。
      - - 悲观
        - 人形机器人扩张吞噬现金，IPO 时点推迟，商业落地证明比营销叙事所说的更窄、更集中。
        - 应相对溢价机器人同行打折，或在公司重置价格和透明度前暂不投资。
        - 尽管披露变弱或流动性推迟，私募轮定价仍维持高位。
        - 几项关键指标仍未披露，因此不能排除这一情景。
    notes: 由于公开来源没有披露当前估值、条款清单或经审计的经营桥接数据，情景逻辑只能保持定性。
