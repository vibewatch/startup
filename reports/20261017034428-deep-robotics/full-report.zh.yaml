              正在变现工业机器人，而不是纯软件订阅。公司材料描述的业务覆盖四足机器人、人形机器人和核心机器人部件的研发、生产、销售与服务，并已部署于电力巡检、应急响应、工业运营、安保巡查和教育科研场景。独立摘要补足了商业图景：2025
