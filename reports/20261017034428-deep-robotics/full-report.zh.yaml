              最新明确披露的融资事件是 2025 年 12 月超过 RMB 500 million 的 Series C，管理层称资金将用于研发、产能扩张和市场拓展。Tech in Asia 还报道 Deep Robotics
              已进入 IPO 辅导，准备工作预计于 2026 年 6 月完成；              后续独立摘要和公司关联发布则描述了 STAR 申报、人形 / 具身 AI 抱负以及 2026
