  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              在开始测算规模之前，现有材料已经支持一个清晰的市场边界：Deep Robotics 不应被理解为泛化的“人形”或广义具身 AI 供应商，而应被视为一家以工业现场作业为变现切入口的腿式机器人公司。Hello
              China Tech 基于招股书的分析称，工业应用贡献了 2025 年主营业务收入的
              79.33%，并列出电网巡检、应急消防、警务安保、工业监测、基础设施巡查和物流等付费场景。公司发布的页面又将相邻场景扩展到能源、应急响应、工业运营、制造、基础设施、教育和科研，这与覆盖工业四足机器人、轮足系统及早期人形机器人的产品栈一致。因此，主要替代方案是现有人工巡检和危险场地巡检流程，以及相邻的科研教育平台，而不是整个机器人硬件市场。Lite3
              产品线保留了非工业入口，所以科研教育仍有意义；但证据不足以把这一相邻市场视为与工业部署相同的预算池。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: 买方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              现有材料中的买方图谱比泛泛的机器人叙事更具体。公用事业和基础设施所有者是巡检流程的核心买方；公共安全和应急机构购买危险环境侦察能力；工业运营商或安保团队则购买巡查、监测及物流相邻场景的能力。公司反复将采用场景放在人工进入困难、危险或缓慢的地点；独立报道也显示，装机基础正从一次性演示走向可重复采购。Hello
              China Tech 引用的累计部署量显示，电力巡检和警务安保均超过 300 个，消防救援超过 150 个，工业场景约 300 个；公司则称其系统已将 1,200
              多个场景提炼为六套行业解决方案。这些证据组合起来，说明买方通常先批准一个降低风险的使用场景，待机器人在狭窄流程中证明机动性、感知能力和可靠性后，再将采购标准化，而不是一开始就覆盖广泛的劳动力类别。
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM008
              - CM014
      - number: '2.3'
        title: 规模测算视角、驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              最有力的规模证据来自公司自身，必须视为有边界的观察窗口，而不是整个市场的规模主张。材料显示，2025 年工业应用收入为 RMB 267.3 million，售出 681x 台 X 系列工业四足机器人，单价约
              RMB 287.5k；2026 年第一季度收入超过 RMB 110 million，手头订单为 RMB 235 million。这些数字证明了真实且已变现的切入口，也解释了公司为何能够推进 IPO
              并继续为人形机器人扩张融资。但同一批证据也凸显出影响估值的约束：买方基础比消费或科研硬件更窄，销售周期更长，安全关键型部署要求设备在恶劣环境中保持可靠，公司转向人形机器人也会在该细分市场得到同等验证前增加资本需求。Tech
              in Asia 的采购案例有助于说明公共部门和公用事业买方可以承担有意义的单机预算，但现有材料仍没有提供可辩护的第三方 TAM / SAM /
              SOM，也没有按地区和细分市场独立核对的支出模型。因此，采用情况最好理解为一个需求已有可信证明、但对今日已验证细分市场之外可触达预算池究竟有多大仍缺乏完整证据的危险工作流自动化市场。
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM008
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM007
              - CM008
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 已验证的切入口，尚不完整的市场总量
            body: 现有材料显示危险工作流自动化存在真实工业需求，但估值仍取决于重复采购能否从当前已验证的巡检、应急响应和巡查细分场景扩展出去。
            calloutType: insight
            claimRefs:
