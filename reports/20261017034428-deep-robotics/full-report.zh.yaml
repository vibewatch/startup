        - label: 工业四足机器人变现
          value: RMB 287.5k ASP
          detail: Hello China Tech 和 RobotiChina 都指向 2025 X-series 产品约 RMB 287.5k 的平均售价。
          claimRefs:
            - CM004
    approximationNotes: 各层混合了场景数量、累计装机量和平均售价，因此有意设计为不可加总；应将其视为可观察的市场切面，而非数学嵌套的 TAM/SAM/SOM 模型。
    claimRefs:
      - CM004
      - CM007
      - CM008
  - id: FP001
    title: Deep Robotics 产品组合定位
    type: quadrant
    summary: 分析师用序数图展示商业成熟度（x 轴，1 低至 5 高）与工业专业化程度（y 轴，1 广泛 / 研究至 5 任务专用）；仅纳入分配来源池有证据支持的产品。
    data:
      points:
        - label: Jueying X 系列
          x: 5
          'y': 5
          detail: 681 台出货量和占 2025 年收入 58.11% 的比例，构成最强的商业信号。
        - label: LYNX M20
          x: 4
          'y': 4
          detail: 2025 年发布，定位于工业级轮腿式应用。
        - label: LYNX
          x: 3
          'y': 4
          detail: 2026 年发布的全地形产品，但没有保留的销售指标。
        - label: Lite3
          x: 4
          'y': 2
          detail: 面向研究的 ROS2 和开放 SDK 平台，已披露集成功能。
        - label: DR01
          x: 2
          'y': 3
          detail: 人形机器人产品已发布，但更广泛的 DR 系列在商业上仍处于探索阶段。
        - label: DR02
          x: 2
          'y': 3
          detail: 后续发布的人形机器人，但没有保留的产品级销售指标。
    approximationNotes: 分数是分析师序数，并非实测表现。商业成熟度依据已报道的发布和销售证据；工业专业化程度依据已披露的应用重点。由于分配来源池缺乏可比证据，未列竞争对手坐标。
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP006
      - CP007
      - CP009
      - CP015
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开证据从工业部署指向集中的硬件收入和改善中的利润率，而人形机器人变现仍处于早期。
    data:
      nodes:
        - id: workflows
          label: 工业巡检与应急流程
          detail: 公司材料描述了中国及海外的电力巡检、应急消防、安防巡逻、工业作业和科研教育用例。
          claimRefs:
            - CI002
        - id: products
          label: 机器人系列与组件
          detail: 当前商业产品栈包括四足机器人、轮腿式系统、人形机器人和核心机器人组件，并非单一 SKU 业务。
          claimRefs:
            - CI001
        - id: buyers
          label: 企业与公共部门部署
          detail: 官方部署案例以及海外 / 公用事业相关资料表明，公司采用项目制工业销售，而非自助式规模软件销售。
          claimRefs:
            - CI002
            - CI016
        - id: revenue
          label: 已确认的 2025 年硬件收入
          displayValue: RMB 337M+
          detail: 独立摘要报告称，2025 年收入约为 RMB 337 million，其中具身机器人占主营业务收入的 95.69%。
          claimRefs:
            - CI004
            - CI007
        - id: gross-profit
          label: 毛利转化
          displayValue: 52.82%-52.83% GM
          detail: 公开产品经济数据表明，X 系列工业系统的变现明显好于 Lite 系列。
          claimRefs:
            - CI006
            - CI008
            - CI009
        - id: humanoid-upside
          label: 未来人形机器人上行空间仍处早期
          detail: 公司相关发布描述了 2026 年商业部署，但独立分析称，在扩大规模之前，人形机器人销量仍然很小。
          claimRefs:
            - CI013
            - CI015
      edges:
        - from: workflows
          to: products
          label: 创造需求
          claimRefs:
            - CI002
        - from: products
          to: buyers
          label: 销售至
          claimRefs:
            - CI001
            - CI002
        - from: buyers
          to: revenue
          label: 转化为
          claimRefs:
            - CI004
            - CI007
        - from: revenue
          to: gross-profit
          label: 支持
          claimRefs:
            - CI006
            - CI008
        - from: gross-profit
          to: humanoid-upside
          label: 提供资金但不能证明
          claimRefs:
            - CI003
            - CI013
            - CI014
            - CI015
    approximationNotes: 这张图是公开证据逻辑图，而非量化瀑布图；它连接已观察到的部署、产品系列和已披露经济数据，不推断隐藏的转化率或经常性收入占比。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI006
      - CI007
      - CI013
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Deep Robotics 的公开产品栈从工业流程延伸到机器人形态、核心控制技术以及部署 / 支持层。
    data:
      layers:
        - label: 流程层
          detail: 公开材料将产品体系锚定在现场巡检、救援、隧道、物流和科研流程，而非泛化的机器人演示。
          modules:
            - 电力与公用事业巡检
            - 应急救援
            - 隧道与地下勘察
            - 物流与安防巡逻
            - 科研与教育
        - label: 机器人形态层
          detail: 产品阵容覆盖多种具身形态，而非单一旗舰 SKU。
          modules:
            - X20 / X30 / X50 工业四足机器人
            - LYNX M20 / M20 Pro / S10 轮腿式机器人
            - Lite3 科研四足机器人
            - DR01 / DR02 人形机器人
            - J60 / J80 / J100 关节组件
        - label: 核心技术层
          detail: 官方文案反复强调从感知到控制的技术栈，而不只是工业设计。
          modules:
            - 多模态环境感知
            - 跨场景具身导航
            - 集成式感知与运动控制
            - 自主地形识别
            - 自适应步态控制
        - label: 感知与计算层
          detail: 最详尽的公开产品页面披露了具体硬件、计算和接口模块。
          modules:
            - 双 96 线 LiDAR
            - 双广角摄像头
            - 双八核处理器
            - 72 V 电源输入
            - 千兆以太网
        - label: 部署层
          detail: 商业化取决于能否把硬件装进客户已经落地的工作流程。
          modules:
            - 载荷集成
            - 部署支持
            - 全生命周期支持
            - Robotics-as-a-Service 选项
          outputs:
            - 工业巡检
            - 危险场所作业
            - 科研部署
        - label: 信任与运营层
          detail: 公开支持入口已经存在，但运营证明仍比硬件叙事薄弱。
          modules:
            - 下载与资源中心
            - 常见问题与政策页面
            - 服务与故障声明
            - 没有公开正常运行时间或 SLA 指标
    claimRefs:
      - CE002
      - CE003
      - CE008
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公用事业巡检是切入口，邻近工业流程扩大装机基础，而人形机器人仍是早期的追加销售路径。
    data:
      items:
        - label: 公用事业切入口
          value: Power-grid operators
          touchpoints:
            - 变电站自主巡逻与故障巡检
            - State Grid / China Southern Power Grid 证明
          detail: 这是最明确的已命名生产场景，也是使用证据最强的场景。
        - label: 现场使用验证
          value: Operations teams
          touchpoints:
            - 100+ 座变电站
            - 累计巡检 1M+ 公里
          detail: 已发布的使用指标集中在公用事业流程，并未均匀分布到各行业。
        - label: 邻近工业扩张
          value: Infrastructure and plant operators
          touchpoints:
            - 隧道、石化、采矿和火电巡检
            - 危险场所进入与监控
          detail: 邻近场景扩大了用例版图，但大多数客户未具名，商业范围仍不清晰。
        - label: 公共安全与救援案例
          value: Emergency-response buyers
          touchpoints:
            - 地震演练
            - 火场侦察与危险气体检测
          detail: 这些案例强化了任务适配性，但更像场景证明，而非稳定的客户披露。
        - label: 科研与开发者铺设
          value: Universities and labs
          touchpoints:
            - Lite3 教育与机器人实验室定位
            - 开发者与科研应用
          detail: 科研场景扩大了认知，但尚不能证明企业变现深度。
        - label: 人形机器人扩张选项
          value: Future industrial upsell
          touchpoints:
            - 2026 年 DR02 商业部署口径
            - 独立证据仍显示 2025 年只售出 1 台人形机器人
          detail: 人形机器人是战略延伸，但目前还没有形成有意义的客户基础。
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
      - CU009
      - CU012
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 融资 / 披露和危险场景执行仍是最难消除的剩余风险，因为公开缓释措施落后于部署主张的规模。
    data:
      columns:
        - label: 可能性
          note: 分析师根据引用证据作出的评估
        - label: 影响
          note: 风险兑现后的下行空间
        - label: 缓释成熟度
          note: 关于控制措施的具体公开证据数量
        - label: 剩余敞口
          note: 本章缓释后的判断
      rows:
        - label: IPO 与融资执行
          note: 公开市场时点与披露深度
          values:
            - label: 中
              tone: medium
              note: IPO 指导和申报进展已公开，但详细经济数据没有公开。
            - label: 高
              tone: high
              note: 延误可能限制人形机器人扩张，或迫使公司接受更差的融资条款。
            - label: 中
              tone: medium
              note: 融资轮和已报道的盈利有所帮助，但不能替代申报细节。
            - label: 高
              tone: high
              note: 股权结构表、稀释和现金转化证据仍然缺失。
        - label: 危险场景可靠性与安全
          note: 洪水、电力、隧道和化工场景中的关键流程
          values:
            - label: 中
              tone: medium
              note: 公司已经将这些环境作为真实用例进行营销。
            - label: 高
              tone: high
              note: 现场故障会带来真实的运营和安全后果。
            - label: 中
              tone: medium
              note: 有部署证据，但公开的可靠性或认证数据不足。
            - label: 高
              tone: high
              note: 在服务和事故指标披露前，运营下行风险仍然偏高。
        - label: 售后与海外支持
          note: 已发布的支持条款仅覆盖中国大陆
          values:
            - label: 中
              tone: medium
              note: 海外扩张会增加服务缺口带来问题的可能性。
            - label: 中
              tone: medium
              note: 支持摩擦可能拖慢续约、压低利润率并影响客户背书质量。
            - label: 低
              tone: low
              note: 公开条款对限制的描述比对缓释措施的描述更清楚。
            - label: 高
              tone: high
              note: 投资者仍需要 SLA、备件和保修索赔证据。
        - label: 产品责任与合同分配
          note: 不退货条款与范围狭窄的免费保修覆盖
          values:
            - label: 中
              tone: medium
              note: 这些条款已经将若干故障情景的责任转回买方。
            - label: 高
              tone: high
              note: 有争议的现场故障可能同时打击声誉、利润率和客户续约。
            - label: 低
              tone: low
              note: 公开文件对免责条款的描述比对客户保护的描述更清楚。
            - label: 高
              tone: high
              note: 在审阅合同、保险和事故数据前，剩余敞口仍然偏高。
        - label: 客户与平台集中度
          note: 工业四足机器人仍主导可见的经济数据
          values:
            - label: 中
              tone: medium
              note: 已具名的公开合作伙伴基础有分量，但并不广泛。
            - label: 高
              tone: high
              note: 失去锚定买方或人形机器人未能实现多元化，会显著拖慢整体故事。
            - label: 中
              tone: medium
              note: 已有企业验证，但多元化证据有限。
            - label: 中高
              tone: high
              note: 在产品系列和客户组合披露扩大前，剩余集中度仍然偏高。
        - label: 一体化制造瓶颈
          note: 自主设计和制造同时放大速度优势与单点故障风险
          values:
            - label: 中
              tone: medium
              note: 需求或零部件冲击会同时影响多个产品系列。
            - label: 中高
              tone: high
              note: 爬坡延迟可能同时打击现有四足业务引擎和人形机器人扩张计划。
            - label: 中
              tone: medium
              note: 垂直整合是一项缓释措施，但这里没有公开的替代供应商证据。
            - label: 中高
              tone: high
              note: 在产能和质量指标披露前，剩余瓶颈风险仍然不容忽视。
    approximationNotes: 风险等级综合引用的公开证据得出，并非公司披露的评分。
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR008
      - CR009
      - CR011
      - CR012
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 公开证据支持继续尽调，但不足以支持不考虑价格的买入决定。
    data:
      nodes:
        - id: traction
          label: 工业证明
          detail: 电网、隧道、应急响应和工业部署显示出真实的现场落地。
          claimRefs:
            - CV004
            - CV005
        - id: capital
          label: 新增资本
          detail: 2025 年融资轮为四足机器人扩张、人形机器人研发和招聘提供资金。
          claimRefs:
            - CV001
            - CV009
        - id: liquidity
          label: IPO / 流动性路径
          detail: IPO 指导和二级市场准入改善了选择权，但没有改善价格发现。
          claimRefs:
            - CV002
            - CV003
            - CV014
        - id: opacity
          label: 价格不透明
          detail: 公开证据仍缺少当前估值、股权结构表条款和清晰的财务披露。
          claimRefs:
            - CV006
            - CV008
            - CV012
        - id: risk
          label: 扩张风险
          detail: 在商业证明透明之前，人形机器人扩张可能提高资本密集度。
          claimRefs:
            - CV007
            - CV010
            - CV013
        - id: call
          label: 建议：跟踪
          detail: 保持关注，但在投资判断买入前等待更好的证据或更清晰的入场条款。
          claimRefs:
            - CV012
            - CV014
      edges:
        - from: traction
          to: capital
          label: 支持
        - from: capital
          to: liquidity
          label: 改善
        - from: liquidity
          to: opacity
          label: 无法解决
        - from: opacity
          to: risk
          label: 放大
        - from: risk
          to: call
          label: 使立场保持在
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV008
      - CV012
      - CV013
      - CV014
