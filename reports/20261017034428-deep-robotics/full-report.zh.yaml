      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              核心正面因素是，Deep Robotics 已从机器人叙事跨过了真实工业收入、首次盈利和可信产品级 ASP
              证据的门槛。核心负面因素是，下一阶段要求投资者在披露不完整的情况下判断资本强度和执行力：一项独立分析认为人形机器人销售仍微不足道，同一来源指出在激进扩张计划下利用率低于 80%，而 EquityZen
              明确只向获认证的私募市场用户提供更深层的股权结构、收入 /
              财务和风险因素材料。实际而言，公开投资者能够看到增长和产品经济性，却看不到决定今日毛利率改善能否经受产能建设和人形机器人扩张的现金转化、集中度、优先股堆叠或服务负担。正确的财务结论是：“商业化真实，但尚不足以作出透明的投资判断。”[CI005][CI012][CI013][CI016]
