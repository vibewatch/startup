  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-transparency
      missingEvidence: Current valuation, fully diluted ownership, share-class stack, liquidation preferences, anti-dilution terms, and any VAM or special-rights mechanics.
      whyItMatters: Without the current pricing stack and downside protections, investors cannot judge whether apparent growth is already overcapitalized or whether preferred terms disadvantage new money.
      diligencePath: Request the latest financing memo, cap table by share class, signed term sheet, and board materials covering IPO-linked rights.
      relatedQuestionRefs: [QV008]
    - type: private-evidence-only
      severity: material
      topic: operating-quality
      missingEvidence: Revenue by product family, gross margin by hardware versus service, repeat-order cohorts, backlog, warranty burden, and field-service economics.
      whyItMatters: The valuation debate depends on whether quadruped traction converts into durable, higher-quality earnings rather than one-off hardware deployments.
      diligencePath: Request monthly management KPIs, segment P&L, cohort retention, and customer concentration analysis for the past 18 months.
      relatedQuestionRefs: [QV003, QV005, QV007]
    - type: missing-source
      severity: material
      topic: commercialization-proof
      missingEvidence: Independent verification of DR02 commercial deployments, shipped-unit counts, realized pricing, and the commercial mix between quadruped and humanoid programs.
      whyItMatters: The upside case depends on commercialization breadth, but current public support for humanoid monetization is still dominated by company-issued materials.
      diligencePath: Ask for signed customer references, shipped-unit history, and independently sourced case studies by product family.
      relatedQuestionRefs: [QV001, QV005]
