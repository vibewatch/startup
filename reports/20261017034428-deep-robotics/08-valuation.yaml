company:
  name: Deep Robotics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Deep Robotics now has credible industrial deployment proof, fresh financing, and a live IPO path, but
    the public record still does not disclose a current private valuation, cap-table terms, or a revenue and
    profitability bridge strong enough to underwrite a buy call. The right public-evidence posture remains
    track with medium confidence and a stretched valuation stance until price discovery and operating disclosure
    catch up with the company’s commercialization narrative.
sections:
  - id: recommendation
    title: Recommendation and underwriting posture
    body: >-
      The evidence supports continued engagement, but not an aggressive entry posture. On the positive side,
      Deep Robotics has fresh capital, multiple reported industrial deployments, and an expanding product set
      that now spans quadruped, wheel-legged, and humanoid platforms. Those points matter because they show
      the company is no longer only an R&D story. However, the public record is still missing the variables
      that determine whether a private round or secondary price is attractive: the current valuation, the
      preference stack, the dilution path, and a clean bridge from product traction to durable earnings power.
      That makes the correct recommendation track rather than buy. The company may be improving fundamentally,
      but without disclosed pricing terms and operating-quality metrics, investors would be paying for option
      value without being able to check whether the option is already fully priced.
    claimRefs: [CV001, CV002, CV005, CV006, CV008, CV012, CV014]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-context
    title: Financing context, price support, and entry discipline
    body: >-
      The latest financing and IPO signals improve financing optionality, but they do not establish fair
      value. Yicai and Tech in Asia both report a roughly CNY500 million funding round in 2025, while Tech in
      Asia and Humanoids Daily point to A-share IPO guidance and a completed shareholding reform consistent
      with listing preparation. EquityZen adds a useful market signal because it shows that private secondary
      liquidity exists, yet the public-facing page keeps the cap table, funding history by share class,
      liquidity preferences, and financials behind accreditation and login gates. In practice, that means
      public investors can observe demand for access, but not the information needed to judge whether a quoted
      secondary mark is clean or burdened by preference overhang. Entry discipline therefore has to stay
      conservative: no stretching on a narrative premium until management provides current valuation and term
      transparency.
    claimRefs: [CV001, CV002, CV003, CV008, CV009, CV012, CV014]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenario framing and comparable lens
    body: >-
      The bull case is that Deep Robotics turns today’s industrial foothold into a scaled embodied-AI
      platform before the public market window closes, using fresh capital to broaden the product line and
      convert more inspection, utility, and emergency-response deployments into repeatable programs. The base
      case is more restrained: quadruped demand continues, but the public record remains too thin on segment
      margins, repeat orders, and service mix to justify premium private-market pricing. The bear case is not
      that the company lacks technology; it is that humanoid expansion and IPO preparation absorb capital
      faster than disclosed commercial metrics mature. Public comparable evidence is also incomplete. A
      third-party industry analysis frames Deep Robotics against Boston Dynamics, ANYbotics, and Unitree, and
      Humanoids Daily explicitly places it behind Unitree in scale, but that still falls short of a true
      valuation comp set because Deep itself has not disclosed audited revenue, profit, or unit-shipment
      detail.
    claimRefs: [CV004, CV005, CV006, CV007, CV010, CV011, CV013]
    tableRefs: [TV003]
  - id: diligence-asks
    title: Final diligence asks and thesis-break triggers
    body: >-
      The remaining diligence agenda is straightforward and high leverage. First, request the latest priced
      round documents, share-class stack, liquidation preferences, anti-dilution mechanics, and any VAM or
      special rights tied to the IPO timeline. Second, request operating data that can separate real
      commercialization from headline momentum: revenue by product family, gross margin by hardware versus
      service, repeat-order cohorts, backlog, customer concentration, warranty costs, and field-service
      burden. Third, ask management to reconcile the commercialization story around DR02 and Lynx with actual
      shipped units, signed contracts, and realized pricing. The thesis breaks if IPO timing slips without a
      corresponding increase in disclosure, if humanoid investment outpaces monetization in the core
      quadruped business, or if customer traction proves too concentrated to support premium private-market
      pricing.
    claimRefs: [CV002, CV004, CV006, CV008, CV012, CV013, CV014]
