      - ["Thesis", "The 2025 funding round and IPO-guidance process show that capital access and a possible liquidity path are live rather than hypothetical.", "A verified exchange filing or disclosed round terms would make the financing signal underwriteable."]
      - ["Anti-thesis", "Public evidence still does not disclose current valuation, cap-table structure, liquidation preferences, or audited revenue and profit.", "A current pricing memo, board-approved cap table, or public filing would materially reduce this objection."]
      - ["Anti-thesis", "Humanoid and broader embodied-AI expansion may consume capital before the quadruped business is transparently cash-generative.", "Segment margins, shipped-unit data, and evidence of profitable recurring service revenue would ease the concern."]
    notes: The table separates underwriting positives from price-sensitive blockers; missing private-market terms remain the core gap.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV008, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Quadruped deployments compound, DR02 converts into real industrial contracts, and IPO-readiness disclosures bring cleaner price discovery.", "Could support a premium private-growth robotics mark, but only if disclosed revenue quality and terms validate the premium.", "Humanoid commercialization stalls or the IPO window closes before disclosures improve.", "Needs new evidence; not yet the public base case."]
      - ["Base", "Core quadruped business keeps growing and financing optionality remains open, but disclosures stay partial on valuation, margins, and customer quality.", "Best treated as a track position where investors wait for either better evidence or more attractive entry terms.", "Narrative premium outruns fundamentals; private terms remain investor-unfriendly.", "Most consistent with current public evidence."]
      - ["Bear", "Humanoid expansion absorbs cash, IPO timing slips, and commercial traction proves narrower or more concentrated than the marketing narrative suggests.", "Would merit a discount to premium robotics peers or a pass until the company resets price and transparency.", "Private-round pricing stays high despite weakening disclosure or delayed liquidity.", "Cannot be dismissed because several key metrics remain undisclosed."]
    notes: Scenario logic is qualitative because public sources do not disclose a current valuation mark, term sheet, or audited operating bridge.
    claimRefs: [CV002, CV004, CV006, CV008, CV010, CV011, CV012, CV013, CV014]
