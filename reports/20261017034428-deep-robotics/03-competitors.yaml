    summary: >-
      Analyst ordinal map of commercial maturity (x, 1 low to 5 high) against industrial
      specialization (y, 1 broad/research to 5 mission-specific), limited to products evidenced
      in the assigned pool.
    data:
      points:
        - label: Jueying X series
          x: 5
          y: 5
          detail: "681 units and 58.11% of 2025 revenue provide the strongest commercial signal."
        - label: LYNX M20
          x: 4
          y: 4
          detail: "Released in 2025 and positioned for industry-grade wheeled-legged applications."
        - label: LYNX
          x: 3
          y: 4
          detail: "A 2026 product release with all-terrain positioning but no retained sales metric."
        - label: Lite3
          x: 4
          y: 2
          detail: "Research-oriented ROS2 and open-SDK platform with disclosed integration features."
        - label: DR01
          x: 2
          y: 3
          detail: "Humanoid product release, while the broader DR series remained exploratory commercially."
        - label: DR02
          x: 2
          y: 3
          detail: "Later humanoid release without a retained product-level sales metric."
    approximationNotes: >-
      Scores are analyst ordinals, not measured performance. Commercial maturity uses reported
      release and sales evidence; industrial specialization uses disclosed application focus.
      Rival coordinates are omitted because the assigned pool lacks comparable evidence.
    claimRefs: [CP002, CP003, CP004, CP006, CP007, CP009, CP015]
