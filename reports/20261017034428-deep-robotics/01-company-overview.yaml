  evidenceGaps:
    - type: missing-source
      severity: material
      topic: governance
      missingEvidence: Public board roster, named non-founder executives, and committee/oversight structure.
      whyItMatters: Governance quality and key-person concentration cannot be judged from product and financing materials alone.
      diligencePath: Request the current board list, executive roster, and any post-Series-C governance deck directly from management.
      relatedQuestionRefs: [QO002, QO008]
      relatedTableRefs: [TO002]
    - type: private-evidence-only
      severity: material
      topic: private-operating-metrics
      missingEvidence: Customer count, headcount, revenue/run-rate, and location-count disclosures.
      whyItMatters: These are core cover metrics for judging scale quality, operating leverage, and readiness for later-stage financing or IPO prep.
      diligencePath: Request the latest management KPI pack or audited monthly reporting that breaks out customers, headcount, and revenue.
      relatedQuestionRefs: [QO003]
    - type: private-evidence-only
      severity: material
      topic: valuation-and-cap-table
      missingEvidence: Post-money valuation, investor ownership, liquidation preferences, side-letter rights, debt, and secondary-volume details.
      whyItMatters: Stakeholder importance and financing quality cannot be translated into ownership economics without cap-table terms.
      diligencePath: Obtain the latest cap table, Series C term sheet, shareholder register, and any secondary transaction summary.
      relatedQuestionRefs: [QO004, QO008]
      relatedTableRefs: [TO003]
    - type: stale
      severity: material
      topic: listing-status
      missingEvidence: Current confirmation of whether any planned IPO process advanced, paused, or ended after the pre-IPO marketplace signals in retained sources.
      whyItMatters: Stage and financing strategy affect governance expectations, disclosure discipline, and valuation framing.
      diligencePath: Verify current listing plans, guidance status, and underwriter/adviser mandates directly with the company or lead investors.
      relatedQuestionRefs: [QO008]
    - type: missing-source
      severity: minor
      topic: milestone chronology
      missingEvidence: A fuller dated pre-2025 chronology covering earlier financings, major customer wins, and product milestones.
      whyItMatters: The chapter can show recent traction, but it cannot yet show a long, evenly dated operating history.
      diligencePath: Pull archived company news, earlier financing announcements, and older third-party coverage into the next refresh.
      relatedQuestionRefs: [QO005]
