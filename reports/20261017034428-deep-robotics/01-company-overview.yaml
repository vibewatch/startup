company:
  name: Deep Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Deep Robotics is a 2017-founded Hangzhou embodied-AI robotics company whose
    official materials position it across quadruped, wheeled-legged, and
    humanoid systems, with management claiming deployments across all
    provincial-level regions in China and 44 overseas countries/regions. The
    clearest hard datapoint in the assigned pack is a December 2025 Series C of
    more than RMB 500 million led by CMB International and ChinaAMC, while
    board composition, customer count, headcount, valuation, and current IPO
    status remain under-disclosed.
sections:
  - id: identity-stage
    title: Identity, footprint, and stage
    body: |-
      Deep Robotics presents itself as an embodied-AI robotics company focused on industrial and hazardous-environment deployments rather than a pure research lab. Across official Chinese and US-facing pages, the company describes a product set spanning quadruped robots, humanoid robots, and core robotic systems, while the US site highlights current quadruped use cases in industrial inspections, emergency response, underground navigation, and scientific research. The assigned sources support a 2017 founding date and a Hangzhou base, but they do not support reader-grade precision on customer count, headcount, revenue, or locations beyond the company-reported footprint.

      The strongest scale statement in the retained pack is management's December 2025 claim that the company had already reached all 34 provincial-level regions in China and 44 countries/regions overseas. That is useful as a commercialization signal, but it is still company-issued evidence and should not be treated as the same thing as independently benchmarked installed-base data. On stage, the assigned evidence supports "private / pre-IPO marketplace tracked" more than it supports any active public-listing conclusion: EquityZen offers Deep Robotics as a pre-IPO name with shareholder-liquidity infrastructure, but the pack does not confirm a filed prospectus, a completed exchange process, or a current valuation.
    claimRefs: [CO001, CO002, CO003, CO006, CO015]
    tableRefs: [TO001]
  - id: leadership-governance
    title: Leadership disclosure, founder-market fit, and governance gaps
    body: |-
      Public leadership disclosure in the assigned evidence is narrow. The clearest named executive is Zhu Qiuguo, identified in the financing announcement as founder and CEO, while the other retained materials describe the founding team and wider technical bench more generically. EquityZen says the founding team is rooted in Zhejiang University, and the US about page says the disclosed core team spans universities including Zhejiang University, Shanghai Jiao Tong University, Beijing Institute of Technology, Wuhan University, NYU, UIUC, Georgia Tech, and Dortmund University of Technology. That is supportive of founder-market fit in legged robotics and autonomy, but it is not a substitute for a full executive roster or board map.

      Governance is therefore a real diligence gap at this stage. None of the assigned sources disclose a board list, committee structure, or named non-founder executives beyond the founder/CEO reference, which increases key-person concentration in the public record. The same gap matters for financing diligence because the company is clearly scaling into a more institutional shareholder base, yet the retained evidence does not show who currently governs investor rights, how oversight is structured, or whether post-Series-C reporting discipline has matured alongside commercialization.
    claimRefs: [CO001, CO003, CO004, CO010]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital formation and stakeholder map
    body: |-
      The best-supported financing event in the pack is the December 2025 Series C. Deep Robotics said it raised more than RMB 500 million, with CMB International and ChinaAMC as joint lead investors and strategic participation from China Telecom- and China Unicom-affiliated funds. The same release named a long list of new and existing backers, which matters because it suggests the round was not just financial but also ecosystem-oriented: telecom-linked funds, industrial investors, and prior robotics-focused capital all appear in the roster.

      Even so, the evidence still stops well short of a full cap-table view. The assigned sources do not disclose post-money valuation, preference terms, liquidation protections, secondary volume, debt facilities, or whether any investor has governance or distribution rights beyond ordinary equity ownership. That means the stakeholder map is directionally useful for understanding who matters around the company, but it is not yet a substitute for a diligence-grade ownership model.
    claimRefs: [CO003, CO007, CO008, CO009]
    tableRefs: [TO003]
  - id: milestones-risks
    title: Recent milestones and the main adverse signal in the pack
    body: |-
      The retained milestone evidence clusters in 2025-2026 and shows a company trying to expand beyond a single robot form factor. Management said 2025 included the launch of the Lynx M20 wheeled-legged platform, the unveiling of the DR02 industrial humanoid, the establishment of an embodied-AI pilot production base, and completion of shareholding-system reform by the time of the December 2025 financing announcement. A July 2026 paid WAIC release then claimed that DR02 had already passed substation precision-operation tests and entered commercial deployment for power inspection, hazardous chemical operations, and disaster rescue. Together, those milestones imply an active move from quadruped inspection roots toward broader embodied-AI system commercialization.

      The main adverse signal in the assigned pool is not litigation or regulator action; it is perception risk. The retained Reddit thread repeatedly frames the robot platform as a likely military or social-control tool, showing how advanced mobility demos can trigger dual-use anxiety even when official materials emphasize industrial inspection, rescue, and research applications. That does not prove a commercial problem today, but it is a credible reputational watchpoint because dual-use perception can shape customer, regulator, and export-control scrutiny faster than it shows up in formal legal disclosures.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
