company:
  name: Deep Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Deep Robotics' evidenced market is narrower than the broad embodied-AI narrative: the assigned pool points first to industrial inspection, public-safety, and hazardous-field deployments, with research and education as an adjacency rather than the 2025 revenue core. The chapter can bound adoption with company-specific revenue, deployment, and procurement lenses, but it cannot support a defensible external TAM/SAM/SOM without overstating what the assigned evidence proves.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: |-
      The assigned pool supports a clear market boundary before any sizing exercise: Deep Robotics is not best understood as a generic "humanoid" or broad embodied-AI vendor, but as a legged-robotics company whose monetized wedge is industrial field work. Hello China Tech's prospectus-based analysis says industry applications generated 79.33% of 2025 main business revenue, and it lists power-grid inspection, emergency firefighting, police and security operations, industrial monitoring, infrastructure patrol, and logistics as the paid use cases. Company-issued pages expand the adjacency set to energy, emergency response, industrial operations, manufacturing, infrastructure, education, and research, which is consistent with a product stack spanning industrial quadrupeds, wheeled-legged systems, and early humanoids. The main substitutes are therefore status-quo human patrols and hazardous-site inspection workflows, plus adjacent research/education platforms, not the entire robotics hardware market. Research and education remain relevant because the Lite3 line keeps a non-industrial entry point in the portfolio, but the evidence does not justify treating that adjacency as the same budget pool as industrial deployments.
    claimRefs: [CM001, CM002, CM003, CM014]
    tableRefs: [TM001]
  - id: buyers-and-adoption
    title: Buyer map and adoption path
    body: |-
      The buyer map in the assigned pool is more concrete than a generic robotics narrative. Utilities and infrastructure owners appear as core buyers for inspection workflows; public-safety and emergency organizations appear as buyers for hazardous reconnaissance; and industrial operators or security teams appear as buyers for patrol, monitoring, and logistics-adjacent use cases. The company repeatedly frames adoption around places where human entry is difficult, dangerous, or slow, while independent reporting adds evidence that the installed base is moving beyond one-off demos into repeatable procurement. Hello China Tech cites cumulative deployment counts above 300 in both power inspection and police/security, more than 150 in fire rescue, and about 300 in industrial settings, while the company says its systems now package six sector solutions refined from more than 1,200 scenarios. That combination implies an adoption path in which a buyer first approves a risk-reduction use case, then standardizes procurement once a robot proves mobility, sensing, and reliability in a narrow workflow rather than across a broad labor category.
    claimRefs: [CM002, CM005, CM006, CM007, CM008]
    tableRefs: [TM003]
  - id: sizing-and-constraints
    title: Sizing lenses, drivers, and constraints
    body: |-
      The strongest sizing evidence is company-specific and must be treated as a bounded lens rather than a market-total claim. The pool shows RMB 267.3 million of 2025 industry-application revenue, 681 X-series industrial quadrupeds sold at roughly RMB 287.5k each, and a 2026 Q1 snapshot of more than RMB 110 million in revenue with RMB 235 million of orders on hand. Those figures demonstrate a real, monetized wedge, and they explain why the company can pursue an IPO and keep funding humanoid expansion. But the same evidence also highlights the constraints that matter for valuation: the buyer base is narrower than consumer or research hardware, sales cycles are longer, safety-critical deployments require reliability in harsh environments, and the company's move into humanoids increases capital needs before that segment is equally proven. Tech in Asia's procurement examples help show that public and utility buyers can carry meaningful unit budgets, yet the assigned pool still does not provide a defensible third-party TAM/SAM/SOM or an independently reconciled spend model by geography and segment. Adoption is therefore best viewed as a hazardous-workflow automation market with credible proof of demand, but incomplete evidence on how large the reachable budget pool becomes outside today's proven niches.
    claimRefs: [CM001, CM004, CM007, CM009, CM010, CM011, CM012, CM013]
    tableRefs: [TM002]
    figureRefs: [FM001]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Industrial inspection / utilities
        - Quadruped or wheeled-legged systems for power inspection, substations, tunnels, and industrial patrol routes
        - Generic humanoid R&D, unrelated factory automation, and broad enterprise AI software
        - Utility operators, infrastructure owners, and industrial O&M teams
        - Core monetized wedge evidenced by filing-derived revenue mix and deployment narratives
      - - Emergency response / public safety
        - Firefighting reconnaissance, flood response, confined-space scouting, and public-security patrol
        - Standard manned rescue equipment unless legged robots replace unsafe first entry
        - Fire departments, emergency managers, and public-security operators
        - Hazardous-entry use cases align with the safety-substitution logic in the assigned pool
      - - Industrial operations / logistics-adjacent monitoring
        - Hazardous chemical operations, industrial monitoring, logistics patrol, and security routes
        - Indoor AMRs and general warehouse automation without legged mobility requirements
        - Industrial site managers, safety teams, and security operators
        - Adjacent expansion from the inspection base rather than a separate core category
      - - Research / education
        - Lite3 and research deployments for labs, universities, and robotics developers
        - Mass-consumer entertainment demand
        - Universities, research labs, and departmental equipment budgets
        - Useful adjacency and developer funnel, but not evidenced as the main 2025 revenue engine
    notes: >-
      Boundary logic separates Deep Robotics' evidenced industrial and hazardous-field applications from broader embodied-AI or general robotics spending categories that the assigned pool does not quantify directly.
    claimRefs: [CM001, CM002, CM003, CM014]
  - id: TM002
    title: "TAM / SAM / SOM replacement: observable sizing lenses"
    columns:
      - Publisher
      - Year
      - Geography
      - Value / metric
      - CAGR / growth
      - Methodology lens
      - Confidence
      - Limitation
    rows:
