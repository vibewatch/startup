        - "2025"
        - Company mix with global ranking references
        - 79.33% of main business revenue from industry applications; RMB 267.3m from industry applications
        - 159.51% revenue CAGR from 2023 to 2025
        - Prospectus-derived revenue mix and disclosed downstream application breakdown
        - Medium
        - Company-specific revenue lens, not external TAM
      - - Hello China Tech
        - "2025"
        - Company deployment base
        - ">300 power inspection; >300 police/security; >150 fire rescue; ~300 industrial settings"
        - null
        - Cumulative deployment counts summarized from filing interpretation
        - Medium
        - Use-case volumes may overlap and are not independently audited end-use counts
      - - DEEP Robotics via GlobeNewswire
        - "2026"
        - Product-to-solution expansion
        - Six standardized solutions; over 1,200 real scenarios
        - null
        - Company event disclosure from WAIC 2026
        - Medium
        - Scenario breadth is not a spend measure
      - - China Robotics Insider / RobotiChina
        - "2025-2026"
        - Company operating snapshot
        - 681 X-series units in 2025; RMB 196m X-series revenue; ~RMB 287.5k ASP; RMB 110m+ Q1 2026 revenue; RMB 235m orders on hand
        - "+250% YoY for Q1 2026 revenue"
        - Secondary database summary of operating and filing figures
        - Low
        - Secondary aggregation, not a primary market census
      - - Tech in Asia
        - "2026"
        - Chinese utility procurement example
        - Shenzhen Water posted a 458,600 yuan cap for one quadruped unit
        - null
        - Public procurement anecdote cited in a news analysis
        - Medium
        - One-unit budget example, not a market-average price
    notes: >-
      These rows are intentionally non-additive and mix revenue, deployment, scenario, price, and procurement-budget lenses because the assigned pool does not support a defensible TAM/SAM/SOM stack.
    claimRefs: [CM001, CM004, CM007, CM008, CM012]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Power inspection
        - State-grid or other utility operators
        - Inspection crews and asset-reliability teams
        - Utility O&M budgets
        - Substation, tunnel, and grid patrol
        - Asset reliability / O&M leadership
        - Hazardous environments, inspection coverage, and site-efficiency gains
      - - Emergency response / firefighting
        - Fire departments and emergency-management agencies
        - First responders and command staff
        - Public-safety or emergency-response budgets
        - Flood, landslide, mine, tunnel, and disaster reconnaissance
        - Emergency management command
        - Unsafe human first entry and poor visibility or communications
      - - Public security / industrial operations
        - Police, security operators, industrial facilities, and infrastructure managers
        - Patrol staff, safety teams, and industrial operators
        - Public-security or site-operations budgets
        - Security patrol, industrial monitoring, and hazardous-site logistics support
        - Site operations or security leadership
        - Need for persistent patrol in difficult terrain or risky environments
      - - Research / education
        - Universities, labs, and robotics developers
        - Researchers, students, and engineers
        - R&D or lab-equipment budgets
        - Robotics experimentation, locomotion AI, and teaching
        - Principal investigators or departmental purchasers
        - Lower-cost development platform with open SDK and ROS2 compatibility
    notes: >-
      Budget ownership is inferred from the cited buyer types and workflows in the assigned pool; it should be validated directly in diligence because no assigned source provides a full procurement-org map.
    claimRefs: [CM003, CM005, CM006, CM008, CM014]
figures:
  - id: FM001
    title: Observable market layers from scenario breadth to monetized industrial demand
    type: pyramid
    summary: >-
      The assigned pool supports bounded adoption layers rather than a true TAM/SAM/SOM stack, so the pyramid shows non-additive indicators from scenario breadth to monetized deployment.
    data:
      nodes:
        - label: Scenario library
          value: "1,200+ scenarios"
          detail: WAIC 2026 company disclosure said six sector solutions were refined from over 1,200 real scenarios.
          claimRefs: [CM007]
        - label: Power inspection installed base
          value: ">300 robots"
          detail: Filing-derived coverage said cumulative power-inspection deployments exceeded 300 robots.
          claimRefs: [CM008]
        - label: Police/security installed base
          value: ">300 robots"
          detail: The same filing-derived lens cited more than 300 cumulative police/security robots.
          claimRefs: [CM008]
        - label: Industrial-settings installed base
          value: "~300 robots"
          detail: Hello China Tech described approximately 300 cumulative robots in industrial settings.
          claimRefs: [CM008]
        - label: Fire-rescue installed base
          value: ">150 robots"
          detail: Hello China Tech cited more than 150 cumulative fire-rescue robots.
          claimRefs: [CM008]
        - label: Industrial quadruped monetization
          value: "RMB 287.5k ASP"
          detail: Hello China Tech and RobotiChina both point to roughly RMB 287.5k average selling price for 2025 X-series units.
          claimRefs: [CM004]
    approximationNotes: >-
      Layers mix scenario count, cumulative installed units, and average selling price, so they are intentionally non-additive and should be read as observable market lenses rather than a mathematically nested TAM/SAM/SOM model.
    claimRefs: [CM004, CM007, CM008]
callouts:
  - calloutType: insight
    title: Proven wedge, incomplete market total
    body: >-
      The assigned pool shows real industrial demand for hazardous-workflow automation, but valuation still depends on whether repeat procurement broadens beyond today's proven inspection, emergency-response, and patrol niches.
    claimRefs: [CM001, CM004, CM011, CM012]
