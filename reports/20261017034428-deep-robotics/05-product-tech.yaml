    title: Product module / asset matrix
    columns:
      - Module / product line
      - Primary user / workflow
      - Status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - ["X-series industrial quadrupeds (X20/X30/X50)", "Utilities, patrol, and industrial inspection", "Field-proven industrial line in third-party profiles", "Rugged industrial positioning rather than demo-only mobility", "Public fleet uptime and service-interval data not disclosed"]
      - ["LYNX M20 / M20 Pro wheeled-legged line", "Hazardous-site inspection, logistics, and rescue scouting", "Newer but spec-rich launch line with industrial claims", "Combines wheel speed and leg agility with IP66 hardening", "Need production deployment counts and failure-rate data"]
      - ["LYNX S10 wheeled-legged line", "Lightweight rescue and scouting", "Recently surfaced product expansion", "Smaller form factor extends wheeled-legged coverage", "Need pricing, payload, and customer proof"]
      - ["Lite3 research quadruped", "Universities, labs, and developer workflows", "Mature enough for public SDK and ROS2 positioning", "Open SDK and research orientation broaden ecosystem reach", "Need actual package/API docs and community telemetry"]
      - ["DR01 / DR02 humanoids", "Hazardous-environment manipulation and inspection", "Early commercialization phase versus core quadruped business", "Extends industrial platform into bipedal form factor", "Need named multi-unit deployments and duty-cycle evidence"]
      - ["J60 / J80 / J100 actuator joints", "Robotics OEM and component buyers", "Component line disclosed but not deeply documented", "Indicates partial verticalization beyond end robots", "Need standalone component specs, customers, and volumes"]
    notes: >-
      Mixes official and third-party product surfaces; maturity reflects what is publicly
      evidenced in the assigned pool, not audited shipment or revenue by line.
    claimRefs: [CE001, CE003, CE004, CE006, CE007, CE011, CE013]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow pain
      - Company solution
      - Measurable benefit claimed
      - Limitation
    rows:
      - [Power and utility inspection, Hazardous repetitive inspection in rough terrain and low-light environments, X-series quadrupeds and LYNX wheeled-legged robots, Safer remote inspection with obstacle avoidance terrain traversal and lighting, No public ROI cycle-time or false-positive metrics]
      - [Emergency rescue and disaster response, Human responders face collapse debris heat and signal-loss zones, LYNX line plus newer rescue-oriented robots and DR02, Access to narrow debris gaps scouting and hazardous-site entry, Public proof is mostly company-authored and scenario-based]
      - [Tunnel underground and confined-space scouting, GPS-denied spaces unstable footing and communication challenges, Industrial quadrupeds for tunnel inspection and patrol, Mobility across tunnels stairs and uneven ground, No public autonomy edge-case statistics or communications architecture]
      - [Research and education, Labs need programmable locomotion platforms with sensors and SDKs, Lite3 research platform, ROS2 compatibility plus open SDK and sensor support, No public package docs release cadence or contributor metrics]
    notes: >-
      Benefit statements reflect claimed technical or operational advantages from the assigned
      pool; hard customer outcome denominators are mostly unavailable.
    claimRefs: [CE004, CE007, CE009, CE013, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Perception layer, Multimodal environmental perception and terrain sensing, LiDAR cameras and environment-modeling software, Sensor fusion robustness and calibration are not publicly benchmarked]
      - [Decision and control layer, Cross-scenario navigation gait switching and integrated sensing-motion control, Locomotion algorithms onboard compute and field tuning, No public autonomy safety case or exception-handling detail]
      - [Robot hardware and compute layer, Wheeled-legged or quadruped mobility with onboard processors batteries and communications, Joint actuators power system thermal performance and ruggedization, MTBF maintenance intervals and spare-part assumptions are undisclosed]
      - [Deployment and support layer, Payload integration deployment service and lifecycle support, Channel/partner execution and customer implementation resources, No public SLA status page API surface or warranty metrics]
    notes: >-
      This is an operating architecture synthesis from the assigned pool rather than an official
      block diagram; risks emphasize what the public material does not yet evidence.
    claimRefs: [CE002, CE005, CE006, CE008, CE014, CE015]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Deep Robotics’ public product stack runs from industrial workflows to robot forms, core control technologies, and deployment/support wrappers.
    data:
      layers:
        - label: Workflow layer
          detail: Public materials anchor the product set in field inspection, rescue, tunneling, logistics, and research workflows rather than generic robotics demos.
          modules:
            - Power and utility inspection
            - Emergency rescue
            - Tunnel and underground scouting
            - Logistics and security patrol
            - Research and education
        - label: Robot form layer
          detail: The lineup spans multiple embodiment choices rather than a single flagship SKU.
          modules:
            - X20 / X30 / X50 industrial quadrupeds
            - LYNX M20 / M20 Pro / S10 wheeled-legged robots
            - Lite3 research quadruped
            - DR01 / DR02 humanoids
            - J60 / J80 / J100 joint components
        - label: Core technology layer
          detail: Official copy repeatedly centers a perception-to-control stack rather than only industrial design.
          modules:
            - Multimodal environmental perception
            - Cross-scenario embodied navigation
            - Integrated sensing and motion control
            - Autonomous terrain recognition
            - Adaptive gait control
        - label: Sensing and compute layer
          detail: The most detailed public product page discloses specific hardware, compute, and interface building blocks.
          modules:
            - Dual 96-line LiDAR
            - Dual wide-angle cameras
            - Dual octa-core processors
            - 72 V power input
            - Gigabit Ethernet
        - label: Deployment layer
          detail: Commercialization depends on packaging the hardware into implemented customer workflows.
          modules:
            - Payload integration
            - Deployment support
            - Lifecycle support
            - Robotics-as-a-Service options
          outputs:
            - Industrial inspection
            - Hazardous-site operations
            - Research deployments
        - label: Trust and operations layer
          detail: Public support entry points exist, but operational proof remains thinner than the hardware story.
          modules:
            - Downloads and resource centre
            - FAQs and policy pages
            - Service and fault declaration
            - No public uptime or SLA metrics
    claimRefs: [CE002, CE003, CE008, CE014]
callouts:
  - calloutType: strength
    title: Industrial-first positioning is real
    body: >-
      The assigned evidence is strongest where Deep Robotics ties locomotion to inspection,
      rescue, tunnel, and other hazardous industrial workflows. That is a better maturity signal
      than pure humanoid narrative, because it implies buyer pain, deployment context, and at
      least some service wrapper already exist around the robots.
    claimRefs: [CE009, CE010, CE013]
  - calloutType: risk
    title: Public trust and integration proof still lags the hardware story
    body: >-
      The official surfaces show product breadth and some support navigation, but they do not
      provide diligence-grade public proof on API/integration detail, uptime, warranty, security,
      or compliance. That leaves a material gap between a compelling field-robot demo story and
      a fully underwritten enterprise or regulated-operations platform story.
    claimRefs: [CE008, CE015, CE016]
