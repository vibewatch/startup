  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-and-compliance
      missingEvidence: Public security architecture, privacy posture, software-update governance, certification set beyond IP66, and any incident or vulnerability disclosure process.
      whyItMatters: Buyers using robots in utilities, rescue, or hazardous sites need to understand cyber, safety, and compliance controls before scaling fleet deployments.
      diligencePath: Request security whitepapers, product certification records, update-policy documents, and any internal incident postmortems or external audit summaries.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: integration-and-support
      missingEvidence: Public API references, payload SDK documentation, reference integration architectures, warranty terms, MTBF, and uptime or service-response metrics.
      whyItMatters: Without implementation and service evidence, it is difficult to underwrite deployment friction, support burden, and total cost of ownership.
      diligencePath: Ask for customer implementation packs, API/SDK manuals, field-maintenance schedules, warranty schedules, and service KPI dashboards.
      relatedQuestionRefs: [QE004, QE007]
      relatedTableRefs: [TE002, TE003]
    - type: private-evidence-only
      severity: material
      topic: manufacturing-and-reliability
      missingEvidence: Production yields, actuator and battery supplier dependencies, spare-part assumptions, field failure rates, and warranty-return statistics by product line.
      whyItMatters: Deep Robotics’ differentiation depends on ruggedized industrial execution, which can be undermined by fragile supply or poor real-world reliability.
      diligencePath: Request reliability test reports, warranty cohorts, supplier concentration data, and service logs by robot family and geography.
      relatedQuestionRefs: [QE007]
      relatedTableRefs: [TE001, TE003]
