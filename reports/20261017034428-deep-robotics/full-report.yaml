          - type: callout
            title: Ask for the private underwriting pack before taking valuation comfort from 2025 profit
            body: >-
              Management should provide cash, burn, backlog quality, customer concentration, warranty burden, preference
              terms, and realized discounting by product line before investors rely on the public gross-margin and
              revenue trajectory as durable.
            calloutType: recommendation
            claimRefs:
              - CI003
