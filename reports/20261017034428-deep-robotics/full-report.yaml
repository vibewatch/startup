        - Humanoid commercialization stalls or the IPO window closes before disclosures improve.
        - Needs new evidence; not yet the public base case.
      - - Base
        - >-
          Core quadruped business keeps growing and financing optionality remains open, but disclosures stay partial on
          valuation, margins, and customer quality.
        - >-
          Best treated as a track position where investors wait for either better evidence or more attractive entry
          terms.
        - Narrative premium outruns fundamentals; private terms remain investor-unfriendly.
        - Most consistent with current public evidence.
      - - Bear
        - >-
          Humanoid expansion absorbs cash, IPO timing slips, and commercial traction proves narrower or more
          concentrated than the marketing narrative suggests.
        - Would merit a discount to premium robotics peers or a pass until the company resets price and transparency.
        - Private-round pricing stays high despite weakening disclosure or delayed liquidity.
        - Cannot be dismissed because several key metrics remain undisclosed.
    notes: >-
      Scenario logic is qualitative because public sources do not disclose a current valuation mark, term sheet, or
      audited operating bridge.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV008
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
