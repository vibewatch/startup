      - number: '4.2'
        title: Pricing signals and unit economics
        blocks:
          - type: paragraph
            body: >-
              The retained public record is strongest on realized product economics, not public list pricing.
              Robotichina reports that the X-series generated RMB 196 million from 681 units in 2025, implying roughly
              RMB 287.5 thousand per unit with a 54.4% gross margin, while the Lite series generated RMB 51.3 million
              from 1,850 units, implying roughly RMB 27.7 thousand per unit. Those disclosed economics are useful
              because they show Deep Robotics already sells premium industrial systems at much higher monetization than
              its lighter research/field platforms. But they do not answer the underwriting questions that matter most
              for forward revenue quality: contract duration, implementation fees, service attach, warranty reserve,
              realized discounting, or customer concentration. The company therefore has enough public evidence to show
              product-market monetization, but not enough to show how durable or repeatable the current margin profile
              will be. [CI008][CI009][CI014]
            claimRefs:
              - CI008
              - CI009
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
              - CI008
              - CI009
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI009
              - CI010
              - CI014
      - number: '4.3'
        title: Capital needs and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The latest clearly disclosed financing event is the December 2025 Series C round of more than RMB 500
              million, which management said would support R&D, production-capacity expansion, and market development.
              Tech in Asia also reported that Deep Robotics had entered IPO guidance with preparatory work expected to
              finish by June 2026, while later independent summaries and company-linked releases described a STAR
              filing, new humanoid/embodied-AI ambition, and early 2026 commercial deployment efforts. That combination
              means Deep Robotics is not simply funding working capital for an already-stable business: it is trying to
              finance a broader scale-up that spans industrial quadrupeds, wheel-legged systems, humanoids, and
              production infrastructure. Because no retained public source discloses cash on hand, monthly burn, debt
              obligations, or runway, capital adequacy still depends more on financing access than on public operating
              cash evidence. [CI003][CI010][CI011][CI015]
            claimRefs:
              - CI003
              - CI010
              - CI011
              - CI015
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The core positive is that Deep Robotics has crossed the threshold from robotics narrative into documented
              industrial revenue, first profitability, and credible product-level ASP evidence. The core negative is
              that the next phase requires investors to underwrite capital intensity and execution with incomplete
              disclosure: one independent analysis argues humanoid sales were still de minimis, the same source flags
              sub-80% utilization against an aggressive expansion plan, and EquityZen explicitly markets deeper
              cap-table, revenue/financial, and risk-factor materials only to accredited private-market users. In
              practical terms, that leaves public investors able to see growth and product economics, but not the cash
              conversion, concentration, preference stack, or support burden that determine whether today’s gross-margin
              improvement can survive a capacity and humanoid buildout. The right financial verdict is “commercially
              real, but not yet transparently underwritable.” [CI005][CI012][CI013][CI016]
            claimRefs:
              - CI005
              - CI012
              - CI013
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Industrial hardware, not subscription software, is carrying the model today
            body: >-
              The strongest public revenue evidence comes from quadruped and wheeled-legged deployments, product-level
              unit sales, and gross margin progression; public humanoid monetization is still early and should be
              treated as upside rather than the core base case.
            calloutType: insight
            claimRefs:
              - CI004
              - CI007
              - CI008
              - CI013
              - CI015
          - type: callout
            title: Profitability can be fragile if capacity expands ahead of verified demand
            body: >-
              Public sources support first profitability, but they also point to utilization risk, limited disclosed
              humanoid volume, and no public runway data while the company is scaling manufacturing and pursuing an IPO.
            calloutType: risk
            claimRefs:
              - CI005
              - CI013
