            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP009
              - CP015
      - number: '3.3'
        title: Pricing, distribution, and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              No retained source supplies a verified public price, realized contract value, discount schedule, service
              attachment, or comparable total cost of ownership for Deep Robotics, Unitree, or Boston Dynamics. That
              prevents a defensible price-performance ranking. Deep Robotics does disclose an open research-oriented
              software posture for Lite3 and a modular autonomy suite across its broader platform. Those interfaces
              could reduce initial integration friction, while customer-specific mapping, perception, safety, workflow,
              and fleet-management work could create switching costs after deployment; the latter is an inference, not a
              disclosed retention metric. The company also claims field relationships with major industrial
              organizations, but the evidence does not reveal exclusivity, channel economics, repeat purchases, or
              whether customers multi-home across vendors. Buyers should therefore treat integration depth and service
              performance, not unavailable list prices, as the near-term diligence focus.
            claimRefs:
              - CP007
              - CP008
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP013
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The best evidence of durability is commercial rather than theatrical: third-party reporting attributes RMB
              196 million, 58.11% of 2025 revenue, and 681 units to the Jueying X quadruped line. It also reports that
              the newer Shanmao M wheeled-legged line contributed RMB 74 million, while humanoids generated only RMB
              823,000. This mix implies that Deep Robotics' present moat depends on industrial quadruped deployment,
              product reliability, and customer integration more than humanoid optionality. At the same time, anonymous
              discussion of the LYNX demonstration highlights both perceived mobility strength and concerns about
              battery life, tangling, and militarization; these comments are useful adverse signals but not engineering
              evidence. A parallel Unitree IPO and the absence of independently tested head-to-head metrics increase
              displacement uncertainty. Durable differentiation would require repeat-order cohorts, reliability data,
              service economics, and validated performance against direct peers, none of which appears in the assigned
              pool.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP011
              - CP012
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Competitive underwriting remains evidence-constrained
            body: >-
              The retained pool supports Deep Robotics' portfolio and recent commercialization, but it does not support
              a verified rival price-performance ranking or customer switching analysis.
            calloutType: risk
            claimRefs:
              - CP012
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics is monetizing industrial robotics rather than a pure software subscription. Company-issued
              materials describe a business spanning the R&D, production, sales, and service of quadruped robots,
              humanoid robots, and core robotic components, with deployments in power inspection, emergency response,
              industrial operations, security patrol, and education/research workflows. Independent summaries then fill
              in the commercial picture: 2025 revenue reached roughly RMB 337 million, gross margin moved above 52%, and
              embodied-intelligence robots accounted for the vast majority of main business revenue. Product-level
              evidence suggests the current revenue base is still anchored in quadruped and wheeled-legged systems
              rather than humanoids, so the right financial lens is industrial hardware monetization plus attached
              deployment/service work, not SaaS-style recurring revenue. [CI001][CI002][CI004][CI006][CI007]
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI006
              - CI007
