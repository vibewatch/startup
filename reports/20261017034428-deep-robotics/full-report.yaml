  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and alternatives
        blocks:
          - type: paragraph
            body: >-
              The available evidence places Deep Robotics in a broad legged-robotics contest rather than a
              single-product race. Its public portfolio spans Jueying quadrupeds, LYNX wheeled-legged systems, DR
              humanoids, and joint components, while its own materials position those products across power inspection,
              emergency response, tunnels, construction, and research. The clearest named direct peer in the assigned
              independent evidence is Unitree, whose IPO application was described as running in parallel with Deep
              Robotics'. Public discussion also invokes Boston Dynamics and Unitree as reference points, but that
              discussion is anecdotal and cannot establish comparative performance. Incumbent fixed inspection
              equipment, human inspection teams, and customer-built integrations remain economically relevant solution
              paths, yet the assigned pool does not quantify their cost or performance. Accordingly, the landscape table
              distinguishes evidenced company facts from alternatives that still require primary diligence.
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
