  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics is not selling a single showcase robot; the assigned evidence points to a multi-line
              embodied-robotics portfolio built around industrial field workflows. Official and third-party profile
              material consistently describe quadrupeds, wheeled-legged robots, humanoids, and standalone
              joints/components rather than a pure demo platform. The workflow emphasis is also concrete: the official
              surfaces repeatedly anchor use in power inspection, emergency response, underground/tunnel work,
              logistics, research, and education. That makes the product story more industrial-operations-led than
              consumer robotics-led, with a module map that already spans buyer types from utilities and rescue teams to
              research institutions.
