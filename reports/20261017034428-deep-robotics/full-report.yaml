              - CE008
              - CE014
      - number: '5.3'
        title: Maturity and differentiation
        blocks:
          - type: paragraph
            body: >-
              Relative to many embodied-AI narratives, Deep Robotics looks more mature in industrial locomotion than in
              generalized humanoid claims. Third-party profiles frame the company’s installed base around X-series
              industrial inspection and patrol use cases, while external comparison copy distinguishes Deep’s rugged
              industrial positioning from the more cost-competitive consumer/research framing associated with Unitree.
              Independent coverage also suggests Deep is using its quadruped foundation to finance and justify a newer
              DR02 humanoid push rather than starting with humanoids as a zero-revenue bet. That is a real
              differentiation vector, but it also means the humanoid roadmap still deserves more proof of production
              deployments, reliability, and economics than the assigned pool provides.
            claimRefs:
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE008
              - CE014
              - CE015
      - number: '5.4'
        title: Trust, support, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The evidence supports product seriousness more than it supports trust/compliance readiness. Official
              surfaces expose support-adjacent entry points such as downloads, FAQs, policy, service, and fault
              declaration, which is better than a brochure-only posture. But the same pool does not provide public APIs,
              payload SDK documentation for buyers, uptime reporting, warranty detail, cybersecurity architecture,
              privacy posture, or system-level certification evidence beyond IP66 environmental protection on LYNX M20.
              Developer-signal evidence is also thin: the available community proxy is a Reddit discussion reacting to a
              terrain demo, which shows attention but not a durable public ecosystem. The right technical read is
              therefore capable hardware with under-disclosed operating controls.
            claimRefs:
              - CE008
              - CE012
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Industrial-first positioning is real
            body: >-
              The assigned evidence is strongest where Deep Robotics ties locomotion to inspection, rescue, tunnel, and
              other hazardous industrial workflows. That is a better maturity signal than pure humanoid narrative,
              because it implies buyer pain, deployment context, and at least some service wrapper already exist around
              the robots.
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
              - CE013
          - type: callout
            title: Public trust and integration proof still lags the hardware story
            body: >-
              The official surfaces show product breadth and some support navigation, but they do not provide
              diligence-grade public proof on API/integration detail, uptime, warranty, security, or compliance. That
              leaves a material gap between a compelling field-robot demo story and a fully underwritten enterprise or
              regulated-operations platform story.
            calloutType: risk
            claimRefs:
              - CE008
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is industrial-first, with utilities as the commercial anchor
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently places Deep Robotics with professional rather than consumer buyers. Official
              company materials describe deployments across energy, emergency response, industrial operations, and
              education, while independent profiles align that the X-series and related systems are used for industrial
              inspection, hazardous-site entry, and research programs rather than broad consumer adoption. That mix
              matters because it implies a buyer set dominated by utilities, industrial operators, public-safety
              agencies, and technical institutions with procurement and integration budgets, not impulse hardware
              demand. The strongest customer fit is power-grid inspection, with other sectors appearing as adjacent
              workloads or developer seeding channels rather than equal commercial pillars.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU008
              - CU009
              - CU012
              - CU013
      - number: '6.2'
        title: Named customer proof exists, but it is concentrated and uneven in quality
        blocks:
          - type: paragraph
            body: >-
              The clearest production proof is in utility inspection. Independent and official sources both point to
              deployments across more than 100 substations with State Grid and China Southern Power Grid, and the same
              disclosures frame those relationships as long-term rather than one-off demos. Outside the Chinese utility
              base, the picture becomes thinner. Company and profile sources mention Singapore national-grid surveys,
              tunnel and corridor inspection, and deployments across dozens of countries, but they do not identify most
              counterparties, unit counts, contract terms, or what share of the footprint reflects paid recurring work
              versus pilots, showcases, or integrator-led projects. As a result, Deep Robotics has real adoption proof,
              but named proof is still narrower than the global footprint headline suggests.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU006
              - CU007
              - CU010
      - number: '6.3'
        title: Durability and expansion remain under-disclosed, with humanoid traction still mostly roadmap-level
        blocks:
          - type: paragraph
            body: >-
              The company has enough external evidence to show real demand, but not enough to underwrite durability.
              Independent writeups still note that Deep Robotics has not shared customer counts, cohort behavior, or
              segment-level revenue split, which makes it difficult to judge concentration, renewal depth, or service
              attach. The disclosed financial and order figures show continued momentum in industrial quadrupeds, yet
              they do not separate new-logo demand from follow-on fleet expansion. The same caution applies to the
              humanoid story: public 2026 deployment language comes primarily from a paid company release, while the
              best independent evidence still describes the humanoid line as early and commercially negligible versus
              the core quadruped base. That leaves the customer thesis investable on utility inspection today, but
              speculative on broader land-and-expand and humanoid upsell.
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Utility inspection is the real customer proof
            body: >-
              The investment-grade customer story is not generic embodied AI demand; it is a narrower but more credible
              wedge in utility inspection, where named accounts, usage metrics, and long-term partnership language
              actually exist.
            calloutType: insight
            claimRefs:
              - CU003
              - CU004
              - CU006
          - type: callout
            title: Durability is still a diligence question, not a disclosed metric
            body: >-
              Public evidence does not reveal customer concentration, renewals, cohort expansion, or service attach, so
              the leap from visible deployments to durable recurring economics still requires private diligence.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital-market and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics' capital-market risk is not whether investor interest exists, but whether disclosure catches
              up before the IPO window closes. Tech in Asia says the company entered IPO guidance and expected
              preparatory work to finish by June 2026, while RobotChina says a STAR Market filing was accepted in May
              2026 and targets roughly RMB 2.5 billion of fundraising at a reported RMB 13.9 billion valuation.
              Humanoids Daily separately says the company is using a revenue-generating quadruped base to fund a more
              capital-intensive humanoid push. That combination makes financing risk real even after the reported 500
              million yuan round: investors still lack public cap-table terms, liquidation preferences, and accessible
              primary filing detail. Kill criteria are monitorable: if filing milestones slip, if valuation moves ahead
              of disclosed unit economics, or if humanoid-scale spending rises before the quadruped business shows
              durable cash conversion, the risk should remain a track-not-buy condition.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR006
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.2'
        title: Operational, quality, and serviceability exposure
        blocks:
          - type: paragraph
            body: >-
              The core operating risk is that Deep Robotics is marketing robots into environments where failure costs
              are unusually high. Company-issued materials place the systems in substations, tunnels, landslides, flood
              control, hazardous chemical operations, and disaster rescue, which means uptime, autonomy quality, and
              operator support matter more than a demo-grade success narrative. The same support terms that help
              document the product also show friction: there are no returns, free warranty coverage excludes a long list
              of misuse and harsh-environment scenarios, the customer may bear shipping and paid-repair costs, and the
              published after-sales terms are explicitly limited to mainland China. Public materials therefore prove
              real use, but not yet a robust global service stack. Investors should treat field-failure rates, warranty
              claims, overseas spare-parts coverage, and safety or cybersecurity certifications as explicit diligence
              gates rather than assuming them from the deployment logos.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR009
              - CR013
      - number: '7.3'
        title: Concentration and dependency exposure
        blocks:
          - type: paragraph
            body: >-
              The partner and revenue base still looks narrower than the product narrative suggests. The U.S. about page
              highlights a short list of enterprise names-State Grid, China Southern Power Grid, Baosteel, and
              Fluke-which is strong validation but also evidence that a few industrial accounts and channels matter a
              lot. RobotChina additionally says quadruped and wheeled robots still drive more than 95% of revenue, so
              the humanoid line is strategically important without yet being proven as a second economic engine. That
              means diversification risk operates on both the customer axis and the platform axis. If a utility or
              heavy-industry spending cycle pauses, or if humanoid scale-up absorbs capital faster than it wins
              production demand, the company could face margin pressure even with solid top-line momentum. The most
              useful monitoring indicators are repeat orders outside energy inspection, disclosed revenue mix by product
              family, and conversion of reported orders on hand into cash collections.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers to monitor
            body: >-
              Do not underwrite a buy case if the IPO process stalls, if valuation outruns disclosed unit economics, if
              overseas support remains mainland-dependent, or if humanoid spend rises without a separate revenue engine
              to absorb it.
            calloutType: risk
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
              - CR012
          - type: callout
            title: Fastest de-riskers from management
            body: >-
              The chapter would de-risk fastest with a current filing package, cap-table terms, certification map,
              overseas SLA metrics, warranty-claim data, and product-family revenue mix that proves humanoids are
              becoming a commercial line rather than only a strategic narrative.
            calloutType: assumption
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and underwriting posture
        blocks:
          - type: paragraph
            body: >-
              The evidence supports continued engagement, but not an aggressive entry posture. On the positive side,
              Deep Robotics has fresh capital, multiple reported industrial deployments, and an expanding product set
              that now spans quadruped, wheel-legged, and humanoid platforms. Those points matter because they show the
              company is no longer only an R&D story. However, the public record is still missing the variables that
              determine whether a private round or secondary price is attractive: the current valuation, the preference
              stack, the dilution path, and a clean bridge from product traction to durable earnings power. That makes
              the correct recommendation track rather than buy. The company may be improving fundamentally, but without
              disclosed pricing terms and operating-quality metrics, investors would be paying for option value without
              being able to check whether the option is already fully priced.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV008
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.2'
        title: Financing context, price support, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The latest financing and IPO signals improve financing optionality, but they do not establish fair value.
              Yicai and Tech in Asia both report a roughly CNY500 million funding round in 2025, while Tech in Asia and
              Humanoids Daily point to A-share IPO guidance and a completed shareholding reform consistent with listing
              preparation. EquityZen adds a useful market signal because it shows that private secondary liquidity
              exists, yet the public-facing page keeps the cap table, funding history by share class, liquidity
              preferences, and financials behind accreditation and login gates. In practice, that means public investors
              can observe demand for access, but not the information needed to judge whether a quoted secondary mark is
              clean or burdened by preference overhang. Entry discipline therefore has to stay conservative: no
              stretching on a narrative premium until management provides current valuation and term transparency.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario framing and comparable lens
        blocks:
          - type: paragraph
            body: >-
              The bull case is that Deep Robotics turns today’s industrial foothold into a scaled embodied-AI platform
              before the public market window closes, using fresh capital to broaden the product line and convert more
              inspection, utility, and emergency-response deployments into repeatable programs. The base case is more
              restrained: quadruped demand continues, but the public record remains too thin on segment margins, repeat
              orders, and service mix to justify premium private-market pricing. The bear case is not that the company
              lacks technology; it is that humanoid expansion and IPO preparation absorb capital faster than disclosed
              commercial metrics mature. Public comparable evidence is also incomplete. A third-party industry analysis
              frames Deep Robotics against Boston Dynamics, ANYbotics, and Unitree, and Humanoids Daily explicitly
              places it behind Unitree in scale, but that still falls short of a true valuation comp set because Deep
              itself has not disclosed audited revenue, profit, or unit-shipment detail.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining diligence agenda is straightforward and high leverage. First, request the latest priced
              round documents, share-class stack, liquidation preferences, anti-dilution mechanics, and any VAM or
              special rights tied to the IPO timeline. Second, request operating data that can separate real
              commercialization from headline momentum: revenue by product family, gross margin by hardware versus
              service, repeat-order cohorts, backlog, customer concentration, warranty costs, and field-service burden.
              Third, ask management to reconcile the commercialization story around DR02 and Lynx with actual shipped
              units, signed contracts, and realized pricing. The thesis breaks if IPO timing slips without a
              corresponding increase in disclosure, if humanoid investment outpaces monetization in the core quadruped
              business, or if customer traction proves too concentrated to support premium private-market pricing.
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV008
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, but do not stretch for access
            body: >-
              Deep Robotics looks more financeable than speculative, yet the public record still does not support a
              price-insensitive buy decision. The missing valuation and preference evidence matters more than the
              narrative quality of the product story.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV012
          - type: callout
            title: Humanoid upside is still option value
            body: >-
              The humanoid push may add upside, but public evidence still treats it as commercialization ambition rather
              than a disclosed cash-flow engine. Underwriting it as base-case value would be premature.
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV013
