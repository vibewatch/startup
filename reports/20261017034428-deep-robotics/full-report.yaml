              - CP006
              - CP011
              - CP012
              - CP016
      - number: '3.2'
        title: Capability and portfolio positioning
        blocks:
          - type: paragraph
            body: >-
              Deep Robotics' differentiation claim rests on a vertically integrated perception-decision-execution stack
              and a product ladder that reaches from an ROS2-compatible research platform to industrial quadrupeds,
              wheeled-legged robots, and early humanoids. The official US site describes Lite3 as supporting an open
              SDK, LiDAR, depth cameras, and NVIDIA Jetson Xavier NX, which may lower prototyping friction for research
              buyers. Company materials also claim autonomous navigation, SLAM, real-time adaptation, and deployments in
              difficult industrial environments. These are meaningful scope signals, but most are company-issued rather
              than independent benchmark results. The positioning figure therefore scores only Deep Robotics' own
              portfolio on ordinal commercial-maturity and industrial-specialization axes; it does not manufacture
              unsupported rival coordinates. The central competitive question is whether industrial deployment know-how
              transfers into repeatable product advantage faster than component and locomotion capabilities commoditize.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
