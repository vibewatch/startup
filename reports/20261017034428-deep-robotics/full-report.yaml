  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports a clear market boundary before any sizing exercise: Deep Robotics is not best
              understood as a generic "humanoid" or broad embodied-AI vendor, but as a legged-robotics company whose
              monetized wedge is industrial field work. Hello China Tech's prospectus-based analysis says industry
              applications generated 79.33% of 2025 main business revenue, and it lists power-grid inspection, emergency
              firefighting, police and security operations, industrial monitoring, infrastructure patrol, and logistics
              as the paid use cases. Company-issued pages expand the adjacency set to energy, emergency response,
              industrial operations, manufacturing, infrastructure, education, and research, which is consistent with a
              product stack spanning industrial quadrupeds, wheeled-legged systems, and early humanoids. The main
              substitutes are therefore status-quo human patrols and hazardous-site inspection workflows, plus adjacent
              research/education platforms, not the entire robotics hardware market. Research and education remain
              relevant because the Lite3 line keeps a non-industrial entry point in the portfolio, but the evidence does
              not justify treating that adjacency as the same budget pool as industrial deployments.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: Buyer map and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map in the assigned pool is more concrete than a generic robotics narrative. Utilities and
              infrastructure owners appear as core buyers for inspection workflows; public-safety and emergency
              organizations appear as buyers for hazardous reconnaissance; and industrial operators or security teams
              appear as buyers for patrol, monitoring, and logistics-adjacent use cases. The company repeatedly frames
              adoption around places where human entry is difficult, dangerous, or slow, while independent reporting
              adds evidence that the installed base is moving beyond one-off demos into repeatable procurement. Hello
              China Tech cites cumulative deployment counts above 300 in both power inspection and police/security, more
              than 150 in fire rescue, and about 300 in industrial settings, while the company says its systems now
              package six sector solutions refined from more than 1,200 scenarios. That combination implies an adoption
              path in which a buyer first approves a risk-reduction use case, then standardizes procurement once a robot
              proves mobility, sensing, and reliability in a narrow workflow rather than across a broad labor category.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM008
              - CM014
      - number: '2.3'
        title: Sizing lenses, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest sizing evidence is company-specific and must be treated as a bounded lens rather than a
              market-total claim. The pool shows RMB 267.3 million of 2025 industry-application revenue, 681 X-series
              industrial quadrupeds sold at roughly RMB 287.5k each, and a 2026 Q1 snapshot of more than RMB 110 million
              in revenue with RMB 235 million of orders on hand. Those figures demonstrate a real, monetized wedge, and
              they explain why the company can pursue an IPO and keep funding humanoid expansion. But the same evidence
              also highlights the constraints that matter for valuation: the buyer base is narrower than consumer or
              research hardware, sales cycles are longer, safety-critical deployments require reliability in harsh
              environments, and the company's move into humanoids increases capital needs before that segment is equally
              proven. Tech in Asia's procurement examples help show that public and utility buyers can carry meaningful
              unit budgets, yet the assigned pool still does not provide a defensible third-party TAM/SAM/SOM or an
              independently reconciled spend model by geography and segment. Adoption is therefore best viewed as a
              hazardous-workflow automation market with credible proof of demand, but incomplete evidence on how large
              the reachable budget pool becomes outside today's proven niches.
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM008
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
