  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Deep Robotics’ public product stack runs from industrial workflows to robot forms, core control technologies, and
      deployment/support wrappers.
    data:
      layers:
        - label: Workflow layer
          detail: >-
            Public materials anchor the product set in field inspection, rescue, tunneling, logistics, and research
            workflows rather than generic robotics demos.
          modules:
            - Power and utility inspection
            - Emergency rescue
            - Tunnel and underground scouting
            - Logistics and security patrol
            - Research and education
        - label: Robot form layer
          detail: The lineup spans multiple embodiment choices rather than a single flagship SKU.
          modules:
            - X20 / X30 / X50 industrial quadrupeds
            - LYNX M20 / M20 Pro / S10 wheeled-legged robots
            - Lite3 research quadruped
            - DR01 / DR02 humanoids
            - J60 / J80 / J100 joint components
        - label: Core technology layer
          detail: Official copy repeatedly centers a perception-to-control stack rather than only industrial design.
          modules:
            - Multimodal environmental perception
            - Cross-scenario embodied navigation
            - Integrated sensing and motion control
            - Autonomous terrain recognition
            - Adaptive gait control
        - label: Sensing and compute layer
          detail: The most detailed public product page discloses specific hardware, compute, and interface building blocks.
          modules:
            - Dual 96-line LiDAR
            - Dual wide-angle cameras
            - Dual octa-core processors
            - 72 V power input
            - Gigabit Ethernet
        - label: Deployment layer
          detail: Commercialization depends on packaging the hardware into implemented customer workflows.
          modules:
            - Payload integration
            - Deployment support
            - Lifecycle support
            - Robotics-as-a-Service options
          outputs:
            - Industrial inspection
            - Hazardous-site operations
            - Research deployments
        - label: Trust and operations layer
          detail: Public support entry points exist, but operational proof remains thinner than the hardware story.
          modules:
            - Downloads and resource centre
            - FAQs and policy pages
            - Service and fault declaration
            - No public uptime or SLA metrics
    claimRefs:
      - CE002
      - CE003
      - CE008
      - CE014
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Utility inspection is the entry wedge, adjacent industrial workflows extend the installed base, and humanoids
      remain an early upsell path.
    data:
      items:
        - label: Utility entry wedge
          value: Power-grid operators
          touchpoints:
            - Autonomous substation patrol and fault inspection
            - State Grid / China Southern Power Grid proof
          detail: This is the clearest named production surface and the one with the strongest utilization evidence.
        - label: Field-usage validation
          value: Operations teams
          touchpoints:
            - 100+ substations
            - 1M+ cumulative inspection km
          detail: >-
            Published utilization metrics are concentrated in the utility workflow rather than spread evenly across
            sectors.
        - label: Adjacent industrial expansion
          value: Infrastructure and plant operators
          touchpoints:
            - Tunnel, petrochemical, mining, and thermal-power inspection
            - Hazardous-site entry and monitoring
          detail: Adjacency broadens the use-case map, but most customers are unnamed and commercial scope is unclear.
        - label: Public-safety and rescue references
          value: Emergency-response buyers
          touchpoints:
            - Earthquake drills
            - Fire scene reconnaissance and hazardous-gas detection
          detail: These references strengthen mission fit but read more like scenario proof than durable account disclosure.
        - label: Research and developer seeding
          value: Universities and labs
          touchpoints:
            - Lite3 education and robotics-lab positioning
            - Developer and research applications
          detail: Research surfaces broaden awareness but do not yet prove enterprise monetization depth.
        - label: Humanoid expansion option
          value: Future industrial upsell
          touchpoints:
            - DR02 commercial-deployment claim in 2026
            - Independent evidence still shows only one humanoid unit sold in 2025
          detail: Humanoids are a strategic extension, not a meaningfully proven customer base today.
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
      - CU009
      - CU012
      - CU013
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Funding/disclosure and hazardous-field execution remain the hardest residual risks because public mitigations lag
      the scale of the deployment claims.
    data:
      columns:
        - label: Likelihood
          note: Analyst assessment from cited evidence
        - label: Impact
          note: Downside if the risk crystallizes
        - label: Mitigation maturity
          note: Amount of concrete public evidence on controls
        - label: Residual exposure
          note: Post-mitigation view from this chapter
      rows:
        - label: IPO and funding execution
          note: Public-market timing versus disclosure depth
          values:
            - label: Medium
              tone: medium
              note: IPO guidance and filing progress are public, but detailed economics are not.
            - label: High
              tone: high
              note: A slip can constrain humanoid scale-up or force worse financing terms.
            - label: Medium
              tone: medium
              note: Funding round and reported profitability help, but do not replace filing detail.
            - label: High
              tone: high
              note: Cap-table, dilution, and cash-conversion evidence are still missing.
        - label: Hazardous-field reliability and safety
          note: Critical workflows in flood, power, tunnel, and chemical settings
          values:
            - label: Medium
              tone: medium
              note: The company already markets these environments as live use cases.
            - label: High
              tone: high
              note: A field failure has real operational and safety consequences.
            - label: Medium
              tone: medium
              note: There is evidence of deployment, but not enough public reliability or certification data.
            - label: High
              tone: high
              note: Operational downside stays elevated until service and incident metrics are disclosed.
        - label: After-sales and overseas support
          note: Published support terms are mainland-scoped
          values:
            - label: Medium
              tone: medium
              note: Expansion abroad increases the odds that service gaps matter.
            - label: Medium
              tone: medium
              note: Support friction can slow renewals, margin, and reference quality.
            - label: Low
              tone: low
              note: Public terms describe limits more clearly than they describe mitigations.
            - label: High
              tone: high
              note: Investors still need SLA, parts, and warranty-claims evidence.
        - label: Product-liability and contract allocation
          note: No-return terms and narrow free-warranty coverage
          values:
            - label: Medium
              tone: medium
              note: The terms already allocate several failure scenarios back to the buyer.
            - label: High
              tone: high
              note: A disputed field failure can hit reputation, margin, and customer renewals together.
            - label: Low
              tone: low
              note: Public documentation describes exclusions more clearly than customer protections.
            - label: High
              tone: high
              note: Residual exposure stays high until contract, insurance, and incident data are reviewed.
        - label: Customer and platform concentration
          note: Industrial quadrupeds still dominate the visible economics
          values:
            - label: Medium
              tone: medium
              note: The named public partner base is meaningful but not broad.
            - label: High
              tone: high
              note: Losing an anchor buyer or missing humanoid diversification slows the story materially.
            - label: Medium
              tone: medium
              note: Enterprise validation exists, but diversification proof is limited.
            - label: Medium-high
              tone: high
              note: Residual concentration stays elevated until product-family and customer-mix disclosure widens.
        - label: Integrated manufacturing bottlenecks
          note: In-house design and manufacturing amplify both speed and single-point failure risk
          values:
            - label: Medium
              tone: medium
              note: Demand or component shocks would affect multiple product families at once.
            - label: Medium-high
              tone: high
              note: Ramp delays can hit both the existing quadruped engine and the humanoid expansion plan.
            - label: Medium
              tone: medium
              note: Vertical integration is a mitigation, but alternate-supplier evidence is not public here.
            - label: Medium-high
              tone: high
              note: Residual bottleneck risk remains meaningful until capacity and quality metrics are disclosed.
    approximationNotes: Risk levels are synthesis from cited public evidence, not company-disclosed scoring.
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR006
      - CR008
      - CR009
      - CR011
      - CR012
      - CR013
