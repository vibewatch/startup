figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Six-stage enterprise customer adoption lifecycle from CISO architectural evaluation through forward-deployed engineering expansion and sovereign multi-agent automation.
    data:
      items:
        - summary: Evaluation of air-gapped, on-premises, or private VPC deployment requirements without third-party cloud egress.
          touchpoints:
            - CISO and security architect consultation
            - Base image policy compliance verification
            - Network isolation verification without external GPU egress
          label: 1. Architectural Scoping & CISO Security Review
        - summary: Forward Deployed Research Engineers co-locate with client teams to configure the first internal workflow.
          touchpoints:
            - FDRE integration with internal git repositories and CI/CD
            - Context-loading and fine-tuning on internal coding practices
            - Initial developer cohort testing in VS Code, IntelliJ, or terminal
          label: 2. Forward-Deployed Proof-of-Concept Pilot
        - summary: Full deployment of Poolside Platform inside customer boundary under fixed subscription terms.
          touchpoints:
            - Deployment on customer bare metal or managed private VPC via AWS
            - Centrally managed MCP server integration to Slack, Jira, and internal APIs
            - Role-based access control and encrypted credential injection
          label: 3. Initial Production Deployment
        - summary: Expansion across engineering teams from autocomplete to autonomous agentic software development.
          touchpoints:
            - Laguna XS on-device completion rollout across developer seats
            - Laguna M multi-file reasoning and test generation adoption
            - Searchable trajectory audit logging for regulatory oversight
          label: 4. Developer Workflow Expansion
        - summary: Scaling across business units, subsidiaries, or defense mission branches via sovereign licensing.
          touchpoints:
            - Unlimited on-prem inference utilization without incremental token charges
            - Poolside Federal LLC engagement for classified program ATOs
            - Integration into mission-critical software supply chain workflows
          label: 5. Departmental & Cross-Agency Scaling
        - summary: End-to-end autonomous multi-agent engineering pipelines executing sandboxed tasks and pull requests.
          touchpoints:
            - Automated code migration for legacy mission architectures
            - Continuous RLCEF synthetic training feedback loop on internal codebases
            - Enterprise-wide standard for air-gapped sovereign AI engineering
          label: 6. Sovereign Multi-Agent Automation
    approximationNotes: Journey stages modeled on Poolside Platform architecture disclosures, enterprise case studies, and partner deployment workflows as of October 2026.
