      - CU002
      - CU003
      - CU008
      - CU010
callouts:
  - calloutType: insight
    title: The Sovereign Air-Gapped Moat in Regulated Procurement
    body: While incumbent coding assistants compete primarily on consumer developer mindshare and cloud-hosted API latency, Poolside's go-to-market architecture deliberately bypasses public cloud egress entirely. By delivering full model weights, predictable fixed subscriptions, and native air-gapped compatibility, Poolside positions itself as the primary compliant alternative for defense contractors, intelligence agencies, and global banks that are structurally prohibited from sending proprietary source code to multi-tenant cloud endpoints.
    claimRefs:
      - CU002
      - CU003
      - CU005
  - calloutType: risk
    title: Enterprise Sales Cycle Friction and Lack of Public Retention Proof
    body: Poolside's enterprise-first focus creates substantial commercial headwinds, including elongated 9-to-18 month security evaluations, high forward-deployed customer acquisition costs, and vulnerability to corporate IT budget freezes. Furthermore, the absence of publicly verifiable net retention rates, cohort churn metrics, and referenceable production contract sizes leaves significant uncertainty regarding the true durability and expansion economics of early commercial customer cohorts.
    claimRefs:
      - CU011
      - CU013
      - CU014
