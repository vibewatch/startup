callouts:
  - calloutType: "risk"
    title: "Capital Intensity and Infrastructure Financing Dependency"
    body: "Project Horizon demonstrated the acute hazards of startup-led gigawatt infrastructure buildouts. While the August 2026 Nvidia transactions restored near-term liquidity, Poolside's core unit economics remain tethered to massive training compute costs that require continued commercial validation."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI011"
  - calloutType: "insight"
    title: "Sovereign Positioning as a Pricing Defense"
    body: "By eliminating per-token fees and packaging full model weights for air-gapped environments, Poolside bypasses direct commodity price competition against public cloud APIs, targeting high-ACV procurement budgets in defense and regulated enterprise sectors."
    claimRefs:
      - "CI001"
      - "CI012"
