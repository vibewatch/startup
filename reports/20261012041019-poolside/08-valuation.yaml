  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Thesis / Anti-Thesis
      - Core Argument
      - Evidence Base
      - What Would Change View
    rows:
      - - 'Thesis: Sovereign Enterprise Demand'
        - Regulated enterprises in defense and finance demand air-gapped on-premises code LLMs with zero data egress
        - Partnerships with Vibrint, Sterling Computers, and Hunted Labs
        - Broader enterprise churn or widespread enterprise adoption of public cloud-hosted copilots
      - - 'Thesis: Specialized Model Factory Advantage'
        - Reinforcement learning from code execution feedback (RLCEF) creates proprietary automated model development assets
        - Nvidia non-exclusive $6B license for Model Factory software platform
        - Frontier labs achieving comparable coding benchmarks using commodity synthetic pipelines
      - - 'Anti-Thesis: Capital & Compute Overhang'
        - CoreWeave 2GW Texas campus failure collapsed $2B Series C attempt and increased capital vulnerability
        - Mutual termination of CoreWeave project in April 2026; lost 40k GB300 cluster
        - Securing permanent sovereign compute infrastructure with diversified power and hardware access
      - - 'Anti-Thesis: Commercial Revenue Opacity'
        - No audited revenue, ARR, or net retention metrics are disclosed, leaving $12B mark unanchored by fundamentals
        - Public estimates range from $30M-$50M while official disclosures remain zero
        - Disclosure of audited ARR above $100M with top-quartile enterprise net revenue retention
    notes: Core thesis arguments compiled from company positioning and independent technical reports; null indicates non-applicable trigger.
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Key Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Sovereign on-premise coding becomes mandatory for defense/finance; Model Factory yields recurring licensing streams
        - $20B-$30B terminal valuation (2.0x-2.5x MOIC on $12B base) via IPO or mega-cap strategic buyout
        - Hyperscalers launching certified air-gapped coding appliances that undercut pricing
        - 20%
      - - Base Case
        - Poolside captures specialized sovereign defense niches while Nvidia integration drives steady ecosystem adoption
        - $10B-$14B valuation range (~1.0x MOIC) with flat or modest step-up round in 2027
        - Extended enterprise sales cycles and persistent high inference and R&D burn
        - 55%
      - - Bear Case
        - Commoditization of coding models; talent drain following Nvidia offers to 109 staff; down-round or liquidation
        - $3B-$5B valuation (Series B recapitalization level, 60%-75% capital loss)
        - Failure to convert federal pilots to enterprise ARR or investor distribution depletion
        - 25%
    notes: Scenario returns assume $12B entry valuation; probability signals reflect author weighting based on compute access and commercial pipeline.
    claimRefs:
      - CV008
      - CV011
      - CV012
      - CV004
