callouts:
  - calloutType: recommendation
    title: 'Recommendation Stance: Research-More at Stretched Valuation'
    body: Given the unprecedented structure of Nvidia's $7 billion commitment—where $6 billion in license revenue flows directly to prior investors while 109 core engineers receive Nvidia offers—prospective investors must treat the headline $12 billion valuation with caution. Direct commitment should be withheld until audited ARR, net retention, and post-transaction governance rights are verified.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV013
  - calloutType: risk
    title: Infrastructure Fragility and Compute Overhang
    body: The collapse of the CoreWeave 2GW Texas campus negotiation in spring 2026 aborted a $2 billion Series C financing and forfeited a 40,000 GB300 GPU cluster. This episode exposes extreme infrastructure dependency, underscoring that sovereign AI developers remain vulnerable to third-party compute bottlenecks.
    claimRefs:
      - CV006
      - CV012
