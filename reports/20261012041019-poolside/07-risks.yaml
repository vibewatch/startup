    title: Structural Disruption Following the August 2026 Nvidia Transaction
    body: The August 2026 transaction with Nvidia, encompassing a $6 billion non-exclusive license of the Model Factory software, a $1 billion equity investment at a $12 billion valuation, and the transition of 109 research employees to Nvidia, fundamentally transforms Poolside's risk profile. While eliminating near-term balance-sheet insolvency, the departure of key technical personnel and reported cessation of proprietary frontier foundation model training introduce severe execution risk regarding the company's long-term enterprise software moat.
    claimRefs:
      - CR009
      - CR010
      - CR011
