        - Unsupported; requires multi-tenant Microsoft cloud connection
        - Unsupported; proprietary cloud platform
        - Limited to third-party cloud VPCs; no raw weight delivery
      - - Inference Cost & Pricing Model
        - Unlimited inference via hardware subscription without per-token charges
        - Per-user monthly SaaS subscription ($19-$39/user/mo)
        - Usage-based cloud pricing / enterprise contract
        - Per-token API fees or seat-based enterprise agreements
      - - Agentic Execution & Tool Calling
        - MCP server orchestration connecting Jira, Slack, and GitHub in containers
        - Copilot Workspace / Extensions with cloud-mediated tool access
        - Autonomous agent workflows in proprietary cloud environment
        - Computer use and tool use APIs mediated via external API calls
      - - Model Weight Sovereignty
        - Full model weights supplied (Laguna series; open XS.2 Apache 2.0)
        - Proprietary closed weights operated solely by Microsoft/OpenAI
        - Proprietary closed weights operated solely by Magic
        - Proprietary closed weights operated by Anthropic or cloud partners
