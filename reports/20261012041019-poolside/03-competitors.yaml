  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Vendor / Solution
      - Pricing & Licensing Model
      - Included Capabilities
      - Discounts or Unknowns
      - Enterprise Diligence Implication
    rows:
      - - Poolside Platform & Models
        - Hardware-tied annual subscription; unlimited on-prem inference
        - Full model weights, Atlas inference engine, containerized agent runtime, MCP servers
        - Private contract pricing undisclosed; forward-deployed engineering fees unknown
        - Eliminates token volatility but requires significant upfront compute/server investment
      - - Laguna XS.2 (Open-Weight)
        - Free under permissive Apache 2.0 open-source license
        - 33B parameter (3B active) MoE weights for local execution on single GPU
        - Commercial support and fine-tuning tooling not bundled with open weights
        - Enables zero-cost community evaluation and offline edge developer deployment
      - - GitHub Copilot Enterprise
        - $39 per user per month list price
        - Chat, code completion, pull request summaries, custom doc indexing
        - Enterprise volume discounting available under Microsoft Enterprise Agreements
        - Low barrier to entry and predictable per-seat cost, but code metadata leaves boundary
      - - Anthropic Claude Enterprise
        - Seat-based SaaS plus usage-based API token tiers
        - Claude models, 500k context window, SSO, data retention controls
        - Custom enterprise contract pricing negotiated on volume and commit tiers
        - Variable token expense scales with agentic loops; requires continuous outbound cloud calls
    notes: >-
      Pricing structures reflect published vendor list pricing; enterprise discounting and custom professional service
      fees remain private.
