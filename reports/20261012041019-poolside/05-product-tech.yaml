artifact: product-tech
slug: poolside
runDate: '2026-10-12'
company:
  name: Poolside
chapter:
  number: 5
  title: Product & Technology
  summary: Poolside combines coding-focused models, agent interfaces, a controlled runtime, and customer-boundary deployment for enterprises and government users. The strongest public evidence supports deployment flexibility and governance controls, while independent proof of reliability, developer adoption, security certification, and the post-Nvidia model roadmap remains limited.
sections:
  - id: product-and-workflow
    title: Product surfaces and customer workflow
    body: >-
      Poolside's product is not just a model endpoint: the public product description spans developer interfaces, centrally managed integrations, containerized execution, and administrative controls. Poolside says agents operate in VS Code, Visual Studio, Zed, IntelliJ, and the terminal, while AI Engineer also describes a macOS Desktop Assistant capable of running multiple coding agents across projects. The intended workflow starts where developers already work, gives an agent repository and tool access through managed connections, executes each session in a controlled container, and records the resulting actions for administrators. This design is most differentiated for buyers that cannot accept source-code egress, but the assigned evidence does not quantify developer adoption or productivity gains.
    claimRefs: [CE001, CE002, CE003, CE012]
    tableRefs: [TE001]
  - id: architecture-and-models
    title: Architecture, models, and training mechanism
    body: >-
      The evidence supports a layered operating model rather than a single coding assistant. Developer surfaces sit above agent execution and Model Context Protocol integrations; governance controls constrain credentials, networks, and audit records; Poolside models and the Atlas inference engine provide the intelligence and serving layers; and deployments run on customer-controlled infrastructure or cloud virtual private networks. Third-party profiles describe a 2026 lineup of Malibu, Point, and Laguna, while Poolside's government page claims Atlas can improve model performance by up to 30%. AI Engineer and SentinelOne both describe reinforcement learning from code execution, in which compilation and test outcomes provide feedback. These architecture and performance statements remain mostly vendor or investor sourced rather than independently benchmarked.
    claimRefs: [CE004, CE005, CE006, CE008, CE013, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: deployment-and-operations
    title: Deployment, implementation, and operating maturity
    body: >-
      Poolside says the Platform can run on customer bare metal, on partner-delivered air-gapped hardware, or inside existing AWS, Azure, and Google Cloud virtual private clouds. Its government offering goes further, promising delivery of full model weights and operation without external calls, data egress, or shared systems. Implementation is service-assisted: Poolside says forward-deployed research engineers work with customer teams to identify workflows, ship an initial automation in weeks, and then harden and measure it. That support model may reduce implementation friction, but it also makes delivery capacity a dependency. No assigned source provides a public service-level agreement, status history, incident record, deployment duration distribution, or independent evidence of production reliability at scale.
    claimRefs: [CE004, CE005, CE007]
    tableRefs: [TE002]
  - id: differentiation-and-risks
    title: Differentiation, trust controls, and technical risks
    body: >-
      Poolside's clearest differentiation is sovereignty: full weights, local inference, network-policy enforcement, secret handling, and searchable trajectories are designed for regulated or disconnected environments. The evidence does not establish that these controls have passed named third-party certifications or independent penetration testing, so they should be treated as design claims rather than verified assurance. External model catalogs add useful but narrow signals: LM Market Cap listed four Poolside variants with function calling and reasoning across all four, but no vision capability, and Artificialus likewise described the models as text-only. AI Engineer also reported that Poolside stopped frontier-model development after an August 2026 Nvidia arrangement without disclosing an updated vision, creating roadmap uncertainty that requires direct contractual and product-plan diligence.
    claimRefs: [CE003, CE005, CE009, CE010, CE011, CE014, CE016]
