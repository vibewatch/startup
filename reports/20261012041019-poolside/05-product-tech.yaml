  evidenceGaps:
    - type: missing-source
      severity: material
      topic: developer-adoption-and-reliability
      missingEvidence: Public repository, package, extension, active-user, service-level, status-history, and incident data tied to Poolside's current products.
      whyItMatters: Without usage and operating evidence, product maturity and reliability cannot be separated from announced availability and directory listings.
      diligencePath: Request product telemetry by interface, retention cohorts, deployment counts, service-level performance, incident logs, and customer references; reconcile them with public package and extension records.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE001, TE002]
    - type: private-evidence-only
      severity: material
      topic: security-assurance
      missingEvidence: Named third-party certifications, penetration-test scope and findings, control mappings, and customer evidence that the advertised boundary controls operate as designed.
      whyItMatters: Architecture claims do not establish implementation quality, certification status, or resistance to misconfiguration and privileged-agent failure.
      diligencePath: Review current audit reports, certification letters, penetration tests, threat models, red-team results, and reference-customer security assessments under NDA.
      relatedQuestionRefs: [QE006]
      relatedTableRefs: [TE002, TE003]
    - type: conflicting-data
      severity: material
      topic: model-roadmap
      missingEvidence: A current product and R&D roadmap clarifying which models, training assets, personnel, and intellectual-property rights Poolside retained after the reported Nvidia arrangement.
      whyItMatters: Uncertainty over continued frontier-model development affects differentiation, update cadence, dependency risk, and the credibility of current product plans.
      diligencePath: Inspect the Nvidia agreements and obtain management's staffed roadmap, release commitments, retained-IP schedule, and model maintenance plan.
      relatedQuestionRefs: [QE005]
