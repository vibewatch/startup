callouts:
  - calloutType: "insight"
    title: "Dual-Track Capital Realization vs. Ongoing Operating Independence"
    body: |
      The August 2026 transaction with Nvidia creates an unprecedented corporate structure in venture-backed generative AI: a $6B cash licensing monetization distributed to early investors alongside a fresh $1B operating equity infusion at a $12B pre-money valuation. While the non-exclusive license preserves corporate independence and enables continued sales to sovereign defense and enterprise customers, the transition of 109 core research engineers to Nvidia represents a de facto talent carveout that fundamentally alters Poolside's internal foundation-model research capabilities.
    claimRefs:
      - "CO013"
      - "CO014"
      - "CO015"
