chapter:
  number: 1
  title: "Company Overview"
  summary: "Poolside is an enterprise AI software-engineering company founded in 2023 by former GitHub CTO Jason Warner and source{d} founder Eiso Kant. The company raised $626M in venture financing through its Series B before executing a transformative $7B transaction with Nvidia in August 2026, comprising a $6B non-exclusive Model Factory license and a $1B equity investment valuing Poolside at $12B pre-money."
sections:
  - id: "identity-and-foundational-mission"
    title: "Corporate Identity, Mission, and Operating Model"
    body: |
      Poolside (associated with legal entity Poolside, Inc., incorporated in the United States in April 2023) is a developer of artificial intelligence models and autonomous systems purpose-built for software engineering. The company was founded in early 2023 by former GitHub Chief Technology Officer Jason Warner and serial engineering intelligence entrepreneur Eiso Kant, establishing operational headquarters spanning San Francisco, California and Paris, France. Poolside's foundational thesis is that software development represents the first major technical domain where artificial intelligence will achieve and surpass human-level capability, requiring full-stack model architectures rather than superficial IDE wrapper extensions.

      To operationalize this mission in high-assurance environments, Poolside established Poolside Federal LLC, a United States domiciled operating entity dedicated exclusively to federal agencies, national security organizations, and defense industrial base customers. Unlike consumer-oriented cloud code assistants that enforce recurring per-token inference charges and remote data routing, Poolside delivers open-weight foundation models (including the Laguna model family) engineered explicitly for on-premises, VPC, and air-gapped deployments. By enabling unlimited local inference without outbound data egress, Poolside provides sovereign software intelligence where proprietary enterprise codebases remain strictly within institutional custody.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Organizational Scale"
    body: |
      Poolside is led by co-founders Jason Warner (Chief Executive Officer) and Eiso Kant (Chief Technology Officer, who has also served as co-CEO in operating documentation). Prior to co-founding Poolside, Warner served as Chief Technology Officer at GitHub, where he directed the engineering incubation and release of category-defining developer tools including GitHub Copilot, GitHub Actions, and GitHub Codespaces, following earlier leadership roles at Heroku, Canonical, and venture firm Redpoint Ventures. Kant brought complementary domain expertise as a pioneer in AI-assisted code analysis, having founded source{d} in 2015 as an early codebase analysis startup and later building engineering intelligence platform Athenian.

      The executive bench was further strengthened through the recruitment of former GitHub Chief Revenue Officer Paul St. John to lead enterprise go-to-market initiatives, and augmented technologically through the 2025 acquisition of Fern Labs, which contributed multi-agent orchestration infrastructure and forward-deployed engineers. Commercial and institutional backing is anchored by lead venture investors Bain Capital Ventures and Felicis Ventures alongside corporate backers including Nvidia, SentinelOne's S Ventures, Citi Ventures, and Adams Street Partners. A structural leadership transition occurred in August 2026, when 109 core engineers focused on foundation model development transitioned to Nvidia following an enterprise licensing transaction, while founders Warner and Kant remained at Poolside to guide the company's independent product roadmap.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-nvidia-transaction"
    title: "Capitalization Trajectory and the August 2026 Nvidia Deal"
    body: |
      Poolside's capitalization history reflects one of the fastest capital-raising trajectories in enterprise software history. Following a $26M seed round in May 2023 and a $100M Series A in August 2023, Poolside closed a $500M Series B in October 2024 led by Bain Capital Ventures with participation from Nvidia, DST Global, StepStone Group, Citi Ventures, HSBC Ventures, and SentinelOne (S Ventures) at a post-money valuation of $3.0B. In spring 2026, Poolside faced operational turbulence when negotiations with CoreWeave for access to a planned 2-gigawatt data center cluster collapsed, leading to the termination of Project Horizon and stalling an attempted $2B Series C financing that resulted in the loss of access to an anticipated 40,000 GB300 GPU cluster.

      This infrastructure bottleneck was decisively resolved on August 20, 2026 through a multi-part transaction with Nvidia totaling $7B in overall financial commitments. The transaction comprised two distinct elements: first, a $6B non-exclusive commercial license fee paid by Nvidia for Poolside's proprietary Model Factory training and evaluation platform (capital earmarked for distribution to Poolside's existing investors by the end of 2027 rather than company operating cash); and second, a separate $1B direct equity investment from Nvidia into Poolside at a $12B pre-money valuation (approximately $13B post-money). Crucially, the agreement was structured as a non-exclusive license and minority equity participation rather than an acquisition, allowing Poolside to preserve corporate independence and commercial freedom of action.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
