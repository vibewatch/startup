chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与运营模式
        blocks:
          - type: paragraph
            body: >
              Poolside（对应法律实体 Poolside, Inc.，于 2023 年 4 月在美国注册）是一家为软件工程打造人工智能模型和自主系统的公司。公司由前 GitHub 首席技术官 Jason Warner
              和连续创业的工程智能企业家 Eiso Kant 于 2023 年初创立，运营总部横跨美国加州旧金山和法国巴黎。Poolside
              的根本判断是：软件开发将是人工智能首个达到并超越人类水平能力的主要技术领域，因此需要全栈模型架构，而不是浅层的 IDE 外壳扩展。

              为在高保障环境中落实这一使命，Poolside 成立了 Poolside Federal LLC。这是一家注册于美国的运营实体，专门服务联邦机构、国家安全组织和国防工业基地客户。不同于按 token
              持续收费、并将数据远程路由的面向消费者云端代码助手，Poolside 提供开放权重基础模型（包括 Laguna 模型家族），专门支持本地部署、VPC
              和气隙部署。客户无需向外传输数据即可在本地无限推理，专有企业代码库也因此始终留在机构控制范围内。
            claimRefs:
