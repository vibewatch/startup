      - number: '2.2'
        title: 可服务市场规模、增长动力与估值视角
        blocks:
          - type: paragraph
            body: >-
              评估 Poolside 的可服务市场，必须把广义软件工程支出拆成受证据约束的具体规模层级。宏观基线是：全球软件工程师劳动报酬和企业开发预算每年超过
              $1.2T，背后是合格开发者长期短缺和工程交付积压。以此为基础，AI 辅助软件开发工具的总可寻址市场（TAM）预计到 2026 年为
              $25B–$35B；随着企业从简单代码补全转向自主多文件智能体工作流，复合年增长率为 30%–45%。主权、本地部署和受 VPC 限制的企业 AI 可服务市场（SAM）预计为
              $6B–$10B，主要由航空航天、国防、银行、医疗和公共部门治理等受监管行业驱动。在这一 SAM 中，Poolside 的可获取市场（SOM）是高安全子市场，规模为
              $1.5B–$3B，覆盖气隙、主权和国防部署。2026 年 8 月 20 日，Nvidia 承诺为 Poolside 的 Model Factory 软件提供 $6B 非排他性许可，并以 $12B 投前估值进行
              $1B 股权投资，市场估值基准也因此被彻底重塑。
