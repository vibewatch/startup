      - number: '1.2'
        title: 执行团队、治理与组织规模
        blocks:
          - type: paragraph
            body: >
              Poolside 由联合创始人 Jason Warner（首席执行官）和 Eiso Kant（首席技术官，运营文件中也曾任联合 CEO）领导。共同创办 Poolside 之前，Warner 曾任 GitHub
              首席技术官，负责工程孵化和发布 GitHub Copilot、GitHub Actions、GitHub Codespaces 等定义品类的开发者工具，此前还在 Heroku、Canonical 和风险投资机构
              Redpoint Ventures 担任领导职务。Kant 则带来了互补的领域经验：他是 AI 辅助代码分析的先行者，2015 年创办早期代码库分析初创公司 source{d}，之后又打造了工程智能平台
              Athenian。

              公司还聘请前 GitHub 首席营收官 Paul St. John 负责企业市场拓展，并于 2025 年收购 Fern Labs，补充了多智能体编排基础设施和前置部署工程师。商业和机构支持来自领投机构 Bain
              Capital Ventures、Felicis Ventures，以及 Nvidia、SentinelOne 的 S Ventures、Citi Ventures 和 Adams Street Partners
              等企业投资方。2026 年 8 月发生了结构性领导变动：109 名专注基础模型开发的核心工程师在一项企业许可交易后转至 Nvidia，而 Warner 和 Kant 留在
              Poolside，继续负责公司的独立产品路线。
