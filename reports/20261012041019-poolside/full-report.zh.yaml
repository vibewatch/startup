      - number: '3.2'
        title: 能力差异化：主权权重与多租户云 API
        blocks:
          - type: paragraph
            body: >-
              Poolside 直接把完整模型权重交付到客户环境，因此能在没有遥测和外发网络调用的情况下完全气隙运行，从而形成区别于云优先竞争者的结构性优势。GitHub Copilot 和 Anthropic
              需要把代码片段或 AST 表示传输到多租户云数据中心，而 Poolside 的 Laguna 基础模型运行在客户自有基础设施或安全的一体化集群上。平台提供带 Model Context Protocol
              连接器的容器化智能体运行时，可接入企业内部系统，完整记录推理轨迹，并在运行时清除凭据。在独立评测中，Poolside 专有 Laguna M.1 在 SWE-bench Pro 上达到 46.9%，在
              SWE-bench Verified 上达到 72.5%，超过 Devstral 2 并接近云端前沿模型；开放权重 Laguna XS.2 则以轻量级 330 亿参数规模在 SWE-bench Pro 上达到
              44.5%。
            claimRefs:
