  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 从企业主权客户接洽到长期实现毛利率的运营转化流程。
    data:
      nodes:
        - id: N1
          label: 客户需求识别
          summary: Regulated enterprise or public agency identifies need for air-gapped sovereign coding AI
        - id: N2
          label: 本地架构与部署
          summary: Full model weights delivered inside customer security perimeter with zero external egress
        - id: N3
          label: Atlas 引擎优化
          summary: Proprietary inference engine increases hardware compute utilization by up to 30%
        - id: N4
          label: 前置部署定制
          summary: Solutions architects integrate internal code repositories and CI/CD pipelines
        - id: N5
          label: 主权许可转化
          summary: Transition to multi-year recurring license with predictable flat-rate pricing
        - id: N6
          label: 扩张与战略变现
          summary: Contract value expansion across agency divisions and strategic technology licensing
    approximationNotes: 展示定性的商业与运营转化阶段；底层合同层面的利润率属于非公开信息。
    claimRefs:
      - CI001
      - CI003
      - CI012
      - CI013
  - id: FE001
    title: 产品架构与客户控制边界
    type: stack
    summary: 公开证据描述了从开发者界面到客户控制部署的六层架构，各层之间存在治理与模型服务依赖。
    data:
      layers:
        - label: 开发者界面
          detail: IDE、桌面端与终端界面收集工程任务。
          modules:
            - IDE 集成
            - 桌面端与终端代理
        - label: 代理执行
          detail: 容器化会话执行文件与工具操作。
          modules:
            - 会话容器
            - 代理轨迹
        - label: 企业集成
          detail: 集中管理的 MCP 服务器连接获批准的业务与工程工具。
          modules:
            - MCP 服务器
            - 工具连接器
        - label: 治理
          detail: 网络策略、机密处理、脱敏与审计记录约束执行。
          modules:
            - 策略控制
            - 可搜索审计记录
        - label: 模型与推理
          detail: 面向编码的模型与 Atlas 提供推理和本地服务。
          modules:
            - Poolside 模型
            - Atlas 推理
        - label: 客户基础设施
          detail: 裸机、气隙隔离的合作伙伴硬件或客户 VPC 部署，使执行始终处于选定边界内。
          modules:
            - 本地或气隙隔离
            - AWS、Azure 或 Google Cloud VPC
    approximationNotes: 这是对已描述组件的综合，并非已披露的底层网络图；组件排序不能证明实际实现或控制有效性。
    claimRefs:
      - CE004
      - CE005
      - CE015
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从 CISO 架构评估到前置部署工程扩展与主权多代理自动化的六阶段企业客户采用生命周期。
    data:
      items:
        - summary: >-
            Evaluation of air-gapped, on-premises, or private VPC deployment requirements without third-party cloud
            egress.
          touchpoints:
            - CISO 与安全架构师咨询
            - 基础镜像策略合规性验证
            - 无外部 GPU 外传的网络隔离验证
          label: 1. 架构范围界定与 CISO 安全审查
        - summary: Forward Deployed Research Engineers co-locate with client teams to configure the first internal workflow.
          touchpoints:
            - FDRE 与内部 Git 仓库和 CI/CD 集成
            - 加载上下文，并基于内部编码实践微调
            - 首批开发者在 VS Code、IntelliJ 或终端中测试
          label: 2. 前置部署概念验证试点
        - summary: Full deployment of Poolside Platform inside customer boundary under fixed subscription terms.
          touchpoints:
            - 通过 AWS 部署到客户裸机或托管私有 VPC
            - 集中管理的 MCP 服务器集成 Slack、Jira 与内部 API
            - 基于角色的访问控制与加密凭证注入
          label: 3. 初始生产部署
        - summary: Expansion across engineering teams from autocomplete to autonomous agentic software development.
          touchpoints:
            - 在开发者席位中推广 Laguna XS 端侧补全
            - 采用 Laguna M 多文件推理与测试生成
            - 记录可搜索的轨迹审计日志，以满足监管监督
          label: 4. 开发者工作流扩展
        - summary: Scaling across business units, subsidiaries, or defense mission branches via sovereign licensing.
          touchpoints:
            - 无限使用本地推理，不产生增量 token 费用
            - Poolside Federal LLC 参与机密项目 ATO
            - 集成到任务关键型软件供应链工作流
          label: 5. 部门与跨机构扩展
        - summary: End-to-end autonomous multi-agent engineering pipelines executing sandboxed tasks and pull requests.
          touchpoints:
            - 为旧有任务架构自动迁移代码
            - 在内部代码库上持续运行 RLCEF 合成训练反馈闭环
            - 成为全企业气隙隔离主权 AI 工程标准
          label: 6. 主权多代理自动化
    approximationNotes: 旅程阶段基于截至 2026 年 10 月的 Poolside Platform 架构披露、企业案例研究与合作伙伴部署工作流建模。
    claimRefs:
      - CU002
      - CU003
      - CU008
      - CU010
