        - 未披露经审计收入、ARR 或净留存指标，$12B 估值缺乏基本面支撑
        - 公开估算为 $30M-$50M，而官方披露仍为零
        - 披露超过 $100M 且企业净收入留存率处于行业前四分位的经审计 ARR
    notes: 核心论点综合公司定位与独立技术报告；null 表示不适用的触发条件。
    claimRefs:
      - CV002
      - CV006
      - CV007
      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 主权本地编码成为国防 / 金融领域的必需品；Model Factory 带来经常性许可收入
        - 通过 IPO 或超大市值战略收购实现 $20B-$30B 终值（相对 $12B 基准的 2.0x-2.5x MOIC）
        - 超大规模云厂商推出经认证的气隙隔离编码设备，以更低价格竞争
        - 20%
      - - 基准情景
        - Poolside 拿下专门的主权国防细分市场，Nvidia 集成则推动生态稳步采用
        - $10B-$14B 估值区间（约 1.0x MOIC），2027 年平价或小幅上调融资
        - 企业销售周期拉长，推理与研发持续高额烧钱
        - 55%
      - - 悲观情景
        - 编码模型商品化；Nvidia 向 109 名员工发出邀约后人才流失；折价轮或清算
        - $3B-$5B 估值（Series B 重组水平，资本损失 60%-75%）
        - 无法将联邦试点转化为企业 ARR，或投资者分配资金耗尽
        - 25%
    notes: 情景回报假设入场估值为 $12B；概率信号反映作者基于计算资源接入与商业销售漏斗的权重判断。
    claimRefs:
      - CV008
      - CV011
      - CV012
      - CV004
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Poolside 自 2023 年创立、Series B 扩张，到 2026 年春季 CoreWeave 集群取消，以及 2026 年 8 月 Nvidia 许可与股权交易这一里程碑事件。
    data:
      items:
        - date: 2023-04
          label: 公司注册成立
          detail: Jason Warner 与 Eiso Kant 在美国依法注册成立 Poolside, Inc.，开发 AI 编码基础模型。
          tone: neutral
          claimRefs:
            - CO001
        - date: 2023-05
          label: 种子轮融资（$26M）
          detail: 完成 $26M 种子轮融资，在巴黎和旧金山建立核心研究实验室。
          tone: positive
          claimRefs:
            - CO010
        - date: 2023-08
          label: Series A 轮融资（$100M）
          detail: 由 Felicis Ventures 与法国科技投资人 Xavier Niel 领投，按 $500M 估值完成 $100M Series A 轮融资。
          tone: positive
          claimRefs:
            - CO010
        - date: 2024-10
          label: Series B 轮融资（$500M）
          detail: 由 Bain Capital Ventures 领投，Nvidia、S Ventures 与 DST Global 参与，按 $3B 估值完成 $500M Series B 轮融资。
          tone: positive
          claimRefs:
            - CO010
        - date: 2024-12
          label: AWS Bedrock 合作
          detail: 宣布与 Amazon Web Services 建立战略联盟，通过 Amazon Bedrock 和 EC2 分发主权企业服务。
          tone: positive
          claimRefs:
            - CO004
        - date: 2025-10
          label: CoreWeave Project Horizon 宣布
          detail: 与 CoreWeave 公布在德州建设 2GW AI 计算园区的计划，以获得 40,000 个 GPU 训练集群。
          tone: positive
          claimRefs:
            - CO012
        - date: 2026-04
          label: CoreWeave Horizon 交易告吹
          detail: 谈判终止；$2B Series C 融资尝试停滞，原计划的 40,000 GB300 集群计算资源也未能获得。
          tone: negative
          claimRefs:
            - CO012
        - date: 2026-07
          label: Laguna 模型家族发布
          detail: 发布通过强化学习训练的 Laguna M.1、XS.2 与开放权重 Laguna S 2.1 编码模型。
          tone: positive
          claimRefs:
            - CO003
        - date: 2026-08
          label: Nvidia $7B 多部分交易
          detail: 执行 $6B 非独家 Model Factory 软件许可，并以 $12B 估值完成 $1B Series C 股权融资。
          tone: positive
          claimRefs:
            - CO013
            - CO014
            - CO015
    approximationNotes: 日期反映公开报道的公告月份。历史 Series B 估值采用已披露的交易数据。
    claimRefs:
      - CO001
      - CO003
      - CO004
      - CO010
      - CO012
      - CO013
      - CO014
      - CO015
  - id: FM001
    title: 市场规模视角：主权与受监管企业 AI 编码栈
    type: pyramid
    summary: 将可触达市场从全球软件工程支出逐层拆解至气隙隔离的主权编码部署。
    data:
      nodes:
        - label: 全球软件工程劳动力与预算
          value: $1.2T+
          unit: USD
          note: 宏观可触达开发者薪酬与 IT 支出的总基准
