  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从主权企业需求出发，经由资本冲击与估值张力，追踪至最终建议的决策路径。
    approximationNotes: 基于定性交易分析与量化估值倍数的顺序决策层级。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV008
      - CV013
    data:
      nodes:
        - id: tech-eval
          label: 企业主权需求
          description: 国防与金融机构需要不发生外部数据泄漏的气隙隔离本地代码 LLM。
        - id: licensing-deal
          label: Nvidia Model Factory 交易
          description: 非独家 $6B 许可验证了自动化模型创建平台与软件工程专长。
        - id: governance-overhang
          label: 投资者分配条款
          description: $6B 收益流向原股东，而不是运营研发资产负债表账户。
        - id: capital-shock
          label: CoreWeave 园区崩溃
          description: 德州 2GW 园区终止且 $2B Series C 融资失败，造成基础设施集中。
        - id: valuation-gap
          label: 估值立场：偏高
          description: 在缺少公开 ARR 指标的情况下，账面 $12B 估值意味着超过 240 倍的预估收入倍数。
        - id: final-recommendation
          label: 建议：继续研究
          description: 要求直接审计联邦销售漏斗转化、经常性毛利率与交易后的治理。
      edges:
        - from: tech-eval
          to: licensing-deal
          label: 验证技术
        - from: licensing-deal
          to: governance-overhang
          label: 分配现金
        - from: governance-overhang
          to: capital-shock
          label: 叠加影响
        - from: capital-shock
          to: valuation-gap
          label: 支撑立场
        - from: valuation-gap
          to: final-recommendation
          label: 得出评级
