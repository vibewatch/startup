  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：直接同业、既有巨头与替代方案
        blocks:
          - type: paragraph
            body: >-
              企业生成式 AI 软件工程市场分为三个竞争层级：云原生既有助手、风险投资支持的代码专用前沿实验室，以及通用前沿基础模型。在既有巨头阵营中，Microsoft 的 GitHub Copilot 通过深度整合
              Visual Studio Code 和企业 Microsoft 许可协议保持强大分发，成为 AI 辅助开发的现状基准。直接的风险投资支持挑战者包括 Magic（2024 年融资
              $320M，用于构建超长上下文软件合成模型）和 Codeium（凭借广泛的多语言支持达到 $1.25B 估值）。此外，OpenAI、Anthropic 和 Mistral AI 等前沿基础模型实验室也通过云
              API 提供前沿推理模型。云端助手在个人开发者体验上占优，但国防、情报和一级银行的受监管买方会评估气隙主权方案，因为专有源代码不会穿越公有云边界。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
