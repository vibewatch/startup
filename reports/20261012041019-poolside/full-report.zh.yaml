      - number: '3.3'
        title: 定价与产品打包：可预测的算力经济学与 token 波动
        blocks:
          - type: paragraph
            body: >-
              AI 软件开发的商业定价，在按用量计费的云 API 与基于基础设施的许可之间存在显著差异。传统云平台按席位收取订阅费，或按输入和输出 token
              收取消费费；自主多步智能体持续执行推理和测试循环时，预算会不可预测地上升。相比之下，Poolside 把主权企业方案打包为与硬件绑定的可预测订阅，在客户专用 GPU
