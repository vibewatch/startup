              2026 年春季，Poolside 与 CoreWeave 在得州建设 2 吉瓦数据中心的谈判破裂，凸显维持前沿模型水平所需的资本和基础设施强度。随后 Nvidia 以 $7B
              许可和投资交易解决了即时算力与流动性压力，但也引入了显著的供应商集中度，使 Poolside 的独立硬件路线从属于 Nvidia 的企业生态。
