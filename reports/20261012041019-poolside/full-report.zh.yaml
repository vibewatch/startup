      - number: '1.3'
        title: 资本化轨迹与 2026 年 8 月 Nvidia 交易
        blocks:
          - type: paragraph
            body: >
              Poolside 的资本化历史跻身企业软件史上融资速度最快的案例之列。公司于 2023 年 5 月完成 $26M 种子轮，2023 年 8 月完成 $100M A 轮，随后于 2024 年 10 月完成
              $500M B 轮。该轮由 Bain Capital Ventures 领投，Nvidia、DST Global、StepStone Group、Citi Ventures、HSBC Ventures 和
              SentinelOne（S Ventures）参与，投后估值为 $3.0B。2026 年春季，Poolside 与 CoreWeave 谈判接入规划中的 2 吉瓦数据中心集群失败，导致 Project
              Horizon 终止；公司筹备中的 $2B C 轮融资也因此停滞，并失去原计划中的 40,000 台 GB300 GPU 集群。

              2026 年 8 月 20 日，Poolside 与 Nvidia 达成总额 $7B 的多部分交易，彻底解决了这一基础设施瓶颈。交易包括两项内容：第一，Nvidia 为 Poolside 的专有 Model
              Factory 训练与评估平台支付 $6B 非排他性商业许可费，这笔资本计划在 2027 年底前分配给 Poolside 现有投资人，而不是作为公司运营现金；第二，Nvidia 以 $12B 投前估值向
              Poolside 直接投资 $1B（投后约 $13B）。关键在于，该协议是非排他性许可和少数股权投资，而非收购，因此 Poolside 保留了公司独立性和商业行动自由。
