              普通代码助手主要依靠公有云 API 和按席位 SaaS 定价竞争，而 Poolside
              的可服务市场由企业和政府的数据驻留要求定义。公司提供完整模型权重、本地执行和气隙容器化，从而避开云端数据外传合规禁令；这些禁令会把公有 LLM 排除在机密和高度受监管环境之外。
