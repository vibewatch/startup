        title: 成本结构与基础设施经济性
        blocks:
          - type: paragraph
            body: >-
              前沿代码模型开发的成本结构资本密集度极高，主要由预训练算力和集群运营驱动。2026 年以前，Poolside 的年化算力支出估计约为
              $400M，在实现正毛利前造成了大量现金消耗。为获得主权算力独立性，Poolside 于 2025 年 10 月宣布 Project Horizon，计划在得州 Pecos County 建设雄心勃勃的 2
              吉瓦数据中心园区，并通过表后空气衍生涡轮机利用廉价的放空天然气。根据初始协议，CoreWeave 将作为首个 250MW 阶段的 15 年锚定租户，并同意提供一个配备超过 40,000 台 Nvidia
              GB300 NVL72 GPU 的 AI 集群。但 Poolside 同期筹备的 $2B C 轮融资于 2026 年春季未能完成后，CoreWeave 终止租约，并将 40,000 台 GPU
              调配至其他设施。Poolside 随后采取防守性现金保全措施，暂停交付周期长的燃气涡轮机承诺，并重组场地开发以保护运营流动性。
