      - number: '2.4'
        title: 结构性增长动力、基础设施约束与尽调风险
        blocks:
          - type: paragraph
            body: >-
              多项长期顺风因素正在推高企业对主权 AI 软件工程的需求，包括遗留任务软件不断累积的技术债、对代码隐私日益严格的监管审查，以及软件需求与工程人才供给之间不断扩大的生产率缺口。Poolside
              从代码执行反馈中进行强化学习，为多步推理和自动重构提供了有防守力的架构基础。但商业扩张仍受明显的采用摩擦和结构性瓶颈制约。企业部署销售和实施周期很长，往往需要前置部署研究工程师进入客户团队完成定制集成。此外，主权基础设施模式需要大量算力来完成客户侧模型微调和推理。2026
              年春季，Poolside 与 CoreWeave 就得州 Pecos County 2 吉瓦数据中心园区的谈判破裂，直接暴露了这一算力脆弱性，打乱扩张计划并最终促成与 Nvidia
              的交易。再加上公司没有公开收入、客户留存基准或可供核验的生产案例，独立验证经济性成为尽调的关键障碍。
            claimRefs:
