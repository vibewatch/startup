      - number: '2.3'
        title: 买方画像、采购机制与部署授权
        blocks:
          - type: paragraph
            body: >-
              主权 AI 软件工程的采用路径和采购周期，与传统开发者工具采购有明显差异。个人席位制代码助手通常通过工程部门信用卡列支，或由开发者自下而上采用；Poolside 平台则需要由上而下的企业采购，涉及
              CIO、CISO 和专门的风险委员会。商业企业的经济买方是企业 CIO
              和基础设施负责人，他们希望现代化改造遗留应用，同时严格执行防止数据泄露的规则，不暴露专有源代码库。联邦和国防部门则通过正式国防合同工具、联邦项目执行办公室，以及 Vibrint、Sterling
              Computers 和 Hunted Labs 等战略系统集成商采购。在这些敏感领域获得部署授权，需要经过审查的人员、符合 STIG 的加固，以及在专用本地硬件上完成气隙一体化部署。由于 Poolside
              模型不产生数据外传，也不收取按 token 计费的 API 费用，经济买方可以把软件工程自动化列为可预测的资本支出，而不是不受约束的可变运营成本。
