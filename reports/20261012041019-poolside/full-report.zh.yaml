  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、核心支出类别与传统替代方案
        blocks:
          - type: paragraph
            body: >-
              软件工程人工智能的商业市场跨度很大，从面向消费者的自动补全插件一直延伸到主权基础模型基础设施。Poolside 明确处于基础设施与企业市场的交界处，服务范围不同于依赖公有多租户云 API
              的普通消费者代码助手。Poolside 的核心可服务支出包括自管推理引擎、开放权重代码模型、企业智能体编排平台，以及直接部署在客户安全边界内的专用 Model Factory 工具链。目标客户包括 Global
              2000 企业、受监管金融机构和公共部门国防机构；这些组织因知识产权政策或法定数据驻留要求，禁止将专有代码传出至第三方多租户云。该边界不包括低 ACV 的个人开发者订阅、未受管理的公有 SaaS copilot
              和通用消费者聊天机器人外壳。现有替代方案包括静态分析工具、基于规则的 IDE 扩展、人工软件测试工作流，以及托管在商业超大规模云上的通用 LLM API 端点。
            claimRefs:
              - CM001
              - CM002
