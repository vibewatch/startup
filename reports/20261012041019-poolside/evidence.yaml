evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: Audited GAAP annual recurring revenue (ARR), gross margins, net retention rate, and cash burn rate.
    whyItMatters: >-
      External tracker estimates of $50M-$66.4M are modeled estimates and cannot confirm true commercial software
      adoption quality.
    diligencePath: >-
      Request confidential management financial accounts, signed customer contract ACVs, and software gross margin
      schedules.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: talent-and-research-roadmap
    missingEvidence: >-
      Post-transaction product roadmap and remaining core engineering staff count following the transition of 109
      research staff to Nvidia.
    whyItMatters: >-
      The departure of 109 foundation research engineers could impact Poolside's ability to develop future proprietary
      frontier model generations.
    diligencePath: >-
      Interview executive leadership on post-August 2026 organizational design, engineering hiring plans, and
      application-layer vs model research strategy.
    relatedQuestionRefs:
      - QO002
      - QO006
    relatedTableRefs:
      - TO001
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: investor-syndicate-completeness
    missingEvidence: >-
      Complete cap table and voting share registry identifying minority institutional participants and angel investors
      beyond the disclosed lead institutions.
    whyItMatters: >-
      Full capitalization structure and side-letter rights are required to understand voting thresholds and distribution
      waterfalls for licensing proceeds.
    diligencePath: >-
      Examine corporate cap table ledger, series-by-series investor rights agreements, and licensing liquidation
      waterfall documents.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue-and-contracted-backlog
    missingEvidence: >-
      Audited or disclosed annualized recurring revenue (ARR), recognized contract revenue, and contract backlog
      specific to Poolside's enterprise and defense deployments.
    whyItMatters: >-
      Without disclosed commercial revenue or contract values, market penetration and SOM capture cannot be quantified
      with public accounting rigor.
    diligencePath: >-
      Obtain customer contract disclosures, customer reference calls, or auditor-reviewed financial statements during
      private diligence.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitive-win-loss
    missingEvidence: >-
      Audited head-to-head win-loss data, bake-off win rates, and enterprise displacement statistics comparing Poolside
      against GitHub Copilot and Anthropic Enterprise within regulated environments.
    whyItMatters: >-
      Without referenceable commercial customer evaluations demonstrating superior developer velocity and retention
      against incumbent assistants, defensibility against cloud API feature releases remains unproven.
    diligencePath: >-
      Request anonymized procurement bake-off evaluations, customer displacement case studies, and contract renewal
      figures from enterprise and defense pilot deployments.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: enterprise-sales-efficiency
    missingEvidence: >-
      Audited cohort-level CAC payback periods, average contract values across public and private sector accounts, and
      channel margin concessions.
    whyItMatters: >-
      Without verified CAC payback and contract margins, underwriting cannot evaluate whether forward-deployed
      engineering and on-premises deployment costs dilute long-term software economics.
    diligencePath: >-
      Request customer contract schedules, commission and professional services delivery expense logs, and partner
      margin terms under NDA during confirmatory due diligence.
