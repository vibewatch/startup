callouts:
  - calloutType: "insight"
    title: "Sovereignty as an Architectural Moat Against Commodity Cloud Copilots"
    body: "While commodity coding assistants compete primarily on public cloud APIs and per-seat SaaS pricing, Poolside's addressable market is defined by enterprise and government data residency mandates. By providing full model weights, on-premises execution, and air-gapped containerization, the company insulates itself from cloud-egress compliance prohibitions that lock public LLMs out of classified and highly regulated environments."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM005"
      - "CM012"
  - calloutType: "risk"
    title: "Compute Scaling Vulnerability and Strategic Vendor Interdependence"
    body: "The collapse of Poolside's two-gigawatt CoreWeave Texas data center negotiations in spring 2026 underscored the extreme capital and infrastructure intensity required to maintain frontier model parity. Although the subsequent $7 billion Nvidia licensing and investment transaction resolved immediate compute and liquidity pressures, it introduced significant vendor concentration, subordinating Poolside's independent hardware roadmap to Nvidia's enterprise ecosystem."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM008"
