      - number: '4.3'
        title: Cost Structure and Infrastructure Economics
        blocks:
          - type: paragraph
            body: >-
              The cost structure of frontier code model development imposes extreme capital intensity, driven primarily
              by pre-training compute and cluster operations. Prior to 2026, Poolside's annualized compute expenditures
              were estimated at approximately $400 million, generating substantial cash burn before reaching positive
              gross margins. To secure sovereign compute independence, Poolside announced Project Horizon in October
              2025, planning an ambitious 2-gigawatt data center campus in Pecos County, Texas, designed to exploit
              cheap flared natural gas via behind-the-meter aero-derivative turbines. Under the initial agreement,
              CoreWeave contracted as the 15-year anchor tenant for the first 250MW phase and agreed to supply an AI
              cluster with over 40,000 Nvidia GB300 NVL72 GPUs. However, when Poolside's parallel $2 billion Series C
              failed to close in spring 2026, CoreWeave terminated the lease and reallocated the 40,000 GPUs to other
              facilities. Poolside subsequently enacted defensive cash preservation measures, pausing long-lead gas
              turbine commitments and restructuring site development to protect operating liquidity.
            claimRefs:
