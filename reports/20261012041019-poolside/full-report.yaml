  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Poolside monetizes its software intelligence through dedicated enterprise and sovereign deployments,
              positioning its Laguna foundation models and multi-agent systems for high-security environments. In sharp
              contrast to public hyperscaler models that charge per-token API inference fees, Poolside provides
              government and regulated enterprise customers with full model weights deployed on-premises or in
              air-gapped perimeters with zero external egress. Under this sovereign licensing architecture, client
              organizations pay fixed annual software license fees and run unlimited inference on their own hardware
              clusters, establishing a highly predictable procurement model for enterprise IT and defense programs. The
              platform also integrates the proprietary Atlas inference engine, which Poolside reports improves hardware
              compute utilization by up to 30%, optimizing total cost of ownership on customer infrastructure. Beyond
              recurring sovereign software subscriptions, Poolside has demonstrated the capacity to realize non-dilutive
              strategic technology monetization, evidenced by a landmark non-exclusive software licensing transaction
              for its Model Factory platform.
            claimRefs:
              - CI001
              - CI008
              - CI012
