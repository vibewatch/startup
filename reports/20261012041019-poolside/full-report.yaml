          touchpoints:
            - FDRE integration with internal git repositories and CI/CD
            - Context-loading and fine-tuning on internal coding practices
            - Initial developer cohort testing in VS Code, IntelliJ, or terminal
          label: 2. Forward-Deployed Proof-of-Concept Pilot
        - summary: Full deployment of Poolside Platform inside customer boundary under fixed subscription terms.
          touchpoints:
            - Deployment on customer bare metal or managed private VPC via AWS
            - Centrally managed MCP server integration to Slack, Jira, and internal APIs
            - Role-based access control and encrypted credential injection
          label: 3. Initial Production Deployment
        - summary: Expansion across engineering teams from autocomplete to autonomous agentic software development.
          touchpoints:
