      - number: '5.3'
        title: Deployment, implementation, and operating maturity
        blocks:
          - type: paragraph
            body: >-
              Poolside says the Platform can run on customer bare metal, on partner-delivered air-gapped hardware, or
              inside existing AWS, Azure, and Google Cloud virtual private clouds. Its government offering goes further,
              promising delivery of full model weights and operation without external calls, data egress, or shared
              systems. Implementation is service-assisted: Poolside says forward-deployed research engineers work with
              customer teams to identify workflows, ship an initial automation in weeks, and then harden and measure it.
              That support model may reduce implementation friction, but it also makes delivery capacity a dependency.
              No assigned source provides a public service-level agreement, status history, incident record, deployment
              duration distribution, or independent evidence of production reliability at scale.
            claimRefs:
              - CE004
              - CE005
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
