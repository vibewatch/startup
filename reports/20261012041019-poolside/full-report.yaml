  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Core Spend Categories, and Legacy Substitutes
        blocks:
          - type: paragraph
            body: >-
              The commercial market for artificial intelligence in software engineering spans a wide continuum from
              consumer autocomplete plug-ins to sovereign foundation model infrastructure. Poolside operates decisively
              at the infrastructure and enterprise boundary, distinguishing its addressable scope from commodity
              consumer coding assistants that rely on public multi-tenant cloud APIs. The core addressable spend for
              Poolside consists of self-managed inference engines, open-weight coding models, enterprise agent
              orchestration platforms, and specialized Model Factory toolchains deployed directly inside customer
              security boundaries. Organizations targeting these solutions include Global 2000 enterprises, regulated
              financial institutions, and public-sector defense agencies where intellectual property policies or
              statutory data residency requirements prohibit the egress of proprietary code to third-party multi-tenant
              clouds. Excluded from this boundary are low-ACV individual developer subscriptions, unmanaged public SaaS
              copilots, and generic consumer chatbot wrappers. Status-quo substitutes include existing static analysis
              tools, rules-based IDE extensions, manual software testing workflows, and general-purpose LLM API
              endpoints hosted on commercial hyperscaler clouds.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
      - number: '2.2'
        title: Addressable Market Sizing, Growth Vectors, and Valuation Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the addressable market for Poolside requires decomposing broad software engineering expenditure
              into concrete, evidence-constrained sizing layers. At the macro baseline, global software engineering
              labor compensation and enterprise development budgets exceed $1.2 trillion annually, reflecting an
              enduring global shortage of qualified developers and persistent engineering delivery backlogs. Within this
              macro foundation, the total addressable market (TAM) for AI-assisted software development tooling is
              estimated between $25 billion and $35 billion by 2026, expanding at a compound annual growth rate of 30%
              to 45% as enterprises transition from simple code completion to autonomous multi-file agent workflows. The
              serviceable addressable market (SAM) for sovereign, on-premises, and VPC-restricted enterprise AI is
              estimated at $6 billion to $10 billion, driven primarily by regulated industries such as aerospace,
              defense, banking, healthcare, and public sector governance. Within this SAM, Poolside's serviceable
              obtainable market (SOM) represents the high-security subsegment of $1.5 billion to $3 billion in
              air-gapped, sovereign, and defense deployments. The market valuation benchmark was dramatically reshaped
              on August 20, 2026, when Nvidia committed to a $6 billion non-exclusive license for Poolside's Model
              Factory software alongside a $1 billion equity investment at a $12 billion pre-money valuation.
            claimRefs:
              - CM001
