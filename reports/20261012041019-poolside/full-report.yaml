      - number: '5.2'
        title: Architecture, models, and training mechanism
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a layered operating model rather than a single coding assistant. Developer surfaces
              sit above agent execution and Model Context Protocol integrations; governance controls constrain
              credentials, networks, and audit records; Poolside models and the Atlas inference engine provide the
              intelligence and serving layers; and deployments run on customer-controlled infrastructure or cloud
              virtual private networks. Third-party profiles describe a 2026 lineup of Malibu, Point, and Laguna, while
              Poolside's government page claims Atlas can improve model performance by up to 30%. AI Engineer and
              SentinelOne both describe reinforcement learning from code execution, in which compilation and test
              outcomes provide feedback. These architecture and performance statements remain mostly vendor or investor
              sourced rather than independently benchmarked.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE008
              - CE013
