        title: Exhibits
        blocks:
          - type: callout
            title: Sovereignty as an Architectural Moat Against Commodity Cloud Copilots
            body: >-
              While commodity coding assistants compete primarily on public cloud APIs and per-seat SaaS pricing,
              Poolside's addressable market is defined by enterprise and government data residency mandates. By
              providing full model weights, on-premises execution, and air-gapped containerization, the company
              insulates itself from cloud-egress compliance prohibitions that lock public LLMs out of classified and
              highly regulated environments.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM012
          - type: callout
            title: Compute Scaling Vulnerability and Strategic Vendor Interdependence
            body: >-
              The collapse of Poolside's two-gigawatt CoreWeave Texas data center negotiations in spring 2026
              underscored the extreme capital and infrastructure intensity required to maintain frontier model parity.
              Although the subsequent $7 billion Nvidia licensing and investment transaction resolved immediate compute
              and liquidity pressures, it introduced significant vendor concentration, subordinating Poolside's
              independent hardware roadmap to Nvidia's enterprise ecosystem.
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM008
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Direct Peers, Incumbents, and Substitutes'
        blocks:
          - type: paragraph
            body: >-
              The enterprise generative AI software engineering market comprises three distinct competitive tiers:
              cloud-native incumbent assistants, venture-backed code-specialized frontier labs, and general-purpose
              frontier foundation models. At the incumbent layer, Microsoft's GitHub Copilot maintains dominant
              distribution through deep integrations into Visual Studio Code and enterprise Microsoft licensing
              agreements, serving as the status-quo benchmark for AI-assisted development. Direct venture-backed
              challengers include Magic, which raised $320 million in 2024 to build ultra-long-context models for
              software synthesis, and Codeium, which reached a $1.25 billion valuation on broad multi-language support.
              In addition, frontier foundation labs including OpenAI, Anthropic, and Mistral AI offer frontier reasoning
              models through cloud APIs. While cloud assistants excel in individual developer ergonomics, regulated
              buyers in defense, intelligence, and tier-one banking evaluate air-gapped sovereign solutions where
              proprietary source code never traverses public cloud boundaries.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
      - number: '3.2'
        title: 'Capability Differentiation: Sovereign Weights vs Multi-Tenant Cloud APIs'
        blocks:
          - type: paragraph
            body: >-
              Poolside differentiates structurally from cloud-first competitors by delivering complete model weights
              directly into customer environments, enabling fully air-gapped execution with zero telemetry or outbound
              network calls. Whereas GitHub Copilot and Anthropic require code snippets or AST representations to be
              transmitted to multi-tenant cloud data centers, Poolside's Laguna foundation models operate on
              customer-owned infrastructure or secure turnkey clusters. The platform provides a containerized agent
              runtime with Model Context Protocol connectors to internal enterprise systems, capturing complete
              reasoning trajectories while redacting credentials at runtime. On independent evaluations, Poolside's
              proprietary Laguna M.1 achieved 46.9% on SWE-bench Pro and 72.5% on SWE-bench Verified, outperforming
              Devstral 2 while approaching frontier cloud models, while its open-weight Laguna XS.2 delivered 44.5% on
              SWE-bench Pro within a lightweight 33-billion parameter footprint.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
