      - number: '2.3'
        title: Buyer Personas, Procurement Dynamics, and Deployment Authority
        blocks:
          - type: paragraph
            body: >-
              Adoption paths and procurement cycles for sovereign AI software engineering diverge sharply from
              conventional developer tool purchases. While individual seat-based coding assistants are typically
              expensed via engineering departmental credit cards or bottom-up developer adoption, Poolside's platform
              requires top-down enterprise procurement involving Chief Information Officers, Chief Information Security
              Officers, and specialized risk committees. In the commercial enterprise sector, economic buyers are
              enterprise CIOs and heads of infrastructure seeking to modernize legacy applications and enforce strict
              data loss prevention rules without exposing proprietary source repositories. In the federal and defense
              sectors, procurement operates through formal defense contract vehicles, federal program executive offices,
              and strategic systems integrators such as Vibrint, Sterling Computers, and Hunted Labs. Deployment
              authorization in these sensitive domains demands cleared personnel, STIG compliance hardening, and
              air-gapped turnkey execution on dedicated on-premises hardware. Because Poolside models operate with zero
              data egress and eliminate per-token API charges, economic buyers can budget software engineering
              automation as a predictable capital expenditure rather than an unconstrained variable operating cost.
            claimRefs:
              - CM001
              - CM002
