      - number: '3.3'
        title: 'Pricing and Packaging: Predictable Compute Economics vs Token Volatility'
        blocks:
          - type: paragraph
            body: >-
              Commercial pricing models in AI software development diverge significantly between usage-metered cloud
              APIs and infrastructure-based licensing. Traditional cloud platforms charge per-seat subscription rates or
              consumption fees tied to input and output tokens, creating unpredictable budget escalation when autonomous
              multi-step agents execute continuous reasoning and testing loops. In contrast, Poolside packages its
              sovereign enterprise solution as a predictable hardware-tied subscription with unlimited inference across
              dedicated customer GPUs. To catalyze developer adoption and research ecosystem mindshare, Poolside also
              released Laguna XS.2 under a permissive Apache 2.0 open-source license, allowing developers to execute
              local agentic workflows on standard workstation GPUs without recurring licensing fees. However, deploying
              on-premises models introduces material hardware capitalization requirements, demanding high-memory
              workstation chips or enterprise server clusters.
            claimRefs:
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: 'Moat Durability: Strategic Alliances, Talent Attrition, and Displacement Threats'
        blocks:
          - type: paragraph
            body: >-
              Poolside's competitive defensibility rests on sovereign regulatory positioning rather than an
              insurmountable lead in raw algorithmic intelligence. Frontier foundation labs like Anthropic continue to
              push benchmark frontiers, making closed cloud APIs formidable alternatives whenever data protection
              exceptions can be secured. Furthermore, Poolside faces significant organizational transition following its
              August 2026 transaction with Nvidia, wherein Nvidia paid a $6 billion non-exclusive license fee for
              Poolside's core Model Factory training software and absorbed 109 of Poolside's 130 employees. While
              co-founders Jason Warner and Eiso Kant retained independence, corporate equity, and customer
              relationships, operating with a streamlined team of approximately 20 employees presents delivery risks
              against hyper-scaled incumbents. To sustain differentiation, Poolside relies on enterprise distribution
              partnerships with Amazon Web Services and Atos, as well as clearance-backed solutions architects embedded
              within national security agencies.
            claimRefs:
              - CP012
              - CP013
              - CP014
