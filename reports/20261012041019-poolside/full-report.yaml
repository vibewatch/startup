      - number: '4.2'
        title: Commercial Traction and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Poolside's go-to-market motion relies on high-touch direct enterprise engagements and federal systems
              partnerships rather than low-friction self-serve developer acquisition. Through its dedicated
              public-sector vehicle, Poolside Federal LLC, the company has secured integration partnerships with
              national security contractors, including Vibrint and Hunted Labs, to deploy air-gapped coding models into
              sensitive federal missions. Enterprise accounts typically require forward-deployed solutions architects to
              configure security boundaries, fine-tune models on internal code repositories, and integrate existing
              continuous integration pipelines. However, this high-touch sovereign delivery motion entails extended
              enterprise sales cycles and substantial upfront deployment costs. Public reporting indicates that
              Poolside's annualized enterprise run rate remained below $50 million as of the first quarter of 2026.
              While commercial adoption is supported by corporate venture backers including SentinelOne's S Ventures,
              comprehensive metrics on customer acquisition costs, net revenue retention, and realized contract payback
              periods remain undisclosed private data.
