      - number: '4.4'
        title: Capital Adequacy and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Poolside's financing trajectory illustrates both the fragility and resilience of capitalization in
              frontier artificial intelligence. After raising $500 million in its October 2024 Series B at a $3 billion
              valuation, the company faced an existential financing bottleneck when its $2 billion Series C collapsed in
              April 2026 amid investor skepticism over $400 million in annual compute spend against sub-$50 million in
              revenue. Nevertheless, Poolside dramatically reshaped its balance sheet in August 2026 through a dual
              transaction with Nvidia: a $1 billion primary equity investment at a $12 billion pre-money valuation
              alongside a $6 billion non-exclusive software licensing agreement for its Model Factory technology. This
              transaction expanded Poolside's total primary equity funding to $1.63 billion and provided extraordinary
              non-equity cash reserves, securing multi-year runway without immediate financing dependency. Nonetheless,
              from an underwriting perspective, the financial verdict remains cautious: while near-term solvency is
              insulated by licensing proceeds, the underlying software business still requires empirical diligence on
              recurring gross margins, customer retention, and sustainable unit economics.
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI008
              - CI009
              - CI010
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital Intensity and Infrastructure Financing Dependency
            body: >-
              Project Horizon demonstrated the acute hazards of startup-led gigawatt infrastructure buildouts. While the
              August 2026 Nvidia transactions restored near-term liquidity, Poolside's core unit economics remain
              tethered to massive training compute costs that require continued commercial validation.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI011
          - type: callout
            title: Sovereign Positioning as a Pricing Defense
            body: >-
              By eliminating per-token fees and packaging full model weights for air-gapped environments, Poolside
              bypasses direct commodity price competition against public cloud APIs, targeting high-ACV procurement
              budgets in defense and regulated enterprise sectors.
            calloutType: insight
            claimRefs:
              - CI001
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Poolside's product is not just a model endpoint: the public product description spans developer
              interfaces, centrally managed integrations, containerized execution, and administrative controls. Poolside
              says agents operate in VS Code, Visual Studio, Zed, IntelliJ, and the terminal, while AI Engineer also
              describes a macOS Desktop Assistant capable of running multiple coding agents across projects. The
              intended workflow starts where developers already work, gives an agent repository and tool access through
              managed connections, executes each session in a controlled container, and records the resulting actions
              for administrators. This design is most differentiated for buyers that cannot accept source-code egress,
              but the assigned evidence does not quantify developer adoption or productivity gains.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE012
