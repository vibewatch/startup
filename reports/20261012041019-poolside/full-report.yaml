      - number: '1.3'
        title: Capitalization Trajectory and the August 2026 Nvidia Deal
        blocks:
          - type: paragraph
            body: >
              Poolside's capitalization history reflects one of the fastest capital-raising trajectories in enterprise
              software history. Following a $26M seed round in May 2023 and a $100M Series A in August 2023, Poolside
              closed a $500M Series B in October 2024 led by Bain Capital Ventures with participation from Nvidia, DST
              Global, StepStone Group, Citi Ventures, HSBC Ventures, and SentinelOne (S Ventures) at a post-money
              valuation of $3.0B. In spring 2026, Poolside faced operational turbulence when negotiations with CoreWeave
              for access to a planned 2-gigawatt data center cluster collapsed, leading to the termination of Project
              Horizon and stalling an attempted $2B Series C financing that resulted in the loss of access to an
              anticipated 40,000 GB300 GPU cluster.


              This infrastructure bottleneck was decisively resolved on August 20, 2026 through a multi-part transaction
              with Nvidia totaling $7B in overall financial commitments. The transaction comprised two distinct
              elements: first, a $6B non-exclusive commercial license fee paid by Nvidia for Poolside's proprietary
              Model Factory training and evaluation platform (capital earmarked for distribution to Poolside's existing
              investors by the end of 2027 rather than company operating cash); and second, a separate $1B direct equity
              investment from Nvidia into Poolside at a $12B pre-money valuation (approximately $13B post-money).
              Crucially, the agreement was structured as a non-exclusive license and minority equity participation
              rather than an acquisition, allowing Poolside to preserve corporate independence and commercial freedom of
              action.
            claimRefs:
              - CO010
              - CO011
