      - number: '1.2'
        title: Executive Leadership, Governance, and Organizational Scale
        blocks:
          - type: paragraph
            body: >
              Poolside is led by co-founders Jason Warner (Chief Executive Officer) and Eiso Kant (Chief Technology
              Officer, who has also served as co-CEO in operating documentation). Prior to co-founding Poolside, Warner
              served as Chief Technology Officer at GitHub, where he directed the engineering incubation and release of
              category-defining developer tools including GitHub Copilot, GitHub Actions, and GitHub Codespaces,
              following earlier leadership roles at Heroku, Canonical, and venture firm Redpoint Ventures. Kant brought
              complementary domain expertise as a pioneer in AI-assisted code analysis, having founded source{d} in 2015
              as an early codebase analysis startup and later building engineering intelligence platform Athenian.


              The executive bench was further strengthened through the recruitment of former GitHub Chief Revenue
              Officer Paul St. John to lead enterprise go-to-market initiatives, and augmented technologically through
              the 2025 acquisition of Fern Labs, which contributed multi-agent orchestration infrastructure and
              forward-deployed engineers. Commercial and institutional backing is anchored by lead venture investors
              Bain Capital Ventures and Felicis Ventures alongside corporate backers including Nvidia, SentinelOne's S
              Ventures, Citi Ventures, and Adams Street Partners. A structural leadership transition occurred in August
              2026, when 109 core engineers focused on foundation model development transitioned to Nvidia following an
              enterprise licensing transaction, while founders Warner and Kant remained at Poolside to guide the
              company's independent product roadmap.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
