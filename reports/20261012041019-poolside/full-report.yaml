  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Enterprise & Public Sector Customer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Poolside concentrates its commercial and public-sector go-to-market strategy on large organizations
              operating in highly regulated, security-critical environments where standard multi-tenant cloud AI coding
              tools face strict compliance barriers. The company's primary buyers are enterprise Chief Information
              Security Officers, Chief Information Officers, and federal program managers whose institutional policies
              strictly prohibit source code egress to third-party endpoints. Instead of selling a generic SaaS
              subscription, Poolside delivers the Poolside Platform across three core target segments: defense and
              national security organizations requiring air-gapped deployment, Tier-1 financial services institutions
              managing complex legacy codebases under regulatory oversight, and large technology enterprises with
              substantial internal engineering workforces. Across these segments, Poolside offers predictable
              subscription pricing with full control over model weights rather than variable token consumption billing,
              directly resolving the budget volatility and data sovereignty concerns that frequently stall commercial AI
              adoption in large enterprises.
            claimRefs:
              - CU001
              - CU002
              - CU003
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
      - number: '6.2'
        title: Adoption Trajectory & Growth Metrics
        blocks:
          - type: paragraph
            body: >-
              Poolside targets enterprises with 5,000 or more developers, orienting its commercial expansion toward
              high-annual-contract-value relationships rather than mass developer self-service. While the company has
              not publicly released audited GAAP revenue figures or official paying account counts, private market
              intelligence and survey estimates from GetLatka indicate that Poolside's annualized revenue run-rate
              reached approximately $30 million by December 2024 and scaled toward $50 million as of early 2025
              following its $500 million Series B financing. This estimated trajectory reflects substantial expansion
              from early experimental pilots into multi-million dollar annual software and professional service
              contracts. However, assessing Poolside's true commercial adoption requires recognizing the missing
              denominators in public reporting: the total count of paying production accounts, average contract values,
              and the exact division between recurring software licenses and forward-deployed engineering professional
              services remain unconfirmed private data. Furthermore, Tracxn identifies over 1,100 active competitors in
              the broader AI software engineering space, underscoring that Poolside must continuously prove
              differentiated return on investment against entrenched incumbent tools.
            claimRefs:
              - CU001
              - CU009
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU009
              - CU011
              - CU012
      - number: '6.3'
        title: Named Customer Deployments & Defense Validation
        blocks:
          - type: paragraph
            body: >-
              Publicly referenceable customer deployments for Poolside are concentrated in national security, defense
              technology, and specialized infrastructure engineering. Hunted Labs, a software supply chain security
              company, has deployed Poolside models both to enhance internal secure code development and to support
              software security initiatives for American warfighter missions. In the federal public sector, Poolside
              operates through Poolside Federal LLC (CAGE Code 11R53), partnering with established defense systems
              integrators including Vibrint and Sterling Computers to deliver air-gapped coding models and full-stack AI
              workstations to classified government installations. Furthermore, defense industry intelligence reports
              that major American aerospace and defense contractors, including RTX Corporation, have evaluated or
              deployed Poolside's customizable foundation models within secure computing facilities. These defense-grade
              deployments validate Poolside's unique air-gapped value proposition, although contract specifics and
              production seat counts remain protected under confidentiality constraints.
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.4'
        title: Customer Journey, Expansion Loops & Retention Dynamics
        blocks:
          - type: paragraph
            body: >-
              The customer adoption journey for Poolside diverges sharply from conventional developer tools that rely on
              bottoms-up developer self-serve adoption. The engagement typically begins at the CISO and infrastructure
              architecture level, where security teams verify that the Poolside Platform can run entirely within the
              customer's security boundary on bare metal, air-gapped clusters, or private cloud VPCs without outbound
              connectivity. To bridge the gap from initial deployment to measurable productivity, Poolside deploys
              Forward Deployed Research Engineers who embed alongside customer engineering teams to identify
              high-leverage workflows and integrate models into internal toolchains via Model Context Protocol servers.
              As demonstrated by infrastructure partner Baseten, which enabled rapid deployment of Poolside's Laguna
              model family with sub-second response times, operational performance is critical to developer
              satisfaction. However, because Poolside does not publicly report net revenue retention rates, gross
              renewal rates, or contract duration cohorts, the durability of its expansion loop and the extent to which
              initial pilots convert into broad enterprise-wide developer rollouts remain vital diligence questions.
            claimRefs:
              - CU002
              - CU007
              - CU008
              - CU010
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU008
              - CU010
      - number: '6.5'
        title: Procurement Friction, Concentration & Competitive Headwinds
        blocks:
          - type: paragraph
            body: >-
              Despite its strong sovereign positioning, Poolside faces material customer adoption risks rooted in
              prolonged enterprise sales cycles and heavy competitive pressure. Independent research from Sacra
              emphasizes that selling complex on-premises and air-gapped AI systems to Fortune 500 banks and defense
              agencies involves 9-to-18 month procurement cycles, rigorous security audits, and high customer
              acquisition costs. Furthermore, practitioner evaluations on Quasa note that Poolside is explicitly not an
              off-the-shelf consumer tool, requiring dedicated infrastructure setup, data integration, and internal
              platform engineering to deliver optimal results. In the broader market, Poolside must compete directly
              against Microsoft and GitHub Copilot, which commands over 20 million users and 90 percent Fortune 100
              penetration, as well as rapid advancements from open-weight coding models. These competitive dynamics mean
              that any enterprise budget tightening or delays in AI platform operationalization could increase cash burn
              and elevate customer concentration risks across Poolside's early core accounts.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
      - number: '6.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The Sovereign Air-Gapped Moat in Regulated Procurement
            body: >-
              While incumbent coding assistants compete primarily on consumer developer mindshare and cloud-hosted API
              latency, Poolside's go-to-market architecture deliberately bypasses public cloud egress entirely. By
              delivering full model weights, predictable fixed subscriptions, and native air-gapped compatibility,
              Poolside positions itself as the primary compliant alternative for defense contractors, intelligence
              agencies, and global banks that are structurally prohibited from sending proprietary source code to
              multi-tenant cloud endpoints.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU005
          - type: callout
            title: Enterprise Sales Cycle Friction and Lack of Public Retention Proof
            body: >-
              Poolside's enterprise-first focus creates substantial commercial headwinds, including elongated 9-to-18
              month security evaluations, high forward-deployed customer acquisition costs, and vulnerability to
              corporate IT budget freezes. Furthermore, the absence of publicly verifiable net retention rates, cohort
              churn metrics, and referenceable production contract sizes leaves significant uncertainty regarding the
              true durability and expansion economics of early commercial customer cohorts.
            calloutType: risk
            claimRefs:
              - CU011
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, IP Provenance, and Licensing Risks
        blocks:
          - type: paragraph
            body: >-
              Poolside's foundational strategy of publishing open-weight models introduces substantial regulatory and
              intellectual property risks for enterprise adopters. The company has avoided detailed public disclosures
              regarding the pre-training datasets and filtering provenance behind its Laguna model family, creating
              potential copyright exposure and fair-use scrutiny in corporate legal reviews. Furthermore, Poolside
              employs heterogeneous licensing models across successive model releases, distributing Laguna S 2.1 under
              OpenMDW-1.1 while maintaining Laguna M.1 under Apache 2.0, preventing enterprises from establishing a
              unified open-source governance framework. To mitigate sovereign and defense sector procurement
              constraints, the company formed Poolside Federal LLC as a dedicated United States entity with CAGE code
              11R53 and cleared solutions architects, yet long-term liability for generated software artifacts remains
              unindemnified.
            claimRefs:
              - CR001
              - CR002
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
      - number: '7.2'
        title: Operational Reliability, Security Architecture, and Model Lifecycles
        blocks:
          - type: paragraph
            body: >-
              Deploying generative coding agents directly into enterprise environments creates acute operational and
              runtime security challenges. Poolside mitigates external data leakage through air-gapped on-premises
              architectures and Atlas runtime engines that prevent data egress outside customer firewalls. Its
              Reinforcement Learning from Code Execution Feedback architecture executes up to 10,000 containerized code
              executions per minute across 350 million indexed repositories, attempting to eliminate hallucinated syntax
              through automated execution feedback. However, operational durability remains constrained by the absence
              of published model deprecation roadmaps, leaving customers vulnerable to sudden architectural
              obsolescence. Furthermore, the protracted evaluation timeline required to validate air-gapped
              installations, execute custom security reviews, and configure developer environment integrations
              introduces severe enterprise sales friction.
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR005
              - CR006
              - CR010
              - CR014
      - number: '7.3'
        title: Partner Dependencies, Compute Volatility, and Strategic Realignment
        blocks:
          - type: paragraph
            body: >-
              Poolside's infrastructure roadmap has suffered severe external disruptions that redefine its technical and
              commercial dependencies. The October 2025 announcement of Project Horizon with CoreWeave aimed to
              establish a dedicated 2-gigawatt AI compute campus in Texas, but the agreement was mutually terminated in
              April 2026, causing the loss of a planned 40,000 GPU cluster and forcing reliance on secondary cloud
              allocations. In August 2026, Nvidia executed a landmark $6 billion non-exclusive software license for
              Poolside's Model Factory alongside a $1 billion direct equity investment at a $12 billion pre-money
              valuation. While this partnership provides massive non-dilutive liquidity, approximately 109 core research
              and engineering employees transitioned to Nvidia, threatening talent continuity and technical
              independence. Meanwhile, commercial distribution remains tied to multi-year agreements with Amazon Web
              Services across Bedrock and Trainium hardware.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.4'
        title: Strategic Risk Synthesis, Financial Opacity, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The structural consequence of the August 2026 Nvidia transaction is an apparent pivot from frontier
              foundation model research toward application-layer enterprise agent workflows, accompanied by reported
              pauses in proprietary pre-training efforts. Poolside has accumulated approximately $1.63 billion in
              lifetime equity capital across four financing rounds, supplemented by $6 billion in software licensing
              proceeds, providing multi-year runway that insulates it from immediate market downturns. Nonetheless,
              fundamental financial opacity persists: estimated annual revenues of $50 million as of 2025 remain
              unverified, GAAP software margins are undisclosed, and underlying hosting expenses are opaque. Critical
              thesis-break triggers include talent attrition exceeding post-deal retention targets, aggressive
              first-party copilot encroachment by cloud hosts, or unmitigated IP infringement challenges targeting
              open-weight model outputs.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Disruption Following the August 2026 Nvidia Transaction
            body: >-
              The August 2026 transaction with Nvidia, encompassing a $6 billion non-exclusive license of the Model
              Factory software, a $1 billion equity investment at a $12 billion valuation, and the transition of 109
              research employees to Nvidia, fundamentally transforms Poolside's risk profile. While eliminating
              near-term balance-sheet insolvency, the departure of key technical personnel and reported cessation of
              proprietary frontier foundation model training introduce severe execution risk regarding the company's
              long-term enterprise software moat.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR011
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Sovereign AI Positioning
        blocks:
          - type: paragraph
            body: >-
              Poolside has carved out a differentiated enterprise position by rejecting standard public-cloud
              multi-tenant delivery in favor of fully sovereign, air-gapped on-premises foundation model deployment.
              Developed with Reinforcement Learning from Code Execution Feedback (RLCEF), Poolside's Laguna model family
              is designed specifically for complex software development tasks within strict customer security
              boundaries. This architecture addresses high-security public sector, defense industrial base, and
              regulated financial institutions that are structurally barred from sending proprietary source code to
              multi-tenant commercial cloud APIs.


              However, the investment thesis is tempered by significant operational and commercial uncertainties. The
              mutual termination of the CoreWeave Project Horizon partnership in April 2026 underscored Poolside's
              exposure to volatile third-party infrastructure commitments. Simultaneously, the lack of published
              customer accounts or audited ARR metrics prevents independent verification of commercial product-market
              fit. While the technical value proposition remains compelling for sovereign defense applications,
              commercial scale remains unproven.
            claimRefs:
              - CV002
              - CV010
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV006
              - CV007
              - CV010
      - number: '8.2'
        title: Financing History and Nvidia Deal Structure
        blocks:
          - type: paragraph
            body: >-
              Poolside's capitalization history reflects rapid valuation escalation driven by strategic hardware
              partnerships. After raising $126 million across early rounds, the company secured a $500 million Series B
              in October 2024 at a $3 billion post-money valuation led by Bain Capital Ventures with participation from
              Nvidia and major institutions. In August 2026, Nvidia executed a landmark $7 billion total commitment
              comprising a $6 billion non-exclusive licensing agreement for Poolside's Model Factory software and a
              separate $1 billion direct equity investment at a $12 billion pre-money valuation.


              The transaction's unique architecture carries profound corporate governance and financial implications.
              The $6 billion licensing fee is scheduled for distribution directly to early investors rather than funding
              Poolside's ongoing operational balance sheet, effectively functioning as a liquidity event for legacy
              venture backers. Furthermore, Nvidia extended offers to 109 Poolside research and systems engineers. While
              co-founders Jason Warner and Eiso Kant maintain corporate independence, the transfer of operational
              expertise and the division of capital flows represent an extraordinary governance structure that
              prospective equity investors must evaluate with strict discipline.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV009
      - number: '8.3'
        title: Scenario Analysis, Comparables, and Return Logic
        blocks:
          - type: paragraph
            body: >-
              Assessing Poolside's fair enterprise valuation requires confronting the stark divergence between private
              headline marks and verifiable software fundamentals. In the absence of audited financial disclosures,
              secondary estimates indicating $50 million in annual revenue imply an enterprise multiple exceeding 240x
              revenue at the $12 billion valuation level. Even when benchmarked against high-growth AI infrastructure
              peers and premium public devops multiples (such as GitLab and Snowflake at IPO), Poolside trades at an
              extreme growth premium that discounts flawless commercial execution years into the future.


              Our scenario modeling balances these structural tensions across three prospective outcomes. The base case
              (55% probability) models $10B-$14B in normalized valuation, assuming enterprise ARR expands steadily
              toward $100M-$150M while multiple compression normalizes multiples toward 70x-100x. The bull case (20%
              probability) anticipates $20B-$30B valuation if sovereign defense mandates create monopolistic pricing
              power and Model Factory yields recurring licensing streams. Conversely, the bear case (25% probability)
              accounts for post-Nvidia talent attrition and enterprise sales friction, projecting multiple compression
              down to Series B recapitalization levels of $3B-$5B.
            claimRefs:
              - CV007
              - CV008
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV011
              - CV012
              - CV004
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV006
              - CV008
              - CV013
      - number: '8.4'
        title: Final Recommendation, Confidence, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              We conclude with a 'research-more' recommendation, accompanied by medium confidence, high risk rating, and
              a stretched valuation assessment. Poolside possesses exceptional technical assets and sovereign defense
              alignment, but entering equity at a $12B-$13B valuation when $6B of incoming capital is distributed away
              from company coffers is financially unbalanced. Capital allocators should not treat the headline valuation
              as validation of operating cash flow or near-term liquidity.


              A disciplined investment committee must condition future investment decisions on rigorous diligence gates.
              Critical requirements include inspecting audited GAAP ARR, customer cohort expansion metrics, and gross
              margin profiles after internal inference and cluster costs. Furthermore, counsel must audit the exact IP
              boundary between Model Factory and retained enterprise tools, alongside side-letter governance terms with
              Nvidia. Definite thesis-break triggers include federal pilot non-renewals, unexpected executive
              departures, or compute supply restrictions that impair ongoing model development.
            claimRefs:
              - CV013
              - CV014
              - CV004
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Stance: Research-More at Stretched Valuation'
            body: >-
              Given the unprecedented structure of Nvidia's $7 billion commitment—where $6 billion in license revenue
              flows directly to prior investors while 109 core engineers receive Nvidia offers—prospective investors
              must treat the headline $12 billion valuation with caution. Direct commitment should be withheld until
              audited ARR, net retention, and post-transaction governance rights are verified.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV013
          - type: callout
            title: Infrastructure Fragility and Compute Overhang
            body: >-
              The collapse of the CoreWeave 2GW Texas campus negotiation in spring 2026 aborted a $2 billion Series C
              financing and forfeited a 40,000 GB300 GPU cluster. This episode exposes extreme infrastructure
              dependency, underscoring that sovereign AI developers remain vulnerable to third-party compute
              bottlenecks.
            calloutType: risk
            claimRefs:
              - CV006
              - CV012
