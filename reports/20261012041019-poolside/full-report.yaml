chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Operating Model
        blocks:
          - type: paragraph
            body: >
              Poolside (associated with legal entity Poolside, Inc., incorporated in the United States in April 2023) is
              a developer of artificial intelligence models and autonomous systems purpose-built for software
              engineering. The company was founded in early 2023 by former GitHub Chief Technology Officer Jason Warner
              and serial engineering intelligence entrepreneur Eiso Kant, establishing operational headquarters spanning
              San Francisco, California and Paris, France. Poolside's foundational thesis is that software development
              represents the first major technical domain where artificial intelligence will achieve and surpass
              human-level capability, requiring full-stack model architectures rather than superficial IDE wrapper
              extensions.


              To operationalize this mission in high-assurance environments, Poolside established Poolside Federal LLC,
              a United States domiciled operating entity dedicated exclusively to federal agencies, national security
              organizations, and defense industrial base customers. Unlike consumer-oriented cloud code assistants that
              enforce recurring per-token inference charges and remote data routing, Poolside delivers open-weight
              foundation models (including the Laguna model family) engineered explicitly for on-premises, VPC, and
              air-gapped deployments. By enabling unlimited local inference without outbound data egress, Poolside
              provides sovereign software intelligence where proprietary enterprise codebases remain strictly within
              institutional custody.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
