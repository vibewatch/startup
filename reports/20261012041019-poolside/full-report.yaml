      - number: '2.4'
        title: Structural Growth Drivers, Infrastructure Constraints, and Diligence Risks
        blocks:
          - type: paragraph
            body: >-
              Multiple secular tailwinds accelerate enterprise appetite for sovereign AI software engineering, led by
              compounding technical debt in legacy mission software, rising regulatory scrutiny over code privacy, and
              the expanding productivity gap between software demand and engineering labor supply. Poolside's
              reinforcement learning from code execution feedback provides a defensible architectural foundation for
              multi-step reasoning and automated refactoring. However, substantial adoption friction and structural
              bottlenecks govern commercial scaling. Enterprise deployments carry extensive sales and implementation
              cycles, often requiring Forward Deployed Research Engineers to embed with customer teams for custom
              integration. Furthermore, sovereign infrastructure models require heavy compute availability for
              customer-side model fine-tuning and inference. This compute vulnerability was starkly demonstrated in
              spring 2026 when Poolside's negotiations for a two-gigawatt data center campus in Pecos County, Texas with
              CoreWeave collapsed, disrupting expansion plans and leading directly to the Nvidia transaction.
              Additionally, the lack of public revenue disclosures, customer retention benchmarks, or referenceable
              production case studies makes standalone economic validation a key diligence hurdle.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
              - CM016
