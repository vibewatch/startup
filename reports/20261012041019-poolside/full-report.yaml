              - CE004
              - CE005
              - CE007
      - number: '5.4'
        title: Differentiation, trust controls, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Poolside's clearest differentiation is sovereignty: full weights, local inference, network-policy
              enforcement, secret handling, and searchable trajectories are designed for regulated or disconnected
              environments. The evidence does not establish that these controls have passed named third-party
              certifications or independent penetration testing, so they should be treated as design claims rather than
              verified assurance. External model catalogs add useful but narrow signals: LM Market Cap listed four
              Poolside variants with function calling and reasoning across all four, but no vision capability, and
              Artificialus likewise described the models as text-only. AI Engineer also reported that Poolside stopped
              frontier-model development after an August 2026 Nvidia arrangement without disclosing an updated vision,
              creating roadmap uncertainty that requires direct contractual and product-plan diligence.
            claimRefs:
              - CE003
              - CE005
              - CE009
              - CE010
