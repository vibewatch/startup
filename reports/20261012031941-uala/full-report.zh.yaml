              - CE013
      - number: '5.3'
        title: 数字资产整合与竞争差异化
        blocks:
          - type: paragraph
            body: >-
              Ualá 的技术差异化来自完整监管银行牌照与现代数字资产整合在同一消费者界面中的结合。拉丁美洲传统数字银行主要以预付支付应用或非银行信贷中介形式运营，而 Ualá
              已在阿根廷、墨西哥和哥伦比亚取得完整银行牌照。这一监管定位让公司可以吸收存款、发放完全受监管的信贷并开发自有金融产品，无需承受第三方银行即服务中介带来的经济拖累。

              与受监管银行能力并行，Ualá 已与全球稳定币发行商 Tether 建立战略合作和投资联盟，推进数字资产基础设施。合作目标是把区块链金融技术、可编程货币通道和稳定价值储存工具直接嵌入 Ualá
              移动应用。在消费者寻求通胀对冲和无缝跨境价值转移的拉丁美洲高通胀经济体中，把去中心化金融原则接入持牌银行框架，可以形成独特的产品优势。架构难点在于：既要把受许可的监管会计账本与外部区块链通道打通，又要在不同司法辖区遵守严格的反洗钱和了解你的客户合规标准。
            claimRefs:
              - CE002
              - CE011
      - number: '5.4'
        title: 技术风险控制、事件管理与运营治理
        blocks:
          - type: paragraph
            body: >-
              Ualá S.A. Institución de Banca Múltiple 是受墨西哥国家银行与证券委员会（CNBV）监管的金融机构，遵守制度化的风险管理和内部控制标准。在 CNBV
              监管框架下，技术风险被正式定义为硬件、软件、应用、网络和分销渠道发生损坏、中断、变更或故障后可能造成的经济损失或运营中断。银行的综合风险管理部门（UAIR）维护专门事件日志，每季度开展评估，并直接向风险委员会和董事会报告。

              2024 年第四季度和 2025 年第一季度的监管披露记录了 Ualá 墨西哥银行业务的运营可靠性。4T 2024，Ualá 记录 18 起技术风险事件，明显少于 4T 2023 报告的 31 起。1T
              2025，与业务流程和系统故障有关的技术风险事件进一步降至 7 起。关键是，墨西哥监管申报确认两个报告期内这些技术事件均未造成经济损失。Ualá
              维护一套可运行的灾难恢复计划（DRP）、五个辅助治理委员会和自动化财务核算系统，以保障业务连续性。不过，外部仍无法看到量化 SLA 可用率、实时 API 延迟和公开开发者工程指标，技术评估仍需持续尽调。
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 现代云原生引擎架构
            body: Ualá 同时依赖 Mambu 的可组合数字贷款平台和 AWS 上的 Temenos Core R24，形成可扩展的云原生基础，把现代应用功能与传统银行瓶颈解耦。
            calloutType: strength
            claimRefs:
              - CE009
              - CE010
          - type: callout
            title: 核心迁移与多供应商整合风险
            body: 把收购来的银行资产从传统本地软件迁出，同时协调多个司法辖区的不同云平台，会带来整合复杂度和持续的运营治理要求。
            calloutType: risk
            claimRefs:
              - CE010
              - CE012
              - CE014
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 零售客户细分与区域开户
        blocks:
          - type: paragraph
            body: >-
              Ualá 在阿根廷、墨西哥和哥伦比亚的核心市场，按照地域、用户人口特征和监管结构建立多层次客户体系。消费者业务以大众数字普惠为基础，通过无摩擦的移动数字开户和实体、虚拟 Mastercard
              支付卡吸引过去没有银行账户或银行服务不足的人群。在阿根廷，公司披露显示，超过 22% 的 18 至 25 岁阿根廷人持有 Ualá 卡，全部用户中 55% 年龄在 18 至 30 岁之间。此外，65%
              的注册用户采用移动应用前没有正式信用记录，凸显 Ualá 作为入门金融入口的角色。不过，各司法辖区的客户单位经济性和产品深度差异很大。阿根廷业务在标准支付钱包之上叠加共同基金、本地股票经纪、cedears
              和加密资产敞口；墨西哥扩张则高度依赖其持牌银行实体吸收成年存款客户和信用卡借款人。这种多国细分让公司暴露于不同监管框架和客户变现画像，也使跨境客户群比较更加困难。
            claimRefs:
