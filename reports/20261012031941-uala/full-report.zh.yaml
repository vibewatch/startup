        - 发行全部预付卡、借记卡和信用卡的全球卡组织
        - 高（所有运营国家发卡的唯一网络合作伙伴）
        - 卡组织规则变化、交换费压缩或卡处理停机
        - 高
        - 长期合作协议，并拓展 mPOS / QR 商户收单
        - 完全依赖 Mastercard 网络规则和国际品牌受理
      - - 数字资产技术赞助方
        - Tether
        - 战略股权投资者（$20M）及数字资产能力合作伙伴
        - 低-中（占 2026 年融资轮的 10%；在股权结构表中为少数无投票权角色）
        - 加密资产波动或监管审批延迟引发声誉审视
        - 中
        - 将受监管银行业务与未获许可的数字资产通道隔离
        - 在法律改革通过前，无法部署联合稳定币基础设施
      - - 机构锚定赞助方
        - Allianz X、SoftBank、Tencent
        - 提供持续扩张资本的领投股权投资者
        - 高（财团支持 Series D、Series E 及 2026 年资本轮）
        - 投资者疲劳或估值下调压缩后续资本
        - 中
        - 引入多阶段全球机构资本，扩大投资者财团
        - 需要持续催缴资本，以补贴墨西哥银行业务扩张
    notes: 合作伙伴依赖汇编自公司公告、Mambu 实施披露和融资文件；集中度根据单一供应商敞口评估。
    claimRefs:
      - CR008
      - CR009
      - CR013
      - CR014
  - id: TV001
    title: 建议摘要表
    columns:
      - 参数
      - 评估
      - 估值 / 基准
      - 战略含义
    rows:
      - - 建议
        - 跟踪
        - 当前进入：$3.2B 投后估值
        - 维持主动跟踪；在经审计的合并披露出炉前，暂缓投资承诺。
      - - 估值立场
        - 公允
        - 预计净收入运行率为 8.0x - 10.0x
        - 估值反映已验证的规模，同时对墨西哥信用损失和宏观风险作出适当折价。
      - - 风险评级
        - 高
        - 墨西哥损失扩大；无抵押信贷
        - 若信用损失吞噬存款利差，下行空间可能很大。
      - - 信心水平
        - 中
        - 银行申报文件和融资轮条款提供支持
        - 私营公司披露有限且缺少合并现金流审计，限制了信心。
    notes: 建议和立场基于 2026 年 3 月 / 7 月融资轮指标（$3.2B 投后估值）及集团缺少合并审计披露这一事实。
    claimRefs:
      - CV001
      - CV005
      - CV011
      - CV012
      - CV013
  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 维度
      - 核心投资论点
      - 反论点 / 关键风险
      - 哪些变化会改变判断
    rows:
      - - 市场地位与规模
        - 阿根廷、墨西哥和哥伦比亚用户超过 11M，品牌资产已建立。
        - 用户活跃度和存款集中度高度偏向阿根廷。
        - 独立审计证明非阿根廷市场的主账户交易深度。
      - - 银行监管护城河
        - 在阿根廷、墨西哥（收购 ABC Capital）和哥伦比亚均持有完整银行牌照。
        - 银行实体需要较高资本缓冲，并面临严格的本地监管。
        - 合并集团披露显示监管资本能够自给。
      - - 战略赞助
        - Allianz X 深度支持保险科技，Tether 则支持数字资产通道。
        - 赞助方融资轮可能在普通股之上引入复杂的优先清算权。
        - 完整股权结构透明度确认普通股条款不存在优先级差异。
      - - 单位经济与信用
        - 借贷、保险和商户收单带来的多产品收入流持续扩张。
        - 墨西哥银行 2025 年第一季度净亏损 MXN -282M，贷款拨备激增 91%。
        - 墨西哥持续扭亏为盈，不良贷款趋于稳定。
    notes: 评估区域规模与阿根廷宏观环境、墨西哥信用扩张及披露限制所带来的下行风险之间的平衡。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV011
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 隐含估值 / 倍数
      - 下行触发因素 / 风险
      - 概率信号
    rows:
      - - 乐观情景
        - 净收入超过 $500M；墨西哥银行业务实现盈亏平衡；保险科技和 Tether 通道推动 ARPU 扩张。
        - $5.0B - $6.0B（净收入的 10.0x - 12.0x）
        - 区域收紧稳定币监管，或跨境支付费率承压。
        - 25%（需要加快非本土市场的执行）
      - - 基准情景
        - 合并净收入达到 $350M - $400M；墨西哥信用损失正常化；集团运营消耗保持温和。
        - $3.2B - $3.8B（净收入的 8.0x - 10.0x）
        - 阿根廷货币持续贬值，宏观通胀持续形成逆风。
        - 50%（当前轨迹与 2026 年融资轮基准一致）
      - - 悲观情景
        - 墨西哥银行贷款拨备增速超过预测；存款流失；集团现金消耗迫使公司进行稀释性下轮融资。
        - $1.8B - $2.2B（净收入的 5.0x - 6.0x）
        - 信用违约加速、监管资本受损或大型金融科技竞争。
        - 25%（MXN -282M 的 2025 年第一季度亏损和 +91% 的信用拨备增长提供了证据）
    notes: 情景框架假设 2026 年融资带来的 $3.2B 投后基准估值；回报反映到实现流动性的 3-5 年期限。
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Ualá 从阿根廷预付卡发行商发展为持有多国牌照的数字银行，估值达到 32 亿美元。
    data:
      items:
        - label: 公司成立与 Series A
          date: 2017-2018
          detail: Pierpaolo Barbieri 在布宜诺斯艾利斯推出 Ualá 预付 Mastercard；获得 Soros Fund Management 领投的 $10M Series A 融资。
          tone: positive
        - label: Series B 规模化
          date: 2018-10
          detail: 获得 Goldman Sachs Asset Management 领投的 $34M Series B 融资，用于扩展个人理财功能和技术团队。
          tone: positive
        - label: Series C 与墨西哥上线
          date: 2019-2020
          detail: 2019 年末完成 SoftBank 和 Tencent 领投的 $150M Series C 融资；2020 年 9 月在墨西哥开展业务。
          tone: positive
        - label: Series D 与独角兽估值
          date: 2021-08
          detail: 完成 SoftBank 和 Tencent 联合领投的 $350M Series D，估值 $2.45B；发行卡片超过 3.5M 张，跻身独角兽。
          tone: positive
        - label: 哥伦比亚拓展与银行收购
          date: 2022-2023
          detail: 2022 年 1 月在哥伦比亚上线，2023 年 5 月收购墨西哥 ABC Capital 银行，取得完整的墨西哥银行牌照。
          tone: positive
        - label: Series E 投资
          date: 2024-2025
          detail: Allianz X 领投 Series E，分两次交割合计 $366M，开启覆盖该区域的战略嵌入式保险合作。
          tone: positive
        - label: 披露墨西哥银行亏损
          date: 2025-04
          detail: Ualá México 报告 2025 年第一季度净亏损 MXN 282M；在 CNBV 监管下，过去 12 个月累计消耗资本 MXN 1,246M。
          tone: adverse
        - label: 2026 年资本轮与 $3.2B 估值
          date: 2026-03
          detail: 获得 Allianz X 领投、Tether 参与的 $197M 股权融资，估值 $3.2B；客户规模扩大到 1100 万以上。
          tone: positive
    approximationNotes: 里程碑日期和交易数字汇编自公司公告、向 CNBV 提交的监管文件及经核实的市场披露。
    claimRefs:
