      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 墨西哥高信用卡逾期率与 Stage 3 拨备
            body: >-
              Ualá México 的监管披露显示，2025 年第一季度 Stage 3 不良贷款达到贷款组合的 20%，Stage 3 短期还款违约超过 99.5%。随着 Ualá
              向信用记录薄弱的客户群扩大循环信贷，这说明审批面临严重逆风。
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
          - type: callout
            title: 漏斗顶端年轻用户占优与变现深度
            body: >-
              超过 22% 的 18 至 25 岁阿根廷年轻人持有 Ualá 卡，其中 65%
              过去没有信用记录。这带来了巨大的品牌触达，但把入门级借记卡持卡人转化为有利润且持续留存的存款和信贷客户，在合并口径的单位经济性上仍未经证实。
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险框架
        blocks:
          - type: paragraph
            body: >-
              Ualá 作为覆盖拉丁美洲的持牌金融机构运营，面临复杂且碎片化的司法辖区监管；这些监管同时决定产品迭代速度和资产负债表要求。在墨西哥，Ualá 于 2023 年 5
              月正式获得墨西哥国家银行与证券委员会（CNBV）批准收购 ABC Capital 后，以 Ualá S.A. Institución de Banca Múltiple
              的公司名义运营全牌照商业银行。完整银行牌照赋予公司直接吸收存款的权力和更低的资金成本，但也带来数字钱包无需承担的严格资本储备义务、监管报告和正式风险治理。法律或有事项已成为运营摩擦：截至 2025
              年第一季度，Ualá México 报告针对该银行的待决诉讼 28 起，或有负债合计 MXN 18.2 million。机构已针对九起被评估为可能或很可能造成损失的活跃案件计提 MXN 13.75 million
              准备金，同时成功驳回三起原敞口为 MXN 13.7 million 的劳动诉讼。此外，数字资产方面的战略产品目标也受到明确监管边界约束。尽管 Ualá 在其 $197 million 轮融资中获得了 Tether
              $20 million 的少数股权投资，但阿根廷现有央行规定和墨西哥银行法使 USDT 无法立即接入受监管存款平台，稳定币分销因此严格留在核心数字银行应用之外。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR007
      - number: '7.2'
        title: 信贷审批与资产负债表可持续性
        blocks:
          - type: paragraph
            body: >-
              发放信贷是 Ualá 变现和创造净利息利润率的主要引擎，但也构成资产负债表最脆弱的环节。Ualá S.A. Institución de Banca Múltiple 2025 年第一季度披露显示，Stage 3
              不良贷款占 MXN 621 million 总贷款组合的 20%。对于还款期限低于 30 天的应收款，Stage 3 违约率达到 99.5%，说明账户逾期后损失严重。信用卡是风险核心：本季度执行的 MXN 47
              million 贷款组合核销中，MXN 40 million 来自信用卡额度。这些信贷成本大幅压低经营盈利能力，公司需要计提 MXN 51.9 million
              预防性信用风险准备金，并导致墨西哥银行子公司季度净亏损 MXN 282 million。年度口径上，Ualá México 在过去 12 个月需要 MXN 1,246 million
              资本注入，以抵消经营消耗并维持监管合规。资本充足性在技术上仍然稳健，ICAP 为 39.9%，流动性覆盖率（CCL）为 2,018%，明显高于 CNBV I 类最低要求。然而，ICAP 同比下降 26.9
              个百分点，说明如果没有母公司融资轮次持续补充资本，快速扩张贷款和信用恶化将迅速侵蚀子公司的资本缓冲。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
