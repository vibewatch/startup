              - CE008
      - number: '5.2'
        title: 云原生基础设施与多供应商核心架构
        blocks:
          - type: paragraph
            body: >-
              为支持跨境快速扩张，并从第三方产品许可转向直接开展银行业务，Ualá 部署了去耦合的多供应商云架构。在收购 ABC Capital 后，Ualá 在墨西哥继承了一套本地部署、使用已有 10 年的 Temenos
              Core 银行平台（R13 版本），无法承载预期交易量。因此，工程团队启动了向 Amazon Web Services（AWS）云基础设施托管的 Temenos Core R24 版本全面迁移。此次云迁移利用
              Temenos 的无关架构，消除复杂的数据转换层，让墨西哥银行服务能够敏捷持续部署。

              在 Temenos 核心银行引擎之外，Ualá 还在 AWS 上运行 Mambu 的云原生可组合平台，作为专用数字贷款引擎。Mambu 用两个月接入 Ualá
              的运营环境，提供灵活框架，把贷款工作流从传统单体银行数据库中拆出。这种可组合架构让 Ualá
              无需重写核心会计基础设施，就能在阿根廷、哥伦比亚和墨西哥快速配置、测试和推出新型信贷及分期产品。然而，同时运营多个核心平台——Temenos 负责墨西哥受监管银行业务，Mambu 负责区域数字贷款——要求严格的
              API 编排、持续数据同步和更强的架构监控，以防止跨司法辖区出现延迟和对账异常。
            claimRefs:
              - CE002
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
