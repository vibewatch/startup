  - id: FI001
    title: 从客户活动到毛利率转化流程
    type: flow
    summary: 可视化展示用户开户、支付交易、信贷投放、吸收存款及由此产生的手续费和利息收入流，并与服务成本对照。
    approximationNotes: 展示收入和成本的结构性动态；阿根廷、墨西哥和哥伦比亚的单位利润率各不相同。
    claimRefs:
      - CI003
      - CI014
    data:
      nodes:
        - id: users-deposits
          label: 用户开户与数字账户
          description: 拉丁美洲注册账户超过 11M，通过应用转账和现金存入网络入金
        - id: payments-transacting
          label: 卡片使用与交易
          description: Mastercard 借记卡和信用卡交易、账单支付及 P2P 转账带来交换费收入
        - id: merchant-acquiring
          label: 商户收单（Ualá Bis）
          description: mPOS 和支付链接处理，产生直接商户折扣费率和处理费
        - id: credit-lending
          label: 信贷与借贷投放
          description: 个人贷款、BNPL 和信用卡余额产生利息总收入
        - id: service-costs
          label: 直接服务与资金成本
          description: 云核心银行费用（Mambu / AWS）、支付网络交换费和存款收益支出
        - id: credit-provisions
          label: 信用风险拨备与损失
          description: 贷款损失拨备（例如墨西哥 2025 年第一季度的 MXN 51.9M）及投资组合核销
        - id: gross-margin
          label: 净金融利差与手续费贡献
          description: 剩余毛贡献，用于支撑管理费用和产品扩张
      edges:
        - from: users-deposits
          to: payments-transacting
        - from: payments-transacting
          to: merchant-acquiring
        - from: merchant-acquiring
          to: credit-lending
        - from: credit-lending
          to: service-costs
        - from: service-costs
          to: credit-provisions
        - from: credit-provisions
          to: gross-margin
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 覆盖客户呈现、交易处理、核心引擎和监管治理的多层技术栈。
    data:
      layers:
        - label: 客户呈现与移动层
          detail: 原生 iOS 和 Android 移动应用，提供自动化数字开户、生物识别和卡片管理控制。
        - label: 产品与商业服务层
          detail: 通用数字账户、全球 Mastercard 发卡、Ualá Bis mPOS 收单、账单支付和嵌入式保险。
        - label: 数字借贷与可组合引擎
          detail: 托管在 AWS 上的 Mambu 云原生借贷平台，支持快速周转的消费贷款和分期信贷评估。
        - label: 核心银行引擎（墨西哥）
          detail: 部署在 AWS 云上的 Temenos Core R24，将旧有 ABC Capital 本地基础设施升级为可扩展的交易处理系统。
        - label: 数字资产与战略整合
          detail: 技术基础设施与 Tether 对接，服务数字资产、可编程价值存储和区域连接。
        - label: 风险管理、DRP 与监管治理
          detail: UAIR 事件跟踪数据库、灾难恢复计划（DRP）、CNBV 监管报告和内部控制委员会。
