      - number: '7.4'
        title: 风险缓释、监测指标与尽调路径
        blocks:
          - type: paragraph
            body: >-
              Ualá 的监管、信贷和运营风险正在叠加，压降这些风险需要严格的承保治理、动态资本配置和主动监管沟通。面对信贷风险，管理层用 CreditRisk+ 泊松分布统计模型校准六个经济部门的预期与非预期组合损失阈值；但
              Stage 3 比例持续偏高，仍需收紧信用卡评分筛选，并降低首次借款人的初始额度。流动性和市场风险则促使 Ualá 采取极度保守的资金管理姿态，把墨西哥过剩存款投向主权 CETES、BONDES
              和央行存款，使市场风险价值（VaR）维持在较低的 MXN 2.91 million。股东支持关系提供了关键的流动性后盾：由 Allianz X、SoftBank、Tencent 和 Tether
              牵头的财团持续具备向运营实体补充资本的能力，$197 million 股权轮于 2026 年 3 月完成，投后估值为 $3.2 billion。投资者需要关注的投资逻辑破坏触发点包括：(1) 墨西哥 ICAP
              跌破 15%，且母公司未立即承诺注资；(2) Stage 3 信贷违约超过贷款总额的 25%；(3) CNBV 或 BCRA 实施监管制裁或暂停牌照；(4) Mambu/AWS
              核心银行系统在交易高峰期意外中断超过连续四小时。
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 墨西哥信贷质量与运营亏损构成当下脆弱点
            body: >-
              Ualá 在墨西哥的银行资本充足率（ICAP）为 39.9%，流动性覆盖率为 2,018%，看似稳健，但贷款组合质量已严重承压：Stage 3 不良资产占总贷款的 20%，每季度产生 MXN 47 million
              核销。再叠加墨西哥单季 MXN 282 million 的运营净亏损，这一商业模式高度依赖母公司股东持续补充股权资本，以吸收信贷质量恶化。
            calloutType: risk
            claimRefs:
              - CR005
