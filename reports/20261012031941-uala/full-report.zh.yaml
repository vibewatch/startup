      - number: '4.2'
        title: 成本结构、毛利率驱动因素与信用风险
        blocks:
          - type: paragraph
            body: >-
              运营受监管银行机构会带来管理负担，高速增长的数字平台也要持续投入基础设施；这些因素共同构成 Ualá 的成本结构。核心运营费用包括 Mambu
              云银行核心系统许可、银行卡生产和分销物流、客户支持、监管合规开支及营销。近期并购交易——包括收购阿根廷 Wilobank 和墨西哥 ABC Capital——造成组织冗余，公司于 2024 年 5 月进行 9%
              的员工结构调整，以消除重复岗位并精简区域办公室的员工规模。关键在于，随着 Ualá 进入贷款和信用卡业务，信用风险拨备和资金成本成为毛利贡献的首要威胁。墨西哥子公司 Ualá S.A. Institución
              de Banca Múltiple 的监管申报显示，2025 年第一季度信用风险拨备同比增长 91% 至 MXN 51.9 million，原因是信用卡发放量扩大。加上 MXN 206.5 million
              的管理费用，墨西哥银行业务在 2025 年第一季度录得 MXN 282 million 净亏损。快速增长的信贷必须提前计提大量拨备，并吸收高收益存款，因而在市场渗透阶段压缩当地利润率。
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI011
              - CI014
