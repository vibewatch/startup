      - number: '6.2'
        title: 采用轨迹、用户扩张与信用表现
        blocks:
          - type: paragraph
            body: >-
              顶线采用指标显示，Ualá 从 2017 年成立到 SoftBank、Tencent 和 Allianz X 领投的连续机构融资轮次期间，平台大幅扩张。公司披露显示，已发行卡数量从 2021 年的 3.5
              million 增长到 2024 年末的超过 8 million 名平台用户和 7 million 笔已发放贷款。在收购 ABC Capital 并转为多功能银行机构（Institución de Banca
              Múltiple）后，Ualá 报告墨西哥活跃用户月复合增长 14%。不过，底层信用质量和逾期动态暴露出显著的审批风险。Ualá México 2025 年第一季度监管财务报告显示，净贷款组合达到 MXN 504
              million，传统存款增至 MXN 5,831 million，但信用拨备同比跃升 91% 至 MXN 51.9 million，几乎完全由信用卡逾期驱动。在墨西哥贷款账簿中，Stage 3 不良贷款占总组合的
              20%，Stage 3 短期信贷违约率超过 99.5%。这些不利指标表明，在竞争激烈的新兴市场激进获客会带来严重的信用损失敞口，压低毛利，并挑战零售客户经济性的持久性。
