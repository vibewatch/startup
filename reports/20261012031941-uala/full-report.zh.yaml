      - number: '8.4'
        title: 上市准备度、尽调要求与投资逻辑破坏触发点
        blocks:
          - type: paragraph
            body: >-
              Ualá 具备若干显示其最终有望上市的机构条件，包括一流治理合作方、知名全球股东，以及三大主要市场的受监管银行牌照。但 IPO
              仍有实质性障碍，首要问题是完全没有公开披露的合并财务报表、经审计的收入确认政策和队列层面的单位经济模型。潜在机构投资者应优先核实合并口径烧钱速度、阿根廷与墨西哥之间的交叉补贴，以及 Series D、E 和
              2026 年优先股的股权结构优先级条款。此外，还应持续监测墨西哥 CNBV
              要求补充监管资本、净财务利差持续收窄，或监管机构限制数字钱包接入稳定币等投资逻辑破坏触发点。在经审计的集团报表确认经营杠杆可持续之前，资本配置仍应保持 TRACK 姿态。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 纪律性立场：$3.2B 估值下维持 TRACK
            body: Ualá 覆盖 11 million 名用户，且获得 Allianz 和 Tether 的顶级支持，区域触达能力突出；但集团合并审计数据缺失、墨西哥银行亏损扩大，因此应维持 TRACK，而不是追逐后期上涨动能。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV012
          - type: callout
            title: 墨西哥信贷拨备激增
            body: Ualá Mexico 信贷风险拨备同比激增 91%，凸显无抵押消费贷款的贷款成熟风险，也是合并单位经济模型的主要脆弱点。
            calloutType: risk
            claimRefs:
