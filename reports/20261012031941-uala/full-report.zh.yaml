  - id: FU001
    title: 客户采用与产品扩张旅程
    type: journey-map
    summary: 展示客户从最初的无银行账户开户，到多产品金融深化和商户收单的生命周期进程。
    data:
      items:
        - stage: 移动端发现与开户
          label: 无摩擦移动开户
          actors:
            - 无银行账户或年轻消费者
            - Ualá 移动 KYC 引擎
          touchpoints:
            - 下载移动应用
            - 国民身份验证（DNI / INE）
            - 即时发行虚拟 Mastercard
          emotion: 账户免维护费且无需网点即可快速完成 KYC，用户初始热情高涨。
        - stage: 基础钱包与支付活动
          label: 交易习惯形成
          actors:
            - 活跃消费者
            - 零售商户
          touchpoints:
            - 借记卡零售交易
            - 点对点银行转账
            - 公用事业账单支付和手机充值
          emotion: 用户体验到可靠的资金流转，Ualá 因此成为日常支付工具。
        - stage: 储蓄与高收益吸收
          label: 吸收存款与留存收益
          actors:
            - 储户 / 零售投资者
            - 受监管银行实体
          touchpoints:
            - 高收益计息数字账户
            - 共同基金和定期投资
            - 应用内货币兑换（加密资产 / USD）
          emotion: 有竞争力的收益率带来强烈的财务满意度，但容易受到降息影响。
        - stage: 信贷获取与借贷扩张
          label: 信贷入口与评估
          actors:
            - 银行服务不足的借款人
            - UaláScore AI 信用引擎
          touchpoints:
            - 小额分期贷款（BNPL）
            - 无抵押循环信用卡发行
            - 自动扣款还款
          emotion: 首次获得正式信贷带来满足感，但信用记录稀薄的客户群面临违约风险。
        - stage: 商户交叉销售与收单
          label: 通过 Ualá Bis 商业收单
          actors:
            - 小企业主 / 创业者
            - Ualá Bis 收单平台
          touchpoints:
            - 移动 POS 读卡器（mPOS）
            - 远程数字支付链接
            - 即时结算至 Ualá 商业余额
          emotion: 即时结算带来很高的商业实用性，推动商户留在生态中。
        - stage: 企业与跨境合作
          label: 机构生态整合
          actors:
            - 企业合作伙伴（Allianz、Tether）
            - 高交易量客户
          touchpoints:
            - 嵌入式数字保险保单
            - 稳定币转账通道
            - 高级 API 商户结账
          emotion: 机构保险覆盖和全球数字资产流动性提供支撑，进一步加深客户信任。
    approximationNotes: 模型根据披露的用户流程，刻画消费者和商户产品中的典型客户进阶路径。
    claimRefs:
      - CU001
      - CU003
      - CU007
      - CU008
      - CU013
      - CU014
