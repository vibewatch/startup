      - number: '8.2'
        title: 估值历史、融资背景与可比公司
        blocks:
          - type: paragraph
            body: >-
              Ualá 的投后估值在连续多轮私募融资中稳步上升。2021 年 8 月，SoftBank Latin America Fund 和 Tencent 领投 $350 million 的 Series
              D，使公司成为独角兽，投后股权定价为 $2.45 billion。随后，Ualá 扩大区域业务并收购商业银行实体，2024 年由 Allianz X 领投 $366 million 的 Series E，估值达到
              $2.75 billion。最近，Allianz X 于 2026 年 3 月领投 $195 million 融资；2026 年 7 月该轮扩大至 $197 million，并获得 Tether $20
              million 的战略投资，最终确立当前 $3.2 billion 的投后估值。相较拉美数字银行同业，Ualá 隐含的估计净收入倍数约为 8.0x–10.0x。Nubank
              等上市可比公司凭借已验证的盈利能力和巴西的巨大规模享有溢价倍数；相比之下，Ualá 对阿根廷宏观波动的地域暴露更高，在墨西哥和哥伦比亚仍处于商业化早期，因此其估值折价是合理的。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
      - number: '8.3'
        title: 情景分析、下行触发点与回报非对称性
        blocks:
          - type: paragraph
            body: >-
              我们的情景框架以 $3.2 billion 估值基线为锚，评估 Ualá 在乐观、基准和悲观运营情景下的风险回报分布。乐观情景中，Ualá 与 Allianz 扩大嵌入式保险，在墨西哥深化信贷变现，并成功接入
              Tether 的稳定币支付轨道，推动合并净收入超过 $500 million，企业估值达到 $5.0 billion–$6.0 billion。基准情景预计区域用户稳定增长 20%–30%，亏损逐步收窄，估值为
              $3.2 billion–$3.8 billion。相反，悲观情景主要受到墨西哥银行披露中的反向一手证据影响。2025 年第一季度，Ualá Mexico 录得 MXN -282 million
              运营净亏损，预防性信贷风险估计额激增 91% 至 MXN 51.9 million，净财务利差因存款融资成本上升而收窄 23%。若信贷损失曲线进一步恶化，或资本消耗加速，估值可能压缩至 $1.8
              billion–$2.2 billion，普通股将面临显著下行。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
