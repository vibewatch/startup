      - number: '6.3'
        title: 商户收单扩张、客户验证与集中度风险
        blocks:
          - type: paragraph
            body: >-
              除零售消费者钱包外，Ualá 还通过 Ualá Bis 进入商户收单和微型企业支付解决方案，推动生态扩张。              Ualá Bis 最初通过移动
              POS（mPOS）终端和数字支付链接承接小企业支付流量，运营前八个月月度处理量增长 27 倍。到 2024 年，商户收单总支付量（TPV）同比增长
              55%，显示独立商户和非正式零售商的商业采用已有实质进展。为支撑不断扩大的多产品基础设施，Ualá 将核心数据工作负载迁移至 Google Cloud BigQuery，并部署 Mambu
              云原生核心银行引擎；该引擎用两个月完成部署，以加速数字贷款发布。尽管取得这些运营里程碑，客户黏性仍因公开披露中的关键缺口而难以判断。Ualá
              未披露客户群留存率、月活用户占比（MAU/总注册用户）、净收入留存率（NRR）或获客成本（CAC）。此外，Ualá México 的监管申报显示出信贷集中度风险：四大交易对手占用基本资本的
              33%，三个墨西哥州（Estado de México、Nuevo León 和 CDMX）占信贷组合的 69%，凸显区域脆弱性和潜在交易对手敞口。
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
