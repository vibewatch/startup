            tableRef: TI003
            claimRefs:
              - CI006
              - CI008
              - CI009
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI014
      - number: '4.3'
        title: 公开规模增长与私营报告缺口
        blocks:
          - type: paragraph
            body: >-
              Ualá 声称在阿根廷、墨西哥和哥伦比亚拥有超过 11 million 名注册用户，公开展示了强劲的漏斗顶端客户增长。在墨西哥，传统存款余额在 2025 年第一季度末达到 MXN 5,831
              million，反映出有竞争力的高收益数字账户利率刺激了存款快速增长。然而，汇总规模数据与底层商业健康之间存在重大披露缺口。管理层披露没有区分已注资的活跃账户和沉睡注册账户，也没有报告集团合并收入、净收入留存率（NRR）、客户终身价值（LTV）或综合获客成本（CAC）。面向没有银行账户或银行服务不足人群的数字银行模式中，高额注册数常常掩盖用户平均交易频率低和存款贝塔高的问题。投资人无法看清主账户渗透率、各客户群交易频率，以及哪些用户产生经常性利润、哪些用户只使用免费缴费和借记取现服务。因此，公开的规模公告不能替代经审计的客户群盈利能力，用来评估长期企业价值。
            claimRefs:
              - CI001
              - CI010
              - CI012
      - number: '4.4'
        title: 资本充足率、现金流入与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Ualá 持有充足资本储备，背后有知名机构和战略投资者持续支持。继 2021 年 8 月 $350 million D 轮融资后，公司在 2026 年 3 月完成 Allianz X 领投的 $195
              million 融资，投后估值达到 $3.2 billion。2026 年 7 月，稳定币发行商 Tether 又进行了 $20 million 战略投资；Tether
              以纯财务投资者身份进入，暂未整合资产。              这些资金流入为公司吸收区域扩张经营亏损、满足受监管银行资本要求提供了必要的资金缓冲。在墨西哥，截至 2025 年 3 月前的 12
              个月内资本注入合计 MXN 1,246 million，使监管资本充足率（ICAP）维持在 39.9%；尽管同比下降 26.9
              个百分点，仍远高于当地监管最低要求。然而，由于集团现金消耗和合并流动性未披露，在墨西哥和哥伦比亚业务实现自我维持的经营盈利前，Ualá 仍在结构上依赖外部私募融资轮次来支撑多市场银行运营。
            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI013
      - number: '4.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本支持与区域子公司拖累
            body: Ualá $3.2B 的估值和 2026 年 $215M 的股权注入，说明公司拥有非凡的赞助方融资能力；但墨西哥银行子公司在 2025 年第一季度亏损 MXN 282M，也说明区域规模化仍需持续资本补贴。
            calloutType: insight
            claimRefs:
              - CI001
              - CI008
              - CI013
          - type: callout
            title: 贷款业务的信用拨备加速
            body: 墨西哥信用风险拨备同比增长 91%，凸显进入循环信贷产品会造成显著的减值波动，并侵蚀净利息利润率。
            calloutType: risk
            claimRefs:
              - CI009
              - CI011
          - type: callout
            title: 私营指标披露的投资判断要求
            body: 在验证企业估值假设前，机构投资者必须要求公司经审计披露集团合并现金消耗、活跃注资账户占比和各客户群单位经济性。
            calloutType: recommendation
            claimRefs:
              - CI006
              - CI012
  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 一体化金融生态与核心用户工作流
        blocks:
          - type: paragraph
            body: >-
              Ualá
              在阿根廷、墨西哥和哥伦比亚提供一体化金融生态，覆盖数字支付账户、借记卡、个人贷款、投资工具和商户支付处理。平台不是单一的支付工具，而是一个连贯的金融环境，旨在从基础零售交易一路捕捉用户活动，延伸至财富积累和小企业商业活动。在消费者呈现层，Ualá
              提供原生移动应用，用于自动化数字开户并即时发行数字 Mastercard，消除了拉丁美洲传统金融机构常见的网点摩擦。

              消费者旅程从支付工具和交易借记功能开始，这是过去无法使用正规银行产品的人进入金融体系的入口。通过日常交易和账单支付，用户建立行为数据足迹，进而在应用内获得小额贷款和分期信贷。对商业用户和微型企业家而言，Ualá
              Bis 通过移动 POS 终端和数字支付链接把生态延伸到商户收单，让交易即时结算至商户的 Ualá 数字账户。把消费者零售账户与商户收单工具结合起来后，Ualá
              能在平台内部推动资金闭环流转，强化个人和企业两端的采用，同时提供即时冻结银行卡等关键应用内安全控制。
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
