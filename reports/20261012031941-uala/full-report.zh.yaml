chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、经营版图与战略使命
        blocks:
          - type: paragraph
            body: >-
              Ualá 由 Pierpaolo Barbieri 于 2017
              年在阿根廷布宜诺斯艾利斯创立，目标是用移动优先的金融平台应对区域性银行服务不足。运营八年后，公司已从单一产品的预付卡发行商转型为完整的数字金融生态，提供借记卡和信用卡、个人贷款、高收益储蓄、自动化投资、嵌入式保险和商户收单解决方案。业务覆盖拉丁美洲三大经济体：阿根廷、墨西哥和哥伦比亚。在本土阿根廷市场，Ualá
              已实现广泛渗透，近五分之一的成年人在平台上拥有账户。公司在区域内服务超过 11 million 名注册客户，借助高智能手机普及率和现代数字银行基础设施推动金融普惠。
            claimRefs:
              - CO001
              - CO007
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO007
              - CO009
              - CO015
      - number: '1.2'
        title: 高管领导、治理结构与创始人依赖
        blocks:
          - type: paragraph
            body: >-
              Ualá 的战略和运营方向仍由创始人兼 CEO Pierpaolo Barbieri
              紧密把控；他掌握核心执行权，也是公司在拉丁美洲的公众发言人。随着大型机构融资轮次推进，公司治理逐渐成熟，纳入了正式董事会席位以及来自 Allianz X、SoftBank Latin America
              Fund、Tencent 和 Soros Fund Management 等一线全球投资者的战略监督。管理层已展现出取得受监管银行牌照并执行战略收购的能力，但 Ualá 对 Barbieri
              的依赖仍然明显：公司愿景、机构投资者关系和高层监管沟通都离不开他。治理保障和机构董事会参与提供了连续性，但境外银行子公司的更多高级管理层信息在公开披露中仍然有限。
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: 资本化历史、估值演变与战略投资者
        blocks:
          - type: paragraph
            body: >-
              Ualá 已建立拉丁美洲科技公司中最突出的资本化画像之一，七轮融资累计获得约 $1.1 billion 股权融资。2021 年 8 月，公司在 SoftBank Latin America Fund 与
              Tencent 联合领投的 $350 million D 轮融资后成为独角兽，估值达到 $2.45 billion。2024 年 11 月和 2025 年 3 月，Ualá 获得 Allianz X 领投的
              $366 million E 轮融资；随后在 2026 年 3 月又完成一轮 $197 million 股权融资，投后估值达到 $3.2 billion。战略合作方包括嵌入式保险领域的 Allianz X
              和数字资产技术领域的 Tether，机构支持方还包括 D1 Capital Partners、Stone Ridge Holdings Group 和 Soros Fund
              Management。集团盈利能力和合并收入仍是关键尽调缺口，第三方平台估计公司最近年度收入为 $186 million。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO006
              - CO008
      - number: '1.4'
        title: 运营里程碑、监管牌照与子公司表现
        blocks:
          - type: paragraph
            body: >-
              Ualá 的公司发展以快速扩张和在拉丁美洲积极申请监管牌照为特征。2017 年推出最初的预付卡后，公司于 2020 年扩张至墨西哥，并于 2022 年进入哥伦比亚。2023 年 5 月收购墨西哥 ABC
              Capital 是决定性战略里程碑，使 Ualá 获得了 CNBV 监管下的多功能银行机构牌照（Institución de Banca Múltiple）。2026 年初，Ualá 与 Allianz
              结盟，进一步扩大保险科技版图；合作上线数周内便产生超过 300,000 份嵌入式人寿和个人意外保险报价。然而，Ualá México 的监管申报凸显了子公司的高成本：2025 年第一季度，该业务季度净亏损 MXN
              282 million，并在 12 个月内吸收 MXN 1,246 million 资本注入，说明受监管区域扩张仍持续消耗资本。
            claimRefs:
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO008
              - CO011
              - CO013
              - CO014
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 强大的机构支持与嵌入式分销
            body: >-
              Ualá 打造了颇具分量的股权结构表，将顶级金融投资方（SoftBank、Tencent、Soros、Goldman Sachs）与 Allianz X 等战略合作伙伴结合起来；后者在上线数周内产生了超过
              300,000 份嵌入式保险报价。
            calloutType: strength
            claimRefs:
              - CO004
              - CO012
          - type: callout
            title: 墨西哥银行业务的监管资本拖累
            body: >-
              墨西哥是 Ualá 区域增长的核心引擎，但在 CNBV 监管下运营一家全牌照银行意味着持续吸收大量资本。2025 年第一季度季度净亏损 MXN 282 million，年度资本注入超过 MXN 1.2
              billion，正是这一点的体现。
            calloutType: risk
            claimRefs:
              - CO013
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与服务范围
        blocks:
          - type: paragraph
            body: >-
              Ualá
              在拉丁美洲运营的是完整的金融科技生态，而不是单一支付卡业务。公司的可服务市场覆盖零售交易账户、点对点和跨境转账、自动账单支付、消费者分期信贷、共同基金和股票投资、嵌入式保险以及商户收单。在阿根廷本土市场以及墨西哥和哥伦比亚的扩张市场，Ualá
              直接面对传统商业银行、区域性数字银行和现金型非正式融资。平台把高频交易流程与持牌银行存款及信贷审批打包，抓住消费者日常支出，同时避开复杂的企业银行业务和资本密集型工业贷款。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 可服务市场规模与扩张空间
        blocks:
          - type: paragraph
            body: >-
              评估 Ualá 的总可服务市场，需要分别审视三个核心地理市场，而不是采用一个汇总的拉丁美洲估算。在阿根廷，早期增长利用了基础设施失衡：移动智能手机渗透率达到 92%，但银行渗透率仍约为 50%，这让 Ualá
              能够吸引超过 11 million 名用户，并覆盖五分之一居民。在墨西哥，截至 2023 年，超过 130 million 名居民构成可服务人口，约 88% 的交易仍依赖现金。通过收购 ABC Capital
              等方式取得完整银行牌照后，Ualá 连接了正规银行服务缺口、高收益储蓄需求和美墨汇款流，但全面的国家层面 TAM 披露仍是持续的尽调缺口。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM010
              - CM011
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM010
              - CM011
      - number: '2.3'
        title: 买方细分与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Ualá 的客户结构覆盖两大核心群体：银行服务不足的零售消费者和微型商户。早期用户主要是年轻人，55% 的用户年龄在 18 至 30 岁之间，超过 22% 的 18 至 25 岁阿根廷人持有银行卡。更关键的是，约
              65% 的注册用户加入前没有正式信用记录，因此公司必须依据替代性交易和人口统计信号，用自有 AI 信用评分模型完成评估。在商业端，Ualá Bis 收单平台为微型商户和独立创业者提供支付链接及移动 POS
              终端，为过去被商户收单网络排除在外的企业提供低摩擦数字收款工具。
            claimRefs:
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM007
              - CM008
              - CM009
      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Ualá
              覆盖市场的采用率受多重结构性顺风推动，包括智能手机普及、监管对数字支付的鼓励，以及消费者转向移动优先银行服务。然而，宏观和结构性约束也决定了市场扩张边界。在阿根廷，通胀周期剧烈波动、利率大幅起落，带来尖锐的信用风险；央行数据表明，在收缩期约
              10% 的家庭拖欠消费贷款。              在墨西哥，现金使用习惯、对非银行机构的信任障碍和根深蒂固的现有分销体系持续形成阻力，公司需要投入大量资本并全面合规，才能维持长期存款增长。
            claimRefs:
              - CM010
              - CM011
              - CM012
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 移动渗透率与银行服务差距
            body: Ualá 在阿根廷切入市场的核心突破口，是 92% 的手机渗透率与 50% 的银行渗透率之间的显著差距；这一差距让数字优先金融服务得以快速普及，无需铺设实体网点。
            calloutType: insight
            claimRefs:
              - CM002
              - CM003
          - type: callout
            title: 宏观波动与信用风险
            body: 在拉丁美洲扩张信贷会遭遇严重的逆风周期；阿根廷央行数据显示，在高利率环境下约 10% 的家庭拖欠贷款，给消费信贷扩张带来审批挑战。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              拉丁美洲零售金融科技市场呈现三方竞争：移动优先数字银行、整合电商与支付平台，以及以网点为中心的传统商业银行。在 Ualá
              的核心运营国家阿根廷、墨西哥和哥伦比亚，数百万此前没有银行账户或银行服务不足的消费者正通过手机应用首次接触正规金融服务。Ualá 在阿根廷直接面对 Brubank 等本土数字银行，也要与 Mercado Pago
              这样的商户和消费者综合生态在阿根廷及墨西哥竞争。此外，现金仍是该地区占主导地位的现状替代方案，非正式商业网络和柜台支付点承载着大量消费者交易。要赢得市场份额，Ualá
              必须超越基础预付卡发行，提供整合日常支付、储蓄、信贷和投资的产品组合，降低消费者对现金的依赖。
            claimRefs:
              - CP001
              - CP002
              - CP012
      - number: '3.2'
        title: 直接同业与传统银行挑战者
        blocks:
          - type: paragraph
            body: >-
              Ualá 运营范围内的竞争者，可按监管牌照、分销规模和资本支持分层。在阿根廷，Brubank 是直接的纯数字银行同业，从成立起就取得完整银行牌照，主要争夺数字原生零售银行用户。在墨西哥，Mercado Pago
              借助 MercadoLibre 庞大的电商商户基础和消费者流量，实现数字钱包的广泛渗透，分销规模极具压力。BBVA、Santander 和 Banco Galicia
              等传统银行拥有庞大的企业和薪资客户关系，但也背负着网点密集型运营成本，软件发布周期更慢。2026 年 Allianz X 领投的 $197 million 股权融资将 Ualá 估值推至 $3.2
              billion，使其资产负债表规模足以挑战金融科技公司和传统机构。不过，在本土市场之外扩张受监管业务会带来明显财务拖累，墨西哥持续的季度经营亏损和高额资本承诺就是证明。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP006
      - number: '3.3'
        title: 能力对比与定价经济性
        blocks:
          - type: paragraph
            body: >-
              在核心消费者能力上，各家平台已基本实现基础交易服务的同质化，竞争焦点转向完整的 360 度金融效用。Ualá 和 Mercado Pago
              等领先平台已经消除了日常金融任务的关键摩擦：数字账户注册免费、发卡不收费，公用事业账单支付和话费充值也不收佣金。差异化越来越来自高毛利的相邻业务：个人贷款、信用卡发行、通过 Ualá Bis 进行的 POS
              商户收单，以及嵌入式零售投资产品。Ualá
              通过支付交换费、贷款利差、商户收单折扣率，以及外汇和投资交易手续费实现生态变现。由于基础账户维护和点对点转账高度商品化，要留住客户存款，就必须提供有吸引力的高收益储蓄机制，同时控制获客和服务成本。
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP009
              - CP011
      - number: '3.4'
        title: 转换成本、护城河持久性与不利风险
        blocks:
          - type: paragraph
            body: >-
              区域零售金融科技的防御力取决于监管护城河、技术敏捷性和跨业务账户黏性。Ualá 的核心结构性优势来自阿根廷和墨西哥的完整银行牌照；这些牌照部分通过收购 ABC Capital
              获得，使公司能够直接持有受监管存款，而不必依赖第三方银行合作方。依托 Mambu 提供的灵活云原生核心银行架构，Ualá 可以快速迭代贷款、投资和与 Tether
              等战略投资者共同开发的稳定币能力。然而，拉丁美洲零售消费者的转换成本仍然结构性偏低，多钱包、多银行卡并用十分常见，消费者会借此获取促销利率和返现优惠。此外，墨西哥激进扩张信贷使 Ualá
              暴露于严重审批风险；2025 年初，随着信用卡余额增长，信用风险拨备同比跃升 91%。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP010
              - CP013
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP005
              - CP012
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 监管银行牌照构成结构性进入壁垒
            body: >-
              与完全依赖赞助银行或预付牌照的轻监管支付钱包不同，Ualá 收购墨西哥 ABC Capital，并在阿根廷建立持牌银行基础，使公司能够直接吸收存款并获得监管资本保护。这样的监管定位把 Ualá
              变成一家多市场银行机构，能够获取黏性较强的工资和储蓄存款，但也带来严格的资本充足率合规要求，以及 CNBV 和各国央行的持续监管。
            calloutType: insight
            claimRefs:
              - CP004
              - CP005
              - CP013
          - type: callout
            title: 墨西哥竞争加剧与逾期逆风
            body: >-
              Ualá 在墨西哥的激进扩张正面临 Mercado Pago 等成熟生态和 Nu México 等积极扩张的数字银行挑战者。2025 年第一季度，墨西哥银行业务报告季度净亏损 282 million
              Mexican pesos；随着信用卡规模增长，信用风险拨备同比跃升 91% 至 51.9 million pesos。在高通胀新兴市场快速发放贷款，如果审批模型无法应对经济放缓，就会带来严重的信用账龄风险。
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与定价 / 变现结构
        blocks:
          - type: paragraph
            body: >-
              Ualá 通过连接消费者数字账户和拉丁美洲商户结账服务，实现多产品数字金融生态的变现。在消费者端，核心价值主张是免费的数字 Mastercard
              账户，并与储蓄、个人贷款、共同基金投资和数字保险相连。零售持卡人无需支付开户、维护或销户费用，因此直接面向消费者的变现依赖交易交换费、外汇和 CEDEAR
              股票购买的汇兑利差，以及循环信贷和个人分期贷款利息。在商业端，Ualá Bis 向中小商户提供移动
              POS（mPOS）终端和数字支付链接，并通过随结算速度变化的商户折扣率，从交易额中获得收入。在保险分销领域，与全球保险公司的合作为平台带来佣金收入。
            claimRefs:
              - CI003
              - CI004
              - CI012
