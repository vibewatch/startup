      - number: '7.3'
        title: 运营韧性与基础设施依赖
        blocks:
          - type: paragraph
            body: >-
              Ualá 100% 数字化的运营模式消除了网点房地产开支，却造成集中的技术和交易对手依赖。在区域金融生态核心，Ualá 依靠部署于 Amazon Web Services（AWS）的 Mambu 云原生核心银行
              SaaS 引擎，编排账户账本、客户余额和数字贷款工作流。Mambu 的可组合架构支持阿根廷、墨西哥和哥伦比亚快速多国部署，但 Mambu 或 AWS
              发生重大中断，将使整个集团的贷款审批和交易处理陷入瘫痪。在银行卡业务中，Ualá 完全依赖 Mastercard
              这一单一支付网络合作方，处理国际预付卡、借记卡和信用卡。任何支付网络规则变化、交换费上限或结算停机，都会直接威胁获客和交易收入。在内部，运营执行也有可量化的损失频率。Ualá México
              专门的风险部门（UAIR）仅在 1T 2025 就记录了 352 起运营风险事件，其中 79 起被归类为可造成损失的事件，导致 MXN 7.16 million 直接财务损失。该季度还记录了 7
              起系统故障事件，不过完整的灾难恢复计划（DRP）避免了直接经济损失。控制运营泄漏并确保供应商冗余和韧性，是公司必须守住的执行底线。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
