  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、建议与立场
        blocks:
          - type: paragraph
            body: >-
              Ualá 的长期投资逻辑建立在拉美区域金融科技基础设施、多产品消费银行和年轻用户高渗透率之上。Ualá 在阿根廷、墨西哥和哥伦比亚拥有超过 11 million 名客户，已从预付卡发行商转型为持牌数字银行。它与
              Allianz X 的长期战略合作成功加速了嵌入式保险分销；Tether 最近投入的 $20 million，则带来了适配高通胀经济体的数字资产基础设施和可编程支付轨道。不过，尽管
              SoftBank、Tencent、Soros 和 D1 Capital
              等顶级股东信心强劲，公开证据尚未证明集团合并口径的单位经济模型或正向经营现金流。鉴于合并收入运行率、毛利率和清算优先权结构仍不透明，我们建议采取纪律性的 TRACK 立场。我们认为当前 $3.2 billion
              股权估值合理但对价格敏感：它既体现已验证的区域规模，也反映国际市场扩张中的重大信贷和监管执行风险。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV011
              - CV012
