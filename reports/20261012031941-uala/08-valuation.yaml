        - "$5.0B - $6.0B (10.0x - 12.0x net revenue)"
        - "Regional regulatory tightening on stablecoins or cross-border payment fees."
        - "25% (Requires execution acceleration in non-domestic markets)"
      - - "Base Case"
        - "Consolidated net revenue reaches $350M - $400M; Mexican credit losses normalize; modest group operating burn."
