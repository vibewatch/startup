        - "Continued Argentine currency devaluation and persistent macro inflation headwinds."
        - "50% (Current trajectory aligns with 2026 financing round baseline)"
      - - "Bear Case"
        - "Mexican bank loan provisions accelerate past forecasts; deposit run-off occurs; group cash burn requires dilutive down-round."
        - "$1.8B - $2.2B (5.0x - 6.0x net revenue)"
        - "Accelerating credit defaults, regulatory capital impairment, or major fintech competition."
        - "25% (Evidenced by MXN -282M Q1 2025 loss and +91% credit provision growth)"
    notes: "Scenario framework assuming $3.2B post-money baseline from 2026 funding; returns reflect 3-5 year horizon to liquidity."
