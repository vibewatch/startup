callouts:
  - calloutType: risk
    title: Mexican Credit Quality and Operating Losses Represent Immediate Vulnerabilities
    body: >-
      While Ualá holds a robust Mexican banking capital adequacy ratio (ICAP) of 39.9% and a liquidity coverage ratio of
      2,018%, the quality of its loan book is severely stressed, with Stage 3 non-performing assets comprising 20% of
      total loans and generating MXN 47 million in quarterly write-offs. Paired with a quarterly net operating loss of
      MXN 282 million in Mexico, the business model relies heavily on sustained equity subsidization from parent
      sponsors to absorb credit degradation.
    claimRefs:
      - CR005
      - CR006
      - CR007
      - CR012
