evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials-gap
    missingEvidence: >-
      Audited consolidated financial statements detailing group revenue, gross margin, operating expenses, and cash burn
      rate across Argentina, Mexico, and Colombia operations.
    whyItMatters: >-
      Without consolidated group financial statements, equity valuation multiples rely on secondary platform estimates
      ($186M revenue on Multiples.vc) rather than audited operating performance.
    diligencePath: >-
      Request confidential management financial presentation, consolidated FY2024-FY2025 audited financial statements,
      and segment revenue breakdown by operating country.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete executive roster covering Chief Financial Officer, Chief Risk Officer, and general managers for Mexico
      and Colombia banking subsidiaries.
    whyItMatters: >-
      Executive depth and regulatory governance across three distinct banking jurisdictions cannot be fully evaluated
      with only CEO and institutional board disclosures.
    diligencePath: >-
      Review local regulatory governance filings in Mexico (CNBV) and Colombia (SFC) and verify senior management
      appointments with company investor relations.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-or-investor-map
    missingEvidence: >-
      Complete cap table detailing shareholding percentages, liquidation preferences, voting control agreements, and
      secondary transaction terms across Series A through the 2026 funding round.
    whyItMatters: >-
      Assessing founder dilution, governance control, and downside protection requires the full preferred share rights
      stack above common equity.
    diligencePath: >-
      Obtain corporate charter documents, Series E / 2026 round investor rights agreements, and shareholder register
      from company legal counsel.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: addressable-market-sizing
    missingEvidence: >-
      Audited regional TAM and SAM figures broken down by country-level product transaction volume (cards vs. loans vs.
      investments vs. merchant acquiring).
    whyItMatters: >-
      Without segmented TAM disclosure, evaluating market saturation in Argentina versus upside potential in Mexico and
      Colombia remains reliant on top-line estimates.
    diligencePath: >-
      Request country-level cohort transaction data, merchant acquiring gross merchandise volume, and regional TAM
      analysis from management.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: customer-economics
    missingEvidence: >-
      Country-level unit economics, customer acquisition costs (CAC), and customer lifetime value (LTV) across
      demographic cohorts.
    whyItMatters: >-
      High top-line user numbers do not reveal whether lower-income and young adult cohorts generate positive
      contribution margin after credit provisioning.
    diligencePath: Examine management diligence pack for cohort-level contribution margin and active funded user ratios.
    relatedQuestionRefs: []
  - type: private-evidence-only
    severity: material
    topic: merchant-acquiring-retention
    missingEvidence: >-
      Granular competitor merchant churn rates, mPOS device payback cycles, and merchant acquiring net revenue margins
      for Ualá Bis versus Mercado Pago Point and Clip.
    whyItMatters: >-
      Without segmented merchant acquiring churn and take-rate disclosures, evaluating the long-term defensibility of
      Ualá Bis against specialized acquiring incumbents remains constrained.
    diligencePath: >-
      Request management disclosure on Ualá Bis cohort retention curves, merchant cross-sell conversion into working
      capital loans, and terminal subsidy loss rates.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: consolidated-financials
    missingEvidence: >-
      Audited consolidated income statement, group-level net revenue, gross margin, and operating cash burn for
      2024-2026.
    whyItMatters: >-
      Without consolidated group accounts, it is impossible to verify whether the Argentine operating core generates
      sufficient profit to absorb expansion losses in Mexico and Colombia.
    diligencePath: >-
      Request audited consolidated financial statements, statutory group filings, and management commentary on
      consolidated runway and cash flow breakeven.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: credit-risk-metrics
    missingEvidence: >-
      Vintage-based loan loss curves, non-performing loan (NPL) roll rates, and recovery rates across credit card and
      consumer loan cohorts.
    whyItMatters: >-
      Rapidly rising credit provisions in Mexico (MXN 51.9M in Q1 2025) indicate increasing underwriting risk that could
      impair capital adequacy if default rates accelerate.
    diligencePath: >-
      Obtain quarterly credit cohort vintage analyses, net charge-off statistics, and risk-adjusted margin reports by
      product and credit tier.
  - type: missing-source
    severity: material
    topic: cohort-unit-economics
    missingEvidence: >-
      Cohort-specific customer acquisition costs (CAC), payback periods, and net revenue retention (NRR) across retail
      and merchant segments.
    whyItMatters: >-
      Top-line registered user counts (11M+) do not reveal whether acquired accounts generate positive lifetime value
      after marketing, fraud, and servicing expenses.
    diligencePath: >-
      Request management presentation of cohort contribution margins, monthly transacting user percentages, and merchant
      acquiring take-rate trends.
  - type: missing-source
    severity: material
    topic: infrastructure-uptime-and-developer-signals
    missingEvidence: Public system status pages, quantitative API uptime/latency SLA logs, and public engineering repository metrics.
    whyItMatters: >-
