companyProfile:
  summary: >-
    Ualá is a Buenos Aires-based fintech founded in 2017 by Pierpaolo Barbieri. It operates a mobile-first consumer and
    merchant financial ecosystem across Argentina, Mexico, and Colombia, spanning cards, payments, lending, investments,
    insurance, and acquiring. The company remains a late-stage private business with strong institutional backing, but
    public group financial disclosure remains limited.
