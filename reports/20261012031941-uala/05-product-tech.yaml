  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Workflow
      - Company Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - Consumer retail payment & spending
        - Cash dependency or physical bank branch visits
        - Native mobile app with digital Mastercard and account management
        - Instant card issuance and app-based card freezing security controls
        - Cardholder must maintain mobile device access and network connectivity
      - - Unbanked credit access & building
        - Informal borrowing or denial due to lack of credit bureau record
        - Micro-loans and BNPL evaluated via app-based behavioral engagement
        - Enables credit history creation from initial debit and payment activity
        - Higher credit risk requiring substantial provisioning reserves
      - - Merchant payment collection (Ualá Bis)
        - Cash-only sales or costly legacy POS terminals with delayed payout
        - mPOS reader hardware and digital payment links via Ualá Bis
        - Rapid transaction settlement directly into merchant Ualá account
        - Transaction volume sensitive to retail economic cycles
      - - Personal investment & asset storage
        - Traditional brokerage minimums or local currency inflation risk
        - In-app mutual fund investments and Tether strategic asset integration
        - Accessible digital wealth management through a single mobile interface
        - Underlying market volatility and digital asset regulatory evolution
    notes: Workflows reflect published consumer and merchant operational journeys across Ualá's core Latin American operating territories.
