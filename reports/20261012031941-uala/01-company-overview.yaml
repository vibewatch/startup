figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological evolution of Ualá from Argentine prepaid card issuer to multi-country licensed digital bank with a
      $3.2 billion valuation.
    data:
      items:
        - label: Company Launch & Series A
          date: 2017-2018
          detail: >-
            Pierpaolo Barbieri launches Ualá in Buenos Aires with a prepaid Mastercard; secures $10M Series A financing
            led by Soros Fund Management.
          tone: positive
        - label: Series B Scaling
          date: 2018-10
          detail: >-
            Secures $34M in Series B funding led by Goldman Sachs Asset Management to expand personal finance features
            and technical talent.
          tone: positive
        - label: Series C & Mexico Launch
          date: 2019-2020
          detail: >-
            Raises $150M Series C led by SoftBank and Tencent in late 2019; launches operations in Mexico in September
            2020.
          tone: positive
        - label: Series D & Unicorn Valuation
          date: 2021-08
          detail: >-
            Closes $350M Series D co-led by SoftBank and Tencent at $2.45B valuation, reaching unicorn status with 3.5M+
            cards issued.
          tone: positive
        - label: Colombia Rollout & Bank Acquisition
          date: 2022-2023
          detail: >-
            Launches in Colombia in January 2022 and acquires ABC Capital bank in Mexico in May 2023, gaining a full
            Mexican banking license.
          tone: positive
        - label: Series E Investment
          date: 2024-2025
          detail: >-
            Allianz X leads Series E round totaling $366M across two closes, initiating strategic embedded insurance
            collaboration across the region.
          tone: positive
        - label: Mexican Bank Losses Disclosed
          date: 2025-04
          detail: >-
            Ualá México reports Q1 2025 net loss of MXN 282M and cumulative 12-month capital absorption of MXN 1,246M
            under CNBV regulatory supervision.
          tone: adverse
        - label: 2026 Capital Round & $3.2B Valuation
          date: 2026-03
          detail: >-
            Secures $197M equity financing led by Allianz X with Tether participation at $3.2B valuation, scaling
            customer base past 11 million.
          tone: positive
    approximationNotes: >-
      Milestone dates and transaction figures are compiled from corporate announcements, regulatory filings with CNBV,
      and verified market disclosures.
    claimRefs:
      - CO004
      - CO006
      - CO007
      - CO008
      - CO011
      - CO013
      - CO014
callouts:
  - calloutType: strength
    title: Strong Institutional Sponsorship and Embedded Distribution
    body: >-
      Ualá has cultivated a distinguished cap table combining top-tier financial sponsors (SoftBank, Tencent, Soros,
      Goldman Sachs) with strategic partners like Allianz X, which generated over 300,000 embedded insurance quotes
      within weeks of its launch.
    claimRefs:
      - CO004
      - CO012
  - calloutType: risk
    title: Regulatory Capital Drag in Mexican Banking Operations
    body: >-
      While Mexico represents Ualá's core regional growth engine, operating as a fully licensed bank under CNBV
      oversight entails significant ongoing capital absorption, demonstrated by a quarterly net loss of MXN 282 million
      in Q1 2025 and over MXN 1.2 billion in annual capital injections.
    claimRefs:
      - CO013
      - CO014
