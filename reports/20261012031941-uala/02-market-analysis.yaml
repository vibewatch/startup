callouts:
  - calloutType: insight
    title: Mobile Penetration vs. Banking Disparity
    body: The core wedge for Ualá's market entry in Argentina was the sharp divergence between a 92% mobile phone penetration rate and a 50% banking penetration rate, enabling rapid adoption of digital-first financial services without physical branch infrastructure.
    claimRefs:
      - CM002
      - CM003
  - calloutType: risk
    title: Macroeconomic Volatility and Credit Risk
    body: Expanding credit in Latin America faces severe headwind cycles; in Argentina, central bank data showed approximately 10% of families falling behind on loan payments amid elevated interest rates, creating underwriting challenges for consumer credit expansion.
    claimRefs:
      - CM011
      - CM012
