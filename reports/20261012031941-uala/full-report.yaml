      - number: '6.2'
        title: Adoption trajectory, user scaling, and credit performance
        blocks:
          - type: paragraph
            body: >-
              Top-line adoption metrics demonstrate substantial platform expansion from Ualá's inception in 2017 through
              successive institutional financing rounds led by SoftBank, Tencent, and Allianz X. Company disclosures
              highlighted an expansion from 3.5 million issued cards in 2021 to over 8 million platform users and 7
              million issued loans by late 2024. In Mexico, following the acquisition of ABC Capital and transition to a
              licensed multiple banking institution (Institución de Banca Múltiple), Ualá reported a 14% monthly
              compound expansion in active users. Nonetheless, underlying credit quality and delinquency dynamics
              highlight substantial underwriting risks. Regulatory financial reporting from Ualá México for the first
              quarter of 2025 demonstrates that while the net loan portfolio reached MXN 504 million and traditional
              deposits grew to MXN 5,831 million, credit provisioning surged by 91% year-over-year to MXN 51.9 million,
              driven almost entirely by credit card delinquency. Within the Mexican loan book, Stage 3 non-performing
              loans accounted for 20% of the total portfolio, with Stage 3 short-term credit defaults exceeding 99.5%.
              These adverse metrics indicate that aggressive customer onboarding in competitive emerging markets
              introduces severe credit loss exposure that dampens gross margins and challenges the durability of retail
              customer economics.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
