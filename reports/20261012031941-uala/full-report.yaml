      - number: '7.2'
        title: Credit Underwriting and Balance Sheet Sustainability
        blocks:
          - type: paragraph
            body: >-
              Credit origination constitutes Ualá's primary engine for monetization and net interest margin generation,
              but it also represents the highest source of balance sheet vulnerability. Disclosures from Ualá S.A.
              Institución de Banca Múltiple for the first quarter of 2025 reveal that Stage 3 non-performing loans
              constituted 20% of the total loan portfolio of MXN 621 million. For receivables with repayment windows
              under 30 days, the default rate in Stage 3 reached 99.5%, underscoring extreme loss severity once accounts
              fall delinquent. Credit cards represent the epicenter of this risk: of the MXN 47 million in total
              portfolio write-offs executed during the quarter, MXN 40 million originated from credit card lines. These
              credit costs heavily depressed operating profitability, requiring MXN 51.9 million in preventive credit
              risk allowances and contributing to an overall quarterly net loss of MXN 282 million for the Mexican
              banking subsidiary. On an annual basis, Ualá México required MXN 1,246 million in capital injections over
              trailing twelve months to offset operating burn and maintain regulatory compliance. Capital adequacy
              remains technically sound, with an ICAP of 39.9% and a liquidity coverage ratio (CCL) of 2,018%, well
              exceeding CNBV Category I minimums. However, ICAP declined by 26.9 percentage points year-over-year,
              demonstrating that without persistent capital replenishment from parent funding rounds, rapid loan
              expansion and credit deterioration would rapidly erode the subsidiary's capital buffer.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
