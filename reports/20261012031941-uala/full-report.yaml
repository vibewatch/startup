      - number: '6.3'
        title: Merchant acquiring expansion, customer proof, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Beyond retail consumer wallets, Ualá has pursued an ecosystem expansion strategy into merchant acquiring
              and micro-enterprise payment solutions via Ualá Bis. Launched initially to capture small business payment
              flows through mobile point-of-sale (mPOS) terminals and digital payment links, Ualá Bis experienced rapid
              early adoption, with monthly processing volumes increasing 27-fold within its first eight months of
              operation. By 2024, merchant acquiring total payment volume (TPV) expanded by 55% over a twelve-month
              period, demonstrating commercial traction among independent merchants and informal retailers. To support
              this expanding multi-product infrastructure, Ualá migrated core data workloads to Google Cloud BigQuery
              and implemented Mambu's cloud-native core banking engine, which was deployed in two months to accelerate
              digital lending rollouts. Despite these operational milestones, customer durability remains clouded by
              critical gaps in public disclosure. Ualá does not disclose cohort retention rates, monthly active user
              ratios (MAU/total registered), net revenue retention (NRR), or customer acquisition cost (CAC). Moreover,
              Ualá México's regulatory filings reveal credit concentration risks where the four largest counterparties
              consume 33% of basic capital, and three Mexican states (Estado de México, Nuevo León, and CDMX) represent
              69% of the credit portfolio, highlighting regional vulnerability and potential counterparty exposure.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
