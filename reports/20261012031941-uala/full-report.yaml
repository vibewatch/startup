chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Strategic Mission
        blocks:
          - type: paragraph
            body: >-
              Ualá was founded in 2017 in Buenos Aires, Argentina, by Pierpaolo Barbieri with the objective of
              addressing widespread regional underbanking through a mobile-first financial platform. Over eight years of
              operation, the company has transitioned from a single-product prepaid card issuer into a full-scale
              digital financial ecosystem providing debit and credit cards, personal loans, high-yield savings,
              automated investments, embedded insurance, and merchant acquiring solutions. The business operates across
              three major Latin American economies: Argentina, Mexico, and Colombia. In its domestic market of
              Argentina, Ualá has established pervasive penetration, with nearly one in five adults maintaining an
              account on the platform. Regionally, the institution serves more than 11 million registered customers,
              combining high smartphone adoption with modern digital banking infrastructure to drive financial
              inclusion.
            claimRefs:
              - CO001
              - CO007
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO004
              - CO005
              - CO007
              - CO009
              - CO015
      - number: '1.2'
        title: Executive Leadership, Governance Structure, and Founder Dependence
        blocks:
          - type: paragraph
            body: >-
              The strategic and operational trajectory of Ualá remains closely guided by founder and Chief Executive
              Officer Pierpaolo Barbieri, who maintains central executive authority and serves as the public voice of
              the company across Latin America. Corporate governance has matured alongside major institutional funding
              rounds, incorporating formal board representation and strategic oversight from tier-one global investors
              including Allianz X, SoftBank Latin America Fund, Tencent, and Soros Fund Management. While the leadership
              team has demonstrated strong execution in securing regulated banking licenses and executing strategic
              acquisitions, Ualá exhibits notable key-person dependence on Barbieri for vision, institutional investor
              relationships, and high-level regulatory diplomacy. Governance safeguards and institutional board
              participation provide continuity, yet broader senior executive disclosure across foreign banking
              subsidiaries remains limited in public disclosures.
            claimRefs:
              - CO002
              - CO003
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
      - number: '1.3'
        title: Capitalization History, Valuation Progression, and Strategic Investors
        blocks:
          - type: paragraph
            body: >-
              Ualá has established one of the most prominent capitalization profiles among Latin American technology
              companies, raising approximately $1.1 billion in cumulative equity financing across seven funding rounds.
              The company achieved unicorn status in August 2021 following a $350 million Series D financing co-led by
              SoftBank Latin America Fund and Tencent at a $2.45 billion valuation. In November 2024 and March 2025,
              Ualá secured a $366 million Series E financing led by Allianz X, which was followed in March 2026 by an
              additional $197 million equity round valuing the company at $3.2 billion post-money. Strategic partners
              include Allianz X in embedded insurance and Tether in digital asset technology, alongside institutional
              sponsors D1 Capital Partners, Stone Ridge Holdings Group, and Soros Fund Management. A critical diligence
              gap persists regarding group profitability and consolidated revenue, with third-party platforms estimating
              latest annual revenue at $186 million.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO008
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO006
              - CO008
      - number: '1.4'
        title: Operational Milestones, Regulatory Licensing, and Subsidiary Performance
        blocks:
          - type: paragraph
            body: >-
              Ualá's corporate development is characterized by rapid scaling and aggressive regulatory licensing across
              Latin America. After launching its original prepaid card in 2017, the company expanded geographically to
              Mexico in 2020 and Colombia in 2022. A decisive strategic milestone occurred in May 2023 with the
              acquisition of ABC Capital in Mexico, providing Ualá with a regulated multiple banking institution license
              (Institución de Banca Múltiple) under CNBV supervision. In early 2026, Ualá expanded its insurtech
              footprint via its alliance with Allianz, generating over 300,000 embedded life and personal accident
              insurance quotes within weeks. However, regulatory filings from Ualá México highlight substantial
              subsidiary costs: for Q1 2025, the unit recorded a quarterly net loss of MXN 282 million and absorbed MXN
              1,246 million in capital injections over twelve months, underscoring the ongoing capital intensity of
              licensed regional expansion.
            claimRefs:
              - CO009
              - CO011
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO004
              - CO006
              - CO007
              - CO008
              - CO011
              - CO013
              - CO014
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Strong Institutional Sponsorship and Embedded Distribution
            body: >-
              Ualá has cultivated a distinguished cap table combining top-tier financial sponsors (SoftBank, Tencent,
              Soros, Goldman Sachs) with strategic partners like Allianz X, which generated over 300,000 embedded
              insurance quotes within weeks of its launch.
            calloutType: strength
            claimRefs:
              - CO004
              - CO012
          - type: callout
            title: Regulatory Capital Drag in Mexican Banking Operations
            body: >-
              While Mexico represents Ualá's core regional growth engine, operating as a fully licensed bank under CNBV
              oversight entails significant ongoing capital absorption, demonstrated by a quarterly net loss of MXN 282
              million in Q1 2025 and over MXN 1.2 billion in annual capital injections.
            calloutType: risk
