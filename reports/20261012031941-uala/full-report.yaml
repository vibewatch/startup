            title: Core Migration and Multi-Vendor Integration Exposure
            body: >-
              Transitioning acquired banking assets from legacy on-premises software while coordinating distinct cloud
              platforms across multiple jurisdictions introduces integration complexity and ongoing operational
              governance demands.
            calloutType: risk
            claimRefs:
              - CE010
