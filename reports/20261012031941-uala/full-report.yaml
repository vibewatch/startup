      - number: '7.3'
        title: Operational Resilience and Infrastructure Dependencies
        blocks:
          - type: paragraph
            body: >-
              Ualá's 100% digital operating model eliminates branch real-estate overhead but creates concentrated
              technological and counterparty dependencies. At the core of its regional financial ecosystem, Ualá relies
              on Mambu's cloud-native core banking SaaS engine, deployed on Amazon Web Services (AWS), to orchestrate
              account ledgers, customer balances, and digital lending workflows. While Mambu's composable architecture
              enabled rapid multi-country deployments across Argentina, Mexico, and Colombia, a major disruption at
              Mambu or AWS would paralyze loan underwriting and transactional processing across the entire group. In
              card operations, Ualá depends entirely on Mastercard as its single payment network partner for
              international prepaid, debit, and credit cards. Any scheme rule changes, interchange fee caps, or
              settlement downtime directly threaten customer acquisition and transaction revenues. Internally,
              operational execution carries measurable loss frequency. Ualá México's dedicated risk unit (UAIR) recorded
              352 operational risk events in 1T 2025 alone, of which 79 were classified as quebrantable loss incidents
              resulting in MXN 7.16 million in direct financial losses. Technological disruptions were also logged, with
              seven system failure incidents recorded in the quarter, though comprehensive Disaster Recovery Plans (DRP)
              prevented direct economic losses. Managing operational leakages and ensuring resilient vendor redundancy
              remain essential execution imperatives.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR013
              - CR014
      - number: '7.4'
        title: Risk Mitigations, Monitoring Indicators, and Diligence Path
        blocks:
          - type: paragraph
            body: >-
              Mitigating Ualá's compounding regulatory, credit, and operational risks requires strict underwriting
              governance, dynamic capital allocation, and proactive regulatory diplomacy. On credit risk, management
              utilizes CreditRisk+ Poisson distribution statistical modeling to calibrate expected and unexpected
              portfolio loss thresholds across six economic sectors, although the persistently high Stage 3 ratio
              demands tighter credit card scoring filters and lower initial credit limits for first-time borrowers. On
              liquidity and market risk, Ualá maintains an ultra-conservative treasury posture, deploying excess Mexican
              deposits into sovereign CETES, BONDES, and central bank deposits, which hold the market Value at Risk
              (VaR) at a modest MXN 2.91 million. Sponsoring relationships provide a crucial liquidity backstop: the
              syndicate led by Allianz X, SoftBank, Tencent, and Tether has demonstrated continuous capacity to
              recapitalize operating entities, evidenced by the $197 million equity round closed in March 2026 at a $3.2
              billion valuation. Key thesis-break triggers for investors include: (1) Mexico ICAP falling below 15%
              without immediate parent recapitalization commitments; (2) Stage 3 credit defaults exceeding 25% of the
              gross loan portfolio; (3) regulatory sanctions or license suspension by the CNBV or BCRA; and (4)
              unexpected core banking outages on Mambu/AWS exceeding four consecutive hours during peak transaction
              periods.
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mexican Credit Quality and Operating Losses Represent Immediate Vulnerabilities
            body: >-
              While Ualá holds a robust Mexican banking capital adequacy ratio (ICAP) of 39.9% and a liquidity coverage
              ratio of 2,018%, the quality of its loan book is severely stressed, with Stage 3 non-performing assets
              comprising 20% of total loans and generating MXN 47 million in quarterly write-offs. Paired with a
              quarterly net operating loss of MXN 282 million in Mexico, the business model relies heavily on sustained
              equity subsidization from parent sponsors to absorb credit degradation.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Recommendation, and Stance
        blocks:
          - type: paragraph
            body: >-
              Ualá presents a compelling long-term thesis centered on regional fintech infrastructure, multi-product
              consumer banking, and high youth adoption across Latin America. With more than 11 million customers across
              Argentina, Mexico, and Colombia, Ualá has transitioned from a prepaid card issuer into a fully licensed
              digital banking powerhouse. Its long-term strategic alliance with Allianz X has successfully accelerated
              embedded insurance distribution, while the recent $20 million investment from Tether introduces digital
              asset infrastructure and programmable payment rails tailored for high-inflation economies. However,
              despite top-tier sponsor conviction from SoftBank, Tencent, Soros, and D1 Capital, public evidence does
              not yet demonstrate consolidated unit economics or positive group operating cash flows. Given the opacity
              surrounding consolidated revenue run-rate, gross margins, and liquidation preference structures, we
              recommend a disciplined TRACK stance. We assess current equity valuation at $3.2 billion as fair and
              price-sensitive, balancing proven regional scale against significant credit and regulatory execution risks
              in expanding international markets.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV011
              - CV012
