      - number: '8.2'
        title: Valuation History, Financing Context, and Comparable Set
        blocks:
          - type: paragraph
            body: >-
              Ualá's post-money valuation has evolved methodically across successive private financing cycles. The
              company reached unicorn status in August 2021 with a $350 million Series D led by SoftBank Latin America
              Fund and Tencent, pricing equity at $2.45 billion post-money. Following regional expansion and the
              acquisition of commercial banking entities, Ualá completed a $366 million Series E in 2024 led by Allianz
              X at a $2.75 billion valuation mark. Most recently, the March 2026 financing round of $195 million led by
              Allianz X—subsequently expanded to $197 million in July 2026 with a $20 million strategic participation
              from Tether—established the current $3.2 billion post-money valuation mark. Relative to Latin American
              neobanking peers, Ualá trades at an implied multiple of roughly 8.0x to 10.0x estimated net revenues.
              While public comps such as Nubank command premium multiples supported by proven profitability and massive
              Brazilian scale, Ualá's valuation reasonably discounts its higher geographical exposure to Argentine
              macroeconomic volatility and early-stage commercialization in Mexico and Colombia.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
      - number: '8.3'
        title: Scenario Analysis, Downside Triggers, and Return Asymmetry
        blocks:
          - type: paragraph
            body: >-
              Our scenario framework evaluates Ualá's risk-return distribution across bull, base, and bear operating
              cases anchored to the $3.2 billion valuation baseline. In the bull case, Ualá scales embedded insurance
              with Allianz, deepens credit monetization in Mexico, and successfully integrates Tether's stablecoin rails
              to drive consolidated net revenue above $500 million, supporting an enterprise valuation between $5.0
              billion and $6.0 billion. The base case projects steady 20% to 30% regional user growth and gradual loss
              reduction, yielding a $3.2 billion to $3.8 billion valuation. Conversely, the bear case is heavily
              informed by adverse primary evidence from Mexican banking disclosures. In the first quarter of 2025, Ualá
              Mexico registered an operating net loss of MXN -282 million, a 91% surge in preventive credit risk
              estimations to MXN 51.9 million, and a 23% contraction in net financial margins due to elevated deposit
              funding costs. If credit loss curves deteriorate further or capital absorption accelerates, valuation
              could compress to $1.8 billion to $2.2 billion, creating substantial downside for common equity.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV009
              - CV012
      - number: '8.4'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Ualá possesses several institutional attributes indicative of eventual IPO readiness, including tier-one
              governance partners, prominent global sponsors, and regulated banking charters in its three primary
              markets. However, meaningful barriers to an initial public offering remain. Foremost is the total absence
              of publicly disclosed consolidated financial statements, audited revenue recognition policies, and
              cohort-level unit economics. Prospective institutional investors must prioritize confirmatory diligence on
              consolidated cash burn, cross-subsidization between Argentina and Mexico, and cap-table seniority
              provisions across Series D, E, and 2026 preference shares. Furthermore, monitorable thesis-break triggers
              include regulatory capital replenishment mandates from Mexico's CNBV, sustained contraction in net
              financial interest margins, or adverse regulatory restrictions on digital wallet stablecoin integrations.
              Until audited group statements confirm sustainable operating leverage, capital allocation discipline
              requires maintaining a TRACK posture.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Disciplined Stance: TRACK at $3.2B Valuation'
            body: >-
              While Ualá demonstrates outstanding regional reach across 11 million users and top-tier backing from
              Allianz and Tether, the lack of consolidated group audit data and widening Mexican banking losses
              necessitate maintaining a TRACK stance rather than chasing late-stage momentum.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV012
          - type: callout
            title: Mexico Credit Provision Escalation
            body: >-
              The 91% year-over-year surge in credit risk provisions at Ualá Mexico highlights seasoning risks in
              uncollateralized consumer lending, representing a primary vulnerability for consolidated unit economics.
            calloutType: risk
            claimRefs:
              - CV006
