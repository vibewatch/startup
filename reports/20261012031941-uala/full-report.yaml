  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              Operating as a licensed financial institution across Latin America subjects Ualá to complex, fragmented
              jurisdictional oversight that dictates both product velocity and balance sheet requirements. In Mexico,
              Ualá operates as a full-fledged commercial bank under the corporate name Ualá S.A. Institución de Banca
              Múltiple following formal regulatory approval from the Comisión Nacional Bancaria y de Valores (CNBV) in
              May 2023 for its acquisition of ABC Capital. While a full banking license provides direct deposit-taking
              authority and lower cost of funds, it imposes stringent capital reserve obligations, supervisory
              reporting, and formal risk governance that digital wallets do not bear. Legal contingencies represent an
              active operational friction: as of the first quarter of 2025, Ualá México reported 28 pending lawsuits
              against the bank with aggregate contingent liabilities of MXN 18.2 million. The institution provisioned
              MXN 13.75 million in reserves against nine active cases evaluated with probable or possible loss
              likelihood, while successfully dismissing three labor actions that had represented MXN 13.7 million in
              exposure. Furthermore, strategic product ambitions face hard regulatory boundaries in digital assets.
              Despite securing a $20 million minority investment from Tether as part of its $197 million round, existing
              central bank regulations in Argentina and banking laws in Mexico make immediate USDT integration
              impossible on regulated deposit platforms, keeping stablecoin distribution strictly outside the core
              neobank application.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
