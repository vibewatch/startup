            title: Top-of-funnel youth dominance versus monetization depth
            body: >-
              Over 22% of young Argentines aged 18-25 hold a Ualá card, and 65% had no prior credit history. While this
              delivers enormous brand reach, converting entry-level debit cardholders into profitable, retained deposit
              and credit customers remains unproven in consolidated unit economics.
            calloutType: insight
            claimRefs:
