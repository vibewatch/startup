  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Retail customer segmentation and regional onboarding
        blocks:
          - type: paragraph
            body: >-
              Ualá operates a multi-tiered customer architecture differentiated by geography, user demographic, and
              regulatory structure across its core footprint of Argentina, Mexico, and Colombia. The foundation of the
              consumer segment rests on mass-market digital inclusion, historically acquiring unbanked and underbanked
              individuals through frictionless digital mobile onboarding paired with physical and virtual Mastercard
              payment cards. In Argentina, the customer base exhibits deep penetration among young adults, with company
              disclosures noting that over 22% of Argentines aged 18 to 25 hold a Ualá card, and 55% of total users are
              between 18 and 30 years old. Furthermore, 65% of onboarded users possessed no formal credit history prior
              to adopting the mobile application, underscoring Ualá's role as an entry-level financial on-ramp. However,
              customer unit economics and product depth diverge significantly across jurisdictions. While the Argentine
              operation has layered mutual funds, local stock brokerage, cedears, and crypto-asset exposure on top of
              standard payment wallets, the Mexican expansion relies heavily on its licensed banking entity to capture
              adult depositors and credit card borrowers. This multi-country segmentation exposes the business to
              disparate regulatory frameworks and varying customer monetization profiles, complicating cross-border
              cohort comparability.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
