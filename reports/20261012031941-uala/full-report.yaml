      - number: '5.3'
        title: Digital Asset Integration and Competitive Differentiation
        blocks:
          - type: paragraph
            body: >-
              Ualá's technical differentiation stems from the convergence of full regulatory banking licenses and modern
              digital asset integration within a single consumer interface. While traditional neobanks in Latin America
              operate predominantly as prepaid payment apps or non-bank credit intermediaries, Ualá has secured full
              banking licenses in Argentina, Mexico, and Colombia. This regulatory posture enables the firm to originate
              deposits, issue fully regulated credit, and develop proprietary financial products without enduring the
              economic drag of third-party banking-as-a-service intermediaries.


              In parallel with regulated banking capabilities, Ualá has established a strategic partnership and
              investment alliance with Tether, the global stablecoin issuer, to advance its digital asset
              infrastructure. This collaboration aims to embed blockchain-enabled financial technology, programmable
              money rails, and stable value storage tools directly into Ualá's mobile application. In high-inflation
              Latin American economies where consumers seek inflation hedges and seamless cross-border value transfer,
              integrating decentralized finance principles into a licensed banking framework provides a distinctive
              product advantage. The architectural challenge involves bridging permissioned regulatory accounting
              ledgers with external blockchain rails while adhering to rigorous local anti-money laundering and
              know-your-customer compliance standards across different jurisdictions.
            claimRefs:
              - CE002
              - CE011
      - number: '5.4'
        title: Technological Risk Controls, Incident Management, and Operational Governance
        blocks:
          - type: paragraph
            body: >-
              As a regulated financial institution operating under the supervision of Mexico's Comisión Nacional
              Bancaria y de Valores (CNBV), Ualá S.A. Institución de Banca Múltiple adheres to institutionalized risk
              management and internal control standards. Under CNBV regulatory frameworks, technological risk is
              formally defined as potential economic loss or operational disruption arising from damages, interruptions,
              alterations, or failures across hardware, software, applications, networks, and distribution channels. The
              bank's Unidad de Administración Integral de Riesgos (UAIR) maintains a dedicated incident log, performs
              quarterly evaluations, and reports directly to the Risk Committee and the Board of Directors.


              Regulatory disclosures for the fourth quarter of 2024 and the first quarter of 2025 document the
              operational reliability of Ualá's Mexican banking operations. During 4T 2024, Ualá recorded 18
              technological risk incidents, representing a noticeable decline from the 31 incidents reported in 4T 2023.
              In 1T 2025, technological risk incidents further dropped to 7 events related to business processes and
              system malfunctions. Crucially, Mexican regulatory filings confirm that zero economic losses were incurred
              from these technological events across both reporting periods. Ualá maintains an operational Disaster
              Recovery Plan (DRP), five auxiliary governance committees, and automated financial accounting systems to
              ensure business continuity. Nevertheless, external visibility into quantitative SLA uptime, real-time API
              latency, and public developer engineering metrics remains restricted, requiring ongoing diligence review
              during technical evaluations.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Modern Cloud-Native Engine Architecture
            body: >-
              Ualá's dual reliance on Mambu for composable digital lending and Temenos Core R24 on AWS establishes a
              scalable, cloud-native foundation that decouples modern app features from legacy banking bottlenecks.
            calloutType: strength
            claimRefs:
