      - number: '5.2'
        title: Cloud-Native Infrastructure and Multi-Vendor Core Architecture
        blocks:
          - type: paragraph
            body: >-
              To support rapid cross-border expansion while transitioning from third-party product licensing to direct
              banking operations, Ualá has deployed a decoupled, multi-vendor cloud architecture. In Mexico, following
              the acquisition of ABC Capital, Ualá inherited an on-premises 10-year-old Temenos Core banking platform
              (version R13) that was incapable of handling anticipated transaction volumes. In response, engineering
              teams initiated a comprehensive migration to Temenos Core version R24 hosted on Amazon Web Services (AWS)
              cloud infrastructure. This cloud migration leverages Temenos's agnostic architecture to eliminate complex
              data translation layers and enable agile continuous deployment for banking services across Mexico.


              Complementing the Temenos core banking engine, Ualá operates Mambu's cloud-native, composable platform on
              AWS as its dedicated digital lending engine. Mambu was integrated into Ualá's operating environment in two
              months, providing a flexible framework that unbundles lending workflows from traditional monolithic
              banking databases. This composable architecture allows Ualá to rapidly configure, test, and launch novel
              credit and installment products across Argentina, Colombia, and Mexico without rewriting core accounting
              infrastructure. However, operating distinct core platforms—Temenos for regulated banking operations in
              Mexico and Mambu for regional digital lending—demands rigorous API orchestration, continuous data
              synchronization, and heightened architectural monitoring to prevent latency and reconciliation anomalies
              across jurisdictions.
            claimRefs:
              - CE002
              - CE009
              - CE010
          - type: table
            tableRef: TE003
