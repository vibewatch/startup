  - id: FU001
    title: Customer adoption and product expansion journey
    type: journey-map
    summary: >-
      Illustrates the customer lifecycle progression from initial unbanked onboarding to multi-product financial
      deepenings and merchant acquiring.
    data:
      items:
        - stage: Mobile Discovery and Onboarding
          label: Frictionless Mobile Onboarding
          actors:
            - Unbanked or young consumer
            - Ualá mobile KYC engine
          touchpoints:
            - Mobile app download
            - National identity verification (DNI/INE)
            - Instant virtual Mastercard issuance
          emotion: High initial enthusiasm due to zero account maintenance fees and fast branchless KYC.
        - stage: Basic Wallet and Payment Activity
          label: Transactional Habit Formation
          actors:
            - Active consumer
            - Retail merchant
          touchpoints:
            - Debit card retail transactions
            - Peer-to-peer bank transfers
            - Utility bill payments and mobile top-ups
          emotion: User experiences reliable money movement, establishing Ualá as a regular payment utility.
        - stage: Savings and High-Yield Capture
          label: Deposit Gathering and Yield Retention
          actors:
            - Saver / retail investor
            - Regulated banking entity
          touchpoints:
            - High-yield remunerated digital account
            - Mutual funds and fixed-term investments
            - In-app currency exchange (crypto/USD)
          emotion: Strong financial satisfaction driven by competitive yield, though vulnerable to rate cuts.
        - stage: Credit Access and Lending Expansion
          label: Credit On-Ramp and Underwriting
          actors:
            - Underbanked borrower
            - UaláScore AI credit engine
          touchpoints:
            - Micro-installment loans (BNPL)
            - Unsecured revolving credit card issuance
            - Automated repayment deductions
          emotion: Gratification from first formal credit access, accompanied by default risks for thin-file cohorts.
        - stage: Merchant Cross-Sell and Acquiring
          label: Commercial Acquiring via Ualá Bis
          actors:
            - Small business owner / entrepreneur
            - Ualá Bis acquiring platform
          touchpoints:
            - Mobile POS card reader (mPOS)
            - Remote digital payment links
            - Instant settlement into Ualá business balance
          emotion: High commercial utility from immediate settlement, driving merchant ecosystem retention.
        - stage: Enterprise and Cross-Border Partnerships
          label: Institutional Ecosystem Integration
          actors:
            - Enterprise partner (Allianz, Tether)
            - High-volume customer
          touchpoints:
            - Embedded digital insurance policies
            - Stablecoin transfer rails
            - Advanced API merchant checkout
          emotion: Deepened customer trust backed by institutional insurance coverage and global digital asset liquidity.
    approximationNotes: >-
      Model represents stylized customer progression across consumer and merchant products based on disclosed user
      workflows.
