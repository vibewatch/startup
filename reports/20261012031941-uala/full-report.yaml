            title: High credit card delinquency and Stage 3 provisioning in Mexico
            body: >-
              Regulatory disclosures from Ualá México show Stage 3 non-performing loans reaching 20% of the loan
              portfolio in Q1 2025, with short-term payment defaults exceeding 99.5% in Stage 3. This indicates severe
              underwriting headwinds as Ualá scales revolving credit to thin-file customer cohorts.
            calloutType: risk
