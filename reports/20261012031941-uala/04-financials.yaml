callouts:
  - calloutType: "insight"
    title: "Capital Support vs. Regional Subsidiary Drag"
    claimRefs:
      - "CI001"
      - "CI008"
      - "CI013"
    body: "While Ualá's $3.2B valuation and $215M in 2026 equity injections demonstrate exceptional sponsor access, Mexican banking subsidiary losses of MXN 282M in Q1 2025 prove that regional scale requires ongoing capital subsidies."
  - calloutType: "risk"
    title: "Credit Provision Acceleration in Lending Verticals"
    claimRefs:
      - "CI009"
      - "CI011"
    body: "A 91% year-over-year increase in credit risk provisions in Mexico highlights that expanding into revolving credit products creates substantial impairment volatility that erodes net interest margins."
  - calloutType: "recommendation"
    title: "Underwriting Requirement for Private Metric Disclosure"
    claimRefs:
      - "CI006"
      - "CI012"
    body: "Institutional investors must require audited disclosure of consolidated group burn rates, active funded account ratios, and unit cohort economics before validating enterprise valuation assumptions."
