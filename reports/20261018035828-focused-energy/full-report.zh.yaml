      - number: '3.2'
        title: 差异化与买方权衡
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 的差异化是真实存在的，但目前主要落在架构，而非商业模式。公司 2023 年论文称选择了直接驱动质子快点火，并认为直接驱动的效率约为间接驱动的五倍；2026
              年独立报道也将同样的分段压缩和点火束设计视为公司的核心技术特征。这让 Focused 的技术叙事自洽，但同一独立简介也指出，商业激光聚变电站仍需要 10 Hz
              重复频率、量产靶丸以及显著更高的墙插效率。因此，产品本身虽有差异，买方和投资者仍须根据里程碑质量、子系统瓶颈和伙伴资源，而非实时性能、交付经济性或合同转化数据，来评判各工程项目。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.3'
        title: 工业化、信任与分发能力
        blocks:
          - type: paragraph
            body: >-
              本章最有证据支持的护城河不是公开功能领先，而是伙伴组合。RWE 表示追加投资 60 million euros，提供退役核电站基础设施和监管专业能力；若激光聚变中心招标推进，RWE 愿加快 Biblis
              改造。Focused Energy 2026 年新闻页面还披露赢得国家级 Biblis 中心资格，并与 University of Rochester 的 Laboratory for Laser
              Energetics 开展 $6.9 million 合作，进一步坐实了以基础设施、公共政策协同和专业研究资源为核心的模式。General Fusion 和 Inertia
              走的是不同但同样可信的信任路径：General Fusion 依靠 LM26 里程碑披露和与 General Atomics 的合作，Inertia 依靠 LLNL
              设计代码和靶丸制造关系。实际上，切换成本和锁定更可能先来自场址、供应链、诊断设备及实验室关系，而非软件式产品黏性。
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: 透明度限制与护城河风险
        blocks:
          - type: paragraph
            body: >-
              指定来源中最弱的竞争信号是商业透明度。Focused Energy、General Fusion 或 Inertia
              的保留来源均未披露电站定价、购电条款、客户合同或实际单位经济性，因此当前比较必然围绕路线图可信度，而不是买方转化或利润结构。独立报道明确警告，该行业许多目标仍是尚未在任何聚变项目中商业验证的宏大目标；General
              Fusion 自己的公告也列出一长串执行、融资、监管、供应链和竞争风险。因此，Focused Energy 当前的优势应理解为：在尚未验证的品类中资金更多、选址更优，而不是已经跨过商品化或替代风险的确定护城河。
            claimRefs:
              - CP011
              - CP014
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 融资平台强劲，但公开收入证据仍处于商业化前阶段
        blocks:
          - type: paragraph
            body: >-
              本次更新中最清晰的财务事实是 2026 年 5 月的 A 轮融资：Focused Energy 及多篇外部报道均指向由 RWE 领投的 $240 million 融资，SPRIND、European
              Innovation Council Fund 和 Prime Movers Lab 也参与其中。公开来源进一步将这笔资本与 Biblis
              及公用事业支持的选址策略联系起来，而非已披露的客户合同、出货或经常性收入。即便是更详尽的独立报道，也将故事框定为电站开发、示范基础设施和工业政策支持。


              这一差别对投资判断很重要。公开记录支持这样的看法：Focused Energy
              的融资势头强于多数聚变同业，获取场址和协调监管的路径也优于平均水平。但它还不足以支持对实际定价、收入确认、毛利率或销售效率的判断，因为没有保留来源披露已签署的购电协议、客户集中度、已确认收入或单位层面经济性。本章应把公开资本视为商业化燃料，而不是变现质量的证明。
