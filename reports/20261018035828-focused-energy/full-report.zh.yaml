  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - A 轮条款克制，Biblis 枢纽地位加快执行，Rochester/DOE 工作转化为可量化的试验里程碑，早期买家从感兴趣走向签约。
        - 如果条款和里程碑降低了通往 2030 年代中期电站的路径风险，未来融资轮或战略交易可能获得显著更高的估值支持。
        - 技术规模化仍然失败，氚或成本假设失效，或即使获得更多资本，时间表仍然延误。
        - 需要公开条款，以及超越出资方热情的里程碑证据。
      - - 基准
        - 融资换来时间和生态可信度，但在下一轮尽调前，商业需求和电站经济性仍主要靠叙事支撑。
        - 最有依据的结果是持续观察，而不是立即作出投资判断；估值应锚定里程碑进展，而非静态可比公司。
        - 在深科技执行风险仍高的同时，资金续航、稀释和商业化证明仍不透明。
        - 最符合当前保留的证据。
      - - 悲观
        - 隐含估值已经计入了这些里程碑，而实际进展可能比当前公开材料所示更慢、更贵或更难融资。
        - 任何条款更弱的后续融资或证明点延迟，都会让高起点估值下的回报大幅收缩。
        - 优先权负担、技术延期或客户进展缺失，可能迫使公司以更低估值融资。
        - 由负面条款披露或技术 / 商业里程碑未达成触发。
    notes: 情景逻辑以里程碑为核心，因为公开证据没有提供收入、已签约订单或已披露的定价条款，无法进行传统倍数估值。
    claimRefs:
      - CV001
