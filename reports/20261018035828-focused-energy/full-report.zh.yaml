        title: 融资里程碑、政策势头与执行缺口
        blocks:
          - type: paragraph
            body: >-
              2026 年公开记录中最显著的跃升，是公司宣布获得 $240 million A
              轮融资，且公司和独立报道均予以佐证。独立报道还显示，计入拨款后，公司如今已跻身融资最充足的聚变初创公司之列，但这一规模不能等同于商业准备度。2026 年公司还取得了明显的生态进展，包括任命高级政策顾问，以及
