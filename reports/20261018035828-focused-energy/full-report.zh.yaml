              - CV001
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: 融资背景及其证明内容
        blocks:
          - type: paragraph
            body: >-
              这笔融资确实证明了几件事。第一，Focused Energy 为一家聚变初创公司聚集了异常可信的赞助方：公司在本轮点名 RWE、SPRIND、European Innovation Council Fund 和
              Prime Movers Lab，独立报道也确认了融资规模及其战略意义。第二，资金与具体工业化叙事相连，Biblis 是拟议电站场址，德国政府后来将 Biblis 选为国家激光聚变中心，又为该地点增加了政策支持。


              融资没有证明的内容同样重要。公司称投资者包括潜在聚变能源买方，以及愿意将建设融资支持到电站阶段的资本，但公开证据仍未显示已签署的购电、PPA
              或客户合同，也没有量化积压订单。换句话说，当前融资更能证明赞助方信心和生态定位，而不是终端客户的需求转化或价格支撑。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
      - number: '8.3'
        title: 情景投资判断与可比公司启示
        blocks:
          - type: paragraph
            body: >-
              情景框架应从技术商业化里程碑出发，而不是终局市场叙事。Focused Energy 自己 2023 年的技术论文仍将商业化设定为 2030
              年代中后期的聚变试点电站；公司营销则强调直接驱动激光聚变、氘氚燃料和可制造组件。这些是可信故事的必要元素，但不等于电站经济性或运营证明。ANS 报道的 Rochester 合作及其中引用的 DOE
              里程碑，显示建模、离子束聚焦和激光等离子体不稳定性工作持续推进，支持这是一个真实技术项目，而非纯宣传叙事。


              下行情景同样具体。独立批判性报道称，商业电站需要全天候每秒进行十次激光诱导聚变，并指出即使乐观的公司员工也承认距离该阈值仍很远。同一来源还强调氚和成本方面尚未解决的疑虑。因此，估值可比更像一项按里程碑计风险的深科技期权，而不是收入倍数练习：从子系统进展到可靠试点电站经济性的每一步，仍是价值驱动因素。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 尽调问题与论点失效条件
        blocks:
          - type: paragraph
            body: >-
              关键尽调问题直接且高度影响决策：取得 A 轮投后估值和证券条款；核对 Biblis
              的现金跑道和分阶段资本开支；确认是否有客户、公用事业、工业买方或主权利益相关方签署具有约束力的商业承诺；并检验重复频率、靶丸制造成本、氚处理和电站经济性是否已从路线图语言推进到可独立审阅的数据。没有这些材料，当前融资信号只能支持跟踪，不能支持激进入场。


              出现以下三种情况之一，投资论点就会失效：资本结构被证明比外部投资者预期的稀释性更强或优先权更重；公司无法把赞助方热情转化为商业需求或场址许可进展；或者技术路线图不断延期，却没有证据表明重复频率、靶丸设计和电站经济性正在收敛到可建设的试点电站。反过来，已披露条款加上基于里程碑的技术证明，可能比泛泛的行业热情更快提升判断。
            claimRefs:
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 当前可支持的判断
            body: 在公开材料显示更好的定价透明度或明显更强的技术与客户证明之前，“继续研究”是可辩护的判断。
            calloutType: recommendation
            claimRefs:
              - CV013
              - CV014
              - CV015
          - type: callout
            title: 估值争论为何仍未定论
            body: 独立报道提出了真实的重复频率、燃料循环和成本疑虑，而公开来源可获得的轮次文件遗漏了定价条款，外部投资者无法据此评估稀释和下行风险。
            calloutType: risk
            claimRefs:
              - CV002
              - CV010
              - CV011
              - CV013
