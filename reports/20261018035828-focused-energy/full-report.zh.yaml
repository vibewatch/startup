  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              本地来源支持一个宽泛的竞争框架，而非狭窄的一对一比较。Focused Energy 被定位为采用直接驱动质子快点火的激光惯性约束聚变公司；Fusion Energy News
              则将其放在更广的领域中，既包括直接竞争者和相邻的惯性聚变初创公司，也包括磁化靶聚变等替代技术路线。同一简介还将 First Light、EX-Fusion 及无中子 p-11B
              阵营列为相关替代者。因此，竞争问题不只是“还有谁在建激光电站”，也是“哪种架构能先做出商业上可信的硬件”。Focused Energy
              自己的框架进一步扩大了替代集合：在任何聚变开发商达到可融资的部署条件前，太阳能、风能、天然气、传统核能和电池仍是清洁稳定电力买方真正的现状选项。
            claimRefs:
              - CP001
              - CP006
              - CP008
              - CP016
