        - 要强化判断，需要公开条款、分阶段资本开支，以及战略资本确实转化为可执行电站里程碑的证明。
      - - 反方论点
        - 公开证据仍缺少客户合同、定价轮次细节，以及电站层面的重复频率和经济性证明。
        - 如果公司披露具有约束力的需求信号，以及可由独立方审阅的技术和经济性里程碑，反方论点就会减弱。
      - - 入场纪律
        - 当前格局更像一个押注里程碑、风险仍高的深科技期权，而不是已经降风险的基础设施或收入资产。
        - 如果新的融资条款或里程碑披露能降低稀释风险、缩小与试验电站可行性之间的差距，入场纪律会有所改善。
