chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、布局与已披露规模
        blocks:
          - type: paragraph
            body: >-
              现有来源一致认为，Focused Energy 是一家 2021 年成立的聚变初创公司，采用直接驱动激光聚变，并在德国和美国开展运营。官方材料称，公司脱胎于 Technical University
              Darmstadt 与 National Energetics；2026 年 5 月的融资公告将总部设在 Darmstadt，并列出 Berlin、Austin 和 San Francisco
              办公室。当前官网将公司定位为商业化 NIF 后点火路线，并宣称团队拥有 160+ 名工程师、科学家和运营人员。不过，公开规模信息并不一致：一份旧版公司简介仍称公司通过私人资本和拨款筹得超过 $175
              million，而 2026 年较新的融资报道聚焦于更大规模的 A 轮及后续总融资估算。同一旧页面提到分拆产品线已有早期收入，但指定的公开证据没有披露收入金额、客户数量或合同细节。
