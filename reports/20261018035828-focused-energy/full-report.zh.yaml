      - number: '4.2'
        title: 公开单位经济性主要是工程阈值，而非运营指标
        blocks:
          - type: paragraph
            body: >-
              现有单位经济性证据主要来自 Focused Energy 自己的技术路线图，而非客户或电站性能数据。路线图明确写出商业门槛：名义 1 GW 惯性聚变电站需要 2.5-3 GW 聚变输出、约 100x 增益、10
              Hz 下约 2.5 MJ 的脉冲，以及每天制造约 900,000 个靶丸。这些不是锦上添花的优化，而是成功物理实验与可投资能源资产之间的核心经济桥梁。


              因此，公开成本结构最有用的洞见是方向性的。直接驱动被定位为明显高效于间接驱动黑腔，公司也在与 RWE 合作推进
              Biblis，试图降低选址和基础设施支出。但同一证据基础也显示，规模化问题距离解决仍很远：Super-Nova 仍是 2030 年代初、每三分钟发射一次的点火设施，而商业运行意味着每秒发射 10
              次，并需要极高的激光和靶丸制造吞吐量。投资者看得到工程瓶颈，却仍看不到公开回本模型。
