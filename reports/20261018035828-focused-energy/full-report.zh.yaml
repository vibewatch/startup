              Focused Energy 当前官网材料明确列出了管理层，由联合创始人 Thomas Forner 和 Markus Roth 带队，运营团队还包括 Omar Biabani、Debbie
              Callahan、Chris Wendel 和 Decker
              Gentili。正式治理结构则隐蔽得多：指定的官方及独立概览来源提到了高管、创始人和融资伙伴，却没有披露董事会构成、独立董事、委员会架构或控制条款。投资者和利益相关方图谱比治理图谱清晰。RWE
