  - id: FE001
    title: 公开披露的产品到电站架构
    type: stack
    summary: Focused Energy 披露的技术栈从 Pearl 靶丸和快点火激光器出发，经合作伙伴验证，最终进入 Biblis 电站项目。
    data:
      layers:
        - label: 电站商业化
          detail: 公司描述的公开结果，也是这套技术栈的终点状态。
          outputs:
            - Biblis 首座商业激光聚变电站
            - 2030 年代中期部署目标
        - label: 场址与监管支撑
          detail: 2026 年披露将电站项目与实际场址及具名监管支持联系起来。
          modules:
            - Biblis 场址进入权限
            - RWE 监管专业能力
            - 国家激光聚变枢纽认定
        - label: 试验电站工程
          detail: 电站工程工作位于实验项目与任何商业反应堆之间。
          modules:
            - 试验电站建模
            - 氚增殖反应堆容器设计
            - 10 Hz 电站运行假设
        - label: 靶丸与燃料系统
          detail: Pearl 靶丸是燃料路径中会被消耗的核心。
          modules:
            - 氘氚 Pearl 胶囊
            - 自有靶丸实验室能力
            - 混合冲击靶丸测试
        - label: 激光架构
          detail: 该设计将压缩与点火分开，而不是依赖单一热斑路径。
          modules:
            - 直接驱动压缩光束
            - 质子快点火热斑光束
            - 3 kJ、>10% 墙插效率演示器路线图
        - label: 实验验证闭环
          detail: 合作实验旨在电站部署前降低规模化的主要未知因素。
          modules:
            - FLUX 激光实验
            - Omega 级规模化工作
            - CBET / SRS / 双等离子体衰变缓解
    claimRefs:
      - CE001
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE010
      - CE012
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开旅程从科学可信度走向战略生态支持，但尚未触及有明确名称的商业需求。
    data:
      items:
        - label: 科学证明基础
          actor: Focused Energy 创始人 / 技术团队
          phase: 技术基础
          touchpoints:
            - 2023 年论文勾勒出通往 2030 年代中后期试验电站的路线图。
            - 官方产品页将产品定位在未来清洁电力商业化上。
        - label: 超额认购的 A 轮
          actor: 投资者与潜在未来买家
          phase: 资本与信号
          touchpoints:
            - 官方和 SPRIND 来源称，本轮包括潜在的聚变能源买家。
            - 由于买家未具名、也未与合同挂钩，需求信号是间接的。
        - label: RWE 场址与监管锚点
          actor: RWE
          phase: 工业化布局
          touchpoints:
            - RWE 是战略投资者和工业伙伴。
            - 公开证据聚焦场址进入权限和监管专业能力，而非能源采购。
        - label: 公共部门支持
          actor: SPRIND 和其他公共支持方
          phase: 政策支持
          touchpoints:
            - 支持方增强了政治和融资韧性。
            - 出资方支持不能证明经常性客户需求。
        - label: LLE 研究合作
          actor: University of Rochester 激光能量学实验室（LLE）
          phase: 技术验证
          touchpoints:
            - 2026 年 3 月宣布了一项 $6.9M 的产业赞助研究合作。
            - 这是科学参与的外部证明，而不是客户部署。
        - label: 商业化证明缺口
          actor: 未来公用事业 / 承购方
          phase: 尚未解决的转化
          touchpoints:
            - 没有保留的来源披露客户数量、承购条款、留存或集中度。
            - 商业可信度仍取决于具名合同和使用率证据。
