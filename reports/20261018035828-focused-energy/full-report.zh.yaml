  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与部署框架
        blocks:
          - type: paragraph
            body: >-
              保留的来源将 Focused Energy
              定位在电网级聚变发电市场，而不是笼统的“清洁技术”类别。公司产品页强调商业电站架构、氘氚燃料、可制造性、模块化和电站级可靠性；技术论文及独立报道则将其描述为一条直接驱动惯性约束路线，目标是在 2030
              年代中后期建成试点电站。这个框架将可服务市场收窄到激光聚变电站及其靶丸、激光和供应链配套的公用事业与基础设施部署，同时排除无关的电力零售、泛脱碳软件或不加区分的“能源未来”TAM 说法。
            claimRefs:
