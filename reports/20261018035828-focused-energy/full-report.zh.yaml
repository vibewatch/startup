            body: >-
              近期最强的买方和付款方信号来自战略合作，而非交易本身。RWE 同时是投资者和工业/场址伙伴；SPRIND、European Innovation Council Fund
              等政府关联机构出现在融资阵容中；Focused Energy
              还称本轮融资包含未来可能购买聚变能源的买方。这指向一条采用路径：在广泛的现货电力市场形成前，公用事业、公共创新机构和工业生态建设者先评估早期部署。相同证据也说明市场仍需谨慎看待：直接驱动可能比间接驱动更高效，但商业系统仍须证明靶丸可制造、重复频率、可靠性及电站级效率，不能只看实验室净能量新闻。部署时间本身也未定：公司证据指向
              2030 年代中后期，而一份独立简介对原型运行采用了更早的“2030 年代初”说法。
