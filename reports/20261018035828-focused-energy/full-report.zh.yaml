            body: >-
              当前最大的开放风险仍是电站规模执行风险。Focused Energy 自己的 2023 年论文称，商业惯性聚变需要 10 Hz 下每脉冲约 2.5 MJ、墙插效率超过 10% 的 3 kJ
              二极管泵浦演示器、每天制造 900,000 个靶丸，以及兼容氚增殖并能持续 10 Hz 运行的反应堆容器。这些不是表面优化任务，而是项目能否推进的关键工作流。


              Fusion Energy News
              的独立综合从外部指出了同类瓶颈：皮秒级点火器能量、质子束聚焦、驱动器效率、靶丸吞吐量和重复频率扩展。关于电站安全论证细节、QA/QC、网络安全和组件级可靠性的公开证据也仍然稀薄。因此，产品故事虽有一致的架构和伙伴图谱，大部分风险仍集中在集成、规模化和电站运行证明，而非面向市场的功能广度。
