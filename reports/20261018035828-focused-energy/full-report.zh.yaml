      - number: '4.3'
        title: 下一阶段资本充足性尚属合理，但项目规模仍无法纳入投资判断
        blocks:
          - type: paragraph
            body: >-
              根据这里保留的证据，Focused Energy
              的资本状况看起来优于多数商业化前聚变公司；公用事业、公共部门和风险投资方的组合，在战略上也强于纯风险投资轮。不过，公开融资总额不能等同于现金充足。来源没有披露烧钱速度、可自由支配现金、项目层面资本开支、提款计划、拨款限制、债务需求或未来售电的商业条款。


              因此，财务上的负面解读针对的是依赖，而非资不抵债。独立报道将 Biblis
              许可、后续共同融资，以及从已展示物理成果到电站运营的漫长跨越，列为决定当前融资能否支撑公司走得足够远的主要因素。财务结论是：Focused Energy
              进入下一技术阶段的势头可信，但本章仍缺少建模收入质量、利润率路径或项目融资准备度所需的核心披露。
