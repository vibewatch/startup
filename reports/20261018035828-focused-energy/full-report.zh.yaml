          note: 独立报道将其描述为围绕 Focused Energy 的综合支持体系。
          tone: opportunity
        - label: 最新融资信号
          value: $240m Series A
          valueNote: 官方公告称其为全球聚变领域规模最大且已完全落实的 A 轮融资。
          note: 这显示投资者对该品类兴趣浓厚，但不等于收入需求。
          tone: opportunity
        - label: 政策与场址锚点
          value: Biblis selected as Germany's laser fusion hub
          valueNote: 2026 年 7 月 Focused Releases 条目，与 Fusion 2040 相关。
          note: 公共部门协同是商业化路径的一部分。
          tone: neutral
        - label: 初始部署地点
          value: 1 named demo-site pathway with RWE
          valueNote: 当前商业化路径收窄至一座由公用事业支持的首座电站。
          note: 具体选址比宽泛的 TAM 幻灯片更有说服力，但仍只有一个地点。
          tone: neutral
        - label: 商业运营目标
          value: 10 shots/sec
          valueNote: TechCrunch 和 The Next Web 引述的发射频率目标。
          note: 重复频率是任何实用电站都必须面对的硬性采用约束。
          tone: risk
        - label: 当前证明基线
          value: ~400 NIF shots/year
          valueNote: 独立报道用来对比当前实验室节奏的基准。
          note: 商业吞吐量差距仍是不能夸大市场准备度的最直接原因。
          tone: risk
    approximationNotes: 混合单位是有意为之：金字塔展示的是逐步收窄的商业化视角，不是单一数量级，也不是数学推导出的 TAM/SAM/SOM 体系。
    claimRefs:
