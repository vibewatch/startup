  - id: FI001
    title: 有公开证据支持的商业化桥梁
    type: flow
    summary: 保留的证据支持一条从资本到示范再到电站的路线图，但不支持当前经常性收入或电站层面的定价判断。
    data:
      nodes:
        - id: capital
          label: 已募集资本
          detail: 已披露 $240m A 轮融资；TNW 报道称私募资本为 $300m，补助约 $200m。
          note: 融资基础庞大，但不是客户收入。
          claimRefs:
            - CI001
            - CI004
        - id: site
          label: 场址与公用事业伙伴
          detail: RWE 提供 Biblis 进入权限以及监管 / 电站专业能力；德国选定 Biblis 作为国家激光聚变枢纽。
          note: 场址支持降低了基础设施摩擦，但更多是降低摩擦，而非证明需求。
          claimRefs:
            - CI002
            - CI003
            - CI016
        - id: derisk
          label: 降风险设施
          detail: T-STAR、LLE 合作和 Super-Nova 是试验电站之前公开的关键台阶。
          note: 当前证据仍处于开发阶段，而非运营阶段。
          claimRefs:
            - CI009
            - CI015
        - id: throughput
          label: 吞吐经济性
          detail: 商业化需要约 100x 增益、10 Hz 下约 2.5 MJ 脉冲，以及每天 900,000 个靶丸。
          note: 这些是路线图假设，不是已验证的电站经济性。
          claimRefs:
            - CI008
            - CI010
            - CI011
        - id: pilot
          label: 试验电站里程碑
          detail: Focused Energy 的路线图仍指向 2030 年代的聚变试验电站。
          note: 许可和后续融资仍是闸门风险。
          claimRefs:
            - CI006
            - CI012
        - id: revenue
          label: 未来电力收入
          detail: 公开材料暗示将通过上网电力变现，但没有披露 PPA、电价或客户经济性。
          note: 收入质量在公开证据中仍未验证。
          claimRefs:
            - CI013
            - CI014
      edges:
        - from: capital
          to: site
          label: 资金和交易对手夯实商业化平台。
          claimRefs:
            - CI001
            - CI002
            - CI003
        - from: site
          to: derisk
          label: 基础设施与合作伙伴支持开发设施。
          claimRefs:
            - CI003
            - CI015
            - CI016
        - from: derisk
          to: throughput
          label: 技术降风险必须转化为可重复的经济性。
          claimRefs:
            - CI009
            - CI010
            - CI011
        - from: throughput
          to: pilot
          label: 达到频率和成本门槛后，才能部署电站。
          claimRefs:
            - CI008
            - CI010
            - CI012
        - from: pilot
          to: revenue
          label: 电站运营将是客户收入的首条可见路径。
          claimRefs:
            - CI006
            - CI013
            - CI014
    approximationNotes: 这条流程将已披露的当前资本与路线图里程碑混在一起；它不是预测、累计融资桥梁或收入计划。
