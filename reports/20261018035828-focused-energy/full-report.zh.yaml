  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 公司实际在建设什么
        blocks:
          - type: paragraph
            body: >-
              Focused Energy 的公开材料并未把公司定位成近期反应堆设备销售商，而更像是一个全栈激光聚变项目。已披露的产品组合包括直接驱动质子快点火架构、LightHouse 电站概念、Pearl
              氘氚燃料靶丸，以及以 Biblis 为中心的试点电站路线图。这一定位很重要，因为公司当前的成熟度体现在设计、靶丸开发和电站规划上，而不是已商业部署的发电资产。


              产品叙事也强调可制造性，而不只是物理学野心。公司页面称 LightHouse 的设计目标是模块化、可制造性和电站级可靠性；ESG Today 也重复了相同设计语言，并描述了专有的量产 Pearl
              燃料胶囊。这些主张有助于解释目标买方价值主张——利用退役热电站场址实现可调度清洁电力——但还不能替代实际子系统的公开吞吐量、成本或已证明可运行数据。
