        blocks:
          - type: paragraph
            body: >-
              现有证据不足以支持可信的 TAM/SAM/SOM 层层推导，但可以支持几种对尽调有用的更窄视角。第一，独立报道所称的 $240 million A 轮，以及约 $500 million
              的累计私人资本加拨款，说明该品类确实能吸引资本。第二，商业化目前已收窄到与 RWE 合作、位于 Biblis 的明确首个部署地点，这比全球聚变 TAM 幻灯片具体得多。第三，最关键的运营视角是当今
              National Ignition Facility 的发射节奏与 Focused Energy 所称商业电站所需发射率之间的规模差距。公司技术论文还提供了名义 1 GW 参考周期模型，但那是工程要求，不是
              Biblis 预测或市场规模估算。这些可作为需求和执行代理指标，却都不能替代已披露的定价、项目级产出或签约买方量。
