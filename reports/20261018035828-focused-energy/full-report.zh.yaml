            body: >-
              2026 年最清晰的进展不是公开的全系统演示，而是把工程路径从实验收紧到电站开发。Focused Energy 2026 年 5 月和 7 月的更新，将 Biblis 场址、RWE
              的监管与工业角色，以及德国国家激光聚变中心资格，串成首座商业电站的具体选址叙事。这让公司的部署支架明显强于许多只做物理研究的聚变项目，尽管许可路径和建设经济性仍未披露。


              University of Rochester/LLE 合作是进入电站故事的技术桥梁。该伙伴项目明确聚焦激光等离子体不稳定性、FLUX 实验，以及将 Omega
              级工作扩大到试点电站条件，同时测试混合冲击靶丸。换句话说，Focused Energy 公开承认，只有把实验室靶丸物理连接到可重复的电站工程，而不是再取得一个研究里程碑，该架构才具备可投资性。
