company:
  name: Focused Energy
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Focused Energy is publicly describing an integrated laser-fusion development stack rather than a
    market-ready reactor module: direct-drive proton fast ignition, Pearl deuterium-tritium targets,
    partner-led instability experiments, and a Biblis pilot-plant program. The strongest 2026 evidence
    is around siting and validation partnerships; the main diligence gap is still missing public proof
    on repetition rate, target economics, plant efficiency, and detailed safety or quality systems.
sections:
  - id: product-definition
    title: What the company is actually building
    body: |-
      Focused Energy's public materials position the company less as a seller of a near-term reactor box
      and more as a full-stack laser-fusion program. The disclosed product surface combines a
      direct-drive proton fast-ignition architecture, the LightHouse plant concept, Pearl
      deuterium-tritium fuel targets, and a pilot-plant roadmap centered on Biblis. That framing
      matters because it puts current maturity in design, target development, and plant planning rather
      than in a commercially deployed generation asset.

      The product claims also stress manufacturability rather than only physics ambition. Company pages
      say LightHouse is designed for modularity, manufacturability, and power-plant-grade reliability,
      while ESG Today repeats the same design language and describes proprietary mass-produced Pearl fuel
      capsules. Those claims help explain the intended buyer value proposition — a path to dispatchable
      clean power from a retired thermal site footprint — but they do not yet substitute for public
      throughput, cost, or demonstrated-operability data on the actual subsystems.
    claimRefs: [CE001, CE002, CE003, CE016]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: validation-and-deployment-path
    title: How the architecture is supposed to scale into a plant
    body: |-
      The clearest 2026 progress is not a public full-system demo; it is the tightening of the
      engineering path from experiments into plant development. Focused Energy's May and July 2026
      updates tie the Biblis site, RWE's regulatory and industrial role, and Germany's national Laser
      Fusion Hub designation into a concrete siting narrative for the first commercial plant. That gives
      the company a visibly stronger deployment scaffold than many physics-only fusion programs, even if
      the permitting path and construction economics remain undisclosed.

      The technical bridge into that plant story is the University of Rochester/LLE collaboration. The
      partner program is explicitly aimed at laser-plasma instabilities, FLUX-enabled experiments, and
      scaling Omega-class work into pilot-plant conditions while testing hybrid-shock targets. In other
      words, Focused Energy is publicly acknowledging that the architecture only becomes investable if it
      can connect laboratory target physics to repeatable plant engineering, not just to another research
      milestone.
    claimRefs: [CE004, CE005, CE006, CE007, CE008, CE014]
    tableRefs: [TE002, TE003]
  - id: maturity-dependencies-and-control-gaps
    title: Maturity, external dependencies, and technical-control gaps
    body: |-
      The strongest open risks are still plant-scale execution risks. Focused Energy's own 2023 paper
      describes commercial inertial fusion as needing roughly 2.5 MJ per pulse at 10 Hz, a 3 kJ
      diode-pumped demonstrator with more than 10% wall-plug efficiency, target manufacturing at
      900,000 units per day, and a reactor vessel compatible with tritium breeding and sustained 10 Hz
      operation. Those are not cosmetic optimization tasks; they are the program's gating workstreams.

      Independent synthesis from Fusion Energy News points to the same bottleneck class from the outside:
      picosecond ignitor energy, proton-beam focusing, driver efficiency, target throughput, and
      repetition-rate scaling. Public evidence also remains thin on plant safety case detail, QA/QC,
      cybersecurity, and component-level reliability disclosure. The result is a product story with a
      coherent architecture and partner map, but with most of the risk still concentrated in integration,
      scale-up, and plant-operating proof rather than in market-facing feature breadth.
    claimRefs: [CE009, CE010, CE011, CE012, CE013]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Public status / maturity
      - Differentiation / role
      - Diligence gap
    rows:
      - - LightHouse architecture
        - Prospective plant owner / operator
        - Concept publicly described; no public integrated operating proof
        - Company says the architecture prioritizes modularity, manufacturability, and serviceability
        - No public subsystem performance, uptime, or delivered-cost data
      - - Pearl fuel targets
        - Internal reactor design team; future plant operations
        - Fuel concept publicly described; production economics undisclosed
        - Proprietary deuterium-tritium capsules tied to one of the world's few target labs
        - No public target yield distribution, scrap rate, or unit-cost curve
      - - Biblis pilot-plant program
        - Utility / grid stakeholders and regulators
        - Site and hub designation announced; still pre-commercial
        - Combines former RWE infrastructure, siting, and regulatory support around the first plant goal
        - No public permitting path, construction budget, or commissioning schedule detail
      - - LLE validation loop
        - Physics and engineering team
        - Active multiyear research collaboration
        - Uses FLUX experiments and modeling to attack laser-plasma-instability and target-configuration issues
        - No public results yet from scaling tests or hybrid-shock campaigns
    notes: >-
      Rows mix official company materials with partner and independent reporting; the diligence-gap
      column marks missing operating proof or economics, not a negative finding.
    claimRefs: [CE002, CE003, CE004, CE006, CE007, CE008, CE016]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow / bottleneck
      - Focused Energy solution path
      - Evidence-backed benefit / proxy
      - Limitation
    rows:
      - - Deliver firm clean power from a retired thermal site
        - Utilities and policymakers still lack a commercial laser-fusion plant reference
        - Focused Energy ties plant development to the Biblis site and RWE's industrial role
        - Publicly disclosed site access and regulatory support create a concrete siting path
        - No public offtake, plant LCOE, or commissioning milestones
      - - Suppress laser-plasma-instability losses before they break ignition economics
        - ICF programs lose energy to CBET, SRS, and two-plasmon decay
        - LLE collaboration couples FLUX experiments and modeling to Focused Energy's target designs
        - A $6.9 million sponsored program is aimed at practical laser and target guidance
        - No public readout on achieved instability suppression or transferability to plant shots
      - - Manufacture and deliver fusion targets at plant scale
        - Research-grade targets are not yet proven as industrial consumables
        - Pearl target work plus an in-house target-lab capability are supposed to make the consumable path manufacturable
        - Company materials explicitly frame mass production and shippability as part of the design
        - No public target throughput, defect-rate, or cost evidence
      - - Move from lab architecture to commercial plant engineering
        - Scientific gain does not by itself prove plant viability
        - Focused Energy links its architecture to pilot-plant engineering, reactor-vessel work, and repetition-rate assumptions
        - Public roadmap names 10 Hz operation and supporting R&D workstreams
        - No public integrated repetition-rate, plant-efficiency, or reliability demonstration
    notes: >-
      Because the assigned pool does not disclose live customer deployments, these rows describe the
      intended user workflow implied by the public program and where the evidence still stops.
    claimRefs: [CE004, CE005, CE007, CE008, CE009, CE010, CE011, CE016]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - - Compression laser system
        - Compress the target before ignition
        - Direct-drive architecture and future high-repetition laser development
        - Driver efficiency and repetition rate remain unproven at plant scale
      - - Picosecond ignitor / proton beam
        - Create the ignition hot spot after compression
        - Precise proton-beam generation and focusing
        - Independent profiling flags kJ-class ignitor energy and mm-scale focusing as bottlenecks
      - - Pearl target and fuel layer
        - Provide the consumable fusion target
        - Proprietary deuterium-tritium capsules and target-design capability
        - Target cost, yield consistency, and factory throughput are undisclosed
      - - Reactor vessel and fuel-cycle engineering
        - Turn shots into a repeatable plant operating system
        - Tritium breeding, 10 Hz vessel compatibility, and pilot-plant engineering
        - Public sources do not show a plant safety case, detailed QA/QC, or efficiency assumptions
      - - External experimental validation loop
        - Translate laboratory results into plant-relevant design choices
        - LLE's FLUX system, Omega-class scaling work, and joint modeling
        - No public evidence yet that these results have closed the scale-up gap
    notes: >-
      This table separates the architecture into dependency layers so technical bottlenecks and control
      gaps stay visible instead of being collapsed into a single "fusion platform" claim.
    claimRefs: [CE001, CE003, CE007, CE008, CE009, CE010, CE011, CE012, CE013]
figures:
  - id: FE001
    title: Publicly disclosed product-to-plant architecture
    type: stack
    summary: >-
      Focused Energy's disclosed stack runs from Pearl targets and fast-ignition lasers through partner
      validation into the Biblis plant program.
    data:
      layers:
        - label: Plant commercialization
          detail: Public outcome the company describes as the end state of the stack.
          outputs:
            - First commercial laser fusion power plant in Biblis
            - Mid-2030s deployment target
        - label: Site and regulatory scaffolding
          detail: 2026 disclosures tie the plant program to an actual site and named regulatory support.
          modules:
            - Biblis site access
            - RWE regulatory expertise
            - National Laser Fusion Hub designation
        - label: Pilot-plant engineering
          detail: Plant engineering work sits between the experimental program and any commercial reactor.
          modules:
            - Pilot-plant modeling
            - Tritium-breeding reactor-vessel design
            - 10 Hz plant-operation assumption
        - label: Target and fuel system
          detail: Pearl targets are the consumable core of the fuel path.
          modules:
            - Deuterium-tritium Pearl capsules
            - In-house target-lab capability
            - Hybrid-shock target testing
        - label: Laser architecture
          detail: The design splits compression from ignition rather than relying on a single hot-spot path.
          modules:
            - Direct-drive compression beam
            - Proton fast-ignition hot-spot beam
            - 3 kJ, >10% wall-plug-efficiency demonstrator roadmap
        - label: Experimental validation loop
          detail: Partnered experiments are meant to reduce the main scale-up unknowns before plant deployment.
          modules:
            - FLUX laser experiments
            - Omega-class scaling work
            - CBET / SRS / two-plasmon-decay mitigation
    claimRefs: [CE001, CE004, CE005, CE006, CE007, CE008, CE010, CE012, CE016]
