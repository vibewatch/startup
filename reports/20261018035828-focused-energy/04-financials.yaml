  evidenceGaps:
    - type: missing-source
      severity: material
      topic: pricing-disclosure
      missingEvidence: Public pricing architecture, offtake terms, tariff assumptions, and any customer contract or LOI for future power sales.
      whyItMatters: Pricing and customer commitments are necessary to judge revenue quality and commercialization timing.
      diligencePath: Request the commercial model, target customer segments, draft PPA terms, and any signed or pending customer documents.
      relatedQuestionRefs: [QI003, QI005]
    - type: private-evidence-only
      severity: material
      topic: burn-and-runway
      missingEvidence: Current cash balance, unrestricted cash, monthly burn, runway, and budgeted use of proceeds for Biblis and technical programs.
      whyItMatters: Reported funds raised do not show whether the current balance sheet can finance the next technical and permitting phase.
      diligencePath: Request a board-approved operating plan with monthly cash burn, runway scenarios, and milestone-linked financing needs.
      relatedQuestionRefs: [QI006]
    - type: private-evidence-only
      severity: material
      topic: plant-economics
      missingEvidence: Plant-level capex, opex, target-manufacturing unit cost, maintenance assumptions, and modeled levelized cost of electricity.
      whyItMatters: Without cost-stack detail, public technical thresholds cannot be translated into gross margin or project-finance feasibility.
      diligencePath: Request the integrated plant model, BOM assumptions, target-cost curve, and sensitivity analysis for cadence and gain.
      relatedQuestionRefs: [QI004, QI007]
    - type: private-evidence-only
      severity: material
      topic: financing-terms
      missingEvidence: Post-money valuation, liquidation preferences, grant restrictions, debt requirements, and any project-finance structure for Biblis.
      whyItMatters: Capital raised is not equivalent to cash available on attractive terms, especially for a capital-intensive first plant.
      diligencePath: Request the cap table, term sheets, grant covenants, and planned equity versus non-dilutive versus project-finance mix.
      relatedQuestionRefs: [QI001, QI006, QI008]
