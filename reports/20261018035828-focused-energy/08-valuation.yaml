    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - ["Thesis", "The $240 million Series A plus RWE/Biblis alignment indicates unusually strong sponsor support for a fusion company still pre-commercial.", "A stronger view would require disclosed terms, staged capex, and proof that strategic capital is converting into executable plant milestones."]
      - ["Anti-thesis", "Public evidence still lacks customer contracts, priced round details, and plant-level proof on repetition rate and economics.", "The anti-thesis weakens if the company discloses binding demand signals and independently reviewable technical/economic milestones."]
      - ["Entry discipline", "The current setup resembles a milestone-risked deep-tech option rather than a de-risked infrastructure or revenue asset.", "Entry discipline improves if new financing terms or milestone readouts reduce dilution risk and narrow the gap to pilot-plant feasibility."]
