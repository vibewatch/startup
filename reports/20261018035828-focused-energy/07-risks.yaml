callouts:
  - calloutType: risk
    title: Kill criteria before underwriting a plant build
    body: >-
      Move to "do not underwrite" if Focused cannot show an official permitting
      sequence for Biblis, credible TRL-6-scale subsystem proof by around 2030,
      and a manufacturable hardware plan for lasers, targets, and maintenance.
      At that point the debate is no longer about timing slippage; it is about
      whether the current commercialization path is structurally mis-scoped.
    claimRefs:
      - CR005
      - CR010
      - CR012
      - CR013
  - calloutType: insight
    title: Mitigations are meaningful but still upstream
    body: >-
      RWE, the Biblis hub designation, and the Rochester/LLE collaboration are
      genuine de-risking assets because they improve site access, policy
      alignment, and technical feedback loops. They still sit upstream of the
      evidence most investors ultimately need: repeatable subsystem performance,
      plant economics, and a public permitting and customer-commitment trail.
    claimRefs:
      - CR003
      - CR004
      - CR009
