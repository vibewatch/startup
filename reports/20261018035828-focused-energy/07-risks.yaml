    rows:
      - - 527 nm laser-plasma-instability and coupling limits persist at scale
        - >-
          Focused's technical paper says 527 nm is preferable for commercial
          optics durability, but also says the choice reduces absorption
          efficiency and lowers thresholds for several harmful LPI mechanisms.
        - High
        - High
        - Early
        - High
        - Need integrated 2x-compression, bandwidth, and uptime data beyond
          component-level experiments.
      - - Proton-beam conversion efficiency and ignition scaling miss plant targets
        - >-
          The baseline architecture still depends on roughly 20 kJ of proton
          energy and 10-15% conversion from a 150-200 kJ short-pulse laser, and
          the paper explicitly notes uncertainty in scaling.
        - High
        - High
        - Early
        - High
        - Need system-level beamline, overlap, and target-delivery results at
          relevant energies.
      - - Laser hardware manufacturability and uptime fail to reach plant economics
        - >-
          Independent reporting says a commercial plant would need around 1,000
          diode-pumped kilojoule-scale lasers operating at 10 Hz, while sector
          profiles still contrast that goal with much slower lab repetition
          rates.
        - High
        - High
        - Early
        - High
        - Need supplier commitments, MTBF targets, maintenance intervals, and
          capex-per-beam assumptions.
      - - Target fabrication, chamber wear, and tritium-cycle integration remain immature
        - >-
          Independent reporting points to very high target throughput, chamber
          durability constraints, remote maintenance needs, and complex
          tritium-bearing closed-fuel-cycle integration.
        - High
        - High
        - Early
        - High
        - Need target cost/yield data, wall-lifetime assumptions, and a
          detailed fuel-cycle operating model.
    notes: >-
      The register isolates technical and operating failure modes that still sit
