companyProfile:
  summary: >-
    Focused Energy is a German-American fusion startup founded in 2021 around direct-drive laser inertial-confinement
    fusion. The company has assembled a visibly senior technical and operating team, disclosed a $240 million Series A
    led by RWE in May 2026, and tied its near-term industrial plan to Biblis in Germany. The public record is strong on
    capital access, strategic partnerships, and technical ambition, but it still lacks disclosed valuation terms,
    customer contracts, and plant-level operating economics.
