evidenceGaps:
  - type: missing-source
    severity: material
    topic: valuation-and-control
    missingEvidence: >-
      Post-money valuation, ownership percentages, liquidation preferences, board seats, and protective rights from the
      2026 Series A.
    whyItMatters: >-
      Financing scale is visible, but price and control determine whether the round was accretive, dilutive, or
      governance-concentrating.
    diligencePath: Request the cap table, signed term sheet, and any investor-rights agreement from the May 2026 financing.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Revenue amount, customer concentration, contract duration, gross margin, and whether any revenue is recurring
      versus project-based.
    whyItMatters: >-
      The public record hints at early revenue but gives no way to judge whether commercialization has started or
      remains mostly grant and R&D funded.
    diligencePath: >-
      Ask for a monthly revenue bridge, top-customer list, and contract summaries for any revenue-generating spin-off
      products or services.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: commercial-demand
    missingEvidence: Signed customer contracts, PPAs, LOIs, pipeline counts, or public demand commitments for the Biblis roadmap.
    whyItMatters: >-
      Capital raised and policy support do not by themselves prove market pull for a future fusion plant or adjacent
      products.
    diligencePath: >-
      Request customer references, offtake documents, or pipeline data segmented by product, geography, and expected
      commissioning timeline.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: governance-disclosure
    missingEvidence: Board composition, committee structure, observer rights, and key-person contingency planning.
    whyItMatters: >-
      The disclosed public profile is founder- and executive-centric, which makes control risk and succession risk hard
      to size.
    diligencePath: Request the current board roster, committee charters, and any governance memo circulated to investors.
    relatedQuestionRefs:
      - QO002
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Biblis-specific net-output assumptions, target price or LCOE ranges, and a management-backed TAM/SAM/SOM bridge
      from first plant to broader deployment.
    whyItMatters: >-
      Without these inputs, market size can only be discussed through indirect lenses such as financing, siting, and
      throughput, which are insufficient for valuation-grade demand sizing.
    diligencePath: >-
      Ask management for plant-capacity assumptions, economics targets, and any internal market model used to justify
      the Biblis roadmap.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-payer
    missingEvidence: >-
      Disclosed LOIs, off-take agreements, utility procurement milestones, or named pilot customers beyond investors and
      strategic partners.
    whyItMatters: >-
      The current buyer map is strategic and inferred; real customer commitments would materially change confidence in
      adoption timing and budget ownership.
    diligencePath: >-
      Request any utility MOUs, power-offtake discussions, pilot agreements, or commercial-pipeline metrics that convert
      strategic interest into contracted demand.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Public plant pricing, PPA structures, or customer contract values for Focused Energy and named peers.
    whyItMatters: >-
      Without commercial terms, this chapter can compare industrialization and milestones but not buyer economics or
      packaging.
    diligencePath: >-
      Request customer proposals, term sheets, or investor materials that disclose price, milestone payments, and
      delivery obligations.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: commercial-demand
    missingEvidence: >-
      Named customer contracts, offtake agreements, or quantified commercial pipeline evidence for Focused Energy's
      Biblis roadmap.
    whyItMatters: Demand proof would separate a well-funded technical program from a commercially validated market position.
    diligencePath: >-
      Ask management for offtake discussions, utility or industrial counterparties, and any public permitting or
      interconnection milestones tied to specific buyers.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: missing-source
    severity: material
    topic: pricing-disclosure
    missingEvidence: >-
      Public pricing architecture, offtake terms, tariff assumptions, and any customer contract or LOI for future power
      sales.
    whyItMatters: Pricing and customer commitments are necessary to judge revenue quality and commercialization timing.
    diligencePath: >-
      Request the commercial model, target customer segments, draft PPA terms, and any signed or pending customer
      documents.
    relatedQuestionRefs:
      - QI003
      - QI005
  - type: private-evidence-only
    severity: material
    topic: burn-and-runway
    missingEvidence: >-
      Current cash balance, unrestricted cash, monthly burn, runway, and budgeted use of proceeds for Biblis and
      technical programs.
    whyItMatters: >-
      Reported funds raised do not show whether the current balance sheet can finance the next technical and permitting
      phase.
    diligencePath: >-
      Request a board-approved operating plan with monthly cash burn, runway scenarios, and milestone-linked financing
      needs.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: plant-economics
    missingEvidence: >-
      Plant-level capex, opex, target-manufacturing unit cost, maintenance assumptions, and modeled levelized cost of
      electricity.
    whyItMatters: >-
      Without cost-stack detail, public technical thresholds cannot be translated into gross margin or project-finance
      feasibility.
    diligencePath: >-
      Request the integrated plant model, BOM assumptions, target-cost curve, and sensitivity analysis for cadence and
      gain.
    relatedQuestionRefs:
      - QI004
      - QI007
  - type: private-evidence-only
    severity: material
    topic: financing-terms
    missingEvidence: >-
      Post-money valuation, liquidation preferences, grant restrictions, debt requirements, and any project-finance
      structure for Biblis.
    whyItMatters: >-
      Capital raised is not equivalent to cash available on attractive terms, especially for a capital-intensive first
      plant.
    diligencePath: >-
      Request the cap table, term sheets, grant covenants, and planned equity versus non-dilutive versus project-finance
      mix.
    relatedQuestionRefs:
      - QI001
      - QI006
      - QI008
  - type: private-evidence-only
    severity: material
    topic: integrated-performance-proof
    missingEvidence: >-
      Public metrics on integrated repetition-rate performance, target unit cost, target yield consistency, and
      plant-level efficiency assumptions.
    whyItMatters: >-
      Without those numbers, the architecture remains conceptually coherent but still not underwritable as a power-plant
      product.
    diligencePath: >-
      Request the current Super-NOVA or equivalent demo plan, target-factory assumptions, and any public or
      diligence-room test data behind 10 Hz and efficiency claims.
