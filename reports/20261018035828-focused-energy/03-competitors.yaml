company:
  name: Focused Energy
chapter:
  number: 3
  title: Competitors
  summary: >-
    The assigned evidence shows Focused Energy competing less on published pricing or deployed
    customer traction than on architectural differentiation and partner leverage. Its direct-drive,
    proton fast-ignition thesis, RWE-backed Biblis site access, and Rochester collaboration create a
    stronger industrialization story than most chapter-local peers, but General Fusion and Inertia
    each show credible alternate paths through machine-level milestones or lab-linked target design,
    while independent coverage still treats the whole fusion field as commercially unproven.
sections:
  - id: landscape-classes
    title: Landscape and competitor classes
    body: >-
      The local source set supports a broad competitive frame rather than a narrow one-company-vs-one-company
      comparison. Focused Energy is positioned as a laser inertial-confinement fusion company using direct-drive
      proton fast ignition, while Fusion Energy News places it inside a wider field that includes direct peers,
      adjacent inertial-fusion startups, and alternative technical routes such as magnetized target fusion.
      That same profile names First Light, EX-Fusion, and an aneutronic p-11B cohort as relevant alternatives,
      which means the competitive question is not only "who else is building a laser plant" but also "which
      architecture reaches commercially credible hardware first." Focused Energy's own problem framing broadens
      the substitute set further by arguing that solar, wind, natural gas, conventional nuclear, and batteries
      remain the real status-quo options for clean firm power buyers until any fusion developer reaches bankable
      deployment terms.
    claimRefs: [CP001, CP006, CP008, CP016]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: differentiation-and-tradeoffs
    title: Differentiation and buyer tradeoffs
    body: >-
      Focused Energy's differentiation is real, but it is still mostly architectural rather than commercial.
      Its 2023 paper says the company chose direct-drive proton fast ignition and argues direct drive is about
      five times more efficient than indirect drive, while independent 2026 coverage highlights the same
      split-compression and ignitor-beam design as the company's core technical identity. That gives Focused a
      coherent technical story, but the same independent profile also says commercial laser-fusion plants still
      need 10 Hz repetition rates, mass-produced targets, and materially better wall-plug efficiency. The result
      is a market where product-surface differentiation exists, yet buyers and investors still have to judge
      competing engineering programs by milestone quality, subsystem bottlenecks, and partner access instead of
      on live performance, delivered economics, or contract conversion data.
    claimRefs: [CP001, CP002, CP007, CP015]
    tableRefs: [TP002]
  - id: industrialization-and-distribution
    title: Industrialization, trust, and distribution power
    body: >-
      The strongest evidence-backed moat in this chapter is not a public feature lead but a partner stack.
      RWE says it expanded its investment by another 60 million euros, offers decommissioned nuclear-site
      infrastructure plus regulatory expertise, and is willing to accelerate Biblis adaptation if the laser
      fusion hub tender proceeds. Focused Energy's own 2026 news surface adds the national Biblis hub win and a
      $6.9 million collaboration with the University of Rochester's Laboratory for Laser Energetics, reinforcing
      a model built around infrastructure, public-policy alignment, and specialist research access. General
      Fusion and Inertia show different but credible trust vectors: General Fusion through LM26 milestone
      disclosure and General Atomics collaboration, and Inertia through LLNL design-code and target-fabrication
      ties. In practice, switching costs and lock-in are therefore likely to come from sites, supply chains,
      diagnostics, and lab relationships before they come from software-like product stickiness.
    claimRefs: [CP004, CP005, CP008, CP009, CP010, CP012, CP013]
    tableRefs: [TP003]
  - id: transparency-and-moat-risk
    title: Transparency limits and moat risk
    body: >-
      The weakest competitive signal in the assigned pool is commercial transparency. None of the retained
      Focused Energy, General Fusion, or Inertia sources disclose plant pricing, offtake terms, customer
      contracts, or realized unit economics, so the current comparison is necessarily about roadmap credibility
      rather than buyer conversion or margin structure. Independent coverage explicitly warns that many of the
      sector's goals remain ambitious objectives not yet demonstrated commercially anywhere in fusion, and General
      Fusion's own release embeds a long list of execution, financing, regulatory, supply-chain, and competitive
      risks. That means Focused Energy's current advantage is best understood as a better-funded and better-sited
      position inside an unproven category, not as a settled moat that has already cleared commoditization or
      displacement risk.
    claimRefs: [CP011, CP014, CP015]
