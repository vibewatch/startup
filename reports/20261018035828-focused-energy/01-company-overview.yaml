    rows:
      - [Thomas Forner, Co-Founder & CEO, Serial clean-tech entrepreneur and industrial architect, Public face of financing and industrialization narrative, Board or voting-control role not disclosed in assigned sources.]
      - [Prof. Dr. Markus Roth, Co-Founder & CSO, Professor of Laser Physics and co-author of the 2023 technical paper, Core scientific credibility and founder-market fit sit heavily with Roth, Board seat or protective-rights disclosure not public in the pool.]
      - [Dr. Debbie Callahan, Chief Strategy Officer, TNW says she helped design the fuel target used in the historic NIF experiment, Important bridge from NIF lineage to commercialization strategy, Appointment timing and governance authority beyond title are not fully disclosed.]
      - [Omar Biabani, CTO, Background not disclosed in the assigned overview sources, Technical execution owner on the homepage team list, No public governance detail in the assigned pool.]
      - [Chris Wendel, President & CFO, Background not disclosed in the assigned overview sources, Finance and operating cadence depend on a still lightly disclosed public finance bench, No public governance detail in the assigned pool.]
      - [Decker Gentili, COO, Background not disclosed in the assigned overview sources, Operations leadership is named but not deeply profiled publicly, No public governance detail in the assigned pool.]
    notes: Limited to leaders named in the assigned overview sources; blank background depth is a disclosure gap, not an inference of inexperience.
