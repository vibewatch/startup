callouts:
  - calloutType: risk
    title: Capital momentum is real, but disclosure depth still lags execution ambition
    body: >-
      The current public record is strong on financing size, named executives,
      and Biblis ecosystem positioning, but it still leaves valuation,
      governance, customer traction, and plant-scale execution proof materially
      under-disclosed. Independent sources are supportive of the financing story
      while remaining explicit that repetition rate, total system efficiency,
      and other engineering hurdles still separate Focused Energy from a
      commercial power plant.
    claimRefs: [CO006, CO012, CO013, CO015, CO016]
