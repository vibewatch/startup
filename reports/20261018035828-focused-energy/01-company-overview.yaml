      topic: valuation-and-control
      missingEvidence: Post-money valuation, ownership percentages, liquidation preferences, board seats, and protective rights from the 2026 Series A.
      whyItMatters: Financing scale is visible, but price and control determine whether the round was accretive, dilutive, or governance-concentrating.
      diligencePath: Request the cap table, signed term sheet, and any investor-rights agreement from the May 2026 financing.
      relatedQuestionRefs: [QO009]
