    - type: missing-source
      severity: material
      topic: revenue-quality
      missingEvidence: Revenue amount, customer concentration, contract duration, gross margin, and whether any revenue is recurring versus project-based.
      whyItMatters: The public record hints at early revenue but gives no way to judge whether commercialization has started or remains mostly grant and R&D funded.
      diligencePath: Ask for a monthly revenue bridge, top-customer list, and contract summaries for any revenue-generating spin-off products or services.
      relatedQuestionRefs: [QO009]
    - type: private-evidence-only
      severity: material
      topic: commercial-demand
      missingEvidence: Signed customer contracts, PPAs, LOIs, pipeline counts, or public demand commitments for the Biblis roadmap.
      whyItMatters: Capital raised and policy support do not by themselves prove market pull for a future fusion plant or adjacent products.
      diligencePath: Request customer references, offtake documents, or pipeline data segmented by product, geography, and expected commissioning timeline.
      relatedQuestionRefs: [QO009]
