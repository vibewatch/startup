      - Diligence ask
    rows:
      - [RWE, Lead investor and industrial partner, Official release says RWE provides capital access to the Biblis site and regulatory expertise, Most strategically important disclosed external partner in the current pool, Clarify site rights step-in rights and economics tied to Biblis.]
      - [SPRIND, German breakthrough-innovation backer and Series A participant, Named in the Series A syndicate and cited in official policy-oriented release language, Signals state-backed mission alignment and public-policy support, Confirm governance rights and any non-commercial conditions attached to support.]
      - [European Innovation Council Fund, EU deep-tech capital participant, Named in the Series A syndicate, Adds EU-level political and capital signaling to the round, Determine ownership percentage and any follow-on expectations.]
      - [Prime Movers Lab, Returning venture investor, Named as previous lead investor and Series A participant, Indicates continuity from earlier venture backing into the larger round, Request cap-table evolution and any board or observer rights.]
      - [German Federal Ministry of Research Technology and Space, National policy sponsor of the Biblis fusion hub, July 2026 company release says the ministry selected Biblis as the laser fusion hub, Policy support may accelerate siting ecosystem formation and talent concentration, Verify what the hub designation actually commits in funding permitting and timelines.]
      - [Public grant channels including BMBF and DOE INFUSE awards, Non-dilutive R&D support, Legacy company profile cites significant BMBF grants and five DOE INFUSE awards, Grants reduce technical burn but do not prove commercial demand, Request grant amounts milestone obligations and duration by program.]
    notes: Public stakeholder map from named financiers and policy partners; it is not a complete cap table or control-rights schedule.
