  topStrengths:
    - Strong financing momentum and unusually credible strategic sponsors for a fusion startup.
    - Biblis site access and policy alignment improve the execution path versus a greenfield build.
    - The company has a visible senior technical and operating team with a credible scientific lineage.
  topRisks:
    - Public evidence still does not show disclosed customer contracts, pricing, or backlog.
    - Repetition-rate, target-manufacturing, and plant economics remain unproven at commercial scale.
    - Valuation mechanics, runway, and capital-stack terms are still undisclosed to the market.
  unresolvedGaps:
    - >-
      Post-money valuation, liquidation preferences, and investor economics from the May 2026 Series A remain
      undisclosed.
    - Monthly burn rate, cash runway, and detailed use of proceeds for Biblis and subsystem development are not public.
    - >-
      No public customer contract, PPA, or quantified commercial pipeline supports demand assumptions for the mid-2030s
      plant.
    - The exact permitting path, timeline, and cost for a laser-fusion pilot plant at Biblis remain undefined.
    - >-
      Public evidence does not yet show integrated repetition-rate performance, target-manufacturing cost, or
      plant-level efficiency assumptions.
