  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: Biblis-specific net-output assumptions, target price or LCOE ranges, and a management-backed TAM/SAM/SOM bridge from first plant to broader deployment.
      whyItMatters: Without these inputs, market size can only be discussed through indirect lenses such as financing, siting, and throughput, which are insufficient for valuation-grade demand sizing.
      diligencePath: Ask management for plant-capacity assumptions, economics targets, and any internal market model used to justify the Biblis roadmap.
      relatedQuestionRefs: [QM002, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-payer
      missingEvidence: Disclosed LOIs, off-take agreements, utility procurement milestones, or named pilot customers beyond investors and strategic partners.
      whyItMatters: The current buyer map is strategic and inferred; real customer commitments would materially change confidence in adoption timing and budget ownership.
      diligencePath: Request any utility MOUs, power-offtake discussions, pilot agreements, or commercial-pipeline metrics that convert strategic interest into contracted demand.
      relatedQuestionRefs: [QM003, QM008]
