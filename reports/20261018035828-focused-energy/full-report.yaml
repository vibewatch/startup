      - number: '1.3'
        title: Financing milestones, policy momentum, and execution gap
        blocks:
          - type: paragraph
            body: >-
              The strongest 2026 step-change in the public record is the announced $240 million Series A, corroborated
              by both company and independent reporting. Independent reporting also suggests the company is now among
              the most heavily funded fusion startups once grants are included, but that scale should not be confused
              with proof of commercial readiness. The company has accumulated visible ecosystem wins in 2026, including
              a senior policy advisor appointment and Biblis being selected as Germany's laser fusion hub, and its
              homepage now presents an explicit multi-year plant roadmap through 2037. Independent technical commentary
              remains a necessary counterweight: both the Fusion Energy News profile and The Next Web stress that the
              hard part is still bridging from a scientifically relevant ignition lineage to an efficient, repetitive,
              grid-scale commercial reactor.
