  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The retained evidence narrows from capital and policy support to a single utility-backed demo path and then to the
      throughput constraints that still limit any credible market-size claim.
    data:
      items:
        - label: Category capital signal
          value: $500m cumulative private capital plus grants
          valueNote: Capital willingness lens, not customer spend.
          note: Reported by independent coverage as the combined support stack around Focused Energy.
          tone: opportunity
        - label: Latest financing signal
          value: $240m Series A
          valueNote: Official release calls it the largest fully secured Series A in global fusion.
          note: Shows deep investor appetite for the category, but not revenue demand.
          tone: opportunity
        - label: Policy and site anchor
          value: Biblis selected as Germany's laser fusion hub
          valueNote: July 2026 Focused Releases item tied to Fusion 2040.
          note: Public-sector alignment is part of the commercialization path.
          tone: neutral
        - label: Initial deployment locus
          value: 1 named demo-site pathway with RWE
          valueNote: Commercialization currently narrows to a utility-backed first plant.
          note: Concrete siting is stronger than a broad TAM slide, but still only one locus.
          tone: neutral
        - label: Commercial operating target
          value: 10 shots/sec
          valueNote: Shot-rate ambition cited by TechCrunch and The Next Web.
          note: Repetition rate is a hard adoption constraint for any practical plant.
          tone: risk
        - label: Current proof baseline
          value: ~400 NIF shots/year
          valueNote: Independent coverage's comparison point for today's laboratory cadence.
          note: The gap to commercial throughput remains the clearest reason not to overstate market readiness.
          tone: risk
    approximationNotes: >-
