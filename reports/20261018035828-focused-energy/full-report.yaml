      - number: '1.2'
        title: Leadership, governance, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              Focused Energy has a clearly named executive bench in the current homepage materials, led by co-founders
              Thomas Forner and Markus Roth alongside a broader operating team that includes Omar Biabani, Debbie
              Callahan, Chris Wendel, and Decker Gentili. What is much less visible is formal governance: across the
              assigned official and independent overview sources, the company identifies executives, founders, and
              financing partners but does not disclose board composition, independent directors, committee structure, or
              control terms. The investor and stakeholder picture is more legible than the governance picture. RWE
              matters not just as lead investor but as an infrastructure and regulatory partner tied to Biblis, while
              SPRIND, the European Innovation Council Fund, Prime Movers Lab, and public grant channels indicate a
              financing base that spans corporate, state-backed, EU, and venture capital constituencies.
