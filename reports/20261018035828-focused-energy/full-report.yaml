      - number: '5.2'
        title: How the architecture is supposed to scale into a plant
        blocks:
          - type: paragraph
            body: |-
              The clearest 2026 progress is not a public full-system demo; it is the tightening of the
              engineering path from experiments into plant development. Focused Energy's May and July 2026
              updates tie the Biblis site, RWE's regulatory and industrial role, and Germany's national Laser
              Fusion Hub designation into a concrete siting narrative for the first commercial plant. That gives
              the company a visibly stronger deployment scaffold than many physics-only fusion programs, even if
              the permitting path and construction economics remain undisclosed.

              The technical bridge into that plant story is the University of Rochester/LLE collaboration. The
              partner program is explicitly aimed at laser-plasma instabilities, FLUX-enabled experiments, and
              scaling Omega-class work into pilot-plant conditions while testing hybrid-shock targets. In other
              words, Focused Energy is publicly acknowledging that the architecture only becomes investable if it
              can connect laboratory target physics to repeatable plant engineering, not just to another research
              milestone.
