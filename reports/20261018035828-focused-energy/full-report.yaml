      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The available evidence does not support a defensible TAM/SAM/SOM cascade, but it does support several
              narrower sizing lenses that matter for diligence. First, category capital willingness is visible in the
              $240 million Series A and roughly $500 million of cumulative private capital plus grants reported by
              independent coverage. Second, commercialization is currently narrowed to an identified first deployment
              locus at Biblis with RWE, which is much more concrete than a global fusion TAM slide. Third, the biggest
              operational lens is the scale gap between today's National Ignition Facility cadence and the shot-rate
              Focused Energy says a commercial plant would need. The company's technical paper also supplies a nominal 1
              GW reference-cycle model, but this is an engineering requirement—not a Biblis forecast or market-size
              estimate. These are useful demand and execution proxies, but none substitutes for disclosed pricing,
              project-specific output, or contracted buyer volumes.
