  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and deployment frame
        blocks:
          - type: paragraph
            body: >-
              The retained sources place Focused Energy in the market for grid-scale fusion generation rather than in a
              generic "clean tech" bucket. Its own product page emphasizes a commercial power plant architecture,
              deuterium-tritium fuel, manufacturability, modularity, and power-plant-grade reliability, while the
              technical paper and independent coverage describe a direct-drive inertial confinement route intended to
              reach a pilot plant in the mid-to-late 2030s. That framing narrows the addressable market to utility and
              infrastructure deployment around laser-fusion plants and the enabling target, laser, and supply-chain
              stack, while excluding unrelated electricity retail, general decarbonization software, or undifferentiated
              "future of energy" TAM language.
