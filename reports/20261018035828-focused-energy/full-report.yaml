      - number: '6.3'
        title: Retention, expansion, and concentration remain open because the public record lacks customer economics
        blocks:
          - type: paragraph
            body: >-
              The most important missing layer is durability. None of the retained sources disclose customer count,
              conversion from "potential buyers" into contracts, deployment utilization, contract length, renewals,
              churn, NRR, GRR, or top-customer concentration. That leaves the chapter able to say that strategic
              interest exists, but unable to verify whether Focused Energy has a repeatable commercial motion, a
              concentrated reliance on a few counterparties, or a procurement process that can survive the long
              technical timeline to a pilot plant. For an investor, the next diligence step is not another branding or
              ecosystem proof point; it is direct evidence of commercial pipeline quality, counterpart identity, and
              contract structure.
            claimRefs:
