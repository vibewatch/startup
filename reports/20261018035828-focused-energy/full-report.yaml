      - - Thesis
        - >-
          The $240 million Series A plus RWE/Biblis alignment indicates unusually strong sponsor support for a fusion
          company still pre-commercial.
        - >-
          A stronger view would require disclosed terms, staged capex, and proof that strategic capital is converting
          into executable plant milestones.
      - - Anti-thesis
        - >-
          Public evidence still lacks customer contracts, priced round details, and plant-level proof on repetition rate
          and economics.
        - >-
          The anti-thesis weakens if the company discloses binding demand signals and independently reviewable
          technical/economic milestones.
      - - Entry discipline
        - >-
          The current setup resembles a milestone-risked deep-tech option rather than a de-risked infrastructure or
          revenue asset.
        - >-
          Entry discipline improves if new financing terms or milestone readouts reduce dilution risk and narrow the gap
          to pilot-plant feasibility.
    notes: >-
      Arguments separate sponsor quality from underwriting quality; absence of public terms or customer commitments is
      treated as a diligence gap, not proof of absence.
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation/return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Series A terms are disciplined, Biblis hub status accelerates execution, Rochester/DOE work converts into
          measurable pilot milestones, and early buyers move from interest to contracts.
        - >-
          A future round or strategic transaction could be supported at a materially higher valuation if terms and
          milestones de-risk the path to a mid-2030s plant.
        - Technical scale-up still fails, tritium or cost assumptions break, or timelines slip despite more capital.
        - Would need disclosed terms plus milestone evidence beyond sponsor enthusiasm.
      - - Base
        - >-
          Funding buys time and ecosystem credibility, but commercial demand and plant economics remain mostly
          narrative-backed through the next diligence cycle.
        - >-
          The most supportable outcome is watchful tracking rather than immediate underwriting, with valuation anchored
          to milestone progress instead of static comparables.
        - Runway, dilution, and commercialization proof remain opaque while deep-tech execution risk stays high.
        - Best matches today's retained evidence.
      - - Bear
        - >-
          The implied valuation already prices in milestones that prove slower, more expensive, or harder to finance
          than current public material suggests.
        - >-
          Any follow-on raise at weaker terms or delayed proof points would compress returns sharply from a high
          starting mark.
        - Preference overhang, technical slippage, or absent customer traction could force a down-round dynamic.
        - Triggered by negative term disclosure or missed technical/commercial milestones.
    notes: >-
      Scenario logic is milestone-driven because public evidence does not provide revenue, contracted backlog, or
      disclosed priced terms for traditional multiple-based valuation.
    claimRefs:
      - CV001
      - CV005
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
