      - number: '3.3'
        title: Industrialization, trust, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence-backed moat in this chapter is not a public feature lead but a partner stack. RWE
              says it expanded its investment by another 60 million euros, offers decommissioned nuclear-site
              infrastructure plus regulatory expertise, and is willing to accelerate Biblis adaptation if the laser
              fusion hub tender proceeds. Focused Energy's own 2026 news surface adds the national Biblis hub win and a
              $6.9 million collaboration with the University of Rochester's Laboratory for Laser Energetics, reinforcing
              a model built around infrastructure, public-policy alignment, and specialist research access. General
              Fusion and Inertia show different but credible trust vectors: General Fusion through LM26 milestone
              disclosure and General Atomics collaboration, and Inertia through LLNL design-code and target-fabrication
              ties. In practice, switching costs and lock-in are therefore likely to come from sites, supply chains,
              diagnostics, and lab relationships before they come from software-like product stickiness.
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: Transparency limits and moat risk
        blocks:
          - type: paragraph
            body: >-
              The weakest competitive signal in the assigned pool is commercial transparency. None of the retained
              Focused Energy, General Fusion, or Inertia sources disclose plant pricing, offtake terms, customer
              contracts, or realized unit economics, so the current comparison is necessarily about roadmap credibility
              rather than buyer conversion or margin structure. Independent coverage explicitly warns that many of the
              sector's goals remain ambitious objectives not yet demonstrated commercially anywhere in fusion, and
              General Fusion's own release embeds a long list of execution, financing, regulatory, supply-chain, and
              competitive risks. That means Focused Energy's current advantage is best understood as a better-funded and
              better-sited position inside an unproven category, not as a settled moat that has already cleared
              commoditization or displacement risk.
            claimRefs:
              - CP011
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Financing platform is strong, but public revenue evidence is still pre-commercial
        blocks:
          - type: paragraph
            body: |-
              The clearest financial fact in the current refresh is the May 2026 Series A: Focused Energy
              and multiple outside writeups converge on a $240 million round led by RWE, with SPRIND, the
              European Innovation Council Fund, and Prime Movers Lab also named. Public sources further tie
              that capital to Biblis and to a utility-backed siting strategy rather than to disclosed
              customer contracts, shipments, or recurring revenue. Even the more expansive independent
              coverage frames the story as plant development, demonstration infrastructure, and industrial
              policy support.

              That distinction matters for underwriting. The public record supports a view that Focused
              Energy has more financing momentum than most fusion peers and a better-than-average path to
              site access and regulatory coordination. It does not yet support a view on realized pricing,
              revenue recognition, gross margin, or sales efficiency because no retained source discloses
              signed offtake agreements, customer concentration, booked revenue, or unit-level economics.
              For this chapter, public capital is best treated as commercialization fuel rather than proof of
              monetization quality.
