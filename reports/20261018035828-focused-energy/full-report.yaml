  - id: FE001
    title: Publicly disclosed product-to-plant architecture
    type: stack
    summary: >-
      Focused Energy's disclosed stack runs from Pearl targets and fast-ignition lasers through partner validation into
      the Biblis plant program.
    data:
      layers:
        - label: Plant commercialization
          detail: Public outcome the company describes as the end state of the stack.
          outputs:
            - First commercial laser fusion power plant in Biblis
            - Mid-2030s deployment target
        - label: Site and regulatory scaffolding
          detail: 2026 disclosures tie the plant program to an actual site and named regulatory support.
          modules:
            - Biblis site access
            - RWE regulatory expertise
            - National Laser Fusion Hub designation
        - label: Pilot-plant engineering
          detail: Plant engineering work sits between the experimental program and any commercial reactor.
          modules:
            - Pilot-plant modeling
            - Tritium-breeding reactor-vessel design
            - 10 Hz plant-operation assumption
        - label: Target and fuel system
          detail: Pearl targets are the consumable core of the fuel path.
          modules:
            - Deuterium-tritium Pearl capsules
            - In-house target-lab capability
            - Hybrid-shock target testing
        - label: Laser architecture
          detail: The design splits compression from ignition rather than relying on a single hot-spot path.
          modules:
            - Direct-drive compression beam
            - Proton fast-ignition hot-spot beam
            - 3 kJ, >10% wall-plug-efficiency demonstrator roadmap
        - label: Experimental validation loop
          detail: Partnered experiments are meant to reduce the main scale-up unknowns before plant deployment.
          modules:
            - FLUX laser experiments
            - Omega-class scaling work
            - CBET / SRS / two-plasmon-decay mitigation
    claimRefs:
