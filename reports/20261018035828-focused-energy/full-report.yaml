    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              The assigned source pool is consistent that Focused Energy is a 2021 fusion startup built around
              direct-drive laser fusion and a German-American operating footprint. Official materials describe the
              company as a spin-off tied to Technical University Darmstadt and National Energetics, while the May 2026
              financing release anchors headquarters in Darmstadt and lists offices in Berlin, Austin, and San
              Francisco. The current homepage positions the business as commercializing the post-NIF ignition pathway
              and advertises a team of 160+ engineers, scientists, and operators. Public scale disclosures remain
              uneven, however: one legacy company profile still says the company has raised more than $175 million
              across private capital and grants, while newer 2026 financing coverage centers on the larger Series A and
              later total-funding estimates. The same legacy page mentions early revenue from a spin-off product line,
              but the assigned public evidence does not disclose revenue amount, customer count, or contract detail.
