      - number: '6.2'
        title: Public adoption proof is milestone- and partner-driven, with no disclosed operating deployment base
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence is strongest where counterparties validate Focused Energy's technical program or
              industrial setup, not where customers validate delivered energy output. The newsroom evidence includes a
              $6.9 million industrial-sponsored collaboration with the University of Rochester's Laboratory for Laser
              Energetics, while the official financing release emphasizes RWE's site access and regulatory role at
              Biblis. Independent and technical sources still frame the company around a pilot-plant roadmap in the mid
              to late 2030s and around demanding engineering milestones such as repetition rate and target
              manufacturing. The implication for diligence is that external proof exists, but it is proof of ecosystem
              traction and technical seriousness, not proof of current commercial deployment.
