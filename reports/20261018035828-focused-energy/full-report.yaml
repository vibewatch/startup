      - number: '5.3'
        title: Maturity, external dependencies, and technical-control gaps
        blocks:
          - type: paragraph
            body: |-
              The strongest open risks are still plant-scale execution risks. Focused Energy's own 2023 paper
              describes commercial inertial fusion as needing roughly 2.5 MJ per pulse at 10 Hz, a 3 kJ
              diode-pumped demonstrator with more than 10% wall-plug efficiency, target manufacturing at
              900,000 units per day, and a reactor vessel compatible with tritium breeding and sustained 10 Hz
              operation. Those are not cosmetic optimization tasks; they are the program's gating workstreams.

              Independent synthesis from Fusion Energy News points to the same bottleneck class from the outside:
              picosecond ignitor energy, proton-beam focusing, driver efficiency, target throughput, and
              repetition-rate scaling. Public evidence also remains thin on plant safety case detail, QA/QC,
              cybersecurity, and component-level reliability disclosure. The result is a product story with a
              coherent architecture and partner map, but with most of the risk still concentrated in integration,
              scale-up, and plant-operating proof rather than in market-facing feature breadth.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Current counterparties are strategic, public, and research stakeholders rather than proven paying customers
        blocks:
          - type: paragraph
            body: >-
              The retained public record shows Focused Energy assembling the ecosystem around a future fusion plant, not
              documenting a current portfolio of paying end customers. The clearest buyer-side signal is the company's
              statement that the oversubscribed May 2026 round included "potential buyers of fusion energy," reinforced
              by SPRIND's parallel write-up of the same financing. Named external counterparties in the retained pool
              are RWE as site and regulatory partner, public-sector innovation backers such as SPRIND and EIC-related
              funding, and research collaborators such as LLE. That mix matters because it supports political,
              technical, and infrastructure readiness, but it is not the same thing as disclosed revenue contracts,
              recurring usage, or utility offtake commitments.
