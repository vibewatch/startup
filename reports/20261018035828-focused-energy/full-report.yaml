      - number: '2.3'
        title: Buyer map, growth drivers, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest near-term buyer and payer signals are strategic rather than transactional. RWE appears as
              both investor and industrial/site partner, government-linked bodies such as SPRIND and the European
              Innovation Council Fund appear in the financing stack, and Focused Energy says the round included
              potential future buyers of fusion energy. That points to an adoption path in which utilities, public
              innovation agencies, and industrial ecosystem builders underwrite early deployment before any broad
              merchant-power market exists. The same evidence also shows why the market should still be treated
              cautiously: direct drive may be more efficient than indirect drive, but the commercial system still has to
              prove manufacturable targets, repetition rate, reliability, and plant-level efficiency beyond laboratory
              net-energy headlines. Deployment timing is itself unsettled: company-authored evidence points to the
              mid-to-late or mid-2030s, while an independent profile uses the earlier "early 2030s" formulation for
              prototype operation.
