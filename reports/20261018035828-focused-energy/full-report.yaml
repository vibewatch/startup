  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              The local source set supports a broad competitive frame rather than a narrow one-company-vs-one-company
              comparison. Focused Energy is positioned as a laser inertial-confinement fusion company using direct-drive
              proton fast ignition, while Fusion Energy News places it inside a wider field that includes direct peers,
              adjacent inertial-fusion startups, and alternative technical routes such as magnetized target fusion. That
              same profile names First Light, EX-Fusion, and an aneutronic p-11B cohort as relevant alternatives, which
              means the competitive question is not only "who else is building a laser plant" but also "which
              architecture reaches commercially credible hardware first." Focused Energy's own problem framing broadens
              the substitute set further by arguing that solar, wind, natural gas, conventional nuclear, and batteries
              remain the real status-quo options for clean firm power buyers until any fusion developer reaches bankable
              deployment terms.
