  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the company is actually building
        blocks:
          - type: paragraph
            body: |-
              Focused Energy's public materials position the company less as a seller of a near-term reactor box
              and more as a full-stack laser-fusion program. The disclosed product surface combines a
              direct-drive proton fast-ignition architecture, the LightHouse plant concept, Pearl
              deuterium-tritium fuel targets, and a pilot-plant roadmap centered on Biblis. That framing
              matters because it puts current maturity in design, target development, and plant planning rather
              than in a commercially deployed generation asset.

              The product claims also stress manufacturability rather than only physics ambition. Company pages
              say LightHouse is designed for modularity, manufacturability, and power-plant-grade reliability,
              while ESG Today repeats the same design language and describes proprietary mass-produced Pearl fuel
              capsules. Those claims help explain the intended buyer value proposition — a path to dispatchable
              clean power from a retired thermal site footprint — but they do not yet substitute for public
              throughput, cost, or demonstrated-operability data on the actual subsystems.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE016
