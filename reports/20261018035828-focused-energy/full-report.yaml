      - number: '3.2'
        title: Differentiation and buyer tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Focused Energy's differentiation is real, but it is still mostly architectural rather than commercial. Its
              2023 paper says the company chose direct-drive proton fast ignition and argues direct drive is about five
              times more efficient than indirect drive, while independent 2026 coverage highlights the same
              split-compression and ignitor-beam design as the company's core technical identity. That gives Focused a
              coherent technical story, but the same independent profile also says commercial laser-fusion plants still
              need 10 Hz repetition rates, mass-produced targets, and materially better wall-plug efficiency. The result
              is a market where product-surface differentiation exists, yet buyers and investors still have to judge
              competing engineering programs by milestone quality, subsystem bottlenecks, and partner access instead of
              on live performance, delivered economics, or contract conversion data.
