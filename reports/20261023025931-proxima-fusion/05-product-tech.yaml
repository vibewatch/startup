      - ["Magnet system", "Generate high-field three-dimensional confinement", "REBCO/HTS materials and precision fabrication", "Coil manufacture, cooling and fatigue"]
      - ["Plasma and fueling", "Sustain deuterium-tritium fusion conditions", "Stable confinement and continuous refueling", "Fuel handling and sustained performance"]
      - ["First wall / blanket", "Manage neutrons, heat and tritium breeding", "Materials and complex stellarator geometry", "Neutron damage and breeding shortfall"]
      - ["Heat exhaust", "Remove plasma and reactor heat", "Divertor and thermal design", "Localized thermal peaking"]
      - ["Plant integration", "Convert heat to useful grid electricity", "EPC, permitting, RWE infrastructure and supply chain", "Schedule, cost and reliability of first-of-kind build"]
    notes: Architecture layers synthesize the technical roles described in the assigned sources; several layers remain design or validation tasks rather than deployed components.
    claimRefs: [CE005, CE007, CE008, CE010, CE011, CE012, CE014, CE015, CE016]
