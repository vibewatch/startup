callouts:
  - calloutType: strength
    title: Differentiated technical route
    body: Proxima combines QI stellarator physics, W7-X lineage and HTS magnet development into a distinct continuous-operation thesis.
    claimRefs: [CE005, CE006]
  - calloutType: risk
    title: Hardware proof is the gating item
    body: The public record is strongest for the Stellaris design concept and weakest for integrated SMC, Alpha and long-duration plant-operation evidence.
    claimRefs: [CE007, CE008, CE014, CE015]
  - calloutType: recommendation
    title: Underwrite milestones, not marketing
    body: Technical diligence should require reproducible magnet, plasma, heat-exhaust and materials test data before treating the commercial timeline as executable.
    claimRefs: [CE010, CE011, CE012, CE013]
