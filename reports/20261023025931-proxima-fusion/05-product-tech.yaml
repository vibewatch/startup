chapter:
  number: 5
  title: Product & Technology
  summary: Proxima is developing a quasi-isodynamic stellarator power-plant architecture that combines externally generated magnetic confinement, high-temperature superconducting magnets, and computational design. The public evidence supports a peer-reviewed concept and a staged Alpha-to-Stellaris plan, but hardware validation, continuous operation, heat exhaust, neutron-facing materials, and delivery economics remain open execution risks.
sections:
  - id: product-and-workflow
    title: Product and customer workflow
    body: >-
      Proxima's product is not a delivered electricity service yet; it is a staged
      fusion-power-plant development program. The proposed workflow starts with a
      research-backed QI stellarator design, advances through a Stellarator Model
      Coil demonstration and the Alpha demonstration machine, and then targets
      Stellaris as a commercial plant. The public plan assigns Proxima engineering,
      procurement and construction responsibility, IPP plasma-physics leadership,
      RWE power-plant expertise, and Bavaria permitting and funding support. This
      creates a credible division of work for a first-of-kind asset, but it also
      means value delivery depends on coordinated partners, public approvals and
      technology milestones rather than a repeatable software deployment. The
      February 2026 agreement describes Alpha as a net-energy validation step and
      Stellaris as the later grid asset; it is therefore evidence of an operating
      model and development pathway, not proof of commercial output or contracted
      revenue.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture and maturity
    body: >-
      The technical thesis is a stellarator whose three-dimensional external coils
      provide the confining field without relying on a large plasma current. That
      architecture is intended to support steady-state operation and avoid the
      disruption mode associated with tokamak plasma current, while QI optimization
      and HTS magnets seek higher field strength and a smaller plant footprint. The
      Stellaris paper and contemporaneous technical coverage describe a design that
      integrates electromagnetic, structural, thermal and neutronic analyses, but a
      design study is not an operating reactor. The strongest maturity evidence is
      therefore the peer-reviewed concept and the Wendelstein 7-X research lineage;
      the weakest links are the uncompleted SMC and Alpha demonstrations. Public
      sources also identify non-planar coil precision, divertor heat loads, tritium
      breeding, and neutron damage as engineering problems that remain relevant to
      commercial deployment.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: dependencies-and-risk
    title: Dependencies, trust and execution risk
    body: >-
      The program's dependency stack is unusually broad: plasma physics and
      computational optimization must become manufacturable HTS magnet assemblies;
      those assemblies must survive thermal and neutron environments; the plant
      must then secure permitting, public support, supply-chain capacity and
      utility-grade construction. DOE background on stellarators confirms both the
      potential advantage of continuous confinement and the historical difficulty
      of manufacturing precise, complex coils. Independent MIT work reduces one
      specific concern about an instantaneous neutron-related REBCO current drop,
      including a Proxima researcher among the authors, but it does not resolve
      long-term degradation or the full reactor materials problem. Proxima's public
      evidence consequently supports a differentiated technical direction with
      credible research partners, not yet a demonstrated reliability, safety or
      cost position. The only developer-signal proxy in the assigned evidence is
      an ATS-derived hiring snapshot that displayed 52 open roles across Munich,
      Zurich and Gundremmingen. That signal is directionally consistent with
      hardware execution, but company-origin job listings do not provide a
      reproducible software benchmark, engineering release history or independent
      quality assessment.
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015, CE016]
    callouts: []
