    data:
      layers:
        - label: Physics and control
          modules: [QI magnetic geometry, Computational optimization]
        - label: Confinement hardware
          modules: [3D external coils, HTS REBCO magnets]
        - label: Fusion core
          modules: [Deuterium-tritium plasma, Continuous refueling]
        - label: Reactor materials
          modules: [Neutron blanket, First-wall structures]
        - label: Thermal systems
          modules: [Divertor heat exhaust, Heat conversion]
        - label: Delivery asset
          modules: [Alpha demonstrator, Stellaris grid plant]
