  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: maturity
      missingEvidence: Public SMC test data, Alpha construction progress, plasma performance, net-energy measurements and operating availability.
      whyItMatters: The commercial thesis depends on moving from a simulated concept to durable integrated hardware.
      diligencePath: Request milestone reports, raw test summaries, independent review and acceptance criteria for SMC and Alpha.
      relatedQuestionRefs: [QE004, QE009]
    - type: missing-source
      severity: material
      topic: manufacturing
      missingEvidence: Demonstrated non-planar HTS coil manufacturing tolerances, cooling performance, maintenance plan and supplier capacity.
      whyItMatters: Coil manufacturability and lifetime can determine schedule, cost and plant availability.
      diligencePath: Review supplier qualification, metrology records, thermal-cycle results and replacement economics.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public engineering repository, versioned simulation artifacts, benchmark results or practitioner-community evidence tied to Proxima.
      whyItMatters: The assigned evidence does not independently test software or computational execution maturity.
      diligencePath: Obtain a technical data room with reproducible model outputs, validation datasets, change logs and external code review.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: plant-integration
      missingEvidence: Binding plant-delivery economics, permits, grid interconnection, tritium-breeding validation and long-duration reliability evidence.
      whyItMatters: Partner agreements and site plans do not establish a bankable first-of-kind power asset.
      diligencePath: Request permitting schedule, EPC basis of estimate, grid studies, materials qualification and independent safety review.
      relatedQuestionRefs: [QE008, QE009, QE010]
