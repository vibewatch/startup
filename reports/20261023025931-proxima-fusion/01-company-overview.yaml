company:
  name: Proxima Fusion
chapter:
  number: 1
  title: Company Overview
  summary: Proxima Fusion is a 2023 Max Planck spin-out building quasi-isodynamic stellarators from Munich, with a company-reported team of more than 200 across three European locations. Its €411 million July 2026 financing at a stated €2.4 billion valuation gives it substantial development capital, but Alpha net energy and Stellaris grid delivery remain unproven targets rather than operating results.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: Proxima Fusion was founded in 2023 as the first spin-out from the Max Planck Institute for Plasma Physics and is headquartered in Munich, with additional locations in Zurich and Oxford. It is developing quasi-isodynamic stellarators that pair computationally optimized confinement with high-temperature superconducting magnets. Alpha is the planned net-energy demonstrator, while Stellaris is the planned commercial power plant. The available evidence therefore describes a capital-intensive technology developer building machines, manufacturing capability, and industrial partnerships; it does not establish current electricity sales, a commercial operating plant, or a disclosed revenue base. The scientific lineage is credible, but the business remains dependent on translating research into qualified hardware and eventually bankable generation assets.
    claimRefs: [CO001, CO002, CO003, CO011, CO012]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, founders, and governance
    body: The five-person founding team spans plasma physics, stellarator science, engineering, and assembly. Proxima's current company page places co-founders in the CEO, external-affairs, chief-scientist, chief-engineer, and assembly leadership roles, while public profiles show that some titles have changed as the organization scaled. This concentration aligns the founders closely with the technical roadmap, but it also creates key-person exposure around scientific judgment, magnet engineering, and program execution. Sergei Galperin is listed as CFO, adding dedicated finance leadership. Public sources identify scientific, utility, state, investor, and industrial partners, yet they do not disclose board composition, voting rights, succession plans, investor ownership, liquidation preferences, or reserved matters; governance quality and control remain diligence items rather than verified strengths.
    claimRefs: [CO004, CO005, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, scale, and strategic backing
    body: On 7 July 2026, Proxima announced a €411 million financing at a stated €2.4 billion valuation. XTX Ventures and East X Ventures led the round; Google and RWE joined as strategic investors. Proxima and an investor release said cumulative public and private funding exceeded €650 million, including €95 million in public grants. That amount is funding raised, not revenue, unrestricted cash, or remaining runway. The company and its investor also reported roughly or more than 200 employees across Munich, Zurich, and Oxford, whereas the SHORTList company profile showed more than 150, illustrating that secondary headcount records lag or use different dates. No assigned evidence discloses revenue, customer count, burn, cash balance, debt, or financing preferences, so those metrics remain explicit gaps.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: milestones-and-execution-risk
    title: Milestones and execution risk
    body: The roadmap combines established research heritage with forward-looking company targets. Proxima traces its foundation to Wendelstein 7-X, raised a €20 million seed in 2024 and a €130 million Series A in 2025, entered a Bavaria-RWE-IPP arrangement in February 2026, and completed the €411 million round in July 2026. It targets completion of the Stellarator Model Coil in 2027, Alpha net energy in the early 2030s, and Stellaris grid electricity later in that decade. None of the assigned sources reports commercial fusion generation or completed Alpha net energy. CNBC explicitly notes that fusion has not been commercially deployed and that commercialization is immensely challenging. Capital and partnerships improve the probability of testing the roadmap; they do not validate coil manufacturability, integrated plant economics, net energy, licensing, offtake, or schedule.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Capital and ecosystem depth
    body: The July 2026 round added €411 million and strategic backing from RWE and Google to a program rooted in Max Planck stellarator research.
    claimRefs: [CO001, CO006, CO008]
  - calloutType: risk
    title: Financing is not technical validation
    body: Commercial fusion remains undeployed, while Alpha net energy and Stellaris grid delivery are still company targets.
    claimRefs: [CO011, CO012, CO016]
