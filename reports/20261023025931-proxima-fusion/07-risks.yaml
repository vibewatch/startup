company:
  name: Proxima Fusion
chapter:
  number: 7
  title: Risks
  summary: >-
    Proxima Fusion's principal risks are commercialization dependencies rather than a documented company-specific incident:
    net-energy, materials, tritium, regulation, and project-finance milestones remain unproven. Public evidence supports a
    staged mitigation path through Alpha and institutional partners, but the evidence does not yet establish that the path
    is funded, licensed, or technically demonstrated through grid delivery.
sections:
  - id: risk-ranking
    title: Ranked risk assessment
    body: >-
      Proxima's risk profile is dominated by a long chain of technical and project milestones. Independent fusion assessments state
      that net energy has not yet been achieved, while commercial systems still need materials that survive sustained fusion
      conditions and a workable tritium supply. Proxima's public timetable places Alpha construction in 2027 and a net-energy
      demonstration target in 2031, which makes those milestones thesis-critical rather than routine execution steps. The
      available evidence supports a high residual exposure rating because the proposed mitigation is a development program, not
      an operating control. The key monitor is milestone evidence: a demonstrated high-field magnet, sustained plasma
      performance, and an independently reviewable Alpha schedule and budget. A missed milestone, material redesign, or materially
      higher capital requirement would weaken the commercial-plant thesis before revenue exists.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: legal-regulatory
    title: Regulatory and legal exposure
    body: >-
      Fusion regulation is developing, and the applicable pathway depends on jurisdiction and facility design. The UK draft
      EN-8 consultation describes a technology-agnostic planning framework for future fusion infrastructure, with environmental,
      safety, security, operational, and developmental considerations still subject to consultation and parliamentary steps. In
      the United States, the NRC's proposed framework would use a byproduct-material licensing pathway, but the agency identifies
      unresolved waste-classification, disposal, tritium-reporting, export-control, and state-federal compatibility questions.
      These are not evidence that Proxima is non-compliant; they show that a commercial fusion plant will require a
      project-specific permitting and waste strategy. Proxima's Bavaria and RWE memorandum identifies permitting and regulatory
      processes as joint workstreams, but a memorandum is not a license or development consent. The appropriate diligence test
      is a named permitting plan with decision dates, competent authorities, waste route, and public-consultation obligations.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: operational-dependency
    title: Operational, supply-chain, and partner dependencies
    body: >-
      Proxima's execution model depends on specialist suppliers, research institutions, an energy-company partner, and public
      funding. The Max Planck Institute describes high-temperature-superconductor coils as a central technical challenge and says
      the material is a brittle ceramic that must be applied to steel tapes and integrated into copper windings. The same account
      identifies tritium breeding, reactor-wall materials, waste disposal, and grid compatibility as unresolved industry-wide
      conditions. Proxima's planned division of labor gives IPP scientific oversight, Proxima engineering and construction
      responsibility, and RWE operating expertise, but it does not prove that the counterparties have committed final capital,
      performance guarantees, or supply capacity. A partner withdrawal, delayed magnet qualification, or unavailable tritium and
      materials supply could extend the timetable and increase burn. Monitoring should focus on executed agreements, supplier
      qualification, magnet test results, and a funded procurement schedule.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: kill-criteria
    title: Thesis-break triggers and diligence asks
    body: >-
      The investment case should be treated as a staged option on technical proof, not as a forecast of near-term operating cash
      flow. Public reporting describes a €2.4 billion valuation and more than €650 million raised, but the sources do not disclose
      burn, runway, ownership, liquidation preferences, or the portion of capital that is restricted to milestones. That opacity
      is a financial-model risk: funding is not cash available for all uses, and a large round does not establish an economic
      return. The practical kill criteria are measurable: no independently reviewable high-field magnet result by the stated
      program milestone; no credible Alpha cost and permitting baseline before construction; inability to identify a tritium and
      activated-materials disposal route; or failure to secure binding commercial counterparties beyond an MoU. Until those tests
      are met, the residual exposure remains high and the principal diligence ask is primary evidence of schedule, budget,
      licensing, and counterparties.
    claimRefs: [CR013, CR014, CR015, CR016]

tables:
  - id: TR001
    title: Ranked technical and execution risk register
    columns: [Risk, Likelihood, Severity, Mitigation maturity, Residual exposure, Investment implication]
    rows:
      - [Net-energy and plasma-performance failure, high, critical, "Development program and W7-X heritage; no Proxima Alpha result yet", high, "Alpha is thesis-critical; delay or failure defers commercial proof"]
      - [High-field magnet underperformance, high, critical, "Coil development with specialist research partner; demonstration target described", high, "Design or schedule reset could increase capital needs"]
      - [Materials and tritium supply constraints, high, critical, "Industry research and planned breeding; supply path remains untested", high, "Commercial plant cannot be underwritten without a fuel and wall-material route"]
      - [Construction and project-finance overrun, medium, high, "Staged Alpha/Stellaris concept and public-private partners", high, "Funding raised is not disclosed cash available for full build-out"]
      - [Partner or supplier dependency, medium, high, "IPP, RWE, public funding, and supplier collaboration", medium-high, "Withdrawal or delay would lengthen development"]
    notes: "Likelihood and residual exposure are analytical judgments anchored to the cited technical, funding, and partner evidence; they are not company-disclosed probabilities."
    claimRefs: [CR001, CR002, CR003, CR009, CR010, CR013]
  - id: TR002
    title: Regulatory / legal risk register
    columns: [Rule/license/case, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [Fusion facility planning consent, England and Wales as a policy comparator, "Draft EN-8 consultation issued 2026-06-08; final designation planned 2027", medium, high, "Technology- and output-agnostic national policy framework", medium-high, "Map German and Bavarian planning authorities and consent gates for Alpha/Stellaris"]
      - [Fusion-machine materials licensing, United States, "NRC proposed framework published 2026-02-26; final rule targeted October 2026", medium, high, "Risk-informed byproduct-material pathway", medium, "Confirm German licensing analogue and responsible authorities"]
      - [Activated-material waste classification and disposal, United States, "NRC identifies interim approach and unresolved classification limits", high, critical, "Existing low-level-waste routes plus site-specific assessment where needed", high, "Obtain a project-specific waste inventory, classification basis, and disposal commitment"]
      - ["Tritium reporting, security, and export-control requirements", "United States and international", "NRC requested comments on thresholds and export controls", medium, high, "Rulemaking and future licensing submissions", high, "Obtain tritium inventory, containment, reporting, and export-control plan"]
    notes: "This is a partial register of public regulatory issues and policy comparators, not a finding that Proxima has violated a rule; German project-specific permits were not located in the assigned evidence."
    enumerationScope:
      coverage: partial
      basis: "Public fusion regulatory and planning materials available in the assigned pool through 2026-10-23; not a complete German permit inventory."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Scientific oversight and plasma physics, Max Planck Institute for Plasma Physics, "Scientific oversight of Alpha", high, "Loss of access or misalignment slows validation", high, "Institutional collaboration and W7-X heritage", medium-high]
      - [Plant operations and site relationship, RWE, "Operational expertise and Gundremmingen relationship", high, "Site or operator commitment does not reach binding project terms", high, "MoU and stated willingness to participate financially", high]
      - [Public project funding, Free State of Bavaria and federal programs, "Potential contribution and fusion research support", high, "Funding is conditional, delayed, or insufficient", high, "Public-private financing structure", high]
      - [High-temperature superconducting magnet supply and qualification, Paul Scherrer Institute and specialist suppliers, "Coil development and manufacturing capability", high, "Brittle ceramic integration or supplier bottleneck delays magnet", critical, "Joint research and planned demonstration magnet", high]
    notes: "Counterparty roles and concentration are based on public descriptions of the proposed program; executed guarantees, exclusivity, and final funding commitments are not disclosed in the assigned sources."
    claimRefs: [CR009, CR010, CR011, CR012]

