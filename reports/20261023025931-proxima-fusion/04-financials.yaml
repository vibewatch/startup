  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: underwriting-gaps
      missingEvidence: Monthly cash burn, cash balance, unrestricted cash, runway, and debt obligations.
      whyItMatters: Without cash adequacy, investors cannot determine whether current financing reaches the Alpha milestones or when another raise may be required.
      diligencePath: Request the latest management accounts, 24-month cash forecast, debt schedule, and funding restrictions under confidentiality.
      relatedQuestionRefs: [QI004, QI007, QI008]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: commercial-traction
      missingEvidence: Binding offtake, PPA, plant-delivery, or customer contracts with price and acceptance terms.
      whyItMatters: Future revenue and project economics cannot be tested from collaboration announcements alone.
      diligencePath: Request executed commercial agreements, pipeline stage definitions, counterparties, milestones, and termination rights.
      relatedQuestionRefs: [QI002, QI003]
      relatedTableRefs: [TI001, TI002]
    - type: missing-source
      severity: material
      topic: capital-intensity
      missingEvidence: Bottom-up Alpha budget, contingency, procurement plan, and committed versus prospective funding.
      whyItMatters: The reported €2 billion estimate and financing-share percentages may not define the full funding requirement or cost-overrun exposure.
      diligencePath: Request the integrated project schedule, cost book, contingency policy, grant award letters, and financing term sheets.
      relatedQuestionRefs: [QI006, QI008]
      relatedTableRefs: [TI003]
    - type: conflicting-data
      severity: material
      topic: funding
      missingEvidence: Reconciled round chronology distinguishing private equity, public grants, and project support.
      whyItMatters: Public accounts report different totals and labels; mixing raised capital with grants or valuation could overstate deployable liquidity.
      diligencePath: Obtain an investor-approved financing schedule and reconcile it to audited or management financial statements.
      relatedQuestionRefs: [QI005]
      relatedTableRefs: [TI003]
    - type: access-blocked
      severity: minor
      topic: source-access
      missingEvidence: The assigned Energy News URL returned unrelated news-feed text instead of the named Proxima article.
      whyItMatters: The URL remains discovery provenance but cannot support a financial claim from its fetched text.
      diligencePath: Replace or re-fetch the article only in a future authorized discovery run; do not use its search snippet as evidence.
