schemaVersion: "report-v2"
artifact: financials
slug: proxima-fusion
runDate: 2026-10-23
company:
  name: Proxima Fusion
chapter:
  number: 4
  title: Financials
  summary: Proxima Fusion is financing a long-duration fusion development program rather than generating commercial revenue. Public evidence shows substantial investor and public-sector support, but no disclosed revenue, realized pricing, burn, runway, or plant-delivery economics; underwriting therefore depends on milestone financing and technical execution.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: Proxima Fusion's public materials describe a product strategy centered on developing and eventually supplying stellarator-based fusion power plants, not a currently operating energy business. The company says Alpha is a demonstration machine and Stellaris is the intended commercial plant, while partner coverage describes the planned product as a heat-generating stellarator that energy companies would operate. That implies a future capital-goods and technology-delivery model rather than recurring software revenue, but the public record does not disclose a signed power-purchase agreement, customer contract, list price, service fee, or realized revenue. RWE's role in the February 2026 memorandum is described as industrial and potentially financial participation; it is not evidence of current sales. Revenue recognition, milestone billing, warranties, operating-service revenue, and any electricity offtake economics remain unreported.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: capital-and-costs
    title: Capital needs, cost structure, and financing dependency
    body: The financing profile is consistent with a pre-revenue, hardware-intensive science venture. Public coverage reports a €411 million financing round at a €2.4 billion valuation in July 2026, while the February 2026 MoU says Proxima intends to finance approximately 20% of project costs through private investment and Bavaria indicated a potential 20% state contribution. A separate independent account reports Alpha construction costs of roughly €2 billion and up to €400 million of Bavarian support, but those figures are planning estimates rather than audited commitments. The company has not publicly disclosed cash on hand, quarterly burn, runway, debt, cap-table terms, or the portion of funding that is restricted to projects. Continued access to equity, grants, strategic capital, and project finance is therefore a core dependency.
    claimRefs: [CI005, CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: Financial underwriting is currently milestone-based rather than earnings-based. The strongest public evidence supports capital availability for the next development phase and a credible industrial consortium, but not a validated margin path or commercial payback. The Alpha target is to demonstrate net energy in the early 2030s, and the published technical discussion says a magnetic-confinement plant would need approximately Q=10 to generate electricity; neither is a revenue or cash-flow forecast. The most decision-relevant gaps are actual burn and runway, Alpha's binding budget and funding sources, procurement and cost-overrun exposure, the commercial contracting path after demonstration, and independent validation of the technical milestones. Until those are disclosed, the appropriate financial stance is to treat the €2.4 billion valuation as venture option value exposed to financing and execution risk, not as a multiple of current revenue.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]
    figureRefs: [FI001]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit, Current value/status, Quality, Diligence ask]
    rows:
      - [Demonstration engineering, Alpha development and engineering work, project milestone, "Planned; no revenue disclosed", company-described, "Obtain signed customer or grant contracts and milestone billing terms"]
      - [Commercial plant technology, Stellarator plant design and delivery, plant / project, "Targeted through Stellaris; no contract value disclosed", inferred from product strategy, "Obtain delivery scope, warranty, commissioning, and acceptance terms"]
      - [Electricity generation, Future output from a commercial plant, MWh / power plant, "Not yet operating; no realized output", unavailable, "Obtain offtake, PPA, tariff, and dispatch assumptions"]
      - [Operating or service revenue, Plant operations or recurring support, service contract, "No public pricing or service terms", unavailable, "Obtain operating model and recurring service economics"]
    notes: Public sources describe future projects and financing, not recognized revenue; null or undisclosed values are not zero.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Item, Price / contract model, List vs realized, Evidence status, Implication]
    rows:
      - [Alpha demonstration, Not disclosed, Not applicable, No public price, "Cannot estimate customer payback from the demonstration"]
      - [Stellaris plant, Not disclosed, Not applicable, No binding delivery price located, "Plant economics remain a future project-finance question"]
      - [Electricity, Not disclosed, Not applicable, No PPA or tariff disclosed, "No revenue yield can be modeled from public evidence"]
      - [Engineering / services, Not disclosed, Not applicable, No public rate card, "No basis for recurring-revenue assumptions"]
    notes: No public source in the assigned pool provides realized pricing, contract rates, or a signed offtake price.
    claimRefs: [CI002, CI003, CI004]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value / null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Latest reported financing, "€411M", medium, "Funds development but is not cash available after restrictions or spend", "Reconcile round proceeds, fees, earmarks, and cash balance"]
      - [Reported post-money valuation, "€2.4B", medium, "Sets the current venture underwriting reference point", "Obtain term sheet, fully diluted share count, and liquidation preferences"]
      - [Alpha construction estimate, "Approximately €2B", low, "Indicates potential scale of near-term capital need", "Obtain bottom-up budget, contingencies, and committed funding"]
      - [Private share of project costs, "Approximately 20%", medium, "Shows planned financing dependency under the MoU", "Confirm project scope, funding commitments, and trigger dates"]
      - [Burn rate / runway, null, unavailable, "Determines whether another financing is needed before milestones", "Obtain monthly cash burn, runway, hiring plan, and financing scenarios"]
      - [Gross margin / plant economics, null, unavailable, "Determines whether future projects can earn attractive returns", "Obtain cost of electricity, utilization, maintenance, and lifecycle model"]
    notes: Funding raised, valuation, project-cost estimates, and cash available are different quantities; undisclosed unit economics remain gaps rather than zeroes.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI010, CI011, CI012, CI013, CI014]
figures:
  - id: FI001
    title: From financing to potential revenue
    type: flow
    summary: Public capital supports development milestones before any disclosed commercial revenue or electricity output.
    data:
      nodes:
        - id: capital
          label: Equity and public support
          detail: "€411M financing reported; grants and project support are not equivalent to cash available"
        - id: alpha
          label: Alpha demonstrator
          detail: "Planned demonstration machine; net-energy target in the early 2030s"
        - id: stellaris
          label: Stellaris commercial plant
          detail: "Planned plant at Gundremmingen; no disclosed delivery contract or price"
        - id: revenue
          label: Future electricity or plant revenue
          detail: "No realized revenue, output, PPA, or tariff disclosed"
        - id: milestones
          label: Technical and regulatory milestones
          detail: "Net-energy, permitting, procurement, and commissioning gates remain ahead"
        - id: operations
          label: Operating cash flow
          detail: "Not yet demonstrated; depends on successful plant deployment and offtake"
      edges:
        - from: capital
          to: alpha
        - from: alpha
          to: stellaris
        - from: stellaris
          to: revenue
        - from: alpha
          to: milestones
        - from: milestones
          to: operations
    claimRefs: [CI001, CI005, CI010, CI014]
callouts:
  - calloutType: strength
    title: Financing and industrial support
    body: The July 2026 round and the RWE/Bavaria/IPP collaboration provide meaningful capital and execution-network evidence for the next development phase, although they do not establish project profitability.
    claimRefs: [CI005, CI006, CI008]
  - calloutType: risk
    title: Earnings visibility is absent
    body: No public source in the assigned pool discloses revenue, realized pricing, cash burn, runway, margin, or a binding offtake agreement; a valuation-to-revenue framework is therefore unavailable.
    claimRefs: [CI002, CI003, CI010, CI012]
  - calloutType: recommendation
    title: Underwrite to milestones, not multiples
    body: Financial diligence should condition additional capital on verified engineering milestones, a funded Alpha budget, and transparent cash and project-finance terms rather than assuming future plant revenue.
    claimRefs: [CI010, CI011, CI013, CI014]
