      - [Google, "Strategic investor", "Potential future data-center demand adjacency", "No disclosed pilot", "Investment reported", "Bloomberg says there are no set data-center plans"]
      - [Free State of Bavaria, "Public sponsor", "Siting and potential Alpha co-financing", "Public-support stage", "Potential contribution reported", "Conditional funding is not a customer purchase"]
      - [Max Planck IPP, "Scientific partner", "Plasma physics and scientific leadership for Alpha", "Research/development stage", "Named technical responsibility", "No paying-user or commercial outcome evidence"]
    notes: "This is a sample of public named relationships, not an exhaustive customer list; relationship evidence does not establish production use, retention, or revenue."
    claimRefs: [CU001, CU004, CU006, CU007, CU008, CU012, CU015]
