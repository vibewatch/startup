company:
  name: Proxima Fusion
chapter:
  number: 6
  title: Customers
  summary: >-
    Proxima Fusion has a specific institutional pathway around RWE, Bavaria, and
    Max Planck IPP, but the retained evidence shows partners, investors, and
    prospective demand rather than a paying customer base. No source establishes
    commercial power delivery, binding offtake, retention, or concentration metrics.
sections:
  - id: customer-boundary
    title: Counterparties are not yet customers
    body: >-
      Proxima's visible commercial ecosystem is best segmented by role rather than
      counted as a customer base. RWE is an industrial and financial partner expected
      to contribute power-plant experience; the Free State of Bavaria is a public
      co-financing and siting stakeholder; and Max Planck IPP is the scientific lead
      for Alpha. Fusion Energy News also describes RWE as a utility partner tied to a
      physical site, while Bloomberg reports that Google entered as a strategic
      investor. None of those relationships, as evidenced here, is a disclosed
      electricity purchase, plant-delivery contract, or paid production deployment.
      This distinction is material because logos and capital participation validate
      access to an industrial coalition, not recurring demand. The retained record
      therefore supports named counterparties and an addressable future-buyer thesis,
      but not a customer count or realized commercial adoption.
    claimRefs: [CU001, CU004, CU006, CU007, CU015]
    tableRefs: [TU001]
  - id: adoption-path
    title: Adoption is a milestone sequence
    body: >-
      Adoption currently means progressing a staged development program. The MOU
      begins with Alpha near IPP in Garching, where technologies are intended to be
      tested under real-world conditions, and only then advances to Stellaris at
      RWE's former Gundremmingen site. American Nuclear Society reports that Alpha is
      expected in the 2030s at an estimated cost of EUR2 billion, while Fusion Energy
      Base describes a 2031 Alpha target and commercial deployment in the late 2030s.
      Those dates are plans, not observed utilization. NucNet's newly fetched report
      says the 2026 financing backs the Alpha demonstrator near Munich, reinforcing
      that the near-term adoption object is a development asset rather than a
      production customer installation. Progress can be measured through siting,
      permitting, financing, construction, and technical validation, but the sources
      provide no operating output, customer usage, or repeat-purchase denominator.
    claimRefs: [CU002, CU003, CU005, CU012, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof
    title: Named relationship proof has uneven commercial weight
    body: >-
      RWE is the strongest industrial reference because its role spans project
      expertise, a former nuclear site, possible financing, and a reported EUR25
      million investment. Google is a weaker customer signal: Bloomberg identifies it
      as a strategic investor but says the companies have no set plans around data
      centers. Bavaria's potential co-financing and IPP's scientific leadership make
      the project more executable, yet neither is evidence of a paying power buyer.
      The named-proof record is therefore unusually concrete for a pre-commercial
      fusion developer but remains cooperation-stage. Even the RWE relationship is
      documented through an MOU and investment rather than a binding PPA, offtake, or
      delivered-plant acceptance. The table below preserves these relationship types
      so industrial participation is not promoted into customer revenue or a
      production outcome.
    claimRefs: [CU004, CU006, CU007, CU008, CU012, CU015]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability and concentration remain unobservable
    body: >-
      Customer durability cannot yet be measured from the assigned evidence. No
      retained source discloses NRR, GRR, churn, renewal, contract length, customer
      cohorts, satisfaction, or customer-level revenue concentration. Bloomberg
      states that commercial fusion plants do not yet exist and that Google has no
      set data-center plan with Proxima, while Denkstrom cautions that whether the
      development plan holds will only become clear by 2031. Financing is substantial
      but should not be read as demand: Bloomberg reported a EUR411 million round and
      said Proxima expected major remaining Alpha funding from Germany and the EU.
      Commercial exposure is consequently concentrated in a small coalition and a
      sequence of technical and public-financing milestones. Diligence should require
      signed offtake or plant contracts, stage-gated customer payments, termination
      rights, a probability-weighted buyer pipeline, and repeat-order evidence before
      assigning retention or expansion value.
    claimRefs: [CU009, CU010, CU011, CU014, CU016]
