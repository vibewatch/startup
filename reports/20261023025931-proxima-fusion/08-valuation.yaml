callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Treat Proxima as a strategically credible but pre-proof option: improve the call only
      after technical milestones, full-project financing, and private investment terms are
      visible, or after a materially lower risk-adjusted entry price.
    claimRefs: [CV012, CV014, CV015, CV016]
