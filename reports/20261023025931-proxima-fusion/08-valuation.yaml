company:
  name: Proxima Fusion
chapter:
  number: 8
  title: Valuation
  summary: >-
    Proxima Fusion's July 2026 financing establishes a €2.4 billion market mark and a
    substantial capital base, but public evidence does not support a fundamentals-based
    fair-value range before Alpha demonstrates net energy and its remaining funding stack
    is secured. The appropriate stance is track at high risk and treat any entry as a
    milestone-gated option rather than a conventional growth investment.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The recommendation is track, with medium confidence, high risk, and an expensive
      valuation stance. The €411 million round at a €2.4 billion valuation is corroborated
      by independent reporting and the company's transaction counsel, so the market mark
      is credible even though its underlying terms are private. What the mark does not
      establish is economic value: no commercial fusion plant is operating, and Proxima's
      own value-inflecting demonstrator remains a future milestone. Entry should therefore
      be contingent on price protection, visibility into preferences and governance, and
      technical evidence from the model coil and Alpha rather than on the prestige of the
      syndicate alone.
    claimRefs: [CV001, CV005, CV012, CV014, CV016]
    tableRefs: [TV001]
  - id: financing-thesis-and-relative-context
    title: Financing thesis and relative context
    body: >-
      Proxima has assembled unusually strong financing support for a European fusion
      developer: more than €650 million including €95 million of public grants, strategic
      participation from RWE and Google, and a private round tied to Bavaria's €400 million
      commitment. The proceeds have concrete industrial purposes, including the model coil
      and HTS cable and magnet capacity. Nevertheless, Alpha has been described as a roughly
      €2 billion project, so the latest round is only about 21% of that indicative cost and
      is not evidence that the complete program is funded. Helion's $15.5 billion mark shows
      that private fusion valuations can be much higher, but it is a peer financing reference,
      not an independent benchmark of Proxima's intrinsic value.
    claimRefs: [CV002, CV003, CV004, CV007, CV008, CV009, CV010, CV013]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-and-downside
    title: Scenario framework and downside
    body: >-
      A scenario approach is more defensible than a discounted cash-flow model because the
      assigned public evidence contains neither operating revenue nor the cash-flow inputs
      needed for a conventional valuation. In the bull case, timely model-coil execution,
      a fully financed Alpha, and net energy in the early 2030s would make today's mark a
      credible option on a commercial plant later in the decade. The base case assumes
      continued technical progress but additional capital and dilution before commercial
      proof. The bear case is a delay, funding gap, or failed milestone that forces a lower
      mark. These cases intentionally avoid unsupported probability percentages and precise
      valuation ranges.
    claimRefs: [CV003, CV006, CV009, CV011, CV012, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: diligence-and-thesis-breakers
    title: Final diligence asks and thesis-breakers
    body: >-
      Before investing, obtain the fully diluted cap table, liquidation preferences,
      anti-dilution provisions, governance rights, investor ownership, cash balance, burn,
      runway, committed grant drawdown schedule, and the sources and uses for Alpha. Technical
      diligence should inspect model-coil acceptance criteria, measured HTS performance,
      independent validation plans, and the critical path to net energy. The thesis breaks
      if the coil fails its acceptance tests, if the remainder of Alpha's funding cannot be
      committed on tolerable terms, or if the early-2030s net-energy milestone slips without
      a credible corrective plan. A verified milestone or materially better entry terms
      would improve the recommendation; publicity or another headline financing alone would
      not.
    claimRefs: [CV003, CV004, CV006, CV011, CV012, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Assessment, Investment implication]
    rows:
      - [Recommendation, Track, "Remain engaged but do not underwrite as a proven operating business."]
      - [Confidence, Medium, "The financing mark is corroborated; economic and private-term inputs are incomplete."]
      - [Risk rating, High, "Net energy, full project funding, and commercial operation remain future milestones."]
      - [Valuation stance, Expensive, "The €2.4B mark precedes demonstrated net energy and commercial revenue."]
      - [Entry discipline, "Milestone- and terms-gated", "Require technical proof, funding visibility, and downside protection."]
    notes: "Assessment as of 2026-10-23; valuation stance is analytical, while the financing amount and market mark are source-reported."
    claimRefs: [CV001, CV005, CV012, CV014, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Side, Evidence, What would change the view]
    rows:
      - [Thesis, "More than €650M secured, including €95M in public grants.", "Verified access to the complete Alpha funding stack would strengthen the thesis."]
      - [Thesis, "RWE and Google invested strategically; Bavaria committed public funding.", "Binding delivery, funding, or offtake obligations would strengthen commercial validation."]
      - [Thesis, "Capital is directed toward the model coil and HTS industrial capacity.", "Passing disclosed coil acceptance criteria would reduce execution risk."]
      - [Anti-thesis, "The €2.4B valuation precedes Alpha net energy and any commercial fusion operation.", "Independent Alpha results and bankable plant economics would weaken the anti-thesis."]
      - [Anti-thesis, "The latest round is about 21% of Alpha's indicative €2B cost.", "Committed non-dilutive or project financing for the remainder would reduce funding risk."]
    notes: "The approximately 21% ratio is a simple comparison of a €411M round with an approximately €2B project cost; it is not a runway estimate or proof that all round proceeds fund Alpha."
    claimRefs: [CV002, CV003, CV004, CV005, CV009, CV010, CV011, CV012, CV013]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation and return logic, Key risks, Probability signal]
    rows:
      - [Bull, "Model coil succeeds; Alpha is fully financed; net energy arrives in the early 2030s.", "Upside beyond the €2.4B mark is plausible but not quantifiable from public evidence.", "Schedule, integration, and plant-economics risk remain.", "Signal: verified technical milestones and committed financing; no numeric probability assigned."]
      - [Base, "Technical progress continues, but Alpha needs additional capital before commercial proof.", "The current mark requires option-value underwriting and implies future dilution risk.", "Capital intensity, private preferences, and milestone slippage.", "Signal: progress without independent net-energy proof; no numeric probability assigned."]
      - [Bear, "Coil or Alpha milestones slip, or the remaining funding stack is unavailable on acceptable terms.", "A down round or value impairment below the current mark becomes likely; magnitude is unsupported.", "Technical failure, financing gap, and loss of partner support.", "Signal: failed acceptance tests, funding delays, or timeline reset; no numeric probability assigned."]
    notes: "Scenario ranges and probabilities are left qualitative because public evidence lacks revenue, burn, cash, cap-table terms, and independently validated plant economics."
    claimRefs: [CV004, CV006, CV009, CV011, CV012, CV014, CV015, CV016]
