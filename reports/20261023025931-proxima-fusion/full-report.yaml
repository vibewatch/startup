      - number: '5.2'
        title: Architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The technical thesis is a stellarator whose three-dimensional external coils provide the confining field
              without relying on a large plasma current. That architecture is intended to support steady-state operation
              and avoid the disruption mode associated with tokamak plasma current, while QI optimization and HTS
              magnets seek higher field strength and a smaller plant footprint. The Stellaris paper and contemporaneous
              technical coverage describe a design that integrates electromagnetic, structural, thermal and neutronic
              analyses, but a design study is not an operating reactor. The strongest maturity evidence is therefore the
              peer-reviewed concept and the Wendelstein 7-X research lineage; the weakest links are the uncompleted SMC
              and Alpha demonstrations. Public sources also identify non-planar coil precision, divertor heat loads,
              tritium breeding, and neutron damage as engineering problems that remain relevant to commercial
              deployment.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE010
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Dependencies, trust and execution risk
        blocks:
          - type: paragraph
            body: >-
              The program's dependency stack is unusually broad: plasma physics and computational optimization must
              become manufacturable HTS magnet assemblies; those assemblies must survive thermal and neutron
              environments; the plant must then secure permitting, public support, supply-chain capacity and
              utility-grade construction. DOE background on stellarators confirms both the potential advantage of
              continuous confinement and the historical difficulty of manufacturing precise, complex coils. Independent
              MIT work reduces one specific concern about an instantaneous neutron-related REBCO current drop, including
              a Proxima researcher among the authors, but it does not resolve long-term degradation or the full reactor
              materials problem. Proxima's public evidence consequently supports a differentiated technical direction
              with credible research partners, not yet a demonstrated reliability, safety or cost position. The only
              developer-signal proxy in the assigned evidence is an ATS-derived hiring snapshot that displayed 52 open
              roles across Munich, Zurich and Gundremmingen. That signal is directionally consistent with hardware
              execution, but company-origin job listings do not provide a reproducible software benchmark, engineering
              release history or independent quality assessment.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated technical route
            body: >-
              Proxima combines QI stellarator physics, W7-X lineage and HTS magnet development into a distinct
              continuous-operation thesis.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
          - type: callout
            title: Hardware proof is the gating item
            body: >-
              The public record is strongest for the Stellaris design concept and weakest for integrated SMC, Alpha and
              long-duration plant-operation evidence.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE014
              - CE015
          - type: callout
            title: Underwrite milestones, not marketing
            body: >-
              Technical diligence should require reproducible magnet, plasma, heat-exhaust and materials test data
              before treating the commercial timeline as executable.
            calloutType: recommendation
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Counterparties are not yet customers
        blocks:
          - type: paragraph
            body: >-
              Proxima's visible commercial ecosystem is best segmented by role rather than counted as a customer base.
              RWE is an industrial and financial partner expected to contribute power-plant experience; the Free State
              of Bavaria is a public co-financing and siting stakeholder; and Max Planck IPP is the scientific lead for
              Alpha. Fusion Energy News also describes RWE as a utility partner tied to a physical site, while Bloomberg
              reports that Google entered as a strategic investor. None of those relationships, as evidenced here, is a
              disclosed electricity purchase, plant-delivery contract, or paid production deployment. This distinction
              is material because logos and capital participation validate access to an industrial coalition, not
              recurring demand. The retained record therefore supports named counterparties and an addressable
              future-buyer thesis, but not a customer count or realized commercial adoption.
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU015
      - number: '6.2'
        title: Adoption is a milestone sequence
        blocks:
          - type: paragraph
            body: >-
              Adoption currently means progressing a staged development program. The MOU begins with Alpha near IPP in
              Garching, where technologies are intended to be tested under real-world conditions, and only then advances
              to Stellaris at RWE's former Gundremmingen site. American Nuclear Society reports that Alpha is expected
              in the 2030s at an estimated cost of EUR2 billion, while Fusion Energy Base describes a 2031 Alpha target
              and commercial deployment in the late 2030s. Those dates are plans, not observed utilization. NucNet's
              newly fetched report says the 2026 financing backs the Alpha demonstrator near Munich, reinforcing that
              the near-term adoption object is a development asset rather than a production customer installation.
              Progress can be measured through siting, permitting, financing, construction, and technical validation,
              but the sources provide no operating output, customer usage, or repeat-purchase denominator.
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU012
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU005
              - CU011
              - CU014
              - CU015
              - CU016
      - number: '6.3'
        title: Named relationship proof has uneven commercial weight
        blocks:
          - type: paragraph
            body: >-
              RWE is the strongest industrial reference because its role spans project expertise, a former nuclear site,
              possible financing, and a reported EUR25 million investment. Google is a weaker customer signal: Bloomberg
              identifies it as a strategic investor but says the companies have no set plans around data centers.
              Bavaria's potential co-financing and IPP's scientific leadership make the project more executable, yet
              neither is evidence of a paying power buyer. The named-proof record is therefore unusually concrete for a
              pre-commercial fusion developer but remains cooperation-stage. Even the RWE relationship is documented
              through an MOU and investment rather than a binding PPA, offtake, or delivered-plant acceptance. The table
              below preserves these relationship types so industrial participation is not promoted into customer revenue
              or a production outcome.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU012
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
              - CU008
              - CU012
              - CU015
      - number: '6.4'
        title: Durability and concentration remain unobservable
        blocks:
          - type: paragraph
            body: >-
              Customer durability cannot yet be measured from the assigned evidence. No retained source discloses NRR,
              GRR, churn, renewal, contract length, customer cohorts, satisfaction, or customer-level revenue
              concentration. Bloomberg states that commercial fusion plants do not yet exist and that Google has no set
              data-center plan with Proxima, while Denkstrom cautions that whether the development plan holds will only
              become clear by 2031. Financing is substantial but should not be read as demand: Bloomberg reported a
              EUR411 million round and said Proxima expected major remaining Alpha funding from Germany and the EU.
              Commercial exposure is consequently concentrated in a small coalition and a sequence of technical and
              public-financing milestones. Diligence should require signed offtake or plant contracts, stage-gated
              customer payments, termination rights, a probability-weighted buyer pipeline, and repeat-order evidence
              before assigning retention or expansion value.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: A specific industrial pathway
            body: >-
              Named roles, a physical site, and reported strategic capital make the development coalition more concrete
              than an unsupported logo list.
            calloutType: strength
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU008
          - type: callout
            title: Capital and cooperation are not demand
            body: >-
              The evidence does not establish a paying buyer, commercial power delivery, customer retention, or
              diversified recurring demand.
            calloutType: risk
            claimRefs:
              - CU007
              - CU011
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk assessment
        blocks:
          - type: paragraph
            body: >-
              Proxima's risk profile is dominated by a long chain of technical and project milestones. Independent
              fusion assessments state that net energy has not yet been achieved, while commercial systems still need
              materials that survive sustained fusion conditions and a workable tritium supply. Proxima's public
              timetable places Alpha construction in 2027 and a net-energy demonstration target in 2031, which makes
              those milestones thesis-critical rather than routine execution steps. The available evidence supports a
              high residual exposure rating because the proposed mitigation is a development program, not an operating
              control. The key monitor is milestone evidence: a demonstrated high-field magnet, sustained plasma
              performance, and an independently reviewable Alpha schedule and budget. A missed milestone, material
              redesign, or materially higher capital requirement would weaken the commercial-plant thesis before revenue
              exists.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR009
              - CR013
      - number: '7.2'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Fusion regulation is developing, and the applicable pathway depends on jurisdiction and facility design.
              The UK draft EN-8 consultation describes a technology-agnostic planning framework for future fusion
              infrastructure, with environmental, safety, security, operational, and developmental considerations still
              subject to consultation and parliamentary steps. In the United States, the NRC's proposed framework would
              use a byproduct-material licensing pathway, but the agency identifies unresolved waste-classification,
              disposal, tritium-reporting, export-control, and state-federal compatibility questions. These are not
              evidence that Proxima is non-compliant; they show that a commercial fusion plant will require a
              project-specific permitting and waste strategy. Proxima's Bavaria and RWE memorandum identifies permitting
              and regulatory processes as joint workstreams, but a memorandum is not a license or development consent.
              The appropriate diligence test is a named permitting plan with decision dates, competent authorities,
              waste route, and public-consultation obligations.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Operational, supply-chain, and partner dependencies
        blocks:
          - type: paragraph
            body: >-
              Proxima's execution model depends on specialist suppliers, research institutions, an energy-company
              partner, and public funding. The Max Planck Institute describes high-temperature-superconductor coils as a
              central technical challenge and says the material is a brittle ceramic that must be applied to steel tapes
              and integrated into copper windings. The same account identifies tritium breeding, reactor-wall materials,
              waste disposal, and grid compatibility as unresolved industry-wide conditions. Proxima's planned division
              of labor gives IPP scientific oversight, Proxima engineering and construction responsibility, and RWE
              operating expertise, but it does not prove that the counterparties have committed final capital,
              performance guarantees, or supply capacity. A partner withdrawal, delayed magnet qualification, or
              unavailable tritium and materials supply could extend the timetable and increase burn. Monitoring should
              focus on executed agreements, supplier qualification, magnet test results, and a funded procurement
              schedule.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Thesis-break triggers and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The investment case should be treated as a staged option on technical proof, not as a forecast of
              near-term operating cash flow. Public reporting describes a €2.4 billion valuation and more than €650
              million raised, but the sources do not disclose burn, runway, ownership, liquidation preferences, or the
              portion of capital that is restricted to milestones. That opacity is a financial-model risk: funding is
              not cash available for all uses, and a large round does not establish an economic return. The practical
              kill criteria are measurable: no independently reviewable high-field magnet result by the stated program
              milestone; no credible Alpha cost and permitting baseline before construction; inability to identify a
              tritium and activated-materials disposal route; or failure to secure binding commercial counterparties
              beyond an MoU. Until those tests are met, the residual exposure remains high and the principal diligence
              ask is primary evidence of schedule, budget, licensing, and counterparties.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Core residual exposure
            body: >-
              The company-specific program is still a sequence of unproven technical, regulatory, and financing gates;
              the strongest public mitigation evidence is institutional collaboration, not completed commercial
              validation.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR009
              - CR013
          - type: callout
            title: Evidence boundary
            body: >-
              No assigned source establishes a final German permit, binding off-take, audited cash runway, or
              independently verified Alpha net-energy result; these remain explicit diligence gaps.
            calloutType: assumption
            claimRefs:
              - CR008
              - CR013
              - CR014
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track, with medium confidence, high risk, and an expensive valuation stance. The
              €411 million round at a €2.4 billion valuation is corroborated by independent reporting and the company's
              transaction counsel, so the market mark is credible even though its underlying terms are private. What the
              mark does not establish is economic value: no commercial fusion plant is operating, and Proxima's own
              value-inflecting demonstrator remains a future milestone. Entry should therefore be contingent on price
              protection, visibility into preferences and governance, and technical evidence from the model coil and
              Alpha rather than on the prestige of the syndicate alone.
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Financing thesis and relative context
        blocks:
          - type: paragraph
            body: >-
              Proxima has assembled unusually strong financing support for a European fusion developer: more than €650
              million including €95 million of public grants, strategic participation from RWE and Google, and a private
              round tied to Bavaria's €400 million commitment. The proceeds have concrete industrial purposes, including
              the model coil and HTS cable and magnet capacity. Nevertheless, Alpha has been described as a roughly €2
              billion project, so the latest round is only about 21% of that indicative cost and is not evidence that
              the complete program is funded. Helion's $15.5 billion mark shows that private fusion valuations can be
              much higher, but it is a peer financing reference, not an independent benchmark of Proxima's intrinsic
              value.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV009
              - CV012
              - CV014
      - number: '8.3'
        title: Scenario framework and downside
        blocks:
          - type: paragraph
            body: >-
              A scenario approach is more defensible than a discounted cash-flow model because the assigned public
              evidence contains neither operating revenue nor the cash-flow inputs needed for a conventional valuation.
              In the bull case, timely model-coil execution, a fully financed Alpha, and net energy in the early 2030s
              would make today's mark a credible option on a commercial plant later in the decade. The base case assumes
              continued technical progress but additional capital and dilution before commercial proof. The bear case is
              a delay, funding gap, or failed milestone that forces a lower mark. These cases intentionally avoid
              unsupported probability percentages and precise valuation ranges.
            claimRefs:
              - CV003
              - CV006
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV006
              - CV009
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              Before investing, obtain the fully diluted cap table, liquidation preferences, anti-dilution provisions,
              governance rights, investor ownership, cash balance, burn, runway, committed grant drawdown schedule, and
              the sources and uses for Alpha. Technical diligence should inspect model-coil acceptance criteria,
              measured HTS performance, independent validation plans, and the critical path to net energy. The thesis
              breaks if the coil fails its acceptance tests, if the remainder of Alpha's funding cannot be committed on
              tolerable terms, or if the early-2030s net-energy milestone slips without a credible corrective plan. A
              verified milestone or materially better entry terms would improve the recommendation; publicity or another
              headline financing alone would not.
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Treat Proxima as a strategically credible but pre-proof option: improve the call only after technical
              milestones, full-project financing, and private investment terms are visible, or after a materially lower
              risk-adjusted entry price.
            calloutType: recommendation
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
