      - number: '4.3'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Financial underwriting is currently milestone-based rather than earnings-based. The strongest public
              evidence supports capital availability for the next development phase and a credible industrial
              consortium, but not a validated margin path or commercial payback. The Alpha target is to demonstrate net
              energy in the early 2030s, and the published technical discussion says a magnetic-confinement plant would
              need approximately Q=10 to generate electricity; neither is a revenue or cash-flow forecast. The most
              decision-relevant gaps are actual burn and runway, Alpha's binding budget and funding sources, procurement
              and cost-overrun exposure, the commercial contracting path after demonstration, and independent validation
              of the technical milestones. Until those are disclosed, the appropriate financial stance is to treat the
              €2.4 billion valuation as venture option value exposed to financing and execution risk, not as a multiple
              of current revenue.
