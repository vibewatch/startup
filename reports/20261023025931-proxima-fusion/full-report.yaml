  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Proxima's product is not a delivered electricity service yet; it is a staged fusion-power-plant
              development program. The proposed workflow starts with a research-backed QI stellarator design, advances
              through a Stellarator Model Coil demonstration and the Alpha demonstration machine, and then targets
              Stellaris as a commercial plant. The public plan assigns Proxima engineering, procurement and construction
              responsibility, IPP plasma-physics leadership, RWE power-plant expertise, and Bavaria permitting and
              funding support. This creates a credible division of work for a first-of-kind asset, but it also means
              value delivery depends on coordinated partners, public approvals and technology milestones rather than a
              repeatable software deployment. The February 2026 agreement describes Alpha as a net-energy validation
              step and Stellaris as the later grid asset; it is therefore evidence of an operating model and development
              pathway, not proof of commercial output or contracted revenue.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
