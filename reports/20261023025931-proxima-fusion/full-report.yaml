  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic alternatives
        blocks:
          - type: paragraph
            body: >-
              Proxima's relevant landscape is broader than other stellarators. Direct technical peers include Type One
              Energy and Thea Energy, both pursuing stellarators, while Commonwealth Fusion Systems and Tokamak Energy
              represent tokamak alternatives with substantial high-temperature-superconductor experience. Helion and TAE
              use field-reversed configurations; Marvel Fusion and Focused Energy use laser-driven inertial confinement;
              General Fusion pursues a magnetized-target hybrid. TechCrunch reports that CFS had raised $3.94 billion by
              July 2026 and that Helion had raised $3.2 billion, while Type One had raised $174.5 million and Thea $120
              million. These figures are reported funding, not comparable technical maturity or cash available. Thea's
              pixel-like magnet approach, Type One's utility-oriented model, and CFS's planned 400-megawatt Arc show
              that buyers may eventually choose among reactor architectures and commercial models, not merely among
              vendors selling the same product.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
