chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Proxima Fusion was founded in 2023 as the first spin-out from the Max Planck Institute for Plasma Physics
              and is headquartered in Munich, with additional locations in Zurich and Oxford. It is developing
              quasi-isodynamic stellarators that pair computationally optimized confinement with high-temperature
              superconducting magnets. Alpha is the planned net-energy demonstrator, while Stellaris is the planned
              commercial power plant. The available evidence therefore describes a capital-intensive technology
              developer building machines, manufacturing capability, and industrial partnerships; it does not establish
              current electricity sales, a commercial operating plant, or a disclosed revenue base. The scientific
              lineage is credible, but the business remains dependent on translating research into qualified hardware
              and eventually bankable generation assets.
