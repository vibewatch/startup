  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer system
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the development and eventual operation of fusion power plants that can deliver
              continuous, low-carbon electricity to grids and large industrial loads. It includes reactor concept
              engineering, magnets, manufacturing systems, demonstration facilities, licensing, plant construction, and
              later electricity generation. It excludes general nuclear fission generation, generic renewable capacity,
              and the broader energy market except where those alternatives set the buyer's opportunity cost. The
              immediate spend pool is therefore project and public R&D capital, not today's utility electricity revenue.
              Proxima's own description says the €411 million financing will build Alpha and validate technologies for
              later commercial deployment, while the market-facing construction account places the planned commercial
              plant in the late 2030s. The status quo for a prospective buyer is a portfolio of renewables, storage,
              fission where available, gas or other firm generation, and demand-management contracts. Fusion competes on
              the promise of firm, continuous output, but it has not yet demonstrated sustained net electricity
              production at commercial scale. The buyer chain is consequently staged: governments and research
              institutions fund enabling work; utilities, site owners, and industrial partners fund and host
              demonstrations; and utilities, data-center operators, and industrial offtakers would ultimately buy
              dependable power. No retained source documents a binding Proxima PPA or plant delivery contract, so
              current partner and site signals should not be treated as contracted demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM010
              - CM013
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              A single top-down energy number would overstate Proxima's present addressable market. The evidence
              supports several nested but non-equivalent lenses. First, the global nuclear market is reported at $382.4
              billion in 2024 and projected at $754.2 billion by 2030 at 12% annual growth, although commercial fusion
              is explicitly not yet included in that estimate. Second, public funding is becoming a deployable market
              input: Germany's federal government pledged more than €2 billion for fusion research and pilot projects
              through 2029, while Bavaria announced up to €400 million for fusion projects and the EURATOM 2026–2027
              programme allocates €222 million to move fusion from lab to grid. Third, the adjacent load signal is
              material: BloombergNEF reports nearly $750 billion of 2026 capex by 14 large public data-center operators,
              23.1 GW of capacity under construction, and data-center developers representing 72% of corporate
              clean-power procurement in the Americas in 2025. These are opportunity indicators, not Proxima revenue
              forecasts. Proxima's constrained near-term SAM is the subset of European public-private demonstration and
              first-plant programmes that can use a stellarator architecture; the sources do not provide a defensible
              euro-denominated SAM or SOM for that subset. The missing conversion from project pipeline to awarded
              contracts is therefore a material diligence gap.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
