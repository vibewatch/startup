        title: Financing, scale, and strategic backing
        blocks:
          - type: paragraph
            body: >-
              On 7 July 2026, Proxima announced a €411 million financing at a stated €2.4 billion valuation. XTX
              Ventures and East X Ventures led the round; Google and RWE joined as strategic investors. Proxima and an
              investor release said cumulative public and private funding exceeded €650 million, including €95 million
