              - CM010
              - CM016
      - number: '2.3'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The strongest demand driver is the strategic value of firm, low-carbon electricity under electrification
              and AI-load growth. Public sources describe fusion as a technology priority for energy security and
              industrial competitiveness, and the BMFTR material explicitly organizes support around magnetic fusion,
              laser fusion, and fuel-cycle/materials hubs. Proxima's stellarator thesis adds a buyer proposition that
              continuous operation could be better suited to power generation than pulsed tokamaks, but the advantage
              remains a technical hypothesis until Alpha validates net energy. Adoption constraints are unusually
              binding: Alpha is targeted for 2031, commercial deployment is described for the late 2030s, and the
              public-policy sources state that fusion remains experimental and may be decades from commercial use.
              Capital intensity, licensing, supply chain scale-up, intellectual-property governance, and access to
              public funding all affect timing; Noerr notes that IP and exploitation strategies are evaluation criteria
              in German fusion funding. Buyer trust must therefore be earned through repeatable engineering and
              regulatory milestones rather than a market-size narrative. Valuation is exposed to milestone slippage and
              financing dependence: the €2.4 billion valuation is a financing mark, not evidence of revenue or an
              awarded power contract. The central commercial question is whether Proxima can convert public-private
              enthusiasm into a licensed, financed plant and then into bankable offtake.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is real but staged
            body: >-
              Proxima's investable market today is fusion development infrastructure and public- private project
              formation; the much larger electricity market is contingent on technical demonstration, licensing,
              financing, and contracted offtake.
