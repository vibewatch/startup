              The five-person founding team spans plasma physics, stellarator science, engineering, and assembly.
              Proxima's current company page places co-founders in the CEO, external-affairs, chief-scientist,
              chief-engineer, and assembly leadership roles, while public profiles show that some titles have changed as
              the organization scaled. This concentration aligns the founders closely with the technical roadmap, but it
