      - number: '3.2'
        title: Capability, distribution, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              The core capability trade-off is continuous operation versus engineering complexity. IEEE Spectrum states
              that stellarators can operate continuously without a strong internal plasma current, whereas their twisted
              coils are notoriously difficult to design and build. That is a potential operating advantage, not a
              demonstrated levelized-cost advantage. CFS's tokamak route has a simpler magnetic geometry and a much
              larger reported capital base, while Type One proposes selling key technology to utilities that build, own,
              and operate plants. Proxima's distribution position is strengthened by its Max Planck heritage and the RWE
              relationship, but those relationships do not equal a binding off-take contract. For buyers, the decision
              will also depend on plant delivery risk, regulatory and site execution, fuel-cycle and materials supply,
              and whether a vendor can provide credible grid-scale components. Thea's software-controlled magnet concept
              could reduce stellarator manufacturing burden, creating a direct commoditization or design substitution
              risk.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Proxima has a credible ecosystem moat but not yet a proven commercial moat. The Max Planck and Wendelstein
              7-X connection supplies scientific provenance, and the company has raised €411 million at a reported
              valuation above €2.4 billion, giving it resources to pursue Alpha. Yet independent evidence still
              describes the field as pre-commercial: Undark quotes a Lawrence Livermore plasma physicist saying no
              company or entity has built a fusion reactor or grid-scale components reaching the proposed power levels.
              The same reporting notes that private companies have not claimed scientific breakeven, and that even
              breakeven would remain multiple technical and financial steps from a full power plant. Proxima's
              differentiation therefore remains conditional on proving magnet manufacturing, heat removal, continuous
              operation, tritium handling, and plant economics before a rival closes the gap. The relevant adverse
              benchmark is not that another reactor has already won, but that the whole sector may remain dependent on
              public capital, long timelines, and unresolved engineering constraints.
            claimRefs:
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP010
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate reported scale from technical claims and use unknowns where the assigned evidence
              does not establish a comparable price, customer contract, or realized power output. Ordinal positioning is
              analytical and should not be read as a measured performance ranking. They also make the comparison
              boundary explicit: funding is a resource proxy, not proof of reactor performance; a planned customer
              relationship is not a binding off-take; and a status-quo fission plant is a substitute benchmark rather
              than a like-for-like technology peer. This prevents the matrix from converting heterogeneous claims into a
              false precision ranking.
            claimRefs:
              - CP002
              - CP006
              - CP010
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architecture and ecosystem differentiation
            body: >-
              Proxima combines a stellarator architecture with Max Planck/Wendelstein provenance and an RWE-linked
              industrial pathway; these are meaningful access and credibility advantages while the sector remains
              pre-commercial.
            calloutType: strength
            claimRefs:
              - CP006
              - CP011
          - type: callout
            title: Engineering complexity and sector-wide execution risk
            body: >-
              Stellarators may support continuous operation, but twisted coils are difficult to design and build, and
              independent reporting says no company has yet built grid-scale fusion components at the proposed power
              levels.
            calloutType: risk
            claimRefs:
              - CP007
              - CP012
          - type: callout
            title: Competition is a portfolio of architectures
            body: >-
              The relevant threat set spans tokamak, field-reversed, laser, hybrid, stellarator, and fission
              alternatives; a single peer ranking would conceal different technical and commercialization risks.
            calloutType: insight
            claimRefs:
