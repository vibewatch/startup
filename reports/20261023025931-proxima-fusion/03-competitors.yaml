      - [Type One Energy, Build-own-operate or technology sale to utilities, null, Utility ownership and plant integration, Could broaden procurement options]
      - [Commonwealth Fusion Systems, Future Arc power plant with stated output buyer, null, "Scale, HTS supply chain, and Google relationship", Strong capital and distribution benchmark]
      - [Helion, Future plant with Microsoft as reported first customer, null, Direct-electricity architecture and customer-specific deployment, High upside with high schedule risk]
