    notes: "The sources do not disclose comparable list prices, realized power purchase prices, or binding commercial terms. Packaging and switching observations are qualitative implications of the described business models."
    claimRefs: [CP002, CP008, CP009, CP010, CP015]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: The map uses evidence-backed ordinal coordinates to distinguish technical continuity potential from commercialization capital and distribution power; it is not a measured performance ranking.
    data:
      xAxis: "Commercialization capital and distribution power (ordinal)"
      yAxis: "Continuous-operation potential (ordinal)"
      points:
        - {label: Proxima Fusion, x: 7, y: 9, note: "Stellarator architecture, €411M round, Max Planck/RWE ecosystem"}
        - {label: Type One Energy, x: 4, y: 9, note: "Stellarator and TVA utility pathway; $174.5M reported"}
        - {label: Thea Energy, x: 3, y: 8, note: "Stellarator software/magnet approach; $120M reported"}
        - {label: Commonwealth Fusion Systems, x: 10, y: 5, note: "$3.94B reported and Google/Arc distribution; tokamak architecture"}
        - {label: Helion, x: 9, y: 4, note: "$3.2B reported and Microsoft customer claim; field-reversed configuration"}
        - {label: Fission status quo, x: 10, y: 10, note: "Existing continuous-generation infrastructure; not a fusion competitor"}
    approximationNotes: "Coordinates are analyst-authored ordinal scores from 1 to 10 based on the cited architecture, funding, partner, and customer evidence; they are not measured performance or bankability metrics."
    claimRefs: [CP001, CP002, CP006, CP008, CP009, CP015]
callouts:
  - calloutType: strength
    title: Architecture and ecosystem differentiation
    body: Proxima combines a stellarator architecture with Max Planck/Wendelstein provenance and an RWE-linked industrial pathway; these are meaningful access and credibility advantages while the sector remains pre-commercial.
    claimRefs: [CP006, CP011]
  - calloutType: risk
    title: Engineering complexity and sector-wide execution risk
    body: Stellarators may support continuous operation, but twisted coils are difficult to design and build, and independent reporting says no company has yet built grid-scale fusion components at the proposed power levels.
    claimRefs: [CP007, CP012]
  - calloutType: insight
    title: Competition is a portfolio of architectures
    body: The relevant threat set spans tokamak, field-reversed, laser, hybrid, stellarator, and fission alternatives; a single peer ranking would conceal different technical and commercialization risks.
    claimRefs: [CP001, CP004, CP005, CP015]
