company:
  name: Proxima Fusion
chapter:
  number: 3
  title: Competitors
  summary: Proxima competes in a crowded fusion race, with its quasi-isodynamic stellarator differentiated by continuous-operation potential but exposed to harder manufacturing and an unproven commercial scale-up. The strongest evidence points to a technology-class competition rather than a single peer market, with tokamak, field-reversed, inertial, hybrid, and status-quo fission alternatives all relevant.
sections:
  - id: competitive-landscape
    title: Landscape and strategic alternatives
    body: >-
      Proxima's relevant landscape is broader than other stellarators. Direct technical peers
      include Type One Energy and Thea Energy, both pursuing stellarators, while Commonwealth
      Fusion Systems and Tokamak Energy represent tokamak alternatives with substantial
      high-temperature-superconductor experience. Helion and TAE use field-reversed
      configurations; Marvel Fusion and Focused Energy use laser-driven inertial confinement;
      General Fusion pursues a magnetized-target hybrid. TechCrunch reports that CFS had raised
      $3.94 billion by July 2026 and that Helion had raised $3.2 billion, while Type One had
      raised $174.5 million and Thea $120 million. These figures are reported funding, not
      comparable technical maturity or cash available. Thea's pixel-like magnet approach,
      Type One's utility-oriented model, and CFS's planned 400-megawatt Arc show that buyers
      may eventually choose among reactor architectures and commercial models, not merely
      among vendors selling the same product.
    claimRefs: [CP001, CP002, CP003, CP004, CP005]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-buyer-comparison
    title: Capability, distribution, and buyer trade-offs
    body: >-
      The core capability trade-off is continuous operation versus engineering complexity.
      IEEE Spectrum states that stellarators can operate continuously without a strong internal
      plasma current, whereas their twisted coils are notoriously difficult to design and build.
      That is a potential operating advantage, not a demonstrated levelized-cost advantage.
      CFS's tokamak route has a simpler magnetic geometry and a much larger reported capital
      base, while Type One proposes selling key technology to utilities that build, own, and
      operate plants. Proxima's distribution position is strengthened by its Max Planck
      heritage and the RWE relationship, but those relationships do not equal a binding
      off-take contract. For buyers, the decision will also depend on plant delivery risk,
      regulatory and site execution, fuel-cycle and materials supply, and whether a vendor can
      provide credible grid-scale components. Thea's software-controlled magnet concept could
      reduce stellarator manufacturing burden, creating a direct commoditization or design
      substitution risk.
    claimRefs: [CP006, CP007, CP008, CP009, CP010]
    tableRefs: [TP002]
  - id: durability-and-displacement
    title: Moat durability and displacement risk
    body: >-
      Proxima has a credible ecosystem moat but not yet a proven commercial moat. The Max Planck
      and Wendelstein 7-X connection supplies scientific provenance, and the company has raised
      €411 million at a reported valuation above €2.4 billion, giving it resources to pursue
      Alpha. Yet independent evidence still describes the field as pre-commercial: Undark quotes
      a Lawrence Livermore plasma physicist saying no company or entity has built a fusion
      reactor or grid-scale components reaching the proposed power levels. The same reporting
      notes that private companies have not claimed scientific breakeven, and that even
      breakeven would remain multiple technical and financial steps from a full power plant.
      Proxima's differentiation therefore remains conditional on proving magnet manufacturing,
      heat removal, continuous operation, tritium handling, and plant economics before a rival
      closes the gap. The relevant adverse benchmark is not that another reactor has already won,
      but that the whole sector may remain dependent on public capital, long timelines, and
      unresolved engineering constraints.
    claimRefs: [CP011, CP012, CP013, CP014, CP015, CP016]
    tableRefs: [TP003]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate reported scale from technical claims and use unknowns where the
      assigned evidence does not establish a comparable price, customer contract, or realized
      power output. Ordinal positioning is analytical and should not be read as a measured
      performance ranking. They also make the comparison boundary explicit: funding is a
      resource proxy, not proof of reactor performance; a planned customer relationship is not
      a binding off-take; and a status-quo fission plant is a substitute benchmark rather than
      a like-for-like technology peer. This prevents the matrix from converting heterogeneous
      claims into a false precision ranking.
    claimRefs: [CP002, CP006, CP010, CP014]
