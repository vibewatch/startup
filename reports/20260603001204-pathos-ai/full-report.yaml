      - number: '4.3'
        title: Cost Structure, Burn Benchmarks, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Public unit economics for Pathos are mostly unavailable, so the chapter uses a biotech-first benchmark set
              rather than forcing SaaS metrics. The likely cost buckets are straightforward: ongoing clinical execution
              for pocenbrodib, preparation of additional assets such as P-500 and DO-2, payments tied to data and model
              development, and the core operating expense of maintaining a discovery and clinical-development
              organization. Oncology trial literature helps explain why burn can remain elevated even before
              commercialization. Reviews of clinical-trial economics emphasize that activation delays, weak accrual, and
              fragmented infrastructure can absorb substantial budgets, while public oncology trial-accrual evidence
              shows that slower enrollment directly prolongs time to readout and therefore the financing window.

              Public comparables reinforce the capital-intensity point. Relay disclosed roughly $710 million of cash in
              Q1 2025 with runway into 2029, then still reported $642.1 million of cash in Q1 2026 after relying on ATM
              issuance. Schrödinger, which already has software revenue and partnered discovery economics, still
              reported $406 million of cash and a $60 million quarterly net loss in Q1 2026. Insilico reported $393.3
              million of cash and $56.2 million of 2025 revenue, demonstrating that AI-enabled discovery companies can
              remain capital dependent even after they have built more explicit commercial revenue streams than Pathos
              has disclosed. Taken together, these benchmarks support a reasonable public burn range of roughly $120
              million to $240 million annually for a company attempting to run a platform-plus-pipeline model in
              oncology. On that basis, the Series D alone looks substantial but not excessive.
