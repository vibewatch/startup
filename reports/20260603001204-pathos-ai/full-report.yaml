  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Stage
        blocks:
          - type: paragraph
            body: >-
              Pathos AI, Inc. is a clinical-stage artificial intelligence and biotechnology company incorporated in
              Delaware and headquartered at 600 W. Chicago Ave., Suite 510, Chicago, Illinois 60654. The company's SEC
              CIK is 0001967854 and its IRS EIN is 852945509. Pathos was founded in 2022 at the intersection of
              technology, oncology, and lived cancer experience. Its official website is www.pathos.com and its fiscal
              year end is December 31.

              The company's stated mission is to transform drug development using proprietary patient data and AI to
              dramatically improve trial success rates and bring new therapies to patients who fail traditional
              treatments. Pathos describes itself as an AI-enabled biotechnology company focused on re-engineering drug
              development by leveraging AI technologies, multimodal real-world data, and patient-derived biological
              models. As of the run date, Pathos is a clinical-stage company with its lead program, pocenbrodib, in an
              active Phase 1b/2a clinical trial, and a pipeline that spans three additional oncology assets. No public
              employee count has been disclosed.

              Pathos defines its competitive differentiation as the combination of the largest proprietary multimodal
              oncology dataset (claimed at over 200 petabytes linked to patient outcomes) and a continuously learning AI
              platform—distinguishing it from both pure computational AI companies and traditional pharma acquirers. The
              company emphasizes that each completed trial feeds the next, creating a learning flywheel that compounds
              efficiency and evidence quality.
