            title: Tempus-AstraZeneca partnership is both the largest single cost item and strategic moat
            body: >-
              The $200 million in fees payable to Tempus AI under the April 2025 collaboration agreement is a
              significant cash commitment, likely absorbing a material portion of the Series D proceeds. At the same
              time, the resulting shared foundation model — co-owned by Pathos, Tempus, and AstraZeneca — represents a
              proprietary data and model advantage that could be difficult for later entrants to replicate. The net
              effect depends on the IP licensing terms and exclusivity scope, which are not publicly disclosed.
