            body: >-
              Pathos’ technical edge is also its biggest dependency stack. The Tempus and AstraZeneca collaboration is
              strategically attractive because it expands Pathos beyond its own internal data footprint, but it also
              creates material counterparty risk. Publicly, Pathos is leaning on Tempus for de-identified oncology data,
              enterprise-scale multimodal infrastructure, and — through the TIME Network case study — even measurable
              help with trial enrollment. That concentration is not automatically bad, but it means the path from model
              to clinical execution is not fully controlled by Pathos alone. If the collaboration economics, data
              rights, or delivery priorities change, some of the public technology thesis changes with it.


              The reviewed public materials also stop short of the governance depth an institutional investor would
              ideally want. HHS reminds covered entities that even properly de-identified health data retains some
              residual re-identification risk, while NCI and multiple oncology AI reviews emphasize that biomarker
              workflows, consent, privacy, and model reliability remain non-trivial barriers to scaled adoption. The
              ASCO Post and Springer review are especially relevant because they push on liability, consent,
              explainability, and training-data quality — exactly the categories that become acute when a platform
              influences asset selection or trial design. Pathos’ recruiting surface shows technical hiring and basic
              anti-fraud controls, but the company does not publicly surface a trust center, uptime history, public
              model cards, or validated platform KPI dashboards. For diligence, that means the control story is
              directionally plausible but still under-documented.
