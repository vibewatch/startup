      - number: '2.3'
        title: Buyer and Segment Landscape
        blocks:
          - type: paragraph
            body: >-
              The primary buyers of oncology AI data and drug discovery platforms are large pharmaceutical companies,
              which allocate multi-year data licensing and platform fees through Chief Digital Officers and VP-level R&D
              leadership. Commercial-scale evidence is strong: Tempus AI reported Q1 2026 revenue of $348.1M (+36.1%
              YoY) with full-year 2026 guidance of $1.59-1.60B, including multi-year strategic collaborations with
              Merck, Gilead, AstraZeneca, and others for enterprise oncology AI data access. Caris Life Sciences
              reported Q1 2026 revenue of $216.2M (+79% YoY) with 52,800 clinical profiling cases and 1.07M+ total
              profiles in its database, demonstrating a large clinical install base paying for molecular profiling
              services. Together Tempus and Caris imply an annualized combined oncology data services market of
              approximately $2.3B, anchoring the realistic commercial scale. ConcertAI, another oncology RWE platform,
              raised $150M at ~$1.9B valuation in June 2024, while Roche's 2018 acquisition of Flatiron Health for
              ~$1.9B set an earlier precedent for biopharma willingness to pay premium prices for oncology RWD
              platforms. Mid-size oncology biotechs represent a second-tier buyer segment, using AI to extend limited
              capital by improving asset selection and trial design efficiency. Academic cancer centres are volume
              buyers of data platforms through grant-funded agreements but rarely generate commercial-scale contracts.
              Community oncology networks and payers (insurance) are emerging buyers for AI navigation services — Humana
              partnered with Thyme Care in 2025 — but remain peripheral to Pathos AI's current sales motion. Pathos AI
              claims 200+ petabytes of multimodal data (~50× TCGA), though this figure appears exclusively in company
              materials with no independent verification, making dataset differentiation claims difficult to assess.
              Pharma R&D budget allocation is the critical gating factor; multi-year enterprise agreements are the
              demonstrated model, with budget lines in R&D (not COGS) and chief digital or AI officers controlling
              vendor selection.
