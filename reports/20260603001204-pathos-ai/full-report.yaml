      - number: '1.3'
        title: Capital History, Valuation, and Investor Map
        blocks:
          - type: paragraph
            body: >-
              Pathos AI has raised approximately $467 million across four disclosed financing events. An initial $40
              million was raised under a March 2023 Form D (SEC filing number 021-474736) to fund platform development
              and the first asset acquisition. The company then closed an oversubscribed $62 million Series C in October
              2024, led by New Enterprise Associates, at a $600 million post-money valuation; at that time total funding
              was reported as $102 million, confirming the $40 million pre-Series C figure. The Series D raised $365
              million as announced May 15, 2025, bringing the post-money valuation to approximately $1.6 billion. The
              corresponding May 1, 2025 Form D shows a total offering of $399,999,933 with $282,999,950 sold to 11
              investors at that filing date, consistent with the announced amount allowing for subsequent closes.

              The identities of Series D investors have not been disclosed publicly. Pathos has confirmed the round
              included a mix of returning backers and new investors. The Series C investor base (NEA, Revolution Growth,
              Lightbank, Builders VC) is the most fully documented group. The $200 million paid to Tempus AI under the
              April 2025 foundation model collaboration agreement represents a material related-party commercial
              transaction that requires separate diligence—it flows from Pathos to Tempus as a counterparty, not as an
              equity payment.

              No debt financing, secondaries, or credit facilities have been publicly disclosed. Pathos remains private
              and is classified as private-undisclosed given it shares no financial statements.
