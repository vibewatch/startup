  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk overview: Pathos carries concentrated partner, governance, and early-clinical risk'
        blocks:
          - type: paragraph
            body: >-
              Pathos is not yet risky in the way a late-stage biotech is risky; it is risky in the way a concentrated
              AI-native oncology operating model is risky. The company is attempting to combine external data rights,
              model-building, biomarker logic, asset transactions, and trial execution into a self-improving system.
              That structure creates upside, but it also concentrates multiple failure modes in the same operating
              chain. If partner data rights narrow, if biomarker logic fails to generalize, if trial enrollment stalls,
              or if governance standards fall short, the system can break at several points before revenue or pivotal
              efficacy ever arrives. The risk heatmap therefore places data-rights concentration, legal and consent
              uncertainty, early-clinical execution, and financing dependence near the top of the register.


              This is not a purely theoretical concern. The public record already shows heavy dependence on Tempus for
              data scale and trial-enablement, multiple acquired or licensed assets that still require integration and
              prioritization, and sparse public governance detail about how PathOS outputs are validated before they
              influence decisions. Because the company remains private, investors do not yet get the risk-factor density
              that a public precision-oncology company would provide. The right posture is to assume residual risk
              remains high until private diligence materials prove otherwise.
