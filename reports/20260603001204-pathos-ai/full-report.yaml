      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses'
        blocks:
          - type: paragraph
            body: >-
              Market sizing for Pathos AI's addressable opportunity requires disaggregating overlapping publisher
              estimates across several distinct markets. IQVIA's Global Oncology Trends 2025 reports global oncology
              medicine spending at $252B in 2024, forecast at $441B by 2029 at approximately 11.9% CAGR — this
              represents the total oncology economy within which AI platform services compete for a fraction of R&D
              budget. MarketsandMarkets sizes the dedicated AI in oncology market at $2.45B in 2024 growing to $11.52B
              by 2030 at 29.4% CAGR, encompassing drug discovery, diagnostics, clinical decision support, and imaging AI
              across a single broad boundary. The drug discovery technologies market (including AI as one segment) is
              separately estimated at $30.58B in 2025, projected at $51.51B by 2030 at 11.0% CAGR (MarketsandMarkets,
              January 2026). Mordor Intelligence sizes the RWE solutions market at $2.44B globally in 2025 with oncology
              commanding 34.65% of sector share — implying an oncology RWE segment of approximately $846M in 2025
              growing at 16.33% CAGR to $6.04B by 2031 (total market). The precision diagnostics and medicine market
              reached $145.53B in 2024 (MarketsandMarkets), while the NGS market stood at $12.98B in 2023 growing at
              18.3% CAGR (Allied Market Research) — both indicating the data-substrate markets on which AI drug
              discovery depends are themselves expanding rapidly. These estimates carry significant uncertainty:
              publishers apply different boundary definitions, no analyst independently validates competitors'
              methodology, and the AI-oncology sub-segment boundary is especially porous. IQVIA additionally reports
              oncology spending growth is expected to moderate after 2027 as biosimilar competition for PD-1/PD-L1
              backbone therapies begins, adding a structural headwind to total addressable market growth for 2028-2029.
              The analyst market size estimates span more than 50× from the oncology RWE slice (~$846M) to the full
              oncology drug economy ($252B), illustrating the range of scope assumptions a market boundary definition
              must resolve.
