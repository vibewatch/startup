      - number: '1.4'
        title: Platform Architecture and Pipeline
        blocks:
          - type: paragraph
            body: >-
              The PathOS platform is organized around three engines. Scout is an AI-enabled asset selection engine that
              scans all investigational therapies, matches each to the patient subgroup most likely to benefit, and
              produces a ranked list. Sprint refers to small autonomous clinical execution teams (Sprint Pods) that
              operate like independent mini-biotechs inside Pathos, focused on moving a specific asset from one
              milestone to the next. Foundry is the shared AI core powered by the oncology foundation model built in
              partnership with Tempus and AstraZeneca; Foundry also connects to Pathos's lab-in-the-loop validation
              system.

              As of the run date, Pathos's pipeline includes four programs. Pocenbrodib (P-300, formerly FT-7051) is a
              CBP/P300 inhibitor licensed in 2023 from Novo Nordisk (original developer: Forma Therapeutics). It entered
              a Phase 1b/2a clinical trial on March 20, 2025 (NCT06785636) in metastatic castration-resistant prostate
              cancer, targeting approximately 203 patients. P-500 (PRT811) is a brain-penetrant PRMT5 inhibitor licensed
              from Prelude Therapeutics in August 2024, with Phase 1 complete showing confirmed complete responses in
              IDH+ high-grade glioma; Pathos plans a biomarker-driven Phase 2 trial. DO-2 is a deuterated
              third-generation MET kinase inhibitor from DeuterOncology (Belgium), acquired via majority stake in May
              2026 after being identified by Foundry; Phase 1 showed 100% tumor shrinkage in evaluable MET exon 14
              skipping NSCLC patients with 5% peripheral edema versus 62–82% for competitors. Milademetan (MDM2
              inhibitor, from Rain Oncology acquisition in January 2024) was at Phase 3 stage but has not been mentioned
              in Pathos's public communications since the acquisition, raising a freshness and pipeline focus question.

              Pathos claims access to more than 200 petabytes of multimodal oncology data—approximately 50 times the
              size of The Cancer Genome Atlas (TCGA). These claims are company-stated and have not been independently
              verified.
