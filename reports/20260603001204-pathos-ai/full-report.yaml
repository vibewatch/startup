  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Current evidence
      - Mitigation / diligence ask
    rows:
      - - Closed-loop oncology learning
        - Pathos has not yet shown one publicly completed flywheel that improved the next decision
        - High
        - Public proof is stronger on asset assembly and partner announcements than outcome loops
        - Request program-level before/after evidence on biomarker selection, trial design, and cycle time
      - - Exclusive data advantage
        - Tempus, Flatiron, Caris, ConcertAI, and Foundation already control data or workflow access at scale
        - High
        - The incumbent data layer is commercialized today while Pathos is still proving reuse rights and leverage
        - Review data-rights exclusivity, partner economics, and reuse permissions
      - - Asset-selection speed
        - Discovery-first peers can source or design molecules internally rather than rehabilitate external ones
        - Medium
        - Recursion, Insilico, Schrödinger, and Relay all show deeper discovery stacks
        - Benchmark Pathos time-to-decision and BD hit rates against traditional asset scouting
      - - Oncology specialization
        - Adjacent AI-biotech players can move into oncology when capital or biology warrants it
        - Medium
        - Owkin, Valo, Absci, and Boundless show different adjacent technical routes into precision medicine
        - Clarify where Pathos is uniquely advantaged beyond a general AI-biotech story
      - - Partner leverage
        - Dependence on external data and platform partners reduces control over key inputs
        - High
        - Pathos relies on named data and model-building relationships more than data incumbents do
        - Review contract duration, exclusivity, and termination triggers with major partners
      - - Switching cost
        - Pathos is not yet embedded in oncology clinic workflow or enterprise software budgets
        - High
        - Tempus and Flatiron already sit closer to the point of care
        - Ask for sponsor, site, and partner repeat-use data plus evidence of retention
      - - Capital-market durability
        - AI-biotech peers can shrink quickly after strategic or clinical setbacks
        - Medium
        - BenevolentAI and Ikena both show how fast an apparent threat can be reset or absorbed
        - Underwrite runway and proof-cycle timing conservatively
    notes: >-
      This register is framed for underwriting rather than for absolute ranking; it highlights what would need to be
      true for Pathos’ claimed moat to become durable.
