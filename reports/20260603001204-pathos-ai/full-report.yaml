      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Pathos AI was co-founded in 2022 by Eric Lefkofsky and Ryan Fukushima. Eric Lefkofsky is also the founder
              and CEO of Tempus AI, Inc. (Nasdaq: TEM), a health technology company specializing in AI-enabled precision
              medicine, which is a publicly disclosed relationship that explains Pathos's deep access to Tempus
              datasets. Ryan Fukushima served as the company's founding and interim CEO through early 2025.

              In May 2025, Iker Huerga joined Pathos AI as CEO and board member. Huerga is a cancer survivor and biotech
              veteran who most recently served as Chief Data Scientist for Oncology R&D at AstraZeneca—directly relevant
              given Pathos's ongoing AstraZeneca partnership. Dr. Jens Renstrup serves as Chief Medical Officer and has
              led the clinical strategy for pocenbrodib. Mohamad Makhzoumi, Co-CEO of New Enterprise Associates (NEA),
              is publicly identified as a board member.

              GenomeWeb published and subsequently corrected an article that initially described Pathos as a Tempus
              spinoff; the correction clarified that Pathos was founded by Tempus executives but is a legally distinct
              and independently operated company. This episode illustrates that the Pathos–Tempus connection is subject
              to external scrutiny and that the relationship should be characterized carefully: Pathos is not a Tempus
              entity, but the personnel and data overlap are material to diligence on independence and conflicts.

              Key-person concentration is elevated: the CEO transition from Fukushima to Huerga in May 2025 coincided
              with the Series D close, suggesting a deliberate pre-financing management upgrade. Full board composition
              beyond Makhzoumi has not been publicly disclosed.
