              collaboration produces repeatable insight, and if pocenbrodib, P-500, and newer sourced assets show real
              clinical leverage, then the current private mark could look conservative. In that world, Pathos graduates
              from an AI-drug-development narrative into a multi-asset, data-moat platform capable of supporting a
              multi-billion-dollar public valuation.


