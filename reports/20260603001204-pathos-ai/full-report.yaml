  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation follows from financing strength, missing economics, public comp comparison, and scenario
      dispersion.
    data:
      nodes:
        - id: capital
          label: Large private financing step-up
        - id: proof
          label: Limited public economic / clinical proof
        - id: comps
          label: Public comps near or below current mark
        - id: dispersion
          label: Wide scenario dispersion
        - id: track
          label: Track recommendation
      edges:
        - source: capital
          target: proof
          label: strong signal but incomplete
        - source: proof
          target: comps
          label: needs triangulation
        - source: comps
          target: dispersion
