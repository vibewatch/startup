  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Platform architecture: PathOS is an operating model, not just a single model'
        blocks:
          - type: paragraph
            body: >-
              Pathos’ public materials consistently describe the company as more than a traditional biotech with one
              lead asset. The core product claim is an operating model called PathOS that integrates three named engines
              — Foundry, Scout, and Sprint — around a common oncology data layer and a wet-lab feedback loop. Foundry is
              framed as the shared AI core that compounds learning across programs; Scout is the engine that prioritizes
              assets and patient subgroups from multimodal evidence; and Sprint is the execution layer that moves a
              chosen asset from one clinical milestone to the next. That matters for diligence because it means the
              technology story and the asset story are inseparable: Pathos is asking investors to believe that the same
              data and decision system can repeatedly source, qualify, and advance external oncology assets better than
              a conventional biotech workflow.


              The strongest proof inside the public record is the specificity of the module descriptions and the
              consistency of the operating-model narrative across the homepage, platform page, and pipeline page. Pathos
              claims access to more than 200 petabytes of multimodal oncology data and pairs that with biomarker
              discovery, patient selection, and trial design. The external Tempus collaboration adds an important second
              witness: Tempus says its de-identified oncology data will be used to build the shared foundation model,
              while Pathos says the completed model will be shared among the three parties. The product architecture map
              and module matrix below therefore treat PathOS as an integrated stack with external data dependence,
              internal AI decisioning, and asset-level execution rather than as a standalone software SKU.
