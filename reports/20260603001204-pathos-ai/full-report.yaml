  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Valuation context: Pathos has a premium private mark without public financial telemetry'
        blocks:
          - type: paragraph
            body: >-
              Pathos’ latest public financing sets the starting point for valuation analysis. The company announced a
              $365 million Series D in May 2025 at an approximately $1.6 billion post-money valuation, just seven months
              after announcing a $62 million Series C at a $600 million post-money valuation. That implies a disclosed
              step-up of roughly 2.7x over a short interval, which is a meaningful repricing for a company that still
              does not publish revenue, ARR, margin, or cash-burn figures. The result is a valuation story driven by
              financing momentum, strategic narrative, and platform optionality rather than by conventional financial
              evidence.


              The SEC record is directionally helpful but not enough to close the gap. Form D filings confirm repeated
              capital raises across 2023, 2024, and 2025, but they do not tell us how much of the latest round was
              primary versus secondary, what preferences or investor rights sit above common equity, or how much cash
              Pathos had left after entering the Tempus and AstraZeneca collaboration. That means the $1.6 billion mark
              is a useful signal, but not yet a fully underwritable price. Investors should treat it as a negotiated
              private mark that still needs triangulation against public comparables and scenario analysis.
            claimRefs:
