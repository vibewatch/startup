            title: Milademetan pipeline status is opaque post-Rain acquisition
            body: >-
              Rain Oncology's lead asset milademetan (MDM2 inhibitor, Phase 3) was a central justification for the
              $1.16/share Rain acquisition, but the asset has not been mentioned in any Pathos press release since the
              acquisition closed in January 2024. This silence is a material disclosure gap — either the asset has been
              deprioritized, the CVR obligations remain in effect, or regulatory feedback has changed its development
              path. Later-chapter financials and pipeline diligence should attempt to resolve this.
