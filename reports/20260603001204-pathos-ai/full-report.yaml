figures:
  - id: FO001
    title: Pathos AI Company Milestone Timeline
    type: timeline
    layout: wide
    summary: >-
      Pathos AI went from founding to a clinical-stage company with four assets, two partnerships, and $467M raised in
      under four years, compressing a conventional development timeline through AI-guided asset selection.
    data:
      items:
        - date: '2022'
          label: Founded
          detail: Eric Lefkofsky and Ryan Fukushima launch Pathos AI in Chicago to apply AI to oncology drug development.
          tone: positive
        - date: 2023-03
          label: First Form D — $40M
          detail: Initial capital raised from Lightbank, Builders VC, and other early backers.
          tone: positive
        - date: '2023'
          label: Pocenbrodib licensed from Novo Nordisk
          detail: CBP/P300 inhibitor FT-7051 (renamed P-300/pocenbrodib) becomes first pipeline asset.
          tone: positive
        - date: 2023-12
          label: Rain Oncology tender offer announced
          detail: Pathos offers $1.16/share plus CVR for Rain Oncology and its MDM2 inhibitor milademetan.
          tone: neutral
        - date: 2024-01
          label: Rain Oncology acquisition completed
          detail: 77% of Rain shares tendered; Rain delisted from Nasdaq; milademetan added to pipeline.
          tone: neutral
        - date: 2024-08
          label: P-500 licensed from Prelude Therapeutics
          detail: Brain-penetrant PRMT5 inhibitor for high-grade glioma and uveal melanoma; Phase 2-ready.
          tone: positive
        - date: 2024-10
          label: $62M Series C — $600M valuation
          detail: NEA-led round brings total funding to ~$102M; Revolution Growth and existing backers participate.
          tone: positive
        - date: 2025-03
          label: Pocenbrodib Phase 1b/2a initiated
          detail: First patient dosed in NCT06785636; 203-patient mCRPC trial launches.
          tone: positive
        - date: 2025-04
          label: Tempus / AstraZeneca partnership
          detail: Multi-year collaboration to build largest multimodal oncology foundation model; $200M to Tempus.
          tone: positive
        - date: 2025-05
          label: $365M Series D — ~$1.6B valuation
          detail: Largest round; Iker Huerga joins as CEO replacing Ryan Fukushima.
          tone: positive
        - date: 2026-05
          label: DeuterOncology majority stake acquired
          detail: >-
            DO-2 MET inhibitor identified and developed through Foundry AI; Phase 1 shows 100% tumor shrinkage in
            evaluable NSCLC patients.
          tone: positive
    claimRefs:
      - CO004
      - CO007
      - CO010
      - CO011
      - CO013
      - CO021
      - CO024
      - CO025
      - CO028
      - CO030
  - id: FO002
    title: Pathos AI Company Snapshot Logic
    type: flow
    layout: standard
    summary: >-
      Pathos AI's business model links a proprietary AI core to external data partnerships, clinical execution teams,
      and a growing pipeline — all feeding back into the Foundry learning flywheel.
    data:
      nodes:
        - id: data
          label: Multimodal Oncology Data
          detail: >-
            200+ petabytes claimed; sourced via Tempus AI partnership (Tempus's de-identified database) and proprietary
            collection. Backbone of all AI model training.
          tone: positive
        - id: foundry
          label: Foundry — AI Core
          detail: >-
            Oncology foundation model built with AstraZeneca and Tempus; connected to lab-in-the-loop validation.
            Identifies and evaluates pipeline candidates systematically.
          tone: positive
        - id: scout
          label: Scout — Asset Selection
          detail: >-
            Scans all investigational therapies; matches each to patient subgroup most likely to benefit; ranked
            acquisition candidates including DO-2 (DeuterOncology, 2026).
          tone: positive
        - id: sprint
          label: Sprint Pods — Clinical Execution
          detail: >-
            Autonomous teams executing each asset from one milestone to the next; powered by PathOS biomarker strategy;
            active pod on pocenbrodib mCRPC trial.
          tone: positive
        - id: pipeline
