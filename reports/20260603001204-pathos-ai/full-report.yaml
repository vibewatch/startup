      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The current mark is investable only if hidden financing terms are clean
            body: >-
              A $1.6B headline mark can still be unattractive if liquidation preferences, secondaries, or insider
              protections absorb too much of the upside. That is why cap-table diligence is the single most important
              next step.
            calloutType: risk
            claimRefs:
              - CV039
          - type: callout
            title: Public comps put Pathos in serious-company territory already
            body: >-
              The round does not value Pathos like an obscure experiment. It values the company closer to public
              AI-biotech peers than to an opaque early private biotech, which means the burden of proof is already
              elevated.
            calloutType: insight
            claimRefs:
