    type: dag
    layout: wide
    summary: Legal, data, partner, and financing shocks all transmit into trial velocity, clinical proof, and future valuation.
    data:
      nodes:
        - id: privacy
          label: Privacy / consent risk
        - id: partner
          label: Tempus / partner concentration
        - id: clinical
          label: Trial execution and efficacy
        - id: governance
