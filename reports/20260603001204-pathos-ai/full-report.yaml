              The recommendation here is track, with medium confidence and a stretched valuation stance. That is not a
              dismissal of the company. Pathos has raised meaningful capital, assembled recognizable strategic partners,
              and built a platform narrative that is stronger than many AI-biotech stories. But the current public
              record is still much stronger on financing than on economics, and much stronger on strategic ambition than
              on validated clinical proof. Track is therefore the appropriate rating for a business that may become very
              valuable but that has not yet made the current entry price easy to underwrite.


              What would move the rating up? Clear evidence that pocenbrodib or follow-on assets are benefiting from
              PathOS-driven patient selection, more transparency on the economics and durability of partner
              relationships, and a credible data room package covering cash, cap table, preferences, and program-level
              spend. What would move it down? A weaker financing environment, partner disruption with Tempus, clinical
              disappointment, or signs that the current valuation embeds governance or dilution overhang not visible in
              public filings. Until those variables are resolved, entry discipline should remain tight.
            claimRefs:
              - CV024
              - CV025
              - CV036
