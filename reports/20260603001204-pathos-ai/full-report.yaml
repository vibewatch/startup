  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope
        blocks:
          - type: paragraph
            body: >-
              Pathos AI operates at the intersection of three analytically distinct but strategically interlocked
              oncology markets. First, AI-assisted oncology drug discovery: buyers are large and mid-size pharmaceutical
              R&D organizations seeking to identify and validate clinical assets more efficiently; status-quo
              substitutes include in-house bioinformatics teams, academic collaborations with cancer centres, and
              traditional statistical approaches to candidate screening. Second, oncology real-world evidence (RWE):
              biopharma companies, health technology assessors, and regulators purchase retrospective or prospective
              patient datasets to support regulatory submissions, post-market surveillance, and payer negotiations.
              Third, precision oncology diagnostics: next-generation sequencing (NGS), multi-omic profiling, and
              companion diagnostics serve as both a clinical care layer and the data substrate for AI training. Key
              exclusions from Pathos AI's direct addressable market include drug manufacturing, clinical CRO operational
              services, hospital EHR software, and drug sales revenues — all adjacent but not captured by a
              platform-licensing model. The cancer epidemiology context is substantial: NCI estimates ~2.04M new US
              cancer diagnoses in 2025, while WHO reports ~10M global cancer deaths in 2022, and SEER projects ~2.11M
              new US cases and 626K cancer deaths in 2026. This patient volume creates the longitudinal data opportunity
              that oncology AI platforms compete to aggregate. Market boundary definition is highly contested: Tempus AI
              and Caris Life Sciences each span diagnostics, RWE, and AI modeling simultaneously, making competitive
              market delineation assumption- dependent and comparisons across analyst estimates unreliable without
              adjusting for scope.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM021
              - CM022
