  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape structure: Pathos sits between discovery engines and oncology data incumbents'
        blocks:
          - type: paragraph
            body: >-
              The competitive map around Pathos is broader than a normal biotech peer set because Pathos is trying to
              compress several jobs into one operating model. Public Pathos materials frame the company as redefining
              drug development in oncology and advancing a precision-built pipeline rather than selling a standalone
              software seat or inventing every molecule from scratch. That means the direct comparables are not just
              other oncology biotechs. Pathos competes with AI-first discovery platforms such as Recursion/Exscientia,
              Insilico, Schrödinger, and Relay for technical credibility, capital, and differentiated assets. At the
              same time, it competes with oncology data and workflow incumbents such as Tempus, Flatiron, Caris,
              ConcertAI, and Foundation Medicine for access to multimodal data, real-world evidence, and clinician
