- id: moat-durability-and-underwriting
  title: 'Moat durability: Pathos has a differentiated lane, but the moat is still more plausible than proven'
  body: |-
    The strongest case for Pathos is that it is trying to own a narrow but valuable layer that others do not: buy or license clinically relevant oncology assets, use AI and multimodal evidence to choose the best patients and trial designs, and then feed the resulting evidence back into the next portfolio decision. That is a real strategic lane. The problem is that public switching costs and pricing power still look weak. Tempus, Flatiron, Caris, and ConcertAI are closer to clinical workflow and life-sciences budgets. Schrödinger is clearer on recurring software monetization. Recursion, Insilico, and Relay are deeper on core discovery or design. Pathos therefore depends on showing a closed-loop result that the market can see: a program chosen or redesigned by the platform that materially outperforms what conventional asset management would have produced. Until that exists in public, the moat should be underwritten as emerging. The niche is strategically attractive and likely durable if proven, but the durability is not yet visible in completed outcomes, repeat contracts, or embedded workflow lock-in.
