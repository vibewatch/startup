callouts:
- calloutType: strength
  title: Pathos has a genuinely differentiated lane
  body: |-
    Pathos is not just another AI drug-discovery pitch. Its most defensible difference is the attempt to use AI to choose, reposition, and clinically execute oncology assets rather than to originate every molecule from scratch.
  claimRefs:
  - CP038
  - CP040
  - CP046
- calloutType: risk
  title: The company is squeezed by both stronger discovery engines and stronger data incumbents
  body: |-
    Recursion, Insilico, Schrödinger, and Relay look deeper on core discovery or design, while Tempus, Flatiron, Caris, ConcertAI, and Foundation look stronger on data distribution and workflow lock-in. Pathos must prove it can win between those poles.
  claimRefs:
  - CP039
  - CP040
  - CP041
  - CP045
- calloutType: insight
  title: One visible closed-loop clinical win would matter more than another platform partnership
  body: |-
    The market already has enough AI-biotech stories and enough oncology data platforms. What would most change the competitive verdict is public evidence that a Pathos-selected or Pathos-redesigned program outperformed what conventional development would likely have produced.
  claimRefs:
