  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: competitor landscape coverage
    missingEvidence: |-
      Full private-company revenue, customer counts, and exact financing status are not publicly available across many adjacent and private peers in the landscape table.
    whyItMatters: |-
      Relative scale and durability are important to competitive ranking; without consistent financial disclosure, some rows can only be compared on platform proof and strategic posture.
    diligencePath: |-
      Request cap tables, latest cash/runway, customer concentration, and revenue mix directly from management or through the data room for Pathos and the most relevant private peers.
    relatedQuestionRefs:
    - QP001
    - QP017
    relatedTableRefs:
    - TP001
  - type: missing-source
    severity: material
    topic: pricing transparency
    missingEvidence: Public list pricing and standardized contract terms remain scarce across Pathos, discovery peers, and oncology data platforms.
    whyItMatters: |-
      Without visible rate cards or normalized contract structures, it is difficult to underwrite pricing power, buyer switching cost, or gross-margin comparability across vendors.
    diligencePath: |-
      Collect customer contracts, term sheets, minimum commitments, and realized pricing for Pathos plus a tight peer set; compare against disclosed milestone and integration economics.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: Pathos moat proof
    missingEvidence: |-
      No public source shows a fully completed Pathos-selected or Pathos-redesigned program that demonstrably improved patient selection, trial speed, or clinical outcomes versus a conventional alternative.
    whyItMatters: That proof point is the clearest missing link between Pathos’s strategic differentiation and a durable competitive moat.
    diligencePath: |-
      Request cohort-level biomarker hit rates, cycle-time data, decision logs, and retrospective comparisons for Pathos-run programs, especially those chosen or redesigned by the platform.
    relatedQuestionRefs:
    - QP024
    - QP025
    relatedTableRefs:
    - TP004
