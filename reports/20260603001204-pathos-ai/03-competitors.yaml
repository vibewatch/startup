- id: data-platforms-and-adjacent-substitutes
  title: 'Data platforms and adjacent substitutes: the toughest non-obvious competition is distribution and evidence'
  body: |-
    The non-obvious threat to Pathos is not only another AI discovery startup; it is the oncology data and workflow layer that can shape which assets get evidence, adoption, and pharma attention. Tempus already sits inside molecular profiling and has shown it can integrate directly into Flatiron’s OncoEMR, while Caris and Flatiron have combined genomic, imaging, and real-world data into a commercial research offering. ConcertAI is building on the same pattern from the enterprise side, packaging oncology datasets and agentic AI tools for life-sciences users rather than for investors in a single pipeline. Foundation Medicine remains narrower in modality but still formidable because Roche positions it around more than 300 cancer-driving genes and global CGP adoption. Adjacent AI-biotech players broaden the threat surface. Owkin combines causal AI, pathology, spatial omics, and pharma partnerships; Valo pushes AI-enabled human causal biology and closed-loop chemistry; Boundless pursues a focused ecDNA-oncology wedge; Absci shows what AI-designed biologics could look like; and Ikena’s absorption into ImageneBio is a reminder that capital recycling can erase an apparent peer before it becomes a durable competitor. For Pathos, the lesson is that data access, workflow distribution, and partner trust may matter as much as model quality.
