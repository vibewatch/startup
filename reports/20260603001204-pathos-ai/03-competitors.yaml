- id: direct-ai-drug-development-peers
  title: 'Direct AI drug-development peers: stronger discovery depth, mixed clinical proof, uneven durability'
  body: |-
    Among the direct AI drug-development peers, none matches Pathos exactly, but each pressures a different part of the Pathos thesis. Recursion plus Exscientia is the clearest end-to-end discovery heavyweight: the merger explicitly pitched a combined leader with end-to-end capabilities, making it the best public example of AI scale plus generative chemistry under one roof. Insilico has the clearest AI-platform breadth on paper, with 40-plus programs, 13 IND-cleared pipelines, and a Lilly deal sized like a real biopharma validation event. Schrödinger is different again: it is the most economically legible peer because software licensing and collaboration economics are visible, which gives it a more durable-looking business model than most AI-biotech stories. Relay’s strength is not generalized AI rhetoric but motion-based protein science and a clinically advancing oncology pipeline, including outlicensed assets. BenevolentAI is the warning case. Its Merck deal shows genuine partner validation, but the 2024 strategic reset and 2025 delisting path show how quickly AI-biotech narratives can retrench when capital markets and pipeline progress fail to reinforce each other. Compared with this group, Pathos looks distinctive on clinical-asset triage and biomarker-guided development, but less proven on molecule-design depth.
