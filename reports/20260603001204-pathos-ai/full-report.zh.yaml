figures:
  - id: FO001
    title: Pathos AI 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Pathos AI 在不到四年里从创立推进到临床阶段公司，拥有四项资产、两项合作，累计融资 $467M；公司借助 AI 引导的资产筛选，压缩了传统开发时间线。
    data:
      items:
        - date: '2022'
          label: 创立
          detail: Eric Lefkofsky 和 Ryan Fukushima 在 Chicago 创立 Pathos AI，将 AI 用于肿瘤药物开发。
          tone: positive
        - date: 2023-03
          label: 首份 Form D — $40M
          detail: 从 Lightbank、Builders VC 和其他早期支持者募集初始资金。
          tone: positive
        - date: '2023'
          label: 从 Novo Nordisk 许可引入 Pocenbrodib
          detail: CBP/P300 抑制剂 FT-7051（后更名为 P-300/pocenbrodib）成为首个管线资产。
          tone: positive
        - date: 2023-12
          label: 宣布对 Rain Oncology 发起要约收购
          detail: Pathos 对 Rain Oncology 及其 MDM2 抑制剂 milademetan 出价 $1.16/share，另加 CVR。
          tone: neutral
        - date: 2024-01
          label: 完成收购 Rain Oncology
          detail: Rain 77% 股份被要约接纳；Rain 从 Nasdaq 退市；milademetan 加入管线。
          tone: neutral
        - date: 2024-08
          label: 从 Prelude Therapeutics 许可引入 P-500
          detail: 可入脑 PRMT5 抑制剂，面向高级别胶质瘤和葡萄膜黑色素瘤；已准备进入 Phase 2。
          tone: positive
        - date: 2024-10
          label: $62M Series C — $600M 估值
          detail: NEA 领投后累计融资达到 ~$102M；Revolution Growth 和既有支持者参与。
          tone: positive
        - date: 2025-03
          label: Pocenbrodib 启动 Phase 1b/2a
          detail: NCT06785636 完成首例患者给药；203 名患者的 mCRPC 试验启动。
          tone: positive
        - date: 2025-04
          label: Tempus / AstraZeneca 合作
          detail: 多年合作，建设最大多模态肿瘤学基础模型；Tempus 获 $200M。
          tone: positive
        - date: 2025-05
          label: $365M Series D — ~$1.6B 估值
          detail: 最大一轮融资；Iker Huerga 接任 CEO，取代 Ryan Fukushima。
          tone: positive
        - date: 2026-05
          label: 收购 DeuterOncology 多数股权
          detail: DO-2 MET 抑制剂由 Foundry AI 识别并开发；Phase 1 显示，在可评估 NSCLC 患者中肿瘤缩小率为 100%。
          tone: positive
    claimRefs:
      - CO004
      - CO007
      - CO010
      - CO011
      - CO013
      - CO021
      - CO024
      - CO025
      - CO028
      - CO030
  - id: FO002
    title: Pathos AI 公司快照逻辑
    type: flow
    layout: standard
    summary: Pathos AI 的商业模式把自研 AI 核心与外部数据合作、临床执行团队和逐步扩大的管线串起来，并全部回流到 Foundry 学习飞轮。
    data:
      nodes:
        - id: data
          label: 多模态肿瘤学数据
          detail: 公司声称拥有 200+ petabytes；来源包括 Tempus AI 合作（Tempus 去标识化数据库）和自有采集。这是所有 AI 模型训练的底座。
          tone: positive
        - id: foundry
          label: Foundry — AI 核心
          detail: 与 AstraZeneca 和 Tempus 共建的肿瘤学基础模型；接入实验室闭环验证，系统性识别和评估管线候选资产。
          tone: positive
        - id: scout
          label: Scout — 资产筛选
          detail: 扫描所有在研疗法；为每项疗法匹配最可能受益的患者亚群；给收购候选排序，包括 DO-2（DeuterOncology，2026）。
          tone: positive
        - id: sprint
          label: Sprint Pods — 临床执行
          detail: 自主团队把每项资产从一个里程碑推进到下一个；由 PathOS 生物标志物策略驱动；当前活跃 pod 负责 pocenbrodib mCRPC 试验。
          tone: positive
        - id: pipeline
          label: 临床管线
