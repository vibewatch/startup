      - number: '2.2'
        title: 市场规模测算：多重视角
        blocks:
          - type: paragraph
            body: >-
              测算 Pathos AI 可触达机会，需要拆开多个彼此重叠的发布方市场估计。IQVIA《Global Oncology Trends 2025》报告 2024 年全球肿瘤药物支出为 $252B，预计到 2029
              年达到 $441B，CAGR 约 11.9%；这是 AI 平台服务争夺一部分研发预算的整体肿瘤经济。MarketsandMarkets 估计专门的肿瘤 AI 市场 2024 年为 $2.45B，到 2030
              年增至 $11.52B，CAGR 29.4%，范围涵盖药物发现、诊断、临床决策支持和影像 AI。药物发现技术市场（AI 只是其中一个细分）单独估计为 2025 年 $30.58B，到 2030 年
              $51.51B，CAGR 11.0%（MarketsandMarkets，2026 年 1 月）。Mordor Intelligence 估计 2025 年全球 RWE 解决方案市场为
              $2.44B，其中肿瘤占行业 34.65%；由此推算 2025 年肿瘤 RWE 细分约 $846M，并以 16.33% CAGR 增长，到 2031 年总市场达到 $6.04B。精准诊断与医学市场在 2024
              年达到 $145.53B（MarketsandMarkets），NGS 市场 2023 年为 $12.98B，并以 18.3% CAGR 增长（Allied Market Research）——两者都说明 AI
              药物发现依赖的数据底座市场本身在快速扩张。这些估计不确定性很高：发布方采用不同边界定义，没有分析师独立验证竞争对手方法论，肿瘤 AI 子细分边界尤其多孔。IQVIA 还报告，PD-1/PD-L1
              骨干疗法开始面对生物类似药竞争后，肿瘤支出增长预计在 2027 年后放缓，为 2028–2029 年总可用市场增长增加结构性逆风。分析师市场规模估计相差超过 50 倍，从肿瘤 RWE 切片（约
              $846M）到完整肿瘤药物经济（$252B），展示了市场边界定义必须解决的范围假设跨度。
