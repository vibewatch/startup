      - number: '3.4'
        title: 护城河耐久性：Pathos 有差异化赛道，但护城河仍更像可能性而非证明
        blocks:
          - type: paragraph
            body: >-
              支持 Pathos 的最强论点，是它试图占住一个狭窄但有价值、其他玩家没有真正拥有的层：购买或许可具备临床价值的肿瘤资产，用 AI
              和多模态证据选择最佳患者和试验设计，再把产出的证据反馈到下一次组合决策。这是一条真实的战略赛道。问题在于，公开可见的切换成本和定价权仍然偏弱。Tempus、Flatiron、Caris 和 ConcertAI
              更靠近临床工作流和生命科学预算。Schrödinger 在经常性软件变现上更清晰。Recursion、Insilico 和 Relay 在核心发现或设计上更深。因此 Pathos
              需要展示一个市场看得见的闭环结果：由平台选择或重新设计的项目，明显优于传统资产管理可能带来的结果。在此公开出现前，护城河只能按新兴阶段假设。这个细分位点有战略吸引力，若被证明很可能具备耐久性，但耐久性尚未在已完成结果、重复合同或嵌入式工作流锁定中显现。
