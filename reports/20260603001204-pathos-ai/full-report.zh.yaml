  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 状态
      - 目标细分市场
      - 差异化
      - 局限
    rows:
      - - Pathos AI
        - AI 辅助肿瘤资产开发
        - 私营、临床阶段管线搭建者
        - 生物标志物定义的肿瘤开发
        - 在肿瘤领域内部组合资产分诊、生物标志物逻辑和执行
        - 没有公开完成的闭环成功案例，也没有独立软件收入
      - - Recursion + Exscientia
        - AI 优先的端到端药物发现
        - 合并后的上市 AI 药物发现平台
        - 广泛发现合作和内部管线
        - 表型组学和生成式化学放在同一屋檐下
        - 整合和资本消耗风险仍实质存在
      - - Insilico Medicine
        - AI 原生靶点到分子平台
        - 40+ 项目；13 条 IND 获批管线；Lilly 验证
        - 多治疗领域发现和授权
        - 端到端 Pharma.AI 技术栈，授权信号强
        - 临床证据仍集中在早期项目
      - - BenevolentAI
        - 知识图谱 TechBio / 合作发现
        - 2024 年重置后走向重组和退市
        - 合作发现加规模更小的内部组合
        - 生物医学知识图谱和靶点假设引擎
        - 战略收缩削弱了竞争威胁
      - - Schrödinger
        - 基于物理的软件与管线
        - 上市软件和治疗混合体
        - 制药计算设计和内部肿瘤项目
        - 经常性软件授权加自有项目
        - 对试验执行或资产修复的聚焦较弱
      - - Relay Therapeutics
        - 基于运动的精准肿瘤学
        - 上市临床阶段平台，选择性对外授权
        - 肿瘤和罕见病项目
        - 用于基于运动药物设计的 Dynamo 平台
        - 比数据平台护城河更窄
      - - Tempus AI
        - 临床基因组数据和肿瘤工作流
        - 上市 AI 医疗科技平台
        - 检测、诊断、制药数据、肿瘤诊所
        - 通过分型和 EMR 集成铺开工作流
        - 不是肿瘤药物资产的所有者兼运营者
      - - Foundation Medicine
        - CGP 诊断平台
        - Roche 关联公司
        - 伴随诊断和基因组分型
        - 覆盖 300 多个基因的 CGP 足迹和 Roche 触达
        - 比部分数据平台更偏诊断中心，也更少多模态
      - - ConcertAI
        - 肿瘤数据和企业 AI
        - 私营企业平台
        - 生命科学研究和商业团队
        - 基于肿瘤数据集的 CARAai 和 Precision Suite
        - 更像软件 / 数据卖方，而不是治疗开发者
      - - Flatiron Health
        - 肿瘤工作流和 RWE 引擎
        - 大型肿瘤工作流现有厂商
        - 肿瘤诊疗机构和研究用户
        - OncoEMR 分发加研究规模
        - 自身不拥有治疗资产
      - - Caris Life Sciences
        - 分子分型和多模态研究数据
        - 大型精准肿瘤平台
        - 诊断和生物制药研究
        - DNA、RNA 和影像结合合作伙伴工作流
        - 诊断优先姿态限制了与 Pathos 的直接相似度
      - - Owkin
        - 端到端 AI 生物技术和诊断
        - 私营 AI 生物技术公司，与制药企业合作
        - 精准医疗、诊断和发现
        - 因果 AI 加病理和空间组学合作
        - 疾病范围比 Pathos 当前切入点更宽
      - - Valo Health
        - AI 驱动的因果生物学公司
        - 私营平台，领导层面向制药
        - 广泛疾病领域和合作发现
        - 基于大规模人类数据的闭环化学
        - 肿瘤专属性弱于 Pathos
      - - Boundless Bio
        - 特定生物学机制的肿瘤替代方
        - 临床阶段精准肿瘤公司
        - ecDNA 扩增癌症
        - 独特的 ecDNA 生物学切入点
        - 单一生物学焦点缩窄可触达市场
      - - Ikena / ImageneBio
        - 曾经相邻的肿瘤平台
        - 合并后 Ikena 不再独立
        - 合并后聚焦 anti-OX40 和免疫学
        - 体现资本回收并注入新实体
        - Ikena 不再作为独立实体威胁 Pathos
      - - Absci
        - 相邻的 AI 设计生物制剂平台
        - AI 生物制剂管线，含 Phase 1/2a 资产
        - 生物制剂和炎症，不以肿瘤为先
        - 展示 AI 原生生物制剂设计的相邻性
        - 位于 Pathos 当前肿瘤小分子赛道之外
    notes: 覆盖范围有意保持部分、偏战略而非穷尽；该表强调的是与 Pathos 2026 年公开定位最相关的同行和替代方。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-relevant public peers and substitutes visible in 2024-2026 sources; it is not a full
