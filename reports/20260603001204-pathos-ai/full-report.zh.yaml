      - number: '8.4'
        title: 建议：观察，中等信心，估值偏高
        blocks:
          - type: paragraph
            body: >-
              这里的建议是观察，信心中等，估值立场偏高。这不是否定公司。Pathos 已经融到可观资本，组建了可识别的战略伙伴，并搭起了比许多 AI
              生物科技故事更强的平台叙事。但当前公开记录仍然融资证据强于经济性证据，战略雄心强于已验证临床证明。因此，对一家可能变得很有价值、但尚未让当前入场价变得容易承销的公司，观察是合适评级。


              什么会推高评级？明确证据显示 pocenbrodib 或后续资产受益于 PathOS
              驱动的患者选择；伙伴关系的经济性和持久性更透明；以及可信的数据室材料，覆盖现金、股权结构表、优先权和项目级支出。什么会压低评级？融资环境走弱、Tempus
              伙伴关系中断、临床结果失望，或迹象显示当前估值内含公开文件看不到的治理或稀释包袱。在这些变量解决前，入场纪律应保持严格。
