      - number: '4.4'
        title: 估值背景与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              Pathos 披露的融资路径使其处于私有 AI 生物技术融资的上层，但尚未达到该类别顶端。按公开披露资本，Pathos 已融资约 $467M，显著高于 Variational AI $5.5M
              种子轮延伸融资等较小 AI 发现融资，也高于 Insilico 报道的 $110M Series E，但仍远低于 Isomorphic Labs $2.1B Series
              B。更重要的比较是模型质量。Schrödinger 的官方战略把经常性软件收入与药物发现上行空间配对，而 Relay
              披露则展示了更传统临床阶段治疗公司依靠大额现金储备和反复进入资本市场融资的经济逻辑。Pathos 在资本强度上更接近 Relay，而不是在当前收入多元化上接近 Schrödinger。

              这一框架很重要，因为最关键阻断点不在于 Pathos 是否还能融一次钱，而在于它能否在再次融资前把资本转化为可衡量的商业或临床价值。Nature
              的融资评论是反向提醒：即便复苏开始，生物技术融资环境也可能快速收紧。公司层面，Pathos 仍未披露手头现金、股权结构表条款、清算优先权、确认收入、利润率结构，或未来模型产出与伙伴之间的经济分成。Series D
              投资者身份也大多未披露。结果是一家公司看起来资金充足且获得战略验证，但收入质量、真实现金跑道和利润率路径仍只能靠私有证据判断。
