  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: >-
      Pathos AI 可服务肿瘤 AI 市场的三层 TAM/SAM/SOM 金字塔。TAM 锚定肿瘤学 AI（MarketsandMarkets 2024）。SAM 限定在面向生物制药的 AI 药物发现服务（估算子集）。SOM
      是对 Pathos AI 近期可获取份额的数量级估算，处于商业化前。
    data:
      items:
        - label: TAM — 肿瘤学 AI（MarketsandMarkets 2024）
          value: 2450
          unit: USD M
          note: 完整的肿瘤学 AI 边界，包括诊断 AI 和 CDx
        - label: SAM — 面向生物制药的 AI 药物发现服务（估算）
          value: 400
          unit: USD M (est.)
          note: AI 肿瘤学市场子集，聚焦制药 R&D；分析师调整边界
        - label: SOM — Pathos AI 近期可获取市场（估算）
          value: 50
          unit: USD M (low-confidence est.)
          note: 商业化前；基于平台类比；无已披露收入基线
    approximationNotes: >-
      TAM 取 MarketsandMarkets 2024 肿瘤学 AI（$2.45B），四舍五入为 $2,450M。SAM 是分析性估算（约为 AI 肿瘤学 TAM 的
      16-20%），代表仅用于药物发现的生物制药平台支出，排除影像 AI、诊断 AI 和临床决策支持。~$50M 的 SOM 是 Pathos AI 当前阶段的数量级估算，类比早期商业化 AI 药物发现平台；Pathos
      在治疗药物上仍处于商业化前，也没有披露平台收入。
