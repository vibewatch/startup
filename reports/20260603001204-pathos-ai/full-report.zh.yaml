  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Pathos 缺少宽泛的公开财务基础，因此少数驱动因素主导估值方向。
    data:
      items:
        - label: 领先资产临床证明
          value: 10
        - label: Tempus 关系耐久性
          value: 9
        - label: 平台可重复性证据
          value: 9
        - label: 公开可比公司倍数方向
          value: 8
        - label: 融资条款 / 稀释
