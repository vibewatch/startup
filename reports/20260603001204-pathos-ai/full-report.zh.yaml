      - number: '1.3'
        title: 资本历程、估值与投资者版图
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 在四次已披露融资事件中累计融资约 $467M。2023 年 3 月 Form D（SEC filing number 021-474736）下首次募集
              $40M，用于平台开发和首个资产收购。随后公司在 2024 年 10 月完成超额认购的 $62M Series C，由 New Enterprise Associates 领投，投后估值
              $600M；当时报道的累计融资为 $102M，印证 Series C 前的 $40M。Series D 于 2025 年 5 月 15 日宣布完成，融资 $365M，将投后估值推至约 $1.6B。2025 年 5
              月 1 日 Form D 显示发行总额 $399,999,933，截至申报日已向 11 名投资者售出 $282,999,950；考虑后续交割，这与公告金额一致。

              Series D 投资者身份尚未公开披露。Pathos 确认本轮包括老股东和新投资者。Series C 投资者基础（NEA、Revolution Growth、Lightbank、Builders
              VC）是目前记录最完整的一组。2025 年 4 月基础模型合作协议下向 Tempus AI 支付的 $200M，是一笔重要的关联方商业交易，需要单独尽调——资金从 Pathos 流向作为交易对手的
              Tempus，而非股权付款。

              未公开披露债务融资、老股交易或信贷额度。Pathos 仍为私有公司，且因不披露财务报表，可归入私有未披露类别。
