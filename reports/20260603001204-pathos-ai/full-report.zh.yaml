      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 由 Eric Lefkofsky 和 Ryan Fukushima 于 2022 年共同创立。Eric Lefkofsky 同时是 Tempus AI, Inc.（Nasdaq:
              TEM）的创始人兼 CEO；Tempus 是一家专注 AI 赋能精准医疗的健康科技公司。该公开关系解释了 Pathos 为何能深度访问 Tempus 数据集。Ryan Fukushima 曾担任公司创始及临时
              CEO，任期至 2025 年初。

              Iker Huerga 于 2025 年 5 月加入 Pathos AI，担任 CEO 和董事会成员。Huerga 是癌症幸存者，也有生物技术行业资历；此前最近一职是 AstraZeneca
              肿瘤研发首席数据科学家，直接贴合 Pathos 正在推进的 AstraZeneca 合作。Dr. Jens Renstrup 担任首席医疗官，并主导 pocenbrodib 的临床策略。公开资料列 New
              Enterprise Associates（NEA）联席 CEO Mohamad Makhzoumi 为董事会成员。

              GenomeWeb 曾发表一篇文章，将 Pathos 初称为 Tempus 分拆公司，后续予以更正；更正说明 Pathos 由 Tempus
              高管创立，但法律上独立、运营上独立。这一事件说明，Pathos–Tempus 关系会受到外部审视，描述时必须谨慎：Pathos 不是 Tempus 实体，但人员和数据重叠对独立性及利益冲突尽调有实质意义。

              关键人依赖偏高：Fukushima 到 Huerga 的 CEO 交接发生在 2025 年 5 月，正好与 Series D 完成重合，暗示这是一次有意安排的融资前管理层升级。除 Makhzoumi
              外，完整董事会构成尚未公开。
