      - number: '2.3'
        title: 买方与细分市场格局
        blocks:
          - type: paragraph
            body: >-
              肿瘤 AI 数据和药物发现平台的主要买方是大型制药公司，由首席数字官和 VP 级研发领导分配多年期数据许可和平台费用。商业规模证据较强：Tempus AI 报告 2026 年 Q1 收入 $348.1M（同比
              +36.1%），全年 2026 指引为 $1.59–1.60B，并与 Merck、Gilead、AstraZeneca 等开展多年战略合作，为企业提供肿瘤 AI 数据访问。Caris Life Sciences
              报告 2026 年 Q1 收入 $216.2M（同比 +79%），完成 52,800 例临床分型，数据库累计画像超过 1.07M，显示有大型临床装机基础为分子分型服务付费。Tempus 与 Caris 合计指向约
              $2.3B 年化肿瘤数据服务市场，锚定现实商业规模。ConcertAI 是另一家肿瘤 RWE 平台，2024 年 6 月以约 $1.9B 估值融资 $150M；Roche 2018 年以约 $1.9B 收购
              Flatiron Health，较早证明生物医药愿意为肿瘤 RWD 平台支付高溢价。中型肿瘤生物技术公司是第二层买方，用 AI
              提高资产筛选和试验设计效率，从而延展有限资本。学术癌症中心通过赠款资助协议大量购买数据平台，但很少产生商业规模合同。社区肿瘤网络和支付方（保险）正在成为 AI 导航服务买方——Humana 于 2025 年与
              Thyme Care 合作——但仍处在 Pathos AI 当前销售动作外围。Pathos AI 声称拥有 200+ PB 多模态数据（约 50×
              TCGA），但该数字似乎只出现在公司材料中，没有独立验证，因此数据集差异化主张难以评估。制药研发预算分配是关键门槛；已经验证的模式是多年期企业协议，预算线在研发（非 COGS），供应商选择由首席数字或 AI
              负责人控制。
