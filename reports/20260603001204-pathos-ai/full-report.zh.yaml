        title: 财务和市场风险只有在 Pathos 持续把资本转化为可信证明点时才可控
        blocks:
          - type: paragraph
            body: >-
              Pathos 显然能融资，但这不等于融资风险低。SEC 提交材料显示，公司在 2023、2024 和 2025 年反复提交 Form D，最终形成 2025 年约 $400 million
              的发行。一方面，融资历史是优势——投资者反复支持公司；另一方面，它也证明该模型仍依赖外部资本，而不是公开收入。只要公司仍处于商业化前、客户变现不透明，每一次未来融资都高度依赖市场继续相信平台叙事，以及新的临床或运营证明。


              品类风险会叠加公司自身故事。Tempus 和 Caris 表明，规模化肿瘤数据公司同样要处理隐私、治理、AI 监管和执行复杂性；只是它们指标更多、公开程度更高。对 Pathos
