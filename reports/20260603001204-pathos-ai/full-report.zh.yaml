  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与资本充足性
        blocks:
          - type: paragraph
            body: >-
              对 Pathos 做财务承保，要先看融资，而不是利润表质量，因为公司未公布财务报表或公开现金余额。不过，对一家私有生物技术公司来说，其资本记录锚点异常扎实。Pathos 于 2024 年 10 月宣布完成
              $62M Series C，投后估值 $600M；2025 年 5 月完成 $365M Series D，投后估值约 $1.6B。CIK 0001967854 下的 SEC Form D
              记录印证了绑定公司的三次豁免发行：2023 年文件显示发行总额约 $40M，2024 年文件匹配 Series C 规模，2025 年文件显示发行总额 $399,999,933，截至申报日已售出
              $282,999,950，投资者 11 名。这组证据为核心融资时间线提供了异常强的一手锚点。

              更重要的承保问题是未来资本充足性。Pathos 披露 Series D 资金将用于临床管线和肿瘤基础模型的持续投入，2025 年 4 月 Tempus/AstraZeneca 公告则单独披露应向 Tempus
              支付 $200M 费用。已审阅的官方和监管文件来源中未出现债务、仓储融资或项目融资义务，因此资产负债表看起来由股权融资支撑。但缺少交割时现金余额，投资者无法判断 Series D
              完成时此前资本还剩多少、Tempus 承诺付款速度多快，或已有多少资本承诺给资产收购和试验执行。因此，本章将融资历史视为已验证，将现金充足性视为估计。
