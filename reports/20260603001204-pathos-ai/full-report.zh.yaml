        title: 运营和伙伴风险被放大，因为最干净的公开证据都经过 Tempus
        blocks:
          - type: paragraph
            body: >-
              公开证据显示 Pathos 能执行，也显示这种执行多依赖外部基础设施。Tempus TIME 案例之所以有价值，恰恰因为它很具体：早期研究会遇到研究中心和患者瓶颈，而 Tempus 称其帮助 Pathos
              研究识别了前 10 名匹配患者中的 6 名。这令人鼓舞，但也意味着 Pathos 一个核心运营证明点位于 Pathos 之外。同样，Tempus 与 AstraZeneca 的合作给了 Pathos
              难以独自搭建的规模，也让伙伴连续性变成现实风险变量，而不是背景细节。


              临床风险同样不轻。Pocenbrodib 还必须跨过早期安全性和疗效阈值，才能进入更成熟的价值叙事。P-500 有早期信号潜力，也有明确不良事件历史；DO-2 则是刚收购的资产，基于一个小型 1
              期数据集，仍需在更广人群中独立确认。叠加 Rain 整合和组合优先级问题，运营图景变成：确有进展，但韧性有限。下方依赖关系图把 Tempus 视为当前 Pathos 风险栈中最重要的外部节点。
