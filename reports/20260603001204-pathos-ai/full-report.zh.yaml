      - number: '1.5'
        title: 时间线、里程碑与不利背景
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 从 2022 年创立到 2026 年 5 月收购
              DeuterOncology，不到四年内经历四次融资、四项资产新增、一次完成收购和两项重大战略合作。相对其公司规模，这一临床与企业发展节奏很快。里程碑表汇总了完整公开记录。

              Rain Oncology 收购（2024 年 1 月 26 日完成）是首项重大外部交易。Pathos 全资子公司 WK Merger Sub, Inc. 以每股 $1.16 加每股或有价值权收购 Rain
              全部流通普通股；股东投出 28,031,182 股，占流通股约 77%。Rain 的 milademetan 是 p53-MDM2 复合物抑制剂，曾推进至 3 期，但收购后基本从 Pathos
              公开沟通中消失，可能意味着管线重新排序，也可能是战略性搁置。

              2025 年 4 月 23 日宣布的 Tempus/AstraZeneca 合作，是单项资本消耗最大的事件：$200M 费用流向 Tempus，产出的基础模型将在三方之间共享。AstraZeneca
              同时作为客户和模型共同开发方直接参与，形成少见的利益一致性，也需要开展治理和利益冲突尽调。The ASCO Post 强调过，在肿瘤决策场景部署 AI 工具存在法律与责任不确定性；这一点广泛适用于 Pathos
              的目标。

              三个风险点需要强调：第一，对 Huerga 的关键人依赖较高（新任 CEO，过往没有 Pathos 特定任期）；第二，Series D 投资者身份未披露；第三，AI
              驱动临床试验设计的监管和责任框架在全球尚未定型。
