        - Pathos AI 是否验证过，Scout 选择的资产淘汰率优于行业基线？
      - - FDA RWE Framework 和持续接受 RWE 指引
        - 驱动
        - 当前 / 近期
        - 支持数据驱动型监管申报；扩大 RWE 解决方案市场
        - Pathos 数据是否参与过任何监管申报？如有，是哪些？
      - - NGS 测序成本下降，支持大规模多组学数据集
        - 驱动
        - 当前 / 长期
        - 降低单样本数据获取成本；支撑更大的训练数据集
        - Pathos AI 的单样本数据获取成本是多少，趋势如何？
      - - 精准医疗要求和伴随诊断增长
        - 驱动
        - 当前
