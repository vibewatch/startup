chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与阶段
        blocks:
          - type: paragraph
            body: >-
              Pathos AI, Inc. 是一家临床阶段人工智能与生物技术公司，注册地为 Delaware，总部位于 600 W. Chicago Ave., Suite 510, Chicago, Illinois
              60654。公司的 SEC CIK 为 0001967854，IRS EIN 为 852945509。Pathos 成立于 2022 年，交汇点是技术、肿瘤学和亲历癌症的经验。官方网站为
              www.pathos.com，财政年度截至 12 月 31 日。

              公司给出的使命是借助自研患者数据和 AI 改造药物开发，大幅提高试验成功率，把新疗法带给传统治疗失败的患者。Pathos 将自己定位为 AI 赋能生物技术公司，靠 AI
              技术、多模态真实世界数据和患者来源生物模型重构药物开发。截至本次报告生成日，Pathos 仍处临床阶段，领先项目 pocenbrodib 正在开展 1b/2a 期临床试验，管线另有三个肿瘤资产。公司未公开员工数。

              Pathos 将竞争差异化定义为两点叠加：最大规模的自研多模态肿瘤数据集（声称超过 200 PB，并与患者结局关联），以及持续学习的 AI 平台。这让它区别于纯计算型 AI
              公司和传统药企收购方。公司强调，每个完成的试验都会反哺下一个试验，形成学习飞轮，持续放大效率和证据质量。
