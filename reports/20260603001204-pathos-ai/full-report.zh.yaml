      - number: '3.3'
        title: 数据平台与相邻替代品：最难察觉的竞争来自分发与证据
        blocks:
          - type: paragraph
            body: >-
              Pathos 面临的非显性威胁不只是另一家 AI 发现初创公司，而是能够决定哪些资产获得证据、采用和制药关注的肿瘤数据及工作流层。Tempus 已经嵌入分子分型，并证明它能直接接入 Flatiron 的
              OncoEMR；Caris 和 Flatiron 也已把基因组、影像和真实世界数据组合成商业研究产品。ConcertAI 从企业侧沿同一模式推进，为生命科学用户打包肿瘤数据集和智能体 AI
              工具，而不是面向单一管线投资者。Foundation Medicine 模态更窄，但仍然强大，因为 Roche 将其定位在 300 多个癌症驱动基因和全球 CGP 采用之上。相邻 AI
              生物技术玩家进一步扩大威胁面。Owkin 结合因果 AI、病理、空间组学和制药合作；Valo 推进 AI 赋能的人类因果生物学和闭环化学；Boundless 聚焦 ecDNA 肿瘤切入点；Absci 展示 AI
              设计生物制剂可能是什么样；Ikena 并入 ImageneBio 则提醒，资本再配置能在一个表面同业成为耐久竞争者前就将其抹去。对 Pathos 来说，教训是数据访问、工作流分发和伙伴信任可能与模型质量同样重要。
