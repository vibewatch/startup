      - number: '1.4'
        title: 平台架构与管线
        blocks:
          - type: paragraph
            body: >-
              PathOS 平台围绕三个引擎组织。Scout 是 AI 赋能的资产筛选引擎，扫描所有在研疗法，将每项疗法匹配到最可能受益的患者亚群，并输出排序列表。Sprint 指小型自治临床执行团队（Sprint
              Pods），在 Pathos 内部像独立迷你生物技术公司一样运作，专注把特定资产从一个里程碑推到下一个里程碑。Foundry 是共享 AI 核心，由与 Tempus 和 AstraZeneca
              合作构建的肿瘤基础模型驱动；Foundry 也连接 Pathos 的实验室闭环 验证系统。

              截至本次报告生成日，Pathos 管线包括四个项目。Pocenbrodib（P-300，原 FT-7051）是从 Novo Nordisk 于 2023 年引进的 CBP/P300 抑制剂（原开发方：Forma
              Therapeutics）。该项目于 2025 年 3 月 20 日进入转移性去势抵抗性前列腺癌 1b/2a 期临床试验（NCT06785636），目标入组约 203 名患者。P-500（PRT811）是
              2024 年 8 月从 Prelude Therapeutics 引进的可入脑 PRMT5 抑制剂；1 期已完成，并在 IDH+ 高级别胶质瘤中显示经确认的完全缓解，Pathos 计划推进由生物标志物驱动的 2
              期试验。DO-2 是来自 DeuterOncology（Belgium）的氘代第三代 MET 激酶抑制剂，Foundry 识别后，Pathos 于 2026 年 5 月取得多数股权并完成收购；1 期在可评估的
              MET exon 14 跳跃突变 NSCLC 患者中显示 100% 肿瘤缩小，外周水肿为 5%，竞争药物为 62–82%。Milademetan（MDM2 抑制剂，来自 2024 年 1 月 Rain
              Oncology 收购）曾处 3 期阶段，但收购后未再出现在 Pathos 公开沟通中，引出信息新鲜度和管线重心问题。

              Pathos 声称可访问超过 200 PB 多模态肿瘤数据，约为 The Cancer Genome Atlas（TCGA）规模的 50 倍。这些说法来自公司口径，尚未获得独立验证。
