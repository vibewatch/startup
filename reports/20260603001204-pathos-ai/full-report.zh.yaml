      - number: '4.2'
        title: 收入模型、商业化动作与公开牵引力
        blocks:
          - type: paragraph
            body: >-
              Pathos 不应按具备可观察商业队列的软件公司建模。公开叙事是一家临床阶段肿瘤平台：收购或许可资产，用多模态数据和 AI
              改进试验设计，最终通过合作、许可、里程碑、版税或资产退出捕获价值。这可能在经济上有吸引力，但截至本次报告生成日，本章审阅的公开来源没有披露
              ARR、确认收入、收入结构、软件定价、服务定价、续约率、客户数量，或任何其他能支撑传统收入质量评估的当前变现指标。

              唯一公开披露的具体合作经济收益方向相反：Pathos 称其 Tempus 和 AstraZeneca 协议包括向 Tempus 支付 $200M 数据许可和模型开发费用。这是真实经济承诺，但不能证明 Pathos
              有流入收入。公开商业化动作因此应理解为业务拓展和治疗资产策略，而不是企业销售。牵引力的最佳外部证据，是公司能融资、签下重要交易对手，并通过 Rain Oncology 和 DeuterOncology
              继续扩展管线。这是有意义的战略验证，但不等同于已验证的经常性商业收入。
