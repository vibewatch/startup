  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览：Pathos 面临集中的伙伴、治理和早期临床风险
        blocks:
          - type: paragraph
            body: >-
              Pathos 的风险还不是晚期生物科技公司的那种风险；它的风险来自一个高度集中的 AI
              原生肿瘤运营模型。公司试图把外部数据权利、模型建设、生物标志物逻辑、资产交易和试验执行拼成一个自我改进系统。这个结构带来上行空间，也把多个失效模式集中在同一条运营链上。如果伙伴数据权利收窄、生物标志物逻辑无法泛化、试验入组停滞，或治理标准不达标，系统可能在收入或关键疗效到来之前就在多个点断裂。因此，风险热力图把数据权利集中、法律和同意不确定性、早期临床执行和融资依赖放在登记册高位。


              这不是纯理论担忧。公开记录已经显示：Pathos 严重依赖 Tempus 的数据规模和试验赋能；公司有多个收购或授权资产，仍需要整合和排序；关于 PathOS
              输出在影响决策前如何验证，公开治理细节很少。公司仍是私营，投资者拿不到上市精准肿瘤公司通常会提供的风险因子密度。正确姿态是：除非私有尽调材料证明相反，否则假设剩余风险仍高。
