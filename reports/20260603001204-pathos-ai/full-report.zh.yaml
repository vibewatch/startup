      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              多股结构性力量推动 AI 赋能肿瘤药物发现需求。药物开发失败率仍极高——肿瘤药从 1 期到监管获批的成功率约 5%——这给用 AI 改进资产筛选和试验设计创造了强商业动机（Springer 2025
              综述）。IQVIA 报告 2024 年肿瘤试验启动 2,162 项（较 2019 年 +12%），2024 年全球推出 25 种新型肿瘤活性物质，2020–2024 年平均每年 26 种，高于 2015–2019
              年每年 16 种，说明管线生产力持续，AI 优化工具仍有需求。FDA 的 Real-World Evidence Framework（2018）及后续指南正式为部分申报打开 RWE 证据标准，形成监管顺风。NGS
              测序成本下降，让大规模多组学数据集以更低单样本成本成为可能；NGS 市场预计从 2023 年 $12.98B 增至 2035 年 $97.81B，CAGR
              18.3%。Tempus–AstraZeneca–Pathos AI 合作构建最大多模态肿瘤基础模型（2025 年 4 月，向 Tempus 合计支付 $200M），体现大型药企正在主动共同投资 AI
              数据基础设施。GrandView Research 预计 AI 在临床试验中的增长显著，驱动因素包括更快招募、合成对照臂和生物标志物入组标准需求。采用约束同样实质且持久。HIPAA（美国）和
              GDPR（欧盟）限制跨机构数据流动；联邦学习等隐私保护架构（Owkin 已采用）正在成为商业前提。既有平台 Tempus AI 与 Caris Life Sciences
              已建立稳固制药关系，切换成本高：多年期纵向研究项目把平台数据嵌入多个治疗项目，迁移昂贵且缓慢。AI 生成药物发现假设尚无明确 FDA
              监管路径，平台衍生候选药物面临审批路径不确定性。自研多模态数据集搭建资本强度高——Pathos AI 未披露数据集成本——而 Pathos 声称拥有 200+ PB
              数据集缺乏独立验证，构成尽调缺口。Springer（2025）综述还指出，肿瘤 AI 主要在单中心数据上做回顾性验证，限制真实世界泛化能力。
