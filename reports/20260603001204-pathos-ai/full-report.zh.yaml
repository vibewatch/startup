        title: 公开可比公司显示，Pathos 已按严肃 AI 生物科技平台定价
        blocks:
          - type: paragraph
            body: >-
              最干净的公开可比组显示，尽管没有公开收入，Pathos 仍处在上市 AI 生物科技估值阵列的中间。Tempus 在 2026 年 5 月下旬市值约 $8.29 billion，支撑来自 $348.1
              million 的 Q1 收入，以及接近 $1.6 billion 的全年收入指引。Caris 报告 Q1 收入 $216.2 million，并在 2025 年 10-K 中披露非关联方持有股份的合计市值约
              $3.87 billion。Recursion 约 $1.6 billion，基本等于 Pathos 私募估值；Schrödinger 和 Absci 低于 $1.0 billion，Relay 更接近 $2.9
              billion。


              这个比较不能证明 Pathos 被高估，但能证明 Series D 要求投资者把公司按不只是早期实验载体来承销。Pathos
              的估值更接近上市平台型生物科技同行，而不是典型不透明、收入前私营生物科技公司。因此，可比表把判断推向「偏紧但不离谱」区间：如果平台真能跨多个资产复利，这个估值说得通；但相对于今天的公开运营披露水平，要求很高。
