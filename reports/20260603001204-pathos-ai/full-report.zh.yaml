    type: stack
    layout: wide
    summary: PathOS 围绕具体资产，叠加外部肿瘤数据、共享 AI 核心、决策引擎和试验执行。
    data:
      layers:
        - label: 数据基础
          description: 临床、分子、影像和结果数据流入模型训练和亚组分析。
          detail: Pathos 声称拥有 >200 PB，Tempus 合作扩大了可访问的肿瘤记录基础。
        - label: 核心智能
          description: Foundry 汇聚多模态证据，并把组合学习沉淀到各项目中。
          detail: 共享 AI 核心、因果建模和实验室闭环验证，构成其可复用护城河主张。
        - label: 决策引擎
          description: Scout 及相关工作流逻辑把模型输出转成资产和生物标志物选择。
          detail: 输出包括资产排序、患者亚组假设和生物标志物驱动试验设计输入。
        - label: 执行层
          description: Sprint 小组把入选资产推进成可运营的临床项目。
          detail: 嵌入式 AI 科学家、工程师和临床负责人推动资产跨过开发里程碑。
        - label: 项目输出
          description: 公开组合就是 PathOS 主张接受检验的地方。
          detail: Pocenbrodib、P-500、DO-2 和 Rain 衍生资产构成当前证据基础。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE012
      - CE013
      - CE024
      - CE034
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: Pathos 把药物开发描述为一条可重复序列：从数据和外部资产获取，走到生物标志物指导下的试验执行。
    data:
      nodes:
        - id: external-data
          label: 多模态肿瘤数据
        - id: foundry
          label: Foundry 分析
        - id: asset
          label: 外部资产或自有项目
        - id: biomarker
          label: 生物标志物策略
        - id: trial
          label: Pathos 赞助试验
        - id: learning
          label: 结果反馈
      edges:
        - source: external-data
          target: foundry
          label: 训练 / 评分
        - source: foundry
          target: asset
          label: 排序 / 收购
        - source: asset
          target: biomarker
          label: 匹配 MOA 与亚组
        - source: biomarker
          target: trial
          label: 设计并入组
        - source: trial
          target: learning
          label: 观察结果
        - source: learning
          target: foundry
          label: 复合洞察
    claimRefs:
      - CE003
      - CE004
      - CE006
      - CE010
      - CE024
      - CE033
      - CE045
  - id: FE003
    title: 关键依赖图
    type: dag
    layout: wide
    summary: 公开可见的 Pathos 技术栈高度依赖 Tempus 的数据和试验赋能，也依赖公共卫生规则来实现肿瘤数据的隐私安全复用。
    data:
      nodes:
        - id: pathos
          label: Pathos
        - id: tempus
          label: Tempus 数据 / TIME 网络
        - id: astrazeneca
          label: AstraZeneca 合作
        - id: hhs
          label: HIPAA 去标识化规则
        - id: sites
          label: 试验中心和研究者
        - id: patients
          label: 符合条件的生物标志物定义患者
      edges:
        - source: hhs
          target: tempus
          label: 隐私边界
        - source: tempus
          target: pathos
          label: 数据 + 费用 + 入组支持
        - source: astrazeneca
          target: pathos
          label: 共同开发语境
        - source: tempus
          target: sites
          label: 网络赋能
        - source: sites
          target: patients
          label: 筛选 / 入组
        - source: patients
          target: pathos
          label: 试验结果
    claimRefs:
      - CE011
      - CE013
      - CE014
      - CE041
      - CE045
      - CE046
  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    layout: standard
    summary: 公开证据在交易和试验启动上最强，在可衡量的平台表现和治理上较弱。
    data:
      columns:
        - 公开证据深度
        - 运营证明
        - 剩余尽调负担
      rows:
        - label: 资产授权 / 收购
          values:
            - 高
            - 中
            - 中
        - label: Pathos 赞助试验启动
          values:
            - 高
            - 中
            - 中
        - label: 生物标志物 / 亚组逻辑
          values:
            - 中
            - 低
            - 高
        - label: Foundry 决策质量
          values:
            - 中
            - 低
            - 高
        - label: 安全 / 模型治理
          values:
            - 低
            - 低
            - 高
    claimRefs:
      - CE020
      - CE024
      - CE033
      - CE040
      - CE041
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Pathos 当前公开客户旅程从战略引荐和资产交易走到现场试验执行，但仍缺少透明的续约指标。
    data:
      items:
        - label: 战略关系
          detail: 在任何规模化客户指标可见之前，Pathos 先与药企、数据方和资产交易对手对齐。
        - label: 运营导入
          detail: 团队把关系转化为试验设计、生物标志物逻辑或资产整合工作。
        - label: 现场部署
          detail: 最清楚的公开案例，是由 Tempus 赋能的 pocenbrodib 研究，正在主动匹配患者。
        - label: 结果生成
          detail: 运营结果必须先证明价值，之后才能假设更广泛的客户扩张。
        - label: 扩张决策
          detail: Pathos 仍需要公开证据证明续约、账户增长或多元化客户赢单。
    claimRefs:
      - CU003
      - CU007
      - CU008
      - CU011
      - CU031
      - CU038
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 公开采用漏斗很窄：从关系新闻走到少数具名现场证明点。
    data:
      items:
        - label: 具名战略交易对手
          value: 4
        - label: 具名现场运营证明点
          value: 2
        - label: Pathos 赞助的具名研究
          value: 1
        - label: 已披露公开留存指标
          value: 0
    claimRefs:
      - CU004
      - CU007
      - CU008
      - CU011
      - CU028
      - CU039
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: standard
    summary: 公开证明质量在关系存在上最强，在持久变现上最弱。
    data:
      columns:
        - 具名证明
        - 运营具体度
        - 留存可见度
      rows:
        - label: Tempus 关系
          values:
            - 高
            - 高
            - 低
        - label: AstraZeneca 合作
          values:
            - 高
            - 中
            - 低
        - label: 资产交易对手
          values:
            - 中
            - 低
            - 低
        - label: 更广泛服务商 / 药企基础
          values:
            - 低
            - 低
            - 低
    claimRefs:
