      - number: '8.3'
        title: 结果离散度极大，情景分析比点估值更重要
        blocks:
          - type: paragraph
            body: >-
              单一估值数字会掩盖本案核心事实：Pathos 的结果离散度异常大。乐观情景很容易写。如果肿瘤基础模型逻辑跑通，如果 Tempus/AstraZeneca 合作产出可复制洞见，如果
              pocenbrodib、P-500 和更新来源的资产展现真实临床杠杆，那么当前私募估值可能显得保守。在那个世界里，Pathos 会从 AI 药物开发叙事升级为多资产、数据护城河平台，足以支撑数十亿美元级上市估值。


              悲观情景同样直接。如果早期临床项目令人失望，如果 Pathos/Tempus 关系比预期更昂贵或更不持久，如果公开市场继续压缩 AI
              生物科技倍数，或隐藏融资条款稀释未来投资者，那么当前估值可能偏激进。因此，敏感性条和估值区间图采用粗略公开区间，而不是虚假精确的 DCF。在本章框架下，Pathos
              看起来是一只值得跟踪的标的：上行真实存在，但当前价格已经假设的成功多于公开记录目前能验证的成功。
