      - number: '5.3'
        title: 依赖与控制：最大的技术杠杆伴随外部数据、隐私和治理风险
        blocks:
          - type: paragraph
            body: >-
              Pathos 的技术优势，也是它最大的依赖栈。Tempus 和 AstraZeneca 合作具有战略吸引力，因为它把 Pathos 扩展到自身内部数据足迹之外，但也带来实质交易对手风险。公开看，Pathos 依赖
              Tempus 提供去标识化肿瘤数据、企业级多模态基础设施，并且——借 TIME Network 案例研究可见——甚至获得可衡量的试验入组帮助。这种集中不必然是坏事，但意味着从模型到临床执行的路径并非完全由
              Pathos 独自控制。如果合作经济条款、数据权利或交付优先级变化，公开技术论点也会随之变化。


              已审阅公开材料也没有达到机构投资者理想中应有的治理深度。HHS 提醒受监管实体，即便妥善去标识化的健康数据仍有一定残余再识别风险；NCI 和多篇肿瘤 AI
              综述强调，生物标志物工作流、同意、隐私和模型可靠性仍是规模化采用的不小障碍。The ASCO Post 和 Springer
              综述尤其切中要害，因为它们追问责任、同意、可解释性和训练数据质量——当平台影响资产筛选或试验设计时，这些类别会变得尖锐。Pathos
              的招聘页面显示技术招聘和基础反欺诈控制，但公司未公开信任中心、运行时间历史、公开模型卡或已验证平台 KPI 仪表盘。对尽调而言，控制体系叙事方向上可行，但公开文档仍不足。
