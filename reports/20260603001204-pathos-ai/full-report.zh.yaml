      - CR037
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自融资强度、缺失的经济指标、公开可比公司比较和情景分散度。
    data:
      nodes:
        - id: capital
          label: 大额私募融资上台阶
        - id: proof
          label: 公开经济 / 临床证明有限
        - id: comps
          label: 公开可比公司接近或低于当前标记估值
        - id: dispersion
          label: 情景分散度宽
        - id: track
          label: 跟踪建议
      edges:
        - source: capital
          target: proof
          label: 信号强但不完整
        - source: proof
          target: comps
          label: 需要三角验证
        - source: comps
          target: dispersion
          label: 波动性重要
        - source: dispersion
          target: track
          label: 价格纪律
    claimRefs:
