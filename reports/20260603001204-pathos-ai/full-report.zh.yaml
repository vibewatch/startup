  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景：Pathos 拿到溢价私募估值，但没有公开财务数据
        blocks:
          - type: paragraph
            body: >-
              Pathos 最新公开融资为估值分析设定起点。公司在 2025 年 5 月宣布完成 $365 million Series D，投后估值约 $1.6 billion；就在 7 个月前，它刚宣布以 $600
              million 投后估值完成 $62 million Series C。这意味着短期内披露估值约上调
              2.7x；对于一家仍不披露收入、ARR、利润率或现金消耗的公司，这是一轮有意义的重新定价。结果是，估值故事由融资动能、战略叙事和平台可选性驱动，而不是传统财务证据。


              SEC 记录提供方向性帮助，但不足以填补缺口。Form D 文件确认公司在 2023、2024 和 2025 年反复融资，但没有说明最新一轮中多少是新股、多少是老股交易，普通股之上有哪些优先权或投资者权利，或
              Pathos 在进入 Tempus 与 AstraZeneca 合作后还剩多少现金。因此，$1.6 billion
              估值是有用信号，但还不是完全可承销价格。投资者应把它视为协商形成的私募估值，仍需用公开可比公司和情景分析三角校准。
