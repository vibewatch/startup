  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构：PathOS 是运营模型，不只是单一模型
        blocks:
          - type: paragraph
            body: >-
              Pathos 公开材料持续把公司描述成不只是拥有一个领先资产的传统生物技术公司。核心产品主张是名为 PathOS 的运营模型，它围绕共同肿瘤数据层和湿实验室反馈闭环，整合 Foundry、Scout、Sprint
              三个命名引擎。Foundry 被定位为共享 AI 核心，跨项目累积学习；Scout 从多模态证据中优先排序资产和患者亚群；Sprint
              则是执行层，把选定资产从一个临床里程碑推向下一个。这对尽调很重要，因为技术故事和资产故事不可分割：Pathos
              要求投资者相信，同一套数据和决策系统可以反复寻找、筛选并推进外部肿瘤资产，效果优于传统生物技术工作流。


              公开记录中最强的证明，是模块描述足够具体，而且官网首页、平台页和管线页的运营模型叙事一致。Pathos 声称可访问超过 200 PB 多模态肿瘤数据，并将其与生物标志物发现、患者选择和试验设计配对。外部
              Tempus 合作提供了重要的第二见证：Tempus 称其去标识化肿瘤数据将用于构建共享基础模型，而 Pathos 称完成后的模型将在三方之间共享。因此，下方产品架构图和模块矩阵把 PathOS
              视为一套整合栈，依赖外部数据、内部 AI 决策和资产级执行，而不是独立软件 SKU。
