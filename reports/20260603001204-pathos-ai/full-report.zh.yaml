      - CU007
      - CU008
      - CU025
      - CU029
      - CU039
  - id: FU004
    title: 留存 / 重复队列
    type: flow
    layout: standard
    summary: 由于公开队列数据缺失，读者应把耐久性视为一条未解决的尽调路径，而不是已被证明的增长引擎。
    data:
      nodes:
        - id: headline
          label: 关系新闻
        - id: deployment
          label: 运营部署
        - id: renewal
          label: 续约 / 扩张
        - id: opaque
          label: 公开不透明
      edges:
        - source: headline
          target: deployment
          label: 有时被证明
        - source: deployment
          target: renewal
          label: 未披露
        - source: renewal
          target: opaque
          label: 指标缺失
    claimRefs:
      - CU028
      - CU029
      - CU035
      - CU040
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: Pathos 最重要的风险，大多落在中高发生概率和高到严重影响区间。
    data:
      columns:
        - 发生概率
        - 严重性
        - 剩余风险
      rows:
        - label: Tempus 集中度
          values:
            - 高
            - 严重
            - 高
        - label: 隐私 / 同意 / 责任
          values:
            - 中
            - 高
            - 高
        - label: 早期临床执行
          values:
            - 中
            - 严重
            - 严重
        - label: 治理不透明
          values:
            - 中
            - 高
            - 高
        - label: 融资依赖
          values:
            - 中
            - 高
            - 高
    claimRefs:
      - CR001
      - CR006
      - CR007
      - CR014
      - CR024
      - CR032
      - CR038
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 法律、数据、合作方和融资冲击，都会传导到试验速度、临床证明和未来估值。
    data:
      nodes:
        - id: privacy
          label: 隐私 / 同意风险
        - id: partner
          label: Tempus / 合作方集中度
        - id: clinical
          label: 试验执行和疗效
        - id: governance
          label: 治理不透明
        - id: capital
          label: 融资依赖
        - id: value
          label: 估值 / 信心影响
      edges:
        - source: privacy
          target: partner
          label: 合同收紧
        - source: partner
          target: clinical
          label: 数据或入组支持变化
        - source: governance
          target: clinical
          label: 验证不佳伤害执行
        - source: clinical
          target: capital
          label: 证明变弱推高融资需求
        - source: capital
          target: value
          label: 稀释 / 重新定价风险
        - source: privacy
          target: value
          label: 法律 / 声誉拖累
    claimRefs:
      - CR002
      - CR004
      - CR005
      - CR013
      - CR014
      - CR024
      - CR039
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 公开风险集中在少数外部合作方、监管机构和内部治理未知项上。
    data:
      nodes:
        - id: pathos
          label: Pathos
        - id: tempus
          label: Tempus
        - id: astrazeneca
          label: AstraZeneca
        - id: rules
          label: HHS / FDA / NCI
        - id: sites
          label: 试验中心
        - id: capital
          label: 私人资本
      edges:
        - source: tempus
          target: pathos
          label: 数据 + 费用 + TIME
        - source: astrazeneca
          target: pathos
          label: 战略验证
        - source: rules
          target: pathos
          label: 隐私和证据规则
        - source: pathos
          target: sites
          label: 试验执行
        - source: capital
          target: pathos
          label: 融资跑道
        - source: sites
