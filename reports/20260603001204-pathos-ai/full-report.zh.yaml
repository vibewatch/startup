  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局结构：Pathos 夹在发现引擎与肿瘤数据既有玩家之间
        blocks:
          - type: paragraph
            body: >-
              Pathos 周围的竞争图谱比普通生物技术同业更宽，因为 Pathos 想把几类工作压进一个运营模型。Pathos
              公开材料将公司表述为重新定义肿瘤药物开发、推进精准构建管线，而不是销售独立软件席位，也不是从零发明每个分子。这意味着直接可比对象不只是其他肿瘤生物技术公司。Pathos 与
              Recursion/Exscientia、Insilico、Schrödinger、Relay 等 AI 优先发现平台竞争技术可信度、资本和差异化资产。同时，它也与
              Tempus、Flatiron、Caris、ConcertAI、Foundation Medicine
              等肿瘤数据和工作流既有玩家争夺多模态数据、真实世界证据和临床医生工作流分发。Owkin、Valo、Boundless、Absci 以及原 Ikena 平台等相邻 AI
              生物技术玩家也重要，因为它们显示了行业走向，以及资本、数据或证明点变化时竞争压力会多快转向。结果是一个夹心位置：Pathos 比多数发现同业更贴近临床，但商业化程度远低于它也必须学习或围绕合作的肿瘤数据既有玩家。
