        - label: 披露质量改善
          value: 7
    claimRefs:
      - CV022
      - CV024
      - CV025
      - CV029
      - CV032
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 当前标记估值接近基准情景；若证明产出滞后，下行空间真实存在，只有平台能跨资产复利时才有显著上行。
    data:
      items:
        - label: 悲观
          low: 700
          value: 850
          high: 1000
        - label: 基准
          low: 1400
          value: 1600
          high: 1800
        - label: 乐观
          low: 2500
