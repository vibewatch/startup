      - number: '3.2'
        title: 直接 AI 药物开发同业：发现深度更强，临床证明不一，耐久性参差
        blocks:
          - type: paragraph
            body: >-
              在直接 AI 药物开发同业中，没有一家与 Pathos 完全匹配，但每一家都压迫 Pathos 论点的不同部分。Recursion 加 Exscientia
              是最清晰的端到端发现重量级玩家：两家公司合并时明确主打具备端到端能力的合并领导者，因此成为 AI 规模和生成式化学同处一屋檐下的最佳公开案例。Insilico 在纸面上拥有最清晰的 AI 平台广度，项目超过 40
              个、13 条已获 IND 放行的管线，并与 Lilly 达成规模足够像真实生物医药验证事件的合作。Schrödinger 又不同：它是经济模型最容易看懂的同业，因为软件许可和合作经济收益可见，商业模式看起来比多数
              AI 生物技术故事更耐久。Relay 的强项不是泛化 AI 叙事，而是基于运动的蛋白科学和正在临床推进的肿瘤管线，包括已对外授权资产。BenevolentAI 是警示案例。其 Merck 合作显示真实伙伴验证，但
              2024 年战略重置和 2025 年退市路径说明，一旦资本市场和管线进展无法互相强化，AI 生物技术 叙事会迅速收缩。与这一组相比，Pathos
              在临床资产分诊和生物标志物指导开发上更有辨识度，但分子设计深度尚未充分证明。
