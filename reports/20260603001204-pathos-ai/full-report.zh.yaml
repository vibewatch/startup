  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围
        blocks:
          - type: paragraph
            body: >-
              Pathos AI 位于三个分析上可拆分、战略上彼此咬合的肿瘤市场交汇处。第一，AI
              辅助肿瘤药物发现：买方是大型和中型制药研发机构，目标是更高效识别并验证临床资产；现有替代方案包括内部生物信息学团队、与癌症中心的学术合作，以及传统统计方法做候选筛选。第二，肿瘤真实世界证据（RWE）：生物医药公司、卫生技术评估机构和监管方购买回顾性或前瞻性患者数据集，用于支持监管申报、上市后监测和支付方谈判。第三，精准肿瘤诊断：二代测序（NGS）、多组学画像和伴随诊断既是临床照护层，也为
              AI 训练提供数据底座。Pathos AI 直接可服务市场不包括药品制造、临床 CRO 运营服务、医院 EHR 软件和药品销售收入——这些都相邻，但不属于平台许可模式。癌症流行病学背景很大：NCI 估计美国
              2025 年新增癌症诊断约 2.04M 例，WHO 报告 2022 年全球约 10M 例癌症死亡，SEER 预计 2026 年美国新增约 2.11M 例和 626K
              例癌症死亡。这样的患者规模创造了纵向数据机会，肿瘤 AI 平台竞相聚合。市场边界高度有争议：Tempus AI 和 Caris Life Sciences 都同时覆盖诊断、RWE 和 AI
              建模，因此竞争市场划分取决于假设；若不调整口径，不同分析师估计不可直接比较。
            claimRefs:
