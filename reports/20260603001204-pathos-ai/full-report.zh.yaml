            body: >-
              这是公开客户故事中最弱的一环。Pathos 没有披露
              NRR、GRR、流失、合同期限、客户满意度或扩张收入。也没有定价或包装细节，无法让投资者推断账户如何从试点走向持续支出。这意味着本章能验证采用事件，却不能验证持久性。留存表刻意保留大量空值，因为这才是公开证据的真实状态。


              缺失数据对 Pathos 比对成熟同行更重要，因为少数已命名关系容易制造虚假信心。一个合作标题可能代表长期项目、短期工作说明书，或一次性交易。同样问题也适用于 Novo Nordisk、Prelude、Rain
