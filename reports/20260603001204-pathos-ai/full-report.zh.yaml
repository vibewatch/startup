      - number: '7.2'
        title: 法律、监管和数据风险始于隐私、同意和未定型的 AI 责任
        blocks:
          - type: paragraph
            body: >-
              法律和监管栈是结构上最重要的风险区域，因为它贯穿 Pathos 的每个项目。HHS 明确指出，去标识化健康数据并非没有风险；即使正确遵循隐私规则，残余再识别风险仍然存在。这个问题很关键，因为 Pathos
              的公开逻辑依赖大规模患者关联肿瘤数据池，以及用 Tempus 数据构建的基础模型。如果监管者、交易对手或企业客户对现有去标识化做法的舒适度下降，Pathos 核心训练和证据层可能变得更贵、更慢或受限更多。


              同时，肿瘤专属 AI 责任仍未定型。The ASCO Post 把 AI 指导诊断和治疗的责任标准描述为一个演进中的问题；Springer 综述则提示自动化偏见、知情同意、可解释性，以及训练数据本身的偏差。NCI
              又增加了一项采用约束：生物标志物检测很重要，但对大多数患者而言并非常规流程，这意味着 Pathos 以生物标志物为核心的逻辑仍会碰到真实世界工作流摩擦。FDA 的 DTC 指南并不直接针对
              Pathos，但强化了一个总体结论：数据驱动健康工具的证据质量和监督差异很大。结果是：法律和监管风险不是 Pathos 的边缘问题，而是核心商业模式的一部分。
