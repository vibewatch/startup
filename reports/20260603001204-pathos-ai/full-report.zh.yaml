      - number: '4.3'
        title: 成本结构、烧钱基准与单位经济
        blocks:
          - type: paragraph
            body: >-
              Pathos 公开单位经济数据基本不可得，因此本章采用生物技术优先的基准集，而不是强行套用 SaaS 指标。可能的成本桶很直接：pocenbrodib 持续临床执行，P-500 和 DO-2
              等额外资产准备，与数据和模型开发绑定的付款，以及维持发现和临床开发组织的核心运营支出。肿瘤试验文献解释了为什么即便在商业化前，烧钱速度也可能维持高位。临床试验经济学综述强调，启动延迟、入组不足和基础设施碎片化会吞掉大量预算；公开肿瘤试验入组证据显示，入组放慢会直接拉长读出时间，从而延长融资窗口。

              公开可比公司强化了资本强度这一点。Relay 披露 2025 年 Q1 现金约 $710M，现金跑道延至 2029 年，但依赖 ATM 增发后，2026 年 Q1 仍报告现金
              $642.1M。Schrödinger 已有软件收入和合作发现经济收益，2026 年 Q1 仍报告现金 $406M、季度净亏损 $60M。Insilico 报告现金 $393.3M、2025 年收入
              $56.2M，说明 AI 赋能发现公司即便建立了比 Pathos 更明确的商业收入流，也可能继续依赖资本。合起来看，这些基准支持一个合理公开烧钱区间：一家试图在肿瘤领域跑平台加管线模式的公司，年烧钱大约
              $120M 至 $240M。在此基础上，Series D 单轮融资看起来可观，但并不过剩。
