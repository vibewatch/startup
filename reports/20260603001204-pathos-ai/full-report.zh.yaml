      - number: '5.2'
        title: 公开资产图谱：Pathos 正用许可和收购的肿瘤项目验证系统
        blocks:
          - type: paragraph
            body: >-
              公开管线狭窄但具体。Pathos 在管线页列出 pocenbrodib 和 P-500，2026 年公告又通过收购 DeuterOncology 加入 DO-2，并在 2024 年要约收购完成后保留 Rain 的
              milademetan 遗留所有权。Pocenbrodib 是最清晰的运营证明，因为 Pathos 已将其推进到由 Pathos 赞助的转移性去势抵抗性前列腺癌 1b/2a
              期研究。公司称该研究结合单药和三个联合用药臂，目标约 203 名患者，并直接建立在早期 FT-7051/COURAGE 经验之上。Tempus TIME 案例研究提供了另一项运营证明，显示 Pathos
              如何借助外部试验赋能网络识别前 10 名入组患者中的 6 名。


              P-500 和 DO-2 很重要，因为它们展示了公司的收购论点。Pathos 在此前 1 期工作显示 IDH 阳性高级别胶质瘤信号后许可引进 P-500；DO-2 则由 Pathos 于 2026 年收购，此前
              Foundry 据称基于机制、药代动力学和竞争定位将其提升为优先候选。这些资产不是随机新增；Pathos
              明确声称，平台能够发现低估的临床阶段药物，将它们重新映射到更合适的生物标志物定义人群，再沿更数据驱动的开发路径推进。这个主张值得跟踪，但距离端到端证明仍很远，因为公开证据偏重交易和试验启动里程碑，闭环绩效指标很少。
