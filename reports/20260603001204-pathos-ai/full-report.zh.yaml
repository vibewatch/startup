  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户可见度：公开证据显示的是企业级关系，不是广泛披露的客户基础
        blocks:
          - type: paragraph
            body: >-
              从客户披露角度看，Pathos
              不像传统软件公司或诊断公司。官网和融资材料没有披露客户数、ARR、留存或定价。公司转而把自己描述为与制药公司、生物科技公司、学术界和投资者合作，搭建新的肿瘤药物开发运营模型。这个定位很关键：它意味着短期买方更可能是企业级交易对手——战略制药合作者、数据网络或试验赋能伙伴——而不是大批购买标准化产品的肿瘤医生或医院。因此，客户细分表把
              Pathos 已命名的外部关系拆成联合开发伙伴、数据 / 试验赋能供应商、资产交易对手和临床用户。


              直接结论是，公开客户可见度仍低，尽管公开关系证据是真实的。Pathos 有足够证据证明外部方愿意与其合作，但不足以勾勒多元化客户账本。这与 Tempus、Flatiron、Foundation
              Medicine、Caris 和 ConcertAI 形成鲜明对比，后者都披露了更强的客户或使用规模说法。尽调中应把 Pathos
              视为由关系驱动的生物科技平台，外部需求信号正在出现，而不是已经透明规模化的商业平台。
