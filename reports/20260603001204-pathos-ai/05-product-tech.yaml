- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or issue
  - Current public status
  - Scope
  - What the evidence says
  - Gap
  rows:
  - - HIPAA de-identification
    - Framework exists but residual risk remains
    - Any model trained on de-identified patient-linked data
    - HHS says both Safe Harbor and Expert Determination still retain some re-identification risk
    - Need Pathos-specific de-identification method and monitoring details
  - - Biomarker validity
    - Clinically important but not universally routine
    - Patient selection and companion-diagnostic style workflows
    - NCI says biomarker testing is central to precision medicine but not routine for most patients
    - Need evidence that Pathos subgroup logic transfers into real enrollment and outcomes
  - - AI liability and consent
    - Regulatory / legal standards still evolving
    - Any AI-assisted oncology decision support
    - ASCO and Springer sources highlight liability, explainability, bias, and consent issues
    - Need model cards, oversight structure, and clinician accountability mapping
  - - Security / trust center
    - No public trust portal surfaced in reviewed Pathos materials
    - Enterprise diligence for data partners and sites
    - Pathos careers page shows hiring controls and anti-fraud messaging, not platform assurance
    - Need certifications, incident history, and change-control documentation
  - - Quality system for platform outputs
    - Not publicly described
    - Use of outputs in trial design or portfolio decisions
    - Public story is detailed on ambition but sparse on QA thresholds
    - Need internal validation SOPs and release governance
  notes: This is a control-readiness view, not a claim that Pathos is non-compliant; missing documentation is itself the main diligence issue.
