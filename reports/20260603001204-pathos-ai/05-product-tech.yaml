  title: Product architecture map
  type: stack
  layout: wide
  summary: PathOS layers external oncology data, a shared AI core, decision engines, and trial execution around specific assets.
  data:
    layers:
    - label: Data foundation
      description: Clinical, molecular, imaging, and outcome data feeding model training and subgroup analysis.
      detail: Pathos claims >200 PB and the Tempus collaboration expands the accessible oncology record base.
    - label: Core intelligence
      description: Foundry aggregates multimodal evidence and portfolio learning across programs.
      detail: Shared AI core, causal modeling, and lab-in-the-loop validation are presented as the reusable moat.
    - label: Decision engines
      description: Scout and related workflow logic convert model output into asset and biomarker choices.
      detail: Outputs include asset ranking, patient subgroup hypotheses, and biomarker-led trial design inputs.
    - label: Execution layer
      description: Sprint pods turn selected assets into operational clinical programs.
      detail: Embedded AI scientists, engineers, and clinical leaders move assets between development milestones.
    - label: Program outputs
      description: The public portfolio where PathOS claims are being tested.
      detail: Pocenbrodib, P-500, DO-2, and Rain-derived assets anchor the current evidence base.
