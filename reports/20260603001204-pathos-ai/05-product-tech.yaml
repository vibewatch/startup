tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current status / maturity
  - What it does
  - Differentiation claim
  - Diligence gap
  rows:
  - - Foundry
    - Pathos management and platform teams
    - Emerging / internally evidenced
    - Shared AI core for asset ranking, portfolio decisions, and lab-linked learning
    - Claims cross-program learning and AI-native portfolio selection
    - No public accuracy or decision-quality metrics
  - - Scout
    - Discovery / translational teams
    - Publicly described, not externally benchmarked
    - Prioritizes assets and responsive patient subgroups from multimodal evidence
    - Connects mechanism and subgroup selection before asset acquisition
    - No public benchmark against conventional BD workflows
  - - Sprint
    - Clinical development teams
    - In operation with active programs
    - Moves selected assets through biomarker-driven clinical execution
    - Small AI-enabled pods intended to compress decision cycles
    - No public cycle-time or cost-per-milestone data
  - - Pocenbrodib (P-300)
    - Clinical ops and oncology investigators
    - Active Pathos-sponsored phase 1b/2a
    - Lead CBP/p300 inhibitor program in mCRPC
    - Combines prior FT-7051 data with Pathos biomarker strategy
    - No public efficacy readout from Pathos-run study yet
  - - P-500 / PRT811
    - Translational oncology teams
    - Pre-mid-stage planning after prior phase 1
    - Brain-penetrant PRMT5 inhibitor for high-grade glioma / uveal melanoma
    - Prior phase 1 signal plus Pathos subgroup-selection thesis
    - No Pathos-generated clinical data yet
  - - DO-2
    - Portfolio / clinical strategy
    - Newly acquired in 2026
    - Third-generation MET inhibitor sourced through Foundry
    - Strong early METex14 response and edema differentiation claim
    - Integration and reproducing early signal remain unproven
  - - Milademetan / Rain assets
    - Corporate development
    - Owned but de-emphasized publicly
    - Legacy precision-oncology program from Rain acquisition
    - Expands owned asset base beyond two headline programs
    - Current prioritization is unclear from recent Pathos materials
  notes: Combines official Pathos disclosures with independent coverage; maturity reflects public proof, not internal readiness.
