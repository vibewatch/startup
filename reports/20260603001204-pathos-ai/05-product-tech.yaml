- id: pipeline-assets
  title: 'Public asset map: Pathos is proving the system through licensed and acquired oncology programs'
  body: 'The public pipeline is narrow but concrete. Pathos names pocenbrodib and P-500 on its pipeline page, while 2026 announcements add DO-2 via the DeuterOncology acquisition and preserve legacy ownership of Rain’s milademetan after the 2024 tender offer closed. Pocenbrodib is the clearest operating proof because Pathos has already moved it into a Pathos-sponsored phase 1b/2a study in metastatic castration-resistant prostate cancer. The company says the study combines monotherapy and three combination arms, targets about 203 patients, and builds directly on the earlier FT-7051/COURAGE experience. The Tempus TIME case study adds another operational proof point by showing how Pathos used an external trial-enablement network to identify six of the first ten enrolled patients.


    P-500 and DO-2 matter because they illustrate the company’s acquisition thesis. P-500 was licensed after prior phase 1 work showed signal in IDH-positive high-grade glioma, while DO-2 was acquired in 2026 after Foundry supposedly elevated it as a top candidate based on mechanism, pharmacokinetics, and competitive positioning. These assets are not random additions; Pathos is explicitly claiming that the platform can source undervalued clinical-stage drugs, remap them to better biomarker-defined populations, and then advance them through a more data-driven development path. That claim is credible enough to monitor, but still far from proven end to end, because public evidence is heavy on transaction and trial-start milestones and light on closed-loop performance metrics.'
