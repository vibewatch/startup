- id: TE002
  title: Workflow / use-case table
  columns:
  - Workflow step
  - Current workflow
  - Pathos solution
  - Measurable benefit cited publicly
  - Main limitation
  rows:
  - - Asset sourcing
    - Conventional biotech BD relies on networks and conferences
    - Foundry screens clinical and scientific data for undervalued assets
    - Deuter deal presented as a Foundry-sourced portfolio decision
    - No independent audit of sourcing precision
  - - Patient subgroup selection
    - Trial populations often selected with blunt eligibility filters
    - Scout links mechanisms to multimodal response and resistance signals
    - Pathos says P-500 and pocenbrodib strategies use biomarker-driven subgrouping
    - No public prospective hit-rate statistics
  - - Trial design
    - Standard phase transitions depend on slower manual synthesis
    - Sprint pods move assets from milestone to milestone with AI scientists and engineers embedded
    - Pathos says each trial becomes a smarter study through data feedback
    - No disclosed cycle-time delta versus peer trials
  - - Enrollment acceleration
    - Early oncology studies often suffer from slow site activation and patient matching
    - Tempus TIME network identified 6 of the first 10 matches in the pocenbrodib study
    - Named external proof that Pathos can plug into scaled enrollment infrastructure
    - Benefit currently depends on an external network
  - - Lab validation
    - Many AI drug-discovery stories stop at model output
    - Foundry claims lab-in-the-loop validation to test and reuse insights
    - Conceptually strengthens the learning flywheel
    - Public assay throughput and validation rules are undisclosed
  notes: Benefits are limited to claims actually disclosed in public Pathos or Tempus materials; absence of KPI disclosure is treated as a diligence gap.
