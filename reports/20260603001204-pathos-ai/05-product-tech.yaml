  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: Public trust center, external security certifications, model-governance documentation, and platform quality-system disclosures for PathOS.
    whyItMatters: Enterprise oncology partners and trial sites need evidence that the data and model stack meet auditable privacy, security, and change-control standards.
    diligencePath: Request SOC 2/ISO-style controls, data-governance policies, and any model-risk-management package from management.
    relatedQuestionRefs:
    - QE019
  - type: missing-source
    severity: material
    topic: platform-performance
    missingEvidence: Module-level uptime, model accuracy, screening yield, and biomarker hit-rate metrics for Foundry, Scout, and Sprint.
    whyItMatters: Without operating metrics, the public product story remains much harder to underwrite than the asset narrative.
    diligencePath: Ask for internal KPI dashboards covering asset ranking precision, enrollment acceleration, biomarker validation, and trial decision cycle time.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: wet-lab-scale
    missingEvidence: Pathos does not publicly disclose wet-lab footprint, assay throughput, or how often lab validation changes portfolio decisions.
    whyItMatters: The wet-lab loop is core to Foundry differentiation, so missing scale and throughput data limits conviction in the claimed learning flywheel.
    diligencePath: Request wet-lab capacity metrics, assay SOPs, and examples of lab evidence changing a go/no-go recommendation.
  - type: enumeration-incomplete
    severity: minor
    topic: public-pipeline
    missingEvidence: A comprehensive list of all active internal and partnered programs beyond the few assets named on the public pipeline page.
    whyItMatters: Public materials may understate the true breadth of the portfolio or hide deprioritized assets that influence platform learning.
    diligencePath: Request the full internal asset list with stage, mechanism, owner, and current decision status.
  - type: missing-source
    severity: material
    topic: technical-governance
    missingEvidence: Public documentation for data provenance, model update cadence, and validation thresholds before platform outputs are used in clinical design.
    whyItMatters: This is the line between a defensible operating system and a marketing layer wrapped around standard biotech development.
    diligencePath: Request model cards, validation summaries, and governance memos for any output used in trial design or asset acquisition decisions.
    relatedQuestionRefs:
    - QE024
