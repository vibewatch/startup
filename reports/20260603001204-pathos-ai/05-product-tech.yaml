callouts:
- calloutType: strength
  title: The strongest product proof is operational, not conceptual
  body: Pathos has moved beyond a homepage thesis by licensing assets, starting a Pathos-run trial, and adding third-party evidence that Tempus helped fill six of the first ten trial matches. That is much stronger than a generic AI-drug-discovery narrative, even if it still stops short of efficacy proof.
  claimRefs:
  - CE020
  - CE021
  - CE045
- calloutType: risk
  title: The platform story is highly Tempus-dependent
  body: The public Pathos stack now depends on Tempus for data scale, model-building input, and visible enrollment acceleration. That concentration boosts near-term capability but leaves a large share of the operating thesis outside Pathos' direct control.
  claimRefs:
  - CE013
  - CE014
  - CE015
  - CE016
  - CE045
  - CE046
- calloutType: insight
  title: Pathos is best understood as an AI-native asset arbitrage engine
  body: The combination of external asset sourcing, biomarker re-positioning, and trial execution suggests Pathos is trying to compound value by buying or licensing under-optimized oncology assets and then improving probability of success through data and execution rather than inventing every molecule from scratch.
  claimRefs:
  - CE017
