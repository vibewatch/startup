companyProfile:
  summary: "Pathos AI is a Chicago-based, clinical-stage AI-enabled biotechnology company that applies multimodal oncology data and proprietary AI to re-engineer drug development. Founded in 2022 by Eric Lefkofsky and Ryan Fukushima, Pathos raised approximately $467M including a $365M Series D in May 2025 at roughly $1.6B valuation. Its PathOS platform (Scout, Sprint, Foundry) identifies undervalued clinical assets, designs biomarker-driven trials, and builds oncology foundation models in partnership with AstraZeneca and Tempus. Lead asset pocenbrodib (CBP/p300 inhibitor) is in Phase 1b/2a clinical trial."
