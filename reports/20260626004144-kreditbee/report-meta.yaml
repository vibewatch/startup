  topStrengths:
    - Large repeat-heavy borrower franchise with corroborated AUM and activity scale
    - Blended marketplace plus NBFC model gives KreditBee product breadth and balance-sheet control
    - FY25 profitability and capital adequacy appear stronger than many subscale digital-lending peers
  topRisks:
