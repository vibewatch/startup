- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - evidence
  - diligence ask
  rows:
  - - Fast digital disbursal is enough differentiation
    - Banks and scaled NBFCs now market instant or pre-approved personal loans too
    - high
    - HDFC, ICICI, and Bajaj all publish digital personal-loan journeys and lower rate floors
    - What approval-speed or repeat-use advantage remains after the first loan?
  - - BNPL adjacency creates durable funnel power
    - Simpl and ZestMoney show BNPL reach can collapse under regulation or funding stress
    - high
    - Simpl halt and ZestMoney wind-down are direct adverse precedents
    - How much of KreditBee demand is checkout-driven versus recurring credit need?
  - - Category scale guarantees survival
    - ZestMoney still failed despite 17M users and 85K touchpoints
    - high
    - Large historical footprint did not prevent shutdown
    - What parts of KreditBee unit economics remain durable without subsidized capital?
  - - Private fintechs can stay opaque without cost
    - CASHe and CRED Cash opacity turns exact pricing and partner quality into diligence gaps
    - medium
    - Blocked or unusable official pages forced unknown cells
    - Can management provide lender roster, fee cards, and cohort performance on request?
  - - Superapps are only indirect threats
    - PhonePe and Paytm already have the user habit and the credit surface to route demand internally
    - high
    - Scale and product breadth are already live on official pages
    - How much of KreditBee acquisition depends on users who already live inside payment superapps?
  - - A bank transition is irrelevant to fintech competition
    - Slice’s bank posture can improve funding cost and trust if it deepens lending products
    - medium
    - Slice now markets itself explicitly as a bank with savings and UPI credit card
    - How far can regulated stack migration compress spreads in unsecured retail credit?
  - - RBI rules simply raise barriers for everyone equally
    - Rules may help trust but they also compress shallow app-only differentiation
    - medium
    - Digital Lending Directions standardize disclosures, servicing, cooling-off, and DLG framing
    - Which proprietary advantages remain after compliance becomes table stakes?
  - - KreditBee can win prime borrowers on price
    - Published bank floors already challenge that thesis
    - high
    - Banks advertise ~9.99%-10% floors versus higher specialist fintech starts
    - Is the target borrower really prime, or is the edge concentrated in thin-file segments?
  notes: Severity rates durability risk to KreditBee’s competitive position, not the intrinsic quality of the competitor named in the threat column.
