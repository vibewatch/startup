- id: switching-costs-moat-and-failure-evidence
  title: Switching cost is low; failure evidence says regulation and distribution dominate moat claims
  body: 'The category’s adverse evidence is stronger than its brand narratives. Simpl’s homepage now resolves to a parking page, and the Times of India reported that RBI ordered it to halt payments operations in 2025 because it lacked required authorization. Business Standard reported that ZestMoney wound down despite having reached 17 million registered users and 85,000 touchpoints at its peak. These are disconfirming signals against the idea that scale alone or a slick checkout layer creates a durable moat in Indian consumer credit. The more durable advantages are cheaper funding, cleaner compliance, privileged distribution, and underwriting data for thinner-file users. That is why Slice’s bank posture matters, why HDFC, ICICI, and Bajaj remain dangerous substitutes, and why PhonePe or Paytm can become stronger threats than smaller monoline lenders even if their current price tables are less transparent. For KreditBee, the implication is clear: defend the new-to-credit and speed-sensitive
    borrower funnel, because the prime unsecured segment is where rates and distribution are easiest for better-capitalized rivals to commoditize.'
