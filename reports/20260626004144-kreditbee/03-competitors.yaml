- id: TP003
  title: Pricing / packaging comparison
  columns:
  - provider
  - published product or package signal
  - APR / fee posture
  - what is explicit vs unknown
  - implication for KreditBee
  rows:
  - - KreditBee
    - Installment personal loan, fully online disbursal
    - 12% to 28% p.a.; up to 4.8% + GST processing fee
    - Explicit on official product page
    - Competitive in speed and range, not an obvious price outlier
  - - Freo / MoneyTap
    - Credit-line style personal loan up to ₹5 lakh
    - Starts at 13% p.a.; interest only on amount drawn
    - Explicit on retained product page
    - Competes on flexibility more than on a radically lower floor
  - - Fibe
    - Installment personal loan up to ₹10 lakh
    - Starts at 18% p.a.; fees from 2% + GST
    - Explicit on retained page
    - Direct peer with disclosed scale but not with the lowest rate floor
  - - CASHe
    - App-first personal credit
    - unknown
    - Official comparison pages inaccessible in this run
    - Must be treated as pricing unknown rather than assumed parity
  - - LazyPay
    - PayLater plus XpressLoan
    - 15% to 32% usual range; 2% processing fee
    - Explicit in explanatory product text
    - Higher public range than bank floors; stronger as short-cycle BNPL substitute
  - - HDFC Bank
    - Bank personal loan up to ₹50 lakh
    - Starts at 9.99%
    - Explicit on official page; exact realized spread still profile-dependent
    - Serious threat on prime borrowers and relationship-led distribution
  - - ICICI Bank
    - Bank personal loan up to ₹50 lakh
    - Starts at 9.99%; fees up to 2%
    - Explicit on official page
    - Similar rate-floor pressure with strong digital trust
  - - Bajaj Finance
    - Large-NBFC personal loan up to ₹55 lakh
    - 10% to 30%; fees up to 3.93%
    - Explicit on official page
    - Shows that non-bank incumbents can match fintech speed while staying more regulated and scaled
  - - Slice
    - UPI credit card plus bank bundle
    - unknown for comparable personal-loan APR in retained source set
    - Banking bundle is explicit; comparable lending fee table is not
    - Threat is funding-stack and habit, not yet a clean head-to-head APR table
  - - PhonePe / Paytm / CRED
    - Platform-based credit entry points
    - unknown on retained official consumer loan pages
    - Product breadth is clear; fee sheets are uneven or opaque
    - These players compete first on distribution, then on monetization detail
  notes: Unknown means the retained source set did not produce a stable, fetchable public rate card; cells are not backfilled from memory or generic comparison blogs.
