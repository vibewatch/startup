tables:
- id: TP001
  title: Competitor landscape table
  columns:
  - tier
  - representative names
  - core product or workaround
  - why the buyer considers it
  - displacement vector
  enumerationScope:
    coverage: partial
    basis: Covers the named direct fintech lenders, BNPL apps, incumbent lenders, platform entrants, and status-quo substitutes most visible in current public sources; excludes local NBFCs without national product disclosure.
  rows:
  - - Direct digital lenders
    - Freo / MoneyTap, Fibe, CASHe, Navi, Slice
    - Installment loans, credit lines, app-led consumer credit
    - Closest digital substitutes for a borrower seeking instant unsecured funds
    - Price-floor pressure, approval speed, underwriting overlap
  - - BNPL and checkout credit
    - LazyPay, historical Simpl, historical ZestMoney
    - Pay-later checkout plus small-ticket revolving or installment credit
    - Same urgent-spend job for commerce, bills, or short cash gaps
    - Merchant-side distribution and habit at checkout
  - - Incumbent private banks
    - HDFC Bank, ICICI Bank
    - Large-ticket personal loans through branch, app, and pre-approved channels
    - Trusted regulated lenders with lower published rate floors
    - Cheaper funding, existing salary-account relationship
  - - Large consumer-finance NBFC
    - Bajaj Finance
    - National omnichannel personal-loan and consumer-finance stack
    - Known alternative for unsecured cash needs and consumer financing
    - Aggressive distribution plus cross-sell economics
  - - Payments super-app entrants
    - PhonePe, Paytm
    - Loans layered onto UPI, recharge, merchant, and wallet surfaces
    - Huge traffic pools can route users into credit without separate acquisition
    - Embedded distribution and low marginal CAC
  - - Premium card-credit overlay
    - CRED
    - Rewards-led credit-card relationship plus adjacent lending surfaces
    - Competes for high-credit urban users, not for all borrowers
    - Brand, affluent cohort, credit-card habit
  - - Status quo and internal build
    - Existing bank card limits, salary advance, employer payroll advance, gold loan
    - Use existing relationship, secured borrowing, or employer cash bridge
    - Often easier than installing a new lending app for repeat borrowers
    - Relationship advantage and lower acquisition friction
  notes: Rows intentionally mix direct, adjacent, and substitute classes because the user job is urgent consumer credit, not one product taxonomy.
