- id: TP002
  title: Competitor profile table
  columns:
  - competitor
  - category
  - scale / funding signal
  - target segment
  - differentiation
  - limitation
  enumerationScope:
    coverage: partial
    basis: Profiles the direct lender set plus the most visible BNPL and platform substitutes using only evidence that was fetchable in this run; unknown cells remain explicit.
  rows:
  - - KreditBee
    - Direct lender / LSP + NBFC stack
    - 23 crore Indians claimed on home page; current source set does not establish funding here
    - Broad retail borrowers, including fast-disbursal users and thinner-file cohorts
    - Wide personal-loan range, quick disbursal, RBI-linked lender stack
    - Not obviously cheapest against bank rate floors
  - - Freo / MoneyTap
    - Direct lender / credit line
    - 10M+ downloads and 252K loans disbursed claimed
    - Urban salaried and self-employed users needing flexible drawdown credit
    - Credit-line construct lets borrower pay interest only on used amount
    - Scale and distribution smaller than super-apps; still above specialist minimum
  - - Fibe
    - Direct lender / installment loan
    - 39M+ downloads, ₹40,000Cr+ disbursed, 8,500+ partners claimed
    - Young working professionals and mid-income users underserved by banks
    - Largest disclosed scale in direct fintech source set
    - Published rate floor is higher than incumbent-bank floors
  - - CASHe
    - Direct lender / app-only credit
    - Unknown in accessible source set because official pages were blocked
    - Salaried urban borrowers, exact current segment unknown on accessible pages
    - Known market presence; still a live comparison name in the category
    - Public diligence visibility is poor; pricing and scale must stay unknown
  - - Navi
    - Direct lender / broader fintech stack
    - Exact scale unknown in accessible text extraction for this run
    - Mass retail borrowers; exact live segment detail unclear here
    - Has a cash-loan surface and wider fintech ambitions beyond one app flow
    - Accessible official rate card did not cleanly render during retrieval
  - - Slice
    - Bank-form consumer credit entrant
    - Bank positioning plus deposit product and UPI credit card surface
    - Younger digital-first users comfortable with app-first banking
    - Bank stack may improve funding cost and product cross-sell
    - Current public pages emphasize banking bundle more than explicit personal-loan pricing
  - - LazyPay
    - BNPL + consumer loan app
    - Scale not cleanly disclosed in retained page; product scope is clear
    - Shoppers and short-cycle credit users
    - 15-day pay-later plus XpressLoan in one surface
    - APR range sits above bank floors and comparable to specialist lenders
  - - Simpl
    - Historical BNPL competitor
    - Operationally impaired; homepage parked and RBI halt reported
    - Merchant-checkout BNPL users
    - Used to solve the same checkout-credit job quickly
    - Regulatory disruption appears severe
  - - ZestMoney
    - Historical BNPL competitor
    - 17M users and 85K touchpoints at peak before wind-down
    - Checkout-financing and BNPL users
    - Proof that BNPL could scale nationally
    - Also proof that scale did not guarantee durability
  - - HDFC Bank
    - Incumbent bank
    - National branch, app, and pre-approved offer distribution
    - Prime salaried and existing-relationship borrowers
    - Low disclosed rate floor and trust
    - May underserve thinner-file users relative to specialist apps
  - - ICICI Bank
    - Incumbent bank
    - National digital and branch network
    - Prime salaried and self-employed borrowers
    - 9.99% start, 72-month tenure, public fee disclosure
    - Same prime-borrower bias as large banks
  - - Bajaj Finance
    - Incumbent NBFC / consumer finance giant
    - National omnichannel reach; exact customer count not used here
    - Retail borrowers and consumer-finance users
    - Broad unsecured-finance stack and strong distribution
    - Can still price high on upper end of range
  - - PhonePe
    - Platform entrant
    - 65+ crore users and 4.7+ crore merchants claimed
    - Mass-market payments users who can be routed into credit
    - Overwhelming distribution and daily-use habit
    - No precise public personal-loan fee table retained here
  - - Paytm
    - Platform entrant
    - Public-company IR stack and broad merchant/business lending disclosure
    - Mass-market payments and merchant ecosystem users
    - Already bundles many credit surfaces plus public reporting
    - Detailed postpaid fee sheet was not retrievable in this run
  - - CRED
    - Platform entrant / premium overlay
    - FY25 revenue ₹2,735 crore cited by Wikipedia; official fee details opaque
    - Creditworthy urban users and card-centric households
    - Strong premium brand and high-credit audience
    - Official CRED Cash page did not render usable pricing or partner details
  notes: Scale and funding cells stay unknown where retained public evidence did not cleanly disclose them; this is intentional rather than a drafting omission.
