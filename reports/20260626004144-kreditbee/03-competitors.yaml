- id: pricing-distribution-and-regulatory-posture
  title: Pricing, distribution, and regulatory posture favor banks and scaled platforms
  body: 'The disclosed rate floor comparison is uncomfortable for monoline fintech lenders. HDFC and ICICI both market starting personal-loan rates of 9.99 percent, while Bajaj publishes a 10 to 30 percent range. Against that, Freo’s 13 percent annualized floor, Fibe’s 18 percent start, and LazyPay’s 15 to 32 percent explanatory range show that digital specialists are not obviously winning on price in the prime segment. Their defense is speed, digital convenience, and broader reach into borrowers whom banks price less aggressively or do not serve well. That defense matters more as distribution gets concentrated inside very large consumer surfaces. PhonePe claims 65 plus crore registered users and 4.7 plus crore merchants, while Paytm already bundles loans, postpaid, cards, and merchant lending with public-company reporting. CRED is different again: the brand is strong and premium, but its official consumer-loan fee disclosure is opaque in this run because the cred-cash URL did not render
    a usable product page. RBI Digital Lending Directions further compress superficial app-only moats by standardizing the regulatory floor on disclosures, servicing, cooling-off, and DLG treatment.'
