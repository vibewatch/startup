    - Medium
    - Low; users can multi-home credit apps
    - Competes by flexible structure rather than by rate leadership
  - - Fibe
    - Owned app + partner network
    - Non-bank fintech with large partner-distribution footprint
    - Medium to high for product terms and scale
    - Low to moderate; partner network helps acquisition more than lock-in
