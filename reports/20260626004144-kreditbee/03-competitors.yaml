  - - Bajaj Finance
    - Branch, partner, and digital omnichannel
    - Large regulated NBFC with strong distribution economics
    - High
    - Moderate through existing retail-finance relationships
    - Can challenge both fintech speed and incumbent reach
  - - Slice
    - Bank app + deposit and UPI credit card bundle
    - Deposit-funded bank posture rather than pure LSP economics
    - Medium
    - Moderate if banking relationship deepens
    - Represents category migration toward cheaper funding stacks
  - - PhonePe / Paytm
    - Daily-use payments and merchant ecosystems
    - Massive scale plus multi-product regulatory posture; Paytm adds public-market disclosure
    - Medium to high
    - Low contractual lock-in but very high behavioral habit
    - Most dangerous distribution-led entrants
  - - CRED
    - Premium card-payment habit and brand
    - Official consumer-loan posture opaque; partner-led lending visible via third-party sources
    - Low to medium
    - Moderate habit in affluent cohort
    - Threat is premium engagement and cross-sell, not transparent price competition
  notes: 'The table separates price from posture: cheaper funding, better disclosure, and habitual distribution often matter more than one headline APR.'
