company:
  name: KreditBee
chapter:
  number: 3
  title: Competitors
  summary: KreditBee operates in a crowded Indian consumer-credit market where direct fintech lenders look similar on product surface and speed, but the more durable threats come from cheaper-funded incumbents and large payment platforms. Public product pages show only narrow direct-fintech price differentiation — Freo at 13 percent, Fibe at 18 percent, LazyPay at 15 to 32 percent, and KreditBee at 12 to 28 percent — while HDFC and ICICI both market 9.99 percent starting rates, and category failures at Simpl and ZestMoney show that BNPL distribution alone is not a durable moat.
sections:
- id: competitive-landscape
  title: Competitive landscape — direct lenders, substitutes, incumbents, and entrants
  body: KreditBee does not operate in a single-peer market. The closest direct competition comes from other app-first consumer-credit specialists such as Freo or legacy MoneyTap, Fibe, CASHe, Navi, and Slice, each of which attacks the same need for rapid unsecured borrowing but with a different product architecture. Freo emphasizes a credit-line construct, Fibe pushes a larger personal-loan and partner distribution surface, Slice is now repositioning around a bank balance sheet and UPI credit card, and CASHe remains in the set but with unusually weak public-source visibility because its core product pages were blocked at fetch time. KreditBee also competes against BNPL and checkout-credit options such as LazyPay, plus the lesson set created by Simpl and the wind-down of ZestMoney. Beyond fintech specialists, the real substitute set includes incumbent bank personal loans, Bajaj Finance’s broad consumer-finance stack, and platform entrants like PhonePe, Paytm, and CRED that can route users
    into credit from inside much larger payment or rewards surfaces. The practical implication is that KreditBee is defending a job to be done — fast access to retail credit — rather than defending one closed category boundary.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP004
  - CP017
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: direct-peer-profiles
  title: Direct-peer profiles show narrow price spreads and uneven disclosure quality
  body: 'Among direct fintech lenders, public product terms cluster more tightly than branding suggests. KreditBee publishes ₹6,000 to ₹10 lakh loans at 12 to 28 percent with up to 4.8 percent processing fees; Freo markets a ₹5 lakh credit-line-style loan starting at 13 percent annualized; Fibe pushes up to ₹10 lakh with a disclosed 18 percent starting rate and 2 percent processing fee; and LazyPay combines BNPL with a cash-loan offering whose explanatory text places rates in a 15 to 32 percent range. The differentiation is therefore less about a radically cheaper headline price and more about approved limit structure, segment focus, underwriting depth, and the breadth of adjacent products. Fibe’s official scale disclosures are the largest among the direct fintech set in this source pack, while Freo’s 10 million-plus downloads still signal a meaningful installed base. CASHe remains the notable exception: it is clearly a relevant competitor, but because its public pages were inaccessible
    during retrieval, the discipline here is to mark scale and fee cells unknown instead of manufacturing comparability.'
