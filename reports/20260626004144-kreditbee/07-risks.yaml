    {
      "id": "credit-funding-and-margin",
      "title": "Credit, funding, and margin risk",
      "body": "KreditBee is not a fragile early-stage lender anymore, but the rating-agency record still argues for caution on the core financial model. CARE and Acuité show strong recent growth, meaningful profitability, and comfortable capitalisation. Those are real positives. The same reports also show why underwriting should treat downside as model risk rather than a remote tail. Credit costs remained high in FY25, gross NPA metrics have moved around over the last 18 months, and rating agencies continue to describe the book as exposed to the inherent volatility of unsecured lending. The company has diversified into business loans and loan against property, but that adds new underwriting regimes rather than eliminating unsecured-loan sensitivity. On the liability side, NCDs still make up the biggest funding bucket, with banks and NBFCs still important. CARE explicitly notes that average lending rates were reduced after September 2024, so the business is now more dependent on disciplined control of credit losses, opex, and funding costs. This means the investment case can break even without a solvency crisis: a modest deterioration in loss curves or cost of funds can still compress margins, slow growth, and change the IPO narrative materially.",
