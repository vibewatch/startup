    {
      "id": "thesis-break-triggers-and-diligence",
      "title": "Thesis-break triggers and diligence asks",
      "body": "The right way to underwrite KreditBee is to assume that today’s profitability and scale only matter if compliance and collections remain governable as the platform broadens. The thesis should break on measurable events rather than narrative discomfort. A real privacy or collections enforcement action that forces app redesign or suspends an outsourcing arrangement would show that policy documents were not enough. A private portfolio review that shows vintage drift, rising roll rates, or loss rates above the rating-agency picture would break the idea that recent scale came with contained underwriting risk. Likewise, if debt funding becomes more expensive or less available while rates keep falling, the margin story can reset without any single catastrophic event. Diligence therefore needs to move beyond policy pages: request partner-by-partner LSP contracts, recovery-agent rosters and audits, complaint and Ombudsman trend data, data-flow and localisation architecture, product-level vintage curves, and funding-stack detail by instrument. Until that evidence is produced, mitigation maturity should be treated as mixed rather than strong.",
