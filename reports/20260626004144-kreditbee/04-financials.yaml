- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Current public status
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Cash on hand and monthly burn
    - Required for runway and downside financing analysis
    - Unavailable publicly
    - Blocks direct cash-runway modelling
    - Request board pack with monthly liquidity, cash sweep, and covenant headroom
  - - EBITDA by entity
    - Needed to compare against listed NBFC and fintech peers
    - Unavailable publicly
    - Prevents a clean earnings-quality bridge from PAT and PPOP
    - Request audited P&L with EBITDA, depreciation, provisions, and tax bridge
  - - Product-level NIM / take rate
    - Needed to judge whether pricing offsets funding and credit costs
    - Unavailable publicly
    - Cannot underwrite spread durability by product
    - Request product P&L split for personal, business, two-wheeler, and LAP books
  - - Vintage delinquency and recovery curves
    - Needed to verify whether growth is outrunning underwriting quality
    - Unavailable publicly
    - Public GNPA snapshot is insufficient for cycle analysis
    - Request origination-cohort roll rates, recoveries, write-offs, and repeat-customer outcomes
  - - Post-merger audited FY26 financial statements
    - Needed to reconcile tech-platform and NBFC economics ahead of IPO
    - Unavailable publicly
    - Leaves entity-scope ambiguity in FY25-FY26 profitability
    - Request post-merger pro forma and statutory audit package with segment notes
  notes: This table intentionally lists unavailable public data because the chapter brief requires explicit evidence gaps for missing audited metrics.
