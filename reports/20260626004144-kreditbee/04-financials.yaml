  - - Processing / origination fees
    - Fees charged on own and partner-originated loans at disbursal
    - Fee % × disbursals
    - Explicitly disclosed in official price pages; MediaNama says this is the main marketplace revenue line
    - Corroborated metric; exact contribution to total revenue unavailable
    - Share FY25 fee income by product and entity
  - - Credit assessment / service fees
    - Ancillary charges around underwriting and servicing
    - Per-loan / per-service fee
    - Reported by MediaNama as part of revenue mix
    - Third-party reported; no audited split
    - Break out servicing and assessment revenue separately
  - - Card activation / marketing / brokerage income
    - Non-core fee and commission income
    - Per-activation / campaign / referral
    - MediaNama reports card activation, marketing income, and ₹16.6 crore brokerage commission in FY25 other income
    - Third-party reported; likely volatile
    - Separate recurring from non-recurring ancillary income
  - - Cross-sell secured products and value-added services
    - Business loans, LAP, two-wheeler loans, UPI and other existing-customer monetization
    - Customer cross-sell and spread / fee attach
    - Product stack is visible; exact revenue contribution is not public
    - Company claim plus product evidence; contribution unavailable
    - Show cross-sell penetration and revenue per repeat borrower
