  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Audited split of FY25-FY26 revenue between interest income, processing fees, ancillary service fees, and non-operating income.
    whyItMatters: Without a mix bridge, investors cannot tell whether reported profitability is repeatable spread income or more volatile fee and other-income lines.
    diligencePath: Request audited segment note or management MIS showing product- and entity-level revenue composition.
    relatedQuestionRefs:
    - QI002
  - type: private-evidence-only
    severity: material
    topic: EBITDA-gap
    missingEvidence: Entity-level EBITDA, pre-provision operating margin, depreciation, and tax bridge for FY25 and FY26 YTD.
    whyItMatters: PAT alone is not enough to benchmark operating efficiency or compare KreditBee with listed NBFC and fintech peers.
    diligencePath: Request audited P&L and board-pack KPI bridge from revenue to EBITDA, PPOP, PAT, and free cash flow.
    relatedQuestionRefs:
    - QI012
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-runway
    missingEvidence: Cash on hand, monthly burn, liquidity ladder, debt maturities, covenant headroom, and undrawn lines after the April 2026 fundraise.
    whyItMatters: This is the single biggest blocker to a true runway view; capital adequacy is not a substitute for treasury liquidity.
    diligencePath: Request the latest treasury pack, ALM statement, and post-Series-E cash bridge.
    relatedQuestionRefs:
    - QI019
    - QI024
    - QI025
  - type: private-evidence-only
    severity: material
    topic: loss-vintages
    missingEvidence: Origination-cohort delinquency, roll-rate, recovery, and write-off tables by product and by repeat versus first-time borrower.
    whyItMatters: Public GNPA snapshots cannot show whether growth or cross-sell is being bought at the cost of worsening future losses.
    diligencePath: Request monthly cohort-vintage analytics and collections dashboards by product.
    relatedQuestionRefs:
    - QI015
    - QI024
  - type: private-evidence-only
    severity: material
    topic: entity-scope
    missingEvidence: Audited post-merger combined financial statements and pro forma reconciliation between technology-platform and NBFC entities.
    whyItMatters: The public record currently mixes combined and standalone figures, which can overstate or understate revenue quality if read as one scope.
    diligencePath: Request merger-completion pack, pro forma statements, and statutory audit notes covering FY25-FY26.
    relatedQuestionRefs:
    - QI013
    - QI024
    - QI026
    relatedTableRefs:
    - TI005
