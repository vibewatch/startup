chapter:
  number: 4
  title: Financials
  summary: CARE and ETBFSI support that KreditBee crossed ₹10,000 crore of AUM in FY25 and was around ₹15,000 crore of AUM by FY26, while public sources also support genuine PAT profitability at both combined and standalone scopes. The chapter still carries a caution flag because public reporting mixes entity scopes, low-double-digit wholesale funding remains important, and unsecured-lending regulation plus moderate credit costs remain material risks. The decisive blocker is missing audited cash, EBITDA, and cohort-loss data rather than missing scale or funding headlines.
sections:
- id: revenue-model
  title: Revenue streams, pricing, and monetization architecture
  body: 'KreditBee''s public record supports three monetization buckets rather than a pure one-line consumer-lending story. First, the official product pages disclose list pricing for unsecured personal loans, flexi loans, business loans, and two-wheeler finance: the unsecured core generally sits at 12% to 28% APR with processing fees up to 4.8% plus GST, while secured two-wheeler finance can run from 10% to 28%. Second, MediaNama says the marketplace entity earns revenue primarily from processing fees on disbursals, plus credit-assessment, card-activation, service-fee, marketing, and brokerage-type income. Third, CARE says the combined business also books interest income from on-book assets as KrazyBee lends from its own NBFC balance sheet in addition to partner-originated loans.


    That mix matters because it separates corroborated metrics from company claims. Corroborated items are the listed APR and fee bands, the existence of own-book interest income, and the presence of ancillary fee lines. Company claims expand from there: management says future growth will lean on cross-selling to existing customers, and official pages show the cross-sell menu already spans business loans, flexi personal loans, two-wheeler finance, and loans against property. What remains unavailable is the exact revenue mix between spread income, processing income, and value-added services, so any underwriting model should treat list pricing as ceiling economics rather than realized yield.'
