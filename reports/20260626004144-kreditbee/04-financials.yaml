- id: traction-profitability
  title: Corroborated scale, borrower traction, and profitability
  body: 'The strongest corroborated scale fact is that KreditBee has clearly crossed ₹10,000 crore of AUM. CARE puts AUM at ₹10,102 crore on March 31, 2025 and ₹13,141 crore on December 31, 2025, while Moneycontrol independently says FY25 AUM crossed ₹10,000 crore. ETBFSI then extends the public timeline by saying FY2025-26 closed with ₹15,000 crore of AUM and ₹30,000 crore of disbursals. Borrower-scale claims are even larger than the 4.7 million figure flagged in the task brief: Entrackr and IBS Intelligence both say KreditBee serves more than 18 million unique loan customers and has facilitated over 60 million loans, while Fortune India says the platform has underwritten about 8.5 crore individuals and now collects repayments from around 55 lakh active monthly borrowers. On current evidence, 4.7 million looks stale rather than current.


    Profitability is real but scope-sensitive. CARE and Moneycontrol align on a combined FY25 view of roughly ₹2,712 crore of income/revenue and ₹473 crore of PAT, while MediaNama and Financial Express point to standalone FY25 marketplace-company figures closer to ₹682 crore of total revenue and ₹237 crore of PAT. These are not necessarily contradictions; they reflect different legal entities and accounting scopes. What the public record does not give is EBITDA itself. Instead, it offers PAT, ROMA, PPOP, and management''s broad assertion that the firm is already profitable and can fund some technology investment through internal accruals.'
