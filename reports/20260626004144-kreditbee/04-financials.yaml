- id: TI004
  title: Capital adequacy and financing dependency table
  columns:
  - Item
  - Public value / status
  - Classification
  - Implication
  - Diligence ask
  rows:
  - - Capital adequacy
    - CAR 29.59%; TNW ₹3,107 crore at Mar-2025
    - Corroborated metric
    - Near-term solvency looks comfortable before Series E proceeds are added
    - Update CAR and leverage after the 2026 primary raise and post-merger restructuring
  - - Borrowing mix
    - 48.1% NCDs; 22.5% banks; 15.8% NBFCs; 8.0% PTC; 5.4% CP at Dec-2025
    - Corroborated metric
    - Business remains dependent on wholesale liabilities despite profitable growth
    - Show tenor ladder, lender concentration, and undrawn bank lines
  - - Listed debt cost
    - ₹200 crore NCD at 10.65% coupon; other CARE-listed NCDs around 10.65% to 10.95%
    - Corroborated metric plus estimate
    - Funding is not cheap enough to ignore spread compression and credit-cost risk
    - Provide blended marginal borrowing cost including fees and securitization spreads
  - - Series E fresh equity
    - $220 million of primary capital in Apr-2026
    - Corroborated metric
    - Supports growth and IPO preparation; reduces near-term capital pressure
    - Detail use of proceeds across own-book growth, AI, and secured expansion
  - - Base-case 2026 scenario
    - Positive PAT + strong CAR + new equity support continued growth
    - Estimate
    - Supports an IPO narrative if asset quality stays inside current bands
    - Test sensitivity to lower AUM growth and slower secured-product ramp
  - - Downside 2026 scenario
    - Higher credit costs or tighter unsecured regulation would force slower growth or more capital
    - Estimate
    - Shows why profitability alone does not eliminate financing dependency
    - Run stress cases on 100-200 bps higher funding cost and persistent 7%+ credit cost
