- id: scenario-gaps
  title: Scenario framing, unavailable metrics, and diligence gaps
  body: 'The cleanest way to frame KreditBee financially is to separate corroborated metrics, company claims, estimates, and unavailable data. Corroborated metrics include AUM above ₹10,000 crore, combined FY25 PAT of ₹473 crore, March 2025 CAR of 29.59%, low-double-digit listed-debt coupons, and 2026 borrower claims above 18 million unique loan customers. Company claims include cross-sell ambitions, daily download and loan-throughput anecdotes, and the broad statement that the firm is profitable enough to self-fund some investment. Estimates begin when investors try to infer realized take-rates, cost of equity-adjusted funding, or look-through profitability per product line. Unavailable items remain the most underwriting-relevant: no public cash balance, no monthly burn, no direct EBITDA disclosure, no product-level NIM, no vintage-loss tables, no provision-coverage bridge, and no audited post-merger FY26 statement for the combined entity.


    Accordingly, the scenario lens in this chapter is not a cash-runway model but a capital-adequacy model. Base case: strong current CAR, positive PAT, and fresh primary equity support another year of expansion while the secured mix rises. Downside case: RBI-tightened digital-lending economics, sustained 7%+ credit costs, or wholesale-funding spreads staying in the low-double digits would compress returns and force a slower loan-book build. Upside case: if the secured mix scales, cross-sell works, and funding costs continue falling, public profitability could prove durable ahead of an IPO. The blocking diligence asks are therefore entity reconciliation, product-cohort loss curves, and a true cost-of-funds plus cash-position pack.'
