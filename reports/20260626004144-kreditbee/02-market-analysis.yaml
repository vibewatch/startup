- id: segments-and-adoption
  title: Borrower Segments, Digital Adoption, and Buyer-Payer Structure
  body: 'The most important segmentation in Indian digital lending is not by app brand; it is by borrower file thickness, income regularity, and who ultimately provides risk capital. Retail consumers remain the largest monetization pool, but the fastest structural opening is among thin-file and first-time borrowers outside the traditional metro salaried base. TransUnion CIBIL’s evidence shows first-time borrowers skew younger, rural, and increasingly non-metro, while World Bank inclusion data show that account ownership alone does not eliminate digital-usage or gender gaps. That gap is exactly where app-led lending tries to sit: borrower demand exists before formal bureau depth does. MSMEs form the second large wedge, where formal-credit penetration remains incomplete even among Udyam-registered firms. The buyer-user-payer split also matters: borrowers use the product, but capital often still comes from banks or NBFC balance sheets, with fintechs or LSPs controlling acquisition, underwriting
    workflow, or servicing experience. In other words, digital distribution can expand faster than balance-sheet ownership.'
  claimRefs:
  - CM014
  - CM015
