- id: TM005
  title: Regulatory overlay for Indian digital lending, 2022-2026
  columns:
  - Date
  - Measure
  - What changed
  - Likely market effect
  - Backing claims
  rows:
  - - '2022-09-02'
    - Digital Lending Guidelines
    - Defined RE, LSP, DLA obligations; direct fund flow; APR, KFS, cooling-off, grievance rules
    - Raised compliance floor for all app-led lending models
    - CM001, CM002
  - - 2023-02
    - RBI FAQ clarifications
    - Confirmed partial-digital journeys still count, rules can apply to MSME loans, and clarified APR and servicing details
    - Extended rule clarity into more product formats
    - CM002, CM034
  - - '2023-06-08'
    - DLG / FLDG framework
    - Permitted default-loss guarantees within prudential guardrails
    - Kept partnership models alive but under tighter control
    - CM005
  - - '2023-11-16'
    - Unsecured-risk-weight tightening
    - Raised capital charges for consumer credit, cards, and some NBFC exposures
    - Made aggressive unsecured expansion more expensive
    - CM027
  - - 2024-08
    - Public repository of DLAs announced
    - RBI responded to false association claims and moved to a public DLA directory
    - Improved verification and trust, especially for retail borrowers
    - CM003, CM004
  - - '2025-05-08'
    - Digital Lending Directions, 2025
    - Consolidated prior circulars and added DLA reporting plus multi-lender RE-LSP provisions
    - Shifted the market from evolving guidance to a clearer operating framework
    - CM003, CM036
  notes: The overlay shows regulation acting as both an adoption enabler through trust and a brake through higher compliance and capital intensity.
