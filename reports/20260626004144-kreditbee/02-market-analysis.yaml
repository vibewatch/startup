- id: drivers-constraints-and-regulatory-overlay
  title: Growth Drivers, Constraints, and Regulatory Overlay
  body: 'India’s opportunity is large because digital public infrastructure, mobile-first credit journeys, and under-served retail and MSME demand all keep pushing the funnel outward. But the same market is constrained by a much more explicit regulatory overlay than many top-down forecasts assume. RBI’s 2022 guidelines and 2025 Directions force direct lender-borrower fund flow, APR and KFS disclosure, cooling-off rights, grievance handling, and DLA reporting. The 2023 risk-weight shock on unsecured credit made capital intensity a live operating variable, especially for lenders leaning on unsecured personal loans, cards, or wholesale funding to NBFCs. That means growth increasingly favors models that can combine compliant origination with durable funding and risk control, not just fast app installs. Banks and large NBFCs remain formidable competitors on pricing and ticket size, so fintech differentiation shifts toward faster onboarding, thinner-file underwriting, semi-urban reach, and better
    use of consented data. The adverse scenario is straightforward: if RBI sees unsecured-credit stress or misconduct re-emerge, the serviceable market can narrow faster than the headline TAM expands.'
