callouts:
- calloutType: insight
  title: Boundary discipline matters more than headline TAM
  body: The public opportunity set spans everything from consumer-credit stock to broad digital-financing narratives. For underwriting, the useful market is the regulated slice that can be digitally originated, compliantly serviced, and durably funded.
  claimRefs:
  - CM012
  - CM013
  - CM039
- calloutType: risk
  title: Regulation is simultaneously a moat and a brake
  body: RBI’s rules can increase customer trust and weed out weaker operators, but they also raise compliance cost and capital intensity for unsecured lenders, especially when risk weights and DLA scrutiny tighten.
  claimRefs:
  - CM003
  - CM027
  - CM036
  - CM037
