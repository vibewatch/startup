- id: TM003
  title: Borrower, user, payer, and adoption map
  columns:
  - Segment
  - Borrower / user
  - Payer / capital source
  - Main underwriting signal
  - Adoption trigger
  - Primary constraint
  rows:
  - - Thin-file salaried entrant
    - Individual borrower and end user
    - Bank or NBFC capital; fintech or LSP interface
    - Salary inflows, bureau-lite profile, bank statements
    - Instant access and lower paperwork
    - Tighter underwriting after unsecured risk scares
  - - Gig or variable-income worker
    - Individual borrower and end user
    - NBFC or co-lending stack
    - Cash-flow patterns, platform or payment data, alternative data
    - Access without formal payslips
    - Volatile income and explainability or fairness concerns
  - - Semi-urban or rural first-time borrower
    - Individual borrower and end user
    - Often bank or NBFC balance sheet with digital distribution
    - Assisted onboarding, bureau, and bank account activity
    - First formal-credit access outside metro branch channels
    - Distribution quality, collections, and digital-literacy gaps
  - - Micro-MSME or merchant owner
    - Business owner is borrower, user, and effective payer
    - NBFCs, private banks, or co-lending structures
    - GST, bank statements, trade flows, property or business cash flows
    - Working-capital need and collateral shortage
    - Documentation, informal cash flows, and lower formal penetration
  - - Embedded-credit or BNPL shopper
    - Consumer borrower within commerce flow
    - Lender balance sheet; merchant may subsidize economics
    - Checkout context, prior repayment behavior, transaction data
    - Higher conversion and convenience at point of sale
    - Short-tenor unsecured-risk scrutiny and low-margin economics
  notes: The same user may see a fintech interface even when pricing, underwriting policy, and capital are controlled by a regulated lender.
