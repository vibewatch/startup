    missingEvidence: India-specific public data on the share of digital-loan originations, approval rates, and loss curves attributable to gig or variable-income workers.
    whyItMatters: KreditBee-like lenders often target informal or variable-income users, but public market data still under-describes how large that cohort is and whether it is sustainably profitable.
