tables:
- id: TM001
  title: Market boundary and inclusion logic
  columns:
  - Layer
  - Included spend
  - Excluded spend
  - Borrower / user / payer
  - Why it matters
  rows:
  - - Digitally originated unsecured personal credit
    - App or web originated personal loans, credit lines, and salary-linked or cash-flow consumer credit booked by banks or NBFCs
    - Secured home, vehicle, education, and gold loans or fully branch-led unsecured lending
    - 'Borrower=user: consumer; payer: consumer; capital: RE balance sheet'
    - Closest core market for KreditBee-like products
  - - Embedded credit and BNPL
    - Checkout credit, deferred payment, and commerce-linked installment products backed by regulated lenders
    - Pure wallet or payments activity with no underlying regulated credit
    - 'Borrower=user: consumer; payer: consumer and sometimes merchant via MDR or subsidies'
    - Important acquisition wedge but not the entire digital-lending market
  - - Digitally underwritten MSME or merchant finance
    - Working-capital, merchant, invoice, and small-business loans using digital statements, GST, transaction, or bank data
    - Large corporate relationship lending and manually underwritten mid-market loans
    - 'Borrower=user=payer: owner or finance manager; capital: banks/NBFCs'
    - Extends SAM beyond retail where credit gaps remain large
  - - Credit-enablement rails
    - AA, OCEN, ULI, and consented-data layers that make digital credit cheaper to distribute
    - Payments, broking, or insurance revenues unrelated to lending
    - 'User: lender or LSP; payer: lender, borrower indirectly'
    - Critical growth driver, but infrastructure is not itself TAM
  notes: Boundary is constrained to regulated digital credit and adjacent enablement, not the whole fintech ecosystem.
