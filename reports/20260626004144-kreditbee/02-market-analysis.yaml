    statement: RBI’s digital-lending rules require direct borrower-to-RE fund flows, upfront APR and KFS disclosure, a borrower cooling-off exit, and named grievance redressal contacts, which directly shape app-led lending unit economics.
    type: observed
    topic: regulatory-framework
    sourceRefs:
