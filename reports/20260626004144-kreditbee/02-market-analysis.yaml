chapter:
  number: 2
  title: Market Analysis
  summary: India offers a large digital-lending opportunity, but only after boundary discipline strips out broader fintech and secured-credit narratives. The near-term market for KreditBee-like lenders is strongest in digitally originated unsecured consumer credit, semi-urban first-time borrowers, and under-served MSME cash-flow lending, all under a materially tighter RBI regime than many 2030 TAM claims assume.
sections:
- id: boundary-and-boundary-risks
  title: Boundary Before Sizing
  body: 'India’s digital-lending opportunity only looks coherent after the boundary is tightened. For this chapter, the relevant market is credit that is originated and largely serviced through digital channels by a regulated lender or its lending service provider: unsecured personal loans, BNPL or embedded consumer credit, and digitally underwritten MSME working-capital or merchant finance. That scope intentionally excludes pure payments, wealth or insurance fintech, and most secured products such as mortgages, vehicle loans, and gold-backed lending. The exclusion matters because many bullish estimates mix loan-book exposure, fintech revenue, and payment-platform activity under one headline. RBI’s rule set reinforces the same boundary: the regime is about digital-credit conduct, fund flow, disclosures, DLA governance, and outsourced origination, not about the whole fintech stack. The practical market definition is therefore a regulated-credit market that rides on digital rails rather than
    a generic “India fintech” market.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM006
  - CM034
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Sizing Lenses and Contradictory Estimates
  body: 'Once the boundary is set, the public numbers still diverge sharply. ETBFSI’s IIFL FinTech estimate implies a USD 515 billion digital-lending book by 2030 from a USD 38.2 billion 2021 base, while Precisa cites a much broader USD 1.3 trillion digital-financing opportunity by 2030 from a USD 270 billion 2022 base. MarkNtel’s USD 59.44 billion 2026 fintech market and IMARC’s USD 40.9 billion 2025 consumer-credit stock are not substitutes for either estimate; they are adjacent lenses with different denominators. 6Wresearch adds a 22.1% CAGR growth view but no equivalent size base. The result is not that one forecast is “wrong”; it is that broad-TAM estimates are built on incompatible scope choices. A more usable framing for underwriting KreditBee is constrained sizing: start from digitally originated unsecured personal credit and adjacent embedded-credit or MSME wedges that can still pass RBI conduct, funding, and risk tests, then treat broader trillion-dollar narratives as outer-envelope
    context rather than operating reality.'
  claimRefs:
  - CM007
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
