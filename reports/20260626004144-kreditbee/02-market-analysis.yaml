- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - Factor
  - Type
  - Direction
  - Timing
  - Evidence
  - Implication for market
  rows:
  - - UPI and account-based digital adoption
    - Driver
    - Positive
    - Immediate
    - High account ownership and mass UPI usage lower onboarding friction
    - Supports digital loan acquisition but does not guarantee credit conversion
  - - DPI, AA, OCEN, and ULI
    - Driver
    - Positive
    - Near to medium term
    - Consent-based data sharing and faster underwriting improve serviceability of thin-file borrowers and MSMEs
    - Raises feasible SAM without changing macro credit risk
  - - Semi-urban and rural first-time borrower growth
    - Driver
    - Positive
    - Immediate
    - Retail borrower mix is shifting outside core metros
    - Expands user base for app-led lenders willing to build collections and support
  - - RBI conduct rules (APR, KFS, cooling-off, grievance)
    - Constraint
    - Negative on margins / positive on trust
    - Immediate
    - Compliance obligations increase servicing and disclosure cost
    - Favors better-governed lenders over loosely run app networks
  - - Unsecured-risk-weight tightening
    - Constraint
    - Negative
    - Immediate
    - Higher capital intensity makes unsecured personal credit costlier
    - Can shrink lender appetite and raise rates for end borrowers
  - - Bank/NBFC control of low-cost capital
    - Mixed
    - Concentrating
    - Ongoing
    - Fintech UI advantage does not remove dependence on regulated balance sheets
    - Encourages co-lending and distribution partnerships over pure-play balance-sheet-light scaling
  notes: Each factor is linked to timing because India’s market opportunity is shaped as much by capital and regulation as by demand.
