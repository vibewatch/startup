  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Status / metric
      - Multiple or valuation context
      - Why it matters
      - Limitation
    rows:
      - - CRED
        - Private affluent-consumer fintech
        - $3.5B in 2025 after about a 45% markdown from the 2022 $6.4B peak
        - Best adverse private-fintech signal that late-stage Indian consumer fintech valuations can reset lower even with scale.
        - Business mix is broader than pure lending and public disclosure is still limited.
      - - Fibe
        - Private digital lender preparing IPO
        - 2026 IPO report points to >$1B potential value after a ~$600M 2024 mark and ~$228M funding to date
        - Useful direct-lending private comp because it sits closer to KreditBee's product set than CRED does.
        - IPO outcome is not final pricing and public source quality is thinner than a filed prospectus.
      - - Bajaj Finance
        - Listed premium NBFC
        - Screener snapshot shows ₹6,10,393 crore market cap and book value ₹183 per share; current price implies ~5.4x P/B
        - Shows what public investors will pay for a scaled, disclosed, high-quality Indian lender.
        - Funding profile, tenure, and disclosure quality are materially stronger than KreditBee's.
      - - SBI Cards
        - Listed card lender / consumer-credit comp
        - Multiples.vc shows about $6B market cap, $11B EV, and 5.6x EV/revenue
        - Offers a public-market cross-check for consumer-credit monetisation and listing discipline.
        - Cards economics are not the same as personal-loan or NBFC-balance-sheet economics.
      - - OneCard
        - Private card-first fintech
        - Qualitative only in this source pack; current valuation could not be re-verified from accessible 2026 direct sources
        - Relevant for user behavior and affluent app-native competition, especially around consumer-credit interface quality.
        - Lacks a fresh direct pricing anchor here, so it should not drive the numeric valuation call.
    notes: Numeric emphasis is on comps with reusable valuation evidence; OneCard remains qualitative because the current direct-source valuation trail is incomplete.
