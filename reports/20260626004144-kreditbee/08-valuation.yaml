  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: preference-overhang
      missingEvidence: Series E share-class terms, liquidation waterfall, anti-dilution protections, and conversion mechanics.
      whyItMatters: Headline post-money valuation can still translate into weak realized returns if the senior stack is rich or cumulative.
      diligencePath: Request the cap table, shareholder rights summary, and latest financing documents from management or counsel.
      relatedQuestionRefs: [QV015]
    - type: conflicting-data
      severity: material
      topic: valuation-bridge
      missingEvidence: A reconciled funding and valuation bridge from the March 2024 extension through the April 2026 Series E.
      whyItMatters: Public databases and stories disagree on prior capital raised and prior valuation, limiting confidence in the mark-up path.
      diligencePath: Reconcile company data room materials against Tracxn, rating reports, and board-approved financing history.
      relatedQuestionRefs: [QV013]
    - type: missing-source
      severity: minor
      topic: onecard-gap
      missingEvidence: A direct current valuation source for OneCard or FPL Technologies that is accessible without paid databases.
      whyItMatters: OneCard is a relevant app-native peer, but it cannot be used as a numeric pricing anchor without a fresh mark.
      diligencePath: Obtain a recent fundraising article, registry filing, or company-confirmed valuation reference.
      relatedQuestionRefs: [QV018]
      relatedTableRefs: [TV004]
    - type: private-evidence-only
      severity: material
      topic: fy26-audit
      missingEvidence: Audited FY26 combined financial statements with entity-level bridge, vintage losses, and funding-mix details.
      whyItMatters: Better disclosure is the clearest path from a track call to a higher-conviction investable call.
      diligencePath: Review audited FY26 statements or draft IPO filing when available.
      relatedQuestionRefs: [QV026, QV029]
