  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - - Thesis
        - Real scale and profitability are now visible in public sources, with FY25 PAT around ₹473 crore and AUM above ₹10,000 crore.
        - Audited FY26 entity reconciliation could strengthen confidence and support a premium multiple.
      - - Thesis
        - The April 2026 round brought real external price discovery and fresh capital ahead of a possible IPO.
        - Evidence of weak post-round demand or soft banker feedback would reduce the signaling value of the round.
      - - Thesis
        - Product expansion into LAP and SME plus repeat-customer underwriting can improve mix quality over time.
        - Credit costs staying near FY25 levels despite mix change would undermine the mix-improvement argument.
      - - Anti-thesis
        - The current price already implies roughly 4.1x book and 4.7x revenue, near stronger listed-lender benchmarks.
        - A lower entry price or faster-than-expected book growth would improve risk-reward.
      - - Anti-thesis
        - Wholesale funding and 10.65% listed debt suggest funding remains materially costlier than top bank franchises.
        - A clear shift toward cheaper and more diversified funding would justify a higher multiple.
      - - Anti-thesis
        - The 2023 RBI collections penalty and incomplete public governance detail deserve a durable valuation discount.
        - Evidence of stronger control architecture and no repeat conduct issues would narrow the governance discount.
      - - Anti-thesis
        - Sector comps show that private-fintech marks can still reset lower, as CRED did in 2025.
        - A clean IPO filing and strong public demand would reduce the relevance of the adverse peer read-across.
    notes: Anti-thesis rows are backed by adverse or valuation-discipline evidence, not by generic skepticism.
