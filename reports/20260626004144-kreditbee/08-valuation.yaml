  - id: exit-readiness-and-final-asks
    title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
    body: |-
      Exit readiness is improved, but not proven. The April 2026 round, the IPO framing across multiple publications, and the company's demonstrated profitability all make KreditBee more exit-ready than most private consumer-credit fintechs. This is no longer a business that needs a heroic commercialization leap just to reach relevance. The likely exit path is an IPO or pre-IPO crossover process, not a strategic sale, because listed public comparables already exist and the company appears to be simplifying toward that route. Even so, readiness is conditional on disclosure quality. Investors still do not have a public cap-table waterfall, audited combined FY26 statements, product-level credit-vintage curves, securitization and co-lending profitability splits, or evidence that the 2023 collections-related penalty has translated into best-in-class governance controls.

      The investment thesis breaks fastest through pricing discipline rather than through existential failure. If a public or late-private process prices KreditBee closer to 2.5-3.0x book, that would not necessarily disprove the franchise but would show the April 2026 mark was too rich. A second break trigger is credit-cost persistence near or above the FY25 7.7% level while growth slows, because that combination would compress both ROE and public-market appetite. The third is governance or regulatory recurrence: another serious conduct issue would justify a lasting valuation discount in a business that depends on digital trust and repeat borrowing. The practical next step is therefore not immediate enthusiasm or blanket rejection; it is targeted diligence on price, terms, and loss behavior.
