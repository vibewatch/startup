callouts:
  - calloutType: insight
    title: Price matters more than narrative here
    body: KreditBee no longer looks like an unpriced private option. At the April 2026 mark, public evidence already supports a premium valuation, so upside now depends on either better disclosure or a lower entry point.
    claimRefs:
      - CV001
      - CV016
      - CV037

  - calloutType: risk
    title: The biggest underappreciated risk is not growth — it is re-rating
    body: KreditBee can keep growing and still produce poor late-entry returns if public or next-round investors price the business closer to 2.5-3.0x book. That is the main reason the recommendation stays track / research-more.
    claimRefs:
      - CV016
      - CV039
      - CV044

  - calloutType: assumption
    title: Book value is the primary valuation anchor
    body: Because KreditBee owns regulated lending exposure through its NBFC, price-to-book and earnings durability are more useful than a venture-style DCF or a pure software revenue multiple.
    claimRefs:
      - CV006
      - CV020

  - calloutType: recommendation
    title: Three diligence events would change the call
    body: A lower entry closer to ~3.0-3.3x book, an IPO-grade audited FY26 bridge, or clear cohort-loss evidence showing durable profitability would all materially improve risk-reward.
    claimRefs:
      - CV006
      - CV038
      - CV043
      - CV044

