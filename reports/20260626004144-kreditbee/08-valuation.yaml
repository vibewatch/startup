  - id: scenario-analysis
    title: Bull / Base / Bear Scenarios and Downside Triggers
    body: |-
      The bull case is not fantasy, but it requires more than headline growth. In the bull scenario, KreditBee converts the 2026 private mark into a credible IPO or pre-IPO step-up by proving that FY26 AUM near ₹15,000 crore is accompanied by stable or improving credit costs, a growing secured and business-loan mix, lower cost of funds, and public-market-ready disclosures. Under those conditions, investors could justify a 4.8-5.3x book range or a mid-to-high single-digit revenue multiple on a larger earnings base, which supports roughly $1.7-2.2 billion of equity value. That scenario also assumes no fresh adverse regulatory action and that collections history remains a historical blemish rather than a recurring control problem.

      The base case is more sober and is the most probable path on today's evidence. KreditBee keeps growing, remains profitable, but public investors apply a discount for unsecured exposure, wholesale funding, and incomplete transparency. On that path, value clusters near $1.2-1.6 billion, roughly around the April 2026 mark, with modest upside only if the IPO process demonstrates cleaner disclosure than the private market has seen so far. The bear case is the important one for entry discipline. If public investors or a next private round re-rate the business closer to 2.5-3.0x book because of funding spreads, credit-cost persistence, or governance discount, implied value falls toward roughly $0.9-1.1 billion. That would not imply franchise collapse, but it would create real flat-round or down-round risk for investors entering at the current price.
