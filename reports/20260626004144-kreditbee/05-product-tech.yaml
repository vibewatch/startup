- id: differentiation-roadmap-and-gaps
  title: Differentiation, roadmap, and remaining evidence gaps
  body: 'KreditBee’s verified differentiation is pragmatic rather than magical: it has broad product coverage inside one consumer interface, a low-document digital flow, multiple lender relationships, and visible willingness to use third-party data and onboarding infrastructure to reduce friction. Those are real strengths for scaling Indian digital credit. The gap is that public evidence gets materially thinner when the story shifts from product breadth and fast workflow to defensible underwriting IP. Digitap and media sources can support the existence of OCR, bank-statement analysis, AA connectivity, and alternate-data categories, but they cannot by themselves prove how much of that stack is proprietary, which signals truly sit inside production models, or how model-governance and fairness controls are monitored.


    Roadmap evidence should therefore be tiered. The strongest current-evidence products are personal loans and their close variants, with business and secured products documented but less transparently mature. The clearest future-facing claims are 2026 plans to spend on AI capabilities and expand into gold loans and consumer-durable finance. By contrast, explicit BNPL or credit-line documentation is missing, public developer surface is minimal, and there is no public architecture, certification, or reliability pack robust enough to underwrite the platform as a deeply transparent fintech stack. Those are solvable diligence gaps, but they remain gaps today.'
