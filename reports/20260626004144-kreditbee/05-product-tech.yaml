- id: workflow-underwriting-and-stack
  title: Workflow, underwriting, and the observable stack
  body: 'The customer workflow that can actually be verified is straightforward. Public pages and app-store copy show a borrower signing up with a mobile number, submitting PAN and Aadhaar-linked identity information, uploading address and income or business documents, providing bank details, and then receiving funds directly into a bank account if approved. KreditBee’s own blog and the personal-loan pages add salary slips or business proofs, while the repayment surface points back to app or website flows plus NEFT, ECS, and UPI. Fortune’s 2026 interview also reinforces the design intent: management explicitly says the company wanted a faceless digital-underwriting model rather than branch-based borrower meetings.


    The underwriting stack is only partially visible. The strongest public evidence comes not from KreditBee’s own technical docs but from partner Digitap, whose materials describe digital KYC, OCR, bank-statement ingestion, alternate-data assessment, and Account Aggregator connectivity. Mediabrief adds evidence that netbanking, PDF upload, and AA modes were used in a trial that sourced more than one lakh statements. That is meaningful proof of bank-data automation, but it is not the same thing as a verified view into KreditBee’s in-house model architecture. Public materials support AI-assisted and alternate-data-assisted decisioning; they do not independently prove a detailed model topology, a numeric ‘1000+ variables’ count, or production use of every signal class often implied by marketing.'
