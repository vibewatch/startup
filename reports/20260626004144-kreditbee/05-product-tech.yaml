callouts:
- calloutType: strength
  title: 'Verified strength: breadth inside one consumer app'
  body: KreditBee clearly runs more than a one-page personal-loan funnel. Public evidence supports one app spanning unsecured, SME, secured, UPI, repayment, and credit-report surfaces, which can improve retention and cross-sell if the underlying economics hold.
  claimRefs:
  - CE001
  - CE016
  - CE017
- calloutType: risk
  title: Marketing outruns public proof on underwriting sophistication
  body: Alternate-data, OCR, AA, and AI usage are plausible and partly evidenced through partner materials, but the public record still does not prove a detailed in-house model architecture, a 1000+ variable count, or UPI-signal usage in underwriting.
  claimRefs:
  - CE028
  - CE029
  - CE035
  - CE039
  - CE040
- calloutType: risk
  title: Trust is shaped as much by collections conduct as by onboarding speed
  body: KreditBee’s fast digital workflow and legal-policy surfaces do not erase the 2023 RBI penalty against KrazyBee over recovery-agent harassment. Collections and borrower-treatment controls remain a first-order product diligence issue.
  claimRefs:
  - CE026
  - CE043
  - CE044
