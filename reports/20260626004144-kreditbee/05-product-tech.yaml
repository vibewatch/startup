company:
  name: KreditBee
chapter:
  number: 5
  title: Product & Technology
  summary: 'KreditBee’s verified product maturity is strongest at the customer-surface level: one app spans unsecured, SME, secured, repayment, UPI, and credit-report modules, and the borrower workflow is clearly digital-first through bank-account disbursal. The technical differentiation story is directionally plausible but still under-documented: partner materials support OCR, bank-statement ingestion, Account Aggregator connectivity, and alternate-data-assisted underwriting, yet key claims about model depth, 1000+ variables, reliability, and certifications remain unsupported or only partner-described.'
sections:
- id: product-surface-and-modules
  title: Product surface and module map
  body: 'KreditBee’s public surface is broad enough to look more like a consumer-credit app suite than a single unsecured-loan funnel. Across the homepage, sitemap, app-store listings, and dedicated product pages, the company clearly markets standard personal loans, a salaried variant, flexi personal loans, business loans, two-wheeler finance, loan against property, UPI payments, repayments, and a paid credit-report utility. That breadth is important because it shows how KreditBee is trying to deepen engagement inside one consumer app instead of relying only on a single short-tenure unsecured product.


    The maturity is not uniform across that menu. Personal loans are the clearest core SKU: ticket size, pricing bands, tenure, documents, and disbursal flow are all publicly stated. Business loans are also documented, but still read like a close cousin of the core unsecured flow rather than a deeply separate SME platform. Two-wheeler finance and property-backed loans are real products, yet each carries visible constraints: the two-wheeler product is region-limited and existing-customer oriented, while LAP can require a physical application path. The public surface does not show a separately documented BNPL or revolving credit-line SKU, so investors should treat those categories as absent unless the company supplies internal product packs.'
