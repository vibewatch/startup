  evidenceGaps:
  - type: missing-source
    severity: material
    topic: model-governance
    missingEvidence: A primary or independent technical disclosure showing KreditBee’s live underwriting architecture, model-governance controls, monitored feature groups, and whether any “1000+ variables” claim is literal or rhetorical.
    whyItMatters: Product differentiation depends heavily on underwriting quality. Without model-governance proof, AI depth remains more marketing/partner-described than investable fact.
    diligencePath: Request the underwriting architecture deck, model-risk policy, champion-challenger framework, and feature-governance inventory for the current production stack.
    relatedQuestionRefs:
    - QE013
    - QE016
    - QE018
  - type: missing-source
    severity: material
    topic: signal-provenance
    missingEvidence: Direct evidence showing which bank, device, telecom, ecommerce, social, or UPI-derived signals actually feed KreditBee underwriting decisions and under what borrower consent language.
    whyItMatters: The commercial and regulatory value of alternate data depends on exact signal provenance, consent, and model use, not on broad partner capability lists.
    diligencePath: Obtain the borrower-consent text, data-dictionary mapping, and sample decision waterfall that links raw sources to scored features.
    relatedQuestionRefs:
    - QE019
    - QE020
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: reliability-transparency
    missingEvidence: A current public or diligence-room status page, uptime SLA, incident log, and disaster-recovery summary for KreditBee’s borrower-facing app and web stack.
    whyItMatters: A mobile-led lender depends on continuous availability across onboarding, disbursal, and repayment. Public app ratings do not substitute for operational reliability evidence.
    diligencePath: Request the SRE pack covering uptime, major incidents, recovery objectives, monitoring, vendor dependencies, and repayment failure handling.
    relatedQuestionRefs:
    - QE021
    relatedTableRefs:
    - TE004
  - type: access-blocked
    severity: minor
    topic: policy-readability
    missingEvidence: Readable noninteractive text or printable versions of KreditBee’s privacy, grievance, security, and fair-practices pages instead of JS-shell responses.
    whyItMatters: The presence of legal URLs is better than nothing, but diligence needs policy detail and change history rather than route existence.
    diligencePath: Ask the company for PDF or HTML exports of these policies plus the last revision dates and owner names.
    relatedQuestionRefs:
    - QE012
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: roadmap-clarity
    missingEvidence: A product roadmap clarifying whether BNPL, explicit revolving credit lines, gold loans, consumer durable finance, or other adjacent products are live, piloting, or merely exploratory.
    whyItMatters: Investors should not assume module breadth from roadmap headlines. SKU-level readiness materially affects CAC reuse, underwriting reuse, and lender readiness.
    diligencePath: Request a SKU roadmap with launch dates, pilot geographies, lender availability, eligibility rules, and current borrower counts.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: minor
    topic: developer-surface
    missingEvidence: Any public API documentation, sandbox, webhook specification, or clearly official engineering repository for third-party integrators or technical due diligence.
    whyItMatters: An absent public developer surface is not a fatal flaw for a consumer lender, but it lowers external verifiability and makes platform extensibility harder to assess.
    diligencePath: Ask for partner-integration docs, event schemas, and the internal interface map between borrower app, underwriting, lender routing, and servicing systems.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
    - TE005
