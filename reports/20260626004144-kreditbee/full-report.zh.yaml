        - KrazyBee 持有在自有 NBFC 资产负债表上的贷款所赚利息
        - APR × 表内余额
        - CARE 已公开确认；具体产品级组合未披露
        - 经佐证指标；实际收益率不可得
        - 提供表内分部按产品拆分的 NIM 和收益率
      - - 处理 / 发放费用
        - 自有和合作伙伴发放贷款在放款时收取的费用
        - 费用率 % × 放款额
        - 官方价格页明确披露；MediaNama 称这是主要市场收入线
        - 经佐证指标；占总收入的准确贡献不可得
        - 按产品和实体拆分 FY25 费用收入占比
      - - 信用评估 / 服务费用
        - 围绕风控和服务的附加收费
        - 每笔贷款 / 每项服务费用
        - MediaNama 报道为收入组合的一部分
        - 第三方报道；无审计拆分
        - 分别拆出服务收入和评估收入
      - - 卡激活 / 营销 / 经纪收入
        - 非核心费用和佣金收入
        - 每次激活 / 活动 / 推荐
        - MediaNama 报道 FY25 其他收入包含卡激活、营销收入和 ₹16.6 crore 经纪佣金
        - 第三方报道；可能波动较大
        - 将经常性与非经常性附属收入分开
      - - 交叉销售有抵押产品和增值服务
        - 商业贷款、LAP、两轮车贷款、UPI 和其他既有客户变现
        - 客户交叉销售和利差 / 费用附加
        - 产品栈可见；准确收入贡献未公开
        - 公司说法加产品证据；贡献不可得
        - 展示交叉销售渗透率和每名复借借款人的收入
    notes: 这张表把经佐证的收入机制，与公开但未量化的附属收入线拆开；公开信息中没有经审计的分部组合。
