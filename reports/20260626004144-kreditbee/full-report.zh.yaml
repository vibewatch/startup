      - number: '8.5'
        title: 可比公司组与合适估值方法
        blocks:
          - type: paragraph
            body: >-
              合适的可比组是混合的，因为 KreditBee 介于 App 优先的私人金融科技同行和持有受监管资产的上市贷款机构之间。按产品和消费者行为，最接近的私人同行是 CRED、Fibe，以及较低程度上的
              OneCard。CRED 是最清晰的负面可比：其 2025 年 6 月融资把估值重置到约 35 亿美元，较 2022 年峰值 64 亿美元低约
              45%，说明大型印度私人金融科技公司即使达到有意义规模后，仍可能被大幅下调定价。Fibe 更鼓舞人心，但仍体现纪律：2026 年 6 月 IPO 准备报道显示，其 2024 年估值约 6 亿美元，潜在 IPO
              结果可能超过 10 亿美元，这对私人贷款机构是有帮助的基准；但即便 Fibe 已公布大规模分发指标，该水平仍低于 KreditBee 当前估值。OneCard 作为卡原生、App
              优先的消费信贷品牌仍相关，但可获取的 2026 年直接来源集没有给出可作为干净定价锚的最新估值标记，因此它只能作为定性可比，而非定量可比。


              公开参考点方面，市净率是首要视角。Bajaj Finance、Cholamandalam 和 L&T Finance 都是披露充分的受监管上市贷款机构，公开报告深度和资金 franchise
              都更成熟。KreditBee 隐含约 4.1 倍 FY25 账面价值，低于 Bajaj 等高溢价上市龙头，并大致处在高层级公开 NBFC
              倍数附近；但这正是当前轮次并不便宜的原因。公司仍是私人公司，披露偏薄，相比这些上市同行，更容易受到监管和承销观感变化影响。收入倍数可作为交叉检查，而不应作为主要方法：SBI Cards 约 5.6 倍
              EV/revenue，CRED 低双位数私人收入倍数，说明公开和后期私人金融科技资本市场仍愿意为规模付费，但前提是证据质量强。因此，KreditBee 需要一套混合框架：账面价值第一，盈利和资金质量第二，收入与
              AUM 第三。
