      - number: '3.3'
        title: 定价、分发和监管姿态有利于银行与规模化平台
        blocks:
          - type: paragraph
            body: >-
              已披露利率下限对单线 fintech 贷款机构并不舒服。HDFC 和 ICICI 都宣传个人贷款起始利率 9.99%，Bajaj 披露 10% 至 30% 区间。相比之下，Freo 的 13% 年化下限、Fibe
              的 18% 起点，以及 LazyPay 的 15% 至 32%
              说明区间，都显示数字专业公司在优质客群价格上并未明显取胜。它们的防线是速度、数字便利性，以及覆盖银行定价不够积极或服务不足的借款人。随着分发集中在超大消费者入口内，这条防线更重要。PhonePe 声称有 65
              crore 以上注册用户和 4.7 crore 以上商户，Paytm 已经把贷款、postpaid、卡和商户贷款与上市公司报告捆在一起。CRED 又不同：品牌强、偏高端，但本轮中其官方消费贷款费用披露不透明，因为
              cred-cash URL 未能渲染可用产品页。RBI Digital Lending Directions 通过标准化披露、服务、冷静期和 DLG 处理的监管底线，进一步压缩只靠 App 的表层护城河。
