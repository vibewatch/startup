      - number: '7.4'
        title: 论点失效触发点与尽调问题
        blocks:
          - type: paragraph
            body: >-
              承销 KreditBee 的正确方式，是假设当前盈利和规模只有在平台扩张时合规与催收仍可治理的前提下才有意义。论点应由可衡量事件击穿，而不是由叙事不适感击穿。若出现真实的隐私或催收执法行动，迫使 App
              改版或暂停外包安排，就说明政策文件还不够。若私有组合审查显示 vintage
              漂移、滚动率上升，或损失率高于评级机构图景，就会击穿“近期规模增长伴随可控承销风险”的判断。同样，如果债务资金更贵或更难获得，而利率继续下行，利润率叙事也可能在没有单一灾难事件的情况下重置。因此，尽调必须越过政策页面：索取逐合作伙伴
              LSP 合同、催收代理名册和审计、投诉与 Ombudsman 趋势数据、数据流与本地化架构、产品级 vintage 曲线，以及按工具拆分的资金栈细节。在这些证据拿出来之前，缓释成熟度应视为喜忧参半，而不是强。
