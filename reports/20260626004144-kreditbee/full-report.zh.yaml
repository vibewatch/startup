        - 在 2026 年一级融资和合并后重组之后，更新 CAR 和杠杆
      - - 借款组合
        - 2025 年 12 月：NCD 48.1%；银行 22.5%；NBFC 15.8%；PTC 8.0%；CP 5.4%
        - 经佐证指标
        - 尽管盈利增长，业务仍依赖批发负债
        - 展示期限梯队、贷款方集中度和未提款银行额度
      - - 上市债务成本
        - ₹200 crore NCD 票息 10.65%；其他 CARE 列示 NCD 约 10.65% 至 10.95%
        - 经佐证指标加估算
        - 资金并不便宜，不能忽视利差压缩和信用成本风险
        - 提供包含费用和证券化利差的混合边际借款成本
      - - Series E 新股本
        - 2026 年 4 月 $220 million 一级资本
        - 经佐证指标
        - 支撑增长和 IPO 准备；降低短期资本压力
        - 详细说明募资用途在自有账簿增长、AI 和有抵押扩张之间如何分配
      - - 2026 年基准情景
        - PAT 为正 + 强 CAR + 新股本支持继续增长
        - 估算
        - 如果资产质量保持在当前区间内，可支撑 IPO 叙事
        - 测试 AUM 增速下滑和有抵押产品爬坡放慢的敏感性
      - - 2026 年下行情景
        - 信用成本上升或无抵押监管收紧，会迫使增长放慢或需要更多资本
        - 估算
        - 说明单靠盈利并不能消除融资依赖
        - 对资金成本上升 100-200 bps 和信用成本持续 7%+ 做压力测试
    notes: 情景行是分析师估算，锚定公开资本、负债和信用质量数据；没有现金在手披露。
