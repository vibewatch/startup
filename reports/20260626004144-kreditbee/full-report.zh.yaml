  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 借款人分层与地理结构
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的客户基础品类很宽，但承保形态仍然具体。公司自有页面持续描述一个数字获客的借款人基础，覆盖受薪和自雇用户，并叠加 SME
              营运资金需求、两轮车金融和房产抵押贷款交叉销售等相邻产品。公开产品页还显示，低薪和信用白户用户仍是获客故事的一部分，只要他们能够满足最低收入和数字 KYC 要求。地理是故事的重要部分。Fortune
              引用管理层称，只有 18% 客户在大都市，82% 在 Tier 1 至 Tier 4 或「mid India」城市；Moneycontrol 另称其在大都市以及 Tier 2、Tier 3
              城市都有牵引。KreditBee 自有房产贷款页甚至对 Tier 2 和 Tier 3 申请人使用低于 Tier 1
              和大都市用户的最低收入门槛，这是地理敏感承保的一个小而直接的迹象。需要注意的是，并非每个产品都同样全国化：两轮车产品仍明确只在 Bangalore、Mysore、Telangana 和 Tamil Nadu
              可服务，因此较新的有担保相邻产品看起来比旗舰无抵押漏斗更窄。
