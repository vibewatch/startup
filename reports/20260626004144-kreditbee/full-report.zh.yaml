  - id: TM001
    title: 市场边界与纳入逻辑
    columns:
      - 层级
      - 纳入支出
      - 排除支出
      - 借款人 / 用户 / 付款方
      - 重要性
    rows:
      - - 数字化发起的无抵押个人信贷
        - 由银行或 NBFC 入账、通过 App 或网页发起的个人贷款、信用额度，以及与薪资或现金流挂钩的消费信贷
        - 有抵押住房、车辆、教育和黄金贷款，或完全由分支机构主导的无抵押贷款
        - 借款人=用户：消费者；付款方：消费者；资本：RE 资产负债表
        - 最接近 KreditBee 类产品的核心市场
      - - 嵌入式信贷和 BNPL
        - 由受监管贷款机构支持的结账信贷、延期付款和商业场景分期产品
        - 没有底层受监管信贷的纯钱包或支付活动
        - 借款人=用户：消费者；付款方：消费者，有时商户通过 MDR 或补贴付款
        - 重要获客楔子，但不是整个数字贷款市场
      - - 数字化承销的 MSME 或商户金融
        - 使用数字报表、GST、交易或银行数据的营运资本、商户、发票和小企业贷款
        - 大企业关系型贷款和人工承销的中型市场贷款
        - 借款人=用户=付款方：业主或财务经理；资本：银行 / NBFC
        - 把 SAM 扩展到零售信贷之外，而这些领域的信贷缺口仍很大
      - - 信贷赋能轨道
        - AA、OCEN、ULI 和经同意的数据层，使数字信贷分发成本更低
        - 与贷款无关的支付、经纪或保险收入
        - 用户：贷款机构或 LSP；付款方：贷款机构，借款人间接承担
        - 关键增长驱动，但基础设施本身不是 TAM
    notes: 边界被限定在受监管数字信贷及相邻赋能，而不是整个金融科技生态。
    claimRefs:
      - CM002
      - CM006
      - CM013
      - CM034
