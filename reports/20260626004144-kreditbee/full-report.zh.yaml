  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价与变现架构
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的公开记录支持三类变现桶，而不是单线消费贷款故事。第一，官方产品页披露无抵押个人贷款、灵活贷款、商业贷款和两轮车金融的标价：无抵押核心通常位于 12% 至 28% APR，处理费最高 4.8%
              加 GST；有担保两轮车金融可在 10% 至 28% 之间。第二，MediaNama 称，市场平台实体的收入主要来自放款处理费，另有信用评估、开卡、服务费、营销和经纪类收入。第三，CARE
              称，合并业务还会确认自营资产的利息收入，因为 KrazyBee 除合作伙伴发放贷款外，也用自有 NBFC 资产负债表放贷。


              这个组合重要，因为它把已印证指标与公司说法分开。已印证项目包括列示的 APR
              和费用区间、自营账簿利息收入的存在，以及附加费用线的存在。公司说法从这里向外扩展：管理层称未来增长将依赖向既有客户交叉销售，官方页面也显示交叉销售菜单已覆盖商业贷款、灵活个人贷款、两轮车金融和房产抵押贷款。仍不可得的是利差收入、处理费收入和增值服务之间的精确收入结构，因此任何承保模型都应把标价视为上限经济性，而不是实际收益率。
