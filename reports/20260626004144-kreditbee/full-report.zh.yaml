      - number: '1.3'
        title: 融资历史、规模指标与里程碑记录
        blocks:
          - type: paragraph
            body: >-
              资本叙事有三层：2022 年一轮后期融资在困难市场中支持产品扩张，2023–2024 年进入延期或过桥阶段且公开估值标记不一致，2026 年 IPO
              前融资则把公司推入独角兽区间。TechCrunch、Moneycontrol、Financial Express 和 The Tech Portal 都同意，KreditBee 于 2022 年 12 月在
              Premji Invest、Motilal Oswal Alternates、NewQuest、Mirae Asset 和 MUFG 支持下融资 $80M。仍不清爽的是从那一刻到 2026 年 4
              月的总融资和估值桥接。Entrackr 称 2023 年延期轮给公司的估值约 $700–800M；Tracxn 显示 2024 年 3 月有一笔约 $9.4M 的 Series D 交易，估值约
              $184M；Moneycontrol 称 2026 年融资后总融资约 $540M；Inc42 Datalabs 列示超过 $642.65M；InforCapital 列示
              $674M。这种离散说明各方对二级交易、延期轮或非一级资本采用不同口径，因此本章把累计资本列为尽调事项，而不是已确定 KPI。


              规模指标方向上很强，但还没有达到申报文件级一致。CARE Ratings 给出最好的独立分析型 AUM 序列：2024 年 3 月为 ₹7,644 crore，2024 年 9 月为 ₹8,735
              crore。Moneycontrol 随后报道 FY25 AUM 为 ₹10,100 crore，FY26 AUM 约 ₹15,000 crore；Fortune India 则称 2026 年每月约从 55
              lakh 活跃借款人处收回还款。公开来源也一致认为，到 2026 年，公司拥有超过 1800 万独立贷款客户、促成超过 6000 万笔贷款、App 下载量超过 2.3 亿。主要缺口同样重要：任务简报中提到的
              2024 年 470 万以上活跃借款人点位，未能在抓取来源集中获得独立印证；FY25
              收入或利润数字在可靠媒体之间也有冲突。这些不一致不否定增长故事，但意味着任何投资备忘录都应锚定已互相印证的运营区间，并在估值工作前明确隔离未解决指标。
