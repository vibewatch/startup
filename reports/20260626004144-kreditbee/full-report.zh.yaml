        - FY26-FY27 披露证明盈利可持续、信用成本改善，且 IPO 投资者接受「成长型放贷机构」溢价叙事。
        - 在更干净、更大的资产负债表上给 4.8-5.3x 账面价值，或溢价盈利倍数。
        - $1.7B-$2.2B
        - 20%
        - IPO 时间表错过、融资利差粘住，或监管担忧重新出现。
      - - 基准
        - KreditBee 继续增长并保持盈利，但公开市场会因无抵押敞口和透明度不足给折扣。
        - 约 3.5-4.3x 账面价值，并有温和收入倍数支撑。
        - $1.2B-$1.6B
        - 50%
        - 信用成本维持高位，或 IPO 文件显示组合质量弱于公开文章暗示。
      - - 熊市
        - 因融资、损失或治理担忧，公开或私募市场将公司重估到更接近普通无抵押放贷机构的倍数。
        - 约 2.5-3.0x 账面价值，稀缺性溢价有限。
        - $0.9B-$1.1B
        - 30%
        - 再发生行为事件、RBI 大幅收紧，或下一轮融资持平到下行。
    notes: 所有区间均使用公开证据和明确假设；它们是情景估计，不是管理层指引。
