      - number: '5.3'
        title: 信任、合规、可靠性与支持控制
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的信任栈在披露层比在运营控制层更容易看到。官网页脚暴露了隐私、申诉救济、公平实践和安全中心 URL；Apple
              隐私标签显示了相当多的已关联数据：财务、位置、联系信息、通讯录、用户内容、使用情况和诊断，且标识符可能用于跟踪。Google 自己的帮助文档可用来校验这些披露意味着什么、不意味着什么：Data safety
              表面由开发者提供，UPI 徽章范围很窄，因此这些商店披露是必要证据，但不足以证明强安全工程。


              最重要的不利事实是监管，而不是技术。RBI 的 2025 年 Digital Lending Directions 直接映射到 KreditBee 流程，要求信用资质评估、披露和
              KFS、申诉救济、隐私政策，以及技术数据控制。另行地，RBI 在 2023 年因催收代理骚扰相关的重复投诉和控制失效，对 KrazyBee Services
              处以罚款。这不能证明当前控制薄弱，但意味着催收行为应纳入产品尽调，而不只放在法律或财务审查中。可靠性的公开透明度仍然薄：已审阅来源没有找到状态页、正常运行时间指标、公开事故日志，或关键法律页面的可读非交互式政策文本。
