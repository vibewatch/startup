      - number: '2.3'
        title: 借款人分层、数字采用与买方-付款方结构
        blocks:
          - type: paragraph
            body: >-
              印度数字贷款最重要的分层不是 App
              品牌，而是借款人信用档案厚度、收入规律性，以及最终由谁提供风险资本。零售消费者仍是最大的变现池，但结构性开口最快的，是传统一线城市受薪客群之外的薄档案和首次借款人。TransUnion CIBIL
              的证据显示，首次借款人更年轻、更偏农村，并且越来越来自非大都市；World Bank 普惠数据则显示，拥有账户本身并不能消除数字使用或性别差距。App
              主导贷款正试图卡在这个缺口里：正式征信深度形成之前，借款需求已经存在。MSME 构成第二个大楔子，即便在 Udyam
              注册企业中，正式信贷渗透仍不完整。买方、用户、付款方的拆分同样重要：借款人使用产品，但资本往往仍来自银行或 NBFC 资产负债表，fintech 或 LSP
              控制获客、承保流程或服务体验。换句话说，数字分发可以比资产负债表所有权扩张得更快。
