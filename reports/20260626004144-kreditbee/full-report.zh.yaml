      - number: '7.2'
        title: 信用、资金与利润率风险
        blocks:
          - type: paragraph
            body: >-
              KreditBee 已不再是脆弱的早期贷款机构，但评级机构记录仍提示核心财务模型需要谨慎看待。CARE 和 Acuité
              显示，公司近期增长强劲、盈利可观、资本充足。这些都是实质利好。同一批报告也解释了为什么承销下行时应把它视为模型风险，而不是遥远尾部。FY25 信用成本仍高，过去 18 个月总 NPA
              指标有所波动，评级机构仍把贷款账簿描述为暴露于无抵押贷款固有波动之下。公司已扩展到企业贷款和房产抵押贷款，但这只是增加新的承销制度，并未消除对无抵押贷款的敏感性。负债端，NCD 仍是最大资金桶，银行和 NBFC
              依然重要。CARE 明确指出，2024 年 9
              月后平均贷款利率下调，因此公司现在更依赖对信用损失、运营费用和资金成本的纪律性控制。这意味着投资逻辑即使没有偿付能力危机也可能失效：损失曲线或资金成本小幅恶化，仍会压缩利润率、拖慢增长，并实质改变 IPO 叙事。
