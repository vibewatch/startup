chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与运营模式
        blocks:
          - type: paragraph
            body: >-
              KreditBee 是一家总部位于班加罗尔的数字消费贷款平台，对外定位为贷款撮合方，把借款人与 RBI 注册的 NBFC 和银行连接起来，同时也通过自有 NBFC 机构 KrazyBee Services
              运营。官网、应用商店页面和产品页都持续强调一个移动优先的主张：即时个人贷款、商业贷款、两轮车金融、房产抵押贷款，以及相邻的 UPI
              或信用报告服务。尽调需要关注这一运营逻辑，因为同一品牌横跨软件分发、获客、承保技术和受监管的贷款资产负债表活动，而不是纯市场平台。这一结构有利于控制放款和催收，但也把品牌直接绑定到受监管信贷行为结果上。


              因此，最干净的身份锚点不是某个单一营销年份，而是一条分层时间线：Finnovation Tech Solutions 于 2016 年注册成立，KrazyBee 于 2017 年获得 NBFC
              牌照，多个公开资料则称 KreditBee 本身在 2018 年成立或上线。公开数据也指向同一个后期私营状态：公司在 2026 年 4 月完成 $1.5B 估值的 Series E
              融资后进入独角兽行列。总部证据相对扎实，因为官网元数据和两个应用商店都指向班加罗尔 Kodihalli、HAL Old Airport Road
              的同一地址。公开披露的产品经济性也足够具体，可供后文复用：个人贷款宣传区间为 ₹6,000 至 ₹10 lakh，典型期限为 6 至 60 个月，面向消费者的定价大致为年利率 12% 至 28.5%，应用商店
              APR 示例最高到 50%。
