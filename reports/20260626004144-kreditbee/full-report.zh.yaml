      - number: '2.4'
        title: 增长驱动、约束与监管叠加
        blocks:
          - type: paragraph
            body: >-
              印度机会很大，因为数字公共基础设施、移动优先信贷旅程，以及服务不足的零售和 MSME 需求，都在持续把漏斗向外推。但同一个市场也受到更明确的监管叠加约束，强度高于许多自上而下预测的假设。RBI 的 2022
              年指南和 2025 年 Directions 要求贷款机构与借款人直接资金流转、APR 和 KFS 披露、冷静期权利、申诉处理和 DLA 报告。2023
              年无抵押信贷风险权重冲击，使资本强度成为实时运营变量，尤其影响依赖无抵押个人贷款、信用卡或面向 NBFC 批发融资的贷款机构。这意味着增长越来越偏向能够把合规发放、耐久资金和风险控制结合起来的模式，而不只是
              App 安装速度快。银行和大型 NBFC 在定价和票面规模上仍是强劲竞争者，因此 fintech 差异化转向更快开户、薄档案承保、半城市覆盖和更好使用经同意的数据。不利情景很直接：如果 RBI
              看到无抵押信贷压力或不当行为再度出现，可服务市场收窄的速度可能快于标题 TAM 扩张。
