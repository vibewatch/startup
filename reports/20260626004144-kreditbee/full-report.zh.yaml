      - number: '8.4'
        title: 牛 / 基准 / 熊情景与下行触发点
        blocks:
          - type: paragraph
            body: >-
              牛市情景并非幻想，但它需要的不只是标题增长。在牛市情景下，KreditBee 需要证明：接近 ₹15,000 crore 的 FY26 AUM
              伴随稳定或改善的信用成本、不断提高的抵押和企业贷款占比、更低资金成本，以及达到公开市场标准的披露；随后才可能把 2026 年私人估值转换成可信的 IPO 或 IPO
              前上调。在这些条件下，投资者可以为更大的盈利基数支持 4.8-5.3 倍账面区间，或中高个位数收入倍数，对应约 17-22
              亿美元股权价值。该情景还假设没有新的负面监管行动，且催收历史仍是历史污点，而不是反复出现的控制问题。


              基准情形更清醒，也是按当前证据最可能的路径。KreditBee 继续增长并保持盈利，但公开投资者会因无抵押敞口、批发资金和透明度不足给出折价。在这条路径上，价值集中在 12-16 亿美元附近，大致围绕 2026
              年 4 月估值；只有 IPO 过程展示出比私人市场迄今更干净的披露时，才有温和上行。熊市情景对入场纪律最重要。如果公开投资者或下一轮私人融资因为资金利差、信用成本持续或治理折价，把公司重估到接近 2.5-3.0
              倍账面价值，隐含价值会降至约 9-11 亿美元。这并不意味着业务崩塌，但会给按当前价格入场的投资者带来真实的平轮或下轮风险。
