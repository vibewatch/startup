      - 公开披露质量
      - 转换成本特征
      - 战略含义
    rows:
      - - KreditBee
        - 自有 App + 数字化获客
        - RBI 挂钩的 NBFC 与贷款合作伙伴结构；不靠存款融资
        - 中
        - 合同锁定弱；复用取决于审批速度和 UX
        - 必须在速度和薄信用档案风控更重要的场景取胜
      - - Freo / MoneyTap
        - 自有 App 与信用额度主张
        - 非银行、App 驱动结构；产品页明确披露按使用计息
        - 中
        - 低；用户可以同时使用多个信贷 App
        - 靠灵活结构竞争，而不是靠利率领先
      - - Fibe
        - 自有 App + 合作伙伴网络
        - 非银行金融科技，合作伙伴分发覆盖面大
        - 产品条款和规模披露为中到高
        - 低到中；合作伙伴网络更利于获客，而非锁定
        - 保留来源集中最成规模的直接同业
      - - CASHe
        - 自有 App
        - 官方页面被阻断，无法判断
        - 低
        - Unknown
        - 不透明本身就是尽调和信任劣势
      - - HDFC / ICICI
        - 银行 App、网点、工资账户关系
        - 低成本受监管银行资金，加上强合规基础
        - 高
        - 中，通过银行关系和预批准报价形成
        - 在优质客群价格和信任上很难击败
      - - Bajaj Finance
        - 网点、合作伙伴和数字化全渠道
        - 大型受监管 NBFC，分发经济性强
        - 高
        - 中，通过既有零售金融关系形成
        - 既能挑战金融科技速度，也能挑战传统机构触达
      - - Slice
        - 银行 App + 存款和 UPI 信用卡组合
        - 存款融资的银行姿态，而不是纯 LSP 经济模型
        - 中
        - 银行关系加深后可达中等
        - 代表品类向更低成本资金栈迁移
      - - PhonePe / Paytm
        - 日常支付与商户生态
        - 巨大规模，加上多产品监管姿态；Paytm 还提供公开市场披露
        - 中到高
        - 合同锁定弱，但行为习惯极强
        - 最危险的分发驱动型进入者
      - - CRED
        - 高端信用卡还款习惯和品牌
        - 官方消费贷姿态不透明；第三方来源显示合作伙伴驱动放贷
        - 低到中
