          - type: callout
            title: 边界纪律比标题 TAM 更重要
            body: 公开机会集横跨从消费信贷存量到宽泛数字融资叙事的所有内容。承保时，有用的市场是能够数字发放、合规服务并获得耐久资金的受监管切片。
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
              - CM039
          - type: callout
            title: 监管既是护城河，也是刹车
            body: RBI 规则可以提高客户信任、淘汰弱运营者，但也会提高无抵押贷款机构的合规成本和资本强度，尤其在风险权重和 DLA 审查收紧时。
            calloutType: risk
