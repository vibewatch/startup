      - number: '1.2'
        title: 创始人、领导层、治理与历史行为记录
        blocks:
          - type: paragraph
            body: >-
              领导层证据异常偏创始人中心。多篇 2026 年融资报道都点名 Madhusudan Ekambaram、Karthikeyan Krishnaswamy 和 Vivek Veda
              为三位创始人，公开职位标签分别趋同于 CEO、CTO 和 CFO。Madhusudan 也是融资、承保、风险和 IPO
              准备采访中最主要的外部发言人；这有助于叙事一致，却也提高了关键人物集中度。更广泛治理的公开来源质量明显弱得多：已审阅来源没有给出可靠的现任董事会名单、独立董事名单或委员会图谱，所以后续尽调应把治理深度视为待完成工作，而不是既有优势。


              可见的是，随着公司接近公开市场目标，治理和监管准备变得更重要。MediaNama 和 Asia Business Outlook 称集团已将注册地迁回印度，并寻求把技术实体和 NBFC
              实体合并成更简单的上市载体；2026 年媒体也反复把 4 月融资描述为 IPO 尝试前最后一轮大型私募融资。这个准备故事被一项真实的历史行为问题抵消：印度储备银行在 2023 年因 KrazyBee
              Services 存在持续投诉，且未能防止催收代理骚扰或恐吓，对其处以 ₹42.48 lakh 罚款。这一事件重要，因为 KreditBee
              的品牌承诺依赖信任、速度和合规；后续章节不应把历史规模增长当成催收、客户体验或监管控制已完全去风险的证明。
