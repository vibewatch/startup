  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的正向估值逻辑是真实的，不应被视为纯叙事。公司现在有外部投资者最近定价的一轮融资，而不只是 2021-2024 年的陈旧风险投资标记。公开报道口径一致：2026 年 4 月 Series E
              融资 2.8 亿美元，投后估值 15 亿美元，其中 2.2 亿美元为新一级资本，6000 万美元为二级流动性。CARE 和 Moneycontrol 也支持一个判断：公司已不再是早期烧钱贷款机构。FY25
              合并收入或收益约达 ₹2,712 crore，PAT 约达 ₹473 crore，FY25 AUM 超过 ₹10,102 crore，2025 年 12 月 AUM 达 ₹13,141 crore，管理层指引的
              FY26 AUM 接近 ₹15,000 crore。这很重要，因为后期私人贷款机构如果规模未经证明或缺乏利润，通常会被严厉重定价；按公开记录，KreditBee 已越过这两道门槛。


              反论点是，当前估值已经资本化了相当多的进展，却给投资者留下比上市贷款机构更薄的披露。同一公开记录显示，FY25 信用成本占平均资产 7.7%，结构性偏高；公司仍依赖批发资金；2025 年至少有一只上市 NCD
              票息为 10.65%；2023 年还因催收代理骚扰或恐吓受到 RBI 处罚。公开估值语境也并不干净，而是噪声很大：MediaNama 2026 年 1 月报道仍提到约 4 亿美元累计融资和 7 亿美元前次估值，而
              Financial Express 引用 Tracxn 数据，指向低得多的 2024 年 3 月估值语境。这不能证明 2026 年 4
              月那轮错了，但意味着从上一轮私人标记到新独角兽标记之间的桥，不像标题显示的那样透明。正确结论不是“坏公司”，而是“公司不错，但已经为大量执行兑现定价”。
