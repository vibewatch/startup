      - number: '7.3'
        title: 运营、合作伙伴与执行风险
        blocks:
          - type: paragraph
            body: >-
              运营问题在于，KreditBee 能否在合作伙伴网络持续扩张时，让一个高速、多产品的消费金融栈保持可靠且合规。公开材料指向广阔的运营表面：个人贷款、UPI 支付、企业贷款、两轮车金融和 LAP；合作伙伴披露显示
              KreditBee 的技术实体参与
              KYC、欺诈检查、催收、客户支持和产品管理；评级报告确认存在有意义的联合贷款与表外敞口。这带来至少三类依赖。第一是模型与欺诈依赖：快速周转承销和外部数据供应商意味着，数据质量或欺诈控制一旦漂移，问题会迅速传导。第二是服务与催收依赖：投诉界面反复指控暴力催收、错号骚扰、联系亲属，即使这些帖子并非已裁定事实。第三是组织依赖：IPO
              前合并和公众公司化可以让边界更清楚，但也要求法律实体、财务、技术和合作伙伴控制同步推进。公开治理信号并非为零——Acuité 提到独立董事以及风险和 IT
              委员会——但公开记录仍未披露投诉量、代理审计结果或逐合作伙伴的控制证据，无法证明大规模下的缓释成熟度。
