      - number: '2.2'
        title: 规模测算视角与相互矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              边界确定后，公开数字仍然大幅分叉。ETBFSI 引用的 IIFL FinTech 估计，意味着数字贷款账簿将从 2021 年 USD 38.2B 增至 2030 年 USD 515B；Precisa
              则引用更宽的数字融资机会，认为将从 2022 年 USD 270B 增至 2030 年 USD 1.3T。MarkNtel 的 2026 年 USD 59.44B fintech 市场和 IMARC 的 2025
              年 USD 40.9B 消费信贷存量，不能替代上述任何一个估计；它们只是分母不同的相邻视角。6Wresearch 又给出 22.1% CAGR 的增长观点，但没有等价规模基数。结论不是某个预测「错误」，而是宽口径
              TAM 估计建立在互不兼容的范围选择上。承保 KreditBee 更可用的框架是受约束的规模测算：从数字发放的无抵押个人信贷出发，加上仍能通过 RBI 行为、资金和风险测试的相邻嵌入式信贷或 MSME
              楔子，再把更宽的万亿美元叙事视为外沿背景，而不是经营现实。
