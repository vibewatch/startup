      - number: '8.6'
        title: 退出就绪度、论点失效触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出就绪度有所提高，但尚未被证明。2026 年 4 月融资、多家媒体的 IPO 叙事，以及公司展示出的盈利能力，都让 KreditBee
              比大多数私人消费信贷金融科技公司更接近退出。这已不再是一家需要靠英雄式商业化跃迁才能达到相关性的公司。可能的退出路径是 IPO 或 IPO 前 crossover
              流程，而不是战略出售，因为上市公开可比公司已经存在，公司似乎也在向这条路径简化。即便如此，就绪度仍取决于披露质量。投资者仍没有公开 cap-table waterfall、经审计的 FY26 合并报表、产品级信用
              vintage 曲线、证券化和联合贷款盈利拆分，或能证明 2023 年催收相关处罚已经转化为一流治理控制的证据。


              投资论点最快会被定价纪律击穿，而不是被生存危机击穿。如果公开或后期私人流程把 KreditBee 定价到接近 2.5-3.0 倍账面价值，这不一定否定 franchise，但会说明 2026 年 4
              月标记过高。第二个击穿触发点是信用成本持续接近或高于 FY25 7.7% 水平，同时增长放缓，因为这组组合会同时压缩 ROE
              和公开市场胃口。第三个是治理或监管复发：另一项严重行为问题会让一家依赖数字信任和复借的公司承受长期估值折价。因此，实际下一步不是立刻兴奋或一概否决，而是围绕价格、条款和损失行为做有针对性的尽调。
            claimRefs:
              - CV001
