        - 法院命令、RBI 行动或应用商店合规介入
        - 任何点名认定 KreditBee、KrazyBee 或已披露 LSP 违反 DLA 数据权限规则的结论
        - 暂停上行情景，重新评估转化、合规成本和合作伙伴整改时间表
      - - 催收行为失控
        - 投诉或申诉专员趋势叠加内部审计失败
        - 回收投诉持续上升、有记录的亲属联系人触达，或催收人员审计例外未及时关闭
        - 把行为风险视为结构性问题，下调增长 / 品牌假设
      - - 信用损失显现
        - 组合放款批次和滚动率审查
        - 任何私下尽调显示损失、30+ DPD 或核销指标明显差于评级机构图景
        - 降低盈利信心，要求更高回报门槛或更低入场价格
      - - 利润率压缩
        - 资金成本上升叠加贷款收益率下降
        - 债务利差上行、融资渠道变弱，或无法抵消平均贷款利率下降
        - 下调正常化盈利能力和估值倍数假设
      - - 合作伙伴或外包失效
        - 主要出借方 / LSP / 供应商发出终止、整改通知或出现重大 SLA 违约
        - 任一主要合作方暂停联合放贷、催收、KYC 或客户支持工作流
        - 重新评估获客放款吞吐量，以及围绕客户整改的剩余责任
      - - IPO / 治理延误
        - 重组或控制里程碑未达成
        - 有证据显示合并清理、审计准备或披露控制落后于预期公开市场时间表
        - 将 IPO 可选性视为延后，并降低论点中的治理溢价
    notes: 阈值是投资者基于公开风险证据设定的警戒线，不是管理层指引。设计目的在于下行信号叠加时，迫使团队快速重新承保。
