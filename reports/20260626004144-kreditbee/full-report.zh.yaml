      - number: '6.3'
        title: 具名证明、App 评分与不利客户证据
        blocks:
          - type: paragraph
            body: >-
              客户证明存在，但投资人应区分自发布背书和独立满意度信号。KreditBee 网站发布了 Ram、Tina Bhattacharya、Hiren Joshi、Abhishek Barua、Hardev
              Kumar、Navi、Ankur Sharma 和 Amal Kunjumon
              的具名推荐。这些引语一致强调速度、无纸化审批、重复使用，以及及时还款后获得更高额度，因此可作为真实零售借款人与产品互动的证据。但它们不足以单独证明留存质量，因为它们受营销控制，且不披露日期、贷款规模或已验证结果。独立信号混合。Apple
              App Store 仍显示 51,000 个评分下 4.4/5 的强评分，但 TrustGate 只有 1 条已验证评论、2.0/5，ConsumerComplaints.in
              则有多条关于客服粗鲁、反复来电、隐私泄露和重复扣款的指控。不利证据不只是轶事噪音：RBI 在 2023 年因发现持续或重复投诉、催收代理使用骚扰或恐吓而处罚
              KrazyBee，较近期投诉板上的指控与这一更早监管问题高度押韵。因此，客户证明支持使用量，评论证据仍提出真实的催收和服务质量警示。
