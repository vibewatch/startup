  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 规模测算前先划边界
        blocks:
          - type: paragraph
            body: >-
              印度数字贷款机会只有在边界收紧后才显得连贯。本章的相关市场，是由受监管贷款机构或其贷款服务提供商通过数字渠道发放并主要服务的信贷：无抵押个人贷款、BNPL 或嵌入式消费信贷，以及数字承保的 MSME
              营运资金或商户金融。这个范围有意排除纯支付、财富或保险 fintech，以及大多数抵押、车辆贷款、黄金抵押贷款等有担保产品。排除很关键，因为许多乐观估算把贷款账簿敞口、fintech
              收入和支付平台活动混在一个标题下。RBI 的规则体系强化了同一边界：监管关注的是数字信贷行为、资金流、披露、DLA 治理和外包发放，而不是整个 fintech
              栈。因此，实用的市场定义是搭载数字轨道的受监管信贷市场，而不是泛泛的「印度 fintech」市场。
