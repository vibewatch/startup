      - number: '5.2'
        title: 流程、承保与可观察技术栈
        blocks:
          - type: paragraph
            body: >-
              能够实际验证的客户流程很直接。公开页面和应用商店文案显示，借款人用手机号注册，提交 PAN 和 Aadhaar 关联身份信息，上传地址、收入或商业文件，提供银行信息，获批后资金直接进入银行账户。KreditBee
              自有博客和个人贷款页面补充了工资单或商业证明，还款入口则指向 App 或网站流程，以及 NEFT、ECS 和 UPI。Fortune 2026
              年采访也强化了设计意图：管理层明确称，公司希望采用无面对面数字承保模式，而不是基于网点会面的借款人流程。


              承保栈只部分可见。最强公开证据不是来自 KreditBee 自己的技术文档，而是合作伙伴 Digitap；其材料描述了数字 KYC、OCR、银行流水摄取、替代数据评估和 Account Aggregator
              连接。Mediabrief 又提供证据称，一次试验使用了网银、PDF 上传和 AA 模式，获取了超过 1 lakh 份流水。这是银行数据自动化的有意义证明，但不等同于已验证的 KreditBee
              内部模型架构视图。公开材料支持 AI 辅助和替代数据辅助决策；它们不能独立证明详细模型拓扑、数字化的「1000+ 变量」计数，或营销中常暗示的每类信号都已投入生产。
