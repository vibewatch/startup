      - number: '6.2'
        title: 采用轨迹、活跃借款人与票面规模
        blocks:
          - type: paragraph
            body: >-
              规模证据明显高于简报中的 470 万借款人标题。2026 年多篇报道反复称，KreditBee 拥有超过 1800 万独立贷款客户、促成超过 6000 万笔贷款，并有约 2.3 亿 App 下载。Fortune
              给出最具体的实时活跃数字，称公司每月从约 55 lakh 活跃借款人处收取还款；同时引用管理层称每日新增下载约 7 万、每日向独立借款人发放约 3 万笔贷款。Moneycontrol
              又补充一个单独处理量数据：每日贷款请求约 7 万，批准率约 10%。票面规模也支持这是一个高频贷款机构，而不只是大票面 NBFC。KreditBee 自有受薪和自雇页面仍宣传大众市场无抵押漏斗，贷款 ₹6,000
              至 ₹10 lakh，最低月收入 ₹10,000；外部报道显示整体平均票面约 ₹60,000，自雇借款人约 ₹25,000，受薪借款人约 ₹80,000，CARE 的平均无抵押票面快照约
              ₹30,000。总体看，证据支持一个规模化、重复使用的信贷平台；其实时活跃借款人数如今用 550 万月度付款人来框定，比 470 万更合适。
