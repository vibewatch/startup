  - id: TV005
    title: 论点失效和否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - 估值重估到 3x 账面价值以下
        - 在账面价值大致不变时，公开或私募价格发现隐含 <$1.1B
        - 说明 2026 年 4 月标记估值过高，并压缩后入场回报潜力。
        - 除非证据质量明显改善，否则从跟踪转为放弃。
      - - 信用成本粘性
        - 增长放缓时，信用成本仍接近或高于 FY25 的 7.7%
        - 侵蚀高成长放贷机构叙事，并伤害公开市场胃口。
        - 按更低 ROE 假设重做估值。
      - - 治理 / 行为问题复发
        - 再发生严重催收、合规或客户骚扰问题
        - 把历史折扣转化为正在发生的控制失效。
        - 立即暂停尽调；要求提供治理整改证明。
      - - 资金成本压力
        - 债务成本维持低双位数，而优质竞争对手能以更低成本再融资
        - 压窄利差，也降低支付溢价倍数的意愿。
        - 下调公允价值区间，并延长持有期假设。
      - - 披露令人失望
        - IPO 或尽调资料包无法调节主体范围、股权结构或损失批次
        - 拿掉支撑 4x 以上账面价值估值的证据路径。
        - 披露修复前，按当前价格不参与。
    notes: 这些都是可监控触发项，直接把运营证据连接到估值变化。
