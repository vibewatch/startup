      - number: '8.2'
        title: 建议、置信度、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              建议立场是跟踪 / 继续研究，而不是买入，也不是放弃。价格敏感性是关键区别。在 2026 年 4 月 15 亿美元估值或以上，公开证据支持的结论更接近公允偏贵，而不是明显的上行不对称。拥有自有 NBFC
              资产负债表的贷款机构，应主要按账面价值、盈利耐久性、资金组合和信用损失来承销，再用收入和 AUM 交叉检查；风险投资式 DCF
              并不合适，因为公开披露没有给出稳定、分部级的前瞻假设。用这个更合适的视角看，Series E 意味着约 ₹12,750 crore 股权价值；按 ₹85/$ 假设，约为 FY25 有形净资产 4.1 倍、FY25
              收入 4.7 倍、FY25 PAT 27 倍。这些倍数并非不理性，但对一家拥有实质无抵押敞口、按评级机构标准资产质量中等且公开披露不完整的贷款机构来说，要求已经不低。


              置信度为中，而不是高，因为估值方法方向正确，但多个入场关键细节仍是私有信息：清算优先权栈、反稀释保护、FY26 经审计实体桥接、产品级 vintage 曲线，以及 IPO
              银行对可接受公开市场定价的任何反馈。风险评级为高。公司明显强于失败的消费信贷同行，但如果 RBI 政策收紧、资金利差居高不下，或 IPO
              投资者坚持公开可比公司纪律而非私人轮稀缺性，下行仍有意义。只有在两个条件之一出现时，立场才会上调到可投资：要么价格明显降低，接近 FY25 账面价值约 3.0-3.3 倍；要么证据质量提升，包括 FY26
              经审计披露、股权结构透明度，以及能证明守住 4 倍以上账面倍数的 cohort 损失数据。
