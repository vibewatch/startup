  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与隐私风险
        blocks:
          - type: paragraph
            body: >-
              KreditBee 最大的剩余风险不在于数字贷款规则缺位，而在于合规边界扩张速度快过公司公开证明执行质量的速度。RBI 的 Digital Lending Directions 对 NBFC
              及其贷款服务提供商提出了明确义务，覆盖同意、数据最小化、投诉处理、催收代理披露以及印度境内数据存储。KreditBee 自身公开材料显示，公司采用广泛的促成方模式，连接多家 RBI 注册 NBFC 合作伙伴，靠
              App 完成获客，并提供多种产品。这套模式能放大规模，但也增加了同意设计、隐私姿态和外包行为出错的节点。负面证据重要：2026 年 Delhi High Court 的审查正在检验 RBI 执法是否真的遏制了
              NBFC 支持 App 对通讯录和通话记录的滥用；投诉平台也反复出现骚扰和隐私侵扰指控。KreditBee 确实披露了申诉渠道，合作伙伴也识别出催收与 KYC
              支持角色，这是缓释因素。但公开记录仍无法说明，实际控制是否强到足以抵御执法驱动的 App 改版、合作伙伴整改或声誉冲击。
