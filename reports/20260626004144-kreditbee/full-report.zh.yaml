  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 状态 / 指标
      - 倍数或估值语境
      - 为什么重要
      - 局限
    rows:
      - - CRED
        - 私营高净值消费者金融科技公司
        - 2025 年为 $3.5B，较 2022 年 $6.4B 峰值下调约 45%
        - 最强的负面私营金融科技信号：即便已有规模，印度后期消费者金融科技估值仍可能下调。
        - 业务组合比纯放贷更宽，公开披露仍有限。
      - - Fibe
        - 准备 IPO 的私营数字放贷机构
        - 2026 年 IPO 报道指向 >$1B 潜在估值；此前 2024 年估值约 $600M，累计融资约 $228M
        - 有用的私营直接放贷可比公司，因为其产品组合比 CRED 更接近 KreditBee。
        - IPO 结果还不是最终定价，公开来源质量也弱于已提交招股书。
      - - Bajaj Finance
        - 上市优质 NBFC
        - Screener 截图显示市值 ₹6,10,393 crore、每股账面价值 ₹183；当前价格隐含约 5.4x P/B
        - 说明公开市场愿为有规模、有披露、高质量的印度放贷机构支付什么价格。
        - 资金结构、期限和披露质量都明显强于 KreditBee。
      - - SBI Cards
        - 上市信用卡放贷机构 / 消费信贷可比公司
        - Multiples.vc 显示约 $6B 市值、$11B EV、5.6x EV/收入
        - 为消费信贷变现和上市纪律提供公开市场交叉校验。
        - 信用卡经济性不同于个人贷款或 NBFC 资产负债表经济性。
      - - OneCard
        - 私营卡优先金融科技公司
        - 本资料包中只能定性使用；无法用可访问的 2026 年直接来源重新核验当前估值
        - 与用户行为和高收入 App 原生竞争有关，尤其是消费信贷界面质量。
        - 这里缺少新的直接定价锚，因此不应驱动数字估值判断。
    notes: 数字重点放在有可复用估值证据的可比公司上；OneCard 因当前直接来源估值链条不完整，仍只作定性参考。
    enumerationScope:
