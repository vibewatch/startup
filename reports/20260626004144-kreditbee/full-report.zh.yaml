      - number: '4.4'
        title: 情景框架、不可得指标与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从财务上框定 KreditBee，最干净的方式是拆分已印证指标、公司说法、估计和不可得数据。已印证指标包括超过 ₹10,000 crore 的 AUM、合并 FY25 PAT ₹473 crore、2025 年
              3 月 CAR 29.59%、低双位数上市债票息，以及 2026 年超过 1800
              万独立贷款客户的借款人说法。公司说法包括交叉销售野心、每日下载和贷款处理量轶事，以及公司盈利足以自筹部分投资的宽泛表述。投资人开始推断实际变现率、经股权成本调整的资金成本，或按产品线穿透的盈利能力时，就进入估计区间。最与承保相关的仍是不可得项目：没有公开现金余额、没有月度现金消耗、没有直接
              EBITDA 披露、没有产品级 NIM、没有账龄批次损失表、没有拨备覆盖桥接，也没有合并实体经审计的并表后 FY26 报表。


              因此，本章的情景视角不是现金跑道模型，而是资本充足模型。基准情景：当前 CAR 强、PAT 为正、新增一级股权支持再扩张一年，同时有担保组合上升。下行情景：RBI 收紧数字贷款经济性、信贷成本持续在 7%
              以上，或批发融资利差维持低双位数，会压缩回报并迫使贷款账簿放慢扩张。上行情景：如果有担保组合放量、交叉销售奏效、资金成本继续下降，上市前公开盈利能力可能证明具备耐久性。因此，阻断性尽调要求是实体调节、产品
              cohort 损失曲线，以及真实的资金成本加现金头寸资料包。
