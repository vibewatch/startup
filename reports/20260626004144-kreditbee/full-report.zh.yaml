  - id: TP005
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 尽调问题
    rows:
      - - 快速数字化放款足以形成差异化
        - 银行和大型 NBFC 现在也营销即时或预批准个人贷款
        - 高
        - HDFC、ICICI 和 Bajaj 都发布数字化个人贷款流程和更低利率下限
        - 首笔贷款之后，审批速度或复用优势还剩多少？
      - - BNPL 相邻业务能形成持久漏斗力量
        - Simpl 和 ZestMoney 显示，BNPL 触达可能在监管或资金压力下坍塌
        - 高
        - Simpl 暂停和 ZestMoney 关闭是直接反向先例
        - KreditBee 需求中，多少来自结账场景，多少来自反复信用需求？
      - - 品类规模保证存活
        - 即便拥有 17M 用户和 85K 触点，ZestMoney 仍然失败
        - 高
        - 大规模历史足迹没有阻止关停
        - 如果没有补贴性资本，KreditBee 哪些单位经济仍能守住？
      - - 私营金融科技可以保持不透明且无需付出代价
        - CASHe 和 CRED Cash 的不透明，让准确价格和合作伙伴质量变成尽调缺口
        - 中
        - 官方页面被阻断或不可用，导致若干单元格无法判断
        - 管理层能否按要求提供贷款机构名单、费率表和 cohort 表现？
      - - 超级 App 只是间接威胁
        - PhonePe 和 Paytm 已经拥有用户习惯和信贷入口，可在内部导流需求
        - 高
        - 规模和产品宽度已在官方页面上线
        - KreditBee 获客中，多少依赖已经长期停留在支付超级 App 内的用户？
      - - 银行转型与金融科技竞争无关
        - Slice 的银行姿态若加深贷款产品，可改善资金成本和信任
        - 中
        - Slice 现在明确以银行身份营销，提供储蓄和 UPI 信用卡
        - 受监管资金栈迁移能在多大程度上压缩无抵押零售信贷利差？
      - - RBI 规则只是同等抬高所有人的门槛
        - 规则可能提高信任，也会压缩浅层 App-only 差异化
        - 中
        - Digital Lending Directions 将披露、服务、冷静期和 DLG 框架标准化
        - 合规成为入场券之后，还剩哪些专有优势？
      - - KreditBee 能靠价格赢得优质借款人
        - 已披露的银行利率下限已经挑战该论点
        - 高
        - 银行宣传约 9.99%-10% 的下限，而专业金融科技起步更高
        - 目标借款人真的是优质客群，还是优势集中在薄信用档案人群？
    notes: 严重性衡量的是对 KreditBee 竞争位置的耐久风险，而不是威胁列中所列竞争者本身的质量。
