  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与模块图谱
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的公开表面足够宽，已经更像一套消费信贷 App
              组合，而不是单一无抵押贷款漏斗。官网、站点地图、应用商店页面和专门产品页清楚宣传标准个人贷款、受薪人士版本、灵活个人贷款、商业贷款、两轮车金融、房产抵押贷款、UPI
              支付、还款和付费信用报告工具。这个宽度重要，因为它显示 KreditBee 正试图在一个消费者 App 内加深参与度，而不是只依赖单一短期限无抵押产品。


              这份菜单的成熟度并不一致。个人贷款是最清楚的核心 SKU：票面规模、定价区间、期限、文件和放款流程都有公开说明。商业贷款也有文档，但仍读起来像核心无抵押流程的近亲，而不是深度独立的 SME
              平台。两轮车金融和房产抵押贷款是真实产品，但各自带有可见约束：两轮车产品受地区限制并偏向既有客户，LAP 则可能需要线下申请路径。公开表面没有显示单独记录的 BNPL 或循环信用额度
              SKU，因此除非公司提供内部产品包，投资人应把这些品类视为缺席。
