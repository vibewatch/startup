      - number: '6.4'
        title: 复借、扩张与未解决集中度
        blocks:
          - type: paragraph
            body: >-
              耐久性部分可见、部分缺失。最强的公开留存代理，是 CARE 2026 年 3 月说明约 80%
              放款流向复借客户，并同时称不允许并发贷款和追加贷款。这说明重复使用来自连续复借，而不是不受控的余额堆叠。扩张也可见。管理层和媒体来源描述了从个人贷款自然推进到车辆、黄金、住房或商业信贷需求的路径；到
              FY26，Moneycontrol 称有担保贷款 AUM 已达到约 ₹1,000 crore，MSME 贷款约 ₹500 crore。CARE 也印证，商业贷款加 LAP 到 2025 年 12 月已占 AUM
              的 10.3%，高于 FY25 早期小得多的份额。未解决问题是集中度。公开来源确认有 10 家以上贷款合作伙伴和 App 主导分发依赖，但没有量化发放中有多少来自自有
              App、经销商渠道、共同贷款伙伴或既有客户交叉销售。同样，公开记录不披露 NRR、GRR、流失率、续借曲线或头部雇主集中度，所以本章可以支持复借和相邻扩张，但不能支持干净的留存或渠道风险模型。
