      - number: '3.4'
        title: 转换成本低；失败证据说明监管和分发主导护城河主张
        blocks:
          - type: paragraph
            body: >-
              这个品类的不利证据比品牌叙事更强。Simpl 首页现在跳转到停放页面，Times of India 报道称 RBI 在 2025 年因其缺少必要授权而下令其停止支付业务。Business Standard
              报道称，ZestMoney 即便曾达到 1700 万注册用户和 8.5
              万触点，最终仍然关停。这些信号反证了一个观点：单靠规模或顺滑的结账层，无法在印度消费信贷中形成耐久护城河。更耐久的优势是更便宜的资金、更干净的合规、特权分发，以及面向薄档案用户的承保数据。这也是 Slice
              的银行姿态重要、HDFC、ICICI 和 Bajaj 仍是危险替代者、PhonePe 或 Paytm 即使当前价格表不那么透明也可能比小型单线贷款机构更有威胁的原因。对 KreditBee
