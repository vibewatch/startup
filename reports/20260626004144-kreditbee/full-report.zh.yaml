      - 付款方 / 资本来源
      - 主要承销信号
      - 采用触发点
      - 主要约束
    rows:
      - - 信用档案较薄的受薪新客
        - 个人借款人和终端用户
        - 银行或 NBFC 资本；金融科技或 LSP 界面
        - 薪资入账、轻征信画像、银行流水
        - 即时获得资金，文书更少
        - 无抵押风险惊吓后承销收紧
      - - 零工或收入波动型劳动者
        - 个人借款人和最终用户
        - NBFC 或联合放贷栈
        - 现金流模式、平台或支付数据、替代数据
        - 无正式工资单也能获得信贷
        - 收入波动，以及可解释性或公平性担忧
      - - 半城市或农村首贷借款人
        - 个人借款人和最终用户
        - 通常是银行或 NBFC 资产负债表，叠加数字化分发
        - 辅助开户、征信、银行账户活动
        - 大城市网点之外的首次正规信贷入口
        - 分发质量、催收和数字素养缺口
      - - 微型 MSME 或商户业主
        - 企业主同时是借款人、用户和实际付款方
        - NBFC、私营银行或联合放贷结构
        - GST、银行流水、交易流、房产或企业现金流
        - 营运资金需求和抵押品不足
        - 文件材料、非正式现金流和较低的正规渗透率
      - - 嵌入式信贷或 BNPL 购物者
        - 商业流程中的消费者借款人
        - 放贷方资产负债表；商户可能补贴经济账
        - 结账场景、过往还款行为、交易数据
        - 提升销售点转化和便利性
        - 短期限无抵押风险审查和低利润率经济账
    notes: 同一个用户看到的可能是金融科技界面，但定价、承保政策和资金由受监管放贷机构控制。
