  - id: TP001
    title: 竞争格局表
    columns:
      - 层级
      - 代表名称
      - 核心产品或替代方案
      - 买方考虑原因
      - 替代向量
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the named direct fintech lenders, BNPL apps, incumbent lenders, platform entrants, and status-quo
        substitutes most visible in current public sources; excludes local NBFCs without national product disclosure.
    rows:
      - - 直接数字放贷方
        - 数字放贷方：Freo / MoneyTap、Fibe、CASHe、Navi、Slice
        - 分期贷款、授信额度、App 型消费信贷
        - 借款人寻找即时无抵押资金时，最接近的数字化替代品
        - 价格底线压力、审批速度、承保重叠
      - - BNPL 和结账信贷
        - LazyPay、历史上的 Simpl、历史上的 ZestMoney
        - 先买后付结账，加小额循环或分期信贷
        - 商业、账单或短期现金缺口里的同一类紧急支出需求
        - 商户侧分发和结账习惯
      - - 既有私营银行
        - HDFC Bank、ICICI Bank
        - 通过网点、App 和预审批渠道发放大额个人贷款
        - 受信任的受监管放贷机构，公开利率底线更低
        - 更便宜的资金、既有工资账户关系
      - - 大型消费金融 NBFC
        - Bajaj Finance
        - 全国性全渠道个人贷款和消费金融栈
        - 无抵押现金需求和消费金融的知名替代选择
        - 激进分发叠加交叉销售经济账
      - - 支付超级 App 进入者
        - PhonePe、Paytm
        - 贷款叠加在 UPI、充值、商户和钱包入口上
        - 巨大流量池可把用户导入信贷，无需单独获客
        - 嵌入式分发和低边际 CAC
      - - 高端信用卡信贷覆盖层
        - CRED
        - 奖励驱动的信用卡关系，加相邻贷款入口
        - 争夺高信用城市用户，而非所有借款人
        - 品牌、富裕客群、信用卡习惯
      - - 现状方案和内部搭建
        - 既有银行卡额度、工资预支、雇主薪资预支、黄金贷款
        - 使用既有关系、担保借款或雇主现金桥
        - 对复借用户而言，往往比安装新贷款 App 更容易
        - 关系优势和更低获客摩擦
    notes: 各行有意混合直接、相邻和替代类别，因为用户要解决的是紧急消费信贷，不是某个产品分类。
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP004
  - id: TP002
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标客群
      - 差异化
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Profiles the direct lender set plus the most visible BNPL and platform substitutes using only evidence that was
        fetchable in this run; unknown cells remain explicit.
    rows:
      - - KreditBee
        - 直接放贷方 / LSP + NBFC 栈
        - 官网声称覆盖 23 crore 印度人；当前来源集未在此确认融资
        - 广泛零售借款人，包括快放款用户和档案较薄客群
        - 个人贷款区间宽、放款快、放贷方栈与 RBI 挂钩
        - 相比银行利率底线，并不明显更便宜
      - - Freo / MoneyTap
        - 直接放贷方 / 授信额度
        - 声称 10M+ 下载和发放 252K 笔贷款
        - 需要灵活支取信贷的城市工薪和自雇用户
        - 授信额度结构让借款人只为已用金额付息
        - 规模和分发小于超级 App；仍高于专业玩家最低门槛
      - - Fibe
        - 直接放贷方 / 分期贷款
        - 声称 39M+ 下载、₹40,000Cr+ 放款、8,500+ 合作伙伴
        - 银行服务不足的年轻职场人和中等收入用户
        - 直接金融科技来源集中披露规模最大
        - 公开利率底线高于既有银行底线
      - - CASHe
        - 直接放贷方 / 仅 App 信贷
        - 官方页面被阻断，可访问来源集中未知
        - 城市工薪借款人；可访问页面无法确认当前精确客群
        - 市场存在感明确；仍是该类别的活跃对比名称
        - 公开尽调可见度差；定价和规模必须保持未知
      - - Navi
        - 直接放贷方 / 更广 fintech 栈
        - 本次可访问文本提取无法确认精确规模
        - 大众零售借款人；此处实时客群细节不清
        - 有现金贷款入口，也有超出单一 App 流程的更广 fintech 野心
        - 抓取时，可访问的官方费率表未能干净渲染
      - - Slice
        - 银行形态消费信贷进入者
        - 银行定位，加存款产品和 UPI 信用卡入口
        - 习惯 App 优先银行服务的年轻数字原生用户
        - 银行栈可能改善资金成本和产品交叉销售
        - 当前公开页面更强调银行捆绑包，而非明确的个人贷款定价
      - - LazyPay
        - BNPL + 消费贷款 App
        - 留存页面未清晰披露规模；产品范围清楚
        - 购物者和短周期信贷用户
        - 一个入口内提供 15 天先买后付和 XpressLoan
        - APR 区间高于银行底线，与专业放贷方相当
      - - Simpl
        - 历史 BNPL 竞争对手
        - 运营受损；官网停放，且有 RBI 叫停报道
        - 商户结账 BNPL 用户
        - 曾快速解决同一类结账信贷需求
        - 监管冲击看起来严重
      - - ZestMoney
        - 历史 BNPL 竞争对手
        - 停业前峰值为 17M 用户和 85K 触点
        - 结账融资和 BNPL 用户
        - 证明 BNPL 能在全国扩张
        - 也证明规模不保证耐久性
      - - HDFC Bank
        - 既有银行
        - 全国网点、App 和预审批优惠分发
        - 优质工薪和既有关系借款人
        - 公开利率底线低，信任强
        - 相比专业 App，可能服务不足档案较薄用户
      - - ICICI Bank
        - 既有银行
        - 全国数字和网点网络
        - 优质工薪和自雇借款人
        - 9.99% 起、72 个月期限、公开费用披露
        - 与大型银行一样偏向优质借款人
      - - Bajaj Finance
        - 既有 NBFC / 消费金融巨头
        - 全国全渠道覆盖；此处未使用精确客户数
        - 零售借款人和消费金融用户
        - 无抵押金融栈宽，分发强
        - 区间上沿仍可能定价较高
