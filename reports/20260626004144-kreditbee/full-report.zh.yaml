      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              基于有限公开记录，KreditBee 看起来比许多印度无抵押贷款同业财务更强：公司已跨过 ₹10,000 crore AUM 门槛，在合并和独立口径下都实现正 PAT，并在 2026
              年以独角兽估值获得一大笔一级股权注入。收入质量也好于纯 lead-gen
              模式，因为集团似乎同时赚取资产负债表利息收入和费用收入。但本章仍应按「已盈利，但透明度不足」来承保。最大警示是评级机构标准下资产质量中等、依赖仍以低双位数定价的批发负债，以及数字无抵押贷款的监管敏感性。


              净结论：公开证据支持规模、盈利能力和近期资本充足，但不足以支撑完整承保模型。投资人应把 FY25-FY26
              盈利故事视为方向上可信，同时在给予利润率耐久性以公开市场质量的信心前，要求数据室给出跨法律实体、产品级经济性和损失账龄批次的桥接。
