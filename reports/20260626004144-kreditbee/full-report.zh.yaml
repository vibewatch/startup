      - number: '4.2'
        title: 已印证规模、借款人牵引与盈利能力
        blocks:
          - type: paragraph
            body: >-
              最强的已印证规模事实，是 KreditBee 明确跨过了 ₹10,000 crore AUM。CARE 将 AUM 列为 2025 年 3 月 31 日 ₹10,102 crore、2025 年 12 月 31
              日 ₹13,141 crore；Moneycontrol 也独立称 FY25 AUM 超过 ₹10,000 crore。ETBFSI 进一步延长公开时间线，称 FY2025-26 以 ₹15,000 crore
              AUM 和 ₹30,000 crore 放款额收官。借款人规模说法甚至高于任务简报中标出的 470 万：Entrackr 和 IBS Intelligence 都称 KreditBee 服务超过 1800
              万独立贷款客户、促成超过 6000 万笔贷款；Fortune India 称平台已承保约 8.5 crore 人，如今每月向约 55 lakh 活跃借款人收款。基于现有证据，470
              万更像是过时数据，而不是当前数字。


              盈利真实存在，但取决于口径。CARE 和 Moneycontrol 在合并 FY25 视角上对齐：收入 / 营收约 ₹2,712 crore，PAT 约 ₹473 crore；MediaNama 和
              Financial Express 则指向独立 FY25 市场平台公司数字，总收入约 ₹682 crore、PAT 约 ₹237 crore。这些不一定矛盾；它们反映不同法律实体和会计范围。公开记录没有给出
              EBITDA 本身。它提供的是 PAT、ROMA、PPOP，以及管理层关于公司已经盈利、可用内部留存资金支持部分技术投资的宽泛说法。
