  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 方向
      - 论据
      - 什么会改变判断
    rows:
      - - 论点
        - 公开资料已经能看到真实规模和盈利能力：FY25 PAT 约 ₹473 crore，AUM 超过 ₹10,000 crore。
        - 经审计的 FY26 主体口径调节表可以增强信心，并支撑溢价倍数。
      - - 论点
        - 2026 年 4 月融资在可能 IPO 前带来真实外部价格发现和新资本。
        - 若有证据显示本轮后需求疲弱，或投行反馈偏软，本轮融资的信号价值会下降。
      - - 论点
        - 产品扩展到 LAP 和 SME，加上复借客户承保，长期可改善组合质量。
        - 即便组合变化，信用成本仍停留在 FY25 附近，则会削弱组合改善论点。
      - - 反论点
        - 当前价格已隐含约 4.1x 账面价值和 4.7x 收入，接近更强上市放贷机构基准。
        - 更低入场价格或快于预期的账面增长会改善风险回报。
      - - 反论点
        - 批发融资和 10.65% 上市债务说明，其融资成本仍明显高于顶级银行体系。
        - 若明确转向更便宜且更多元的资金来源，才足以支撑更高倍数。
      - - 反论点
        - 2023 年 RBI 催收处罚和不完整的公开治理细节，应该带来持久估值折扣。
        - 若证明控制架构更强，且行为问题没有复发，治理折扣会收窄。
      - - 反论点
        - 行业可比公司显示，私营金融科技估值仍可能下调，CRED 在 2025 年就是例子。
        - 干净的 IPO 申报和强劲公开市场需求，会降低负面同业映射的相关性。
    notes: 反论点来自负面证据或估值纪律证据，不是泛泛的怀疑。
