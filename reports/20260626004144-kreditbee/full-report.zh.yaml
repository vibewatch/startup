      - number: '3.2'
        title: 直接同业画像显示价差很窄，披露质量不均
        blocks:
          - type: paragraph
            body: >-
              在直接 fintech 贷款机构中，公开产品条款比品牌叙事显示得更集中。KreditBee 披露 ₹6,000 至 ₹10 lakh 贷款，利率 12% 至 28%，处理费最高 4.8%；Freo 推一款最高
              ₹5 lakh 的信用额度式贷款，起始年化利率 13%；Fibe 推最高 ₹10 lakh，披露起始利率 18%、处理费 2%；LazyPay 则把 BNPL 与现金贷款结合，其说明文字把利率置于 15% 至
              32% 区间。因此，差异化不太在于显著更便宜的标题价格，而更多在获批额度结构、客群焦点、承保深度和相邻产品宽度。Fibe 的官方规模披露在本来源包的直接 fintech 集合中最大，Freo 超过 1000
              万下载量仍显示有意义的装机基础。CASHe 是明显例外：它显然是相关竞争者，但由于抓取期间公开页面无法访问，这里更严谨的做法是把规模和费用单元格标为未知，而不是制造可比性。
