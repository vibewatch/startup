      - number: '8.7'
        title: 图表资料
        blocks:
          - type: callout
            title: 这里价格比叙事更重要
            body: KreditBee 已不再像一个未定价的私人期权。按 2026 年 4 月估值，公开证据已经支持溢价估值，因此现在的上行取决于更好的披露或更低的入场点。
            calloutType: insight
            claimRefs:
              - CV001
              - CV016
              - CV037
          - type: callout
            title: 最被低估的风险不是增长，而是重估
            body: 即使 KreditBee 继续增长，如果公开或下一轮投资者把公司定价到接近 2.5-3.0 倍账面价值，后进入者仍可能得到很差回报。这是建议维持跟踪 / 继续研究的主要原因。
            calloutType: risk
            claimRefs:
              - CV016
              - CV039
              - CV044
          - type: callout
            title: 账面价值是主要估值锚
            body: 由于 KreditBee 通过其 NBFC 持有受监管贷款敞口，市净率和盈利耐久性比风险投资式 DCF 或纯软件收入倍数更有用。
            calloutType: assumption
            claimRefs:
              - CV006
              - CV020
          - type: callout
            title: 三项尽调事件会改变判断
            body: 入场价格降至接近约 3.0-3.3 倍账面价值、出现 IPO 级别经审计 FY26 桥接，或清晰的 cohort 损失证据显示盈利具有耐久性，都会显著改善风险回报。
            calloutType: recommendation
            claimRefs:
              - CV006
