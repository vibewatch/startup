      - number: '6.5'
        title: 客户结论
        blocks:
          - type: paragraph
            body: >-
              KreditBee 的客户章节在采用证据上方向强，在耐久性透明度上较弱。公开记录支持一个非常大的借款人客群资产，已经远超 470 万活跃借款人基准；它也支持清晰的非大都市和 mid-India
              足迹，以及把重复无抵押用户逐步转化为有担保和 SME 客户的可见策略。它还支持真实具名证明和强 App Store 评分。警示在于，最干净的留存和集中度指标仍缺失，客户保护方面的不利记录也重要而非理论，因为
              RBI 和后续独立评论都指向催收摩擦。净结论：客户需求看起来真实且复借占比高，但在认定规模已转化为高质量、低摩擦的客户耐久性之前，投资人仍需要内部客群分期、投诉解决和渠道份额数据。
