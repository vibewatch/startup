  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分，覆盖市场、证明、经济性、治理、估值支撑和证据质量。
    data:
      items:
        - id: market
          label: 市场机会
          value: 4/5
          detail: 印度数字放贷市场仍然很大，KreditBee 已经具备有意义的规模。
          tone: positive
          claimRefs:
            - CV003
            - CV029
        - id: proof
          label: 运营证明
          value: 4/5
          detail: AUM、收入和 PAT 有公开材料相互印证，而不是纯粹由公司宣称。
          tone: positive
          claimRefs:
            - CV005
            - CV007
        - id: economics
          label: 经济性质量
          value: 3/5
          detail: 正利润被结构性高信用成本和显著融资费用抵消。
          tone: neutral
          claimRefs:
            - CV008
            - CV010
            - CV030
        - id: governance
          label: 治理 / 行为
          value: 2/5
          detail: 历史 RBI 催收处罚意味着，在控制措施被证明之前，折价会持续存在。
          tone: negative
          claimRefs:
            - CV011
            - CV032
        - id: valuation
          label: 估值支撑
          value: 3/5
          detail: 该标记估值说得通，但相比强势上市放贷方锚点折让不够，难以形成明显上行。
          tone: neutral
          claimRefs:
            - CV016
            - CV021
            - CV042
        - id: evidence
          label: 证据质量
          value: 3/5
          detail: 证据足以避免直接放弃，但以当前价格高置信买入仍然太薄。
          tone: neutral
          claimRefs:
            - CV033
            - CV038
    approximationNotes: 评分是 IC 定性辅助，不是机械估值模型。
    claimRefs:
      - CV005
      - CV008
      - CV011
      - CV016
      - CV032
      - CV038
      - CV042
