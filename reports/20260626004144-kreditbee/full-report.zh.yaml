  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局——直接贷款机构、替代品、既有巨头与新进入者
        blocks:
          - type: paragraph
            body: >-
              KreditBee 并不处在单一同业市场。最接近的直接竞争来自其他 App 优先的消费信贷专业公司，例如 Freo 或老牌 MoneyTap、Fibe、CASHe、Navi 和
              Slice；它们都在攻击快速无抵押借款这一同一需求，但产品架构不同。Freo 强调信用额度结构，Fibe 推更大的个人贷款和合作伙伴分发面，Slice 如今围绕银行资产负债表和 UPI 信用卡重新定位，CASHe
              仍在集合中，但公开来源可见度异常弱，因为抓取时其核心产品页被阻断。KreditBee 还与 LazyPay 等 BNPL 和结账信贷选项竞争，也要面对 Simpl 和 ZestMoney
              关停留下的经验教训。Fintech 专业公司之外，真正的替代集合包括既有银行个人贷款、Bajaj Finance 的广泛消费金融栈，以及 PhonePe、Paytm、CRED
              等平台型进入者；它们可以在更大的支付或奖励入口内把用户导向信贷。实际含义是，KreditBee 防守的是一个待完成任务——快速获得零售信贷——而不是一条封闭品类边界。
