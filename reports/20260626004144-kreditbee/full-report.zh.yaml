  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构和清算顺位
        - Series E 股份类别、优先清算瀑布、反稀释和 IPO 转换条款
        - 决定名义估值能否转化为可接受的真实股权回报。
        - 任何投资条款书决策前，向 CFO / 法务数据室索取。
      - - FY26 经审计合并财务
        - 金融科技、NBFC 和任何合并上市结构之间的完整主体桥接
        - 需要确认公开盈利和账面价值锚点是否口径一致。
        - 经审计财务资料包或 IPO 申报草稿。
      - - 信贷批次和分群损失
        - 产品级放款批次曲线、复借表现和拨备桥接
        - 判断溢价倍数能否穿越完整信用周期的最佳证据。
        - 与风险团队开展信贷尽调工作流。
      - - 融资多元化
        - 当前出借方组合、定价阶梯、证券化经济性和再融资路径
        - 说明低双位数债务成本是暂时问题还是结构问题。
        - 资金 / 融资尽调。
      - - 治理控制
        - 催收监督、投诉趋势、董事会委员会和处罚后整改证据
        - 对数字放贷机构而言，行为质量是估值问题，不是旁支议题。
        - 合规 / 董事会尽调。
      - - IPO 市场反馈
        - 投行指示性区间、基石投资者胃口和可能的上市同业折扣
        - 检验 $1.5B 是合理、偏贵还是保守的最佳现实测试。
        - 一旦启动申报流程，开展资本市场尽调。
    notes: 聚焦最小一组缺失事项；这些事项最可能改变估值判断。
