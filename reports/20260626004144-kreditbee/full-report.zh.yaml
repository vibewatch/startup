        - 按实体提供 EBITDA、PBT、拨备覆盖和 RoE
      - - 信用成本 / GNPA / NNPA
        - FY25-2025 年 3 月为 7.7% / 2.8% / 0.7%
        - 中
        - 无抵押贷款盈利能力的核心风险
        - 分享按产品拆分的 vintage、核销和滚动率表
      - - 复借借款人占比
        - 80% 的放款流向复借客户
        - 中
        - 低 CAC 和更强交叉销售经济性的代理指标
        - 披露复借客户与首借客户盈利能力对比
