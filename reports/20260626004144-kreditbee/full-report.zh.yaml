figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 按日期排列的记录显示，KreditBee 从法律设立和 NBFC 牌照起步，走向经危机检验的规模、监管审视、IPO 准备中的结构简化，以及 2026 年独角兽估值融资。
    data:
      items:
        - date: '2016-03-15'
          label: Finnovation 注册成立
          detail: 公开公司记录和官网页脚元数据里，能看到集团最早的法律实体锚点。
          tone: positive
        - date: '2017-05-01'
          label: KrazyBee NBFC 牌照
          detail: CARE 称 KrazyBee 在 2017 年 5 月获得 RBI NBFC 牌照，为该品牌搭起受监管的放贷主干。
          tone: positive
        - date: '2018-01-01'
          label: 运营品牌创立简称
          detail: 多家媒体和资料来源把 KreditBee 本身描述为 2018 年创立或上线，尽管法律实体日期更早。
          tone: neutral
        - date: '2020-03-01'
          label: COVID 信贷周期冲击
          detail: 创始人访谈称，一轮融资在推进中暂停，团队在封锁期间转向催收和还款重组。
          tone: negative
        - date: '2022-12-02'
          label: Series D 公布
          detail: KreditBee 融资 $80M，引入 MUFG，并在融资市场疲弱时主推有抵押贷款扩张。
          tone: positive
        - date: '2023-02-01'
          label: RBI 因催收处罚
          detail: RBI 发现重复投诉，以及未能防止回收代理骚扰或恐吓后，开出 ₹42.48 lakh 罚款。
          tone: negative
        - date: '2024-03-27'
          label: 过桥 / 延展融资浮出
          detail: Tracxn 记录了一笔 $9.4M 的 Series D 延展融资，显示 2022 年轮次到 2026 年独角兽融资之间的过桥并不顺滑。
          tone: neutral
        - date: '2025-07-05'
          label: IPO 准备的合并路径获批
          detail: 报道称 RBI 已批准技术实体与 NBFC 实体合并，上市结构因此收紧。
          tone: positive
        - date: '2026-04-08'
          label: Series E 打出独角兽估值
          detail: 这轮 IPO 前融资把 KreditBee 估值推至 $1.5B，并为贷款账簿增长、AI、以及向有抵押和 MSME 贷款扩张补充新资本。
          tone: positive
