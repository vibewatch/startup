      - number: '4.3'
        title: 信贷质量、资金成本与资本充足
        blocks:
          - type: paragraph
            body: >-
              不利解读很直接：尽管近期公开指标稳健，KreditBee 在结构上仍暴露于无抵押信贷波动。CARE 仅将资产质量标为中等，因为核心账簿仍由无抵押个人贷款主导。信贷成本从上一年的平均资产 6.1% 升至 FY25
              的 7.7%；2025 年 3 月 GNPA 为 2.8%、NNPA 为 0.7%，到 2025 年 12 月改善至 1.8% 和 0.4%。CARE 还称，80%
              放款流向复借客户，承保已向更大票面、更高质量借款人收紧。这支持了 KreditBee 正在给组合去风险的论点，但没有消除监管和周期性阴影。


              盈利为正，并不意味着资金「免费」。CARE 称 2025 年 12 月借款组合仍以批发负债为主——48.1% NCD、22.5% 银行、15.8% NBFC、8.0% 转付证券、5.4% 商业票据。2025 年
              4 月的关键信息备忘录显示，一笔 ₹200 crore 有担保上市 NCD 票息为 10.65%，意味着至少部分债务栈的资金成本下限在低双位数。公开资本充足率目前舒适：CARE 显示 2025 年 3 月有形净值
              ₹3,107 crore，CAR 为 29.59%；2026 年 4 月 Series E 又在计划 IPO 前增加了 $220M 新增一级股权。不过，这仍是一门依赖资本市场持续开放和监管容忍无抵押增长的业务。
