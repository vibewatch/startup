  - id: TM004
    title: 增长驱动因素和采用约束
    columns:
      - 因素
      - 类型
      - 方向
      - 时点
      - 证据
      - 对市场的影响
    rows:
      - - UPI 和基于账户的数字化采用
        - 驱动因素
        - 正向
        - 即时
        - 账户拥有率高、UPI 大规模使用，降低开户摩擦
        - 支撑数字贷款获客，但不保证信贷转化
      - - DPI、AA、OCEN 和 ULI
        - 驱动因素
        - 正向
        - 近期至中期
        - 基于同意的数据共享和更快承保，提升薄档借款人和 MSME 的可服务性
        - 不改变宏观信用风险，但抬高可触达 SAM
      - - 半城市和农村首贷借款人增长
        - 驱动因素
        - 正向
        - 即时
        - 零售借款人结构正向核心大城市之外迁移
        - 愿意搭建催收和支持能力的 App 型放贷方，用户基数扩大
      - - RBI 行为规则（APR、KFS、冷静期、申诉）
        - 约束
        - 对利润率为负向 / 对信任为正向
        - 即时
        - 合规义务增加服务和披露成本
        - 治理更好的放贷方受益，松散运营的 App 网络承压
      - - 无抵押风险权重收紧
        - 约束
        - 负向
        - 即时
        - 资本强度更高，无抵押个人信贷成本上升
        - 可能压缩放贷方意愿，并推高终端借款人利率
      - - 银行 / NBFC 控制低成本资金
        - 混合
        - 集中化
        - 持续
        - 金融科技 UI 优势不能摆脱对受监管资产负债表的依赖
        - 鼓励联合放贷和分发合作，而不是纯资产负债表轻模式扩张
    notes: 每个因素都绑定时点，因为印度的市场机会既由需求塑造，也同样受资金和监管塑造。
    claimRefs:
      - CM014
      - CM015
      - CM016
      - CM019
      - CM025
      - CM026
      - CM027
      - CM033
      - CM037
