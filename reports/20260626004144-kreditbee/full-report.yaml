        - Determines whether the headline valuation translates into acceptable real equity returns.
        - CFO / legal data room request before any term-sheet decision.
      - - FY26 audited combined financials
        - Full entity bridge across fintech, NBFC, and any merged listing structure
        - Needed to confirm whether public profitability and book-value anchors are apples-to-apples.
        - Audited financial pack or draft IPO filing.
      - - Credit-vintage and cohort losses
        - Product-level vintage curves, repeat-borrow performance, and provisioning bridge
        - Best evidence for whether the premium multiple can survive a full credit cycle.
        - Credit diligence workstream with risk team.
      - - Funding diversification
        - Current lender mix, pricing ladder, securitization economics, and refinance path
        - Clarifies whether low-double-digit debt cost is temporary or structural.
        - Treasury / financing diligence.
      - - Governance controls
        - Collections oversight, complaint trends, board committees, and post-penalty remediation evidence
        - Conduct quality is a valuation issue for digital lenders, not a side topic.
        - Compliance / board diligence.
      - - IPO market feedback
        - Indicative banker range, cornerstone appetite, and likely listed-peer discount
        - Best real-world test of whether $1.5B is fair, rich, or conservative.
