  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Boundary Before Sizing
        blocks:
          - type: paragraph
            body: >-
              India’s digital-lending opportunity only looks coherent after the boundary is tightened. For this chapter,
              the relevant market is credit that is originated and largely serviced through digital channels by a
              regulated lender or its lending service provider: unsecured personal loans, BNPL or embedded consumer
              credit, and digitally underwritten MSME working-capital or merchant finance. That scope intentionally
              excludes pure payments, wealth or insurance fintech, and most secured products such as mortgages, vehicle
              loans, and gold-backed lending. The exclusion matters because many bullish estimates mix loan-book
              exposure, fintech revenue, and payment-platform activity under one headline. RBI’s rule set reinforces the
              same boundary: the regime is about digital-credit conduct, fund flow, disclosures, DLA governance, and
              outsourced origination, not about the whole fintech stack. The practical market definition is therefore a
              regulated-credit market that rides on digital rails rather than a generic “India fintech” market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
              - CM034
