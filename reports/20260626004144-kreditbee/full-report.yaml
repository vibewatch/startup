      - number: '8.3'
        title: Current Financing Context, Entry Discipline, and Overhang
        blocks:
          - type: paragraph
            body: >-
              The financing context is supportive but not fully de-risked. The Series E appears to have been structured
              as a late private round ahead of an IPO attempt rather than as a rescue financing: ETBFSI, MediaNama,
              Financial Express, and Fortune India all frame the raise as the company's entry into the unicorn club with
              IPO preparation in view. Because only $220 million of the $280 million was fresh primary capital,
              pre-round holders were diluted by about 14.7% rather than by the full headline round size; the $60 million
              secondary component transferred stock between holders without adding new operating cash. That structure
              can be read positively — insiders and buyers were willing to create some liquidity while still putting
              meaningful fresh capital in — but it also means the round is not a pure capital-formation event that
              cleanly signals incremental operating need or capital scarcity.


              Preference and dilution overhang remain material diligence gaps. Public stories disclose almost nothing
              about liquidation preferences, ratchets, participating preferred rights, or any IPO-related conversion
              mechanics. For a late-stage lender, those terms matter nearly as much as the headline valuation because a
              flat or mildly down IPO can still leave junior holders with weak economics if the private stack is senior
              and cumulative. The public record is also internally inconsistent on historical funding totals and the
              prior valuation bridge. MediaNama's January 2026 reporting referenced about $400 million raised and a $700
              million prior valuation, while Financial Express cited Tracxn data pointing to roughly $256 million
              previously raised and a March 2024 extension at about $184 million valuation. Those discrepancies may
              reflect primary versus secondary treatment or database lag, but until management reconciles them in an IPO
              filing or diligence pack, investors should treat the $1.5 billion mark as real but not fully
              contextualised.
            claimRefs:
              - CV001
              - CV002
              - CV009
              - CV012
              - CV013
