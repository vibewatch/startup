      - number: '1.2'
        title: Founders, leadership, governance, and conduct history
        blocks:
          - type: paragraph
            body: >-
              Leadership evidence is unusually founder-centric. Multiple 2026 fundraise stories name Madhusudan
              Ekambaram, Karthikeyan Krishnaswamy, and Vivek Veda as the founder trio, with public role labels
              converging on CEO, CTO, and CFO respectively. Madhusudan is also the dominant external spokesperson across
              fundraising, underwriting, risk, and IPO-preparation interviews, which increases key-person concentration
              even if it helps narrative consistency. Public source quality on wider governance is materially weaker:
              reviewed sources do not provide a reliable current board roster, independent-director list, or committee
              map, so later diligence should treat governance depth as an open workstream rather than an established
              strength.


              What is visible is that governance and regulatory readiness are becoming more important as the company
              approaches public-market aspirations. MediaNama and Asia Business Outlook describe the group as having
              shifted domicile back to India and seeking to merge its technology and NBFC entities into a simpler
              listing vehicle, while 2026 media repeatedly frame the April round as the last major private raise before
              an IPO attempt. That preparatory story is offset by a real historical conduct issue: the Reserve Bank of
              India imposed a ₹42.48 lakh penalty on KrazyBee Services in 2023 after finding persistent complaints and
              failures to prevent harassment or intimidation by recovery agents. This event is material because
              KreditBee’s brand promise depends on trust, speed, and compliance; it means later chapters should not
              treat historical scale growth as proof that collections, customer experience, or regulatory controls are
              fully de-risked.
