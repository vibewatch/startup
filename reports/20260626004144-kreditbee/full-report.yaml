  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The positive valuation case for KreditBee is real and should not be dismissed as pure narrative. The
              company now has a recent price-setting round from external investors, not just a stale 2021-2024 venture
              mark. Public reporting aligns that the April 2026 Series E brought in $280 million at a $1.5 billion
              post-money valuation, with $220 million of fresh primary capital and $60 million of secondary liquidity.
              CARE and Moneycontrol also support that the business is no longer an early-stage cash-burn lender: FY25
              combined revenue or income reached about ₹2,712 crore, PAT reached about ₹473 crore, FY25 AUM crossed
              ₹10,102 crore, and December 2025 AUM reached ₹13,141 crore before management-guided FY26 AUM approached
              ₹15,000 crore. That matters because late-stage private lenders are usually repriced harshly when scale is
              unproven or profits are absent; KreditBee has cleared both hurdles on the public record.


              The anti-thesis is that the current mark already capitalises much of that progress while leaving investors
              with thinner disclosure than the listed lender set. The same public record shows structurally high credit
              cost at 7.7% of average assets in FY25, continued wholesale-funding dependence, at least one 10.65%
              listed-NCD coupon in 2025, and a 2023 RBI penalty tied to harassment or intimidation by recovery agents.
              Public valuation context is also noisy rather than clean: MediaNama's January 2026 story still referenced
              roughly $400 million of capital raised and a $700 million prior mark, while Financial Express cited Tracxn
              data that pointed to a much lower March 2024 valuation context. That does not prove the April 2026 round
              was wrong, but it does mean the bridge from the last private mark to the new unicorn mark is less
              transparent than the headline suggests. The right conclusion is not “bad company”; it is “good company,
              but already priced for a lot of execution.”
