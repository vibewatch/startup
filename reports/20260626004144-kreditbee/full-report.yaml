      - number: '4.5'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              KreditBee looks financially stronger than many Indian unsecured-lending peers on the limited public
              record: it has passed the ₹10,000 crore AUM threshold, produced positive PAT at both combined and
              standalone scopes, and entered 2026 with a large primary equity infusion at a unicorn valuation. Revenue
              quality is also better than a pure lead-gen model because the group appears to earn both balance-sheet
              interest income and fee income. But the chapter should still be underwritten as “profitable, yet not fully
              transparent.” The biggest caution flags are moderate credit quality by rating-agency standards, reliance
              on wholesale liabilities that still price in the low double digits, and regulatory sensitivity in digital
              unsecured lending.


              Net: the public evidence supports scale, profitability, and near-term capital adequacy, but not a full
              underwriting model. Investors should treat the FY25-FY26 profitability story as directionally credible
              while demanding a data-room bridge across legal entities, product-level economics, and loss vintages
              before assigning public-market-quality confidence to margin durability.
