  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and privacy risk
        blocks:
          - type: paragraph
            body: >-
              KreditBee’s largest residual risk is not that digital-lending rules are absent; it is that the compliance
              perimeter is widening faster than public proof of execution quality. RBI’s Digital Lending Directions put
              explicit obligations on NBFCs and their lending service providers around consent, data minimisation,
              grievance handling, recovery-agent disclosure, and India-based data storage. KreditBee’s own public
              materials show a broad facilitator model with many RBI-registered NBFC partners, app-based onboarding, and
              multiple products. That model can scale, but it also multiplies the number of points where consent design,
              privacy posture, and outsourced conduct can fail. The adverse evidence matters: Delhi High Court scrutiny
              in 2026 is testing whether RBI enforcement has actually curbed contact-list and call-log misuse across
              NBFC-backed apps, while complaint boards repeatedly surface allegations of harassment and privacy
              intrusion. KreditBee does disclose grievance channels and partners do identify collections and KYC support
              roles, which is a mitigation. But the public record still leaves unresolved whether controls are strong
              enough in practice to defend against an enforcement-driven app redesign, partner remediation, or
              reputational shock.
