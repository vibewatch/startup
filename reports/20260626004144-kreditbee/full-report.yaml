      - number: '6.2'
        title: Adoption trajectory, active borrowers, and ticket size
        blocks:
          - type: paragraph
            body: >-
              The scale evidence is materially above the 4.7 million borrower headline in the brief. Across 2026
              coverage, KreditBee is repeatedly described as having more than 18 million unique loan customers, more
              than 60 million loans facilitated, and around 230 million app downloads. Fortune adds the most specific
              live-activity figure by saying the company collects repayments from roughly 55 lakh active borrowers every
              month, while also quoting management on about 70,000 new downloads per day and roughly 30,000 daily loans
