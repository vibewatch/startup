  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape — direct lenders, substitutes, incumbents, and entrants
        blocks:
          - type: paragraph
            body: >-
              KreditBee does not operate in a single-peer market. The closest direct competition comes from other
              app-first consumer-credit specialists such as Freo or legacy MoneyTap, Fibe, CASHe, Navi, and Slice, each
              of which attacks the same need for rapid unsecured borrowing but with a different product architecture.
              Freo emphasizes a credit-line construct, Fibe pushes a larger personal-loan and partner distribution
              surface, Slice is now repositioning around a bank balance sheet and UPI credit card, and CASHe remains in
              the set but with unusually weak public-source visibility because its core product pages were blocked at
              fetch time. KreditBee also competes against BNPL and checkout-credit options such as LazyPay, plus the
              lesson set created by Simpl and the wind-down of ZestMoney. Beyond fintech specialists, the real
              substitute set includes incumbent bank personal loans, Bajaj Finance’s broad consumer-finance stack, and
              platform entrants like PhonePe, Paytm, and CRED that can route users into credit from inside much larger
              payment or rewards surfaces. The practical implication is that KreditBee is defending a job to be done —
              fast access to retail credit — rather than defending one closed category boundary.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP017
