      - number: '8.2'
        title: Recommendation, Confidence, Risk Rating, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              The recommended stance is TRACK / RESEARCH-MORE, not buy and not pass. Price sensitivity is the key
              distinction. At or above the April 2026 $1.5 billion mark, the public evidence supports a
              fair-to-stretched conclusion rather than obvious upside asymmetry. A lender with its own NBFC balance
              sheet should be underwritten primarily on book value, earnings durability, funding mix, and credit losses,
              then cross-checked on revenue and AUM; a venture-style DCF is the wrong instrument because public
              disclosures do not provide the stable, segment-level forward assumptions needed for one. On that more
              appropriate lens, the Series E implies about ₹12,750 crore of equity value, or roughly 4.1x FY25 tangible
              net worth, 4.7x FY25 revenue, and 27x FY25 PAT using an ₹85/$ assumption. Those are not irrational ratios,
              but they are already demanding for a lender with material unsecured exposure, moderate asset quality by
              rating-agency standards, and incomplete public disclosure.


              Confidence is medium, not high, because the valuation method is directionally right but several
              entry-critical details remain private: liquidation preference stack, anti-dilution protection, exact FY26
              audited entity bridge, product-level vintage curves, and any IPO-bank feedback on acceptable public-market
              pricing. Risk rating is high. The company is clearly stronger than failed consumer-credit peers, but the
              downside is still meaningful if RBI policy tightens, funding spreads remain high, or IPO investors insist
              on public-comparable discipline rather than private-round scarcity. The stance would upgrade toward
              investable only under one of two conditions: either price clears materially lower, closer to roughly
              3.0-3.3x FY25 book value, or evidence quality rises through audited FY26 disclosures, cap-table
              transparency, and cohort-loss data that justify holding the 4x-plus book multiple.
