  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of market, proof, economics, governance, valuation support, and evidence quality.
    data:
      items:
        - id: market
          label: Market opportunity
          value: 4/5
          detail: Indian digital lending remains large and KreditBee already operates at meaningful scale.
          tone: positive
          claimRefs:
            - CV003
            - CV029
        - id: proof
          label: Operating proof
          value: 4/5
          detail: AUM, revenue, and PAT are publicly corroborated rather than purely claimed.
          tone: positive
          claimRefs:
            - CV005
            - CV007
        - id: economics
          label: Economics quality
          value: 3/5
          detail: Positive profits are offset by structurally high credit cost and meaningful funding expense.
          tone: neutral
          claimRefs:
            - CV008
            - CV010
            - CV030
        - id: governance
          label: Governance / conduct
          value: 2/5
          detail: The historical RBI collections penalty warrants a lasting discount until controls are proven.
          tone: negative
          claimRefs:
            - CV011
            - CV032
        - id: valuation
          label: Valuation support
          value: 3/5
          detail: The mark is defensible, but not enough below strong listed-lender anchors to create obvious upside.
          tone: neutral
          claimRefs:
            - CV016
            - CV021
            - CV042
        - id: evidence
          label: Evidence quality
          value: 3/5
          detail: Good enough to avoid a pass, but still too thin for a high-conviction buy at the current price.
          tone: neutral
          claimRefs:
            - CV033
            - CV038
    approximationNotes: Scores are qualitative IC aids, not a mechanical valuation model.
    claimRefs:
      - CV005
      - CV008
      - CV011
      - CV016
      - CV032
      - CV038
      - CV042
