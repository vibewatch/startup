            title: Boundary discipline matters more than headline TAM
            body: >-
              The public opportunity set spans everything from consumer-credit stock to broad digital-financing
              narratives. For underwriting, the useful market is the regulated slice that can be digitally originated,
              compliantly serviced, and durably funded.
