      - number: '6.3'
        title: Named proof, app ratings, and adverse customer evidence
        blocks:
          - type: paragraph
            body: >-
              Customer proof exists, but investors should separate self-published endorsements from independent
              satisfaction signals. KreditBee’s website publishes named testimonials from Ram, Tina Bhattacharya, Hiren
              Joshi, Abhishek Barua, Hardev Kumar, Navi, Ankur Sharma, and Amal Kunjumon. Those quotes consistently
              emphasize speed, paperless approval, repeat use, and access to higher limits after timely repayment, so
              they are useful as evidence that real retail borrowers interact with the product. They are not enough to
              prove retention quality on their own because they are marketing-controlled and do not disclose dates, loan
              sizes, or verified outcomes. Independent signals are mixed. Apple’s App Store still shows a strong 4.4 out
              of 5 from 51,000 ratings, but TrustGate is only 2.0 out of 5 from one verified review and
              ConsumerComplaints.in carries multiple allegations about rude support, repeated calls, privacy breaches,
              and double debits. The adverse evidence is not just anecdotal noise: RBI fined KrazyBee in 2023 after
              finding persistent or repeat complaints that recovery agents used harassment or intimidation, and the more
              recent complaint-board allegations rhyme closely with that older regulatory issue. So customer proof
              supports usage, while review evidence still raises a real collections-and-service quality flag.
