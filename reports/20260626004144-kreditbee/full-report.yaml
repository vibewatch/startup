      - number: '3.2'
        title: Direct-peer profiles show narrow price spreads and uneven disclosure quality
        blocks:
          - type: paragraph
            body: >-
              Among direct fintech lenders, public product terms cluster more tightly than branding suggests. KreditBee
              publishes ₹6,000 to ₹10 lakh loans at 12 to 28 percent with up to 4.8 percent processing fees; Freo
              markets a ₹5 lakh credit-line-style loan starting at 13 percent annualized; Fibe pushes up to ₹10 lakh
              with a disclosed 18 percent starting rate and 2 percent processing fee; and LazyPay combines BNPL with a
              cash-loan offering whose explanatory text places rates in a 15 to 32 percent range. The differentiation is
              therefore less about a radically cheaper headline price and more about approved limit structure, segment
              focus, underwriting depth, and the breadth of adjacent products. Fibe’s official scale disclosures are the
              largest among the direct fintech set in this source pack, while Freo’s 10 million-plus downloads still
              signal a meaningful installed base. CASHe remains the notable exception: it is clearly a relevant
              competitor, but because its public pages were inaccessible during retrieval, the discipline here is to
              mark scale and fee cells unknown instead of manufacturing comparability.
