  - id: FR001
    title: KreditBee risk heatmap
    type: matrix
    layout: standard
    summary: Residual KreditBee risks positioned by impact and likelihood after visible public mitigations.
    data:
      columns:
        - Critical impact
        - High impact
        - Moderate impact
      rows:
        - label: High likelihood
          values:
            - tone: negative
              label: RBI privacy / LSP compliance burden
            - tone: negative
              label: Collections-conduct complaints
            - tone: negative
              label: Funding and spread compression
        - label: Medium likelihood
          values:
            - tone: negative
              label: Underwriting drift / loss emergence
            - tone: negative
              label: Partner or vendor control failure
            - tone: neutral
              label: UPI / servicing reliability miss
        - label: Low likelihood
          values:
            - tone: negative
              label: Named enforcement against KreditBee
            - tone: neutral
              label: IPO-readiness slip
            - tone: neutral
              label: Board-control or disclosure mismatch
    approximationNotes: >-
      Likelihood and impact are analyst judgments based on retained 2025-2026 public evidence. Cells reflect residual
      exposure after visible mitigations, not inherent risk only.
    claimRefs:
      - CR019
      - CR022
      - CR023
      - CR032
      - CR040
      - CR041
      - CR056
      - CR059
  - id: FR002
    title: KreditBee risk transmission map
    type: dag
    layout: standard
    summary: How compliance, underwriting, funding, and collections risks flow into growth quality, margin, and valuation.
    data:
      nodes:
        - id: reg
          label: Regulatory / legal pressure
          description: RBI privacy, DLA, recovery and court scrutiny
        - id: ops
          label: Collections / servicing friction
          description: Complaint spikes, agent conduct, app reliability
        - id: model
          label: Underwriting / data-model drift
          description: Fast digital origination, vendor and rule-engine dependence
        - id: fund
          label: Funding / liability pressure
          description: NCD mix, debt access, lower lending rates
        - id: partner
          label: Partner dependency
          description: Co-lending, LSPs, KYC, support, recovery agencies
        - id: trust
          label: Borrower and regulator trust
          description: Brand and complaint trajectory
        - id: margin
          label: Margin / earnings quality
          description: Spread, opex, compliance cost, credit cost
        - id: growth
          label: Growth quality
          description: Origination throughput and repeat-customer durability
        - id: valuation
          label: IPO and valuation outcome
          description: Public-market readiness and downside tolerance
      edges:
        - from: reg
          to: partner
          label: stricter LSP controls
        - from: reg
          to: trust
          label: enforcement optics
        - from: ops
          to: trust
          label: complaints and support pain
        - from: model
          to: margin
          label: losses / fraud cost
        - from: fund
