      - number: '5.3'
        title: Trust, compliance, reliability, and support controls
        blocks:
          - type: paragraph
            body: >-
              KreditBee’s trust stack is easier to see at the disclosure layer than at the operational-controls layer.
              The homepage/footer exposes privacy, grievance-redressal, fair-practices, and security-centre URLs, while
              Apple’s privacy label shows a meaningful amount of linked data: financial, location, contact, contacts,
              user content, usage, and diagnostics, with identifiers potentially used for tracking. Google’s own help
              documentation is a useful check on what that does and does not mean: the Data safety surface is
              developer-supplied and the UPI badge is narrow, so these store disclosures are necessary but not
              sufficient evidence of strong security engineering.


              The most important adverse fact is regulatory, not technical. RBI’s 2025 Digital Lending Directions map
              directly onto KreditBee’s workflow by requiring creditworthiness assessment, disclosures and KFS,
              grievance redressal, privacy policies, and technology-data controls. Separately, RBI penalized KrazyBee
              Services in 2023 after repeated complaints and failures around collection-agent harassment. That does not
              prove current controls are weak, but it does mean collections conduct belongs inside product diligence,
              not only inside legal or financial review. Public transparency is still thin on reliability: the reviewed
              sources did not surface a status page, uptime metrics, public incident logs, or readable noninteractive
              policy text for key legal pages.
