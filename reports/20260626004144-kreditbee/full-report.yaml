      - number: '2.2'
        title: Sizing Lenses and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              Once the boundary is set, the public numbers still diverge sharply. ETBFSI’s IIFL FinTech estimate implies
              a USD 515 billion digital-lending book by 2030 from a USD 38.2 billion 2021 base, while Precisa cites a
              much broader USD 1.3 trillion digital-financing opportunity by 2030 from a USD 270 billion 2022 base.
              MarkNtel’s USD 59.44 billion 2026 fintech market and IMARC’s USD 40.9 billion 2025 consumer-credit stock
              are not substitutes for either estimate; they are adjacent lenses with different denominators. 6Wresearch
              adds a 22.1% CAGR growth view but no equivalent size base. The result is not that one forecast is “wrong”;
              it is that broad-TAM estimates are built on incompatible scope choices. A more usable framing for
              underwriting KreditBee is constrained sizing: start from digitally originated unsecured personal credit
              and adjacent embedded-credit or MSME wedges that can still pass RBI conduct, funding, and risk tests, then
              treat broader trillion-dollar narratives as outer-envelope context rather than operating reality.
