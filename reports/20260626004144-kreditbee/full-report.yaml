              property-loan page even uses lower minimum-income thresholds for Tier 2 and Tier 3 applicants than for
              Tier 1 and metro users, which is a small but direct sign of geography-sensitive underwriting. The caveat
              is that not every product is equally national: the two-wheeler product is still explicitly serviceable
              only in Bangalore, Mysore, Telangana, and Tamil Nadu, so newer secured adjacencies look narrower than the
