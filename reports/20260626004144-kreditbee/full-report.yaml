            body: >-
              KreditBee’s customer base is broad in category but still specific in underwriting shape. The company’s own
              surfaces consistently describe a digitally acquired borrower base spanning salaried and self-employed
              users, then layer adjacent products for SME working-capital needs, two-wheeler finance, and
              loan-against-property cross-sell. Public product pages also show that low-salary and new-to-credit users
