  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, pricing, and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              KreditBee's public record supports three monetization buckets rather than a pure one-line consumer-lending
              story. First, the official product pages disclose list pricing for unsecured personal loans, flexi loans,
              business loans, and two-wheeler finance: the unsecured core generally sits at 12% to 28% APR with
              processing fees up to 4.8% plus GST, while secured two-wheeler finance can run from 10% to 28%. Second,
              MediaNama says the marketplace entity earns revenue primarily from processing fees on disbursals, plus
              credit-assessment, card-activation, service-fee, marketing, and brokerage-type income. Third, CARE says
              the combined business also books interest income from on-book assets as KrazyBee lends from its own NBFC
              balance sheet in addition to partner-originated loans.


              That mix matters because it separates corroborated metrics from company claims. Corroborated items are the
              listed APR and fee bands, the existence of own-book interest income, and the presence of ancillary fee
              lines. Company claims expand from there: management says future growth will lean on cross-selling to
              existing customers, and official pages show the cross-sell menu already spans business loans, flexi
              personal loans, two-wheeler finance, and loans against property. What remains unavailable is the exact
              revenue mix between spread income, processing income, and value-added services, so any underwriting model
              should treat list pricing as ceiling economics rather than realized yield.
