  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Valuation re-rate below 3x book
        - Public or private price discovery implies <$1.1B on roughly unchanged book value
        - Shows the April 2026 mark was too rich and compresses late-entry return potential.
        - Move from track to pass unless evidence quality improved materially.
      - - Credit-cost persistence
        - Credit costs stay near or above FY25's 7.7% while growth slows
        - Erodes the premium-growth-lender narrative and hurts public-market appetite.
        - Rework valuation on lower ROE assumptions.
      - - Governance / conduct recurrence
        - Another serious collections, compliance, or customer-harassment issue
        - Converts historical discount into an active control failure.
        - Pause diligence immediately; require governance remediation proof.
      - - Funding-cost pressure
        - Debt costs remain low-double-digit while prime competitors refinance more cheaply
        - Narrows spreads and reduces willingness to pay premium multiples.
        - Lower fair value range and extend holding period assumptions.
      - - Disclosure disappointment
        - IPO or diligence pack fails to reconcile entity scopes, cap table, or loss vintages
        - Removes the evidence path that would justify holding a 4x-plus book valuation.
        - Stay out at current price until disclosure is fixed.
    notes: These are monitorable triggers that directly connect operating evidence to valuation change.
