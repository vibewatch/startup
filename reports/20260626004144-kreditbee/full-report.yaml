      - number: '4.3'
        title: Credit quality, funding costs, and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The adverse read is straightforward: KreditBee remains structurally exposed to unsecured-credit volatility
              even though recent public metrics are solid. CARE labels asset quality only moderate because the core book
              is still dominated by unsecured personal lending. Credit cost rose to 7.7% of average assets in FY25 from
              6.1% a year earlier; GNPA was 2.8% and NNPA 0.7% at March 2025 before improving to 1.8% and 0.4% by
              December 2025. CARE also says 80% of disbursements go to repeat customers and that underwriting has been
              tightened toward larger-ticket, better-quality borrowers. That supports the thesis that KreditBee is
              trying to derisk the mix, but it does not remove the regulatory and cyclicality overhang.


              Funding is also not “free” just because profitability is positive. CARE says the December 2025 borrowing
              mix was still led by wholesale liabilities — 48.1% NCDs, 22.5% banks, 15.8% NBFCs, 8.0% pass-through
              certificates, and 5.4% commercial paper. The April 2025 key-information memorandum shows one secured
              listed NCD issue of ₹200 crore at a 10.65% coupon, implying a low-double-digit cost-of-funds floor on at
              least part of the debt stack. Public capital adequacy is comfortable today: CARE shows tangible net worth
              of ₹3,107 crore and CAR of 29.59% at March 2025, while the April 2026 Series E added $220 million of fresh
              primary equity before the planned IPO. Still, this is a business that depends on continued access to both
              capital markets and regulator-tolerated unsecured growth.
