              - CV039
              - CV043
              - CV044
      - number: '8.5'
        title: Comparable Set and Appropriate Valuation Method
        blocks:
          - type: paragraph
            body: >-
              The right comp set is mixed, because KreditBee sits between private app-first fintech peers and listed
              lenders that own regulated assets. The closest private peers by product and consumer behavior are CRED,
              Fibe, and to a lesser extent OneCard. CRED is the clearest adverse comp because its June 2025 round reset
              valuation to about $3.5 billion, roughly 45% below its 2022 peak $6.4 billion mark, showing that large
              Indian private fintechs can still be repriced sharply lower even after reaching meaningful scale. Fibe is
              more encouraging but still disciplined: the June 2026 IPO-preparation report suggested a roughly $600
              million 2024 valuation and a potential >$1 billion IPO outcome, which is helpful as a private-lender
              benchmark but still below KreditBee's current mark despite Fibe's large published distribution metrics.
              OneCard remains relevant as a card-native, app-first consumer-credit brand, but the accessible 2026 direct
              source set did not give a fresh valuation mark that can be used as a clean pricing anchor, so it stays a
              qualitative rather than quantitative comp.


              For public reference points, price-to-book is the primary lens. Bajaj Finance, Cholamandalam, and L&T
              Finance all trade as disclosed, regulated lenders with much deeper public reporting and more seasoned
              funding franchises. KreditBee's implied ~4.1x FY25 book sits below premium listed leaders such as Bajaj
              and broadly in the same neighborhood as upper-tier public NBFC multiples, but that is exactly why the
              current round does not look cheap. The company is private, still disclosure-thin, and more exposed to
              regulatory and underwriting perception shifts than those listed peers. Revenue multiples are a useful
              cross-check rather than the headline method: SBI Cards at about 5.6x EV/revenue and CRED at a
              low-double-digit private revenue multiple show that public and late-private fintech capital markets will
              still pay for scale, but only when evidence quality is strong. KreditBee therefore deserves a blended
              framework: book value first, earnings and funding quality second, revenue and AUM third.
            claimRefs:
              - CV016
              - CV020
              - CV021
              - CV022
