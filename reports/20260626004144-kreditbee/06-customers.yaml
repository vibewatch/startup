figures:
- id: FU001
  title: Customer journey map — core unsecured borrower to adjacent-product expansion
  type: journey-map
  layout: wide
  summary: KreditBee acquires digitally documentable retail borrowers first, then tries to deepen the relationship through repeat and adjacent products.
  data:
    items:
    - label: Discover / install
      detail: Borrower finds KreditBee through app-led mobile distribution and quick-cash demand.
    - label: Check eligibility / KYC
      detail: Borrower submits PAN, address, income, and bank details through a digital funnel.
    - label: First unsecured loan
      detail: Core personal-loan or flexi-loan product serves salaried or self-employed need.
    - label: Repay and re-borrow
      detail: Repeat borrowing becomes the main durability signal, with no concurrent loans or top-ups allowed.
    - label: Cross-sell larger or secured need
      detail: Existing users can move toward SME working capital, two-wheeler, or LAP products.
  approximationNotes: Stages simplify a real funnel that likely branches by partner lender, score band, and product type.
