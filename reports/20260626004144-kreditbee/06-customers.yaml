- id: durability-expansion-and-concentration
  title: Repeat borrowing, expansion, and unresolved concentration
  body: Durability is partly visible and partly missing. The strongest public retention proxy is CARE’s March 2026 note that about 80% of disbursements go to repeat customers, combined with the statement that concurrent loans and top-ups are not allowed. That suggests repeat use comes from sequential re-borrowing rather than uncontrolled balance stacking. Expansion is also visible. Management and media sources describe a natural progression from personal loans toward vehicle, gold, home, or business-credit needs, and by FY26 Moneycontrol says secured lending AUM had reached about ₹1,000 crore with MSME lending at about ₹500 crore. CARE corroborates that business loans plus LAP were 10.3% of AUM by December 2025, up from a much smaller share in early FY25. The unresolved problem is concentration. Public sources confirm more than 10 lending partners and app-led distribution dependence, but none quantify what share of originations comes from the owned app, dealer channels, co-lending partners,
    or existing-customer cross-sell. Likewise, the public record does not disclose NRR, GRR, churn, renewal curves, or top-employer concentration, so the chapter can support repeat borrowing and adjacency expansion, but not a clean retention or channel-risk model.
