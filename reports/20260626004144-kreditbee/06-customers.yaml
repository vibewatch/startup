- id: customer-verdict
  title: Customer verdict
  body: 'KreditBee’s customer chapter is directionally strong on adoption and weaker on durability transparency. The public record supports a very large borrower franchise that has moved well beyond the 4.7 million active-borrower benchmark, a clear non-metro and mid-India footprint, and a visible strategy of turning repeat unsecured users into secured and SME customers over time. It also supports real named proof and strong App Store ratings. The caution is that the cleanest retention and concentration metrics are still absent, and the adverse customer-protection record is meaningful rather than theoretical because both RBI and later independent reviews point to collections friction. Net: customer demand looks real and repeat-heavy, but investors still need internal cohort, complaint-resolution, and channel-share data before concluding that scale has converted into high-quality, low-friction customer durability.'
