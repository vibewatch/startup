company:
  name: KreditBee
chapter:
  number: 6
  title: Customers
  summary: KreditBee’s public record supports a very large, repeat-heavy borrower franchise that is concentrated in app-led unsecured consumer credit but is widening into SME and secured cross-sell. The strongest support is for 18 million-plus cumulative borrowers, 55 lakh active monthly repayment relationships, and 80% repeat disbursements; the biggest unresolved gaps are formal retention metrics, channel concentration, and whether collections frictions have fully normalized after RBI’s 2023 penalty.
sections:
- id: segments-and-geography
  title: Borrower segmentation and geographic mix
  body: 'KreditBee’s customer base is broad in category but still specific in underwriting shape. The company’s own surfaces consistently describe a digitally acquired borrower base spanning salaried and self-employed users, then layer adjacent products for SME working-capital needs, two-wheeler finance, and loan-against-property cross-sell. Public product pages also show that low-salary and new-to-credit users remain part of the acquisition story so long as they can satisfy minimum-income and digital-KYC requirements. Geography is a meaningful part of the story. Fortune quotes management saying only 18% of customers are in metros and 82% are in Tier 1 to Tier 4 or “mid India” cities, while Moneycontrol separately describes traction across metros as well as Tier 2 and Tier 3 cities. KreditBee’s own property-loan page even uses lower minimum-income thresholds for Tier 2 and Tier 3 applicants than for Tier 1 and metro users, which is a small but direct sign of geography-sensitive underwriting.
    The caveat is that not every product is equally national: the two-wheeler product is still explicitly serviceable only in Bangalore, Mysore, Telangana, and Tamil Nadu, so newer secured adjacencies look narrower than the flagship unsecured funnel.'
