- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration / dependence risk
  - evidence
  - impact
  - current status
  - diligence path
  rows:
  - - Repeat unsecured borrowing
    - Repeat use could be credit-cycle sensitive if underwriting loosens
    - CARE says 80% of disbursements are to repeat customers
    - Major driver of operating leverage and cross-sell
    - Supported, but no cohort decay tables
    - Review vintage and repeat-loan performance by score band
  - - SME working-capital expansion
    - Physical-underwriting needs can raise cost and execution risk
    - Official business-loan pages and Moneycontrol describe active SME rollout
    - Opens larger-ticket self-employed segment
    - Scaling but still minority share
    - Request active SME borrower count and loss metrics
  - - Secured adjacency (LAP / two-wheeler)
    - Product footprint can stay regionally narrow
    - Moneycontrol and CARE show rising secured share; two-wheeler page has regional limits
    - Can lift ticket size and diversify book
    - Growing from small base
    - Ask for product-wise AUM, geography, and repeat behavior
  - - Partner-lender dependence
    - Originations depend on external capital providers and co-lending rails
    - App listings and news cite 10+ financial-institution partners
    - Can constrain growth if partner appetite changes
    - Clearly material
    - Request top-partner shares of originations and balances
  - - App-led distribution
    - Channel concentration not publicly quantified
    - Website, App Store, and Play funnel all center on mobile onboarding
    - Strong mobile scale but store-health dependency
    - Material but unmeasured
    - Request owned-app versus cross-sell versus partner acquisition split
  - - Cross-sell into existing customers
    - Could overstate durability if mostly driven by a small power-user subset
    - Two-wheeler page limits product to existing customers; self-employed and business-loan pages imply progression path
    - Potentially lowers CAC on adjacencies
    - Concept supported, economics opaque
    - Provide multi-product attach and repeat-customer distribution
  notes: The public record supports the existence of expansion loops but not the concentration shares or cohort economics behind them.
