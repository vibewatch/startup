- id: adoption-and-activity
  title: Adoption trajectory, active borrowers, and ticket size
  body: The scale evidence is materially above the 4.7 million borrower headline in the brief. Across 2026 coverage, KreditBee is repeatedly described as having more than 18 million unique loan customers, more than 60 million loans facilitated, and around 230 million app downloads. Fortune adds the most specific live-activity figure by saying the company collects repayments from roughly 55 lakh active borrowers every month, while also quoting management on about 70,000 new downloads per day and roughly 30,000 daily loans to unique borrowers. Moneycontrol adds a separate throughput datapoint of around 70,000 daily loan requests with roughly 10% approvals. Ticket sizes also support the idea that this is a high-frequency lender rather than only a large-ticket NBFC. KreditBee’s own salaried and self-employed pages still market a mass-market unsecured funnel with ₹6,000 to ₹10 lakh loans and minimum monthly income of ₹10,000, while external reporting puts average tickets around ₹60,000 overall,
    roughly ₹25,000 for self-employed borrowers, roughly ₹80,000 for salaried borrowers, and about ₹30,000 for CARE’s average unsecured ticket snapshot. On balance, the evidence supports a scaled repeat-use credit platform whose live active-borrower number is now better framed at 5.5 million monthly payers than at 4.7 million.
