tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - segment
  - buyer / user / payer
  - use case
  - evidence of scale or fit
  - strategic value
  - gap / caution
  rows:
  - - Salaried urban and middle-India workers
    - Individual borrower / same / same
    - Emergency liquidity, planned consumption, travel, bills
    - Official and app-store surfaces market personal loans directly to salaried users; third-party sources report ₹40k-₹80k typical tickets
    - Core unsecured funnel and repeat-customer base
    - No disclosed cohort economics or employer concentration
  - - Self-employed individuals
    - Individual borrower / same / same
    - Working-capital smoothing and personal cash needs
    - Official and app-store surfaces market personal and flexi loans to self-employed users; historical ticket sizes ~₹20k-₹25k
    - Important non-salaried acquisition wedge in underbanked markets
    - No disclosed delinquency split by occupation
  - - Young professionals / thin-file borrowers
    - Individual borrower / same / same
    - Fast digital credit for first formal borrowing
    - CARE and Fortune show the business started with a much higher new-to-credit mix before migrating up-market
    - Explains early growth and brand fit in consumer fintech
    - Current share is small, so legacy positioning may overstate present mix
  - - Low-salary and new-to-credit borrowers
    - Individual borrower / same / same
    - Short-term cash flow smoothing
    - Instant-loan page explicitly markets low-salary and new-to-credit use cases with digital KYC and minimum-income gates
    - Supports thesis that digital underwriting reaches beyond prime salary-account users
    - Public evidence on current share of this cohort is not quantified
  - - SME / working-capital users
    - Business owner / same / same
    - Unsecured and secured working-capital loans
    - Business-loan product exists publicly; official pages and 2026 reporting say SME expansion is active and partly phygital
    - Main adjacency for self-employed graduation and larger-ticket lending
    - Public data does not show active SME borrower count
  - - Existing-customer secured cross-sell
    - Existing borrower / same / same
    - Two-wheeler finance and LAP for larger ticket needs
    - Two-wheeler product is restricted to existing customers and employees; CARE and Moneycontrol show secured/LAP mix rising
    - Potential CAC-efficient expansion path
    - Geography and product rollout remain narrower than core unsecured lending
  notes: Rows separate the core unsecured retail funnel from newer secured and SME adjacencies; scale remains best supported for the unsecured consumer base.
