  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: Public NRR, GRR, churn, renewal-rate, and cohort-retention disclosures by borrower segment.
    whyItMatters: Repeat borrowing is visible, but investors still cannot tell whether the best cohorts expand profitably or merely recycle short-duration credit.
    diligencePath: Request cohort tables by origination month, segment, ticket size, score band, and product, including 30/90/180-day repeat behavior and loss outcomes.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-gap
    missingEvidence: Owned-app versus cross-sell versus partner/dealer acquisition split, plus top-partner and top-channel concentration shares.
    whyItMatters: The chapter can see that channel and partner dependence exist, but not whether a small number of rails account for most originations or balances.
    diligencePath: Request monthly originations and AUM by acquisition source, partner lender, and secured versus unsecured product line.
    relatedQuestionRefs:
    - QU021
    - QU024
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: named-proof
    missingEvidence: Independent named customer references with loan use case, tenure, satisfaction, and renewal outcomes.
    whyItMatters: Current named proof is marketing-controlled and therefore useful for existence proof but weak for underwriting service quality or durable loyalty.
    diligencePath: Ask management for investor-reference calls across salaried, self-employed, and SME cohorts, with at least one borrower who used an adjacent product after the first loan.
    relatedQuestionRefs:
    - QU014
    - QU023
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: collections-risk
    missingEvidence: Complaint-volume trend, grievance-resolution SLA, cure rates after first missed EMI, and collections-quality audit outcomes after the 2023 RBI penalty.
    whyItMatters: Adverse public reviews and the prior RBI finding make customer-treatment quality a live diligence issue rather than a closed historical incident.
    diligencePath: Request post-penalty remediation documents, agent-monitoring metrics, complaint taxonomies, and monthly escalation volumes to ombudsman or regulator.
    relatedQuestionRefs:
    - QU017
    - QU019
    - QU025
    relatedTableRefs:
    - TU004
    - TU006
  - type: conflicting-data
    severity: minor
    topic: user-metric-definitions
    missingEvidence: A management glossary reconciling downloads, users, registered customers, active customers, unique loan customers, and active monthly borrowers.
    whyItMatters: Public sources mix cumulative, active, and platform-level metrics, which can make borrower-scale comparisons look inconsistent when they may only use different denominators.
    diligencePath: Ask management for one KPI bridge from app installs to registered users to unique borrowers to current monthly active payers.
    relatedQuestionRefs:
    - QU003
    - QU004
    - QU005
    - QU006
    relatedTableRefs:
    - TU002
