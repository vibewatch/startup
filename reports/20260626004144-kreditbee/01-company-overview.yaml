- "id": "funding-scale-and-milestones"
  "title": "Funding history, scale metrics, and milestone record"
  "body": |-
    The capital narrative has three layers: a 2022 late-stage round that funded product expansion during a difficult market, a 2023–2024 extension or bridge phase with inconsistent public valuation marks, and a 2026 pre-IPO round that reset the company into unicorn territory. TechCrunch, Moneycontrol, Financial Express, and The Tech Portal all agree that KreditBee raised $80 million in December 2022 with support from Premji Invest, Motilal Oswal Alternates, NewQuest, Mirae Asset, and MUFG. What remains less clean is the total-funding and valuation bridge from that point to April 2026. Entrackr says the 2023 extension valued the business around $700–800 million; Tracxn shows a March 2024 $9.4 million Series D transaction at about $184 million; Moneycontrol says total funding after the 2026 raise is around $540 million; Inc42 Datalabs lists $642.65 million-plus; and InforCapital lists $674 million. That dispersion suggests different counting rules for secondary sales, extensions, or non-primary capital, so the chapter treats cumulative capital as a diligence item rather than a settled KPI.

    Scale metrics are directionally strong but not yet filing-grade consistent. CARE Ratings gives the best independently analytical AUM series: ₹7,644 crore at March 2024 and ₹8,735 crore at September 2024. Moneycontrol then reports FY25 AUM of ₹10,100 crore and FY26 AUM around ₹15,000 crore, while Fortune India says repayments are collected from roughly 55 lakh active borrowers every month in 2026. Public sources also agree on more than 18 million unique loan customers, more than 60 million loans facilitated, and more than 230 million app downloads by 2026. The main gaps are equally important: the requested 4.7 million-plus active-borrower point for 2024 was not independently corroborated in the fetched source set, and FY25 revenue or profit figures conflict across reputable outlets. Those inconsistencies do not negate the growth story, but they do mean any investment memo should anchor on corroborated operating ranges and explicitly ring-fence the unresolved metrics before using them in valuation work.
