  "title": "Company Overview"
  "summary": "KreditBee is a Bengaluru consumer-lending platform that combines app-led customer acquisition with an RBI-regulated NBFC and partner-lender network. The strongest evidence is the April 2026 Series E that valued the company at $1.5 billion, but the chapter also surfaces material diligence flags: a 2023 RBI penalty over collection-agent harassment, inconsistent founding-year narratives, and unresolved conflicts in cumulative funding and FY25 financial metrics."
"sections":
- "id": "identity-and-operating-model"
  "title": "Identity, headquarters, and operating model"
  "body": |-
    KreditBee is a Bengaluru-based digital consumer-lending platform that markets itself as a loan facilitator connecting borrowers with RBI-registered NBFCs and banks, while also operating through its own NBFC arm, KrazyBee Services. Across the homepage, app-store listings, and product pages, the company consistently presents a mobile-first proposition built around instant personal loans, business loans, two-wheeler finance, loan against property, and adjacent UPI or credit-report services. The operating logic matters for diligence because the same brand spans software distribution, customer acquisition, underwriting technology, and regulated lending balance-sheet activity rather than a pure marketplace model. This structure is a strength for control over disbursal and collections, but it also ties the brand directly to regulated-credit conduct outcomes.

    The cleanest identity anchor is therefore not a single marketing year, but a layered timeline: Finnovation Tech Solutions was incorporated in 2016, KrazyBee received its NBFC licence in 2017, and several public profiles describe KreditBee itself as founded or launched in 2018. Public data also converges on a late-stage private status: the business entered the unicorn club in April 2026 after a Series E round at a $1.5 billion valuation. Headquarters evidence is comparatively strong because the official website metadata and both app stores point to the same Kodihalli, HAL Old Airport Road address in Bengaluru. Product economics disclosed publicly are also concrete enough for reuse in later chapters: personal loans are marketed from ₹6,000 to ₹10 lakh, typical tenures run from 6 to 60 months, and consumer-facing pricing ranges from roughly 12% to 28.5% annual interest with app-store APR examples reaching 50%.
