      - number: '3.3'
        title: 分发能力、锁定与多归属
        blocks:
          - type: paragraph
            body: >-
              AI21 最难的竞争挑战是分发，而不只是模型质量。OpenAI、Google 和 Anthropic 都受益于巨大的用户熟悉度、云端位置或生态存在感，正式比选开始前就降低了买方摩擦。Writer 和 Cohere
              从不同角度切入：它们把治理、连接器、托管部署和业务流程结果打包销售，看起来比更窄的编排主导叙事更容易采购。内部自建团队进一步让局面复杂，因为 LangChain
              等框架让成熟客户自己拥有工作流层，并在其下切换外部模型。


              这种动态削弱了直接锁定，也提高了多归属。买方可以把敏感负载路由给一家，把品牌内容交给另一家，把低成本实验放到开放模型，把定制业务逻辑留给内部工具。AI21 试图把这种碎片化变成优势，将 Maestro
              包装成跨模型来源的控制平面。但同样的买方逻辑也可能降低离开 AI21 的切换成本——一旦编排和可观测性在别处变成标准功能。AI21
              的机会，是成为多供应商世界里的中立协调层；风险则是大型供应商把足够多的同类功能打包进已获批准的套件，让中立性不再必要。
