  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              AI21 Labs 并不落在一个干净的市场盒子里。相关需求池处在企业 LLM 软件、私有 AI 部署，以及面向知识密集工作流的 AI 智能体编排交叉处。AI21
              官方材料始终用工作流而不是基准测试来定义需求：为受监管数据提供私有 AI，为重文档工作提供长上下文模型，并用 Maestro
              在多步骤任务中做规划、验证、路由和成本控制。因此，公司竞争对象不只是基础模型供应商，也包括工作流平台、内部自建栈，以及由人工分析师把搜索、电子表格、文档和工单系统拼在一起的现状。


              这个边界很重要，因为宽泛的 AI 市场数字很容易夸大 AI21 实际能卖进去的空间。应纳入的支出包括模型访问、编排、治理、私有部署、文档处理，以及企业 IT 和业务团队使用的集成工具。应排除的是大宗 GPU
              基础设施、通用消费聊天机器人、AI 硬件资本开支，以及无法形成可复用软件控制平面的专业服务收入。现状替代仍很强：许多企业仍用分析师、呼叫中心坐席、顾问、人工审核团队和自研自动化完成同一类工作。因此，AI21
              的市场大到值得关注，但又足够窄，最终胜负更多由生产验证、合规姿态和工作流契合度决定，而不是抽象的 AI 热度。
