        - 面向工作流的企业 agent 平台参考
        - 在某些方面比前沿实验室更接近产品市场可比
      - - Mistral
        - 传闻私有估值 ~€20B（2026 年）
        - 前沿模型稀缺性和主权 AI 溢价
        - 显示 AI21 距顶级模型实验室定价有多远
