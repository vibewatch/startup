      - - Snowflake
        - 市值 ~$94.6B（2026 年 7 月）
        - FY2026 10-K 给出高增长数据平台的收入背景
        - 有助于框定高质量增长溢价，但仍只是部分可比
      - - Salesforce
        - 市值 ~$142B（2026 年 7 月）
        - FY2026 业绩锚定成熟软件规模
        - 说明低增长平台的倍数纪律
      - - C3.ai
        - 市值 ~$1.37B（2026 年 7 月）
        - FY2026 业绩锚定较小型上市 AI 软件公司
