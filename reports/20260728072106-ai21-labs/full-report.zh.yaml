      - number: '8.4'
        title: 情景分析、尽调阻碍与结论
        blocks:
          - type: paragraph
            body: >-
              现阶段，基于情景的方法是 AI21 唯一可信的公开市场纪律。乐观情景假设 Maestro
              成为可重复的控制平面产品，能越过少数灯塔胜利继续扩张，把技术可信度转化为多账户企业收入和更清晰披露。基准情景假设转向足以保住独角兽标记，但也只是勉强：AI21
              证明企业相关性，却仍缺乏足够透明度来获得显著溢价。悲观情景假设公司仍能运营、技术仍有相关性，但依旧无法拓宽公开证据，暴露弱留存，或显示重置后更小的组织撑不住企业交付。在这个框架下，仅凭公开证据，约 $0.9B 到
              $1.8B 的公允价值区间是合理的；今天可见标记更接近中位，而不是便宜入场点。因此建议观望。投资者不应把 AI21 直接排除在外，但在上调信心前，应要求看到收入、留存、集中度和股权结构证据。
