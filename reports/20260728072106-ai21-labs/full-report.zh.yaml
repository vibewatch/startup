      - number: '5.3'
        title: 部署、信任与生产就绪
        blocks:
          - type: paragraph
            body: >-
              AI21 把部署和治理当作产品功能。公司的部署页面强调 AI21 托管、伙伴部署、VPC 和本地选项；NVIDIA NIM 集成强化了面向企业 GPU 环境优化的自托管路径；Bedrock 分发则显示，AI21
              愿意在外部控制平面里触达客户。这很重要，因为许多企业 AI 买方关心的不是模型绝对前沿位置，而是它能否部署进既有安全和采购边界。AI21 的公开隐私政策、SOC 2 / ISO
              信息和状态页都说明，这不是研究实验室事后套上的包装；信任控制是产品包的一部分。


              不过，公开证据更偏采购就绪，而不是运营透明。状态页证明公司有可见的运营状态入口，但没有给出丰富的历史可靠性细节。隐私政策清楚说明可处理哪些内容，但外部人仍看不到客户在生产合同中谈判的精确架构边界。因此，信任故事可信但不完整。它足以支撑企业尽调，同时也留下对实际实施做更深安全审查的空间。
