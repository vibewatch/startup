        blocks:
          - type: paragraph
            body: >-
              AI21 是私营公司，因此观察可能利润率结构的最佳公开窗口来自相邻企业 AI 公司。Palantir 文件显示，大型复杂 AI 部署即便规模可观，也可能伴随长销售周期、高安装负担，以及大客户显著集中。C3.ai
              2026 年业绩显示，一家公司收入大多来自订阅，但 GAAP 毛利率仍仅中等，并继续依赖大额现金缓冲。相比之下，Salesforce
              展示了当积压订单、经营现金流和追加销售引擎成熟后，规模化经常性企业软件是什么样子。合在一起，这些可比公司暗示 AI21 可能更接近高服务触点、重实施的企业 AI 一端，而不是成熟 SaaS 效率。


              资本故事强化了这一判断。2025 年融资规模不小，2026 年裁员说明管理层愿意压降费用、收紧焦点。这组动作可能降低短期资不抵债风险。但它不能告诉投资人，AI21
              已经达到健康单位经济，还是只是买到了更多时间。没有公开现金消耗、毛利率或积压订单时，当前最佳公开推断是：AI21 仍足够依赖资本，执行纪律比收入野心更重要。转向 Maestro
              若能提高收入质量、降低单客户交付成本，就能改善这幅图；但公开证据尚未在财务上证明这次转换。
