    title: 关键尽调阻塞项和论点破裂触发器
    columns:
      - 未决事项
      - 重要性
      - 公开状态结论
      - 下一步尽调
    rows:
      - - 当前 ARR / 收入
        - 需要用来检验当前估值对应的倍数是合理还是拉伸
        - 保留来源集中未披露
        - 索取董事会级收入桥和最新运行率
      - - NRR / 流失 / 分 cohort 留存
        - 决定 Maestro 和企业部署能否持久扩张
        - 公开不可见
        - 索取 cohort 瀑布图和头部账户续约情况
      - - 客户集中度
        - 少数灯塔 logo 可能掩盖脆弱经济性
        - 公开不可见
        - 索取前十大客户占比和 pipeline 集中度
      - - 重置后组织产能
        - 交付深度决定企业部署质量
        - 只能通过新闻和支持自动化叙事间接观察
        - 索取当前组织架构图和实施人员配置比例
      - - 股权结构 / 清算优先权
        - 后期投资者回报取决于条款，不只取决于名义估值
        - 公开不可见
        - 索取完整股权结构表和优先权堆栈
    notes: 前三个阻塞项中任意一个都可能实质性重估 AI21，因为它们决定当前估值反映的是规模，还是主要反映预期。
