      - number: '1.4'
        title: 战略重置与当前状态
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，AI21 Labs 的决定性事实不只是又融了一笔钱，而是公司实质收窄了经营命题。Calcalist、Globes 和 Ynet 均报道，AI21 在 2026 年 5 月将员工从约 180
              人削减到约 70 人，结束了围绕可能被 Nebius 收购的谈判，并决定停止单独模型销售。报道还称，AI21 保留 Jamba 和模型工作作为技术基础，同时把未来商业化集中到 Maestro——公司用于优化企业
              AI 智能体的平台。换句话说，AI21 从横跨完整模型 / 应用栈的竞争，转向销售可靠智能体执行的控制平面。


              这次转向不完全是防守。同一批负面报道也称，AI21 签下了价值数千万美元的合同，包括与 Nebius 的合同，并达成了包括 Wix 在内的 Maestro 相关合作。AI21
              官方材料支撑了更广的产品论点：Maestro
              被包装成模型无关、重验证，并面向企业工作流里的成本、延迟与可靠性取舍。但投资人仍应把这次调整读成混合信号。它验证了管理层愿意适应变化，也意味着单独基础模型商业化并没有可持续地放大到足以支撑此前更宽的野心。公司仍在运营、有资金，也具备技术相关性；但当前姿态更像一家后期非上市公司围绕更锐利切入点重建，而不是一个平滑复利的平台故事。
