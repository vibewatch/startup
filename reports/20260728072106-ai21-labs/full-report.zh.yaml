      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              AI21 这套栈背后的架构逻辑，比泛泛的「AI 平台」营销更具体。Maestro
              被描述为动态规划系统：把指令与明确要求分开，构建模型和工具调用树，并在预算和质量约束下迭代改进输出。这不同于静态提示词链。产品有意暴露验证、评分卡和执行图，让用户能检查结果为何生成、修正发生在哪里。模型侧，Jamba
              的 Transformer-Mamba-MoE 混合架构旨在降低长上下文推理的内存负担，同时守住质量。1.5 代进一步加入量化和硬件适配主张，直接指向部署可行性。


              支撑研究解释了 AI21 为什么认为这件事重要。Parallel Context Windows 和 In-Context RALM 都显示，公司倾向于务实地使用或扩展模型，而不是从零重建整套栈。公司对 RAG
              评估的批评也表明，AI21 把生产系统视为多文档、多步骤推理问题，而不是基准测试练习。合起来看，这些材料支持一个判断：AI21 的产品 DNA 是「围绕 LLM 的应用系统工程」，不只是模型预训练。
