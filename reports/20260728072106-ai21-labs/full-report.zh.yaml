      - number: '1.3'
        title: 融资历史与规模
        blocks:
          - type: paragraph
            body: >-
              AI21 Labs 在非美国企业 AI 初创公司中搭起了较大的资本栈，但路径是逐轮加码，而不是一次巨额融资。TechCrunch 报道，公司 2022 年 7 月完成 $64M Series B，估值
              $664M，当时累计融资 $118.5M。随后又报道 2023 年 8 月完成 $155M Series C，估值 $1.4B，已披露融资升至 $283M；2023 年 11 月追加 $53M
              扩展轮，把累计已披露资本推至 $336M，同时维持同一估值。Calcalist 和 SiliconANGLE 的 2025 年独立报道随后称，Google 和 Nvidia 参与了 $300M Series
              D，累计已披露融资约 $636M。


              这段资本史的战略意义在于，投资人组合不只是财务资本。公开报道和官网投资人标识指向 Google、Nvidia、Intel Capital、Samsung Next、Pitango、Walden
              Catalyst、Ahren、b2venture、SCB10X、Comcast Ventures 等具备生态相关性的支持者。同时，融资叙事并非一路凯歌。最后一个广泛交叉验证的明确估值标记仍是 2023 年的
              $1.4B；多篇 2025 年报道提到 Series D，但没有记录新的定价估值。尽调上，这意味着累计融资额比当前公允估值更站得住。公司毫无疑问拿到了深度支持，但公开证据仍留下关键缺口：2025 年融资和
              2026 年重组之后，公司到底守住、扩大，还是损伤了独角兽估值。
