  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资假设、反向假设与估值背景
        blocks:
          - type: paragraph
            body: >-
              不应再把 AI21 当成仍在试图直接赢下全球前沿模型竞赛的公司来估值。公开证据现在指向一个更窄、但更可投资的假设：这是一家资金充足的以色列 AI 公司，创始人强、研究资产有分量，并围绕 Maestro、Jamba
              和私有化部署搭出更偏企业的控制平面故事。相比没有工作流楔子的普通模型实验室，这种业务形态更好；但它也更受约束。2026
              年战略重置很重要，因为它显示，在更宽泛野心和收购谈判未按预期落地后，管理层愿意收窄焦点。因此，投资者得到的是一家看起来更有纪律的公司，但它也已经用掉了一部分战略灵活性。反向假设很直接：如果 Maestro
              只是一个有吸引力的叙事，而不是可重复的扩张引擎，那么今天的独角兽标记就会显得像给一家规模更小、更依赖执行的企业 AI 供应商付了满价，而不是给一个爆发式平台定价。
