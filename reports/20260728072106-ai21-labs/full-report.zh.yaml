      - number: '6.4'
        title: 扩张、集中度与采购风险
        blocks:
          - type: paragraph
            body: >-
              这些企业案例显示，AI21 的扩张往往从窄场景、具体工作流切入。Fnac Darty 先把 AI21 用在法国售后支持，再推进更广的欧洲部署。Ubisoft 用 AI21
              增强写作者和训练数据生成，而不是试图自动化整个游戏工作室。Write Label 据称把 AI21 嵌入了一条内容生产线。这条路径合理——企业买家通常先从一个疼点流程采用 AI——但也意味着，AI21
              的公开客户证据更能证明拿下首个场景，而不是证明持续扩张。更可能的扩张逻辑是：AI21 先在受限工作流里证明 ROI，同一套编排和事实锚定架构再向邻近团队或地区铺开。公开证据支持这套逻辑，但还没有证明扩散已经发生。


              客户集中度和留存韧性因此是最难回答的两个客户问题。私有化部署和面向合规的打包方式应该有助于 AI21 拿下受监管或安全敏感型买家，但也会抬高实施负担，并可能拉长交易周期。2026
              年裁员和战略收缩又增加一层不确定性：企业客户可能认可聚焦，也可能担心重置期间覆盖范围或路线图变化会影响连续性。公开材料没有披露头部客户组合、对少数灯塔账户的依赖，或试点是否升级为多年期标准。结论是，AI21
              的客户故事可信且在改善，但公开证据密度还不足，无法有把握地承销扩张效率或集中度风险。
