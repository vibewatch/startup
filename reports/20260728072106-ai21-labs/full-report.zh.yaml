  - id: FV003
    title: 情景敏感性矩阵
    type: matrix
    layout: wide
    summary: 情景驱动因素如何影响 AI21 可能落入的估值区间。
    data:
      columns:
        - 驱动因素偏弱
        - 驱动因素混合
        - 驱动因素偏强
      rows:
        - label: 收入质量 / 规模
          values:
            - 低于 $100M 或不透明
            - 足以守住当前估值
            - 明确支撑溢价
        - label: 客户广度
          values:
            - 灯塔客户少
            - 有部分扩张证据
            - 多个可背书部署
        - label: 重置后执行
          values:
            - 产能显得单薄
            - 足够但未经验证
            - 企业交付稳定
        - label: 披露深度
          values:
            - 极少
            - 选择性披露
            - 清晰 ARR / NRR / 集中度数据
        - label: 估值含义
          values:
            - 跌破 $1B 风险
            - ~$1.1B-$1.5B
            - ~$1.6B-$2.0B+
    approximationNotes: 该矩阵是定性工具，用来展示运营证据如何传导到估值，并不是正式 DCF。
