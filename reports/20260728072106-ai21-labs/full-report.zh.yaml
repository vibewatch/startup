      - number: '6.2'
        title: 采用轨迹与具名证明
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开采用故事是 Wordtune。AI21 称用户超过 1000 万、改写选择达数亿次，Chrome
              扩展和评测渠道也强化了真实用户活动。它没有揭示付费转化，但说明产品曝光广、重复使用存在。企业侧最有说服力的具名证明是 Fnac Darty。公开公告描述了一项战略合作：Maestro
              将支持售后运营、分析历史和实时数据，并减少错误和不必要的上门服务。这是有意义的验证点，因为它把 AI21 绑定到具体客户、工作流和预期经济结果。


              Ubisoft 是第二个主要具名证明，显示 AI21 嵌入了作者在环的游戏内容生产和数据增强。这一案例有价值，因为它说明的不只是实验，而是接入真实创意工作流。Apps Run The World
              增加了第三个具名部署 Write Label，不过该证明较弱，因为最强细节来自一个第三方列表，而不是直接供应商案例。合在一起，这些具名参考显示 AI21
              能切进零售、媒体和广告的具体工作流。它们还没有证明企业部署已经形成很长、可扩展、可重复的清单。
