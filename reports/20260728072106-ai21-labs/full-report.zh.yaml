      - - 核心下行
        - 执行重置、集中度或弱留存把独角兽估值压成窄软件供应商倍数
        - 中
        - 若牵引力证实偏薄，下行情形建模到低于 $1B
    notes: 这项建议对价格敏感，也受证据约束；并不是对公司或技术的笼统负面判断。
