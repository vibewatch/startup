      - number: '6.3'
        title: 留存、耐久性与满意度
        blocks:
          - type: paragraph
            body: >-
              Wordtune 的公开满意度信号相当不错。产品页面、Capterra 和评测摘要都指向易用性、不错的改写质量，以及与用户既有工作地点的强集成，尤其是 Google
              Docs、Gmail、浏览器和其他沟通表面。这很重要，因为直接嵌入日常写作工作流的产品，通常比要求用户改变行为的目的地型产品更有重复使用前景。同时，同一批评测来源也暴露真实摩擦：免费套餐限制严格、高级档价格敏感、脱离上下文的建议仍需人工编辑，以及一些关于客服或账单取消体验的投诉。


              更大的问题是缺少留存数据。本次保留的来源集中没有公开 NRR、GRR、流失率、合同期限或续约信息。即便是 Wordtune，宽泛使用指标也不能说明用户是否转化、留下或扩张。企业部署证据更薄。Fnac Darty
              和 Ubisoft 显示契合和意图，但没有续约历史。Intercom 案例提供了有用的间接信号：AI21
              自身投入扩展客服和自动化，暗示公司预期会有持续用户需求。尽管如此，支持效率并不等同于客户耐久性。尽调视角下，客户质量在满意度和工作流契合度上更可见，在可衡量留存上仍不清楚。
