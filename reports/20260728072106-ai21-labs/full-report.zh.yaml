      - number: '3.2'
        title: 能力与定价对比
        blocks:
          - type: paragraph
            body: >-
              当买方看重可靠性、路由和结构化执行，而不只是单个模型的基准排名时，AI21 的直接产品对比最强。AI21 将 Maestro 定位为模型无关，并聚焦规划、验证和有成本意识的编排；Jamba
              则支撑长上下文和私有部署叙事。这个定位有别于 OpenAI 和 Anthropic，后两者主推强大的通用智能体和企业工作区；Writer 将智能体式工作流执行与治理、品牌控制打包；Cohere 强调私有企业 AI
              和托管模型服务；Mistral 提供开放权重灵活性和相对较低的标价；Google 则用多模态广度和生态触达竞争。


              公开定价凸显了 AI21 的战略问题。OpenAI 为企业提供相对低摩擦的席位入口。Anthropic 公开给 Sonnet 5 标出有竞争力的 token 价格，服务规模化智能体工作。Mistral
              在多个模型上给出很低 API 定价。Cohere、Writer 和企业捆绑包不太按简单 token 比价来卖，更偏平台合同；但信号仍清楚：原始模型访问正在商品化，工作流和治理价值正在被打包。AI21
              因此必须证明，其编排层能创造足够的准确率、可追溯性和部署杠杆，才能让客户在越来越便宜的替代方案之上再采纳一家供应商。
