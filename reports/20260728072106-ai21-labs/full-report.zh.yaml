      - number: '2.2'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方基础首先是企业，预算通常来自技术、运营、知识管理、合规或客服负责人，而不是孤立的数据科学实验室。Deloitte 和 McKinsey 都显示，AI 使用已经很广，但生产规模仍不成熟，这与 AI21
              围绕信任和执行的叙事吻合。Deloitte 报告称，2025 年员工 AI 访问权限增长 50%，至少 40%
              项目进入生产的公司数量预计六个月内翻倍；但它也指出，只有五分之一的公司对自主智能体有成熟治理。McKinsey 同样发现，88% 的组织至少在一个职能中使用 AI，但只有约三分之一开始在全企业扩展 AI。


              这些发现拼出清晰采用路径。初始切入通常来自高摩擦但边界清楚的工作流，例如研究、合规审查、文档摘要、编码支持或内部知识检索。第一买方往往是 CIO、CTO、AI
              平台负责人、首席数据官、客服运营负责人，或在准确率、吞吐量、人工成本上有痛点的业务职能负责人。后续扩张取决于安全审查、连接器质量、可观测性，以及系统能否顶住混乱企业数据。AI21
              的产品正是为从试点跨到生产的这一步设计，但同样的部署摩擦既制造需求，也拖慢采购速度、拉高采购复杂度。
