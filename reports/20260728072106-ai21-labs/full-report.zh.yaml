      - number: '7.3'
        title: 运营、合作伙伴与执行风险
        blocks:
          - type: paragraph
            body: >-
              运营上，AI21 承诺的东西很多：模型、编排、检索、验证、私有化部署和垂直工作流。即便不考虑 2026
              年重组，这种广度本身就带来执行风险。裁员和战略收缩可能提升聚焦度和烧钱纪律，但也自然引出几个问题：人员厚度、支持覆盖，以及持续推进复杂客户实施的能力。Intercom 案例研究是有用的缓释信号，因为它显示
              AI21 投入了面向规模化支持的自动化；状态页也是一个信号，因为它提供了公开事故界面。但二者都没有回答更深的问题：规模更小的组织，能否在交付企业级服务的同时，继续推出新研究和产品层。


              合作伙伴和平台依赖会放大上述风险。AI21 依赖 Google Cloud、AWS Bedrock、NVIDIA NIM 等外部基础设施和渠道来增强部署触达和客户适配。这些合作显然有价值，但也意味着 AI21
              的客户体验有一部分取决于它无法控制的生态。私有化部署能降低部分隐私担忧，却通常会增加实施负担和协同需求。因此，最高的剩余运营风险不是模型单独回答得好不好，而是公司能否在多样化环境中保持交付一致性。
