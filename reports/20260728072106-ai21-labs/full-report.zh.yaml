      - number: '8.3'
        title: 可比公司分析与公允价值框架
        blocks:
          - type: paragraph
            body: >-
              AI21 的正确可比组合应是混合的，而不是纯粹同类。Palantir、Snowflake、Salesforce 和 C3.ai 展示了公募市场在信任、规模和增长的不同组合下，愿意为 AI
              赋能企业软件和数据基础设施支付什么价格。这些倍数高度分散，重点恰在这里：没有收入披露时，AI21 可以合理映射到不止一种公开市场结果。同时，Writer、Mistral
              等私募可比对象说明，企业工作流平台与前沿模型稀缺性之间存在巨大溢价差。AI21 位于中间。它比许多应用层同业拥有更真实的技术深度，但缺少推动前沿实验室估值的市场叙事和可见规模。最清晰的解读是：相对较薄的企业 AI
              应用，AI21 应得到一定溢价；但在收入耐久性可见之前，相对最受追捧的前沿模型公司和上市 AI 公司，也应有明显折价。因此，当前标记可争辩，但对新投资者并不明显慷慨。
