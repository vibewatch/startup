      - number: '8.2'
        title: 变现界面与客户证据
        blocks:
          - type: paragraph
            body: >-
              公开定价和客户证据支持真实业务存在，但还不足以承销一个完整增长引擎。独立定价聚合器显示，AI21 有分层 token
              定价阶梯，从便宜的小模型用量到更高端的大模型定价。这能让投资者相信，多个工作负载上存在变现，尤其再叠加私有化部署和企业销售定位。可是这些页面不能替代已签约企业经济性；它们展示 AI21
              如何收费，而不是客户实际花多少钱、是否大规模续约。客户证据同样混合。Fnac Darty 和 Ubisoft 是可信的具名部署，Google Cloud 加 Intercom 则显示 AI21
              有足够运营体量，同时支撑企业和 B2C 界面。但公开客户集仍小，Wordtune 评论凸显广泛产品使用与耐久企业合同价值之间的差异。由此产生的估值含义是：AI21 应该比概念期 AI
              创业公司获得更多信用，但还拿不到一个透明复利软件公司的自动倍数溢价。
