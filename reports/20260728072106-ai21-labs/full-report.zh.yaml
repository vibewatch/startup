      - number: '7.4'
        title: 财务、客户与投资假设破裂风险
        blocks:
          - type: paragraph
            body: >-
              客户风险和财务风险在 AI21 身上紧密绑定，因为公司最强的企业证据仍然相对有限。Fnac Darty、Ubisoft 和少数可见案例显示出潜力，但还没有证明深厚续约历史或广泛成熟生产账户基础。Wordtune
              的公开评论也显示一个普通但真实的风险：客户支持摩擦、账单挫败或质量波动，会侵蚀公司最广用户界面的品牌信任。上市公司可比对象进一步说明，AI 平台业务往往在成熟很久后仍背负长销售周期、治理开销和集中度风险。


              这些风险直接导向破坏投资假设的触发点。若灯塔部署无法扩张，若重置后支持质量恶化，或新监管要求显著拖慢部署，AI21 的窄战略楔子就更难守住。严重安全事件或信任叙事自相矛盾会更糟，因为 AI21
              的市场故事更依赖经过验证、可控的 AI，而不是单纯的基准领先。公开证据因此支持一种风险意识明确的投资姿态：AI21 并不明显不安全或不稳定，但几项最重要主张仍需私有尽调，才能从愿景变成可承销事实。
