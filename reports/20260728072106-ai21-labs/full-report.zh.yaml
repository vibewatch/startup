    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Selected public and private comparables relevant to enterprise AI software, agent platforms, and frontier-model
        valuation context. Excludes many private startups with no reliable revenue or valuation disclosure.
