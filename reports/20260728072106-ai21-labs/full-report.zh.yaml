      - number: '2.4'
        title: 采用约束及其对 AI21 的影响
        blocks:
          - type: paragraph
            body: >-
              同一组让市场有吸引力的证据，也解释了为什么公司的 GTM 会很难。Polaris 将计算成本、隐私担忧、幻觉风险、偏见和监管列为 LLM 市场的核心摩擦。Deloitte 强调治理不成熟、基础设施缺口、数据问题和
              AI 技能短缺。McKinsey 补充说，尽管实验广泛，多数组织的企业级 EBIT 影响仍有限；Anthropic 展示了强 ROI 潜力，但也明确表明真正跨职能部署仍处早期。AI21
              自己的市场教育文章也呼应这一点：大量 GenAI 项目从未进入生产，企业仍在依赖「prompt and pray」或脆弱的硬编码链。


              对 AI21 来说，这些约束两面切。一面是逆风：销售周期变慢、价值证明负担加重，新供应商阻力更大。另一面，它们也解释了公司为何收窄到 Maestro
              和私有企业系统：如果市场问题不是单纯模型访问，而是可靠部署，那么价值会迁移到编排、控制和集成。风险在于，云巨头、应用软件厂商和内部平台团队现在都看到了同一个机会。因此，AI21
              只有证明自己的控制平面命题比超大规模云厂商和企业 AI 平台快速改进的替代方案更容易部署、更容易治理、更具成本效益，才能从市场复杂性中受益。
