      - - 信心
        - 中低，因为估值靠推断的收入质量支撑，而不是已披露经营数据
        - 低至中
        - 没有数据室证据，不要按溢价倍数定价
      - - 当前估值看法
        - 可见 $1.4B 附近大致合理到略贵
        - 中
