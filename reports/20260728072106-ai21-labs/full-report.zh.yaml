  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序概览
        blocks:
          - type: paragraph
            body: >-
              AI21 的风险不是单一灾难性问题主导，而是多层暴露：法律和监管义务、运营执行、合作伙伴依赖，以及重组后的人才风险相互叠加。叠加关系很关键，因为 AI21
              已经不再只靠研究新颖性争胜。它卖的是企业场景里的可靠结果；一旦失败，可能引发采购阻力、客户不信任或扩张延后。在这种环境下，治理和交付风险可能比错过一个基准里程碑更伤。


              公开证据显示，严重度最高的风险包括：第一，AI21 能否在治理预期收紧下安全、可重复地运行高风险 AI 工作流；第二，2026
              年后更窄的组织是否仍能支撑支持、实施和路线图连续性；第三，合作伙伴和平台依赖是否带来摩擦或战略脆弱性。排序更低但仍重要的风险包括 Wordtune
              的消费者支持摩擦、可见企业证据仍然较少带来的集中度风险，以及合规开销可能比收入质量扩张更快。
            claimRefs:
              - CR001
              - CR010
              - CR014
              - CR015
