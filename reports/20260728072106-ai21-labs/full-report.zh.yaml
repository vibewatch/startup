  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入触点与变现栈
        blocks:
          - type: paragraph
            body: >-
              AI21 的收入架构比「LLM 公司」这个单一标签更宽。消费者端，Wordtune 是低门槛免费进入的写作产品，公开使用量很大，可能既贡献直接订阅收入，也充当品牌漏斗顶端。开发者层，AI21 维护模型和 API
              文档，暗示通过 Studio、Jamba 及相关服务按用量变现。企业层，公司推广 AI21 托管、VPC、单租户和本地部署等部署选择——这些更像交易型销售动作，而不是自助 SaaS。最后，Maestro
              被定位为更高价值的优化和编排层，试图卖的不只是模型输出，而是成本控制、验证和执行可靠性。


              这套栈在战略上有用，因为它给 AI21 不止一条收入路径，但也让财务分析更复杂。Wordtune
              指标突出采用度，而不是转化。开发者侧材料暗示按用量变现，但公开实际单价不清楚。企业部署意味着更大合同，但没有公开积压订单或合同价值披露。若买方把编排视为控制平面预算，Maestro
              可能带来最强经济上行；但公开证据仍更多是潜力，而不是已兑现收入证明。实际情况是，AI21 似乎在多条赛道变现，同时要求投资人接受每条赛道相对贡献和质量上的高度不透明。
