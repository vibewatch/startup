  - id: TV005
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 经营假设
      - 隐含估值看法
      - 投资者解读
    rows:
      - - 牛
        - Maestro 在多个垂直场景可复制；收入质量证实较强；披露改善
        - ~$1.6B-$1.8B+
        - 当前估值看起来合理，甚至可能略有吸引力
      - - 基准
        - 转型跑通，但增长验证和披露仍不完整
        - ~$1.1B-$1.5B
        - 当前估值站得住，但并不明显便宜
      - - 熊
        - 客户验证仍薄；留存或集中度不及预期；重置后交付深度显弱
        - ~$0.6B-$0.9B
        - 当前估值会显得过高，容易被下调
      - - 延展上行
        - AI21 证明自己是更广的可信 agent 平台，且扩张可被清晰引用
        - ~$2.0B+
        - 需要比当前公开信息好得多的披露和证据
      - - 压力下行
        - 重大客户或执行失误把 AI21 压窄成小众软件结局
        - < $0.6B
        - 很可能触发降价轮或严重二级折价
    notes: 这些区间是情景启发式估算，来自公开可比公司、可见定价、客户验证，以及缺少已披露财务输出这一事实。
