      - number: '2.3'
        title: 规模测算视角与增长驱动
        blocks:
          - type: paragraph
            body: >-
              需要多个规模测算视角，因为没有单一公开数字能精准对应 AI21 的目标切入点。宽口径一侧，Polaris 估算北美 LLM 市场 2025 年占 42% 收入份额，并强调软件和服务仍在增长，BFSI
              等受监管垂直行业 CAGR 达 36.3%。Axis Intelligence 综合多家分析机构后，将 2026 年 AI 智能体市场放在约 $10.9B 到 $11.8B，并引用 Gartner 预测：到
              2026 年底，40% 的企业应用将嵌入任务特定智能体。这些数字覆盖范围不同——LLM
              市场定义常包含更宽的软件和服务收入，智能体估算更聚焦于编排和自主工作流——但合起来说明，支出池已经达到数十亿美元级，并仍在快速复利。


              真正的增长驱动不是消费者迷恋聊天机器人，而是重文档企业重做工作流。McKinsey 称，高绩效企业重做的是工作流，而不只是提示词；Anthropic 报告称，超过半数组织已经为多阶段工作流部署智能体，80%
              表示投资已带来可衡量 ROI。AI21 最适配的是长上下文、私有部署和验证都重要的场景——金融、医疗、国防、合规、客服和知识工作。这是比广义全球 AI 市场更窄的
              SAM，但吸引力在于预算绑定人工替代、周期压缩、可审计性和避免错误成本，而不只是新鲜感。
