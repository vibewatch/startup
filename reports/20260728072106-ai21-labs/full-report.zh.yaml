  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接、邻近和替代竞争者
        blocks:
          - type: paragraph
            body: >-
              AI21 的竞争版图比典型的「哪个基础模型最好？」框架更宽。公司直接承受销售 API
              和企业合同的模型供应商压力；邻近压力来自把治理和自动化打包的企业工作流平台；替代压力来自更愿意用通用智能体框架和开源模型自建的客户。OpenAI 和 Anthropic 在高端智能体层压得最紧；Google
              借更广生态分发延伸这种压力；Writer 和 Cohere 攻工作流 / 治理层；Mistral 和开放生态用价格和模型选择施压；内部自建栈则让多归属可行，从而限制供应商锁定。


              这很重要，因为买方不必只选一种替代方案。受监管企业可以用 OpenAI 或 Anthropic 获取模型访问，用 Writer 做品牌化工作流自动化，用 LangChain 自定义搭建，再用 Mistral 或
              Together 托管模型处理成本敏感或可检查负载。因此，AI21 的真实竞争是一组分层决策：买控制平面、买模型套件、买工作流平台，还是自建栈。最危险的竞争力量不是某一家公司正面击败
              AI21，而是这些选择组合在一起，从多个方向同时压缩 AI21 的切入空间。
