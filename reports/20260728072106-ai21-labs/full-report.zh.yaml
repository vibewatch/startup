      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              AI21 的公开政策和风险环境说明，隐私、法律暴露和 AI 治理都是核心业务问题。隐私政策承认会处理多类内容和互动数据，包括提示词和上传文档，同时提到 GDPR、CCPA
              和传输机制。网站条款对网站使用设置了宽泛免责声明和较低责任，这很常见，但也说明企业客户需要单独审查合同，才能看清围绕服务可用性、安全和赔偿责任的实际风险分配。与此同时，NIST 持续演进的 AI RMF
              profiles，以及 AI Act 的落地路径，说明 AI21 所在市场里的治理预期正从抽象最佳实践变成流程现实。


              并不是说 AI21 相比同业异常暴露；真正含义是，公司躲不开严肃企业 AI
              供应商的正常负担。公开缓释措施是真实的：认证、参与安全政策、私有化部署选项，以及治理优先的叙事。但剩余风险仍然显著，因为公开材料没有披露完整事故历史、合同条款或审计结果。AI21 主打经过验证、高信任的 AI
              工作流，若公开信任信号与实际运营实践不匹配，杀伤力会尤其大。
            claimRefs:
