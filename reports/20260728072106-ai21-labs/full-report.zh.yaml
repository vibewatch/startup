companyProfile:
  summary: >-
    AI21 Labs 是一家总部位于特拉维夫的私营 AI 公司，2017 年由 Ori Goshen、Yoav Shoham 和 Amnon Shashua 创办。公司最初做基础模型和写作工具，后来收缩成围绕 Maestro
    编排、Jamba 系列模型、私有化部署，以及仍然庞大的 Wordtune 用户触达面的企业 AI 系统叙事。现有公开证据显示，AI21 更像一家正在战略重置的后期非上市企业 AI 平台，而不是平滑复利增长的前沿模型龙头。
