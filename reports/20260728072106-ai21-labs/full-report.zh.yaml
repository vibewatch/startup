  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品触达面与模块图
        blocks:
          - type: paragraph
            body: >-
              AI21 的公开产品触达面现在更像企业栈，而不是单一应用。最上层，Wordtune 仍是大众写作产品，但 AI21 当前叙事明显更聚焦企业系统。Jamba 是模型系列和长上下文引擎；Studio
              和公开文档构成开发者访问层；部署选项支持私有或自托管企业实施；Maestro
              则位于模型层之上，是服务多步骤智能体工作流的编排和优化框架。各模块彼此独立，但显然被设计成协同工作：检索或摄取数据、规划工作流、路由到模型或工具、验证输出，并追踪发生了什么。


              这套集成栈是优势，因为它让 AI21
              可以在系统行为上竞争，而不只是比模型分数。它也意味着买方不必把「AI21」只当模型供应商或只当应用厂商。代价是复杂度。每增加一层——模型架构、编排、检索、部署和信任控制——都扩大了生产环境中必须可靠运转的环节。公开材料把这套栈讲清楚了，但也暗示公司试图一次性交付很多基础设施。
