      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人质量是 AI21 Labs 最清晰的优势之一。公开的一手和独立来源都一致指向三位创始人：Ori Goshen、Yoav Shoham 和 Amnon Shashua。Business Wire 和
              TechCrunch 将 Shoham 描述为 Stanford 名誉教授、曾与 Google 有渊源；Goshen 是有 Crowdx 经历的连续创业者；Shashua 是 Mobileye 创始人，后者曾被
              Intel 收购、之后又回到公开市场。官方关于页面进一步强化了 Shoham 的学术和 Google 背景，以及 Goshen 的运营履历。这组创始人给 AI21
              带来以色列创业公司里少见的科学可信度，也解释了为什么公司早期能吸引顶级战略投资人。


              领导层集中也是风险。公司公开材料高度突出 Goshen 和 Shoham，多篇新闻报道则借 Shashua
              的声誉和网络来解释公司的战略决策。官网披露了知名学术顾问，但没有给出清晰公开的董事会名单或充分治理细节；经历 2025–2026 年动荡后，投资人能看到的监督机制有限。AI21
              战略已经实质变化：大幅裁员、停止单独模型销售，并转向 Maestro 主导的商业化，因此这种不透明更重要。创始人组合仍是重大资产，但公开治理披露不足、对少数高知名度领导者依赖，都应进入实质尽调事项，而不是脚注。
