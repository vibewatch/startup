            body: >-
              最具体的公开牵引信号是 Wordtune：AI21 称该产品拥有超过 1000 万用户、数亿条改写建议被选用、Chrome
              扩展评分强，并提供免费注册路径。这些数据重要，因为它们证明产品触达很广；但离投资承销真正需要的指标还很远——付费转化、净收入留存、ARPU 或消费者毛利率。企业侧材料呈现不同动态。AI21
              强调部署灵活性、安全姿态和定制工作流，都指向顾问式销售。但与 OpenAI、Anthropic、Mistral、Writer 等至少披露部分定价信号的公开同行不同，AI21
              的主要企业页面仍把买方导向销售主导的互动，没有清晰暴露标价经济性。


              这种不透明意味着，正确比较不是「AI21 有没有定价」，而是「它想捕获哪种经济性」。Maestro 叙事指向工作流 ROI 话术：降低成本、提升准确率、让执行更可预测。如果这个故事落地，AI21 可以避开纯
              token 价格战。如果落不下去，公开市场越来越强调竞争对手可见定价就会成为问题，因为外部观察者看不清 AI21 赢在产品价值、折扣，还是定制服务。GTM 含义是，AI21 很可能把企业 AI
              当作高上下文解决方案销售，而不是干净的自助软件年金。
