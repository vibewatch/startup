  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与客户触达面
        blocks:
          - type: paragraph
            body: >-
              AI21 的客户基础最好理解成三块相互重叠的触达面，而不是一个同质群体。第一，Wordtune 通过浏览器扩展、网页编辑器和免费增值式引导，服务庞大的准专业用户和 SMB
              式人群。评测来源和产品页面显示，这批人包括写邮件和商务内容的专业人士、学生和学者、营销与内容创作者，以及需要语气和流畅度帮助的非母语英语用户。第二，AI21
              有使用其模型和私有部署能力的开发者与平台受众。第三，公司正试图通过 Maestro、私有 AI 和垂直编排赢得企业工作流预算。


              这种分层很重要，因为各分层的证明标准不同。Wordtune
              生成了强公开产品使用和满意度证据，但变现质量证据弱。企业部署能提供更丰富的案例细节，但具名样本少得多。开发者和私有部署买方出现在基础设施和合作伙伴材料里，但其收入重要性没有公开披露。因此，客户画像宽但不均：漏斗顶端能见度高，企业侧证明令人鼓舞但选择性强，不同分层如何转成耐久收入的数据有限。
