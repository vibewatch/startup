chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              AI21 Labs 对外呈现的是企业 AI 系统和基础模型公司，而不是单一产品应用厂商。官网、关于页面、Jamba 页面、Maestro 页面、开发者文档以及 Wordtune
              资产共同显示，公司组合覆盖专有模型开发、API 访问、企业部署和大规模消费级写作入口。商业化路径上，公司先推 Wordtune，再面向开发者推出 AI21 Studio，之后以 Jamba
              作为开放模型系列，最后用 Maestro 做生产智能体的更高层编排层。这个顺序对尽调重要：AI21 一直在尝试沿价值栈上移，从 AI 功能爬到企业工作流基础设施。


              当前商业模式看起来分成两端：面向企业销售的软件，以及通过 Wordtune 承接的大规模消费者漏斗。Wordtune 仍是公司公开可见的最强牵引面；当前网站称用户超过 1000 万、被选用的改写建议达 7.82
              亿条，并支持 10 种翻译语言。企业侧强调长上下文模型部署、私有或自托管选项，以及智能体可靠性。这种组合既带来分散性，也带来复杂度：AI21 不是纯实验室，不是纯应用公司；2026
              年转向后，也不再只是简单模型供应商。最准确的当前描述是：一家后期非上市企业 AI 公司，正尝试把研究深度和过去的产品广度，转换成更窄但价值更高的智能体平台命题。
