- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Reliability-first orchestration
    - OpenAI, Anthropic, Writer, and internal build all add workflow execution and validation
    - High
    - If orchestration becomes table stakes, AI21 loses category distinctiveness
    - Demand proof of materially better accuracy or deployment speed
  - - Model neutrality and routing
    - Larger vendors may add enough routing or multi-model support themselves
    - Medium-high
    - Neutrality matters only if customers keep multiple vendors in production
    - Measure real customer multi-model usage and switching behavior
  - - Long-context efficiency
    - Competitors market large context and long-horizon tasks too
    - Medium
    - Speed gains matter only when tied to business outcomes
    - Quantify latency, cost, and accuracy advantages on enterprise tasks
  - - Private enterprise trust
    - Cohere, Writer, OpenAI, and Google all market governance and security
    - High
    - Trust alone may not differentiate if every vendor says the same thing
    - Show auditability, approvals, and integration outcomes with references
  - - Open-model bridge
    - Mistral, Together, and internal build make model choice easier everywhere
    - Medium-high
    - Open ecosystems can commoditize the routing story
    - Prove AI21 adds value above basic model-switching and gateway logic
  - - Distribution via enterprise wedge
    - Hyperscalers and business-suite vendors already have installed-base leverage
    - High
    - Distribution power can beat product nuance in buying cycles
    - Identify segments where AI21 wins despite not owning the broader suite
  notes: Severity reflects the risk to AI21’s current strategic wedge as of the 2026 market state rather than the probability of outright product failure.
