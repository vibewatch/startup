    - Keeps commodity model layer under pricing pressure
  - - AI21
    - Custom enterprise motion with Wordtune, Jamba, and Maestro surfaces
    - Routing, private deployment, long context, reliability
    - Public list pricing is limited for core enterprise surfaces
    - Must defend higher-value orchestration, not raw tokens
