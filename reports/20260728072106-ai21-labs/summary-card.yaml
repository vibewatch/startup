      Public revenue, NRR, churn, customer concentration, gross margin, and cap-table terms remain undisclosed, making
      the valuation thesis inference-heavy.
    - >-
      The 2026 layoffs and failed Nebius process confirm execution risk and reduce confidence that a smaller
      organization can scale enterprise delivery smoothly.
    - >-
      Public customer proof is meaningful but still narrow, so a few lighthouse accounts may be doing too much work in
      the current story.
    - >-
      AI21 does not command the scarcity premium of frontier labs, so a $1.4B+ mark can look full if enterprise revenue
      and retention are weaker than expected.
