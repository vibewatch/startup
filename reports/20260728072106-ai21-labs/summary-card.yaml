  topStrengths:
    - >-
      AI21 combines strong founders, credible research pedigree, and a sharper enterprise product wedge than many AI
      startups that only expose a thin application layer.
    - >-
      Maestro, Jamba, and private deployment give the company a differentiated enterprise-AI story that is more
      defensible than generic model-access reselling.
    - >-
      Public customer proof from Fnac Darty, Ubisoft, Google Cloud, and Intercom shows the company is operating beyond
      prototype stage.
    - >-
      The visible valuation band is still within the broader unicorn range rather than at distressed levels, suggesting
      the market has not written off the business after the 2026 reset.
  topRisks:
