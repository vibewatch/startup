chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              AI21 Labs presents itself as an enterprise AI systems and foundation-model company rather than a
              single-product application vendor. Official surfaces across the homepage, about page, Jamba page, Maestro
              page, developer documentation, and the Wordtune property show a portfolio that spans proprietary model
              development, API access, enterprise deployment, and a large consumer writing surface. Historically, the
              company commercialized Wordtune first, then AI21 Studio for developers, then Jamba as its open-model
              family, and finally Maestro as a higher-level orchestration layer for production agents. That sequence
              matters for diligence because it shows repeated attempts to climb the value stack from AI features to
              enterprise workflow infrastructure.


              The current business model appears bifurcated between software sold to enterprises and a scaled consumer
              funnel through Wordtune. Wordtune remains the company’s best public traction surface, with the current
              site claiming 10 million-plus users, 782 million rewrite suggestions chosen, and support for ten
              translation languages. Enterprise surfaces emphasize long-context model deployment, private or self-hosted
              options, and agent reliability. That mix creates both diversification and complexity: AI21 is not purely a
              lab, not purely an application company, and no longer acting as a simple model vendor after the 2026
              pivot. The most accurate current description is a late-stage private enterprise-AI company that is trying
              to convert research depth and prior product breadth into a narrower, higher-value agent platform thesis.
