      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: AI21 is easier to underwrite as a trusted enterprise-AI wedge than as a frontier-model winner
            body: >-
              The public evidence now points investors toward an enterprise control-plane story: Maestro orchestration,
              Jamba as enabling technology, and private deployment for complex customers. That framing is more
              investable than a diffuse foundation-model ambition, but it also caps how much scarcity premium the market
              should award before revenue quality is proven.
            calloutType: insight
            claimRefs:
              - CV004
              - CV005
