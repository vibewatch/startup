      - number: '8.3'
        title: Comparable company analysis and fair-value framing
        blocks:
          - type: paragraph
            body: >-
              The right comparable set for AI21 is blended, not pure. Palantir, Snowflake, Salesforce, and C3.ai show
              what public markets pay for AI-enabled enterprise software and data infrastructure under very different
              combinations of trust, scale, and growth. Those multiples are highly dispersed, which is exactly the
              point: without revenue disclosure, AI21 can plausibly map to more than one public outcome. At the same
              time, private comparables such as Writer and Mistral illustrate the huge premium gap between enterprise
              workflow platforms and frontier-model scarcity. AI21 sits in the middle. It has more real technical depth
              than many application-layer peers, but it lacks the market narrative and visible scale that drive
              frontier-lab valuations. The cleanest interpretation is that AI21 deserves some premium to thinner
              enterprise AI apps, but also a meaningful discount to the most celebrated frontier and public AI names
              until revenue durability becomes visible. That keeps the current mark arguable, but not obviously generous
              to new investors.
            claimRefs:
              - CV020
