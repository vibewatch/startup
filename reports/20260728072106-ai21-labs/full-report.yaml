      - number: '3.2'
        title: Capability and pricing comparison
        blocks:
          - type: paragraph
            body: >-
              AI21’s direct product comparison is strongest when the buyer values reliability, routing, and structured
              execution rather than only a single model’s benchmark standing. AI21 markets Maestro as model-agnostic and
              centered on planning, validation, and cost-aware orchestration, while Jamba supports its long-context and
              private-deployment story. That positioning stands apart from OpenAI and Anthropic, which market powerful
              general-purpose agents and enterprise workspaces; Writer, which packages agentic workflow execution with
              governance and brand controls; Cohere, which stresses private enterprise AI and managed model hosting;
              Mistral, which offers open-weight flexibility and comparatively low list prices; and Google, which
              competes on multimodal breadth and ecosystem reach.


              Published pricing highlights the strategic problem for AI21. OpenAI offers a relatively low-friction seat
              entry point for businesses. Anthropic publicly prices Sonnet 5 at a competitive token rate for scaled
              agentic work. Mistral posts very low API pricing on several models. Cohere, Writer, and enterprise bundles
              tilt less toward simple token comparison and more toward platform contracts, but the signal is still
              clear: raw model access is being commoditized while workflow and governance value is getting bundled. AI21
              must therefore prove that its orchestration layer creates enough accuracy, traceability, and deployment
              leverage to justify vendor adoption on top of increasingly affordable alternatives.
