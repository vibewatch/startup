  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis, anti-thesis, and valuation context
        blocks:
          - type: paragraph
            body: >-
              AI21 should not be valued as if it were still trying to win the global frontier-model race outright. The
              public evidence now points to a narrower but more investable thesis: a well-funded Israeli AI company with
              strong founders, meaningful research assets, and a more enterprise-focused control-plane story built
              around Maestro, Jamba, and private deployment. That is a better business shape than a generic model lab
              with no workflow wedge, but it is also a more constrained one. The strategic reset in 2026 matters because
              it shows management was willing to narrow focus after broader ambitions and acquisition talks did not play
              out as hoped. Investors therefore get a company that looks more disciplined, but also one that has already
              used up part of its strategic flexibility. The anti-thesis is straightforward: if Maestro remains a
              compelling narrative rather than a repeatable expansion engine, then today’s unicorn mark will look like a
              full price for a smaller, more execution-dependent enterprise AI vendor rather than for a breakout
              platform.
            claimRefs:
              - CV001
