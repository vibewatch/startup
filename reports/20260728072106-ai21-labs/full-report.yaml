      - number: '8.4'
        title: Scenario analysis, diligence blockers, and verdict
        blocks:
          - type: paragraph
            body: >-
              A scenario-based approach is the only credible public-market discipline for AI21 at this stage. The bull
              case assumes Maestro becomes a repeatable control-plane product that expands beyond a few lighthouse wins,
              converting technical credibility into multi-account enterprise revenue and cleaner disclosure. The base
              case assumes the pivot works well enough to preserve the unicorn mark, but only just: AI21 proves
              enterprise relevance without yet producing enough transparency to merit a sharp premium. The bear case
              assumes the company remains operational and technically relevant, yet still fails to broaden public proof,
              exposes weak retention, or shows that the smaller post-reset organization cannot sustain enterprise
              delivery. Under that lens, a fair-value band of roughly $0.9B to $1.8B is reasonable from public evidence,
              with today’s visible mark near the middle rather than at a bargain entry. That leads to a WATCH
              recommendation. Investors should not write AI21 off, but they should demand revenue, retention,
              concentration, and cap-table proof before upgrading conviction.
            claimRefs:
              - CV018
