      - number: '3.3'
        title: Distribution power, lock-in, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              AI21’s hardest competitive challenge is distribution, not simply model quality. OpenAI, Google, and
              Anthropic all benefit from either enormous user familiarity, cloud placement, or ecosystem presence that
              lowers buyer-friction before a formal bake-off even begins. Writer and Cohere approach the problem from a
              different angle: they sell governance, connectors, managed deployment, and business-process outcomes in
              packages that look easier to buy than a narrower orchestration-led story. Internal-build teams complicate
              the picture further, because frameworks like LangChain let sophisticated customers own the workflow layer
              themselves and swap external models beneath it.


              That dynamic weakens straightforward lock-in and increases multi-homing. Buyers can route sensitive
              workloads to one provider, branded content to another, low-cost experiments to open models, and custom
              business logic to internal tools. AI21 tries to turn that fragmentation into an advantage by marketing
              Maestro as a control plane across model origins. But the same buyer logic can also reduce switching costs
              away from AI21 if orchestration and observability become standard features elsewhere. AI21’s opportunity
              is therefore to become the neutral coordination layer inside a multi-vendor world; its risk is that larger
              vendors make neutrality unnecessary by bundling enough of the same functionality into already-approved
              suites.
