      - number: '4.2'
        title: Public traction, pricing, and GTM proxies
        blocks:
          - type: paragraph
            body: >-
              The most concrete public traction signal is Wordtune: AI21 states that the product has more than 10
              million users, hundreds of millions of rewrite suggestions chosen, a strong Chrome-extension rating, and a
              free signup path. Those datapoints matter because they demonstrate broad product reach, but they stop well
              short of the metrics that would matter for investment underwriting — paid conversion, net revenue
              retention, average revenue per user, or consumer gross margin. The enterprise surfaces show a different
              dynamic. AI21 emphasizes deployment flexibility, security posture, and custom workflows, which all point
              toward consultative selling. Yet unlike OpenAI, Anthropic, Mistral, Writer, and other public peers that
              reveal at least partial pricing signals, AI21’s main enterprise pages still route buyers toward sales-led
              engagement and do not expose list economics clearly.


              That opacity means the right comparison is not “does AI21 have any pricing?” but “what kind of economics
              is it trying to capture?” The Maestro narrative suggests a workflow-ROI pitch: lower cost, better
              accuracy, more predictable execution. If that story lands, AI21 can avoid a pure token-price race. If it
              does not, then the public market trend toward visible competitor pricing becomes a problem, because
              outside observers cannot tell whether AI21 is winning on product value, discounting, or custom services.
              The GTM implication is that AI21 is likely selling enterprise AI as a high-context solution rather than as
              a clean self-serve software annuity.
