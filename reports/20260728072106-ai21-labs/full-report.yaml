  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct, adjacent, and substitute competitors'
        blocks:
          - type: paragraph
            body: >-
              AI21’s competitive landscape is broader than a typical “which foundation model is best?” frame. The
              company faces direct pressure from model vendors selling APIs and enterprise contracts, adjacent pressure
              from enterprise workflow platforms that package governance and automation, and substitute pressure from
              customers who would rather build with general agent frameworks and open-source models. OpenAI and
              Anthropic press hardest at the premium-agent layer; Google extends that pressure through broader ecosystem
              distribution; Writer and Cohere attack the workflow/governance layer; Mistral and open ecosystems press on
              price and model choice; and internal-build stacks limit vendor lock-in by making multi-homing viable.


              This matters because buyers are not forced to choose a single kind of alternative. A regulated enterprise
              can use OpenAI or Anthropic for model access, Writer for branded workflow automation, LangChain for custom
              build, and Mistral or Together-hosted models for cost-sensitive or inspectable workloads. AI21’s actual
              competition is therefore a layered decision: whether to buy a control plane, buy a model suite, buy a
              workflow platform, or build a stack. The most dangerous competitive force is the combination of these
              choices compressing AI21’s wedge from multiple directions at once rather than any one company defeating it
              head-on.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
