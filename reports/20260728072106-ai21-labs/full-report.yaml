      - number: '2.2'
        title: Buyer segments and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer base is enterprise-first and usually budgeted through technology, operations,
              knowledge-management, compliance, or customer-service owners rather than an isolated data-science lab.
              Deloitte and McKinsey both show that AI usage is now broad but still immature at production scale, which
              fits AI21’s messaging around trust and execution. Deloitte reports that worker access to AI rose 50% in
              2025 and that the number of companies with at least 40% of projects in production is expected to double in
              six months, but it also reports that only one in five companies has mature governance for autonomous
              agents. McKinsey similarly finds that 88% of organizations are using AI in at least one function while
              only around one-third have begun scaling AI across the enterprise.


              Those findings create a clear adoption path. Initial entry often starts in a high-friction but bounded
              workflow such as research, compliance review, document summarization, coding support, or internal
              knowledge retrieval. The first buyer is commonly a CIO, CTO, head of AI platform, chief data officer,
              customer-operations leader, or business-function owner with pain around accuracy, throughput, or labor
              cost. Expansion then depends on security review, connector quality, observability, and proof that the
              system can survive messy enterprise data. AI21’s products are designed for precisely that step-up from
              pilot to production, but the same deployment friction that creates demand also slows purchase velocity and
              expands procurement complexity.
