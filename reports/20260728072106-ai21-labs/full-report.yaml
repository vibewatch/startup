companyProfile:
  summary: >-
    AI21 Labs is a Tel Aviv–based private AI company founded in 2017 by Ori Goshen, Yoav Shoham, and Amnon Shashua. The
    company began as a foundation-model and writing-tools business, then evolved into a narrower enterprise AI systems
    story built around Maestro orchestration, Jamba-family models, private deployment, and the still-large Wordtune user
    surface. Public evidence now suggests AI21 is best understood as a late-stage private enterprise-AI platform
    undergoing a strategic reset rather than as a smoothly compounding frontier-model leader.
