              - CV030
          - type: callout
            title: The missing numbers matter more than the exciting product story
            body: >-
              AI21 may deserve its unicorn mark, but no public source in the retained set proves the revenue, NRR,
              concentration, or cap-table terms needed to make that conclusion high confidence. At the latest visible
              valuation, uncertainty is the main reason to wait rather than to chase.
            calloutType: risk
