  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              AI21’s risk stack is not dominated by a single catastrophic issue. Instead, it is a layered exposure where
              legal and regulatory obligations, operational execution, partner dependencies, and post-restructuring
              people risk interact with each other. That interaction matters because AI21 is no longer trying to win
              only on research novelty. It is selling dependable outcomes in enterprise contexts where failures can
              trigger procurement friction, customer distrust, or delayed expansion. In that environment, governance and
              delivery risks can be more damaging than missing a benchmark milestone.


              The public evidence suggests the highest-severity risks are: first, whether AI21 can safely and repeatably
              operate high-stakes AI workflows under tightening governance expectations; second, whether a narrower
              post-2026 organization can still deliver support, implementation, and roadmap continuity; and third,
              whether partner and platform dependencies create friction or strategic vulnerability. Lower-ranked but
              still material risks include consumer support friction on Wordtune, concentration risk from a still-small
              set of visible enterprise proofs, and the possibility that compliance overhead expands faster than revenue
              quality.
            claimRefs:
              - CR001
              - CR010
              - CR014
              - CR015
              - CR024
              - CR025
              - CR032
              - CR042
