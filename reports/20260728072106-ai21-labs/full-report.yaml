  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              AI21 Labs does not operate in one clean market box. The relevant demand pool sits at the intersection of
              enterprise LLM software, private AI deployment, and AI-agent orchestration for knowledge-intensive
              workflows. Official AI21 materials consistently describe this in workflow rather than benchmark terms:
              private AI for regulated data, long-context models for document-heavy work, and Maestro for planning,
              validation, routing, and cost control across multi-step tasks. That means the company competes not only
              with foundation-model vendors, but also with workflow platforms, internal build stacks, and the status quo
              of human analysts stitching together search, spreadsheets, documents, and ticketing systems.


              This boundary matters because broad AI market numbers can easily overstate what AI21 can actually sell
              into. Included spend should cover model access, orchestration, governance, private deployment, document
              processing, and integration tooling used by enterprise IT and line-of-business teams. Excluded spend
              should cover commodity GPU infrastructure, generic consumer chatbots, AI hardware capex, and professional
              services revenue that does not create reusable software control planes. Status-quo substitutes remain
              strong: many enterprises still solve the same job with analysts, contact-center agents, consultants,
              manual review teams, and homegrown automation. AI21’s market is therefore large enough to matter but
              narrow enough that production proof, compliance posture, and workflow fit decide outcomes more than
              abstract AI excitement.
