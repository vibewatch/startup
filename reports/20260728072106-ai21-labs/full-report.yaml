      - number: '1.3'
        title: Funding history and scale
        blocks:
          - type: paragraph
            body: >-
              AI21 Labs has built one of the larger capital stacks among non-U.S. enterprise-AI startups, but the path
              is incremental rather than one giant round. TechCrunch reported a $64 million Series B in July 2022 at a
              $664 million valuation, with total capital raised then at $118.5 million. It later reported a $155 million
              Series C in August 2023 at a $1.4 billion valuation, bringing disclosed funding to $283 million, followed
              by a $53 million extension in November 2023 that lifted lifetime disclosed capital to $336 million while
              keeping the same valuation. Independent 2025 reporting from Calcalist and SiliconANGLE then described a
              $300 million Series D backed by Google and Nvidia, taking cumulative disclosed funding to about $636
              million.


              That capital history is strategically important because the investor mix is not only financial. Public
              reporting and official investor logos point to Google, Nvidia, Intel Capital, Samsung Next, Pitango,
              Walden Catalyst, Ahren, b2venture, SCB10X, Comcast Ventures, and other backers with meaningful ecosystem
              relevance. At the same time, the funding story is not cleanly triumphant. The last widely corroborated
              explicit valuation mark remains the 2023 $1.4 billion figure; several 2025 reports describe the Series D
              but stop short of documenting a newly priced valuation. For diligence, that means total raised is better
              supported than current mark-to-market valuation. The company has unquestionably secured deep backing, but
              public evidence leaves a real gap on whether the business preserved, expanded, or impaired that unicorn
              valuation through the 2025 raise and 2026 restructuring.
