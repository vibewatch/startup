    - RAG pipelines, search, ranking
    - Chunking, retrieval quality, and document linkage remain hard problems
  - - Deployment / infra layer
    - Runs in cloud, VPC, on-prem, or partner environments
    - Customer infra, NVIDIA NIM, AWS Bedrock
    - Integration and support load can slow rollout
