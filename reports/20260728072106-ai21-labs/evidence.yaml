evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-valuation
    missingEvidence: A primary or clearly attributed source stating the Series D valuation, if any re-pricing occurred in 2025.
    whyItMatters: >-
      The investment case and dilution history depend on whether AI21 preserved or reset its unicorn valuation in the
      latest round.
    diligencePath: Request the latest financing documents, cap table summary, or investor confirmation memo.
    relatedQuestionRefs:
      - QO012
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board roster and any committee or independent-director information.
    whyItMatters: Governance quality matters more after layoffs, a failed sale process, and a strategic pivot.
    diligencePath: Request a current board list and observer rights summary from management.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: ipo-intentions
    missingEvidence: Direct management guidance on IPO timing or whether capital-market plans were paused after the 2026 reset.
    whyItMatters: Exit timing affects expected holding period and valuation support.
    diligencePath: Ask management and major investors whether any IPO preparation work is active.
    relatedQuestionRefs:
      - QO027
  - type: missing-source
    severity: material
    topic: current-revenue
    missingEvidence: Current revenue, ARR, gross margin, and product-mix disclosure.
    whyItMatters: >-
      Without current financial disclosure, public evidence cannot determine whether Maestro meaningfully improves the
      company’s economics.
    diligencePath: Request a current KPI pack covering revenue by product, GM, burn, and backlog.
  - type: missing-source
    severity: minor
    topic: customer-count
    missingEvidence: A current enterprise customer count separated from consumer Wordtune users.
    whyItMatters: Named logos exist, but concentration and breadth remain unclear.
    diligencePath: Request a customer-segmentation slide with active paying logos and revenue concentration.
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table-coverage-to004
    missingEvidence: >-
      A fuller dated chronology covering additional governance, regulatory, and commercial milestones beyond the top
      public events retained here.
    whyItMatters: >-
      The chapter ships with the most decision-relevant milestones, but a full board-level diligence file would need a
      denser chronology.
    diligencePath: Ask management for the internal company timeline and board materials used during the 2025-2026 strategic review.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: ai21-sam-sizing
    missingEvidence: >-
      A direct public source isolating AI21’s exact serviceable market and attainable share within enterprise agent
      orchestration.
    whyItMatters: Broad AI TAM numbers can exaggerate addressable demand and distort valuation assumptions.
    diligencePath: Request management’s internal TAM/SAM/SOM model with assumptions by workflow, vertical, and geography.
    relatedQuestionRefs:
      - QM020
      - QM021
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-map-coverage
    missingEvidence: A fuller segmentation cut by geography, contract size, and implementation partner mix.
    whyItMatters: Budget owner and deployment path vary materially by region and procurement model.
    diligencePath: Ask for pipeline segmentation and average contract data by buyer cohort.
    relatedQuestionRefs:
      - QM012
      - QM024
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: minor
    topic: market-definition-table
    missingEvidence: Independent estimates that isolate pure orchestration/control-plane spend from general LLM software and services.
    whyItMatters: This would sharpen competitive positioning and entry discipline.
    diligencePath: Look for newer Gartner or IDC segmentation or private analyst notes.
    relatedTableRefs:
      - TM001
  - type: enumeration-incomplete
    severity: minor
    topic: sizing-lens-table
    missingEvidence: A tighter published range for secure enterprise orchestration budgets rather than broad AI-agent or LLM markets.
    whyItMatters: Sizing precision improves scenario discipline.
    diligencePath: Obtain analyst subscriptions or customer budget data from management.
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: win-loss-data
    missingEvidence: Public win-rate, renewal, or bake-off data versus OpenAI, Anthropic, Writer, and internal build.
    whyItMatters: Competitive posture cannot be fully underwritten without actual buying outcomes.
    diligencePath: Request recent competitive win-loss analysis and top-deal postmortems.
  - type: missing-source
    severity: material
    topic: pricing-realization
    missingEvidence: AI21 list or realized enterprise pricing for Maestro and Jamba in current large accounts.
    whyItMatters: Published competitor pricing is visible, but AI21’s effective economic position is still opaque.
    diligencePath: Request price books, sample contracts, and discount bands.
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-profile-table
    missingEvidence: A fuller set of vertical specialists and ERP-adjacent alternatives beyond the main classes listed here.
    whyItMatters: Some customer segments may face narrower but potent alternatives.
    diligencePath: Expand the competitor map during deal-specific diligence.
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: minor
    topic: switching-costs
    missingEvidence: Reference evidence on how often customers run AI21 alongside other model vendors in production.
    whyItMatters: Multi-homing can help or hurt AI21 depending on who owns the orchestration layer.
    diligencePath: Ask for named account architecture diagrams and retention cohorts.
    relatedQuestionRefs:
      - QP019
      - QP020
  - type: missing-source
    severity: material
    topic: current-arr-and-revenue
    missingEvidence: Current AI21 revenue, ARR, growth rate, and segment mix across Wordtune, model access, and Maestro.
    whyItMatters: Without real top-line figures, financial quality cannot be underwritten from public data alone.
    diligencePath: Request board pack or management accounts with monthly revenue bridge.
  - type: missing-source
    severity: material
    topic: gross-margin-and-burn
    missingEvidence: Gross margin, services mix, cash burn, and runway under the post-restructuring plan.
    whyItMatters: The difference between software economics and implementation-heavy economics is central to valuation.
    diligencePath: Request post-layoff operating model, headcount cost base, and 18-month runway plan.
  - type: missing-source
    severity: material
    topic: contract-quality
    missingEvidence: Top-customer concentration, ACV distribution, renewal rates, NRR/GRR, and pilot-to-production conversion.
    whyItMatters: Revenue durability matters more than product breadth at this stage.
    diligencePath: Request cohort analysis, top-20 customer table, and pipeline conversion data.
  - type: missing-source
    severity: minor
    topic: consumer-economics
    missingEvidence: Paid conversion, subscription mix, and retention for Wordtune.
    whyItMatters: The consumer surface could be either a profitable business or an expensive acquisition channel.
    diligencePath: Request Wordtune paid cohort and marketing efficiency metrics.
  - type: missing-source
    severity: minor
    topic: pricing-realization
    missingEvidence: Realized price books and discounting norms for Maestro, deployments, and model usage.
    whyItMatters: Opaque public pricing leaves uncertainty around actual monetization power.
    diligencePath: Request sample MSAs/order forms and current pricing policy.
  - type: missing-source
    severity: material
    topic: maestro-production-depth
    missingEvidence: >-
      Detailed public API references, production case studies, and operational benchmarks for Maestro beyond overview
      material.
    whyItMatters: Maestro is the strategic center of the stack, but public evidence is still lighter than the ambition.
    diligencePath: Request current API docs, customer architecture diagrams, and production outcome metrics.
  - type: missing-source
    severity: material
    topic: support-burden
    missingEvidence: Implementation effort, support staffing, and deployment complexity by customer segment.
    whyItMatters: A technically strong stack can still be hard to scale if support burden remains high.
    diligencePath: Request deployment timelines, services hours, and support SLAs by account tier.
  - type: missing-source
    severity: minor
    topic: incident-history
    missingEvidence: Longer-term reliability history and root-cause detail beyond the captured status-page snapshot.
    whyItMatters: Enterprise readiness depends on more than a live status page.
    diligencePath: Ask for internal uptime, incident, and MTTR reporting.
  - type: missing-source
    severity: minor
    topic: open-model-adoption
    missingEvidence: Direct download, production-use, or conversion data linking Hugging Face / GitHub activity to enterprise adoption.
