callouts:
- calloutType: strength
  title: Elite founder set still matters
  body: Few private AI startups combine Stanford AI leadership, repeat Israeli company-building experience, and the Mobileye network in one founding team. That founder-market fit helped AI21 attract strategic capital and remain relevant after its 2026 reset.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  - CO024
- calloutType: risk
  title: The 2026 pivot is a real reset, not a cosmetic reprioritization
  body: The company did not merely add Maestro to an expanding stack; it cut most staff, ended standalone model sales, and effectively admitted that model vending alone was not sustainable enough. That makes execution against the narrower wedge decisive.
  claimRefs:
  - CO025
  - CO026
  - CO027
  - CO035
  - CO038
