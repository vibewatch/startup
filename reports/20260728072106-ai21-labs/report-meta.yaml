companyProfile:
  summary: >-
    AI21 Labs is a Tel Aviv–based private AI company founded in 2017 by Ori Goshen, Yoav Shoham,
    and Amnon Shashua. The company began as a foundation-model and writing-tools business, then
    evolved into a narrower enterprise AI systems story built around Maestro orchestration,
    Jamba-family models, private deployment, and the still-large Wordtune user surface. Public
    evidence now suggests AI21 is best understood as a late-stage private enterprise-AI platform
    undergoing a strategic reset rather than as a smoothly compounding frontier-model leader.
  foundedDate: '2017-01-01'
  founders:
    - name: Ori Goshen
      role: Co-founder and co-CEO
      background: Repeat entrepreneur whose prior experience includes co-founding Crowdx.
      claimRefs: [CO003, CO006]
    - name: Yoav Shoham
      role: Co-founder
      background: Stanford professor emeritus and former Google principal scientist.
      claimRefs: [CO003, CO004]
    - name: Amnon Shashua
      role: Co-founder and chairman figure
      background: Mobileye founder and one of Israel's best-known AI and mobility entrepreneurs.
      claimRefs: [CO003, CO005]
  foundingLocation: Tel Aviv, Israel
  headquarters: Tel Aviv, Israel
  productSummary: >-
    AI21 sells enterprise AI systems centered on Maestro for planning, orchestration, validation,
    and optimization of AI agents; Jamba models for long-context and private deployment use cases;
    and Wordtune as its broadest end-user product surface.
  customerFocus: >-
    Enterprise teams running high-stakes knowledge workflows, private or regulated AI deployments,
    and organizations that want agent orchestration rather than only raw model access; Wordtune
    adds a broad prosumer and SMB writing audience.
  businessModel: >-
    Mixed monetization from usage-based model/API pricing, enterprise software and deployment
    contracts, private-environment implementations, and subscription-style end-user writing tools.
  stage: late-stage private
  fundingStatus: >-
    Public evidence still anchors AI21 on the 2025 $300M financing at roughly a $1.4B valuation,
    with cumulative disclosed funding around $636.9M. Mid-2026 private-market trackers imply the
    company still trades in roughly the same unicorn band, but current financing terms and
    preference structure are not public.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO022, CO025, CO027, CO029, CO033, CV001, CV002, CV005]

summary:
  headline: >-
    Track: AI21 has real technology, real customer proof, and a plausible Maestro-led wedge, but
    the latest visible unicorn mark offers too little public margin of safety for a higher-conviction
    recommendation.
  overallScore: 6.3
