  topStrengths:
    - >-
      AI21 combines strong founders, credible research pedigree, and a sharper enterprise product
      wedge than many AI startups that only expose a thin application layer.
    - >-
      Maestro, Jamba, and private deployment give the company a differentiated enterprise-AI story
      that is more defensible than generic model-access reselling.
    - >-
      Public customer proof from Fnac Darty, Ubisoft, Google Cloud, and Intercom shows the company
      is operating beyond prototype stage.
    - >-
      The visible valuation band is still within the broader unicorn range rather than at distressed
      levels, suggesting the market has not written off the business after the 2026 reset.
  topRisks:
    - >-
      Public revenue, NRR, churn, customer concentration, gross margin, and cap-table terms remain
      undisclosed, making the valuation thesis inference-heavy.
    - >-
      The 2026 layoffs and failed Nebius process confirm execution risk and reduce confidence that a
      smaller organization can scale enterprise delivery smoothly.
    - >-
      Public customer proof is meaningful but still narrow, so a few lighthouse accounts may be doing
      too much work in the current story.
    - >-
      AI21 does not command the scarcity premium of frontier labs, so a $1.4B+ mark can look full if
      enterprise revenue and retention are weaker than expected.
  unresolvedGaps:
    - Current ARR or revenue by segment, plus bookings / backlog bridge
    - NRR, churn, cohort retention, and top-customer concentration
    - Current cap table, liquidation preferences, and secondary overhang
    - Post-reset organization capacity for implementation, support, and solution architecture
    - Proof of Maestro expansion beyond the current public lighthouse set
    - Gross margin and burn profile after the strategic reset

