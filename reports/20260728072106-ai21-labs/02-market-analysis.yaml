callouts:
- calloutType: insight
  title: The deployment gap is the market
  body: AI21’s market is valuable precisely because adoption remains difficult. If enterprises already trusted off-the-shelf LLMs to run multi-step workflows without governance, routing, and validation, the need for Maestro-style systems would be much smaller.
  claimRefs:
  - CM006
  - CM009
  - CM012
  - CM013
  - CM040
- calloutType: risk
  title: Broad TAM slides overstate real opportunity
  body: Headline AI market numbers include software, services, and adjacent infrastructure that AI21 cannot capture directly. The investable question is the size and competitiveness of the secure enterprise orchestration wedge, not the size of AI in the abstract.
  claimRefs:
  - CM017
  - CM019
  - CM021
  - CM035
  - CM036
