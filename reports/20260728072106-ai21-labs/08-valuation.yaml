  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-revenue-and-arr
    missingEvidence: Current ARR or revenue bridge by product and customer segment.
    whyItMatters: Without revenue scale, valuation can only be framed as a scenario exercise.
    diligencePath: Request monthly ARR/revenue trend, segment mix, and bookings pipeline.
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: NRR, GRR, churn, cohort retention, and top-customer concentration.
    whyItMatters: These metrics determine whether the visible valuation reflects durable software economics or fragile lighthouse wins.
    diligencePath: Request cohort tables, renewal history, and top-10 customer concentration.
  - type: missing-source
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Full cap table, liquidation preferences, option pool, and secondary overhang.
    whyItMatters: Late-stage entry returns depend on terms as much as on the headline valuation.
    diligencePath: Request capitalization table and all preferred-stock rights.
  - type: private-evidence-only
    severity: material
    topic: post-reset-delivery-capacity
    missingEvidence: Current organization design and deployment staffing after the 2026 reset.
    whyItMatters: Enterprise execution depth is central to whether Maestro can scale beyond lighthouse deployments.
    diligencePath: Request org chart, solutions staffing ratios, and implementation backlog.
  - type: enumeration-incomplete
    severity: minor
    topic: TV004 comparable valuation framework coverage
    missingEvidence: A fuller private-comp set with verified revenue and valuation data for more enterprise-agent and model-platform peers.
    whyItMatters: The current comp table is intentionally partial because many private peers lack reliable comparable disclosure.
    diligencePath: Add paid-database comp workups from PitchBook/CB Insights and direct financing docs.
    relatedTableRefs:
    - TV004
