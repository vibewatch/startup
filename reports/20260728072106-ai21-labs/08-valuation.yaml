- id: TV006
  title: Critical diligence blockers and thesis-break triggers
  columns:
  - Open item
  - Why it matters
  - Public-state conclusion
  - Next diligence step
  rows:
  - - Current ARR / revenue
    - Needed to test whether current valuation implies fair or stretched multiples
    - Not disclosed in the retained source set
    - Request board-level revenue bridge and latest run-rate
  - - NRR / churn / cohort retention
    - Determines whether Maestro and enterprise deployments expand durably
    - Not publicly visible
    - Request cohort waterfall and top-account renewals
  - - Customer concentration
    - A few lighthouse logos can mask fragile economics
    - Not publicly visible
    - Request top-10 customer share and pipeline concentration
  - - Post-reset org capacity
    - Delivery depth matters for enterprise deployment quality
    - Only indirectly visible via news and support automation stories
    - Request current org chart and implementation staffing ratios
  - - Cap table / preferences
    - Late-stage investor outcomes depend on terms, not just headline valuation
    - Not publicly visible
    - Request full capitalization table and preference stack
  notes: Any one of the first three blockers can materially re-rate AI21 because they determine whether the current mark reflects scale or mostly expectation.
