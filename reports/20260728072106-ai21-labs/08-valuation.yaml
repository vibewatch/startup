- id: TV003
  title: Monetization and customer-proof table
  columns:
  - Surface
  - Public proof
  - Valuation read-through
  - Limitation
  rows:
  - - API / model pricing
    - Independent aggregators list low-cost to premium Jamba/J2 token prices
    - Supports that monetization is real across multiple tiers
    - Does not reveal blended realized pricing or enterprise discounting
  - - Private deployment
    - AI21 markets VPC / on-prem / private-cloud options
    - Supports enterprise willingness-to-pay and regulated-workflow relevance
    - Usually implies longer sales cycles and services burden
  - - Fnac Darty
    - Named Maestro deployment in after-sales operations
    - Best public proof that Maestro maps to business outcomes
    - No public renewal or expansion economics
  - - Ubisoft
    - Named writer-in-the-loop creative workflow case
    - Shows product flexibility and customer credibility
    - Not proof of broad horizontal rollouts
  - - Wordtune
    - Broad adoption plus mixed review surface
    - Adds brand reach and usage breadth
    - Consumer usage does not equal durable enterprise contract value
  notes: Customer proof is selected for relevance to monetization and durability rather than for exhaustive logo coverage.
