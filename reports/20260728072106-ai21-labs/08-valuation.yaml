- id: TV005
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Operating assumption
  - Implied valuation view
  - Investor interpretation
  rows:
  - - Bull
    - Maestro becomes repeatable across multiple verticals; revenue quality proves strong; disclosure improves
    - ~$1.6B-$1.8B+
    - Current mark looks reasonable and possibly slightly attractive
  - - Base
    - Pivot works, but growth proof and disclosure remain incomplete
    - ~$1.1B-$1.5B
    - Current mark is defensible but not obviously cheap
  - - Bear
    - Customer proof stays thin; retention or concentration disappoints; post-reset delivery depth looks weak
    - ~$0.6B-$0.9B
    - Current mark would prove too full and vulnerable to markdown
  - - Stretch upside
    - AI21 proves a broader trusted-agent platform with clean referenceable expansion
    - ~$2.0B+
    - Would require materially better disclosure and evidence than is public today
  - - Stress downside
    - A major customer or execution miss narrows AI21 to a smaller niche software outcome
    - < $0.6B
    - Would likely trigger a down-round or severe secondary discount
  notes: These ranges are scenario heuristics derived from public comps, visible pricing, customer proof, and the absence of disclosed financial outputs.
