- id: monetization-and-customer-proof
  title: Monetization surfaces and customer proof
  body: 'Public pricing and customer evidence support a real business, but not yet a fully underwritten growth engine. Independent pricing aggregators show AI21 has a tiered token-pricing ladder that runs from inexpensive smaller-model usage to more premium large-model pricing. That helps investors believe monetization exists across several workloads, especially when combined with private deployment and enterprise-sales positioning. Still, those pages are not substitutes for contracted enterprise economics; they show how AI21 can charge, not what customers actually spend or renew at scale. Customer proof is similarly mixed. Fnac Darty and Ubisoft are credible named deployments, and Google Cloud plus Intercom show AI21 has enough operating mass to support both enterprise and B2C surfaces. But the public customer set remains small, and Wordtune’s reviews highlight the difference between broad product usage and durable enterprise contract value. The result is a chapter-two valuation implication:
    AI21 deserves more credit than a concept-stage AI startup, but not the automatic multiple premium of a transparently compounding software franchise.'
  claimRefs:
  - CV007
