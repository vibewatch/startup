- id: adoption-trajectory-and-named-proof
  title: Adoption trajectory and named proof
  body: 'The clearest public adoption story is Wordtune. AI21 claims more than 10 million users and hundreds of millions of rewrite selections, while its Chrome-extension and review surfaces reinforce real user activity. That does not reveal paid conversion, but it does show widespread exposure and repeat use. On the enterprise side, the most compelling named proof is Fnac Darty. The public announcement describes a strategic partnership where Maestro will support after-sales operations, analyze historical and real-time data, and reduce errors and unnecessary home visits. This is a meaningful proof point because it ties AI21 to a specific customer, workflow, and intended economic outcome.


    Ubisoft is the second major named proof, showing AI21 embedded into writer-in-the-loop game-content production and data augmentation. The case is valuable because it illustrates not just experimentation, but integration into actual creative workflows. Apps Run The World adds a third named deployment with Write Label, though that proof is weaker because the strongest detail comes from one third-party listing rather than a direct vendor case study. Taken together, these named references show AI21 can land into concrete workflows across retail, media, and advertising. They do not yet prove a long list of scaled, repeatable enterprise rollouts.'
