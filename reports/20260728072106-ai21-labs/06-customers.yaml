- id: retention-durability-and-satisfaction
  title: Retention, durability, and satisfaction
  body: 'Public satisfaction signals for Wordtune are reasonably good. Product pages, Capterra, and review summaries all point to ease of use, good rewriting quality, and strong integration into places where users already work, especially Google Docs, Gmail, browsers, and other communication surfaces. This is important because products that fit directly into daily writing workflows usually have better repeat-use prospects than destination products that require behavior change. At the same time, the same review sources surface real friction: strict free-plan limits, pricing sensitivity on premium tiers, off-context suggestions that still need human editing, and some complaints about customer service or billing cancellation experience.


    The larger problem is missing retention data. There is no public NRR, GRR, churn, contract length, or renewal information in the retained source set. Even for Wordtune, broad usage metrics do not reveal whether users convert, stay, or expand. For enterprise deployments, the evidence is even thinner. Fnac Darty and Ubisoft show fit and intent, but not renewal history. The Intercom case does provide a useful indirect signal: AI21 itself has invested in scaling customer support and automation, implying the company expects ongoing user demand. Still, support efficiency is not the same as customer durability. From a diligence perspective, customer quality remains more visible in satisfaction and workflow fit than in measurable retention.'
