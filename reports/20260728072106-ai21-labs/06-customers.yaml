chapter:
  number: 6
  title: Customers
  summary: 'AI21’s customer evidence is strongest at the two ends of a barbell. On one end, Wordtune shows broad prosumer/SMB adoption through millions of users, marketplace ratings, and recurring workflow reviews. On the other, a small but meaningful set of public enterprise proofs — especially Fnac Darty and Ubisoft — shows AI21 technology being used in real operational workflows such as after-sales support and game-content production. What remains weak is the middle: there is little public evidence on enterprise retention, contract concentration, or repeatable expansion across many named accounts. The company’s customer story is therefore credible on product usage and early enterprise fit, but still incomplete on durability and scale quality.'
sections:
- id: customer-segments-and-surfaces
  title: Customer segments and customer surfaces
  body: 'AI21’s customer base is best understood as three overlapping surfaces rather than one homogeneous cohort. First, Wordtune serves a large prosumer and SMB-style audience using browser extensions, web editors, and freemium onboarding. Review sources and product pages suggest this audience includes professionals writing email and business content, students and academics, marketers and content creators, and non-native English speakers who want tone and fluency help. Second, AI21 has a developer and platform audience using its models and private deployment capabilities. Third, the company is trying to win enterprise workflow budgets through Maestro, private AI, and domain-specific orchestration.


    That segmentation matters because the proof standard differs by segment. Wordtune generates strong public evidence of product usage and satisfaction, but weak evidence of monetization quality. Enterprise deployments produce richer case-study detail, but there are far fewer named examples. Developers and private-deployment buyers appear in infrastructure and partner materials, yet their revenue significance is not publicly disclosed. The customer picture is therefore broad but uneven: high visibility at the top of the funnel, encouraging but selective proof in enterprise, and limited public data on how the different segments convert into durable revenue.'
