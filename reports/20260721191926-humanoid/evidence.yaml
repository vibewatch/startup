evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: preorders
    missingEvidence: >-
      Signed customer order schedule reconciling the canonical 34,000 pre-orders / $2.4B baseline with fetched public
      reporting around 25,000 preorders.
    whyItMatters: >-
      Pre-order conversion is a central valuation and commercial-readiness input for a capital-intensive robotics
      company.
    diligencePath: >-
      Request order book export, customer names, deposits, cancellation clauses, delivery timing, and
      revenue-recognition treatment; reconcile with CNET and management baseline.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: revenue-disclosure
    missingEvidence: >-
      Audited or management-approved revenue, ARR, gross margin, burn, runway, and backlog-to-revenue conversion
      metrics.
    whyItMatters: >-
      Public funding and valuation facts are strong, but operating leverage cannot be underwritten without financial
      statements.
    diligencePath: Review board pack, monthly management accounts, cash forecast, customer invoices, and signed deployment contracts.
    relatedQuestionRefs:
      - QO018
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Board roster, investor rights, liquidation preferences, debt or credit facilities, secondary-sale terms, and
      founder dilution.
    whyItMatters: >-
      A $1.35B post-money valuation can mean very different economics depending on preferences, control, and secondary
      components.
    diligencePath: Request financing documents, cap table, side letters, investor consent rights, and minutes approving the Series A.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-table
    missingEvidence: Full executive roster, board members, functional leads, and prior-employer list for the engineering team.
    whyItMatters: >-
      The public founder/CTO story is useful but insufficient to assess succession, delivery capacity, and key-person
      dependence.
    diligencePath: Ask management for org chart, leadership bios, board observer list, and hiring plan by office.
    relatedQuestionRefs:
      - QO006
      - QO007
      - QO024
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Definitive split between Schaeffler deployment units, Bosch manufacturing role, any Bosch customer order, and
      long-range 100,000-unit production targets.
    whyItMatters: Confusing order attribution can materially overstate customer traction or manufacturing certainty.
    diligencePath: >-
      Obtain Schaeffler and Bosch contracts, statement of work, minimum purchase obligations, and production ramp
      schedule.
    relatedQuestionRefs:
      - QO015
      - QO019
    relatedTableRefs:
      - TO003
      - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      Company-confirmed chronology for prior funding rounds, exact prototype dates, and any regulatory/safety
      certification events.
    whyItMatters: >-
      Later chapters need a single chronology of record that includes financing, product, partnership, governance,
      adverse, and regulatory events.
    diligencePath: >-
      Request management timeline, press release archive, safety-certification documents, and board-approved financing
      history.
    relatedQuestionRefs:
      - QO019
      - QO025
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: material
    topic: conflicting-estimates
    missingEvidence: >-
      A reconciled bottom-up industrial humanoid SAM model separating manufacturing, logistics, retail, healthcare,
      home, and services by geography.
    whyItMatters: >-
      The 2035 sizing range spans USD 8.78 billion to USD 192.7 billion, which can swing valuation support by an order
      of magnitude.
    diligencePath: >-
      Build an independent workflow-by-workflow model using robot ASP, deployable units, reachable sites, replacement
      labor cost, and adoption timing.
    relatedQuestionRefs:
      - QM008
      - QM011
      - QM026
    relatedTableRefs:
      - TM002
