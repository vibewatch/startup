- id: drivers-and-constraints
  title: Drivers and constraints shaping adoption speed
  body: 'The core demand drivers are labor scarcity, aging demographics, reshoring or industrial-policy pressure, advances
    in vision-language-action models, and falling component costs. BLS labor pools in material movement and production are
    large enough to create meaningful automation opportunities, while IFR and WEF point to automation and workforce transformation
    as macro themes. Constraints are equally material. Buyers must see payback against manual labor, AMRs, and fixed automation;
    safety certification must support fenceless operation; batteries, actuators, sensors, compute, and serviceability must
    improve; and capital intensity remains high. The adverse read is not that humanoids have no market, but that TAM estimates
    assume reliability, uptime, cost, and safety improvements that are not yet proven at scale. These constraints should be
    converted into diligence milestones before valuation work: beta runtime against shift length, measured task success rate,
    incident-free hours around workers, field service response time, component lead times, and gross margin after warranty
    and support. Without those milestones, the market can remain impressive while revenue conversion disappoints.'
