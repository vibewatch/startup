  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: conflicting-estimates
    missingEvidence: A reconciled bottom-up industrial humanoid SAM model separating manufacturing, logistics, retail, healthcare,
      home, and services by geography.
    whyItMatters: The 2035 sizing range spans USD 8.78 billion to USD 192.7 billion, which can swing valuation support by
      an order of magnitude.
    diligencePath: Build an independent workflow-by-workflow model using robot ASP, deployable units, reachable sites, replacement
      labor cost, and adoption timing.
    relatedQuestionRefs:
    - QM008
    - QM011
    - QM026
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: som-definition
    missingEvidence: Customer contracts, delivery schedules, cancellation terms, pricing, gross margin, and conversion rates
      for Humanoid preorders and partner deployments.
    whyItMatters: Public TAM does not prove Humanoid can convert industrial demand into revenue, margin, or recurring service
      economics.
    diligencePath: Request anonymized order book, Schaeffler deployment plan, pilot scorecards, support obligations, and post-beta
      conversion milestones.
    relatedQuestionRefs:
    - QM017
    - QM021
    - QM026
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: minor
    topic: retail-buyer-map
    missingEvidence: Direct evidence from retailers budgeting for humanoid robots rather than generic service robotics or
      broad market-report inclusion.
    whyItMatters: Retail is in broad TAM reports but has weaker evidence for Humanoid’s near-term industrial wedge.
    diligencePath: Interview retail innovation and store-operations buyers; seek pilots with task-level ROI and safety data.
    relatedQuestionRefs:
    - QM020
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: safety-certification
    missingEvidence: Humanoid-specific risk assessment, ISO 10218 integration plan, incident logs, and insurer/customer safety
      acceptance criteria for fenceless operation.
    whyItMatters: Safety and certification determine which human-space tasks can legally and practically move from pilot to
      scaled deployment.
    diligencePath: Review safety case, third-party certification roadmap, EHS sign-offs from pilot customers, and post-incident
      escalation process.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM004
  - type: enumeration-incomplete
    severity: minor
    topic: segment-coverage
    missingEvidence: A complete public list of enterprise humanoid deployments by segment, geography, workflow, robot model,
      and commercial status.
    whyItMatters: The buyer map is representative rather than exhaustive; missing failed pilots can bias adoption expectations
      upward.
    diligencePath: Build a deployment database from customer announcements, procurement records, conference presentations,
      and customer interviews.
