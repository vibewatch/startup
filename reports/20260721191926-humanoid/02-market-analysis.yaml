  title: Market definition table
  columns:
  - Category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Humanoid
  rows:
  - - Industrial humanoid robots
    - Robot hardware, software, services, deployment and fleet support for human-form robots in factories and warehouses
    - Traditional arms, conveyors, AMRs, drones, and consumer robots
    - Plant operations, industrial engineering, automation, safety, IT
    - Primary boundary for Alpha Wheeled and Schaeffler-style deployments
  - - Logistics / warehousing humanoids
    - Tote handling, goods movement, replenishment, kitting, returns, and facility tasks
    - Existing AMRs, AS/RS, sortation, forklifts, and manual temp labor
    - 3PL operations, warehouse automation, labor planning
    - Near-term SAM with real GXO/Digit pilot evidence
  - - Manufacturing humanoids
    - Line-side material movement, machine tending, inspection, assembly assistance, and intralogistics
    - Fenced industrial robot cells and custom fixed automation
    - Plant manager, manufacturing engineering, industrial engineering
    - Strongest partner evidence via Schaeffler and broader market reports
  - - Retail / commercial service humanoids
    - Backroom movement, shelf support, facility support, and customer-facing service where evidence supports it
    - Point robots, kiosks, shelf scanners, and conventional service robots
    - Store operations, retail innovation, facilities
    - Included in broad TAM but lower-confidence near-term SAM for Humanoid
  - - Consumer / home humanoids
    - Excluded from industrial SAM; only relevant to far-future Morgan Stanley ecosystem TAM
    - Domestic assistants, eldercare-only home devices, entertainment robots
    - Households and consumer channels
    - Too speculative for Humanoid’s current industrial valuation case
  notes: 'Boundary is evidence-constrained: included spend requires human-form mobile robots in industrial/commercial workflows;
    excluded categories remain substitutes for ROI tests.'
