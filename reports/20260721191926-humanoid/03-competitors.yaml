- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence
  - Mitigation / diligence ask
  rows:
  - - Europe-first industrial anchor customers
    - NEURA, Flexion, and global U.S. leaders also court European manufacturers
    - High
    - Humanoid, NEURA, and Flexion all have European positioning/funding signals
    - Request signed customer contracts, deployment schedule, and geography exclusivity terms
  - - Wheeled-first pragmatic design
    - Apptronik also ships wheeled Apollo and customers may view wheels as generic
    - High
    - Forbes and BI describe industrial demand for wheeled stability and Apollo wheeled versions
    - Underwrite task-level ROI, safety case, and uptime, not just form factor
  - - KinetIQ proprietary AI brain
    - Figure Helix, Apptronik/Google DeepMind, 1X Redwood, and Tesla AI compete for embodied AI talent
    - High
    - Multiple competitors disclose AI/data flywheel strategies
    - Request benchmarks on first workflows, intervention rate, data rights, and model update cadence
  - - Schaeffler/Bosch customer access
    - Announced orders may not equal binding revenue; Bosch unit count is not primary-corroborated here
    - High
    - Schaeffler public agreement exists; Bosch details are brief-sourced
    - Obtain MSAs, purchase orders, acceptance criteria, cancellation rights, and payment milestones
  - - Fast execution culture
    - Capital-rich rivals can absorb failures and recruit scarce robotics talent
    - Medium
    - Figure and Apptronik have much larger funding/valuation signals
    - Monitor hiring velocity, burn, hardware iteration cycle, and supplier commitments
  - - Industrial deployment data
    - Customer data can become proprietary but pilots may remain small or teleoperated
    - Medium
    - Figure BMW, Apptronik Robot Park, Agility GXO, and Humanoid Schaeffler all create data loops
    - Diligence data ownership clauses and share of autonomous versus remote-operated hours
  - - Hardware integration and supply chain
    - China low-cost hardware and rare-earth/geopolitical shocks can reset cost curve
    - Medium
    - Unitree price signals and Tesla supply-chain delay reporting
    - Request BOM, critical suppliers, actuator yield, and China exposure
  - - General-purpose humanoid narrative
    - Status quo automation may solve target workflows more cheaply and reliably
    - High
    - Ex-Tesla Optimus lead skepticism and mature AMR/cobot substitutes
    - Compare each paid workflow against AMR/cobot/fixed automation quotes and payback
  notes: Risk severity is analyst judgment based on public evidence; private contract, autonomy, and cost data could materially
    change each rating.
