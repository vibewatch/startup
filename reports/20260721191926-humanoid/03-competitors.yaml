callouts:
- calloutType: risk
  title: Capital is not the moat yet
  body: Humanoid is a European unicorn, but Figure and Apptronik have set a much larger public capital bar. The diligence
    focus should be whether Humanoid converts Schaeffler/Bosch access into faster autonomous industrial learning, not whether
    it can match U.S. valuations immediately.
  claimRefs:
  - CP001
  - CP004
  - CP043
  - CP044
  - CP046
- calloutType: insight
  title: Wheels are a wedge, not a monopoly
  body: The wheeled-first strategy is commercially sensible for logistics and manufacturing, but Apptronik also markets wheeled
    Apollo variants. Humanoid must prove lower intervention rates, better uptime, and lower TCO in named workflows.
  claimRefs:
  - CP006
  - CP017
  - CP045
  - CP047
