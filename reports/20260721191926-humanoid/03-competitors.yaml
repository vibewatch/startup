- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Public price or packaging signal
  - Included capabilities
  - Unknowns / caveats
  - Implication for Humanoid
  rows:
  - - Humanoid
    - No public unit price; brief says 34,000 pre-orders worth $2.4B
    - Wheeled/bipedal HMND 01 Alpha, KinetIQ, industrial deployments
    - Pre-order quality, Bosch 1,000-unit detail, and service economics need primary documents
    - Must prove order quality and industrial TCO, not just backlog headline
  - - Figure AI
    - No public industrial price reviewed
    - Figure 03 and Helix; BMW logistics/manufacturing workflows
    - Customer contract value and unit economics undisclosed
    - Capital allows price aggression if BMW results scale
  - - Apptronik
    - No public price; valuation and funding public
    - Apollo 2/3, wheeled and bipedal, Robot Park data programs
    - Robot Park is still prototype/data phase; commercial SKU timing opaque
    - Competes directly with Humanoid’s wheeled industrial logic
  - - Agility Robotics
    - RaaS agreement with GXO; price undisclosed
    - Digit plus Agility Arc fleet platform
    - RaaS price, utilization, and gross margin undisclosed
    - Strong proof of paid workflow raises bar for Humanoid pilots
  - - 1X Technologies
    - Reported $20,000 purchase or $499/month, $200 deposit
    - NEO home robot, chores, AI companion, Expert Mode
    - Consumer price may not map to industrial deployments; teleoperation burden
    - Shows transparent low-end price anchor but not industrial reliability
  - - Unitree Robotics
    - G1 from $13.5K; reported Walmart listing at $21,600
    - Developer/research bipedal hardware with 23-43 motors
    - Enterprise support, safety, and integration costs unknown
    - Creates hardware price anchor that can compress perceived humanoid ASPs
  - - UBTECH / Fourier / NEURA / Flexion
    - Funding, production, or launch signals; no comparable unit price reviewed
    - Industrial Walker, N1/open-source, cognitive platforms
    - Secondary source dependence and heterogeneous product scope
    - European and China entrants dilute uniqueness claims
  - - Status quo automation
    - Custom project quotes; often already budgeted
    - AMRs, conveyors, arms, cobots, integrator services
    - Less flexible but more mature reliability and safety cases
    - Humanoid must show ROI over simpler automation for first workflows
  notes: 'Pricing is not apples-to-apples: public list prices are consumer/developer hardware, while industrial humanoid deployments
    are mostly private RaaS, pilot, or strategic contracts.'
