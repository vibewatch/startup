  - - NEURA Robotics
    - European physical-AI / cognitive robotics player
    - Humanoids Daily reports $1.4B Series C led by Tether
    - Next-gen humanoids and cognitive ecosystem
    - Automatica 2025 humanoid/cognitive ecosystem launches
    - Large European funding signal and SAP/NVIDIA ecosystem links
    - Evidence here is secondary and may overlap broader robotics beyond humanoids
  - - Flexion
    - European humanoid software / AI entrant
    - Humanoids Daily reports $50M raise
    - Android/humanoid intelligence focus
    - Early-stage financing signal
    - Specialized brain/software angle
    - Earlier than Humanoid on disclosed industrial anchor customers
  - - Traditional fixed automation / AMRs
    - Status quo substitute
    - Existing capex budgets and installed base
    - Non-humanoid robots and conveyors
    - Warehouse AMRs and industrial robots already embedded
    - Lower technical risk for narrow tasks
    - Less flexible for human-space mobile manipulation
  - - Internal build by OEMs
    - Buyer-owned substitute
    - Large manufacturers can fund pilots internally
    - Custom automation plus data teams
    - Automotive/logistics engineering organizations
    - Control over data and process integration
    - Slow, talent-intensive, and unlikely for all workflows
  - - Cobots / industrial robot arms
    - Adjacent substitute
    - Mature robot-arm ecosystem
    - Stationary or mobile manipulators
    - Pick, place, weld, tend machines in structured cells
    - High reliability and safety certifications
    - Require workflow redesign and less adaptable to human spaces
