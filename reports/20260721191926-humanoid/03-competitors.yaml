- id: capability-form-factor-ai
  title: Capability, form factor, and AI approach
  body: 'Humanoid’s most defensible technical positioning is pragmatic rather than maximalist: it starts with wheeled industrial
    robots, shares the upper body with a bipedal roadmap, and uses KinetIQ as the orchestration and task-execution layer.
    That does not make wheels unique, because Apptronik also offers wheeled and bipedal Apollo configurations and independent
    coverage says industrial customers keep asking for wheels for stability, battery life, and predictability. Figure is more
    visibly pursuing a Helix-centered bipedal/general-purpose path, and its BMW sequencing workflow is a strong signal that
    bipedal manipulation is moving from demo to factory trial. Agility’s Digit is purpose-built for human spaces in logistics,
    while Unitree pushes low-cost bipedal developer hardware and 1X optimizes NEO for homes with human-in-the-loop learning.
    The implication is that feature breadth is less important than whether the robot can repeatedly solve a buyer’s first
    paid workflow.'
