- id: traction-pricing-packaging
  title: Commercial traction and packaging signals
  body: The strongest competitive proof is unevenly distributed. Figure can point to BMW production contribution and a follow-on
    Figure 03 workflow; Apptronik can point to Mercedes, GXO, Jabil, Google DeepMind, and a dedicated data factory; Agility
    can point to a multi-year RaaS agreement with GXO and publicly described live warehouse work. Humanoid’s Schaeffler agreement
    and Bosch manufacturing relationship are strategically valuable because they provide industrial access, actuator/component
    adjacency, and potential European manufacturing scale, but the public record still needs customer-level contract economics,
    deployment ramp, and acceptance criteria. Pricing is even less transparent. 1X and Unitree publish or are reported with
    list prices, while industrial players generally disclose pilots, RaaS, or strategic agreements without unit price, utilization,
    service gross margin, or cancellation terms. This opacity makes competitive pricing a diligence priority rather than a
    solved comparison.
