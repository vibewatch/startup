- id: cover-kpis-gaps-and-adverse-frame
  title: Cover KPIs, Gaps, and Adverse Frame
  body: 'The cover facts should be forceful but carefully caveated. Valuation is $1.35 billion, total raised is $270 million,
    and the latest financing is the $152 million Series A. The headquarters and engineering-footprint facts are well supported.
    Headcount is not: the canonical report band is approximately 160–200, but fetched public sources range from more than
    130 to more than 250, so any exact employee count should be treated as private-evidence-needed. Customer traction is even
    more delicate. The report baseline uses 34,000 pre-orders worth about $2.4 billion, while CNET reports around 25,000 preorders
    and six Fortune 500 pilots; this variance should travel into the customer and valuation chapters. Revenue, ARR, margin,
    burn, runway, and cap-table economics remain undisclosed. The adverse frame is therefore not that the company lacks momentum;
    it is that a very young, founder-led, capital-intensive robotics company is being valued as a unicorn before public revenue,
    delivery quality, or order-conversion evidence is available.'
  claimRefs:
