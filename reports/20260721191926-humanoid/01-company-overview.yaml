  - FO002
  - FO003
- id: leadership-team-and-key-person-risk
  title: Leadership, Team, and Key-Person Risk
  body: 'The founder narrative is a real asset and a diligence risk at the same time. Artem Sokolov is consistently named
    as founder and CEO, with public profiles tying him to manufacturing, investment, and a family-business background before
    Humanoid. That gives the company a credible strategy and scale-up story, especially for a robotics business where manufacturing
    discipline matters. It also concentrates narrative risk in one person: a Forbes article’s framing of Sokolov as a former
    Russian jewelry magnate makes founder background, geopolitics, sanctions exposure, and investor comfort explicit diligence
    topics rather than footnotes. Jarad Cannon adds important technical balance as CTO, with third-party coverage pointing
    to more than 13 years of robotics and AI execution experience. The broader team bench is less precisely disclosed. Public
    sources range from over 130 professionals to over 200 engineers and more than 250 employees, so this chapter carries the
    canonical cover band as roughly 160–200 while flagging the variance for follow-up.'
  claimRefs:
  - CO009
  - CO010
  - CO011
  - CO012
  - CO013
  - CO014
  - CO035
  tableRefs:
  - TO002
  figureRefs: []
- id: funding-valuation-and-investor-map
  title: Funding, Valuation, and Investor Map
  body: 'The July 21, 2026 Series A is the defining company-overview event. Multiple independent outlets report the same headline
    economics: a $152 million Series A, $1.35 billion post-money valuation, and $270 million total capital raised to date.
    Those figures imply roughly $118 million of prior capital before the Series A. Prime Movers Lab led the round, and the
    named co-investors matter because several are not merely financial logos. Schaeffler and Bosch create industrial validation
    and possible manufacturing leverage; Fubon Financial Holding Venture Capital adds Asian financial-capital reach; Aglaé
    Ventures adds luxury-family-office signal through the Arnault-linked vehicle reported by Silicon Republic. The valuation
    label is therefore not just a price. It rests on the claim that Humanoid has paired capital with strategic deployment
    and manufacturing relationships quickly enough to become Europe’s first pure-play humanoid robotics unicorn. The open
    questions are economic: no public source reviewed gives board seats, liquidation preferences, debt, secondary sales, founder
    dilution, or runway.'
