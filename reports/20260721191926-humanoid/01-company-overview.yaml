company:
  name: Humanoid
chapter:
  number: 1
  title: Company Overview
  summary: Humanoid is a 2024-founded London AI and industrial humanoid robotics company that reached a reported $1.35B post-money
    valuation with a $152M Series A on July 21, 2026, bringing total raised to $270M. The company has unusually strong strategic-partner
    proof for its age, but public evidence still leaves material gaps around pre-order conversion, revenue, governance terms,
    and exact headcount.
sections:
- id: identity-product-and-footprint
  title: Identity, Product, and Footprint
  body: 'Humanoid is a 2024-founded UK AI and robotics company that markets HMND-branded humanoid labour for industrial work
    rather than as a laboratory demonstration project. The identity is already unusually concrete for such a young robotics
    startup: its own homepage, product pages, and funding coverage all converge on industrial humanoid robots, the HMND 01
    Alpha family, and KinetIQ as the proprietary AI framework behind fleet orchestration. The company’s operating footprint
    is also clear enough to serve as later-report ground truth. London is the headquarters, while Boston and Vancouver are
    described as engineering satellites or offices. The product story has two near-term embodiments: Alpha Wheeled for industrial
    deployment and Alpha Bipedal for bipedal R&D and future applications. Public specifications support a 15 kg payload, 29
    degrees of freedom, and industrial-speed movement, although one product-spec nuance remains conflicted because the official
    bipedal page repeats some shared Alpha figures while independent summaries use the canonical bipedal 179 cm, 90 kg, 1.5
    m/s, and three-hour runtime values.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO040
  tableRefs:
  - TO001
