- id: commercial-proof-and-milestone-chronology
  title: Commercial Proof and Milestone Chronology
  body: 'The milestone record shows a company compressing founding, product, partnership, and unicorn financing into roughly
    two years. Publicly recoverable events begin with the 2024 founding, move through the Jarad Cannon CTO appointment in
    2025, and then accelerate in 2026 with SAP/Martur Fompak, Siemens/NVIDIA, Schaeffler, Bosch, and Series A milestones.
    Schaeffler is the strongest publicly documented commercial proof because the official announcement describes a binding
    phased deployment and supply agreement for a four-digit number of wheeled robots, with live German production deployments
    beginning in late 2026. Bosch is also strategically important, but the exact order/deployment number is less clean: funding
    coverage supports Bosch as a contract manufacturing partner, while one secondary source attributes a 1,000-robot order
    and a 100,000-unit production ambition to the Schaeffler/Bosch ecosystem. This chapter treats Schaeffler as the largest
    disclosed deployment agreement and preserves the Bosch-order count as a gap, not a settled fact.'
