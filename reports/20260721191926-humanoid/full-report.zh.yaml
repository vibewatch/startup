            body: >-
              Humanoid 不应按软件公司建模。公开成本研究显示，执行器占人形机器人成本的重要部分；计算、传感器、电池、机械结构、装配、测试、部署工程、支持和保修准备金还会继续消耗现金。Bosch
              作为合同制造伙伴，可能降低 Humanoid 自建工厂 capex 需求，但无法消除库存融资、最低订购量、供应商承诺、返工或客户验收风险。由于没有公开来源披露 BOM、人工含量、毛利率、利用率、服务附加或
              RaaS
              回本，单位经济桥接基本仍是尽调模板。财务模型应把毛利率留空，对烧钱速度使用情景区间，并且只在看到转化证据后才给订单簿计入价值。规模化人形机器人集群还会制造时间错配：供应商可能要求客户验收机器人前先付定金，而保修和现场支持会在出货后消耗现金。第一批生产队列中，这些时间项可能主导会计毛利率。
