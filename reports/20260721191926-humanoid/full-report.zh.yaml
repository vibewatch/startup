  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业与财务风险：订单簿驱动的故事缺少收入证明
        blocks:
          - type: paragraph
            body: >-
              最高概率的投资风险是，Humanoid 的公开商业信号仍由订单簿驱动，而不是收入驱动。公司拥有异常强的融资标题支撑：多家独立来源报道了 $152 million Series A 轮、$1.35 billion
              投后估值和 $270 million 累计融资。这些资本给团队留下执行空间，但也抬高了业绩门槛，因为估值似乎已经在公开认可收入、ARR、毛利率、现金烧钱或现金跑道证据出现前，资本化了未来机器人部署。34,000
              台预订单主张具有战略重要性，但最强的反向来源明确表示，该数字没有经过独立验证，并且报道时 Humanoid 尚未交付商业单元。Schaeffler 和 Bosch
              降低了进入市场风险，但也把证明集中在两个战略交易对手身上。因此，承保姿态应是“有条件上行”：只有在合同可执行性、定金、客户验收、服务经济和已交付单元利用率得到证明后，才给销售管线估值。
