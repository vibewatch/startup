          description: 测试单一工作流，例如 Bosch 厂内物流、Siemens 周转箱搬运，或 Martur Fompak KLT 箱移动。
          channels:
            - 现场测试
            - SAP 或 Siemens 集成
            - NVIDIA 仿真支持
        - id: stage-contract
          label: 商业签约
          actor: 采购和法务
          description: 买方从试点转向有约束力的分阶段部署或 RaaS 服务合同；Schaeffler 是公开锚点。
          channels:
            - RaaS 协议
            - 主服务协议
            - 现场 SOW
        - id: stage-production
          label: 生产部署
          actor: 工厂运营
          description: 机器人在现场运营中反复执行物流任务，同时满足正常运行时间、吞吐量和安全要求。
          channels:
            - 机队管理
            - 维护和支持
            - 工厂 IT 集成
        - id: stage-expansion
          label: 扩张 / 续约
          actor: 企业客户负责人
          description: 成功站点扩展到更多机器人、更多工作流或更多站点；公开续约数据尚未披露。
          channels:
            - 扩张选项
            - 背书访谈
            - 新工作流范围
        - id: stage-feedback
          label: 数据和模型反馈
          actor: Humanoid + 战略伙伴
          description: 运营数据反哺 KinetIQ、执行器需求和集成打法，服务下一波部署。
          channels:
            - KinetIQ 更新
            - 执行器伙伴关系
            - 客户成功闭环
    claimRefs:
      - CU008
      - CU036
      - CU037
      - CU029
  - id: FU002
    title: 采用部署漏斗
    type: funnel
    layout: standard
    summary: 公开管线从头条预订单到具名量化试点，再到有约束力的商业部署，收窄很快。
    approximationNotes: 数值是以披露数量为锚的示意指数值，不是转化率或收入。
    data:
      items:
        - label: 据报道的预订单 / 商业管线
          value: 34000
          description: 据报道有 34,000 份预订单，价值约 $2.4B；未经独立验证。
        - label: 据报道已完成的工业部署
          value: 9
          description: Unite.AI 报道九个工业部署，但未逐一列出客户。
        - label: 具名公开 POC / 试点
          value: 4
          description: Bosch、Siemens、SAP/Martur Fompak 和 Schaeffler 一期验证均有公开具名。
        - label: 量化试点结果
          value: 1
          description: Siemens 的量化试点指标最清晰：60 次周转箱搬运 / 小时、>8h 正常运行时间、>90% 成功率。
        - label: 有约束力的大规模协议
          value: 1
          description: Schaeffler 是公开证据中最强的有约束力分阶段部署协议。
    claimRefs:
      - CU023
      - CU024
      - CU016
      - CU039
      - CU045
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: Schaeffler 交易质量最高；Siemens 量化试点结果最高；预订单验证最低。
    approximationNotes: 定性评级仅使用公开证据；私人合同可能改变排名。
    data:
      columns:
        - 交易质量
        - 运营证明
        - 结果具体性
        - 留存可见度
      rows:
        - label: Schaeffler
