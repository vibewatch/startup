        - 下一代人形机器人和认知生态
        - Automatica 2025 人形机器人 / 认知生态发布
        - 欧洲大额融资信号和 SAP/NVIDIA 生态连接
        - 此处证据为二手来源，并可能与人形机器人之外的更宽机器人业务重叠
      - - Flexion
        - 欧洲人形机器人软件 / AI 新进入者
