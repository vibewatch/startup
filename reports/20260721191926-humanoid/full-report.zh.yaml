companyProfile:
  summary: >-
    Humanoid 是一家总部位于 London 的工业人形机器人公司，Artem Sokolov 于 2024 年创立。公司设计并制造 HMND 01 Alpha 系列人形机器人（一个续航 4 小时的轮式版本和一个双足版本，均有
    29 个自由度、15 kg 双臂载荷），并自研名为 KinetIQ 的视觉-语言-动作 AI 大脑。短短两年内，公司以 $1.35 billion 投后估值完成 $152 million Series A
    轮，成为欧洲首个纯人形机器人独角兽；同时与 Schaeffler、Bosch、Siemens、SAP 和 NVIDIA 建立 Fortune 500 合作关系，并披露 34,000 台、约 ~$2.4 billion 的预订单簿。
  foundedDate: '2024-05-01'
  founders:
    - name: Artem Sokolov
      role: 创始人兼 CEO
      background: 俄罗斯出生的创业者，拥有大型制造和商业背景；2024 年在 London 创立 Humanoid。
      claimRefs:
        - CO004
  foundingLocation: London, United Kingdom
