      - number: '2.3'
        title: 买方图谱与采用路径
        blocks:
          - type: paragraph
            body: >-
              最高置信度的早期买方，是那些在围绕人设计的空间里承担重复、人体工学负担高工作的制造和物流运营方。制造买方可能包括工厂运营、制造工程、工业工程、安全和 IT/安全负责人；物流买方则是 3PL
              运营、仓库自动化和劳动力规划团队。零售出现在广义市场报告中，但 Humanoid 近期工业产品的证据基础更薄。采用路径应建模为带闸门的企业销售：识别受约束的工作流，跑概念验证，验证安全和 IT
              集成，测量可用性和可维护性，然后才扩展到机器人集群。这条路径意味着收入不均匀、采购周期长；但如果试点转化为多站点部署，也会带来很高战略价值。预算归属也会改变证明标准。工厂经理可能关心正常运行时间和安全签核，物流运营方可能关心旺季每次搬运成本，IT/安全团队则可能否决不满足数据、网络和服务访问控制的部署。
