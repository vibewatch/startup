      - number: '7.2'
        title: 技术、安全与监管风险：自主主张遇上工厂安全法规
        blocks:
          - type: paragraph
            body: >-
              Humanoid 的产品风险不只是机器人能不能动，而是工业人形机器人能否在工人附近可靠运行，并具备客户、监管机构、保险公司和劳资委员会都接受的安全控制。公开产品页面声称最长四小时续航、15 kg 双臂载荷、运行在
              NVIDIA 计算上的 KinetIQ AI，以及自主的人类速度操作。这些规格有用，但反向机器人来源说明了为什么演示不能等同于持久自主：IEEE
              曾警告，机器人演示可能有人在回路中；更早的人形机器人项目也依赖工程师、系绳和缓慢任务执行。安全负担同样正式。ISO 10218、ISO/TS 15066、OSHA 机器人指南、EU Machinery
              Regulation 2023/1230 和 CE-marking 义务，共同形成围绕风险评估、协作运行限制、合规文件、护栏、急停、验证日志和客户现场流程的尽调路径。在认证姿态、事故历史和 beta
              可靠性数据可得前，剩余安全 / 监管敞口仍然重大。
