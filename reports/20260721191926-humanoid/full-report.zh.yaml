      - number: '7.3'
        title: 执行、依赖与竞争风险：伙伴规模是优势，也是卡点
        blocks:
          - type: paragraph
            body: >-
              Humanoid 的规模化模式刻意依赖战略伙伴，而不是把生产每一层都握在自己手里。这样可能更省资本，尤其是 Bosch 承担工业化、Schaeffler
              供应执行器时；但风险也被推到供应商产能分配、质量追责、保修协同、工程变更控制和交易对手优先级上。Schaeffler 已公开表示，其到 2031 年期间将承担超过 50%
              执行器需求的优先供应商角色，这是明确的集中点。NVIDIA 级算力是另一项依赖：机器人平台的 AI 技术栈和更广的人形机器人生态都靠专用加速器，其供给、路线图和出口分类都会影响业务。BIS
              关于视同出口、出口合规计划和再出口的指引说明，算力和受控技术不能当作普通零部件处理。竞争压力还会叠加：Unitree 提供了一个可见的中国低成本参照，Tesla 和 Figure 影响客户预期，TNW 提到
              Figure 的 $39 billion 估值，也凸显资本差距。因此，要走向量产，Humanoid 必须拿出供应冗余、良率、现场服务和出口管制合规基本功的证据。
