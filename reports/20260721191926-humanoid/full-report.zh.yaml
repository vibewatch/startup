      - number: '1.2'
        title: 领导层、团队与关键人风险
        blocks:
          - type: paragraph
            body: >-
              创始人叙事既是真资产，也是尽调风险。公开资料一致将 Artem Sokolov 列为创始人兼 CEO，并把他在 Humanoid 之前的经历与制造、投资和家族企业背景相连。机器人公司很吃制造纪律，这让
              Humanoid 的战略和规模化故事更可信。但叙事风险也集中到一个人身上：Forbes 文章把 Sokolov
              描述为前俄罗斯珠宝大亨，使创始人背景、地缘政治、制裁敞口和投资人舒适度都成为明确尽调议题，而不是脚注。Jarad Cannon 作为 CTO 提供了重要技术平衡，第三方报道指向他拥有超过 13 年机器人和 AI
              执行经验。更广泛的团队厚度披露不够精确。公开来源从超过 130 名专业人员到超过 200 名工程师、250 多名员工不等，因此本章把标准封面区间设为约 160–200，同时标记该差异以便跟进。
