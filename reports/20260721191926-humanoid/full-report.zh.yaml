  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与 HMND 01 Alpha 版本
        blocks:
          - type: paragraph
            body: >-
              HMND 01 Alpha 最好理解为工业劳动力自动化机器人，而不是通用消费级人形机器人。当前产品故事有两个形态，共享模块化上半身和 AI 栈：Alpha Wheeled
              是更近期的工业平台，面向物流和制造工作流；Alpha Bipedal 是行走平台，用于研发、服务学习和未来更接近人类的导航。可投资产品证据在轮式版本上最强，因为 SAP/Martur
              Fompak、Siemens、Bosch 和 Schaeffler 的证明都围绕工厂或厂内物流工作。标准尽调基准是：不含末端执行器的 29 个自由度、15 kg
              双臂载荷、高扭矩执行器、可更换手或夹爪，以及面向感知、操作和人机交互的传感器包。双足公开规格链条不够干净，因此本章把冲突公开页面视为尽调缺口，而不是改写共享报告基准。
