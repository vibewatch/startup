    title: 缓释措施与否决标准表
    columns:
      - 风险
      - 可监控触发项
      - 阈值 / 事件
      - 动作含义
    rows:
      - - 预订单转化
        - 具名客户签署的合同和定金
        - 资料室中可执行条款支持的名义订单额低于 50%
        - 对订单额打折，或暂停投资。
      - - 收入质量
        - 已交付并验收的机器人
        - 计划 beta 启动后两个季度仍无已验收的商业部署
        - 将估值视为过度透支。
      - - 安全认证
        - CE / 安全文件完整性
        - 没有针对欧盟场址的风险评估、EHS 签批或合规计划文件
        - 不再承销部署假设。
      - - 自主性成熟度
        - 遥操作 / 干预率
        - 关键任务需要约定安全监控之外的隐性人工协助
        - 重置产品就绪度假设。
      - - 可靠性
        - 车队正常运行时间和 MTBF
        - beta 客户现场任务成功率低于 90%，或多班次正常运行表现差
        - 后续跟投前要求补救计划。
      - - 制造良率
        - 试生产良率和返工
        - 连续两个生产批次良率或返工未达计划
        - 上调现金需求，推迟收入确认。
      - - 供应商集中度
        - Schaeffler 执行器或 NVIDIA 算力配额
        - 规模化生产前没有合格第二来源或配额协议
        - 计入供应链风险折扣。
      - - 出口管制
        - 分类与筛查
        - 针对算力、源代码和员工，没有形成 EAR / UK 军民两用 / 出口管制流程文件
        - 投资前要求完成合规补救。
      - - 治理
        - 股权结构表和董事会权利
        - 管理层无法提供股权结构表、优先权条款、董事会会议纪要和关键人计划
        - 不对新资金出价。
      - - 市场炒作
        - 可比公司情绪和融资市场
        - 里程碑滑坡时，人形机器人同行估值下修，或硬件机器人融资窗口关闭
        - 使用估值下调轮条款，或回避。
    notes: 否决标准是尽调触发器，不是最终法律或经营结论。
