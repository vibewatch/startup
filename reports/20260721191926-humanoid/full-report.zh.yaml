        title: 订单簿是前瞻信号，不是已确认收入
        blocks:
          - type: paragraph
            body: >-
              最强的收入线索是订单簿：公开来源反复提到 34,000 个预订单、价值约 $2.4 billion，意味着折扣、软件、服务、税费和流失前每台机器人约 $70,600。这是有价值的需求指标，但不是已确认收入、ARR
              或毛利润。收入确认将取决于已签合同、交付与验收、取消权、定金、融资、保修，以及模式是硬件销售、租赁还是机器人即服务。Schaeffler 协议和 Bosch
              制造合作提升了工业客户正在参与的置信度，但公开证据仍不清楚 Bosch 是制造商、客户、1,000
              台订单对手方，还是三者皆是。合同条款得到审阅前，正确承保姿态是以订单簿驱动的上行空间，但带转化风险。因此，本章对已确认收入和 ARR
              使用明确空值，同时把订单簿信号作为管线指标保留。这样可以避免硬件尽调常见错误：在交付和服务经济已知之前，就按软件倍数资本化订单标题。
