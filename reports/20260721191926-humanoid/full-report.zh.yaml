  - id: TV003
    title: 可比估值表
    columns:
      - 可比对象
      - 2026 年估值 / 融资信号
      - 商业验证
      - 对 Humanoid 的意义
      - 局限性
    rows:
      - - Humanoid
        - $1.35B 投后估值；$152M Series A；累计融资 $270M
        - 34,000 份预订单；Schaeffler 和 Bosch 合作关系
        - 目标公司估值锚
        - 无已确认收入或利润率披露
      - - Figure AI
        - Series C 投后估值 $39B；承诺资本超过 $1B
        - BMW 生产与物流场景中的 Helix 证据
        - 人形机器人品类的上行可比对象
        - 资本基础大得多，美国平台能见度更高
      - - Apptronik
        - 超过 $935M Series A；据报道投后估值约 $5.3B
        - Apollo 借 Google/Mercedes/John Deere 投资人网络扩张
        - 更接近的私募轮可比对象
        - 公开收入披露仍有限
      - - Agility Robotics
        - S-4 流程，SPAC 路径预计总募资 >$620M
        - GXO 多年物流协议
        - 商业部署基准
        - 已审阅来源未清晰披露公开估值
      - - 1X
        - 报道称 NEO 以 $20,000 或订阅方式提供
        - 消费者预订单模式
        - 价格与打包信号
        - 家庭用例不同于工业 RaaS
      - - Sanctuary AI
        - 已审阅首页未披露当前估值
        - 工业具身 AI 定位
        - 定性工业可比对象
        - 公开估值数据不足
      - - Unitree
        - G1 标价 $13.5K 起；Walmart 相关报道引用 $21.6K 标价
        - 低成本硬件可得
        - 对 ASP 和商品化形成反向压力
        - 开发者 / 消费者硬件不同于工业服务机器人
      - - Tesla Optimus
        - 无法从 Tesla 上市公司估值中拆分
        - Tesla 内部战略项目
        - 战略威胁，也是招聘 / 注意力可比对象
        - 无法推导干净的私人人形机器人倍数
      - - Humanoid 市场 TAM
        - Goldman 预计到 2035 年 $38B；MarketsandMarkets 预计到 2035 年 $50.27B
        - 品类整体采用预测
        - 退出上限与市场拉动背景
        - TAM 不是公司收入
      - - 融资数据平台
        - PitchBook / Dealroom / Crunchbase / CB Insights 档案覆盖
        - 档案与生态发现
        - 未来刷新时的交叉核对来源
        - 公开页面不能替代私人股权结构表
      - - UBTECH
        - 已审阅来源无公开估值
        - 商业机器人和人形机器人组合
        - 与中国相关的竞争广度
        - 不是私募轮估值可比对象
    notes: 列举的是基于 runDate 可得公开来源的代表性同行 / 市场样本；私人二级市场估值标记可能缺失。
