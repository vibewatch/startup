              领投；具名共同投资人重要，因为其中几家不只是财务标识。Schaeffler 和 Bosch 带来工业验证和潜在制造杠杆；Fubon Financial Holding Venture Capital
              增加亚洲金融资本触达；Aglaé Ventures 通过 Silicon Republic 报道的 Arnault 相关载体提供奢侈品家族办公室信号。因此，估值标签不只是价格。它建立在一个主张上：Humanoid
              已经足够快地把资本与战略部署、制造关系配对，成为欧洲首个纯人形机器人独角兽。待解问题在经济层面：已审阅的公开来源均未给出董事席位、清算优先权、债务、老股交易、创始人稀释或现金跑道。
