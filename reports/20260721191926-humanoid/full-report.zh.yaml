      - - AI / VLA 和仿真进展
        - 驱动因素
        - 当前至中期
        - 提升任务泛化能力，降低编程负担
        - 要求现场数据，证明演示之外的任务成功率
      - - 执行器、电池、传感器和算力成本下降
        - 驱动因素
        - 中期
        - 可压缩回本周期，支撑舰队规模化
        - 审核 BOM、供应商集中度、质保假设和毛利率
      - - 生产回流和产业政策压力
        - 驱动因素
        - 中期
        - 提高本地工厂柔性自动化价值
        - 梳理受影响客户细分和资本开支预算
      - - ROI 和回本证明
        - 约束
        - 当下
        - 除非生产率超过人工、AMR 或固定自动化，采购会卡住
        - 要求站点级 ROI 模型和试点后实测吞吐量
      - - 安全认证和无围栏运行
        - 约束
        - 当下至中期
        - 限制人形机器人在工人周边作业的场景
        - 审查风险评估、ISO/OSHA 合规计划、事故历史和保险
      - - 可靠性、正常运行时间和可维护性
        - 约束
        - 当下
        - 正常运行时间低，会把 TAM 变成失败试点和高昂支持成本
        - 要求 beta 正常运行时间、平均故障间隔、服务人员配置和备件数据
      - - 电池续航和载荷限制
        - 约束
        - 当下
        - 在热插拔或充电运营成熟前，压缩可行班次和工作流
        - 将续航与班次长度、节拍要求对比
      - - 资本强度和供应链爬坡
        - 约束
