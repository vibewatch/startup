            body: >-
              UK Companies House 搜索有用，但不能一锤定音。可见的 HUMANOID LTD 记录显示一家存续私营公司、休眠账户，以及与机器人运营故事并不明显匹配的 SIC 代码 /
              高管细节。这可能意味着运营集团使用另一实体，近期进行了重组，或存在无法用显而易见搜索词找到的备案。财务上，这是重大缺口，因为公开线索无法验证现金、债务、收入、客户定金、集团内 IP
              所有权或优先股堆叠条款。因此，结论既不是由收入支撑，也不是纯粹投机：Humanoid
              有可信的战略融资、大额订单标题和制造伙伴，但承保情景取决于在下一次融资触发前，把预订单转化为已交付机器人并实现正贡献毛利。下一轮尽调应从实体确认和私有财务模型开始，而不是继续搜新闻。如果管理层能对备案、合同可执行性和贡献毛利做出对账，融资故事会更可承保；否则，估值主要仍是期权价值。
