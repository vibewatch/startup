      - number: '2.4'
        title: 影响采用速度的驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              核心需求驱动因素包括劳动力稀缺、人口老龄化、制造回流或产业政策压力、视觉-语言-动作模型进步，以及组件成本下降。BLS 的物料搬运和生产劳动力池足够大，可以创造有意义的自动化机会；IFR 和 WEF
              也把自动化与劳动力转型列为宏观主题。约束同样重要。买方必须看到相对人工、AMR
              和固定自动化的回本；安全认证必须支持无围栏运行；电池、执行器、传感器、计算和可维护性必须改善；资本强度仍然很高。反向解读不是人形机器人没有市场，而是 TAM
              估算假设可靠性、正常运行时间、成本和安全性会改善，但这些假设尚未在规模上被证明。估值工作之前，应把这些约束转成尽调里程碑：Beta
              续航相对班次长度、实测任务成功率、工人周边无事故小时、现场服务响应时间、组件交期，以及扣除保修和支持后的毛利率。没有这些里程碑，市场可以继续显得很可观，但收入转化仍可能令人失望。
            claimRefs:
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
