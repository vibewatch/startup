      - number: '5.6'
        title: 信任、安全、合规与技术风险清单
        blocks:
          - type: paragraph
            body: >-
              反向情景不是 Humanoid 缺少可信技术，而是人形机器人部署把难题压缩进一个会移动、很重、半自主的系统。IEEE Spectrum 的规模化批评强调电池寿命、可靠性、停机时间和安全标准；Robotics &
              Automation News 则强调，该品类距离通用自主仍很远。Humanoid
              自己的文章也强化了这一担忧：公司解释了为什么行为克隆和遥操作演示无法达到近乎完美的工业可靠性。公开尽调因此应聚焦安全案例、正式认证路径、干预率、MTBF、电池化学和热数据、保修 / 服务义务，以及 KinetIQ
              能否在多个班次中降低对遥操作的依赖，而不是只在一次 POC 中做到。在这些指标披露前，产品技术评级应是可信 Alpha，而不是已被证明的规模化平台。
