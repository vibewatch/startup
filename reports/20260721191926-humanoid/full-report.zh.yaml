  - id: FV001
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 低 / 基准 / 高三档估值区间，把 Series A 视作围绕当前 $1.35B 价格的里程碑期权。
    data:
      items:
        - label: 低情景
          low: 0.4
          high: 0.6
          value: 0.5
          unit: USD billions
          note: 发货延迟、订单流失、ASP 承压
        - label: 基准情景
          low: 1.1
          high: 1.6
          value: 1.35
          unit: USD billions
          note: 若里程碑落地，当前 Series A 价格仍算公允
        - label: 高情景
          low: 3
          high: 5
          value: 4
          unit: USD billions
          note: 规模化交付跑通，RaaS 经济性得到验证
    approximationNotes: 这些区间是基于公开同业估值标记和已披露 Series A 价格做的情景交叉校验，不是正式 DCF。
