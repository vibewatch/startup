        title: 护城河、威胁与现状替代品
        blocks:
          - type: paragraph
            body: >-
              持久优势可能来自工作流数据、客户集成权、安全证据和供应链执行，而不是单一头条人形机器人规格。这有利于拥有重复现场任务的公司：Agility 的周转箱处理、Figure 的 BMW 工作、Apptronik 的
              Robot Park 和客户数据计划，以及 Humanoid 的 Schaeffler/Bosch
              工业锚点。反向情景是，这些资产本身仍早。独立和半独立来源描述的行业仍充满原型、远程操作、赋能协议而非有约束力订单、供应链约束，以及前从业者的怀疑——他们认为工厂可能偏好更简单的自动化。Unitree 和
              UBTECH 从中国压低硬件价格；NEURA 和 Flexion 表明 Humanoid 并不是唯一的欧洲主张者；既有厂商也能继续扩展固定自动化、AMR 和协作机器人。Humanoid
