  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 边界：工业人形机器人，不是所有机器人
        blocks:
          - type: paragraph
            body: >-
              Humanoid
              的可投资市场应划在面向人为设计工作流的、具有人形形态的移动机器人上，即部署进工业和商业流程的机器人。该范围包括用于制造物流、线边物料移动、仓库周转箱或包裹处理、巡检，并最终用于零售或服务任务的双足或轮式人形机器人；在人形外形能让机器人使用既有空间和工具时，这些任务都在范围内。该范围不包括更广泛的工业机器人装机基础、围栏单元内的传统机械臂、AMR、传送带，以及专用固定自动化，除非把它们作为
              ROI 对比中的替代方案。这个边界重要，因为广义机器人统计会让市场看起来成熟，而人形机器人仍早期且商业上未被证明。Humanoid 自身定位和 Schaeffler
              关系都指向更窄的工业劳动力市场，而不是家庭消费机器人市场。实用检验标准是：机器人能否接下原本需要人走过工厂或仓库完成的工作，而不是它是否属于宽泛得多的机器人类别。因此，边界让 AMR
              和固定单元作为竞争基准可见，但不进入人形机器人 TAM 的分子。
