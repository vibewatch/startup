  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与按证据加权的买方图谱
        blocks:
          - type: paragraph
            body: >-
              Humanoid
              的客户证据范围很窄，但战略上连贯：公开楔子是汽车制造、电子制造和物流相邻工厂流程中的工业工作。买方通常是制造运营、自动化或数字工厂高管；用户是车间物流或生产团队；付款方是企业采购组织，评估劳动力可得性、吞吐量、正常运行时间和安全性。Schaeffler
              是锚定制造商，也是最强的收入质量证明点，因为公开来源描述了一项有约束力、分阶段的部署和供应协议。Bosch 最好归类为制造伙伴加 POC 对手方，而不是抓取到的公开记录中干净的终端客户订单。Siemens、SAP
              和 Martur Fompak 显示了来自工厂现场和汽车物流运营方的试点 / POC 需求。零售是公司声明的未来目标，但未找到具名公开零售客户，因此不应作为已证明需求承保。
