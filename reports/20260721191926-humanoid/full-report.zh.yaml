              核心尽调差异不是“有客户还是没客户”，而是有约束力部署与软性销售管线的差异。Schaeffler 的交易质量最好：Humanoid 和独立报道都称 5 月协议具有约束力、分阶段推进，首批德国系统计划在 2026
              年底前部署，并随时间形成四位数机器人集群。协议还给出明确运营范围——箱体处理、物流和生产规模验证——并采用 RaaS 模式，把客户价值与持续服务交付绑定。Bosch 商业上重要，但抓取来源更强调合同制造和成功
              POC，而不是单独记录的有约束力 1,000 台客户订单。Siemens 和 SAP/Martur Fompak 是有说服力的技术参考，但仍属于试点或概念验证证据。34,000 个预订单和约 $2.4
