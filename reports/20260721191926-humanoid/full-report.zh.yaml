      - number: '5.5'
        title: 差异化与可防守性
        blocks:
          - type: paragraph
            body: >-
              Humanoid 的差异化产品策略务实，而不是科幻式。公司优先选择轮式工业机器人、现场工厂工作流，以及能在轮式和双足形态之间复用学习的模块化架构。可防守性建立在四项资产上：自研 KinetIQ 软件，与
              SAP、Siemens Xcelerator 等企业系统的集成权，与 Schaeffler/Bosch/Siemens/Martur Fompak 的特权工业学习回路，以及垂直协调的制造 /
              供应商栈。风险在于，每项资产都需要规模化证明。NVIDIA 提供的关键赋能基础设施也可供其他机器人公司使用；按公开披露，Bosch 和 Schaeffler
              是战略伙伴，而不是自有工厂或独家组件来源；本次也未审阅专利资产。因此，护城河有合理性，但仍取决于执行。
