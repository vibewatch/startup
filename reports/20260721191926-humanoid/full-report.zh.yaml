        title: 封面 KPI、缺口与反向框架
        blocks:
          - type: paragraph
            body: >-
              封面事实应该有力度，但必须谨慎加限定。估值为 $1.35 billion，累计融资为 $270 million，最新融资是 $152 million Series A
              轮。总部和工程布局事实支撑较好。员工数不是：报告采用的标准区间约为 160–200，但抓取到的公开来源从超过 130 到超过 250 不等，因此任何精确员工数都应视为需要私有证据。客户牵引更敏感。报告基准使用
              34,000 个预订单、约 $2.4 billion；CNET 则报道约 25,000 个预订单和 6 个 Fortune 500
              试点。该差异应带入客户和估值章节。收入、ARR、毛利率、烧钱速度、现金跑道和股权结构经济条款仍未披露。因此，反向框架不是公司缺少动能，而是一家非常年轻、创始人主导、资本密集的机器人公司，在公开收入、交付质量或订单转化证据出现之前，就已经按独角兽估值定价。
