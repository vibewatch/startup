      - number: '7.4'
        title: 治理、地缘政治观感、市场周期风险与缓释
        blocks:
          - type: paragraph
            body: >-
              治理风险不来自某一条负面指控，而在于缺少通常用来降低关键人、股权结构、合规和执行不确定性的公开证据。公开报道把故事集中在创始人兼 CEO Artem
              Sokolov，以及公司两年内从想法冲到独角兽的速度上。Forbes 2
              月的标题用「前俄罗斯珠宝大亨」的视角包装他的背景；即便没有指称不当行为，制裁、出口管制、客户采购和外部观感尽调也因此更重要。本报告审阅的公开记录没有披露董事会构成、优先权结构、关键人保险、继任计划、制裁筛查或出口管制治理。市场周期风险同样真实：Ars、Vox、LA
              Times、Compare Robots 和 RoboHorizon 都提供了对人形机器人热潮、演示落差和部署难度的负面或怀疑背景。实际缓释办法是把叙事里程碑改成证据里程碑：已签且可执行的合同、安全文件、Beta
              正常运行时间、生产良率、供应商第二来源、治理文件和现金续航。任何一项不过关，都应触发价格重置或停止条件。
