    KinetIQ AI 大脑，面向制造和物流工作流销售。
  customerFocus: 制造、物流 / 仓储和零售领域的工业买方，以 Schaeffler、Bosch 等汽车和工业 OEM 为锚点。
  businessModel: 向工业客户销售人形机器人，并以机器人即服务方式部署；公司由垂直整合的硬件 + AI 栈和 Bosch 制造合作支撑，收入仍处于商业化前阶段。
