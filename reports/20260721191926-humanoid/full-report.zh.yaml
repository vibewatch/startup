  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 资本结构与估值信号
        blocks:
          - type: paragraph
            body: >-
              Humanoid 的财务画像是一家资金充足、处于早期商业化阶段的工业硬件公司：公司有大量股权缓冲、独角兽估值和战略投资人，但没有公开收入报表。最干净、相互印证的融资事实是 2026 年 Series A
              轮：独立报道显示，公司以 $1.35 billion 投后估值融资 $152 million，使披露的累计融资达到 $270 million。这意味着 Series A 轮前约融资 $118
              million，但公开记录无法清楚区分种子轮、过桥、SAFE、优先股或战略合同经济条款。因此，本章把 Series A 轮视为现金能力和验证，而不是单位经济证明。Schaeffler 和 Bosch
              在财务上重要，因为它们出现在故事两端：既是投资人或战略参与方，也是制造 /
              部署对手方。建模时，应把融资拆成已披露现金流入、未披露资本条款和战略期权价值。公开事实可以支持流动性情景，但没有文件就无法支持股价瀑布或优先股调整后估值。
