            body: >-
              下一轮尽调应以文件为主。媒体报道可以确认本轮融资、同业估值和合作伙伴公告，但回答不了优先权结构、客户取消权、定金覆盖、制造成本、保修敞口或运营实体对账。第一项投资条件，是证明 Schaeffler、Bosch
              和更广泛的预订单关系有足够约束力，能支撑生产融资。第二项是证明 HMND 01 能以可接受的正常运行时间跑付费工作流，且现场服务成本低于 RaaS 贡献毛利。第三项是价格韧性：Unitree
