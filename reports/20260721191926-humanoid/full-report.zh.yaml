  - id: FR001
    title: 风险热力图：可能性 × 影响
    type: matrix
    layout: wide
    summary: 商业转化、安全 / 监管、制造规模化和估值风险，都落在残余风险最高的象限。
    data:
      columns:
        - 影响：中
        - 影响：高
        - 影响：严重
      rows:
        - label: 可能性：高
          values:
            - 炒作周期预期回落
            - 预订单转化；订单额被错当收入
            - 实际部署中出现安全 / 可靠性故障
        - label: 可能性：中
          values:
            - 运行时利用率受限；治理观感
            - 制造良率；客户集中；算力分配
            - 出口管制或制裁造成采购阻断
        - label: 可能性：低
          values:
            - 一轮负面舆论周期
            - 个别供应商延期
            - 严重人形机器人安全事故 / 监管叫停
    approximationNotes: 定性评分把公开证据映射到相对可能性和影响，不是统计损失模型。
