  - id: TV006
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 2031 年经营假设
      - 估值逻辑
      - 指示性价值
      - 概率信号 / 触发项
    rows:
      - - 乐观
        - 交付或签约 50,000–100,000 台机器人；RaaS 附着强；工业正常运行时间已验证
        - 相对 Figure 打折的品类领导者，但较当前轮次有溢价
        - ~$4.0B 高情景
        - Schaeffler/Bosch 转化、毛利率验证、客户重复下单
      - - 基准
        - 累计 10,000–25,000 台机器人；部分订单额转化；硬件 / RaaS 经济性混合
        - 当前轮价格仍是合理期权价值
        - ~$1.35B 基准情景
        - 里程碑达成，但利润率和流失率仍未公开
      - - 悲观
        - 已验收机器人 <5,000 台；取消率高；ASP 压缩；beta 推出延迟
        - 与 IP 和人才绑定的估值下调轮期权价值
        - ~$0.5B 低情景
        - Q4 2026 beta 失败、定金薄弱、保修成本高
    notes: 情景价值是指示性交叉核对，不是 DCF；公开来源未披露单台利润率、流失率或 RaaS 利用率。
    claimRefs:
      - CV011
      - CV012
      - CV024
      - CV031
      - CV034
      - CV035
      - CV036
      - CV037
      - CV046
  - id: TV007
    title: 估值敏感性表
    columns:
      - 驱动因素
      - 下行情景输入
      - 基准情景输入
      - 上行情景输入
      - 估值影响
    rows:
      - - 预订单转化
        - 10%
        - 35%
        - 70%
        - 最大波动因素：预订不等于收入
      - - 平均实际 ASP
        - $35K
        - $70K
        - $100K
        - 影响收入池和价格压缩风险
      - - 扣除保修后的毛利率
        - 为负
        - 15%
        - 35%
        - 决定规模化是吞噬现金还是产生现金
      - - RaaS 利用率
        - 单班低利用
        - 混合班次
        - 多班高利用
        - 左右经常性经济性和回本周期
      - - 交付时点
        - 延至 2028+
        - 2027-2028 年爬坡
        - 2026 年 beta，2027 年部署
        - 改变资本需求和客户信心
      - - 同业倍数环境
        - 机器人下轮降估值行情
        - 当前私募估值标记
        - Figure / Apptronik 式溢价
        - 左右退出和下一轮估值
      - - 资本密集度
        - 车队融资不可得
        - 仅有战略支持
        - 资产融资可得
        - 决定规模化前的稀释
      - - Unitree 式 ASP 压力
        - 严重
        - 中等
        - 靠工业集成消化
        - 检验溢价防守
      - - 实体与合同清晰度
        - 未解决
        - 部分核验
        - 完全核验
        - 决定 IC 能否下投资判断
    notes: 敏感性区间是根据公开证据缺口推导的承做假设，并非管理层指引。
    claimRefs:
      - CV024
      - CV031
      - CV034
      - CV035
      - CV036
      - CV042
      - CV045
      - CV046
      - CV049
  - id: TV008
    title: 投资逻辑破裂触发项与最终尽调要求表
    columns:
      - 触发项或要求
      - 所需门槛 / 证据
      - 如何传导至投资逻辑
      - 行动含义
    rows:
      - - 合同可执行性
        - Schaeffler / Bosch / 订单簿条款、定金、取消权的签署文件
        - 把新闻口径预订转为可承做的积压订单
        - 仅在文件审查后推进
      - - Beta 推出
        - 2026 年 Q4 beta 机器人交付并获工业用户验收
        - 验证产品时点和客户接受度
        - 延误触发估值折扣
      - - 单位经济性
        - BOM、制造成本、保修准备金、毛利率、服务成本
        - 判断 RaaS 和硬件规模化是否产生现金
        - 没有毛利桥就不买入
      - - RaaS 融资
        - 车队所有权、租赁 / SPV 条款、利用率、正常运行时间 SLA
        - 可能带来经常性收入，也可能变成资本消耗
        - 要求融资方案
      - - 实体结构
        - 运营实体、IP 所有权、Companies House 核对
        - 影响法律所有权和股权结构表尽调
        - 解决前为阻断项
      - - 优先股堆叠
        - 清算优先权、期权池、反稀释、战略权利
        - 决定经济入场价格
        - 调整估值或放弃
      - - 竞争定价
        - Humanoid 能相对 Unitree 低成本硬件守住溢价的证据
        - 守住 ASP 和贡献利润率
        - ASP 坍塌则下调估值
      - - 同业估值标记压缩
        - Figure / Apptronik / Agility 估值重置或部署失败
        - 改变赛道退出倍数
        - 入场前重新定价
    notes: 这些尽调要求按其把新闻支撑的期权转化为可投资证券的能力排序。
    claimRefs:
      - CV015
      - CV024
      - CV031
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
      - CV049
