  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 价格敏感结论：跟踪，不能盲目投资测算
        blocks:
          - type: paragraph
            body: >-
              Humanoid 以 $1.35 billion 投后估值完成 $152 million Series
              A，可信度足以进入投委会观察名单，但公开收入支撑还不够，不能直接买入。支撑价格的是一套宏大战略叙事：欧洲第一家专注人形机器人的独角兽、累计 $270 million 资本基础、Schaeffler 与 Bosch
              关系，以及据报 $2.4 billion 的订单簿。反方同样重要。公开记录基本没有披露已确认收入和
              ARR，预订单数字应视为订单潜力，而不是可入账收入。也就是说，估值赌的是转化、交付、正常运行时间和制造规模，而不是今天财报的倍数。当前价格下，实际立场应是跟踪或继续研究；只有在合同可执行性、定金、贡献毛利和实体结构得到验证之后，才明确愿意承做投资测算。因此，本估值章节把每个头条都当作有条件输入：融资确认投资人愿意下注，合作关系确认产业兴趣，同业估值确认品类热度，但这些事实单独都不能证明收入可收回或现金流耐久。投资测算标准应是：客户接受可工作的机器人，在可执行条款下付款，且扣除制造、支持和保修成本后仍留下足够毛利，支撑下一轮部署。
