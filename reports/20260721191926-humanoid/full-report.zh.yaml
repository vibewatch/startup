      - number: '8.3'
        title: 情景估值是里程碑期权，不是传统 DCF
        blocks:
          - type: paragraph
            body: >-
              DCF 式框架仍然有用，但应作为情景纪律，而不是制造虚假的精确感。乐观情景给 Humanoid 的公开 2031 年 100,000 台目标、强 RaaS 附着和可信的工业软件 /
              服务层计入价值；如果客户接受度和毛利被证明成立，数十亿美元级结果可以成立。基准情景把本轮价格作为锚点，因为公开事实验证了战略需求，但没有验证出货经济性。悲观情景承认，硬件延迟、保修成本、低利用率和价格压缩，能很快把一个庞大的预订单数字变成下一轮降价融资。关键驱动不是
              TAM：Goldman、Morgan Stanley 和 MarketsandMarkets 都支持长期人形机器人市场很大。真正关键的是，在下一轮融资窗口前，Humanoid
              能交付、能收款、可支持且具备正贡献毛利的机器人份额。
