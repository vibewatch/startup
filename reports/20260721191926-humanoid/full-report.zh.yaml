      - number: '5.2'
        title: 架构：硬件、计算、KinetIQ 与集群学习
        blocks:
          - type: paragraph
            body: >-
              技术逻辑是垂直整合：Humanoid 把机器人底盘、模块化末端执行器、机载感知、NVIDIA 级边缘计算、仿真，以及自研 KinetIQ 控制和编排栈组合起来。对一家年轻硬件公司来说，KinetIQ
              的披露异常具体。它把集群编排、单机器人任务规划、VLA 位移操作和全身控制分成四层；披露的 System 1 与 System 0 频率为 10 Hz 和 50
              Hz，让尽调有了营销语言之外可测试的内容。随后，KinetIQ Ascend
              试图把操作从被动遥操作模仿推进到真实生产任务上的强化学习。这个方向令人鼓舞，因为公司承认行为克隆在速度和可靠性上的天花板；但也意味着自主成熟度取决于数据质量、干预捕捉、仿真到现实迁移和部署反馈回路，而这些仍大多是私有信息。
