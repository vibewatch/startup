    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品与布局
        blocks:
          - type: paragraph
            body: >-
              Humanoid 是一家 2024 年成立的英国 AI 与机器人公司，面向工业工作销售 HMND
              品牌人形劳动力，而不是把自己定位成实验室演示项目。这样一家年轻机器人创业公司，身份已经少见地具体：自有官网、产品页和融资报道都指向工业人形机器人、HMND 01 Alpha 系列，以及支撑机器人集群编排的自研
              AI 框架 KinetIQ。公司的运营足迹也足够清楚，可以作为后续报告的事实底座。总部在 London，Boston 和 Vancouver 则被描述为工程卫星团队或办公室。产品叙事有两个近期形态：面向工业部署的
              Alpha Wheeled，以及用于双足研发和未来应用的 Alpha Bipedal。公开参数支持 15 kg 载荷、29 个自由度和工业级移动速度，但一个产品规格细节仍有冲突：官方双足页面重复了部分共享
              Alpha 指标，独立摘要则采用双足版本 179 cm、90 kg、1.5 m/s 和三小时续航的标准值。
