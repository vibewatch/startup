        title: 格局与资本规模
        blocks:
          - type: paragraph
            body: >-
              工业人形机器人的竞争格局已不再是一组实验室项目，而是一场资本密集竞赛，参与者包括美国领先公司、中国相关硬件规模玩家，以及规模较小但越来越可见的欧洲集群。Figure 是估值离群点，Series C 轮投后估值达
              $39 billion，并有 BMW 工厂证明；Apptronik 则把最初公布的 Series A 轮扩展为超过 $935 million 的融资和约 $5 billion 估值。Agility
              看起来没那么膨胀，但通过 GXO、Amazon、Toyota 以及超过 100,000 个周转箱搬运，拥有最清楚的现场物流部署证明。在这个背景下，Humanoid 的 $152 million Series A
              轮、$270 million 累计融资和 $1.35 billion 估值，让它在欧洲具备可信度，但相对美国领导者仍偏小。战略问题在于，Schaeffler、Bosch 和轮式优先设计能否转化为比 Figure
              和 Apptronik 大额融资更快的工业学习。这一顺序也把尽调重点放在部署速度，而不是新闻稿数量。
