        - 专门的“大脑” / 软件切入角度
        - 在已披露工业锚定客户上比 Humanoid 更早期
      - - 传统固定自动化 / AMR
        - 现状替代方案
        - 既有资本开支预算和装机基础
        - 非人形机器人和输送线
        - 仓库 AMR 和工业机器人已经嵌入
        - 窄任务技术风险更低
        - 对人类空间中的移动操作灵活性较弱
      - - OEM 内部自建
        - 买方自有替代方案
