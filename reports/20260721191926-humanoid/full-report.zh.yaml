        title: 可比公司和隐含倍数显示估值偏紧，但并非不理性
        blocks:
          - type: paragraph
            body: >-
              同业样本解释了为什么这个估值既偏紧，也说得过去。Figure 的 $39 billion Series C 和 Apptronik 据报超过 $5 billion
              的估值，把人形机器人推成资本军备竞赛品类；放在这些标尺旁边，Humanoid 的 $1.35 billion 显得不算夸张。但从运营证据看，画面就没那么宽松。Figure 有 BMW 生产证据，Apptronik
              资本基础大得多，Agility 已有真实物流部署。Humanoid 最强的公开指标是据报 $2.4 billion 的预订单簿，对应估值约为订单额的 0.56 倍、每份预订单约
