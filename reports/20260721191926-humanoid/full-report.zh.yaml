              既是优势，也是集中度风险：它是最大的公开部署、战略技术伙伴和首选执行器供应商。如果关系顺利转化，它会变成客户引用飞轮；如果生产经济不达预期，它会同时威胁客户证明、供应链可信度和投资人叙事。Bosch
