      - number: '2.2'
        title: 规模测算：区间很宽，口径很多
        blocks:
          - type: paragraph
            body: >-
              这个市场很大，但数字尚未收敛。2026 年当前市场口径在 MarketsandMarkets、Fortune、Axis 和 Coherent 数据中集中于 USD 5.4-6.4 billion 左右，但
              Precedence 明显更低，Global Market Insights 明显更高。2035 年终点分歧更大：Precedence 只有 USD 8.78 billion，Goldman Sachs 给出
              USD 38 billion，MarketsandMarkets 达到 USD 50.27 billion，Global Market Insights 达到 USD 192.7 billion。Morgan
              Stanley 到 2050 年 USD 5 trillion 的测算，更像生态系统和长周期采用情景，不应作为近期产品市场规模输入。Humanoid 需要先把 SAM
              收窄到工业和商业工作流，再套用份额假设；SOM
              应绑定经过验证的伙伴部署、制造产能、正常运行时间和订单转化，而不是整个人形机器人梦想。这种矛盾不是写作错误，而是核心尽调点。高增长预测假设成本快速下降、供应商产能跟上、安全性被接受，以及客户愿意把人形机器人集群标准化；较低预测则意味着工作流认证更慢，且更便宜的任务专用自动化会替代更多需求。
