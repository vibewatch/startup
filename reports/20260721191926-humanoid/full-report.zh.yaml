      - - 订单额口径
        - 34,000 份预订单和 $2.4B 订单簿带来很大的转化期权
        - 定金很小、可取消，或高度集中
      - - 同行估值膨胀
        - Figure 和 Apptronik 的估值标记让 $1.35B 在品类内显得温和
        - 同行估值标记压缩，或无法转化为部署
      - - 市场 TAM
        - Goldman、Morgan Stanley 和 MarketsandMarkets 勾勒出庞大的长期市场
        - 工业买家推迟采用，或安全约束拖慢部署
      - - 收入质量
        - 若正常运行时间高，RaaS 可能形成经常性经济性
        - 车队融资和现场服务吃掉贡献毛利
      - - 价格压缩
        - Unitree 价格锚挑战高端 ASP 假设
        - Humanoid 证明工业可靠性和集成价值足以支撑溢价
      - - 证据质量
        - 官方和高可信来源相互印证融资
        - 私下尽调无法验证实体、收入或客户条款
    notes: 论点有意成对呈现投资逻辑与反向逻辑，因为估值对里程碑敏感。
