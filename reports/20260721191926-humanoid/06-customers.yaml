  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: contract terms
    missingEvidence: Signed Schaeffler, Bosch and customer-site agreements with binding volume, cancellation rights, deposits,
      service levels and acceptance criteria.
    whyItMatters: Deal quality determines whether public traction is backlog, pipeline, or marketing interest.
    diligencePath: Request executed agreements and a contract summary schedule from management; reconcile to board pipeline
      reports.
    relatedQuestionRefs:
    - QU005
    - QU011
    - QU018
    relatedTableRefs:
    - TU003
  - type: conflicting-data
    severity: material
    topic: conflicting unit attribution
    missingEvidence: Primary confirmation of whether Bosch has a separate approximately 1,000-unit customer order or whether
      the 1,000-plus unit figure belongs to Schaeffler.
    whyItMatters: Misattributing unit volume changes customer concentration and conversion assumptions.
    diligencePath: Ask management for counterparty-level signed units and expected shipment schedule; verify with Bosch and
      Schaeffler reference calls.
    relatedQuestionRefs:
    - QU014
    - QU018
  - type: conflicting-data
    severity: minor
    topic: pre-order count variance
    missingEvidence: Timestamped management pipeline export showing current 34,000 pre-orders, historical 20,000 references
      if any, deposits, cancellations and customer identities.
    whyItMatters: The valuation narrative relies on a large pre-order book, but public sources do not independently verify
      the number.
    diligencePath: Audit CRM/order book, deposit ledger and cancellation terms; reconcile 20,000-versus-34,000 variance.
    relatedQuestionRefs:
    - QU027
    - QU028
    - QU034
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, customer satisfaction, renewal, uptime SLA compliance and post-POC conversion cohorts.
    whyItMatters: Robotics-as-a-Service economics depend on durable uptime and renewal, not one-time announcements.
    diligencePath: Request cohort dashboard and at least four customer reference calls covering Schaeffler, Bosch, Siemens
      and Martur Fompak.
    relatedQuestionRefs:
    - QU029
    - QU035
    relatedTableRefs:
