figures:
- id: FU001
  title: Customer Journey Map
  type: journey-map
  layout: wide
  summary: Enterprise customers progress from POC and integration to RaaS production deployment; Humanoid’s public evidence
    is still concentrated before broad renewal.
  approximationNotes: Stages are evidence-weighted from public customer announcements; durations and conversion rates are
    not disclosed.
  data:
    items:
    - id: stage-discovery
      label: Industrial pain / discovery
      actor: Manufacturing automation buyer
      description: Customer identifies labor, throughput or ergonomics problem in factory logistics and evaluates humanoid
        form factor.
      channels:
      - Homepage partner proof
      - Industrial press
      - Partner referral
    - id: stage-poc
      label: POC / pilot
      actor: Plant operations + Humanoid integration team
      description: Single workflow is tested, such as Bosch intralogistics, Siemens tote handling, or Martur Fompak KLT box
        movement.
      channels:
      - On-site test
      - SAP or Siemens integration
      - NVIDIA simulation support
    - id: stage-contract
      label: Commercial contracting
      actor: Procurement and legal
      description: Buyer moves from pilot to binding phased deployment or RaaS services contract; Schaeffler is the public
        anchor.
      channels:
      - RaaS agreement
      - Master services agreement
      - Site SOW
    - id: stage-production
      label: Production deployment
      actor: Factory operations
      description: Robots perform repeated logistics tasks with uptime, throughput and safety requirements in live operations.
      channels:
      - Fleet management
      - Maintenance and support
      - Plant IT integration
    - id: stage-expansion
      label: Expansion / renewal
      actor: Enterprise account owner
      description: Successful site expands to more robots, more workflows or more sites; public renewal data is not yet disclosed.
      channels:
      - Expansion option
      - Reference call
      - New workflow scope
    - id: stage-feedback
      label: Data and model feedback
      actor: Humanoid + strategic partners
      description: Operating data feeds KinetIQ, actuator requirements and integration playbooks for the next wave of deployments.
      channels:
      - KinetIQ updates
      - Actuator partnership
      - Customer success loop
