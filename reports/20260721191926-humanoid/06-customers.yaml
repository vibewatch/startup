- id: SU-section-retention-concentration
  title: Retention, expansion and concentration risks
  body: 'No public source reviewed discloses NRR, GRR, churn, customer satisfaction, renewal rate, ARR, revenue run-rate or
    recognized revenue from Humanoid’s customer base. That means customer durability must be inferred from counterparty quality,
    integration depth and the presence or absence of measured outcomes. Schaeffler is both a strength and a concentration
    risk: it is the largest public deployment, a strategic technology partner and preferred actuator supplier. If the relationship
    converts cleanly, it becomes a reference flywheel; if production economics disappoint, it threatens customer proof, supply-chain
    credibility and investor narrative simultaneously. Bosch also creates dependence because Humanoid’s scale-up depends on
    an external manufacturing partner. The open diligence asks are straightforward: signed contract schedules, deposits, cancellation
    terms, fleet acceptance milestones, service-level commitments, top-customer revenue concentration, renewal cohorts and
    post-POC conversion pipeline.'
  claimRefs:
  - CU009
