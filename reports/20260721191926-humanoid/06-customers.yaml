- id: SU-section-adverse
  title: Adverse evidence and skepticism on humanoid deployment risk
  body: 'Adverse sources do not negate Humanoid’s traction, but they constrain how much credit to assign today. VaaSBlock
    argues the sector has improved materially yet still faces a large gap between current pilot capability and the autonomous
    general-purpose humanoid worker implied by marketing. Physical AI Guide distinguishes announcements, orderability and
    feasibility plans from active pilots or broad deployments. IoT Digital Twin PLM adds a methodological warning: vendor
    and press figures are not independently audited. The Next Web applies that caution directly to Humanoid by noting that
    the 34,000 pre-order claim is not independently verified. These sources support a disciplined haircut: Schaeffler can
    be treated as the anchor commercial agreement, Siemens/SAP/Bosch as customer-quality pilots or POCs, and the broader pre-order
    book as pipeline until converted into binding deployments and recognized revenue.'
  claimRefs:
  - CU022
