company:
  name: Humanoid
chapter:
  number: 6
  title: Customers
  summary: Humanoid has unusually strong named industrial logos for a two-year-old robotics company, but only Schaeffler currently
    reads as a high-quality public commercial agreement. Bosch, Siemens, SAP/Martur Fompak and NVIDIA improve proof quality
    across manufacturing, integration and ecosystem credibility, while the 34,000 pre-orders worth approximately $2.4B remain
    a softer, unverified pipeline signal until converted into binding deployments and revenue.
sections:
- id: SU-section-segmentation
  title: Customer segmentation and evidence-weighted buyer map
  body: 'Humanoid’s customer evidence is narrow but strategically coherent: the public wedge is industrial work in automotive
    manufacturing, electronics manufacturing and logistics-adjacent factory flows. The buyer is typically a manufacturing
    operations, automation or digital-factory executive; the user is the shop-floor logistics or production team; and the
    payer is an enterprise procurement organization evaluating labor availability, throughput, uptime and safety. Schaeffler
    is the anchor manufacturer and strongest revenue-quality proof point because public sources describe a binding, phased
    deployment and supply agreement. Bosch is best classified as manufacturing partner plus POC counterparty, not a clean
    end-customer order in the fetched public record. Siemens, SAP and Martur Fompak show pilot/POC pull from factory-floor
    and automotive logistics operators. Retail is a stated future target, but no named public retail customer was found, so
    it should not be underwritten as proven demand.'
  claimRefs:
  - CU001
  - CU002
  - CU027
  - CU028
  - CU037
  - CU044
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: SU-section-deal-quality
  title: 'Deal quality: Schaeffler is materially different from the pre-order book'
  body: 'The central diligence distinction is not “customers versus no customers,” but binding deployment versus soft pipeline.
    Schaeffler has the best deal quality: Humanoid and independent coverage call the May agreement binding and phased, with
    first German systems planned before year-end 2026 and a four-digit fleet over time. The agreement also has explicit operating
    scope — box handling, logistics and production-scale validation — and a RaaS model that ties customer value to sustained
    service delivery. Bosch is commercially important, but the fetched sources emphasize contract manufacturing and a successful
    POC more than a separately documented binding 1,000-unit customer order. Siemens and SAP/Martur Fompak are compelling
    technical references but remain pilot or proof-of-concept evidence. The 34,000 pre-orders and approximately $2.4 billion
    pipeline are useful demand signals, yet should be haircut until management discloses deposits, cancellation rights, conversion
    rates, customer identities and revenue recognition timing.'
