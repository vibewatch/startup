- id: TI008
  title: Capital Adequacy and Public Financial Gaps
  columns:
  - Topic
  - Public evidence
  - Financial implication
  - Severity
  - Next diligence step
  rows:
  - - Cash on hand
    - Total raised $270M; current balance undisclosed
    - Cannot know actual runway after prior spend and fees
    - Material
    - Bank statements, treasury schedule, and post-close cash balance
  - - Monthly burn
    - Not disclosed; scenario ranges only
    - Next financing timing is unknowable without burn
    - Material
    - Monthly cash flow by payroll, R&D, tooling, inventory, and pilots
  - - Runway scenario
    - $152M supports ~24–36 months at $4–6M/month or ~15–25 months at $6–10M/month
    - Useful sensitivity, not management guidance
    - Material
    - Board plan with hiring, capex, component prepayments, and revenue receipts
  - - Debt / project finance
    - null
    - Could be needed for RaaS fleet financing
    - Material
    - Debt facilities, leasing SPVs, liens, covenants, and recourse
  - - Companies House record
    - HUMANOID LTD dormant filings/SIC mismatch
    - Entity identity and operating-company financials are unresolved
    - Material
    - Confirm legal entity, group structure, IP owner, and audited accounts
  - - Cap table / preferences
    - Not available in accessible databases
    - Valuation headline may hide preference economics
    - Material
    - Financing documents, liquidation preference, anti-dilution, warrants, side letters
  - - Customer concentration
    - Large agreements are concentrated around Schaeffler/Bosch/Fortune 500 pilots
    - Bookings may depend on few industrial counterparties
    - Material
    - Customer-by-customer backlog and concentration schedule
  notes: Capital adequacy is framed as a scenario because actual cash, burn, debt, and cap-table terms are undisclosed.
