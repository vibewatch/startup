- id: TI004
  title: Humanoid Hardware Cost Structure
  columns:
  - Cost bucket
  - Public evidence / proxy
  - Margin pressure
  - Diligence ask
  rows:
  - - Actuators
    - K2 Capital estimates actuators at 30–50% of humanoid cost
    - High BOM concentration and supplier risk
    - Supplier quotes, make/buy split, yield, and cost-down roadmap
  - - Compute and AI hardware
    - Product materials cite NVIDIA/Intel-class compute stack in the shared brief
    - High upfront cost and refresh risk
    - SKU-level compute BOM and obsolescence assumptions
  - - Sensors and perception
    - Industrial robotics requires cameras, force/torque, safety, and calibration stack
    - Medium-to-high reliability and calibration cost
    - Sensor BOM, calibration labor, replacement rate
  - - Mechanical frame and batteries
    - Robot mass/payload demands structure, batteries, thermal design, and endurance
    - Medium; drives shipping and service cost
    - Battery cycle life, frame yield, shipping and install cost
  - - Manufacturing and test
    - Bosch partnership moves production toward contract manufacturing
    - May reduce capex but not inventory financing
    - Contract manufacturing agreement, tooling ownership, MOQ, and warranty split
  - - Field service / warranty
    - Industrial deployments require uptime, support, spares, and safety response
    - Can erase gross margin if early reliability is weak
    - SLA terms, MTBF, support headcount, spares reserves
  notes: Cost buckets are public-proxy categories; Humanoid has not disclosed BOM, COGS, warranty reserves, or gross
    margin.
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI037
- id: TI005
  title: Revenue Streams and Recognition Tests
  columns:
  - Stream
  - Mechanism
  - Current public status
  - Revenue quality
  - Diligence ask
  rows:
  - - Robot hardware sale
    - Unit sale on delivery and acceptance
    - Order book exists; deliveries not publicly recognized as revenue
    - Potentially high ticket but lumpy
    - Executed PO, invoice, acceptance, payment, warranty terms
  - - Robot-as-a-service / lease
    - Recurring fee per robot/time/output
    - Not publicly disclosed as live contract model
    - Could improve adoption but extends payback
    - Lease contracts, utilization, residual value, financing cost
  - - KinetIQ / AI software
    - Software embedded in robot or sold as capability tier
    - Proprietary AI brain described publicly; pricing not disclosed
    - Potential margin lever if separately monetized
    - Price list, attach rate, data rights, upgrade terms
  - - Maintenance and support
    - SLA, spares, field service, uptime guarantees
    - No public margin or attach-rate data
    - Necessary but can be margin dilutive early
    - SLA penalty terms, support cost per deployed robot
  - - Integration / POC fees
    - Paid pilots and workflow integration
    - POCs/deployments publicly described but economics undisclosed
    - Good validation if paid; weak if free pilots
    - Pilot invoices, conversion rate, CAC/payback proxy
  - - Manufacturing / partner economics
    - Bosch and Schaeffler reduce go-to-market and supply friction
    - Strategic proof, not direct revenue disclosure
    - Can reduce capex but may require commitments
    - Partner terms, exclusivity, volume rebates, component pricing
  notes: Revenue streams are mechanisms to diligence; none should be modeled as realized revenue without private
    contract evidence.
