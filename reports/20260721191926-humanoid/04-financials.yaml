  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: funding
    missingEvidence: Complete round-by-round cap table including seed, bridges, SAFEs, option pool, preference stack,
      liquidation preferences, warrants, side letters, and secondary sales.
    whyItMatters: The $1.35B headline valuation is not enough to price investor economics or downside preference
      risk.
    diligencePath: Request executed financing documents and a fully diluted cap table from counsel; reconcile with
      PitchBook, Dealroom, and Companies House filings.
    relatedQuestionRefs:
    - QI005
    - QI006
    - QI026
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition
    missingEvidence: Customer contracts for the 34,000 pre-orders, including deposit, cancellation, price, delivery,
      acceptance, warranty, and financing terms.
    whyItMatters: Bookings cannot be converted into recognized revenue or ARR without enforceability and delivery
      evidence.
    diligencePath: Sample the top 20 orders by value, tie them to invoices or deposits, and build a conversion cohort
      by customer and SKU.
    relatedQuestionRefs:
    - QI002
    - QI007
    - QI013
    - QI024
    relatedTableRefs:
    - TI003
    - TI006
  - type: conflicting-data
    severity: material
    topic: bosch-order
    missingEvidence: Public or private documentation resolving whether Bosch is only a manufacturing partner or
      also a roughly 1,000-unit customer/order counterparty.
    whyItMatters: A customer order has different revenue quality and concentration implications than a contract-manufacturing
      relationship.
    diligencePath: Obtain the Bosch MSA/POC statement of work and any purchase order; reconcile it with Schaeffler
      order documents and management pipeline data.
    relatedQuestionRefs:
    - QI009
    - QI010
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: SKU-level BOM, COGS, warranty reserve, field-service staffing, software attach, and gross-margin
      bridge.
    whyItMatters: Humanoid’s valuation depends on manufacturing robots at attractive contribution margin, not merely
      taking orders.
    diligencePath: Review supplier quotes, Bosch manufacturing economics, yield reports, and actual pilot service
      tickets for the first 50 units.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI021
    relatedTableRefs:
    - TI004
    - TI007
  - type: missing-source
    severity: material
    topic: burn-runway
    missingEvidence: Cash balance after the Series A, monthly burn, committed component purchases, tooling capex,
      debt, leases, and project-finance obligations.
    whyItMatters: The company could be well funded or still financing-dependent depending on manufacturing ramp
      speed and working-capital terms.
    diligencePath: Request a 24-month cash plan, board-approved budget, purchase commitments, debt schedules, and
      scenario bridge from headcount to unit deliveries.
    relatedQuestionRefs:
    - QI015
    - QI018
    - QI023
    relatedTableRefs:
    - TI008
  - type: conflicting-data
    severity: material
    topic: companies-house-identity
    missingEvidence: Confirmed legal operating entity, group chart, IP owner, and audited/management accounts matching
      the robotics company.
    whyItMatters: The obvious Companies House result has dormant accounts and non-robotics SIC/officer data, so
      it cannot be treated as the operating company’s financial filing without confirmation.
    diligencePath: Ask management for legal entity names/numbers, shareholder register, intercompany agreements,
      and the operating company’s statutory filings.
    relatedQuestionRefs:
    - QI016
    relatedTableRefs:
    - TI008
  - type: access-blocked
    severity: minor
    topic: database-access
    missingEvidence: Full PitchBook, Crunchbase, Tracxn, Bloomberg, FT, Reuters, and Sifted records or archive copies
      where access was blocked or pages returned errors.
    whyItMatters: These databases may contain financing, headcount, or investor details that would refine the funding
      chronology but are not available from accessible fetches.
    diligencePath: Use institutional subscriptions or management-provided exports; re-fetch and refresh the evidence
      ledger before final underwriting.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI001
    - TI008
  - type: private-evidence-only
    severity: material
    topic: raas-model
    missingEvidence: Robot-as-a-service contract terms, fleet financing costs, utilization floors, residual value
      assumptions, and service-level penalties.
    whyItMatters: A RaaS model can improve customer adoption but increases working-capital needs and delays cash
      payback.
    diligencePath: Request all RaaS proposals and signed contracts; calculate cohort payback under low/base/high
      utilization and warranty-cost cases.
    relatedQuestionRefs:
    - QI025
    - QI023
    relatedTableRefs:
    - TI005
    - TI007
