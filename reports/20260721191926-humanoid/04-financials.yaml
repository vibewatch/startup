company:
  name: Humanoid
chapter:
  number: 4
  title: Financials
  summary: Humanoid has raised $270M, including a $152M Series A at a $1.35B post-money valuation, but public evidence
    supports bookings and strategic validation rather than recognized revenue. The underwriting case turns on conversion
    of 34,000 pre-orders into delivered robots with positive hardware contribution margin, while revenue, gross
    margin, burn, runway, debt, and statutory operating-entity filings remain diligence gaps.
sections:
- id: funding-capital-structure
  title: Capital structure and valuation signal
  body: 'Humanoid’s financial profile is that of a heavily funded, early-commercial industrial hardware company:
    the company has a large equity cushion, a unicorn valuation, and strategic investors, but no public revenue
    statements. The cleanest corroborated financing fact is the 2026 Series A: independent coverage reports a $152
    million raise at a $1.35 billion post-money valuation, bringing reported lifetime capital to $270 million. That
    implies roughly $118 million was raised before the Series A, but the public record does not cleanly separate
    seed, bridge, SAFE, preference, or strategic-contract economics. This chapter therefore treats the Series A
    as cash capacity and validation, not as proof of unit economics. Schaeffler and Bosch matter financially because
    they appear on both sides of the story: investors or strategic participants and also manufacturing/deployment
    counterparts. For modeling, the financing should be separated into disclosed cash inflow, undisclosed capital
    terms, and strategic-option value. The public facts can support liquidity scenarios, but they cannot support
    a share-price waterfall or preference-adjusted valuation without documents.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI006
  - CI007
  - CI008
  - CI041
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
  - FI002
- id: bookings-revenue-quality
  title: Bookings are the forward signal, not recognized revenue
  body: 'The strongest top-line signal is the order book: public sources repeat 34,000 pre-orders worth about $2.4
    billion, which implies roughly $70,600 per robot before discounts, software, services, taxes, and churn. That
    is a valuable demand indicator, but it is not recognized revenue, ARR, or gross profit. Revenue recognition
    will depend on signed contracts, delivery and acceptance, cancellation rights, deposits, financing, warranties,
    and whether the model is hardware sale, lease, or robot-as-a-service. The Schaeffler agreement and Bosch manufacturing
    partnership improve confidence that industrial customers are engaging, yet the public evidence still has ambiguity
    around whether Bosch is a manufacturer, customer, 1,000-unit order counterparty, or all three. Until contract
    terms are reviewed, the correct underwriting posture is bookings-led upside with conversion risk. The chapter
    therefore uses explicit nulls for recognized revenue and ARR while preserving the bookings signal as a pipeline
    metric. This avoids the common hardware diligence error of capitalizing order headlines at software multiples
    before delivery and service economics are known.'
  claimRefs:
  - CI010
  - CI011
