    - Pilot / proof signals
    - Good sales-efficiency proxy
    - POC-to-paid conversion, cycle length, and expansion economics
  - - Beta customer robots
    - Planned later in 2026
    - Future delivery trigger
    - Not current revenue
    - Acceptance milestones and warranty obligations
