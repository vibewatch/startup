  title: Regulatory / Legal Risk Register
  columns:
  - Rule / source
  - Jurisdiction
  - Risk status
  - Likelihood
  - Impact
  - Mitigation
  - Residual exposure
  - Diligence path
  rows:
  - - ISO 10218-1 industrial robot safety
    - Global standard / customer requirement
    - Applicable to industrial-robot machine safety case
    - High
    - High
    - Map HMND 01 hazards, control architecture, E-stops, validation tests, and integrator responsibilities to ISO 10218-1.
    - Material until third-party safety case and integrator sign-off are shown.
    - Request safety file, risk assessment, test evidence, and integrator acceptance documents.
  - - ISO/TS 15066 collaborative robots
    - Global technical specification
    - Relevant if robots operate near people or in collaborative modes
    - High
    - High
    - Define collaborative operating modes, force/power limits, separation monitoring, and site-specific task envelopes.
    - Material because humanoids work in human-designed spaces.
    - Request collaborative-operation risk assessment, guarding design, and worker trial logs.
  - - EU Machinery Regulation 2023/1230
    - European Union / EEA
    - New machinery legal framework affects placing machines on EU market
    - Medium
    - High
    - Maintain conformity-assessment plan, essential health and safety requirements matrix, and technical documentation.
    - High for European factory deployments until CE path is evidenced.
    - Request CE strategy, EU declaration of conformity draft, notified-body view if applicable.
  - - CE marking obligations
    - European Economic Area
    - Manufacturers must complete assessment, technical file, declaration, and CE marking
    - Medium
    - High
    - Assign manufacturer/importer/distributor duties across Humanoid, Bosch, Schaeffler, and customers.
    - Material if responsibilities are split across partners.
    - Review supply and deployment contracts for CE responsibility allocation.
  - - OSHA robotics workplace hazards
    - United States customer sites
    - No robot-specific OSHA standard, but robotics hazard recognition and machine guarding apply
    - Medium
    - High
    - Site hazard analysis, guarding, LOTO, training, incident reporting, and emergency stop procedures.
    - Material for U.S. pilots because workplace safety liability sits with deployment.
    - Request U.S. pilot safety plan and customer EHS sign-off.
  - - Export controls, deemed exports, sanctions optics
    - U.S., UK, EU, cross-border teams
    - Controlled technology and Russia-related optics can affect compute, code, hiring, and customers
    - Medium
    - High
    - Export classification, restricted-party screening, deemed-export review, and governance records.
    - Material until compliance process is documented.
    - Request export-control memo, sanctions screening, customer-country list, and board oversight minutes.
  notes: 'Enumeration is partial: it covers the publicly evident legal and safety regimes most relevant to industrial humanoid
    deployments, not a full legal opinion for every target country.'
