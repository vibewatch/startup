- id: governance-market-risk-and-kill-criteria
  title: Governance, geopolitical optics, market-cycle risk, and mitigations
  body: 'The governance risk is not a single adverse allegation; it is the absence of public evidence that would normally
    reduce key-person, cap-table, compliance, and execution uncertainty. Public coverage centers the story on founder-CEO
    Artem Sokolov and the speed of going from idea to unicorn in two years. Forbes’ February headline frames his background
    through a former Russian jewelry magnate lens, which makes sanctions, export-control, customer-procurement, and optics
    diligence more important even if no wrongdoing is alleged. The public record reviewed here does not disclose board composition,
    preference stack, key-person insurance, succession planning, sanctions screening, or export-control governance. Market-cycle
    risk is equally real: Ars, Vox, LA Times, Compare Robots, and RoboHorizon all supply adverse or skeptical context on humanoid
    hype, demo gaps, and the hard work of deployment. The practical mitigation is to convert narrative milestones into evidence
    milestones: signed enforceable contracts, safety files, beta uptime, production yield, supplier second sources, governance
    documents, and cash runway. Failure on any of those should trigger a price reset or stop condition.'
