  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: preorders
    missingEvidence: Signed order book by counterparty, deposits, cancellation rights, delivery dates, acceptance criteria,
      and revenue-recognition treatment.
    whyItMatters: The largest commercial upside could otherwise be non-binding demand or marketing pipeline rather than cash-converting
      backlog.
    diligencePath: Request the top-20 order contracts, amendments, deposit ledger, cancellation schedule, and accounting memo;
      reconcile to the 34,000-unit headline.
    relatedQuestionRefs:
    - QR003
    - QR005
    - QR006
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: safety-certification
    missingEvidence: CE technical file, ISO 10218/15066 mapping, site risk assessments, third-party safety review, incident
      and near-miss logs.
    whyItMatters: A humanoid working near people can be blocked by customers, regulators, insurers, or worker representatives
      even if the robot performs technically.
    diligencePath: Obtain the safety case, EHS sign-offs, incident register, and certification plan for each EU and U.S. pilot
      site.
    relatedQuestionRefs:
    - QR010
    - QR011
    - QR012
    - QR033
    relatedTableRefs:
    - TR001
    - TR003
  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-legal-risk-register
    missingEvidence: Country-by-country legal analysis for every planned deployment jurisdiction, including privacy, cybersecurity,
      labor, product liability, and local machinery rules.
    whyItMatters: The table covers the most visible robotics safety and export regimes but does not replace local counsel
      for each rollout.
    diligencePath: Have counsel produce a jurisdiction matrix for Germany, UK, U.S., Canada, and any Schaeffler/Bosch deployment
      countries.
    relatedQuestionRefs:
    - QR032
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Cap table, preference stack, board composition, side letters, key-person plan, sanctions screening, and
      export-control governance.
    whyItMatters: Governance and compliance opacity can change downside economics, customer procurement risk, and the ability
      to finance hardware scale-up.
    diligencePath: Run legal diligence on charter, investor rights, board minutes, compliance policies, D&O insurance, and
      restricted-party screening records.
    relatedQuestionRefs:
    - QR023
    - QR024
    relatedTableRefs:
    - TR005
    - TR007
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: Fleet uptime, intervention rate, teleoperation usage, task success by workflow, battery duty cycle, MTBF,
      maintenance cost, and warranty reserve by deployment.
    whyItMatters: Robot autonomy and reliability determine customer acceptance, gross margin, service burden, and whether
      bookings become durable revenue.
    diligencePath: Request beta trial logs, raw telemetry exports, customer acceptance certificates, and service tickets for
      every named deployment.
    relatedQuestionRefs:
    - QR007
    - QR008
    - QR009
    - QR033
    relatedTableRefs:
    - TR003
    - TR008
  - type: conflicting-data
    severity: material
    topic: commercial-scale
    missingEvidence: Board-approved commercial pipeline reconciliation tying 34,000 pre-orders, Schaeffler deployments, any
      Bosch unit commitment, and other partner proofs to named legal entities.
    whyItMatters: Public sources and briefs describe overlapping partner roles; without reconciliation, investors may double-count
