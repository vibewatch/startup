- id: TR006
  title: Scenario and Valuation Risk Table
  columns:
  - Scenario
  - Trigger pattern
  - Probability signal
  - Risk transmission
  - Investment action
  rows:
  - - Bull
    - Contracts prove deposits, cancellation protection, CE path, beta uptime, and Bosch/Schaeffler volume readiness.
    - Multiple accepted deployments and positive unit contribution.
    - Bookings convert to credible revenue and valuation becomes milestone-supported.
    - Continue diligence and consider pro-rata if price is milestone-adjusted.
  - - Base
    - Pipeline remains large but contract terms, safety file, and unit economics stay private through beta rollout.
    - Some pilots expand, but no public fleet economics.
    - Valuation remains option value with high information risk.
    - Track; invest only with data-room access and downside protection.
  - - Bear
    - Pre-orders slip, beta acceptance is weak, or safety/manufacturing issues delay scale.
    - Delayed Q4 2026 beta or poor utilization.
    - Bookings de-rate, burn rises, and dilution/down-round risk increases.
    - Avoid or require major price reset.
  - - Stress
    - Geopolitical/export-control issue, partner withdrawal, or serious safety incident interrupts deployments.
    - Customer procurement blocks or regulatory stop.
    - Revenue, partner proof, and financing syndicate confidence break simultaneously.
    - Stop unless issue is remediated and insured.
  notes: Scenarios are qualitative because revenue, margin, burn, contract terms, and cash balance are not publicly disclosed.
