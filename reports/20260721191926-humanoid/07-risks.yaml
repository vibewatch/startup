- id: TR007
  title: Mitigation and Kill Criteria Table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Pre-order conversion
    - Signed contracts and deposits by named customer
    - Less than 50% of headline order value supported by enforceable terms in data room
    - Discount bookings or pause investment.
  - - Revenue quality
    - Delivered and accepted robots
    - No accepted commercial deployments by two quarters after planned beta start
    - Treat valuation as overextended.
  - - Safety certification
    - CE / safety file completeness
    - No documented risk assessment, EHS sign-off, or conformity plan for EU sites
    - Block deployment underwriting.
  - - Autonomy maturity
    - Teleoperation / intervention rate
    - Material tasks require hidden human assistance beyond agreed safety monitoring
    - Reset product-readiness assumptions.
  - - Reliability
    - Fleet uptime and MTBF
    - Sub-90% task success or poor multi-shift uptime in beta customer sites
    - Require remediation plan before follow-on.
  - - Manufacturing yield
    - Pilot build yield and rework
    - Yield or rework misses plan for two consecutive production lots
    - Increase cash need and delay revenue.
  - - Supplier concentration
    - Schaeffler actuator or NVIDIA compute allocation
    - No qualified second source or allocation agreement before scale build
    - Apply supply-chain risk discount.
  - - Export controls
    - Classification and screening
    - No documented EAR/UK dual-use/export-control process for compute, source code, and staff
    - Require compliance remediation before investment.
  - - Governance
    - Cap table and board rights
    - Management cannot produce cap table, preferences, board minutes, and key-person plan
    - Do not price new money.
  - - Market hype
    - Comparable sentiment and financing market
    - Humanoid peers re-rate down or funding closes for hardware robotics while milestones slip
    - Use down-round terms or avoid.
  notes: Kill criteria are designed as diligence triggers, not definitive legal or operating conclusions.
