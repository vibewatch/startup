- id: architecture-and-ai-stack
  title: 'Architecture: hardware, compute, KinetIQ, and fleet learning'
  body: 'The technology thesis is vertical integration: Humanoid combines the robot chassis, modular end effectors, onboard
    sensing, NVIDIA-class edge compute, simulation, and a proprietary KinetIQ control and orchestration stack. KinetIQ is
    unusually explicit for a young hardware company. It separates fleet orchestration, single-robot task planning, VLA locomanipulation,
    and whole-body control across four layers; the disclosed System 1 and System 0 rates of 10 Hz and 50 Hz give diligence
    something testable beyond marketing language. KinetIQ Ascend then tries to move manipulation from passive teleoperated
    imitation toward reinforcement learning on real production tasks. That is encouraging, because the company acknowledges
    behavior cloning’s speed and reliability ceiling, but it also means autonomy maturity depends on data quality, intervention
    capture, sim-to-real transfer, and deployment feedback loops that remain largely private.'
