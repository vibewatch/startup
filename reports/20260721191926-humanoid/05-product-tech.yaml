    - Safety-critical control paths
    - Request architecture safety case and fault-tree analysis
  - - Simulation, HIL, regression, performance testing
    - Referenced in recruiting and NVIDIA/Isaac materials
    - Control and perception validation
    - Request test coverage, pass/fail history, and release gates
  - - Battery life and charging duty cycle
    - Spec runtime public; chemistry and cycle life private
    - Operational uptime and safety
    - Request battery BOM, thermal data, charge cycles, incident data
  - - Autonomy versus teleoperation
    - Teleop trajectories and shared-autonomy roadmap public
    - Data collection and fallback operations
    - Request intervention rate, teleop staffing ratio, and escalation logs
  - - Industrial safety standards
    - No certification disclosed in reviewed sources
    - Human-adjacent heavy robot deployment
    - Request CE/ISO/ANSI/RIA certification plan and risk assessments
