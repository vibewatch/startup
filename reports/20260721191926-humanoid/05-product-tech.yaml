  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: specification conflict
    missingEvidence: A current official specification sheet resolving Alpha Bipedal speed, runtime, weight, and DoF against
      third-party robot databases.
    whyItMatters: Spec drift can produce metricDrift across chapters and affects battery, safety, and deployment-readiness
      underwriting.
    diligencePath: Request the latest customer-facing HMND 01 technical datasheet and engineering change log from Humanoid.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE002
  - type: private-evidence-only
    severity: material
    topic: reliability metrics
    missingEvidence: Production-grade MTBF, intervention rate, uptime, fault classes, and autonomous hours from SAP, Siemens,
      Bosch, or Schaeffler sites.
    whyItMatters: Reliability is the gating proof that separates a promising Alpha from an economically deployable industrial
      fleet.
    diligencePath: Review site-level acceptance reports, robot logs, support tickets, and customer sign-off criteria under
      NDA.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
    - TE007
  - type: missing-source
    severity: material
    topic: IP estate
    missingEvidence: Patent filings, invention disclosures, open-source bill of materials, and trade-secret boundaries for
      KinetIQ, end effectors, and whole-body control.
    whyItMatters: A proprietary AI-brain claim is less defensible without evidence of protectable IP or clean open-source
      compliance.
    diligencePath: Run patent-family searches and request counsel-prepared IP and OSS-compliance schedules.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE007
  - type: missing-source
    severity: material
    topic: battery and safety certification
    missingEvidence: Battery chemistry, cell supplier, thermal safety data, charge cycles, certification plan, and site risk
