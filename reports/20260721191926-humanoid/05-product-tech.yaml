    - No production-grade metric disclosed
    - Customer SLA and ROI model
    - Request MTBF, downtime classes, and site acceptance metrics
  - - Privacy and cybersecurity
    - SAP/Siemens integration public; controls not public
    - Enterprise API, cloud tasking, cameras/mics
    - Request security architecture, data retention, penetration tests
  - - IP ownership
    - KinetIQ proprietary claim public; patents not reviewed
    - Software/control moat
    - Request patent filings, trade-secret scope, open-source compliance
  notes: Trust table intentionally marks unavailable certifications and reliability metrics as gaps rather than inferring
