- id: deployments-and-integration-proof
  title: Deployment proof and customer workflow integration
  body: The strongest technical proof is not a single robot demo; it is the pattern of enterprise-system integration inside
    industrial workflows. The SAP/Martur Fompak POC showed a robot receiving task context through Joule and SAP EWM, navigating
    to a pallet, picking a KLT box, and delivering it to a trolley. Siemens adds a second environment, where HMND 01 Alpha
    was tested in Erlangen logistics operations using Siemens Xcelerator and NVIDIA’s physical-AI stack. Bosch is important
    for manufacturing readiness because it moves beyond customer use into contract manufacturing and DfX support. Schaeffler
    is important because it combines deployment access with actuator-supply proximity. None of this yet proves scaled autonomous
    uptime, but it does move Humanoid above a pure lab-demo status.
