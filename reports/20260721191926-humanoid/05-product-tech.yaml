- id: maturity-roadmap-and-readiness
  title: Maturity, roadmap, and technical readiness
  body: 'Public maturity is around TRL 6-7 for the wheeled industrial wedge: working Alpha prototypes have entered relevant
    factory or logistics settings, but evidence of stable production operation, customer acceptance criteria, and repeatable
    fleet economics is not yet public. Alpha Bipedal is lower-readiness because it is positioned as a development and testing
    unit rather than the first scaled industrial product. The roadmap points to Beta robots in Q4 2026, Schaeffler site phases
    from December 2026 through June 2027, and mass manufacturing of wheeled humanoids. The speed of development is notable—five
    to seven months for Alpha variants—but that speed also raises verification questions: reliability growth, safety validation,
    battery durability, component supply, and field-service processes must mature faster than the prototype narrative.'
