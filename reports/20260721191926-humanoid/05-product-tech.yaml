chapter:
  number: 5
  title: Product & Technology
  summary: HMND 01 Alpha is a credible industrial humanoid Alpha centered on a wheeled logistics/manufacturing wedge, a detailed
    KinetIQ AI stack, and unusually strong partner POC evidence. The technical diligence risk is not headline specs but proof
    of scaled autonomous reliability, safety certification, battery endurance, and whether KinetIQ reduces teleoperation dependence
    in production.
sections:
- id: product-definition-and-variants
  title: Product definition and HMND 01 Alpha variants
  body: 'HMND 01 Alpha is best understood as an industrial labor-automation robot, not a general-purpose consumer humanoid.
    The current product story has two embodiments that share a modular upper-body and AI stack: Alpha Wheeled, the nearer-term
    industrial platform for logistics and manufacturing workflows, and Alpha Bipedal, the walking platform used for R&D, service-learning,
    and future more human-like navigation. The investable product evidence is strongest on the wheeled variant because the
    SAP/Martur Fompak, Siemens, Bosch, and Schaeffler proofs all center on factory or intralogistics work. The canonical diligence
    baseline is 29 DoF excluding end effectors, 15 kg bimanual payload, high-torque actuators, swappable hands or grippers,
    and a sensor package aimed at perception, manipulation, and human interaction. The bipedal public spec trail is less clean,
    so the chapter treats conflicting public pages as a diligence gap rather than rewriting the shared report baseline.'
