  topStrengths:
    - >-
      Europe's first pure-play humanoid robotics unicorn with exceptional speed
      of execution (idea to unicorn in ~two years; prototypes in 5-7 months).
    - >-
      Blue-chip industrial validation: Schaeffler (largest publicly announced
      humanoid commercial agreement), Bosch (order plus manufacturing partner),
      Siemens, SAP, and NVIDIA.
    - >-
      Vertically integrated hardware-plus-AI stack (HMND 01 Alpha and KinetIQ)
      with a pragmatic wheeled-first design suited to near-term industrial use.
    - >-
      Large reported demand signal — a 34,000-unit, ~$2.4 billion pre-order
      book — and a well-capitalized $152M Series A.
  topRisks:
    - >-
      $1.35B valuation is set against effectively zero recognized revenue; the
      thesis depends on converting non-binding pre-orders into delivered units.
    - >-
      Better-capitalized US and China rivals (Figure ~$39B, Apptronik ~$5B,
      Tesla Optimus, low-cost Unitree) could out-invest or undercut Humanoid.
    - >-
      Technology and safety execution risk: autonomy maturity, teleoperation
      reliance, reliability at scale, and humanoid safety certification.
    - >-
      Customer concentration around Schaeffler/Bosch and key-person dependence
      on founder Artem Sokolov, with geopolitical/export-control optics.
  unresolvedGaps:
    - >-
      Contractual status of the 34,000 pre-orders (binding vs LOI, deposits,
      cancellation terms) and reconciliation of the 20,000-34,000 count variance.
    - >-
      Undisclosed revenue, gross margin, monthly burn, runway, and cap-table /
      liquidation-preference terms.
    - >-
      Bosch vs Schaeffler unit-order attribution and the exact size of prior
      pre-Series-A rounds (~$118M implied).
    - >-
      Independent verification of deployment reliability, autonomy vs
      teleoperation share, and safety-certification status of HMND 01.
