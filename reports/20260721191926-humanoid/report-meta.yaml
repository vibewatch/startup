companyProfile:
  summary: >-
    Humanoid is a London-headquartered industrial humanoid robotics company
    founded in 2024 by Artem Sokolov. It designs and builds the HMND 01 Alpha
    family of humanoid robots (a 4-hour-runtime wheeled variant and a bipedal
    variant, each with 29 degrees of freedom and a 15 kg bimanual payload) and
    its own Vision-Language-Action AI brain, KinetIQ. In just two years it
    raised a $152 million Series A at a $1.35 billion post-money valuation,
    becoming Europe's first pure-play humanoid robotics unicorn, and has
    assembled Fortune 500 partnerships with Schaeffler, Bosch, Siemens, SAP,
    and NVIDIA while reporting a 34,000-unit, ~$2.4 billion pre-order book.
  foundedDate: "2024-05-01"
  founders:
    - name: Artem Sokolov
      role: Founder & CEO
      background: >-
        Russian-born entrepreneur with a background in large-scale
        manufacturing and business; founded Humanoid in London in 2024.
      claimRefs: [CO004]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom (engineering offices in Boston and Vancouver)
  productSummary: >-
    HMND 01 Alpha industrial humanoid robots — a wheeled variant (~220 cm, up
    to 4-hour runtime) and a bipedal variant (~179 cm) — with 29 DoF, a 15 kg
    bimanual payload, an NVIDIA Jetson/Intel compute stack, and the proprietary
    KinetIQ AI brain, sold into manufacturing and logistics workflows.
  customerFocus: >-
    Industrial buyers in manufacturing, logistics/warehousing, and retail,
    anchored by automotive and industrial OEMs such as Schaeffler and Bosch.
  businessModel: >-
    Sale and robot-as-a-service deployment of humanoid robots to industrial
    customers, supported by a vertically integrated hardware-plus-AI stack and
    Bosch manufacturing partnership; revenue is still pre-commercial.
  stage: Series A
  fundingStatus: >-
    $152M Series A at a $1.35B post-money valuation (announced 2026-07-21), led
    by Prime Movers Lab with Schaeffler, Bosch, Fubon Financial Holding Venture
    Capital, and Aglaé Ventures; $270M raised to date.
  disclosureProfile: private-undisclosed
  claimRefs: [CO015, CO016, CO017, CO019, CO029]
summary:
  headline: >-
    A fast-executing European humanoid robotics leader with elite partnerships
    and a large pre-order book, but a $1.35B pre-revenue valuation that rests on
    still-unproven commercial conversion.
