tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Decision item
  - Assessment
  - Evidence basis
  - Investment implication
  rows:
  - - Recommendation
    - Track / research-more
    - Series A and partners are real, but revenue and margins are undisclosed
    - Do not underwrite a fresh buy without private contract and unit-economics diligence
  - - Confidence
    - Medium-low
    - Funding and peer marks are public; operating financials are private
    - Use milestone-based entry discipline
  - - Risk rating
    - High
    - Hardware scale, supply chain, RaaS financing, customer acceptance, and price compression
    - Require downside protection or wait for proof
  - - Valuation stance
    - Stretched
    - 0.56x bookings looks reasonable, but recognized revenue is null publicly
    - Fair only if orders convert with positive margin
  - - Entry discipline
    - Milestone gated
    - Q4 2026 beta rollout, Schaeffler/Bosch acceptance, entity and preference review
    - Track now; revisit after delivery evidence
  notes: Assessment uses public sources only; recognized revenue, cash balance, and preference terms remain private.
