- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Supports valuation
  - What would change the view
  rows:
  - - Europe-first unicorn signal
    - Largest European humanoid-first Series A validates investor appetite
    - Round terms or preference stack materially worse than ordinary equity
  - - Strategic partners
    - Schaeffler and Bosch support demand, actuators, and manufacturing path
    - Contracts prove non-binding or pilot-only
  - - Bookings headline
    - 34,000 pre-orders and $2.4B book create large conversion option
    - Deposits are small, cancellable, or concentrated
  - - Peer inflation
    - Figure and Apptronik marks make $1.35B look moderate by category
    - Peer marks compress or fail to translate into deployments
  - - Market TAM
    - Goldman, Morgan Stanley, and MarketsandMarkets frame a large long-term market
    - Industrial buyers defer adoption or safety constraints slow deployments
  - - Revenue quality
    - RaaS could create recurring economics if uptime is high
    - Fleet financing and field service consume contribution margin
  - - Price compression
    - Unitree price anchors challenge premium ASP assumptions
    - Humanoid proves industrial reliability and integration value justify premium
  - - Evidence quality
    - Official and high-reputation sources corroborate financing
    - Private diligence fails to verify entity, revenue, or customer terms
  notes: Arguments intentionally pair thesis and anti-thesis because valuation is milestone-sensitive.
