- id: scenario-valuation
  title: Scenario valuation is a milestone option, not a conventional DCF
  body: 'A DCF-style framework is still useful if it is presented as scenario discipline rather than false precision. The
    bull case gives Humanoid credit for the public 100,000-unit ambition by 2031, strong RaaS attach, and a credible industrial
    software/service layer; that can justify a multibillion-dollar outcome if customer acceptance and gross margin prove out.
    The base case keeps the current round price as an anchor because public facts validate strategic demand but not shipment
    economics. The bear case recognizes that hardware delays, warranty cost, low utilization, and price compression can quickly
    turn a large pre-order number into a down-round. The key driver is not TAM: Goldman, Morgan Stanley, and MarketsandMarkets
    all support a large long-term humanoid market. The key driver is Humanoid’s share of delivered, paid, supportable robots
    at positive contribution margin before the next financing window.'
