- id: TV008
  title: Thesis-break triggers and final diligence asks table
  columns:
  - Trigger or ask
  - Threshold / evidence needed
  - Transmission to thesis
  - Action implication
  rows:
  - - Contract enforceability
    - Signed Schaeffler/Bosch/order-book terms, deposits, cancellation rights
    - Converts bookings from headline to underwritable backlog
    - Proceed only after document review
  - - Beta rollout
    - Q4 2026 beta robots delivered and accepted by industrial users
    - Validates product timing and customer acceptance
    - Slip triggers valuation haircut
  - - Unit economics
    - BOM, manufacturing cost, warranty reserve, gross margin, service cost
    - Determines if RaaS and hardware scale produce cash
    - No buy without margin bridge
  - - RaaS financing
    - Fleet ownership, lease/SPV terms, utilization, uptime SLA
    - Can create recurring revenue or capital drain
    - Require financing plan
  - - Entity structure
    - Operating entity, IP ownership, Companies House reconciliation
    - Affects legal ownership and cap-table diligence
    - Blocker until resolved
  - - Preference stack
    - Liquidation preference, option pool, anti-dilution, strategic rights
    - Determines economic entry price
    - Adjust valuation or pass
  - - Competitive pricing
    - Evidence Humanoid can defend premium vs Unitree low-cost hardware
    - Protects ASP and contribution margin
    - Cut valuation if ASP collapses
  - - Peer mark compression
    - Figure/Apptronik/agility valuation reset or failed deployments
    - Changes category exit multiple
    - Reprice before entry
  notes: Diligence asks are ordered by ability to convert a press-supported option into an investable security.
