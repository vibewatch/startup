slug: humanoid
runDate: '2026-07-21'
company:
  name: Humanoid
chapter:
  number: 8
  title: Valuation
  summary: 'Humanoid’s $1.35B Series A valuation is best viewed as a bookings-backed industrial-robotics option: credible
    versus overheated peers, but stretched for a company with no public recognized revenue or margin disclosure. The recommended
    stance is track/research-more until contracts, unit economics, and delivery milestones turn the $2.4B pre-order headline
    into underwritable revenue.'
sections:
- id: price-sensitive-verdict
  title: 'Price-sensitive verdict: track, not underwrite blindly'
  body: 'Humanoid’s $152 million Series A at a $1.35 billion post-money valuation is credible enough to keep on an IC watchlist
    but not sufficiently revenue-backed for an unqualified buy. The price is supported by a large strategic narrative: Europe’s
    first pure-play humanoid robotics unicorn, a $270 million lifetime capital base, Schaeffler and Bosch relationships, and
    a reported $2.4 billion order book. The anti-thesis is equally important. Recognized revenue and ARR are effectively undisclosed
    in the public record, and the pre-order figure should be treated as bookings potential rather than bankable revenue. That
    makes the valuation a bet on conversion, delivery, uptime, and manufacturing scale rather than a multiple of today’s financial
    statements. The practical stance is track or research-more at the current price, with an explicit willingness to underwrite
    only after contract enforceability, deposits, contribution margin, and entity structure are verified. This valuation chapter
    therefore treats every headline as a conditional input: financing confirms investor willingness, partnerships confirm
    industrial interest, and peer marks confirm category heat, but none of those facts alone establish collectible revenue
    or cash-flow durability. The underwriting standard should be evidence that customers accept working robots, pay on enforceable
    terms, and leave enough gross margin after manufacturing, support, and warranty cost to fund the next deployment wave.'
