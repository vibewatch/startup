- id: diligence-triggers
  title: Diligence asks and kill triggers
  body: 'The next diligence cycle should be document-led. Press coverage can confirm the round, peer marks, and partner announcements,
    but it cannot answer the preference stack, customer cancellation rights, deposit coverage, build cost, warranty exposure,
    or operating-entity reconciliation. The first investment condition is evidence that the Schaeffler, Bosch, and broader
    pre-order relationships are binding enough to finance production. The second is proof that HMND 01 can run paid workflows
    at acceptable uptime with field-service cost below RaaS contribution margin. The third is price resilience: Unitree’s
    low listed prices and China-linked supply chains mean Humanoid must defend industrial reliability, safety, and integration
    value rather than rely on hardware scarcity. If beta deployments slip, if order enforceability disappoints, or if contribution
    margin stays private after the next milestone, the correct action is to wait for a lower entry price or pass.'
