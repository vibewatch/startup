- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - 2026 valuation / funding signal
  - Commercial proof
  - Relevance to Humanoid
  - Limitation
  rows:
  - - Humanoid
    - ' $1.35B post-money; $152M Series A; $270M total raised'
    - 34,000 pre-orders; Schaeffler and Bosch relationships
    - Target company valuation anchor
    - No recognized revenue or margin disclosure
  - - Figure AI
    - $39B post-money Series C; more than $1B committed capital
    - BMW production and logistics Helix evidence
    - Upside peer for humanoid category
    - Much larger capital base and U.S. platform visibility
  - - Apptronik
    - More than $935M Series A; reported ~$5.3B post-money
    - Apollo scale-up with Google/Mercedes/John Deere investor network
    - Closer private-round peer
    - Still limited public revenue disclosure
  - - Agility Robotics
    - S-4 process and >$620M gross proceeds expectation in SPAC path
    - GXO multi-year logistics agreement
    - Commercial deployment benchmark
    - Public valuation not cleanly disclosed in source reviewed
  - - 1X
    - NEO offered at $20,000 or subscription in coverage
    - Consumer pre-order model
    - Price and packaging signal
    - Home use case differs from industrial RaaS
  - - Sanctuary AI
    - No current valuation disclosed on homepage reviewed
    - Industrial embodied-AI positioning
    - Qualitative industrial peer
    - Insufficient public valuation data
  - - Unitree
    - G1 listed from $13.5K; Walmart-related coverage cites $21.6K listing
    - Low-cost hardware availability
    - Adverse ASP and commoditization pressure
    - Developer/consumer hardware differs from industrial service robot
  - - Tesla Optimus
    - Not separable from Tesla public-company valuation
    - Strategic program inside Tesla
    - Strategic threat and hiring/attention comp
    - Cannot derive clean private humanoid multiple
  - - Humanoid market TAM
    - Goldman $38B by 2035; MarketsandMarkets $50.27B by 2035
    - Category-wide adoption forecast
    - Exit ceiling and market-pull context
    - TAM is not company revenue
  - - Funding data platforms
    - PitchBook/Dealroom/Crunchbase/CB Insights profile coverage
    - Profile and ecosystem discovery
    - Cross-check source for future refresh
    - Public pages do not replace private cap table
  - - UBTECH
    - No public valuation in source reviewed
    - Commercial and humanoid robot portfolio
    - China-linked competitive breadth
    - Not a private-round valuation comp
