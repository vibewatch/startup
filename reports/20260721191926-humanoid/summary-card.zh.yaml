  topStrengths:
    - 欧洲首家纯人形机器人独角兽，执行速度突出：从创意到独角兽约两年，5-7 个月做出原型。
    - 蓝筹工业客户给出验证：Schaeffler（公开披露最大的人形机器人商业协议）、Bosch（订单加制造伙伴）、Siemens、SAP 和 NVIDIA。
    - 硬件加 AI 垂直整合，核心是 HMND 01 Alpha 和 KinetIQ；先做轮式方案，更贴近短期工业落地。
    - 需求信号大：据报已有 34,000 台、约 $2.4 billion 的预订订单储备；$152M Series A 也让资金弹药充足。
  topRisks:
    - $1.35B 估值对应的确认收入几乎为零；投资逻辑取决于把非约束性预订转成实际交付。
    - 美国和中国对手资金更厚：Figure 约 $39B、Apptronik 约 $5B、Tesla Optimus、低成本 Unitree 都可能用资本或价格压住 Humanoid。
    - 技术和安全交付仍有风险：自主能力成熟度、远程操控依赖、规模化可靠性、人形机器人安全认证都还要跑通。
    - 客户集中在 Schaeffler / Bosch 一带，也依赖创始人 Artem Sokolov；地缘政治和出口管制观感会放大风险。
  unresolvedGaps:
    - 34,000 台预订的合同状态仍不清楚：是否具约束力、是否只是 LOI、是否有定金和取消条款；20,000 到 34,000 台的口径差异也未核清。
    - 收入、毛利率、月烧钱速度、现金跑道，以及股权结构表 / 清算优先权条款均未披露。
    - Bosch 与 Schaeffler 的订单台数归属，以及 Series A 前几轮融资的准确规模（隐含约 $118M）仍不清楚。
    - HMND 01 的部署可靠性、自主运行与远程操控占比、安全认证状态，都缺少独立验证。
