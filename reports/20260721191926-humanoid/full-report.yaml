              pilot because it reported throughput, uptime and pick-and-place success. The robot executed tote handling
              at Siemens Erlangen at 60 moves per hour, more than eight hours uptime and above 90 percent autonomous
              pick-and-place success. That is still not full commercial retention proof, but it is a customer-relevant
              operating metric set. SAP/Martur Fompak is valuable because it occurred in a live automotive manufacturing
              logistics environment and connected the robot to an SAP AI agent, yet the public page does not quantify
              sustained uptime or ROI. Bosch similarly proves a complex workflow around conveyor-to-trolley box
              movement, but the sources do not disclose duration, fleet size or economic conversion. Schaeffler’s first
              phase is future-dated to late 2026 and 2027, so current underwriting must separate signed commitment from
