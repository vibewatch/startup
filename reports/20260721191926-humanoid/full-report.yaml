            body: >-
              The founder narrative is a real asset and a diligence risk at the same time. Artem Sokolov is consistently
              named as founder and CEO, with public profiles tying him to manufacturing, investment, and a
              family-business background before Humanoid. That gives the company a credible strategy and scale-up story,
              especially for a robotics business where manufacturing discipline matters. It also concentrates narrative
              risk in one person: a Forbes article’s framing of Sokolov as a former Russian jewelry magnate makes
              founder background, geopolitics, sanctions exposure, and investor comfort explicit diligence topics rather
              than footnotes. Jarad Cannon adds important technical balance as CTO, with third-party coverage pointing
              to more than 13 years of robotics and AI execution experience. The broader team bench is less precisely
              disclosed. Public sources range from over 130 professionals to over 200 engineers and more than 250
              employees, so this chapter carries the canonical cover band as roughly 160–200 while flagging the variance
              for follow-up.
