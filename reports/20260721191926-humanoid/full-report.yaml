        title: Differentiation and defensibility
        blocks:
          - type: paragraph
            body: >-
              Humanoid’s differentiated product strategy is pragmatic rather than science-fictional. It prioritizes a
              wheeled industrial robot, live factory workflows, and a modular architecture that can reuse learning
              across wheeled and bipedal embodiments. The defensibility case rests on four assets: proprietary KinetIQ
              software, integration rights with enterprise systems such as SAP and Siemens Xcelerator, privileged
              industrial learning loops with Schaeffler/Bosch/Siemens/Martur Fompak, and a vertically coordinated
              manufacturing/supplier stack. The risk is that each asset needs proof at scale. NVIDIA supplies key
              enabling infrastructure available to other robotics companies, Bosch and Schaeffler are strategic partners
              rather than owned factories or exclusive component sources as publicly disclosed, and no patent estate was
              reviewed. Therefore the moat is plausible but still execution-dependent.
