      - number: '5.6'
        title: Trust, safety, compliance, and technical risk register
        blocks:
          - type: paragraph
            body: >-
              The adverse case is not that Humanoid lacks credible technology; it is that humanoid deployment compresses
              hard problems into a single moving, heavy, semi-autonomous system. IEEE Spectrum’s scaling critique
              highlights battery life, reliability, downtime, and safety standards; Robotics & Automation News
              emphasizes that the category remains far from general-purpose autonomy. Humanoid’s own writing reinforces
              the concern by explaining why behavior cloning and teleoperated demonstrations do not reach near-perfect
              industrial reliability. Public diligence should therefore focus on safety cases, formal certification
              path, intervention rate, MTBF, battery chemistry and thermal data, warranty/service obligations, and
              evidence that KinetIQ can reduce teleoperation dependence over many shifts rather than one POC. Until
              those metrics are disclosed, the product-tech rating should be credible Alpha, not proven scaled platform.
