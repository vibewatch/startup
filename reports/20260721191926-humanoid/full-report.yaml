  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Factor
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Labor shortages and replacement openings
        - Driver
        - Current to medium term
        - Large material-moving and production labor pools make automation ROI plausible
        - Quantify target customer labor cost, turnover, injury, and vacancy baseline
      - - Aging workforce and demographic pressure
        - Driver
        - Medium to long term
        - Supports sustained demand for automation in G7 and China
        - Separate care-sector demographics from industrial labor shortages
      - - AI / VLA and simulation advances
        - Driver
        - Current to medium term
        - Improves task generalization and reduces programming burden
        - Demand field data showing task success rate outside demos
      - - Falling actuator, battery, sensor, and compute costs
        - Driver
        - Medium term
        - Can compress payback and enable fleet scale
        - Audit BOM, supplier concentration, warranty assumptions, and gross margin
      - - Reshoring and industrial-policy pressure
        - Driver
        - Medium term
        - Raises value of local flexible automation in factories
        - Map exposed customer segments and capex budgets
      - - ROI and payback proof
        - Constraint
        - Immediate
        - Procurement stalls unless productivity beats manual labor, AMRs, or fixed automation
        - Require site-level ROI model and post-pilot measured throughput
      - - Safety certification and fenceless operation
        - Constraint
        - Immediate to medium term
        - Limits where humanoids can operate around workers
        - Review risk assessment, ISO/OSHA compliance plan, incident history, and insurance
      - - Reliability, uptime, and serviceability
        - Constraint
        - Immediate
        - Low uptime turns TAM into failed pilots and expensive support
        - Request beta uptime, mean time between failure, service staffing, and spare-parts data
      - - Battery runtime and payload limits
        - Constraint
        - Immediate
        - Narrows viable shifts and workflows before hot-swap or charging operations mature
        - Compare runtime to shift length and cycle-time requirements
      - - Capital intensity and supply-chain scaling
        - Constraint
        - Medium term
        - Even demand-rich markets can bottleneck on production capacity and component availability
        - Trace actuator, reducer, battery, compute, and assembly suppliers with lead times
    notes: >-
      Drivers and constraints are market-wide; the diligence asks translate them into evidence needed to underwrite
      Humanoid-specific adoption and valuation.
