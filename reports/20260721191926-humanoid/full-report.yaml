      - number: '7.2'
        title: 'Technology, safety, and regulatory risk: autonomy claims meet factory safety law'
        blocks:
          - type: paragraph
            body: >-
              Humanoid’s product risk is not simply whether the robot can move; it is whether an industrial humanoid can
              operate reliably near workers with safety controls that customers, regulators, insurers, and works
              councils accept. The public product page claims up to four hours of runtime, 15 kg bimanual payload,
              KinetIQ AI on NVIDIA compute, and autonomous human-speed operation. Those are useful specifications, but
              adverse robotics sources show why demos cannot be equated with durable autonomy: IEEE has warned that
              robot demonstrations may include a human in the loop, and earlier humanoid programs relied on engineers,
              tethers, and slow task execution. The safety burden is also formal. ISO 10218, ISO/TS 15066, OSHA robotics
              guidance, EU Machinery Regulation 2023/1230, and CE-marking obligations create a diligence path around
              risk assessment, collaborative-operation limits, conformity files, guarding, emergency stops, validation
              logs, and customer-site procedures. Until certification posture, incident history, and beta reliability
              data are available, residual safety/regulatory exposure remains material.
            claimRefs:
