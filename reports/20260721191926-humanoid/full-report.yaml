  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Commercial and financial risk: bookings-led story without revenue proof'
        blocks:
          - type: paragraph
            body: >-
              The highest-probability investment risk is that Humanoid’s public commercial signal is still bookings-led
              rather than revenue-led. The company has exceptional headline financing support: multiple independent
              sources report the $152 million Series A, $1.35 billion post-money valuation, and $270 million total
              capital raised. That capital gives the team room to execute, but it also raises the performance bar
              because the valuation appears to capitalize future robot deployment before public evidence of recognized
              revenue, ARR, gross margin, cash burn, or runway. The 34,000-unit pre-order claim is strategically
              important, yet the strongest adverse source explicitly says the figure is not independently verified and
              that Humanoid had not shipped commercial units at the time of the report. Schaeffler and Bosch lower
              go-to-market risk, but they also concentrate proof around two strategic counterparties. The underwriting
              posture should therefore be “conditional upside”: value the pipeline only after contract enforceability,
              deposits, customer acceptance, service economics, and delivered-unit utilization are demonstrated.
