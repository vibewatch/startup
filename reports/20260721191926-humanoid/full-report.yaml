  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and HMND 01 Alpha variants
        blocks:
          - type: paragraph
            body: >-
              HMND 01 Alpha is best understood as an industrial labor-automation robot, not a general-purpose consumer
              humanoid. The current product story has two embodiments that share a modular upper-body and AI stack:
              Alpha Wheeled, the nearer-term industrial platform for logistics and manufacturing workflows, and Alpha
              Bipedal, the walking platform used for R&D, service-learning, and future more human-like navigation. The
              investable product evidence is strongest on the wheeled variant because the SAP/Martur Fompak, Siemens,
              Bosch, and Schaeffler proofs all center on factory or intralogistics work. The canonical diligence
              baseline is 29 DoF excluding end effectors, 15 kg bimanual payload, high-torque actuators, swappable hands
              or grippers, and a sensor package aimed at perception, manipulation, and human interaction. The bipedal
              public spec trail is less clean, so the chapter treats conflicting public pages as a diligence gap rather
              than rewriting the shared report baseline.
