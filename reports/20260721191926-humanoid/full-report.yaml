companyProfile:
  summary: >-
    Humanoid is a London-headquartered industrial humanoid robotics company founded in 2024 by Artem Sokolov. It designs
    and builds the HMND 01 Alpha family of humanoid robots (a 4-hour-runtime wheeled variant and a bipedal variant, each
    with 29 degrees of freedom and a 15 kg bimanual payload) and its own Vision-Language-Action AI brain, KinetIQ. In
    just two years it raised a $152 million Series A at a $1.35 billion post-money valuation, becoming Europe's first
    pure-play humanoid robotics unicorn, and has assembled Fortune 500 partnerships with Schaeffler, Bosch, Siemens,
    SAP, and NVIDIA while reporting a 34,000-unit, ~$2.4 billion pre-order book.
  foundedDate: '2024-05-01'
  founders:
