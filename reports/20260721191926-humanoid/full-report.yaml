  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Boundary: industrial humanoids, not all robotics'
        blocks:
          - type: paragraph
            body: >-
              The investable market for Humanoid should be drawn around human-form, mobile robots deployed into
              industrial and commercial workflows that were designed for people. That includes bipedal or wheeled
              humanoids used for manufacturing logistics, line-side material movement, warehouse tote or parcel
              handling, inspection, and eventually retail or service tasks where a human-shaped form factor lets the
              robot use existing spaces and tools. It excludes the broader industrial-robot installed base, conventional
              arms inside fenced cells, AMRs, conveyors, and special-purpose fixed automation except as substitutes in
              an ROI comparison. This boundary matters because broad robotics statistics make the market look mature,
              while humanoids are still early and commercially unproven. Humanoid’s own positioning and Schaeffler
              relationship point to the narrower industrial labor market, not a consumer-home robotics market. The
              practical test is whether the robot can absorb a job that otherwise needs a person walking through a
              factory or warehouse, not whether it belongs to the much broader robotics category. That is why the
              boundary keeps AMRs and fixed cells visible as competitive benchmarks but out of the numerator for
              humanoid TAM.
