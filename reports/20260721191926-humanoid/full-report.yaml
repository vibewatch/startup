  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Price-sensitive verdict: track, not underwrite blindly'
        blocks:
          - type: paragraph
            body: >-
              Humanoid’s $152 million Series A at a $1.35 billion post-money valuation is credible enough to keep on an
              IC watchlist but not sufficiently revenue-backed for an unqualified buy. The price is supported by a large
              strategic narrative: Europe’s first pure-play humanoid robotics unicorn, a $270 million lifetime capital
              base, Schaeffler and Bosch relationships, and a reported $2.4 billion order book. The anti-thesis is
              equally important. Recognized revenue and ARR are effectively undisclosed in the public record, and the
              pre-order figure should be treated as bookings potential rather than bankable revenue. That makes the
              valuation a bet on conversion, delivery, uptime, and manufacturing scale rather than a multiple of today’s
              financial statements. The practical stance is track or research-more at the current price, with an
              explicit willingness to underwrite only after contract enforceability, deposits, contribution margin, and
              entity structure are verified. This valuation chapter therefore treats every headline as a conditional
              input: financing confirms investor willingness, partnerships confirm industrial interest, and peer marks
              confirm category heat, but none of those facts alone establish collectible revenue or cash-flow
              durability. The underwriting standard should be evidence that customers accept working robots, pay on
              enforceable terms, and leave enough gross margin after manufacturing, support, and warranty cost to fund
              the next deployment wave.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV015
