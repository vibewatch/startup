      - number: '4.3'
        title: Hardware unit economics drive the cash-flow case
        blocks:
          - type: paragraph
            body: >-
              Humanoid should not be modeled like a software company. Public cost research points to actuators as a
              major share of humanoid robot cost, while compute, sensors, batteries, mechanical structure, assembly,
              testing, deployment engineering, support, and warranty reserves add further cash needs. Bosch as a
              contract manufacturing partner may lower the amount of owned factory capex Humanoid needs to build, but it
              does not eliminate inventory financing, minimum order quantities, supplier commitments, rework, or
              customer acceptance risk. Because no public source discloses BOM, labor content, gross margin,
              utilization, service attach, or RaaS payback, the unit-economics bridge remains mostly a diligence
              template. The financial model should keep gross margin null, use scenario ranges for burn, and only credit
              the order book after conversion evidence. A scaled humanoid fleet also creates timing mismatches:
              suppliers may require deposits before customers accept robots, while warranties and field support consume
              cash after shipment. Those timing items can dominate accounting gross margin during the first production
              cohorts.
