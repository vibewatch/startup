        title: Bookings are the forward signal, not recognized revenue
        blocks:
          - type: paragraph
            body: >-
              The strongest top-line signal is the order book: public sources repeat 34,000 pre-orders worth about $2.4
              billion, which implies roughly $70,600 per robot before discounts, software, services, taxes, and churn.
              That is a valuable demand indicator, but it is not recognized revenue, ARR, or gross profit. Revenue
              recognition will depend on signed contracts, delivery and acceptance, cancellation rights, deposits,
              financing, warranties, and whether the model is hardware sale, lease, or robot-as-a-service. The
              Schaeffler agreement and Bosch manufacturing partnership improve confidence that industrial customers are
              engaging, yet the public evidence still has ambiguity around whether Bosch is a manufacturer, customer,
              1,000-unit order counterparty, or all three. Until contract terms are reviewed, the correct underwriting
              posture is bookings-led upside with conversion risk. The chapter therefore uses explicit nulls for
              recognized revenue and ARR while preserving the bookings signal as a pipeline metric. This avoids the
              common hardware diligence error of capitalizing order headlines at software multiples before delivery and
              service economics are known.
