      - number: '8.2'
        title: Comparables and implied multiples show a stretched but not irrational price
        blocks:
          - type: paragraph
            body: >-
              The peer set explains why the valuation can be both stretched and defensible. Figure’s $39 billion Series
              C and Apptronik’s reported $5 billion-plus valuation reset humanoid robotics into a capital-arms-race
              category; against those marks Humanoid’s $1.35 billion looks modest. Against operating proof, however, the
              picture is less generous. Figure has BMW production evidence, Apptronik has a much larger capital base,
              and Agility has live logistics deployments. Humanoid’s strongest public metric is the reported $2.4
              billion pre-order book, which implies a valuation of roughly 0.56 times bookings and about $39,700 per
              pre-order. Those numbers look optically cheap only if the orders convert. They look expensive if the
              bookings are cancellable, if RaaS requires material fleet financing, or if Unitree-style pricing pulls
              hardware ASPs downward before Humanoid reaches scale.
