        title: Customer segmentation and evidence-weighted buyer map
        blocks:
          - type: paragraph
            body: >-
              Humanoid’s customer evidence is narrow but strategically coherent: the public wedge is industrial work in
              automotive manufacturing, electronics manufacturing and logistics-adjacent factory flows. The buyer is
              typically a manufacturing operations, automation or digital-factory executive; the user is the shop-floor
              logistics or production team; and the payer is an enterprise procurement organization evaluating labor
              availability, throughput, uptime and safety. Schaeffler is the anchor manufacturer and strongest
              revenue-quality proof point because public sources describe a binding, phased deployment and supply
              agreement. Bosch is best classified as manufacturing partner plus POC counterparty, not a clean
              end-customer order in the fetched public record. Siemens, SAP and Martur Fompak show pilot/POC pull from
              factory-floor and automotive logistics operators. Retail is a stated future target, but no named public
              retail customer was found, so it should not be underwritten as proven demand.
