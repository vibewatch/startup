      background: >-
        Russian-born entrepreneur with a background in large-scale manufacturing and business; founded Humanoid in
        London in 2024.
      claimRefs:
        - CO004
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom (engineering offices in Boston and Vancouver)
  productSummary: >-
    HMND 01 Alpha industrial humanoid robots — a wheeled variant (~220 cm, up to 4-hour runtime) and a bipedal variant
    (~179 cm) — with 29 DoF, a 15 kg bimanual payload, an NVIDIA Jetson/Intel compute stack, and the proprietary KinetIQ
    AI brain, sold into manufacturing and logistics workflows.
  customerFocus: >-
    Industrial buyers in manufacturing, logistics/warehousing, and retail, anchored by automotive and industrial OEMs
    such as Schaeffler and Bosch.
  businessModel: >-
    Sale and robot-as-a-service deployment of humanoid robots to industrial customers, supported by a vertically
    integrated hardware-plus-AI stack and Bosch manufacturing partnership; revenue is still pre-commercial.
