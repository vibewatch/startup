  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and capital scale
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape for industrial humanoids is no longer a collection of lab projects; it is a
              capital-intensive race among U.S. leaders, China-linked hardware scale players, and a smaller but
              increasingly visible European cluster. Figure is the outlier on valuation, with a $39 billion post-money
              Series C and BMW factory proof, while Apptronik has turned its originally announced Series A into more
              than $935 million of financing and a roughly $5 billion valuation. Agility looks less inflated but has the
              clearest live logistics deployment proof through GXO, Amazon, Toyota, and more than 100,000 totes moved.
              Against that backdrop, Humanoid’s $152 million Series A, $270 million total raised, and $1.35 billion
              valuation make it credible in Europe but sub-scale versus the U.S. leaders. The strategic question is
              whether Schaeffler, Bosch, and a wheeled-first design can translate into faster industrial learning than
              the larger checks at Figure and Apptronik. That sequencing also frames diligence around deployment
              velocity, not press-release volume.
