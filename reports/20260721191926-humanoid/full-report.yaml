        title: 'Sizing: wide spread, multiple lenses'
        blocks:
          - type: paragraph
            body: >-
              The market is large but not numerically settled. The 2026 current-market lens clusters around USD 5.4-6.4
              billion in MarketsandMarkets, Fortune, Axis, and Coherent data, yet Precedence is materially lower and
              Global Market Insights is materially higher. The 2035 endpoint is even more divergent: Precedence reaches
              only USD 8.78 billion, Goldman Sachs frames USD 38 billion, MarketsandMarkets reaches USD 50.27 billion,
              and Global Market Insights reaches USD 192.7 billion. Morgan Stanley’s USD 5 trillion by 2050 is an
              ecosystem and long-duration adoption case rather than a near-term product-market sizing input. For
              Humanoid, SAM should be narrowed to industrial and commercial workflows before applying share assumptions;
              SOM should be tied to validated partner deployments, manufacturing capacity, uptime, and order conversion,
              not to the whole humanoid dream. The contradiction is not a drafting error; it is the core diligence
              point. High-growth forecasts assume rapid cost-down, supplier capacity, safety acceptance, and customer
              willingness to standardize on humanoid fleets, while lower forecasts imply slower workflow qualification
              and more substitution by cheaper task-specific automation.
