      - number: '2.3'
        title: Buyer map and adoption path
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence early buyers are manufacturing and logistics operators with repetitive,
              ergonomically difficult work in spaces already built around humans. Manufacturing buyers are likely plant
              operations, manufacturing engineering, industrial engineering, safety, and IT/security leaders; logistics
              buyers are 3PL operations, warehouse automation, and labor-planning teams. Retail appears in broad market
              reports, but the evidence base is thinner for Humanoid’s immediate industrial product. The adoption path
              should be modeled as a gated enterprise sale: identify a constrained workflow, run a proof-of-concept,
              validate safety and IT integration, measure availability and serviceability, and only then expand to a
              fleet. This path implies lumpy revenue and long procurement cycles, but also high strategic value if
              pilots convert into multi-site deployments. Budget ownership also changes the proof standard. A plant
              manager may care about uptime and safety sign-off, a logistics operator may care about cost per move
              during peak season, and IT/security may veto deployments that do not satisfy data, network, and
              service-access controls.
