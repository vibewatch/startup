  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital structure and valuation signal
        blocks:
          - type: paragraph
            body: >-
              Humanoid’s financial profile is that of a heavily funded, early-commercial industrial hardware company:
              the company has a large equity cushion, a unicorn valuation, and strategic investors, but no public
              revenue statements. The cleanest corroborated financing fact is the 2026 Series A: independent coverage
              reports a $152 million raise at a $1.35 billion post-money valuation, bringing reported lifetime capital
              to $270 million. That implies roughly $118 million was raised before the Series A, but the public record
              does not cleanly separate seed, bridge, SAFE, preference, or strategic-contract economics. This chapter
              therefore treats the Series A as cash capacity and validation, not as proof of unit economics. Schaeffler
              and Bosch matter financially because they appear on both sides of the story: investors or strategic
              participants and also manufacturing/deployment counterparts. For modeling, the financing should be
              separated into disclosed cash inflow, undisclosed capital terms, and strategic-option value. The public
              facts can support liquidity scenarios, but they cannot support a share-price waterfall or
              preference-adjusted valuation without documents.
