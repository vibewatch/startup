              active private company, dormant accounts, and SIC codes/officer details that do not obviously match the
              robotics operating story. That may mean the operating group uses another entity, has recently reorganized,
              or has filings not discoverable under the obvious search strings. Financially, this is a material gap
              because the public trail cannot verify cash, debt, revenue, customer deposits, intercompany IP ownership,
              or preference-stack terms. The verdict is therefore neither revenue-backed nor purely speculative:
              Humanoid has credible strategic financing, a large bookings headline, and manufacturing partners, but the
              underwriting case depends on converting pre-orders into delivered robots with positive contribution margin
              before the next financing trigger. The next diligence round should start with entity confirmation and a
              private financial model rather than additional press searches. If management can reconcile filings,
