      - number: '1.3'
        title: Funding, Valuation, and Investor Map
        blocks:
          - type: paragraph
            body: >-
              The July 21, 2026 Series A is the defining company-overview event. Multiple independent outlets report the
              same headline economics: a $152 million Series A, $1.35 billion post-money valuation, and $270 million
              total capital raised to date. Those figures imply roughly $118 million of prior capital before the Series
              A. Prime Movers Lab led the round, and the named co-investors matter because several are not merely
              financial logos. Schaeffler and Bosch create industrial validation and possible manufacturing leverage;
              Fubon Financial Holding Venture Capital adds Asian financial-capital reach; Aglaé Ventures adds
              luxury-family-office signal through the Arnault-linked vehicle reported by Silicon Republic. The valuation
              label is therefore not just a price. It rests on the claim that Humanoid has paired capital with strategic
              deployment and manufacturing relationships quickly enough to become Europe’s first pure-play humanoid
              robotics unicorn. The open questions are economic: no public source reviewed gives board seats,
              liquidation preferences, debt, secondary sales, founder dilution, or runway.
