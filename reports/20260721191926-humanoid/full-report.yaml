      - number: '7.3'
        title: 'Execution, dependency, and competitive risk: partner scale is a strength and a choke point'
        blocks:
          - type: paragraph
            body: >-
              Humanoid’s scaling model deliberately uses strategic partners rather than owning every layer of
              production. That can be capital efficient, particularly if Bosch provides industrialization and Schaeffler
              supplies actuators, but it also shifts risk into supplier allocation, quality accountability, warranty
              coordination, engineering-change control, and counterparty priority. Schaeffler’s stated
              preferred-supplier role for more than 50% of actuator demand through 2031 is a concrete concentration
              point. NVIDIA-class compute is another dependency: the robot platform’s AI stack and the broader humanoid
              ecosystem rely on specialized accelerators whose availability, roadmap, and export classification can
              matter. BIS guidance on deemed exports, export compliance programs, and reexports shows why compute and
              controlled technology cannot be treated as generic components. Competitive pressure compounds this:
              Unitree provides a visible low-cost Chinese reference point, Tesla and Figure influence customer
              expectations, and TNW’s reference to Figure’s $39 billion valuation highlights the capital gap. Scaling to
              mass production therefore requires proof of supply redundancy, yield, field service, and export-control
              hygiene.
