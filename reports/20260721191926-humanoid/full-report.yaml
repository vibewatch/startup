  - id: FR001
    title: 'Risk Heatmap: Likelihood × Impact'
    type: matrix
    layout: wide
    summary: >-
      Commercial conversion, safety/regulatory, manufacturing scale, and valuation risk sit in the highest residual
      quadrant.
    data:
      columns:
