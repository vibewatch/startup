      - number: '3.4'
        title: Moats, threats, and status quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Durable advantage will probably come from workflow data, customer integration rights, safety evidence, and
              supply-chain execution rather than from a single headline humanoid specification. That favors companies
              with repeated live tasks: Agility’s tote handling, Figure’s BMW work, Apptronik’s Robot Park and customer
              data programs, and Humanoid’s Schaeffler/Bosch industrial anchor. The adverse case is that these same
              assets are still early. Independent and semi-independent sources describe a field still full of
              prototypes, remote operation, enabling agreements rather than binding orders, supply-chain constraints,
              and skepticism from former practitioners who argue factories may prefer simpler automation. Unitree and
              UBTECH pressure hardware pricing from China; NEURA and Flexion show that Humanoid is not the only European
              claimant; and incumbents can keep extending fixed automation, AMRs, and cobots. Humanoid’s moat is
              plausible, but it must be underwritten as execution speed plus privileged industrial learning, not as a
              settled technology monopoly. The next checkpoint is evidence of autonomous production hours per customer
              site, because that metric would separate a defensible operating moat from a merely well-funded demo cycle.
