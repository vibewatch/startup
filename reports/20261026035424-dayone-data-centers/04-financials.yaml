slug: dayone-data-centers
runDate: "2026-10-26"
company:
  name: DayOne Data Centers
chapter:
  number: 4
  title: Financials
  summary: >-
    Public reporting shows rapid top-line expansion and substantial equity financing, but
    disclosed revenue and capacity bookings do not establish realized pricing, margins,
    cash generation, or project-level returns. The reported possibility of an IPO delay
    or smaller offering makes capital access a near-term underwriting variable rather
    than a substitute for undisclosed cash, debt, and runway data.
sections:
  - id: monetization-and-reported-traction
    title: Monetization and reported traction
    body: >-
      Light Reading reports that DayOne defines bookings as IT-power capacity committed
      by clients under legally binding long-term contracts, and places reported bookings
      at approximately 2.3 GW across ten Asia-Pacific and European markets. It says seven
      global hyperscale and technology customers drive most bookings, with about 1.4 GW
      concentrated in Johor; those are capacity and concentration indicators, not
      recognized revenue. The same report gives US$512 million of revenue for the six
      months ending June 30, 2026, without a contract-level bridge from booked capacity
      to billed or recognized revenue. Startup Fortune reports FY2025 revenue of
      US$484.3 million versus US$178.1 million in FY2024, but the assigned evidence does
      not provide revenue mix, realized price per unit, or recognition schedules by
      service. The tables therefore distinguish reported revenue and contracted
      capacity from undisclosed monetization details.
    claimRefs: [CI001, CI002, CI003, CI004, CI008]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: cost-and-unit-economics
    title: Cost structure and unit economics
    body: >-
      Light Reading reports a US$81.9 million net loss for the six months ending June
      30, 2026, while Startup Fortune reports US$77.2 million for H1 2026; the assigned
      material does not reconcile the discrepancy (CI005, CI012). Startup Fortune also
      reports FY2025 adjusted EBITDA of US$180.7 million at a 37.3% margin and H1 2026
      adjusted EBITDA of US$205.9 million at a 40.2% margin, alongside FY2025 share-based
      compensation of US$341.8 million within a US$367.1 million net loss (CI014-CI015).
      These secondary-source adjusted measures are not audited gross margin, operating
      cash flow, or cash burn. Channel NewsAsia describes water-intensive cooling across
      Singapore's data-center sector (CI011), but not DayOne's usage or tariffs. Company
      power, water, utilization, working-capital, and capex-per-MW inputs remain gaps.
    claimRefs: [CI004, CI005, CI011, CI012, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy-and-financing
    title: Capital adequacy and financing dependency
    body: >-
      DayOne's June 5, 2026 release announced US$4.5 billion of gross Series C proceeds
      and said it could consider additional equity or debt depending on funding needs
      and market conditions (CI006-CI007). An October 2025 ICEF roadmap reported
      US$3.58 billion (SG$4.6 billion) in green financing for Malaysian development
      (CI016). ISI Markets later reported that the company was said to be negotiating
      an expansion of a corporate loan facility to as much as US$7 billion, not that a
      facility had closed or been drawn (CI010). Bloomberg reported that a delay or a
      smaller US$2.5-3 billion IPO was under consideration, with no final decision
      (CI009). These gross, historical, or conditional financing figures do not
      establish current liquidity; cash, burn, committed capex, debt terms, and runway
      remain unavailable in the assigned sources.
    claimRefs: [CI006, CI007, CI009, CI010, CI016]
  - id: underwriting-verdict
    title: Underwriting verdict
    body: >-
      Reported revenue growth and contracted capacity demonstrate scale, but they do not
      establish revenue quality, durable margins, or capital adequacy. Startup Fortune
      reports that one customer represented 69.4% of FY2025 revenue and 69.2% in H1
      2026 (CI013); customer-level pricing, renewal sensitivity, and sales efficiency
      remain unquantified. The conflicting H1 loss figures require reconciliation to the
      primary statements before relying on adjusted margins. Do not infer ARR from
      bookings, cash burn from accounting loss, or cash available from gross financing
      proceeds. Underwriting needs executed customer contracts and a billing bridge,
      site-level delivered capacity and costs, audited cash-flow and margin reconciliations,
      and a current debt and capex schedule. Until then, the financial picture is
      promising on scale but incomplete on economics and funding runway.
    claimRefs: [CI005, CI008, CI009, CI013, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Funding raised is not liquidity
    body: >-
      Reported gross equity proceeds and a possible loan-facility expansion cannot
      establish current liquidity or runway; obtain the latest audited cash-flow and
      debt schedules before treating the construction pipeline as funded.
    claimRefs: [CI006, CI009, CI010, CI016]
