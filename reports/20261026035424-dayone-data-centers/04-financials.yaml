    claimRefs: [CI001, CI002, CI003, CI004, CI008]
  - id: TI002
    title: Pricing and monetization
    columns:
      - Pricing dimension
      - Evidence status
      - Interpretation
      - Diligence request
    rows:
      - - Contract unit
        - "Long-term customer contracts commit IT-power capacity; price terms are not reported"
        - "Capacity commitment is not a disclosed price or realized revenue rate"
        - "Request contract unit, billing trigger, minimum commitment, and escalation terms"
      - - List versus realized price
        - "No list price or realized price per kW/MW is disclosed"
        - "Revenue cannot be converted into an implied price without delivered capacity and timing"
        - "Obtain price schedules, discounts, incentives, and customer-specific rates"
      - - Contract duration and renewal
        - "Sources describe long-term contracts but do not quantify duration, renewals, or termination rights"
        - "Revenue durability and repricing exposure remain unmeasured"
        - "Request contract tenor, renewal, termination, and renewal-price schedule"
    notes: >-
      The table is intentionally partial: Light Reading characterizes bookings as
      legally binding long-term capacity contracts but supplies no pricing schedule.
      Null or undisclosed pricing is not zero.
    claimRefs: [CI001, CI008]
  - id: TI003
    title: Unit economics and underwriting inputs
    columns:
      - Metric
      - Public value
      - Confidence and limitation
      - Why it matters and diligence request
    rows:
      - - Revenue, six months ended June 30, 2026
        - "US$512 million; Startup Fortune also reports FY2025 revenue of US$484.3 million versus US$178.1 million in FY2024"
        - "Reported total revenue, not ARR or a stream-level figure"
        - "Reconcile each period to audited statements and segment/customer schedules"
      - - Net loss, six months ended June 30, 2026
        - "Light Reading: US$81.9 million; Startup Fortune: US$77.2 million"
        - "Conflicting secondary-source reports; accounting loss is not cash burn"
        - "Reconcile original statement line items, attribution, and period"
      - - Largest-customer revenue share
        - "69.4% of FY2025 revenue and 69.2% of H1 2026 revenue, as reported by Startup Fortune"
        - "Single-customer exposure is material; contract duration and renewal terms are not shown"
        - "Request customer-level revenue, backlog, contract terms, and downside sensitivities"
      - - FY2025 loss and share-based compensation
        - "Startup Fortune reports a US$367.1 million net loss, including US$341.8 million of share-based compensation"
        - "The accounting loss and non-cash charge do not establish operating cash flow"
        - "Reconcile net loss to cash flow and adjusted EBITDA"
      - - Adjusted EBITDA
        - "US$180.7 million / 37.3% margin in FY2025; US$205.9 million / 40.2% in H1 2026, as reported by Startup Fortune"
        - "Adjusted EBITDA is not gross margin or independently verified site contribution"
        - "Obtain adjustment definitions, depreciation, power costs, utilization, and site-level margins"
      - - Gross margin by campus or service
        - null
        - "Not quantified in the assigned sources"
        - "Request audited gross margin with power, depreciation, and ramp costs by campus"
      - - CAC, sales cycle, or customer payback
        - null
        - "Not quantified in the assigned sources"
        - "Request customer acquisition cost, sales-cycle distribution, and contracted payback"
      - - Capex per delivered MW and working capital
        - null
        - "Not quantified; industry power and water pressures are not company cost data"
        - "Obtain project cost-to-complete, working-capital schedule, and capex per energized MW"
      - - Cash balance, operating cash flow, and runway
        - null
        - "Not established by the retained reporting"
        - "Request latest audited cash, quarterly burn, committed capex, debt maturities, and runway"
    notes: >-
      Revenue, loss, concentration, and adjusted EBITDA values are attributed to the
      named reports and preserve their periods. Nulls mean the assigned evidence does
      not quantify the metric, not that the value is zero; the H1 2026 loss discrepancy
      is unresolved.
    claimRefs: [CI004, CI005, CI011, CI012, CI013, CI014, CI015]
figures:
  - id: FI001
    title: Revenue model bridge and missing underwriting links
    type: flow
    summary: >-
      An illustrative, non-quantified bridge separates reported contracted capacity
      and top-line revenue from unreported delivery, margin, and cash-conversion inputs.
    data:
      nodes:
        - id: contracted-capacity
          label: "Long-term customer capacity booking"
          detail: "Light Reading reports legally binding commitments for IT-power capacity."
        - id: campus-delivery
          label: "Build, power, and energize campus"
          detail: "Project-level completion, cost, and energization schedules are not quantified here."
        - id: customer-service
          label: "Deliver data-center capacity"
          detail: "The retained sources do not map individual contracts to delivered capacity."
        - id: recognized-revenue
          label: "Recognize revenue"
          detail: "Light Reading reports US$512 million total revenue for H1 2026; mix and billing bridge are absent."
        - id: adjusted-ebitda
          label: "Adjusted EBITDA"
          detail: "Startup Fortune reports US$205.9 million and a 40.2% margin for H1 2026; adjustments are not reconciled here."
        - id: operating-result
          label: "Account for operating costs"
          detail: "H1 2026 net-loss reports differ: US$81.9 million versus US$77.2 million; gross margin is not reported here."
        - id: cash-conversion
          label: "Convert to cash after capex"
          detail: "Cash flow, working capital, and current liquidity remain unquantified."
      edges:
        - from: contracted-capacity
          to: campus-delivery
        - from: campus-delivery
          to: customer-service
        - from: customer-service
          to: recognized-revenue
        - from: recognized-revenue
          to: adjusted-ebitda
        - from: adjusted-ebitda
          to: operating-result
        - from: operating-result
          to: cash-conversion
    approximationNotes: >-
      Analytical sequence only, not a disclosed company schedule or a reconciled
      waterfall; the sources do not connect individual bookings to revenue, margin, or cash.
    claimRefs: [CI001, CI004, CI005, CI016]
