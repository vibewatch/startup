      - [Confidence, medium, "The available company-specific evidence is largely secondary reporting."]
      - [Risk rating, high, "Reported customer concentration, operating losses, power constraints, and financing uncertainty remain material."]
      - [Valuation stance, unknown, "The reported US$20 billion figure is not an official mark tied to audited earnings or cash flow."]
      - [Entry discipline, "Require offer price, share count, net-debt bridge, and customer and contract disclosures", "Do not set a target return or exit multiple until those inputs are available."]
    notes: >-
      IPO terms and operating figures are attributed to the cited reports; the
      ratings and decision implication are this chapter's evidence-limited
      assessment, not a disclosed company or investor judgment.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV011, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, Counterevidence or uncertainty, What would change the view]
    rows:
      - ["Demand and scale", "Reports cite more than 1.5 GW of capacity bookings and first-half revenue growth.", "Bookings are not revenue; reported first-half net loss widened.", "Audited occupancy, contracted-versus-delivered MW, and cash conversion."]
      - ["AI infrastructure opportunity", "CBRE and the IEA describe rising data-center demand and investment.", "Power availability, grid connections, and approvals constrain delivery.", "Site-level energized MW, power contracts, and schedule performance."]
      - ["Capital access", "Coverage reports a US$4.5 billion Series C and IPO preparation.", "The proposed expanded loan facility is not shown as closed, and final IPO terms remain unsettled.", "Audited debt, covenant, preference, and project-finance disclosures."]
      - ["Public-market exit", "An October report described an IPO filing and an earlier report named proposed underwriters.", "Bloomberg later reported possible delay or smaller proceeds; customer and ownership risks remain.", "Final registration statement, offer price, allocation, and governance terms."]
    notes: >-
      Company-specific operating and transaction metrics are reported figures,
      not independently audited in this evidence set; diligence items are
      decision tests rather than claims that the missing information is
      unavailable elsewhere.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV014, CV015]
  - id: TV003
    title: Conditional bull, base, and bear cases
    columns: [Case and assumptions, Valuation anchor or range, Return logic, Probability signal, Downside trigger]
    rows:
      - ["Bull: audited growth converts into durable cash flows; power delivery and customer retention remain strong; the IPO window reopens", "No supported range; approximately US$20 billion is a reported target, not an appraisal.", "No per-share return can be calculated without an offer price and share count.", "Unassigned; no evidence supports a numeric probability.", "Customer loss, power delays, or failure to convert bookings into profitable capacity."]
      - ["Base: expansion continues but power access and capital availability govern timing; an IPO may be resized or delayed", "Not estimable from assigned public evidence.", "Potential US$2.5 billion–US$3 billion IPO proceeds are not a valuation or return measure.", "Unassigned; no evidence supports a numeric probability.", "Prolonged delay, higher financing costs, or persistent operating losses."]
      - ["Bear: market access deteriorates or delivery, customer, or financing risks worsen", "No supportable numerical downside range; the reported US$20 billion figure is not a floor.", "A downside return requires a market price, share count, and capital-structure bridge.", "Unassigned; no evidence supports a numeric probability.", "IPO cancellation or repricing, customer concentration, or power and approval bottlenecks."]
    notes: >-
      These are conditional scenarios, not forecasts. No numerical probability,
      target return, or valuation range is supplied because the assigned sources
      do not provide enough primary financial or offering data. IPO proceeds
      are kept distinct from company valuation.
    claimRefs: [CV002, CV004, CV005, CV006, CV007, CV008, CV009, CV011, CV012, CV016]
