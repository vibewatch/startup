company:
  name: DayOne Data Centers
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public reporting describes a large financing base and an ambitious IPO target,
    but the latest reported possibility is a delay or smaller offering and the
    available evidence does not establish an official valuation or investor return.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      DayOne's investment case rests on reported demand and access to capital:
      coverage describes a US$4.5 billion Series C, more than 1.5 GW of capacity
      bookings, and first-half 2026 revenue growth. Those are meaningful scale
      signals, but reported bookings are not recognized revenue and revenue is
      not cash generation. The same reporting gives a first-half net loss and
      warns of dependence on a limited number of hyperscale customers. On the
      supply side, CBRE and the IEA identify power availability, grid connections,
      and approvals as constraints on where and how quickly data-center capacity
      can be delivered. The thesis therefore depends on converting demand into
      energized, profitable capacity without losing access to customers or
      financing. (CV001, CV006-CV012)
    claimRefs: [CV001, CV006, CV007, CV008, CV009, CV010, CV011, CV012]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: price-and-entry-discipline
    title: Price discipline and public-market evidence
    body: >-
      The approximately US$20 billion figure in the assigned reporting is a
      reported target or market estimate, not an official company or investor
      valuation. The reported US IPO proceeds target also needs to be kept
      separate from enterprise value, equity value, and investor return: Bloomberg
      later reported that DayOne was weighing a delay or an offering raising
      US$2.5 billion to US$3 billion. Neither report supplies an offer price,
      share count, or a complete capital structure. GDS Holdings' market
      capitalization is a contextual public-market observation, not a like-for-like
      DayOne valuation multiple; the companies' business perimeters and ownership
      differ. With no audited standalone earnings, net debt bridge, or final terms
      in this evidence set, an entry price or target return would be false precision.
      (CV002-CV005, CV013-CV016)
    claimRefs: [CV002, CV003, CV004, CV005, CV013, CV014, CV015, CV016]
    tableRefs: [TV001]
  - id: scenarios-and-exit
    title: Scenario framing and exit readiness
    body: >-
      The scenarios below are conditional decision cases, not forecasts or
      probability-weighted price targets. The bull case requires disclosed
      financials, reliable power delivery, customer durability, and a receptive
      IPO window; its only available valuation reference is the reported
      approximately US$20 billion target. The base case allows for a resized or
      delayed transaction while capacity and financing execution remain central.
      The bear case is a delay or repricing if market access, customer
      concentration, losses, or power constraints worsen. Bloomberg's reported
      US$2.5 billion–US$3 billion alternative refers to potential IPO proceeds,
      not company valuation. No numerical return, probability, or downside range
      is supportable until primary offering terms and audited standalone
      financials are available. (CV004-CV009, CV011, CV012, CV015, CV016)
    claimRefs: [CV004, CV005, CV006, CV007, CV008, CV009, CV011, CV012, CV015, CV016]
    tableRefs: [TV003]
tables:
