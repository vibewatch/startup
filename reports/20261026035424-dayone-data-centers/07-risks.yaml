schemaVersion: "report-v2"
artifact: risks
slug: dayone-data-centers
runDate: "2026-10-26"
company:
  name: DayOne Data Centers
chapter:
  number: 7
  title: Risks
  summary: >-
    The clearest risk evidence concerns public-market timing, capital-intensive power- and
    cooling-dependent campuses, and jurisdictional approval constraints. Public sources
    describe announced capital and aggregate demand metrics, but do not establish customer
    concentration, debt terms, site-level approvals, or operating performance.
sections:
  - id: capital-market-exposure
    title: Capital-market timing and funding dependence
    body: >-
      The financing thesis is exposed to public-market timing as well as construction
      capital needs. Bloomberg reported on October 21, 2026 that DayOne was weighing a
      delay or smaller US IPO and that a smaller offering could raise US$2.5–3.0 billion,
      roughly half the original target (CR001, CR002). Earlier coverage by Mission Media
      described an approximately US$5 billion target, so the newer report is evidence of
      a changed range under volatile market conditions, not proof that an offering was
      cancelled or repriced (CR002). DayOne announced definitive agreements for more than
      US$2.0 billion of Series C equity in January 2026; its release said this followed
      US$1.9 billion of Series A and B equity; the company separately described an
      up-to-€1 billion mezzanine facility secured in 2025 (CR003, CR004, CR016).
      ISI Markets later reported that an expansion of a corporate loan facility to as
      much as US$7 billion was being negotiated, not closed (CR015). These amounts
      describe financing raised, announced, or under discussion;
      they do not establish current unrestricted cash, drawn debt, covenants, or funding
      available for specific projects.
    claimRefs: [CR001, CR002, CR003, CR004, CR015, CR016]
  - id: customer-concentration
    title: Customer concentration and contract visibility
    body: >-
      The assigned evidence does not quantify customer concentration. DayOne's January
      2026 release said its expansion investments would support approximately 1GW of
      secured customer commitments (CR005), while ISI Markets later reported more than
      1.5GW of customer bookings since the company launched in 2022 (CR006). Those
      differently named totals do not disclose a common measurement date, definition,
      customer split, or contract status, so they should not be added or treated as a
      reconciled contracted-MW backlog. Neither source provides customer-by-customer
      revenue, contracted MW, renewal protection, or cancellation rights. A large
      counterparty deferral could still reduce utilization and cash recovery, but its
      magnitude cannot be established from aggregate bookings. Diligence should reconcile
      booking-to-contract conversion and customer exposures against the campus capex
      schedule before relying on demand visibility.
    claimRefs: [CR005, CR006]
    tableRefs: [TR003]
  - id: permitting-and-resource-constraints
    title: Permitting, power, and resource constraints
    body: >-
      DayOne's Singapore buildout sits within a deliberately limited capacity-allocation
      regime. Data Center Dynamics reported that SG1 is a 20MW project with Phase I
      scheduled for ready-for-service in 2026, and that DayOne received capacity through
      a pilot scheme in which four operators shared 80MW (CR007, CR008). Reed Smith
      describes Singapore's measured growth, land, power, and water constraints, noting
      that no new capacity had been allocated since the 2023 pilot and that new projects
      face stringent approval and efficiency standards (CR011). This establishes
      regulatory and resource exposure, not a finding that DayOne lacks a permit or
      allocation. For Thailand, a July 2026 legal update describes a PUE threshold of
      1.3 for high-efficiency data centers seeking tax privileges, alongside security,
      redundancy, water-management, and workforce conditions (CR012). It also reports
      government attention to energy, water, and community impacts (CR013). The assigned
      sources do not establish which DayOne sites have completed each local approval.
    claimRefs: [CR007, CR008, CR011, CR012, CR013]
    tableRefs: [TR001]
  - id: operating-delivery-risk
    title: Commissioning, reliability, and operational execution
    body: >-
      A schedule milestone is not operating proof: the SG1 Phase I date is described as
      scheduled for 2026, while the assigned sources do not confirm commissioning,
      utilization, uptime, or achieved energy performance (CR007). Data Center Dynamics
      reports a 10-year power purchase agreement with Sembcorp backed by bundled
      renewable-energy certificates (CR009). The agreement is a visible mitigation, but
      it does not establish delivered power volumes, firm grid capacity, or production-
      scale cooling results. A DayOne mechanical-engineer listing hosted by Simplify
      describes preventive and corrective maintenance, vendor coordination, safety
      audits, and 24/7 operations at Lahti (CR014). This is company-issued evidence of
      stated responsibilities, not evidence of a staffing shortage or an incident.
      Portfolio growth across countries increases the importance of site-by-site
      commissioning, maintenance, and regulatory controls; the evidence does not permit
      a claim that any outage or safety event has occurred.
    claimRefs: [CR007, CR009, CR014]
    tableRefs: [TR002]
  - id: monitoring-and-thesis-breaks
    title: Residual exposure and decision triggers
    body: >-
      The risk ranking below is qualitative and reflects the magnitude of disclosed
      exposure and the visibility of mitigation in the assigned evidence, not a measured
      probability model. Bloomberg's report of possible IPO delay or downsizing is the
      clearest current market signal; site delivery and regulatory risks remain
      contingent on approvals, power, and commissioning evidence. Aggregate customer
      commitments and bookings do not establish concentration or contract durability.
      The company describes equity funding and customer commitments, and Data Center
      Dynamics reports renewable-power procurement, but sources do not disclose current
      cash availability, debt covenants, site-specific approvals, or independently
      verified operating KPIs (CR001, CR003, CR005, CR006, CR009, CR015, CR016). Re-
      underwrite if a material IPO delay or smaller proceeds leaves committed projects
      without identified financing; if customer-level exposure or protections prove
      concentrated; or if a campus misses a disclosed ready-for-service milestone
      without replacement power or financing. These are diligence and thesis-break tests,
      not predictions of failure.
    claimRefs: [CR001, CR003, CR005, CR006, CR007, CR009, CR015, CR016]
    figureRefs: [FR001]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk and evidence
      - Likelihood
      - Impact
      - Mitigation visibility
      - Residual exposure and diligence trigger
    rows:
      - - "Singapore capacity and approval: SG1 was reported within the 80MW pilot allocation shared among four operators."
        - "Medium; future capacity is constrained, but the cited report says DayOne received pilot capacity."
        - "High; power, land, and approval constraints can affect expansion timing."
        - "Partial; a pilot allocation is reported, but site-level approvals and available capacity are not established."
        - "Confirm permits, allocated MW, grid connection, and remaining phase milestones for each Singapore site."
      - - "Thailand BOI eligibility: DCD reports a DayOne site groundbreaking; the 2026 BOI framework sets conditions for high-efficiency data centers seeking tax privileges."
        - "Medium; the framework is reported, but the site's application and compliance status are not."
        - "High; failure to satisfy applicable conditions could affect incentives, approvals, or schedule."
        - "Unverified for DayOne; the source gives general requirements and no DayOne site assessment."
        - "Obtain site-specific BOI status, PUE design basis, water plan, security controls, and workforce commitments."
      - - "Power and water availability: Singapore and Thailand sources describe constrained power, water, and community considerations."
        - "Medium; the exposure is market-level and site-specific availability is not reported."
        - "High; an unavailable resource or delayed connection can constrain commissioning and utilization."
        - "Partial; DayOne's reported Sembcorp PPA and renewable certificates are mitigants, but volumes and firmness are undisclosed."
        - "Verify contracted MW, connection dates, water balances, and contingency supply for each campus."
      - - "Cross-market approvals: each new site must meet local energy, land-use, and technical requirements."
        - "Medium; DayOne has a multi-country development plan, while site-level completion evidence is limited."
        - "High; regulatory slippage can defer revenue and increase carrying costs."
        - "Partial; company-reported local partnerships do not substitute for permit and milestone evidence."
        - "Reconcile a country-by-country permit register with construction and ready-for-service schedules."
    notes: >-
      Partial, evidence-based register for the Singapore and Thailand requirements visible
      in assigned sources; it is not an exhaustive list of DayOne permits or jurisdictions.
      Likelihood and impact are analyst triage categories, not measured probabilities.
    enumerationScope:
      coverage: partial
      basis: "Selected Singapore and Thailand regulatory exposures described in the assigned evidence set; site-level permit inventory is unavailable."
    claimRefs: [CR007, CR008, CR009, CR011, CR012, CR013]
  - id: TR002
    title: Operational, quality, and reliability risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Mitigation maturity
      - Unresolved evidence and monitoring indicator
    rows:
      - - "SG1 Phase I commissioning or schedule slippage"
        - "Medium; Phase I was scheduled for 2026, with no completion confirmation in assigned sources."
        - "High; delayed ready-for-service capacity can defer utilization and customer delivery."
        - "Partial; a project schedule and reported pilot allocation are visible."
        - "Track delivered phase MW, customer acceptance, commissioning tests, and any schedule revision."
      - - "Cooling-system performance under high-density or tropical loads"
        - "Medium; the company describes cooling initiatives, while production-scale performance is not reported."
        - "High; insufficient cooling can constrain safe, reliable IT load."
        - "Early-stage evidence; NUS testbed collaboration is reported as research and development."
        - "Request site PUE, thermal redundancy, liquid-cooling acceptance, and measured seasonal performance."
      - - "Power procurement or grid connection does not match project ramp"
        - "Medium; a 10-year PPA is reported, but volume, delivery profile, and grid conditions are not disclosed."
        - "High; power shortfall may delay commissioning or limit sellable capacity."
        - "Partial; Sembcorp agreement and renewable certificates are reported, without site-level delivery evidence."
        - "Reconcile contracted load, grid milestones, backup capacity, and customer ramp dates."
    notes: >-
      Risk ratings are qualitative analyst assessments. The cited partnership reports
      describe planned controls, not independently verified uptime, safety, or operating
      results; no incident absence is inferred.
    claimRefs: [CR007, CR009, CR010]
  - id: TR003
    title: Partner, customer, and financing dependency register
    columns:
      - Dependency
      - Reported exposure
      - Failure scenario
      - Mitigation visibility
      - Residual diligence
    rows:
      - - "Customer bookings and contract conversion"
        - "DayOne reported approximately 1GW of secured customer commitments; ISI Markets separately reported more than 1.5GW of bookings since launch in 2022."
        - "A large-customer deferral or failed booking-to-contract conversion could reduce utilization and cash recovery."
        - "Aggregate demand is reported, but customer-level exposure and contract protections are not disclosed."
        - "Reconcile metric definitions, customer concentration, contract tenor, take-or-pay terms, renewal rights, and customer credit."
      - - "IPO market and project financing"
        - "Bloomberg reports a possible delay or US$2.5–3.0B smaller IPO; ISI Markets says a corporate loan expansion to as much as US$7B was being negotiated."
        - "Reduced or delayed proceeds could require reprioritization, additional debt, or slower campus delivery."
        - "Company-announced Series C equity and earlier mezzanine financing are visible, but funding availability and debt terms are not."
        - "Confirm offering status, unrestricted cash, debt drawn, maturities, covenants, collateral, and committed project funding."
      - - "Power supplier and energy attributes"
        - "Data Center Dynamics reports a 10-year PPA with Sembcorp and bundled renewable-energy certificates."
        - "A delivery, pricing, or grid-connection mismatch could constrain power-intensive capacity."
        - "A long-duration agreement is reported; volumes, site allocation, and firm delivery protections are not."
        - "Review contract schedule, curtailment terms, price escalators, REC accounting, and backup arrangements."
      - - "Local regulators, utilities, and technical partners"
        - "Reported dependencies include Singapore's capacity pilot, Thailand's BOI framework, and an NUS cooling research partnership."
        - "Approval, utility, or validation delays may defer site milestones or prevent incentive eligibility."
        - "Public sources identify the frameworks and partners but not site-specific approval completion."
        - "Obtain a project-by-project responsibility matrix, approval tracker, and partner service-level commitments."
    notes: >-
      Aggregate customer-demand and financing figures retain their stated labels,
      periods, and uncertainty. The cited evidence does not disclose customer shares,
      contract terms, current cash availability, or project-specific partner obligations.
    claimRefs: [CR001, CR003, CR004, CR005, CR006, CR009, CR011, CR015, CR016]
