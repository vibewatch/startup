schemaVersion: "report-v2"
artifact: customers
slug: dayone-data-centers
runDate: "2026-10-26"
company:
  name: DayOne Data Centers
chapter:
  number: 6
  title: Customers
  summary: >-
    DayOne's customer proposition is large-scale, powered colocation for cloud and AI
    operators, and secondary sources report bookings above 1.5 GW. Public evidence also
    points to substantial customer concentration and leaves named deployments, contract
    durability, and the conversion from bookings to billable capacity unresolved.
sections:
  - id: buyer-segments
    title: Buyer segments and the regional proposition
    body: >-
      Public descriptions place DayOne between infrastructure development and customer
      operations: it secures and operates powered, cooled facilities, while customers
      install their own computing and network equipment. Indexed.vc characterizes its
      target market as hyperscalers, cloud providers, and enterprises; AI in Asia also
      describes cloud and AI operators as users. These are reported target segments, not a
      verified account roster. YesPress presents Singapore, Johor, and Batam as a connected
      SIJORI proposition, but does not identify which customers use each location or
      disclose customer outcomes there.
    claimRefs: [CU001, CU002, CU012]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Bookings are not yet a retention or utilization record
    body: >-
      Two publications report more than 1.5 GW of customer bookings since DayOne's 2022
      inception, with YesPress attributing the figure to a June 2026 company statement.
      Separately, YesPress reports 1,250 MW of committed and 444 MW of billable IT power at
      December 31, 2025. Those are different measures and reporting dates; the available
      evidence does not reconcile them into a common cohort or show how much booked demand
      became energized, occupied, and invoiced. The gap is commercially important for a
      capital-intensive operator, but it is not a calculated conversion rate.
    claimRefs: [CU003, CU004, CU005]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-customer-proof
    title: Concentration is visible; named deployment proof is not
    body: >-
      Startup Fortune reports that the largest customer represented 69.4% of 2025 revenue
      and 69.2% of first-half 2026 revenue. Mukhbir, summarizing Reuters Breakingviews,
      attributes 84.3% of first-half 2026 revenue to ByteDance and Oracle together. The
      attribution is secondary reporting rather than a company-named customer reference:
      Startup Fortune says the preliminary prospectus did not name the largest customer.
      The assigned sources do not provide named site-level deployment status, contract
      duration, customer-quoted outcomes, or an independently validated reference.
    claimRefs: [CU006, CU007, CU008]
    tableRefs: [TU003]
  - id: durability-and-alternatives
    title: Retention and workload alternatives remain diligence priorities
    body: >-
      None of the reviewed customer-focused sources supplies NRR, GRR, churn, renewal,
      cohort, or contract-duration metrics, so booking scale and revenue concentration
      cannot establish customer durability. Public cloud alternatives also matter to
      buyer choice: Oracle lists live regions in Batam, Kulai, and Singapore, while
      Microsoft's November 2025 announcement described a planned Johor Bahru region and
      named Malaysian Azure users. These are market alternatives and Microsoft customer
      examples, not evidence that those organizations are DayOne customers or that the
      services are interchangeable for every workload.
    claimRefs: [CU009, CU010, CU011]
tables:
  - id: TU001
    title: Customer segments and evidence status
    columns:
      - Segment / relationship
      - Buyer, user, or payer
      - Use case / scale
      - Evidence status
      - Diligence limitation
    rows:
      - - Hyperscalers and cloud providers
        - Large-capacity buyer; customer installs compute and network equipment
        - Powered, cooled colocation and interconnection
        - Reported target segment; no named DayOne account roster in the assigned sources
        - Contracted capacity, customer count, and site-level use are not disclosed here
      - - AI operators
        - Operator of customer-owned compute
        - Regional capacity for cloud and AI workloads
        - Described as a user segment by AI in Asia and YesPress
        - No named tenant, production status, or customer-quoted outcome is verified
      - - Enterprise customers
        - Enterprise buyer or workload owner
        - Colocation and interconnection services
        - Indexed.vc lists enterprises among target customer types
        - No named DayOne enterprise deployment is established by that profile
      - - Public-cloud alternatives, not verified DayOne customers
        - Cloud buyers choosing public cloud or colocation
        - Local cloud-region access in Malaysia and the SIJORI cluster
        - Microsoft and Oracle publish regional service information
        - These sources do not establish DayOne customer overlap or substitution rates
    notes: >-
      Segment labels combine third-party company profiles and official competitor
      disclosures; target segments and adjacent alternatives are not proof of active
      DayOne customers.
    claimRefs: [CU001, CU002, CU009, CU010, CU011]
  - id: TU002
    title: Customer adoption and operating-capacity indicators
    columns:
      - Metric
      - Value and period
      - Source attribution
      - Confidence / interpretation
      - Missing denominator or caveat
    rows:
      - - Customer bookings
        - More than 1.5 GW since 2022; reported by June 2026
        - YesPress and ISI Markets report the figure
        - Medium; secondary reporting of a company statement
        - Bookings are not identified as active, billable, or utilized capacity
      - - Committed IT power
        - 1,250 MW at December 31, 2025
        - YesPress
        - Low; one secondary source
        - Definition and relationship to customer bookings are not reconciled
      - - Billable IT power
        - 444 MW at December 31, 2025
        - YesPress
        - Low; one secondary source
        - Not customer count, utilization, or revenue per MW
      - - Retention and renewal metrics
        - Not reported in the reviewed assigned sources
        - Evidence gap; not a zero value
        - Unresolved
        - NRR, GRR, churn, renewals, cohorts, and contract duration are unavailable
    notes: >-
      The reported booking, committed, and billable measures have different labels and
      vintages. No booking-to-billable conversion, utilization rate, or retention metric is
      calculated from them.
    claimRefs: [CU003, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer or proof category
      - Reported segment / metric
      - Production status and outcome
      - Source attribution
      - Limitation
    rows:
      - - Largest customer, not named in the prospectus according to Startup Fortune
        - 69.4% of 2025 revenue; 69.2% of first-half 2026 revenue
        - No deployment site, contract term, or customer-quoted outcome reported
        - Startup Fortune; Mukhbir separately reports roughly 69% for ByteDance via Reuters
        - Revenue share, not MW share or customer count; identity is not company-confirmed
      - - ByteDance and Oracle, identified only in secondary reporting
        - Reported together at 84.3% of first-half 2026 revenue
        - Individual customer shares and named site deployments are not provided
        - Mukhbir's summary of Reuters Breakingviews; Startup Fortune describes the prospectus as not naming the largest customer
        - Not a company-issued customer reference; no individual Oracle share is stated
      - - Named deployment, pilot, or customer outcome
        - No named DayOne customer deployment or outcome is documented in the reviewed texts
        - Production versus pilot status and reference quality are unverified
        - YesPress describes customer names as mostly confidential; AI in Asia gives customer categories, not named references
        - Absence in this assigned evidence set is not proof that no such deployments exist
    enumerationScope:
      coverage: partial
      basis: >-
        Sample of customer and adoption disclosures in the assigned public-source pool
        through 2026-10-26; private contracts and direct customer references are unavailable.
    notes: >-
      This is a partial sample of publicly reported customer proof. The named-account
      attribution is secondary, while site-level deployment and outcome evidence remains
      unavailable.
    claimRefs: [CU006, CU007, CU008]
figures:
  - id: FU001
    title: From capacity request to billable use
    type: journey-map
    summary: >-
      Conceptual customer path from capacity need to billing; the evidence does not establish
      cohort conversion, retention, or a measured expansion loop.
    data:
      items:
        - label: Capacity need
          actor: Cloud and AI operators
          touchpoints:
            - Seek powered, cooled, connected space for customer-owned equipment
            - Segment is reported; named accounts are not verified
        - label: Reserve capacity
          actor: DayOne and prospective customers
          touchpoints:
            - More than 1.5 GW of bookings since 2022 is reported
              - DayOne presents Singapore, Johor, and Batam as a connected SIJORI proposition
              - Bookings do not establish active use or billing
        - label: Build and energize
          actor: DayOne
          touchpoints:
            - Develops and operates data-center facilities
            - Named customer delivery dates are not available in the assigned evidence
        - label: Customer fit-out
          actor: Customer
          touchpoints:
            - YesPress says customers install their own compute and networking equipment
            - Contract names are described as mostly confidential
        - label: Billable capacity
          actor: DayOne
          touchpoints:
            - 444 MW billable versus 1,250 MW committed at December 31, 2025, as reported
            - The source does not reconcile either figure to bookings
        - label: Renewal or expansion
          actor: Customer and DayOne
          touchpoints:
            - Renewal, churn, cohort, and expansion metrics are not reported in the reviewed sources
            - Repeat use and retention remain unverified
    claimRefs: [CU001, CU003, CU004, CU005, CU008, CU012]
