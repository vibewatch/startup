  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-renewals
      missingEvidence: Current NRR, GRR, churn, renewal, cohort, contract-duration, and customer-level revenue/MW concentration data.
      whyItMatters: Bookings and revenue concentration do not establish repeat usage, renewal behavior, or the durability of customer cash flows.
      diligencePath: Request a customer cohort schedule and anonymized top-customer contract summaries covering term, renewal rights, utilization, and revenue and MW shares.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Independently confirmed named customer deployments with site, production-versus-pilot status, contract duration, customer reference, and measurable outcome.
      whyItMatters: Secondary customer attributions and aggregate bookings do not demonstrate named, active deployments or repeatable customer value.
      diligencePath: Request permissioned customer references and a site-level deployment schedule that reconciles commissioned, billable, and contracted capacity.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: adoption-measurement
      missingEvidence: A consistent time series reconciling bookings, committed IT power, energized capacity, billable capacity, and utilization on a common basis.
      whyItMatters: The reported figures use different stages and dates, preventing an evidence-based assessment of delivery conversion or customer ramp.
      diligencePath: Request dated site-by-site capacity schedules with metric definitions, customer commitments, energization, billing start, and utilization.
      relatedQuestionRefs: [QU002, QU006]
      relatedTableRefs: [TU002]
