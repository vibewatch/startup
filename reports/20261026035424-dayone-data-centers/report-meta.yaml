  topStrengths:
    - >-
      Reported first-half 2026 revenue of US$512 million and capacity bookings across multiple markets indicate
      substantial operating scale.
    - >-
      A US$4.5 billion Series C and more than US$6 billion of reported equity financing provide meaningful capital
      access.
    - >-
      Regional hyperscale and AI data-center demand supports a large opportunity, although delivery depends on power and
      approvals.
  topRisks:
    - >-
      The largest customer reportedly represented 69.4% of FY2025 revenue, while contract duration and renewal
      sensitivity remain undisclosed.
    - >-
      Conflicting reports put the first-half 2026 net loss at US$77.2 million or US$81.9 million; cash flow, runway, and
      project returns are not established.
    - IPO timing, offer price, share count, and valuation remain unsettled, so investor returns cannot be calculated.
    - Power availability, permitting, and site-level delivery milestones could constrain a capital-intensive expansion.
  unresolvedGaps:
    - >-
      Reconcile audited standalone statements, first-half loss figures, adjusted EBITDA definitions, cash flow, debt,
      committed capex, and runway.
    - >-
      Obtain final IPO terms, offer price, share count, net-debt bridge, and capital structure before estimating
      valuation or returns.
    - Verify customer-level revenue and MW concentration, contract duration, renewal terms, and named site deployments.
    - Reconcile booked capacity to energized, billable, and recognized revenue by customer and campus.
    - Obtain site-level power allocation, permits, commissioning milestones, and capex per delivered MW.
    - Identify founders and leadership roles from authoritative company disclosures.
