companyProfile:
  summary: >-
    DayOne Data Centers is a Singapore-headquartered developer and operator of hyperscale data centers for cloud, AI,
    and large-enterprise customers. The reported platform spans Singapore, Johor, and Batam, with additional expansion
    plans in Finland. Reports describe rapid revenue growth, substantial capacity bookings, and a US$4.5 billion Series
    C, but customer concentration, conflicting reported losses, and limited disclosure on cash generation and project
    economics leave the growth and funding profile incompletely underwritten. The reviewed company-facing sources do not
    identify founders or executives.
