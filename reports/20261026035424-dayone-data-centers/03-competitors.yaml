company:
  name: DayOne Data Centers
chapter:
  number: 3
  title: Competitors
  summary: DayOne competes for hyperscale and AI-ready infrastructure demand against AirTrunk and adjacent interconnection incumbents, but available scale figures are unevenly scoped and mostly company-reported. Public evidence supports a regional platform strategy, while comparable pricing, customer-level switching costs, and independently verified operating performance remain unavailable.
sections:
  - id: direct-hyperscale-peers
    title: Direct hyperscale peers and scale signals
    body: >-
      DayOne's company announcement positions it as a multi-market, high-density platform and reports approximately 1 GW of secured customer commitments; those are company claims, not independent operating benchmarks. Data Center Index tracks only two named DayOne campuses and 72 MW across them, explicitly warning that its coverage is not every building. AirTrunk is a direct regional alternative: its reproduced company announcement describes more than 280 MW of planned Johor capacity at JHB3 and JHB4, while saying JHB1 and JHB2 exceed 420 MW and are nearly fully contracted. These figures use different geographies, dates, and pipeline definitions, so they indicate competitive investment rather than a like-for-like capacity ranking.
    claimRefs: [CP002, CP003, CP004, CP005, CP006]
    tableRefs: [TP001]
  - id: incumbents-and-positioning
    title: Incumbents, adjacency, and buyer access
    body: >-
      Digital Realty is an adjacent incumbent rather than a direct scale match in the available Malaysia evidence: Tech Wire Asia reports three Cyberjaya assets with an approximately 32 MW IT-capacity target, including a 15 MW AI/HPC facility and a future 14 MW site. Its enterprise pitch is differentiated around private AI environments, multi-cloud access, and interconnection; its ServiceFabric platform is planned for Malaysia in the second half of 2026 subject to licensing approvals. Equinix's Johor page emphasizes colocation, Equinix Fabric, Network Edge, and a broad global network ecosystem, but its customer and network-provider totals are company-reported global figures, not Johor metrics. The map therefore scores evidence visibility, not service quality or actual market share.
    claimRefs: [CP009, CP010, CP011, CP012]
    figureRefs: [FP001]
  - id: pricing-and-buyer-tradeoffs
    title: Pricing, packaging, and procurement tradeoffs
    body: >-
      The retained sources do not establish comparable list prices, realized rates, contract lengths, power commitments, or discounting for DayOne, AirTrunk, Digital Realty, or Equinix. Data-center deals are shaped by capacity, delivery timing, power availability, connectivity, and service scope, but the assigned evidence does not quantify those commercial terms; no price-per-megawatt comparison is defensible here. Digital Realty's reported enterprise-private-AI use case and Equinix's interconnection products show alternatives buyers may evaluate alongside hyperscale capacity, while the evidence does not show which provider wins on total cost. Pricing and contract-level customer evidence should be obtained before asserting a cost moat or undercutting advantage.
    claimRefs: [CP016]
    tableRefs: [TP002]
  - id: durability-and-displacement
    title: Switching costs, moat durability, and displacement risk
    body: >-
      The plausible moat is execution at scale: secured customer commitments, nearly contracted campus capacity, and access to power, land, financing, and delivery partners can make a provider difficult to replace once a facility is built and commissioned. The current sources substantiate some announced commitments and investment, but they do not disclose DayOne contract tenor, customer concentration, renewal behavior, switching costs, or site-level delivery performance. Bloomberg's October report that DayOne was weighing an IPO delay or a smaller offering amid data-center volatility, alongside its March report on a potential loan increase, makes financing conditions a material competitive variable rather than proof of distress. Competitor announcements show substantial supply expansion; they do not prove displacement or establish an independent benchmark.
    claimRefs: [CP002, CP006, CP007, CP013, CP014, CP015]
    tableRefs: [TP003]
