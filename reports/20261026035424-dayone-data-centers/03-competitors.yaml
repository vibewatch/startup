    rows:
      - [DayOne, Direct hyperscale peer, "Company reports approximately 1 GW of secured customer commitments and a Series C above US$2.0 billion; Data Center Index tracks 72 MW across two named campuses", "Hyperscalers and large enterprises, per company description", "Multi-market platform and high-density AI-ready design, per company announcement", "Tracked campus capacity is explicitly partial; company commitment and financing claims are not audited operating scale"]
      - [AirTrunk, Direct hyperscale peer, "Company announcement says JHB3/JHB4 add more than 280 MW and existing JHB1/JHB2 exceed 420 MW", "Global cloud and AI customers, per company announcement", "Johor hyperscale expansion, recycled-water cooling, and a stated six-market platform", "Company-reported planned capacity and customer commitments are not directly comparable with DayOne's tracked campus data"]
      - [Digital Realty, Adjacent incumbent, "Three Cyberjaya assets with an approximately 32 MW IT-capacity target, including a future site", "Enterprise private AI and multi-cloud users, as reported by Tech Wire Asia", "Carrier density, independent fiber paths, and a ServiceFabric connection planned subject to approvals", "Malaysia is a smaller disclosed footprint; no comparable pricing or local customer outcomes in assigned evidence"]
      - [Equinix, Incumbent colocation and interconnection provider, "Johor data-center offering; no Johor capacity figure in the retained page", "Enterprise, network, and cloud ecosystem users, per Equinix", "Colocation, Equinix Fabric, Network Edge, and stated global ecosystem scale", "Uptime and ecosystem metrics are company claims; global totals do not establish Johor-specific performance"]
      - [Enterprise internal build or private cage, Substitute or status quo, "No capacity or cost benchmark in assigned sources", "Enterprises seeking control of private AI environments, as described in a Digital Realty interview", "Can keep workloads in an enterprise-controlled environment while connecting to multiple clouds", "Evidence is a provider's use-case description, not a customer reference or proof of lower cost"]
    notes: "Company announcements and vendor pages are labeled as such; campus, planned, operational, and global platform figures have different scopes. The table is a landscape sample from the assigned pool, not an exhaustive census."
    claimRefs: [CP001, CP002, CP004, CP005, CP006, CP009, CP012]
  - id: TP002
    title: Pricing and packaging evidence gaps
    columns: [Provider or alternative, Published price or unit rate in assigned sources, Contract or package detail retained, Diligence implication]
    rows:
      - [DayOne, "Not established in assigned sources", "No comparable contract length, power reservation, or realized rate retained", "Request customer-level pricing by market, MW, delivery date, and power terms"]
      - [AirTrunk, "Not established in assigned sources", "Investment and campus announcements do not disclose customer rates or discounts", "Separate construction financing from customer economics and realized returns"]
      - [Digital Realty, "Not established in assigned sources", "Product and connectivity descriptions do not provide a comparable quote", "Request pricing for powered capacity, cross-connects, and managed services"]
      - [Equinix, "Not established in assigned sources", "Product pages identify service categories but no retained Johor rate card", "Request local colocation, port, and interconnection pricing and contract terms"]
    notes: "“Not established” means the assigned successful source pool did not provide a comparable term; it does not mean the provider has no public or negotiated pricing."
    claimRefs: [CP016]
  - id: TP003
    title: Durability signals versus unresolved switching evidence
    columns: [Signal, What the evidence says, What it does not establish, Underwriting implication]
    rows:
      - [DayOne customer commitments, "DayOne's company announcement reports approximately 1 GW of secured commitments", "Customer identities, concentration, contract tenor, cancellation rights, or realized utilization", "Obtain anonymized contract schedule and site-level delivery milestones"]
      - [AirTrunk contracted capacity, "AirTrunk says JHB1 and JHB2 exceed 420 MW and are nearly fully contracted", "Pricing, duration, renewal, credit quality, or realized margin", "Treat as a disclosed demand signal, not a verified utilization or margin benchmark"]
      - [Capital access, "Bloomberg reported a possible increase to DayOne's existing loan and later reported IPO size/delay options", "Completed financing terms, available cash, covenants, or a demonstrated funding shortfall", "Stress-test capacity delivery against financing and capital-market access"]
      - [Incumbent network ecosystems, "Equinix lists interconnection products and global customer/network-provider counts", "Johor-specific switching costs or customer retention", "Request customer references and local network-density data before assigning lock-in"]
      - [Overall durability, "The source set shows regional build-out and differentiated interconnection offers", "No independent comparative benchmark of DayOne reliability, switching friction, or customer economics", "Do not treat pipeline, partnership access, or vendor claims as a proven moat"]
    notes: "Signals describe company announcements and reported strategic options, not audited performance. Switching-cost conclusions remain open without customer contracts, retention data, or independent service benchmarks."
    claimRefs: [CP002, CP006, CP009, CP012, CP013, CP014, CP015]
figures:
  - id: FP001
    title: Evidence visibility across footprint and customer access
    type: quadrant
    summary: Ordinal map of how much the assigned sources disclose about regional footprint and customer access; it is not a ranking of capability or market share.
    data:
      xAxis:
        label: Publicly described regional footprint evidence (ordinal)
        min: 1
        max: 5
        description: "1 = narrow or no footprint detail in this pool; 5 = multiple markets or campuses described."
      yAxis:
        label: Publicly described customer access or interconnection evidence (ordinal)
        min: 1
        max: 5
        description: "1 = little direct detail in this pool; 5 = explicit customer, network, or multi-cloud access detail."
      points:
        - label: DayOne
          x: 5
          y: 2
          note: "Company announcement names seven markets and about 1 GW of customer commitments; the assigned sources provide limited independent service-level or interconnection detail."
        - label: AirTrunk
          x: 2
          y: 3
          note: "The assigned sources describe planned and financed Johor campuses; they do not establish an equivalent multi-market footprint comparison."
        - label: Digital Realty
          x: 3
          y: 5
          note: "Reporting describes a Malaysia campus and an enterprise multi-cloud/interconnection offer; ServiceFabric availability in Malaysia remains subject to approvals."
        - label: Equinix
          x: 2
          y: 5
          note: "Its Johor page describes colocation and interconnection; displayed customer and network-provider counts are global company claims."
        - label: Enterprise private AI cage
          x: 1
          y: 3
          note: "A provider-described buyer use case involves an enterprise-controlled private AI environment; no independent customer case is retained."
        - label: Hyperscaler shared infrastructure
          x: 1
          y: 1
          note: "The interview mentions shared hyperscaler infrastructure as a contrast, but the assigned pool contains no comparative footprint or service detail."
    approximationNotes: "Ordinal scores summarize disclosure in this assigned source set only, not actual capability, quality, or market share. Unknowns are not evidence of absence."
    claimRefs: [CP003, CP008, CP010, CP011, CP015]
callouts:
  - calloutType: risk
    title: Pipeline is not a demonstrated moat
    body: "Capacity announcements and secured-commitment claims support a credible scale strategy, but customer concentration, contract economics, delivery execution, and independent operating comparisons remain unresolved."
    claimRefs: [CP002, CP004, CP005, CP006, CP014, CP015]
