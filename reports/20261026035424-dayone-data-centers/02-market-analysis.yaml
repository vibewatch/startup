company:
  name: DayOne Data Centers
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    CBRE's Q1 2026 evidence shows tight, growing Asia-Pacific data-center markets,
    with Singapore commanding high asking rents but also facing supply constraints.
    DayOne's reported bookings indicate a large development pipeline, not a
    standalone market-size estimate; absolute TAM, budget ownership, and project
    economics remain unproven in the retained evidence.
sections:
  - id: boundary-and-sizing
    title: Market boundary and evidence-constrained sizing
    body: >-
      The relevant market is leased or contracted data-center capacity, measured
      by location, power, availability, and rent—not the broader revenue pools
      for cloud software, AI models, chips, or digital services. This keeps
      operator capacity distinct from the workloads that create demand. CBRE
      reported 13.4% year-over-year inventory growth in Q1 2026 across its
      Singapore, Tokyo, Hong Kong, and Sydney basket, alongside 608.9 MW of
      regional net absorption; those are growth and quarterly flow measures,
      not an absolute Asia-Pacific TAM (CM001, CM004, CM015). The region's
      reported 7% vacancy also masks substantial market variation, from 2% in
      Singapore to 18% in Hong Kong (CM002). Singapore's average asking rent
      was $403 per kW/month for 250-to-500-kW capacity, a price proxy for a
      defined capacity band rather than total market spend (CM003). No retained
      source supplies a consistent regional inventory denominator, total
      addressable spend, or a defensible DayOne-specific SAM/SOM. The sizing
      table and figure therefore preserve distinct measures and leave the
      monetary market size unquantified (CM015).
    claimRefs: [CM001, CM002, CM003, CM004, CM015]
    tableRefs: [TM001, TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, demand signals, and adoption path
    body: >-
      Public market evidence identifies hyperscalers, neocloud providers, and
      AI-focused operators as demand cohorts, but does not establish their
      relative Asia-Pacific spend or the budget holder for an individual
      deployment (CM005). DayOne's market-facing proposition is long-duration
      capacity for hyperscale cloud and AI workloads; AInvest describes
      take-or-pay arrangements, but this is secondary reporting and not a
      disclosed contract schedule or independently tested retention measure
      (CM011). DayOne's 2.3 GW of booked capacity as of September 20, 2026,
      which it expected to deliver nearly entirely by the end of 2028, is
      evidence of its own contracted pipeline—not the size of the market or
      realized utilization (CM008, CM009). AInvest separately reports 4.6 GW
      of power resources and 962 MW in service on that date; these are distinct
      capacity stages and should not be added together (CM009). Earlier
      coverage reported more than 1.5 GW of bookings since launch in 2022,
      without enough method detail to reconcile its cumulative basis precisely
      to the later snapshot (CM013). The buyer map marks budget ownership and
      adoption triggers as unverified where the sources do not disclose them.
    claimRefs: [CM005, CM008, CM009, CM011, CM013]
    tableRefs: [TM003]
  - id: constraints-and-investment
    title: Supply constraints and investment conditions
    body: >-
      Demand growth does not translate automatically into deliverable capacity.
      CBRE attributes longer development timelines in Asia-Pacific core hubs
      to power availability, higher construction costs, and regulatory
      complexity, while its Q1 2026 report says availability across major
      Asia-Pacific markets fell 43% year over year (CM006). Singapore's low
      vacancy and elevated asking rents are consistent with tight supply, but
      neither establishes that every project can secure power or achieve the
      quoted rent. Water is another site-level input: CNA reports that data
      centers rely heavily on water for server cooling and describes one
      provider's exploration of analytics-led conservation, which is not a
      DayOne result or a sector-wide performance benchmark (CM007). Mission
      Media separately described more than 500 MW of DayOne capacity across
      Asia-Pacific and Europe, but gave no as-of date or comparable
      denominator; it should not be reconciled with newer resource, booked,
      and in-service measures (CM014). Market financing is also exposed to
      timing risk; Bloomberg reported that DayOne was considering a delay or
      a smaller US IPO amid data-center market volatility, while The Straits
      Times described a broader operator IPO pipeline (CM010, CM016). The
      sector's growth case is therefore
      conditional on power, permits, water, construction delivery, and
      financing; project-level costs, customer concentration, and returns
      cannot be inferred from regional rent or inventory data.
    claimRefs: [CM002, CM003, CM006, CM007, CM010, CM012, CM014, CM016]
