  evidenceGaps:
    - type: missing-source
      severity: material
      topic: absolute-market-sizing
      missingEvidence: >-
        A consistent absolute inventory and spend denominator for the relevant
        Asia-Pacific markets and a transparent DayOne-specific SAM/SOM.
      whyItMatters: >-
        Inventory growth, vacancy, rents, and bookings cannot be combined into
        a market value or company share without compatible units and scope.
      diligencePath: >-
        Secure market-level capacity and spend data, then reconcile site,
        power, geography, delivery date, and contract assumptions with DayOne's
        disclosed pipeline.
      relatedQuestionRefs: [QM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-budget-ownership
      missingEvidence: >-
        Customer-level contracts, procurement budget ownership, utilization,
        pricing, and renewal data across hyperscalers, neoclouds, and enterprise
        buyers.
      whyItMatters: >-
        Public descriptions of demand cohorts do not show which budget owners
        convert demand into durable, monetized capacity bookings.
      diligencePath: >-
        Review anonymized customer contracts and site-level bookings,
        utilization, price, power allocation, and renewal schedules with
        management and lenders.
      relatedQuestionRefs: [QM003, QM005]
