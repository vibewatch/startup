figures:
  - id: FM001
    title: Market boundary and available sizing proxies
    type: pyramid
    summary: >-
      The layers narrow from an unquantified market to regional and company
      capacity indicators; their labels are not proportional market values.
    data:
      items:
        - label: Global data-center spend
          value: Not quantified
          valueNote: No global spend denominator is present in the retained evidence.
        - label: Asia-Pacific market basket
          value: 13.4% inventory growth
          valueNote: Year over year in Q1 2026 across Singapore, Tokyo, Hong Kong, and Sydney; not total inventory.
        - label: Singapore capacity market
          value: 2% vacancy
          valueNote: CBRE Q1 2026; Singapore average asking rent was $403 per kW per month for 250-to-500-kW capacity.
        - label: DayOne power resources
          value: 4.6 GW
          valueNote: AInvest-reported resources as of September 20, 2026; not all booked or operating.
        - label: DayOne booked capacity
          value: 2.3 GW
          valueNote: AInvest and The Straits Times reported bookings as of September 20, 2026.
        - label: DayOne in-service capacity
          value: 962 MW
          valueNote: AInvest-reported in-service capacity as of September 20, 2026.
    approximationNotes: >-
      Layers are ordered boundary and capacity indicators, not proportional
      amounts or nested TAM/SAM/SOM values; no conversion, summation, or share
      is inferred.
    claimRefs: [CM001, CM002, CM003, CM008, CM009, CM015]
