chapter:
  number: 5
  title: Product & Technology
  summary: DayOne describes a multi-region hyperscale data-center development and operating platform, with a Singapore facility announcement specifying high-density GPU support, hybrid cooling, renewable-energy sourcing, and an SOFC proof of concept. The assigned sources establish plans and company-reported capacity bookings, but do not verify current site commissioning, measured performance, or independent security and reliability controls.
sections:
  - id: product-and-customer-workflow
    title: Product and customer workflow
    body: >-
      DayOne describes itself as a Singapore-headquartered platform that develops and operates
      next-generation data centers for hyperscalers and enterprises; a provider directory also
      describes cloud, AI, and high-performance workloads. In practical terms, the offered
      product is campus capacity and associated colocation infrastructure, not a disclosed
      standalone software product. DayOne's June 2026 release says it had secured more than
      1.5 GW of total bookings since inception, but bookings are not commissioned capacity,
      utilization, or independently verified customer deployments. The company also calls its
      delivery model proprietary without publishing the technical or operating procedures that
      would establish how it differs from other operators. The module and workflow tables keep
      those claims separate from demonstrated customer outcomes.
    claimRefs: [CE001, CE003, CE016]
    tableRefs: [TE001, TE002]
  - id: campus-footprint-and-maturity
    title: Campus footprint and maturity
    body: >-
      Public descriptions span Singapore, Malaysia, Indonesia, Thailand, Japan, Hong Kong,
      Finland, and Spain, but the sources mix operating, under-development, and planned assets.
      The clearest facility-level description is the July 2025 announcement for SG1: a 20 MW
      Singapore facility with about 40,000 square meters of gross floor area and Phase One
      targeted to be ready for service in 2026. That is a dated forward schedule, not evidence
      that the phase is now commissioned. Directory and media capacity figures use different
      labels and do not provide a reconciled, current site-by-site status. Product diligence
      should therefore distinguish booked demand and campus count from live IT load, energized
      capacity, and customer-accepted deployments.
    claimRefs: [CE002, CE003, CE004, CE010, CE011]
  - id: architecture-and-deployment
    title: Architecture and deployment model
    body: >-
      The Singapore announcement describes high-density GPU support with hybrid air and liquid
      cooling, a ten-year power purchase agreement backed by bundled renewable energy
      certificates, and a solid-oxide fuel-cell proof of concept. It also describes a research
      partnership with the National University of Singapore to test cooling solutions in a
      tropical environment. These are concrete design and development signals, but the sources
      provide no measured PUE, rack density, cooling performance, energy mix, or reliability
      results. The architecture figure groups only the customer interface, campus design, and
      energy/research features explicitly described in the pool; it is not a verified
      engineering schematic.
    claimRefs: [CE005, CE006, CE007, CE008, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-controls
    title: Differentiation, trust, and diligence limits
    body: >-
      DayOne's materials emphasize rapid deployment, high-density designs, low-carbon power
      pathways, and an integrated delivery model. The assigned sources do not establish
      comparative performance or disclose the methods behind these claims. The Singapore
      announcement says LEED Platinum and BCA Green Mark Platinum certifications would be
      applied for; a directory separately lists LEED statuses for several Johor buildings.
      Neither statement establishes certification of SG1. A peer operator's site descriptions
      are useful only as competitor-issued context, not independent benchmarks. Bloomberg's
      report of possible IPO delay or size reduction, alongside Startup Fortune's framing of
      the offering as a test of investor appetite for AI infrastructure, adds capital-timing
      uncertainty, not evidence of a technical failure. Current site-level security,
      redundancy, incident, and service-level evidence remains a material diligence request.
    claimRefs: [CE009, CE012, CE013, CE014, CE015, CE016]
tables:
  - id: TE001
    title: Product module and asset matrix
    columns: [Module or asset, Customer or user, Publicly stated status, Claimed differentiation, Diligence gap]
    rows:
      - [Hyperscale campuses, Hyperscalers and large enterprises, Company says campuses operate or are under development across eight markets, "High-capacity AI-ready infrastructure and regional reach", "Current commissioned capacity and site-by-site operating status are not reconciled in the assigned sources."]
      - [SG1 Singapore facility, GPU and cloud workload customers, "20 MW facility; Phase One targeted for ready-for-service in 2026 in the July 2025 announcement", "High-density GPU support and hybrid air/liquid cooling", "Confirm current RFS status, energized IT load, rack density, and customer acceptance."]
      - [Energy sourcing and SOFC pilot, Singapore facility users and utility partners, "Ten-year PPA described; on-site SOFC is a proof of concept", "Renewable-energy certificates and testing of hydrogen-based energy", "Obtain metered energy mix, carbon accounting, fuel-cell operating data, and fallback design."]
      - [Tropical cooling R&D, Data-center operators and customers, "NUS research partnership announced for pilot-scale testing", "Testing novel cooling approaches in tropical conditions", "Request test results, boundary conditions, and evidence of production deployment."]
    notes: >-
      Statuses are attributed to the cited company announcement or provider listing; planned
      schedules, bookings, and proof-of-concept work are not treated as commissioned capacity
      or measured performance.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow or need, DayOne solution described, Measurable benefit stated, Limitation]
    rows:
      - [Hyperscaler capacity deployment, "Secure large-scale data-center capacity across markets", "Develop and operate hyperscale campuses and offer colocation infrastructure", "Company reports more than 1.5 GW of total bookings since inception", "Bookings are not live capacity, utilization, deployment speed, or customer outcomes."]
      - [AI and GPU compute, "Host high-density compute workloads", "SG1 announcement describes high-density GPU support and hybrid air/liquid cooling", "No measured rack density, PUE, or cooling result is provided", "Design description is not an operating benchmark."]
      - [Lower-carbon facility power, "Supply electricity while managing energy and sustainability constraints", "SG1 PPA with bundled RECs and an SOFC proof of concept", "No measured renewable share, emissions intensity, or fuel-cell output is disclosed", "PPA and pilot descriptions do not establish realized site-wide performance."]
    notes: >-
      Benefits are limited to the source's stated capacity-booking metric or to the absence of
      measured outcome data in the reviewed materials; no conversion from bookings to operating
      capacity is implied.
    claimRefs: [CE003, CE005, CE006, CE007, CE015]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role in the offer, Dependency or status, Principal technical risk or diligence question]
    rows:
      - [Regional campus development, "Provides capacity in APAC and European markets", "Company reports operation or development across eight markets", "What capacity is energized, under construction, permitted, or only planned at each site?"]
      - [GPU and cooling design, "Supports high-density AI workloads", "SG1 is described with GPU support and hybrid air/liquid cooling", "What are rack-density limits, PUE, cooling-water use, and measured thermal performance?"]
      - [Power sourcing, "Supplies facility electricity", "SG1 PPA backed by bundled RECs; SOFC is a proof of concept", "What are actual energy sources, reliability arrangements, and pilot results?"]
      - [Delivery model, "Coordinates development and operations", "Company calls its integrated delivery model proprietary; detail is not published", "Which components are standardized, prefabricated, or controlled in-house, and what delivery evidence exists?"]
      - [Research and assurance, "Tests cooling and supports facility quality", "NUS pilot-scale research announced; SG1 certifications were described as applications to be made", "Request published test results, completed site certifications, and independent security/reliability attestations."]
      - [Capacity reporting, "Indicates scale of the deployment pipeline", "Company reports over 1.5 GW in total bookings; third-party articles use distinct operating, under-construction, and reserved capacity labels", "Reconcile dates, denominators, and commissioning status before treating reported capacity as delivered product."]
      - [Capital timing, "Supports financing of campus development", "Bloomberg reports possible IPO delay or size reduction; Startup Fortune frames the listing as a test of investor appetite", "Assess whether financing changes affect site schedules; neither report identifies a technical failure."]
      - [Performance evidence, "Validates the delivered service", "The assigned source texts provide no measured uptime, PUE, rack density, cooling performance, or customer-accepted operating results", "Request current site metrics and independent assurance."]
    notes: >-
      This is a source-bounded operating map, not an engineering design. Planned facilities,
      research, capacity reports, and certification applications remain distinct from
      commissioned systems and completed assurance. Third-party capacity labels are not
      reconciled because their dates and definitions differ.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE009, CE011, CE014, CE015, CE016]
