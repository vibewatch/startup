evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: leadership-governance-disclosure
    missingEvidence: >-
      Named founders and executives, board composition, voting and control rights, succession arrangements, and
      related-party governance disclosures.
    whyItMatters: >-
      Without leadership and governance evidence, investors cannot assess key-person dependence, oversight quality, or
      control of a capital-intensive multi-jurisdiction platform.
    diligencePath: >-
      Review the filed registration statement and obtain a current board and executive roster, biographies, committee
      mandates, cap table, voting agreements, and succession disclosures.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: interim-net-loss
    missingEvidence: >-
      The filed financial statements and reconciliation explaining the US$81.9 million versus US$77.2 million reported
      first-half 2026 net loss.
    whyItMatters: >-
      A US$4.7 million discrepancy affects the reported loss profile and demonstrates that secondary summaries should
      not substitute for the filing.
    diligencePath: >-
      Reconcile both reports to the six-month income statement and any filing amendments; use the filing's exact metric
      and period.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financing-and-liquidity
    missingEvidence: >-
      A dated round-by-round capital raised schedule and current debt draw, repayment, maturity, covenant, collateral,
      and liquidity data.
    whyItMatters: >-
      Gross equity proceeds and a facility ceiling do not establish total capital raised, outstanding debt, or cash
      available to fund construction.
    diligencePath: >-
      Obtain audited statements, the IPO filing's capitalization and indebtedness sections, debt agreements, and a
      current sources-and-uses schedule.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      Customer count, customer-level revenue and contracted capacity, customer identity or anonymized concentration
      schedule, and renewal / termination terms.
    whyItMatters: >-
      A reported customer concentration near 70% makes revenue durability, bargaining power, and capacity utilization
      sensitive to one relationship.
    diligencePath: >-
      Reconcile the concentration figures to the filing and obtain the top-customer schedule, contract terms, committed
      MW, and current customer count.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: land-transaction-date
    missingEvidence: The year of the June 23 Johor land-sale announcement.
    whyItMatters: >-
      Without the publication year, this transaction cannot be placed precisely against the company's development and
      financing chronology.
    diligencePath: Confirm the publication date from the original Bursa Malaysia announcement or the source's dated page metadata.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: absolute-market-sizing
    missingEvidence: >-
      A consistent absolute inventory and spend denominator for the relevant Asia-Pacific markets and a transparent
      DayOne-specific SAM/SOM.
