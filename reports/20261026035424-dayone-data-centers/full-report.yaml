chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              DayOne describes a capital-intensive infrastructure model: it develops and operates hyperscale data
              centers for hyperscalers and large enterprises, rather than selling a software subscription. The company
              identifies Singapore as its headquarters and presents SIJORI—Singapore, Johor, and Batam—as a connected
              regional platform. This is a company description, not independent evidence that the network has achieved
              the claimed operating advantages. Its public narrative traces the business to GDS International and a GDS
              Holdings spinout; available reports differ in how they describe the timing of the transition to the DayOne
              name and independence. The sources reviewed do not establish a verified total for customers, employees, or
              all-time funding. The snapshot therefore distinguishes reported figures from unknown or unreconciled
              metrics rather than treating a round's gross proceeds as cash on hand.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO007
              - CO008
              - CO010
              - CO011
              - CO012
              - CO013
              - CO015
      - number: '1.2'
        title: Leadership, governance, and ownership
        blocks:
          - type: paragraph
            body: >-
              Available company-facing pages describe an experienced leadership team but do not identify founders, name
              an executive roster, or provide board composition. That leaves key-person dependence, governance quality,
              and control rights unassessed; the absence of names in this assigned source set is not evidence that no
              such disclosures exist. Reporting identifies Coatue and Hillhouse as the two largest shareholders after
              leading the Series C, and identifies the Indonesia Investment Authority and Achi Capital Partners as new
              participants. GDS Holdings remains relevant as former parent: one report says it sold US$385 million of
              shares back to DayOne in January 2026, while another reports a continuing non-controlling stake. Obtain
              the current cap table, board roster, voting arrangements, and related-party terms before relying on
              headline investor names as a proxy for control.
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO016
      - number: '1.3'
        title: Financing and public-market status
        blocks:
          - type: paragraph
            body: >-
              ISI Markets and Data Center Dynamics report a US$4.5 billion gross Series C close in June 2026; ISI says
              the round began with a US$2 billion tranche in January. Data Center Knowledge also reports a December 2025
              mezzanine facility of up to US$1.2 billion. These are financing announcements and reported facility size,
              not a reconciled total of capital raised, debt outstanding, or cash available. On October 5, Bloomberg
              reported that DayOne had filed for a US IPO, while other coverage described a roughly US$5 billion raise
              and a possible US$20 billion valuation. On October 21, Bloomberg reported that the company was weighing a
              delay or an offering reduced to US$2.5 billion–US$3 billion. Neither target is a completed transaction or
              a confirmed valuation. The changing reported timetable is a material execution and market- window
              uncertainty.
            claimRefs:
