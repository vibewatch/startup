            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE015
      - number: '5.2'
        title: Campus footprint and maturity
        blocks:
          - type: paragraph
            body: >-
              Public descriptions span Singapore, Malaysia, Indonesia, Thailand, Japan, Hong Kong, Finland, and Spain,
              but the sources mix operating, under-development, and planned assets. The clearest facility-level
              description is the July 2025 announcement for SG1: a 20 MW Singapore facility with about 40,000 square
              meters of gross floor area and Phase One targeted to be ready for service in 2026. That is a dated forward
              schedule, not evidence that the phase is now commissioned. Directory and media capacity figures use
              different labels and do not provide a reconciled, current site-by-site status. Product diligence should
              therefore distinguish booked demand and campus count from live IT load, energized capacity, and
              customer-accepted deployments.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE010
              - CE011
      - number: '5.3'
        title: Architecture and deployment model
        blocks:
          - type: paragraph
            body: >-
              The Singapore announcement describes high-density GPU support with hybrid air and liquid cooling, a
              ten-year power purchase agreement backed by bundled renewable energy certificates, and a solid-oxide
              fuel-cell proof of concept. It also describes a research partnership with the National University of
              Singapore to test cooling solutions in a tropical environment. These are concrete design and development
              signals, but the sources provide no measured PUE, rack density, cooling performance, energy mix, or
              reliability results. The architecture figure groups only the customer interface, campus design, and
              energy/research features explicitly described in the pool; it is not a verified engineering schematic.
            claimRefs:
