            tableRef: TO003
            claimRefs:
              - CO003
              - CO005
              - CO006
      - number: '1.4'
        title: Scale, concentration, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              Bloomberg reports US$512 million of revenue for the six months ended June 30, 2026, versus US$151.5
              million in the comparable prior-year period. The same article reports an US$81.9 million net loss, while
              Startup Fortune reports US$77.2 million for that period; the discrepancy should be reconciled to the filed
              statements rather than averaged. Startup Fortune also reports that one customer represented 69.4% of 2025
              revenue and 69.2% in the first half of 2026. This is a single-source concentration disclosure and makes
              customer identity, contract duration, renewal terms, and related capacity especially important. The
              available evidence does not establish customer count, a current employee count, total raised across all
              rounds, or a complete debt and covenant schedule. The Johor land transaction and Finnish development plans
              show expansion activity, but do not establish powered, permitted, or revenue-generating capacity.
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
