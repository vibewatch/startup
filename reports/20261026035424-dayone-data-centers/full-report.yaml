  - id: FP001
    title: Evidence visibility across footprint and customer access
    type: quadrant
    summary: >-
      Ordinal map of how much the assigned sources disclose about regional footprint and customer access; it is not a
      ranking of capability or market share.
    data:
      xAxis:
        label: Publicly described regional footprint evidence (ordinal)
        min: 1
        max: 5
        description: 1 = narrow or no footprint detail in this pool; 5 = multiple markets or campuses described.
      yAxis:
        label: Publicly described customer access or interconnection evidence (ordinal)
        min: 1
        max: 5
        description: 1 = little direct detail in this pool; 5 = explicit customer, network, or multi-cloud access detail.
      points:
        - label: DayOne
          x: 5
          'y': 2
          note: >-
            Company announcement names seven markets and about 1 GW of customer commitments; the assigned sources
            provide limited independent service-level or interconnection detail.
        - label: AirTrunk
          x: 2
          'y': 3
          note: >-
            The assigned sources describe planned and financed Johor campuses; they do not establish an equivalent
            multi-market footprint comparison.
        - label: Digital Realty
          x: 3
          'y': 5
          note: >-
            Reporting describes a Malaysia campus and an enterprise multi-cloud/interconnection offer; ServiceFabric
            availability in Malaysia remains subject to approvals.
        - label: Equinix
          x: 2
          'y': 5
          note: >-
            Its Johor page describes colocation and interconnection; displayed customer and network-provider counts are
            global company claims.
        - label: Enterprise private AI cage
          x: 1
          'y': 3
          note: >-
            A provider-described buyer use case involves an enterprise-controlled private AI environment; no independent
            customer case is retained.
        - label: Hyperscaler shared infrastructure
          x: 1
          'y': 1
          note: >-
            The interview mentions shared hyperscaler infrastructure as a contrast, but the assigned pool contains no
            comparative footprint or service detail.
    approximationNotes: >-
      Ordinal scores summarize disclosure in this assigned source set only, not actual capability, quality, or market
      share. Unknowns are not evidence of absence.
    claimRefs:
      - CP003
      - CP008
      - CP010
      - CP011
      - CP015
  - id: FI001
    title: Revenue model bridge and missing underwriting links
    type: flow
    summary: >-
      An illustrative, non-quantified bridge separates reported contracted capacity and top-line revenue from unreported
      delivery, margin, and cash-conversion inputs.
    data:
      nodes:
        - id: contracted-capacity
          label: Long-term customer capacity booking
          detail: Light Reading reports legally binding commitments for IT-power capacity.
        - id: campus-delivery
          label: Build, power, and energize campus
          detail: Project-level completion, cost, and energization schedules are not quantified here.
        - id: customer-service
          label: Deliver data-center capacity
          detail: The retained sources do not map individual contracts to delivered capacity.
        - id: recognized-revenue
          label: Recognize revenue
          detail: Light Reading reports US$512 million total revenue for H1 2026; mix and billing bridge are absent.
        - id: adjusted-ebitda
          label: Adjusted EBITDA
          detail: >-
            Startup Fortune reports US$205.9 million and a 40.2% margin for H1 2026; adjustments are not reconciled
            here.
        - id: operating-result
          label: Account for operating costs
          detail: 'H1 2026 net-loss reports differ: US$81.9 million versus US$77.2 million; gross margin is not reported here.'
        - id: cash-conversion
          label: Convert to cash after capex
          detail: Cash flow, working capital, and current liquidity remain unquantified.
      edges:
        - from: contracted-capacity
          to: campus-delivery
        - from: campus-delivery
          to: customer-service
        - from: customer-service
          to: recognized-revenue
        - from: recognized-revenue
          to: adjusted-ebitda
        - from: adjusted-ebitda
          to: operating-result
        - from: operating-result
          to: cash-conversion
    approximationNotes: >-
      Analytical sequence only, not a disclosed company schedule or a reconciled waterfall; the sources do not connect
      individual bookings to revenue, margin, or cash.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI016
