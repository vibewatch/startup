              - CP006
              - CP009
              - CP012
      - number: '3.2'
        title: Incumbents, adjacency, and buyer access
        blocks:
          - type: paragraph
            body: >-
              Digital Realty is an adjacent incumbent rather than a direct scale match in the available Malaysia
              evidence: Tech Wire Asia reports three Cyberjaya assets with an approximately 32 MW IT-capacity target,
              including a 15 MW AI/HPC facility and a future 14 MW site. Its enterprise pitch is differentiated around
              private AI environments, multi-cloud access, and interconnection; its ServiceFabric platform is planned
              for Malaysia in the second half of 2026 subject to licensing approvals. Equinix's Johor page emphasizes
              colocation, Equinix Fabric, Network Edge, and a broad global network ecosystem, but its customer and
              network-provider totals are company-reported global figures, not Johor metrics. The map therefore scores
              evidence visibility, not service quality or actual market share.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP008
              - CP010
              - CP011
              - CP015
      - number: '3.3'
        title: Pricing, packaging, and procurement tradeoffs
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not establish comparable list prices, realized rates, contract lengths, power
              commitments, or discounting for DayOne, AirTrunk, Digital Realty, or Equinix. Data-center deals are shaped
              by capacity, delivery timing, power availability, connectivity, and service scope, but the assigned
              evidence does not quantify those commercial terms; no price-per-megawatt comparison is defensible here.
              Digital Realty's reported enterprise-private-AI use case and Equinix's interconnection products show
              alternatives buyers may evaluate alongside hyperscale capacity, while the evidence does not show which
              provider wins on total cost. Pricing and contract-level customer evidence should be obtained before
              asserting a cost moat or undercutting advantage.
            claimRefs:
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP016
      - number: '3.4'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The plausible moat is execution at scale: secured customer commitments, nearly contracted campus capacity,
              and access to power, land, financing, and delivery partners can make a provider difficult to replace once
              a facility is built and commissioned. The current sources substantiate some announced commitments and
              investment, but they do not disclose DayOne contract tenor, customer concentration, renewal behavior,
              switching costs, or site-level delivery performance. Bloomberg's October report that DayOne was weighing
              an IPO delay or a smaller offering amid data-center volatility, alongside its March report on a potential
              loan increase, makes financing conditions a material competitive variable rather than proof of distress.
              Competitor announcements show substantial supply expansion; they do not prove displacement or establish an
              independent benchmark.
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP006
              - CP009
              - CP012
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Pipeline is not a demonstrated moat
            body: >-
              Capacity announcements and secured-commitment claims support a credible scale strategy, but customer
              concentration, contract economics, delivery execution, and independent operating comparisons remain
              unresolved.
            calloutType: risk
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and reported traction
        blocks:
          - type: paragraph
            body: >-
              Light Reading reports that DayOne defines bookings as IT-power capacity committed by clients under legally
              binding long-term contracts, and places reported bookings at approximately 2.3 GW across ten Asia-Pacific
              and European markets. It says seven global hyperscale and technology customers drive most bookings, with
              about 1.4 GW concentrated in Johor; those are capacity and concentration indicators, not recognized
              revenue. The same report gives US$512 million of revenue for the six months ending June 30, 2026, without
              a contract-level bridge from booked capacity to billed or recognized revenue. Startup Fortune reports
              FY2025 revenue of US$484.3 million versus US$178.1 million in FY2024, but the assigned evidence does not
              provide revenue mix, realized price per unit, or recognition schedules by service. The tables therefore
              distinguish reported revenue and contracted capacity from undisclosed monetization details.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI008
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI016
      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Light Reading reports a US$81.9 million net loss for the six months ending June 30, 2026, while Startup
              Fortune reports US$77.2 million for H1 2026; the assigned material does not reconcile the discrepancy
              (CI005, CI012). Startup Fortune also reports FY2025 adjusted EBITDA of US$180.7 million at a 37.3% margin
              and H1 2026 adjusted EBITDA of US$205.9 million at a 40.2% margin, alongside FY2025 share-based
              compensation of US$341.8 million within a US$367.1 million net loss (CI014-CI015). These secondary-source
              adjusted measures are not audited gross margin, operating cash flow, or cash burn. Channel NewsAsia
              describes water-intensive cooling across Singapore's data-center sector (CI011), but not DayOne's usage or
              tariffs. Company power, water, utilization, working-capital, and capex-per-MW inputs remain gaps.
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI012
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              DayOne's June 5, 2026 release announced US$4.5 billion of gross Series C proceeds and said it could
              consider additional equity or debt depending on funding needs and market conditions (CI006-CI007). An
              October 2025 ICEF roadmap reported US$3.58 billion (SG$4.6 billion) in green financing for Malaysian
              development (CI016). ISI Markets later reported that the company was said to be negotiating an expansion
              of a corporate loan facility to as much as US$7 billion, not that a facility had closed or been drawn
              (CI010). Bloomberg reported that a delay or a smaller US$2.5-3 billion IPO was under consideration, with
              no final decision (CI009). These gross, historical, or conditional financing figures do not establish
              current liquidity; cash, burn, committed capex, debt terms, and runway remain unavailable in the assigned
              sources.
            claimRefs:
              - CI006
              - CI007
              - CI009
              - CI010
              - CI016
      - number: '4.4'
        title: Underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Reported revenue growth and contracted capacity demonstrate scale, but they do not establish revenue
              quality, durable margins, or capital adequacy. Startup Fortune reports that one customer represented 69.4%
              of FY2025 revenue and 69.2% in H1 2026 (CI013); customer-level pricing, renewal sensitivity, and sales
              efficiency remain unquantified. The conflicting H1 loss figures require reconciliation to the primary
              statements before relying on adjusted margins. Do not infer ARR from bookings, cash burn from accounting
              loss, or cash available from gross financing proceeds. Underwriting needs executed customer contracts and
              a billing bridge, site-level delivered capacity and costs, audited cash-flow and margin reconciliations,
              and a current debt and capex schedule. Until then, the financial picture is promising on scale but
              incomplete on economics and funding runway.
            claimRefs:
              - CI005
              - CI008
              - CI009
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding raised is not liquidity
            body: >-
              Reported gross equity proceeds and a possible loan-facility expansion cannot establish current liquidity
              or runway; obtain the latest audited cash-flow and debt schedules before treating the construction
              pipeline as funded.
            calloutType: risk
            claimRefs:
              - CI006
              - CI009
              - CI010
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              DayOne describes itself as a Singapore-headquartered platform that develops and operates next-generation
              data centers for hyperscalers and enterprises; a provider directory also describes cloud, AI, and
              high-performance workloads. In practical terms, the offered product is campus capacity and associated
              colocation infrastructure, not a disclosed standalone software product. DayOne's June 2026 release says it
              had secured more than 1.5 GW of total bookings since inception, but bookings are not commissioned
              capacity, utilization, or independently verified customer deployments. The company also calls its delivery
              model proprietary without publishing the technical or operating procedures that would establish how it
              differs from other operators. The module and workflow tables keep those claims separate from demonstrated
              customer outcomes.
            claimRefs:
              - CE001
              - CE003
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
