          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE016
      - number: '5.4'
        title: Differentiation, trust, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              DayOne's materials emphasize rapid deployment, high-density designs, low-carbon power pathways, and an
              integrated delivery model. The assigned sources do not establish comparative performance or disclose the
              methods behind these claims. The Singapore announcement says LEED Platinum and BCA Green Mark Platinum
              certifications would be applied for; a directory separately lists LEED statuses for several Johor
              buildings. Neither statement establishes certification of SG1. A peer operator's site descriptions are
              useful only as competitor-issued context, not independent benchmarks. Bloomberg's report of possible IPO
              delay or size reduction, alongside Startup Fortune's framing of the offering as a test of investor
              appetite for AI infrastructure, adds capital-timing uncertainty, not evidence of a technical failure.
              Current site-level security, redundancy, incident, and service-level evidence remains a material diligence
              request.
            claimRefs:
              - CE009
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer segments and the regional proposition
        blocks:
          - type: paragraph
            body: >-
              Public descriptions place DayOne between infrastructure development and customer operations: it secures
              and operates powered, cooled facilities, while customers install their own computing and network
              equipment. Indexed.vc characterizes its target market as hyperscalers, cloud providers, and enterprises;
              AI in Asia also describes cloud and AI operators as users. These are reported target segments, not a
              verified account roster. YesPress presents Singapore, Johor, and Batam as a connected SIJORI proposition,
              but does not identify which customers use each location or disclose customer outcomes there.
            claimRefs:
              - CU001
              - CU002
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
