      - number: '6.2'
        title: Bookings are not yet a retention or utilization record
        blocks:
          - type: paragraph
            body: >-
              Two publications report more than 1.5 GW of customer bookings since DayOne's 2022 inception, with YesPress
              attributing the figure to a June 2026 company statement. Separately, YesPress reports 1,250 MW of
              committed and 444 MW of billable IT power at December 31, 2025. Those are different measures and reporting
              dates; the available evidence does not reconcile them into a common cohort or show how much booked demand
              became energized, occupied, and invoiced. The gap is commercially important for a capital-intensive
              operator, but it is not a calculated conversion rate.
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU008
              - CU012
      - number: '6.3'
        title: Concentration is visible; named deployment proof is not
        blocks:
          - type: paragraph
            body: >-
              Startup Fortune reports that the largest customer represented 69.4% of 2025 revenue and 69.2% of
              first-half 2026 revenue. Mukhbir, summarizing Reuters Breakingviews, attributes 84.3% of first-half 2026
              revenue to ByteDance and Oracle together. The attribution is secondary reporting rather than a
              company-named customer reference: Startup Fortune says the preliminary prospectus did not name the largest
              customer. The assigned sources do not provide named site-level deployment status, contract duration,
              customer-quoted outcomes, or an independently validated reference.
            claimRefs:
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
      - number: '6.4'
        title: Retention and workload alternatives remain diligence priorities
        blocks:
          - type: paragraph
            body: >-
              None of the reviewed customer-focused sources supplies NRR, GRR, churn, renewal, cohort, or
              contract-duration metrics, so booking scale and revenue concentration cannot establish customer
              durability. Public cloud alternatives also matter to buyer choice: Oracle lists live regions in Batam,
              Kulai, and Singapore, while Microsoft's November 2025 announcement described a planned Johor Bahru region
              and named Malaysian Azure users. These are market alternatives and Microsoft customer examples, not
              evidence that those organizations are DayOne customers or that the services are interchangeable for every
              workload.
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital-market timing and funding dependence
        blocks:
          - type: paragraph
            body: >-
              The financing thesis is exposed to public-market timing as well as construction capital needs. Bloomberg
              reported on October 21, 2026 that DayOne was weighing a delay or smaller US IPO and that a smaller
              offering could raise US$2.5–3.0 billion, roughly half the original target (CR001, CR002). Earlier coverage
              by Mission Media described an approximately US$5 billion target, so the newer report is evidence of a
              changed range under volatile market conditions, not proof that an offering was cancelled or repriced
              (CR002). DayOne announced definitive agreements for more than US$2.0 billion of Series C equity in January
              2026; its release said this followed US$1.9 billion of Series A and B equity; the company separately
              described an up-to-€1 billion mezzanine facility secured in 2025 (CR003, CR004, CR016). ISI Markets later
              reported that an expansion of a corporate loan facility to as much as US$7 billion was being negotiated,
              not closed (CR015). These amounts describe financing raised, announced, or under discussion; they do not
              establish current unrestricted cash, drawn debt, covenants, or funding available for specific projects.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
              - CR016
      - number: '7.2'
        title: Customer concentration and contract visibility
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not quantify customer concentration. DayOne's January 2026 release said its
              expansion investments would support approximately 1GW of secured customer commitments (CR005), while ISI
              Markets later reported more than 1.5GW of customer bookings since the company launched in 2022 (CR006).
              Those differently named totals do not disclose a common measurement date, definition, customer split, or
              contract status, so they should not be added or treated as a reconciled contracted-MW backlog. Neither
              source provides customer-by-customer revenue, contracted MW, renewal protection, or cancellation rights. A
              large counterparty deferral could still reduce utilization and cash recovery, but its magnitude cannot be
              established from aggregate bookings. Diligence should reconcile booking-to-contract conversion and
              customer exposures against the campus capex schedule before relying on demand visibility.
            claimRefs:
              - CR005
              - CR006
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
              - CR015
              - CR016
      - number: '7.3'
        title: Permitting, power, and resource constraints
        blocks:
          - type: paragraph
            body: >-
              DayOne's Singapore buildout sits within a deliberately limited capacity-allocation regime. Data Center
              Dynamics reported that SG1 is a 20MW project with Phase I scheduled for ready-for-service in 2026, and
              that DayOne received capacity through a pilot scheme in which four operators shared 80MW (CR007, CR008).
              Reed Smith describes Singapore's measured growth, land, power, and water constraints, noting that no new
              capacity had been allocated since the 2023 pilot and that new projects face stringent approval and
              efficiency standards (CR011). This establishes regulatory and resource exposure, not a finding that DayOne
              lacks a permit or allocation. For Thailand, a July 2026 legal update describes a PUE threshold of 1.3 for
              high-efficiency data centers seeking tax privileges, alongside security, redundancy, water-management, and
              workforce conditions (CR012). It also reports government attention to energy, water, and community impacts
              (CR013). The assigned sources do not establish which DayOne sites have completed each local approval.
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Commissioning, reliability, and operational execution
        blocks:
          - type: paragraph
            body: >-
              A schedule milestone is not operating proof: the SG1 Phase I date is described as scheduled for 2026,
              while the assigned sources do not confirm commissioning, utilization, uptime, or achieved energy
              performance (CR007). Data Center Dynamics reports a 10-year power purchase agreement with Sembcorp backed
              by bundled renewable-energy certificates (CR009). The agreement is a visible mitigation, but it does not
              establish delivered power volumes, firm grid capacity, or production- scale cooling results. A DayOne
              mechanical-engineer listing hosted by Simplify describes preventive and corrective maintenance, vendor
              coordination, safety audits, and 24/7 operations at Lahti (CR014). This is company-issued evidence of
              stated responsibilities, not evidence of a staffing shortage or an incident. Portfolio growth across
              countries increases the importance of site-by-site commissioning, maintenance, and regulatory controls;
              the evidence does not permit a claim that any outage or safety event has occurred.
            claimRefs:
              - CR007
              - CR009
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR007
              - CR009
              - CR010
      - number: '7.5'
        title: Residual exposure and decision triggers
        blocks:
          - type: paragraph
            body: >-
              The risk ranking below is qualitative and reflects the magnitude of disclosed exposure and the visibility
              of mitigation in the assigned evidence, not a measured probability model. Bloomberg's report of possible
              IPO delay or downsizing is the clearest current market signal; site delivery and regulatory risks remain
              contingent on approvals, power, and commissioning evidence. Aggregate customer commitments and bookings do
              not establish concentration or contract durability. The company describes equity funding and customer
              commitments, and Data Center Dynamics reports renewable-power procurement, but sources do not disclose
              current cash availability, debt covenants, site-specific approvals, or independently verified operating
              KPIs (CR001, CR003, CR005, CR006, CR009, CR015, CR016). Re- underwrite if a material IPO delay or smaller
              proceeds leaves committed projects without identified financing; if customer-level exposure or protections
              prove concentrated; or if a campus misses a disclosed ready-for-service milestone without replacement
              power or financing. These are diligence and thesis-break tests, not predictions of failure.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR007
              - CR009
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer concentration remains unquantified
            body: >-
              DayOne and ISI Markets report aggregate demand measures with different labels and periods; neither
              establishes customer-level exposure or contract protections. Reconcile the underlying schedules before
              underwriting demand durability.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              DayOne's investment case rests on reported demand and access to capital: coverage describes a US$4.5
              billion Series C, more than 1.5 GW of capacity bookings, and first-half 2026 revenue growth. Those are
              meaningful scale signals, but reported bookings are not recognized revenue and revenue is not cash
              generation. The same reporting gives a first-half net loss and warns of dependence on a limited number of
              hyperscale customers. On the supply side, CBRE and the IEA identify power availability, grid connections,
              and approvals as constraints on where and how quickly data-center capacity can be delivered. The thesis
              therefore depends on converting demand into energized, profitable capacity without losing access to
              customers or financing. (CV001, CV006-CV012)
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.2'
        title: Price discipline and public-market evidence
        blocks:
          - type: paragraph
            body: >-
              The approximately US$20 billion figure in the assigned reporting is a reported target or market estimate,
              not an official company or investor valuation. The reported US IPO proceeds target also needs to be kept
              separate from enterprise value, equity value, and investor return: Bloomberg later reported that DayOne
              was weighing a delay or an offering raising US$2.5 billion to US$3 billion. Neither report supplies an
              offer price, share count, or a complete capital structure. GDS Holdings' market capitalization is a
              contextual public-market observation, not a like-for-like DayOne valuation multiple; the companies'
              business perimeters and ownership differ. With no audited standalone earnings, net debt bridge, or final
              terms in this evidence set, an entry price or target return would be false precision. (CV002-CV005,
              CV013-CV016)
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV016
      - number: '8.3'
        title: Scenario framing and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The scenarios below are conditional decision cases, not forecasts or probability-weighted price targets.
              The bull case requires disclosed financials, reliable power delivery, customer durability, and a receptive
              IPO window; its only available valuation reference is the reported approximately US$20 billion target. The
              base case allows for a resized or delayed transaction while capacity and financing execution remain
              central. The bear case is a delay or repricing if market access, customer concentration, losses, or power
              constraints worsen. Bloomberg's reported US$2.5 billion–US$3 billion alternative refers to potential IPO
              proceeds, not company valuation. No numerical return, probability, or downside range is supportable until
              primary offering terms and audited standalone financials are available. (CV004-CV009, CV011, CV012, CV015,
              CV016)
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
