tables:
- id: TR001
  title: Regulatory / legal risk register
  notes: Rows are ordered by severity and focus on risks most likely to impair structure, licensing, or ability to deliver legal work at scale. Coverage is partial because Norm has not publicly disclosed its entity documents or admissions matrix.
  enumerationScope:
    coverage: partial
    basis: Publicly disclosed US and UK legal-structure evidence plus public filing and rule reviews as of 2026-07-08; private entity agreements and bar memoranda remain unavailable.
  columns:
  - risk
  - jurisdiction
  - trigger
  - severity
  - mitigation stated
  - residual risk
  - diligence ask
  rows:
  - - ABA Rule 5.4 non-lawyer ownership
    - US most states
    - State bar or litigant challenges ownership, profit-sharing, or control links between Norm AI, Inc. and Norm Law
    - Critical
    - No public structure memo; Arizona and Utah show limited exception pathways, but not a disclosed nationwide solution
    - High
    - Request entity chart, intercompany agreements, and outside ethics memorandum
  - - Unauthorized practice of law by AI output
    - US multistate
    - Agent gives client-specific legal advice without admitted attorney actively supervising the matter
    - Critical
    - Norm says senior attorneys supervise and calibrate agents
    - High
    - Review supervision workflows, staffing ratios, red-team logs, and escalation rules
  - - Multijurisdiction bar-admission gap
    - US states outside disclosed admissions
    - Norm Law or affiliated attorneys maintain a systematic presence where they are not admitted or properly supervised
    - High
    - No public jurisdiction matrix; Arizona ABS guidance shows licensed lawyers and compliance counsel remain mandatory
    - High
    - Request attorney roster by admission state and multistate practice policy
  - - Securities / investment-adviser boundary
    - US SEC and FINRA perimeter
    - Paid AI workflows stray from compliance tooling into advice or analyses on securities
    - High
    - Norm frames itself as legal and governance infrastructure for regulated work rather than an adviser
    - Medium-High
    - Obtain product-scope memo, disclaimers, and adviser-registration analysis
  - - Outcome-based fee and fee-sharing characterization
    - US bar rules
    - Outcome pricing or platform-linked economics are viewed as impermissible fee-sharing or otherwise inconsistent with local rules
    - High
    - Company frames pricing as law-firm delivered and client aligned
    - Medium-High
    - Request sample engagement letters and ethics opinions on pricing structure
  - - Cross-border legal-structure mismatch
    - UK, EU, and future foreign markets
    - Norm expands into jurisdictions with different ABS, partnership, or foreign-lawyer rules than the US
    - Medium
    - UK ABS evidence shows flexibility in at least one major market; no public foreign expansion structure is disclosed
    - Medium-High
    - Request jurisdiction-by-jurisdiction expansion memo and foreign counsel signoff
