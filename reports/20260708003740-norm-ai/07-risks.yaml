company:
  name: Norm Ai
chapter:
  number: 7
  title: Risks
  summary: |-
    Norm Ai's largest investment risk is structural: it combines a venture-backed AI platform with an affiliated AI-native law firm in a regulatory environment that still largely bars nonlawyer ownership, tightly polices unauthorized practice, and imposes strict confidentiality, competence, and conflict duties on legal work. Operationally, the same product design that makes Norm differentiated—AI agents doing regulated legal work for institutional clients—also concentrates liability around hallucinations, data handling, model-vendor dependency, investor-client overlaps, and founder-centric execution.
sections:
- id: s-regulatory-legal-risks
  title: Regulatory and Legal Risks
  body: |-
    Norm's primary risk is that its differentiated model may sit directly in the gap between what venture-backed software companies want to control and what U.S. professional-conduct rules let law firms do. ABA Rule 5.4 bars fee sharing with nonlawyers and bars nonlawyer ownership or control of a law firm's professional judgment, while Rule 5.5 limits practice across jurisdictions without the right admissions or supervision. Norm publicly says that Norm Law is an affiliated AI-native law firm running on the Norm platform, but the reviewed public materials do not disclose the exact ownership agreement, the jurisdiction-by-jurisdiction bar-admission map, or the internal supervision protocol that keeps agent output inside licensed-lawyer boundaries. Arizona and Utah show that exceptions can exist under licensed ABS or sandbox regimes, and the UK ABS regime shows that some foreign jurisdictions are more flexible, but those carve-outs prove the opposite of what a bull case would want: outside limited regimes, the default rule still requires structural separation and licensed-human control. The securities angle compounds the problem because Investor.gov and FINRA both describe regulated boundaries around compensated securities advice and AI supervision. If Norm's workflow drifts from compliance tooling into compensated legal or investment advice without clear regulatory positioning, legal risk can move from theoretical to existential very quickly.
  claimRefs:
