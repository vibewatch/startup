  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ownership-compliance-memo
    missingEvidence: Outside ethics memorandum, entity chart, and intercompany agreements showing exactly how Norm AI, Inc. and Norm Law LLP avoid prohibited fee sharing or nonlawyer control.
    whyItMatters: This is the single biggest thesis risk because a structure problem can force a reorganization before the company can scale the law-firm model.
    diligencePath: Request management’s bar-compliance deck plus outside counsel opinions for every current operating jurisdiction.
    relatedQuestionRefs:
    - QR001
    - QR030
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: admissions-and-supervision
    missingEvidence: Attorney roster by admission state, compliance-lawyer assignments, and matter-supervision protocols for AI-assisted legal work.
    whyItMatters: Without it, investors cannot verify whether Norm is safely inside Rule 5.5 and similar state-law boundaries.
    diligencePath: Request a jurisdiction matrix, malpractice carrier requirements, and sample staffing flow for a live matter.
    relatedQuestionRefs:
    - QR004
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: model-provider-contracts
    missingEvidence: Named foundation-model providers, pricing terms, termination rights, fallback vendors, and evaluation metrics by use case.
    whyItMatters: An undisclosed model dependency can become a hard operating stop if legal-use policies or costs shift suddenly.
    diligencePath: Review vendor agreements, routing architecture, and internal benchmark dashboards used to qualify fallback models.
    relatedQuestionRefs:
    - QR013
    - QR014
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: security-controls
    missingEvidence: SOC 2 or equivalent reports, breach history, data-retention policies, customer isolation controls, and incident-response runbooks.
    whyItMatters: Norm handles highly sensitive legal and compliance data for institutions that will not tolerate vague security posture claims.
    diligencePath: Run a security diligence room with trust-center materials, penetration-test summaries, and customer DPA templates.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-revenue-concentration
    missingEvidence: Revenue by customer, investor-linked share of ARR, contract durations, renewal rates, and named non-investor customer references.
    whyItMatters: The public story relies on aggregate AUM and investor-client endorsements rather than diversified named customer proof.
    diligencePath: Request top-10 customer list with ARR mix, retention history, and reference calls outside the investor base.
    relatedQuestionRefs:
    - QR017
    - QR021
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: succession-and-governance-depth
    missingEvidence: Founder succession plan, disclosed executive bench, board operating cadence, and retention plans for senior legal talent.
    whyItMatters: A founder- or partner-led execution model can fail abruptly if leadership depth is thinner than the brand suggests.
    diligencePath: Review org chart, key-man provisions, long-term compensation plans, and emergency delegation documents.
    relatedQuestionRefs:
    - QR018
    - QR019
    relatedTableRefs:
    - TR004
