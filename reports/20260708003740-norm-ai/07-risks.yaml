- id: TR005
  title: Mitigation and kill criteria table
  notes: Kill criteria are framed as investment-thesis breakers rather than ordinary operating setbacks; each scenario includes a monitorable signal investors can track before or during a hold period.
  columns:
  - scenario
  - kill criteria
  - probability
  - mitigation
  - monitoring signal
  rows:
  - - Adverse bar ruling on structure
    - Norm cannot demonstrate a compliant separation or approved carve-out in key operating jurisdictions
    - Medium
    - Secure outside ethics opinions, restructure before conflict crystallizes, and narrow go-to-market by state if needed
    - Regulator inquiries, bar complaints, or delayed market launches
  - - Major AI-driven client harm event
    - A material legal error causes client loss, malpractice claim, injunction, or public enforcement action
    - Medium
    - Tighten human review, scoped launches, QA logs, and insured limits before scaling new practice areas
    - Escalating client complaints, error-correction volume, or reserve discussions
  - - John Nay departure or incapacity
    - Founder leaves before bench depth, customer relationships, and fundraising narrative are institutionalized
    - Low-Medium
    - Name operating successors, deepen board involvement, and document product / regulatory playbooks
    - Key-man insurance, executive turnover, or delayed hiring of senior leaders
  - - Foundation-model access loss or 10x cost move
    - Primary model vendor blocks legal use cases, changes terms, or makes the unit economics untenable
    - Medium
    - Build multi-model routing, price-protection clauses, and offline evaluation / migration readiness
    - Model latency, abrupt pricing changes, or new policy restrictions
  - - Blackstone withdrawal as client and investor
    - Marquee dual-role stakeholder exits and leaves a gap in both revenue proof and cap-table support
    - Low-Medium
    - Increase share of non-investor revenue and reduce dependency on any single validator account
    - Reference pauses, declining usage, or no follow-on participation from existing strategic holders
