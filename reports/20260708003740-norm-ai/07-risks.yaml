- id: TR002
  title: Operational / quality / security risk register
  notes: Severity reflects the fact that Norm uses AI inside legal work rather than merely as back-office software. Public security controls remain only partially disclosed.
  columns:
  - risk
  - description
  - trigger
  - severity
  - mitigation
  - residual risk
  rows:
  - - AI hallucination or misapplied legal reasoning
    - Legal agent produces incorrect advice, citation, or regulatory logic in a live client matter
    - Escaped error reaches client work product or negotiation position
    - Critical
    - Senior attorneys supervise, calibrate, and improve agents
    - High
  - - Outcome-based malpractice accumulation
    - Norm Law bears direct service liability when AI-supported work is wrong under a client-aligned pricing model
    - Matter failure, missed filing, wrong negotiation advice, or indemnity claim
    - High
    - Law-firm wrapper and human review can catch some issues before delivery
    - High
  - - Confidential data breach or unauthorized access
    - Sensitive deal, compliance, or litigation data leaks from agent workflows or connected systems
    - Security incident, vendor compromise, or weak access controls
    - Critical
    - No detailed public control framework disclosed; ABA Rule 1.6 imposes confidentiality duties
    - High
  - - Foundation-model degradation or policy change
    - Underlying model quality, availability, legal-use policy, or pricing shifts materially
    - Provider blocks legal workloads, changes terms, or performance drops
    - High
    - Norm emphasizes legal engineering and supervisory layers above the model
    - High
  - - Complex-regulation accuracy ceiling
    - Scaling to Dodd-Frank, Investment Company Act, ERISA, and bespoke internal policies may exceed current tuning quality
    - Coverage expands faster than quality assurance or lawyer review bandwidth
    - High
    - Series C proceeds are earmarked for more senior attorneys and AI engineers
    - Medium-High
  - - Security and compliance disclosure opacity
    - Enterprise buyers and investors cannot fully evaluate resilience from public information alone
    - Diligence reveals missing certifications, weak auditability, or unclear data-retention rules
    - Medium
    - Norm sells into regulated institutions that will impose procurement scrutiny
    - Medium-High
