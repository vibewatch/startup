- id: s-operational-quality-security-risks
  title: Operational, Quality, and Security Risks
  body: |-
    Operational risk is unusually high because Norm is not just selling workflow software to lawyers; it is using AI agents inside a law-firm operating model and marketing that model around outcome-based pricing. LawNext explicitly notes that this puts the AI directly on the hook for work-product quality, and Norm's own materials say senior attorneys supervise and improve the agents rather than using them only as internal drafting assistants. That means hallucinations, incomplete regulatory logic, or model drift are not abstract product bugs—they can become malpractice, fee disputes, or client harm. ABA Rule 1.1 raises the competence bar, and Rule 1.6 adds confidentiality and unauthorized-access duties, which matter even more because Norm targets global banks, asset managers, hedge funds, and insurers with highly sensitive transactional and regulatory data. Public materials reviewed for this chapter describe LLM-based legal engineering and supervisory agents, but they do not disclose a named foundation-model supplier, detailed security certifications, incident history, or a redundancy strategy if a model provider changes legal-use policies or economics. In practice, that leaves investors underwriting a legal-services business whose product quality, privacy posture, and vendor resilience are still only partially visible from outside.
  claimRefs:
