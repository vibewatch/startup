companyProfile:
  summary: >-
    Norm Ai (legal name Norm AI, Inc.) was founded in July 2023 by John Nay,
    a former Stanford CodeX fellow whose 2016–2022 research laid the groundwork
    for "agentic law" — the use of AI agents to perform legal and compliance
    work autonomously. The company operates a dual model combining Leap, a
    proprietary Legal Engineering Automation Platform that enables non-practicing
    attorneys to translate regulatory rules into AI agents, with Norm Law LLP,
    an AI-native law firm launched in November 2025 that delivers outcome-based
    outside legal counsel to institutional financial services clients. In July
    2026 the company raised a $120M Series C at a $1.2B valuation led by Khosla
    Ventures, reaching unicorn status in under three years from founding.
  foundedDate: '2023-07-01'
  founders:
    - name: John Nay
      role: Founder and CEO
      background: >-
        Stanford CodeX fellow (2016–2022) conducting foundational agentic law
        research; founded and sold Brooklyn Investment Group (AI investment
        platform) to TIAA Nuveen; taught first AI law course at NYU Law.
      claimRefs: [CO001, CO007, CO008]
  foundingLocation: New York, NY
  headquarters: New York, NY
  productSummary: >-
    Three integrated products: (1) Leap — a Legal Engineering Automation Platform
    where non-practicing attorneys (Legal Engineers) encode legal rules into
    autonomous AI agents using large language models; (2) Supervisory AI — a
    compliance monitoring layer for enterprise AI deployments in regulated
    environments; (3) Norm Law LLP — an affiliated AI-native law firm staffed by
    lateral partners from top global firms, offering outcome-based (not hourly)
    legal counsel to institutional clients including Blackstone and Bain Capital
    Ventures.
  customerFocus: >-
    Global financial services institutions — hedge funds, asset managers, banks,
    and insurance companies — with a stated client base representing $30T+ in
    combined assets under management as of July 2026.
  businessModel: >-
    Dual revenue model combining enterprise platform licensing (Leap, Supervisory
    AI) with legal services fees (Norm Law LLP). Platform revenue is presumed
    subscription-based; Norm Law LLP uses outcome-based pricing rather than
    hourly billing.
  stage: Series C
  fundingStatus: >-
    $120M Series C at $1.2B post-money valuation (July 7, 2026), led by Khosla
    Ventures. Prior rounds include $48M Series B (January 2025) and a $50M
    strategic investment from Blackstone (November 2025). Total raised: $260M+
    since founding.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO015, CO016, CO017, CO018]

summary:
  headline: >-
    Norm Ai has built a structurally distinctive full-stack legal AI platform
    targeting financial services institutions, validated by Khosla Ventures and
    elite institutional co-investors, but material information barriers —
    undisclosed revenue, unresolved ABA Rule 5.4 compliance structure, and a
    single named founder — limit full investment conviction without private
    diligence.
  overallScore: 6
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1200
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 260
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Full-stack model uniquely combines a proprietary compliance platform with
      an AI-native law firm under one brand — structurally difficult to replicate
      due to ABA Rule 5.4 restrictions on non-lawyer law firm ownership.
    - >-
      Elite investor syndicate: Khosla Ventures (first OpenAI investor) leading
      alongside Blackstone, BCV, Coatue, Vanguard, TIAA, and individual investors
      Tony James, Jeff Hammes, Henry Kravis, and Marc Benioff.
    - >-
      John Nay's decade+ at the intersection of AI, law, and institutional
      finance creates rare founder-market fit; Stanford CodeX research provides
      genuine technical IP foundation.
    - >-
      Confirmed production use at Blackstone and BCV — two of the most
      sophisticated financial institutions globally — with clients stated to
      represent $30T+ combined AUM.
  topRisks:
    - >-
      ABA Model Rule 5.4 prohibits non-lawyer ownership of law firms in most
      U.S. states; Norm Law LLP's compliance structure and bar admissions are not
      publicly disclosed, creating a material structural risk that could force
      reorganization.
    - >-
      No publicly disclosed revenue, ARR, gross margin, or customer count — the
      $1.2B valuation rests entirely on investor conviction and comparable
      valuations (Harvey AI $11B, Legora $5.6B) without verifiable financial
      underpinning.
    - >-
      John Nay key-person concentration — Norm Ai's brand, investor relationships,
      regulatory influence (Central Park AI Forum), and technical vision are
      anchored in a single founder with no publicly visible succession plan.
    - >-
      Dual investor-client role of Blackstone and BCV creates governance and
      conflict-of-interest complexity that has not been addressed through any
      publicly disclosed mechanism.
  unresolvedGaps:
    - >-
      Annual recurring revenue and gross margin for the Leap platform and Norm
      Law LLP — essential for valuation underwriting.
    - >-
      Norm Law LLP's legal ownership structure and ABA Rule 5.4 compliance
      mechanism — critical for assessing structural viability.
    - >-
      Client list beyond Blackstone and BCV — necessary to assess concentration
      risk within the $30T AUM claim.
    - >-
      Board composition and Khosla Ventures' governance rights from the Series C
      — required for understanding investor control dynamics.
    - >-
      Combined headcount of Norm AI, Inc. and Norm Law LLP — needed to estimate
      burn rate and operational scale.

