evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue and ARR
    missingEvidence: Annual recurring revenue or total revenue for the Norm Ai platform and Norm Law LLP
    whyItMatters: Without revenue metrics no valuation multiple can be assessed; $1.2B may be reasonable or extreme depending on ARR
    diligencePath: Request audited financials from Norm AI, Inc. and Norm Law LLP under NDA in formal diligence
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: funding history pre-2025
    missingEvidence: Amount, date, and investors for seed and Series A financing rounds
    whyItMatters: Complete capital formation history is required for dilution modeling and cap table analysis
    diligencePath: Request cap table from management; search for Form D filings under alternate entity names
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: blocking
    topic: Norm Law LLP regulatory structure
    missingEvidence: >-
      Legal ownership structure of Norm Law LLP relative to Norm AI, Inc.; ABA Rule 5.4 compliance approach; state bar
      admissions
    whyItMatters: >-
      Non-lawyer ownership restrictions in most U.S. states create material structural risk; without disclosure
      investors cannot assess whether the model is legally sustainable
    diligencePath: Request bar compliance memorandum; verify state bar admissions; review partnership agreement for Norm Law LLP
    relatedQuestionRefs:
      - QO011
      - QO016
      - QO018
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Total employee/contractor count at Norm AI, Inc. and attorney/partner headcount at Norm Law LLP
    whyItMatters: Headcount is a proxy for burn rate, operational scale, and cost structure
    diligencePath: Request headcount data from management; LinkedIn company page may approximate
    relatedQuestionRefs:
