      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营风险异常高，因为 Norm 不只是向律师销售工作流软件；它把 AI 智能体放进律所运营模型里，并围绕结果导向定价来营销该模型。LawNext 明确指出，这让 AI 直接为工作成果质量担责；Norm
              自己的材料也说，资深律师监督并改进智能体，而不是只把它们当内部起草助手。也就是说，幻觉、不完整的监管逻辑或模型漂移不是抽象产品缺陷——它们会变成执业过失、费用争议或客户损害。ABA Rule 1.1
              抬高能力义务门槛，Rule 1.6 又叠加保密和防未授权访问责任；Norm 面向全球银行、资产管理公司、对冲基金和保险公司，处理高度敏感的交易与监管数据，这些义务更重。为本章审阅的公开材料描述了基于 LLM
              的法律工程和监督型智能体，但没有披露具名基础模型供应商、详细安全认证、事故历史，或模型提供方改变法律用途政策或经济条件时的冗余策略。实际结果是，投资者只能为一家法律服务业务做投资判断，而它的产品质量、隐私姿态和供应商韧性从外部仍只露出一部分。
