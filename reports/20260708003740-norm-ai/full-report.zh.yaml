          detail: 支撑当前估值的示例性基准情形
        - label: ARR $40M，50x
          value: 2000
          detail: 强执行，并维持溢价倍数
        - label: ARR $50M，60x
          value: 3000
          detail: 前沿法律 AI 定位仍成立时的乐观情形
