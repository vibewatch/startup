      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              资本可得性是 Norm Ai 公开财务画像中最强的一块。公司在 2025 年 3 月融资 $48M，2025 年 11 月推出 Norm Law 时又获得 Blackstone $50M 投资，并于 2026 年
              7 月 7 日以 $1.2B 估值完成 $120M Series C。公司声明称，成立以来累计融资现已超过 $260M。同样重要的是，其中 $170M 是在 Norm Law
              推出前后约八个月内融得；这意味着投资人愿意持续资助更宽的全栈战略，而不只是最初的合规软件论点。


              仍然不透明的是现金桥。公开来源没有披露账上现金、月度烧钱、债务义务或资本开支承诺。证据确实显示，烧钱主要由人员驱动：招聘资深律师、法律工程师、AI
              工程师和新业务领域团队，而不是建设资本密集型实物资产基础。因此，用 $30–50M 年烧钱作为规划假设是合理的，尽管它仍只是一个假设。在该区间内，仅 $120M Series C 就能覆盖约 29–48
              个月的毛烧钱，尚未计入早期轮次剩余现金。更保守的承销解读是，一旦招聘加速，实际资金续航约 24–36 个月。


              这段时间大概率足以测试 Norm 能否扩展平台、证明法律服务交付可重复，并把 Supervisory AI
              变成更宽的预算线。但它不足以彻底消除融资依赖。如需下一轮融资，关键很可能在于管理层能否证明软件收入质量干净，以及 Norm Law 能否从锚定账户协作扩展为可重复的多客户经济性。
