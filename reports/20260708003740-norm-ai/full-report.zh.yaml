  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 决策逻辑从已验证的融资事实出发，经过可比背景和证据缺口，最终落到有条件正面建议。
    data:
      nodes:
        - id: headline
          label: 核心事实已验证
          detail: $120M Series C 轮、估值 $1.2B、累计融资 $260M+
        - id: model
          label: 战略模式溢价
          detail: 全栈软件加关联律所，形成差异化
        - id: peers
          label: 存在可比支撑
          detail: Harvey 和 Legora 显示市场愿意为法律 AI 支付溢价
        - id: gaps
          label: 核心证据仍缺失
          detail: ARR、利润率、收入结构或留存均无公开披露
        - id: risk
          label: 结构性风险仍高
          detail: Rule 5.4 和服务收入占比的不确定性会压缩价值
        - id: decision
          label: 建议
          detail: 有条件正面——前提是拿到完整尽调权利，并验证平台经济性
      edges:
        - from: headline
          to: model
          label: 支撑
        - from: model
          to: peers
          label: 帮助解释溢价
        - from: peers
          to: gaps
          label: 但不能替代证据
        - from: gaps
          to: risk
          label: 抬高不确定性
        - from: risk
          to: decision
          label: 推动价格敏感判断
    claimRefs:
      - CV001
      - CV005
      - CV013
      - CV022
      - CV032
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 当前估值对 ARR、收入结构质量和结构清晰度最敏感，单靠市场规模叙事不够。
    data:
      items:
        - label: ARR $10M，30x
          value: 300
          detail: 低支撑情形，单位为百万美元
        - label: ARR $20M，50x
          value: 1000
          detail: 当前轮开始站得住的门槛
        - label: ARR $25M，48x
