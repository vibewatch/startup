  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Norm 的首要风险在于，它的差异化模式可能正好卡在风投支持的软件公司想控制的部分，和美国职业行为规则允许律所做的部分之间。ABA Rule 5.4
              禁止与非律师分成费用，也禁止非律师拥有律所，或控制律所的专业判断；Rule 5.5 则限制没有相应执业准入或监督时跨辖区执业。Norm 公开表示，Norm Law 是一家关联的 AI 原生律所，运行在 Norm
              平台上；但审阅到的公开材料没有披露确切所有权协议、逐辖区律师执业准入图谱，或让智能体输出留在持证律师边界内的内部监督协议。Arizona 和 Utah 说明，特许 ABS 或 sandbox
              制度下可以存在例外，UK ABS 制度也说明部分海外辖区更灵活；但这些豁免反而说明多头最不愿看到的事实：在有限制度之外，默认规则仍要求结构隔离和持证律师控制。证券监管角度又叠加一层问题，因为
              Investor.gov 和 FINRA 都描述了围绕有偿证券建议和 AI 监督的监管边界。如果 Norm
              的工作流在没有清晰监管定位的情况下，从合规工具滑向有偿法律或投资建议，法律风险会很快从理论问题变成生存性风险。
