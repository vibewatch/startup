  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 监管结构和客户损害风险兼具最高影响，并且发生可能性至少中到高。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 低可能性
          values:
            - 公开指标不透明
            - 国际结构错配
            - Blackstone 退出
            - 律师协会不利裁定
        - label: 中等可能性
          values:
            - 融资摩擦
            - 安全披露缺口
            - 州执业准入缺口
            - 模型访问终止
        - label: 高可能性
          values:
            - 律师招聘摩擦
            - 结果定价争议
            - LLM 成本上升
            - 客户事项中的 AI 错误
        - label: 很高可能性
          values:
            - 标杆客户集中
            - 合伙人流失
            - 投资人-客户冲突管理
            - Norm Law 遭监管审查
