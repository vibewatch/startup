      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              John Nay 是 Norm Ai 创始人兼 CEO。他的履历罕见地深扎在 AI 研究、法律学术和机构金融的交叉处。约 2016 年至 2022 年，他在 Stanford CodeX（Center for
              Legal Informatics）任研究员，搭建了他所称“智能体法律”的概念和技术基础。创办 Norm Ai 前，他创办了 AI 投资平台 Brooklyn Investment Group，后将其出售给
              TIAA Nuveen；TIAA Nuveen 后来既投资 Norm Ai，也成为客户。他还在 NYU School of Law 开设过被称为该校首门 AI 法律课程的课，在 AI
              与法律交叉领域建立了学术信用，而这一交叉正是 Norm Ai 定位的核心。


              Norm Law LLP 由 Mike Schmidtberger 担任主席；他曾任全球最大律所之一 Sidley Austin 执行委员会主席，并于 2026 年 1 月加入。Norm Law
              的合伙人团队还包括 Sidley Austin 前全球房地产负责人、Ropes & Gray 资深 M&A 合伙人、Bain Capital Ventures 总法律顾问，以及来自 Kirkland &
              Ellis、Simpson Thacher、Paul Weiss、Davis Polk、Skadden、Cleary Gottlieb、Latham & Watkins、Paul
              Hastings、Proskauer 和 Pillsbury 的横向加入律师。


              兼任战略顾问的个人投资者包括 Tony James（Blackstone 前总裁、COO 兼执行副董事长）、Jeff Hammes（Kirkland & Ellis 前主席）、Henry R.
              Kravis（KKR 联合创始人）和 Marc Benioff（Salesforce CEO）。这些人物背书，释放出 Norm Ai 在超高端机构买家圈层具备信用的信号。


              关键人风险高度集中在 John Nay 身上。他的学术声誉、机构关系，以及“智能体法律”架构者的公共身份，共同支撑品牌、产品和获客。截至报告日期，Nay 以下的具体 C-suite
              职位（CTO、CFO、CPO）尚未公开；对外部观察者而言，这是运营治理缺口。
