            body: >
              截至 2026 年 7 月，Norm Ai 披露的核心牵引指标是：客户合计管理资产超过 $30T。这个数字出现在公司 2026 年 7 月官方新闻稿中，Khosla Ventures 和 Blackstone
              两家投资人在公开声明里也逐字复述，提供了一定第三方佐证。但点名客户清单很短：可确认名称只有 Blackstone 和 Bain Capital Ventures，且二者都是投资人。构成 $30T+ AUM
              总量的其他机构身份未公开，独立验证在结构上无法完成。


              收入、ARR、单位经济、员工数（技术公司 + Norm Law LLP 合计）和地理部署细节均未披露。这些都是估值承销中的重大证据缺口。Series C 募资将用于继续招聘资深律师和 AI 工程师、扩大 Norm
              Law 的业务领域覆盖，并开发面向企业部署的监督型 AI 智能体。


              公司在成立、融资、产品和监管维度的关键里程碑压缩在不到三年内：法律工程正式化（2024 年 7 月）、机构投资人参与的 $48M 融资（2025 年 1 月）、与美国参议员和监管者共同举办首届 Central
              Park AI Forum（2025 年 9 月）、Blackstone 投资及 Norm Law LLP 推出（2025 年 11 月）、Mike Schmidtberger 出任 Norm Law
              主席（2026 年 1 月）、在 Stanford 推出 Legal AGI Lab（2026 年 4 月），以及确认独角兽地位的 Series C（2026 年 7 月 7 日）。
