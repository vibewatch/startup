      - number: '5.3'
        title: 成熟度与部署状态
        blocks:
          - type: paragraph
            body: >-
              公开证据支持这样的判断：Norm 已在若干受监管工作流中进入生产，但各模块成熟度并不相同。LEAP 是最成熟的组件。Norm 自己的 2026 年回顾称，到 2024
              年底，平台已在为管理数万亿美元资产的资产管理公司驱动实时合规审查；当前材料称，代表超过 $30T AUM 的内部法务团队直接使用 Norm 智能体。Norm Law 也明显是生产级，而不是愿景型资产。其网站列出
              65 名以上律师和法律工程师、七个业务领域、与真实交易工作绑定的 Blackstone 证言，以及质量免责声明：所有法律建议均由持证 Norm Law 律师提供，而不是由 Norm Ai 本身提供。


              堆栈其余部分像是从生产核心逐级扩张。Microsoft 365 Copilot 合规智能体，以及 DDQ 和 RFP 填写解决方案，都在 2026 年以打包工作流产品推出，说明 Norm
              正从定制部署走向更可重复的企业模块。Supervisory AI 看起来已越过概念阶段，因为官网和 Series C 材料都称其越来越多地用于受监管企业 AI
              监督，但公开买家引用仍比内容审查或律所服务更薄。Legal AGI Lab 最明显是路线图资产，而不是近期收入产品。它发布法律推理和 AI 治理的研究主题、基准测试与理论，但定位是推进未来法律基础设施的 R&D
              部门，而不是带公开 SLA 或采用指标的商业 SKU。因此，成熟度图谱是：内容和法律顾问工作流已生产化，企业监督商业化正在增长，Legal AGI 仍处研究阶段。
