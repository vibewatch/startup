              Norm Ai 的公开客户证明很窄，但已有证据异常具有战略性。具备直接工作流证据的点名用户是 Blackstone 和 Bain Capital
              Ventures，二者同时也是投资人。这与典型创业公司客户名单有实质差异，因为最可见的商业关系同时承担产品验证、融资支持和商业化信号。Blackstone
              是最清晰的锚定账户：独立来源和公司背书来源都称，Blackstone 先在其法务和合规团队内部使用 Norm Ai 做受监管内容审查，随后把关系扩展到为 Blackstone 使用而共同开发 Norm Law
              服务。Bain Capital Ventures 是第二个锚点：Matt Harris 表示，Norm 驱动 Bain Capital 内部受监管工作流，Norm Law
              也在交易中代表该公司。相比之下，Vanguard、Citi、TIAA 和 New York Life 显然是战略投资人和顾问委员会参与者，但已审阅公开记录尚未证明它们是付费客户。这种不对称很重要，因为 $30T
