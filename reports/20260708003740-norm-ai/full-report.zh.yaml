      - number: '2.2'
        title: 市场规模口径及其边界
        blocks:
          - type: paragraph
            body: >-
              最宽且可信的市场口径是法律科技。Grand View Research 估计该市场 2024 年约为 $32B，并预计到 2030 年以低双位数 CAGR 增长至约 $65B；Thomson Reuters
              指向类似趋势。这个背景有用，因为它说明品类足够大、仍在扩张，且软件预算真实存在。但它不是 Norm 的直接 TAM，因为广义法律科技包含执业管理、法院技术等类别，无法干净映射到受监管金融服务工作流。


              更贴近的口径是合规自动化，以及法律服务中的 AI。McKinsey 明确把合规和法律列为金融服务 AI 的下一批前沿场景，围绕该领域的公开评论常把合规自动化市场放在约 $15B–$20B
              区间。相邻服务支出也重要：Thomson Reuters 评论称 ALSP 市场年规模约 $15B，这与 Norm Law 有关，因为它可以拿下原本流向外部服务商的预算。私募市场可比公司虽不是 TAM
              数字，也提供规模信号。Harvey 估值 $11B，Legora 估值 $5.6B，说明投资人已把 AI 原生法律工作流视为重要品类。关键尽调点在于这些口径彼此重叠，只能用来做边界校验，不能相加成一个激进
              TAM。
