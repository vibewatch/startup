      - number: '2.4'
        title: 增长驱动、采用约束与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              需求并非纸面故事。Thomson Reuters 数据显示，法律 AI 采用已经不再是假设：超过一半法律专业人士已经使用生成式 AI，绝大多数公司法务部门计划在 2025 至 2026
              年采用。对受监管金融机构而言，法律和合规工作流尤其有吸引力，因为监管、产品复杂度以及 AI 向业务运营渗透，都会推高底层负担。银行或资产管理公司每多部署一个 AI
              系统，就更需要监督控制来测试这些系统是否仍在法律和政策护栏内运行。


              约束同样真实。信任与幻觉风险仍是硬约束，因为错误输出可能带来监管、合同或受托责任暴露。Rule 5.4
              及类似职业行为限制，让任何混合软件经济性与法律服务交付的模式都更复杂。切换成本高，因为判断嵌在律师关系、操作手册和传统审查流程里。预算烟囱也会拖慢采用，因为法务、合规、风险和业务赞助人都必须认可
              ROI。这些约束意味着估值对部署质量证明敏感，而不只对品类规模敏感。


              最大的尽调缺口仍在私域。公开披露没有给出客户数、定价、细分组合或留存；也无法说明 $30T AUM
              覆盖中有多少是活跃付费部署，多少只是关系信号。公开市场估算还把软件、服务和人力混在一起。因此，市场章节可以支撑一组规模口径，却无法在今天支撑一个精确的公开 SOM。
