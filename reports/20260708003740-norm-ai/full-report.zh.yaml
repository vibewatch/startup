      - number: '3.3'
        title: 定价、包装与切换成本
        blocks:
          - type: paragraph
            body: >-
              定价对比重要，因为这些厂商并不要求买方为同一条预算线买单。Norm Law
              的公开定位是按结果计价；如果买方想要可衡量的执行、又厌恶按小时收费，这很有吸引力。但采购团队仍需把这种结构与按席位计费的软件，以及既有外部律师规则相比较。Harvey、Legora、Microsoft 和
              Thomson Reuters 多数呈现演示驱动或协商式企业软件销售动作，比“软件 + 服务”的混合合作更容易嵌入既有法律运营或生产力预算。Axiom、EY 和 Elevate
              则通过项目、人员派遣或托管服务经济性竞争。传统律所仍是最难事务的标杆；近期市场数据显示合伙人费率继续上升，部分顶级合伙人时薪超过 $2,300，前 25 名 Am Law M&A 合伙人费率约为每小时
              $1,680。因此，切换成本并不均匀。替换 Westlaw 或 Practical Law 工作流，或把 Microsoft 从既有堆栈中挤出去，在结构上都比替换狭窄的手工审查或电子表格流程更难。Norm
              最有优势的场景是：买方已经不满律所按小时收费的经济性，并希望 AI 工作流和法律产出都由一个可负责的运营方交付。
