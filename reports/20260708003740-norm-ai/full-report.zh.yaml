      - number: '4.2'
        title: 单位经济与销售效率假设
        blocks:
          - type: paragraph
            body: >-
              Norm Ai 仍是私营公司，商业扩张也处在早期；几乎所有关键单位经济指标都只能推断，不能直接观察。公开来源没有披露 ARR、收入、CAC、回本周期、流失、NRR 或客户集中度表。可见的是模型形态：Norm
              面向超大型金融机构销售，把资深法律和监管人才嵌入产品交付，并越来越多地在软件与法律服务之间交叉销售。这种组合通常意味着获客成本高，但如果客户能跨工作流、业务领域和法律服务类别扩张，生命周期价值也可能很大。


              毛利率最难判断。平台应比传统咨询业务更像软件；如果模型推理成本和实施开销受控，60–80% 的平台毛利率假设可以成立。Norm Law 的毛利率应更低，因为即使 AI
              拿掉一审工作，执业律师和合伙人仍是核心交付投入；30–50% 的服务毛利区间比真正 SaaS 经济性更可信。如果平台收入占比变大，45–65%
              的综合毛利结果可以想象。若法律服务占主导，综合毛利可能更低，看起来更像高端 ALSP，而不是纯软件公司。


              更深层的问题是，双重模式可以抬高 LTV，却会遮住可比性。向同一企业账户交叉销售 Leap、Supervisory AI 和 Norm
              Law，可能提高钱包份额和账户黏性；但增长究竟来自经常性软件、一次性事项，还是由关联方推动的部署，会变得更浑。承销的关键因此不在于“经济性可能有吸引力”这个想法，而在于管理层能否在尽调中把各层干净拆开。
