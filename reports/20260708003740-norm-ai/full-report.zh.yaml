      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              公开记录支撑一个清晰的战略财务叙事，但还支撑不了干净的承销案例。Norm Ai 集结了蓝筹资本，看起来在向超大型机构销售，并为 Norm Law 选择了一个与 AI
              正在重塑法律经济性方向一致的定价理念。这些都是有意义的正面因素。但它们没有回答投资人最终必须定价的问题：收入中有多少比例是经常性软件、多少是按事项计费服务；每一层赚取多少毛利；客户基础多集中；投资人客户是否贡献超额收入；公司为支撑混合模式正以多快速度消耗现金。


              法律结构又加了一层警惕。ABA Rule 5.4 和独立法律科技报道都强调，一家同时交付法律服务的 AI 公司，监管和责任画像不同于纯软件供应商。这不意味着模式不可行，但意味着收入质量和毛利耐久性不能只用
              SaaS 视角判断。关联方动态也重要：Blackstone 既是投资人也是用户，同样模式可能延伸到其他金融机构支持者。


              综合来看，恰当的财务结论是“有前景，但仍不透明”。如果平台收入占主导，商业模式可能支撑高溢价的软件式结果；它也可能落到一个扩展性更弱、毛利更低的组合里，即软件加精英法律服务。区分这两条路径所缺的数据，正是财务尽调在承销决定前必须挖出的内容。
            claimRefs:
