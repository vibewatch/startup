        - id: in-house-go-live
          label: 内部上线
          detail: Blackstone 和 BCV 证明 Norm 已进入企业法务或合规团队的实际使用。
        - id: norm-law
          label: Norm Law 层
          detail: 部分客户把关系延伸到外部律师服务，尤其是交易或专业监管事项。
        - id: expanded-account
          label: 账户扩张
          detail: 同一机构内部，业务领域增加和 Supervisory AI 能继续扩大钱包份额。
      edges:
        - from: prospect
          to: strategic-entry
          label: 痛点 + 触达
        - from: strategic-entry
          to: pilot-scope
          label: 工作流选择
        - from: pilot-scope
          to: in-house-go-live
