      - number: '3.4'
        title: 护城河耐久性、风险与尽调问题
        blocks:
          - type: paragraph
            body: >-
              Norm 的护城河真实存在，但有条件。最强壁垒在结构上：公开资料没有显示另一家竞争者把 Supervisory AI、关联外部律师交付和按结果计价执行组合在同一堆栈里；ABA Rule 5.4
              也让这类整合在许多美国司法辖区难以快速复制。同样的复杂性也是风险，因为公开数据尚看不清可移植性、律师协会合规和采购舒适度。竞争压力正从三个方向同时上升。Harvey
              证明纯软件玩家仍能定制法律工作流，且已经与资产管理买家重叠。Microsoft 可以通过套件捆绑，把中等复杂度审查和监管任务商品化。Thomson Reuters 与 Anthropic
              不复制法律服务部分，也能在研究、起草和可信 AI 输出上压缩 Norm 优势。因此，正确的尽调姿态应是运营性的，而不只是主题性的：索取按竞争者类别划分的真实赢单 / 输单数据、软件与 Norm Law
              之间的收入组合、Supervisory AI 的附着率和续约，以及支撑 Norm Law 当前结构的具体司法辖区和法律意见。抓取日志中已有多个第三方 URL 现在跳转到
              404、反爬或限流页面，独立佐证比理想状态更薄，尽调时应通过许可数据库刷新。
