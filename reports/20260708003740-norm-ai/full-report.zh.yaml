  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Norm Ai 现在呈现出鲜明的混合收入模式。一层是软件：Leap，即公司的法律工程自动化平台，加上面向全球金融机构内部法务和合规团队销售的 Supervisory AI / 治理工作流。第二层是服务：Norm
              Law LLP，这家 AI 原生律所于 2025 年底与 Blackstone 一起推出，设计目标是直接向机构客户销售法律工作。公开披露持续把公司描述为“法律 AI
              的全栈模式”；从财务上看，这很重要，因为平台和律所很可能以不同方式变现同一批底层客户关系。


              公开定价能见度仍然很弱。官网和 2025–2026 年融资公告均未提供 Leap、Supervisory AI 或 Norm Law 的标价。这强烈指向协商式企业合同销售，而不是公开 SaaS 档位。对 Leap
              而言，最可支撑的承销假设是按席位、工作流或企业范围绑定的定制年度授权。对 Supervisory AI 而言，公开表述指向一个与更广企业 AI 治理部署一起销售的附加组件或模块。对 Norm Law
              而言，公司和独立报道都强调按结果而非按小时计价；这在战略上形成差异，但也让外部更难判断收入确认和可比性。


              最重要的正面因素是，Norm
              似乎能在同一批受监管账户内同时变现软件预算和外部律师预算。最重要的警惕点是，由此形成的收入组合可能模糊增长中有多少来自经常性平台收入，有多少来自按事项计费的法律服务收入。缺少产品级收入拆分、合同期限和实际成交价格时，模型结构可以理解，但收入质量仍无法承销。
