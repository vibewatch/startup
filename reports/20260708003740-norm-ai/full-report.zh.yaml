      - number: '5.2'
        title: 架构与工作流
        blocks:
          - type: paragraph
            body: >-
              Norm Ai 的公开架构披露足以重构其运营模型，尽管还不足以还原完整系统图。披露出的模式是：律师知识叠加自有编排，底层使用外部前沿模型。Norm 2026 年 4
              月的法律工程回顾称，软件工程师构建内部工具和协议，法律工程师直接在终端和命令行环境中工作，律师则搭建智能体链、Web 应用、邮件集成和工作流自动化。DDQ 和 RFP
              产品说明补上了知识层：已批准答案、基金文件、政策和历史问卷存放在带版本的仓库里；智能体检索最权威来源、起草回复、引用证据，并把审查者修改沉淀为先例。Microsoft 365 Copilot
              集成则增加政策验证层，在既有企业界面内提供合规审查、可审计性和已批准来源检查。


              这套架构明显是混合型。Norm 没有声称训练自己的前沿基础模型；它描述的是外部 AI 基础设施，并在 Legal AGI 研究中公开基准测试 Anthropic
              模型，同时不披露生产环境路由和供应商组合。因此，工作流看起来从客户接入和文件捕获开始，经由政策检索和智能体执行，进入人工法务或合规升级，再回流到先例仓库以改进后续运行。这与纯法律 AI
              助手有本质差异。系统旨在让机构标准跨多个工作流复用、可解释、可执行。代价是，输出质量的可信度同时取决于编码政策层，以及其下第三方模型的行为。
