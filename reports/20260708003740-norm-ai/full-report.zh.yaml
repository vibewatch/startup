  - id: FR002
    title: 风险传导图
    type: dag
    summary: 少数法律和运营失败会迅速传导为客户流失、增长放缓和融资叙事破裂。
    data:
      nodes:
        - id: aba54
          label: ABA Rule 5.4 质疑
          detail: 对一体化结构的所有权或费用分成提出质疑
        - id: upl
          label: UPL 或执业准入失败
          detail: 无监督 AI 输出或跨州执业违规
        - id: aierror
          label: AI 客户损害事件
          detail: 幻觉或错误法律建议传到客户
        - id: breach
          label: 保密失守
          detail: 敏感客户数据泄露，或可被外部访问
        - id: modelcut
          label: 模型访问丧失
          detail: 供应商政策、可用性或经济性发生重大变化
        - id: founderloss
          label: 创始人扰动
          detail: John Nay 离职或无法履职
        - id: restructure
          label: 被迫重组
          detail: 为保持合规而必须调整实体或工作流
        - id: trustloss
          label: 信任与客户流失
          detail: 标杆价值和采购推进力减弱
        - id: revenuehit
          label: 收入与利润率压力
          detail: 成交变慢、审核成本上升或客户流失
        - id: downround
          label: 下轮估值下调风险
          detail: 叙事型估值失去基本面支撑
        - id: nonviable
          label: 投资不可行
          detail: 核心投资逻辑失效，且没有可接受的修复路径
      edges:
        - from: aba54
          to: restructure
          label: 监管行动
        - from: upl
          to: trustloss
          label: 执法或禁令
        - from: aierror
          to: trustloss
          label: 职业过失 / 声誉冲击
        - from: breach
          to: trustloss
          label: 隐私失守
        - from: modelcut
          to: revenuehit
          label: 服务降级
        - from: founderloss
          to: revenuehit
          label: 销售和招聘放缓
        - from: restructure
          to: revenuehit
          label: 扩张延迟
        - from: trustloss
          to: revenuehit
          label: 客户流失 / 采购变慢
        - from: revenuehit
          to: downround
          label: 倍数压缩
        - from: downround
          to: nonviable
          label: 投资逻辑破裂
    claimRefs:
      - CR016
      - CR039
      - CR041
      - CR042
      - CR044
      - CR047
