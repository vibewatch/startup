      - number: '7.3'
        title: 合作伙伴、依赖、人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              Norm 的依赖栈比标题式估值暗示的更窄。资本和 GTM 侧，公开来源把 Blackstone 与 Bain Capital Ventures
              同时列为投资者和活跃用户；模型跑通时，这是强证据，但任一关系走弱时，也会带来集中度和治理敏感性。产品侧，Crunchbase 将 Leap 描述为基于 LLM 的法律工程系统，而 Norm
              公开材料没有点名基础模型供应商，在模型访问、定价和政策上留下有意义的单点依赖。人才侧，Norm 的公开可信度锚定在 John Nay、Mike Schmidtberger
              和少数精英横向引进合伙人身上；公开记录没有显示 Nay 之下有厚实的继任高管梯队，或多层治理体系。执行风险也在上升，因为 Norm 明确用新资金招聘资深律师和 AI 工程师，而 Harvey、Legora 以及
              Brahe 等更新的 AI-first 律所都在争夺重叠的人才和企业信任。公司最终可能证明这套栈足够耐久，但今天可见证据仍像一个创始人主导、合伙人主导、依赖模型的平台；它的扩张路径取决于同时稳住几类稀缺群体。
