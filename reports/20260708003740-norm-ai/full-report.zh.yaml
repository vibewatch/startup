      - number: '8.3'
        title: 牛、基准与熊情景
        blocks:
          - type: paragraph
            body: >-
              即便输入项仍是私有的，情景数学也很直接。牛市情景下，Norm 证明自己的法律工程层和关联律所模型创造了真正的平台优势。这意味着已激活的旗舰账户、可重复的软件收入、监督型 AI
              的高附着率，以及比普通服务业务更好的利润率结构。在这些条件下，当前轮次事后看可能显得便宜。基准情景下，公司真实且重要，但仍处早期——产品市场拉力强，ARR 有意义，差异化足以保住溢价倍数，但还没有足够证据配得上
              Harvey 式亢奋。在这种情景中，当前价格可辩护，但空间很紧。


              熊市情景不是公司归零，而是市场最终按可验证内容给 Norm 定价。如果法律结构复杂性拖慢扩张，如果收入最后偏服务，或如果 $30 trillion AUM 足迹被证明更偏关系导向而非收入导向，投资者可能会把
              Norm 压向法律服务或混合模式基准。即便业务继续运营和增长，也会造成痛苦减记。关键情景教训是，上下行价差主要由商业化质量和结构清晰度驱动，而不是由法律 AI 抽象上是否是一个有吸引力的市场驱动。
