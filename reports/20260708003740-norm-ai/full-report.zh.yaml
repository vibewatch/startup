      - number: '3.2'
        title: 既有厂商与相邻供给方
        blocks:
          - type: paragraph
            body: >-
              Norm 面对的既有厂商和相邻替代者，比“创业公司对创业公司”的框架更宽。Microsoft 已经发布面向法律场景的 Copilot
              工作流，覆盖合同审查、自动审查智能体、诉讼支持和监管工作，并把这些用例叠进许多企业已采购的 Microsoft 365 权限、留存和安全工具中。Thomson Reuters 作为既有厂商更关键，因为
              CoCounsel、Westlaw 和 Practical Law 把 AI 工作流、可信法律内容，以及跨律所、企业和政府的长期买方关系结合起来。Practical Law 的 650 多名律师编辑和
              118,000 多项资源，形成真实切换成本。在相邻服务侧，Axiom、EY 和 Elevate
              争夺的是买方想要的同一结果——降低外部律师支出、加快执行——但它们靠按需人才、托管服务、合同运营和工作流自动化交付，而不是 Norm 更一体化的法律工程论点。Anthropic
              在模型层增加另一条威胁路径：它让合作伙伴和客户可以搭建法律工作流，而自身不必成为法律服务商。
