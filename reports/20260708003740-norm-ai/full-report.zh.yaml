            body: >-
              公开耐久性证据更多是定性的，不是合同性的，但方向上偏正面。产品并不是通用法律聊天机器人；它嵌入受监管工作流，由法律工程师维护，并通过 Norm Law
              越来越多地叠加外部律师服务。客户要替换的不只是写进系统的工作流逻辑，还包括律师关系，切换成本因此上升。Blackstone 和 Bain 的案例也显示出 land-and-expand
              行为：每段关系都横跨融资、软件部署和更深的服务层。Norm Law 的公开建设让追加销售路径比幻灯片概念更可信。官网披露 65 名以上律师和法律工程师；January
              及之后引入的合伙人把覆盖扩展到投资基金、私募股权、风险投资和私人信贷。同样重要的是缺失项：审阅到的公开来源没有披露续约条款、NRR、GRR、客户 logo
              流失或标准采购周期；市场能看到关系深度，却还不能量化留存质量。
