  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞争者
        blocks:
          - type: paragraph
            body: >-
              Harvey 和 Legora 是 Norm Ai 最直接的 AI 原生同业，但二者都从软件优先切入市场，而不是采用“软件 + 律所”的组合结构。按融资和客户渗透看，Harvey 是当前更大的标杆。其 2026
              年 3 月增长轮把公司估值推到 $11B；Harvey 称其已服务 AmLaw 100 多数成员、500 多个内部团队，以及 60 个国家的 50 家资产管理公司。最后一个指标重要，因为它意味着 Harvey
              已不只是律所工具，也触达了 Norm 所称核心市场中的一部分资产管理买家。Legora 小于
              Harvey，但资本充足，并在美国快速增长，同时向律所和内部团队营销智能体工作流、研究、起草和监控。相较这些直接同业，Norm
              的主要差异在于能把软件、监督治理和法律执行打包销售；主要风险则是，纯软件对手正在证明，不拥有律所也能深度定制法律工作流。
