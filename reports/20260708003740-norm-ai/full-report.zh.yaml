      - number: '1.5'
        title: 监管与结构差异
        blocks:
          - type: paragraph
            body: >
              Norm Ai 的双重结构带来实质监管复杂性。根据 ABA Model Rule 5.4，律师不得与非律师分享法律服务费，非律师也不得持有执业律所的股权。Rule 5.4(d)
              明确规定，如果非律师持有任何权益，律师“不得在获准以营利方式执业的专业公司或协会中执业，也不得以该形式执业”。美国多数州采纳了这条规则；如果 Norm Law LLP 以营利方式从事法律执业，它将直接禁止
              Norm AI, Inc. 拥有或控制 Norm Law LLP。


              公司未公开 Norm Law LLP
              的法律所有权结构，也未说明其在服务客户的司法辖区如何处理州律师协会规则。科技公司关联律所的常见做法是复杂的结构隔离，例如采用合作或转介模式，而不是直接持有；这种安排会限制运营整合和财务并表。


              Norm Law
              的按结果计价也触发律师协会规则问题：多数司法辖区允许在某些场景使用风险代理费（报酬取决于结果），例如人身伤害案件；但在另一些场景会限制或禁止，例如刑事案件和部分公司事务。如果“结果”计价被定性为风险代理费，就会出现额外律师协会合规问题。LawNext
              明确指出，这种双实体结构相较纯 SaaS 竞争者会形成“不同的监管和责任画像”。


              合起来看，这些监管复杂性不只是理论风险：它们可能限制 Norm Ai 跨司法辖区扩张，迫使公司重组结构，或引来律师协会审查，进而构成实质投资风险。反过来，它们也是竞争护城河——模式越复杂，新进入者门槛越高。
            claimRefs:
              - CO027
              - CO028
              - CO029
              - CO030
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、邻近领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              Norm Ai 不是因为用了律师和
              AI，就在向整个法律科技市场销售。它的核心切入点更窄：把法律和合规义务编码进受监管金融机构工作流的软件与服务。公司把买家定义为全球银行、对冲基金、保险公司和资产管理公司，把产品层定义为面向高风险工作的智能体法律加
              Supervisory AI。因此，可匹配支出不是诉讼软件、消费者法律应用或泛律所后台工具，而是受监管机构内部用于政策解释、控制测试、文件审查、AI 治理和替代外部律师的那部分支出。


              最接近的相邻预算池是法律科技、监管科技或合规自动化，以及替代法律服务。广义法律科技是外层 TAM 口径，因为它覆盖法律工作流数字化的软件预算。合规自动化更接近运营口径，因为它更直接映射到 Norm
              想自动化的审查、监控和政策执行工作。ALSP 与外部律师同样重要，因为 Norm Law
              意味着部分支出可能从服务预算而非软件预算迁移过来。因此，现状替代方案包括内部法务和合规团队、外部律师、ALSP、传统规则引擎，以及叠加在既有系统上的通用 AI 助手。估值必须看这些替代方案，因为它们说明 Norm
              不只争夺独立 SaaS 预算，也在争夺人力和服务预算。
