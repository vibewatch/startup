      - number: '5.4'
        title: 依赖、风险与路线图缺口
        blocks:
          - type: paragraph
            body: >-
              Norm
              最强的战略特征，也是最清晰的技术与监管风险包。公司把产品建在外部前沿模型基础设施之上，而不是建在已披露的自有基础模型之上；因此，主要模型供应商的成本、可用性、安全行为和政策变化，都可能直接传导到产品经济性和可靠性。Norm
              自身研究也坦承，信任是瓶颈。Legal AGI Lab 页面称，前沿模型约 90% 的时间会得出相同法律结论；对高风险法律工作而言，这仍意味着规模化后会反复出现矛盾。这不只是软件 QA 问题。Norm Law
              在按结果计价的法律事项中使用同一堆栈，幻觉或不一致就可能从客户满意度问题升级为责任问题。


              数据治理是另一项重大依赖。Norm 的工作流会触及营销主张、投资者问卷、基金文件、内部政策，以及其他高度敏感的受监管材料。信任中心元数据称，公司强调 SOC 2
              合规、持续监控和数据保护，但公开读者难以检查详细控制集、事故历史或模型治理流程。结构上，ABA Rule 5.4
              也限制技术公司与律所能靠多近；公开材料没有解释确切所有权、费用分成或控制安排。路线图上，公司显然在推向更宽的法律基础设施层：AI 监督 AI、更广企业嵌入、更全球化的监管范围，以及 Legal AGI
              Lab。如果法律工程师与执业律师之间的先例闭环，比模型商品化更快复利，护城河可能变得耐久。若该闭环变弱，第三方模型进步可能比公司今天披露的速度更快侵蚀差异化。
