      - number: '8.2'
        title: 可比组与倍数语境
        blocks:
          - type: paragraph
            body: >-
              可比组分成三个很不一样的桶。第一类是 Harvey 和 Legora 这样的前沿法律 AI 胜者。Harvey 披露的 March 2026 融资估值为 $11 billion，后续 Forbes 引用的 ARR
              为 $190 million，隐含收入倍数约在 50 倍高段，说明市场会支持有可见采用证据的平台拿到极高估值。Legora 的 $5.6 billion
              估值显示，同样的胃口已经延伸到美国既有企业之外，哪怕模型更窄、更偏工作区。第二类是 Thomson Reuters 这类成熟法律信息既有企业。按公开市值和收入数据，Thomson Reuters
              只以中个位数收入倍数交易，凸显增长放缓、公募市场可比性接管之后，估值压缩会很快发生。


              第三类是法律服务和 ALSP 基准。Thomson Reuters 将 ALSP 市场测算为 $28.5 billion，并显示企业法务部门采用率上升；但 Axiom、Elevate 或 EY Law
              的私募市场估值标记没有公开。最接近的可观察法律服务交易数据指向低个位数收入倍数，BizBuySell 的法律服务基准聚集在 0.4x 到 1.0x 收入之间。这个基准并不是完美的 ALSP
              可比项，但方向上有用。它说明，如果 Norm 更像技术赋能服务，而不是前沿软件，当前估值很难支撑。因此，整个争论最终取决于未来两年 Norm 实际会更像哪个桶。
