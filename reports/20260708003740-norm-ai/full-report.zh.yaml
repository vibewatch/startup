chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >
              Norm AI, Inc.——对外以 “Norm Ai” 营销——于 2023 年 7 月注册并开始运营，总部位于纽约州纽约市。Crunchbase 将其归入人工智能、合规和法律科技。公司创始论点来自 CEO
              John Nay 在 Stanford CodeX Center for Legal Informatics 超过六年的学术研究：法律和监管规则可以系统编码进 AI 智能体。Norm Ai
              将这种模式称为“智能体法律”。


              Norm Ai 的业务围绕两个一体化但法律上分离的实体。第一层是 Norm Ai 技术平台，核心是 Leap（法律工程自动化平台），这套自有系统让 Norm Ai
              训练的法律工程师——也就是非执业律师——借助大语言模型，把复杂法律判断直接转成可运行的 AI 智能体。Leap 之上是 Supervisory AI，作为治理层监控在监管环境中运行的其他 AI
              智能体，例如提供投资或医疗建议的 AI 顾问，检查它们是否守住法律和监管边界。


              第二个实体是 Norm Law LLP，这家关联 AI 原生律所原生运行在 Norm Ai 平台上。Norm Law 为机构客户提供外部法律顾问服务。传统律所按小时收费，Norm Law 则按结果计价，让 AI
              带来的效率收益直接流向客户，而不是被律所计费模式吸收。资深律师负责监督和改进 AI 智能体，而不是管理层层初级律师。


              公司把“技术平台 + AI 原生律所”的组合称为“法律 AI 的全栈模式”。它让 Norm Ai 区别于 Harvey AI、Legora 等竞争者：Harvey AI 向律所销售软件工具，Legora
              聚焦律所法律研究；Norm Ai 不只向企业法务和合规团队授权技术，也为同一批企业执行法律工作。Norm Ai 聚焦金融服务，目标客户是全球银行、对冲基金、保险公司和资产管理公司，合计 AUM 超过 $30T。
