  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间显示，一旦 Norm 被按平台软件而非技术赋能法律服务估值，结果会迅速拉开。
    data:
      items:
        - label: 悲观情形
          low: 0.15
          mid: 0.35
          high: 0.6
          unit: $B
          source: Services-heavy mix or structural separation scenario
        - label: 基准情形
          low: 1
          mid: 1.3
          high: 1.8
          unit: $B
          source: Mixed software and services with acceptable but incomplete proof
        - label: 乐观情形
          low: 2.5
          mid: 3.5
          high: 5
          unit: $B
          source: Platform-like economics with strong deployment depth and legal-structure clarity
    approximationNotes: 区间为作者估算，使用已披露同业估值和法律服务基准。
    claimRefs:
      - CV028
      - CV029
      - CV030
      - CV037
      - CV038
      - CV043
