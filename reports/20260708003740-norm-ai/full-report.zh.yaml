      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Norm 的买方地图比标准法律软件销售更复杂，因为产品族横跨软件、监督控制和 AI 原生法律服务交付。在银行里，合规强度高的工作流最可能先由首席合规官或首席风险官赞助，尤其当用例涉及监控、政策或 AI
              治理时。在资产管理公司、对冲基金和保险公司里，如果工作流更像文件审查、营销审查或替代外部律师，总法律顾问可能成为最初赞助人。日常用户则是律师、合规分析师、风险人员和法律工程师，他们把政策转成可重复的审查逻辑。


              预算归属取决于堆栈中哪一层被出售。Supervisory AI 和政策自动化适配企业软件或风险科技预算。类似 Norm Law 的服务交付可以从外部律师或 ALSP
              预算中抽取。这个差异会扩大收入池，也会让采购更复杂。最可能的采用路径是“先落地、再扩张”：从一个痛点工作流切入，证明周期缩短和可审计性，再扩展到相邻审查任务或 Supervisory AI。Blackstone
              和 Bain Capital Ventures
              是重要公开样本，因为它们说明信任建立后，有影响力的机构赞助人可以加速采用。同一证据也强化了金融服务为何是合理滩头阵地：预算大、高风险文本工作流重复，法律或合规错误的下行代价很重。
