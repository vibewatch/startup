        - from: in-house-go-live
          to: norm-law
          label: 服务追加销售
        - from: norm-law
          to: expanded-account
          label: 更多业务领域与 AI 监督
    approximationNotes: 标题沿用简报，但图采用流程形式，因为公开记录没有披露潜客到客户的转化百分比。
