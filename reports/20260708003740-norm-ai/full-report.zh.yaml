      - number: '1.3'
        title: 融资历史与资本形成
        blocks:
          - type: paragraph
            body: >
              自 2023 年 7 月以来，Norm Ai 通过多轮融资累计募资超过
              $260M；对一家成立未满三年的公司而言，资本形成速度很快。公司的融资轨迹反映出一项刻意设计：把投资人关系锚定在客户基础里。其多数投资人也是直接客户。


              2025 年前的融资历史（隐含种子轮和 / 或 Series A）未公开。首轮可确认机构融资发生在 2025 年 1 月，Vanguard、Blackstone、Bain Capital
              Ventures、Citi、TIAA 和 Coatue 投入 $48M；这些机构均为资产管理公司或金融服务公司，正落在 Norm Ai 瞄准的客户类型内。Crunchbase 将该轮归为 Series
              B，意味着更早轮次未披露。2025 年 11 月，Blackstone 在 Norm Law LLP 推出时追加 $50M 战略投资，显示 Blackstone 自身法律 AI 野心与 Norm Ai
              模式深度一致。


              2026 年 7 月 7 日的 Series C 募得 $120M，投后估值 $1.2B，由 Khosla Ventures 领投；Khosla Ventures 被描述为 OpenAI
              的首个机构投资者，这也是其首次投资 Norm Ai。老股东 Blackstone、Bain Capital Ventures、Craft Ventures、Coatue、Vanguard、New York
              Life 和 TIAA 继续参与，新投资者包括 Fenwick LLP（一家大型律所）、Tony James、Jeff Hammes 和 Fenwick
              LLP。“投资人即客户”构成少见的战略护城河：客户有财务动机确保 Norm Ai 成功，Norm Ai 也能结构性洞察客户工作流，并把这种洞察反馈进产品开发。


              截至报告日期，EDGAR 系统未找到 Norm AI, Inc. 的 SEC Form D 文件。公开资料也未披露债务融资额度或二级交易。
