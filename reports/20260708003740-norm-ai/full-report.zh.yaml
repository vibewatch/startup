  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块
        blocks:
          - type: paragraph
            body: >-
              Norm Ai 现在把自己呈现为受监管法律工作的三段式操作系统。第一层是 Norm Technology 平台，核心引擎是 LEAP，即法律工程自动化平台；Crunchbase 和 Norm
              自身法律工程材料都把它描述为自有工具，律师通过它把法规、政策和工作流转成 AI 智能体。这些智能体并非通用聊天机器人。公开材料反而将其定位为领域特定系统：由法律工程师在客户部署前搭建、校准并测试。第二层是
              Supervisory AI，Norm 将其描述为依法运行的 AI 智能体的验证层，也是受监管企业在内部工作流部署 AI 时不断增长的产品类别。第三层是 Norm Law
              LLP，这家关联但形式上分离的律所把整套堆栈用于真实法律服务交付。


              三个模块之间的互动，才是公司的差异点。法律工程师在 LEAP 中搭建可复用的决策架构，Supervisory AI 把这些控制打包成监督用例，Norm Law
              律师则在真实事项中使用并打磨同一套底层智能体基础设施。公开案例显示，它覆盖的范围远超单一法律细分场景。Norm 把这套堆栈推向 Prudential 的营销审查、机构管理人的 DDQ 和 RFP
              填写、Microsoft 365 Copilot
              内的合规检查，以及面向资产管理公司和私募资本客户的外部律师工作。这种宽度很重要，因为它说明产品交付更像可配置的法律合规底座，而不是点状解决方案。它也意味着产品成熟度不能只看软件
              UX。真正的产品，是编码规则系统、工作流智能体、人工审查层，以及能生成新先例的律所运营闭环的组合。
