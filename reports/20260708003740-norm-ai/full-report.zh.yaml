      - number: '8.5'
        title: 投资论点破裂点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              投资论点主要有三种破裂方式。第一是监管隔离。如果律师协会规则或所有权约束迫使 Norm Ai 与 Norm Law 的关系弱于投资者预期，全栈法律 AI
              溢价可能消失。第二是商业化失望。如果具名激活、推荐电话或续约数据无法支撑公司重信号的公开叙事，估值论点会立刻变弱。第三是经济结构。如果软件主要只是切入律师主导服务的楔子，而不是可扩张收入核心，利润率和终局倍数就应远比
              Harvey 式软件估值更接近法律服务基准。


              因此，最终尽调要求不是泛泛而谈。收入质量、客户激活深度、法律结构、董事会与 term sheet
              经济性，以及按收入流拆分的单位经济性，是清除本轮价格的最低材料包。拿不到这些答案的投资者不应依赖公开叙事动能。拿得到答案的投资者也许会发现，最重要的判断不是当前具体倍数，而是 Norm
              是否已经从令人印象深刻的概念跨入耐久平台。本章最终尽调清单就是为了把这个定性问题转成有负责人和时间表的具体尽调清单。
