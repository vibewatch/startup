            body: >-
              集中度和治理是本章最尖锐的客户风险。Norm Ai 称客户基础代表超过 30 trillion AUM，但具名证据集相对于这个标题数字很小。按官方 AUM 数据，Blackstone 与 Bain Capital
              Ventures 合计只占已披露规模约 1.21 trillion，公开证据中仍有约 28.79 trillion
              处于匿名状态。也就是说，市场无法判断采用到底覆盖众多机构，还是高度集中在少数超大型金融客户。具名关系还带来复杂利益冲突，因为 Blackstone 和 Bain Capital Ventures
              同时是投资者、客户和背书账户。它们的背书有价值，但这些身份也会模糊产品优先级设定、定价独立性和法律服务中立性的观感。Rule 5.4
              和技术许可结构处理了形式所有权问题，却不能替代强有力的关联方治理。管理层披露更细的客户清单之前，集中度风险应视为未解，而不是微不足道。
