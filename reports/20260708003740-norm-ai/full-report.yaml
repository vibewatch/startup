        title: Scale, Metrics, and Key Milestones
        blocks:
          - type: paragraph
            body: |
              Norm Ai's primary disclosed traction metric as of July 2026 is that its clients collectively
              represent more than $30 trillion in combined assets under management. This figure appears in
              the company's official July 2026 press release and is repeated verbatim by investors Khosla
              Ventures and Blackstone in their public statements, lending it some third-party corroboration.
              However, the named client list is limited: confirmed names are Blackstone and Bain Capital Ventures
