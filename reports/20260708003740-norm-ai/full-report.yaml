      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Norm's buyer map is more complex than a standard legal-software sale because its product family spans
              software, supervisory controls, and AI-native legal-service delivery. In banks, the likely initial sponsor
              for compliance-heavy workflows is the Chief Compliance Officer or Chief Risk Officer, especially when the
              use case touches surveillance, policies, or AI governance. In asset managers, hedge funds, and insurers,
              the General Counsel can become the initial sponsor when the workflow looks more like document review,
              marketing review, or outside-counsel replacement. The daily users are then lawyers, compliance analysts,
              risk staff, and legal engineers who turn policy into repeatable review logic.


              Budget ownership depends on which part of the stack is being sold. Supervisory AI and policy automation
              fit enterprise software or risk-technology budgets. Norm Law-like service delivery can pull from
              outside-counsel or ALSP budgets. That distinction matters because it widens the revenue pool but also
              complicates procurement. The most plausible adoption path is land-and-expand: start with one painful
              workflow, prove cycle-time reduction and auditability, then broaden into adjacent review tasks or into
              supervisory AI. Blackstone and Bain Capital Ventures are important public examples because they show how
              influential institutional sponsors can accelerate adoption once trust exists. The same evidence also
              reinforces why financial services is the logical beachhead: large budgets, repetitive high-stakes text
              workflows, and severe downside for legal or compliance error.
