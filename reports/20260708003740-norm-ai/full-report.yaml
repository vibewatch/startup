      - number: '2.4'
        title: Growth drivers, adoption constraints, and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The demand case is real. Thomson Reuters data shows that legal AI adoption is no longer hypothetical, with
              more than half of legal professionals already using generative AI and a large majority of corporate legal
              departments planning adoption in 2025 to 2026. For regulated financial institutions, legal and compliance
              workflows are especially attractive because the underlying burden grows with regulation, product
              complexity, and the spread of AI into business operations. Every additional AI system deployed by a bank
              or asset manager increases the need for supervisory controls that can test whether those systems stay
              inside legal and policy guardrails.


              The constraints are equally real. Trust and hallucination risk remain binding because bad output can
              create regulatory, contractual, or fiduciary exposure. Rule 5.4 and similar professional-conduct limits
              complicate any model that blends software economics with legal-service delivery. Switching costs are high
              because judgment is embedded in counsel relationships, playbooks, and legacy review processes. Budget
              silos also slow adoption because legal, compliance, risk, and business sponsors must all agree on ROI.
              These constraints make valuation sensitive to proof of deployment quality, not just to category size.


              The biggest diligence gaps remain private. Public disclosures do not provide customer count, pricing,
              segment mix, or retention; they also do not show how much of the $30 trillion AUM footprint is active paid
              deployment rather than relationship signal. Public market estimates also mix software, services, and
              labor. That is why the market chapter can defend a range of sizing lenses but cannot defend a precise
              public SOM today.
