      - number: '4.2'
        title: Unit economics and sales-efficiency hypotheses
        blocks:
          - type: paragraph
            body: >-
              Because Norm Ai is private and still early in its commercial scaling, nearly every critical unit-economics
              metric has to be inferred rather than observed. Public sources disclose no ARR, revenue, CAC, payback,
              churn, NRR, or customer concentration schedule. What is visible is the shape of the model. Norm sells to
              very large financial institutions, uses senior legal and regulatory talent inside product delivery, and
              increasingly cross-sells between software and legal services. That combination usually implies expensive
              account acquisition but potentially very large lifetime value if a client expands across workflows,
              practice areas, and legal-service categories.


              Gross margin is the hardest judgment. The platform should be more software-like than a classic consulting
              business, which supports a 60–80% platform gross-margin hypothesis if model-inference costs and
              implementation overhead stay controlled. Norm Law should be lower margin because practicing attorneys and
              partners remain core delivery inputs even if AI removes first-pass work; a 30–50% service-margin range is
              more plausible than true SaaS economics. If platform revenue becomes the larger share, a 45–65%
              blended-margin outcome is conceivable. If legal services dominate, the blended margin could sit lower and
              look more like a premium ALSP than a pure software company.


              The deeper issue is that the dual model can help LTV while obscuring comparability. Cross-selling Leap,
              Supervisory AI, and Norm Law into the same enterprise account may improve wallet share and account
              stickiness, but it also muddies whether growth is coming from recurring software, one-off matters, or
              related-party shaped deployments. Underwriting therefore depends less on the idea that the economics could
              be attractive and more on management’s ability to separate them cleanly in diligence.
