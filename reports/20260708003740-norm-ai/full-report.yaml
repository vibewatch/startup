      - number: '1.5'
        title: Regulatory and Structural Distinctiveness
        blocks:
          - type: paragraph
            body: |
              Norm Ai's dual structure creates material regulatory complexity. Under ABA Model Rule 5.4,
              lawyers are prohibited from sharing legal fees with non-lawyers, and non-lawyers are prohibited
              from owning equity interests in law firms that practice law. Rule 5.4(d) states explicitly that
              a lawyer "shall not practice with or in the form of a professional corporation or association
              authorized to practice law for a profit, if a nonlawyer owns any interest therein." This rule,
              adopted in most U.S. states, would directly prohibit Norm AI, Inc. from owning or controlling
              Norm Law LLP if the firm practices law for profit.

              The company has not publicly disclosed the legal ownership structure of Norm Law LLP or how
              it navigates state bar rules in jurisdictions where it serves clients. The typical approach for
              law firms affiliated with technology companies involves complex structural separation (such as
              cooperative or referral models rather than direct ownership), which can constrain operational
              integration and financial consolidation.

              Outcome-based pricing at Norm Law also raises bar rule questions: in most jurisdictions,
              contingency fees (where compensation depends on outcome) are permitted in some contexts
              (e.g., personal injury) but restricted or prohibited in others (e.g., criminal cases, certain
              corporate matters). If "outcome" pricing is characterized as contingency-based, additional
              bar compliance issues arise. LawNext has explicitly flagged this dual-entity structure as
              creating "a different regulatory and liability profile" from pure SaaS competitors.

              Taken together, these regulatory complexities are not merely hypothetical: they could limit
              Norm Ai's ability to expand across jurisdictions, require structural reorganization, or attract
              bar association scrutiny that is material to investment risk. They also represent a competitive
              moat — the complexity of the model creates high barriers for new entrants.
            claimRefs:
              - CO027
              - CO028
              - CO029
              - CO030
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Norm Ai is not selling into the whole legal-technology market just because it uses lawyers and AI. Its
              core wedge is narrower: software and services that encode legal and compliance obligations into workflows
              used by regulated financial institutions. The company itself describes the buyer set as global banks,
              hedge funds, insurance companies, and asset managers, and describes the product layer as agentic law plus
              supervisory AI for high-stakes work. That means the relevant spend is not courtroom software, consumer
              legal apps, or broad law-firm back-office tooling. It is the slice of spend tied to policy interpretation,
              control testing, document review, AI governance, and outside-counsel substitution inside regulated
              institutions.


              The closest adjacent buckets are legal tech, regtech or compliance automation, and alternative legal
              services. Broad legal tech is the outer TAM lens because it captures software budgets for legal workflow
              digitization. Compliance automation is the closer operational lens because it maps more directly to the
              review, surveillance, and policy-enforcement jobs Norm wants to automate. ALSPs and outside counsel matter
              because Norm Law suggests some spend may migrate from service budgets instead of software budgets.
              Status-quo substitutes therefore include in-house legal and compliance teams, outside counsel, ALSPs,
              legacy rules engines, and general-purpose copilots added onto existing systems. Those substitutes matter
              for valuation because they imply Norm competes for labor and service budgets as much as for standalone
              SaaS line items.
