      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: |
              John Nay is Norm Ai's founder and CEO. His profile sits at an unusually deep intersection of AI
              research, legal scholarship, and institutional finance. From approximately 2016 to 2022 he was a
              fellow at Stanford's CodeX (Center for Legal Informatics), where he built the conceptual and
              technical foundations of what he calls agentic law. Prior to Norm Ai, he founded Brooklyn
              Investment Group, an AI-powered investment platform that was acquired by TIAA Nuveen — one of the
              institutional asset managers that has since invested in and become a client of Norm Ai. He also
              taught what has been described as the first AI course at NYU School of Law, establishing academic
              credibility in the AI-and-law intersection that is central to Norm Ai's positioning.

              Norm Law LLP is chaired by Mike Schmidtberger, former Chairman of the Executive Committee of
              Sidley Austin — one of the world's largest law firms. Schmidtberger joined in January 2026.
              Norm Law's partnership also includes the former Global Head of Real Estate at Sidley Austin,
              a senior M&A partner from Ropes & Gray, and the General Counsel from Bain Capital Ventures,
              as well as attorneys drawn laterally from Kirkland & Ellis, Simpson Thacher, Paul Weiss,
              Davis Polk, Skadden, Cleary Gottlieb, Latham & Watkins, Paul Hastings, Proskauer, and Pillsbury.

              Individual investors serving as strategic advisors include Tony James (former President, COO, and
              Executive Vice Chairman of Blackstone), Jeff Hammes (former Chairman of Kirkland & Ellis),
              Henry R. Kravis (KKR co-founder), and Marc Benioff (Salesforce CEO). The presence of these
              figures signals credibility with the ultra-high-end institutional buyer community.

              Key-person risk is concentrated heavily in John Nay, whose academic reputation, institutional
              relationships, and public identity as the architect of agentic law underpin brand, product, and
              client acquisition. Specific C-suite titles below Nay (CTO, CFO, CPO) have not been publicly
              disclosed as of the report date, which is an operational governance gap for external observers.
