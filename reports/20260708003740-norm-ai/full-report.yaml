              Bain Capital Ventures are investors, customers, and reference accounts. Their endorsements are valuable,
              but those same roles can blur product-priority setting, pricing independence, and the optics of legal
              service impartiality. Rule 5.4 and the technology-licensing structure address formal ownership issues,
              yet they do not remove the need for strong related-party governance. Until management discloses a more
              granular customer schedule, concentration risk should be treated as unresolved rather than de minimis.
