      - number: '7.4'
        title: Mitigation and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Norm is still financeable if the company can prove that legal structure, supervision, privacy controls,
              and vendor resiliency are stronger than what public materials reveal today. The core mitigation asks are
              straightforward: a bar-compliance memorandum, entity-structure diagram, admissions matrix, malpractice and
              cyber coverage summary, model-provider contract terms, conflict-management protocols for investor-clients,
              and a founder-succession plan. The problem is that the downside is nonlinear. If a state bar challenges
              ownership or supervision, Norm may need to restructure the entity model before it can scale. If a
              high-profile AI error harms a client, the same event can trigger malpractice exposure, confidentiality
              review, customer-trust erosion, and slower future sales. If John Nay departs, or if the model-provider
              stack becomes unavailable or uneconomic, execution can stall before the company has enough disclosed
              operating proof to support the valuation on fundamentals alone. For that reason, the investment should be
              treated as non-viable if one of a small set of thesis-break events occurs without a pre-committed
              mitigation path already in hand.
