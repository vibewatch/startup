  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Norm's primary risk is that its differentiated model may sit directly in the gap between what
              venture-backed software companies want to control and what U.S. professional-conduct rules let law firms
              do. ABA Rule 5.4 bars fee sharing with nonlawyers and bars nonlawyer ownership or control of a law firm's
              professional judgment, while Rule 5.5 limits practice across jurisdictions without the right admissions or
              supervision. Norm publicly says that Norm Law is an affiliated AI-native law firm running on the Norm
              platform, but the reviewed public materials do not disclose the exact ownership agreement, the
              jurisdiction-by-jurisdiction bar-admission map, or the internal supervision protocol that keeps agent
              output inside licensed-lawyer boundaries. Arizona and Utah show that exceptions can exist under licensed
              ABS or sandbox regimes, and the UK ABS regime shows that some foreign jurisdictions are more flexible, but
              those carve-outs prove the opposite of what a bull case would want: outside limited regimes, the default
              rule still requires structural separation and licensed-human control. The securities angle compounds the
              problem because Investor.gov and FINRA both describe regulated boundaries around compensated securities
              advice and AI supervision. If Norm's workflow drifts from compliance tooling into compensated legal or
              investment advice without clear regulatory positioning, legal risk can move from theoretical to
              existential very quickly.
            claimRefs:
              - CR001
              - CR002
              - CR003
