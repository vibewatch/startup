              Revenue, ARR, unit economics, headcount (technology company + Norm Law LLP combined), and
              geographic deployment details have not been disclosed. These represent material evidence gaps
              for valuation underwriting. The Series C proceeds will fund continued hiring of senior attorneys
              and AI engineers, expanded practice area coverage at Norm Law, and development of supervisory AI
              agents for enterprise deployments.

              The company's key milestones across founding, financing, product, and regulatory dimensions
              span less than three years and include formalization of Legal Engineering (July 2024), the $48M
