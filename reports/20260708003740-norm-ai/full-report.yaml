      - number: '3.4'
        title: Moat Durability, Risks, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Norm's moat is real but conditional. The strongest barrier is structural: public sources do not show
              another rival combining supervisory AI, affiliated outside counsel delivery, and outcome-priced execution
              in one stack, and ABA Rule 5.4 makes that sort of integration harder to replicate quickly in many U.S.
              jurisdictions. That same complexity is also a risk, because portability, bar compliance, and procurement
              comfort are not yet visible from public data. Competitive pressure is rising from three directions at
              once. Harvey shows that software-only players can still customize legal workflows and now overlaps with
              asset-management buyers. Microsoft can commoditize mid-complexity review and regulatory tasks through
              suite bundling. Thomson Reuters and Anthropic can narrow Norm's edge in research, drafting, and trusted AI
              outputs without copying the legal-service piece. The right diligence posture is therefore operational, not
              just thematic: ask for actual win-loss data by competitor class, revenue mix between software and Norm
              Law, attachment and renewal for supervisory AI, and the exact jurisdictions and legal opinions that
              support Norm Law's current structure. Several third-party URLs already in the fetch log now resolve to
              404, anti-bot, or rate-limit screens, so independent corroboration is thinner than ideal and should be
              refreshed through licensed databases during diligence.
