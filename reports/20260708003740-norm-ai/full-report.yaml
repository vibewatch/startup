chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: |
              Norm AI, Inc. — marketed externally as "Norm Ai" — was incorporated and operationally launched
              in July 2023 and is headquartered in New York, New York. Crunchbase classifies it under Artificial
              Intelligence, Compliance, and Legal Tech. The company's founding thesis, rooted in more than six
              years of academic research by CEO John Nay at Stanford's CodeX Center for Legal Informatics,
              is that legal and regulatory rules can be systematically encoded into AI agents — a model the
              company calls "agentic law."

              Norm Ai's business is built around two integrated but legally distinct entities. The first is
              the Norm Ai technology platform, whose centerpiece is Leap (Legal Engineering Automation Platform),
              a proprietary system that enables "Legal Engineers" — non-practicing attorneys trained by Norm Ai —
              to translate complex legal judgments directly into functional AI agents using large language models.
              On top of Leap sits Supervisory AI, a governance layer that monitors other AI agents operating
              in regulated environments (for example, AI advisors providing investment or medical recommendations)
              to check that those agents stay within legal and regulatory bounds.

              The second entity is Norm Law LLP, an affiliated AI-native law firm that runs natively on Norm Ai's
              platform. Norm Law provides outside legal counsel to institutional clients. Unlike traditional law
              firms that bill by the hour, Norm Law prices services based on outcomes, allowing AI-driven
              efficiency gains to accrue directly to clients rather than to the firm's billing model. Senior
              attorneys supervise and improve the AI agents rather than managing associate pyramids.

              This combined architecture — technology platform plus AI-native law firm — is described by the
              company as the "full-stack model for legal AI." It distinguishes Norm Ai from competitors such as
              Harvey AI (which sells software tools to law firms) and Legora (which focuses on legal research
              for law firms), because Norm Ai both licenses technology to enterprise legal and compliance teams
              AND performs legal work for those same enterprises. Norm Ai's focus is financial services: global
              banks, hedge funds, insurance companies, and asset managers representing over $30 trillion in AUM.
