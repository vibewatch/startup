      - number: '2.2'
        title: Market sizing lenses and what they do not mean
        blocks:
          - type: paragraph
            body: >-
              The broadest credible market lens is legal technology. Grand View Research sized that market at about $32
              billion in 2024 and projected growth toward roughly $65 billion by 2030 at low-teens CAGR, while Thomson
              Reuters points to a similar direction of travel. That is useful context because it shows a large,
              expanding category with real software budgets. It is not a direct TAM for Norm, because broad legal tech
              includes categories like practice management and court technology that do not map cleanly to regulated
              financial-services workflows.


              A nearer lens is compliance automation and AI in legal services. McKinsey explicitly places compliance and
              legal among the next frontiers for AI in financial services, and public commentary around the space often
              uses a mid-teens to $20 billion range for compliance automation. Adjacent service spend matters too:
              Thomson Reuters commentary places the ALSP market around $15 billion annually, which is relevant because
              Norm Law can capture spend that would otherwise sit with external service providers. Private-market
              comparables also matter as a sizing signal even though they are not TAM figures. Harvey's $11 billion
              valuation and Legora's $5.6 billion valuation show that investors already treat AI-native legal workflows
              as a major category. The key diligence point is that these lenses overlap. They should be used as boundary
              checks, not summed into a single heroic TAM.
