            body: |-
              Concentration and governance are the sharpest customer risks in the chapter. Norm Ai says its client base
              represents more than 30 trillion in AUM, but the named proof set is tiny relative to that headline. Using
              official AUM figures, Blackstone and Bain Capital Ventures together account for only about 1.21 trillion
