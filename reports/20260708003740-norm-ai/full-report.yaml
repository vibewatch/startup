      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Capital access is the strongest part of Norm Ai’s public financial profile. The company raised $48 million
              in March 2025, added another $50 million from Blackstone when it launched Norm Law in November 2025, and
              then closed a $120 million Series C at a $1.2 billion valuation on July 7, 2026. Company statements say
              lifetime capital raised now exceeds $260 million. Just as important, $170 million of that was raised
              within roughly eight months around the Norm Law launch, which implies investors were willing to keep
              funding the broader full-stack strategy rather than only the original compliance-software thesis.


              What remains opaque is the cash bridge. Public sources do not disclose cash on hand, monthly burn, debt
              obligations, or capex commitments. The evidence does suggest that burn is mainly people-led: hiring senior
              attorneys, legal engineers, AI engineers, and new practice-area teams, rather than building a
              capital-intensive physical asset base. That makes a $30–50 million annual burn hypothesis reasonable for
              planning purposes, although it is still a hypothesis. On that range, the $120 million Series C alone
              covers roughly 29–48 months of gross burn before considering any remaining cash from earlier rounds. A
              more conservative underwriting interpretation is about 24–36 months of practical runway once hiring
              accelerates.


              That is probably enough time to test whether Norm can scale the platform, prove repeatable legal-services
              delivery, and turn Supervisory AI into a broader budget line. It is not enough to eliminate financing
              dependency altogether. The next round, if needed, will likely hinge on whether management can show clean
              software revenue quality and that Norm Law expands beyond anchor-account collaboration into repeatable,
              multi-client economics.
