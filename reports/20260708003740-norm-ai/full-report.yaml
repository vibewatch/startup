        - items:
            - label: Compliance reviewers
              detail: Human reviewers approve, reject, or adjust outputs with audit visibility
            - label: Norm Law attorneys
              detail: Licensed lawyers supervise AI-native legal work and provide formal advice
          label: Human Supervision
          detail: Licensed or compliance-qualified humans who approve edge cases and formal advice.
        - items:
            - label: External frontier models
