      - number: '3.2'
        title: Incumbent and Adjacent Providers
        blocks:
          - type: paragraph
            body: >-
              Norm also faces a broader set of incumbents and adjacent substitutes than the startup-vs-startup framing
              implies. Microsoft has already published legal-specific Copilot workflows for contract review, automated
              review agents, litigation support, and regulatory work, then layers those use cases inside Microsoft 365
              permissions, retention, and security tooling that many enterprises already buy. Thomson Reuters is even
              more important as an incumbent because CoCounsel, Westlaw, and Practical Law combine AI workflows with
              trusted legal content and long-established buyer relationships across firms, corporations, and government.
              Practical Law's 650-plus attorney-editors and more than 118,000 resources create real switching cost. On
              the adjacent-services side, Axiom, EY, and Elevate compete for the same outcome the buyer wants — lower
              outside-counsel spend and faster execution — but deliver it through on-demand talent, managed services,
              contracting operations, and workflow automation rather than through Norm's more integrated
              legal-engineering thesis. Anthropic adds another threat path at the model layer by enabling partners and
              customers to build legal workflows without becoming a legal-services vendor itself.
