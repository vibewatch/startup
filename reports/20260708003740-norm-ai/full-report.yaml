      - number: '8.2'
        title: Comparable Set and Multiple Context
        blocks:
          - type: paragraph
            body: >-
              The comparable set divides into three very different buckets. First are frontier legal-AI winners such as
              Harvey and Legora. Harvey’s disclosed March 2026 financing at $11 billion and later Forbes-cited $190
              million ARR imply a revenue multiple around the high-50s, showing that the market will support extremely
              rich marks for platforms with visible adoption proof. Legora’s $5.6 billion valuation shows the same
              appetite extends beyond U.S. incumbents, even for a narrower workspace-oriented model. Second are mature
              legal-information incumbents such as Thomson Reuters. Using public market-cap and revenue data, Thomson
              Reuters trades at only a mid-single-digit revenue multiple, highlighting how quickly valuation compresses
              once growth moderates and public-market comparability takes over.


              Third are legal-services and ALSP benchmarks. Thomson Reuters sizes the ALSP market at $28.5 billion and
              shows rising corporate-law-department adoption, but disclosed private-market marks for Axiom, Elevate, or
              EY Law are not publicly available. The closest observable legal-services transaction data points to
              low-single-digit revenue multiples, with BizBuySell’s legal-services benchmark clustering around 0.4x to
              1.0x revenue. That benchmark is not a perfect ALSP comp, but it is directionally useful. It says that if
              Norm behaves more like tech-enabled services than frontier software, the current valuation is hard to
              support. The entire debate therefore turns on which bucket Norm will actually resemble over the next two
              years.
            claimRefs:
