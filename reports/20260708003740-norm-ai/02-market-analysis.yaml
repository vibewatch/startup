chapter:
  number: 2
  title: Market Analysis
  summary: Norm Ai targets the overlap of broad legal technology, narrower compliance automation, and AI-enabled legal services for large financial institutions. The outer legal-tech market is roughly $32 billion in 2024 and can approach $65 billion by 2030, but the more relevant underwriting lenses are a mid-teens-to-$20 billion compliance-automation proxy and an adjacent ~$15 billion ALSP services pool. Adoption is supported by strong legal-AI usage growth and comparable multi-billion-dollar financings, but trust, switching cost, bar-rule constraints, and missing deployment data still prevent a clean public SOM estimate.
sections:
- id: s1
  title: Market boundary, adjacencies, and substitutes
  body: |-
    Norm Ai is not selling into the whole legal-technology market just because it uses lawyers and AI. Its core wedge is narrower: software and services that encode legal and compliance obligations into workflows used by regulated financial institutions. The company itself describes the buyer set as global banks, hedge funds, insurance companies, and asset managers, and describes the product layer as agentic law plus supervisory AI for high-stakes work. That means the relevant spend is not courtroom software, consumer legal apps, or broad law-firm back-office tooling. It is the slice of spend tied to policy interpretation, control testing, document review, AI governance, and outside-counsel substitution inside regulated institutions.

    The closest adjacent buckets are legal tech, regtech or compliance automation, and alternative legal services. Broad legal tech is the outer TAM lens because it captures software budgets for legal workflow digitization. Compliance automation is the closer operational lens because it maps more directly to the review, surveillance, and policy-enforcement jobs Norm wants to automate. ALSPs and outside counsel matter because Norm Law suggests some spend may migrate from service budgets instead of software budgets. Status-quo substitutes therefore include in-house legal and compliance teams, outside counsel, ALSPs, legacy rules engines, and general-purpose copilots added onto existing systems. Those substitutes matter for valuation because they imply Norm competes for labor and service budgets as much as for standalone SaaS line items.
