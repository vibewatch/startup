  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: aum deployment quality
    missingEvidence: A breakdown of the $30T+ client AUM figure into active paid deployments, pilot accounts, and investor-relationship logos.
    whyItMatters: The disclosed AUM base proves prestige but not how much spend is monetized today, which directly affects realistic SOM underwriting.
    diligencePath: Request customer list segmentation, deployed workflow count, and current ACV by client cohort under NDA.
    relatedQuestionRefs:
    - QM026
  - type: conflicting-data
    severity: material
    topic: compliance spend mix
    missingEvidence: A source-backed breakdown of financial-services compliance spend into software, personnel, and external legal or consulting services.
    whyItMatters: Without a cost-stack split, diligence can overstate software TAM by comparing labor-heavy compliance economics with vendor software markets.
    diligencePath: Use budget disclosures, procurement datasets, or expert interviews with bank and asset-manager compliance leaders to separate software from people spend.
    relatedQuestionRefs:
    - QM027
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: pilot conversion roi
    missingEvidence: Pilot-to-production conversion rates, payback periods, time-saved metrics, and renewal evidence for legal AI in regulated financial-services environments.
    whyItMatters: Adoption timing and valuation depend on whether regulated buyers move from experimental workflows to durable enterprise contracts.
    diligencePath: Request customer case studies, ROI analyses, and cohort retention data from Norm management and from independent reference calls.
    relatedQuestionRefs:
    - QM028
  - type: enumeration-incomplete
    severity: minor
    topic: tAM and SAM lens overlap
    missingEvidence: A published taxonomy that cleanly reconciles legal tech, compliance automation, and ALSP categories without double counting overlap.
    whyItMatters: Analyst reports use different scope definitions, so outer TAM and nearer SAM proxies cannot be combined mechanically.
    diligencePath: Rebuild the sizing stack from bottom-up workflow budgets after management discloses target use cases and pricing.
    relatedTableRefs:
    - TM001
    - TM002
