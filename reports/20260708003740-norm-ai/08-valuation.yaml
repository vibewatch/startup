- id: s-thesis-breaks
  title: Thesis Breaks and Final Diligence Asks
  body: |-
    The thesis breaks in three main ways. First, regulatory separation. If bar-rule or ownership constraints force a weaker relationship between Norm Ai and Norm Law than investors expect, the full-stack legal AI premium could evaporate. Second, commercialization disappointment. If named activations, reference calls, or renewal data do not support the company’s signaling-heavy public narrative, the valuation case weakens immediately. Third, economic mix. If software is mostly a wedge into attorney-led services rather than a scalable revenue core, margins and terminal multiples should look far closer to legal-services benchmarks than to Harvey-like software marks.

    That is why the final diligence asks are not generic. Revenue quality, client activation depth, legal structure, board and term-sheet economics, and stream-by-stream unit economics are the minimum package required to clear the round price. Investors who cannot get those answers should not rely on public narrative momentum. Investors who can get them may find that the most important judgment is not the exact current multiple, but whether Norm has already crossed from impressive concept into durable platform. The chapter’s final ask list is designed to turn that qualitative question into a concrete diligence checklist with owners and timelines.
