    severity: blocking
    topic: norm-law-structure
    missingEvidence: Legal structure memos, jurisdiction map, fee-sharing analysis, and ownership diagram for Norm Law.
    whyItMatters: Bar-rule failure could force separation, cap upside, or trigger a major valuation reset.
    diligencePath: Obtain outside counsel memo on Rule 5.4 compliance plus entity chart and state-by-state operating analysis.
