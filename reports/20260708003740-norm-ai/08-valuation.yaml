- id: s-scenarios
  title: Bull, Base, and Bear Scenarios
  body: |-
    The scenario math is straightforward even if the inputs are private. In the bull case, Norm proves that its legal-engineering layer and affiliated law-firm model create a true platform advantage. That means activated flagship accounts, repeatable software revenue, high attachment of supervisory AI, and margin structure that looks better than a normal services business. Under those conditions, the current round can look cheap in hindsight. In the base case, the company is real and important but still early — strong product-market pull, meaningful ARR, and enough differentiation to keep a premium multiple, but not yet enough proof to merit Harvey-like exuberance. In that scenario, the current price is defensible but tight.

    The bear case is not company goes to zero. It is that the market eventually values Norm by what it can verify. If legal-structure complexity slows expansion, if revenue turns out to be services-heavy, or if the $30 trillion AUM footprint proves much more relationship-oriented than revenue-oriented, investors could compress Norm toward legal-services or mixed-model benchmarks. That would create a painful markdown even if the business continues to operate and grow. The key scenario lesson is that the spread between upside and downside is driven mostly by commercialization quality and structural clarity, not by whether legal AI is an attractive market in the abstract.
