- id: s-recommendation
  title: Recommendation and Confidence
  body: |-
    For an institutional investor, the right public-evidence recommendation is conditional positive with medium confidence and a high risk rating. The positive side of the case is unusually strong for such a young company: top-tier investor validation, strategic relevance to regulated financial institutions, a structurally differentiated model, and a plausible path to becoming the control layer for AI in high-stakes legal workflows. The negative side is equally real: there is still no disclosed ARR, no public margin profile, no retention data, no visible cap-table economics, and unresolved legal-structure questions around Norm Law. That combination means the quality of the company may be high while the certainty of the valuation is still modest.

    Institutional investors should therefore treat the round less like a clean growth-equity underwriting and more like an access-dependent venture decision. If management can show that the platform is already generating premium software-like revenue with strong retention, the current price can be accepted and perhaps even viewed as attractive relative to future upside. If management cannot show that, the recommendation should move quickly from conditional positive to pass. Put differently, the investment case is not buy because legal AI is hot. It is consider investing only if private diligence proves that Norm is becoming a scalable platform company with legal-services optionality rather than an expensive, regulation-exposed services experiment.
