  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-revenue-mix
    missingEvidence: Board-level ARR, software-versus-services revenue mix, gross margin, and cohort retention.
    whyItMatters: Whether the round price is fair depends mostly on whether Norm behaves like premium software, premium services, or a blend.
    diligencePath: Request management financial model, latest monthly recurring revenue bridge, and last-twelve-month segment gross margin under NDA.
    relatedQuestionRefs:
    - QV006
    - QV022
    - QV024
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: client-activation-depth
    missingEvidence: Named active customers, ACV concentration, production deployments, and referenceable NPS or renewal data behind the $30T AUM claim.
    whyItMatters: A relationship signal without paid deployment depth would make the current valuation much harder to defend.
    diligencePath: Request top-20 customer list with ACV, activation stage, renewal dates, and two customer reference calls.
    relatedQuestionRefs:
    - QV003
    - QV021
    relatedTableRefs:
    - TV002
    - TV006
