- id: s-production-workflows
  title: Production Workflows and Real Adoption
  body: |-
    The strongest adoption evidence here is not logos but named workflows in production. Blackstone’s use
    case is described with unusual specificity: regulated content review inside the in-house legal and
    compliance function, followed by collaboration on Norm Law services. Bain Capital Ventures provides even
    cleaner dual-mode proof because its partner says the software powers internal regulated workflows while
    the law firm handles deal work. Norm Law’s own website adds a Blackstone Innovations testimonial about
    faster transaction document review, analysis, and drafting, which suggests use in live investment work
    rather than a marketing pilot. Beyond those two institutions, partner and investor sources describe the
    platform serving asset managers, broker dealers, insurance companies, and other financial institutions,
    especially for highly regulated content, agreements, and communications. That is enough to show real
    enterprise adoption in legal and compliance workflows, but not enough to prove broad logo count, volume,
    or customer diversification across the 30 trillion AUM base.
