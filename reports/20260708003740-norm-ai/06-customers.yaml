  - CU004
  - CU005
  - CU009
  - CU016
  - CU017
  - CU040
  - CU043
- id: FU002
  title: Adoption / deployment funnel
  type: flow
  layout: wide
  summary: A flow is more defensible than a numeric funnel because the public record shows stages of deployment but not reliable stage-to-stage conversion rates.
  data:
    nodes:
    - id: prospect
      label: Prospect
      detail: Regulated institution faces high-cost legal or compliance review and seeks automation without sacrificing trust.
    - id: strategic-entry
      label: Strategic entry point
      detail: Investor relationship, advisory-board tie, or product diligence creates a privileged route into senior decision-makers.
    - id: pilot-scope
      label: Workflow scoping
      detail: The first workflow is typically tightly scoped around content review, policy interpretation, or regulated communication.
    - id: in-house-go-live
      label: In-house go live
      detail: Blackstone and BCV provide evidence that Norm reaches live use in enterprise legal or compliance teams.
    - id: norm-law
      label: Norm Law layer
      detail: Some customers extend the relationship into outside counsel, especially for transactions or specialized regulatory matters.
    - id: expanded-account
      label: Expanded account
      detail: Practice-area growth and supervisory AI create paths to broader wallet share inside the same institution.
