company:
  name: Norm Ai
chapter:
  number: 6
  title: Customers
  summary: |-
    Norm Ai has unusually strong but narrow public customer proof. Blackstone and Bain Capital Ventures are
    both named investor-clients with workflow-level evidence across software deployment and, for Norm Law,
    outside-counsel usage. The major caveat is concentration visibility: the company’s 30 trillion AUM claim
    is far larger than the named proof set, leaving most customer exposure anonymous and making durability and
    conflict risk harder to underwrite from public evidence alone.
sections:
- id: s-named-customers
  title: Named Customers and Adoption Evidence
  body: |-
    Norm Ai’s public customer proof is narrow, but what exists is unusually strategic. The named users with
    direct workflow evidence are Blackstone and Bain Capital Ventures, and both are also investors. That is
    materially different from a typical startup customer list because it means the most visible commercial
    relationships sit at the intersection of product validation, financing support, and go-to-market signal.
    Blackstone is the clearest anchor account: independent and company-backed sources say Blackstone used
    Norm Ai inside its legal and compliance group for regulated content review, then expanded the relationship
    into co-developing Norm Law services for Blackstone’s use. Bain Capital Ventures is the second anchor:
    Matt Harris said Norm powers internal regulated workflows at Bain Capital and that Norm Law represents
    the firm in deals. By contrast, Vanguard, Citi, TIAA, and New York Life are clearly strategic investors
    and advisory-board participants, but the reviewed public record does not yet prove that they are paying
    clients. That asymmetry matters because the 30 trillion AUM claim is much larger than the named proof set.
  claimRefs:
  - CU001
  - CU003
  - CU007
  - CU010
  - CU011
  - CU030
  - CU031
  - CU032
