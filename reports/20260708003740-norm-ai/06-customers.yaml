  - FU004
- id: s-concentration-conflict
  title: Concentration and Investor Client Conflict Risks
  body: |-
    Concentration and governance are the sharpest customer risks in the chapter. Norm Ai says its client base
    represents more than 30 trillion in AUM, but the named proof set is tiny relative to that headline. Using
    official AUM figures, Blackstone and Bain Capital Ventures together account for only about 1.21 trillion
    of the disclosed scale, leaving roughly 28.79 trillion anonymous in public evidence. That means the market
    cannot tell whether adoption is broad across many institutions or highly concentrated in a few giant
    financial clients. The named relationships also create conflict complexity because both Blackstone and
    Bain Capital Ventures are investors, customers, and reference accounts. Their endorsements are valuable,
    but those same roles can blur product-priority setting, pricing independence, and the optics of legal
    service impartiality. Rule 5.4 and the technology-licensing structure address formal ownership issues,
    yet they do not remove the need for strong related-party governance. Until management discloses a more
    granular customer schedule, concentration risk should be treated as unresolved rather than de minimis.
