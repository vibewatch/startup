- id: s-durability-expansion
  title: Durability, Switching Cost, and Expansion Potential
  body: |-
    Public durability proof is qualitative rather than contractual, but it is directionally positive. The
    product is not presented as a generic legal chatbot; it is embedded into regulated workflows, maintained
    by legal engineers, and increasingly wrapped with outside-counsel services through Norm Law. That raises
    switching cost because a customer would have to replace both encoded workflow logic and attorney
    relationships. The Blackstone and Bain cases also suggest land-and-expand behavior: each relationship is
    visible across funding, software deployment, and a deeper service layer. Norm Law’s public buildout makes
    the upsell pathway more credible than a slide-deck concept. The website advertises more than 65 attorneys
    and legal engineers, while January and later partner hires expanded coverage into investment funds,
    private equity, venture capital, and private credit. What is missing is equally important. No reviewed
    public source discloses renewal terms, NRR, GRR, logo churn, or standard procurement duration, so the
    market can see relationship depth but cannot yet quantify retention quality.
  claimRefs:
  - CU016
  - CU017
  - CU018
  - CU019
  - CU023
  - CU024
  - CU025
  - CU040
  - CU041
  - CU043
  - CU049
