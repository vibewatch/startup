  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: An exhaustive roster or at least AUM-bucketed customer list for the institutions behind the 30 trillion AUM claim.
    whyItMatters: Without knowing who drives the disclosed AUM, investors cannot test concentration, true breadth, or whether adoption is dominated by a handful of related institutions.
    diligencePath: Request a customer roster or top-customer schedule grouped by institution type, AUM band, and whether the client buys software, Norm Law services, or both.
    relatedQuestionRefs:
    - QU001
    - QU006
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Gross retention, net retention, logo churn, renewal timing, and customer-count bridges for the platform and Norm Law.
    whyItMatters: The public record proves some expansion, but not the durability of base demand or the quality of recurring revenue.
    diligencePath: Request annual cohorts, renewal schedules, churn reasons, and customer-count bridges broken out by software-only, law-firm-only, and dual-product accounts.
    relatedQuestionRefs:
    - QU012
    - QU019
  - type: missing-source
    severity: material
    topic: strategic-investor-client-conversion
    missingEvidence: Direct confirmation of whether Vanguard, Citi, TIAA, and New York Life are paying clients, prospects, or only investors and advisors.
    whyItMatters: Those names materially affect the interpretation of expansion pipeline, concentration, and the credibility of the investor-as-customer thesis.
    diligencePath: Obtain reference calls, invoices, matter lists, or signed statements from each institution clarifying whether the relationship is investor-only or also commercial.
    relatedQuestionRefs:
    - QU007
    - QU024
  - type: missing-source
    severity: minor
    topic: client-geography
    missingEvidence: A customer geography map or jurisdiction breakdown for named and unnamed users.
    whyItMatters: Geography affects both concentration risk and the degree of bar-rule, privacy, and regulatory complexity in delivery.
    diligencePath: Ask management for client counts or revenue by domicile and for jurisdictions where Norm Law is actively serving clients.
    relatedQuestionRefs:
    - QU025
  - type: private-evidence-only
    severity: material
    topic: investor-client-governance
    missingEvidence: Board-recusal rules, related-party policies, pricing governance, and confidentiality controls for investor-clients using both software and legal services.
    whyItMatters: Dual-role clients can influence roadmap and economics in ways that affect minority investors or other clients, especially when legal services are involved.
    diligencePath: Request board materials, related-party policies, pricing authorities, and conflict-management memos covering investor-clients and Norm Law matters.
    relatedQuestionRefs:
    - QU026
