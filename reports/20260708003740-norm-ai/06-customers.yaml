- id: TU005
  title: Expansion and concentration risk table
  columns:
  - risk
  - description
  - evidence
  - severity
  - mitigation
  rows:
  - - blackstone concentration
    - Blackstone is the clearest named anchor and could represent outsized commercial weight even though revenue share is undisclosed.
    - Most detailed public proof belongs to Blackstone across deployment, collaboration, and testimonial evidence
    - high
    - Request top-customer schedule and cap any single-account exposure in diligence model
  - - anonymous 30T remainder
    - Most disclosed customer AUM remains unnamed, limiting any serious test of breadth or sector balance.
    - Only about 1.21T of the 30T claim is publicly attributable to named dual-role institutions
    - high
    - Request customer roster by AUM bucket and whether each account is software-only, law-firm-only, or both
  - - investor-client governance conflict
    - Dual-role clients can influence roadmap, pricing, and disclosure while also validating the business commercially.
    - Blackstone and BCV are investors, users, and reference accounts
    - high
    - Review board-recusal rules, pricing authorities, and related-party governance controls
  - - platform to Norm Law upsell
    - Upsell opportunity is real, but execution risk rises when software customers become legal-services clients with confidentiality and independence expectations.
    - Named examples at Blackstone and BCV plus practice-area buildout at Norm Law
    - medium
    - Test conflicts process, matter acceptance rules, and law-firm capacity planning
  - - practice-area expansion risk
    - Adding PE, VC, private credit, and regulatory practices can broaden wallet share but may stretch supervision and quality control.
    - Schmidtberger, Sorin, Rupe, and Mone hires expand scope quickly
    - medium
    - Track utilization, staffing ratios, and attorney review quality by practice area
  - - new-buyer-category expansion
    - Supervisory AI and additional enterprise deployments could open more sectors, but public proof still centers on financial institutions.
    - Series C proceeds target supervisory agents and broader regulated enterprise deployments
    - medium
    - Ask for pipeline by vertical and conversion from investor-adjacent institutions to independent third-party customers
  notes: The table combines opportunity and risk because the same features that create expansion potential also create concentration and governance sensitivity.
