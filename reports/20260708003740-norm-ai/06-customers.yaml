figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Norm’s strongest visible customer path starts with a regulated compliance problem, lands in an in-house workflow, and then expands into Norm Law or broader supervisory AI use.
  data:
    nodes:
    - id: awareness
      label: Awareness
      detail: Institution encounters Norm through investor networks, legal-tech coverage, or regulatory-compliance pain inside financial services.
    - id: evaluation
      label: Evaluation
      detail: Legal or compliance leaders test whether regulations, policies, and content-review tasks can be encoded into Norm workflows.
    - id: platform-land
      label: Initial platform land
      detail: Norm lands in an in-house legal or compliance workflow such as regulated content review or internal policy analysis.
    - id: production
      label: Production use
      detail: Named proof shows Blackstone and BCV using Norm in live legal and compliance work rather than in a vague pilot.
    - id: law-firm-upsell
      label: Norm Law engagement
      detail: The relationship can deepen into outside-counsel matters run through Norm Law for transactional or regulatory work.
    - id: ongoing-client
      label: Ongoing client
      detail: Expansion can continue through more practice areas, more institutional stakeholders, and supervisory AI deployments in other regulated workflows.
  approximationNotes: Stages are inferred from public customer proof and company workflow descriptions; no official sales-process diagram or conversion data is public.
  claimRefs:
