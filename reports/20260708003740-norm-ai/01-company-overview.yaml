  - id: s4
    title: Scale, Metrics, and Key Milestones
    body: |
      Norm Ai's primary disclosed traction metric as of July 2026 is that its clients collectively
      represent more than $30 trillion in combined assets under management. This figure appears in
      the company's official July 2026 press release and is repeated verbatim by investors Khosla
      Ventures and Blackstone in their public statements, lending it some third-party corroboration.
      However, the named client list is limited: confirmed names are Blackstone and Bain Capital Ventures
      (both investors). The identities of other institutions comprising the $30T+ AUM aggregate have not
      been publicly disclosed, making independent verification structurally impossible.

      Revenue, ARR, unit economics, headcount (technology company + Norm Law LLP combined), and
      geographic deployment details have not been disclosed. These represent material evidence gaps
      for valuation underwriting. The Series C proceeds will fund continued hiring of senior attorneys
      and AI engineers, expanded practice area coverage at Norm Law, and development of supervisory AI
      agents for enterprise deployments.

      The company's key milestones across founding, financing, product, and regulatory dimensions
      span less than three years and include formalization of Legal Engineering (July 2024), the $48M
      round from institutional investors (January 2025), the inaugural Central Park AI Forum co-convened
      with US Senators and regulators (September 2025), the Blackstone investment and Norm Law LLP
      launch (November 2025), the joining of Mike Schmidtberger as Norm Law chairman (January 2026),
      the launch of the Legal AGI Lab at Stanford (April 2026), and the unicorn-confirming Series C
      (July 7, 2026).
