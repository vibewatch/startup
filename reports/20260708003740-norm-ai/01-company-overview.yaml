  - id: s3
    title: Funding History and Capital Formation
    body: |
      Norm Ai has raised more than $260 million in total capital across multiple financing rounds since
      July 2023, representing rapid capital formation for a company not yet three years old. The company's
      funding trajectory reflects a deliberate strategy of anchoring investor relationships in its
      customer base: the majority of its investors are also direct clients.

      The pre-2025 funding history (implied seed and/or Series A) is not publicly disclosed. The first
      confirmed institutional round occurred in January 2025 and raised $48 million from Vanguard,
      Blackstone, Bain Capital Ventures, Citi, TIAA, and Coatue — all institutional asset managers or
      financial services firms that are among the types of clients Norm Ai targets. Crunchbase classifies
      this as a Series B, implying undisclosed earlier rounds. In November 2025, Blackstone made an
      additional strategic $50 million investment concurrent with the launch of Norm Law LLP, signaling
      deep strategic alignment between Blackstone's own legal AI ambitions and Norm Ai's model.

      The July 7, 2026 Series C raised $120 million at a $1.2 billion post-money valuation, led by
      Khosla Ventures — described as the first institutional investor in OpenAI — in its first investment
      in Norm Ai. Returning investors Blackstone, Bain Capital Ventures, Craft Ventures, Coatue, Vanguard,
      New York Life, and TIAA participated alongside first-time investors Fenwick LLP (a major law firm),
      Tony James, Jeff Hammes, and Fenwick LLP. The investor-as-client dynamic is an unusual strategic
      moat: clients have financial incentive to ensure Norm Ai succeeds, and Norm Ai has structural
      insight into client workflows that shapes product development.

      No SEC Form D filings for Norm AI, Inc. were found in the EDGAR system as of the report date.
      No public debt facilities or secondary transactions have been disclosed.
    claimRefs:
      - CO015
