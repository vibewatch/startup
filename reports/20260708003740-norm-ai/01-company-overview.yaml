company:
  name: Norm Ai
chapter:
  number: 1
  title: Company Overview
  summary: |
    Norm Ai (legal name Norm AI, Inc.) is a New York–based startup founded in July 2023 by John Nay
    that builds "agentic law" — embedding legal and regulatory reasoning directly into AI agents for
    institutional financial services clients. The company operates the Leap (Legal Engineering
    Automation Platform) technology platform and Norm Law LLP, the world's first AI-native affiliated
    law firm, which prices services on an outcome basis rather than hourly billing. On July 7, 2026,
    Norm Ai closed a $120 million Series C at a $1.2 billion valuation led by Khosla Ventures, bringing
    total capital raised to over $260 million since founding. Clients representing more than $30 trillion
    in combined AUM rely on the platform. Norm Law is chaired by Mike Schmidtberger, former chairman
    of Sidley Austin's executive committee, and staffed with lateral partners from Kirkland & Ellis,
    Simpson Thacher, Paul Weiss, Davis Polk, Skadden, Cleary Gottlieb, and Latham & Watkins. The
    company is structurally distinctive — simultaneously a legal tech vendor and, through Norm Law, a
    regulated legal services provider — a dual model that creates both competitive differentiation and
    heightened regulatory exposure under ABA Model Rule 5.4, which prohibits non-lawyer ownership of
    law firms in most U.S. jurisdictions.

sections:
  - id: s1
    title: Identity and Business Model
    body: |
      Norm AI, Inc. — marketed externally as "Norm Ai" — was incorporated and operationally launched
      in July 2023 and is headquartered in New York, New York. Crunchbase classifies it under Artificial
      Intelligence, Compliance, and Legal Tech. The company's founding thesis, rooted in more than six
      years of academic research by CEO John Nay at Stanford's CodeX Center for Legal Informatics,
      is that legal and regulatory rules can be systematically encoded into AI agents — a model the
      company calls "agentic law."

      Norm Ai's business is built around two integrated but legally distinct entities. The first is
      the Norm Ai technology platform, whose centerpiece is Leap (Legal Engineering Automation Platform),
      a proprietary system that enables "Legal Engineers" — non-practicing attorneys trained by Norm Ai —
      to translate complex legal judgments directly into functional AI agents using large language models.
      On top of Leap sits Supervisory AI, a governance layer that monitors other AI agents operating
      in regulated environments (for example, AI advisors providing investment or medical recommendations)
      to check that those agents stay within legal and regulatory bounds.

      The second entity is Norm Law LLP, an affiliated AI-native law firm that runs natively on Norm Ai's
      platform. Norm Law provides outside legal counsel to institutional clients. Unlike traditional law
      firms that bill by the hour, Norm Law prices services based on outcomes, allowing AI-driven
      efficiency gains to accrue directly to clients rather than to the firm's billing model. Senior
      attorneys supervise and improve the AI agents rather than managing associate pyramids.

      This combined architecture — technology platform plus AI-native law firm — is described by the
      company as the "full-stack model for legal AI." It distinguishes Norm Ai from competitors such as
      Harvey AI (which sells software tools to law firms) and Legora (which focuses on legal research
      for law firms), because Norm Ai both licenses technology to enterprise legal and compliance teams
      AND performs legal work for those same enterprises. Norm Ai's focus is financial services: global
      banks, hedge funds, insurance companies, and asset managers representing over $30 trillion in AUM.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
    tableRefs:
      - TO001

  - id: s2
    title: Founders, Leadership, and Governance
    body: |
      John Nay is Norm Ai's founder and CEO. His profile sits at an unusually deep intersection of AI
      research, legal scholarship, and institutional finance. From approximately 2016 to 2022 he was a
      fellow at Stanford's CodeX (Center for Legal Informatics), where he built the conceptual and
      technical foundations of what he calls agentic law. Prior to Norm Ai, he founded Brooklyn
      Investment Group, an AI-powered investment platform that was acquired by TIAA Nuveen — one of the
      institutional asset managers that has since invested in and become a client of Norm Ai. He also
      taught what has been described as the first AI course at NYU School of Law, establishing academic
      credibility in the AI-and-law intersection that is central to Norm Ai's positioning.

      Norm Law LLP is chaired by Mike Schmidtberger, former Chairman of the Executive Committee of
      Sidley Austin — one of the world's largest law firms. Schmidtberger joined in January 2026.
      Norm Law's partnership also includes the former Global Head of Real Estate at Sidley Austin,
      a senior M&A partner from Ropes & Gray, and the General Counsel from Bain Capital Ventures,
      as well as attorneys drawn laterally from Kirkland & Ellis, Simpson Thacher, Paul Weiss,
      Davis Polk, Skadden, Cleary Gottlieb, Latham & Watkins, Paul Hastings, Proskauer, and Pillsbury.

      Individual investors serving as strategic advisors include Tony James (former President, COO, and
      Executive Vice Chairman of Blackstone), Jeff Hammes (former Chairman of Kirkland & Ellis),
      Henry R. Kravis (KKR co-founder), and Marc Benioff (Salesforce CEO). The presence of these
      figures signals credibility with the ultra-high-end institutional buyer community.

      Key-person risk is concentrated heavily in John Nay, whose academic reputation, institutional
      relationships, and public identity as the architect of agentic law underpin brand, product, and
      client acquisition. Specific C-suite titles below Nay (CTO, CFO, CPO) have not been publicly
      disclosed as of the report date, which is an operational governance gap for external observers.
    claimRefs:
