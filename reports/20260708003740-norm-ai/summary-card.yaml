  topStrengths:
    - >-
      Full-stack model uniquely combines a proprietary compliance platform with an AI-native law firm under one brand —
      structurally difficult to replicate due to ABA Rule 5.4 restrictions on non-lawyer law firm ownership.
    - >-
      Elite investor syndicate: Khosla Ventures (first OpenAI investor) leading alongside Blackstone, BCV, Coatue,
      Vanguard, TIAA, and individual investors Tony James, Jeff Hammes, Henry Kravis, and Marc Benioff.
    - >-
      John Nay's decade+ at the intersection of AI, law, and institutional finance creates rare founder-market fit;
      Stanford CodeX research provides genuine technical IP foundation.
    - >-
      Confirmed production use at Blackstone and BCV — two of the most sophisticated financial institutions globally —
      with clients stated to represent $30T+ combined AUM.
  topRisks:
    - >-
      ABA Model Rule 5.4 prohibits non-lawyer ownership of law firms in most U.S. states; Norm Law LLP's compliance
      structure and bar admissions are not publicly disclosed, creating a material structural risk that could force
      reorganization.
    - >-
      No publicly disclosed revenue, ARR, gross margin, or customer count — the $1.2B valuation rests entirely on
      investor conviction and comparable valuations (Harvey AI $11B, Legora $5.6B) without verifiable financial
      underpinning.
    - >-
      John Nay key-person concentration — Norm Ai's brand, investor relationships, regulatory influence (Central Park AI
      Forum), and technical vision are anchored in a single founder with no publicly visible succession plan.
    - >-
      Dual investor-client role of Blackstone and BCV creates governance and conflict-of-interest complexity that has
      not been addressed through any publicly disclosed mechanism.
  unresolvedGaps:
    - >-
      Annual recurring revenue and gross margin for the Leap platform and Norm Law LLP — essential for valuation
      underwriting.
    - >-
      Norm Law LLP's legal ownership structure and ABA Rule 5.4 compliance mechanism — critical for assessing structural
      viability.
    - Client list beyond Blackstone and BCV — necessary to assess concentration risk within the $30T AUM claim.
    - >-
      Board composition and Khosla Ventures' governance rights from the Series C — required for understanding investor
      control dynamics.
    - Combined headcount of Norm AI, Inc. and Norm Law LLP — needed to estimate burn rate and operational scale.
