summary:
  headline: >-
    Norm Ai has built a structurally distinctive full-stack legal AI platform targeting financial services institutions,
    validated by Khosla Ventures and elite institutional co-investors, but material information barriers — undisclosed
    revenue, unresolved ABA Rule 5.4 compliance structure, and a single named founder — limit full investment conviction
    without private diligence.
