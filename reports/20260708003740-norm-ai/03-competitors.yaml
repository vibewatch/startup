  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive win loss data
    missingEvidence: Customer-by-customer RFP win loss data versus Harvey, Microsoft, Thomson Reuters, Big Law, and ALSP alternatives.
    whyItMatters: Public positioning alone cannot show whether Norm wins on price, trust, legal scope, or procurement structure.
    diligencePath: Request the last twelve months of win-loss notes, pipeline stage reports, and at least ten anonymized competitive deal memos.
    relatedQuestionRefs:
    - QP024
  - type: private-evidence-only
    severity: material
    topic: software versus service revenue mix
    missingEvidence: Revenue, gross margin, and retention split across platform software, supervisory AI, and Norm Law service delivery.
    whyItMatters: Valuation durability depends on whether Norm behaves more like software, managed services, or a hybrid with different margin profiles.
    diligencePath: Request board metrics or audited management reporting that breaks ARR, services revenue, gross margin, and renewal by product line.
    relatedQuestionRefs:
    - QP025
  - type: private-evidence-only
    severity: material
    topic: contract pricing terms
    missingEvidence: Actual ACVs, seat counts, outcome-fee schedules, services minimums, and contract-length norms for Norm and the main alternatives.
    whyItMatters: Public pages mostly route to demos, so procurement comparability and pricing power cannot be underwritten from list pricing.
    diligencePath: Obtain executed customer contracts, standard order forms, and discount policy by vendor class, then map them against the pricing table.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: jurisdiction portability of Norm Law structure
    missingEvidence: Entity charts, bar-admission footprint, conflict protocols, and outside legal opinions on how Norm Law scales across jurisdictions.
    whyItMatters: The same structure that creates moat value could constrain expansion or create compliance friction if it is not portable.
    diligencePath: Request the legal structure memorandum, admitted jurisdictions, referral arrangements, and any state-bar or outside-counsel analyses.
    relatedQuestionRefs:
    - QP018
    - QP025
  - type: access-blocked
    severity: minor
    topic: independent market and adverse corroboration
    missingEvidence: Live readable copies of the listed TechCrunch, Reuters, Axios, Law.com, ABA Journal, Grand View, and McKinsey URLs that were already in the fetch log.
    whyItMatters: The chapter can rely on official sources for core facts, but blocked third-party coverage weakens independent corroboration on market growth, adverse commentary, and valuation context.
    diligencePath: Pull licensed database copies or publisher PDFs for the blocked URLs and rerun competitive and market-corroboration checks.
    relatedQuestionRefs:
    - QP026
    - QP027
    relatedTableRefs:
    - TP001
