- id: TP004
  title: Moat durability / competitive risk register
  notes: Durability is scored from 1 low to 5 high based on how hard the advantage is to copy quickly using public evidence. Risk level measures exposure to commercial or structural attack, not certainty of loss.
  columns:
  - moat/advantage
  - durability (1-5)
  - attack vector
  - risk level
  - diligence ask
  rows:
  - - Full-stack software plus affiliated legal delivery
    - '4'
    - Harvey, ALSPs, or firms prove buyers prefer software-only or labor-only procurement
    - High
    - Ask for win-loss split between buyers who wanted software only versus buyers who wanted legal execution too
  - - Outcome-based pricing aligned to client value
    - '3'
    - Seat-based and hourly alternatives look easier to budget or compare in procurement
    - Medium
    - Review realized pricing, discounting, and how often outcome pricing expands versus stalls deals
  - - Financial-services client density and investor-client overlap
    - '3'
    - Harvey and Microsoft deepen asset-management penetration and erase segment isolation
    - Medium
    - Request named customer overlap, renewal cohorts, and referenceability in asset management and insurance
  - - Supervisory AI and regulatory-encoding expertise
    - '3'
    - Microsoft, Thomson Reuters, or model-layer partners bundle adjacent governance and compliance workflows
    - High
    - Test whether supervisory AI is a standalone reason to buy or only an attach feature to services work
  - - Rule 5.4 structural complexity as a replication barrier
    - '4'
    - The same structure creates jurisdictional friction, bar risk, or expansion drag
    - High
    - Obtain the legal-structure memo, jurisdiction map, and any outside opinions on portability
  - - Trusted execution accountability
    - '2'
    - Incumbent content vendors and Big Law argue they have more trust and established relationships
    - Medium
    - Ask customers why they picked Norm over Westlaw-CoCounsel, Microsoft, ALSPs, or elite firms for similar workflows
