chapter:
  number: 3
  title: Competitors
  summary: Norm Ai does not compete in only one lane. Harvey and Legora are the clearest direct legal-AI peers, but Microsoft, Thomson Reuters, ALSPs, Big Law, and manual or internal workflows all attack different pieces of the same budget. Norm's moat is strongest when buyers want outcome-priced execution plus supervisory AI and legal-service accountability, but its structure is also the easiest point for software bundles, incumbent content, and procurement conservatism to exploit.
sections:
- id: s-direct-competitors
  title: Direct Competitors
  body: Harvey and Legora are Norm Ai's most direct AI-native peers, but both attack the market from a software-first starting point rather than from a combined software-and-law-firm structure. Harvey is the larger current benchmark by funding and customer penetration. Its March 2026 growth round valued the company at $11 billion, and Harvey says it now works with the majority of the AmLaw 100, more than 500 in-house teams, and 50 asset managers across 60 countries. That last metric matters because it means Harvey is no longer just a law-firm tool. It already touches part of the same asset-management buyer universe that Norm describes as its core market. Legora is smaller than Harvey but still extremely well capitalized and growing fast in the U.S. while marketing agentic workflows, research, drafting, and monitoring to both firms and in-house teams. Norm's main differentiation versus these direct peers is that it can sell software, supervisory governance, and legal execution in one package;
    its main risk is that software-only rivals are proving they can still customize workflows deeply without owning a law firm.
