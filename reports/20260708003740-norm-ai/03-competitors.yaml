- id: s-pricing-switching-cost
  title: Pricing, Packaging, and Switching Cost
  body: The pricing comparison matters because these vendors are not asking buyers to fund the same budget line. Norm Law's public positioning is outcome-based, which is attractive if a buyer wants measurable execution and hates hourly billing, but procurement teams still need to compare that structure against seat-based software and established outside-counsel rules. Harvey, Legora, Microsoft, and Thomson Reuters mostly present demo-led or negotiated enterprise software motions, which can fit existing legal-operations or productivity budgets more cleanly than a hybrid software-plus-services engagement. Axiom, EY, and Elevate compete through project, staffing, or managed-service economics. Traditional firms remain the benchmark for the hardest matters, and recent market data shows partner rates continuing to rise, with some top-tier partners charging more than $2,300 per hour and top-25 Am Law M&A partner rates around $1,680 per hour. Switching cost is therefore uneven. Replacing a Westlaw
    or Practical Law workflow, or displacing Microsoft from an existing stack, is structurally harder than displacing a narrow manual review or spreadsheet-based process. Norm is best positioned when the buyer is already dissatisfied with hourly law-firm economics and wants a single accountable operator for both AI workflows and legal output.
