- id: s-risks-roadmap
  title: Dependencies, Risks, and Roadmap Gaps
  body: 'Norm''s strongest strategic feature is also its clearest technical and regulatory risk bundle. The company has built its product on external frontier-model infrastructure rather than on a disclosed proprietary base model, so cost, availability, safety behavior, and policy changes at major model vendors can all cascade directly into product economics and reliability. Norm''s own research is candid that trust is the bottleneck. The Legal AGI Lab page says frontier models reach the same legal conclusion roughly 90 percent of the time, which still implies recurring contradictions at scale for high-stakes legal work. That is not just a software QA issue. Because Norm Law uses the same stack in outcome-priced legal matters, hallucination or inconsistency can become a liability issue rather than merely a customer-satisfaction issue.


    Data governance is the other major dependency. Norm''s workflows touch marketing claims, investor questionnaires, fund documents, internal policies, and other highly sensitive regulated materials. The trust center metadata says the company emphasizes SOC 2 compliance, continuous monitoring, and data protection, but public readers cannot easily inspect the detailed control set, incident history, or model-governance procedures. Structurally, ABA Rule 5.4 also constrains how close the technology company and the law firm can be, and public materials do not explain the exact ownership, fee-sharing, or control arrangement. On roadmap, the company is clearly pushing toward a broader legal infrastructure layer: AI supervising AI, wider enterprise embeddings, more global regulatory scope, and the Legal AGI Lab. The moat could become durable if the precedent loop between Legal Engineers and practicing attorneys compounds faster than model commoditization. If that loop weakens, however, third-party
    model progress could erode differentiation faster than the company discloses today.'
