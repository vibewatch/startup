  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: production model vendor disclosure
    missingEvidence: Current production vendor list, model-routing policy, fallback logic, and red-team results for Leap and Supervisory AI.
    whyItMatters: Model-provider concentration, output quality, and economics depend on this hidden layer.
    diligencePath: Request architecture review materials, vendor contracts, and model-governance documentation under NDA.
    relatedQuestionRefs:
    - QE014
  - type: private-evidence-only
    severity: material
    topic: production reliability metrics
    missingEvidence: Workflow-level precision, recall, false-positive, false-negative, contradiction, and latency metrics by use case.
    whyItMatters: Public case studies show directionally positive outcomes, but underwriters still need quantified reliability for high-stakes deployment.
    diligencePath: Request customer scorecards, evaluation methodology, and error-rate reporting for core products.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: jurisdiction coverage map
    missingEvidence: A complete map of jurisdictions, rule sets, and languages currently covered in production with update cadences.
    whyItMatters: Scalability of Supervisory AI and enterprise compliance workflows depends on breadth and freshness of rule coverage.
