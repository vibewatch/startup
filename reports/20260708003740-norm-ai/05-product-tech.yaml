- id: s-architecture-workflow
  title: Architecture and Workflow
  body: 'Norm Ai''s public architecture disclosure is enough to reconstruct the operating model even though it is not enough to reconstruct a full system diagram. The disclosed pattern is attorney knowledge plus proprietary orchestration on top of external frontier models. Norm''s April 2026 legal-engineering retrospective says software engineers build the internal tools and protocols, Legal Engineers work directly in terminals and command-line environments, and attorneys build chains of agents, web applications, email integrations, and workflow automations. The DDQ and RFP product write-up adds the knowledge layer: approved answers, fund documents, policies, and historical questionnaires live in a versioned repository, while agents retrieve the most authoritative source, draft responses, cite their evidence, and preserve reviewer edits as precedent. The Microsoft 365 Copilot integration adds the policy-verification layer, with compliance review, auditability, and approved-source checking
    inside an existing enterprise interface.


    This architecture is notably hybrid. Norm does not claim to train its own frontier foundation model. Instead, it describes external AI infrastructure and publicly benchmarks Anthropic models in Legal AGI research, while keeping its production routing and vendor mix undisclosed. The workflow therefore appears to run from customer intake and document capture, through policy retrieval and agent execution, into human legal or compliance escalation, and then back into a precedent repository that improves future runs. That is a materially different model from a pure legal copilot. The system is designed to make institutional standards reusable, explainable, and enforceable across multiple workflows. The trade-off is that trust in output quality depends on both the encoded policy layer and the behavior of third-party models sitting under it.'
  claimRefs:
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
