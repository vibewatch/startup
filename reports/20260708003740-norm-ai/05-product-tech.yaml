company:
  name: Norm Ai
chapter:
  number: 5
  title: Product & Technology
  summary: Norm Ai sells a tightly coupled legal-AI stack rather than a single tool. LEAP and the broader Norm Technology platform let Legal Engineers encode law into agents, Supervisory AI extends that stack into oversight of third-party agents, and Norm Law LLP provides production legal-service deployment that closes the feedback loop. Public evidence shows real production use in content review, DDQ and RFP workflows, Microsoft 365 Copilot compliance, and AI-native outside counsel, but it also shows dependence on external foundation models, sparse disclosure of production metrics, and unresolved structural liability and Rule 5.4 questions.
sections:
- id: s-product-modules
  title: Product Modules
  body: 'Norm Ai now presents itself as a three-part operating system for regulated legal work. The first layer is the Norm Technology platform, whose core engine is LEAP, the Legal Engineering Automation Platform described by Crunchbase and Norm''s own legal-engineering materials as the proprietary tooling through which lawyers translate regulations, policies, and workflows into AI agents. Those agents are not positioned as generic chatbots. Public materials instead frame them as domain-specific systems built, calibrated, and tested by Legal Engineers before client deployment. The second layer is Supervisory AI, which Norm describes as the verification layer for AI agents operating under law and as a growing product category for regulated enterprises deploying AI across internal workflows. The third layer is Norm Law LLP, the affiliated but formally separate law firm that applies the stack in actual legal service delivery.


    The interaction among the three modules is what differentiates the company. Legal Engineers build reusable decision architectures in LEAP, Supervisory AI packages those controls for oversight use cases, and Norm Law attorneys use and refine the same underlying agentic infrastructure on live matters. Public case studies show that this expands well beyond a single legal niche. Norm markets the stack into marketing review at Prudential, DDQ and RFP completion for institutional managers, compliance checks inside Microsoft 365 Copilot, and outside counsel work for asset managers and private capital clients. That breadth matters because it suggests the product is delivered less as a point solution and more as a configurable legal-compliance substrate. It also means product maturity cannot be judged solely by software UX. The real product is the combination of encoded rule systems, workflow agents, human review layers, and the law-firm operating loop that generates new precedent.'
  claimRefs:
