  topStrengths:
    - 全栈模式把自研合规平台和 AI 原生律所放在同一品牌下，组合很少见；ABA Rule 5.4 限制非律师持有律所股权，这种结构本身就难复制。
    - >-
      投资人阵容顶级：Khosla Ventures（OpenAI 首位投资人）领投，Blackstone、BCV、Coatue、Vanguard、TIAA 参投，个人投资人包括 Tony James、Jeff
      Hammes、Henry Kravis、Marc Benioff。
    - John Nay 十多年一直站在 AI、法律和机构金融交汇处，创始人与市场匹配度罕见；Stanford CodeX 研究给公司垫了真实技术 IP 底座。
    - Blackstone 和 BCV 已确认投入生产使用——两者都是全球最成熟的金融机构之一；公司称客户合计管理资产超过 $30T。
  topRisks:
    - ABA Model Rule 5.4 在美国多数州禁止非律师拥有律所；Norm Law LLP 的合规架构和律师协会准入情况未公开，带来重大结构风险，可能迫使公司重组。
    - 公司没有公开收入、ARR、毛利率或客户数；$1.2B 估值完全押在投资人判断和可比公司估值（Harvey AI $11B、Legora $5.6B）上，缺少可核验的财务支撑。
    - John Nay 单人依赖过高——Norm Ai 的品牌、投资人关系、监管影响力（Central Park AI Forum）和技术愿景都系于这位创始人，公开信息看不到接班安排。
    - Blackstone 和 BCV 既是投资人又是客户，治理和利益冲突更复杂；公开信息未见任何机制处理。
  unresolvedGaps:
    - Leap 平台与 Norm Law LLP 的年经常性收入（ARR）和毛利率——估值承销必需。
    - Norm Law LLP 的法律所有权结构与 ABA Rule 5.4 合规机制——判断结构可行性的关键。
    - Blackstone 和 BCV 之外的客户名单——评估 $30T AUM 说法中的集中度风险必须拿到。
    - 董事会构成以及 Khosla Ventures 在 Series C 中的治理权——理解投资人控制动态所需。
    - Norm AI, Inc. 与 Norm Law LLP 合计员工数——用于估算烧钱速度和运营规模。
