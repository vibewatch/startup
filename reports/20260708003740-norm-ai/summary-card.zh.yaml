summary:
  headline: >-
    Norm Ai 搭出一个面向金融服务机构、结构独特的全栈法律 AI 平台，Khosla Ventures 和顶级机构共同投资给了背书；但收入未披露、 ABA Rule 5.4
    合规架构仍未解开，公开创始人也只有一位。若没有私下尽调，完整投资确信度仍被这些关键信息缺口卡住。
