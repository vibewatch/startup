company:
  name: "Just Salad"
chapter:
  number: 2
  title: "Market Analysis"
  summary: "Public evidence supports a scaled and expanding healthy fast-casual niche for Just Salad, but the assigned evidence does not support a defensible industry TAM, SAM, or SOM. Realized sales, unit productivity, footprint growth, and a promising drive-thru pilot establish demand while format replication, public-market comparables, and limited cohort disclosure constrain extrapolation."
sections:
  - id: "market-boundary"
    title: "Market boundary and status-quo substitutes"
    body: |
      The investable market is narrower than restaurants, wellness, or foodservice as a whole. Just Salad competes for prepared lunch and dinner occasions in which consumers value health, speed, customization, and portability; its relevant substitutes include traditional quick service, adjacent healthy fast casual, delivery, and grocery or home-prepared meals for the same occasion. The product boundary is broader than salads because public descriptions include wraps, warm bowls, market plates, soups, smoothies, and rotating seasonal recipes. Sustainability is a customer-facing differentiator through reusable bowls and carbon labeling, but it should not be counted as a separate pool of spend. This boundary keeps the analysis tied to occasions the concept can actually win rather than treating every restaurant dollar as addressable.
    claimRefs: ["CM001", "CM002", "CM011", "CM012"]
    tableRefs: ["TM001"]
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: |
      The assigned sources contain no independent category estimate that cleanly isolates Just Salad's TAM, SAM, or SOM by geography, daypart, or format. The stronger sizing approach therefore triangulates realized chain sales, store count, average unit volume, openings, and format tests. Restaurant Business reported $150 million of 2023 sales and an 81-unit base in April 2024, while Bloomberg reported 19 openings during 2024. By January 2026, Nation's Restaurant News reported more than 100 locations and management-described traditional-unit economics near $2.2 million of average unit volume with margins north of 20%. These observations prove meaningful demand and expansion capacity, but they do not quantify the remaining opportunity or establish that every new cohort will reproduce mature-store economics.
    claimRefs: ["CM003", "CM004", "CM005", "CM006", "CM007", "CM008", "CM016"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyer, user, payer, and adoption path"
    body: |
      For most transactions, the buyer, user, and payer are the same consumer choosing an individual meal in store, through the app, or through a delivery marketplace. The use case changes at the edge: a household decision-maker can choose a drive-thru meal for convenience, while a loyalty member responds to app rewards and repeat-purchase incentives. Just Salad's Washington opening and seasonal chef collaboration illustrate how geographic expansion, digital rewards, product rotation, and plant-forward positioning can support trial and frequency. The first drive-thru's reported sales lift is the clearest evidence that a new access format can expand demand, although one pilot cannot establish repeatability across sites.
    claimRefs: ["CM009", "CM011", "CM012", "CM013"]
    tableRefs: ["TM003"]
  - id: "drivers-constraints-and-valuation"
    title: "Growth drivers, adoption constraints, and valuation relevance"
    body: |
      The principal growth drivers are store expansion, movement from urban cores into adjacent suburban and drive-thru occasions, menu breadth, and capital available for new units and technology. The constraints are equally material. Fresh on-site preparation and a stated lack of automation can preserve product quality but raise labor and execution demands, while drive-thru speed and customization create operational tradeoffs. Consumer evidence is mixed rather than uniformly positive: Tripadvisor displayed a 4.0 rating across 30 reviews, but a July 2026 delivery review reported missing items, added fees, and disappointing food. Ion Analytics also reported that a possible IPO would be judged against Sweetgreen and category sentiment. Valuation therefore depends on replicating unit economics and service quality, not merely on opening more stores.
    claimRefs: ["CM008", "CM009", "CM010", "CM013", "CM014", "CM015", "CM016"]
