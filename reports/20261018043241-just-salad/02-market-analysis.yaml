callouts:
  - calloutType: "insight"
    title: "Traction is observable; remaining whitespace is not"
    body: "Public evidence supports demand and unit expansion, but an investment case still needs independent category sizing and cohort-level unit economics before converting footprint momentum into a precise SOM."
    claimRefs: ["CM003", "CM007", "CM008", "CM009"]
  - calloutType: "risk"
    title: "One successful format test is not a rollout curve"
    body: "The first drive-thru's reported lift is encouraging, yet site availability, speed, customization, labor, and service consistency remain replication risks."
    claimRefs: ["CM009", "CM010", "CM014"]
