        - label: "Impact (1-5)"
          detail: "5 is most damaging to the underwriting case."
        - label: "Mitigation maturity (1-5)"
          detail: "5 is best-evidenced mitigation maturity."
      rows:
        - label: "Drive-thru / new-unit consistency risk"
          values: [4, 4, 3]
          note: "30%+ drive-thru lift and 4-6 more planned, but the format must still hit 3-minute service and fresh-prep standards."
        - label: "Delivery / marketplace service-quality risk"
          values: [4, 3, 2]
          note: "Customer complaints and marketplace dependence are visible; public platform-quality metrics are not."
        - label: "Capital deployment versus valuation expectations"
          values: [3, 5, 2]
          note: "The company raised $200 million at an approximately $1 billion valuation for growth and technology."
        - label: "Privacy / security disclosure-gap risk"
          values: [2, 4, 1]
          note: "Assigned public evidence confirms app-led rewards but not current controls, incident history, or certifications."
        - label: "Supplier / sustainability execution risk"
          values: [3, 3, 3]
          note: "The concept depends on daily prep, aligned suppliers, and sustainability positioning that can weaken if sourcing or substitutions slip."
        - label: "Brand-collaboration dependency risk"
          values: [3, 2, 2]
          note: "Chef, nonprofit, and athlete partnerships help awareness, but public evidence does not prove durable retention from those campaigns."
    approximationNotes: "Scores are analyst synthesis from the cited sources rather than disclosed company ratings."
    claimRefs: ["CR001", "CR003", "CR008", "CR009", "CR011", "CR012", "CR014", "CR015"]
callouts:
  - calloutType: "risk"
    title: "Top residual risk"
    body: "Rapid footprint growth only works if Just Salad can keep speed, fresh-prep quality, and unit economics aligned as it adds more drive-thru and new-market stores."
    claimRefs: ["CR003", "CR004", "CR006", "CR014"]
  - calloutType: "recommendation"
    title: "Kill criteria before underwriting"
    body: "Do not underwrite an execution-premium case without evidence on lease obligations, cash runway, channel mix, complaint rates, and current privacy / security governance."
    claimRefs: ["CR011", "CR015"]
