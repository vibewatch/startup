company:
  name: "Just Salad"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    Just Salad's highest residual risk is execution drift while it tries to
    convert fresh-prep restaurant standards into faster, wider expansion across
    drive-thru, new geographies, and app-led customer acquisition. Public
    evidence supports real growth momentum and a strong 2025 funding base, but
    it leaves material gaps around current balance-sheet downside, compliance
    controls, and privacy/security governance.
sections:
  - id: "legal-and-governance"
    title: "Legal and governance exposure is manageable but not fully de-risked"
    body: >-
      The clearest disclosed legal issue in the assigned evidence pool is the
      2018 delivery-worker case referenced on Wikipedia, which says most claims
      were dismissed in 2022 and the remainder were settled. That history does
      not by itself break the thesis, but it does show that labor-process risk
      is real in a delivery-heavy operating model. The more important current
      concern is evidentiary: the assigned pool does not verify current cash,
      debt, lease obligations, privacy controls, incident history, or a
      documented multi-state compliance dashboard. For a restaurant chain adding
      units and new formats, that disclosure gap leaves investors underwriting
      governance and control maturity with incomplete downside data.
    claimRefs: ["CR007", "CR015"]
    tableRefs: ["TR001"]
  - id: "operational-and-channel-execution"
    title: "Operational quality must hold while the model gets faster and broader"
    body: >-
      Nation's Restaurant News describes a model that is deliberately fresh,
      labor-intensive, and speed-sensitive: management wants 3-minute drive-thru
      service, says the first drive-thru produced a 30%+ sales lift, and plans
      four to six more in 2026, while also emphasizing that there is no
      automation and that product consistency is the daily focus. That creates a
      classic scale risk: the same traits that differentiate the concept can
      become failure points if throughput slips, new teams are undertrained, or
      ingredient execution varies by store. Customer evidence in the assigned
      pool is not uniformly negative, but delivery complaints about missing
      items, service fees, and disappointing food quality show where execution
      can break first under channel complexity.
    claimRefs: ["CR003", "CR004", "CR005", "CR006", "CR008", "CR013"]
    tableRefs: ["TR002"]
  - id: "dependency-and-capital-underwriting"
    title: "Capital, partners, and platforms amplify both upside and downside"
    body: >-
      The 2025 $200 million raise materially extends Just Salad's expansion
      capacity, but it also hardens expectations because the company said the
      proceeds would support unit growth, technology initiatives, and customer
      experience at an approximately $1 billion valuation. Public materials also
      show dependence on external demand and partner surfaces: the company uses
      third-party marketplaces for ad spend, pushes rewards through its app, and
      uses chef, nonprofit, and athlete partnerships to keep the brand and menu
      fresh. None of those channels is inherently unhealthy, but they increase
      the number of counterparties that can affect traffic quality, margins,
      execution speed, and brand perception.
    claimRefs: ["CR001", "CR002", "CR011", "CR012", "CR014"]
    tableRefs: ["TR003"]
  - id: "monitoring-and-kill-criteria"
    title: "Underwrite the concept only with measurable control points"
    body: >-
      The key diligence posture here is not to assume that strong store-level
      economics automatically scale cleanly into a bigger footprint. The most
      important kill criteria are observable: same-store sales stalling while
      the 2025 growth capital is still being deployed, drive-thru speed gains
      coming with lower quality or higher remake rates, rising delivery
      complaints as marketplace volume grows, and the company failing to produce
      a clean schedule of lease obligations, debt, cash runway, and current
      privacy/security governance. If management can evidence those controls,
      the risk profile looks underwritable; if not, the residual exposure stays
      high even with brand momentum.
    claimRefs: ["CR005", "CR010", "CR014", "CR015"]
    figureRefs: ["FR001"]
