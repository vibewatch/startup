      - ["Third-party marketplaces and digital acquisition channels", "DoorDash, Uber Eats, paid social / search platforms", "Demand generation and off-premise order flow", "Unknown share of sales and CAC", "Platform economics or service quality worsen and compress margins or customer trust", "High", "Management says it is getting sharper on ad effectiveness", "Medium-High"]
