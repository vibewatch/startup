      - ["Supplier or sourcing variability weakens sustainability and quality positioning", "Medium", "Medium-High", "Medium", "Medium", "Need supplier concentration, fill-rate, and substitution data for produce, proteins, and packaging"]
      - ["App, rewards, or digital-ordering outage harms customer experience and data posture", "Unknown", "Medium-High", "Low", "High", "Assigned pool confirms app-led rewards usage but not uptime, security controls, or incident response metrics"]
    notes: "Ratings summarize public evidence and management statements; unresolved gaps show what public materials still do not quantify."
    claimRefs: ["CR003", "CR006", "CR008", "CR010", "CR011", "CR013"]
  - id: "TR003"
    title: "Partner / dependency risk register"
    columns:
