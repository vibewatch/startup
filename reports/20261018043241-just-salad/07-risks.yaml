      - ["Privacy / security / consumer-data governance disclosure gap", "App, loyalty, and digital ordering stack", "Assigned public pool does not verify incident history, certifications, or named control framework", "Unknown", "High", "No confirmed public mitigation beyond ordinary app/rewards usage", "High", "Request privacy program owner, incident log, penetration-test summary, and vendor list for payment / loyalty / data flows"]
    notes: "Rows are ordered by severity; likelihood and severity are analytical ratings anchored to cited evidence, and unknown means the public pool did not verify the control state."
