              - CP004
              - CP007
              - CP009
              - CP010
              - CP012
              - CP013
      - number: '3.2'
        title: Differentiation appears brand- and execution-led, with convenience and price tradeoffs
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to four recurring ways Just Salad tries to stand apart. First, B Lab certification
              and repeated references to reusable bowls plus carbon labeling give the brand a sustainability identity
              that many fast-casual chains do not advertise as explicitly in the assigned pool. Second, management
              positions the chain against automation-heavy peers by emphasizing in-store prep, quality control, and
              tenured labor rather than robotics. Third, the company is broadening access points: drive-thru delivered a
              30%+ lift at the first site, JS Rewards and the app add light loyalty lock-in, and management is
              sharpening spend on delivery marketplaces. Fourth, menu innovation relies on seasonal launches and chef
              collaborations more than protected IP. The tradeoff is that convenience channels can dilute the value
              proposition. The clearest adverse evidence in the pool is a 2026 Tripadvisor complaint about service fees,
              menu-price inflation, and poor delivered food quality, which suggests that channel expansion can narrow
              differentiation if the guest experiences the product through third-party logistics instead of the core
              store format.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP009
      - number: '3.3'
        title: Moat durability depends on repeatable execution more than structural lock-in
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a real brand and execution story, but not a hard moat. Just Salad now has
              meaningful scale, and management cites close to $2.2 million average unit volumes, margins north of 20%,
              strong same-store sales history, and about 50% cash-on-cash returns, all of which matter more
              competitively than a generic "healthy food" narrative if they are sustainable. Even so, the moat still
              looks soft rather than structural. Sustainability cues, chef collaborations, and loyalty mechanics can
              help with trial and repeat behavior, yet none of them create high switching costs on their own.
              Public-market comparison pressure also matters: Ion explicitly flags Sweetgreen's post-IPO share-price
              performance as a sentiment overhang for the category, meaning Just Salad is already being judged against
              better-known public analogs. Labor and last-mile execution are additional pressure points, with a
              historical delivery-worker lawsuit on one side and contemporary delivery-review complaints on the other.
              Before underwriting durability, diligence still needs direct peer pricing, broader customer retention
              evidence, and sourced proof on how often guests multi-home across healthy fast-casual options.
            claimRefs:
              - CP005
              - CP006
              - CP009
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The real public comp is already Sweetgreen, even before an IPO
            body: >-
              Current reporting does not merely describe Just Salad as a healthy restaurant chain; it explicitly says
              the company is likely to be compared with Sweetgreen and that category sentiment is influenced by
              Sweetgreen's trading history. That makes public-comp expectations part of today's competitive landscape,
              not just a future financing issue.
            calloutType: insight
            claimRefs:
              - CP012
              - CP013
          - type: callout
            title: Convenience channels can compress differentiation
            body: >-
              Drive-thru and delivery broaden reach, but the pool also shows how those same channels can weaken
              perceived value if service fees, delivery markups, or food-quality slippage become the customer's main
              touchpoint.
            calloutType: risk
            claimRefs:
              - CP004
              - CP009
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              The public record points to a simple monetization engine: Just Salad sells prepared meals through
              company-operated restaurants, then layers digital loyalty, delivery, and format expansion on top. Official
              and tracker sources tie the February 2025 financing to nearly 100 locations, while NRN reported the chain
              had moved above 100 locations by January 2026. Public traction metrics remain uneven, however. Multiples
              attached a $195 million revenue figure to the February 2025 round, but other trackers estimated lower
              revenue and inconsistent lifetime funding totals. That means outsiders can observe growth momentum and
              footprint expansion, but not a reconciled audited revenue base.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI006
