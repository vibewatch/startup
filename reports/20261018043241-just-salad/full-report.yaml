              - CE014
              - CE016
      - number: '5.2'
        title: Operating architecture and scale model
        blocks:
          - type: paragraph
            body: >
              The operating architecture looks like a standardized restaurant system, not a proprietary automation
              stack. Management described frequent produce delivery, in-house prep, overnight-marinated proteins, and
              repeated same-day cooking, while also explicitly rejecting automation. That means product quality and
              throughput depend on labor discipline, training, and site-level consistency rather than robotics or
              proprietary kitchen hardware. The scaling engine appears credible but operationally demanding: an external
              design partner says it has already completed more than 40 locations and has another 40 in design or
              construction, and management is extending the format mix through drive-thru after an early 2025 pilot. The
              three-minute drive-thru service target makes labor tenure and execution quality a measurable scaling
              dependency rather than a generic operating concern.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
