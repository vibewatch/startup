      - number: '1.3'
        title: Capitalization, scale signals, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              The clearest capital marker in the pool is the 2025 round: company-issued and independent sources align on
              a $200 million raise at an approximately $1 billion valuation, led by Wellington Management with D1
              Capital Partners, Neuberger Berman, and Stripes. Earlier support from Panda Restaurant Group and Closed
              Loop Partners indicates that the cap table was already accumulating strategic and institutional backers
              before the 2025 step-up. Operating scale looks real rather than aspirational: official pages say the chain
              is above 100 locations, NRN reports roughly $2.2 million AUVs and 20%-plus margins for traditional units,
              and Washington, D.C. expansion shows the company is still opening new geography-specific stores. What
              remains missing is the actual cap table, debt or lease exposure, and current ownership percentages behind
              those headlines.
