          Traffic softens, service consistency slips, or a structured internal round reveals downside protection above
          common equity.
        - <$0.8B, or <4x on the same public revenue marker, and economically worse for common if preferences are heavy.
        - Delivery dissatisfaction, execution strain, and financing structure.
        - Material if diligence disproves the interview-level economics or uncovers round overhang.
    notes: >-
      Indicative ranges are analyst synthesis anchored to the last public $1B mark and Multiples' $195M revenue figure;
      they are not quoted market bids or a fairness opinion.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Assigned public evidence shows a two-decade arc from New York launch to premium-valued growth chain with new
      format experiments and IPO optionality.
    data:
      items:
        - date: '2006'
          label: Founded in New York City
          detail: >-
            Official and third-party sources place the company's origin in New York City in 2006, with a mission built
            around healthy, accessible meals.
          tone: positive
        - date: '2016'
          label: Panda relationship begins
          detail: >-
            Wikipedia says Panda Restaurant Group had invested by 2016, establishing an early strategic-capital
            relationship before later rounds.
          tone: neutral
        - date: '2020'
          label: Carbon labeling milestone
          detail: >-
            Wikipedia says Just Salad became the first restaurant chain to show the carbon footprint of its menu items
            in 2020.
          tone: positive
        - date: '2021'
          label: Closed Loop / Panda-backed capital raise
          detail: >-
            Closed Loop's announcement said the brand had 47 locations and planned to double its footprint over the next
            two years while scaling zero-waste initiatives.
          tone: positive
        - date: '2023'
          label: B Corporation certification
          detail: >-
            Wikipedia summarizes 2023 B Corporation certification as a formal sustainability credential layered onto the
            reusable-bowl and carbon-label story.
          tone: positive
        - date: '2024-01-02'
          label: Amanda Cohen Veganuary collaboration
          detail: >-
            A syndicated company release launched the Dirt Candy collaboration as part of the winter menu and broader
            product-innovation effort.
          tone: positive
        - date: '2025'
          label: $200M financing at ~$1B valuation
          detail: >-
            Company-issued and independent sources align on a 2025 round led by Wellington Management with D1, Neuberger
            Berman, and Stripes.
          tone: positive
        - date: '2025'
          label: First drive-thru opens
          detail: NRN reported that the first drive-thru debuted in early 2025, opening a new format test for the chain.
          tone: warning
        - date: '2026-01-21'
          label: 100+ location scale and more drive-thru plans
          detail: >-
            NRN described the chain as more than 100 locations and said management expected four to six additional
            drive-thru openings in 2026.
          tone: positive
        - date: '2026-03-30'
          label: Second Washington, D.C. location
          detail: >-
            The F Street opening made Just Salad's second location in the district, signaling continued geographic
            densification.
          tone: positive
        - date: '2026-06-30'
          label: Jalen Brunson investment headline
          detail: Just Salad's press page highlighted media coverage of Knicks star Jalen Brunson investing in the brand.
          tone: neutral
        - date: '2026'
          label: IPO exploration surfaces
          detail: >-
            Ion Analytics reported that Just Salad was exploring an IPO, but timing and public-market receptivity
            remained uncertain.
          tone: risk
    claimRefs:
      - CO004
      - CO007
      - CO008
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
  - id: FM001
    title: Evidence-constrained market sizing ladder
    type: pyramid
    summary: >-
      The available market evidence progresses from a defined meal occasion to realized scale and format expansion,
      without claiming unsupported TAM/SAM/SOM values.
    data:
      items:
        - label: Healthy fast-casual meal occasions
          displayValue: Defined boundary
          note: Prepared lunch and dinner demand, not all restaurant spending.
        - label: 2023 realized chain sales
          displayValue: $150M
          note: Restaurant Business reported sales, not revenue run rate or TAM.
        - label: April 2024 operating footprint
          displayValue: 81 units
          note: All but six were company operated at that time.
        - label: 2024 realized openings
          displayValue: 19 stores
          note: Bloomberg reported completed openings.
        - label: January 2026 operating footprint
          displayValue: '>100 locations'
          note: Nation's Restaurant News reported current scale.
        - label: 2026 drive-thru replication test
          displayValue: 4-6 planned
          note: Planned additional drive-thrus following one pilot's reported 30%+ lift.
    approximationNotes: >-
      The layers are sequential evidence lenses, not nested or additive TAM/SAM/SOM bands. Values use different units
      and periods, and the taper indicates authored order rather than magnitude.
    claimRefs:
