  - id: FP001
    title: Competitive positioning map from assigned-pool evidence
    type: quadrant
    summary: Ordinal map of the main solution paths and comparators that are actually observable in the assigned pool.
    data:
      xAxis:
        label: Observed scale / buyer accessibility
        min: 1
        max: 5
        lowLabel: niche / episodic
        highLabel: scaled / broadly available
        description: >-
          Ordinal score derived only from public reach, unit count, and channel-availability signals in the assigned
          pool.
      yAxis:
        label: Observed differentiation proof
        min: 1
        max: 5
        lowLabel: commodity / thin proof
        highLabel: clear public differentiation signals
        description: Ordinal score derived only from assigned-pool evidence; it is not a market-share or quality ranking.
      points:
        - label: Just Salad core estate
          x: 4.4
          'y': 4.6
          detail: 125 locations in 2026 plus reusable bowls, carbon labels, and chef-designed menu proof.
        - label: Sweetgreen public comp
          x: 4.7
          'y': 3.5
          detail: Only explicitly named direct peer in the pool; automation-forward comparator.
        - label: Just Salad drive-thru format
          x: 3.8
          'y': 4
          detail: 30%+ sales lift at the first site and four to six more planned in 2026.
        - label: Delivery marketplace route
          x: 4.3
          'y': 2
          detail: High reach, but service-fee inflation and quality complaints can compress value.
        - label: Status-quo sandwich / nearby lunch
          x: 4.8
          'y': 1.6
          detail: Management frames salad as still trying to replace the sandwich as the default lunch item.
        - label: Seasonal chef-collab path
          x: 2.8
          'y': 3.7
          detail: Collaborations create novelty, but the pool does not show a hard moat.
