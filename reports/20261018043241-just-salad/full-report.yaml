  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Footprint growth broadens the customer mix beyond the original urban lunch core
        blocks:
          - type: paragraph
            body: >-
              The public record still points to Just Salad as a consumer-facing fast-casual concept whose core buyer,
              user, and payer are individual diners, but the footprint is widening the addressable occasions. QSR says
              the chain finished 2025 with 110 locations across New York City, the Tri-State area, Chicago,
              Massachusetts, Philadelphia, Washington, D.C., and Florida, while management described the customer base
              as broad across urban and suburban trade areas. A separate Lentils.org case study still frames the concept
              around lunchtime customers in major metros, but 2026 unit growth, drive-thru development, and
              dinner-oriented menu expansion suggest the customer base is no longer just the original office-lunch
              cohort.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU008
              - CU009
              - CU011
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU007
      - number: '6.2'
        title: Public proof of use is strongest in local openings, menu launches, reviews, and brand campaigns
        blocks:
          - type: paragraph
            body: >-
              Just Salad has more evidence of active consumer use than many private restaurant concepts, but most of
              that proof comes from store-level and consumer-channel proxies rather than from disclosed cohort data. The
              first drive-thru reportedly delivered a 30%+ sales lift, the company is using JS Rewards and app-linked
              freebies to reinforce repeat visits, and half of reported sales came from non-salad items such as bowls,
              wraps, and smoothies. Tripadvisor reviews show real transaction-level customer interaction, including
              positive commentary on freshness and speed as well as a 2026 complaint about delivery economics and
              quality. The Jalen Brunson campaign adds evidence of broader brand advocacy, but it is still promotional
              rather than a measurable retention disclosure.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU008
              - CU010
              - CU011
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU010
              - CU012
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU009
              - CU010
              - CU011
              - CU014
              - CU015
      - number: '6.3'
        title: Durability looks directionally positive, but the hard retention and concentration data are still missing
        blocks:
          - type: paragraph
            body: >-
              Demand durability is positive by proxy rather than by full customer-analytics disclosure. Nation's
              Restaurant News says same-store sales were double-digit every year since 2018 except 2020 and 2025, with
              2025 still positive, and the capital-raise materials tie same-store sales growth to increased traffic.
              That is useful evidence that customers are returning, but it does not answer the higher-value diligence
              questions around repeat-purchase frequency, churn, loyalty-member economics, top-market concentration,
              delivery dependence, or whether newer formats such as drive-thru or dinner dayparts hold up after the
              launch window. Public proof of adoption is therefore real, but customer durability is still only partially
              verified.
            claimRefs:
              - CU005
              - CU008
              - CU012
              - CU013
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scaled consumer demand is visible even without private dashboards
            body: >-
              The combination of 110 locations at the end of 2025, 125+ public references in 2026, positive same-store
              sales, drive-thru lift, and app-linked rewards gives real evidence that Just Salad is serving repeat
              consumer demand rather than just selling a logo story.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU005
              - CU006
          - type: callout
            title: The retention story is still proxy-based, not KPI-backed
            body: >-
              Public evidence shows reviews, promotions, and traffic proxies, but it still does not expose NRR, churn,
              loyalty-member counts, channel concentration, or contract-style renewal data, so durability and expansion
              quality remain only partially proven.
            calloutType: risk
            claimRefs:
              - CU008
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and governance exposure is manageable but not fully de-risked
        blocks:
          - type: paragraph
            body: >-
              The clearest disclosed legal issue in the assigned evidence pool is the 2018 delivery-worker case
              referenced on Wikipedia, which says most claims were dismissed in 2022 and the remainder were settled.
              That history does not by itself break the thesis, but it does show that labor-process risk is real in a
              delivery-heavy operating model. The more important current concern is evidentiary: the assigned pool does
              not verify current cash, debt, lease obligations, privacy controls, incident history, or a documented
              multi-state compliance dashboard. For a restaurant chain adding units and new formats, that disclosure gap
              leaves investors underwriting governance and control maturity with incomplete downside data.
            claimRefs:
              - CR007
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR011
              - CR013
              - CR015
      - number: '7.2'
        title: Operational quality must hold while the model gets faster and broader
        blocks:
          - type: paragraph
            body: >-
              Nation's Restaurant News describes a model that is deliberately fresh, labor-intensive, and
              speed-sensitive: management wants 3-minute drive-thru service, says the first drive-thru produced a 30%+
              sales lift, and plans four to six more in 2026, while also emphasizing that there is no automation and
              that product consistency is the daily focus. That creates a classic scale risk: the same traits that
              differentiate the concept can become failure points if throughput slips, new teams are undertrained, or
              ingredient execution varies by store. Customer evidence in the assigned pool is not uniformly negative,
              but delivery complaints about missing items, service fees, and disappointing food quality show where
              execution can break first under channel complexity.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR006
              - CR008
              - CR010
              - CR011
              - CR013
      - number: '7.3'
        title: Capital, partners, and platforms amplify both upside and downside
        blocks:
          - type: paragraph
            body: >-
              The 2025 $200 million raise materially extends Just Salad's expansion capacity, but it also hardens
              expectations because the company said the proceeds would support unit growth, technology initiatives, and
              customer experience at an approximately $1 billion valuation. Public materials also show dependence on
              external demand and partner surfaces: the company uses third-party marketplaces for ad spend, pushes
              rewards through its app, and uses chef, nonprofit, and athlete partnerships to keep the brand and menu
              fresh. None of those channels is inherently unhealthy, but they increase the number of counterparties that
              can affect traffic quality, margins, execution speed, and brand perception.
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR012
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.4'
        title: Underwrite the concept only with measurable control points
        blocks:
          - type: paragraph
            body: >-
              The key diligence posture here is not to assume that strong store-level economics automatically scale
              cleanly into a bigger footprint. The most important kill criteria are observable: same-store sales
              stalling while the 2025 growth capital is still being deployed, drive-thru speed gains coming with lower
              quality or higher remake rates, rising delivery complaints as marketplace volume grows, and the company
              failing to produce a clean schedule of lease obligations, debt, cash runway, and current privacy/security
              governance. If management can evidence those controls, the risk profile looks underwritable; if not, the
              residual exposure stays high even with brand momentum.
            claimRefs:
              - CR005
              - CR010
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR009
              - CR011
              - CR012
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Top residual risk
            body: >-
              Rapid footprint growth only works if Just Salad can keep speed, fresh-prep quality, and unit economics
              aligned as it adds more drive-thru and new-market stores.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR014
          - type: callout
            title: Kill criteria before underwriting
            body: >-
              Do not underwrite an execution-premium case without evidence on lease obligations, cash runway, channel
              mix, complaint rates, and current privacy / security governance.
            calloutType: recommendation
            claimRefs:
              - CR011
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: |-
              Public evidence supports treating Just Salad as a real scaled concept rather than a
              story stock. Independent coverage of the February 2025 round, later industry
              interviews, and a March 2026 store opening together show the company moved from
              close to 100 units to more than 100 locations, paired with claims of traffic-led
              same-store sales gains, 30%-plus drive-thru lift, and traditional-store economics
              around $2.2 million AUV with more than 20% margins. That is enough to justify
              ongoing diligence. It is not enough to justify paying the full headline mark
              today, because the only concrete valuation anchor retained in this pool is the
              roughly $1 billion February 2025 round, and the public record still omits cash,
              lease, debt, and preference-stack detail. On public evidence alone, the right
              stance is track: engage at a better price or after management opens the data room
              on structure and cohort economics.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV011
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV011
              - CV013
              - CV014
              - CV015
      - number: '8.2'
        title: Valuation context and support
        blocks:
          - type: paragraph
            body: |-
              Price support is concentrated in one marker. Multiples records $195 million of
              revenue at the February 2025 financing and a 5.1x implied revenue multiple, while
              company-controlled and trade coverage agree on the $200 million raise and intended
              use of proceeds. Later public evidence shows continued rollout, but not a new
              independent valuation mark or a corroborated peer set with disclosed terms. That
              means upside today depends on believing management-sourced operating metrics will
              persist through expansion without a public downside-protection bridge. The brand's
              sustainability positioning and customer-traffic story may justify investor
              interest, yet the underwriting burden still sits on unverified cohort economics
              and undisclosed financing structure.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario ranges
        blocks:
          - type: paragraph
            body: |-
              Scenario framing should stay coarse because the input set is coarse. The bull case
              requires the 2025 price marker to prove conservative: unit growth must continue
              beyond the 100-plus store base, drive-thru and marketing gains must keep traffic
              positive, and traditional-store margins must hold at or above the publicly cited
              level. The base case assumes the company remains high quality but the market
              demands more proof, keeping value around or somewhat below the last $1 billion
              mark until audited economics and round terms are visible. The bear case is not a
              demand-collapse story alone; it is a structure-plus-execution problem in which
              service inconsistency, slowed comps, or a structured insider round exposes that
              the headline mark overstated common-equity value.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: Diligence asks and thesis breakers
        blocks:
          - type: paragraph
            body: |-
              Before underwriting an entry, an investor should force three concrete workstreams.
              First, reconcile the round structure: current cash, debt, leases, liquidation
              preferences, anti-dilution, and any 2026 insider financing matter more than the
              headline valuation. Second, test whether the cited store economics survive cohort
              analysis by format, market, and channel mix, especially as drive-thru expands.
              Third, pressure-test service consistency and delivery economics, because even
              one-location review evidence shows the downside of fees, quality misses, and
              third-party channel disappointment. A thesis break would be any combination of
              weakening same-store traffic, sub-20% mature-store margins, an externally visible
              down-round or structured recap, or expansion that raises unit count without
              preserving guest experience.
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track until price support broadens
            body: >-
              The current public record supports staying close to the company, but not paying the headline mark. The
              durable external valuation anchor is still the February 2025 round at about 5.1x the $195M revenue figure
              recorded by Multiples.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV013
              - CV014
          - type: callout
            title: Structure opacity matters more than brand momentum
            body: >-
              Missing cash, debt, lease, and preference-stack detail can matter more than visible store growth because
              those terms determine whether common-equity upside exists at the same headline valuation.
            calloutType: risk
            claimRefs:
              - CV011
              - CV013
              - CV015
