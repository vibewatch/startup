  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >
              The investable market is narrower than restaurants, wellness, or foodservice as a whole. Just Salad
              competes for prepared lunch and dinner occasions in which consumers value health, speed, customization,
              and portability; its relevant substitutes include traditional quick service, adjacent healthy fast casual,
              delivery, and grocery or home-prepared meals for the same occasion. The product boundary is broader than
              salads because public descriptions include wraps, warm bowls, market plates, soups, smoothies, and
              rotating seasonal recipes. Sustainability is a customer-facing differentiator through reusable bowls and
              carbon labeling, but it should not be counted as a separate pool of spend. This boundary keeps the
              analysis tied to occasions the concept can actually win rather than treating every restaurant dollar as
              addressable.
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM011
              - CM012
              - CM014
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >
              The assigned sources contain no independent category estimate that cleanly isolates Just Salad's TAM, SAM,
              or SOM by geography, daypart, or format. The stronger sizing approach therefore triangulates realized
              chain sales, store count, average unit volume, openings, and format tests. Restaurant Business reported
              $150 million of 2023 sales and an 81-unit base in April 2024, while Bloomberg reported 19 openings during
              2024. By January 2026, Nation's Restaurant News reported more than 100 locations and management-described
              traditional-unit economics near $2.2 million of average unit volume with margins north of 20%. These
              observations prove meaningful demand and expansion capacity, but they do not quantify the remaining
              opportunity or establish that every new cohort will reproduce mature-store economics.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM016
