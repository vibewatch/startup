        title: Milestones, momentum, and current risk signals
        blocks:
          - type: paragraph
            body: >-
              The dated milestones show a concept that has compounded narrative depth over two decades: the founding
              story, sustainability programs, product collaborations, a major 2025 financing, drive-thru
              experimentation, D.C. expansion, and celebrity-equity marketing all contribute to the current growth
              story. The main public caution signal in the assigned pool is not a fresh legal or regulatory event, but
              an execution-and-liquidity question: Ion Analytics reports that the company is exploring an IPO while also
