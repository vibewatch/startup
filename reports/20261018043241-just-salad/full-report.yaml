              - CM015
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >
              For most transactions, the buyer, user, and payer are the same consumer choosing an individual meal in
              store, through the app, or through a delivery marketplace. The use case changes at the edge: a household
              decision-maker can choose a drive-thru meal for convenience, while a loyalty member responds to app
              rewards and repeat-purchase incentives. Just Salad's Washington opening and seasonal chef collaboration
              illustrate how geographic expansion, digital rewards, product rotation, and plant-forward positioning can
              support trial and frequency. The first drive-thru's reported sales lift is the clearest evidence that a
              new access format can expand demand, although one pilot cannot establish repeatability across sites.
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >
              The principal growth drivers are store expansion, movement from urban cores into adjacent suburban and
              drive-thru occasions, menu breadth, and capital available for new units and technology. The constraints
              are equally material. Fresh on-site preparation and a stated lack of automation can preserve product
              quality but raise labor and execution demands, while drive-thru speed and customization create operational
              tradeoffs. Consumer evidence is mixed rather than uniformly positive: Tripadvisor displayed a 4.0 rating
              across 30 reviews, but a July 2026 delivery review reported missing items, added fees, and disappointing
              food. Ion Analytics also reported that a possible IPO would be judged against Sweetgreen and category
              sentiment. Valuation therefore depends on replicating unit economics and service quality, not merely on
              opening more stores.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Traction is observable; remaining whitespace is not
            body: >-
              Public evidence supports demand and unit expansion, but an investment case still needs independent
              category sizing and cohort-level unit economics before converting footprint momentum into a precise SOM.
            calloutType: insight
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
          - type: callout
            title: One successful format test is not a rollout curve
            body: >-
              The first drive-thru's reported lift is encouraging, yet site availability, speed, customization, labor,
              and service consistency remain replication risks.
            calloutType: risk
            claimRefs:
              - CM009
              - CM010
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: one named public comp, several real substitutes, and major evidence gaps'
        blocks:
          - type: paragraph
            body: >-
              The assigned pool names only one direct public comparator: Ion Analytics says Just Salad is likely to be
              compared with Sweetgreen if it pursues an IPO, while Nation's Restaurant News separately reports that
              management explicitly contrasts its operating approach with Sweetgreen's automation push. That is enough
              to establish the direct-peer frame, but not enough to fill in a full peer set with sourced pricing,
              feature depth, or unit economics for adjacent chains such as other healthy fast-casual incumbents. The
              pool is stronger on substitute paths. Management's comment that salad is still in the "early innings" of
              replacing the sandwich as the default lunch item implies that status-quo lunch choices remain a real
              competitive set, not merely other salad brands. Delivery marketplaces are also part of the buyer's option
              set because management is actively tuning DoorDash and Uber Eats spend while a Tripadvisor review shows
              the channel can carry visible fees and quality tradeoffs. Internal build, employer cafeteria substitution,
              and likely entrants remain unresolved because the assigned pool contains no direct evidence on those
              categories.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP012
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP009
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
