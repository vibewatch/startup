      - number: '4.2'
        title: Unit economics and channel signals
        blocks:
          - type: paragraph
            body: >-
              The most encouraging public evidence is at the store level. At ICR, management said traditional locations
              generate close to $2.2 million in average unit volumes, margins north of 20%, and historical cash-on-cash
              returns of about 50%, while same-store sales were described as double-digit in every year since 2018
              except 2020 and 2025. The first drive-thru reportedly produced a 30%-plus sales lift, which supports
              another four to six drive-thru openings in 2026 if the format scales operationally. The weak point is
              channel economics: the assigned pool provides no audited CAC, payback, commission, refund, or
              realized-price bridge, and customer-side evidence suggests delivery can materially raise the end price.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Capital needs and adequacy
        blocks:
          - type: paragraph
            body: >-
              Just Salad is not presenting as capital-starved in public, but it is also not transparent enough to clear
              a real adequacy test. The company said the February 2025 raise brought in $200 million at roughly a $1
              billion valuation and would fund new units, technology, menu innovation, and customer experience. By
              mid-2026, the company was still publicizing fresh investor interest around Jalen Brunson, and Multiples
              logged an additional undisclosed-stage round led by Brunson in June 2026. That supports continued
              financing access, but not self-funding durability, because the assigned public sources do not disclose
              cash on hand, burn, debt, lease obligations, or committed project finance.
            claimRefs:
              - CI001
              - CI002
              - CI016
      - number: '4.4'
        title: Underwriting verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The financial story is directionally positive but still incomplete. Public evidence supports a concept
              that can grow through new stores and format expansion, and management commentary implies strong four-wall
              economics. At the same time, the most important diligence items are either private or internally
              inconsistent across trackers: reconciled revenue, cumulative funding, current cash, fixed obligations,
              realized pricing by channel, and enterprise overhead absorption. The correct verdict is therefore not
              "weak economics" but "promising economics with limited verification." A serious investor should treat the
              public unit metrics as hypotheses to validate rather than as an underwriting-ready model.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI008
              - CI009
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public unit metrics imply the expansion story could work
            body: >-
              The AUV, margin, and cash-on-cash figures are strong enough to justify serious follow-up, but they should
              be treated as management claims until store-level cohorts and accounting definitions are verified.
            calloutType: insight
            claimRefs:
              - CI008
              - CI009
              - CI010
          - type: callout
            title: Capital adequacy is still not publicly underwritable
            body: >-
              A large 2025 raise and fresh 2026 investor interest do not substitute for current cash, debt, lease, and
              runway disclosure. The tracker disagreement on revenue and funding totals reinforces that gap.
            calloutType: risk
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and customer workflow
        blocks:
          - type: paragraph
            body: >
              Just Salad’s deliverable is broader than a single salad SKU: the current public menu and current-location
              release describe a consumer offer spanning salads, wraps, warm bowls, Market Plates, soups, smoothies, and
              rotating chef-designed items, while third-party descriptions also emphasize made-to-order customization
              and a large toppings set. The workflow is still store-first rather than app-first. Public evidence points
              to a line-based assembly model where guests can choose predesigned items or build their own, then layer in
              reusable-bowl incentives and order-ahead behavior through the app. The official press archive also shows
              that menu collaborations and sustainability initiatives are recurring product-marketing surfaces, although
              public materials do not quantify their contribution to order frequency or mix.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE013
              - CE014
              - CE015
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
