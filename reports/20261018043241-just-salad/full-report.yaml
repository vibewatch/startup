chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence consistently identifies Just Salad as a New York-founded fast-casual restaurant
              brand built around salads but no longer limited to that category. The official about page says the concept
              began in 2006 and now offers salads, bowls, wraps, soups, and smoothies across more than 100 locations in
              seven states, while the 2025 capital-raise release repeats the same plant-centric, accessibility, and
              sustainability positioning. That matters because later chapters can treat the company as a scaled
              omnichannel restaurant concept with a sustainability-led consumer brand, not as a small niche salad shop
              or a pure technology business.
