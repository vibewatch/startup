  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how traffic and channel choices appear to translate into store-level economics, but not into
      a fully disclosed company P&L.
    data:
      nodes:
        - id: demand
          label: Brand and traffic demand
          note: >-
            Same-store sales were described as positive every year since 2018 except the pandemic year, with 2025 still
            positive.
        - id: channels
          label: Order channels
          note: >-
            In-store, loyalty/app usage, delivery marketplaces, and drive-thru are all visible in the assigned source
            pool.
        - id: ticket
          label: Ticket and mix
          note: >-
            Public pricing evidence is mostly promotional or customer-side, so realized check composition remains
            private.
        - id: revenue
          label: Restaurant revenue
          note: Multiples attached $195M revenue to the February 2025 round, but other trackers estimate lower levels.
          value: 195
          unit: $M tracker revenue
        - id: unit-margin
          label: Store-level contribution proxy
          note: Traditional locations were described as having margins north of 20%.
          value: 20
          unit: '%+ unit margin'
        - id: returns
          label: Capital returns proxy
          note: Management said historical cash-on-cash returns were about 50%.
          value: 50
          unit: '% cash-on-cash'
      edges:
        - from: demand
          to: channels
          label: converts into
        - from: channels
          to: ticket
          label: shapes
        - from: ticket
          to: revenue
          label: aggregates into
        - from: revenue
          to: unit-margin
          label: less operating costs
        - from: unit-margin
          to: returns
          label: supports
    approximationNotes: >-
      This is not a complete waterfall. The assigned public sources do not disclose realized ticket mix, delivery
      commissions, corporate overhead, working capital, or capex by format, so the figure shows sourced operating
      checkpoints rather than a full P&L bridge.
    claimRefs:
      - CI004
      - CI008
      - CI009
      - CI010
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The product stack layers customer-facing menu breadth on top of manual store execution, digital loyalty, and a
      sustainability-led rollout system.
    data:
      layers:
        - label: Customer offer layer
          detail: Chef-designed and customizable meal formats define the visible product.
          modules:
            - Salads and wraps
            - Warm bowls and Market Plates
            - Soups, smoothies, and rotating specials
          outputs:
            - Broad lunch-to-dinner coverage
        - label: Store execution layer
          detail: Fresh-prep and manual assembly turn ingredients into a fast-casual workflow.
          modules:
            - Prepped-daily produce
            - House-made dressings
            - Overnight-marinated proteins
            - Manual assembly with no automation
          outputs:
            - Customization
            - Fast line throughput
        - label: Digital and loyalty layer
          detail: The app, rewards, and recommendation tools sit on top of store operations rather than replacing them.
          modules:
            - Order-ahead app
            - JS Rewards stamp program
            - GPT-4o meal recommendations
          outputs:
            - Re-order convenience
            - Personalized meal discovery
        - label: Format extension layer
          detail: The drive-thru format extends suburban convenience while retaining the manual food-production model.
          modules:
            - Drive-thru format
            - Three-minute service target
          outputs:
            - Off-premise convenience
        - label: Sustainability layer
          detail: Reuse incentives and menu carbon labels make sustainability part of the customer-facing product.
          modules:
            - MyBowl reusable program
            - Menu carbon labels
            - B Corp certification
          outputs:
            - Sustainability-led positioning
        - label: Store replication layer
          detail: Architecture and development processes translate the concept into repeatable multi-market locations.
          modules:
            - Refined construction documents
            - Landlord and jurisdiction coordination
            - Design and construction pipeline
          outputs:
            - Multi-market replication
    approximationNotes: >-
      This diagram summarizes public operating components only; it does not imply disclosed internal systems, vendors,
      or data flows beyond the assigned evidence pool.
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE016
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The observable journey runs from awareness through trial, repeat use, channel expansion, and advocacy, but the
      public record still lacks quantified retention economics.
    data:
      items:
        - label: Awareness
          touchpoints:
            - Healthy, sustainable fast-casual positioning in major metros
            - Jalen Brunson campaign framing early fans as part of the brand story
        - label: Trial
          touchpoints:
            - New-store promotions such as giveback days and $5 meal windows
            - Fresh-ingredients and speed reviews at mature Manhattan locations
        - label: Habit
          touchpoints:
            - JS Rewards monthly freebies, mystery bowl items, and stamp unlocks
            - Positive same-store sales and review recency as directional repeat-visit proxies
        - label: Channel expansion
          touchpoints:
            - Drive-thru convenience with 30%+ sales lift at the first site
            - DoorDash / Uber Eats marketing optimization and delivery feedback loops
        - label: Daypart expansion
          touchpoints:
            - Market Plates and chef collaborations extend the concept beyond core lunch salads
            - Non-salad bowls, wraps, and smoothies account for half of reported sales
        - label: Advocacy
          touchpoints:
            - Celebrity-fan endorsement plus early-believer messaging
            - Travelers' Choice / review visibility that can reinforce word of mouth
    claimRefs:
      - CU006
      - CU009
      - CU010
      - CU011
      - CU014
      - CU015
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual risks cluster around rollout execution, capital deployment, and under-disclosed control
      surfaces.
    data:
      columns:
        - label: Likelihood (1-5)
          detail: 5 is most likely to impair the plan.
        - label: Impact (1-5)
          detail: 5 is most damaging to the underwriting case.
        - label: Mitigation maturity (1-5)
          detail: 5 is best-evidenced mitigation maturity.
      rows:
        - label: Drive-thru / new-unit consistency risk
          values:
            - 4
            - 4
            - 3
          note: >-
            30%+ drive-thru lift and 4-6 more planned, but the format must still hit 3-minute service and fresh-prep
            standards.
        - label: Delivery / marketplace service-quality risk
          values:
            - 4
            - 3
            - 2
          note: Customer complaints and marketplace dependence are visible; public platform-quality metrics are not.
        - label: Capital deployment versus valuation expectations
          values:
            - 3
            - 5
            - 2
          note: The company raised $200 million at an approximately $1 billion valuation for growth and technology.
        - label: Privacy / security disclosure-gap risk
          values:
            - 2
            - 4
            - 1
          note: >-
            Assigned public evidence confirms app-led rewards but not current controls, incident history, or
            certifications.
        - label: Supplier / sustainability execution risk
          values:
            - 3
            - 3
            - 3
          note: >-
            The concept depends on daily prep, aligned suppliers, and sustainability positioning that can weaken if
            sourcing or substitutions slip.
        - label: Brand-collaboration dependency risk
          values:
            - 3
            - 2
            - 2
          note: >-
            Chef, nonprofit, and athlete partnerships help awareness, but public evidence does not prove durable
            retention from those campaigns.
    approximationNotes: Scores are analyst synthesis from the cited sources rather than disclosed company ratings.
    claimRefs:
      - CR001
      - CR003
      - CR008
      - CR009
      - CR011
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: A usable expansion story exists, but the public valuation anchor is still too thin for a buy call.
    data:
      nodes:
        - label: Scale proof
          detail: >-
            Close to 100 units in February 2025 and more than 100 locations by January 2026 show a scaled concept with
            ongoing rollout.
          claimRefs:
            - CV007
            - CV012
        - label: Economics signal
          detail: NRN cited about $2.2M AUVs, >20% traditional-store margins, and roughly 50% historical cash-on-cash returns.
          claimRefs:
            - CV005
        - label: Expansion levers
          detail: A 30%+ sales lift from the first drive-thru and a second D.C. store suggest real whitespace.
          claimRefs:
            - CV006
            - CV007
        - label: Brand support
          detail: Traffic-led same-store sales gains and sustainability positioning support customer demand.
          claimRefs:
            - CV008
            - CV009
        - label: Price constraint
          detail: The last public mark is about $1B, and Multiples pegs it at 5.1x on $195M of recorded revenue.
          claimRefs:
            - CV002
            - CV003
            - CV014
        - label: Recommendation
          detail: Track only until term-sheet transparency or a better entry point broadens the public support for valuation.
          claimRefs:
            - CV011
            - CV013
            - CV015
    approximationNotes: The figure is a qualitative decision chain rather than a mathematical valuation model.
    claimRefs:
      - CV003
