              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE016
      - number: '5.3'
        title: Differentiation and control gaps
        blocks:
          - type: paragraph
            body: >
              Public differentiation is clearest in sustainability and light digital tooling. Third-party and compiled
              sources tie Just Salad to MyBowl reuse, menu carbon labeling, B Corp certification, and a GPT-4o-based
              recommendation feature in the mobile app. Those elements create a branded operating layer that competitors
              cannot copy overnight, but they do not amount to a deep technical moat on their own. The more material
              underwriting question is controls: the assigned evidence pool does not document payment-security
              architecture, privacy governance for app or AI data, formal uptime/status reporting, or measurable
              delivery-quality controls. As a result, investors can see the customer promise and store rollout story,
              but not the backend control environment needed to judge whether the concept scales without hidden quality
              or compliance slippage.
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
              - CE014
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is operational, digital-light, and sustainability-led
            body: >-
              The strongest public moat is the combination of customizable fresh-prep execution, reusable-bowl
              economics, carbon-labeled menus, and a recognizable sustainability brand, not proprietary kitchen
              automation or a documented software stack.
            calloutType: insight
            claimRefs:
              - CE002
              - CE005
              - CE009
              - CE010
              - CE011
              - CE012
          - type: callout
            title: Control evidence lags the growth and product story
            body: >-
              The public record supports a real expansion and format-development engine, but it does not show the
              privacy, security, uptime, or quality-control detail needed to underwrite AI, app ordering, drive-thru,
              and manual store execution with high confidence.
            calloutType: risk
            claimRefs:
