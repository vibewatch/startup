      - number: '1.2'
        title: Leadership, founder story, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Nick Kenner is the only operating leader who appears repeatedly across the assigned public materials,
              where he is presented as founder or co-founder, CEO, fundraiser, and chief operating voice. Public founder
              evidence also points to Rob Crespi as the 2006 co-founder, but the assigned pool does not show a current
              executive or governance role for him. Governance visibility is otherwise thin: there is no public board
              roster, no disclosed voting-control map, and no public explanation of which investors hold seats,
              observers, or protective rights. The chapter therefore treats Kenner as a meaningful key-person dependency
              and flags broader governance structure as a diligence gap rather than inferring it from the financing
              headlines.
