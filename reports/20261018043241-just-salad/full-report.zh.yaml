            body: >-
              公开证据支持把 Just Salad 视为真实的规模化概念，而不是只讲故事的股票。2025 年 2 月融资的独立报道、后续行业访谈和 2026 年 3 月开店共同表明，公司已从接近 100 家门店增长到超过
              100 家，并伴随客流驱动的同店销售增长、得来速提升超过 30%，以及传统门店 AUV 约 220 万美元、利润率超过 20%
              的说法。这足以支持持续尽调，但不足以支持今天按完整标题估值买入，因为材料中唯一具体的估值锚点仍是 2025 年 2 月约 10
              亿美元融资，公开记录仍缺失现金、租赁、债务和优先权结构细节。仅依据公开证据，正确立场是跟踪：等待更好价格，或等待管理层就结构和门店批次经济性开放数据室后再接触。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV013
              - CV015
