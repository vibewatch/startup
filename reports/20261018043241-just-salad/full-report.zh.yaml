        - label: 2026 年得来速复制测试
          displayValue: 4-6 planned
          note: 在一项试点据报道带来 30%+ 提升后，计划增加得来速门店。
    approximationNotes: 这些层级是依次展开的证据视角，不是嵌套或相加的 TAM/SAM/SOM 区间。数值采用不同单位和期间，收窄幅度表达的是作者设定的顺序，而非规模大小。
    claimRefs:
      - CM001
      - CM003
      - CM004
      - CM006
      - CM007
      - CM009
      - CM015
  - id: FP001
    title: 基于已分配证据池的竞争定位图
    type: quadrant
    summary: 该序数图展示已分配证据池中实际可观察到的主要解决路径和可比对象。
    data:
      xAxis:
        label: 可观察规模 / 买方可及性
        min: 1
        max: 5
        lowLabel: niche / episodic
        highLabel: scaled / broadly available
        description: >-
          Ordinal score derived only from public reach, unit count, and channel-availability signals in the assigned
          pool.
      yAxis:
        label: 可观察差异化证明
        min: 1
        max: 5
        lowLabel: commodity / thin proof
        highLabel: clear public differentiation signals
        description: Ordinal score derived only from assigned-pool evidence; it is not a market-share or quality ranking.
      points:
        - label: Just Salad 核心门店网络
          x: 4.4
          'y': 4.6
          detail: 2026 年有 125 个地点，另有可重复使用餐碗、碳标签和厨师设计菜单的证明。
        - label: Sweetgreen 公开可比公司
          x: 4.7
          'y': 3.5
          detail: 证据池中唯一明确点名的直接同行；其定位偏向自动化。
        - label: Just Salad 得来速形态
          x: 3.8
          'y': 4
          detail: 首个地点销售额提升 30%+，2026 年计划再开 4 至 6 家。
        - label: 配送平台路径
          x: 4.3
          'y': 2
          detail: 覆盖面广，但服务费上涨和质量投诉可能压缩价值。
        - label: 现状三明治 / 附近午餐
          x: 4.8
          'y': 1.6
          detail: 管理层将沙拉描述为仍在努力取代三明治，成为默认午餐选择。
        - label: 季节性厨师合作路径
          x: 2.8
          'y': 3.7
          detail: 合作带来新鲜感，但证据池没有显示出坚固护城河。
    approximationNotes: 坐标是基于已分配证据池的序数判断，不是有来源支持的市场份额测量，也不是点名同行的财务排名。
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP007
      - CP009
      - CP010
      - CP012
      - CP013
  - id: FI001
    title: 收入模型桥接图
    type: flow
    summary: 公开证据显示，客流和渠道选择似乎如何转化为门店层面经济性，但尚不足以还原完整披露的公司损益表。
    data:
      nodes:
        - id: demand
          label: 品牌与客流需求
          note: 除疫情年份外，外部描述称自 2018 年以来每年同店销售均为正，2025 年仍保持正增长。
        - id: channels
          label: 订单渠道
          note: 已分配来源池中可见店内消费、忠诚度 / App 使用、配送平台和得来速。
        - id: ticket
          label: 客单价与结构
          note: 公开定价证据主要来自促销或客户侧，因此实际结账构成仍属非公开信息。
        - id: revenue
          label: 餐厅收入
          note: Multiples 将 $195M 收入与 2025 年 2 月融资联系起来，但其他追踪机构估算的水平更低。
          value: 195
          unit: $M tracker revenue
        - id: unit-margin
          label: 门店层面贡献代理指标
          note: 据描述，传统门店利润率超过 20%。
          value: 20
          unit: '%+ unit margin'
        - id: returns
          label: 资本回报代理指标
          note: 管理层称历史现金回报率约为 50%。
          value: 50
          unit: '% cash-on-cash'
      edges:
        - from: demand
          to: channels
          label: 转化为
        - from: channels
          to: ticket
          label: 塑造
        - from: ticket
          to: revenue
          label: 汇总为
        - from: revenue
          to: unit-margin
          label: 扣除运营成本
        - from: unit-margin
          to: returns
          label: 支撑
    approximationNotes: 这不是完整的瀑布图。已分配的公开来源没有披露实际客单结构、配送佣金、公司层面管理费用、营运资金或按形态拆分的资本开支，因此该图展示的是有来源的运营检查点，而不是完整损益桥。
    claimRefs:
      - CI004
      - CI008
      - CI009
      - CI010
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 产品栈以面向客户的菜单广度为上层，底下依托门店人工执行、数字忠诚度体系和以可持续性为核心的复制系统。
    data:
      layers:
        - label: 客户产品层
          detail: 厨师设计、可定制的餐食形态构成可见产品。
          modules:
            - 沙拉和卷饼
            - 热碗和 Market Plates
            - 汤、冰沙和轮换特餐
          outputs:
            - 覆盖从午餐到晚餐的广泛场景
        - label: 门店执行层
          detail: 新鲜备料和人工组装，将食材变成精品快餐工作流。
          modules:
            - 每日准备的农产品
            - 自制调味汁
            - 隔夜腌制蛋白
            - 无自动化的人工组装
          outputs:
            - 定制化
            - 快速出餐
        - label: 数字与忠诚度层
          detail: App、奖励和推荐工具叠加在门店运营之上，而不是取代门店运营。
          modules:
            - 提前点餐 App
            - JS Rewards 集章计划
            - GPT-4o 餐食推荐
          outputs:
            - 便捷复购
            - 个性化餐食探索
        - label: 形态延伸层
          detail: 得来速形态延伸郊区便利性，同时保留人工生产食物的模式。
          modules:
            - 得来速形态
            - 三分钟服务目标
          outputs:
            - 店外消费便利性
        - label: 可持续性层
          detail: 可重复使用激励和菜单碳标签，让可持续性成为面向客户的产品组成部分。
          modules:
            - MyBowl 可重复使用计划
            - 菜单碳标签
            - B Corp 认证
          outputs:
            - 可持续性定位
        - label: 门店复制层
          detail: 架构和开发流程将概念转化为可在多个市场复制的门店。
          modules:
            - 完善的施工文件
            - 房东与司法辖区协调
            - 设计和施工管线
          outputs:
            - 多市场复制
    approximationNotes: 该图仅总结公开运营组成部分；除已分配证据池外，不意味着公司披露了内部系统、供应商或数据流。
    claimRefs:
      - CE001
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 可观察的旅程从认知、试用延伸到复购、渠道扩张和倡导，但公开记录仍缺乏量化的留存经济性。
    data:
      items:
        - label: 认知
          touchpoints:
            - 大都市中的健康、可持续精品快餐定位
            - Jalen Brunson 的宣传叙事，将早期粉丝塑造成品牌故事的一部分
        - label: 试用
          touchpoints:
            - 新店促销，例如回馈日和 $5 餐时段
            - 曼哈顿成熟门店关于新鲜食材和速度的评价
        - label: 习惯
          touchpoints:
            - JS Rewards 每月免费赠品、神秘碗菜品和集章解锁
            - 正向同店销售和近期评价，作为重复到店的方向性代理指标
        - label: 渠道扩张
          touchpoints:
            - 得来速便利性，首个地点销售额提升 30%+
            - DoorDash / Uber Eats 营销优化和配送反馈闭环
        - label: 消费时段扩张
          touchpoints:
            - Market Plates 和厨师合作让概念超越核心午餐沙拉
            - 非沙拉碗、卷饼和冰沙占报告销售额的一半
        - label: 倡导
          touchpoints:
            - 名人粉丝背书与早期信徒传播
            - Travelers' Choice / 评价曝光，可进一步强化口碑传播
    claimRefs:
      - CU006
      - CU009
      - CU010
      - CU011
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的区域集中在扩张执行、资本部署和披露不足的控制环节。
    data:
      columns:
        - label: 可能性（1-5）
          detail: 5 代表最可能损害计划。
        - label: 影响（1-5）
          detail: 5 代表对投资判断损害最大。
        - label: 缓解措施成熟度（1-5）
          detail: 5 代表证据最充分的缓解成熟度。
      rows:
        - label: 得来速 / 新店一致性风险
          values:
            - 4
            - 4
            - 3
          note: 得来速销售额提升 30%+，并计划再开 4-6 家，但形态仍必须达到 3 分钟服务和新鲜备料标准。
        - label: 配送 / 平台服务质量风险
          values:
            - 4
            - 3
            - 2
          note: 客户投诉和对平台的依赖都已显现；公开的平台质量指标尚不存在。
        - label: 资本部署与估值预期
          values:
            - 3
            - 5
            - 2
          note: 公司以约 $1B 估值融资 $200 million，用于增长和技术。
        - label: 隐私 / 安全披露缺口风险
          values:
            - 2
            - 4
            - 1
          note: 已分配的公开证据确认 App 驱动的奖励体系，但没有确认当前控制措施、事故历史或认证。
        - label: 供应商 / 可持续性执行风险
          values:
            - 3
            - 3
            - 3
          note: 这一概念依赖每日备料、协同的供应商和可持续性定位；如果采购或替代品管理失误，这些基础可能减弱。
        - label: 品牌合作依赖风险
          values:
            - 3
            - 2
            - 2
          note: 厨师、非营利组织和运动员合作有助于提升认知，但公开证据无法证明这些活动能带来持久留存。
    approximationNotes: 分数是分析师根据引用来源综合得出，并非公司披露的评级。
    claimRefs:
      - CR001
      - CR003
      - CR008
      - CR009
      - CR011
      - CR012
      - CR014
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 存在可用的扩张故事，但公开估值锚点仍过于薄弱，无法给出买入判断。
    data:
      nodes:
        - label: 规模证明
          detail: 2025 年 2 月接近 100 家门店，2026 年 1 月超过 100 个地点，显示概念已具规模且仍在持续扩张。
          claimRefs:
            - CV007
            - CV012
        - label: 经济性信号
          detail: NRN 提到约 $2.2M 的 AUV、超过 20% 的传统门店利润率，以及约 50% 的历史现金回报率。
          claimRefs:
            - CV005
        - label: 扩张杠杆
          detail: 首家得来速销售额提升 30%+，以及第二家华盛顿特区门店，说明仍有真实的空白市场。
          claimRefs:
            - CV006
            - CV007
        - label: 品牌支撑
          detail: 客流带动的同店销售增长和可持续性定位支撑客户需求。
          claimRefs:
            - CV008
            - CV009
        - label: 价格约束
          detail: 最近一次公开估值约为 $1B，Multiples 按 $195M 记录收入给出 5.1x。
          claimRefs:
            - CV002
            - CV003
            - CV014
        - label: 推荐
          detail: 只有在条款透明度提升或出现更好的入场点、扩大公开估值支持前，继续观察。
          claimRefs:
            - CV011
            - CV013
            - CV015
    approximationNotes: 该图是定性决策链，而不是数学估值模型。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV009
      - CV011
      - CV013
      - CV014
      - CV015
