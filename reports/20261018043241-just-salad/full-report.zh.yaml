      - number: '2.2'
        title: 受证据约束的市场规模测算
        blocks:
          - type: paragraph
            body: >
              指定来源没有按地域、时段或业态清晰拆分 Just Salad TAM、SAM 或 SOM
              的独立品类估算。因此，更可靠的测算方法是交叉参考已实现的连锁销售额、门店数、平均单店销售额、新店开设和业态测试。Restaurant Business 报道公司 2023 年销售额为 1.5 亿美元，2024 年
              4 月门店基数为 81 家；Bloomberg 报道公司 2024 年开设了 19 家门店。到 2026 年 1 月，Nation's Restaurant News 报道门店超过 100 家，管理层描述传统门店
              AUV 接近 220 万美元、利润率超过 20%。这些观察证明需求和扩张能力具有一定规模，但无法量化剩余机会，也不能证明每一批新店都能复制成熟门店的经济性。
