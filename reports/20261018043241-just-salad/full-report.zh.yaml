  customerFocus: 偏好健康餐饮的休闲快餐消费者，尤其是城市和郊区商圈的午餐、晚餐客群。
  businessModel: 以公司直营餐厅销售为主，并由 App 点单、会员体系、得来速和第三方配送渠道支持。
