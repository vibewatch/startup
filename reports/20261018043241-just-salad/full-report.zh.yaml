companyProfile:
  summary: >-
    Just Salad 是一家源自纽约的休闲快餐连锁，2006 年创立后已扩展为拥有 125 多家门店的餐饮品牌，覆盖沙拉、碗餐、卷饼、汤和冰沙。公开记录显示，该品牌以可持续发展为核心，通过可重复使用的餐碗和碳标签形成差异化；2025
    年融资估值约 10 亿美元，业态也明显扩展至得来速和店外便利场景。但其所有权、资产负债表结构和客户经济性仍不透明。
