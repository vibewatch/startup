            body: >-
              当前报道并不只是把 Just Salad 描述为健康餐饮连锁；报道明确称公司可能与 Sweetgreen 比较，且品类情绪受到 Sweetgreen
              交易表现影响。因此，公开可比对象预期已经是今天竞争格局的一部分，而不只是未来融资问题。
            calloutType: insight
            claimRefs:
