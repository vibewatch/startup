      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 门店数量继续增长 100+，传统门店利润率维持在 20% 以上，得来速和营销继续推动客流为正。
        - 只有后续尽调确认公开经济性故事，估值超过 $1.2B，或按 2025 年 2 月公开收入标记 $195M 计算超过 6x，才具有合理性。
        - 形态复杂度、人工成本和估值倍数压缩。
        - 需要经审计的经济性数据和清晰的融资条款；仅凭当前公开记录无法支持。
      - - 基准
        - 公司继续增加门店和销售额，但投资者要求更充分的披露，才愿意支付高于上次估值的价格。
        - $0.8B-$1.0B，或按同一公开收入标记计算约 4x-5x，意味着相对于表面估值，短期上行空间有限。
        - 没有同业可比表、没有经审计现金流，加上优先权不透明，都会封顶回报。
        - 最符合当前证据集。
      - - 悲观
        - 客流走弱、服务一致性下降，或结构化内部轮次显示，相比普通股存在更强的下行保护。
        - <$0.8B，或按同一公开收入标记低于 4x；若优先权很重，普通股的经济性会更差。
        - 配送体验不佳、执行压力和融资结构。
        - 如果尽调推翻访谈层面的经济性，或发现融资轮次悬置风险，则该情景具有实质可能。
    notes: 指示性区间是分析师综合判断，锚定最近一次公开的 $1B 估值和 Multiples 的 $195M 收入数字；它们不是市场报价，也不是公平意见。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV009
      - CV010
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 已分配的公开证据展现了公司从纽约创立到高估值精品快餐连锁的二十年轨迹，其间尝试新形态，并保留 IPO 选择权。
    data:
      items:
        - date: '2006'
          label: 在纽约市创立
          detail: 官方及第三方来源均将公司起源定位于 2006 年的纽约市，使命是提供健康、人人可负担的餐食。
          tone: positive
        - date: '2016'
          label: 与 Panda 的关系开始
          detail: Wikipedia 称 Panda Restaurant Group 在 2016 年前已完成投资，由此建立早期战略资本关系，随后才有更多轮融资。
          tone: neutral
        - date: '2020'
          label: 碳标签里程碑
          detail: Wikipedia 称 Just Salad 在 2020 年成为首家展示菜单食品碳足迹的餐饮连锁。
          tone: positive
        - date: '2021'
          label: Closed Loop / Panda 支持的融资
          detail: Closed Loop 的公告称，该品牌当时有 47 个地点，并计划在未来两年将门店覆盖翻倍，同时扩大零废弃举措。
          tone: positive
        - date: '2023'
          label: B Corporation 认证
          detail: Wikipedia 将 2023 年 B Corporation 认证概括为正式的可持续性资质，叠加在可重复使用餐碗和碳标签故事之上。
          tone: positive
        - date: '2024-01-02'
          label: Amanda Cohen Veganuary 合作
          detail: 一份联合发布的公司新闻稿宣布，Dirt Candy 合作属于冬季菜单和更广泛产品创新的一部分。
          tone: positive
        - date: '2025'
          label: $200M 融资，估值约 $1B
          detail: 公司发布及独立来源均指向 2025 年一轮融资，由 Wellington Management 领投，D1、Neuberger Berman 和 Stripes 参与。
          tone: positive
        - date: '2025'
          label: 首家得来速门店开业
          detail: NRN 报道，首家得来速门店于 2025 年初开业，为该连锁开启新的形态测试。
          tone: warning
        - date: '2026-01-21'
          label: 门店规模超过 100 家，并计划增加得来速
          detail: NRN 称该连锁已拥有超过 100 个地点，并表示管理层预计 2026 年再开 4 至 6 家得来速门店。
          tone: positive
        - date: '2026-03-30'
          label: 华盛顿特区第二个地点
          detail: F Street 门店开业后，Just Salad 在该地区拥有第二个地点，显示其仍在持续加密地理覆盖。
          tone: positive
        - date: '2026-06-30'
          label: Jalen Brunson 投资新闻
          detail: Just Salad 的新闻页面重点报道了 Knicks 球星 Jalen Brunson 投资该品牌的媒体报道。
          tone: neutral
        - date: '2026'
          label: IPO 探索浮出水面
          detail: Ion Analytics 报道，Just Salad 正在探索 IPO，但时间安排和公开市场接受度仍不确定。
          tone: risk
    claimRefs:
