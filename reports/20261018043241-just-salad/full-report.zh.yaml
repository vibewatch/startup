  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >
              可投资市场比整个餐饮、健康生活或餐饮服务行业更窄。Just Salad
              争夺的是消费者重视健康、速度、定制和便携性的午餐与晚餐场景；相关替代品包括传统快餐、相邻的健康休闲快餐、配送，以及同一场景下的杂货或家庭备餐。产品边界也不止沙拉，因为公开描述还包括卷饼、热碗餐、Market
              Plates、汤、冰沙和轮换季节菜单。可重复使用的餐碗和碳标签构成面向消费者的可持续差异化，但不应将其算作一块独立的消费支出池。这样的边界把分析限定在品牌实际能够赢得的消费场景，而不是把每一笔餐饮消费都视为可触达市场。
            claimRefs:
              - CM001
              - CM002
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
