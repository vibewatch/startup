      - number: '4.2'
        title: 单店经济性与渠道信号
        blocks:
          - type: paragraph
            body: >-
              最令人鼓舞的公开证据来自门店层面。管理层在 ICR 表示，传统门店平均单店销售额接近 $2.2m、利润率超过 20%、历史现金回报率约 50%；除 2020 年和 2025 年外，自 2018
              年以来每年的同店销售都实现两位数增长。首家得来速据报道带来超过 30% 的销售提升，如果业态能够顺利规模化，这支持公司在 2026 年再开 4 至 6 家得来速门店。弱点在渠道经济性：指定材料没有经审计的
              CAC、回本期、佣金、退款或实现价格桥接数据，且消费者证据表明配送可能显著抬高终端价格。
