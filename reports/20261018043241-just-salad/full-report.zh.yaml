  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：一个明确的公开可比对象、多个真实替代品与重大证据缺口
        blocks:
          - type: paragraph
            body: >-
              指定材料只点名了一个直接公开可比对象：Ion Analytics 称，如果 Just Salad 推进 IPO，市场可能会将其与 Sweetgreen 比较；Nation's Restaurant News
              则另行报道，管理层明确将自身运营方式与 Sweetgreen
              推动自动化的做法对比。这足以建立直接同业框架，但不足以为其他健康休闲快餐连锁补齐带有来源的完整同业集、价格、功能深度或单店经济性。材料对替代路径的覆盖更强。管理层称沙拉替代三明治、成为默认午餐选择仍处于“早期阶段”，因此传统午餐选择仍是现实的竞争集合，而不只是其他沙拉品牌。配送平台也属于买方选择，因为管理层正在主动调整
              DoorDash 和 Uber Eats 的投放，而 Tripadvisor 评价显示该渠道可能带来显性费用和质量取舍。自建、企业食堂替代和潜在进入者仍无法判断，因为指定材料没有这些类别的直接证据。
            claimRefs:
              - CP001
