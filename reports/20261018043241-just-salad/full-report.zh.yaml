      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >
              对大多数交易而言，买方、用户和付款方都是同一位消费者，他可以在门店、App 或配送平台购买单份餐食。边缘场景有所不同：家庭决策者可能为了便利选择得来速餐食，会员则会响应 App 奖励和复购激励。Just
              Salad
              在华盛顿开店及与厨师合作推出季节产品，说明地域扩张、数字奖励、产品轮换和植物性定位能够支持试用与消费频次。首家得来速据报道带来销售提升，这是新入口能够扩大需求的最清晰证据，但单个试点不能证明各门店都可复制。
            claimRefs:
              - CM009
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >
              主要增长驱动包括门店扩张、从城市核心区进入相邻郊区和得来速场景、更丰富的菜单，以及用于开设新店和投入技术的资本。约束同样重要。新鲜的店内制作和明确不采用自动化，能够保持产品质量，但也会提高人力与执行要求；得来速速度和定制化则带来运营取舍。消费者证据并非一味正面：Tripadvisor
              在 30 条评价中显示 4.0 分，但 2026 年 7 月的一条配送评价提到漏送、额外费用和令人失望的食物。Ion Analytics 还报道，潜在 IPO 将受到 Sweetgreen
              及整个品类情绪的比较。因此，估值取决于能否复制单店经济性和服务质量，而不只是开出更多门店。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 业务 traction 可见，但剩余空间不可量化
            body: 公开证据支持需求和门店扩张，但投资逻辑仍需要独立的品类规模测算和按批次拆分的单店经济性，才能把门店增长势头转化为精确的 SOM。
            calloutType: insight
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
          - type: callout
            title: 一次成功的业态测试不等于可复制的铺开曲线
            body: 首家得来速据报道带来销售提升，令人鼓舞；但选址可得性、速度、定制化、人力和服务一致性仍是复制风险。
            calloutType: risk
            claimRefs:
