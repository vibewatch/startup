  - id: TV002
    title: 正题 / 反题表
    columns:
      - 视角
      - 论点
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 论点
        - 规模化概念，需求已有明确信号
        - 留存来源显示，公司从 2025 年 2 月接近 100 家门店，发展到 2026 年 1 月超过 100 个地点；Wellington 和 NRN 均提到，客流带动同店销售表现强劲。
        - 如果新店停止开设，或同店客流停滞，增长势头会减弱。
      - - 论点
        - 门店层面经济性表面上具备投资价值
        - NRN 提到 AUV 接近 $2.2M、利润率超过 20%，以及历史现金回报率约 50%。
        - 只有管理层按开店批次、门店形态和市场披露客群层面的经济性，判断才会改善。
      - - 论点
        - 得来速和新市场扩张提供上行杠杆
        - 据报道，第一家得来速门店让销售额提升 30%+；管理层计划再开 4 至 6 家，同时增加华盛顿特区的第二个地点。
        - 如果新形态拖慢服务速度，或必须依赖大量促销来拉动需求，上行空间会收窄。
      - - 反论点
        - 公开价格锚点已经偏激进
        - Multiples 将最近一次披露的估值锚定在 $1B，并按记录收入 $195M 算出 5.1x，几乎不给估值倍数压缩留下空间。
        - 如果后续轮次或外部可比公司表基于经核实的财务数据支持更高区间，担忧会缓解。
      - - 反论点
        - 资本结构过于不透明，不足以形成高确信度买入判断
        - 留存的公开来源没有披露现金余额、债务、租赁、优先权或反稀释条款。
        - 只有提供已签署的融资文件和最新股权结构表，这一担忧才会消除。
      - - 反论点
        - 客户体验滑坡会迅速损害规模化餐饮故事
        - 尽管总体评分为 4.0，Tripadvisor 仍显示一条 2026 年 7 月关于费用和食品质量的具体投诉。
        - 如果管理层披露按渠道划分的 NPS、投诉率，以及按订单类型划分的留存，风险会缓和。
    notes: 行混合了有佐证的公开事实与分析师解读；该表将证据支持的上行杠杆，与仍阻碍高确信度判断的缺失披露分开呈现。
    claimRefs:
