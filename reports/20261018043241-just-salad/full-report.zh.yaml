      - number: '4.3'
        title: 资本需求与充足性
        blocks:
          - type: paragraph
            body: >-
              从公开信息看，Just Salad 并不像资金枯竭，但透明度也不足以通过真正的资本充足性测试。公司称 2025 年 2 月融资 2 亿美元，估值约 10 亿美元，资金将用于新店、技术、菜单创新和客户体验。到
              2026 年中，公司仍在宣传围绕 Jalen Brunson 的新投资兴趣，Multiples 还记录了 Brunson 于 2026 年 6
              月领投的一轮未披露阶段融资。这支持其持续获得融资，但不能证明具备自我造血能力，因为指定公开来源未披露现金余额、消耗、债务、租赁义务或已承诺项目融资。
            claimRefs:
              - CI001
              - CI002
              - CI016
      - number: '4.4'
        title: 投资判断与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              财务故事方向上偏正面，但仍不完整。公开证据支持公司可以通过开设新店和扩展业态增长，管理层评论也暗示四墙经济性强。与此同时，最重要的尽调项目要么属于私人信息，要么在不同追踪机构之间不一致：核对后的收入、累计融资、当前现金、固定义务、各渠道实现价格和总部费用吸收。正确结论不是“经济性弱”，而是“经济性有希望，但验证有限”。严肃投资人应将公开单店指标视为需要验证的假设，而不是可直接用于投资判断的模型。
