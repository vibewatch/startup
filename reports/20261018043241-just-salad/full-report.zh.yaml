      - number: '3.2'
        title: 差异化主要来自品牌与执行，但便利性伴随价格取舍
        blocks:
          - type: paragraph
            body: >-
              公开证据反复指向 Just Salad 的四种差异化方式。第一，B Lab
              认证、可重复使用餐碗和碳标签让品牌拥有可持续身份，而指定材料中的许多休闲快餐连锁并未如此明确地宣传这一点。第二，管理层强调店内制作、质量控制和经验丰富的员工，而不是机器人，以此区别于高度自动化的同业。第三，公司正在拓展触点：首个得来速门店销售提升超过
              30%，JS Rewards 和 App
              提供轻度会员黏性，管理层也在精细化配送平台投放。第四，菜单创新更多依赖季节性发布和厨师合作，而非受保护的知识产权。取舍在于，便利渠道可能稀释价值主张。材料中最明确的反向证据是 2026 年 Tripadvisor
              关于服务费、菜单价格上涨和配送食物质量差的投诉，说明如果顾客通过第三方物流而非核心门店体验产品，渠道扩张可能反而压缩差异化。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP008
              - CP009
      - number: '3.3'
        title: 护城河能否持久更多取决于可复制执行，而非结构性锁定
        blocks:
          - type: paragraph
            body: >-
              公开证据支持真实的品牌与执行故事，但不足以证明存在坚固护城河。Just Salad 已具一定规模，管理层称平均单店销售额接近 220 万美元、利润率超过 20%、同店销售历史强劲、现金回报率约
              50%；如果这些指标可持续，它们的竞争意义远胜泛泛的“健康食品”叙事。即便如此，护城河仍偏软，而非结构性优势。可持续标签、厨师合作和会员机制有助于试用与复购，但单独都无法制造高转换成本。公开市场比较压力也很重要：Ion
              明确将 Sweetgreen 上市后的股价表现视为该品类的情绪拖累，意味着 Just Salad
              已在与知名度更高的公开市场标的比较。劳动力和最后一公里执行是另外的压力点，一边是历史上的配送员诉讼，另一边是近期配送评价投诉。在判断护城河持久性前，尽调仍需直接同业定价、更广泛的客户留存证据，以及有来源支持的顾客跨多个健康休闲快餐品牌消费频率。
            claimRefs:
