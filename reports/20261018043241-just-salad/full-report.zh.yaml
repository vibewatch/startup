            title: 便利渠道可能压缩差异化
            body: 得来速和配送扩大触达范围，但材料也显示，如果服务费、配送加价或食物质量下滑成为顾客的主要接触点，这些渠道会削弱感知价值。
            calloutType: risk
            claimRefs:
