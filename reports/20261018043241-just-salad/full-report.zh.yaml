              家门店，销售沙拉、碗餐、卷饼、汤和冰沙；2025 年融资公告也重复强调其植物性、可负担性和可持续定位。因此，后文可以把它视为一个已具规模、全渠道运营且以可持续品牌为核心的餐饮概念，而不是小众沙拉店或纯科技企业。
