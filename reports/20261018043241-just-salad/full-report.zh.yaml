  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开增长势头
        blocks:
          - type: paragraph
            body: >-
              公开记录显示其变现引擎很简单：Just Salad 通过直营餐厅销售备制餐食，再叠加数字会员、配送和业态扩张。官网和追踪机构将 2025 年 2 月融资与接近 100 家门店联系起来，NRN 则报道截至 2026
              年 1 月门店已超过 100 家。不过，公开增长指标并不一致。Multiples 为 2025 年 2 月融资记录了 1.95
              亿美元收入，但其他追踪机构估算的收入更低，累计融资总额也不一致。因此，外部人士能看到增长势头和门店扩张，却无法得到经过核对的经审计收入基数。
