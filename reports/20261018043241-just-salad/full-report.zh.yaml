      - number: '8.2'
        title: 估值背景与支撑
        blocks:
          - type: paragraph
            body: >-
              价格支撑集中在一个指标上。Multiples 记录 2025 年 2 月融资对应收入 1.95 亿美元、隐含收入倍数 5.1 倍；公司控制的材料和行业报道都认可融资 2
              亿美元及其资金用途。后续公开证据显示持续铺开，但没有新的独立估值标记，也没有披露条款且得到交叉验证的同业集合。因此，当前上行空间取决于相信管理层口径的运营指标能在扩张中持续，而没有公开的下行保护桥接。品牌的可持续定位和客户客流故事或许足以引发投资兴趣，但投资判断仍需承担未经验证的门店批次经济性和未披露融资结构。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: 情景区间
        blocks:
          - type: paragraph
            body: >-
              由于输入集较粗，情景框架也应保持粗略。乐观情景要求 2025 年价格标记被证明偏保守：门店增长必须继续超过 100
              多家门店的基数，得来速和营销收益必须继续推动客流为正，传统门店利润率必须维持在公开引用水平或更高。基准情景假设公司仍保持高质量，但市场要求更多证据；在经审计经济性和融资条款公开前，价值维持在最近 10
              亿美元估值附近或略低。悲观情景不只是需求崩溃，而是结构与执行共同出问题：服务不一致、同店销售放缓或结构化内部人融资暴露出标题估值夸大了普通股价值。
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV009
              - CV010
              - CV013
              - CV014
              - CV015
      - number: '8.4'
        title: 尽调问题与论点破坏因素
        blocks:
          - type: paragraph
            body: >-
              在判断是否入场前，投资人应强制推进三项具体工作。第一，核对融资结构：当前现金、债务、租赁、清算优先权、反稀释条款以及任何 2026
              年内部人融资，比标题估值更重要。第二，按业态、市场和渠道结构进行批次分析，测试所称门店经济性是否经得起验证，尤其是在得来速扩张之际。第三，压力测试服务一致性和配送经济性，因为即使只有一家门店的评价，也显示费用、质量遗漏和第三方渠道失望的下行风险。若同店客流走弱、成熟门店利润率低于
              20%、出现外部可见的降价轮或结构化重组，或门店数量增长却无法保持顾客体验，任何组合都可能破坏投资论点。
            claimRefs:
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 在价格支撑扩大前继续跟踪
            body: 当前公开记录支持继续密切跟踪公司，但不支持按标题估值买入。可持续的外部估值锚点仍是 2025 年 2 月融资，约为 Multiples 记录的 1.95 亿美元收入的 5.1 倍。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV013
              - CV014
          - type: callout
            title: 结构不透明比品牌势头更重要
            body: 缺失现金、债务、租赁和优先权结构细节，可能比可见的门店增长更重要，因为这些条款决定在同一标题估值下普通股是否存在上行空间。
            calloutType: risk
            claimRefs:
              - CV011
              - CV013
              - CV015
