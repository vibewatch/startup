companyProfile:
  summary: >-
    Just Salad is a New York-founded fast-casual restaurant chain that has grown from a 2006 origin into a 125+ location
    concept spanning salads, bowls, wraps, soups, and smoothies. The public record shows a sustainability-led brand with
    reusable-bowl and carbon-label differentiation, a 2025 financing at roughly a $1 billion valuation, and visible
    format expansion into drive-thru and off-premise convenience, but it remains opaque on ownership, balance-sheet
    structure, and customer economics.
