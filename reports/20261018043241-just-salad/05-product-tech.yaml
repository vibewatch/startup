      - ["Repeat a sustainable ordering habit", "Reuse a bowl in store or through digital ordering", "MyBowl program plus free-topping incentive", "Reuse and carbon-labeling are repeatedly surfaced as brand differentiators", "No public cohort data on reuse frequency or incremental spend"]
      - ["Order ahead and discover a meal", "Browse in app, receive rewards, and use recommendation features", "JS Rewards plus GPT-4o-based meal suggestions", "Shows a digital layer beyond the physical counter", "No public adoption, guardrail, or privacy detail"]
