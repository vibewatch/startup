    notes: "Benefits are limited to what the sources explicitly describe; where public workflow metrics are absent, the table records the missing denominator."
    claimRefs: ["CE003", "CE006", "CE008", "CE009", "CE010", "CE013", "CE014", "CE016"]
  - id: "TE003"
    title: "Technology / operating architecture table"
    columns: ["Layer / process", "Role", "Dependency", "Public proof", "Risk"]
    rows:
      - ["Ingredient prep and kitchen execution", "Turns fresh inputs into customized meals", "Labor training, ingredient supply, recipe discipline", "Produce delivered multiple times a day; proteins marinated overnight and cooked multiple times a day", "Manual process may pressure consistency and speed at higher volume"]
      - ["Prototype store design and rollout", "Replicates layouts, permits, and construction documents across markets", "Design partner, landlords, contractors, development team", "External partner cites 40+ completed sites and 40 more in design or construction", "No public capex, payback, or standardized equipment disclosure"]
      - ["Digital ordering, loyalty, and AI", "Supports order-ahead, rewards, and recommendations", "Mobile app, data collection, vendor tooling", "GPT-4o recommendation feature and JS Rewards are publicly disclosed", "No public privacy, security, uptime, or model-governance detail"]
      - ["Sustainability and compliance layer", "Adds reusable packaging, carbon measurement, and external certification", "Sustainability team, carbon-footprint measurement, certification upkeep", "Carbon labels since 2020 and B Corp certification in 2023", "Environmental positioning is visible, but food-safety and cybersecurity controls are not"]
    notes: "This is an operating-architecture view, not a software-stack disclosure; absent security, uptime, and capex detail is treated as unresolved diligence risk."
    claimRefs: ["CE004", "CE007", "CE008", "CE010", "CE011", "CE016"]
