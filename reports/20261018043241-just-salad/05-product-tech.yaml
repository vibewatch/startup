company:
  name: "Just Salad"
chapter:
  number: 5
  title: "Product & Technology"
  summary: |
    Just Salad delivers an operations-heavy fast-casual product: chef-designed and customizable meals, a reusable-bowl sustainability loop, and a mobile ordering and rewards layer rather than a software-centric platform. Public evidence supports a repeatable store rollout engine and visible product differentiation around carbon labeling and reuse, but it leaves major gaps around backend security, privacy, and reliability controls.
sections:
  - id: "product-scope-and-workflow"
    title: "Product scope and customer workflow"
    body: |
      Just Salad’s deliverable is broader than a single salad SKU: the current public menu and current-location release describe a consumer offer spanning salads, wraps, warm bowls, Market Plates, soups, smoothies, and rotating chef-designed items, while third-party descriptions also emphasize made-to-order customization and a large toppings set. The workflow is still store-first rather than app-first. Public evidence points to a line-based assembly model where guests can choose predesigned items or build their own, then layer in reusable-bowl incentives and order-ahead behavior through the app. The official press archive also shows that menu collaborations and sustainability initiatives are recurring product-marketing surfaces, although public materials do not quantify their contribution to order frequency or mix.
    claimRefs: ["CE001", "CE002", "CE003", "CE013", "CE014", "CE015", "CE016"]
    tableRefs: ["TE001", "TE002"]
  - id: "operating-architecture-and-scale"
    title: "Operating architecture and scale model"
    body: |
      The operating architecture looks like a standardized restaurant system, not a proprietary automation stack. Management described frequent produce delivery, in-house prep, overnight-marinated proteins, and repeated same-day cooking, while also explicitly rejecting automation. That means product quality and throughput depend on labor discipline, training, and site-level consistency rather than robotics or proprietary kitchen hardware. The scaling engine appears credible but operationally demanding: an external design partner says it has already completed more than 40 locations and has another 40 in design or construction, and management is extending the format mix through drive-thru after an early 2025 pilot. The three-minute drive-thru service target makes labor tenure and execution quality a measurable scaling dependency rather than a generic operating concern.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE007"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "differentiation-and-control-gaps"
    title: "Differentiation and control gaps"
    body: |
      Public differentiation is clearest in sustainability and light digital tooling. Third-party and compiled sources tie Just Salad to MyBowl reuse, menu carbon labeling, B Corp certification, and a GPT-4o-based recommendation feature in the mobile app. Those elements create a branded operating layer that competitors cannot copy overnight, but they do not amount to a deep technical moat on their own. The more material underwriting question is controls: the assigned evidence pool does not document payment-security architecture, privacy governance for app or AI data, formal uptime/status reporting, or measurable delivery-quality controls. As a result, investors can see the customer promise and store rollout story, but not the backend control environment needed to judge whether the concept scales without hidden quality or compliance slippage.
    claimRefs: ["CE006", "CE008", "CE009", "CE010", "CE011", "CE012", "CE014", "CE016"]
callouts:
  - calloutType: "insight"
    title: "Differentiation is operational, digital-light, and sustainability-led"
    body: "The strongest public moat is the combination of customizable fresh-prep execution, reusable-bowl economics, carbon-labeled menus, and a recognizable sustainability brand, not proprietary kitchen automation or a documented software stack."
    claimRefs: ["CE002", "CE005", "CE009", "CE010", "CE011", "CE012"]
  - calloutType: "risk"
    title: "Control evidence lags the growth and product story"
    body: "The public record supports a real expansion and format-development engine, but it does not show the privacy, security, uptime, or quality-control detail needed to underwrite AI, app ordering, drive-thru, and manual store execution with high confidence."
    claimRefs: ["CE006", "CE007", "CE008", "CE014"]
