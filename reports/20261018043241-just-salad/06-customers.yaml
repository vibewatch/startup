      - ["Maiden Lane NYC Tripadvisor reviewers", "Office workers, tourists, and delivery users", "In-store salads plus third-party delivery from a mature New York location", "Production location", "Reviews cite freshness, speed, app ordering, and a 4.0 / 5 overall score, but also expose delivery friction", "One location and anecdotal feedback rather than cohort analytics"]
