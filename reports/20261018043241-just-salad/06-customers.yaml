slug: just-salad
runDate: 2026-10-18
company:
  name: Just Salad
chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof points show a scaled consumer restaurant with real adoption momentum:
    Just Salad ended 2025 at 110 locations, public 2026 references put it above 125 locations,
    and management says same-store sales remained positive while the first drive-thru lifted sales
    by more than 30%. The strongest evidence is still consumer-channel oriented rather than
    contractual: app rewards, reviews, menu/daypart expansion, and brand campaigns are visible,
    but retention, loyalty economics, and concentration remain undisclosed.
sections:
  - id: footprint-and-segmentation
    title: Footprint growth broadens the customer mix beyond the original urban lunch core
    body: >-
      The public record still points to Just Salad as a consumer-facing fast-casual concept whose
      core buyer, user, and payer are individual diners, but the footprint is widening the
      addressable occasions. QSR says the chain finished 2025 with 110 locations across New York
      City, the Tri-State area, Chicago, Massachusetts, Philadelphia, Washington, D.C., and
      Florida, while management described the customer base as broad across urban and suburban
      trade areas. A separate Lentils.org case study still frames the concept around lunchtime
      customers in major metros, but 2026 unit growth, drive-thru development, and dinner-oriented
      menu expansion suggest the customer base is no longer just the original office-lunch cohort.
    claimRefs: [CU001, CU002, CU003, CU004, CU009]
    tableRefs: [TU001, TU002]
  - id: public-proof-of-use
    title: Public proof of use is strongest in local openings, menu launches, reviews, and brand campaigns
    body: >-
      Just Salad has more evidence of active consumer use than many private restaurant concepts,
      but most of that proof comes from store-level and consumer-channel proxies rather than from
      disclosed cohort data. The first drive-thru reportedly delivered a 30%+ sales lift, the
      company is using JS Rewards and app-linked freebies to reinforce repeat visits, and half of
      reported sales came from non-salad items such as bowls, wraps, and smoothies. Tripadvisor
      reviews show real transaction-level customer interaction, including positive commentary on
      freshness and speed as well as a 2026 complaint about delivery economics and quality. The
      Jalen Brunson campaign adds evidence of broader brand advocacy, but it is still promotional
      rather than a measurable retention disclosure.
    claimRefs: [CU004, CU006, CU007, CU008, CU010, CU011, CU014, CU015]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-expansion-risks
    title: Durability looks directionally positive, but the hard retention and concentration data are still missing
    body: >-
      Demand durability is positive by proxy rather than by full customer-analytics disclosure.
      Nation's Restaurant News says same-store sales were double-digit every year since 2018 except
      2020 and 2025, with 2025 still positive, and the capital-raise materials tie same-store
      sales growth to increased traffic. That is useful evidence that customers are returning, but
      it does not answer the higher-value diligence questions around repeat-purchase frequency,
      churn, loyalty-member economics, top-market concentration, delivery dependence, or whether
      newer formats such as drive-thru or dinner dayparts hold up after the launch window. Public
      proof of adoption is therefore real, but customer durability is still only partially
      verified.
    claimRefs: [CU005, CU008, CU012, CU013]
