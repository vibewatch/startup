figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      The observable journey runs from awareness through trial, repeat use, channel expansion, and
      advocacy, but the public record still lacks quantified retention economics.
    data:
      items:
        - label: Awareness
          touchpoints:
            - "Healthy, sustainable fast-casual positioning in major metros"
            - "Jalen Brunson campaign framing early fans as part of the brand story"
        - label: Trial
          touchpoints:
            - "New-store promotions such as giveback days and $5 meal windows"
            - "Fresh-ingredients and speed reviews at mature Manhattan locations"
        - label: Habit
          touchpoints:
            - "JS Rewards monthly freebies, mystery bowl items, and stamp unlocks"
            - "Positive same-store sales and review recency as directional repeat-visit proxies"
        - label: Channel expansion
          touchpoints:
            - "Drive-thru convenience with 30%+ sales lift at the first site"
            - "DoorDash / Uber Eats marketing optimization and delivery feedback loops"
        - label: Daypart expansion
          touchpoints:
            - "Market Plates and chef collaborations extend the concept beyond core lunch salads"
            - "Non-salad bowls, wraps, and smoothies account for half of reported sales"
        - label: Advocacy
          touchpoints:
            - "Celebrity-fan endorsement plus early-believer messaging"
            - "Travelers' Choice / review visibility that can reinforce word of mouth"
    claimRefs: [CU006, CU009, CU010, CU011, CU014, CU015]
callouts:
  - calloutType: strength
    title: Scaled consumer demand is visible even without private dashboards
    body: >-
      The combination of 110 locations at the end of 2025, 125+ public references in 2026,
      positive same-store sales, drive-thru lift, and app-linked rewards gives real evidence that
      Just Salad is serving repeat consumer demand rather than just selling a logo story.
    claimRefs: [CU001, CU002, CU004, CU005, CU006]
  - calloutType: risk
    title: The retention story is still proxy-based, not KPI-backed
    body: >-
      Public evidence shows reviews, promotions, and traffic proxies, but it still does not expose
      NRR, churn, loyalty-member counts, channel concentration, or contract-style renewal data, so
      durability and expansion quality remain only partially proven.
    claimRefs: [CU008, CU013]
