evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: Current cap table, ownership percentages, liquidation preferences, debt facilities, and lease-obligation schedule.
    whyItMatters: >-
      The 2025 valuation headline cannot be translated into investor outcomes or downside protection without the actual
      stack.
    diligencePath: Request the latest cap table, debt summary, major lease commitments, and the full term sheet for the 2025 round.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board roster, observer rights, founder voting control, and investor governance provisions.
    whyItMatters: >-
      Leadership quality is easier to assess than governance quality in the public record; without board and control
      data, key-person risk cannot be sized well.
    diligencePath: >-
      Request board list, committee structure, voting agreements, and any investor information-rights or consent-rights
      documents.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: exact-scale-metrics
    missingEvidence: >-
      Verified current headcount, customer count, state-by-state location count, and company-owned versus
      non-company-owned unit mix.
    whyItMatters: >-
      Scale is central to valuation and operating leverage, but the public record in this pool is directional rather
      than fully reconciled.
    diligencePath: Request the current store list, org chart, headcount by function, and top-line customer or loyalty-member metrics.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: ipo-readiness
    missingEvidence: >-
      Confirmed banker mandate, audited financial package, formal listing timeline, and management view on public-market
      comparables.
    whyItMatters: >-
      IPO optionality can change valuation framing and liquidity expectations, but exploratory media reporting alone
      does not establish readiness.
    diligencePath: >-
      Ask management whether a bank syndicate has been appointed and request the latest audited statements plus any
      public-listing preparedness workstreams.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: missing-source
    severity: material
    topic: tam-sam-som-sizing
    missingEvidence: >-
      Independent category TAM and SAM estimates for health-oriented fast casual, segmented by geography, daypart, and
      ordering format.
    whyItMatters: Observed company traction proves demand but cannot quantify remaining whitespace or a supportable SOM.
    diligencePath: >-
      Obtain an independent market study and reconcile its category definition to Just Salad's actual menu, geographies,
      formats, and mature-store economics.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: format-cohort-economics
    missingEvidence: >-
      Cohort-level sales, traffic, contribution margin, capital cost, and payback for urban, suburban, drive-thru, and
      new-market stores.
    whyItMatters: One drive-thru lift and blended traditional-unit metrics do not establish repeatability or capital efficiency.
    diligencePath: >-
      Request store-level cohort P&Ls and investment schedules, with mature-store comparisons and the denominator behind
      the reported margin.
    relatedQuestionRefs:
      - QM005
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: customer-and-channel-quality
    missingEvidence: >-
      Channel mix, order frequency, retention, customer acquisition cost, loyalty participation, refunds, and complaint
      rates by market.
    whyItMatters: >-
      The buyer map is visible, but public sources cannot show whether digital and off-premise demand is profitable or
      durable.
    diligencePath: >-
      Review loyalty cohorts, direct-versus-marketplace economics, delivery-quality metrics, and customer-support logs
      by geography.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM007
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: direct-peer-benchmarking
    missingEvidence: >-
      Independent direct pages or reported benchmarks for Sweetgreen and other healthy fast-casual peers covering
      pricing, feature breadth, and store economics.
    whyItMatters: >-
      Without sourced peer data, the chapter can frame the comp set but cannot prove relative superiority on price,
      retention, or product breadth.
    diligencePath: >-
      Add assigned, successfully prefetched direct competitor sources in a future refresh before making stronger
      competitive-share or moat claims.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs-and-retention
    missingEvidence: >-
      Cohort retention, loyalty redemption, repeat frequency, and channel mix by delivery, app, drive-thru, and in-store
      cohorts.
    whyItMatters: >-
      Light loyalty and sustainability signals are not the same as durable switching costs, so the moat case remains
      incomplete.
    diligencePath: Request loyalty, repeat-purchase, and channel-mix data from the data room or management.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-margin
    missingEvidence: >-
      Realized pricing by channel, delivery take rates, mature-store margin bridges, and like-for-like economics versus
      peer chains.
    whyItMatters: >-
      Promotional pricing and marketplace fees can distort the real competitive position even when brand and traffic are
      strong.
    diligencePath: Obtain store-level P&L bridges and channel-level pricing realization before underwriting margin durability.
    relatedQuestionRefs:
      - QP003
      - QP004
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, burn rate, debt, lease obligations, and any project-finance commitments.
    whyItMatters: Without these figures, the 2025 raise cannot be translated into runway or downside protection.
    diligencePath: Request the latest balance sheet, debt schedule, lease roll-forward, and monthly cash burn bridge.
    relatedQuestionRefs:
      - QI007
  - type: conflicting-data
    severity: material
    topic: tracker-estimates
    missingEvidence: A reconciled management revenue figure and lifetime financing table tied to accounting periods.
    whyItMatters: >-
      Third-party trackers disagree materially on revenue and cumulative funding, which weakens any public multiple or
      runway inference.
    diligencePath: Obtain a board or lender reporting package that reconciles LTM revenue, current run-rate, and every funding round.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Realized pricing, discounting, channel mix, loyalty subsidy cost, CAC, and payback by demand channel.
    whyItMatters: >-
      Public pricing signals are promotional or anecdotal, so the contribution margin of growth channels cannot be
      judged.
    diligencePath: Request order-level channel P&Ls, loyalty redemption files, and marketing-efficiency dashboards by cohort.
    relatedQuestionRefs:
      - QI002
      - QI003
      - QI004
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: cost-structure
    missingEvidence: Working-capital, capex, and service-delivery cost detail by traditional and drive-thru format.
    whyItMatters: >-
      Store-level revenue and margin claims do not show whether expansion consumes cash through inventory, equipment, or
      labor complexity.
    diligencePath: >-
      Request build-cost, maintenance-capex, food/labor/occupancy, and working-capital schedules for new and mature
      units.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-and-privacy-controls
    missingEvidence: >-
      Public documentation of payment-security controls, privacy handling for app and recommendation data, vendor
      governance, and any security certifications.
    whyItMatters: >-
      The chapter can see a digital ordering and AI layer, but cannot judge whether data handling and operational
      controls scale safely.
    diligencePath: >-
      Request architecture diagrams, privacy policies tied to app telemetry, payment-compliance documentation, and any
      security-audit or certification materials.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: digital-performance
    missingEvidence: Adoption, conversion, retention, and guardrail metrics for the app, JS Rewards, and GPT-4o recommendation feature.
    whyItMatters: >-
      Without usage and outcome metrics, the digital layer may be strategically interesting but financially or
      behaviorally immaterial.
    diligencePath: >-
      Request MAU, order-ahead penetration, rewards participation, recommendation take-rate, and any A/B test or
      conversion analysis.
    relatedQuestionRefs:
      - QE006
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: reliability-and-quality-controls
    missingEvidence: >-
      Formal service-level, food-quality, delivery-error, and incident-rate reporting across dine-in, drive-thru, and
      third-party delivery channels.
    whyItMatters: >-
      The public record includes both strong operational claims and at least one contradictory delivery-quality
      complaint, so diligence needs a system-level read rather than anecdotes.
    diligencePath: >-
      Request order-accuracy, remake, refund, delivery complaint, drive-thru throughput, and food-safety metrics by
      channel.
    relatedQuestionRefs:
      - QE007
      - QE008
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Chainwide retention metrics such as NRR, GRR, churn, renewal cadence, loyalty-member counts, and cohort spend
      behavior.
    whyItMatters: >-
      Current durability is inferred from comps, reviews, and promotions rather than from direct repeat-purchase or
      retention reporting.
    diligencePath: >-
      Request loyalty dashboards, repeat-purchase cohorts, churn analysis, and management commentary separating
      frequency from pricing.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: >-
      Customer concentration by geography, delivery platform, catering channel, and any workplace or institutional
      relationships.
    whyItMatters: >-
      Expansion quality and downside risk depend on whether demand is broadly distributed or overly concentrated in a
      few markets or channels.
    diligencePath: >-
      Request store-level sales mix, third-party delivery share, catering mix, and top-market concentration data for
      2024-2026.
