schemaVersion: report-v2
artifact: valuation
slug: just-salad
runDate: 2026-10-18
company:
  name: Just Salad
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence shows a real scaled concept: Just Salad raised $200 million at an
    approximately $1 billion valuation in February 2025, expanded past 100 locations by
    January 2026, and publicly cited strong store-level economics. But the only durable
    price marker retained in this chapter is the February 2025 round at about 5.1x the
    $195 million revenue figure recorded by Multiples, while cap-table terms, audited
    cash generation, and a broader comp set remain undisclosed. That supports a track
    recommendation with medium confidence and a stretched valuation stance rather than
    chasing the headline mark.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: |-
      Public evidence supports treating Just Salad as a real scaled concept rather than a
      story stock. Independent coverage of the February 2025 round, later industry
      interviews, and a March 2026 store opening together show the company moved from
      close to 100 units to more than 100 locations, paired with claims of traffic-led
      same-store sales gains, 30%-plus drive-thru lift, and traditional-store economics
      around $2.2 million AUV with more than 20% margins. That is enough to justify
      ongoing diligence. It is not enough to justify paying the full headline mark
      today, because the only concrete valuation anchor retained in this pool is the
      roughly $1 billion February 2025 round, and the public record still omits cash,
      lease, debt, and preference-stack detail. On public evidence alone, the right
      stance is track: engage at a better price or after management opens the data room
      on structure and cohort economics.
    claimRefs: [CV001, CV002, CV005, CV006, CV007, CV009, CV011, CV013, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: valuation-context-and-support
    title: Valuation context and support
    body: |-
      Price support is concentrated in one marker. Multiples records $195 million of
      revenue at the February 2025 financing and a 5.1x implied revenue multiple, while
      company-controlled and trade coverage agree on the $200 million raise and intended
      use of proceeds. Later public evidence shows continued rollout, but not a new
      independent valuation mark or a corroborated peer set with disclosed terms. That
      means upside today depends on believing management-sourced operating metrics will
      persist through expansion without a public downside-protection bridge. The brand's
      sustainability positioning and customer-traffic story may justify investor
      interest, yet the underwriting burden still sits on unverified cohort economics
      and undisclosed financing structure.
    claimRefs: [CV002, CV003, CV004, CV007, CV008, CV011, CV014]
    tableRefs: [TV002]
  - id: scenario-ranges
    title: Scenario ranges
    body: |-
      Scenario framing should stay coarse because the input set is coarse. The bull case
      requires the 2025 price marker to prove conservative: unit growth must continue
      beyond the 100-plus store base, drive-thru and marketing gains must keep traffic
      positive, and traditional-store margins must hold at or above the publicly cited
      level. The base case assumes the company remains high quality but the market
      demands more proof, keeping value around or somewhat below the last $1 billion
      mark until audited economics and round terms are visible. The bear case is not a
      demand-collapse story alone; it is a structure-plus-execution problem in which
      service inconsistency, slowed comps, or a structured insider round exposes that
      the headline mark overstated common-equity value.
    claimRefs: [CV003, CV005, CV006, CV009, CV010, CV013, CV015]
    tableRefs: [TV003]
  - id: diligence-asks-and-thesis-breakers
    title: Diligence asks and thesis breakers
    body: |-
      Before underwriting an entry, an investor should force three concrete workstreams.
      First, reconcile the round structure: current cash, debt, leases, liquidation
      preferences, anti-dilution, and any 2026 insider financing matter more than the
      headline valuation. Second, test whether the cited store economics survive cohort
      analysis by format, market, and channel mix, especially as drive-thru expands.
      Third, pressure-test service consistency and delivery economics, because even
      one-location review evidence shows the downside of fees, quality misses, and
      third-party channel disappointment. A thesis break would be any combination of
      weakening same-store traffic, sub-20% mature-store margins, an externally visible
      down-round or structured recap, or expansion that raises unit count without
      preserving guest experience.
    claimRefs: [CV005, CV006, CV010, CV011, CV013, CV015]
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Recommendation
      - Confidence
      - Risk rating
      - Valuation stance
      - Decision implication
    rows:
      - ["Track", "Medium", "High", "Stretched", "Stay engaged, but do not underwrite the $1B headline mark until cap-table terms and cohort economics are disclosed or price resets."]
    notes: Public-evidence recommendation only; no term sheet, cap table, or audited cash-flow bridge is available in the retained source pool.
    claimRefs: [CV002, CV003, CV011, CV013, CV014, CV015]
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Argument
      - Evidence
      - What would change the view
    rows:
      - ["Thesis", "Scaled concept with visible demand proof", "The retained sources move the business from close to 100 units in February 2025 to more than 100 locations by January 2026, with traffic-led same-store sales strength cited by Wellington and NRN.", "Momentum weakens if new stores stop opening or same-store traffic stalls."]
      - ["Thesis", "Store-level economics look investable on the surface", "NRN cited close to $2.2M AUVs, margins north of 20%, and about 50% historical cash-on-cash returns.", "The view improves only if management shares cohort-level economics by vintage, format, and market."]
      - ["Thesis", "Drive-thru and new-market expansion create upside levers", "The first drive-thru reportedly lifted sales 30%+ and management planned four to six more while adding a second D.C. location.", "Upside fades if new formats dilute service speed or require promo-heavy demand."]
      - ["Anti-thesis", "The public price anchor is already ambitious", "Multiples ties the last disclosed mark to $1B and 5.1x on $195M of recorded revenue, leaving little room for multiple compression.", "The concern eases if a later round or external comp sheet supports a higher range on verified financials."]
      - ["Anti-thesis", "The capital structure is too opaque for a conviction buy", "Retained public sources do not disclose cash balance, debt, leases, preferences, or anti-dilution terms.", "The concern clears when executed financing documents and the latest cap table are shared."]
      - ["Anti-thesis", "Customer-experience slippage can damage a scaled restaurant story quickly", "Tripadvisor still shows a specific July 2026 complaint on fees and food quality despite an overall 4.0 rating.", "The risk moderates if management shows channel-level NPS, complaint rates, and retention by order type."]
    notes: Rows mix corroborated public facts with analyst interpretation; the table separates evidence-supported upside levers from the missing disclosures that still block conviction.
    claimRefs: [CV003, CV005, CV006, CV007, CV009, CV010, CV011, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "100+ store growth continues, traditional-store margins stay above 20%, and drive-thru plus marketing keep traffic positive.", ">$1.2B, or >6x on the February 2025 $195M public revenue marker, becomes plausible only if later diligence confirms the public economics story.", "Format complexity, labor, and valuation multiple compression.", "Needs audited economics plus clean round terms; not supported by the current public record alone."]
      - ["Base", "The company keeps adding units and sales, but investors demand better disclosure before paying more than the last mark.", "$0.8B-$1.0B, or roughly 4x-5x on the same public revenue marker, implying limited near-term upside from the headline valuation.", "No peer grid, no audited cash flow, and opaque preferences keep returns capped.", "Best fit with the current evidence set."]
      - ["Bear", "Traffic softens, service consistency slips, or a structured internal round reveals downside protection above common equity.", "<$0.8B, or <4x on the same public revenue marker, and economically worse for common if preferences are heavy.", "Delivery dissatisfaction, execution strain, and financing structure.", "Material if diligence disproves the interview-level economics or uncovers round overhang."]
    notes: Indicative ranges are analyst synthesis anchored to the last public $1B mark and Multiples' $195M revenue figure; they are not quoted market bids or a fairness opinion.
    claimRefs: [CV003, CV005, CV006, CV009, CV010, CV013, CV014, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: A usable expansion story exists, but the public valuation anchor is still too thin for a buy call.
    data:
      nodes:
        - label: Scale proof
          detail: Close to 100 units in February 2025 and more than 100 locations by January 2026 show a scaled concept with ongoing rollout.
          claimRefs: [CV007, CV012]
        - label: Economics signal
          detail: NRN cited about $2.2M AUVs, >20% traditional-store margins, and roughly 50% historical cash-on-cash returns.
          claimRefs: [CV005]
        - label: Expansion levers
          detail: A 30%+ sales lift from the first drive-thru and a second D.C. store suggest real whitespace.
          claimRefs: [CV006, CV007]
        - label: Brand support
          detail: Traffic-led same-store sales gains and sustainability positioning support customer demand.
          claimRefs: [CV008, CV009]
        - label: Price constraint
          detail: The last public mark is about $1B, and Multiples pegs it at 5.1x on $195M of recorded revenue.
          claimRefs: [CV002, CV003, CV014]
        - label: Recommendation
          detail: Track only until term-sheet transparency or a better entry point broadens the public support for valuation.
          claimRefs: [CV011, CV013, CV015]
    approximationNotes: The figure is a qualitative decision chain rather than a mathematical valuation model.
    claimRefs: [CV003, CV005, CV006, CV009, CV011, CV013, CV014, CV015]
callouts:
  - calloutType: recommendation
    title: Track until price support broadens
    body: >-
      The current public record supports staying close to the company, but not paying the
      headline mark. The durable external valuation anchor is still the February 2025
      round at about 5.1x the $195M revenue figure recorded by Multiples.
    claimRefs: [CV002, CV003, CV013, CV014]
  - calloutType: risk
    title: Structure opacity matters more than brand momentum
    body: >-
      Missing cash, debt, lease, and preference-stack detail can matter more than
      visible store growth because those terms determine whether common-equity upside
      exists at the same headline valuation.
    claimRefs: [CV011, CV013, CV015]
