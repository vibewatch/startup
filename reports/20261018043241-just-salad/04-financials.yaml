schemaVersion: "report-v2"
artifact: financials
slug: just-salad
runDate: 2026-10-18
company:
  name: Just Salad
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a straightforward company-operated restaurant model with strong
    store-level performance claims, but the most decision-useful inputs for underwriting remain
    private. Just Salad's 2025 $200 million raise and management-reported unit metrics suggest
    expansion capacity, yet cash, lease, debt, realized pricing, and channel-margin disclosure are
    still too thin to judge capital adequacy confidently.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: >-
      The public record points to a simple monetization engine: Just Salad sells prepared meals
      through company-operated restaurants, then layers digital loyalty, delivery, and format
      expansion on top. Official and tracker sources tie the February 2025 financing to nearly 100
      locations, while NRN reported the chain had moved above 100 locations by January 2026. Public
      traction metrics remain uneven, however. Multiples attached a $195 million revenue figure to
      the February 2025 round, but other trackers estimated lower revenue and inconsistent lifetime
      funding totals. That means outsiders can observe growth momentum and footprint expansion, but
      not a reconciled audited revenue base.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: unit-economics-and-channel-signals
    title: Unit economics and channel signals
    body: >-
      The most encouraging public evidence is at the store level. At ICR, management said
      traditional locations generate close to $2.2 million in average unit volumes, margins north
      of 20%, and historical cash-on-cash returns of about 50%, while same-store sales were
      described as double-digit in every year since 2018 except 2020 and 2025. The first
      drive-thru reportedly produced a 30%-plus sales lift, which supports another four to six
      drive-thru openings in 2026 if the format scales operationally. The weak point is channel
      economics: the assigned pool provides no audited CAC, payback, commission, refund, or
      realized-price bridge, and customer-side evidence suggests delivery can materially raise the
      end price.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI015
    tableRefs:
      - TI003
  - id: capital-needs-and-adequacy
    title: Capital needs and adequacy
    body: >-
      Just Salad is not presenting as capital-starved in public, but it is also not transparent
      enough to clear a real adequacy test. The company said the February 2025 raise brought in
      $200 million at roughly a $1 billion valuation and would fund new units, technology, menu
      innovation, and customer experience. By mid-2026, the company was still publicizing fresh
      investor interest around Jalen Brunson, and Multiples logged an additional undisclosed-stage
      round led by Brunson in June 2026. That supports continued financing access, but not
      self-funding durability, because the assigned public sources do not disclose cash on hand,
      burn, debt, lease obligations, or committed project finance.
    claimRefs:
      - CI001
      - CI002
      - CI016
  - id: underwriting-verdict-and-diligence-blockers
    title: Underwriting verdict and diligence blockers
    body: >-
      The financial story is directionally positive but still incomplete. Public evidence supports
      a concept that can grow through new stores and format expansion, and management commentary
      implies strong four-wall economics. At the same time, the most important diligence items are
      either private or internally inconsistent across trackers: reconciled revenue, cumulative
      funding, current cash, fixed obligations, realized pricing by channel, and enterprise
      overhead absorption. The correct verdict is therefore not "weak economics" but "promising
      economics with limited verification." A serious investor should treat the public unit metrics
      as hypotheses to validate rather than as an underwriting-ready model.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI008
      - CI009
      - CI015
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Traditional company-operated restaurants
        - Made-to-order salads, wraps, bowls, soups, smoothies, and related add-ons sold through company-operated stores
        - store / year
        - Traditional locations were described as close to $2.2M AUV with margins north of 20%
        - Medium; management commentary, not audited financial disclosure
        - Request mature-store revenue and contribution bridge by cohort, market, and format
      - - Drive-thru format
        - Same menu sold through a drive-thru channel
        - location / year
        - First drive-thru reportedly produced a 30%+ sales lift; 4-6 more were planned in 2026
        - Medium; early evidence from one format launch
        - Request drive-thru capex, labor model, cannibalization, and payback by site
      - - Delivery marketplaces
        - Third-party ordering and delivery through marketplace platforms
        - order
        - Channel is active, but one July 2026 review cited about $2 per-dish markups and a $14 service fee
        - Low; customer-side anecdote rather than company economics
        - Request channel mix, commission schedule, refunds, and gross-margin bridge
      - - Digital loyalty / app
        - Rewards mechanics designed to increase repeat ordering and direct engagement
        - member / order
        - Public evidence shows mystery-item rewards, monthly freebies, and reusable-bowl incentives, but no revenue attribution
        - Medium for program existence; low for economics
        - Request active members, redemption cost, incremental frequency, and direct-order share
    notes: >-
      This table mixes direct public facts with management-reported operating signals. It does not
      imply that promotions or rewards are separate revenue lines; they are demand-shaping
      mechanics around the core restaurant-sales model.
    claimRefs:
      - CI008
      - CI010
      - CI011
      - CI013
      - CI015
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / price signal
      - Price or unit
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - F Street opening promo
        - $5 chef-designed salad, wrap, warm bowl, or market plate from 10:30 a.m. to 2:00 p.m. on April 1-2, 2026
        - Promotional acquisition price, not steady-state menu pricing
        - Limited-time launch campaign; no normal list-price architecture disclosed
        - Washington, D.C. GlobeNewswire release
      - - Reusable bowl reward
        - Free topping for every reuse
        - Loyalty incentive rather than base product price
        - No disclosure of redemption rate or food-cost impact
        - Washington, D.C. GlobeNewswire release
      - - JS Rewards app
        - Free mystery bowl items after each purchase plus monthly freebies
        - Promotional retention subsidy, not transparent realized pricing
        - No disclosure of average-check uplift, breakage, or loyalty liability
        - Washington, D.C. GlobeNewswire release
      - - Third-party delivery order
        - About $2 markup per dish plus a $14 service fee in one July 2026 review
        - Realized customer price can exceed in-store price materially
        - Single-location anecdote; restaurant may not control all fee layers
        - Tripadvisor July 2026 customer review
      - - Core menu architecture
        - Undisclosed in the assigned source pool
        - Normal list-price structure unavailable
        - Need current menu, realized check, and discount files by daypart and channel
        - No qualifying public source in pool
    notes: >-
      Public pricing evidence in this pool is promotional or anecdotal. It is useful for identifying
      monetization mechanics, but not sufficient to model realized pricing, discounts, or channel
      take rates.
    claimRefs:
      - CI013
      - CI014
      - CI015
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Traditional-store AUV
        - Close to $2.2M
        - Medium
        - Sets the starting scale for new-unit underwriting and fixed-cost absorption
        - Provide AUV by vintage, market, urban/suburban split, and delivery penetration
      - - Traditional-store margin
        - North of 20%
        - Medium
        - Suggests attractive four-wall contribution economics if measured consistently
        - Define margin basis and include food, labor, occupancy, and commissions
      - - Cash-on-cash return
        - About 50% historically
        - Medium
        - Critical proxy for store payback and capital efficiency
        - Provide methodology, maturity threshold, and distribution by cohort
      - - Same-store sales trend
        - Double-digit annually since 2018 except 2020 and 2025, which was positive but below double digits
        - Medium
        - Helps distinguish traffic-led growth from one-time openings or pricing
        - Share exact comp percentages plus traffic / mix / price decomposition
      - - Drive-thru sales lift
        - 30%+
        - Medium
        - Indicates whether a new format can raise revenue density enough to justify added complexity
        - Provide lift duration, capex, throughput, and cannibalization analysis
      - - CAC / payback
        - Unavailable publicly
        - Low
        - Needed to judge how much growth depends on paid demand capture
        - Share CAC, payback, and blended marketing efficiency by channel
    notes: >-
      Every numeric value here comes from management commentary or media/tracker reporting rather
      than audited statements. Null-like "Unavailable publicly" rows are intentional and indicate a
      specific diligence request, not zero.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows how traffic and channel choices appear to translate into store-level economics, but not into a fully disclosed company P&L.
    data:
      nodes:
        - id: demand
          label: Brand and traffic demand
          note: Same-store sales were described as positive every year since 2018 except the pandemic year, with 2025 still positive.
        - id: channels
          label: Order channels
          note: In-store, loyalty/app usage, delivery marketplaces, and drive-thru are all visible in the assigned source pool.
        - id: ticket
          label: Ticket and mix
          note: Public pricing evidence is mostly promotional or customer-side, so realized check composition remains private.
        - id: revenue
          label: Restaurant revenue
          note: Multiples attached $195M revenue to the February 2025 round, but other trackers estimate lower levels.
          value: 195
          unit: "$M tracker revenue"
        - id: unit-margin
          label: Store-level contribution proxy
          note: Traditional locations were described as having margins north of 20%.
          value: 20
          unit: "%+ unit margin"
        - id: returns
          label: Capital returns proxy
          note: Management said historical cash-on-cash returns were about 50%.
          value: 50
          unit: "% cash-on-cash"
      edges:
        - from: demand
          to: channels
          label: converts into
        - from: channels
          to: ticket
          label: shapes
        - from: ticket
          to: revenue
          label: aggregates into
        - from: revenue
          to: unit-margin
          label: less operating costs
        - from: unit-margin
          to: returns
          label: supports
    approximationNotes: >-
      This is not a complete waterfall. The assigned public sources do not disclose realized ticket
      mix, delivery commissions, corporate overhead, working capital, or capex by format, so the
      figure shows sourced operating checkpoints rather than a full P&L bridge.
    claimRefs:
      - CI004
      - CI008
      - CI009
      - CI010
      - CI012
callouts:
  - calloutType: insight
    title: Public unit metrics imply the expansion story could work
    body: >-
      The AUV, margin, and cash-on-cash figures are strong enough to justify serious follow-up, but
      they should be treated as management claims until store-level cohorts and accounting
      definitions are verified.
    claimRefs:
      - CI008
      - CI009
      - CI010
  - calloutType: risk
    title: Capital adequacy is still not publicly underwritable
    body: >-
      A large 2025 raise and fresh 2026 investor interest do not substitute for current cash, debt,
      lease, and runway disclosure. The tracker disagreement on revenue and funding totals reinforces
      that gap.
    claimRefs:
      - CI001
      - CI005
      - CI006
      - CI016
