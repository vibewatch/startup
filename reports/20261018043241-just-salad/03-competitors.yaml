callouts:
  - calloutType: "insight"
    title: "The real public comp is already Sweetgreen, even before an IPO"
    body: "Current reporting does not merely describe Just Salad as a healthy restaurant chain; it explicitly says the company is likely to be compared with Sweetgreen and that category sentiment is influenced by Sweetgreen's trading history. That makes public-comp expectations part of today's competitive landscape, not just a future financing issue."
    claimRefs: ["CP012", "CP013"]
  - calloutType: "risk"
    title: "Convenience channels can compress differentiation"
    body: "Drive-thru and delivery broaden reach, but the pool also shows how those same channels can weaken perceived value if service fees, delivery markups, or food-quality slippage become the customer's main touchpoint."
    claimRefs: ["CP004", "CP009"]
