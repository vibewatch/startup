chapter:
  number: 3
  title: "Competitors"
  summary: |-
    The assigned pool supports a narrower competitor view than ideal, but it still shows Just Salad competing as a scaled healthy fast-casual chain whose public comp set already includes Sweetgreen and whose differentiation is framed around sustainability branding, human-prep operations, loyalty, and format expansion rather than proprietary technology. The strongest disconfirming evidence is that delivery-channel fees, public-market comp pressure, and thin third-party peer pricing disclosure all weaken confidence that the brand's moat is durable enough to defend a premium valuation without continued execution.
sections:
  - id: "landscape-and-public-comp"
    title: "Landscape: one named public comp, several real substitutes, and major evidence gaps"
    body: |-
      The assigned pool names only one direct public comparator: Ion Analytics says Just Salad is likely to be compared with Sweetgreen if it pursues an IPO, while Nation's Restaurant News separately reports that management explicitly contrasts its operating approach with Sweetgreen's automation push. That is enough to establish the direct-peer frame, but not enough to fill in a full peer set with sourced pricing, feature depth, or unit economics for adjacent chains such as other healthy fast-casual incumbents. The pool is stronger on substitute paths. Management's comment that salad is still in the "early innings" of replacing the sandwich as the default lunch item implies that status-quo lunch choices remain a real competitive set, not merely other salad brands. Delivery marketplaces are also part of the buyer's option set because management is actively tuning DoorDash and Uber Eats spend while a Tripadvisor review shows the channel can carry visible fees and quality tradeoffs. Internal build, employer cafeteria substitution, and likely entrants remain unresolved because the assigned pool contains no direct evidence on those categories.
    claimRefs: ["CP001", "CP002", "CP003", "CP012", "CP013"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "differentiation-pricing-and-buyer-tradeoffs"
    title: "Differentiation appears brand- and execution-led, with convenience and price tradeoffs"
    body: |-
      Public evidence points to four recurring ways Just Salad tries to stand apart. First, B Lab certification and repeated references to reusable bowls plus carbon labeling give the brand a sustainability identity that many fast-casual chains do not advertise as explicitly in the assigned pool. Second, management positions the chain against automation-heavy peers by emphasizing in-store prep, quality control, and tenured labor rather than robotics. Third, the company is broadening access points: drive-thru delivered a 30%+ lift at the first site, JS Rewards and the app add light loyalty lock-in, and management is sharpening spend on delivery marketplaces. Fourth, menu innovation relies on seasonal launches and chef collaborations more than protected IP. The tradeoff is that convenience channels can dilute the value proposition. The clearest adverse evidence in the pool is a 2026 Tripadvisor complaint about service fees, menu-price inflation, and poor delivered food quality, which suggests that channel expansion can narrow differentiation if the guest experiences the product through third-party logistics instead of the core store format.
    claimRefs: ["CP004", "CP005", "CP006", "CP007", "CP008", "CP009", "CP010", "CP015"]
    tableRefs: ["TP002", "TP003"]
  - id: "durability-and-displacement-risk"
    title: "Moat durability depends on repeatable execution more than structural lock-in"
    body: |-
      The public evidence supports a real brand and execution story, but not a hard moat. Just Salad now has meaningful scale, and management cites close to $2.2 million average unit volumes, margins north of 20%, strong same-store sales history, and about 50% cash-on-cash returns, all of which matter more competitively than a generic "healthy food" narrative if they are sustainable. Even so, the moat still looks soft rather than structural. Sustainability cues, chef collaborations, and loyalty mechanics can help with trial and repeat behavior, yet none of them create high switching costs on their own. Public-market comparison pressure also matters: Ion explicitly flags Sweetgreen's post-IPO share-price performance as a sentiment overhang for the category, meaning Just Salad is already being judged against better-known public analogs. Labor and last-mile execution are additional pressure points, with a historical delivery-worker lawsuit on one side and contemporary delivery-review complaints on the other. Before underwriting durability, diligence still needs direct peer pricing, broader customer retention evidence, and sourced proof on how often guests multi-home across healthy fast-casual options.
    claimRefs: ["CP005", "CP006", "CP009", "CP011", "CP012", "CP013", "CP014"]
