company:
  name: "Just Salad"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Just Salad enters the October 2026 refresh as a late-stage private fast-casual chain with a verified 2006 New York origin, an official footprint above 100 locations, and a 2025 financing that priced the company at about $1 billion. The strongest public evidence supports real brand differentiation around reusable packaging, carbon labeling, and menu innovation, while board composition, exact ownership/control rights, debt, and customer or headcount metrics remain private.
sections:
  - id: "identity-and-model"
    title: "Identity and operating model"
    body: >-
      The assigned evidence consistently identifies Just Salad as a New York-founded fast-casual restaurant brand built around salads but no longer limited to that category. The official about page says the concept began in 2006 and now offers salads, bowls, wraps, soups, and smoothies across more than 100 locations in seven states, while the 2025 capital-raise release repeats the same plant-centric, accessibility, and sustainability positioning. That matters because later chapters can treat the company as a scaled omnichannel restaurant concept with a sustainability-led consumer brand, not as a small niche salad shop or a pure technology business.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: "leadership-and-ownership"
    title: "Leadership, founder story, and governance visibility"
    body: >-
      Nick Kenner is the only operating leader who appears repeatedly across the assigned public materials, where he is presented as founder or co-founder, CEO, fundraiser, and chief operating voice. Public founder evidence also points to Rob Crespi as the 2006 co-founder, but the assigned pool does not show a current executive or governance role for him. Governance visibility is otherwise thin: there is no public board roster, no disclosed voting-control map, and no public explanation of which investors hold seats, observers, or protective rights. The chapter therefore treats Kenner as a meaningful key-person dependency and flags broader governance structure as a diligence gap rather than inferring it from the financing headlines.
    claimRefs: [CO005, CO006, CO014]
    tableRefs: [TO002]
  - id: "capital-scale-and-stakeholders"
    title: "Capitalization, scale signals, and stakeholder map"
    body: >-
      The clearest capital marker in the pool is the 2025 round: company-issued and independent sources align on a $200 million raise at an approximately $1 billion valuation, led by Wellington Management with D1 Capital Partners, Neuberger Berman, and Stripes. Earlier support from Panda Restaurant Group and Closed Loop Partners indicates that the cap table was already accumulating strategic and institutional backers before the 2025 step-up. Operating scale looks real rather than aspirational: official pages say the chain is above 100 locations, NRN reports roughly $2.2 million AUVs and 20%-plus margins for traditional units, and Washington, D.C. expansion shows the company is still opening new geography-specific stores. What remains missing is the actual cap table, debt or lease exposure, and current ownership percentages behind those headlines.
    claimRefs: [CO002, CO007, CO008, CO009, CO010, CO011, CO015]
    tableRefs: [TO003]
  - id: "milestones-and-risk-signals"
    title: "Milestones, momentum, and current risk signals"
    body: >-
      The dated milestones show a concept that has compounded narrative depth over two decades: the founding story, sustainability programs, product collaborations, a major 2025 financing, drive-thru experimentation, D.C. expansion, and celebrity-equity marketing all contribute to the current growth story. The main public caution signal in the assigned pool is not a fresh legal or regulatory event, but an execution-and-liquidity question: Ion Analytics reports that the company is exploring an IPO while also warning that public-market comparables could pressure valuation expectations. That makes Just Salad look more like a scaled but still privately opaque restaurant growth asset than a fully de-risked pre-IPO issuer.
    claimRefs: [CO004, CO010, CO011, CO012, CO013, CO014, CO015]
    figureRefs: [FO001]
