    summary: >-
      Endless is presented as a layered stack that combines base-chain
      infrastructure, developer components, onboarding abstractions, and
      showcase applications.
    data:
      layers:
        - label: "Application layer"
          detail: "User-facing applications promoted as proof that the stack can support live experiences."
          modules:
            - label: "Luffa SocialFi app"
              note: "Named reference deployment in the assigned pool"
            - label: "Gaming / NFT / finance apps"
              note: "Documented as target scenarios rather than verified scaled deployments"
        - label: "Ecosystem and distribution layer"
          detail: "Commercial and ecosystem programs intended to attract builders and route applications into the stack."
          modules:
            - label: "Developer grants"
            - label: "Component marketplace"
            - label: "DApp distribution surfaces"
        - label: "Experience and onboarding layer"
          detail: "Abstractions intended to make Web3 usage feel closer to Web2."
          modules:
            - label: "Google-account login"
            - label: "Keyless wallet interaction"
            - label: "Gas sponsorship"
            - label: "Multi-currency or wallet convenience features"
        - label: "Privacy and control layer"
          detail: "Controls used to support the product’s privacy and security positioning."
          modules:
            - label: "Zero-knowledge or keyless design"
            - label: "Data sovereignty positioning"
            - label: "Encrypted communication patterns"
        - label: "Developer component layer"
          detail: "Reusable building blocks meant to shorten time-to-build for teams entering Web3."
          modules:
            - label: "Pre-built modules"
            - label: "Multi-language SDKs"
            - label: "APIs and plugins"
            - label: "Cross-chain and component tooling"
            - label: "AI agent / model access"
        - label: "Infrastructure layer"
          detail: "The base technical substrate that Endless says makes the higher layers possible."
          modules:
            - label: "Move-based public chain"
            - label: "Relay networks"
            - label: "Distributed and serverless services"
            - label: "Decentralized storage"
            - label: "Privacy and security controls"
    approximationNotes: >-
      This figure is a synthesis of the layers and modules described in public
      materials; it is not an independently verified deployment topology.
    claimRefs: ["CE003", "CE004", "CE005", "CE006", "CE008", "CE010", "CE012"]
callouts:
  - calloutType: "strength"
    title: "Product design clearly targets Web2 friction"
    body: >-
      Endless’s strongest product signal is not raw blockchain novelty but the
      attempt to collapse wallet setup, gas funding, component assembly, and AI
      integration into a single onboarding path for developers and end users.
    claimRefs: ["CE001", "CE002", "CE005", "CE006"]
  - calloutType: "risk"
    title: "Public proof lags the breadth of the architecture story"
    body: >-
      The evidence set supports a coherent architecture narrative and at least
      one showcase app, but not yet a deeply auditable view of security,
      uptime, usage, or ecosystem scale.
    claimRefs: ["CE008", "CE013", "CE014", "CE016"]
