  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: durability-gap
      missingEvidence: Paid customer count, retention cohorts, NRR or GRR, churn, and contract-length data.
      whyItMatters: These metrics determine whether Endless has durable software economics or only early ecosystem activity.
      diligencePath: Obtain internal KPI dashboards or board materials that break out active accounts, renewals, and gross/net retention by segment.
      relatedQuestionRefs: [QU006]
    - type: missing-source
      severity: material
      topic: named-proof
      missingEvidence: Independent references from named production customers or partners describing live use, spend, and business outcomes.
      whyItMatters: One named application is not enough to assess reference quality, concentration, or repeatability of the go-to-market motion.
      diligencePath: Request at least three reference calls or public case studies with deployment scope, timing, and commercial terms.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU003]
    - type: conflicting-data
