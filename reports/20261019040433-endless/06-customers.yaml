schemaVersion: report-v2
artifact: customers
slug: endless
runDate: 2026-10-19
company:
  name: Endless
chapter:
  number: 6
  title: Customers
  summary: >-
    Endless publicly frames customer adoption as a multi-sided funnel that starts with developers,
    project teams, and end users rather than with disclosed enterprise accounts. The strongest
    named usage proof in the assigned pool is the Luffa social application, but the public record
    still lacks paid-customer counts, retention metrics, and concentration disclosure.
sections:
  - id: segment-buyer-user-payer
    title: Segment map and who likely pays
    body: >-
      Endless describes four target groups in its own business-model materials: Web2 developers,
      Web3 developers, project teams, and general users. That mix matters because the buyer, user,
      and payer are not the same across the funnel. Developers and project teams appear to be the
      acquisition wedge: the platform pitches SDKs, APIs, modular components, cloud services, and
      promotion tooling to help them ship applications and operate tokenized communities. End users
      matter as the demand signal, but the public monetization design implies that developer usage,
      application operators, and possibly validator participants are the more direct economic
      counterparties. This means Endless still has to convert product-interest claims into durable
      developer adoption before investors can treat end-user growth as a stable revenue proxy.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: public-adoption-proof
    title: Public adoption proof is concentrated in one disclosed app
    body: >-
      The assigned evidence set contains one clearly named deployment proof surface: Luffa, which
      Endless's co-president described as an AI-driven social application built on the protocol.
      That makes Luffa important because it is the only assigned source that pairs a named product
      with user-count claims. The same interview says Luffa had more than 100,000 users and more
      than 10,000 daily active users in March 2025, and that Endless intended to route a $1 million
      airdrop through that user base. Those are useful early adoption signals, but they remain
      company-claimed rather than independently audited, and they do not show whether activity came
      from paid customer demand, short-term incentives, or a broader portfolio of production apps.
      Financing and unicorn-status coverage confirm market attention, but they should not be treated
      as substitutes for customer-quality evidence.
    claimRefs: [CU008, CU009, CU010, CU014, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration remain open diligence items
    body: >-
      The largest unresolved issue is not whether Endless can describe a target customer journey; it
      is whether that journey converts into repeatable commercial adoption. Across the assigned
      sources, Endless does not disclose paid customer count, NRR or GRR, churn, contract length,
      revenue concentration, or reference-quality enterprise logos tied to production spending. That
      leaves durability unproven. Market context is mixed: Chainalysis still described APAC as the
      2025 hub of grassroots crypto activity, which is directionally helpful for a Hong Kong-based
      web3 platform, but Endless's own leadership also said Web3 still has too few real users and
      too few applications that create value beyond speculation. A further adoption risk is broader
      web3 infrastructure reliability: if customer-facing applications still depend on centralized
      RPC intermediaries, outages and procurement concerns can slow production rollouts even when the
      protocol narrative is attractive.
    claimRefs: [CU010, CU011, CU012, CU013, CU014, CU015]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Evidence of scale / adoption
      - Revenue or strategic value
      - Gap
    rows:
      - - Web2 developers
        - "Users: developers; likely payers: API or subscription customers"
        - Use familiar languages and pre-built modules to ship web3 applications
        - Official docs say Endless provides multi-language SDKs, pre-built modules, and tutorials
        - Important because these users can seed application supply and API consumption
        - No public count of active developers, shipped apps, or conversion to paid usage
      - - Web3 developers
        - "Users: crypto-native builders; payers: app teams and developers"
        - Build high-frequency, AI-enabled, or cross-chain applications
        - Official docs pitch high performance, automation, and AI analytics
        - Could drive cloud, marketplace, gas, and staking economics
        - No public split between experimentation and production deployments
      - - Project teams / app operators
        - "Buyers and payers: project teams; users: their communities"
        - Manage token issuance, governance, marketing, and community operations
        - Official docs highlight token management, private-domain operations, and distribution tools
        - Most direct route to subscription, promotion, and marketplace revenue
        - No disclosed contract size, renewal data, or named paying operators
      - - General users
        - "Users: end users; payer can shift to the developer through gas sponsorship"
        - Walletless, keyless, web2-like onboarding into social or AI applications
        - Odaily and Endless materials emphasize Google login, privacy, and gas abstraction
        - Demand-side proof matters because application activity can attract more builders
        - No independent evidence on retention, monetization, or cohort quality
    notes: >-
      Based on official positioning and assigned reporting; no row should be read as proof of paid
      customer volume, only of the buyer-user-payer structure Endless is targeting.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Luffa cumulative users
        - ">100,000 users"
        - "2025-03-06"
        - Odaily interview with Endless co-president
        - medium
        - Shows at least one disclosed application with stated scale
        - No independent audit and no paid-conversion disclosure
      - - Luffa daily active users
        - ">10,000 DAU"
        - "2025-03-06"
        - Odaily interview with Endless co-president
        - medium
        - Suggests activity beyond simple installs
        - No cohort, churn, or retention breakdown
      - - Mainnet readiness
        - Mainnet live after large-scale testing; >10,000 TPS claimed
        - "2025-03-06"
        - Odaily interview with Endless co-president
        - low
        - Indicates the platform was live when customer claims were made
        - Throughput is not the same as customer or revenue scale
      - - User-acquisition budget
        - "$1 million planned airdrop"
        - "2025-03-06"
        - Odaily interview with Endless co-president
        - medium
        - Shows willingness to subsidize ecosystem growth through Luffa
        - Incentive spend does not prove durable demand
      - - Financing signal
        - "$110 million round; $1 billion valuation"
        - 2025-03 to 2025-04
        - Coincript, Crunchbase, and Tracxn
        - medium
        - Funding can finance ecosystem expansion and distribution
        - Capital raised is not customer adoption
      - - Regional backdrop
        - APAC named the 2025 grassroots crypto hub
        - 2025
        - Chainalysis
        - medium
        - Endless sells into a region with active crypto participation
        - Macro adoption does not identify Endless-specific demand
    notes: >-
      This table mixes direct product-usage claims with supporting adoption proxies; each row states
      the missing denominator because public evidence does not establish a full customer funnel.
    claimRefs: [CU008, CU009, CU011, CU014, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome evidence
      - Limitation
    rows:
      - - Luffa
        - Consumer social application users
        - AI-driven decentralized social app built on Endless
        - Production-like company-claimed deployment
        - ">100,000 users and >10,000 DAU; used as the basis for planned airdrop targeting"
        - No independent audit, no revenue disclosure, and no retention history
      - - University of Surrey collaboration
        - AI developer / research ecosystem
        - Cooperation on large-language-model applications and web3-AI research
        - Partnered R&D signal
        - Helps explain how Endless hopes to attract developer demand
        - Not proof of a paying customer or scaled application usage
      - - Stability AI / large-model integrations
        - AI application builders
        - SDK-style access to external model providers and AI components
        - Integration / partner signal
        - Supports the claim that Endless is trying to widen the builder surface
        - No disclosed customer volumes, pricing, or production reference account
    notes: >-
      Only the Luffa row is a disclosed live application proof surface. The other rows are
      ecosystem-enablement signals included because the assigned pool does not contain three named
      paying customers or production enterprise accounts.
    enumerationScope:
      coverage: partial
      basis: >-
        Partial set of named proof surfaces disclosed in the assigned 2025-2026 source pool for
        Endless customer and ecosystem adoption.
    claimRefs: [CU008, CU009, CU010, CU015, CU016]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Endless's disclosed customer journey starts with developer enablement, routes usage through
      application operators such as Luffa, and relies on user activity to sustain ecosystem growth.
    data:
      items:
        - label: Developer discovery
          actor: Web2 and web3 developers
          stage: Acquisition
          touchpoints:
            - Multi-language SDKs
            - Pre-built modules
            - Tutorials and documentation
          note: Official docs pitch lower switching costs as the first adoption step.
        - label: Walletless onboarding
          actor: End users
          stage: Activation
          touchpoints:
            - Google-account login
            - Keyless wallet flow
            - Developer-paid gas
          note: Onboarding aims to hide web3 complexity and improve conversion.
        - label: Application build
          actor: Developers and project teams
          stage: Build
          touchpoints:
            - AI components
            - Cross-chain tools
            - Smart contract automation
          note: Builders are the clearest implied paying counterparty in public materials.
        - label: Named usage proof
          actor: Luffa users
          stage: Early scale
          touchpoints:
            - Social application
            - AI voice-to-text
            - Translation modules
          note: Luffa is the only named application in the assigned customer pool with user metrics.
        - label: Ecosystem growth loop
          actor: Project operators
          stage: Expansion
          touchpoints:
            - Airdrops
            - Component marketplace
            - Community growth tools
          note: Endless plans to use incentives and operator tools to widen usage.
        - label: Durability test
          actor: Investors and enterprise buyers
          stage: Retention
          touchpoints:
            - Repeat usage
            - Contract renewals
            - Concentration checks
          note: This stage remains the least evidenced because public retention metrics are absent.
    claimRefs: [CU001, CU005, CU006, CU008, CU009, CU010]
callouts:
  - calloutType: insight
    title: Developer adoption is the leading indicator
    body: >-
      Public materials imply that Endless wins customers first by reducing developer friction and
      only later by proving end-user retention inside applications built on the platform.
    claimRefs: [CU002, CU005, CU006, CU007]
  - calloutType: risk
    title: Customer durability is not yet proven
    body: >-
      The assigned evidence supports one named application and several ecosystem-building claims,
      but it does not disclose the retention, renewal, or concentration metrics needed to underwrite
      durable software economics.
    claimRefs: [CU010, CU013, CU014, CU015]
