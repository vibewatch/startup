evidenceGaps:
  - type: missing-source
    severity: material
    topic: corporate-identity
    missingEvidence: >-
      Registered entities, legal domicile, board roster, and statutory filings across Endless and any related foundation
      or token entities.
    whyItMatters: Identity, governance, and investor-rights analysis cannot be completed from marketing and media sources alone.
    diligencePath: Request incorporation records, organization chart, and board materials from the company or lead investor.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: financing-clarity
    missingEvidence: >-
      Primary round documents or investor-confirmed financing summary reconciling the $110 million round report with the
      $1 million strategic-investment announcement.
    whyItMatters: >-
      Valuation, ownership dilution, control rights, and total capital available all depend on whether the two financing
      disclosures are additive or overlapping.
    diligencePath: Obtain term sheet summary, cap-table rollforward, and lead-investor confirmation of round chronology.
    relatedQuestionRefs:
      - QO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Revenue, ARR, headcount, paying developer counts, enterprise customer counts, and retention metrics.
    whyItMatters: >-
      Without operating metrics, it is impossible to separate narrative momentum from commercial traction or to
      benchmark underwriting quality.
    diligencePath: Request management KPI pack, audited or reviewed financials, and cohort retention data.
  - type: private-evidence-only
    severity: material
    topic: token-governance
    missingEvidence: >-
      Treasury composition, token unlock schedule, validator concentration, and formal governance documents for the EDS
      ecosystem.
    whyItMatters: >-
      Token supply, governance control, and treasury risk can alter both user incentives and equity value capture in
      crypto infrastructure companies.
    diligencePath: Request tokenomics deck, treasury policy, validator distribution, and governance charter from the company.
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: Independent, bottom-up spending estimates for componentized Web3 developer tooling or AI-enabled Web3 middleware.
    whyItMatters: >-
      Without that spend view, public TAM claims can support a narrative but not a defensible revenue bridge for
      underwriting valuation.
    diligencePath: >-
      Request paid analyst category data or management pipeline data, then reconcile it to disclosed developer counts
      and budget owners.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: >-
      Public breakdown of free users, paying developers, paying project teams, enterprise contracts, and retention by
      monetization surface.
    whyItMatters: >-
      The conversion from ecosystem activity to durable software revenue is the key missing link between usage growth
      and investable market value.
    diligencePath: >-
      Ask management for cohort counts, paid contract counts, API usage tiers, and retention or expansion by customer
      type.
    relatedQuestionRefs:
      - QM004
      - QM005
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Public list pricing, enterprise plan detail, and realized contract economics for Endless and comparable
      alternatives.
    whyItMatters: >-
      Without comparable commercial terms, the pricing table can only compare packaging logic rather than buyer-level
      affordability or gross-margin leverage.
    diligencePath: >-
      Request current pricing sheets, sample customer contracts, and realized discount bands from Endless and benchmark
      vendors.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: benchmarked-performance
    missingEvidence: >-
      Independent benchmarks for Endless throughput, latency, reliability, and developer adoption versus alternative
      stacks.
    whyItMatters: >-
      Company-issued capability claims are not enough to prove that Endless can out-execute better-capitalized
      incumbents in production conditions.
    diligencePath: >-
      Obtain third-party benchmarks, uptime histories, customer references, and production usage data for Endless's main
      workloads.
    relatedQuestionRefs:
      - QP003
      - QP007
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: ecosystem-maturity
    missingEvidence: >-
      Independent customer logos, migration case studies, and retention or usage metrics showing that Endless has
      translated its integrated story into durable adoption.
    whyItMatters: >-
      Competitive durability depends on distribution and stickiness, but the retained public file still leans heavily on
      company-issued ecosystem descriptions.
    diligencePath: >-
      Request customer references, production-case studies, cohort usage data, and renewal evidence for the platform's
      top applications.
    relatedQuestionRefs:
      - QP005
      - QP006
      - QP008
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: >-
      Current cash balance, token-treasury composition, monthly burn, runway, and any debt or project-finance
      obligations.
    whyItMatters: >-
      Capital adequacy cannot be underwritten without knowing how long current resources can fund product, incentives,
      and infrastructure.
    diligencePath: Request the latest board deck, monthly cash bridge, treasury policy, and debt schedule from management.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by revenue stream, CAC, payback period, conversion funnel, average contract value, and
      customer-retention cohorts.
    whyItMatters: These metrics determine whether usage growth compounds into cash generation or simply scales subsidy burn.
    diligencePath: >-
      Request cohort reporting for API, cloud/storage, marketplace, and validator customers plus a stream-level cost
      allocation.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Public or private rate cards, contract samples, discount structures, and realized net revenue by monetization
      stream.
    whyItMatters: >-
      Mechanism descriptions alone do not show whether pricing power exists or whether revenue is concentrated in
      low-margin services.
    diligencePath: Obtain sample customer contracts, reseller terms, and realized billing data by stream.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: customer-quality
    missingEvidence: >-
      Paying-customer count, top-customer concentration, backlog or pipeline, and evidence that Luffa or other ecosystem
      apps convert into monetized usage.
    whyItMatters: >-
      Public user counts can overstate demand quality if they do not translate into retained, paying, or high-usage
      customers.
    diligencePath: Request customer roster, revenue concentration tables, usage cohorts, and app-level conversion metrics.
    relatedQuestionRefs:
      - QI003
      - QI004
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Independent audit reports, penetration-testing summaries, or certifications covering wallet abstraction, keyless
      login, and sponsored-gas flows.
    whyItMatters: >-
      Security posture is central to the product promise, but current evidence is mostly self-described rather than
      externally verified.
    diligencePath: Request the latest smart-contract, wallet, auth, and infrastructure audit packages plus remediation logs.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: deployment-scale
    missingEvidence: >-
      Production deployment counts, active developer metrics, application traffic, and retention or usage data for named
      ecosystem apps.
    whyItMatters: >-
      Without scale telemetry, it is difficult to separate a shipped showcase platform from a broadly adopted developer
      ecosystem.
    diligencePath: >-
      Request cohort metrics for active builders, live apps, MAU or DAU for flagship properties, and API or SDK usage
      trends.
    relatedQuestionRefs:
      - QE004
      - QE008
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: architecture-proof
    missingEvidence: >-
      Public technical documentation on validator topology, relay-network design, cross-chain dependency management, and
      versioned API or SDK references.
    whyItMatters: >-
      The platform thesis depends on several layers working together, so missing architecture detail raises integration
      and reliability risk.
    diligencePath: >-
      Request the architecture deck, network topology, public or private API docs, and release history for core SDK and
      component surfaces.
    relatedQuestionRefs:
      - QE003
      - QE005
      - QE007
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: minor
    topic: independent-benchmarks
    missingEvidence: Independent validation of transaction latency, throughput, gas-cost, or AI-component performance claims.
    whyItMatters: >-
      The headline technical advantages could matter commercially, but only if they hold up outside promotional
      contexts.
    diligencePath: >-
      Request third-party benchmark studies, internal load-test methodology, and customer references willing to discuss
      observed performance.
    relatedQuestionRefs:
      - QE003
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: Paid customer count, retention cohorts, NRR or GRR, churn, and contract-length data.
