      modular tools such as wallets, cross-chain bridges, and multi-language SDKs, allowing developers to build DApps
      like building blocks. **This "serverless architecture + fully distributed framework" design** allows Web2
      developers to migrate seamlessly without relearning the blockchain technology stack. Users can log in to their
      wallets directly through their Google accounts without even having to sense the existence of gas fees. **At the
      same time, the self-developed Keyless technology is used to protect user privacy** - all complex logic is
      encapsulated at the bottom layer, and the experience is close to mainstream Internet applications.
    canonical: SO006
