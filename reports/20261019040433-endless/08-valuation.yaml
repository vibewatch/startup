          detail: APAC crypto activity was still growing strongly into 2025.
          tone: positive
        - id: wedge
          label: Product wedge
          detail: Endless markets modular Web2-to-Web3 tooling with AI and easier onboarding.
          tone: positive
        - id: proof
          label: Early proof
          detail: Mainnet launch and Luffa traction claims exist, but are still mostly company-described.
          tone: neutral
        - id: gap
          label: Disclosure gap
          detail: Public developer, customer, revenue, and retention evidence remains sparse.
          tone: risk
        - id: risk
          label: Risk overlay
          detail: Hong Kong regulation is structured, but infrastructure and execution risk still matter.
          tone: risk
        - id: decision
          label: Decision
          detail: Research-more, high risk, stretched valuation stance at the reported mark.
          tone: risk
      edges:
        - from: market
          to: wedge
          label: creates category interest
        - from: wedge
          to: proof
          label: needs operating conversion
        - from: proof
          to: gap
          label: remains insufficiently verified
        - from: gap
          to: risk
          label: raises underwriting burden
        - from: risk
          to: decision
          label: keeps entry discipline tight
    claimRefs: [CV001, CV004, CV005, CV006, CV007, CV009, CV010]
callouts:
  - calloutType: recommendation
    title: Public-evidence verdict
    body: >-
      Endless has enough market and product signal to stay on the diligence list,
      but not enough independent traction and economics disclosure to justify
      paying through the reported $1 billion valuation today.
    claimRefs: [CV006, CV010, CV014, CV016]
