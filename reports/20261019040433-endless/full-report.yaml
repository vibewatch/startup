  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public materials imply that Endless must convert ecosystem seeding into usage-based tooling revenue before
      token-linked streams can become durable gross profit.
    data:
      nodes:
        - label: Ecosystem seeding
          detail: $1 million grant pool and a planned ~$1 million airdrop fund developer and user acquisition.
        - label: Developer onboarding
          detail: The GTM pitch emphasizes Web2-to-Web3 onboarding, multi-language SDKs, and modular components.
        - label: Tooling usage
          detail: SDK/API and cloud/storage usage are the clearest non-token monetization surfaces.
        - label: On-chain activity
          detail: Component sales, DApp distribution, gaming/NFT activity, and gas fees depend on ecosystem usage.
        - label: Token and validator economics
          detail: Staking and delegated staking add revenue only if token participation and validator demand persist.
        - label: Gross profit conversion
          detail: >-
            Cloud delivery costs, subsidies, and infrastructure pricing pressure determine whether activity becomes
            margin.
      edges:
        - from: Ecosystem seeding
          to: Developer onboarding
          label: Grants and incentives attract supply
        - from: Developer onboarding
          to: Tooling usage
          label: SDKs and infrastructure must become recurring usage
        - from: Tooling usage
          to: On-chain activity
          label: Successful applications drive transaction and marketplace volume
        - from: On-chain activity
          to: Token and validator economics
          label: Tokenized activity expands staking and fee capture
        - from: Token and validator economics
          to: Gross profit conversion
          label: Margin survives only if subsidy and infrastructure costs normalize
    approximationNotes: >-
      This is a conceptual bridge from public disclosures, not a quantified waterfall; Endless does not publish the
      conversion rates, take rates, or cost shares needed for a numeric margin model.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI015
  - id: FE001
    title: Endless product architecture map
    type: stack
    summary: >-
      Endless is presented as a layered stack that combines base-chain infrastructure, developer components, onboarding
      abstractions, and showcase applications.
    data:
      layers:
        - label: Application layer
          detail: User-facing applications promoted as proof that the stack can support live experiences.
          modules:
            - label: Luffa SocialFi app
              note: Named reference deployment in the assigned pool
            - label: Gaming / NFT / finance apps
              note: Documented as target scenarios rather than verified scaled deployments
        - label: Ecosystem and distribution layer
          detail: Commercial and ecosystem programs intended to attract builders and route applications into the stack.
          modules:
            - label: Developer grants
            - label: Component marketplace
            - label: DApp distribution surfaces
        - label: Experience and onboarding layer
          detail: Abstractions intended to make Web3 usage feel closer to Web2.
          modules:
            - label: Google-account login
            - label: Keyless wallet interaction
            - label: Gas sponsorship
            - label: Multi-currency or wallet convenience features
        - label: Privacy and control layer
          detail: Controls used to support the product’s privacy and security positioning.
          modules:
            - label: Zero-knowledge or keyless design
            - label: Data sovereignty positioning
            - label: Encrypted communication patterns
        - label: Developer component layer
          detail: Reusable building blocks meant to shorten time-to-build for teams entering Web3.
          modules:
            - label: Pre-built modules
            - label: Multi-language SDKs
            - label: APIs and plugins
            - label: Cross-chain and component tooling
            - label: AI agent / model access
        - label: Infrastructure layer
          detail: The base technical substrate that Endless says makes the higher layers possible.
          modules:
            - label: Move-based public chain
            - label: Relay networks
            - label: Distributed and serverless services
            - label: Decentralized storage
            - label: Privacy and security controls
    approximationNotes: >-
