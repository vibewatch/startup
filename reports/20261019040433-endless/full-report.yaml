              - CU006
              - CU008
              - CU009
              - CU010
      - number: '6.2'
        title: Public adoption proof is concentrated in one disclosed app
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence set contains one clearly named deployment proof surface: Luffa, which Endless's
              co-president described as an AI-driven social application built on the protocol. That makes Luffa
              important because it is the only assigned source that pairs a named product with user-count claims. The
              same interview says Luffa had more than 100,000 users and more than 10,000 daily active users in March
              2025, and that Endless intended to route a $1 million airdrop through that user base. Those are useful
              early adoption signals, but they remain company-claimed rather than independently audited, and they do not
              show whether activity came from paid customer demand, short-term incentives, or a broader portfolio of
              production apps. Financing and unicorn-status coverage confirm market attention, but they should not be
              treated as substitutes for customer-quality evidence.
            claimRefs:
              - CU008
              - CU009
              - CU010
              - CU014
              - CU015
