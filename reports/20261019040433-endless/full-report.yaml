  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Endless's disclosed customer journey starts with developer enablement, routes usage through application operators
      such as Luffa, and relies on user activity to sustain ecosystem growth.
    data:
      items:
        - label: Developer discovery
          actor: Web2 and web3 developers
          stage: Acquisition
          touchpoints:
            - Multi-language SDKs
            - Pre-built modules
            - Tutorials and documentation
          note: Official docs pitch lower switching costs as the first adoption step.
        - label: Walletless onboarding
          actor: End users
          stage: Activation
          touchpoints:
            - Google-account login
            - Keyless wallet flow
            - Developer-paid gas
          note: Onboarding aims to hide web3 complexity and improve conversion.
        - label: Application build
          actor: Developers and project teams
          stage: Build
          touchpoints:
            - AI components
            - Cross-chain tools
            - Smart contract automation
          note: Builders are the clearest implied paying counterparty in public materials.
        - label: Named usage proof
          actor: Luffa users
          stage: Early scale
          touchpoints:
            - Social application
            - AI voice-to-text
            - Translation modules
          note: Luffa is the only named application in the assigned customer pool with user metrics.
        - label: Ecosystem growth loop
          actor: Project operators
          stage: Expansion
          touchpoints:
            - Airdrops
            - Component marketplace
            - Community growth tools
          note: Endless plans to use incentives and operator tools to widen usage.
        - label: Durability test
          actor: Investors and enterprise buyers
          stage: Retention
          touchpoints:
            - Repeat usage
            - Contract renewals
            - Concentration checks
          note: This stage remains the least evidenced because public retention metrics are absent.
