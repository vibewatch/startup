  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Endless has enough financing signal to matter, but not enough public operating transparency to underwrite
              comfortably at the disclosed $1 billion valuation. Company and third-party sources agree that Endless
              raised $110 million in 2025, yet the same evidence set still leaves core diligence items unresolved: the
              exact legal-entity and governance map, independently verified security assurance, durable user adoption
              outside company statements, and realized financial performance. The risk ranking therefore starts with
              issues that can break the investment thesis despite product ambition: compliance and token-structure
              ambiguity, security and infrastructure reliability, and commercialization risk if developer or user
              adoption remains below the level needed to support staking, transaction, API, and ecosystem-fee
              monetization.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR008
              - CR009
              - CR012
