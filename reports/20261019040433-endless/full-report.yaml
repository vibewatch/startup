            title: Public opacity still blocks capital-adequacy underwriting
            body: >-
              The funding signal is credible, but the public file still lacks cash, burn, runway, debt, margin,
              customer, and pricing disclosure, so an investor cannot yet judge whether current growth depends on
              durable economics or continuing subsidy.
            calloutType: risk
            claimRefs:
