  - id: TV001
    title: Recommendation summary table
    columns:
      - Lever
      - Current read
      - Evidence signal
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Financing signal exists, but the public proof gap remains wide.
        - Do not underwrite a buy from public information alone.
      - - Confidence
        - medium
        - Product narrative is coherent, but independent traction evidence is sparse.
        - Keep conviction below write-check threshold.
      - - Risk rating
        - high
        - Crypto infrastructure, disclosure, and regulatory dependencies remain material.
        - Require tighter diligence and downside protection.
      - - Valuation stance
        - stretched
        - A reported $1B round exists, but public comps and KPIs do not yet support upside underwriting.
        - Entry should wait for stronger proof or materially better terms.
