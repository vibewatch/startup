  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What Endless is trying to deliver
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently frame Endless as infrastructure rather than a single application: a Web3
              Genesis Cloud meant to help Web2 teams move into on-chain products with modular tooling, decentralized
              storage, wallet abstractions, and AI-enabled components instead of raw chain primitives alone. The
              company’s own docs broaden the target set beyond crypto-native teams to Web2 developers, Web3 developers,
              project teams, and end users, which matters because the product promise is to simplify both application
              building and end-user onboarding in the same stack rather than monetizing only a developer API.      
              Third-party descriptions are directionally aligned: U.Today and Bitget both describe Endless as a bridge
              that helps Web2 teams ship Web3 products with a componentized platform rather than a bare protocol. That
              consistency is useful for diligence, but it also means the public story is still dominated by positioning
              language, so underwriting should focus on whether the modules are actually adopted in production and not
              just clearly described on the official surface.
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE008
              - CE013
              - CE014
      - number: '5.2'
        title: Architecture and workflow design
        blocks:
          - type: paragraph
            body: >-
              The most concrete architecture description in the assigned pool is a three-layer model:
              infrastructure/public chain, a componentized developer layer, and user-facing applications. Official pages
              complement that framing by describing SDKs, APIs, relay networks, serverless and distributed services,
              modular components, and decentralized storage as part of the same operating model. The intended workflow
              is clear: give developers pre-built modules and multi-language SDKs, then remove user friction with wallet
              abstraction, Google-based login, and gas sponsorship. That is a coherent product thesis for Web2-to-Web3
              conversion because it attacks both developer complexity and consumer onboarding cost at once. What remains
              less clear is the operational implementation behind the abstraction. The pool does not contain a public
              API reference, versioned changelog, validator/network topology, or benchmark pack that would let an
              investor test how much of the stack is production-grade versus still aspirational.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
