          - type: callout
            title: The default substitute is still a stitched-together stack
            body: >-
              Buyers can still outsource node access to incumbent RPC providers or run their own infrastructure, so
              Endless must beat the market's existing multi-vendor operating model, not just named startup peers.
            calloutType: insight
