        title: Identity and product scope
        blocks:
          - type: paragraph
            body: >-
              Assigned sources consistently describe Endless as a Move-based, AI-oriented Web3 infrastructure project
              trying to lower the migration cost from Web2 into blockchain applications. Official materials emphasize
              modular components, multi-language SDKs, and a one-stop development layer, while third-party coverage
              repeats the same positioning through user-friendly onboarding and developer-paid gas narratives. The story
              is coherent enough to anchor later chapters, but it still depends heavily on company-authored or
              company-shaped descriptions rather than neutral technical audits or customer deployment evidence.
