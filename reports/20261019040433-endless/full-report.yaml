      - number: '5.3'
        title: Maturity and proof points
        blocks:
          - type: paragraph
            body: >-
              Endless appears to have crossed the minimum threshold from concept to shipped platform: multiple 2025
              sources place the project on mainnet and describe a live Move-based chain paired with application tooling.
              The clearest product proof in the assigned pool is Luffa, which both Analytics Insight and Odaily present
              as a SocialFi application built on Endless with encrypted messaging, wallet features, and AI-related
              functions. That is useful as a reference architecture because it shows the company can point to at least
              one concrete application layer example. Still, the maturity picture remains incomplete. The assigned
              Developer Report page exposes no Endless-specific activity series, while the broader public file does not
              disclose deployment counts, customer logos tied to production traffic, or independent usage telemetry. The
              evidence therefore supports “launched platform with a showcase app” much more strongly than “scaled
              developer ecosystem.” Chainalysis documents a favorable APAC adoption backdrop, but sector growth is not
              evidence of adoption for this specific protocol.
            claimRefs:
              - CE004
              - CE008
              - CE013
              - CE014
      - number: '5.4'
        title: Dependencies, controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Endless’s differentiation is also its execution burden. By promising a unified stack that spans chain
              infrastructure, cross-chain access, wallet abstraction, AI plugins, and application components, the
              company must keep several dependency surfaces reliable at the same time. Official materials heavily
              emphasize privacy, security, and data sovereignty, but the       assigned pool does not include
              third-party audit reports, uptime history, incident logs, or external certification evidence that would
              let an investor verify those claims independently. Bitget repeats specific controls such as AES-256
              encryption and Shamir key management, but it is a directory-style third-party description rather than an
              audit or certification. Endless may be trying to reduce infrastructure exposure with relay networks and
              distributed services, but the public evidence is not detailed enough to show how resilient its own
              architecture is in practice. That gap matters more than the marketing breadth because it is the difference
              between a compelling integration thesis and a platform that can actually carry production workloads.
            claimRefs:
              - CE009
              - CE010
              - CE012
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Product design clearly targets Web2 friction
            body: >-
              Endless’s strongest product signal is not raw blockchain novelty but the attempt to collapse wallet setup,
              gas funding, component assembly, and AI integration into a single onboarding path for developers and end
              users.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
          - type: callout
            title: Public proof lags the breadth of the architecture story
            body: >-
              The evidence set supports a coherent architecture narrative and at least one showcase app, but not yet a
              deeply auditable view of security, uptime, usage, or ecosystem scale.
            calloutType: risk
            claimRefs:
              - CE008
              - CE013
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment map and who likely pays
        blocks:
          - type: paragraph
            body: >-
              Endless describes four target groups in its own business-model materials: Web2 developers, Web3
              developers, project teams, and general users. That mix matters because the buyer, user, and payer are not
              the same across the funnel. Developers and project teams appear to be the acquisition wedge: the platform
              pitches SDKs, APIs, modular components, cloud services, and promotion tooling to help them ship
              applications and operate tokenized communities. End users matter as the demand signal, but the public
              monetization design implies that developer usage, application operators, and possibly validator
              participants are the more direct economic counterparties. This means Endless still has to convert
              product-interest claims into durable developer adoption before investors can treat end-user growth as a
              stable revenue proxy.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU016
