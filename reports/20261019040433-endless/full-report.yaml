      - number: '4.2'
        title: Public traction proxies point to ecosystem seeding, not proven sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Public signals suggest Endless is still relying on developer and ecosystem seeding rather than disclosing
              a repeatable enterprise sales engine. The company and company-quoted coverage emphasize Web2-to-Web3
              onboarding, multi-language SDKs, gas subsidization, and community growth tools such as a developer grant
              program and a planned airdrop tied to the Luffa application. The clearest user metric in the assigned pool
              is management's claim that Luffa had accumulated more than 100,000 users and more than 10,000 daily active
              users in March 2025. That is a useful adoption proxy, but it is not the same thing as paid customer count,
              ARR, retention, or CAC efficiency. Even Endless's DEV Community presence is evidence of developer-facing
              GTM, not proof of monetized demand. [CI005] [CI007] [CI008] [CI009] [CI010]
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Margin path likely depends on infrastructure efficiency and how long incentives stay elevated
        blocks:
          - type: paragraph
            body: >-
              The public model implies meaningful service-delivery and ecosystem-seeding costs even before the company
              reports a revenue base. Endless's own materials tie monetization to cloud and storage delivery, validator
              participation, token-funded incentives, and gas-fee flows, while third-party coverage highlights grant
              budgets, airdrop plans, and gas payment proxies for user onboarding. That matters because Web3
              infrastructure categories can become commoditized quickly: Forbes' review of RPC infrastructure argues the
              business can turn into a scale-driven pricing contest while remaining exposed to outages and
              centralized-cloud dependencies, and Aptos's 2026 capital plan shows that comparable Move-based ecosystems
              still commit substantial funding to infrastructure, research, and external ecosystem support. Chainalysis
              adds the demand tailwind—crypto adoption and institutional participation are still growing—but market
              growth alone does not prove Endless can defend price or gross margin. [CI003] [CI005] [CI011] [CI012]
              [CI013] [CI015]
            claimRefs:
              - CI003
              - CI005
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Funding signal is real; underwriting data are still missing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence is strong enough to confirm that Endless reached unicorn status in 2025 and that
              external coverage repeatedly cited roughly $110 million in financing. That gives the business real
              capital-market credibility, and the company is clearly spending against product, ecosystem, and
              user-acquisition goals. What remains missing is the operating balance-sheet view an investor needs to
              judge financing dependency: no source in the assigned pool discloses cash on hand, monthly burn, runway,
              debt obligations, token-treasury composition, customer concentration, realized pricing, or gross margin by
              stream. The practical verdict is therefore mixed. Endless may have enough capital to keep building the
              platform, but the public file still does not let an underwriter distinguish healthy planned investment
              from subsidy-heavy growth that will require another round before the revenue model is proven. [CI006]
              [CI014] [CI015]
            claimRefs:
              - CI006
              - CI014
              - CI015
          - type: table
            tableRef: TI003
