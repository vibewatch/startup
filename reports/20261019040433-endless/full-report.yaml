  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization architecture is broad, but still mostly conceptual
        blocks:
          - type: paragraph
            body: >-
              Endless's own business-model materials describe a wide menu of revenue streams rather than a disclosed
              current mix. The company says it can charge marketplace take-rates on component sales, usage-based API
              calls, enterprise subscriptions, pay-as-you-go cloud and storage fees, staking-management economics,
              gas-related transaction fees, distribution fees for DApps and mini-programs, and transaction fees in
              gaming or NFT marketplaces. That breadth matters because it means the business can monetize both off-chain
              developer tooling and on-chain activity. The problem is disclosure depth: the public docs outline
              mechanisms, not realized prices, contract lengths, attach rates, or contribution margins, so investors can
              see the intended bridge from activity to revenue but not the present economics of each stream. [CI001]
              [CI002] [CI003] [CI004]
