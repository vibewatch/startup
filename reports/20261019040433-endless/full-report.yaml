  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Current read
      - What would change the view
    rows:
      - - Product thesis
        - Web2-to-Web3 tooling, modular components, and easier onboarding form a legible developer wedge.
        - Independent evidence on production usage, customer wins, and retention.
      - - Financing signal
        - The reported $110M/$1B round shows investor appetite and narrative strength.
        - >-
          Round documents, cap-table terms, and evidence that insiders and new money support follow-on adoption
          milestones.
      - - Proof gap
        - Most traction evidence remains company-described, while public developer dashboards are still thin.
        - Third-party customer references, revenue disclosure, and cohort-style usage data.
      - - Risk overlay
        - Structured Hong Kong rules help, but infrastructure concentration and execution risk still matter.
        - Evidence of resilient production workloads, compliance readiness, and diversified dependency paths.
      - - Capital reference
        - >-
          Aptos announced a separate $50M blockchain-stack commitment, illustrating capital intensity but not supplying
          an Endless valuation multiple.
        - Comparable private-round terms or public operating metrics on genuinely similar developer platforms.
    notes: >-
      Arguments distinguish between company-described positioning and independent validation; absence of proof is
      treated as a diligence gap, not as proof of failure.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV013
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Independent developer and customer KPIs appear; gas abstraction and modular tooling drive measurable adoption;
          regulation stays navigable.
        - >-
          No numeric range is supportable publicly; a re-rate case would require verified operating KPIs and the actual
          financing terms.
        - Customer concentration, token overhang, and infrastructure reliability still need monitoring.
        - Positive only after third-party traction evidence and clean cap-table disclosure.
      - - Base
        - Product story remains credible, but public disclosure stays thin and most proof points remain company-shaped.
        - No numeric range is supportable; treat the reported $1B mark as a financing reference rather than fair value.
        - Narrative remains ahead of verifiable monetization and usage.
        - This is the current public-evidence signal.
      - - Bear
        - >-
          Adoption proof remains opaque, financing terms are senior or dilutive, or execution/regulatory risk
          intensifies.
        - No defensible public floor exists because cash, preference, token, and operating inputs are missing.
        - Down-round risk, treasury or token pressure, and commercialization miss.
        - Negative if KPI disclosure stays absent or diligence finds adverse terms.
    notes: >-
      Scenario logic uses the reported $1B financing mark as the only public valuation anchor and keeps upside/downside
      framing qualitative where hard inputs are absent.
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
      - CV016
