    data:
      items:
        - date: '2024-05-29'
          label: SEC flags ongoing crypto-asset scam risk
          detail: >-
            A sector backdrop rather than a company event: the SEC investor alert reinforces why Endless's retail-facing
            token and incentive claims need cautious diligence.
          tone: adverse
        - date: '2025-02-26'
          label: Strategic investment announcement published
          detail: >-
            Coin Cript reported a $1 million strategic investment from Foresight Ventures to accelerate AI agents and
            support Luffa ecosystem growth.
          tone: positive
        - date: '2025-02-26'
          label: Investor governance role publicized
          detail: >-
            The same February announcement said Foresight would take an active role in governance, future development,
            and ecosystem expansion.
          tone: medium
        - date: '2025-03-06'
          label: Leadership and Surrey ties profiled
          detail: >-
            Odaily's interview highlighted Yu Xiong, Amit Kumar Jaiswal, Ned, and the University of Surrey as the
            backbone of Endless's public credibility story.
          tone: neutral
        - date: '2025-03-06'
          label: Luffa and airdrop plan showcased
          detail: >-
            Odaily described Luffa as built on Endless and said a $1 million airdrop plan would be used to stimulate
            ecosystem activity.
          tone: positive
        - date: Mar 2025
          label: Crunchbase records unicorn financing signal
