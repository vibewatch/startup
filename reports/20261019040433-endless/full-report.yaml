              - CU009
              - CU010
              - CU015
              - CU016
      - number: '6.3'
        title: Durability, expansion, and concentration remain open diligence items
        blocks:
          - type: paragraph
            body: >-
              The largest unresolved issue is not whether Endless can describe a target customer journey; it is whether
              that journey converts into repeatable commercial adoption. Across the assigned sources, Endless does not
              disclose paid customer count, NRR or GRR, churn, contract length, revenue concentration, or
              reference-quality enterprise logos tied to production spending. That leaves durability unproven. Market
              context is mixed: Chainalysis still described APAC as the 2025 hub of grassroots crypto activity, which is
              directionally helpful for a Hong Kong-based web3 platform, but Endless's own leadership also said Web3
              still has too few real users and too few applications that create value beyond speculation. A further
              adoption risk is broader web3 infrastructure reliability: if customer-facing applications still depend on
              centralized RPC intermediaries, outages and procurement concerns can slow production rollouts even when
              the protocol narrative is attractive.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Developer adoption is the leading indicator
            body: >-
              Public materials imply that Endless wins customers first by reducing developer friction and only later by
              proving end-user retention inside applications built on the platform.
            calloutType: insight
            claimRefs:
              - CU002
              - CU005
