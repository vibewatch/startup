          note: Chainalysis highlights India, Pakistan, and Vietnam, with North America rising on regulatory momentum.
        - label: Commercial tokenization beachheads
          value: Fixed income, repos, money-market funds, equities
          note: IOSCO identifies these as the areas showing the clearest early commercial traction.
        - label: Core buyer groups
          value: Four groups
          note: Endless names Web2 developers, Web3 developers, project teams, and general users.
        - label: Near-term application categories
          value: Six categories
          note: Endless highlights social, short-video, music, commerce, AI, and finance use cases.
        - label: Current ecosystem proof point
          value: Luffa >100k users
