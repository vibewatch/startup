  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and alternatives
        blocks:
          - type: paragraph
            body: >-
              Endless is publicly framing itself as a broad Web3 application platform, not just a chain or wallet. Its
              own materials describe a Move-based public chain, distributed storage, relay networks, SDKs, APIs, login
              and wallet components, and gas abstraction aimed at helping Web2 developers ship Web3 applications without
              rebuilding core infrastructure from scratch. That scope means the real comparison set is broader than
              "other Move chains": buyers can choose a managed developer cloud such as Alchemy, a narrow
              interoperability layer such as LayerZero, a better-funded base chain such as Aptos, or the status quo of
              running nodes internally or through centralized RPC vendors. The substitute set is therefore defined by
              who can remove developer friction fastest, not by who shares Endless's exact product language.
