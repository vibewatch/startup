  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and who is actually buying
        blocks:
          - type: paragraph
            body: >-
              The company-issued material consistently frames Endless as a bridge layer between familiar Web2
              development practices and more complex Web3 infrastructure, not as a single consumer application or a pure
              DeFi venue. The practical market boundary is therefore developer and project-team spend on componentized
              Web3 tooling, middleware, and supporting infrastructure that can shorten time to launch, simplify
              onboarding, and hide blockchain complexity from end users. That boundary excludes the entire value of
              cryptoasset trading, excludes generic public-cloud spend that has nothing to do with on-chain workflows,
              and excludes status-quo consumer apps unless they are actually migrating workloads on-chain. The buyer
              universe is also multi-sided: developers need SDKs and components, project teams need growth and token
              tools, and end users matter mainly because their experience determines whether the developer's budget
              produces adoption.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
      - number: '2.2'
        title: Constrained sizing lenses point to demand, not a clean TAM
        blocks:
          - type: paragraph
            body: >-
              The assigned independent evidence supports market demand through proxy lenses rather than a single clean
              TAM/SAM/SOM stack. Chainalysis shows broad grassroots crypto usage across many countries and a strong APAC
              footprint, which matters because Endless is positioning itself as a platform for higher-volume consumer
              and AI-driven applications rather than a niche institutional workflow. IOSCO adds a more conservative
              lens: tokenization is attracting real commercial interest, but adoption is still early and uneven, with
              only a few capital-markets workflows clearly leading. Crunchbase then provides a capital-market signal
              that investors still fund Web2-to-Web3 infrastructure narratives. Taken together, those sources support a
              live market with valuation relevance, but not a bottom-up public spending estimate for Endless's exact
              category.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM013
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM007
              - CM010
              - CM011
              - CM015
      - number: '2.3'
        title: Adoption drivers are real, but the bottlenecks are still structural
        blocks:
          - type: paragraph
            body: >-
              The strongest demand drivers in the pool are easy to understand: Web3 still suffers from high developer
              learning costs, fragmented protocols, awkward user experiences, and infrastructure complexity, so a
              platform that reduces those frictions can capture budget from teams trying to ship faster. Endless's own
              revenue model also shows several monetizable surfaces, from component sales to API usage and cloud-like
              service fees. The constraint side is just as important. IOSCO says tokenization still faces
              interoperability and settlement-asset bottlenecks, while a disclosed-market column in Forbes argues that
              centralized RPC infrastructure creates reliability and censorship risks. That means market demand is
              likely to expand first in workflows where better developer ergonomics, wallet abstraction, and resilient
              infrastructure solve an immediate pain point; it does not justify assuming rapid, category-wide spending
              conversion without private usage and monetization data.
            claimRefs:
              - CM004
