              - CU007
          - type: callout
            title: Customer durability is not yet proven
            body: >-
              The assigned evidence supports one named application and several ecosystem-building claims, but it does
              not disclose the retention, renewal, or concentration metrics needed to underwrite durable software
              economics.
            calloutType: risk
            claimRefs:
              - CU010
