              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Revenue design is ecosystem-toll oriented
            body: >-
              Endless's public model does not look like a single-product SaaS plan; it looks like a layered
              infrastructure and marketplace stack that monetizes developer activity, infrastructure consumption, token
              participation, and application distribution at different points in the ecosystem.
            calloutType: insight
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
