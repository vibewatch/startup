          - type: callout
            title: Better-capitalized alternatives can outspend Endless on distribution
            body: >-
              The public capital signals in the retained file are asymmetric: Endless disclosed a $1 million strategic
              investment, while LayerZero and Alchemy disclosed much larger funding rounds and broader visible
              distribution.
            calloutType: risk
            claimRefs:
