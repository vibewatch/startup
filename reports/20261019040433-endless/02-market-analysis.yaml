  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Independent, bottom-up spending estimates for componentized Web3 developer tooling or AI-enabled Web3 middleware.
      whyItMatters: Without that spend view, public TAM claims can support a narrative but not a defensible revenue bridge for underwriting valuation.
      diligencePath: Request paid analyst category data or management pipeline data, then reconcile it to disclosed developer counts and budget owners.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-economics
      missingEvidence: Public breakdown of free users, paying developers, paying project teams, enterprise contracts, and retention by monetization surface.
      whyItMatters: The conversion from ecosystem activity to durable software revenue is the key missing link between usage growth and investable market value.
      diligencePath: Ask management for cohort counts, paid contract counts, API usage tiers, and retention or expansion by customer type.
      relatedQuestionRefs: [QM004, QM005]
      relatedTableRefs: [TM003]
