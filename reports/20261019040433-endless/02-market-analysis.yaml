schemaVersion: report-v2
artifact: market-analysis
slug: endless
runDate: 2026-10-19
company:
  name: Endless
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Endless is not selling into "all of crypto"; its practical market is the narrower
    layer of tooling and infrastructure that helps Web2 and Web3 teams ship usable
    on-chain applications without rebuilding wallet, storage, AI, or cross-chain
    plumbing from scratch. Independent sources support real adoption tailwinds in
    tokenization and grassroots crypto use, but they also show uneven commercialization,
    persistent infrastructure bottlenecks, and a lack of public spend data for
    Endless's exact niche, so market sizing has to stay proxy-based rather than
    headline-TAM driven.
sections:
  - id: market-boundary
    title: Market boundary and who is actually buying
    body: >-
      The company-issued material consistently frames Endless as a bridge layer
      between familiar Web2 development practices and more complex Web3 infrastructure,
      not as a single consumer application or a pure DeFi venue. The practical market
      boundary is therefore developer and project-team spend on componentized Web3
      tooling, middleware, and supporting infrastructure that can shorten time to
      launch, simplify onboarding, and hide blockchain complexity from end users.
      That boundary excludes the entire value of cryptoasset trading, excludes generic
      public-cloud spend that has nothing to do with on-chain workflows, and excludes
      status-quo consumer apps unless they are actually migrating workloads on-chain.
      The buyer universe is also multi-sided: developers need SDKs and components,
      project teams need growth and token tools, and end users matter mainly because
      their experience determines whether the developer's budget produces adoption.
    claimRefs: [CM001, CM002, CM003, CM012]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Constrained sizing lenses point to demand, not a clean TAM
    body: >-
      The assigned independent evidence supports market demand through proxy lenses
      rather than a single clean TAM/SAM/SOM stack. Chainalysis shows broad grassroots
      crypto usage across many countries and a strong APAC footprint, which matters
      because Endless is positioning itself as a platform for higher-volume consumer
      and AI-driven applications rather than a niche institutional workflow. IOSCO
      adds a more conservative lens: tokenization is attracting real commercial
      interest, but adoption is still early and uneven, with only a few capital-markets
      workflows clearly leading. Crunchbase then provides a capital-market signal
      that investors still fund Web2-to-Web3 infrastructure narratives. Taken together,
      those sources support a live market with valuation relevance, but not a
      bottom-up public spending estimate for Endless's exact category.
    claimRefs: [CM005, CM006, CM007, CM011, CM013, CM015]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: drivers-constraints-and-gaps
    title: Adoption drivers are real, but the bottlenecks are still structural
    body: >-
      The strongest demand drivers in the pool are easy to understand: Web3 still
      suffers from high developer learning costs, fragmented protocols, awkward user
      experiences, and infrastructure complexity, so a platform that reduces those
      frictions can capture budget from teams trying to ship faster. Endless's own
      revenue model also shows several monetizable surfaces, from component sales to
      API usage and cloud-like service fees. The constraint side is just as important.
      IOSCO says tokenization still faces interoperability and settlement-asset
      bottlenecks, while a disclosed-market column in Forbes argues that centralized
      RPC infrastructure creates reliability and censorship risks. That means market
      demand is likely to expand first in workflows where better developer ergonomics,
      wallet abstraction, and resilient infrastructure solve an immediate pain point;
      it does not justify assuming rapid, category-wide spending conversion without
      private usage and monetization data.
    claimRefs: [CM004, CM008, CM009, CM010, CM014, CM016]
    tableRefs: [TM003]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment or category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Componentized Web3 developer tooling
        - SDK, API, storage, wallet, identity, cross-chain, and modular app-building spend tied to shipping on-chain apps
        - Generic software tooling unrelated to blockchain workflows
        - Engineering, product, or platform teams
        - Core market because Endless explicitly sells multi-language tooling and reusable components
      - - Web3 project operating stack
        - Token management, community operations, app distribution, and growth tooling used by project teams
        - Pure token speculation or treasury marks with no tooling purchase
        - Project teams, ecosystem operators, or growth owners
        - Relevant because Endless says it serves project teams and monetizes distribution plus token tooling
      - - High-concurrency consumer or AI-enabled on-chain apps
        - Infrastructure spend for social, content, AI, commerce, gaming, and finance apps that need better onboarding and lower friction
        - All consumer internet spending outside on-chain or tokenized workflows
        - App operators funding user acquisition and user-experience improvements
        - Relevant because Endless positions these categories as its target application set
      - - Status-quo substitutes
        - Legacy Web2 stacks, existing RPC or wallet layers, and incumbent chain infrastructure budgets that can be displaced
        - Entire value of crypto trading or token prices
        - Teams choosing whether to build, abstract, or outsource Web3 complexity
        - Important because Endless competes against do-nothing, build-in-house, and incumbent infrastructure choices
    notes: >-
      Included and excluded spend are analytical boundary calls based on the assigned
      sources; they are not disclosed market-size values.
    claimRefs: [CM001, CM002, CM003, CM012]
  - id: TM002
    title: TAM / SAM / SOM or sizing lens table
    columns:
      - Publisher
      - Year
      - Geography
      - Value
      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Chainalysis
        - "2025"
        - Global
        - 151 countries ranked; index built from four sub-indices and more than 13 billion web visits
        - n/a
        - Web-traffic and on-chain adoption index
        - Medium
        - Measures crypto activity, not software spend on developer tooling
      - - IOSCO
        - "2025"
        - Global capital markets
        - Tokenization shows growing commercial interest, but adoption remains incipient and uneven
        - n/a
        - Regulatory literature review, surveys, and stakeholder outreach
        - High
        - Describes workflow maturity rather than a revenue TAM
      - - Crunchbase News
        - "2025"
        - Global venture market
        - 11 new March unicorns; Endless reached a $1 billion valuation after a $110 million growth-stage round
        - n/a
        - Reported funding and valuation events
        - Medium
        - Valuation is a capital-market signal, not end-market demand
      - - Odaily Planet Daily
        - "2025"
        - Endless ecosystem
        - Luffa cited at more than 100,000 users and tens of thousands of daily active users
        - n/a
        - Management interview relayed by a media outlet
        - Low
        - Ecosystem proof point is company-provided and not a market-wide benchmark
    notes: >-
      The chapter has no assigned source that supports a clean public TAM/SAM/SOM for
      Endless's exact niche, so this table preserves the available adoption and capital
      proxies instead of inventing a revenue-sized market.
    claimRefs: [CM005, CM006, CM007, CM011, CM013, CM015]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Web2 developers
        - App teams moving Web2 products or features on-chain
        - Developers using SDKs, APIs, wallet abstraction, and storage modules
        - Product or engineering organization
        - Build new dApps without relearning an entirely new blockchain stack
        - Engineering or platform tooling owner
        - Need to reduce learning curve and shorten time to launch
      - - Web3 developers
        - Existing crypto-native builders
        - Smart-contract and app developers
        - Protocol or application team
        - Improve performance, automation, and component reuse for higher-workload apps
        - Technical lead or protocol team
        - Need more scalable infrastructure or AI-enabled components
      - - Project teams
        - Ecosystem operators and tokenized projects
        - Community, growth, and token-operations teams
        - Project treasury or operating budget
        - Manage token issuance, distribution, marketing, and user activation
        - Growth, community, or token-operations owner
        - Need better retention, community tooling, or ecosystem growth mechanics
      - - General users
        - End users reached through partner apps
        - Wallet holders or app users
        - Usually not the direct software payer; monetization comes through app operators and on-chain fees
        - Use simplified wallets, sponsored gas, and Web2-like login flows
        - Consumer product owner at the app layer
        - Need lower-friction onboarding and a Web2-like experience
    notes: >-
      Buyer, payer, and budget-owner fields combine company disclosures with chapter-level
      inference about who would actually control the spend for the described workflow.
    claimRefs: [CM002, CM004, CM010, CM016]
figures:
  - id: FM001
    title: Constrained adoption stack for Endless-style demand
    type: pyramid
    summary: >-
      The opportunity narrows from broad crypto activity to the smaller set of teams
      willing to pay for easier onboarding, modular tooling, and more resilient Web3
      infrastructure.
    data:
      items:
        - label: Broad crypto activity base
          value: 151 countries
          note: Chainalysis covers 151 countries and more than 13 billion web visits.
        - label: Highest-grassroots-adoption markets
          value: APAC leads; North America accelerating
          note: Chainalysis highlights India, Pakistan, and Vietnam, with North America rising on regulatory momentum.
        - label: Commercial tokenization beachheads
          value: Fixed income, repos, money-market funds, equities
          note: IOSCO identifies these as the areas showing the clearest early commercial traction.
        - label: Core buyer groups
          value: Four groups
          note: Endless names Web2 developers, Web3 developers, project teams, and general users.
        - label: Near-term application categories
          value: Six categories
          note: Endless highlights social, short-video, music, commerce, AI, and finance use cases.
        - label: Current ecosystem proof point
          value: Luffa >100k users
          note: Odaily reports an early app-level workload example, not market-wide adoption.
    approximationNotes: >-
      This is a constrained opportunity stack rather than a proportional TAM graphic;
      the layers mix adoption, workflow, and buyer filters because the assigned public
      evidence does not support a bottom-up revenue-sized market estimate.
    claimRefs: [CM002, CM007, CM010, CM011, CM015]
