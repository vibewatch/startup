callouts:
- calloutType: insight
  title: Narrative maturity exceeds disclosure maturity
  body: Endless already has a polished story around AI plus Web3, a named flagship app, and visible academic partners, but the assigned pool is still light on audited financials, entity maps, and independently verified commercial traction.
  claimRefs:
  - CO001
  - CO004
  - CO011
  - CO012
- calloutType: risk
  title: Governance and financing need primary documents
  body: The strongest unresolved diligence item is not whether Endless can tell a product story; it is whether investors can reconcile the financing history, investor rights, legal entities, and token-governance mechanics from primary documentation.
  claimRefs:
  - CO005
  - CO006
  - CO015
