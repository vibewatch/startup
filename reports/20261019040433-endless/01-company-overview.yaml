company:
  name: Endless
chapter:
  number: 1
  title: Company Overview
  summary: Endless presents as an early-stage Web3 infrastructure unicorn with a coherent Web2-to-Web3 product story and visible academic/technical spokespeople, but its public file still leaves legal-entity, governance, financing-sequence, and commercial-traction details thin. The strongest externally corroborated facts are the March 2025 unicorn financing signal and Hong Kong-based market positioning; most usage, token, and operating metrics still trace back to company-shaped narratives rather than independent disclosure.
sections:
- id: identity-and-product-scope
  title: Identity and product scope
  body: Assigned sources consistently describe Endless as a Move-based, AI-oriented Web3 infrastructure project trying to lower the migration cost from Web2 into blockchain applications. Official materials emphasize modular components, multi-language SDKs, and a one-stop development layer, while third-party coverage repeats the same positioning through user-friendly onboarding and developer-paid gas narratives. The story is coherent enough to anchor later chapters, but it still depends heavily on company-authored or company-shaped descriptions rather than neutral technical audits or customer deployment evidence.
  claimRefs:
  - CO001
  - CO002
  - CO016
  tableRefs:
  - TO001
- id: leadership-governance-and-footprint
  title: Leadership, governance, and footprint
  body: The public leadership picture centers on a small set of named spokespeople rather than a fully disclosed operating or board structure. Yu Xiong and Amit Kumar Jaiswal are the most visible executives in the assigned pool, and the University of Surrey relationship is a recurring credibility anchor. Foresight Ventures also appears not just as capital but as a claimed governance participant. At the same time, the public record here does not resolve founders of record, directors, legal entities, or ownership rights across Endless, related foundations, and token-governance surfaces.
  claimRefs:
  - CO005
  - CO007
  - CO008
  - CO009
  - CO010
  tableRefs:
  - TO002
  - TO003
- id: capital-stage-and-scale-signals
  title: Capital, stage, and scale signals
  body: 'The clearest external market signal is Crunchbase''s March 2025 description of Endless as a Hong Kong-based unicorn that raised $110 million at a $1 billion valuation. However, a separate February 2025 announcement publicized a $1 million strategic investment from the same lead investor and implied a governance role, so the exact sequence and cumulative amount of capital are still not cleanly disclosed. Public scale indicators are likewise mixed: Luffa is presented as a real ecosystem application and the GitHub organization shows visible tooling, but revenue, paying customers, ARR, and headcount remain undisclosed in this pool.'
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  - CO011
  - CO012
  - CO013
  - CO014
  - CO016
- id: milestones-and-open-diligence-asks
  title: Milestones and open diligence asks
  body: 'The 2025 source set provides enough dated events to sketch a launch-era timeline: a strategic investment announcement in February, deeper public interviews and ecosystem claims in March, and a festival keynote plus developer-grant messaging in April. Those milestones show momentum, but not yet durable underwriting quality. The biggest remaining work items are entity and board confirmation, financing reconciliation, token-governance documents, and hard commercial KPIs that separate promotional reach from monetized platform adoption. Sector-level crypto fraud risk also means investor diligence should treat retail-facing token and incentive claims conservatively until independently verified.'
  claimRefs:
  - CO004
  - CO005
  - CO011
  - CO013
  - CO014
  - CO015
  figureRefs:
  - FO001
tables:
- id: TO001
  title: Snapshot KPI table
  columns:
  - Metric
  - Value / status
  - Date
  - Confidence
  - Gap / diligence ask
  rows:
  - - Headquarters / operating base
    - Crunchbase lists Hong Kong; interview materials describe a distributed team with a UK core and members in Hong Kong, Japan, and Thailand.
    - Mar-Apr 2025
    - Medium
    - Confirm legal domicile, registered entities, and where formal board decisions sit.
  - - Stage
    - Growth-stage private company; March 2025 coverage places Endless on the unicorn board.
    - Mar 2025
    - Medium
    - Request cap-table detail, share-class terms, and liquidation preferences.
  - - Valuation
    - $1 billion valuation reported by Crunchbase.
    - Mar 2025
    - Medium
    - Verify with round documents or lead-investor confirmation.
  - - Latest financing signal
    - $110 million growth-stage round reported by Crunchbase; separate $1 million strategic investment announcement may overlap rather than add.
    - Feb-Mar 2025
    - Medium
    - Reconcile the financing sequence and whether both announcements describe the same fundraising cycle.
  - - Revenue / ARR
    - Not disclosed in the assigned pool.
    - As of 2026-10-19
    - Low
    - Request management financials; do not substitute token activity or user counts for revenue.
  - - Customers / paid usage
    - No enterprise customer or paying-developer count disclosed; Luffa user metrics are not customer metrics.
    - Mar 2025
    - Low
    - Request paying project-team, enterprise, and developer-account counts plus retention cohorts.
  - - Developer signal
    - endless-labs GitHub shows public repos across framework, bridge, SDK, plugin, and release tooling.
    - As fetched
    - Medium
    - Verify external contributor share, release cadence, and production usage by third parties.
  - - Governance disclosure
    - Foresight is described as having an active governance role, but board, token-governance, and entity-control details remain opaque.
    - Feb 2025
    - Medium
    - Obtain board roster, governance charter, token-governance docs, and investor-rights summary.
  notes: Combines external reporting, company-shaped statements, and explicit null paths; unsupported financial or customer quantities are left undisclosed rather than inferred.
  claimRefs:
  - CO003
  - CO004
  - CO005
  - CO006
  - CO010
