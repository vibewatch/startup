- id: TO003
  title: Stakeholder or investor map
  columns:
  - Stakeholder
  - Role
  - Control or economic importance
  - Diligence ask
  rows:
  - - Foresight Ventures
    - Lead / strategic investor
    - Tied publicly to the March 2025 unicorn financing report and to a February 2025 strategic-investment announcement that also references governance influence.
    - Confirm board seat, consent rights, pro-rata rights, token exposure, and whether the $1 million announcement is additive or overlapping.
  - - University of Surrey
    - Research and credibility partner
    - Central to Xiong's background and to the AI/Web3 partnership narrative used in public positioning.
    - Confirm formal partnership agreements, IP ownership, and commercialization terms.
  - - Luffa
    - Flagship ecosystem application
    - Presented as the first app built on Endless and as a distribution channel for airdrops and user-scale claims.
    - Verify ownership, monetization, retention, and whether usage is protocol-native or app-specific.
  - - EDS token holders / validators
    - Economic stakeholders
    - Token is described as supporting transactions, staking, and developer services, with 10 billion initial issuance reported publicly.
    - Obtain issuance schedule, treasury allocation, validator concentration, and unlock policy.
  - - Open-source developers via endless-labs GitHub
    - Developer adoption signal
    - Public repos across SDKs, framework, bridge, and tooling imply a visible builder surface even without customer disclosure.
    - Verify contributor concentration, independent commit share, and maintenance depth across repositories.
  notes: Maps the highest-visibility stakeholder groups from public signals; it is not a full cap table, token-holder registry, or governance census.
  enumerationScope:
    coverage: partial
