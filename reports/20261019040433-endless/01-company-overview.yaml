    - Academic credibility, AI/Web3 research bridge, and external partnership narrative.
    - 'High: the public story repeatedly routes through Xiong and the Surrey relationship.'
  - - Amit Kumar Jaiswal
    - Chief Technology Officer
    - April 2025 keynote spokesperson; described in interview coverage as a machine-learning and DeFi builder.
    - Owns technical architecture, AI integration, and developer-platform messaging.
    - 'High: few other named technical leaders appear in the assigned pool.'
  - - Ned
    - Chief Economist
    - Odaily attributes to him an Oxford distributed-systems PhD and token-model design experience.
    - Covers token economics and protocol-market design.
    - 'Medium-High: role is visible, but legal identity and governance position are not independently confirmed.'
