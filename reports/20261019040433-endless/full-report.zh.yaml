              仍没有足够的主流用户，如果目标受众太小，开发者就不会迁移。这一点很重要，因为公开商业模式依赖一长串尚未在指定证据集中得到外部验证的生态行为：开发者必须采用组件市场与 SDK，用户必须产生足够交易以带来 gas
