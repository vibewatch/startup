      - number: '3.2'
        title: 功能与打包方式比较
        blocks:
          - type: paragraph
            body: >-
              Endless 的差异化主张在于整合：保留的官方来源强调多语言 SDK、模块化组件、身份与钱包工具、跨链服务以及开发者付 gas，让 Web2 团队可以把区块链复杂性藏到终端用户看不见的地方。相比之下，保留的
              Alchemy 来源描述的是按计算单元使用量变现的 web3 开发者云，LayerZero 来源描述的是被主要链上应用使用的消息层，而非完整的应用开发栈。Aptos 则把资金投入协议升级、交易系统、存储和 AI
              工作负载。因此，公开打包方式只能比较架构与收费逻辑，不能比较标价：保留来源没有提供 Endless 与主要替代方案之间可直接对照的公开价目表。
