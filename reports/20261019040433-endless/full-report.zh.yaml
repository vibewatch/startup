        title: 展示项
        blocks:
          - type: callout
            title: Endless 最强的公开差异化在于整合
            body: 保留的官方来源始终把 Endless 描述为从 Web2 通往 Web3 的打包式桥梁，把链、钱包、登录、gas 抽象、SDK、API 和模块化组件组合起来，而不是只销售一个基础原语。
            calloutType: strength
