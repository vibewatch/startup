      - CP016
  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 公开材料暗示，Endless 必须先把生态播种转化为按使用量计费的工具收入，代币关联收入流才可能变成可持续的毛利。
    data:
      nodes:
        - label: 生态播种
          detail: $1 million 赠款池和计划中的约 $1 million 空投基金，用于开发者和用户获客。
        - label: 开发者 onboarding
          detail: GTM 叙事强调 Web2 到 Web3 的 onboarding、多语言 SDK 和模块化组件。
        - label: 工具使用
          detail: SDK/API 以及云 / 存储使用，是最清晰的非代币变现入口。
        - label: 链上活动
          detail: 组件销售、DApp 分发、游戏 / NFT 活动和 Gas 费都取决于生态使用。
        - label: 代币与验证者经济
          detail: 只有代币参与度和验证者需求持续存在，质押和委托质押才会增加收入。
        - label: 毛利转化
          detail: 云交付成本、补贴和基础设施定价压力，决定活动能否转化为利润率。
      edges:
        - from: Ecosystem seeding
          to: Developer onboarding
          label: 赠款和激励吸引供给
        - from: Developer onboarding
          to: Tooling usage
          label: SDK 和基础设施必须转化为经常性使用
        - from: Tooling usage
          to: On-chain activity
          label: 成功应用带动交易和市场交易量
        - from: On-chain activity
          to: Token and validator economics
          label: 代币化活动扩大质押和费用捕获
        - from: Token and validator economics
          to: Gross profit conversion
          label: 只有补贴和基础设施成本正常化，利润率才能保住
    approximationNotes: 这是基于公开披露的概念桥接图，而不是量化瀑布图；Endless 没有公布建立数值利润率模型所需的转化率、抽成率或成本占比。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI015
  - id: FE001
    title: Endless 产品架构图
    type: stack
    summary: Endless 被呈现为分层技术栈，把基础链基础设施、开发者组件、onboarding 抽象和示范应用组合在一起。
    data:
      layers:
        - label: 应用层
          detail: 作为技术栈可支撑线上体验的证明而推广的面向用户应用。
          modules:
            - label: Luffa SocialFi 应用
              note: Named reference deployment in the assigned pool
            - label: 游戏 / NFT / 金融应用
              note: Documented as target scenarios rather than verified scaled deployments
        - label: 生态与分发层
          detail: 旨在吸引构建者，并把应用导入技术栈的商业和生态项目。
          modules:
            - label: 开发者赠款
            - label: 组件市场
            - label: DApp 分发入口
        - label: 体验与 onboarding 层
          detail: 旨在让 Web3 使用体验更接近 Web2 的抽象。
          modules:
            - label: Google 账户登录
            - label: 无密钥钱包交互
            - label: Gas 赞助
            - label: 多币种或钱包便利功能
        - label: 隐私与控制层
          detail: 用于支撑产品隐私和安全定位的控制措施。
          modules:
            - label: 零知识或无密钥设计
            - label: 数据主权定位
            - label: 加密通信模式
        - label: 开发者组件层
          detail: 面向进入 Web3 的团队设计的可复用构件，用来缩短构建时间。
          modules:
            - label: 预构建模块
            - label: 多语言 SDK
            - label: API 和插件
            - label: 跨链与组件工具
            - label: AI 智能体 / 模型访问
        - label: 基础设施层
          detail: Endless 称其为支撑上层实现的底层技术基础。
          modules:
            - label: 基于 Move 的公链
            - label: 中继网络
            - label: 分布式和无服务器服务
            - label: 去中心化存储
            - label: 隐私与安全控制
    approximationNotes: 该图综合了公开材料所描述的层和模块，并非经过独立验证的部署拓扑。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE008
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Endless 披露的客户旅程从开发者赋能开始，经由 Luffa 等应用运营方导入使用，并依靠用户活动维持生态增长。
    data:
      items:
        - label: 开发者发现
          actor: Web2 和 Web3 开发者
          stage: 获客
          touchpoints:
            - 多语言 SDK
            - 预构建模块
            - 教程和文档
          note: 官方文档把降低迁移成本定位为第一步采用动作。
        - label: 无钱包 onboarding
          actor: 终端用户
          stage: 激活
          touchpoints:
            - Google 账户登录
            - 无密钥钱包流程
            - 开发者支付 Gas
          note: Onboarding 旨在隐藏 Web3 复杂性并提高转化。
        - label: 应用构建
          actor: 开发者和项目团队
          stage: 构建
          touchpoints:
            - AI 组件
            - 跨链工具
            - 智能合约自动化
          note: 在公开材料中，构建者是最明确暗示的付费交易对手。
        - label: 点名使用证明
          actor: Luffa 用户
          stage: 早期规模
          touchpoints:
            - 社交应用
            - AI 语音转文字
            - 翻译模块
          note: 在指定客户池中，Luffa 是唯一一个拥有用户指标的点名应用。
        - label: 生态增长循环
          actor: 项目运营方
          stage: 扩张
          touchpoints:
            - 空投
            - 组件市场
            - 社区增长工具
          note: Endless 计划利用激励和运营方工具扩大使用。
        - label: 持久性测试
          actor: 投资者和企业买方
          stage: 留存
          touchpoints:
            - 重复使用
            - 合同续签
            - 集中度检查
          note: 由于公开留存指标缺失，这一阶段的证据最少。
    claimRefs:
      - CU001
      - CU005
      - CU006
      - CU008
      - CU009
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 剩余风险最高的领域仍是合规、采用和安全证明缺口。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓释成熟度
        - label: 剩余暴露
      rows:
        - label: 实体 / 代币合规
          note: 代币、质押和钱包覆盖面广；指定公开证据中看不到法律文件包。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 低
              tone: low
            - label: 高
              tone: high
        - label: 安全 / 宕机保障
          note: 产品说法强，但独立验证有限，行业证据显示基础设施脆弱。
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 低
              tone: low
            - label: 高
              tone: high
        - label: 采用缺口
          note: 管理层自己也把 Web3 用户规模不足描述为核心障碍。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 高
              tone: high
        - label: 财务不透明
          note: 融资已知；收入、烧钱、资金库和解锁情况未知。
          values:
            - label: 高
              tone: high
            - label: 高
              tone: critical
            - label: 低
              tone: low
            - label: 高
              tone: high
        - label: AI 合作伙伴依赖
          note: 差异化部分依赖第三方模型和研究合作。
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 中
              tone: medium
        - label: 验证者 / 代币参与
          note: 安全和变现都依赖健康的代币及验证者活动。
          values:
            - label: 高
              tone: high
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 高
              tone: high
    claimRefs:
      - CR002
      - CR005
      - CR008
      - CR011
      - CR012
      - CR013
      - CR014
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 该建议受限于真实融资信号与仍然有限的独立运营证据之间的缺口。
    data:
      nodes:
        - id: market
          label: 市场背景
          detail: 截至 2025 年，亚太加密活动仍在强劲增长。
          tone: positive
        - id: wedge
          label: 产品切入口
          detail: Endless 将 Web2 到 Web3 的工具模块化，并加入 AI，让用户更容易上手。
          tone: positive
        - id: proof
          label: 早期证据
          detail: 主网已上线，Luffa 也有增长表现方面的说法，但目前主要仍是公司自述。
          tone: neutral
        - id: gap
          label: 披露缺口
          detail: 公开的开发者、客户、收入和留存证据仍然稀少。
          tone: risk
        - id: risk
          label: 风险叠加
          detail: 香港监管框架较为明确，但基础设施和执行风险仍不可忽视。
          tone: risk
        - id: decision
          label: 决策
          detail: 需进一步研究；风险高，按报告价格看估值偏高。
          tone: risk
      edges:
        - from: market
          to: wedge
          label: 引发品类兴趣
        - from: wedge
          to: proof
          label: 需要转化为运营成果
        - from: proof
          to: gap
          label: 仍未得到充分验证
        - from: gap
          to: risk
          label: 提高投资判断门槛
        - from: risk
          to: decision
          label: 保持严格的入场纪律
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
