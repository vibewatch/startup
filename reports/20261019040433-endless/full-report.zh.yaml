      - number: '5.2'
        title: 架构与工作流设计
        blocks:
          - type: paragraph
            body: >-
              指定材料池中最具体的架构描述是三层模型：基础设施/公链、组件化开发者层和面向用户的应用层。官方页面进一步把
              SDK、API、中继网络、无服务器与分布式服务、模块化组件及去中心化存储都纳入同一运营模型。预期工作流很清楚：给开发者预制模块和多语言 SDK，再用钱包抽象、Google 登录和 gas 赞助减少用户摩擦。对于
              Web2 到 Web3 的转化，这是一套连贯的产品论点，因为它同时解决开发复杂性与消费者上手成本。尚不清楚的是抽象层背后的运营实现。材料池没有公开 API
              参考、版本化更新日志、验证者/网络拓扑或基准测试包，投资者无法据此判断这套栈有多少已经达到生产级、又有多少仍停留在愿景中。
