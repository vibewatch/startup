figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 公开里程碑集中在 2025 年初，显示叙事快速搭建，但披露成熟度尚未完善。
    data:
      items:
        - date: '2024-05-29'
          label: SEC 警示持续存在的加密资产骗局风险
          detail: 这是行业背景，而非公司事件：SEC 投资者警示进一步说明，Endless 面向零售用户的代币和激励说法需要谨慎尽调。
          tone: adverse
        - date: '2025-02-26'
          label: 战略投资公告发布
          detail: Coin Cript 报道，Foresight Ventures 进行了一笔 $1 million 的战略投资，用于加速 AI 智能体发展并支持 Luffa 生态增长。
          tone: positive
        - date: '2025-02-26'
          label: 投资者治理角色公开
          detail: 同一份二月公告称，Foresight 将积极参与治理、未来开发和生态扩张。
          tone: medium
        - date: '2025-03-06'
          label: 领导层与 Surrey 关系被重点介绍
          detail: Odaily 的采访重点介绍了 Yu Xiong、Amit Kumar Jaiswal、Ned 和 University of Surrey，将其视为 Endless 公开信誉故事的骨架。
          tone: neutral
        - date: '2025-03-06'
          label: Luffa 与空投计划亮相
          detail: Odaily 称 Luffa 构建于 Endless 之上，并表示将用一项 $1 million 的空投计划刺激生态活动。
          tone: positive
        - date: Mar 2025
          label: Crunchbase 记录独角兽融资信号
          detail: Crunchbase 将 Endless 列入 2025 年 3 月独角兽榜单，记录了一轮据报道为 $110 million、估值 $1 billion 的成长阶段融资。
          tone: positive
        - date: '2025-04-07'
          label: CTO 在香港 Web3 Festival 发表主题演讲
          detail: Amit Kumar Jaiswal 公开介绍了该协议的三层架构、开发者工具、AI 集成以及类似 Web2 的 onboarding。
          tone: positive
        - date: '2025-04-07'
          label: 开发者赠款与代币经济公开
          detail: Analytics Insight 称，Endless 宣布了第一阶段、价值相当于 $1 million EDS 的开发者赠款，并介绍了 10 billion 的初始代币发行量。
          tone: medium
    approximationNotes: null
    claimRefs:
      - CO004
      - CO005
      - CO007
      - CO011
      - CO013
      - CO014
      - CO015
  - id: FM001
    title: Endless 式需求的受限采用堆栈
    type: pyramid
    summary: 机会从广泛的加密活动收窄到更小的一批团队：他们愿意为更简单的 onboarding、模块化工具和更具韧性的 Web3 基础设施付费。
    data:
      items:
        - label: 广泛的加密活动基础
          value: 151 countries
          note: Chainalysis 覆盖 151 个国家和超过 13 billion 次网页访问。
        - label: 草根采用率最高的市场
          value: APAC leads; North America accelerating
          note: Chainalysis 突出印度、巴基斯坦和越南；随着监管动能上升，北美也在增强。
        - label: 商业代币化切入口
          value: Fixed income, repos, money-market funds, equities
          note: IOSCO 认为，这些领域展现出最清晰的早期商业增长势头。
        - label: 核心买方群体
          value: Four groups
          note: Endless 点名 Web2 开发者、Web3 开发者、项目团队和普通用户。
        - label: 近期应用类别
          value: Six categories
          note: Endless 突出社交、短视频、音乐、商业、AI 和金融用例。
        - label: 当前生态证明点
          value: Luffa >100k users
          note: Odaily 报道了一个早期应用层工作负载案例，而不是全市场采用。
    approximationNotes: 这是受限的机会堆栈，而非按比例绘制的 TAM 图；由于指定的公开证据不足以支持自下而上的收入规模市场估算，各层混合了采用、工作流和买方筛选条件。
    claimRefs:
      - CM002
      - CM007
      - CM010
      - CM011
      - CM015
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 序数评分（1-5）显示，Endless 在栈宽度和公开规模信号上介于点解决方案与规模化在位厂商之间。
    xAxis:
      label: 栈宽度 / 工作覆盖范围
      min: 1
      max: 5
      lowLabel: Narrow point solution
      highLabel: Full platform or base-chain scope
      description: Ordinal score derived from retained evidence on how much of the buyer workflow each option covers.
    yAxis:
      label: 公开规模 / 分发信号
      min: 1
      max: 5
      lowLabel: Early or weakly evidenced
      highLabel: Large funding, named adoption, or ecosystem reach
      description: Ordinal score derived from retained funding, adoption, and ecosystem signals; not market-share data.
    data:
      points:
        - label: Endless
          x: 4
          'y': 2
          note: 捆绑式平台故事覆盖面广，但公开的独立规模证明仍处于早期。
          claimRefs:
            - CP001
            - CP002
            - CP004
            - CP011
        - label: Alchemy
          x: 4
          'y': 5
          note: 面向开发者的广泛云平台，拥有大客户和已披露的大额融资。
          claimRefs:
            - CP005
            - CP014
        - label: LayerZero
          x: 2
          'y': 4
          note: 传播范围更窄，但网络和融资信号强。
          claimRefs:
            - CP006
            - CP014
        - label: Aptos
          x: 5
          'y': 4
          note: 基础链平台，近期有资本投入 AI 和交易基础设施。
          claimRefs:
            - CP007
            - CP013
        - label: 中心化 RPC 供应商
          x: 2
          'y': 4
          note: 点解决方案类别，买方行为根深蒂固，且具备在位厂商规模。
          claimRefs:
            - CP008
            - CP016
        - label: 内部构建
          x: 3
          'y': 1
          note: 灵活的替代方案，共享分发能力弱，但控制力强。
          claimRefs:
            - CP009
            - CP016
    approximationNotes: 评分是根据保留的公开来源，对范围、资本和点名采用情况作出的、由证据支持的序数判断。它们不是市场份额估算，也不是经过独立基准测试的性能排名。
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
      - CP009
      - CP011
