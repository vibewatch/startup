              市场交易费中收费。这种广度很重要，因为它意味着业务既能从链下开发工具变现，也能从链上活动变现。问题在于披露深度：公开文件说明了机制，却没有说明实际价格、合同期限、附加率或贡献利润率，因此投资者能看到从活动到收入的设计桥梁，却看不到各收入流当前的经济性。[CI001]
