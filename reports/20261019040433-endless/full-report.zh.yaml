      - number: '3.3'
        title: 持久性、切换成本与不利信号
        blocks:
          - type: paragraph
            body: >-
              反向证据表明护城河的持久性仍未得到证明。一名供职于 dRPC 的 Forbes 撰稿人称，RPC 基础设施日益商品化，并由少数供应商主导；由于资本与 DevOps
              负担，开发者往往更愿意外包节点访问，而不是自行运营。Endless 竞争的不只是功能，也是在与已经接受中心化中间商或专业化点解决方案的购买行为竞争。公开融资信号也显示出资本差距：Endless 披露了
              Foresight Ventures 100 万美元战略投资；LayerZero 披露了 1.2 亿美元融资和 30 亿美元估值；Alchemy 披露累计融资 5.455 亿美元、估值 102
              亿美元。Endless 仍可能赢得特定的 Web2 到 Web3 上手场景，但公开证据尚未显示其具备在位者级别的分发能力或经基准验证的性能领先。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP008
              - CP009
              - CP011
              - CP012
              - CP014
      - number: '3.4'
        title: 竞争结论
        blocks:
          - type: paragraph
            body: >-
              实际结论是：Endless 在产品定位上有差异化，但在市场证明上还不够持久。它把开发者与上手体验打包在一起，范围比单一 RPC 供应商或跨链模块更广，能为希望从 Web2 一步切入 Web3
              的团队降低协调成本。同样的广度也扩大了比较集合：买方可以从链平台、消息层、托管基础设施和内部自建路径中拼出替代方案。由于保留的公开文件缺少独立客户标志、实际成交价格和第三方性能基准，最稳妥的判断是：Endless
              是一家处于早期、整合能力较强的挑战者，面对资金更充足的替代方案，而不是定义品类的在位者。
            claimRefs:
              - CP001
              - CP004
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
