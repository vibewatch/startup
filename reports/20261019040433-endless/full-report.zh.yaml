  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与真正买单者
        blocks:
          - type: paragraph
            body: >-
              公司发布的材料始终把 Endless 定位为连接熟悉的 Web2 开发实践与更复杂 Web3 基础设施的桥接层，而不是单一消费应用或纯 DeFi 场所。因此，实际市场边界是开发者和项目团队为组件化 Web3
              工具、中间件及配套基础设施支付的费用：这些工具可以缩短上线时间、简化上手过程，并把区块链复杂性藏到终端用户看不见的地方。这个边界不包括加密资产交易的全部价值，不包括与链上工作流无关的通用公有云支出，也不包括没有实际迁移到链上的存量消费应用。买方本身也是多边的：开发者需要
              SDK 和组件，项目团队需要增长与代币工具，而终端用户的重要性主要在于其体验决定开发者预算能否换来采用。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
      - number: '2.2'
        title: 受限的测算视角指向需求，而非干净的 TAM
        blocks:
          - type: paragraph
            body: >-
              指定的独立证据通过代理视角支持市场需求，而不是给出一套干净的 TAM/SAM/SOM。Chainalysis 显示多个国家存在广泛的草根加密使用，APAC 足迹也很强；这很重要，因为 Endless
              把自己定位成面向高规模消费应用和 AI 驱动应用的平台，而不是服务少数机构工作流。IOSCO
              提供了更保守的视角：代币化确实吸引了商业兴趣，但采用仍处于早期且不均衡，只有少数资本市场工作流明显领先。Crunchbase 则提供了资本市场信号，说明投资者仍在为 Web2 到 Web3
              的基础设施叙事提供资金。合在一起，这些来源支持一个具有估值相关性的活跃市场，但没有给出 Endless 所属细分市场自下而上的公开支出估算。
