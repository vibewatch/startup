  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              Endless 对外把自己定位为广泛的 Web3 应用平台，而不只是链或钱包。其材料描述了基于 Move 的公链、分布式存储、中继网络、SDK、API、登录与钱包组件，以及帮助 Web2
              开发者无需从零重建核心基础设施就能交付 Web3 应用的 gas 抽象。因此，真正的比较集合比“其他 Move 链”更广：买方可以选择 Alchemy 这样的托管开发者云、LayerZero
              这样的窄型互操作层、资金更充足的底层链 Aptos，也可以继续自行运行节点或使用中心化 RPC 供应商。替代集合的定义取决于谁能最快消除开发摩擦，而不是谁使用了与 Endless 完全相同的产品语言。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP007
              - CP009
              - CP010
              - CP016
