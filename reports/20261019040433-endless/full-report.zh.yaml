        title: 展示项
        blocks:
          - type: callout
            title: 收入设计偏向生态收费
            body: Endless 的公开模型不像单一产品 SaaS 计划，更像分层的基础设施与市场栈，在生态不同环节对开发者活动、基础设施消耗、代币参与和应用分发收费。
