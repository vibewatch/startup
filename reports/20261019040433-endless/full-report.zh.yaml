  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Endless 试图交付什么
        blocks:
          - type: paragraph
            body: >-
              公开材料始终把 Endless 定位为基础设施，而不是单一应用：它是一个 Web3 Genesis Cloud，旨在通过模块化工具、去中心化存储、钱包抽象和 AI 组件，帮助 Web2
              团队进入链上产品，而不只是提供底层链原语。公司自身文件把目标群体从加密原生团队扩展到 Web2 开发者、Web3
              开发者、项目团队和终端用户，这很重要，因为产品承诺是在同一套栈中同时简化应用构建与终端用户上手，而不只是靠开发者 API 变现。第三方描述方向一致：U.Today 和 Bitget 都把 Endless
              描述为一个用组件化平台帮助 Web2 团队交付 Web3
              产品的桥梁，而不是裸协议。这种一致性有助于尽调，但也说明公开故事仍由定位语言主导，因此投资判断应聚焦于这些模块是否真的被生产环境采用，而不只是官方页面讲得清楚。
            claimRefs:
