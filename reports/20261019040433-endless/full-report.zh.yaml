      - number: '4.2'
        title: 公开牵引力代理指标指向生态播种，而非已证明的销售效率
        blocks:
          - type: paragraph
            body: >-
              公开信号表明 Endless 仍依靠开发者与生态播种，而不是披露可重复的企业销售引擎。公司及被公司引用的报道强调 Web2 到 Web3 的上手、多语言 SDK、gas 补贴，以及开发者资助计划和围绕 Luffa
              应用规划的空投等社区增长工具。指定材料池中最清晰的用户指标，是管理层声称 Luffa 在 2025 年 3 月已累计超过 100,000 名用户、每日活跃用户超过 10,000
              名。这是有用的采用代理指标，但不等于付费客户数、ARR、留存或 CAC 效率。即便 Endless 在 DEV Community 的存在，也只能证明面向开发者的 GTM，不能证明已变现需求。[CI005]
              [CI007] [CI008] [CI009] [CI010]
            claimRefs:
              - CI005
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: 利润率路径可能取决于基础设施效率与激励维持高位的时间
        blocks:
          - type: paragraph
            body: >-
              公开模型暗示，在公司报告收入基础之前，就已经存在可观的服务交付和生态播种成本。Endless 的材料把变现与云和存储交付、验证者参与、代币资助的激励以及 gas
              费用流联系起来，第三方报道则强调资助预算、空投计划和替用户支付 gas 的上手代理。这一点很重要，因为 Web3 基础设施品类可能迅速商品化：Forbes 对 RPC
              基础设施的分析认为，该业务可能变成由规模驱动的价格竞争，同时暴露于宕机与中心化云依赖；Aptos 的 2026 年资本计划也说明，可比的 Move
              生态仍需向基础设施、研究和外部生态支持投入大量资金。Chainalysis 补充了需求顺风——加密采用和机构参与仍在增长——但市场增长本身不能证明 Endless 能守住价格或毛利率。[CI003]
              [CI005] [CI011] [CI012] [CI013] [CI015]
            claimRefs:
              - CI003
              - CI005
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: 融资信号真实存在；投资判断所需数据仍缺失
        blocks:
          - type: paragraph
            body: >-
              指定证据足以确认 Endless 在 2025 年达到独角兽地位，外部报道也反复提到约 1.1
              亿美元融资。这给企业带来了真实的资本市场可信度，公司显然正在投入产品、生态和用户获取。但投资者判断融资依赖性所需的运营资产负债表视角仍然缺失：指定材料池没有来源披露现金余额、月度烧钱、现金跑道、债务义务、代币资金库构成、客户集中度、实际价格或各收入流毛利率。因此实际结论是混合的。Endless
              可能有足够资本继续建设平台，但公开文件仍无法让投资判断区分健康的计划性投入与高度依赖补贴、在收入模式得到证明前还需要再融资的增长。[CI006] [CI014] [CI015]
            claimRefs:
