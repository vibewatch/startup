      - number: '7.4'
        title: 击穿标准与尽调路径
        blocks:
          - type: paragraph
            body: >-
              最快的论点击穿测试很具体。第一，如果 Endless
              无法提供实体树、董事会名单、代币权利备忘录和按司法辖区拆分的合规地图，就应把合规风险视为未解决，而不能假设其可控。第二，如果管理层无法提供独立安全审查、事故历史，以及说明关键依赖仍集中在哪里的架构证据，那么产品的隐私与韧性故事还没有得到投资判断支持。第三，如果客户和开发者采用无法超越创始人采访与生态营销得到证明，商业爬坡可能不足以支撑估值。最后，如果资金库、烧钱、跑道和代币解锁暴露继续不披露，投资者实际上是在看不见下行机制的情况下为期权价值做投资判断。
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 合规是第一道门槛风险
            body: Endless 的代币、质押、钱包和隐私边界足够广，投资者应把合规视为门槛工作流，直到管理层提供实体、牌照与代币权利文件。
            calloutType: risk
            claimRefs:
              - CR002
              - CR009
              - CR014
          - type: callout
            title: 商业证明仍落后于估值
            body: 融资信号真实存在，但公开证据仍未独立核实收入、烧钱、跑道，或足以支撑 10 亿美元入场价格的持续开发者采用。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR008
          - type: callout
            title: 尽调应聚焦可证伪文件
            body: 最有价值的下一步不是再看一次产品演示，而是取得一套涵盖法律结构、代币经济、安全保障、资金库和队列质量使用指标的文件包。
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR009
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值信号存在，但证明仍落后于价格
        blocks:
          - type: paragraph
            body: >-
              最强的外部估值数据点仍是已披露的 2025 年 3 月融资：Crunchbase News 将 Endless 的估值定为 10 亿美元，融资额为 1.1 亿美元，领投方是 Foresight
              Ventures。这很重要，因为它说明真实投资者愿意按独角兽给公司定价。但公开文件仍没有提供足以让新投资者把这轮融资当作投资判断支持的运营证明。公司控制的来源更多讲架构、开发体验和 AI
              定位，较少提供已核实付费客户、收入、留存或资金库质量信息；而检索到的 Developer Report 落地页也没有提供 Endless
              专属的开发者测量。这种组合支持一种对价格敏感的继续研究立场：这轮融资验证了兴趣，却没有验证同一价格下的内在价值。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
      - number: '8.2'
        title: 论点质量清晰，但仍主要由公司描述
        blocks:
          - type: paragraph
            body: >-
              可投资论点很容易描述。Endless 始终把自己呈现为 Web2 到 Web3 的桥梁，拥有模块化组件、主流语言 SDK、gas 抽象和更容易的钱包上手；这一定位也在自身文件和二手报道中保持一致。在
              Chainalysis 仍看到 APAC 加密活动强劲增长的市场里，如果开发者平台切入口能转化为粘性工作负载与客户支出，它可能具有价值。反论点是，公开证明仍带有公司塑形痕迹：AI 差异化、University
              of Surrey 关系和 Luffa 生态牵引力都很有意思，但还没有与足够的独立客户证据、收入披露或基准化开发者采用相配，因而不足以支持按已披露估值买入。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV013
              - CV015
      - number: '8.3'
        title: 情景分析要求克制，而非催促
        blocks:
          - type: paragraph
            body: >-
              当前情景集的重点不是精确建模上行空间，而是判断现有价格能否站得住。在乐观情景中，Endless
              需要独立证据证明其降低摩擦的故事能转化为真实采用：开发者活动、客户标志或与使用量直接相关的收入。在基准情景中，产品故事仍可信，但信息集太薄，无法弥合强叙事与硬估值论点之间的差距，因此公司可以继续观察，但在已披露价格上尚不可投资。在悲观情景中，KPI
              披露薄弱、融资条款不利，或 Web3
              核心基础设施执行失败，会让标题估值在考虑代币或资金库抛压之前就显得过高。保留的公开来源没有提供足够运营或工具数据来支持数值化公允价值区间、目标回报、持有期或退出估值。Aptos 另行承诺的 5,000
              万美元基础设施投入只能作为资本强度里程碑参考，不能作为 Endless 的独立估值基准。
            claimRefs:
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.4'
        title: 只有在尽调填补具体缺口后，判断才会改善
        blocks:
          - type: paragraph
            body: >-
              正确的下一步是聚焦尽调，而不是立即否决。只有新的尽调包证明平台拥有商业相关的采用，并证明最新一轮融资对普通股持有人具有吸引力，Endless
              才能从继续研究走向跟踪或买入。核心要求很直接：独立的开发者与客户数据、收入与留存证据、法律实体与牌照清晰度，以及干净的股权表条款和代币抛压视图。论点击穿触发条件同样明确：如果团队无法用第三方证据证实采用，如果稀释或优先权吞掉过多上行空间，或监管与核心基础设施执行风险仍未解决，那么当前
              10 亿美元标题应被视为募资数据点，而不是可投资的入场价格。在这些材料可取得之前，目标回报、持有期和退出案例应明确保持未建模，而不是从融资标题推断出来。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV014
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开证据结论
            body: Endless 的市场与产品信号足以留在尽调名单上，但独立牵引力和经济性披露还不足以支持投资者今天按已披露的 10 亿美元估值买入。
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV010
              - CV014
              - CV016
