      - number: '2.3'
        title: 采用驱动因素真实存在，但瓶颈仍是结构性的
        blocks:
          - type: paragraph
            body: >-
              材料池中最强的需求驱动因素并不难理解：Web3 仍有较高的开发者学习成本、割裂的协议、别扭的用户体验和复杂的基础设施，因此能减少这些摩擦的平台可以从希望更快交付的团队手中拿到预算。Endless
              自身的收入模型也显示了多处可变现的触点，从组件销售到 API 使用和类云服务费。限制因素同样重要。IOSCO 指出代币化仍面临互操作性与结算资产瓶颈，而 Forbes 的一篇市场专栏认为中心化 RPC
              基础设施会带来可靠性与审查风险。因此，市场需求可能先在开发体验更好、钱包抽象和基础设施韧性能解决即时痛点的工作流中扩张；在没有私有使用量与变现数据前，不能据此假设整个品类会快速转化为支出。
