schemaVersion: report-v2
artifact: competitors
slug: endless
runDate: 2026-10-19
company:
  name: Endless
chapter:
  number: 3
  title: Competitors
  summary: >-
    Endless is competing less with one named startup than with a layered stack of
    alternatives: developer-cloud incumbents such as Alchemy, adjacent protocol
    layers such as LayerZero, base-chain platforms such as Aptos, and the status
    quo of self-operated or outsourced RPC infrastructure. Its public
    differentiation is the promise of a bundled Web2-to-Web3 experience—multi-language
    SDKs, account abstraction, gas sponsorship, and componentized tooling—but
    the retained evidence still shows a smaller capital base, earlier ecosystem
    proof, and limited public pricing transparency than the best-capitalized
    adjacent platforms.
sections:
  - id: landscape-and-alternatives
    title: Landscape and alternatives
    body: >-
      Endless is publicly framing itself as a broad Web3 application platform,
      not just a chain or wallet. Its own materials describe a Move-based public
      chain, distributed storage, relay networks, SDKs, APIs, login and wallet
      components, and gas abstraction aimed at helping Web2 developers ship Web3
      applications without rebuilding core infrastructure from scratch. That
      scope means the real comparison set is broader than "other Move chains":
      buyers can choose a managed developer cloud such as Alchemy, a narrow
      interoperability layer such as LayerZero, a better-funded base chain such
      as Aptos, or the status quo of running nodes internally or through
      centralized RPC vendors. The substitute set is therefore defined by who can
      remove developer friction fastest, not by who shares Endless's exact
      product language.
    claimRefs: [CP001, CP002, CP005, CP006, CP007, CP009, CP010, CP016]
    tableRefs: [TP001]
  - id: feature-and-packaging-comparison
    title: Feature and packaging comparison
    body: >-
      Endless's differentiation claim is integration: the retained official
      sources emphasize multi-language SDKs, modular components, identity and
      wallet tooling, cross-chain services, and developer-paid gas so Web2 teams
      can hide blockchain complexity from end users. By contrast, the retained
      Alchemy source describes a web3 developer cloud monetized by compute-unit
      usage, while the retained LayerZero source describes a messaging layer used
      by major on-chain applications rather than a full application-development
      stack. Aptos, meanwhile, is funding protocol upgrades, trading systems,
      storage, and AI workloads at the chain layer. Public packaging is therefore
      comparable only at the level of architecture and charging logic, not list
      pricing: the retained sources do not give an apples-to-apples public price
      card for Endless versus its main alternatives.
    claimRefs: [CP002, CP003, CP004, CP005, CP006, CP007, CP013, CP015]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]
  - id: durability-switching-costs-and-adverse-signals
    title: Durability, switching costs, and adverse signals
    body: >-
      The adverse evidence suggests moat durability is still unproven. A Forbes
      contributor employed by dRPC describes RPC infrastructure as increasingly
      commoditized and dominated by a small set of providers, with developers
      often preferring outsourced node access over self-operation because of the
      capital and DevOps burden. That matters because it means Endless is not
      just competing on features; it is competing against buying behavior that
      already accepts centralized intermediaries or specialized point solutions.
      The capital gap is also visible in public financing signals: Endless
      disclosed a $1 million strategic investment from Foresight Ventures, while
      LayerZero disclosed a $120 million round at a $3 billion valuation and
      Alchemy disclosed $545.5 million raised and a $10.2 billion valuation.
      Endless may still win specific Web2-to-Web3 onboarding use cases, but the
      public evidence does not yet show incumbent-level distribution power or
      benchmarked performance leadership.
    claimRefs: [CP004, CP005, CP006, CP008, CP009, CP011, CP012, CP014]
    tableRefs: []
  - id: competitive-verdict
    title: Competitive verdict
    body: >-
      The practical verdict is that Endless looks differentiated in product
      framing but not yet durable in market proof. Its bundled developer and
      onboarding story is broader than a single RPC provider or cross-chain
      module, and that breadth can reduce coordination cost for teams that want a
      one-vendor jump from Web2 to Web3. The same breadth also widens the
      comparison set: buyers can assemble substitutes from chain platforms,
      messaging layers, managed infra, and internal build paths. Because the
      retained public file is thin on independent customer logos, realized
      pricing, and third-party performance benchmarks, the safest read is that
      Endless is an early integrated challenger facing stronger-funded
      alternatives rather than a category-defining incumbent.
    claimRefs: [CP001, CP004, CP011, CP012, CP013, CP014, CP015, CP016]
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / funding
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - ["Endless", "Integrated Web3 developer platform / base chain", "$1M strategic investment from Foresight Ventures disclosed in 2025", "Web2 and Web3 developers, project teams, general users", "Bundled SDKs, components, wallet/login, gas sponsorship, and AI-oriented tooling", "Public customer scale, benchmarked performance, and enterprise pricing remain thin"]
      - ["Alchemy", "Managed developer cloud / infrastructure platform", "$545.5M total raised; $10.2B valuation disclosed in 2022", "Teams building on blockchain and mainstream companies adding web3", "Developer cloud framed as 'AWS for blockchain' with compute-unit monetization", "Retained source does not disclose exact list pricing or customer retention economics"]
      - ["LayerZero", "Cross-chain messaging / interoperability layer", "$120M Series B; $3B valuation disclosed in 2023", "On-chain apps needing cross-chain messaging", "Connects 30+ mainnet blockchains and is embedded in major DeFi apps", "Narrower product scope than an end-to-end application platform"]
      - ["Aptos", "Base-chain platform / likely entrant", "$50M protocol and ecosystem commitment disclosed in 2026", "Institutional trading teams and AI-oriented builders", "Funding protocol upgrades, in-house products, storage, and AI workloads", "Retained source is about ecosystem investment, not a full buyer-facing packaging comparison"]
      - ["Internal build / outsourced RPC status quo", "Substitute operating model", "Developer bears cloud, infra, and DevOps cost; third-party RPC remains common", "Teams willing to assemble tooling themselves", "Maximum stack control and vendor flexibility", "Higher operational burden and weaker integrated onboarding"]
    notes: >-
      Sources mix company-issued materials and independent reporting; public
      evidence supports category, funding, target segment, and stated scope, but
      not a complete market census.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible alternatives retained in the assigned source pool for
        the 2026-10-19 run; representative rather than exhaustive.
    claimRefs: [CP001, CP003, CP005, CP006, CP007, CP009, CP010, CP012]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Endless
      - Alchemy
      - LayerZero
      - Aptos
      - Internal build / RPC status quo
    rows:
      - ["Web2-oriented onboarding abstraction", "Yes: Google login and gas sponsorship are disclosed", "Unknown in retained source", "No evidence in retained source", "No evidence in retained source", "No: teams assemble this themselves"]
      - ["Multi-language SDK / prebuilt modules", "Yes: SDKs and modular components are core positioning", "Developer tools disclosed, exact module set not detailed here", "Unknown in retained source", "Unknown in retained source", "Only if the team builds or procures them separately"]
      - ["Managed infra plus chain-level services", "Yes: public chain, storage, relay, wallet, bridge, and components", "Yes: developer cloud / compute platform", "No: focused on messaging between chains", "Partial: chain platform plus protocol investment, not packaged app stack", "Variable: depends on the stack the team assembles"]
      - ["Cross-chain or interoperability layer", "Yes: cross-chain bridge is disclosed", "Unknown in retained source", "Yes: core product", "Unknown in retained source", "Possible, but only through additional vendors or custom work"]
      - ["Public independent ecosystem proof", "Limited: first social app and apps in testing are cited in company-issued material", "Yes: named large customers and broad industry role are cited", "Yes: named DEX users, TVL, and transaction volume are cited", "Partial: funding commitment and ecosystem activity are cited", "No unified proof because the substitute is an operating model, not one vendor"]
    notes: >-
      Unsupported cells are marked Unknown rather than inferred; the matrix
      compares public retained evidence, not full product documentation.
    claimRefs: [CP002, CP004, CP005, CP006, CP007, CP011, CP013, CP016]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Solution
      - Public price / unit / contract model
      - Included capabilities
      - Discount or unknowns
      - Implication
    rows:
      - ["Endless", "SDK/API pay-per-call billing, plus subscription for enterprise customers; other monetization via marketplace, storage, gas, staking, and distribution fees", "SDKs, APIs, components, chain, storage, wallet/login, and ecosystem services", "No retained public list price, discount schedule, or realized customer spend", "Packaging breadth is public, but realized monetization and willingness-to-pay are still opaque"]
      - ["Alchemy", "Charges for compute units", "Managed developer infrastructure and tools", "No retained public rate card or enterprise contract terms", "Clearer usage-based logic than Endless, but not enough public data here for direct unit-cost comparison"]
      - ["LayerZero", "No pricing model disclosed in the retained source", "Cross-chain messaging layer", "Public retained source gives scale and funding but not buyer pricing", "Looks more like a component purchase than a full-platform replacement"]
      - ["Aptos", "Protocol / ecosystem funding commitment, not a public service price card", "Base chain plus funded protocol and product investments", "Retained source is strategic-direction evidence, not packaging detail", "Competes as a destination platform rather than a clean line-item price comparison"]
      - ["Internal build / outsourced RPC status quo", "Internal build requires infra and DevOps spend; outsourced RPC typically replaces owning nodes", "Whatever tooling the team assembles itself", "Retained source does not quantify cost ranges", "The substitute remains credible because buyers can mix vendors instead of adopting a bundled platform"]
    notes: >-
      This comparison is packaging-level because the retained pool does not
      disclose apples-to-apples public list pricing, discounting, or realized
      contract economics for most alternatives.
    claimRefs: [CP003, CP005, CP006, CP007, CP009, CP015, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal scores (1-5) place Endless between point solutions and scaled
      incumbents on stack breadth and public scale signals.
    xAxis:
      label: Stack breadth / job coverage
      min: 1
      max: 5
      lowLabel: Narrow point solution
      highLabel: Full platform or base-chain scope
      description: Ordinal score derived from retained evidence on how much of the buyer workflow each option covers.
    yAxis:
      label: Public scale / distribution signal
      min: 1
      max: 5
      lowLabel: Early or weakly evidenced
      highLabel: Large funding, named adoption, or ecosystem reach
      description: Ordinal score derived from retained funding, adoption, and ecosystem signals; not market-share data.
    data:
      points:
        - label: Endless
          x: 4
          y: 2
          note: Bundled platform story is broad, but public independent scale proof remains early.
          claimRefs: [CP001, CP002, CP004, CP011]
        - label: Alchemy
          x: 4
          y: 5
          note: Broad developer cloud with major customers and large disclosed funding.
          claimRefs: [CP005, CP014]
        - label: LayerZero
          x: 2
          y: 4
          note: Narrower messaging scope, but strong network and funding signals.
          claimRefs: [CP006, CP014]
        - label: Aptos
          x: 5
          y: 4
          note: Base-chain platform with fresh capital committed to AI and trading infrastructure.
          claimRefs: [CP007, CP013]
        - label: Centralized RPC providers
          x: 2
          y: 4
          note: Point-solution category with entrenched buyer behavior and incumbent scale.
          claimRefs: [CP008, CP016]
        - label: Internal build
          x: 3
          y: 1
          note: Flexible substitute with weak shared distribution but meaningful control.
          claimRefs: [CP009, CP016]
    approximationNotes: >-
      Scores are evidence-backed ordinal judgments from retained public sources on
      scope, capital, and named adoption. They are not market-share estimates or
      independently benchmarked performance rankings.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP011, CP014, CP016]
callouts:
  - calloutType: strength
    title: Endless's strongest public differentiation is integration
    body: >-
      The retained official sources consistently frame Endless as a packaged
      bridge from Web2 to Web3, combining chain, wallet, login, gas abstraction,
      SDKs, APIs, and modular components rather than selling a single primitive.
    claimRefs: [CP001, CP002, CP004]
  - calloutType: risk
    title: Better-capitalized alternatives can outspend Endless on distribution
    body: >-
      The public capital signals in the retained file are asymmetric: Endless
      disclosed a $1 million strategic investment, while LayerZero and Alchemy
      disclosed much larger funding rounds and broader visible distribution.
    claimRefs: [CP005, CP006, CP012, CP014]
  - calloutType: insight
    title: The default substitute is still a stitched-together stack
    body: >-
      Buyers can still outsource node access to incumbent RPC providers or run
      their own infrastructure, so Endless must beat the market's existing
      multi-vendor operating model, not just named startup peers.
    claimRefs: [CP008, CP009, CP016]
