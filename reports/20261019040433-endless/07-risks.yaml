      - Jurisdiction / surface
      - Evidence
      - Likelihood
      - Severity
      - Mitigation evidence
      - Residual exposure
      - Diligence path
    rows:
      - ["Token, staking, and gas-fee economics could trigger securities, payments, AML, or consumer-protection review.", "Hong Kong, UK, and any market where EDS, staking, wallets, or gas abstraction are offered.", "Endless's public model includes staking rewards, validator fees, gas fees, and token burning, but the pool has no legal memo or license pack.", "High", "High", "Management says the business faces fewer regulatory requirements than exchanges and has FCA-adjacent advice.", "High", "Obtain token-rights analysis, AML/KYC controls, sanctions screening, and outside-counsel opinions by jurisdiction."]
      - ["Legal-entity and governance ambiguity could impair enforcement, contracting, and investor recourse.", "Hong Kong base, UK-centered technical team, and any foundation or operating-entity structure.", "Crunchbase calls Endless Hong Kong-based while Xiong Yu says the core team is mainly in the UK with members in Hong Kong, Japan, and Thailand.", "High", "High", "Funding signal and team footprint are visible, but no board, cap-table, or entity-tree disclosure is present in the assigned evidence.", "High", "Request full entity map, board roster, foundation documents, shareholder rights, and intercompany IP or token agreements."]
      - ["Privacy, custody, and wallet-abstraction promises may outpace documented compliance controls.", "Keyless login, Google-linked onboarding, end-to-end encryption, and user-data handling.", "Endless positions security, privacy, and simplified login as core features, but no DPA, certification, or regulator-facing privacy documentation appears in the pool.", "Medium", "High", "The product narrative is explicitly privacy-first and security-first.", "Medium-High", "Review data-flow diagrams, privacy notices, subprocessors, penetration tests, and breach-response procedures."]
    notes: >-
      Ordered by severity using only the assigned evidence set. Rows reflect documented
      legal surfaces and explicit public gaps, not a conclusion that any regulator has
      already taken action.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible legal and compliance surfaces referenced or implied in the
        assigned 2025-2026 evidence set for Endless and adjacent crypto infrastructure.
    claimRefs: [CR002, CR004, CR007, CR009, CR010, CR012, CR014]
  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - ["Smart-contract, key-management, or wallet-abstraction defects undermine the security proposition.", "Endless markets bank-level encryption, zero-knowledge-based access, and keyless or Google-linked login, but no independent audit or incident history is supplied here.", "Medium", "High", "Conceptual controls described; independent validation not shown.", "High", "Need external audits, test reports, and any disclosed incident history."]
      - ["Hidden centralized infrastructure creates outages or censorship despite decentralization claims.", "Forbes notes centralized RPC providers are single points of failure and cites prior outages; Endless also relies on relay networks and distributed infrastructure claims that are not independently decomposed in the pool.", "Medium", "High", "Architecture story exists, but critical-path dependency mapping is not public in this evidence set.", "High", "Need architecture diagrams, provider concentration data, failover design, and uptime history."]
      - ["Cross-chain, gas-subsidy, and modular-component complexity creates fraud, abuse, or reliability leakage.", "Endless emphasizes cross-chain compatibility, gas sponsorship, and modular components as growth levers.", "Medium", "Medium-High", "User-friction reduction is explicit, but abuse controls are not.", "Medium-High", "Need risk controls for sponsored transactions, rate limits, fraud monitoring, and bridge-security assumptions."]
      - ["AI-model integrations expose Endless to vendor, privacy, latency, or output-quality failures.", "Endless says it integrates external models and AI components for developers rather than building all models itself.", "Medium", "Medium-High", "Partnership intent is clear; commercial and technical fallback plans are not.", "Medium", "Need contracts, model-switching plans, privacy controls, and unit-cost benchmarks for inference."]
    notes: >-
      Mitigation maturity is based on what the sources document publicly. A lower score
      here often reflects missing independent assurance rather than proof of an incident.
    claimRefs: [CR001, CR007, CR011, CR013, CR014]
