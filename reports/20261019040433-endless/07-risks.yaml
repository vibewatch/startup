callouts:
  - calloutType: risk
    title: Compliance is the first gating risk
    body: >-
      Endless's token, staking, wallet, and privacy surfaces are broad enough that
      investors should treat compliance as a gating workstream until management produces
      entity, licensing, and token-rights documentation.
    claimRefs: [CR002, CR009, CR014]
  - calloutType: risk
    title: Commercial proof still trails the valuation
    body: >-
      The funding signal is real, but the public evidence still does not independently
      verify revenue, burn, runway, or sustained developer adoption at a level that
      would anchor a $1 billion entry price.
    claimRefs: [CR003, CR004, CR006, CR008]
  - calloutType: recommendation
    title: Focus diligence on falsifiable documents
    body: >-
      The most valuable next step is not another product demo; it is a document pack
      covering legal structure, token economics, security assurance, treasury, and
      cohort-quality usage metrics.
    claimRefs: [CR008, CR009, CR014]
