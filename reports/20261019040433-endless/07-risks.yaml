      - ["External AI models and research partners", "Large-model providers, Stability AI collaboration, University of Surrey, and other AI partners", "Enable the AI-native product story and differentiated tooling", "Medium", "Model access, economics, or partner relationships degrade and reduce product quality or margins.", "Medium-High", "Componentized architecture may support model substitution, but no contractual or cost evidence is public here.", "Medium"]
      - ["Validator and token economy participation", "EDS token holders, validator operators, and ecosystem users", "Supports staking revenue, gas usage, network security, and token-economy credibility", "High", "Token activity or validator participation lags, leaving monetization and network-incentive assumptions unproven.", "High", "Endless describes multiple token-linked uses and incentive programs, but realized participation is not independently shown.", "High"]
    notes: >-
      This register focuses on dependencies that can break the economic thesis even if
