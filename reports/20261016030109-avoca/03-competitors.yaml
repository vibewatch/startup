      - ["Beyond-the-call lifecycle automation", "Outbound nurture, estimate follow-up, and missed-call recovery", "Broader; includes email/web and customer recontact", "Limited in retained evidence", "Varies by suite; more marketing/ops than dedicated nurture detail"]
      - ["Channel breadth", "Voice-first with SMS/web extensions in retained evidence", "Widest retained breadth across voice, text, email, web, and social", "Primarily phone-first", "Workflow-native communications, but not positioned as best-in-class across every channel"]
      - ["System-of-record control", "Overlay depends on partner FSM", "Overlay depends on partner systems", "Overlay depends on partner FSM", "Highest control because scheduling and customer data already live there"]
      - ["CSR coaching / analytics", "Explicit Coach product and booking-rate analytics", "Not the lead differentiator in retained evidence", "Not shown as category-leading", "Not the retained decision hook"]
      - ["Dispatch / invoicing / payments stack", "Not established as Avoca-native in the assigned evidence; public copy also discusses broad workflow benefits without a clear product boundary", "Not established in the assigned evidence", "Not established in the assigned evidence", "Core platform category, although exact native AI scope varies and is not fully documented here"]
    notes: >-
      Cells summarize what retained public sources explicitly support; blanks were
      avoided by marking weaker evidence as limited or variable rather than
      guessing unsupported capabilities.
    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP008, CP009, CP010]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Solution
      - Price / unit / contract model
      - Included capabilities
      - Discount or unknowns
      - Implication
    rows:
      - ["Avoca", "Quote-based; third-party estimates cluster around roughly $1,000-$3,500 per month; reviews describe per-minute billing and no public trial", "AI CSR, direct booking, outbound nurture, and coaching", "Exact contract terms, realized pricing, and discounts are not public in retained evidence", "Best fit when recovered call revenue is large enough to absorb opaque usage pricing"]
      - ["Thareja AI", "Competitor-authored page says published flat plans start at $29 per month, with phone answering from $150 per month and a 14-day trial", "Multichannel front office, booking, follow-up, and review generation", "Direct comparison page is competitor-authored; retained evidence does not prove Avoca-equivalent writeback depth", "Appeals to price-sensitive operators or buyers who value transparent pricing over category depth"]
      - ["FieldCamp", "Competitor-authored review frames Avoca + FSM stack at roughly $60,000-$90,000 per year for a 10-person operation", "All-in-one front office plus dispatch, invoicing, and payments", "Not a neutral quote sheet; the retained source markets FieldCamp as the substitute", "All-in-one substitute attacks Avoca by collapsing overlay plus FSM spend"]
      - ["Live answering service", "$150-$500 per month in Avoca's own answering-service guide", "Human phone coverage, message taking, and basic triage", "Lower automation depth and less workflow writeback", "Cheaper status-quo substitute, but weaker on booking conversion and follow-up"]
      - ["In-house receptionist", "$30,000-$45,000 per year in Avoca's own answering-service guide", "Office presence and local customer familiarity", "The vendor guide says coverage stops when staff are unavailable; no independent cost benchmark is retained", "Internal-build substitute that solves coverage with labor, not software leverage"]
    notes: >-
      Public pricing is incomplete and often competitor-authored; table preserves
      quoted estimates and unknowns rather than normalizing them into false list
      prices.
    claimRefs: [CP003, CP011, CP012, CP013, CP016]
