companyProfile:
  summary: >-
    Avoca is a New York-based Series B vertical AI company for home-service operators. Its public materials position the
    product as an AI front office that answers inbound calls, books jobs directly into ServiceTitan, runs outbound
    follow-up, and coaches human CSRs. The financing announcement in April 2026 added strong validation with more than
    $125 million raised at a $1 billion valuation and a disclosed 2025 ARR milestone, but the company still does not
    publicly disclose exact ARR, customer count, headcount, or contract economics.
