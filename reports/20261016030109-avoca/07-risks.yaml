company:
  name: Avoca
chapter:
  number: 7
  title: Risks
  summary: Avoca's biggest underwriteable risks cluster around ServiceTitan concentration, opaque enterprise economics, and a wide compliance surface created by direct booking, outbound campaigns, and call recording. Public evidence shows real mitigation depth—API integration, human escalation, customer success support, and substantial funding—but most proof remains company- or partner-mediated, leaving compliance, resilience, and contract-risk diligence as the core kill criteria.
sections:
- id: platform-and-customer-fit
  title: Platform concentration and customer-fit risk
  body: 'Avoca''s public positioning is tightly bound to enterprise home-service operators already running ServiceTitan. Official and partner materials describe direct API booking back into ServiceTitan, while multiple reviews say the product is deepest on that stack and is best suited to $3M+ or PE-backed operators with larger CSR teams. That creates a two-sided risk: if ServiceTitan integration quality or partner economics change, Avoca''s differentiation weakens, and if Avoca tries to move downmarket, the same enterprise-grade onboarding, pricing opacity, and operational overhead that help it win complex operators can slow adoption or compress ROI for smaller customers.'
  claimRefs:
  - CR001
  - CR002
  - CR005
  - CR006
  - CR007
  - CR012
  tableRefs:
  - TR003
- id: regulatory-and-data-governance
  title: Regulatory and data-governance risk
  body: 'The public product surface is broad: Avoca answers calls, handles SMS follow-up, runs outbound campaigns, records and scores calls, and books jobs directly into customer systems. That breadth improves value, but it also expands the consent, call-recording, privacy, and consumer-disclosure burden. The accessible source set does not surface public trust-center artifacts, certification pages, or detailed consent workflows; instead, public evidence is mostly workflow marketing plus a generic acknowledgement that data privacy and integration complexity are adoption barriers. For an investor, that means the legal/regulatory risk is not disproven by the public record—the diligence burden shifts to primary compliance artifacts and operating controls.'
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR013
  tableRefs:
  - TR001
- id: operational-reliability-and-economics
  title: Operational reliability and economic-risk profile
  body: 'Avoca is being trusted with a mission-critical workflow in a category where missed calls directly translate into lost bookings. Company narratives emphasize that revenue in home services runs through the phone, and public case material highlights faster booking, after-hours coverage, and even a hurricane outage anecdote. But the same public record leaves open whether resilience is systematically measured or mainly proven through curated stories. Economic visibility is also thin: pricing is quote-only, independent estimates point to per-minute billing, and reviews disagree about whether onboarding is closer to two weeks or a multimonth change-management exercise. Together, that leaves meaningful execution, margin, and forecasting risk even if product value is real.'
  claimRefs:
  - CR003
  - CR004
  - CR005
  - CR006
  - CR008
  - CR011
  - CR014
  tableRefs:
  - TR002
  figureRefs:
  - FR001
- id: mitigations-kill-criteria-and-diligence
  title: Mitigations, kill criteria, and diligence path
  body: 'Avoca does have visible mitigants: partner-validated API integration, a human-in-the-loop backstop, dedicated customer-success support, named platform partnerships, and enough capital to keep investing in product and go-to-market. Those mitigants justify continuing diligence rather than dismissing the company outright. But the investment case should break if diligence cannot verify compliant outbound consent flows, defensible call-recording and retention controls, stable peak-month unit economics, and evidence that ServiceTitan concentration is an advantage rather than a single-point dependency. In practice, the cleanest next step is not more marketing proof; it is operator-level proof on error rates, exception handling, contract terms, and platform concentration.'
  claimRefs:
  - CR002
  - CR003
  - CR008
  - CR011
  - CR012
  - CR013
