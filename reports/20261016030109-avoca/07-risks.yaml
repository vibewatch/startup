  evidenceGaps:
  - type: missing-source
    severity: material
    topic: compliance-controls
    missingEvidence: Public or diligence-room artifacts covering TCPA consent flows, call-recording disclosures, privacy controls, retention, and security certifications.
    whyItMatters: The product automates calls, SMS, booking, and coaching, so compliance failure could create regulatory, legal, and reputational loss beyond ordinary SaaS risk.
    diligencePath: Request DPA, subprocessors, retention policy, trust-center materials, certification letters, and counsel-reviewed consent scripts by channel.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: unit-economics-and-contracts
    missingEvidence: Executed contract terms, minimums, true-up rules, implementation pricing, and peak-season invoice examples.
    whyItMatters: Quote-only, per-minute economics can turn a genuine productivity tool into a margin drag if spike-month usage or contract minimums are mispriced.
    diligencePath: Review redlined MSA/order form, invoice history for peak months, and customer ROI cohorts split by size and call volume.
    relatedQuestionRefs:
    - QR003
    - QR008
  - type: missing-source
    severity: material
    topic: independent-reliability-proof
    missingEvidence: Independent uptime, incident, error-rate, and customer-retention evidence that is not vendor- or partner-curated.
    whyItMatters: Mission-critical booking workflows should be underwritten on measured reliability and retention, not curated anecdotes alone.
    diligencePath: Obtain incident log, uptime history, customer churn/NRR by cohort, and direct customer calls from operators using Avoca through peak seasons.
    relatedQuestionRefs:
    - QR005
    - QR008
    relatedTableRefs:
    - TR002
