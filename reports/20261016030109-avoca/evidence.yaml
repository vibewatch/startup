evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership and founder table coverage
    missingEvidence: >-
      Current board roster, functional leaders beyond the founders, and any documented succession or concentration
      controls.
    whyItMatters: >-
      The public story is founder-centric, so investors still need proof that the operating bench and governance
      structure can absorb rapid scaling.
    diligencePath: >-
      Request the latest board deck, org chart, and board observer list; reconcile them against current financing
      documents.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: current-scale-metrics
    missingEvidence: Current ARR, growth rate, exact headcount, customer count, gross margin, and cash-burn figures.
    whyItMatters: >-
      The $1 billion valuation and eight-figure ARR claim cannot be underwritten cleanly without hard denominator data
      and a current cost structure.
    diligencePath: Request a KPI pack with monthly ARR, active customers, headcount by function, margin bridge, and cash runway.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: >-
      Cap-table percentages, liquidation preferences, any debt or secondary transactions, and partner-commercial terms
      with ServiceTitan or Nexstar.
    whyItMatters: >-
      Named stakeholders are public, but economic control, dilution, and platform-dependency risk remain opaque without
      instrument-level disclosure.
    diligencePath: Request the cap table, financing docs, debt schedule, and key ecosystem-partner agreements.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: company-milestone-timeline
    missingEvidence: Founding or incorporation date plus dated pre-2025 product-launch, partnership, and leadership-change milestones.
    whyItMatters: >-
      The current pool supports only a partial chronology, which limits how confidently later chapters can interpret
      execution velocity over time.
    diligencePath: >-
      Pull incorporation records, archived launch announcements, and a dated press timeline from the company or investor
      data room.
    relatedQuestionRefs:
      - QO005
  - type: private-evidence-only
    severity: material
    topic: sam-som
    missingEvidence: Bottom-up customer counts, average contract values, and segment penetration by geography or operator size.
    whyItMatters: Public sources support a wedge thesis but not a defensible investable SAM or SOM.
    diligencePath: >-
      Request pipeline, customer-count, and ACV cohort data segmented by FSM, geography, and operator size from
      management.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: implementation-timeline
    missingEvidence: Cohorted time-to-live and time-to-full-optimization data across recent deployments.
    whyItMatters: >-
      Implementation duration governs sales friction, realized ROI timing, and whether onboarding is a scaling
      bottleneck.
    diligencePath: >-
      Ask for implementation dashboards and run reference calls with recent customers on ServiceTitan to reconcile the
      2-week versus 4-12 week claims.
    relatedQuestionRefs:
      - QM005
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Exact realized Avoca pricing, contract minima, and minute-consumption economics by customer segment.
    whyItMatters: >-
      Public comparison pages cluster around estimates, which is not enough to underwrite margin impact or buyer
      payback.
    diligencePath: Request recent redlined customer contracts, realized invoice samples, and sales qualification rules by ACV band.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: trust-and-compliance
    missingEvidence: >-
      Verified public evidence on SOC 2 or ISO status, call-recording controls, outbound consent workflow, and
      comparable trust posture across key rivals.
    whyItMatters: >-
      Trust, regulatory posture, and data handling are named buying criteria, but the retained pool is mostly marketing
      or comparison content.
    diligencePath: >-
      Pull security/compliance documentation, privacy policies, and counsel-reviewed outbound workflow controls for
      Avoca and the top alternatives.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: win-loss-durability
    missingEvidence: Win-loss, churn, and attach-rate data by competitor class and by underlying FSM platform.
    whyItMatters: >-
      The moat debate depends on whether Avoca wins because of product depth, partner channels, or temporary category
      novelty.
    diligencePath: >-
      Request cohort retention, competitive displacement logs, and pipeline conversion by source platform from
      management.
    relatedQuestionRefs:
      - QP001
      - QP006
      - QP007
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Current contract menu, billing formula, minimum terms, discount policy, and realized ASP by customer segment.
    whyItMatters: >-
      Without realized pricing and contract structure, it is impossible to convert public product proof into dependable
      revenue-quality assumptions.
    diligencePath: >-
      Request current order forms, price books, discount approvals, and a realized-pricing cohort cut by customer size
      and module mix.
    relatedQuestionRefs:
      - QI001
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Software vs services gross margin, CAC, CAC payback, GRR, NRR, implementation labor intensity, and working-capital
      profile.
    whyItMatters: >-
      These metrics determine whether Avoca is compounding like high-quality software or carrying heavier services
      economics beneath strong top-line growth.
    diligencePath: >-
      Pull the board pack or data-room operating model with revenue mix, margin bridge, sales-efficiency metrics, and
      cohort retention by module.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly burn, runway, debt facilities, covenants, and the operating trigger for the next
      financing event.
    whyItMatters: >-
      Funding history alone does not prove solvency or negotiating leverage; the underwriting question is whether Avoca
      can fund growth without a near-term capital dependency.
    diligencePath: >-
      Request the latest cash forecast, debt schedule, covenant package, and downside runway case through the next 18
      months.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: security-proof
    missingEvidence: >-
      Primary trust-center or certification artifacts covering SOC 2 scope, data retention, call-recording controls, and
      any outbound-consent workflows.
    whyItMatters: >-
      The platform touches recorded calls, texts, and CRM writes, so compliance posture affects deployability and buyer
      trust.
    diligencePath: >-
      Request Avoca trust-center materials, latest SOC 2 report, data-handling policy, and outbound consent/compliance
      documentation.
    relatedQuestionRefs:
      - QE007
  - type: conflicting-data
    severity: material
    topic: deployment-duration
    missingEvidence: Referenceable implementation timelines split by customer size, FSM complexity, and module mix.
    whyItMatters: >-
      Time-to-value and services load determine whether revenue lift scales cleanly or depends on expensive
      configuration work.
    diligencePath: >-
      Collect customer references and onboarding plans showing median time-to-live, staffing, and post-launch tuning
      effort.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: private-evidence-only
    severity: material
    topic: architecture-depth
    missingEvidence: API documentation, uptime/status evidence, false-booking/error rates, and module-level performance benchmarks.
    whyItMatters: >-
      Without technical artifacts, investors cannot distinguish product depth from a services-heavy wrapper around
      telephony and scripts.
    diligencePath: >-
      Request API docs, status history, exception-rate dashboards, and benchmarked booking/conversion performance by
      channel.
    relatedQuestionRefs:
      - QE003
      - QE005
    relatedTableRefs:
      - TE003
  - type: conflicting-data
    severity: material
    topic: channel-scope
    missingEvidence: SKU- or demo-level confirmation of which channels are production-ready today versus roadmap or limited pilots.
    whyItMatters: >-
      Channel breadth changes both integration scope and whether Avoca is underwriting a voice workflow or a broader
      front-office platform.
    diligencePath: Request current product one-pager or live demo showing supported channels, handoff behavior, and limits by module.
    relatedQuestionRefs:
      - QE003
      - QE008
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Public API docs, package usage, or community practitioner evidence showing how third parties build against or
      operate the platform.
    whyItMatters: >-
      The assigned pool supports workflow depth but says little about developer adoption, extensibility, or external
      implementation community.
    diligencePath: >-
