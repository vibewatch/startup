  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Side
      - Argument
      - What would change the view
    rows:
      - [Thesis, "More than $125M raised at a $1B valuation with Meritech, General Catalyst, and Kleiner Perkins signals strong investor conviction in Avoca's vertical AI category.", "This strengthens if the round terms prove clean rather than preference-heavy and if follow-on investor demand remains strong."]
      - [Thesis, "Spring 2026 materials said Avoca had already surpassed eight figures of 2025 ARR and was on track to book $1B of jobs in 2026, which is meaningful commercial proof for a young vertical AI platform.", "This upgrades materially if exact ARR, growth, NRR/GRR, and gross margin data show durable software economics rather than implementation-heavy services."]
      - [Thesis, "Customer proof points suggest Avoca can consolidate contact-center workflows and recover revenue that operators were previously losing to missed or weakly handled calls.", "This becomes much stronger if multiple third-party case studies reproduce the same outcome across customers and geographies."]
      - [Anti-thesis, "Public valuation support is thin because the $1B headline is paired with only a vague 'eight figures' ARR disclosure, leaving a wide implied multiple band.", "Exact ARR and growth disclosure could narrow the range enough to support an investable entry."]
      - [Anti-thesis, "Public pricing and contract terms are opaque, so investors cannot verify ACV, payback, services mix, or downside from implementation-heavy deployments.", "A sample order form, cohort payback analysis, and renewal data would reduce this uncertainty."]
      - [Anti-thesis, "Third-party commentary still flags onboarding time, nuanced-call handling, latency, and empathy as real operating constraints.", "The concern eases if diligence shows low churn, high expansion, and minimal human-in-the-loop labor drag after deployment."]
    notes: >-
      Rows pair evidence-backed arguments with the specific additional evidence or pricing change
      that would revise the investment view.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - [Bull, "Exact ARR is already near the top of 'eight figures,' retention is strong, and expansion beyond the first service verticals does not dilute product depth or margin.", "The current $1B mark can still compound into an attractive follow-on entry only if software-style economics make today's multiple compress quickly.", "Execution missteps in new verticals; hidden services labor inside delivery.", "Would require diligence showing high NRR/GRR, strong gross margins, efficient burn, and a clean cap table."]
      - [Base, "Traction is real, but public evidence remains limited to headline financing, selective customer wins, and opaque contract economics.", "Best action is to track rather than chase: wait for exact economics or a better price so underwriting is tied to proof instead of narrative.", "Overpaying before economics are verified; multiple compression if AI sentiment cools; operational drag from rollout complexity.", "Best fit with the current public record."]
      - [Bear, "ARR is closer to the low end of 'eight figures,' onboarding and human-handoff complexity weigh on margins, and future financing resets AI multiples.", "A $1B entry would offer weak downside protection and could require a flat or down round before risk/reward resets.", "Growth slows, churn rises, or liquidation preferences subordinate new money.", "Would gain weight if diligence shows weak cohort economics or an investor-unfriendly preference stack."]
    notes: >-
      Scenario framing is intentionally qualitative because the current pool provides a financing
      mark and milestone anchors, not a full operating model or a clean public/private comparable set.
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV009
      - CV010
      - CV014
      - CV015
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays at track because real market and customer proof meets an unusually
      thin public valuation bridge at the current $1B mark.
    data:
      nodes:
        - label: Large missed-call pain
          detail: Legacy answering-service and CSR workflows are expensive and frequently lose revenue-critical calls.
        - label: Product proof exists
          detail: Avoca cites customer revenue lift, booking improvement, and multi-brand deployments.
        - label: External validation is strong
          detail: The company raised more than $125M at a $1B valuation with top-tier backers.
        - label: Public economics are still thin
          detail: Exact ARR, retention, gross margin, burn, pricing, and preference terms are not public.
        - label: Execution risk persists
          detail: Third parties still flag onboarding friction plus nuanced-call, latency, and empathy limits.
        - label: Recommendation remains track
          detail: Revisit only after deeper diligence or a materially better entry price narrows the downside.
    approximationNotes: >-
      Ordered sequence reflects valuation logic, not measured conversion rates between nodes.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV014
      - CV015
callouts:
  - calloutType: recommendation
    title: Public call
    body: >-
      Track Avoca rather than pay through the current mark: the company looks real, but the public
      record is still too thin to underwrite $1B with conviction.
    claimRefs:
      - CV001
      - CV003
      - CV014
      - CV015
  - calloutType: assumption
    title: What would unlock an investable entry
    body: >-
      The quickest upgrade path is not another narrative proof point; it is exact ARR, retention,
      gross margin, burn, pricing, and cap-table disclosure that proves the current mark can be
      defended with downside protection.
    claimRefs:
      - CV003
      - CV009
      - CV014
      - CV015
