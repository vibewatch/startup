company:
  name: Avoca
chapter:
  number: 8
  title: Valuation
  summary: >-
    Avoca has enough public evidence to justify continued diligence—more than $125 million raised
    at a $1 billion valuation, eight-figure 2025 ARR, and multiple customer-proof points on booking
    lift and contact-center consolidation—but not enough to underwrite that mark with conviction.
    The public record still omits exact ARR, retention, gross margin, burn, and capital-stack terms,
    so the recommendation remains track with medium confidence, high risk, and a stretched valuation
    stance.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      Avoca clears the "serious company" bar but not the "pay today's price" bar. The financing
      signal is exceptional: company-issued spring 2026 materials said Avoca had raised more than
      $125 million at a $1 billion valuation, with Meritech, General Catalyst, and Kleiner Perkins
      leading the disclosed rounds, while also saying the business had already surpassed eight
      figures of 2025 ARR. The same record says Avoca is on track to book $1 billion of jobs in
      2026 and already has recognizable ecosystem distribution through ServiceTitan, Nexstar, and
      Clover. Those are real proof points, but they are not a full valuation bridge. Public sources
      still stop short of exact ARR, growth, retention, gross margin, burn, debt, or liquidation
      preference disclosure, so the entry decision has to stay price-sensitive and diligence-led
      rather than narrative-led.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV014
      - CV015
    tableRefs:
      - TV001
    figureRefs:
      - FV001
  - id: thesis-vs-anti-thesis
    title: Thesis versus anti-thesis
    body: >-
      The bullish case is straightforward: Avoca appears to be solving a painful, phone-first
      workflow where missed calls directly destroy revenue, and both company case studies and
      third-party commentary point to materially better booking capture when the product is deployed
      well. The financing round also reads as external validation that investors believe vertical AI
      voice agents can capture more value than horizontal tooling. The anti-thesis is equally clear:
      the evidence set still relies heavily on company-controlled proof points, public pricing is
      opaque, and third parties continue to flag onboarding friction plus nuanced-call limitations.
      That mix supports interest, but not an aggressive underwriting posture at the disclosed mark.
    claimRefs:
      - CV004
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
    tableRefs:
      - TV002
  - id: scenario-framing-and-comparable-lens
    title: Scenario framing and comparable lens
    body: >-
      Public evidence supports milestone-based scenario work, not a faux-precision comp model. The
      usable valuation anchors in this pool are the actual financing mark, the disclosed but
      imprecise ARR milestone, the economic alternative to legacy answering-service workflows, and
      selected proof that Avoca can raise booking rates or consolidate contact-center overhead. That
      is enough to frame bull, base, and bear cases around whether the business is already near the
      high end of "eight figures" ARR with durable software economics or whether the current mark is
      front-running proof. It is not enough to defend a target return, hold period, or exit multiple
      with precision, so scenario discipline has to come from milestone thresholds rather than a
      spreadsheet that pretends the missing variables are known.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV009
      - CV014
      - CV015
    tableRefs:
      - TV003
  - id: exit-readiness-diligence-asks-and-breakers
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness is plausible in narrative terms but not yet underwritable from public evidence.
      Avoca has recognizable investors, ecosystem partners, and category mindshare, which could make
      it attractive to future sponsors or strategic buyers if growth quality holds. But before
      writing a check, diligence should focus on exact ARR and growth by cohort, renewal behavior,
      gross margin split between software and human-in-the-loop operations, implementation burden,
      real contract pricing, and the full preference stack. The thesis breaks quickly if diligence
      shows ARR near the low end of eight figures, heavy services load inside gross margin, high
      churn after implementation, or capital-structure terms that subordinate new money too
      aggressively. Until those questions are closed, the right stance is to track rather than
      stretch.
    claimRefs:
      - CV003
      - CV010
      - CV011
      - CV014
      - CV015
