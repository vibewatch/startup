callouts:
- calloutType: strength
  title: The strongest public signal is workflow depth, not generic AI breadth
  body: Across official materials, the Series B release, and ServiceTitan's marketplace page, Avoca consistently appears as a vertically integrated home-services workflow layer tied to live booking, outbound recovery, and CSR performance management rather than a generic voice wrapper.
  claimRefs:
  - CO002
  - CO003
  - CO010
- calloutType: risk
  title: Public momentum is real, but disclosure quality still lags the valuation
  body: The unicorn financing round and enterprise customer stories are current positives, yet public evidence on current ARR, customer count, headcount, board composition, and contract economics remains too thin to underwrite the headline valuation without a data room.
  claimRefs:
  - CO003
  - CO005
  - CO012
  - CO013
