        title: Traction proxies and operating leverage
        blocks:
          - type: paragraph
            body: >-
              The strongest public traction proxies are workflow outputs rather than GAAP financials. Company-published
              customer stories claim Aire Serv lifted after-hours bookings from 58 to 208 while Granite Comfort said
              Avoca consolidated nine call centers into one and helped a pilot brand grow revenue 20% year over year
              from recovered calls. The April 2026 press release adds that Avoca surpassed eight figures of ARR in 2025
              and is on track to book $1 billion of jobs in 2026, but those are company-selected outputs rather than
              audited revenue disclosures. Together they suggest real demand and conversion lift, yet they do not reveal
              logo churn, cohort retention, or contribution margin by workflow.
            claimRefs:
