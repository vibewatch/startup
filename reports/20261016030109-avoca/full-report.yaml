  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo alternatives
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence defines Avoca's market as front-office automation for phone-dependent service
              businesses rather than as a full-stack field-service software platform. Public company positioning and
              third-party categorization both anchor the wedge around inbound call capture, scheduling, follow-up, and
              CSR productivity in home services, especially HVAC, plumbing, and electrical contractors. That matters
              because the relevant substitution set is narrower than "all home-services software": the status quo is
              still voicemail, live answering services, or in-house reception, while the adjacent but distinct
              categories include full field-service management, dispatch, technician workflow, and generalized
              omnichannel support. Management is explicit that the company wants to expand into other service verticals,
              but the current commercial beachhead remains home services, so any market statement that starts with
              enterprise AI or all SMB software would be too broad for valuation work.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: Sizing lenses support a wedge thesis, not a clean public SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several useful sizing lenses, but none of them independently yields a defensible
              bottom-up SAM or SOM. The broadest lens is management's framing of a "$1T+ services economy," which is
              directionally helpful but too top-down for underwriting. A more investable lens comes from target-customer
              complexity: external reviews consistently place Avoca with several-million-dollar operators that have
              dedicated CSR teams, meaningful call volume, and direct CRM or ServiceTitan workflows. Budget benchmarks
              also point to a specific spend wedge: live answering services and in-house reception establish the
              incumbent cost baseline, while third-party estimates put Avoca at a materially higher software spend tier
              that requires a recovered-revenue ROI case rather than a pure labor-arbitrage pitch. That is enough to
              frame the opportunity, but not enough to quantify a public SAM/SOM without internal customer-count, ACV,
              or segment-penetration data.
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM009
      - number: '2.3'
        title: Buyer, user, and payer converge around call-center economics
        blocks:
          - type: paragraph
            body: >-
              Avoca's adoption path appears to run through operations leaders who own call conversion, after-hours
              coverage, and estimate follow-up rather than through pure IT budgets. The user is usually the CSR or
              dispatch function that needs overflow handling, 24/7 coverage, or performance coaching, while the payer is
              the owner, GM, or contact-center leader who feels the P&L impact of missed calls and unworked estimates.
              This helps explain why ServiceTitan integration matters so much: the product is not just a conversational
              layer, it promises to close the booking loop inside the operating system already used by the target
              contractor. The buyer map therefore skews toward operators with enough complexity to justify workflow
              integration and measurement, but not so much omnichannel sprawl that the problem becomes a general
              contact-center platform purchase.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM013
      - number: '2.4'
        title: Adoption drivers are obvious; adoption constraints are not yet cleanly benchmarked
        blocks:
          - type: paragraph
            body: >-
              The demand drivers are economically intuitive: if phone handling determines booking volume, then
              after-hours coverage, overflow response, and automated estimate follow-up all attack lost revenue rather
              than only labor cost. That makes the category compelling for high-call-volume contractors. The constraint
              side is less settled. Company-authored material highlights cost, privacy, and integration complexity for
              smaller operators, while external reviews argue that deployment takes weeks and requires careful tuning of
              brand voice and ServiceTitan configurations. Against that, the ServiceTitan marketplace says most
              customers are live within two weeks. The implication is not that the market is unattractive; it is that
              public evidence has not yet normalized implementation duration, pricing transparency, or the boundary
              between "go live" and "fully optimized" deployment. Those gaps matter because they govern how quickly the
              product can move from missed-call relief into system-wide front-office standardization.
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The spend wedge is painful enough to fund specialized software
            body: >-
              Avoca does not need to replace all home-services software to matter; it only needs to recover enough
              missed calls and unworked estimates to beat human answering costs and justify a sales-led software
              contract.
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
          - type: callout
            title: Public evidence still underspecifies the real SAM and implementation curve
            body: >-
              Investors can see the broad category and the target buyer profile, but public sources still do not expose
              a clean bottom-up market size, transparent pricing schedule, or reconciled time to value across
              deployments.
            calloutType: risk
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans overlays, suites, and native systems of record
        blocks:
          - type: paragraph
            body: >-
              Avoca competes in a fragmented decision set rather than a clean one-to-one category. The direct peer group
              is voice-first overlays such as Broccoli AI and Sameday AI, which the retained comparison source presents
              as booking-centric products attached to field-service systems. A second group competes by broadening the
              lifecycle: Hatch positions itself as voice, text, email, and web automation across lead response,
              appointment management, estimate follow-up, and recontact, while Podium comes from messaging, reviews, and
              payments. A third group competes by collapsing the stack into the system of record: ServiceTitan and
              Housecall Pro already own scheduling, customer data, and adjacent communication workflows. That means
              buyers are really choosing among three models: overlay voice specialization, broader communications
              automation, or native field-service software with enough AI to make an overlay unnecessary.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
