    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays at track because real market and customer proof meets an unusually thin public valuation
      bridge at the current $1B mark.
    data:
      nodes:
        - label: Large missed-call pain
          detail: Legacy answering-service and CSR workflows are expensive and frequently lose revenue-critical calls.
        - label: Product proof exists
          detail: Avoca cites customer revenue lift, booking improvement, and multi-brand deployments.
        - label: External validation is strong
          detail: The company raised more than $125M at a $1B valuation with top-tier backers.
        - label: Public economics are still thin
          detail: Exact ARR, retention, gross margin, burn, pricing, and preference terms are not public.
        - label: Execution risk persists
          detail: Third parties still flag onboarding friction plus nuanced-call, latency, and empathy limits.
        - label: Recommendation remains track
          detail: Revisit only after deeper diligence or a materially better entry price narrows the downside.
