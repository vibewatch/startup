      - number: '4.3'
        title: Cost structure and unit-economics limits
        blocks:
          - type: paragraph
            body: >-
              Public sources imply a cost base heavier than pure self-serve SaaS. Avoca’s value depends on deep CRM/FSM
              integration, workflow tuning, and some human escalation or coaching support; independent reviews
              repeatedly cite onboarding measured in weeks, not days, and better fit for operators already running
              ServiceTitan or Housecall Pro. That likely supports strong ACVs but also means implementation labor and
              service-delivery overhead matter to gross margin. The assigned evidence never publishes CAC, payback,
              gross margin split, or working-capital needs, so the unit-economics table is mostly a diligence map rather
              than a completed model.
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI015
      - number: '4.4'
        title: Capital adequacy and verdict
        blocks:
          - type: paragraph
            body: >-
              Capital access is the cleanest public financial fact: Avoca announced more than $125 million raised at a
              $1 billion valuation in April 2026, and that capital likely removes immediate financing pressure. Still,
              public materials do not disclose cash on hand, burn, runway, debt facilities, covenant constraints, or the
              trigger for the next round. The result is a familiar late-stage AI pattern: strong external financing and
              credible commercial proof, but not enough public data to underwrite revenue quality, margin path, or
              capital efficiency. Financially, Avoca reads as a high-potential but still private-data-dependent
              diligence case rather than a business that can be underwritten from public evidence alone.
            claimRefs:
              - CI011
              - CI012
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The clearest public value signal is workflow conversion, not reported revenue detail
            body: >-
              Named customer stories repeatedly frame Avoca as a missed-call recovery and after-hours booking engine,
              suggesting the immediate ROI case is operational leverage rather than transparent public software metrics.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI008
          - type: callout
            title: Capital adequacy still depends on private-company disclosure
            body: >-
              The public record shows fresh financing and strong commercial momentum, but it still omits realized
              pricing, gross margin, burn, runway, debt, and customer concentration—the inputs needed to underwrite a $1
              billion private valuation.
            calloutType: risk
            claimRefs:
              - CI003
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and target workflow
        blocks:
          - type: paragraph
            body: >-
              Avoca's public product surface is purpose-built for home-service contractors rather than horizontal
              contact centers. Across company and third-party descriptions, the recurring jobs-to-be-done are answering
              missed or after-hours calls, qualifying the job, booking directly into a field-service workflow, and
              following up on unsold demand. That focus matters because the company is selling workflow compression for
              phone-first operators, not a general support suite for every channel or vertical.


              The module mix visible in the assigned evidence is already broader than a single AI receptionist. Inbound
              voice remains the anchor, but the public surfaces also describe outbound estimate recovery, reactivation
              campaigns, coaching for human CSRs, and some web or text intake. The practical implication is that Avoca
              is trying to own the contractor front office from first contact through booking and post-quote recovery,
              which increases switching value when the integrations and scripts are tuned well, but also raises
              implementation scope versus a narrow answering-service substitute.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE007
