        title: Dated milestones and refresh-specific risks
        blocks:
          - type: paragraph
            body: >-
              The dated chronology that can be defended from this pool starts only at the accelerator or go-to-market
              phase and becomes much richer in late 2025 and 2026. External reviewers identify Avoca as a YC W23
              company; Avoca's own case material then points to a late-2025 enterprise rollout across Granite Comfort
              brands and a 20% year-over-year revenue lift at Yost & Campbell from calls the platform captured. In 2026,
