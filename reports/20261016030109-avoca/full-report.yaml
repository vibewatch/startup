      - number: '3.2'
        title: Avoca's edge is workflow depth, but packaging opacity narrows the audience
        blocks:
          - type: paragraph
            body: >-
              Public evidence still frames Avoca as an enterprise-style purchase rather than a self-serve tool. Multiple
              2026 third-party reviews describe pricing as quote-based, largely per-minute, and without published public
              tiers or a trial path, while the same reviews place the product with larger, ServiceTitan-centric
              operators rather than small shops. That packaging matters because substitutes exist at both ends of the
              market. A basic live answering service or in-house receptionist is much cheaper but materially weaker on
              automation. At the other extreme, all-in-one substitutes market the ability to replace both the AI front
              office and the underlying field service stack. Avoca offsets some of that risk through distribution:
              retained sources repeatedly point to ServiceTitan, Nexstar, and Clover partnerships, which give it
              route-to-market leverage with the exact buyers that feel the pain of missed calls most acutely.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.3'
        title: Durability depends on whether specialists or incumbents close the adjacent gaps first
        blocks:
          - type: paragraph
            body: >-
              Avoca's moat looks strongest where three conditions coexist: high inbound call volume, a
              ServiceTitan-centered workflow, and management appetite for coaching and outbound nurture, not just call
              pickup. In that slice, deep booking writeback plus Coach and follow-up automation create more value than a
              generic answering layer. The displacement risk is still real, though. Multichannel suites can attack from
              above by owning more of the customer journey, while native systems such as ServiceTitan and Housecall Pro
              can attack from below by folding voice and marketing features into the platform that already owns
              dispatch, invoicing, and customer records. The retained pool does not prove that Avoca has already locked
              in compliance, pricing, or churn advantages that would stop either flank from narrowing the gap.
            claimRefs:
              - CP002
              - CP010
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Avoca wins when the buyer already runs a serious field-service stack
            body: >-
              The retained evidence consistently positions Avoca as strongest for ServiceTitan-centered operators that
              care about booking conversion, missed call recovery, and CSR coaching more than all-in-one field
              operations.
            calloutType: insight
            claimRefs:
              - CP002
              - CP010
              - CP012
              - CP015
          - type: callout
            title: The biggest strategic risk is stack compression
            body: >-
              Avoca sits between cheaper answering-service substitutes and heavier systems of record; if native FSM
              vendors make voice good enough or multichannel suites improve writeback depth, Avoca's overlay premium
              gets harder to defend.
            calloutType: risk
            claimRefs:
              - CP010
              - CP012
              - CP013
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows Avoca monetizing a home-services front-office stack rather than a single answering
              widget. Independent reviews consistently describe three modules—Convert for inbound answering and booking,
              Nurture for outbound estimate recovery and demand generation, and Coach for CSR scoring—sold through a
              demo-and-quote enterprise process rather than a self-serve SKU. That setup supports higher contract values
              for ServiceTitan-centered operators, but it also means public evidence stops at estimated ranges rather
              than realized pricing, discounts, or recognition policy. For underwriting, the revenue mechanism is
              understandable, but the revenue mix is not yet modelable.
            claimRefs:
