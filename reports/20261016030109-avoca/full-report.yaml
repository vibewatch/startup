chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating scope
        blocks:
          - type: paragraph
            body: >-
              Avoca's current public identity is clear on positioning but still incomplete on basic formation facts. The
              company calls itself “the AI workforce for service businesses,” and its official materials consistently
              describe a front-office automation stack that handles inbound calls, outbound reactivation and campaign
              workflows, and coaching for human CSRs. The latest official financing announcement also anchors
              headquarters in New York City, with a second office in Santa Barbara, and frames the business as a
              post-Series-B company expanding from home services into adjacent service categories. What remains notably
              absent from company-controlled sources is a company-published founding date, current headcount, or an
              official customer-count denominator, so later chapters should treat those figures as diligence items
              rather than settled canon.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO007
      - number: '1.2'
        title: Founders, leadership visibility, and governance gaps
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is good enough to identify the founders but not good enough to underwrite the
              broader bench. Current public sources consistently name Tyson Chen and Apurva Shrivastava as Avoca's
              co-founders, and Avoca's founder-profile post supplies some context for Chen's thesis formation: work on
              self-driving systems and earlier chatbot deployments translated into a conviction that voice-heavy service
              workflows were a sharper wedge than generic SMB software. Beyond that, the public set becomes thin. There
              is no disclosed board roster, no public control-right summary, and no dated narrative of management
              additions or departures in the assigned pool, which leaves meaningful key-person concentration risk around
              the founders.
            claimRefs:
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
              - CO009
      - number: '1.3'
        title: Funding, investors, platform anchors, and publicly supportable scale
        blocks:
          - type: paragraph
            body: >-
              The strongest current evidence in the chapter is around financing and commercial relevance. Avoca's April
              2026 announcement, corroborated by Pulse 2.0, puts the company at more than $125 million raised and a $1
              billion valuation, with Meritech and General Catalyst leading the Series B and Kleiner Perkins leading the
              Series A. The same release says Avoca surpassed eight figures of ARR in 2025 and is on track to book $1
              billion in jobs in 2026, but those remain company-provided operating signals rather than independently
              audited revenue disclosures. ServiceTitan is the clearest ecosystem anchor: its marketplace page says
              Avoca books directly back into ServiceTitan via API, which matters because it ties Avoca's product value
              to a concrete system of record instead of an isolated voice bot.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO010
