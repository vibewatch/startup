      - number: '5.2'
        title: Architecture, integrations, and deployment model
        blocks:
          - type: paragraph
            body: >-
              The clearest architectural through-line is that Avoca sits between inbound demand channels and the
              contractor's system of record, then writes the outcome back into operational software. Company pages and
              independent reviews repeatedly point to qualification, routing, and booking logic, while the ServiceTitan
              marketplace goes further by describing a direct API integration that pulls current data via AdCap and
              books jobs back into ServiceTitan. That is a stronger operational claim than a generic voice bot that only
              captures intent and hands the rest back to humans.


              At the same time, the platform is not presented as fully autonomous across every edge case. Public
              materials still describe human escalation, implementation-led training, and customer-success support as
              part of the operating model. That implies a services-and-configuration layer around the product: buyers
              are not only purchasing software, but also workflow design, script tuning, escalation rules, and
              integration setup. The technology can therefore be valuable precisely where operations are complex, but
              time-to-value depends on how well Avoca maps to the customer's existing FSM and call-center processes.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
              - CE010
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE010
              - CE011
              - CE012
      - number: '5.3'
        title: Differentiation and maturity signals
        blocks:
          - type: paragraph
            body: >-
              Avoca's strongest differentiation signal is depth in the home-services workflow instead of generic
              conversational AI breadth. Several sources converge on the same package: vertical call scripts, direct
              ServiceTitan-centered booking, outbound estimate follow-up, and coaching analytics for human CSRs. That is
              a coherent product thesis because it attacks revenue leakage from missed calls and weak follow-up, then
              reinforces the same motion with analytics rather than stopping at call deflection.


              Maturity signals are good but not clean. ServiceTitan's marketplace and multiple reviews indicate real
              deployment experience, multi-location support, and meaningful automation rates, which suggests Avoca is
              beyond demo-ware. But channel scope and onboarding duration are not yet crisply reconciled across sources.
              Official materials market broad omnichannel coverage, while at least one review still frames the product
              as voice-first with SMS as the main secondary channel. Likewise, marketplace claims that customers are
              typically live within two weeks sit uneasily beside independent reports of multi-week onboarding.
            claimRefs:
              - CE005
              - CE007
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Trust, security, and product diligence risks
        blocks:
          - type: paragraph
            body: >-
              The most material public diligence gap is not whether Avoca has a clear product story; it is whether the
              operational and compliance claims are backed by primary artifacts. The assigned pool contains secondary
              references to SOC 2 and several statements about handling call recordings, customer routing, and campaign
              execution, but it does not include a trust center, certification letter, retention policy, consent
              workflow, or uptime history that would let an investor independently test security, privacy, or regulated
              outbound practices. For a system sitting on phone, text, and CRM workflows, that missing proof is
              material.


              The second risk is implementation variance. Public sources agree that the platform is most compelling for
              scaled operators with real call volume, but they disagree on how much work it takes to reach production
              quality. If the true operating model depends on weeks of tuning, ServiceTitan-specific setup, and manual
              exception handling, then part of Avoca's moat may come from services and partner alignment as much as from
              model performance. That is not fatal, but it pushes diligence toward deployment references,
              false-booking/error rates, channel-by-channel scope, and compliance controls rather than taking marketing
              claims at face value.
            claimRefs:
              - CE008
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Depth is concentrated where contractor workflows monetize quickly
            body: >-
              The strongest public proof is not generic AI capability but workflow closure: direct ServiceTitan booking,
              estimate follow-up, and QA coaching around booking outcomes. That combination creates more switching value
              than a standalone AI answering layer if deployment quality is real.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Public proof is weakest on compliance artifacts and implementation variance
            body: >-
              Security claims, outbound-consent controls, and real onboarding duration are not reconciled by primary
              artifacts in the assigned pool. Those gaps matter because Avoca sits inside recorded calls, texting flows,
              and customer-system writes rather than at a read-only analytics layer.
            calloutType: risk
            claimRefs:
              - CE008
              - CE010
              - CE012
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and workflow ownership
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently positions Avoca around home-service operators rather than a generic SMB base.
              The buyer appears to be an operations or revenue owner running HVAC, plumbing, electrical, or adjacent
              field-service businesses; the daily users are CSR, dispatch, and call-center teams; and the economic payer
              is the operator trying to raise booking rates and recover after-hours demand. The strongest workflow proof
              is not logo placement but operational scope: Avoca is described as answering inbound calls, booking
              directly into CRM systems, following up on estimates, and routing higher-value leads into existing
              scheduling workflows. That combination supports a customer thesis centered on service businesses with
              meaningful phone volume, existing systems of record, and a clear cost of missed calls.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU011
              - CU013
      - number: '6.2'
        title: Adoption proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              Avoca has more public customer proof than an early pilot-stage vendor, but the proof is uneven. Named
              operators recur across sources, with Turnpoint, 1-800-GOT-JUNK?, Goettl, Sila Services, and H.L. Bowman
              showing up in company-issued and secondary coverage, which is stronger than a logo wall but still weaker
              than independently audited case studies. The best outcome evidence comes from quoted operators: Sila says
              booking rates improved and after-hours demand capture increased, while partner-hosted testimonials from
              Rescue Air & Plumbing and Brody Pennell point to consistent call capture and consolidation of fragmented
              customer-communication tools. Adoption-scale claims also exist, but they are imprecise: one source cites
              800+ customers while another summarizes the website as 1,000+ service leaders.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU011
      - number: '6.3'
        title: Durability, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              The chapter's main weakness is that public evidence proves production use better than customer durability.
              There is no disclosed NRR, GRR, churn, renewal cadence, contract length, or cohort retention by segment,
              so the public record cannot distinguish strong deployment proof from durable account economics. Expansion
              logic is plausible because the product spans inbound, outbound, and coaching modules, and because
              multi-location rollouts are explicitly supported, but concentration risk is still underexplored: public
              sources do not quantify customer mix, top-account exposure, or how much demand flows through key partners
              such as ServiceTitan. Sparse independent review density and quote-only enterprise procurement also make it
              harder to benchmark stickiness outside curated references.
            claimRefs:
              - CU008
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Real production references exist, but they are curated
            body: >-
              Avoca is beyond anonymous logo-walling: named operators recur across 2026 sources, and partner-hosted
              testimonials add specific operational use cases. The tradeoff is that most proof still comes through
              company or partner distribution rather than independent customer reviews or audited case studies.
            calloutType: strength
            claimRefs:
              - CU009
              - CU011
              - CU012
              - CU013
              - CU014
          - type: callout
            title: Durability remains the core diligence gap
            body: >-
              Public sources support adoption and workflow fit, but they do not disclose the metrics that matter for
              customer quality: NRR, GRR, churn, renewal timing, or concentration by top account and partner channel.
              That keeps the chapter in proof-of-use rather than proof-of- durability territory.
            calloutType: risk
            claimRefs:
              - CU008
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Platform concentration and customer-fit risk
        blocks:
          - type: paragraph
            body: >-
              Avoca's public positioning is tightly bound to enterprise home-service operators already running
              ServiceTitan. Official and partner materials describe direct API booking back into ServiceTitan, while
              multiple reviews say the product is deepest on that stack and is best suited to $3M+ or PE-backed
              operators with larger CSR teams. That creates a two-sided risk: if ServiceTitan integration quality or
              partner economics change, Avoca's differentiation weakens, and if Avoca tries to move downmarket, the same
              enterprise-grade onboarding, pricing opacity, and operational overhead that help it win complex operators
              can slow adoption or compress ROI for smaller customers.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR012
      - number: '7.2'
        title: Regulatory and data-governance risk
        blocks:
          - type: paragraph
            body: >-
              The public product surface is broad: Avoca answers calls, handles SMS follow-up, runs outbound campaigns,
              records and scores calls, and books jobs directly into customer systems. That breadth improves value, but
              it also expands the consent, call-recording, privacy, and consumer-disclosure burden. The accessible
              source set does not surface public trust-center artifacts, certification pages, or detailed consent
              workflows; instead, public evidence is mostly workflow marketing plus a generic acknowledgement that data
              privacy and integration complexity are adoption barriers. For an investor, that means the legal/regulatory
              risk is not disproven by the public record—the diligence burden shifts to primary compliance artifacts and
              operating controls.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR008
              - CR009
              - CR010
              - CR013
      - number: '7.3'
        title: Operational reliability and economic-risk profile
        blocks:
          - type: paragraph
            body: >-
              Avoca is being trusted with a mission-critical workflow in a category where missed calls directly
              translate into lost bookings. Company narratives emphasize that revenue in home services runs through the
              phone, and public case material highlights faster booking, after-hours coverage, and even a hurricane
              outage anecdote. But the same public record leaves open whether resilience is systematically measured or
              mainly proven through curated stories. Economic visibility is also thin: pricing is quote-only,
              independent estimates point to per-minute billing, and reviews disagree about whether onboarding is closer
              to two weeks or a multimonth change-management exercise. Together, that leaves meaningful execution,
              margin, and forecasting risk even if product value is real.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR011
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR008
              - CR010
              - CR013
              - CR014
      - number: '7.4'
        title: Mitigations, kill criteria, and diligence path
        blocks:
          - type: paragraph
            body: >-
              Avoca does have visible mitigants: partner-validated API integration, a human-in-the-loop backstop,
              dedicated customer-success support, named platform partnerships, and enough capital to keep investing in
              product and go-to-market. Those mitigants justify continuing diligence rather than dismissing the company
              outright. But the investment case should break if diligence cannot verify compliant outbound consent
              flows, defensible call-recording and retention controls, stable peak-month unit economics, and evidence
              that ServiceTitan concentration is an advantage rather than a single-point dependency. In practice, the
              cleanest next step is not more marketing proof; it is operator-level proof on error rates, exception
              handling, contract terms, and platform concentration.
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR011
              - CR012
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Avoca clears the "serious company" bar but not the "pay today's price" bar. The financing signal is
              exceptional: company-issued spring 2026 materials said Avoca had raised more than $125 million at a $1
              billion valuation, with Meritech, General Catalyst, and Kleiner Perkins leading the disclosed rounds,
              while also saying the business had already surpassed eight figures of 2025 ARR. The same record says Avoca
              is on track to book $1 billion of jobs in 2026 and already has recognizable ecosystem distribution through
              ServiceTitan, Nexstar, and Clover. Those are real proof points, but they are not a full valuation bridge.
              Public sources still stop short of exact ARR, growth, retention, gross margin, burn, debt, or liquidation
              preference disclosure, so the entry decision has to stay price-sensitive and diligence-led rather than
              narrative-led.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The bullish case is straightforward: Avoca appears to be solving a painful, phone-first workflow where
              missed calls directly destroy revenue, and both company case studies and third-party commentary point to
              materially better booking capture when the product is deployed well. The financing round also reads as
              external validation that investors believe vertical AI voice agents can capture more value than horizontal
              tooling. The anti-thesis is equally clear: the evidence set still relies heavily on company-controlled
              proof points, public pricing is opaque, and third parties continue to flag onboarding friction plus
              nuanced-call limitations. That mix supports interest, but not an aggressive underwriting posture at the
              disclosed mark.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
      - number: '8.3'
        title: Scenario framing and comparable lens
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports milestone-based scenario work, not a faux-precision comp model. The usable
              valuation anchors in this pool are the actual financing mark, the disclosed but imprecise ARR milestone,
              the economic alternative to legacy answering-service workflows, and selected proof that Avoca can raise
              booking rates or consolidate contact-center overhead. That is enough to frame bull, base, and bear cases
              around whether the business is already near the high end of "eight figures" ARR with durable software
              economics or whether the current mark is front-running proof. It is not enough to defend a target return,
              hold period, or exit multiple with precision, so scenario discipline has to come from milestone thresholds
              rather than a spreadsheet that pretends the missing variables are known.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is plausible in narrative terms but not yet underwritable from public evidence. Avoca has
              recognizable investors, ecosystem partners, and category mindshare, which could make it attractive to
              future sponsors or strategic buyers if growth quality holds. But before writing a check, diligence should
              focus on exact ARR and growth by cohort, renewal behavior, gross margin split between software and
              human-in-the-loop operations, implementation burden, real contract pricing, and the full preference stack.
              The thesis breaks quickly if diligence shows ARR near the low end of eight figures, heavy services load
              inside gross margin, high churn after implementation, or capital-structure terms that subordinate new
              money too aggressively. Until those questions are closed, the right stance is to track rather than
              stretch.
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public call
            body: >-
              Track Avoca rather than pay through the current mark: the company looks real, but the public record is
              still too thin to underwrite $1B with conviction.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV014
              - CV015
          - type: callout
            title: What would unlock an investable entry
            body: >-
              The quickest upgrade path is not another narrative proof point; it is exact ARR, retention, gross margin,
              burn, pricing, and cap-table disclosure that proves the current mark can be defended with downside
              protection.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV009
              - CV014
              - CV015
