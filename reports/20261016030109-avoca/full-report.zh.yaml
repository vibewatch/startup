              - CP016
      - number: '3.3'
        title: 持久性取决于专业厂商或在位者谁先补上相邻缺口
        blocks:
          - type: paragraph
            body: >-
              当高呼入量、以 ServiceTitan 为中心的工作流，以及管理层对辅导和外呼培育的需求同时存在时，Avoca 的护城河最强，而不只是接电话。在这一细分中，深度预约回写，加上 Coach
              和跟进自动化，比通用接听层更有价值。但替代风险依然真实存在。全渠道套件可以从上方进攻，掌握更多客户旅程；ServiceTitan 和 Housecall Pro
              等原生系统则可以从下方进攻，把语音和营销功能并入已经掌握派单、开票和客户记录的平台。现有资料并未证明 Avoca 已经在合规、定价或流失上建立足以阻止任一侧缩小差距的优势。
