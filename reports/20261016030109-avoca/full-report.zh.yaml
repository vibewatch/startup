              - CM009
      - number: '2.3'
        title: 买方、用户与付费方都围绕呼叫中心经济性收敛
        blocks:
          - type: paragraph
            body: >-
              Avoca 的采用路径似乎经过负责电话转化、非工作时段覆盖和报价跟进的运营负责人，而不是纯 IT 预算。用户通常是需要处理溢出、提供 24/7 覆盖或接受绩效辅导的 CSR
              或调度职能；付费方则是能感受到漏接电话和未跟进报价对损益影响的老板、GM 或联络中心负责人。这解释了 ServiceTitan
              集成为何如此重要：产品不只是对话层，而是承诺在目标承包商已经使用的运营系统中闭合预约链路。因此，买方更偏向复杂到足以证明工作流集成和衡量价值的运营商，但又没有复杂到把问题变成购买通用联络中心平台。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM013
      - number: '2.4'
        title: 采用驱动因素很明显；采用约束尚未形成清晰基准
        blocks:
          - type: paragraph
            body: >-
              需求驱动因素符合经济直觉：如果电话处理决定预约量，那么非工作时段覆盖、溢出响应和自动报价跟进，解决的都是收入损失，而不只是人工成本。这让高通话量承包商觉得该类别很有吸引力。约束则没那么清楚。公司撰写的材料强调成本、隐私和集成复杂度对小型运营商的影响；外部评审则认为部署需要数周，并且要仔细调校品牌语气和
              ServiceTitan 配置。相比之下，ServiceTitan
              市场页面称大多数客户在两周内即可上线。问题不在市场吸引力，而在公开证据尚未厘清实施时长、定价透明度，以及“上线”与“完全优化”部署的边界。这些缺口很关键：它们决定产品能多快从缓解漏接电话，走向整个系统的前台标准化。
            claimRefs:
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 支出切口足够痛，能为专业软件提供预算
            body: Avoca 不需要替换全部家政服务软件才有价值；只要挽回足够多的漏接电话和未跟进报价，超过人工接听成本，并证明销售驱动型软件合同合理即可。
            calloutType: insight
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
          - type: callout
            title: 公开证据仍未充分描述真实 SAM 和实施曲线
            body: 投资人能看到大致类别和目标买方画像，但公开来源仍未披露干净的自下而上市场规模、透明的定价表，或各次部署经调和后的价值实现时间。
            calloutType: risk
            claimRefs:
              - CM007
              - CM009
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合横跨叠加层、套件和原生业务记录系统
        blocks:
          - type: paragraph
            body: >-
              Avoca 面对的是一个分散的决策集合，而不是清晰的一对一类别。直接同业是 Broccoli AI 和 Sameday AI
              等语音优先叠加层；保留的对比来源将它们描述为接入现场服务系统、以预约为中心的产品。第二类把生命周期做宽来竞争：Hatch
              将自己定位为覆盖线索响应、预约管理、报价跟进和再次触达的语音、短信、邮件及网页自动化；Podium 则从消息、评价和支付切入。第三类把整个技术栈收进业务记录系统：ServiceTitan 和 Housecall
              Pro 已经掌握排班、客户数据及相邻通信工作流。也就是说，买方实际是在三种模式中选择：语音专业叠加层、更广泛的通信自动化，或具备足够 AI、能让叠加层变得多余的原生现场服务软件。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
