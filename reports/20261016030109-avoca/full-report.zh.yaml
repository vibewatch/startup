      - number: '4.3'
        title: 成本结构与单位经济性限制
        blocks:
          - type: paragraph
            body: >-
              公开来源暗示，Avoca 的成本基础比纯自助 SaaS 更重。其价值依赖深度 CRM/FSM 集成、工作流调校，以及一定程度的人工升级或辅导支持；独立评审反复提到上线按周而非按天计算，并称产品更适合已经运行
              ServiceTitan 或 Housecall Pro 的运营商。这可能支撑较高 ACV，但也意味着实施人工和服务交付开销会影响毛利率。本次资料从未披露
              CAC、回本周期、毛利率拆分或营运资金需求，因此单位经济性表格主要是一张尽调地图，而不是完整模型。
            claimRefs:
              - CI004
