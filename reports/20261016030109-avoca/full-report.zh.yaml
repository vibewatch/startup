  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Avoca 变现的是家政服务前台技术栈，而不是单一接听小组件。独立评审一致将其描述为三个模块——负责呼入接听和预约的 Convert、负责外呼报价挽回和需求生成的 Nurture，以及负责 CSR
              评分的 Coach——靠演示和询价的企业销售流程，而不是自助 SKU 销售。这种设置支持以 ServiceTitan
              为中心的运营商支付更高合同金额，但公开证据仍只能停留在估算区间，无法确认实际定价、折扣或收入确认政策。收入机制容易理解，收入结构却尚未能建模。
