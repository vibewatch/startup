            title: 最强的公开信号是工作流深度，而非泛化 AI 广度
            body: 从官方材料、B 轮公告和 ServiceTitan 市场页面来看，Avoca 始终呈现为一层与实时预约、外呼挽回和 CSR 绩效管理相连的垂直一体化家政服务工作流，而不是通用语音包装层。
