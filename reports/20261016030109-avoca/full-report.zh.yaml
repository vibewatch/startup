  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 确切 ARR 已接近“八位数”的上沿，留存强劲，且向首批服务垂直领域之外扩张不会稀释产品深度或利润率。
        - 只有软件式经济性让当前倍数快速压缩，今天的 $1B 估值才可能继续复合增长为有吸引力的后续入场点。
        - 新垂直领域执行失误；交付环节隐藏着服务人力。
        - 需要尽调证明 NRR/GRR 高、毛利率强、现金消耗高效，且股权结构表干净。
      - - 基准
        - 业务牵引是真实的，但公开证据仍局限于头条融资、精选客户成果和不透明的合同经济性。
        - 最好的做法是跟踪而非追高：等待确切经济数据或更好的价格，让投资判断建立在验证结果而非叙事上。
        - 经济性尚未验证就支付过高价格；AI 市场情绪降温导致倍数压缩；上线复杂度拖累运营。
        - 与当前公开记录最为吻合。
      - - 悲观
        - ARR 更接近“八位数”的下沿，上线和人工转接的复杂性压低利润率，未来融资会重置 AI 倍数。
        - 以 $1B 入场的下行保护很弱，风险回报重新平衡前可能还要经历平价轮或下行轮。
        - 增长放缓、流失上升，或清算优先权使新资金处于次位。
        - 如果尽调显示队列经济性弱，或优先股堆叠不利于投资者，这一情景的权重会增加。
    notes: 由于当前资料池提供的是融资估值和里程碑锚点，而不是完整运营模型或干净的公私可比公司集合，情景框架有意保持定性。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV009
      - CV010
      - CV014
      - CV015
