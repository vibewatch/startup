      - number: '8.3'
        title: 情景框架与可比视角
        blocks:
          - type: paragraph
            body: >-
              公开证据支持基于里程碑的情景分析，而不是伪精确的可比公司模型。本次资料中可用的估值锚点包括实际融资价格、已披露但不精确的 ARR 里程碑、传统接听服务工作流的经济替代方案，以及 Avoca
              能提高预约率或整合联络中心开销的部分证明。这足以围绕一个问题构建乐观、基准和悲观情景：企业是否已经接近“八位数”ARR
              的高端，并拥有持久的软件经济性，还是当前估值跑在证明之前。它不足以精确支持目标回报、持有期或退出倍数，因此情景纪律必须来自里程碑阈值，而不是假装缺失变量已知的表格。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
