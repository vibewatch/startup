      - number: '5.2'
        title: 架构、集成与部署模式
        blocks:
          - type: paragraph
            body: >-
              最清晰的架构主线是：Avoca 位于呼入需求渠道与承包商业务记录系统之间，再把结果写回运营软件。公司页面和独立评审反复提到判断、路由和预约逻辑；ServiceTitan 市场则进一步描述了直接 API 集成：借助
              AdCap 拉取最新数据，并把工单预约写回 ServiceTitan。这是一项更强的运营层面主张，比只捕捉意向、随后把工作交还人工的通用语音机器人更有分量。

              与此同时，现有材料没有把平台描述成能覆盖所有边缘案例的全自动系统。公开材料仍将人工升级、实施主导的培训和客户成功支持列为运营模式的一部分。产品交付并非纯软件：买方购买的还包括工作流设计、脚本调校、升级规则和集成设置。技术越能处理复杂运营，价值越大；但价值实现速度取决于
              Avoca 与客户现有 FSM 和呼叫中心流程的匹配程度。
