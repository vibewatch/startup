chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与运营范围
        blocks:
          - type: paragraph
            body: >-
              Avoca 当前的公开定位很清楚，但基本成立信息仍不完整。公司称自己是“服务企业的 AI 劳动力”，官方材料也始终将其描述为一套前台自动化系统：处理呼入电话、外呼唤回和营销活动工作流，并辅导人工
              CSR。最新官方融资公告还确认总部位于纽约市、在圣巴巴拉设有第二办公室，并将公司描述为一家正在从家政服务扩展到相邻服务类别的 B
              轮后企业。公司控制的来源中明显缺少成立日期、当前员工人数和官方客户数分母，因此后续章节应把这些数字视为待尽调事项，而不是已经确定的事实。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO003
              - CO005
              - CO006
              - CO007
      - number: '1.2'
        title: 创始人、管理层可见度与治理缺口
        blocks:
          - type: paragraph
            body: >-
              公开信息足以确认创始人，但不足以评估更完整的管理团队。现有公开来源一致将 Tyson Chen 和 Apurva Shrivastava 列为 Avoca 联合创始人；Avoca 的创始人简介文章还交代了
              Chen 如何形成创业判断：自动驾驶系统经验和早期聊天机器人部署经历，让他相信，重语音的服务工作流比通用 SMB
              软件更适合作为切入口。除此之外，公开信息就很薄弱了。在本次资料范围内，没有公开的董事会名单、公开的控制权摘要，也没有管理层增补或离任的带日期叙述，因此创始人周围存在实质性的关键人集中风险。
            claimRefs:
              - CO008
              - CO009
          - type: table
            tableRef: TO002
            claimRefs:
              - CO008
              - CO009
      - number: '1.3'
        title: 融资、投资人、平台锚点与公开可支持的规模
        blocks:
          - type: paragraph
            body: >-
              本章最强的当前证据集中在融资和商业相关性上。Avoca 2026 年 4 月的公告经 Pulse 2.0 佐证，称公司累计融资超过 $125M、估值为 $1B；Meritech 和 General
              Catalyst 领投 B 轮，Kleiner Perkins 领投 A 轮。同一公告称，Avoca 2025 年 ARR 已超过八位数，并计划在 2026 年促成 $1B
              的工单交易，但这些仍是公司提供的运营信号，而非独立审计的收入披露。ServiceTitan 是最清晰的生态锚点：其市场页面称 Avoca 通过 API 将预约直接写回
              ServiceTitan，产品价值因此落在具体的业务记录系统上，而不是孤立的语音机器人。
            claimRefs:
