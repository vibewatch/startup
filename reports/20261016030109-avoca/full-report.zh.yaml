  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              最强证据将 Avoca 的市场界定为依赖电话的服务企业前台自动化，而不是全栈现场服务软件平台。公司公开定位和第三方分类都把切入口落在家政服务中的呼入接听、排班、跟进和 CSR 生产力，尤其是
              HVAC、管道和电气承包商。这一点很重要，因为相关替代集合比“所有家政服务软件”窄得多：现状仍是语音信箱、人工接听服务或内部接待；相邻但不同的类别则包括完整的现场服务管理、派单、技师工作流和通用全渠道支持。管理层明确表示希望扩展到其他服务垂直领域，但当前商业滩头仍是家政服务，因此任何从企业
              AI 或全部 SMB 软件出发的市场表述，都不足以用于估值。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
      - number: '2.2'
        title: 多种规模化视角支持切入口论点，但无法得出干净的公开 SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              公开证据支持几种有用的规模化视角，但没有一种能独立得出站得住脚的自下而上 SAM 或 SOM。最宽泛的视角是管理层提出的“$1T+
              服务经济”，方向上有帮助，但过于自上而下，无法支撑投资判断。更具投资价值的视角来自目标客户的复杂度：外部评审一致将 Avoca 归入数百万美元规模的运营商，这些企业拥有专门的 CSR
              团队、可观的通话量，以及直接的 CRM 或 ServiceTitan 工作流。预算基准也指向一个具体的支出切口：人工接听服务和内部接待构成现有成本基线，而第三方估算认为 Avoca
              的软件支出层级明显更高，因此需要证明挽回收入带来的 ROI，而不能只做劳动力套利。这足以勾勒机会，但若没有内部客户数、ACV 或细分渗透数据，仍不足以量化公开 SAM/SOM。
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
