            body: 最强的公开证明不是通用 AI 能力，而是工作流闭环：直接预约进 ServiceTitan、报价跟进，以及围绕预约结果的 QA 辅导。如果部署质量真实，这种组合比独立 AI 接听层更能创造切换价值。
