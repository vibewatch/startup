              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              看多逻辑很直接：Avoca 似乎在解决一个痛苦、电话优先的工作流，漏接电话会直接摧毁收入；公司案例研究和第三方评论都显示，产品部署到位时，预约捕获明显更好。融资轮也可视为外部验证，说明投资人相信垂直 AI
              语音代理能比横向工具捕获更多价值。反向论点同样清楚：证据集仍严重依赖公司控制的证明点，公开定价不透明，第三方持续指出上线摩擦和复杂通话处理局限。这种组合支持关注，但不足以在披露估值下采取激进的投资判断。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV002
