            body: >-
              最强的公开牵引力代理指标是工作流产出，而不是 GAAP 财务数据。公司发布的客户案例称，Aire Serv 将非工作时段预约从 58 次提升至 208 次；Granite Comfort 则称 Avoca
              将九个呼叫中心合并为一个，并帮助试点品牌依靠挽回的来电让收入同比增长 20%。2026 年 4 月的新闻稿还称，Avoca 2025 年 ARR 已超过八位数，并计划在 2026 年促成 $1B
              工单交易，但这些是公司挑选的产出，而非经审计的收入披露。合在一起，它们说明需求和转化提升确实存在，却无法说明 logo 流失、队列留存或各工作流的贡献利润率。
