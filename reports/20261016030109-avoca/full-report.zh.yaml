        title: 缓释措施、终止标准与尽调路径
        blocks:
          - type: paragraph
            body: >-
              Avoca 确有可见的缓释因素：合作伙伴验证的 API
              集成、人工介入兜底、专门的客户成功支持、具名平台合作关系，以及足以持续投入产品和市场拓展的资本。这些因素足以支持继续尽调，而不是直接否定公司。但如果尽调无法验证合规的外呼同意流程、站得住脚的通话录音与保留控制、稳定的高峰月单位经济性，以及
              ServiceTitan 集中度究竟是优势而非单点依赖，投资论点就应当失效。实际最干净的下一步不是再找营销证明，而是获取运营商层面的错误率、例外处理、合同条款和平台集中度证据。
            claimRefs:
              - CR002
              - CR003
              - CR008
              - CR011
              - CR012
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              Avoca 达到了“认真公司”的门槛，但还没有达到“按今天的价格买入”的门槛。融资信号非常突出：公司发布的 2026 年春季材料称，Avoca 已融资超过 $125M，估值为
              $1B，Meritech、General Catalyst 和 Kleiner Perkins 领投已披露轮次，同时称公司 2025 年 ARR 已超过八位数。同一记录还称，Avoca 计划在 2026 年促成
              $1B 工单交易，并已通过 ServiceTitan、Nexstar 和 Clover 获得可识别的生态分销。这些都是真实的证明点，但还不是完整的估值桥接。公开来源仍缺少确切
              ARR、增长、留存、毛利率、烧钱速度、债务或清算优先权披露，因此入场决策必须对价格保持敏感、以尽调为主，而不是以叙事为主。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
              - CV015
