      - number: '3.2'
        title: Avoca 的优势在工作流深度，但包装不透明压窄了受众
        blocks:
          - type: paragraph
            body: >-
              公开证据仍将 Avoca 描述为企业级采购，而不是自助工具。多份 2026 年第三方评审称，定价需询价，主要按分钟计费，没有公开的分层方案或试用路径；同一批评审也将产品定位在更大型、以 ServiceTitan
              为核心的运营商，而不是小型门店。这个包装很重要，因为市场两端都有替代方案。基础人工接听服务或内部接待便宜得多，但自动化能力明显更弱；另一端的一体化替代方案则主打同时替换 AI 前台和底层现场服务栈。Avoca
              通过分销部分抵消了这种风险：保留来源反复提到它与 ServiceTitan、Nexstar 和 Clover 的合作，使它能触达最直接感受漏接电话痛点的买方。
            claimRefs:
              - CP003
              - CP004
              - CP005
