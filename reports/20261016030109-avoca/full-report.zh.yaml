              - CV009
              - CV010
              - CV014
              - CV015
      - number: '8.4'
        title: 退出准备度、尽调问题与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              从叙事上看，Avoca 具备退出可能性，但还不能靠公开证据完成投资判断。它拥有可识别的投资人、生态伙伴和品类认知度；如果增长质量保持，未来可能吸引新的赞助方或战略买家。但在开支票之前，尽调应聚焦按队列拆分的确切
              ARR 和增长、续约行为、软件与人工介入运营之间的毛利率拆分、实施负担、真实合同定价，以及完整的优先股堆叠。如果尽调显示 ARR
              接近八位数低端、服务负担大量进入毛利率、实施后流失率高，或资本结构让新资金过度劣后，投资论点会迅速失效。在这些问题解决前，正确姿态是跟踪，而不是追高。
            claimRefs:
              - CV003
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开结论
            body: 跟踪 Avoca，而不是按当前估值买入：公司看起来是真实的，但公共记录仍过于单薄，无法有把握地为 $1B 估值完成投资判断。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV014
              - CV015
          - type: callout
            title: 释放可投资入场点的条件
            body: 最快的升级路径不是再增加一个叙事证明点，而是披露确切 ARR、留存、毛利率、烧钱速度、定价和资本结构，证明当前估值有下行保护、可以守住。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV009
              - CV014
              - CV015
