              - CI010
              - CI015
      - number: '4.4'
        title: 资本充足性与结论
        blocks:
          - type: paragraph
            body: >-
              资本获取是最清晰的公开财务事实：Avoca 在 2026 年 4 月宣布融资超过 $125M，估值为 $1B，这笔资金很可能消除了短期融资压力。但公开材料没有披露现金余额、烧钱速度、现金
              runway、债务工具、契约约束或下一轮融资触发条件。结果呈现出一种熟悉的后期 AI 模式：外部融资强劲、商业验证可信，但公开数据不足以评估收入质量、利润率路径或资本效率。从财务角度看，Avoca
              是一个潜力很高、但仍依赖私有数据的尽调案例，而不是一家仅凭公开证据就能完成投资判断的企业。
            claimRefs:
              - CI011
              - CI012
