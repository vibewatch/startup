      - number: '5.4'
        title: 信任、安全与产品尽调风险
        blocks:
          - type: paragraph
            body: >-
              最大的公开尽调缺口，不是 Avoca 是否有清晰的产品故事，而是运营和合规说法是否有一手材料支撑。本次资料池包含关于 SOC 2
              的二手引用，以及若干关于通话录音、客户路由和营销活动执行的表述，但没有信任中心、认证函、保留政策、同意流程或正常运行时间历史，投资人无法据此独立检验安全、隐私或受监管外呼实践。对于一个位于电话、短信和 CRM
              工作流之上的系统，这个证明缺口很重要。

              第二个风险是实施差异。公开来源都认为，平台对拥有真实通话量的规模化运营商最有吸引力，但对达到生产级质量需要多少工作，来源之间存在分歧。如果真实运营模式依赖数周调校、ServiceTitan
              专属设置和人工例外处理，那么 Avoca 的一部分护城河可能来自服务和合作伙伴协同，而不只是模型性能。这并非致命问题，但尽调应转向部署参考、错误预约率、错误率、逐渠道范围和合规控制，而不是照单全收营销说法。
            claimRefs:
              - CE008
              - CE010
              - CE011
              - CE012
              - CE013
