        - year: 2026
          label: 扩张论点超出核心家居服务
          detail: Avoca 称计划拓展到搬家、垃圾清运、汽车服务和物业管理。
          tone: opportunity
          claimRefs:
            - CO014
    approximationNotes: 现有资料没有更完整的 2025 年前上线时间线，因此时间线从目前可找到的最早公开日期锚点起算。
    claimRefs:
      - CO003
      - CO005
      - CO006
      - CO011
      - CO014
      - CO015
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 公开证据支持围绕电话驱动型家居服务运营商构建分层切入口，但不足以形成干净的自下而上 SAM/SOM。
    data:
      nodes:
        - label: 广义服务经济
          value: 1000
          unit: $B+
          detail: PRNewswire 将背景描述为“$1T+ 服务经济”。
          claimRefs:
            - CM007
        - label: 当前垂直切入口
          detail: 家居服务是当前重点，也是数字化程度偏低的市场。
          claimRefs:
            - CM002
            - CM007
        - label: 目标运营商规模
          value: 3
          unit: $M+ revenue
          detail: 外部评测认为，最匹配的买家是营收达数百万美元的运营商。
          claimRefs:
            - CM005
        - label: 团队复杂度
          value: 5
          unit: + CSRs
          detail: 竞争对手资料称，目标买家通常有 5+ 名 CSR，通话量也很可观。
          claimRefs:
            - CM005
        - label: 当前软件支出视角
          value: 15
          unit: $k+ ACV
          detail: 第三方估算从约 $15k/year 起，大型运营商的支出会高出不少。
          claimRefs:
            - CM009
        - label: 现状成本基准
          value: 30
          unit: $k receptionist
          detail: 人工替代方案既包括实时接听服务，也包括完整的内部接待团队。
          claimRefs:
            - CM008
    approximationNotes: 公开证据只支持切入口框架，无法直接相加成 TAM/SAM/SOM 体系；因此各层混合了品类规模、运营商规模和支出基准。
    claimRefs:
      - CM007
      - CM009
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 横轴衡量工作流控制 / 记录系统所有权，纵轴衡量初始通话之外的生命周期覆盖广度；这是根据保留的来源描述绘制的序数视图，不是厂商报告的基准。
    data:
      points:
        - label: Avoca
          x: 4
          'y': 3
          note: 深度回写 ServiceTitan，支持出站培育和辅导，但还不是完整 FSM。
          claimRefs:
            - CP001
            - CP002
            - CP003
        - label: Hatch
          x: 3
          'y': 5
          note: 在列出的覆盖层中，保留的多渠道及生命周期覆盖最广。
          claimRefs:
            - CP006
            - CP007
        - label: Broccoli AI
          x: 4
          'y': 2
          note: 语音优先的预约专家，通话后的覆盖范围较窄。
          claimRefs:
            - CP008
        - label: Sameday AI
          x: 4
          'y': 2
          note: 电话优先的替代方案，集成多个 FSM，但能证明的生命周期覆盖有限。
          claimRefs:
            - CP008
        - label: Podium
          x: 2
          'y': 4
          note: 客户消息和支付覆盖广，但现场服务工作流控制较弱。
          claimRefs:
            - CP009
        - label: Housecall Pro
          x: 5
          'y': 3
          note: 原生记录系统替代方案，内置 AI，但并非能证明多渠道覆盖最广的一层。
          claimRefs:
            - CP010
        - label: ServiceTitan
          x: 5
          'y': 4
          note: 原生工作流所有者，具备市场平台杠杆，AI / 营销功能也在扩张。
          claimRefs:
            - CP010
            - CP014
    approximationNotes: 两条轴都采用作者设定的 1（低）至 5（高）序数分数，依据是保留的功能证据，不代表厂商发布的基准值、实测表现或推断的转化率。
    claimRefs:
      - CP003
      - CP010
      - CP014
      - CP015
  - id: FI001
    title: 收入模型桥接
    type: flow
    summary: 公开证据显示，Avoca 把漏接电话需求转成已预约工作和辅导数据，但收入如何转成利润率仍未披露。
    data:
      nodes:
        - label: 电话优先需求
          displayValue: Missed calls and after-hours overflow
          detail: 公开评测把入站电话需求视为家居服务的经济入口。
          tone: neutral
        - label: 转化预约层
          displayValue: AI answers and books into FSM / CRM
          detail: 直接在工作流中预约并捕获通话，是核心变现环节。
          tone: positive
        - label: 培育跟进
          displayValue: Unsold-estimate and reactivation campaigns
          detail: 出站语音 / SMS 把变现延伸到首次入站互动之后。
          tone: positive
        - label: 辅导分析
          displayValue: CSR scoring and feedback loops
          detail: 通话数据还被用于辅导运营商，不只是拦截或分流。
          tone: positive
        - label: 可衡量的工作流产出
          displayValue: Aire Serv 58 → 208 after-hours bookings; 41% plan signup
          detail: 公开客户故事强调已预约工作和注册量，不是经审计的收入。
          tone: positive
        - label: 财务转换
          displayValue: Revenue quality and gross margin remain undisclosed
          detail: 确切 ARR、实际定价、CAC、现金消耗和现金跑道仍要靠私下尽调确认。
          tone: risk
    approximationNotes: 该流程展示公开的运营步骤和已披露的结果代理指标，不是经审计的转化率或隐含利润率计算。
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI010
      - CI012
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据指向一套分层前台架构：捕获需求、筛选需求、预约进 FSM 系统，再由人工处理例外并调优。
    data:
      layers:
        - label: 客户需求渠道
          items:
            - 入站语音通话
            - 文本消息 / SMS
            - 网页咨询 / 在线聊天
            - Google LSA、Angi 和 Thumbtack 等线索来源
          outputs:
            - 捕获需求，避免语音信箱积压
        - label: AI 前台模块
          items:
            - Convert / 入站 AI CSR
            - 培育型出站跟进
            - Coach QA 分析
          modules:
            - 资格筛选与路由
            - 预约 / 改期
            - 估价单追回
            - 通话评分
          outputs:
            - 已预约工作、回拨、辅导信号
        - label: 记录系统
          items:
            - ServiceTitan
            - Housecall Pro / 其他 FSM 工具
            - CRM / 调度看板
          modules:
            - ServiceTitan API + AdCap 预约
            - 客户记录更新
          outputs:
            - 将预约和工作流状态回写运营系统
        - label: 收入编排输入
          items:
            - 尚未成交的估价单
            - 陈旧线索
            - 季节性活动
          outputs:
            - 出站跟进列表和优先回拨
        - label: 绩效分析
          items:
            - 预约率仪表盘
            - 漏接电话追回
            - 代表评分卡
          outputs:
            - ROI 跟踪和辅导可见性
        - label: 人工监督
          items:
            - 人工介入的 CSR 覆盖
            - 实施团队
            - 客户成功经理
          modules:
            - 例外处理
            - 脚本调优
            - 绩效复盘
          outputs:
            - 解决升级事项，持续打磨工作流
    approximationNotes: 这是根据公开证据还原的运营层，不是厂商真实的架构图或 API 定义。
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE010
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Avoca 的公开客户故事从捕获漏接电话起步，延伸到预约、跟进和呼叫中心优化。
    data:
      items:
        - label: 从电话、短信和网页捕获线索
          actor: 潜在客户 / 房主
          channel: 语音、SMS、网页聊天
          touchpoints:
            - 24/7 响应承诺
            - 不让任何咨询石沉大海
        - label: AI 资格筛选与路由
          actor: Avoca AI CSR
          channel: 语音对话和路由逻辑
          touchpoints:
            - 自然语言通话处理
            - 高价值线索优先路由
        - label: 将工作预约写入 CRM 工作流
          actor: 调度员 / 运营团队
          channel: ServiceTitan API 和 CRM 同步
          touchpoints:
            - 直接在 ServiceTitan 中预约工作
            - 无需人工重复录入即可更新记录
        - label: 非工作时间和风暴需求追回
          actor: 呼叫中心经理
          channel: AI 优先并支持人工升级
          touchpoints:
            - 捕获夜间需求
            - 边缘情况交由人工介入
        - label: 估价单跟进与培育扩张
          actor: 收入 / 营销负责人
          channel: 出站通话和活动
          touchpoints:
            - 激活未成交估价单
            - 运行出站活动
        - label: 多地点部署与辅导
          actor: 企业运营商
          channel: 分析和 CSR 辅导
          touchpoints:
            - 多品牌部署支持
            - 为每位代表的每通电话评分并辅导
    approximationNotes: 这是根据保留的产品和合作伙伴描述整理出的定性工作流图，展示公开的扩张路径，不是阶段间的实测转化率。
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU011
      - CU013
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的残余风险来自集中的平台依赖、不透明的经济性，以及未经验证的合规控制。
    data:
      columns:
        - label: 可能性
        - label: 影响
        - label: 缓解措施成熟度
        - label: 残余暴露
      rows:
        - label: ServiceTitan 集中度
          values:
            - label: 中高
              tone: high
            - label: 高
              tone: critical
            - label: 部分
              tone: medium
            - label: 高
              tone: critical
          note: 最深的集成既是商业优势，也带来依赖。
        - label: 出站同意 / 隐私
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: critical
            - label: 部分
              tone: medium
            - label: 高
              tone: high
          note: 公开证据确认工作流覆盖面广，却未确认控制体系。
        - label: 峰值月份经济性
          values:
            - label: 高
              tone: high
            - label: 中高
              tone: high
            - label: 部分
              tone: medium
            - label: 中高
              tone: high
          note: 按分钟计费的估算，偏偏在通话量激增时制造预算不确定性。
        - label: 实施拖累
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 部分
              tone: medium
            - label: 中
              tone: medium
          note: 公开来源对部署速度和所需变革管理意见不一。
        - label: 独立验证稀缺
          values:
            - label: 中
              tone: medium
            - label: 中
              tone: medium
            - label: 低至部分
              tone: warning
            - label: 中
              tone: medium
          note: 虽有具名案例，公开的第三方客户证据仍然薄弱。
        - label: 可靠性 / 边缘情况处理
          values:
            - label: 中
              tone: medium
            - label: 高
              tone: high
            - label: 部分
              tone: medium
            - label: 中高
              tone: high
          note: 能看到 HITL，但缺少广泛的公开正常运行时间证据。
    approximationNotes: 热力图单元格是分析师根据所引公开证据作出的综合判断，总结有证据支持的暴露，不是经审计的损失频率。
    claimRefs:
      - CR001
      - CR005
      - CR006
      - CR008
      - CR010
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持跟踪：市场和客户确有验证，但在当前 $1B 估值下，公开估值桥接异常薄弱。
    data:
      nodes:
        - label: 漏接电话痛点巨大
          detail: 传统接听服务和 CSR 工作流成本高昂，还经常漏接攸关收入的电话。
        - label: 产品已有验证
          detail: Avoca 引用客户收入增长、预约改善和多品牌部署。
        - label: 外部验证强
          detail: 公司在顶级投资者支持下，以 $1B 估值融资超过 $125M。
        - label: 公开经济性仍薄弱
          detail: 确切 ARR、留存、毛利率、现金消耗、定价和优先权条款都未公开。
        - label: 执行风险持续存在
          detail: 第三方仍指出上线摩擦，以及复杂通话处理、延迟和共情能力的局限。
        - label: 建议维持跟踪
          detail: 只有完成更深入的尽调，或拿到明显更好的入场价格、收窄下行空间后，才重新评估。
    approximationNotes: 有序序列反映估值逻辑，不是节点之间的实测转化率。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV014
      - CV015
