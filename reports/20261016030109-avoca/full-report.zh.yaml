  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 立场
      - 论点
      - 哪些信息会改变判断
    rows:
      - - 正方
        - Avoca 在 Meritech、General Catalyst 和 Kleiner Perkins 参与下，以 $1B 估值融资超过 $125M，说明投资者对其垂直 AI 赛道有较强信心。
        - 如果轮次条款干净、没有过重的优先权，且后续投资者需求仍然强劲，这一判断会进一步增强。
      - - 正方
        - 2026 年春季材料称，Avoca 的 2025 年 ARR 已超过八位数，并有望在 2026 年促成 $1B 的工作订单；对一个年轻的垂直 AI 平台而言，这是有分量的商业验证。
        - 如果确切 ARR、增长、NRR/GRR 和毛利率数据显示出可持续的软件经济性，而不是实施服务占比过重，这一判断将明显上调。
      - - 正方
        - 客户案例表明，Avoca 能整合联络中心工作流，并追回运营商过去因漏接或处理不佳的电话而损失的收入。
        - 如果多份第三方案例在不同客户和地区复现同样结果，这一判断会大幅增强。
      - - 反方
        - 公开估值依据很薄弱：$1B 的头条估值只配有模糊的“八位数” ARR 披露，隐含倍数区间因此很宽。
        - 披露确切 ARR 和增长数据，可能把区间收窄到足以支持可投资的入场点。
      - - 反方
        - 公开定价和合同条款不透明，投资者无法核实 ACV、回本周期、服务收入占比，或实施服务密集型部署的下行风险。
        - 一份订单样本、队列回本分析和续约数据可以降低这项不确定性。
      - - 反方
        - 第三方评论仍将上线时间、复杂通话处理、延迟和共情能力列为真实的运营约束。
        - 如果尽调显示部署后的流失率低、扩张率高，且人工介入带来的劳动力拖累很小，这项担忧会缓解。
    notes: 每行都把有证据支撑的论点，与会改变投资判断的具体补充证据或价格变化配对。
