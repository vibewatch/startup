  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与目标工作流
        blocks:
          - type: paragraph
            body: >-
              Avoca
              的公开产品面向家政服务承包商打造，而不是横向联络中心。公司和第三方描述反复提到的待办事项包括：接听漏接或非工作时段电话、判断工单、直接写入现场服务工作流进行预约，以及跟进未成交需求。这个聚焦点很关键，因为公司卖的是面向电话优先运营商的工作流压缩，而不是覆盖所有渠道或垂直行业的通用支持套件。

              本次资料中可见的模块组合已经不止于单一 AI 接待员。呼入语音仍是核心，但公开产品页面还描述了外呼报价挽回、唤回活动、人工 CSR 辅导，以及部分网页或短信接入。实际效果是，Avoca
              试图从首次接触、预约到报价后的挽回，掌握承包商的整个前台；集成和脚本调校到位时，这会提高切换价值，但相较窄版接听服务替代方案，也会扩大实施范围。
