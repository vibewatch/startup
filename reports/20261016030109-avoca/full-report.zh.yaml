        title: 带日期的里程碑与本次刷新特有的风险
        blocks:
          - type: paragraph
            body: >-
              从本次资料池可以稳妥确认的时间线，只能从加速器或市场进入阶段开始；到 2025 年末和 2026 年才明显丰富。外部评审将 Avoca 认定为 YC W23 公司；Avoca 自己的案例材料则指向 2025
              年末在 Granite Comfort 品牌中的企业级上线，以及平台接听电话后让 Yost & Campbell 收入同比提升 20%。2026 年的融资公告提供了最大几项里程碑：独角兽估值、作为 2025
