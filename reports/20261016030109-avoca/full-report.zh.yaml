      - number: '5.3'
        title: 差异化与成熟度信号
        blocks:
          - type: paragraph
            body: >-
              Avoca 最强的差异化信号，是在家政服务工作流上的深度，而不是通用对话式 AI 的广度。多个来源收敛到同一套组合：垂直电话脚本、以 ServiceTitan 为中心的直接预约、外呼报价跟进，以及面向人工 CSR
              的辅导分析。产品逻辑很连贯：先解决漏接电话和跟进薄弱造成的收入流失，再用分析强化同一动作，而不是止步于把电话转给人工。

              成熟度信号不错，但并不干净。ServiceTitan 市场页面和多份评审都显示，Avoca
              有真实部署经验、支持多地点，并具备有意义的自动化率，说明它已超越演示软件阶段。但跨渠道范围和上线时长尚未在各来源之间清晰调和。官方材料营销的是广泛全渠道覆盖，至少有一份评审却仍将产品描述为语音优先，SMS
              是主要次级渠道。同样，市场页面称客户通常两周内上线，但独立报告称上线需要数周，这两者也存在张力。
            claimRefs:
              - CE005
