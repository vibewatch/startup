company:
  name: Avoca
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Avoca's current market is narrower than a generic "vertical AI" narrative: the evidence points
    to a phone-first front-office automation wedge inside home services, centered on inbound call
    capture, booking, estimate follow-up, and CSR coaching. Public sources support a clear
    mid-market buyer profile and ROI benchmark versus human answering costs, but they do not expose
    a defensible public SAM/SOM, and implementation timing remains contradictory across sources.
sections:
  - id: market-boundary
    title: Market boundary and status-quo alternatives
    body: >-
      The strongest evidence defines Avoca's market as front-office automation for phone-dependent
      service businesses rather than as a full-stack field-service software platform. Public company
      positioning and third-party categorization both anchor the wedge around inbound call capture,
      scheduling, follow-up, and CSR productivity in home services, especially HVAC, plumbing, and
      electrical contractors. That matters because the relevant substitution set is narrower than
      "all home-services software": the status quo is still voicemail, live answering services, or
      in-house reception, while the adjacent but distinct categories include full field-service
      management, dispatch, technician workflow, and generalized omnichannel support. Management is
      explicit that the company wants to expand into other service verticals, but the current
      commercial beachhead remains home services, so any market statement that starts with
      enterprise AI or all SMB software would be too broad for valuation work.
    claimRefs: [CM001, CM002, CM003, CM008, CM014]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses support a wedge thesis, not a clean public SAM/SOM
    body: >-
      Public evidence supports several useful sizing lenses, but none of them independently yields a
      defensible bottom-up SAM or SOM. The broadest lens is management's framing of a "$1T+ services
      economy," which is directionally helpful but too top-down for underwriting. A more investable
      lens comes from target-customer complexity: external reviews consistently place Avoca with
      several-million-dollar operators that have dedicated CSR teams, meaningful call volume, and
      direct CRM or ServiceTitan workflows. Budget benchmarks also point to a specific spend wedge:
      live answering services and in-house reception establish the incumbent cost baseline, while
      third-party estimates put Avoca at a materially higher software spend tier that requires a
      recovered-revenue ROI case rather than a pure labor-arbitrage pitch. That is enough to frame
      the opportunity, but not enough to quantify a public SAM/SOM without internal customer-count,
      ACV, or segment-penetration data.
    claimRefs: [CM005, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-map
    title: Buyer, user, and payer converge around call-center economics
    body: >-
      Avoca's adoption path appears to run through operations leaders who own call conversion,
      after-hours coverage, and estimate follow-up rather than through pure IT budgets. The user is
      usually the CSR or dispatch function that needs overflow handling, 24/7 coverage, or
      performance coaching, while the payer is the owner, GM, or contact-center leader who feels
      the P&L impact of missed calls and unworked estimates. This helps explain why ServiceTitan
      integration matters so much: the product is not just a conversational layer, it promises to
      close the booking loop inside the operating system already used by the target contractor. The
      buyer map therefore skews toward operators with enough complexity to justify workflow
      integration and measurement, but not so much omnichannel sprawl that the problem becomes a
      general contact-center platform purchase.
    claimRefs: [CM003, CM005, CM006, CM013]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Adoption drivers are obvious; adoption constraints are not yet cleanly benchmarked
    body: >-
      The demand drivers are economically intuitive: if phone handling determines booking volume,
      then after-hours coverage, overflow response, and automated estimate follow-up all attack lost
      revenue rather than only labor cost. That makes the category compelling for high-call-volume
      contractors. The constraint side is less settled. Company-authored material highlights cost,
      privacy, and integration complexity for smaller operators, while external reviews argue that
      deployment takes weeks and requires careful tuning of brand voice and ServiceTitan
      configurations. Against that, the ServiceTitan marketplace says most customers are live within
      two weeks. The implication is not that the market is unattractive; it is that public evidence
      has not yet normalized implementation duration, pricing transparency, or the boundary between
      "go live" and "fully optimized" deployment. Those gaps matter because they govern how quickly
      the product can move from missed-call relief into system-wide front-office standardization.
    claimRefs: [CM004, CM010, CM011, CM012, CM013]
