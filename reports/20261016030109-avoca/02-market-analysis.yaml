    claimRefs: [CM007, CM009]
callouts:
  - calloutType: insight
    title: The spend wedge is painful enough to fund specialized software
    body: >-
      Avoca does not need to replace all home-services software to matter; it only needs to recover
      enough missed calls and unworked estimates to beat human answering costs and justify a
      sales-led software contract.
    claimRefs: [CM003, CM004, CM008, CM009]
  - calloutType: risk
    title: Public evidence still underspecifies the real SAM and implementation curve
    body: >-
      Investors can see the broad category and the target buyer profile, but public sources still do
      not expose a clean bottom-up market size, transparent pricing schedule, or reconciled time to
      value across deployments.
    claimRefs: [CM007, CM009, CM011, CM012]
