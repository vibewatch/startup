schemaVersion: report-v2
artifact: financials
slug: avoca
runDate: '2026-10-16'
company:
  name: Avoca
chapter:
  number: 4
  title: Financials
  summary: Public evidence shows Avoca selling a high-touch, workflow-automation stack with real customer conversion proof and fresh capital access, but not enough disclosed pricing, margin, or cash data to underwrite revenue quality. The clearest public signals are booked-job lift and enterprise go-to-market fit rather than transparent unit economics.
sections:
  - id: revenue-model-and-monetization
    title: Revenue model and monetization
    body: Public evidence shows Avoca monetizing a home-services front-office stack rather than a single answering widget. Independent reviews consistently describe three modules—Convert for inbound answering and booking, Nurture for outbound estimate recovery and demand generation, and Coach for CSR scoring—sold through a demo-and-quote enterprise process rather than a self-serve SKU. That setup supports higher contract values for ServiceTitan-centered operators, but it also means public evidence stops at estimated ranges rather than realized pricing, discounts, or recognition policy. For underwriting, the revenue mechanism is understandable, but the revenue mix is not yet modelable.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI013
      - CI014
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-proxies-and-operating-leverage
    title: Traction proxies and operating leverage
    body: The strongest public traction proxies are workflow outputs rather than GAAP financials. Company-published customer stories claim Aire Serv lifted after-hours bookings from 58 to 208 while Granite Comfort said Avoca consolidated nine call centers into one and helped a pilot brand grow revenue 20% year over year from recovered calls. The April 2026 press release adds that Avoca surpassed eight figures of ARR in 2025 and is on track to book $1 billion of jobs in 2026, but those are company-selected outputs rather than audited revenue disclosures. Together they suggest real demand and conversion lift, yet they do not reveal logo churn, cohort retention, or contribution margin by workflow.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
    tableRefs:
      - TI003
  - id: cost-structure-and-unit-economics-limits
    title: Cost structure and unit-economics limits
    body: Public sources imply a cost base heavier than pure self-serve SaaS. Avoca’s value depends on deep CRM/FSM integration, workflow tuning, and some human escalation or coaching support; independent reviews repeatedly cite onboarding measured in weeks, not days, and better fit for operators already running ServiceTitan or Housecall Pro. That likely supports strong ACVs but also means implementation labor and service-delivery overhead matter to gross margin. The assigned evidence never publishes CAC, payback, gross margin split, or working-capital needs, so the unit-economics table is mostly a diligence map rather than a completed model.
    claimRefs:
      - CI004
      - CI009
      - CI010
      - CI015
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and verdict
    body: >-
      Capital access is the cleanest public financial fact: Avoca announced more
      than $125 million raised at a $1 billion valuation in April 2026, and
      that capital likely removes immediate financing pressure. Still, public
      materials do not disclose cash on hand, burn, runway, debt facilities,
      covenant constraints, or the trigger for the next round. The result is a
      familiar late-stage AI pattern: strong external financing and credible
      commercial proof, but not enough public data to underwrite revenue
      quality, margin path, or capital efficiency. Financially, Avoca reads as
      a high-potential but still private-data-dependent diligence case rather
      than a business that can be underwritten from public evidence alone.
    claimRefs:
      - CI011
      - CI012
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Inbound AI answering and booking
        - Convert answers inbound calls and writes bookings into FSM/CRM workflows
        - AI-handled calls / booked jobs
        - Core public product surface; 24/7 call coverage and booking are repeatedly described
        - Mechanism is clear, realized monetization is not
        - Break out revenue share, gross margin, and attach rate by module
      - - Outbound nurture and estimate recovery
        - Nurture follows up unsold estimates, reactivates dormant demand, and runs campaign workflows
        - Campaign usage / booked jobs
        - Publicly marketed and frequently cited in reviews, but no standalone pricing disclosed
        - Commercial role is visible, pricing is opaque
        - Provide module pricing, conversion uplift, and renewal contribution
      - - CSR coaching analytics
        - Coach scores human CSR calls and feeds training feedback into operations
        - Module ACV / seats undisclosed
        - Differentiator in public reviews; no separate contract terms disclosed
        - Value proposition is clear, revenue contribution is not
        - Disclose Coach attach rate, upsell path, and retention impact
      - - Implementation and workflow tuning
        - Sales-led onboarding, integration, and tuning appear necessary before full deployment
        - Services / onboarding fees undisclosed
        - Public process is visible, revenue-recognition treatment is not
        - Potentially meaningful to margins and deferred revenue
        - Disclose services mix, onboarding fees, and recognition policy
    notes: Public sources describe modules and workflows but do not disclose revenue mix, realization, or recognition policy; “unknown” means not published in the assigned evidence.
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI013
      - CI015
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Pricing item
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Public Avoca list price
        - None published; enterprise demo-and-quote sale
        - No public list pricing or self-serve checkout
        - Minimum term, discounting, and free-trial posture are undisclosed
        - ToolStack; AICXStack; Thareja
      - - Independent mid-market estimate
        - ~$1,000–$3,000 per month or ~$15,000–$60,000 per year
        - Third-party estimate only, not company-published pricing
        - Estimate basis varies by call volume, module mix, and operator scale
        - ToolStack; AICXStack
      - - Independent enterprise estimate
        - ~$2,500–$3,500+ per month for larger multi-location operators
        - Third-party estimate only, likely heavily negotiated
        - Usage terms, overage logic, and contract minimums remain unknown
        - AICXStack; Thareja
      - - Legacy answering-service benchmark
        - ~$150–$500 per month or ~$0.90–$1.50 per minute for human coverage
        - Category benchmark, not Avoca realized pricing
        - Not apples-to-apples with Avoca’s broader workflow stack
        - Avoca answering-service guide
    notes: Avoca does not publish pricing; quoted values here are third-party estimates or category benchmarks and must not be treated as realized contract pricing.
    claimRefs:
      - CI002
      - CI003
      - CI009
      - CI010
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Public ARR disclosure
        - Eight figures ARR in 2025
        - Medium
        - Shows commercialization, but not enough precision for valuation work
        - Provide exact ARR, growth rate, and definition of recurring revenue
      - - Workflow throughput
        - On track to book $1B of jobs in 2026
        - Medium
        - Shows top-of-funnel influence, not Avoca revenue take rate
        - Reconcile booked-job GMV to Avoca revenue and gross profit
      - - After-hours conversion proof
        - 'Aire Serv: 58 → 208 after-hours bookings; 41% eligible-caller plan signup'
        - Medium
        - Evidence that the product can move conversion and recurring-service attachment
        - Show broader cohort before/after data and variance by customer size
      - - Labor / operating leverage proxy
        - 'Granite: nine call centers to one; Yost & Campbell +20% YoY revenue from recovered calls'
        - Medium
        - Suggests labor leverage and revenue recovery if deployment works
        - Quantify cost savings, staffing effect, and incremental gross profit
      - - Gross margin / CAC payback
        - null
        - Low
        - Core underwriting metric missing from public evidence
        - Provide software vs services gross margin, CAC, payback, GRR, and NRR
      - - Cash burn / runway / debt
        - null
        - Low
        - Determines capital adequacy and financing dependency
        - Provide cash balance, monthly burn, runway, debt facilities, and covenants
    notes: Null values mark unit-economics inputs absent from the assigned public evidence, not zeros.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI011
      - CI012
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows Avoca converting missed-call demand into booked jobs and coaching data, while the revenue-to-margin step remains undisclosed.
    data:
      nodes:
        - label: Phone-first demand
          displayValue: Missed calls and after-hours overflow
          detail: Public reviews describe inbound phone demand as the economic entry point in home services.
          tone: neutral
        - label: Convert booking layer
          displayValue: AI answers and books into FSM / CRM
          detail: Direct workflow booking and call capture are the core monetization surface.
          tone: positive
        - label: Nurture follow-up
          displayValue: Unsold-estimate and reactivation campaigns
          detail: Outbound voice / SMS extends monetization beyond the first inbound interaction.
          tone: positive
        - label: Coach analytics
          displayValue: CSR scoring and feedback loops
          detail: Call data is repurposed into operator coaching rather than pure deflection.
          tone: positive
        - label: Measured workflow outputs
          displayValue: Aire Serv 58 → 208 after-hours bookings; 41% plan signup
          detail: Public customer stories emphasize booked jobs and signups, not audited revenue.
          tone: positive
        - label: Financial conversion
          displayValue: Revenue quality and gross margin remain undisclosed
          detail: Exact ARR, realized pricing, CAC, burn, and runway still require private diligence.
          tone: risk
    approximationNotes: The flow shows public operating steps and disclosed outcome proxies, not audited conversion rates or implied margin math.
    claimRefs:
      - CI001
      - CI004
      - CI005
      - CI010
      - CI012
      - CI014
callouts:
  - calloutType: insight
    title: The clearest public value signal is workflow conversion, not reported revenue detail
    body: Named customer stories repeatedly frame Avoca as a missed-call recovery and after-hours booking engine, suggesting the immediate ROI case is operational leverage rather than transparent public software metrics.
    claimRefs:
      - CI005
      - CI006
      - CI008
  - calloutType: risk
    title: Capital adequacy still depends on private-company disclosure
    body: The public record shows fresh financing and strong commercial momentum, but it still omits realized pricing, gross margin, burn, runway, debt, and customer concentration—the inputs needed to underwrite a $1 billion private valuation.
    claimRefs:
      - CI003
      - CI011
      - CI012
