            - Update records without manual re-entry
        - label: After-hours and storm-demand recovery
          actor: Call-center manager
          channel: AI-first with human escalation
          touchpoints:
            - Capture overnight demand
            - Human-in-the-loop for edge cases
        - label: Estimate follow-up and nurture expansion
          actor: Revenue / marketing owner
          channel: Outbound calls and campaigns
          touchpoints:
            - Revive unsold estimates
            - Run outbound campaigns
        - label: Multi-location rollout and coaching
          actor: Enterprise operator
          channel: Analytics and CSR coaching
          touchpoints:
            - Multi-brand deployment support
            - Score and coach every rep on every call
    approximationNotes: >-
      This is a qualitative workflow map assembled from retained product and partner descriptions;
      it shows the public expansion path, not measured conversion rates between stages.
    claimRefs: [CU003, CU004, CU005, CU011, CU013]
callouts:
  - calloutType: strength
    title: Real production references exist, but they are curated
    body: >-
      Avoca is beyond anonymous logo-walling: named operators recur across 2026 sources, and
      partner-hosted testimonials add specific operational use cases. The tradeoff is that most
      proof still comes through company or partner distribution rather than independent customer
      reviews or audited case studies.
    claimRefs: [CU009, CU011, CU012, CU013, CU014]
  - calloutType: risk
    title: Durability remains the core diligence gap
    body: >-
      Public sources support adoption and workflow fit, but they do not disclose the metrics that
      matter for customer quality: NRR, GRR, churn, renewal timing, or concentration by top
      account and partner channel. That keeps the chapter in proof-of-use rather than proof-of-
      durability territory.
    claimRefs: [CU008, CU015, CU016]
