      diligencePath: Request customer cohort tables, renewal dashboards, and sample MSAs or order forms showing term lengths and expansion motion by account.
      relatedQuestionRefs: [QU008]
    - type: conflicting-data
      severity: material
      topic: customer-count-gap
      missingEvidence: A reconciled current denominator for paying customers, live logos, locations, and service leaders.
      whyItMatters: Public adoption claims range from 800-plus customers to 1000-plus service leaders, which is directionally positive but insufficient for precise underwriting.
      diligencePath: Ask management for a dated customer-count bridge separating paying accounts, active locations, and referenceable logos.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU002, TU003]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Quantified top-customer exposure, partner-channel dependence, and the share of booked demand tied to ServiceTitan or other key integrations.
      whyItMatters: Expansion value may be strong, but concentration and channel dependence can materially change durability and bargaining power.
      diligencePath: Request revenue concentration tables, channel-attribution data, and customer counts segmented by CRM or partner ecosystem.
      relatedQuestionRefs: [QU009]
    - type: missing-source
      severity: minor
      topic: independent-validation
      missingEvidence: Dated independent customer reviews or case studies with named operators, deployment scope, and outcome baselines.
      whyItMatters: Most current proof is company- or partner-mediated, which limits confidence in product satisfaction and repeatability across the install base.
      diligencePath: Collect G2, Capterra, conference-talk, and procurement references that identify customers, time period, and measured outcomes.
