      - Strategic value / gap
    rows:
      - [HVAC / plumbing / electrical contractors, Operations or revenue leader, CSR-dispatch teams / operator budget, 24/7 inbound call answering and job booking, "Avoca and partner surfaces repeatedly frame the product around home-service operators and missed-call recovery.", "Core wedge is clear; no public split by sub-vertical or ACV."]
      - [Multi-location enterprise home-services groups, Central operations leader, Shared-service call center / enterprise operator, Standardized call handling across brands and locations, "ServiceTitan says Avoca supports multi-brand and multi-location rollouts; named operators include Sila Services and Turnpoint.", "Enterprise fit is visible, but deployment depth by logo is not disclosed."]
      - [ServiceTitan-led operators, Ops or call-center management, Dispatch / CRM owner, Direct API booking and workflow sync, "ServiceTitan marketplace says Avoca integrates directly with ServiceTitan via API and books jobs back into ServiceTitan.", "Integration is a strength; dependence on partner ecosystems is not quantified."]
      - [Adjacent service verticals beyond home services, GM or operator, Local-service front office / operator budget, Voice and workflow automation for phone-heavy service businesses, "Whiteford and 2026 funding coverage cite expansion beyond home services into moving, junk removal, automotive, and property management.", "Expansion story is credible, but current revenue mix by vertical is absent."]
    notes: >-
      Public segmentation is inferred from company, partner, and secondary descriptions; nulls
      would indicate undisclosed economics, but each row here reflects only what was explicitly
      supported in the retained sources.
    claimRefs: [CU001, CU002, CU003, CU004, CU009]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - [Customer footprint, 800+ customers, "2026", BigAIAgent, medium, "Shows meaningful installed-base adoption for a young vertical AI vendor.", "Not reconciled to paying accounts, active locations, or logos still live."]
      - [Customer footprint, 1000+ service leaders, "2026", Whiteford Research summary, medium, "Suggests broader customer reach than the narrower 800+ claim.", "Could reflect contacts or leaders rather than active paying customers."]
      - [Named operator roster, "Turnpoint / 1-800-GOT-JUNK? / Goettl", "2026-04-27", "PR Newswire + Pulse 2", high, "Shows Avoca can cite recognizable operators rather than only anonymous case studies.", "No deployment scope, seat count, or spend per account."]
      - [Platform throughput claim, "$1B in jobs on track in 2026", "2026-04-27", "PR Newswire + Pulse 2", medium, "Implies substantial workflow volume if accurate.", "Company-issued metric; no third-party audit or take-rate context."]
      - [Implementation speed, "Most customers are live within 2 weeks", unknown, ServiceTitan Marketplace, medium, "Suggests onboarding can be operationally manageable post-sale.", "No cohort size, exception rate, or definition of live."]
      - [Independent review density, "No reviews yet", "2026", "G2 AI Marketplace", medium, "Public peer-review surface is still thin despite broader awareness.", "One marketplace page is not a full review-base census."]
    notes: >-
      This table mixes company-originated scale claims with partner and secondary summaries; the
      strongest signal is trajectory, not an audited customer or revenue denominator.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - [Sila Services, Multi-location HVAC/plumbing/electrical operator, "AI-assisted booking and after-hours demand capture", Production reference, "CTO said booking rates jumped dramatically and after-hours demand capture increased.", "Outcome is testimonial-based; no baseline, period, or numerator disclosed."]
      - [H.L. Bowman, Regional HVAC and plumbing contractor, "Named operator reference in funding coverage", Production reference, "Owner said Avoca is the first name people mention when AI comes up in the industry.", "Brand strength quote, not a quantified operating result."]
      - [Turnpoint, Multi-brand home-services operator, "Named customer / operator using Avoca", Production reference, "Appears repeatedly across company-issued and secondary 2026 coverage.", "No public implementation scope, module mix, or ROI data."]
      - [Goettl, Large HVAC operator, "Named customer / operator using Avoca", Production reference, "Appears repeatedly across company-issued and secondary 2026 coverage.", "No public evidence of contract duration, expansion history, or measured output."]
    notes: >-
      Enumeration is partial, not exhaustive: it captures the public named references that recur
      across retained sources as of the run date, rather than a full customer roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named Avoca customer references repeated across retained 2026 company, partner,
        and secondary sources; not a complete install-base census.
    claimRefs: [CU009, CU011]
