company:
  name: Avoca
chapter:
  number: 5
  title: Product & Technology
  summary: 'Avoca publicly presents a vertical AI front office for home-service operators: inbound voice booking, outbound follow-up, and CSR coaching tied most tightly to ServiceTitan-centric workflows. The public surface suggests meaningful workflow depth and partner validation, but channel breadth, deployment time-to-value, and security/compliance proof remain only partially corroborated.'
sections:
  - id: product-surface
    title: Product surface and target workflow
    body: 'Avoca''s public product surface is purpose-built for home-service contractors rather than horizontal contact centers. Across company and third-party descriptions, the recurring jobs-to-be-done are answering missed or after-hours calls, qualifying the job, booking directly into a field-service workflow, and following up on unsold demand. That focus matters because the company is selling workflow compression for phone-first operators, not a general support suite for every channel or vertical.


      The module mix visible in the assigned evidence is already broader than a single AI receptionist. Inbound voice remains the anchor, but the public surfaces also describe outbound estimate recovery, reactivation campaigns, coaching for human CSRs, and some web or text intake. The practical implication is that Avoca is trying to own the contractor front office from first contact through booking and post-quote recovery, which increases switching value when the integrations and scripts are tuned well, but also raises implementation scope versus a narrow answering-service substitute.'
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE007
    tableRefs:
      - TE001
      - TE002
    figureRefs:
      - FE001
  - id: architecture-and-deployment
    title: Architecture, integrations, and deployment model
    body: 'The clearest architectural through-line is that Avoca sits between inbound demand channels and the contractor''s system of record, then writes the outcome back into operational software. Company pages and independent reviews repeatedly point to qualification, routing, and booking logic, while the ServiceTitan marketplace goes further by describing a direct API integration that pulls current data via AdCap and books jobs back into ServiceTitan. That is a stronger operational claim than a generic voice bot that only captures intent and hands the rest back to humans.


      At the same time, the platform is not presented as fully autonomous across every edge case. Public materials still describe human escalation, implementation-led training, and customer-success support as part of the operating model. That implies a services-and-configuration layer around the product: buyers are not only purchasing software, but also workflow design, script tuning, escalation rules, and integration setup. The technology can therefore be valuable precisely where operations are complex, but time-to-value depends on how well Avoca maps to the customer''s existing FSM and call-center processes.'
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE009
      - CE010
      - CE011
    tableRefs:
      - TE003
  - id: differentiation-and-maturity
    title: Differentiation and maturity signals
    body: 'Avoca''s strongest differentiation signal is depth in the home-services workflow instead of generic conversational AI breadth. Several sources converge on the same package: vertical call scripts, direct ServiceTitan-centered booking, outbound estimate follow-up, and coaching analytics for human CSRs. That is a coherent product thesis because it attacks revenue leakage from missed calls and weak follow-up, then reinforces the same motion with analytics rather than stopping at call deflection.


      Maturity signals are good but not clean. ServiceTitan''s marketplace and multiple reviews indicate real deployment experience, multi-location support, and meaningful automation rates, which suggests Avoca is beyond demo-ware. But channel scope and onboarding duration are not yet crisply reconciled across sources. Official materials market broad omnichannel coverage, while at least one review still frames the product as voice-first with SMS as the main secondary channel. Likewise, marketplace claims that customers are typically live within two weeks sit uneasily beside independent reports of multi-week onboarding.'
    claimRefs:
      - CE005
      - CE007
      - CE009
      - CE010
      - CE011
      - CE012
  - id: trust-and-risks
    title: Trust, security, and product diligence risks
    body: 'The most material public diligence gap is not whether Avoca has a clear product story; it is whether the operational and compliance claims are backed by primary artifacts. The assigned pool contains secondary references to SOC 2 and several statements about handling call recordings, customer routing, and campaign execution, but it does not include a trust center, certification letter, retention policy, consent workflow, or uptime history that would let an investor independently test security, privacy, or regulated outbound practices. For a system sitting on phone, text, and CRM workflows, that missing proof is material.


      The second risk is implementation variance. Public sources agree that the platform is most compelling for scaled operators with real call volume, but they disagree on how much work it takes to reach production quality. If the true operating model depends on weeks of tuning, ServiceTitan-specific setup, and manual exception handling, then part of Avoca''s moat may come from services and partner alignment as much as from model performance. That is not fatal, but it pushes diligence toward deployment references, false-booking/error rates, channel-by-channel scope, and compliance controls rather than taking marketing claims at face value.'
    claimRefs:
      - CE008
      - CE010
      - CE011
      - CE012
      - CE013
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Publicly visible scope
      - Current maturity / status
      - Differentiation / dependency
      - Diligence gap
    rows:
      - - Convert / inbound AI CSR
        - CSR / dispatcher
        - Answers inbound calls 24/7, qualifies jobs, books or reschedules
        - Clearly current across official and third-party sources
        - Vertical scripts plus direct FSM booking; strongest where ServiceTitan workflow matters
        - Need audited false-booking, abandonment, and escalation rates by customer cohort
      - - Nurture / outbound follow-up
        - Revenue ops / marketing
        - Runs estimate follow-up, aged-lead recovery, and maintenance or reactivation campaigns
        - Current, but described mostly by company and review surfaces rather than hard benchmarks
        - Extends platform from call handling into demand recovery; depends on CRM and consent workflows
        - Need conversion lift, opt-out handling, and TCPA/FCC control evidence
      - - Coach / CSR analytics
        - Ops manager / call-center lead
        - Records, scores, and coaches human CSR calls against booking outcomes
        - Current and differentiated, but methodology is not public
        - Closed-loop improvement between AI handling and human training
        - Need rubric transparency, QA accuracy evidence, and privacy/retention controls for recordings
      - - Web / text intake layer
        - Front-office manager / dispatcher
        - Texts, web inquiries, and some chat or web scheduling alongside voice
        - Publicly visible but scope is inconsistently described across sources
        - Can widen capture beyond phone, but exact channel depth is still unclear
        - Need SKU-level product map confirming chat, email, social, and web-scheduler boundaries
    notes: Mixes company, partner, and review evidence; maturity labels reflect what is publicly corroborated, not customer-wide deployment prevalence.
    claimRefs:
      - CE002
      - CE003
      - CE006
      - CE007
      - CE009
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow pain
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - - After-hours inbound demand
        - Voicemail, missed calls, or outsourced answering after office hours
        - AI CSR answers and books calls continuously
        - 24/7 coverage; partner source says Avoca handles 80%+ of inbound calls without human intervention
        - Complex or emotional calls still escalate to humans
      - - Peak-volume overflow
        - Busy lines and long hold times during storms or morning spikes
        - Overflow routing, qualification, and direct booking into FSM
        - Calls are answered during periods that overwhelm front-desk staff; review sources frame this as captured revenue rather than voicemail backlog
        - Performance depends on tuned scripts and correct business rules
      - - Unsold estimates and aged leads
        - Manual callbacks are inconsistent and revenue leaks after the first quote
        - Outbound voice/SMS campaigns re-engage old estimates and lapsed demand
        - Platform can follow up on outstanding estimates and recover lost jobs
        - Public pool lacks primary evidence on consent controls and sustained campaign ROI
      - - CSR performance management
        - Manual call review is slow and inconsistent
        - Coach scores calls and highlights missed opportunities
        - Managers reduce QA effort and get booking-rate visibility tied to rep behavior
        - Scoring model and benchmark methodology are not publicly documented
    notes: Benefit cells preserve only publicly stated outcomes or directional claims; missing denominator, benchmarking, and compliance proof stay explicit limitations.
    claimRefs:
      - CE002
      - CE004
      - CE006
      - CE007
      - CE010
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Evidence of implementation
      - Dependency
      - Risk
    rows:
      - - Channel ingress
        - Capture calls plus at least some text, web, and lead-source traffic
        - Official pages describe phone, text, chat, and web inquiries; reviews consistently confirm voice and SMS
        - Telephony routing, website hooks, lead-source connectors
        - Public sources disagree on exact omnichannel breadth
      - - Qualification and routing engine
        - Collect job details, triage urgency, and escalate when needed
        - Official and review sources describe address/trade/urgency logic and human handoff
        - Customer scripts, service-area rules, and exception logic
        - Nuanced, emotional, or unusual service requests can still break automation
      - - Booking and FSM integration
        - Write jobs into dispatch software and reflect live capacity
        - ServiceTitan marketplace cites direct API + AdCap booking into ServiceTitan; reviews add Housecall Pro and other FSMs
        - ServiceTitan depth appears highest; alternative connectors may be shallower
        - Value concentration around ServiceTitan ecosystem raises dependency risk
      - - Human oversight and success layer
        - Implementation, monitoring, edge-case coverage, and customer support
        - Marketplace cites dedicated CSM support, implementation help, and a human-in-the-loop backstop
        - Pro-services capacity and customer operational maturity
        - Time-to-value varies materially across public sources
    notes: Architecture is reconstructed from public workflow descriptions; absent API docs, uptime records, or trust-center material remain diligence gaps rather than inferred capabilities.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE010
      - CE011
      - CE012
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence points to a layered front-office stack that captures demand, qualifies it, books into FSM systems, and keeps humans in the loop for exceptions and tuning.
    data:
      layers:
        - label: Customer demand channels
          items:
            - Inbound voice calls
            - Texts / SMS
            - Web inquiries / live chat
            - Lead sources such as Google LSA, Angi, and Thumbtack
          outputs:
            - Demand captured without voicemail backlog
        - label: AI front-office modules
          items:
            - Convert / inbound AI CSR
            - Nurture outbound follow-up
            - Coach QA analytics
          modules:
            - Qualification and routing
            - Booking / rescheduling
            - Estimate recovery
            - Call scoring
          outputs:
            - Booked jobs, callbacks, and coaching signals
        - label: Systems of record
          items:
            - ServiceTitan
            - Housecall Pro / other FSM tools
            - CRM / dispatch board
          modules:
            - ServiceTitan API + AdCap booking
            - Customer record updates
          outputs:
            - Appointments and workflow state written back to ops systems
        - label: Revenue orchestration inputs
          items:
            - Unsold estimates
            - Aged leads
            - Seasonal campaigns
          outputs:
            - Outbound follow-up lists and prioritized callbacks
        - label: Performance analytics
          items:
            - Booking-rate dashboard
            - Missed-call recovery
            - Rep scorecards
          outputs:
            - ROI tracking and coaching visibility
        - label: Human oversight
          items:
            - Human-in-the-loop CSR coverage
            - Implementation team
            - Customer Success Manager
          modules:
            - Exception handling
            - Script tuning
            - Performance reviews
          outputs:
            - Escalations resolved and workflows refined over time
    approximationNotes: This is a public-evidence reconstruction of operating layers, not a literal vendor architecture diagram or API schema.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE010
callouts:
  - calloutType: strength
    title: Depth is concentrated where contractor workflows monetize quickly
    body: 'The strongest public proof is not generic AI capability but workflow closure: direct ServiceTitan booking, estimate follow-up, and QA coaching around booking outcomes. That combination creates more switching value than a standalone AI answering layer if deployment quality is real.'
    claimRefs:
      - CE005
      - CE006
      - CE007
  - calloutType: risk
    title: Public proof is weakest on compliance artifacts and implementation variance
    body: Security claims, outbound-consent controls, and real onboarding duration are not reconciled by primary artifacts in the assigned pool. Those gaps matter because Avoca sits inside recorded calls, texting flows, and customer-system writes rather than at a read-only analytics layer.
    claimRefs:
      - CE008
      - CE010
      - CE012
      - CE013
