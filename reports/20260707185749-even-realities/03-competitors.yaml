  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: channel-economics
      missingEvidence: Exact sell-through, reorder, and attach-rate data across Even's direct web, optician, and retail channels versus peers.
      whyItMatters: Public anecdotes about optician presence do not show whether Even's distribution is durable or economically efficient.
      diligencePath: Request channel mix, regional sell-through, return rate, prescription conversion, and R1 attach-rate data for the last four quarters.
      relatedQuestionRefs:
        - QP024
    - type: missing-source
      severity: material
      topic: partner-leverage
      missingEvidence: Named optical, retail, supplier, and ecosystem partnerships for Even beyond broad public references to retail and opticians.
      whyItMatters: Distribution durability and partner leverage are central to whether Even can defend a narrow privacy-first wedge against giants.
      diligencePath: Ask for signed partner roster, geography by partner, exclusivity terms, and any co-marketing or shelf-placement commitments.
      relatedQuestionRefs:
        - QP025
      relatedTableRefs:
        - TP004
        - TP005
    - type: private-evidence-only
      severity: minor
      topic: active-usage-depth
      missingEvidence: Active app-install, weekly feature usage, and retention data for translation, teleprompting, navigation, and ring control across Even and direct peers.
      whyItMatters: Public reviews show feature breadth and rough edges, but not which workflows truly create habit strength or stickiness.
      diligencePath: Request cohort-level usage, feature retention, and churn reasons segmented by buyer type and geography.
      relatedQuestionRefs:
        - QP024
        - QP025
