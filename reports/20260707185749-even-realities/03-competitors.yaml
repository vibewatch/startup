callouts:
  - calloutType: strength
    title: Privacy-first design is a real wedge, not marketing fluff
    body: >-
      Multiple reviews independently land on the same point: Even's camera-free, subtle design removes a social and workplace trust
      cost that camera-led rivals still carry. That advantage matters most in professional and multilingual communication workflows.
    claimRefs:
      - CP025
      - CP039
  - calloutType: risk
    title: Distribution and ecosystem asymmetry remain the biggest competitive gap
    body: >-
      Even may be better aligned with privacy-sensitive use, but IDC, Android XR, and review evidence all point to a field where giant
      ecosystems and broader channels still matter more than elegant industrial design alone.
    claimRefs:
      - CP035
      - CP036
      - CP041
