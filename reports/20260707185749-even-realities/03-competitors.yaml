  - id: profiles-capabilities-and-pricing
    title: Competitor profiles, capability coverage, and pricing
    body: >-
      The product profiles show a market that splits cleanly by jobs-to-be-done. Ray-Ban Meta is the camera-and-audio incumbent,
      optimized for capture, assistant access, and retail scale rather than private text overlays. XREAL is more spatial-computing and
      giant-screen oriented, often requiring Beam Pro or other compatible devices to unlock the broader experience. Rokid and RayNeo
      overlap most directly with Even on translation, navigation, and teleprompting, but both also keep cameras and broader AR-style
      scope in the product. Brilliant Labs is aiming at curious developers with an open-source Halo platform, while Xiaomi stays on the
      simpler audio-first side of the fence. Pricing reinforces those differences: Even’s $599 base price plus an optional $249 ring is
      premium relative to Meta’s entry pricing, close to Rokid’s $599-$699 class, and below XREAL’s more bundled spatial-computing
      stack. The honest read is that Even is not trying to win on the broadest feature count. It is trying to win on whether buyers
      prefer a quieter, more prescription-friendly display tool over richer but more socially or operationally noisy alternatives.
    claimRefs:
      - CP002
      - CP006
      - CP007
      - CP018
