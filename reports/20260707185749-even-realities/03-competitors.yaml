company:
  name: Even Realities
chapter:
  number: 3
  title: Competitors
  summary: >-
    Even Realities competes in a crowded smart-glasses field where Meta already leads distribution, Android XR is turning Google and
    Samsung into near-term entrants, and Chinese display-first vendors such as XREAL, Rokid, and RayNeo are already shipping broader
    feature sets. Even's camera-free, display-first design is a real trust and professional-use differentiator, but public evidence
    still shows weaker ecosystem depth, lower channel power, and higher displacement risk than the giants and better-capitalized
    platform plays.
sections:
  - id: landscape-and-alternative-classes
    title: Landscape, direct peers, incumbents, and substitutes
    body: >-
      The competitive map is wider than “other smart glasses.” Even sits in a direct-peer ring of display-first glasses that try to
      keep text, prompts, translation, or navigation in the user’s line of sight: XREAL, Rokid, and RayNeo are the clearest current
      examples, while Brilliant Labs is more of a developer-creator adjacent and Vuzix remains an enterprise-oriented reference point.
      Meta’s Ray-Ban line is not display-first, but it is the commercial incumbent because it already proved that fashionable AI
      glasses can sell at scale through established eyewear channels. Android XR matters as the likely next wave because Google and
      Samsung can enter through services, apps, and phone ecosystems rather than through a one-product bet. Substitutes are also real:
      Xiaomi-style audio glasses address calls and media without displays, while many of Even’s practical jobs can still be handled by
      a phone plus earbuds, teleprompter software, translation apps, or ordinary notes. The chapter’s key framing is therefore not
      whether smart glasses exist as a category, but which products solve the same discrete tasks with acceptable trust, comfort,
      ecosystem depth, and distribution reach.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP006
      - CP007
