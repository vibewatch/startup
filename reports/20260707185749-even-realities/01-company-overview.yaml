- id: milestones-distribution-and-risk-signals
  title: Milestones, Distribution, and Risk Signals
  body: 'The public milestone record shows a company executing quickly across product, channels, and positioning. Official 2024 highlights confirm G1 launched in June 2024, appeared at Silmo Paris in September, expanded to G1 B in November, and reached try-on availability in 169 stores across 10 countries by December. By May 2025, management was already discussing roughly 300 top-tier European optician locations, strong direct-web sales, and a roadmap for further releases; by July 2026, external coverage had positioned G2 at $599 and the companion R1 ring at $249. The strategic through-line is clear: Even Realities wants to sell normal-looking prescription-friendly eyewear that happens to carry quiet digital assistance. That differentiates it from camera-led rivals and explains the retail emphasis. But risk signals remain real. Legal commentary still warns that AI smart glasses create consent, surveillance, and data-security issues, so Even''s camera-free architecture and European-data-protection
    messaging reduce risk without eliminating it.'
