  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: headquarters-disclosure
    missingEvidence: An authoritative legal-entity and headquarters map that names the parent, operating entity, and principal office used for management, tax, and compliance purposes.
    whyItMatters: The public record mixes Shenzhen operating descriptions with Hong Kong and Berlin legal entities, which affects jurisdiction, diligence routing, and any later regulatory analysis.
    diligencePath: Request the incorporation stack, principal-office address, and board-approved legal-entity chart used for investor materials and vendor contracting.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: governance-transparency
    missingEvidence: Current board roster, committee structure, executive bench, voting rights, and reserved matters.
    whyItMatters: Key-person risk cannot be underwritten cleanly when the public record exposes the founder but not the governing body or control architecture.
    diligencePath: Request the latest board deck cover, cap-table summary, and organizational chart naming all executives and directors.
    relatedQuestionRefs:
    - QO008
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: capital-disclosure
    missingEvidence: A financing history that reconciles lifetime primary capital, any debt facilities, secondaries, and share-class terms.
    whyItMatters: The unicorn headline is public, but cumulative capitalization and leverage are still too opaque to judge dilution, runway, or liquidation-stack risk.
    diligencePath: Request a financing timeline, debt schedule, and cap-table bridge from founding through the July 2026 pre-Series B.
    relatedQuestionRefs:
    - QO013
    - QO014
    relatedTableRefs:
    - TO001
    - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue or run-rate, gross margin, repeat-purchase data, and a management definition of active customers.
    whyItMatters: Public valuation and hiring momentum have outrun public financial disclosure, so investors cannot benchmark efficiency or hardware economics from open sources alone.
    diligencePath: Request monthly revenue, gross margin, units sold, active users, and customer-mix dashboards for 2025 through mid-2026.
    relatedQuestionRefs:
    - QO021
    - QO025
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: milestone-coverage
    missingEvidence: A full chronology of product, regulatory, and commercial milestones with exact dates rather than selective public highlights and interviews.
    whyItMatters: The chapter can establish the major chronology, but later refreshes will be cleaner if management provides the complete milestone record of launches, channels, and policy updates.
    diligencePath: Request the internal milestone tracker or investor timeline used for board and fundraising materials.
    relatedQuestionRefs:
    - QO015
    - QO016
    - QO024
    relatedTableRefs:
    - TO004
