company:
  name: Even Realities
chapter:
  number: 1
  title: Company Overview
  summary: 'Even Realities is a camera-free, display-first smart-eyewear startup that went from 2023 founding to a reported $150 million pre-Series B at a $1 billion valuation by July 2026. Product and channel evidence is stronger than governance and domicile disclosure: public sources support G1/G2 launch, premium pricing, and early retail reach, but headquarters, board structure, lifetime capital raised, and financial metrics remain incomplete or conflicting.'
sections:
- id: identity-stage-and-business-model
  title: Identity, Product, Stage, and Business Model
  body: 'Even Realities is best understood as a display-first smart-eyewear startup rather than a generic AI gadget brand. Official product pages describe a coherent stack: Even G2 glasses, the Even R1 companion ring, live translation, teleprompting, and Conversate transcription/AI prompts, all designed to keep digital help in the wearer''s line of sight without adding a camera. That product logic matters because it clarifies the business model: premium hardware sold through the company site, supplemented by offline fitting and partner channels, not an advertising or content-capture play. The company also appears to be in an unusually fast early-growth phase. Public reporting places founding in 2023, G1 launch in 2024, G2 launch in late 2025, and a July 2026 pre-Series B at unicorn valuation. The unresolved piece is headquarters identity. Official marketing pages avoid a single HQ line, while news coverage points to Shenzhen and legal pages route obligations through Hong Kong and Berlin
    entities. Later chapters should therefore reuse a cautious identity frame: China-linked, internationally distributed, and not yet cleanly disclosed on domicile.'
