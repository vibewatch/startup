- id: leadership-governance-and-key-person-risk
  title: Leadership, Governance, and Key-Person Risk
  body: Leadership visibility is much better at founder level than at governance level. Multiple 2025-2026 profiles identify Will Wang as founder and CEO and tie him to prior Apple work on the Apple Watch and iPhone, while official company materials emphasize broader team experience from Apple, Samsung, Philips, Mykita, and Lindberg. The company also highlights collaboration with Dr. Qu Jia and an ophthalmology team, suggesting that optical and medical credibility are deliberate parts of the brand story. That gives Even Realities stronger founder-market fit than a typical consumer-hardware startup, because the public record spans supply chain, optics, industrial design, and prescription-eyewear considerations. The downside is concentration and opacity. Reviewed sources do not publish a board roster, independent-director structure, or deeper executive bench, and they do not surface material leadership changes either. Investors should read that less as proof of clean continuity and more as
    a reminder that key-person dependence on Wang remains high while governance disclosure lags product disclosure.
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
