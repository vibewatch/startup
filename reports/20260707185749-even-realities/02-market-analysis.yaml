callouts:
  - calloutType: insight
    title: Even's best-supported market frame is private text-in-view productivity, not generic AR
    body: >-
      The strongest public evidence does not show Even winning because it offers the broadest feature set. It shows Even
      narrowing the category to private translation, teleprompting, and discreet prompts for people who want less phone
      checking and less camera friction.
    claimRefs:
      - CM002
      - CM013
      - CM014
      - CM021
      - CM024
      - CM025
  - calloutType: risk
    title: Public demand evidence is strong enough for a thesis, not yet strong enough for a precise capture model
    body: >-
      Category growth is well supported, but the public record still lacks a vendor-neutral SAM, enterprise budget proof,
      and Even-specific conversion evidence. That means valuation should lean on market direction and product fit more
      than on exact public share math.
    claimRefs:
      - CM008
      - CM009
      - CM011
      - CM026
      - CM039
      - CM040
