  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sam-gap
      missingEvidence: A vendor-neutral SAM or SOM estimate for camera-free, professional, text-in-view smart glasses.
      whyItMatters: Broad category TAM does not tell investors how much of the market Even can realistically target or win.
      diligencePath: Request management's segmentation model, paid conversion by workflow, and any internal TAM/SAM work broken out by geography and use case.
      relatedQuestionRefs:
        - QM023
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: enterprise-gap
      missingEvidence: Even-specific enterprise pipeline, case studies, budget owner details, and conversion or renewal data.
      whyItMatters: The enterprise motion could materially expand market size, but current public evidence only proves a form, not real procurement traction.
      diligencePath: Ask for enterprise customer references, pilot-to-rollout conversion metrics, and procurement owners by segment.
      relatedQuestionRefs:
        - QM024
      relatedTableRefs:
        - TM003
    - type: conflicting-data
      severity: material
      topic: contradictory-estimates
      missingEvidence: One transparent, methodology-rich 2026 market-size series that cleanly separates audio, camera, and display glasses.
      whyItMatters: Conflicting public TAM figures can overstate or understate the investable opportunity if treated as interchangeable.
      diligencePath: Reconcile analyst methodologies directly, or source a full paid report set before using TAM math in valuation work.
      relatedQuestionRefs:
        - QM007
        - QM025
      relatedTableRefs:
        - TM002
