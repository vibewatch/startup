      Even sits inside a much narrower wedge than the broad 2026 smart-glasses headlines suggest: public evidence ranges
      from multi-billion-dollar category forecasts to a still-unquantified professional display-glasses niche.
    data:
      items:
        - label: 'Broad smart-glasses TAM lens: $7.5B-$12.5B in 2026'
