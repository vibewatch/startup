  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Platform investment from Android XR, Meta, and Chinese vendors
        - driver
        - Current through 2030
        - More platform and marketing spend should expand category awareness and normalize the form factor
        - Test whether awareness converts into demand for camera-free products or mainly helps capture-led rivals
      - - Better optics, lighter frames, and prescription support
        - driver
        - Current
        - Improves wearability and makes daily-use scenarios more plausible
        - Request Even retention and repeat-use data by prescription versus non-prescription buyers
      - - Translation and teleprompting as repeat-use jobs
        - driver
        - Current
        - Gives the category concrete weekly workflows instead of novelty-only appeal
        - Validate how often these features actually drive repeat sessions and paid conversion
      - - Privacy-sensitive settings and trust concerns
        - mixed
        - Current
        - Favors camera-free designs in some settings while still leaving microphone and transcription concerns
        - Ask for enterprise policy objections won or lost because of privacy posture
      - - Price and accessory burden
        - constraint
        - Current
        - Premium hardware pricing narrows the buyer pool and can keep smart glasses in early-adopter budgets
        - Measure conversion at $599 alone versus bundled use with the optional ring
      - - Companion-device dependence
        - constraint
        - Current
        - Many workflows still rely on a paired phone, reducing replacement value versus a smartphone
        - Request data on daily active usage with and without heavy phone interaction
      - - Reliability, fit, and app-depth gaps
        - constraint
        - Current
        - Early-adopter products stall if sunlight readability, navigation, or AI accuracy stay inconsistent
        - Review churn reasons, return rates, and feature-level satisfaction
      - - Category history of hype and failed enterprise platforms
        - constraint
        - Persistent
        - Historical disappointments such as Google Glass Enterprise make enterprise buyers more skeptical
        - Assess what proof Even has that this cycle is more durable than past waves
    notes: >-
      The category's upside and downside are tightly linked: the same features that create excitement can also create
      trust, usability, and procurement friction.
    claimRefs:
      - CM018
      - CM023
      - CM029
      - CM030
      - CM031
      - CM032
      - CM033
      - CM034
      - CM037
