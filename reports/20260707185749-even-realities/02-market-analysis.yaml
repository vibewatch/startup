  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Presenters, founders, and meeting-heavy professionals
        - Individual professional or team lead
        - Speaker, presenter, manager, or executive
        - Personal purchase or professional-development spend
        - Teleprompting, live captions, prompts, and private notes
        - Individual discretionary budget; sometimes team tools budget
        - Repeated public speaking or high-stakes meeting load
      - - Multilingual professionals and international travelers
        - Individual buyer or employer for travel-heavy role
        - Traveler, sales lead, operator, or cross-border manager
        - Self-pay, travel budget, or departmental tools budget
        - Translation, signage help, and real-time conversation support
        - Personal electronics or travel-enablement budget
        - Frequent language friction in meetings or trips
      - - Early-adopter knowledge workers seeking less phone checking
        - Individual self-serve buyer
        - Daily productivity user
        - Personal premium hardware budget
        - Notifications, glanceable prompts, reminders, and navigation
        - Individual discretionary budget
        - Desire for private text in view without camera/social friction
      - - Enterprise or institutional teams
        - Operations, training, or innovation lead
        - Team members in meetings, training, or guided workflows
        - Employer procurement if a deployment advances
        - Bulk purchase, team rollout, policy-controlled usage
        - Departmental tools or pilot budget
        - Need for hands-free prompts plus comfort with privacy posture
      - - Optical / retail channel influenced buyers
        - Optical partner or retail salesperson influences decision
        - Prescription wearer and fashion-sensitive user
        - Consumer end payer
        - Fitting, prescription conversion, and trial before purchase
        - Buyer wallet, enabled by channel trust
        - Need for normal-looking, prescription-friendly everyday wear
    notes: >-
      The public record supports the workflows and buyer logic above more strongly than it supports exact contract sizes or
      employer budget authority. Enterprise economics remain a diligence question rather than a settled fact.
