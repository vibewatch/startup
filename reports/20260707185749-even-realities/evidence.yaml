  - type: conflicting-data
    severity: material
    topic: headquarters-disclosure
    missingEvidence: >-
      An authoritative legal-entity and headquarters map that names the parent, operating entity, and principal office
      used for management, tax, and compliance purposes.
    whyItMatters: >-
      The public record mixes Shenzhen operating descriptions with Hong Kong and Berlin legal entities, which affects
      jurisdiction, diligence routing, and any later regulatory analysis.
    diligencePath: >-
      Request the incorporation stack, principal-office address, and board-approved legal-entity chart used for investor
      materials and vendor contracting.
