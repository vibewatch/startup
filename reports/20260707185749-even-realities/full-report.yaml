      - number: '8.3'
        title: Bull, base, and bear scenarios with explicit valuation ranges
        blocks:
          - type: paragraph
            body: >-
              The scenario ranges below are estimates, not hidden financial truth. They are inferred from the current
              round pricing, 2026 market-growth evidence, public competitor economics, and risk-adjusted execution
              rather than from disclosed revenue multiples, because Even has not publicly disclosed revenue, gross
              margin, or burn. That forces a milestone lens. The bull case assumes that privacy-first differentiation
              remains valuable, attach and accessory monetization remain intact, enterprise and partner channels start
              converting, and support burden stays manageable as volumes rise. Under that path, the company can justify
              a premium to the current mark.


              The base case is more conservative. It assumes real demand and ongoing category growth, but also that
              giant-platform competition, support costs, and missing financial transparency keep valuation from rerating
              quickly. The bear case assumes flat or worsening premium willingness to pay, ecosystem compression from
              Meta or Android XR, or a support-and-compliance burden that forces a future round on worse terms. That is
              why downside triggers matter at least as much as upside narratives.
            claimRefs:
