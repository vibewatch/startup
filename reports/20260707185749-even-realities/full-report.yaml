  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation flows from real market and product proof into financial opacity, then into a cautious valuation
      stance.
    data:
      nodes:
        - id: n1
          label: Category growth exists
          detail: 2026 market sources show smart-glasses expansion rather than stagnation.
        - id: n2
          label: Product and customer proof exists
          detail: A $599 G2, a $249 ring, real reviews, and 10k-plus shipped proof show substance.
        - id: n3
          label: Competition is heavy
          detail: Meta dominates share and Android XR plus Chinese peers raise ecosystem pressure.
        - id: n4
          label: Financial disclosure is sparse
          detail: Revenue, margin, burn, runway, and round terms remain undisclosed publicly.
        - id: n5
          label: Current mark is not obviously cheap
          detail: $1B may be fair-to-stretched without better economics data.
        - id: n6
          label: Recommendation = research-more
          detail: Keep diligence active, but do not stretch above price without private proof.
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: The flow is an underwriting synthesis from public evidence, not a disclosed management framework.
    claimRefs:
      - CV001
      - CV008
      - CV017
      - CV030
      - CV032
      - CV044
      - CV049
      - CV050
      - CV058
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The biggest valuation swings come from private facts the public record does not currently supply.
    data:
      items:
        - label: Clean cap table and low preference overhang
          value: 0.2
          unit: USD bn impact vs. base
          detail: Could lift fair value if common-equivalent upside is better than implied.
        - label: Visible enterprise conversion and partner scale
          value: 0.25
          unit: USD bn impact vs. base
          detail: Could justify rerating if GTM proof broadens beyond DTC.
        - label: Support / return burden higher than expected
          value: -0.25
          unit: USD bn impact vs. base
          detail: Would pressure premium-hardware economics and financing confidence.
        - label: Platform compression from Meta / Android XR / peers
          value: -0.35
          unit: USD bn impact vs. base
          detail: Would compress price power and cap upside.
    approximationNotes: Sensitivity values are directional underwriting impacts around the base case rather than company-guided forecasts.
    claimRefs:
      - CV043
      - CV046
      - CV048
      - CV053
      - CV055
      - CV057
      - CV060
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Scenario bands are estimated from current round pricing, market growth, public competitor economics, and
      risk-adjusted execution.
    data:
      items:
        - label: Bull case
          low: 1.4
          value: 1.6
          high: 1.8
          unit: USD bn
          description: Assumes channel conversion, attach strength, and controllable support load.
        - label: Base case
          low: 0.8
          value: 0.95
          high: 1.1
          unit: USD bn
          description: Assumes real demand but only partial economic proof and sustained competition.
        - label: Bear case
          low: 0.35
          value: 0.5
          high: 0.7
          unit: USD bn
          description: Assumes support, competition, or compliance friction forces a weaker next round.
    approximationNotes: These are inferred valuation ranges, not disclosed company projections and not revenue-multiple outputs.
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV051
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: Compact IC-style scorecard of the traits that currently help or hurt the underwriting case.
    data:
      items:
        - label: Market tailwind
