      - number: '2.2'
        title: Multiple sizing lenses, not one headline TAM
        blocks:
          - type: paragraph
            body: >-
              The available 2026 market numbers support category momentum but not a clean Even-specific TAM. IDC is the
              most decision-useful directional source because it separates screenless and display glasses, showing both
              segments accelerating in 2026 and giving concrete shipment and revenue markers. MarketResearch.com
              publishes a much broader global smart-glasses estimate, while XtendedView compiles a much lower revenue
              figure for what it also describes as the smart-glasses market. Omdia figures quoted by CNBC and TechNode
              add another layer, focusing specifically on AI glasses unit growth and the still-small global share of
              display-equipped products. The correct conclusion is not to average these numbers. They use different
              boundaries, different starting years, and different mixes of audio, camera, and display devices. The
              sizing work is still useful because all lenses point in the same direction: smart glasses are becoming a
              real category in 2026. But the evidence cannot yet convert that macro tailwind into a high-confidence SAM
              or SOM for Even's narrower camera-free professional wedge.
