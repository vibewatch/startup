      - number: '2.5'
        title: Diligence gaps and contradictory estimates that should stay unresolved
        blocks:
          - type: paragraph
            body: >-
              This chapter should keep several things unresolved on purpose. First, the public market estimates conflict
              enough that broad TAM figures should be treated as directional lenses, not a blended fact base. Second, no
              reviewed source isolates a vendor-neutral SAM or SOM for camera-free, professional, text-in-view smart
              glasses. Even's own positioning is clear, but its public enterprise page does not show pipeline,
              case-study economics, budget owners, or deployment counts. Third, category share data remain unstable. IDC
              shows Meta dominating Q1 2026 volume, while CNBC's Omdia reporting says display glasses are still only a
              small share of the global total, even though Chinese demand appears stronger for teleprompting and
              central-display use cases. The diligence ask is therefore specific: investors need private evidence on
              enterprise conversion, repeat-use retention, channel sell-through, and how much of Even's demand comes
              from professionals willing to pay for privacy-first text-in-view workflows rather than from the broader
              camera-led consumer excitement driving the market headline numbers.
            claimRefs:
