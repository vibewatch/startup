      - number: '1.3'
        title: Capital Base and Public Scale Metrics
        blocks:
          - type: paragraph
            body: >-
              Public capital evidence is strong for the latest round but thin around the broader capitalization picture.
              Multiple independent outlets agree that Even Realities raised $150 million in a July 2026 pre-Series B at
              a $1 billion valuation, led by Meituan with Tencent also participating. Yahoo further names Sequoia China,
              CDH Investment, Monolith Management, and CVC Capital as earlier backers, and both Yahoo and Mobile World
              Live describe proceeds going toward a next-generation platform, more AI capability, international
              expansion, and faster product development. Public scale disclosure is narrower. Press reports say
              headcount expanded from roughly 30-40 in 2024 to 300-400 in 2026, and management says G1 surpassed 10,000
              pairs sold. Geography data add some color: more than half of users and about 80% of developers are
              reportedly in the United States, while manufacturing remains in China. But later underwriting still needs
              private data on lifetime capital raised, debt, revenue, gross margin, and a management-quality customer
              definition.
