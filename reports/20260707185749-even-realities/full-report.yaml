            body: >-
              Even’s differentiation is real, but it is narrower than a generic “AI glasses” label suggests. The moat
              today is the combination of lightweight optics, native prescription accommodation, ordinary-eyewear
              aesthetics, and a privacy-forward stance that removes the camera and speaker arms race. That makes the
              product unusually well aligned to presentations, translation, and discreet note-taking. It also means the
              company gives up consumer features that Meta, Rokid, RayNeo, XREAL, and Brilliant use to widen their
