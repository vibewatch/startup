  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The major risks do not stay isolated: they transmit through conversion, support cost, margin, financing, and
      ultimately valuation.
    data:
      nodes:
        - id: rt1
          label: Privacy / consent event
          detail: Complaint, blocked workplace deployment, or processor-control challenge
        - id: rt2
          label: Reliability issue
          detail: Bluetooth, app, ring, or control friction reaches buyers and reviewers
        - id: rt3
          label: Enterprise and customer hesitation
          detail: Pilots slow down or buyers hesitate to rely on the workflow
        - id: rt4
          label: Higher support and legal cost
          detail: Returns, warranty, support, and counsel costs rise
        - id: rt5
          label: Margin pressure
          detail: Support, remake, and accessory overhead hit economics
        - id: rt6
          label: Financing need
          detail: Company needs more capital before economics visibly mature
        - id: rt7
          label: Valuation downside
          detail: Investors compress multiples or demand stricter terms
      edges:
