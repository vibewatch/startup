  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The first diligence step is to define what market Even Realities is actually in. Public evidence does not
              support a single undifferentiated “smart glasses” bucket. IDC, Android XR, Meta, XREAL, Rokid, RayNeo,
              Xiaomi, and Even's own product pages all show the category splitting across at least three commercial
              forms: screenless AI/audio or camera glasses, display-first smart glasses with translation or
              teleprompting, and richer AR or spatial-computing companions. For Even, included spend should therefore
              center on premium prescription-capable display eyewear, translation and teleprompting workflows, companion
              accessories such as the optional ring, and the phone-connected software layer that makes those jobs
              useful. Excluded spend should include commodity earbuds, conventional optical frames with no compute
              layer, full VR headsets, and general smartphone spend that does not move into eyewear. Status-quo
              substitutes remain powerful: a phone plus earbuds, teleprompter apps, translation apps, sticky notes, and
              camera-led glasses from rivals can all solve parts of the same problem. That is why Even's camera-free,
              display-first positioning matters more than broad “wearable AI” rhetoric.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
