      - number: '3.3'
        title: Capability tradeoffs, trust posture, and user-experience evidence
        blocks:
          - type: paragraph
            body: >-
              Public reviews make the tradeoff unusually legible. Even earns praise because it looks more like normal
              eyewear, avoids the face camera that makes some buyers uncomfortable, and delivers useful captioning,
              notification, and prompt workflows in a discreet display. That same restraint also narrows the addressable
              experience. Reviewers repeatedly note missing speakers, lighter app depth, Bluetooth dependence, uneven
              navigation, and ring or software rough edges. In other words, Even’s differentiation is less about
              superior computing breadth than about reducing the social and privacy cost of wearing smart glasses in
              professional or everyday settings. Meta, Google, and Android XR sit at the opposite end of the spectrum:
              bigger ecosystems, better assistant and app leverage, and more obvious capture or multimodal capability,
              but also more trust friction anywhere cameras or always-listening features raise concern. The comparison
              should therefore stay honest. Even’s camera-free design is a meaningful trust advantage in workplaces,
              travel, and meetings, but it does not yet close the capability or ecosystem gap to the larger platforms.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
              - CP039
      - number: '3.4'
        title: Switching cost, lock-in, multi-homing, and channel power
        blocks:
          - type: paragraph
            body: >-
              Consumer smart glasses still look more like companion devices than closed ecosystems, which keeps
              switching costs modest. Buyers can multi-home with ordinary prescription glasses, earbuds, phones, and
              even multiple smart-glasses products because most current devices still depend on a smartphone or external
              app layer for setup, connectivity, or advanced functions. That limits Even’s product lock-in. Its
              strongest sticky elements are prescription fitting, stored scripts and routines, the optional ring, and
              any habits users build around glanceable prompts or live transcription. Those are real, but they are small
              compared with Meta’s distribution leverage through Ray-Ban and EssilorLuxottica, Google’s service graph
              through Gemini and Android, or XREAL’s broad device compatibility across phones, PCs, and entertainment
              hardware. Channel power also matters more than the raw feature matrix: getting discovered in optical
              stores, electronics retail, or existing mobile ecosystems is still the fastest route to category
              familiarity. Even has promising optician distribution and direct-web proof, but public evidence does not
              yet show the same shelf reach, attach economics, or partner dependence data that underwrite durable
              distribution strength.
