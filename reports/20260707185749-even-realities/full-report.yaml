      - number: '8.5'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The final decision should be gated by missing evidence, not by aesthetics or product novelty. Even has
              enough visible signal to merit serious diligence: real pricing, real reviews, real category growth, and a
              fresh round that demonstrates outside investor appetite. What it does not have is the public accounting
              needed to defend a premium price by itself. Before paying above the current mark, investors should ask for
              the cap-table bridge, preferred terms, margin stack, burn runway, return and remake rates, enterprise
              funnel, and any evidence that partner and support complexity are under control.


              The thesis also needs explicit break conditions. A premium, privacy-first wearable can still fail
              economically if Bluetooth dependence, app depth, returns, or support load overwhelm the value of the
              product. It can also fail strategically if Meta, Android XR, Rokid, or XREAL close the trust or workflow
              gap while keeping better distribution or lower price points. If management cannot disprove those paths
              with private evidence, the right action is to track the company, not chase the headline valuation.
