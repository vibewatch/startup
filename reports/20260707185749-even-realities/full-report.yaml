      - number: '4.3'
        title: Cost structure, gross-margin drivers, and working-capital load
        blocks:
          - type: paragraph
            body: >-
              The retained source set strongly suggests that Even’s cost base is more demanding than a lightweight
              AI-assistant overlay. Official engineering posts describe antenna, processor, and battery interference
              work, a magnesium-titanium frame, prescription-integrated optics, and durability tradeoffs that come with
              36-gram wearable hardware. The ring adds zirconia ceramic, stainless steel, sensors, and its own
              charging/support burden. Reviews then add the operational aftertaste: random disconnects, charging and
              connectivity issues on the ring, app-install failures, AI misses, and dashboard rough edges all imply real
              firmware, QA, support, and replacement cost after shipment. None of that proves weak gross margin, but it
              does show that margin will depend on manufacturing yield, support efficiency, and software stability
              rather than on software gross margins alone.


              Working-capital and service-delivery complexity are visible too. Even’s own pages say prescription orders
              are custom-made, non-prescription orders can be returned within 14 days, and the ring can ship after the
              glasses. That combination can create inventory, reserve, and cash-conversion pressure even before any
              published burn figure exists. On top of that, Conversate, translation, and AI note-taking features create
              cloud, data-processing, and compliance obligations. Legal sources are explicit that smart glasses can push
              data to third-party AI providers and create consent and breach-notification exposure, which likely adds
              ongoing policy, vendor-management, and legal cost.
