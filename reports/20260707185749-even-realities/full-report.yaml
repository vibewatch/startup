      - number: '3.5'
        title: Moat durability, commoditization risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat case for Even is real but narrow. It has a coherent point of view around privacy, professional
              acceptability, prescription-friendly design, and “quiet” on-face computing rather than maximal AR
              spectacle. That can matter in sensitive meetings, presentations, multilingual travel, or customer-facing
              work where a camera is a social tax. The risk is that this moat is design-led rather than ecosystem-led.
              IDC already shows Meta dominating category share while the rest of the field fragments, and the same
              report forecasts meaningful ASP compression as the market matures. Chinese vendors are iterating quickly,
              Android XR makes the Google-Samsung ecosystem a near-term entrant, and historical precedent from Google
              Glass shows that technical novelty is not enough if distribution and software support fade. Review
              evidence is also adverse in the right ways: Even still has software instability, app-depth limits, and
              navigation gaps, while competing products can appeal to buyers who want audio, capture, broader AR, or
              larger device ecosystems. Investors should therefore treat Even’s privacy-first wedge as a useful
              positioning advantage, not as proof of durable winner-take-most defensibility.
