  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, investment thesis, and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              At the current public mark, Even Realities looks investable as a diligence candidate, not yet as a clean
              buy. The thesis is coherent across market, product, and customer evidence. July 2026 reporting says the
              company raised $150 million at a $1 billion valuation; the company has a live $599 product, a $249 ring,
              accessory attach, enterprise and partner surfaces, and review evidence that the camera-free design solves
              a real trust problem for users who want translation, prompts, or notifications without wearing a face
              camera. Category growth is also real: smart-glasses market researchers are pointing to 2026 as a scale-up
              year rather than a niche curiosity phase.


              The anti-thesis is just as material. Meta already controls most visible 2026 category share, Android XR is
              explicitly coming to glasses, and peers such as Rokid and XREAL are scaling adjacent use cases with larger
              ecosystems or faster volume. Even also remains financially opaque in the exact places that matter for
              valuation discipline: revenue, gross margin, burn, runway, return rates, and cap-table terms. That
              combination supports a research-more recommendation, medium confidence, high risk, and a stretched
              valuation stance rather than a blind endorsement of the current round price.
            claimRefs:
