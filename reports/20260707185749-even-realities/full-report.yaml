  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risks and investment implication
        blocks:
          - type: paragraph
            body: >-
              Even Realities has real demand signals, fresh capital, and a differentiated camera-free thesis, but the
              highest residual risks are not cosmetic. They cluster around compliance, product reliability, and
              disclosure opacity. The legal and compliance problem is not solved simply because the frame lacks a
              camera: transcription, translation, cloud-linked assistance, and workplace use still create consent,
              HIPAA, and processor-control exposure. The operational problem is similarly layered. The glasses, ring,
              phone app, Bluetooth path, accessories, and support system all have to work well enough to keep a premium
              hardware product from feeling brittle. Finally, the financing story is directionally positive but still
              incomplete. A $150 million pre-Series B round can fund time, not proof. Investors still cannot see margin,
              burn, runway, reserve policy, or partner concentration in public sources, so the current investment
              implication is conditional: interest remains justified only if diligence can turn the public narrative
              into verified compliance, reliability, and economic control.
            claimRefs:
              - CR034
              - CR035
              - CR038
              - CR042
              - CR046
              - CR047
