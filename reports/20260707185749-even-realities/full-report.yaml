      - number: '8.2'
        title: Current round context, price support, and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence does support the existence of a real financing event and a real product stack. Multiple
              July 2026 outlets converge on the same headline: $150 million raised at a $1 billion valuation, with a
              camera-free G2 priced at $599 and a companion ring at $249. The company also presents bulk-order and
              partner surfaces, which means there is at least a visible attempt to grow beyond a single
              direct-to-consumer checkout flow. That is enough to justify further work.


              It is not enough to conclude that the $1 billion mark is attractive. The same public record does not
              disclose post-money share count, liquidation preferences, option-pool expansion, secondary mix, or any
              operating numbers that let an investor translate the headline into common-equivalent economics. The
              correct entry discipline is therefore asymmetric: either get comfortable that the private diligence pack
              can still support better than roughly 2.5x gross MOIC over a four-to-five-year hold, or insist on a lower
              effective entry price. Absent that evidence, the current round should be treated as the best known
              market-clearing price, not as proof of undervaluation.
            claimRefs:
