            body: >-
              Trust is where Even’s product thesis is both strongest and most incomplete. The camera-free design,
              no-subscription marketing, explicit 14-day return policy for non-prescription units, and cloud-consent
              language are meaningful public signals. Conversate also says it stores transcripts and summaries on the
              phone instead of voice recordings, which is directionally better than ambient cloud capture. But the
              compliance surface does not disappear just because the camera is gone. Legal sources still warn that
