      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Company Overview owns the long funding chronology, but Financials still has to answer the forward
              question: is there enough public evidence to believe Even is adequately financed for its current plan? The
              current answer is only directionally yes. Multiple July 2026 outlets agree that Even raised $150 million
              in a pre-Series B round at a $1 billion valuation, with proceeds earmarked for a next-generation platform,
              deeper AI capability, international expansion, and faster product development. That is a meaningful
              capital event for a 2023-founded hardware company that has already grown headcount sharply and is trying
              to support optics, AI, channel expansion, and international operations.


              The underwriting problem is that the round is a signal, not a runway model. No retained public source
              gives a post-round cash balance, monthly burn, runway months, debt schedule, covenant package, or
              working-capital bridge. Meanwhile, market and competitor evidence says Even is scaling into a category
              where giants and well-funded challengers can absorb losses for longer. Meta’s 2025 10-K explicitly places
              AI glasses inside its wearables effort and says Reality Labs reduced 2025 operating profit by about $19.19
              billion, with 2026 losses expected to stay similar. That does not mean Even needs Meta-sized capital, but
              it does mean the competitive reference set is comfortable with heavy subsidy.
