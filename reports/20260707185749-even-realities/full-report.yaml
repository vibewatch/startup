      - number: '2.4'
        title: Growth drivers, adoption constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The category has real growth drivers. IDC shows accelerating unit growth, Android XR confirms
              large-platform OS and app investment, Meta still sets the consumer volume benchmark, and Chinese vendors
              such as Rokid and RayNeo are bringing display-oriented products to market with translation, navigation,
              and AI assistants. Better optics, lighter frames, prescription support, and app ecosystems all expand
              buyer willingness to try the format. But the constraints are just as important for valuation. Multiple
              independent reviews still frame smart glasses as early- adopter products with sunlight, comfort, battery,
              app-depth, and workflow-reliability tradeoffs. Privacy and trust remain category-level bottlenecks because
              legal sources keep returning to consent, workplace restrictions, and the risks created by cameras,
              microphones, transcription, and biometrics. Even's camera-free design helps on that axis, but it also
              removes some of the media-capture and audio value propositions that broader-market rivals use to drive
              demand. The underwriting implication is that Even may have better trust fit in sensitive settings, but the
              category as a whole is still converting from curiosity into dependable everyday behavior.
            claimRefs:
