companyProfile:
  summary: >-
    Even Realities is a 2023-founded private smart-eyewear startup built around a camera-free, display-first product
    thesis. Public sources identify founder and CEO Will Wang as a former Apple operator who helped work on Apple Watch
    and iPhone programs before launching the company. The company sells the Even G2 smart glasses at a $599 base price
    and the Even R1 companion ring at $249, positioning the bundle around translation, teleprompting, conversation
    support, notifications, and quiet productivity rather than face-mounted capture. Public channel evidence points to
    direct web sales plus optician and retail partners, while July 2026 reporting says Even raised $150 million in a
    pre-Series B round at a $1 billion valuation led by Meituan with Tencent participating. The underwriting gap is not
    product reality but financial opacity: revenue, margin, runway, and full round economics remain undisclosed.
