              binocular Micro LED waveguide display with 640 by 350 resolution, 27.5 degree field of view, and 1200 nits
              brightness inside a 36 gram magnesium-and-titanium frame. Even’s engineering notes say G2 shrank the
              optical stack, reduced lens thickness, and improved passthrough while also redesigning radio layout and
              the left-right synchronization model. Critically, the operating model is not self-contained on the
              glasses. The glasses, ring, phone app, Bluetooth link, and cloud-linked AI stack work as one system. That
              architecture preserves comfort and style, but it also means product reliability depends on multi-device
