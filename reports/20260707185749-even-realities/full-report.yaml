  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      G2 is best understood as a stacked system that begins with quiet in-lens text and ends with phone-linked
      orchestration and AI services.
    data:
      layers:
        - label: Wearer interface layer
          detail: >-
            Binocular text display, touch strips, ring gestures, and voice wake words create the observable user
            interface.
        - label: Optics and sensing layer
          detail: Waveguides, Micro LED projection, four microphones, IMU, and compass provide the physical input/output core.
        - label: Frame compute and transport layer
          detail: >-
            Processor, BLE 5.4 radio, antenna layout, batteries, and the left-right FPC keep the frame synchronized and
            connected.
        - label: Companion orchestration layer
          detail: The phone app handles setup, dashboards, scripts, destinations, summaries, and many active controls.
        - label: AI and ecosystem layer
          detail: >-
            Even LLM, partner models, transcripts, and Even Hub apps extend utility but also introduce external
            dependency and maturity risk.
