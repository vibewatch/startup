        title: Product definition and line-up
        blocks:
          - type: paragraph
            body: >-
              Even Realities is not selling a general-purpose AR headset. The public product surface is narrower and
              more coherent: a camera-free, display-first eyewear system that keeps short-form text, cues, and controls
              inside ordinary-looking prescription glasses. In customer workflow terms, G2 tries to replace the repeated
              phone-check loop that happens before a pitch, during a multilingual meeting, while navigating an
              unfamiliar city, or when capturing talking points after a conversation. The product line is also
              intentionally modular. G2 A and G2 B give buyers two frame silhouettes at the same base price, while the
              optional R1 ring adds discreet control and basic wellness sensing without changing the core glasses
              thesis. The line works best when the user values privacy, subtlety, and prescription readiness more than
              media playback or first-person capture.
