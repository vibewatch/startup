- id: gtm-traction-and-sales-efficiency-proxies
  title: GTM motion, traction proxies, and sales-efficiency limits
  body: |-
    Public GTM evidence points to a blended motion rather than a single clean funnel. Even sells through a consumer configurator, retail and optometry partners, and an enterprise inquiry page that asks for organization details and promises tailored pricing. That implies at least three very different acquisition motions: direct-response ecommerce, assisted channel sales, and a consultative enterprise lane. The most useful public efficiency proxy is the average order size signal reported by Yahoo Finance, The Daily Star, and 9to5Google: once prescription lenses or the ring are added, the average transaction moves toward roughly $1,000. That does not prove healthy CAC payback, but it does show the business is trying to monetize an ecosystem order rather than just a $599 base frame.

    Traction visibility is still partial. Fresh funding coverage says the company was founded in 2023, launched G2 in November 2025, exceeded 10,000 G1 pairs sold, and expanded from roughly 30 to 40 employees in 2024 to 300 to 400 in 2026. Yahoo and Mobile World Live also say more than half of users and about 80% of developers are in the U.S. New official workflow posts and customer stories reinforce the same productivity-first positioning: Even markets Terminal Mode for supervising AI-agent work away from the desk, and published stories show professionals using G1 for teleprompting, monitoring information streams, and conference workflows. Those are not revenue disclosures, but they do support the view that Even is selling work utility rather than camera-led entertainment. Investors can see motion, not efficiency.
