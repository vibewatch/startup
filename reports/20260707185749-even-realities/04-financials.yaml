- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: |-
    The positive case is real but narrow. Public sources support that Even has premium-device pricing, meaningful bundle upsell, at least one enterprise lane, credible U.S.-heavy early demand, and fresh access to outside capital. The company is not hiding in stealth; it is selling live products with public prices, public channels, public reviews, and externally reported financing. That is enough to believe there is a real business and not just a concept.

    But it is still not enough to underwrite revenue quality or margin durability. Investors cannot see revenue, GMV, gross margin, return rates, attach rates, CAC, payback, burn, runway, or debt. Review evidence shows that software stability and post-sale support still matter to the delivered experience, while legal and market evidence show privacy-compliance and price competition are unlikely to get easier. The correct financial verdict is therefore cautious: promising top-of-funnel demand and capital access, but a still-opaque conversion engine whose hidden variables could materially change valuation, margin path, and financing needs.
