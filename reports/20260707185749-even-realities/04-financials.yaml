company:
  name: Even Realities
chapter:
  number: 4
  title: Financials
  summary: Even Realities is publicly legible on pricing and fresh financing, but not on underlying economics. Official surfaces show a hardware-led model anchored by $599 G2 glasses, $249 R1 rings, lens add-ons from $159, and quote-based enterprise or channel sales, while July 2026 coverage says the company raised $150 million at a $1 billion valuation and average tickets approach $1,000 once prescription lenses or the ring are added. No retained public source, however, discloses revenue, gross margin, CAC, burn, runway, or debt, and review plus legal evidence points to meaningful hardware, software-support, privacy-compliance, and pricing-pressure risk before the company can be underwritten as a durable high-margin platform.
sections:
- id: revenue-model-and-pricing
  title: Revenue model, pricing, and recognition visibility
  body: |-
    Even Realities does not look like a recurring-software business in the retained public record. The company’s own commerce pages make the monetization stack look predominantly transactional and hardware-led: the G2 glasses list at $599, single-vision lenses start at $159, the companion R1 ring lists at $249, and enterprise demand is routed into a quote form rather than a public contract card. Retail and optician pages add another clue: Even appears to rely on direct checkout for standard consumer orders while using physical partners for try-on, progressive-lens fitting, and distribution reach. That is a legitimate multichannel setup, but it is still much closer to premium-device commerce than to visible subscription ARR.

    The pricing evidence is stronger than the recognition evidence. Official pages clearly disclose list prices, financing support through Klarna, FSA/HSA reimbursement language, custom prescription handling, and a 14-day return window for non-prescription products. They do not disclose realized ASPs, discount rates, attach rates, bundle accounting, return reserves, or when multi-item orders are recognized when the ring ships after the glasses. The public conclusion is therefore narrow but useful: list pricing is real, attach upsell is plausible, and accounting complexity exists, but revenue quality cannot be judged from public materials alone.
