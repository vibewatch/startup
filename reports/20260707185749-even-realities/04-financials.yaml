- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue and gross margin by product lane
    - Without it, investors cannot tell whether the business is premium hardware, bundled services, or a low-margin device sold into future software hopes
    - Request monthly revenue and gross margin by glasses, lenses, ring, accessories, and enterprise orders
  - - Attach rates and return / remake rates
    - Without it, the $1,000 basket signal may overstate durable realized revenue
    - Request attach by cohort plus return, remake, and warranty-loss history
  - - CAC, sales cycle, and payback by channel
    - Without it, DTC, partner, and enterprise growth may look healthy while destroying cash
    - Request funnel conversion, media spend, assisted-sale costs, and payback by lane
  - - Cash on hand, burn, runway, and debt
    - Without it, the $150 million round cannot be translated into solvency or downside resilience
    - Request current treasury report, monthly burn bridge, runway scenarios, and debt schedule
  - - Inventory and working-capital mechanics
    - Without it, investors cannot judge whether custom optics, staggered shipments, and returns will consume cash as volumes rise
    - Request inventory turns, supplier terms, receivables, returns reserves, and cash-conversion cycle
  - - Compliance and support cost burden
    - Without it, privacy, AI processing, and post-sale software support may be under-modeled
    - Request legal/compliance budget, support ticket data, replacement rates, and vendor AI-processing cost
  notes: These are the specific missing inputs that keep Even from clearing a strict public-underwriting standard despite visible pricing and financing evidence.
  enumerationScope:
    coverage: exhaustive
    basis: Rows enumerate the distinct information gaps repeatedly surfaced across retained official, review, legal, funding, and filing evidence used in this chapter.
