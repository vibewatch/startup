tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Even G2 hardware
    - Direct sale of camera-free smart glasses through Even checkout and channel partners
    - Per pair
    - $599 list price before tax on G2 A and G2 B pages
    - Real and visible, but list price is not realized margin
    - Request realized ASP, refund rate, regional mix, and gross margin by frame
  - - Prescription-lens add-ons
    - Custom lens upsell attached to G2 orders and optician fitting
    - Per order add-on
    - Single-vision lenses start at $159; progressive fitting is routed to partner opticians
    - Potentially high-value attach, but custom production and return handling add complexity
    - Request attach rate, lens COGS, remake rate, and refund reserve policy
  - - Even R1 ring and accessories
    - Companion hardware upsell that expands control and health-tracking utility
    - Per ring / accessory
    - $249 list price for the ring; average tickets move toward about $1,000 once ring or Rx is added
    - Helpful for AOV, but still hardware revenue with support and warranty burden
    - Request attach rate, accessory margin, replacement rate, and warranty claims
  - - Enterprise and institutional orders
    - Bulk-order motion via quote form and enterprise pricing rather than self-serve checkout
    - Per quote / deployment
    - Officially marketed, but no public price card or contract size disclosed
    - Can improve order size, but sales-cycle and discount structure are unknown
    - Request enterprise pipeline, average deal size, and deployment support costs
  - - AI / software features
    - Conversate, translation, Even AI, and app ecosystem appear bundled into device ownership
    - Included feature set
    - No public subscription or paid-seat pricing found in retained sources
    - Weakest visibility because recurring software monetization is not publicly shown
    - Request whether any software, API, or enterprise support fees are billed separately
  notes: The retained public record supports a hardware-first revenue model with upsell layers, not a disclosed recurring-software model.
