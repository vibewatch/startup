  - type: private-evidence-only
    severity: material
    topic: gtm
    missingEvidence: No retained source discloses CAC, payback, conversion, or sales-cycle metrics by DTC, channel, or enterprise lanes.
    whyItMatters: Premium average order values can still destroy cash if acquisition and support costs are too high.
