- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public value / status
  - Readthrough
  - Next-round trigger / obligation view
  - Diligence ask
  rows:
  - - Latest financing
    - $150 million pre-Series B in July 2026 at a $1 billion valuation
    - Confirms continued investor access and enough scale to fund roadmap expansion
    - Not itself a trigger, but it resets expectations for growth and platform execution
    - Request closing docs, investor rights, and post-close cash balance
  - - Planned use of funds
    - Next-generation platform, stronger AI, broader international footprint, and faster product roadmap
    - Signals that cash will be spent on both product and geographic expansion rather than only on working capital
    - If those programs overrun, another round could be needed sooner than public investors assume
    - Request milestone budget, monthly cash plan, and downside hiring scenario
  - - Cash on hand
    - No retained public figure after the July 2026 raise
    - Largest immediate blind spot in liquidity underwriting
    - Without cash, burn cannot be translated into runway or covenant headroom
    - Request treasury snapshot at close and current unrestricted cash
  - - Burn / runway
    - Not publicly disclosed
    - Prevents any external assessment of how quickly roadmap and headcount consume capital
    - Likely key next-round trigger, but not quantified in public sources
    - Request 18-month operating plan, burn bridge, and base/upside/downside runway
  - - Debt / project-finance obligations
    - No retained public disclosure
    - Leaves open the possibility of vendor finance, inventory facilities, or other hidden claims on cash
    - Could accelerate financing needs if present, but public evidence is silent
    - Request debt schedule, supplier-credit terms, guarantees, and off-balance-sheet commitments
  - - Competitive capital context
    - Meta continues to absorb multibillion-dollar Reality Labs losses; Rokid is exploring IPO-scale financing
    - Even is entering a category where rivals can be subsidized for long periods
    - If price pressure intensifies before software monetization matures, Even may need follow-on capital
    - Request management view of price wars, gross-margin floor, and next capital trigger
  notes: This table intentionally separates the observable funding headline from the missing treasury and obligation data required to turn that headline into a runway judgment.
