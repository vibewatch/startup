  - type: private-evidence-only
    severity: blocking
    topic: capital-gap
    missingEvidence: No retained source gives post-round cash on hand, monthly burn, runway, or debt obligations.
    whyItMatters: Liquidity cannot be underwritten from the funding headline alone.
    diligencePath: Request current treasury report, debt schedule, covenant pack, and an 18-month runway model.
    relatedQuestionRefs:
    - QI020
    - QI021
