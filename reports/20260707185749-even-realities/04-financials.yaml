  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: No public revenue, GMV, or gross-margin statement is retained for Even Realities.
    whyItMatters: Without it, price visibility cannot be translated into revenue quality or margin durability.
    diligencePath: Request monthly revenue by SKU or channel, gross margin by product lane, and management bridge from list price to net revenue.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI018
