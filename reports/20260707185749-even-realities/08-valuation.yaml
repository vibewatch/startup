- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Cap table and preferences
    - Post-money ownership, liquidation preferences, participation, anti-dilution, and secondary mix
    - Determines whether the public headline matches real common-equivalent upside.
    - Management + counsel data room review.
  - - Gross margin and burn
    - SKU margin waterfalls, monthly burn, and runway after the round
    - Required to judge whether the current valuation is merely fair or too rich.
    - Finance team monthly accounts and board pack.
  - - Returns and warranty load
    - Return, remake, defect, and warranty rates by glasses, ring, and accessory SKU
    - Premium hardware can look attractive until after-sales cost erases margin.
    - Ops dashboards and support analytics.
  - - Enterprise conversion
    - Pipeline size, close rates, deployment sizes, and renewal or expansion evidence
    - Distinguishes surface-level enterprise intent from durable GTM proof.
    - Sales CRM and customer references.
  - - Privacy and compliance controls
    - Data-flow map, third-party AI vendor list, incident history, and regulated-use restrictions
    - Category risk is materially higher without a real compliance pack.
    - Legal, security, and product-control review.
  - - Channel economics
    - Retail and partner discounting, training cost, and support burden by channel
    - Partner scale can help or hurt value depending on service intensity.
    - Channel-management review with cohort economics.
  notes: These asks are the minimum private-diligence package needed to move from watchlist interest to a fully underwritten valuation view.
