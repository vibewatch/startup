tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Decision lens
  - Current view
  - Why it lands there
  - What would upgrade it
  rows:
  - - Recommendation
    - research-more
    - Real product and real financing exist, but public economics are too sparse for a buy call.
    - Private diligence shows durable unit economics and clean terms at or below the current price.
  - - Confidence
    - Medium
    - The round headline, pricing, reviews, and market data are real, but key financial and cap-table inputs are missing.
    - Management provides auditable data on margin, burn, runway, and round structure.
  - - Risk rating
    - High
    - Hardware, support, compliance, and giant-platform competition can all compress future financing outcomes.
    - Evidence shows low defect burden, clean compliance controls, and resilient channel conversion.
  - - Valuation stance
    - Stretched
    - The current $1 billion mark is understandable as a market-clearing private round, not as clearly cheap public-data value.
    - Entry terms improve or execution evidence rerates the company above the current round.
  - - Entry discipline
    - Do not stretch above the current round without proof
    - Public evidence does not reveal preference overhang or common-equivalent upside.
    - Cap table and term sheet show limited overhang and attractive common-equivalent ownership.
  - - Target return hurdle
    - '>2.5x gross MOIC over 4-5 years'
    - Hardware-plus-platform risk requires a higher hurdle than a plain incremental SaaS follow-on.
    - If the company cannot plausibly clear that hurdle, wait or track.
  - - Preferred hold / exit frame
    - 4-5 year hold toward up-round or strategic exit
    - Public evidence does not support near-term IPO readiness.
    - Later-stage proof on enterprise conversion and economics broadens exit options.
  notes: The recommendation is price-sensitive and evidence-sensitive; it is not a generic score for company quality.
