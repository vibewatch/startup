- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / observable signal
  - Transmission to thesis
  - Action implication
  rows:
  - - Support / reliability burden
    - Private data shows elevated returns, remakes, or support tickets that absorb margin
    - Breaks the premium-hardware economics needed for a successful follow-on.
    - Do not pay above the current round; consider pausing the investment.
  - - Channel conversion shortfall
    - Enterprise and partner surfaces exist but do not convert into paid deployments or repeat orders
    - Weakens the distribution-expansion leg of the bull case.
    - Treat the company as a narrower DTC hardware bet and cut valuation.
  - - Cap-table overhang
    - Preferences, participation, or option-pool changes materially dilute common-equivalent ownership
    - Makes the round headline overstate true upside to a new investor.
    - Re-underwrite entry price or walk away.
  - - Platform compression
    - Meta, Android XR, or adjacent peers narrow the workflow gap while keeping stronger distribution or lower prices
    - Shrinks the privacy-first wedge and future pricing power.
    - Mark valuation toward the bear case.
  - - Compliance failure
    - Weak privacy controls, third-party AI governance gaps, or regulated-workflow objections emerge in diligence
    - Raises enterprise friction and reputational downside.
    - Move recommendation to avoid unless remediated.
  notes: Kill triggers are framed as falsifiable underwriting signals rather than generic company risks.
