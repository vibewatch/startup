- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable / reference
  - Metric or status
  - Valuation / multiple / status
  - Why it matters for Even
  - Limitation
  rows:
  - - Even Realities current round
    - $150M pre-Series B at $1B
    - Only directly observed valuation anchor
    - Sets the current clearing price for the asset.
    - Does not reveal preferences, ownership, or operating quality.
  - - Meta / Reality Labs / Ray-Ban Meta
    - AI glasses inside trillion-dollar platform; RL losses about $19.19B in 2025; Ray-Ban Meta starts at $224/$299
    - Strategic public reference, not a clean comp multiple
    - Shows the kind of subsidy and price pressure a giant rival can absorb.
    - Not a pure-play wearable startup and not comparable on capital structure.
  - - Rokid
    - '>300k cumulative AI-glasses sales and HK IPO preparation'
    - Private milestone reference; valuation undisclosed
    - Demonstrates adjacent scale and teleprompt / translation demand.
    - China-heavy context and no public valuation term.
  - - XREAL
    - ASUS ROG partnership announced in Jan. 2026
    - Private strategic reference; valuation undisclosed
    - Shows partner-led ecosystem expansion in adjacent AR glasses.
    - More gaming / spatial-computing tilted than Even's quiet-work wedge.
  - - Smart-glasses category growth
    - $3.2B 2026 to $14.4B 2033 at 24.2% CAGR
    - Market tailwind reference, not a company multiple
    - Supports upside if Even proves it can capture durable share.
    - Category estimates vary and do not automatically convert to company value.
  - - Review and policy burden reference
    - Premium hardware plus support and privacy obligations
    - Execution-risk reference rather than a valuation multiple
    - Helps explain why Even should not be valued like a clean software asset.
    - Burden is directional until private operations data is produced.
  notes: This is an enumeration table of the most decision-useful public references. It mixes direct valuation anchors, strategic public references, and milestone comparables because private Even disclosures do not support a precise multiple framework.
  enumerationScope:
    coverage: partial
    basis: Rows cover the public valuation anchors, strategic platforms, and milestone references most relevant to Even's 2026 underwriting case, not every smart-glasses company globally.
