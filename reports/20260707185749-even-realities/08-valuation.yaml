  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: Signed term sheet or cap-table bridge showing liquidation preferences, participation, anti-dilution terms, option-pool expansion, secondary mix, and post-money ownership.
    whyItMatters: Public round headlines do not show common-equivalent upside or preference overhang, so valuation discipline can be badly misread.
    diligencePath: Request the current financing deck, cap table, and executed term sheet summary from management or counsel.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV004
    - TV001
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Current gross margin, burn, runway, and contribution-margin bridge by glasses, ring, lenses, and accessories.
    whyItMatters: Without gross margin and burn data, a $1 billion mark cannot be judged against capital efficiency or financing risk.
    diligencePath: Request monthly management accounts, SKU margin waterfalls, and a 12-month cash runway model.
    relatedQuestionRefs:
    - QV031
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: service-quality
    missingEvidence: Actual return rates, remake rates, defect rates, warranty claims, and support ticket volumes by SKU and geography.
    whyItMatters: The public record shows premium hardware, accessories, and customer-support surfaces, but not the after-sales burden that can crush hardware margins.
    diligencePath: Request cohort-level operations KPIs, replacement-unit data, and customer-support dashboards.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: enterprise-conversion
    missingEvidence: Live enterprise pipeline, conversion rates, average deployment size, and paid renewal or expansion data.
    whyItMatters: Public enterprise and partner pages prove intent to sell beyond consumer ecommerce but not durable enterprise revenue or retention.
    diligencePath: Request CRM funnel snapshots, signed deployment case studies, and sales-efficiency data by channel.
    relatedQuestionRefs:
    - QV032
    relatedTableRefs:
    - TV006
