- id: comparables-and-exit-readiness
  title: Comparable references, competition-adjusted valuation, and exit readiness
  body: 'Comparable work for Even has to be humble. There is no clean public pure-play that makes the math easy, and pretending otherwise would create false precision. The most useful references are strategic and milestone-based. Meta shows what dominant platform competition looks like when a rival can subsidize AI glasses inside a much larger ecosystem and tolerate billions in Reality Labs losses. Ray-Ban Meta pricing also shows that Even is trying to sell a more expensive, narrower, privacy-first proposition into a market where lower starting prices already exist. Android XR and XREAL broaden the ecosystem risk further, while Rokid shows that a directly adjacent product can move faster on teleprompt, translation, and volume milestones.


    That comp set supports two conclusions. First, Even can plausibly become strategically relevant if it owns a privacy-first work utility niche. Second, the same comp set makes near-term IPO thinking premature. Public evidence is better suited to a future up-round or strategic-interest path than to a confident public-market readiness claim today.'
