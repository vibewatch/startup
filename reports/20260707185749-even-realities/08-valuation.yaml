- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market
    - Smart-glasses growth is accelerating and 2026 looks like a scale-up year.
    - Growth does not erase concentration risk when Meta already dominates share.
    - A year of sustained non-Meta share gains and clearer segment boundaries.
  - - Product
    - Camera-free, discreet workflow value is a real differentiator.
    - Differentiation can still be too narrow if app depth and reliability lag.
    - Cohort data showing repeat use and low churn despite narrower scope.
  - - Customers
    - Public reviews suggest a real use case for prompts, translation, and quiet notifications.
    - Premium willingness to pay can fade if support burden or rough edges persist.
    - Measured retention, low return rates, and evidence of expanded weekly use.
  - - Financials
    - A fresh $150 million round buys time and shows investor appetite.
    - No public revenue, margin, burn, or runway data supports precise underwriting.
    - Audited or board-grade operating data that validates economics.
  - - Competition
    - Even can matter if it owns a privacy-first work niche.
    - Meta, Android XR, XREAL, and Rokid all threaten that niche from different angles.
    - Evidence that Even keeps a trust or workflow edge that rivals do not erase.
  - - Risks
    - Camera-free positioning lowers one category of social friction.
    - Privacy, consent, HIPAA, and data-processing risks still remain material.
    - A real compliance pack and incident history that de-risks enterprise use.
  notes: Each row pairs the best public upside argument with the clearest public counterweight rather than forcing a single-direction narrative.
