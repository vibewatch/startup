- id: deployment-support-roadmap
  title: Deployment, support, and roadmap
  body: 'Deployment today looks consumer-first, not enterprise-ready. Buyers configure the product through Even’s app and product pages, enter teleprompt material or destinations on the phone, and rely on Bluetooth and companion services for most active functions. Reviewers generally agree that G2 is much more usable than the first generation, especially once the ring is paired, but they also keep surfacing map weakness, disconnections, install failures, and young software. The roadmap that is publicly visible is feature-led: upgraded Conversate, an expanding Even Hub, and the new Terminal Mode narrative for supervising AI agents in motion. What is not visible is just as important. The public enterprise surface is a request form, not a detailed admin console, deployment guide, or governed workflow pack. That leaves Even with an appealing story for knowledge workers but limited public proof that the product is yet operationalized for scaled organizational rollout.'
