- id: trust-safety-quality
  title: Trust, safety, privacy, and quality controls
  body: Trust is where Even’s product thesis is both strongest and most incomplete. The camera-free design, no-subscription marketing, explicit 14-day return policy for non-prescription units, and cloud-consent language are meaningful public signals. Conversate also says it stores transcripts and summaries on the phone instead of voice recordings, which is directionally better than ambient cloud capture. But the compliance surface does not disappear just because the camera is gone. Legal sources still warn that transcription, workplace use, biometric data, and third-party AI processing can trigger consent, privacy, breach, or sector-specific obligations. Review coverage also shows a quality-control gap between the hardware vision and day-to-day software stability. Public materials surface ingress ratings, privacy statements, and an FCC note for the ring, but they do not surface the kind of third-party audits or enterprise-grade security attestations that risk-sensitive buyers would normally
    want before scaled deployment.
