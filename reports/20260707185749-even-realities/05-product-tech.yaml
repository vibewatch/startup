- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control area
  - Publicly visible mechanism
  - Status
  - Scope
  - Residual gap
  rows:
  - - Camera and speaker minimization
    - Camera-free, no-speaker hardware thesis
    - Visible
    - Reduces one major workplace and social-trust objection
    - Does not remove transcription or paired-phone AI processing risk
  - - Consent and transcription controls
    - Conversate activation gate plus settings to disable cues, summaries, or transcription
    - Visible
    - Improves user control over how the feature behaves
    - Still leaves consent and retention questions in regulated settings
  - - Data storage and cloud language
    - Official privacy language says no cloud storage without explicit consent and encrypted processing when needed
    - Visible
    - Meaningful consumer privacy posture
    - No public third-party audit or enterprise control evidence
  - - Physical durability and ingress
    - IP65 on G2, IP68 on R1, plus internal durability testing claims
