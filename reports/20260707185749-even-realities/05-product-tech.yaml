- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Public role
  - Key dependency
  - Reliability note
  - Risk or diligence gap
  rows:
  - - Optical engine and waveguides
    - Generate the binocular in-lens display with prescription compatibility
    - Proprietary HAO optics, custom lens stack, and frame packaging
    - Official sources are detailed, but third-party benchmarking is sparse
    - No retained public source names suppliers or yield metrics
  - - Frame, sensors, and microphones
    - Carry wearability, voice capture, compass input, and ingress protection
    - Magnesium, titanium, mics, IMU, geomagnetic sensor
    - Hardware story is strong and coherent across sources
    - One-size-fit and long-tail comfort variation are still public concerns
  - - Radio, processor, and left-right synchronization
    - Keep phone, ring, and both displays coordinated with low lag
    - Processor selection, BLE 5.4, antenna layout, and FPC link
    - Engineering notes claim major stability gains over G1
    - Actual field reliability still depends on phone and app conditions
  - - Companion app and AI stack
    - Handle orchestration, menus, prompts, summaries, and Even Hub installs
    - iOS or Android app plus Even LLM and partner models
    - This layer creates the most visible product upside and downside
    - No public admin tooling, uptime page, or audited security surface
  - - Charging, service, and support loop
    - Keep the product wearable every day rather than occasionally
    - Case design, pogo-pin alignment, support center, lens service
    - Seven-case-charge claim supports travel and daily carry behavior
    - No public defect, replacement, or RMA statistics
  notes: Architecture rows blend company-claimed design detail with reviewer observations; dependency names are public proxies, not a full bill of materials.
