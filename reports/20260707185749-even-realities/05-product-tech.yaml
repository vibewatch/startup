- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Even solution
  - Public benefit signal
  - Limitation
  rows:
  - - Presentation or keynote delivery
    - Phones, paper notes, and eye-contact breaks interrupt delivery
    - Teleprompt puts short scripts in-lens with ring or auto scrolling
    - Official teleprompt page emphasizes invisible display and natural eye contact
    - Still requires phone-side prep and does not solve broader meeting governance
  - - Multilingual meetings or travel
    - Phone translation breaks cadence and privacy
    - Translate shows text in-lens and lets the paired phone mediate two-way exchange
    - Official translation page promises 35-plus languages and dual-view text
    - Language support depth and noisy-environment performance are not independently benchmarked
  - - Live conversation support or note capture
    - People forget names, details, or next steps in fast discussions
    - Conversate adds transcript, cues, summaries, and prep notes
    - Reviewers agree the concept is useful when it works
    - Consent, freeze-ups, and transcription risk remain live issues
  - - Walking navigation
    - Phone glances while moving are awkward and socially noisy
    - G2 overlays turn prompts and a map fragment in-lens
    - Reviews say heading accuracy improved with the compass upgrade
    - Destination search and map quality still trail mainstream mapping apps
  - - Discreet glanceable notifications
    - Frequent phone checking breaks social flow
    - Dashboard and notification surfaces keep short text in peripheral vision
    - Multiple reviewers praise the incognito display behavior
    - Young UI customization and Bluetooth reliability still limit trust
  notes: Each row compresses multiple retained sources into a workflow-level judgment rather than a measured ROI claim.
