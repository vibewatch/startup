figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: G2 is best understood as a stacked system that begins with quiet in-lens text and ends with phone-linked orchestration and AI services.
  data:
    layers:
    - label: Wearer interface layer
      detail: Binocular text display, touch strips, ring gestures, and voice wake words create the observable user interface.
    - label: Optics and sensing layer
      detail: Waveguides, Micro LED projection, four microphones, IMU, and compass provide the physical input/output core.
    - label: Frame compute and transport layer
      detail: Processor, BLE 5.4 radio, antenna layout, batteries, and the left-right FPC keep the frame synchronized and connected.
    - label: Companion orchestration layer
      detail: The phone app handles setup, dashboards, scripts, destinations, summaries, and many active controls.
    - label: AI and ecosystem layer
      detail: Even LLM, partner models, transcripts, and Even Hub apps extend utility but also introduce external dependency and maturity risk.
  claimRefs:
  - CE011
  - CE012
  - CE016
  - CE017
  - CE022
  - CE025
  - CE043
- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: standard
  summary: The public workflow begins with a repeated communication or navigation pain point and succeeds only if the quiet-display experience stays reliable enough to replace habitual phone checks.
  data:
    nodes:
    - id: w1
      label: User enters a high-stakes or interruption-prone moment
      detail: Examples include a presentation, multilingual conversation, commute, or meeting.
    - id: w2
      label: Phone-first workflow creates friction
      detail: Looking down, breaking eye contact, or pulling a phone out reduces smoothness and privacy.
    - id: w3
      label: G2 overlays short text or cues in-lens
      detail: Teleprompt, Translate, Conversate, navigation, or notifications appear only when needed.
    - id: w4
      label: R1 or touch controls steer the interface
      detail: The ring is the preferred discreet control path when paired and charged.
    - id: w5
      label: Phone app saves or configures the session
      detail: Scripts, destinations, transcripts, and settings live mainly on the companion app.
    - id: w6
      label: Value persists only if connection and UI stay stable
      detail: Disconnects, install issues, and weak map data can break the workflow.
    edges:
    - from: w1
      to: w2
    - from: w2
      to: w3
    - from: w3
      to: w4
    - from: w3
      to: w5
    - from: w4
      to: w6
    - from: w5
      to: w6
