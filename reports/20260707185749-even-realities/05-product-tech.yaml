    - 14-day non-prescription returns, lens replacement help, support center, and warranty mentions
    - Visible
    - Improves buyer confidence for DTC purchase
    - Custom prescription orders still create friction and reserve questions
  - - Health and regulatory posture on R1
    - FCC-certified is claimed and wellness sensing is positioned as supportive, not medical
    - Partially visible
    - Enough for consumer marketing
    - No public medical validation or audited health-data governance surface
