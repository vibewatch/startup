    - No public BOM, failure-rate, or return-rate disclosure
  - - Even G2 B
    - Rectangular-frame variant for the same workflow set
    - Commercial
    - Lets buyers pick a more conventional business frame without changing the software stack
    - No public size-range expansion or multi-fit roadmap
  - - Even R1 ring
    - Discreet control plus basic wellness sensing
    - Commercial but still maturing
    - Makes control easier than tapping behind the ear and adds health metrics
    - Health analysis depth and charging stability are still questioned in reviews
  - - Even App + Even OS
    - Phone-side setup, content entry, settings, dashboard, and orchestration
    - Commercial
    - Keeps the glasses light by offloading orchestration to the phone
    - Phone dependency and Bluetooth stability remain key failure points
  - - Conversate / Translate / Teleprompt / Even AI
    - First-party workflow suite for knowledge work
    - Commercial
    - Text-first assistive workflows match the camera-free hardware thesis
    - No strong public proof yet of scaled enterprise deployment or admin controls
  - - Even Hub
    - Third-party application surface
    - Early commercial
    - Potential route to expand utility without changing hardware
    - Public evidence still shows thin docs, limited depth, and install friction
