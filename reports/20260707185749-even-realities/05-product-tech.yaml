- id: architecture-operating-model
  title: Architecture and operating model
  body: The strongest technical evidence is in the optics and systems packaging. Official materials describe a binocular Micro LED waveguide display with 640 by 350 resolution, 27.5 degree field of view, and 1200 nits brightness inside a 36 gram magnesium-and-titanium frame. Even’s engineering notes say G2 shrank the optical stack, reduced lens thickness, and improved passthrough while also redesigning radio layout and the left-right synchronization model. Critically, the operating model is not self-contained on the glasses. The glasses, ring, phone app, Bluetooth link, and cloud-linked AI stack work as one system. That architecture preserves comfort and style, but it also means product reliability depends on multi-device orchestration rather than on the frame alone. The case and docking design matter materially because the product is expected to live in daily circulation, not in occasional demo use.
