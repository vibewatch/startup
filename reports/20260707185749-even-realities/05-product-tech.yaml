  evidenceGaps:
  - type: missing-source
    severity: material
    topic: supplier-and-manufacturing-opacity
    missingEvidence: Named optical, lens, manufacturing, and fulfillment partners plus yield or remake-rate data for the G2 prescription stack.
    whyItMatters: Even’s moat narrative depends heavily on packaging and optical execution, but the public record does not show how concentrated or resilient that supply base is.
    diligencePath: Request supplier list, contract-manufacturer overview, defect and remake metrics, and any concentration analysis from management.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: enterprise-deployment-proof
    missingEvidence: Named enterprise customers, admin workflows, deployment guides, and any documented SLA or security-control package.
    whyItMatters: The public business route proves demand capture intent, but not that Even can support scaled organizational rollout with governance and support discipline.
    diligencePath: Ask for customer references, deployment playbooks, admin screenshots, procurement collateral, and renewal or expansion evidence.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: developer-surface-depth
    missingEvidence: Public SDK, API, moderation, install-success, or MAU-style artifacts for Even Hub developers and users.
    whyItMatters: Even Hub is the main public answer to ecosystem breadth, but current evidence is still mostly reviewer observation plus company narrative.
    diligencePath: Request developer docs, install-success metrics, app counts over time, curation policy, and examples of third-party apps with sustained usage.
    relatedQuestionRefs:
    - QE024
  - type: missing-source
    severity: material
    topic: security-and-compliance-audits
    missingEvidence: Any public SOC 2, ISO 27001, HIPAA assessment, penetration-test summary, or health-data governance certification for the current stack.
    whyItMatters: Camera-free industrial design helps, but privacy-sensitive buyers still need externally validated controls for transcription, storage, and third-party processing.
    diligencePath: Request security questionnaire responses, audit reports, vendor-subprocessor list, retention controls, and any regulated-industry deployment assessments.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
