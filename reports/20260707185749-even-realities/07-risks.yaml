- id: partner-dependency-and-execution-risk
  title: Partner, dependency, and execution risk
  body: Even's dependence stack is visible in the public record even if the contracts are not. The enterprise page is a lead form, the partner page centers a global channel network, Terminal Mode adds a laptop and phone dependency, and the privacy policy implies outside service providers in the data path. Those dependencies would be easier to underwrite if competition were static, but the category is accelerating. IDC says Meta already controls most Q1 2026 share and benefits from EssilorLuxottica's retail footprint. Android XR promises a broader OS and Gemini layer for glasses, while CNBC and TechNode show Rokid pushing display glasses internationally with more capital and larger shipment history. The execution overlay matters because Even has reportedly grown from roughly 30-40 employees in 2024 to 300-400 in 2026. That is fast enough to stretch management systems, QA discipline, support operations, and compliance ownership even before a formal enterprise motion is proven.
