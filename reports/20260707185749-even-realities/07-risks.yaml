company:
  name: Even Realities
chapter:
  number: 7
  title: Risks
  summary: Even Realities' biggest residual risks are legal and compliance exposure around transcription workflows, reliability and ecosystem fragility in a phone-tethered premium hardware stack, and a still-opaque financial model despite fresh July 2026 funding. The camera-free thesis reduces one class of trust risk, but the public record still leaves supplier concentration, enterprise readiness, governance structure, margin, and runway dependent on private diligence rather than public proof.
sections:
- id: ranked-risk-picture
  title: Severity-ranked risks and investment implication
  body: 'Even Realities has real demand signals, fresh capital, and a differentiated camera-free thesis, but the highest residual risks are not cosmetic. They cluster around compliance, product reliability, and disclosure opacity. The legal and compliance problem is not solved simply because the frame lacks a camera: transcription, translation, cloud-linked assistance, and workplace use still create consent, HIPAA, and processor-control exposure. The operational problem is similarly layered. The glasses, ring, phone app, Bluetooth path, accessories, and support system all have to work well enough to keep a premium hardware product from feeling brittle. Finally, the financing story is directionally positive but still incomplete. A $150 million pre-Series B round can fund time, not proof. Investors still cannot see margin, burn, runway, reserve policy, or partner concentration in public sources, so the current investment implication is conditional: interest remains justified only if diligence
    can turn the public narrative into verified compliance, reliability, and economic control.'
  claimRefs:
  - CR034
  - CR035
  - CR038
  - CR042
  - CR046
  - CR047
  - CR052
  tableRefs:
  - TR001
  figureRefs:
