- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Privacy / compliance
    - Formal complaint, regulator inquiry, or enterprise legal block
    - Any material inquiry or repeated enterprise deployment veto on consent grounds
    - Pause enterprise-upside assumptions until remediation and counsel clearance exist
  - - Reliability / support
    - Review-level connectivity and ring issues persist
    - Recurring disconnect, sync, or control complaints continue for two product cycles
    - Demand defect, warranty, and release-quality evidence before underwriting growth
  - - Supplier and yield continuity
    - Lead times, remake rates, or accessory failure rates worsen
    - Missed delivery or fit targets for custom optics and accessories
    - Lower margin assumptions and require contingency sourcing plan
  - - Platform breadth
    - Competitors close privacy narrative while keeping richer features
    - Meta or Android XR match trust posture without giving up cameras, audio, or ecosystem breadth
    - Compress adoption and pricing assumptions
  - - Enterprise conversion
    - Bulk-order funnel stays mostly exploratory
    - Quote volume rises but repeat deployments, SLAs, or named references do not
    - Strip enterprise upside from the case until proof appears
  - - Cash efficiency
    - Margin and runway remain opaque after diligence
    - Management cannot provide a credible post-round burn and gross-margin bridge
    - Move the investment stance toward research-more or avoid
  - - Execution bench
    - Leadership churn or compliance ownership stays unclear
    - Key functional owners are missing, changing, or unempowered
    - Lower confidence and wait for operating maturity
  - - Partner concentration
    - One channel, vendor, or phone-path dominates
    - A single partner or dependency becomes too large without backup coverage
    - Require diversification milestones before follow-on capital
  notes: Triggers are intentionally monitorable so they can be turned into diligence requests or post-investment reporting covenants rather than generic warnings.
