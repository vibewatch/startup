- id: operational-quality-and-security-risk
  title: Operational, quality, and security risk
  body: 'Operationally, Even is not selling a single self-contained gadget. It is selling a precision optical frame, a prescription workflow, a phone-dependent software layer, an optional smart ring, and a growing accessory and replacement catalog. That architecture creates many ways for quality to leak through to the user experience. Independent reviews consistently mention Bluetooth dependence, rough edges in the app or dashboard, awkward default controls, comfort variability, and ring bugs or immature health features. Even''s own catalog reinforces the point: separate cases, chargers, sleeves, and clip-ons all expand after-sales burden, while official policy language points to narrow cancellation windows for custom prescription orders. None of this disproves the product. It does, however, imply a hardware business where support load, remake rates, and accessory fulfillment can matter almost as much as the headline frame. Without private data on defects, returns, and service responsiveness,
    operational risk should be treated as material rather than incidental.'
