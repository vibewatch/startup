  evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-register-coverage
    missingEvidence: A jurisdiction-by-jurisdiction inventory of consent, venue, and complaint history across Even's major customer markets.
    whyItMatters: Public sources show category-level exposure but not a complete map of where Even has already encountered policy or legal resistance.
    diligencePath: Request counsel memos, customer complaint logs, and any regulator or venue correspondence tied to transcription, translation, or workplace bans.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: governance-and-entity-map
    missingEvidence: A consolidated board list, legal-entity chart, headquarters-by-function map, and responsibility split for contracting and privacy control.
    whyItMatters: Ambiguous entity structure complicates liability, contracting, tax, and compliance diligence for a cross-border hardware company.
    diligencePath: Request the current org and legal-entity chart plus board materials and intercompany data-processing responsibilities.
    relatedQuestionRefs:
    - QR024
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure-gap
    missingEvidence: SKU-level gross margin, burn, cash balance, runway, return reserves, and working-capital bridge after the July 2026 round.
    whyItMatters: Without private economics and liquidity data, investors cannot underwrite whether fresh funding is enough to absorb hardware, support, and competitive pressure.
    diligencePath: Request management accounts, monthly cash-flow bridge, inventory aging, reserve policy, and post-round operating plan.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR006
  - type: private-evidence-only
    severity: material
    topic: supplier-and-partner-concentration
    missingEvidence: Supplier roster, yield and lead-time metrics, channel mix, top-partner concentration, and contingency plans for optics, chargers, and prescription workflows.
    whyItMatters: Custom optics and accessories create continuity risk if any core supplier or channel is single-threaded.
    diligencePath: Request supplier concentration table, dual-source status, contract terms, and channel concentration by revenue and units.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR003
    - TR004
  - type: private-evidence-only
    severity: material
    topic: enterprise-readiness-gap
    missingEvidence: Security attestations, incident history, DPA package, admin-control screenshots, and regulated-workflow references.
    whyItMatters: Regulated or enterprise buyers will not rely on public marketing copy when evaluating workplace deployments that touch sensitive data.
    diligencePath: Request SOC or ISO evidence, incident register, BAA stance, DPA pack, and current enterprise admin-control materials.
    relatedQuestionRefs:
    - QR006
    - QR028
    relatedTableRefs:
    - TR002
    - TR004
