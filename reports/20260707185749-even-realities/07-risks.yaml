- id: financial-model-risk-and-diligence-gates
  title: Financial and model risk plus diligence gates
  body: 'The financial-model risk is less about whether Even can raise money and more about whether its public traction translates into durable economics before competition intensifies. Funding coverage gives the company time: the July 2026 pre-Series B reportedly brought $150 million at a $1 billion valuation, and multiple outlets say G1 surpassed 10,000 pairs sold. But the same public record still does not show revenue, gross margin, burn, runway, debt, warranty reserves, or working-capital dynamics. That is especially important because this looks like a premium hardware business with custom optics, support-heavy accessories, and real compliance obligations, not a clean software margin story. The correct mitigation is not generic caution; it is gated diligence. Investors should request unit-economics bridges, legal-compliance artifacts, supplier concentration maps, and support KPIs before letting the privacy-first narrative stand in for operating proof. If management cannot answer those
    asks credibly, the risk chapter should weigh heavily against underwriting a premium entry price.'
