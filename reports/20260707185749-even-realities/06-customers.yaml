- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - DTC website scale
    - Sales appear concentrated in owned checkout and support flows
    - High if DTC conversion, returns, or CAC weaken because the company controls most of the stack
    - Request revenue and order mix by DTC versus retail versus enterprise plus return and CAC by lane
  - - Optician channel for complex Rx
    - Progressive, prism, and high-touch fittings depend on partner-store coverage
    - Medium to high because optical complexity can cap conversion without local fit support
    - Request active partner count by market, Rx close rates, and partner economics
  - - Enterprise or institutional motion
    - Bulk-order form exists but no public account list, deployment guide, or admin-governance surface
    - High because public proof of land-and-expand is still thin
    - Request named institutional accounts, seat counts, rollout docs, and renewal or expansion histories
  - - Geographic concentration
    - U.S. users and Western markets dominate the visible proof base
    - Medium because regional concentration can make the growth story look broader than the retained evidence actually is
    - Request customer count, revenue mix, and repeat behavior by geography
  - - Product and ecosystem maturity
    - Thin app ecosystem, navigation friction, and R1 dependence can slow movement beyond early adopters and productivity specialists
    - Medium to high because reliability issues can interrupt the core workflow promise
    - Request feature-usage cohorts, defect or RMA data, and churn or return behavior by feature bundle
  notes: This table focuses on where expansion could work and where the current public evidence still points to concentration risk rather than diversified customer-quality proof.
