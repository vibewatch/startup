tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale signal
  - Strategic value
  - Main gap
  rows:
  - - Tech enthusiasts
    - Individual buyer, user, and payer
    - Try new privacy-first wearable workflows before mainstream polish arrives
    - Management still describes them as one of two core groups
    - Useful for launch buzz and early feedback loops
    - No disclosed revenue share or retention by enthusiast cohort
  - - Working professionals
    - Individual user with possible employer reimbursement
    - Presentations, meetings, captions, navigation, and quiet notifications
    - Management says this is the larger purchasing audience
    - Makes the product thesis look like a work tool rather than a toy
    - No seat-count, employer-reimbursement, or occupation mix disclosure
  - - Prescription wearers
    - Individual buyer via website or optician
    - Everyday glasses plus display utility
    - Official pages make prescription support central to the product story
    - Raises willingness to pay and pushes everyday-use behavior
    - No public prescription attach, remake, or optical-service margin data
  - - Public speakers and creators
    - Individual buyers and advocacy channel
    - Teleprompting, content creation, and conference use
    - Customer stories and creator page explicitly target this audience
    - Can generate word-of-mouth and showcase use-case clarity
    - No disclosed conversion from creator interest into paid demand
  - - Developers and agent-heavy power users
    - Developer user, mostly self-provisioned buyer today
    - Terminal Mode, Even Hub, and agent supervision
    - Public Terminal Mode and U.S.-developer share signal early traction
    - Could widen platform utility beyond first-party features
    - No public developer count, paid monetization, or retention data
  - - Retail and optician partners
    - Partner channel with end consumer as final payer
    - Demo, fitting, progressive/prism consultation, and local support
    - 169 try-on stores in 10 countries in 2024 plus ~300 Europe optician touchpoints in public claims
    - Essential for complex prescription conversion and trust
    - No channel sales mix, store productivity, or partner-margin disclosure
  notes: Rows synthesize management interviews, official pages, and partner disclosures; scale signals are what is publicly visible, not a full internal segmentation schema.
