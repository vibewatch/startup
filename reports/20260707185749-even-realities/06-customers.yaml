- id: named-proof-production-vs-pilot
  title: 'Named proof: real users, real limits'
  body: Named customer proof exists, but it is closer to executive or professional user storytelling than to enterprise deployment documentation. The strongest end-user examples are Declan Lynch of Zenu and Luis Buenaventura of GCash. Both describe real production workflows — teleprompt rehearsal, conference networking, crypto dashboards, video capture, stage prompts, and QuickNote-style memory support — and both describe repeat use rather than one-off demos. Channel proof is also visible through KJ Optometrists and Eyewear Optics in Singapore, which offer local demos, purchase assistance, and prescription fitting. That is better than logo-only marketing, but the evidence quality ceiling is obvious. These references are either company-authored stories or partner-authored retail pages. None disclose seat count, contract value, renewal behavior, or enterprise admin scope. So the public proof validates use-case fit and a real retail motion, but not scaled B2B deployment quality.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
