  title: Customer journey map
  type: journey-map
  layout: wide
  summary: The public customer path starts with a need for discreet workflow support, moves through either DTC or retail fitting, and only then has a chance to compound through repeat utility, advocacy, and developer or creator extensions.
  data:
    nodes:
    - id: j1
      label: Need recognition
      detail: Tech enthusiasts and working professionals seek privacy-first help for meetings, presentations, captions, or navigation.
    - id: j2
      label: Channel selection
      detail: The prospect chooses between DTC website checkout, partner showroom try-on, or bulk-order inquiry.
    - id: j3
      label: Configuration and fitting
      detail: Frame choice, prescription path, and optional R1 sizing add complexity before the product is actually usable.
    - id: j4
      label: Daily workflow use
      detail: Teleprompt, subtitle, dashboard, and quiet-notification use cases drive whether the product becomes part of the day.
    - id: j5
      label: Expansion loop
      detail: Advocacy, creator collaboration, partner demos, and Even Hub or Terminal Mode can widen the surface if reliability holds.
