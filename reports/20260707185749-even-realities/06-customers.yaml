- id: adoption-footprint-and-channel-coverage
  title: Adoption footprint and channel coverage
  body: 'Public adoption metrics are sparse, but the ones that exist are meaningful. Mobile World Live says Even exceeded its goal of selling more than 10,000 G1 pairs, which is enough to prove paid demand but not enough to infer active daily users or durable cohort quality. Official 2024 highlights add a more concrete offline signal: Even says G1 became available for in-store try-on in 169 stores across 10 countries. The channel record is strongest in Europe and the U.S. Yahoo says U.S. customers are more than half the user base, while Benzinga and SahmCapital say sales have been strongest across Europe and North America and that most sales still come from the website. Offline retail is framed around top-tier opticians, with roughly 300 Europe touchpoints in interview coverage, while Singapore partner pages show newer local demos and prescription support. The pattern is real distribution growth, but still without active-use, conversion, or door-productivity denominators.'
  claimRefs:
  - CU011
