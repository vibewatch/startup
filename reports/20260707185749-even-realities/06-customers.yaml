callouts:
- calloutType: strength
  title: Professional-use fit is real even if enterprise proof is not
  body: The customer record is not just gadget press. Management repeatedly describes working professionals as the larger audience, named users describe real production workflows, and Singapore retail partners show local fitting and demo capability. That combination is enough to underwrite genuine user-job fit in presentations, captions, and discreet notification workflows.
  claimRefs:
  - CU001
  - CU013
  - CU020
  - CU024
  - CU026
- calloutType: risk
  title: Durability and expansion quality remain public blind spots
  body: The customer story still fails a strict durability test. There is no public NRR, GRR, churn, or renewal disclosure; the review set keeps surfacing ecosystem and reliability friction; and channel concentration still points back to DTC checkout plus optician partners rather than clearly documented enterprise land-and-expand motion.
  claimRefs:
  - CU030
  - CU033
  - CU034
  - CU036
  - CU037
  - CU040
  - CU041
