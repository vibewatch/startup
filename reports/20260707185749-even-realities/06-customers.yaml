company:
  name: Even Realities
chapter:
  number: 6
  title: Customers
  summary: Even Realities has credible demand and channel-footprint signals for privacy-first smart eyewear, but the public customer record is still dominated by company-published individual-user stories and retail-partner pages rather than enterprise deployment or retention disclosures. The evidence supports more than 10,000 G1 pairs sold, strong U.S. and Europe concentration, and a real optician-assisted retail motion, while durability, repeat purchase, and enterprise expansion remain materially under-documented.
sections:
- id: segment-mix-and-buyer-shape
  title: Segment mix and who actually buys
  body: 'Even Realities is no longer describing the product as a gadget for hobbyists alone. In the Benzinga and SahmCapital interview versions, Will Wang says the company sees two user groups: tech enthusiasts and a second, larger cohort of working professionals. The occupations named there — executives, doctors, lawyers, and professors — matter because they point to a buyer who wants discreet workflow help, not face-worn entertainment. The public site reinforces that segmentation. Retail, store, prescription, subtitle, creators, enterprise-purchase, and Terminal pages all carve the surface differently: direct consumers, complex prescription buyers, accessibility users, creators, developers, and institutional prospects. That breadth is strategically positive, but it also shows how early the motion still is. Most personas are still being served through one commerce stack and one companion-app architecture, with only partner fitting and bulk-order intake separating institutional buyers from
    high-intent individuals.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
