- id: durability-repeat-usage-and-satisfaction
  title: Durability, repeat usage, and satisfaction visibility
  body: Retention and durability are the chapter's biggest blind spots. No reviewed public source discloses NRR, GRR, logo churn, renewal rates, average contract length, or even basic repeat-purchase data. The best available proxies are qualitative. Declan says he wears the glasses a few hours per day. Luis says Even G1 is his daily pair. Benzinga and SahmCapital say subtitle mode was added because users asked for it. Reviews also agree that teleprompting, captions, notifications, and quiet in-lens assistance can be genuinely useful when the system works. But the same review set is also where the durability ceiling shows up. Trusted Reviews flags a limited ecosystem and Bluetooth reliance. 9to5Google complains about phone-app friction. Android Police describes an uneven experience. PCMag and Geeky Gadgets keep the early-adopter caveat alive. Public evidence therefore proves engagement potential, not durable retention.
  claimRefs:
