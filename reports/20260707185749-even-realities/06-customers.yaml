- id: expansion-and-concentration-risk
  title: Expansion and concentration risk
  body: 'Expansion is plausible, but the current base is still concentrated around two motions: direct website sales and optician or retail partners. Management explicitly says most sales come from the website, and the support articles show why that matters: warranty eligibility, prescription submission, ring sizing, payment rails, and after-sales communication all sit inside the same owned commerce stack. At the same time, progressive and prism prescriptions require partner stores, so offline opticians are not optional edge cases — they are structurally necessary for a meaningful subset of buyers. The enterprise motion is thinner still. Bulk orders exist, but the public endpoint is a lead form, not a customer list, rollout surface, or governed admin environment. That leaves Even with a credible land motion into professionals, creators, and institutions, but concentration risk remains around DTC checkout, authorized retailers, and marketing-led reference stories rather than proven enterprise
    expansion economics.'
