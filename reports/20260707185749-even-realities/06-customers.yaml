  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, renewal rate, average contract length, and cohort retention by customer segment.
    whyItMatters: Without retention disclosures, the current customer proof can demonstrate workflow fit but cannot demonstrate durable economic quality.
    diligencePath: Request cohort retention, renewal, and churn cuts for DTC, retail-partner, and enterprise or institutional customers.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: enterprise-deployments
    missingEvidence: Named institutional or enterprise accounts with seat counts, rollout scope, admin controls, and renewal history.
    whyItMatters: The public evidence is dominated by individual professionals and retail partners, so enterprise durability remains underwritten on intent rather than proof.
    diligencePath: Request named bulk-order customers, deployment docs, seat counts, procurement paths, and renewal or expansion histories.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
  - type: missing-source
    severity: material
    topic: channel-mix-and-repeat-purchase
    missingEvidence: Revenue or order mix by DTC, authorized retail, and enterprise channels plus repeat purchase, R1 attach, prescription attach, and return rates.
    whyItMatters: Channel and attach economics determine whether Even is building a durable productivity eyewear base or a narrow early-adopter gadget business.
    diligencePath: Request cohort revenue by channel, attach-rate tables, returns or RMA by product, and reorder behavior for lenses, rings, and accessories.
    relatedQuestionRefs:
    - QU023
    - QU024
    - QU026
    relatedTableRefs:
    - TU002
    - TU005
  - type: stale
    severity: minor
    topic: retail-footprint-vintage
    missingEvidence: A 2026 update to the 169-stores-across-10-countries milestone and a current list of active optician or showroom locations.
    whyItMatters: The 2024 store-count milestone proves real offline presence, but it is not enough to judge current retail productivity or net expansion.
    diligencePath: Request the latest active retail-door count, by-country showroom list, and door productivity or demo-to-sale conversion metrics.
