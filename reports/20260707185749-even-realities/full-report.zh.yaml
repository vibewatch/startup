        - 目的地搜索和地图质量仍落后主流地图 app
      - - 隐蔽可瞥通知
        - 频繁看手机会打断社交流
        - 仪表盘和通知界面把短文本留在余光区
        - 多位评测者称赞这种隐身式显示
        - UI 自定义仍早期，Bluetooth 可靠性仍限制信任
