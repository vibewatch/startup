        title: 竞争对手画像、能力覆盖与定价
        blocks:
          - type: paragraph
            body: >-
              产品画像显示，市场正按待完成任务清楚分层。Ray-Ban Meta 是摄像头和音频在位者，优化方向是拍摄、助手入口和零售规模，而不是私密文本叠加。XREAL 更偏空间计算和巨幕，往往需要 Beam Pro
              或其他兼容设备才能解锁更完整体验。Rokid 和 RayNeo 在翻译、导航和提词上与 Even 重叠最直接，但两者也保留摄像头和更宽的 AR 式范围。Brilliant Labs 面向好奇开发者，推开源
              Halo 平台；Xiaomi 则停在更简单的音频优先一侧。定价也强化了这些差异：Even 的 $599 基础价加可选 $249 戒指，相比 Meta 入门价更高端，接近 Rokid 的 $599-$699
              档，低于 XREAL 更捆绑的空间计算套装。坦率看，Even 并不试图靠最宽功能数量取胜。它想赢的是：买家是否更偏好一件更安静、更适合处方的显示工具，而不是功能更丰富但社交或操作噪音更大的替代方案。
