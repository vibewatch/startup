        title: 信任、安全、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              信任是 Even 产品命题最强、也最不完整的地方。无摄像头设计、无订阅营销、非处方机型明确 14 天退货政策，以及云同意文案，都是有意义的公开信号。Conversate
              还称，它把转写稿和摘要存在手机上，而不是保存语音录音；这在方向上好过环境音云端采集。但摄像头消失，并不代表合规表面消失。法律来源仍警告，转写、工作场所使用、生物识别数据和第三方 AI
              处理，可能触发同意、隐私、数据泄露或行业特定义务。评测覆盖也显示，硬件愿景与日常软件稳定性之间存在质量控制缺口。公开材料展示了防护等级、隐私声明和戒指 FCC
              说明，但没有展示风险敏感买家在规模化部署前通常想看的第三方审计或企业级安全证明。
