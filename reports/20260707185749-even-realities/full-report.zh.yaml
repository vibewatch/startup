      - number: '7.4'
        title: 合作伙伴、依赖与执行风险
        blocks:
          - type: paragraph
            body: >-
              Even 的依赖栈在公开记录里已经可见，即使合同不可见。企业页是线索表单，合作伙伴页强调全球 渠道网络，Terminal Mode 增加了对笔记本电脑和手机的依赖，隐私政策也暗示数据路径中有外部
              服务提供商。如果竞争静止，这些依赖更容易被投资者评估；但品类正在加速。IDC 称 Meta 已控制 2026 年第一季度大部分份额，并受益于 EssilorLuxottica 的零售网络。Android XR
              承诺为眼镜带来 更广的 OS 和 Gemini 层，CNBC 与 TechNode 则显示 Rokid 正靠更多资本和更长出货历史向国际 市场推进显示眼镜。执行叠加层很重要，因为 Even 据称已从 2024
              年约 30-40 名员工增长到 2026 年 300-400 名。这样的速度足以拉扯管理系统、QA 纪律、支持运营和合规归属，即便正式 企业销售动作尚未被证明。
