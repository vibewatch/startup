chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Even Realities 更适合被理解成一家以显示为核心的智能眼镜创业公司，而不是泛 AI 硬件品牌。官方产品页描述出一套连贯产品栈：Even G2 眼镜、Even R1 伴侣戒指、实时翻译、提词，以及
              Conversate 转写 / AI
              提示，全部围绕一个目标设计——不加摄像头，也把数字辅助放进佩戴者视线里。这套产品逻辑很关键，因为它厘清了商业模式：公司网站销售高端硬件，线下配镜和伙伴渠道补位；这不是广告或内容采集生意。公司也似乎处在异常快速的早期增长阶段。公开报道显示，公司
              2023 年创立，2024 年发布 G1，2025 年末发布 G2，并在 2026 年 7 月以独角兽估值完成 pre-Series B。尚未解决的是总部身份。官方营销页没有给出单一 HQ
              口径；新闻报道指向深圳，法律页面则把义务导向香港和柏林实体。因此后续章节应沿用审慎身份框架：与中国有关、国际化分销，注册地尚未干净披露。
