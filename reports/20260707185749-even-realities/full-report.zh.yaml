      - number: '2.2'
        title: 用多重规模镜头，而不是单一 TAM 标题
        blocks:
          - type: paragraph
            body: >-
              现有 2026 年市场数字支持品类动能，但不能给出干净的 Even 专属 TAM。IDC 是最有决策价值的方向性来源，因为它区分了无屏眼镜和显示眼镜，显示两个细分在 2026
              年都在加速，并给出具体出货和收入标记。MarketResearch.com 发布的是宽得多的全球智能眼镜估计；XtendedView 则汇编出一个低得多的收入数字，也把它称为智能眼镜市场。CNBC 和
              TechNode 引用的 Omdia 数字又加一层，聚焦 AI
              眼镜出货增长，以及配备显示的产品在全球总量中仍然很小的占比。正确结论不是把这些数字取平均。它们使用不同边界、不同起始年份，也混合了不同的音频、摄像头和显示设备。规模测算仍有用，因为所有镜头都指向同一方向：2026
              年，智能眼镜正在变成真实品类。但证据还不能把这股宏观顺风转化成 Even 更窄的无摄像头专业切口的高置信 SAM 或 SOM。
