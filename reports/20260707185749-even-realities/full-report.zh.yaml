      - number: '4.3'
        title: 成本结构、毛利率驱动与营运资本负担
        blocks:
          - type: paragraph
            body: >-
              保留的来源集强烈暗示，Even 的成本基础比轻量 AI 助手叠加层更重。官方工程帖子描述了天线、处理器和电池干扰工作、镁钛镜架、处方集成光学，以及 36
              克可穿戴硬件带来的耐久取舍。戒指又加入氧化锆陶瓷、不锈钢、传感器，以及自己的充电 / 支持负担。评测随后补上运营余味：随机断连、戒指充电和连接问题、应用安装失败、AI
              失误、仪表盘毛刺，都意味着发货后仍有真实固件、QA、支持和替换成本。这些都不能证明毛利率弱，但说明利润率将取决于制造良率、支持效率和软件稳定性，而不是只取决于软件毛利率。


              营运资本和服务交付复杂度也可见。Even 自己的页面称，处方订单为定制，非处方订单可在 14
              天内退货，戒指可能晚于眼镜发货。这一组合会在任何公开烧钱数字出现前，就制造库存、准备金和现金转换压力。除此之外，Conversate、翻译和 AI
              记笔记功能还会带来云、数据处理和合规义务。法律来源明确指出，智能眼镜可能把数据推给第三方 AI 提供商，并造成同意和数据泄露通知暴露，这很可能增加持续的政策、供应商管理和法律成本。
