        - null
        - 低
        - 需要它把 2026 年 7 月融资从头条信号转成流动性月数
        - 要求提供月度烧钱、现金续航情景、债务时间表和财务契约文件包
    notes: 公共证据给出购物篮、销量和员工规模代理指标，但缺少搭建可靠单位经济模型所需的经典投资测算指标。
