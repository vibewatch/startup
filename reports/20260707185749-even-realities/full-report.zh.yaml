      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              正面案例真实但很窄。公开来源支持 Even
              拥有高端设备定价、有意义的套装加购、至少一条企业通道、可信的美国偏重早期需求，以及新近外部资本入口。公司不是躲在隐身状态里；它在卖有公开价格、公开渠道、公开评测和外部报道融资的真实产品。这足以相信它是真实业务，而不只是概念。


              但这仍不足以承销收入质量或利润率耐久性。投资人看不到收入、GMV、毛利率、退货率、附加购买率、CAC、回本、烧钱、跑道或债务。评测证据显示，软件稳定性和售后支持仍会影响交付体验；法律和市场证据则显示，隐私合规和价格竞争不太可能变得更容易。因此正确的财务结论应保持审慎：漏斗顶端需求和资本入口有希望，但转化引擎仍不透明，隐藏变量可能实质改变估值、利润率路径和融资需求。
