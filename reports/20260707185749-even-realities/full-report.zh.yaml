      - - 多语言会议或旅行
        - 手机翻译会打断节奏，也影响隐私
        - Translate 在镜片中显示文字，并让配对手机协调双向交流
        - 官方翻译页面承诺支持 35+ 种语言和双视图文本
        - 语言支持深度和嘈杂环境表现尚无独立基准测试
      - - 实时对话辅助或笔记捕捉
        - 快速讨论中，人们会忘记姓名、细节或下一步
        - Conversate 增加转录、提示、摘要和准备笔记
        - 评测者认同：功能跑通时，概念有用
