        title: 护城河耐久性、商品化风险与反向证据
        blocks:
          - type: paragraph
            body: >-
              Even 的护城河论点真实但很窄。它围绕隐私、专业场景可接受性、处方友好设计和「安静」脸部计算形成了连贯观点，而不是追求最大化 AR
              奇观。在敏感会议、演讲、多语言旅行或面客工作中，摄像头就是一种社交税，这种观点会有价值。风险在于，这条护城河由设计驱动，而不是生态驱动。IDC 已经显示 Meta
              主导品类份额，其余玩家分散；同一报告还预测，市场成熟后 ASP 会明显压缩。中国厂商迭代很快，Android XR 让 Google-Samsung 生态成为近期进入者；Google Glass
              的历史先例也说明，如果分销和软件支持衰退，技术新意并不足够。评测证据也以正确方式形成反向信号：Even 仍有软件不稳定、应用深度限制和导航缺口；竞品则能吸引想要音频、拍摄、更宽 AR
              或更大设备生态的买家。因此投资人应把 Even 的隐私优先切口视为有用定位优势，而不是持久赢者通吃防御力的证据。
