      - number: '3.3'
        title: 能力取舍、信任姿态与用户体验证据
        blocks:
          - type: paragraph
            body: >-
              公开评测把取舍讲得异常清楚。Even
              获得赞扬，是因为它看起来更像普通眼镜，避开了让部分买家不舒服的脸部摄像头，并用低调显示交付有用的字幕、通知和提示工作流。同样的克制也收窄了可寻址体验。评测者反复提到缺少扬声器、应用深度较浅、依赖
              Bluetooth、导航不稳，以及戒指或软件有毛刺。换句话说，Even 的差异化不在更宽的计算能力，而在于降低专业或日常场景中佩戴智能眼镜的社交和隐私成本。Meta、Google 和 Android XR
              位于光谱另一端：生态更大、助手和应用杠杆更强、拍摄或多模态能力更明显；但只要摄像头或常开收听功能引发顾虑，信任摩擦也更大。因此比较应保持诚实。Even
              的无摄像头设计在工作场所、旅行和会议中是有意义的信任优势，但还没有补上相对大平台的能力或生态差距。
