        - 处理编排、菜单、提示、摘要和 Even Hub 安装
        - iOS 或 Android app，加上 Even LLM 和伙伴模型
        - 应用与 AI 栈带来最显眼的产品上行，也带来最显眼的下行
        - 没有公开管理工具、正常运行时间页面或经审计的安全暴露面
