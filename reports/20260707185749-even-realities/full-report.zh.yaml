      - - 员工规模
        - 2026 年员工 300-400 人
        - 中
        - 可作为烧钱速度和运营复杂度的粗略成本基数代理
        - 要求提供全成本薪酬、承包商支出，以及相对于当前现金的招聘计划
      - - CAC / 回本周期
        - null
        - 低
        - 核心检验：高端设备增长是自我供血，还是持续吃资本
        - 要求按 DTC、零售和企业通道提供渠道级 CAC、转化、复购和回本周期
      - - 毛利率 / 贡献毛利
        - null
        - 低
