  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与产品线
        blocks:
          - type: paragraph
            body: >-
              Even Realities 卖的不是通用 AR 头显。公开产品表面更窄也更连贯：一个无摄像头、显示优先的眼镜系统，把短文本、提示和控制放进外观普通的处方眼镜里。从客户工作流看，G2
              想替代反复看手机的循环：推介前、多语言会议中、在陌生城市导航时，或在对话后捕捉谈话要点时。产品线也有意模块化。G2 A 和 G2 B 以同一基础价格给买家两种镜架轮廓；可选 R1
              戒指加入低调控制和基础健康感知，但不改变眼镜的核心命题。用户越看重隐私、低调和处方就绪，而不是媒体播放或第一人称拍摄，这条产品线越有效。
