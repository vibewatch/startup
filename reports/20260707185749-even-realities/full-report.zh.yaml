      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公司概览负责更长融资时间线，但财务章节仍要回答前瞻问题：是否有足够公开证据相信 Even 的融资足以支撑当前计划？当前答案只能说方向性上是。多家 2026 年 7 月媒体一致称，Even 完成 $150
              million pre-Series B 融资，估值 $1 billion，资金用途包括下一代平台、更深 AI 能力、国际扩张和更快产品开发。对一家 2023
              年创立、员工数已经快速增长，并试图同时支撑光学、AI、渠道扩张和国际运营的硬件公司来说，这是一个有意义的资本事件。


              承销问题在于，这轮融资是信号，不是跑道模型。保留的公开来源没有给出投后现金余额、月度烧钱、跑道月数、债务时间表、契约包或营运资本桥。与此同时，市场和竞争证据显示，Even
              正在扩张进入一个巨头和资金充足挑战者能承受更长期亏损的品类。Meta 的 2025 年 10-K 明确把 AI 眼镜放入可穿戴业务努力中，并称 Reality Labs 让 2025 年运营利润减少约
              $19.19 billion，预计 2026 年亏损仍将相近。这不意味着 Even 需要 Meta 级资本，但意味着竞争参照集对重补贴很适应。
