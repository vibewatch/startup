  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出、邻近领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              尽调第一步，是定义 Even Realities 究竟处在什么市场。公开证据不支持把它塞进一个无差别的「智能眼镜」桶里。IDC、Android
              XR、Meta、XREAL、Rokid、RayNeo、Xiaomi，以及 Even 自己的产品页都显示，这个品类至少正在分裂成三种商业形态：无屏 AI /
              音频或摄像头眼镜，以显示为核心、带翻译或提词功能的智能眼镜，以及更重的 AR 或空间计算伴侣。对 Even
              而言，纳入支出应集中在高端、支持处方的显示眼镜，翻译和提词工作流，伴侣戒指等配件，以及让这些任务有用的手机连接软件层。应排除的支出包括商品化耳机、没有计算层的传统光学镜架、完整 VR
              头显，以及没有迁移到眼镜上的一般智能手机支出。现状替代方案仍很强：手机加耳机、提词器应用、翻译应用、便签，以及对手的摄像头眼镜，都能解决同一问题的一部分。因此，Even 的无摄像头、显示优先定位，比宽泛的「可穿戴
              AI」说法更重要。
