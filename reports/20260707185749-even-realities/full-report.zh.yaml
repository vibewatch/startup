      - number: '2.5'
        title: 应保持未解的尽调缺口和互相矛盾的估计
        blocks:
          - type: paragraph
            body: >-
              本章应有意保留几个未解问题。第一，公开市场估计冲突足够大，宽口径 TAM 数字应被当作方向性镜头，而不是可混合的事实基础。第二，已审阅来源没有分离出一个厂商中立的 SAM 或
              SOM，用于无摄像头、专业、文本入眼的智能眼镜。Even 自身定位清楚，但公开企业页没有展示管线、案例经济性、预算所有者或部署数量。第三，品类份额数据仍不稳定。IDC 显示 Meta 主导 2026 年 Q1
              出货；CNBC 引用 Omdia 的报道则称，尽管中国需求似乎更偏提词和中央显示用例，显示眼镜在全球总量中仍只占小份额。因此尽调要求很具体：投资人需要私有证据，说明企业转化、重复使用留存、渠道终端销售，以及
              Even 的需求有多少来自愿意为隐私优先、文本入眼工作流付费的专业人士，而不是来自拉动市场标题数字的更广泛摄像头消费热潮。
            claimRefs:
