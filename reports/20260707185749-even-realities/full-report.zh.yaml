        title: 里程碑、分销与风险信号
        blocks:
          - type: paragraph
            body: >-
              公开里程碑显示，公司在产品、渠道和定位上推进很快。官方 2024 年要点确认，G1 于 2024 年 6 月发布，9 月亮相 Silmo Paris，11 月扩展到 G1 B，12 月已在 10 个国家的 169
              家门店提供试戴。到 2025 年 5 月，管理层已经在讨论约 300 个欧洲一线验光师点位、强劲直营网售，以及后续发布路线图；到 2026 年 7 月，外部报道已把 G2 定价放在 $599，伴侣 R1 戒指定价
              $249。战略主线很清楚：Even Realities
              想卖一副外观正常、支持处方的眼镜，只是眼镜里带着安静的数字辅助。这让它区别于摄像头主导的对手，也解释了公司为什么重视零售。但风险信号仍然真实存在。法律评论仍提醒，AI 智能眼镜会带来同意、监控和数据安全问题，因此
              Even 的无摄像头架构和欧洲数据保护叙事降低了风险，却没有消除风险。
