  - id: TI004
    title: 资本充足性表
    columns:
      - 资本项目
      - 公开数值 / 状态
      - 含义
      - 下一轮触发因素 / 义务视角
      - 尽调问题
    rows:
      - - 最新融资
        - 2026 年 7 月以 $1 billion 估值完成 $150 million pre-Series B 轮融资
        - 确认仍能拿到投资人资金，也有足够规模支持路线图扩张
        - 本身不是触发因素，但会重置外界对增长和平台执行的预期
        - 要求提供交割文件、投资人权利和交割后现金余额
      - - 计划资金用途
        - 下一代平台、更强 AI、更广国际布局、更快产品路线图
        - 表明现金会投向产品和地域扩张，而不只是营运资金
        - 如果这些项目超支，公司可能比公开投资人预期更早需要下一轮融资
        - 要求提供里程碑预算、月度现金计划和下行情景招聘方案
      - - 手头现金
        - 2026 年 7 月融资后没有留存的公开数字
        - 流动性投资判断中最大的即时盲点
        - 没有现金数，烧钱速度无法换算成现金续航或财务契约余量
        - 要求提供交割时资金快照和当前不受限现金
      - - 烧钱 / 现金续航
        - 未公开披露
        - 外部无法判断路线图和员工规模会多快消耗资本
        - 可能是下一轮融资的关键触发因素，但公开来源没有量化
        - 要求提供 18 个月运营计划、烧钱拆解，以及基准 / 上行 / 下行现金续航
      - - 债务 / 项目融资义务
        - 未留存公开披露
        - 供应商融资、库存授信或其他隐藏现金索取权是否存在，仍无法排除
        - 若存在，可能提前推高融资需求；但公开证据没有信息
        - 要求提供债务时间表、供应商信用条款、担保和表外承诺
      - - 竞争资本环境
        - Meta 继续消化 Reality Labs 数十亿美元亏损；Rokid 正在探索 IPO 级融资
        - Even 正进入一个对手能长期拿补贴作战的品类
        - 如果软件变现成熟前价格压力加剧，Even 可能需要后续资本
        - 要求管理层说明价格战、毛利率底线和下一次融资触发因素的看法
    notes: 本表刻意把可观察的融资头条，与判断现金续航所需但缺失的资金和义务数据分开。
