        - 镁、钛、麦克风、IMU、地磁传感器
        - 各来源中的硬件叙事强且一致
        - 单一尺寸适配和长尾舒适度差异仍是公开担忧
      - - 无线、处理器和左右同步
        - 让手机、戒指和双侧显示以低延迟协同
        - 处理器选择、BLE 5.4、天线布局和 FPC 连接
        - 工程说明称，稳定性较 G1 大幅提升
