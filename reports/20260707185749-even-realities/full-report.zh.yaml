    sections:
      - number: '7.1'
        title: 按严重性排序的风险与投资含义
        blocks:
          - type: paragraph
            body: >-
              Even Realities 有真实需求信号、新资本，也有区别于同业的无摄像头论点，但最高的剩余风险并不 是外观问题。风险集中在合规、产品可靠性和披露不透明。镜框没有摄像头，并不意味着法律和
              合规问题就被解决：转录、翻译、云端联动协助、职场使用，仍然会带来同意、HIPAA 和处理方 控制风险。运营问题也同样多层。眼镜、戒指、手机 app、Bluetooth 链路、配件和支持体系，都
              必须足够稳定，才不至于让一款高端硬件显得脆弱。最后，融资故事方向上正面，但仍不完整。 $150 million Pre-Series B 轮能买来时间，买不来证据。投资者在公开资料里仍看不到毛利率、
              现金消耗、现金跑道、准备金政策或合作伙伴集中度，因此当前投资含义是有条件的：只有尽调 能把公开叙事转化为可验证的合规、可靠性和经济控制，继续关注才合理。
