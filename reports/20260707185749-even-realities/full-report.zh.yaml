  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价与确认可见度
        blocks:
          - type: paragraph
            body: >-
              在保留的公开记录里，Even Realities 看起来不像一家经常性软件公司。公司自己的电商页面让变现栈显得以交易和硬件为主：G2 眼镜标价 $599，单光镜片起价 $159，伴侣 R1 戒指标价
              $249，企业需求被导入报价表单，而不是公开合同卡片。零售和验光师页面又给出一个线索：Even
              对标准消费者订单依赖直接结账，同时用实体伙伴解决试戴、渐进镜片试配和分销触达。这是合理的多渠道设置，但仍更接近高端设备电商，而不是可见的订阅 ARR。


              定价证据强于收入确认证据。官方页面清楚披露标价、通过 Klarna 提供融资支持、FSA/HSA 报销文案、定制处方处理，以及非处方产品 14 天退货窗口。它们没有披露实现
              ASP、折扣率、附加购买率、套装会计、退货准备金，或多件订单在戒指晚于眼镜发货时如何确认收入。因此公开结论很窄但有用：标价真实，附加销售合理存在，会计复杂性也存在，但单靠公开材料无法判断收入质量。
