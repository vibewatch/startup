      - number: '8.5'
        title: 最终尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >-
              最终决策应由缺失证据来设闸，而不是由外观或产品新鲜感驱动。Even 有足够可见信号值得严肃 尽调：真实定价、真实评测、真实品类增长，以及一轮显示外部投资者兴趣的新融资。但它缺少的
              是能单独支撑溢价的公开会计数据。投资者在以高于当前标价付款前，应要求股权结构桥、优先股 条款、毛利结构、现金消耗跑道、退货率和重做率、企业漏斗，以及任何能证明合作伙伴和支持 复杂度可控的证据。


              投资论点还需要明确的失效条件。高端、隐私优先的可穿戴设备，如果 Bluetooth 依赖、app 深度、 退货或支持负荷压过产品价值，经济上仍会失败。如果 Meta、Android XR、Rokid 或
              XREAL 弥合 信任或工作流差距，同时保持更好分销或更低价格，战略上也会失败。管理层若无法用私有证据排除 这些路径，正确动作是跟踪公司，而不是追逐标题估值。
