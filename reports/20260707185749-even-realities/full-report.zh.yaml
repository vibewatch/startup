      - number: '8.3'
        title: 牛市、基准、熊市情景及明确估值区间
        blocks:
          - type: paragraph
            body: >-
              下方情景区间是估算，不是隐藏的财务真相。它们根据当前轮次定价、2026 年市场增长证据、公开 竞品经济性和风险调整后的执行推导，而不是来自已披露收入倍数，因为 Even 尚未公开披露收入、
              毛利率或现金消耗。这迫使分析采用里程碑视角。牛市情景假设，隐私优先差异化仍有价值，附加 销售和配件变现保持完整，企业与合作伙伴渠道开始转化，销量上升时支持负担仍可控。沿着这条
              路径，公司可以证明相对当前标价的溢价。


              基准情景更保守：需求真实，品类继续增长，但巨头平台竞争、支持成本和缺失的财务透明度，会 压住估值快速重估。熊市情景假设，高端用户付费意愿持平或恶化，Meta 或 Android XR 带来生态
              挤压，或者支持与合规负担迫使未来轮次以更差条款完成。因此，下行触发条件至少和上行叙事一样 重要。
