      - number: '7.2'
        title: 监管、法律与安全风险
        blocks:
          - type: paragraph
            body: >-
              法律风险不只是传统硬件保修审查。Even 自己的隐私和法律页面已经承认，产品会触及第三方 服务、跨境数据处理、场馆规则和不同同意制度。独立法律评论进一步放大了框架：AI 智能眼镜
              可能带来违规通知风险、处理方控制问题、受监管场景下的 HIPAA 暴露，以及取决于工作流和 司法辖区的生物识别或窃听法风险。Even 的无摄像头设计确实重要，因为它拿掉了旁观者焦虑的
              显眼来源，但它不能消除实时转录、上下文捕捉或职场政策反对。公共安全立场也必须谨慎。 Even 自己提醒用户，不要在与界面交互时开车；NHTSA 也把操作导航视为分心驾驶。因此正确的
              投资判断不是假设法律灾难，而是要求真正的尽调材料：同意设计、供应商图谱、事件历史、法律 实体清晰度，以及受监管工作流控制包。
