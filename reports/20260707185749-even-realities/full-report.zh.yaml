      - number: '8.2'
        title: 当前轮次背景、价格支撑与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开证据确实支持一次真实融资事件和真实产品栈的存在。多家 2026 年 7 月媒体报道指向同一个 标题：融资 $150 million、估值 $1 billion，无摄像头 G2 定价 $599，配套戒指定价
              $249。 公司也展示批量订单和合作伙伴触点，意味着至少能看到它尝试跳出单一 DTC 结账流程。这足以 证明值得继续做功课。


              但这不足以得出 $1 billion 标价有吸引力的结论。同一组公开记录没有披露投后股数、清算优先权、 期权池扩张、老股转让比例，或任何能让投资者把标题估值换算成普通股等效经济性的运营数字。
              因此正确的入场纪律是不对称的：要么确认私有尽调包仍能支撑 4 到 5 年持有期内好于约 2.5x 毛 MOIC 的结果，要么坚持更低的有效入场价格。没有这些证据，当前轮次应被视为最明确的市场
              出清价，而不是低估证据。
