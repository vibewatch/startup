      - number: '7.5'
        title: 财务与模型风险，以及尽调闸门
        blocks:
          - type: paragraph
            body: >-
              财务模型风险的重点，不在于 Even 能不能融资，而在于公开牵引力能否在竞争加剧前转化为 耐久经济性。融资报道给了公司时间：2026 年 7 月 Pre-Series B 轮据称融资 $150 million，
              估值 $1 billion；多家媒体称 G1 销量超过 10,000 副。但同一组公开记录仍没有显示收入、 毛利率、现金消耗、现金跑道、债务、保修准备金或营运资本动态。这一点尤其关键，因为这看
              起来是一门高端硬件生意，带有定制光学、重支持配件和真实合规义务，而不是干净的软件毛利 故事。正确的缓释不是泛泛谨慎，而是把尽调设成闸门。投资者应要求单位经济性拆解、法律合规 材料、供应商集中度图谱和支持
              KPI，不能让隐私优先叙事替代运营证据。如果管理层无法可信回应 这些要求，本章风险就应在高价入场的投资判断中占很大权重。
