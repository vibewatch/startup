      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Even 卖的不是一个自成一体的小工具。它卖的是精密光学镜框、配镜流程、依赖手机的 软件层、可选智能戒指，以及不断扩大的配件和替换件目录。这个架构给质量问题留下很多渗入 用户体验的入口。独立评测反复提到
              Bluetooth 依赖、app 或仪表盘打磨不够、默认控制别扭、 舒适度不一，以及戒指 bug 或健康功能不成熟。Even 自己的目录也强化了这一点：独立眼镜盒、
              充电器、镜套、夹片都会扩大售后负担；官方政策措辞还显示，定制处方订单的取消窗口很窄。 这些都不能否定产品。它确实说明，硬件业务里，支持负荷、重做率和配件履约的重要性，几乎
              可以接近主打镜框本身。没有缺陷、退货、服务响应速度的私有数据，运营风险就应被视为实质性 风险，而不是附带问题。
