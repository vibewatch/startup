              最新一轮融资的公开证据较强，但更宽的资本结构图景仍很薄。多家独立媒体一致称，Even Realities 在 2026 年 7 月完成 $150 million pre-Series B 融资，估值 $1
              billion，由 Meituan 领投，Tencent 也参投。Yahoo 还点名 Sequoia China、CDH Investment、Monolith Management 和 CVC Capital
              是早期投资方；Yahoo 与 Mobile World Live 均称资金将投向下一代平台、更多 AI 能力、国际扩张和更快的产品开发。公开规模披露更窄。媒体称员工数从 2024 年约 30-40 人扩张到
              2026 年的 300-400 人，管理层称 G1 销量超过 10,000 副。地理数据也补充了轮廓：据称超过一半用户和约 80%
              开发者在美国，制造仍留在中国。但后续承销仍需要私有数据：累计融资、债务、收入、毛利率，以及管理层口径的客户定义。
