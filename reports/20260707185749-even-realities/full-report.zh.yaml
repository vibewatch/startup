      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              最强的技术证据在光学和系统封装。官方材料描述了一块双目 Micro LED 波导显示，分辨率 640 by 350、视场角 27.5 度、亮度 1200 nits，放进 36 克镁钛镜架。Even
              的工程笔记称，G2 缩小了光学栈、降低镜片厚度、改善透视效果，同时重做无线布局和左右同步模型。关键在于，运营模型并不由眼镜自给自足。眼镜、戒指、手机应用、Bluetooth 链路和云连接 AI
              栈作为一个系统工作。这样的架构保留了舒适和风格，但也意味着产品可靠性取决于多设备编排，而不只取决于镜架。眼镜盒和底座设计也很重要，因为产品预期要进入日常循环，而不是偶尔演示。
