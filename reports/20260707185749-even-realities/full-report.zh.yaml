        - 要求按眼镜、镜片、戒指、配件和企业订单提供月度收入和毛利率
      - - 加购率和退货 / 重做率
        - 没有这些数据，$1,000 购物篮信号可能夸大可持续的实际收入
        - 要求按客群提供加购，以及退货、重做和保修损失历史
      - - 按渠道划分的 CAC、销售周期和回本
        - 没有这些数据，DTC、伙伴和企业增长可能看起来健康，却在消耗现金
        - 要求按通道提供漏斗转化、媒体投放、辅助销售成本和回本周期
      - - 手头现金、烧钱、现金续航和债务
        - 没有这些数据，$150 million 融资无法转成偿债能力或下行韧性判断
        - 要求提供当前资金报告、月度烧钱拆解、现金续航情景和债务时间表
      - - 库存和营运资金机制
        - 没有这些数据，投资人无法判断定制光学、错峰发货和退货会不会在销量上升时吃掉现金
        - 要求提供库存周转、供应商条款、应收款、退货准备和现金转换周期
      - - 合规和支持成本负担
        - 没有这些数据，隐私、AI 处理和售后软件支持成本可能被低估
        - 要求提供法律 / 合规预算、支持工单数据、更换率和供应商 AI 处理成本
    notes: 这些具体缺失输入，使 Even 即便有可见定价和融资证据，也仍无法通过严格的公开投资测算标准。
