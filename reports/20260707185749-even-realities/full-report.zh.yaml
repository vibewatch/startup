        - 智能眼镜增长在加速，2026 年看起来像放量年。
        - Meta 已经主导份额时，增长也抹不掉集中度风险。
        - 非 Meta 份额持续提升一年，且细分边界更清晰。
      - - 产品
        - 无摄像头、低打扰的工作流价值是真差异化。
        - 如果 app 深度和可靠性落后，差异化仍可能太窄。
        - cohort 数据显示，即使范围更窄，重复使用仍高、流失仍低。
      - - 客户
        - 公开评测显示，提示、翻译和静默通知确有使用场景。
        - 如果支持负担或粗糙体验持续，溢价支付意愿可能消退。
        - 可量化留存、低退货率，以及每周使用扩大的证据。
      - - 财务
        - 新一轮 $150 million 融资买来时间，也显示投资人胃口。
        - 没有公开收入、利润率、burn 或 runway 数据可支撑精确投资测算。
        - 经审计或董事会级运营数据验证经济性。
