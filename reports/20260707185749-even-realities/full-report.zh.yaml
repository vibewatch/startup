      - number: '2.4'
        title: 增长驱动、采用约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              这个品类有真实增长驱动。IDC 显示出货增长加速，Android XR 证实大平台正在投入 OS 和应用，Meta 仍设定消费者规模基准，Rokid、RayNeo 等中国厂商也把带翻译、导航和 AI
              助手的显示型产品推向市场。更好的光学、更轻的镜架、处方支持和应用生态，都会扩大买家尝试这种形态的意愿。但估值同样要看约束。多家独立评测仍把智能眼镜描述为早期采用者产品，在阳光可读性、舒适度、电池、应用深度和工作流可靠性上都要取舍。隐私和信任仍是品类级瓶颈，因为法律来源反复回到同意、工作场所限制，以及摄像头、麦克风、转写和生物识别带来的风险。Even
              的无摄像头设计在这个维度上有帮助，但也拿掉了更大众市场对手用来拉动需求的一些媒体采集和音频价值主张。承销含义是：Even 在敏感场景里可能更契合信任需求，但整个品类仍在从好奇心转向可靠的日常行为。
