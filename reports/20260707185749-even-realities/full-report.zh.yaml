      - - 渠道转化不足
        - 企业和合作伙伴触点存在，但无法转化为付费部署或复购订单
        - 削弱乐观情景中的分销扩张支柱。
        - 将公司视为更窄的 DTC 硬件押注，并下调估值。
      - - 股权结构压力
        - 优先权、参与权或期权池变化实质稀释普通股等价持股
        - 使本轮标题估值夸大新投资人的真实上行空间。
        - 重新核保入场价格，或直接放弃。
      - - 平台挤压
        - Meta、Android XR 或相邻同业在保持更强分销或更低价格的同时缩小工作流差距
        - 压缩隐私优先切口和未来定价权。
        - 将估值标向悲观情景。
      - - 合规失败
        - 尽调中发现隐私控制薄弱、第三方 AI 治理缺口，或监管工作流反对意见
        - 抬高企业采用摩擦和声誉下行风险。
        - 除非补救完成，否则建议转为回避。
    notes: 终止触发因素被设定为可证伪的承销信号，而不是泛泛的公司风险。
    claimRefs:
      - CV027
      - CV030
      - CV041
      - CV042
      - CV048
      - CV053
      - CV055
      - CV057
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表与优先权
        - 投后持股、清算优先权、参与权、反稀释和老股交易组合
        - 判断公开标题估值是否匹配真实普通股等价上行空间。
        - 管理层 + 律师资料室审阅。
      - - 毛利率与烧钱速度
        - SKU 毛利瀑布、月度烧钱速度和本轮后的现金跑道
        - 这是判断当前估值只是合理还是过高的必要证据。
        - 财务团队月度账目和董事会材料。
      - - 退货与保修负担
        - 按眼镜、戒指和配件 SKU 拆分的退货、返工、缺陷和保修率
        - 高端硬件看起来诱人，直到售后成本抹掉毛利。
        - 运营仪表盘和支持分析。
      - - 企业转化
        - 管道规模、成交率、部署规模，以及续约或扩张证据
        - 区分表层企业意向和可持续 GTM 证明。
        - 销售 CRM 和客户访谈。
      - - 隐私与合规控制
        - 数据流图、第三方 AI 供应商清单、事故记录和受监管用途限制
        - 没有真实合规材料包，品类风险会显著升高。
        - 法务、安全和产品控制审查。
      - - 渠道经济模型
        - 按渠道拆分的零售与合作伙伴折扣、培训成本和支持负担
        - 合作伙伴规模可能增值，也可能损害价值，取决于服务强度。
        - 渠道管理审查，并结合队列经济模型。
    notes: 这些问题构成最低限度的非公开尽调包，能把观察名单兴趣推进为充分核保的估值判断。
    claimRefs:
      - CV043
      - CV044
      - CV053
      - CV056
      - CV057
      - CV061
