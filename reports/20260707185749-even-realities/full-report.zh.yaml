      - number: '4.2'
        title: GTM 动作、牵引力代理与销售效率边界
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 证据指向混合动作，而不是单一干净漏斗。Even
              通过消费者配置器、零售和验光伙伴，以及一个收集组织详情并承诺定制定价的企业询价页面销售。这意味着至少三种非常不同的获客动作：直接响应电商、辅助型渠道销售，以及顾问式企业通道。最有用的公开效率代理，是 Yahoo
              Finance、The Daily Star 和 9to5Google 报道的平均订单规模信号：一旦加入处方镜片或戒指，平均交易额会接近约 $1,000。这不能证明 CAC
              回本健康，但说明公司试图货币化一笔生态订单，而不只是 $599 的基础镜架。


              牵引力可见度仍不完整。最新融资报道称，公司 2023 年创立，2025 年 11 月推出 G2，G1 销量超过 10,000 副，并从 2024 年约 30 到 40 名员工扩张到 2026 年 300 到
              400 名。Yahoo 和 Mobile World Live 还称，超过一半用户和约 80% 开发者在美国。新的官方工作流帖子和客户故事强化了同一个生产力优先定位：Even 营销 Terminal
              Mode，用于离开桌面时监督 AI agent 工作；已发布故事则展示专业人士用 G1 提词、监控信息流和处理会议工作流。这些不是收入披露，但支持一种判断：Even
              卖的是工作效用，而不是摄像头主导的娱乐。投资人能看到动作，看不到效率。
