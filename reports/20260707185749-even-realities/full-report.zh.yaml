      - number: '1.2'
        title: 领导层、治理与关键人风险
        blocks:
          - type: paragraph
            body: >-
              领导层透明度在创始人层面明显好过治理层面。多篇 2025-2026 年资料把 Will Wang 标为创始人兼 CEO，并把他与此前在 Apple 参与 Apple Watch 和 iPhone
              的经历联系起来；官方材料则强调团队来自 Apple、Samsung、Philips、Mykita 和 Lindberg 的更广泛经验。公司还强调与 Dr. Qu Jia
              及眼科团队合作，说明光学和医疗可信度是品牌叙事的有意组成部分。相比典型消费硬件创业公司，这让 Even Realities
              拥有更强的创始人-市场匹配，因为公开记录覆盖供应链、光学、工业设计和处方眼镜考量。下行面在于集中度和不透明。已审阅来源没有公布董事会名单、独立董事结构或更深的高管梯队，也没有显示重大领导层变化。投资人不应把这读成连续性干净的证据，而应把它视为提醒：公司对
              Wang 的关键人依赖仍高，治理披露落后于产品披露。
