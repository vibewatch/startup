            body: >-
              Even Realities 已不再只把产品描述成给发烧友的玩具。在 Benzinga 和 SahmCapital 的采访版本中，Will Wang
              称公司看到两类用户：科技爱好者，以及第二个更大的职业人士群体。那里点名的职业——高管、医生、律师和教授——很重要，因为它们指向的买家想要低调的工作流辅助，而不是脸上佩戴的娱乐。公开网站强化了这种分层。零售、门店、处方、字幕、创作者、企业采购和
              Terminal
              页面分别切开不同表面：直接消费者、复杂处方买家、无障碍用户、创作者、开发者和机构潜在客户。这种宽度在战略上是正面的，但也显示动作仍早。多数用户画像仍由同一套电商栈和同一伴侣应用架构服务；机构买家与高意向个人之间，主要只靠伙伴试配和批量订单入口区分。
