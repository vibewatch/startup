        - 让产品每天都能戴，而不是偶尔能用
        - 充电盒设计、pogo-pin 对位、支持中心、镜片服务
        - 充电盒可充七次的说法支持旅行和日常携带场景
        - 没有公开缺陷、更换或 RMA 统计
