  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 推荐意见从真实市场和产品证明出发，进入财务不透明，再落到谨慎的估值立场。
    data:
      nodes:
        - id: n1
          label: 品类增长存在
          detail: 2026 年市场来源显示，智能眼镜在扩张，而不是停滞。
        - id: n2
          label: 产品和客户证明存在
          detail: $599 的 G2、$249 的戒指、真实评测，以及 1 万副以上已发货证明，说明业务有实质。
        - id: n3
          label: 竞争很重
          detail: Meta 主导份额，Android XR 加上中国同业抬高生态压力。
        - id: n4
          label: 财务披露稀疏
          detail: 收入、利润率、烧钱、现金可支撑期和轮次条款仍未公开披露。
        - id: n5
          label: 当前估值标记并不明显便宜
          detail: 缺少更好的经济性数据时，$1B 可能只是公允到偏贵。
        - id: n6
          label: 建议 = research-more
          detail: 保持尽调推进，但没有私有证明前，不要越过价格上限硬追。
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 该流程是基于公开证据的投资判断综合，不是公司披露的管理框架。
    claimRefs:
      - CV001
      - CV008
      - CV017
      - CV030
      - CV032
      - CV044
      - CV049
      - CV050
      - CV058
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值摆动最大处，来自公开记录目前没有给出的私有事实。
    data:
      items:
        - label: 干净的 cap table 和较低优先权负担
          value: 0.2
          unit: USD bn impact vs. base
          detail: 如果普通股等价上行空间好于隐含水平，可能抬高公允价值。
        - label: 可见企业转化和伙伴规模
          value: 0.25
          unit: USD bn impact vs. base
          detail: 如果 GTM 证明扩展到 DTC 之外，可能支撑重估。
        - label: 支持 / 退货负担高于预期
          value: -0.25
          unit: USD bn impact vs. base
          detail: 会压制高端硬件经济性和融资信心。
        - label: Meta / Android XR / 同业带来的平台挤压
          value: -0.35
          unit: USD bn impact vs. base
          detail: 会压缩定价权，并封顶上行空间。
    approximationNotes: 敏感性数值是围绕基准情形的方向性投资判断影响，不是公司指引的预测。
    claimRefs:
      - CV043
      - CV046
      - CV048
      - CV053
      - CV055
      - CV057
      - CV060
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间基于当前轮次定价、市场增长、公开竞争对手经济性，以及风险调整后的执行估算。
    data:
      items:
        - label: 上行情形
          low: 1.4
          value: 1.6
          high: 1.8
          unit: USD bn
          description: 假设渠道转化、配售强度和可控支持负载。
        - label: 基准情形
          low: 0.8
          value: 0.95
          high: 1.1
          unit: USD bn
          description: 假设需求真实，但经济性证明只做到部分，竞争持续存在。
        - label: 下行情形
          low: 0.35
          value: 0.5
          high: 0.7
          unit: USD bn
          description: 假设支持、竞争或合规摩擦迫使下一轮更弱。
    approximationNotes: 这些是推断出的估值区间，不是公司披露的预测，也不是收入倍数输出。
    claimRefs:
      - CV046
      - CV047
      - CV048
      - CV051
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 紧凑的 IC 风格评分卡，展示当前帮助或拖累投资判断的特征。
    data:
      items:
        - label: 市场顺风
          value: Strong
        - label: 产品 / 客户证明
          value: Real but early
        - label: 分销证明
          value: Emerging
        - label: 财务披露质量
          value: Weak
        - label: 竞争压力
          value: High
        - label: 当前估值舒适度
          value: Limited
    approximationNotes: 这些是综合出的投资评分，不是公司报告的 KPI。
