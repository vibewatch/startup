      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开来源更支持一张分层买方地图，而不是一个泛泛的佩戴者画像。Even
              最强的营销工作流是多语言对话辅助、提词、一眼可见的提示，以及视野里的私密文本。因此，最合理的自助买家是专业人士或专业消费者：他们用个人硬件、差旅或职业发展预算付款，因为这款产品的价格像高端可选眼镜，而不是大众配件。第二条路径是企业或机构采购，但当前公开证据很薄：Even
              的企业页展示的是一个收集公司、地址、行业和描述的表单，而不是客户 logo、采购合同或 ROI
              案例。第三层来自光学和零售伙伴的渠道影响，它们能降低试配摩擦，提升处方买家的信任。采用也仍是分阶段的。评测和产品页一致把当前智能眼镜描述为伴侣设备，最适合重复任务，而不是完整手机替代品。实际采用似乎从好奇开始，进入一个重复工作流；只有舒适度、隐私和对手机的依赖都可接受，才会进入日常佩戴。
