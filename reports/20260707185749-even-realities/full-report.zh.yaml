  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              按当前公开标价，Even Realities 可以作为尽调候选来投，还不是已经可以干净买入。围绕市场、 产品、客户证据，投资论点是连贯的。2026 年 7 月报道称公司以 $1 billion 估值融资 $150
              million；公司已有 $599 产品、$249 戒指、配件加购、企业与合作伙伴触点，也有评测 证据显示，无摄像头设计确实解决了用户的信任问题：他们想要翻译、提示或通知，但不想在脸上
              戴摄像头。品类增长也是真实的：智能眼镜市场研究机构正把 2026 年视为放量之年，而不是小众 猎奇阶段。


              反论点同样重要。Meta 已控制 2026 年可见品类份额的大部分，Android XR 明确要进入眼镜， Rokid、XREAL 等同行则借更大的生态或更快销量在相邻用例扩张。Even 在估值纪律最需要的地方
              仍然财务不透明：收入、毛利率、现金消耗、现金跑道、退货率和股权结构条款。上述组合支持 「继续研究」建议、中等置信度、高风险，以及估值偏紧的判断，而不是盲目认可当前轮次价格。
