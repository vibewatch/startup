      - number: '3.4'
        title: 切换成本、锁定、多栖使用与渠道权力
        blocks:
          - type: paragraph
            body: >-
              消费级智能眼镜现在仍更像伴侣设备，而不是封闭生态，因此切换成本不高。买家可以同时使用普通处方眼镜、耳机、手机，甚至多款智能眼镜，因为多数当前设备仍依赖智能手机或外部应用层完成设置、连接或高级功能。这限制了
              Even 的产品锁定。它最强的粘性要素是处方试配、保存的脚本和日程、可选戒指，以及用户围绕一眼可见提示或实时转写形成的习惯。这些都真实存在，但与 Meta 借 Ray-Ban 和 EssilorLuxottica
              获得的分销杠杆、Google 借 Gemini 和 Android 获得的服务图谱，或 XREAL 横跨手机、PC
              和娱乐硬件的广泛设备兼容性相比，仍然很小。渠道权力也比原始功能矩阵更重要：在光学门店、电子零售或既有移动生态里被发现，仍是获得品类熟悉度最快的路径。Even
              有不错的验光师分销和直营网售证明，但公开证据还没有显示同等的货架触达、附加购买经济性或伙伴依赖数据，无法支撑持久分销强度。
