companyProfile:
  summary: >-
    Even Realities 是一家 2023 年创立的私营智能眼镜创业公司，产品命题围绕无摄像头、以显示为核心展开。公开来源显示，创始人兼 CEO Will Wang 曾在 Apple 任职，参与过 Apple Watch 和
    iPhone 项目，之后创办公司。公司销售基础价 $599 的 Even G2 智能眼镜和 $249 的 Even R1
    伴侣戒指，把整套产品定位在翻译、提词、对话辅助、通知和安静生产力，而不是脸部佩戴式拍摄。公开渠道证据指向直营网售加验光师和零售伙伴；2026 年 7 月报道则称 Even 完成 $150 million pre-Series B
    轮融资，估值 $1 billion，由 Meituan 领投，Tencent 参投。承销缺口不在产品真实性，而在财务不透明：收入、利润率、跑道和完整融资经济性仍未披露。
