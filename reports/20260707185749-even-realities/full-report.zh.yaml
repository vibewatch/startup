      - number: '8.4'
        title: 可比参照、竞争调整后估值与退出准备度
        blocks:
          - type: paragraph
            body: >-
              Even 的可比分析必须谦逊。公开市场没有干净的纯业务可比公司能让数学变得简单；假装有， 只会制造虚假精确。最有用的参照是战略性的、基于里程碑的。Meta 展示了主导平台竞争的样子：
              竞争对手可以在大得多的生态里补贴 AI 眼镜，并承受 Reality Labs 数十亿美元亏损。Ray-Ban Meta 的定价也说明，Even 正在一个已经存在更低起价的市场里，销售更贵、更窄、隐私优先的
              主张。Android XR 和 XREAL 进一步扩大生态风险，Rokid 则说明，一个直接相邻产品可以在提词、 翻译和销量里程碑上跑得更快。


              这组可比支持两个结论。第一，如果 Even 占住隐私优先的工作实用工具细分市场，它有可能具备 战略价值。第二，同一组可比也让近期 IPO 设想显得过早。公开证据更适合支撑未来上轮融资或
              战略兴趣路径，而不是今天就自信宣称具备公开市场准备度。
