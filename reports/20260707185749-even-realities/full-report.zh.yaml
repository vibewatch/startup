  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 版图、直接同业、巨头与替代品
        blocks:
          - type: paragraph
            body: >-
              竞争地图比「其他智能眼镜」更宽。Even 位于一圈直接同业之中：这些显示优先眼镜试图把文本、提示、翻译或导航留在用户视线里。XREAL、Rokid 和 RayNeo 是当前最清楚的例子；Brilliant
              Labs 更像开发者 / 创作者相邻产品，Vuzix 仍是企业导向参照点。Meta 的 Ray-Ban 线不是显示优先，但它是商业上的在位者，因为它已经证明，时尚 AI
              眼镜能通过成熟眼镜渠道卖出规模。Android XR 很重要，因为 Google 和 Samsung 很可能成为下一波进入者，它们可以靠服务、应用和手机生态切入，而不是押注单一产品。替代品也真实存在：Xiaomi
              式音频眼镜不用显示也能覆盖通话和媒体；Even
              的许多实用任务，也仍可由手机加耳机、提词器软件、翻译应用或普通笔记完成。因此本章关键框架不是智能眼镜这个品类是否存在，而是哪些产品能用可接受的信任、舒适度、生态深度和分销触达，解决同一批离散任务。
