  topStrengths:
    - Camera-free, privacy-first product positioning appears meaningfully differentiated for work and communication use cases.
    - Public evidence shows a real commercial product, premium pricing, more than 10,000 G1 pairs sold, and tangible retail / optician channel build-out.
    - The July 2026 $150 million round led by Meituan with Tencent participation gives the company real financing validation and time to execute.
  topRisks:
    - Public sources still do not disclose revenue, gross margin, burn, runway, return rates, or full round economics.
    - Meta, Android XR, XREAL, Rokid, and other larger ecosystems can compress pricing power and distribution leverage quickly.
    - Headquarters / entity structure, governance visibility, and privacy-compliance execution remain less transparent than the valuation headline suggests.
  unresolvedGaps:
    - Audited or board-grade revenue, gross-margin, burn, runway, and returns data.
    - Cap-table terms, liquidation preferences, and common-equivalent ownership economics for the July 2026 round.
    - Clear legal-entity and headquarters map plus evidence on enterprise conversion, retention, and support burden.
