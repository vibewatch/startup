company:
  name: Pasqal
chapter:
  number: 7
  title: Risks
  summary: Pasqal has moved from private deep-tech development toward public-market commercialization, but the evidence still points to execution, capital, regulatory, and adoption risks. The strongest mitigants are installed systems, a production banking roadmap, and new public-company liquidity; the largest residual exposures are unproven scale economics, export-control complexity, and the gap between quantum access and scaled production use.
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: Pasqal's public-market transition and strategic-technology position create distinct legal and compliance exposures. Reed Smith reports that the business combination closed and that approximately $360 million of cash was available at closing; that amount is closing liquidity, not evidence of runway or freedom from dilution. The European Commission says the revised foreign-investment screening regime will apply from 17 January 2028 and will require national mechanisms covering sensitive strategic areas. Baker McKenzie reports that EU dual-use lists added controls related to quantum technology and recommends classification, licensing, internal-control, and documentation reviews. These sources do not establish a Pasqal violation or required licence, but they make ownership, export, product-classification, and post-listing controls material diligence items.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-and-technical
    title: Operational, quality, and technical execution
    body: The operating system is promising but not yet low-risk. Pasqal's investor presentation states that seven QPUs with 100–200+ qubits are in commercial use and three more are in production, while also presenting a management estimate of 10,000–50,000 physical qubits, 200 logical qubits, and 99.9999% logical fidelity in 2029. The same presentation warns that roadmap technology is not yet available to customers, may never become available or meet specifications, and could be delayed or never delivered. That explicit disclosure makes milestone slippage, defects, and lower-than-planned reliability the central technical risks. The retained evidence does not independently establish uptime, acceptance performance, incident history, or achievement of the 2029 targets.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: partner-and-adoption
    title: Partner dependency and commercial adoption
    body: Pasqal's route to scale depends on partners and on customers turning experiments into repeatable production workloads. Crédit Agricole CIB's account describes a multi-year roadmap that began with exploratory work and pilot validation before targeting operational industrialization by 2028; that is a meaningful customer-development signal, but it is also a dependency on one demanding enterprise workflow reaching production. Pasqal's own cloud page offers emulator access, pay-as-you-go QPU access, enterprise support, and third-party cloud integrations, yet the independent State of Quantum 2026 reports that only 10% of surveyed organizations had limited production use and 3% had scaled deployment. Adoption may therefore lag technical availability, leaving partner concentration and conversion risk.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: financial-and-thesis-break
    title: Financial model and thesis-break triggers
    body: >-
      The financial risk is a mismatch between the cost and timing of deep-tech execution and the proof required by public investors. Quantum Zeitgeist reports first-half 2026 total revenue of €4.9 million, QPU-services revenue of €3.9 million, and an operating loss of €59.2 million; it also says €37.5 million of that loss came from share-based payments and one-time public-company charges. Those figures show monetization alongside substantial reported loss, not cash burn or runway. The QED-C market forecast describes a market that reached an estimated $1.4 billion in 2025 while noting that 54% of respondents saw some probability of a quantum winter by 2031. A thesis break should be tied to measurable events: missed QPU delivery milestones, declining or non-renewing production contracts, export approvals that delay deployments, or liquidity that cannot fund the roadmap without materially dilutive financing.
    claimRefs: [CR013, CR014, CR015, CR016]
    callouts:
      - calloutType: risk
        title: Primary thesis-break condition
        body: The risk case becomes decisive if Pasqal cannot convert installed or partner-led experiments into repeatable paid production workloads while maintaining enough liquidity to fund the hardware and error-correction roadmap.
        claimRefs: [CR010, CR013, CR016]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - [Closing liquidity and dilution, United States, "Business combination closed; approximately $360 million cash available at closing was reported", medium, high, "Reconcile closing cash, convertible securities, warrants, and fees in public filings", "Cash available at closing is not runway and may coexist with dilution or restricted uses", "Review first post-close filings, cap table, financing agreements, and cash-flow statement"]
      - [Foreign-investment screening, European Union, "Framework applies; new regulation applies from 17 January 2028", medium, high, "Screen ownership, control, and sensitive-technology transactions early", "Cross-border review can delay or condition strategic investment and deployment", "Map ultimate beneficial ownership and national screening triggers"]
      - [Dual-use export controls for quantum technology, EU and United Kingdom, "2025 amendments add quantum-related controls and licensing implications", high, high, "Classify products, update licences and internal compliance programs, document decisions", "Sales, hardware shipment, and support may require jurisdiction-specific authorisation", "Run SKU-and-country classification review with export counsel"]
      - [Defense-to-civil collaboration transition, France, "Reported exit from Phase 2 of PROQCIMA and submission of a civil R&D proposal", medium, medium, "Separate civil roadmap, public-procurement obligations, and restricted technical information", "Funding, access, or strategic focus could change during the transition", "Review DGA, SGPI, and DGE agreements and obligations"]
    notes: "Rows combine company- or partner-reported transaction facts with EU/UK regulatory guidance; status is as reported in the retained sources and nulls are not used to imply clearance."
    enumerationScope:
      coverage: partial
      basis: "Publicly available regulatory and transaction sources retained for the October 2026 refresh; not a complete legal inventory."
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [QPU production and delivery slips, medium, high, "Early commercial base with seven installed and three in production per company presentation", "Customer go-live and revenue timing can move right", "Independent delivery schedule, uptime, and acceptance data are not public"]
      - [Neutral-atom scaling or fidelity shortfall, high, high, "Roadmap includes modular generations, PIC controls, and error correction", "More physical resources or engineering time may be required than planned", "No independent confirmation of 2029 logical-qubit and fidelity targets"]
      - [Cloud and on-prem reliability gap, medium, medium, "Cloud page describes monitoring, support, emulators, and third-party integration", "Users may remain in experimentation rather than production", "Public uptime, incident, queue, and service-credit history is unavailable"]
      - [Security or controlled-technology incident, unknown, high, "Export-control and investment-screening compliance requirements are identifiable", "A breach or misclassification could halt deployments and damage trust", "No complete public incident, audit, or control-testing record was retained; absence of evidence is not evidence of no incidents"]
    notes: "Likelihood and severity are analytical ratings anchored to the cited failure modes and mitigations; they are not management probabilities. Roadmap claims remain company estimates."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Production workflow conversion, Crédit Agricole CIB, "Banking use-case co-development and 2028 production roadmap", "Material single reference", "Pilot validation does not become operational deployment", high, "Three-tier classical, experimental, and hybrid rollout", "Reference value may not translate into recurring multi-customer revenue"]
      - [Cloud distribution, Microsoft Azure / Google Cloud, "Third-party access to Pasqal QPUs", "Platform-dependent", "Cloud integration or economics limit usage", medium, "Pasqal also offers direct cloud services and on-prem access", "Commercial terms, usage volume, and portability are not public"]
      - [Strategic enterprise demand, "Aramco, LG Electronics, NVIDIA and others", "Use-case validation and ecosystem relationships", "Several named relationships but no public revenue concentration", "Named relationships do not establish renewal, production status, or revenue share", high, "Sector diversification across finance, energy, and materials", "Named relationships do not establish renewal, production status, or revenue share"]
      - [Public capital and financing, Bleichroeder / public markets, "Liquidity for global deployment and roadmap execution", "High financing dependence", "Market repricing or conversion creates dilution and weaker funding access", high, "Reed Smith reports approximately $360 million cash available at closing", "Cash available is not runway; audited burn, commitments, and conversion terms need confirmation"]
    notes: "Counterparties and roles are taken from retained company, partner, or reported sources; concentration is qualitative because customer-level revenue and contract terms are not disclosed."
    claimRefs: [CR009, CR010, CR011, CR012, CR016]
