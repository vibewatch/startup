        - label: Quantum scaling and fidelity
          values: [high, high, critical]
        - label: Production adoption conversion
          values: [medium, high, high]
        - label: Customer or partner concentration
          values: [medium, high, high]
        - label: Public-market dilution and liquidity
          values: [medium, high, high]
        - label: Cloud or QPU reliability gap
          values: [medium, medium, medium]
    approximationNotes: "Likelihood and residual severity are qualitative analyst assessments based on retained evidence and explicitly disclosed gaps; the matrix does not represent measured probabilities."
    claimRefs: [CR003, CR005, CR008, CR010, CR013, CR016]
callouts:
  - calloutType: insight
    title: Mitigation is real but not yet independently measured
    body: Installed QPUs, cloud access, partner roadmaps, and public-company liquidity reduce execution risk, but the retained file does not independently establish uptime, renewals, cash runway, or production-scale quantum advantage.
    claimRefs: [CR005, CR009, CR010, CR013]
