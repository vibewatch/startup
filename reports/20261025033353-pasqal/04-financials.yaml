      - [Gross retention / NRR, null, "Unavailable", "Renewal and expansion determine whether deployments become recurring revenue", "Logo retention, dollar retention, and expansion by cohort"]
      - [Implementation cost, null, "Unavailable", "On-premise hardware and services may create material delivery costs", "Fully loaded deployment cost and support burden"]
    notes: "No assigned source reports CAC, payback, retention, NRR, or implementation cost; nulls are explicit diligence gaps rather than zeroes or estimates."
    claimRefs: [CI006, CI007, CI008, CI014]
  - id: TI004
    title: Capital and cost signals
    columns: [Signal, Amount / status, Period or basis, Reliability, Diligence ask]
    rows:
      - [Committed convertible financing, "$200m", "March 2026 transaction announcement", "Company / transaction announcement; subject to closing conditions", "Final terms, conversion mechanics, dilution, and closing documentation"]
      - [Pasqal balance-sheet cash, "~$158m", "As of February 28, 2026", "Company transaction announcement", "Audited cash, restricted cash, debt, and post-close reconciliation"]
      - [Cash at closing, "~€309m / $360m", "Reported after August 25, 2026 shareholder approval", "Independent report", "Bank-confirmed cash, transaction fees, redemptions, and use-of-funds schedule"]
      - [Operating burn and runway, null, "Not disclosed in assigned sources", "Unavailable", "Monthly cash flow, capex, hiring plan, and runway under base/downside cases"]
    notes: "Amounts refer to different transaction stages and cannot be added together; cash available is not funding raised, and no source supplies a verified runway calculation."
    claimRefs: [CI009, CI010, CI011, CI012]
