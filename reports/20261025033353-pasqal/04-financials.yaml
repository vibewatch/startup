company:
  name: Pasqal
chapter:
  number: 4
  title: Financials
  summary: Pasqal has a visible cloud monetization surface and customer deployments, but public evidence still does not disclose audited revenue, gross margin, burn, runway, or realized price realization. The 2026 financing and listing provide capital for manufacturing and commercialization, yet underwriting remains dependent on converting booked or awarded business into recurring, cash-generating revenue.
sections:
  - id: monetization
    title: Monetization and revenue quality
    body: Pasqal presents a hybrid monetization model rather than a pure software subscription. Its official cloud offer combines free emulator access, pay-as-you-go QPU usage, academic access, and enterprise packages priced on demand; the page also describes professional services bundled with premium usage. This supports a usage-led entry path, but list terms are not realized revenue, and the public material does not disclose bookings-to-revenue conversion, contract duration, take rates, renewal rates, or revenue mix between hardware, cloud usage, software, services, grants, and deployments. Independent coverage reports approximately $80 million of booked and awarded business including grants, but describes it as potential multi-year customer contract value expected to be realized over time, not current revenue or ARR. The financial quality signal is therefore commercial traction with material recognition and collection uncertainty.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: sales-efficiency
    title: GTM motion and sales-efficiency proxies
    body: The go-to-market motion is enterprise and ecosystem-led. Pasqal sells or deploys QPUs on premises, offers cloud access through its own platform and third-party clouds, and works with industrial and research customers on application roadmaps. Aramco describes a production-ready QPU and a roadmap of energy, materials, and industrial use cases, while Crédit Agricole coverage describes a multi-year path from exploratory work toward operational banking workflows by 2028. These are useful proof points for adoption and deployment, but they do not establish CAC, sales cycle length, implementation cost, gross retention, expansion, or payback. The commercial model may produce large, lumpy contracts with meaningful integration work; investors should not infer SaaS-like efficiency from customer or partnership counts.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-and-costs
    title: Capital adequacy and cost structure
    body: The 2026 transaction evidence points to substantial capital availability for a hardware scale-up, but the sources differ by transaction stage and should not be blended. The March transaction announcement described a $2.0 billion pre-money valuation, $200 million of committed convertible financing, and approximately $158 million of cash on Pasqal's balance sheet as of February 28, 2026, alongside expected gross proceeds above $600 million subject to closing conditions. Later independent reporting described approximately €309 million ($360 million) in cash at closing after the August shareholder approval and listing. That later figure is a cash-at-closing report, not a disclosed runway calculation. The sources also identify manufacturing expansion, QPU deployment, staffing, research, and cloud/software investment as uses of capital. No public source in this pool provides current operating burn, capex schedule, debt service, working-capital needs, or cash runway.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI004]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: Pasqal's financial profile is investable as a commercialization story but not yet underwritable on conventional public-company earnings or recurring-revenue metrics. The strongest positives are a real cloud and hardware delivery surface, named industrial use cases, a disclosed capital raise and later cash-at-closing report, and a customer base spanning energy, finance, logistics, and research. The main risks are that booked or awarded business may include grants and multi-year value, that pricing is partly on demand, and that manufacturing and deployment can consume capital before revenue is recognized. Independent analysis also characterizes scaling thousands of neutral atoms at high fidelity as an unprecedented engineering challenge, reinforcing execution and capital-intensity risk. The public record contains forward-looking statements and company-issued performance claims, including unaudited growth and booked-business figures, which require filings and customer-level verification. A financing-dependent plan should therefore be modeled with scenarios rather than a single revenue or runway point estimate.
    claimRefs: [CI013, CI014, CI015]
    figureRefs: [FI001]
callouts:
  - calloutType: strength
    title: Commercial access is tangible
    body: Pasqal offers cloud access to 100-qubit-class QPUs with pay-as-you-go usage and has described production-oriented deployments with Aramco and other enterprise customers.
    claimRefs: [CI001, CI005]
  - calloutType: risk
    title: Core underwriting data remains private
    body: The assigned evidence does not disclose audited revenue, gross margin, cash burn, runway, realized pricing, customer concentration, renewal performance, or contract-level payment terms.
    claimRefs: [CI014, CI015]
  - calloutType: recommendation
    title: Require a conversion bridge
    body: Before relying on the financing runway, request a bridge from bookings and awarded business to recognized revenue, cash collections, gross margin, capex, burn, and remaining committed capital.
    claimRefs: [CI003, CI012, CI014]
