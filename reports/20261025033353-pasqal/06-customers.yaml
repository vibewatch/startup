figures:
  - id: FU001
    title: Customer journey from experimentation to production
    type: journey-map
    summary: Pasqal's public customer path runs from emulator and SDK experimentation through hosted QPU access and HPC integration toward application-specific production, with retention and economics still unverified.
    data:
      nodes:
        - id: experiment
          label: Experiment
          title: Emulator and SDK exploration
          details: Free Explorer access, local or remote emulators, Pulser, QoolQit, and application libraries.
          touchpoints: [Explorer tier, emulators, open-source SDKs]
        - id: validate
          label: Validate
          title: Remote QPU and cloud testing
          details: Academic, pay-as-you-go, and third-party cloud routes allow algorithm testing on 100+ qubit systems.
          touchpoints: [Pasqal Cloud, Azure, Google Cloud, OVHcloud, Scaleway]
        - id: integrate
          label: Integrate
          title: HPC and enterprise workflow integration
          details: Named programs connect QPUs to supercomputers and operational application teams.
          touchpoints: [GENCI/CEA, FZJ, Crédit Agricole CIB, Thales]
        - id: deploy
          label: Deploy
          title: Production-oriented use
          details: Banking roadmap targets initial production use cases by 2028; other named projects remain evaluation or collaboration evidence.
          touchpoints: [Risk management, portfolio optimization, scheduling]
        - id: expand
          label: Expand
          title: Repeat and broader workload use
          details: Potential expansion into additional users, workloads, and hybrid quantum-classical capacity is plausible but not publicly quantified.
          touchpoints: [Renewal, utilization, cross-workload adoption]
        - id: retain
          label: Retain
          title: Durable customer economics
          details: Retention, churn, contract length, concentration, and recurring usage are not disclosed in the retained public evidence.
          touchpoints: [NRR, GRR, renewals, customer concentration]
    claimRefs: [CU001, CU005, CU007, CU010, CU015, CU016]
callouts:
  - calloutType: strength
    title: Named deployment breadth
    body: Pasqal has evidence across cloud access, European HPC, finance, critical-industry scheduling, and scientific applications, giving the customer thesis more substance than a logo list.
    claimRefs: [CU005, CU007, CU010, CU011]
  - calloutType: risk
    title: Durability is the missing proof
    body: Public evidence does not disclose active users, utilization, renewals, churn, contract length, or customer concentration, so adoption quality cannot yet be separated from project and infrastructure milestones.
    claimRefs: [CU015, CU016]
