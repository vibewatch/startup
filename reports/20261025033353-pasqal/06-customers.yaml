company:
  name: Pasqal
chapter:
  number: 6
  title: Customers
  summary: Pasqal shows credible customer adoption through named deployments, cloud distribution, and application collaborations, but public evidence remains stronger for access and pilots than for recurring usage, renewals, or customer concentration. The clearest commercial signal is the combination of production-oriented banking work, HPC installations, and multiple cloud entry points.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: Pasqal serves several distinct customer groups rather than one homogeneous buyer. Enterprise users seek optimization, simulation, or risk-management workflows; public HPC institutions procure systems and infrastructure access; cloud platforms distribute QPU access to researchers and developers; and academic or research users test algorithms through emulators, SDKs, and remote hardware. The official cloud offer separates Explorer, Academic, Pay-as-you-go, and Premium tiers, which indicates a funnel from experimentation to paid or supported hardware usage rather than a single contract shape. Documentation describes application libraries for combinatorial optimization, dynamical-system simulation, and quantum-inspired machine learning, while the cloud page names hybrid workloads, emulators, support, monitoring, and third-party cloud access. These surfaces establish user jobs and access routes, but they do not disclose active-account counts, revenue by segment, or conversion between tiers.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-deployment
    title: Adoption trajectory and deployment footprint
    body: Adoption evidence is most concrete where Pasqal's systems are installed in named infrastructure or exposed through named distribution channels. FZJ reports two 100+-qubit systems delivered to first customers at GENCI/CEA in France and FZJ in Germany, coupled to Joliot-Curie and JURECA DC supercomputers, with European users able to validate use cases through Pulser and remote access. A later cloud report describes Orion Gamma devices and digital twins available through Scaleway at Massy and Sherbrooke, while Pasqal's own page offers 100+ qubit QPU access and real-time batch monitoring. These are meaningful access and deployment milestones, but public sources do not provide utilization, job volumes, renewal rates, or a denominator for active users. The customer thesis therefore rests on installed and reachable capacity, not yet on demonstrated recurring consumption.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-durability
    title: Named customer proof, expansion, and durability
    body: Named use cases span financial risk and portfolio optimization, critical-system scheduling, drug discovery, energy, and hybrid HPC research. Crédit Agricole CIB describes a collaboration initiated in 2019, projects initial production use cases as early as 2028, and distinguishes quantum-inspired classical production, quantum experimentation, and hybrid large-scale deployment. The Thales, GENCI, and Île-de-France partnership similarly targets planning and scheduling in logistics, air-traffic control, industrial automation, and other critical applications, while the HPCQS program records work in finance, pharma, and energy. These sources show credible workflow relevance and expansion paths, but mostly describe collaborations, pilots, or planned production rather than independently measured customer outcomes. No public source in the assigned pool discloses GRR, NRR, churn, contract length, top-customer share, or repeat-purchase rates; those omissions are material to durability and concentration assessment.
    claimRefs: [CU010, CU011, CU012, CU013, CU014]
    tableRefs: [TU003]
  - id: diligence-implications
    title: Commercial read-through and diligence gaps
    body: Pasqal's customer evidence supports a positive but qualified adoption view. Distribution through Pasqal Cloud, Microsoft Azure, Google Cloud, OVHcloud, and Scaleway reduces infrastructure friction, while public HPC installations and named enterprise collaborations provide stronger proof than logos alone. At the same time, several sources are company or partner announcements, and the independent New Market Pitch review explicitly says it found machines, locations, and application areas but not a clean public view of job frequency, active external users, renewals, or revenue from repeat use. The appropriate investment question is therefore not whether Pasqal has customers or access channels; it does. The unresolved question is whether deployments become sticky, repeatable infrastructure consumption with measurable outcomes and diversified economic value. Procurement timelines, grant dependence, and technical maturation can all lengthen that conversion.
    claimRefs: [CU015, CU016]
    callouts:
      - calloutType: insight
        title: Strongest adoption signal
        body: The combination of named QPU installations, cloud distribution, and production-oriented application roadmaps is stronger than a partnership-logo narrative, but it still stops short of public retention or utilization proof.
        claimRefs: [CU005, CU007, CU010, CU015]
