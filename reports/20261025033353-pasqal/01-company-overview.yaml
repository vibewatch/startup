company:
  name: Pasqal
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pasqal is a France-headquartered neutral-atom quantum-computing company founded
    in 2019, with a full-stack offer spanning installed systems, cloud access, and
    software. Its 2026 public-market transition and $2 billion pre-money valuation
    provide scale capital, but independently reported 2025 revenue of €16.5 million
    and the filings' commercialization warning make execution evidence more important
    than headline financing.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Pasqal was founded in 2019 as an Institut d'Optique spinout and remains
      headquartered in France, with TechCrunch locating the headquarters in Palaiseau.
      The company builds neutral-atom quantum computers and the surrounding software
      stack rather than selling a single software layer. Its commercial surface combines
      on-premises systems for research and high-performance-computing environments with
      cloud access to emulators and 100-plus-qubit Orion QPUs. The cloud offer includes a
      free emulator tier, usage-based access through Google Cloud, and negotiated
      academic and enterprise plans. This creates several potential revenue modes, but
      public pricing is incomplete and does not establish recurring revenue, utilization,
      or gross margin.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Scientific founder-market fit is unusually strong: Nobel laureate Alain Aspect
      co-founded the company, anchoring it in neutral-atom research. Current operating
      control is less stable than the scientific lineage. The March 2026 transaction
      announcement names former executive chair Wasiq Bokhari as CEO, while TechCrunch
      reports that Loïc Henriet moved from CTO to co-CEO, then sole CEO, and back to CTO.
      That reshuffle concentrates attention on the CEO-CTO interface during manufacturing
      scale-up and public-company readiness. Public materials do not provide a complete
      current board roster, committee structure, founder ownership, voting control, or
      post-transaction fully diluted cap table, so governance quality cannot yet be
      assessed from titles alone.
    claimRefs: [CO005, CO006]
    tableRefs: [TO002]
  - id: capital-scale-and-stakeholders
    title: Capital, operating scale, and stakeholders
    body: >-
      The announced SPAC transaction valued Pasqal at $2.0 billion pre-money and paired
      the deal with $200 million of committed convertible financing. Those amounts are
      transaction terms, not cash available: closing conditions, redemptions, and funding
      mechanics determine realized proceeds. Pasqal also described more than $300 million
      of total funding, while its March announcement reported over 275 employees, more
      than 25 clients and partners, seven deployed quantum computers, and three more in
      production. These are company-issued scale indicators. They are useful evidence of
      organizational reach but do not replace audited revenue, contract conversion,
      customer concentration, backlog quality, cash burn, or runway.
    claimRefs: [CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: milestones-and-investment-readthrough
    title: Milestones and investment read-through
    body: >-
      Pasqal's milestones show a rapid shift from scientific spinout to commercial and
      public-market platform. Cloud distribution, executive reconfiguration, the March
      2026 business-combination agreement, and the later reported Nasdaq debut broadened
      access to capital and customers. However, company disclosures require disciplined
      interpretation: approximately 100% unaudited 2025 revenue growth is not a revenue
      level, and roughly $80 million of booked and awarded business includes grants and
      potential multi-year value rather than recognized revenue. TNW separately reported
      €16.5 million of 2025 revenue and characterized the $2 billion valuation as about
      100 times sales. It also highlighted a filing warning that commercial traction for
      quantum computing may never occur, framing technical and market adoption as the
      central investment risk.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
