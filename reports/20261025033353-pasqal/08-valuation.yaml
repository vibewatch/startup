      - [Entry discipline, price-sensitive, "Require a lower entry price or stronger verified revenue and margin proof."]
    notes: "Assessments synthesize the retained evidence; they are not company guidance or an audited valuation."
    claimRefs: [CV002, CV004, CV006, CV007, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence signal, What would change the view]
    rows:
      - ["Deployed platform", "Seven QPUs deployed and three in production are reported.", "Independent utilization, uptime, and paid-renewal data."]
      - ["Commercial access", "Cloud access and more than 25 applications are reported.", "Revenue mix and repeat usage by customer cohort."]
      - ["Capital runway", "The completed deal is reported to provide approximately $360 million in cash.", "Cash balance, burn, and milestone-linked financing plan."]
      - ["Valuation risk", "Approximately $19 million revenue is compared with a near-96x implied multiple.", "Audited growth, margin, and a defensible recurring-revenue denominator."]
      - ["Market timing", "Independent 2026 forecasts imply rapid sector growth but also material quantum-winter risk.", "Evidence of scaled workloads and repeatable customer ROI."]
    notes: "Rows preserve source units and periods; qualitative change conditions are diligence criteria, not forecasts."
    claimRefs: [CV001, CV003, CV004, CV008, CV009, CV010]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Deployments convert to repeatable enterprise workloads; new cash funds manufacturing and roadmap execution.", "Above the approximately $4.3B August 28 market-cap mark only after audited growth, retention, and margins validate the premium.", "Conditional upside; no probability can be supported.", "Paid deployments or production milestones fail to scale."]
      - [Base, "Technical progress continues, but production adoption and revenue conversion take years.", "The $2.0B pre-money transaction value to approximately $4.3B debut market-cap band is an observed anchor range, not fair value.", "Most consistent with mixed traction and disclosure evidence.", "Burn or dilution rises before commercial inflection."]
      - [Bear, "Pilot-heavy demand, weak renewals, delayed roadmap, or market-wide quantum retrenchment.", "Below the $2.0B transaction anchor if expectations reset before revenue and margins scale.", "Material downside signal; no probability can be supported.", "Financing need arrives without validated unit economics."]
    notes: "Scenario bounds use unlike observed anchors—pre-money transaction value and an estimated debut market capitalization—not intrinsic-value targets; return math remains unavailable without entry price, fully diluted ownership, and cash-flow evidence."
    claimRefs: [CV002, CV004, CV006, CV007, CV009, CV010, CV012, CV013, CV016]
