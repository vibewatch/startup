company:
  name: Pasqal
chapter:
  number: 8
  title: Valuation
  summary: Pasqal has moved from private financing into a Nasdaq listing with substantial new cash and visible deployments, but public evidence still supports a research-more stance because revenue scale, dilution, and durable production economics remain uncertain. The central valuation question is whether execution can close the gap between a roughly $19 million revenue base and a public-market value that expanded sharply after listing.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Pasqal's investment case is strengthened by evidence of a real deployed
      platform rather than a purely conceptual roadmap. The company reports seven
      deployed QPUs, three in production, more than 25 commercial and research
      applications, and access through major cloud ecosystems; an independent
      account also describes systems at national HPC centers and a 200-qubit
      deployment at Saudi Aramco. The financing is meaningful: the completed
      SPAC transaction provided approximately $360 million in cash, while
      earlier reporting described a $2 billion pre-money valuation and a
      separate $200 million financing. The anti-thesis is equally material.
      Independent reporting describes approximately $19 million of revenue and
      notes that the implied transaction multiple was near 96 times revenue;
      the same reporting says the share price nearly doubled on the first day.
      This is evidence of commercial traction and financing capacity, not proof
      that recurring revenue, margins, retention, or cash conversion justify
      the public price.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: price-discipline
    title: Price discipline and financing context
    body: >-
      The available financing evidence supports a price-sensitive
      recommendation rather than a binary technology judgment. TechCrunch
      reported the SPAC merger at a $2 billion pre-money valuation and a
      separate $200 million private round, while the completed-deal report
      describes approximately $360 million of cash after shareholder approval
      and redemptions. The Signal subsequently estimated a roughly $4.3 billion
      market capitalization and contrasted it with approximately $19 million
      of trailing revenue, explicitly framing the resulting valuation as about
      100 times revenue. These figures are not interchangeable: pre-money
      transaction value, post-close cash, market capitalization, and revenue
      measure different concepts and periods. The public file does not provide
      audited 2026 revenue, gross margin, burn, fully diluted share count,
      preference terms, or a verified recurring-revenue measure. Accordingly,
      entry discipline should require either a materially lower price or
      independently verified evidence of rapid revenue conversion and
      sustainable unit economics.
    claimRefs: [CV001, CV002, CV004, CV006, CV007]
    tableRefs: [TV003]
  - id: scenarios-and-comps
    title: Scenarios and comparable signals
    body: >-
      A scenario framework is more defensible than a single target price
      because the evidence base does not establish a stable revenue multiple
      or a mature recurring-revenue denominator. The bull case assumes that
      deployed systems, cloud access, and production partnerships convert into
      repeatable enterprise revenue while the company executes its roadmap and
      uses the new cash to expand manufacturing. The base case assumes
      continued technical and commercial progress but a long period of
      investment before quantum workloads become material to customer budgets.
      The bear case assumes that deployment remains pilot-heavy, capital needs
      stay high, and public-market expectations compress before revenue and
      margins scale. Market evidence supports both opportunity and caution:
      QED-C describes a 2025 market estimate of $1.4 billion and roughly 30%
      annual growth toward more than $3 billion by 2028, but also reports that
      54% of respondents see some probability of a quantum winter by 2031.
      McKinsey separately estimates quantum-computing-company revenue at more
      than $1 billion in 2025 and $3.2 billion to $4.4 billion in 2028. A
      public-market reference is also imperfect: CompaniesMarketCap recorded
      IonQ at $12.66 billion in October 2026, but that market capitalization
      does not normalize revenue, growth, margins, modality, or dilution.
      These are sector and trading signals, not Pasqal forecasts or intrinsic
      valuation benchmarks.
    claimRefs: [CV008, CV009, CV010, CV011, CV012, CV015, CV016]
    figureRefs: [FV001]
  - id: decision-and-diligence
    title: Decision, exit readiness, and thesis breaks
    body: >-
      The evidence supports a research-more recommendation with high risk and
      low-to-medium confidence in any precise valuation conclusion. Pasqal has
      a potentially differentiated neutral-atom platform, customer and HPC
      deployments, and fresh public capital, but the retained sources do not
      disclose the operating data needed to underwrite a public-market price.
      Before increasing exposure, diligence should obtain audited revenue by
      hardware, software, cloud, and services; bookings and backlog conversion;
      gross margin and cash-burn forecasts; fully diluted capitalization and
      financing preferences; customer concentration and renewal evidence; and
      uptime, benchmark, and production utilization data. The principal
      thesis-break triggers are a failure to convert deployments into paid
      recurring workloads, material dilution or financing dependence, missed
      manufacturing milestones, a material sector funding contraction, or
      failure to overcome neutral-atom fidelity and scaling constraints. Exit
      readiness is therefore conditional: a future financing, secondary mark,
      or public-market repricing should be assessed against verified revenue
      and cash metrics, not against the headline amount raised. A target return
      and hold period cannot be responsibly quantified without a dated entry
      price, fully diluted ownership, cash needs, and an evidence-based exit
      value.
    claimRefs: [CV003, CV005, CV009, CV010, CV013, CV014, CV016]
    tableRefs: []
