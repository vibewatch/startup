evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited 2025-2026 revenue, bookings and backlog reconciliation, gross margin, operating cash burn, balance-sheet
      cash, debt, and runway.
    whyItMatters: >-
      Company growth and booked-business figures cannot establish revenue quality, profitability, liquidity, or
      financing sufficiency.
    diligencePath: >-
      Obtain audited statements, monthly management accounts, bank statements, the contract-level backlog schedule, and
      a board-approved cash forecast.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete board and committee roster, founder and investor ownership, voting rights, reserved matters, debt and
      convertible terms, and the fully diluted post-transaction cap table.
    whyItMatters: >-
      Public titles and selected investor names do not reveal control, dilution, governance protections, or key-person
      succession readiness.
    diligencePath: >-
      Review the latest statutory register, board materials, shareholder agreements, financing instruments, final
      transaction filings, and management succession plan.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A Pasqal-specific serviceable market model with customer counts, workload mix, pricing, and geographic scope.
    whyItMatters: >-
      Broad neutral-atom and quantum-industry estimates cannot establish Pasqal's obtainable revenue opportunity or
      market share.
    diligencePath: >-
      Request management's bottom-up TAM/SAM/SOM model and reconcile it to paid accounts, pipeline, and deployment
      capacity.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof-gap
    missingEvidence: >-
      Customer-level contract value, utilization, renewal, gross-margin, and conversion data for cloud and on-premise
      deployments.
    whyItMatters: Adoption signals and pilots do not show whether market growth converts into repeatable economics.
    diligencePath: Obtain an anonymized cohort and bookings bridge by segment, deployment type, and renewal status.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: minor
    topic: market-sizing
    missingEvidence: A consistent definition reconciling neutral-atom, quantum-computing, and total quantum-industry market categories.
    whyItMatters: The published values use different boundaries and cannot be added or used as a single funnel.
    diligencePath: Normalize publisher definitions, revenue inclusions, and customer categories before using a market multiple.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Numeric list rates and realized workload costs for Pasqal, IonQ, neutral-atom peers, and cloud aggregators on
      comparable jobs.
    whyItMatters: >-
      Package labels and billing units do not establish customer ROI, price competition, discounting, or gross-margin
      durability.
    diligencePath: >-
      Obtain current rate cards, anonymized invoices, discount schedules, queue and shot assumptions, support fees, and
      matched workload cost studies.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-comparability
    missingEvidence: >-
      Independent standardized benchmarks comparing time to solution, accuracy, reliability, utilization, and total cost
      against peer modalities and classical baselines.
    whyItMatters: >-
      Qubit counts, modality descriptions, and vendor-specific fidelity measures cannot establish buyer-level technical
      superiority or moat durability.
    diligencePath: >-
      Request reproducible notebooks, complete workload definitions, calibration vintages, error bars, classical
      baselines, and third-party validation.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: retention-and-lock-in
    missingEvidence: Customer retention, renewal, production utilization, workload portability, and migration-cost data.
    whyItMatters: >-
      Wide cloud distribution may accelerate adoption while also enabling multi-homing, leaving switching-cost
      durability unresolved.
    diligencePath: >-
      Review customer cohorts, production-versus-pilot counts, renewal and expansion records, migration histories, and
      reference calls.
    relatedQuestionRefs:
      - QP006
      - QP007
  - type: missing-source
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited revenue by stream, bookings-to-revenue conversion, deferred revenue, contract duration, and customer
      concentration.
    whyItMatters: >-
      Booked or awarded business including grants may not convert to recognized or collected revenue on the same
      schedule.
    diligencePath: >-
      Obtain audited financial statements, revenue-recognition policies, backlog roll-forward, top-customer
      concentration, and contract samples under NDA.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI006
  - type: missing-source
    severity: blocking
    topic: capital-intensity
    missingEvidence: Monthly cash burn, capex, working-capital requirements, debt obligations, and runway after the 2026 transaction.
    whyItMatters: Hardware manufacturing and deployment can consume cash before customer receipts and recognized revenue arrive.
    diligencePath: >-
      Request a 24-month cash bridge with base, downside, and delayed-deployment cases, including capex and staffing
      commitments.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI007
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: CAC, sales cycle, deployment cost, utilization, renewal, and gross margin by cloud, hardware, and services stream.
    whyItMatters: >-
      The available evidence demonstrates activity but cannot establish whether each commercial motion scales
      profitably.
    diligencePath: >-
      Request cohort-level bookings, conversion, retention, utilization, support hours, cloud fees, and fully loaded
      delivery cost.
    relatedQuestionRefs:
      - QI003
      - QI005
      - QI006
  - type: conflicting-data
    severity: material
    topic: capital
    missingEvidence: >-
      A reconciled transaction-close statement linking the February cash figure, committed financing, gross proceeds,
      redemptions, fees, and the later cash-at-closing report.
    whyItMatters: >-
      The sources describe different transaction stages and the amounts must not be added or treated as one runway
      number.
    diligencePath: >-
      Reconcile the definitive transaction documents, closing statement, bank balances, and post-close capitalization
      table.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      A public or diligence-only service-quality record covering uptime, queue times, failed jobs, and maintenance
      interruptions.
    whyItMatters: Users need dependable access to convert a technically viable QPU into a production workflow.
    diligencePath: Request the latest twelve-month SLA, incident register, queue distribution, and anonymized job-success report.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: production-maturity
    missingEvidence: >-
      Independent customer workload results with raw benchmark conditions, repeatability, cost, and operational
      denominators.
    whyItMatters: Technical demonstrations and partner announcements do not establish durable production value.
    diligencePath: Request customer references, raw benchmark packages, workload success criteria, and repeat-run data.
    relatedQuestionRefs:
      - QE004
      - QE008
      - QE010
  - type: missing-source
    severity: material
    topic: roadmap
    missingEvidence: >-
      Dated roadmap milestones with delivered-versus-promised status for scaling, error correction, and software
      support.
    whyItMatters: The product is exposed to hardware, calibration, and software execution risk while the market is still developing.
    diligencePath: Request the board-approved roadmap, milestone evidence, dependency register, and change history.
    relatedQuestionRefs:
      - QE004
      - QE009
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer-level active accounts, utilization, GRR, NRR, churn, renewal rates, contract lengths, and repeat-revenue
      split by hardware, cloud, grants, and services.
    whyItMatters: >-
      Installed systems and announced collaborations can coexist with low utilization or project-shaped revenue, so
      durability cannot be assessed from deployment count alone.
    diligencePath: >-
      Request a customer cohort schedule with active jobs, paid usage, renewal dates, expansion, churn, and revenue mix
      for the latest twelve quarters.
    relatedQuestionRefs:
      - QU006
      - QU009
      - QU010
  - type: enumeration-incomplete
    severity: material
    topic: concentration
    missingEvidence: A complete customer and contract roster with top-customer share, geography, channel, and procurement status.
    whyItMatters: >-
      Public sources name several important counterparties but do not establish whether a small number of government,
      HPC, or strategic accounts dominate economics.
    diligencePath: Obtain a redacted customer concentration report and pipeline-to-revenue bridge by segment and channel.
    relatedQuestionRefs:
      - QU001
      - QU007
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: outcomes
    missingEvidence: >-
      Independent customer outcome measurements showing baseline, post-deployment result, workload volume, and
      production status.
    whyItMatters: >-
      Partnership announcements establish use-case relevance but do not prove quantum advantage, operational savings, or
      paid production impact.
    diligencePath: >-
      Request customer-approved case studies or anonymized benchmark packs with denominators, comparison baselines, and
      production timestamps.
    relatedQuestionRefs:
      - QU005
      - QU009
  - type: private-evidence-only
    severity: material
    topic: qpu-deployment
    missingEvidence: Independent uptime, acceptance, backlog, renewal, and production-use data for installed and in-production QPUs.
    whyItMatters: Installed hardware and a roadmap do not establish reliable recurring production revenue or customer outcomes.
    diligencePath: >-
      Request customer acceptance certificates, uptime and incident logs, backlog aging, renewal cohorts, and production
      workload evidence under NDA.
    relatedQuestionRefs:
      - QR003
      - QR004
      - QR006
    relatedTableRefs:
      - TR002
      - TR003
  - type: missing-source
    severity: material
    topic: liquidity
    missingEvidence: >-
      Audited cash balance, cash-burn profile, committed financing terms, conversion mechanics, and runway after the
      public listing.
    whyItMatters: Cash available at closing is not cash runway and does not resolve dilution or funding needs.
    diligencePath: >-
      Review post-close filings, audited interim financials, cap table, debt and convertible agreements, and a 24-month
      liquidity model.
    relatedQuestionRefs:
      - QR001
      - QR007
    relatedTableRefs:
      - TR001
      - TR003
  - type: missing-source
    severity: material
    topic: compliance
    missingEvidence: Pasqal-specific export classification, licences, FDI-screening determinations, and security-control testing.
    whyItMatters: General EU/UK guidance establishes exposure but not Pasqal's actual obligations or compliance status.
    diligencePath: >-
      Obtain product classifications, destination matrix, licences, screening filings, internal-control attestations,
      and incident register.
    relatedQuestionRefs:
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
      - TR002
  - type: missing-source
    severity: blocking
    topic: disclosure
    missingEvidence: Audited 2026 revenue by business line, gross margin, cash burn, cash balance, and forecast runway.
    whyItMatters: >-
      Without these measures, the reported transaction and market values cannot be tested against operating scale or
      capital intensity.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, bookings, backlog, and a cash forecast from
      management.
    relatedQuestionRefs:
      - QV002
      - QV006
      - QV008
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: Fully diluted cap table, conversion mechanics, liquidation preferences, warrants, and post-SPAC redemption impact.
    whyItMatters: Headline cash and market capitalization do not reveal economic ownership, dilution, or downside priority.
    diligencePath: >-
      Obtain the executed capitalization table, financing documents, warrant schedule, and transaction closing
      statement.
    relatedQuestionRefs:
      - QV001
      - QV006
  - type: missing-source
    severity: material
    topic: commercialization
    missingEvidence: Customer-level bookings, renewal rates, utilization, uptime, and paid production workload evidence.
    whyItMatters: Deployments and partnerships can remain pilot-heavy and do not by themselves establish repeatable revenue.
    diligencePath: >-
      Request anonymized cohort metrics, signed contract values, renewal history, service-level reports, and reference
      calls.
    relatedQuestionRefs:
      - QV003
      - QV007
  - type: missing-source
    severity: material
    topic: comparables
    missingEvidence: >-
      A comparable set with consistent revenue basis, growth, margins, capital intensity, share-count treatment, entry
      price, and exit horizon.
    whyItMatters: >-
      Public quantum market caps and broad market forecasts are not directly comparable valuation benchmarks and cannot
      establish Pasqal's target return or hold period.
    diligencePath: >-
      Build a dated comp set from audited public filings, completed private transactions, and disclosed enterprise
      contracts, then bridge a specified entry price to fully diluted exit proceeds.
    relatedQuestionRefs:
      - QV004
      - QV008
      - QV009
