      - Scenario
      - Explicit assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Deployments convert to repeatable enterprise workloads; new cash funds manufacturing and roadmap execution.
        - >-
          Above the approximately $4.3B August 28 market-cap mark only after audited growth, retention, and margins
          validate the premium.
        - Conditional upside; no probability can be supported.
        - Paid deployments or production milestones fail to scale.
      - - Base
        - Technical progress continues, but production adoption and revenue conversion take years.
        - >-
          The $2.0B pre-money transaction value to approximately $4.3B debut market-cap band is an observed anchor
          range, not fair value.
        - Most consistent with mixed traction and disclosure evidence.
        - Burn or dilution rises before commercial inflection.
      - - Bear
        - Pilot-heavy demand, weak renewals, delayed roadmap, or market-wide quantum retrenchment.
        - Below the $2.0B transaction anchor if expectations reset before revenue and margins scale.
        - Material downside signal; no probability can be supported.
        - Financing need arrives without validated unit economics.
    notes: >-
      Scenario bounds use unlike observed anchors—pre-money transaction value and an estimated debut market
      capitalization—not intrinsic-value targets; return math remains unavailable without entry price, fully diluted
      ownership, and cash-flow evidence.
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Pasqal progressed from a 2019 scientific spinout to cloud distribution and a reported 2026 Nasdaq debut, while
      commercial proof remains the key unresolved test.
    data:
      items:
        - date: '2019'
          label: Founded
          detail: Pasqal was founded as a neutral-atom quantum-computing spinout from Institut d'Optique.
          tone: neutral
          claimRefs:
            - CO001
        - date: '2022'
          label: Nobel-linked scientific foundation
          detail: Co-founder Alain Aspect received the 2022 Nobel Prize in Physics.
          tone: positive
          claimRefs:
            - CO005
        - date: '2025-03-14'
          label: Azure cloud integration reported
          detail: A syndicated Pasqal release announced neutral-atom access through Microsoft Azure Quantum.
          tone: positive
          claimRefs:
            - CO004
        - date: '2026-03-04'
          label: CEO configuration disclosed
          detail: The transaction announcement named former executive chair Wasiq Bokhari as CEO.
          tone: neutral
          claimRefs:
            - CO006
        - date: '2026-03-04'
          label: SPAC combination announced
          detail: Pasqal and Bleichroeder announced a transaction valuing Pasqal at $2.0 billion pre-money.
          tone: neutral
          claimRefs:
            - CO007
        - date: '2026-03-04'
          label: Convertible financing committed
          detail: The transaction included $200 million of committed convertible financing, subject to closing mechanics.
          tone: neutral
          claimRefs:
            - CO008
        - date: '2026-05-26'
          label: Form F-4 filing reported
          detail: Independent coverage reported a joint Form F-4 filing for the proposed combination.
          tone: neutral
          claimRefs:
            - CO007
        - date: '2026-08-28'
          label: Nasdaq debut and strategy pivot reported
          detail: Quantum Computing Report described a Nasdaq debut under PSQL and a shift toward a civil FTQC program.
          tone: neutral
          claimRefs:
            - CO016
    approximationNotes: >-
      Dates follow the retained sources; company-announced transaction milestones remain subject to the qualifications
      in those sources, and the final capitalization was not independently reconstructed.
    claimRefs:
      - CO001
      - CO004
      - CO005
      - CO006
      - CO007
      - CO008
      - CO016
