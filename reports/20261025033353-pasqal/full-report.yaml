            title: Commercial access is tangible
            body: >-
              Pasqal offers cloud access to 100-qubit-class QPUs with pay-as-you-go usage and has described
              production-oriented deployments with Aramco and other enterprise customers.
            calloutType: strength
            claimRefs:
              - CI001
              - CI005
          - type: callout
            title: Core underwriting data remains private
            body: >-
