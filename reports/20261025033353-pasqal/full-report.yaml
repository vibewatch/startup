              - CP006
              - CP016
      - number: '3.3'
        title: Distribution power, multi-homing, and switching cost
        blocks:
          - type: paragraph
            body: >-
              Pasqal is available through its own cloud, Google Cloud Marketplace, Scaleway, and, according to the
              retained evidence, Microsoft Azure. That footprint lowers procurement and infrastructure friction, but it
              also places discovery, billing, and customer access partly in the hands of cloud platforms that can
              present competing modalities. IonQ likewise advertises access through Google Cloud, Azure, AWS, and
              NVIDIA, while AWS Braket markets a common toolchain across hardware types. Multi-homing is therefore
              technically and commercially plausible. The more defensible switching costs are likely to reside in
              validated workloads, Pulser-based development, data and HPC integration, and operating knowledge, not in
              exclusive access to quantum hardware. Public sources do not quantify migration cost, retention, or
              production utilization.
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP014
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse evidence is structural rather than incident-based. An independent roadmap profile
              describes slower gates, environmental sensitivity, fidelity gaps, and difficult mid-circuit measurement as
              neutral-atom challenges. McKinsey says roadmaps across modalities are not directly comparable and that
              leadership by qubit count does not identify a winner. QED-C separately characterizes the supply chain as
              custom and fragile and expects useful applications on a three-to-five-year horizon. Pasqal's shift toward
              civil, commercially led fault-tolerant development and a bank roadmap targeting operational integration by
              2028 are strategic signals, not delivered economics. Durability therefore depends on turning access and
              co-development into reproducible production outcomes before a rival modality, cloud platform, or classical
              substitute proves better on total cost and time to solution.
            claimRefs:
              - CP007
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Distribution is Pasqal's clearest current advantage
            body: >-
              Direct cloud access and availability through major cloud and sovereign European channels lower
              infrastructure friction across buyer types.
            calloutType: strength
            claimRefs:
              - CP001
          - type: callout
            title: Access can enable multi-homing rather than lock-in
            body: >-
              Aggregators expose alternative modalities, while public evidence does not quantify retention, migration
              cost, production utilization, or superior total workload economics.
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Pasqal presents a hybrid monetization model rather than a pure software subscription. Its official cloud
              offer combines free emulator access, pay-as-you-go QPU usage, academic access, and enterprise packages
              priced on demand; the page also describes professional services bundled with premium usage. This supports
              a usage-led entry path, but list terms are not realized revenue, and the public material does not disclose
              bookings-to-revenue conversion, contract duration, take rates, renewal rates, or revenue mix between
              hardware, cloud usage, software, services, grants, and deployments. Independent coverage reports
              approximately $80 million of booked and awarded business including grants, but describes it as potential
              multi-year customer contract value expected to be realized over time, not current revenue or ARR. The
              financial quality signal is therefore commercial traction with material recognition and collection
              uncertainty.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: GTM motion and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              The go-to-market motion is enterprise and ecosystem-led. Pasqal sells or deploys QPUs on premises, offers
              cloud access through its own platform and third-party clouds, and works with industrial and research
              customers on application roadmaps. Aramco describes a production-ready QPU and a roadmap of energy,
              materials, and industrial use cases, while Crédit Agricole coverage describes a multi-year path from
              exploratory work toward operational banking workflows by 2028. These are useful proof points for adoption
              and deployment, but they do not establish CAC, sales cycle length, implementation cost, gross retention,
              expansion, or payback. The commercial model may produce large, lumpy contracts with meaningful integration
              work; investors should not infer SaaS-like efficiency from customer or partnership counts.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI014
      - number: '4.3'
        title: Capital adequacy and cost structure
        blocks:
          - type: paragraph
            body: >-
              The 2026 transaction evidence points to substantial capital availability for a hardware scale-up, but the
              sources differ by transaction stage and should not be blended. The March transaction announcement
              described a $2.0 billion pre-money valuation, $200 million of committed convertible financing, and
              approximately $158 million of cash on Pasqal's balance sheet as of February 28, 2026, alongside expected
              gross proceeds above $600 million subject to closing conditions. Later independent reporting described
              approximately €309 million ($360 million) in cash at closing after the August shareholder approval and
              listing. That later figure is a cash-at-closing report, not a disclosed runway calculation. The sources
              also identify manufacturing expansion, QPU deployment, staffing, research, and cloud/software investment
              as uses of capital. No public source in this pool provides current operating burn, capex schedule, debt
              service, working-capital needs, or cash runway.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI004
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Pasqal's financial profile is investable as a commercialization story but not yet underwritable on
              conventional public-company earnings or recurring-revenue metrics. The strongest positives are a real
              cloud and hardware delivery surface, named industrial use cases, a disclosed capital raise and later
              cash-at-closing report, and a customer base spanning energy, finance, logistics, and research. The main
              risks are that booked or awarded business may include grants and multi-year value, that pricing is partly
              on demand, and that manufacturing and deployment can consume capital before revenue is recognized.
              Independent analysis also characterizes scaling thousands of neutral atoms at high fidelity as an
              unprecedented engineering challenge, reinforcing execution and capital-intensity risk. The public record
              contains forward-looking statements and company-issued performance claims, including unaudited growth and
              booked-business figures, which require filings and customer-level verification. A financing-dependent plan
              should therefore be modeled with scenarios rather than a single revenue or runway point estimate.
            claimRefs:
