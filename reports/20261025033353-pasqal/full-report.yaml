  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: >-
      Ordinal placement separates observed access breadth from the specificity of retained public proof; it is not a
      performance ranking.
    data:
      xAxis: Buyer access breadth (ordinal 1-5)
      yAxis: Specificity of retained public proof (ordinal 1-5)
      points:
        - label: Pasqal
          x: 5
          'y': 3
          note: Multiple cloud and on-premise routes; standardized workload economics remain unavailable.
        - label: IonQ
          x: 5
          'y': 4
          note: Broad claimed cloud reach plus Azure device metrics; cross-modality economics remain unproven.
        - label: Quantinuum
          x: 3
          'y': 4
          note: McKinsey summarizes a detailed fidelity announcement; assigned access evidence is limited.
        - label: IBM
          x: 4
          'y': 3
          note: Broad incumbent ecosystem signal; no like-for-like Pasqal workload result is retained.
        - label: QuEra via AWS
          x: 4
          'y': 2
          note: Major cloud channel and same broad modality; retained page lacks comparative metrics.
        - label: Classical or internal build
          x: 5
          'y': 5
          note: Existing operational baseline for workloads that remain tractable classically.
    approximationNotes: >-
      Analyst-authored ordinal scores use only the retained evidence and preserve unknowns. Coordinates are not market
      share, measured performance, or claims of technical superiority.
    claimRefs:
      - CP003
      - CP008
      - CP009
      - CP014
      - CP016
  - id: FI001
    title: Commercial path from access to financial proof
    type: flow
    summary: >-
      Pasqal's public evidence shows a path from low-friction cloud access to enterprise deployments, but the
      revenue-recognition and margin steps remain unverified.
    data:
      nodes:
        - id: access
          label: Free emulators / developer access
          detail: Explorer offer and open-source tools
        - id: usage
          label: Pay-as-you-go QPU usage
          detail: Usage-based access through cloud channels
        - id: enterprise
          label: Premium enterprise access
          detail: Price-on-demand access, support and services
        - id: deployment
          label: On-premise / production deployment
          detail: Named industrial and research deployments
        - id: recognized
          label: Recognized revenue
          detail: Public amount and timing not disclosed
        - id: margin
          label: Gross profit / cash generation
          detail: Public amount and cost bridge not disclosed
      edges:
        - - access
          - usage
        - - usage
          - enterprise
        - - enterprise
          - deployment
        - - deployment
          - recognized
        - - recognized
          - margin
    claimRefs:
      - CI001
      - CI005
      - CI013
      - CI014
  - id: FE001
    title: Pasqal product architecture map
    type: stack
    summary: >-
      Pasqal's public product surface runs from neutral-atom hardware through programming and simulation to cloud
      execution and human-reviewed applications.
    data:
      layers:
        - name: Hardware
          label: Hardware
          detail: Neutral-atom QPUs and delivered systems form the physical execution layer.
          items:
            - label: Neutral-atom QPUs
              detail: Laser-controlled atoms serve as qubits; public sources describe on-premises and cloud use.
            - label: Orion and delivered systems
              detail: >-
                Official cloud page advertises 100+ qubit Orion access; EPO reports delivered 100-qubit and 200-qubit
                systems.
        - name: Control and software
          label: Control and software
          detail: Open-source programming and developer tools translate workloads into device-aware experiments.
          items:
            - label: Pulser
              detail: Open-source Python pulse programming and simulation for programmable neutral-atom arrays.
            - label: Solvers and SDKs
              detail: Open-source tools and developer SDKs support algorithm development and integration.
        - name: Emulation
          label: Emulation
          detail: Classical emulators provide a pre-execution testing path.
          items:
            - label: Cloud emulators
              detail: Users can test and refine algorithms before submitting work to physical QPUs.
            - label: Local simulation
              detail: Pulser includes classical simulation routines for development and testing.
        - name: Cloud operations
          label: Cloud operations
          detail: Cloud services coordinate job submission, monitoring, and external access.
          items:
            - label: Job platform
              detail: Submit, monitor, retrieve, retry, and cancel jobs through Pasqal Cloud documentation.
            - label: Partner clouds
              detail: >-
                Public materials identify Google Cloud and Microsoft Azure access, with the EPO source also naming OVH
                Cloud and Scaleway.
        - name: Applications and governance
          label: Applications and governance
          detail: Human review and authorization sit around the experiment lifecycle.
          items:
            - label: Human-reviewed experiments
              detail: >-
                The 2026 toolkit report describes Specify, Implement, Emulate, Submit, and Analyse stages with
                authorization before billable shots.
        - name: Support and maintenance
          label: Support and maintenance
          detail: On-premises delivery includes maintenance, while cloud materials describe customer support.
          items:
            - label: Service layer
              detail: Public evidence identifies maintenance and support but does not quantify service levels.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE008
      - CE016
  - id: FU001
    title: Customer journey from experimentation to production
    type: journey-map
    summary: >-
      Pasqal's public customer path runs from emulator and SDK experimentation through hosted QPU access and HPC
      integration toward application-specific production, with retention and economics still unverified.
    data:
      nodes:
        - id: experiment
          label: Experiment
          title: Emulator and SDK exploration
          details: Free Explorer access, local or remote emulators, Pulser, QoolQit, and application libraries.
          touchpoints:
            - Explorer tier
            - emulators
            - open-source SDKs
        - id: validate
          label: Validate
          title: Remote QPU and cloud testing
          details: Academic, pay-as-you-go, and third-party cloud routes allow algorithm testing on 100+ qubit systems.
          touchpoints:
            - Pasqal Cloud
            - Azure
            - Google Cloud
            - OVHcloud
            - Scaleway
        - id: integrate
          label: Integrate
          title: HPC and enterprise workflow integration
          details: Named programs connect QPUs to supercomputers and operational application teams.
          touchpoints:
            - GENCI/CEA
            - FZJ
            - Crédit Agricole CIB
            - Thales
        - id: deploy
          label: Deploy
          title: Production-oriented use
          details: >-
            Banking roadmap targets initial production use cases by 2028; other named projects remain evaluation or
            collaboration evidence.
          touchpoints:
            - Risk management
            - portfolio optimization
            - scheduling
        - id: expand
          label: Expand
          title: Repeat and broader workload use
          details: >-
            Potential expansion into additional users, workloads, and hybrid quantum-classical capacity is plausible but
            not publicly quantified.
          touchpoints:
            - Renewal
            - utilization
            - cross-workload adoption
        - id: retain
          label: Retain
          title: Durable customer economics
          details: >-
            Retention, churn, contract length, concentration, and recurring usage are not disclosed in the retained
            public evidence.
          touchpoints:
            - NRR
            - GRR
            - renewals
            - customer concentration
    claimRefs:
      - CU001
      - CU005
      - CU007
      - CU010
      - CU015
      - CU016
