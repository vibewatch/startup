      - number: '3.2'
        title: Capability and packaging comparison
        blocks:
          - type: paragraph
            body: >-
              Pasqal's official cloud surface packages a free emulator tier, quoted academic and premium tiers, and
              usage-based QPU access; no numeric QPU price is disclosed in the retained page. Microsoft documents
              materially different IonQ systems and exposes device-specific qubit counts, timing, fidelity,
              error-mitigation, and qubit-gate-shot billing mechanics, while AWS emphasizes consistent tooling across
              multiple device types. This is not a valid performance leaderboard: the disclosed metrics use different
              modalities, units, and issuer conventions. It does show a buyer trade-off. Pasqal offers a vertically
              integrated neutral-atom workflow and multiple channels, while aggregators and trapped-ion competitors
              expose alternative hardware without requiring the buyer to commit to Pasqal's stack.
            claimRefs:
