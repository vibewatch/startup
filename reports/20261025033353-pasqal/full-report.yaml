  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered platform and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Pasqal's product is delivered as a stack rather than a single software SKU. The core hardware uses
              laser-controlled neutral atoms as qubits, while software translates experiments into pulse sequences and
              supports classical simulation. The EPO case study describes both on-premises machines and cloud access,
              and identifies optimization and material discovery among application areas. Pasqal's current cloud surface
              packages emulators, 100+ qubit Orion access, open-source tools, SDKs, job monitoring, customer support,
              and third-party cloud integrations. The documentation confirms that a user can submit Python jobs to a QPU
              or emulator, monitor results, retry or cancel jobs, and inspect run statistics. This is a coherent
              workflow from algorithm development to emulation to remote execution, while customer-level uptime, queue
              performance, realized workload economics, and repeatable production outcomes remain open.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE015
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
              - CE008
              - CE009
              - CE010
              - CE012
      - number: '5.2'
        title: Hardware, software, and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The architecture is vertically integrated across neutral-atom hardware, pulse-level programming,
              simulation, cloud orchestration, and applications. Pulser is an open-source Python package for designing
              and simulating pulse sequences on programmable neutral-atom arrays, with both analog and digital use cases
              and device-specific validation. Pasqal's cloud documentation adds account setup, backend selection, open
              batches, retries, and emulator-to-QPU execution. The EPO source reports in-house assembly in France and
              Canada and four delivered systems since 2024, while also describing maintenance as part of the offering.
              These are meaningful maturity signals, but they are not equivalent to audited fleet availability or a
              standardized benchmark. The 2026 toolkit report provides the strongest current workflow proof, with five
              human-in-the-loop stages, explicit emulation before QPU execution, and authorization before billable
              shots. Its reported experiment results are company-linked technical demonstrations, not independent
              production validation.
            claimRefs:
              - CE006
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE008
              - CE016
              - CE019
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE008
              - CE016
      - number: '5.3'
        title: Differentiation, integrations, and dependencies
        blocks:
          - type: paragraph
            body: >-
              Pasqal's differentiation rests on neutral-atom control, a full-stack product surface, open-source
              adoption, and an intellectual-property portfolio. The EPO case study reports close to 90 patent families
              covering hardware and computer-implemented inventions, alongside trade secrets and know-how needed to
              assemble the system. Open source can lower adoption friction and increase hardware utilization, but it
              also creates a dependency on external developer participation and continued compatibility across the
              stack. Cloud distribution through Pasqal, Google Cloud, Microsoft Azure, OVH Cloud, and Scaleway broadens
              access while adding platform and partner dependencies. Pulser's public documentation exposes
              device-specific programming, simulation, runtime validation, and QPU execution surfaces; this developer
              surface does not by itself prove long-term support or commercial differentiation. QED-C describes the
              wider quantum supply chain as custom and fragile, with specialized components and requirements that are
              not yet standardized. Public evidence does not quantify comparative fidelity, error rates, cost per useful
              result, or the share of workloads that require bespoke services.
            claimRefs:
              - CE011
              - CE012
              - CE008
              - CE015
              - CE019
      - number: '5.4'
        title: Trust, safety, and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              The public operating controls are strongest at the experiment workflow layer. The agentic toolkit
              described in the retained technical report leaves human-readable intermediate files, requires emulation
              before hardware execution, and requires explicit authorization before a shot budget is billed or
              submitted. The cloud documentation also describes monitoring, result retrieval, retries, cancellation, and
              backend selection. These controls reduce accidental execution risk, but they are not a substitute for
              enterprise security or compliance evidence. The retained public evidence does not include an independent
              penetration test, formal security certification, service-level agreement, or complete data-governance
              statement. The commercial diligence package should therefore request architecture diagrams, isolation and
              access-control details, incident history, uptime and queue metrics, calibration and maintenance records,
              release-support policy, and customer-specific evidence that reported experiments moved beyond prototypes.
            claimRefs:
              - CE010
              - CE015
              - CE016
              - CE018
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Full-stack control with an adoption wedge
            body: >-
              The combination of QPU hardware, emulation, open-source programming, and cloud distribution gives Pasqal
              several routes into technical workflows rather than requiring an immediate on-premises purchase.
            calloutType: strength
            claimRefs:
              - CE002
              - CE011
              - CE012
          - type: callout
            title: Reliability and production proof are still open
            body: >-
              The retained sources document interfaces and demonstrations but do not provide a comparable public history
              of uptime, queue times, failure rates, security controls, or repeatable production outcomes.
            calloutType: risk
            claimRefs:
              - CE015
              - CE018
              - CE019
          - type: callout
            title: Underwrite the workflow, not the qubit headline
            body: >-
              Pasqal's product surface is credible enough for technical diligence, but investment confidence should
              depend on independent evidence of repeatable production execution, customer-support quality, security
              controls, and workload-level economics.
            calloutType: recommendation
            claimRefs:
              - CE004
              - CE008
              - CE015
              - CE019
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              Pasqal serves several distinct customer groups rather than one homogeneous buyer. Enterprise users seek
              optimization, simulation, or risk-management workflows; public HPC institutions procure systems and
              infrastructure access; cloud platforms distribute QPU access to researchers and developers; and academic
              or research users test algorithms through emulators, SDKs, and remote hardware. The official cloud offer
              separates Explorer, Academic, Pay-as-you-go, and Premium tiers, which indicates a funnel from
              experimentation to paid or supported hardware usage rather than a single contract shape. Documentation
              describes application libraries for combinatorial optimization, dynamical-system simulation, and
              quantum-inspired machine learning, while the cloud page names hybrid workloads, emulators, support,
              monitoring, and third-party cloud access. These surfaces establish user jobs and access routes, but they
              do not disclose active-account counts, revenue by segment, or conversion between tiers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU010
      - number: '6.2'
        title: Adoption trajectory and deployment footprint
        blocks:
          - type: paragraph
            body: >-
              Adoption evidence is most concrete where Pasqal's systems are installed in named infrastructure or exposed
              through named distribution channels. FZJ reports two 100+-qubit systems delivered to first customers at
              GENCI/CEA in France and FZJ in Germany, coupled to Joliot-Curie and JURECA DC supercomputers, with
              European users able to validate use cases through Pulser and remote access. A later cloud report describes
              Orion Gamma devices and digital twins available through Scaleway at Massy and Sherbrooke, while Pasqal's
              own page offers 100+ qubit QPU access and real-time batch monitoring. These are meaningful access and
              deployment milestones, but public sources do not provide utilization, job volumes, renewal rates, or a
              denominator for active users. The customer thesis therefore rests on installed and reachable capacity, not
              yet on demonstrated recurring consumption.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU010
              - CU015
              - CU016
      - number: '6.3'
        title: Named customer proof, expansion, and durability
        blocks:
          - type: paragraph
            body: >-
              Named use cases span financial risk and portfolio optimization, critical-system scheduling, drug
              discovery, energy, and hybrid HPC research. Crédit Agricole CIB describes a collaboration initiated in
              2019, projects initial production use cases as early as 2028, and distinguishes quantum-inspired classical
              production, quantum experimentation, and hybrid large-scale deployment. The Thales, GENCI, and
              Île-de-France partnership similarly targets planning and scheduling in logistics, air-traffic control,
              industrial automation, and other critical applications, while the HPCQS program records work in finance,
              pharma, and energy. These sources show credible workflow relevance and expansion paths, but mostly
              describe collaborations, pilots, or planned production rather than independently measured customer
              outcomes. No public source in the assigned pool discloses GRR, NRR, churn, contract length, top-customer
              share, or repeat-purchase rates; those omissions are material to durability and concentration assessment.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Commercial read-through and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Pasqal's customer evidence supports a positive but qualified adoption view. Distribution through Pasqal
              Cloud, Microsoft Azure, Google Cloud, OVHcloud, and Scaleway reduces infrastructure friction, while public
              HPC installations and named enterprise collaborations provide stronger proof than logos alone. At the same
              time, several sources are company or partner announcements, and the independent New Market Pitch review
              explicitly says it found machines, locations, and application areas but not a clean public view of job
              frequency, active external users, renewals, or revenue from repeat use. The appropriate investment
              question is therefore not whether Pasqal has customers or access channels; it does. The unresolved
              question is whether deployments become sticky, repeatable infrastructure consumption with measurable
              outcomes and diversified economic value. Procurement timelines, grant dependence, and technical maturation
              can all lengthen that conversion.
            claimRefs:
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Named deployment breadth
            body: >-
              Pasqal has evidence across cloud access, European HPC, finance, critical-industry scheduling, and
              scientific applications, giving the customer thesis more substance than a logo list.
            calloutType: strength
            claimRefs:
              - CU005
              - CU007
              - CU010
              - CU011
          - type: callout
            title: Durability is the missing proof
            body: >-
              Public evidence does not disclose active users, utilization, renewals, churn, contract length, or customer
              concentration, so adoption quality cannot yet be separated from project and infrastructure milestones.
            calloutType: risk
            claimRefs:
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Pasqal's public-market transition and strategic-technology position create distinct legal and compliance
              exposures. Reed Smith reports that the business combination closed and that approximately $360 million of
              cash was available at closing; that amount is closing liquidity, not evidence of runway or freedom from
              dilution. The European Commission says the revised foreign-investment screening regime will apply from 17
              January 2028 and will require national mechanisms covering sensitive strategic areas. Baker McKenzie
              reports that EU dual-use lists added controls related to quantum technology and recommends classification,
              licensing, internal-control, and documentation reviews. These sources do not establish a Pasqal violation
              or required licence, but they make ownership, export, product-classification, and post-listing controls
              material diligence items.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, quality, and technical execution
        blocks:
          - type: paragraph
            body: >-
              The operating system is promising but not yet low-risk. Pasqal's investor presentation states that seven
              QPUs with 100–200+ qubits are in commercial use and three more are in production, while also presenting a
              management estimate of 10,000–50,000 physical qubits, 200 logical qubits, and 99.9999% logical fidelity in
              2029. The same presentation warns that roadmap technology is not yet available to customers, may never
              become available or meet specifications, and could be delayed or never delivered. That explicit disclosure
              makes milestone slippage, defects, and lower-than-planned reliability the central technical risks. The
              retained evidence does not independently establish uptime, acceptance performance, incident history, or
              achievement of the 2029 targets.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR010
              - CR013
              - CR016
      - number: '7.3'
        title: Partner dependency and commercial adoption
        blocks:
          - type: paragraph
            body: >-
              Pasqal's route to scale depends on partners and on customers turning experiments into repeatable
              production workloads. Crédit Agricole CIB's account describes a multi-year roadmap that began with
              exploratory work and pilot validation before targeting operational industrialization by 2028; that is a
              meaningful customer-development signal, but it is also a dependency on one demanding enterprise workflow
              reaching production. Pasqal's own cloud page offers emulator access, pay-as-you-go QPU access, enterprise
              support, and third-party cloud integrations, yet the independent State of Quantum 2026 reports that only
              10% of surveyed organizations had limited production use and 3% had scaled deployment. Adoption may
              therefore lag technical availability, leaving partner concentration and conversion risk.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.4'
        title: Financial model and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The financial risk is a mismatch between the cost and timing of deep-tech execution and the proof required
              by public investors. Quantum Zeitgeist reports first-half 2026 total revenue of €4.9 million, QPU-services
              revenue of €3.9 million, and an operating loss of €59.2 million; it also says €37.5 million of that loss
              came from share-based payments and one-time public-company charges. Those figures show monetization
              alongside substantial reported loss, not cash burn or runway. The QED-C market forecast describes a market
              that reached an estimated $1.4 billion in 2025 while noting that 54% of respondents saw some probability
              of a quantum winter by 2031. A thesis break should be tied to measurable events: missed QPU delivery
              milestones, declining or non-renewing production contracts, export approvals that delay deployments, or
              liquidity that cannot fund the roadmap without materially dilutive financing.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Mitigation is real but not yet independently measured
            body: >-
              Installed QPUs, cloud access, partner roadmaps, and public-company liquidity reduce execution risk, but
              the retained file does not independently establish uptime, renewals, cash runway, or production-scale
              quantum advantage.
            calloutType: insight
            claimRefs:
              - CR005
              - CR009
              - CR010
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Pasqal's investment case is strengthened by evidence of a real deployed platform rather than a purely
              conceptual roadmap. The company reports seven deployed QPUs, three in production, more than 25 commercial
              and research applications, and access through major cloud ecosystems; an independent account also
              describes systems at national HPC centers and a 200-qubit deployment at Saudi Aramco. The financing is
              meaningful: the completed SPAC transaction provided approximately $360 million in cash, while earlier
              reporting described a $2 billion pre-money valuation and a separate $200 million financing. The
              anti-thesis is equally material. Independent reporting describes approximately $19 million of revenue and
              notes that the implied transaction multiple was near 96 times revenue; the same reporting says the share
              price nearly doubled on the first day. This is evidence of commercial traction and financing capacity, not
              proof that recurring revenue, margins, retention, or cash conversion justify the public price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
      - number: '8.2'
        title: Price discipline and financing context
        blocks:
          - type: paragraph
            body: >-
              The available financing evidence supports a price-sensitive recommendation rather than a binary technology
              judgment. TechCrunch reported the SPAC merger at a $2 billion pre-money valuation and a separate $200
              million private round, while the completed-deal report describes approximately $360 million of cash after
              shareholder approval and redemptions. The Signal subsequently estimated a roughly $4.3 billion market
              capitalization and contrasted it with approximately $19 million of trailing revenue, explicitly framing
              the resulting valuation as about 100 times revenue. These figures are not interchangeable: pre-money
              transaction value, post-close cash, market capitalization, and revenue measure different concepts and
              periods. The public file does not provide audited 2026 revenue, gross margin, burn, fully diluted share
              count, preference terms, or a verified recurring-revenue measure. Accordingly, entry discipline should
              require either a materially lower price or independently verified evidence of rapid revenue conversion and
              sustainable unit economics.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV016
      - number: '8.3'
        title: Scenarios and comparable signals
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single target price because the evidence base does not
              establish a stable revenue multiple or a mature recurring-revenue denominator. The bull case assumes that
              deployed systems, cloud access, and production partnerships convert into repeatable enterprise revenue
              while the company executes its roadmap and uses the new cash to expand manufacturing. The base case
              assumes continued technical and commercial progress but a long period of investment before quantum
              workloads become material to customer budgets. The bear case assumes that deployment remains pilot-heavy,
              capital needs stay high, and public-market expectations compress before revenue and margins scale. Market
              evidence supports both opportunity and caution: QED-C describes a 2025 market estimate of $1.4 billion and
              roughly 30% annual growth toward more than $3 billion by 2028, but also reports that 54% of respondents
              see some probability of a quantum winter by 2031. McKinsey separately estimates quantum-computing-company
              revenue at more than $1 billion in 2025 and $3.2 billion to $4.4 billion in 2028. A public-market
              reference is also imperfect: CompaniesMarketCap recorded IonQ at $12.66 billion in October 2026, but that
              market capitalization does not normalize revenue, growth, margins, modality, or dilution. These are sector
              and trading signals, not Pasqal forecasts or intrinsic valuation benchmarks.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV004
              - CV008
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.4'
        title: Decision, exit readiness, and thesis breaks
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a research-more recommendation with high risk and low-to-medium confidence in any
              precise valuation conclusion. Pasqal has a potentially differentiated neutral-atom platform, customer and
              HPC deployments, and fresh public capital, but the retained sources do not disclose the operating data
              needed to underwrite a public-market price. Before increasing exposure, diligence should obtain audited
              revenue by hardware, software, cloud, and services; bookings and backlog conversion; gross margin and
              cash-burn forecasts; fully diluted capitalization and financing preferences; customer concentration and
              renewal evidence; and uptime, benchmark, and production utilization data. The principal thesis-break
              triggers are a failure to convert deployments into paid recurring workloads, material dilution or
              financing dependence, missed manufacturing milestones, a material sector funding contraction, or failure
              to overcome neutral-atom fidelity and scaling constraints. Exit readiness is therefore conditional: a
              future financing, secondary mark, or public-market repricing should be assessed against verified revenue
              and cash metrics, not against the headline amount raised. A target return and hold period cannot be
              responsibly quantified without a dated entry price, fully diluted ownership, cash needs, and an
              evidence-based exit value.
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at current evidence
            body: >-
              Pasqal has credible technical and deployment signals, but the retained public evidence does not support
              underwriting its reported valuation anchors with confidence.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV004
              - CV006
              - CV013
              - CV016
          - type: callout
            title: The valuation denominator is the key gap
            body: >-
              Disclosed revenue, recurring revenue, margins, cash burn, dilution, and preference terms are not
              sufficient to establish a defensible entry price.
            calloutType: risk
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV013
              - CV015
          - type: callout
            title: Capital is an enabler, not a return
            body: >-
              The completed transaction provides capital for expansion, but funding raised is not cash available after
              all uses and is not evidence of shareholder return.
            calloutType: insight
            claimRefs:
              - CV001
              - CV011
              - CV013
