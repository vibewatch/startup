company:
  name: Pasqal
chapter:
  number: 2
  title: Market Analysis
  summary: Pasqal participates in a growing but still early neutral-atom and broader quantum-computing market. The evidence supports a boundary around quantum hardware, cloud access, software, and enterprise/HPC integration; it does not support treating broad quantum-industry forecasts as Pasqal-specific revenue.
sections:
  - id: market-boundary
    title: Boundary and market structure
    body: >-
      The narrow addressable market is neutral-atom quantum-computing hardware,
      cloud access, software tooling, and integration services for enterprise,
      research, government, and HPC buyers. It excludes general cloud revenue,
      unrelated quantum sensing, and the full value of customer applications
      such as logistics or finance. Pasqal's own cloud page describes emulators,
      QPU access, SDKs, support, monitoring, and third-party cloud integration,
      while its technology page places the product between on-premise hardware
      and cloud-based algorithms. This creates a hybrid market rather than a
      single hardware sale. The relevant substitutes are classical HPC and
      quantum-inspired algorithms for near-term workflows, plus other quantum
      architectures and managed cloud access for buyers that do not require
      neutral-atom hardware.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing through multiple lenses
    body: >-
      Available estimates are not interchangeable. GMI estimates the global
      neutral-atom quantum-computing market at $134 million in 2025 and
      $176.1 million in 2026, reaching $1.2 billion by 2035 at a 23.9% CAGR;
      its stated basis is global revenue across 2022–2025 with forecasts by
      paradigm, application, qubit scale, and end-user. Future Markets offers
      a 2026–2036 report with segmentation by customer type, application, and
      geography, but the fetched landing text does not expose a numeric total.
      QED-C gives a broader $1.9 billion 2025 global quantum-industry estimate
      and says quantum computing is scaling from $1.4 billion to more than
      $3 billion over 2025–2028. McKinsey separately estimates revenue for
      quantum-computing companies at $1.1–$1.4 billion in 2025, rising to
      $3.2–$4.4 billion in 2028, and says that estimate uses publicly announced
      startup revenue. These lenses establish direction and scale boundaries,
      not a defensible Pasqal SAM or SOM. Pasqal-specific public evidence
      supports commercial access and customers, but not a disclosed serviceable
      revenue pool.
    claimRefs: [CM004, CM005, CM006, CM007, CM015, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption
    title: Buyers, users, and adoption path
    body: >-
      The buyer map is segmented by budget owner and deployment friction. Public
      evidence points to government and HPC procurement as an early market
      anchor, while enterprise users validate workloads through cloud access
      before committing to dedicated systems. Pasqal's offers distinguish free
      emulator experimentation, academic access, pay-as-you-go QPU usage, and
      premium enterprise access with support and professional services. The
      user may be a quantum developer, researcher, or domain team; the payer is
      more likely to be an enterprise innovation, engineering, HPC, or
      government-program budget. Crédit Agricole CIB's described three-tier
      roadmap illustrates a path from quantum-inspired classical production to
      live hardware experimentation and then hybrid large-scale deployment.
      This supports a staged adoption thesis, but no source discloses conversion
      rates, renewal rates, or customer-level spend.
    claimRefs: [CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-and-constraints
    title: Drivers, constraints, and valuation relevance
    body: >-
      Adoption is driven by public investment, cloud availability, hybrid HPC
      integration, and demand for optimization, simulation, materials, and
      finance workloads. QED-C identifies talent scarcity, a custom and fragile
      supply chain, and the importance of public-private partnerships as
      industry constraints. GMI likewise says near-term revenue remains
      concentrated in government, national laboratories, and HPC procurement.
      Pasqal's March 2026 release states plans to double production capacity
      within 24 months and invest in fault-tolerant development, but labels
      forward-looking plans and warns that commercialization, market
      acceptance, unit economics, strategic partners, and revenue concentration
      remain risks. The market implication is a long qualification cycle:
      capital can accelerate capacity, yet valuation still depends on repeatable
      paid workloads, utilization, and renewals that the retained sources do
      not quantify. An independent critique also argues that McKinsey's upper
      value-at-stake analysis is not reproducible from the displayed assumptions
      and overlaps quantum with AI, reinforcing the need to separate provider
      revenue from downstream economic value.
    claimRefs: [CM012, CM013, CM014, CM015]
    tableRefs: []
