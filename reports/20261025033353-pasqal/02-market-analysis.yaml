callouts:
  - calloutType: insight
    title: Boundary before magnitude
    body: "The investable market is the monetizable layer around neutral-atom systems and workflows, not every dollar in quantum or customer-industry spend."
    claimRefs: [CM001, CM003, CM006]
  - calloutType: risk
    title: Commercial proof remains the bottleneck
    body: "The sources show access, pilots, and planned production workflows, but do not quantify recurring usage, renewals, or customer-level economics."
    claimRefs: [CM010, CM011, CM014, CM015]
