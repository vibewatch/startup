chapter:
  number: 5
  title: Product & Technology
  summary: Pasqal sells a full-stack neutral-atom quantum platform spanning QPUs, open-source programming tools, emulators, cloud access, and on-premises systems. Public evidence supports a credible hardware-software operating model and growing deployment surface, but reliability, production outcomes, security controls, and roadmap execution remain incompletely disclosed.
sections:
  - id: delivered-platform
    title: Delivered platform and customer workflow
    body: Pasqal's product is delivered as a stack rather than a single software SKU. The core hardware uses laser-controlled neutral atoms as qubits, while software translates experiments into pulse sequences and supports classical simulation. The EPO case study describes both on-premises machines and cloud access, and identifies optimization and material discovery among application areas. Pasqal's current cloud surface packages emulators, 100+ qubit Orion access, open-source tools, SDKs, job monitoring, customer support, and third-party cloud integrations. The documentation confirms that a user can submit Python jobs to a QPU or emulator, monitor results, retry or cancel jobs, and inspect run statistics. This is a coherent workflow from algorithm development to emulation to remote execution, while customer-level uptime, queue performance, realized workload economics, and repeatable production outcomes remain open.
    claimRefs: [CE001, CE002, CE003, CE004, CE015]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Hardware, software, and operating architecture
    body: The architecture is vertically integrated across neutral-atom hardware, pulse-level programming, simulation, cloud orchestration, and applications. Pulser is an open-source Python package for designing and simulating pulse sequences on programmable neutral-atom arrays, with both analog and digital use cases and device-specific validation. Pasqal's cloud documentation adds account setup, backend selection, open batches, retries, and emulator-to-QPU execution. The EPO source reports in-house assembly in France and Canada and four delivered systems since 2024, while also describing maintenance as part of the offering. These are meaningful maturity signals, but they are not equivalent to audited fleet availability or a standardized benchmark. The 2026 toolkit report provides the strongest current workflow proof, with five human-in-the-loop stages, explicit emulation before QPU execution, and authorization before billable shots. Its reported experiment results are company-linked technical demonstrations, not independent production validation.
    claimRefs: [CE006, CE008, CE009, CE010]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-dependencies
    title: Differentiation, integrations, and dependencies
    body: Pasqal's differentiation rests on neutral-atom control, a full-stack product surface, open-source adoption, and an intellectual-property portfolio. The EPO case study reports close to 90 patent families covering hardware and computer-implemented inventions, alongside trade secrets and know-how needed to assemble the system. Open source can lower adoption friction and increase hardware utilization, but it also creates a dependency on external developer participation and continued compatibility across the stack. Cloud distribution through Pasqal, Google Cloud, Microsoft Azure, OVH Cloud, and Scaleway broadens access while adding platform and partner dependencies. Pulser's public documentation exposes device-specific programming, simulation, runtime validation, and QPU execution surfaces; this developer surface does not by itself prove long-term support or commercial differentiation. QED-C describes the wider quantum supply chain as custom and fragile, with specialized components and requirements that are not yet standardized. Public evidence does not quantify comparative fidelity, error rates, cost per useful result, or the share of workloads that require bespoke services.
    claimRefs: [CE011, CE012, CE008, CE015, CE019]
  - id: controls-and-diligence
    title: Trust, safety, and diligence priorities
    body: The public operating controls are strongest at the experiment workflow layer. The agentic toolkit described in the retained technical report leaves human-readable intermediate files, requires emulation before hardware execution, and requires explicit authorization before a shot budget is billed or submitted. The cloud documentation also describes monitoring, result retrieval, retries, cancellation, and backend selection. These controls reduce accidental execution risk, but they are not a substitute for enterprise security or compliance evidence. The retained public evidence does not include an independent penetration test, formal security certification, service-level agreement, or complete data-governance statement. The commercial diligence package should therefore request architecture diagrams, isolation and access-control details, incident history, uptime and queue metrics, calibration and maintenance records, release-support policy, and customer-specific evidence that reported experiments moved beyond prototypes.
    claimRefs: [CE010, CE015, CE016, CE018]
callouts:
  - calloutType: strength
    title: Full-stack control with an adoption wedge
    body: The combination of QPU hardware, emulation, open-source programming, and cloud distribution gives Pasqal several routes into technical workflows rather than requiring an immediate on-premises purchase.
    claimRefs: [CE002, CE011, CE012]
  - calloutType: risk
    title: Reliability and production proof are still open
    body: The retained sources document interfaces and demonstrations but do not provide a comparable public history of uptime, queue times, failure rates, security controls, or repeatable production outcomes.
    claimRefs: [CE015, CE018, CE019]
  - calloutType: recommendation
    title: Underwrite the workflow, not the qubit headline
    body: Pasqal's product surface is credible enough for technical diligence, but investment confidence should depend on independent evidence of repeatable production execution, customer-support quality, security controls, and workload-level economics.
    claimRefs: [CE004, CE008, CE015, CE019]
