company:
  name: Pasqal
chapter:
  number: 3
  title: Competitors
  summary: >-
    Pasqal competes as a full-stack neutral-atom platform against other
    modalities, cloud aggregators, and classical or internal alternatives.
    Its multi-cloud distribution is tangible, but public evidence does not yet
    establish superior workload economics, standardized performance, or durable
    customer lock-in.
sections:
  - id: competitive-set
    title: Competitive set and buyer alternatives
    body: >-
      The competitive boundary is wider than neutral-atom hardware. Pasqal's
      buyer can select trapped-ion platforms such as IonQ and Quantinuum,
      superconducting platforms and full-stack incumbents such as IBM, neutral-
      atom access from QuEra through AWS Braket, or remain on classical HPC and
      internal optimization workflows. McKinsey explicitly says no modality or
      player is yet dominant and warns that qubit roadmaps are not reliable
      evidence of delivery. Pasqal is differentiated by combining its own QPU,
      software, emulation, cloud access, and on-premise deployment, but those
      capabilities compete with broad cloud catalogs and incumbent integration
      reach rather than with one like-for-like vendor. The resulting market is
      a portfolio contest across modality, workflow, access, and proof.
    claimRefs: [CP001, CP003, CP004, CP006, CP008, CP009]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-packaging
    title: Capability and packaging comparison
    body: >-
      Pasqal's official cloud surface packages a free emulator tier, quoted
      academic and premium tiers, and usage-based QPU access; no numeric QPU
      price is disclosed in the retained page. Microsoft documents materially
      different IonQ systems and exposes device-specific qubit counts, timing,
      fidelity, error-mitigation, and qubit-gate-shot billing mechanics, while
      AWS emphasizes consistent tooling across multiple device types. This is
      not a valid performance leaderboard: the disclosed metrics use different
      modalities, units, and issuer conventions. It does show a buyer trade-off.
      Pasqal offers a vertically integrated neutral-atom workflow and multiple
      channels, while aggregators and trapped-ion competitors expose alternative
      hardware without requiring the buyer to commit to Pasqal's stack.
    claimRefs: [CP002, CP004, CP005, CP006, CP016]
    tableRefs: [TP002, TP003]
  - id: distribution-and-switching
    title: Distribution power, multi-homing, and switching cost
    body: >-
      Pasqal is available through its own cloud, Google Cloud Marketplace,
      Scaleway, and, according to the retained evidence, Microsoft Azure. That
      footprint lowers procurement and infrastructure friction, but it also
      places discovery, billing, and customer access partly in the hands of
      cloud platforms that can present competing modalities. IonQ likewise
      advertises access through Google Cloud, Azure, AWS, and NVIDIA, while AWS
      Braket markets a common toolchain across hardware types. Multi-homing is
      therefore technically and commercially plausible. The more defensible
      switching costs are likely to reside in validated workloads, Pulser-based
      development, data and HPC integration, and operating knowledge, not in
      exclusive access to quantum hardware. Public sources do not quantify
      migration cost, retention, or production utilization.
    claimRefs: [CP001, CP005, CP006, CP014, CP015]
  - id: durability-and-displacement
    title: Moat durability and displacement risk
    body: >-
      The strongest adverse evidence is structural rather than incident-based.
      An independent roadmap profile describes slower gates, environmental
      sensitivity, fidelity gaps, and difficult mid-circuit measurement as
      neutral-atom challenges. McKinsey says roadmaps across modalities are not
      directly comparable and that leadership by qubit count does not identify
      a winner. QED-C separately characterizes the supply chain as custom and
      fragile and expects useful applications on a three-to-five-year horizon.
      Pasqal's shift toward civil, commercially led fault-tolerant development
      and a bank roadmap targeting operational integration by 2028 are strategic
      signals, not delivered economics. Durability therefore depends on turning
      access and co-development into reproducible production outcomes before a
      rival modality, cloud platform, or classical substitute proves better on
      total cost and time to solution.
    claimRefs: [CP007, CP008, CP010, CP011, CP012, CP013, CP016]
