    columns: [provider_or_package, price_or_unit, included_capabilities, discounts_or_unknowns, diligence_implication]
    rows:
      - ["Pasqal Explorer", "Free", "emulators, open-source software, and Pulser Studio", "QPU access not included", "supports low-friction learning but not hardware economics"]
      - ["Pasqal Academic", "Price on demand", "restricted emulators, 100-qubit QPU access, and basic support", "numeric price and contract minimum are undisclosed", "academic access is visible but not comparable on cost"]
      - ["Pasqal Pay-as-you-go", "usage-based billing; numeric rate not shown", "restricted emulators, 100-qubit QPU, and standard tools", "discounts, queues, and realized price are undisclosed", "reduces commitment while preserving price opacity"]
      - ["Pasqal Premium", "Price on demand", "priority emulators, premium QPU access, full platform, and support", "numeric price and enterprise discount are undisclosed", "services may differentiate the tier but margin is unknown"]
      - ["IonQ through Azure", "Pay As You Go; usage tracked in qubit-gate-shots", "Aria, Forte, Forte Enterprise, simulation, and error mitigation", "retained page points elsewhere for numeric rates", "billing mechanics are clearer than comparable delivered cost"]
      - ["Amazon Braket", "simple pricing claimed; numeric rate absent from retained page", "multiple device types, simulators, hybrid jobs, and reserved access", "device-level rates and discounts are not in the retained text", "aggregator packaging can facilitate multi-homing"]
    notes: "Public list-model snapshot only. Revenue, realized prices, discounts, utilization, gross margin, and total workload cost are not disclosed in the assigned evidence."
    claimRefs: [CP002, CP004, CP006, CP016]
