      - ["hardware modality", "neutral atoms", "trapped ions", "multi-hardware service with QuEra neutral atoms", "classical CPU, GPU, or HPC"]
      - ["public cloud access", "own cloud plus Google, Scaleway, and reported Azure access", "IonQ claims Google, Azure, AWS, and NVIDIA access", "AWS-managed service", "existing enterprise cloud or data center"]
      - ["on-premise signal", "company says systems are available on-premise", "Forte Enterprise is documented for standard data centers", "not established in retained AWS page", "already under buyer control"]
      - ["emulation or preflight", "free and restricted emulator tiers", "Azure lists a 29-qubit idealized simulator", "AWS advertises circuit simulators", "classical testing is native"]
      - ["public performance detail", "100+ qubit count; common workload result unavailable", "Azure publishes device-specific timing and fidelity for Aria", "no comparative metric in retained page", "no quantum metric; benchmark is workload-specific"]
      - ["fault-tolerance evidence", "roadmap and commercially led R&D direction", "vendor roadmap and error mitigation, not fault tolerance", "not established in retained page", "not applicable"]
    notes: "Cells report only retained disclosures. A populated cell is not an independent benchmark, and 'not established' means the assigned source pool did not support the comparison."
    claimRefs: [CP001, CP002, CP004, CP005, CP006, CP011, CP016]
  - id: TP003
