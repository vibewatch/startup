    approximationNotes: "Analyst-authored ordinal scores use only the retained evidence and preserve unknowns. Coordinates are not market share, measured performance, or claims of technical superiority."
    claimRefs: [CP003, CP008, CP009, CP014, CP016]
callouts:
  - calloutType: strength
    title: Distribution is Pasqal's clearest current advantage
    body: >-
      Direct cloud access and availability through major cloud and sovereign
      European channels lower infrastructure friction across buyer types.
    claimRefs: [CP001]
  - calloutType: risk
    title: Access can enable multi-homing rather than lock-in
    body: >-
