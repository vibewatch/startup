      - [Classical HPC or internal build, "status quo substitute", "existing buyer infrastructure; no quantum scale metric applies", "teams with tractable optimization or simulation workloads", "known reliability, talent, and operating economics", "may not solve future quantum-suitable subproblems but remains the present baseline"]
    notes: "Source-constrained profile as of 2026-10-25. Vendor metrics retain their original modality and disclosure basis; unknown funding, pricing, utilization, and like-for-like performance are not estimated."
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP008, CP009, CP012]
