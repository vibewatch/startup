  - id: direct-peer-profiles
    title: Direct Peer Profiles — OfBusiness, Infra.Market, Zetwerk, and Moglix
    body: >-
      OfBusiness is the most direct and formidable peer. Founded in 2015, it has reached Series G with $776M raised and
      a $5B valuation per Tracxn, operating as aggregator, manufacturer (30-plus world-class processing plants),
      importer/exporter, and SaaS/AI provider simultaneously. Its FY24 operating revenue of Rs 19,296 crore (up 26%
      YoY) and net profit of Rs 603 crore demonstrate that a B2B procurement platform can be profitable in India at
      scale—a model JSW One has not yet matched. The separate Oxyzo Financial Services arm (lending) reported FY26 net
      profit of Rs 375 crore on 23% revenue growth and is expanding further via an acquisition of bond-distribution
      platform GoldenPi Tech. OfBusiness has 2 million-plus SMEs and covers steel, aluminium, agriculture, petroleum,
      energy, polymers, and chemicals—a far broader commodity palette than JSW One's construction-and-manufacturing
      steel, cement, and paints focus. It is IPO-bound with a target of $750M–$1B; co-founder Nitin Jain's departure in
      December 2025 is the one publicly observable governance friction, but it has not derailed the listing timeline.

      Infra.Market was founded in 2016 (Thane) and has raised $804M at a ₹24,700 crore (~$2.8B) valuation. It focuses
      on the full construction project lifecycle through a multi-channel model spanning B2B direct (contractors,
      developers) and B2R (17,256 retail touchpoints, dealers, sub-dealers). Its 283-plus manufacturing facilities
      (163 owned) give it a physical moat similar in character to JSW One's parent supply advantage, but independently
      built rather than inherited. Revenue grew 27% YoY to Rs 18,472 crore in FY25, though profit fell 42%, reflecting
      higher financing and staff costs. Infra.Market has filed confidentially for a Rs 5,000 crore IPO but carries a
      credit risk flag: India Ratings issued a downgrade in June 2025 citing debt refinancing concerns and negative cash
      flow, and the company raised Rs 1,250 crore in debt ahead of the IPO in February 2026 to refinance existing
      borrowings. The house-of-brands portfolio (Shalimar Paints, RDC, Inicio, Amstrad, Robo, and others) gives it
      pricing power and customer loyalty that a transaction-only marketplace cannot easily replicate.

      Zetwerk is a global manufacturing platform rather than a procurement marketplace. It serves 1,800-plus active
      customers across 20-plus countries, has manufactured 9 million-plus parts, and markets up to 50% lead-time
      reductions for capital goods, consumer goods, and precision parts. Its model is manufacturing-as-a-service (not
      materials distribution), so direct overlap with JSW One's MSME procurement marketplace is limited. Zetwerk's
      customer base skews toward global OEMs and mid-large industrials (including Hitachi as a quoted reference), not
      the Rs 25 crore–Rs 2,500 crore Indian construction MSME. Where overlap exists is on the manufacturing segment
      of JSW One's addressable market; Zetwerk's global sourcing network competes with JSW One for sophisticated
      manufacturing clients that need custom or precision components rather than commodity steel.

      Moglix, founded in 2015 by Rahul Garg, focuses on MRO (maintenance, repair, operations) and industrial supplies
      for India's manufacturing sector, reaching a $2.6B valuation after a $250M raise in early 2022. Its fintech arm,
      Credlix, acquired a two-thirds stake in NBFC Vanik Finance (Rs 80 crore) in December 2025 after RBI approval,
      formalising its lending presence in a manner similar to JSW One's JOFL launch. Moglix also expanded its
      manufacturing footprint through the Rs 80 crore acquisition of paper manufacturer Khatema Fibres in November
      2024 and inaugurated a bitumen facility in July 2025. Amit Kumar was appointed MD and Chief Business Officer in
      May 2026, signalling a leadership push heading into its own IPO preparation. Moglix's core overlap with JSW One
      is narrower than OfBusiness's: it competes in manufacturing procurement broadly, but its MRO and industrial
      supply categories differ from JSW One's construction-materials and steel focus.
