  - id: TP004
    title: Moat durability and competitive risk register
    columns:
      - moat claim
      - competitive threat
      - severity
      - mitigation / diligence ask
    rows:
      - - JSW Group parent supply certainty (steel, cement, paints at cost)
        - OfBusiness replicating via 30+ own manufacturing plants; Infra.Market via 283+ facilities; Birla Pivot via ABG brands
        - Medium
        - Verify cost-of-goods differential in IPO-bound disclosures; check if JSW Group transfer pricing creates margin benefit
      - - JOFL integrated NBFC (purchase finance, vendor finance, working capital)
        - Oxyzo is profitable and expanding into capital markets; Credlix acquired Vanik NBFC Dec 2025; both have more mature AUM and NPA history
        - High
        - Track JOFL AUM, NPA rate, and co-lending ROI vs. Oxyzo; request audited JOFL financials in IPO prospectus
      - - 86,000+ MSME registered base and brand trust in construction materials
        - Birla Pivot scaling to 375 cities with ABG brand equity; OfBusiness growing 2M+ SMEs; multi-homing is easy for most buyers
        - High
        - Monitor cohort GMV retention; compare MSME NPS or repeat-purchase rate vs. disclosed peers
      - - Full-stack integration (commerce + logistics + credit + private brands)
        - OfBusiness covers procurement + credit + manufacturing but not private brands at scale; no single independent peer offers all four together
        - Medium
        - Assess whether private-brand margins (TMT, Concrete) are disclosed and material in IPO filing
      - - IPO-cohort narrative (first-mover capital advantage post-listing)
        - All four major peers (OfBusiness, Infra.Market, Zetwerk, Moglix) and Birla Pivot also racing to scale before listing; if JSW One misses FY26 break-even target, valuation vs. peers compresses
        - High
        - Track break-even progress each quarter; verify OfBusiness/Infra.Market listing timelines for comparative re-rating risk
    notes: >-
      Severity ratings are qualitative assessments based on publicly available evidence and scale comparisons; they
      are not independently audited. "High" means the threat is backed by specific competitor evidence and could
      materially affect JSW One's competitive position or IPO valuation within 12 months.
