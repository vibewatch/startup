  evidenceGaps:
    - type: missing-source
      severity: material
      topic: peer customer counts
      missingEvidence: >-
        Public disclosure of active registered or transacting customer counts for OfBusiness, Infra.Market, Moglix,
        and Zetwerk on a comparable basis to JSW One's 86,000+ MSME figure.
      whyItMatters: >-
        Customer count and MSME retention rate are the primary proxy for moat and switching-cost depth; without peer
        figures, the relative competitive position cannot be assessed with confidence.
      diligencePath: >-
        Request DRHP or IPO prospectus disclosures for OfBusiness and Infra.Market; monitor press coverage of
        pre-IPO investor decks for customer count disclosures.
      relatedQuestionRefs:
        - QP009
    - type: missing-source
      severity: material
      topic: independent competitive analysis
      missingEvidence: >-
        Independent analyst or research-firm coverage directly comparing JSW One's competitive positioning,
        unit economics, and market share versus OfBusiness and Infra.Market.
      whyItMatters: >-
        All competitive characterisations rely on company-claimed data or news aggregations; no independent
        benchmark or third-party market-share estimate was accessible in the fetched sources.
      diligencePath: >-
        Request RedSeer, Redseer, BCG, or McKinsey B2B India market reports; look for investor deck leaks
        or IPO-filing comparables sections as DRHP documents become available.
      relatedQuestionRefs:
        - QP017
    - type: private-evidence-only
      severity: minor
      topic: Zetwerk valuation and IPO status
      missingEvidence: >-
        Zetwerk's current valuation (last known ~$2.7B from 2021 Series F) and confirmed IPO filing status as of
        June 2026; the company's Tracxn profile URL returned a 404, and no recent funding news was retrieved.
      whyItMatters: >-
        Without a fresh valuation anchor, Zetwerk cannot be placed accurately in the IPO-cohort competitive
        comparison, and its strategic trajectory is unclear.
      diligencePath: >-
        Monitor Economic Times, Mint, and VC Circle for Zetwerk pre-IPO or DRHP announcements in H2 2026.
      relatedQuestionRefs: []
