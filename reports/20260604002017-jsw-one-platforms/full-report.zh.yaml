      - number: '7.3'
        title: NBFC 监管与牌照风险
        blocks:
          - type: paragraph
            body: >-
              JSW One Finance Limited 于 2024 年 10 月根据 RBI Act 第 45-IA 条，从 Reserve Bank of India 取得 NBFC 注册证书。注册所需最低 Net
              Owned Fund 门槛为 Rs 10 crore；公司登记显示 JOFL 实缴资本 Rs 294.78 crore，远高于该要求。但监管风险不在注册门槛，而在 JOFL 扩张时管控信贷质量、资本充足率和
              治理的运营要求。RBI 的 Scale Based Regulation 框架将 NBFC 分为 Base Layer（AUM 低于 Rs 1,000 crore）、Middle Layer（高于 Rs
              1,000 crore）、Upper Layer 和 Top Layer。以当前约 Rs 100 crore AUM（2025 年 10 月）看，JOFL 明确处于 Base Layer，但管理层目标是 FY26
              末达到 Rs 500 crore。如果 JOFL 在两到三年内越过 Rs 1,000 crore 门槛——考虑到合作共贷伙伴每月发放 Rs 475–500 crore，这一路径 并非不可能——它会被重分类为
              Middle Layer，面对更严格的治理、资本要求和监管报送义务。另一个维度是， RBI 在 2025 年初收紧所有 NBFC 的 NPA 拨备规范，在贷款账簿仍处搭建期时就提高了 JOFL 承保职能的合规
              负担。JOFL 没有披露 NPA 率或 Stage 3 资产。SEBI Act 还管辖一级市场准入；IPO 申报前任何与 NBFC
              相关的监管处分，都会让上市时间表复杂化。下方监管和法律风险枚举被评估为部分覆盖——公开来源无法获得 更多执法数据、法院记录和监管往来。
