    rows:
      - - JSW One Platforms
        - 全栈 B2B 市场（钢材、水泥、涂料、自有品牌、物流、信贷）
        - FY25 GMV Rs 12,567 cr；独角兽（$1B）；已融资约 Rs 1,120 cr
        - 印度建筑和制造业 MSME（营业额 Rs 25–2,500 cr）
        - 母公司 JSW Group 提供供应确定性；内嵌 JOFL NBFC；自有品牌
        - 绝对 GMV 最小；JOFL 仍在早期；品类宽度更窄
      - - OfBusiness
        - B2B 原材料采购 + 信贷（7+ 条供应链）
        - FY24 收入 Rs 19,296 cr；估值 $5B；已融资 $776M（Series G）
        - 制造业各领域 SME 和中端市场
        - 已盈利（FY24 利润 Rs 603 cr）；Oxyzo NBFC 已规模化；2M+ SME；30+ 座工厂
        - 建筑行业深度较弱；更宽但垂直整合较少
      - - Infra.Market
        - 覆盖建筑全生命周期（结构、装修、生活方式材料）
        - FY25 收入 Rs 18,472 cr；估值约 $2.8B；已融资 $804M（Series G）
        - 建筑和基础设施领域的承包商、开发商、零售商
        - 283+ 座制造设施；品牌矩阵（Shalimar Paints、RDC）；B2R
        - FY25 利润下滑 42%；India Ratings 下调评级；债务再融资压力重
      - - Zetwerk
        - 制造即服务（资本品、消费品、精密零部件）
        - 估值约 $2.7B；已融资 $360M+（已知最近一轮为 2021 年 Series F）
        - 全球 OEM、工业企业、中大型制造商（包括 Hitachi）
        - 全球制造网络；交期缩短 50%；覆盖 20+ 个国家
        - 模式不同（全球 MaaS）；与 MSME 建筑采购重叠较少
      - - Moglix
        - B2B MRO + 工业品供应 + 制造；Credlix 金融科技部门
        - 估值 $2.6B；已融资 $250M+；Credlix 持有 NBFC 牌照（收购 Vanik）
        - 印度制造业；采购 + 供应链管理
        - Credlix NBFC 正式化；收购 Khatema Fibres；沥青设施
        - 聚焦 MRO；自有品牌有限；品类重叠窄于 OfBusiness
      - - Birla Pivot
        - 建筑材料 B2B 电商（水泥、钢材、瓷砖、涂料）
        - ARR Rs 5,000 cr（2 年）；FY27 目标 $1B；Grasim Industries（ABG）支持
        - 建筑行业的建造商、承包商、开发商、经销商、MSME
        - ABG 母公司品牌 + LLM 驱动采购 + 375 个城市；ARR 增长 4.8x
        - 平台较新（2023）；无公开财务；扩张依赖 Grasim 资本开支
      - - Amazon Business India
        - 横向 B2B 在线批发（品类广，无建筑专长）
        - 自称印度最大 B2B 在线市场；无公开融资数据
        - 寻求广泛间接采购的各类规模企业
        - 海量目录；GST 发票；合规工具；可信品牌
        - 无贸易信贷；无重材料物流；不专注建筑行业
      - - IndustryBuying / IndiaMART
        - MRO / 工业品供应（IndustryBuying）；线索生成市场（IndiaMART）
        - IndustryBuying：15 lakh+ 客户；IndiaMART：印度最大 B2B 市场
        - IndustryBuying：MRO 买家；IndiaMART：寻找买家线索的供应商
        - IndustryBuying：IB Credit 30 天；IndiaMART：广泛供应商发现
        - 两者都不直接服务建筑 MSME 的钢材 / 水泥 / 物流栈
    notes: >-
      同业的规模 / 融资数字来自 Tracxn（2024-2025 年版）、Economic Times 和 Outlook Business，截至 2026-06-04 运行日期。OfBusiness 为 FY24
      收入；Infra.Market 为 FY25 收入；Zetwerk 估值是 2021 年 Series F 轮估计值， 可能已经过时。JSW One 的 GMV 不能与同业经营收入直接比较。混合 B2B 模式的行已在适用处标注。
