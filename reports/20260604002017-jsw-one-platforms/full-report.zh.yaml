            body: >-
              战略逻辑可信，GMV 曲线也亮眼，但在 $1 billion 估值上形成投资信念，还缺足够的财务透明度。最佳重新进入点，是 FY25 审计结果确认盈亏平衡路径、Pre-IPO ₹650–700 crore
              轮完成之后；届时会有新的估值锚，也能验证投资者在当前或更高估值上的需求。
