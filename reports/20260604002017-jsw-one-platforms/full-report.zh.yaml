      - number: '4.2'
        title: 收入模式与公开财务增长证据
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 采用主体采购模型，而非纯市场模型。公司大规模采购建筑材料——主要是来自 JSW Steel 和第三方钢厂的钢铁，其次是水泥、涂料和相关建筑产品——再转售给 MSME
              承包商和开发商。主体模型把全部销售收入确认为收入，因此 FY25 出现约 31.6% 的收入 / GMV 比率（₹3,976 crore 收入，对应 ₹12,567 crore GMV）。FY23 收入为
              ₹338.8 crore；FY24 约增长 4.2x 至 ₹1,421.9 crore；FY25 按 Economic Times 为约 ₹3,976 crore，按 Tracxn 为 ₹3,980
              crore，约为 2.8x YoY 增长。截至 2025 年 6 月，公司月度 GMV 约 ₹1,400 crore，说明 FY26 年化节奏可轻松超过 ₹16,000 crore。钢铁产品约占 FY25 收入的
              82%，水泥、涂料、瓷砖、卫浴洁具、电线和其他建筑收尾材料贡献剩余 18%。自有品牌产品和物流服务被公开描述为战略重点，但在已披露数字中仍是早期贡献者。信贷撮合在结构上嵌入平台：约 40% GMV，或每月约
              ₹500 crore，通过包括 ICICI、IndusInd、Yes Bank、Axis Bank、Standard Chartered、Kotak、IDBI、Mizuho 和 TCL
              在内的九家具名合作放贷方，以延期信用条款提供给 MSME 买家。JSW One 从这九家放贷方赚取的费用或推荐收入没有公开披露，留下了一个重要的收入质量和利润率问题。
