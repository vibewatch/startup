      - number: '8.2'
        title: 融资背景、估值标记与进入纪律
        blocks:
          - type: paragraph
            body: >-
              约 30 个月里，JSW One 完成了三轮外部融资，合计约 $136 million（₹1,120 crore），每一轮都大幅重估估值。2023 年 4 月 Mitsui & Co. 以 ₹205
              crore（$25 million）投资，按约 ₹2,750 crore（约 $300 million）估值完成 Series A。2025 年 5 月，由 Principal Asset
              Management、OneUp 和 JSW Steel 领投的 ₹340 crore 轮把估值推到 $1 billion 以上；在 240% GMV 激增支撑下，两年内估值跳升逾三倍。2025 年 10
              月，SBI、International Conveyors 和 Scarlett Ventures 参与的 ₹575 crore 延伸轮按约 ₹8,575 crore（约 $1.02
              billion）执行，确认独角兽估值，而不是继续上调；该轮核心目的，是给 NBFC 子公司补资本并扩大分销。

              Tracxn 最近披露的 JSW One MSME 估值为 $925 million，略低于公司宣布的 $1 billion；差异来自 2025 年 5 月部分批次与 10 月完整延伸轮的口径不同。Tracxn
              记录的累计融资为 $91.6 million，扣除 10 月最终交割后，与 ₹1,120 crore 的合计口径相符。

              从入场纪律看，当前私募估值约 $1B（₹8,575 crore），对应：（a）约 0.68× FY25 GMV；（b）约 2.16× FY25 收入 ₹3,976 crore；（c）由于未披露
              EBITDA，EBITDA 倍数无法判断。Series B 之后，优先权压力不小：JSW Steel、Principal Asset Management、SBI 和 Mitsui 均持有清算优先权，若 IPO
              估值低于预期，瀑布分配会产生影响。公司计划在 2026 自然年进行 Pre-IPO ₹650–700 crore 私募轮，正是为了在 $350–400 million
              公开发行前锚定更高估值基准；创始团队显然在主动管理定价过程。
