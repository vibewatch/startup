      - number: '7.4'
        title: MSME 信贷与财务模型风险
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 的财务模型在结构上依赖信贷促成：超过三分之一订单使用信贷，合作共贷安排下的月度 放款额达到 Rs 475–500 crore，期限 60–90 天。JOFL 自有账簿约 Rs
              100 crore。这带来三条明确财务风险 线。第一是信用损失敞口：建筑和制造业 MSME 借款人对周期敏感，钢材需求急剧下行会同时减少新订单并提高 未偿 60–90 天贷款的违约率。JOFL
              账簿或合作共贷组合都没有披露 NPA 率或违约损失率。第二是 利润率与抽佣率压缩：FY25 GMV 为 Rs 12,567 crore、收入约 Rs 3,976 crore，隐含抽佣率约 31.6%，相比传统
              B2B 市场常规水平偏高，IPO 时会受到投资人审查。如果该比率包含 JOFL 获取利息 收入的融资交易，任何信贷利差或合作伙伴条款收紧都会压缩混合数字。第三是 IPO 所需资本充足度：公司 此前在 2024 年
              5 月以 $1 billion 估值融资，并在 2025 年完成 Rs 575 crore 轮但未披露新估值，造成 定价不透明。计划中的 $350–400 million IPO 和 Rs 650–700
              crore pre-IPO 融资，会带来显著额外稀释， 需要干净的经审计财务以及解决前文关联方会计问题。TheCompanyCheck 数据显示某可得财年的利润增长为
              −64%，这与早期扩张轨迹一致，但仍是值得监测的负面信号。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR034
              - CR039
      - number: '7.5'
        title: 运营、物流与技术风险
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 运营一个实体履约网络，由 JSW One Distribution and Logistics（JODL）管理，覆盖 印度 14 个库存点和 7 个合同制造地点。这一网络支撑
              just-in-time 钢材交付和定制钢卷加工——是真正的 运营差异化——但也制造了地理和供应链集中风险。在施工需求高峰期，如果多个库存点因天气、劳工或物流 伙伴故障中断，交付承诺会被直接削弱，并损害当前超过
              70% 的复购订单率。支付基础设施形成另一 个更尖锐的运营风险：Deutsche Bank 在自身案例研究中被识别为 eCommerce nodal account、core-banking- system
              API 集成、payment status APIs 和 collections automation 的唯一提供方。未发现任何公开披露的 备用支付伙伴或兜底结算机制。若 Deutsche Bank 印度
              NBFC 或银行业务遭遇监管行动、技术宕机或商业重谈， 所有卖方付款都可能在无明确预案下停摆。平台技术是 JavaScript-heavy 单页应用，运行在自研后端上；技术
              栈和云服务商未披露。公司未公开提交或提及独立安全认证——ISO 27001、SOC 2 或同等认证。公司登记记录的 485 名员工，需要覆盖市场、NBFC、物流、自有品牌和 homes
              等广泛职能，带来执行集中风险。平台 GMV / 员工 较高，说明运营杠杆存在，但也意味着冗余有限。在竞争激烈的 B2B tech 和 fintech 市场中，人才流失是持续 执行的非小风险。
