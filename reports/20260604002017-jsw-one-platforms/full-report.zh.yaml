          tone: positive
        - id: procurement
          label: 自营采购
          detail: JSW One 从 JSW Steel 和第三方钢厂批量采购；公开资料没有披露标价或买方利润率。
          tone: neutral
        - id: gmv
          label: GMV — ₹12,567 cr（FY25）
          detail: 材料销售全额交易价值；FY25 同比增长 240%；2025 年 6 月约 ₹1,400 cr/月。
