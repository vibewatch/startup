      - number: '7.8'
        title: 展示
        blocks:
          - type: callout
            title: 最高优先级尽调：Deutsche Bank 单一支付基础设施集中
            body: >-
              Deutsche Bank 支付基础设施依赖，是本章严重性最高的单一运营风险。平台没有公开披露备用支付伙伴、没有 说明 nodal account SLA，也没有兜底结算机制。如果 Deutsche Bank
              因监管行动、商业重谈或技术故障被迫 退出，整个市场的卖方付款都会停摆，并立即冲击 GMV 和信任。投资人应把解决这一单一供应商集中作为投资前 必做尽调项。
            calloutType: risk
            claimRefs:
              - CR019
              - CR022
          - type: callout
            title: 治理风险：关联方三角可能阻断 IPO
            body: >-
              关联方三角——JSW Steel 既是股权投资人、主要钢材供应商，又是董事长所在集团——是本章最复杂的结构性治理 风险，并且可能在 IPO 时打破投资逻辑。SEBI 的 DRHP
              审查将要求完整关联方交易表；如果发现钢材采购相对 公平交易原则存在重大错误定价，就会产生重述风险，IPO 时间表可能延长 12–18 个月。没有独立 RPT 定价 验证前，投资人不应把当前估值视为稳定。
            calloutType: risk
            claimRefs:
              - CR007
              - CR009
              - CR033
          - type: callout
            title: 投资逻辑破裂监测：三个二元触发器
            body: >-
              投资逻辑破裂监测应跟踪三个二元触发器：(1) SEBI 对 DRHP 发出 observation letter（意见函），要求 RPT 重述——在 解决前视为暂停信号；(2) Deutsche Bank
              退出，或发生超过 48 小时的宕机且没有确认备用伙伴——视为硬退出 信号；(3) JOFL 收到关于 NBFC 运营的不利 RBI 通信或指令性行动——视为信贷飞轮受损信号，需要修正估值。
              三者均可通过公开监管公告监测，不需要私有信息。
            calloutType: recommendation
            claimRefs:
