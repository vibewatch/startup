  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础细分
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 主要服务两类 MSME 买方：制造业和建筑业。根据 Livemint 2025 年 10 月援引 CEO Gaurav Sachdeva 的报道，82% 注册买家是制造业
              MSME（加工商、汽车零部件企业、工程制品生产商）， 18% 是建筑业 MSME（分包商、小型基础设施公司）。平台有意瞄准年营业额 ₹25 crore 至 ₹2,500 crore
              的企业——这是一个“失落的中间层”：规模大到不适合纯非正规采购，又小到没有专门供应链团队， 也难以与钢厂直接议价。制造业购买以钢材产品（热轧卷、型钢、TMT 钢筋）为主；建筑 业则以 TMT
              和水泥为核心品类。JSW One MSME 在 jswonemsme.com/product-list 可见的产品目录列出 低碳钢、结构钢、TMT、水泥和涂料，确认其多品类定位。另有一个 B2C 客群通过 JSW
              One Homes 覆盖，服务印度南部和中部寻求交钥匙式建造服务的个人建房者。

              多个来源记录的买方痛点包括：线下价格不透明且缺少标准基准、产品质量波动且没有牌号认证、供应商发现 碎片化导致依赖本地经销商、小型加工商可获得的营运资金信贷有限，以及物流整合不足造成交付延迟。JSW One
              用数字目录、每次交付的 mill test certificate（钢厂测试证书）、多品牌 SKU 比价、基于现金流的 NBFC 信贷，以及 自有分销子公司 JODL 来解决这些问题。Deutsche Bank
              案例研究确认，平台利用交易数据做“基于现金流的承保”，为买方匹配信贷——这明确承认平台通过把信贷准入和采购摩擦一起解决来增强 粘性。
