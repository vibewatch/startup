      - number: '5.3'
        title: 物流、分销与自有品牌
        blocks:
          - type: paragraph
            body: >-
              JSW One Distribution Limited（JODL）是 JOPL 的 100% 子公司，负责实体供应链：采购、仓储、材料加工 （钢卷切割和定尺）以及自有品牌产品的合同制造。截至 2025 年 10
              月，JODL 在印度运营 14 个库存点和 约 7 个合同制造地点。Mint 将其物流模型描述为“轻资产”，专注钢卷分销；HBL FY25 回顾称，其 通过全国服务中心扩张准时制交付网络。2025 年 10 月
              ₹575 crore 轮融资明确包括在主要工业集群 扩张分销和物流网络。


              自有品牌加深纵向整合。JSW One TMT 于 2023 年 12 月推出，最初瞄准印度北部和中部，并同时通过线上 和线下渠道销售。jsw.in 平台页还列出 JSW One Concrete
              作为开发中的第二个自有品牌，目标是“弥合建筑材料 质量缺口”，但 Concrete 品牌尚未披露上市日期或销量。One Helix Pipes & Tubes 出现在 jswonemsme.com
              导航中，作为一个子品牌；其性质和生产规模在已审阅的任何外部来源中均未 记录。JODL 子公司的财务报表在 MCA 单独备案；Tracxn 报告 JODL FY25 收入为 $459 million（约
              ₹3,820 crore），说明分销收入与市场 GMV 大致同步。具体仓储 SLA、库存点位置和钢卷加工能力均未公开披露。
