      - number: '3.2'
        title: 直接同业画像——OfBusiness、Infra.Market、Zetwerk 与 Moglix
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 是最直接、也最强的同业。公司成立于 2015 年，按 Tracxn 数据已融资至 Series G，累计融资 $776M、估值 $5B，同时扮演聚合商、制造商（30-plus
              个世界级加工厂）、进口 / 出口商和 SaaS / AI 供应商。FY24 经营收入 Rs 19,296 crore（YoY 增长 26%）和净利润 Rs 603 crore 说明，B2B
              采购平台在印度做到规模后可以盈利——这是 JSW One 尚未证明的模型。独立的 Oxyzo Financial Services 放贷子公司报告 FY26 净利润 Rs 375 crore、收入增长
              23%，并通过收购债券分销平台 GoldenPi Tech 继续扩张。OfBusiness 拥有 2 million-plus 家 SME，覆盖钢铁、铝、农业、石油、能源、聚合物和化学品，商品谱系远宽于 JSW
              One 聚焦的建筑与制造业钢铁、水泥和涂料。公司已走向 IPO，目标融资 $750M–$1B；联合创始人 Nitin Jain 2025 年 12 月离职，是公开可见的一项治理摩擦，但尚未打乱上市时间线。

              Infra.Market 成立于 2016 年（Thane），已融资 $804M，估值 ₹24,700 crore（~$2.8B）。它通过多渠道模式覆盖完整建筑项目生命周期，横跨 B2B 直销（承包商、开发商）和
              B2R（17,256 个零售触点、经销商、次级经销商）。283-plus 个制造设施（其中 163 个自有）给了它与 JSW One 母公司供应优势类似的实体护城河，但这是独立建设出来的，而不是继承来的。FY25
              收入 YoY 增长 27% 至 Rs 18,472 crore，不过利润下降 42%，反映融资和员工成本上升。Infra.Market 已秘密提交 Rs 5,000 crore IPO
              文件，但带有信用风险旗标：India Ratings 2025 年 6 月因债务再融资担忧和负现金流下调评级；公司 2026 年 2 月在 IPO 前举债 Rs 1,250
              crore，用于再融资既有借款。品牌矩阵（Shalimar Paints、RDC、Inicio、Amstrad、Robo 等）带来定价权和客户忠诚度，单纯交易型市场很难复制。

              Zetwerk 是全球制造平台，而不是采购市场。它服务 20-plus 个国家的 1,800-plus 活跃客户，已制造 9 million-plus 个零件，并针对资本品、消费品和精密零件宣传最高 50%
              的交期缩短。其模型是制造即服务（manufacturing-as-a-service），不是材料分销，因此与 JSW One 的 MSME 采购市场直接重叠有限。Zetwerk 客户基数偏向全球 OEM
              和中大型工业企业（Hitachi 是被引用的客户案例），而非 Rs 25 crore–Rs 2,500 crore 的印度建筑 MSME。重叠之处在于 JSW One 可触达市场中的制造业板块；Zetwerk
              的全球寻源网络会与 JSW One 争夺需要定制或精密部件、而非大宗钢材的高成熟度制造客户。

              Moglix 由 Rahul Garg 于 2015 年创立，聚焦印度制造业的 MRO（维护、维修、运营）和工业用品，2022 年初融资 $250M 后估值达到 $2.6B。其金融科技子公司 Credlix 在
              RBI 批准后，于 2025 年 12 月收购 NBFC Vanik Finance 三分之二股权（Rs 80 crore），以类似 JSW One 推出 JOFL 的方式正式建立放贷存在。Moglix 还通过
              2024 年 11 月以 Rs 80 crore 收购纸品制造商 Khatema Fibres 扩大制造足迹，并于 2025 年 7 月启用沥青设施。Amit Kumar 于 2026 年 5 月被任命为 MD
              and Chief Business Officer，显示公司在自身 IPO 准备前加强领导层推动。Moglix 与 JSW One 的核心重叠窄于 OfBusiness：它广义上竞争制造业采购，但 MRO
              和工业用品品类不同于 JSW One 的建筑材料和钢铁重点。
