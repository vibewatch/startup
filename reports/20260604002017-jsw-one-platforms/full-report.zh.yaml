      - number: '1.2'
        title: 领导团队、创始赞助方与治理透明度
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 由 Parth Jindal 发起并担任董事长。Parth Jindal 是 JSW Group 董事，也是 JSW Group 董事长 Sajjan Jindal
              之子。多个来源都把借助 JSW Group 在钢铁、水泥、涂料上的制造和分销能力、打造技术驱动 B2B 市场的愿景归功于 Parth Jindal。Fortune India 的 2025 年 40 Under
              40 榜单将他列为 JSW Cement 和 JSW Paints 的 MD，并指出他在推出 JSW One MSME 中发挥了关键作用。公司注册信息将 Ranjan Ramdas Pai 列为第二名董事。


              Gaurav Sachdeva 在 JSW Ventures 任职成功后，于 2022 年 5 月被任命为 JSW One Platforms CEO；他曾是 JSW Ventures 创始合伙人，并主导对
              Purplle、Indus OS、HealthPlix、LimeTray 等公司的风险投资。此前，他还在 Citibank、Bank of America、Infosys（负责欧洲大陆销售）和 Bennett,
              Coleman & Co. 任职，并拥有 ISB 的 MBA 学位。到 2025 年 10 月，他的头衔已扩大为联席董事总经理兼 CEO（JMD & CEO）。Economic Times、Financial
              Express、TechObserver、FMLive 等多个独立媒体均印证了 2022 年 5 月的任命日期。


              治理透明度有限。公司为私营、未上市企业；董事会委员会披露、审计委员会成员或投资者治理权文件均未公开。除 Ranjan Pai
              外，是否存在非家族董事以及其独立性，公开资料无法评估。公开披露的董事会名单只有三人（Parth Jindal、Gaurav Sachdeva、Ranjan Pai），这被标记为重大尽调缺口。
