      - number: '8.4'
        title: 乐观 / 基准 / 悲观情景与退出准备度
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设：FY26 实现盈亏平衡，Pre-IPO 轮按 ₹8,000–9,000 crore 完成交割，$350–400 million IPO 让 JSW One 以 3×–4× 前瞻收入倍数上市。若
              FY26 收入达到 ₹6,000–7,000 crore（由 50%+ GMV 增长指引和稳定抽佣率推导），3× 倍数对应市值 ₹18,000–21,000 crore（$2.1–2.5
              billion），相对当前 $1 billion 估值带来 2×–2.5× 回报。这个情景需要建筑行业从 2025 年放缓中恢复，钢价企稳，NBFC 子公司贡献有意义的手续费收入。

              基准情景下，公司在 FY26 控制亏损，$1 billion 估值基本持平；Pre-IPO 轮以小幅溢价定价，IPO 上市估值约 $1.2–1.5 billion。按当前估值进入的新投资者回报有限——持有 24
              个月大约 20%–50%。这一情景要求盈亏平衡推迟到 FY27，但经审计 FY25 数据仍能支撑增长叙事。

              悲观情景假设：Pre-IPO 轮难以按当前估值找到需求，FY25 亏损扩大到 ₹300 crore 以上，IPO 延期或缩小规模。在这种情况下，随着增长降速、资本市场对亏损型 B2B 平台降温，私募估值可能压缩到
              $600–750 million。关联方折价和治理担忧会放大压缩。

              退出准备仍在推进中。CEO Sachdeva 确认，公司从 FY27 起主动接洽投行。JSW Group 已证明有 IPO 执行能力（JSW Infrastructure 2023 年上市，JSW Cement
              2025 年上市）。但 JSW One 仍需要经审计的 FY25 损益表、可支撑 DRHP 的治理文件，以及已经跑出来的经营杠杆，才能满足 SEBI 和机构投资者标准。可比 B2B IPO
              管线——Infra.Market 已于 2025 年 10 月提交 DRHP，OfBusiness IPO 讨论仍在进行——提供了市场时点窗口，前提是公司能补上盈利缺口。
