      - - 股权结构表与优先权
        - 完整股权结构表、优先权包袱、清算瀑布
        - 关联方主导可能压低 IPO 倍数，或引发治理担忧
        - Pre-IPO 资料室；股东协议法律尽调
    notes: 尽调清单按潜在新投资人以当前 $1B 标记进入的紧迫性排序。DRHP 提交公布后会解决其中几项。
