      - number: '3.5'
        title: 附录图表
        blocks:
          - type: callout
            title: OfBusiness 盈利的 Oxyzo 子公司和 2M+ SME 基数构成最直接竞争威胁
            body: >-
              OfBusiness 在所有可衡量公开维度上都大于 JSW One：收入（FY24 Rs 19,296 crore，对比 JSW One FY25 GMV Rs 12,567 crore）、SME 基数（2M+
              对比 86K+）、品类宽度（7 条供应链对比钢铁 / 水泥 / 涂料）和信贷成熟度（Oxyzo FY24 净利润 Rs 603 crore，对比 JOFL 早期阶段）。在同一个 IPO 窗口，若
              OfBusiness 以更高估值倍数上市，将直接压制 JSW One 的隐含定价。
            calloutType: risk
