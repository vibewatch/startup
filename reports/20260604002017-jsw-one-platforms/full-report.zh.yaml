      - number: '7.7'
        title: IPO 准备度与披露风险
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 正瞄准 $350–400 million IPO——约 Rs 3,700 crore——并据 Outlook Business 报道已与 投资银行初步接触，同时计划 Rs
              650–700 crore 的 pre-IPO 融资。SEBI DRHP 审查通常需要 30–75 天，披露 要求很广：所有关联方交易、管理层薪酬、重大诉讼、风险因素和经审计合并财务都必须纳入。若干披露义务与
              本章最重要的开放问题直接重合。第一，关联方钢材采购表将要求披露并审计 JSW Steel 定价条款；如果届时 发现非市场化定价，可能需要重述。第二，JOFL 贷款账簿——NPA
              率、拨备方法和信贷政策——会作为重要子公司 被审计并披露。第三，董事会构成必须满足 SEBI 对独立董事代表性的要求；当前公开记录中只有三名具名董事， 且董事长来自家族集团，提示可能需要结构调整。第四，未发现
              JOFL NBFC 账簿的外部信用评级；SEBI 可能要求 在招股书披露 NBFC 子公司时提供。管理层公开提出 Rs 500 crore JOFL AUM 和 FY26 末或 FY27 申报 IPO 的
              目标；任何一个未达成，都会释放执行不足信号。投资人应把 IPO 视为基于里程碑的投资逻辑破裂触发器，而 不是近乎确定的流动性事件，并把 SEBI DRHP 申报、经审计 FY26 财务和独立董事任命作为 IPO
              准备度领先指标。
            claimRefs:
