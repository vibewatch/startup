        title: 附录
        blocks:
          - type: callout
            title: JSW Group 的分销护城河耐久
            body: 14 个钢材加工中心、JSW 在钢铁和水泥上的品牌强度，以及选择做分销主体而非轻市场平台，让公司在采购经济性、物流可靠性和 MSME 信任上形成复利优势；纯数字化进入者若没有可比资本开支，难以复制。
            calloutType: strength
