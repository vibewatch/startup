  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览与严重性排序
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，公开证据支持对 JSW One Platforms 风险栈做出清晰排序。第一组、也是严重性最高的， 是关联方与治理风险：JSW Steel
              同时是公司最大股权投资人、主要钢材供应商，也是董事长所在集团。三向 关系带来利益冲突敞口；如果没有独立基准和稳健的公平交易治理，很难化解，而两者都尚未公开证明。 第二组是 NBFC 监管风险：JSW One
              Finance Limited 于 2024 年 10 月取得 RBI 注册证书，如今受 Scale Based Regulation 约束。RBI 在 2025 年初收紧 NBFC 的 NPA 拨备规范；若
              JOFL 遭遇任何不利监管行动， 将削弱支撑约三分之一平台订单的信贷飞轮。第三组是支付基础设施集中：Deutsche Bank 被识别为唯一 nodal account 和 core-banking-system
              合作伙伴。若该关系中断，整个市场的卖方付款会停摆，且没有公开 披露的备用方案。第四组是钢材周期与竞争风险：CY2024 国内 HRC 价格下跌约 20%，在固定佣金结构 下压缩 GMV；同时 133
              家活跃竞争对手——包括集团背书的 Infra.Market、OfBusiness、Tata Nexarc 和 Birla Pivot——都在争夺同一 MSME 钢材采购细分。第五组是 IPO
              准备度与披露风险：公司目标进行 $350–400 million IPO，并在上市前融资，但围绕关联方交易定价、JOFL 信贷质量和管理层接班的重大披露
              缺口，在已审阅公开来源中仍未解决。各组风险在下文展开；缓释和终止标准表汇总了监测触发器。
