        - MSME 工厂采购的钢卷、板材、钢筋和工厂投入品
        - 长周期大宗商品套保、企业 ERP 套件，以及工作流外的进口原材料贸易
        - 业主经理、工厂负责人或采购负责人；企业主体付款
        - JSW One 当前披露的最大用户群
      - - 公共采购基准
        - 部委、PSU、合作社和政府实体在 GeM 上的数字化采购
