            body: >-
              JSW Steel 同时是投资者和主要钢材供应商，意味着 JSW One 的利润率画像、营运资金条款和供给可靠性，可能都要与同一个持股交易对手谈判。若没有披露独立交易基准，投资者无法独立核验 JSW One
              披露的抽佣率或成本结构。
            calloutType: risk
