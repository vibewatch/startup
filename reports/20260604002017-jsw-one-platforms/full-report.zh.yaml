      - number: '6.3'
        title: 具名客户与合作伙伴证明
        blocks:
          - type: paragraph
            body: >-
              三个具名方为 JSW One 的平台质量和客户结果提供了可验证证明。Deutsche Bank 通过其发布的 "Flow" 案例研究，详细说明共同开发的支付和收款基础设施：专用 nodal account、端到端
              LMS–CBS API 集成和实时 Payment Status Check APIs。Deutsche Bank 授予 JSW One“印度最佳支付与收款解决方案”奖项，COO Mayank Gupta
              的引述也确认，基于现金流的承保通过合作 NBFC 交付。这段合作验证了 平台面向机构买方的可靠性，但不能证明 B2B MSME 采购结果。

              B2C 业务方面，JSW One Homes 发布了来自 Visakhapatnam 的 Mr. Praveen Kumar 的推荐语，描述建房体验 和可验证结果（项目周期、材料质量）。JSW One Homes
              关于我们页面披露，截至 2025 年中，平台 NPS 为 +81、已交付 180+ 套住宅、在 17 个地理区域有 227+ 套在建；对建筑服务而言，这是强客户满意度指标， 但 NPS 调查方法缺少独立验证。

              State Bank of India 领投 ₹575 crore Series C 轮（2025 年 4 月），并通过 JSW One Finance Limited
              担任共贷合作伙伴，为平台信贷基础设施提供机构背书。媒体报道中没有公开具名的 B2B MSME 制造或建筑 买方；所有 MSME 客户数和 GMV 指标均由公司通过新闻稿自报，或由记者直接引用管理层表述——这是
              pre-IPO 审查中的重大尽调缺口。
