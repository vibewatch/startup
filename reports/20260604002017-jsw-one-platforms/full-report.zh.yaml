      - number: '4.4'
        title: 母公司财务能力与集团托底
        blocks:
          - type: paragraph
            body: >-
              JSW Steel Limited 是 JSW One Platforms 的单一最大投资方，也是集团锚定实体。2026 年 6 月 3 日，公司市值约 ₹321,064 crore，过去 12 个月市盈率
              14.36x，市净率 3.79x。这样的体量给 JSW One 提供了可信的财务托底：即便只在 JSW Steel 层面小幅调配留存收益，或动用资本市场融资， 也足以承接 JSW One 后续轮次或 IPO
              延期，不会明显挤压母公司。JSW Group 在 JSW One 创立时正式 承诺，到 FY27 最多投入 ₹4,000 crore。到 2025 年 10 月累计完成的 ₹1,120 crore 股权融资约占该
              承诺的 28%，仍留出充足空间，可用于 pre-IPO 过桥资金或吸收上市推迟。国有 SBI 参与 2025 年 10 月扩展轮，且估值与 Series B 相同、均为 ₹8,575
              crore，这是有分量的机构信号：一家大型公营银行 与私募股权和战略投资人共同投资，验证了一家受监管贷款实体的信用与商业逻辑。核心风险在于，JSW Steel 作为 JSW One 投资人的股东利益，可能与
              JSW One 长期追求多供应商中立的目标冲突。如果 JSW One 的采购逐步集中到 JSW Steel 货量，平台面向竞争对手采购的可信度会被削弱，对买家的价值和长期 IPO 吸引力都会下降。JSW
              Steel 在 NSE 上市，为投资人提供了连续流动性和按市值计价的代理指标，可 用来监测 JSW One pre-IPO 轨迹背后的托底健康度。
