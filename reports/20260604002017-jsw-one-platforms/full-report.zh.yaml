      - number: '7.2'
        title: 关联方与治理风险
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 最复杂的结构性风险，是平台、JSW Steel 和更广泛 JSW Group 之间的关联方关系网。 JSW Steel 持有平台股权，同时又是其主导钢材供应商——钢材是这个
              FY25 产生 Rs 12,567 crore GMV 的 市场的核心投入。JSW Group 创始人 Sajjan Jindal 之子 Parth Jindal 担任公司董事长。这一结构产生三条
              明确冲突线。第一，钢材采购定价：如果 JOPL 以高于市场的价格从 JSW Steel 购钢，实际补贴就会流向母 公司，代价是平台盈利能力。公司没有发布独立公平交易定价验证。第二，资本配置：JSW Steel
              参与 了 2024 年 5 月（Rs 340 crore）和 2025 年 4–5 月（Rs 575 crore）两轮融资，意味着关联方在给自己的
              关联企业定价。第三，治理：公开可识别董事仅三名，且董事长来自创始家族，外部投资人难以评估独立监督 质量。Manipal Group 的 Ranjan Pai 也被列为董事；公开来源未单独说明他相对于 JSW
              Group 的独立性。 IPO 时 SEBI 的 DRHP 审查几乎肯定会要求完整的关联方交易披露表；若届时发现任何错误定价交易，可能要求
              重述或估值调整。公开记录中没有关于关联方采购条款的独立审计报告，是本章最可行动的尽调缺口。
