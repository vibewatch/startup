          - type: callout
            title: 绝对亏损扩大，且没有 FY25 经审计确认
            body: >-
              FY24 净亏损 ₹277 crore，是 FY23 ₹83.8 crore 亏损的 3.3x；同期收入增长 4.2x。FY26 盈亏平衡目标 要求这条趋势彻底反转，但目前没有公开的 FY25
              经审计数据确认轨迹。任何 pre-IPO 投资决策前，这是 优先级最高的财务尽调阻断项。
            calloutType: risk
            claimRefs:
              - CI019
              - CI020
              - CI022
              - CI023
              - CI024
          - type: callout
            title: JSW Steel 在多供应商中立上的利益冲突
            body: >-
              JSW Steel 持有 JSW One 股权，结构上有动力把 JSW Steel 货量导入平台，即使代价是削弱买方价格竞争力。 如果 JSW One 依赖 JSW Steel 的优惠供货价维持利润率，IPO
              后任何价格正常化都可能同时压缩收入质量和 估值倍数。
