      - number: '6.2'
        title: 采用率与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              JSW One 注册 MSME 数量从 FY23 约 15,000 增至 FY25 末 84,000+，两年扩大 5.6×。Q1 FY25 GMV 为 ₹2,549 crore，而 Q1 FY24 为 ₹610
              crore（同比 4.2×），说明注册买家人均收入在加速，而不只是用户数 增长。FY25 全年 GMV ₹12,567 crore，对比 FY24 约 ₹5,200 crore（由 Q1 比率推算），年增幅达到
              +2.4×。平台 FY25 促成约 2 million 吨钢材，约合每吨 ₹6,300，与印度中档钢材市场价格相符。截至 2025 年 10 月，月度信贷发放额为 ₹475–500 crore，年化约
              ₹5,700 crore，较 FY25 总额 ₹3,800 crore 近乎提升 50%。

              相比 500,000 家 MSME 的既定目标，84,000 注册用户仅代表 16.8% 渗透率；如果公司能在全国复制 Maharashtra / South India 模板，仍有 6× 空间。到 2024
              年，印度 Udyam 门户已注册超过 4.8 crore （48 million）家 MSME；按与钢材和建筑相关、且营业额在 ₹25 crore+ 的范围过滤后，可服务宇宙会缩小， 但相对于总注册数，JSW
              One 的 500,000-MSME 目标显得保守。H1 FY26 >₹8,000 crore GMV 目标意味着到 2025 年 9 月需完成 FY25 全年运行率约 63%；如果 3–6 月季度能延续
              2025 年 10 月信贷速率，这个 目标与 Q1 FY26 动能一致。
