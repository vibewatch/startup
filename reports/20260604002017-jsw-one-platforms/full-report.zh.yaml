        - from: D4
          to: D6
          label: 受 RBI 监管
        - from: D1
          to: D7
          label: SEBI 对 IPO 的监管
        - from: D1
          to: D8
          label: 控制 JODL 履约
        - from: D8
          to: D9
          label: 指导合同制造
        - from: D8
          to: D10
          label: 向 MSME 买方交付
        - from: D11
          to: D1
          label: 在市场平台上架产品
        - from: D5
          to: D10
          label: 信贷撬动 MSME 订单
    claimRefs:
