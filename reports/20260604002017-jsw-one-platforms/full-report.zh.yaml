      - number: '5.5'
        title: 技术架构、差异化与竞争语境
        blocks:
          - type: paragraph
            body: >-
              JSW One CEO 将平台战略基础称为“集成式技术金融栈”，把供应、信贷和数字智能组合在一起。 COO Gupta 确认平台架构按可扩展性设计，称其在当前聚焦国内市场的同时，“愿意评估国际机会”。2025 年
              10 月 ₹575 crore 融资明确用于分销和 NBFC 扩张，并同步“加快投入自有技术平台”。在可获得的披露中，Deutsche Bank 案例研究给出了最详细的技术信息，已确认架构组件包括：(a) 自研
              Loan Management System（LMS），(b) 通过 API 接入 Deutsche Bank CBS 做 STP 支付，(c) 用于实时资金可见性的 Payment Status Check
              APIs 和 Collections APIs，以及 (d) 还款后的自动总账同步。后端云基础设施、工程团队规模、CI/CD 实践和 第三方软件栈，任何公开来源均未披露。


              JSW One Platforms 没有公开 GitHub 仓库、开放 API、开发者门户或可公开访问的技术文档。公司也没有 可衡量的开发者社区信号（没有 GitHub stars、npm packages
              或开源贡献）；最接近的代理信号是 Deutsche Bank 集成伙伴案例研究，以及公司在 jswonemsme.com/blogs 上偏技术的博客内容。与同业相比，Birla Pivot（Aditya
              Birla Group）披露了自研 LLM 驱动引擎，用于处理非结构化输入（PDF、WhatsApp、 手写内容），并披露了智能 Transport Management
              System（TMS，运输管理系统）；JSW One 尚未披露可比的 AI/ML 层细节。 Tata DigECA 在 FY26 扁钢业务中达到 ₹1,000 crore GMV、3,500+ MSME
              客户，远低于 JSW One ₹12,567 crore GMV 和 84,000+ MSME 基数；但 DigECA 背靠 Tata Steel，在钢材纵线中可能具备资本效率。 Tata Nexarc
              提供多语言（英语 / 印地语）界面和 Early Pay 供应链金融；按导航看，JSW One 网站仅有 英语，可能限制其在印地语带 MSME 市场的渗透。
