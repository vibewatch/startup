      - number: '1.3'
        title: 融资历史、投资者基础与估值冲突
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 已完成三轮公开宣布的股权融资，总额约 ₹1,120 crore。第一轮机构融资发生在 2023 年 4 月，Mitsui & Co.（Japan）以 ₹2,750 crore
              估值在 Series A 投入 ₹205 crore（约 $330 million）；Economic Times、Inc42 和 Business Standard 均确认了该轮融资。JSW Group
              另承诺到 FY27 前向平台最多投入 ₹4,000 crore。


              2025 年 5 月，Principal Asset Management 领投 ₹340 crore 轮融资，OneUp 和 JSW Steel 跟投，将公司估值推至 $1
              billion，并使其获得独角兽身份——较 2023 年融资估值跳升超过三倍。ET BFSI、Financial Express 以及 JSW Group 自身新闻稿均对此作出印证。同一轮在 2025 年 10
              月完成延展，来自 SBI、Principal Asset Management、OneUp、International Conveyors Ltd、Scarlett Ventures 和 JSW Steel
              的总额达到 ₹575 crore。Mint 报道称，10 月交割未公开披露估值；Economic Times 则引用了约 ₹8,575 crore 的隐含估值——这一披露缺口被标记为重大问题。


              值得注意的是，跟踪数据库存在冲突：Tracxn 记录 JSW One 的投后估值为 $925 million（低于公开宣布的 $1 billion），同时把更早的创立年份记为 2020 年。这一 $75
              million 缺口可能来自完全稀释估值与新闻稿估值口径不同，也可能是滞后数据点；公开资料尚未调和。报道 2023 年 Mitsui 轮的 VCCircle 文章现在返回
              404，记录中少了一个独立佐证来源。NBFC 子公司（JSW One Finance）截至 2025 年 10 月 AUM 约 ₹100 crore，明显低于 ₹500 crore 的年末目标；2025 年 10
              月轮融资资金中约一半指定用于 JOFL 资本化。
