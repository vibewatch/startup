      - number: '3.4'
        title: 护城河、切换成本与可能战线
        blocks:
          - type: paragraph
            body: >-
              JSW One 最可防守的护城河，不是它自己建出来的，而是 JSW Group 作为印度最大钢铁和水泥生产商之一的地位。Deutsche Bank 案例研究引用 CEO Gaurav Sachdeva 的说法，称
              JSW One 借助「JSW Group 在钢铁和水泥上的制造与供应优势」来交付独立平台无法获得的供应确定性和成本优势。这种母公司支持的供应可靠性是真正差异点——OfBusiness 和 Moglix
              必须靠采购体量和制造投资逼近，Infra.Market 则靠自有制造设施来建立。只有 Birla Pivot 和 Tata nexarc 具备可比的集团供应优势，但商品结构不同。

              一体化信贷护城河真实存在，但仍不成熟。JSW One Finance Limited（JOFL）到 2024 年 8 月才推出，比 OfBusiness 的 Oxyzo 晚约九年，也比 Moglix 的
              Credlix 晚数年。Oxyzo 已盈利（FY26 净利润 Rs 375 crore），并在资本市场扩张；Credlix 通过收购 Vanik 正式取得 NBFC 地位。JOFL 尚无公开 AUM 或 NPA
              数据。这是最高风险缺口：信贷是 B2B 采购中最主要的利润扩张和留存杠杆，而 JSW One 在成熟度曲线上落后于两大直接同业。JSW One About 页面把 JSW One MSME
              描述为「稳定、灵活、可信赖的钢铁解决方案合作伙伴」，强调可靠性，而不是把信贷放在首位。

              JSW One 当前买家的切换成本为中等。已经接入 JSW One 数字下单、付款跟踪和信贷工作流的 MSME，会面对有意义的迁移摩擦；如果 JOFL 联合贷款关系嵌入其营运资金结构，摩擦更大。不过，平台
              86,000-plus 注册 MSME 基数（对比 OfBusiness 的 2 million-plus SME）意味着网络效应锁定尚不显著。自有品牌买家（JSW One TMT、JSW One
              Concrete）的切换成本最高，因为品牌产品关系形成了单独的忠诚循环。

              对于用 JSW One 买钢铁、用 OfBusiness 买其他原材料的 MSME 来说，多平台使用现在很容易。JSW One 的品类宽度（钢铁、水泥、涂料）窄于 OfBusiness
              的七条以上供应链，因此采购多种大宗商品的买家很可能已经在多平台使用。战线因此落在品类扩张上：如果 JSW One 扩到铝、聚合物、化学品或农业采购（如 OfBusiness 所做），多平台使用会减少；如果 JSW
              One 继续停留在钢铁和建筑垂直，买家会继续用 OfBusiness 满足其他需求。

              IPO 队列动态增加了紧迫感。四家主要同业都在准备或探索 IPO。IPO 前阶段通常会推高激进的 GMV 增长、获客支出和平台深耕，任何一项都可能重塑市场份额。JSW One 计划在 IPO 前融资 Rs
              650-700 crore，并进行 $350–$400 million IPO，说明它处在类似时间线上；但进入这场竞赛时，它在独角兽队列中的绝对 GMV 基数最小。FY26
              年底达到经营性盈亏平衡，是关键内部闸门：一旦滑坡，对照已证明盈利的同业，IPO 估值故事会更难讲。
