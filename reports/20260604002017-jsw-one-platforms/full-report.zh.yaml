      - number: '1.4'
        title: 规模、运营指标与产品栈
        blocks:
          - type: paragraph
            body: >-
              从公司披露的运营指标看，FY25 是平台突破之年。JSW One 录得 ₹12,567 crore GMV，同比约 2.4x 增长，并按公司自身说法成为印度最大的钢铁销售平台。平台促成约 2 million
              tonnes 钢材采购，并报告 FY25 收入 ₹3,976 crore。Hindu Business Line 和 ET Manufacturing 在 2025 年 5 月分别发文独立确认了 ₹12,567
              crore GMV 数字，使这一指标具备中高置信度；不过，FY25 经审计财务报表尚未公开发布。


              截至 FY25，注册 MSME 用户基数达到 84,000 多家，高于 FY25 Q1 语境中报道的约 58,000 家。公司沟通和 2025 年 5 月独角兽轮新闻稿提到 500,000 多家建筑和制造业
              MSME 的目标 / 可触达基数；这些是愿景型目标，不是当前活跃客户。把两组数字混为一谈会高估触达范围。Deutsche Bank 案例研究引用超过 86,000 家 MSME，与 FY25 的 84,000+
              数字一致（差异大概率来自统计时点）。


              平台订单中超过三分之一使用嵌入式信贷；合作银行和 NBFC（ICICI Bank、IndusInd Bank、Yes Bank、Axis Bank、Standard Chartered
              Bank、TCL、Kotak Mahindra Bank、IDBI Bank、Mizuho）加上内部 JSW One Finance，每月发放约 ₹475–500 crore、期限 60-90
              天的库存贷款。FY25 通过平台发放的信贷总额达到 ₹3,800 crore。电商业务约 82% 来自制造业、18% 来自建筑业。Mint 确认 H1 FY26 的 GMV 目标为 ₹8,000-plus
              crore（较上年增长 50%）。Financial Express（引用 Tracxn 数据）报道 FY24 收入为 ₹1,421.9 crore、净亏损为 ₹227 crore；相比 FY20 ₹1.3
              crore 利润，亏损轨迹扩大，既反映激进再投资，也抛出走向盈亏平衡的问题。
