      - number: '2.5'
        title: 矛盾、注意事项与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >
              本章最大未解问题不是市场是否够大，而是 JSW One 能以经济方式赢下这个大市场中的哪一块。公开建筑市场估计高度受边界影响，从狭义 >US$200 billion 的 B2B 商贸切片，到广义
              US$1.4-1.42 trillion 的建筑大盘都有。因此，这些数字应作为上下限，而不是混合成一个伪精确 TAM。同样，GeM
              上公共采购的成功有参考价值，但不能误当成私营建筑材料买家会以相同速度、相同抽佣经济性数字化的直接证明。


              两个尽调问题尤其关键。第一，公开记录仍没有提供一个干净的私营市场 SAM：它需要排除政府采购、出口发现和跨品类支出，同时以足够颗粒度隔离钢铁和建筑材料，好与 JSW One 的 GMV
              对比。第二，当前公开证据没有清楚披露公司按承包商、制造商、经销商和预算负责人角色划分的买方组合，也没有披露印度钢铁需求按行业拆分的最新官方终端用途结构。这些缺口并不推翻市场论点；它们只是说明，承销判断应依靠区间化的
              TAM/SAM 视角和来自带融资重复采购的队列证据，而不是一个过大的头条市场数字。
