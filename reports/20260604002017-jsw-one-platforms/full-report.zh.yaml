      - number: '6.4'
        title: 留存、复购与满意度
        blocks:
          - type: paragraph
            body: >-
              公开来源中最清晰的留存信号，是 Moneycontrol 报道的 70%+ 复购订单占比（当时注册用户基数约 58,000，可能为 FY25 早期），并由 Deutsche Bank
              案例研究中强调的“高复购销售”相互印证。 该指标是订单层面的——意味着 70%+ 交易量来自此前下过单的买家——而非按 cohort 跟踪 FY23 客群在 FY25 是否仍活跃的留存率。B2B 市场没有公开披露
              GRR、NRR 或 churn rate；对 pre-IPO 私营公司而言可以预期， 但限制了对持久性的严谨评估。

              信贷渗透是重要留存驱动：约 33% 订单使用 JSW One 促成的信贷产品（以库存为支撑的 60–90 天贷款）。 使用信贷的买家可能更粘，因为切换平台需要在新贷款人处重新建立信用资质。截至 2025 年 10
              月，月度 信贷发放 ₹475–500 crore，对客户群形成显著且增长中的金融绑定。JSW One Homes 的 NPS +81 是强满意度 指标，高于建筑行业平均水平；180+ 套已交付和 227+
              套在建，则为持续参与提供支撑证据。

              缺少公开 cohort 数据（例如 FY23 注册用户中有多少比例在 FY25 下单）仍是关键尽调缺口。70%+ 复购指标 在信贷产品放量前就已被引用；FY24 之后的信贷扩张究竟提高还是降低了复购率，仍未解决。
