      - number: '1.5'
        title: 里程碑记录、反向信号与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              按日期排列的公开记录支撑了一个清晰的公司里程碑弧线：2018 年法律注册成立、2021 年软启动、2023 年 4 月首轮机构投资（Mitsui）、2025 年 5 月成为独角兽、2025 年 10 月完成
              SBI 支持的延展轮。Deutsche Bank 支付基础设施合作获得 The Asset 奖项，是公开记录中最强的一项独立验证商业合作。


              主要反向财务信号是净亏损扩大——从 FY20 ₹1.3 crore 利润转为 FY24 ₹227 crore 亏损——尽管同期 GMV 复合年增长率超过 290%。公司目标是在 FY27（ET Mitsui
              2023）或 FY27-28（Deutsche Bank / Mint 2025）实现盈利，时间线上存在小冲突；无论哪种说法，跑道都取决于 GMV 持续高增长和 NBFC 扩张。Tracxn 的 $925
              million 估值与公开 $1 billion 公告之间的冲突，以及 2025 年 10 月轮融资估值未披露，构成潜在投资者面前的治理透明度缺口。


              IPO 准备已公开表态：Sachdeva 确认「公司打算在 18 到 24 个月内上市」（语境约为 2025 年 10 月），Mint 则报道目标为 FY28。截至 2026 年 6 月运行日期，公司尚未公开提交
              DRHP（Draft Red Herring Prospectus）或 S-1 等同文件；这与既定时间线一致，但也意味着 IPO 指标（订单簿、发行价区间）仍不可得。公司的 NBFC（JSW One
              Finance）于 2024 年 8 月推出，必须应对 RBI 监管要求；记录中没有反向监管发现，但未发布 NBFC 合规披露仍是一个小缺口。
