  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 数字市场架构与产品目录
        blocks:
          - type: paragraph
            body: >-
              JSW One 的核心产品是 jswonemsme.com，这是一个服务制造业和建筑业 MSME 的 B2B 电商平台，目标客户 年营业额在 ₹25 crore 至 ₹2,500 crore
              之间。目录覆盖低碳钢、结构钢、热机械处理（TMT）钢筋和水泥； 站点导航中可见的 SKU 示例包括 "TMT Fe500D"、 "JSW Steel HR Coil E250A" 和 "Cement OPC
              43/53"，证明搜索功能存在。平台层面的多品牌理念意味着 MSME 可以从 JSW Steel 以及 Tata Steel、ArcelorMittal Nippon Steel 等竞争品牌采购。COO
              Mayank Gupta 将其称为“战略性且刻意的选择”，目的是提供“选择、透明和可靠性”。导航还显示两个自有品牌子品牌： JSW One TMT 和 One Helix Pipes & Tubes。


              相比传统采购，这个市场提供了几项产品技术差异化：每次钢材交付都附带 mill test certificate（钢厂测试证书），记录 单件材料的物理和化学属性及公差，使 MSME 能从自身采购一路向后追溯到
              JODL 加工环节和源头钢厂。这 去掉了碎片化线下市场的黑箱——过去 MSME 往往无法确认钢材这类大宗商品的牌号或来源。平台牵引力体 现在超过 70% 的复购订单占比（Moneycontrol
              披露的信贷上线前基线）、84,000+ 注册 MSME，以及 FY25 促成 2 million 吨钢材流转。网站页脚提到移动应用（“下载我们的 App”），但应用商店页面未公开应用内
              评分和会话指标，自动抓取因此受阻。JSW One MSME 网站是 JavaScript-heavy 单页应用；单个产品类别页
              和博客文章无法通过自动抓取渲染出可读内容，限制了对目录深度和价格透明度主张的独立验证。
