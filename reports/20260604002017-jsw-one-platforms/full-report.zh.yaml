  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: >-
      关联方治理和 NBFC 监管风险落在高严重度 / 中高可能性的交叉点。支付基础设施集中是严重度最高但可能性较低的事件。考虑 2024 价格环境，钢材周期和竞争风险严重度中等、可能性较高。若 SEBI 对 RPTs
      的审查导致重述，IPO 披露风险会成为实质问题。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 严重度极高
          values:
            - label: Deutsche Bank 退出且无备份
              tone: risk
              detail: 单一供应商支付基础设施；节点账户关闭会让所有卖方结算停摆。考虑现有合作关系，概率较低，但未披露缓释方案。
            - label: RBI 对 JOFL 执法
              tone: risk
              detail: 若 NBFC 牌照被撤销，或 JOFL 遭定向监管行动，支撑 33%+ 订单的信贷飞轮会停转。钢材下行周期中 NPA 上升可能触发该风险。
            - label: SEBI 因 RPT 重述阻止 IPO
              tone: risk
              detail: 若关联方钢材采购被认定存在重大错价，SEBI 可能要求 JSW One 重述财务；这是主要上市风险情景。
        - label: 高严重度
          values:
            - label: Tata Nexarc / Birla Pivot 大规模冲击
              tone: risk
              detail: 有集团背书的竞争对手复制供应确定性，却没有 RPT 复杂度；它们搭起 NBFC 信贷能力后，概率上升。
            - label: JOFL AUM 超过 Rs 1,000 Cr — 重分类为 Middle Layer
              tone: risk
              detail: NBFC 扩张快于模型预期，会触发更严格治理和资本要求，挤压 JOFL 单位经济，并推迟下一轮融资。
            - label: 钢价下跌压缩 GMV 15–25%
              tone: risk
              detail: HRC 在 CY2024 已下跌 20%；第二轮下跌会在佣金固定时压缩 GMV，同时抬高 MSME 信贷压力。
        - label: 中等严重度
          values:
            - label: 平台工程人才流失
              tone: neutral
              detail: 自研后端技术栈未披露；相对功能范围，团队偏小。若 ESOP 有竞争力，风险可控，但信息未公开。
            - label: 关键人离职 — Gaurav Sachdeva 在 IPO 前退出
              tone: risk
              detail: 这位 CEO 自 2022 起搭建信贷、物流和市场平台战略；若在 IPO 阶段离职，会严重扰动投行关系和 DRHP 叙事。
            - label: Infra.Market IPO 争夺同一投资者群体
              tone: neutral
              detail: Infra.Market 已秘密提交 DRHP；若在同一窗口上市，投资者对第二个 B2B 建材平台 IPO 的胃口可能有限。
    claimRefs:
      - CR019
      - CR002
      - CR004
      - CR007
      - CR026
      - CR029
      - CR031
      - CR035
    approximationNotes: 可能性和严重度评估基于公开来源证据与定性推理；未套用量化概率模型。各单元格体现分析师判断，综合了截至 June 2026 审阅的监管文件、媒体报道和公司披露。
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主风险传导路径从关联方冲突或监管行动开始，经由信贷飞轮受损进入 GMV 压缩，再传到估值折价和 IPO 延迟。Deutsche Bank 单一供应商路径更急、概率更低，是一条旁路，会直接传导为交易停摆和平台信任流失。
    data:
      nodes:
        - id: R1
          label: 关联方冲突暴露（SEBI / 审计）
          detail: SEBI DRHP 审查或审计师保留意见揭示 JSW Steel 采购错价；需要重述。
          tone: risk
        - id: R2
          label: RBI 对 JOFL 采取监管行动
          detail: NPA 激增或治理违规触发 RBI 定向行动或牌照条件。
          tone: risk
        - id: R3
          label: 信贷飞轮受损
          detail: JOFL 放贷受限；合作放贷方暂停联合放贷；33%+ 订单失去 60–90 天库存融资。
          tone: risk
        - id: R4
          label: GMV 压缩
          detail: 需要信贷的订单下滑；钢价下行加剧销量损失。
          tone: risk
        - id: R5
          label: 收入和抽佣率压缩
          detail: GMV 降低拉低收入；固定运营成本挤压利润率。
          tone: risk
        - id: R6
          label: IPO 申报延迟或受阻
          detail: SEBI 重述要求、DRHP 意见函，或经审计财务未满足契约。
          tone: risk
        - id: R7
          label: 下一轮估值折价
          detail: 收入不达预期和 IPO 延迟压缩上一轮倍数；新资本以更低价格进入。
          tone: risk
        - id: R8
          label: Deutsche Bank 退出或中断
          detail: 节点账户关闭；LMS-CBS API 宕机；市场平台卖方付款停摆。
          tone: risk
        - id: R9
          label: 交易结算停摆
          detail: 平台所有交易被冻结；买卖双方无法完成订单。
          tone: risk
        - id: R10
          label: 平台信任和复购率崩塌
          detail: MSME 转向竞争对手；70%+ 复购率下滑；GMV 结构性受损。
          tone: risk
      edges:
        - from: R1
          to: R6
          label: SEBI 阻止 IPO 或附加条件
        - from: R1
          to: R7
          label: IPO 前投资者信心下降
        - from: R2
          to: R3
          label: JOFL 放贷受限
        - from: R3
          to: R4
          label: 信贷支持订单减少
        - from: R4
          to: R5
          label: GMV 降低拖累收入
        - from: R5
          to: R7
          label: 收入不达预期导致倍数压缩
        - from: R5
          to: R6
          label: 收入缺口导致 IPO 契约未满足
        - from: R8
          to: R9
          label: 支付通道宕机
        - from: R9
          to: R10
          label: MSME 卖方和买方失去信任
        - from: R10
          to: R4
          label: GMV 结构性受损
        - from: R4
          to: R7
          label: GMV 下滑带来估值压力
        - from: R6
          to: R7
          label: 上市延迟 = 估值折价
    claimRefs:
      - CR007
      - CR019
      - CR011
      - CR016
      - CR017
      - CR034
      - CR040
    approximationNotes: 传导路径由公开证据推断，聚焦平台的信贷、支付和收入模型。边的概率未量化。该传导图是定性风险框架工具。
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: JSW One Platforms 位于依赖网络中心，网络横跨单一支付基础设施供应商、关联方钢材供应商、9 家联合放贷银行、2 个监管机构和一条物流骨干。任何关键路径节点走弱，都会向平台核心功能传导。
