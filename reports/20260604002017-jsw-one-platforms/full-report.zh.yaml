      - number: '5.2'
        title: 嵌入式金融、NBFC 编排与信贷栈
        blocks:
          - type: paragraph
            body: >-
              JSW One Finance Limited（JOFL）于 2024 年 8 月成立，是 100% 控股的 NBFC，用来锚定平台信贷纵线。 信贷模型采用混合编排设计：JOPL
              作为市场，利用高频交易数据和基于现金流的承保，通过多家合作银行和 NBFC 编排信贷；JOFL 自身则是这套栈中的一个贷款人。COO Gupta 对 Deutsche Bank 描述过这套架构： “JOPL
              作为市场，通过多家合作非银金融公司和银行编排信贷，结合高频客户交易数据与基于现金流的承保， 为客户匹配合适且定制化的信贷方案。”截至 2025 年 10 月，JOFL 自有贷款账簿约为 ₹100
              crore；公司目标 是在完成 ₹575 crore 融资后，到 FY26 末增长 5× 至 ₹500 crore。


              交易层面的信贷渗透率约为 33%：超过三分之一订单使用信贷，对应 CEO Sachdeva 披露的每月发放 ₹475-500 crore、期限 60-90 天的库存融资贷款（Mint，2025 年 10
              月）。FY25 平台还通过银行和 NBFC 合作渠道累计促成 ₹3,800 crore 信贷。支付和收款基础设施与 Deutsche Bank 共同开发：JOPL 在 Deutsche Bank 维护一个电商专用
              nodal account（节点账户），并通过端到端 API 集成把 JSW One 的 Loan Management System（LMS）接入 Deutsche Bank 的 Core Banking
              System（CBS），实现实时直通式处理（STP）、还款确认后的自动总账对账，以及面向客户的 email/SMS 通知。该合作获得 The Asset
              “印度最佳支付与收款解决方案”奖。重大缺口包括：合作共贷银行和 NBFC 的身份（未 公开披露）、JOFL 的 RBI NBFC 注册号，以及 LMS 供应商 / 架构细节。
