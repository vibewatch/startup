      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              公开证据最清楚支持的分层，不是单纯按行业标签，而是按工作流。JSW One 上，制造业 MSME
              占电商活动的大多数，建筑买家是较小但仍有实质规模的群体；这说明平台往往在采购重复、规格敏感、融资受限的场景中赢单。实践中，买方可能是业主经理、厂长、采购负责人、承包商或经销商；用户可能是工厂、项目现场或分销网点；付款方通常是企业本身，并越来越多由短期库存金融支持。公开来源确认了大类画像，但没有给出按承包商、经销商和制造商划分的精确订单组合，这仍是尽调缺口。


              邻近基准集也解释了采用路径。IndiaMART 和 Amazon Business 显示，采购团队重视发现、GST 合规、审批、分析和触达。GeM 说明，政策、搜索和交易摩擦下降后，数字采购可以快速放大。ONDC
              以及 Deloitte 对 ONDC 的分析则表明，互操作性和嵌入式服务可能随时间降低获客与交易成本。具体到 JSW One，FY25
              证据显示买方旅程从询价发现和可信供应开始，随后通过信贷、物流保障和重复补货加深。这也是为什么单看注册用户数不够；真正信号是带融资的重复采购能否成为买方账户的默认动作。
