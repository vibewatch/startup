              - CR004
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑、反向逻辑与建议
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms 站在印度工业数字化浪潮与 JSW Group 在钢材、水泥供应链深关系的交汇点上，结构位置 有吸引力。投资逻辑有四根支柱。第一，FY25 GMV 同比增长 240% 至
              ₹12,567 crore，约等于印度年度钢材 供应量的 1.6%，证明公司确实打进了一个长期线下化的细分市场。第二，公司采用自营主体分销模式 ——持有库存所有权，而不是只做纯市场——带来更高收入捕获（FY25
              ₹3,976 crore，约占 GMV 的 31.6%）和更 强供应链控制，与低抽佣率同业拉开差异。第三，JSW Group 品牌、14 个钢材加工中心和 7 个合同制造
              地点构成物流护城河，纯数字新进入者难以快速复制。第四，SBI 在 2025 年 10 月以投资人身份进入，同时 验证了信贷逻辑和 NBFC 增长轨迹；JSW One Finance 目标是到 FY26 末把
              AUM 从 ₹100 crore 扩到 ₹500 crore。

              反向逻辑同样有力。随着公司扩张，净亏损从 FY23 的 ₹83.8 crore 扩大到 FY24 的 ₹277 crore；这条轨迹 意味着现金消耗将持续到 FY26 深处。$1 billion
              估值几乎完全押在未经审计的 GMV 和公司披露收入上—— 公开渠道没有 FY25 经审计 P&L。JSW Steel 同时是公司最大投资人和主要钢材供应来源，形成关联方集中，
              让独立估值和治理更复杂。不建设多卖家市场的决定，有意限制了可服务供应商多样性，IPO 时可能压缩倍数。 CEO Gaurav Sachdeva 自己承认，2025
              年中建筑业放缓、钢价承压，这削弱了需求驱动增长叙事。

              建议为 Track，并将重新进入标准绑定在：(1) FY25 经审计财务报表；(2) 已确认的 pre-IPO 轮条款和投后 估值；以及 (3) GMV 扩张时出现运营杠杆证据（毛利率扩张或亏损收窄）。
