  - id: FE001
    title: JSW One Platforms 产品和技术栈
    type: stack
    layout: wide
    summary: 六层栈从 JSW Group 制造骨干延伸到面向 MSME 的客户界面，其中 NBFC 和支付层是技术差异点。
    data:
      layers:
        - label: 第 5 层 — 客户界面
          modules:
            - jswonemsme.com（B2B 市场，SPA）：钢材、水泥、涂料采购
            - 移动 App（Android / iOS）：下单、跟踪、通知
            - jswonehomes.com（B2C）：交钥匙住宅建造，带项目看板
        - label: 第 4 层 — 支付和回款（Deutsche Bank）
          modules:
            - eCommerce 专用节点账户：消费者资金在交付前受保护
            - LMS–CBS API 集成：直通式支付处理
            - 支付状态查询 API + 回款 API：实时资金可见度
            - 自动化账本同步 + 还款确认邮件 / SMS
        - label: 第 3 层 — 信贷和 NBFC 编排
          modules:
            - JOFL（JSW One Finance Ltd）：自营放贷；NBFC 贷款账簿约 ₹100 Cr（2025 年 10 月）
            - 合作 NBFC / 银行共同放贷：FY25 撮合 ₹3,800 Cr
            - 现金流授信引擎：用高频交易数据评分
            - 贷款管理系统（LMS）：信贷发放和还款跟踪
        - label: 第 2 层 — 分销和履约（JODL）
          modules:
            - 遍布印度的 14 个库存点：钢卷即时交付
            - 约 7 个合同制造地点：自有品牌生产
            - 材料加工：钢卷切割、定尺、规格定制
        - label: 第 1 层 — 自有品牌
          modules:
            - JSW One TMT：印度北部和中部；2023 年 12 月推出
            - JSW One Concrete：jsw.in 已公告；未披露发布日期
            - One Helix Pipes & Tubes：列于 jswonemsme.com 导航；细节未披露
        - label: 第 0 层 — JSW Group 制造骨干
          modules:
            - JSW Steel：市场目录的主要钢材供给
            - JSW Cement、JSW Paints：目录中的次级品类
            - 第三方品牌：Tata Steel、ArcelorMittal Nippon Steel 等
    approximationNotes: 架构层级根据 Deutsche Bank 案例研究、官方新闻稿和 jswonemsme.com 导航推断。内部栈工具、云供应商和 SaaS 供应商未披露。
    claimRefs:
      - CE003
      - CE011
      - CE017
  - id: FE002
    title: JSW One Platforms 上的 MSME 采购工作流
    type: flow
    layout: wide
    summary: MSME 端到端采购旅程从浏览目录到交付和还款，信贷与支付层是平台差异点。
    data:
      nodes:
        - id: n1
          label: MSME 在 jswonemsme.com 注册
          detail: 提交 GST、营业额和地址信息；完成入驻 KYC
        - id: n2
          label: 浏览多品牌目录
          detail: 低碳钢、结构钢、TMT、水泥；JSW Steel 和第三方品牌；按牌号或规格搜索 SKU
        - id: n3
          label: 按定制规格下单
          detail: 指定尺寸、牌号（如 Fe500D）、数量；JODL 匹配最近库存点
        - id: n4
          label: 信贷决策
          detail: 基于交易历史做现金流授信；约 33% 订单通过 JOFL 或合作 NBFC 获得 60–90 天库存贷款
        - id: n5
          label: JODL 加工并发货
          detail: 库存点或合同制造地点按规格切割钢卷；生成钢厂测试证书
        - id: n6
          label: 随测试证书交付
          detail: 后向追溯文件展示物理 / 化学属性；MSME 可向其客户证明合规
        - id: n7
          label: Deutsche Bank 节点账户向卖方付款
          detail: 通过 LMS-CBS API 做 STP；对账自动化；通知卖方
        - id: n8
          label: 还款和账本同步
          detail: MSME 偿还 60–90 天贷款；LMS 触发自动账本更新；邮件 / SMS 确认；开启重复采购循环
    approximationNotes: 工作流综合自 Deutsche Bank 案例研究（主要技术来源）。KYC、订单路由和信贷拒绝路径的步骤级细节，公开资料没有记录。
