  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与轮次时间线
        blocks:
          - type: paragraph
            body: >-
              自 2023 年 4 月以来，JSW One Platforms 已完成三轮披露股权融资，累计融资 ₹1,120 crore。2023 年 4 月 Series A 从 Mitsui & Co. 获得 ₹205
              crore，隐含估值约 ₹2,750 crore（VCCircle 口径为 ₹2,705 crore），标志着日本 Mitsui 成为 JSW Group 的 B2B
              建筑材料数字化论点中首个主要外部机构支持者。两年后，2025 年 5 月，Principal Asset Management 领投 ₹340 crore Series B，OneUp Fintech 和 JSW
              Steel 共同投资，将估值推至约 ₹8,575 crore，并以 $1 billion 隐含价值拿到独角兽身份。五个月内，2025 年 10 月，来自 SBI（国有贷款机构）的 ₹575 crore
              Series B 延展轮，连同既有 Series B 投资者以及 ICL、Scarlett Wealth、JSW Steel，使累计融资达到 ₹1,120 crore，同时维持 ₹8,575 crore
              估值上限。JSW Steel 多轮参与值得从两方面注意：它在财务上锚定了实体信用质量；同时，如果 JSW One 未来需要证明多供应商中立，或从竞争钢厂那里竞争性采购，这会引入结构性张力。截至 2026 年 5
              月，公司据报道正在进行 IPO 前讨论，目标是在公开上市前融资 ₹650-700 crore 的过桥轮。MCA 注册信息记录授权股本为 ₹500 crore、实缴股本为 ₹294.78 crore，反映的是
              2025 年 10 月延展轮之前已完成的股份发行。₹1,120 crore 的外部股权总额仍明显低于 JSW Group 在 JSW One 创立时宣布的原始 ₹4,000 crore
              投资承诺，说明集团按里程碑逐步、校准式投入，而不是前置重仓。
