      - number: '8.5'
        title: 尽调事项、投资逻辑失效触发点与治理
        blocks:
          - type: paragraph
            body: >-
              最大的尽调缺口，是缺少经审计的 FY25 财务报表。所有 GMV 和收入数字都来自公司披露；FY24 经审计数据（收入 ₹1,421.9 crore、净亏损 ₹277
              crore）是最后一个公开确认的锚点。任何再次入场之前，投资者都应拿到完整的 FY25 经审计损益表和资产负债表，包括 JSW One Finance 的 AUM 质量和拨备水平。NBFC
              子公司正变成新风险：AUM 目前为 ₹100 crore、目标做到 ₹500 crore，一旦高度周期性的 MSME 客群信用恶化，公司可能需要新股本注入，稀释现有持有人。

              第二个关键尽调领域是关联方治理。JSW Steel 既持有股权，又是供应侧关系方；JSW Group 既是客户侧最大的单一品牌，也是投资者基础的母体。JSW One 与 JSW Steel
              在采购定价、信用条款或物流费率上的任何交易，都必须按独立交易条款复核。对于一家准备 IPO 的公司，公开领域没有披露关联方交易细节，是重大治理缺口。

              需要立即重估投资逻辑的触发点包括：FY25 经审计净亏损超过 ₹400 crore；Pre-IPO 轮失败或定价低于 ₹7,500 crore；SBI 或 JSW Steel 减持；SEBI 对 DRHP
              提出异议；或印度钢铁需求进入持续多个季度的结构性下行。监控指标包括月度 GMV 披露、NBFC AUM 增长，以及 B2B 同行 IPO 估值。最终尽调事项列在下表。
