      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              需求侧顺风可见。仅 PMAY-U 2.0 就计划在五年内向一 crore 城市贫困和中产家庭提供援助；政府资本开支和基础设施项目也继续支撑道路、铁路、物流、机场和城市建设。MSME 基数庞大，ONDC 与 GeM
              都显示印度采购工作流正在变得更数字化、更互操作、更数据驱动。在品类层面，JSW One、Tata nexarc、DigECA、Birla Pivot、IndiaMART 和 Amazon Business
              都强调类似采用杠杆：价格可见、可信供应、GST / 合规工作流支持、融资和履约可靠性。


              反向约束同样重要。6WResearch 和 Coherent 都强调原材料波动、物流瓶颈、供应商基础碎片化、技术采用慢和可持续压力等结构性约束。Birla Pivot 自己提出的 2%
              渗透率说明，私营建筑材料市场仍处早期，这同时是机会和风险。切换行为也很黏：买家可能在线上浏览，但仍通过线下经销商关系完成订单。营运资金压力仍是核心，也就是说，没有信贷的数字化解决不了买方最根本的问题。最后，如果
              JSW One 不能守住更优的品类深度、融资、可靠性和供应商侧执行组合，横向平台和开放网络模式会削弱产品层面的差异化。
