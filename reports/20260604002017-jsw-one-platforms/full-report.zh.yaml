  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与分组
        blocks:
          - type: paragraph
            body: >-
              印度面向制造业和建筑材料的 B2B 数字采购市场，已经碎片化成四个可识别的竞争组。四组都在不同程度上与 JSW One Platforms 的核心地盘重叠。

              第一组是直接的独角兽级同业：OfBusiness 和 Infra.Market。OfBusiness 自称印度最大的 B2B 原材料采购与信贷平台，服务超过 2 million 家 SME，覆盖 26 个邦和
              15-plus 个国家，横跨钢铁、铝、农业、石油、能源、聚合物和化学品等七条供应链。Infra.Market 通过 283-plus 个制造设施和品牌矩阵（Shalimar Paints、RDC、Inicio
              等）覆盖完整建筑施工生命周期。两家公司都是 Series G 企业，并已公开披露 IPO 进程。Zetwerk 和 Moglix 补齐这一同业组，但重点不同：Zetwerk
              面向全球制造和资本品（1,800-plus 活跃客户、20-plus 个国家），Moglix 则以印度制造业的 MRO 和工业采购为核心。

              第二组是集团支持的挑战者：Birla Pivot（Aditya Birla Group / Grasim Industries，2023 年推出，两年内 Rs 5,000 crore ARR）和 Tata
              nexarc（Tata Group，钢铁采购和供应链金融）。这些平台复制 JSW One 的集团护城河模式，但母公司大宗商品和行业宽度不同。

              第三组是覆盖更宽但更浅的既有数字平台：Amazon Business India（按 SKU 宽度自称最大 B2B 在线批发市场，无贸易信贷）、IndustryBuying（聚焦 MRO，15 lakh-plus
              企业客户）和 IndiaMART（线索生成市场，不做交易履约）。

              第四组是现状替代：传统碎片化分销商、钢铁服务中心、区域贸易商和 MSME 长期依赖的直接供应商关系。整个 B2B 数字队列——包括 JSW
              One——争夺的不是彼此替代这么简单，而是把这块线下基础转化上来。Outlook Business 引用的行业估计称，到 2030 年可触达的线上优先 B2B 机会约为 $200 billion。JSW One
              的 FY25 GMV 为 Rs 12,567 crore（240% YoY 增长），显示转化很快，但绝对规模仍落后于 OfBusiness（FY24 经营收入 Rs 19,296 crore）和
              Infra.Market（FY25 收入 Rs 18,472 crore）。四家头部平台都在准备或探索上市，IPO 前 规模和品牌定位竞赛正在加剧。
