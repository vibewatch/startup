      - number: '2.2'
        title: TAM/SAM/SOM 视角与边界差异
        blocks:
          - type: paragraph
            body: >
              对 JSW One 来说，给出单一 TAM 数字会误导判断，因为公开证据至少覆盖三种不同分母。第一，钢铁视角具体且当前：worldsteel 将印度 2024 年粗钢产量列为 149.4 MT、表观钢材使用量列为
              140.5 MT；National Steel Policy 则指向更大的 2030-31 目标，即 300 MT 产能和 255 MT 粗钢需求 / 产量。这个视角重要，因为钢铁仍是 JSW One
              采购栈中数据最丰富的一段。


              第二，宽口径建筑视角大得多，也松散得多。Coherent Market Insights 引用 Invest India 数据称，印度建筑业预计到 2025 年达到约 US$1.4 trillion；IBEF
              则引用到 2027 年 US$1.42 trillion 的建筑市场。第三，Birla Pivot 采用更窄但运营上更贴近的平台口径：印度 B2B 建筑商贸机会超过 US$200
              billion，数字渗透率仍只有约 2%。正确解读不是其中一个估计对、另一个错，而是它们描述了不同边界。JSW One 当前 SOM 可观察——FY25 GMV 为 ₹12,567 crore——但真实私营市场
              SAM 仍未解决，因为公开数据无法干净剔除公共采购、出口发现和非核心品类。
