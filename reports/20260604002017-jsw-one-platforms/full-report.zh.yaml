      - number: '4.5'
        title: 估值标记、IPO 路径与同业倍数
        blocks:
          - type: paragraph
            body: >-
              2025 年 5 月确定并延续至 2025 年 10 月扩展轮的 ₹8,575 crore 估值，约为 FY25 收入 ₹3,976 crore 的 2.16x。这个水平大体对齐
              OfBusiness——印度最大的 B2B 原材料平台。OfBusiness 估值约 $5 billion，对应 FY24 收入 ₹19,296 crore，隐含收入倍数 2.15x。聚焦建筑材料的竞争对手
              Infra.Market 隐含倍数更低，约 1.34x（FY25 收入 ₹18,472 crore，对应 ₹24,700 crore 估值），说明 市场相对于 Infra.Market，给 JSW One 的
              JSW Group 分销品牌和信贷基础设施赋予了小幅溢价。 IndiaMART InterMESH 是已上市的 B2B 发现型市场，但结构不同（SaaS 订阅模式，没有自营采购风险）， 不能直接类比。计划中的
              IPO 目标募集 $350-400 million 新资金，2026 年 4–5 月多篇报道确认公司 已主动接触投资银行，并讨论 ₹650-700 crore 的 pre-IPO 过桥轮。从 2025 年 6
              月起算的 18–24 个月 IPO 时间表，意味着大约 2026 年 12 月至 2027 年 6 月之间申报，前提是满足 SEBI 盈利记录要求，或 为亏损发行人走通豁免路径。估值逻辑的主要风险很直接：如果
              FY25 经审计数据继续显示亏损扩大（如 FY23→FY24 已发生），在没有证明走向盈亏平衡的情况下，IPO 时很难支撑 2.1x 收入倍数。OfBusiness 是最相关可比公司，但其 FY25 收入规模接近
              JSW One 的 5x，并通过 Oxyzo 子公司拥有更成熟的信贷业务。
