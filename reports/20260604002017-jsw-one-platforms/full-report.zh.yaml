            - 无 — 所有来源中均无具名制造或建筑 MSME 买方
            - N/A — 无证据
            - N/A
            - N/A — 70%+ 复购指标为平台层面；无买方层归因
            - 缺口 — 对 IPO 前尽调至关重要；要求管理层提供 3 名参考客户
