      - number: '5.4'
        title: JSW One Homes：B2C 建筑科技平台
        blocks:
          - type: paragraph
            body: >-
              JSW One Homes（jswonehomes.com）是平台的 B2C 纵线，向个人建房者提供交钥匙式住宅建造服务。按 2026 年 6 月获取的数据，平台披露 NPS 为 +81，已交付 180+
              套住宅，在建 227+ 套。体验中心分布在 8 个城市：Bengaluru（两个地点）、Hyderabad、Bellary、Coimbatore、Hubli、Indore 和 Kochi，集中 在印度南部和部分
              Tier-2 中心。服务模型是交钥匙式：JSW One Homes 与预筛选建筑师和承包商合作，维护 一份可供客户选择的名单；随后平台管理进度、预算和里程碑。


              技术层包括项目仪表盘，客户可数字化跟踪施工进度、成本、时间表、平面图、3D 立面和材料审批。平台 提供专属客户关系经理。定价采用固定合同（签约时锁定，但极端外部价格飙升触发例外条款）， 并按阶段分期付款。先收取
              ₹25,000 初始设计费，详细设计阶段再收取预计项目成本的 5%，随后进入施工 阶段分期。公司提供三个产品档位——Standard、Premium 和 Luxury——但公开网站没有披露各档位每平方英尺
              具体价格。JSW One Homes 对 JOPL 整体财务的收入贡献未单独披露；考虑到 180+ 套住宅交付规模，相比 ₹12,567 crore 的 MSME 市场业务，这条纵线仍处早期。
