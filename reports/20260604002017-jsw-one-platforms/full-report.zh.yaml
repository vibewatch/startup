            title: JSW Group 母公司供应护城河，是 VC 支持竞争者无法获得的结构性成本优势
            body: >-
              OfBusiness、Moglix 和 Infra.Market 都用多年独立增长搭建了制造和寻源基础设施。JSW One 从 2021 年上线第一天起就能使用 JSW Group
              的钢铁和水泥供应确定性，获得结构性可靠性和潜在成本优势；VC 支持的同业可以逼近，但无法复制。在集团支持的竞争者中，Birla Pivot（ABG）和 Tata nexarc 共享这套逻辑，但商品品类不同。只有当
