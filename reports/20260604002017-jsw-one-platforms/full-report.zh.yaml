        - 结果具体性
        - 独立性水平
        - 留存 / 持久性信号
        - 尽调状态
      rows:
        - label: Deutsche Bank（银行合作伙伴）
          values:
            - 机构合作伙伴
            - 高 — 已发布案例研究，具名高管和奖项佐证
            - 高 — 具体 API 集成、节点账户和 STP 指标均有披露
            - 合作伙伴（与 MSME 客户群保持独立交易距离）
            - 高 — 自 FY22 起持续生产关系
            - 已验证；无需进一步动作
        - label: Praveen Kumar 先生（Homes B2C）
          values:
            - B2C 个人消费者
            - 中 — 网站客户证言；披露姓名和城市；结果为定性描述
            - 中 — 描述城市（Visakhapatnam）和总体结果；无量化指标
            - 客户（独立终端用户）
            - 低 — 单个项目；无复购数据
            - 足以支撑 B2C 板块；需要更多证言验证持久性信号
        - label: SBI（联合放贷方 / 投资方）
