          - type: callout
            title: IPO 队列竞速同时加剧所有同业的获客和 GMV 压力
            body: >-
              截至 2026 年 6 月，JSW One、OfBusiness、Infra.Market、Zetwerk 和 Moglix 都在探索或准备上市，形成少见的并行冲刺环境。IPO 前阶段通常会推动激进 GMV
              扩张、折扣定价和平台深耕。JSW One 的 FY25 GMV 增长 240%，说明它能参与这场冲刺，但起点基数最小，在独角兽队列中信贷子公司也最年轻。
