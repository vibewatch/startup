      - number: '7.6'
        title: 竞争与市场周期风险
        blocks:
          - type: paragraph
            body: >-
              Tracxn 识别出，截至研究日，印度 B2B 钢材和建筑材料市场领域有 133 家活跃竞争对手，其中数家拥有更高 绝对 GMV 或更多元供应链。OfBusiness、Infra.Market、Moglix 和
              Zetwerk 的 GMV 或收入均超过 Rs 10,000 crore，达到或超过 JSW One 规模，并已募集相当或更多总资本。集团背书子集——Tata Nexarc（Tata Group）、 Birla
              Pivot（Aditya Birla Group）和 L&T Supply Chain Finance——复制了 JSW Group 制造集团背书这一 结构优势，却少了关联方复杂性。Infra.Market 已向
              SEBI 秘密提交 DRHP，拟进行 Rs 5,000 crore IPO，说明 资本市场竞争迫近，也可能压紧同一窗口内第二家 B2B 建材平台上市的 pre-IPO 投资人胃口。JSW One 的差异化
              靠钢材品类深度、JSW Steel 供货关系和集成式 JOFL 信贷飞轮。钢材供应优势与前述关联方风险相关，因此被 部分抵消。钢价波动是放大变量：CY2024 国内 HRC 价格因需求疲弱和中国进口压力下跌约
              20%；若再次 下行，在佣金率不变时会压缩 GMV，同时抬高 JOFL 账簿信贷风险。JSW One 收入结构中 82% 来自制造业、 18%
              来自建筑业，集中在周期敏感且承受结构性价格压力的行业。公司未公开披露可缓冲钢材周期敞口的 对冲策略或采购定价保护。
