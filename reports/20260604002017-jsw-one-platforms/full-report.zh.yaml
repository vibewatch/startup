      - number: '6.5'
        title: 扩张动态与集中风险
        blocks:
          - type: paragraph
            body: >-
              JSW One 的客户基础在两个维度集中：产品上是钢材重目录，母公司依赖上是 JSW Steel 作为主要供应商和 品牌资产锚。制造业 MSME 占
              82%，如果汽车零部件或加工需求在钢材周期下行中转弱，平台会承压。多品牌 模式——Tata Steel、ArcelorMittal Nippon Steel 和其他品牌与 JSW Steel
              并列上架——是有意设计，用来 建立买方信任并降低单一供应商风险感知；但任何对 JSW Steel SKU 的偏好感知，都可能侵蚀平台的独立定位。

              地理扩张已从 Maharashtra / South India 基地（FY21–22）推进到 FY23 覆盖 Gujarat、Rajasthan、Madhya
              Pradesh、Chhattisgarh、Delhi-NCR 和 Andhra Pradesh。JSW One Homes 在 9 个城市运营 10 个体验中心， 并计划再开 6 个。向前扩张的关键，在于能否在
              tier-2 和 tier-3 城市复制信贷带来的粘性；这些城市 MSME 最集中，但数字采购采用率最低。Forbes India 报道将 JSW 描绘为一个正积极重塑消费者和 MSME-facing
              业务的集团，与平台瞄准 500,000 家 MSME 的先落地再扩张策略一致。

              值得监测的集中风险包括：按 GMV 计的前 10% 买家很可能贡献不成比例的收入（未披露）、单一企业细分 （制造业）驱动 82% 买家、JSW One 运营亏损扩大（The Company Check 披露
              FY24 净亏损 ₹113 crore） 带来中期资金跑道问题，以及尚未证明能否再吸纳 416,000 家 MSME 以达成 500,000-MSME 目标。
