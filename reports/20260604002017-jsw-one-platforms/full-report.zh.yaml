      - number: '8.3'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              JSW One 最相关的未上市可比公司，是 OfBusiness（$5 billion，Series G）、Infra.Market（₹24,700 crore / 约 $3 billion，Series G）和
              Zetwerk（拟 IPO，目标融资 $400–500 million）。三家公司总部都在印度，都是服务制造或建筑供应链、并嵌入信贷的 B2B 商务平台。

              OfBusiness 给出了最清晰的收入倍数基准：其法律实体 OFB Tech 披露 FY25 收入约 $2.66 billion，估值 $5 billion，隐含约 1.9× 收入。JSW One 以 $1
              billion 估值计算的收入倍数为 2.16×，较这个成熟 Series G 同行略有溢价。若看 JSW One 更快的增长轨迹（GMV 复合年增长率 240%，而 OfBusiness
              基数更稳），溢价有理由；但考虑 JSW One 仍持续亏损、阶段更早，这个倍数偏进取。Infra.Market 的 ₹24,700 crore 估值与其披露收入基数对应的倍数区间大体相近；其累计融资 $804
              million，也显示出与 JSW One 类似的资本密集型模型。

              IndiaMART 是印度唯一可直接对比的上市 B2B 市场，但它有正 EBITDA 和现金生成，利润画像完全不同。其市值和收入倍数，为印度公开市场愿意给有持久利润率的 B2B
              商务平台支付多少提供了长期上限。不过 IndiaMART 是纯目录 / 线索生成市场，不是分销主体，倍数不能直接搬用。Zetwerk 目标 IPO 融资 $400–500
              million，隐含市值可能接近或超过最近一轮私募估值；若成功上市，将实质性验证 JSW One 所需的印度 B2B IPO 窗口。

              JSW One 的 0.68× GMV 倍数在同业中处于低位，既反映阶段更早，也反映其自营主体模型下 GMV 利润率更低——相当一部分 GMV 是成本穿透。因此，收入倍数更有参考价值。按 2.16×
              往绩收入、240% 增长来看，只要公司能按指引在 FY26 打平，当前估值属于合理到偏高，但谈不上离谱昂贵。
