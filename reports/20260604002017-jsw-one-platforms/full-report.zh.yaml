companyProfile:
  summary: >-
    JSW One Platforms Limited 是 JSW Group 的数字化工业商贸业务，法律上 2018 年在 Mumbai 注册成立；公开来源对商业化启动时间存在冲突，指向 2021 年。平台把主体自营的 B2B
    材料市场、分销与履约业务、JSW One TMT 等自有品牌，以及面向 MSME 的 JSW One Finance 采购金融和营运资金产品放在一起。公开披露显示，公司有三条运营支柱——市场、分销和自有品牌——并拥有 2024
    年推出的全资 NBFC 子公司 JOFL。2023 年 Mitsui 投入 ₹205 crore、2025 年 5 月 ₹340 crore 独角兽轮、2025 年 10 月 ₹575 crore 延展轮之后，JSW One
    已披露股权资本约 ₹1,120 crore，最新隐含估值约 $1.0-1.02 billion。FY25 GMV 达到 ₹12,567 crore，注册 MSME 客户超过 84,000 家，但 FY25
    经审计报表仍不可得，盈利改善的确切速度也没有外部验证。
