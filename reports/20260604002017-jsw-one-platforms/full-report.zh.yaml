      - number: '4.3'
        title: 单位经济模型与盈亏平衡路径
        blocks:
          - type: paragraph
            body: >-
              本章最关键的财务风险是净亏损轨迹。即使收入增长 4.2x，净亏损仍从 FY23 的 ₹83.8 crore 扩大到 FY24 的 ₹277 crore。按绝对值看，亏损变大；按亏损 / 收入比率看，则从约
              24.8%（FY23）改善到约 19.5%（FY24）。这符合主体模型企业在早期规模化阶段先建立基于体量的采购优势、再收紧经营杠杆的路径。截至 2026 年 6 月，经审计的 FY25
              净亏损数据尚未公开。信贷子公司 JOFL（JSW One Finance Limited）是全资 NBFC，截至 2025 年 10 月报告 AUM 为 ₹100 crore，目标到 FY26 年底达到 ₹500
              crore。JOFL 只占总信贷账簿的一小部分（约为每月 ₹500 crore 撮合信贷的 18%），承受 RBI 监管下的资本充足率要求，NPA 情况未公开。盈亏平衡时间线指引已经变化：2023 年 4 月
              Mitsui 轮融资时，管理层指引 FY27 盈利；到 2025 年 6 月，CEO Gaurav Sachdeva 以更大 GMV 规模下单位经济改善为由，将目标提前到 FY26。这两种说法存在张力，只能靠
              FY25 和 FY26 经审计账目调和。营运资金管理是关键杠杆：公司约 40% GMV 以信用方式销售，而为这本应收账款融资的成本——无论来自资产负债表资本还是仓储贷款安排——没有公开披露。如果 FY26
              毛利率改善、物流效率和信贷费用收入同步提升，盈亏平衡在机制上可行；但目前没有公开数据证实这条轨迹。
