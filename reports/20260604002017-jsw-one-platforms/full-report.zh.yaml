    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、法律实体、产品范围与公司结构
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms Limited（JOPL）是一家技术驱动的 B2B 电商市场，2018 年 9 月 20 日在 Maharashtra 的 Mumbai 注册成立，CIN 为
              U51100MH2018PLC314290。公司曾注册为 JSW Retail Limited，之后更名为 JSW One Platform Limited，再采用现在的名称。按分类，它是由 ROC Mumbai
              登记的活跃、未上市公众有限公司；截至最近一次申报，授权资本为 ₹500 crore，实缴资本为 ₹294.78 crore。


              平台在 2021 年商业化上线——不同来源给出的启动日期分别是 2021 年 1 月（Economic Times）、2021 年 4 月（Deutsche Bank 案例研究）和 2021 年 7
              月（Business Standard），这一未解决冲突已在证据缺口中处理。JOPL 主要通过网站 jswonemsme.com 运营，向年营业额 ₹25 crore 到 ₹2,500 crore
              的制造业和建筑业 MSME 销售钢铁、水泥、涂料和建筑材料。


              JOPL 旗下有三个主要经营实体：母公司市场平台（JOPL）；JSW One Distribution Limited（JODL），负责采购、仓储、材料加工和合同制造；以及 2024 年 8 月推出、100%
              控股的 NBFC——JSW One Finance Limited（JOFL），提供采购金融、供应商金融和营运资金贷款。市场、分销 和自有品牌三条一体化业务线由 14 个库存点和约 7
              个合同制造地点支撑。自有品牌 JSW One TMT 于 2023 年 12 月推出，目标市场是印度北部和中部。JSW One Homes 通过 jswonehomes.com 提供单独的 B2C
              交钥匙建房服务。根据最新公司注册信息，该实体雇用 485 名专业人员。
