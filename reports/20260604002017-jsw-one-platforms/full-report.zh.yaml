  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与现状替代方案
        blocks:
          - type: paragraph
            body: >
              JSW One 的实际市场更适合定义为印度 MSME 面向工业和建筑材料的私营部门 B2B 采购，而不是泛电商。公司自身定位和同期报道都围绕钢铁、水泥、涂料、管道、电气、卫浴和相关项目投入品展开；买家包括制造业
              MSME、承包商、经销商和小型开发商。也就是说，纳入口径是与持续建筑、加工和项目执行流程绑定的经常性材料采购，加上让这些采购可执行的近邻服务——信贷、经验证的物流、订单跟踪和财务对账。


              几个大型资金池不属于本章核心边界。GeM 上的政府采购是数字化采用的重要基准，但受公共采购规则约束，并不是 JSW One 的核心私营市场 SAM。IndiaMART、Amazon Business 和 ONDC
              更应被理解为横向替代方案或工作流替代：它们可以处理搜索、发现、目录、合规或互操作性，但不能定义同一个钢铁和建筑专业切入口。Birla Pivot 对建筑商贸市场的描述——碎片化、总体仍未组织化，数字渗透率只有
              ~2%——之所以有用，是因为它抓住了既有现状：线下经销商网络、定价不透明、基于信任的采购和手工营运资金管理，仍是 JSW One 试图替换的主流选择。
