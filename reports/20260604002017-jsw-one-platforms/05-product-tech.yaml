- id: jsw-one-homes
  title: 'JSW One Homes: B2C Construction Technology Platform'
  body: "JSW One Homes (jswonehomes.com) is the B2C vertical of the platform,\
    \ providing turnkey home construction services to individual homebuilders.\
    \ As of data retrieved in June 2026, the platform reports an NPS score of\
    \ +81, 180+ homes delivered, and 227+ homes under construction. Experience\
    \ centres are located in eight cities: Bengaluru (two locations), Hyderabad,\
    \ Bellary, Coimbatore, Hubli, Indore, and Kochi—concentrated in South India\
    \ and select Tier-2 centres. The service model is turnkey: JSW One Homes\
    \ works with pre-screened architects and contractors, maintaining a list\
    \ from which clients select; the platform then manages timelines, budgets,\
    \ and milestones.\n\nThe technology layer consists of a project dashboard\
    \ enabling clients to track construction progress, costs, timelines, floor\
    \ plans, 3D elevations, and material approvals digitally. A dedicated relationship\
    \ manager is accessible via the platform. Pricing is structured as a fixed\
    \ contract (frozen at signing, subject to an exception clause for extreme\
    \ external price spikes), with stage-based installment payments. An initial\
    \ design fee of ₹25,000 is collected, followed by 5% of estimated project\
    \ cost at the detailed design stage, then construction-stage tranches. Three\
    \ product tiers are offered—Standard, Premium, and Luxury—though specific\
    \ per-square-foot pricing for each tier is not disclosed on the public site.\
    \ Revenue contribution of JSW One Homes to JOPL's overall financials is\
    \ not separately disclosed; given the 180+ home delivery scale, this vertical\
    \ remains early relative to the ₹12,567 crore MSME marketplace business."
  claimRefs:
  - CE026
  - CE027
  - CE028
  - CE029
