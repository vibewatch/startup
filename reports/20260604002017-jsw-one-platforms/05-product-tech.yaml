- id: logistics-distribution-private-brands
  title: Logistics, Distribution, and Private Brands
  body: "JSW One Distribution Limited (JODL), a 100% subsidiary of JOPL, manages\
    \ the physical supply chain: procurement, warehousing, material processing\
    \ (steel coil cutting and sizing), and contract manufacturing for private-label\
    \ products. As of October 2025, JODL operated 14 stock points and approximately\
    \ 7 contract manufacturing locations across India. Mint describes the logistics\
    \ model as \"asset-light\" with specialisation in distribution of steel coils;\
    \ the HBL FY25 review notes a just-in-time delivery network scaling through\
    \ service centres nationwide. The ₹575 crore October 2025 round explicitly\
    \ includes expansion of the distribution and logistics network across major\
    \ industrial clusters.\n\nPrivate brands deepen vertical integration. JSW\
    \ One TMT launched in December 2023, initially targeting North and Central\
    \ India and available through both online and offline channels. The jsw.in\
    \ platform page additionally lists JSW One Concrete as a second private\
    \ brand under development—with the stated aim to \"bridge the quality gap\
    \ in construction materials\"—but no launch date or volume has been disclosed\
    \ for the Concrete brand. One Helix Pipes & Tubes appears in the jswonemsme.com\
    \ navigation as a sub-brand; the nature and production scale of this brand\
    \ is not documented in any external source reviewed. The JODL subsidiary's\
    \ financial statements are separately filed under MCA; Tracxn reports JODL\
    \ revenue of $459 million (approximately ₹3,820 crore) for FY25, suggesting\
    \ distribution revenue closely tracks marketplace GMV. Exact warehousing\
    \ SLAs, stock-point locations, and coil-processing capacity are not publicly\
    \ disclosed."
  claimRefs:
