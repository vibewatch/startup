chapter:
  number: 5
  title: Product & Technology
  summary: JSW One Platforms operates a modular "tech-fin-stack" combining a multi-brand B2B e-commerce marketplace (jswonemsme.com), an asset-light distribution subsidiary (JODL with 14 stock points), an in-house NBFC (JSW One Finance Limited, launched August 2024), and a B2C home-construction service (JSW One Homes). The platform's most-evidenced technical differentiators are cash-flow-based credit underwriting using transaction data, end-to-end API integration with Deutsche Bank's core banking system for straight-through payment processing, and delivery-level backward traceability via mill test certificates—together supporting ₹12,567 crore GMV and ₹3,800 crore credit facilitation in FY25. Core technology architecture details—backend stack, cloud infrastructure, NBFC underwriting model specifics, and mobile app performance—remain opaque, representing material diligence gaps for a company targeting an IPO by FY28.
sections:
- id: digital-marketplace-catalog
  title: Digital Marketplace Architecture and Product Catalog
  body: "JSW One's primary product is jswonemsme.com, a B2B e-commerce platform\
    \ serving manufacturing and construction MSMEs with annual turnover of ₹25\
    \ crore to ₹2,500 crore. The catalog spans mild steel, structural steel, thermomechanically\
    \ treated (TMT) bars, and cement—with search functionality evidenced by SKU\
    \ examples \"TMT Fe500D,\" \"JSW Steel HR Coil E250A,\" and \"Cement OPC\
    \ 43/53\" visible in the site navigation. A platform-wide multi-brand philosophy\
    \ means MSMEs can procure from JSW Steel alongside competitor brands including\
    \ Tata Steel and ArcelorMittal Nippon Steel, with COO Mayank Gupta describing\
    \ this as \"a strategic and deliberate choice\" to provide \"choice, transparency,\
    \ and reliability.\" Navigation also reveals two private-label sub-brands:\
    \ JSW One TMT and One Helix Pipes & Tubes.\n\nThe marketplace delivers several\
    \ product-tech differentiators over traditional procurement: every steel\
    \ delivery includes a mill test certificate documenting individual physical\
    \ and chemical properties and tolerances, providing backward traceability\
    \ from the MSME back through JODL's processing to the source mill. This removes\
    \ the opacity that characterises the fragmented offline market—where MSMEs\
    \ historically could not confirm grade or source for a commodity like steel.\
    \ Platform traction is evidenced by over 70% repeat order share (pre-credit\
    \ launch baseline per Moneycontrol), 84,000+ registered MSMEs, and 2 million\
    \ tonnes of steel facilitated in FY25. A mobile app is referenced in the\
    \ site footer (\"Download our App\"), though in-app ratings and session metrics\
    \ are not publicly accessible via app store pages, which blocked automated\
    \ retrieval. The JSW One MSME website is a JavaScript-heavy single-page\
    \ application; individual product-category pages and blog posts do not render\
    \ readable content via automated fetch, which limits independent verification\
    \ of catalog depth and pricing transparency claims."
