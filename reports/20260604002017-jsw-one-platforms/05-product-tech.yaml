  columns:
  - Control / Certification
  - Status
  - Scope
  - Gap
  rows:
  - - Mill test certificate per steel delivery
    - Active (company-described)
    - Each steel delivery; documents individual physical and chemical properties and tolerances
    - No third-party audit or independent lab confirmation cited; scope of backward traceability to original mill unverified
  - - eCommerce special nodal account (Deutsche Bank)
    - Active
    - Consumer fund protection until product delivery; seller payout timeline compliance; RBI eCommerce nodal regulations
    - No specific RBI notification or circular cited; single banking partner; no escrow time limits disclosed
  - - NBFC regulatory compliance (JOFL)
    - Active (RBI-registered NBFC per DB case study)
    - Data integrity, regulatory compliance, and lending operations per RBI NBFC framework
    - RBI registration certificate number not cited in any source; annual RBI NBFC return not publicly found
  - - Privacy and return policies (jswonemsme.com)
    - Published (pages exist in navigation)
    - Platform-level policies for buyers and sellers
    - Policy content not retrievable via automated fetch (JS-only pages); terms unknown externally
  - - Backward traceability (steel supply chain)
    - Active (company-described)
    - Grade and source documentation per JODL-processed delivery; mill certificate included
    - Traceability to original mill vs JODL processing step only is unclear; no certification body named
