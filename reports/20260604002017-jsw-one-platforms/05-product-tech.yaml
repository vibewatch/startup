- id: TE002
  title: Customer Workflow and Use-Case Assessment
  columns:
  - User Job-to-be-Done
  - Traditional / Status-Quo Workflow
  - JSW One Solution
  - Measurable Benefit (Source-Backed)
  - Current Limitation
  rows:
  - - Procure certified steel for manufacturing
    - Offline dealers, spot prices, no grade documentation; cannot verify mill of origin
    - jswonemsme.com multi-brand catalog; order placement; JODL delivers with mill test certificate
    - Backward traceability per delivery; 2 million tonnes facilitated FY25; 70%+ repeat orders (pre-credit)
    - Individual product pages not accessible via automated fetch; true catalog breadth unverified
  - - Access working capital / inventory finance
    - Bank term loans (collateral-heavy), dealer credit (opaque pricing), or upfront payment
    - JOFL NBFC + partner co-lending; 60–90 day inventory loans; cash-flow underwriting on transaction data
    - ~33% of orders use credit; ₹3,800 Cr partner-facilitated and ₹475–500 Cr/month disbursed; ₹100 Cr JOFL own book
    - Partner NBFC/bank identities undisclosed; NPA rates unknown; loan terms beyond 60–90 days not documented
  - - Customise steel coil dimensions and grade
    - Manual offline order with dealer; quality uncertain; lead times unpredictable
    - Platform order with spec inputs; JODL processes steel coils to customer dimensions
    - Quality specified and tested per delivery; asset-light JIT from 14 stock points
    - Processing lead time vs off-shelf stock not disclosed; geographic coverage of stock points not listed
  - - Construct a private home (B2C)
    - Local contractor (fragmented, quality uncertain); no real-time site supervision; price inflation risk
    - JSW One Homes turnkey; fixed-price contract; dashboard with floor plans, costs, approvals
    - NPS +81; 180+ homes delivered; installment payments with price locked at contract stage
    - 8-city coverage (South India and select Tier-2); premium packaging; B2C revenue not separately disclosed
  - - Receive and reconcile supplier payments (platform seller)
    - Manual invoicing, delayed settlement, reconciliation errors
    - Deutsche Bank eCommerce nodal account; STP via LMS-CBS API; automated ledger sync; email/SMS confirmation
    - Real-time Payment Status Check API; award-winning (The Asset Best Payments Solution, India)
    - Described by DB partner only; no independent audit of uptime or error rates
  notes: "Benefit data from DB case study, Mint (Oct 2025), and HBL (May 2025) unless noted. Some benefits are company-claimed and not independently audited."
  claimRefs:
  - CE007
  - CE008
  - CE012
  - CE016
  - CE017
  - CE018

- id: TE003
  title: Technology and Operating Architecture
  columns:
  - Layer / Component
  - Role
  - Dependency
  - Risk
  rows:
  - - jswonemsme.com web platform (SPA)
    - Front-end B2B catalog, order management, account management, order tracking
    - Proprietary; JavaScript-heavy SPA (backend stack undisclosed)
    - Limited crawlability and SEO signal; catalog depth and pricing not externally verifiable
  - - Mobile application (Android/iOS)
    - MSME order placement, order tracking, notifications
    - Native apps downloadable from Google Play/App Store (link on site footer)
    - App store ratings and install metrics blocked; mobile UX quality unverified externally
  - - Loan Management System (LMS)
    - Credit origination, disbursement tracking, repayment management
    - Proprietary LMS; integrated to Deutsche Bank CBS via API
    - Architecture described only by DB partner; no primary source; single-vendor CBS dependency
  - - Deutsche Bank eCommerce Nodal Account
    - Aggregate buyer payments; protect consumer funds until delivery; manage seller payouts
    - Deutsche Bank Core Banking System (CBS); regulatory eCommerce nodal framework
    - Single banking partner concentration for payment settlement; counterparty dependency risk
  - - Payment Status Check APIs and Collections APIs
    - Real-time fund visibility for operations and customers; collections confirmation
    - Deutsche Bank CBS infrastructure
    - API reliability and SLA dependent on DB infrastructure; no public status page cited
  - - Partner NBFC/Bank credit stack
    - Underwrite and disburse majority of platform credit (₹3,800 Cr in FY25)
    - Multiple unnamed partner banks and NBFCs
    - Identity, capacity, and credit policies of co-lending partners undisclosed; concentration risk
  - - Cash-flow-based underwriting engine
    - MSME credit scoring using high-velocity platform transaction data
    - Proprietary algorithm; inputs from jswonemsme.com transaction history
    - Model architecture, data inputs, validation, and bias controls not publicly disclosed
  notes: "Architecture sourced from Deutsche Bank case study (2025); represents the integration layer only. Full backend stack, cloud provider, and engineering toolchain are undisclosed."
