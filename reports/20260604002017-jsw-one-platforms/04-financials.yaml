  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        FY25 and FY26 audited P&L, balance sheet, and cash-flow statements. Specifically: net
        loss, gross margin breakdown by category, and working-capital position.
      whyItMatters: >-
        The break-even narrative is entirely management-guided and cannot be independently
        verified or challenged without audited accounts. FY24 loss widened 3.3x even as revenue
        quadrupled, making the FY26 break-even target structurally ambitious.
      diligencePath: >-
        Request management accounts or audited financials from company. Flag as blocking before
        any pre-IPO investment. Cross-check with DRHP when filed.
      relatedQuestionRefs:
        - QI024

    - type: access-blocked
      severity: material
      topic: jsw-steel-exclusivity
      missingEvidence: >-
        Formal inter-company agreement governing whether JSW Steel has agreed to limit direct
        MSME steel sales to protect JSW One's distribution volumes, and on what pricing terms
        JSW Steel supplies to JSW One.
      whyItMatters: >-
        JSW One's distribution moat relies on JSW Steel preferential supply or channel exclusivity.
        If JSW Steel can compete directly with JSW One for MSME accounts post-IPO, the platform's
        long-term unit economics and revenue quality are at risk.
      diligencePath: >-
        Request inter-company supply agreement as part of IPO due diligence. Review related-party
        transaction disclosures in DRHP when filed.
      relatedQuestionRefs:
        - QI025

    - type: private-evidence-only
      severity: material
      topic: credit-fee-structure
      missingEvidence: >-
        Exact origination, referral, or service-fee rate that JSW One earns from its nine named
        MSME credit partner lenders on the approximately ₹500 crore per month facilitated credit.
      whyItMatters: >-
        Credit facilitation is a key revenue and margin lever at scale. The fee income quantum
        determines whether the credit business is a meaningful EBITDA contributor or merely
        a buyer acquisition subsidy.
      diligencePath: >-
        Request partner lender agreements from management. The fee structure should also appear
        in DRHP revenue-recognition notes.
      relatedQuestionRefs:
        - QI023

    - type: missing-source
      severity: material
      topic: jofl-npa-car
      missingEvidence: >-
        JOFL's net NPA ratio, capital adequacy ratio, and RBI NBFC registration certificate
        status. JOFL AUM is ₹100 crore (Oct 2025) and is a regulated NBFC.
      whyItMatters: >-
        NBFC credit quality and capital adequacy determine how rapidly JOFL can scale its
        own-book lending from ₹100 crore toward the ₹500 crore FY26 target without breaching
        RBI regulatory thresholds.
      diligencePath: >-
        Check MCA filings for JSW One Finance Limited. Request JOFL's most recent RBI return.
        Review NPA data and tier-1 capital ratio.
      relatedQuestionRefs:
        - QI026

    - type: missing-source
      severity: minor
      topic: ipo-mandate
      missingEvidence: >-
        Names of investment banks mandated for the IPO; whether a DRHP has been filed with SEBI;
        proposed exchange listing (NSE, BSE, or both); lock-up and dilution structure.
      whyItMatters: >-
        IPO timeline and pricing credibility depend on the mandate and regulatory filing status.
        SEBI has track-record profitability requirements that may require an exemption for a
        loss-making issuer.
      diligencePath: >-
        Monitor SEBI DRHP filing registry. Follow press coverage for banker mandate announcements.
        Check SEBI regulations on eligibility for loss-making companies.
      relatedQuestionRefs:
        - QI027
