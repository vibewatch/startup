  - id: unit-economics-path-to-breakeven
    title: Unit Economics and Path to Break-even
    body: >-
      The most consequential financial risk in this chapter is the net-loss trajectory.
      Net losses widened from ₹83.8 crore in FY23 to ₹277 crore in FY24 even as revenue
      grew 4.2x. In absolute terms the losses grew; on a loss-to-revenue ratio they improved
      from approximately 24.8% (FY23) to approximately 19.5% (FY24), consistent with a
      principal-model business that uses initial scale-up phases to establish volume-based
      procurement advantages before tightening operating leverage. Audited FY25 net-loss
      data is not publicly available as of June 2026. The credit arm JOFL (JSW One Finance
      Limited), the wholly owned NBFC, reported ₹100 crore in AUM as of October 2025 and
      targets ₹500 crore by end of FY26. JOFL represents a small fraction of the total
      credit book (approximately 18% of monthly facilitated credit of ₹500 crore per month),
      carries RBI-regulated capital adequacy requirements, and its NPA profile is not public.
      The break-even timeline guidance has shifted: at the April 2023 Mitsui round, management
      guided profitability for FY27; by June 2025, CEO Gaurav Sachdeva revised the target
      forward to FY26, citing improved unit economics at greater GMV scale. The two statements
      are in tension and can only be reconciled by audited FY25 and FY26 accounts. Working-
      capital management is the critical lever: the company extends credit on roughly 40% of
      its GMV, and the cost of funding that receivable book—whether through balance-sheet
      capital or warehouse-lending arrangements—is not publicly disclosed. Break-even is
      mechanically plausible if gross margin improvements, logistics efficiencies, and credit
      fee income all improve together in FY26, but no public data yet confirms this trajectory.
