  - id: valuation-ipo-and-peer-multiples
    title: Valuation Marks, IPO Path, and Peer Multiples
    body: >-
      The ₹8,575 crore valuation set in May 2025 and maintained through the October 2025
      extension represents approximately 2.16x FY25 revenue of ₹3,976 crore. This is broadly
      in line with OfBusiness—India's largest B2B raw-materials platform—which was valued at
      approximately $5 billion against FY24 revenue of ₹19,296 crore, implying a 2.15x
      revenue multiple. Infra.Market, the construction-focused competitor, carries a lower
      implied multiple of approximately 1.34x (FY25 revenue ₹18,472 crore against ₹24,700
      crore valuation), suggesting the market is applying a modest premium to the JSW Group
      distribution brand and credit infrastructure at JSW One relative to Infra.Market.
      IndiaMART InterMESH, the listed B2B discovery marketplace, is structurally different
      (SaaS subscription model, no principal procurement risk) and not directly comparable.
      The planned IPO targets $350-400 million in fresh capital, with multiple reports from
      April-May 2026 confirming active investment-bank outreach and a ₹650-700 crore pre-IPO
      bridge round under discussion. The 18-24 month IPO timeline from June 2025 implies a
      window of approximately December 2026 to June 2027 for filing, contingent on SEBI
      profitability track record or exemption pathways for loss-making issuers. The principal
      risk to the valuation thesis is straightforward: if FY25 audited data shows continued
      loss widening (as occurred FY23→FY24), the 2.1x revenue multiple becomes difficult to
      sustain at IPO without demonstrated progress toward break-even. OfBusiness provides the
      most relevant comparable, but it has nearly 5x JSW One's FY25 revenue scale and a
      more mature credit business through its Oxyzo subsidiary.
