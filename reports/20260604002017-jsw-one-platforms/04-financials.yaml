      JSW Steel's ₹321,064 crore market cap and its participation across multiple JSW One
      funding rounds provides a credible capital backstop for an IPO delay or further bridging
      rounds. SBI's co-investment at the October 2025 valuation cap is an independent
      institutional signal of business quality that goes beyond pure strategic alignment.
