      - CI040

  - calloutType: risk
    title: Widening absolute losses with no audited FY25 confirmation
    body: >-
      FY24 net loss of ₹277 crore was 3.3x the FY23 loss of ₹83.8 crore, even as revenue
      grew 4.2x. The FY26 break-even target requires a complete reversal of this trend with
      no publicly available FY25 audited data to confirm the trajectory. This is the single
      highest-priority financial diligence blocker before any pre-IPO investment decision.
    claimRefs:
      - CI019
      - CI020
      - CI022
      - CI023
      - CI024

  - calloutType: risk
    title: JSW Steel conflict of interest in multi-supplier neutrality
    body: >-
      JSW Steel's equity stake in JSW One creates a structural incentive to channel JSW Steel
      volumes through the platform even at the cost of buyer-side pricing competitiveness.
      If JSW One relies on JSW Steel preferential supply pricing to maintain margins, any
      pricing normalisation post-IPO could compress both revenue quality and the valuation
      multiple.
    claimRefs:
      - CI029
      - CI030
      - CI031

