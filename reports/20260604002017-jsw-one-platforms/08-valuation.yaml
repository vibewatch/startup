company:
  name: JSW One Platforms
chapter:
  number: 8
  title: Valuation
  summary: >-
    JSW One Platforms achieved a $1 billion unicorn valuation in May 2025 after a ₹340 crore
    round, confirmed at ~₹8,575 crore in the October 2025 ₹575 crore extension. At roughly
    2.2× FY25 revenue (₹3,976 crore) and 0.68× GMV (₹12,567 crore), the mark is a slight
    premium to OfBusiness (1.9× revenue at Series G) but is justified by 240% GMV growth and
    JSW Group's distribution moat. The verdict is Track: the strategic thesis is credible, but
    widening losses (₹277 crore net loss in FY24), related-party concentration, absent FY25
    audited P&L, and aspirational IPO plans sustain material uncertainty that prevents a Buy.

sections:
  - id: investment-thesis
    title: Investment Thesis, Anti-Thesis, and Recommendation
    body: >-
      JSW One Platforms occupies a structurally attractive position at the intersection of
      India's industrial digitisation wave and the JSW Group's deep supply-chain relationships
      in steel and cement. The investment thesis rests on four pillars. First, GMV growth of
      240% year-on-year in FY25 to ₹12,567 crore, equivalent to roughly 1.6% of India's
      annual steel supply, demonstrates genuine market penetration in a historically offline
      segment. Second, the company's principal-model distribution approach—taking ownership of
      inventory rather than acting as a pure marketplace—translates into higher revenue capture
      (₹3,976 crore in FY25, ~31.6% of GMV) and greater supply-chain control, differentiating
      it from thin-take-rate peers. Third, the JSW Group brand and 14 steel processing centres
      plus seven contract manufacturing locations create a logistics moat that pure-play digital
      entrants cannot replicate quickly. Fourth, the October 2025 SBI entry as an investor
      validates both the credit thesis and the NBFC growth trajectory, with JSW One Finance
      targeting ₹500 crore AUM by end-FY26 from a ₹100 crore base.

      The anti-thesis is equally compelling. Net losses widened from ₹83.8 crore in FY23 to
      ₹277 crore in FY24 as the company scaled; the trajectory implies continued cash burn well
      into FY26. The $1 billion valuation is staked almost entirely on unaudited GMV and
      company-disclosed revenue figures—no audited FY25 P&L is publicly available. JSW Steel
      is simultaneously the company's largest investor and its primary source of steel supply,
      creating a related-party concentration that complicates independent valuation and
      governance. The decision not to build a multi-seller marketplace deliberately caps
      addressable supplier diversity and could compress multiples at IPO. CEO Gaurav Sachdeva's
      own admission of a construction-sector slowdown and steel-price pressure in mid-2025
      undercuts the demand-driven growth narrative.

      The recommendation is Track with re-entry criteria tied to: (1) FY25 audited financial
      statements; (2) confirmed pre-IPO round terms and post-money valuation; and (3)
      evidence of operating leverage (gross margin expansion or loss narrowing) as GMV scales.
