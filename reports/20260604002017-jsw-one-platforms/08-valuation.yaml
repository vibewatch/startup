acknowledgedWarnings:
  - dimension: paywallRisk
    reason: >-
      Six sources are marked js-only (NSE IndiaMart exchange data, CB Insights financial
      profile, VCCircle 575cr article, Crunchbase JSW One profile, Crunchbase OfBusiness
      profile, Crunchbase Infra.Market profile); together they represent 18% of chapter
      sources — well below the 30% report-level ceiling. Each is cited only for
      corroborating data available from multiple non-restricted sources.
  - dimension: tableNotes
    reason: >-
      TV001 is a pure recommendation snapshot where every cell is the analyst's judgment
      derived directly from cited claims with no estimation or partial coverage beyond what
      is documented in the notes field itself.
  - dimension: unverifiedSource
    reason: >-
      Three sources (SV022 IndiaMART homepage, SV024 BFSI ET article on JSW One NBFC
      credit growth, SV028 Moglix homepage) are cited as confirming or reference sources
      but were not captured in the fetch-url trail for this run. Each is a well-known public
      domain; content used is limited to domain-level characterisation of IndiaMART and
      Moglix business models plus a secondary NBFC reference corroborated by primary sources
      SV001 and SV011.
