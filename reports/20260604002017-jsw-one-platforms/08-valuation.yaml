  - id: comparable-set
    title: Comparable Set Analysis
    body: >-
      The most relevant private comps for JSW One are OfBusiness ($5 billion, Series G),
      Infra.Market (₹24,700 crore / ~$3 billion, Series G), and Zetwerk (IPO aspirant
      targeting $400–500 million raise). All three are India-headquartered B2B commerce
      platforms that serve manufacturing or construction supply chains with embedded credit.

      OfBusiness provides the clearest revenue-multiple benchmark: its legal entity OFB Tech
      reported ~$2.66 billion in FY25 revenue and is valued at $5 billion, implying ~1.9×
      revenue. JSW One's 2.16× revenue multiple at $1 billion is a slight premium to this
      mature Series G peer—arguably justified given JSW One's faster growth trajectory (240%
      GMV CAGR vs OfBusiness's more stable base) but aggressive given JSW One's sustained
      losses and earlier Stage. Infra.Market's ₹24,700 crore valuation against its reported
      revenue base implies a broadly similar multiple range; its $804 million total raised
      signal a capital intensity model comparable to JSW One.

      IndiaMART, the only directly comparable listed B2B marketplace in India, trades on
      positive EBITDA and cash generation—a very different profit profile. Its market
      capitalisation and revenue multiple set a long-run ceiling for what India's public
      markets will pay for B2B commerce platforms with durable margins, but IndiaMART is a
      pure-play directory/lead-generation marketplace rather than a distribution principal,
      making direct multiple translation unreliable. Zetwerk's $400–500 million IPO target
      implies a market cap that could approach or exceed its latest private valuation;
      success there would meaningfully validate the India B2B IPO window for JSW One.

      JSW One's 0.68× GMV multiple is among the lowest in its peer set, reflecting both
      its earlier stage and the lower margin characteristics of its principal-model GMV
      (where much of the GMV is cost-pass-through). This makes the revenue multiple the
      more informative anchor, and at 2.16× trailing revenue with 240% growth, the mark
      appears fair-to-stretched but not egregiously expensive if break-even is achieved
      in FY26 as guided.
