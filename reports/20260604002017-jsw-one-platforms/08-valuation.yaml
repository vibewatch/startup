  - id: diligence-asks
    title: Diligence Asks, Thesis-Break Triggers, and Governance
    body: >-
      The most critical diligence gap is the absence of audited FY25 financial statements.
      All GMV and revenue figures are company-disclosed; the FY24 audited data (net loss of
      ₹277 crore on ₹1,421.9 crore revenue) is the last publicly confirmed anchor. Before
      any re-entry, investors should obtain the complete FY25 audited P&L and balance sheet,
      including JSW One Finance's AUM quality and provision levels. The NBFC arm is an
      emerging risk: at ₹100 crore AUM with ambitions to reach ₹500 crore, any credit
      deterioration in the MSME segment (which is highly cyclical) could require fresh equity
      infusion that dilutes existing holders.

      Related-party governance is the second critical diligence domain. JSW Steel holds
      both an equity stake and a supply-side relationship; JSW Group is both the largest
      single customer-side brand and the parent of the investor base. Any transaction between
      JSW One and JSW Steel in procurement pricing, credit terms, or logistics rates must be
      reviewed for arm's-length terms. The absence of disclosed related-party transaction
      details in the public domain is a significant governance gap for an IPO-bound company.

      Thesis-break triggers that should prompt immediate re-evaluation include: FY25 audited
      net loss exceeding ₹400 crore; pre-IPO round failure or pricing below ₹7,500 crore;
      SBI or JSW Steel reducing their stake; SEBI objections to the DRHP; or India steel
      demand entering a multi-quarter structural decline. Monitoring indicators include
      monthly GMV disclosures, NBFC AUM growth, and B2B peer IPO valuations. The final
      diligence asks are enumerated in the table below.
