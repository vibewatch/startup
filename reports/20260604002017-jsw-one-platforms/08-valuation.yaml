  - id: scenarios-exit
    title: Bull / Base / Bear Scenarios and Exit Readiness
    body: >-
      The bull case assumes: FY26 break-even is achieved, the pre-IPO round closes at
      ₹8,000–9,000 crore, and the $350–400 million IPO lists JSW One at a 3×–4× forward
      revenue multiple. If FY26 revenue reaches ₹6,000–7,000 crore (implied by the 50%+
      GMV growth guidance and stable take rate), a 3× multiple implies a market capitalisation
      of ₹18,000–21,000 crore ($2.1–2.5 billion), offering 2×–2.5× return on the current
      $1 billion mark. This scenario requires the construction sector to recover from its
      2025 slowdown, steel prices to stabilise, and the NBFC arm to contribute meaningful
      fee income.

      The base case holds the $1 billion valuation flat through FY26 as the company
      manages losses, the pre-IPO round prices at a modest premium, and the IPO lists at
      approximately $1.2–1.5 billion. Returns for new investors entering at the current mark
      are modest—roughly 20%–50% over a 24-month hold. This requires break-even to be
      delayed to FY27 but the growth story to remain credible with audited FY25 figures.

      The bear case assumes the pre-IPO round struggles to find demand at the current
      valuation, losses widen beyond ₹300 crore in FY25, and the IPO is delayed or down-
      sized. In this scenario the private valuation could compress to $600–750 million as
      growth decelerates and capital markets cool on loss-making B2B platforms. Related-party
      discount and governance concerns would amplify the compression.

      Exit readiness is work-in-progress. CEO Sachdeva confirmed active investment banker
      engagement starting FY27. JSW Group has demonstrated IPO capability (JSW Infrastructure
      listed in 2023, JSW Cement in 2025). However, JSW One still needs audited FY25 P&L,
      DRHP-ready governance documentation, and demonstrated operating leverage to meet SEBI
      and institutional investor standards. The pipeline of comparable B2B IPOs—Infra.Market
      DRHP filed October 2025, OfBusiness IPO discussions ongoing—provides a market-timing
      window if the company can close its profitability gap.
