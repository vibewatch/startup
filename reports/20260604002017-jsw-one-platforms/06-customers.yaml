    whyItMatters: >-
      All 84,000 MSME count and GMV figures are self-reported by JSW One management; without
      named buyers, pre-IPO investors cannot independently validate platform traction claims
    diligencePath: >-
      Request reference customer list from JSW One management; contact 3–5 MSMEs directly
      for interview; cross-check GMV claims against GST e-way bill data if available
    relatedQuestionRefs: [QU012]
    relatedTableRefs: [TU003]

  - type: stale
    severity: material
    topic: retention-repeat
    missingEvidence: >-
      Updated repeat order rate at the end of FY25 (84,000 registered MSME base), compared
      to the Moneycontrol figure when base was ~58,000 and the credit product was smaller
    whyItMatters: >-
      The 70%+ repeat rate is a key retention signal but was measured before credit at scale;
      repeat behaviour could have shifted as newer, less-engaged cohorts joined the platform
    diligencePath: >-
      Request FY25 end-of-year cohort retention data from JSW One; ask for MAU / DAU split;
      compare 12-month cohort retention for FY23 vs FY24 registration cohorts
