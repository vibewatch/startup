callouts:
- calloutType: risk
  title: No Named B2B MSME Buyers
  body: >-
    Despite 84,000 registered MSMEs and ₹12,567 crore GMV, not a single manufacturing or
    construction MSME procurement buyer has been named in any public source. All customer
    metrics are company-self-reported. This is a pre-IPO diligence gap that investors should
    prioritise by requesting at least three reference customers with independent outcome data.
  claimRefs:
  - CU031
  - CU012

- calloutType: strength
  title: Credit Attach Creates Switching Costs
  body: >-
    With 33% of orders using facilitated credit and ₹475–500 crore disbursed monthly,
    buyers who take credit must maintain repayment history and re-qualify if they switch
    platforms. This creates a structural retention advantage that pure procurement marketplaces
    lack, supporting the 70%+ repeat order rate.
  claimRefs:
  - CU005
  - CU006
  - CU023

