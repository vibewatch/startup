- id: named-customer-evidence
  title: Named Customer and Partner Proof
  body: >-
    Three named parties provide verifiable proof of JSW One's platform quality and customer outcomes.
    Deutsche Bank, through its published "Flow" case study, details the co-developed payments and
    collections infrastructure: a special nodal account, end-to-end LMS–CBS API integration, and
    real-time Payment Status Check APIs. Deutsche Bank awarded JSW One the "Best Payments and
    Collection Solution, India" distinction, and COO Mayank Gupta is quoted confirming cash-flow-based
    underwriting delivered through partner NBFCs. This partnership validates platform reliability for
    institutional buyers but is not evidence of B2B MSME procurement outcomes.

    For the B2C segment, JSW One Homes publishes a testimonial from Mr. Praveen Kumar of Visakhapatnam,
    describing the home-building experience with verified outcomes (project timeline, material quality).
    JSW One Homes' about-us page reports NPS of +81, 180+ homes delivered, and 227+ under construction
    as of mid-2025 across 17 geographies—strong customer-satisfaction indicators for a construction
    service, though independent verification of the NPS survey methodology is absent.

    State Bank of India anchored the ₹575 crore Series C round (April 2025) and acts as a co-lending
    partner through JSW One Finance Limited, providing institutional validation of the platform's credit
    infrastructure. No publicly named B2B MSME manufacturing or construction buyer exists in media
    coverage; all MSME customer counts and GMV metrics are company-self-reported through press releases
    or cited by journalists directly from management statements—a material diligence gap for pre-IPO
    scrutiny.
  claimRefs:
  - CU011
  - CU012
