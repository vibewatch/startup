- id: TU005
  title: Expansion and Concentration Risk Table
  layout: wide
  notes: >-
    Concentration metrics (top-buyer share, GMV by geography) are not publicly disclosed;
    entries based on qualitative analysis of public statements, segment share data,
    and competitive context.
  columns:
  - Expansion Driver / Risk
  - Current Status
  - Strategic Impact
  - Diligence Path
  rows:
  - - Geographic expansion (B2B marketplace)
    - 'FY23: Gujarat, Rajasthan, MP, Chhattisgarh, Delhi-NCR added to Maharashtra/South India base'
    - High — new geographies unlock MSME density in steel-belt regions
    - Request GMV breakdown by state/region and registered buyer distribution
  - - Geographic expansion (JSW One Homes)
    - '10 experience centres across 9 cities; 6 more planned (mid-2025)'
    - Medium — B2C segment remains small vs B2B; NPS +81 supports repeatability
    - Track experience-centre opening pace against 6-more-planned target; review by Q3 FY26
  - - MSME category expansion (cement, paints)
    - 'Cement and Paints already live; One Helix Pipes & Tubes sub-brand added'
    - Medium — cross-category purchasing increases basket size and stickiness
    - Quantify % of buyers who purchase across ≥2 product categories vs single-category
  - - Credit penetration deepening
    - '33% credit attach; JOFL loan book growing toward ₹500 Cr target by FY26'
    - High — credit creates switching costs and data flywheel for underwriting improvements
    - Confirm NPA rate and JOFL RBI registration; monitor JOFL loan book quarterly disclosures
  - - Manufacturing segment concentration (82%)
    - '82% of registered buyers are manufacturing MSMEs; construction at only 18%'
