      - number: '1.2'
        title: Leadership, Founding Sponsor, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms was initiated and is chaired by Parth Jindal, director of JSW Group and the son of JSW
              Group chairman Sajjan Jindal. Parth Jindal is credited in multiple sources with the vision to leverage JSW
              Group's manufacturing and distribution strength in steel, cement, and paints to build a technology-enabled
              B2B marketplace. Fortune India's 40 Under 40 2025 list features him as MD of JSW Cement and JSW Paints and
              identifies his pivotal role in launching JSW One MSME. Ranjan Ramdas Pai is listed as a second director in
              the company registry.


              Gaurav Sachdeva was appointed CEO of JSW One Platforms in May 2022 after a successful tenure at JSW
              Ventures, where he served as founding partner and led venture capital investments in companies including
              Purplle, Indus OS, HealthPlix, and LimeTray. His prior career spans Citibank, Bank of America, Infosys
              (where he led Continental Europe sales), and Bennett, Coleman & Co., and he holds an MBA from ISB. By
              October 2025 his title had expanded to Joint Managing Director and CEO (JMD & CEO). Multiple independent
              outlets—Economic Times, Financial Express, TechObserver, FMLive—all corroborate the May 2022 appointment
              date.


              Governance transparency is limited. The company is private and unlisted; no board committee disclosures,
              audit committee membership, or investor governance-rights documents are publicly available. The
              independence of any non-family directors beyond Ranjan Pai cannot be assessed from public sources. The
              absence of a publicly disclosed board roster beyond three names (Parth Jindal, Gaurav Sachdeva, Ranjan
              Pai) is flagged as a material diligence gap.
