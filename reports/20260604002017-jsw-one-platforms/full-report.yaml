      - number: '7.2'
        title: Related-party and governance risk
        blocks:
          - type: paragraph
            body: >-
              The most structurally complex risk at JSW One Platforms is the web of related-party relationships between
              the platform, JSW Steel, and the broader JSW Group. JSW Steel holds an equity position in the platform and
              is simultaneously its dominant steel supplier — the primary input into a marketplace that generated Rs
              12,567 crore GMV in FY25. Parth Jindal, son of JSW Group founder Sajjan Jindal, chairs the company's
              board. This configuration creates three distinct conflict vectors. First, steel procurement pricing: if
              JOPL buys steel from JSW Steel at above-market rates, the effective subsidy flows to the parent at the
              cost of platform profitability. No independent arm's-length pricing verification has been published.
              Second, capital allocation: JSW Steel participated in both the May 2024 (Rs 340 crore) and the April–May
              2025 (Rs 575 crore) rounds, meaning a related party is valuing its own affiliate. Third, governance: the
              board composition — with only three publicly identifiable names and a founding-family chairman — limits
              outside investors' ability to assess independent oversight quality. Ranjan Pai of Manipal Group is also
              named as a director; his independence relative to JSW Group has not been separately characterised in
              public sources. SEBI's DRHP review process at time of IPO will almost certainly require a full
              related-party transaction disclosure schedule, and any mispriced transactions identified at that stage
              could require restatement or valuation adjustment. The absence of an independent audit report on
              related-party procurement terms in the public record is the most actionable diligence gap in this chapter.
