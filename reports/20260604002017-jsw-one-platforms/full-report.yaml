            body: >-
              JSW One's registered MSME count grew from approximately 15,000 in FY23 to 84,000+ by end of FY25, a 5.6×
              expansion over two years. The Q1 FY25 GMV of ₹2,549 crore versus Q1 FY24's ₹610 crore (4.2× YoY)
              demonstrates accelerating revenue per registered buyer, not just user count growth. Full-year FY25 GMV of
              ₹12,567 crore against FY24's approximately ₹5,200 crore (implied from Q1 ratio) represents a +2.4× annual
              increase. The platform facilitated approximately 2 million tonnes of steel in FY25, or roughly ₹6,300 per
              tonne—consistent with mid-range Indian steel market pricing. Monthly credit disbursement as of October
              2025 was ₹475–500 crore, translating to approximately ₹5,700 crore annualised—a near-50% step-up over the
              ₹3,800 crore FY25 total.

              Against a stated target of 500,000 MSMEs, 84,000 registered users represents only 16.8% penetration,
              leaving a 6× headroom if the company can replicate its Maharashtra/South India playbook nationally.
              India's Udyam portal had registered over 4.8 crore (48 million) MSMEs as of 2024; filtering for the
              steel-and-construction-relevant turnover bracket (₹25 crore+) narrows the addressable universe, but JSW
              One's 500,000-MSME target appears conservative relative to total registrations. The H1 FY26 target of
              >₹8,000 crore GMV would imply roughly 63% of the full-year FY25 run-rate achieved by September 2025—a
              target consistent with Q1 FY26 momentum if March–June quarters sustain the October 2025 credit rate.
