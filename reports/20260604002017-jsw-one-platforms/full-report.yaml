      - number: '7.5'
        title: Operational, logistics, and technology risk
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms operates a physical fulfilment network of 14 stock points and 7 contract manufacturing
              locations across India, managed through JSW One Distribution and Logistics (JODL). This network enables
              just-in-time steel delivery and custom coil processing — a genuine operational differentiator — but also
              creates geographic and supply-chain concentration risk. A disruption to multiple stock points (weather,
              labor, logistics partner failure) during peak construction demand would directly impair delivery
              commitments and damage the repeat-order rate that currently stands above 70 percent. The payment
              infrastructure creates a distinct and arguably more acute operational risk: Deutsche Bank is identified in
              its own case study as the sole provider of the eCommerce nodal account, core-banking-system API
              integration, payment status APIs, and collections automation. No publicly disclosed backup payment partner
              or fallback settlement mechanism has been identified. A regulatory action against Deutsche Bank's Indian
              NBFC or banking operations, a technology outage, or a commercial renegotiation could halt all seller
              payouts with no stated contingency. The platform technology is a JavaScript-heavy single-page application
              built on a proprietary backend whose stack and cloud provider are not disclosed. No independent security
              certification — ISO 27001, SOC 2, or equivalent — has been publicly filed or referenced. The 485 employees
              recorded in the company registry creates execution concentration risk given the breadth of functions
              (marketplace, NBFC, logistics, private brands, homes). Platform GMV per employee is high, suggesting
              operational leverage, but also limited redundancy. Talent attrition in a competitive B2B tech and fintech
              market is a non-trivial risk for sustained execution.
