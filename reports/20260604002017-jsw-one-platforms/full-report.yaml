            body: >-
              The related-party triangle — JSW Steel as equity investor, primary steel supplier, and parent of the board
              chairman — is the most structurally complex governance risk in this chapter and is potentially
              thesis-breaking at IPO. SEBI's DRHP review will require a full related-party transaction schedule; if
              steel procurement is found to be materially mispriced relative to arm's length, restatement risk arises
              and the IPO timeline could be extended by 12–18 months. Investors should not treat the current valuation
