    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - FY25 audited net loss
        - '>₹350 crore (26%+ above FY24)'
        - Unit economics deteriorating faster than GMV growth; burn unsustainable at IPO scale
        - Immediate thesis review; downgrade to Avoid pending recapitalisation
      - - Pre-IPO round failure
        - Round not closed or priced below ₹7,500 crore
        - Valuation mark impaired; IPO window closes; investor confidence signal
        - Review full capital structure; assess secondary liquidity options
      - - Related-party terms
        - Disclosed JSW Steel supply terms not arm's-length
        - Margin quality misrepresented; regulatory risk ahead of DRHP
        - Avoid until third-party audit of related-party transactions
      - - NBFC credit quality
        - MSME NPA rate > 5% or AUM growth stalls below ₹300 Cr by FY27
        - Embedded credit thesis fails; NBFC becomes drag rather than revenue driver
        - Stress-test NBFC separately; conditional on regulatory clarity
    notes: >-
