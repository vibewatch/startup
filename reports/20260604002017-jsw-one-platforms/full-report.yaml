      - number: '7.3'
        title: NBFC regulatory and licensing risk
        blocks:
          - type: paragraph
            body: >-
              JSW One Finance Limited received its NBFC certificate of registration from the Reserve Bank of India in
              October 2024 under Section 45-IA of the RBI Act. The minimum Net Owned Fund threshold for registration is
              Rs 10 crore; JOFL's paid-up capital of Rs 294.78 crore as recorded in the company registry exceeds this
              comfortably. However, the regulatory risk is not at the registration threshold — it is in the operating
              requirements that govern credit quality, capital adequacy, and governance as JOFL scales. RBI's Scale
              Based Regulation framework classifies NBFCs into Base Layer (AUM below Rs 1,000 crore), Middle Layer
              (above Rs 1,000 crore), Upper Layer, and Top Layer. JOFL is firmly in Base Layer at its current AUM of
              approximately Rs 100 crore (October 2025), but management targets Rs 500 crore by end-FY26. If JOFL
              crosses the Rs 1,000 crore threshold within two to three years — a plausible trajectory given the Rs
              475–500 crore per month in co-lent partner disbursements — it would be re-classified as Middle Layer with
              stricter governance, capital requirements, and supervisory reporting obligations. Separately, RBI
              tightened NPA provisioning norms for all NBFCs in early 2025, raising the compliance burden on JOFL's
              underwriting function even while the loan book is still being built. No NPA rate or Stage 3 asset
              disclosure for JOFL has been published. The SEBI Act further governs primary market access, and any
              NBFC-related regulatory censure prior to the IPO filing would complicate the listing timeline. The
              enumeration of regulatory and legal risks below is assessed as partial coverage — additional enforcement
              data, court records, and regulatory correspondence are not available from public sources.
