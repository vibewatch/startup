        title: Competitive and market-cycle risk
        blocks:
          - type: paragraph
            body: >-
              Tracxn identifies 133 active competitors in the B2B steel and construction materials marketplace space in
              India as of the research date, including several with higher absolute GMV or more diversified supply
              chains. OfBusiness, Infra.Market, Moglix, and Zetwerk each exceed Rs 10,000 crore in GMV or revenue, match
              JSW One's scale, and have raised comparable or larger total capital. The conglomerate-backed sub-set —
              Tata Nexarc (Tata Group), Birla Pivot (Aditya Birla Group), and L&T Supply Chain Finance — replicates the
              JSW Group's structural advantage of manufacturing-group backing without the related-party complexity.
              Infra.Market has filed a confidential DRHP with SEBI for a Rs 5,000 crore IPO, signaling that the
              capital-markets competition is imminent and could tighten pre-IPO investor appetite for a second B2B
              construction-materials platform listing in the same window. JSW One's differentiation rests on
              steel-category depth, the JSW Steel supply relationship, and the integrated JOFL credit flywheel. The
              steel supply advantage is correlated with — and thus partially offset by — the related-party risk
              described above. Steel price volatility is the amplifying variable: domestic HRC prices fell approximately
              20 percent in CY2024 on weak demand and import pressure from China, and a second downturn would compress
              GMV at constant commission rates while simultaneously elevating credit risk in the JOFL book. JSW One's 82
              percent manufacturing and 18 percent construction revenue mix concentrates it in sectors that are both
              cyclically sensitive and under structural price pressure. The company has not publicly disclosed hedging
              strategies or procurement pricing protections that would buffer steel-cycle exposure.
