      - number: '7.4'
        title: MSME credit and financial model risk
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms' financial model is structurally dependent on credit facilitation: more than one-third
              of all orders utilize credit, and the monthly disbursement volume through partner co-lending arrangements
              reached Rs 475–500 crore at 60–90 day tenors. The JOFL own book is approximately Rs 100 crore. This
              creates three distinct financial risk vectors. The first is credit loss exposure: MSME borrowers in the
              construction and manufacturing sectors are cyclically sensitive, and a sharp steel demand downturn would
              simultaneously reduce new order flow and increase default rates on outstanding 60–90 day loans. No NPA
              rate or loss-given-default figure has been disclosed for JOFL's book or for the partner co-lending
              portfolio. The second is margin and take-rate compression: with GMV of Rs 12,567 crore and revenue of
              approximately Rs 3,976 crore in FY25, the implied take rate of about 31.6 percent appears high relative to
              conventional B2B marketplace norms and will face investor scrutiny at IPO. If the rate includes financed
              transactions where JOFL captures interest income, any tightening of credit spreads or partner terms would
              compress the blended figure. The third is capital adequacy for the IPO: the company previously raised at a
              $1 billion valuation in May 2024 and completed a Rs 575 crore round in 2025 without disclosing the new
              valuation, creating pricing opacity. The planned $350–400 million IPO and Rs 650–700 crore pre-IPO
              fundraise represent significant additional dilution that will require clean audited financials and
              resolution of the related-party accounting questions described above. TheCompanyCheck data showing a
              profit growth figure of −64 percent in an available fiscal year is consistent with an early-stage scaling
              trajectory but represents an adverse signal worth monitoring.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
