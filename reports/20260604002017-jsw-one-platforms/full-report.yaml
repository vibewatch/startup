      - number: '2.2'
        title: TAM/SAM/SOM Lenses and Boundary Variance
        blocks:
          - type: paragraph
            body: >
              A single TAM number would be misleading for JSW One because the public evidence spans at least three
              different denominators. First, the steel lens is concrete and current: worldsteel places India at 149.4 MT
              of crude steel production in 2024 and 140.5 MT of apparent steel use, while the National Steel Policy
              points to a much larger 2030-31 destination of 300 MT capacity and 255 MT crude steel demand/production.
              This lens matters because steel remains the most data-rich portion of JSW One’s procurement stack.


              Second, the broad construction lens is much larger but also much looser. Coherent Market Insights cites
              Invest India data that the Indian construction industry was expected to reach roughly US$1.4 trillion by
              2025, while IBEF cites a US$1.42 trillion construction market by 2027. Third, Birla Pivot uses a far
              narrower but operationally relevant framing: India’s B2B construction-commerce opportunity is over US$200
              billion and still only about 2% digitally penetrated. The right interpretation is not that one estimate is
              wrong and another is right, but that they describe different boundaries. JSW One’s current SOM is
              observable—₹12,567 crore FY25 GMV—but its true private-market SAM remains unresolved because public data
              does not cleanly strip out public procurement, export discovery, and non-core categories.
