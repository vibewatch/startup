              Tracxn records a $925 million post-money valuation versus the $1 billion public announcement; the October
              2025 round's valuation was not disclosed by the company (Mint noted this); and audited financial
              statements are not publicly available. These gaps create a 'private-undisclosed' profile that complicates
              independent valuation assessment ahead of an IPO.
