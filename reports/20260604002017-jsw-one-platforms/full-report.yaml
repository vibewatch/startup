      - number: '4.2'
        title: Revenue Model and Public Financial Traction
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms operates a principal procurement model rather than a pure marketplace. The company
              purchases construction materials at scale—primarily steel from JSW Steel and third-party mills, then
              cement, paint, and allied construction products—and resells them to MSME contractors and developers. This
              principal model records full sale proceeds as revenue, producing the approximately 31.6% revenue-to-GMV
              ratio observed in FY25 (₹3,976 crore revenue against ₹12,567 crore GMV). FY23 revenue was ₹338.8 crore;
              FY24 grew approximately 4.2x to ₹1,421.9 crore; and FY25 reached approximately ₹3,976 crore per Economic
              Times and ₹3,980 crore per Tracxn, representing approximately 2.8x YoY growth. As of June 2025 the company
              was generating approximately ₹1,400 crore in monthly GMV, suggesting an annualised FY26 pace comfortably
              above ₹16,000 crore. Steel products account for approximately 82% of FY25 revenue, with cement, paints,
              tiles, sanitary ware, wires, and other construction finishing materials contributing the remaining 18%.
              Private- label products and logistics services are publicly described as strategic priorities but remain
              nascent contributors in the disclosed figures. Credit facilitation is structurally embedded: approximately
              40% of GMV, or roughly ₹500 crore per month, is extended on deferred credit terms to MSME buyers through
              nine named partner lenders including ICICI, IndusInd, Yes Bank, Axis Bank, Standard Chartered, Kotak,
              IDBI, Mizuho, and TCL. The fee or referral income JSW One earns from those nine lenders is not publicly
              disclosed, leaving a meaningful revenue-quality and margin question open for the diligence.
