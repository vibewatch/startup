      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: JSW Group Distribution Moat Is Durable
            body: >-
              The 14 steel processing centres, JSW brand strength in steel and cement, and the decision to operate as a
              distribution principal rather than a thin-marketplace creates compounding advantages in procurement
              economics, logistics reliability, and MSME trust that pure-digital entrants cannot replicate without
              comparable capex.
            calloutType: strength
            claimRefs:
              - CV003
              - CV024
              - CV040
          - type: callout
            title: Related-Party Concentration Is the Single Largest Governance Risk
            body: >-
              JSW Steel's dual role as investor and primary steel supplier means JSW One's margin profile,
              working-capital terms, and supply reliability are all potentially negotiated with a counterparty that also
              holds equity. Without disclosed arm's-length benchmarks, investors cannot independently validate JSW One's
              reported take rates or cost structure.
            calloutType: risk
            claimRefs:
              - CV023
              - CV025
              - CV036
              - CV043
          - type: callout
            title: Track — Re-Enter After Audited FY25 Data and Pre-IPO Round Terms
            body: >-
              The strategic thesis is credible and the GMV trajectory is impressive, but the investment case lacks the
              financial transparency required for conviction at $1 billion. The optimal re-entry point is after FY25
              audited results confirm the break-even path and the pre-IPO ₹650–700 crore round closes, providing a fresh
              valuation anchor and validating investor demand at current or higher marks.
            calloutType: recommendation
            claimRefs:
              - CV011
