            title: Customer count framing risk
            body: >-
              The 500,000-plus MSME figure cited in May 2025 press releases represents the addressable or aspirational
              target, not the actual registered base. FY25 actuals show 84,000 registered MSMEs. Conflating these
              figures—as some press coverage does—significantly overstates current customer penetration.
