      - number: '4.4'
        title: Parent Financial Capacity and Group Backstop
        blocks:
          - type: paragraph
            body: >-
              JSW Steel Limited, the single largest investor in JSW One Platforms and the group's anchor entity, had a
              market capitalisation of approximately ₹321,064 crore as of 3 June 2026, with a trailing price-to-earnings
              ratio of 14.36x and a price-to-book of 3.79x. This scale provides a credible financial backstop: even a
              modest re-deployment of retained earnings or capital-market access at the JSW Steel level could absorb
              further JSW One rounds or an IPO delay without straining the parent. JSW Group formally stated at JSW
              One's founding a commitment to deploy up to ₹4,000 crore of capital by FY27. Cumulative equity of ₹1,120
              crore raised through October 2025 is approximately 28% of that commitment, leaving substantial headroom
              for pre-IPO bridge capital or a delay absorption scenario. The state-owned SBI's participation in the
              October 2025 extension at the same ₹8,575 crore valuation as the Series B is a meaningful institutional
              signal: a major public-sector bank co-invested alongside private-equity and strategic investors,
              validating the credit and business thesis for a regulated lending entity. The key risk is that JSW Steel's
              own shareholder interests as a JSW One investor conflict with JSW One's long-term goal of multi-supplier
              neutrality. If JSW One's procurement gradually concentrates on JSW Steel volumes, competitor sourcing
              credibility erodes, reducing the platform's value to buyers and long-term IPO attractiveness. The NSE
              listing of JSW Steel provides continuous liquidity and mark-to-market pricing as a proxy backstop health
              indicator for investors monitoring JSW One's pre-IPO trajectory.
