  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Digital Marketplace Architecture and Product Catalog
        blocks:
          - type: paragraph
            body: >-
              JSW One's primary product is jswonemsme.com, a B2B e-commerce platform serving manufacturing and
              construction MSMEs with annual turnover of ₹25 crore to ₹2,500 crore. The catalog spans mild steel,
              structural steel, thermomechanically treated (TMT) bars, and cement—with search functionality evidenced by
              SKU examples "TMT Fe500D," "JSW Steel HR Coil E250A," and "Cement OPC 43/53" visible in the site
              navigation. A platform-wide multi-brand philosophy means MSMEs can procure from JSW Steel alongside
              competitor brands including Tata Steel and ArcelorMittal Nippon Steel, with COO Mayank Gupta describing
              this as "a strategic and deliberate choice" to provide "choice, transparency, and reliability." Navigation
              also reveals two private-label sub-brands: JSW One TMT and One Helix Pipes & Tubes.


              The marketplace delivers several product-tech differentiators over traditional procurement: every steel
              delivery includes a mill test certificate documenting individual physical and chemical properties and
              tolerances, providing backward traceability from the MSME back through JODL's processing to the source
              mill. This removes the opacity that characterises the fragmented offline market—where MSMEs historically
              could not confirm grade or source for a commodity like steel. Platform traction is evidenced by over 70%
              repeat order share (pre-credit launch baseline per Moneycontrol), 84,000+ registered MSMEs, and 2 million
              tonnes of steel facilitated in FY25. A mobile app is referenced in the site footer ("Download our App"),
              though in-app ratings and session metrics are not publicly accessible via app store pages, which blocked
              automated retrieval. The JSW One MSME website is a JavaScript-heavy single-page application; individual
              product-category pages and blog posts do not render readable content via automated fetch, which limits
              independent verification of catalog depth and pricing transparency claims.
