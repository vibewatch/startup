  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              JSW One’s practical market is best defined as private-sector B2B procurement of industrial and
              construction materials for Indian MSMEs rather than as generic e-commerce. The company’s own positioning,
              together with contemporaneous reporting, centres on steel, cement, paints, plumbing, electrical, sanitary,
              and related project inputs purchased by manufacturing MSMEs, contractors, dealers, and small developers.
              That means the included spend is recurring materials procurement tied to ongoing building, fabrication,
              and project execution workflows, plus the immediately adjacent services that make those purchases
              executable—credit, verified logistics, order tracking, and financial reconciliation.


              Several large pools sit outside the chapter’s core boundary. Government procurement on GeM is an important
              benchmark for digital adoption, but it is governed by public-procurement rules and is not JSW One’s core
              private-market SAM. IndiaMART, Amazon Business, and ONDC are better read as horizontal substitutes or
              workflow alternatives: they can handle search, discovery, catalog, compliance, or interoperability, but
              they do not define the same steel-and-construction-specialist wedge. Birla Pivot’s description of a
              fragmented, largely unorganised construction-commerce landscape with only ~2% digital penetration is
              useful because it captures the incumbent status quo: offline dealer networks, opaque pricing, trust-based
              sourcing, and manual working-capital management remain the dominant alternatives JSW One is trying to
              displace.
            claimRefs:
