      - number: '6.5'
        title: Expansion Dynamics and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              JSW One's customer base is concentrated in two dimensions: product (steel-heavy catalog) and
              parent-company dependency (JSW Steel as the primary supplier and brand equity anchor). The 82%
              manufacturing MSME share creates exposure if auto-ancillary or fabrication demand softens in a steel cycle
              downturn. The multi-brand model—where Tata Steel, ArcelorMittal Nippon Steel, and other brands are listed
              alongside JSW Steel—is a deliberate design choice that builds buyer trust and reduces single-supplier risk
              perception, but any perceived preference for JSW Steel SKUs could erode the platform's independent
              positioning.

              Geographic expansion has progressed from a Maharashtra/South India base (FY21–22) to coverage of Gujarat,
              Rajasthan, Madhya Pradesh, Chhattisgarh, Delhi-NCR, and Andhra Pradesh by FY23. JSW One Homes operates 10
              experience centres across 9 cities with 6 more planned. The forward expansion case depends on replicating
              credit-enabled stickiness in tier-2 and tier-3 cities where MSME concentration is highest but digital
              procurement adoption is lowest. Forbes India reporting positions JSW as a group actively reshaping its
              consumer and MSME-facing businesses, consistent with the platform's land-and-expand strategy targeting
              500,000 MSMEs.

              Concentration risks worth monitoring include: the top-10% of buyers by GMV likely representing a
              disproportionate share of revenue (not disclosed), a single enterprise segment (manufacturing) driving 82%
              of buyers, JSW One's widening operating losses (₹113 crore net loss in FY24 per The Company Check)
              creating medium-term runway questions, and the yet-unproven ability to onboard the 416,000 remaining MSMEs
              needed to hit the 500,000-MSME target.
