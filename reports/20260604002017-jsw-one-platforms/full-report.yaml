      - number: '8.2'
        title: Financing Context, Valuation Marks, and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              JSW One has completed three external funding rounds totalling approximately $136 million (₹1,120 crore)
              over approximately 30 months, with each round sharply re-rating the valuation. The April 2023 Mitsui & Co.
              round of ₹205 crore ($25 million) valued the company at roughly ₹2,750 crore (~$300 million), a Series A.
              The May 2025 ₹340 crore round led by Principal Asset Management, OneUp, and JSW Steel lifted the valuation
              above $1 billion—a more-than-threefold jump in two years on the back of the 240% GMV surge. The October
              2025 ₹575 crore extension with SBI, International Conveyors, and Scarlett Ventures was executed at
              approximately ₹8,575 crore (~$1.02 billion), confirming the unicorn mark rather than up-rounding it; the
              round's primary purpose was to capitalise the NBFC arm and expand distribution.

              Tracxn's last-published valuation for JSW One MSME is $925 million, marginally below the announced $1
              billion—reflecting the difference between the partial May 2025 tranche and the full October extension—and
              total funding is logged at $91.6 million, consistent with the ₹1,120 crore aggregate when netting out the
              October final close.

              From an entry-discipline perspective, the current private mark of ~$1B (₹8,575 crore) implies: (a) ~0.68×
              FY25 GMV; (b) ~2.16× FY25 revenue of ₹3,976 crore; and (c) indeterminate EBITDA multiple given no
              disclosed EBITDA. Post-Series B, preference overhang is material: JSW Steel, Principal Asset Management,
              SBI, and Mitsui each hold liquidation preferences that could create waterfall effects at a
              lower-than-expected IPO valuation. The pre-IPO ₹650–700 crore private round planned for calendar 2026 is
              designed precisely to anchor a higher valuation benchmark before the $350–400 million public issue,
              suggesting the founders are managing the price-setting process actively.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV011
