      - number: '5.2'
        title: Embedded Finance, NBFC Orchestration, and Credit Stack
        blocks:
          - type: paragraph
            body: >-
              JSW One Finance Limited (JOFL) was launched in August 2024 as a 100% subsidiary NBFC to anchor the
              platform's credit vertical. The credit model is a blended orchestration design: JOPL as marketplace
              orchestrates credit through multiple partner banks and NBFCs using high-velocity transaction data and
              cash-flow-based underwriting, while JOFL itself operates as one lender within that stack. COO Gupta
              described this architecture to Deutsche Bank: "JOPL, as a marketplace, orchestrates credit through
              multiple partner non-bank financial companies and banks, using high-velocity customer transaction data
              coupled with cash flow-based underwriting to match customers with appropriate and customised credit
              solutions." JOFL's own loan book was approximately ₹100 crore as of October 2025, with a stated target to
              grow 5× to ₹500 crore by end of FY26 after the ₹575 crore raise.


              Credit penetration at the transaction level is approximately 33%: over one-third of orders avail credit,
              translating to ₹475-500 crore in 60-90 day inventory funding loans disbursed monthly per CEO Sachdeva
              (Mint, October 2025). The platform also facilitated ₹3,800 crore in aggregate credit through banking and
              NBFC partner channels in FY25. The payment and collections infrastructure was co-developed with Deutsche
              Bank: JOPL maintains an eCommerce special nodal account with Deutsche Bank, and an end-to-end API
              integration connects JSW One's Loan Management System (LMS) to Deutsche Bank's Core Banking System (CBS),
              enabling real-time straight-through processing (STP), automated ledger reconciliation on repayment
              confirmation, and email/SMS notifications to customers. This partnership was recognised with The Asset
              'Best Payments and Collection Solution, India' award. Material gaps include the identity of partner
              co-lending banks and NBFCs (not publicly disclosed), the RBI NBFC registration number for JOFL, and the
              LMS vendor/ architecture details.
