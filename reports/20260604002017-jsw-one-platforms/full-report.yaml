  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview and severity ranking
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a clear ordering of JSW One Platforms' risk stack as of June 2026. The first
              and highest-severity cluster is related-party and governance risk: JSW Steel is simultaneously the
              company's largest equity investor, its primary steel supplier, and the group whose chairman sits on the
              board. That tri-directional relationship creates conflict-of-interest exposure that is difficult to
              resolve without independent benchmarking and robust arm's-length governance, neither of which has been
              publicly demonstrated. The second cluster is NBFC regulatory risk: JSW One Finance Limited received its
              RBI certificate of registration in October 2024 and is now subject to Scale Based Regulation. RBI
              tightened NPA provisioning norms for NBFCs in early 2025, and any adverse regulatory action against JOFL
              would impair the credit flywheel that underpins roughly one-third of all platform orders. The third
              cluster is payment-infrastructure concentration: Deutsche Bank is identified as the sole nodal account and
              core-banking-system partner. A disruption to that relationship would halt seller payouts across the entire
              marketplace with no publicly disclosed fallback. The fourth cluster is steel-cycle and competitive risk:
              domestic HRC prices fell approximately 20 percent in CY2024, compressing GMV at a fixed commission
              structure, while 133 active competitors — including conglomerate-backed Infra.Market, OfBusiness, Tata
              Nexarc, and Birla Pivot — are targeting the same MSME steel-procurement segment. The fifth cluster is IPO
              readiness and disclosure risk: the company is targeting a $350–400 million IPO with a pre-listing
              fundraise, but significant disclosure gaps around related-party transaction pricing, JOFL credit quality,
              and management succession remain unresolved in any public source reviewed. Each cluster is expanded below;
              the mitigation and kill-criteria table summarises monitoring triggers.
