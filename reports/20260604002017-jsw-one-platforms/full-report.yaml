      - number: '2.5'
        title: Contradictions, Caveats, and Remaining Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              The chapter’s biggest unresolved issue is not whether the market is large; it is which part of that large
              market JSW One can economically win. Public construction-market estimates are boundary-sensitive and span
              from a narrow >US$200 billion B2B commerce slice to a broad US$1.4-1.42 trillion construction envelope.
              Those figures should therefore be used as bookends, not blended into a pseudo-precise TAM. Similarly,
              public-procurement success on GeM is informative but should not be mistaken for direct proof that private
              construction-material buyers will digitise at the same pace or with the same take-rate economics.


              Two diligence asks remain especially material. First, the public record still does not provide a clean
              private-market SAM that excludes government procurement, export discovery, and out-of-category spend while
              isolating steel and construction materials with enough granularity to compare against JSW One’s GMV.
              Second, current public evidence does not cleanly disclose the company’s buyer mix by contractor,
              manufacturer, dealer, and budget-owner role, nor the current official end-use split of Indian steel demand
              by sector. Those gaps do not negate the market thesis; they simply mean underwriting should rely on a
              range-based view of TAM/SAM and on cohort evidence from repeat financed procurement, not on one oversized
              headline market number.
