            title: 'Top diligence priority: Deutsche Bank sole payment-infrastructure concentration'
            body: >-
              The Deutsche Bank payment-infrastructure dependency is the single-highest-severity operational risk in
              this chapter. The platform has no publicly disclosed backup payment partner, no stated SLA for the nodal
              account, and no fallback settlement mechanism. A forced Deutsche Bank exit — due to regulatory action,
              commercial renegotiation, or technology failure — would halt all seller payouts across the marketplace
