      - - Infra.Market
        - Full construction lifecycle (structural, finishing, lifestyle materials)
        - Rs 18,472 cr FY25 revenue; ~$2.8B valuation; $804M raised (Series G)
        - Contractors, developers, retailers in construction and infrastructure
        - 283+ manufacturing facilities; house of brands (Shalimar Paints, RDC); B2R
