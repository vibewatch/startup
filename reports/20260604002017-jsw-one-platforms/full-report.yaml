      - number: '5.5'
        title: Technology Architecture, Differentiation, and Competitive Context
        blocks:
          - type: paragraph
            body: >-
              JSW One's CEO refers to the platform's strategic foundation as an "integrated tech-fin-stack" combining
              supply, credit, and digital intelligence. COO Gupta confirmed the platform architecture is designed for
              scalability, stating it is "open to evaluating international opportunities" despite current domestic
              focus. The ₹575 crore October 2025 fundraise was explicitly allocated to "accelerated investments in its
              proprietary technology platform" alongside distribution and NBFC expansion. From the Deutsche Bank case
              study—the most detailed technical disclosure available—the confirmed architecture components are: (a) a
              proprietary Loan Management System (LMS), (b) API integration to Deutsche Bank's CBS for STP payments, (c)
              Payment Status Check APIs and Collections APIs for real-time fund visibility, and (d) automated ledger
              sync on repayment. The backend cloud infrastructure, engineering team size, CI/CD practices, and
              third-party software stack are not disclosed in any public source.


              No public GitHub repository, open API, developer portal, or publicly accessible technical documentation
              exists for JSW One Platforms. The company does not have a measurable developer community signal (no GitHub
              stars, npm packages, or open-source contributions); the nearest available proxy is the Deutsche Bank
              integration partner case study and the company's technology-focused blog content on jswonemsme.com/blogs.
              Compared to peers, Birla Pivot (Aditya Birla Group) discloses a proprietary LLM-powered engine for
              unstructured input (PDF, WhatsApp, handwritten) processing and an intelligent Transport Management System
              (TMS); JSW One has not disclosed comparable AI/ML layer details. Tata DigECA reached ₹1,000 crore GMV with
              3,500+ MSME customers in FY26 on flat steel, far below JSW One's ₹12,567 crore GMV and 84,000+ MSME
              base—but DigECA is Tata Steel-backed and likely capital-efficient within steel verticals. Tata Nexarc
              offers a multi-lingual (English/Hindi) interface and Early Pay supply chain finance; JSW One's site is
              English-only per navigation, which may limit penetration in Hindi-belt MSME markets.
