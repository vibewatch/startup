      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The demand side has visible tailwinds. PMAY-U 2.0 alone targets assistance to one crore urban poor and
              middle-class families over five years, while government capex and infrastructure programs continue to
              support roads, rail, logistics, airports, and urban build-out. The MSME base is enormous, and both ONDC
              and GeM show that Indian procurement workflows are steadily becoming more digital, more interoperable, and
              more data driven. At the category level, JSW One, Tata nexarc, DigECA, Birla Pivot, IndiaMART, and Amazon
              Business all emphasise similar adoption levers: price visibility, trusted supply, GST/compliance workflow
              support, financing, and fulfilment reliability.


              The counterweights are equally important. 6WResearch and Coherent both highlight raw-material volatility,
              logistics bottlenecks, fragmented supplier bases, slow technology adoption, and sustainability pressure as
              structural constraints. Birla Pivot’s own 2% penetration claim suggests the private construction-material
              market is still early, which is opportunity and risk at once. Switching behaviour is also sticky: buyers
              may browse digitally while still closing orders through offline dealer relationships. Working-capital
              stress remains central, meaning that digitisation without credit does not solve the buyer’s core problem.
              Finally, horizontal platforms and open-network models can erode product-level differentiation if JSW One
              cannot preserve a superior combination of assortment depth, financing, reliability, and supplier-side
              execution.
