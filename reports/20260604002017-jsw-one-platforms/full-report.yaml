  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms primarily serves two MSME buyer segments: manufacturing and construction. Based on
              Livemint's October 2025 report citing CEO Gaurav Sachdeva, 82% of registered buyers are manufacturing
              MSMEs (fabricators, auto-ancillary units, engineering goods producers) and 18% are construction MSMEs
              (sub-contractors, small infrastructure firms). The platform deliberately targets enterprises with annual
              turnover between ₹25 crore and ₹2,500 crore—a "missing middle" tier too large for purely informal
              procurement but too small to have dedicated supply-chain teams or negotiate direct mill prices. Within
              manufacturing, steel products (HR coils, structural sections, TMT bars) dominate purchases; within
              construction, TMT and cement are the primary categories. JSW One MSME's product catalog—visible at
              jswonemsme.com/product-list—lists mild steel, structural steel, TMT, cement, and paints, confirming
              multi-category positioning. A separate B2C segment exists through JSW One Homes, which serves individual
              home-builders seeking turnkey construction services across South and Central India.

              Buyer pain points documented across multiple sources include: opaque offline pricing with no standard
              benchmarks, variable product quality without grade certification, fragmented supplier discovery forcing
              reliance on local dealers, limited working-capital credit available to small fabricators, and delivery
              delays due to poor logistics integration. JSW One addresses these through the digital catalog, mill test
              certificates per delivery, multi-brand SKU comparison, cash-flow-based NBFC credit, and its own
              distribution subsidiary (JODL). The Deutsche Bank case study confirms that "cash flow-based underwriting"
              using transaction data matches buyers with credit—an explicit acknowledgment that the platform creates
              stickiness by solving credit access alongside procurement friction.
