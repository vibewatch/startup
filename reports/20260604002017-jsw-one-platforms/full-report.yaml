  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Related-party governance and NBFC regulatory risk sit at the high-severity / medium-to-high-likelihood
      intersection. Payment infrastructure concentration is the highest-severity, lower-likelihood event. Steel-cycle
      and competitive risks are medium-severity but high-likelihood given the 2024 price environment. IPO disclosure
      risk is material if SEBI scrutiny of RPTs leads to restatement.
    data:
      columns:
        - Low likelihood
        - Medium likelihood
        - High likelihood
      rows:
        - label: Critical severity
          values:
            - label: Deutsche Bank exit without backup
              tone: risk
              detail: >-
                Single-vendor payment infrastructure; nodal account closure halts all seller settlements. Low
                probability given existing partnership, but no mitigation disclosed.
            - label: RBI enforcement on JOFL
              tone: risk
              detail: >-
                NBFC licence revocation or directed action against JOFL would halt the credit flywheel underpinning 33%+
                of orders. Rising NPA tide in a steel downturn could trigger.
            - label: SEBI blocks IPO on RPT restatement
              tone: risk
              detail: >-
                SEBI could require JSW One to restate financials if related-party steel procurement is found to be
                materially mispriced; this is the primary listing-risk scenario.
        - label: High severity
          values:
            - label: Tata Nexarc / Birla Pivot disrupts at scale
              tone: risk
              detail: >-
                Conglomerate-backed rivals replicate supply certainty without RPT complexity; probability increases as
                they build NBFC credit capability.
            - label: JOFL crosses Rs 1,000 Cr AUM — Middle Layer reclassification
              tone: risk
              detail: >-
                Faster-than-modelled NBFC scaling triggers stricter governance and capital requirements, compressing
                JOFL unit economics and delaying next fundraise.
            - label: Steel price decline compresses GMV 15–25%
              tone: risk
              detail: >-
                HRC already fell 20% in CY2024; a second wave compresses GMV at fixed commissions and elevates MSME
                credit stress simultaneously.
        - label: Medium severity
          values:
            - label: Platform engineering talent exodus
              tone: neutral
              detail: >-
                Proprietary backend with undisclosed stack; small team relative to functional scope. Manageable with
                competitive ESOP but information is not public.
            - label: Key-person departure — Gaurav Sachdeva exits before IPO
              tone: risk
              detail: >-
                CEO built credit, logistics, and marketplace strategy since 2022; IPO-phase departure would be highly
                disruptive to investment banker relationships and DRHP narrative.
            - label: Infra.Market IPO competes for same investor base
              tone: neutral
              detail: >-
                Infra.Market filed confidential DRHP; if it lists in the same window, investor appetite for a second B2B
                construction-materials platform IPO may be limited.
    claimRefs:
      - CR019
      - CR002
      - CR004
      - CR007
      - CR026
      - CR029
      - CR031
      - CR035
    approximationNotes: >-
      Likelihood and severity assessments are based on public-source evidence and qualitative reasoning; no quantitative
      probability model has been applied. Cells represent analyst judgment synthesising regulatory filings, press
      reports, and company disclosures reviewed to June 2026.
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      The primary risk transmission path starts with related-party conflict or regulatory action and flows through
      credit-flywheel impairment into GMV compression, then into valuation haircut and IPO delay. The Deutsche Bank
      single-vendor path is a more acute, lower-probability bypass that transmits directly to transaction halt and
      platform trust loss.
    data:
      nodes:
        - id: R1
          label: Related-party conflict surfaces (SEBI / audit)
          detail: SEBI DRHP review or auditor qualification reveals mispriced JSW Steel procurement; restatement required.
          tone: risk
        - id: R2
          label: RBI regulatory action on JOFL
          detail: NPA spike or governance breach triggers RBI directed action or licence conditions.
          tone: risk
        - id: R3
          label: Credit flywheel impaired
          detail: >-
            JOFL lending constrained; partner lenders pause co-lending; 33%+ of orders lose access to 60–90 day
            inventory finance.
          tone: risk
        - id: R4
          label: GMV compression
          detail: Orders requiring credit decline; steel-price downturn compounds volume loss.
          tone: risk
        - id: R5
          label: Revenue and take-rate compression
          detail: Lower GMV reduces revenue; fixed operating costs create margin squeeze.
          tone: risk
