      - number: '7.7'
        title: IPO readiness and disclosure risk
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms is targeting a $350–400 million IPO — approximately Rs 3,700 crore — with preliminary
              investment banker discussions as reported by Outlook Business, and a pre-IPO fundraise of Rs 650–700
              crore. The SEBI DRHP review process typically takes 30–75 days, and the disclosure requirements are
              extensive: all related-party transactions, management remuneration, material litigation, risk factors, and
              audited consolidated financials must be included. Several of the disclosure obligations intersect directly
              with the chapter's most significant open questions. First, the related-party steel procurement schedule
              will require JSW Steel pricing terms to be disclosed and audited; any non-market pricing found at that
              stage could require restatement. Second, JOFL's loan book — NPA rates, provisioning methodology, and
              credit policy — will be audited and disclosed as a material subsidiary. Third, board composition will
              require SEBI-compliant independent director representation; the current public record of three named
              directors with family-group chairman suggests structural changes may be needed. Fourth, no external credit
              rating on JOFL's NBFC book has been identified; SEBI may require one as part of the prospectus disclosure
              for an NBFC subsidiary. Management has publicly stated targets of Rs 500 crore JOFL AUM and IPO filing by
              end-FY26 or FY27; failure to meet either would signal execution shortfall. An investor should treat the
              IPO as a milestone-based thesis-break trigger rather than a near-certain liquidity event, and should
              monitor SEBI DRHP filing, audited FY26 financials, and independent-director appointment as leading
              indicators of IPO readiness.
