      - number: '1.4'
        title: Scale, Operational Metrics, and Product Stack
        blocks:
          - type: paragraph
            body: >-
              FY25 was the platform's breakout year by reported operational metrics. JSW One recorded ₹12,567 crore GMV,
              representing approximately 2.4x year-on-year growth and making it, by its own claim, India's largest
              steel-selling platform. It facilitated approximately 2 million tonnes of steel purchases and reported FY25
              revenue of ₹3,976 crore. Both Hindu Business Line and ET Manufacturing independently confirmed the ₹12,567
              crore GMV figure via separate May 2025 articles, lending medium-high confidence to this metric; however,
              audited FY25 financial statements have not been publicly released.


              The registered MSME user base reached 84,000-plus as of FY25, up from approximately 58,000 reported in Q1
              FY25 context. Company communications and the May 2025 unicorn press release cite a target/addressable base
              of 500,000-plus building and manufacturing MSMEs; these are aspirational targets, not current active
              customers, and conflating the two figures would overstate reach. The Deutsche Bank case study cites over
              86,000 MSMEs, consistent with the 84,000+ FY25 figure (the difference likely reflects timing).


              Over one-third of platform orders use embedded credit; approximately ₹475–500 crore in 60-90 day inventory
              loans are disbursed monthly through partner banks and NBFCs (ICICI Bank, IndusInd Bank, Yes Bank, Axis
              Bank, Standard Chartered Bank, TCL, Kotak Mahindra Bank, IDBI Bank, Mizuho) plus the in-house JSW One
              Finance arm. FY25 total credit disbursement through the platform reached ₹3,800 crore. Approximately 82%
              of e-commerce business comes from manufacturing and 18% from construction. Mint confirmed a GMV target of
              ₹8,000-plus crore for H1 FY26 (50% growth over prior year). Financial Express (citing Tracxn data)
              reported FY24 revenue of ₹1,421.9 crore and a net loss of ₹227 crore, compared to a ₹1.3 crore profit in
              FY20—a widening loss trajectory that reflects aggressive reinvestment but raises questions about the path
              to breakeven.
