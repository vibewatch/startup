            title: JSW Group captive inventory as structural moat
            body: >-
              JOPL's single largest advantage is direct access to JSW Group's steel, cement, and paints production,
              which underpins supply reliability, pricing predictability, and backward traceability that
              commodity-neutral B2B marketplaces cannot match without equivalent manufacturing scale.
