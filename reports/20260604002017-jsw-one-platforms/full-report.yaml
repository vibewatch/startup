      - number: '6.4'
        title: Retention, Repeat Usage, and Satisfaction
        blocks:
          - type: paragraph
            body: >-
              The clearest retention signal available in public sources is the 70%+ repeat order share reported by
              Moneycontrol (when the registered user base was approximately 58,000, likely early FY25) and corroborated
              by the Deutsche Bank case study which highlights "high repeat sales" as a platform characteristic. This
              metric is order-level—meaning 70%+ of transaction volume comes from buyers who have previously
              ordered—rather than a cohort retention rate tracking whether a FY23 cohort is still active in FY25. No
              GRR, NRR, or churn rate is publicly disclosed for the B2B marketplace, which is expected for a pre-IPO
              private company but limits rigorous durability assessment.

              Credit penetration is an important retention driver: approximately 33% of orders use JSW One's facilitated
              credit products (inventory-backed 60–90 day loans). Buyers who take credit are likely stickier because
              switching platforms would require re-establishing creditworthiness with a new lender. ₹475–500 crore
              monthly credit disbursement as of October 2025 represents a significant and growing financial tie-in for
              the customer base. For JSW One Homes, NPS +81 is a strong satisfaction metric that exceeds the
              construction industry average, with 180+ homes delivered and 227+ under construction as supporting
              evidence of ongoing engagement.

              The absence of publicly disclosed cohort data (e.g., what fraction of FY23 registrations placed an order
              in FY25) remains a key diligence gap. The 70%+ repeat metric was cited before the credit product reached
              scale; whether credit expansion has increased or decreased repeat rates post-FY24 is unresolved.
            claimRefs:
