companyProfile:
  summary: >-
    JSW One Platforms Limited is the JSW Group's digital industrial-commerce venture, legally incorporated in Mumbai in
    2018 and commercially launched across 2021 according to conflicting public sources. The platform combines a
    principal-led B2B materials marketplace, distribution and fulfilment operations, private brands such as JSW One TMT,
    and JSW One Finance's purchase- and working-capital products for MSMEs. Public disclosures show three operating
    pillars — marketplace, distribution, and private brands — plus the wholly owned NBFC arm JOFL launched in 2024.
    After a ₹205 crore Mitsui round in 2023, a ₹340 crore unicorn round in May 2025, and a ₹575 crore extension in
    October 2025, JSW One reached roughly ₹1,120 crore of disclosed equity capital and a latest implied valuation near
    $1.0-1.02 billion. FY25 GMV reached ₹12,567 crore and registered MSME customers exceeded 84,000, but FY25 audited
    statements remain unavailable and the exact pace of profitability improvement is not externally verified.
