      - number: '3.4'
        title: Moat, Switching Cost, and Likely Battle Lines
        blocks:
          - type: paragraph
            body: >-
              JSW One's most defensible moat is the one it did not build: JSW Group's position as one of India's largest
              steel and cement producers. The Deutsche Bank case study quotes CEO Gaurav Sachdeva describing JSW One as
              drawing on "JSW Group's manufacturing and supply strengths in steel and cement" to deliver supply
              certainty and cost advantages unavailable to independent platforms. This parent-backed supply reliability
              is a genuine differentiator—OfBusiness and Moglix must approximate it through procurement volume and
              manufacturing investment, while Infra.Market builds it through owned manufacturing facilities. Only Birla
              Pivot and Tata nexarc have comparable conglomerate supply advantages, but in different commodity profiles.

              The integrated credit moat is real but immature. JSW One Finance Limited (JOFL) launched only in August
              2024, roughly nine years after OfBusiness's Oxyzo and several years after Moglix's Credlix. Oxyzo is
              profitable (Rs 375 crore net profit FY26) and expanding into capital markets; Credlix has formalised its
              NBFC status via the Vanik acquisition. JOFL has no public AUM or NPA data yet. This is the highest-stakes
              gap: credit is the primary margin-expansion and retention lever in B2B procurement, and JSW One is behind
              its two largest direct peers on the maturity curve. The JSW One About page describes JSW One MSME as "a
              consistent, flexible, and trusted steel solution partner," emphasising reliability rather than credit as
              the primary value proposition.

              Switching costs are moderate for JSW One's current buyers. MSMEs that have integrated JSW One's digital
              ordering, payment tracking, and credit workflows face meaningful migration friction, particularly if JOFL
              co-lending relationships are embedded in their working capital structure. However, the platform's
              86,000-plus registered MSME base (compared to OfBusiness's 2 million-plus SMEs) means network-effect
              lock-in is not yet material. Private-brand buyers (JSW One TMT, JSW One Concrete) have the highest
              switching cost because the branded product relationship creates a separate loyalty loop.

              Multi-homing is currently easy for MSMEs that use JSW One for steel but OfBusiness for other raw
              materials. JSW One's category breadth (steel, cement, paints) is narrower than OfBusiness's seven-plus
              supply chains, so buyers who source multiple commodity types are likely already multi-homing. The battle
              line therefore runs on category expansion: if JSW One expands into aluminium, polymers, chemicals, or
              agriculture procurement (as OfBusiness has), multi-homing reduces; if JSW One stays steel-and-construction
              vertical, buyers will keep using OfBusiness for everything else.

              The IPO cohort dynamic adds urgency. All four major peers are preparing or exploring IPOs. Pre-IPO periods
              typically drive aggressive GMV growth, customer acquisition spending, and platform deepening—any of which
              can reconfigure market share. JSW One's planned pre-IPO fundraise of Rs 650-700 crore and $350–$400
              million IPO signals it is on a similar timeline, but it enters that race with the smallest absolute GMV
              base among the unicorn cohort. The operational break-even target by FY26 end is the key internal gate: if
              it slips, the IPO valuation story is harder to tell against peers with demonstrated profitability.
