  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Funding History and Round Chronology
        blocks:
          - type: paragraph
            body: >-
              JSW One Platforms has executed three disclosed equity rounds since April 2023, raising a cumulative ₹1,120
              crore. The Series A in April 2023 brought ₹205 crore from Mitsui & Co. at an implied valuation of
              approximately ₹2,750 crore (₹2,705 crore per VCCircle), marking Japan's Mitsui as the first major external
              institutional backer of JSW Group's B2B construction-materials digitisation thesis. Two years later, in
              May 2025, a ₹340 crore Series B led by Principal Asset Management, with OneUp Fintech and JSW Steel as
              co-investors, pushed the valuation to approximately ₹8,575 crore and delivered unicorn status at a $1
              billion implied value. Within five months, in October 2025, a ₹575 crore Series B extension from SBI (the
              state-owned lender), alongside the existing Series B investors plus ICL, Scarlett Wealth, and JSW Steel,
              brought the cumulative raise to ₹1,120 crore while maintaining the ₹8,575 crore valuation cap. The
              participation of JSW Steel across multiple rounds is notable in two respects: it anchors the credit
              quality of the entity financially, and it introduces a structural tension should JSW One ever need to
              demonstrate multi-supplier neutrality or source competitively from rival steel mills. As of May 2026, the
              company was reported to be in pre-IPO discussions targeting a ₹650-700 crore bridging round before a
              public debut. The MCA registry records authorised share capital at ₹500 crore and paid-up capital at
              ₹294.78 crore, reflecting share issuances completed before the October 2025 extension round. Total
              external equity of ₹1,120 crore remains well below the JSW Group's original ₹4,000 crore investment
              commitment declared at JSW One's founding, indicating that the group has deployed capital gradually and
              calibrated to milestones rather than front-loading.
