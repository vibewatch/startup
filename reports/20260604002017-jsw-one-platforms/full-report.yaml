      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The clearest publicly supported segmentation is by workflow rather than by industry label alone. On JSW
              One, manufacturing MSMEs account for the majority of e-commerce activity and construction buyers are the
              smaller but still material cohort, implying that the platform often wins where procurement is repetitive,
              specification-sensitive, and financing-constrained. In practice the buyer may be an owner-manager, plant
              head, procurement executive, contractor, or dealer; the user may be a factory, project site, or
              distribution outlet; and the payer is usually the business itself, increasingly supported by
              short-duration inventory finance. Public sources establish the broad personas, but not a precise order mix
              by contractor, dealer, and manufacturer, which remains a diligence gap.


              The adjacent benchmark set clarifies the adoption path. IndiaMART and Amazon Business show how procurement
              teams value discovery, GST compliance, approvals, analytics, and reach. GeM shows that digital procurement
              can scale rapidly when policy, search, and transaction friction fall. ONDC and Deloitte’s ONDC analysis
              suggest interoperability and embedded services may lower customer-acquisition and transaction costs over
              time. For JSW One specifically, FY25 evidence points to a buyer journey that starts with quote discovery
              and trusted supply, then deepens through credit, logistics assurance, and repeat replenishment. That is
              why registered-user count alone is not enough; the real signal is whether financed repeat procurement
              becomes the default motion for the buyer account.
