- id: milestones-risks-gaps
  title: Milestone Record, Adverse Signals, and Open Diligence Gaps
  body: "The dated public record supports a company with a clear milestones arc: legal\
    \ incorporation in 2018, a soft launch in 2021, first institutional investment\
    \ (Mitsui) in April 2023, unicorn status (May 2025), and an SBI-backed extension\
    \ close (October 2025). The Deutsche Bank payment infrastructure partnership won\
    \ an award from The Asset and represents the strongest independently verified commercial\
    \ partnership on record.\n\nThe primary adverse financial signal is the widening\
    \ net loss trajectory—from a ₹1.3 crore profit in FY20 to a ₹227 crore loss in\
    \ FY24—despite compound-annual GMV growth exceeding 290% over the same period.\
    \ The company targets profitability by FY27 (ET Mitsui 2023) or FY27-28 (Deutsche\
    \ Bank / Mint 2025), creating a minor timeline conflict; in either case the runway\
    \ depends on continued high GMV growth and NBFC scale-up. The valuation conflict\
    \ between Tracxn's $925 million and the public $1 billion announcement, and the\
    \ undisclosed October 2025 round valuation, represent governance transparency gaps\
    \ for potential investors.\n\nIPO preparation is now publicly stated: Sachdeva\
    \ confirmed 'we intend to list the company within 18 to 24 months' (from approximately\
    \ October 2025 context), while Mint reported a FY28 target. As of the June 2026\
    \ run date, no DRHP (Draft Red Herring Prospectus) or S-1 equivalent has been\
    \ publicly filed, which is consistent with the stated timeline but means IPO metrics\
    \ (order book, price band) remain unavailable. The company's NBFC (JSW One Finance)\
    \ was launched in August 2024 and must navigate RBI regulatory requirements; no\
    \ adverse regulatory findings are on record, but the absence of published NBFC\
    \ compliance disclosures is a minor gap."
