- id: funding-valuation-capital
  title: Funding History, Investor Base, and Valuation Conflicts
  body: "JSW One Platforms has completed three publicly announced equity rounds totalling\
    \ approximately ₹1,120 crore. The first institutional round in April 2023 saw Mitsui\
    \ & Co. (Japan) invest ₹205 crore in a Series A at a valuation of ₹2,750 crore\
    \ (approximately $330 million); this round was confirmed by Economic Times, Inc42,\
    \ and Business Standard. JSW Group separately committed to invest up to ₹4,000\
    \ crore in the platform by FY27.\n\nIn May 2025, Principal Asset Management led\
    \ a ₹340 crore round alongside OneUp and JSW Steel, raising the company's valuation\
    \ to $1 billion and awarding it unicorn status—a more than three-fold jump in valuation\
    \ from the 2023 round. This was corroborated by ET BFSI, Financial Express, and\
    \ the JSW Group's own press release. An October 2025 extension of the same round\
    \ closed at ₹575 crore total from SBI, Principal Asset Management, OneUp, International\
    \ Conveyors Ltd, Scarlett Ventures, and JSW Steel. Mint reported the October close\
    \ did not publicly disclose valuation, while Economic Times cited an implied valuation\
    \ of approximately ₹8,575 crore—a disclosure gap that is flagged as material.\n\
    \nA notable tracker conflict exists: Tracxn records JSW One's post-money valuation\
    \ at $925 million (below the $1 billion public announcement), while also attributing\
    \ an earlier founding year of 2020. This $75 million gap may reflect different\
    \ fully diluted versus headline valuation conventions, or a stale data point; it\
    \ has not been publicly reconciled. The VCCircle article covering the 2023 Mitsui\
    \ round now returns a 404 error, removing one independent corroboration source\
    \ from the record. The NBFC arm (JSW One Finance) had an AUM of approximately\
    \ ₹100 crore as of October 2025, well below its ₹500 crore year-end target, and\
    \ about half the October 2025 round capital is designated for JOFL capitalization."
