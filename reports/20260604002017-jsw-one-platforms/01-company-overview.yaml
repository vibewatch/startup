callouts:
- calloutType: strength
  title: JSW Group captive inventory as structural moat
  body: "JOPL's single largest advantage is direct access to JSW Group's steel, cement,\
    \ and paints production, which underpins supply reliability, pricing predictability,\
    \ and backward traceability that commodity-neutral B2B marketplaces cannot match\
    \ without equivalent manufacturing scale."
  claimRefs:
  - CO001
  - CO036
  - CO008
- calloutType: risk
  title: Widening net losses and unaudited FY25 financials
  body: "Financial Express (citing Tracxn data) reports a loss of ₹227 crore in FY24\
    \ versus a ₹1.3 crore profit in FY20. No audited FY25 P&L has been released. The\
    \ profitability timeline has shifted from FY27 to FY27-28 across sources, and\
    \ the NBFC arm's ₹100 crore AUM is well below its ₹500 crore year-end target."
  claimRefs:
  - CO032
  - CO033
  - CO044
- calloutType: risk
  title: Valuation and disclosure gaps
  body: "Tracxn records a $925 million post-money valuation versus the $1 billion public\
    \ announcement; the October 2025 round's valuation was not disclosed by the company\
    \ (Mint noted this); and audited financial statements are not publicly available.\
    \ These gaps create a 'private-undisclosed' profile that complicates independent\
    \ valuation assessment ahead of an IPO."
  claimRefs:
  - CO022
  - CO025
- calloutType: insight
  title: Customer count framing risk
  body: "The 500,000-plus MSME figure cited in May 2025 press releases represents the\
    \ addressable or aspirational target, not the actual registered base. FY25 actuals\
    \ show 84,000 registered MSMEs. Conflating these figures—as some press coverage\
    \ does—significantly overstates current customer penetration."
  claimRefs:
  - CO042
  - CO028
