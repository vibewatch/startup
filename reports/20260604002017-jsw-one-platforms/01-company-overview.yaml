company:
  name: JSW One Platforms
chapter:
  number: 1
  title: Company Overview
  summary: JSW One Platforms Limited (JOPL) is a tech-first B2B e-commerce marketplace incorporated in Mumbai in September 2018 and commercially launched in 2021 to serve India's construction and manufacturing MSMEs with procurement, credit, logistics, and private-brand products. Backed by JSW Group and reaching unicorn status ($1 billion valuation) in May 2025 on a ₹340 crore round, the platform recorded ₹12,567 crore GMV in FY25 with 84,000-plus registered MSMEs. An October 2025 ₹575 crore extension (totalling ₹1,120 crore raised) brought SBI as a strategic partner; key open items are audited FY25 financials, the undisclosed October valuation, widening losses, and IPO readiness by FY28.
sections:
- id: identity-legal-corporate
  title: Identity, Legal Entity, Product Scope, and Corporate Structure
  body: "JSW One Platforms Limited (JOPL) is a B2B technology-enabled e-commerce marketplace\
    \ incorporated on 20 September 2018 in Mumbai, Maharashtra under CIN U51100MH2018PLC314290.\
    \ The company was formerly registered as JSW Retail Limited and then JSW One Platform\
    \ Limited before adopting its current name. It is classified as an active, unlisted\
    \ public limited company registered with ROC Mumbai, with authorized capital of\
    \ ₹500 crore and paid-up capital of ₹294.78 crore as of its last filing.\n\nThe\
    \ platform commercially launched in 2021—sources cite January 2021 (Economic Times),\
    \ April 2021 (Deutsche Bank case study), and July 2021 (Business Standard) as the\
    \ start date, creating an unresolved conflict addressed in the evidence gaps. JOPL\
    \ operates primarily through the website jswonemsme.com, selling steel, cement,\
    \ paints, and construction materials to manufacturing and construction MSMEs with\
    \ annual turnover ranging from ₹25 crore to ₹2,500 crore.\n\nJOPL has three main\
    \ operating entities: the parent marketplace (JOPL), JSW One Distribution Limited\
    \ (JODL) which manages procurement, warehousing, material processing and contract\
    \ manufacturing, and JSW One Finance Limited (JOFL) launched in August 2024 as\
    \ a 100%-owned NBFC providing purchase finance, vendor finance, and working capital\
    \ loans. Three integrated business verticals—Marketplace, Distribution, and Private\
    \ Brands—are supported by 14 stock points and approximately 7 contract manufacturing\
    \ locations. The private brand JSW One TMT was launched in December 2023 targeting\
    \ North and Central India. JSW One Homes provides a separate B2C turnkey home construction\
    \ service through jswonehomes.com. As of the latest company registry data, the\
    \ entity employs 485 professionals."
