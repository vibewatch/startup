  approximationNotes: >-
    Dependency edges are inferred from Deutsche Bank case study, official press releases, and RBI
    registry data. Contractual flow (vs commercial relationship) is not publicly disclosed for most
    edges. The dependency map is intentionally simplified to highlight critical-path nodes.

callouts:
- calloutType: risk
  title: 'Top diligence priority: Deutsche Bank sole payment-infrastructure concentration'
  body: >-
    The Deutsche Bank payment-infrastructure dependency is the single-highest-severity operational risk
    in this chapter. The platform has no publicly disclosed backup payment partner, no stated SLA for
    the nodal account, and no fallback settlement mechanism. A forced Deutsche Bank exit — due to
    regulatory action, commercial renegotiation, or technology failure — would halt all seller payouts
    across the marketplace with immediate GMV and trust consequences. Investors should treat resolution
    of this single-vendor concentration as a mandatory pre-commitment diligence item.
  claimRefs:
  - CR019
  - CR022

- calloutType: risk
  title: 'Governance risk: the related-party triangle is a potential IPO-block'
  body: >-
    The related-party triangle — JSW Steel as equity investor, primary steel supplier, and parent of
    the board chairman — is the most structurally complex governance risk in this chapter and is
    potentially thesis-breaking at IPO. SEBI's DRHP review will require a full related-party
    transaction schedule; if steel procurement is found to be materially mispriced relative to arm's
    length, restatement risk arises and the IPO timeline could be extended by 12–18 months. Investors
    should not treat the current valuation as stable without independent RPT pricing verification.
  claimRefs:
  - CR007
  - CR009
  - CR033

- calloutType: recommendation
  title: 'Thesis-break monitoring: three binary triggers to watch'
  body: >-
    Thesis-break monitoring should track three binary triggers: (1) SEBI issues an observation letter
    on the DRHP requiring RPT restatement — treat as a hold signal pending resolution; (2) Deutsche
    Bank exits or an outage exceeding 48 hours occurs without a confirmed backup partner — treat as
    a hard exit signal; (3) JOFL receives adverse RBI communication or directed action on NBFC
    operations — treat as a credit-flywheel impairment signal requiring valuation revision. All three
    are monitorable from public regulatory announcements and do not require private information.
  claimRefs:
  - CR037
  - CR032
  - CR004

