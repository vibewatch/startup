  evidenceGaps:
  - type: missing-source
    severity: material
    topic: nbfc-credit-quality
    missingEvidence: >-
      NPA rate, Stage 3 asset ratio, credit loss rate, and underwriting policy for JOFL's loan book and the Rs 3,800 crore co-lending portfolio.
    whyItMatters: >-
      Credit quality of the NBFC book is a direct determinant of the credit-flywheel's sustainability; investors cannot size the risk without it.
    diligencePath: >-
      Request audited JOFL financials, portfolio cohort performance, and NPA calculation methodology from management.
    relatedQuestionRefs:
    - QR011
    - QR028

  - type: private-evidence-only
    severity: material
    topic: related-party-pricing
    missingEvidence: >-
      Independent benchmarking or auditor-certified comparison of JSW One's steel procurement pricing from JSW Steel against spot-market and third-party broker quotes.
    whyItMatters: >-
      If steel is procured at above-market rates from JSW Steel, the effective subsidy transfers group profit at the cost of JOPL and requires SEBI disclosure at IPO.
    diligencePath: >-
      Request the related-party transaction schedule prepared for the FY25 statutory audit and compare unit pricing to NSE/MCX spot references.

  - type: enumeration-incomplete
    severity: minor
    topic: regulatory-risk-enumeration
    missingEvidence: >-
      Environmental, labour, GST dispute, court-record, and regulatory correspondence data for JOPL and all subsidiaries.
    whyItMatters: >-
      The regulatory risk register in this chapter covers only NBFC, SEBI, and MCA obligations; it cannot be treated as a complete legal risk audit.
    diligencePath: >-
      Commission a comprehensive legal due diligence covering all JOPL subsidiaries, court records, and pending regulatory correspondence.
    relatedTableRefs:
    - TR001

  - type: private-evidence-only
    severity: material
    topic: payment-infrastructure-dependency
    missingEvidence: >-
      Commercial terms of the Deutsche Bank partnership: uptime SLAs, termination notice periods, indemnity provisions, and any exclusivity clause.
    whyItMatters: >-
      Without contract terms, the actual severity of the single-vendor concentration risk cannot be precisely quantified; the fallback plan is unknown.
    diligencePath: >-
      Request the Deutsche Bank master service agreement and any fallback payment provider shortlist or contingency protocol.
    relatedQuestionRefs:
    - QR007
    - QR016

  - type: stale
    severity: minor
    topic: ipo-disclosure
    missingEvidence: >-
      SEBI DRHP filing for JSW One Platforms; audited FY26 consolidated financial statements including JOFL as a material subsidiary.
    whyItMatters: >-
      IPO timeline and pre-IPO valuation are based on press reports from 2026 and may change materially; the DRHP is the definitive disclosure record.
    diligencePath: >-
      Monitor SEBI public DRHP announcement; set alert for JOPL DRHP filing in SEBI's EFTS portal.

  - type: missing-source
    severity: minor
    topic: burn-rate-runway
    missingEvidence: >-
      JSW One Platforms' net cash position, quarterly operating burn rate, and funding runway as of June 2026.
    whyItMatters: >-
      Capital adequacy for the IPO preparation cycle and JOFL scaling cannot be assessed without FY26 management accounts.
    diligencePath: >-
      Request management accounts, board pack, and 18-month cash flow forecast from the CFO.
    relatedQuestionRefs:
    - QR019

tables:
- id: TR001
  title: Regulatory / legal risk register
  enumerationScope:
    coverage: partial
    basis: >-
      Covers NBFC licensing, RBI NPA provisioning, SEBI IPO disclosure, MCA corporate-compliance,
      and goods-and-services tax obligations as identifiable from public regulatory sources reviewed
      between October 2024 and June 2026; environmental, labor, and litigation risks are excluded
      owing to absence of public records.
  columns:
  - rule / licence / case
  - jurisdiction
  - status
  - likelihood
  - severity
  - mitigation
  - residual exposure
  - diligence path
  rows:
  - - NBFC Certificate of Registration (Section 45-IA RBI Act)
    - India — RBI
    - Active; JOFL registered Oct 2024
    - Low (registration current)
    - High if revoked
    - Maintain NOF, capital adequacy, and annual RBI returns filing
    - Revocation scenario is low-probability but catastrophic for credit flywheel
    - Verify COF number in RBI NBFC registry; confirm last statutory return filed
  - - RBI Scale Based Regulation — Middle Layer threshold (Rs 1,000 Cr AUM)
    - India — RBI
    - Pending; JOFL AUM ~Rs 100 Cr; target Rs 500 Cr FY26
    - Medium (AUM could cross threshold within 2–4 years at plan growth)
    - High (triggers stricter governance and capital requirements)
    - Monitor AUM trajectory; pre-plan governance upgrade before crossing threshold
    - Management's own scaling targets could accelerate reclassification timeline
    - Request JOFL 5-year AUM forecast and capital adequacy plan from management
  - - RBI NPA Provisioning Circular (January 2025)
    - India — RBI
    - Effective; applies to all NBFCs including Base Layer
    - High (already in force)
    - Medium (increases Stage 3 provisioning cost)
    - JOFL must provision per new norms from inception; early compliance expected
    - Compressed NBFC unit economics if MSME default rates rise in a steel downturn
    - Confirm JOFL's provisioning policy and Stage 3 asset ratio via management diligence
  - - SEBI IPO Disclosure Obligations (SEBI Act 1992, ICDR Regulations)
    - India — SEBI
    - Applicable at time of DRHP filing; not yet filed
    - High (IPO is management target by FY27)
    - High (related-party, NBFC audit, and board-independence disclosures required)
    - Engage SEBI-experienced law firm; pre-clean related-party transaction register
    - Any restatement of related-party pricing found at DRHP stage delays listing
    - Request draft related-party transaction schedule and SEBI compliance readiness assessment
  - - MCA Companies Act 2013 — Related-Party Transaction Compliance
    - India — MCA
    - Ongoing; annual RPT disclosure required in board report
    - Medium (JSW Steel RPT scope is large)
    - Medium (non-arm's-length pricing could trigger shareholder challenge)
    - Board audit committee approval of all RPTs; independent director sign-off
    - No independent pricing benchmark has been publicly disclosed for JSW Steel RPTs
    - Request RPT register and audit committee minutes from management
  - - GST Compliance for Cross-State Steel Logistics
    - India — GST Council / CBIC
    - Ongoing; applicable to JODL fulfilment across 14 stock points
    - Medium (logistics-intensive model; multi-state operations)
    - Low (GST compliance is routine for large platforms)
    - Dedicated GST team standard for platforms of this scale
    - No GST disputes identified in public record; compliance assumed routine
    - Confirm GST audit status and pending notices via management letter
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR032
  - CR033
  notes: >-
    Status and likelihood assessments based on public regulatory sources (RBI, SEBI), company registry
    (TheCompanyCheck), and press reports. Enforcement and litigation records not available from public
    sources; this table is explicitly partial coverage.

- id: TR002
  title: Operational / quality / security risk register
  columns:
  - failure mode
  - likelihood
  - severity
  - mitigation maturity
  - residual exposure
  - unresolved gap
  rows:
  - - Deutsche Bank sole payment infrastructure failure (nodal account down, seller payouts halted)
    - Low (but not disclosed SLA; no known outage history)
    - Critical (all marketplace transactions halt)
    - Low (no backup disclosed)
    - High; single point of failure with no stated fallback
    - No public backup payment partner or contingency protocol disclosed
  - - Multi-stock-point logistics disruption (weather, labor, third-party logistics failure)
    - Medium (India logistics is fragmented; weather and seasonal disruption common)
    - High (delivery commitments broken; repeat-order rate at risk)
    - Medium (14 stock points provide geographic spread; JODL is internal arm)
    - Medium; geographic distribution limits but does not eliminate disruption risk
    - Geographic coverage of the 14 stock points not publicly listed
  - - Platform technology outage (SPA downtime; API failure between LMS and CBS)
    - Medium (proprietary backend; stack undisclosed)
    - High (B2B orders, credit disbursements, and seller payouts all on-platform)
    - Low-medium (no public SLA, uptime commitment, or DR plan disclosed)
    - Medium-high; downtime in a credit-linked marketplace erodes trust rapidly
    - Cloud provider, uptime SLA, and DR plan not disclosed
  - - Data breach or cybersecurity incident (MSME PII, financial, and GST data)
    - Medium (B2B fintech platforms are high-value targets)
    - High (regulatory fine under IT Act + DPDPA; platform trust loss)
    - Low (no ISO 27001 or SOC 2 certification publicly disclosed)
    - High; absence of independent security certification raises residual risk
    - No third-party security certification found; DPDPA compliance posture unclear
  - - Private-brand quality failure or product recall (JSW One TMT, Concrete)
    - Low-medium (steel specification is measurable; mill test certificates issued)
    - High (MSME construction project damage; BIS/ISI compliance required)
    - Medium (mill test certs and backward traceability built into workflow)
    - Low-medium; traceability infrastructure is a mitigant but not zero risk
    - BIS certification status for JSW One TMT and Concrete brands not confirmed
  - - Talent attrition — platform engineering, NBFC underwriting, and logistics leadership
    - Medium (B2B tech and fintech hiring is competitive in India)
    - Medium (key function loss; scaling momentum at risk)
    - Low-medium (485 employees; no published retention or ESOP program details)
    - Medium; lean team relative to functional breadth
    - ESOP structure and management retention terms not disclosed
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  notes: >-
    Severity assessed from public evidence; no independent security audit or logistics SLA data
    available. Deutsche Bank dependency risk is based on the DB case study, which is a promotional
    source and may omit contractual limitations.

- id: TR003
  title: Partner / dependency risk register
  columns:
  - dependency
  - counterparty
  - role
  - concentration
  - failure scenario
  - severity
  - mitigation
  - residual exposure
  rows:
  - - Payment and banking infrastructure
    - Deutsche Bank India
    - Sole nodal account; LMS-CBS API; payment status; collections
    - Critical (sole provider)
    - Nodal account closure or tech outage halts all seller payouts
    - Critical
    - No disclosed backup; DE regulatory action on DB India adds tail risk
    - High; no fallback partner or contingency plan in public record
  - - Steel supply
    - JSW Steel
    - Primary steel supplier; also equity investor and board chairman's group
    - High (dominant share of catalog supply)
    - Supply disruption or pricing dispute halts core category availability
    - High
    - Group relationship provides supply certainty; offset by RPT risk
    - Medium; supply continuity likely but pricing transparency at risk
  - - NBFC co-lending capital
    - 9 partner lenders (ICICI, IndusInd, Yes, Axis, SCB, Kotak, IDBI, Mizuho, TCL)
    - Co-lending and referral for Rs 3,800 Cr+ FY25 credit facilitation
    - Medium (9 lenders spread risk; any single exit manageable)
    - RBI credit tightening causes lender pullback; MSME risk reclassification
    - High (credit = 33%+ of orders; volume loss if lenders exit)
    - 9-lender diversification is genuine mitigation; JOFL own-book backstop limited
    - Medium; co-lending market is competitive but lender risk appetite is RBI-sensitive
  - - RBI and SEBI regulation
    - Reserve Bank of India; Securities and Exchange Board of India
    - 'Regulator: NBFC licensing, NPA norms, IPO approval'
    - Existential (NBFC licence revocation would break credit flywheel)
    - Adverse regulatory action stops JOFL operations or blocks SEBI DRHP
    - High
    - Compliance track record; RBI returns filing; SEBI pre-filing engagement
    - Medium; regulatory dependency is structural and cannot be mitigated away
  claimRefs:
  - CR019
  - CR039
  - CR007
  - CR004
  notes: >-
    Counterparty roles and concentration assessed from Deutsche Bank case study, Mint, and ET
    reports. No contractual terms are publicly disclosed.

- id: TR004
  title: People / execution risk register
  columns:
  - role / function
  - dependency or gap
  - likelihood
  - severity
  - mitigation
  - diligence path
  rows:
  - - CEO / JMD — Gaurav Sachdeva
    - Architect of marketplace, NBFC, and logistics strategy since 2022; high institutional knowledge
    - Medium (tenure long; IPO-phase incentive to stay)
    - High (loss during IPO preparation would be disruptive)
    - Retention incentives assumed; succession not documented publicly
    - Request succession plan, ESOP vesting schedule, and employment terms
  - - Board chairman — Parth Jindal (JSW Group)
    - Conglomerate linkage and capital access depend on family-group alignment
    - Low (chairman departure unlikely; family-group stake)
    - Medium (alignment shift could redirect group capital; RPT governance change)
    - No formal independent-chair structure; dependency is structural
    - Assess whether SEBI-compliant independent-chair structure is planned for IPO
  - - NBFC underwriting team — JOFL credit function
    - JOFL own book only Rs 100 Cr; underwriting team likely small and nascent
    - Medium (fintech credit talent is scarce in India)
    - High (underwriting quality drives NPA trajectory; team loss degrades model)
    - Scale-up recruitment; partner-lender co-underwriting provides partial coverage
    - Request JOFL org chart, underwriting team size, and credit policy document
  - - Platform engineering — B2B marketplace and LMS development
    - Proprietary backend; single-page app; LMS integrates to Deutsche Bank CBS
    - Medium (developer attrition is high in B2B SaaS)
    - Medium (platform reliability and feature velocity depend on engineering depth)
    - 485 total employees; engineering team size not disclosed
    - Request engineering headcount, attrition rate, and key-man dependencies
  claimRefs:
  - CR008
  - CR010
  - CR021
  - CR035
  notes: >-
    Mitigation maturity and diligence paths reflect the absence of publicly available succession
    plans, ESOP disclosures, or board independence commitments. Assessments are necessarily
    qualitative.

- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Related-party conflict (JSW Steel pricing and governance)
    - SEBI DRHP filing and RPT disclosure schedule
    - Auditor qualifies RPT pricing; SEBI issues observation letter on RPTs
    - Treat as thesis-break; commission independent pricing review before deepening position
  - - NBFC regulatory tightening (RBI Scale Based Regulation upgrade)
    - JOFL AUM crossing Rs 1,000 Cr; RBI re-classification notice
    - JOFL reclassified to Middle Layer or receives adverse supervisory communication
    - Request capital adequacy plan; pause deployment pending governance upgrade assessment
  - - Payment infrastructure failure (Deutsche Bank exit or outage)
    - Deutsche Bank India regulatory action; partnership renewal date; outage disclosure
    - Deutsche Bank exits nodal account role without a confirmed backup partner
    - Hard thesis-break; entire transaction settlement model is impaired
  - - Competitive share loss (IPO window closes; conglomerate rival scales faster)
    - Infra.Market IPO proceeds and raises Rs 5,000 Cr; Tata Nexarc / Birla Pivot GMV disclosure
    - Competitor achieves GMV exceeding Rs 20,000 Cr at lower valuation multiple
    - Re-assess entry valuation; competitive moat may be narrowing faster than model assumes
  - - IPO failure or material delay
    - SEBI DRHP filing date; listing schedule; pre-IPO fundraise closure
    - SEBI DRHP not filed by Q3 FY27 or pre-IPO raise falls below Rs 400 Cr
    - Likely indicates disclosure gap or governance issue; request board update before next check-in
  claimRefs:
  - CR037
  - CR004
  - CR019
  - CR026
  - CR031
  notes: >-
    Kill criteria are monitorable from public filings (SEBI, RBI, MCA) or from management
    disclosures. Thresholds are illustrative; investors should set internal trip-wires
    based on portfolio position size.

figures:
- id: FR001
  title: Risk heatmap
  type: matrix
  layout: wide
  summary: >-
    Related-party governance and NBFC regulatory risk sit at the high-severity / medium-to-high-likelihood
    intersection. Payment infrastructure concentration is the highest-severity, lower-likelihood event.
    Steel-cycle and competitive risks are medium-severity but high-likelihood given the 2024 price
    environment. IPO disclosure risk is material if SEBI scrutiny of RPTs leads to restatement.
  data:
    columns:
    - Low likelihood
    - Medium likelihood
    - High likelihood
    rows:
    - label: Critical severity
      values:
      - label: Deutsche Bank exit without backup
        tone: risk
        detail: >-
          Single-vendor payment infrastructure; nodal account closure halts all seller settlements.
          Low probability given existing partnership, but no mitigation disclosed.
      - label: RBI enforcement on JOFL
        tone: risk
        detail: >-
          NBFC licence revocation or directed action against JOFL would halt the credit flywheel
          underpinning 33%+ of orders. Rising NPA tide in a steel downturn could trigger.
      - label: SEBI blocks IPO on RPT restatement
        tone: risk
        detail: >-
          SEBI could require JSW One to restate financials if related-party steel procurement
          is found to be materially mispriced; this is the primary listing-risk scenario.
    - label: High severity
      values:
      - label: Tata Nexarc / Birla Pivot disrupts at scale
        tone: risk
        detail: >-
          Conglomerate-backed rivals replicate supply certainty without RPT complexity;
          probability increases as they build NBFC credit capability.
      - label: JOFL crosses Rs 1,000 Cr AUM — Middle Layer reclassification
        tone: risk
        detail: >-
          Faster-than-modelled NBFC scaling triggers stricter governance and capital requirements,
          compressing JOFL unit economics and delaying next fundraise.
      - label: Steel price decline compresses GMV 15–25%
        tone: risk
        detail: >-
          HRC already fell 20% in CY2024; a second wave compresses GMV at fixed commissions
          and elevates MSME credit stress simultaneously.
    - label: Medium severity
      values:
      - label: Platform engineering talent exodus
        tone: neutral
        detail: >-
          Proprietary backend with undisclosed stack; small team relative to functional scope.
          Manageable with competitive ESOP but information is not public.
      - label: Key-person departure — Gaurav Sachdeva exits before IPO
        tone: risk
        detail: >-
          CEO built credit, logistics, and marketplace strategy since 2022; IPO-phase departure
          would be highly disruptive to investment banker relationships and DRHP narrative.
      - label: Infra.Market IPO competes for same investor base
        tone: neutral
        detail: >-
          Infra.Market filed confidential DRHP; if it lists in the same window, investor appetite
          for a second B2B construction-materials platform IPO may be limited.
  claimRefs:
  - CR019
  - CR002
  - CR004
  - CR007
  - CR026
  - CR029
  - CR031
  - CR035
  approximationNotes: >-
    Likelihood and severity assessments are based on public-source evidence and qualitative reasoning;
    no quantitative probability model has been applied. Cells represent analyst judgment synthesising
    regulatory filings, press reports, and company disclosures reviewed to June 2026.

- id: FR002
  title: Risk transmission map
  type: dag
  layout: wide
  summary: >-
    The primary risk transmission path starts with related-party conflict or regulatory action and flows
    through credit-flywheel impairment into GMV compression, then into valuation haircut and IPO delay.
    The Deutsche Bank single-vendor path is a more acute, lower-probability bypass that transmits directly
    to transaction halt and platform trust loss.
  data:
    nodes:
    - id: R1
      label: Related-party conflict surfaces (SEBI / audit)
      detail: >-
        SEBI DRHP review or auditor qualification reveals mispriced JSW Steel procurement;
        restatement required.
      tone: risk
    - id: R2
      label: RBI regulatory action on JOFL
      detail: >-
        NPA spike or governance breach triggers RBI directed action or licence conditions.
      tone: risk
    - id: R3
      label: Credit flywheel impaired
      detail: >-
        JOFL lending constrained; partner lenders pause co-lending; 33%+ of orders lose access
        to 60–90 day inventory finance.
      tone: risk
    - id: R4
      label: GMV compression
      detail: >-
        Orders requiring credit decline; steel-price downturn compounds volume loss.
      tone: risk
    - id: R5
      label: Revenue and take-rate compression
      detail: >-
        Lower GMV reduces revenue; fixed operating costs create margin squeeze.
      tone: risk
    - id: R6
      label: IPO filing delayed or blocked
      detail: >-
        SEBI restatement, DRHP observation letter, or audited financials miss covenants.
      tone: risk
    - id: R7
      label: Valuation haircut at next round
      detail: >-
        Revenue miss and IPO delay compress precedent-round multiple; new capital raised at
        lower price.
      tone: risk
    - id: R8
      label: Deutsche Bank exits or outage
      detail: >-
        Nodal account closed; LMS-CBS API down; seller payouts halted across marketplace.
      tone: risk
    - id: R9
      label: Transaction settlement halt
      detail: >-
        All platform transactions are frozen; buyers and sellers cannot complete orders.
      tone: risk
    - id: R10
      label: Platform trust and repeat-order rate collapse
      detail: >-
        MSMEs migrate to competitors; 70%+ repeat-order rate falls; GMV structurally impaired.
      tone: risk
    edges:
    - from: R1
      to: R6
      label: SEBI blocks or conditions IPO
    - from: R1
      to: R7
      label: investor confidence falls pre-IPO
    - from: R2
      to: R3
      label: JOFL lending constrained
    - from: R3
      to: R4
      label: fewer credit-funded orders
    - from: R4
      to: R5
      label: lower GMV reduces revenue
    - from: R5
      to: R7
      label: multiple compresses on revenue miss
    - from: R5
      to: R6
      label: revenue shortfall fails IPO covenants
    - from: R8
      to: R9
      label: payment rails go down
    - from: R9
      to: R10
      label: MSME sellers and buyers lose trust
    - from: R10
      to: R4
      label: structural GMV impairment
    - from: R4
      to: R7
      label: valuation pressure from GMV decline
    - from: R6
      to: R7
      label: listing delay = valuation discount
  claimRefs:
  - CR007
  - CR019
  - CR011
  - CR016
  - CR017
  - CR034
  - CR040
  approximationNotes: >-
    Transmission paths are inferred from public evidence on the platform's credit, payment, and revenue
    model. Edge probabilities are not quantified. The transmission map is a qualitative risk-framing tool.

- id: FR003
  title: Dependency map
  type: dag
  layout: wide
  summary: >-
    JSW One Platforms sits at the centre of a dependency network that spans a single payment-infrastructure
    provider, a related-party steel supplier, nine co-lending banks, two regulators, and a logistics
    backbone. Weakness in any critical-path node propagates across the platform's core functions.
  data:
    nodes:
    - id: D1
      label: JSW One Platforms (JOPL)
      detail: B2B marketplace and platform operator; central orchestration node.
      tone: neutral
    - id: D2
      label: JSW Steel
      detail: Primary steel supplier and equity investor; related-party dual role.
      tone: risk
    - id: D3
      label: Deutsche Bank India
      detail: Sole nodal account and LMS-CBS payment infrastructure provider.
      tone: risk
    - id: D4
      label: JSW One Finance Limited (JOFL)
      detail: In-house NBFC providing own-book lending; RBI-registered since Oct 2024.
      tone: neutral
    - id: D5
      label: 9 Partner Lenders
      detail: ICICI, IndusInd, Yes, Axis, SCB, Kotak, IDBI, Mizuho, TCL — co-lending providers.
      tone: neutral
    - id: D6
      label: Reserve Bank of India
      detail: NBFC regulator; Scale Based Regulation; NPA norms authority.
      tone: neutral
    - id: D7
      label: SEBI
      detail: IPO regulator; DRHP review; related-party disclosure enforcement.
      tone: neutral
    - id: D8
      label: JODL — 14 stock points
      detail: Logistics and fulfilment arm; just-in-time steel delivery across India.
      tone: neutral
    - id: D9
      label: 7 contract manufacturing sites
      detail: Private-brand production locations for JSW One TMT and other brands.
      tone: neutral
    - id: D10
