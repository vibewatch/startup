    - {id: QM011, question: Who exactly buys uses and pays on JSW One’s core workflows today?, type: enumeration, targets: [contentRequirements/2, plannedTables/segment-buyer-map, plannedFigures/buyer-segment-map], status: partial, sourceRefs: [SM022, SM023, SM024], claimRefs: [CM021, CM022, CM023]}
    - {id: QM012, question: What share of JSW One demand comes from manufacturing versus construction?, type: quantification, targets: [contentRequirements/2, plannedTables/segment-buyer-map], status: answered, answer: Mint reports that about 82% of JSW One’s e-commerce business comes from manufacturing and 18% from construction., sourceRefs: [SM023], claimRefs: [CM022]}
    - {id: QM013, question: How important is embedded credit in the adoption path?, type: mechanism, targets: [contentRequirements/3, plannedFigures/adoption-funnel-or-value-chain-map], status: answered, answer: 'Credit is central because over one-third of orders use it, monthly disbursals run at roughly ₹475-500 crore, and FY25 credit facilitation reached about ₹3,800 crore.', sourceRefs: [SM022, SM023], claimRefs: [CM023, CM024, CM025]}
    - {id: QM014, question: What benchmark shows public-sector procurement can digitise at scale in India?, type: comparison, targets: [contentRequirements/3, plannedTables/growth-drivers-and-constraints-table], status: answered, answer: GeM crossed ₹4.09 lakh crore GMV by January 2025 and later surpassed ₹5 lakh crore by March 2025 with over 1.6 lakh government buyers and more than 22 lakh sellers-service providers., sourceRefs: [SM014, SM015], claimRefs: [CM031, CM032, CM033, CM045]}
    - {id: QM015, question: What benchmark shows private B2B marketplace scale at India level?, type: comparison, targets: [contentRequirements/0], status: answered, answer: IndiaMART reports a nationwide network of tens of millions of suppliers and 21-23 crore buyers, illustrating the scale available to horizontal B2B discovery platforms., sourceRefs: [SM010, SM011], claimRefs: [CM028, CM029]}
    - {id: QM016, question: What does ONDC suggest about interoperability-based digital procurement?, type: mechanism, targets: [contentRequirements/3, plannedFigures/buyer-segment-map], status: answered, answer: ONDC shows that digital commerce can be organised as an open protocol where buyer seller and service-provider apps interoperate across many domains rather than transact inside one closed platform., sourceRefs: [SM019, SM020], claimRefs: [CM034, CM035]}
    - {id: QM017, question: What efficiency gains or workflow improvements are cited for open digital networks?, type: mechanism, targets: [contentRequirements/3, plannedTables/growth-drivers-and-constraints-table], status: answered, answer: Deloitte argues ONDC’s B2B workflows can improve manufacturer operating efficiency by 5-10% and widen market access through plug-and-play capabilities., sourceRefs: [SM021], claimRefs: [CM036]}
    - {id: QM018, question: What competitor traction exists in steel e-commerce specifically?, type: comparison, targets: [contentRequirements/1], status: answered, answer: Tata Steel’s DigECA reached ₹1,000 crore GMV in FY26 with 160 KT sales and 3,500+ MSME customers, while earlier reporting said it had already onboarded 2,000+ customers after pilot launch., sourceRefs: [SM007, SM008], claimRefs: [CM037, CM038]}
    - {id: QM019, question: What competitor traction exists in construction-material digitisation more broadly?, type: comparison, targets: [contentRequirements/1], status: answered, answer: Birla Pivot says it reached a ₹5,000 crore annualised run-rate within two years with 40,000 SKUs 300+ brands and presence in 375 cities across 26 states., sourceRefs: [SM006], claimRefs: [CM039, CM040]}
    - {id: QM020, question: What adoption benefits matter most to MSME buyers besides price?, type: mechanism, targets: [contentRequirements/3, plannedTables/growth-drivers-and-constraints-table], status: answered, answer: Trust GST-compliance workflow support financing verified logistics and better order visibility recur across JSW One Birla Pivot Amazon Business and Tata nexarc evidence., sourceRefs: [SM006, SM009, SM018, SM024], claimRefs: [CM007, CM040, CM041]}
    - {id: QM021, question: Which growth drivers look strongest over the next two to three years?, type: freshness, targets: [contentRequirements/3], status: answered, answer: The strongest drivers are infrastructure capex PMAY-U 2.0 housing support embedded-credit adoption and lower digital-procurement friction as shown by GeM and ONDC-related evidence., sourceRefs: [SM003, SM004, SM014, SM015, SM021], claimRefs: [CM015, CM016, CM017, CM018, CM019, CM025, CM036, CM045]}
    - {id: QM022, question: What structural constraints could slow adoption despite strong demand?, type: verification, targets: [contentRequirements/3, plannedTables/growth-drivers-and-constraints-table], status: answered, answer: Analyst sources flag raw-material volatility unorganised competition logistics weakness slow adoption of advanced technologies and decarbonisation pressure., sourceRefs: [SM016, SM017], claimRefs: [CM043, CM044]}
    - {id: QM023, question: 'Adverse: Is private construction-material procurement still too under-digitised for fast scaling?', type: adverse, targets: [contentRequirements/4], status: answered, answer: Yes. Birla Pivot’s ~2% penetration claim and analyst commentary both suggest the market is still early and fragmented so scale assumptions should stay range-based., sourceRefs: [SM006, SM016], claimRefs: [CM005, CM042, CM043]}
    - {id: QM024, question: 'Adverse: Can horizontal or incumbent platforms compress JSW One’s differentiation?', type: adverse, targets: [contentRequirements/4], status: answered, answer: Yes. IndiaMART Amazon Business DigECA Birla Pivot Tata nexarc and ONDC-enabled channels all attack parts of the workflow so JSW One must defend on vertical depth credit service and reliability together., sourceRefs: [SM006, SM007, SM009, SM010, SM011, SM018], claimRefs: [CM028, CM030, CM037, CM039]}
    - {id: QM025, question: Why do public market-size estimates differ so widely?, type: comparison, targets: [contentRequirements/4, plannedFigures/market-estimate-range], status: answered, answer: 'They use different boundaries: broad construction activity, narrower construction-commerce, steel demand, and public-spending proxies are related but not interchangeable.', sourceRefs: [SM003, SM006, SM017, SM025], claimRefs: [CM013, CM014, CM020, CM029]}
    - {id: QM026, question: What exact private-market SAM remains after excluding public procurement and non-core categories?, type: quantification, targets: [contentRequirements/1, contentRequirements/4, plannedFigures/market-sizing-lens], status: unresolved}
    - {id: QM027, question: What current official split of Indian steel demand by end use is publicly supportable for this chapter?, type: verification, targets: [contentRequirements/4], status: unresolved}
