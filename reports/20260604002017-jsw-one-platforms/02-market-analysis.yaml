  claims:
    - {id: CM001, statement: JSW One’s relevant market for this chapter is private B2B procurement of industrial and construction materials for Indian MSMEs not generic consumer e-commerce., type: inferred, topic: market-boundary, sourceRefs: [SM022, SM024], confidence: medium, freshness: current, answersQuestionRefs: [QM001]}
    - {id: CM002, statement: Included spend spans steel cement paints plumbing sanitary electrical and related project or industrial inputs bought inside recurring procurement workflows., type: inferred, topic: market-boundary, sourceRefs: [SM006, SM024], confidence: medium, freshness: current, answersQuestionRefs: [QM001]}
    - {id: CM003, statement: Excluded or only adjacent pools include government tender procurement export-discovery marketplaces and consumer retail purchases., type: inferred, topic: market-boundary, sourceRefs: [SM014, SM019, SM024], confidence: medium, freshness: current, answersQuestionRefs: [QM002]}
    - {id: CM004, statement: Birla Pivot describes India’s B2B commerce opportunity at over US$200 billion and says the construction-materials trade remains largely fragmented and unorganised., type: company-claimed, topic: market-fragmentation, sourceRefs: [SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM003, QM007]}
    - {id: CM005, statement: Birla Pivot says construction-material commerce has only about 2% digital penetration., type: company-claimed, topic: digital-penetration, sourceRefs: [SM006], confidence: medium, freshness: current, answersQuestionRefs: [QM003, QM023]}
    - {id: CM006, statement: Tata nexarc bundles steel procurement with supply-chain finance showing that credit-linked procurement is part of the category’s practical workflow boundary., type: observed, topic: embedded-credit, sourceRefs: [SM009], confidence: medium, freshness: current, answersQuestionRefs: [QM002, QM013]}
    - {id: CM007, statement: Amazon Business frames B2B procurement around GST invoices compliance controls bulk discounts analytics and delivery coverage rather than around product discovery alone., type: company-claimed, topic: workflow-benefits, sourceRefs: [SM018], confidence: medium, freshness: current, answersQuestionRefs: [QM020]}
    - {id: CM008, statement: IndiaMART positions itself as India’s largest online B2B marketplace connecting buyers with suppliers., type: company-claimed, topic: horizontal-marketplaces, sourceRefs: [SM010], confidence: medium, freshness: current, answersQuestionRefs: [QM015]}
