    - {id: EGM001, type: private-evidence-only, severity: material, topic: buyer-persona-mix, missingEvidence: Public sources do not disclose JSW One’s current order mix by manufacturer contractor dealer or approval role., whyItMatters: Buyer-user-payer segmentation and budget ownership are central to underwriting repeat purchase behaviour and expansion motion., diligencePath: Request management cohort data split by customer type buyer persona credit usage repeat rate and average order value., relatedQuestionRefs: [QM011]}
    - {id: EGM002, type: missing-source, severity: material, topic: private-sam-boundary, missingEvidence: No public source cleanly isolates India’s private construction-materials SAM after removing public procurement export-discovery channels and non-core categories., whyItMatters: Without a clean denominator market-share and take-rate assumptions can be overstated or compared against the wrong market., diligencePath: Commission or obtain a private category study that segments construction materials by channel buyer type and digital penetration then reconcile it against platform GMV., relatedQuestionRefs: [QM026]}
    - {id: EGM003, type: missing-source, severity: material, topic: steel-end-use-split, missingEvidence: The chapter lacks a current official end-use split of Indian steel demand across construction manufacturing autos energy and other sectors., whyItMatters: That split would sharpen which portion of steel growth is most relevant to JSW One’s manufacturing-versus-construction exposure., diligencePath: Pull current JPC Ministry of Steel or ISA sectoral-consumption tables and map them to JSW One’s category mix., relatedQuestionRefs: [QM027]}
