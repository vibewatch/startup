summary:
  headline: >-
    JSW One Platforms has a credible full-stack industrial-commerce thesis and a strategically useful JSW Group moat,
    but the ~$1B valuation still depends on unaudited FY25 operating data and a fast- scaling credit/distribution model
    that carries meaningful execution and governance risk.
