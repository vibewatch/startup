company:
  name: Glow Security
chapter:
  number: 1
  title: Company Overview
  summary: 'Glow Security, publicly branded as Glow, emerged from stealth on July 22, 2026 with $180 million of disclosed funding at a $1.2 billion valuation. Official and independent sources align on the valuation, founder lineup, and Israel-plus-U.S. operating footprint, but they diverge on round taxonomy: TechCrunch called the financing an all-equity Series A while CTech reconstructed three stealth rounds behind the same headline. The company now has a real public launch surface, nearly 100 employees, named enterprise proof points, and a prevention-first endpoint thesis for the AI era, yet still withholds ARR, customer count, board composition, and exact financing structure.'
sections:
- id: identity-product
  title: Identity, product frame, and legal-entity picture
  body: "Glow Security, marketed publicly as Glow, is now clearly a real operating company rather than only a stealth fundraising rumor. The official homepage and July 22, 2026 launch release call it \"The Endpoint AI Company\" and frame the platform as a prevention-first control layer for the modern endpoint. Glow says its AI agents continuously discover software, AI tools, plugins, and other execution surfaces on employee devices; map risk in policy context; and prevent risky or unauthorized software from entering the environment before it becomes an incident. That framing is notably different from classic EDR language, which usually emphasizes detection and response after suspicious activity appears. \n\nThe legal and operating surface also looks more mature than it did earlier in 2026. Glow's privacy policy names Glow Security Ltd, while its SaaS terms are written in the name of Glow Security, Inc., implying the common Israeli-startup pattern of an Israeli operating entity plus a U.S.\
    \ commercial contracting entity. The website now includes a launch release, about page, jobs board, support, events, terms, privacy, blogs, and Black Hat event pages. That is enough to conclude the company has crossed from stealth into controlled commercialization, even if it still lacks an open trust center, public pricing, or open technical documentation."
