- id: milestones-gaps
  title: Milestones, trademarks, and remaining public-information limits
  body: "Glow's public milestone cadence is unusually compressed. The company was founded in 2025, raised stealth capital through 2025 and early 2026, surfaced in pre-launch Israeli reporting as a coming cyber unicorn, then officially emerged from stealth on July 22, 2026 at a $1.2 billion valuation. By early August it had already converted that launch into a high-visibility Black Hat activation, and by mid-August Roi Tiger published a founder essay explicitly framing Glow as a prevention-first endpoint company for the AI era. The job board adds another useful maturity signal: most engineering openings are in Tel Aviv while most public sales and marketing openings are in the United States, consistent with a classic Israel-R&D / U.S.-GTM operating split. \n\nThe biggest remaining gaps are still financing precision and commercial transparency. Public sources align on the valuation headline but not on whether the $180 million represents one formally labeled Series A or the cumulative output\
    \ of multiple stealth rounds. They also still do not disclose ARR, burn, margin, customer count, board composition, or detailed round structure. Headcount is better anchored than before—TechCrunch says nearly 100 employees with about 70% in Israel, while CTech says around 100 total with roughly 65 in Israel—but even that remains range-level rather than audited. The right overview conclusion is that Glow now looks like a genuine operating vendor, yet still withholds too much information for a late-stage private underwrite."
