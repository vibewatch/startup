- id: founders-leadership
  title: Founders, leadership bench, and key-person exposure
  body: "Glow's founder-market fit remains unusually strong. Official company materials and third-party reporting consistently identify Roi Tiger, Omer Singer, and Ophir Arie as the core founding trio. Tiger previously spent nine years at Meta and earlier co-founded Onavo; Singer previously led cybersecurity strategy at Snowflake; Arie previously held a VP R&D role at Claroty. That combination gives Glow deep lineage across endpoint control, enterprise software, cloud-security strategy, and Israeli cyber execution. \n\nThe current public leadership bench is also more concrete than before. Glow now publicly lists Arnon Joseph as Chief Product Officer and Emily Heath as Chief Operating Officer. Heath adds rare buyer empathy and operating credibility because she previously served as CISO at both United Airlines and DocuSign and spent time inside Cyberstarts. TechCrunch even described Arnon Joseph as part of the company's founding cluster, while official company materials keep the narrower three-founder\
    \ framing, which is a small but notable discrepancy in the public record. \n\nGovernance visibility, however, remains thin. No public source reviewed here discloses the board roster, seat allocation, investor control rights, or committee structure. Earlier Calcalist reporting also said founding-era operator Pini Pinhasov left the company before the public launch, creating a modest continuity question around the original formation story. So leadership quality is high, but governance transparency is still not."
