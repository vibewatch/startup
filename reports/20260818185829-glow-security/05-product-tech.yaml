  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: open-docs
    missingEvidence: Glow has a docs portal but the public cannot inspect the endpoint API reference, auth model, schemas, or integration depth without access.
    whyItMatters: API and deployment depth determine whether the platform can integrate cleanly into enterprise environments and whether product claims map to production reality.
    diligencePath: Request docs access, API overview, sample payloads, auth methods, and the current integration catalog.
    relatedQuestionRefs:
    - QE010
    - QE011
    - QE020
  - type: missing-source
    severity: material
    topic: assurance-package
    missingEvidence: No reviewed public source exposed SOC 2, ISO 27001, ISO 42001, penetration-test summaries, or a public trust center.
    whyItMatters: Later-stage enterprise buyers, especially regulated ones, often require objective control evidence before broad deployment.
    diligencePath: Request trust-center materials, recent audit reports, certification letters, and current incident-response commitments.
    relatedQuestionRefs:
    - QE017
    - QE019
  - type: missing-source
    severity: material
    topic: integration-depth
    missingEvidence: No reviewed public source listed supported operating systems, deployment patterns, SIEM/SOAR connectors, or other named integration endpoints.
    whyItMatters: Without integration detail, it is hard to separate a compelling thesis from a hard-to-operationalize implementation.
    diligencePath: Request supported-OS matrix, reference architecture, and named integrations with status and support levels.
    relatedQuestionRefs:
    - QE008
    - QE020
    - QE024
  - type: missing-source
    severity: minor
    topic: benchmark-methodology
    missingEvidence: Glow publishes 5x and 10x outcome claims without a public benchmark method, denominator, or customer-study writeup.
    whyItMatters: Outcome claims are more credible when tied to measured baselines, evaluation windows, and customer cohorts.
    diligencePath: Request the source study behind the metrics, including sample size, methodology, and whether results came from pilots or production accounts.
    relatedQuestionRefs:
    - QE023
    - QE024
  - type: stale
    severity: minor
    topic: roadmap-transparency
    missingEvidence: The public file lacks release notes, changelog history, or a public roadmap explaining what shipped when.
    whyItMatters: For a company leaving stealth, release cadence helps investors judge whether engineering maturity matches fundraising velocity.
    diligencePath: Request internal release history, roadmap milestones, and evidence of current module GA versus pilot status.
    relatedQuestionRefs:
    - QE021
    - QE022
