  topStrengths:
    - 创始人与市场高度匹配，核心团队集中拥有 Meta、Onavo、Snowflake 和 Claroty 背景。
    - Glow 公开亮相时估值罕见达到 $1.2B，投资人名单也足够一线，由 Sequoia、Cyberstarts、Greenoaks 和 Redpoint 领投。
    - 产品逻辑踩在时间点上：在企业环境里，对软件、工具和 AI 智能体做预防优先的端点控制。
    - Antares Capital、Fanatics、CAVA 和 BMC Software 这些具名公开客户背书，比一般隐身期网络安全公司发布时的验证更硬。
  topRisks:
    - 尽管公司已是独角兽估值，ARR、留存、毛利率、烧钱速度和客户数仍未披露。
    - 公开资料对 2026 年融资究竟应理解为 Series A，还是累计隐身轮次，说法并不一致，削弱了估值判断精度。
    - 大型端点安全既有巨头可凭更强分销和验证材料，把相邻控制能力打包销售。
    - 公司想控制员工端点上运行的内容，信任、隐私和治理门槛异常高。
  unresolvedGaps:
    - 当前 ARR、增长率、毛利率和净留存率。
    - 已签署的 2026 年融资文件，用于对齐官方发布披露与公开轮次标签冲突。
    - 具名客户背后的客户数、集中度、部署范围和续约行为。
    - 董事会构成、投资人权利，以及大型企业买家预期看到的完整信任 / 合规材料。
