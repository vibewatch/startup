  summary: >-
    Glow Security，对外品牌为 Glow，是一家由以色列创始人创办的端点安全初创公司，2026 年 7 月走出隐身模式。 公司把自己定位为端点 AI 公司，销售一套预防优先平台：它发现企业设备上运行的软件、AI
    智能体和工具， 结合策略上下文判断风险，并帮助安全团队在风险软件演变成事件前将其拦住。公开证据在创始人质量、投资人质量、 具名企业背书和 2026 年 7 月估值锚点上最强；在晚期投资承销需要的运营指标和交易细节上最弱。
