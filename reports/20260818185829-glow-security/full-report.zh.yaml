        - 只有隐藏指标已经顶尖时才可能成立
      - - 基准
        - Glow 有真实切口和真实企业牵引力，但经济性和扩张是扎实而非卓越
        - 支撑约 $1.2B-$2.0B 的估值区间
        - 当前标价可能已吸收此情景的大部分价值
        - 最符合现有公开证据
      - - 悲观
        - 客户深度弱于暗示，服务负担高，或融资叙事跑在产品市场契合之前
        - 支撑下移至约 $0.6B-$1.0B
        - 降价轮或战略重置变得可能
        - 没有数据室前无法排除
    notes: 情景区间对证据敏感，且因 ARR 未披露而刻意拉宽。
