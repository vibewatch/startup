      - number: '8.2'
        title: 可比背景说明 $1B+ 标记有合理性，但也说明公开支撑仍偏薄
        blocks:
          - type: paragraph
            body: >-
              可比背景仍支持一个判断：在 2026 年私有 AI 和网络安全市场里，$1.2 billion 标记是有可能成立的。CrowdStrike、SentinelOne、Palo Alto Networks 和
              Fortinet 等公开龙头展示了端点和安全平台规模化后的价值，Cyberhaven 等私有邻近公司则说明，投资者会在公开市场成熟前，为差异化 AI 原生安全叙事支付高价。从这个角度看，Glow
              的估值表面上并不荒唐。


              但有可能不等于足够。那些可比公司要么规模大得多，要么披露充分得多，要么两者兼具。Glow 还没有公开展示 ARR、NRR、毛利率结构或客户广度，投资者无法判断它应拿到私有 AI
              溢价倍数、较传统的安全软件折价，还是介于两者之间。估值锚点是真实的，但估值支撑仍不完整。
