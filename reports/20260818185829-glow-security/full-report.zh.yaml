      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - Glow 隐藏 ARR 增长顶尖，企业扩张真实，信任材料包足以支撑快速扩张
        - 长期可支撑约 $3B-$5B 的估值结果
