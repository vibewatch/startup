      - number: '1.2'
        title: 创始人、领导班底与关键人暴露
        blocks:
          - type: paragraph
            body: >-
              Glow 的创始人与市场匹配度仍然异常强。官方公司材料和第三方报道一致把 Roi Tiger、Omer Singer 和 Ophir Arie 确认为核心创始三人组。Tiger 此前在 Meta
              任职九年，更早共同创办 Onavo；Singer 此前负责 Snowflake 网络安全战略； Arie 此前在 Claroty 担任研发副总裁。这个组合让 Glow
              同时继承了端点控制、企业软件、云安全战略和以色列网络安全执行的深厚脉络。 


              当前公开领导班底也比以前具体。Glow 现在公开列出 Arnon Joseph 为首席产品官、Emily Heath 为首席运营官。 Heath 曾在 United Airlines 和 DocuSign 担任
              CISO，也在 Cyberstarts 任职，这带来少见的买方同理心和运营可信度。 TechCrunch 甚至把 Arnon Joseph 描述为公司创始集群的一员；官方公司材料则保持较窄的三位创始人表述，
              这是公开记录中一个不大但值得注意的差异。 


              但治理可见度仍然很薄。本文审阅的公开来源都没有披露董事会名单、席位分配、投资人控制权或委员会结构。 Calcalist 更早的报道还称，创立初期运营者 Pini Pinhasov
              在公开发布前已经离开公司，给原始组建故事留下一个温和的连续性问题。 因此，领导层质量很高，治理透明度还不是。
