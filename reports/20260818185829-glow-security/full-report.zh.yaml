      - 类别
      - 规模 / 融资
      - 目标客群
      - 差异化
      - 相比 Glow 的局限
    rows:
      - - Cyberhaven
        - 直接融合型初创公司
        - 以 $1B 估值完成 $100M Series D 轮融资；累计融资 $250M
        - 有数据保护、内部风险和 AI 安全需求的大型企业
        - 数据血缘、DDR、上下文阻断、统一 DSPM/DLP/IRM/AI 安全
        - 更偏以数据为中心，而不是以端点为中心；如果买家从设备控制切入，Glow 可能更简单
      - - Nudge Security
        - 相邻初创公司
        - 完成 $22.5M Series A 轮融资；近 200 家客户；ARR 连续两年增长 3x
        - 管理 SaaS 和 AI 蔓延的云原生组织
        - 无边界发现、员工提示、无需重型代理的 SaaS/AI 治理
        - 原生端点执行深度不如 Glow 所称
      - - CrowdStrike
        - 端点 / 安全套件既有厂商
        - FY26 ARR $5.25B；FY26 收入 $4.81B
        - 正在标准化采用 Falcon 平台的企业和高端中型市场买家
        - 品牌、规模、模块扩张、AI 叙事、渠道触达
        - 相比聚焦的控制层销售，可能更宽也更重
      - - SentinelOne
        - 端点 / 安全套件既有厂商
        - FY26 收入 $1.00B；ARR $1.12B；1,667 家 ARR 超 $100k 客户
        - 寻求统一 AI 原生安全平台的企业买家
        - 统一端点 / 身份 / 云定位，以及上攻大客户势头
        - 市场认知仍主要是端点 / XDR，而非纯 AI 治理控制
      - - Microsoft
        - 捆绑套件既有厂商
        - 通过 Microsoft 365 企业套餐销售
        - 已经标准化采用 M365、Entra、Intune、Defender 和 Purview 的大型既有客户
        - 捆绑能力、身份与端点控制、内部风险和云应用发现都在同一体系内
        - 可能更慢、更复杂，也绑定以 Microsoft 为优先的工作流
      - - Palo Alto Networks
        - 广义平台既有厂商
        - FY25 收入 $9.2B；几乎全部 Fortune 100 和多数 Global 2000 都是客户
        - 采购集成 SecOps 和云平台的大型企业
        - 渠道能力，XDR + DLP + 云 + AI 驱动 SOC 的广度
        - 如果买家想先做设备边缘控制、再谈完整 SOC 转型，Glow 更聚焦
      - - ThreatLocker
        - 现状替代品 / 窄域专家
        - 私有公司；定价由销售漏斗引导
        - 优先考虑强执行控制和白名单的组织
        - 默认拒绝的应用控制；数小时到数天内部署
        - 在 AI 治理、数据血缘和更广泛分析上比 Glow 更窄
    notes: 这张表把直接融合型初创公司、平台既有厂商和更窄的替代品分开，因为买家可以用本质不同的路径完成 Glow 试图解决的工作。
