  - id: TV005
    title: 投资逻辑破裂与终止触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 相对于当前标价，隐藏 ARR 偏低
        - 数据室显示 ARR 太低，撑不起高溢价基准逻辑
        - 估值支撑立即压缩
        - 重新定价或放弃
      - - 留存 / 集中度不及预期
        - NRR、流失率或头部客户敞口弱于预期
        - 增长质量逻辑走弱
        - 下调情景区间，并要求保护条款
      - - 部署证实服务负担重
        - 实施强度扩张快过产品杠杆
        - 利润率和可扩展性假设被打破
        - 向悲观情景靠拢
      - - 信任材料包仍薄弱
        - 没有可信的控制 / 认证 / 治理材料包
        - 采购摩擦上升，退出信心下降
        - 暂停或大幅下调
      - - 竞争失利加速
        - 买家偏好套件或相邻 AI 治理工具
        - 增长和退出天花板被压缩
        - 下调乐观情景概率
      - - 轮次结构对投资者不友好
        - 优先股堆叠或稀释压力比暗示更重
        - 普通股上行空间收缩
        - 要求结构保护或回避
      - - 融资叙事仍未理清
        - 无法对齐 Series A 与累计隐身轮次的口径
        - 对价格形成和稀释假设的信心下降
        - 暂停，或先要求文件再推进
    notes: 这些触发点把叙事不确定性转成可监测的承销测试。
    claimRefs:
      - CV027
      - CV028
      - CV031
      - CV032
      - CV033
      - CV036
      - CV040
      - CV042
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - ARR 与增长质量
        - 当前 ARR、订单到收入桥、收入结构和增长节奏
        - 所有估值倍数比较的核心输入
        - 财务团队 / 数据室
      - - 留存与集中度
        - NRR、GRR、流失率和前 10 大客户敞口
        - 区分有吸引力的客户名单和可持续经济性
        - 财务 + RevOps / 数据室
      - - 利润率与服务负担
        - 软件、支持和服务的毛利率拆分
        - 决定 Glow 是否配得上软件式估值
        - 财务 + 客户成功
      - - 融资分类
        - 已签署的 2026 年融资文件，用于对齐官方发布、TechCrunch 和 CTech 口径
        - 决定成熟度、稀释，以及真正进入公司的新股资金规模
        - 法务 + 财务 / 交易文件
      - - 轮次结构
        - 新股与老股、优先权、治理权利和稀释条款
        - 决定标价下投资者的真实收益
        - 法务 + 财务 / 交易文件
      - - 部署现实
        - 实施周期、回滚负担、模块挂载和支持负荷
        - 检验可扩展性和扩张假设
        - 现场尽调 + 客户访谈
      - - 竞争证据
        - 近期面对套件和 AI 治理邻近厂商的赢单 / 输单记录
        - 检验切口能否转成持久护城河
        - 销售运营 + 客户参考
    notes: 这些要求是从兴趣进入承销所需的最低证据。
    claimRefs:
