      - number: '1.3'
        title: 资本形成、投资人阵容与首批公开客户信号
        blocks:
          - type: paragraph
            body: >-
              Glow 的资本故事现在规模证据更强，轮次分类反而更弱。公司 7 月 22 日官方发布稿称 Glow 以 $1.2B 估值、 $180M 融资走出隐身模式，由
              Sequoia、Cyberstarts、Greenoaks 和 Redpoint Ventures 领投，Index Ventures、 Swish Ventures、Lux Capital、Operator
              Collective 和 Holly Ventures 参投。TechCrunch 证实了同样估值和投资人组合， 但把融资描述为全股权 Series A。相比之下，CTech 将 Glow
              融资还原为种子轮、2025 年 Series A 和当前 Series B， 合计同样指向 $180M 标题。因此，投资人应把估值视为已有充分交叉证实；在交易文件出现前，确切轮次标签仍未解决。 


              融资故事变清晰的同时，商业证据也改善了。官方和独立来源称，Glow 已经拥有付费或已签约的企业客户，覆盖医疗、零售和金融服务。 当前首页发布了来自 Antares Capital、Fanatics、CAVA 和
              BMC Software 的具名引述，另有 Matthew Sharp 的背书。 距离客户数据集仍然差得很远——没有公开客户数、ARR、ACV 或续约披露——但比 2026
              年早些时候发布前稀薄的公开外显面强得多。
