      - number: '2.2'
        title: 规模判断：当下是端点核心，下一步是数据与 AI 治理邻近市场
        blocks:
          - type: paragraph
            body: >-
              Glow 当前商业机会最站得住的规模口径，是受约束的端点安全核心，而不是包罗万象的网络安全 TAM。 The Business Research Company 估计端点保护平台市场 2026 年为
              $6.31B，2030 年为 $9.34B； Fortune Business Insights 则把更宽的端点安全市场 2026 年估为 $17.79B，2034 年为 $34.40B。 Glow
              出售端点控制和软件治理能力时想切入的预算线，上限大概率由这些数字夹住。相邻类别也大到足以影响判断。 The Business Research Company 估算 DLP 2026 年为 $4.67B、2030
              年为 $12.53B；ResearchAndMarkets 估算内部人风险管理 2024 年为 $2.4B、2030 年为 $3.7B。DSPM 远未稳定：Palo Alto 的市场指南显示 2025 年估算从约
              $415M 到 $2B 不等，因为分析师对只计独立 DSPM，还是计入更宽平台模块并无共识； 另外两家出版方分别把该类别放在 2024 年 $1.42B 和 2023 年 $1.8B。AI
              治理的绝对美元规模小得多， 却是这组来源中增长最快的邻近市场，TBRC 预计从 2026 年 $0.61B 增至 2030 年 $2.63B。实际含义是， Glow
              进入的是一个拥有多个活跃预算池的市场簇，但公开数据还无法为「端点 AI 控制」给出干净的独立 SAM 或 SOM。
