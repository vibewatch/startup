  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、隐私与信任风险是最该先查的一组问题
        blocks:
          - type: paragraph
            body: >-
              Glow 所在的控制品类，同时贴近员工监控、软件治理和 AI 治理，这个组合带来真实的监管与信任复杂性。欧盟 AI Act 正通过 AI Office、各国主管机关，以及越来越多的配套文件和指南落地。NIST
              正积极修订其 AI 风险框架，并已发布面向关键基础设施 AI 风险管理的 2026 年概念说明。SEC 的网络安全披露规则也提高了董事会和管理层对治理与事件准备的预期。即使这些规则不直接适用于作为私营公司的
              Glow，它们也会塑造企业买方对处理安全敏感工作流的供应商的期待。


              端点和内部风险工作流还带来额外隐私问题。ICO 的员工监控指南明确指出，组织必须谨慎论证、限制和治理监控实践。Microsoft Insider Risk Management
              的隐私文档展示了成熟供应商在这一品类中如何定位：假名化、基于角色的访问控制、审计日志，以及对敏感指标的明确选择加入。Glow 的公开隐私政策和条款显示，公司已经考虑数据收集、托管、AI
              工具、服务提供商、监管机构和跨境传输。但同一份公开档案没有披露公开信任中心、第三方认证、状态页面、事件档案，或达到 Microsoft
              深度的隐私保护内嵌控制。文档页面被门控，外部无法检查产品在实践中如何处理敏感工作流。


              这并不证明 Glow 不合规。它意味着举证责任转入尽调。对于一家承诺自主修复、应用控制和端点级治理的公司，买方会合理追问策略动作如何限定范围、如何记录、如何复核、如何回滚。在 Glow
              能拿出这套证据包之前，监管与信任风险应被视为实质性风险，而不是假设性风险。
