      - 局限
    rows:
      - - Glow 2026 年 7 月发布
        - 私有估值
        - 估值 $1.2B，披露融资 $180M
        - 当前最佳公司特定锚点
        - ARR、结构或优先权细节未公开
      - - Glow 隐身期轮次历史
        - 私有估值
        - 据报道，2025 年 3 月约 $400M；2026 年 2 月发布前已超过 $1B
        - 显示 2026 年前估值快速上调
        - 公开来源对具体轮次分类和顺序不一致
      - - Cyberhaven 2025 年 4 月
        - 私有估值
        - $100M Series D 后估值约 $1B
        - 有用的相邻私有 AI / 数据安全可比
        - 产品、牵引力和成熟度不同
      - - CrowdStrike FY26 / 2026 年 7 月
        - 公开可比
        - 5.25B ARR；市值 $191.34B；2026 年末 P/S 23.1x
        - 显示规模化端点龙头可获得的溢价
        - 规模远大于 Glow，验证程度也高得多
      - - SentinelOne FY26 / 2026 年 7 月
        - 公开可比
        - 1.12B ARR；市值 $6.33B；2026 年末 P/S 4.75x
        - 有用的低倍数端点基准
        - 仍然远大于 Glow，且已上市
      - - Palo Alto FY25 / 2026 年 7 月
        - 公开可比
        - 收入 9.2B；市值 $269.19B；2026 年末 P/S 12.5x
        - 提供平台级安全公司溢价背景
        - 规模和产品广度无法与 Glow 对比
      - - Fortinet 2026 年 7 月
        - 公开可比
        - 市值 $117.67B；2025 年末 P/S 8.78x
        - 额外公开安全板块情绪锚点
        - 品类和成熟度不匹配
      - - SaaSDB / BVP 2026 基准
        - 市场基准
        - 安全公司中位数约 5.8x EV/Rev；公开 BVP Cloud Index 约 8x ARR；私有 AI 约 24x
        - 框定私募投资者可能使用的估值区间
        - 基准族无法判定 Glow 的真实匹配位置
    notes: 可比行是锚点，不是逐项对标的定价公式。
