  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局形态：直接融合型初创公司、套件在位者与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Glow 的竞争集合比「端点」这个词暗示的更宽。其公开产品语言位于端点控制、AI 治理、软件可见性和数据风险降低的交叉点，
              所以买方至少可以用三种不同方式完成同一项工作。第一类是直接融合型初创公司。Cyberhaven 是最强例子，因为它明确把 DSPM、 DLP、内部人风险管理和 AI
              安全整合到一个平台，并把数据检测与响应方法定位为传统 DLP 和内部威胁工具的替代。 Nudge Security 是另一个有意义的相邻同行：它不以端点执行开场，但从员工边缘切入同一个安全采用 AI 的问题，
              通过发现 AI 与 SaaS 使用、OAuth 授权和风险集成来解决，而且不使用传统代理或代理服务器。第二类是在位平台套件。 CrowdStrike、SentinelOne、Microsoft 和 Palo
              Alto Networks 都早已超出端点检测，延伸到身份、云、DLP、SIEM 和 AI 支持响应等相邻控制平面。第三类是现状替代方案和更窄工具，包括 ThreatLocker 这类允许列表或执行控制产品、传统
              DLP、 手工 AI 治理审查，以及基于端点和身份遥测的内部自建。因而，Glow 不只是在一张功能矩阵里争优劣； 它还要争取定义买方首先相信自己正在购买哪个类别的权利。
