chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品框架与法律实体图景
        blocks:
          - type: paragraph
            body: >-
              Glow Security，对外营销品牌为 Glow，现在已经明显是一家真实运营公司，而不只是隐身融资传闻。 官方首页和 2026 年 7 月 22 日发布稿称其为「端点 AI
              公司」，并把平台定义为现代端点的预防优先控制层。 Glow 表示，其 AI 智能体会持续发现员工设备上的软件、AI 工具、插件和其他执行面；在策略上下文中映射风险；
              并在风险或未授权软件进入环境、演变成事件之前将其拦住。这套表述与传统 EDR 语言明显不同， 后者通常强调可疑活动出现后的检测与响应。 


              法律和运营外显面也比 2026 年早些时候成熟。Glow 的隐私政策列明 Glow Security Ltd， SaaS 条款则以 Glow Security, Inc.
              名义起草，指向以色列初创公司常见结构：以色列运营实体加美国商业签约实体。 网站现在已有发布稿、关于页面、招聘页、支持、活动、条款、隐私、博客和 Black Hat 活动页面。
              即使它仍没有开放的信任中心、公开定价或开放技术文档，这也足以判断公司已经从隐身状态进入受控商业化。
