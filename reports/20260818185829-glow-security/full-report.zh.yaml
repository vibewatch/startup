  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 公开材料中可见的收入模式与变现结构
        blocks:
          - type: paragraph
            body: >-
              Glow 最强的公开财务事实仍是变现机制，而不是收入数量。其 SaaS 条款清楚描述了按订单销售的订阅软件， 以美元开票，并可通过直接或渠道协助路线获得。这仍符合高 ACV 企业 B2B
              动作，而不是消费者、硬件或自助式软件模式。 发布后改变的不是价格透明度，而是规模信号：官方和独立来源现在称 Glow 已有已签约或付费企业客户， TechCrunch
              称典型部署可覆盖数万台设备。这支持一个判断：Glow 销售的是大环境里的端点和治理问题，而不是小部门试点。 


              公开材料仍未揭示的是这套销售动作的商业质量。没有公开标价，没有每端点或每用户模型，没有标准合同期限， 也没有披露订阅、服务或渠道来源收入之间的构成。发布提升了外界对 Glow 是真实企业供应商的信心，
              但并未实质改善公众对其变现质量的理解。
