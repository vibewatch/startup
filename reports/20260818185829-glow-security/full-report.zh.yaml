            body: >-
              Glow
              的客户章节现在强于纯隐身叙事，但仍明显弱于成熟增长型公司的客户档案。公司有新的具名背书，这些背书横跨多个企业垂直行业，独立报道也称多个行业存在付费客户。这是有意义的正向信号，因为许多刚公开的安全创业公司仍只依赖匿名引语或投资人叙事。


              局限在于，初始证明之后的每一个承销问题，在公开材料里都没有答案。已审阅来源没有说明 Glow
              有多少客户、哪些可见背书是付费生产部署、部署有多广、是否有客户续约，或业务簿可能有多集中。因此，正确下一步不是否定客户故事，而是用账户级数据审问它。今天的公开证据支持企业相关性，不支持持续商业规模。
