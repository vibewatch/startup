      - number: '3.2'
        title: 竞争者画像：谁最能压制 Glow，为什么
        blocks:
          - type: paragraph
            body: >-
              Cyberhaven 是最相关的初创公司标杆，因为它比今天的 Glow 更明确地销售同一套融合故事。其官方材料称它统一 DSPM、 DLP、IRM 和 AI 安全；2025 年 4 月融资公告显示，公司完成
              $100M Series D、累计融资达到 $250M 后， 投资人愿意按 $1B 估值为这一命题定价。Nudge Security 规模较小，但战略上重要的相邻玩家。其 2025 年 Series A
              公告称，公司已接近 200 个客户，并连续两年 ARR 增长 3x，重点做 Workforce Edge 发现、治理， 以及围绕 SaaS 和 AI 使用的用户提醒。这给同一个影子 AI
              和影子应用问题提供了更轻、更快部署的答案，尽管原生端点执行色彩更弱。 在位标杆阵容很强。CrowdStrike 2026 财年以 $5.25B ARR 收官，并把自己定义为 AI 关键任务基础设施；
              SentinelOne 收入超过 $1B，并称客户正在把 Singularity 标准化为统一平台；Palo Alto Networks 2025 财年收入 $9.2B， 依托强大渠道网络销售，并把 XDR
              延伸到 DLP 和云安全运营；Microsoft 则可以通过 Defender、Purview、Intune、 Entra 和 M365 打包推送类似功能。面对这一赛场，Glow
              最好的机会不是比巨头更会打包，而是在端点控制层比巨型套件和数据治理优先的初创公司都更精准、更容易落地。
