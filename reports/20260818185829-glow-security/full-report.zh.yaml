    summary: Glow 的估值最受隐藏运营指标和条款结构影响，单靠 TAM 叙事不够。
    data:
      items:
        - label: ARR / 增长质量
          value: 10
        - label: 留存 / 集中度
          value: 9
        - label: 融资轮结构 / 稀释
          value: 8
        - label: 部署 / 利润率组合
          value: 8
        - label: 竞争胜率
          value: 7
        - label: 品类顺风
          value: 5
    claimRefs:
      - CV003
      - CV015
      - CV018
      - CV027
      - CV031
      - CV032
      - CV036
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开记录支持的是宽区间，而不是单一公允价值。
    data:
      items:
        - label: 悲观估值区间
          low: 0.5
          high: 0.9
          unit: $B
          note: 商业化质量不及预期，或条款结构不利
        - label: 基准估值区间
          low: 1
          high: 2
          unit: $B
          note: 品类楔子和牵引力真实存在，但持久性证据仍只属中等
        - label: 乐观估值区间
          low: 3
          high: 5
          unit: $B
          note: 需要隐藏 ARR、留存和部署质量异常强
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Glow 在战略吸引力上得分较高，在公开估值精度上较弱。
    data:
      items:
        - label: 市场时点
          value: High
          sublabel: Endpoint + AI governance urgency
        - label: 牵引力证明
          value: Medium
          sublabel: Named references, but sparse cohorts
        - label: 经济性可见度
          value: Low
          sublabel: ARR / NRR / margin undisclosed
        - label: 估值信心
          value: Medium-Low
          sublabel: Wide band, current price evidence-sensitive
    claimRefs:
      - CV002
