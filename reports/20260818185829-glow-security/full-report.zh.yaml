      - number: '5.2'
        title: 架构、部署模型、集成与运营工作流
        blocks:
          - type: paragraph
            body: >-
              Glow 的条款和文档外显面暴露出足够运营细节，可以勾勒架构，尽管工程蓝图并未公开。产品以远程访问的安全 SaaS 交付，
              但协议也考虑了安装在客户场所的服务组件，因为更新和升级可能远程维护这些组件。这种混合语言很重要。 它暗示 Glow 不只是浏览器仪表盘或被动 SaaS 控制台；部分执行或遥测元素可能靠近端点，管理和分析则在云端。
              网站暗示的运营工作流很直接：盘点正在运行的内容，分类重要事项，创建或调优策略，接入相邻系统，然后支持持续修复和监控。 文档门户证实开发者接口存在，但被访问码门禁限制；也就是说，API
              外显面的存在是公开的，细节不是。


              部署故事比文档深度更可信。条款提到账户设置、用户账户、接入客户或第三方系统、SLA 下的支持和维护， 用于安装、部署、配置、定制、集成和培训的可选专业服务，以及通过直接或渠道路线购买的能力。
              这是一套面向生产使用的企业平台运营词汇，不是轻量自助工具。支持页显示有活跃支持邮箱和咨询流程， 隐私政策提到客户联系人和账单信息、展会展位、网络研讨会，以及与当前和潜在客户的互动。 公开活动页进一步证明 Glow
              正在积极推进演示和现场接触。所有这些都说明，Glow 预期部署需要安全、IT， 可能还包括采购干系人之间的协调，这与问题类别吻合。


              竞争对手文档凸显了 Glow 实践中可能必须达到的水平。Microsoft Defender for Endpoint 现在呈现为成熟企业栈： 把端点信号送入统一门户，开放 API 做工作流集成，并覆盖
              Windows、macOS、Linux、Android 和 iOS。 Palo Alto 的 Cortex XDR 同样营销一个跨端点、网络、云、身份和邮件来源的一体化工作流。 Nudge Security 的
              Workforce Edge 材料展示了另一种架构：避免重代理，转而通过身份和 API 中心技术发现 SaaS 与 AI 使用。 Glow 的独特主张不同于两者。它似乎把端点作为主要控制点，同时仍触达软件、插件和
              AI 供应链。 尽调挑战在于，Glow 尚未发布足够实施细节，无法说明工作流中有多少是端点代理、有多少是云分析，又有多少依赖客户侧集成。
