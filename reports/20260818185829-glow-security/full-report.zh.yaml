      - number: '8.4'
        title: 退出逻辑可信，但承销就绪仍取决于缺失指标和轮次条款
        blocks:
          - type: paragraph
            body: >-
              如果隐藏指标强，Glow 有可信的退出路径。战略上，大型安全平台会继续围绕
              AI、端点和软件治理主题买入或自建。财务上，成长型投资者仍愿意押注早期看起来像品类领导者的公司。但退出可信不等于承销就绪。这里的即时尽调负担更重，因为公司以独角兽估值公开发布，却没有公布通常用于支撑该价格的运营指标。


              投资者需要当前 ARR、净留存、集中度、毛利率构成、服务负担，以及确切的 2026 年融资文件。他们还需要一个清晰解释：当前资本化应被理解为单一 Series
              A、累计隐身融资历史，还是不同口径下两者都成立。在这套材料出现之前，Glow 重要到不能忽视，也不透明到不能按表面信息直接背书。
