          - type: paragraph
            body: >-
              Glow 的采用轨迹仍要从证据质量信号里反推，而不是从经典 SaaS 指标里读取，但发布后的信号更好了。公司从隐身报道走向公开发布，官网有当前客户背书，Black Hat 有露出，活动页面已经搭起，第三方报道也称
              Glow 已经从隐身转入真实商业部署。这一进展重要，因为它说明 Glow 相信自己已有足够商业信心公开展示具名证明，并用现场营销把这些证明转成销售管线。


              即便如此，证据质量仍是背书级，而不是指标级。具名引语有价值，因为它们把 Glow
              连接到真实组织和资深负责人；但这些引语仍没有量化上线范围、端点数量、合同金额，也没有说明任何部署是否已经续约或扩张。官网的结果表述仍停留在营销层面，因为没有提供方法、样本量或基线。实际结论是，Glow
              现在有足够客户证据支撑严肃尽调，但还不足以高置信度承销留存、扩张或集中度。
