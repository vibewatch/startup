  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Glow 销售的问题到底是什么
        blocks:
          - type: paragraph
            body: >-
              不应把 Glow 只放进又一家端点杀毒或 EDR 初创公司的市场地图。其当前首页和条款描述的是一个企业软件平台， 目标是控制端点上运行的内容、暴露软件和 AI 工具使用，并帮助组织安全采用 AI。这把 Glow
              推入一个融合控制层： 端点执行、内部人风险监控、数据防泄漏和 AI 治理工作流越来越重叠。CISA 的内部威胁框架和 Microsoft Insider Risk Management
              产品文档尤其适合界定边界，因为它们显示企业问题已不只是恶意软件防护；还包括授权用户滥用访问权限、 无意数据泄露、有风险的浏览器或 AI 行为，以及调查政策违规的治理流程。Palo Alto 的 DSPM
              材料加入了相邻的数据优先视角， 强调跨混合环境的发现、分类、访问监控和策略执行。因此，Glow 的正确市场边界是分层的：设备边缘的核心端点软件可见性与控制，
              外围的数据和内部人风险治理，以及作为增长最快邻近市场的新兴 AI 治理支出。应排除在边界外的是通用网络安全、防火墙支出、 传统 SIEM 日志存储，或无差异化的 SMB 杀毒。
