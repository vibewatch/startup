            body: >-
              资本形成现在同时是最清晰的公开财务强项，也是最清晰的公开文档缺口。Glow 2026 年 7 月官方发布材料称， 公司以 $1.2B 估值、$180M 融资走出隐身模式。TechCrunch
              证实了同一价格点和投资人阵容，但称该融资为全股权 Series A。 CTech 则还原出三轮隐身历史——种子轮、2025 年 Series A 和当前 Series B——合计同样为 $180M。
              这意味着外部投资人可以相信 Glow 已筹集大量资本，但还无法从公开证据判断，当前交割究竟有多少现金进入资产负债表， 多少来自此前隐身轮次。 


              运营数据缺口仍然严重。即使发布之后，本文审阅的公开来源也没有披露 ARR、收入运行率、NRR、毛利率、客户数、 月度烧钱速度或当前现金余额。正确判断因此是：Glow 很可能有足够资本支持近期产品和 GTM 扩张，
              但外部人仍看不出公司是在高效扩张，还是只是在昂贵扩张。
