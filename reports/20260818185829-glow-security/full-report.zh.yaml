      - number: '1.4'
        title: 里程碑、商标与仍然存在的公开信息边界
        blocks:
          - type: paragraph
            body: >-
              Glow 的公开里程碑节奏异常压缩。公司成立于 2025 年，在 2025 年和 2026 年初完成隐身期融资， 在发布前的以色列报道中以即将出现的网络安全独角兽露面，随后于 2026 年 7 月 22 日以
              $1.2B 估值正式走出隐身模式。 到 8 月初，它已经把这次发布转化为高可见度的 Black Hat 激活；到 8 月中旬，Roi Tiger 发表创始人文章， 明确把 Glow 定义为 AI
              时代的预防优先端点公司。招聘页又给出一个有用成熟度信号：多数工程岗位在 Tel Aviv， 多数公开销售和营销岗位在美国，符合经典的 Israel-R&D / U.S.-GTM 运营分工。 


              最大剩余缺口仍是融资精度和商业透明度。公开来源在估值标题上对齐，但没有对齐 $180M 究竟是一轮正式标记的 Series A， 还是多轮隐身融资的累计结果。它们也仍未披露
              ARR、烧钱速度、毛利率、客户数、董事会构成或详细轮次结构。 员工数比以前更有锚点——TechCrunch 称接近 100 人、约 70% 在以色列，CTech 称总数约 100 人、约 65 人在以色列——
              但即便如此仍停留在区间层面，未经过审计。正确的概览结论是：Glow 现在像一家真实运营供应商， 但为晚期私募投资承销保留了太多信息。
