  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围、模块地图与 Glow 销售的客户任务
        blocks:
          - type: paragraph
            body: >-
              Glow 自己的语言现在让客户任务变得清楚。公司自称「端点 AI 公司」，并反复表示会帮助安全团队控制端点上运行的一切。 网站把这个承诺收敛成三个实际产品桶：安全采用
              AI、软件可见性与控制、资产库存管理。这些不是随机营销标签。 合在一起，它们指向一个平台：先发现员工设备上的软件和工具，再延伸到插件、包、MCP 服务器和 AI 应用的治理，
              然后加入策略或访问控制，让环境长期保持干净。条款也强化了这一点：产品作为企业 SaaS 销售，功能和订阅范围由订单定义， 而不是一个单一盒装代理。因而，Glow 看起来不像传统 EDR
              替代品，更像以端点为执行点构建的软件治理控制层。


              商标记录尤其有价值，因为它暴露了首页只隐约提示的功能。GLOW 和 AUTONOMOUS FENCING 申请描述了自适应允许列表、 风险评分、应用执行策略创建和执行、基于 AI 的可执行文件分类、遥测报告、通过
              API 与第三方系统集成，以及控制应用访问数据。 这些语言支持至少五个逻辑组件的模块地图：端点发现和遥测、软件和 AI 盘点、策略与执行控制、AI 或规则辅助分类和修复，
              以及面向更宽企业安全栈的集成输出。公开网站的客户语言也符合这一解读。Antares 关注把环境清干净并理解实际运行内容； Xactly 强调 AI
              治理与更宽软件治理之间的连接；匿名工程引述强调自主修复。合起来看，平台意图似乎是先降低软件蔓延， 再自动化控制动作。


              Glow 的公开产品组合外显面仍处早期，但不再为空。博客中心已有 Product、Customer Stories、Glow Labs 和 Industry Insights 分类，活动外显面围绕 Black
              Hat 2026 保持活跃。这说明公司正在围绕端点 AI 控制构建品类叙事，而不是继续把产品完全藏起来。 即便如此，仍没有公开定价页、公开包装矩阵，也没有对外开放的技术文档集。投资人应把 Glow
              视为拥有连贯产品论点和初现模块结构的公司， 但其外部可见产品文档仍更接近发布期营销，而不是成熟平台手册。
