      - number: '3.3'
        title: 能力、定价与锁定：Glow 能赢在哪里，又暴露在哪里
        blocks:
          - type: paragraph
            body: >-
              从能力看，赛场清晰分成几类强项。Cyberhaven 最强在数据血缘、上下文阻断和数据中心化调查；Nudge 最强在轻代理发现、 SaaS 与 AI 盘点，以及塑造行为的治理；ThreatLocker
              最强在默认拒绝式硬执行控制；大型套件最强在宽度、采购熟悉度和相邻控制平面集成。 Glow 的机会在于，上述模型没有一个能用单一简单叙事完美结合端点原生执行、广泛软件可见性和 AI 专项治理。
              风险在于，每个对手已经占住买方心智模型的一块。定价和包装会放大这种风险。Microsoft 可以把功能藏在或补贴进更宽的 M365 与安全套件。 CrowdStrike 至少有一个可见的线上入口 Falcon
              Go，覆盖最多 100 台设备；其企业平台则通过扩展和模块采用变现。 Cyberhaven、SentinelOne、Palo Alto 和 Glow 都更像报价主导的企业销售动作，ThreatLocker
              使用定价主导的漏斗， 但最终仍落到销售对话，而不是公开标价。这意味着切换成本和锁定效应更多来自部署，而不是标题价格。一旦买方已经部署端点代理、
              调查工作流、策略逻辑、身份集成和渠道承诺，即使技术上可行，多栖使用在运营上也会变贵。因此，Glow 必须证明其信号质量、 AI
              治理相关性或运营简洁性足够强，能让买方新增一个控制平面，而不是向在位套件提一个功能需求。
