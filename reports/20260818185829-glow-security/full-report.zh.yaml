  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方角色，以及 Glow 明确切入的需求
        blocks:
          - type: paragraph
            body: >-
              Glow 的客户证明数量仍少，但形态已经比纯隐身期故事明显更宽。当前官网点名 Antares Capital、Fanatics、CAVA 和 BMC
              Software，每条引语都来自资深安全或技术负责人，而不是匿名从业者。这很重要，因为它暗示 Glow 正卖进端点治理、AI
              采用和软件控制问题已经进入高管视野的组织。可见样本覆盖的垂直行业也比之前更宽：Antares 代表私募信贷和金融服务，Fanatics 代表消费零售，CAVA 代表餐饮和分布式运营，BMC 代表企业 IT 运营。


              这些引语指向的客户任务很一致。Antares 强调把环境清理干净，并理解企业内部正在运行什么；Fanatics 强调预防能力提升；CAVA 强调减少手工管理，并提高自主策略执行；BMC 则把 Glow
              视为一个能以 AI 速度降低风险的端点控制点。合在一起看，这些背书说明 Glow 正卖给希望在一个动作里完成发现、治理和修复的安全与 IT 领导者，而不只是卖一款狭窄的资产清点工具。


              公开档案仍未证明的东西同样重要。公司没有披露客户数、席位数、ACV 区间、上线范围或续约行为。TechCrunch 明确表示，Glow
              拒绝披露宽泛行业类别之外的客户姓名和数量。因此，投资者应把客户表层理解为真实的早期企业相关性证明，而不是可支撑持续采用的数据集。
