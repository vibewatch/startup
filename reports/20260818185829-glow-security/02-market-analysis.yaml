- id: sizing-lenses
  title: 'Sizing lenses: endpoint core today, data and AI governance adjacencies next'
  body: 'The most defensible size lens for Glow''s current commercial opportunity is a constrained endpoint-security core rather than a catch-all cybersecurity TAM. The Business Research Company estimates the endpoint protection platform market at $6.31 billion in 2026 and $9.34 billion by 2030, while Fortune Business Insights puts the broader endpoint security market at $17.79 billion in 2026 and $34.40 billion by 2034. Those figures likely bracket the upper bound of the budget line Glow wants to tap when it sells endpoint control and software-governance capabilities. Adjacent categories are also large enough to matter. The Business Research Company sizes DLP at $4.67 billion in 2026 and $12.53 billion in 2030, while ResearchAndMarkets sizes insider risk management at $2.4 billion in 2024 and $3.7 billion by 2030. DSPM is much less settled: Palo Alto''s market guide shows 2025 estimates ranging from roughly $415 million to $2 billion because analysts disagree on whether to count only standalone
    DSPM or broader platform modules, while two other publishers place the category at $1.42 billion in 2024 and $1.8 billion in 2023 respectively. AI governance is much smaller in absolute dollars, but it is the fastest-growing adjacency in this source set, with TBRC projecting $0.61 billion in 2026 to $2.63 billion by 2030. The practical implication is that Glow is entering a market cluster with multiple active budget pools, but public data does not support a clean standalone SAM or SOM for ''endpoint AI control'' yet.'
