  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: No reviewed public source isolates a standalone SAM or SOM for Glow's combined endpoint-control, insider-risk, and AI-governance wedge.
    whyItMatters: A blended category can look very large while still hiding a much narrower budget line that is realistically open to an independent startup.
    diligencePath: Request management's internal segmentation model showing pipeline, ACV, and target accounts by budget line (endpoint, data security, compliance, AI governance).
    relatedQuestionRefs:
    - QM011
    - QM025
  - type: private-evidence-only
    severity: material
    topic: pricing-and-packaging
    missingEvidence: No reviewed source disclosed Glow's pricing model, unit of sale, deployment minimums, or whether the platform is sold by endpoint, user, module, or data volume.
    whyItMatters: Pricing structure determines whether Glow competes first against endpoint suites, insider-risk tools, or data-security platforms and shapes gross-margin potential.
    diligencePath: Request current price book, example order forms, packaging roadmap, and win-loss notes on price objections.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-owner
    missingEvidence: Public sources do not reveal which budget owner actually pays for Glow in live deals or whether the company lands through security, IT, or AI-governance programs.
    whyItMatters: Budget-line ambiguity is one of the biggest risks in converged control categories because it can elongate sales cycles and increase incumbent competition.
    diligencePath: Ask for closed-won deal summaries naming economic buyer, champion, procurement path, and displaced alternative.
    relatedQuestionRefs:
    - QM014
    - QM024
  - type: missing-source
    severity: material
    topic: independent-deployment-proof
    missingEvidence: Public evidence does not show independent case studies quantifying deployment breadth, policy volumes, or measurable ROI for Glow.
    whyItMatters: Market attractiveness alone does not prove that Glow's product fits enterprise workflows well enough to survive incumbent bundle pressure.
    diligencePath: Request customer references, deployment architecture diagrams, and before/after metrics on risky-tool discovery, policy coverage, and alert quality.
    relatedQuestionRefs:
    - QM024
    - QM025
  - type: conflicting-data
    severity: minor
    topic: market-size-dispersion
    missingEvidence: Published DSPM and IRM market estimates differ substantially across sources because each publisher draws the category boundary differently.
    whyItMatters: Overstating the category from the highest estimate could mislead valuation logic or hide how much overlap exists with incumbent suites.
    diligencePath: Use management's actual competitor set and deal mix to build a bottoms-up market model instead of relying on one syndicated TAM source.
    relatedQuestionRefs:
    - QM009
    - QM011
