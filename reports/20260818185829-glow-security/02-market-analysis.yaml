tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Typical buyer / payer
  - Why it matters for Glow
  rows:
  - - Endpoint control and visibility
    - Software inventory, execution control, agent-based endpoint telemetry, risky tool discovery, policy enforcement on endpoints
    - Commodity antivirus renewals, pure mobile-device management, generic SIEM storage
    - CISO, endpoint security lead, security engineering
    - Closest match to Glow's public promise to control what runs on endpoints
  - - Insider risk management
    - Behavior monitoring, data-theft detection, risky browser or AI usage, alert triage, investigation workflows
    - Physical security programs, HR-only misconduct tooling, generic UEBA without response workflow
    - Security, compliance, insider-risk or investigations owner
    - Matches enterprise demand for catching misuse by authorized users
  - - Data loss prevention
    - Endpoint, email, web, SaaS, and cloud controls for preventing sensitive-data leakage
    - Pure backup, archive, and storage optimization spend
    - Security operations, data protection, compliance
    - Relevant because Glow touches software use and data movement on the device edge
  - - DSPM and data governance adjacency
    - Data discovery, classification, access mapping, policy enforcement, hybrid/multicloud data posture
    - Infrastructure CSPM without data context, pure database tooling
    - Data security, cloud security, compliance, platform security
    - Important adjacent budget when Glow expands from endpoints into AI/data governance
  - - AI governance and safe adoption
    - Policy guardrails, auditability, model-use oversight, prompt/data governance, shadow-AI control
    - Model-building infrastructure not tied to policy or security outcomes
    - Executive AI governance group, security, legal, risk
    - Fastest-growing adjacency and a strong fit with Glow's safe-AI language
  notes: Boundary logic separates Glow's endpoint core from adjacent insider-risk, DLP, DSPM, and AI-governance spend rather than forcing one blended category.
