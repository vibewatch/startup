- id: capabilities-pricing-lockin
  title: 'Capability, pricing, and lock-in: where Glow can win and where it is exposed'
  body: On capabilities, the field splits cleanly into different strengths. Cyberhaven is strongest on data lineage, contextual blocking, and data-centric investigations; Nudge is strongest on agent-light discovery, SaaS and AI inventory, and behavior-shaping governance; ThreatLocker is strongest on hard deny-by-default execution control; and the big suites are strongest on breadth, procurement familiarity, and adjacent control-plane integration. Glow's opportunity is that none of those models perfectly combines endpoint-native enforcement, broad software visibility, and AI-specific governance in a single simple narrative. The risk is that each rival already owns a piece of the buyer's mental model. Pricing and packaging intensify that risk. Microsoft can hide or subsidize functionality inside broader M365 and security bundles. CrowdStrike has at least one visible online entry point through Falcon Go for up to 100 devices, while its enterprise platform monetizes via expansion and module
    adoption. Cyberhaven, SentinelOne, Palo Alto, and Glow all behave more like quote-led enterprise sales motions, and ThreatLocker uses a pricing-led funnel that still resolves into a sales conversation rather than public list prices. That means switching cost and lock-in come more from deployment than from headline price. Once a buyer has endpoint agents, investigation workflows, policy logic, identity integrations, and channel commitments in place, multi-homing becomes operationally expensive even if technically possible. Glow therefore must prove that its signal quality, AI-governance relevance, or operational simplicity is strong enough to justify a new control plane rather than a feature request to an incumbent suite.
