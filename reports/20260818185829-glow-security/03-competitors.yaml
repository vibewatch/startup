  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: competitive-win-rate
    missingEvidence: No reviewed public source disclosed Glow's direct win-loss rates, named displaced competitors, or share of pipeline won against incumbents versus startups.
    whyItMatters: Competitive framing is only partially useful without evidence that buyers actually choose Glow over Cyberhaven, Microsoft, CrowdStrike, or other alternatives.
    diligencePath: Request CRM-based win-loss analysis, top-opportunity competitor tags, and at least five recent closed-won/closed-lost deal memos.
    relatedQuestionRefs:
    - QP024
    - QP025
  - type: private-evidence-only
    severity: material
    topic: pricing-benchmark
    missingEvidence: Public sources do not disclose Glow's list pricing, discount bands, or realized contract structures compared with direct competitors.
    whyItMatters: Without package-level pricing evidence, it is impossible to judge whether Glow wins on ROI, bundle avoidance, or functional superiority.
    diligencePath: Request price book, standard order forms, realized ASPs, and competitor pricing intelligence from sales enablement.
    relatedQuestionRefs:
    - QP018
    - QP024
  - type: missing-source
    severity: material
    topic: customer-validated-differentiation
    missingEvidence: No independent customer case study reviewed here quantified why buyers selected Glow over Cyberhaven, ThreatLocker, Microsoft, or endpoint incumbents.
    whyItMatters: Public vendor positioning can exaggerate differentiation; customer decision criteria usually reveal whether the wedge is durable or cosmetic.
    diligencePath: Interview at least three reference customers and request documented bake-off results.
    relatedQuestionRefs:
    - QP022
    - QP024
  - type: private-evidence-only
    severity: material
    topic: channel-strategy
    missingEvidence: Public sources do not show whether Glow is building direct sales only or adding MSP, MSSP, VAR, or cloud-marketplace leverage.
    whyItMatters: Channel distribution is one of the main structural advantages held by incumbents and can materially affect CAC and speed-to-scale.
    diligencePath: Request current channel roadmap, partner roster, and revenue contribution by route to market.
    relatedQuestionRefs:
    - QP019
    - QP023
