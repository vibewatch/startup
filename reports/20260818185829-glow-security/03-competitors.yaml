- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation vs Glow
  rows:
  - - Cyberhaven
    - Direct converged startup
    - Raised $100M Series D at $1B valuation; $250M total funding
    - Large enterprises with data-protection, insider-risk, and AI-security needs
    - Data lineage, DDR, contextual blocking, unified DSPM/DLP/IRM/AI security
    - More data-centric than endpoint-centric; Glow may be simpler if buyer starts at device control
  - - Nudge Security
    - Adjacent startup
    - Raised $22.5M Series A; nearly 200 customers; 3x ARR growth for two years
    - Cloud-native organizations managing SaaS and AI sprawl
    - Perimeterless discovery, workforce nudges, SaaS/AI governance without heavy agents
    - Less native endpoint enforcement depth than Glow claims
  - - CrowdStrike
    - Endpoint/security-suite incumbent
    - FY26 ARR $5.25B; FY26 revenue $4.81B
    - Enterprise and upper-midmarket buyers standardizing on Falcon platform
    - Brand, scale, module expansion, AI narrative, channel reach
    - Can be broader and heavier than a focused control-layer sale
  - - SentinelOne
    - Endpoint/security-suite incumbent
    - FY26 revenue $1.00B; ARR $1.12B; 1,667 $100k+ ARR customers
    - Enterprise buyers seeking unified AI-native security platform
    - Unified endpoint/identity/cloud positioning and upmarket momentum
    - Still primarily known as endpoint/XDR, not pure AI-governance control
  - - Microsoft
    - Bundled suite incumbent
    - Sold through Microsoft 365 enterprise packaging
    - Large installed-base customers already standardizing on M365, Entra, Intune, Defender, and Purview
    - Bundle power, identity and endpoint control, insider-risk and cloud-app discovery in one estate
    - Can be slower, more complex, and tied to Microsoft-first workflows
  - - Palo Alto Networks
    - Broad platform incumbent
    - FY25 revenue $9.2B; almost all Fortune 100 and majority of Global 2000 as customers
    - Large enterprises buying integrated SecOps and cloud platforms
    - Channel power, XDR + DLP + cloud + AI-driven SOC breadth
    - Glow is more focused if buyer wants device-edge control before full SOC transformation
  - - ThreatLocker
    - Status-quo substitute / narrow specialist
    - Private; pricing led through sales funnel
    - Organizations prioritizing hard execution control and allowlisting
    - Deny-by-default application control; deploy in hours to days
    - Narrower than Glow on AI governance, data lineage, and broader analytics
  notes: The table separates direct converged startups from platform incumbents and narrower substitutes because buyers can solve Glow's job in fundamentally different ways.
