- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Endpoint-first AI governance wedge
    - Cyberhaven and Nudge already define adjacent convergence narratives
    - High
    - If buyers map Glow to data security or workforce-edge governance, Glow loses narrative ownership
    - Get win-loss notes showing why buyers choose Glow over both Cyberhaven and Nudge
  - - Operational simplicity versus suites
    - Microsoft, CrowdStrike, SentinelOne, and Palo Alto can bundle adjacent controls
    - High
    - Bundle economics can overwhelm point-product ROI even when functionality is weaker
    - Prove materially faster deployment, lower false positives, or better analyst efficiency
  - - Execution control differentiation
    - ThreatLocker and allowlisting substitutes already own deny-by-default messaging
    - Medium
    - Glow needs to show why app control alone is not enough
    - Document where AI/tool governance adds value beyond allowlisting
  - - Fast scaling backed by large rounds
    - Endpoint category has punished companies that scaled without durable advantage
    - High
    - Cybereason's value collapse shows category volatility and investor impatience
    - Request current burn, sales efficiency, and customer-retention evidence
  - - Cross-platform integrations and workflows
    - Buyers increasingly expect APIs, SIEM integrations, and role-based investigations
    - Medium
    - Weak integrations raise switching friction and hurt enterprise fit
    - Request integration map, roadmap, and major-platform reference architectures
  - - Platform breadth pressure
    - Glow may be seen as a feature rather than a platform if public proof remains thin
    - High
    - Foundational platforms win budget control while features get bundled away
    - Need customer reference calls on mission-critical use cases and expansion behavior
  notes: The largest competitive threat is not lack of demand; it is the probability that better-distributed platforms collapse the category before Glow proves durable differentiation.
