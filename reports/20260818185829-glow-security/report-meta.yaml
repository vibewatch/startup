companyProfile:
  summary: Glow Security, publicly branded as Glow, is an Israeli-founded endpoint security startup that emerged from stealth in July 2026. The company positions itself as the Endpoint AI Company and sells a prevention-first platform that discovers software, AI agents, and tools running on enterprise devices, reasons about risk in policy context, and helps security teams stop risky software before it becomes an incident. Public proof is strongest on founder quality, investor quality, named enterprise references, and the July 2026 valuation anchor, and weakest on the operating metrics and transaction detail needed for late-stage underwriting.
