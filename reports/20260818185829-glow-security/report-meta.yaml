  topStrengths:
  - Founder-market fit is strong, with Meta, Onavo, Snowflake, and Claroty lineage concentrated in the core team.
  - Glow emerged publicly with a rare $1.2B valuation and a blue-chip investor roster led by Sequoia, Cyberstarts, Greenoaks, and Redpoint.
  - 'The product thesis is timely: prevention-first endpoint control for software, tools, and AI agents in enterprise environments.'
  - Named public references from Antares Capital, Fanatics, CAVA, and BMC Software are stronger proof than a typical stealth-era cyber launch.
  topRisks:
  - ARR, retention, gross margin, burn, and customer count remain undisclosed despite the unicorn valuation.
  - Public sources disagree on whether the 2026 financing should be understood as Series A or cumulative stealth rounds, weakening valuation precision.
  - Large endpoint incumbents can bundle adjacent controls with far greater distribution and proof packages.
  - Trust, privacy, and governance expectations are unusually high for a company that wants control over what runs on employee endpoints.
  unresolvedGaps:
  - Current ARR, growth rate, gross margin, and net retention.
  - Executed 2026 financing documents reconciling the official launch disclosure with conflicting public round labels.
  - Customer count, concentration, deployment scope, and renewal behavior behind the named references.
  - Board composition, investor rights, and the full trust / compliance packet expected by large enterprise buyers.
