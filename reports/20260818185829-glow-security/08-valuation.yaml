- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - ARR and growth quality
    - Current ARR, bookings bridge, revenue mix, and growth cadence
    - Core input for every valuation multiple comparison
    - Finance team / data room
  - - Retention and concentration
    - NRR, GRR, churn, and top-10 customer exposure
    - Separates promising logo set from durable economics
    - Finance + RevOps / data room
  - - Margin and services burden
    - Gross margin split across software, support, and services
    - Determines whether Glow deserves software-like valuation treatment
    - Finance + customer success
  - - Financing taxonomy
    - Executed 2026 financing documents reconciling official release, TechCrunch, and CTech
    - Determines maturity, dilution, and how much fresh primary cash actually entered the business
    - Legal + finance / transaction docs
  - - Round structure
    - Primary vs secondary, preferences, governance rights, and dilution terms
    - Determines true investor outcome at a headline price
    - Legal + finance / transaction docs
  - - Deployment reality
    - Implementation timeline, rollback burden, module attach, and support load
    - Tests scalability and expansion assumptions
    - Field diligence + reference calls
  - - Competitive proof
    - Recent win-loss record versus suites and AI-governance adjacencies
    - Tests whether the wedge translates into a durable moat
    - Sales ops + customer references
  notes: These asks are the minimum required to move from intrigue to underwriting.
