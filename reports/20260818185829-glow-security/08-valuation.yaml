- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Glow Jul 2026 launch
    - Private valuation
    - $1.2B valuation with $180M disclosed funding
    - Best current company-specific anchor
    - No ARR, structure, or preference detail public
  - - Glow stealth round history
    - Private valuation
    - ~$400M in Mar 2025; >$1B pre-launch by Feb 2026 reporting
    - Shows rapid mark-up into 2026
    - Public sources disagree on exact round taxonomy and sequencing
  - - Cyberhaven Apr 2025
    - Private valuation
    - ~$1B valuation after $100M Series D
    - Useful adjacent private AI/data-security comp
    - Different product, traction, and maturity
  - - CrowdStrike FY26 / Jul 2026
    - Public comp
    - 5.25B ARR; $191.34B market cap; 2026 year-end P/S 23.1x
    - Shows what premium scaled endpoint leadership can earn
    - Far larger and far more proven than Glow
  - - SentinelOne FY26 / Jul 2026
    - Public comp
    - 1.12B ARR; $6.33B market cap; 2026 year-end P/S 4.75x
    - Useful lower-multiple endpoint benchmark
    - Still far larger and public
  - - Palo Alto FY25 / Jul 2026
    - Public comp
    - 9.2B revenue; $269.19B market cap; 2026 year-end P/S 12.5x
    - Shows platform-scale security premium context
    - Scale and breadth are incomparable to Glow
  - - Fortinet Jul 2026
    - Public comp
    - $117.67B market cap; 2025 year-end P/S 8.78x
    - Additional public security sentiment anchor
    - Category and maturity mismatch
  - - SaaSDB / BVP 2026 benchmarks
    - Market benchmark
    - Security median ~5.8x EV/Rev; public BVP Cloud Index ~8x ARR; private AI ~24x
    - Frames the valuation band private investors may be using
    - Benchmark families do not identify Glow's true fit
  notes: Comparable rows are anchors, not apples-to-apples pricing formulas.
