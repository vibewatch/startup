- id: final-diligence-asks-and-exit-readiness
  title: Exit logic is credible, but underwriting readiness still depends on missing metrics and round terms
  body: "There are credible exit paths for Glow if the hidden metrics are strong. Strategically, larger security platforms continue to buy or build around AI, endpoint, and software-governance themes. Financially, growth investors are still willing to back companies that look like category leaders early. But exit credibility is not the same as underwriting readiness. The immediate diligence burden is heavier here because the company launched publicly at a unicorn valuation without publishing the operating metrics that normally justify that price. \n\nInvestors need current ARR, net retention, concentration, gross-margin mix, services burden, and the exact 2026 financing documents. They also need a clean explanation of whether the current capitalization should be understood as a single Series A, a cumulative stealth history, or both from different lenses. Until that package exists, Glow is too important to ignore and too opaque to bless at face value."
