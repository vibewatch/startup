- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Hidden ARR is modest relative to the current mark
    - Data room shows ARR too low for premium benchmark logic
    - Valuation support compresses immediately
    - Re-price or pass
  - - Retention / concentration disappoints
    - NRR, churn, or top-customer exposure weaker than expected
    - Quality-of-growth thesis weakens
    - Lower scenario range and demand protections
  - - Deployment proves services-heavy
    - Implementation intensity scales faster than product leverage
    - Margin and scalability assumptions break
    - Move closer to bear case
  - - Trust package remains thin
    - No credible control / certification / governance packet
    - Procurement friction and exit confidence fall
    - Pause or materially downgrade
  - - Competitive losses accelerate
    - Buyers prefer suites or adjacent AI-governance tools
    - Growth and exit ceiling compress
    - Reduce bull-case probability
  - - Round structure is investor-unfriendly
    - Preference stack or dilution overhang is worse than implied
    - Common-equity upside shrinks
    - Demand structure protection or avoid
  - - Financing narrative remains unresolved
    - Unable to reconcile Series A vs cumulative stealth rounds
    - Confidence in price formation and dilution assumptions falls
    - Pause or demand documentation before proceeding
  notes: These triggers translate narrative uncertainty into monitorable underwriting tests.
