  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - What would change the view
  rows:
  - - Elite backers, credible founders, and a timely endpoint-AI wedge support strategic interest
    - Thesis
    - Weak customer depth or poor deployment quality would weaken it
  - - $1.2B is plausible in 2026 private AI/security markets if hidden metrics are already exceptional
    - Thesis
    - Sub-elite ARR, NRR, or margin would weaken it quickly
  - - Public evidence still lacks ARR, NRR, gross margin, concentration, and round-structure clarity
    - Anti-thesis
    - A strong data room would materially improve confidence
  - - Round taxonomy itself is publicly inconsistent, which is unusual for a company at this price
    - Anti-thesis
    - Executed financing documents that reconcile the public story would reduce the discount
  - - Trust and privacy baggage around endpoint control can compress willingness to pay top-of-market multiples
    - Anti-thesis
    - A robust trust and compliance packet would narrow the trust discount
  notes: The anti-thesis is mostly price and evidence risk, not market denial.
