- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Glow has elite hidden ARR growth, real enterprise expansion, and a trust package that supports rapid scaling
    - Supports roughly $3B-$5B valuation outcome over time
    - Execution, competition, or governance proof can still break the case
    - Possible only if hidden metrics already look elite
  - - Base
    - Glow is a real wedge with real enterprise traction, but economics and expansion are solid rather than exceptional
    - Supports roughly $1.2B-$2.0B valuation band
    - The current mark may already capture much of this case
    - Most consistent with current public evidence
  - - Bear
    - Customer depth is thinner than implied, services burden is high, or the financing narrative outran product-market fit
    - Support falls toward roughly $0.6B-$1.0B
    - A down-round or strategic reset becomes plausible
    - Cannot be ruled out without the data room
  notes: Scenario bands are evidence-sensitive and intentionally wide because ARR is undisclosed.
