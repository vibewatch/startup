- id: adoption-friction-and-concentration-risk
  title: Adoption friction comes from capital approval, workflow integration, channel opacity, and a missing humanoid customer roster
  body: The main customer risk is not that Fourier lacks any real-world adoption. It is that public adoption data does not yet let an outsider separate durable revenue from an impressive but blended ecosystem story. Rehabilitation buyers still have to clear documentation, coding, staffing, and capex logic, so sales cycles are likely anchored in provider economics and clinical validation rather than pure feature excitement. Channel partners such as Thor, HTPG, Robocare, and Healthlink can accelerate reach, but they also reduce visibility into end-customer identity, service obligations, and margin capture. That opacity becomes more serious when public named-customer disclosure is already thin relative to the 2,000-plus-institutions headline. The biggest proof gap sits on the humanoid and care side. Independent adverse analysis says there are no publicly confirmed paid GR-1 or GR-3 deployments with named customers, KPIs, or ROI, and public care-setting references still look like demonstrations,
    pre-sales, or innovation partnerships rather than scaled paid production. Until Fourier discloses renewals, customer concentration, and named humanoid pilots with measurable outcomes, the customer story should be treated as rehab-led with material conversion and concentration uncertainty layered on top.
