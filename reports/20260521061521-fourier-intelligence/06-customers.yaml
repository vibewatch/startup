  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-roster
    missingEvidence: A reconciled named-account roster separating paid customers, pilot sites, research labs, and distributors by product line and geography.
    whyItMatters: The chapter can prove repeatability only through a sample of public references; without a canonical roster, investors cannot measure logo depth, concentration, or active-account quality.
    diligencePath: Request an account list with status flags for live deployment, research collaboration, distributor resale, and closed pilot, plus first-install and last-activity dates.
    relatedQuestionRefs:
    - QU005
    - QU012
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Renewal rate, contract length, NRR, GRR, churn by segment, and any evidence of repeat purchase across the installed base.
    whyItMatters: Public deployment announcements do not tell an underwriter whether revenue persists after initial pilots or device launches.
    diligencePath: Request account cohorts, renewal calendars, reorder history, and churn reasons for the top 20 customers by ARR or equipment count.
    relatedQuestionRefs:
    - QU014
    - QU016
    - QU024
  - type: private-evidence-only
    severity: material
    topic: channel-economics
    missingEvidence: Distributor margin splits, service-level obligations, spare-parts responsibilities, and named end-customer visibility for channel-led markets.
    whyItMatters: When public proof runs through distributors, the quality of revenue and support burden can differ materially from direct enterprise accounts.
    diligencePath: Request partner contracts, field-service responsibilities, and installed-base reports from Thor, HTPG, Robocare, and other regional partners.
    relatedQuestionRefs:
    - QU017
    - QU024
  - type: missing-source
    severity: material
    topic: humanoid-paying-customers
    missingEvidence: Named paid GR-1 or GR-3 customer references, pilot outcomes, pricing, or regulatory pathway documents for care or hospital use.
    whyItMatters: Without customer proof on the humanoid side, the care-robot narrative remains strategically interesting but commercially un-underwritten.
    diligencePath: Ask for paid pilot references, deployment KPIs, certification timelines, and signed customer case studies for GR-1/GR-3.
    relatedQuestionRefs:
    - QU021
    - QU022
    - QU025
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue by top customer, top ten share, and share of business tied to distributor channels versus direct institutional accounts.
    whyItMatters: A broad installed-base headline can still mask concentration in a small number of accounts or geographies.
    diligencePath: Request customer concentration tables by revenue, device count, and geography, plus the split between direct and channel sales.
    relatedQuestionRefs:
    - QU023
