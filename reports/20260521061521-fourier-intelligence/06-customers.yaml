- id: proof-quality-and-durability
  title: Public proof quality is highest for rehab workflows and weakest for revenue durability
  body: 'The chapter’s evidence quality is uneven in a way that matters for underwriting. Rehab-site pages and hospital studies can prove real use, device mix, and some operational fit. NHG and Brooks are stronger than pure press-release logos because they describe deployment or in-situ evaluation. STEPS and Ren Ci go further by describing usage, session reporting, or measured outcomes. Yet even the best public references usually stop short of what investors need for durability: contract length, reorder history, renewal timing, NRR, GRR, churn, attach rates, and site-level utilization curves remain undisclosed. That means the public record supports a verdict of real adoption but not necessarily sticky revenue. The quality gap widens further outside core rehab. Nagoya, Kurage, and HTPG are strategically useful ecosystem signals, but they should not be confused with end-customer proof. They show channel development, R&D collaboration, and bundled-solution ambition more than they show booked
    demand. Public customer evidence therefore establishes Fourier as commercially real in rehab while still leaving unanswered whether that installed base reliably expands, renews, and cross-sells at attractive unit economics.'
