chapter:
  number: 6
  title: Customers
  summary: Fourier’s publicly visible customer proof is strongest in rehabilitation, where hospitals and neurorehab providers name specific device suites, workflows, and some measured outcomes across Singapore, the UK, the US, and India. The evidence also shows repeatable channel and research-partner formation, but public durability data is thin and the humanoid/care side still lacks named paying customers, leaving concentration, conversion, and renewal quality materially under-disclosed.
sections:
- id: buyer-user-payer-map
  title: Rehabilitation buyers are visible; payer and budget authority still sit with provider-side workflows
  body: 'Fourier’s public customer map is not a single homogeneous buyer segment. The best-documented users are rehabilitation providers and hospital rehab services that buy technology as part of therapist-led care delivery, not as standalone consumer devices. In those settings, the institution is the buyer, therapists and rehab teams are the daily users, and patients are the beneficiaries inside an existing program of care. Public site pages repeatedly frame value around measurable training, workflow fit, therapist productivity, and data capture rather than headline hardware novelty alone. That matters because payer logic sits one layer above the robot: CMS documentation rules and NIH reimbursement guidance both show that medical-device adoption still has to fit a billable therapy pathway, documented plan of care, and internal provider ROI case. The result is a buyer stack where rehab directors, innovation leads, procurement or finance committees, and clinical documentation owners all matter.
    On the edges of that stack, Fourier also shows research-lab buyers, distributor-led private clinics, and early embodied-care pilots, but those segments have much weaker public payment and renewal visibility than the rehabilitation core.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU043
  tableRefs:
  - TU001
  figureRefs:
  - FU001
  - FU002
- id: named-proof-and-repeatability
  title: Named rehab-site proof is real and geographically repeatable, but still sample-based
  body: 'The most credible customer evidence comes from named rehab sites and hospital clusters that specify devices and use cases. NHG Health says Fourier technologies have already been deployed and evaluated at Tan Tock Seng Hospital and expanded the relationship into a new five-year MOU plus a Joint Rehabilitation Innovation Hub. Brooks Rehabilitation says ArmMotus EMU and ExoMotus M4 are now in place at its Center for Innovation in Florida. In the UK, STEPS, Ascot, and Hobbs each provide site-level proof that goes beyond logo walls: STEPS lists a broad RehabHub suite and outcome reporting, Ascot describes a 10-plus-device consultant-led pathway, and Hobbs names its installed device stack at Laverstock Care Centre. India adds Saifee Hospital’s ExoMotus M4 installation, while Ren Ci in Singapore contributes the strongest quantified site-level outcome evidence through an ExoMotus adjunct pilot study. Repeatability is therefore real across multiple countries and institution types. But the
    public record still reads as a sample, not a reconciled account list, and several important references—such as Nagoya or Shirley Ryan—sit closer to research and ecosystem proof than to disclosed recurring commercial accounts.'
