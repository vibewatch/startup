callouts:
- calloutType: strength
  title: Rehab customer proof is real, named, and cross-border
  body: Unlike the humanoid side, the rehabilitation business has multiple named institutions that describe devices, workflows, and in some cases measured outcomes. That is enough to treat rehab adoption as commercially real rather than purely promotional.
  claimRefs:
  - CU012
  - CU014
  - CU016
  - CU023
  - CU025
  - CU031
- calloutType: risk
  title: The public record proves deployment, not retention economics
  body: Fourier’s sources can show site activity and partnership momentum, but they do not yet show NRR, churn, contract length, or reorder history. Customer quality therefore remains harder to underwrite than customer existence.
  claimRefs:
  - CU035
  - CU036
  - CU042
- calloutType: recommendation
  title: Treat ecosystem partnerships separately from paying customers
  body: NHG, Nagoya, Kurage, and HTPG all matter strategically, but they mean different things. Investors should split direct customer deployments, research collaborations, and channel partnerships into separate diligence buckets before underwriting growth.
  claimRefs:
  - CU028
  - CU032
  - CU033
  - CU034
