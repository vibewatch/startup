- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - What the public record shows
  - Potential impact
  - Diligence path
  rows:
  - - RehabHub cross-sell across 30+ robots
    - Platform can bundle many devices into one site and standardize data capture
    - Could deepen account value where rehab pathways are mature
    - Ask attach rates, average devices per site, and service revenue mix
  - - Research and joint-lab ecosystem
    - 17 joint labs and multiple academic partners increase visibility and product feedback loops
    - Can accelerate proof generation but may overstate monetized demand if counted as customers
    - Separate paid customers from R&D partners in the account ledger
  - - Distributor-led channels
    - Thor, HTPG, Robocare, and Healthlink broaden market access
    - Channel leverage may reduce direct account visibility and margin control
    - Review distributor contracts, field-service obligations, and end-customer reporting cadence
  - - Hospital innovation hubs and MOUs
    - NHG, Brooks, and Nagoya show collaboration-led adoption surfaces
    - Pipeline may look healthier than booked recurring revenue if pilots do not convert
    - Request conversion rates from MOU/demo to purchase order or multiyear contract
  - - Humanoid care narrative
    - No named paid GR-1 or GR-3 customers are public
    - Could lengthen sales cycles and distract from rehab strength if treated as near-term revenue
    - Request named paid pilots, ROI data, and regulatory pathway milestones for care use cases
  notes: This table separates expansion mechanisms that could be real growth drivers from the disclosure gaps that make them hard to underwrite from public evidence alone.
