  title: Customer segmentation table
  columns:
  - Segment
  - Typical buyer
  - Daily user
  - Budget / payer logic
  - Public proof quality
  - Main disclosure gap
  rows:
  - - Institutional rehab centers and neurorehab clinics
    - Clinic operator, rehab director, or owner
    - Therapists and therapy assistants
    - Provider capex plus billable therapy throughput
    - Strong — multiple named sites with specific devices and workflow detail
    - No public renewal or price disclosure by site
  - - Public or hospital rehab services
    - Hospital innovation, rehab medicine, or procurement lead
    - Hospital therapists and physiotherapists
    - Hospital budget plus documented therapy pathway and compliance requirements
    - Medium to strong — NHG/TTSH, Brooks, Saifee, and Ren Ci show real activity
    - Contract size and procurement pathway usually undisclosed
  - - Research institutes and joint labs
    - Professor, PI, innovation office, or research center
    - Researchers, clinicians, and study participants
    - Grant, lab, or institutional innovation budget
    - Medium — named labs and studies exist, but revenue status is often unclear
    - Paying-customer status and commercial conversion are rarely disclosed
  - - Distributor-led private providers
    - Clinic operator working through regional partner
    - Therapists and local service teams
    - Provider purchase budget with channel support and service overlay
    - Medium — channel pages and customer pages show devices in market
    - End-customer roster, margins, and service SLAs are opaque
  - - Care / humanoid pilots
    - Innovation sponsor, pilot owner, or R&D budget holder
    - Staff, patients, or visitors in supervised settings
    - Pilot or innovation funding rather than proven operating budget
    - Low — public proof is mainly demo, MOU, or pre-sale language
    - No named paying GR-1 or GR-3 customers publicly disclosed
  - - Home or community rehabilitation programs
    - Hospital or rehab-network care manager
    - Patients and community rehab teams
    - Provider/community care budget plus remote-care economics
    - Low to medium — NHG and PRLog show intent and home-based ambition
    - Little public proof of scaled deployed cohorts or reimbursement conversion
  notes: This table distinguishes who signs the check from who uses the device and who benefits clinically. “Budget / payer logic” reflects the visible public pathway, not confirmed contract mechanics.
