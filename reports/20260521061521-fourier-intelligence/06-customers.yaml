figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Typical institutional journey from rehab need to deployment, workflow integration, and possible expansion.
  approximationNotes: Stages are inferred from named site pages, NHG/Brooks collaboration material, and reimbursement guidance. They illustrate the observable path, not measured companywide conversion.
  data:
    nodes:
    - id: need
      label: Clinical need identified
      detail: Rehab team or hospital leader sees staffing pressure, gait/upper-limb demand, or need for measurable therapy.
    - id: business-case
      label: Business case and budget owner engaged
      detail: Clinical, procurement, finance, and documentation stakeholders test whether the robot fits a reimbursable care pathway.
    - id: evaluation
      label: Demo, pilot, or MOU evaluation
      detail: Fourier or a distributor provides demo access, conference exposure, or a pilot / research collaboration structure.
    - id: deployment
      label: Device suite installed
      detail: Named site receives ArmMotus, ExoMotus, or broader RehabHub modules and starts therapist onboarding.
    - id: integration
      label: Workflow and data integration
      detail: Therapists use reports, games, and linked devices inside inpatient, outpatient, or day-rehab programmes.
    - id: expansion
      label: Expansion or stall point
      detail: Site adds more modules, a new distributor region, or a joint lab—or stalls because renewal and ROI are not yet proven.
