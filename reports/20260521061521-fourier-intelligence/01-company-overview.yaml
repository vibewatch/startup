callouts:
  - calloutType: strength
    title: "Rehab installed base is the core credibility advantage"
    body: >-
      Fourier is more investable than a pure concept-stage humanoid company because it already has a
      rehabilitation robotics footprint, international offices, research labs, and institutional
      relationships that can support testing, commercialization, and data collection.
    claimRefs: [CO006, CO025, CO027, CO030, CO038]

  - calloutType: insight
    title: "2025 was the bridge year from rehab champion to humanoid unicorn narrative"
    body: >-
      The combination of a nearly RMB800 million Series E, the Runyang valuation disclosure, two rehab
      ecosystem MOUs, and the GR-3 launch suggests 2025 was the year Fourier connected its legacy rehab
      business to a broader embodied-AI growth story.
    claimRefs: [CO014, CO015, CO028, CO029, CO023]

  - calloutType: risk
    title: "Disclosure quality still trails the valuation narrative"
    body: >-
      Fourier’s public story is strong on milestones and product launches, but weak on the numbers that
      matter most for valuation discipline: revenue, margins, customer concentration, governance, and
      current cap-table detail remain undisclosed in the reviewed public record.
    claimRefs: [CO015, CO036, CO037, CO039]

