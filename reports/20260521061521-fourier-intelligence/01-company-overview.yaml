  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: disclosure-gaps
      missingEvidence: "Audited revenue, gross margin, ARR, backlog, and cash-flow data for 2024-2025."
      whyItMatters: "Without operating-financial disclosure, valuation discipline and capital-efficiency analysis remain weak."
      diligencePath: "Request audited financials or monthly management accounts under NDA during live diligence."
    - type: private-evidence-only
      severity: material
      topic: governance-gaps
      missingEvidence: "Current cap table, investor ownership percentages, board composition, observer rights, and debt facilities."
      whyItMatters: "Governance rights and senior-claims structure affect control, downside protection, and refresh valuation analysis."
      diligencePath: "Request the latest shareholder register, financing documents, and board materials from the company or lead counsel."
      relatedTableRefs: [TO002]
    - type: missing-source
      severity: material
      topic: commercialization
      missingEvidence: "Primary-source disclosure of GR-1 / GR-2 cumulative deliveries, paid deployments, and customer mix by segment."
      whyItMatters: "The public '100+ delivered' narrative rests on secondary coverage and does not establish recurring commercial scale."
