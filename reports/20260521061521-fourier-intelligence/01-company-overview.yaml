company:
  name: "Fourier Intelligence"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Fourier Intelligence (now branded publicly as Fourier for its general-robotics line) is a
    Shanghai-founded robotics company that began in rehabilitation robotics and has since expanded
    into full-size humanoid robots. Official company materials and 2022-2026 media coverage support
    a consistent spine: founded in 2015 by Alex Gu, headquartered in Shanghai, globally active via
    Singapore and Malaysia offices, and serving 2,000-plus institutions across 40-plus countries in
    rehab and enterprise settings. The company’s recent story is defined by a RMB400 million Series D
    in 2022, a nearly RMB800 million Series E in 2025, the 2024 GR-2 launch, the 2025 GR-3 launch,
    and a 2025 Runyang strategic-investment disclosure implying an RMB8 billion pre-money valuation.

sections:
  - id: identity-footprint-and-business-model
    title: "Identity, Footprint, and Business Model"
    body: >-
      Fourier presents itself as a full-stack robotics company whose public identity now spans both a
      general-robotics brand (“Fourier”) and a rehabilitation-focused sub-brand (“Fourier Rehab”).
      The official About and homepage materials say the company was founded in 2015, started from
      exoskeleton rehabilitation robots, and has since expanded into a broader portfolio that includes
      the GRx humanoid series, RehabHub, the MetaMotus Galileo system, and open-source tooling. The
      company’s own contact page anchors the operating footprint in Shanghai, Singapore, and Malaysia,
      while multiple official pages state that Fourier serves more than 2,000 institutions across more
      than 40 countries and regions. That combination matters strategically: unlike a pure humanoid
      startup, Fourier already has an installed base in rehabilitation and clinical settings, which it
      can use to validate hardware, collect data, and cross-sell newer humanoid products. Publicly,
      the company still frames the business as product-led rather than through detailed commercial
      metrics; no reviewed source disclosed revenue, gross margin, or ARR figures.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO034, CO035, CO036, CO038]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founders-leadership-and-institutional-network
    title: "Founders, Leadership, and Institutional Network"
    body: >-
      The public leadership picture is centered on founder Alex Gu, who is repeatedly identified as
      founder and CEO (or founder and group CEO), with Zen Koh named as co-founder and group deputy
      CEO in the 2022 Series D coverage. Public evidence does not surface a fully disclosed board or
      broader governance stack, so the company overview must rely on operating leadership rather than
      investor-governance detail. What is visible is the international institutional network Fourier
      has assembled around its rehabilitation franchise: the 2022 funding coverage described more than
      1,000 institutional healthcare customers and 17 international research joint labs, while 2025
      official announcements show Fourier Rehab signing MOUs with Brooks Rehabilitation in Florida and
      Kurage in France. Those partnerships reinforce that Fourier is not just a lab-stage robotics
      company; it already works with hospitals, rehab researchers, and therapy-system partners.
      However, the reviewed public record does not disclose board seats, debt facilities, or secondary
      transactions, which remains an important diligence limitation for later chapters.
    claimRefs: [CO009, CO010, CO011, CO027, CO028, CO029, CO030, CO037, CO038]
    tableRefs: [TO002]

  - id: capital-base-valuation-and-disclosure
    title: "Capital Base, Valuation, and Disclosure"
    body: >-
      Fourier’s public financing arc is now clear enough to establish it as a growth-stage Chinese
      robotics company, even though the cap table remains opaque. The strongest confirmed round before
      the humanoid wave was the January 2022 Series D: RMB400 million led by SoftBank Vision Fund 2
      with backing from Prosperity7 Ventures and Yuanjing Capital. Three years later, 36Kr, FL Cube,
      Sango Automation, and NetEase all reported that Fourier completed a nearly RMB800 million Series
      E in January 2025 with a syndicate that included Guoxin Investment, Pudong Venture Capital,
      Zhangjiang-affiliated funds, Prosperity7, and Junshan Capital. In late May 2025, Runyang’s
      planned strategic investment of up to RMB300 million implied an RMB8 billion pre-money valuation
      and gave the market a fresh unicorn anchor. The disclosure quality, however, is still venture-
      style rather than public-company grade: cumulative capital is reported in Chinese media at about
      RMB1 billion, but no official cap-table breakdown, liquidation stack, debt schedule, or current
      revenue metrics are publicly available.
    claimRefs: [CO012, CO013, CO014, CO015, CO016, CO036, CO037, CO039]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: product-arc-and-commercial-positioning
    title: "Product Arc and Commercial Positioning"
    body: >-
      Fourier’s public milestone arc shows a company deliberately extending a rehabilitation robotics
      base into general-purpose humanoids. The official About page places the launch of the humanoid
      project in 2019, the first-generation GR-1 prototype milestone in 2022, and the formal GR-1
      introduction in 2023. Official GRx materials and the 2024 GR-2 launch announcement position the
      GR-1 as the industry’s first mass-produced humanoid robot and then upgrade the platform in GR-2
      to 175 cm, 63 kg, and up to 53 degrees of freedom, with optional 12-DoF hands, tactile sensing,
      and a more developer-friendly control stack. By August 2025, Fourier shifted the narrative again
      with GR-3, its first explicitly care-centric humanoid, using softer industrial design and
      multimodal emotional interaction as differentiators. Support-site documentation also shows that
      Fourier publishes developer-facing robot documentation and the Fourier ActionNet dataset,
      underscoring the company’s “made for AI” posture. This is a meaningful differentiator versus pure
      concept-stage humanoid startups, although the reviewed public record still gives only partial
      visibility into unit economics and customer-level deployment scale.
    claimRefs: [CO018, CO019, CO020, CO021, CO022, CO023, CO024, CO031, CO032, CO033, CO038, CO040]

  - id: milestone-snapshot-and-adverse-frame
    title: "Milestone Snapshot and Adverse Frame"
    body: >-
      By the report date, Fourier’s public profile supports a strong momentum narrative: it has a ten-
      year company history, a rehab installed base, a 500-plus employee disclosure from 2024, a fresh
      2025 funding round, new rehab partnerships, and a CES 2026 showcase for GR-3. Yet the same
      record also justifies caution. The only public valuation anchor is the Runyang pre-money
      disclosure rather than a fully negotiated priced-round post-money number; the oft-cited GR-1
      “100-plus delivered” number relies on secondary Chinese reporting rather than an audited company
      ledger; and The Robot Report’s 2026 China outlook explicitly says competitive pressure and
      consolidation will persist as investors demand commercially meaningful applications. In other
      words, Fourier looks more credible than many humanoid startups because it starts from a rehab
      business and institutional network, but it still operates in a market where commercialization,
      cost pressure, and disclosure discipline will determine whether a premium robotics narrative turns
      into durable value creation.
    claimRefs: [CO015, CO017, CO025, CO026, CO031, CO036, CO039, CO040]
    tableRefs: [TO004]
    figureRefs: [FO001]

