  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reimbursement-economics
    missingEvidence: Site-level utilization, denial, staffing, and renewal data showing whether RehabHub benefits survive payer and documentation friction.
    whyItMatters: Workflow claims only matter if they convert into durable, defendable provider economics and repeat purchasing.
    diligencePath: Request a cohort of named flagship sites with utilization, KX denial rates, RTM use, staffing impact, and renewal history.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: humanoid-regulatory-dossier
    missingEvidence: Model-by-model FDA, CE, NMPA, or equivalent classification and certification roadmap for patient-adjacent humanoid use cases.
    whyItMatters: Humanoid care commercialization can outrun legal pathway clarity and create long sales cycles or blocked deployment.
    diligencePath: Request a regulatory matrix by model and use case, including intended-use boundaries, target markets, and timeline assumptions.
    relatedQuestionRefs:
    - QR017
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: export-mitigation
    missingEvidence: Chip bill of materials, alternative compute suppliers, inventory buffers, and export-screening controls that would mitigate AI-compute shocks.
    whyItMatters: Roadmap and margin assumptions can break quickly if controlled compute or related components slip.
    diligencePath: Request supply-chain risk register, alternative supplier plan, and scenario analysis for tighter H200-class restrictions.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR003
  - type: missing-source
    severity: blocking
    topic: privacy-security-pack
    missingEvidence: Hospital-grade DPA, HIPAA/GDPR mapping, data-flow diagram, retention policy, incident-response plan, SBOM, and vulnerability-management packet for rehab and care deployments.
    whyItMatters: Patient-adjacent rollouts combine cyber, privacy, and liability risk, and generic AI marketing is not a substitute for a procurement-grade control pack.
    diligencePath: Request the enterprise security packet used in procurement, third-party assessments, and any vulnerability disclosure or patch SLAs.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: blocking
    topic: paid-humanoid-deployments
    missingEvidence: Named paid GR-1 or GR-3 customers, shipped units, pilot-to-paid conversion data, KPI / ROI case studies, and service obligations.
    whyItMatters: Commercial proof, not demos, determines whether humanoids are underwritable growth or only marketing optionality.
    diligencePath: Request signed customer list, conversion funnel, shipped-unit counts, and two measured production case studies.
    relatedQuestionRefs:
    - QR016
    relatedTableRefs:
    - TR005
