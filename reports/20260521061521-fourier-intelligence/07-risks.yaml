- id: monitoring-and-thesis-breaks
  title: The correct monitor is not “no controversy yet” but whether Fourier converts rehab credibility into disclosed compliant deployments
  body: 'The monitor set should focus on whether Fourier converts rehab credibility into disclosed, compliant operating proof. A named paid humanoid deployment with clear task metrics would matter more
    than another conference appearance. A published model-by-model FDA, CE, or NMPA strategy would matter more than another lifestyle care-bot demo. A disclosed security packet, DPA, incident-response process,
    and post-market plan would matter more than generic AI language. And on the rehab side, hard utilization and reimbursement evidence from flagship sites would matter more than top-of-funnel institution
    counts. That framing also preserves an important nuance around public controversies: this chapter did not retain a smoking-gun enforcement action or public recall naming Fourier, but the absence of
    a surfaced controversy is not the same thing as a de-risked safety or compliance profile. Public surveillance systems and recall rules exist; the missing piece is Fourier-specific disclosure showing
    how its quality, cyber, privacy, and regulatory controls would behave at scale. Until that pack exists, risk should be monitored through concrete triggers rather than comfort taken from silence.'
