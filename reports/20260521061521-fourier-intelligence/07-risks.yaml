- id: humanoid-platform-risks
  title: The humanoid thesis is constrained more by missing operating proof and privacy/liability exposure than by awareness
  body: The humanoid risk stack is different from the rehab-medtech stack. Public sources can show GR-3’s design intent, CES visibility, care-oriented interaction features, and Fourier’s ambition to move
    from research and rehab into more human-centered environments. They do not yet show the kind of named paid deployments, disclosed regulatory pathway, or field reliability record that would let an investor
    underwrite eldercare or hospital-adjacent scale. Independent trackers and adversarial coverage both describe the humanoid line as pre-commercial or unproven, with no publicly confirmed paid GR-1 or
    GR-3 deployments, no named ROI cases, and limited channel access for the higher-end GR-2. That matters because human-facing care robots blend physical safety, autonomy, privacy, and liability into one
    package. Face, voice, touch, and emotional-cue processing can create GDPR and biometrics exposure; any move from demo spaces into assisted settings also sharpens responsibility questions across manufacturer,
    operator, integrator, and cloud/software provider. The right read is not “low risk because no scandal surfaced.” It is “high-consequence risk because the public marketing surface currently outruns the
    disclosed compliance pack.”
  claimRefs:
