- id: geopolitics-competition-and-dependencies
  title: Export-control, cost, and competitive intensity could compress the window for a premium healthcare-humanoid strategy
  body: Even if Fourier solves product readiness, it still has to survive a geopolitical and competitive regime that increasingly rewards scale, lower price points, and compliance depth. U.S. export controls
    keep advanced China-related compute under screening, license, and end-use discipline, and even the 2026 BIS softening for specific chips remains conditional on security controls, compliance procedures,
    and third-party testing. China’s own humanoid standard system raises the local bar further, extending safety, ethics, application, and data/model governance expectations across the lifecycle. At the
    same time, the commercial window is getting tighter. TrendForce sees China output growing 94% in 2026, with Unitree and AgiBot approaching 80% share, while TechCrunch and CNBC describe a market moving
    from demo-driven excitement toward operations-driven adoption under heavy cost, software, safety, and bubble pressure. That is uncomfortable for Fourier because its premium angle depends on healthcare
    credibility, yet public evidence still shows limited humanoid customer proof and estimated price points far above lower-cost alternatives with broader availability.
