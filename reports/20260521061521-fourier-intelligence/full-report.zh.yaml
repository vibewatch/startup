      - number: '2.3'
        title: 核心市场：康复机器人规模与分层
        blocks:
          - type: paragraph
            body: >-
              四家独立分析机构发布了 2026 年康复机器人市场估计，区间很宽但有信息量。TBRC 估计市场为 USD 2.22 billion，2030 年增至 USD 4.87 billion，CAGR
              22.7%。Mordor Intelligence 估计 2026 年 USD 1.77 billion，2031 年增至 USD 3.89 billion，CAGR 17.1%。IMARC Group 以
              2025 年 USD 1.82 billion 市场为基数，预计 CAGR 16.53%。Fortune Business Insights 的估计明显更低：2026 年 USD 579.5
              million，CAGR 16.36%；原因是范围更窄（仅含外骨骼和治疗设备，排除部分服务与实验室自动化品类）。不审阅底层方法，这些估计无法完全调和；USD 579.5M–USD 2.22B
              的跨度（3.8×）反映了是否纳入辅助机器人、假肢和相关服务的定义差异。

              中位共识——Mordor 的 USD 1.77B 到 TBRC 的 USD 2.22B——是 Fourier 康复业务用于 2026 规划最可辩护的 TAM。

              在这个市场内，外骨骼机器人约占按类型划分收入的 47.35%（Mordor 2025 数据），确认其相对治疗和辅助设备子类的主导地位。老年用户约占需求的 61.4%。康复中心占终端用户收入的
              53.2%；医院是第二大机构买方。居家照护是增速最快的采纳渠道，CAGR 27.1%，部分由 2024 年 CMS 外骨骼重新分类推动。亚太是增长最快的地区，CAGR
              21.2%，由卒中发病率上升和人口老龄化驱动——这对总部在上海的 Fourier 是重要动态。按 Fortune 估计，北美仍保有最大区域份额，约占 2025 年收入的 74.76%。

              Fourier Intelligence 被 TBRC 的康复机器人竞争格局明确列为关键竞争者，确认公司位于商业市场，而非研究阶段参与者。IFR 数据显示，2024 年单位级激增（康复机器人销量增长
              106%）由临床场景专业终端用户推动，这与第 1 章所述 Fourier 2,000 多家机构客户基础一致。

              相邻的老年照护机器人市场——包括陪伴机器人、移动服务机器人，以及专为养老机构设计的机器人外骨骼——2026 年规模为 USD 0.39 billion，2031 年增至 USD 0.64 billion，CAGR
              10.4%（Knowledge Sourcing）。更广义的 AI 驱动老年照护解决方案市场（包含非机器人 AI）预计到 2031 年达到 USD 7.38 billion，CAGR 31.6%。这些相邻市场可由
              Fourier 的 GR-3 照护人形机器人切入，但买方群体不同（养老机构、居家医疗机构），并不是支撑核心康复机器人可服务市场的康复中心和医院买方。
