      - number: '2.5'
        title: 支付方、买方与预算负责人图谱
        blocks:
          - type: paragraph
            body: >-
              康复机器人采购分成三类买方和支付方原型，各自预算负责人、决策周期和采纳触发点不同。机构买方——康复中心和医院门诊部门——是主导渠道（按 Mordor 收入占市场
              53.2%），由机构资本预算出资，采购决策通常由临床运营负责人和财务委员会作出。政府支付方和商业保险的报销通过锚定治疗课程计费代码，间接支持这些购买，并为设备 ROI 提供资金来源。

              居家使用买方是增长最快但最小的细分。Medicare 的 2024 Home Health Rule（2024 年 1 月 1 日生效）将动力外骨骼重新划入支具福利类别，为个人外骨骼设备创造报销路径。CMS
              拟定每台设备支付约 USD 94,617，Medicare 受益人承担标准 20% 自付。用户必须先在认证临床场地完成训练，才能居家使用。Lifeward 报告称，合并 Medicare、VA
              福利和工伤赔偿后，美国脊髓损伤患者约 40% 现在由已经报销个人外骨骼申请的支付方覆盖，而 2024 年前几乎为零。

              CY2026 OPPS/ASC final rule 将医院门诊支付费率上调 +2.6%，影响约 4,000 家医院门诊部门和 6,000
              家流动手术中心。这一增量费率更新支持机构整体为康复技术采购提供资金的能力，但对机器人专项预算的边际影响是间接的。

              研究和学术机构是开发平台与数据生成合作的小众买方渠道——与 Fourier 的开源和开发者生态策略相关，但对近期收入并不重要。

              2026 年的人形机器人采购几乎完全由试点驱动，并由企业出资。BMW（Figure）、Amazon 和 GXO（Agility Digit），以及 UBTECH 的汽车 OEM 合作伙伴部署，都是企业 capex
              决策，评估周期为一到三年。医疗人形机器人试点更早期；GR-3 这类照护人形机器人没有成熟报销路径，必须靠直接替代人工工时来创造 ROI。这把近期医疗系统机构采纳限制在创新或生产率预算线，而不是主流 capex。
            claimRefs:
              - CM030
              - CM031
              - CM032
              - CM033
