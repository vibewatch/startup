      - number: '3.2'
        title: 康复竞争者胜在证据、报销或专门步态工作流
        blocks:
          - type: paragraph
            body: >-
              Fourier 当前最强的直接竞争仍在康复机器人，而不是通用人形机器人。Wandercraft 是战略重叠最接近者，因为它现在同时覆盖医院步态训练、通过 Eve 进入居家外骨骼的野心，以及经 Calvin-40
              和 Renault 延伸到工业人形机器人。Ekso Bionics 和 Lifeward 是更直接的康复对手：两者都围绕个人外骨骼准入给出明确美国报销信号，也把产品覆盖到临床和家庭或社区场景。CYBERDYNE
              在技术上更差异化，使用生物电信号控制，并提供医疗、健康管理和劳动支持变体，但其英文公开材料对近期全球商业规模的透明度较低。

              Fourier 在这一组里的优势，是机构康复分销广度。官方材料显示，它拥有比任何单一外骨骼同行更大的多机器人康复平台，应该有助于治疗师关系、打包销售和交叉销售。弱点在于，美国可见的报销和公开支付方证据，目前
              Lifeward 和 Ekso 比 Fourier 更清楚。公开价格透明度也薄：除了与 Medicare
              相关的个人外骨骼报销参考，大多数供应商仍是报价制。这种不透明降低了纯价格性能比较的置信度，并推动买方转向供应商信任、证据和服务足迹。切换成本存在——临床医生培训、流程重设计、软件工作流和支付方熟悉度——但它们不是手术机器人那种硬平台锁定，因此没有哪个康复在位者不可攻破。
