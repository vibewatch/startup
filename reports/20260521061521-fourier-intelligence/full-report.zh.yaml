      - number: '1.3'
        title: 资本基础、估值与披露
        blocks:
          - type: paragraph
            body: >-
              Fourier 的公开融资脉络已经足够清晰，可把它定位为成长阶段中国机器人公司，尽管股权结构表仍不透明。人形机器人浪潮前最强的已确认轮次是 2022 年 1 月 Series D：SoftBank Vision
              Fund 2 领投 RMB400 million，Prosperity7 Ventures 和 Yuanjing Capital 参投。三年后，36Kr、FL Cube、Sango Automation 和
              NetEase 均报道 Fourier 在 2025 年 1 月完成近 RMB800 million 的 Series E，投资方包括 Guoxin Investment、Pudong Venture
              Capital、Zhangjiang 相关基金、Prosperity7 和 Junshan Capital。2025 年 5 月下旬，Runyang 计划最高 RMB300 million 的战略投资指向
              RMB8 billion 投前估值，给市场提供了新的独角兽锚点。但披露质量仍是创投式，而非上市公司级：中文媒体报道累计融资约 RMB1
              billion，但官方股权结构拆分、清算优先权、债务时间表或当前收入指标均未公开。
