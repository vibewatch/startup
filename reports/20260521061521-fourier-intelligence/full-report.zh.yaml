  - id: TP002
    title: 功能 / 能力矩阵
    columns:
      - 采购标准
      - Fourier
      - 康复龙头（Wandercraft / Ekso / Lifeward / CYBERDYNE）
      - 人形机器人龙头（UBTECH / Unitree / AgiBot / Figure / 1X）
      - 证据支持的推论
    rows:
      - - 临床工作流适配
        - 高 — 康复组合和数字化 RehabHub 是核心产品
        - 高 — 步态康复和神经康复是核心
        - 低到中 — 多数是工业、研究或家庭叙事
        - Fourier 最大优势是既有治疗师 / 渠道契合度，不是单纯人形机器人规模
      - - 家用报销路径
        - 低 — 保留来源中没有美国公开路径
        - 中到高 — Lifeward 和 Ekso 有明确 Medicare 挂钩证明；Wandercraft 和 CYBERDYNE 不太清晰
        - 低 — 人形机器人没有成熟报销路径
        - 报销仍偏向既有康复外骨骼厂商，而不是人形机器人新进入者
      - - 护理 / 养老互动
        - 高 — GR-3 明确针对护理互动优化
        - 中 — 靠近康复场景，但产品不那么强调社交表达
        - 中 — UBTECH 和 1X 谈护理 / 家庭；公开证据仍少
        - 相比工厂优先的人形机器人厂商，Fourier 的护理叙事更清晰
      - - 工业操作 / 工厂证明
        - 低 — 没有同等公开产线证明
        - 低 — 以康复平台为主
        - 高 — UBTECH、AgiBot、Figure 和 Unitree 披露工厂、数据采集或开发者部署
