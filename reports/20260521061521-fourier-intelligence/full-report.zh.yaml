      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 可观察估值
      - 收入 / 倍数快照
      - 与 Fourier 的相关性
      - 局限
    rows:
      - - Fourier 公开锚点
        - RMB8bn 投前；隐含 ~RMB8.56bn 完全稀释
        - 未披露公开收入或利润率
        - 该公司唯一直接公开价格锚点
        - 战略背景和 ESOP 稀释削弱其作为市场出清价格的干净度
      - - Ekso Bionics
        - ~US$42m 市值
        - 2025 收入 US$12.8m；~3.9x EV / 收入；53% 毛利率
        - 展示规模仍有限时，已披露康复机器人能按什么水平交易
        - 公开股权价值很大程度受流动性和二级市场悲观情绪影响
      - - Lifeward
        - ~US$18m 市值
        - FY2025 收入 ~US$22.0m；~0.9x EV / 收入
        - 是有可见经济性的康复机器人公司的有用底部参照
        - 估值带困境属性，不是更健康资产的干净公允价值目标
      - - CYBERDYNE
        - ~JPY55bn 市值
        - FY2026 收入 JPY3.846bn；~10.5x EV / 收入
        - 展示有披露和平台叙事的康复相邻上市机器人公司的上沿
        - 日本上市倍数包含市场结构和本地投资者影响
      - - UBTECH
        - ~HK$55bn 市值
        - 2024 收入 ~US$0.17bn；~22.1x EV / 收入
        - 对已披露的人形机器人 / 服务机器人叙事而言，这是最佳上市公开标尺
        - 产品和公开市场叙事远宽于 Fourier 当前证据集
      - - Apptronik
        - ~US$5.3–5.5bn 投后
        - '>$935m Series A；累计融资近 US$1bn'
        - 有用的私人市场人形机器人叙事可比对象，低于 Figure，高于多数公开同行
        - 私募市场标记；收入未公开披露
      - - Figure
        - US$39bn 投后
        - US$1bn Series C；累计融资 US$1.75bn
        - 展示美国具身 AI 叙事定价的当前上沿
        - 纯叙事天花板，不是 Fourier 当前现实的基准可比对象
    notes: 可比集合有意混合：公开康复同行框定底部，上市机器人平台框定已披露的溢价区间，私有人形机器人轮次框定叙事天花板。表内数值不做汇率标准化，因为目的在于框定区间，而非合成精度。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the principal public and private valuation anchors that are both relevant to Fourier and observable from
        retained public sources as of 2026; excludes opaque private Chinese rounds without corroborated terms.
