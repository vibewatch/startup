      - number: '2.6'
        title: 约束视角：逆风与采纳障碍
        blocks:
          - type: paragraph
            body: >-
              康复和人形机器人的乐观逻辑建立在人口结构顺风、单位成本下降和政策催化之上。负责任的市场分析必须把这些与实质约束力量一起加权。

              临床证据方面：2026 年 JMIR
              关于卒中后上肢康复机器人辅助治疗的伞状综述发现运动功能改善，但日常生活活动（ADL）提升通常与常规治疗相当。该发现直接限制了最强支付方审批论点——机器人辅助治疗能产生显著更好的功能结局。2026 年 PubMed
              RCT 确实发现，对卒中后步态康复，外骨骼辅助康复相较常规训练改善了 Fugl-Meyer 下肢评分和 Barthel Index，比上肢 ADL 更清楚地支持下肢 /
              步态康复场景。因此，证据图景是混合且分层的：下肢 / 步态外骨骼用例更强，广义 ADL 结果主张更弱。

              人形机器人的商业就绪度方面：IFR 2026 年趋势报告明确表示，人形机器人必须在节拍时间、能耗和维护成本上满足高工业要求，才能与传统自动化竞争；截至 2026 年，关键缺口仍在。Robotics &
              Automation News 将操作能力、电力与续航、通用自主性识别为三大技术瓶颈；大多数 2026 年部署仍是受监督试点或协同操作应用，而非自主运行。Roland Berger
              也确认，生态系统（软件集成、安全认证框架、监管清晰度）落后硬件三到五年。

              成本障碍方面：售价 USD 30,000–USD 150,000 的康复机器人设备，其采购上限由报销费率（Medicare 路径约 USD
              94,617）、机构资本预算和机构风险容忍度共同决定。长期结果数据混合叠加高前期成本，会压制新兴市场和儿科场景采购。Fortune Business Insights 和 Mordor Intelligence
              都把高初始资本开支（capex） 和集成成本列为主要市场约束。隐私和数据安全担忧，加上照护场景中对替代人际连接的焦虑，则构成 AI 机器人老年照护采纳的软性障碍。

              综上，这些约束说明：虽然市场规模估计很大、增速也有吸引力，但在 2026–2028 年窗口内，标称 TAM 中真正可触达的比例——尤其对 Fourier 这样的中型玩家——明显小于标题数字暗示。
            claimRefs:
