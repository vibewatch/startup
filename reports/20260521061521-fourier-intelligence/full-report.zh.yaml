  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开锚点有用，但单靠它不足以支撑高确信度入场
        blocks:
          - type: paragraph
            body: >-
              对 Fourier 的正确解读，不是 RMB8 billion 投前锚点显然错误，而是公开证据太薄，还无法高确信度判断它便宜、公允还是昂贵。Runyang
              的文件给了本章一个许多私人机器人故事缺少的东西：真实备案的价格锚点、支票规模，以及稀释后持股测算。这很重要。2025 年 1 月的 Series E
              也显示，背后仍有新资本胃口，投资者范围较宽，包括上海国资相关资本和知名私人支持者。但同一份公开记录也显示仍缺什么。这个估值锚点没有收入、毛利率、烧钱速度、现金余额或现金跑道披露。即便是完全稀释口径的测算也需要解读，因为这笔投资同时伴随
              ESOP 补充和战略背景，而不是一笔干净为外部投资者给普通股定价的标准公平交易融资。两者合在一起，得到的纪律性结论是：把该文件视为新钱的天花板测试，而不是证明这家公司已经凭运营基本面配得上 RMB8
              billion 存在权。对能做私下尽调的战略内部人来说，当前水平可能仍公允。对只能依赖公开证据的外部投资者来说，建议实质上是继续研究或观察，置信度中等，风险评级高。
