      - number: '2.2'
        title: 需求驱动：流行病学、人口结构与医疗系统压力
        blocks:
          - type: paragraph
            body: >-
              康复机器人最核心的结构性需求驱动，是全球神经和肌骨疾病流行，与老龄化人口叠加，推高越来越大的急性期后康复需求。World Stroke Organization 的 2025 Global Stroke Fact
              Sheet 基于 GBD 2021 数据，报告 2021 年全球现存卒中病例 93.8 million；卒中是全球第二大死因，也是死亡与残疾合并负担的第三大原因。1990 至 2021 年，卒中新发病例增长
              70%；87% 的死亡和 89% 的 DALYs 集中在低收入及中低收入国家。卒中的全球经济成本每年超过 USD 890 billion，并预计到 2050 年接近翻倍。

              PAHO 对美洲康复需求的估计显示，2019 年有 366 million 人存在适合康复介入的健康状况，较 1990 年的 231 million 增长
              58%，主要由人口增长和老龄化推动。需要康复的概率随年龄呈指数上升。这为任何能扩大卒中和神经康复吞吐量的设备品类创造了长期需求顺风。

              International Federation of Robotics 将医疗劳动力短缺和老年人口增长列为专业医疗服务机器人最主要的两个需求驱动。Oliver Wyman
              从系统层面描述宏观逻辑：如果没有生产率干预，全球医疗支出可能从当前 USD 11.8 trillion 增至 2040 年 USD 23.1 trillion；在突破性采纳情景下，AI 和专用机器人每年最多可削减
              USD 5.1 trillion 的预期成本增量。全球照护人员缺口估计达 15
              million，进一步解释了医院系统为何评估用机器人增强治疗人员产能。上述流行病学和劳动力动态共同定义了康复机器人及相邻照护机器人的结构性扩张需求基础。
