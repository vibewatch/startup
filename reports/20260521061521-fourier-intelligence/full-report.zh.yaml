  - id: FI001
    title: 收入模型桥接
    type: flow
    layout: standard
    summary: 没有公开标价的自助漏斗时，机构需求如何转化为硬件、服务和平台收入。
    data:
      nodes:
        - id: budget
          label: |-
            机构预算
            （医院 / 康复 / 企业）
          type: input
        - id: quote
          label: |-
            报价驱动销售
            （联系销售、招标、分销商）
          type: process
        - id: hardware
          label: |-
            硬件收入
            （康复设备 / GR 人形机器人）
          type: output
        - id: deploy
          label: |-
            安装与培训
            （临床人员上手 / 工作流设置）
          type: process
        - id: service
          label: |-
            服务与维护
            （现场支持 / 更新 / 正常运行时间）
          type: output
        - id: platform
          label: |-
            平台 / 数据层
            （RehabHub、开发者栈）
          type: output
        - id: risk
          label: |-
            不可见的实际 ASP
            （折扣和打包未披露）
          type: risk
      edges:
        - from: budget
          to: quote
          label: 经由采购
        - from: quote
          to: hardware
          label: 成交
        - from: hardware
          to: deploy
          label: 触发
        - from: deploy
          to: service
          label: 供给
        - from: deploy
          to: platform
          label: 支撑
        - from: quote
          to: risk
          label: 遮蔽
    approximationNotes: 这是结构性桥接，不是量化收入拆分。公开来源显示了步骤，但没有给出每一步的转化率或利润率。
    claimRefs:
      - CI013
      - CI014
      - CI015
      - CI017
      - CI018
      - CI034
      - CI038
      - CI042
  - id: FI002
    title: 单位经济桥接
    type: flow
    layout: standard
    summary: 部署、关税和商业化投入仍然沉重时，看似强劲的硬件定价仍可能烧钱。
    data:
      nodes:
        - id: asp
          label: |-
            硬件 ASP
            （高客单价机构机器人）
          type: input
        - id: bom
          label: |-
            组件与执行器
            （复杂人形 / 康复硬件）
          type: process
        - id: logistics
          label: 运费 / 关税 / 固定开支
          type: process
        - id: service
          label: 培训与现场服务工时
          type: process
        - id: gross
          label: |-
            毛利池
            （同行区间 ~38%-53%）
          type: output
        - id: opex
          label: 销售、报销和 R&D 开支
          type: process
        - id: cash
          label: |-
            现金消耗风险
            （若规模化慢于支出）
          type: risk
      edges:
        - from: asp
          to: bom
          label: 吸收
        - from: bom
          to: gross
          label: 约束
        - from: logistics
          to: gross
          label: 挤压
        - from: service
          to: gross
          label: 消耗
        - from: gross
          to: opex
          label: 必须覆盖
        - from: opex
          to: cash
          label: 可能超过
    approximationNotes: 同行毛利率区间来自公开可比公司，不是 Fourier 自身数据。由于 Fourier 不披露 BOM、服务成本或分项 opex，该桥接是定性的。
