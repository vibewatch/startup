      - number: '8.3'
        title: 乐观、基准、悲观框架显示，当前锚点接近今天公开证据所能支撑的上沿
        blocks:
          - type: paragraph
            body: >-
              在这里，受证据约束的情景模型比堆满表格的 DCF
              更诚实。悲观情景假设康复业务真实，但不足以扛住估值；人形机器人项目仍有战略兴趣，却没有转化成具名付费部署或已披露经济性证明。在这种世界里，公开倍数压缩和新一轮折价可能把公允价值推向大约 RMB4.5
              billion 至 RMB6.0 billion。基准情景假设公开证据对 Fourier 康复深度的判断方向正确，人形机器人仍保留有意义的期权价值，但仍不给公司拒绝披露的经济性记任何分。这得到大约 RMB6.5
              billion 至 RMB8.5 billion 的区间；值得注意的是，当前公开锚点已经接近该区间上沿。乐观情景需要的不只是乐观情绪。它需要已披露收入和利润率质量，需要证明康复需求耐久而非只靠
              标识堆砌，还需要具名人形机器人部署来缩小与更高倍数机器人公司的可比性缺口。只有到那时，RMB9.5 billion 至 RMB13.0 billion 区间才合理。这个框架也解释了，为什么从当前起点出发，很难为
              3x 风投式回报门槛辩护。大约 RMB24 billion 退出并非不可能，但今天的公开证据不足以把它建模为基准情景。
