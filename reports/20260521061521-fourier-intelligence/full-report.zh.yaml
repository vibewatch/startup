      - number: '8.2'
        title: 公开康复同行框定地板，私人人形机器人轮次框定叙事天花板
        blocks:
          - type: paragraph
            body: >-
              Fourier 的估值问题在于，公开类比公司指向两个很不同的方向。一边，Ekso、Lifeward
              等上市康复和外骨骼公司显示，当收入规模不大、亏损持续且投资者能直接看到数字时，公开市场会非常不宽容。这些公司证明，真实产品、报销进展和真正商业化，并不会自动换来高估值倍数。另一边，CYBERDYNE，尤其是
              UBTECH，又说明机器人公司一旦上市、财务可见，并被视为更广平台而非狭窄康复设备厂商，就能获得明显更高倍数。私人人形机器人轮次进一步拉大差距。Figure 跟踪到的 $39 billion Series
              C，以及 Apptronik 在 2026 年 2 月约 $5.3 billion 到 $5.5 billion 的估值，显示当投资者承销平台可选性而非当前经济性时，美国具身 AI 故事能被定价得多激进。CNBC
              的报道把机制说得很清楚：美国初创公司被按 AI 平台估值，而中国公司更常被按工业硬件企业估值，即使中国公司出货更多硬件。因此，Fourier
              的公开锚点夹在两个世界之间。只用承压的公开康复可比公司来解释它，估值太高；把它读成 Figure 式前沿人形机器人叙事估值，又远远太低。最干净的解释不是单一赛道可比捷径，而是“康复商业化 +
              期权价值”的混合框架。
