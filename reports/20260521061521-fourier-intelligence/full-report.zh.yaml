      - number: '1.4'
        title: 产品路径与商业定位
        blocks:
          - type: paragraph
            body: >-
              Fourier 的公开里程碑显示，公司有意把康复机器人基础延伸到通用人形机器人。官方 About 页面把人形机器人项目启动放在 2019 年，把第一代 GR-1 原型里程碑放在 2022 年，正式推出 GR-1
              则在 2023 年。官方 GRx 材料和 2024 年 GR-2 发布公告将 GR-1 定位为行业首款量产人形机器人，随后 GR-2 把平台升级到 175 cm、63 kg、最高 53 个自由度，并可选
              12-DoF 双手、触觉传感和更友好的开发者控制栈。到 2025 年 8 月，Fourier 又用 GR-3
              切换叙事：这是其首款明确面向照护的人形机器人，以更柔和的工业设计和多模态情感交互作为差异化。支持站点文档还显示，Fourier 发布面向开发者的机器人文档和 Fourier ActionNet
              数据集，凸显其“made for AI”姿态。相较纯概念阶段人形机器人创业公司，这是有意义的差异化；不过，已审阅公开记录对单位经济和客户级部署规模仍只给出部分可见度。
