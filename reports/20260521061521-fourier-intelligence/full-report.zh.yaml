  - id: TP004
    title: 护城河耐久性 / 竞争风险台账
    columns:
      - 护城河主张
      - 支撑证据
      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 面向康复服务方的临床分销
        - Fourier 声称覆盖 40+ 个国家 2,000+ 家机构，RehabHub 中有 30+ 台机器人
        - 一些市场里，康复既有厂商已经掌握报销和治疗师信任
        - 高
        - 获取队列级留存、附加率，以及相对 Ekso、Lifeward、Wandercraft 的赢单 / 输单数据
      - - 适合护理的人形机器人设计
        - GR-3 明确为护理互动打造，具备柔软外壳和触觉反馈
        - 硬件商品化后，工业优先厂商可以加上更柔性的 HRI 层
        - 中
        - 要求提供养老护理或医院场景试点结果，并衡量社交设计是否改变采用率或 ROI
      - - 从康复向护理人形机器人交叉销售
        - Fourier 已经卖进康复科室，多数人形机器人同业还没有
        - 医院可能仍会购买单独的专用工具，而不是宽平台
        - 中
        - 索取康复客户群转化为 GR 系列试点和付费部署的数据
      - - 抵御低成本人形机器人竞争
        - 相比消费级或开发者机器人，Fourier 可以主张临床适配度
        - Unitree 可见价格地板和中国规模会压低买方预期
        - 高
        - 需要清晰 ROI 逻辑、服务包定义和买方分层，才能支撑溢价定位
      - - 抵御西方资金充足的人形机器人新进入者
        - Figure 和 1X 在护理上更早期，但能大举投入自主能力和 HRI
        - Figure 已有伙伴验证的工业部署和庞大资本基础
        - 高
        - 跟踪 Figure、1X 或 UBTECH 是否会在 Fourier 跑通 GR 经济性前进入医疗专项试点
      - - 人形机器人市场时点风险
        - IFR 和 Robotics & Automation News 都提示炒作、安全和自主能力约束
        - 如果品类更久停留在试点阶段，Fourier 的 GR 产品可能在需求成熟前消耗资源
        - 中
        - 用已签试点、安全 / 合规里程碑和付费服务采用率对未来 GR 投资设阶段门
    notes: 严重性是基于披露部署规模、报销杠杆和可见价格锚点的定性评估。由于公开证据仍不完整，缓释措施以尽调问题呈现。
