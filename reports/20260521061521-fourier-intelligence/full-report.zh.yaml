      - number: '7.4'
        title: 正确监测点不是“还没有争议”，而是 Fourier 能否把康复可信度转成披露的合规部署
        blocks:
          - type: paragraph
            body: >-
              监测集应聚焦 Fourier 能否把康复可信度转成已披露、合规的运营证明。一个具名付费人形机器人部署，且任务指标清楚，比又一次会议亮相更重要。逐型号公布 FDA、CE 或 NMPA
              策略，比又一次生活方式照护机器人演示更重要。披露安全包、DPA、事件响应流程和上市后计划，比泛泛而谈 AI
              更重要。康复侧，旗舰现场的硬利用率和报销证据，也比漏斗顶端的机构数量更重要。这一框架还保留了围绕公开争议的重要细微差别：本章没有留存点名 Fourier
              的铁证式执法行动或公开召回，但没有浮出水面的争议，并不等于安全或合规画像已经去风险。公共监测系统和召回规则存在；缺的，是 Fourier
              具体披露其质量、网络、隐私和监管控制在规模化时会如何运转。在这个披露包出现前，风险应通过具体触发器监测，而不是从沉默中获得安慰。
