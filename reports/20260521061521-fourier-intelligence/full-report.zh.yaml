              留存证据支持一个分裂判断。一方面，Fourier 的可信技术护城河来自康复渠道触达、部件级垂直化和真实开发者栈。另一方面，与康复业务相比，其人形机器人商业化公开证据仍偏薄。留存材料中最强的人形机器人商业化来源，是
              36Kr 关于数百台 GR 系列出货和医院示范基地合作的报道；最强的 GR-3 来源仍是 CES 发布材料和展示报道。这足以说明 Fourier 不是空气产品，但还不足以说明 GR-3
              已经在医院、养老或大型付费企业队列里完成部署验证。最大的公开缺口正是承销时最关键的几项：具名生产客户、照护场景下的详细合规或医疗许可证据，以及联网机器人运行中的安全或隐私控制文档。因此，本章判断应当不对称：Fourier
              在康复上看起来商业化真实，在人形机器人上技术可信，但照护人形机器人侧仍更接近试点阶段商业化，而不是已有规模化运营证明。
