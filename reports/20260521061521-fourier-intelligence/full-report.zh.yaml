      - number: '8.5'
        title: 证据要点
        blocks:
          - type: callout
            title: 不要把已备案战略锚点误当成已完整承销的运营估值
            body: Runyang 的文件有价值，因为它证明存在一个真实公开价格参考。但它不足以支持外部投资者高确信度入场，因为收入、毛利率和现金跑道仍未披露，融资背景还包含同步 ESOP 稀释。
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV030
          - type: callout
            title: Fourier 的商业化地板优于大多数纯人形机器人故事
            body: 康复业务意味着 Fourier 不像许多前沿人形机器人公司那样仍是零收入科学项目。搭建基准情景时，这个地板很重要，即便公开证据仍太薄，无法把它转化为充分支撑的溢价倍数。
            calloutType: strength
            claimRefs:
              - CV004
              - CV014
              - CV023
              - CV032
          - type: callout
            title: 可比集合很宽，因为 Fourier 夹在康复机器人和具身 AI 叙事之间
            body: >-
              Ekso 和 Lifeward 过于悲观，无法描述整家公司；Figure 和 Apptronik 又叙事过强，无法描述今天的
              Fourier。因此，估值章节必须做区间框定，而不是假装存在一个“正确”的单一同业集合。
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV018
              - CV022
              - CV023
          - type: callout
            title: 承销高于锚点前，要求披露或更便宜的价格
            body: 干净的决策规则很简单：没有收入、利润率、现金跑道、股权结构表和交割条款披露，就不给当前公开锚点支付溢价。如果披露改善，判断可以很快上调；如果披露到来前价格收紧，正确答案是等待。
            calloutType: recommendation
            claimRefs:
              - CV036
              - CV037
              - CV041
              - CV042
          - type: callout
            title: 情景区间是证据牵引的框定，不是隐藏 DCF
            body: 本章所有区间都假设公开锚点是可用参考，但不是自我验证的真相。它们也把股权价值粗略视为 EV 代理，因为公开债务和现金数据没有披露；这也是本章明确偏好情景框架、反对虚假精确的原因。
            calloutType: assumption
            claimRefs:
              - CV007
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
