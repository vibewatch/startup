      - number: '7.3'
        title: 出口管制、成本和竞争强度可能压缩高端医疗人形机器人策略的窗口
        blocks:
          - type: paragraph
            body: >-
              即便 Fourier 解决了产品就绪度，仍要穿过一个越来越奖励规模、低价格和合规深度的地缘政治与竞争环境。美国出口管制继续把涉华先进算力置于筛查、许可和最终用途纪律之下；即便 2026 年 BIS
              对特定芯片有所放松，也仍以安全控制、合规程序和第三方测试为条件。中国自身的人形机器人标准体系进一步抬高本地门槛，把安全、伦理、应用和数据 /
              模型治理要求延伸到全生命周期。与此同时，商业窗口正在收紧。TrendForce 预计中国 2026 年产量增长 94%，Unitree 和 AgiBot 份额接近 80%；TechCrunch 和 CNBC
              则描述了一个在高成本、软件、安全和泡沫压力下，从演示驱动的热度转向运营驱动采用的市场。这对 Fourier
              不利，因为其高端角度依赖医疗健康可信度，而公开证据仍显示人形机器人客户证明有限，估计价格点也远高于供应更广的低成本替代品。
