      - number: '4.3'
        title: 同行类比显示可用毛利率有可能，但服务和商业化仍会把毛利吃掉
        blocks:
          - type: paragraph
            body: >-
              由于 Fourier 不发布自己的 P&L，推理经济性的最佳公开办法，是用受证据约束的可比公司。Ekso Bionics 报告 2024 年收入 US$17.9 million，毛利率约
              53%，年末现金加受限现金 US$6.5 million，经营现金消耗 US$9.8 million。Lifeward 报告 2025 年收入 US$22.0 million，毛利率 38.2%，经营亏损
              US$19.7 million，并明确称销量较低、关税压力、运费和制造费用吸收不足拖累了部分利润率。CYBERDYNE 的 FY2026 收入为 ¥3,846 million，在资产负债表已建立的情况下仍有
              ¥601 million 经营亏损。这些可比公司重要，因为它们显示了一个反复出现的模式：康复机器人可以做到体面的硬件毛利率，却仍需要大量资本来支持销售周期、服务、报销工作和产品开发。Fourier
              自身公开信号也指向同一方向。TMTPost 称制造成本仍高；患者使用外骨骼的类比需要 40 到 50 小时训练，且仍依赖支付方批准或机构预算。含义不是 Fourier
              天然不盈利，而是这个品类运营足够重，单看毛利率无法回答现金消耗问题。
