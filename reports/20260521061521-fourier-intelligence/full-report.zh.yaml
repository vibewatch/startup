        title: 具名康复现场证据真实且可跨地域复现，但仍是样本式证据
        blocks:
          - type: paragraph
            body: >-
              最可信的客户证据来自具名康复现场和医院集群，它们说明了设备和用例。NHG Health 称 Fourier 技术已在 Tan Tock Seng Hospital 部署并评估，并把关系扩展为新的五年期 MOU 和
              Joint Rehabilitation Innovation Hub。Brooks Rehabilitation 称 ArmMotus EMU 和 ExoMotus M4 已部署在佛罗里达的 Center
              for Innovation。英国的 STEPS、Ascot 和 Hobbs 都给出超越标识墙的现场级证明：STEPS 列出广泛的 RehabHub 套件和结果报告，Ascot 描述由顾问主导、包含 10
              多台设备的路径，Hobbs 则点名 Laverstock Care Centre 已安装的设备栈。印度方面有 Saifee Hospital 的 ExoMotus M4 安装；新加坡 Ren Ci 通过
              ExoMotus 辅助试点研究，给出了最强的量化现场级结果证据。因此，跨多个国家和机构类型的复现性真实存在。但公开记录仍像样本，而不是核对过的客户清单；若干重要引用——例如 Nagoya 或 Shirley
