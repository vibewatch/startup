        - 多个 HAL 版本和居家服务，但没有公开可比 ASP
        - 差异化技术没有转化为公开定价清晰度
      - - Lifeward
        - ReWalk Personal / ReStore / AlterG
        - 据报 Medicare 挂钩个人外骨骼费率为 US$91,032
        - 个人报销 + 机构销售
        - 公开描述家庭 / 社区和诊所使用
        - Lifeward 能卖准入确定性，不只是硬件
      - - UBTECH
        - Walker S2 工业人形机器人
        - 无公开标价
        - 项目 / 解决方案销售
        - 批量交付、培训和场景部署支持
        - 竞争靠规模和运营能力，而不是公开标价
      - - Unitree
        - G1 人形机器人
        - 官方起价 US$13.5K
        - 直接销售 / 开发者级配置
        - 机器人硬件，可选计算和灵巧手升级
        - 给通用人形机器人设下激进低端价格锚
      - - Unitree
        - R1 人形机器人
        - 分析师摘要称 US$5.9K
        - 消费级 / 入门级销售
        - 市场叙事中的低成本人形机器人价格地板
        - 即使能力不同，也压迫高端人形机器人定位
      - - AgiBot
        - A2/X/G 组合
        - 无公开标价
        - 平台与定制化部署
        - 多场景组合，硬件 / 软件可配置
        - 覆盖面宽，但性价比仍由报价决定
      - - 1X / Figure
        - NEO Gamma / Figure 03
        - 保留官方来源中无公开标价
        - 等候名单、试点或伙伴部署模式
        - 有家庭帮手和工业叙事，但公开商务条款缺失
        - 仅靠公开 ASP 仍难以对西方同业做投资判断
    notes: 机器人行业公开价格数据异常稀薄。因此，该表混合了标价、报销锚点和明确未披露信息。应把它当作透明度地图，而不是严格可比的 ASP 表。
