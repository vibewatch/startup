      - number: '7.2'
        title: 人形机器人逻辑受缺失运营证明和隐私 / 责任暴露约束，远甚于认知度
        blocks:
          - type: paragraph
            body: >-
              人形机器人的风险栈不同于康复医疗科技栈。公开来源可以展示 GR-3 的设计意图、CES 可见度、照护导向交互功能，以及 Fourier
              从研究和康复走向更以人为中心环境的野心。但它们还没有展示具名付费部署、已披露监管路径或现场可靠性记录——这些才足以让投资者承销养老或医院邻近场景的规模化。独立追踪器和反向报道都把人形机器人线描述为商业化前或未经验证：没有公开确认的付费
              GR-1 或 GR-3 部署，没有具名 ROI 案例，高端 GR-2 的渠道触达也有限。这很重要，因为面向人的照护机器人把物理安全、自治、隐私和责任揉成一个包。面部、语音、触摸和情绪线索处理可能带来 GDPR
              和生物识别暴露；任何从演示空间进入辅助场景的动作，也会让制造商、运营方、集成商和云 /
              软件提供商之间的责任问题更尖锐。正确读法不是“没有丑闻浮出，所以低风险”，而是“后果很重的风险，因为公开营销界面眼下跑在披露的合规包前面”。
