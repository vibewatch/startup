              Fourier 的公开融资轨迹现在给出了可信的资本地图，尽管公司仍未披露经营财务。2022 年 Series D 从 SoftBank Vision Fund 2、Prosperity7 和 Yuanjing
              引入 RMB400 million；管理层称资金将加速商业化拓展、医疗机器人创新和全球增长。2025 年 1 月 Series E 据报道接近 RMB800
              million，并明确绑定进一步人形机器人开发和更广商业部署。信息量最大的文件不是 Fourier 新闻稿，而是 Runyang Technology 2025 年 6 月文件，因为它增加了 RMB8
              billion 投前估值锚点，显示计划出资 RMB300 million，换取稀释后 3.5060% 所有权，并披露同步 3.0% ESOP 增补。该文件还显示投资人化董事会结构，创始人保留 11 个提名权中的
