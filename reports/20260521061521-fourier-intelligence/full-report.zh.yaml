  - id: TV005
    title: 投资逻辑破裂与止损触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对估值的传导
      - 行动含义
    rows:
      - - Runyang 锚点未能交割或重定价
        - 最终交易低于已披露条款交割、明显延迟，或被结构化资本替代
        - 削弱唯一直接公开价格锚点，并暗示隐藏弱点
        - 立即下调；重置估值框架
      - - 下一次重大融资前仍无经济性披露
        - 又一轮大额融资到来，但仍不披露收入、利润率或现金跑道
        - 说明管理层仍预期投资者按叙事、而非经济性定价
        - 不要相对当前锚点支付溢价
      - - 人形机器人证明仍不具名
        - 下一个重大里程碑窗口内，没有具名付费人形机器人部署或任务级指标
        - 期权价值仍属投机，不应承载溢价倍数
        - 将估值维持在基准或悲观区间内
      - - 康复经济性披露后一旦令人失望
        - 披露的分部利润率、续约质量或客户集中度显著差于隐含预期
        - 移除 Fourier 区别于纯叙事同行的商业化底线
        - 视为重大下行重置
      - - 出现降价轮或厚重优先权堆叠
        - 新融资定价低于锚点，或引入强势高级权益
        - 即便企业叙事不变，普通股回报也会被压缩
        - 回避，或按更低普通股价值重新定价
    notes: 触发项指应改变投资测算的可观察事件，不是风险章节已覆盖的泛化业务风险。
    claimRefs:
      - CV034
      - CV035
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 尽调路径
    rows:
      - - 收入和毛利率
        - 当前年度收入、康复 / 人形机器人分部拆分、毛利率和贡献利润率
        - 用于把 Fourier 放进真实估值倍数区间，剔除伪精确猜测
        - 索取经审计或管理层确认的 KPI 包，以及客户 / 队列桥接
      - - 现金跑道和烧钱速度
        - E 轮和 Runyang 之后的现金余额、月度烧钱和营运资本状况
        - 看不清现金跑道，投资人就无法判断该锚点买到的是时间还是表面观感
        - 索取月度现金桥接和 12–18 个月计划
      - - Runyang 交割条款
        - 已披露投资是否完全交割、交割日期，以及条款是否有变
        - 本章的公开价格锚点取决于该交易真实且可持续
        - 索取已签署交割文件或更新后的股权结构表备忘录
      - - 优先股堆叠
        - 后续投资人的清算优先权、反稀释条款和高级权益
        - 普通股回报可能远差于企业价值测算显示的结果
        - 审阅融资文件和律师摘要
      - - 人形机器人商业化证据
        - 具名付费部署、合同规模、续约条款和任务 KPI
        - 用于证明人形机器人项目不只是期权价值
        - 访谈参考客户，并核验合同级部署证据
      - - 康复客户质量
        - 大客户集中度、复购节奏和续约行为
        - 用于判断康复业务是稳固底盘，还是只是 logo 覆盖面广
        - 分部队列分析和前 20 大账户审阅
    notes: 这些尽调问题按最快改变估值判断的能力排序。财务披露排在最前，因为其他估值论点都要建立在它之上。
    claimRefs:
      - CV041
      - CV042
      - CV043
