              主要客户风险并不是 Fourier
              没有任何现实采用，而是公开采用数据还不能让外部人把耐久收入与一个漂亮但混合的生态故事区分开。康复买家仍要过文档、编码、人员配置和资本开支逻辑，因此销售周期很可能锚定在服务提供方经济性和临床验证上，而不是纯功能兴奋。Thor、HTPG、Robocare
