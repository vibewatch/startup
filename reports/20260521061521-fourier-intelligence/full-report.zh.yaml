      - number: '6.3'
        title: 公开证据质量在康复工作流上最高，在收入耐久性上最弱
        blocks:
          - type: paragraph
            body: >-
              本章证据质量并不均衡，这对承销很重要。康复现场页面和医院研究可以证明真实使用、设备组合和部分运营适配。NHG 和 Brooks 强于纯新闻稿标识，因为它们描述了部署或现场评估。STEPS 和 Ren Ci
              更进一步，说明了使用情况、疗程报告或测量结果。但即便最好的公开引用，通常也停在投资者判断耐久性所需信息之前：合同期限、复购历史、续约时点、NRR、GRR、流失、附加率和现场级利用率曲线均未披露。这意味着公开记录支持“真实采用”的判断，却不必然支持“收入粘性强”。离开核心康复业务后，质量缺口进一步扩大。Nagoya、Kurage
              和 HTPG 是有战略意义的生态信号，但不应与终端客户证明混为一谈。它们更多展示渠道开发、R&D 合作和打包方案野心，而不是已预订需求。因此，公开客户证据能确立 Fourier
              在康复上商业化真实，却仍未回答这个装机基础能否以有吸引力的单位经济性可靠扩张、续约和交叉销售。
