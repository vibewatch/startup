  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: Fourier 的竞争图谱是双线分叉，不是单一市场
        blocks:
          - type: paragraph
            body: >-
              Fourier 的公开产品表面清楚显示，它试图桥接两个市场，而不是防守一个狭窄利基。公司仍通过 Fourier Rehab 销售密集康复栈——覆盖 40+ 国家 2,000 多家机构、整合 30+ 种机器人类型的
              RehabHub 层，以及多种肢体专用系统——同时又把 GR-1 作为量产人形助手、把 GR-3 作为面向照护的社交机器人来营销。这种双重身份意味着直接竞争集合拆成两组，且证明要求不同。康复侧，相关公开同行是
              Wandercraft、Ekso Bionics、CYBERDYNE 和 Lifeward，它们围绕临床证据、步态训练工作流，有时也围绕报销准入竞争。人形机器人侧，Fourier 遇到
              UBTECH、Unitree、AgiBot、Figure 和 1X；公开讨论集中在出货规模、价格底线、产能和试点部署。

              实际含义是，不能拿 Fourier 对标单一 “robotics”
              平均值。医院和康复买方关心治疗师效率、监管状态、设备是否适配报销或照护流程。工厂、物流、研究和早期家庭买方更看重自主性、操作能力、硬件可靠性和标价。这让 Fourier
              的照护人形机器人策略有意思，也很脆弱：它继承了比工业优先人形机器人同行更强的照护相邻性，也继承了比消费或工厂机器人供应商更慢的医疗式证据标准。
