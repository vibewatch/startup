  - id: FM001
    title: 市场规模分层：Fourier 核心可服务市场的 TAM / SAM / SOM（2026）
    type: pyramid
    layout: standard
    summary: 三层金字塔展示 Fourier 的可服务市场：从广义康复 + 医疗健康人形机器人 TAM，下沉到保守的 2026 年 SOM 估计。
    data:
      items:
        - label: TAM —— 全球康复机器人 + 医疗健康人形机器人（2026）
          value: 12.91
        - label: SAM —— 核心康复机器人中档共识（2026）
          value: 2
        - label: SOM —— Fourier 可获取份额（保守、受证据约束）
          value: 0.15
    approximationNotes: >-
      TAM 由中档康复机器人市场（~USD 2B）与 FMI 人形机器人医疗健康细分（USD 10.69B 的 28% = ~USD 3B）相加，再扣除重叠（~USD 0.9B），约为 USD 4.1B；金字塔的 USD
      12.91B 数值把 FMI + TBRC 人形机器人总市场中点全额纳入，作为最宽的合理 TAM 边界。SAM 仅采用 Mordor/TBRC 对康复机器人的中档估计（USD 2.0B）。考虑到 Fourier 披露的
      2,000+ 家机构基础，SOM 是对 SAM 中 <10% 机构份额的定性估计。
    claimRefs:
      - CM001
      - CM013
      - CM014
      - CM022
