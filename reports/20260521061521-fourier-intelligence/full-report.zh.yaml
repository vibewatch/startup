      - number: '8.4'
        title: 本章决策规则很简单：缺失运营事实变成披露证据前，不要高于锚点出价
        blocks:
          - type: paragraph
            body: >-
              这里最重要的估值纪律是程序性的。Fourier
              不需要再拿一份叙事材料来改善判断；它需要一小组运营披露，让投资者能把它放进真实估值框架里。第一道门是财务可见度：收入、毛利率、烧钱速度和现金跑道。第二道门是融资质量：Runyang
              交易是否真的按公开描述条款完成，以及普通股之上有什么优先股堆叠或反稀释保护。第三道门是商业化质量：具名付费人形机器人部署、客户集中度、续约行为，以及康复销售耐久而非只是覆盖面广的证据。在这些事实可见之前，建议应保持价格敏感和证据敏感。也就是说，不要在公开锚点之上做高确信度承销，也不要把虚假精确的
              DCF 强加到一家不透明私人公司上。上行情景足够真实，公司原则上仍可投资，尤其因为康复业务给了它许多人形机器人初创公司没有的地板。但公开记录仍支持等待更好披露或更有吸引力的入场价格，而不是把当前锚点视为自证有效。
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
