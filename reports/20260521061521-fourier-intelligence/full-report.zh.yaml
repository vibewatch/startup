  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 估值范围（RMB bn）
      - 核心假设
      - 关键缺失证据
      - 行动含义
      - 概率信号
    rows:
      - - 悲观
        - 4.5–6.0
        - 康复业务仍真实，但规模小于隐含预期；人形机器人证明多停留在宣传层面；新资金重定价风险
        - 无公开收入、无具名付费人形机器人部署、无清晰融资交割确认
        - 避免按当前锚点付价；等待重置或披露
        - 若下一轮融资带结构化条款或折价，该情景信号明显
      - - 基准
        - 6.5–8.5
        - 康复商业化实质真实，人形机器人保留期权价值，但公开披露没有改善
        - 分部经济性、现金跑道、续约质量
        - 观察 / 继续研究；不要高于锚点付价
        - 与当前公开记录最一致
      - - 当前公开锚点
        - 8.0 投前 / ~8.56 完全稀释
        - Runyang 文件真实，Series E 历史支持其持续获得资本
        - 最终交割条款、优先股堆叠和当前经济性仍缺失
        - 只作为价格参考；不是充分承保证明
        - 已接近基准情景支撑上沿
      - - 乐观
        - 9.5–13.0
        - 披露的收入和利润率强度、持久康复续约、具名付费人形机器人部署，支撑更高倍数待遇
        - 需要证明上行来自经营，而不只是叙事
        - 只有披露或里程碑证明落地后才上调
        - 需要多个新事实，而不只是另一条融资标题
    notes: 区间是受证据约束的分析师估计，不是 DCF 输出。Fourier 没有披露收紧模型所需的经营数据，因此有意避免虚假精确。
    claimRefs:
