      - number: '3.3'
        title: 人形机器人对手用价格、销量或工业验证重置市场，而不是临床适配
        blocks:
          - type: paragraph
            body: >-
              在人形机器人上，Fourier 不是规模领导者，也不是价格领导者。UBTECH 已把自己呈现为上市的全栈人形机器人公司，具备量产、汽车合作伙伴，以及对养老和商业服务的明确敞口。Unitree
              是公开价格破坏者：G1 在其官网起价 US$13.5K，外部市场摘要则指向 R1 为 US$5.9K，远低于机构康复硬件所隐含的定价逻辑。TrendForce 的 2026 年观点认为 Unitree 和
              AgiBot 合计可能拿下中国出货近 80%，凸显中国厂商正在多快把这个品类工业化。AgiBot 自身材料和 CES 新闻稿主张显示，其产品家族很宽，并已出货数千台机器人，尽管独立验证仍不均衡。

              西方同行姿态不同。Figure 首页现在为 Figure 03 销售居家帮助叙事，但公开记录里最强的证明仍是 BMW：日常班次、装载 90,000+ 个零件，并影响 30,000+ 辆车，场景在汽车制造。1X
              更明确地优先家庭，强调内部居家测试、更安静硬件、被动安全和遥操作。这意味着 Fourier 的 GR-1 和 GR-3 差异化不在原始自主性或制造规模，而在照护相邻性。GR-3 的软壳、强调触感的设计，以及
              GR-1 的类人助手框架，比大多数工业同行更适合照护或社会陪伴叙事。但这也是 Fourier 的弱点：GR 系列规模化部署、公开价格和量化 ROI 的公开证据，明显薄于 Unitree 的价格底线、UBTECH
              的订单簿或 Figure 经合作伙伴验证的生产学习。
