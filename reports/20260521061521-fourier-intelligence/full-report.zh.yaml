      - number: '3.4'
        title: Fourier 的护城河是分销和照护适配，但商品化压力正在快速上升
        blocks:
          - type: paragraph
            body: >-
              Fourier 最可防守的差异点，不是其人形机器人今天能力最强；而是 Fourier
              已经是少数嵌入康复服务机构工作流的人形机器人进入者之一。这一点重要，因为医院和康复采购仍然更依赖信任、培训、服务和临床舒适度，而不是炫技。把照护导向人形机器人叠加到现有康复渠道上，比通用消费或工厂人形机器人突然转向养老照护，更像一个可信的商业化楔子。这也是
              Fourier 双重身份的战略价值：康复业务可以播下关系、数据集和渠道准入，这些是纯人形机器人厂商尚未拥有的。

              这条边的耐久性仍有限。公开竞争者证据表明，人形机器人品类仍处在试点阶段且受安全约束；灵巧操作、续航、触觉感知和最低风险行为，在真实环境中仍未解决。这些限制帮到
              Fourier，因为它们拖慢了所有人。但它们没有解决更大的商业风险：一旦人形机器人硬件更便宜、更模块化，照护相邻软件、服务和临床工作流整合，可能比真正的报销护城河更容易复制。手工治疗、传统辅助设备、内部自动化项目，以及
              Wandercraft 的 Calvin-40 或中国工业平台等相邻进入者，仍是可信替代品或未来威胁。因此，近期判断需要细分：Fourier
              拥有比多数人形机器人同行更强的照护叙事，但公开展示的规模弱于对手，对美国报销的证明也弱于最佳康复在位者。
