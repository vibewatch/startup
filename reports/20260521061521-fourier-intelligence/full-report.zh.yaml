        title: 财务结论是细分需求和定价权有吸引力，但不透明度太高，难以清晰承销
        blocks:
          - type: paragraph
            body: >-
              证据支持一个可信的乐观情景：Fourier
              多次完成大额融资，仍能拿到机构级价格点，在海外康复收入上有一个可信公开增长线索，并处于相邻报销和康复市场，预算可以支撑高价值硬件。但反向情景比管理层话术承认的更强。公开层面仍没有收入基数、ARR、毛利率、营运资本画像、月度烧钱速度或现金跑道。最新估值信号来自战略投资文件，而非经审计经营表现。公开价格集合内部也不均质：一些康复设备以几十万人民币成交，更大的系统和人形机器人分销商挂牌价则高得多，使按套装归一化的利润率推断不可能。同行类比显示，38%
              到 53% 毛利率并不能阻止每年数百万美元亏损或烧钱。对承销而言，正确态度不是“Fourier 没有经济性”，而是“Fourier
