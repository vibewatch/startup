  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围定义
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence 的可服务市场位于两个结构上不同、但正在加速重叠的机器人板块交汇处。第一是康复机器人：动力外骨骼、治疗机器人和辅助步态设备，主要卖给康复中心、医院，并通过新的
              Medicare 路径直接卖给家庭用户。第二是人形与具身 AI 机器人：拟人化、全身机器人，面向工业、医疗和消费终端市场。Fourier 通过 GRx 人形机器人平台和成熟的 Fourier Rehab
              组合同时参与这两类市场。

              Fourier 的主要总可用市场（TAM）不包括：手术机器人（报销路径和买方群体不同）；非穿戴式固定康复设备（持续被动运动、超声治疗）；以及覆盖物流、酒店和清洁机器人的更广义专业服务机器人市场（Fortune
              数据为 2026 年 USD 31.11B，由运输和物流主导）。把广义服务机器人作为叠加 TAM 会误导判断——Fourier 当前并不覆盖物流或酒店应用。

              International Federation of Robotics
              正式把动力外骨骼归入医疗机器人分类下的可穿戴机器人，区别于工业机器人。康复和非侵入治疗机器人被单独跟踪为医疗机器人子类。这种定义精度很重要：IFR 医疗机器人品类 2024 年单位销量激增
              91%，其中康复和非侵入治疗增长 106%，显示 Fourier 核心细分正在急剧加速。

              机器人康复的现状替代品包括：持证物理治疗师和作业治疗师提供手工治疗；体重支持跑台系统（非机器人）；以及标准矫形器具，包括非动力支具。从这些替代品迁移到机器人系统，取决于证据、报销覆盖、前期成本接受度和面向治疗师的工作流整合——这些结构性障碍也定义了
              Fourier 可服务市场的采纳天花板。
