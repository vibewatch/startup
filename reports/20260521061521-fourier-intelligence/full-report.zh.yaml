        - 治疗卒中、神经康复和上肢恢复患者的治疗师
        - 已商业化，且有具名客户场景
        - 结合缆索驱动柔顺控制、EMG 或精细运动训练，以及认知 / 互动治疗
        - 未公开按模块拆分的比较结果数据集
      - - 下肢和移动能力模块（AnkleMotus、CycleMotus、BalanceMotus、ExoMotus）
        - 步态、平衡、移动能力和早期康复团队
        - 已商业化，有手册和客户证据
        - 从早期下床活动到步态辅助均有覆盖，并加入力反馈和传感训练
        - 支付方路径、使用率和服务负担仍不透明
      - - GR-1 人形机器人
        - 研究人员、企业试点、创新团队
        - 2023 年以来公开的产品平台
        - 量产定位，加上集成 FSA 和纯视觉感知叙事
        - 量产买家名称和支持条款未公开
      - - GR-2 人形机器人
        - 研究、工业实验、医疗康复探索
        - 架构信息丰富，但应用证据仍偏实验性
        - 53 DOF、FSA 2.0、可选 12-DOF 双手，以及更开放的开发表面
        - 未公开付费部署案例或可靠性 KPI
      - - GR-3 照护机器人
        - 照护、陪伴、接待和辅助交互试点
        - 处于展示阶段的国际商业化
        - 55 DOF，以及围绕照护打造的多模态交互栈，强调温度感和触觉
        - 没有具名量产客户、认证包或详细现场规格
      - - N1 开源人形机器人
        - 全球开发者、研究人员和实验室
        - 面向开发者，商业化仍早期
        - 更小的 23-DOF 机身，运动范围有文档说明，也开放传感器扩展
        - 公开部署证据远薄于工具面
      - - 组件和 API 层（DexHand、FSA、SDKs、客户端）
        - 内部工程师和外部开发者
        - 有公开文档，但部分工具仍处 alpha 阶段
        - 自研手部和执行器栈开放到底层 SDK
        - 发布纪律、兼容性稳定性和安全姿态披露不足
    notes: 本矩阵混合了商业部署、产品页、支持文档和开发者仓库。「公开成熟度状态」反映留存公开材料能证明什么，不代表内部出货量、正常运行时间或收入排名。
