        title: 身份、足迹与商业模式
        blocks:
          - type: paragraph
            body: >-
              Fourier 把自己呈现为全栈机器人公司，公开身份同时覆盖通用机器人品牌（“Fourier”）和聚焦康复的子品牌（“Fourier Rehab”）。官方 About 与首页材料称，公司成立于 2015
              年，从外骨骼康复机器人起步，此后扩展出更广产品组合，包括 GRx 人形机器人系列、RehabHub、MetaMotus Galileo
              系统和开源工具。公司联系页面把运营足迹锚定在上海、新加坡和马来西亚；多个官方页面则称 Fourier 服务 40 多个国家和地区的 2,000 多家机构。这个组合具有战略意义：Fourier
              不是纯人形机器人创业公司，已经在康复和临床场景有装机基础，可用于验证硬件、收集数据，并交叉销售更新的人形机器人产品。公开层面，公司仍以产品叙事而非细颗粒商业指标来讲业务；所审阅来源均未披露收入、毛利率或年经常性收入（ARR）数字。
