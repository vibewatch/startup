companyProfile:
  summary: >-
    Fourier Intelligence 对外将通用机器人产品线品牌化为 Fourier，是一家 2015 年由 Alex Gu 创立、总部在上海的机器人公司。公司从康复机器人起步，已拓展至全尺寸人形机器人；公开材料覆盖
    Fourier Rehab 装机业务、RehabHub 工作流，以及 GR-1、GR-2、GR-3 和 N1 人形机器人产品线。公司公开材料称，Fourier 服务超过 40 个国家和地区的 2,000 多家机构；2024 年
    GR-2 发布公告称，公司全球员工超过 500 人。资本基础可信：2022 年 Series D 融资 RMB 400 million，2025 年 Series E 融资近 RMB 800 million，Runyang
    的战略投资披露则指向 RMB 8 billion 投前估值。但在公开层面，公司财务仍不透明。
