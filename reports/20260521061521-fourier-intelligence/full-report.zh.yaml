      - 阈值 / 事件
      - 行动含义
    rows:
      - - 人形机器人商业化证明缺口
        - 具名付费部署披露
        - 至少一个具名 GR-1 或 GR-3 客户，确认付费状态，并披露 KPI 或 ROI 细节
        - 明显改善承保判断；若缺席，人形机器人仍只是期权，而非基准情景增长
      - - 护理用途监管不透明
        - 按型号公开的档案或路径
        - 发布 CE / FDA / NMPA 分类、预期用途边界，或贴近患者使用的时间表
        - 降低监管尾部风险；若持续缺席，应采用更慢的采用假设
      - - 安全和产品责任冲击
        - 召回、NCAR、FSCA 或严重事件通知
        - 任何需要公开纠正措施或广泛现场通知的患者安全事件
        - 立即触发下行；重审部署假设，并为服务 / 补救成本预留
      - - 康复报销转化风险
        - 医疗服务方利用率和拒付证据
        - 标杆站点显示稳定利用率、可接受的 KX 拒付率，以及复购或续约行为
        - 支撑康复业务韧性；若失败，说明工作流收益没有转化为持久经济性
      - - 出口管制与算力依赖
        - 芯片或许可证导致发货或训练中断
        - 新限制或供应商中断让路线图或发货延迟超过一个季度
        - 重设发布节奏、利润率假设和资金需求
      - - 竞争性价格压缩
        - 可比对手在成本和可及性上超过 Fourier
        - 低成本对手广泛可得，而 Fourier 仍缺少溢价证明
        - 高端医疗人形机器人逻辑削弱，估值支撑应压缩
    notes: 触发项按可观察性选择：可通过公开披露、采购证据、监管通知或明确客户案例跟踪。
    claimRefs:
      - CR022
      - CR027
      - CR036
      - CR043
      - CR044
      - CR045
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 判断依据
      - 投资含义
    rows:
      - - 投资建议
        - 继续研究 / 观察
        - 公开证据支持其有真实业务和真实融资锚，但经济性不足，难以有把握地承保价格
        - 没有私有尽调访问权时，不要追着公开锚点加价
      - - 置信度
        - 中
        - 核心不确定性来自经营披露缺失，而非公开事实彼此矛盾
        - 若收入和利润率数据浮出，保留修正空间
      - - 风险评级
        - 高
        - 人形机器人期权有价值，但公开经济性不透明，情景分布很宽
        - 要求下行保护和明确止损触发项
      - - 估值立场
        - 对内部投资人合理到偏高；对新外部投资人偏高
        - 战略内部投资人可能比公开投资者更了解收入质量和交割条款
        - 外部投资者不应假设自己拥有内部视野
      - - 公开锚点
        - 可作为有用的上限测试，但不是干净的公允价值证明
        - Runyang 文件是真实的，但背景包含战略资本和同步 ESOP 稀释
        - 把 RMB8bn 投前估值当作参考点，而非充分的承保答案
      - - 回报门槛
        - 3x 需要约 RMB24bn 退出价值
        - 该结果需要重大收入披露和更强的人形机器人商业化证明
        - 不要基于当前锚点把 3x 建成基准情景
    notes: 本表有意保留判断色彩：它从公开证据归纳投资结论，而不是复述公司质量卖点。
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 康复业务
        - 真实康复布局很可能给 Fourier 提供商业化底线
        - 公开投资者仍看不到收入质量、毛利率或续约韧性
        - 披露分部收入、毛利率和头部客户集中度
      - - 人形机器人项目
        - 在康复之外增加上行期权和战略相关性
        - 公开证明仍远弱于美国叙事龙头，可能还不足以支撑溢价定价
        - 披露具名付费部署和任务级运营指标
      - - 资本基础
        - Series E 和 Runyang 显示其具备可信融资能力
        - 锚点来自战略融资背景，而非透明经营表现
        - 展示最终交割条款、投后估值和股权结构瀑布
      - - 可比公司框架
        - Fourier 介于康复设备和人形机器人平台两类之间
        - 这种中间位置也可能意味着它吃到两类折扣，却拿不到任一类的完整溢价
        - 说明 Fourier 凭什么获得可持续的倍数区间，而不只是叙事期权
      - - 入场纪律
        - 如果隐藏经济性强，当前锚点可以辩护
        - 缺少经济性披露时，新投资者承保的不只是业务质量，也是在承保管理层不透明
        - 要么改善披露，要么要求更便宜的入场价格
    notes: 每一行都说明什么才会真正改变判断；没有这些变化，反向逻辑仍然有效。
    claimRefs:
