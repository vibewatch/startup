      - number: '2.4'
        title: 相邻市场：人形与具身 AI 机器人
        blocks:
          - type: paragraph
            body: >-
              人形机器人市场是 Fourier 更长期的增长向量，也是其最雄心勃勃的市场进入主张。两个大样本分析估计把 2026 年全球人形机器人市场分别放在 USD 10.69 billion（FMI）和 USD 8.32
              billion（TBRC），未来五年 CAGR 分别为 37% 和 47–53%。医疗是领先应用场景；FMI 将 2026 年人形机器人收入的 28% 分配给医疗相关用例，意味着约 USD 3.0 billion
              的可服务医疗人形机器人支出。

              Roland Berger 2026 年 4 月报告描绘了更长周期：预计运营成本为每小时 USD 2，使人形机器人在面临结构性劳动力短缺的地区相对人力具备经济吸引力；到 2035 年，OEM 层面市场可能达到
              USD 300 billion（基准）至 USD 750 billion（乐观）。TrendForce 预计中国人形机器人产出将在 2026 年增长 94%，Unitree 和 AgiBot 合计约占出货量
              80%，行业正从演示转向交付。BusinessWire 引用 Goldman Sachs 数据称，人形机器人成本同比下降 40%，远快于此前模型中的 15–20% 降幅；当前机器人成本区间为 USD 30,000
              到 USD 150,000。Unitree 的 R1 于 2025 年 7 月以 USD 5,900 发布，确立了低于 USD 10,000 的消费级价格点。

              FMI 和 TBRC 估计相差约 USD 2.37 billion，反映范围边界、地理覆盖和假设时间点不同。两者也高于一些独立行业观点——Roland Berger
              指出，今天除狭窄工业试点外，人形机器人几乎没有能真正产出的用例，生态系统（软件、集成、安全认证）落后硬件成熟度三到五年。

              对 Fourier 而言，人形机器人市场里真正相关的可服务可获取市场（SAM）不是完整 USD 8–11 billion，而是 Fourier 的 GR-3 人形机器人所定位的医疗、康复和照护辅助子细分。按
              FMI 28% 医疗份额套用 USD 10.69B 总量，意味着 2026 年医疗人形机器人 TAM 约 USD ~3B；但 Fourier 将面对 Figure、Agility、Unitree、Boston
              Dynamics 等全球平台领导者，它们资本和制造规模明显更强。GR-3 通过照护中心设计和临床装机基础形成差异化，这是一个独特角度，但近期市场份额渗透会受限。保守看，2027 年前 Fourier
              在人形机器人市场的可服务份额远低于 5%。
