  - id: TI001
    title: 收入来源表
    columns:
      - 收入流
      - 公开变现证据
      - 公开价格或预算锚点
      - 收入质量判断
      - 具体尽调问题
    rows:
      - - 康复资本设备
        - 官方康复页面和医院采购记录显示，公司向机构护理场景销售设备和系统
        - 单台上肢机器人 RMB280k-RMB347k；较大型康复系统 RMB1.07m-RMB1.368m
        - 企业硬件收入可能较不均衡，受招标节奏和打包差异影响
        - 需要按康复 SKU 拆分的实际 ASP、安装收入和产品级毛利率
      - - 人形机器人企业系统
        - GR-3 通过联系销售的企业页面和第三方价格信号营销，而不是 Fourier 开放公开购买入口
        - TMTPost 称 >RMB200k；Europa 结构化数据列出 EUR106,344.61
        - 早期企业人形机器人收入可能由报价驱动，且对试点敏感
        - 需要已成交出货量、实际售价，以及价格是否包含服务还是仅硬件
      - - 实施、培训与维护
        - 同业外骨骼部署需要 40-50 小时培训和持续支持，意味着既有服务收入也有服务成本
        - 没有 Fourier 直接价格；同业显示支持强度的经济影响不小
        - 服务可能扩大合同价值，但定价过低也会吃掉毛利
        - 需要每套已安装系统的培训附加率、服务合同附加率和年度维护收入
      - - 平台或软件层
        - RehabHub 和开发者材料暗示存在数字化编排，以及数据或软件附加销售
        - 未发现公开的独立软件价格
        - 可能存在质量更高的经常性收入，但收入占比未披露
        - 需要软件许可、订阅或数据平台收入占比
      - - 报销驱动准入类比
        - 同业外骨骼报销表明，支付方支持可以释放超高价设备的支付意愿
        - 既定 Medicare 费率 US$91,032，以及约 US$100k 的设备成本类比
        - 准入顺风确实存在，但需逐案判断，不能替代 Fourier 专属毛利披露
        - 需要按市场确认报销路径，并确认 Fourier 哪些产品符合条件（如有）
    notes: 本表混用 Fourier 自身证据、支付方和同业参照，因为 Fourier 披露了产品和渠道，但没有披露实际收入结构、附加率或经常性软件占比。
