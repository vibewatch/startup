  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 康复买家清晰可见；付款人与预算权仍嵌在服务提供方工作流里
        blocks:
          - type: paragraph
            body: >-
              Fourier
              的公开客户地图不是单一同质买方。文档最充分的用户，是康复服务提供商和医院康复科；它们采购技术，是为了嵌入治疗师主导的照护交付，而不是买一台独立消费设备。在这些场景里，机构是买方，治疗师和康复团队是日常用户，患者则是既有照护项目中的受益者。公开网站页面反复围绕可测量训练、工作流贴合、治疗师效率和数据采集讲价值，而不是只讲硬件新奇。这很关键，因为支付逻辑位于机器人之上一层：CMS
              文档规则和 NIH 报销指南都显示，医疗设备采用仍要嵌入可计费治疗路径、留档照护计划和服务提供方内部 ROI
              案例。由此形成的买方栈里，康复主任、创新负责人、采购或财务委员会、临床文档负责人都重要。在这套栈的边缘，Fourier
              还展示了研究实验室买家、分销商主导的私人诊所以及早期具身照护试点，但这些细分场景的公开付款和续约可见度，远弱于康复核心业务。
