    layout: standard
    summary: 六个公开指标最能解释截至 runDate 的 Fourier 竞争姿态：一个明确的康复渠道优势、两个由竞争对手掌握的报销和价格锚点，以及三个有利于工业人形机器人同行的规模信号。
