  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 康复医疗科技风险在报销、合规和上市后纪律，不在产品是否存在
        blocks:
          - type: paragraph
            body: >-
              Fourier 的康复业务已经不是从 0 到 1 的证明故事。Brooks 和 Fourier 自身材料支撑一套真实装机产品，公司也公开把叙事锚定在 2,000+ 家机构、40
              个国家的足迹上。相较许多人形机器人初创公司，这降低了产品存在性风险，但没有消除医疗科技式监管和报销风险。在欧洲，AI 医疗设备今天仍经由 MDR 进入市场；随着制度分阶段落地，还要吸收 AI Act
              对数据治理、透明度、网络安全、人类监督和上市后监测的义务。在美国，FDA 指南把网络安全纳入设备合规；一旦患者邻近系统在现场失效，召回、纠正、移除和警戒制度都会变得重要。需求侧，CMS
              仍把治疗经济性绑在有记录的医疗必要性和正确编码上，而不是机器人新奇感上。RehabHub 的工作流和数据承诺可能帮助服务提供方，但投资者仍需要证明这些好处会转化为可报销使用、续约质量和耐久现场经济性。
