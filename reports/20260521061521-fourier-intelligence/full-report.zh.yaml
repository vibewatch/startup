  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: Fourier 最有公开验证的工作流，如何从治疗师目标进入机器人训练、数据采集和照护计划迭代。
    data:
      nodes:
        - id: assessment
          label: 评估与目标
          type: input
          detail: 治疗师确定康复阶段、目标动作和安全约束
        - id: selection
          label: 设备 / 场景选择
          type: process
          detail: 按具体任务选择 RehabHub 模块或护理机器人交互
        - id: session
          label: 机器人引导训练
          type: process
          detail: 在监督路径内开展交互式、力反馈或步态导向训练
        - id: capture
          label: 数据与反馈采集
          type: process
          detail: 训练中记录力、位置、ROM、认知或交互信号
        - id: review
          label: 治疗师复核
          type: process
          detail: 临床人员监测质量、进展，以及支持强度是否要上调或下调
        - id: progression
          label: 调整后的照护计划
          type: output
          detail: 下一轮训练单元或模块按可测反应微调
      edges:
        - from: assessment
          to: selection
          label: 映射到
        - from: selection
          to: session
          label: 执行
        - from: session
          to: capture
          label: 写入
        - from: capture
          to: review
          label: 提供依据
        - from: review
