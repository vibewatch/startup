summary:
  headline: Fourier 是可信的康复机器人公司，已有真实装机基础，也有技术上认真的人形机器人项目；但经济性、客户质量披露和具名付费人形部署都缺失，当前 RMB 8 billion 锚点难以支撑。按公开估值投入资本前，应继续研究。
