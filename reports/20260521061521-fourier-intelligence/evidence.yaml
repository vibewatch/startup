evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure-gaps
    missingEvidence: Audited revenue, gross margin, ARR, backlog, and cash-flow data for 2024-2025.
    whyItMatters: Without operating-financial disclosure, valuation discipline and capital-efficiency analysis remain weak.
    diligencePath: Request audited financials or monthly management accounts under NDA during live diligence.
  - type: private-evidence-only
    severity: material
    topic: governance-gaps
    missingEvidence: Current cap table, investor ownership percentages, board composition, observer rights, and debt facilities.
    whyItMatters: Governance rights and senior-claims structure affect control, downside protection, and refresh valuation analysis.
    diligencePath: >-
      Request the latest shareholder register, financing documents, and board materials from the company or lead
      counsel.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: commercialization
    missingEvidence: Primary-source disclosure of GR-1 / GR-2 cumulative deliveries, paid deployments, and customer mix by segment.
    whyItMatters: >-
      The public '100+ delivered' narrative rests on secondary coverage and does not establish recurring commercial
      scale.
    diligencePath: Ask for shipment logs, customer references, or audited order-book summaries by product generation.
    relatedQuestionRefs:
      - QO021
  - type: stale
    severity: material
    topic: valuation and investor map
    missingEvidence: >-
      A formally disclosed post-money valuation or priced-round documentation after the 2025 strategic-investment
      disclosures, plus a current investor-by-investor ownership table.
    whyItMatters: >-
      The public valuation anchor is pre-money and does not reveal dilution, round terms, fair-market marks, or which
      investors currently dominate the capitalization stack.
    diligencePath: >-
      Request signed transaction documents for the Runyang investment, the latest capitalization table, and any
      post-Series E financing updates.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone chronology and offices
    missingEvidence: >-
      Primary-source disclosure of any Europe or U.S. office addresses, manufacturing locations, role split by region,
      and a fuller public chronology of operating milestones.
    whyItMatters: >-
      International operational depth and milestone completeness affect commercialization, support economics,
      geopolitical exposure, and confidence in the public company narrative.
    diligencePath: >-
      Request an org map or facilities list showing R&D, manufacturing, and commercial operations by geography, plus an
      internal milestone deck or board history timeline.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: payer-landscape
    missingEvidence: >-
      Coverage data for rehabilitation robot reimbursement in non-U.S. markets including major European payers (Germany
      GKV, France UNCAM), Japanese NHI, and Chinese NHSA.
    whyItMatters: >-
      North America is ~75% of the market by Fortune's estimate, but Asia-Pacific at 21.2% CAGR is the fastest-growing
      region. Without non-U.S. payer clarity, the international SAM accessible to Fourier's institutional sales is
      undeterminable.
    diligencePath: >-
      Conduct targeted searches for European and Japanese rehabilitation robot reimbursement decisions and Chinese
      provincial healthcare procurement programs; interview Fourier's regional sales teams.
    relatedQuestionRefs:
      - QM027
  - type: missing-source
    severity: material
    topic: market-boundary
    missingEvidence: >-
      Empirical data on the revenue and market share of conventional physiotherapy services as the primary
      substitute—specifically the total clinical rehabilitation services spend addressable by robotic automation and the
      substitution rate to date.
    whyItMatters: >-
      Without sizing the substitute market, it is impossible to determine realistic penetration curves or the ceiling on
      robotic rehabilitation market growth from existing physio volumes.
    diligencePath: >-
      Review WHO Global Health Observatory rehabilitation workforce data, national health accounts for physiotherapy
      expenditure, and published substitution-rate studies.
    relatedQuestionRefs:
      - QM017
  - type: conflicting-data
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Granular methodology documentation from TBRC, Mordor, IMARC, and Fortune to reconcile the 3.8× spread in
      rehabilitation robotics market estimates; specifically, which scope inclusions/exclusions drive the USD 579.5M vs.
      USD 2.22B divergence.
    whyItMatters: >-
      Without understanding scope, a planner cannot determine which estimate is relevant to Fourier's actual product
      categories and cannot reliably compute SAM or market share.
    diligencePath: >-
      Purchase at least two full methodology appendices from conflicting analyst reports and compare inclusion/exclusion
      criteria for exoskeleton, assistive, and service categories.
    relatedQuestionRefs:
      - QM022
  - type: missing-source
    severity: material
    topic: figure-home-vs-industrial-mix
    missingEvidence: >-
      Current paid-customer split, unit shipments, or booked revenue showing how much of Figure's demand is truly
      home-help versus industrial.
    whyItMatters: >-
      Figure is a major benchmark for Fourier's GR ambitions, but the public story mixes a home narrative with an
      industrial proof point.
    diligencePath: >-
      Request Figure customer mix, booked backlog by use case, and any non-BMW field deployments in healthcare, retail,
      or home environments.
    relatedQuestionRefs:
      - QP012
  - type: missing-source
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Win/loss data, contract length, replacement rates, implementation times, and retraining burden when rehab
      providers switch between platforms.
    whyItMatters: Moat durability depends on whether Fourier's installed base is sticky or merely an early distribution lead.
    diligencePath: >-
      Ask Fourier and reference sites for renewal cohorts, displacement cases versus Ekso/Lifeward/Wandercraft, and
      workflow migration timelines.
    relatedQuestionRefs:
      - QP019
  - type: private-evidence-only
    severity: material
    topic: competitor-funding-disclosure
    missingEvidence: >-
      Primary financing documents or consistently updated official disclosures for private peers such as Wandercraft,
      AgiBot, and 1X.
    whyItMatters: >-
      Capital intensity determines who can subsidize pilots, pricing, and safety validation long enough to outlast
      slower care-market adoption.
    diligencePath: >-
      Collect official round announcements, board-approved financing summaries, or investor materials rather than
      relying on secondary databases alone.
    relatedQuestionRefs:
      - QP024
  - type: missing-source
    severity: material
    topic: humanoid-price-performance-roi
    missingEvidence: >-
      Realized ASP, service bundle terms, maintenance burden, and labor-hour ROI for Fourier GR-series versus UBTECH,
      Unitree, Figure, and 1X.
    whyItMatters: >-
      Without comparable commercial terms, it is impossible to underwrite whether Fourier's care-first positioning is
      premium-justified or vulnerable to commoditization.
    diligencePath: >-
      Request quotes, service contracts, pilot budgets, and post-deployment ROI analyses from Fourier and at least two
      peer buyers in each segment.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-statements
    missingEvidence: Audited 2024-2025 revenue, gross margin, operating expense, EBITDA, and cash-flow statements for Fourier.
    whyItMatters: Without the basic statements, valuation, burn, and unit economics cannot be normalized to actual operating scale.
    diligencePath: Request the latest audited annual accounts plus monthly management reporting by segment and geography.
    relatedQuestionRefs:
      - QI011
      - QI022
      - QI025
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-attach
    missingEvidence: Closed-won pricing, discounting, service attachment, software attachment, and warranty terms by product line.
    whyItMatters: Fragmented public price anchors are not enough to infer contribution margin or repeatability.
    diligencePath: >-
      Request a product-level bookings file with realized ASP, discount, services, and renewal data for the last 12
      months.
    relatedQuestionRefs:
      - QI004
      - QI005
      - QI026
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-runway
    missingEvidence: Current cash balance, monthly burn, runway assumptions, and any restricted cash or supplier-finance exposure.
    whyItMatters: The financing story cannot be translated into capital adequacy without a live liquidity view.
    diligencePath: Request the latest balance sheet, 13-week cash forecast, covenant package, and scenario-based runway model.
    relatedQuestionRefs:
      - QI022
      - QI025
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: material
    topic: cap-table-terms
    missingEvidence: >-
      Liquidation preferences, debt facilities, guarantees, board observer rights, and any secondary or structured
      financing terms.
    whyItMatters: >-
      Equity headline value can differ materially from effective economic value if senior claims or protective terms are
      heavy.
    diligencePath: Request the fully diluted cap table, financing documents, debt schedule, and side-letter summary.
    relatedQuestionRefs:
      - QI023
      - QI024
