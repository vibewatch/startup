          value: 0.15
    approximationNotes: >-
      TAM combines mid-range rehab robotics (~USD 2B) with FMI humanoid healthcare segment (28%
      of USD 10.69B = ~USD 3B) minus overlap (~USD 0.9B), yielding approximately USD 4.1B; the
      pyramid value of USD 12.91B uses the full FMI + TBRC mid-point for the humanoid total as
      the widest reasonable TAM boundary. SAM uses the Mordor/TBRC mid-range for rehabilitation
      robotics only (USD 2.0B). SOM is a qualitative estimate of <10% institutional share of SAM
      given Fourier's disclosed 2,000+ institution base.
