callouts:
  - calloutType: risk
    title: "Conflicting Analyst Estimates Create Planning Uncertainty"
    body: >-
      The 3.8× spread between Fortune's USD 579.5M and TBRC's USD 2.22B rehabilitation robotics
      estimate for 2026 is not a measurement error—it reflects genuinely different market definitions.
      Fourier's internal planning models should explicitly state which analyst scope definition they
      adopt, and should not present the highest available TAM number without caveating scope.
    claimRefs: [CM019]

  - calloutType: insight
    title: "Medicare Exoskeleton Reclassification Is a Structural Near-Term Catalyst"
    body: >-
      The 2024 CMS brace-category reclassification—covering approximately 40% of U.S. SCI patients
      via Medicare, VA, and workers' compensation combined—is the most concrete near-term payer
      catalyst in Fourier's core rehabilitation segment. Exploiting this pathway requires FDA-cleared
      home-use status, certified training site networks, and a device price at or below the USD
      94,617 proposed payment level.
    claimRefs: [CM031, CM032, CM033]

