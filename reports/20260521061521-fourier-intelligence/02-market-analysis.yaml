company:
  name: "Fourier Intelligence"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Fourier Intelligence competes across two primary addressable markets: rehabilitation robotics
    (USD 1.77B–2.22B in 2026 by mid-range analyst estimates, 17–23% CAGR) and humanoid/embodied AI
    robotics (USD 8.32B–10.69B in 2026, 37–53% CAGR). A sharply adverse constraining lens—mixed
    ADL evidence from clinical umbrella reviews, high capex barriers, incomplete payer coverage, and
    a software ecosystem trailing hardware by 3–5 years—tempers the headline growth narrative.
    Medicare's 2024 exoskeleton reclassification and IFR-confirmed 91% growth in medical robot unit
    sales provide concrete near-term tailwinds for Fourier's core rehabilitation segment.

sections:
  - id: market-boundary
    title: "Market Boundary and Scope Definition"
    body: >-
      Fourier Intelligence's addressable market sits at the intersection of two structurally distinct
      but increasingly overlapping robotics sectors. The first is rehabilitation robotics: powered
      exoskeletons, therapeutic robots, and assistive gait devices sold primarily to rehabilitation
      centers, hospitals, and—via a new Medicare pathway—directly to home users. The second is
      humanoid and embodied AI robotics: anthropomorphic, full-body robots sold to industrial,
      healthcare, and consumer end-markets. Fourier participates in both via its GRx humanoid
      platform and its established Fourier Rehab portfolio.

      Excluded from Fourier's primary TAM are: surgical robots (separate reimbursement path and buyer
      base); non-wearable stationary rehabilitation devices (continuous passive motion, ultrasound
      therapy); and the broader professional service robotics market spanning logistics, hospitality,
      and cleaning robots (USD 31.11B in 2026 per Fortune, dominated by transport and logistics).
      Including broad service robotics as an additive TAM would be misleading—Fourier does not
      currently address logistics or hospitality applications.

      The International Federation of Robotics formally classifies powered exoskeletons as wearable
      robots within the medical robot taxonomy, distinct from industrial robots. Rehabilitation and
      non-invasive therapy robots are tracked as a dedicated sub-category of medical robots. This
      definitional precision matters: IFR's medical robot category saw a 91% unit-volume surge in
      2024, while rehab and non-invasive therapy specifically rose 106%, demonstrating the acute
      acceleration within Fourier's core segment.

      Status-quo substitutes for robotic rehabilitation include: licensed physiotherapists and
      occupational therapists delivering manual therapy sessions; body-weight support treadmill
      systems (non-robotic); and standard orthotic devices including non-powered braces. The
      transition from these substitutes to robotic systems depends on evidence, reimbursement
      coverage, upfront cost acceptance, and therapist-facing workflow integration—all structural
      barriers that also define the adoption ceiling for Fourier's addressable market.
    claimRefs: [CM001, CM002, CM003, CM008, CM044]
    tableRefs: [TM001]
    figureRefs: [FM001]

  - id: demand-drivers
    title: "Demand Drivers: Epidemiology, Demographics, and Healthcare System Pressure"
    body: >-
      The primary structural demand driver for rehabilitation robotics is a global epidemic of
      neurological and musculoskeletal conditions intersecting with an aging population that generates
      ever-larger volumes of post-acute rehabilitation need. The World Stroke Organization's 2025
      Global Stroke Fact Sheet—drawing on GBD 2021 data—reports 93.8 million prevalent stroke cases
      globally in 2021, making stroke the second leading cause of death and third leading cause of
      combined death and disability globally. Stroke incident cases rose 70% between 1990 and 2021,
      with 87% of deaths and 89% of DALYs concentrated in lower- and lower-middle-income countries.
      The global economic cost of stroke exceeds USD 890 billion per year and is projected to nearly
      double by 2050.

      PAHO's estimates of rehabilitation need in the Americas show 366 million people in 2019 had
      health conditions amenable to rehabilitation—a 58% increase from 231 million in 1990—driven
      primarily by population growth and aging. The likelihood of rehabilitation need rises
      exponentially with age. This creates a secular demand tailwind for any device category that can
      scale stroke and neurorehabilitation throughput.

      The International Federation of Robotics identifies labor shortages in healthcare and the
      growing elderly population as the two dominant demand drivers for service robots in the
      professional medical space. Oliver Wyman frames the macro case at system level: without
      productivity intervention, global healthcare spending could rise from USD 11.8 trillion today
      to USD 23.1 trillion by 2040; AI and specialized robotics could remove up to USD 5.1 trillion
      of that projected cost increase annually under a breakthrough adoption scenario. A global
      caregiver deficit estimated at 15 million workers reinforces why hospital systems are
      evaluating robotic augmentation of therapy staff capacity. These epidemiological and workforce
      dynamics together define a structurally expanding demand base for rehabilitation robotics and
      adjacent care robotics.
    claimRefs: [CM004, CM005, CM006, CM007, CM009, CM010, CM011, CM012]
    figureRefs: [FM004]

  - id: rehab-robotics-market
    title: "Core Market: Rehabilitation Robotics Sizing and Segmentation"
    body: >-
      Four independent analyst firms published rehabilitation robotics market estimates for 2026,
      yielding a wide but informative range. TBRC places the market at USD 2.22 billion in 2026
      growing at 22.7% CAGR to USD 4.87 billion by 2030. Mordor Intelligence estimates USD 1.77
      billion in 2026 at 17.1% CAGR to USD 3.89 billion by 2031. IMARC Group bases its estimate on
      a USD 1.82 billion 2025 market expanding at 16.53% CAGR. Fortune Business Insights offers a
      materially lower estimate of USD 579.5 million in 2026 at 16.36% CAGR, the result of a
      narrower scope (exoskeleton and therapeutic devices only, excluding some service and lab
      automation categories). These estimates are not reconcilable without reviewing the underlying
      methodologies; the USD 579.5M–USD 2.22B spread (3.8×) reflects definitional scope differences
      in whether assistive robots, prosthetics, and related services are bundled.

      The mid-range consensus—Mordor at USD 1.77B to TBRC at USD 2.22B—represents the most
      defensible TAM for Fourier's rehabilitation segment for 2026 planning purposes.

      Within this market, exoskeleton robots account for approximately 47.35% of type-based revenue
      (Mordor 2025 data), confirming their dominance relative to therapeutic and assistive device
      sub-categories. Geriatric users account for approximately 61.4% of demand. Rehabilitation
      centers hold 53.2% of end-user revenue; hospitals represent the second-largest institutional
      buyer. Homecare is the fastest-growing adoption channel at 27.1% CAGR, driven partly by the
      2024 CMS exoskeleton reclassification. Asia-Pacific is the fastest growing geography at 21.2%
      CAGR, driven by rising stroke incidence and aging demographics—an important dynamic for a
      Shanghai-headquartered company like Fourier. North America retains the largest regional share
      at approximately 74.76% of 2025 revenue by Fortune's estimate.

      Fourier Intelligence is explicitly named as a key competitor in TBRC's rehabilitation
      robotics competitive landscape, confirming the company's positioning within the commercial
      market rather than as a research-stage participant. IFR data shows the 2024 unit-level surge
      (106% growth in rehab robot sales) is driven by professional end-users in clinical settings,
      which aligns with Fourier's 2,000-plus institutional customer base from chapter 1.

      The adjacent elderly care robotics market—including companion robots, mobile service robots,
      and robotic exoskeletons specifically for senior-care facilities—is sized at USD 0.39 billion
      in 2026 growing to USD 0.64 billion by 2031 at a 10.4% CAGR (Knowledge Sourcing). The broader
      AI-powered elderly care solutions market (including non-robotic AI) is projected to reach USD
      7.38 billion by 2031 at 31.6% CAGR. These adjacent markets are accessible to Fourier's GR-3
      care humanoid but represent distinct buyer communities (eldercare facilities, home health
      agencies) rather than the rehabilitation center and hospital buyers who anchor the core rehab
      robotics addressable market.
    claimRefs: [CM013, CM014, CM015, CM016, CM017, CM018, CM019, CM020, CM021, CM043]
    tableRefs: [TM002]
    figureRefs: [FM002]

  - id: humanoid-embodied-ai-market
    title: "Adjacent Market: Humanoid and Embodied AI Robotics"
    body: >-
      The humanoid robot market represents Fourier's longer-range growth vector and its most
      ambitious market-entry claim. Two large-sample analyst estimates place the global humanoid
      robot market at USD 10.69 billion (FMI) and USD 8.32 billion (TBRC) in 2026, with five-year
      CAGRs of 37% and 47–53% respectively. Healthcare is the leading application segment, with FMI
      assigning 28% of 2026 humanoid robot revenue to healthcare-related use cases—implying roughly
      USD 3.0 billion of addressable healthcare humanoid spend.

      Roland Berger's April 2026 report paints a longer horizon: projected operating cost of USD 2
      per hour makes humanoids economically compelling versus human labor in regions facing structural
      labor shortages, with the OEM-level market potentially reaching USD 300 billion (baseline) to
      USD 750 billion (optimistic) by 2035. TrendForce projects Chinese humanoid output will rise 94%
      in 2026, with Unitree and AgiBot accounting for approximately 80% of shipments as the industry
      shifts from demonstration to delivery. BusinessWire cites Goldman Sachs data showing humanoid
      manufacturing costs fell 40% year-over-year—far ahead of the 15–20% decline previously
      modeled—with current robot costs ranging from USD 30,000 to USD 150,000. Unitree's R1
      launched at USD 5,900 in July 2025, establishing a sub-USD 10,000 consumer price point.

      The FMI and TBRC estimates diverge by approximately USD 2.37 billion, reflecting different
      scope boundaries, geographic coverage, and vintage assumptions. Both are ahead of some
      independent industry views—Roland Berger notes very few productive use cases for humanoids
      exist today outside narrow industrial pilots, and the ecosystem (software, integration, safety
      certification) trails hardware maturity by three to five years.

      For Fourier specifically, the relevant SAM within the humanoid market is not the full USD
      8–11 billion but rather the healthcare, rehabilitation, and care-assistance sub-segment where
      Fourier's GR-3 humanoid is positioned. On FMI's 28% healthcare share applied to the USD
      10.69B total, that implies a USD ~3B healthcare humanoid TAM in 2026—but Fourier would be
      competing against global platform leaders (Figure, Agility, Unitree, Boston Dynamics) with
      substantially more capital and manufacturing scale. The GR-3's differentiation via care-centric
      design and a clinical installed base is a distinct angle, but market-share penetration in the
      near term will be limited. A conservative view of Fourier's serviceable share of the humanoid
      market is well below 5% through 2027.
    claimRefs: [CM022, CM023, CM024, CM025, CM026, CM027, CM028, CM029]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: payer-buyer-landscape
    title: "Payer, Buyer, and Budget Owner Landscape"
    body: >-
      Rehabilitation robotics procurement divides into three distinct buyer and payer archetypes,
      each with a different budget owner, decision timeline, and adoption trigger. Institutional
      buyers—rehabilitation centers and hospital outpatient departments—are the dominant channel
      (53.2% of market by revenue, per Mordor), funded by facility capital budgets with procurement
      decisions typically made by clinical operations leaders and finance committees. Reimbursement
      from government payers and private insurers indirectly enables these purchases by anchoring
      therapy session billing codes that fund device ROI.

      Home-use buyers are the fastest-growing but smallest segment. Medicare's 2024 Home Health Rule
      (effective January 1, 2024) reclassified powered exoskeletons within the brace benefit
      category, creating a reimbursement pathway for personal exoskeleton devices. CMS proposed
      payment at approximately USD 94,617 per device, with the Medicare beneficiary responsible for
      the standard 20% copay. Completion of training at a certified clinical site is a prerequisite
      for home use. Lifeward reports that when Medicare, VA benefits, and workers' compensation are
      combined, approximately 40% of U.S. spinal cord injury patients are now covered by payers that
      have reimbursed personal exoskeleton claims, up from effectively zero pre-2024.

      The CY2026 OPPS/ASC final rule updated outpatient hospital payment rates by +2.6%, affecting
      approximately 4,000 hospital outpatient departments and 6,000 ambulatory surgical centers.
      This incremental rate update supports overall institutional capacity to fund rehabilitation
      technology procurement, but the marginal impact on robot-specific budgets is indirect.

      Research and academic institutions represent a niche buyer channel for developmental platforms
      and data-generation partnerships—relevant to Fourier's open-source and developer-ecosystem
      strategy but not material to near-term revenue.

      Humanoid robotics procurement in 2026 is overwhelmingly pilot-driven and enterprise-funded.
      Deployments at BMW (Figure), Amazon and GXO (Agility Digit), and UBTECH's automotive OEM
      partnerships are enterprise capex decisions with one-to-three-year evaluation cycles. Healthcare
      humanoid pilots are even earlier stage; care humanoids like GR-3 have no established
      reimbursement pathway and must generate ROI through direct cost displacement of labor hours.
      This limits near-term institutional health system adoption to innovation or productivity budget
      lines rather than mainstream capex.
    claimRefs: [CM030, CM031, CM032, CM033]
    tableRefs: [TM004]

  - id: constraining-lens
    title: "Constraining Lens: Headwinds and Adoption Barriers"
    body: >-
      The bull case for rehabilitation and humanoid robotics rests on demographic tailwinds, unit
      cost declines, and policy catalysts. A responsible market analysis must weight these against
      material constraining forces.

      On clinical evidence: the 2026 JMIR umbrella review of robot-assisted therapy for upper-limb
      rehabilitation after stroke found improvements in motor function, but activities of daily
      living (ADL) gains were generally comparable to conventional therapy. This finding directly
      limits the strongest payer-approval argument—that robot-assisted therapy produces meaningfully
      superior functional outcomes. A 2026 PubMed RCT did find exoskeleton-assisted rehabilitation
      improved Fugl-Meyer lower-extremity scores and Barthel Index versus conventional training for
      post-stroke gait, supporting the lower-limb/gait-rehab case more clearly than upper-limb ADL.
      The evidentiary picture is thus mixed and segmented: stronger for lower-limb/gait exoskeleton
      use cases and weaker for broader ADL outcome claims.

      On commercial readiness for humanoids: the IFR's 2026 trends report explicitly states humanoid
      robots must match high industrial requirements in cycle times, energy consumption, and
      maintenance costs before they can compete with traditional automation—and that key gaps remain
      as of 2026. Robotics & Automation News identifies manipulation, power and endurance, and
      general-purpose autonomy as the three dominant technical bottlenecks; most 2026 deployments
      remain supervised pilot or co-pilot applications rather than autonomous operations. Roland
      Berger confirms the ecosystem (software integration, safety certification frameworks,
      regulatory clarity) trails hardware by three to five years.

      On cost barriers: rehabilitation robotics devices priced at USD 30,000–USD 150,000 face a
      procurement ceiling determined by reimbursement rates (roughly USD 94,617 per Medicare
      pathway), facility capital budgets, and institutional risk tolerance. Mixed long-term outcome
      data and high upfront cost together temper procurement in emerging markets and pediatric
      settings. Fortune Business Insights and Mordor Intelligence both flag high initial capex and
      integration costs as the primary market restraints. Privacy and data security concerns, plus
      anxiety about replacing human connection in care settings, represent soft barriers for
      AI-robotic eldercare adoption.

      Collectively, these constraints suggest that while the market size estimates are large and the
      growth rates compelling, the proportion of the stated TAM that is realistically addressable
      in the 2026–2028 window—particularly for a mid-size player like Fourier—is substantially
      narrower than headline figures imply.
    claimRefs: [CM034, CM035, CM036, CM037, CM038, CM039, CM040, CM041, CM042]

