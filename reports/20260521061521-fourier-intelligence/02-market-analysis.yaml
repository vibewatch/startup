  evidenceGaps:
    - type: missing-source
      severity: material
      topic: payer-landscape
      missingEvidence: >-
        Coverage data for rehabilitation robot reimbursement in non-U.S. markets including
        major European payers (Germany GKV, France UNCAM), Japanese NHI, and Chinese NHSA.
      whyItMatters: >-
        North America is ~75% of the market by Fortune's estimate, but Asia-Pacific at 21.2% CAGR
        is the fastest-growing region. Without non-U.S. payer clarity, the international SAM
        accessible to Fourier's institutional sales is undeterminable.
      diligencePath: >-
        Conduct targeted searches for European and Japanese rehabilitation robot reimbursement
        decisions and Chinese provincial healthcare procurement programs; interview Fourier's
        regional sales teams.
      relatedQuestionRefs: [QM027]

    - type: missing-source
      severity: material
      topic: market-boundary
      missingEvidence: >-
        Empirical data on the revenue and market share of conventional physiotherapy services
        as the primary substitute—specifically the total clinical rehabilitation services spend
        addressable by robotic automation and the substitution rate to date.
      whyItMatters: >-
        Without sizing the substitute market, it is impossible to determine realistic penetration
        curves or the ceiling on robotic rehabilitation market growth from existing physio volumes.
      diligencePath: >-
        Review WHO Global Health Observatory rehabilitation workforce data, national health
        accounts for physiotherapy expenditure, and published substitution-rate studies.
      relatedQuestionRefs: [QM017]

    - type: conflicting-data
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Granular methodology documentation from TBRC, Mordor, IMARC, and Fortune to reconcile
        the 3.8× spread in rehabilitation robotics market estimates; specifically, which scope
        inclusions/exclusions drive the USD 579.5M vs. USD 2.22B divergence.
      whyItMatters: >-
        Without understanding scope, a planner cannot determine which estimate is relevant to
        Fourier's actual product categories and cannot reliably compute SAM or market share.
      diligencePath: >-
        Purchase at least two full methodology appendices from conflicting analyst reports and
        compare inclusion/exclusion criteria for exoskeleton, assistive, and service categories.
      relatedQuestionRefs: [QM022]
