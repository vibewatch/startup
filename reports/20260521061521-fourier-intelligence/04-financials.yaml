- id: revenue-model-pricing-and-disclosure
  title: The visible business model is quote-led institutional robotics, with only fragmented public pricing
  body: Official materials show a mixed robotics stack rather than a single product SKU. Fourier markets RehabHub as a platform integrating more than 30 robot types, sells rehabilitation devices through contact-led pages, and frames GR-3 as a care-centric humanoid for enterprise settings rather than for retail buyers. That surface implies at least three economic layers—capital equipment, implementation or service, and some software or platform attachment—but the company never discloses the actual revenue mix across those layers. Public price discovery is similarly fragmentary. TMTPost says GR-3 is priced above RMB200,000, while a current Europa Satellite listing exposes structured product metadata at EUR106,344.61. On the rehab side, a Chinese procurement tracker shows specific upper-limb robot bids at RMB280,000 and RMB347,000 and larger rehabilitation-system awards above RMB1 million. Those signals are enough to show that Fourier is selling into institutional budgets, not consumer impulse
    purchases. They are not enough to infer realized ASP, discounting, attachment, or margins, because each visible price point reflects a different bundle, geography, or channel.
