- id: financial-verdict-and-diligence-blockers
  title: The financial verdict is promising demand and pricing power in niches, but too much opacity for clean underwriting
  body: 'The evidence supports a plausible bullish case: Fourier has repeatedly raised large rounds, still commands institutional price points, has one credible public growth hint in overseas rehab revenue, and operates in adjacent reimbursement and rehabilitation markets where budgets can support high-value hardware. But the adverse case is stronger than management rhetoric admits. There is still no public revenue base, ARR, gross margin, working-capital profile, monthly burn, or cash runway. The latest valuation signal comes from a strategic-investment filing rather than from audited operating performance. The public price set is also internally heterogeneous: some rehab devices clear at a few hundred thousand renminbi while bigger systems and humanoid distributor listings land far higher, which makes bundle-normalized margin inference impossible. Peer analogs show that 38% to 53% gross margins do not prevent multi-million-dollar annual losses or cash burn. For underwriting, that means
    the right stance is not “Fourier has no economics,” but “Fourier has not disclosed enough economics to prove the current capital base converts into durable, internally financed growth.” Management must still open the books on realized pricing, segment mix, backlog, cash, runway, and customer concentration before a hard financial conviction is warranted.'
