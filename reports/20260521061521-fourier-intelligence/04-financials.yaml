tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Public monetization evidence
  - Public price or budget anchor
  - Revenue-quality read
  - Exact diligence ask
  rows:
  - - Rehabilitation capital equipment
    - Official rehab pages and hospital procurement records show device and system sales into institutional care settings
    - RMB280k-RMB347k for one upper-limb robot; RMB1.07m-RMB1.368m for larger rehab systems
    - Likely lumpy enterprise hardware revenue with tender timing and bundle variation
    - Need realized ASP, installation revenue, and product-level gross margin by rehab SKU
  - - Humanoid enterprise systems
    - GR-3 is marketed through contact-led enterprise pages and third-party price signals rather than public checkout by Fourier
    - TMTPost says >RMB200k; Europa structured data lists EUR106,344.61
    - Early-stage enterprise humanoid revenue likely quote-led and pilot-sensitive
    - Need closed-won shipment count, realized selling price, and whether price includes service or only hardware
  - - Implementation, training, and maintenance
    - Peer exoskeleton deployments require 40-50 training hours and ongoing support, implying service revenue and service cost
    - No direct Fourier price; peers indicate support intensity is economically material
    - Service may expand contract value but can also absorb gross profit if underpriced
    - Need attach rate for training, service contracts, and annual maintenance per installed system
  - - Platform or software layer
    - RehabHub and developer materials imply digital orchestration and data or software attachment
    - No public standalone software price found
    - Potentially higher-quality recurring revenue exists, but share of revenue is undisclosed
    - Need software license, subscription, or data-platform revenue share
  - - Reimbursement-enabled access analog
    - Peer exoskeleton reimbursement suggests payer support can unlock willingness-to-pay for very expensive devices
    - US$91,032 established Medicare rate and ~US$100k device-cost analogs
    - Access tailwind is real but case-by-case and not a substitute for Fourier-specific margin disclosure
    - Need reimbursement pathway by market and which Fourier products qualify, if any
  notes: This table mixes Fourier-specific evidence with payer and peer analogs because Fourier discloses products and channels but not realized revenue mix, attach rates, or recurring-software share.
