  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: current-financial-statements
    missingEvidence: Audited 2024-2025 revenue, gross margin, operating expense, EBITDA, and cash-flow statements for Fourier.
    whyItMatters: Without the basic statements, valuation, burn, and unit economics cannot be normalized to actual operating scale.
    diligencePath: Request the latest audited annual accounts plus monthly management reporting by segment and geography.
    relatedQuestionRefs:
    - QI011
    - QI022
    - QI025
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-and-attach
    missingEvidence: Closed-won pricing, discounting, service attachment, software attachment, and warranty terms by product line.
    whyItMatters: Fragmented public price anchors are not enough to infer contribution margin or repeatability.
    diligencePath: Request a product-level bookings file with realized ASP, discount, services, and renewal data for the last 12 months.
    relatedQuestionRefs:
    - QI004
    - QI005
    - QI026
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-runway
    missingEvidence: Current cash balance, monthly burn, runway assumptions, and any restricted cash or supplier-finance exposure.
    whyItMatters: The financing story cannot be translated into capital adequacy without a live liquidity view.
    diligencePath: Request the latest balance sheet, 13-week cash forecast, covenant package, and scenario-based runway model.
    relatedQuestionRefs:
    - QI022
    - QI025
    relatedTableRefs:
    - TI004
  - type: missing-source
    severity: material
    topic: cap-table-terms
    missingEvidence: Liquidation preferences, debt facilities, guarantees, board observer rights, and any secondary or structured financing terms.
    whyItMatters: Equity headline value can differ materially from effective economic value if senior claims or protective terms are heavy.
    diligencePath: Request the fully diluted cap table, financing documents, debt schedule, and side-letter summary.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer, top-distributor, and geographic revenue concentration for the last two fiscal years.
    whyItMatters: Installed-base breadth does not prove recurring or diversified revenue. Concentration can distort both growth and margin.
    diligencePath: Request customer concentration, cohort retention, distributor mix, and geographic P&L breakouts.
    relatedQuestionRefs:
    - QI027
    relatedTableRefs:
    - TI005
  - type: stale
    severity: minor
    topic: overseas-growth-hint
    missingEvidence: A refreshed 2024-2025 update on overseas revenue growth and mix beyond the single 2023 TMTPost hint.
    whyItMatters: The only public growth clue is useful but too old and too narrow to support a current underwriting model.
    diligencePath: Request quarterly geographic revenue mix and order intake for 2024-2025, plus management commentary on whether overseas growth persisted.
    relatedQuestionRefs:
    - QI012
    - QI013
