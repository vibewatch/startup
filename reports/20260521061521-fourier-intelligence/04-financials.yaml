callouts:
- calloutType: insight
  title: Funding visibility is much better than earnings visibility
  body: Fourier’s public filings and media coverage tell a coherent story about who funded the company and at what headline valuation, but still do not reveal the revenue base or burn that should justify those numbers.
  claimRefs:
  - CI009
  - CI010
  - CI040
  - CI041
- calloutType: risk
  title: High-ticket robotics can still stay cash hungry long after launch
  body: Ekso, Lifeward, and CYBERDYNE show that category-level gross margins do not automatically eliminate operating losses, because service, reimbursement work, freight, and overhead can consume the gross profit pool.
  claimRefs:
  - CI029
  - CI031
  - CI033
  - CI035
  - CI044
- calloutType: assumption
  title: Treat public prices as boundary anchors, not realized ASP
  body: Fourier’s visible price points come from media reports, distributor metadata, and procurement records with different bundles and geographies. They frame budget size, but they do not reveal realized pricing or margin discipline.
