- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - What public evidence does exist
  - Exact diligence path
  - What not to infer from open sources
  rows:
  - - 2024-2025 revenue and segment mix
    - Needed to anchor valuation, burn, and product-market fit
    - Only a 2023 overseas-growth hint and installed-base claims are public
    - Request audited management accounts and segment bridge for rehab hardware, humanoids, service, and software
    - Do not infer scale from fundraising size or institutional count alone
  - - Gross margin by line
    - Separates good hardware pricing from sustainable economics
    - Peer analogs show 38%-53% gross margins are plausible but insufficient
    - Request product-level gross margin and service-cost absorption analysis
    - Do not map peer margins directly onto Fourier
  - - Cash balance, burn, and runway
    - Determines financing dependency and next-round urgency
    - Funding rounds and valuation are public, but current cash is not
    - Request latest balance sheet, monthly cash burn, and runway under base/upside/downside cases
    - Do not treat Series E plus Runyang headlines as proof of current runway
  - - Realized ASP, discounting, and service attach
    - Needed to translate public list or bid prices into contribution margin
    - Open sources show only fragmented quote, distributor, and procurement anchors
    - Request closed-won deal list by product, geography, and channel with attached services
    - Do not equate posted or tender prices with realized margin
  - - Debt, preferences, and guarantees
    - Can radically change effective equity value and downside risk
    - The reviewed public set shows governance and equity dilution, not debt terms
    - Request debt schedule, liquidation preferences, side letters, and guarantees
    - Do not assume a clean cap table because no debt was mentioned publicly
  - - Customer concentration and geographic revenue exposure
    - Needed to judge recurrence, channel power, and geopolitical sensitivity
    - Public sources show installed-base breadth but not revenue concentration
    - Request top-10 customers, distributor mix, and geographic revenue share
    - Do not treat 2,000 institutions in 40+ countries as proof of diversified revenue
  notes: Every row here is a real blocker to financial underwriting rather than a nice-to-have KPI.
