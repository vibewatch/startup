companyProfile:
  summary: >-
    Fourier Intelligence, publicly branding its general-robotics line as Fourier,
    is a Shanghai-based robotics company founded in 2015 by Alex Gu. The company
    started in rehabilitation robotics and has expanded into full-size humanoids,
    with public materials spanning the Fourier Rehab installed-base business,
    RehabHub workflows, and the GR-1, GR-2, GR-3, and N1 humanoid lines. Public
    company materials say Fourier serves more than 2,000 institutions across more
    than 40 countries and regions, and a 2024 GR-2 launch announcement said the
    company had more than 500 employees globally. The capital base is credible,
    with a RMB 400 million Series D in 2022, a nearly RMB 800 million Series E in
    2025, and a Runyang strategic-investment disclosure implying an RMB 8 billion
    pre-money valuation, but the company remains financially opaque in public.
  foundedDate: "2015-01-01"
  founders:
    - name: Alex Gu
      role: Founder & Group CEO
      background: >-
        Public company materials identify Gu as Fourier's founder and CEO / group
        CEO and the central public face of the company's rehab-to-humanoid expansion.
      claimRefs: [CO009, CO010]
    - name: Zen Koh
      role: Co-founder & Group Deputy CEO
      background: >-
        2022 funding coverage publicly described Koh as Fourier's co-founder and
        group deputy CEO.
      claimRefs: [CO011]
  foundingLocation: "Shanghai, China"
  headquarters: "Pudong, Shanghai, China"
  productSummary: >-
    Fourier sells intelligent rehabilitation systems and workflow platforms such as
    RehabHub alongside the GRx humanoid family and related developer tooling,
    including actuators, teleoperation, simulation, datasets, and robot models.
    Public evidence is strongest for rehabilitation deployments and materially weaker
    for paid humanoid production deployments.
  customerFocus: >-
    Rehabilitation providers, hospitals, neurorehab centers, research partners,
    channel-led clinics, and selected enterprise or care-humanoid pilots. The
    public customer record is deepest in rehab and still thin on named paying
    humanoid customers.
  businessModel: >-
    Quote-led institutional robotics selling across hardware, workflow software,
    service, and platform attachments. Fourier's public materials support a mixed
    rehab-device-plus-services model, but recurring revenue share, renewal quality,
    pricing realization, and unit economics remain undisclosed.
  stage: Private (Series E)
  fundingStatus: >-
    Publicly disclosed rounds include a RMB 400 million Series D in January 2022
    and a nearly RMB 800 million Series E in January 2025. Chinese media also
    described cumulative financing since founding as roughly RMB 1 billion, while a
    June 2025 Runyang filing implied an RMB 8 billion pre-money valuation; full
    cap-table and financing-term disclosure is not public.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO005, CO006, CO009, CO010, CO011, CO012, CO014, CO016, CO017, CO038, CV001, CV004]
summary:
  headline: >-
    Fourier is a credible rehabilitation-robotics company with real installed-base
    proof and a technically serious humanoid program, but absent economics,
    customer-quality disclosure, and named paid humanoid deployments leave the
    current RMB 8 billion anchor hard to underwrite. Keep the company in
    research-more mode rather than commit capital at the public mark.
  overallScore: 6.1
  recommendation: research-more
