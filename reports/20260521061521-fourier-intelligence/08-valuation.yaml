- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Rehab business
    - Real rehabilitation footprint likely gives Fourier a commercialization floor
    - Public investors still cannot observe revenue quality, gross margin, or renewal durability
    - Disclose segment revenue, gross margin, and top-customer concentration
  - - Humanoid program
    - Adds upside optionality and strategic relevance beyond rehab
    - Public proof is still far weaker than U.S. narrative leaders and may not justify premium pricing yet
    - Name paid deployments and task-level operating metrics
  - - Capital base
    - Series E and Runyang show credible capital access
    - Anchor comes from strategic financing context, not from transparent operating performance
    - Show final closing terms, post-money, and cap-table waterfall
  - - Comparable framing
    - Fourier sits between rehab-device and humanoid-platform categories
    - That middle position can also mean it captures the discount of both categories without the full premium of either
    - Show why Fourier deserves a durable multiple band rather than narrative optionality only
  - - Entry discipline
    - Current anchor could be defendable if hidden economics are strong
    - Without disclosed economics, new investors are underwriting management opacity as much as business quality
    - Either improve disclosure or demand a cheaper entry
  notes: Each row states what would actually move the call; absent those changes, the anti-thesis remains live.
