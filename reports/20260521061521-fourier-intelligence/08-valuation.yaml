tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Why it reads that way
  - Investment implication
  rows:
  - - Recommendation
    - Research-more / track
    - Public evidence supports a real business and a real financing anchor, but not enough economics to underwrite price with conviction
    - Do not chase the public anchor upward without private diligence access
  - - Confidence
    - Medium
    - The core uncertainty is missing operating disclosure rather than contradictory public facts
    - Stay open to revision if revenue and margin data surface
  - - Risk rating
    - High
    - Humanoid optionality is valuable, but public economics are opaque and scenario spread is wide
    - Demand downside protection and explicit kill triggers
  - - Valuation stance
    - Fair-to-stretched for insiders; stretched for new outsiders
    - Strategic insiders may know more than public investors about revenue quality and closing terms
    - Outside investors should not assume insider visibility
  - - Public anchor
    - Useful ceiling test, not a clean fair-value proof
    - Runyang filing is real, but the context includes strategic capital and simultaneous ESOP dilution
    - Treat RMB8bn pre-money as a reference point, not a sufficient underwriting answer
  - - Return hurdle
    - 3x requires ~RMB24bn exit value
    - That outcome needs major revenue disclosure and much stronger humanoid commercialization proof
    - Do not model 3x as a base case from the current anchor
  notes: 'This table is judgmental by design: it summarizes the investment call from public evidence rather than restating company-quality talking points.'
