- id: scenario-framing
  title: Bull, base, and bear framing puts the current anchor near the top of what public evidence can support today
  body: An evidence-constrained scenario model is more honest here than a spreadsheet-heavy DCF. The bear case assumes the rehabilitation business is real but not large enough to carry the valuation, while the humanoid program remains strategically interesting without converting into named paid deployments or disclosed economic proof. In that world, public-multiple compression and fresh-round discounting could push fair value toward roughly RMB4.5 billion to RMB6.0 billion. The base case assumes public evidence is directionally right about Fourier’s rehab depth and that humanoids retain meaningful option value, but still gives no credit for economics the company refuses to disclose. That yields a range of roughly RMB6.5 billion to RMB8.5 billion, which is notable because the current public anchor already lives near the upper end of that band. The bull case needs more than optimism. It requires disclosed revenue and margin quality, evidence that rehab demand is durable rather than logo-heavy,
    and named humanoid deployments that narrow the comparability gap to higher-multiple robotics names. Only then does a RMB9.5 billion to RMB13.0 billion range become reasonable. This framing also explains why a 3x venture-style return hurdle is so hard to defend from the current starting point. A roughly RMB24 billion exit is not impossible, but public evidence today does not justify modeling it as the base case.
