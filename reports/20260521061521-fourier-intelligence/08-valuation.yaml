- id: diligence-conditions
  title: 'The chapter’s decision rule is simple: do not pay above the anchor until missing operating facts turn into disclosed evidence'
  body: 'The most important valuation discipline here is procedural. Fourier does not need another narrative deck to improve the call; it needs a small set of operating disclosures that would let investors place it inside a real valuation regime. The first gate is financial visibility: revenue, gross margin, burn, and runway. The second is financing quality: whether the Runyang deal actually closed on the publicly described terms and what preference stack or anti-dilution protections sit above common equity. The third is commercialization quality: named paid humanoid deployments, customer concentration, renewal behavior, and evidence that rehabilitation sales are durable rather than merely broad. Until those facts are visible, the recommendation should stay price-sensitive and evidence-sensitive. That means no conviction underwriting at a premium to the public anchor, and no attempt to force a false-precision DCF onto an opaque private company. The upside case is real enough that the company
    stays investable in principle, especially because the rehab business gives it a floor many humanoid startups do not have. But the public record still supports waiting for either better disclosure or a more compelling entry price rather than treating the current anchor as self-validating.'
