callouts:
- calloutType: risk
  title: Do not mistake a filed strategic anchor for a fully underwritten operating valuation
  body: Runyang’s filing is valuable because it proves a real public price reference exists. It is not enough to justify a conviction entry for outside investors, because revenue, gross margin, and runway remain undisclosed and the financing context included simultaneous ESOP dilution.
  claimRefs:
  - CV001
  - CV003
  - CV006
  - CV030
- calloutType: strength
  title: Fourier has a better commercialization floor than most pure humanoid stories
  body: The rehabilitation business means Fourier is not a zero-revenue science project in the way many frontier humanoid companies still are. That floor matters when building a base case, even if public evidence is still too thin to convert it into a fully supported premium multiple.
  claimRefs:
  - CV004
  - CV014
  - CV023
  - CV032
- calloutType: insight
  title: The comparable set is wide because Fourier sits between rehab robotics and embodied-AI narrative buckets
  body: Ekso and Lifeward are too bearish to describe the whole company, while Figure and Apptronik are too narrative-rich to describe Fourier today. The valuation chapter therefore has to bracket rather than pretend one single peer set is “correct.”
  claimRefs:
  - CV014
  - CV015
  - CV016
  - CV018
  - CV022
  - CV023
- calloutType: recommendation
  title: Require disclosure or a cheaper price before underwriting above the anchor
  body: 'The clean decision rule is simple: no premium to the current public anchor without revenue, margin, runway, cap-table, and closing-term disclosure. If disclosure improves, the call can move up quickly; if pricing tightens before disclosure arrives, the right answer is to wait.'
  claimRefs:
  - CV036
  - CV037
  - CV041
  - CV042
- calloutType: assumption
  title: Scenario ranges are evidence-led brackets, not a hidden DCF
  body: All ranges in this chapter assume the public anchor is a usable reference but not a self-validating truth. They also treat equity value as a rough EV proxy because public debt and cash data are not disclosed, which is why the chapter explicitly favors scenario framing over false precision.
