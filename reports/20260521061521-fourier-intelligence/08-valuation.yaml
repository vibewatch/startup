  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: operating-disclosure
    missingEvidence: Audited or management-certified revenue, segment split, gross margin, burn, and runway for 2025 and the latest twelve months.
    whyItMatters: Without these facts the current public anchor cannot be mapped to an actual operating multiple or cash-generation profile.
    diligencePath: Request a diligence data room with monthly financials, segment bridge, and board-level operating KPI pack.
    relatedQuestionRefs:
    - QV003
    - QV030
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: material
    topic: runyang-close
    missingEvidence: Executed closing confirmation for the Runyang investment, including any revised terms, actual cash transfer timing, and final post-money capitalization.
    whyItMatters: The chapter’s only direct public price anchor depends on the transaction being completed substantially as disclosed.
    diligencePath: Request signed closing documents or a refreshed cap-table memo tied to the Runyang financing.
    relatedQuestionRefs:
    - QV028
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Liquidation preferences, anti-dilution provisions, participation rights, and any senior securities introduced in late rounds.
    whyItMatters: Common-equity outcomes can differ dramatically from enterprise-value math when the preference stack is unknown.
    diligencePath: Review financing documents and a counsel-prepared cap-table waterfall before underwriting any return case.
    relatedQuestionRefs:
    - QV029
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: humanoid-commercial-proof
    missingEvidence: Named paid humanoid deployments with contract size, task KPI, uptime, and renewal or expansion evidence.
    whyItMatters: Without operating proof, the humanoid business should be valued as option value rather than as a proven premium-growth engine.
    diligencePath: Run customer references and obtain contract-level deployment evidence before paying a humanoid premium.
    relatedQuestionRefs:
    - QV021
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: material
    topic: TV004 comparable coverage and missing private Chinese round terms
    missingEvidence: Corroborated public valuation terms for additional Chinese private robotics comparables and fuller post-money details for Fourier and peer rounds.
    whyItMatters: The comparable table is intentionally partial because many directly relevant private Chinese robotics financings do not disclose enough terms to compare cleanly against Fourier.
    diligencePath: Pull executed financing summaries, registry filings, or investor memos for Chinese private robotics rounds before tightening the comparable set.
    relatedQuestionRefs:
    - QV018
    - QV027
    relatedTableRefs:
    - TV004
    - TV006
