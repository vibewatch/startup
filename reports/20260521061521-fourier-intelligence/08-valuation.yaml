chapter:
  number: 8
  title: Valuation
  summary: Fourier earns a research-more / track-style posture with medium confidence and a high risk rating because the public RMB8 billion pre-money anchor is real but not yet underwritten by disclosed economics. Public comps bracket the company between low-multiple rehab robotics peers and much richer humanoid narrative rounds, which means the current anchor could be fair for strategic insiders but looks stretched for new outside investors without private diligence access. The chapter therefore uses evidence-constrained ranges rather than a false-precision DCF and concludes that no investor should pay above the current anchor until revenue, margin, runway, and financing terms are disclosed.
sections:
- id: recommendation-and-anchor
  title: The public anchor is useful, but it is not strong enough to underwrite a conviction entry on its own
  body: 'The right read on Fourier is not that the RMB8 billion pre-money anchor is obviously wrong; it is that public evidence is too thin to know whether it is cheap, fair, or expensive with high conviction. Runyang’s filing gives this chapter something many private robotics stories lack: a real filed price anchor, a check size, and post-dilution ownership math. That matters. The January 2025 Series E also shows there was fresh capital appetite behind a broad investor set, including state-linked Shanghai capital and well-known private backers. But the same public record also shows what is still missing. The valuation anchor arrives without disclosed revenue, gross margin, burn, cash balance, or runway. Even the fully diluted math needs interpretation because the investment sat alongside a simultaneous ESOP top-up and a strategic context rather than a plain-vanilla arm’s-length financing that cleanly prices common equity for outside investors. That combination leads to a disciplined conclusion:
    treat the filing as a ceiling test for new money, not as proof that the business already earns an RMB8 billion right to exist on operating fundamentals. For strategic insiders with private diligence access, the current level may still be fair. For outside investors limited to public evidence, the recommendation is effectively research-more or track, with medium confidence and a high risk rating.'
