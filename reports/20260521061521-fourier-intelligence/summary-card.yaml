  topStrengths:
    - >-
      Real rehabilitation commercialization: 2,000+ institutions across 40+ countries is meaningful installed-base proof
      for a private robotics company
    - >-
      Fourier has a broader product and tooling stack than a single humanoid demo, spanning rehab workflows, humanoids,
      actuators, teleoperation, and simulation
    - >-
      Capital access is credible: Series D, Series E, and the Runyang disclosure show continuing investor appetite
      rather than a purely promotional story
    - >-
      Public customer proof is strongest in rehab, where multiple named providers and hospitals describe actual device
      deployments and workflows
  topRisks:
    - >-
      Revenue, gross margin, burn, cash balance, and runway remain undisclosed, so the investment case cannot be
      underwritten on operating fundamentals
    - No publicly verified paid deployments for GR-1 or GR-3 were found, leaving humanoid monetization and ROI unproven
    - >-
      Customer concentration, renewal rates, contract duration, and channel mix are opaque because many visible
      relationships are partnerships or distributor-mediated deployments
    - >-
      Care-humanoid scaling adds regulatory, privacy, safety, and support burdens without a public Fourier-specific
      dossier for hospital-grade deployment
    - >-
      Chinese humanoid competition, export-control friction, and price pressure could compress margins before the
      humanoid line proves durable demand
  unresolvedGaps:
    - Audited revenue, gross margin, cash balance, and runway disclosures
    - Named paid humanoid deployments with KPI, ROI, and renewal evidence
    - Customer concentration, contract duration, GRR/NRR, and distributor-vs-direct mix
    - Model-by-model regulatory, privacy, and security documentation for care deployments
    - Series E terms, investor preferences, and the full cap-table behind the RMB 8 billion anchor
