summary:
  headline: >-
    Fourier is a credible rehabilitation-robotics company with real installed-base proof and a technically serious
    humanoid program, but absent economics, customer-quality disclosure, and named paid humanoid deployments leave the
    current RMB 8 billion anchor hard to underwrite. Keep the company in research-more mode rather than commit capital
    at the public mark.
