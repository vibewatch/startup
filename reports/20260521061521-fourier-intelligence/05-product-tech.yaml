- id: rehab-systems-and-deployment-readiness
  title: Rehabilitation systems have the clearest public deployment proof and workflow fit
  body: 'If the humanoid story is still partly forward-looking, the rehabilitation story is already commercial. Fourier’s rehab pages claim more than 2,000 institutions across 40-plus countries, and the retained RehabHub brochure plus customer-site pages give the chapter named deployment proof rather than abstract marketing language. Ascot describes a consultant-led multidisciplinary pathway with more than ten devices on site; STEPS details specific upper-limb, ankle, cycle, and exoskeleton modules; Hobbs lists a live installation of ArmMotus EMU, ArmMotus M2 Pro, and ExoMotus M4 in its outpatient setting. The brochure also describes the system logic behind these deployments: linked devices, digitally tracked training, force and position sensing, auto-generated reports, and a staffing model where one therapist can monitor multiple patients. This is the strongest evidence in the chapter that Fourier has moved beyond demo-ware. The public record supports real rehabilitation productization,
    concrete therapist workflows, and meaningful implementation know-how, even though product-level outcome benchmarks and unit economics remain under-disclosed.'
