- id: commercialization-verdict-and-open-risks
  title: Fourier looks commercial in rehab and technically serious in humanoids, but not yet publicly de-risked for care-robot scale
  body: 'The retained evidence supports a split verdict. On one side, Fourier has a credible technical moat made of rehab channel access, component-level verticalization, and a real developer stack. On the other, its public humanoid commercialization proof is still thin compared with the rehab business. The strongest retained humanoid commercialization source is a 36Kr report about hundreds of shipped GR-series units and a hospital demonstration-base partnership; the strongest GR-3 sources remain CES launch materials and showcase reporting. That is enough to say Fourier is not vaporware, but not enough to say GR-3 is already deployment-proven in hospitals, eldercare, or large paid enterprise fleets. The biggest public gaps are exactly the ones that matter for underwriting: named production customers, detailed compliance or medical-license evidence for care scenarios, and documented security or privacy controls around networked robot operation. The right chapter judgment is therefore asymmetric:
    Fourier appears commercially real in rehabilitation and technologically credible in humanoids, but still closer to pilot-stage commercialization than scaled operating proof on the care-humanoid side.'
