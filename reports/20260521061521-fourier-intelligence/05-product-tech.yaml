    - Sensor calibration, embedded compute, and application-specific interaction design
    - GR-3 interaction claims are richer than its public engineering detail
  - - Data capture and learning
    - Collects demonstrations and prepares models for imitation learning and VLA-style tasks
    - Teleoperation overview and repo reference ActionNet and the data pipeline
