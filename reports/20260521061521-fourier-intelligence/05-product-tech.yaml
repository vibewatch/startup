- id: TE001
  title: Product module / asset matrix
  columns:
  - Asset or layer
  - Primary user / buyer
  - Public maturity status
  - Evidence-backed differentiation
  - Main diligence gap
  rows:
  - - RehabHub platform
    - Rehabilitation centers, hospitals, therapists
    - Commercial and widely deployed
    - Links 30+ robot types inside a digital training environment with data capture and workflow orchestration
    - No public module-level ROI, retention, or attach-rate disclosure
  - - Upper-limb rehab modules (ArmMotus, HandyRehab, OTParvos, WristMotus)
    - Therapists treating stroke, neuro, and upper-limb recovery
    - Commercial with named customer sites
    - Combines cable-driven compliance, EMG or fine-motor training, and cognitive/interactive therapy
    - No public comparative outcomes dataset by module
  - - Lower-limb and mobility modules (AnkleMotus, CycleMotus, BalanceMotus, ExoMotus)
    - Gait, balance, mobility, and early-stage rehab teams
    - Commercial with brochure and customer proof
    - Covers early mobilization through gait assistance with force-feedback and sensorized training
    - Payer path, utilization, and service burden remain opaque
  - - GR-1 humanoid
    - Researchers, enterprise pilots, innovation teams
    - Public product platform since 2023
    - Mass-produced positioning plus integrated FSA and pure-vision perception narrative
    - Named production buyers and support terms are not public
  - - GR-2 humanoid
    - Research, industrial experimentation, medical-rehab exploration
    - Architecture-rich but application proof is experimental
    - 53 DOF, FSA 2.0, optional 12-DOF hands, and a more open development surface
    - No public paid deployment references or reliability KPIs
  - - GR-3 care-bot
    - Care, companionship, reception, and assisted-interaction pilots
    - Showcase-stage international commercialization
    - 55 DOF and a care-centric multimodal interaction stack built for warmth and touch
    - No named production customers, certification pack, or detailed field specs
  - - N1 open-source humanoid
    - Global developers, researchers, and labs
    - Developer-facing and early-commercial
    - Smaller 23-DOF form factor with documented locomotion envelope and open sensor expansion
    - Public deployment proof is much thinner than the tooling surface
  - - Component and API layer (DexHand, FSA, SDKs, client)
    - Internal engineers and external developers
    - Public docs exist, but some tooling is alpha
    - Self-developed hand and actuator stack with low-level SDK exposure
    - Release discipline, compatibility stability, and security posture are under-documented
  notes: This matrix mixes commercial deployments, product pages, support docs, and developer repos. “Public maturity status” reflects what is evidenced in retained public materials, not an internal shipment, uptime, or revenue ranking.
  enumerationScope:
    coverage: exhaustive
    basis: Covers the eight product and component layers retained for this chapter across rehab systems, humanoids, and developer tooling; it is exhaustive for the retained public product surface, not for every undisclosed internal SKU.
