- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Fourier solution
  - Observable benefit in retained sources
  - Limitation / unverified point
  rows:
  - - Upper-limb therapist
    - Manual repetitive reaching and fine-motor practice is labor intensive and hard to standardize
    - ArmMotus, HandyRehab, OTParvos, and WristMotus inside RehabHub
    - Interactive tasks, measurable progress reporting, and higher repeatability are explicitly described by customer sites and brochures
    - No external randomized proof tying these exact modules to superior long-term outcomes
  - - Gait / mobility clinician
    - Standing, gait, and ankle training require high supervision and careful progression
    - ExoMotus, AnkleMotus, BalanceMotus, and CycleMotus
    - Public materials describe assist-as-needed gait practice, force or position sensing, and earlier-stage mobility support
    - Reimbursement, utilization, and staffing economics are not publicly broken out
  - - Rehab operations lead
    - Multi-device pathways can fragment data and therapist attention
    - RehabHub as a linked digital environment
    - Brochure claims one therapist can monitor multiple patients, with quick setup and auto-generated reports
    - These efficiency claims are brochure and customer-proof based, not audited operations data
  - - Robotics developer
    - Collecting embodied demonstrations and converting them into policies is technically fragmented
    - Teleoperation system, ActionNet, imitation-learning framework, URDF/MJCF models, Isaac and MuJoCo repos
    - Retained docs show a continuous path from data capture to simulation to policy deployment
    - Hardware setup remains support-heavy and the public client/runtime is not yet stable
  - - Care / reception operator
    - Human-facing interaction needs visual, audio, touch, and behavior planning in one package
    - GR-3 care-bot demos and interaction stack
    - CES demos showed speech, touch, chess, and movement interaction in a coherent public package
    - Public proof is still demonstration-heavy rather than named production operation
  notes: Rows map the most visible jobs-to-be-done in retained public evidence. The table distinguishes observable workflow benefits from buyer-grade proof such as published ROI, reimbursement, or renewal data.
  enumerationScope:
    coverage: exhaustive
    basis: 'Covers the five public workflows most relevant to this chapter: upper-limb rehab, gait rehab, multi-device rehab operations, developer data loops, and care-oriented humanoid interaction.'
