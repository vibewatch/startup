- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role in operating model
  - Public proof
  - Key dependency
  - Primary risk
  rows:
  - - Actuation and embodiment
    - Turns control policies into motion through FSA, DexHand, joints, and sensors
