- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control or signal
  - What is public
  - Scope covered
  - What remains unverified
  - Underwriting read
  rows:
  - - Clinical quality framing
    - Customer pages and 36Kr repeatedly stress effectiveness, therapist oversight, and medical-grade quality
    - Rehab deployments and future healthcare-oriented humanoid scenarios
    - Exact certifications, quality-system scope, and audit trail are not in the retained public set
    - Useful signal, but not a substitute for a compliance pack
  - - Named site governance
    - Ascot, STEPS, and Hobbs place the technology inside therapist-led pathways and supervised care settings
    - Rehabilitation use, not autonomous general-purpose operation
    - No public uptime, incident, or renewal dataset by site
    - Strong proof of supervised workflow fit
  - - Developer release discipline
    - The public client is alpha and unstable; teleop setup instructions route first-time hardware issues to support
    - External developer and integrator use
    - No public SLA, release cadence commitment, or long-term compatibility policy
    - Transparent, but early-stage
  - - Network and control interfaces
    - DexHand and FSA docs expose Ethernet, static-IP, power, and debugging details; teleop docs require HTTPS certificates and device-specific setup
    - Low-level robot and peripheral integration
    - No retained security architecture, auth, logging, or patch-management document
    - Good integrator visibility, weak enterprise-security visibility
  - - Privacy / regulatory evidence
    - The retained set contains care and medical-use narratives, but not detailed privacy or regulatory documentation for GR-3
    - Human-facing robots in care or rehab contexts
    - Named medical licenses, data-governance controls, and jurisdiction-specific approvals remain unverified
    - This is one of the chapter’s largest diligence blockers
  notes: Trust evidence in this chapter comes from workflow placement, public documentation habits, and explicit warnings inside the toolchain. It is enough to separate rehab deployments from pure demo theater, but not enough to clear certification, cybersecurity, or privacy diligence.
  claimRefs:
