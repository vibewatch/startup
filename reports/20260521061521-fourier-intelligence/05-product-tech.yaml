callouts:
- calloutType: strength
  title: Rehab is the anti-demo anchor
  body: The chapter’s clearest proof that Fourier is commercially real is not GR-3 at CES; it is the rehabilitation stack. Named customer sites, workflow descriptions, and multi-device RehabHub logic show real implementation experience in supervised care settings.
  claimRefs:
  - CE030
  - CE033
  - CE038
  - CE039
  - CE043
- calloutType: risk
  title: Public developer tooling is useful but still rough
  body: Fourier’s open repos are a positive signal, but the public stack still depends on support-heavy setup, version matching, and an explicitly unstable GRx client. That raises integration and maintenance risk for any buyer assuming a polished third-party ecosystem already exists.
  claimRefs:
  - CE017
  - CE020
  - CE026
  - CE048
  - CE049
- calloutType: assumption
  title: Care adjacency is the key differentiator until public humanoid scale catches up
  body: Fourier’s best evidence-backed edge is not public humanoid volume or autonomy bragging rights. It is the combination of rehab installed base, human-interaction design, and workflow knowledge that a generic industrial humanoid vendor would have to recreate from scratch.
  claimRefs:
  - CE030
  - CE031
  - CE041
  - CE043
  - CE044
