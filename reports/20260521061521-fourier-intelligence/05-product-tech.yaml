  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: named-gr-customers
    missingEvidence: Named production customers, contract values, renewals, or utilization data for GR-3 or N1 outside showcase and research contexts.
    whyItMatters: Without named buyer proof, the humanoid commercialization case stays closer to pilot rhetoric than scaled operating evidence.
    diligencePath: Request customer references, shipment cohorts by use case, renewal rates, and any paid hospital or enterprise deployment case studies.
    relatedQuestionRefs:
    - QE018
  - type: missing-source
    severity: material
    topic: gr3-regulatory-status
    missingEvidence: Product-specific certifications, medical licenses, or formal regulatory status for GR-3 in healthcare or eldercare scenarios.
    whyItMatters: Human-facing care deployments need more than warm interaction demos; approval scope and quality-system evidence change the underwriting risk materially.
    diligencePath: Request CE/FDA or equivalent status by product, intended-use statements, and any quality-management or clinical-validation pack shared with buyers.
    relatedQuestionRefs:
    - QE019
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: robot-security-and-privacy
    missingEvidence: Documentation covering authentication, encryption, logging, remote updates, vulnerability handling, and patient-data governance for networked robot operation.
    whyItMatters: Care and rehab robots process sensitive interaction and motion data, so weak public security disclosure can hide operational and compliance risk.
    diligencePath: Request architecture diagrams, security policies, penetration-test summaries, data-retention rules, and deployment hardening guidance for customer environments.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
