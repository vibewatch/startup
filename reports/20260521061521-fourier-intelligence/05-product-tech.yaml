company:
  name: Fourier Intelligence
chapter:
  number: 5
  title: Product & Technology
  summary: 'Fourier has a real product stack rather than a single humanoid showcase: public docs cover GR-1/GR-3, detailed GR-2 and N1 architecture, self-developed actuators and hands, and a meaningful developer toolchain spanning teleoperation, datasets, Isaac, MuJoCo, and model assets. The strongest commercialization proof sits in rehabilitation systems and named clinic deployments, while the humanoid line remains technically credible but much less proven in public customer operations, compliance disclosure, and support maturity.'
sections:
- id: platform-architecture-and-components
  title: Fourier publishes enough architecture to show a platform, but GR-3 remains less transparent than GR-2 or N1
  body: 'Public evidence shows Fourier as more than a single demo-shell humanoid company. The retained set covers three visible humanoid generations plus underlying components: GR-1 as the first mass-produced platform in the company narrative, GR-2 with detailed support-center architecture, and N1 as a smaller open-developer humanoid. GR-2 documentation is especially concrete, breaking the robot into head, torso, arms, hands, waist, and legs, specifying up to 53 degrees of freedom, self-developed FSA 2.0 actuators, and optional 12-DOF hands. The DexHand component page adds unusually specific low-level detail for a private robotics vendor, including actuator count, Ethernet control, load specs, and SDK support. By contrast, GR-3 is publicly positioned more through care-oriented interaction and CES demos than through a comparable engineering manual. Its retained public evidence supports a multimodal sensing and interaction architecture, but not the same depth of battery, payload, runtime,
    reliability, or field-service disclosure that would let an outside buyer treat it as fully spec-proven.'
