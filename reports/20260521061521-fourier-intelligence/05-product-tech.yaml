- id: developer-stack-and-learning-loop
  title: The developer surface is real and unusually open, but still reads like an early integrator stack
  body: 'Fourier’s public GitHub and support-center footprint is substantive. The company explicitly frames itself as contributing software, hardware designs, and research outputs to the open-source community, and the retained repo set maps a fairly complete embodied-AI loop: teleoperation for data capture, ActionNet for demonstration data, imitation-learning frameworks, URDF and MJCF robot models, Isaac Gym training, MuJoCo verification, and client libraries for external control. NVIDIA’s partner blog strengthens this picture by showing Fourier using sim-to-real workflows on GR-2 and reporting a transfer result on a floor-to-stand task after 3,000 iterations. But the stack is not yet frictionless. The teleoperation repo warns that first-time hardware setup is tricky and out of tutorial scope, and the public GRx client is explicitly alpha and unstable. That combination suggests genuine technical maturity inside the company, paired with an external developer experience that is better than
    marketing-only theater but not yet the polished, release-managed ecosystem associated with mature robotics platforms.'
