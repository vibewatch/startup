      - number: '1.4'
        title: Product Arc and Commercial Positioning
        blocks:
          - type: paragraph
            body: >-
              Fourier’s public milestone arc shows a company deliberately extending a rehabilitation robotics base into
              general-purpose humanoids. The official About page places the launch of the humanoid project in 2019, the
              first-generation GR-1 prototype milestone in 2022, and the formal GR-1 introduction in 2023. Official GRx
              materials and the 2024 GR-2 launch announcement position the GR-1 as the industry’s first mass-produced
              humanoid robot and then upgrade the platform in GR-2 to 175 cm, 63 kg, and up to 53 degrees of freedom,
              with optional 12-DoF hands, tactile sensing, and a more developer-friendly control stack. By August 2025,
              Fourier shifted the narrative again with GR-3, its first explicitly care-centric humanoid, using softer
              industrial design and multimodal emotional interaction as differentiators. Support-site documentation also
              shows that Fourier publishes developer-facing robot documentation and the Fourier ActionNet dataset,
              underscoring the company’s “made for AI” posture. This is a meaningful differentiator versus pure
              concept-stage humanoid startups, although the reviewed public record still gives only partial visibility
              into unit economics and customer-level deployment scale.
