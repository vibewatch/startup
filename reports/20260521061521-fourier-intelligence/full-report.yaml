  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Layered view of how Fourier’s public product architecture runs from care and rehab workflows down through robot
      bodies, components, data, and developer tooling.
    data:
      layers:
        - label: Customer workflow and site layer
          detail: RehabHub deployments and care-oriented humanoid interaction are the public entry points.
          modules:
            - RehabHub sites
            - Care / reception scenarios
          outputs:
            - Task requirements
        - label: Robot system layer
          detail: Rehab devices and GR-1 / GR-2 / GR-3 / N1 are the embodied endpoints buyers actually see.
          modules:
            - Rehab devices
            - GR humanoids
            - N1
          outputs:
            - Motion + interaction
        - label: Core electromechanical layer
          detail: FSA actuators, DexHand, force / position sensing, and multimodal perception shape movement quality.
          modules:
            - FSA
            - DexHand
            - Force / position sensors
          outputs:
            - Embodied control
        - label: Data and learning layer
          detail: Teleoperation, ActionNet, imitation learning, and RL convert demonstrations into reusable policies.
          modules:
            - Teleoperation
            - ActionNet
            - Imitation / RL
          outputs:
            - Policies / data
        - label: Developer and governance layer
          detail: >-
            Support docs, SDKs, URDF/MJCF assets, and client libraries enable outside use, but compliance evidence stays
            thin.
          modules:
            - Docs + SDKs
            - URDF / MJCF
            - GRx client
          outputs:
            - Research / deployment tooling
    approximationNotes: >-
      This figure is a structural map, not a network diagram of every internal subsystem. It reflects only modules
      explicitly visible in retained public sources.
