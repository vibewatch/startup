              Because Fourier does not publish its own P&L, the best public way to reason about economics is through
              evidence-constrained analogs. Ekso Bionics reported 2024 revenue of US$17.9 million, gross margin of about
              53%, year-end cash plus restricted cash of US$6.5 million, and US$9.8 million of operating cash use.
              Lifeward reported 2025 revenue of US$22.0 million, gross margin of 38.2%, and operating loss of US$19.7
              million, while explicitly blaming lower volume, tariff pressure, freight, and under-absorbed manufacturing
              overhead for part of the margin drag. CYBERDYNE’s FY2026 revenue was ¥3,846 million with a ¥601 million
              operating loss despite an established balance sheet. Those comps matter because they show a recurring
              pattern: rehabilitation robotics can achieve respectable hardware gross margins, yet still require
              meaningful capital to fund sales cycles, service, reimbursement work, and product development. Fourier’s
              own public signals point the same way. TMTPost says manufacturing costs remain high, while patient-use
              exoskeleton analogs require 40 to 50 hours of training and still depend on payer approvals or
              institutional budgets. The implication is not that Fourier is unprofitable by definition; it is that its
              category remains operationally heavy enough that gross margin alone would not settle the cash-burn
              question.
