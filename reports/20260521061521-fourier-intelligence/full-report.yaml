            body: >-
              Public evidence shows Fourier as more than a single demo-shell humanoid company. The retained set covers
              three visible humanoid generations plus underlying components: GR-1 as the first mass-produced platform in
              the company narrative, GR-2 with detailed support-center architecture, and N1 as a smaller open-developer
