        - Reduces regulatory tail risk; continued absence argues for a slower adoption assumption
      - - Safety and product-liability shock
        - Recall, NCAR, FSCA, or serious incident notice
        - Any patient-safety event requiring public corrective action or broad field notice
        - Immediate downside trigger; revisit deployment assumptions and reserve for service/remediation cost
      - - Rehab reimbursement conversion risk
        - Provider-side utilization and denial evidence
        - Flagship sites show stable utilization, acceptable KX denial rates, and repeat purchasing or renewal behavior
        - Supports rehab durability; failure implies workflow benefits are not translating into durable economics
      - - Export-control and compute dependency
        - Shipment or training disruption tied to chips or licenses
        - New restriction or supplier disruption delays roadmap or shipments by more than one quarter
        - Reset launch timing, margin assumptions, and capital needs
      - - Competitive price compression
        - Comparable rivals beat Fourier on cost and access
        - Lower-cost rivals are broadly available while Fourier still lacks premium-proof evidence
        - Premium healthcare-humanoid thesis weakens and valuation support should compress
