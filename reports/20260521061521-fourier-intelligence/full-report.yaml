              together could capture nearly 80% of China shipments underscores how quickly Chinese vendors are
              industrializing the category. AgiBot's own materials and CES press claims show a broad product family and
              thousands of robots shipped, even if independent verification remains uneven.

              Western peers have a different posture. Figure's homepage now sells a home-help narrative for Figure 03,
              but the strongest public proof on record is still BMW: daily shifts, 90,000+ parts loaded, and 30,000+
              vehicles affected in an automotive setting. 1X is even more clearly home first, emphasizing internal home
              testing, quieter hardware, passive safety, and teleoperation. That means Fourier's GR-1 and GR-3 are
              differentiated less by raw autonomy or manufacturing scale than by care adjacency. GR-3's soft-shell,
              touch-forward design and GR-1's human-like assistant framing are better suited to care or social-presence
              narratives than most industrial peers. But that is also Fourier's weakness: public evidence for scaled
              GR-series deployments, public pricing, and quantified ROI is materially thinner than the evidence
