      - number: '3.2'
        title: Rehabilitation competitors win on evidence, reimbursement, or specialized gait workflows
        blocks:
          - type: paragraph
            body: >-
              Fourier's strongest direct competition today remains in rehabilitation robotics, not general humanoids.
              Wandercraft is the closest strategic overlap because it now spans hospital gait training, home exoskeleton
              ambition through Eve, and an industrial humanoid extension via Calvin-40 and Renault. Ekso Bionics and
              Lifeward are more straightforward rehab rivals: both have explicit U.S. reimbursement signals around
              personal exoskeleton access, and both frame their offerings across clinical and home or community
              settings. CYBERDYNE remains more differentiated technologically, using bio-electrical signal control and
              offering medical, well-being, and labor-support variants, but it is less transparent in English-language
              public materials about recent global commercial scale.

              Fourier's advantage in this set is breadth of institutional rehab distribution. Its official materials
              show a larger multi-robot rehabilitation platform than any single-exoskeleton peer, which should help in
              therapist relationships, bundled sales, and cross-selling. The weakness is that U.S.-visible reimbursement
              and public payer proof are currently clearer for Lifeward and Ekso than for Fourier. Public price
              transparency is also thin: outside Medicare-linked personal exoskeleton reimbursement references, most
              vendors remain quote-driven. That opacity reduces the confidence of pure price-performance comparisons and
              pushes buyers toward vendor trust, evidence, and service footprint instead. Switching costs
              exist—clinician training, protocol redesign, software workflows, and payer familiarity—but they are not
              hard platform lock-in of the kind seen in surgical robotics, so no rehab incumbent is unassailable.
