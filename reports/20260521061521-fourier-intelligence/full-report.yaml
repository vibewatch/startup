              from a strategic-investment filing rather than from audited operating performance. The public price set is
              also internally heterogeneous: some rehab devices clear at a few hundred thousand renminbi while bigger
              systems and humanoid distributor listings land far higher, which makes bundle-normalized margin inference
              impossible. Peer analogs show that 38% to 53% gross margins do not prevent multi-million-dollar annual
              losses or cash burn. For underwriting, that means the right stance is not “Fourier has no economics,” but
              “Fourier has not disclosed enough economics to prove the current capital base converts into durable,
              internally financed growth.” Management must still open the books on realized pricing, segment mix,
