  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Scope Definition
        blocks:
          - type: paragraph
            body: >-
              Fourier Intelligence's addressable market sits at the intersection of two structurally distinct but
              increasingly overlapping robotics sectors. The first is rehabilitation robotics: powered exoskeletons,
              therapeutic robots, and assistive gait devices sold primarily to rehabilitation centers, hospitals,
              and—via a new Medicare pathway—directly to home users. The second is humanoid and embodied AI robotics:
              anthropomorphic, full-body robots sold to industrial, healthcare, and consumer end-markets. Fourier
              participates in both via its GRx humanoid platform and its established Fourier Rehab portfolio.

              Excluded from Fourier's primary TAM are: surgical robots (separate reimbursement path and buyer base);
              non-wearable stationary rehabilitation devices (continuous passive motion, ultrasound therapy); and the
              broader professional service robotics market spanning logistics, hospitality, and cleaning robots (USD
              31.11B in 2026 per Fortune, dominated by transport and logistics). Including broad service robotics as an
              additive TAM would be misleading—Fourier does not currently address logistics or hospitality applications.

              The International Federation of Robotics formally classifies powered exoskeletons as wearable robots
              within the medical robot taxonomy, distinct from industrial robots. Rehabilitation and non-invasive
              therapy robots are tracked as a dedicated sub-category of medical robots. This definitional precision
              matters: IFR's medical robot category saw a 91% unit-volume surge in 2024, while rehab and non-invasive
              therapy specifically rose 106%, demonstrating the acute acceleration within Fourier's core segment.

              Status-quo substitutes for robotic rehabilitation include: licensed physiotherapists and occupational
              therapists delivering manual therapy sessions; body-weight support treadmill systems (non-robotic); and
              standard orthotic devices including non-powered braces. The transition from these substitutes to robotic
              systems depends on evidence, reimbursement coverage, upfront cost acceptance, and therapist-facing
              workflow integration—all structural barriers that also define the adoption ceiling for Fourier's
              addressable market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM008
              - CM044
