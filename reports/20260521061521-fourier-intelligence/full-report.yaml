  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Observable valuation
      - Revenue / multiple snapshot
      - Relevance to Fourier
      - Limitation
    rows:
      - - Fourier public anchor
        - RMB8bn pre-money; ~RMB8.56bn fully diluted implied
        - No public revenue or margin disclosed
        - Only direct public price anchor for the company
        - Strategic context and ESOP dilution reduce cleanliness as a market-clearing price
      - - Ekso Bionics
        - ~US$42m market cap
        - 2025 revenue US$12.8m; ~3.9x EV/revenue; 53% gross margin
        - Shows what disclosed rehab robotics can trade at when scale is still modest
        - Public equity value is heavily shaped by liquidity and listed-market pessimism
      - - Lifeward
        - ~US$18m market cap
        - FY2025 revenue ~US$22.0m; ~0.9x EV/revenue
        - Useful floor for a rehab robotics name with visible economics
        - Valuation is distressed and not a clean fair-value target for healthier assets
      - - CYBERDYNE
        - ~JPY55bn market cap
        - FY2026 revenue JPY3.846bn; ~10.5x EV/revenue
        - Shows the upper end of rehab-adjacent public robotics with disclosure and platform framing
        - Listed Japan multiple includes market structure and local investor effects
      - - UBTECH
        - ~HK$55bn market cap
        - 2024 revenue ~US$0.17bn; ~22.1x EV/revenue
        - Best listed public marker for a disclosed humanoid / service robotics narrative
        - Much broader product and public-market narrative than Fourier’s current evidence set
      - - Apptronik
        - ~US$5.3–5.5bn post-money
        - '>$935m Series A; nearly US$1bn total funding'
        - Useful private humanoid narrative comp below Figure but above most public peers
        - Private-market mark; revenue not publicly disclosed
      - - Figure
        - US$39bn post-money
        - US$1bn Series C; US$1.75bn total funding
        - Shows the current top end of U.S. embodied-AI narrative pricing
        - Pure narrative ceiling, not a realistic base-case comp for Fourier today
    notes: >-
      Comparable set is intentionally mixed: public rehab peers frame the floor, listed robotics platforms frame the
      disclosed premium band, and private humanoid rounds frame the narrative ceiling. Values are not normalized for FX
      in-table because the purpose is bracketing, not synthetic precision.
