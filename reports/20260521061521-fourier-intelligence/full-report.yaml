  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to valuation
      - Action implication
    rows:
      - - Runyang anchor fails to close or reprices
        - Final transaction closes below disclosed terms, is materially delayed, or is replaced by structured capital
        - Undercuts the only direct public price anchor and implies hidden weakness
        - Downgrade immediately; re-base the valuation framework
      - - No economic disclosure by the next major financing
        - Another large round arrives without revenue, margin, or runway disclosure
        - Shows management still expects investors to price narrative over economics
        - Do not pay a premium to the current anchor
      - - Humanoid proof remains unnamed
        - No named paid humanoid deployment or task-level metrics over the next major milestone window
        - Option value stays speculative and should not carry a premium multiple
        - Keep valuation inside the base or bear band
      - - Rehab economics disappoint once shown
        - Disclosed segment margin, renewal quality, or customer concentration is materially worse than implied
        - Removes the commercialization floor that differentiates Fourier from pure narrative peers
        - Treat as a major downside reset
      - - Down-round or heavy preference stack appears
        - New financing prices below anchor or introduces aggressive senior claims
        - Common-equity outcomes compress even if enterprise narrative stays intact
        - Avoid or re-underwrite at a lower common-equity value
    notes: >-
      Triggers are defined as observable events that should change underwriting, not as generic business risks already
      covered in the risk chapter.
    claimRefs:
      - CV034
      - CV035
      - CV042
      - CV043
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Revenue and gross margin
        - Current annual revenue, segment split, gross margin, and contribution margin by rehab vs humanoid
        - Needed to place Fourier inside a real multiple band and reject false-precision guesswork
        - Request audited or management-certified KPI pack and customer/cohort bridge
      - - Runway and burn
        - Cash balance, monthly burn, and working-capital profile after Series E and Runyang
        - Without runway visibility investors cannot know whether the anchor bought time or only optics
        - Request monthly cash bridge and 12–18 month plan
      - - Runyang close terms
        - Whether the disclosed investment fully closed, at what date, and whether any terms changed
        - The chapter’s public price anchor depends on that transaction being real and durable
        - Request executed closing documents or updated cap-table memo
      - - Preference stack
        - Liquidation preferences, anti-dilution terms, and senior claims for later investors
        - Common-equity returns can be far worse than enterprise-value math suggests
        - Review financing documents and counsel summary
      - - Humanoid commercial proof
        - Named paid deployments, contract size, renewal terms, and task KPIs
        - Needed to justify giving the humanoid program more than option value
        - Reference calls plus contract-level deployment evidence
      - - Rehab customer quality
        - Top-customer concentration, reorder cadence, and renewal behavior
        - Needed to judge whether rehab is a durable floor or only a broad logo set
        - Segment cohort analysis and top-20 account review
    notes: >-
      These diligence asks are ordered by what would change the valuation call fastest. Financial disclosure comes first
      because every other valuation argument depends on it.
    claimRefs:
      - CV041
      - CV042
      - CV043
