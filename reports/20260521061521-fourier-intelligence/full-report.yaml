      - number: '8.4'
        title: >-
          The chapter’s decision rule is simple: do not pay above the anchor until missing operating facts turn into
          disclosed evidence
        blocks:
          - type: paragraph
            body: >-
              The most important valuation discipline here is procedural. Fourier does not need another narrative deck
              to improve the call; it needs a small set of operating disclosures that would let investors place it
              inside a real valuation regime. The first gate is financial visibility: revenue, gross margin, burn, and
              runway. The second is financing quality: whether the Runyang deal actually closed on the publicly
              described terms and what preference stack or anti-dilution protections sit above common equity. The third
              is commercialization quality: named paid humanoid deployments, customer concentration, renewal behavior,
              and evidence that rehabilitation sales are durable rather than merely broad. Until those facts are
              visible, the recommendation should stay price-sensitive and evidence-sensitive. That means no conviction
              underwriting at a premium to the public anchor, and no attempt to force a false-precision DCF onto an
              opaque private company. The upside case is real enough that the company stays investable in principle,
              especially because the rehab business gives it a floor many humanoid startups do not have. But the public
              record still supports waiting for either better disclosure or a more compelling entry price rather than
              treating the current anchor as self-validating.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
          - type: table
            tableRef: TV006
            claimRefs:
              - CV041
              - CV042
              - CV043
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not mistake a filed strategic anchor for a fully underwritten operating valuation
            body: >-
              Runyang’s filing is valuable because it proves a real public price reference exists. It is not enough to
              justify a conviction entry for outside investors, because revenue, gross margin, and runway remain
              undisclosed and the financing context included simultaneous ESOP dilution.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV030
          - type: callout
            title: Fourier has a better commercialization floor than most pure humanoid stories
            body: >-
              The rehabilitation business means Fourier is not a zero-revenue science project in the way many frontier
              humanoid companies still are. That floor matters when building a base case, even if public evidence is
              still too thin to convert it into a fully supported premium multiple.
            calloutType: strength
            claimRefs:
              - CV004
              - CV014
              - CV023
              - CV032
          - type: callout
            title: The comparable set is wide because Fourier sits between rehab robotics and embodied-AI narrative buckets
            body: >-
              Ekso and Lifeward are too bearish to describe the whole company, while Figure and Apptronik are too
              narrative-rich to describe Fourier today. The valuation chapter therefore has to bracket rather than
              pretend one single peer set is “correct.”
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV018
              - CV022
              - CV023
          - type: callout
            title: Require disclosure or a cheaper price before underwriting above the anchor
            body: >-
              The clean decision rule is simple: no premium to the current public anchor without revenue, margin,
              runway, cap-table, and closing-term disclosure. If disclosure improves, the call can move up quickly; if
              pricing tightens before disclosure arrives, the right answer is to wait.
            calloutType: recommendation
            claimRefs:
              - CV036
              - CV037
              - CV041
              - CV042
          - type: callout
            title: Scenario ranges are evidence-led brackets, not a hidden DCF
            body: >-
              All ranges in this chapter assume the public anchor is a usable reference but not a self-validating truth.
              They also treat equity value as a rough EV proxy because public debt and cash data are not disclosed,
              which is why the chapter explicitly favors scenario framing over false precision.
            calloutType: assumption
            claimRefs:
              - CV007
              - CV024
              - CV025
              - CV026
              - CV027
