        title: Humanoid rivals reset the market on price, volume, or industrial proof—not on clinical fit
        blocks:
          - type: paragraph
            body: >-
              In humanoids, Fourier is not the scale leader and it is not the price leader. UBTECH is already presenting
              itself as a listed full-stack humanoid company with mass production, automotive partnerships, and explicit
              exposure to elderly care and business service. Unitree is the public price disruptor: G1 starts at
              US$13.5K on its own site, while external market summaries point to R1 at US$5.9K, far below the pricing
