      - number: '2.4'
        title: 'Adjacent Market: Humanoid and Embodied AI Robotics'
        blocks:
          - type: paragraph
            body: >-
              The humanoid robot market represents Fourier's longer-range growth vector and its most ambitious
              market-entry claim. Two large-sample analyst estimates place the global humanoid robot market at USD 10.69
              billion (FMI) and USD 8.32 billion (TBRC) in 2026, with five-year CAGRs of 37% and 47–53% respectively.
              Healthcare is the leading application segment, with FMI assigning 28% of 2026 humanoid robot revenue to
              healthcare-related use cases—implying roughly USD 3.0 billion of addressable healthcare humanoid spend.

              Roland Berger's April 2026 report paints a longer horizon: projected operating cost of USD 2 per hour
              makes humanoids economically compelling versus human labor in regions facing structural labor shortages,
              with the OEM-level market potentially reaching USD 300 billion (baseline) to USD 750 billion (optimistic)
              by 2035. TrendForce projects Chinese humanoid output will rise 94% in 2026, with Unitree and AgiBot
              accounting for approximately 80% of shipments as the industry shifts from demonstration to delivery.
              BusinessWire cites Goldman Sachs data showing humanoid manufacturing costs fell 40% year-over-year—far
              ahead of the 15–20% decline previously modeled—with current robot costs ranging from USD 30,000 to USD
              150,000. Unitree's R1 launched at USD 5,900 in July 2025, establishing a sub-USD 10,000 consumer price
              point.

              The FMI and TBRC estimates diverge by approximately USD 2.37 billion, reflecting different scope
              boundaries, geographic coverage, and vintage assumptions. Both are ahead of some independent industry
              views—Roland Berger notes very few productive use cases for humanoids exist today outside narrow
              industrial pilots, and the ecosystem (software, integration, safety certification) trails hardware
              maturity by three to five years.

              For Fourier specifically, the relevant SAM within the humanoid market is not the full USD 8–11 billion but
              rather the healthcare, rehabilitation, and care-assistance sub-segment where Fourier's GR-3 humanoid is
              positioned. On FMI's 28% healthcare share applied to the USD 10.69B total, that implies a USD ~3B
              healthcare humanoid TAM in 2026—but Fourier would be competing against global platform leaders (Figure,
              Agility, Unitree, Boston Dynamics) with substantially more capital and manufacturing scale. The GR-3's
              differentiation via care-centric design and a clinical installed base is a distinct angle, but
              market-share penetration in the near term will be limited. A conservative view of Fourier's serviceable
              share of the humanoid market is well below 5% through 2027.
            claimRefs:
