        blocks:
          - type: paragraph
            body: >-
              Fourier’s public financing trail now gives a credible capital map even though the company still withholds
              operating financials. The 2022 Series D brought in RMB400 million from SoftBank Vision Fund 2,
              Prosperity7, and Yuanjing, with management saying the money would accelerate go-to-market expansion,
              healthcare-robotics innovation, and global growth. The January 2025 Series E was reported at nearly RMB800
              million and was explicitly tied to further humanoid development and broader commercial deployment. The
              most informative document is not a Fourier press release but Runyang Technology’s June 2025 filing,
              because it adds an RMB8 billion pre-money anchor, shows a planned RMB300 million check for 3.5060%
              post-dilution ownership, and discloses a simultaneous 3.0% ESOP top-up. That filing also shows an
              investorized board structure, with founders retaining six of eleven nomination rights. These are strong
              capital-structure signals, but they do not substitute for a balance sheet: the public record still says
              far more about who funded Fourier than about what the existing business earns, burns, or retains.
