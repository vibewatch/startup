  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Rehabilitation buyers are visible; payer and budget authority still sit with provider-side workflows
        blocks:
          - type: paragraph
            body: >-
              Fourier’s public customer map is not a single homogeneous buyer segment. The best-documented users are
              rehabilitation providers and hospital rehab services that buy technology as part of therapist-led care
              delivery, not as standalone consumer devices. In those settings, the institution is the buyer, therapists
              and rehab teams are the daily users, and patients are the beneficiaries inside an existing program of
              care. Public site pages repeatedly frame value around measurable training, workflow fit, therapist
              productivity, and data capture rather than headline hardware novelty alone. That matters because payer
              logic sits one layer above the robot: CMS documentation rules and NIH reimbursement guidance both show
              that medical-device adoption still has to fit a billable therapy pathway, documented plan of care, and
              internal provider ROI case. The result is a buyer stack where rehab directors, innovation leads,
              procurement or finance committees, and clinical documentation owners all matter. On the edges of that
              stack, Fourier also shows research-lab buyers, distributor-led private clinics, and early embodied-care
              pilots, but those segments have much weaker public payment and renewal visibility than the rehabilitation
              core.
