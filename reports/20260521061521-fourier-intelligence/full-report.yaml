              waist, and legs, specifying up to 53 degrees of freedom, self-developed FSA 2.0 actuators, and optional
              12-DOF hands. The DexHand component page adds unusually specific low-level detail for a private robotics
              vendor, including actuator count, Ethernet control, load specs, and SDK support. By contrast, GR-3 is
              publicly positioned more through care-oriented interaction and CES demos than through a comparable
              engineering manual. Its retained public evidence supports a multimodal sensing and interaction
              architecture, but not the same depth of battery, payload, runtime, reliability, or field-service
