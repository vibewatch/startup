      - number: '3.4'
        title: Fourier's moat is distribution and care fit, but commoditization pressure is rising fast
        blocks:
          - type: paragraph
            body: >-
              The most defensible Fourier differentiator is not that its humanoids are most capable today; it is that
              Fourier is one of the few humanoid entrants already embedded in rehabilitation provider workflows. That
              matters because hospital and rehab procurement still depends on trust, training, service, and clinical
              comfort more than spectacle. A care-oriented humanoid layered onto an existing rehab channel is a more
              believable go-to-market wedge than a generic consumer or factory humanoid suddenly pivoting into
              eldercare. This is why Fourier's dual identity is strategically useful: the rehab business can seed
              relationships, datasets, and channel access that pure-play humanoid vendors do not yet have.

              The durability of that edge is still limited. Public competitor evidence suggests the humanoid category
              remains pilot-stage and safety-constrained, with dexterous manipulation, endurance, tactile sensing, and
              minimum-risk behavior still unresolved in real environments. Those limits help Fourier because they slow
              everyone down. But they do not solve the bigger commercial risk: once humanoid hardware becomes cheaper
              and more modular, care-adjacent software, service, and clinical workflow integration may be easier to copy
              than a true reimbursement moat. Manual therapy, conventional assistive devices, internal automation
              projects, and adjacent entrants like Wandercraft's Calvin-40 or China's industrial platforms remain
              credible substitutes or future threats. The near-term judgment is therefore nuanced: Fourier has a
              stronger care narrative than most humanoid peers, but weaker publicly demonstrated scale and weaker U.S.
              reimbursement proof than the best rehab incumbents.
