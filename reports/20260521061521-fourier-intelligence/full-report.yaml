              institutional price points, has one credible public growth hint in overseas rehab revenue, and operates in
              adjacent reimbursement and rehabilitation markets where budgets can support high-value hardware. But the
              adverse case is stronger than management rhetoric admits. There is still no public revenue base, ARR,
