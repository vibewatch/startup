  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Fourier's competitor map is bifurcated, not singular
        blocks:
          - type: paragraph
            body: >-
              Fourier's public product surface makes clear that it is trying to bridge two markets rather than defend
              one narrow niche. The company still sells a dense rehabilitation stack through Fourier Rehab—more than
              2,000 institutions in 40+ countries, a RehabHub layer integrating 30+ robot types, and multiple
              limb-specific systems—but it also markets GR-1 as a mass-produced humanoid assistant and GR-3 as a
              care-oriented social robot. That dual identity means the direct competitive set splits into two groups
              with different proof requirements. On the rehab side, the relevant public peers are Wandercraft, Ekso
              Bionics, CYBERDYNE, and Lifeward, all of which compete on clinical evidence, gait-training workflow, and
              in some cases reimbursement access. On the humanoid side, Fourier runs into UBTECH, Unitree, AgiBot,
              Figure, and 1X, where public discussion centers on shipment scale, price floors, production capacity, and
              pilot deployments.

              The practical implication is that Fourier cannot be benchmarked against a single "robotics" average.
              Hospitals and rehab buyers care about therapist efficiency, regulatory posture, and whether a device fits
              reimbursement or care protocols. Factory, logistics, research, and early household buyers care more about
              autonomy, manipulation, hardware reliability, and headline price. That makes Fourier's care-humanoid
              strategy interesting but also fragile: it inherits stronger care adjacency than industrial-first humanoid
              peers, yet it also inherits slower healthcare-style proof standards than consumer or factory robotics
              vendors.
