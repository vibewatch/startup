  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Rehab medtech risk is about reimbursement, compliance, and postmarket discipline—not whether a product exists
        blocks:
          - type: paragraph
            body: >-
              Fourier’s rehabilitation business is no longer a zero-to-one proof story. Brooks and Fourier’s own
              materials support a real installed product set, and the company publicly anchors that story on a
              2,000-plus / 40-country footprint. That lowers existential product risk relative to many humanoid
              startups, but it does not remove medtech-style regulatory and reimbursement risk. In Europe, AI-enabled
              medical devices still enter through MDR today and then absorb AI Act obligations on data governance,
              transparency, cybersecurity, human oversight, and post-market monitoring as the regime phases in. In the
              United States, FDA guidance makes cybersecurity part of device compliance, while recalls, corrections,
              removals, and vigilance regimes matter if patient-adjacent systems fail in the field. On the demand side,
              CMS still ties therapy economics to documented medical necessity and correct coding rather than robot
              novelty. RehabHub’s workflow and data promises may help providers, but investors still need proof that
              those benefits convert into reimbursable utilization, renewal quality, and durable site economics.
