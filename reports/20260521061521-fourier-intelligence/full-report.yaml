      - number: '8.2'
        title: Public rehab peers frame the floor, while private humanoid rounds frame the narrative ceiling
        blocks:
          - type: paragraph
            body: >-
              Fourier’s valuation problem is that its public analogs point in two very different directions. On one
              side, listed rehabilitation and exoskeleton names such as Ekso and Lifeward show how unforgiving the
              public market can be when revenue is modest, losses persist, and investors can directly see the numbers.
              Those companies demonstrate that real products, reimbursement progress, and genuine commercialization do
              not automatically translate into rich valuation multiples. On the other side, CYBERDYNE and especially
              UBTECH show that robotics businesses can command materially richer multiples once they are listed,
              financially visible, and perceived as broader platforms rather than narrow rehab-device vendors. Private
              humanoid rounds then widen the gap even further. Figure’s tracked $39 billion Series C and Apptronik’s
              roughly $5.3 billion to $5.5 billion February 2026 valuation show how aggressively U.S. embodied-AI
              stories can be priced when investors are underwriting platform optionality rather than current economics.
              CNBC’s reporting makes the mechanism explicit: U.S. startups are being valued as AI platforms while
              Chinese ones are more often valued as industrial hardware businesses, even when Chinese firms are shipping
              more hardware. Fourier’s public anchor therefore sits between two worlds. It is too high to justify using
              distressed public rehab comps alone, but far too low to be read as a Figure-style frontier-humanoid
              narrative valuation. That is why the cleanest interpretation is a blended
              rehab-commercialization-plus-option-value framework rather than a single-sector comp shortcut.
