chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Footprint, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Fourier presents itself as a full-stack robotics company whose public identity now spans both a
              general-robotics brand (“Fourier”) and a rehabilitation-focused sub-brand (“Fourier Rehab”). The official
              About and homepage materials say the company was founded in 2015, started from exoskeleton rehabilitation
              robots, and has since expanded into a broader portfolio that includes the GRx humanoid series, RehabHub,
              the MetaMotus Galileo system, and open-source tooling. The company’s own contact page anchors the
              operating footprint in Shanghai, Singapore, and Malaysia, while multiple official pages state that Fourier
              serves more than 2,000 institutions across more than 40 countries and regions. That combination matters
              strategically: unlike a pure humanoid startup, Fourier already has an installed base in rehabilitation and
              clinical settings, which it can use to validate hardware, collect data, and cross-sell newer humanoid
              products. Publicly, the company still frames the business as product-led rather than through detailed
              commercial metrics; no reviewed source disclosed revenue, gross margin, or ARR figures.
