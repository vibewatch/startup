      - number: '1.5'
        title: Milestone Snapshot and Adverse Frame
        blocks:
          - type: paragraph
            body: >-
              By the report date, Fourier’s public profile supports a strong momentum narrative: it has a ten- year
              company history, a rehab installed base, a 500-plus employee disclosure from 2024, a fresh 2025 funding
              round, new rehab partnerships, and a CES 2026 showcase for GR-3. Yet the same record also justifies
              caution. The only public valuation anchor is the Runyang pre-money disclosure rather than a fully
              negotiated priced-round post-money number; the oft-cited GR-1 “100-plus delivered” number relies on
              secondary Chinese reporting rather than an audited company ledger; and The Robot Report’s 2026 China
              outlook explicitly says competitive pressure and consolidation will persist as investors demand
              commercially meaningful applications. In other words, Fourier looks more credible than many humanoid
              startups because it starts from a rehab business and institutional network, but it still operates in a
              market where commercialization, cost pressure, and disclosure discipline will determine whether a premium
              robotics narrative turns into durable value creation.
