      - number: '2.2'
        title: 'Demand Drivers: Epidemiology, Demographics, and Healthcare System Pressure'
        blocks:
          - type: paragraph
            body: >-
              The primary structural demand driver for rehabilitation robotics is a global epidemic of neurological and
              musculoskeletal conditions intersecting with an aging population that generates ever-larger volumes of
              post-acute rehabilitation need. The World Stroke Organization's 2025 Global Stroke Fact Sheet—drawing on
              GBD 2021 data—reports 93.8 million prevalent stroke cases globally in 2021, making stroke the second
              leading cause of death and third leading cause of combined death and disability globally. Stroke incident
              cases rose 70% between 1990 and 2021, with 87% of deaths and 89% of DALYs concentrated in lower- and
              lower-middle-income countries. The global economic cost of stroke exceeds USD 890 billion per year and is
              projected to nearly double by 2050.

              PAHO's estimates of rehabilitation need in the Americas show 366 million people in 2019 had health
              conditions amenable to rehabilitation—a 58% increase from 231 million in 1990—driven primarily by
              population growth and aging. The likelihood of rehabilitation need rises exponentially with age. This
              creates a secular demand tailwind for any device category that can scale stroke and neurorehabilitation
              throughput.

              The International Federation of Robotics identifies labor shortages in healthcare and the growing elderly
              population as the two dominant demand drivers for service robots in the professional medical space. Oliver
              Wyman frames the macro case at system level: without productivity intervention, global healthcare spending
              could rise from USD 11.8 trillion today to USD 23.1 trillion by 2040; AI and specialized robotics could
              remove up to USD 5.1 trillion of that projected cost increase annually under a breakthrough adoption
              scenario. A global caregiver deficit estimated at 15 million workers reinforces why hospital systems are
              evaluating robotic augmentation of therapy staff capacity. These epidemiological and workforce dynamics
              together define a structurally expanding demand base for rehabilitation robotics and adjacent care
              robotics.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
              - CM011
              - CM012
          - type: figure
            figureRef: FM004
            claimRefs:
              - CM034
              - CM036
              - CM038
              - CM039
              - CM040
              - CM041
      - number: '2.3'
        title: 'Core Market: Rehabilitation Robotics Sizing and Segmentation'
        blocks:
          - type: paragraph
            body: >-
              Four independent analyst firms published rehabilitation robotics market estimates for 2026, yielding a
              wide but informative range. TBRC places the market at USD 2.22 billion in 2026 growing at 22.7% CAGR to
              USD 4.87 billion by 2030. Mordor Intelligence estimates USD 1.77 billion in 2026 at 17.1% CAGR to USD 3.89
              billion by 2031. IMARC Group bases its estimate on a USD 1.82 billion 2025 market expanding at 16.53%
              CAGR. Fortune Business Insights offers a materially lower estimate of USD 579.5 million in 2026 at 16.36%
              CAGR, the result of a narrower scope (exoskeleton and therapeutic devices only, excluding some service and
              lab automation categories). These estimates are not reconcilable without reviewing the underlying
              methodologies; the USD 579.5M–USD 2.22B spread (3.8×) reflects definitional scope differences in whether
              assistive robots, prosthetics, and related services are bundled.

              The mid-range consensus—Mordor at USD 1.77B to TBRC at USD 2.22B—represents the most defensible TAM for
              Fourier's rehabilitation segment for 2026 planning purposes.

              Within this market, exoskeleton robots account for approximately 47.35% of type-based revenue (Mordor 2025
              data), confirming their dominance relative to therapeutic and assistive device sub-categories. Geriatric
              users account for approximately 61.4% of demand. Rehabilitation centers hold 53.2% of end-user revenue;
              hospitals represent the second-largest institutional buyer. Homecare is the fastest-growing adoption
              channel at 27.1% CAGR, driven partly by the 2024 CMS exoskeleton reclassification. Asia-Pacific is the
              fastest growing geography at 21.2% CAGR, driven by rising stroke incidence and aging demographics—an
              important dynamic for a Shanghai-headquartered company like Fourier. North America retains the largest
              regional share at approximately 74.76% of 2025 revenue by Fortune's estimate.

              Fourier Intelligence is explicitly named as a key competitor in TBRC's rehabilitation robotics competitive
              landscape, confirming the company's positioning within the commercial market rather than as a
              research-stage participant. IFR data shows the 2024 unit-level surge (106% growth in rehab robot sales) is
              driven by professional end-users in clinical settings, which aligns with Fourier's 2,000-plus
              institutional customer base from chapter 1.

              The adjacent elderly care robotics market—including companion robots, mobile service robots, and robotic
              exoskeletons specifically for senior-care facilities—is sized at USD 0.39 billion in 2026 growing to USD
              0.64 billion by 2031 at a 10.4% CAGR (Knowledge Sourcing). The broader AI-powered elderly care solutions
              market (including non-robotic AI) is projected to reach USD 7.38 billion by 2031 at 31.6% CAGR. These
              adjacent markets are accessible to Fourier's GR-3 care humanoid but represent distinct buyer communities
              (eldercare facilities, home health agencies) rather than the rehabilitation center and hospital buyers who
              anchor the core rehab robotics addressable market.
            claimRefs:
