      - number: '2.5'
        title: Payer, Buyer, and Budget Owner Landscape
        blocks:
          - type: paragraph
            body: >-
              Rehabilitation robotics procurement divides into three distinct buyer and payer archetypes, each with a
              different budget owner, decision timeline, and adoption trigger. Institutional buyers—rehabilitation
              centers and hospital outpatient departments—are the dominant channel (53.2% of market by revenue, per
              Mordor), funded by facility capital budgets with procurement decisions typically made by clinical
              operations leaders and finance committees. Reimbursement from government payers and private insurers
              indirectly enables these purchases by anchoring therapy session billing codes that fund device ROI.

              Home-use buyers are the fastest-growing but smallest segment. Medicare's 2024 Home Health Rule (effective
              January 1, 2024) reclassified powered exoskeletons within the brace benefit category, creating a
              reimbursement pathway for personal exoskeleton devices. CMS proposed payment at approximately USD 94,617
              per device, with the Medicare beneficiary responsible for the standard 20% copay. Completion of training
              at a certified clinical site is a prerequisite for home use. Lifeward reports that when Medicare, VA
              benefits, and workers' compensation are combined, approximately 40% of U.S. spinal cord injury patients
              are now covered by payers that have reimbursed personal exoskeleton claims, up from effectively zero
              pre-2024.

              The CY2026 OPPS/ASC final rule updated outpatient hospital payment rates by +2.6%, affecting approximately
              4,000 hospital outpatient departments and 6,000 ambulatory surgical centers. This incremental rate update
              supports overall institutional capacity to fund rehabilitation technology procurement, but the marginal
              impact on robot-specific budgets is indirect.

              Research and academic institutions represent a niche buyer channel for developmental platforms and
              data-generation partnerships—relevant to Fourier's open-source and developer-ecosystem strategy but not
              material to near-term revenue.

              Humanoid robotics procurement in 2026 is overwhelmingly pilot-driven and enterprise-funded. Deployments at
              BMW (Figure), Amazon and GXO (Agility Digit), and UBTECH's automotive OEM partnerships are enterprise
              capex decisions with one-to-three-year evaluation cycles. Healthcare humanoid pilots are even earlier
              stage; care humanoids like GR-3 have no established reimbursement pathway and must generate ROI through
              direct cost displacement of labor hours. This limits near-term institutional health system adoption to
              innovation or productivity budget lines rather than mainstream capex.
            claimRefs:
              - CM030
              - CM031
              - CM032
              - CM033
          - type: table
            tableRef: TM004
            claimRefs:
              - CM008
      - number: '2.6'
        title: 'Constraining Lens: Headwinds and Adoption Barriers'
        blocks:
          - type: paragraph
            body: >-
              The bull case for rehabilitation and humanoid robotics rests on demographic tailwinds, unit cost declines,
              and policy catalysts. A responsible market analysis must weight these against material constraining
              forces.

              On clinical evidence: the 2026 JMIR umbrella review of robot-assisted therapy for upper-limb
              rehabilitation after stroke found improvements in motor function, but activities of daily living (ADL)
              gains were generally comparable to conventional therapy. This finding directly limits the strongest
              payer-approval argument—that robot-assisted therapy produces meaningfully superior functional outcomes. A
              2026 PubMed RCT did find exoskeleton-assisted rehabilitation improved Fugl-Meyer lower-extremity scores
              and Barthel Index versus conventional training for post-stroke gait, supporting the lower-limb/gait-rehab
              case more clearly than upper-limb ADL. The evidentiary picture is thus mixed and segmented: stronger for
              lower-limb/gait exoskeleton use cases and weaker for broader ADL outcome claims.

              On commercial readiness for humanoids: the IFR's 2026 trends report explicitly states humanoid robots must
              match high industrial requirements in cycle times, energy consumption, and maintenance costs before they
              can compete with traditional automation—and that key gaps remain as of 2026. Robotics & Automation News
              identifies manipulation, power and endurance, and general-purpose autonomy as the three dominant technical
              bottlenecks; most 2026 deployments remain supervised pilot or co-pilot applications rather than autonomous
              operations. Roland Berger confirms the ecosystem (software integration, safety certification frameworks,
              regulatory clarity) trails hardware by three to five years.

              On cost barriers: rehabilitation robotics devices priced at USD 30,000–USD 150,000 face a procurement
              ceiling determined by reimbursement rates (roughly USD 94,617 per Medicare pathway), facility capital
              budgets, and institutional risk tolerance. Mixed long-term outcome data and high upfront cost together
              temper procurement in emerging markets and pediatric settings. Fortune Business Insights and Mordor
              Intelligence both flag high initial capex and integration costs as the primary market restraints. Privacy
              and data security concerns, plus anxiety about replacing human connection in care settings, represent soft
              barriers for AI-robotic eldercare adoption.

              Collectively, these constraints suggest that while the market size estimates are large and the growth
              rates compelling, the proportion of the stated TAM that is realistically addressable in the 2026–2028
              window—particularly for a mid-size player like Fourier—is substantially narrower than headline figures
              imply.
