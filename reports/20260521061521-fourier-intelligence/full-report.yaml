  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      How Fourier’s most proven public workflow moves from therapist goals into robot sessions, data capture, and
      care-plan iteration.
    data:
      nodes:
        - id: assessment
          label: Assessment and goals
          type: input
          detail: Therapist defines recovery stage, target movement, and safety constraints
        - id: selection
          label: Device / scenario selection
          type: process
          detail: RehabHub module or care-robot interaction is chosen for the job to be done
        - id: session
          label: Robot-guided session
          type: process
          detail: Interactive, force-feedback, or gait-oriented practice runs inside a supervised pathway
        - id: capture
