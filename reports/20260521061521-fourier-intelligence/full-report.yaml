      - number: '1.3'
        title: Capital Base, Valuation, and Disclosure
        blocks:
          - type: paragraph
            body: >-
              Fourier’s public financing arc is now clear enough to establish it as a growth-stage Chinese robotics
              company, even though the cap table remains opaque. The strongest confirmed round before the humanoid wave
              was the January 2022 Series D: RMB400 million led by SoftBank Vision Fund 2 with backing from Prosperity7
              Ventures and Yuanjing Capital. Three years later, 36Kr, FL Cube, Sango Automation, and NetEase all
              reported that Fourier completed a nearly RMB800 million Series E in January 2025 with a syndicate that
              included Guoxin Investment, Pudong Venture Capital, Zhangjiang-affiliated funds, Prosperity7, and Junshan
              Capital. In late May 2025, Runyang’s planned strategic investment of up to RMB300 million implied an RMB8
              billion pre-money valuation and gave the market a fresh unicorn anchor. The disclosure quality, however,
              is still venture- style rather than public-company grade: cumulative capital is reported in Chinese media
              at about RMB1 billion, but no official cap-table breakdown, liquidation stack, debt schedule, or current
              revenue metrics are publicly available.
