      severity: material
      topic: switching-costs
      missingEvidence: "Win/loss data, contract length, replacement rates, implementation times, and retraining burden when rehab providers switch between platforms."
      whyItMatters: "Moat durability depends on whether Fourier's installed base is sticky or merely an early distribution lead."
      diligencePath: "Ask Fourier and reference sites for renewal cohorts, displacement cases versus Ekso/Lifeward/Wandercraft, and workflow migration timelines."
      relatedQuestionRefs: [QP019]
    - type: private-evidence-only
      severity: material
      topic: competitor-funding-disclosure
      missingEvidence: "Primary financing documents or consistently updated official disclosures for private peers such as Wandercraft, AgiBot, and 1X."
      whyItMatters: "Capital intensity determines who can subsidize pilots, pricing, and safety validation long enough to outlast slower care-market adoption."
      diligencePath: "Collect official round announcements, board-approved financing summaries, or investor materials rather than relying on secondary databases alone."
      relatedQuestionRefs: [QP024]
    - type: missing-source
      severity: material
      topic: humanoid-price-performance-roi
      missingEvidence: "Realized ASP, service bundle terms, maintenance burden, and labor-hour ROI for Fourier GR-series versus UBTECH, Unitree, Figure, and 1X."
      whyItMatters: "Without comparable commercial terms, it is impossible to underwrite whether Fourier's care-first positioning is premium-justified or vulnerable to commoditization."
      diligencePath: "Request quotes, service contracts, pilot budgets, and post-deployment ROI analyses from Fourier and at least two peer buyers in each segment."
