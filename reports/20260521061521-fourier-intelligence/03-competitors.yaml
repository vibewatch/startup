company:
  name: "Fourier Intelligence"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    Fourier Intelligence faces two different competitive arenas at once. In rehabilitation robotics,
    it competes against clinically proven exoskeleton vendors such as Wandercraft, Ekso Bionics,
    CYBERDYNE, and Lifeward, where reimbursement, therapist workflow, and institutional trust
    matter most. In humanoids, it competes against faster-scaling and often cheaper platforms such
    as UBTECH, Unitree, AgiBot, Figure, and 1X, where public deployment scale and price anchors are
    stronger but healthcare fit is materially weaker.
sections:
  - id: split-landscape
    title: "Fourier's competitor map is bifurcated, not singular"
    body: >-
      Fourier's public product surface makes clear that it is trying to bridge two markets rather than
      defend one narrow niche. The company still sells a dense rehabilitation stack through Fourier
      Rehab—more than 2,000 institutions in 40+ countries, a RehabHub layer integrating 30+ robot
      types, and multiple limb-specific systems—but it also markets GR-1 as a mass-produced humanoid
      assistant and GR-3 as a care-oriented social robot. That dual identity means the direct
      competitive set splits into two groups with different proof requirements. On the rehab side,
      the relevant public peers are Wandercraft, Ekso Bionics, CYBERDYNE, and Lifeward, all of which
      compete on clinical evidence, gait-training workflow, and in some cases reimbursement access.
      On the humanoid side, Fourier runs into UBTECH, Unitree, AgiBot, Figure, and 1X, where public
      discussion centers on shipment scale, price floors, production capacity, and pilot deployments.

      The practical implication is that Fourier cannot be benchmarked against a single "robotics"
      average. Hospitals and rehab buyers care about therapist efficiency, regulatory posture,
      and whether a device fits reimbursement or care protocols. Factory, logistics, research,
      and early household buyers care more about autonomy, manipulation, hardware reliability,
      and headline price. That makes Fourier's care-humanoid strategy interesting but also fragile:
      it inherits stronger care adjacency than industrial-first humanoid peers, yet it also inherits
      slower healthcare-style proof standards than consumer or factory robotics vendors.
    claimRefs: [CP001, CP002, CP003, CP004, CP006, CP007, CP019, CP039]
    tableRefs: [TP001]
    figureRefs: [FP001]

  - id: rehab-rivals
    title: "Rehabilitation competitors win on evidence, reimbursement, or specialized gait workflows"
    body: >-
      Fourier's strongest direct competition today remains in rehabilitation robotics, not general
      humanoids. Wandercraft is the closest strategic overlap because it now spans hospital gait
      training, home exoskeleton ambition through Eve, and an industrial humanoid extension via
      Calvin-40 and Renault. Ekso Bionics and Lifeward are more straightforward rehab rivals:
      both have explicit U.S. reimbursement signals around personal exoskeleton access, and both
      frame their offerings across clinical and home or community settings. CYBERDYNE remains more
      differentiated technologically, using bio-electrical signal control and offering medical,
      well-being, and labor-support variants, but it is less transparent in English-language public
      materials about recent global commercial scale.

      Fourier's advantage in this set is breadth of institutional rehab distribution. Its official
      materials show a larger multi-robot rehabilitation platform than any single-exoskeleton peer,
      which should help in therapist relationships, bundled sales, and cross-selling. The weakness is
      that U.S.-visible reimbursement and public payer proof are currently clearer for Lifeward and
      Ekso than for Fourier. Public price transparency is also thin: outside Medicare-linked personal
      exoskeleton reimbursement references, most vendors remain quote-driven. That opacity reduces the
      confidence of pure price-performance comparisons and pushes buyers toward vendor trust,
      evidence, and service footprint instead. Switching costs exist—clinician training,
      protocol redesign, software workflows, and payer familiarity—but they are not hard platform
      lock-in of the kind seen in surgical robotics, so no rehab incumbent is unassailable.
    claimRefs: [CP008, CP009, CP010, CP011, CP012, CP013, CP014, CP015, CP016, CP017, CP018, CP042, CP043]
    tableRefs: [TP002]

  - id: humanoid-rivals
    title: "Humanoid rivals reset the market on price, volume, or industrial proof—not on clinical fit"
    body: >-
      In humanoids, Fourier is not the scale leader and it is not the price leader. UBTECH is already
      presenting itself as a listed full-stack humanoid company with mass production, automotive
      partnerships, and explicit exposure to elderly care and business service. Unitree is the public
      price disruptor: G1 starts at US$13.5K on its own site, while external market summaries point to
      R1 at US$5.9K, far below the pricing logic implied by institutional rehabilitation hardware.
      TrendForce's 2026 view that Unitree and AgiBot together could capture nearly 80% of China
      shipments underscores how quickly Chinese vendors are industrializing the category. AgiBot's own
      materials and CES press claims show a broad product family and thousands of robots shipped,
      even if independent verification remains uneven.

      Western peers have a different posture. Figure's homepage now sells a home-help narrative for
      Figure 03, but the strongest public proof on record is still BMW: daily shifts, 90,000+ parts
      loaded, and 30,000+ vehicles affected in an automotive setting. 1X is even more clearly home
      first, emphasizing internal home testing, quieter hardware, passive safety, and teleoperation.
      That means Fourier's GR-1 and GR-3 are differentiated less by raw autonomy or manufacturing
      scale than by care adjacency. GR-3's soft-shell, touch-forward design and GR-1's human-like
      assistant framing are better suited to care or social-presence narratives than most industrial
      peers. But that is also Fourier's weakness: public evidence for scaled GR-series deployments,
      public pricing, and quantified ROI is materially thinner than the evidence available for
      Unitree's price floor, UBTECH's order book, or Figure's partner-validated production learning.
    claimRefs: [CP020, CP021, CP022, CP023, CP024, CP025, CP026, CP027, CP028, CP029, CP030, CP031, CP032, CP033, CP034, CP035, CP044, CP045]
    tableRefs: [TP003]
    figureRefs: [FP002]

  - id: durability-and-risk
    title: "Fourier's moat is distribution and care fit, but commoditization pressure is rising fast"
    body: >-
      The most defensible Fourier differentiator is not that its humanoids are most capable today; it
      is that Fourier is one of the few humanoid entrants already embedded in rehabilitation provider
      workflows. That matters because hospital and rehab procurement still depends on trust,
      training, service, and clinical comfort more than spectacle. A care-oriented humanoid layered
      onto an existing rehab channel is a more believable go-to-market wedge than a generic consumer
      or factory humanoid suddenly pivoting into eldercare. This is why Fourier's dual identity is
      strategically useful: the rehab business can seed relationships, datasets, and channel access
      that pure-play humanoid vendors do not yet have.

      The durability of that edge is still limited. Public competitor evidence suggests the humanoid
      category remains pilot-stage and safety-constrained, with dexterous manipulation, endurance,
      tactile sensing, and minimum-risk behavior still unresolved in real environments. Those limits
      help Fourier because they slow everyone down. But they do not solve the bigger commercial risk:
      once humanoid hardware becomes cheaper and more modular, care-adjacent software, service,
      and clinical workflow integration may be easier to copy than a true reimbursement moat. Manual
      therapy, conventional assistive devices, internal automation projects, and adjacent entrants like
      Wandercraft's Calvin-40 or China's industrial platforms remain credible substitutes or future
      threats. The near-term judgment is therefore nuanced: Fourier has a stronger care narrative than
      most humanoid peers, but weaker publicly demonstrated scale and weaker U.S. reimbursement proof
      than the best rehab incumbents.
    claimRefs: [CP036, CP037, CP038, CP039, CP040, CP041, CP042, CP043, CP044, CP045]
    tableRefs: [TP004]
    figureRefs: [FP003]

