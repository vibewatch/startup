callouts:
  - calloutType: insight
    title: "Fourier's best wedge is clinical distribution, not raw humanoid horsepower"
    body: >-
      Fourier is one of the few humanoid aspirants already embedded in rehabilitation provider workflows. That is more
      defensible near term than claiming superior autonomy or cheaper hardware against Unitree, UBTECH, AgiBot, or Figure.
      The investment question is whether Fourier can convert rehab trust into paid care-humanoid deployments before cheaper
      or better-capitalized platforms move downmarket.
    claimRefs: [CP001, CP002, CP003, CP039, CP043]

  - calloutType: risk
    title: "China's price-and-scale curve is compressing humanoid differentiation"
    body: >-
      Unitree's public price anchors, UBTECH's order book, and AgiBot's shipment claims create a much harsher competitive
      baseline than Fourier's public GR disclosures suggest. Without clearer ROI, service packaging, or paid deployment
      metrics, Fourier risks being trapped between low-cost Chinese hardware and capital-rich Western autonomy programs.
    claimRefs: [CP024, CP025, CP026, CP028, CP030, CP031, CP040, CP045]

  - calloutType: assumption
    title: "Public comparisons are directionally useful but still disclosure-constrained"
    body: >-
      Public peer disclosures mix institutions, shipped units, funded rounds, annual report releases, runtime hours,
      and reimbursement schedules. That is enough to map positioning, but not enough to produce a clean market-share or
      realized-ASP ranking. Any investment model that pretends otherwise is overstating precision.
    claimRefs: [CP040, CP044, CP045]

