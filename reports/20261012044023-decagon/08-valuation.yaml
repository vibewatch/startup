  - CV007
  - CV008
  - CV015
  - CV016
- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Financing momentum
    - A $250M Series D and repeated $4.5B tender reference indicate strong sponsor demand.
    - A private financing and sponsored tender are not broad market-clearing prices.
    - Disclose the tender size, primary/secondary mix, and third-party secondary clearing evidence.
  - - Product breadth
    - Decagon markets autonomous workflows plus an in-console copilot for human representatives.
    - Breadth does not establish renewal durability, margin quality, or defensibility.
    - Provide cohort expansion, renewal, and contribution-margin data by product and channel.
  - - Commercial model
    - Company guidance describes conversation- or resolution-based pricing linked to usage.
    - Channel and volume variability can make revenue quality and delivery cost difficult to compare.
    - Reconcile contracts, recognized revenue, usage, service content, and model cost per resolution.
  - - Capital structure
    - Multiple institutional rounds provide financing capacity for continued execution.
    - Reported total funding differs by $5M, and funding raised is not cash available.
    - Provide the fully diluted cap table, cash balance, burn, debt, preferences, and pro forma ownership.
  notes: The table separates issuer claims from independently reported financing context; total funding is presented as a
    reported discrepancy, not as cash on hand.
