company:
  name: Decagon
chapter:
  number: 8
  title: Valuation
  summary: The January 2026 Series D established a $4.5 billion post-money reference after a $250 million raise, but the retained
    public record does not establish an exact current ARR denominator, gross margin, retention, or preference stack. The recommendation
    is research-more with medium confidence, high risk, and an expensive valuation stance until private diligence can reconcile
    the operating denominator and security terms.
sections:
- id: recommendation-and-investment-view
  title: Recommendation and Investment View
  body: 'Decagon has a credible momentum case: Bloomberg reported a $250 million Series D, a $4.5 billion post-money valuation,
    and more than 100 corporate clients added during the prior year. Company materials also show a product surface spanning
    autonomous workflows and assistance for human representatives. The price case is much weaker than the company case. One
    analyst source reports that annualized revenue crossed $100 million in August 2026, while explicitly warning that annualized
    revenue is not ARR; another source says the exact current ARR, gross margin, retention, and Series D multiple remain undisclosed.
    The appropriate recommendation is therefore research-more rather than buy: treat $4.5 billion as a financing reference,
    not independently validated fair value, and require primary financial and cap-table evidence before underwriting a target
    return.'
  claimRefs:
  - CV001
  - CV002
  - CV006
  - CV007
  - CV008
  - CV016
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: financing-context-and-entry-discipline
  title: Financing Context and Entry Discipline
  body: 'The financing sequence moved quickly. Decagon announced $35 million across its Seed and Series A in June 2024, then
    independent summaries place the Series C at $1.5 billion and the Series D at $4.5 billion roughly seven months later.
    A March 2026 employee tender reportedly reused the $4.5 billion mark, showing some sponsored secondary liquidity but not
    establishing a broad market-clearing price. Even the cumulative funding denominator is not fully reconciled: Tracxn reports
    $476 million across five rounds, whereas Value Add VC reports approximately $481 million of disclosed funding. That difference
    is not economically decisive, but it illustrates why entry analysis should not infer cash available, dilution, or liquidation
    overhang from headline funding totals. The security class, primary-versus-secondary mix, preferences, tender size, and
    ownership table remain private-evidence questions.'
  claimRefs:
  - CV003
  - CV004
  - CV005
  - CV009
  - CV010
  - CV015
  tableRefs:
  - TV002
- id: valuation-method-and-comparability
  title: Valuation Method and Comparability
  body: A revenue-multiple method would fit a recurring enterprise software business only after the revenue measure and economics
    are normalized. The retained evidence does not clear that threshold. Value Add VC attributes more than $100 million of
    annualized revenue to an August 2026 statement to Newcomer, but says the number is a run rate rather than ARR. Venture
    Capital Tracker, last updated earlier in August, says exact current revenue was not disclosed and identifies gross margin
    and retention as missing. Those accounts may reflect publication timing rather than a true contradiction, yet neither
    supplies audited revenue recognition, recurring mix, cohort retention, or inference-cost burden. Private-company and acquisition
    comparisons in the analyst material are therefore directional context, not independent like-for-like benchmarks. Public
    evidence cannot support a precise multiple, valuation range, or target return without substituting assumptions for facts.
  claimRefs:
  - CV007
  - CV008
  - CV013
  - CV014
  - CV015
  - CV016
- id: scenarios-exit-readiness-and-diligence
  title: Scenarios, Exit Readiness, and Diligence
  body: The scenario framework is deliberately qualitative because the pool does not support numeric forecast probabilities
    or terminal multiples. A bull outcome requires verified recurring revenue, durable renewal economics, and product expansion
    that converts autonomous resolution and human-agent assistance into efficient account growth. A base outcome assumes customer
    and product momentum continue but valuation support remains indeterminate until margins and retention are disclosed. A
    bear outcome follows if the annualized-revenue figure proves non-recurring, costs absorb the operating benefit, or financing
    protections transfer downside to common holders. The employee tender is a limited liquidity signal, not proof of IPO or
    strategic-exit readiness. Thesis-break triggers are an unreconciled ARR bridge, weak cohort retention, low contribution
    margin after model and voice costs, concentrated renewals, or security terms that prevent an acceptable return at the
    $4.5 billion reference.
  claimRefs:
  - CV004
  - CV007
  - CV008
  - CV011
  - CV012
  - CV013
  - CV016
  tableRefs:
  - TV003
tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Decision dimension
  - Assessment
  - Public-evidence basis
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - $4.5B post-money financing reference is verified, but the operating denominator and security terms are not.
    - Do not underwrite a new entry or secondary purchase before private diligence.
  - - Confidence
    - medium
    - Round price is corroborated; current ARR, gross margin, retention, and preference terms are not.
    - Confidence can rise only after primary financial and cap-table evidence is reconciled.
  - - Risk rating
    - high
    - The valuation tripled in roughly seven months, while public disclosure did not resolve core unit-economics questions.
    - Require a material valuation or evidence cushion rather than extrapolating momentum.
  - - Valuation stance
    - expensive
    - The $4.5B reference cannot be tested against a verified ARR denominator or like-for-like exit set.
    - Treat the financing price as a ceiling for diligence, not as independently supported fair value.
  notes: Assessment uses the retained January-October 2026 public sources; no numeric target return is shown because ARR,
    margins, security terms, and ownership are not publicly verified.
