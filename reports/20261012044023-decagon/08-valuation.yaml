  title: Research-more at the $4.5B reference
  body: The financing mark is well supported, but fair value is not. Require an ARR-to-recognized-revenue bridge, cohort retention,
    contribution margin after model and voice costs, customer concentration, burn, fully diluted ownership, and preference
    terms before setting a target return or entry price.
