  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-and-unit-economics
    missingEvidence: A reconciled ARR-to-recognized-revenue bridge, recurring mix, gross margin after model and voice costs,
      cohort retention, customer concentration, burn, and cash balance.
    whyItMatters: These inputs determine whether the $4.5 billion reference has a defensible operating denominator and whether
      growth creates durable equity value.
    diligencePath: Request audited financial statements, monthly revenue bridges, cohort schedules, contract-level concentration,
      contribution-margin waterfalls, and current cash and burn data.
    relatedQuestionRefs:
    - QV002
    - QV003
    - QV008
  - type: private-evidence-only
    severity: material
    topic: capital-structure-and-liquidity
    missingEvidence: The fully diluted cap table, security classes, liquidation preferences, participation rights, anti-dilution
      terms, option pool, tender size, and primary-versus-secondary financing mix.
    whyItMatters: Headline funding and valuation do not reveal dilution, common-equity downside, cash available, or the return
      available to a new investor.
    diligencePath: Obtain the charter, capitalization table, financing documents, tender materials, debt schedule, and pro
      forma ownership model from company counsel.
    relatedQuestionRefs:
    - QV006
    - QV008
  - type: missing-source
    severity: material
    topic: comparable-valuations
    missingEvidence: Primary transaction documents and normalized revenue, growth, margin, and security data for a truly comparable
      private round or acquisition set.
    whyItMatters: Without like-for-like denominators and transaction terms, analyst comparisons cannot establish a reliable
      entry range or exit multiple.
    diligencePath: Build a transaction set from primary filings, buyer disclosures, financing documents, and management-verified
      operating metrics before assigning terminal multiples.
    relatedQuestionRefs:
    - QV004
