callouts:
- calloutType: risk
  title: High Contract Floors Limit Addressable Segment and Elevate Churn Vulnerability
  body: With a median annual contract value of $432,750 and minimum commitments exceeding $100,000, Decagon is priced exclusively
    for upper mid-market and enterprise budgets. If cheaper helpdesk-native agents or open-platform builders close the capability
    gap on ticket resolution, enterprise buyers may face steep pressure to consolidate into existing CRM license agreements.
  claimRefs:
  - CP010
  - CP011
- calloutType: insight
  title: AOP Control Provides Sticky Integration but Requires Technical Ownership
  body: Decagon's reliance on Agent Operating Procedures written in natural language gives engineering and technical CX teams
    precise control over backend integrations and business logic. However, this architectural choice creates a dependency
    on dedicated internal owners to configure and maintain agents, contrasting with Sierra's forward-deployed managed model.
  claimRefs:
  - CP003
  - CP007
