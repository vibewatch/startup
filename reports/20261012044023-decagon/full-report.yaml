      - number: '6.3'
        title: Named Customer Deployments and Verified Operational Outcomes
        blocks:
          - type: paragraph
            body: >-
              Public customer case studies and cross-referenced industry evaluations reveal significant operational
              return on investment across named production accounts. Consumer neobank Chime deployed Decagon across both
              chat and voice support channels, achieving a seventy percent automated resolution rate and a sixty percent
              reduction in overall customer support expenses while preserving cross-channel interaction context. In the
              fitness marketplace segment, ClassPass reduced support conversation expenses by ninety-five percent and
              expanded service availability to twenty-four hours a day, seven days a week. Similarly, fintech loyalty
              provider Bilt Rewards cut its customer support staffing footprint from several hundred agents down to
              sixty-five representatives, realizing one million seven hundred and fifty thousand dollars in direct
              operational savings. Meanwhile, enterprise software vendor Rippling increased its ticket deflection rate
              from thirty-eight percent to fifty percent.
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU006
