              - CV002
              - CV003
              - CV007
              - CV008
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV008
              - CV011
              - CV015
              - CV016
      - number: '8.2'
        title: Financing Context and Entry Discipline
        blocks:
          - type: paragraph
            body: >-
              The financing sequence moved quickly. Decagon announced $35 million across its Seed and Series A in June
              2024, then independent summaries place the Series C at $1.5 billion and the Series D at $4.5 billion
              roughly seven months later. A March 2026 employee tender reportedly reused the $4.5 billion mark, showing
              some sponsored secondary liquidity but not establishing a broad market-clearing price. Even the cumulative
              funding denominator is not fully reconciled: Tracxn reports $476 million across five rounds, whereas Value
              Add VC reports approximately $481 million of disclosed funding. That difference is not economically
              decisive, but it illustrates why entry analysis should not infer cash available, dilution, or liquidation
              overhang from headline funding totals. The security class, primary-versus-secondary mix, preferences,
              tender size, and ownership table remain private-evidence questions.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV009
              - CV010
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
      - number: '8.3'
        title: Valuation Method and Comparability
        blocks:
          - type: paragraph
            body: >-
              A revenue-multiple method would fit a recurring enterprise software business only after the revenue
              measure and economics are normalized. The retained evidence does not clear that threshold. Value Add VC
              attributes more than $100 million of annualized revenue to an August 2026 statement to Newcomer, but says
              the number is a run rate rather than ARR. Venture Capital Tracker, last updated earlier in August, says
              exact current revenue was not disclosed and identifies gross margin and retention as missing. Those
              accounts may reflect publication timing rather than a true contradiction, yet neither supplies audited
              revenue recognition, recurring mix, cohort retention, or inference-cost burden. Private-company and
              acquisition comparisons in the analyst material are therefore directional context, not independent
              like-for-like benchmarks. Public evidence cannot support a precise multiple, valuation range, or target
              return without substituting assumptions for facts.
            claimRefs:
              - CV007
              - CV008
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Scenarios, Exit Readiness, and Diligence
        blocks:
          - type: paragraph
            body: >-
              The scenario framework is deliberately qualitative because the pool does not support numeric forecast
              probabilities or terminal multiples. A bull outcome requires verified recurring revenue, durable renewal
              economics, and product expansion that converts autonomous resolution and human-agent assistance into
              efficient account growth. A base outcome assumes customer and product momentum continue but valuation
              support remains indeterminate until margins and retention are disclosed. A bear outcome follows if the
              annualized-revenue figure proves non-recurring, costs absorb the operating benefit, or financing
              protections transfer downside to common holders. The employee tender is a limited liquidity signal, not
              proof of IPO or strategic-exit readiness. Thesis-break triggers are an unreconciled ARR bridge, weak
              cohort retention, low contribution margin after model and voice costs, concentrated renewals, or security
              terms that prevent an acceptable return at the $4.5 billion reference.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV008
              - CV013
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more at the $4.5B reference
            body: >-
              The financing mark is well supported, but fair value is not. Require an ARR-to-recognized-revenue bridge,
              cohort retention, contribution margin after model and voice costs, customer concentration, burn, fully
              diluted ownership, and preference terms before setting a target return or entry price.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV016
