              - CR014
      - number: '7.3'
        title: Ecosystem Dependencies and Software Stack Friction
        blocks:
          - type: paragraph
            body: >-
              Decagon's integration model presents structural architectural and software budget dependencies. The
              platform sits directly on top of established enterprise helpdesks like Zendesk and Salesforce rather than
              replacing them, creating a dual-software cost burden alongside ongoing connector maintenance obligations.
              Crucially, Decagon lacks standard pre-built connections for internal enterprise resource planning (ERP),
              human resources, and supply chain management systems, restricting its operational deployment primarily to
              front-office customer service. Additionally, while Decagon runs over 80% of its traffic on proprietary
              self-trained models to reduce generic LLM inference costs and latency, this internal model dependency
              concentrates model fine-tuning, regression testing, and hallucination guardrail maintenance entirely on
              Decagon's engineering organization.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
      - number: '7.4'
        title: Commercial Pricing Friction and Diligence Monitoring Indicators
        blocks:
          - type: paragraph
            body: >-
              Decagon's commercial model creates distinct sales friction and budget forecasting challenges for
              enterprise buyers. The vendor does not publish list pricing or self-serve evaluation tiers, relying
              instead on custom sales proposals with usage-based conversation fees and high minimum annual spend
              commitments. Third-party procurement research observes mid-six-figure typical contract values with a
              median near $432,750, leaving prospective customers unable to forecast total cost of ownership accurately
              before vendor scoping. Furthermore, rollout velocity depends on forward-deployed engineers and dedicated
              internal platform owners to configure and tune AOP workflows. Investors must monitor key thesis-break
              triggers, including customer concentration among early tech-native adopters, escalating voice telephony
              charges, and unmitigated API execution errors.
            claimRefs:
              - CR006
              - CR007
              - CR014
