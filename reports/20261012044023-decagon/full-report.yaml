      - number: '6.4'
        title: Land-and-Expand Dynamics, Friction, and Operational Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Enterprise customer relationships typically begin with high-volume digital chat deflection before
              expanding into inbound voice automation and agent copilot tools like Decagon Assist. While this
              multi-channel trajectory deepens software lock-in, customer operations encounter friction during
              unpredictable demand surges. Independent evaluations from competitor Assembled note that Decagon's
              standalone architecture lacks native integration with workforce management and intraday agent scheduling
              platforms. When sudden volume spikes degrade AI response latency or force higher fallback rates to human
              agents, lack of unified queue visibility creates severe staffing bottlenecks. Furthermore, Decagon's
              opaque usage-based pricing models, which charge per conversation or per resolution without public rate
              cards, introduce budgeting unpredictability for customer support executives managing volatile ticket
              volumes.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
