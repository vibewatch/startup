  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Investment View
        blocks:
          - type: paragraph
            body: >-
              Decagon has a credible momentum case: Bloomberg reported a $250 million Series D, a $4.5 billion
              post-money valuation, and more than 100 corporate clients added during the prior year. Company materials
              also show a product surface spanning autonomous workflows and assistance for human representatives. The
              price case is much weaker than the company case. One analyst source reports that annualized revenue
              crossed $100 million in August 2026, while explicitly warning that annualized revenue is not ARR; another
              source says the exact current ARR, gross margin, retention, and Series D multiple remain undisclosed. The
              appropriate recommendation is therefore research-more rather than buy: treat $4.5 billion as a financing
              reference, not independently validated fair value, and require primary financial and cap-table evidence
              before underwriting a target return.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
