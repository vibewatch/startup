      - number: '6.2'
        title: Customer Adoption Trajectory and Scale Milestones
        blocks:
          - type: paragraph
            body: >-
              Decagon has exhibited rapid commercial expansion since its 2023 founding, scaling from early pilot
              traction to over one hundred new global enterprise customer additions in the fiscal year preceding January
              2026. This adoption velocity propelled the company from zero to over ten million dollars in signed annual
              recurring revenue during its first operational year. In production deployments, customer usage reaches
              massive scale, as demonstrated by ClassPass routing more than two and a half million conversations through
              Decagon's autonomous agents. Despite these top-line milestone announcements, broader cohort durability
              remains difficult to evaluate independently. Public disclosures omit net revenue retention percentages,
              annual logo churn rates, and contract duration benchmarks, making it challenging to separate initial pilot
              enthusiasm from permanent long-term enterprise software commitments.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU014
          - type: table
            tableRef: TU002
