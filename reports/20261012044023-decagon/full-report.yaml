      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Velocity Outpaces Disclosed Fundamentals
            body: >-
              Decagon tripled its post-money valuation from $1.5 billion in June 2025 to $4.5 billion in January 2026 in
              under seven months, driven by rapid enterprise contract adoption across brands like Avis Budget Group and
              Block. However, the company does not disclose audited recurring revenue, leaving the multiple bridge
              heavily reliant on unverified third-party revenue estimates.
            calloutType: insight
            claimRefs:
