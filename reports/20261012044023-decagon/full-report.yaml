  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision dimension
      - Assessment
      - Public-evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - $4.5B post-money financing reference is verified, but the operating denominator and security terms are not.
        - Do not underwrite a new entry or secondary purchase before private diligence.
      - - Confidence
        - medium
        - Round price is corroborated; current ARR, gross margin, retention, and preference terms are not.
        - Confidence can rise only after primary financial and cap-table evidence is reconciled.
      - - Risk rating
        - high
        - >-
          The valuation tripled in roughly seven months, while public disclosure did not resolve core unit-economics
          questions.
        - Require a material valuation or evidence cushion rather than extrapolating momentum.
      - - Valuation stance
        - expensive
        - The $4.5B reference cannot be tested against a verified ARR denominator or like-for-like exit set.
        - Treat the financing price as a ceiling for diligence, not as independently supported fair value.
    notes: >-
      Assessment uses the retained January-October 2026 public sources; no numeric target return is shown because ARR,
      margins, security terms, and ownership are not publicly verified.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Financing momentum
        - A $250M Series D and repeated $4.5B tender reference indicate strong sponsor demand.
        - A private financing and sponsored tender are not broad market-clearing prices.
        - Disclose the tender size, primary/secondary mix, and third-party secondary clearing evidence.
      - - Product breadth
        - Decagon markets autonomous workflows plus an in-console copilot for human representatives.
        - Breadth does not establish renewal durability, margin quality, or defensibility.
        - Provide cohort expansion, renewal, and contribution-margin data by product and channel.
      - - Commercial model
        - Company guidance describes conversation- or resolution-based pricing linked to usage.
        - Channel and volume variability can make revenue quality and delivery cost difficult to compare.
        - Reconcile contracts, recognized revenue, usage, service content, and model cost per resolution.
      - - Capital structure
        - Multiple institutional rounds provide financing capacity for continued execution.
        - Reported total funding differs by $5M, and funding raised is not cash available.
        - Provide the fully diluted cap table, cash balance, burn, debt, preferences, and pro forma ownership.
    notes: >-
      The table separates issuer claims from independently reported financing context; total funding is presented as a
      reported discrepancy, not as cash on hand.
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return range
      - Probability signal
      - Downside trigger or diligence test
    rows:
      - - Bull
        - >-
          The $100M+ annualized-revenue report reconciles to recurring revenue; retention and contribution margin are
          strong; product expansion drives efficient growth.
        - Above the $4.5B financing reference; an exact range and target return are unsupported publicly.
        - Strengthens only with audited recurring-revenue, margin, and cohort evidence.
        - Fails if the ARR bridge or renewal cohorts do not validate the run-rate narrative.
      - - Base
        - Customer and product momentum continue, but revenue quality, margins, and financing terms remain undisclosed.
        - At or below the $4.5B reference; an exact range is indeterminate without normalized economics.
        - Current public evidence most directly supports continued monitoring rather than a priced entry.
        - Requires a lower entry price or a complete private financial and cap-table package.
      - - Bear
        - >-
          Annualized revenue includes non-recurring or low-margin activity, retention weakens, or preference terms
          burden common equity.
        - Materially below the $4.5B reference; loss magnitude cannot be quantified without security terms.
        - Rises if cohort retention, contribution margin, or renewal concentration misses underwriting thresholds.
        - Triggered by a failed ARR reconciliation, weak margins, concentrated churn, or punitive preferences.
    notes: >-
      Scenario ranges are qualitative relative to the January 2026 post-money reference; probabilities, terminal
      multiples, and return percentages are intentionally omitted because the retained evidence cannot support them.
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV008
      - CV013
      - CV016
