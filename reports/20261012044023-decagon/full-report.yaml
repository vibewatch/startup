              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High-Impact Deflection in Repetitive Consumer Workflows
            body: >-
              Decagon has demonstrated exceptional efficiency gains in consumer-facing digital platforms like ClassPass
              and Bilt Rewards, driving 50% to 95% reductions in support costs by automating structured, high-frequency
              transactions.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
          - type: callout
            title: Operational Disconnect from Workforce Management and Real-Time Staffing
            body: >-
              A critical operational vulnerability is Decagon's lack of native integration with enterprise workforce
              management systems. Without real-time synchronization between AI deflection and human shift scheduling,
              surges in escalated tickets create unexpected queues and service-level agreement breaches.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Compliance and Autonomous Authorization Risks
        blocks:
          - type: paragraph
            body: >-
              Deploying autonomous agents with direct write access to enterprise backends introduces critical regulatory
              and compliance vulnerabilities. When Decagon agents handle financial inquiries, payment processing, or
              account modifications, any failure in deterministic guardrails risks violating consumer protection and
              privacy frameworks across jurisdictions. Decagon mitigates external agent intrusion risks through its
              Personal Agent Consent & Trust (PACT) protocol and dedicated Personal Agent Gateway, which establish
              granular OAuth 2.0 authorization scopes for external agents. Furthermore, Decagon Assist implements
              zero-data-retention security policies and human-in-the-loop copilot controls to prevent customer data
              exposure during edge-case escalations. However, independent third-party compliance audits remain essential
              to verify whether these controls withstand adversarial prompts and credential manipulation in live
              production environments.
            claimRefs:
              - CR001
              - CR008
              - CR009
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
