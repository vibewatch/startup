chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and AI Concierge Model
        blocks:
          - type: paragraph
            body: >-
              Decagon was founded in August 2023 in San Francisco by Jesse Zhang and Ashwin Sreenivas to engineer
              autonomous AI customer service agents for enterprise deployments. The company positions itself as an 'AI
              concierge' platform designed to transcend legacy rule-based chatbots and traditional CRM routing systems
              by executing end-to-end customer resolution workflows. Central to Decagon's operating model is its
              proprietary Agent Operating Procedures (AOPs), which compile business-level natural language instructions
              into deterministically executed code integrated with enterprise APIs, databases, and systems of record. By
              replacing rigid decision trees with adaptive agentic execution, Decagon addresses high-volume support
              demands across chat, voice, email, and SMS channels while maintaining enterprise guardrails. The company
              operates at a Series D stage following aggressive capital expansion, serving major digital-first brands
              and established Fortune 500 enterprises from its headquarters in California.
            claimRefs:
              - CO001
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
      - number: '1.2'
        title: Founders, Leadership Team, and Governance
        blocks:
          - type: paragraph
            body: >-
              Decagon is led by co-founders Jesse Zhang (Chief Executive Officer) and Ashwin Sreenivas (President), who
              conceived the company at an investor founder retreat in 2023. Both executives demonstrate strong
              founder-market fit derived from prior venture exits and technical operations experience. Zhang previously
              founded Lowkey, a gaming clip-sharing application acquired by Niantic in 2021, providing extensive
              consumer product scaling experience. Sreenivas previously co-founded computer-vision platform Helia,
              acquired by Scale AI in 2020, following an operational tenure as a forward-deployed engineer at Palantir.
              This background directly informs Decagon's deployment methodology, which pairs dedicated Agent Product
              Managers and Forward-Deployed Engineers with enterprise clients. To support accelerating enterprise
              adoption, Decagon expanded its organizational headcount to over 300 employees across offices in San
              Francisco, New York, and London by early 2026. However, formal board composition, independent
              directorships, and founder voting control mechanisms remain private and undisclosed.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
      - number: '1.3'
        title: Capitalization, Investor Syndicate, and Commercial Pricing
        blocks:
          - type: paragraph
            body: >-
              Decagon's capital trajectory reflects extraordinary momentum within the enterprise conversational AI
              sector. The company emerged from stealth in June 2024 and achieved a $1.5 billion valuation during its
              $131 million Series C round in June 2025 co-led by Andreessen Horowitz and Accel. In January 2026, Decagon
              closed a $250 million Series D financing round co-led by Coatue Management and Index Ventures, tripling
              its post-money valuation to $4.5 billion within seven months and bringing total equity capital raised to
              approximately $481 million. The syndicate includes prominent venture institutions such as Bain Capital
              Ventures and strategic corporate partner T.Capital (the venture arm of Deutsche Telekom). Commercially,
              Decagon targets mid-to-large enterprises with custom contracts that require a $50,000 baseline annual
              platform fee before usage charges. Third-party marketplace procurement data indicates median annual
              contract values of approximately $386,000, underscoring high barrier-to-entry pricing that positions
              Decagon firmly in the upper enterprise segment.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO009
              - CO010
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO005
              - CO006
              - CO013
      - number: '1.4'
        title: Enterprise Adoption, Product Milestones, and Diligence Horizon
        blocks:
          - type: paragraph
            body: >-
              Since its commercial launch, Decagon has demonstrated rapid expansion across demanding enterprise sectors,
              including financial technology, travel, healthcare, and telecommunications. Over 100 global enterprise
              customers joined the platform during fiscal 2025, highlighted by marquee accounts such as Avis Budget
              Group, Block, Deutsche Telekom, and Chime. In operational case studies, Chime documented a 60% reduction
              in contact-center operating costs alongside doubled Net Promoter Scores following omnichannel deployment
              across chat and voice. Decagon continuously expands its surface area, introducing an ElevenLabs-powered
              Voice channel in early 2025 and launching Decagon Assist in October 2026 as a native AI copilot for human
              agents across Salesforce, Zendesk, and Front environments. Despite this rapid top-line growth, critical
              underwriting gaps persist: Decagon publishes no recurring ARR figures, and third-party estimates diverge
              between $12 million and $100 million, making private diligence on recognized revenue, customer
              concentration, and inference gross margins essential.
            claimRefs:
              - CO011
              - CO012
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO006
