              - CR013
      - number: '7.2'
        title: Operational Execution, Voice Latency, and Edge-Case Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Decagon's core autonomy engine relies on Agent Operating Procedures (AOPs), where customer experience
              teams configure natural language instructions and code workflows. While AOPs excel in structured and
              predictable support flows, industry benchmarking highlights that they struggle when encountering long-tail
              edge cases, multi-state regulatory disclosures, and multi-system verification logic. In complex
              environments like fintech and healthcare, edge cases represent the core operational burden, meaning
              unhandled exceptions quickly spill over to human desks without achieving full resolution. On voice
              channels, Decagon deployed its Voice 3 duplex architecture to decouple low-latency speech synthesis from
              background reasoning, yet third-party evaluations and RFP analysis still note occasional voice latency and
              tooling degradations under peak production traffic.
            claimRefs:
              - CR003
              - CR005
              - CR011
              - CR012
          - type: table
