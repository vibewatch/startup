            title: Enterprise Pricing Opacity and Resolution Risk
            body: >-
              Decagon enforces a $50,000 annual platform fee and defaults to per-conversation pricing, where enterprises
              pay for every interaction regardless of whether the AI successfully resolves the issue. For customers
              experiencing lower resolution rates, this creates ongoing cost friction alongside third-party median
              contract commitments of approximately $386,000.
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >
              The customer experience (CX) automation software landscape is undergoing a structural transition from
              scripted deflection bots and configuration-heavy CRM modules toward autonomous resolution platforms. In
              this evolving market, Decagon defines its addressable boundary around enterprise AI customer support
              across voice, chat, email, and SMS surfaces. The foundational distinction separating modern agentic
              architectures from legacy conversational software is execution capability: rather than merely retrieving
              knowledge articles for a human agent to review, autonomous platforms utilize natural-language procedures
              to execute backend transactions through enterprise application programming interfaces (APIs), including
              refund processing, account updates, and subscription modifications.


              Market demand originates across three distinct operational segments: enterprises replacing legacy
              interactive voice response (IVR) and scripted routing engines, organizations introducing automated
              customer service for the first time, and engineering teams abandoning internal build initiatives in favor
              of purpose-built platforms. Surveyed deployment data indicates that 53% of Decagon implementations replace
              legacy IVRs, ticketing add-ons, or CRM bots, 33% represent greenfield automation, and 14% replace internal
              engineering builds. However, the commercial category boundary remains bounded: Decagon's software operates
              as an intelligent interaction layer fronting conversations and does not replace the underlying helpdesk or
              CRM system of record, such as Salesforce or Zendesk. Consequently, enterprise software spend is additive
              rather than an outright displacement of helpdesk subscription line items, requiring procurement teams to
              justify investments through labor cost reductions or accelerated resolution velocity.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
      - number: '2.2'
        title: Market Sizing, Addressable Opportunity, and Sizing Lenses
        blocks:
          - type: paragraph
            body: >
              Evaluating the addressable market for autonomous customer experience platforms requires separating
              top-down industry forecasts from realistic software addressable market bounds. Broad industry projections
              illustrate immense macroeconomic tailwinds: Grand View Research estimates the global AI agents market will
              exceed $10.9 billion in 2026, expanding from approximately $7.6 billion in 2025 at an annual growth rate
              exceeding 45%, while BCC Research projects broader industry spending will reach $48.3 billion by 2030. At
              the macroeconomic labor level, Gartner estimates that conversational and agentic AI will eliminate or
              automate $80 billion in global contact center labor expenses, with approximately 10% of customer
              interactions automated without human touch.


              Translating macroeconomic labor arbitrage into direct software spend yields a significantly more
              constrained serviceable addressable market. Decagon's high-touch deployment model, six-figure minimum
              annual commitment, and enterprise integration requirements focus its immediate reach on high-volume
              consumer and B2B enterprises. Verified procurement data from marketplace transactions indicates a median
              annual contract value of $432,750, with signed enterprise agreements ranging from $105,000 to $923,183.
              Assuming an addressable global base of roughly 15,000 to 25,000 large enterprises handling tens of
              thousands of complex monthly support interactions across telecom, financial services, healthcare, and
              retail yields a serviceable addressable software market of approximately $6.5 billion to $10.8 billion.
              Long-term software expansion hinges on whether vendors can penetrate mid-market organizations without
              proportional increases in forward-deployed implementation headcount.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM010
              - CM012
              - CM013
      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Procurement Dynamics
        blocks:
          - type: paragraph
            body: >
              Enterprise procurement of agentic customer service platforms involves cross-functional stakeholders
              spanning customer experience operations, contact center leadership, and enterprise IT engineering. While
              Chief Customer Officers and Vice Presidents of Support evaluate solutions based on customer satisfaction
              (CSAT) scores, first-contact resolution rates, and handle time reduction, technical teams control API
              integration feasibility, identity verification security, and runtime guardrails. Platforms that bifurcate
              operational workflows from technical integrations—allowing CX teams to draft logic via natural-language
              Agent Operating Procedures (AOPs) while engineers enforce guardrails and versioning—accelerate
              proof-of-concept velocity compared to pure code-heavy SDK implementations.


              Despite operational ownership residing with CX leaders, budgetary authority often depends on contact
              center labor substitution versus software innovation allocations. The industry is currently transitioning
              away from traditional per-seat software licensing toward usage-based models, structured around fixed
              conversation rates or outcome-oriented per-resolution fees. In enterprise contracts, buyers report that
              pricing models significantly alter adoption economics: while per-resolution pricing transfers financial
              failure risk to the vendor, per-conversation billing offers predictable monthly expenditure curves but
              charges for interactions that ultimately escalate to human agents. Procurement evaluations typically
              demand pilot deployments with measurable return on investment, requiring vendors to demonstrate deflection
              exceeding 70% before granting full enterprise rollout approval.
            claimRefs:
              - CM002
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: Structural Growth Drivers and Enterprise Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Adoption of autonomous customer support software is propelled by compounding labor pressures and rapid
              technological advancements in multimodal voice and reasoning models. Contact centers historically face
              persistent annual agent turnover rates exceeding 30%, driving high onboarding and training costs for
              routine inquiries. Concurrently, rapid maturation in conversational speech models—such as low-latency
              duplex voice architectures that support interruption handling and multilingual detection across more than
              70 languages—enables enterprises to automate complex telephony workflows previously restricted to human
              agents.


              Conversely, several material adoption constraints temper deployment velocity across regulated and
              risk-averse enterprises. Security and compliance mandates require rigorous controls, including SOC 2 Type
              II certification, zero-data-retention agreements with frontier model providers, and guardrails preventing
              model hallucination in financial or healthcare transactions. Implementation friction remains a critical
              bottleneck: despite marketing claims of instant self-serve iteration, enterprise deployments require
              extensive integration with proprietary billing engines and ticketing tools, typically demanding dedicated
              internal product managers and managed implementation teams. Furthermore, vendor lock-in risks and
              potential platform bundling by incumbent systems of record (such as Salesforce Service Cloud or Zendesk)
              present ongoing friction for standalone automation layers.
            claimRefs:
              - CM001
              - CM008
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Additive Stack Economics Limit Pure Software Replacement
            body: >-
              Because autonomous AI agents act as an orchestration and interaction front-end rather than a helpdesk
              database, enterprise buyers must maintain their underlying CRM licenses. The business case relies entirely
              on offsetting contact center labor costs and scaling support capacity rather than eliminating legacy
              software seat fees.
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
          - type: callout
            title: Commercial Definition Ambiguity in Outcome-Based Billing
            body: >-
              While usage-based and resolution-based models align incentives with support deflection, definitional
              ambiguity surrounding what constitutes a successful resolution versus an abandoned inquiry introduces
              friction in enterprise contract reconciliation and forecasting.
            calloutType: risk
            claimRefs:
              - CM013
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Direct Enterprise Alternatives
        blocks:
          - type: paragraph
            body: >-
              Decagon operates in a rapidly concentrating enterprise AI customer-experience market where buyers evaluate
              autonomous resolution platforms against both emerging venture-backed peers and entrenched CRM incumbents.
              Its most direct head-to-head competitor is Sierra, which achieved an identical $4.5 billion private
              valuation in early 2026 behind marquee deployments at Sonos, Casper, WeightWatchers, Discord, and Rivian.
              Both vendors command six-figure annual contract commitments and target large enterprise customer care
              budgets. However, their underlying philosophical approaches diverge sharply: Decagon delivers an Agent
              Operating Procedure framework designed for technical CX teams seeking granular control over backend
              integrations, whereas Sierra provides an end-to-end managed service supported by forward-deployed
              engineers. Beyond Sierra, adjacent specialized platforms such as Helpshift capture vertical customer
              support in gaming and interactive entertainment, while open agent builders like Voiceflow allow
              engineering teams to build and maintain internal agent architectures without outsourcing conversational
              intelligence to a third-party managed vendor.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP005
              - CP013
              - CP014
      - number: '3.2'
        title: 'Architectural Differentiation: AOPs vs. Managed and Platform Services'
        blocks:
          - type: paragraph
            body: >-
              The competitive boundary between modern AI customer support platforms centers on resolution autonomy
              versus legacy deflection. While traditional chatbots and early conversational widgets deflect incoming
              inquiries by routing users to static help-center documentation, Decagon and Sierra execute multi-step
              backend actions such as payment refunds, order modifications, and account cancellations. Decagon's
              architectural advantage lies in its Agent Operating Procedures, which enable customer experience and
              engineering teams to author business logic in natural language while maintaining deterministic integration
              guards across enterprise databases and APIs. Conversely, Sierra retains an advantage in voice maturity,
              offering lower speech latency and sophisticated brand voice cloning developed earlier in its product
              roadmap, whereas Decagon's voice infrastructure is a newer 2026 expansion. Decagon addresses the
              human-in-the-loop workflow through Decagon Assist, deploying an AI copilot directly into agent desktops
              across CRM environments to surface ticket summaries and suggest automated next steps during escalations.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: Pricing Structures, Contract Floors, and Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Procurement dynamics in enterprise AI customer service are characterized by substantial entry pricing
              hurdles and opaque contract structures. Decagon publishes no public list pricing, requiring custom
              commercial negotiations that reflect a median signed annual contract value of $432,750 based on verified
              enterprise transaction data, with contract sizes spanning from $105,000 to $923,183. These commitments
              combine mandatory annual platform access fees with tiered conversation or resolution volume charges. While
              Sierra commands similar high-six-figure enterprise commitments, lower-friction alternatives such as
              Aissist.io and Intercom Fin operate transparent usage-based models billing $0.20 to $0.60 per autonomous
              resolution without requiring hundred-thousand-dollar platform baselines. Decagon's premium enterprise
              pricing creates an effective floor that confines its sales pipeline to high-volume enterprise
              organizations, leaving mid-market and SMB customer segments to point solutions, helpdesk-native add-ons,
              or modular visual builders.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat Durability, Switching Costs, and Incumbent Response
        blocks:
          - type: paragraph
            body: >-
              Decagon's competitive defensibility is anchored in deep workflow integration rather than proprietary
              foundational models. Once an enterprise integrates Decagon's Agent Operating Procedures with core business
              systems—such as ERP platforms, internal billing databases, and CRM ticketing queues—the cost and
              operational friction of replacing the conversational layer become substantial. However, switching costs
              are mitigated by the fact that Decagon operates as an overlay rather than the primary system of record.
              Because Decagon integrates with helpdesks like Zendesk, Salesforce Service Cloud, and Freshdesk rather
              than replacing them, these CRM incumbents hold long-term distribution power. If incumbent platforms
              enhance native agent capabilities to match autonomous resolution quality, enterprise procurement teams may
              face compelling economic incentives to consolidate point-solution budgets into existing enterprise
              software agreements.
            claimRefs:
              - CP004
              - CP008
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Contract Floors Limit Addressable Segment and Elevate Churn Vulnerability
            body: >-
              With a median annual contract value of $432,750 and minimum commitments exceeding $100,000, Decagon is
              priced exclusively for upper mid-market and enterprise budgets. If cheaper helpdesk-native agents or
              open-platform builders close the capability gap on ticket resolution, enterprise buyers may face steep
              pressure to consolidate into existing CRM license agreements.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
          - type: callout
            title: AOP Control Provides Sticky Integration but Requires Technical Ownership
            body: >-
              Decagon's reliance on Agent Operating Procedures written in natural language gives engineering and
              technical CX teams precise control over backend integrations and business logic. However, this
              architectural choice creates a dependency on dedicated internal owners to configure and maintain agents,
              contrasting with Sierra's forward-deployed managed model.
            calloutType: insight
            claimRefs:
              - CP003
              - CP007
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Mechanisms, and Procurement Reality
        blocks:
          - type: paragraph
            body: >-
              Decagon generates revenue through an enterprise-directed software model that combines upfront annual
              platform access fees with variable conversation or resolution usage billings. Unlike legacy customer
              support software that charges per human seat, Decagon aligns pricing with customer interaction volume.
              Public pricing transparency is entirely absent; the vendor's public pricing portal returns a 404 error,
              and procurement occurs exclusively through sales-assisted enterprise contracts or private AWS Marketplace
              transactions. Third-party procurement teardowns consistently observe an entry baseline platform fee of
              approximately $50,000 annually before any conversation volume is processed. Actual enterprise commitments
              span a wide range: transaction data from signed buyer contracts tracked by procurement platform Vendr
              demonstrates an observed median annual contract value of $432,750, with contracts ranging from $105,000 to
              $923,183. While Decagon offers an alternative outcome-based resolution pricing model, buyers report that
              algorithmic ambiguity in defining what constitutes a successfully resolved ticket introduces billing
              disputes and forecasting friction, driving the majority of customers toward per-conversation billing
              structures.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI014
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI012
              - CI014
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Cost Structure, Multi-Model Architecture, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              The core driver of Decagon's service-delivery cost is its multi-model artificial intelligence inference
              pipeline and cloud hosting infrastructure. The platform orchestrates conversations across a distributed
              multi-region stack hosted on Microsoft Azure, utilizing a hybrid combination of off-the-shelf foundation
              models from providers like OpenAI, Anthropic, and Cohere alongside proprietary fine-tuned weights. Decagon
              states that more than 80% of its customer support model traffic is routed to specialized self-trained
              models tailored for customer experience accuracy rather than general-purpose large language models. This
              architectural optimization significantly mitigates per-token inference expenses, shielding gross
              contribution margins from third-party API price volatility. Beyond cloud computing and telephony costs,
              enterprise deployments impose real operational overhead on customer organizations: implementations
              frequently demand a dedicated internal technical manager to oversee workflow definitions, guardrails, and
              CRM integrations, increasing the true total cost of ownership beyond direct vendor software fees.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI008
              - CI009
      - number: '4.3'
        title: Commercial Traction, Financing Dependency, and Valuation Runway
        blocks:
          - type: paragraph
            body: >-
              Decagon's commercial traction has accelerated dramatically since its founding in 2023, expanding into
              high-volume consumer tech and enterprise accounts across fintech, travel, and retail. Over 100 new global
              enterprise customer logos joined the platform during fiscal year 2025, broadening its revenue base. The
              company added to its monetization footprint in October 2026 by launching Decagon Assist, expanding from
              autonomous front-line ticket resolution into human-agent copilot software across Salesforce and Zendesk
              helpdesks. To support this rapid scaling, Decagon secured $250 million in Series D venture financing in
              January 2026 led by Coatue and Index Ventures, establishing a post-money valuation of $4.5 billion and
              bringing total capital raised to roughly $476 million to $481 million. This financing provides substantial
              balance-sheet liquidity and extended runway, insulating operations from near-term capital dependency,
              though the valuation multiple places extraordinary pressure on ongoing ARR expansion.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI005
              - CI007
              - CI011
              - CI013
      - number: '4.4'
        title: Financial Verdict, Revenue Quality, and Underwriting Blockers
        blocks:
          - type: paragraph
            body: >-
              Decagon displays robust top-line momentum, marquee enterprise customer adoption, and defensible contract
              economics characterized by substantial six-figure annual contract values. However, from an investment and
              underwriting perspective, critical private financial metrics remain obscured. Publicly reported annualized
              revenue claims reached $30 million or more in 2025, but independent research estimates diverge sharply
              between $12 million and $44 million for the same timeframe. Without verified disclosure of recognized GAAP
              revenue, gross contribution margins after model inference and telephony COGS, and customer cohort net
              revenue retention, the current $4.5 billion valuation implies aggressive forward multiples that cannot be
              underwritten from public evidence alone. Resolution-based billing risks and customer staffing dependencies
              further underscore the necessity of verifying customer contract durability and unit margins in private
              data-room diligence.
            claimRefs:
              - CI002
              - CI004
              - CI007
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: High Contract Minimums and Algorithmic Resolution Friction
            body: >-
              Decagon's enterprise-first focus creates strong contract economics with a median annual contract value of
              $432,750, but the lack of transparent self-serve pricing and ambiguity around algorithmic resolution
              definitions pose friction for prospective customers. When buyers opt for resolution-based pricing,
              disputes over whether edge-case interactions were satisfactorily resolved can strain vendor relationships
              and make budgeting unpredictable.
            calloutType: risk
            claimRefs:
              - CI001
              - CI002
              - CI004
          - type: callout
            title: Capital Sufficiency Against Steep Valuation Expectations
            body: >-
              With $250 million raised in its Series D round in January 2026 and roughly $480 million in cumulative
              capital, Decagon maintains substantial balance-sheet runway. However, the $4.5 billion valuation sets an
              exceptionally high performance hurdle, requiring rapid ARR expansion from the $30M–$44M range to
              triple-digit millions to justify current growth multiples.
            calloutType: insight
            claimRefs:
              - CI005
              - CI006
              - CI007
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              Decagon builds conversational artificial intelligence software designed to resolve complex enterprise
              customer support inquiries autonomously rather than simply deflecting tickets with static documentation
              links. The platform's foundational abstraction is the Agent Operating Procedure (AOP), which translates
              natural-language operating instructions drafted by customer experience teams into code-backed execution
              logic. By compiling business rules into structured execution paths, Decagon enables support operations
              managers to define triggers, validations, and escalation thresholds without requiring dedicated software
              engineering sprints for routine policy modifications. Through its companion Duet capability, the platform
              assists teams in drafting new procedures directly from plain-English descriptions or pre-existing standard
              operating documentation. For interactions requiring human empathy or judgment outside automated procedure
              scopes, Decagon Assist embeds directly within third-party CRM interfaces to provide human representatives
              with instant conversational summaries, recommended next actions, and contextual knowledge search.
            claimRefs:
              - CE001
              - CE005
              - CE011
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE011
      - number: '5.2'
        title: System Architecture and Multi-Stage Query Pipeline
        blocks:
          - type: paragraph
            body: >-
              Decagon's runtime query processing pipeline handles incoming customer messages through an orchestrated
              multi-stage sequence. When a message arrives across chat, voice, email, or SMS, the engine first parses
              the user's intent while evaluating conversational history across channels to preserve cross-session
              continuity. Next, the orchestration layer routes the parsed intent to an appropriate Agent Operating
              Procedure. If no active procedure matches the query, the architecture falls back to retrieval-augmented
              generation (RAG) to synthesize an accurate response from connected enterprise knowledge bases. Decagon
              reports that over 80% of its inference workload executes on proprietary self-trained models tuned
              specifically for customer experience accuracy, reducing reliance on general-purpose frontier commercial
              APIs. The system emphasizes transactional execution depth, coordinating backend API calls and data updates
              across billing, CRM, and authentication tools before returning structured confirmation to the customer.
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE007
              - CE008
      - number: '5.3'
        title: Deployment Mechanics, Integrations, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Enterprise deployment at Decagon relies on pre-built connectors alongside a high-touch forward deployment
              engineering model. The platform integrates out-of-the-box with major customer relationship management
              systems including Salesforce and Zendesk, documentation stores such as Confluence, and enterprise
              telephony via SIP trunking and cloud voice platforms. Decagon does not offer self-serve onboarding for
              small businesses, focusing instead on high-volume enterprises that require tailored technical
              architectures. To scale implementations without unsustainable operational bottlenecks, Decagon split its
              delivery organization into specialized agent builders who configure workflows within the user interface
              and agent software engineers who interface directly with enterprise engineering teams. Decagon enforces a
              'custom becomes self-serve' product philosophy, where custom connectors and bespoke procedural logic built
              for initial customer deployments are systematically re-architected and upstreamed into core platform
              capabilities.
            claimRefs:
              - CE006
              - CE007
              - CE009
              - CE010
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE003
              - CE007
              - CE008
      - number: '5.4'
        title: Trust, Safety, Security, and Governance Controls
        blocks:
          - type: paragraph
            body: >-
              Because Decagon's agents possess write access to enterprise backends to process refunds and credential
              resets, trust and security guardrails are central to platform architecture. Decagon incorporates a
              dedicated supervisor model that monitors live customer dialogues in real time to detect hallucinations,
              policy drift, or prompt injection attacks before consequential actions are executed. Post-conversation
              quality assurance is managed by Watchtower, which automatically audits completed interactions against
              brand guidelines and flags policy violations for human review. From an infrastructure perspective, Decagon
              integrates with Git version control, giving technical teams deterministic auditability, code review
              workflows, and instant rollback capabilities for all Agent Operating Procedures. Furthermore, the platform
              maintains SOC 2 compliance, offers enterprise data residency options, and enforces zero data retention
              policies when querying private knowledge bases.
            claimRefs:
              - CE003
              - CE008
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Natural-Language AOPs as an Abstraction Layer
            body: >-
              Decagon's primary architectural innovation is decoupling workflow authoring from low-level software
              engineering. By compiling natural-language Agent Operating Procedures directly into code-backed execution
              paths with Git versioning, Decagon allows non-technical CX domain specialists to build and iterate on
              procedures while engineering teams maintain control over API boundaries, parameters, and enterprise
              security guardrails.
            calloutType: insight
            claimRefs:
              - CE001
              - CE006
              - CE011
          - type: callout
            title: Forward Deployment Burden in Enterprise Customization
            body: >-
              While Decagon emphasizes a 'custom becomes self-serve' product philosophy, enterprise deployments across
              Fortune 500 accounts still require substantial forward deployment engineering to tailor agent brains, map
              complex backend endpoints, and handle vertical-specific business logic. Scaling from 50 to 500 employees
              reflects the operational heaviness inherent in enterprise CX transformation before self-serve parity is
              achieved.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target Enterprise Customer Segments and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Decagon targets enterprise customer experience leaders, chief operating officers, and support operations
              executives who manage high-volume customer interaction centers. The company's primary customer base
              concentrates in digital-first consumer technology, mobile fintech, and high-growth software-as-a-service
              providers facing severe customer support cost pressure. Across these accounts, customer interactions are
              heavily transactional, involving high-frequency workflows such as account credential resets, order
              tracking, subscription cancellations, and refund processing. For enterprise buyers at organizations like
              Notion, Duolingo, and Rippling, Decagon's core value proposition centers on replacing outsourced business
              process labor with autonomous artificial intelligence agents. However, targeting enterprise buyers
              requires custom engineering involvement to connect internal databases and application programming
              interfaces, creating procurement friction that prevents self-serve adoption by small and mid-sized
              businesses.
            claimRefs:
              - CU001
