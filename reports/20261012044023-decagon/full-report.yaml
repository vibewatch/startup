              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Autonomous Action Liability at the Long Tail
            body: >-
              Because Decagon agents execute real write actions like issuing refunds and modifying subscriptions across
              enterprise CRMs, edge-case routing failures pose direct financial and regulatory liability if guardrails
              fail.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR013
          - type: callout
            title: Dual-Software Cost Burden and Pricing Opacity
            body: >-
              Decagon overlays existing helpdesk licenses rather than displacing Zendesk or Salesforce, adding
              mid-six-figure software fees with usage-based volatility that complicates enterprise budget forecasting.
            calloutType: insight
            claimRefs:
              - CR006
