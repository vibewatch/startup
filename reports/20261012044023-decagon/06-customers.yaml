  data:
    items:
    - label: Initial Procurement & Evaluation
      stage: Evaluation
      actor: VP of Customer Experience / Operations
      description: Enterprise identifies support headcount inflation and evaluates Decagon against legacy rule-based chatbots.
      touchpoints:
      - Executive sales demo and ROI assessment
      - Security and compliance review
      - Agent Operating Procedure workflow definition
    - label: API Integration & Knowledge Grounding
      stage: Onboarding
      actor: Enterprise Engineering & CX Leads
      description: Engineers connect CRM and backend APIs while CX managers configure domain-specific workflows in natural
        language.
      touchpoints:
      - Zendesk and Salesforce CRM connectors
      - Internal database and API mapping
      - Watchtower pre-deployment testing
    - label: Tier-1 Digital Channel Deflection
      stage: Initial Deployment
      actor: End Customers & AI Agent
      description: Decagon goes live on web chat and email, handling high-volume repetitive queries such as password resets
        and refunds.
      touchpoints:
      - Autonomous web chat widget
      - Inbound email triage
      - Transactional refund execution
    - label: Voice Channel Activation
      stage: Cross-Channel Expansion
      actor: Phone Callers & Voice Agent
      description: Enterprise activates Decagon Voice with speech models and cross-channel context memory for complex phone
        calls.
      touchpoints:
      - Inbound telephony IVR integration
      - Real-time speech synthesis via Chord
      - Cross-channel conversation memory
    - label: Decagon Assist Copilot Deployment
      stage: Human-in-the-Loop Assist
      actor: Human Support Representatives
      description: Organization deploys Decagon Assist to human agents for automated call summaries and recommended CRM actions.
      touchpoints:
      - In-console CRM sidebar
      - Automated ticket summarization
      - One-click workflow action suggestions
    - label: Platform Lock-in & Enterprise Renewal
      stage: Retention & Expansion
      actor: CX Leadership & Procurement
      description: Deep API integrations and proprietary AOP business rules create high switching barriers at annual contract
        renewal.
      touchpoints:
      - Quarterly business reviews
      - Annual contract renewal negotiation
      - Expansion into international locales
callouts:
- calloutType: strength
  title: High-Impact Deflection in Repetitive Consumer Workflows
  body: Decagon has demonstrated exceptional efficiency gains in consumer-facing digital platforms like ClassPass and Bilt
    Rewards, driving 50% to 95% reductions in support costs by automating structured, high-frequency transactions.
  claimRefs:
  - CU004
  - CU005
- calloutType: risk
  title: Operational Disconnect from Workforce Management and Real-Time Staffing
  body: A critical operational vulnerability is Decagon's lack of native integration with enterprise workforce management
    systems. Without real-time synchronization between AI deflection and human shift scheduling, surges in escalated tickets
    create unexpected queues and service-level agreement breaches.
  claimRefs:
  - CU009
  - CU010
