callouts:
- calloutType: insight
  title: Valuation Velocity Outpaces Disclosed Fundamentals
  body: Decagon tripled its post-money valuation from $1.5 billion in June 2025 to $4.5 billion in January 2026 in under seven
    months, driven by rapid enterprise contract adoption across brands like Avis Budget Group and Block. However, the company
    does not disclose audited recurring revenue, leaving the multiple bridge heavily reliant on unverified third-party revenue
    estimates.
  claimRefs:
  - CO005
  - CO007
  - CO012
- calloutType: risk
  title: Enterprise Pricing Opacity and Resolution Risk
  body: Decagon enforces a $50,000 annual platform fee and defaults to per-conversation pricing, where enterprises pay for
    every interaction regardless of whether the AI successfully resolves the issue. For customers experiencing lower resolution
    rates, this creates ongoing cost friction alongside third-party median contract commitments of approximately $386,000.
  claimRefs:
  - CO009
  - CO010
