  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 从公开证据到继续研究决策的定性路径，不暗示权重或概率。
    data:
      nodes:
        - id: enterprise-adoption
          label: 企业采用
          detail: 据 Bloomberg 报道，过去一年新增了超过 100 家企业客户。
        - id: product-expansion
          label: 产品扩展
          detail: 公司材料显示，自动化工作流加入了人工坐席辅助。
        - id: financing-reference
          label: $4.5B 融资参照
          detail: 1 月 D 轮融资与 3 月要约收购采用了同一项据报道的估值口径。
        - id: denominator-gap
          label: 经营口径缺口
          detail: 年化收入尚未被确认为 ARR，且无法获得准确的经常性收入构成。
        - id: economics-and-terms-gap
          label: 经济性与条款缺口
          detail: 利润率、留存、持股情况和优先权条款仍未披露。
        - id: research-more
          label: 继续研究
          detail: 在确定入场价格前，必须取得非公开运营和安全证据。
