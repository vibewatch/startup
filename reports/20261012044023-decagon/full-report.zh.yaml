      - number: '1.3'
        title: 资本化、投资者联盟与商业定价
        blocks:
          - type: paragraph
            body: >-
              Decagon 的资本轨迹显示出企业对话式 AI 领域的强劲势头。公司于 2024 年 6 月结束隐身运营，并在 2025 年 6 月由 Andreessen Horowitz 和 Accel 共同领投的
              $131 million Series C 轮融资中达到 $1.5 billion 估值。2026 年 1 月，Coatue Management 和 Index Ventures 共同领投 $250
              million Series D 融资，使投后估值在七个月内增至 $4.5 billion，累计股权融资约 $481 million。投资者联盟还包括 Bain Capital Ventures
              等知名风险投资机构，以及战略企业伙伴 T.Capital（Deutsche Telekom 的风险投资部门）。商业上，Decagon 面向中大型企业，定制合同要求在使用量费用之外先支付 $50,000
              的年度基础平台费。第三方市场采购数据显示，年度合同中位数约为 $386,000，说明其高进入门槛定价把 Decagon 定位在企业市场的高端。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO009
              - CO010
              - CO013
