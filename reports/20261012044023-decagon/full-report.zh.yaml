  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与支出分类
        blocks:
          - type: paragraph
            body: >-
              客户体验（CX）自动化软件市场正从脚本式分流机器人和配置繁重的 CRM 模块，结构性转向自主解决平台。在这一演变中，Decagon 将可触达边界定义为覆盖语音、聊天、邮件和 SMS 界面的企业 AI
              客服。现代智能体架构与传统对话式软件的根本差异在于执行能力：自主平台不只是调取知识文章交给人工客服审核，而是用自然语言流程通过企业 API
              执行后端交易，包括退款处理、账户更新和订阅修改。市场需求来自三个运营细分：企业替换传统交互式语音应答（IVR）和脚本式路由引擎、组织首次引入自动化客服，以及工程团队放弃内部自建项目并转向专用平台。调研部署数据显示，Decagon
              的实施中 53% 替换传统 IVR、工单附加组件或 CRM 机器人，33% 属于从零开始的自动化，14% 替换内部工程自建系统。但商业类别边界仍然有限：Decagon 软件只是承接对话的智能交互层，不会替换
              Salesforce 或 Zendesk 等底层帮助台或 CRM 记录系统。因此，企业软件支出是叠加项，而不是完全替代帮助台订阅费用，采购团队必须用劳动力成本下降或解决速度提升来证明这笔投资合理。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
      - number: '2.2'
        title: 市场规模、可触达机会与测算视角
        blocks:
          - type: paragraph
            body: >-
              评估自主客户体验平台的可触达市场，必须把自上而下的行业预测与现实的软件可服务市场边界分开。宏观行业预测展现出强劲顺风：Grand View Research 预计全球 AI 智能体市场将在 2026 年超过
              $10.9 billion，较 2025 年约 $7.6 billion 扩大，年增长率超过 45%；BCC Research 预计更广泛的行业支出到 2030 年将达到 $48.3
              billion。从宏观劳动力看，Gartner 估计，对话式和智能体 AI 将在全球客服中心消除或自动化 $80 billion 的劳动力支出，约 10%
              的客户互动无需人工介入即可自动化。把这种宏观劳动力套利转化为直接软件支出后，可服务市场会小得多。Decagon
              的高人工介入部署模式、六位数级别的最低年度承诺以及企业集成要求，使其短期触达范围集中在高支持量的消费者企业和 B2B 企业。经验证的市场采购数据表明，年度合同价值中位数为 $432,750，已签署企业协议范围为
              $105,000 至 $923,183。假设全球有约 15,000 至 25,000 家大型企业，每月处理数万次覆盖电信、金融服务、医疗保健和零售的复杂客服互动，则可服务软件市场约为 $6.5 billion 至
              $10.8 billion。长期软件扩张取决于供应商能否在不按比例增加前置部署实施人员的情况下渗透中端市场。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM007
              - CM008
