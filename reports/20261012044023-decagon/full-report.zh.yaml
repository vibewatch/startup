  - id: FM001
    title: 企业 AI 客户服务可触达市场规模金字塔
    type: pyramid
    summary: 分层规模结构，将宏观的联络中心劳动力池与专业企业软件支出连接起来。
    data:
      items:
        - label: 全球联络中心劳动力池（$80B）
          detail: 全球企业支持中心的宏观工资与外包支出。
          value: 80000
          unit: USD M
          tone: neutral
        - label: AI 软件智能体总市场（$10.9B）
          detail: 预计 2026 年全球企业在任务型自主软件智能体上的支出。
          value: 10900
          unit: USD M
          tone: positive
        - label: 可服务企业 AI 支持 SAM（$8.5B）
          detail: 全球高用量组织可触达的企业客户体验软件支出。
          value: 8500
          unit: USD M
          tone: opportunity
        - label: 高用量企业细分市场（$3.5B）
          detail: 每月处理 >50,000 次对话、需要多系统 API 编排的组织。
          value: 3500
          unit: USD M
          tone: positive
        - label: 近期高用量目标 SOM（$1.5B）
          detail: 近期可获取的客户池，即采用专业 AI 智能体平台的技术领先企业。
          value: 1500
          unit: USD M
          tone: positive
        - label: Decagon 当前企业客户突破口（$250M）
          detail: 现有旅游、金融科技、零售和技术领先客户队列中的近期可触达扩张空间。
          value: 250
          unit: USD M
          tone: positive
    approximationNotes: 劳动力池采用 Gartner 对 $80B 可触达呼叫中心劳动力节省额的预测；软件 SAM/SOM 根据企业客户数，并结合观察到的合同价值分布推导。
    claimRefs:
      - CM007
      - CM010
      - CM012
      - CM013
