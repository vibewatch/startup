  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报区间
      - 概率信号
      - 下行触发条件或尽调测试
    rows:
      - - 乐观
        - 据报道的 $100M+ 年化收入经核对后属于经常性收入；留存和贡献毛利强劲；产品扩张推动高效增长。
        - 高于 $4.5B 融资参考价；公开信息不支持精确区间和目标回报。
        - 只有获得经审计的经常性收入、利润率和队列证据后，概率信号才会增强。
        - 如果 ARR 桥接或续约队列无法验证收入运行率叙事，情景就会失效。
      - - 基准
        - 客户和产品势头延续，但收入质量、利润率和融资条款仍未披露。
        - 处于或低于 $4.5B 参考价；没有标准化经济数据就无法确定精确区间。
        - 当前公开证据最直接支持继续观察，而不是按价格入场。
        - 需要更低的入场价格，或完整的私下财务与股权结构材料包。
      - - 悲观
        - 年化收入包含非经常性或低毛利活动，留存走弱，或优先权条款挤压普通股权益。
        - 显著低于 $4.5B 参考价；没有证券条款就无法量化损失幅度。
        - 如果队列留存、贡献毛利或续约集中度未达到投资判断阈值，概率会上升。
        - ARR 核对失败、利润率疲弱、流失集中或惩罚性优先权条款都会触发该情景。
    notes: 情景区间是相对于 2026 年 1 月投后参考价的定性判断；由于保留证据不足以支持，概率、终值倍数和回报率被有意省略。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV008
      - CV013
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间展示 Decagon 自 2023 年 8 月成立以来，经历 D 轮融资并扩展企业平台的过程。
    approximationNotes: null
    data:
      items:
        - label: 公司成立
          date: 2023-08
          detail: Jesse Zhang 与 Ashwin Sreenivas 在旧金山创立 Decagon，开发 AI 客户服务智能体。
          tone: positive
          claimRefs:
            - CO001
        - label: 隐身期亮相
          date: 2024-06
          detail: Decagon 结束隐身期，带着首轮融资和 Agent Operating Procedures 平台亮相。
          tone: positive
          claimRefs:
            - CO001
            - CO004
        - label: B 轮估值
          date: 2024-10
          detail: 随着金融科技和零售领域的企业采用增长，公司估值达到 $650M。
          tone: positive
          claimRefs:
            - CO005
        - label: 语音支持上线
          date: 2025-02
          detail: Decagon 与 ElevenLabs 合作推出全渠道 Voice，支持实时电话通话。
          tone: positive
          claimRefs:
            - CO004
        - label: C 轮融资
          date: 2025-06
          detail: 公司完成 $131M C 轮融资，由 a16z 与 Accel 联合领投，估值 $1.5B。
          tone: positive
          claimRefs:
            - CO006
        - label: Deutsche Telekom 合作
          date: 2025-11
          detail: 公司宣布与 T.Capital 开展企业商业试点及战略投资合作。
