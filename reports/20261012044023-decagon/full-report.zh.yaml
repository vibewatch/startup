  - id: FE001
    title: Decagon AI 客户体验架构栈
    type: stack
    summary: 六层架构栈，展示 Decagon 从全渠道接入、意图路由到 AOP 执行和企业治理的系统设计。
    data:
      layers:
        - label: 全渠道接入与体验
          detail: 统一接入层管理实时语音、聊天、邮件和 SMS 会话，并保留跨渠道对话记忆。
        - label: 对话 Copilot 与人工辅助
          detail: Decagon Assist 界面在 CRM 控制台内提供自动对话摘要、行动建议和知识检索。
        - label: 意图处理与路由引擎
          detail: 上下文意图解析管线评估对话历史，将咨询路由至匹配的 AOP，或回退至 RAG。
        - label: Agent Operating Procedure（AOP）执行
          detail: 确定性执行引擎，逐步运行由自然语言编译成代码的业务逻辑。
        - label: 集成与工具编排
          detail: 双向连接器对接 Salesforce、Zendesk、内部 REST API 和数据库端点，以完成交易型任务。
        - label: 信任、安全与治理
          detail: 监督模型监控实时对话，Watchtower 自动执行交互后质检，并以 Git 支持版本控制。
    approximationNotes: 架构拆解综合自 Decagon 官方平台文档和独立工程分析。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE005
      - CE007
      - CE008
  - id: FU001
    title: Decagon 企业客户旅程与扩张图
    type: journey-map
    summary: 展示企业客户从初始数字工单分流，到部署多渠道语音和人工智能体 Copilot 的生命周期。
    approximationNotes: 综合已发布的客户部署案例（Chime、ClassPass、Notion、Aura）及产品平台架构。
    claimRefs:
      - CU001
      - CU003
      - CU005
      - CU011
    data:
      items:
        - label: 初始采购与评估
          stage: 评估
          actor: 客户体验 / 运营副总裁
          description: 企业发现支持团队人数膨胀，并将 Decagon 与传统规则型聊天机器人比较评估。
          touchpoints:
            - 高管销售演示与 ROI 评估
            - 安全与合规审查
            - Agent Operating Procedure 工作流定义
        - label: API 集成与知识落地
          stage: 上线
          actor: 企业工程与客户体验负责人
          description: 工程师连接 CRM 和后端 API，客户体验经理则用自然语言配置领域工作流。
          touchpoints:
            - Zendesk 与 Salesforce CRM 连接器
            - 内部数据库与 API 映射
            - Watchtower 部署前测试
        - label: 一级数字渠道分流
          stage: 初始部署
          actor: 终端客户与 AI 智能体
          description: Decagon 在网页聊天和邮件渠道上线，处理密码重置、退款等高频重复咨询。
          touchpoints:
            - 自主网页聊天组件
            - 入站邮件分流
            - 交易型退款执行
        - label: 语音渠道启用
          stage: 跨渠道扩张
          actor: 来电者与语音智能体
          description: 企业启用 Decagon Voice，借助语音模型和跨渠道上下文记忆处理复杂电话。
          touchpoints:
            - 入站电话 IVR 集成
            - 通过 Chord 实现实时语音合成
            - 跨渠道对话记忆
        - label: Decagon Assist Copilot 部署
          stage: 人工参与式辅助
          actor: 人工支持代表
          description: 组织向人工坐席部署 Decagon Assist，提供自动通话摘要和 CRM 操作建议。
          touchpoints:
            - 控制台内 CRM 侧边栏
            - 自动工单摘要
            - 一键式工作流操作建议
        - label: 平台锁定与企业续约
          stage: 留存与扩张
          actor: 客户体验负责人及采购团队
          description: 深度 API 集成和自研 AOP 业务规则在年度合同续约时形成较高切换壁垒。
          touchpoints:
            - 季度业务回顾
            - 年度合同续约谈判
            - 扩展至国际地区
