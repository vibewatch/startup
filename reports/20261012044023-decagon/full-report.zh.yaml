              - CM010
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM007
              - CM010
              - CM012
              - CM013
      - number: '2.3'
        title: 买方细分、预算归属与采购动态
        blocks:
          - type: paragraph
            body: >-
              企业采购智能体客服平台涉及跨职能利益相关方，包括客户体验运营、客服中心领导层和企业 IT 工程团队。Chief Customer Officer 和 Support
              副总裁会根据客户满意度（CSAT）、首次接触解决率和处理时长下降来评估方案；技术团队则掌握 API 集成可行性、身份验证安全和运行时护栏。把运营工作流与技术集成拆开的平台，可以让 CX 团队通过自然语言
              Agent Operating Procedures（AOP）起草逻辑，同时由工程师落实护栏和版本管理，相比纯代码密集型 SDK 实施更快完成概念验证。尽管运营归属通常在 CX
              负责人手中，预算权限往往取决于客服中心劳动力替代，而不是软件创新分配。行业正在从传统按席位许可转向按使用量计费，形式包括固定对话费率或按结果收取的每次解决费用。买方表示，这类定价会显著改变采用经济性：按解决计价把财务失效风险转给供应商，按对话计费则带来可预测的月度支出曲线，但即使互动最终升级给人工客服，也照样收费。采购评估通常要求先试点并证明可量化的投资回报，供应商必须在批准全面企业推广前证明分流率超过
              70%。
            claimRefs:
              - CM002
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM012
              - CM014
              - CM015
      - number: '2.4'
        title: 结构性增长动力与企业采用约束
        blocks:
          - type: paragraph
            body: >-
              自主客服软件的采用，靠持续加剧的劳动力压力以及多模态语音和推理模型的快速进步推动。客服中心历来面临超过 30%
              的年度客服人员流失率，日常咨询因此带来高昂的入职和培训成本。同时，对话语音模型快速成熟，例如支持打断处理、覆盖超过 70
              种语言检测的低延迟双工语音架构，使企业能够自动化过去只能由人工客服处理的复杂电话流程。另一方面，监管严格、风险厌恶型企业中的多项实质性约束会压低部署速度。安全与合规要求严格控制，包括 SOC 2 Type II
              认证、与前沿模型供应商签订零数据留存协议，以及防止模型在金融或医疗交易中产生幻觉的护栏。实施摩擦仍是关键瓶颈：尽管市场宣传声称可以即时自助迭代，企业部署仍需与自有计费引擎和工单工具深度集成，通常还要配备专门的内部产品经理和托管实施团队。此外，供应商锁定风险，以及
              Salesforce Service Cloud 或 Zendesk 等现有记录系统可能进行的平台捆绑，也会持续拖累独立自动化层。
            claimRefs:
              - CM001
              - CM008
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 案例与图表
        blocks:
          - type: callout
            title: 叠加式技术栈经济性限制纯软件替代
            body: 自主 AI 智能体充当编排和交互前端，而不是帮助台数据库，因此企业买方仍必须保留底层 CRM 许可证。这套商业逻辑完全依靠抵消客服中心劳动力成本、扩大支持能力，而不是消除传统软件的席位费用。
            calloutType: insight
            claimRefs:
              - CM006
              - CM008
          - type: callout
            title: 结果导向计费的商业定义存在歧义
            body: 按使用量和按解决计费的模式虽然能让激励与客服分流保持一致，但“成功解决”与“放弃咨询”的定义含糊，会给企业合同对账和预测带来摩擦。
            calloutType: risk
            claimRefs:
              - CM013
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与直接企业替代方案
        blocks:
          - type: paragraph
            body: >-
              Decagon 所处的企业 AI 客户体验市场正在快速集中，买方会把自主解决平台与新兴的风险投资支持型同业及根深蒂固的 CRM 现有企业比较。最直接的正面竞争对手是 Sierra；该公司凭借
              Sonos、Casper、WeightWatchers、Discord 和 Rivian 等标杆部署，在 2026 年初达到同样的 $4.5 billion
              私有估值。两家供应商都要求六位数级别的年度合同，争夺大型企业客服预算。但两者的底层理念明显不同：Decagon 提供 Agent Operating Procedure 框架，服务于希望精细控制后端集成的技术型
              CX 团队；Sierra 则提供由前置部署工程师支持的端到端托管服务。除 Sierra 外，Helpshift 等相邻专业平台在游戏和互动娱乐领域承接垂直客服；Voiceflow
              等开放式智能体构建器则让工程团队自行搭建和维护内部智能体架构，而不必把对话智能外包给第三方托管供应商。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP013
              - CP014
