chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与 AI Concierge 模式
        blocks:
          - type: paragraph
            body: >-
              Decagon 由 Jesse Zhang 和 Ashwin Sreenivas 于 2023 年 8 月在旧金山创立，目标是为企业部署自主 AI 客服智能体。公司把自己定位为“AI
              礼宾”平台：通过端到端执行客户问题解决流程，超越传统规则式聊天机器人和 CRM 路由系统。其运营模式的核心是自研 Agent Operating
              Procedures（AOP），把业务层面的自然语言指令编译成可确定执行、并接入企业 API、数据库和记录系统的代码。Decagon 用自适应智能体执行替代僵化决策树，覆盖聊天、语音、邮件和 SMS
              的高并发客服需求，同时保留企业级护栏。公司在激进扩张资本后已进入 Series D 阶段，总部位于加州，客户包括主要数字原生品牌和成熟的 Fortune 500 企业。
            claimRefs:
              - CO001
              - CO004
              - CO005
          - type: table
            tableRef: TO001
            claimRefs:
              - CO005
              - CO007
              - CO008
              - CO009
              - CO010
              - CO012
      - number: '1.2'
        title: 创始人、管理团队与治理
        blocks:
          - type: paragraph
            body: >-
              Decagon 由联合创始人 Jesse Zhang（Chief Executive Officer）和 Ashwin Sreenivas（President）领导；两人在 2023
              年一次投资人创始人闭门会上构想了这家公司。两位高管都具备很强的创始人与市场匹配度，经验来自此前的创业退出和技术运营工作。Zhang 曾创办游戏剪辑分享应用 Lowkey，该公司于 2021 年被 Niantic
              收购，为他积累了大规模消费产品的经验。Sreenivas 此前共同创办计算机视觉平台 Helia，该公司于 2020 年被 Scale AI 收购；之后他在 Palantir 担任前置部署工程师。这些经历直接影响
              Decagon 的部署方法：公司让专门的 Agent 产品经理和前置部署工程师与企业客户协作。为加速企业采用，Decagon 到 2026 年初已把组织规模扩展至 300
              多名员工，分布在旧金山、纽约和伦敦。但正式董事会构成、独立董事安排以及创始人投票控制机制仍属私有信息，尚未披露。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
          - type: table
