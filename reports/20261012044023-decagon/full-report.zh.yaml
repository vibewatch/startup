      - number: '3.2'
        title: 架构差异：AOP 与托管及平台服务
        blocks:
          - type: paragraph
            body: >-
              现代 AI 客服平台的竞争边界，核心在于自主解决还是传统分流。传统聊天机器人和早期对话组件把用户导向静态帮助中心文档，只能分流来询；Decagon 和 Sierra
              则会执行支付退款、订单修改、账户取消等多步骤后端操作。Decagon 的架构优势来自 Agent Operating Procedures：客户体验和工程团队可以用自然语言编写业务逻辑，同时为企业数据库和 API
              维护确定性的集成护栏。相比之下，Sierra 在语音成熟度上更占优势，语音延迟更低，品牌声音克隆也更成熟；Decagon 的语音基础设施则是 2026 年才扩展的新能力。Decagon 通过 Decagon
              Assist 覆盖人工介入流程，把 AI 副驾驶工具直接部署到 CRM 环境中的客服桌面，在升级处理时呈现工单摘要并建议下一步自动化操作。
