      - number: '1.4'
        title: 企业采用、产品里程碑与尽调重点
        blocks:
          - type: paragraph
            body: >-
              自商业化推出以来，Decagon 已在金融科技、旅行、医疗保健和电信等高要求企业行业快速扩张。2025 财年有超过 100 家全球企业客户加入平台，其中包括 Avis Budget
              Group、Block、Deutsche Telekom 和 Chime 等标杆客户。在运营案例中，Chime 记录显示，部署覆盖聊天和语音的全渠道客服后，客服中心运营成本下降 60%，同时 Net
              Promoter Score 翻倍。Decagon 还持续拓展产品触点：2025 年初推出由 ElevenLabs 驱动的 Voice 渠道，并于 2026 年 10 月推出 Decagon
              Assist，作为覆盖 Salesforce、Zendesk 和 Front 环境的原生 AI 副驾驶工具，服务人工客服。尽管收入端增长迅速，关键的投资判断缺口仍在：Decagon 没有发布经常性 ARR
              数据，第三方估计在 $12 million 至 $100 million 之间分歧很大，因此必须通过私有尽调确认已确认收入、客户集中度和推理毛利率。
