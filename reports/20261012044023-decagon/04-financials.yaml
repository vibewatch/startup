callouts:
- calloutType: risk
  title: High Contract Minimums and Algorithmic Resolution Friction
  body: Decagon's enterprise-first focus creates strong contract economics with a median annual contract value of $432,750,
    but the lack of transparent self-serve pricing and ambiguity around algorithmic resolution definitions pose friction for
    prospective customers. When buyers opt for resolution-based pricing, disputes over whether edge-case interactions were
    satisfactorily resolved can strain vendor relationships and make budgeting unpredictable.
  claimRefs:
  - CI001
  - CI002
  - CI004
- calloutType: insight
  title: Capital Sufficiency Against Steep Valuation Expectations
  body: With $250 million raised in its Series D round in January 2026 and roughly $480 million in cumulative capital, Decagon
    maintains substantial balance-sheet runway. However, the $4.5 billion valuation sets an exceptionally high performance
    hurdle, requiring rapid ARR expansion from the $30M–$44M range to triple-digit millions to justify current growth multiples.
  claimRefs:
  - CI005
  - CI006
  - CI007
