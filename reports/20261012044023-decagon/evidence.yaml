evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Recurring Revenue and Gross Margin Bridge
    missingEvidence: >-
      Audited 2026 ARR, recognized revenue, and gross margin figures isolating gross model inference and human
      engineering costs.
    whyItMatters: >-
      External revenue estimates diverge widely from $12M to $100M, making the $4.5B Series D multiple highly sensitive
      to underlying margins and net revenue retention.
    diligencePath: >-
      Request confidential trailing twelve-month income statement, customer-level billing cohorts, and compute/API COGS
      breakdown during management diligence.
    relatedQuestionRefs:
      - QO007
  - type: enumeration-incomplete
    severity: minor
    topic: Private Governance and Cap Table Breakdown
    missingEvidence: >-
      Detailed equity capitalization table, secondary transaction volumes, liquidation preferences, and formal board of
      directors roster.
    whyItMatters: >-
      Decagon's governance structure, founder control thresholds, and protective provisions remain private and
      unverified across external filings.
    diligencePath: Review certificate of incorporation, investor rights agreement, and voting agreements in the virtual data room.
    relatedTableRefs:
      - TO003
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: mid-market-tam-expansion
    missingEvidence: >-
      Granular breakdown of mid-market contract distribution and churn data for software contracts below $100,000 annual
      contract value.
    whyItMatters: >-
      Determines whether Decagon can expand beyond its six-figure enterprise base into lower annual contract value tiers
      without proportional professional service costs.
    diligencePath: >-
      Review sales cohort data, average sales cycle duration by customer revenue band, and self-serve onboarding roadmap
      disclosures.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: minor
    topic: resolution-rate-auditing
    missingEvidence: >-
      Third-party audited resolution rates across diverse customer cohorts compared to vendor-reported deflection
      metrics.
    whyItMatters: >-
      Vendor marketing conflates ticket deflection with true end-to-end task resolution, obscuring actual operational
      labor savings.
    diligencePath: >-
      Obtain blinded customer cohort escalation telemetry and human escalation transcripts across production
      deployments.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitive-displacement
    missingEvidence: >-
      Audited head-to-head win/loss rates, customer churn telemetry, and displacement data between Decagon and Sierra
      across enterprise accounts.
    whyItMatters: >-
      Without primary telemetry on competitive win/loss and displacement, defensibility claims rely on vendor-curated
      logos and competitor marketing.
    diligencePath: >-
      Request customer reference calls from joint Decagon-Sierra enterprise evaluations and analyze procurement win-rate
      records.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: revenue-traction
    missingEvidence: >-
      Audited recognized revenue and ARR reconciliation for fiscal years 2025 and 2026 to resolve wide discrepancies
      between Forbes, Sacra, and company-claimed annualized run rates.
    whyItMatters: >-
      Public valuation of $4.5 billion implies a revenue multiple exceeding 45x to 100x depending on whether Decagon
      generated $44M or $100M ARR, making underwriteability fragile without audited revenue schedules.
    diligencePath: >-
      Request audited GAAP financial statements, trailing twelve-month revenue by customer cohort, and current ARR
      schedule during management diligence.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Granular cloud and foundation model inference cost breakdown per conversation to determine true software gross
      margins versus services-heavy delivery costs.
    whyItMatters: >-
      Gross margin sustainability depends heavily on token consumption per voice/chat interaction, cloud hosting
      subsidies, and whether self-trained models achieve sub-30% COGS.
    diligencePath: >-
      Require contribution margin analysis by channel (voice vs. chat vs. email), model API expense logs, and Azure
      infrastructure billing reconciliations.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: model-architecture
    missingEvidence: >-
      Detailed technical disclosures regarding the base model architectures, training data provenance, parameter counts,
      and fine-tuning methodology for Decagon's self-trained CX models.
    whyItMatters: >-
      Without independent benchmarking or parameter disclosures, underwriting the claimed 80% self-trained model
      inference efficiency and cost structure remains subject to vendor self-reporting.
    diligencePath: >-
      Request private technical architecture whitepapers, inference cost logs per conversation, and model ablation
      benchmarks during technical diligence.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: forward-deployment
    missingEvidence: >-
      Audited metrics quantifying the engineering hours required per new enterprise deployment and the exact ratio of
      custom code to self-serve configuration across Fortune 500 clients.
    whyItMatters: >-
      Forward deployment engineering intensity directly impacts gross margins and service-delivery costs during rapid
      enterprise scaling.
    diligencePath: >-
      Examine forward deployment engineering timesheets, customer onboarding durations, and ticket escalation logs
      across enterprise cohorts.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-visibility
    missingEvidence: >-
      Audited enterprise net revenue retention (NRR), gross revenue retention (GRR), and multi-year cohort churn
      metrics.
    whyItMatters: >-
      Without disclosed cohort retention or expansion data, investors cannot verify whether Decagon's rapid top-line ARR
      growth is driven by durable recurring contracts or high-turnover initial deployments.
    diligencePath: >-
      Request historical quarterly cohort retention curves, gross churn percentages, and expansion ARR data under
      non-disclosure agreement during private diligence.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-coverage
    missingEvidence: >-
      Comprehensive roster of enterprise customer contracts, ACVs, and deployment scopes across the broader base of over
      100 enterprise accounts.
    whyItMatters: >-
      Public customer case studies highlight marquee successes (Chime, ClassPass, Bilt) but leave unmeasured the median
      deployment size, resolution rate, and satisfaction across the wider customer cohort.
    diligencePath: >-
      Review sanitized enterprise customer contract lists, median ARR per account, and broad cohort deployment summaries
      in a virtual data room.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-compliance
    missingEvidence: >-
      Audited SOC 2 Type II reports, HIPAA business associate agreement terms, and specific third-party penetration
      testing attestations for autonomous write-action execution.
    whyItMatters: >-
      Without independent security audits, enterprise buyers cannot independently verify whether Decagon's
      zero-retention policies and API token storage fully insulate enterprise backends from credential leakage or prompt
      injection attacks.
    diligencePath: Request unredacted SOC 2 Type II audit report and standard DPA/BAA rider during confidential technical diligence.
    relatedQuestionRefs:
      - QR001
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: sla-commitments
    missingEvidence: >-
      Official published SLA terms, contractual resolution rate commitments, and maximum voice latency guarantees across
      production tiers.
    whyItMatters: >-
      Decagon's competitors such as Notch publish explicit resolution milestones (30% in 90 days, 77% in 12 months),
      while Decagon keeps resolution rates and latency SLAs private and negotiated on a per-customer basis.
    diligencePath: >-
      Review executed customer order forms and master services agreements for contractual resolution warranties and
      downtime penalty clauses.
    relatedQuestionRefs:
      - QR003
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: revenue-and-unit-economics
    missingEvidence: >-
      A reconciled ARR-to-recognized-revenue bridge, recurring mix, gross margin after model and voice costs, cohort
      retention, customer concentration, burn, and cash balance.
    whyItMatters: >-
      These inputs determine whether the $4.5 billion reference has a defensible operating denominator and whether
      growth creates durable equity value.
    diligencePath: >-
      Request audited financial statements, monthly revenue bridges, cohort schedules, contract-level concentration,
      contribution-margin waterfalls, and current cash and burn data.
    relatedQuestionRefs:
      - QV002
      - QV003
      - QV008
  - type: private-evidence-only
    severity: material
    topic: capital-structure-and-liquidity
    missingEvidence: >-
      The fully diluted cap table, security classes, liquidation preferences, participation rights, anti-dilution terms,
      option pool, tender size, and primary-versus-secondary financing mix.
    whyItMatters: >-
      Headline funding and valuation do not reveal dilution, common-equity downside, cash available, or the return
      available to a new investor.
    diligencePath: >-
      Obtain the charter, capitalization table, financing documents, tender materials, debt schedule, and pro forma
      ownership model from company counsel.
    relatedQuestionRefs:
      - QV006
      - QV008
  - type: missing-source
    severity: material
    topic: comparable-valuations
    missingEvidence: >-
      Primary transaction documents and normalized revenue, growth, margin, and security data for a truly comparable
      private round or acquisition set.
    whyItMatters: >-
      Without like-for-like denominators and transaction terms, analyst comparisons cannot establish a reliable entry
      range or exit multiple.
    diligencePath: >-
      Build a transaction set from primary filings, buyer disclosures, financing documents, and management-verified
      operating metrics before assigning terminal multiples.
    relatedQuestionRefs:
      - QV004
