    - Telephony providers, WebSockets, SIP trunking, and CRM messaging APIs
    - Channel disconnection or API rate limits interrupting live conversations
  - - Query Processing & Intent Router
    - Extracts user intent, maintains conversational state, routes to matching AOP or RAG fallback
    - Natural language understanding models and conversational state store
    - Intent misclassification on ambiguous multi-topic inquiries
  - - Execution & Orchestration Engine
    - Executes procedural steps, calls external APIs, enforces parameters, and synchronizes backend state
    - Customer REST/GraphQL APIs, CRM integrations (Salesforce, Zendesk), and ERP backends
    - Downstream API timeouts, schema drift, or unhandled error payloads
  - - Governance & Safety Layer
    - Enforces runtime guardrails, supervisor model monitoring, PII zero-retention, and Watchtower QA
    - Dedicated supervisor inference endpoints and Git-backed audit logging
    - Supervisor latency overhead and false-positive escalation triggers
