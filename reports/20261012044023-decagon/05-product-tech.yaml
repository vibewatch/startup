  title: Product & Technology
  summary: Decagon delivers an enterprise AI customer experience platform powered by natural-language Agent Operating Procedures
    (AOPs), multi-stage intent routing, and the Decagon Assist human copilot. While its architecture demonstrates sophisticated
    execution guardrails and a disciplined forward deployment engineering model, long-term gross margins depend on successful
    transition of custom enterprise workflows into repeatable self-serve platform primitives.
sections:
- id: product-definition-and-customer-workflows
  title: Product Definition and Customer Workflows
  body: Decagon builds conversational artificial intelligence software designed to resolve complex enterprise customer support
    inquiries autonomously rather than simply deflecting tickets with static documentation links. The platform's foundational
    abstraction is the Agent Operating Procedure (AOP), which translates natural-language operating instructions drafted by
    customer experience teams into code-backed execution logic. By compiling business rules into structured execution paths,
    Decagon enables support operations managers to define triggers, validations, and escalation thresholds without requiring
    dedicated software engineering sprints for routine policy modifications. Through its companion Duet capability, the platform
    assists teams in drafting new procedures directly from plain-English descriptions or pre-existing standard operating documentation.
    For interactions requiring human empathy or judgment outside automated procedure scopes, Decagon Assist embeds directly
    within third-party CRM interfaces to provide human representatives with instant conversational summaries, recommended
    next actions, and contextual knowledge search.
  claimRefs:
  - CE001
  - CE005
  - CE011
  - CE012
  tableRefs:
  - TE001
  figureRefs: []
- id: system-architecture-and-query-pipeline
  title: System Architecture and Multi-Stage Query Pipeline
  body: Decagon's runtime query processing pipeline handles incoming customer messages through an orchestrated multi-stage
    sequence. When a message arrives across chat, voice, email, or SMS, the engine first parses the user's intent while evaluating
    conversational history across channels to preserve cross-session continuity. Next, the orchestration layer routes the
    parsed intent to an appropriate Agent Operating Procedure. If no active procedure matches the query, the architecture
    falls back to retrieval-augmented generation (RAG) to synthesize an accurate response from connected enterprise knowledge
    bases. Decagon reports that over 80% of its inference workload executes on proprietary self-trained models tuned specifically
    for customer experience accuracy, reducing reliance on general-purpose frontier commercial APIs. The system emphasizes
    transactional execution depth, coordinating backend API calls and data updates across billing, CRM, and authentication
    tools before returning structured confirmation to the customer.
  claimRefs:
  - CE002
  - CE004
  - CE007
  - CE012
  tableRefs:
  - TE002
  figureRefs:
  - FE001
- id: deployment-integrations-and-operating-model
  title: Deployment Mechanics, Integrations, and Operating Model
  body: Enterprise deployment at Decagon relies on pre-built connectors alongside a high-touch forward deployment engineering
    model. The platform integrates out-of-the-box with major customer relationship management systems including Salesforce
    and Zendesk, documentation stores such as Confluence, and enterprise telephony via SIP trunking and cloud voice platforms.
    Decagon does not offer self-serve onboarding for small businesses, focusing instead on high-volume enterprises that require
    tailored technical architectures. To scale implementations without unsustainable operational bottlenecks, Decagon split
    its delivery organization into specialized agent builders who configure workflows within the user interface and agent
    software engineers who interface directly with enterprise engineering teams. Decagon enforces a 'custom becomes self-serve'
    product philosophy, where custom connectors and bespoke procedural logic built for initial customer deployments are systematically
    re-architected and upstreamed into core platform capabilities.
  claimRefs:
  - CE006
  - CE007
  - CE009
  - CE010
  - CE013
  tableRefs:
  - TE003
  figureRefs: []
- id: trust-safety-security-and-governance
  title: Trust, Safety, Security, and Governance Controls
  body: Because Decagon's agents possess write access to enterprise backends to process refunds and credential resets, trust
    and security guardrails are central to platform architecture. Decagon incorporates a dedicated supervisor model that monitors
    live customer dialogues in real time to detect hallucinations, policy drift, or prompt injection attacks before consequential
    actions are executed. Post-conversation quality assurance is managed by Watchtower, which automatically audits completed
    interactions against brand guidelines and flags policy violations for human review. From an infrastructure perspective,
    Decagon integrates with Git version control, giving technical teams deterministic auditability, code review workflows,
    and instant rollback capabilities for all Agent Operating Procedures. Furthermore, the platform maintains SOC 2 compliance,
    offers enterprise data residency options, and enforces zero data retention policies when querying private knowledge bases.
  claimRefs:
  - CE003
  - CE008
  - CE014
  tableRefs: []
  figureRefs: []
