  rows:
  - - E-commerce order return or refund
    - Rep searches order database, checks return policy window, and triggers payment gateway refund
    - AOP autonomously verifies order status via API, executes refund, and issues customer confirmation
    - Instant resolution without human handle time or manual data re-entry
    - Edge-case policy ambiguities require escalation to retention teams
  - - Account security & password reset
    - Rep authenticates user via identity questions and triggers backend credential reset
    - Automated authentication verification and secure API integration for credential delivery
    - Deflects high-frequency repetitive inquiries from queue
    - Requires strict API scoping to prevent credential theft vectors
  - - Escalated complex customer inquiry
    - Rep spends 3-4 minutes reviewing ticket history, reading disparate notes, and searching knowledge base
    - Decagon Assist delivers structured conversation summary, recommended actions, and in-tool response drafts
    - Reduces average handle time and eliminates customer repetition
    - Rep must manually verify suggested actions on sensitive accounts
  - - Proactive customer outreach & notification
    - Outbound call centers manually dial customers for renewals, schedule updates, or payment reminders
    - Omnichannel proactive campaigns triggered via SMS, chat, or voice with cross-channel memory
    - Scales outbound engagement without proportional headcount increases
    - Subject to regional telecommunication regulations and carrier spam filtering
