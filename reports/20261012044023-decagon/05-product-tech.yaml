callouts:
- calloutType: insight
  title: Natural-Language AOPs as an Abstraction Layer
  body: Decagon's primary architectural innovation is decoupling workflow authoring from low-level software engineering. By
    compiling natural-language Agent Operating Procedures directly into code-backed execution paths with Git versioning, Decagon
    allows non-technical CX domain specialists to build and iterate on procedures while engineering teams maintain control
    over API boundaries, parameters, and enterprise security guardrails.
  claimRefs:
  - CE001
  - CE006
  - CE011
- calloutType: risk
  title: Forward Deployment Burden in Enterprise Customization
  body: While Decagon emphasizes a 'custom becomes self-serve' product philosophy, enterprise deployments across Fortune 500
    accounts still require substantial forward deployment engineering to tailor agent brains, map complex backend endpoints,
    and handle vertical-specific business logic. Scaling from 50 to 500 employees reflects the operational heaviness inherent
    in enterprise CX transformation before self-serve parity is achieved.
  claimRefs:
  - CE009
  - CE010
  - CE013
