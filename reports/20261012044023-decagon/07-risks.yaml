company:
  name: Decagon
chapter:
  number: 7
  title: Risks
  summary: Decagon's enterprise AI agent platform introduces significant operational and commercial risks, including execution
    vulnerabilities in complex multi-jurisdictional workflows, reliance on CRM/helpdesk integrations, and pricing opacity
    with high contract commitments.
sections:
- id: regulatory-and-compliance-risks
  title: Regulatory Compliance and Autonomous Authorization Risks
  body: Deploying autonomous agents with direct write access to enterprise backends introduces critical regulatory and compliance
    vulnerabilities. When Decagon agents handle financial inquiries, payment processing, or account modifications, any failure
    in deterministic guardrails risks violating consumer protection and privacy frameworks across jurisdictions. Decagon mitigates
    external agent intrusion risks through its Personal Agent Consent & Trust (PACT) protocol and dedicated Personal Agent
    Gateway, which establish granular OAuth 2.0 authorization scopes for external agents. Furthermore, Decagon Assist implements
    zero-data-retention security policies and human-in-the-loop copilot controls to prevent customer data exposure during
    edge-case escalations. However, independent third-party compliance audits remain essential to verify whether these controls
    withstand adversarial prompts and credential manipulation in live production environments.
  claimRefs:
  - CR001
  - CR008
  - CR009
  - CR013
  tableRefs:
  - TR001
- id: operational-and-reliability-risks
  title: Operational Execution, Voice Latency, and Edge-Case Vulnerabilities
  body: Decagon's core autonomy engine relies on Agent Operating Procedures (AOPs), where customer experience teams configure
    natural language instructions and code workflows. While AOPs excel in structured and predictable support flows, industry
    benchmarking highlights that they struggle when encountering long-tail edge cases, multi-state regulatory disclosures,
    and multi-system verification logic. In complex environments like fintech and healthcare, edge cases represent the core
    operational burden, meaning unhandled exceptions quickly spill over to human desks without achieving full resolution.
    On voice channels, Decagon deployed its Voice 3 duplex architecture to decouple low-latency speech synthesis from background
    reasoning, yet third-party evaluations and RFP analysis still note occasional voice latency and tooling degradations under
    peak production traffic.
  claimRefs:
  - CR003
  - CR005
  - CR011
  - CR012
  tableRefs:
  - TR002
- id: partner-and-architectural-dependencies
  title: Ecosystem Dependencies and Software Stack Friction
  body: Decagon's integration model presents structural architectural and software budget dependencies. The platform sits
    directly on top of established enterprise helpdesks like Zendesk and Salesforce rather than replacing them, creating a
    dual-software cost burden alongside ongoing connector maintenance obligations. Crucially, Decagon lacks standard pre-built
    connections for internal enterprise resource planning (ERP), human resources, and supply chain management systems, restricting
    its operational deployment primarily to front-office customer service. Additionally, while Decagon runs over 80% of its
    traffic on proprietary self-trained models to reduce generic LLM inference costs and latency, this internal model dependency
    concentrates model fine-tuning, regression testing, and hallucination guardrail maintenance entirely on Decagon's engineering
    organization.
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR010
  tableRefs:
  - TR003
- id: commercial-risks-and-monitoring-triggers
  title: Commercial Pricing Friction and Diligence Monitoring Indicators
  body: Decagon's commercial model creates distinct sales friction and budget forecasting challenges for enterprise buyers.
    The vendor does not publish list pricing or self-serve evaluation tiers, relying instead on custom sales proposals with
    usage-based conversation fees and high minimum annual spend commitments. Third-party procurement research observes mid-six-figure
    typical contract values with a median near $432,750, leaving prospective customers unable to forecast total cost of ownership
    accurately before vendor scoping. Furthermore, rollout velocity depends on forward-deployed engineers and dedicated internal
    platform owners to configure and tune AOP workflows. Investors must monitor key thesis-break triggers, including customer
    concentration among early tech-native adopters, escalating voice telephony charges, and unmitigated API execution errors.
  claimRefs:
  - CR006
  - CR007
  - CR014
  figureRefs:
  - FR001
