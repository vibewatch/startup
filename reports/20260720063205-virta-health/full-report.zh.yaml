        blocks:
          - type: paragraph
            body: >-
              运营风险集中在信任、劳动力和生态依赖，而不是工厂或库存。Virta 发布的控制强于许多创业公司：GCP 冗余、镜像数据、夜间备份、年度渗透测试、漏洞扫描和正式 SDLC，都显示流程设计成熟。但这些控制没有阻止
              2026 年事件，因此剩余执行风险仍高。第二个运营挑战是劳动强度。1000+ 员工规模和连续远程护理模型意味着，如果教练、临床医生和支持团队生产率不能随入组规模扩大，利润率会受损。最后，Virta
              依赖外部生态：Google Cloud 提供基础设施，PBM 和伙伴渠道负责分发，GLP-1
              政策环境影响部分肥胖工作流的相关性。这些依赖单独看都不致命，但合在一起会形成一个系统，让多个外部行动方比内部产品变化更快地改变 Virta 的风险画像。
