  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与变现
        blocks:
          - type: paragraph
            body: >-
              Virta 的财务故事始于一种更接近价值医疗合同、而非经典 SaaS
              或直接面向消费者订阅电商的商业模式。公司向雇主、健康险计划和相关渠道销售由机构出资的代谢护理项目，随后在会员参与并交付结果时确认收入。公开材料显示，这把伞下有多条收入流：糖尿病逆转、糖尿病管理、肥胖和减重，以及糖尿病前期支持。Sacra
              的 2024 年收入结构显示，糖尿病逆转仍是收入主力，但肥胖和减重项目已经成为有意义的贡献项。Virta 的定价披露格外重要，因为即使不披露标价，也透露了机制。2018 年模型把 100%
              费用置于风险之下，并明确拒绝 PMPM 和实施费；2025 年保证发布又加入 GLP-1 使用趋势和减重保证。组合起来看，变现高度依赖合同、按出资方定制，并紧贴可衡量表现，而不是开放式消费者订阅。
