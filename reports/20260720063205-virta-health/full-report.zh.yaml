      - number: '1.4'
        title: 规模、动能与待解问题
        blocks:
          - type: paragraph
            body: >-
              Virta 当前最有决策价值的信号是规模和动能。公司 2025 年 1 月宣布年化收入突破 $100 million，2025 年 9 月又称年化收入超过 $160 million，同比增速超过
              80%。同批发布把客户足迹放在约 550 家组织和超过 12 million 美国覆盖人群，招聘页则显示员工超过 1000 人。年报发布进一步给出更进取的疗效和经济性叙事，包括医疗支出节省超过 $1
              billion，以及心血管风险显著改善的说法。这些都是商业相关性的强信号，但概览层面仍有几个问题没解：当前董事会完整名单并未完全公开，不同追踪数据库的员工数噪音较大，公开股权结构图也仍不一致。投资人可以把
              Virta 视为一家规模化、快速增长且企业牵引可信的私营代谢护理公司；但在今天的公开市场语境下，它还不是完全透明、已具备充分披露条件的后期发行人。
