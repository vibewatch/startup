            body: >-
              Virta 的客户基础比「雇主福利」这个说法更宽。核心动作仍通过自保雇主和健康险计划展开，但审阅到的公开证据也显示 PBM
              相关渠道、导航伙伴、类似部落政府的实体和经纪影响力。这很重要，因为这个业务里的买方、使用者和支付方不是同一个人。出资方或伙伴决定覆盖项目，会员使用项目，节省或风险降低再回到出资组织。Virta
              自己的规模主张让客户基础顶部显得有分量：550 多家组织、超过 12 million 覆盖人群，以及超过 200 thousand 名接受治疗的会员。具名 logo
              组合也相当多元，覆盖零售、货运、高等教育、健康险计划、PBM、部落和伙伴分发场景，对应不同采购动作和部署假设。战略上，最有价值的细分仍像是大型自保雇主、承受 GLP-1
              成本压力的支付方人群，以及能一次聚合多个出资方的伙伴渠道。
