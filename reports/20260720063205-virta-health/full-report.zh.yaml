            body: >-
              Virta 的客户证据表面强于简单 logo 墙，但并不均匀。AutoZone 是最干净的案例，因为公司披露了明确的临床和减药结果，并把部署描述成运营项目，而不是测试。Old Dominion
              也是一个强雇主证据点，带有量化减重和减药结果。Mashantucket Pequot Tribal Nation
              则提供了更少见的公开式部署，并呈现多年药费节省。在支付方和伙伴侧，Quartz、U-Haul、Navitus、Capital Rx 和 Accolade 显示，Virta 越来越通过肥胖、PBM
              和导航渠道部署。缺点是，并非每个具名界面都同样严谨。有些页面更强调准入和合作，而不是硬使用率或续约指标。结果是，这组客户证据清楚显示真实采用和渠道宽度扩张，但客户基础中的大部分仍只由公司汇总口径和公开材料中细节较少的伙伴引用代表。
