        title: 资本充足性与财务判断
        blocks:
          - type: paragraph
            body: >-
              最难的财务问题是资本充足性，因为公开证据恰好在承销最需要的地方最弱。最后一个干净的新股融资标记仍是 2021 年 4 月 Series E：融资 $133 million，估值 $2
              billion。此后，公开来源支持收入持续增长和一些老股市场兴趣，但没有披露现金、烧钱速度、现金跑道、债务或契约余量。Business Insider 2025 年报道 Virta 正推进盈利能力和最终 IPO
              准备，方向上令人鼓舞，但不能替代资产负债表。因此，实际判断是混合的。由机构付费的合同、业绩挂钩经济和出资方黏性，很可能提升收入质量。如果经纪、PBM
              和伙伴渠道降低获客成本，同时护理团队生产率上升，利润率路径也可能改善。但没有私有财务材料，这些都无法确认。从尽调角度看，Virta 在增长和变现设计上有吸引力，但利润率和流动性披露仍严重不足。
