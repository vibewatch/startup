      - number: '8.3'
        title: 关键价值驱动与风险
        blocks:
          - type: paragraph
            body: >-
              Virta 的溢价逻辑落在三件公开市场仍会奖励、前提是真实存在的事情上：临床差异化、买方 ROI 和合同对齐。作为私营数字健康公司，Virta
              拥有少见的深度同行评审证据，覆盖早期糖尿病逆转数据、疫情期间减重耐久性、GLP-1 停用支持，以及相较常规护理的两年肾功能改善。它的商业模型也有真实质量信号：Virta 长期强调把费用置于风险之下、避免简单
              PMPM 逻辑，最近又为买方保证 0% GLP-1 使用增长和基于理赔的 ROI。这些都是有意义的价值驱动，因为雇主正直接承受肥胖药支出压力。但同一环境也制造了核心风险。Mercer、KFF 和
              Peterson-KFF 都显示，许多雇主并没有拥抱开放式 GLP-1 覆盖；他们改用教练要求、预授权，甚至福利回撤来控制支出。这有助于 Virta
              把自己定位为成本控制伙伴，但也可能缩小可变现池子，并加剧采购审查。另一项主要风险是披露。公开来源仍无法确认经审计收入、现金跑道、续约数学或完整股权结构表包袱，这意味着如果买方把 Virta
              更像一项有前景但不透明的服务资产、而不是已充分承销的增长复利资产，估值就可能迅速压缩。
