companyProfile:
  summary: >-
    Virta Health 是一家 2014 年成立、现总部位于 Denver 的私营数字健康公司，向出资方销售虚拟代谢护理，覆盖 2
    型糖尿病、肥胖、糖尿病前期及相关慢病流程。它的公开叙事把低碳水营养方案、连续远程临床支持和结果导向合同模型结合起来，面向雇主、健康险计划以及其他承担风险的买方。作为后期私营健康科技公司，Virta 拥有少见的深度同行评审证据；公司称
    2025 年 9 月年化收入突破 $160 million，服务 550+ 家组织、覆盖 12M+ 人群，但经审计利润率、留存和当前股权结构表披露仍很少。
