      - number: '2.4'
        title: 约束、政策与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              约束几乎和顺风同样重要。雇主对 GLP-1 管理确有需求，但 CNBC 和 Peterson-KFF 都指出，覆盖扩张仍然选择性很强。这意味着 Virta
              面对的是痛点明显、但买方谨慎的市场。会员依从性和激活仍是另一个结构性瓶颈：代谢疾病人群庞大，并不保证项目能持续参与。政策也有双刃剑，尤其是很多买方还没有肥胖药覆盖、减停药或长期出资的内部规则。Medicare 在
              2026 年 7 月为部分减重 GLP-1 提供过渡覆盖，提升了药物管理服务的重要性，但也会吸引更多临床整合型竞争者，并不自动为 Virta 创造可报销收入。本章结论是，Virta
              的市场大、在增长且时点合适，但最好把它框定为受约束的企业和支付方预算问题，而不是无限制的数字健康 TAM。未完成的工作，是把患病率转化为转化经济、留存曲线和分渠道渗透假设。
