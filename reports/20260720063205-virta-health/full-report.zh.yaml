      - number: '8.2'
        title: 估值框架与情景
        blocks:
          - type: paragraph
            body: >-
              Virta 不应按纯软件估值。Bessemer 的健康科技研究在方向上适用：技术赋能服务能获得经常性收入，但必须同时看增长和毛利质量，因为劳动强度和护理交付会改变每一美元收入的价值。用 Virta 2025 年
              9 月 $160 million 年化收入对应最近披露的 $2 billion 估值，约为 12.5x 收入。相较当前公开可比公司的约 0.79x 至 4.23x EV/Sales，这个水平偏高；只有 Virta
              能证明具备上市公司级留存、60%+ 毛利率和可信的经审计盈利路径时，才会显得明显合理。因此，我们的情景工作把今天的估值框定为价格敏感决策，而不是简单的质量好坏判断。悲观情景假设雇主对 GLP-1 覆盖谨慎、客户
              logo 转化放慢，毛利率接近重服务模型可承受区间的低端。基准情景假设增长放缓但仍强，利润率稳定在 60% 出头，续约数据确认经常性经济。乐观情景要求更强条件：经审计披露、耐久的 70%+ 增长，以及证明
              Virta 临床护城河能让它在公开市场获得更接近最佳企业代谢护理可比公司、而不是通用远程医疗公司的溢价。
