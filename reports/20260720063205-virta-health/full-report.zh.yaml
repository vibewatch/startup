  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Virta 的产品最好理解为一个面向代谢疾病的虚拟护理运营模型，而不是单一应用。公司销售医生主导、营养优先的护理，把教练、临床医生、数据采集和出资方报告结合起来。公开材料让模块图谱相对清楚。Virta 仍以 2
              型糖尿病逆转为锚，但已扩展到糖尿病前期支持、肥胖治疗和医生主导的糖尿病管理。在此之上，减重和 GLP-1 材料显示，公司产品姿态比简单的反药物论更灵活：会员可以选择无药物护理，也可以把 Virta 与 GLP-1
              搭配，或在 GLP-1 使用后把 Virta
              作为退出路径。这种灵活性很重要，因为它在不放弃公司逆转优先身份的情况下，拓宽了可寻址工作流。证据库、数据页面和年报也构成产品的一部分，因为企业买方实际上同时购买护理交付、实施信心，以及护理模型能持续有效的证明。
