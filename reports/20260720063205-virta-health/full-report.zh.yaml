              采用轨迹可信，尤其是 Virta 既能指向广泛覆盖，也有少数细节充足的成功案例。公开证据里，最能说明先落地再扩张的是肥胖转向：更多客户现在提供减重支持，相当一部分会员专门因肥胖接受治疗，PBM
              或伙伴渠道也开始更重要。尽管如此，耐久度能见度很差。公开来源没有披露
              NRR、GRR、合同期限、流失或续约率，客户满意度也主要通过引语表达，而不是正式指标。公开漏斗因此讲的是熟悉的后期私营公司故事：顶部有很强的出资方触达，底部有一些结果证据，但续约数学非常有限。投资人应把客户采用理解为真实且在扩张，但对企业收入质量最关键的指标尚未完全证明。
