  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              Virta 当前最突出的风险，是 2026 年 3
              月数据事件后的法律和监管暴露。公司披露未经授权活动影响的是单独代码库，而不是在线生产平台，这限制了最坏情况解读；但事件仍可能暴露高度敏感的健康和身份信息。它立刻带来违规通知、HIPAA
              相邻和州消费者健康数据风险，并已经产生集体诉讼招揽。与此同时，Virta 自身隐私和安全材料显示，公司处在密集监管环境中：PHI 处理、出资方报告和州法下的消费者健康权利都明确在范围内。GLP-1
              政策引入第二条监管向量。复方配制、供给和 Medicare 覆盖变化可能帮助需求，也会让合规和竞争定位更复杂。净效果是，Virta
              今天没有面临生存级监管关停信号，但它所在制度环境里，一个事件、政策变化或执法问询都可能很快变成有商业意义的问题。
