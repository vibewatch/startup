  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 可比公司基准
        blocks:
          - type: paragraph
            body: >-
              Virta 最接近的上市可比公司是 Omada，而不是 Hims、Teladoc 或 LifeMD。这个可比组里，只有 Omada
              同时结合企业买方、慢病工作流和有证据支持的心血管代谢项目，并达到有意义规模；它的公开披露既展示了优秀模型应有的样子，也展示了做到这一步有多难。Omada 2025 年 6 月 IPO 定价为每股 $19，披露
              2026 年第一季度收入 $78.0 million、毛利率 62.4%，目前按 $283.3 million 过去十二个月收入计算，EV/Sales 约 4.23x。Hims 增长快、股权价值更大，但
              3.37x EV/Sales 倍数仍反映消费者获取强度，以及与 Virta 雇主和健康险计划动作的战略贴合度更弱。Teladoc 和 LifeMD
              是有用的下行护栏：两者都证明，当增长、盈利能力或模型清晰度摇摆时，仅有远程医疗规模并不能守住溢价倍数。换句话说，Virta
              可以凭结果导向定价和更深的代谢护理证据，主张相对多数上市可比公司的溢价；但公开市场同样表明，即使高质量数字健康公司，也需要透明利润率、耐久续约和经审计财务，投资人才会持续支付高于低到中个位数收入倍数的价格。
