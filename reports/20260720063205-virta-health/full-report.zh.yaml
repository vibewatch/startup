              客户和财务风险更多来自不透明，而不是明显崩塌。服务 550 多家组织降低了简单 logo
              集中度担忧，但收入集中度、留存、合同期限和续约经济仍未披露。这一点尤其重要，因为买方对肥胖药覆盖仍然谨慎，而伙伴主导渠道既可能加速增长，也可能掩盖底层经济性偏弱。财务模型风险同样披露不足。即使最后一轮干净的新股融资已追溯到
              2021
              年，公开来源仍没有披露现金、烧钱速度、现金跑道或债务。公司推进盈利有利于叙事，但不能消除融资风险。公开可比公司也给出警示：即使规模化的数字健康同业，也可能长期亏损、背负债务，或结构性依赖重营销。投资人因此应把
              Virta 当前风险看成劳动强度、财务不透明和潜在渠道质量稀释的组合，而不只是市场需求问题。
