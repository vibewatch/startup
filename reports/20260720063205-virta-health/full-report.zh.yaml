      - number: '2.2'
        title: 买方、支付方与可触达 SAM
        blocks:
          - type: paragraph
            body: >-
              Virta 主要通过机构销售。在雇主渠道，买方通常是福利或 HR 负责人，使用者是员工或家属，支付方是自保雇主。在健康险计划中，买方转向产品或人群健康负责人，支付方则是计划本身。Virta 入选 CMS
              生态，暗示未来可能有政府相关渠道，但今天的公开证据更多支持可信度，而不是那里的已变现规模。因此，公司披露的 12 million 覆盖人群和 550+ 家签约组织，比宽泛的数字健康 TAM
              更有用。按公开患病率估算，这些覆盖人群对应的肥胖相关 SAM 粗略约 5 million，糖尿病相关 SAM 约 1.1 million 至 1.2
              million，且尚未扣除资格筛选。这仍只是代理指标。没有邀请率、入组、激活和 12 个月留存的私有数据，理论可触达与可实现需求之间仍差距很大。
