      - number: '3.2'
        title: 竞品画像、定价与能力
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争分野是企业优先还是消费者优先。Virta 和 Omada 依赖雇主、健康险计划、PBM 和福利覆盖；Hims 和 Noom 更依赖消费者获取和可见报价；Weight Watchers
              介于两者之间；Teladoc 则可以把代谢支持打包进更宽的账户关系。公开规模数据凸显这些模型差异很大。Virta 称服务超过 12 million 覆盖人群和 550+ 家组织。Omada 报告覆盖 25
              million+ 人、拥有超过 1 million 会员和 2,000 多家客户。Hims 和 Teladoc 单季收入均超过 $600 million，WW
              仍有数百万订阅者且临床基础在增长。定价姿态也很不同。Noom 公布起步和月度价格，Hims 公开营销消费者减重护理。Virta 则强调结果保证和定制合同。这有利于企业 ROI
              销售，但也让外部基准更难做，并保留了实际定价的不确定性。
