          emotion: 既要质量可规模化，也要压降医疗成本
          painpoint: Coverage design and integration complexity
          opportunity: Successful deployment can expand across plan products
          label: 支付方推广闭环
        - actor: PBM 或合作伙伴渠道
          touchpoints:
            - 合作伙伴选择
            - 嵌入福利方案
            - 面向计划方推广
            - 会员转诊
            - 渠道放量
          emotion: 为计划方提供补充性的代谢护理价值
          painpoint: Data-sharing and economics are private
          opportunity: One partner can aggregate many sponsors
          label: 合作伙伴渠道闭环
    claimRefs:
      - CU001
      - CU021
      - CU022
      - CU030
      - CU035
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: Virta 公开披露的采用路径，从广泛覆盖人群收窄到已治疗会员，再收窄到少数资料更完整的具名 客户证据。
    data:
      items:
        - label: 覆盖人群
          value: 12000000
        - label: 服务组织数
          value: 550
        - label: 已治疗会员
          value: 200000
        - label: 提供肥胖症解决方案的客户
          value: 110
        - label: 章节内具名详细证据样本
          value: 6
    approximationNotes: 肥胖症解决方案阶段用 550 家组织的 20% 粗略代替；已治疗会员为累计口径，不一定当前仍活跃。
    claimRefs:
      - CU002
      - CU003
      - CU011
      - CU034
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 雇主案例研究在结果具体性上最强，合作伙伴渠道在分发杠杆上最强，但直接留存证据最弱。
    data:
      columns:
        - 结果具体性
        - 生产环境成熟度
        - 留存可见度
        - 渠道杠杆
      rows:
        - label: 雇主案例研究
          values:
            - 高
            - 高
            - 低
            - 中
        - label: 支付方 / 肥胖症扩展证据
          values:
            - 中
            - 中
            - 低
            - 中
        - label: PBM / 合作伙伴渠道
          values:
            - 中
            - 中
            - 低
            - 高
        - label: 政府 / 部落客户证据
          values:
            - 中
            - 中
            - 低
            - 低
        - label: 宽口径客户数声明
          values:
            - 低
            - 中
            - 低
            - 中
    claimRefs:
      - CU023
      - CU024
      - CU029
      - CU032
      - CU033
  - id: FU004
    title: 留存 / 复购队列可见度代理
    type: cohort
    layout: standard
    summary: 公开资料能确认队列和结果，但不给真实续约比例；因此图里展示的是可见度，不是真实留存。
    data:
      columns:
        - 实施
        - 第 1 年
        - 第 2 年
      rows:
        - label: 公开具名案例结果披露
          values:
            - 100
            - 75
            - 25
        - label: 公开计划方留存披露
          values:
            - 100
            - 0
            - 0
        - label: 公开收入留存披露
          values:
            - 100
            - 0
            - 0
        - label: 公开不利集中度或流失披露
          values:
            - 0
            - 0
            - 0
    approximationNotes: 100 表示该队列阶段有公开证据支持，0 表示没有披露公开留存比例；这是披露可见度代理，不是真正的续约图。
    claimRefs:
      - CU024
      - CU025
      - CU026
      - CU031
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 经过缓释之后，隐私、合作伙伴依赖、人力密集度和融资不透明仍是剩余风险最高的几项。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重度
      rows:
        - label: 隐私 / 数据泄露风险
          values:
            - 中高
            - 高
            - 中
            - 高
        - label: 合作伙伴渠道风险
          values:
            - 中
            - 高
            - 中
            - 中高
        - label: 人力密集 / 利润率风险
          values:
            - 中高
            - 高
            - 中
            - 中高
        - label: 融资不透明风险
          values:
            - 中
            - 高
            - 低
            - 中高
        - label: 政策 / GLP-1 风险
          values:
            - 中
            - 中高
            - 中
            - 中
    claimRefs:
      - CR001
      - CR011
      - CR014
      - CR016
      - CR018
      - CR021
      - CR040
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最关键的风险链条，从法律、合作伙伴和政策事件传导到销售速度、利润率和估值。
    data:
      nodes:
        - id: a
          label: 数据泄露 / 法律事件
        - id: b
          label: 买方信任
        - id: c
          label: 销售速度
        - id: d
          label: 合规成本
        - id: e
          label: 利润率
        - id: f
          label: 估值
        - id: g
          label: 合作伙伴转化
        - id: h
          label: 收入增长
      edges:
        - from: a
          to: b
          label: 削弱
        - from: b
          to: c
          label: 拖慢
        - from: a
          to: d
          label: 推高
        - from: d
          to: e
          label: 压缩
        - from: c
          to: h
          label: 削弱
        - from: g
          to: h
          label: 放大
        - from: h
          to: f
          label: 推动
        - from: e
          to: f
          label: 推动
    claimRefs:
      - CR015
      - CR032
      - CR035
      - CR036
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 相比实体供应链或库存，Virta 更依赖云基础设施、合作伙伴渠道、监管方和计划方预算。
    data:
      nodes:
        - id: d1
          label: Virta 核心平台
        - id: d2
          label: GCP 基础设施
        - id: d3
          label: 雇主 / 医保计划
        - id: d4
          label: PBM / 合作伙伴渠道
        - id: d5
          label: 隐私与医疗监管方
        - id: d6
          label: GLP-1 政策 / 供应
      edges:
        - from: d1
          to: d2
          label: 运行于
        - from: d1
          to: d3
          label: 销售给
        - from: d1
          to: d4
          label: 借助其扩张
        - from: d1
          to: d5
          label: 必须满足
        - from: d1
          to: d6
          label: 适应
    claimRefs:
      - CR009
      - CR013
      - CR014
      - CR016
      - CR027
      - CR036
  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: Virta 的投资建议由强证据和增长支撑，但结论仍对价格敏感，因为公开可比标的和披露质量仍限制 投资者该给出的价格。
    data:
      nodes:
        - id: outcomes
          label: 临床结果证据
        - id: growth
          label: 80%+ 增长 / $160M ARR
        - id: pricing
          label: 风险共担定价与保证
        - id: employer
          label: 雇主 GLP-1 成本痛点
        - id: discount
          label: 披露与公开可比折价
        - id: range
          label: 基准区间低于 $2B
        - id: rec
          label: 观察建议
      edges:
        - from: outcomes
          to: pricing
          label: 支撑
        - from: growth
          to: range
          label: 抬升
        - from: pricing
          to: range
          label: 帮助支撑溢价
        - from: employer
          to: discount
          label: 既帮助也约束
        - from: discount
          to: range
          label: 封顶
        - from: range
          to: rec
          label: 推动
    claimRefs:
      - CV001
      - CV004
      - CV022
      - CV024
      - CV038
      - CV043
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 在同一 $160M 年化收入基数上，Virta 股权价值仍高度取决于投资者愿意支付的收入倍数。
    data:
      items:
        - label: 7x 收入
          value: 1120
          unit: USD million
        - label: 9x 收入
          value: 1440
          unit: USD million
        - label: 11x 收入
          value: 1760
          unit: USD million
        - label: 13x 收入
          value: 2080
          unit: USD million
        - label: 15x 收入
          value: 2400
          unit: USD million
    approximationNotes: 柱形图将收入固定在 $160M，只隔离倍数假设，用来展示定价敏感性。
    claimRefs:
      - CV001
      - CV014
      - CV017
      - CV019
      - CV021
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 针对披露不足的后期私营公司，悲观、基准、乐观情景给出有纪律的估值区间，而不是单点估值。
    data:
      items:
        - label: 悲观情景
          low: 900
          high: 1200
          unit: USD million
          note: 增长放缓，买方保持谨慎
        - label: 基准情景
          low: 1300
          high: 1700
          unit: USD million
          note: 强劲增长延续，但溢价被压缩
        - label: 乐观情景
          low: 2000
          high: 2500
          unit: USD million
          note: 披露改善，溢价守住
    approximationNotes: 区间反映情景分层，不代表精确市场报价或已谈妥条款清单。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Virta 在证据和需求上得分最高，在估值支撑和披露质量上得分最低。
    data:
      items:
        - label: 市场痛点
          value: 8/10
          detail: 雇主 GLP-1 成本压力真实存在
        - label: 临床证据
          value: 8/10
          detail: 同行评议结果积累很深
        - label: 护城河
          value: 7/10
          detail: 结果与定价对齐很关键
        - label: 增长评分
          value: 8/10
          detail: 2025 年化收入加速很强
        - label: 经济性可见度
          value: 4/10
          detail: 毛利率和留存仍披露不足
        - label: 估值支撑
          value: 3/10
          detail: 公开可比公司无法完全支撑 $2B 估值
        - label: 证据质量
          value: 5/10
          detail: 临床证据强；财务证据仍不完整
    approximationNotes: 评分是面向投委会的判断指标，不是标准化上市公司评级。
    claimRefs:
      - CV001
      - CV022
      - CV024
      - CV038
      - CV039
      - CV044
