        title: 信任、安全与技术判断
        blocks:
          - type: paragraph
            body: >-
              Virta 发布的信任与合规细节，多于许多后期数字健康公司。它描述了与 ISO、NIST、HITRUST 和 HIPAA
              对齐的控制、年度测试、备份、最小权限访问，以及一份对数据类别和共享说明非常具体的隐私通知。这些对企业买方都是加分项。但 2026 年 3 月数据事件实质改变了产品和信任读数。即便 Virta
              表示受影响代码库与当前生产平台分离，该事件仍涉及潜在敏感健康和身份数据，并已经引来法律索赔招揽。这意味着公司纸面信任姿态强于许多同业，但仍会遭遇普通执行失败。就技术本身而言，结论有利但有边界。公开记录支持成熟护理工作流、有意义的证据基础和可信的企业就绪度；但不支持对专有
              AI 或平台防御性形成很深信心，因为这些层仍停留在高层描述，文档很轻，且在营销和招聘材料之外基本未经审计。
