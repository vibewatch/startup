      - number: '4.3'
        title: 成本结构、基准与资本强度
        blocks:
          - type: paragraph
            body: >-
              Virta
              的公开证据显示，这是一个服务交付成本不低的模型。连续远程护理、营养咨询、持证从业人员和不限次数的服务提供者访问，相比纯软件交付都更贵。这很可能让毛利率低于纯软件，也可能低于部分消费者远程医疗基准。公开可比公司能帮助框定可能范围，虽然没有一家是完美参照。Omada
              的 S-1 显示，企业慢病护理业务可以达到有意义规模，同时仍在销售和营销上重投入。Hims 的 2026 年 10-Q 显示毛利很强，但营销和运营 / 支持费用也很大，提醒人们消费者规模并不免费。Teladoc
              和 WW 说明，即使上市且规模更大的虚拟护理和体重管理平台，仍会与亏损、重组或沉重流动性需求纠缠。相比产品重的模型，Virta
              可能受益于更低的资本开支和库存强度，但主要经济挑战可能是劳动生产率：在保持结果的同时，每名教练、临床医生和支持团队成员能盈利管理多少已入组、活跃会员。
