  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Virta 把创始人主导的代谢护理投资逻辑接到雇主、支付方和公共项目分发上，而不是只靠直接面向消费者扩规模。
    data:
      nodes:
