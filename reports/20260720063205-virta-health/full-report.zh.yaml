  - id: TR005
    title: 缓释与叫停标准表
    columns:
      - 风险
      - 可监测触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 隐私 / 安全
        - 新通报、执法或误用证据
        - 任何监管行动、确认误用或第二次重大事件
        - 暂停，或大幅重估风险
      - - 增长与融资
        - 披露增长明显放缓，或融资条款偏弱
        - 增长显著低于 2025 年轨迹，或出现不透明的降估值融资
        - 重新测算估值与现金跑道
      - - 合作伙伴渠道
        - PBM / 合作伙伴占比增长，但缺乏经济性证据
        - 拿下大型合作伙伴后 12 个月内仍无留存或利润率证据
        - 将渠道增长视为质量较低
      - - 雇主需求
        - 雇主广泛覆盖肥胖症药物仍停滞
        - 买方连续多个季度谨慎，附加率偏弱
        - 下调采用假设
      - - 护理交付生产率
        - 人员增长快于结果或收入
        - 生产率持续恶化或利润率受压
        - 重新评估可扩张性假设
      - - 治理 / 信任
        - 尽调后董事会或临床监督仍不透明
        - 资料室没有可信的治理透明度
        - 上调风险评级或停止流程
    notes: 叫停标准要能直接监控和行动，而不是泛泛列担忧。
    claimRefs:
      - CR032
      - CR033
      - CR034
      - CR039
      - CR040
  - id: TV001
    title: 推荐结论摘要表
    columns:
      - 决策维度
      - 结论
      - 证据
      - 何种因素会改变判断
    rows:
      - - 投资建议
        - 观察
        - 业务质量确实存在，但这里价格和披露都很关键。
        - 只有入场价格降低，或经审计披露明显改善，才上调判断。
      - - 信心
        - 中
        - 临床证据和增长强劲，但现金、留存与利润率数据不完整。
        - 只有看到经审计的利润率、留存与现金跑道证据，才上调至高。
      - - 风险评级
        - 高
        - 雇主报销谨慎、披露缺口和倍数压缩风险仍不可忽视。
        - 只有续约、使用率和盈利能力证明韧性，才下调。
      - - 估值立场
        - 偏高
        - $2B 参考点意味着约 12.5x 收入，而上市可比公司区间为 0.79x-4.23x。
        - 若入场价格重置到接近基准情景价值，或基本面明显改善，则转为合理。
      - - 决策含义
        - 等尽调或等价格
        - 当前局面对耐心的回报高于速度。
        - 只有卖方提供下行保护，或出现新的经审计证据，才加快行动。
    notes: 本表总结投资决策，而非只重复公司质量亮点。
    claimRefs:
      - CV033
      - CV039
      - CV043
      - CV044
      - CV045
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 何种证据可解决
    rows:
      - - 临床护城河
        - 同行评议的结果和 GLP-1 停药路径证据支撑差异化买方 ROI。
        - 多数研究不是上市公司级 RCT，市场买方仍可能打折看待。
        - 提供独立的客户层面 ROI 研究，以及按项目审计的结果。
      - - 合同质量
        - Virta 长期把收费与结果挂钩，现在还提供明确成本保证。
        - 如果服务交付仍然重人力，风险分担定价仍可能掩盖偏弱毛利率。
        - 提供项目层面毛利率和实际赔付历史。
      - - 增长持久性
        - 2025 年年化收入和 80%+ 增长表明确有需求拉动。
        - 如果雇主限制 GLP-1 覆盖或推迟采购，运行率增长可能迅速降温。
        - 披露续约、扩张和 2026 年管线转化数据。
      - - 退出就绪度
        - 若盈利能力和披露同时拐点向上，IPO 叙事会改善。
        - 上市可比公司的交易倍数仍远低于 Virta $2B 标记所隐含的水平。
        - 发布经审计收入、毛利和现金流证据。
    notes: 反向逻辑刻意聚焦估值，不是泛泛罗列公司风险。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV038
      - CV039
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 倍数逻辑
      - 估值区间（USD B）
      - 概率信号
      - 关键触发点
    rows:
      - - 悲观
        - 增长放缓至 ~35-45%，雇主 GLP-1 覆盖仍有选择性，毛利率经验证更接近 50%。
        - 重估后相对疲弱远程医疗可比公司有溢价，但低于当前企业代谢健康龙头。
        - 0.9-1.2
        - 若买方持续增加使用率控制且披露仍有限，该情景概率更高。
        - 连续两个季度增长明显减速或利润率不及预期。
      - - 基准
        - 增长稳定在约 50-60%，毛利率接近 60%，续约支撑经常性经济性。
        - 支撑相对多数上市远程医疗公司的健康溢价，但仍低于无折扣 IPO 溢价。
        - 1.3-1.7
        - 若 Virta 仍是强劲的后期私营公司、但披露并不领先，这最可能发生。
        - 经审计收入和留存证据大体匹配当下叙事。
      - - 乐观
        - 增长保持 70%+，毛利率超过 65%，Virta 拿出经审计盈利能力和符合 IPO 要求的 披露。
        - 估值可向最高质量数字健康溢价梯队靠拢。
        - 2.0-2.5
        - 需要基本面和市场窗口同时配合。
        - 经审计盈利能力、持久扩张，以及清晰的公开市场就绪度。
    notes: 情景区间是基于判断的分档，锚定 Virta 的收入规模、可比公司倍数和披露 折价。
    claimRefs:
      - CV024
      - CV027
      - CV028
      - CV030
      - CV040
      - CV041
      - CV042
      - CV043
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 模式
      - 最新披露收入
      - 交易倍数 / 估值
      - 相关性
      - 局限
    rows:
      - - Omada Health
        - 企业心血管代谢数字护理
        - $283.3M LTM；Q1'26 毛利率 62.4%
        - 4.23x EV/Sales；2025 年 6 月 IPO 定价 $19/share
        - 在买方类型和病种组合上最接近的上市参照
        - 上市公司披露和合作伙伴集中度让它某些方面比 Virta 更干净，另一些方面 风险更高
      - - Hims & Hers
        - 消费者远程医疗 + 订阅
        - $2.37B LTM；毛利率 74%
        - 3.37x EV/Sales；市值 ~$7.6B
        - 说明数字健康里的高速增长仍能获得什么估值
        - 消费者获客模型与 Virta 的 B2B2C 路径结构不同
      - - Teladoc Health
        - 规模化虚拟护理平台
        - $2.51B LTM；访问费收入占比 83%
        - 0.79x EV/Sales；市值 ~$1.7B
        - 是远程医疗倍数压缩的有用下行护栏
        - 成熟多线资产，背负多年公开市场包袱
      - - LifeMD
        - 肥胖症相邻远程医疗和经常性订阅
        - $193.3M LTM；2025 年文件中 YoY 增长 25%
        - 0.89x EV/Sales；市值 ~$0.2B
        - 说明公开市场当前对较小型肥胖症相邻远程医疗公司的偏好
        - 比 Virta 更偏 DTC，结果导向较弱
    notes: 所选可比公司是对业务模式相邻性最有决策价值的公开基准，并非主张其中任何 一家都是完美可比公司。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public digital-health peers available for model comparison at the 2026 run date,
        emphasizing enterprise metabolic care first and broader telehealth guardrails second.
    claimRefs:
      - CV011
      - CV013
      - CV014
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
      - CV035
  - id: TV005
    title: 逻辑破坏与叫停触发点表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 增长减速
        - <40% YoY，且没有抵消影响的利润率证据
        - 打破相对上市可比公司的高增长溢价论据
        - 将估值移向悲观区间，并暂停任何入场。
      - - 毛利率现实
        - 经核实毛利率 <55%
        - 明显削弱 EV/毛利溢价论据
        - 将 Virta 视为质量较低的服务资产。
      - - 雇主需求控制
        - 主要买方大幅削减或收窄肥胖症福利覆盖
        - 缩小可变现 TAM 和定价权
        - 重新测算增长和获客假设。
      - - 披露失败
        - 新融资或 IPO 尝试前，没有经审计财务桥接或清晰股权结构表
        - 在价格最关键时抬高逆向选择风险
        - 信息集改善前，避免支付后期溢价。
    notes: 叫停触发点必须可监测、与估值相关，而不是抽象运营风险。
    claimRefs:
      - CV023
      - CV024
      - CV026
      - CV039
      - CV046
  - id: TV006
    title: 最终尽调索取清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计 2025 年财务
        - 收入、毛利、EBITDA 和现金流桥接
        - 决定 Virta 是否应相对 Omada 享有溢价，还是只能拿到有限私营公司估值上浮
        - CFO 材料包和审计师审阅财务报表。
      - - 续约与扩张队列
        - 按雇主规模拆分的客户 logo 留存、金额留存和多产品扩张
        - 验证年化收入是否真正具备规模化经常性
        - 董事会材料或收入运营提供的队列附录。
      - - 项目层面单位经济性
        - 按糖尿病、肥胖症和 GLP-1 相关工作流拆分的毛利率
        - 厘清模型中有多少来自软件杠杆，有多少来自临床人员劳动
        - 财务 + 临床运营模型审阅。
      - - 现金跑道与融资计划
        - 手头现金、烧钱速度、契约或债务敞口，以及融资触发点
        - 没有现金跑道清晰度时，后期私营公司溢价很危险
        - 资金计划表和融资委员会材料。
      - - 股权结构表与优先权
        - 2021 年后任何融资、清算优先权、员工流动性计划或二级交易定价历史
        - 净回报可能与表面估值标题大幅背离
        - 法务导出的股权结构表和二级交易摘要。
    notes: 这些索取项聚焦少数能改变建议的数据，而不是泛泛满足好奇心。
    claimRefs:
      - CV032
      - CV039
      - CV045
      - CV047
