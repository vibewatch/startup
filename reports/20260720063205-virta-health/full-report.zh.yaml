        title: 投资建议与尽调清单
        blocks:
          - type: paragraph
            body: >-
              正确结论是观察，不是买入。Virta 不是放弃标的，因为底层业务看起来强于数字健康资产中位数：增长真实、结果证据优于多数同业，价值定价也与当前雇主痛点在战略上对齐。但在上一轮 $2 billion
              参考估值附近，它也不是买入，因为公开市场证据尚不支持为一个不透明的护理交付模型支付双位数收入倍数。我们的信心是中等而非高，因为开放问题不是表面瑕疵。仍需要经审计的 2025 年收入、可信的毛利率桥、队列续约或
              NRR、更新后的股权结构表与优先权细节，以及现金跑道能见度。解决这些之前，Virta
              的估值更适合放在纪律严格的后期观察名单，而不是以高信念价格进场。上调路径很直接：要么入场价格显著更好，要么披露显著改善。下调路径同样清楚：如果透明度改善前增长先减速到普通数字健康水平，溢价逻辑就会破裂，Virta
              会开始像一个强产品绑着一个不适合公开市场的倍数。
