      - number: '4.2'
        title: 业务牵引与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              收入端动能是 Virta 财务案例中公开部分最强的一块。公司称年化收入在 2025 年 1 月超过 $100 million，2025 年 9 月超过 $160 million，同时服务 550
              多家组织、覆盖超过 12 million 人群。这些是强后期私营公司信号，但仍是运行率指标，不是经审计年度收入。即便如此，它们也能给出粗略公开代理指标。按 9 月运行率计算，每覆盖人群年收入只有约
              $13，说明覆盖人群是渠道指标，不是已变现会员数。如果招聘页上的 1000+ 员工大体正确，人均收入也偏温和，进一步说明 Virta
              是重服务的护理交付模型。公开客户和伙伴证据稍微支撑了销售效率叙事。AutoZone、Navitus、Capital Rx 和 Willis Towers Watson 都说明 Virta
              靠药物节省、临床结果和渠道杠杆销售，而不是靠低摩擦线上转化。不过，毛利率、CAC、回本周期、NRR 和队列留存等关键单位经济字段仍未披露。
