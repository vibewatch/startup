  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与运营版图
        blocks:
          - type: paragraph
            body: >-
              Virta Health
              是一家私营后期数字健康公司，核心是用营养优先、医生主导的虚拟护理模型逆转代谢疾病。公司的公开材料一直把它定义为护理交付组织，而不是轻量级健康应用：会员获得个性化营养指导、远程临床监督和技术支持，目标是糖尿病、肥胖及相邻代谢疾病。Virta
              当前公开足迹指向 Denver 总部，虽然较早新闻稿仍提到 San Francisco；更合理的理解是创业起点与当前基地的区别，而不是仍在持续的矛盾。公司称目前通过雇主、健康险计划和政府关系覆盖超过 12
              million 美国人群，同一套企业分发模型支撑了当前收入规模。换句话说，Virta 的核心身份不是消费订阅优先，而是主要通过机构销售、以结果为导向的代谢护理。
