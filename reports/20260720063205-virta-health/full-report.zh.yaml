      - number: '3.3'
        title: 分发能力与切换成本
        blocks:
          - type: paragraph
            body: >-
              这个品类里，分发能力可能比任何单一功能都重要。Omada 最近称已与三大领先 PBM 全部合作，并参与 Eli Lilly 的 Employer Connect
              项目，战略意义很大，因为这让公司能通过越来越支配肥胖药经济性的渠道触达雇主账户。Virta 也在朝这个方向推进，Capital Rx 合作和雇主计划足迹可以说明这一点，但公开记录显示 Omada 目前的 PBM
              分发信号更强。Teladoc 的优势又不同：既有虚拟护理关系给了它打包杠杆。不过，买方切换成本看起来仍是中等，而不是很硬。福利负责人可以重新招标供应商、混用多个服务提供商，或把部分工作流留给 PBM
              和初级保健伙伴。Virta 可能凭结果数据、护理团队工作流和实施工作量保留一定黏性，但公开材料没有显示那种会让替换异常痛苦的深层技术锁定。因此，竞争力更多来自渠道进入、合同表现和续约证明，而不是专有技术依赖。
