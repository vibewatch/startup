  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图
        blocks:
          - type: paragraph
            body: >-
              Virta 并不处在一个整齐的同业组里。最直接重叠的是 Omada，它同样向雇主和健康险计划销售虚拟慢病护理，如今也在积极切入与 PBM 相关的 GLP-1 支持。Teladoc
              是更宽的既有平台：它可能出现在同一个企业采购流程中，但代谢疾病只是庞大虚拟护理组合中的一块。Hims、Noom 和 Weight Watchers 的重要性来自另一条线。它们定义了消费者对肥胖护理、GLP-1
              获取、行为支持和价格透明度的预期。与此同时，许多买方的现状并不是另一家有品牌的创业公司，而是 PBM
              覆盖、初级保健建议、既有护理导航供应商或内部自建的混合体。因此，正确的版图是一条光谱，从直接企业同业延伸到消费者替代品。这个框架很重要，因为 Virta 未必会在渠道完全重叠的交易中大量输给 Hims，但
              Hims 和 Noom 仍会重置会员、雇主和健康险计划对体重管理获取便利性和体验的期待。
