      - number: '3.4'
        title: 护城河耐久度与反向观点
        blocks:
          - type: paragraph
            body: >-
              Virta 的护城河真实存在，但有条件。买方看重糖尿病可信度、营养优先的代谢护理，以及可衡量的雇主或支付方 ROI
              时，公司看起来最强。在这些场景下，公开结果材料和保证导向销售应该能产生共鸣。但护城河并非无懈可击。Omada 是最干净的直接威胁，因为它把广泛雇主相关性、增长中的 GLP-1 能力和 PBM
              渠道力量结合起来。Hims 和 Noom 从消费者端施压，让快速入组、可见定价和以药物为中心的减重方案常态化。即便是既有上市公司，图景也混合：Teladoc 证明这个品类存在大规模分发，Weight
              Watchers 则说明品牌和临床再定位并不保证执行顺滑。最大的竞争风险不是某个单一更强产品突破，而是通过打包被商品化。如果买方可以用 PBM、教练供应商和导航伙伴拼出代谢护理，Virta
              的差异化就必须继续通过结果和续约经济证明自己，而不是依赖硬锁定。
