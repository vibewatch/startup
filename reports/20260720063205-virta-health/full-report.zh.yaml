        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Sami Inkinen 仍是 Virta 公开叙事中最清晰的锚点，他的个人履历也明确把公司创立与自身糖尿病前期经历联系起来。围绕他，Virta 已补上更成熟的企业领导班底：Laura
              Walmsley 负责商业战略，Alok Bhushan 负责财务，Lucia Guillory 负责人力运营。医疗领导层从公开信息中更难读清。Robert Ratner
              当前资料称他是前首席医疗官、现任顾问，这确认公司仍有临床深度，但不能说明今天具体由谁掌握运营权。治理披露同样不完整。Virta 宣布前 CMS 署长 Don Berwick
              加入董事会，但本次审阅的来源没有给出完整、最新的董事会名单、委员会设置或投资方董事席位。因此，本章能支持较强的领导层判断，但治理确定性只能给到部分。
