            body: >-
              核心工作流在运营上很具体，也高度依赖人工引导。会员通过出资方或伙伴路径入组，开始记录营养和生物标志物数据，持续接受教练和服务提供者干预，并按需要进入药物调整或 GLP-1 路径。AutoZone
              案例研究用营养咨询、行为支持和连续医疗监督把这套工作流讲得很具体。公开材料里，最接近架构图的是 Virta 招聘页和安全材料。招聘页把 Virta
              定义为一家全栈医疗公司，为患者、临床医生、商业客户和入组环节构建产品，同时声称数据科学和机器学习提供实时干预和临床指导。安全页补上基础设施层：GCP 托管、镜像数据、夜间备份、成文 SDLC
              和正式事件响应。合在一起，这个架构更像带软件辅助的护理交付栈，而不是纯自动化平台，也不是今天可大规模自助使用的消费者级应用外壳。
