      - number: '1.3'
        title: 融资与私营公司状态
        blocks:
          - type: paragraph
            body: >-
              Virta 的融资史显示，公司已从早期临床验证走向重金支持的企业级增长故事。官方新闻稿记录了 2018 年 $45 million Series B、2020 年初 $93 million Series
              C、2020 年末 $65 million Series D，以及 2021 年 4 月由 Tiger Global 领投的 $133 million Series E。最后一轮定下 $2 billion
              估值，仍是最干净的公开估值锚。此后公开证据变得更乱。把官方融资节点串起来，意味着截至 Series E 累计股权融资至少约 $364 million；Sacra 估计七轮合计 $376.5
              million，GetLatka 则只报三轮合计 $235 million。分歧并不小，因为它会影响稀释计算和持股假设；但大结论不变：Virta 仍是一家资本充足的私营公司，当前公开估值语境主要仍以 2021 年
              $2 billion 轮为基准，截至报告生成日没有确认的 IPO 申报或已宣布出售。
