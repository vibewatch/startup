      - number: '2.3'
        title: 采用驱动因素
        blocks:
          - type: paragraph
            body: >-
              当前最大驱动不只是患病率，而是预算冲击。CNBC、KFF 和 Virta 自己的 2025 年材料都指向同一件事：减重药经济账正在倒逼雇主和支付方。Virta 的卖点正好贴合这种现实：营养优先护理可以替代
              GLP-1 使用，也可以与 GLP-1 搭配以改善结果、支持减停药，或用保证把支出趋势压住。公司 2025 年推出的负责任开方能力、0% GLP-1
              使用趋势保证和结果挂钩定价，说明管理层明白采购决策越来越受财务、预测纪律和福利预算焦虑驱动，临床需求只是其中一部分。更宽的产品范围也是驱动因素。Virta
              从糖尿病逆转扩到肥胖、糖尿病前期和医生主导的糖尿病管理，同一买方可对应更大预算，也能解决更完整的代谢护理问题。
