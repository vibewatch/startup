  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与疾病负担
        blocks:
          - type: paragraph
            body: >-
              不能给 Virta 套上泛泛的「数字健康」标签就理解它的市场。真正相关的市场是虚拟代谢护理：糖尿病逆转与管理、肥胖治疗、糖尿病前期支持，以及越来越多围绕 GLP-1 成本管理打包的生活方式和临床指导。这个范围比
              2 型糖尿病单点解决方案更宽，又比整个肥胖药物或健康生态更窄。最干净的负担视角来自患病率和成本，而不是某位分析师的一页 TAM 或某个供应商自制的市场地图。美国官方来源显示糖尿病患者约 38.4 million
              至 40.1 million，NIDDK 仍显示超过 2/5 成年人存在肥胖。Virta 自身材料把肥胖、超重和 2 型糖尿病的年度负担放在 $586
              billion。这些数字解释了为什么雇主和支付方在意；但它们不等于 Virta 可寻址收入有数千亿美元，而是说明疾病负担巨大，可变现的服务层只是窄得多的一片。
