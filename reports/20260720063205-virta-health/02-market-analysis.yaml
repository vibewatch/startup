- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - GLP-1 cost inflation
    - Driver
    - Now
    - Makes nutrition-first and utilization-management offerings easier to sell
    - Quantify realized savings versus guarantees
  - - Employer demand for counseling
    - Driver
    - Now
    - Raises willingness to bundle lifestyle support with drugs
    - Request win-loss examples by employer size
  - - Broader product scope (obesity / prediabetes)
    - Driver
    - Now
    - Expands TAM beyond classic diabetes reversal
    - Request revenue mix by condition
  - - Medicare GLP-1 coverage expansion
    - Driver
    - 12-24 months
    - Creates future government-channel relevance
    - Clarify channel economics and compliance
  - - Huge prevalence / cost burden
    - Driver
    - Structural
    - Supports long duration demand if budgets exist
    - Tie prevalence to contracted lives and conversion
  - - Employer hesitancy on broad GLP-1 coverage
    - Constraint
    - Now
    - Slows adoption or narrows covered population
    - Break out closed-won versus stalled deals
  - - Implementation / behavior-change friction
    - Constraint
    - Structural
    - Enrollment and adherence cap realized revenue
    - Provide activation and retention funnel data
  - - Policy and reimbursement uncertainty
    - Constraint
    - 12-24 months
    - Could shift economics or competitor set rapidly
    - Track Medicare and employer-coverage updates
  notes: Growth is driven by budget pain and clinical relevance, but constrained by buyer caution, adherence, and policy volatility.
