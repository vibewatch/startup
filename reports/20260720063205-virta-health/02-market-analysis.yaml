- id: buyers-payers-and-reachable-sam
  title: Buyers, payers & reachable SAM
  body: Virta sells mainly through institutions. In the employer channel, the buyer is typically a benefits or HR leader, the user is the employee or dependent, and the payer is the self-insured employer. In health plans, the buyer shifts toward product or population-health leadership and the payer becomes the plan itself. Virta’s CMS ecosystem selection hints at a government-linked future channel, but public evidence today supports credibility more than monetized scale there. The company’s reported 12 million covered lives and 550-plus contracted organizations are therefore more useful than broad digital-health TAM figures. Using public prevalence rates, those covered lives translate into a rough obesity-relevant SAM of about five million and a diabetes-relevant SAM of about 1.1 to 1.2 million before eligibility filters. That is still only a proxy. Without private data on invitation rates, enrollment, activation, and 12-month retention, the difference between theoretical reach and realizable
    demand remains substantial.
  claimRefs:
  - CM002
  - CM012
  - CM013
  - CM014
