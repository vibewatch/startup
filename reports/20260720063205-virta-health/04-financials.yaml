  rows:
  - - Diabetes reversal
    - Employer or plan contract tied to metabolic outcomes
    - Contract / enrolled member / outcome milestone
    - Core historical revenue line
    - High strategic fit; exact realized pricing unknown
    - Break out share of ARR and renewal rate
  - - Obesity / weight loss
    - Employer or plan sponsored sustainable weight-loss program with or without GLP-1 support
    - Contract / enrolled member / outcome milestone
    - Fastest expansion vector in 2024-2025
    - Growing quickly but pricing mix opaque
    - Provide obesity-only bookings and realized pricing
  - - Diabetes management
    - Provider-led support for members not reversing off meds immediately
    - Contract / enrolled member
    - Publicly disclosed as a program line
    - Useful cross-sell and retention layer
    - Separate revenue and gross margin from reversal
  - - Prediabetes support
    - Prevention-oriented benefit offering
    - Contract / covered population
    - Program available publicly; scale not separated
    - Good funnel extension, lower proof on revenue share
    - Report attach rate and conversion to paid programs
  - - Performance guarantees
    - Outcomes-based or GLP-1 trend guarantees
    - Performance fee / risk-sharing
    - Publicly emphasized, exact economics private
    - Potential differentiation on revenue quality
    - Show actual payout and clawback history
  - - Partner distribution
    - PBM, broker, and channel-assisted deployments
    - Shared or sponsor contract
    - Growing via Navitus, Capital Rx, WTW signals
    - Could reduce CAC if scaled
    - Provide pipeline and economics by channel
  notes: Virta monetizes a bundle of clinical programs and risk-sharing constructs rather than a single transparent subscription SKU.
