- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Best public anchor
  - Why it matters
  - Diligence ask
  rows:
  - - Cash on hand
    - Unknown for Virta
    - No public balance-sheet disclosure found
    - Runway cannot be underwritten
    - Request current cash and 13-week cash flow
  - - Monthly burn
    - Unknown for Virta
    - No public burn disclosure found
    - Growth without burn context can be misleading
    - Request burn by function and scenario
  - - Runway months
    - Unknown for Virta
    - Cannot infer safely from public sources
    - Determines financing dependency
    - Request base / bear runway
  - - Last clean primary financing marker
    - $133M Series E at $2B in Apr 2021
    - Official Series E release plus Business Wire copy
    - Sets last priced capital context
    - Confirm whether any later primary or debt financing exists
  - - Secondary or market context
    - Tracker / PM snapshots imply active market interest but not balance-sheet strength
    - PM Insights and other tracker surfaces
    - Secondary liquidity is not operating liquidity
    - Separate shareholder liquidity from company cash needs
  - - Next-round trigger
    - Unknown publicly
    - Business Insider points to profitability pressure and IPO readiness work
    - Could shape strategy and cost discipline now
    - Request board fundraising / profitability triggers
  notes: The capital-adequacy analysis is intentionally conservative because public evidence lacks core liquidity metrics.
