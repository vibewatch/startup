- id: traction-and-unit-economics-proxies
  title: Traction & unit-economics proxies
  body: Top-line momentum is the strongest public part of Virta's financial case. The company said annualized revenue surpassed $100 million in January 2025 and $160 million in September 2025 while serving more than 550 organizations and over 12 million covered lives. Those are strong late-stage private-company signals, but they remain run-rate metrics rather than audited annual revenue. Even so, they enable rough public proxies. At the September run-rate, revenue per covered life is only about $13 annually, which underscores that covered lives are a channel indicator rather than a monetized member count. Revenue per employee is also modest if the 1000-plus careers figure is directionally right, reinforcing that Virta is a service-rich care-delivery model. Public customer and partner proof helps the sales-efficiency story a bit. AutoZone, Navitus, Capital Rx, and Willis Towers Watson all suggest Virta sells on medication savings, clinical outcomes, and channel leverage rather than on low-friction
    online conversion. Still, key unit-economics fields such as gross margin, CAC, payback, NRR, and cohort retention remain unreported.
