- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Virta solution
  - Measured benefit
  - Limitation
  rows:
  - - Reverse type 2 diabetes
    - Enroll, log food and biomarkers, work with coach and provider
    - Personalized nutrition plus continuous remote care
    - A1c improvement, medication reduction, weight loss
    - Needs sustained engagement
  - - Manage obesity with or without GLP-1s
    - Assess preference and clinical need, choose pathway
    - Drug-free, companion, or off-ramp pathway
    - Weight loss with more flexibility than one-path treatment
    - Medication economics and supply can shift
  - - Employer cost control
    - Offer covered benefit to eligible population
    - Outcomes-linked metabolic-care benefit
    - Potential reduction in drug and claims spend
    - ROI still depends on enrollment and adherence
  - - Health plan integration
    - Embed Virta in benefits and population-health workflows
    - Plan-facing deployment and reporting
    - Scalable access across member base
    - Integration mechanics not publicly detailed
  - - PBM / pharmacy partner support
    - Add metabolic support alongside pharmacy strategy
    - Navitus / Capital Rx style partner deployment
    - Can address GLP-1 cost pressure
    - Contract and data-sharing terms private
  - - Care-team intervention
    - Monitor member data and adjust support quickly
    - Messaging, monitoring, and provider oversight
    - More continuous than episodic visits
    - Human labor intensity may limit margin
  notes: Virta's workflow is operationally specific and care-team intensive, which is a strength for outcomes and a constraint for margin.
