  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ai-architecture
    missingEvidence: Model architecture, training data governance, evaluation framework, and clinician override details for Virta's AI support layer.
    whyItMatters: AI is marketed as part of the product, but the safety and defensibility of that layer cannot be judged publicly.
    diligencePath: Request architecture review, model-governance docs, evaluation metrics, and clinician-in-the-loop controls.
    relatedQuestionRefs:
    - QE005
    - QE024
  - type: private-evidence-only
    severity: material
    topic: integration-surface
    missingEvidence: APIs, data-ingestion flows, EMR or PBM integration details, and interoperability SLAs.
    whyItMatters: Deployment risk and switching cost depend on concrete integration mechanics.
    diligencePath: Request implementation architecture, integration list, and customer deployment playbooks.
    relatedQuestionRefs:
    - QE013
    - QE014
  - type: private-evidence-only
    severity: minor
    topic: developer-ecosystem
    missingEvidence: Any external developer documentation, API references, or partner-engineering artifacts.
    whyItMatters: Absence likely reflects the business model, but it leaves technical extensibility under-documented.
    diligencePath: If no public developer surface exists, request internal platform docs and partner integration guides.
    relatedQuestionRefs:
    - QE019
    - QE020
  - type: private-evidence-only
    severity: material
    topic: post-breach-remediation
    missingEvidence: Root cause, post-incident hardening steps, and independent validation of remediations after the March 2026 event.
    whyItMatters: Trust cannot be fully restored from the notice alone.
    diligencePath: Request incident report, remediation plan, and updated audit results.
    relatedQuestionRefs:
    - QE017
    - QE018
  - type: missing-source
    severity: minor
    topic: reliability-metrics
    missingEvidence: Public uptime, latency, incident history, or status-page evidence for Virta's member and clinician applications.
    whyItMatters: Support and availability claims remain process-based rather than metric-based.
    diligencePath: Request status-page history, SLOs, and internal reliability dashboards.
    relatedQuestionRefs:
    - QE015
