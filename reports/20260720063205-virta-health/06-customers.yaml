- id: named-customer-proof-and-adoption-quality
  title: Named customer proof & adoption quality
  body: Virta's customer-proof surface is better than a simple logo wall, but it is uneven. AutoZone is the cleanest example because the company published explicit clinical and medication-reduction outcomes and framed the deployment as an operating program, not a test. Old Dominion provides another strong employer proof point with quantified weight-loss and medication-reduction outcomes. Mashantucket Pequot Tribal Nation adds a rarer public-style deployment with multi-year medication-spend savings. On the payer and partner side, Quartz, U-Haul, Navitus, Capital Rx, and Accolade show that Virta is increasingly deployed through obesity, PBM, and navigation channels. The downside is that not every named surface is equally rigorous. Some pages emphasize access and partnership more than hard usage or renewal metrics. The result is a customer-proof set that clearly shows real adoption and expanding channel breadth, but still leaves major parts of the base represented only by aggregate company
    claims and lightly detailed partner references in public materials today overall.
