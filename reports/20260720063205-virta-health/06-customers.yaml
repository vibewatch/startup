  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo retention, contract length, renewal rates, and cohort behavior by channel.
    whyItMatters: Customer durability cannot be underwritten from logo growth alone.
    diligencePath: Request customer-cohort retention and renewal schedules by employer, payer, PBM, and partner channel.
    relatedQuestionRefs:
    - QU013
    - QU024
  - type: private-evidence-only
    severity: material
    topic: revenue-concentration
    missingEvidence: Revenue concentration by top employer, plan, PBM, or partner.
    whyItMatters: A broad logo count can still mask a concentrated revenue base.
    diligencePath: Request top-10 customer and top-partner revenue concentration plus renewal dates.
    relatedQuestionRefs:
    - QU016
    - QU024
  - type: private-evidence-only
    severity: minor
    topic: government-channel-depth
    missingEvidence: Concrete government or public-sector deployment metrics beyond thin public references.
    whyItMatters: Government expansion is strategically interesting but lightly evidenced publicly.
    diligencePath: Request VA or other public-sector deployment metrics and contract status.
    relatedQuestionRefs:
    - QU020
  - type: private-evidence-only
    severity: minor
    topic: segment-profitability
    missingEvidence: Gross margin or CAC by customer segment and partner channel.
    whyItMatters: Expansion through PBMs or brokers may look attractive in proof but could vary widely in economics.
    diligencePath: Request channel-level unit economics and implementation cost.
    relatedQuestionRefs:
    - QU021
    - QU024
  - type: missing-source
    severity: minor
    topic: named-customer-coverage
    missingEvidence: A complete list of active named customers with status, contract stage, and whether each example is still live.
    whyItMatters: Public customer-proof tables are inevitably partial and favor success stories.
    diligencePath: Request current customer roster or reference list with permissioned references.
    relatedQuestionRefs:
    - QU004
    - QU005
    relatedTableRefs:
    - TU003
