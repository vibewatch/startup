figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Virta's public customer journey varies by sponsor type, but usually moves from cost or health pain to covered benefit, member activation, outcomes, and expansion into new conditions.
  data:
    items:
    - actor: Self-insured employer
      touchpoints:
      - GLP-1 or diabetes cost concern
      - Benefit decision
      - Employee enrollment
      - Clinical outcomes review
      - Possible obesity expansion
      emotion: Wants measurable ROI and healthier employees
      painpoint: Procurement scrutiny and budget ownership slow decisions
      opportunity: One benefit line can expand into broader metabolic-care coverage
      label: Employer buyer loop
    - actor: Health plan or payer
      touchpoints:
      - Population-cost concern
      - Program selection
      - Member deployment
      - Outcomes and savings reporting
      - Broader member rollout
      emotion: Needs scalable quality and medical-cost reduction
      painpoint: Coverage design and integration complexity
      opportunity: Successful deployment can expand across plan products
      label: Payer rollout loop
    - actor: PBM or partner channel
      touchpoints:
      - Partner selection
      - Benefit embedding
      - Sponsor rollout
      - Member referrals
      - Channel scaling
      emotion: Seeks complementary metabolic-care value for plan sponsors
      painpoint: Data-sharing and economics are private
      opportunity: One partner can aggregate many sponsors
      label: Partner channel loop
  claimRefs:
