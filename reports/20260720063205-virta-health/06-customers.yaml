company:
  name: Virta Health
chapter:
  number: 6
  title: Customers
  summary: 'Virta has real customer breadth across employers, health plans, PBM-linked channels, and a few government-style deployments, with named proof strongest in employer case studies such as AutoZone and Old Dominion. The main gap is durability: public sources show adoption and some outcomes, but not renewal, retention, or concentration math.'
sections:
- id: customer-base-and-segmentation
  title: Customer base & segmentation
  body: 'Virta''s customer base is broader than the phrase “employer benefit” suggests. The core motion still runs through self-insured employers and health plans, but the reviewed public proof shows PBM-linked channels, navigation partners, tribal-government style entities, and broker influence as well. That matters because buyer, user, and payer are not the same person in this business. Sponsors or partners decide to cover the program, members use it, and savings or risk reduction accrue back to the sponsoring organization. Virta''s own scale claims make the top of the base look meaningful: more than 550 organizations, more than 12 million covered lives, and more than 200 thousand treated members. The named logo set is also reasonably diverse, spanning retail, trucking, higher education, health-plan, PBM, tribal, and partner-distribution contexts with different buying motions and deployment assumptions. Strategically, the most valuable segments still appear to be large self-insured employers,
    payer populations facing GLP-1 cost pressure, and partner channels that can aggregate multiple sponsors at once.'
