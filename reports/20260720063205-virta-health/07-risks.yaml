  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: post-breach-remediation
    missingEvidence: Root cause, remediation scope, insurer or regulator interactions, and independent validation after the March 2026 event.
    whyItMatters: Security-process claims cannot fully offset a fresh incident without remediation evidence.
    diligencePath: Request incident report, remediations, cyber-insurance correspondence, and external assessor confirmation.
    relatedQuestionRefs:
    - QR002
    - QR022
  - type: private-evidence-only
    severity: material
    topic: runway-and-covenants
    missingEvidence: Cash balance, debt schedule, burn, runway, and financing triggers.
    whyItMatters: Financing-opacity risk is one of the core residual exposures.
    diligencePath: Request full balance sheet package and financing strategy memo.
    relatedQuestionRefs:
    - QR014
    - QR020
  - type: private-evidence-only
    severity: material
    topic: partner-economics
    missingEvidence: Revenue mix, concentration, renewal, and margin by PBM, broker, or partner channel.
    whyItMatters: Rising partner dependence can improve growth or harm economics depending on terms.
    diligencePath: Request channel-level unit economics and concentration schedules.
