evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: A current cap table or investor-side ledger reconciling all equity rounds and any secondary or extension rounds.
    whyItMatters: Tracker totals range from about $235M to $376.5M, which changes dilution and ownership assumptions.
    diligencePath: Request board-approved financing history, round-by-round cap table, and investor rights summary from management.
    relatedQuestionRefs:
      - QO022
  - type: missing-source
    severity: material
    topic: board-roster
    missingEvidence: A complete current board roster with investor designees and committee responsibilities.
    whyItMatters: Governance quality and control rights cannot be fully underwritten from public sources alone.
    diligencePath: Ask management for current board deck footer, governance chart, and investor-rights summary.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
      - TO004
  - type: private-evidence-only
    severity: minor
    topic: founder-list
    missingEvidence: >-
      An authoritative company source that names every co-founder or clarifies scientific founders versus operating
      founders.
    whyItMatters: Founder-market-fit analysis is cleaner when the cap-table founder set is explicit.
    diligencePath: Request certificate of incorporation history, earliest deck, or company history memo.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: minor
    topic: ipo-path
    missingEvidence: Board-approved IPO readiness plan, bank presentations, or internal timing milestones.
    whyItMatters: Public evidence only shows optionality, not commitment, on exit timing.
    diligencePath: Ask management and lead investors for financing strategy and exit-readiness materials.
    relatedQuestionRefs:
      - QO025
  - type: stale
    severity: minor
    topic: headcount-dispersion
    missingEvidence: A single dated employee count from management or payroll-adjacent documentation.
    whyItMatters: Public trackers and careers messaging diverge, which clouds operating leverage analysis.
    diligencePath: Request current employee roster summary by function and state.
    relatedQuestionRefs:
      - QO009
  - type: private-evidence-only
    severity: material
    topic: sam-assumptions
    missingEvidence: Eligibility, activation, and sustained-enrollment rates by channel.
    whyItMatters: SAM/SOM cannot be tightly underwritten from prevalence alone.
    diligencePath: 'Request channel-level funnel metrics: eligible lives, invited lives, enrollments, and 12-month retention.'
    relatedQuestionRefs:
      - QM024
  - type: stale
    severity: minor
    topic: obesity-prevalence
    missingEvidence: Newer nationally representative obesity prevalence data that fully refreshes 2017-2018 NHANES references.
    whyItMatters: Older prevalence inputs can over- or under-state today’s addressable population.
    diligencePath: Update model when newer NHANES or CDC obesity prevalence data are published.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: buyer-conversion
    missingEvidence: Employer and health-plan sales-cycle conversion and close-rate data.
    whyItMatters: Adoption timing depends on budget authority and conversion friction, not just prevalence.
    diligencePath: Request CRM funnel by segment and buyer type.
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: minor
    topic: prevalence-variance
    missingEvidence: A single methodology note reconciling CDC, NIDDK, and company prevalence figures.
    whyItMatters: Sizing tables otherwise mix slightly different denominators and update windows.
    diligencePath: Normalize all prevalence inputs to one methodology before the next refresh.
    relatedQuestionRefs:
      - QM014
      - QM025
  - type: missing-source
    severity: minor
    topic: medicare-economics
    missingEvidence: Public economics for how CMS ecosystem participation could convert into contracted revenue.
    whyItMatters: Policy tailwinds do not automatically become monetizable demand.
    diligencePath: Request pilot scope, contractual model, and milestone economics for CMS-related work.
    relatedQuestionRefs:
      - QM013
      - QM022
  - type: private-evidence-only
    severity: material
    topic: win-loss-data
    missingEvidence: Named competitive win-loss analysis by segment, including renewal reasons and lost-to competitor detail.
    whyItMatters: Public landscape evidence shows who exists, not who Virta actually beats and why.
    diligencePath: Request CRM-derived win/loss data by competitor, segment, and contract size.
    relatedQuestionRefs:
      - QP024
  - type: private-evidence-only
    severity: material
    topic: contract-terms
    missingEvidence: Actual Virta, Omada, and payer-side contract length, guarantees, and termination terms.
    whyItMatters: Switching-cost analysis is weak without knowing multi-year lock-in or at-risk economics.
    diligencePath: Request sample master services agreements, SOWs, and outcomes-guarantee schedules.
    relatedQuestionRefs:
      - QP016
      - QP017
  - type: missing-source
    severity: minor
    topic: price-realization
    missingEvidence: Realized PMPM, case-rate, or outcomes-fee data for Virta and Omada rather than marketing posture alone.
    whyItMatters: List or public price posture does not equal actual competitive pricing.
    diligencePath: Ask management for realized pricing bands, discounts, and renewal uplifts by customer class.
    relatedQuestionRefs:
      - QP011
      - QP022
  - type: private-evidence-only
    severity: minor
    topic: clinical-apples-to-apples
    missingEvidence: A normalized outcomes comparison across Virta, Omada, Noom, Hims, and WW for similar populations.
    whyItMatters: Marketing claims are not directly comparable across different cohorts, durations, and endpoints.
    diligencePath: Normalize endpoints in diligence or request third-party comparative studies.
    relatedQuestionRefs:
      - QP018
      - QP024
  - type: stale
    severity: minor
    topic: fast-moving-glp1-packaging
    missingEvidence: Up-to-date competitor packaging and medication availability snapshots across consumer rivals.
    whyItMatters: Hims, Noom, and WW can change offers faster than annual diligence cycles capture.
    diligencePath: Refresh competitor pricing and assortment immediately before investment committee or contracting decisions.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: cash-and-burn
    missingEvidence: Current cash balance, monthly burn, runway months, and debt obligations.
    whyItMatters: Capital adequacy cannot be underwritten from growth metrics alone.
    diligencePath: Request monthly cash bridge, debt schedule, covenant package, and 12-18 month base case plan.
    relatedQuestionRefs:
      - QI017
      - QI023
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin, care-team cost per active member, CAC, payback period, NRR, and cohort retention by customer
      segment.
    whyItMatters: These are the core inputs needed to judge profitability and scalability.
    diligencePath: Request board KPIs or finance packet with cohort contribution margin and sales-efficiency metrics.
    relatedQuestionRefs:
      - QI011
      - QI023
  - type: missing-source
    severity: minor
    topic: revenue-recognition-policy
    missingEvidence: >-
      A formal accounting policy note for how engagement milestones, outcomes payments, and guarantees are recognized as
      revenue.
    whyItMatters: Annualized run-rate and at-risk pricing complicate comparability to standard SaaS metrics.
    diligencePath: Request auditor memo or revenue-recognition policy summary from finance.
    relatedQuestionRefs:
      - QI010
      - QI020
  - type: private-evidence-only
    severity: minor
    topic: customer-concentration
    missingEvidence: Revenue concentration by top employer, payer, PBM, or channel partner.
    whyItMatters: A small set of major sponsors could distort growth quality and renewal risk.
    diligencePath: Request top-10 customer concentration, channel concentration, and renewal schedule.
    relatedQuestionRefs:
