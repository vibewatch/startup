  - id: investment-recommendation-and-diligence-asks
    title: Investment recommendation & diligence asks
    body: >-
      The right call is track, not buy. Virta is not a pass because the underlying business appears better than the
      median digital-health asset: growth is real, outcomes proof is better than most peers, and value-based pricing is
      strategically aligned with current employer pain. But it is also not a buy at or around the last $2 billion
      reference mark, because the public market evidence does not yet support paying a double-digit revenue multiple for
      an opaque care-delivery model. Our confidence is medium rather than high because the open questions are not
      cosmetic. We still need audited 2025 revenue, a credible gross-margin bridge, cohort renewals or NRR, updated
      cap-table and preference detail, and cash-runway visibility. Until those items are resolved, Virta’s valuation
      belongs closer to a disciplined late-stage watchlist than to a conviction-priced entry. The upgrade path is
      straightforward: either a materially better entry price or materially better disclosure. The downgrade path is
      equally clear: if growth decelerates toward ordinary digital-health levels before transparency improves, the
      premium case breaks and Virta starts to look like another strong product attached to a public-market-incompatible
      multiple.
    claimRefs:
      - CV033
      - CV039
      - CV043
      - CV044
      - CV045
      - CV046
      - CV047
    tableRefs:
      - TV001
      - TV006
    figureRefs:
      - FV001
tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision axis
      - Conclusion
      - Evidence
      - What changes the view
    rows:
      - - Recommendation
        - Track
        - Business quality is real, but price and disclosure both matter materially here.
        - Upgrade only on lower entry price or materially better audited disclosure.
      - - Confidence
        - Medium
        - Clinical proof and growth are strong, but cash, retention, and margin data are incomplete.
        - Move to high only after audited margin, retention, and runway evidence.
      - - Risk rating
        - High
        - Employer reimbursement caution, disclosure gaps, and multiple compression risk remain meaningful.
        - Reduce only if renewals, utilization, and profitability prove resilient.
      - - Valuation stance
        - Stretched
        - A $2B reference point implies ~12.5x revenue versus a 0.79x-4.23x public comp range.
        - Move to fair if entry resets toward base-case value or fundamentals materially improve.
      - - Decision implication
        - Wait for diligence or price
        - The current setup rewards patience more than speed.
        - Act faster only if the seller offers downside protection or new audited proof arrives.
    notes: This table summarizes the investment decision rather than repeating company-quality positives alone.
    claimRefs:
      - CV033
      - CV039
      - CV043
      - CV044
      - CV045
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would resolve it
    rows:
      - - Clinical moat
        - Peer-reviewed outcomes and GLP-1 off-ramp evidence support differentiated buyer ROI.
        - Most studies are not public-company-grade RCTs, and market buyers may still discount them.
        - Show independent customer-level ROI studies and audited outcomes by program.
      - - Contract quality
        - Virta has long tied fees to outcomes and now offers explicit cost guarantees.
        - At-risk pricing can still mask weak gross margins if service delivery stays labor heavy.
        - Provide program-level gross margin and realized payout history.
      - - Growth durability
        - 2025 annualized revenue and 80%+ growth suggest real demand pull.
        - Run-rate growth can cool quickly if employers gate GLP-1 coverage or delay procurement.
        - Disclose renewal, expansion, and 2026 pipeline conversion data.
      - - Exit readiness
        - IPO narrative improves if profitability and disclosure both inflect.
        - Public comps still trade at much lower multiples than a $2B Virta mark implies.
        - Publish audited revenue, gross profit, and cash-flow evidence.
    notes: The anti-thesis is deliberately valuation-specific; it is not a generic list of company risks.
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV038
      - CV039
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Multiple logic
      - Valuation range (USD B)
      - Probability signal
      - Key trigger
    rows:
      - - Bear
        - Growth slows to ~35-45%, employer GLP-1 coverage stays selective, and gross margin proves closer to 50%.
        - Rerates toward a premium to weak telehealth comps but below current enterprise-metabolic leaders.
        - 0.9-1.2
        - More likely if buyers keep adding utilization controls and disclosure stays sparse.
        - Two quarters of material growth deceleration or margin disappointment.
      - - Base
        - Growth settles around 50-60%, gross margin proves near 60%, and renewals support recurring economics.
        - Supports a healthy premium to most public telehealth names but still below a clean IPO premium.
        - 1.3-1.7
        - Most likely if Virta remains a strong late-stage private company but not a disclosure leader.
        - Audited revenue and retention evidence broadly match today's narrative.
      - - Bull
        - >-
          Growth remains 70%+, gross margin exceeds 65%, and Virta shows audited profitability plus IPO-ready
          disclosure.
        - Allows valuation closer to the highest-quality digital-health premium cohort.
        - 2.0-2.5
        - Requires both fundamentals and market window to cooperate.
        - Audited profitability, durable expansion, and clear public-market readiness.
    notes: >-
      Scenario ranges are judgment-based brackets anchored on Virta's revenue scale, comp multiples, and the disclosure
      discount.
