  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: audited-financials
      missingEvidence: Audited 2025 revenue, gross profit, EBITDA, and cash-flow bridge by program and consolidated level.
      whyItMatters: >-
        Without audited financials, investors cannot confidently decide whether Virta deserves an Omada-like premium or
        a steeper private-company discount.
      diligencePath: Request board-ready audited financial statements plus management bridge from annualized revenue to GAAP revenue.
    - type: private-evidence-only
      severity: material
      topic: retention-and-renewals
      missingEvidence: >-
        Customer renewal cohorts, NRR by channel, and multi-product expansion metrics for employers, health plans, and
        PBM partners.
      whyItMatters: >-
        Recurring-economics quality is a core valuation driver for B2B2C health-tech businesses and cannot be inferred
        safely from annualized revenue alone.
      diligencePath: Obtain cohort retention appendix and sales-ops dashboard used for board reporting.
    - type: missing-source
      severity: material
      topic: TV004 current-private-market-pricing
      missingEvidence: Verified transaction-level secondary pricing or a company-confirmed post-2021 financing history.
      whyItMatters: >-
        Headline valuation references are far less decision-useful than clean data on actual recent trade levels and
        preference stack changes.
      diligencePath: Request cap-table export, secondary transaction summary, and any financing documents after the 2021 Series E.
      relatedTableRefs:
        - TV004
    - type: private-evidence-only
      severity: material
      topic: program-level-unit-economics
      missingEvidence: >-
        Gross margin, care-team productivity, and contribution-margin split across diabetes, obesity, and GLP-1-related
        workflows.
      whyItMatters: >-
        Virta's premium case depends on proving that outcomes-based contracts produce attractive gross profit despite
        labor intensity.
      diligencePath: >-
        Review finance and clinical-operations model with patient-to-provider ratios, program margin bridges, and
        partner-economics tables.
