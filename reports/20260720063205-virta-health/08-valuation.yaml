  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Model
      - Latest disclosed revenue
      - Trading multiple / valuation
      - Why relevant
      - Limitation
    rows:
      - - Omada Health
        - Enterprise cardiometabolic digital care
        - $283.3M LTM; 62.4% Q1'26 gross margin
        - 4.23x EV/Sales; IPO priced at $19/share in Jun 2025
        - Closest public analogue on buyer type and condition set
        - >-
          Public-company disclosure and partner concentration make it cleaner than Virta in some ways and riskier in
          others
      - - Hims & Hers
        - Consumer telehealth + subscriptions
        - $2.37B LTM; 74% gross margin
        - 3.37x EV/Sales; ~$7.6B market cap
        - Shows what fast growth can still command in digital health
        - Consumer acquisition model is structurally different from Virta's B2B2C motion
      - - Teladoc Health
        - Scaled virtual care platform
        - $2.51B LTM; 83% access-fee revenue mix
        - 0.79x EV/Sales; ~$1.7B market cap
        - Useful downside guardrail for telehealth multiple compression
        - Mature multi-line asset with years of public-market baggage
      - - LifeMD
        - Obesity-adjacent telehealth and recurring subscriptions
        - $193.3M LTM; 25% YoY growth in 2025 filing
        - 0.89x EV/Sales; ~$0.2B market cap
        - Shows current public appetite for smaller obesity-adjacent telehealth names
        - More direct-to-consumer and less outcomes-based than Virta
    notes: >-
      Selected peers are the most decision-useful public benchmarks for business-model adjacency, not a claim that any
      one is a perfect comp.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant public digital-health peers available for model comparison at the 2026 run date,
        emphasizing enterprise metabolic care first and broader telehealth guardrails second.
