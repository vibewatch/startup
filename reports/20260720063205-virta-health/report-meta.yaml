summary:
  headline: >-
    Virta appears to be one of the higher-quality private metabolic-health companies in the
    market, but the available public record still supports tracking the business rather than
    underwriting a fresh entry at roughly $2 billion.
  overallScore: 6.5
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
