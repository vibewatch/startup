companyProfile:
  summary: >-
    Virta Health is a 2014-founded private digital-health company now headquartered in
    Denver that sells sponsor-paid virtual metabolic care for type 2 diabetes, obesity,
    prediabetes, and related chronic-condition workflows. Its public story combines a
    low-carbohydrate nutrition protocol, continuous remote clinical support, and an
    outcomes-based contracting model aimed at employers, health plans, and other risk-
    bearing buyers. The company has unusually deep peer-reviewed evidence for a late-
    stage private health-tech company and reported crossing $160 million in annualized
    revenue in September 2025 while serving 550+ organizations and 12M+ covered lives,
    but it still discloses little about audited margins, retention, or the current cap table.
  foundedDate: '2014-01-01'
  founders:
    - name: Sami Inkinen
      role: Co-Founder & CEO
      background: >-
        Public-facing co-founder who remains Virta's chief executive and principal
        spokesperson on metabolic-disease reversal and employer-sponsored care.
      claimRefs:
        - CO005
  foundingLocation: San Francisco, California
  headquarters: Denver, CO
  productSummary: >-
    Virtual metabolic-care programs combining personalized nutrition, remote clinician
    and coach support, continuous monitoring, and software workflows for diabetes
    reversal, diabetes management, obesity treatment, and prediabetes support.
  customerFocus: >-
    Self-insured employers, health plans, PBMs, and other institutional healthcare buyers
    seeking obesity, diabetes, and GLP-1 cost-management solutions.
  businessModel: >-
    B2B2C, sponsor-paid contracts with enrollment and outcomes-linked pricing; Virta has
    publicly emphasized putting a substantial share of fees at risk and has added claims-
    based ROI and GLP-1 utilization guarantees.
  stage: late-stage private
  fundingStatus: >-
