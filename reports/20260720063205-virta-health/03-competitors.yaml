- id: profiles-pricing-and-capabilities
  title: Profiles, pricing & capabilities
  body: The most important competitive split is enterprise-first versus consumer-first. Virta and Omada depend on employers, health plans, PBMs, and benefits coverage; Hims and Noom depend far more on consumer acquisition and visible offers; Weight Watchers sits between those worlds; and Teladoc can bundle metabolic support inside a wider account relationship. Public scale data underline how different those models are. Virta says it serves more than 12 million covered lives and 550-plus organizations. Omada reports 25 million-plus covered individuals, over one million members, and more than 2,000 customers. Hims and Teladoc each produce quarterly revenue above $600 million, while WW still has millions of subscribers and a growing clinical base. Pricing posture also differs sharply. Noom publishes starter and monthly price points, and Hims openly markets consumer weight-loss care. Virta instead emphasizes outcomes guarantees and custom contracting. That can be a strength for enterprise ROI
    selling, but it makes outside benchmarking much harder and preserves uncertainty around realized pricing.
  claimRefs:
