- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Vendor
  - Price / contract model
  - Included capabilities
  - Unknowns / caveats
  - Implication
  rows:
  - - Virta
    - Custom enterprise contracts; at-risk guarantees public, list prices not public
    - Clinical team, nutrition-first care, metabolic programs, outcomes guarantees
    - Realized PMPM and discounting unknown
    - Enterprise ROI story can be tailored but hard to benchmark from outside
  - - Omada
    - Enterprise coverage model, not open cash-pay checkout
    - Virtual chronic-condition care, devices, coaching, GLP-1 support track
    - Realized pricing not public
    - Competes through benefits inclusion and channel reach
  - - Teladoc
    - Enterprise and payer contracts across a broad platform
    - Integrated virtual-care services and bundled programs
    - Metabolic-specific pricing not public
    - Can cross-subsidize or bundle at account level
  - - Hims
    - Consumer telehealth transactions plus subscriptions
    - Diagnostics, prescribing, medications, app and care access
    - Medication mix and insurance economics vary
    - Fast trial path for consumers; weak fit for employer-procurement buyers
  - - Noom
    - Public cash-pay plans from $79 starter / $199 monthly on selected programs upward
    - Clinical care, medication program, app, coaching features
    - Program-specific medication economics vary
    - Price transparency lowers friction and sets consumer anchors
  - - WW
    - Consumer subscription plus growing clinical offering
    - Behavior support, GLP-1 success programming, clinical subscriptions
    - Detailed package-by-package public pricing not reviewed here
    - Hybrid brand-plus-clinic model can appeal to weight-health consumers
