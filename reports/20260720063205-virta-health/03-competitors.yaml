- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Virta Health
    - Direct
    - 12M+ lives, 550+ organizations, $160M+ annualized revenue
    - Employers, health plans, government partners
    - Reversal-first metabolic care with outcomes guarantees
    - No public list pricing; private-company disclosure gaps
  - - Omada Health
    - Direct
    - 25M+ covered lives, 1.02M+ members, 2,000+ customers, public-company reporting
    - Employers, health plans, PBMs
    - Multi-condition virtual care and expanding GLP-1 support
    - Less singularly branded around diabetes reversal
  - - Teladoc Health
    - Incumbent
    - Q1 2026 revenue $613.8M; broad integrated-care platform
    - Employers, health plans, health systems
    - Breadth and bundling power across virtual care
    - Metabolic care is one component, not the core identity
  - - Hims & Hers
    - Adjacent / substitute
    - Q1 2026 revenue about $608M; 2.6M subscribers
    - Consumer cash-pay and insured telehealth users
    - Fast D2C acquisition, diagnostics, branded GLP-1 assortment
    - Not enterprise-benefits first
  - - Noom Med
    - Adjacent / substitute
    - Consumer pricing transparency; GLP-1 and coaching programs
    - Consumers seeking weight-loss support
    - Habit-building plus visible cash pricing
    - Public scale detail is thinner than Omada, Hims, or WW
  - - Weight Watchers
    - Adjacent / incumbent brand
    - 2.8M subscribers; 130k clinical subscribers
    - Consumers and clinical weight-health users
    - Brand familiarity, community, behavioral support
    - Turnaround execution risk and public-market pressure
  - - Status quo / internal build
    - Substitute
    - PBM, PCP, and navigation stack already exists for many buyers
    - Employers, plans, PBMs
    - No new vendor needed
    - Usually fragmented and weak on integrated outcomes
  notes: Profiles compare the main ways a buyer can solve the same metabolic-care and GLP-1-support job today.
