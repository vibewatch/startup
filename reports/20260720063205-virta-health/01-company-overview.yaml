company:
  name: Virta Health
chapter:
  number: 1
  title: Company Overview
  summary: Virta Health is a Denver-headquartered, founder-led virtual metabolic-care company that says it surpassed $160M in annualized revenue in September 2025 while serving 550+ organizations and 12M+ covered lives. Public financing records show a $133M Tiger Global-led Series E at a $2B valuation in April 2021, but third-party trackers still disagree on total lifetime capital raised and current ownership details.
sections:
- id: identity-and-operating-footprint
  title: Identity & operating footprint
  body: 'Virta Health is a private, late-stage digital-health company focused on reversing metabolic disease through a nutrition-first, provider-led virtual care model. The company’s public materials consistently frame it as a care-delivery organization rather than a lightweight wellness app: members receive personalized nutrition guidance, remote clinical oversight, and technology support aimed at diabetes, obesity, and adjacent metabolic conditions. Virta’s current public footprint points to Denver as headquarters, though older press releases still reference San Francisco, which is best interpreted as a roots-versus-current-base distinction rather than a live contradiction. The company says it now covers more than 12 million U.S. lives through employer, health-plan, and government relationships, and the same enterprise distribution model underpins its current revenue scale. In other words, the core identity is not consumer subscription first; it is outcomes-oriented metabolic care sold
    mainly through institutions.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO013
  - CO016
  - CO017
  - CO030
  - CO039
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: leadership-and-governance
  title: Leadership & governance
  body: 'Founder-CEO Sami Inkinen remains the clearest anchor of Virta’s public narrative, and his biography explicitly links the company’s formation to his personal experience with prediabetes. Around him, Virta has added a more mature enterprise leadership bench: Laura Walmsley runs commercial strategy, Alok Bhushan owns finance, and Lucia Guillory leads people operations. Medical leadership is harder to read cleanly from public sources. Robert Ratner’s current profile describes him as a former chief medical officer and current advisor, which confirms continuing clinical depth but not today’s exact operating ownership. Governance disclosure is similarly partial. Virta announced former CMS administrator Don Berwick as a board member, but the reviewed source set does not provide a full, current board roster with committee structure or investor designees. That means the chapter can support strong leadership coverage, but only partial governance certainty.'
  claimRefs:
  - CO005
  - CO006
  - CO007
