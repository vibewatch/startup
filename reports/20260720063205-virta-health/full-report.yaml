  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Virta does not compete in a single neat peer set. The closest direct overlap is Omada, which also sells
              employer and plan-facing virtual chronic-condition care and is now moving aggressively into PBM-linked
              GLP-1 support. Teladoc is a broader incumbent: it can show up in the same enterprise buying process, but
              metabolic disease is only one slice of a much larger virtual-care portfolio. Hims, Noom, and Weight
              Watchers matter for a different reason. They define the consumer expectation set around obesity care,
              GLP-1 access, behavior support, and pricing visibility. Meanwhile the status quo for many buyers is not
              another branded startup at all; it is a mix of PBM coverage, primary-care advice, existing care-navigation
              vendors, or internal build efforts. The right landscape is therefore a spectrum from direct enterprise
              peer to consumer substitute. That framing matters because Virta is unlikely to lose many deals to Hims on
              exact channel overlap, but Hims and Noom can still reset what members, employers, and plans expect from
              weight-management access and convenience.
