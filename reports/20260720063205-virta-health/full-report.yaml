        title: Mitigations, monitoring & risk verdict
        blocks:
          - type: paragraph
            body: >-
              Virta does have real mitigations. Security and privacy controls are unusually detailed in public
              materials, enterprise diversification is meaningful at the logo-count level, and partner optionality
              reduces dependence on one go-to-market surface. Those strengths justify a manageable rather than
              catastrophic risk rating for now. But several residual exposures remain too large to ignore: post-breach
              trust restoration, partner concentration economics, care-team productivity, and financing opacity. The
