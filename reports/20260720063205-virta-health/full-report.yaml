            body: >-
              Customer and financial risks are more about opacity than obvious collapse. Serving more than 550
              organizations reduces simplistic logo concentration concerns, yet revenue concentration, retention,
              contract length, and renewal economics remain undisclosed. That is especially important because buyer
              caution on obesity-drug coverage is still real, and partner-led channels can either accelerate growth or
              conceal weak underlying economics. Financial-model risk is similarly under-disclosed. Public sources still
              do not reveal cash, burn, runway, or debt, despite the last clean primary round dating back to 2021. The
              company's push toward profitability helps the narrative, but it does not eliminate financing risk. Public
              comparables add a warning: even scaled digital-health peers can remain lossmaking, debt-burdened, or
              structurally marketing-heavy for long stretches. Investors should therefore treat Virta's current risk as
