      - number: '1.4'
        title: Scale, momentum & open questions
        blocks:
          - type: paragraph
            body: >-
              Virta’s most decision-useful current signals are scale and momentum. In January 2025 the company announced
              it had crossed $100 million in annualized revenue, and by September 2025 it said annualized revenue
              exceeded $160 million with more than 80% year-over-year growth. The same releases put customer footprint
              at roughly 550 organizations and more than 12 million covered U.S. lives, while the careers page
              advertises 1000-plus employees. The annual report release adds a more ambitious efficacy-and-economics
              narrative, including claims of more than $1 billion in healthcare savings and material cardiovascular-risk
              improvement. Those are strong signs of commercial relevance, but several overview questions remain open:
              the exact current board roster is not fully public, headcount is noisy across trackers, and the public
              cap-table picture remains inconsistent across third-party databases. Investors should treat Virta as a
              scaled, fast-growing private metabolic-care company with credible enterprise traction, but not as a fully
              transparent, fully disclosure-ready late-stage issuer just yet in public markets today overall.
