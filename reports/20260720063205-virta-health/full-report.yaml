  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would resolve it
    rows:
      - - Clinical moat
        - Peer-reviewed outcomes and GLP-1 off-ramp evidence support differentiated buyer ROI.
        - Most studies are not public-company-grade RCTs, and market buyers may still discount them.
        - Show independent customer-level ROI studies and audited outcomes by program.
      - - Contract quality
        - Virta has long tied fees to outcomes and now offers explicit cost guarantees.
        - At-risk pricing can still mask weak gross margins if service delivery stays labor heavy.
        - Provide program-level gross margin and realized payout history.
      - - Growth durability
        - 2025 annualized revenue and 80%+ growth suggest real demand pull.
        - Run-rate growth can cool quickly if employers gate GLP-1 coverage or delay procurement.
        - Disclose renewal, expansion, and 2026 pipeline conversion data.
      - - Exit readiness
        - IPO narrative improves if profitability and disclosure both inflect.
        - Public comps still trade at much lower multiples than a $2B Virta mark implies.
        - Publish audited revenue, gross profit, and cash-flow evidence.
    notes: The anti-thesis is deliberately valuation-specific; it is not a generic list of company risks.
