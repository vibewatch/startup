  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal & regulatory risk
        blocks:
          - type: paragraph
            body: >-
              Virta's highest-salience current risk is legal and regulatory exposure following the March 2026 data
              event. The company disclosed that unauthorized activity affected a separate repository rather than the
              live production platform, which limits the worst-case interpretation, but the event still potentially
              exposed highly sensitive health and identity information. That immediately raises breach-notification,
              HIPAA-adjacent, and state consumer-health-data risk, and it has already generated class-action
              solicitation. At the same time, Virta's own privacy and security materials show a company operating in a
              dense regulatory environment: PHI handling, sponsor reporting, and state-law consumer health rights are
              all explicitly in scope. GLP-1 policy introduces a second regulatory vector. Changes to compounding,
              supply, and Medicare coverage can help demand while also complicating compliance and competitive
              positioning. The net effect is that Virta is not facing an existential regulatory shutdown signal today,
              but it is operating in a regime where one incident, policy shift, or enforcement inquiry can quickly
              become commercially meaningful.
