  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited 2025 financials
        - Revenue, gross profit, EBITDA, and cash-flow bridge
        - Determines whether Virta deserves a premium to Omada or only a modest private uplift
        - CFO packet and auditor-reviewed financial statements.
      - - Renewal and expansion cohorts
        - Logo retention, dollar retention, and multi-product expansion by employer size
        - Validates whether annualized revenue is truly recurring at scale
        - Board deck or cohort appendix from revenue operations.
      - - Program-level unit economics
        - Gross margin by diabetes, obesity, and GLP-1-related workflows
        - Clarifies how much of the model is software leverage versus clinician labor
        - Finance + clinical operations model review.
      - - Cash runway and financing plan
        - Cash on hand, burn, covenant or debt exposure, and financing triggers
        - A late-stage private premium is dangerous without runway clarity
        - Treasury schedule and financing committee materials.
      - - Cap table and preferences
        - Any post-2021 financing, liquidation preferences, employee-liquidity programs, or secondary pricing history
        - Net returns can diverge sharply from top-line valuation headlines
        - Legal cap-table export and secondary transaction summary.
    notes: These asks focus on the small set of data that could move the recommendation, not general curiosity.
    claimRefs:
      - CV032
      - CV039
      - CV045
