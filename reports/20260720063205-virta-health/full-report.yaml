      - number: '2.4'
        title: Constraints, policy & diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The constraints matter almost as much as the tailwinds. Employer demand for GLP-1 management is real, but
              coverage expansion is still selective, as CNBC and Peterson-KFF both note. That means Virta is selling
              into a market with obvious pain but cautious buyers. Member adherence and activation remain another
              structural bottleneck: a large metabolic-disease population does not guarantee persistent program
              engagement. Policy cuts both ways as well, especially for buyers that still lack internal rules on
              obesity-drug coverage, tapering, or long-term sponsorship. Medicare’s July 2026 bridge coverage for
              certain weight-loss GLP-1s expands the importance of medication-management services, but it also invites
              more clinically integrated competitors and does not automatically create reimbursable revenue for Virta.
              The chapter’s bottom line is that Virta’s market is large, growing, and timely, but best framed as a
              constrained enterprise and payer budget problem rather than an unconstrained digital-health TAM. The
              unresolved work is to convert prevalence into conversion economics, retention curves, and channel-specific
              penetration assumptions over time.
