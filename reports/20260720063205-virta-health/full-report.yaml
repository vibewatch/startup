        title: Leadership & governance
        blocks:
          - type: paragraph
            body: >-
              Founder-CEO Sami Inkinen remains the clearest anchor of Virta’s public narrative, and his biography
              explicitly links the company’s formation to his personal experience with prediabetes. Around him, Virta
              has added a more mature enterprise leadership bench: Laura Walmsley runs commercial strategy, Alok Bhushan
              owns finance, and Lucia Guillory leads people operations. Medical leadership is harder to read cleanly
              from public sources. Robert Ratner’s current profile describes him as a former chief medical officer and
              current advisor, which confirms continuing clinical depth but not today’s exact operating ownership.
              Governance disclosure is similarly partial. Virta announced former CMS administrator Don Berwick as a
              board member, but the reviewed source set does not provide a full, current board roster with committee
              structure or investor designees. That means the chapter can support strong leadership coverage, but only
              partial governance certainty.
