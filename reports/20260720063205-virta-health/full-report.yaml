  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model & monetization
        blocks:
          - type: paragraph
            body: >-
              Virta's financial story starts with a business model that is closer to value-based care contracting than
              to classic SaaS or direct-to-consumer subscription commerce. The company sells institution-sponsored
              metabolic-care programs to employers, health plans, and related channels, then earns revenue as members
              engage and outcomes are delivered. Public materials show multiple streams sitting inside that umbrella:
              diabetes reversal, diabetes management, obesity and weight loss, and prediabetes support. Sacra's 2024 mix
              suggests diabetes reversal still led revenue, but obesity and weight-loss programs were already becoming
              meaningful contributors. Virta's pricing disclosures are unusually important because they reveal mechanics
              even when they do not reveal list prices. The 2018 model put 100% of fees at risk and explicitly rejected
              PMPM and implementation fees, while the 2025 guarantee launch added GLP-1 utilization-trend and
              weight-loss guarantees. That combination implies monetization is contract-heavy, sponsor-specific, and
              closely tied to measured performance rather than to open-ended consumer subscriptions.
