      - number: '3.3'
        title: Distribution power & switching cost
        blocks:
          - type: paragraph
            body: >-
              In this category, distribution power may matter more than any single feature. Omada's recent claim that it
              now works with all three leading PBMs and participates in Eli Lilly's Employer Connect program is
              strategically important because it lets the company reach employer accounts through the channels that
              increasingly govern obesity-drug economics. Virta is also moving in that direction, as shown by its
              Capital Rx partnership and employer-plan footprint, but the public record suggests Omada currently has the
              louder PBM-distribution signal. Teladoc's advantage is different again: incumbent virtual-care
              relationships give it bundling leverage. Buyer switching costs, however, still look moderate rather than
              hard. Benefits leaders can re-bid vendors, mix multiple service providers, or keep pieces of the workflow
              with PBMs and primary-care partners. Virta may retain some stickiness from outcomes data, care-team
              workflow, and implementation effort, but public materials do not show the kind of deep technical lock-in
              that would make replacement unusually painful. Competitive power therefore comes more from channel access,
              contract performance, and renewal proof than from proprietary technical dependence.
            claimRefs:
              - CP027
              - CP028
