      - number: '1.3'
        title: Funding & private-company status
        blocks:
          - type: paragraph
            body: >-
              Virta’s financing history shows a company that graduated from early clinical validation into a heavily
              funded enterprise-scale growth story. Official press releases document a $45 million Series B in 2018, a
              $93 million Series C in early 2020, a $65 million Series D in late 2020, and a $133 million Tiger
              Global-led Series E in April 2021. That last round set a $2 billion valuation and still serves as the
              cleanest public valuation anchor. Beyond that point, public evidence becomes messier. Chaining official
              funding milestones forward implies at least roughly $364 million of cumulative equity raised through
              Series E, while Sacra estimates $376.5 million across seven rounds and GetLatka reports only $235 million
              across three rounds. The disagreement is not trivial because it affects dilution math and ownership
              assumptions, but it does not change the bigger point: Virta remains a well-capitalized private company
              whose current public valuation context is still benchmarked primarily to the 2021 $2 billion round, with
              no confirmed IPO filing or announced sale as of the run date.
