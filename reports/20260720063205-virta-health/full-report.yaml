      - number: '8.4'
        title: Investment recommendation & diligence asks
        blocks:
          - type: paragraph
            body: >-
              The right call is track, not buy. Virta is not a pass because the underlying business appears better than
              the median digital-health asset: growth is real, outcomes proof is better than most peers, and value-based
              pricing is strategically aligned with current employer pain. But it is also not a buy at or around the
              last $2 billion reference mark, because the public market evidence does not yet support paying a
              double-digit revenue multiple for an opaque care-delivery model. Our confidence is medium rather than high
              because the open questions are not cosmetic. We still need audited 2025 revenue, a credible gross-margin
              bridge, cohort renewals or NRR, updated cap-table and preference detail, and cash-runway visibility. Until
              those items are resolved, Virta’s valuation belongs closer to a disciplined late-stage watchlist than to a
              conviction-priced entry. The upgrade path is straightforward: either a materially better entry price or
              materially better disclosure. The downgrade path is equally clear: if growth decelerates toward ordinary
              digital-health levels before transparency improves, the premium case breaks and Virta starts to look like
              another strong product attached to a public-market-incompatible multiple.
            claimRefs:
