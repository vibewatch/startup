      - number: '8.3'
        title: Key value drivers & risks
        blocks:
          - type: paragraph
            body: >-
              Virta’s premium case rests on three things public markets do still reward when they are real: clinical
              differentiation, buyer ROI, and contract alignment. The company has unusually deep peer-reviewed evidence
              for a private digital-health business, spanning early diabetes reversal data, pandemic-era weight-loss
              durability, GLP-1 deprescription support, and two-year kidney-function improvement versus usual care. Its
              commercial model also has real quality signals: Virta has long emphasized putting fees at risk, avoiding
              simple PMPM logic, and more recently guaranteeing 0% GLP-1 utilization growth and claims-based ROI for
              buyers. Those are meaningful value drivers because employers are under direct budget pressure from
              obesity-drug spending. But that same environment creates the central risk. Mercer, KFF, and Peterson-KFF
              all show that many employers are not embracing open-ended GLP-1 coverage; instead they are using coaching
              requirements, prior authorization, and even benefit pullbacks to contain spend. That helps Virta’s pitch
              as a cost-control partner, but it can also shrink the monetizable pool and sharpen procurement scrutiny.
              The other major risk is disclosure. Public sources still do not establish audited revenue, cash runway,
              renewal math, or full cap-table overhang, which means valuation can compress quickly if buyers treat Virta
              more like a promising but opaque services asset than a fully underwritten growth compounder.
