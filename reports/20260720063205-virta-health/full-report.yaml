      - number: '8.2'
        title: Valuation framework & scenarios
        blocks:
          - type: paragraph
            body: >-
              Virta should not be valued like pure software. Bessemer’s health-tech research is directionally right
              here: tech-enabled services earn recurring revenue but should be judged through both growth and
              gross-profit quality, because labor intensity and care delivery change what a revenue dollar is worth.
              Using Virta’s September 2025 annualized revenue of $160 million against the last disclosed $2 billion
              valuation implies about 12.5x revenue. That is rich versus the current public comp set of roughly 0.79x to
              4.23x EV/Sales, and it would only look obviously reasonable if Virta can prove public-company-grade
              retention, 60%+ gross margins, and a credible path to audited profitability. Our scenario work therefore
              frames today’s valuation as a price-sensitive decision rather than a yes-or-no quality judgment. The bear
              case assumes employer caution on GLP-1 coverage, slower logo conversion, and gross margins nearer the
              lower end of what a service-heavy model can sustain. The base case assumes growth slows but remains
              strong, margins settle around the low-60s, and renewal data confirm recurring economics. The bull case
              requires something stronger: audited disclosure, durable 70%+ growth, and proof that Virta’s clinical moat
              lets it earn a public-market premium closer to the best enterprise metabolic-care comps than to generic
              telehealth names.
