              Virta's customer base is broader than the phrase “employer benefit” suggests. The core motion still runs
              through self-insured employers and health plans, but the reviewed public proof shows PBM-linked channels,
              navigation partners, tribal-government style entities, and broker influence as well. That matters because
              buyer, user, and payer are not the same person in this business. Sponsors or partners decide to cover the
              program, members use it, and savings or risk reduction accrue back to the sponsoring organization. Virta's
              own scale claims make the top of the base look meaningful: more than 550 organizations, more than 12
              million covered lives, and more than 200 thousand treated members. The named logo set is also reasonably
              diverse, spanning retail, trucking, higher education, health-plan, PBM, tribal, and partner-distribution
              contexts with different buying motions and deployment assumptions. Strategically, the most valuable
              segments still appear to be large self-insured employers, payer populations facing GLP-1 cost pressure,
