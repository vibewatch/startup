      - number: '2.3'
        title: Adoption drivers
        blocks:
          - type: paragraph
            body: >-
              The biggest current driver is not just disease prevalence; it is budget shock. CNBC, KFF, and Virta’s own
              2025 materials all point to weight-loss drug economics as a forcing function for employers and payers.
              Virta’s pitch is well aligned to that reality: nutrition-first care can either substitute for GLP-1 use,
              complement it with better outcomes and tapering support, or cap trend growth with guarantees. The
              company’s 2025 launches—responsible prescribing capabilities, 0% GLP-1 utilization-trend guarantees, and
              outcome-linked pricing—show management understands that purchase decisions are increasingly driven by
              finance, forecasting discipline, and benefit-budget anxiety as much as clinical need. Broader product
              scope is another driver. By extending from diabetes reversal into obesity, prediabetes, and provider-led
              diabetes management, Virta can pursue larger budgets and solve a more complete metabolic-care problem for
              the same buyer.
            claimRefs:
              - CM018
              - CM019
