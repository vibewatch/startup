companyProfile:
  summary: >-
    Virta Health is a 2014-founded private digital-health company now headquartered in Denver that sells sponsor-paid
    virtual metabolic care for type 2 diabetes, obesity, prediabetes, and related chronic-condition workflows. Its
    public story combines a low-carbohydrate nutrition protocol, continuous remote clinical support, and an
    outcomes-based contracting model aimed at employers, health plans, and other risk- bearing buyers. The company has
    unusually deep peer-reviewed evidence for a late- stage private health-tech company and reported crossing $160
    million in annualized revenue in September 2025 while serving 550+ organizations and 12M+ covered lives, but it
    still discloses little about audited margins, retention, or the current cap table.
