            - Benefit embedding
            - Sponsor rollout
            - Member referrals
            - Channel scaling
          emotion: Seeks complementary metabolic-care value for plan sponsors
          painpoint: Data-sharing and economics are private
          opportunity: One partner can aggregate many sponsors
          label: Partner channel loop
