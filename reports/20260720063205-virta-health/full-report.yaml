  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition & module map
        blocks:
          - type: paragraph
            body: >-
              Virta's product is best understood as a virtual-care operating model for metabolic disease rather than as
              a single app. The company sells provider-led, nutrition-first care that combines coaches, clinicians, data
              collection, and sponsor reporting. Public materials make the module map relatively clear. Virta still
              anchors on type 2 diabetes reversal, but it has expanded into prediabetes support, obesity treatment, and
              provider-led diabetes management. On top of that, the weight-loss and GLP-1 materials show a more flexible
              product posture than a simple anti-medication thesis: members can pursue medication-free care, pair Virta
              with GLP-1s, or use Virta as an off-ramp after GLP-1 use. That flexibility matters because it broadens the
              addressable workflow without abandoning the company's reversal-first identity. The evidence library, data
              pages, and annual report function as part of the product, too, because enterprise buyers are effectively
              buying both care delivery, implementation confidence, and proof that the care model works consistently.
