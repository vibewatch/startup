        title: Cost structure, benchmarks & capital intensity
        blocks:
          - type: paragraph
            body: >-
              Virta's public evidence suggests a model with meaningful service-delivery cost. Continuous remote care,
              nutrition counseling, licensed practitioners, and unlimited provider access are all expensive compared
              with software-only delivery. That likely pushes gross margin below pure software and probably below some
              consumer telehealth benchmarks. Public comparables help frame the possibilities, even if none is a perfect
              analog. Omada's S-1 shows that enterprise chronic-care businesses can reach meaningful scale while still
              spending heavily on sales and marketing. Hims' 2026 10-Q shows strong gross profit but also huge marketing
              and operations/support expense, a reminder that consumer scale is not free. Teladoc and WW show that even
              public, larger-scale virtual-care and weight-management platforms still wrestle with losses,
              restructuring, or heavy liquidity needs. Virta probably benefits from lower capex and inventory intensity
              than product-heavy models, but its main economic challenge is likely labor productivity: how many
              enrolled, active members each coach, clinician, and support team can profitably manage while preserving
              outcomes.
