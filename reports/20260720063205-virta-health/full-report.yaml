  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Comparable company benchmarks
        blocks:
          - type: paragraph
            body: >-
              The closest public analogue to Virta is Omada rather than Hims, Teladoc, or LifeMD. Omada is the only comp
              in this set that combines enterprise buyers, chronic-condition workflows, and evidence-backed
              cardiometabolic programs at meaningful scale, and its public disclosures show both what good looks like
              and how hard it still is. Omada priced its June 2025 IPO at $19 per share, reported $78.0 million of
              first-quarter 2026 revenue with a 62.4% gross margin, and now trades at roughly 4.23x EV/Sales on $283.3
              million of trailing revenue. Hims is growing quickly and carries a larger equity value, but its 3.37x
              EV/Sales multiple still reflects consumer-acquisition intensity and thinner strategic fit with Virta’s
              employer and health-plan motion. Teladoc and LifeMD are useful downside guardrails: both prove that
              telehealth scale alone does not secure premium multiples when growth, profitability, or model clarity
              waver. Put differently, Virta can argue for a premium to most public comps because of outcomes-based
              pricing and deeper metabolic-care evidence, but the public market still says that even high-quality
              digital-health companies need transparent margins, durable renewals, and audited financials before
              investors consistently pay more than low-to-mid single digit revenue multiples.
