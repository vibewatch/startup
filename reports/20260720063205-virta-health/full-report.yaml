chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity & operating footprint
        blocks:
          - type: paragraph
            body: >-
              Virta Health is a private, late-stage digital-health company focused on reversing metabolic disease
              through a nutrition-first, provider-led virtual care model. The company’s public materials consistently
              frame it as a care-delivery organization rather than a lightweight wellness app: members receive
              personalized nutrition guidance, remote clinical oversight, and technology support aimed at diabetes,
              obesity, and adjacent metabolic conditions. Virta’s current public footprint points to Denver as
              headquarters, though older press releases still reference San Francisco, which is best interpreted as a
              roots-versus-current-base distinction rather than a live contradiction. The company says it now covers
              more than 12 million U.S. lives through employer, health-plan, and government relationships, and the same
              enterprise distribution model underpins its current revenue scale. In other words, the core identity is
              not consumer subscription first; it is outcomes-oriented metabolic care sold mainly through institutions.
