            body: >-
              The core workflow is operationally specific and heavily human-guided. Members enroll through a sponsor or
              partner path, begin logging nutrition and biomarker data, receive ongoing interventions from coaches and
              providers, and then move through medication-adjustment or GLP-1 pathways as needed. AutoZone's case study
              makes that workflow concrete by describing nutrition counseling, behavior support, and continuous medical
              supervision. Publicly, the nearest thing to an architecture diagram comes from Virta's careers and
              security materials. The careers page frames Virta as a full-stack healthcare company building products for
              patients, clinicians, commercial clients, and enrollment, while also claiming data science and machine
              learning provide real-time interventions and clinical guidance. The security page adds the infrastructure
              layer: GCP hosting, mirrored data, nightly backups, documented SDLC, and formal incident response. Taken
              together, the architecture looks like a care-delivery stack with software assistance, not a pure
