  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary & burden
        blocks:
          - type: paragraph
            body: >-
              Virta’s market cannot be understood by slapping a generic “digital health” label on the business. The
              relevant market is virtual metabolic care: diabetes reversal and management, obesity treatment,
              prediabetes support, and increasingly GLP-1 cost-management wrapped around lifestyle and clinical
              guidance. That is broader than a point solution for type 2 diabetes, but narrower than the entire
              obesity-pharma or wellness ecosystem. The cleanest burden lens comes from prevalence and cost rather than
              one analyst TAM slide or a single vendor-produced market map alone today. Official U.S. sources put
              diabetes prevalence around 38.4 to 40.1 million people, and NIDDK still shows more than 2 in 5 adults with
              obesity. Virta’s own materials frame the annual burden of obesity, overweight, and type 2 diabetes at $586
              billion. Those figures justify why employers and payers care. They do not mean Virta’s addressable revenue
              is hundreds of billions; they mean the disease burden is massive while the monetizable service layer is a
              much narrower slice.
