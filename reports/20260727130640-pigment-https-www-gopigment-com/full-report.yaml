      - number: '3.3'
        title: Moat durability, disclosure asymmetry, and residual risks
        blocks:
          - type: paragraph
            body: >-
              Pigment’s moat is visible, but it is not unassailable. The strongest durable elements in the fetched
              evidence are the Graphite architecture, the linkage between planning data and agent workflows, and the
              combination of internal and external AI surfaces through Analyst, Modeler, and MCP. Those ingredients make
              Pigment more than a spreadsheet replacement. However, public incumbents retain powerful structural
              advantages: Workday and Oracle have known procurement pathways, OneStream and Workday provide
              public-company style disclosure, and Anaplan’s historical filings show the scale of the legacy category
              Pigment is attacking. That disclosure asymmetry matters because private-company opacity makes Pigment
              harder to benchmark on realized pricing, win rates, or retention. The competitive picture is also
              incomplete at the public-web level. G2 review content was inaccessible, SAP’s target page did not load,
              and public pricing remains thin across most vendors. Those gaps do not erase the competitive case for
              Pigment, but they mean the diligence verdict should remain conditional on management-side data about
              discounts, expansion, and win-loss performance. That is why management diligence should focus less on
              homepage language and more on real competitive outcomes in enterprise bake-offs, implementation timelines,
              and post-land expansion behavior, renewal quality, and multi-function deployment depth after the first
              production use case in daily practice broadly.
