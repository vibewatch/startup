      - number: '8.4'
        title: Recommendation, anti-thesis, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              The recommendation from public evidence alone is research-more, with medium confidence and a stretched
              valuation stance. Pigment looks like a real company with a strong product narrative, elite customer logos,
              measurable workflow value, and respectable enterprise controls. Those facts deserve credit. But public
              evidence still stops short of the data needed for a buy call at the last disclosed valuation: there is no
              audited revenue, no public retention stack, no open sales-efficiency data, and limited transparency on how
              broadly customer proof converts into durable monetization.


              The anti-thesis is therefore straightforward: Pigment could be a genuinely strong planning company whose
              valuation still runs ahead of provable operating scale. That is not a reason to avoid the asset forever,
              but it is a reason to insist on disciplined diligence asks and explicit thesis-break triggers. If Pigment
              can show strong ARR, NRR, low gross churn, and healthy multi-product expansion, the case improves
              materially. Without that, the current mark looks fair-to-stretched rather than clearly attractive.
            claimRefs:
              - CV022
              - CV023
