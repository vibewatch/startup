  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform positioning, and current operating footprint
        blocks:
          - type: paragraph
            body: >-
              Pigment currently presents itself as an AI-native enterprise planning company rather than a narrow
              budgeting tool. The homepage tagline is explicit—“Agentic AI for enterprise business planning”—and the
              core product message is that Pigment helps organizations run real-time planning across finance and
              adjacent operating functions. Company-authored materials consistently anchor the identity on the Graphite
              architecture, which Pigment describes as patent-pending and built for elastic compute, dynamic modeling,
              and governed context for AI agents. The same materials show the company is not merely marketing AI
              wrappers around spreadsheets: Pigment highlights integrated planning across finance, sales, HR,
              operations, and supply-chain workflows, plus live integrations with systems such as SAP, NetSuite,
              Salesforce, and Google Sheets. Operationally, the company says it was founded in 2019, is headquartered in
              Paris, and now lists a multi-office footprint spanning Paris, London, New York, Toronto, and San
              Francisco. Pigment’s current scale claim is 650 employees across 40 nationalities, which is directionally
              consistent with the office-expansion narrative in North America but still remains a company-authored
              figure rather than an independently audited disclosure.
