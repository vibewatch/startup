      - number: '1.3'
        title: Funding chronology, milestones, and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Pigment’s own announcement trail is sufficient to reconstruct a credible financing chronology even though
              some secondary links were inaccessible during the run. The 2021 press release describes a $73 million
              Series B led by Greenoaks, the September 2022 release describes a $65 million Series B+ led by IVP and
              Meritech, the June 2023 release describes an $88 million Series C that brought lifetime funding to $248
              million, and the April 2024 materials describe a $145 million Series D led by ICONIQ Growth. The company
              paired those rounds with aggressive growth claims: 600% revenue growth and 10x user growth in 2022, then
              tripled ARR and doubled customer count in the run-up to Series D. Pigment also framed 2025 as a strategic
              expansion year, announcing Google Cloud marketplace availability and sovereign-cloud deployment through
              S3NS. The adverse side is not a fraud signal but an evidence-quality signal. Reuters, Business Wire,
              TechCrunch, G2, and IVP did not provide fully usable corroboration in the fetched outputs, which
              constrains independent confirmation of valuation framing, board composition, and product reviews.
              MarketsandMarkets also provides a skeptical counterweight: the broader EPM market grows at a far slower 7%
              CAGR than AI optimism alone might imply, so Pigment still needs share gains—not just market tailwinds—to
              justify growth expectations. The net result is a company overview with strong official-source coverage on
              identity, product posture, and chronology, but with still-incomplete outside evidence on governance detail
              and independent review quality.
