      - number: '5.3'
        title: Integrations, governance, and compliance posture
        blocks:
          - type: paragraph
            body: >-
              Pigment's platform and integration surfaces make data connectivity central to the value proposition. ERP,
              CRM, HRIS, spreadsheets, data lakes, BI tools, and storage systems are all presented as first-class
              inputs. The product pitch is that planning should not depend on periodic spreadsheet stitching; data
              should arrive through connectors, APIs, and scheduled imports so models stay current. Use-case pages for
              finance and supply chain reinforce this by linking real-time or frequent updates to more agile forecasting
              and faster scenario response.


              Security and compliance are materially more detailed than the average marketing site. Pigment publishes
              SAML 2.0 SSO, SCIM provisioning, MFA, domain allowlisting, group-based RBAC, fine-grained data rights,
              audit trail export, AES-256 at-rest encryption, TLS 1.2+ in transit, data residency in Frankfurt or
              Oregon, sovereign hosting via S3NS, and explicit disaster-recovery targets of six-hour RTO and 24-hour
              RPO. That is enough disclosure to support enterprise buyer diligence, even though deeper implementation
              detail and external audit artifacts would still need data-room review.
