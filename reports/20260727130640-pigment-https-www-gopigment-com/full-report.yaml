  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction signals
        blocks:
          - type: paragraph
            body: >-
              Pigment’s public materials imply a classic enterprise-software monetization model even though they stop
              short of exposing list pricing or GAAP revenue. The finance use-case page, platform page, and customer
              stories point to subscription-led planning software sold into finance teams and then expanded into
