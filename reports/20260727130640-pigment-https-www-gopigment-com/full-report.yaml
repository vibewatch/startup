  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Pigment’s regulatory exposure is not driven by a single enforcement action visible in public sources, but
              by the fact that it sits at the intersection of sensitive business data, AI-assisted workflows, and
              European privacy law. The company’s privacy policy explicitly places parts of its data processing under
              GDPR and French law, while CNIL’s role as France’s data-protection authority matters because Pigment is a
              French entity. On top of privacy, the AI Act creates a moving compliance perimeter around transparency,
              governance, human oversight, and potentially higher-risk uses of AI in employment, finance-adjacent, or
              business-critical decision support. Pigment’s own security page says its AI framework is aligned with the
              EU AI Act, but that is a forward-looking control claim, not substitute evidence of completed compliance.


              The legal-surface risk is subtler: Pigment’s security marketing is much richer than its public contractual
              legal surface. In this run, privacy and legal-notice pages were fetchable, but terms of service were not
              clearly surfaced. That does not prove a contractual problem, but it does mean diligence should treat legal
              review as an open item rather than a box already checked.
            claimRefs:
