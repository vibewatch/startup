  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and module map
        blocks:
          - type: paragraph
            body: >-
              Pigment sells an enterprise planning platform rather than a single-team point solution. Across the
              homepage and use-case surfaces, the product is consistently framed as one governed environment for FP&A,
              consolidation, revenue planning, workforce planning, supply chain planning, and S&OP. That breadth matters
              because Pigment is not trying to win only as a finance dashboard or an AI chat wrapper; it is trying to
              become the planning layer that multiple functions operate from every day. The product promise is a single
              source of truth, shared business logic, and models that can be adjusted without rebuilding the entire
              stack whenever the organization changes shape.


              The module story is credible on breadth. Finance pages emphasize budgeting, forecasting, reporting, and
              variance analysis. RevOps and SPM pages cover sales planning. Headcount and workforce pages connect hiring
              and cost plans. Supply-chain and S&OP pages push Pigment into operational planning. Consolidation is
              present, though less specialized than dedicated close vendors. The net takeaway is that Pigment's product
              perimeter is intentionally cross-functional, with AI layered on top of an already broad planning substrate
              rather than serving as the product by itself.
