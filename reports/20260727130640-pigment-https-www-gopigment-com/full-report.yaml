  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation context and evidence quality
        blocks:
          - type: paragraph
            body: >-
              Pigment’s valuation case starts with one hard anchor and several soft ones. The hard anchor is the April
              2024 Series D, which Reuters’ URL title and Pigment’s own careers page align around as a $145 million
              round at a $1 billion-plus valuation. Everything after that is softer: Pigment remains private, does not
              publish audited revenue, and provides only selective scale signals such as 650 employees, marquee
              investors, and enterprise customer stories. That means the analyst’s job is not to pretend precision
              exists where it does not. It is to define the range of outcomes that could plausibly support or undercut
              the last financing mark.


              The evidence quality problem is therefore central, not peripheral. Pigment has stronger product and
              customer proof than many private SaaS companies, but weaker monetization disclosure than a filing-backed
              comp like OneStream. This pushes the recommendation away from simple company-quality scoring and toward
              price-sensitive scenario analysis. In practical terms, the correct question is not “is Pigment good?” but
              “what evidence would make $1 billion-plus look justified, cheap, or expensive?”
            claimRefs:
              - CV004
              - CV005
              - CV031
              - CV032
