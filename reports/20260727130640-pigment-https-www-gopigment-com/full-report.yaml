        title: Graphite architecture and agent operating model
        blocks:
          - type: paragraph
            body: >-
              Graphite is the core technical narrative. Pigment presents it as patent-pending infrastructure made up of
              elastic compute, unified governed data, and dynamic modeling. The platform page is unusually explicit that
              parallel processing and concurrency are meant to keep human workflows responsive while AI agents operate
              on the same planning model. That is a meaningful architectural claim because it implies Pigment's AI layer
              is not supposed to run on a stale copy of data or on a disconnected analytics sandbox. Instead, Graphite
              is sold as the substrate that makes live model interaction, scenario propagation, and governed context
              available to both humans and agents.


              The MCP announcement extends that architecture outward. Pigment's MCP server is positioned as a universal
              connector so Claude, ChatGPT, ServiceNow, and Agentforce can query live Pigment context, reuse business
              rules, and trigger missions. Anthropic's own MCP materials and the public specification support the
              protocol framing, while the GitHub server repository indicates real developer ecosystem momentum around
              the standard. Strategically, this turns Pigment from a closed EPM application into an AI-connected
