  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and substitute classes
        blocks:
          - type: paragraph
            body: >-
              Pigment does not compete in a simple one-peer race. The fetched set shows at least three overlapping
              alternative classes. First are incumbent enterprise suites such as Oracle, Workday, OneStream, and the
              historical public-company version of Anaplan; these vendors sell trust, breadth, procurement familiarity,
              and broad finance coverage. Second are modern FP&A challengers such as Planful, Vena, Cube, Abacum, and
              Mosaic, which emphasize usability, workflow speed, and targeted modernization of spreadsheet-heavy teams.
              Third is the status quo: internal spreadsheet models plus partial planning, BI, and ERP tooling.
              Analyst-market data supports that all of these vendors sit inside the broader EPM arena, but their
              competitive posture is not identical. Pigment’s own product surfaces show why buyers take it seriously:
              the company combines integrated business planning, governed data, internal AI agents, and external MCP
              connectivity in one narrative. That is broader than a single dashboard feature, yet narrower than the full
              Office-of-the-CFO sweep claimed by some incumbents. Another useful lens is buyer starting point.
              Finance-led transformations often short-list incumbents first because they already have close, ERP, or HCM
              relationships, while digitally native teams are more willing to consider Pigment, Vena, Cube, or Abacum
              when ease of model change matters more than suite consolidation.
