- id: leadership-people-and-governance
  title: Founders, workforce signals, and governance visibility
  body: 'Founding-team evidence is strongest on identity and lighter on formal governance. Pigment’s own pages consistently identify Éléonore Crespo and Romain Niccoli as founders and current co-CEOs. The most specific founder-background detail inside the fetched set comes from Pigment’s Series B announcement, which describes Crespo as coming from Google and Index Ventures and Niccoli as Criteo’s former co-founder and CTO. This gives the company credible strategy-and-product founder-market fit for enterprise planning software, although it does not corroborate every biographical detail often repeated in secondary profiles. On people signals, the careers page is unusually rich for a private company: it claims a 91% eNPS in late 2024, a 76/100 EgaPro score in 2025, and an annual promotion rate of roughly 20% of eligible employees. Those claims suggest strong internal confidence and upward mobility, but they are still self-reported. Governance is materially less transparent. Pigment says its
    investor board includes ICONIQ Growth, IVP, and Meritech, yet the fetched materials do not identify named directors, observer rights, or control provisions. That omission leaves a meaningful diligence gap around board composition, succession planning, and investor influence. It also means later diligence should test whether people metrics remain durable during continued expansion.'
