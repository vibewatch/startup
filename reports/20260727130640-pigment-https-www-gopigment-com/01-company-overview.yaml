- calloutType: strength
  title: Security and deployment posture is unusually explicit for a private SaaS company
  body: Pigment’s security page gives concrete controls—SAML, SCIM, MFA, regional hosting, RTO/RPO, SOX language, and S3NS sovereign deployment—rather than generic “enterprise-ready” marketing. That level of operational specificity improves diligence confidence on trust posture versus many private software vendors.
