- id: differentiation-risks
  title: Differentiation versus incumbents and technical risks
  body: 'Pigment''s strongest differentiation is not just that it has AI agents, but that it ties them to a governed multidimensional model that spans several planning domains. The platform story is coherent: cross-functional scope, a shared semantic layer, scenario-native modeling, and connectors that keep operating context live. The implementation guide also suggests Pigment sees enablement as part of the product, using a co-build motion to reduce long-term dependence on outside integrators. This is important because buyer success in EPM often depends as much on internal model ownership as on raw feature count.


    The main risk is proof depth. Independent critiques from Lokad and CFO Shortlist both argue that Pigment is strongest in collaborative planning and speed-to-value, not in extreme complexity, specialized close management, or native operational optimization. Meanwhile, incumbents like Anaplan and OneStream now use similarly AI-forward messaging. That means Pigment''s real moat has to come from implementation outcomes, model flexibility, and trust architecture, not merely from saying "agentic" first.'
