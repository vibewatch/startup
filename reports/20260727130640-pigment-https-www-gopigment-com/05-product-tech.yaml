chapter:
  number: 5
  title: Product & Technology
  summary: Pigment's product story is built around Graphite, a patent-pending planning engine that combines elastic compute, governed enterprise data, and dynamic modeling so AI agents and human operators can work from the same planning context. The technology surface is broad across finance, revenue, workforce, supply chain, integrations, and security, while the main risks are limited public benchmark detail and growing competitive parity in AI-first planning messaging.
sections:
- id: product-definition
  title: Product scope and module map
  body: 'Pigment sells an enterprise planning platform rather than a single-team point solution. Across the homepage and use-case surfaces, the product is consistently framed as one governed environment for FP&A, consolidation, revenue planning, workforce planning, supply chain planning, and S&OP. That breadth matters because Pigment is not trying to win only as a finance dashboard or an AI chat wrapper; it is trying to become the planning layer that multiple functions operate from every day. The product promise is a single source of truth, shared business logic, and models that can be adjusted without rebuilding the entire stack whenever the organization changes shape.


    The module story is credible on breadth. Finance pages emphasize budgeting, forecasting, reporting, and variance analysis. RevOps and SPM pages cover sales planning. Headcount and workforce pages connect hiring and cost plans. Supply-chain and S&OP pages push Pigment into operational planning. Consolidation is present, though less specialized than dedicated close vendors. The net takeaway is that Pigment''s product perimeter is intentionally cross-functional, with AI layered on top of an already broad planning substrate rather than serving as the product by itself.'
  claimRefs:
