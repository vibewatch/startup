  evidenceGaps:
  - type: missing-source
    severity: material
    topic: graphite-benchmarks
    missingEvidence: Third-party benchmark data on Graphite throughput, model size, and concurrency under load.
    whyItMatters: The core technology claim is performance at scale, but public materials do not quantify throughput or latency.
    diligencePath: Request benchmark methodology, customer reference architectures, and any independent load-test results.
  - type: missing-source
    severity: material
    topic: agent-guardrails
    missingEvidence: Detailed approval workflows, fallback logic, and audit samples for Pigment AI agent actions.
    whyItMatters: Enterprise buyers need to know how much automation is actually delegated versus merely suggested.
    diligencePath: Ask for product documentation or demo scripts showing permission checks, approvals, and rollback paths.
  - type: private-evidence-only
    severity: minor
    topic: connector-depth
    missingEvidence: Connector-by-connector capability matrix covering write-back, refresh cadence, and admin overhead.
    whyItMatters: Implementation burden depends on the last-mile connector details more than on category-level marketing lists.
    diligencePath: Request the live connector catalog and implementation references by system of record.
