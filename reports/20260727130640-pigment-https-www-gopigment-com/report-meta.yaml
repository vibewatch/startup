companyProfile:
  summary: "Pigment is a Paris-founded enterprise business planning and performance management SaaS platform, repositioned as 'agentic AI for enterprise business planning.' Built on its patent-pending Graphite engine, Pigment offers FP&A, xP&A, revenue planning, workforce planning, supply chain planning, and ESG reporting in a single unified platform. The company was founded in 2019 by Éléonore Crespo and Romain Niccoli, raised $145 million in a Series D in April 2024 at a $1 billion-plus valuation, and employs approximately 650 people across Paris, New York, San Francisco, London, Toronto, and other offices. Key customers include Unilever, Merck, Datadog, eBay, Figma, Brex, and Subway. The company is backed by ICONIQ Growth, IVP, Meritech, Bpifrance, Singular, and Frst."
