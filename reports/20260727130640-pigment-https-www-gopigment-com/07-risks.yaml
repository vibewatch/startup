chapter:
  number: 7
  title: Risks
  summary: Pigment’s risk profile is strongest around privacy and AI-governance compliance, partner dependence on cloud and sovereign-hosting layers, and adoption mismatch for buyers whose needs are simpler or more specialized than Pigment’s ideal fit. Published controls are substantial, but the product’s growing MCP openness and sensitive-data centralization mean residual risk remains material until contracts, benchmarks, and cohort metrics are reviewed directly.
sections:
- id: regulatory-legal
  title: Regulatory and legal risk
  body: >-
    Pigment’s regulatory exposure is not driven by a single enforcement action visible in public sources, but by the fact that it sits at the intersection of sensitive business data, AI-assisted workflows, and European privacy law. The company’s privacy policy explicitly places parts of its data processing under GDPR and French law, while CNIL’s role as France’s data-protection authority matters because Pigment is a French entity. On top of privacy, the AI Act creates a moving compliance perimeter around transparency, governance, human oversight, and potentially higher-risk uses of AI in employment, finance-adjacent, or business-critical decision support. Pigment’s own security page says its AI framework is aligned with the EU AI Act, but that is a forward-looking control claim, not substitute evidence of completed compliance.


    The legal-surface risk is subtler: Pigment’s security marketing is much richer than its public contractual legal surface. In this run, privacy and legal-notice pages were fetchable, but terms of service were not clearly surfaced. That does not prove a contractual problem, but it does mean diligence should treat legal review as an open item rather than a box already checked.
  claimRefs:
  - CR004
  - CR005
  - CR015
  - CR016
  - CR032
  - CR034
  - CR042
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-security
  title: Operational, security, and technical risk
  body: >-
    Operationally, Pigment’s biggest strength and biggest risk come from the same fact: it centralizes planning data and logic. Security disclosures are unusually specific for a SaaS planning vendor, including SAML, SCIM, MFA, RBAC, audit-trail export, regional residency, encryption, and explicit RTO/RPO targets. Those are real mitigants. They make Pigment more credible for enterprise use and reduce some basic vendor-risk concerns. But they also highlight the blast radius if the platform fails. A planning environment that touches finance, workforce, revenue, and operations becomes business-critical infrastructure, not just another analytics layer.


    Technical openness adds another layer of risk. Pigment’s MCP strategy is powerful because it brings external assistants into live planning context, yet that same openness expands the governance perimeter. Customer stories from Docker and Carta show that teams are already using Pigment for important recurring workflows, which increases the operational consequences of model errors, access-control mistakes, or poor AI approvals. Public adverse commentary also suggests Pigment’s optimization and extreme-complexity claims need careful testing, not blind acceptance.
