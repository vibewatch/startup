- id: partner-dependency
  title: Partner and ecosystem dependency risk
  body: >-
    Pigment’s partner map is now central to the risk profile. The Google Cloud partnership and the S3NS sovereign-cloud route are both strategic assets, but they also mean Pigment depends on third parties for infrastructure scale, sovereignty packaging, and part of its compliance story. S3NS and Thales materials make the sovereign-hosting proposition sound strong, with SecNumCloud qualification, annual audits, and operational segregation. Still, those benefits are partly delivered by partner-controlled structures. If a critical regulated customer buys Pigment because of S3NS, then S3NS execution becomes part of Pigment’s product risk whether Pigment likes it or not.


    The MCP ecosystem creates a second dependency layer. Anthropic introduced the protocol, the public spec and GitHub repositories evolve outside Pigment, and governance is moving toward the Agentic AI Foundation. That is healthy for interoperability, but it also means roadmap direction, client quality, and ecosystem expectations are not solely Pigment-controlled. The company is therefore exposed to both platform-partner risk and open-standard risk at the same time.
  claimRefs:
  - CR006
