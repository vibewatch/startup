- id: people-financial-mitigation
  title: People, execution, and mitigation thresholds
  body: >-
    Public people signals suggest a company that is scaling aggressively but wants to preserve culture and internal mobility. The careers page references 650 employees, 40 nationalities, a 91% eNPS, and a 20% annual promotion rate. Those are positive signals, yet they do not remove execution risk. Large-scale implementations and customer success motions can drift in quality as headcount scales, and review-based evidence already suggests some users perceive mismatch between the product’s flexibility and what smaller or simpler teams actually need. That means enablement quality, scoping discipline, and ongoing service consistency are part of the product risk, not separate from it.


    Financial-model risk is mostly indirect in this chapter. Pigment operates in a large EPM category with strong incumbents and attractive growth narratives, which can encourage aggressive positioning. If renewal quality, implementation speed, or compliance assurance underperform what the product narrative implies, the downside can transmit quickly into customer trust, expansion, and valuation. The practical response is to define hard kill criteria before investment or major procurement proceeds.
