  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: contract-surface
    missingEvidence: Current MSA, ToS, DPA, and AI-feature contractual language.
    whyItMatters: Legal risk cannot be closed from marketing and privacy pages alone.
    diligencePath: Request contract set and redlines before proceeding.
  - type: missing-source
    severity: material
    topic: benchmark-proof
    missingEvidence: Independent benchmark, incident, and DR test evidence for Graphite and AI features.
    whyItMatters: Operational risk severity depends on how the platform behaves under real load and failure conditions.
    diligencePath: Request benchmark pack, uptime history, and DR exercise evidence.
  - type: missing-source
    severity: material
    topic: customer-fit-cohorts
    missingEvidence: Churn, expansion, and implementation success by segment and use case.
    whyItMatters: Adoption-friction evidence is visible, but its incidence is not.
    diligencePath: Request cohort retention, rollout success, and lost-deal data by segment.
