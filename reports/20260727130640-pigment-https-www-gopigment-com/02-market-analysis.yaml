chapter:
  number: 2
  title: Market Analysis
  summary: Pigment sells into a broad xP&A and EPM market spanning finance, sales, workforce, supply-chain, and ESG planning. Public sources support a core EPM TAM of roughly $8.3 billion by 2027, but SAM and SOM require estimation because category breakouts are blurry and vendor overlap is substantial.
sections:
- id: market-boundary
  title: Market boundary and buyer jobs
  body: 'Pigment’s directly fetched product surface makes the market boundary clearer than a generic “planning software” label. The company does not market only budgeting or only finance reporting. Instead, it presents an integrated business-planning platform with explicit workflow coverage for finance, sales forecasting, headcount planning, supply chain, financial consolidation, and ESG. That breadth is the signature of xP&A: multiple functional plans sharing one governed data model rather than siloed departmental spreadsheets. The most relevant status-quo substitutes are spreadsheet models, legacy EPM suites, and point solutions owned by finance, RevOps, HR, or operations. Buyers are usually led by finance because the budget, forecast, and consolidation layer creates the initial organizing need, but the end-user surface expands to sales, workforce, and supply-chain operators when the implementation succeeds. Pigment’s own scenario-planning content also shows why the market has widened:
    executives want systems that can maintain multiple futures at once rather than rerun static annual budgets after each disruption. That job-to-be-done is broader than classic FP&A and explains why vendor competition increasingly spans both incumbent EPM vendors and newer AI-first challengers.'
  claimRefs:
