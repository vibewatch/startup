- id: market-sizing
  title: TAM, SAM, and SOM
  body: 'The cleanest public market anchor in the fetched set is the MarketsandMarkets forecast for enterprise performance management: $8.3 billion by 2027 at a 7.0% CAGR. That is meaningful because it is both large enough to support several scaled vendors and slow enough to challenge narratives that planning software will automatically inherit AI-era growth multiples. The same source also shows a much larger AI-in-finance adjacency, but that number should be treated as contextual tailwind rather than Pigment’s direct TAM because it includes products far outside business-planning software. For underwriting Pigment, the better approach is evidence-constrained slicing. Pigment’s use-case set implies a multi-function cloud-planning subset of EPM rather than the entire market, which supports a conservative SAM range in the low single-digit billions rather than the full $8.3 billion. SOM should be narrower again because Pigment is best matched to complex, collaborative, cross-functional deployments
    that value governed modeling, AI support, and fast scenario iteration. Public web evidence is good enough to show Pigment is in a real, competitive, and expanding category, but not good enough to derive a precise bottoms-up market share equation without customer counts, win rates, or segment revenue data. This also means valuation models should separate category growth from share-capture execution, because public TAM numbers alone can make the market look easier than the competitive reality suggests.'
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM036
