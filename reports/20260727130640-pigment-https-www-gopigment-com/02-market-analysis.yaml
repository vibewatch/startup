callouts:
- calloutType: insight
  title: Pigment’s real market is wider than finance-only planning
  body: The fetched use-case set clearly places Pigment in cross-functional xP&A rather than only FP&A. That matters because it expands account value, but it also broadens the competitive set from legacy planning tools to enterprise-wide operating platforms.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM006
  - CM007
- calloutType: risk
  title: Public TAM data overstates Pigment’s direct opportunity if used naively
  body: The easiest published market number is the broad EPM TAM, but that number includes revenue pools Pigment does not necessarily win directly. A practical underwriting model should apply explicit discounts for segment overlap, incumbent lock-in, and deployment complexity.
  claimRefs:
  - CM010
  - CM036
  - CM037
  - CM038
