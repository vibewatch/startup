  evidenceGaps:
  - type: missing-source
    severity: material
    topic: xP&A SAM precision
    missingEvidence: A paid analyst breakout isolating xP&A cloud-planning spend from the broader EPM market.
    whyItMatters: Public sources size the broad category well but do not cleanly separate Pigment’s direct addressable spend from adjacent close, reporting, or analytics software.
    diligencePath: Obtain analyst databases, pipeline data, or customer-segment revenue by use case to refine SAM and SOM.
    relatedQuestionRefs:
    - QM015
    - QM016
  - type: access-blocked
    severity: minor
    topic: SAP benchmark coverage
    missingEvidence: Readable SAP financial-planning product detail from a stable direct URL.
    whyItMatters: SAP is a listed EPM incumbent, but the direct page used in this run returned a not-found result, limiting one leg of the incumbent comparison.
    diligencePath: Locate an alternate SAP planning URL or capture an archived copy before the competitor chapter deep dive.
    relatedQuestionRefs:
    - QM017
    - QM025
