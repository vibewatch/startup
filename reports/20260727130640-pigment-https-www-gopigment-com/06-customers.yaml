- id: proof-quality-durability
  title: Proof quality, satisfaction, and retention visibility
  body: 'Pigment clears the minimum bar for customer-proof because the official site provides named customer stories with detailed quotes and workflow descriptions, and independent surfaces such as Gartner Peer Insights and CaseStudies.com add external packaging. Gartner also adds an important balancing signal: while the aggregate reputation remains strong, the reader-visible critical review argues Pigment can feel like a finance-centric product sold too broadly and that adoption can lag when the use case is simpler or the team has limited modeling depth. Cube and CFO Shortlist reinforce that the learning curve, complexity, and fit for small or non-finance teams are the main publicly visible points of friction.


    Where evidence remains thin is durability. Pigment does not publicly disclose NRR, GRR, logo churn, renewal rates, or cohort behavior on the reviewed surfaces. The best retention proxies are embeddedness and expansion: customers discuss regular close cycles, recurring reports, executive dashboard usage, multiple workstreams, and additional team adoption over time. Those are useful signals, but they are still proxies. Any investment or procurement decision would need direct churn and renewal data before calling the customer base highly durable.'
  claimRefs:
