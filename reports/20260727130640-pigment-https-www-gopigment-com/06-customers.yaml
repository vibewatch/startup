  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, renewal rates, and logo churn by segment.
    whyItMatters: Durability is the hardest part of the customer story to verify from public sources.
    diligencePath: Request cohort retention, renewal, and churn data by module and segment.
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue contribution of top customers and vertical mix.
    whyItMatters: Public logos do not reveal whether revenue is diversified or concentrated.
    diligencePath: Request top-10 customer concentration and revenue by industry.
    relatedTableRefs:
    - TU002
  - type: access-blocked
    severity: minor
    topic: review-platform-depth
    missingEvidence: Full open-text G2 review corpus or export.
    whyItMatters: Independent satisfaction and complaint evidence is stronger with large review samples.
    diligencePath: Re-run with buyer access or request exported review summaries from the company.
