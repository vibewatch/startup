- id: named-proof
  title: Named deployments and observable customer outcomes
  body: 'The quality of Pigment’s named customer proof is unusually strong for a private planning vendor because several stories go beyond logo display into specific operational outcomes. Carta reports an 80% cut in data aggregation and manual calculation time, plus additional savings in weekly ARR reporting and departmental deep dives. Fivetran reports roughly 12 hours saved per month on executive reporting. Docker describes 30–50% lower time spent on close commentary and review, plus substantially faster model changes with the Modeler Agent. Figma says collaborative planning replaced siloed Excel models and that the Modeler Agent moved work from weeks to hours while filling in over 80% of model foundations.


    Just as important, these stories read like production deployments rather than pilot anecdotes. They describe connected data sources, recurring management rhythms, model changes, executive use, and repeated workflow adoption. Danone, Grafana Labs, ClickUp, Supercell, and BlaBlaCar add breadth across demand planning, sales capacity, finance planning, Excel replacement, and budgeting. This is enough to establish real adoption and credible product-market fit, even if public proof remains selectively curated.'
