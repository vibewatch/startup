- id: expansion-risk
  title: Expansion opportunities and concentration risks
  body: 'The public record suggests Pigment has genuine land-and-expand potential. Several customer stories show one use case leading to a broader operating footprint: Carta moved from core planning into ARR metrics and workforce planning; Fivetran connected reporting, workforce planning, and strategic forecasting; Docker expanded from close commentary into model optimization and annual-planning ambitions; and the broader use-case library positions Pigment as a shared model across finance, sales, HR, and supply chain. This pattern matters because it suggests the platform can become more valuable as more teams operate from the same governed planning context.


    The visible risks are concentration and procurement friction. Public references are strongest in software, digital-platform, and modern-data companies, which may indicate a harder sell into organizations that want highly standardized, low-flexibility tooling. Third-party adverse commentary also suggests smaller teams or lighter use cases may struggle to justify the complexity. Finally, because retention and concentration metrics are private, there is no open evidence on whether a handful of large accounts dominate revenue or whether adoption broadens evenly across the customer base.'
