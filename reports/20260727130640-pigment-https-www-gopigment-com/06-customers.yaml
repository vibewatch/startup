chapter:
  number: 6
  title: Customers
  summary: Pigment’s public customer evidence is strongest in strategic finance and adjacent planning teams at modern software and digital businesses, with additional proof in consumer goods and mobility. Named stories for Carta, Figma, Docker, Fivetran, Danone, Grafana Labs, ClickUp, Supercell, and BlaBlaCar establish real production adoption and tangible productivity gains, but retention, churn, and concentration remain largely private.
sections:
- id: segments-buyers
  title: Customer segments and buyer profile
  body: 'Pigment’s public customer proof points to a clear center of gravity: strategic finance teams buying a planning platform that later expands into adjacent operating functions. The official customer-stories hub, homepage quotes, and use-case pages collectively show finance, RevOps, HR, and supply-chain workflows, which supports the idea that Pigment is sold first as a planning backbone and only second as a point solution. The most visible named customers skew toward software, digital-platform, and data-infrastructure businesses such as Carta, Figma, Docker, Fivetran, Grafana Labs, ClickUp, Supercell, and BlaBlaCar, with Danone adding a large consumer-goods reference.


    That mix implies the most natural Pigment buyer is a complex but modern organization that values model flexibility and cross-functional collaboration more than a heavily standardized close-only workflow. Users are typically finance, strategy, revenue, people, or supply-chain teams, while executives consume dashboards and scenario outputs. Customer-company homepages reinforce that these references are real enterprises with meaningful operating complexity, not anonymous logos. The caveat is concentration: public proof is strongest in technology-forward customers, so broader penetration across more traditional industries remains less visible than the software-heavy headline roster.'
