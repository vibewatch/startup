callouts:
- calloutType: insight
  title: Pigment looks well-funded, but not yet truly transparent
  body: The public record supports large capital inflows and strong growth signals, yet core underwriting metrics—cash, burn, gross margin, NRR, CAC, and payback—remain private. Investors should treat Pigment as a management-diligence-heavy software opportunity rather than a self-documenting public-style asset.
  claimRefs:
  - CI005
  - CI012
  - CI028
  - CI029
  - CI030
  - CI040
- calloutType: risk
  title: Valuation support depends on share gains, not just category growth
  body: The adverse source in this chapter is not a criticism of Pigment itself, but a market-growth reality check. If the core EPM market compounds at only 7%, Pigment must justify its financing profile through execution, replacement wins, and enterprise expansion rather than by relying on market lift alone.
  claimRefs:
  - CI014
  - CI015
  - CI027
