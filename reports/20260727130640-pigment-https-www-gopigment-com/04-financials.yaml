  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash and runway
    missingEvidence: Current cash balance, monthly burn, and runway months.
    whyItMatters: These are the critical inputs for capital adequacy, yet none are disclosed on the fetched public pages.
    diligencePath: Request cash balance, burn, and budget scenarios from management.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: margin and sales efficiency
    missingEvidence: Gross margin, CAC, payback, NRR, and cohort retention metrics.
    whyItMatters: Revenue quality cannot be fully underwritten without unit-economics and retention visibility.
    diligencePath: Request board materials or SaaS KPI pack covering unit economics and retention.
    relatedQuestionRefs:
    - QI022
    - QI023
    relatedTableRefs:
    - TI003
  - type: access-blocked
    severity: minor
    topic: independent financing coverage
    missingEvidence: Readable Reuters, Business Wire, and TechCrunch coverage plus accessible G2 review detail.
    whyItMatters: Independent reporting would strengthen valuation and market-sentiment triangulation around Pigment’s financing narrative.
    diligencePath: Use licensed articles, archive copies, or alternate outlets in the next diligence pass.
    relatedQuestionRefs:
    - QI015
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
