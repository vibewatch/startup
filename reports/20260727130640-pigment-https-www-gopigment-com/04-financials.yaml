- id: unit-economics-and-revenue-quality
  title: Unit economics, enterprise mix, and monetization quality
  body: 'Public unit-economics visibility is thin, so this chapter leans on proxies instead of pretending the missing numbers are known. The best positive proxy is enterprise mix: Pigment’s Modeler launch says 57% of new revenue now comes from enterprise customers and 56% of new customers migrated from legacy vendors, which suggests the company is increasingly winning larger, more strategic replacements rather than only landing small greenfield teams. The customer stories also point to meaningful workflow value—monthly reporting hours saved, faster scenario planning, and deeper self-service use for executives—which supports the idea that Pigment can justify premium software spend if execution is strong. Security posture matters here too: SAML, SCIM, MFA, RBAC, and regional hosting reduce friction for larger accounts and help protect revenue quality. The negative side is that public pages do not disclose gross margin, burn, CAC, payback, or NRR. That means underwriting cannot yet distinguish
    between healthy enterprise efficiency and expensive growth purchased through heavy services, discounting, or sales intensity. Public competitor benchmarks from Workday, OneStream, Oracle, and Planful also suggest that Pigment will be judged against companies with clearer disclosure or broader suite economics, which increases the premium on demonstrating efficient expansion rather than only rapid top-line growth.'
