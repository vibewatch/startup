- id: capital-adequacy-and-diligence-gaps
  title: Capital adequacy, comparables, and diligence blockers
  body: 'Pigment’s public capital story is relatively strong. The fetched announcements document a $73 million Series B, $65 million Series B+, $88 million Series C, and $145 million Series D. Combined with the Series C statement that lifetime funding had reached $248 million before Series D, the public record supports roughly $393 million of cumulative disclosed funding, subject to early-round reconciliation. That is a meaningful buffer for a private planning company still investing heavily in product and enterprise go-to-market. However, capital adequacy is not the same as financial transparency. The company does not publish cash balance, burn, runway, gross margin, or retention. Public-company comparables such as Workday, OneStream, and historical Anaplan provide far more direct disclosure, which increases the burden on management diligence for Pigment. MarketsandMarkets also serves as the key adverse source here: if the core EPM market only compounds at 7%, Pigment must earn valuation
    support through share gains, pricing power, and durable enterprise expansion rather than through category lift alone. Several independent media links were inaccessible, so even the valuation narrative has softer third-party triangulation than ideal. In other words, the current public packet is good enough to support a financing and traction narrative, but not good enough to close a full institutional underwriting model without management data.'
