chapter:
  number: 4
  title: Financials
  summary: Pigment’s public financial picture is stronger on capital raised and growth signals than on true SaaS unit economics. The fetched evidence supports a heavily funded, fast-growing enterprise software company that may be nearing $100 million ARR, but cash, burn, margins, and retention still require management-only diligence.
sections:
- id: revenue-model-and-traction
  title: Revenue model and public traction signals
  body: 'Pigment’s public materials imply a classic enterprise-software monetization model even though they stop short of exposing list pricing or GAAP revenue. The finance use-case page, platform page, and customer stories point to subscription-led planning software sold into finance teams and then expanded into adjacent workflows such as workforce planning, strategic forecasting, and scenario analysis. Customer stories reinforce that this is not a tiny single-use deployment model: Fivetran uses Pigment for workforce planning, three-statement modeling, and long-range forecasting, while dbt Labs emphasizes fast scenario planning and executive insight loops. The strongest top-line signal in the fetched set is the Modeler Agent launch, which says Pigment is approaching $100 million ARR and has doubled ARR for three consecutive years. Earlier announcements also say ARR tripled in 2023 and more than doubled again around the AI-agent expansion period. Those are still company-authored figures,
    but they consistently point to a fast-growing enterprise revenue base rather than a pre-revenue AI narrative. A notable nuance is that the freshest ARR proxy comes from a product-launch release rather than a financing release or audited statement, which is directionally useful but still should be treated as management positioning until reconciled against bookings, churn, and revenue recognition.'
