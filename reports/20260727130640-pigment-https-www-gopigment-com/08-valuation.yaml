- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Supporting evidence
  - What would change the view
  rows:
  - - Pigment has real product leadership potential
    - Graphite positioning, AI-native planning narrative, Dresner rank, Google Cloud partnership
    - Show sustained revenue growth and strong AI attach rates
  - - Customer proof is unusually strong for a private software company
    - Carta, Docker, Fivetran, and Figma provide detailed workflow outcomes
    - Show that public proof maps to durable NRR and expansion
  - - Category is large enough to support a winner
    - EPM market-growth framing and continued incumbent investment
    - Confirm Pigment is capturing share rather than just storytelling
  - - 'Anti-thesis: valuation can outrun disclosure'
    - Private revenue opacity and lack of audited public metrics
    - Provide ARR, NRR, churn, and efficiency metrics
  - - 'Anti-thesis: competitive parity is rising'
    - OneStream, Anaplan, Workday, Oracle, and Planful all crowd the budget line
    - Demonstrate win rates, attach rates, and implementation superiority
  - - 'Anti-thesis: fit risk can limit expansion'
    - Independent reviews flag complexity and specialist workflow limits
    - Show churn by segment and successful non-core deployments
  notes: Rows intentionally tie both thesis and anti-thesis to evidence that could move the recommendation.
