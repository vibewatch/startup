  - - NRR, GRR, and churn
    - Cohort retention and logo attrition by segment
    - Needed to turn customer proof into durability proof
    - Management data room request
  - - Sales efficiency
    - CAC payback, magic number, and enterprise sales cycle
    - Needed to judge growth quality and capital efficiency
    - Finance / GTM diligence
  - - Customer concentration
    - Top-10 accounts and revenue by vertical
    - Needed to assess concentration discount
    - Finance / customer-success diligence
  - - AI attach and monetization
    - Paid usage, adoption, and uplift from AI features
    - Needed to test premium-multiple logic
    - Product / pricing diligence
  - - Implementation success
    - Time-to-value, rollout success, and churn by segment
    - Needed to test anti-thesis on complexity and fit
    - Customer-success diligence
  notes: These asks are the minimum evidence pack required before moving from narrative appreciation to valuation conviction.
