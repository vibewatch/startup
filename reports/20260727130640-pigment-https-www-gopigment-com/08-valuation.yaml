- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue scale misses expectation
    - ARR is materially below ~$40M run-rate
    - Base case falls below last financing mark
    - Re-rate valuation as stretched or expensive
  - - Retention disappoints
    - NRR weak or gross churn elevated
    - Customer-proof thesis stops converting into monetization durability
    - Move from research-more to avoid
  - - Win-rate compression
    - Incumbents narrow product or AI differentiation
    - Premium multiple support weakens
    - Demand steeper entry discount
  - - AI attach weakens
    - AI features remain demo-heavy rather than paid and sticky
    - Bull-case upside fades
    - Do not pay AI premium
  - - Top-customer concentration high
    - A few accounts dominate revenue
    - Expansion thesis becomes fragile
    - Require concentration discount
  notes: These triggers are designed to break the thesis quantitatively rather than emotionally.
