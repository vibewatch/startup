- id: comparables
  title: Comparable set and market framing
  body: 'The comparable set has to balance relevance against disclosure quality. OneStream is the cleanest anchor because it is a direct EPM peer with a public S-1 and a current AI-forward finance narrative. Anaplan is useful as a category comp for strategic planning budgets and enterprise decision-platform positioning, even though it is private-equity owned rather than public. Workday Adaptive Planning and Oracle EPM matter because buyers regularly encounter them in enterprise evaluations, while Planful captures a lighter-weight planning alternative closer to some mid-market budgets.


    This set leads to two conclusions. First, Pigment is not operating in an empty category where clever product marketing can command any multiple it wants. The category is crowded and full of strong incumbents. Second, the market is large enough to matter: MarketsandMarkets and Dresner both support the idea that EPM and agentic-AI-enabled enterprise software remain real budget lines. That supports interest in the asset, but not blind acceptance of the last financing mark.'
