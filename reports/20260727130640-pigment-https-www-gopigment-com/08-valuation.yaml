- id: scenarios
  title: Bull, base, and bear scenario logic
  body: 'With public revenue opaque, the scenario method should stay humble. The bull case assumes Pigment’s leadership narrative, Google Cloud partnership, and cross-functional AI story convert into faster enterprise adoption, allowing revenue scale to outrun today’s disclosure gap. The base case assumes Pigment is a genuine category winner in a large market, but that the current valuation already prices in a meaningful share of that upside. The bear case assumes the opposite: revenue is closer to the low end of market estimates, public customer proof does not fully translate into durable retention, and incumbent competition narrows differentiation enough to compress the multiple.


    Using heuristic ARR bands rather than fake precision, the range looks roughly like this: a bear outcome around $420 million, a base range around $880 million to $1.0 billion, and a bull outcome around $1.5 billion to $1.75 billion. That range keeps the current public financing mark near the middle-to-upper part of the plausible base case rather than obviously cheap territory.'
