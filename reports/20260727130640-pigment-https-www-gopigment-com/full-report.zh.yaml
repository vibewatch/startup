  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 多条风险向量会很快从合规或技术失效传导到信任、续约和估值。
    data:
      nodes:
        - id: r1
          label: 隐私 / AI 治理缺口
        - id: r2
          label: 控制失效或 AI 错误动作
        - id: r3
          label: 客户信任侵蚀
        - id: r4
          label: 续约 / 扩张压力
        - id: r5
          label: 收入和估值下行
        - id: r6
          label: 管理精力分散
      edges:
        - from: r1
          to: r3
        - from: r2
          to: r3
        - from: r2
          to: r6
        - from: r3
          to: r4
        - from: r4
          to: r5
        - from: r6
          to: r5
    approximationNotes: 该图突出一阶传导，不展开所有二阶影响。
