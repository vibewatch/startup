      - number: '1.3'
        title: 融资时间线、里程碑与反向证据
        blocks:
          - type: paragraph
            body: >-
              尽管部分二级链接在本轮无法访问，Pigment 自己的公告线索仍足以拼出一条可信的融资时间线。2021 年新闻稿披露由 Greenoaks 领投的 $73M Series B 轮；2022 年 9 月新闻稿披露由
              IVP 和 Meritech 领投的 $65M Series B+ 轮；2023 年 6 月新闻稿披露 $88M Series C 轮，并称累计融资达到 $248M；2024 年 4 月材料披露由 ICONIQ
              Growth 领投的 $145M Series D 轮。公司还把这些融资与激进增长说法绑定：2022 年收入增长 600%、用户数增长 10x，随后在 Series D 前夕 ARR
              翻三倍、客户数翻倍。Pigment 也把 2025 年定义为战略扩张年，宣布上线 Google Cloud marketplace，并通过 S3NS
              提供主权云部署。反向一面不是欺诈信号，而是证据质量信号。Reuters、Business Wire、TechCrunch、G2 和 IVP
              在抓取输出中没有提供完全可用的佐证，限制了对估值口径、董事会构成和产品评价的独立确认。MarketsandMarkets 也提供了一个谨慎的反向参照：更广义 EPM 市场的 CAGR 只有 7%，远慢于单靠 AI
              乐观情绪暗示的增长速度，因此 Pigment 仍需要靠份额提升——而不只是市场顺风——来支撑增长预期。综合来看，公司概览在身份、产品姿态和时间线上有强官方来源覆盖，但治理细节和独立评价质量的外部证据仍不完整。
