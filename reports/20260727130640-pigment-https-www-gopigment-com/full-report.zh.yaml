            body: >-
              公开人员信号显示，公司正在激进扩张，但也想保住文化和内部流动性。招聘页面提到 650 名员工、40 个国籍、91% eNPS 和 20%
              年度晋升率。这些是正向信号，但不能消除执行风险。大规模实施和客户成功动作会随着员工数扩张而质量漂移；基于评价的证据已经显示，一些用户感受到产品灵活性与小团队或简单团队真实需求之间存在错配。这意味着赋能质量、范围界定纪律和持续服务一致性都是产品风险的一部分，而不是产品之外的事情。


              本章的财务模型风险大多是间接的。Pigment 处在大型 EPM
              品类中，既有厂商强、增长叙事也诱人，这会鼓励激进定位。如果续约质量、实施速度或合规保障低于产品叙事暗示，下行会迅速传导到客户信任、扩张和估值。务实回应是在投资或重大采购推进前，先定义硬性 kill
