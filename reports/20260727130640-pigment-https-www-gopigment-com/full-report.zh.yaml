      - number: '7.3'
        title: 合作伙伴与生态依赖风险
        blocks:
          - type: paragraph
            body: >-
              Pigment 的合作伙伴地图现在已成为风险画像的核心。Google Cloud 合作和 S3NS 主权云路径都是战略资产，但它们也意味着 Pigment
              在基础设施规模、主权化包装和部分合规叙事上依赖第三方。S3NS 与 Thales 材料让主权托管主张听起来很强，包括 SecNumCloud
              认证、年度审计和运营隔离。不过，这些收益部分由合作伙伴控制的结构交付。如果一个关键受监管客户因为 S3NS 购买 Pigment，那么无论 Pigment 是否愿意，S3NS 执行都会成为 Pigment
              产品风险的一部分。


              MCP 生态创造了第二层依赖。Anthropic 引入该协议，公开规范和 GitHub 仓库在 Pigment 之外演进，治理也正转向 Agentic AI
              Foundation。对互操作性来说这是健康的，但也意味着路线图方向、客户端质量和生态预期并不完全由 Pigment 控制。因此，公司同时暴露于平台伙伴风险和开放标准风险。
