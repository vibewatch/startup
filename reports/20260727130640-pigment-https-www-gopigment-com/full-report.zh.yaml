  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Pigment 的监管暴露并非来自公开来源中可见的某个单一执法行动，而是来自它处在敏感业务数据、AI 辅助工作流和欧洲隐私法的交汇处。公司隐私政策明确将部分数据处理置于 GDPR 和法国法律之下；Pigment
              是法国实体，因此法国数据保护机构 CNIL 的角色很重要。在隐私之外，AI Act 围绕透明度、治理、人类监督，以及 AI
              在就业、金融相邻或业务关键决策支持中的潜在高风险用途，创造了一个不断移动的合规边界。Pigment 自己的安全页面称其 AI framework 与 EU AI Act
              对齐，但这是前瞻性控制主张，并不能替代已完成合规的证据。


              法律表面风险更微妙：Pigment
              的安全营销远比其公开合同法律表面丰富。本轮中，隐私和法律通知页面可以抓取，但服务条款没有清晰浮现。这并不证明存在合同问题，但确实意味着尽调应把法律审查视为开放项，而不是已经勾选的框。
