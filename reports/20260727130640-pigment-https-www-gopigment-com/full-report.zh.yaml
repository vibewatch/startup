      - number: '5.3'
        title: 集成、治理与合规姿态
        blocks:
          - type: paragraph
            body: >-
              Pigment 的平台与集成页面把数据连接置于价值主张中心。ERP、CRM、HRIS、电子表格、数据湖、BI 工具和存储系统都被呈现为一等输入。产品说法是，规划不应依赖周期性拼接电子表格；数据应通过连接器、API
              和定时导入进入系统，让模型保持最新。财务和供应链用例页面也用实时或高频更新与更敏捷预测、更快情景响应之间的关系强化这一点。


              安全与合规细节明显多于普通营销网站。Pigment 披露 SAML 2.0 SSO、SCIM provisioning、MFA、域名 allowlisting、基于组的
              RBAC、细粒度数据权限、审计轨迹导出、AES-256 静态加密、TLS 1.2+ 传输加密、Frankfurt 或 Oregon 数据驻留、通过 S3NS 提供主权托管，以及六小时 RTO 和 24 小时
              RPO 的明确灾备目标。这些披露足以支撑企业买方尽调，尽管更深的实施细节和外部审计材料仍需要在 data room 中审查。
            claimRefs:
              - CE003
