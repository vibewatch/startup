      - number: '2.2'
        title: TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              抓取材料中最干净的公开市场锚点，是 MarketsandMarkets 对企业绩效管理的预测：到 2027 年达到 $8.3B，CAGR 为
              7.0%。这个数字有意义，因为它既大到足以支撑多家规模化供应商，也慢到足以挑战「规划软件会自动继承 AI 时代增长倍数」的叙事。同一来源还显示更大的金融 AI 邻近市场，但该数字应视为背景顺风，而不是
              Pigment 的直接 TAM，因为它包含大量超出业务规划软件的产品。承销 Pigment 时，更好的方法是做证据约束下的切片。Pigment 的用例组合指向 EPM 中的多职能云规划子集，而非整个市场，因此保守
              SAM 更适合落在低个位数十亿美元区间，而不是完整的 $8.3B。SOM 还应更窄，因为 Pigment 最匹配那些复杂、协同、跨职能部署；这些部署看重受治理建模、AI 支持和快速情景迭代。公开网页证据足以说明
              Pigment 处在一个真实、有竞争、仍在扩张的品类里，但在缺少客户数、胜率或分部收入数据时，还不足以自下而上推导精确市场份额公式。这也意味着估值模型应拆开品类增长与份额获取执行，因为仅看公开 TAM
              数字会让市场显得比竞争现实更容易。
