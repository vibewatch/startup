  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与替代类别
        blocks:
          - type: paragraph
            body: >-
              Pigment 面对的不是一场简单的一对一竞争。抓取材料显示，至少有三类相互重叠的替代方案。第一类是 Oracle、Workday、OneStream，以及历史上作为上市公司的 Anaplan
              这类既有企业套件；这些供应商出售的是信任、广度、采购熟悉度和全面财务覆盖。第二类是 Planful、Vena、Cube、Abacum 和 Mosaic 等现代 FP&A
              挑战者，它们强调易用性、工作流速度，以及对电子表格重度依赖团队的定向现代化。第三类是现状本身：内部电子表格模型，加上部分规划、BI 和 ERP 工具。分析师市场数据支持所有这些供应商都处在更广义的 EPM
              场域中，但竞争姿态并不相同。Pigment 自己的产品表面说明了为什么买方会认真考虑它：公司把集成业务规划、受治理数据、内部 AI 智能体和外部 MCP
              连接放在同一个叙事里。这比单个仪表盘功能更宽，但又窄于部分既有厂商声称的完整 Office-of-the-CFO 覆盖。另一个有用视角是买方起点。财务牵头的转型往往先把既有厂商列入短名单，因为它们已经有
              close、ERP 或 HCM 关系；而数字原生团队在模型变更便利性比套件整合更重要时，更愿意考虑 Pigment、Vena、Cube 或 Abacum。
