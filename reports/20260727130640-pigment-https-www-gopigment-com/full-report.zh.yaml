companyProfile:
  summary: >-
    Pigment 是一家发源于巴黎的企业业务规划与绩效管理 SaaS 平台，目前将自己重新定位为「面向企业业务规划的智能体式 AI」。Pigment 基于其正在申请专利的 Graphite 引擎构建，在同一个统一平台内提供
    FP&A、xP&A、收入规划、员工队伍规划、供应链规划和 ESG 报告。公司由 Éléonore Crespo 和 Romain Niccoli 于 2019 年创立，2024 年 4 月完成 $145M Series D
    轮融资，估值超过 $1B，在巴黎、纽约、旧金山、伦敦、多伦多等办公室约有 650 名员工。核心客户包括 Unilever、Merck、Datadog、eBay、Figma、Brex 和 Subway。公司背后投资方包括 ICONIQ
    Growth、IVP、Meritech、Bpifrance、Singular 和 Frst。
