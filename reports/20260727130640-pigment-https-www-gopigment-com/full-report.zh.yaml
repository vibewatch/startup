              - CV039
      - number: '8.3'
        title: 牛市、基准与熊市情景逻辑
        blocks:
          - type: paragraph
            body: >-
              公开收入不透明，情景法就要保持克制。牛市情景假设 Pigment 的领先叙事、Google Cloud 伙伴关系和跨职能 AI 故事能转化为更快的企业采用，收入规模增长足以跑赢当前披露缺口。基准情景假设
              Pigment 确实是大市场里的品类赢家，但当前估值已计入相当一部分上行空间。熊市情景则相反：收入更接近市场估算低端，公开客户证据无法充分转化为持久留存，现有厂商竞争把差异化压窄，足以压缩倍数。


              不用伪精确数字，改用启发式 ARR 区间，范围大致如下：熊市结果约 $420 million，基准区间约 $880 million 至 $1.0 billion，牛市结果约 $1.5 billion 至
              $1.75 billion。上述区间把当前公开融资标记放在可信基准情景的中上部，而不是明显便宜的位置。
            claimRefs:
              - CV027
              - CV031
              - CV033
              - CV035
              - CV037
              - CV038
          - type: table
            tableRef: TV003
            claimRefs:
              - CV031
              - CV032
