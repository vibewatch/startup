      - number: '3.3'
        title: 护城河持久性、披露不对称与剩余风险
        blocks:
          - type: paragraph
            body: >-
              Pigment 的护城河看得见，但并非牢不可破。抓取证据中最强的持久要素，是 Graphite 架构、规划数据与智能体工作流之间的连接，以及通过 Analyst、Modeler 和 MCP 同时覆盖内部与外部
              AI 表面的组合。这些要素让 Pigment 不只是一个电子表格替代品。然而，上市既有厂商仍有强大的结构性优势：Workday 和 Oracle 拥有已知采购路径，OneStream 和 Workday
              提供上市公司式披露，Anaplan 的历史申报文件则显示 Pigment 正在攻击的传统品类规模。这种披露不对称很重要，因为私营公司不透明，让 Pigment 更难在实际定价、胜率或留存上做
              benchmark。公开网页层面的竞争图景也不完整。G2 评价内容无法访问，SAP 目标页面未加载，大多数供应商公开定价仍很薄。这些缺口不会抹掉 Pigment
              的竞争论证，但意味着尽调结论应以管理层侧数据为条件，尤其是折扣、扩张和赢单 / 输单表现。因此，管理层尽调应少看官网措辞，多看企业 bake-off
              中的真实竞争结果、实施周期、落地后扩张行为、续约质量，以及首个日常生产用例之后多职能部署的深度。
