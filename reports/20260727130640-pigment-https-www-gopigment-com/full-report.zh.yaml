  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与公开牵引信号
        blocks:
          - type: paragraph
            body: >-
              Pigment 的公开材料指向典型企业软件变现模式，尽管并未披露标价或 GAAP
              收入。财务用例页面、平台页面和客户故事都显示，公司销售的是以订阅为主的规划软件，先卖给财务团队，再扩展到员工队伍规划、战略预测和情景分析等相邻工作流。客户故事也说明这不是一个很小的单一用途部署模型：Fivetran
              用 Pigment 做员工队伍规划、三表建模和长期预测，dbt Labs 则强调快速情景规划和高管洞察闭环。抓取材料中最强的收入信号来自 Modeler Agent 发布稿，称 Pigment 正接近 $100M
              ARR，并已连续三年 ARR 翻倍。更早的公告还称 2023 年 ARR 翻三倍，并在 AI 智能体扩张期前后再次翻倍以上。这些仍是公司自有数字，但一致指向一个快速增长的企业收入基础，而不是一个收入前的 AI
              叙事。一个值得注意的细节是，最新 ARR 代理信号来自产品发布稿，而非融资发布或审计报表；它在方向上有用，但在与 bookings、流失和收入确认核对前，仍应视为管理层定位。
