      - number: '6.3'
        title: 证明质量、满意度与留存可见度
        blocks:
          - type: paragraph
            body: >-
              Pigment 跨过了客户证明的最低门槛，因为官网提供了带有详细引语和工作流描述的具名客户故事，Gartner Peer Insights 和 CaseStudies.com
              等独立表面也提供了外部包装。Gartner 还给出一个重要平衡信号：尽管整体口碑仍强，读者可见的批评性评价认为 Pigment
              可能像一个以财务为中心却卖得过宽的产品；当用例更简单或团队建模深度有限时，采用可能滞后。Cube 和 CFO Shortlist
              也强化了同一点：学习曲线、复杂性，以及对小团队或非财务团队的匹配，是公开可见的主要摩擦点。


              证据仍薄的地方是持久性。Pigment 在已审查表面没有公开披露 NRR、GRR、logo churn、续约率或 cohort 行为。最好的留存代理是嵌入深度和扩张：客户谈到定期 close
              周期、周期性报告、高管仪表盘使用、多条 workstream，以及后续更多团队采用。这些信号有用，但仍只是代理。任何投资或采购决策，都需要直接流失和续约数据，之后才能称客户基础高度持久。
