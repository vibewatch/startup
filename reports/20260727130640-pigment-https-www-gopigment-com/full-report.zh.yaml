chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台定位与当前运营版图
        blocks:
          - type: paragraph
            body: >-
              Pigment 现在把自己讲成一家 AI 原生的企业规划公司，而不是一个狭义预算工具。官网标语很直接——「面向企业业务规划的智能体式 AI」——核心产品信息是，Pigment
              帮助组织在财务及相邻运营职能中开展实时规划。公司自有材料始终把身份锚定在 Graphite 架构上；Pigment 称该架构正在申请专利，面向弹性计算、动态建模，以及 AI
              智能体可受治理的上下文而建。同一组材料也说明，公司并不只是给电子表格套一层 AI 包装：Pigment 强调财务、销售、HR、运营和供应链工作流之间的集成式规划，并支持与
              SAP、NetSuite、Salesforce、Google Sheets 等系统的实时集成。运营上，公司称其创立于 2019 年，总部位于巴黎，目前办公室横跨巴黎、伦敦、纽约、多伦多和旧金山。Pigment
              当前给出的规模口径是覆盖 40 个国籍的 650 名员工，这与其北美办公室扩张叙事大体一致，但仍是公司自报数字，并非独立审计披露。
