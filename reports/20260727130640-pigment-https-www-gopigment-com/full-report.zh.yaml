      - number: '4.3'
        title: 资本充足性、可比公司与尽调阻碍
        blocks:
          - type: paragraph
            body: >-
              Pigment 的公开资本故事相对强。抓取到的公告记录了 $73M Series B、$65M Series B+、$88M Series C 和 $145M Series D。再结合 Series C 声明称
              Series D 前累计融资已达 $248M，公开记录支持约 $393M 的累计披露融资，但仍需核对早期轮次。这对一家仍在重投产品和企业 go-to-market
              的私营规划公司来说，是一层有意义的缓冲。不过，资本充足不等于财务透明。公司不披露现金余额、burn、runway、毛利率或留存。Workday、OneStream 和历史上的 Anaplan
              等上市可比公司提供了更直接的披露，这提高了 Pigment 管理层尽调的负担。MarketsandMarkets 在这里也是关键反向来源：如果核心 EPM 市场年复合只有 7%，Pigment
              必须靠份额提升、定价能力和持久企业扩张来支撑估值，而不能只靠品类抬升。若干独立媒体链接不可访问，因此即便是估值叙事，第三方交叉验证也比理想状态更弱。换句话说，当前公开材料足以支撑一套融资与牵引叙事，但在没有管理层数据前，还不足以完成完整的机构级承销模型。
