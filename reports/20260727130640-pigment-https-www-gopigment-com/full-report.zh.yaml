      - number: '7.2'
        title: 运营、安全与技术风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Pigment 最大的优势和最大风险来自同一事实：它集中承载规划数据和逻辑。对一家 SaaS 规划供应商来说，其安全披露异常具体，包括
              SAML、SCIM、MFA、RBAC、审计轨迹导出、区域驻留、加密，以及明确的 RTO/RPO 目标。这些是真实缓释因素。它们让 Pigment
              在企业使用场景中更可信，也降低了一些基础供应商风险。但这些披露也凸显了平台失效时的影响半径。一个触及财务、员工队伍、收入和运营的规划环境，会变成业务关键基础设施，而不只是另一层分析工具。


              技术开放性又增加一层风险。Pigment 的 MCP 策略很有力，因为它把外部助手带入实时规划上下文；但同样的开放性也扩大了治理边界。Docker 和 Carta 的客户故事显示，团队已经在用 Pigment
              承载重要的周期性工作流，这会放大模型错误、访问控制失误或 AI 审批不佳的运营后果。公开反向评论也提示，Pigment 关于优化和极端复杂度的主张需要仔细测试，不能盲目接受。
