figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 已抓取来源集中可见的主要创立、融资、产品、合作伙伴和证据质量里程碑。
    data:
      items:
        - date: '2019'
          label: 创立于巴黎
          description: Pigment 称，公司由 Éléonore Crespo 和 Romain Niccoli 于 2019 年在巴黎创立。
        - date: '2021'
          label: Series B 轮 $73M
          description: Pigment 宣布完成由 Greenoaks 领投的 $73M Series B 轮融资。
        - date: 2022-09
          label: Series B+ 轮 $65M
          description: Pigment 宣布完成由 IVP 和 Meritech 领投的 $65M Series B+ 轮融资。
        - date: 2023-06
          label: Series C 轮 $88M
          description: Pigment 宣布完成 $88M Series C 轮融资，并称总融资额达到 $248M。
