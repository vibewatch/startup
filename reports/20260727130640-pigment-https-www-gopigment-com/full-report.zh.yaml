  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围与模块地图
        blocks:
          - type: paragraph
            body: >-
              Pigment 销售的是企业规划平台，而不是单团队点状解决方案。纵观官网和用例页面，产品始终被定义为 FP&A、合并、收入规划、员工队伍规划、供应链规划和 S&OP 共用的同一个受治理环境。这种广度很重要，因为
              Pigment 并不只是想作为财务仪表盘或 AI 聊天包装取胜；它想成为多个职能每天共同运行的规划层。产品承诺是单一事实来源、共享业务逻辑，以及在组织形态变化时无需重建整个技术栈也能调整的模型。


              模块叙事在广度上可信。财务页面强调预算、预测、报告和差异分析。RevOps 与 SPM 页面覆盖销售规划。编制和员工队伍页面把招聘与成本计划连起来。供应链和 S&OP 页面把 Pigment
              推入运营规划。合并功能存在，但专业化程度弱于专门的 close 厂商。净结论是，Pigment 的产品边界有意做成跨职能，AI 叠在已经很宽的规划底座之上，而不是产品本身。
