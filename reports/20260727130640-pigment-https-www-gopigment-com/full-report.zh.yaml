              - CV039
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV031
              - CV032
              - CV035
              - CV039
      - number: '8.4'
        title: 建议、反命题和尽调关口
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，建议是 research-more，置信度中等，估值立场偏拉伸。Pigment 看起来是一家真实公司：产品叙事强，客户 logo
              顶级，工作流价值可衡量，企业级控制也过关。上述事实应该加分。但若要在上一轮披露估值上给出买入判断，公开证据仍不够：没有经审计收入，没有公开留存指标栈，没有开放的销售效率数据，也缺少足够透明度来判断客户证据能多广泛地转化为持久变现。


              反命题很直接：Pigment 可能确实是一家很强的规划公司，但估值仍跑在可证明的经营规模前面。投资人不必因此永远避开这项资产，却足以要求有纪律的尽调清单和明确推翻投资论证的触发条件。如果 Pigment
              能拿出强劲 ARR、NRR、低毛流失和健康的多产品扩张，投资理由会明显改善。否则，当前估值标记更像合理到偏高，而不是清晰有吸引力。
            claimRefs:
