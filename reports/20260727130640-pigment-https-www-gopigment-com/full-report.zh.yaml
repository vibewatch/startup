      - number: '5.4'
        title: 相对既有厂商的差异化与技术风险
        blocks:
          - type: paragraph
            body: >-
              Pigment 最强的差异化不只是它有 AI
              智能体，而是它把这些智能体绑定到一个横跨多个规划领域、受治理的多维模型上。平台叙事是连贯的：跨职能范围、共享语义层、原生情景建模，以及让运营上下文保持实时的连接器。实施指南也显示，Pigment
              把赋能视为产品的一部分，通过共同构建动作降低对外部集成商的长期依赖。这很重要，因为 EPM 买方成功往往既取决于内部模型所有权，也取决于原始功能数量。


              主要风险在于证明深度。Lokad 和 CFO Shortlist 的独立批评都认为，Pigment 最强在协同规划和价值实现速度，而不是极端复杂度、专业 close 管理或原生运营优化。同时，Anaplan 和
              OneStream 等既有厂商现在也使用类似的 AI-forward 信息。因此，Pigment 的真实护城河必须来自实施结果、模型灵活性和信任架构，而不能只是抢先说出「agentic」。
