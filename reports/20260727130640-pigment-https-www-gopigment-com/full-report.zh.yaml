      - number: '5.2'
        title: Graphite 架构与智能体运行模式
        blocks:
          - type: paragraph
            body: >-
              Graphite 是核心技术叙事。Pigment 将其描述为正在申请专利的基础设施，由弹性计算、统一且受治理的数据，以及动态建模组成。平台页面异常明确地说，并行处理和并发能力是为了在 AI
              智能体操作同一个规划模型时，仍让人的工作流保持响应。这是一个有意义的架构主张，因为它暗示 Pigment 的 AI 层不应运行在过期数据副本或断开的分析沙盒上。相反，Graphite
              被包装成一个底座，让实时模型交互、情景传导和受治理上下文同时服务人和智能体。


              MCP 公告把这一架构向外延展。Pigment 的 MCP server 被定位为通用连接器，使 Claude、ChatGPT、ServiceNow 和 Agentforce 能查询实时 Pigment
              上下文、复用业务规则并触发任务。Anthropic 自有 MCP 材料和公开规范支撑了这一协议定位，而 GitHub server repository 显示围绕该标准已经出现真实的开发者生态势能。战略上，这让
              Pigment 从封闭的 EPM 应用转向一个 AI 连接的决策层。
