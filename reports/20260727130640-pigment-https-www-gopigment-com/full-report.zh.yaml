        blocks:
          - type: paragraph
            body: >-
              创始团队证据在身份层面最强，在正式治理层面较弱。Pigment 自有页面持续将 Éléonore Crespo 和 Romain Niccoli 标识为创始人及现任联合
              CEO。本次抓取材料里，最具体的创始人背景来自 Pigment 的 Series B 公告：Crespo 来自 Google 和 Index Ventures，Niccoli 曾是 Criteo 联合创始人兼
              CTO。这让公司在企业规划软件上具备可信的战略与产品型创始人—市场匹配，尽管材料并未印证二级资料里常被重复的每一条履历细节。员工信号方面，招聘页面对一家私营公司来说信息异常丰富：其称 2024 年底 eNPS 为
              91%，2025 年 EgaPro 得分为 76/100，符合条件员工的年度晋升率约为 20%。这些说法显示内部信心和上升流动性较强，但仍属自报。治理透明度明显更低。Pigment 称投资人董事会包括
              ICONIQ Growth、IVP 和
              Meritech，但抓取材料没有披露具名董事、观察员权利或控制条款。这个缺口让董事会构成、接班规划和投资人影响力成为实质性尽调问题，也意味着后续尽调应测试这些员工指标在持续扩张中是否依然稳固。
