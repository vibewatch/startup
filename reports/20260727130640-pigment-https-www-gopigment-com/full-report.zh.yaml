      - number: '2.3'
        title: 增长驱动、采用约束与采购路径
        blocks:
          - type: paragraph
            body: >-
              抓取到的竞品页面显示，规划市场正在围绕几个共同采购驱动收敛：受治理的数据、更快部署、AI 辅助分析、情景建模和跨职能协同。Pigment 自有材料通过财务、需求规划和销售案例强化了这一主题，而 Google
              Cloud 合作把故事延伸到企业基础设施、分发和 AI 模型访问。竞品信息也确认了相同的买方优先级：Workday 强调信任和部署速度，Oracle 强调连接式规划和内嵌智能体，OneStream
              强调规模和财务深度，新的挑战者则强调易用性、Excel 兼容性或 AI 原生速度。主要采用约束同样清晰。广义市场增长温和而非爆发；既有厂商拥有稳固装机基础和熟悉的采购路径；公开定价细节稀薄；并非每个供应商
              benchmark 页面都稳定可访问。实践中，采购路径通常从财务牵头的规划痛点开始，扩展到相邻运营计划，然后取决于信任控制、集成工作量，以及组织是否愿意标准化在同一个规划层上。因此，Pigment
              最强的驱动不只是 AI 热度，也包括实施务实性、治理和跨职能数据对齐。最后一个实践含义是，在可持续转化市场时，实施资源、安全审批和高管赞助仍与产品功能评分同样重要。
