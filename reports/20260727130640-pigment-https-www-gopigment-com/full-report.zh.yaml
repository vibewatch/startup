      - number: '3.2'
        title: 能力、信任与工作流对比
        blocks:
          - type: paragraph
            body: >-
              能力广度是这个市场变得微妙的地方。Oracle 和 OneStream 展示最宽的套件式财务叙事，横跨规划、报告和 close 相邻职能；Workday 强调可信云规划、AI 和快速部署；Anaplan 强调统一
              AI 核心与基于角色的智能体。在挑战者一侧，Planful、Vena、Cube、Abacum 和 IBM 现在也都营销某种 AI 辅助、规划速度或受治理建模的组合。Pigment 最强的差异化不在于它只是「有
              AI」，因为很多竞争对手现在也这么说。相反，证据显示 Pigment 最好的楔子，是受治理规划逻辑、灵活模型构建、内嵌 Analyst 与 Modeler 智能体，以及基于 MCP 向更广 AI
              生态延展这几件事的组合。安全姿态强化了企业账户中的这条论证，而 Figma 客户故事提供了少见的工作流层面证据，显示新的 AI 功能确实节省建模时间。不过，Planful 和 Abacum 等挑战者说明
              Pigment 的 AI 主导叙事正越来越受争夺，这提高了执行和品类证明的门槛。抓取页面还暗示不同扩张路径：既有厂商通常通过企业标准化落地，挑战者则常从一个痛苦工作流切入，再尝试随时间扩大账户范围。
