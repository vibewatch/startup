      - number: '8.2'
        title: 可比公司集合与市场框架
        blocks:
          - type: paragraph
            body: >-
              可比公司集合必须在相关性和披露质量之间平衡。OneStream 是最干净的锚点，因为它是直接 EPM 同业，拥有公开 S-1，也有当前 AI-forward 财务叙事。Anaplan
              可作为品类可比，用来理解战略规划预算和企业决策平台定位，尽管它现在由私募股权持有，而非上市公司。Workday Adaptive Planning 和 Oracle EPM
              重要，是因为买方在企业评估中经常遇到它们；Planful 则代表更轻量的规划替代方案，更接近部分中端市场预算。


              这个集合导出两点结论。第一，Pigment 并不处在一个空白品类，不能靠聪明产品营销就随意拿到任何倍数。这个品类拥挤，且充满强既有厂商。第二，市场足够大，值得关注：MarketsandMarkets 和
              Dresner 都支持 EPM 与智能体式 AI 赋能企业软件仍是真实预算线。这支撑对资产的兴趣，但不支撑盲目接受上一轮融资标记。
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV030
              - CV034
