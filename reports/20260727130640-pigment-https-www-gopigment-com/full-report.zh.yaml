  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与买方任务
        blocks:
          - type: paragraph
            body: >-
              Pigment 直接抓取到的产品表面，比一个泛泛的「规划软件」标签更能界定市场边界。公司并不只卖预算，也不只卖财务报告，而是展示一个集成式业务规划平台，明确覆盖财务、销售预测、编制规划、供应链、财务合并和 ESG
              工作流。这种广度正是 xP&A 的特征：多个职能计划共享同一个受治理的数据模型，而不是各部门各自维护电子表格。最相关的现状替代品包括电子表格模型、传统 EPM 套件，以及由财务、RevOps、HR
              或运营团队拥有的点状解决方案。买方通常由财务牵头，因为预算、预测和合并层带来最初的组织需求；一旦实施成功，终端用户界面会扩展到销售、员工队伍和供应链运营人员。Pigment
              自己的情景规划内容也说明市场为何变宽：高管希望系统能同时维护多个未来，而不是每次冲击后重跑静态年度预算。这一待完成任务比传统 FP&A 更宽，也解释了为什么供应商竞争越来越同时覆盖既有 EPM 厂商和新的
              AI-first 挑战者。
