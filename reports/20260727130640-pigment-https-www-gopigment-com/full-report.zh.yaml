  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐逻辑从强产品与客户证据出发，最后卡在公开披露瓶颈。
    data:
      nodes:
        - id: n1
          label: 强产品叙事
        - id: n2
          label: 真实客户证据
        - id: n3
          label: 大品类 + 分析师认可
        - id: n4
          label: 收入披露不透明
        - id: n5
          label: 情景估值区间
        - id: n6
          label: 继续研究建议
      edges:
        - from: n1
          to: n5
        - from: n2
          to: n5
        - from: n3
          to: n5
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 流程有意强调证据瓶颈，而不是只看叙事优势。
    claimRefs:
      - CV007
      - CV009
      - CV013
      - CV031
      - CV032
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在有限公开披露下，当前估值标记对假设的 ARR 区间最敏感。
    data:
      items:
        - label: 悲观情景
          value: 420
        - label: 基准情景低位
          value: 880
        - label: 基准情景高位
          value: 1000
        - label: 乐观情景低位
          value: 1500
        - label: 乐观情景高位
          value: 1750
    approximationNotes: 数值是以百万美元计的示例性情景输出。
    claimRefs:
      - CV031
      - CV032
      - CV035
      - CV038
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 按经验法给出的私募市场区间显示，Pigment 接近上一轮披露估值下的合理到偏高区域。
    data:
      items:
        - label: Pigment 隐含价值
          low: 420
          mid: 950
          high: 1750
    approximationNotes: 区间来自情景分析，不是市场报价。
    claimRefs:
      - CV031
      - CV032
      - CV035
      - CV039
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 公开 KPI 在规模和声誉上更强，在货币化上较弱。
    data:
      items:
        - label: 上一轮融资
          value: '145'
          unit: USDm
        - label: 最近披露估值
          value: 1000+
          unit: USDm
        - label: 员工人数
          value: '650'
          unit: employees
        - label: Pigment 引用的 Gartner 评分
          value: '4.7'
          unit: /5
    approximationNotes: KPI 组合有意混合融资、规模和外部声誉，因为公开收入披露缺失。
    claimRefs:
      - CV004
      - CV005
      - CV022
      - CV031
