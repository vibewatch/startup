        title: 单位经济、企业客户组合与变现质量
        blocks:
          - type: paragraph
            body: >-
              公开单位经济可见度很低，因此本章使用代理指标，而不是假装缺失数字已知。最好的正向代理是企业客户组合：Pigment 的 Modeler 发布称，当前 57% 的新收入来自企业客户，56%
              的新客户从传统供应商迁移而来。这说明公司越来越多赢下更大、更具战略性的替换，而不只是落地小型绿地团队。客户故事也指向有意义的工作流价值——每月报告工时节省、更快情景规划，以及高管更深的自助使用——如果执行够强，这些价值能支撑
              Pigment 证明高端软件支出的合理性。安全姿态在这里同样重要：SAML、SCIM、MFA、RBAC 和区域托管会降低大客户摩擦，并帮助保护收入质量。负面一面是，公开页面不披露毛利率、burn、CAC、回本期或
              NRR。这意味着承销还无法区分健康的企业效率，和靠重服务、折扣或销售强度买来的昂贵增长。来自 Workday、OneStream、Oracle 和 Planful 的公开竞品 benchmark
              也表明，Pigment 会被拿来与披露更清楚或套件经济更宽的公司比较；这让高效扩张的证明变得更重要，不能只证明收入高速增长。
