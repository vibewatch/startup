  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方画像
        blocks:
          - type: paragraph
            body: >-
              Pigment 的公开客户证据指向一个清晰重心：战略财务团队购买规划平台，随后扩展到相邻运营职能。官方客户故事中心、官网引语和用例页面合起来展示了财务、RevOps、HR 和供应链工作流，支撑 Pigment
              先作为规划主干、其次才作为点状解决方案被销售的判断。最显眼的具名客户偏向软件、数字平台和数据基础设施企业，包括 Carta、Figma、Docker、Fivetran、Grafana
              Labs、ClickUp、Supercell 和 BlaBlaCar；Danone 则提供了大型消费品参考。


              这一组合暗示，Pigment 最自然的买方是复杂但现代的组织；它们更看重模型灵活性和跨职能协同，而不是高度标准化、仅围绕 close
              的工作流。用户通常是财务、战略、收入、人力或供应链团队，高管则消费仪表盘和情景输出。客户公司官网进一步证明这些 reference 是有实际运营复杂度的真实企业，而不是匿名
              logo。注意事项是集中度：公开证据在技术前沿客户中最强，因此在更传统行业的广泛渗透，比这份软件重的头部客户名单更不清晰。
