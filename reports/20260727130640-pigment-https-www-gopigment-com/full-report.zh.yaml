  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与证据质量
        blocks:
          - type: paragraph
            body: >-
              Pigment 的估值案例从一个硬锚点和几个软锚点开始。硬锚点是 2024 年 4 月 Series D：Reuters 的 URL 标题和 Pigment 自己的招聘页面都指向一轮 $145M 融资，估值超过
              $1B。其后的内容都更软：Pigment 仍是私营公司，不披露经审计收入，只提供 650
              名员工、明星投资人和企业客户故事等选择性规模信号。这意味着分析师的工作不是假装不存在的精确性已经存在，而是界定哪些结果区间可能支撑或削弱上一轮融资标记。


              因此，证据质量问题是核心，而不是边缘。相比许多私营 SaaS 公司，Pigment 的产品和客户证明更强；但相比 OneStream
              这种有申报文件支撑的可比公司，其变现披露更弱。这会把建议从简单的公司质量打分，推向对价格敏感的情景分析。实践中，正确的问题不是「Pigment 好不好？」，而是「什么证据会让超过 $1B
              的估值显得合理、便宜或昂贵？」
