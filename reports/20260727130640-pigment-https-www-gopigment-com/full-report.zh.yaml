            body: >-
              公开记录显示，Pigment 有真实的 land-and-expand 潜力。多篇客户故事展示了一个用例如何通向更宽的运营版图：Carta 从核心规划扩展到 ARR 指标和员工队伍规划；Fivetran
              连接了报告、员工队伍规划和战略预测；Docker 从 close 评论扩展到模型优化和年度规划目标；更广泛的用例库则把 Pigment 定位为财务、销售、HR
              和供应链共享的模型。这一模式很重要，因为它说明，随着更多团队在同一个受治理规划上下文中工作，平台价值可能继续上升。


              可见风险是集中度和采购摩擦。公开 reference
              最强的是软件、数字平台和现代数据公司，这可能意味着它更难卖进那些想要高度标准化、低灵活性工具的组织。第三方反向评论也显示，小团队或较轻用例可能难以证明复杂性的合理性。最后，由于留存和集中度指标仍是私有数据，公开证据无法判断少数大客户是否主导收入，也无法判断采用是否在客户基础中均匀扩展。
