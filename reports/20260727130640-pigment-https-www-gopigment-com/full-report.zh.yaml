      - number: '6.2'
        title: 具名部署与可观察客户结果
        blocks:
          - type: paragraph
            body: >-
              对一家私营规划供应商而言，Pigment 的具名客户证据质量异常强，因为多篇故事不止展示 logo，还给出具体运营结果。Carta 报告数据聚合和手工计算时间减少 80%，并在每周 ARR
              报告和部门深挖中进一步节省时间。Fivetran 报告每月高管报告约节省 12 小时。Docker 称 close 评论和审阅时间降低 30–50%，并且借助 Modeler Agent
              大幅加快模型变更。Figma 表示，协同规划替代了孤立 Excel 模型；Modeler Agent 将工作从数周压到数小时，并补齐超过 80% 的模型基础。


              同样重要的是，这些故事读起来像生产部署，而不是试点轶事。它们描述了已连接的数据源、周期性管理节奏、模型变更、高管使用和反复采用的工作流。Danone、Grafana Labs、ClickUp、Supercell
              和 BlaBlaCar 则在需求规划、销售产能、财务规划、Excel 替换和预算编制上提供了广度。这足以确立真实采用和可信的产品—市场匹配，即便公开证据仍经过选择性呈现。
