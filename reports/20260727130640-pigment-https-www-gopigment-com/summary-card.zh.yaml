    - SOC 2 Type 2、ISO 27001、GDPR/CCPA/SOX 合规和 S3NS 主权托管移除关键企业采购障碍
  topRisks:
    - 未公开披露 ARR、毛利率、NRR 或客户数；估值分析依赖推断，而非证据支撑
    - >-
      资本更充足的 incumbents 施压：Oracle EPM（完整 ERP 套件）、Workday Adaptive Planning（HR+finance 集成）、 OneStream（上市公司，ARR
      $250M+）、Anaplan（PE 持有，企业安装基础深）
    - SaaS 估值压缩风险：按估计 $30-100M ARR 计算，$1B+ 估值对应 10x-30x ARR 倍数，若增速放缓可能难以维持
    - 对共同创始人 Crespo 和 Niccoli 的关键人依赖；二人共同担任 CEO，存在继任或冲突风险
