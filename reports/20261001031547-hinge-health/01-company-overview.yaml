chapter:
  number: 1
  title: "Company Overview"
  summary: "Hinge Health, Inc. (NYSE: HNGE) is a San Francisco-based digital health provider founded in 2014 by Daniel Perez and Gabriel Mecklenburg, delivering AI-powered musculoskeletal therapy, migraine treatment, and digestive health care to self-insured employers and health plans. As of Q2 2026, the company generated $212.8M in quarterly revenue (+53% YoY), achieved an 87% non-GAAP gross margin, and completed an agreement to acquire Cylinder Health for $105M to expand into gastrointestinal care."
sections:
  - id: "identity-scale-model"
    title: "Corporate Identity, Operating Scale, and Business Model"
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO001"
    body: |
      Founded in 2014 by Daniel Perez and Gabriel Mecklenburg, Hinge Health, Inc. (NYSE: HNGE) is an enterprise digital healthcare company headquartered in San Francisco, California. The company addresses the full continuum of musculoskeletal (MSK) pain and injury, ranging from acute sprains to chronic back and joint conditions, pre- and post-surgical rehabilitation, and specialized pelvic health. Rather than providing static video exercise libraries or relying on labor-intensive clinical appointments, Hinge Health combines clinical care teams with proprietary software, computer vision movement analysis, and targeted wearable pain relief technology to automate substantial portions of care delivery. The company sells primarily through a B2B2C commercial model to self-insured employer benefit plans and major commercial health plans, covering contracted member lives under multi-year recurring subscription contracts.

      By the second quarter of 2026, Hinge Health achieved significant operating scale, generating $212.8 million in quarterly GAAP revenue (+53% year-over-year) and expanding its client roster to 2,929 enterprise employers and health plan sponsors. LTM calculated billings reached $861.8 million, up 52% year-over-year, supported by strong member yield and high customer retention. Operational leverage continued to widen, as second-quarter gross margins reached 87% and free cash flow surged to $99.6 million. Demonstrating commercial momentum heading into the peak annual benefits enrollment season, corporate management raised full-year 2026 revenue guidance to between $856 million and $860 million, representing 46% growth at the midpoint. Key operating metrics and diligence baselines are synthesized in Exhibit TO001.
  - id: "founders-leadership-governance"
    title: "Founders, Executive Leadership, and Governance"
    claimRefs:
      - "CO006"
      - "CO008"
      - "CO010"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO002"
    body: |
      Hinge Health was established out of personal adversity when co-founders Daniel Perez and Gabriel Mecklenburg experienced severe traumatic orthopaedic injuries as doctoral students and endured extensive, inconvenient rehabilitation programs. Their shared frustration with outpatient physical therapy clinic logistics and variable clinical quality inspired the founding thesis of software-delivered, home-based rehabilitation. Over twelve years of corporate evolution, both founders have maintained hands-on operational leadership. Perez serves as Chief Executive Officer, steering strategic vision, enterprise commercialization, and investor relations, while Mecklenburg leads technology architecture, engineering, and artificial intelligence development as Chief Technology Officer.

      To support its transition from a venture-backed growth startup to a publicly listed corporation on the New York Stock Exchange, the company augmented founder leadership with veteran executive talent. President Jim Pursley leads the enterprise sales force and oversees strategic distribution alliances across sixty health plans and pharmacy benefit managers. Chief Financial Officer James Budge directs capital allocation, financial controls, and M&A execution. Governance structures balance entrepreneurial agility with public reporting accountability, although the company exhibits material key-person dependence on Perez and Mecklenburg for long-term product vision and clinical automation architecture. Detailed executive profiles and governance coverage are presented in Exhibit TO002.
  - id: "capitalization-stakeholder-map"
    title: "Capitalization, Public Listing, and Stakeholder Ecosystem"
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
      - "CO005"
      - "CO009"
      - "CO012"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO003"
    body: |
      Prior to its public listing, Hinge Health secured more than $825 million in equity capital across institutional funding rounds backed by prominent venture firms including Tiger Global Management, Coatue, Bessemer Venture Partners, and Atomico. In May 2025, the company completed its initial public offering on the New York Stock Exchange under ticker symbol HNGE at an initial public offering price of $32.00 per share. Public trading provided currency for strategic initiatives while subjecting the company to public market equity valuation dynamics, including periodic multiple compression when the stock retreated 38% from post-IPO highs in early 2026 before stabilizing on robust earnings results.

      The company's commercial resilience rests on a deeply integrated ecosystem of institutional stakeholders. Self-insured employers serve as the core economic buyers, seeking verifiable medical cost savings to curb employer healthcare cost inflation that exceeded ten percent in 2026. Distribution is accelerated by strategic partnerships with the nation's five largest health plans and three largest pharmacy benefit managers, who offer Hinge Health as an integrated or turnkey benefit. Capital allocation remains balanced between organic clinical development, inorganic expansion—such as the $105 million all-cash acquisition of digestive health platform Cylinder Health in August 2026—and shareholder returns under an expanded $300 million share repurchase authorization. Exhibit TO003 outlines key institutional stakeholders and corresponding diligence priorities.
  - id: "strategic-milestones"
    title: "Operational Evolution and Strategic Milestones"
    claimRefs:
      - "CO003"
      - "CO005"
      - "CO006"
      - "CO009"
      - "CO010"
      - "CO013"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
    body: |
      The strategic trajectory of Hinge Health reflects a disciplined evolution from single-indication sensor hardware toward a multi-condition, software-first care automation platform. Early iterations required physical motion sensors strapped to limbs to verify movement compliance. Recognizing that hardware distribution created logistical friction and elevated member churn, the engineering team pioneered TrueMotion computer vision technology, enabling standard smartphone cameras to track 100 anatomical body points in real time and deliver automated exercise corrections. This transition dramatically reduced delivery costs, expanding gross margins toward 87% and enabling clinician capacity to scale without linear headcount growth.

      Subsequent milestones established commercial breadth across adjacent clinical conditions sharing neurological or behavioral comorbidity with MSK. In 2022, Hinge Health introduced women's pelvic health, followed by a clinically validated fall prevention program in 2023 that demonstrated a 37% reduction in falls among older adults. In 2025, the company went public on the NYSE and launched HingeSelect, a high-performance network of over 5,000 in-person clinical facilities. The momentum accelerated in 2026 with FDA clearance and rapid commercial adoption of its Migraine Care Program (covering five million lives across 450 enterprise clients) and the strategic acquisition of Cylinder Health to enter the $135 billion gastrointestinal care market. Exhibit FO001 maps these foundational milestones.
