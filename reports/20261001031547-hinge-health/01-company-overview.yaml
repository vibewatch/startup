callouts:
  - calloutType: "strength"
    title: "Proprietary Care Automation Operating Leverage"
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
    body: "Hinge Health's software-driven model automates approximately 95% to 97% of human clinician hours compared to traditional outpatient physical therapy, enabling the company to serve 47% more members year-over-year while holding care team staffing costs virtually flat and expanding non-GAAP operating margin to 29%."
  - calloutType: "risk"
    title: "Multi-Condition Integration and Regulatory Gaps"
    claimRefs:
      - "CO005"
      - "CO009"
      - "CO013"
    body: "While Hinge Health is executing a rapid multi-product expansion into migraine and gastrointestinal care via the $105 million Cylinder Health acquisition, public disclosure remains sparse regarding formal FDA determinations on its TrueMotion computer vision software, and long-term customer willingness to bundle non-MSK conditions under a unified subscription remains untested at enterprise scale."
