evidenceGaps:
  - type: missing-source
    severity: material
    topic: fda-truemotion-regulatory-determination
    missingEvidence: >-
      Official FDA correspondence, 510(k) premarket notification clearance letter, or De Novo classification ruling
      specific to the TrueMotion computer vision software pipeline.
    whyItMatters: >-
      While Enso and Migraine programs hold formal 510(k) clearances, TrueMotion operates as an unclassified or
      enforcement-discretion software tool; changes in FDA digital health oversight could impose unexpected compliance
      costs or clinical validation hurdles.
    diligencePath: >-
      Review FDA CDRH 510(k) public database and request regulatory counsel audit of company communications with FDA
      digital health division.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-map-institutional-holdings
    missingEvidence: >-
      Complete post-lockup institutional shareholder cap table detailing individual venture fund ownership percentages
      and founder dual-class voting control ratios.
    whyItMatters: >-
      Enables comprehensive assessment of insider voting concentration, lockup expiration risk, and potential secondary
      market liquidity pressure.
    diligencePath: Inspect Schedule 13D/13G filings on SEC EDGAR and subsequent DEF 14A proxy statement upon publication.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: international-tam-expansion
    missingEvidence: >-
      Independent market sizing studies and regulatory approval timelines for digital MSK and virtual GI reimbursement
      across European and Asian enterprise markets.
    whyItMatters: >-
      Hinge Health's revenue remains overwhelmingly concentrated in US employer and commercial health plan accounts,
      leaving geographic diversification and global TAM unverified.
    diligencePath: >-
      Review commercial trial data and CE mark filings in the UK and EU; request geographic revenue breakdowns during
      management Q&A.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: pt-market-sizing-divergence
    missingEvidence: >-
      Reconciliation between Grand View Research's $11.6B global digital MSK estimate by 2030 and company disclosures
      projecting a $60B addressable US physical therapy spend.
    whyItMatters: >-
      Discrepant boundary definitions between software-only digital therapeutics and broader outpatient physical therapy
      service replacement affect long-term valuation multiples.
    diligencePath: Benchmark outpatient PT billing codes against Hinge Health's per-participant engagement fee model.
    relatedQuestionRefs:
      - QM002
  - type: missing-source
    severity: material
    topic: clinical-precision-benchmarks
    missingEvidence: >-
      Head-to-head clinical trial or independent comparative study evaluating patient adherence, joint angle measurement
      precision, and long-term recovery outcomes between Hinge Health's hybrid sensor/computer-vision TrueMotion
      platform and pure smartphone-camera software platforms like Kaia Health.
    whyItMatters: >-
      Direct comparative clinical data is necessary to determine whether Hinge Health's integrated hardware and sensor
      approach provides durable efficacy advantages that justify higher implementation costs over pure software
      substitutes.
    diligencePath: >-
      Review independent peer-reviewed orthopedic and digital health journal publications, request randomized controlled
      trial cross-study comparisons during management diligence, and audit employer pilot comparative performance
      records.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: unit-economics-opacity
    missingEvidence: >-
      Granular cohort-level customer acquisition costs (CAC), sales and marketing payback period in months, and net
      revenue retention (NRR) rates broken out by enterprise employer versus health plan channels.
    whyItMatters: >-
      Without segmented CAC and payback disclosures, investors cannot independently verify the marginal unit economics
      of expanding from self-insured employers into fully insured and Medicare Advantage populations.
    diligencePath: >-
      Request customer cohort retention schedules and direct sales efficiency metrics by channel in private diligence or
      upcoming investor day disclosures.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: computer-vision-benchmarks
    missingEvidence: >-
      Third-party peer-reviewed clinical validation comparing TrueMotion mobile camera tracking accuracy against
      clinical marker-based motion capture or in-person therapist assessments.
    whyItMatters: >-
      Validates whether pure smartphone-based motion tracking provides clinically equivalent guidance across varied body
      habitus and lighting conditions.
    diligencePath: >-
      Request unpublished clinical trial datasets or FDA regulatory submission documentation supporting TrueMotion
      tracking precision.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: minor
    topic: ai-agent-clinician-efficiency
    missingEvidence: >-
      Quantitative internal metrics measuring physical therapist hours saved per consultation from LangGraph and Claude
      Sonnet CareHub summarization agents.
    whyItMatters: >-
      Determines whether agentic AI investments tangibly expand clinician panel capacity and protect gross margins as
      membership expands.
    diligencePath: >-
      Review internal CareHub telemetry and time-motion studies comparing clinician session durations before and after
      LangGraph agent deployment.
    relatedQuestionRefs:
      - QE004
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: renewal-risk
    missingEvidence: Direct-client NRR, GRR, logo churn, renewal cohorts, contract duration, and renewal pricing by client segment.
    whyItMatters: >-
      Client growth and member yield cannot establish whether the installed base is durable or whether expansion masks
      churn.
    diligencePath: >-
      Request a quarterly client cohort export, renewal waterfall, churn reason codes, contract-term distribution, and
      reconciliations to reported client counts for 2024 through Q3 2026.
