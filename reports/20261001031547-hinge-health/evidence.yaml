  - type: missing-source
    severity: material
    topic: regulatory-fda-truemotion-inquiry
    missingEvidence: >-
      Public correspondence or formal guidance from the FDA confirming whether the TrueMotion computer vision
      motion-tracking platform requires a 510(k) premarket notification or De Novo classification.
    whyItMatters: >-
      A formal determination that TrueMotion constitutes Class II Software as a Medical Device (SaMD) could impose
      regulatory submission burdens, marketing claim constraints, or product deployment delays.
    diligencePath: >-
      Review FDA CDRH regulatory correspondence logs, 510(k) submission tracking databases, and inquire directly with
