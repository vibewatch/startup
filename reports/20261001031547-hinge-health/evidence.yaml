  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-evidence
    missingEvidence: >-
      A complete current customer roster with launch status, active utilization, outcomes, renewal dates, and
      independent references.
    whyItMatters: >-
      Public case studies and detected-use lists are selected samples and cannot establish production status or
      referenceability across the customer base.
    diligencePath: >-
      Reconcile CRM and billing records to a customer roster, then select references across employer sizes, verticals,
