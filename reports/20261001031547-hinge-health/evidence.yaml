    whyItMatters: >-
      The filing quantifies partner concentration but does not reveal whether economic exposure is also concentrated
      among a few underlying clients.
    diligencePath: >-
      Obtain anonymized top-20 client concentration schedules by revenue, contracted lives, active members, partner
      route, renewal date, and product.
