  topStrengths:
    - Category-leading scale in digital MSK with 2,929 enterprise clients and 25 million people with product access
    - Strong operating leverage, with 53% YoY revenue growth, 87% gross margin, and positive quarterly free cash flow
    - Multi-condition expansion into migraine and gastrointestinal care broadens the growth runway beyond core MSK
  topRisks:
    - FDA and software-classification scrutiny around TrueMotion and related clinical claims
    - Concentration in self-insured employer and health-plan distribution channels
    - Cylinder Health integration and broader multi-condition expansion execution risk
    - Valuation discipline and dilution/SBC overhang remain important public-market constraints
  unresolvedGaps:
    - Official FDA response to the TrueMotion inquiry and any 510(k) or De Novo status
    - Direct-client NRR, GRR, churn, and renewal cohort disclosure
    - Post-close integration economics and 2027 revenue contribution for Cylinder Health
    - Updated headcount and team-capacity disclosure after continued scaling
