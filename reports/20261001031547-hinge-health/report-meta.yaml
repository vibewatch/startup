companyProfile:
  summary: >-
    Hinge Health is a public digital health company that delivers AI-powered virtual musculoskeletal care and adjacent
    migraine and digestive-health programs through a hybrid software-plus-clinician model. Founded in 2014 by Daniel
    Perez and Gabriel Mecklenburg, the company sells primarily to self-insured employers and health plans, has scaled to
    2,929 enterprise clients, and is using its public-market balance sheet to broaden into multi-condition care while
    preserving strong operating leverage.
  foundedDate: '2014-01-01'
