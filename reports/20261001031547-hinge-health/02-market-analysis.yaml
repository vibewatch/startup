callouts:
  - calloutType: "insight"
    title: "Multi-Condition Expansion Transforms Single-Point Solution Economics"
    body: "By acquiring Cylinder Health for $105M and launching its Migraine Care Program, Hinge Health is transitioning from a specialized digital physical therapy tool into a multi-condition clinical platform. This evolution deepens enterprise client integration, increases average contract value, and insulates the business from point-solution vendor consolidation."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM009"
  - calloutType: "risk"
    title: "Employer Point-Solution Fatigue and Contract Consolidation Pressure"
    body: "Self-insured employers are actively pruning benefit portfolios to eliminate redundant vendor integrations and administrative overhead. Platforms unable to demonstrate rigorous multi-year ROI or cross-specialty clinical breadth risk disqualification during benefit renewal cycles."
    claimRefs:
      - "CM014"
      - "CM015"
