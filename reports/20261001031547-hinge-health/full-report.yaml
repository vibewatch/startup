            title: Secondary Market Volatility and Private Unit Economics Gaps
            body: >-
              Despite robust top-line momentum and raised 2026 guidance, substantial insider share liquidations totaling
              over $108 million and the absence of disclosed customer acquisition payback metrics demand rigorous
              diligence on true channel acquisition economics.
