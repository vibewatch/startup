  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Clinical Delivery Architecture and Member Experience
        blocks:
          - type: paragraph
            body: >-
              Hinge Health operates a hybrid digital clinic combining home-based physical therapy, health coaching, and
              clinical workflows delivered through a unified mobile and web platform. Members access therapeutic
              exercise sessions guided by real-time computer vision motion tracking (TrueMotion) or connected hardware
              sensors that monitor body position and guide recovery regimens. Care delivery is coordinated through
              CareHub, an internal platform that equips physical therapists, health coaches, care managers, and
              physicians with centralized member history, care plans, documentation, and communication tools. Rather
              than functioning as a pure software application, the platform integrates human clinicians with algorithmic
              guidance, allowing physical therapists to adjust care plans while automated services handle routine
              reminders and tracking.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE008
              - CE011
      - number: '5.2'
        title: Software Engineering Stack, Agentic AI, and Data Pipelines
        blocks:
          - type: paragraph
            body: >-
              The core production technology stack relies on React Native for cross-platform mobile delivery, React and
              TypeScript for frontend interfaces, and Node.js with NestJS and Ruby on Rails for backend services
              communicating via GraphQL and REST on AWS. Data management and caching utilize PostgreSQL and Redis
              deployed in Docker containers with trunk-based CI/CD deployment pipelines. Hinge Health has evolved its
              care platform toward AI-assisted workflows, integrating LangGraph.js to orchestrate stateful multi-node
              clinical agents that handle context gathering, reasoning, and automated documentation. These agentic
              workflows run Large Language Models such as Claude Sonnet via AWS Bedrock, monitored end-to-end using
              LangSmith for tracing, prompt versioning, and golden dataset regression testing. Dedicated analytics pods
              maintain automated pipelines to ingest claims data and evaluate economic outcomes across employer client
              populations.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE011
      - number: '5.3'
        title: Infrastructure Governance, Security, and Cross-Condition Expansion
        blocks:
          - type: paragraph
            body: >-
              Because Hinge Health processes sensitive Protected Health Information across self-insured employers and
              commercial health plans, its systems are architected to satisfy healthcare compliance standards including
              HIPAA, HITRUST, SOC 2, and CCPA. Technical leadership is organized into specialized R&D domains covering
              computer vision UX, hardware engineering, data and machine learning platforms, security, and growth
              infrastructure. Beyond its foundational musculoskeletal care programs, the company has expanded its
              clinical surface into adjacent therapeutic lines, including a Migraine care program launched in May 2026
              and an upcoming Gastrointestinal care line supported by the definitive agreement to acquire Cylinder
              Health for $105 million in cash. However, independent clinical benchmarks comparing computer vision
              efficacy to in-person physical therapy remain limited in public technical documentation.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Evolution to Agentic AI within Clinician-in-the-Loop Safeguards
            body: >-
              Hinge Health's technical architecture is transitioning from static clinical rules toward stateful agentic
              workflows using LangGraph.js and Claude Sonnet on AWS Bedrock. The engineering design explicitly
              incorporates human physical therapists and coaches within the loop, deploying LangSmith evaluation
              pipelines with golden datasets to guard against hallucinations before merging agent workflows.
            calloutType: insight
            claimRefs:
              - CE003
              - CE007
              - CE008
          - type: callout
            title: Multi-Condition Integration and Regulatory Boundary Diligence
            body: >-
              The acquisition of Cylinder Health and launch of Brain Health expand Hinge Health's technical scope into
              gastroenterology and neurological domains. Integrating disparate electronic health records and maintaining
              clinical AI boundaries under FDA digital health scrutiny represent material integration risks as the
              platform scales across conditions.
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, payer, user, and channel architecture
        blocks:
          - type: paragraph
            body: >-
              Hinge Health is a B2B2C benefit: employers, health plans, government entities, PBMs, TPAs, and related
              ecosystem partners buy or distribute access, while eligible employees and plan members use the care
              experience. The company says the app combines the care team, appointments, and progress in one employer-
              or health-plan-covered interface, and its investor overview describes an AI-supported model combining
              wearable devices with clinicians. The filed sales model is segmented across enterprise, large-market,
              mid-market, public-sector, labor-union, and health-system clients, with the employer team focused mainly
              on self-insured organizations. Bloomberry's job-posting analysis separately identifies HR and Benefits
              leaders as the key purchasing roles. Distribution is therefore broad by end-user and employer type, but
              commercially intermediated: the filing says a majority of clients were contracted through partnerships at
              year-end 2025.
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU012
              - CU013
          - type: figure
