            body: >-
              Hinge Health has achieved elite SaaS-like gross margins of 86% and quarterly free cash flow exceeding $99
              million, proving that its AI-driven clinical automation dramatically decouples top-line revenue expansion
              from clinical payroll costs.
            calloutType: strength
            claimRefs:
