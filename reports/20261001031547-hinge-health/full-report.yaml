  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Spend Segmentation
        blocks:
          - type: paragraph
            body: >-
              The market boundary for digital musculoskeletal (MSK) care sits at the intersection of enterprise employer
              healthcare cost containment and automated physical therapy delivery. Musculoskeletal disorders represent a
              massive economic burden in the United States, generating approximately $661 billion in direct medical
              expenditures and an additional $624 billion in indirect workplace absenteeism and disability costs
              annually. Within this vast medical category, digital MSK platforms primarily target the outpatient
              physical therapy services sector, estimated at $60 billion annually, where conservative exercise therapy,
              sensor-guided biofeedback, and behavioral pain coaching can substitute for costly in-person therapy
              sessions. Excluded from this addressable digital perimeter are acute inpatient orthopedic surgeries,
              emergency trauma care, and complex spinal instrumentation procedures that inherently require hospital
              operating facilities. Furthermore, Hinge Health's strategic expansion through the acquisition of Cylinder
              Health has enlarged its clinical boundary into virtual gastrointestinal care, an adjacent chronic
              condition category responsible for approximately $135 billion in direct annual U.S. healthcare spending.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM012
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and Multi-Category Opportunity'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Hinge Health's market opportunity requires analyzing multiple market sizing lenses across
              varying payer tiers and clinical scopes rather than relying on a single broad total addressable market
              figure. Globally, the digital health market for musculoskeletal care is expanding at a 17.7% compound
              annual growth rate toward an estimated $11.6 billion by 2030, driven by an aging demographic of over 1.7
              billion people suffering from chronic joint and spinal conditions. In the domestic enterprise channel,
              Hinge Health's core serviceable addressable market across self-insured employers represents approximately
              $10 billion in potential annual spending, with fully-insured commercial health plans and Medicare
              Advantage adding an $8 billion opportunity. Broader public programs, including Medicare and Medicaid,
              present a further $9 billion market encompassing 112 million covered lives. Despite reaching 25 million
              contracted lives and over 2,900 enterprise accounts, management notes that its existing footprint captured
              only 5% of its addressable market prior to multi-condition expansion. The acquisition of Cylinder Health
              for $105 million in cash directly broadens this addressable frontier by incorporating gastrointestinal
              care into a unified multi-condition enterprise platform.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
