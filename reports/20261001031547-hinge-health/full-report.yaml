              - CO009
              - CO011
      - number: '1.2'
        title: Founders, Executive Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Hinge Health was established out of personal adversity when co-founders Daniel Perez and Gabriel
              Mecklenburg experienced severe traumatic orthopaedic injuries as doctoral students and endured extensive,
              inconvenient rehabilitation programs. Their shared frustration with outpatient physical therapy clinic
              logistics and variable clinical quality inspired the founding thesis of software-delivered, home-based
              rehabilitation. Over twelve years of corporate evolution, both founders have maintained hands-on
              operational leadership. Perez serves as Chief Executive Officer, steering strategic vision, enterprise
              commercialization, and investor relations, while Mecklenburg leads technology architecture, engineering,
              and artificial intelligence development as Chief Technology Officer.


              To support its transition from a venture-backed growth startup to a publicly listed corporation on the New
              York Stock Exchange, the company augmented founder leadership with veteran executive talent. President Jim
              Pursley leads the enterprise sales force and oversees strategic distribution alliances across sixty health
              plans and pharmacy benefit managers. Chief Financial Officer James Budge directs capital allocation,
              financial controls, and M&A execution. Governance structures balance entrepreneurial agility with public
              reporting accountability, although the company exhibits material key-person dependence on Perez and
              Mecklenburg for long-term product vision and clinical automation architecture. Detailed executive profiles
              and governance coverage are presented in Exhibit TO002.
            claimRefs:
              - CO006
              - CO008
              - CO010
              - CO012
              - CO013
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO008
              - CO010
      - number: '1.3'
        title: Capitalization, Public Listing, and Stakeholder Ecosystem
        blocks:
          - type: paragraph
            body: >
              Prior to its public listing, Hinge Health secured more than $825 million in equity capital across
              institutional funding rounds backed by prominent venture firms including Tiger Global Management, Coatue,
              Bessemer Venture Partners, and Atomico. In May 2025, the company completed its initial public offering on
              the New York Stock Exchange under ticker symbol HNGE at an initial public offering price of $32.00 per
              share. Public trading provided currency for strategic initiatives while subjecting the company to public
              market equity valuation dynamics, including periodic multiple compression when the stock retreated 38%
              from post-IPO highs in early 2026 before stabilizing on robust earnings results.


              The company's commercial resilience rests on a deeply integrated ecosystem of institutional stakeholders.
              Self-insured employers serve as the core economic buyers, seeking verifiable medical cost savings to curb
              employer healthcare cost inflation that exceeded ten percent in 2026. Distribution is accelerated by
              strategic partnerships with the nation's five largest health plans and three largest pharmacy benefit
              managers, who offer Hinge Health as an integrated or turnkey benefit. Capital allocation remains balanced
              between organic clinical development, inorganic expansion—such as the $105 million all-cash acquisition of
              digestive health platform Cylinder Health in August 2026—and shareholder returns under an expanded $300
              million share repurchase authorization. Exhibit TO003 outlines key institutional stakeholders and
              corresponding diligence priorities.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO009
              - CO012
              - CO014
              - CO015
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO011
              - CO012
              - CO013
      - number: '1.4'
        title: Operational Evolution and Strategic Milestones
        blocks:
          - type: paragraph
            body: >
              The strategic trajectory of Hinge Health reflects a disciplined evolution from single-indication sensor
              hardware toward a multi-condition, software-first care automation platform. Early iterations required
              physical motion sensors strapped to limbs to verify movement compliance. Recognizing that hardware
              distribution created logistical friction and elevated member churn, the engineering team pioneered
              TrueMotion computer vision technology, enabling standard smartphone cameras to track 100 anatomical body
              points in real time and deliver automated exercise corrections. This transition dramatically reduced
              delivery costs, expanding gross margins toward 87% and enabling clinician capacity to scale without linear
              headcount growth.


              Subsequent milestones established commercial breadth across adjacent clinical conditions sharing
              neurological or behavioral comorbidity with MSK. In 2022, Hinge Health introduced women's pelvic health,
              followed by a clinically validated fall prevention program in 2023 that demonstrated a 37% reduction in
              falls among older adults. In 2025, the company went public on the NYSE and launched HingeSelect, a
              high-performance network of over 5,000 in-person clinical facilities. The momentum accelerated in 2026
              with FDA clearance and rapid commercial adoption of its Migraine Care Program (covering five million lives
              across 450 enterprise clients) and the strategic acquisition of Cylinder Health to enter the $135 billion
              gastrointestinal care market. Exhibit FO001 maps these foundational milestones.
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO009
              - CO010
              - CO013
              - CO014
