chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Scale, and Business Model
        blocks:
          - type: paragraph
            body: >
              Founded in 2014 by Daniel Perez and Gabriel Mecklenburg, Hinge Health, Inc. (NYSE: HNGE) is an enterprise
              digital healthcare company headquartered in San Francisco, California. The company addresses the full
              continuum of musculoskeletal (MSK) pain and injury, ranging from acute sprains to chronic back and joint
              conditions, pre- and post-surgical rehabilitation, and specialized pelvic health. Rather than providing
              static video exercise libraries or relying on labor-intensive clinical appointments, Hinge Health combines
              clinical care teams with proprietary software, computer vision movement analysis, and targeted wearable
              pain relief technology to automate substantial portions of care delivery. The company sells primarily
              through a B2B2C commercial model to self-insured employer benefit plans and major commercial health plans,
              covering contracted member lives under multi-year recurring subscription contracts.


              By the second quarter of 2026, Hinge Health achieved significant operating scale, generating $212.8
              million in quarterly GAAP revenue (+53% year-over-year) and expanding its client roster to 2,929
              enterprise employers and health plan sponsors. LTM calculated billings reached $861.8 million, up 52%
              year-over-year, supported by strong member yield and high customer retention. Operational leverage
              continued to widen, as second-quarter gross margins reached 87% and free cash flow surged to $99.6
              million. Demonstrating commercial momentum heading into the peak annual benefits enrollment season,
              corporate management raised full-year 2026 revenue guidance to between $856 million and $860 million,
              representing 46% growth at the midpoint. Key operating metrics and diligence baselines are synthesized in
              Exhibit TO001.
            claimRefs:
              - CO001
              - CO003
              - CO004
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
