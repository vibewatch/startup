            claimRefs:
              - CI001
              - CI002
              - CI005
              - CI006
              - CI007
      - number: '4.2'
        title: Go-to-Market Economics and Pricing Structure
        blocks:
          - type: paragraph
            body: >-
              Hinge Health's go-to-market motion centers on channel distribution partnerships with over 50 healthcare
              ecosystem leaders, including the five largest national commercial health plans by self-insured lives and
              the top three pharmacy benefit managers. These relationships allow enterprise clients to turn on Hinge
              Health with minimal procurement friction and pre-cleared information security reviews. Sales cycles follow
              a distinct seasonal pattern where the majority of enterprise contracts are negotiated and finalized during
              the second half of each calendar year to coincide with employee open enrollment, followed by programmatic
              launches in the subsequent first half. To expand its addressable footprint beyond standard subscriptions,
              management introduced a utilization-based pricing structure in early 2025, which reached approximately 40%
              of contracted eligible lives by mid-2025 while maintaining average selling price parity. Enterprise client
              count reached 2,929 by June 30, 2026, demonstrating durable 24% annual account growth alongside a
              sustained 97% client logo retention rate.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI009
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
      - number: '4.3'
        title: Cost Structure, Unit Economics, and Operating Leverage
        blocks:
          - type: paragraph
            body: >-
              Hinge Health exhibits extraordinary operating leverage resulting from its technology-automated care
              delivery model, which decouples patient volume expansion from clinical labor headcount. By replacing
              manual physical therapy supervision with computer-vision movement tracking and generative AI care team
              assistants, the company reduced traditional physical therapy staff hours by approximately 95%.
              Consequently, GAAP gross margin expanded to 86% in the second quarter of 2026, compared to 70% in the
              prior-year period, while non-GAAP gross margin reached 87%. Non-GAAP operating margin expanded to 29%,
              driven by disciplined sales and marketing spend and flat care team costs despite a 50% increase in active
              patient volume. However, private diligence gaps remain around granular customer acquisition cost (CAC)
              payback periods across distinct enterprise direct versus health plan reseller channels, requiring
              underwriters to request segmented cohort retention data to verify long-term channel efficiency.
            claimRefs:
