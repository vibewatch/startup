schemaVersion: "report-v2"
artifact: customers
slug: hinge-health
runDate: 2026-10-01
company:
  name: Hinge Health
chapter:
  number: 6
  title: Customers
  summary: >-
    Hinge Health reported 2,929 clients at June 30, 2026, up 24% year over year,
    while independent reporting described 25 million people with product access
    and rapid early adoption of its migraine program. The customer base has broad
    employer reach, but 2025 revenue was heavily routed through a few health-plan
    partners and the assigned evidence does not disclose direct-client retention
    or concentration metrics.
sections:
  - id: customer-architecture
    title: Buyer, payer, user, and channel architecture
    body: >-
      Hinge Health is a B2B2C benefit: employers, health plans, government
      entities, PBMs, TPAs, and related ecosystem partners buy or distribute
      access, while eligible employees and plan members use the care experience.
      The company says the app combines the care team, appointments, and progress
      in one employer- or health-plan-covered interface, and its investor overview
      describes an AI-supported model combining wearable devices with clinicians.
      The filed sales model is segmented across enterprise, large-market,
      mid-market, public-sector, labor-union, and health-system clients, with the
      employer team focused mainly on self-insured organizations. Bloomberry's
      job-posting analysis separately identifies HR and Benefits leaders as the
      key purchasing roles. Distribution is therefore broad by end-user and
      employer type, but commercially intermediated: the filing says a majority
      of clients were contracted through partnerships at year-end 2025.
    claimRefs: [CU003, CU004, CU011, CU012, CU013]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory and expansion signals
    body: >-
      Reported client growth remained strong through the first half of 2026.
      Fierce Healthcare reported 2,849 clients at March 31, up 23% year over year;
      Hinge Health then reported 2,929 clients at June 30, up 24% from 2,359 a
      year earlier. The same independent report said 25 million people had access
      through employers and health plans. Expansion within the installed base is
      visible but should not be confused with retention: more than 125 clients
      covering over two million people had adopted migraine care by May, while a
      syndicated earnings summary attributed Q2 revenue growth partly to targeted
      enrollment and member referrals. These are adoption and yield signals, not
      disclosed GRR, NRR, churn, or renewal-rate measures.
    claimRefs: [CU001, CU002, CU003, CU008, CU009]
    tableRefs: [TU002]
  - id: named-proof
    title: Named customer proof and evidence quality
    body: >-
      The public proof set includes named employers and quantified outcomes, but
      its evidentiary quality is uneven. Hinge Health's case-study index says
      CHRISTUS Health reduced pain by 50% and saved $424 per participant, and
      says Northside Hospital achieved a 3.5x return on investment in under one
      year. Those are specific production-oriented outcome claims, yet the
      assigned page is a company-issued catalog rather than an independent audit
      and does not expose cohort definitions or calculation detail. Bloomberry
      adds third-party detection of employers such as Virginia Farm Bureau,
      Owensboro Health, MidFirst Bank, and Johnson Controls, but the fetched list
      does not establish contract status, utilization, or outcomes. Named logos
      therefore support breadth, not renewal durability.
    claimRefs: [CU011, CU014, CU015]
    tableRefs: [TU003]
  - id: durability-and-concentration
    title: Durability, procurement friction, and concentration
    body: >-
      The strongest contrary evidence comes from Hinge Health's own filing.
      Employer sales cycles average roughly five months and can exceed 12 months
      for large complex deals. Most health-plan agreements run three years, but
      plans can generally terminate unilaterally or seek renegotiation, and client
      contracts often include engagement, member-outcome, and ROI guarantees.
      Channel concentration is material: partner-routed client contracts produced
      82% of 2025 revenue, and HCSC, Elevance, and Aetna represented 17.5%, 13.7%,
      and 10.5%, respectively. Multi-product adoption and referrals may deepen
      relationships, but they do not remove this dependency. AInvest also reported
      a major-insurer partnership targeting more than five million new users by
      mid-2026; the assigned evidence does not verify that the target was achieved.
      Direct-client NRR, GRR, churn, renewal cohorts, contract duration, and
      top-client revenue shares remain diligence requirements.
    claimRefs: [CU005, CU006, CU007, CU009, CU010, CU016]
tables:
  - id: TU001
    title: Customer segmentation by commercial role
    columns:
      - Segment
      - Buyer / payer
      - User
      - Scale or route
      - Strategic value
      - Evidence gap
    rows:
      - - Self-insured employers
        - HR and Benefits leaders
        - Employees and dependents
        - Direct employer sales plus partner-enabled contracting
        - Core enterprise distribution and contracted lives
        - Revenue by employer size and vertical is not disclosed
      - - Health plans, PBMs, and TPAs
        - Plan or partner organization
        - Self-insured and fully insured populations
        - More than 60 partners at December 31, 2025
        - Contracting, implementation, billing, and employer access
        - Partner-level member activation is not disclosed
      - - Public sector, labor unions, and health systems
        - Benefits or procurement organization
        - Members, workers, and healthcare employees
        - Dedicated employer-sales segments in the filed model
        - Extends reach beyond conventional corporate employers
        - Segment client counts and renewal rates are not disclosed
      - - Eligible individuals
        - Employer or health plan funds access
        - Member uses the covered app and care team
        - 25 million people reportedly had access in May 2026
        - Converts contracted lives into engaged members
        - Access is not the same as enrollment or active use
    notes: >-
      Segmentation combines Hinge Health's 2025 Form 10-K, official product
      positioning, Bloomberry job-posting analysis, and Fierce Healthcare
      reporting; scale measures use different denominators and are not additive.
    claimRefs: [CU003, CU004, CU012, CU013]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Value
      - As of / period
      - Source basis
      - Confidence
      - Implication
      - Missing denominator or qualification
    rows:
      - - Clients
        - "2,849; +23% year over year from 2,311"
        - March 31, 2026
        - Fierce Healthcare reporting company results
        - Medium
        - Broad client acquisition continued into 2026
        - Client definition and active-member count are separate
      - - Clients
        - "2,929; +24% year over year from 2,359"
        - June 30, 2026
        - Hinge Health Q2 results
        - Medium
        - Client growth persisted in Q2
        - Company-reported; no direct renewal cohort
      - - People with product access
        - 25 million
        - May 2026
        - CEO statement reported by Fierce Healthcare
        - Medium
        - Large top-of-funnel population
        - Access does not establish enrollment, use, or retention
      - - Migraine Care Program adoption
        - More than 125 clients covering more than 2 million people
        - May 2026
        - Fierce Healthcare reporting executive statements
        - Medium
        - Early cross-sell into the installed base
        - Active users and recurring revenue contribution not disclosed
      - - Q2 revenue-growth driver
        - "53% revenue growth; attributed primarily to yield improvements"
        - Q2 2026
        - Moby earnings summary syndicated by Yahoo Finance
        - Medium
        - Enrollment campaigns and referrals appear commercially relevant
        - Revenue growth is not customer growth or retention
    notes: >-
      Values retain each source's metric, period, and denominator; client count,
      covered lives, program adoption, and revenue growth are different measures
      and should not be combined into a conversion funnel.
    claimRefs: [CU001, CU002, CU003, CU008, CU009]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - CHRISTUS Health
        - Health system employer
        - MSK benefit for workforce
        - Case-study deployment; pilot status not stated
        - "50% pain reduction and $424 saved per participant"
        - Company-issued summary; cohort and savings method absent
      - - Northside Hospital
        - Health system employer
        - Complementary MSK care model
        - Case-study deployment; pilot status not stated
        - 3.5x ROI in under one year
        - Company-issued summary; ROI calculation absent
      - - Air Liquide
        - Global industrial employer
        - Employee MSK cost and health program
        - Listed case study; status detail absent
        - Significant cost savings claimed without a value on the index
        - No quantified result in the assigned fetched page
      - - Molson Coors
        - Global beverage employer
        - Employee health and wellbeing
        - Listed case study; status detail absent
        - No quantified outcome on the index
        - No independent validation or utilization detail
      - - Virginia Farm Bureau Family of Companies
        - Insurance employer
        - Hinge Health use detected by Bloomberry
        - Production and contract status unknown
        - No outcome disclosed
        - Third-party detection does not prove active deployment
    notes: >-
      Sample, not a complete customer list. Hinge Health rows come from its
      company-issued case-study index; the Virginia Farm Bureau row comes from
      Bloomberry's detected-use list. Null-equivalent details are described as
      undisclosed rather than estimated.
    enumerationScope:
      coverage: sample
      basis: >-
        Representative named organizations visible in the assigned company
        case-study index and Bloomberry detected-use list through October 1, 2026.
    claimRefs: [CU011, CU014, CU015]
figures:
  - id: FU001
    title: Customer access, adoption, and expansion journey
    type: journey-map
    summary: >-
      Commercial access flows from purchaser and partner contracting to eligible
      lives, enrollment, care engagement, measured outcomes, and cross-sell.
    data:
      items:
        - label: Contract
          detail: Employers or health-plan partners purchase or enable access.
          touchpoints:
            - Employer benefits team
            - Health plan, PBM, or TPA
        - label: Eligible access
          detail: Contracted lives become eligible for the covered benefit.
          touchpoints:
            - Partner populations
            - Employer workforce
        - label: Enrollment
          detail: Targeted campaigns and benefits teams encourage enrollment.
          touchpoints:
            - Open enrollment
            - Clinically targeted outreach
        - label: Care engagement
          detail: Members use the app, care team, and connected services.
          touchpoints:
            - App
            - Clinicians and care team
        - label: Outcome proof
          detail: Engagement, member outcomes, and ROI can affect guarantees and renewal.
          touchpoints:
            - Client reporting
            - Performance guarantees
        - label: Expansion
          detail: Referrals and additional conditions can increase yield within clients.
          touchpoints:
            - Member referrals
            - Migraine and GI programs
    approximationNotes: >-
      Conceptual journey only; it does not imply conversion rates or a common
      population across client, eligible-life, enrollment, and revenue measures.
    claimRefs: [CU003, CU009, CU010, CU013]
callouts:
  - calloutType: risk
    title: Partner reach is also partner concentration
    body: >-
