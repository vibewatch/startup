chapter:
  number: 5
  title: "Product & Technology"
  summary: "Hinge Health delivers an integrated digital clinic combining computer vision motion tracking, connected devices, and hybrid clinical care teams orchestrated by modern web and AI services. Its engineering platform spans React Native, Node.js/NestJS, and LangGraph clinical agents on AWS, backed by HIPAA, HITRUST, and SOC 2 security controls, though long-term regulatory classification of autonomous motion guidance remains an ongoing diligence area."
sections:
  - id: "care-delivery-platform"
    title: "Clinical Delivery Architecture and Member Experience"
    body: "Hinge Health operates a hybrid digital clinic combining home-based physical therapy, health coaching, and clinical workflows delivered through a unified mobile and web platform. Members access therapeutic exercise sessions guided by real-time computer vision motion tracking (TrueMotion) or connected hardware sensors that monitor body position and guide recovery regimens. Care delivery is coordinated through CareHub, an internal platform that equips physical therapists, health coaches, care managers, and physicians with centralized member history, care plans, documentation, and communication tools. Rather than functioning as a pure software application, the platform integrates human clinicians with algorithmic guidance, allowing physical therapists to adjust care plans while automated services handle routine reminders and tracking."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE001"
      - "TE002"
    figureRefs:
      - "FE001"
  - id: "software-stack-and-ai-systems"
    title: "Software Engineering Stack, Agentic AI, and Data Pipelines"
    body: "The core production technology stack relies on React Native for cross-platform mobile delivery, React and TypeScript for frontend interfaces, and Node.js with NestJS and Ruby on Rails for backend services communicating via GraphQL and REST on AWS. Data management and caching utilize PostgreSQL and Redis deployed in Docker containers with trunk-based CI/CD deployment pipelines. Hinge Health has evolved its care platform toward AI-assisted workflows, integrating LangGraph.js to orchestrate stateful multi-node clinical agents that handle context gathering, reasoning, and automated documentation. These agentic workflows run Large Language Models such as Claude Sonnet via AWS Bedrock, monitored end-to-end using LangSmith for tracing, prompt versioning, and golden dataset regression testing. Dedicated analytics pods maintain automated pipelines to ingest claims data and evaluate economic outcomes across employer client populations."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
  - id: "security-compliance-and-portfolio-expansion"
    title: "Infrastructure Governance, Security, and Cross-Condition Expansion"
    body: "Because Hinge Health processes sensitive Protected Health Information across self-insured employers and commercial health plans, its systems are architected to satisfy healthcare compliance standards including HIPAA, HITRUST, SOC 2, and CCPA. Technical leadership is organized into specialized R&D domains covering computer vision UX, hardware engineering, data and machine learning platforms, security, and growth infrastructure. Beyond its foundational musculoskeletal care programs, the company has expanded its clinical surface into adjacent therapeutic lines, including a Migraine care program launched in May 2026 and an upcoming Gastrointestinal care line supported by the definitive agreement to acquire Cylinder Health for $105 million in cash. However, independent clinical benchmarks comparing computer vision efficacy to in-person physical therapy remain limited in public technical documentation."
    claimRefs:
      - "CE011"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
