callouts:
  - calloutType: "insight"
    title: "Evolution to Agentic AI within Clinician-in-the-Loop Safeguards"
    body: "Hinge Health's technical architecture is transitioning from static clinical rules toward stateful agentic workflows using LangGraph.js and Claude Sonnet on AWS Bedrock. The engineering design explicitly incorporates human physical therapists and coaches within the loop, deploying LangSmith evaluation pipelines with golden datasets to guard against hallucinations before merging agent workflows."
    claimRefs:
      - "CE003"
      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "Multi-Condition Integration and Regulatory Boundary Diligence"
    body: "The acquisition of Cylinder Health and launch of Brain Health expand Hinge Health's technical scope into gastroenterology and neurological domains. Integrating disparate electronic health records and maintaining clinical AI boundaries under FDA digital health scrutiny represent material integration risks as the platform scales across conditions."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE015"
