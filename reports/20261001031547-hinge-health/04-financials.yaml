company:
  name: "Hinge Health"
chapter:
  number: 4
  title: "Financials"
  summary: "Hinge Health demonstrates exceptional financial scale and operating leverage, generating $212.8M in Q2 2026 revenue with 53% year-over-year growth and an 86% GAAP gross margin. Driven by its AI care automation that cuts human clinical hours by 95%, the business produced $99.6M in quarterly free cash flow and raised its full-year 2026 revenue guidance midpoint to $858M. However, substantial recent insider share liquidations of over $108M, negative projected return on equity, and opaque customer acquisition cost payback metrics remain key diligence watch items."
sections:
  - id: "sec-revenue-model"
    title: "Revenue Streams and Commercial Monetization"
    body: "Hinge Health operates primarily on an enterprise business-to-business-to-consumer (B2B2C) commercial model, contracting directly with self-insured employers, health plans, and public sector benefit trusts to deliver digital musculoskeletal (MSK) therapy. The company monetizes through member enrollment and active digital therapy engagement rather than passive per-employee-per-month (PEPM) access fees, tightly aligning customer billing with demonstrated clinical utilization. During the second quarter of 2026, Hinge Health generated record revenue of $212.8 million, up 53% year-over-year from $139.1 million in the second quarter of 2025. Commercial billings follow a three-variable formula comprising eligible covered lives, enrollment yield into active participants, and average realized price per member. In addition to core MSK programs, the company is expanding its monetization footprint through its high-performance in-person HingeSelect network and its announced $105 million cash acquisition of Cylinder Health, establishing an integrated multi-condition platform spanning musculoskeletal and digestive care."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI007"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"

  - id: "sec-pricing-gtm"
    title: "Go-to-Market Economics and Pricing Structure"
    body: "Hinge Health's go-to-market motion centers on channel distribution partnerships with over 50 healthcare ecosystem leaders, including the five largest national commercial health plans by self-insured lives and the top three pharmacy benefit managers. These relationships allow enterprise clients to turn on Hinge Health with minimal procurement friction and pre-cleared information security reviews. Sales cycles follow a distinct seasonal pattern where the majority of enterprise contracts are negotiated and finalized during the second half of each calendar year to coincide with employee open enrollment, followed by programmatic launches in the subsequent first half. To expand its addressable footprint beyond standard subscriptions, management introduced a utilization-based pricing structure in early 2025, which reached approximately 40% of contracted eligible lives by mid-2025 while maintaining average selling price parity. Enterprise client count reached 2,929 by June 30, 2026, demonstrating durable 24% annual account growth alongside a sustained 97% client logo retention rate."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI009"
    tableRefs:
      - "TI002"

  - id: "sec-cost-margins"
    title: "Cost Structure, Unit Economics, and Operating Leverage"
    body: "Hinge Health exhibits extraordinary operating leverage resulting from its technology-automated care delivery model, which decouples patient volume expansion from clinical labor headcount. By replacing manual physical therapy supervision with computer-vision movement tracking and generative AI care team assistants, the company reduced traditional physical therapy staff hours by approximately 95%. Consequently, GAAP gross margin expanded to 86% in the second quarter of 2026, compared to 70% in the prior-year period, while non-GAAP gross margin reached 87%. Non-GAAP operating margin expanded to 29%, driven by disciplined sales and marketing spend and flat care team costs despite a 50% increase in active patient volume. However, private diligence gaps remain around granular customer acquisition cost (CAC) payback periods across distinct enterprise direct versus health plan reseller channels, requiring underwriters to request segmented cohort retention data to verify long-term channel efficiency."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI011"
    tableRefs:
      - "TI003"

  - id: "sec-capital-verdict"
    title: "Capital Adequacy, Cash Flow, and Diligence Verdict"
    body: "Hinge Health concluded the second quarter of 2026 with $475.6 million in cash, cash equivalents, marketable securities, and restricted cash, reflecting a fortress balance sheet with zero funded debt obligations. The business has proven self-funding capability, generating $99.6 million in quarterly free cash flow (a 46.8% free cash flow margin) and funding a $105 million cash acquisition of Cylinder Health alongside an authorized $496.5 million aggregate share repurchase program. Management raised full-year 2026 revenue guidance to between $856 million and $860 million, implying 46% annual growth at the midpoint. Despite these exceptional fundamentals, diligence underwriters must account for notable headwinds: company shares suffered a 31% pullback in early 2026, insiders executed over $108 million in secondary share liquidations, and independent consensus forecasts project a negative return on equity of -7.7% over a three-year horizon due to heavy stock-based compensation overhang. Capital adequacy is exceptional, but governance and valuation discipline require close scrutiny."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"

