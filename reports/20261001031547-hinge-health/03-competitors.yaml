callouts:
  - calloutType: "insight"
    title: "The Dual Consolidation Wave in Digital Musculoskeletal Care"
    body: "The competitive landscape for digital MSK care is experiencing consolidation across two distinct dimensions: direct peer mergers, exemplified by Sword Health acquiring Kaia Health in January 2026, and category expansion into adjacent chronic conditions, evidenced by Hinge Health acquiring Cylinder Health for $105 million to enter digestive health. As enterprise buyers seek to reduce vendor sprawl, standalone single-joint point solutions face mounting pressure to either merge or offer multi-condition care."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP011"
  - calloutType: "risk"
    title: "Displacement Risk from Bundled Chronic Disease Management Suites"
    body: "While Hinge Health maintains a formidable moat in specialized MSK care supported by patented wearable hardware and FDA-cleared devices, broad healthcare platforms and chronic care aggregators could pose long-term displacement risks if employers shift procurement toward bundled per-member-per-month suites. Standalone solutions must continually demonstrate superior audited medical claims ROI to justify separate contracting."
    claimRefs:
      - "CP005"
      - "CP012"
      - "CP014"
