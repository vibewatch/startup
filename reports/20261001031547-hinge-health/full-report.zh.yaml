            body: >-
              与传统门诊物理治疗相比，Hinge Health 的软件驱动模式可替代约 95% 至 97% 的专业医护工时；这让公司在医护团队薪酬开支基本持平的情况下，服务会员数同比增长 47%，并将 Non-GAAP
