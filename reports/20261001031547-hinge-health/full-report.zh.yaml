      - number: '6.2'
        title: 推广演进路径与业务扩张信号
        blocks:
          - type: paragraph
            body: >-
              据报道，公司客户规模在 2026 年上半年保持强劲增长。Fierce Healthcare 报道称，截至 3 月 31 日其客户数为 2,849 家，同比增长 23%；Hinge Health 随后披露，截至 6
              月 30 日客户数达到 2,929 家，较上年同期的 2,359 家增长 24%。该独立报告同时指出，已有 25M
              人通过雇主及健康险计划获得服务准入资格。现有客群内部的增购拓展迹象明显，但不可与客户留存混为一谈：截至 5 月，已有逾 125 家客户采购了偏头痛护理，覆盖超 200
              万人；一份机构财报摘要则将第二季度收入增长部分归功于精准注册转化与会员推荐转介绍。这些属于业务推广与转化率信号，并非正式披露的 GRR、NRR、客户流失率或续约率指标。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
