              时阻力极小，并可直接沿用预先通过的信息安全审核。销售周期的季节性特征明显：绝大多数企业合同在每年下半年谈判并敲定，以便契合员工年度福利选聘期，随后在次年上半年落地实施。为在标准订阅之外拓宽服务边界，管理层于
              2025 年初推出了基于使用量的定价模式；截至 2025 年中，该模式在保持平均售价（ASP）基本相当的前提下，已覆盖约 40% 的签约合规人群。截至 2026 年 6 月 30 日，企业客户总数达到 2,929
