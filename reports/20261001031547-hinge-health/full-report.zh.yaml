            title: 多病种整合落地与监管边界尽调
            body: >-
              收购 Cylinder Health 与上线 Brain Health 脑健康项目，将 Hinge Health
              的技术触角延伸至胃肠病学与神经科学领域。随着平台向多病种延伸，打通不同格式的电子病历（EHR）系统，并在 FDA 数字医疗严格审查下守住临床 AI 的权责边界，构成了实质性的整合风险。
            calloutType: risk
            claimRefs:
              - CE013
              - CE014
              - CE015
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 买方、支付方、使用者与渠道体系
        blocks:
          - type: paragraph
            body: >-
              Hinge Health 属于典型的 B2B2C 福利产品：由雇主、健康险计划、政府机构、PBM、TPA 及相关生态伙伴采购或分发服务权益，合规雇员与参保会员则是具体护理体验的使用者。公司声称，其 App
              在雇主或保险覆盖的统一界面中整合了医护团队、预约挂号与康复进度追踪；投资人推介材料则将其描述为一套由 AI
              赋能、将可穿戴设备与医护人员相结合的模式。招股申报披露的销售体系划分为企业级、大型市场、中型市场、公共部门、工会及医疗系统等客群，其中雇主销售团队主要聚焦自保机构。Bloomberry
              的招聘数据分析亦印证，人力资源与福利负责人是核心采购决策角色。因此，从终端用户与雇主类型来看，其渠道覆盖面极广，但在商业端高度依赖中间渠道：申报文件显示，截至 2025 年底，大部分客户均通过合作伙伴关系签约。
            claimRefs:
              - CU003
              - CU004
              - CU011
              - CU012
              - CU013
