      - number: '1.3'
        title: 资本结构、公开上市与利益相关方生态
        blocks:
          - type: paragraph
            body: >
              上市之前，Hinge Health 在多轮机构融资中累计筹集超 $825M 股权资本，投资方包括 Tiger Global Management、Coatue、Bessemer Venture Partners
              及 Atomico 等知名风投机构。2025 年 5 月，公司完成在纽交所的首次公开募股，股票代码为 HNGE，发行价为每股
              $32.00。挂牌交易为推进战略举措提供了资金工具，但同时也让公司面临公开市场的估值波动：2026 年初股价自 IPO 后的高点回撤 38%，经历估值倍数压缩，随后依托亮眼的财务业绩企稳。


              公司的商业韧性建立在与机构利益相关者的深度绑定上。自保雇主是核心经济买方，其 2026
              年医疗福利成本通胀超过十个百分点，因而迫切寻求可量化验证的医疗控费手段。在渠道分发端，公司与全美前五大健康险计划及前三大药品福利管理机构达成战略合作，将其作为整合型或交钥匙福利引入，带动分发提速。资本配置兼顾自主临床研发、外延式扩张（如
              2026 年 8 月以               $105M 全现金收购消化健康平台 Cylinder Health）以及扩大至 $300M 的股票回购授权。核心机构利益相关者与尽调重点见图表 TO003。
