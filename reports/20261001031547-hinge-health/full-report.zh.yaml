  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 把经营规模、现金流验证、风险考量和估值约束串成“买入”建议的决策流。
    data:
      nodes:
        - id: scale-proof
          label: 经营规模与行业龙头地位
          detail: 2026 年 Q2 收入同比增长 53%，服务 2,929 家企业客户并打入财富 500 强
        - id: cash-generation
          label: 现金流与运营效率
          detail: 单季度自由现金流达 $99.6M，现金储备达 $475.6M，验证类软件高利润经济模型
        - id: platform-expansion
          label: 多病种护城河
          detail: 斥资 $105M 收购 Cylinder Health，将目标市场拓展至胃肠道健康领域
        - id: risk-monitoring
          label: 风险与压制因素检查
          detail: 持续跟踪 SBC 稀释、优先股转换为 85M–87M 股普通股以及雇主集中度风险
        - id: valuation-discipline
          label: 估值立场（合理）
          detail: 隐含企业价值为 $3.8B–$4.3B，对应 2026E 收入指引的 4.4x–5.0x EV/收入倍数
        - id: final-verdict
          label: 最终评级：买入
          detail: 风险调整后回报向好，置信度评级中等，风险评级中等
      edges:
        - from: scale-proof
          to: cash-generation
        - from: cash-generation
          to: platform-expansion
        - from: platform-expansion
          to: risk-monitoring
        - from: risk-monitoring
          to: valuation-discipline
        - from: valuation-discipline
          to: final-verdict
    approximationNotes: 决策流综合定性与定量阈值，推导出最终投资研判。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV006
      - CV008
      - CV010
      - CV014
