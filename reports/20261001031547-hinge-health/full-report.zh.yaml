  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与支出细分
        blocks:
          - type: paragraph
            body: >-
              数字肌肉骨骼（MSK）护理的市场边界，处于企业雇主医疗控费与自动化物理治疗交付的交汇点。肌肉骨骼疾病是美国医疗体系的沉重负担，每年产生约 $661B 的直接医疗支出，以及约 $624B
              因旷工和伤残造成的间接成本。在这一庞大医疗类别中，数字 MSK 平台主要锚定年规模估计为 $60B 的门诊物理治疗服务市场；             
              在这个场景里，保守运动疗法、传感器引导的生物反馈和行为疼痛指导可以替代昂贵的线下理疗。这一数字服务边界不包括急性住院骨科手术、急诊创伤处理以及必须依赖医院手术设施的复杂脊柱内固定术。此外，Hinge Health
              借助收购 Cylinder Health 展开战略扩张，将临床边界进一步延伸至虚拟胃肠道护理——这一相邻的慢性病领域每年产生约 $135B 的美国直接医疗支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
