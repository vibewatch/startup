      - number: '8.4'
        title: 资本结构、稀释压力与尽调重点
        blocks:
          - type: paragraph
            body: >-
              评估该投资标的，需对股权稀释隐忧与客户集中度保持严密跟踪。公司 2025 年 5 月 IPO 产生 $591 million 的 GAAP 股权激励费用，致使 GAAP 净利润与非 GAAP
              现金盈利水平长期背离。此外，随着剩余优先股转换为普通股，管理层预计到 2026 年底稀释后股份总数将扩增至 85 million 至 87 million 股。为对冲稀释效应，董事会将 A
              类普通股回购授权额度追加 $300 million 至总额 $496.5 million，并由 $475.6 million
              流动资产提供后盾。尽调须聚焦自保雇主福利方的客户集中度、跟踪健康险方案续约率，并厘清数字追踪算法的监管边界。
