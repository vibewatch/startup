            body: >-
              Hinge Health
              运营着一套“线上+线下”融合的数字诊所，通过统一的移动端与网页平台，提供居家物理治疗、健康指导及临床工作流。会员可在实时计算机视觉动作追踪系统（TrueMotion）或联网硬件传感器的指引下开展康复训练，由系统监测肢体位置并引导定制康复方案。医疗服务的交付由内部协同平台
              CareHub
