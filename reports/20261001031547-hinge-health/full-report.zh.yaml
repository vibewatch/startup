              $99.6M 自由现金流（自由现金流利润率达 46.8%），在出资 $105M 全现金收购 Cylinder Health 的同时，还获批了累计总额 $496.5M 的股票回购计划。管理层将 2026
              全年收入指引上调至 $856M 至 $860M 区间，以中点计算对应 46% 的年增长率。尽管基本面数据亮眼，尽调评估仍须正视显著的逆风因素：2026 年初公司股价曾经历 31%
