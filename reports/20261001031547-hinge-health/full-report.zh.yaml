      - number: '2.2'
        title: 市场规模测算视角：TAM、SAM 与多品类机遇
        blocks:
          - type: paragraph
            body: >-
              评估 Hinge Health 的市场机遇，需要从不同支付方层级与临床范畴切入、结合多维视角测算，而非单纯依赖单一宽泛的 TAM 估算。从全球来看，受逾 17
              亿慢性关节与脊柱疾病人群老龄化趋势驱动，肌肉骨骼数字医疗市场正以 17.7% 的复合年增长率扩张，预计到 2030 年将达到约 $11.6B。在美国本土企业渠道，Hinge Health
              面向自保雇主的核心可服务市场（SAM）年潜在支出规模约为 $10B；全额投保的商业健康险计划与 Medicare Advantage 则带来额外 $8B 的市场机遇。若进一步算入包含 Medicare 和
              Medicaid 在内的更广义公共项目，覆盖 1.12 亿人群的市场空间还将增加 $9B。尽管已覆盖 2,500 万签约人群及逾 2,900
              家企业客户，管理层仍指出，在开启多病种扩张前，公司现有业务仅渗透了其目标市场的 5%。以 $105M 现金收购 Cylinder
              Health，直接将胃肠道护理纳入统一的多病种企业服务平台，打开了可触达市场的新边界。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
