      - number: '3.2'
        title: 传统线下理疗网络与常规诊疗痛点
        blocks:
          - type: paragraph
            body: >-
              尽管数字医疗平台备受风投资金与企业界关注，但绝大部分肌肉骨骼医疗支出仍流向了由 ATI Physical Therapy、Select Physical Therapy 及 CORA Health
              Services 等连锁机构经营的传统线下理疗诊所 [CP007]。然而，传统门诊模式存在严重的系统性阻滞：临床使用率研究表明，本可从物理治疗中获益的患者中，最终完成全疗程的仅约
              9%，主要症结在于理疗师紧缺、往返路途耗时、预约繁琐、自付费用负担，以及 3 至 4 次就诊后的高脱落率 [CP008]。Hinge Health
              直击这一触达痛点，将康复方案搬进基于智能手机的居家工作流中；在雇主福利制度设计下，既免去了患者奔波之苦，又免除了自付费用。一项覆盖近 1,000 家雇主、超 20 万名会员、历时 5
              年的经审计医保理赔分析显示（据研究分析称），该数字化模式每年为人均节省 $2,941 的医疗支出，并达到经核实的 3.0 倍投资回报率 [CP005]。此外，与全美前五大商业健康险计划的全面商业合作，让
              Hinge Health 得以绕开地方转诊网络，在员工办理福利参保时便直接锁定患者客流 [CP006]。
