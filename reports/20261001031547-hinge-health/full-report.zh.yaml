              医护助手取代了传统线下人工理疗督导，将常规物理治疗人力工时削减了约 95%。因此，2026 年第二季度的 GAAP 毛利率由上年同期的 70% 飙升至 86%，Non-GAAP 毛利率更达到
              87%。销售与市场费用管控节制，且在活跃患者量激增 50% 的情况下医护团队成本基本持平，带动 Non-GAAP 营业利润率攀升至
