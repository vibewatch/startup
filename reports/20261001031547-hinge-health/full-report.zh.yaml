      - number: '1.2'
        title: 创始人、高管团队与公司治理
        blocks:
          - type: paragraph
            body: >
              Hinge Health 的创立源自一段切身困境：联合创始人 Daniel Perez 与 Gabriel Mecklenburg
              在攻读博士期间均遭遇严重骨科外伤，承受过繁琐低效的漫长康复过程。门诊物理治疗在就医流程与疗效参差上的痛点，促使二人确立了“基于软件交付居家康复”的创业假设。公司创立十二年来，两位创始人始终保持一线运营管理。Perez
              出任首席执行官，把控战略愿景、企业商业化落地与投资者沟通；Mecklenburg 担任首席技术官，主管技术架构、工程体系与人工智能研发。


              为支撑公司由风投支持的成长型初创企业向纽交所上市公司转型，管理层在创始人核心班底之外引入了多位资深高管。总裁 Jim Pursley 统领企业销售团队，并主导横跨 60
              家健康险计划与药品福利管理机构（PBM）的战略分发联盟。首席财务官 James Budge 主管资本配置、财务内控与并购执行。治理结构兼顾创业敏捷度与上市公司信披合规，但在长期产品愿景与临床自动化架构上，公司对
              Perez 和 Mecklenburg 仍存在实质性的关键人物依赖。高管团队履历与治理架构详见图表 TO002。
            claimRefs:
