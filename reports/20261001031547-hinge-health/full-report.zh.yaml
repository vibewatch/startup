              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 数字 MSK 直接竞品与行业整合浪潮
        blocks:
          - type: paragraph
            body: >-
              数字肌肉骨骼护理领域已告别早期高度分散的单点工具竞争，逐步演变为由 Hinge Health 领跑的高集中度市场。第三方追踪数据及 SEC 披露的主要竞争对手名单显示，Sword Health
              Technologies、Kaia Health Software、DarioHealth、Omada Health 与 Vori Health 是争夺企业雇主及保险公司合同的核心数字竞品
              [CP001]。2026 年 1 月，Sword Health 收购欧洲数字 MSK 竞品 Kaia Health，将两家头部挑战者平台的可穿戴传感器与计算机视觉运动分析能力整合，竞争态势进一步升温
              [CP002]。即便面对行业整合，Hinge Health 依旧握有绝对的商业领先优势：截至 2026 年 6 月 30 日，其企业与健康险客户总数达 2,929 家，同比增长 24%
              [CP004]；签约覆盖人群达 25M，累计服务会员超 1.5M 人 [CP003]。这种无可比拟的商业规模，为青睐成熟品类龙头的福利采购管理者筑起极高转换壁垒。
            claimRefs:
