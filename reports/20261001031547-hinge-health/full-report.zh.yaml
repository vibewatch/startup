      - number: '8.3'
        title: 估值倍数与情景分析
        blocks:
          - type: paragraph
            body: >-
              Hinge Health 当前估值深刻展现了一级市场狂热与二级市场现实之间的对比。公司虽在 2021 年 10 月 E 轮融资中达到 $6.2 billion 的一级市场估值顶峰，但其 2025 年 5
              月于纽交所 IPO 定价为每股 $32，对应初始公开市值约 $3.0 billion。此后隐含企业价值回升至 $3.8 billion 至 $4.3 billion，反映出上市后强劲业绩以及中枢上调至 $858
              million 的业绩指引。对应 2026E 营收 4.4x 至 5.0x 的远期企业价值倍数，相较于高成长数字医疗及垂直软件同类标的颇具竞争力，为乐观、基准与悲观营运情景下的均衡回报空间提供了支撑。
