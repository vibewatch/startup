            body: >-
              在核心生产技术架构中，移动端采用 React Native 做跨平台交付，前端基于 React 与 TypeScript 构建，后端服务依托 AWS 上的 Node.js（NestJS 框架）与 Ruby on
              Rails，通过 GraphQL 和 REST 接口通信。数据管理与缓存依托部署于 Docker 容器内的 PostgreSQL 与 Redis，并匹配基于主干的 CI/CD 自动化流水线。Hinge
              Health 已推动其护理平台向 AI 辅助工作流升级，集成 LangGraph.js 编排有状态的多节点临床智能体，执行上下文抽取、逻辑推理与自动化文书撰写。这些智能体工作流经由 AWS Bedrock 调用
              Claude Sonnet 等大语言模型，并利用 LangSmith 做全流程链路追踪、提示词版本管理与标准评测集（golden
              dataset）回归测试。专门的数据分析团队则维护着自动化流水线，负责摄取理赔数据，评估企业客户群体的控费成效并核验节费主张。
