        title: 平台防御壁垒、护城河韧性与多病种扩张
        blocks:
          - type: paragraph
            body: >-
              Hinge Health 的竞争壁垒依托于深厚的自研技术资产，如 Teladoc Health 或 Included Health 等通用型远程医疗平台难以在短期内仿制 [CP012]。公司落地了可精准追踪
              100 个身体解剖关键点的手机计算机视觉系统，配合生成式 AI 工具，在保持临床严密督导的前提下，替代了约 95% 的常规医护工时 [CP009]。联网硬件进一步加固了平台的防护栏，尤其是获 FDA 许可的
              Enso 可穿戴设备，利用专利电神经调节波形有效缓解急慢性疼痛 [CP010]。为应对供应商整合诉求与单点方案疲劳，Hinge Health 于 2026 年 8 月达成协议，以 $105M 全现金收购
              Cylinder Health，将临床服务边界拓宽至以虚拟为主的胃肠道专科护理
              [CP011]。然而，公司仍面临反向市场风险：多病种数字医疗聚合商的价格战，以及雇主寻求将各项服务打包按人头月费（PEPM）结算的诉求，可能在中期对其专门的 MSK 合同产生利润率挤压 [CP014]。
