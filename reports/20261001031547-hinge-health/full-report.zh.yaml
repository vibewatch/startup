  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与商业变现模式
        blocks:
          - type: paragraph
            body: >-
              Hinge Health 主要采用面向企业的 B2B2C
              商业模式，直接与自保雇主、商业健康险计划及公共部门福利信托签约，交付数字肌肉骨骼（MSK）治疗服务。公司的变现模式依托会员注册与数字化疗程的实际参与度，而非被动的员工人头月费（PEPM）准入费，将客户开票与可量化的临床使用紧密挂钩。2026
              年第二季度，Hinge Health 录得创纪录的 $212.8M 营业收入，较 2025 年第二季度的 $139.1M 同比增长
              53%。商业开票遵循三变量计算逻辑：合规覆盖人群基数、转化为活跃参与者的注册率，以及每名会员的平均实际客单价。除核心 MSK 项目外，公司还借由高标准线下临床网络 HingeSelect 以及宣布以 $105M
              现金收购 Cylinder Health，持续拓宽变现场景，构建横跨肌肉骨骼与消化健康的一体化多病种平台。
