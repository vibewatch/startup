  - id: FE001
    title: Hinge Health 端到端技术架构栈
    type: stack
    summary: 多层技术架构，串联会员应用端、内部临床医生工具、智能体 AI 服务及合规云端数据存储。
    data:
      layers:
        - label: 会员体验与设备层
          detail: React Native 移动端 App，融合 TrueMotion 计算机视觉追踪与 Enso 硬件集成能力
        - label: 临床工作流与 CareHub 平台层
          detail: CareHub 2.0 Web 门户，借助 GraphQL 与 TypeScript 提供统一的会员病历、护理方案及临床医生即时通讯功能
        - label: AI 编排与知识中枢层
          detail: 基于 LangGraph.js 有状态多节点 StateGraph，经由 AWS Bedrock 调用 Claude Sonnet 并配合 LangSmith 链路追踪
        - label: 数据存储与计算基础设施
          detail: 托管于 AWS 云基础设施上的容器化 Docker 微服务、PostgreSQL 关系型数据库与 Redis 缓存集群
        - label: 分析与客户效果评估层
          detail: ROI Pod 数据流水线接入健康险计划与雇主理赔数据，配合预测性入组分析模型以验证节费主张
        - label: 安全、隐私与合规治理管控
          detail: 满足 HIPAA、HITRUST 认证、SOC 2 Type II 及 CCPA 标准的医疗合规治理体系
    approximationNotes: null
    claimRefs:
      - CE001
      - CE003
      - CE006
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: 客户准入、采纳与扩张路径
    type: journey-map
    summary: 商业准入转化链路涵盖采购方与合作伙伴签约、合格人群覆盖、会员入组、护理参与、成效验证和交叉销售。
    data:
      items:
        - label: 签约立项
          detail: 雇主或健康险合作伙伴采购方案或开通准入权限。
          touchpoints:
            - 雇主福利团队
            - 健康险计划、PBM 或 TPA
        - label: 覆盖资格开通
          detail: 签约人群正式获得享受保障福利的资格。
          touchpoints:
            - 合作伙伴覆盖人群
            - 雇主在职员工
        - label: 会员入组
          detail: 定向宣教活动与福利团队共同推动员工报名入组。
          touchpoints:
            - 年度福利公开自选期
            - 临床定向触达
        - label: 参与护理
          detail: 会员使用 App、与护理团队沟通并体验各项互联服务。
          touchpoints:
            - 移动端 App
            - 临床医生与护理团队
        - label: 成效验证
          detail: 参与活跃度、会员康复成效与投资回报率（ROI）影响绩效保证兑现与后续续约。
          touchpoints:
            - 客户定期成效报告
            - 绩效保证条款
        - label: 业务扩张
          detail: 口碑推荐与引入附加病种管线进一步提升现有客户人均价值。
          touchpoints:
            - 会员转介推荐
            - 偏头痛与消化道（GI）管理方案
    approximationNotes: 仅为概念转化链路示意；并不代指客户数、合格人群、入组人数与收入指标之间存在固定的转化率或相同的人群基数。
