      - number: '1.4'
        title: 运营演进与战略里程碑
        blocks:
          - type: paragraph
            body: >
              Hinge Health
              的战略路径展现出清晰的演进脉络：从针对单一适应症的传感器硬件，逐步升级为覆盖多病种、以软件优先的护理自动化平台。早期版本需要将物理动作传感器绑在四肢上监测动作规范。考虑到硬件邮寄带来物流损耗并推高会员流失，工程团队自研了
              TrueMotion 计算机视觉技术，利用普通智能手机摄像头即可实时捕捉 100 个身体解剖关键点，并自动输出动作矫正反馈。这一转变大幅削减了服务交付成本，推动毛利率向 87%
              攀升，并打破了医护人力随业务线性扩张的瓶颈。


              随后的里程碑进一步将商业版图拓展至与 MSK 存在神经学或行为共病的相邻专科。2022 年，Hinge Health 推出女性盆底健康项目；2023 年上线经临床验证的防跌倒计划，数据显示老年群体跌倒发生率降低
              37%。2025 年，公司登陆纽交所，并推出聚合逾 5,000 家线下优质临床机构的 HingeSelect 网络。2026 年业务势头进一步加速：Migraine Care 偏头痛护理项目获 FDA
              批准并迅速商用（覆盖 450 家企业客户的 500 万保障人群），同时战略收购 Cylinder Health，正式切入年支出规模达 $135B 的胃肠道疾病护理市场。核心里程碑图谱见图表 FO001。
