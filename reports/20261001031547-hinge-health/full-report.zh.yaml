chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、运营规模与商业模式
        blocks:
          - type: paragraph
            body: >
              Hinge Health, Inc.（NYSE: HNGE）由 Daniel Perez 与 Gabriel Mecklenburg 于 2014
              年创立，总部位于加利福尼亚州旧金山，是一家企业级数字医疗公司。公司覆盖肌肉骨骼（MSK）疼痛与损伤的全病程周期，包括急性扭伤、慢性背痛与关节疾病、术前术后康复以及盆底健康等细分领域。Hinge Health
              公司不靠静态运动视频库，也不完全依赖耗费大量人力的线下门诊；它把专业临床团队、自研软件、计算机视觉运动分析和靶向可穿戴镇痛技术结合起来，让护理交付的关键环节大规模自动化。公司主要依托 B2B2C
              商业模式，面向自保雇主福利计划与大型商业健康险计划销售，以多年期订阅合同覆盖签约保障人群。


              截至 2026 年第二季度，Hinge Health 已具备可观的运营规模：单季 GAAP 收入达 $212.8M（同比增长 53%），企业雇主与健康险客户总数增至 2,929
              家。受高会员转化率与稳定客户留存驱动，过去 12 个月（LTM）计算开票额达到 $861.8M，同比增长 52%。经营杠杆持续释放，第二季度毛利率攀升至 87%，自由现金流大幅增至
              $99.6M。面对即将到来的年度企业福利选聘旺季，公司展现出强劲的商业势头，管理层将 2026 全年收入指引上调至 $856M 至 $860M 区间，以中点计算同比增长 46%。核心运营指标与尽调基准详见图表
              TO001。
