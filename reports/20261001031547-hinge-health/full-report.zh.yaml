      - number: '2.3'
        title: 企业渠道中的买方、使用者与支付方分层
        blocks:
          - type: paragraph
            body: >-
              数字 MSK
              平台的采购与使用由独特的“三方架构”主导，经济买方、终端患者与实际支付方彼此分离。核心经济买方通常是企业薪酬福利副总裁、首席人力资源官或福利总监，核心诉求是遏制不断失控的员工医疗福利支出。终端使用者则是饱受慢性背痛、膝盖痛、肩颈痛折磨的员工或其合规家属，他们通过手机
              App 体验计算机视觉运动治疗与 Enso
              可穿戴镇痛设备。在自保雇主模式下，实际支付方为企业雇员福利信托，经由商业健康险公司运作的纯管理服务（ASO）通道进行理赔支付。在商业分发渠道中，公司深度依托与全美前五大健康险计划及头部 PBM
              的合作，被纳入其标准数字健康准入目录。据公司称，这一渠道杠杆助力 Hinge Health 在 2026 年中将企业客户规模扩大至 2,929 家；与传统线下物理治疗相比，有据可查的人均医疗费用节省超过
              $2,000。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 推广驱动因素、结构性阻力与尽调盲区
        blocks:
          - type: paragraph
            body: >-
              宏观经济环境与临床需求共同构成强劲推力；自保雇主尤其迫切地借助按价值付费的数字化干预来压低医疗费用曲线。肌肉骨骼疼痛常年位列自保雇主医疗支出的前三名，促使企业极具动力采购经临床验证的远程康复方案，以减少高昂的脊柱融合术与关节置换术。然而，明显的结构性限制正在拖慢推广速度。企业福利负责人正日益遭遇“单点方案疲劳”：对接数十家单病种供应商意味着合同碎片化、数据割裂且员工参与度低迷。这种运营摩擦引发了强烈的供应商整合压力，使得综合性多病种平台相比纯单点工具更具竞争优势。与此同时，数字医疗平台还须应对美国各州不断调整的远程医疗执业许可、复杂的疗效挂钩风险分担协议，以及严格遵循
              HIPAA 数据隐私标准；国际商业报销模式总体仍未经验证。
            claimRefs:
              - CM014
              - CM015
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 多病种扩张重塑单点方案经济模型
            body: >-
              通过斥资 $105M 收购 Cylinder Health 并上线 Migraine Care 偏头痛项目，Hinge Health
              正在从单一专科的数字理疗工具升级为多病种临床平台。这种演进加深了与企业客户的绑定，推高了平均合同价值（ACV），并在供应商整合浪潮中为公司构筑了防御护城河。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM009
          - type: callout
            title: 雇主遭遇单点方案疲劳与合同整合压力
            body: 自保雇主正主动精简福利供应商组合，以消除冗余的系统对接与管理开销。若平台无法拿出经得起考验的多年期 ROI 证明，或缺乏跨专科的临床覆盖广度，在福利续约窗口期就会面临被淘汰的风险。
            calloutType: risk
            claimRefs:
