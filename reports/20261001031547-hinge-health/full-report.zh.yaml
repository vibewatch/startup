      - number: '8.2'
        title: 经营动能与业绩指引
        blocks:
          - type: paragraph
            body: >-
              2026 上半年经营业绩彰显出由临床 AI 分诊与护理自动化所带动的稳健经营杠杆。2026 年 Q2，Hinge Health 自由现金流同比增至三倍以上，同时非 GAAP 营业利润率提升至
              29%。为拓宽临床覆盖版图，公司于 2026 年 8 月签署最终协议，以 $105M 现金收购 Cylinder Health，将切入线上消化道健康领域的时间预计提前 18 至 24 个月。管理层预计
              Cylinder Health 将在 2026 年剩余时间内贡献 $7M 至 $8M 营收，全面商业化整合预计于 2027 年完成。依托 $475.6M 流动资金储备，Hinge Health
              具备充足的资产负债表空间以内生资金支持本次收购，同时上调了全年营收预期。
            claimRefs:
