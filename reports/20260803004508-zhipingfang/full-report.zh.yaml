          - type: callout
            title: Unitree UniStore 应用生态长期威胁 AI² 平台层
            body: >
              Unitree 推出 UniStore，并称其为全球首个人形机器人应用商店，说明公司不只想占硬件，也想掌控软件和应用分发层。如果第三方开发者为 Unitree
              生态构建应用，企业买方的转换成本就会从硬件转向软件；除非 AI² 建出可比开发者生态，否则会处于劣势。AI² 开源 FIS-VLA
              带来一定开发者信誉，但还不是已部署的应用平台。这一动态类似手机市场从硬件差异化转向平台锁定；它能否在人形机器人领域成真，取决于软件成熟度和企业部署规模，而截至 2026 年中，两者都尚未得到证明。
            calloutType: insight
