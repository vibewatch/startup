      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 中国第十五个五年规划与自动化密度空间，构成结构性有利市场
            body: >-
              中国第十五个五年规划（2026–2030）明确把机器人列为现代工业体系的核心驱动，并要求 AI 研究面向物理应用。再加上机器人密度仅为每 10,000 名制造业工人 166 台，而韩国为 1,220 台——存在
              7× 结构性差距——中国人形机器人市场的宏观顺风属于全球最强梯队。至少五家中国具身 AI 公司各自融资超过 USD 2.10 亿，市场也已出现首批披露的工业规模商业合同（AI² 的 HKC 订单；AgiBot 的
              Longcheer 部署）。技术能力进步快于企业销售周期，单次部署中的操作成功率已从 8% 加速到 60%。对 AI² 而言，其已披露客户垂直领域（汽车、半导体、制药）与最高 ROI
              的人形机器人部署用例一致，商业逻辑自洽。
