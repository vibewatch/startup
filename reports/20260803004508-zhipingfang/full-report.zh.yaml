          - type: callout
            title: 市场集中、ROI 不透明与标准缺口，是近期采用的实质约束
            body: >-
              三个约束会从结构上限制中国近期人形机器人采用。第一，市场集中：Unitree Robotics 和 AgiBot 预计在 2026 年合计拿下中国人形机器人约 80% 出货量，AI² 和其他所有供应商最多只能争夺
              20% 的市场；按当前估计 USD 4.0 亿的市场规模，AI² 在 2025–2026 年的收入天花板最多也只是数千万美元级。第二，ROI
              不透明：没有中国人形机器人供应商披露平均售价、生命周期成本结构或企业回本数据，大规模企业采购很难论证。第三，监管缺口：截至 2026 年 6
              月，中国尚无面向生产环境中全尺寸双足人形机器人的正式国家安全和认证标准，企业采购方承担责任暴露。CEO 郭彦东 2026 年 2 月的文章也承认「行业洗牌已经开始」，释放出 2026–2027
              年竞争整合将加速的信号。
