      - number: '1.3'
        title: 融资历史与投资方构成
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 2026 年 2 月 Series B 仍是最清晰的历史资本锚点：公司融资超过 RMB 10 亿元（约 USD 1.45 亿），估值跨过 RMB 100
              亿元门槛。但那一轮已不是当前估值。2026 年 6 月 29 日，多家独立媒体报道了新一组融资，合计接近 RMB 50 亿元，将智平方投后估值推高至 RMB 200 亿元以上（约 USD 28
              亿）；四个月内大约翻倍，并使其成为粤港澳大湾区首家达到该估值水平的具身 AI 公司。投资者基础也从 Baidu Venture、CRRC Capital、Cedarlake、Guotai
              Haitong、Yusys、Sentury Tire 以及一家 Tesla 供应链支持方，扩展到 National SME Development Fund、China Cultural Industry
              Fund、Guangdong AI Fund、Shenzhen Capital Group / Shenzhen Venture Capital、Nanshan War-New Investment
              等国家和区域资本，并加入更多产业和金融投资者。公司 2026 年 4 月完成股改，但管理层向记者表示暂无明确 IPO
              时间表可披露，并将股改定位为支撑规模化运营的治理升级，而非立即上市触发器。因此，公开证据支持公司具备极强融资通道和政策一致性，但仍无法看清当前股权结构、清算优先权或真实累计融资总额。
