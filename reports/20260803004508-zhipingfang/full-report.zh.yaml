            body: >-
              AI² Robotics 从创立到达到独角兽估值（>RMB 100 亿元）用了不到 3 年，是全球人形机器人赛道最快的路径之一。垂直一体化的硬件 + AI 模型栈、高知名度机构投资方（Baidu
              Venture、CRRC Capital），再加上公司所称中国最大非展示型商业机器人订单（HKC 1,000 台），让 AI² 在国内市场成为可信挑战者。开源 FIS-VLA 模型和 Yann LeCun
