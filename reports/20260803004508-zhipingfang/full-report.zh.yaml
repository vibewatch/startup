              CRRC Capital 作为中国人形机器人领域首个国有重工业投资方参投 Series B，其战略意义不止资本注入：它让 AI²
              能接触全球最大轨道交通装备制造商拥有的大规模制造测试环境，并在中国第十五个五年规划（2026–2030）明确把机器人列为国家核心产业优先事项之际，使公司与国家产业政策对齐。该投资关系提供了原本需要直接资本投入才能获得的测试基础设施，从而部分降低扩产所需资本开支风险。
