        title: 可比估值分析——私募与公开基准
        blocks:
          - type: paragraph
            body: >-
              理解 AI² 当前超过 USD 2.8 billion 的标记，需要两组镜头：一组是人形机器人和具身 AI 机器人公司的私募市场类比，另一组是成熟工业自动化与机器人公司的公开市场倍数。私募侧，Figure AI
              2024 年 2 月轮隐含估值约 USD 2.6 billion，Physical Intelligence 2024 年末 Series B 隐含估值约 USD 2.4 billion。AI²
              现在的标记高于这两个已披露历史估值，尽管它仍未披露任何收入。公开市场侧，工业自动化和机器人可比公司——ABB、Teradyne、Cognex、Symbotic 和 Rockwell
              Automation——大致按收入 2–6x 交易。AI² 没有披露收入，因此只能用 HKC 订单做代理来套用这些倍数。按估计 ASP 区间 RMB 200,000–500,000 计算，HKC 1,000
              台、三年合同隐含年化收入 RMB 67–167 million；以此对应，当前超过 USD 2.8 billion 的估值约为年化订单价值的
              120–300x。这是一家公开商业证据仍集中在一份合同和若干非约束合作上的公司的风险投资式定价。即便考虑中国政策顺风和 AI² 的战略投资者阵容，最新标记要求的未来收入爬坡也比 2 月独角兽估值陡得多。
