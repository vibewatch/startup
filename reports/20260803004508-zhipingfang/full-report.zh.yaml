  - id: FV001
    title: 建议逻辑链
    type: flow
    layout: standard
    summary: 决策流从最强证据支柱出发，经过已识别风险和估值溢价评估，落到最终 RESEARCH_MORE 建议。
    data:
      nodes:
        - id: n1
          label: HKC 1,000 台有约束力订单 + 战略投资方组合（Baidu、CRRC）
        - id: n2
          label: 零收入 / 利润率披露；单一有约束力客户；12 轮融资让股权结构复杂
        - id: n3
          label: 私募可比公司语境（当前估值 > $2.8B，对比已披露西方同业 $2.4–2.6B，以及 2 月中国同批公司约 $1.4–1.8B）
        - id: n4
          label: 订单金额倍数约 120–300x；需要订单簿快速扩张才能支撑
        - id: n5
          label: VLA 护城河未经审计；Physical Intelligence π0.7 与 AgiBot 构成可信技术可比威胁
        - id: n6
          label: 结论：昂贵——重大披露和客户转化里程碑完成前，维持 RESEARCH_MORE
    approximationNotes: 流程逻辑代表分析师推理链，不是正式决策树模型。
