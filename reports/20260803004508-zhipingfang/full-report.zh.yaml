      - number: '7.5'
        title: 要点证据
        blocks:
          - type: callout
            title: NVIDIA Orin 出口管制风险——对美国源芯片的存在性依赖
            body: >
              AlphaBot 2 的 GOVLA / Alpha Brain 模型运行在 NVIDIA Jetson AGX Orin 64GB 上，这是一款美国源先进集成电路，已受 BIS EAR 对 Country
              Group D:5（中国）的出口管制。BIS 于 2026 年 5 月发布的指引重申，向总部位于 D:5 的实体运输先进计算物项需要许可证，并仅把授权 IC 设计师时间线延长至 2026 年 12 月 31
              日——这释放的是持续收紧信号，而非问题解决。AI² 未披露国产算力替代方案（Huawei Ascend、CIXAI、Zhaoxin 或同等方案）。一旦管制升级切断 Orin
              供给，公司需要完整硬件重设计和模型重新验证，周期以数月到数年计。这是 AI² Robotics 投资论证中严重性最高、近期概率最高的风险，应成为向管理层提出的第一个尽调问题。
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
              - CR013
          - type: callout
            title: 反向信号——CEO 承认行业洗牌已经开始
            body: >
              CEO Guo Yandong 在 2026 年 2 月发表于 Sina Finance 的公开署名文章中写道：「展望2026年，行业洗牌已开始」（即“展望 2026
              年，行业洗牌已经开始”）。这句话来自公司创始人本人，直接承认竞争整合压力真实存在且正在加速。叠加 TrendForce 2026 年 4 月数据——Unitree 和 AgiBot 拿下约 80%
              的中国人形机器人出货量——AI² 身处市场少数阵营，却面对赢者通吃大部分的格局。洗牌承认是实质反向信号，AI² 收入预测应明确做概率调整折现。
