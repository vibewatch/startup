      - number: '5.2'
        title: GOVLA 架构与 Alpha Brain 软件栈
        blocks:
          - type: paragraph
            body: >-
              Alpha Brain 是 AI² Robotics 自研具身基础模型的产品品牌，底层模型架构名为 GOVLA（Global & Omni-body Vision-Language-Action）。GOVLA
              的核心新意不只是像早期 VLA 模型那样输出机械臂末端动作，而是直接输出全身运动学控制和移动轨迹。架构由三个耦合模块组成。第一，Spatial Interaction Foundation Model 把实时
              3D 物体位置、空间关系和环境动态编码成世界模型表征。第二，Slow System（System 2）负责复杂逻辑推理、多步任务拆解和自然语言对话输出；它接入 DeepSeek
              推理技术，拉长规划跨度。第三，Fast System（System 1）在控制环频率下把 Slow System 的计划翻译成连续全身关节轨迹和底盘运动指令，机器人无需等待推理周期结束就能实时反应。AI²
              Robotics 是中国 VLA 开发的早期推动者：GOVLA 0.0（2024 年 6 月）是初创公司首个开源 VLA，参数量只有 Google RT-2 系列的 1/20，性能却高出 80% 以上。GOVLA
              0.5（FiS-VLA，2025 年 6 月）也已开源，在权威基准上比 Physical Intelligence 的 π0 高 30%，并获得图灵奖得主 Yann LeCun 背书。GOVLA 1.0 截至
              2026 年中仍在开发，尚未发布。训练基础设施包括一个 1,000 GPU 算力集群。模型在 Orin AGX 64GB 模块上端侧运行，不依赖云端，在工厂环境中既保护数据隐私，也保证低于 100 ms
              的推理延迟。
