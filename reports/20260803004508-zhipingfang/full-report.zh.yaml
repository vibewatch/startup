              - CV049
      - number: '8.6'
        title: 要点证据
        blocks:
          - type: callout
            title: 结论：估值拉伸——维持继续研究立场
            body: >-
              AI² 2026 年 2 月 $1.4 billion 估值处于同业中位，但没有财务披露锚定。建议立场为 RESEARCH_MORE：没有数据室访问并解决五个尽调问题中至少三个（收入 / 毛利、HKC
              交付里程碑、股权结构、GOVLA 审计、客户管线）前，不应按当前条款投资。若估值压缩到 $1.0B 以下，或 Series C 定价时披露收入、能做常规倍数分析，再正向重访。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV034
              - CV041
          - type: callout
            title: 反向信号：VLA 训练数据稀缺与 Physical Intelligence 前沿威胁
            body: >-
              CB Insights 2026 年 6 月对 YC Winter 2026 批次的分析，把物理 AI 训练数据稀缺识别为人形机器人部署的首要系统性瓶颈。这不是 AI² 独有风险——它影响 Physical
              Intelligence、AgiBot 以及每一家基于 VLA 的竞争者——但它会直接削弱多头情景内含的时间表假设，也削弱 GOVLA
              作为护城河的持久性，因为这条护城河依赖在生产环境中积累自有具身数据，而规模化生产部署尚未确认。
            calloutType: risk
            claimRefs:
              - CV027
              - CV031
              - CV044
          - type: callout
            title: 关键假设：用 HKC 订单价值作为收入代理
            body: >-
              整个估值分析都把 HKC 1,000 台、三年采购订单作为 AI² 唯一收入代理。假设 ASP 区间（每台 RMB 200K–500K）是分析师基于同业定价数据估算，尚未由 AI² 或 HKC
              确认。ASP、交付节奏或收入确认方式若出现任何实质差异，都会直接改变上述所有倍数计算。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV008
              - CV050
