      - number: '1.4'
        title: 产品、技术与竞争位置
        blocks:
          - type: paragraph
            body: >
              AI² 的旗舰产品是 AlphaBot 2，这是一款 2025 年 4 月发布的全尺寸人形机器人，拥有 22 个自由度，身高 1,800 mm，重量 135 kg。机器人搭载 NVIDIA Jetson Orin
              AGX 模块，配备 64 GB 端侧内存，单次充电可运行 4–6 小时。核心 AI 差异化来自 GOVLA 模型（对外称 Alpha Brain），这是公司自研的视觉-语言-动作架构。2025 年 6 月，公司在
              GitHub 开源名为 FIS-VLA 的研究版本；Meta 首席 AI 科学家 Yann LeCun 公开背书该模型。AI² 内部基准称 GOVLA 的任务成功率比 Physical Intelligence
              的 π₀ 模型高 30% ——这是公司自报数据，截至本报告尚未被独立复现。公司 2025 年 9 月建成生产线，初始产能 1,000 台 / 年，并公开表示目标是在 2026 年底达到 10,000 台 /
              年。放在竞争格局中看，TrendForce（2026 年 4 月）估计 Unitree Robotics 和 AgiBot 合计掌握中国人形机器人市场约 80%，留给包括 AI² 在内的所有其他国内玩家只剩
              20%。AI² 将 HKC 三年 1,000 台商业订单作为牵引力证据，称其为中国最大非展示型商业人形机器人订单。其他具名客户包括 Dongfeng Liuzhou Motor（汽车工厂自动化）、Huaxin
              Bio（制药）和 JingNeng Microelectronics（半导体）。
