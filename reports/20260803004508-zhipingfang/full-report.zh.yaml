  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Includes five private humanoid/embodied-AI robotics comparables with disclosed funding rounds ≥USD 100M, and
        five public industrial automation/robotics companies with market cap ≥USD 5B, as of June 2026. Excludes
        early-stage pre-Series A companies and pure software AI companies.
    columns:
      - 公司
      - 类型
      - 最新披露估值 / 市值（USD）
      - 上轮融资 / 收入（USD）
      - 隐含倍数
      - AI² 可比性
      - 核心局限
    rows:
      - - AI² Robotics（标的）
        - 私营——中国人形机器人
        - '>$2.8B（2026 年 6 月最新报道估值）'
        - 6 月融资集群约 $700M + 此前 $145M B 轮 / 未披露收入
        - 不适用——没有收入基数
        - 直接标的；当前定价已高于 2026 年 2 月国内独角兽队列
        - 未披露收入、利润率或管线；最新估值由媒体报道的私募轮推算
      - - Figure AI
        - 私营——美国人形机器人
        - ~$2.6B（2024 年 2 月）
        - $675M 融资 / 未披露收入
        - AI² 当前估值的 1.9x
        - 同阶段西方同行；用于对标 AI² 与美国资本市场
        - 估值来自 2024 年 2 月；后续轮次未披露；无收入
      - - Physical Intelligence (π)
        - 私营——美国具身 AI
        - ~$2.4B（2024 年末估算）
        - $400M B 轮 / 未披露收入
        - AI² 当前估值的 1.7x
        - 直接 VLA 技术可比；π0.7 模型代表前沿
        - 专注操作任务，不是完整人形机器人；美国市场
      - - Apptronik
        - 私营——美国人形机器人
        - ~$1.2–1.5B 估算（2025）
        - $350M A 轮 / 未披露收入
        - ~1.0x AI² 当前估值
        - 阶段相近；商业部署聚焦制造业
        - 未披露估值；估算基于已披露融资规模和可比倍数
      - - 1X Technologies
        - 私营 — 挪威人形机器人
        - ~$500M–$1.0B 估算
        - 累计融资 $135M+ / 未披露收入
        - ~0.5–0.7x AI² 当前估值
        - 获 Bezos 支持；较低倍数反映地域差异和融资规模较小
        - 私营估值未披露；与中国市场可比性较弱
      - - AgiBot (未来机器人)
        - 私营 — 中国人形机器人
        - 未披露 / 估算 USD 1–2B
        - 多轮大额融资 / 未披露收入
        - ~0.7–1.4x AI² 当前估值
        - 最直接的中国可比公司；WorkGPT/GO-1/GE-1 技术栈；目标 2027 年收入 RMB 10B
        - 估值未获公开确认；市占率数据仅来自 TrendForce
      - - 'ABB Ltd (NYSE: ABB)'
        - 上市 — 全球自动化
        - ~$70B 市值
        - ~$32B 收入
        - ~2.2x 收入
        - 成熟自动化公司；为 AI² 长期倍数设定上限
        - 规模和成熟度不可比；收入基数是 AI² 隐含收入的 200x+
      - - 'Teradyne (Nasdaq: TER)'
        - 上市 — 自动化 / 测试
        - ~$9.5B 市值
        - ~$2.7B 收入
        - ~3.5x 收入
        - 聚焦工业自动化；在公开市场结构上最接近 AI² 的企业目标
        - 已盈利且业务多元；AI² 尚未产生收入
      - - 'Cognex (Nasdaq: CGNX)'
        - 上市 — 机器视觉
        - ~$5.5B 市值
        - ~$900M 收入
        - ~6.1x 收入
        - 工业场景专用 AI 的最近似参照；IP 护城河支撑溢价
        - 仅覆盖机器视觉；没有运动能力或 VLA 组件
      - - 'Symbotic (Nasdaq: SYM)'
        - 上市 — 仓储机器人 AI
        - ~$7B 市值
        - ~$2B 收入
        - ~3.5x 收入
        - AI 原生机器人已规模化；场景是仓储而非人形机器人
        - 收入来自仓储部署；终端市场不同
    notes: >-
      非 AI² 公司的私营估值为分析师估算，依据已披露融资规模和行业可比公司；公司本身并未确认。上市公司市值和收入为截至 2026 年中、 基于公开申报和 SEC EDGAR 数据的过去十二个月近似值。与 AI²
      的倍数比较，是把公开市场倍数套到 AI² 的 HKC 年化订单额 （RMB 100–167M）上，把它当作收入代理指标——这会显著夸大风险，因为订单额不是确认收入。
