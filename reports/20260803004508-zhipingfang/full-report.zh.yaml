  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与垂直行业策略
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 采用明确的企业优先、纯 B2B 商业化打法。CEO Guo Yandong 在 2026 年 2
              月的公开署名文章中明确表示，消费级人形机器人需求尚未成熟，至少五年内还不可行；因此，公司近期收入模型完全锚定工厂和商业服务合同。公司已公开识别六个垂直行业：半导体制造、汽车制造、生物技术 /
              制药、电子制造、公共服务和新零售。其中前五个已有具名客户证据。


              半导体制造由 Jingneng Microelectronics（晶能微电子）锚定，这家 Geely Technology Group 旗下芯片公司于 2025 年 3 月签署合作协议。汽车制造由
              Dongfeng Liuzhou Motor（东风柳州汽车）代表，它是 Dongfeng group 旗下品牌，2025 年 6 月签署战略合作，覆盖整车装配贴标、零部件装配和工厂物流。生物技术 / 制药由
              Huaxi Biotech（华熙生物）锚定；按透明质酸产量计，它是中国最大的生物技术公司之一，合作在 2025 年 4 月 AlphaBot 2
              发布会上宣布。应用场景包括无菌物料搬运、视觉检测和无菌室作业，确实击中污染控制痛点，适合机器人自动化。LCD / 显示制造垂直行业由 HKC 锚定；HKC 是全球第三大 LCD 面板制造商，已下达具约束力的三年
              1,000 台采购订单。公共服务由 ZhiMofang（智魔方）代表，后者在北京和深圳地点部署 AlphaBot 2 做行李推车回收和大堂服务。


              尽管公司材料中出现新零售垂直行业，但尚未公布具名零售客户。所有已确认客户的地域足迹都只在中国境内；截至本报告日期，公司未披露任何国际试点、出口或跨境分销。KR Asia
              分析记录，至少十家中国芯片初创公司瞄准汽车半导体供应链；随着国产芯片生产扩大，每一家都可能成为未来机器人客户。SP Global 分析还把半导体供应链本地化列为中国汽车工厂自动化投资的驱动因素，为 AI²
              的核心垂直行业提供需求侧顺风。
