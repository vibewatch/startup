      - number: '8.3'
        title: 投资正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              AI² 的多头叙事建立在四个相互锁定的命题上：HKC 订单证明全球最大工业机器人市场愿意为规模化部署付费；GOVLA / Alpha Brain 构成以具身智能数据为锚、持久且难复制的 AI 护城河；Baidu
              Venture 和 CRRC Capital 代表纯财务投资者拿不到的战略分销选项；中国「十五五」政策顺风叠加机器人市场预计到 2035 年达到 USD 416 billion（Precedence
              Research，Global X BOTZ ETF 引用），即便近期执行受挫，也提供结构性需求底线。空头论点逐一挑战这些命题。HKC 订单是公司唯一具约束力合同，其他具名客户都只是探索性
              MOU；交付里程碑、验收标准和付款计划未披露，执行不透明。Physical Intelligence 的 π0.7（2026 年 4 月）和 AgiBot 的 WorkGPT / GO-1 是可信的 VLA
              替代方案，CB Insights 对 YC Winter 2026 批次的分析把物理 AI 训练数据稀缺列为首要系统性瓶颈——这一挑战同样作用于 GOVLA 和整个行业。12
              轮融资节奏意味着清算优先权栈和摊薄结构可能造成早晚期投资者错位。GOVLA 基准主张没有独立审计，CEO 自己在 2026 年 2 月署名文章中说「行业洗牌已开始」，这对多头叙事构成内部反向信号。
