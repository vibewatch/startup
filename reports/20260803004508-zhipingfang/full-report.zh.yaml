      - number: '3.4'
        title: AI² 对比评估与护城河持久性
        blocks:
          - type: paragraph
            body: >
              AI² 的竞争位置建立在三条自称护城河上。第一，自研 GOVLA/Alpha Brain 视觉-语言-动作模型栈；公司内部基准称其任务成功率比 Physical Intelligence 的 π₀ 高
              30%，但这是未被独立复现的自报数字。第二，早期企业部署牵引力：HKC 订单（三年 1,000 台）被公司称为中国最大非展示型商业人形机器人订单，另有 Dongfeng Liuzhou Motor、Huaxin
              Bio、JingNeng Microelectronics 等具名客户。第三，全尺寸（1,800 mm、135 kg）形态，面向需要桌面高度操作和承载能力的工业环境设计。与这些护城河相对，AI²
              在多个维度暴露风险：已确认产能只有 1,000 台 / 年（目标 2026 年底 10,000 台），而 Unitree 的定价纪律意味着其制造规模大得多。AlphaBot 2 商业标价未公开，企业买方难以判断
              ROI。Unitree 的 UniStore 应用生态策略若成功，可能把 AI² 倚赖的差异化平台层商品化。AgiBot 平行投入 AI 栈（NVIDIA Thor T5000 上的
              WorkGPT/GO-1/GE-1、五大产品平台），并在 Longcheer Technology 和汽车零部件工厂推进制造试点，从侧翼压过 AI² 的单平台策略。AI² 在 GitHub 开源
              FIS-VLA，并获得 Yann LeCun 公开背书，确实带来开发者社区信誉和品牌认知，可能吸引人才和合作伙伴。中国人形机器人即将到来的 IPO 浪潮——Unitree 预计 IPO、Deep Robotics
              已递表——表明头部玩家正通过公开股权市场巩固市场位置，可能进一步拉大与 AI² 这类中腰部公司的融资和规模差距。总体看，AI² 的位置真实但脆弱：在一个新兴市场中最多争夺 20%，AI
              基准来自自报，价格未披露，CEO 也公开承认整合将至。
