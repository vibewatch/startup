  - id: FE001
    title: GOVLA / Alpha Brain 软件架构栈
    type: stack
    layout: standard
    summary: 分层展示 Alpha Brain 具身智能系统：从物理感知、基础模型推理，到 AlphaBot 2 上的全身控制输出。
    data:
      layers:
        - label: 传感器层
          detail: 4× RealSense D435 RGB-D（头部/胸部/背部）+ 2× D405 腕部摄像头；线性 MIC 阵列（4 通道）；交互显示屏
        - label: 空间交互基础模型
          detail: 基于多摄像头 RGBD 流理解 3D 场景；构建物体、距离和环境动态的内生世界模型
        - label: 慢系统——System 2
          detail: 长周期任务推理与拆解；自然语言指令解析；DeepSeek 增强规划；向用户输出任务计划和语言回复
        - label: 快系统——System 1
          detail: 实时生成全身关节轨迹；规划底盘运动；在控制循环频率下融合 System 2 计划与实时传感器反馈；输出完整 22-DOF 指令以及底盘速度 / 航向
        - label: AlphaBotCore SDK / 控制接口
          detail: Python / C / C++ API；Ethernet / RS485 / CAN 总线；拖拽示教 API；末端执行器航空插头（RS485_A/B、DIO、电源）；HDMI/USB 调试
        - label: NVIDIA Orin AGX 64GB 计算模块
          detail: 2048 核 Ampere GPU、12 核 ARM CPU、2× NVDLA v2、275 TOPS AI、64 GB LPDDR5 @ 204.8 GB/s；设备端本地推理；不需要云端
    approximationNotes: 架构拓扑由官方文档和媒体描述推断；层间通信协议为专有信息，公开资料未披露。
