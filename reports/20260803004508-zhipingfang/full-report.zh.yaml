    title: 投资 KPI 记分卡——IC 可用结论
    type: kpi
    layout: standard
    summary: IC 框架按七个投资维度以 1–5 分打分；总分 17/35，反映公司有真实市场机会和产品验证，但财务透明度与估值纪律不足，按当前条款还撑不起买入信念。
    data:
