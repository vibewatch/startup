      - number: '4.5'
        title: 图表
        blocks:
          - type: callout
            title: 资本密集与前收入规模风险
            body: >
              AI² Robotics 在低于商业化收入规模的阶段扩建生产基础设施（目标 10× 产能增长），且没有公开披露收入、毛利率或烧钱速度。按 Series B 完成后估算的 13–36
              个月现金跑道，2027–2028 年可能需要 Series C；届时竞争整合（Unitree + AgiBot 约 80% 份额）会加剧。高固定研发投入（千卡 GPU 集群）、高单台 BOM（由 NVIDIA
              Orin AGX 锚定）和未披露定价结构叠加，可能让公司持续烧钱冲向一个市场尚未在所需规模上验证的商业化门槛。
            calloutType: risk
            claimRefs:
