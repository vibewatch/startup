      - number: '5.6'
        title: 技术护城河与薄弱点
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 的主要护城河包括：（1）全栈 VLA 开发的时间领先——它是首家押注端到端 VLA 架构的中国初创公司，并在多数竞争对手拿出可比基准前开源了一个比西方同行高 30%
              的模型；（2）数据—业务飞轮——每次商业部署都会产出难以规模化复制的自有机器人示教数据，模型优势可随时间复利；（3）软硬一体系统——Alpha Brain 模型与 AlphaBot
              硬件共同设计，能做硬件感知的模型优化，纯软件竞争对手不易复刻；（4）北京大学联合实验室带来的机构研发入口，以及来自 Microsoft Research、OPPO 和 Xpeng
              的核心团队。实质薄弱点包括：GitHub 画像关闭（截至 2026 年中没有公开仓库），削弱第三方验证、社区信任和开发者采用，相比开放生态竞争者吃亏；轮式底盘限制地形适应性，相比全双足竞争者（Unitree
              H1/G1、AgiBot A2）可部署场景更窄；未公开确认 CE、ISO 10218 或同等安全认证，进入受监管环境存在障碍；GOVLA 依赖 NVIDIA Orin AGX 64GB
              算力，美国出口限制或供给约束会直接冲击生产。CEO 在 2026 年 2
              月的署名文章中坦率表示，行业「洗牌已开始」，消费市场进入「还不成熟也不现实——还需要五年」。这份自评可信，也等于隐含披露竞争风险：如果消费市场仍被锁住，AI² 必须与
              Unitree、AgiBot、UFACTORY 以及数十家中国人形机器人初创公司争夺同一批结构性有限的工业订单。
