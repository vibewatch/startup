      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >
              中国人形机器人市场的增长逻辑建立在政策强化的结构性宏观驱动和快速成熟的技术能力之上，但多个实质约束会压低近期采用速度，并给前二寡头之外的玩家带来风险。关键增长驱动：（1）政策指令——中国第十五个五年规划（2026–2030）把机器人置于现代工业体系核心，引导
              AI 研究走向物理应用，并将机器人定位为主要经济驱动，为政策对齐型买方降低采用摩擦。（2）自动化密度空间——中国机器人密度为每 10,000 名制造业工人 166 台，而韩国为 1,220、德国 449、日本
              446、美国 307；相较最佳实践自动化强度存在结构性 7× 差距，也留下了长期增量采用需求。（3）资本集中——至少五家中国具身 AI 公司各自融资超过 USD 2.10 亿；中国机器人投资约为欧洲同行
              5–6×，支撑研发和商业化吞吐。（4）技术栈成熟——AgiBot 的真实世界强化学习系统在复杂操作任务上将成功率从约 8% 拉升到 60%，缩小可靠性差距。（5）EV 制造顺风——中国 EV
              生产中的协作机器人采用已连续两年跑赢更广市场，让企业采购先进机器人流程常态化，人形机器人厂商可以借力。关键约束：（1）ROI
              不透明——没有公开平均售价或生命周期成本数据，企业买方无法独立建模回本周期。（2）市场集中——Unitree 和 AgiBot 预计拿下 2026 年中国人形机器人约 80%
              出货量，小玩家在收入和规模上处于结构性劣势。（3）可靠性下限——60% 任务成功率远低于工业规模无人监督生产部署所需的 99%+ 水平。（4）竞争升级——Tesla Optimus Gen 3 可能在 2026
              年 H2 量产，Boston Dynamics Atlas 商业部署也代表全球竞争压力。（5）标准缺口——截至 2026 年 6
              月，中国尚无针对生产环境中全尺寸双足人形机器人的正式国家安全认证标准，企业采购面临监管不确定性。（6）行业洗牌风险——CEO 郭彦东 2026 年 2 月承认「行业洗牌已经开始」。
