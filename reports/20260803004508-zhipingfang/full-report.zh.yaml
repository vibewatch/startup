companyProfile:
  summary: >-
    智平方科技（品牌为 AI² Robotics）是一家总部位于深圳的具身智能机器人公司，2023 年 4 月由 CEO 郭彦东博士创立。公司把自研视觉-语言-动作模型栈（Alpha Brain / GOVLA /
    NeuroVLA）、全栈人形机器人硬件和企业直接部署结合起来，切入工厂自动化和公共服务流程。公开证据支持其拿下 HKC 大额工厂订单，并在半导体、生物科技、零售和公共服务场景有更广部署；2026 年 6 月估值超过 RMB 200
    亿元。但收入、利润率、烧钱速度和完整股权结构仍未披露。
