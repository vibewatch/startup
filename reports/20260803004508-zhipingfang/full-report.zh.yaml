  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业化风险与客户集中
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 最直接的投资风险，是公司声称的商业牵引与可独立验证的具约束力承诺之间存在缺口。五个公开具名锚定客户中，只有 HKC（惠科股份）协议是具约束力的多年采购订单——三年内采购 1,000 台
              AlphaBot 2。Dongfeng Liuzhou Motor、Huaxi Biotech、Jingneng Microelectronics 和 ZhiMofang
              均被描述为「战略合作」MOU；采购量、价格和交付节奏未公开披露。因此客户集中度极高：HKC 可能代表 AI² 已确认订单积压的全部，而 AI² 启动时每年 1,000 台的自有产能正好匹配 HKC 承诺。如果
              HKC 推迟、取消或重新谈判订单，或者公司未来 12–18 个月内无法把其余三个 MOU 转成具约束力合同，收入将受到实质冲击。


              竞争整合会放大这项风险。TrendForce（2026 年 4 月）预计，Unitree Robotics 和 AgiBot 在 2026 年合计拿下约 80% 的中国人形机器人总出货量。AI² CEO Guo
              Yandong 在 2026 年 2 月发表于 Sina Finance 的署名文章中公开承认「行业洗牌已开始」——初创公司 CEO 罕见地承认竞争压力真实且尖锐。AgiBot 2026 年在 Longcheer
              Technology 现役产线上部署真实世界强化学习，说明至少一个直接竞争对手已经从试点走到生产部署；AI² 尚未公开验证同等规模的里程碑。CEO 自己分别给出的 2026 年底和 2028 年年产 10,000
              台、2033 年年产 1,000,000 台预测，带有当前证据基础无法支撑的执行风险。


              公司的商业化打法完全是中国大陆境内企业 B2B；截至本报告日期，没有披露国际试点、出口合作或跨境分销协议。这种地域集中把 AI²
              的收入轨迹绑定到中国国内工业自动化投资周期，而后者又受汽车、半导体和生物制造等下游需求影响。企业客户大规模采用人形机器人的 ROI 在全行业仍未被证明：AI²
              五个具名客户部署中，没有任何一个发布第三方审计、案例研究或生产率测量。因此，合作 MOU 转为具约束力合同、再转为收入，是投资者近期最需要盯紧的风险信号。
