      - number: '4.2'
        title: 资本结构、融资历史与投资方地图
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 2026 年 2 月 Series B 融资超过 RMB 10 亿元（约 USD 1.45 亿），投后估值超过 RMB 100 亿元（约 USD 14–15 亿）。该轮融资得到
              Yicai Global、CnTechPost、Crunchbase News 和 Robotics & Automation News 充分交叉佐证。公开证据并未止步于此：2026 年 6 月 29
              日，多家额外媒体报道新一组融资，合计接近 RMB 50 亿元，将估值推高至 RMB 200 亿元以上（约 USD 28 亿）。新一轮组合似乎纳入了更多国家级和深圳相关资本——National SME
              Development Fund、China Cultural Industry Fund、Guangdong AI Fund、Shenzhen Capital Group / Shenzhen Venture
              Capital、Nanshan War-New Investment——以及产业和金融投资者。把已确认的 2 月 Series B 与报道中的 6 月融资相加，公开披露融资底线超过 RMB 60 亿元（约 USD
              8.45 亿），尚未计入更早轮次。即便如此，由于公司未发布股权结构或资产负债表，确切累计融资总额、各轮金额和当前在手现金仍不透明。管理层还在 2026 年 4 月股改后表示暂无明确 IPO
              时间表可披露，因此投资者不能假设公司会很快上市并解决透明度缺口。实际结果很少见：智平方现在背负着更接近后期私营公司的超大轮融资 估值和资本基础，却几乎没有披露用于验证该估值的经营数据。
