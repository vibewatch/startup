  - id: TM001
    title: 市场定义与边界
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出 / 邻近项
      - 现状替代方案
      - 与 AI² Robotics 的关系
    rows:
      - - 企业级 AI 原生人形机器人（双足或轮式）
        - 机器人硬件单元；自研 AI / VLA 软件栈；系统集成；多年商业合同；维护和支持
        - 传统固定臂工业机器人；AGV；消费 / 娱乐机器人
        - 工厂人力；带工装夹具的固定臂机器人单元；外包制造
        - 核心目标细分；AI² AlphaBot 2（双足，22 DOF）在这里直接竞争
      - - 协作机器人（cobots）
        - 协作机器人以更低成本处理重复抓取放置；采购方越来越与人形机器人企业买家重叠
        - 从人形机器人 SAM 中排除；采购决策流程和用例不同
        - 在更简单、结构化任务上，协作机器人本身就是人形机器人的替代品
        - 邻近竞争压力；协作机器人普及让企业采购先进机器人更加常态化
      - - 工业 AI 软件平台和机器人编排
        - AI 推理、仿真、数字孪生和机队管理软件，与人形机器人硬件一起销售
        - 不搭配硬件销售的独立工业软件（ERP、MES 系统）
        - 传统工厂自动化软件；人工监督
        - 邻近使能层；AI² 将 Alpha Brain 模型与硬件捆绑，未来可能作为 SaaS 加售
      - - 具身智能通用移动操作平台（轮式）
        - Galaxea G0 Plus、X Square Robot 等轮式双臂平台；进入同一企业买家讨论
        - 仅限严格双足机器人；轮式平台服务重叠但不同细分场景
        - 单臂协作机器人；灵巧人工装配工
        - 仓内物流和简单装配中的直接形态竞争者；部署复杂度低于双足
      - - 服务和物流机器人（非操作类）
        - AMR 和 AGV，用于不含灵巧操作的运输
        - 排除在人形机器人 SAM 之外
        - 传送带；人工叉车司机；自动叉车
        - 不在 AI² 范围内；列入此处是为明确划边界
      - - 人力（现状基线）
        - 按中国工厂工资率计算的人力成本；灵活、灵巧，无前期资本开支
        - 不是机器人支出类别；作为参考基线纳入
        - 人力是所有机器人部署的主要替代品和 ROI 基线
        - 半导体洁净室、电子装配和汽车车身车间替代工人的经济性，决定 AI² 的企业销售周期长度和合同规模
    notes: >-
      不同分析机构的范围定义并不一致：MarketsandMarkets 的人形机器人市场数据很可能包括轮式移动操作臂，TrendForce 的产量数据覆盖所有 AI 使能双臂平台。IFR World Robotics
      数据只覆盖传统工业机器人，并未把人形机器人拆成独立类别。本边界把 AI² 的 SAM 定义为企业级、AI 原生子细分，而不是整个中国工业机器人市场。现状替代方案因工厂而异，并决定每个企业垂直的销售周期动态。
    claimRefs:
      - CM001
      - CM014
      - CM015
      - CM041
      - CM042
