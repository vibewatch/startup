    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 的完整法定名称为智平方（深圳）科技股份有限公司（统一社会信用代码 91440300MA5HTHDC7C），2023 年 4
              月成立，总部位于深圳南山区——中国高科技硬件创业公司最密集的聚集地。公司还在北京设有第二研发办公室。AI² 这个品牌名表达的核心假设是：人工智能叠加具身能力，能让机器人能力出现质变；公司将其营销为「AI ×
              Embodiment」。商业模式走垂直一体化路线：AI² 自研机器人硬件，自建视觉-语言-动作（VLA）AI
              模型栈，并通过多年商业合同把机器人直接卖给企业客户。目标市场包括工厂自动化（汽车、半导体、电子制造）、物流和医疗健康。与授权第三方 AI 模型的同行不同，AI² 称其自研 GOVLA/Alpha Brain
              模型层构成差异化。收入来自机器人硬件销售、AI 模型层潜在软件授权，以及多年期企业客户合同。2025 年 5 月，公司针对一家注册了近似 AI²
              品牌企业名称的武汉实体发布正式法律声明；该声明独立验证了完整法定名称、信用代码和注册地址，也是这家私营公司少数清晰的治理透明度窗口之一。
