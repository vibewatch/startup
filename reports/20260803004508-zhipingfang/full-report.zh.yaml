      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >
              中国企业人形机器人需求呈现清晰的三方结构。买方和付款方通常是大型工业企业中负责制造运营、供应链或资本开支规划的负责人，有权批准跨多年周期、数百万元级资本开支。用户则是工厂一线自动化团队——自动化工程师、机器人操作员和维护技师，他们把机器人接入产线单元并每天与其交互。付款方多数情况下与买方同属一家企业，因为
              AI² 的商业合同采用多年供货协议，而非服务化模式；HKC 三年 1,000 台合同和 Dongfeng Liuzhou Motor 试点可以印证。结合 AI² 已披露客户和行业走向，主要买方细分包括：汽车
              OEM 与 Tier-1 供应商（Dongfeng Liuzhou Motor）、显示与半导体制造（HKC、JingNeng Microelectronics）、制药与生物科技（Huaxin
              Bio），以及消费电子、新能源电池、物流等更广义先进制造。CRRC Capital 的投资也暗示其未来可能进入基础设施和维护密集型工业场景。企业买方采用的触发点主要由 ROI
              驱动：当一台人形机器人完成单位任务的全口径成本（资本 + 集成 + 维护 + 停机风险）在规模化后低于等效人工成本，采购才站得住。按 2025–2026 年通用人形机器人每台 USD 50–150K
              的当前基准价格，没有公开单位经济性披露，回本周期仍不清楚。CRRC Capital 参投和中国第十五个五年规划指引显示，国有企业和政策对齐型买方可能受引导采用国产人形机器人，从而形成一个不完全依赖纯 ROI
              分析的需求底部。
