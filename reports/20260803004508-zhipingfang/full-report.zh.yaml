        - 15%
        - HKC 在 2026 年 Q4 前完成全部交付；新增 3+ 份有约束力合同；到 2027 年 Q1 年化收入达 RMB 300M+；Unitree IPO 按 20x+ 收入定价
        - USD 3.5–5.0 billion
        - VLA 模型落后于 Physical Intelligence 或 AgiBot；政策反转；美国制裁 NVIDIA 计算组件
      - - 基准
        - 55%
