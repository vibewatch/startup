        - USD 1.0–1.8 billion
        - HKC 合同终止；竞争对手价格战把 ASP 压到 RMB 150K 以下；AI 模型诉讼或 CAC 合规失败
    notes: 概率信号是分析师基于公开证据和可比私募市场先例作出的判断，并非基于 AI² 内部预测。估值数字不是 DCF 估算，而是基于可比行业倍数推算的二级市场 / 下一轮预期估值。
