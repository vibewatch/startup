  - id: TV005
    title: 打破论点与止损触发条件
    columns:
      - 触发条件
      - 可观察阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - HKC 订单取消或数量大幅下调
        - 正式通知，或 1,000 台基数下调 ≥30%
        - 唯一有约束力的收入锚消失；牛市和基准情景失去依据
        - 立即退出或不投资；6 个月内很可能下轮降价
      - - Unitree Robotics 科创板 IPO 定价低于过去十二个月收入 10x
        - Unitree IPO 招股书披露上市时 P/S <10x
        - 形成公开盯市标尺，可将 AI² 的同业隐含估值压到约 $1.0–1.8B
        - 标记为重大估值风险；按 IPO 后板块倍数重估
      - - Physical Intelligence 或 AgiBot 实现可验证的 GOVLA 同等或更优能力
        - 独立基准公开显示，在 AI² 目标垂直领域任务成功率领先 ≥5%
        - 技术护城河叙事被打穿；AI² 只剩执行力投资
        - 任何新增资金投入前，先要求独立 GOVLA 审计
      - - 网信办生成式 AI 合规失败或执法行动
        - 网信办正式检查、服务暂停，或针对 AI² GOVLA 嵌入层发出执法通知
        - 监管风险落地；完成整改前部署停摆；可能触发客户取消订单
        - 立即尽调合规备案状态；跟踪网信办登记更新
      - - 到 2026 年 Q4 仍无新增有约束力客户
        - 到 2026 年 12 月 31 日，仍没有净新增企业客户公开宣布有约束力采购订单
        - HKC 被确认是一次性个案，而不是可复制的企业销售动作；投资论点降为单一客户赌注
        - 不投资；若已有仓位，以下轮定价设严格止损
    notes: 触发阈值由分析师定义；AI² 未披露任何内部指引。行动含义仅用于说明尽调判断。
