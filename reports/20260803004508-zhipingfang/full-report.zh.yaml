      - number: '4.3'
        title: 成本结构、单位经济性与生产资本开支
        blocks:
          - type: paragraph
            body: >
              AlphaBot 2 的 BOM 由 NVIDIA Jetson AGX Orin 64GB 计算模块、三颗 Intel RealSense D435 RGB-D 相机、两颗 D405 近距相机、2D
              LiDAR、22-DOF 精密执行器系统（膝关节峰值扭矩 436 Nm、腰部俯仰 207 Nm）、48V/30Ah 电池包和双轮差速底盘构成。参考嵌入式 AI 模块和精密执行器的商业组件价格基准，单台总 BOM
              估计为 RMB 100,000–200,000（约 USD 14,000–28,000）——如果企业定价不足以覆盖直接材料和装配，毛利率将面临压缩风险。AI² 称核心部件 MTBF 达到 50,000
              小时；这种可靠性工程投入本身也抬高了部件质量门槛和成本。研发成本方面，公司运营一个用于 GOVLA 模型训练的「千卡 GPU
              计算集群」——这是一项显著的持续基础设施成本；在装机基数较小时，会推高单台摊销研发费用。公司还在 GOVLA VLA 模型构建中使用 DeepSeek 技术，说明存在外部模型依赖，可能带来授权或计算开销。产能从
              1,000 台 / 年扩到 10,000 台 / 年，意味着工厂工装、质量控制自动化和精密部件供应链锁定需要大量资本开支。AgiBot 在 2026 年初约三个月内从 1,000 台扩到 5,000 台再到
              10,000 台，展示了快速人形机器人扩产在运营上是什么样，尽管其生产模式可能不同。Unitree 科创板 IPO 招股书（TrendForce 2026 年 4 月引用）披露 2025
              年人形和四足机器人综合毛利率为 60%，说明在足够规模下硬件毛利可以健康；但 Unitree 更低成本的 G1（$13,500）有利于拉高混合毛利，AI² 更高规格的产品组合无法直接比较。CEO
              明确提醒，未来至少五年消费机器人市场都不可行，把收入预期牢牢锚定在企业端；企业端合同价值更大，但周期也更长。
