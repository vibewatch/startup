      - - 估值立场
        - 偏贵
        - 当前估值约为以 HKC 订单推算年化收入的 120–300 倍，且公司未披露财务数据
        - 收入可见性、多客户转化，或结构化下行保护
      - - 持有期
        - 24–36 个月，等待 C 轮信号
        - 预期 C 轮时点基于 2026 年产能爬坡计划
        - HKC 交付更快或新客户转化会加速时间线
      - - 优选入场
        - 低于 USD 1.8B（或带估值调整机制的结构化票据）
        - 当前 >$2.8B 估值给公开证据风险留下的边际不足
        - 数据室访问或估值显著压缩
    notes: 评估仅基于公开来源证据；未访问数据室。本建议不构成投资建议。
