      - number: '4.4'
        title: 财务证据缺口与承保阻碍
        blocks:
          - type: paragraph
            body: >
              本章呈现的是一幅结构性不完整的财务图景。AI² Robotics 是中国私营公司，没有发布财务报表的法定义务；除 Series B
              交易条款外，公司也未主动披露任何量化财务信息。传统创业公司承保所需的每一项指标——收入（当前或过去十二个月）、毛利率、EBITDA、现金余额、烧钱速度和现金跑道——都不在公开记录中。投资者因此只能把资本充足性分析建立在如下估计上：（a）假设月烧钱
              RMB 3,000万–8,000万元（USD 400万–1,100万美元），USD 1.45 亿 Series B 意味着自 2026 年 2 月起现金跑道为 13–36 个月，指向 2027–2028 年潜在
              Series C 窗口；（b）HKC 订单提供了有订单背书的收入代理，但单台合同价格和总合同金额均未披露；（c）Series B
              之前轮次金额未披露，累计融资总额无法验证。商业牵引力信号（四家具名企业客户、机场试点、模块化空间部署）说明公司有活跃部署，但没有价格数据就无法转化为收入。Unitree 和 AgiBot 合计约 80%
              市场份额使市场风险更尖锐，近期可供 AI² 争取的订单池受限；CEO 2026 年 2
              月承认「行业洗牌已经开始」，也说明在下一轮融资前建立商业规模的窗口正在收窄。尽调路径很直接，但必须直接推进：经审计财务、管理层编制收入模型、带定价的已签商业合同，以及 CFO 确认的烧钱 / 现金跑道说明。
