      - number: '5.4'
        title: 遥操作、训练数据与学习管线
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 提供两类遥操作设备，用来采集示教数据并支持远程操作。VR Teleoperation 系统靠末端执行器逆运动学驱动机器人——操作员佩戴 VR
              头显，用手持控制器指定手部位姿，机器人再由逆运动学求解器寻找关节解。这套方案便携、部署快、成本更低，但运动学奇异点会带来求解不稳定，长时间操作也容易造成眼疲劳。适用场景偏向示教、展演和简单移动任务。Exoskeleton
              Teleoperation 系统使用一条与 AlphaBot
              机械臂结构相同的可穿戴机器人手臂（关节空间驱动），直接映射操作员关节角。它精度高、力反馈自然，也不会出现无解动作失败，但代价是硬件重量大、调试复杂、成本高。更适合固定场地的高精度数据采集、PCB
              上料和安全关键环境。数据—业务双闭环是 AI² Robotics 迭代策略的底座：每一次商业部署都会产生真实世界示教片段，再通过自研增量训练管线在 1,000 GPU 集群上持续微调
              GOVLA，反过来提升同一场景和相邻场景的模型表现。机械臂也可以按下绿色拖拽示教按钮做动觉示教，不需要遥操作配置就能快速现场编程技能。这套循环类似搜索引擎规模互联网公司的数据飞轮；AI² Robotics
              明确称其数据基础设施受此启发。
            claimRefs:
              - CE021
              - CE024
              - CE025
              - CE026
              - CE040
              - CE041
      - number: '5.5'
        title: 制造栈与现场部署成熟度
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 于 2025 年 9 月启用自有产线，额定年产能 1,000 台。公司目标是在 2026 年底前扩到每年 10,000 台，也就是 12 个月内扩张 10 倍。2025 年 4
              月较早的公开表述曾把 10K / 年目标放在 2028 年，说明 Series B 融资后节奏有所提前。公司把制造愿景描述为打造一家「机器人 OEM」，类似电动车领域的
              BYD——把硬件设计、制造和交付集成抓在自己手里。截至 2026 年中，商业部署覆盖四个工业垂直行业：汽车制造装配线、半导体晶圆厂（Geely Technology 旗下 JingBo
              Micro）、生物技术洁净室（HuaXi Biotech）和公共服务场所（中国一线城市机场行李推车管理）。锚定合同是与 HKC（华科，全球第三大显示面板厂商）签署的 1,000
              台、三年框架协议；管理层称其为中国规模最大的非展示型商业人形机器人订单。北京大学—AI² Robotics 具身 AI 联合实验室于 2025 年 4
              月成立，为公司提供研究管线和人才入口。部署成熟度在结构化工业环境中最强：机器人 0–5° 的坡度约束和轮式底盘排除了非结构化楼梯或户外用途，当前商业 SLA 和质保结构也未公开披露。
