      - number: '7.2'
        title: 技术、供应链与具身模型风险
        blocks:
          - type: paragraph
            body: >
              AlphaBot 2 的计算骨干是 NVIDIA Jetson AGX Orin 64GB，这是一款由美国 NVIDIA 制造、算力 275 TOPS 的系统级模块。NVIDIA 的 Jetson AGX
              Orin 被归类为先进计算物项，向 Country Group D:5 实体出口时受 BIS Export Administration Regulations（EAR）管制；中国属于 D:5。Bureau of
              Industry and Security 已发布指引，重申向总部位于 D:5 国家或拥有 D:5 母公司的实体运输先进计算物项需要许可证，并把授权 IC 设计师项目时间线延长至 2026 年 12 月 31
              日——这说明监管仍在收紧，而不是问题已经解决。如果 BIS 进一步收紧管制、限制 NVIDIA 向中国终端用户供应 Orin 模块，或 NVIDIA 在美国政府压力下自我限制供给，AI²
              将面临关键依赖失效，公开记录中没有确认的国产替代计算平台。规模化替换 Orin 需要硬件重设计、模型重新验证，并可能重新谈判客户合同，周期以数月到数年计，且很可能显著压缩毛利。考虑到 GOVLA / Alpha
              Brain 模型与 NVIDIA 嵌入式平台的集成深度，作者把这归类为短期存在性供应链风险。


              芯片层之外，AlphaBot 2 的 22+
              自由度执行器和关节模块供应链没有公开记录。机器人硬件架构文档列出严格运行要求——不能有严重粉尘、爆炸性或有害气体、强电磁干扰——这些条件限制可部署环境；若设备被部署到不合规环境，可能引发质保和责任索赔。电池热管理是中国机器人公司普遍存在的风险向量；硬件文档写明
              -20°C 至 65°C 的工作温度限制，以及具体湿度和气压范围，但没有引用热失控缓解方案或电池认证标准。


              GOVLA / Alpha Brain VLA 模型还带来区别于硬件的模型层技术风险。学术研究（RT-2、OpenVLA）一贯显示，VLA
              模型在训练分布内任务上泛化良好，但遇到训练分布之外的新物体、光照变化或表面纹理时，表现会明显退化。公司宣称核心硬件组件「50,000 小时 MTBF」，尚未经过任何独立安全评估验证。AgiBot
              在生产中部署真实世界强化学习，展示了一条可更快适应工厂地面变化的竞争训练范式，对 AI² 较慢的批量模仿学习管线构成技术风险。支撑 GOVLA 的数据飞轮需要持续的部署规模数据采集；如果 MOU
              客户无法转为生产部署，相比部署台数更多的竞争对手，模型改进循环会停滞。
