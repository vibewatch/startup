  - id: TV002
    title: 投资论点 vs. 反论点
    columns:
      - 投资论点
      - 强度
      - 反论点
      - 解决条件
    rows:
      - - HKC 1,000 台订单是中国最大有约束力人形机器人商业合同
        - 强——有约束力、多年期
        - 唯一有约束力合同；HKC 交付里程碑、ASP 和验收条款未披露
        - 确认 HKC 2026 年 Q3 交付里程碑
      - - Baidu Venture 领投 + CRRC Capital 显示战略渠道深度
        - 中等——高质量投资团
        - 战略投资人可能比财务投资人享有优先权和信息优势
        - 披露股权结构和优先权层级
      - - GOVLA / Alpha Brain 是差异化 VLA 模型，背后有专有数据集
        - 中等——公司自称，未验证
        - Physical Intelligence π0.7 和 AgiBot WorkGPT 分别代表西方和中国的 VLA 替代方案；GOVLA 基准由公司自报
        - 独立第三方基准审计
      - - 中国十五五规划要求机器人产业规模化落地
        - 强——政策支撑的需求
        - 政策能托起市场，但不会把份额分给 AI²；Unitree 和 AgiBot 同样能获得政策红利
        - 政策指引明确将 AI² 列为优先供应商
      - - 全球机器人市场从 $108B 增至 2035 年 $416B，构成结构性顺风
        - 强——宏观背景
        - 人形机器人只是整体机器人市场的一小部分；结构性顺风会同等利好 20+ 家已融资竞争对手
        - AI² 证明 SAM 捕获能力高于行业平均
      - - CRRC Capital 入场，标志着中国人形机器人领域首个国企重工系 VC 下注
        - 中等——意味着铁路和基础设施部署路径
        - 铁路 / 基础设施场景部署仍属推测；尚未宣布与 CRRC 的 MOU 或试点
        - CRRC 试点公告或部署 MOU
      - - 12 个月 12 轮融资显示投资人需求持续
        - 弱——也可能只是快速稀释周期
        - 异常融资节奏更像高烧钱或结构化资金提款，而非自然里程碑推进
        - 披露每轮规模和资金用途
    notes: 投资论点强度仅基于可公开验证的证据。反论点假设没有可用的非公开数据。
