      - number: '3.2'
        title: 西方基准同行
        blocks:
          - type: paragraph
            body: >
              西方人形机器人公司定义了全球技术和商业化参照系，但受出口管制、本地化要求和供应链分离影响，目前并不直接在中国企业市场与 AI² Robotics 竞争。Figure AI 的 Figure 03 凭 Helix
              AI 系统转向消费家庭市场，用例画像不同于 AI² 的 B2B 工业聚焦。Agility Robotics 是商业化最成熟的西方人形机器人公司：其 Digit 平台被公司描述为首个进入生产部署的人形机器人，通过
              Arc 云平台运行，并作为 Amazon 供应链伙伴部署在物流场景；Agility 在 Oregon 州 Salem 制造，约 80% 零部件来自美国，强调供应链韧性。Apptronik 的 Apollo（172
              cm、72 kg、55 lbs/25 kg 载荷、单电池包 4 小时续航）由打造 NASA Valkyrie 机器人的团队开发，采用 Robot-as-a-Service
              商业模式，面向仓储和制造客户。Boston Dynamics 的 Atlas 是全球技术最先进的商业人形机器人——1.9 m、90 kg、56 DOF、IP67 等级，可在 −20°C 至 40°C
              工作，关节连续运动范围大，瞬时载荷 50 kg，并通过 Orbit 平台接入企业级机群管理。1X Technologies（Norway/US）聚焦家庭机器人。这些西方公司目前都没有在中国国内企业买方群体中对
              AI² 构成直接采购威胁，但它们设定了成熟中国企业买家和全球投资者用来对标的能力上限，其 RaaS / 机群管理模式也提供了国内玩家正在观察的商业化模板。
