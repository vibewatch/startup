        title: 估值背景与轮次结构
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 于 2026 年 2 月完成 Series B，在一组分批融资中募资超过 RMB 1 billion（约 USD 145 million），并把投后估值推高到 RMB 10
              billion 以上。那一轮现在只是估值底线，不是当前标记。2026 年 6 月 29 日，多家媒体报道了总额接近 RMB 5 billion 的新融资集群，把估值推高到 RMB 20 billion 以上（约
              USD 2.8 billion），四个月内大致翻倍。据报道，扩大的投资者名单现在包括 2 月轮的 Baidu Venture、CRRC Capital、Guotai
              Haitong、Yusys、Cedarlake、Sentury Tire 和一家 Tesla 供应链企业，也包括 6 月融资集群中的国家和区域资本，如 National SME Development
              Fund、China Cultural Industry Fund、Guangdong AI Fund、Shenzhen Capital Group / Shenzhen Venture Capital 以及
              Nanshan War-New Investment。合并 2 月和 6 月融资，公开披露融资下限超过 RMB 6 billion（约 USD 845
              million），但真实累计融资额、股权结构和清算优先权栈仍不透明。管理层还在 2026 年 4 月股改后表示，没有明确 IPO 时间表可披露，因此公开上市选择权还不能被写入近期退出或披露催化剂。
