        title: 情景分析与概率加权估值区间
        blocks:
          - type: paragraph
            body: >-
              三个情景框定 AI² 在未来 18–36 个月、走向下一轮融资或二级流动性事件时的可能估值轨迹。乐观情景（15% 概率）假设 HKC 按计划交付，至少三个新的企业客户在 2026 年底前发出具约束力采购订单，且
              AI² 到 2027 年初实现 RMB 300 million 以上年化收入，从而支撑下一轮 USD 3.5–5.0 billion 的估值标记。基准情景（55%）假设 HKC
              大体按计划推进但有一项或多项分批延迟，两个 MOU 转为具约束力订单，2027 年中总年化收入达到 RMB 100–200 million，估值区间持平到下行，为 USD 2.0–2.8
              billion。悲观情景（30%）包括 HKC 交付出现重大争议或减量、没有新增具约束力客户，以及随着 Unitree 最终公开市场定价和低于预期的行业经济性重置中国人形机器人私募倍数，公司以 USD
              1.0–1.8 billion 区间折价融资。因此，概率加权预期估值约为 USD 2.4 billion，低于当前报道的 >USD 2.8 billion 入场价，且下行空间明显大于上行空间。
