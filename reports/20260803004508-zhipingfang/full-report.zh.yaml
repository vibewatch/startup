      - number: '6.3'
        title: 市场位置、竞争压力与反向信号
        blocks:
          - type: paragraph
            body: >
              TrendForce 2026 年 4 月数据显示，Unitree Robotics 和 AgiBot 合计约占中国人形机器人产出市场 80%，AI² Robotics
              与规模更小的同行一起落在竞争激烈的少数阵营。CEO Guo Yandong 在 2026 年 2 月署名文章中承认「行业洗牌已开始」，坦率说明公司层面已经感受到竞争压力。TheRobotReport 的 2026
              年中国机器人展望明确把「显著竞争压力」列为全年主线。


              IFR 报告称，中国 2024 年安装了 295,000 台工业机器人，占全球市场
              54%；这说明底层工厂自动化市场庞大，也在结构上接受下一代人形机器人部署。但这股宏观顺风同样惠及所有机器人竞争者。Crunchbase 数据显示，仅 2026 年 3 月就有 6
              家新的中国机器人独角兽出现，反映资金充裕的竞争者和投资人胃口一起涌入，既验证赛道，也挤满赛道。


              HKC 客户集中是当前客户画像中最大的单一收入风险。如果 1,000 台 HKC 订单构成 AI²
              已确认早期收入的大部分，那么任何交付失败、验收争议或客户流失都会造成重大影响。五个具名账户中有三个只是没有承诺台数的合作 MOU，意味着 HKC 之外的收入基础尚未确认。MOU
              转采购订单的转化率，是后续最关键的观察指标。
