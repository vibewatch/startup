      - number: '2.2'
        title: 市场规模——多重视角与矛盾
        blocks:
          - type: paragraph
            body: >
              中国人形机器人子市场没有单一权威规模口径；公开估计采用的范围定义、方法和地理切分并不一致，不能直接横向比较。四个规模视角揭示不同侧面。（1）出货量视角：TrendForce（2026 年 4
              月）预计中国人形机器人产量 2026 年同比激增 94%，Unitree 和 AgiBot 合计拿下约 80% 总出货量——意味着其余所有玩家最多争夺 20%
              的产量。（2）收入预测视角：MarketsandMarkets 估算中国人形机器人市场 2025 年为 USD 4.0 亿，到 2030 年增长至 USD 28.0 亿，CAGR 47.6%。其全球市场估计从
              2025 年 USD 29.2 亿增至 2030 年 USD 152.6 亿，CAGR 39.2%；按该来源定义，中国约占 2025 年全球人形机器人收入的 14%。（3）整体工业机器人背景：IFR 报告称中国
              2024 年安装 295,000 台工业机器人，占全球市场 54%——该数字由传统机械臂主导，未单独拆分人形机器人。若人形机器人占装机基础不到 1%，则 2025 年 USD 4.0 亿收入对应数千台、每台
              USD 50–150K 的平均售价；这个区间与可得竞品价格信号一致。（4）投资信号视角：至少五家中国具身 AI 公司累计融资均超过 USD 2.10 亿，其中 X Square Robot 两年内独自超过 USD
              4.00 亿——说明 VC 预期三到五年内市场会大得多，但也提示相对当前单位经济性的过度融资。矛盾很多：TrendForce 的产量指标可能计入所有 AI
              驱动的轮式和双足机器人；MarketsandMarkets 可能使用更窄定义；IFR 完全不拆分人形机器人。AI² Robotics 的 SAM 和 SOM 都无法从公开数据中可靠分离，任何单点 TAM
              估计都只能视为方向性参考，而非严谨精确值。
