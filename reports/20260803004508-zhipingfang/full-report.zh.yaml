  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 尽调路径
    rows:
      - - 收入与毛利率披露
        - AlphaBot 2 商业化规模下的任何收入、ARR、毛利率或 COGS 数据
        - 没有财务基线，就无法验证估值倍数或可持续性；全部可比公司分析都依赖代理收入
        - 申请数据室访问；对照 Unitree 科创板 IPO 招股书披露的 60% 毛利率
      - - HKC 交付排期与里程碑
        - 1,000 台合同的 2026 年 Q3 交付里程碑、验收标准、付款排期和单台定价
        - HKC 订单是唯一估值锚；交付失败或争议会打垮基准情景
        - 直接向 HKC 采购做客户访谈；要求数据室提供合同摘要
      - - 股权结构表与优先权堆栈
        - 全量股权结构表、清算优先权、反稀释条款，以及全部 12 轮投资人的 pro-rata 权利
        - 12 轮融资节奏叠加 2026 年 6 月重估，带来标题估值看不见的优先权悬挂风险
        - 向公司索取股权结构表；建模包括 6 月融资集群在内的瀑布分配情景
      - - GOVLA / Alpha Brain 独立基准
        - 第三方评估四个目标垂直领域（半导体、汽车、制药、物流）的任务成功率、泛化能力和安全性
        - 公司自报的 GOVLA 基准是主要技术差异点；目前没有独立验证
        - 委托独立技术评估；在同等任务集上与 PI π0.7 和 AgiBot WorkGPT 对比
      - - 客户管线与转化时间线
        - 非 HKC 潜在客户的合格管线总量（处于活跃 POC 或 MOU 的公司）、预期转化时间线和平均合同额
        - 收入模型依赖 4 个现有 MOU 转化并新增客户；管线质量未知
        - CEO 管线简报；要求 CRM 数据，或至少提供带阶段的具名管线公司
      - - 网信办生成式 AI 合规状态
        - GOVLA 嵌入式语言指令层的任何网信办登记或安全评估申报副本
        - 《生成式人工智能服务管理暂行办法》（2023）适用于商业部署；不合规是重大运营风险
        - 法务审查 AI 监管申报；直接询问 AI² 法务 / 合规团队
    notes: 尽调问题仅基于公开可见缺口。数据室审阅后，很可能还会出现更多事项。
