      - number: '7.3'
        title: 监管、政策、安全与责任风险
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 尚未公开披露 AlphaBot 2 的任何产品安全认证。公司官方文档或新闻稿截至本报告日期未引用中国 GB/T 机器人安全标准备案、ISO 10218（工业机器人安全）、CE
              标志或同等国际认可安全评估。以 AI² 所处阶段看，这不一定构成否决项——中国的人形机器人专项安全标准仍在 MIIT 2023 年《人形机器人创新发展指导意见》下起草——但它留下潜在责任缺口：任何由
              AlphaBot 2 造成的工厂工人身体伤害，都可能让公司面临产品责任索赔、监管调查和声誉损害；在缺乏认证安全框架的情况下，损害程度可能与事故严重性不成比例。


              数据治理形成并行监管风险。AlphaBot 2 依靠实时视觉和环境感知运行；GOVLA 模型会摄取工厂地面视频、空间数据，并可能采集人类工人的生物特征接近数据。中国《个人信息保护法》（PIPL，2021 年 11
              月生效）监管个人信息的收集、处理和跨境传输。如果 AlphaBot 2
              的数据采集管线捕捉工人生物特征、人脸识别或行为数据——考虑到机器人的全身视觉栈，这一情况合理可能发生——合规需要有记录的同意框架、数据影响评估，并可能需要个人信息保护负责人。公司官方文档没有回应这些义务。中国《生成式人工智能服务管理暂行办法》（2023）还监管嵌入式
              LLM 的训练数据和输出安全，适用于 GOVLA 模型的语言指令层。若不能维持合规的生成式 AI 服务备案，AI² 可能遭到中国国家互联网信息办公室（CAC）监管行动。


              出口管制和军民两用风险双向存在。AI² 上游面临美国 BIS 管制造成的芯片供应风险（见第 2 节）；同时，如果机器人被归类为军民两用物项，公司向中国以外司法辖区出口 AlphaBot 2 或 GOVLA
              模型权重，可能受中国《出口管制法》（2020）约束，也会因 NVIDIA Orin 含量受到美国再出口管制。两条出口通道在 2026
              年仍存在法律模糊性，若不做法律架构设计，国际扩张可能被合规陷阱冻结。政府政策支持——MIIT 把人形机器人列为战略性新兴产业、CRRC
              共同投资、深圳地方补贴——当前有利，但也自带风险：政策优先级会变化，补贴会被撤回，国资背景投资者（CRRC、Guotai Haitong）可能带来治理影响，使未来国际融资或 M&A 交易更复杂。
