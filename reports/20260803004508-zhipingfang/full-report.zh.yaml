      - number: '5.3'
        title: 硬件平台与组件规格
        blocks:
          - type: paragraph
            body: >-
              AlphaBot 2 的机械设计围绕三关节折叠升降腿、腰部偏航和双轮差速驱动展开，腿 / 腰合计 7 个执行器。每条机械臂从肩到腕提供 7 DOF，关节范围从肩部 ±178° 到 J7 的 -26° 至
              120°。单臂额定负载为 4 kg，工作半径 723 mm；重复定位精度 ±0.1 mm，可与中端协作机械臂竞争。每条手臂集成一个六轴力 / 扭矩传感器（量程 200 N 力、7 Nm
              扭矩），支持柔顺控制和碰撞检测，方便安全人机协作。峰值关节扭矩从颈部俯仰的 3.3 Nm 到膝部的 436 Nm，尺寸配置接近工业机器人执行器。计算栈运行在 NVIDIA Orin AGX 64GB
              上：2,048 核 Ampere GPU、12 核 ARM Cortex-A78AE CPU、2× NVDLA v2 深度学习加速器、64 GB LPDDR5（204.8 GB/s 内存带宽），AI 算力最高
              275 TOPS。连接接口包括以太网、RS485 和 CAN 总线。开发者通过 AlphaBotCore SDK 使用 Python、C 和 C++ 接入。电池为 48V/30 Ah，额定连续运行 4–6
              小时。核心组件 MTBF 额定 50,000 小时，达到工业级可靠性。运行环境为 5–40°C、10–80% RH。
