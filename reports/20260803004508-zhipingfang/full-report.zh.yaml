            title: Unitree + AgiBot 双寡头把 AI² 挤进 <20% 剩余市场
            body: >
              TrendForce 2026 年 4 月预测显示，Unitree 和 AgiBot 约占中国人形机器人出货量 80%，AI² 和所有其他竞争者最多只能争夺仍然很小的 20% 市场。Unitree 的量产规模和
              $16,000 G1 定价形成成本底线，AI² 目前只有 1,000 台 / 年产能且价格未披露，无法在成本上匹配。AgiBot 的五平台组合和 VLA AI 深度，实质上复刻了 AI² 最强的差异化主张。CEO
              公开承认「洗牌」，凸显要在低于 20% 的市场段存活，需要一条清晰楔子；单靠硬件或单靠 AI 差异化都可能撑不住。
            calloutType: risk
