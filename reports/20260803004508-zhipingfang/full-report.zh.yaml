  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 中国直接竞争格局
        blocks:
          - type: paragraph
            body: >
              2026 年，中国人形机器人领域由 Unitree Robotics 和 AgiBot（Zhiyuan Robotics，智元机器人）主导；根据 TrendForce 2026 年 4
              月预测，两者合计占国内人形机器人出货量约 80%。Unitree Robotics 2016 年成立，总部位于杭州，通过激进的硬件商品化建立位置：G1 人形机器人（132 cm，约 35 kg，23–43
              DOF，视配置而定）起售价约 $16,000，是全球最便宜的全能力人形机器人。H1 和 H1-2 进一步进入更高要求的工业场景（H1 约 180 cm、约 47 kg、步行速度 3.3 m/s；H1-2 约
              178 cm、约 70 kg、27 DOF）。Unitree 还已申报境内 IPO，推出 UniStore 应用生态平台，并将其称为全球首个人形机器人应用商店；同时发布双臂上半身 R1 机型，起售价
              $3,930，切入低成本操作用例。AgiBot（Zhiyuan Robotics）2023 年成立于上海，路线相反：围绕五大产品平台深投 AI 架构。A2 全尺寸人形机器人（175 cm、55 kg、49+
              DOF、200 TOPS AI 算力、350 N.m 峰值关节扭矩、7 km/h 步行速度）和工业 G2（搭载 NVIDIA Jetson Thor T5000，板载 2,070 TFLOPS，配自研
              WorkGPT 任务模型和 GO-1/GE-1 任务 / 世界执行模型）代表中国算力最强的人形机器人平台。AgiBot 公开目标是在 2027 年收入超过 RMB 100 亿元（约 USD 14.6 亿），并已在
              Longcheer Technology 的消费电子制造产线部署真实世界强化学习系统。UBTECH Robotics（优必选）是国内资历最久的玩家，也是唯一上市公司（HKEX: 9880），与 Hitachi
              合作将 Walker S2 工业人形机器人部署于制造场景，并推出消费者品牌（Uworld），释放多元化信号。Galbot（银河通用机器人）和 Galaxea AI
              是更早期的国内创业公司，其商业部署在公开记录中仍有限且未被验证。
