      - number: '3.3'
        title: 替代品与现状方案
        blocks:
          - type: paragraph
            body: >
              AI² 人形机器人产品的主要竞争替代品并非同类人形机器人，而是已经在中国工厂大规模部署的现有自动化方案。ABB、KUKA、FANUC、Yaskawa 和中国本土集成商的传统工业机器人，以已验证
              ROI、几乎可忽略的任务失败风险和成熟服务生态主导工厂自动化。IFR 记录 2024 年中国约安装 295,000 台工业机器人，占全球市场
              54%；这个装机基础构成人形机器人必须撬动的主要在位优势。协作机器人（cobots）份额正在提升，并越来越多加入智能功能——The Robot Report 2026 年 1
              月中国机器人展望称协作机器人正「走向更智能的解决方案」，这一差异化方向直接侵入 AI² 的目标应用。自主移动机器人和自动导引车已在物流和仓储场景证明
              ROI。固定自动化产线和传送系统在重复性高产量生产中成本更低、吞吐更高，人形机器人尚无法在经济性上匹配。人工仍是中国轻制造装配任务的主要替代方案，按当前机器人价格点计算，单位任务成本显著更低。内部自建路径同样相关：大型企业买方（汽车
              OEM、半导体晶圆厂）可以与系统集成商开发专有自动化，完全绕过第三方人形机器人供应商。AI² CEO 在 2026 年 2 月承认「行业洗牌已经开始」，也隐含承认企业买方正在这些替代方案与 AI²
              产品之间做选择，而选择依据是已证明的 ROI——这个门槛尚未在公开领域被独立验证。
