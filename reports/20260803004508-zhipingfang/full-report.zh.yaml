      - number: '8.5'
        title: 最终判断与尽调问题
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，AI² 最新报道的超过 USD 2.8 billion 估值总体偏贵。公司仍受益于可信的 HKC
              锚定订单、强战略投资者和说得通的产品叙事，但这些都没有补上核心披露缺口：没有收入、没有毛利率、没有单位经济性、没有现金余额，且只有一份具约束力多年合同。相较 2026 年 2 月的独角兽 cohort，2026
              年 6 月重估把 AI² 推进了安全边际更窄的区间。建议投资者立场仍是 RESEARCH_MORE，而不是买入：若公司披露收入质量、增加多个净新增具约束力客户，或给出结构化下行保护、有效把入场价格压到约 USD
              1.8 billion 以下，再重新评估。没有这些抵消项时，公开证据支持战略关注，但不支持按最新头条估值投入新资本。
            claimRefs:
              - CV032
              - CV033
              - CV034
              - CV041
              - CV042
              - CV045
              - CV046
              - CV047
              - CV048
              - CV049
          - type: table
            tableRef: TV006
            claimRefs:
