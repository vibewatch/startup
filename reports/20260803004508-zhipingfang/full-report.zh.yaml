        - label: 市场机会
          value: 3
          target: 5
        - label: 产品与技术验证
          value: 3
          target: 5
        - label: 竞争护城河
          value: 2
          target: 5
        - label: 财务透明度
          value: 1
          target: 5
        - label: 团队质量
          value: 4
          target: 5
        - label: 估值纪律
          value: 2
          target: 5
        - label: 证据质量
          value: 2
          target: 5
    approximationNotes: 评分是分析师按 1-5 分量表作出的判断。1 分 = 重大不足；3 分 = 中位水平；5 分 = 同类最佳。 截至 2026 年 6 月，收入、利润率或销售管线均未披露，因此「财务透明度」得 1 分。
