  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块地图
        blocks:
          - type: paragraph
            body: >-
              AI² Robotics 把 AlphaBot 系列定位为继智能手机、智能汽车之后的第四代智能终端。当前出货 SKU AlphaBot 2
              是一款轮式双臂人形机器人，面向受控的工业和公共服务场景提升生产力。它没有采用全双足形态，而是用双轮差速底盘牺牲爬楼能力，换来运行稳定性、更低制造复杂度，以及平地最高 1.5 m/s 的速度（坡度容忍
              0°–5°）。机器人集成四个 Intel RealSense D435 RGB-D 摄像头做全周感知，另有两个腕部 D405 摄像头负责近距离手眼引导。具身 AI 层以 Alpha Brain 为品牌，借助
              NVIDIA Orin AGX 64GB 模块在本机运行，摆脱云连接依赖，也保护客户数据。产品线目前包括机器人本体、Alpha Brain 模型、AlphaBotCore SDK，以及两类遥操作外设（VR
              和外骨骼）。目标垂直行业包括汽车制造、半导体晶圆厂、生物技术 / 制药洁净室，以及机场等公共服务场所。管理层已明确把消费家庭场景的扩张推迟到约 2031 年。
