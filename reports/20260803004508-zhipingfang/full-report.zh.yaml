      - number: '7.4'
        title: 资本强度、估值错配与治理风险
        blocks:
          - type: paragraph
            body: >
              AI² Robotics 在 2026 年 2 月完成 Series B，投后估值超过 RMB 10 billion，融资超过 RMB 1 billion（约 USD 145 million）——这是公司约 12
              个月内披露的第 12 次融资事件。这样的融资速度并不寻常：一年内完成 12 次交割（包括 2025 年上半年 7 次，以及 Series B 本身 5
              次）说明两种可能，要么公司采用高频摊薄的结构化提款方式，要么现金消耗率要求它几乎持续进入资本市场。对照 RMB 10B+ 估值，若公司仍处商业化前，隐含收入倍数实际上无限大；若用 HKC
              订单价值作代理（1,000 台，估计 ASP 为 RMB 200,000–500,000 = 三年 RMB 200M–500M，年化约 RMB 67M–167M），估值为年化订单价值的
              60x–150x。这对一家高增长硬件 AI 公司并非天然致命，但要求商业化轨迹近乎完美：HKC 交付任何延迟、MOU 转化失败或竞争导致毛利压缩，都会让大概率需要在 2027–2028 年进行的 Series C
              更难合理定价。Unitree Robotics 已受理科创板 IPO 申请（TrendForce 2026 年 4 月披露），可能给行业设定公开市场可比；其披露的 60% 毛利率和收入占比 51%
              的人形机器人业务，会让 AI² 未披露且在小规模生产下很可能更低的毛利处于不利对比中，从而迫使全行业估值重置。


              治理透明度缺口很大。截至本报告日期，AI² 整个领导团队中只有 CEO Guo Yandong 公开具名。联合创始人、CTO、工程副总裁、首席财务官或独立董事均未公开披露。公司团队页面称核心团队来自
              Microsoft、OPPO 和 Xpeng，但 CEO 之外没有列出任何个人。这带来关键人集中风险：如果 CEO Guo Yandong 无法履职，AI²
              将遭遇领导连续性危机，外部无法识别公开的二号人物。这也限制投资者尽调——高管不具名使外部无法验证其声称的专业能力、评估组织深度，或判断团队成员前雇主带来的利益冲突敞口。品牌冒用事件（2025 年 5
              月，公司对武汉一家使用近似混淆名称的实体发布法律声明）证实 AI² 品牌既有价值也存在争议，但同时暴露出 IP 执法成本；在这一阶段，资本本应优先投向研发和产能扩张。


              产能爬坡在多个层面引入执行风险。从年产 1,000 台提升到 10,000 台——AI² 设定的 2026 年目标——要求公司同步扩张供应链、认证执行器供应商、让 GOVLA 模型承接 10×
              数据吞吐、扩建工厂地面，并以公司经营史上没有先例的速度引入企业客户。2033 年年产 100 万台的目标是当前产能的 1,000 倍；即便可以实现，也意味着当前任何一轮融资都无法一次性覆盖的资本需求和组织复杂度。
