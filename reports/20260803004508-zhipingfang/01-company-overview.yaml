chapter:
  number: 1
  title: Company Overview
  summary: Zhipingfang Technology (智平方科技, branded AI² Robotics; full legal name 智平方（深圳）科技股份有限公司) is a Shenzhen-based humanoid robotics startup founded in April 2023 by Dr. Guo Yandong, a Purdue University PhD and former Microsoft Research scientist. The company develops the AlphaBot 2 humanoid robot and the Alpha Brain / GOVLA vision-language-action model stack for industrial and service deployments. Its February 2026 Series B crossed RMB 10 billion in valuation, and a June 2026 financing cluster totaling nearly RMB 5 billion reportedly lifted valuation above RMB 20 billion (~USD 2.8 billion), making it the Greater Bay Area's first embodied-AI company to cross that threshold. Management says the April 2026 shareholding reform does not set an immediate IPO timetable. The company has real commercialization signals — especially the HKC 1,000-unit order and broader deployments — but revenue, margin, and full cap-table terms remain undisclosed.
sections:
- id: s1
  title: Corporate Identity and Business Model
  body: 'AI² Robotics operates under the full legal name 智平方（深圳）科技股份有限公司 (unified social credit code 91440300MA5HTHDC7C), incorporated in April 2023 and headquartered in the Nanshan District of Shenzhen, China''s most concentrated hub for high-tech hardware startups. The company maintains a secondary development office in Beijing. The brand name AI² encodes the thesis that artificial intelligence raised to the power of embodiment unlocks a qualitative leap in robotic capability — a formula the company markets as "AI × Embodiment." The business model is vertically integrated: AI² designs its own robot hardware, develops its proprietary vision-language-action (VLA) AI model stack in-house, and sells robots directly to enterprise customers under multi-year commercial contracts. Target markets include factory automation (automotive, semiconductor, electronics manufacturing), logistics, and healthcare. Unlike peers that license third-party AI models, AI² claims competitive differentiation through
    its proprietary GOVLA/Alpha Brain model layer. Revenue is generated through hardware robot sales, potential software licensing for the AI model layer, and multi-year enterprise customer contracts. In May 2025, the company issued a formal legal notice against a Wuhan-based entity that had registered a corporate name resembling AI²''s brand, providing an independently verified public record of the full legal name, credit code, and registered address — one of the clearest governance-transparency windows available for this otherwise private company.

    '
