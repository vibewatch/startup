- id: s3
  title: Funding History and Investor Composition
  body: 'AI² Robotics'' February 2026 Series B remains the clearest historical capital anchor: the company raised more than RMB 1 billion (approximately USD 145 million) and crossed the RMB 10 billion valuation threshold. That round is no longer the current mark. On June 29, 2026, multiple independent outlets reported a fresh financing cluster totaling nearly RMB 5 billion that lifted Zhipingfang''s post-money valuation above RMB 20 billion (approximately USD 2.8 billion), roughly doubling the February mark within four months and making it the Greater Bay Area''s first embodied-AI company to reach that level. The investor base also broadened beyond Baidu Venture, CRRC Capital, Cedarlake, Guotai Haitong, Yusys, Sentury Tire, and a Tesla-supply-chain backer to include state and regional capital such as the National SME Development Fund, China Cultural Industry Fund, Guangdong AI Fund, Shenzhen Capital Group / Shenzhen Venture Capital, and Nanshan War-New Investment, alongside additional industrial
    and financial investors. In April 2026 the company completed shareholding reform, but management told reporters it had no definitive IPO timetable to disclose and framed the reform as a governance upgrade for scaled operations rather than an immediate listing trigger. Public evidence therefore supports exceptionally strong capital access and policy alignment, but not a clean view of the current cap table, liquidation preferences, or true lifetime funding total.'
