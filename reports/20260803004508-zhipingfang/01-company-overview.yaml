  evidenceGaps:
  - type: enumeration-incomplete
    severity: minor
    topic: enterprise customer list
    missingEvidence: A complete, verified list of all AI² Robotics enterprise customers, contract values, and deployment scope as of June 2026.
    whyItMatters: Commercial traction validation depends on confirmed customer pipeline breadth; the current list of HKC, Dongfeng Liuzhou Motor, and Huaxin Bio may significantly undercount actual deployments.
    diligencePath: Request a full customer reference list from AI² Robotics as part of Series C due diligence; verify HKC contract terms (price, delivery milestones, acceptance criteria) independently.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: competitive benchmarking
    missingEvidence: Independent third-party evaluation of AlphaBot 2 performance metrics relative to Unitree H1 / H1-2, AgiBot H1, and Boston Dynamics Atlas using a standardized task suite.
    whyItMatters: Without independent benchmarks, the GOVLA vs. π₀ +30% claim and other product differentiation claims remain unverifiable marketing assertions; comparative valuation assessment requires objective data.
    diligencePath: Commission or obtain access to academic or third-party robot evaluation benchmarks (e.g., BEHAVIOR-1K, RoboSuite); alternatively request AI² demo access with a standardized task protocol.
    relatedQuestionRefs:
    - QO024
  - type: private-evidence-only
    severity: material
    topic: AI model architecture
    missingEvidence: Full technical disclosure of the GOVLA/Alpha Brain model architecture, training data, compute scale, and reproducible benchmark methodology.
    whyItMatters: The AI model is the primary claimed differentiator; without architectural transparency, the 30% benchmark claim vs. π₀ cannot be validated and investor-grade technical due diligence is impaired.
    diligencePath: Review FIS-VLA open-source release in detail on GitHub; request full technical whitepaper or access to AI² internal evaluations during diligence process.
    relatedQuestionRefs:
    - QO027
  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: Revenue, ARR, gross margin, burn rate, cash position, and unit economics for AI² Robotics as of June 2026.
    whyItMatters: AI² is a private company with no disclosed financials; without revenue data, valuation multiples cannot be computed and commercial self-sufficiency cannot be assessed ahead of any investment.
    diligencePath: Request audited financial statements as part of any Series C due diligence process; at minimum obtain signed revenue confirmation from HKC and other named customers.
    relatedQuestionRefs: []
    relatedTableRefs: []
  - type: private-evidence-only
    severity: material
    topic: founding team and executive roster
    missingEvidence: Full names and backgrounds of all co-founders, CTO, CFO, VP-Engineering, and other C-suite executives at AI² Robotics.
    whyItMatters: Team depth and breadth are critical risk factors; with only the CEO publicly identified, governance resilience and succession planning cannot be assessed.
    diligencePath: Request an executive team summary as part of due diligence; independently verify through LinkedIn and professional network checks; review board composition and investor director seats.
    relatedQuestionRefs: []
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: corporate milestones
    missingEvidence: Internal product development milestones, all prior-round financing details (pre-Series A, Series A individual tranche dates and amounts), undisclosed enterprise contract signings, and board-level governance events not captured in public press coverage as of June 2026.
    whyItMatters: The milestone timeline (TO004) covers only publicly disclosed events; undisclosed financing tranches and stealth product iterations may represent meaningful signals about execution velocity and strategic pivots.
    diligencePath: Request a complete corporate timeline and cap table history from AI² Robotics management as part of Series C due diligence; cross-reference with LinkedIn employee join-date patterns and patent filing dates.
    relatedQuestionRefs: []
    relatedTableRefs:
