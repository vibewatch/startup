callouts:
- title: Fastest Chinese Humanoid Robot Company to Unicorn Status
  body: AI² Robotics achieved unicorn valuation (>RMB 10 billion) in under 3 years from founding — one of the fastest trajectories in the global humanoid robot sector. The combination of a vertically integrated hardware-plus-AI model stack, high-profile institutional backers (Baidu Venture, CRRC Capital), and what the company describes as China's largest non-showcase commercial robot order (HKC 1,000 units) positions AI² as a credible challenger in the domestic market. The open-sourced FIS-VLA model and Yann LeCun's endorsement provide international technical credibility signals that may accelerate developer ecosystem adoption.
  calloutType: strength
  claimRefs:
  - CO003
  - CO031
  - CO033
  - CO036
  - CO037
  - CO040
- title: Market Concentration Risk — AI² Competes Below the Top-2 Duopoly
  body: TrendForce estimates Unitree Robotics and AgiBot together hold approximately 80% of the Chinese humanoid robot market as of early 2026, leaving AI² and all other domestic players competing for the remaining 20%. The CEO's own February 2026 op-ed acknowledges that the "industry shake-out has already begun." As a private company with undisclosed revenue, AI² cannot demonstrate commercial self-sufficiency; the 2026 target of 10,000 units/ year represents a 10× capacity expansion that has not been independently validated. Key-person concentration in CEO Guo Yandong, the undisclosed founding team, and the absence of a publicly disclosed executive team all amplify governance and operational execution risk.
  calloutType: risk
  claimRefs:
  - CO018
  - CO041
  - CO042
