- id: s4
  title: Products, Technology, and Competitive Position
  body: 'AI²''s flagship product is AlphaBot 2, a full-size humanoid robot launched in April 2025 with 22 degrees of freedom, standing 1,800 mm tall and weighing 135 kg. The robot is powered by an NVIDIA Jetson Orin AGX module with 64 GB of on-device memory and supports 4–6 hours of operation per charge. The core AI differentiation is the GOVLA model (marketed as Alpha Brain), a proprietary vision-language-action architecture developed in-house. In June 2025, the company open-sourced a research variant named FIS-VLA on GitHub; Yann LeCun, Meta''s Chief AI Scientist, publicly endorsed the model. AI²''s internal benchmark asserts GOVLA achieves a 30% higher task success rate than Physical Intelligence''s π₀ model — a company-reported figure that has not been independently replicated as of this report. The company established its production line in September 2025 at an initial capacity of 1,000 units/year, and publicly states a target of 10,000 units/year by end of 2026. In competitive context,
    TrendForce (April 2026) estimates that Unitree Robotics and AgiBot together hold approximately 80% of the Chinese humanoid robot market, leaving all other domestic players — including AI² — competing for the remaining 20%. AI² cites HKC''s 3-year, 1,000-robot commercial order as evidence of traction, calling it the largest non-showcase commercial humanoid robot order in China. Other named customers include Dongfeng Liuzhou Motor (automotive factory automation), Huaxin Bio (pharmaceutical), and JingNeng Microelectronics (semiconductor).

    '
