- id: s2
  title: Founding Team and Leadership
  body: 'AI² Robotics was founded by Dr. Guo Yandong (郭彦东), who serves as CEO and is the only publicly named company executive as of the run date. Dr. Guo holds a doctorate from Purdue University''s Electrical and Computer Engineering department, where his doctoral research was supervised by Professor Charles A. Bouman — a leading academic in statistical image processing and computational imaging. Following his doctorate, Dr. Guo worked as a researcher at Microsoft Research in the United States, acquiring industrial AI and computer vision R&D experience before returning to China to found AI² Robotics. His combined academic pedigree in imaging and machine learning and his experience at a world-class industrial research lab directly inform the company''s core GOVLA/Alpha Brain model architecture. The broader founding team composition, co-founder names, CTO identity, and executive organization chart are not publicly disclosed, representing a significant governance transparency gap for a company
    at unicorn valuation. In February 2026, Dr. Guo authored a public-facing op-ed on Sina Finance stating that "the industry shake-out has already begun" — a rare candid acknowledgment from a startup CEO that competitive consolidation pressure is real and accelerating in the Chinese humanoid robot sector. Yann LeCun, Meta''s Chief AI Scientist, publicly endorsed AI²''s FIS-VLA model in June 2025, lending the company external academic credibility although he holds no confirmed formal advisory role.

    '
