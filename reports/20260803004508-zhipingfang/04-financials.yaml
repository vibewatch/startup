- id: s3
  title: Cost Structure, Unit Economics, and Production Capex
  body: 'AlphaBot 2''s bill of materials is anchored by the NVIDIA Jetson AGX Orin 64GB computing module, three Intel RealSense D435 RGB-D cameras, two D405 close-range cameras, 2D LiDAR, a 22-DOF precision actuator system with industrial-grade joint motors (knee peak torque 436 Nm, waist pitch 207 Nm), a 48V/30Ah battery pack, and a two-wheel differential chassis. Based on commercial component pricing benchmarks for embedded AI modules and precision actuators, total BOM is estimated at RMB 100,000–200,000 per unit (~USD 14,000–28,000) — implying gross margin compression risk if enterprise pricing is insufficient to cover direct material plus assembly. AI² cites a 50,000-hour MTBF rating on core components, a reliability-engineering investment that itself raises the component-quality bar and cost. For R&D cost, the company operates a "thousand-GPU compute cluster" for GOVLA model training — a significant ongoing infrastructure cost that, on a small installed base, drives high per-unit amortized
    R&D expense. The company also employs DeepSeek technology in GOVLA VLA model construction, indicating external model dependencies that could carry licensing or compute overhead. The production scale-up from 1,000 to 10,000 units/year implies substantial capex for factory tooling, quality control automation, and supply-chain lock-in for precision components. AgiBot''s trajectory — scaling from 1,000 to 5,000 to 10,000 units over roughly three months in early 2026 — demonstrates what rapid humanoid robot scale-up looks like operationally, though AgiBot''s production model may differ. Unitree''s STAR market IPO prospectus (as cited by TrendForce, April 2026) disclosed a 60% combined gross margin for humanoid and quadruped robots in 2025, suggesting that at sufficient scale, hardware margins can be healthy; however, Unitree''s lower-cost G1 ($13,500) skews the blended margin favorably and AI²''s higher-spec product mix is not directly comparable. The CEO explicitly cautioned that the consumer
    robotics market is not viable for at least five more years, anchoring revenue expectations firmly in the enterprise segment where contract values are larger but cycles are longer.

    '
