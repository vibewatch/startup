- calloutType: insight
  title: CRRC Capital Signals Infrastructure-Scale Validation
  body: 'CRRC Capital''s participation in the Series B as the first state-owned heavy-industry investor in Chinese humanoid robotics is strategically significant beyond the capital injection: it provides AI² with access to large-scale manufacturing testing environments owned by the world''s largest rail equipment manufacturer, and aligns the company with state industrial policy at a time when China''s 15th Five-Year Plan (2026–2030) explicitly positions robotics as a core national industrial priority. This investor relationship partially de-risks the capex-scale-up risk by providing testing infrastructure that would otherwise require direct capital investment.

    '
