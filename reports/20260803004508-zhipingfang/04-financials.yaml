- id: s4
  title: Financial Evidence Gaps and Underwriting Blockers
  body: 'This chapter documents a structurally incomplete financial picture. AI² Robotics is a Chinese private company with no statutory obligation to publish financial statements, and it has not volunteered any quantitative financial disclosure beyond the Series B transaction terms. Every metric required for conventional startup underwriting — revenue (current or trailing), gross margin, EBITDA, cash balance, burn rate, and runway — is absent from the public record. The consequence for investors is that capital adequacy analysis rests entirely on the following estimates: (a) assuming a monthly burn of RMB 30–80 million (USD 4–11 million), the USD 145 million Series B implies 13–36 months of runway from February 2026, pointing to a potential Series C window in 2027–2028; (b) the HKC order provides an order-backed revenue proxy but neither the per-unit contract price nor the aggregate value has been disclosed; (c) total lifetime capital is unverifiable because pre-Series B round sizes are
    undisclosed. The commercial traction signals (four named enterprise customers, airport pilots, modular space deployments) suggest active deployment activity but cannot be translated into revenue without pricing data. The market risk is sharpened by Unitree and AgiBot''s combined ~80% market share, which limits the addressable backlog available to AI² in the near term, and by the CEO''s own February 2026 acknowledgment that "industry shake-out has already begun" — a signal that the window for establishing commercial scale before the next funding round is narrowing. The diligence path is straightforward but must be pursued directly: audited financials, management-prepared revenue model, signed commercial contracts with pricing, and a CFO-attested burn/runway statement.

    '
