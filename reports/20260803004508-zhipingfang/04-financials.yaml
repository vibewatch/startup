chapter:
  number: 4
  title: Financials
  summary: AI² Robotics remains a capital-intensive humanoid robotics company with no publicly disclosed revenue, gross margin, burn rate, or balance sheet. The February 2026 Series B (>RMB 1 billion / ~USD 145 million) established unicorn status above RMB 10 billion, but a June 2026 financing cluster reportedly added nearly RMB 5 billion and lifted valuation above RMB 20 billion (~USD 2.8 billion), materially raising the underwriting bar while still leaving unit economics opaque. The HKC 1,000-unit three-year order remains the best public revenue proxy, but pricing, margin, and cash-conversion detail are absent. This chapter therefore reads less like a financial statement analysis and more like a capital-intensity and disclosure-gap map.
sections:
- id: s1
  title: Revenue Model and Commercial Traction
  body: 'AI² Robotics monetizes primarily through direct enterprise hardware sales of the AlphaBot 2 robot under multi-year commercial contracts. No software-only, SaaS, or asset-light revenue stream has been publicly confirmed, though the company''s official product documentation lists GOVLA/Alpha Brain as a potential licensing layer. Revenue recognition is expected to occur upon robot delivery and acceptance, consistent with hardware sale norms; recurring service revenue (maintenance, model updates) has not been disclosed. The company does not publish a list price. Based on commercially analogous enterprise deployments — Agility Robotics'' Digit robot at approximately USD 150,000 per unit in Western markets, and Unitree''s G1 at USD 13,500 for a far lighter and simpler research-grade platform — AlphaBot 2''s enterprise ASP is estimated at RMB 200,000–500,000 per unit (~USD 28,000–70,000), though this range is unconfirmed. The strongest public commercial signal is the HKC (惠科, world''s
    third-largest LCD panel manufacturer) three-year contract for 1,000 AlphaBot 2 units, which the company characterizes as the largest non-showcase commercial humanoid robot order in China. Other confirmed customer relationships include Dongfeng Liuzhou Motor (automotive, strategic cooperation since June 2025), Huaxin Bio (biotechnology, strategic partnership announced April 2025), and JingNeng Microelectronics (semiconductor manufacturing). Airport baggage-cart handling pilots in first-tier Chinese cities and "智魔方" modular AI space deployments in Beijing and Shenzhen represent public-service-sector exploration. The company''s official about page claims it "leads in order volume and scenario coverage" — a company-stated assertion without independent corroboration of order count or revenue value. No ARR, GMV, or unit shipment figures have been disclosed.

    '
