- id: s2
  title: Capital Structure, Funding History, and Investor Map
  body: 'AI² Robotics'' February 2026 Series B raised more than RMB 1 billion (approximately USD 145 million) at a post-money valuation above RMB 10 billion (approximately USD 1.4–1.5 billion). That round remains well corroborated by Yicai Global, CnTechPost, Crunchbase News, and Robotics & Automation News. Public evidence did not stop there: on June 29, 2026, multiple additional outlets reported a fresh financing cluster totaling nearly RMB 5 billion that lifted valuation above RMB 20 billion (approximately USD 2.8 billion). The new round set appears to include a wider mix of national and Shenzhen-aligned capital — National SME Development Fund, China Cultural Industry Fund, Guangdong AI Fund, Shenzhen Capital Group / Shenzhen Venture Capital, and Nanshan War-New Investment — alongside industry and financial investors. Combining the confirmed February Series B and the reported June financing implies a publicly disclosed funding floor above RMB 6 billion (~USD 845 million), before considering
    earlier rounds. Even so, the exact lifetime total, per-round sizing, and current cash-on-hand remain opaque because the company has not published a cap table or balance sheet. Management also said after the April 2026 shareholding reform that it had no definitive IPO timeline to disclose, so investors cannot assume an imminent listing will resolve the transparency gap. The practical result is unusual: Zhipingfang now carries a mega-round valuation and capital base more typical of later-stage private companies, while still disclosing almost none of the operating data needed to validate that mark.'
