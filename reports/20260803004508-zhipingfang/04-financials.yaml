callouts:
- calloutType: risk
  title: Capital Intensity and Pre-Revenue Scale Risk
  body: 'AI² Robotics is scaling production infrastructure (targeting 10× capacity growth) while operating at sub-commercial revenue scale, with no publicly disclosed revenue, gross margin, or burn rate. The estimated 13–36 month runway from the Series B close implies a potential Series C requirement in 2027–2028, during which competitive consolidation (Unitree + AgiBot ~80% market share) will intensify. The combination of high fixed R&D (thousand-GPU cluster), high per-unit BOM (NVIDIA Orin AGX–anchored), and an undisclosed pricing structure creates a scenario where the company could be burning toward a commercialization threshold that the market has not yet validated at the required scale.

    '
