    data:
      nodes:
        - label: Global humanoid robot market (2030 forecast)
          value: 15.26
          description: >-
            MarketsandMarkets global humanoid robot market forecast of USD 15.26B by 2030 (from USD 2.92B in 2025;
            CAGR 39.2%). Includes all geographies; broadest available scope definition.
        - label: China humanoid robot market (2030 forecast)
          value: 2.80
          description: >-
            MarketsandMarkets China humanoid robot market forecast of USD 2.80B by 2030 (from USD 0.40B in 2025;
            CAGR 47.6%). Higher China CAGR reflects outsized domestic policy and investment tailwinds.
        - label: China humanoid robot market (2025 baseline)
          value: 0.40
