tables:
  - id: TM001
    title: Market Definition and Boundary
    columns:
      - Segment / category
      - Included spend
      - Excluded spend / adjacencies
      - Status-quo substitute
      - Relevance to AI² Robotics
    rows:
      - - Enterprise-grade AI-native humanoid robots (bipedal or wheeled)
        - Robot hardware units; proprietary AI/VLA software stack; system integration; multi-year commercial contracts; maintenance and support
        - Traditional fixed-arm industrial robots; AGVs; consumer/entertainment robots
        - Human factory labor; fixed-arm robot cells with fixtures; outsourced manufacturing
        - Core target segment; AI² AlphaBot 2 (bipedal, 22 DOF) competes directly here
      - - Collaborative robots (cobots)
        - Cobots handle repetitive pick-and-place at lower cost; increasingly purchased by same enterprise buyers as humanoids
        - Excluded from humanoid SAM; different buyer decision process and use case
        - Cobots are themselves a substitute for humanoid robots on simpler, structured tasks
        - Adjacent competitive pressure; cobot adoption normalizes enterprise procurement for advanced robotics
      - - Industrial AI software platforms and robot orchestration
        - AI inference, simulation, digital-twin, and fleet-management software sold alongside humanoid hardware
        - Stand-alone industrial software sold without hardware (ERP, MES systems)
        - Traditional factory automation software; human supervision
        - Adjacent enabler; AI² bundles Alpha Brain model with hardware as a potential SaaS upsell vector
      - - Embodied AI general-purpose mobile manipulation platforms (wheeled)
        - Wheeled dual-arm platforms such as Galaxea G0 Plus and X Square Robot; part of same enterprise buyer conversations
        - Strictly bipedal robots only; wheeled platforms serve overlapping but distinct niches
        - Single-arm cobots; human dexterous assembly workers
        - Direct form-factor competitor in intralogistics and simple assembly; lower deployment complexity than bipedal
      - - Service and logistics robots (non-manipulation)
        - AMRs and AGVs for transport without dexterous manipulation
        - Excluded from humanoid SAM
        - Conveyor belts; manual forklift operators; autonomous forklifts
        - Out of scope for AI²; included here to demarcate boundary explicitly
      - - Human labor (status-quo baseline)
        - Labor cost at Chinese factory wage rates; flexible, dexterous, no upfront capex
        - Not a robot spend category; included as reference baseline
        - Human labor is the primary substitute and the ROI baseline for all robot deployments
        - The economics of replacing human workers in semiconductor cleanrooms, electronics assembly, and automotive body shops determine AI²'s enterprise sales cycle length and contract size
    notes: >-
      Scope definitions vary across analyst sources: MarketsandMarkets humanoid market figures likely include
      wheeled mobile manipulators, while TrendForce output data covers all AI-enabled bimanual platforms. IFR
      World Robotics data covers traditional industrial robots only and does not disaggregate humanoids as a
      category. This boundary treats AI²'s SAM as the enterprise-grade, AI-native sub-segment, not the full
      Chinese industrial robot market. Status-quo substitutes are factory-specific and determine the sales cycle
      dynamics for each enterprise vertical.
    claimRefs:
      - CM001
      - CM014
      - CM015
      - CM041
      - CM042

