  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: unit economics and average selling price
      missingEvidence: >-
        No Chinese humanoid robot vendor — including AI² Robotics, Unitree, or AgiBot — has publicly disclosed
        average selling prices, lifecycle cost structures (integration + maintenance + downtime), enterprise payback
        period data, or unit gross margins as of June 2026.
      whyItMatters: >-
        Without unit economics disclosure, enterprise buyers cannot independently model ROI or payback periods,
        slowing procurement cycles. For investors, the absence of ASP and margin data makes it impossible to
        validate AI²'s revenue model or assess whether the HKC contract is economically sustainable.
      diligencePath: >-
        Request an ASP schedule and cost-of-goods breakdown from AI² Robotics as part of Series C due diligence.
        Cross-check against Unitree's STAR market IPO prospectus (pending publication) which may disclose revenue
        per unit. Interview at least two enterprise customers to obtain independent total-cost-of-ownership estimates.
      relatedQuestionRefs:
        - QM007
        - QM019
        - QM026
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: comparative form-factor adoption data
      missingEvidence: >-
        No independent market data exists on the relative commercial adoption velocity of bipedal humanoid
        robots (AI², Unitree H1/G1, AgiBot A3) versus wheeled dual-arm mobile manipulators (Galaxea G0 Plus,
        X Square Robot) in Chinese industrial deployments as of June 2026.
      whyItMatters: >-
        If wheeled platforms achieve faster adoption due to lower complexity and shorter integration timelines
        (Galaxea claims under 30 minutes), the SAM for strictly bipedal humanoids like AI² AlphaBot 2 may be
        narrower than headline market estimates suggest, adversely affecting AI²'s addressable opportunity.
      diligencePath: >-
        Survey at least three enterprise buyers in automotive and semiconductor verticals on their form-factor
        preference and deployment experience. Obtain trial access to both a wheeled and bipedal platform for
        a standardized task comparison on a client's actual production line.
      relatedQuestionRefs:
        - QM018
      relatedTableRefs:
        - TM003
    - type: data-unavailable
      severity: material
      topic: policy-to-procurement mechanism
      missingEvidence: >-
        No public documentation exists on how China's 15th Five-Year Plan robotics directives are translated
        into specific enterprise procurement mandates, subsidy mechanisms, or preferred-vendor frameworks for
        humanoid robots in state-owned or state-aligned enterprises as of June 2026.
      whyItMatters: >-
        If policy guidance creates preferential procurement for domestic humanoid robots in state-linked
        enterprises — which account for a substantial share of China's manufacturing base — the effective TAM
        for AI² could be meaningfully larger than the private-sector-only analysis suggests. Conversely, if
        policy support is indirect and general, the demand floor implied by 15th FYP should be discounted.
      diligencePath: >-
        Review MIIT humanoid robot development action plan implementation guidelines once formally published.
        Interview CRRC Capital or similar SOE-linked investors in AI² to understand whether there are explicit
        procurement directives or just general policy encouragement. Track provincial government subsidy announcements
        for humanoid robot adoption in 2026.
      relatedQuestionRefs:
        - QM020
        - QM001
    - type: enumeration-incomplete
      severity: minor
      topic: enterprise integration challenges
      missingEvidence: >-
        A comprehensive, independently verified enumeration of the enterprise integration challenges
        (deployment timeline, custom training data requirements, safety protocol overhead, maintenance cost)
        encountered by Chinese industrial buyers deploying humanoid robots in production environments.
      whyItMatters: >-
        Integration friction determines actual adoption pace and contract renewal rates. AgiBot's RW-RL
        deployment at Longcheer reduced changeover time to approximately 10 minutes, suggesting the
        integration barrier is falling — but this is a single data point from a vendor with a vested
        interest in presenting positive results.
      diligencePath: >-
        Obtain reference calls with at least two of AI²'s named enterprise customers (HKC, Dongfeng Liuzhou
        Motor, Huaxin Bio) to understand actual integration timelines, training data collection requirements,
        and first-deployment success rates. Cross-check with AgiBot and Unitree deployment reports if
        accessible.
      relatedQuestionRefs:
        - QM022
        - QM019

