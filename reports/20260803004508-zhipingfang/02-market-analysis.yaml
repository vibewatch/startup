  - id: s2
    title: Market Sizing — Multiple Lenses and Contradictions
    body: >
      No single authoritative market size exists for China's humanoid robot sub-market; publicly available estimates
      use inconsistent scope definitions, methodologies, and geographic cuts, making direct comparison inappropriate.
      Four sizing lenses illuminate different facets. (1) Volume outlook: TrendForce (April 2026) projects China
      humanoid robot output to surge 94% year-on-year in 2026, with Unitree and AgiBot together capturing approximately
      80% of total shipments — implying all remaining players compete for at most 20% of output. (2) Revenue forecast:
      MarketsandMarkets sizes the China humanoid robot market at USD 0.40 billion in 2025, growing to USD 2.80 billion
      by 2030 at a CAGR of 47.6%. Its global market estimate of USD 2.92 billion (2025) rising to USD 15.26 billion
      (2030) at CAGR 39.2% implies China accounts for roughly 14% of global humanoid revenue in 2025 by this source's
      definition. (3) Total industrial robot context: IFR reports China installed 295,000 industrial robots in 2024,
      representing 54% global market share — dominated by traditional arm robots, with humanoids not separately
      disaggregated. If humanoids represent less than 1% of the installed base, the USD 0.40 billion 2025 revenue
      figure corresponds to a few thousand units at USD 50–150K average selling price per unit, a range consistent
      with available competitor pricing signals. (4) Investment signaling lens: at least five Chinese embodied AI
      companies have each raised more than USD 210 million to date, with X Square Robot alone totaling over USD 400
      million in two years — suggesting VC expectations of a substantially larger market within three to five years,
      but also signaling over-funding relative to current unit economics. Contradictions abound: TrendForce's output
      metric likely counts all AI-enabled wheeled and bipedal robots; MarketsandMarkets may use a narrower definition;
      IFR does not disaggregate humanoids at all. Both SAM and SOM for AI² Robotics cannot be reliably isolated from
      available public data, and any single-point TAM estimate should be treated as directionally indicative rather
      than analytically precise.
