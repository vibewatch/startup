    title: Market Sizing Lens — Pyramid
    type: pyramid
    layout: standard
    summary: >-
      Stacked market lenses showing the scale of the Chinese and global humanoid robot market, without implying a
      clean AI²-specific SAM. Each node represents a different analytical lens with different scope and methodology.
