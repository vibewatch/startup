chapter:
  number: 2
  title: Market Analysis
  summary: >
    China's industrial and humanoid robot market is the world's largest by unit volume — IFR reports 295,000 industrial
    robot installations in 2024 representing a 54% global market share — but the addressable sub-segment for
    general-purpose, enterprise-grade, AI-native humanoid robots remains nascent and poorly delineated in public data.
    MarketsandMarkets estimates China's humanoid robot market at USD 0.40 billion in 2025, growing to USD 2.80 billion
    by 2030 at a CAGR of 47.6%, while TrendForce projects a 94% output surge in 2026 with Unitree Robotics and AgiBot
    together capturing approximately 80% of shipments. For AI² Robotics, the relevant SAM is the enterprise-grade
    industrial humanoid sub-segment in automotive, semiconductor/display, pharmaceutical, and logistics verticals, where
    it must displace human labor or hybrid-automation approaches. AI²'s addressable share is constrained to at most 20%
    of a still-small market; the CEO's own February 2026 op-ed acknowledged that "the industry shake-out has already
    begun." Growth is policy-reinforced — China's 15th Five-Year Plan (2026–2030) explicitly places robotics at the
    heart of the modern industrial system — but near-term adoption velocity is constrained by task reliability gaps,
    ROI opacity, market concentration, and the absence of formal safety certification standards.

sections:
  - id: s1
    title: Market Boundary and Definitions
    body: >
      The market relevant to AI² Robotics is best defined as China's enterprise-grade, general-purpose humanoid robot
      market — robots capable of performing multi-step dexterous tasks in unstructured industrial environments, powered
      by a vision-language-action (VLA) AI model rather than fixed programming. This segment sits at the intersection
      of the broader Chinese industrial robot market and the emerging embodied AI category. Included spend covers
      humanoid robot hardware units, proprietary AI software stacks, system integration and deployment services,
      multi-year commercial operation contracts, and maintenance. Excluded spend includes: traditional fixed-arm
      industrial robots (FANUC, ABB, KUKA, Yaskawa, SIASUN, GSK equivalents) programmed for specific rigid tasks;
      Autonomous Mobile Robots (AMRs) and AGVs used for intralogistics transport without manipulation; collaborative
      robots (cobots) lacking dexterous manipulation and general AI; and consumer or entertainment robots without
      commercial-grade reliability. Status-quo substitutes for AI²'s value proposition include human labor at Chinese
      factory wage rates, fixed-arm robot cells with custom fixtures, cobots for pick-and-place on specific SKUs, and
      outsourcing of variable-demand manufacturing tasks to labor-flexible suppliers. The "humanoid" descriptor is
      contested: Galaxea Dynamics and X Square Robot deploy wheeled dual-arm systems rather than bipedal robots,
      blurring the category boundary with cobots and AMR-arm combinations. AI²'s AlphaBot 2 is bipedal at 22 DOF,
      differentiating it on form factor but raising deployment complexity relative to wheeled alternatives. Adjacencies
      include industrial IoT orchestration platforms, simulation and digital-twin environments, and cloud robotics
      services used to pre-train and fine-tune VLA models.
