companyProfile:
  summary: Zhipingfang Technology (智平方科技, branded AI² Robotics) is a Shenzhen-based embodied-AI robotics company founded in April 2023 by CEO Dr. Guo Yandong. The company combines a proprietary vision-language-action model stack (Alpha Brain / GOVLA / NeuroVLA), full-stack humanoid robot hardware, and direct enterprise deployment to target factory automation and public-service workflows. Public evidence supports a major HKC factory order, broader deployments in semiconductor, biotech, retail, and public-service settings, and a June 2026 valuation above RMB 20 billion, but revenue, margin, burn, and full cap-table detail remain undisclosed.
