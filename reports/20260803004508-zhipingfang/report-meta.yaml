  topStrengths:
  - Zhipingfang pairs a proprietary embodied-AI stack with full-stack robot hardware and has shipped a coherent AlphaBot commercialization narrative into real enterprise scenarios.
  - The investor base now spans national funds, Shenzhen state-backed capital, strategic corporates, and financial institutions, strengthening policy alignment and follow-on financing access.
  - The HKC three-year 1,000-unit order remains stronger named commercialization proof than most early humanoid peers have publicly shown.
  topRisks:
  - The June 2026 re-rating above $2.8B arrived without revenue, margin, or cash-burn disclosure, leaving minimal public-evidence margin of safety.
  - Commercial concentration is still extreme because HKC remains the only publicly confirmed binding multi-year contract, while other named accounts remain pilots or cooperation agreements.
  - The product stack depends on rapid production ramp, VLA reliability, and imported compute components in a market already consolidating around larger Chinese competitors.
  unresolvedGaps:
  - Audited revenue, gross margin, cash burn, and backlog-conversion data remain undisclosed.
  - Customer acceptance criteria, payment terms, and realized economics for the HKC order are not public.
  - The detailed post-June-2026 cap table, preference stack, and true cumulative capital raised are not publicly disclosed.
