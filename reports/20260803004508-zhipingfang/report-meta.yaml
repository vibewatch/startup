  customerFocus: Large Chinese enterprises in manufacturing, electronics, semiconductors, biotech, logistics, retail, and public-service environments.
  businessModel: Direct enterprise robot sales, deployment/service contracts, and potential software or model-layer monetization tied to embodied AI workflows.
