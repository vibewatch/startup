  fundingStatus: Series B above RMB 1 billion in February 2026; June 2026 financing cluster near RMB 5 billion reportedly lifted valuation above RMB 20 billion. Shareholding reform completed in April 2026, but management said no definitive IPO timeline was available for disclosure.
