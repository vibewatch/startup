  topStrengths:
    - >-
      Public evidence supports meaningful 2024 scale: US$314M of bookings, diversified across advisory, operating
      businesses, and investment activity.
    - >-
      The company controls or influences several flagship Web3 properties, with concrete adoption signals from The
      Sandbox, Moca Network, Open Campus, GAMEE, and Anichess.
    - Recognized assets plus a large portfolio create strategic flexibility that many private Web3 peers lack.
    - >-
      Animoca continues to attract ecosystem partners and project-level capital, which supports the case that its
      network still matters post-cycle.
  topRisks:
    - >-
      Current parent-company valuation support is inconsistent across public sources, ranging from current-transaction
      narratives around $1B to much higher secondary or narrative marks.
    - >-
      Bookings, token reserves, and asset marks do not substitute for audited revenue quality, margin, cash-flow, and
      cap-table disclosure.
    - >-
      Regulatory scope keeps broadening as Animoca moves across gaming, identity, education-finance, tokenization, and
      capital-markets-adjacent products.
    - >-
      Liquidity realization remains uncertain because tokenization and reverse-merger plans are not equivalent to a
      clean closed liquidity event.
    - >-
      Product breadth lowers single-title dependence but raises execution, dependency, and coordination risk across many
      counterparties and ecosystems.
  unresolvedGaps:
    - Current cap table, liquidation preferences, intercompany ownership, and rights waterfall.
    - >-
      Treasury stress behavior, lock-up schedule, and realized monetization history for digital assets and token
      reserves.
    - Audited or reviewed revenue, margin, cash-flow, payer-conversion, and retention metrics by major property.
    - Verified recent secondary transactions or banker marks that establish a current parent-company market price.
    - Board-ranked liquidity plan across reverse merger, tokenization, secondary, or strategic alternatives.
