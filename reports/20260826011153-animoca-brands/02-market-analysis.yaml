      ]
    },
    {
      "id": "buyer-and-adoption-path",
      "title": "Buyer, user, and payer segments are more diverse than the label \u201cgamer\u201d implies",
      "body": "The Animoca market is shaped by more than one kind of participant. End users include casual gamers, deeper collectors, creators, DAO or community members, and loyalty-program participants who may not self-identify as crypto-native at all. Payers are similarly varied. In some products, self-funded consumers buy land, NFTs, passes, or tokens; in others, studios, brands, ecosystem foundations, or institutions fund launches, campaigns, or community economics. The Sandbox serves creator-world and brand-activation use cases, while Moca Network aims to make identity, rewards, and interoperability reusable across a much wider set of consumer applications. Open Campus adds a different adjacency by linking blockchain participation to education and EduFi concepts. The common thread is that adoption still requires users to cross trust, onboarding, and UX hurdles before network effects compound. That means the adoption path matters at least as much as the nominal size of the addressable audience.",
      "claimRefs": [
        "CM007",
