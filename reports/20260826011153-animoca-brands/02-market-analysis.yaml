  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Animoca Brands operates in a large but boundary-sensitive market that spans Web3 gaming, metaverse participation, identity and loyalty infrastructure, education-linked tokenization, and ecosystem services. Public reports support a structurally attractive opportunity, but only a medium-confidence serviceable market case because top-down TAMs diverge sharply and Animoca does not publicly disclose the user or GMV cohorts needed for a bottom-up SAM."
  },
  "sections": [
    {
      "id": "market-boundary",
      "title": "What market Animoca is actually in",
      "body": "Animoca Brands is often described as a blockchain-gaming company, but that shorthand misses why market sizing gets messy so quickly. The company\u2019s retained public materials span metaverse environments like The Sandbox, identity and loyalty infrastructure through Moca Network, education-linked token economics through Open Campus, and advisory services to third-party Web3 projects. That means the practical market boundary sits somewhere between \u201cconsumer crypto\u201d and \u201cgame publishing,\u201d and it is not well represented by either category alone. The right boundary for diligence includes consumer game economies, NFT and digital-asset transactions tied to play or participation, interoperable identity and loyalty systems, and adjacent tokenized ecosystems where users, creators, brands, and communities transact. It excludes generic exchange trading, unrelated DeFi speculation, and broad crypto-market capitalization that has little to do with Animoca\u2019s product or customer workflows. This broader-but-disciplined definition is essential because otherwise the market can be made to look arbitrarily huge without improving investment decision quality.",
      "claimRefs": [
        "CM001",
        "CM002",
        "CM012",
        "CM013",
        "CM017",
        "CM018",
        "CM027",
        "CM030"
      ],
