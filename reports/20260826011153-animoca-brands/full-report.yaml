  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The competitive landscape spans more than game publishers
        blocks:
          - type: paragraph
            body: >-
              Animoca’s competitor set is wider than a simple list of game studios because the company does not compete
              on only one layer. Some rivals are consumer-facing ownership brands such as Dapper, Sorare, or Yuga; some
              are game-chain ecosystems such as Sky Mavis and Ronin; some are growth or infrastructure players such as
              Immutable; and some, like Forte, aim at compliance and token-economy tooling rather than direct player
              demand. Animoca itself sits awkwardly but usefully across several of these layers at once: it owns or
              controls major consumer assets like The Sandbox, builds identity infrastructure through Moca Network,
              operates advisory and market services, and carries a large portfolio that can amplify partner access. That
              breadth is why a narrow direct-comp set understates competitive risk. Animoca can be threatened by a
              better game platform, a stronger chain distribution loop, or a more elegant compliance-and-economics
              toolkit depending on the workflow being examined. The competitive field is therefore modular and requires
              layer-by-layer analysis rather than one headline winner-take-all narrative. No single matrix captures the
              whole fight.
            claimRefs:
