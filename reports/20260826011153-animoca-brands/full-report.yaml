  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: What market Animoca is actually in
        blocks:
          - type: paragraph
            body: >-
              Animoca Brands is often described as a blockchain-gaming company, but that shorthand misses why market
              sizing gets messy so quickly. The company’s retained public materials span metaverse environments like The
              Sandbox, identity and loyalty infrastructure through Moca Network, education-linked token economics
              through Open Campus, and advisory services to third-party Web3 projects. That means the practical market
              boundary sits somewhere between “consumer crypto” and “game publishing,” and it is not well represented by
              either category alone. The right boundary for diligence includes consumer game economies, NFT and
              digital-asset transactions tied to play or participation, interoperable identity and loyalty systems, and
              adjacent tokenized ecosystems where users, creators, brands, and communities transact. It excludes generic
              exchange trading, unrelated DeFi speculation, and broad crypto-market capitalization that has little to do
              with Animoca’s product or customer workflows. This broader-but-disciplined definition is essential because
              otherwise the market can be made to look arbitrarily huge without improving investment decision quality.
            claimRefs:
              - CM001
              - CM002
              - CM012
              - CM013
              - CM017
              - CM018
              - CM027
