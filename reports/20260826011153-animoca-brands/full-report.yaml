      - number: '1.3'
        title: Capital base, disclosed scale, and what the numbers do and do not prove
        blocks:
          - type: paragraph
            body: >-
              The clearest hard data in the public record comes from the FY2024 investor update. Animoca reported US$314
              million of bookings for the year, up from US$280 million in 2023, with the mix skewed toward digital asset
              advisory, operating businesses, and investment activity. The same update disclosed US$293 million of cash
              and stablecoins, US$538 million of digital assets, US$564 million of minority investments, and US$2.9
              billion of off-balance-sheet token reserves linked to majority-owned projects. These figures confirm that
              Animoca is not a narrative-only operator; it is running a sizeable balance sheet and a meaningful
              services-and-portfolio machine. But the disclosures also stop short of audited revenue recognition,
              segment-level margins, or a transparent bridge from bookings to enduring cash earnings. PitchBook provides
              a current employee and cumulative funding estimate, while Sacra anchors the last clearly disclosed
              valuation history. Together, they imply a late-stage company with real scale and real optionality, but
              also with disclosure limits that are material to underwriting.
