      - number: '2.4'
        title: Growth drivers are real, but regulation and UX still shape the ceiling
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Animoca’s market is straightforward: mobile usage, digital ownership, creator
              economies, interoperable assets, and Asia-centric consumer growth all provide reasons to believe that
              Web3-native game economies can keep expanding. The bearish case is equally straightforward: wallets are
              still confusing for many users, token prices remain volatile, and regulators are moving from benign
              neglect toward explicit oversight. Hong Kong’s official documents show a market that is becoming more
              institutionally credible, but also more rules-heavy. That is constructive for scaled operators and less
              forgiving for loose experimentation. For Animoca, this cuts both ways. Better-defined rules can legitimize
              tokenized identity and consumer infrastructure, but they also raise compliance costs and reduce the room
              for informal growth hacks. The central diligence gap therefore remains bottom-up serviceable demand:
              without disclosed cohorts and monetization by segment, the retained evidence can support “large market
              with multiple adjacencies” but not a precise Animoca-specific SAM.
