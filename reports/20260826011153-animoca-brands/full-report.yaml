      - number: '8.2'
        title: Public valuation anchors form a wide band rather than a point estimate
        blocks:
          - type: paragraph
            body: >-
              The retained evidence supports several important anchors, but not a single precise one. Official FY2024
              disclosure gives a meaningful operating and asset base: US$314 million of bookings, US$293 million of cash
              and stablecoins, US$538 million of digital assets, and US$564 million of minority investments. Those
              recognized asset buckets alone create a meaningful floor-like reference before any value is assigned to
              operations or option value. Historical financing anchors are much higher, with the 2021 raise, the January
              2022 valuation above US$5 billion, and Sacra’s roughly US$6 billion 2022 note-round framing. Current
              market narratives, however, sit far lower: a proposed reverse merger around US$1 billion, secondary
              indications around US$1.5 billion, and other reports with far wider dispersion. That spread is too wide
              for false precision, which is why the valuation stance has to remain explicitly uncertain. Anchors exist,
              but they should be treated as a range-building toolkit, not a single verdict.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
