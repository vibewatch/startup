      - number: '1.2'
        title: Founder visibility, operating leadership, and governance opacity
        blocks:
          - type: paragraph
            body: >-
              Public leadership visibility is strongest around Yat Siu, who is consistently identified as co-founder and
              executive chairman across partnership releases and ecosystem commentary. The founder narrative is less
              clean beyond Siu: Wikipedia still lists David Kim as a co-founder, but the retained current sources
              provide little operating detail on Kim, and public materials are sparse on board composition and committee
              oversight. Media coverage suggests a chairman-plus-operator structure, with Robby Yung appearing in
              current reporting as CEO, but this is not presented through a single authoritative current leadership
              page. CMCC’s Mocaverse thesis also underscores how much ecosystem distribution still appears to route
              through Siu’s relationships and Animoca’s network position. For diligence, that creates a familiar
              late-stage private-company tension: there is enough evidence to conclude leadership is experienced and
              deeply connected, but not enough public evidence to underwrite governance quality with public-company
              confidence.
