      - number: '7.3'
        title: Portfolio breadth helps strategy but multiplies dependency and execution risk
        blocks:
          - type: paragraph
            body: >-
              Animoca’s portfolio strategy diversifies product exposure, but it also multiplies the number of places the
              thesis can break. Identity rails, partner chains, token utilities, exchange listings, creator ecosystems,
              education-finance initiatives, and major counterparties all become dependencies. Public evidence suggests
              the company can attract strong names such as SK Planet, ANPA, Chess.com, and well-known brands through The
              Sandbox. That is strategically positive. It is also a source of execution risk because many of the best
              upside pathways require third parties to launch, integrate, renew, and comply alongside Animoca. The
              public record is thinnest on operational proof such as incident handling, uptime, internal controls, and
              vendor fallback plans. In other words, the company’s breadth lowers classic single-product risk but raises
              cross-product coordination risk, especially in a fast-moving regulatory and token-market environment.
              Coordination risk is strategic here, not merely operational or local.
            claimRefs:
