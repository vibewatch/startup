  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product definition: a federated portfolio tied together by digital ownership'
        blocks:
          - type: paragraph
            body: >-
              Animoca’s product layer is easiest to understand as a federation of applications and ecosystems connected
              by a shared digital-property-rights thesis. The FY2024 investor update names a broad set of businesses—The
              Sandbox, Moca Network, Open Campus, Anichess, GAMEE, TinyTap, and REVV-linked products among them—and
              those products clearly do not all solve the same immediate user problem. The unifying logic is instead
              user participation, ownership, rewards, and portability. The Sandbox serves play-and-create worlds, Open
              Campus serves education and EduFi, Moca Network serves identity and interoperability, while products like
              GAMEE, TinyTap, and Anichess widen the experimentation surface. That breadth matters because it means
              Animoca is not dependent on one interface or one chain, but it also means the technology narrative has to
              be assessed as a connected portfolio rather than as a single software stack. In practice, investors should
              think in terms of shared principles and user states, not one canonical app experience. The portfolio is
              product-diverse but thesis-consistent.
