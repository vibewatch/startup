        title: Milestones that matter and the adverse context investors cannot ignore
        blocks:
          - type: paragraph
            body: >-
              Several milestones are strategically meaningful because they show Animoca pressing beyond a simple “games
              plus NFTs” thesis. Mocaverse’s additional funding, the SK Planet and TON distribution pushes, and Open
              Campus’s EduFi partnership with ANPA all point toward a consumer-identity and tokenized-participation
              strategy that reaches outside gaming. At the same time, the market still remembers the 2020 ASX delisting,
              which Bitget highlights as a defining break with traditional public-market oversight. That legacy matters
              because Animoca is again exploring liquidity pathways, now through tokenized-equity concepts and
              reverse-merger style public-market planning rather than a plain-vanilla IPO. The adverse read is not that
              Animoca lacks assets or traction; the adverse read is that the company still asks investors to bridge a
              complex asset-and-ecosystem story without the governance and financial transparency a public market would
              normally demand. The company overview therefore starts from a mixed conclusion: operating breadth and
              strategic relevance are clear, but the public record remains more ecosystem-rich than disclosure-rich.
