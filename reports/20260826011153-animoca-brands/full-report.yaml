chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business perimeter, and strategic framing
        blocks:
          - type: paragraph
            body: >-
              Animoca Brands is best understood as a Hong Kong-based Web3 holding and operating platform rather than as
              a conventional game studio. PitchBook and the company’s own materials describe a private company built
              around digital property rights, tokenization, and networked consumer experiences. The FY2024 investor
              update shows that the parent now spans operating businesses, digital asset advisory, and investment
              activity, while Sacra frames the broader strategy as a hybrid of operator, investor, and IP-licensing
              platform. That matters because the company’s value is not tied to one title or one protocol: The Sandbox,
              Moca Network, Open Campus, GAMEE, TinyTap, Anichess, and REVV all sit inside a wider thesis that consumer
              attention, digital ownership, and tokenized incentives can reinforce each other across multiple verticals.
              The result is real strategic breadth, but also a narrative that can look diffuse without a disciplined
              view of what sits at the parent level versus inside subsidiaries and ecosystem projects.
