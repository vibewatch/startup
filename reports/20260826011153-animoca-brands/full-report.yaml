  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory complexity is the first-order risk
        blocks:
          - type: paragraph
            body: >-
              Animoca’s risk profile begins with regulatory breadth. The company no longer sits only in gaming or
              collectibles. It now touches identity, education finance, token markets, digital assets, and public-market
              or stablecoin ambitions. Hong Kong’s current posture is broadly supportive, but the retained official and
              legal sources make clear that support comes with tighter expectations around licensing, custody, AML,
              disclosures, and investor protection. That is good for long-term legitimacy, yet it raises the bar for
              execution immediately. The old ASX delisting still matters because it reminds investors that
              capital-markets access can disappear when governance and regulatory comfort diverge. The current
              reverse-merger path also remains conditional on approvals and audited statements. In practical terms,
              regulation is both a strategic tailwind and a gating risk that can delay liquidity, narrow product design,
              or increase operating costs. It also means management has less room for informal or lightly documented
              operating choices than in earlier crypto cycles.
