companyProfile:
  summary: >-
    Animoca Brands is a Hong Kong-headquartered private Web3 holding and operating company founded in 2014. It combines
    blockchain-gaming and digital-property-rights products such as The Sandbox, Moca Network, Open Campus, GAMEE,
    TinyTap, Anichess, and REVV-linked activities with a large investment portfolio of more than 540 companies. Public
    evidence shows meaningful 2024 activity scale, a sizable recognized asset base, and continued ecosystem funding and
    partnership momentum, but the company still under-discloses audited revenue quality, cap-table rights, and treasury
    stress behavior relative to what investors would need for precise valuation underwriting.
