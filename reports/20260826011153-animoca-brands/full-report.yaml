      - number: '2.2'
        title: Sizing lenses are directionally bullish but numerically inconsistent
        blocks:
          - type: paragraph
            body: >-
              Every retained market report says the broader category is large and growing, but they do not agree on how
              large it is because they count different revenue pools. Future Market Insights puts web3 gaming at roughly
              US$33.7 billion in 2025, while Credence Research gives a US$25.62 billion 2024 baseline and a path to
              roughly US$104 billion by 2032. Other blockchain-gaming publishers go wider still, sometimes by including
              more infrastructure, marketplace, or chain activity than a narrow game-and-digital-goods definition would
              allow. That is why a single TAM number is not analytically useful here. The better use of the data is to
              show boundary compression: broad global Web3 or blockchain-gaming opportunity at the top, then narrower
              consumer game-economy, identity, and education-adjacent layers that better resemble Animoca’s actual
              activities. Broad market estimates still matter because they show investor and operator interest, but they
              are only context. A serviceable market requires bottom-up user, wallet, and monetization data that the
              public record does not provide.
            claimRefs:
