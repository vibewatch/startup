              Public financial evidence shows meaningful resources, but it also shows why risk stays high. Animoca
              disclosed hundreds of millions in cash, digital assets, and private investments, plus a much larger
              off-balance-sheet token reserve base. That is real optionality. It is also a major valuation problem
              because accounting treatment, liquidity, and realizability differ sharply across those buckets. Public
              evidence already shows write-downs in private holdings, while external coverage keeps emphasizing the
              market discount applied to token-heavy balance sheets. Revenue diversification helps because advisory and
              investment activity reduce dependence on one game or one token. But those same businesses remain
              correlated with broader crypto cycles and risk appetite. The result is a company that may be asset-rich
              and strategically flexible, yet still hard to underwrite cleanly under stress without a far more detailed
              treasury, liquidity, and scenario package. Stress testing matters more here than in a typical software
              company because asset values and liquidity windows can move together.
            claimRefs:
