            body: >-
              The clearest financial fact in the public record is that Animoca reported FY2024 bookings of US$314
              million, up from US$280 million in 2023. That is a meaningful number and it materially improves confidence
              that the business is not simply living off a stale 2021-2022 narrative. Just as important, the mix is not
              one-dimensional. The digital asset advisory business accounted for US$165 million, Web3 operating
              businesses for US$110 million, and investment activity for US$39 million. In other words, the company is
              no longer reducible to “The Sandbox plus portfolio marks.” The Q4 2024 acceleration to US$108 million of
              bookings also suggests stronger momentum into year end. But investors still need to remember that bookings
              are not audited revenue. They are a useful scale proxy for a gaming and tokenized-economy company, yet
              they do not on their own answer whether the underlying economics are recurring, high margin, or resilient
