      - number: '5.2'
        title: Architecture and workflow look more like shared rails plus modular surfaces
        blocks:
          - type: paragraph
            body: >-
              The retained sources suggest that Animoca’s architecture should be pictured as layers rather than as one
              application. Customer-facing surfaces include worlds, games, identity experiences, and learning products.
              Beneath them sit identity rails, token utilities, chain integrations, and partner ecosystems. Moca Network
              is central here because the official update and partner sources describe it as chain-agnostic identity
              infrastructure, while Open Campus’s EDU Chain shows that the company’s scope increasingly reaches protocol
              layers as well. The Sandbox’s creation and experiences pages make clear that creator tooling is part of
              the product, not a mere accessory. This layered picture is coherent enough to justify a platform reading,
              but it is still a federation: partner chains, external wallets, and ecosystem integrations do substantial
              work that a vertically integrated software company might own directly. That has consequences for speed,
              control, and failure modes. It can accelerate shipping, but it also means governance and integration
              matter as much as raw code quality.
