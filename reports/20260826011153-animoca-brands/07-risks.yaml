      ]
    },
    {
      "id": "mitigations-and-kill-criteria",
      "title": "Mitigations exist, but they are not enough to move the risk rating below high",
      "body": "There are visible mitigations. The company ended 2024 with meaningful liquid resources, multiple revenue streams, and an explicit effort to improve reporting through an auditor change and more formal capital-markets planning. It is also leaning into regulated pathways instead of avoiding them entirely. Those facts matter. Still, they do not fully close the underwriting gap because the deepest questions remain private: treasury policy, cap-table rights, stress resilience, incident history, and property-level unit economics. Investors therefore need monitorable kill criteria. If the liquidity path stalls, if token-value volatility materially erodes balance-sheet flexibility, or if flagship-user activity fails to convert into durable cash generation, the current strategic upside narrative weakens quickly. That is why the proper conclusion is not that Animoca is broken. It is that the public-risk picture remains investable to study, but high-risk to underwrite without further diligence. More disclosure could improve the rating faster than more narrative alone in committee discussions materially.",
