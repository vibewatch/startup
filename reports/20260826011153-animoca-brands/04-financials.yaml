    {
      "id": "capital-base-and-financing-history",
      "title": "The capital base is large, but asset quality matters as much as asset size",
      "body": "Animoca\u2019s disclosed balance-sheet resources are substantial: US$293 million of cash and stablecoins, US$538 million of digital assets, US$564 million of minority investments, and US$2.9 billion of off-balance-sheet token reserves at end-2024. Those numbers argue against an immediate liquidity crunch and explain why the company still has strategic option value even after the wider crypto cycle reset. Historical fundraising reinforces that point. The 2021 capital raise, the January 2022 funding at more than US$5 billion valuation, and the later 2022 note round all show that Animoca could attract large pools of capital when market sentiment was favorable. Today, however, the underwriting question is not whether assets exist. It is how liquid, restricted, and durable they are. Cash is cash; locked tokens, project reserves, and private minority holdings are very different instruments. That distinction makes capital adequacy look comfortable on the surface but more conditional under stress.",
