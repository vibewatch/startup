    {
      "id": "cost-structure-and-monetization",
      "title": "Cost discipline improved, but unit economics remain mostly private",
      "body": "On the cost side, Animoca\u2019s FY2024 disclosure is directionally encouraging. Adjusted operating expenses fell to US$217 million, down 12% year over year, and Q4 expenses also declined. Management attributes that to optimization work and AI-enabled efficiency, which at least suggests that the company is no longer managing purely for top-line expansion. Yet the public record still lacks the unit-economic primitives that matter most for late-stage underwriting. There is no clean CAC, payback, ARR, NRR, or segment gross-margin disclosure. Monetization can be observed qualitatively\u2014The Sandbox depends largely on SAND and NFT sales, Open Campus and Moca-related products lean on tokenized participation and ecosystem incentives, and advisory revenues come from tokenomics, market support, and treasury services\u2014but these do not yet roll up into a transparent margin model. The result is a business that looks economically active and increasingly diversified, but not economically legible enough for precision underwriting.",
