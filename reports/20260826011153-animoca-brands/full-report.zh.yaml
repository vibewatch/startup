      - number: '1.3'
        title: 资本基础、披露规模，以及数字能证明和不能证明的部分
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清晰的硬数据来自 2024 财年投资者更新。Animoca 报告全年订单额 US$314 million，高于 2023 年的 US$280
              million，结构偏向数字资产咨询、运营业务和投资活动。同一份更新披露，公司持有 US$293 million 现金和稳定币、US$538 million 数字资产、US$564 million
              少数股权投资，以及 US$2.9 billion 与控股项目相关的表外代币储备。这些数字确认，Animoca
              不是只靠叙事撑着的运营商；它在运转一张规模不小的资产负债表，也在经营一台有分量的服务加投资组合机器。但披露仍止步于经审计收入确认、分部利润率，以及从订单额通往持久现金收益的透明桥梁。PitchBook
              给出现有员工数和累计融资估计，Sacra 则锚定最后一个清楚披露的估值历史。合在一起，它们指向一家具有真实规模和真实可选性的后期公司；但披露边界本身，对承销很关键。
