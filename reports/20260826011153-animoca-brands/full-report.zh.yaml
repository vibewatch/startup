    summary: 典型的 Animoca 工作流先把用户从发现导入身份、参与，再沉淀为可复用的所有权或奖励状态。
    data:
      nodes:
        - id: discover
          label: 发现产品触点
          detail: 用户进入一个世界、游戏、教育或身份关联体验
        - id: onboard
          label: 创建账户或身份
          detail: 用户连接钱包、身份或参与凭证
        - id: participate
          label: 玩 / 学 / 创作 / 互动
          detail: 核心动作取决于具体产品触点
        - id: own
          label: 拥有或赚取数字状态
          detail: 用户获得资产、积分、身份状态或奖励
        - id: expand
          label: 在其他场景复用身份或社区状态
          detail: 跨产品或跨合作伙伴互操作变得可能
      edges:
        - from: discover
          to: onboard
        - from: onboard
          to: participate
        - from: participate
          to: own
        - from: own
          to: expand
    claimRefs:
