  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管复杂性是一阶风险
        blocks:
          - type: paragraph
            body: >-
              Animoca
              的风险画像从监管广度开始。公司已经不只在游戏或收藏品里活动；它现在触及身份、教育金融、代币市场、数字资产，以及公开市场或稳定币野心。香港当前姿态总体支持创新，但保留的官方和法律来源清楚表明，这种支持伴随更高的牌照、托管、AML、披露和投资者保护预期。这有利于长期合法性，却会立刻抬高执行门槛。旧的
              ASX
              摘牌仍重要，因为它提醒投资者，当治理和监管舒适度分叉时，资本市场通道可能消失。当前反向合并路径也仍取决于审批和经审计报表。实际看，监管既是战略顺风，也是闸门风险，可能拖慢流动性、收窄产品设计，或增加运营成本。它还意味着，管理层相比早期加密周期，已经没有那么多空间作出非正式或轻文档化的运营选择。
