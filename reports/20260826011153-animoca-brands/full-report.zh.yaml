        title: 创始人能见度、运营领导层与治理不透明
        blocks:
          - type: paragraph
            body: >-
              公开领导层能见度最集中在 Yat Siu 身上。无论是合作公告还是生态评论，他都持续被标识为联合创始人兼执行主席。Siu 之外，创始人叙事没有那么干净：Wikipedia 仍将 David Kim
              列为联合创始人，但保留的当前来源几乎没有 Kim 的运营细节，公开材料对董事会构成和委员会监督也披露稀少。媒体报道指向一种主席加运营团队的结构，Robby Yung 在当前报道中以 CEO
              身份出现，但这些信息并没有汇集在单一权威的现任领导层页面上。CMCC 关于 Mocaverse 的投资逻辑也凸显，生态分发仍很大程度上依赖 Siu 的关系和 Animoca
              的网络位置。尽调层面看到的是典型后期私营公司张力：证据足以判断领导层经验丰富且连接很深，但还不足以用上市公司级别信心承销治理质量。
