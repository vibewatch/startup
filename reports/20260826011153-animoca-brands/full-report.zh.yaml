chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、业务边界与战略框架
        blocks:
          - type: paragraph
            body: >-
              理解 Animoca Brands，最好把它看作一家位于香港的 Web3 控股与运营平台，而不是传统游戏工作室。PitchBook
              和公司自有材料都把它描述为围绕数字产权、代币化和网络化消费体验搭建的私营公司。2024 财年投资者更新显示，母公司如今覆盖运营业务、数字资产咨询和投资活动；Sacra 则把更大的战略概括为运营商、投资者与 IP
              授权平台的混合体。关键就在这里：公司价值不绑在某一款游戏或某一个协议上。The Sandbox、Moca Network、Open Campus、GAMEE、TinyTap、Anichess 和 REVV
              都被放进同一套更大的逻辑里——消费者注意力、数字所有权和代币化激励可以在多个垂直领域相互强化。结果是战略宽度真实存在，但如果不严谨区分母公司层面、子公司层面和生态项目层面，叙事也会显得分散。
