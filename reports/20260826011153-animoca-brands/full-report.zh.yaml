            body: >-
              成本端，Animoca 的 2024 财年披露方向上令人鼓舞。调整后运营费用降至 US$217 million，同比下降 12%，第四季度费用也下降。管理层将其归因于优化工作和 AI
              赋能效率，至少说明公司不再纯粹按收入扩张来管理。然而，公开记录仍缺少后期承销最关键的单位经济基础指标。没有干净的 CAC、回本周期、ARR、NRR 或分部毛利率披露。变现可以做定性观察——The Sandbox
              主要依靠 SAND 和 NFT 销售，Open Campus 与 Moca
              相关产品依赖代币化参与和生态激励，咨询收入来自代币经济、市场支持和财资服务——但这些还没有汇总成透明的利润率模型。结果是，公司看起来经济活动真实且日益多元，但经济可读性还不足以支撑精确承销。
