      - number: '1.4'
        title: 真正重要的里程碑，以及投资者不能忽视的反向背景
        blocks:
          - type: paragraph
            body: >-
              几个里程碑在战略上有意义，因为它们显示 Animoca 正在超越简单的“游戏加 NFT”逻辑。Mocaverse 的追加融资、SK Planet 与 TON 的分发推进，以及 Open Campus 与 ANPA
              的 EduFi 合作，都指向一种伸出游戏之外的消费者身份和代币化参与战略。与此同时，市场仍记得 2020 年 ASX 摘牌；Bitget 把那次事件视为公司与传统公开市场监督断裂的标志。这个历史包袱仍然重要，因为
              Animoca 又在探索流动性路径，只是这次更偏向代币化股权概念和反向合并式的公开市场规划，而不是普通 IPO。反向解读不是 Animoca
              缺资产或缺牵引力；反向解读是，公司仍要求投资者在没有公开市场通常要求的治理和财务透明度时，自行拼接复杂的资产加生态故事。因此，公司概况从一个混合结论出发：运营广度和战略相关性清楚，但公开记录仍是生态信息丰富、披露信息不足。
