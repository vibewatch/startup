      - number: '8.3'
        title: 情景分析比单一公允价值数字更可信
        blocks:
          - type: paragraph
            body: >-
              情景框架更合适，因为估值取决于少数几个可能大幅摆动的变量。悲观情景下，投资人保守计量已确认资产，只给运营较低价值，并因流动性和治理仍不清晰而大幅折价代币储备。基准情景下，预订额保持韧性，已确认资产守住价值，生态选择权中有一部分值得计入，但不能过于激进。乐观情景下，公开市场流动性改善，代币市场走强，Moca
              Network、Open Campus、The Sandbox
              等旗舰生态的变现能力超过当前披露所能证明的水平。上述情景没有一个荒谬。问题在于，公开证据还无法告诉我们哪一种应占主导概率。因此，本章使用区间和概率信号，而不是假装一个科目就能终结争论。区间越宽，入场纪律越重要。概率上的谦逊本身就是这里的方法。
