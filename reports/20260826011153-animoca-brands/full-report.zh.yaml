            body: 如果期待一个整齐单一的 TAM，Animoca 的机会集会显得不连贯。把它拆成玩家拥有的世界、身份和忠诚度轨道、教育相邻代币化，以及面向其他生态的咨询服务之后，图景会更清楚。
