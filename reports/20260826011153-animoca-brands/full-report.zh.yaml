      - number: '2.4'
        title: 增长驱动因素真实存在，但监管和 UX 仍决定天花板
        blocks:
          - type: paragraph
            body: >-
              Animoca 市场的乐观情景很直接：移动使用、数字所有权、创作者经济、可互操作资产，以及以亚洲为中心的消费者增长，都支持 Web3
              原生游戏经济继续扩张的判断。悲观情景也同样直接：许多用户仍觉得钱包难用，代币价格仍然波动，监管者正从温和忽视转向明确监督。香港官方文件显示，这个市场正在变得更具机构可信度，但规则也更重。这有利于规模化运营商，却更不宽容松散试验。Animoca
              面临双向影响：更清晰的规则可以让代币化身份和消费者基础设施获得合法性，但也会抬高合规成本，压缩非正式增长技巧的空间。因此，核心证据缺口仍是自下而上的可服务需求：没有披露按分部划分的队列和变现数据，保留证据能支持“拥有多个相邻市场的大市场”，但无法支持精准的
              Animoca 专属 SAM。
