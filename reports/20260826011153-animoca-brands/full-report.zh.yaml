  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 流动性路径改善、代币环境转强，旗舰生态在更好披露下实现变现。
        - 在给更高期权价值权重、对韧性预订额使用更高倍数下，估值为 $4.0B-$5.5B。
        - 仍暴露在监管、代币波动和股权结构表不确定性下。
        - 有可能，但需要几个目前尚未证实的变量同时走对。
      - - 基准
        - 预订额保持韧性，已确认资产保住价值，部分生态期权价值真实存在，但披露仍不完整。
        - $2.0B-$3.0B，采用资产加运营的混合方法，并给适度期权价值权重。
        - 流动性和权利不确定性限制上行。
        - 最符合目前公开证据。
      - - 悲观
        - 流动性计划停滞，资产按保守口径计价，代币储备只按大幅折扣计值。
        - $1.0B-$1.5B，以已确认资产为主要支撑，经营业务只给有限价值。
        - 如果现金生成不及预期或市场重估山寨币敞口，情况还可能更差。
        - 宏观或加密情绪转弱时，这一情景就有现实性。
