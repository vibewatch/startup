        title: 资本基础很大，但资产质量和资产规模同样重要
        blocks:
          - type: paragraph
            body: >-
              Animoca 披露的资产负债表资源相当可观：截至 2024 年末，现金和稳定币 US$293 million、数字资产 US$538 million、少数股权投资 US$564 million，以及表外代币储备
              US$2.9 billion。这些数字反驳了即刻流动性危机的判断，也解释了为什么更广泛的加密周期重置之后，公司仍有战略可选性。历史融资也强化了这一点。2021 年融资、2022 年 1 月以超过 US$5
              billion 估值融资，以及 2022 年后续票据轮，都显示市场情绪有利时，Animoca
              能吸引大规模资本。但今天的承销问题不是有没有资产，而是这些资产有多流动、受限多大、耐久性如何。现金就是现金；锁定代币、项目储备和私营少数股权是非常不同的工具。这个区别让资本充足性表面看起来舒服，但压力下会更有条件。
