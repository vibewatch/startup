      - number: '8.4'
        title: 建议应维持为继续研究
        blocks:
          - type: paragraph
            body: >-
              最终建议为继续研究，信心中等，风险评级高，估值立场未知。该结论不是把看空包装成中性，而是判断缺失证据仍直接决定经济性。投资人仍需要股权结构瀑布表、资金库压力测试、近期经验证的老股交易价格，以及业务资产层面的现金生成指标，才能判断
              Animoca 只是有意思、价格合理，还是确实便宜。如果有经验证且足够折价的入场价格，或者披露显著改善，买入才可能成立。在此之前，正确做法是密切跟踪，并在流动性计划、审计报表或业务单元 KPI
              披露改善时更新研究。简言之，Animoca 的分量大到不能忽视，但披露仍不足以支撑激进定价。建议保持谨慎，因为价格能见度落后于公司能见度。更好的证据能比更会讲故事或单靠乐观情绪更快、也更实质性地改变结论。
