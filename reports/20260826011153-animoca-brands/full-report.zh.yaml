  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Animoca 实际所在的市场
        blocks:
          - type: paragraph
            body: >-
              Animoca Brands 常被描述为区块链游戏公司，但这个简称解释不了为什么市场规模会很快变得混乱。公司保留的公开材料横跨 The Sandbox 这类元宇宙环境、Moca Network
              提供的身份与忠诚度基础设施、Open Campus 的教育相关代币经济，以及面向第三方 Web3
              项目的咨询服务。也就是说，实际市场边界落在“消费者加密”和“游戏发行”之间，单独用任一类别都无法很好代表。尽调更合适的边界应包括消费游戏经济、与游玩或参与相关的 NFT
              和数字资产交易、可互操作的身份与忠诚度系统，以及用户、创作者、品牌和社区发生交易的相邻代币化生态。它不包括普通交易所交易、无关 DeFi 投机，以及与 Animoca
              产品或客户工作流关系不大的广义加密市场市值。这个更宽但有纪律的定义很必要，否则市场可以被任意做大，却并不会提高投资决策质量。
