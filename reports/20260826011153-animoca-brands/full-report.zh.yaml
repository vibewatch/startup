  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 公开规模真实存在，但收入线更像活动量口径，而不是审计干净口径
        blocks:
          - type: paragraph
            body: >-
              公开记录中最清晰的财务事实，是 Animoca 报告 2024 财年订单额 US$314 million，高于 2023 年的 US$280
              million。这个数字有分量，也明显增强了这样一种信心：公司并不只是靠 2021-2022 年的旧叙事活着。同样重要的是，收入结构不是单一维度。数字资产咨询业务贡献 US$165 million，Web3
              运营业务贡献 US$110 million，投资活动贡献 US$39 million。换句话说，公司已经不能再被简化为“The Sandbox 加投资组合估值标记”。2024 年第四季度订单额加速到 US$108
              million，也说明年底动能更强。但投资者仍要记住，订单额不是经审计收入。放在游戏和代币化经济公司语境下，订单额是有用的规模代理指标；但它本身回答不了底层经济是否经常性、是否高利润率、是否能穿越加密周期。这个区别决定本章其余部分。
