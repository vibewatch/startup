      - number: '5.2'
        title: 架构和工作流更像共享轨道加模块化表面
        blocks:
          - type: paragraph
            body: >-
              保留来源显示，Animoca 的架构应按层来理解，而不是按一个应用来理解。面向客户的表面包括世界、游戏、身份体验和学习产品。底层则是身份轨道、代币用途、链集成和伙伴生态。Moca Network
              是这里的核心，因为官方更新和伙伴来源都把它描述为链无关的身份基础设施；Open Campus 的 EDU Chain 也显示，公司范围正越来越触及协议层。The Sandbox
              的创作和体验页面清楚表明，创作者工具是产品的一部分，而不是附属品。这种分层图景足够连贯，可以支持平台式解读，但它仍是一个联合体：伙伴链、外部钱包和生态集成承担了大量工作，而纵向一体化软件公司可能会把这些直接握在自己手里。这会影响速度、控制和失效模式。它能加快上线，但也意味着治理和集成与原始代码质量同样重要。
