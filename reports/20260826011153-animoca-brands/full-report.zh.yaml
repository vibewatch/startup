            body: >-
              好消息是，相比许多私营 Web3 公司，Animoca 有更多公开采用证据。The Sandbox 发布了具体的 Alpha Season 4 使用快照：超过 580,000 名独立玩家、超过 3,900
              万个任务、超过 100 万小时游戏时长。Moca Network 和 Open Campus 都公布了有分量的身份和钱包数量。GAMEE 披露了注册用户、游戏会话、钱包入门和广告规模数据。Anichess
              披露了公开测试时间和月活玩家。合在一起，这些指标让人很难说 Animoca
              只是一只概念股。但证据并不均衡。大多数指标存在于产品特定更新里，许多偏漏斗顶端或活动导向，很少能干净连接到付款方质量或重复变现。结果是真实采用证据存在，但耐久性能见度只有中等。这种组合支持关注和跟踪，但并不消除私人队列分析或可比
              KPI 定义的必要性。
