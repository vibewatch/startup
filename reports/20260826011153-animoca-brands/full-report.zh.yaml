      - number: '8.2'
        title: 公开估值锚点给出的是宽区间，不是点估计
        blocks:
          - type: paragraph
            body: >-
              保留证据支持几个重要锚点，但支撑不了单一精确数。官方 FY2024 披露给出有分量的运营和资产基础：US$314 million 预订额、US$293 million 现金和稳定币、US$538 million
              数字资产，以及 US$564 million 少数股权投资。仅这些已确认资产科目，在尚未给运营和期权价值定价前，就已经构成有意义的类底线参照。历史融资锚点高得多，包括 2021 年融资、2022 年 1 月超过
              US$5 billion 的估值，以及 Sacra 对 2022 年票据轮约 US$6 billion 的框架。当前市场叙事低得多：拟议的约 US$1 billion 反向并购、约 US$1.5 billion
              老股交易指征，以及离散度更大的其他报道。区间太宽，不能假装精确，因此估值立场必须明确保持不确定。锚点存在，但应当作为搭建区间的工具箱，而不是单一裁决。
