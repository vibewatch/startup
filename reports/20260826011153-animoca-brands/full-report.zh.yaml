  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公司质量逻辑成立，但价格逻辑仍不完整
        blocks:
          - type: paragraph
            body: >-
              Animoca 的估值判断先要拆开公司质量和价格确定性。公司质量逻辑更容易站得住：公开证据显示，公司已有相当规模，运营和投资版图很宽，有真实旗舰产品，资产负债表也比许多只讲叙事的 Web3
              同行更好。反向逻辑同样强：它既不是标准软件供应商，也不是单纯游戏发行商，很难干净估值。收入质量披露为预订额（bookings），而不是经审计的 GAAP
              式收入明细；资产价值混合现金、数字资产、私人投资和大额表外储备；公开的当前价格信号又严重冲突。也就是说，投资人可以相信 Animoca
              有战略分量，同时仍拒绝为当前精确估值背书。因此，正确框架是把战略吸引力和入场价格信心分开。上述区分是建议在大量战略实质之外仍保持谨慎的核心原因。
