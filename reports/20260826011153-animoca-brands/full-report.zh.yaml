  - id: TV005
    title: 投资逻辑破裂与终止触发表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 流动性路径失败
        - 反向并购停滞，或没有可信替代窗口出现
        - 削弱变现私人价值的主要路径
        - 建议维持继续研究，并下调任何估值置信度
      - - 资产价值减值
        - 已确认资产或关键代币挂钩价值急剧下跌，且没有现金生成对冲
        - 压缩下行支撑，收窄战略灵活性
        - 把情景区间重切向悲观情景
      - - 披露停滞
        - 融资决策前，财务披露没有经审计或审阅的升级
        - 让投资人无法区分合理与便宜
        - 不要上调到继续研究之上
      - - 旗舰项目变现失手
        - 高用户活跃度仍不能证明持久付费经济性
        - 削弱主要资产的期权价值权重
        - 降低基准和乐观情景概率
    notes: 这些触发因素聚焦会快速改变估值的事项，不覆盖所有可能风险。
    claimRefs:
      - CV017
      - CV018
      - CV030
      - CV036
      - CV038
      - CV039
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表与权利
        - 优先股堆叠、清算瀑布、员工稀释和公司间持股
        - 一旦权利看清，价格支撑可能显著变化
        - 管理层 CFO 包、法律顾问和已签署融资文件
      - - 资金库与流动性
        - 压力测试、锁定期安排、已实现资产出售和资金库政策
        - 资产重的估值只有在流动性真实时才有用
        - CFO、资金库负责人和董事会风险材料
      - - 经审计经营经济性
        - 收入确认、利润率、现金流、按业务线划分的付费转化和留存
        - 预订额和用户数不足以支撑高置信度投资判断
        - 经审计财务包加业务单元仪表盘
      - - 市场定价
        - 经核验的老股交易和银行家估值
        - 目前公开估值信号分歧太大
        - 老股经纪数据室和顾问材料
      - - 流动性计划
        - 董事会排序后的方案：反向并购、代币化、老股交易或战略退出
        - 可变现价值取决于哪条路径被真正优先推进
        - 董事会和银行家材料
    notes: 这些问题按影响建议、置信度或估值立场的直接程度排序。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV038
