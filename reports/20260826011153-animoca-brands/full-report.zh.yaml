          - type: paragraph
            body: >-
              最容易理解 Animoca 产品层的方式，是把它看成一组由共同数字产权逻辑连接起来的应用和生态联合体。2024 财年投资者更新点名了一大批业务——The Sandbox、Moca Network、Open
              Campus、Anichess、GAMEE、TinyTap 和 REVV 相关产品都在其中——这些产品显然并不解决同一个即时用户问题。统一逻辑反而是用户参与、所有权、奖励和可迁移性。The Sandbox
              服务游玩与创作世界，Open Campus 服务教育和 EduFi，Moca Network 服务身份和互操作性，GAMEE、TinyTap、Anichess 等产品则拓宽试验面。这种广度很重要，因为它意味着
              Animoca 不依赖单一界面或单一链；但也意味着，技术叙事必须按连接型组合来评估，而不是当作单一软件栈。实际承销中，投资者应思考共享原则和用户状态，而不是某个标准应用体验。组合在产品上多元，但投资逻辑一致。
