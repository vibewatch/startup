        title: Animoca 服务的是多边客户图谱，而不是单一买家类型
        blocks:
          - type: paragraph
            body: >-
              Animoca 的客户章节，最好理解为一张由用户和对手方构成的图谱，而不是整齐的 B2B 或 B2C 分类。消费者侧包括 The Sandbox、GAMEE、Anichess
              和其他产品中的玩家、创作者、收藏者和社区成员。教育侧通过 TinyTap 和 Open Campus 加入教师、学习者和机构。基础设施侧通过 Moca Network 和 GAMEE AdNetwork
              加入身份用户、伙伴生态、广告主和代币利益一致的参与者。最后，ANPA 这类有名有姓的机构对手方，以及 SK Planet
              这类分发伙伴也很重要，因为它们能帮助把产品表面转化为资本流或用户入门。这对尽调重要，因为正确的集中度视角不是前十大客户，而是旗舰产品依赖、生态依赖，以及用户和付款方定义是否稳定到足以跨组合比较。它也意味着，同一个人可能在不同表面上同时是玩家、钱包持有人、社区成员和付款方。
