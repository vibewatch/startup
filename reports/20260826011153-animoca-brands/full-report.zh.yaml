  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图不止游戏发行商
        blocks:
          - type: paragraph
            body: >-
              Animoca 的竞争对手范围比一串游戏工作室名单更宽，因为公司并不只在一个层面竞争。有些对手是面向消费者的所有权品牌，如 Dapper、Sorare 或 Yuga；有些是游戏链生态，如 Sky Mavis 和
              Ronin；有些是增长或基础设施玩家，如 Immutable；还有一些像 Forte，瞄准的是合规和代币经济工具，而不是直接玩家需求。Animoca 自身尴尬但有用地横跨其中多个层面：它拥有或控制 The
              Sandbox 这类主要消费者资产，通过 Moca Network
              构建身份基础设施，运营咨询和市场服务，并持有一个可以放大伙伴接入的大型投资组合。这种广度解释了为什么狭义直接可比公司集合会低估竞争风险。取决于所看的工作流，Animoca
              可能受到更好游戏平台、更强链分发循环，或更优雅的合规加经济工具包威胁。因此，竞争场是模块化的，需要逐层分析，而不是一个头部赢家通吃的叙事。没有任何单一矩阵能覆盖整场竞争。
