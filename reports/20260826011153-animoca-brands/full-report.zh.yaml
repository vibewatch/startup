      - number: '2.3'
        title: 买家、用户和付款方比“玩家”这个标签更复杂
        blocks:
          - type: paragraph
            body: >-
              Animoca 的市场由多类参与者共同塑造。终端用户包括休闲玩家、深度收藏者、创作者、DAO
              或社区成员，以及可能根本不把自己视为加密原生用户的忠诚度计划参与者。付款方同样多元。在一些产品里，自费消费者购买土地、NFT、通行证或代币；在另一些产品里，工作室、品牌、生态基金会或机构为发布、活动或社区经济买单。The
              Sandbox 服务创作者世界和品牌激活场景，Moca Network 则想让身份、奖励和互操作性在更广泛的消费者应用中复用。Open Campus 通过把区块链参与与教育、EduFi
              概念连接起来，又增加了一个不同的相邻市场。共同点在于，网络效应复利之前，用户仍要跨过信任、入门和 UX 门槛。这意味着采用路径至少和名义上的可触达受众规模一样重要。
