companyProfile:
  summary: >-
    Animoca Brands 是一家总部位于香港的私营 Web3 控股兼运营公司，成立于 2014 年。公司把 The Sandbox、Moca Network、Open Campus、GAMEE、TinyTap、Anichess
    和 REVV 相关业务等区块链游戏与数字产权产品，再加上一个超过 540 家公司的大型投资组合放在一起运营。公开证据显示，2024
    年活动规模可观、已确认资产基础较大，生态融资和合作势头仍在延续；但相对于投资者做精确估值承销所需的信息，公司对经审计收入质量、股权结构权利和财资压力下行为披露仍不足。
  foundedDate: '2014-01-01'
  founders:
    - name: Yat Siu
      role: 联合创始人兼执行主席
      background: Animoca Brands 的公众门面，也是保留来源集中证据最充分的创始人兼运营者。
      claimRefs:
