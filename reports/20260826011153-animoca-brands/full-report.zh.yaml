      - number: '2.2'
        title: 市场规模视角方向偏乐观，但数字彼此不一致
        blocks:
          - type: paragraph
            body: >-
              所有保留的市场报告都说大类市场规模大且在增长，但它们对到底有多大并不一致，因为各自纳入的收入池不同。Future Market Insights 估算 2025 年 Web3 游戏约 US$33.7
              billion；Credence Research 给出的 2024 年基线为 US$25.62 billion，并认为到 2032 年可达约 US$104
              billion。其他区块链游戏出版方口径更宽，有时纳入的基础设施、市场或公链活动，已经超出狭义游戏加数字商品定义能承受的范围。因此，单一 TAM 数字在这里分析价值不高。更好的用法是展示边界压缩：顶层是宽泛的全球
              Web3 或区块链游戏机会，然后往下收窄到更接近 Animoca
              实际活动的消费者游戏经济、身份和教育相邻层。广义市场估计仍有意义，因为它们显示投资者和运营者兴趣，但也仅是背景。真正可服务的市场需要自下而上的用户、钱包和变现数据，而公开记录没有提供。
