              公开财务证据显示资源有分量，但也解释了为什么风险仍高。Animoca
              披露了数亿美元现金、数字资产和私营投资，另有规模更大的表外代币储备基础。这是真实可选性，也是重大估值问题，因为这些资产类别的会计处理、流动性和可兑现性差异很大。公开证据已经显示私营持股减记，而外部报道持续强调市场对代币重资产负债表施加的折价。收入多元化有帮助，因为咨询和投资活动降低了对单一游戏或单一代币的依赖。但这些业务本身仍与更广泛的加密周期和风险偏好相关。结果是，公司可能资产丰富、战略灵活，但在没有更详细财资、流动性和情景包的情况下，压力下仍难以干净承销。这里的压力测试比典型软件公司更重要，因为资产价值和流动性窗口可能同步移动。
