evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: A current board roster, committee map, and investor-rights summary for the parent company.
    whyItMatters: >-
      Leadership concentration cannot be judged cleanly without knowing who actually governs capital allocation and
      oversight.
    diligencePath: Request the current board deck, cap-table rights summary, and governance committee list from management.
    relatedQuestionRefs:
      - QO009
      - QO025
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited GAAP revenue, segment margins, and reconciliation from bookings to recognized revenue.
    whyItMatters: >-
      Bookings are useful but do not by themselves prove recurring revenue quality, margin structure, or cash
      conversion.
    diligencePath: >-
      Request audited financial statements plus segment reporting that reconciles bookings, revenue, and token-related
      balances.
    relatedQuestionRefs:
      - QO024
      - QO025
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A definitive management-certified total capital raised figure that separates parent rounds from project-level
      financing.
    whyItMatters: >-
      PitchBook-style totals and ecosystem funding headlines can otherwise overstate or understate true parent-company
      financing.
    diligencePath: >-
      Request a round-by-round financing schedule for the parent and a separate appendix for subsidiary and token
      financings.
    relatedQuestionRefs:
      - QO011
      - QO017
    relatedTableRefs:
      - TO003
      - TO004
  - type: stale
    severity: minor
    topic: leadership
    missingEvidence: Current leadership page that clearly identifies CEO, president, board members, and operational scope.
    whyItMatters: >-
      Public operating titles are fragmented across media and project pages, which weakens confidence in org-chart
      clarity.
    diligencePath: >-
      Request a current leadership org chart and compare it against subsidiary governance and project-level executive
      roles.
    relatedQuestionRefs:
      - QO007
      - QO010
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: A management-approved bridge from broad Web3 gaming TAM to Animoca’s serviceable market by segment.
    whyItMatters: Headline TAM numbers vary too much to use directly in valuation or planning.
    diligencePath: Request management segmentation by gaming, identity, education, advisory, and geography.
    relatedQuestionRefs:
      - QM005
      - QM022
      - QM024
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer cohorts
    missingEvidence: Disclosed wallet, payer, or GMV cohorts for The Sandbox, Moca ID, Open Campus, and advisory customers.
    whyItMatters: Without cohort data, public TAM can only be converted into conjectural SAM assumptions.
    diligencePath: Request monthly active users, transacting users, and spend per active user by major asset line.
    relatedQuestionRefs:
      - QM007
      - QM008
      - QM024
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: market sentiment
    missingEvidence: A current sector report quantifying post-2024 NFT and token demand by consumer cohort.
    whyItMatters: Sector health still swings with crypto cycles, and broad blog summaries are not enough for underwriting retention.
    diligencePath: Refresh DappRadar-style and analyst activity sources immediately before any investment committee decision.
    relatedQuestionRefs:
      - QM020
  - type: private-evidence-only
    severity: minor
    topic: education adjacency
    missingEvidence: Conversion and monetization data for Open Campus and EduFi users.
    whyItMatters: >-
      Education adjacency may enlarge the market, but it could also remain strategically interesting and economically
      small.
    diligencePath: Request Open Campus cohort and monetization metrics by learner, institution, and token-holder type.
    relatedQuestionRefs:
      - QM013
      - QM021
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Posted or management-shared pricing and take-rate detail for Animoca’s major products and services.
    whyItMatters: >-
      Competitive comparisons on packaging and willingness to pay are shallow when most monetization is token- or
      marketplace-driven.
    diligencePath: Request pricing decks, take-rate schedules, and monetization logic by product line.
    relatedQuestionRefs:
      - QP012
      - QP023
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive metrics
    missingEvidence: Like-for-like user, GMV, revenue, and retention metrics across direct peers.
    whyItMatters: Official homepages show positioning, but they do not allow true market-share or efficiency comparison.
    diligencePath: Build a comp set from private data rooms, chain analytics, and management-supplied operating KPIs.
    relatedQuestionRefs:
      - QP010
      - QP011
      - QP025
    relatedTableRefs:
      - TP001
  - type: conflicting-data
    severity: minor
    topic: public claims
