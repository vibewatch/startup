    {
      "id": "recommendation",
      "title": "The recommendation should stay at research-more",
      "body": "The final recommendation is research-more, with medium confidence, a high risk rating, and an unknown valuation stance. That call is not a disguised negative view on the company. It is a judgment that the missing evidence is still economically decisive. Investors still need a cap-table waterfall, treasury stress tests, recent validated secondary marks, and property-level cash-generation metrics before they can determine whether Animoca is merely interesting, fairly priced, or actually cheap. A buy could become possible at a sufficiently discounted validated entry price or after materially better disclosure. Until then, the right behavior is to track the company closely and refresh the work whenever liquidity plans, audited statements, or business-unit KPI disclosures improve. In short, Animoca looks too substantial to ignore, but still too under-disclosed to price aggressively. The recommendation is cautious because price visibility lags company visibility. Better evidence could move the call faster than better storytelling or optimism alone materially.",
