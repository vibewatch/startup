    {
      "id": "scenario-framing",
      "title": "Scenario analysis is more credible than a single fair-value number",
      "body": "Scenario framing is the right method because the valuation depends on a few variables that can move dramatically. In the bear case, investors value recognized assets conservatively, apply only modest value to operations, and heavily discount token reserves because liquidity and governance remain unclear. In the base case, bookings remain resilient, recognized assets hold their value, and a meaningful but not heroic portion of ecosystem optionality deserves credit. In the bull case, public-market liquidity improves, token-market conditions strengthen, and flagship ecosystems such as Moca Network, Open Campus, and The Sandbox monetize more effectively than current disclosures can prove. None of those scenarios is absurd. The problem is that public evidence cannot yet tell us which one deserves dominant probability. That is why the chapter uses ranges and probability signals instead of pretending one line item can settle the debate. The wider the band, the more important entry discipline becomes. Probability humility is part of the method here.",
