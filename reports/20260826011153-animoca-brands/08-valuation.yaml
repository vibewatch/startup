  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Animoca\u2019s public evidence supports a strong strategic company-quality case and a very wide current value range, but not a high-precision price call. The right outcome is research-more: medium confidence, high risk, and an explicitly unknown valuation stance until cap-table, treasury, and audited operating evidence improve."
  },
  "sections": [
    {
      "id": "thesis-and-anti-thesis",
      "title": "The company-quality thesis is real, but the price thesis is still incomplete",
      "body": "Animoca\u2019s valuation chapter starts with a split between company quality and price certainty. The company-quality thesis is easier to support: public evidence shows meaningful scale, a broad operating and investment footprint, real flagship products, and a better balance sheet than many narrative-only Web3 peers. The anti-thesis is also strong: the company is hard to value cleanly because it is neither a standard software vendor nor a simple game publisher. Revenue quality is disclosed through bookings, not audited GAAP-style revenue detail; asset value mixes cash, digital assets, private investments, and large off-balance-sheet reserves; and public current-price signals conflict sharply. That means an investor can believe Animoca matters strategically while still refusing to underwrite a precise current mark. The right framing is therefore to separate strategic attractiveness from entry-price conviction. This distinction is the central reason the recommendation stays cautious despite substantial strategic substance.",
