    {
      "id": "differentiation-and-maturity",
      "title": "Differentiation is strongest in identity, network, and distribution rather than pure protocol ownership",
      "body": "The best public case for Animoca\u2019s differentiation is not that it owns the most technically elegant chain or the cleanest single-game loop. Ronin and Flow show what tighter vertical stacks can look like, and Forte shows what a narrower compliance-and-token-controls product can focus on. Animoca\u2019s advantage instead appears to come from tying content, communities, and ecosystems together with reusable identity and loyalty surfaces. CoinList and CMCC both push this reading of Mocaverse. Open Campus reinforces the same pattern in education. The maturity picture is mixed: The Sandbox looks relatively established, while Moca Network and Open Campus still look like growing infrastructure ecosystems. That is not a weakness by itself, but it means the underwriting case is part current-product case and part ecosystem-optionality case. The portfolio has more strategic bridges than pure-play rivals, but also more execution surfaces to coordinate. Integration discipline is therefore a real technical competency.",
      "claimRefs": [
        "CE006",
