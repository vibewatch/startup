    {
      "id": "durability-and-gaps",
      "title": "Durability remains the real underwriting gap",
      "body": "The bottom line is that Animoca\u2019s customer proof is directionally strong but economically incomplete. The retained evidence supports real usage, brand gravity, and institutional curiosity across multiple properties. It also suggests that classic one-customer concentration is probably lower than in enterprise software. However, the hard diligence questions are still open: what share of users pay, what share comes back, which channels drive the best cohorts, and how much of the current footprint depends on token incentives or flagship-product cycles. Without NRR, churn, repeat-payer, or product-level revenue concentration views, the customer chapter cannot graduate from adoption proof to full durability proof. Investors therefore should treat the customer story as positive on reach and breadth, medium-confidence on monetization quality, and still incomplete on retention and concentration. That gap is solvable, but only with private KPI and cohort disclosure. Until then, reach should not be mistaken for durable revenue quality in isolation.",
