    {
      "id": "named-proof-and-expansion",
      "title": "Named counterparties validate expansion pathways better than they validate retention",
      "body": "Named counterparty proof is strongest where the source set ties a public name to a concrete action. ANPA stands out because the EDU-token commitment, intended uses, and executive quotes are all visible. SK Planet is important because the FY2024 update ties it to an AIR SDK onboarding ambition aimed at 28 million KYC\u2019d members. Chess.com and YGG help the Anichess story because they anchor both product credibility and regional distribution. The Sandbox\u2019s partner roster and the Studio surface likewise show that creators and brands continue to matter. Still, most of this proof should be read as expansion and distribution validation more than as renewal validation. It shows Animoca can attract counterparties and audiences. It does not yet show how much durable net revenue those names create, how concentrated that revenue is, or how sticky each onboarded cohort becomes over time. In short, the public record proves pull, not full customer-quality economics.",
