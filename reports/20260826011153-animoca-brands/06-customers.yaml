    {
      "id": "adoption-proof",
      "title": "The best customer proof is project-level adoption, not parent-level cohort disclosure",
      "body": "The good news is that Animoca has more public adoption proof than many private Web3 companies. The Sandbox posted a concrete Alpha Season 4 usage snapshot with more than 580,000 unique players, more than 39 million quests, and more than one million gameplay hours. Moca Network and Open Campus both published meaningful identity and wallet counts. GAMEE disclosed registered-user, gameplay-session, wallet-onboarding, and advertising-scale figures. Anichess disclosed public-alpha timing and monthly active players. Taken together, those metrics make it hard to argue that Animoca is merely a concept stock. But the proof is uneven. Most of the metrics live inside product-specific updates, many are top-of-funnel or activity oriented, and few bridge cleanly to payer quality or repeat monetization. The result is real adoption proof with only moderate durability visibility. That mix supports interest and tracking, but it does not eliminate the need for private cohort work or comparable KPI definitions.",
