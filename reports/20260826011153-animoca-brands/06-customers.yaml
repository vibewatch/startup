  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Animoca shows unusually broad public customer proof for a private Web3 company, led by concrete user and activity metrics across The Sandbox, Moca Network, Open Campus, GAMEE, and Anichess. The evidence supports real adoption and multiple expansion paths, but retention, monetized cohort quality, and concentration remain materially under-disclosed."
  },
  "sections": [
    {
      "id": "customer-map",
      "title": "Animoca serves a multi-sided customer graph rather than a single buyer type",
      "body": "Animoca\u2019s customer chapter is easiest to understand as a graph of users and counterparties rather than a neat B2B or B2C bucket. The consumer side includes players, creators, collectors, and community members across The Sandbox, GAMEE, Anichess, and other products. The education side adds teachers, learners, and institutions through TinyTap and Open Campus. The infrastructure side adds identity users, partner ecosystems, advertisers, and token-aligned participants through Moca Network and GAMEE AdNetwork. Finally, named institutional counterparties like ANPA and distribution partners like SK Planet matter because they can help convert product surfaces into capital flows or user onboarding. This matters for diligence because the right concentration lens is not top ten accounts. It is flagship-product dependence, ecosystem dependence, and whether user and payer definitions are stable enough to compare across the portfolio. It also means the same person can appear as a player, wallet holder, community member, and payer across different surfaces.",
