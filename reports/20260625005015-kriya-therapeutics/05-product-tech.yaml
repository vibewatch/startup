  claims:
    - id: CE001
      statement: >
        Kriya's product development approach rests on three foundational pillars:
        translational research, computational biology, and scalable manufacturing, which
        the company integrates into a unified gene therapy product engine.
      type: company-claimed
      topic: platform-architecture
      sourceRefs:
        - SE017
        - SE003
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE001
        - QE026

    - id: CE002
      statement: >
        SIRVE™ (System for Intelligent Rational Vector Engineering) is Kriya's proprietary
        computationally-driven vector design platform that uses multiple proprietary
        algorithms to engineer each component of AAV vectors, often generating dozens of
        variants with subtle yet important differences per program.
      type: company-claimed
      topic: SIRVE
      sourceRefs:
        - SE002
        - SE017
        - SE013
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QE026

    - id: CE003
      statement: >
        STRIPE™ (System to Realize Improved Production Efficiency) is Kriya's proprietary
        high-efficiency manufacturing platform integrating advances in cell-line technology
        and upstream and downstream process engineering to achieve what Kriya describes as
        exponential reductions in production costs at scale.
      type: company-claimed
      topic: STRIPE
      sourceRefs:
        - SE013
        - SE001
      confidence: high
      freshness: current

    - id: CE004
      statement: >
        SIRVE screens each vector candidate simultaneously for manufacturability, biological
        performance, and immune profile within Kriya's in-house manufacturing infrastructure,
        enabling co-optimization of performance and scalability from the earliest design stage.
      type: company-claimed
      topic: SIRVE
      sourceRefs:
        - SE017
        - SE002
      confidence: medium
      freshness: current
      answersQuestionRefs:
        - QE026

    - id: CE005
      statement: >
        SIRVE applies machine learning tools for optimizing vector genome design for
        manufacturability, expression, and stability, and uses generative deep learning
        to improve existing biologics.
      type: company-claimed
      topic: SIRVE
      sourceRefs:
        - SE002
      confidence: medium
      freshness: current

    - id: CE006
      statement: >
        SIRVE's computational tools include de novo vector design, sequence modification,
        and data analysis, with a stated goal of reducing immunogenicity and improving
        expression and packaging efficiency for AAV gene therapy vectors.
      type: company-claimed
      topic: SIRVE
      sourceRefs:
        - SE013
        - SE002
      confidence: medium
      freshness: historical

    - id: CE007
      statement: >
        STRIPE integrates advances in cell-line technology with both upstream and
        downstream process engineering to reduce per-dose production costs at scale
        relative to conventional AAV manufacturing approaches.
      type: company-claimed
      topic: STRIPE
      sourceRefs:
        - SE013
        - SE001
      confidence: medium
      freshness: current

    - id: CE008
      statement: >
        Kriya deploys its manufacturing platform and analytical characterization tools
        from the earliest stages of research through clinical development and
        commercialization, avoiding process changes that can affect product quality
        or potency at the transition to larger scale.
      type: company-claimed
