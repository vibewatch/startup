  - id: quality-regulatory-trust
    title: Quality, regulatory, and trust controls
    body: >
      Kriya's quality system operates under FDA cGMP regulations governing AAV gene
      therapy manufacturing (21 CFR Parts 210/211 and applicable biologics guidance from
      CBER). The completion of cGMP campaigns for clinical supply of KRIYA-825 and
      KRIYA-748 implies that QC testing and release protocols are operational. Analytical
      characterization is described as extensive and early-stage, covering critical quality
      attributes starting at the research phase; ASGCT 2026 presentations detail specific
      assays: a highly sensitive ddPCR for residual host cell DNA quantification in AAV
      drug product, and a cell-based potency assay for functional characterization of
      vectorized insulin in serum. Both represent quality control advances beyond
      conventional AAV lot-release testing. The FDA's CBER oversees cellular and gene
      therapy products and has an established IND-based framework; Kriya's Phase 1/2 IND
      approvals (for KRIYA-825 and KRIYA-748) confirm the regulatory pathway is open. The
      FDA's approved gene therapy product list now includes more than 40 approved cellular
      and gene therapy products, and the IND-to-BLA pathway is well understood. However,
      Kriya has not publicly disclosed any specific regulatory designations (Fast Track,
      Breakthrough, Regenerative Medicine Advanced Therapy) for any program, nor has it
      published a clinical trial protocol, patient selection criteria, safety monitoring
      plan, or clinical pharmacology report. FDA long-term follow-up guidance for gene
      therapy typically requires monitoring for up to 15 years post-dosing; this LTFU
      obligation creates long-dated pharmacovigilance commitment that must be budgeted and
      operationalized. Industry-wide, the Elevidys withdrawal by Sarepta Therapeutics due
      to patient deaths is a cautionary signal that cGMP manufacturing failures and
      expedited approvals can combine to create severe safety and commercial risks in the
      AAV space. Kriya acknowledges through product disclaimer language that no program has
      been approved for safety or efficacy by any regulatory health authority.
