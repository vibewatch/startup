company:
  name: Kriya Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: >
    Kriya's product engine integrates three proprietary pillars—SIRVE computational vector
    design, STRIPE scalable manufacturing, and focal-delivery biology—into an end-to-end
    AAV gene therapy platform housed in a 51,000 sq ft cGMP facility in Research Triangle
    Park. As of mid-2026 the pipeline spans nine programs across ophthalmology, metabolic
    disease, and neurology, with KRIYA-825 (geographic atrophy) and KRIYA-748 (trigeminal
    neuralgia) confirmed in Phase 1/2 clinical trials, underpinned by preclinical evidence
    for durable protein expression; the platform's key differentiators—validated target
    biology, in-house scalable manufacturing, and focal tissue administration at low
    systemic doses—are not yet validated by published human efficacy data, creating a
    material translational gap that remains the central diligence question.

sections:
  - id: platform-architecture
    title: Platform architecture and three-pillar engine
    body: >
      Kriya describes its development approach as a gene therapy "product engine" built on
      three foundational pillars—translational research, computational biology, and scalable
      manufacturing—that are tightly co-integrated rather than siloed. At the computational
      layer, SIRVE™ (System for Intelligent Rational Vector Engineering) applies proprietary
      algorithms, machine learning, and generative deep learning to engineer every individual
      component of each AAV vector. The platform generates dozens of construct variants per
      program, screening each simultaneously for manufacturability, biological performance,
      and immune profile using the same in-house production infrastructure. STRIPE™ (System
      to Realize Improved Production Efficiency) is the complementary manufacturing platform,
      integrating advances in cell line technology with upstream and downstream process
      engineering to reduce per-dose production cost at scale. Both platforms are deployed
      from earliest discovery through clinical manufacturing, which Kriya states eliminates
      disruptive process changes that can erode potency or introduce comparability risk.
      The R&D workflow formalizes this integration: protein engineering, vector genome
      design, capsid selection from known clinically-validated serotypes, manufacturability
      evaluation, and route-of-administration selection are treated as parallel, not
      sequential, workstreams. Capsid selection is deliberately limited to validated
      serotypes in order to reduce immunology uncertainty at the IND stage. Computational
      tools also cover generative approaches to improve first-generation biologics. Publicly,
      SIRVE and STRIPE were named as distinct technology platforms in the Series B in 2021
      and remain referenced in manufacturing and product-design materials through 2026,
      though Kriya's current external communications have shifted the vocabulary to the
      broader "platform" narrative rather than foregrounding the individual system names.
      The ASGCT 2026 presentations—covering novel ddPCR assays for residual host-cell DNA,
      cell-based potency assays for vectorized insulin, and AAV1 compatibility with
      single-use bioprocessing bags—are the most recent public indicators that the platform
      analytical development program continues to advance across the pipeline.
