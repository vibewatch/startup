      statement: >
        KRIYA-839's mechanism of action relies on skeletal muscle's role in approximately
        80% of glucose metabolism in healthy individuals; AAV-expressed insulin drives
        GLUT4 translocation locally, while glucokinase acts as a glucose sensor.
      type: company-claimed
      topic: KRIYA-839
      sourceRefs:
        - SE006
      confidence: medium
      freshness: current
