callouts:
  - calloutType: strength
    title: "Validated-biology target selection minimizes de-risking cost"
    body: >
      By selecting targets with prior FDA-approved small-molecule or biologics validation
      (complement C3/C5 for GA, IGF1R for TED, FGF21 for MASH), Kriya dramatically
      compresses the translational hypothesis risk relative to novel biology programs. KRIYA-825
      benefits from two approved drugs that confirm C3 and C5 pathway suppression slows GA,
      and KRIYA-586 targets the same IGF1R pathway as tepezza. This approach justifies
      lower preclinical proof standards while preserving a differentiated mechanism.
    claimRefs:
      - CE016
      - CE019
      - CE022

  - calloutType: risk
    title: "Zero published human data after $1.2 billion raised creates critical diligence gap"
    body: >
      As of mid-2026, Kriya has not published human PK, PD, or efficacy data from any trial.
      KRIYA-825's Phase 1/2 is underway but no interim readout has been released. The labiotech.eu
      analysis in September 2025 explicitly highlighted this asymmetry: more than $1.2B raised
      with no human clinical data—an unusual profile even for a platform-focused gene therapy
      company. First-in-human safety data from KRIYA-825 and KRIYA-748 are the most important
      upcoming catalysts for fundamental risk reassessment.
    claimRefs:
      - CE040
      - CE047

  - calloutType: risk
    title: "Single-source Everads device creates supply chain and combination-product regulatory risk"
    body: >
      KRIYA-825's delivery depends entirely on the Everads Suprachoroidal Injector under an
      exclusive supply agreement with a small Israeli biotech. A device-centric combination
      product regulatory pathway (drug + device BLA/PMA) is more complex and potentially
      slower than a standalone biologics BLA. Supply disruption, device recall, or Everads
      operational failure could halt KRIYA-825 development indefinitely. The company has not
      disclosed contingency plans or alternative delivery options.
    claimRefs:
      - CE028
      - CE038

  - calloutType: insight
    title: "ASGCT 2026 assay presentations signal platform maturation but not yet commercial readiness"
    body: >
      Kriya's ASGCT 2026 abstracts—covering ddPCR residual DNA testing, vectorized insulin
      potency assays, and AAV1 bioprocessing bag compatibility—suggest the analytical
      development and quality systems are progressing in parallel with clinical trials. This
      is architecturally sound but means commercial-grade lot-release specifications are still
      being established, not yet confirmed. The assays need FDA qualification before they
      can gate clinical batches, a milestone not yet reached.
    claimRefs:
      - CE034
      - CE035

