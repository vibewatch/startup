  - id: TE002
    title: Customer workflow vs. Kriya gene therapy solution — use-case comparison
    columns:
      - Patient / User Job
      - Current Standard of Care
      - Kriya Solution
      - Mechanism of Benefit
      - Key Limitation
    rows:
      - - Slow GA lesion growth (vision preservation)
        - Syfovre (monthly/bimonthly intravitreal injection, C3 inhibition) or Izervay (bimonthly, C5 inhibition)
        - KRIYA-825 one-time suprachoroidal injection expressing CR2-CR1 fusion (C3+C5 dual block)
        - Single-visit AAV transduction of RPE/choroid enables multi-year complement inhibition; eliminates injection burden
        - Clinical efficacy in humans unproven; competitor Complement Therapeutics (CTx001) also entering clinic
      - - Manage TED proptosis and diplopia
        - Tepezza (8 IV infusions over 5 months, anti-IGF1R monoclonal antibody)
        - KRIYA-586 one-time peribulbar injection expressing anti-IGF1R antibody
        - Localized periorbital expression reduces systemic exposure and avoids IV infusion series
        - IND-enabling stage; human data absent; expression durability unknown
      - - Control blood glucose in T1D (insulin independence)
        - Multiple daily insulin injections or insulin pump plus continuous glucose monitoring
        - KRIYA-839 one-time IM injection expressing insulin + glucokinase in muscle
        - Biological closed loop for glucose sensing reduces or eliminates exogenous insulin need
        - IND-enabling; no human data; multi-site injection; durability and beta-cell immunity not addressed
      - - Treat advanced liver fibrosis in MASH (F3-F4)
        - No FDA-approved therapy for MASH F4; resmetirom approved for non-F4
        - KRIYA-497 one-time IM gene therapy expressing native FGF21 protein
        - Continuous FGF21 expression reverses hepatic fibrosis and improves metabolic profile; avoids Cmax GI toxicity
        - IND-enabling; FGF21 receptor desensitization risk with chronic agonism not addressed
      - - Reduce TN paroxysmal pain attacks
        - Anticonvulsants (carbamazepine) or neurosurgery (MVD); both limited by tolerability or invasiveness
        - KRIYA-748 one-time trigeminal nerve injection of chemogenetic ion channel
        - Targeted neuronal silencing with varenicline on-demand; surgical-level pain control without surgery
        - Phase 1/2; no human efficacy data; varenicline therapeutic window and CNS tolerability uncharacterized
    notes: >
      Current standard of care descriptions are based on FDA-approved product labels and
      published clinical practice. Kriya benefits are company-stated from pipeline and
      product design pages; no head-to-head clinical data exists. All Kriya candidates
      are investigational and unapproved.
