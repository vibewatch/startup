  - id: manufacturing-model-and-gmp-operations
    title: Manufacturing model and GMP operations
    body: >
      Kriya's manufacturing model is centralized, in-house, and multi-product, housed in a
      51,000-square-foot facility at Research Triangle Park, North Carolina that completed
      renovation in July 2021 after approximately one year of build-out. The facility
      encompasses in-house process development labs, analytical development labs, quality
      control testing, pilot production bays, fill/finish, and multiple cGMP suites—all
      under one roof, which Kriya describes as vial-to-vial manufacturing capability. GMP
      production capacity is available at 50L, 500L, and 3,000L bioreactor scales,
      supporting multi-product manufacturing across any AAV serotype using the same
      platform unit operations. As of mid-2026, the company states that active GMP
      manufacturing campaigns are running simultaneously across several pipeline programs.
      The strategic rationale for in-house manufacturing is articulated consistently in
      public materials: using the same series of unit operations from research scale to
      commercial scale enables seamless scale-up, avoids costly process comparability
      changes, and builds confidence that preclinical data translates accurately into
      clinical product. In the Series B financing in 2021, Kriya publicly named STRIPE as
      its high-efficiency manufacturing platform, specifically integrating cell-line
      technology advances with upstream and downstream process optimization to achieve
      exponential cost reductions at scale relative to industry norms. By the JPM 2024
      update, Kriya noted that running manufacturing from the earliest research stages
      through clinical development and commercialization gives "higher degrees of confidence
      in the translation of our preclinical work into the clinic." Quantitative production
      metrics such as yield per liter, purity specifications, or cost per dose relative to
      industry benchmarks have not been publicly disclosed. PackGene Biotech, a gene therapy
      CDMO, cited Kriya as a company whose in-house manufacturing capability and multi-
      program capacity are key competitive advantages. The extent to which STRIPE has
      actually reduced per-dose costs to below CDMO benchmarks remains unverified externally.
