    - id: CE016
      statement: >
        KRIYA-825 is an AAV-based gene therapy expressing a CR2-CR1 fusion protein designed
        to inhibit complement C3 and C5 simultaneously, intended for the treatment of
        geographic atrophy, and delivered by one-time suprachoroidal injection.
      type: company-claimed
      topic: KRIYA-825
