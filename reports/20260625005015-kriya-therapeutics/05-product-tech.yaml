  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: clinical-efficacy
      missingEvidence: >
        Phase 1/2 safety and preliminary efficacy data from KRIYA-825 trial (dose cohorts,
        safety events, biomarker readouts, complement inhibition levels in patients).
      whyItMatters: >
        Without any human data, the entire technical thesis — durable complement inhibition
        via suprachoroidal AAV, KRIYA-825 tolerability, and target engagement — remains
        preclinical. A first human safety signal (positive or negative) is the pivotal
        technical de-risking event for the company.
      diligencePath: >
        Request interim clinical safety data update from company under NDA; monitor
        ClinicalTrials.gov NCT identifier for KRIYA-825 trial status and any posted results.
      relatedQuestionRefs:
        - QE004

    - type: private-evidence-only
      severity: blocking
      topic: manufacturing-cost
      missingEvidence: >
        Validated cost per dose for Kriya's GMP manufacturing versus CDMO benchmarks
        and versus approved gene therapy products (ZOLGENSMA ~$2.1M, HEMGENIX ~$3.5M).
      whyItMatters: >
        Kriya's entire differentiation thesis depends on scalable, lower-cost manufacturing
        enabling accessible pricing for common diseases. If STRIPE has not materially reduced
        cost, the commercial positioning collapses.
      diligencePath: >
        Request manufacturing cost model, yield data, and per-dose cost estimate under NDA;
        compare against public PackGene/CDMO quotes for comparable AAV serotypes.
      relatedQuestionRefs:
        - QE003
        - QE011
        - QE012

    - type: missing-source
      severity: material
      topic: AAV-serotypes
      missingEvidence: >
        Confirmed AAV serotypes for KRIYA-825, KRIYA-586, KRIYA-748, KRIYA-382, and the
        three undisclosed programs (KRIYA-296, KRIYA-652, KRIYA-454).
      whyItMatters: >
        Serotype determines immunology risk, tissue tropism, and manufacturing platform
        compatibility. Without confirmed serotype selection, seroprevalence exclusion rates
        and patient eligibility cannot be estimated.
      diligencePath: >
        Review IND applications under NDA; check any published clinical protocol or
        ASGCT/ARVO poster for serotype disclosures.
      relatedQuestionRefs:
        - QE003

    - type: missing-source
      severity: material
      topic: regulatory-designations
      missingEvidence: >
        Any FDA regulatory designations (Orphan Drug, Fast Track, RMAT, Breakthrough Therapy)
        for any Kriya program.
      whyItMatters: >
        Breakthrough or RMAT designation would materially accelerate review timelines and
        validate FDA's view of unmet need. Absence of public disclosure does not confirm
        absence of designation, but it limits visibility into regulatory strategy.
      diligencePath: >
        Search FDA's orphan drug database for Kriya/KRIYA designations; request regulatory
        pathway summary from company.
      relatedQuestionRefs:
        - QE004

    - type: private-evidence-only
      severity: material
      topic: KRIYA-748-clinical
      missingEvidence: >
        Confirmed Phase 1/2 initiation date, trial ID, dosing cohort, and safety readout
        for KRIYA-748 trigeminal neuralgia program.
      whyItMatters: >
        The CEO stated at ASGCT 2026 that 5 programs are advancing to clinic, and prior
        releases stated KRIYA-748 was in Phase 1/2, but no official trial initiation press
        release matching KRIYA-825's transparency level has been found for KRIYA-748.
      diligencePath: >
        Search ClinicalTrials.gov for KRIYA-748; request trial ID and initiation confirmation
        from Kriya under NDA.
      relatedQuestionRefs:
        - QE004

    - type: missing-source
      severity: minor
      topic: undisclosed-programs
      missingEvidence: >
        Mechanism, target, and development rationale for the three undisclosed programs:
        KRIYA-296 (ophthalmology), KRIYA-652 (metabolic), KRIYA-454 (neurology).
      whyItMatters: >
        These three programs represent a third of the pipeline. If they are broad-platform
        tests of unproven biology, they add risk; if they are follow-on uses of validated
        biology (like additional complement or FGF21 programs), they reduce marginal
        development cost.
      diligencePath: >
        Request pipeline overview slide deck from company; review any patent applications
        assigned to Kriya covering novel mechanisms.
      relatedQuestionRefs:
        - QE004

    - type: stale
      severity: minor
      topic: pipeline-discontinuation
      missingEvidence: >
        Explanation of why the original 2020 pipeline (KT-A112, KT-A522, KT-A832) was
        entirely replaced by 2022-2023, and what preclinical data informed those decisions.
      whyItMatters: >
        Pipeline substitution without explanation raises the question of whether specific
        failures (toxicity, expression, immune response) drove the pivot, or whether it was
        purely strategic scope change. Understanding this informs risk assessment for the
        current pipeline.
      diligencePath: >
        Request preclinical discontinuation data and program decision memos from company;
        review any academic publications citing those early program codes.
      relatedQuestionRefs:
        - QE004

