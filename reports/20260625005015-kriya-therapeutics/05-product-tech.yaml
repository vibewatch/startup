  - id: TE004
    title: Trust, quality, and compliance controls
    columns:
      - Control / Certification / Metric
      - Status
      - Scope
      - Gap / Diligence Ask
    rows:
      - - cGMP compliance (21 CFR 210/211/CBER guidance)
        - Active — cGMP facility operational since 2021; clinical supply batches produced
        - GMP manufacturing for KRIYA-825 and KRIYA-748 clinical trials
        - No third-party audit or GMP inspection report publicly available; confirm no FDA warning letters
      - - FDA IND approval
        - Granted — KRIYA-825 Phase 1/2 IND approved (trial initiated 2025); KRIYA-748 Phase 1/2 IND approved
        - Pre-clinical and manufacturing data package accepted by FDA CBER
        - IND number, study protocol, and safety monitoring committee composition not public
      - - Residual host-cell DNA assay (ddPCR)
        - In development — presented at ASGCT 2026 as novel assay
        - Release testing for AAV drug product batches
        - Regulatory qualification and acceptance criteria not yet publicly confirmed
      - - Cell-based potency assay (vectorized insulin)
        - In development — presented at ASGCT 2026
        - Lot release for KRIYA-839 batches
        - Correlation between in vitro potency and in vivo glycemic control not yet established
      - - FDA Long-Term Follow-Up (LTFU) obligations
        - Required — FDA expects LTFU of up to 15 years for gene therapy clinical trial participants
        - All clinical programs including KRIYA-825 and KRIYA-748
        - LTFU registry and monitoring strategy not publicly disclosed; ongoing cost commitment
      - - Regulatory designations (Orphan, Fast Track, RMAT, Breakthrough)
        - Not publicly disclosed for any program
        - Potentially applicable to KRIYA-748 (TN is rare; ~400K US/EU), KRIYA-839 (T1D subsets)
        - Absence of public disclosure means benefit of accelerated review cannot be confirmed
    notes: >
      cGMP status inferred from active clinical trial initiation announcements and
      ASGCT 2026 manufacturing presentations. IND approvals inferred from Phase 1/2
      trial announcements; specific IND numbers and protocols are not public. LTFU
      requirement is standard FDA policy for gene therapy, not program-specific disclosure.
