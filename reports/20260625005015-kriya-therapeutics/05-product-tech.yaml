    - id: CE020
      statement: >
        KRIYA-839 is a one-time intramuscular AAV gene therapy expressing insulin and
        glucokinase in skeletal muscle for type 1 diabetes, designed to create a
        biological closed-loop glucose-sensing system.
      type: company-claimed
      topic: KRIYA-839
      sourceRefs:
        - SE006
        - SE014
      confidence: medium
