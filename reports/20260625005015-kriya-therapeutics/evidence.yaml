evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: Management reconciliation of whether the August 2025 Form D was separate from or part of the later Series D close.
    whyItMatters: It affects total capital raised, dilution assumptions, and the interpretation of financing momentum.
    diligencePath: Request the capitalization table and financing-closing timeline from management or lead investors.
    relatedQuestionRefs:
      - QO007
      - QO009
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: valuation-disclosure
    missingEvidence: A primary or independent source stating Kriya's current post-money valuation.
    whyItMatters: Valuation is a core cover metric and directly informs the later underwriting chapter.
    diligencePath: Request board materials, investor letters, or an updated financing deck with valuation and share class details.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: minor
    topic: board-composition
    missingEvidence: A complete current board roster and committee structure.
    whyItMatters: Governance quality and investor-control concentration cannot be assessed from public snippets alone.
    diligencePath: Request the current board deck or governance presentation from management.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: headcount
    missingEvidence: Current employee count and site-by-site staffing distribution.
    whyItMatters: Scale and burn assumptions are hard to test without staffing visibility.
    diligencePath: Request org charts, HR reports, or current employee counts by function and site.
    relatedQuestionRefs:
      - QO024
      - QO025
  - type: missing-source
    severity: blocking
    topic: sizing gap
    missingEvidence: >-
      A disease-specific, bottom-up SAM estimate for the combined prevalent-disease AAV sub-segment (GA, TED, T1D, MASH,
      TN) from an independent analyst source; currently no published analyst report isolates this sub-segment.
    whyItMatters: >-
      Without a credible SAM, sizing Kriya's addressable market requires assumptions about treatment penetration, price,
      and payer coverage that cannot be independently validated, making the market sizing unreliable for investment
      purposes.
    diligencePath: >-
      Commission a bespoke disease-specific sizing analysis from a health economics consultancy; request Kriya's
      internal market model and payer strategy documents (confidential diligence path).
    relatedQuestionRefs:
      - QM016
  - type: missing-source
    severity: material
    topic: immunogenicity exclusion rate
    missingEvidence: >-
      The specific seroprevalence of neutralizing antibodies against the AAV serotypes used by Kriya in its five
      indications; the fraction of patients in each indication's target population who would be ineligible at screening
      due to pre-existing NAbs.
    whyItMatters: >-
      Immunogenicity is the primary adoption constraint cited by multiple analyst sources; if NAb seroprevalence against
      Kriya's capsids is high (above 30%), the effective addressable patient pool could be materially smaller than
      prevalence-based estimates.
    diligencePath: >-
      Request Kriya to disclose NAb seroprevalence data for its proprietary capsid variants from the KRIYA-825 Phase 1/2
      screening population; cross-reference with published literature on seroprevalence for related AAV serotypes.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: material
    topic: Medicare coverage for prevalent-disease gene therapy
    missingEvidence: >-
      Any CMS Medicare coverage policy or National Coverage Determination for AAV gene therapy in geographic atrophy or
      any other prevalent chronic disease indication; payer health technology assessment outcomes for high-priced
      one-time therapies in predominantly elderly patient populations.
    whyItMatters: >-
      Medicare Part B coverage and pricing policy for prevalent-disease gene therapies is the single largest commercial
      risk for KRIYA-825 (GA) and potentially for KRIYA-839 (T1D); without CMS precedent, revenue modeling for these
      indications rests on assumed outcomes-based contract terms that have no published anchors.
    diligencePath: >-
      Monitor CMS Medicare coverage decisions for Zolgensma, Hemgenix, and Beqvez in pediatric/adult rare disease as
      proxies; engage health economics experts on ICER's assessment framework for gene therapy in common diseases;
      request Kriya's payer strategy team for confidential coverage modeling.
    relatedQuestionRefs:
      - QM025
  - type: missing-source
    severity: material
    topic: T1D gene therapy competitors
    missingEvidence: >-
      Published clinical or IND-filing evidence for cell-therapy programs (Vertex VX-880, CRISPR Therapeutics/ViaCyte)
      and other T1D gene therapy approaches as direct competitors to KRIYA-839.
    whyItMatters: >-
      Without a full T1D competitive map, the investor cannot assess whether KRIYA-839 faces first-mover advantage or an
      already-crowded cell/gene therapy field.
    diligencePath: >-
      Pull ClinicalTrials.gov search for T1D gene therapy and islet cell therapy trials; review Vertex VX-880 Phase 1/2
      data releases from 2024–2026.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: material
    topic: Kriya manufacturing cost and yield
    missingEvidence: >-
      Actual batch-to-batch manufacturing yields, cost-per-dose, and regulatory CMC filing data supporting Kriya's claim
      of industry-leading manufacturing quality and productivity at 3,000L scale.
    whyItMatters: >-
      The manufacturing moat is central to Kriya's competitive differentiation narrative; without independent
      validation, investors cannot weight it against CDMO-dependent peers or uniQure's Lexington facility.
    diligencePath: >-
      Request IND-stage CMC sections or manufacturing validation reports in due diligence; benchmark cost-per-dose
      estimates against public CDMO rate cards.
    relatedQuestionRefs:
      - QP010
      - QP014
  - type: missing-source
    severity: material
    topic: KRIYA-825 vs CTx001 dual-pathway mechanism head-to-head
