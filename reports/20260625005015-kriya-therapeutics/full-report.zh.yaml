  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 已获批 GA 标准治疗——主要替代目标
        blocks:
          - type: paragraph
            body: >-
              地图样萎缩（GA）是 Kriya 近期投资案例中最核心的适应症，两款 FDA 已获批补体抑制剂定义了 Kriya 必须替代的现状。Syfovre（pegcetacoplan，Apellis
              Pharmaceuticals）是 C3 抑制剂，每月或每两月玻璃体腔内注射；Izervay（avacincaptad pegol，Astellas）是 C5
              抑制剂，每月玻璃体腔内注射。两者都能在临床上有意义但不完整地减缓 GA 病灶增长；它们既不能阻止疾病进展，也不能消除反复由医生给药注射的需求。这给 Kriya 留出了市场切口：一次性脉络膜上腔 AAV
              基因治疗（KRIYA-825），在不反复注射的情况下提供持续补体抑制。替代逻辑在机制上说得通，但 Syfovre 和 Izervay
              已拥有多年真实世界安全数据、既有支付方关系、专科医生熟悉度和商业分销基础设施，而这些 Kriya
              尚未搭建。视网膜专科医生已经为既有患者整合了每两月注射排程，切换成本也不低；基因治疗新进入者必须先证明疗效持久且安全性干净，支付方和医生才会重新导流患者。甲状腺眼病（TED）对应的现有治疗是静脉给药的
              anti-IGF1R 单克隆抗体——唯一获 FDA 批准的 TED 疗法——需要在输注中心多次 IV 输注。KRIYA-586 通过单次眶周 AAV 注射瞄准同一 IGF1R
              通路；如果临床数据支持该机制，它可提供局部表达并降低系统性暴露。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP003
              - CP004
