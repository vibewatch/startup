      - number: '3.2'
        title: 直接眼科基因治疗竞争者
        blocks:
          - type: paragraph
            body: >-
              至少三个基因治疗项目正用 AAV 载体开发地图样萎缩，形成一个拥挤的 Phase 1–2 基因治疗空间，区别于已获批补体抑制剂赛道。Complement Therapeutics（CTx001）是与
              KRIYA-825 结构上最可比的对手：两者都基于 AAV，都瞄准补体级联反应，也都在 2025-2026 年进入首次人体试验。机制分野有意义——KRIYA-825 递送一种新型 CR2-CR1
              融合蛋白，设计上同时抑制 C3 和 C5，并在细胞表面结合补体片段；CTx001 则递送 Complement Receptor 1 的截短版本（mini-CR1），靶向经典和替代通路。CTx001 IND 于
              2025 年底获 FDA 批准；Opti-GAIN Phase 1/2 首次人体研究预计 2026 年 Q1 在美国开始给药，比 KRIYA-825 2025 年 5 月的临床启动晚约 12
              个月。JNJ-1887（Janssen）是玻璃体腔内 AAV 基因治疗，表达可溶性 CD59（sCD59），即补体通路膜攻击复合物抑制剂，截至 2024 年底处于 Phase
              2——临床阶段更靠前，但机制和递送路径不同。OCU410（Ocugen）用 AAV5 递送 RORA 转录因子基因，属于非补体机制，处于 Phase 1/2。更广义 GA
              管线还包括争夺同一患者的非基因疗法：Annexon 的 vonaprument（ANX007）是靶向 C1q 的玻璃体腔内 Fab 抗体，已推进至 Phase 3（ARCHER II，入组完成，预计 2026
              年下半年出数据）；Alkeus Pharmaceuticals 的口服 gildeuretinol（ALK-001）在 Phase 3 SAGA 数据中显示，第 6 至 24 个月病灶增长降低
              15.3%，具有统计显著性。这些项目可能压缩 Kriya Phase 1/2 入组可用患者池，并抬高未来获批所需疗效门槛。
