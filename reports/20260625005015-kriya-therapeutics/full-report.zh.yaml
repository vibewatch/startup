  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议链条从差异化平台出发，穿过未经验证的临床记录和推断出的溢价估值，最终落到「跟踪」：Phase 1/2 读出是继续推进的闸口。
    data:
      nodes:
        - id: platform
          label: 平台差异化
          detail: Premji Invest 提到，公司自建 GMP AAV 生产能力，并拥有约 $920.5M 的深厚资本底座。
          tone: positive
        - id: proof
          label: 临床证明缺口
          detail: 9 个项目只有 2 个进入临床；KRIYA-825 自 2025 年 5 月进入 Phase 1/2，尚无疗效数据。
          tone: warning
        - id: premium
          label: 隐含估值溢价
          detail: 公司未披露估值标记；按稀释测算隐含 $1.3-2.1B，$1.5-2.5B 的入场区间偏紧。
          tone: warning
        - id: sector
          label: 行业逆风
          detail: 2021-2024 年基因疗法融资下降 83%；bluebird、Pfizer Beqvez 和 Sarepta 都是警示案例。
          tone: negative
        - id: decision
          label: 建议——跟踪
          detail: 保持接触；买入前要求干净的 Phase 1/2 读出和数据室访问。
          tone: neutral
      edges:
        - from: platform
          to: premium
        - from: proof
          to: premium
        - from: sector
          to: decision
        - from: premium
          to: decision
    approximationNotes: null
    claimRefs:
      - CV031
      - CV023
      - CV034
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同稀释假设下，$320.8M Series D 对应的隐含投后估值框住熊、基准、牛三种情景。
    data:
      items:
        - label: 熊市——25% 稀释
          value: 1.28
          detail: $320.8M、25% 稀释隐含约 $1.28B 投后估值；处于隐含区间低端。
          tone: negative
        - label: 熊市——20% 稀释
          value: 1.6
          detail: $320.8M、20% 稀释隐含约 $1.6B 投后估值。
          tone: warning
        - label: 基准——18% 稀释
          value: 1.78
          detail: $320.8M、18% 稀释隐含约 $1.78B 投后估值；中心规划情景。
          tone: neutral
        - label: 牛市——15% 稀释
          value: 2.14
          detail: $320.8M、15% 稀释隐含约 $2.14B 投后估值；处于隐含区间高端。
          tone: positive
        - label: 牛市——12% 稀释
          value: 2.67
          detail: 若假设大幅升轮，$320.8M、12% 稀释隐含约 $2.67B 投后估值。
          tone: positive
    approximationNotes: 投后估值 = 轮次规模 / 稀释比例。这些只是基于 Form D/A $320.8M Series D 的简单稀释桥，并非折现现金流结果；公司未披露每股价格。
    claimRefs:
      - CV002
      - CV008
      - CV044
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支持较宽的估值区间，因为临床结果和行业倍数与融资标记同样关键。
    data:
      items:
        - label: 熊市情景
          low: 0.5
          mid: 0.9
          high: 1.3
          displayValue: $0.5B-$1.3B
          detail: 疗效不达标叠加行业压缩，估值会被拖向 REGENXBIO（$0.51B）区间，甚至更低。
          tone: negative
        - label: 基准情景
          low: 1.3
          mid: 1.5
          high: 1.8
          displayValue: $1.3B-$1.8B
          detail: 按期推进可使估值标记大致贴近 MeiraGTx（$1.07B，Phase 3）。
          tone: warning
        - label: 牛市情景
          low: 2.1
          mid: 2.6
          high: 3.1
          displayValue: $2.1B-$3.1B
          detail: 干净的 Phase 1/2 读出会把估值推向 Beam（$3.48B）和 uniQure（$3.08B）区间。
          tone: positive
    approximationNotes: 区间是投资委员会讨论用的情景参考点，锚定 2026 年 6 月公开可比公司，并非管理层指引。
    claimRefs:
      - CV012
      - CV016
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Kriya 在市场机会和平台护城河上得分尚可，但临床证明和估值透明度很低，因此适合「跟踪」。
    data:
      items:
        - label: 市场机会
          score: 4
          detail: 地理萎缩和常见慢性病都是持久一次性疗法的大市场。
          tone: positive
        - label: 临床证明
          score: 1
          detail: 没有人体疗效数据；KRIYA-825 直到 2025 年 5 月才进入 Phase 1/2。
          tone: negative
        - label: 平台护城河
          score: 3
          detail: Premji Invest 将公司自建 GMP AAV 生产能力列为差异化因素。
          tone: neutral
        - label: 资本效率
          score: 2
          detail: 已融资约 $920.5M，但 9 个项目只有 2 个进入临床；Labiotech 指出资本投入跑在产出前面。
          tone: warning
        - label: 财务风险
          score: 2
          detail: 未披露烧钱速度或现金跑道；2021-2024 年行业融资下降 83%。
          tone: warning
        - label: 估值透明度
          score: 1
          detail: 未披露每股价格或投后估值；Caplight 确认没有可用估值标记。
          tone: negative
        - label: 证据质量
          score: 2
          detail: 存在申报级融资数据，但临床和估值证据薄弱，或只有单一来源。
          tone: warning
    approximationNotes: 评分为 1-5 的序数判断，基于公开证据集综合得出，用于 IC 讨论。
    claimRefs:
      - CV024
      - CV027
      - CV032
      - CV033
