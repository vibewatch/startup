          - type: callout
            title: 基因治疗行业逆风给 Kriya 之外再叠加系统性财务风险
            body: >-
              2021 至 2024 年，整个基因治疗领域的风投资金下滑 83%。同行案例显示结果高度二元：bluebird bio 估值曾接近 $10 billion，之后以 $30 million 私有化；Pfizer
              将其血友病基因治疗 Beqvez 撤出市场。Kriya 在这些逆风中仍能异常成功融资——外部评论常将其归因于政治关系而非临床里程碑——说明资本底座真实存在，但行业风险并没有被分散掉。任何临床读出延迟，或 GA
              Phase 1/2 试验受挫，都可能触发投资者信心重估。
