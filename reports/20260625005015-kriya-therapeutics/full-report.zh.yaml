      - number: '5.7'
        title: 展品
        blocks:
          - type: callout
            title: 选择已验证生物学靶点，可降低去风险成本
            body: >
              Kriya 选择已有 FDA 批准小分子或生物制剂验证的靶点（GA 的补体 C3/C5、TED 的 IGF1R、MASH 的 FGF21），因此相对新生物学项目，大幅压缩转化假设风险。KRIYA-825
              受益于两款获批药物，它们确认 C3 和 C5 通路抑制能放缓 GA；KRIYA-586 瞄准与 Tepezza 相同的 IGF1R 通路。这种做法支持更低的临床前证明标准，同时保留差异化机制。
            calloutType: strength
            claimRefs:
              - CE016
              - CE019
              - CE022
          - type: callout
            title: 融资 $1.2 billion 后仍无公开人体数据，形成关键尽调缺口
            body: >
              截至 2026 年中，Kriya 尚未发表任何试验的人体 PK、PD 或有效性数据。KRIYA-825 的 Phase 1/2 正在进行，但尚未发布中期读出。labiotech.eu 2025 年 9
              月分析明确强调了这种不对称：融资超过 $1.2B，却没有人体临床数据——即便对一家平台型基因治疗公司也不寻常。KRIYA-825 和 KRIYA-748
              的首次人体安全性数据，是接下来重新评估基本风险最重要的催化剂。
            calloutType: risk
            claimRefs:
              - CE040
              - CE047
          - type: callout
            title: 单一来源 Everads 设备带来供应链和组合产品监管风险
            body: >
              KRIYA-825 的递送完全依赖与一家小型以色列生物技术公司签订独家供应协议的 Everads Suprachoroidal Injector。以设备为中心的组合产品监管路径（药物 + 设备
              BLA/PMA）比独立生物制品 BLA 更复杂，也可能更慢。供应中断、设备召回或 Everads 运营失败，都可能无限期叫停 KRIYA-825 开发。公司尚未披露应急计划或替代递送方案。
            calloutType: risk
            claimRefs:
              - CE028
              - CE038
          - type: callout
            title: ASGCT 2026 检测报告显示平台成熟，但还不到商业化就绪
            body: >
              Kriya 的 ASGCT 2026 摘要覆盖 ddPCR 残留 DNA 测试、载体化胰岛素效价检测和 AAV1
              生物工艺袋兼容性，说明分析开发和质量体系正与临床试验并行推进。架构上这是合理的，但也意味着商业级批次放行规格仍在建立，还没有被确认。这些检测需要获得 FDA
              资格认定，才能成为临床批次放行关口；这一里程碑尚未达到。
            calloutType: insight
            claimRefs:
              - CE034
              - CE035
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 商业化前状态，以及如何理解一家临床阶段基因治疗公司的「客户」
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，Kriya Therapeutics 明确处于商业化前阶段。没有产品获得 FDA 或任何同等机构的监管批准。任何公开申报文件或新闻稿都未披露收入。没有具名患者接受过商业化 Kriya
              产品。公司自己的新闻稿和管线页面把每项资产都描述为在研项目。在 Series D 新闻稿（2025 年 9 月）中，CEO Shankar Ramaswamy
              将公司描述为「临床阶段」，并表示融资所得将用于支持临床试验，而非商业化。2024 年 1 月 JPM 更新也同样把所有项目定位为商业化前，并将五个项目目标设定为到 2025
              年末「进入临床」。截至最近可得的公开证据（ARVO 2025，5 月），KRIYA-825 用于地理萎缩的首个 Phase 1/2 试验刚开始入组，KRIYA-748
              用于三叉神经痛据称已进入临床，但尚未公开披露患者数量、中心数量或给药数据。

              在本分析中，「客户」被重新定义为 Kriya
              要在五个领先适应症中取得商业成功，未来必须触达的买方-使用者-支付方界面。这些界面拆成四个不同角色：（1）评估并开具基因治疗处方的专科医生；（2）实施给药的递送医生或操作医生；（3）接受治疗、其结局推动报销倡导的患者；（4）最终向服务提供方报销的支付方——可能是
              Medicare Part B、商业保险或 Medicaid。因此，Kriya 价值主张当前的「客户」是招募试验患者的临床研究者、Everads 这类验证递送可行性的技术伙伴、T1D Fund
              这类验证未满足患者需求的疾病倡导投资者，以及公开背书临床逻辑的专科意见领袖。
