  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入状态与公开财务披露
        blocks:
          - type: paragraph
            body: >-
              至少自 2025 年 9 月以来，Kriya Therapeutics 在每份公开融资稿中都使用「临床阶段生物制药公司」这一描述，这等于直接说明其仍处于未收入状态：没有 Kriya
              产品获得监管批准，没有商业销售，已检索公开来源也没有披露任何合作或授权收入。官方管线页列出三大治疗领域的九个项目；最靠前的 KRIYA-825（地图样萎缩）被描述为目前处于 Phase 1/2
              临床试验。Labiotech 在 2025 年 9 月独立指出，Kriya 已累计超过 $1.2 billion 披露融资，却「没有多少管线进展可以证明」。Caplight 的市场数据页面明确表示 Kriya
              估值信息不公开，也没有提供收入倍数或盈利数据。SEC Form D 文件只列出股权发行，没有任何可转债、收入基融资或项目融资迹象。任何已检索来源中都没有
              ARR、GMV、活跃用户、单位销量或其他商业指标。因此，承销的财务基线就是纯现金消耗，所有运营和投资支出完全由股权融资支撑。完整融资时间线已在公司概览章节记录；本章聚焦这条融资记录对资本充足性和未来收入的含义。
