      - number: '8.5'
        title: 情景、终止触发点与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              情景框架把这笔押注的二元性讲清楚。多头情景下，KRIYA-825 在地理萎缩中交出干净的 Phase 1/2 安全性和疗效信号，平台制造优势得到验证，估值上调融资或合作把标记推向 Beam 和 uniQure
              所在的 $3 billion 区域。基准情景下，公司按计划推进，早期数据好坏参半，并守住约 $1.5 billion 的隐含标记，大致接近
              MeiraGTx。空头情景下，疗效失败或安全事件叠加行业倍数压缩，把价值拖向 $0.5 billion 的 REGENXBIO 区域，甚至更低，呼应 bluebird 和 Sarepta
              先例。鉴于没有任何人体疗效数据，且基因疗法风险融资收缩 83%，概率信号更偏向基准到空头区间。

              尽调计划也就顺理成章。投资逻辑破裂和终止触发点表列明了会把判断从跟踪推向回避的事件——FDA 临床暂停、Phase 1/2
              疗效失败、降价轮、或进一步管线中止——以及每个事件对应的动作。最终尽调问题表列出从跟踪升级到买入所需的缺失证据：Series D 每股价格和投后估值、清算优先权和期权摊薄、月度烧钱和跑道、KRIYA-825
              试验方案和 DSMB 章程、以及公司资本声明与申报记录的对账。投资 KPI
              图从市场、证据、护城河、经济性、风险、估值透明度和证据质量多个维度打分，让低信心、高风险画像一眼可见。在这些问题得到回答前，有条件兴趣就是上限。
