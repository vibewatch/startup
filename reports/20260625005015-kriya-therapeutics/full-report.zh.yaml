            - 中——离子通道沉默已在动物模型中验证；TN 尚无既往人体 GT
            - 中——AAV5 制剂开发正在推进（ASGCT 2026）
            - 中——三叉神经注射；NHP 中评估 CNS 耐受性
            - 中——IND 已获准；罕见病 ODD 可能适用
            - Phase 1/2（进行中）
        - label: KRIYA-839（T1D）
          values:
