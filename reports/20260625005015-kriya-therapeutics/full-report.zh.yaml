        - 神经眼科医生或眼整形外科医生（买方）；商业保险 / Medicare（支付方）
        - KRIYA-586 管线项目；该适应症尚无获批基因疗法
      - - 1 型糖尿病
        - 一次性肌内 AAV 胰岛素 / 葡萄糖激酶基因疗法
