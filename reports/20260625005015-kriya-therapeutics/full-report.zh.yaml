companyProfile:
  summary: >-
    Kriya Therapeutics 是一家私人临床阶段基因治疗公司，成立于 2019 年末，目前运营横跨 Bay Area 的领导团队据点和 Research Triangle Park
    的大型制造基地。公司在眼科、代谢疾病和神经科布局一次性 AAV 药物，KRIYA-825 已进入地图样萎缩 Phase 1/2
    研究，其他代谢和神经科资产则靠收购及合作获得的递送技术支撑。它的差异化叙事落在三点：垂直整合的载体设计、高规模 GMP AAV 制造，以及愿意瞄准更大的慢性病市场，而不只做超罕见适应症。相对于可见公开数据，公司的资本底座异常大：截至
    2025 年 9 月 Series D，已确认公告融资至少 $920.5 million，但未披露估值、烧钱速度或商业化牵引指标。
