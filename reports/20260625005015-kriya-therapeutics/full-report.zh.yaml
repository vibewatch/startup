        title: 里程碑与战略演进
        blocks:
          - type: paragraph
            body: >-
              里程碑节奏很重要，因为 Kriya 花了几年先搭垂直整合引擎，之后才展示出明确临床过渡。制造能力很早就到位：2020 年收购设施，2021 年完成翻新和 cGMP
              套间，并公开宣称从研究到商业规模采用一致的平台工艺。战略范围通过合作与收购扩大：Twist 合作拓展了抗体发现能力，Redpin 带来面向神经科的化学遗传学，Tramontane 带来用于 MASH 的
              FGF21 生物学，Everads 则贡献脉络膜上腔眼部递送。到 2024 年，管理层称首批候选产品正在进入临床，并预计到 2025 年底最多五个项目在临床；到 2025 年 5 月，公司称 KRIYA-825
              针对地图样萎缩的 Phase 1/2 研究已经启动。这些里程碑支持一个判断：Kriya 已不再只是平台故事。但反面事实是，相对于已消耗资本，外部观察者仍看到异常少的公开临床数据；Labiotech 在 2025
              年 9 月就把 Kriya 超过 $900 million 的融资底座与其有限的公开临床披露并列，明确提出这一批评。
