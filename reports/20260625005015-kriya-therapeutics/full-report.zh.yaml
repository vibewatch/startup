      - number: '7.4'
        title: 报销与商业模式风险
        blocks:
          - type: paragraph
            body: >-
              Kriya
              长期最严重的单一风险，是在一个尚未证明能按常见病规模为基因疗法买单的报销环境里商业化失败。已经获批的基因疗法都瞄准罕见或超罕见疾病：患者人群小，可以支撑极高的单患者定价，支付方的支付意愿也相对清楚。Kriya
              的地理萎缩项目瞄准美国和欧盟约 200 万名患者——这个患者池比典型罕见病基因疗法市场大 100 倍以上。把一个 200 万患者疾病的疗法按罕见病标价定价（每名患者 $850,000 至 $3.5
              million）在商业上说不通；但若要把价格降到能打进 GA 市场的水平，又需要制造经济性在规模化下成立，而行业还从未证明过这一点。

              已获批的罕见病基因疗法已经暴露出商业脆弱性。Hemgenix（etranacogene dezaparvovec，CSL Behring，2022 年获批）标价 $3.5
              million，却因支付方抵触而商业放量极小。Pfizer 虽拿到 FDA 批准，仍在 2025 年将 Beqvez 撤出美国市场。商业化基因疗法先行者 bluebird bio 拥有获批产品 Zynteglo
              和 Skysona，市值却从 $8.74 billion 峰值跌到 2025 年 6 月约 $48 million、接近资不抵债。Kriya
              面前的路可以从这些案例直接读出：即使监管获批，商业成功也没有保证；商业失败已有先例。

              地理萎缩主要影响老年人；绝大多数美国患者都是 Medicare 受益人。CMS 对高价基因疗法的 Medicare 覆盖仍不确定，历史上也一直对新模态偏保守。ICER
              的健康技术评估框架经常认定基因疗法标价超过成本效果阈值，进一步加大支付方阻力。Kriya 尚未披露任何项目的商业定价策略、按效果付费合约方案、患者准入计划或支付方沟通路线图。Sachiyo Minegishi
              2026 年 1 月出任 CFO，且曾在 Akouos 和 bluebird bio 任职，对商业化规划是正面信号，但这只是能力拼图中的一块，并不能证明商业路径已经打通。
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR033
      - number: '7.5'
        title: 合作方、政治与治理风险
        blocks:
          - type: paragraph
            body: >-
              Kriya 的融资结构让 Patient Square Capital 拥有不成比例的影响力：该机构领投 Series B（$100 million，2021 年），并共同领投 Series D（$320
              million，2025 年），覆盖已确认公告资本约 45%。如果单一 GP 出于战略或组合层面决定减少支持、退出或重新谈判，公司在距离首次获批仍有多年、且依赖现金的阶段，可能承受显著融资压力。2025 年 8
              月 SEC Form D 显示，公司只从两名投资者处募得 $313.3 million，说明在 Series D 前阶段，成熟资本提供方范围很窄；若这种集中度延续到下一轮，就是结构性融资风险。

              Series D 中三名具名投资者——J.D. Vance（现任美国副总统）共同创立的 Narya Capital、Peter Thiel、The T1D
              Fund——都带来政治和意识形态关联，在当前监管气候下会放大审视风险。Labiotech 明确指出，CEO Shankar Ramaswamy 与其兄弟 Vivek Ramaswamy（亿万富豪、Roivant
              Sciences 创始人、政治候选人）的关系，会引发交易来源和治理独立性问题。J.D. Vance 在任参议员期间披露的 $50,000 至 $100,000
              投资，以及其随后升任副总统，形成了政治对手可利用的潜在利益冲突观感。上述关联均未被指控构成违法，但它们会提高未来公开市场退出或与政府支付方发生商业关系时的治理透明度风险。

              对外授权技术的 IP 依赖进一步增加结构性风险。KRIYA-825 基于 MUSC Foundation for Research 的授权；KRIYA-748 使用 Redpin 从 Howard Hughes
              Medical Institute 授权的化学遗传学 IP；KRIYA-497 则使用通过收购 Tramontane 获得的 UAB FGF21
              生物学成果。授权被撤销、版税上调、再授权受限，或大学衍生公司被竞争对手收购，都可能扰乱单个项目。完整董事会构成和独立董事配置并未公开披露，因此无法从公开资料验证治理保护措施。
