      - number: '2.5'
        title: 附录
        blocks:
          - type: callout
            title: 相比传统 AAV 适应症，患者池巨大
            body: >-
              Kriya 的五个适应症合计代表美国 + 欧盟约 48.4 million 患者，而已获批 AAV 药物典型人群低于 100,000。即便渗透率温和（1-5%），常见病 AAV 的商业天花板也比血友病 B 或
              SMA 市场高一个数量级。仅 GA 适应症（美国 + 欧盟约 2M）就是全球血友病 B 患者人数（全球约 38K）的 50 倍。如果临床和商业转化能够跑通，这一市场规模足以支撑 $920M+ 的资本搭建。
            calloutType: strength
            claimRefs:
              - CM001
              - CM003
              - CM035
          - type: callout
            title: AAV 市场规模估计相差 5 倍，SAM 无法分离
            body: >-
              四个主要分析师对全球 AAV 基因治疗市场的估计，在 2035 年预测端相差超过五倍（$21.6B vs. $112.2B），且没有一个为 Kriya 特定的常见病 AAV 子细分提供专门
              SAM。这种不确定性不只是方法噪音——它反映了真实未知：有多少常见病项目会获批、定价多少、支付方支持到什么程度。若投资人用标题 TAM 数字为一家没有获批产品的公司估值背书，应对这些数字大幅打折。
            calloutType: risk
            claimRefs:
              - CM017
              - CM040
          - type: callout
            title: Medicare 主导 GA 市场——报销路径尚未探明
            body: >-
              美国大多数地图样萎缩患者符合 Medicare 资格（65 岁以上），截至 2026 年 6 月，CMS 尚未发布常见病 AAV 基因治疗的覆盖政策。让血友病 B
              基因治疗（HEMGENIX、Beqvez）得以成立的高额一次性定价模式，适用于狭窄罕见病人群；一旦套到 2 million 名 GA 患者，就会遇到结构性阻力。基于结果的质保（Pfizer 的 Beqvez
              模式）正在出现，但需要多年持久性数据。Kriya 尚未披露定价策略或支付方沟通进展。
