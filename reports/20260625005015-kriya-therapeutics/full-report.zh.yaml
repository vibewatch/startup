      - number: '6.5'
        title: 集中度风险、支付方准入障碍与商业化就绪缺口
        blocks:
          - type: paragraph
            body: >-
              Kriya 处于商业化前阶段，常规客户风险指标（NRR、GRR、churn、集中度）无法报告。因此，本节记录 Kriya 未来客户关系将面对的结构性风险。

              单一资产集中：KRIYA-825 是临床推进最靠前的资产，也似乎获得最多外部验证（ARVO 报告、具名 KOL 参与、Everads 合作）。如果 KRIYA-825 在 Phase 1/2
              安全性或有效性评估中失败，整个业务组合会在近期失去最可信的商业路径。JPM 2024 更新曾预期「到 2025 年末最多五个项目进入临床」——截至 Labiotech 2025 年 9
              月报道，只有两个项目（KRIYA-825 和 KRIYA-748）确认进入临床，说明执行相对早先预测滞后。

              Medicare 主导 GA 适应症的支付方准入风险：GA 患者以老年人为主（70 岁以上），如果 KRIYA-825 获批，Medicare Part B 将成为主导支付方。Medicare Part B
              按「buy-and-bill」模式，以 ASP+6% 或协商费率报销医生给药药物。Beqvez 这类高价一次性基因治疗（标价 $3.5M）在 Medicare 场景中商业采用率低；Pfizer 于 2024
              年以商业采用不足为由将 Beqvez 撤出美国市场。Hemgenix（血友病 B，对较年长患者同样接近 Medicare）和 Beqvez
              的先例说明，在流行性、较年长患者适应症中，获批基因治疗的商业可行性仍未被证明。

              不利竞争压力：截至 2025 年中，至少还有 10 个其他靶向 GA 的项目处于临床开发（Retinatoday 2024 管线概览），其中多个已有 Phase 3 数据。如果任何竞争者先于 KRIYA-825
              获批，它可能建立处方医生习惯和支付方覆盖政策，使第二个进入市场的产品更难推进。

              免疫原性和患者筛查负担：AAV 基因治疗需要治疗前抗体筛查，以排除对 AAV 衣壳有高滴度中和抗体的患者。Beqvez 标签要求进行这类筛查。根据衣壳血清型和适应症不同，这会使合格患者人群减少约
              20-40%，同时增加医生负担，并使实际可触达人群相对表面患病率数字缩小。

              平台扩张作为风险缓释：Kriya 的五适应症管线意在缓释集中度风险——单一适应症失败不应终结公司。不过，Labiotech（2025 年 9
              月）的不利观察指出，「这些药物的进展还有很多不为人知」，且「候选药物正在从管线中消失」，说明多适应症执行风险真实存在，平台并不保证风险能够按比例分散。

              任何客户细分都没有可用的 NRR、GRR、churn、留存 cohort 或满意度数据。这些缺口无法用公开证据弥补，是任何评估 Kriya 商业化就绪程度的投资者或伙伴提出的核心尽调要求。
