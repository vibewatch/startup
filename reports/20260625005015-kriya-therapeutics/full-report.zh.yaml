      - number: '2.3'
        title: 按适应症拆分买方、用户与支付方
        blocks:
          - type: paragraph
            body: >-
              Kriya 的五个适应症对应显著不同的买方-用户-支付方结构，这会影响上市顺序、报销策略和制造物流。KRIYA-825（地图样萎缩）的买方和用户是学术或社区视网膜诊所的视网膜专科医生，主要支付方是
              Medicare Part B（医生给药生物制剂），因为 GA 患者平均年龄超过 70 岁——NEI 数据显示 AMD 患病率在 55 岁后急剧上升。KRIYA-825
              的脉络膜上腔递送可在诊室或日间手术中心完成，相比手术室场景降低设施成本。

              KRIYA-586（甲状腺眼病）的处方医生是神经眼科医生或眼整形外科医生，当前标准治疗的支付关系由医院门诊输注计费主导，因为 Tepezza 通过 IV 给药。若获批，Kriya
              的局部眶周注射路径可在专科诊所完成。TED 在美国 + 欧盟约有 1 million 受影响人群，但需要系统治疗的重症子集更小；商业保险比 Medicare 更突出，因为 TED 通常发生在患有 Graves'
              disease 的较年轻成人。

              KRIYA-839（T1D）的处方医生是内分泌科医生，支付方则混合了商业保险（儿童和劳动年龄成人）与 Medicare（65 岁以上 T1D 成人）。Kriya
              的肌内递送路线在临床上比眼内或静脉路线更简单，但年轻起病慢性病若要让支付方接受一次性治愈主张，所需的长期持久性数据在公开记录中仍缺位。TN
              的初始目标是药物难治患者——已经轮换过抗惊厥药、正在考虑手术的人群。神经科医生和疼痛专科医生掌握转诊；商业保险和 Medicare 根据患者年龄共同承担覆盖。

              MASH（F3/F4 阶段、以肝脏病变为主）拥有最大的总患者池（美国 + 欧盟 40 million），但需要肝病专科医生把关，并面临一个特定挑战：MASH
              的疾病进展可通过体重管理稳定甚至逆转，这让一次性高价治疗的收益-风险门槛变得复杂。若价格达到任何具有商业意义的水平，Medicare 和商业支付方很可能要求强有力的生物标志物数据（肝活检或
              MRI-PDFF）作为事先授权条件。
