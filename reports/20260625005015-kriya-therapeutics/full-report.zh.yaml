      - number: '3.5'
        title: 护城河持久性与竞争风险评估
        blocks:
          - type: paragraph
            body: >-
              Kriya 的竞争护城河建立在三根宣称支柱上：多适应症 AAV 平台、商业规模内部 cGMP 制造，以及新型递送技术（GA 的脉络膜上腔、TED
              的眶周递送、神经科的化学遗传学）。每根支柱的持久性都面临不同风险。平台优势在原则上真实存在——多数基因治疗同行是单适应症或窄领域专科公司——但尚未被临床证明保护：截至 2025 年 5 月，Kriya
              只有一个项目（KRIYA-825）处于 Phase 1/2，且未披露疗效读出。制造优势在公司官网上表述很强（3,000L
              生物反应器，从研究到商业采用相同单元操作），但尚未通过公开批记录、监管文件或同行评议数据独立验证。几家公开可比公司（uniQure、Sarepta）也运营规模化内部制造，削弱了 Kriya
              仅靠这一向量的差异化。递送技术差异化是最新颖的护城河元素：脉络膜上腔注射不同于标准 IVT，KRIYA-748
              针对疼痛的化学遗传学路径在基因治疗领域独特。不过，新型递送也带来监管证明负担；脉络膜上腔路径必须先在人体 GA 患者中验证长期安全性和转导效率，才会形成持久优势。最实质的竞争风险来自已获批治疗层面的替代：如果
              Annexon 的 ANX007 在 Phase 3 成功，或 Alkeus 的口服疗法获得广泛处方，流向一次性注射试验的 GA
              患者可能放缓。大药企既有玩家（Janssen、Astellas、Novartis、Roche）拥有更强分销和监管信任；如果其中任何一家把既有眼科业务版图转向类似 Kriya 的 AAV
              治疗模态，竞争反应可能迅速且资源充足。
