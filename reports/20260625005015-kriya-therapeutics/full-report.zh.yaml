    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与运营版图
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Kriya Therapeutics 将自己定位为一家临床阶段生物制药公司，押注的是面向常见慢性病的一次性基因治疗，而不是罕见病小众玩家。公司官网和近期融资稿都把核心定位说得很直接：Kriya
              想把基因治疗做成「面向多数人」可及，靠经过验证的生物学、更低成本且可扩展的 AAV 制造，以及直接递送到组织。公开材料显示，公司对自身版图的描述已经明显变化。早期融资和制造公告使用 Redwood City
              或更宽泛的 Silicon Valley 发稿地，2023 年以后材料则越来越多使用 Palo Alto 和 Research Triangle Park。最稳妥的工作结论是，Kriya 在 Bay Area
              保留领导层和设计能力，同时把制造以及越来越多的临床运营锚定在 RTP。最新披露的公开管线集中在眼科、代谢疾病和神经科。
