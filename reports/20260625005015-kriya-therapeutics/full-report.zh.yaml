            title: 月度 burn 代理值应视为下限，而非均值估计
            body: >-
              唯一披露的现金数据点是：2024 年初有 $325 million，资金续航延伸到 2026 年末（33 个月 → 隐含约 $10M/month）。该基线早于多个项目进入或接近临床，也早于多项目 GMP
              生产活动放量。2025 年已有两个项目确认进入临床，加上额外 pre-IND 支出，2024–2025 年实际现金消耗很可能超过 $10M/month。$10M 应视为结构性下限；对于一家处于这一阶段、同时运行
