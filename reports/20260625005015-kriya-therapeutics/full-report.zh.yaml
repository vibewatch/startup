  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构与三支柱引擎
        blocks:
          - type: paragraph
            body: >
              Kriya 将自身研发方法描述为一个基因治疗「产品引擎」，由三个基础支柱构成：转化研究、计算生物学和可扩展制造。三者紧密共整合，而不是各自为政。在计算层，SIRVE™（System for Intelligent
              Rational Vector Engineering）用专有算法、机器学习和生成式深度学习，工程化设计每个 AAV
              载体的每一个单独组件。每个项目会生成数十种构建体变体，并用同一套内部生产基础设施，同步筛查可制造性、生物学表现和免疫画像。STRIPE™（System to Realize Improved Production
              Efficiency）是配套制造平台，把细胞系技术进展与上游、下游工艺工程结合起来，以便在规模化生产中降低单剂量生产成本。两个平台从最早发现阶段一直部署到临床制造。Kriya
              称，这能消除破坏性的工艺变更，避免效价被侵蚀或引入可比性风险。其 R&D
              工作流把这种整合制度化：蛋白工程、载体基因组设计、从已临床验证血清型中选择衣壳、可制造性评估、给药路径选择，都作为并行而非串行工作流推进。衣壳选择刻意限制在已验证血清型内，以降低 IND
              阶段的免疫学不确定性。计算工具也覆盖用于改进第一代生物制剂的生成式方法。公开口径上，SIRVE 和 STRIPE 在 2021 年 Series B 时被命名为独立技术平台，并在截至 2026
              年的制造和产品设计材料中继续被引用；不过 Kriya 当前外部传播已把词汇转向更宽泛的「平台」叙事，而不再突出单个系统名称。ASGCT 2026 报告——覆盖残留宿主细胞 DNA 的新型 ddPCR
              检测、载体化胰岛素的细胞效价检测，以及 AAV1 与一次性生物工艺袋的兼容性——是最近的公开信号，表明平台分析开发项目仍在跨管线推进。
