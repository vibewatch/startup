        - Syfovre（每月 / 每两月玻璃体内注射，C3 抑制）或 Izervay（每两月，C5 抑制）
        - KRIYA-825 一次性脉络膜上腔注射，表达 CR2-CR1 融合蛋白（C3+C5 双重阻断）
        - 单次就诊即可用 AAV 转导 RPE / 脉络膜，实现多年补体抑制；去掉反复注射负担
        - 人体临床疗效未证实；竞争对手 Complement Therapeutics（CTx001）也已进入临床
