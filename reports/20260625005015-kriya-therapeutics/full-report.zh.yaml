      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 行业层面的安全性先例直接不利，不能轻描淡写
            body: >-
              2025 年基因疗法安全性记录，给 Kriya 造成直接的行业层面监管风险。FDA 在两名患者死亡后要求暂停 Elevidys 发货（Sarepta）、因血癌信号收窄 Skysona 的获批人群（bluebird
              bio）、Pfizer 在商业失败后主动撤回 Beqvez，这些事件都发生在本报告前十二个月内。它们与 Kriya 的管线在结构上相似：均为 AAV 基因疗法，均由专科医生给药，且均已获得 FDA
              批准或处于后期临床阶段。Kriya 必须按这种监管环境设计 Phase 1/2 安全监测方案——安全管理中任何模糊地带都会被放到这些先例下审视。投资者在承诺下一轮融资前，应要求公司披露详细的 DSMB
              构成、停药规则和 SAE 报告规程。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR008
          - type: callout
            title: 常见病基因疗法报销仍是全行业未解题
            body: >-
              Hemgenix、bluebird bio 的 Zynteglo 和 Skysona、以及 Pfizer Beqvez 的商业失败说明，FDA
              批准是基因疗法商业成功的必要条件，但远远不充分——即便在罕见病中也是如此。Kriya 的地理萎缩项目瞄准 200 万名患者，其中大多数为 Medicare
              受益人；支付方环境从未成功按这种规模为基因疗法买单。没有一家上市公司证明常见病基因疗法定价存在商业可行路径。bluebird bio 拥有获批产品和先发优势，市值仍从 $8.74 billion 跌到 2025
              年 6 月接近资不抵债的 $48 million。Kriya 的 GA 商业策略残余风险已达到投资逻辑破裂级别，且公司没有公开披露定价或支付方沟通计划。
            calloutType: risk
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
          - type: callout
            title: 资本效率问题是结构性的，不是周期性的
            body: >-
              Kriya 已募集超过 $920 million 已确认资本，但只有两个项目处于早期 Phase 1/2，另有七个项目处于临床前或支持 IND 申报阶段。Labiotech
              的批评——“候选项目从管线中消失、开发期限落空、缺乏透明度”——反映的是平台投入先于临床产出的结构性模式，而非暂时延期。2020 年最初项目中已有三个悄然停止；MASH IND
              至少错过公开承诺期限十二个月；JPM 2024 提出的 2025 年底前五个项目进入临床也未实现。在这种背景下，Series D 仍超额认购，Patient Square Capital
              继续加码——说明成熟资本即便面对临床滞后，仍在押注制造平台逻辑。但尽调要求必须尖锐：在认定建设期已经结束而非仍在继续之前，投资者应要求公司给出明确的资本效率跟踪表（每个达到 Phase 2
              临床项目消耗的美元），并与可比基因疗法项目对照。
