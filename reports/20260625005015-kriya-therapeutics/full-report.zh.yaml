  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 基因治疗行业监管与安全风险
        blocks:
          - type: paragraph
            body: >-
              Kriya 处在生物制药监管强度最高的一层。所有 AAV 基因治疗都需要提交 Biologics License Applications（BLA），由 FDA 的 Center for Biologics
              Evaluation and Research（CBER）审评，并以大量 CMC 文件、最长覆盖给药后 15 年的长期随访方案，以及针对插入突变理论风险的遗传毒性研究作为支撑。FDA approved-CGT
              产品清单确认，美国只批准了少数非 CAR-T 基因治疗，且多数靶向超罕见病——这为 Kriya 的流行病策略设定了很低的监管先例基础。

              2025 年行业背景极度不利。FDA 在发现血癌风险升高后，收窄了 bluebird bio 的 Skysona（脑肾上腺脑白质营养不良基因治疗）覆盖范围；在两名患者死亡后，FDA 要求 Sarepta
              Therapeutics 暂停 Elevidys（DMD 基因治疗）出货——截至 2025 年 8 月，两起事件均由独立行业来源记录。Pfizer 于 2025 年自愿将其 FDA 批准的血友病 B 基因治疗
              Beqvez 撤出美国市场，理由是商业可行性。这些事件都没有直接涉及 KRIYA-825 或 KRIYA-748，但它们说明：获批基因治疗可能产生致命不良事件、触发 FDA 限制，并在商业上失败——这些都是
              Kriya 开发路径上的合理可能结果。

              AAV 特异安全风险包括免疫原性：一般人群中普遍存在针对 AAV 衣壳血清型的既有中和抗体（NAbs），Pfizer Beqvez 的 FDA 批准标签明确要求治疗前 NAb 检测，并排除血清阳性患者。超过
              70% 的 Beqvez 患者出现由针对 AAV 衣壳的 T 细胞免疫反应驱动的肝毒性（转氨酶升高），超过 50% 需要皮质类固醇治疗。KRIYA-825 的脉络膜上腔注射路径很新，使操作安全性画像以及临床前
              NHP 研究所用 Everads 脉络膜上腔注射器的设备监管路径都存在监管不确定性。KRIYA-748 向三叉神经进行 CNS 注射，本身带有操作安全风险，需要在 Phase 1/2
              剂量递增中谨慎管理。每个适应症还需要单独 IND 申报；任何一个项目遭遇临床暂停，都可能扰乱更广泛的开发时间线。
