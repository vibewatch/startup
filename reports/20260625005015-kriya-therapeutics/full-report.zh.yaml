      - number: '6.4'
        title: 具名伙伴、投资者和专科验证可作为客户证明替代项
        blocks:
          - type: paragraph
            body: >-
              没有商业客户时，需求验证最好的可得证据，来自三类已经向 Kriya 临床项目投入资本、技术或职业声誉的具名利益相关方。

              递送技术合作（Everads Therapy）：2023 年 9 月，Kriya 与 Everads 宣布一项独家许可、合作和供应协议，覆盖多个眼科基因治疗项目。Everads 执行主席兼 CEO Moshe
              Weinstein 公开表示，「我们的脉络膜上腔递送技术为新型眼科治疗提供了潜在跃迁」。这项合作意味着 Everads 作为一家对验证递送路径有直接商业激励的技术公司，已经承诺把 Kriya
              作为其视网膜项目的基因治疗伙伴。截至 2026 年 5 月，Everads 新闻页确认，Everads 技术将在 ARVO 2026 的三场海报报告中出现，且首次人体临床数据已发表于 American
              Academy of Ophthalmology 的同行评议期刊 Ophthalmology Science。Everads 设备获得临床验证，为 KRIYA-825 递送路径的可行性增加了间接支持。

              疾病倡导投资（T1D Fund / Breakthrough T1D）：T1D Fund 是最大 T1D 患者倡导组织 Breakthrough T1D 的投资子公司，也是 Kriya 2025 年 9 月
              Series D 融资的具名参与方。T1D Fund 的使命明确是通过投资「催化面向治愈 T1D 的疗法开发」，并称自身代表被投公司利用「其庞大的研究、临床、监管和医学事务网络」。T1D Fund 投资
              Kriya，是目前最接近的可得信号，说明有组织的 T1D 患者和倡导利益相关方已经验证 KRIYA-839 的临床逻辑。

              战略 PE 投资者验证（Patient Square Capital、Premji Invest）：Patient Square Capital 领投 Kriya Series B，并再次领投 Series
              D。Managing Partner Jim Momtazee 公开表示：「自 Patient Square 于 2021 年领投公司 Series B 融资以来，我们一直自豪地支持
              Kriya，并对团队愿景以及平台的科学和商业潜力印象深刻。」共同领投 Series D 的 Premji Invest 的 Akshay Rai
              表示，其投资论点「围绕公司先进制造平台展开，该平台旨在支持面向大市场流行疾病的基因治疗开发和商业化」。这些具名投资者声明，是一家未创收生物技术公司目前最接近商业买方验证的公开替代证据。

              具名专科 KOL 背书（Quan Dong Nguyen, MD, Stanford）：Everads 合作新闻稿包含 Stanford University School of Medicine Byers
              Eye Institute 眼科教授 Quan Dong Nguyen, MD, MSc, FARVO, FASRS 的公开声明。他表示：「地理萎缩会造成致残性视力丧失……通过脉络膜上腔注射递送、靶向 C3 和
              C5 通路的基因治疗，可能显著改善地理萎缩治疗。」这位领先学术中心资深视网膜专科医生的具名背书，是有意义的证据，说明目标处方医生群体认可 KRIYA-825 所针对的未满足需求。

              所有这些验证来源都是间接且面向未来的。它们都不能构成商业交易、患者付款或支付方覆盖决定的证据。它们代表尽调投资者关心的信号：相关利益相关方生态已经验证 Kriya 的临床论点；但它们不是传统意义上的商业客户证明。
