      - number: '8.3'
        title: 融资结构、Form D 对账与隐含估值
        blocks:
          - type: paragraph
            body: >-
              本章最重要的估值发现是一项对账，而不是一个新数字。前文无法判断 2025 年 8 月 Form D（$313,297,440，两名投资者）与 2025 年 9 月 Series D
              新闻周期代表一笔融资还是两笔融资。2025 年 9 月 10 日提交的修订 Form D/A 给出了答案：它报告总发行金额为 $320,822,412，覆盖十名投资者，首次销售日期为 2025 年 7 月 31
              日。Form D/A 是对原始申报的修订，而非单独募资，因此 Series D 总额为 $320.8 million——$313.3 million 原始申报和 $320.8 million
              修订文件描述的是同一交易，只是随着更多投资者完成交割而增加。EDGAR 申报历史确认 2020 至 2025 年共有七份 Form D 文件，其中两份 2025 年文件构成一笔 Series D
              发行。这样就排除了“相加还是重叠”的重复计算，否则终身资本会被高估；已确认基础应锚定在约 $920.5 million，而非公司声称的 “>$1.2 billion”。

              任何申报文件都没有披露每股价格或投后估值，因此只能从稀释率常态推算隐含估值。按典型生物技术公司 15% 至 25% 的稀释率，$320.8 million Series D 隐含投后估值约为 $1.3
              billion（25% 稀释）至 $2.1 billion（15% 稀释）。这是一项推断，不是披露事实，应视为规划区间而非标记。若叠加较上一轮上调和超额认购，一个可辩护的进入纪律视角会把实用区间放宽到
              $1.5–2.5 billion。此处附带的敏感性和区间图，将这些稀释假设转化为可供投资委员会讨论的明确估值结果。
