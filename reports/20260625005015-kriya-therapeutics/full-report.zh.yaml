      - number: '7.6'
        title: 人才、融资与投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              相比已经消耗的资本，领导班子补强来得偏晚。CMO Greg Di Russo（2025 年 12 月任命）带来 Pfizer 开发经验，包括监督 Beqvez，为公司补上直接的 AAV
              基因疗法监管经验；但任命发生在公司主导项目进入 Phase 1/2 之后，这意味着 KRIYA-825 试验最初至少六个月里，临床开发战略在没有 CMO 的情况下推进。CFO Sachiyo
              Minegishi（2026 年 1 月任命）拥有 Akouos 和 bluebird bio
              经历，适合基因疗法商业化规划；但截至本报告日期，她搭建预商业化财务架构仅五个月。两项任命确实增强了能力，但也说明公司在很大一段资本消耗最密集的发展期里，执行层板凳存在明显缺口。

              CEO Shankar Ramaswamy 同时担任联合创始人、董事长和
              CEO，形成创始人集中风险。无论何种原因——包括其家族关系带来的政治曝光——一旦他离职或严重分心，都会制造可能威胁公司的领导层不稳定。科学联合创始人兼 Chief Gene Therapy Officer J.
              Fraser Wright 提供制造和 CMC 深度，但 CEO 战略职能没有明显的内部继任路径。

              最关键的投资逻辑破裂情景是组合事件：KRIYA-825 Phase 1/2 出现不利安全性数据并触发临床暂停，同时下一轮融资到期。公司的当前现金头寸和烧钱速度并未公开披露；最后一个披露数据点（$325
              million 现金、跑道延至 2026 年末）早于 2025 年 9 月 Series D 二十个月，已经明显过时。如果 Series D 后跑道从 2025 年 9 月起为三到四年，公司将在
              2028–2029 年面对下一轮融资决策；届时必须拿出临床 Phase 2/3 数据，才能在非困境估值下吸引资本。下文列出的五项终止标准，是最会直接损害投资逻辑的监测绊线。
