      - number: '8.2'
        title: 投资逻辑与反逻辑
        blocks:
          - type: paragraph
            body: >-
              多头逻辑由四个相互强化的论点支撑。第一，Kriya 拥有内部搭建、具备 GMP 能力的 AAV 制造平台，投资者 Premji Invest 曾将其称为结构性差异点；相比外包同行，该平台可降低长期
              COGS。第二，公司建立了异常深厚的资本基础——按申报文件锚定口径，Series A 到 D 已确认约 $920.5 million——足以换来多次试错机会。第三，Series D
              被描述为超额认购且估值显著上调，投资者财团可信：Patient Square 从 Series B 继续跟投，Premji Invest 带来机构规模，T1D Fund 增加使命契合度，Peter Thiel 的
              Narya Capital 则提供技术导向视角。第四，目标适应症——地理萎缩和其他常见慢性病——市场巨大，若一次性持久疗法成立，有机会获得溢价定价。

              反逻辑同样具体，而且在当前记录下证据更强。KRIYA-825 到 2025 年 5 月才进入 Phase 1/2，尚未产生人体疗效数据；披露的最强证据仍是 2025 年 ARVO 临床前包，包括小鼠 NaIO3
              模型和非人灵长类生物分布。Labiotech 2025 年 9 月调查称，公司“尽管管线进展不多，却募集超过 $1.2 billion”，并标出治理和政治关联问题。公司自己的 “>$1.2 billion”
              数字高于 Form D 文件实际可证实金额。烧钱速度未披露，因此无法检验资本是否充足。每个投资逻辑支柱都有一个可证实或击穿它的具体证据事件；这些触发点列在投资逻辑 / 反逻辑表中。
