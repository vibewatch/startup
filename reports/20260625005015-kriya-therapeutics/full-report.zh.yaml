      - number: '6.2'
        title: 按适应症映射未来买方、使用者和支付方界面
        blocks:
          - type: paragraph
            body: >-
              Kriya 披露的五个适应症各自拥有显著不同的买方-使用者-支付方配置，这将塑造商业策略和市场准入要求。

              地理萎缩（KRIYA-825）：处方方是学术或社区视网膜诊所中经委员会认证的视网膜专科医生，这与目前两款 FDA 批准 GA 治疗（Syfovre 和
              Izervay）一致，后者由视网膜专科医生给药。Syfovre 处方标签规定由眼科医生进行玻璃体内注射；KRIYA-825 通过 Everads Injector
              采用脉络膜上腔路径，类似地可由视网膜专科医生在诊室或门诊手术中心完成。GA 典型患者年龄超过 65 岁（按 NEI，AMD 影响约 1,100 万美国人，55 岁后患病率急剧上升），因此 Medicare
              Part B 是主导支付方。Part B 按「buy-and-bill」模式覆盖医生给药生物制剂；在流行性慢性疾病中，基因治疗通过这一渠道报销仍处于未解决阶段。Hemgenix $3.4 million 标价和
              Zolgensma $3.5 million 价格显示，基因治疗标价高于传统 Medicare 报销常规，给流行性 Medicare 受益人群带来特定的支付准入摩擦。

              甲状腺眼病（KRIYA-586）：TED 是一种自身免疫病，影响约三分之一 Graves 病患者；American Thyroid Association 指出，只有 5%
              会出现需要全身治疗的重度眼部表现。处方方是神经眼科医生、眼整形外科医生或内分泌科医生；当前标准治疗（Tepezza、teprotumumab）在临床输注场景中通过 IV 输注给药。KRIYA-586
              的眼球周围注射路径可由专科医生在诊室完成。TED 常见于患 Graves 病的工作年龄成年人，因此商业保险主导支付方结构。

              1 型糖尿病（KRIYA-839）：处方医生是经委员会认证的内分泌科医生或儿科内分泌科医生。支付方结构横跨商业保险（儿童和工作年龄成年人，按 NIDDK，约 170 万确诊 T1D 成年人使用胰岛素）和
              Medicare（65 岁以上 T1D 成年人）。T1D Fund 投资 Kriya Series D，显示主要 T1D 患者倡导组织（Breakthrough T1D）已经验证 KRIYA-839
              的临床逻辑。肌内递送在操作上比眼内或 IV 路径更简单，会降低采用时的操作场地门槛。

              MASH（KRIYA-497）：肝病医生和胃肠科医生很可能是 F3/F4 纤维化阶段 MASH 患者的处方方。考虑到 MASH 与各年龄段代谢综合征相关，较年轻患者支付方可能是商业保险，较年长患者则是
              Medicare。MASH 尚无 FDA 批准基因治疗；该适应症是 Kriya 管线中临床推进最少的项目。

              三叉神经痛（KRIYA-748）：处方医生是神经科医生或疼痛专科医生；对已轮换抗惊厥药且药物难治的患者，初级保健医生会转诊。NINDS 指出，TN 每年影响约 150,000 名美国人；NORD 数据库列出约
              400,000 名美国 + 欧盟患者。商业保险和 Medicare 按患者年龄共同覆盖。
