        - 将 KRIYA-825 非手术递送至 RPE / 脉络膜的脉络膜上腔设备
        - 独家供应协议；Everads 为单一来源设备
        - 单一来源设备风险；设备故障或供应中断会叫停 KRIYA-825 项目
      - - 化学遗传学离子通道（HHMI 许可）
        - 让 KRIYA-748 和 KRIYA-382 实现 varenicline 门控的神经元沉默
        - 通过收购 Redpin 获得 Howard Hughes Medical Institute 独家许可
        - IP 依赖 HHMI 许可条款；varenicline 在 CNS 中的相互作用谱需要人体验证
      - - 51,000 sq ft RTP GMP 设施
        - 从研究到商业化的瓶到瓶制造
        - 多产品排产；2021 年起运营；多项目同步生产活动
        - 单一场地运营风险；产能排期未公开披露；没有第二制造场地
      - - 学术合作（UAB、NIH）
        - 基础临床前生物学；AAV-FGF21 数据由 UAB 生成
        - 获取动物模型、转化数据和科学顾问意见
        - 临床前验证依赖合作伙伴；外部生物学必须能转化到 Kriya 载体上
