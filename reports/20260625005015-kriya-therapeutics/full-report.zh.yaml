        - 对宿主细胞残留 DNA 和功能性转基因产物做 QC 放行检测
        - 经过验证且被 FDA 接受的检测；与临床结果相关
        - 新检测可能需要监管确认；效价与疗效的相关性尚未在人体建立
      - - 衣壳库（仅限已验证血清型）
        - 为各项目的目标组织嗜性选择血清型
        - 已知临床 AAV 血清型（如肌肉用 AAV1、CNS 用 AAV5）
        - 既有中和抗体可能让多达 40-60% 患者失去资格
