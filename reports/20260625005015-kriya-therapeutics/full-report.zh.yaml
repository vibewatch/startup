      - number: '7.3'
        title: 制造、CMC 与运营风险
        blocks:
          - type: paragraph
            body: >-
              Kriya 的投资论点把制造差异化放在价值主张中心：公司声称，其 Research Triangle Park 设施可用统一平台工艺，在 1L 到 3,000L 规模生产任意 AAV
              血清型，避免临床生产和商业生产之间昂贵的技术转移事件。如果这一主张成立，它能相对依赖 CDMO 的竞争者提供持久成本优势。如果这一主张在商业规模或多产品 GMP 条件下不成立，差异化故事的核心支柱就会消失。

              由于没有产品获批，公司尚未执行任何商业规模生产活动。制造平台完全没有经受商业供应监管门槛验证——这是公司放大主张与 FDA 和 EMA 未来 BLA 中 Chemistry, Manufacturing, and
              Controls（CMC）部分要求之间的重大区别。AAV 制造历史上属于技术要求最高的大分子工艺之一。早期平台开发中的批次失败率具有实质性，空衣壳污染是持续质量挑战，从台架到试生产、GMP
              临床再到商业规模的放大，可能暴露产量不一致，从而需要工艺变更和再验证周期。声称 50L 到 3,000L 不需工艺变更地连续放大，是竞争性主张，还不是已被证明的监管事实。

              多产品 GMP 设施会在九个管线项目同时推进时引入排产冲突和交叉污染风险。公司披露「活跃 GMP 制造运营正在进行，多个管线项目开展多项大规模生产活动」，但不披露批次成功率、单个生产活动产量或单剂量
              COGS。KRIYA-825 NHP 研究中使用的 Everads Therapy 脉络膜上腔注射器，带来单一来源设备依赖，叠加 FDA 组合产品复杂性（药物-设备组合需要协调监管策略）；如果 Everads
              遭遇技术或财务困难，还会产生供应链风险。
