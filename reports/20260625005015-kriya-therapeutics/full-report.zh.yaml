            - 中——效力测定开发中；平台已投入生产
            - 低——多点 IM；NHP 耐受性数据正在生成
            - 低——尚无公开确认的监管认定或 IND 状态
            - IND-enabling
        - label: KRIYA-497（MASH）
          values:
            - 中——FGF21 生物学已在 FGF21 类似物试验中验证；AAV 路径仍仅为临床前
            - 中——与 KRIYA-839 相同的 AAV1 IM 平台
            - 低——仅有动物模型；骨骼肌 NHP 未单独报告
            - 低——未确认监管认定
