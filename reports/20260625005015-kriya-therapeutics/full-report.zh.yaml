      - number: '5.6'
        title: 技术风险与未解决的转化问题
        blocks:
          - type: paragraph
            body: >
              五类未解决的转化风险需要在尽调中专门关注。第一，任何 Kriya 项目都没有发表人体药代动力学、药效学或有效性数据，这是近期最关键的问题：截至 2026
              年中，所有有效性主张都依赖动物模型，而相当一部分临床前表现良好的基因治疗项目，最终因免疫反应、表达不足或脱靶生物分布而在人体中失败。第二，免疫介导风险具有临床相关性：针对常见 AAV
              血清型（AAV1、AAV5）的既有中和抗体，可能排除相当比例患者的入组资格或削弱疗效；Kriya 尚未披露任何项目的免疫筛查协议或血清流行率阈值。第三，肌内项目（KRIYA-839 和
              KRIYA-497）存在实质转化问题：达到治疗表达所需的注射体积和位点数量、载体在有丝分裂后骨骼肌与分裂细胞中的长期表达持久性，以及多点给药的局部耐受性。第四，化学遗传学项目（KRIYA-748 和
              KRIYA-382）同时依赖神经元中持久的离子通道表达，以及 varenicline 在相关 CNS 浓度下可靠的药理作用；varenicline
              介导的神经元沉默与其全身效应之间的人体治疗窗尚未被表征。第五，此前管线替换——从 2020 年 Series A 披露的 KT-A112、KT-A522 和
              KT-A832，换成当前九个项目——从未公开解释，给尽调留下不确定性：Kriya 为何在 IND 前放弃早期代谢项目。labiotech.eu 2025 年 9 月的分析指出，Kriya 融资超过 $1.2
              billion 后仍未发表任何人体临床数据，并错过了自称的 2024 年 Q1 NASH 时间线；两点都指向执行风险，因为这家公司主要还是一个制造和平台建设故事。竞争对手 Complement
              Therapeutics 于 2025 年 10 月获得 CTx001 的 IND 放行（另一种用于 GA 的补体基因治疗，使用 mini-CR1，而非 Kriya 的 CR2-CR1
              融合），并将启动首次人体试验，给 KRIYA-825 的领先适应症带来竞争压力。
