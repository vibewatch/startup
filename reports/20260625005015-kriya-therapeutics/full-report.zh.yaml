      - number: '7.2'
        title: 临床管线执行与淘汰风险
        blocks:
          - type: paragraph
            body: >-
              Kriya 公开记录中最清晰的不利信号，是融资规模与披露临床产出之间不匹配。2024 年 1 月 J.P. Morgan Healthcare Conference 上，公司指引称到 2025
              年末最多五个项目将进入临床；截至 2026 年 6 月，只有 KRIYA-825 和 KRIYA-748 确认处于 Phase 1/2
              试验，其余七个管线项目（KRIYA-586、KRIYA-839、KRIYA-296、KRIYA-497、KRIYA-382、KRIYA-454 以及一个未披露神经学项目）在公司管线页面列为
              IND-enabling 或研究阶段。JPM 2024 的五项目目标已实质落空。Labiotech 2025 年 9
              月发布的调查明确指出，「候选药物从管线中消失、开发截止期限未达成，以及最近资金去向缺乏透明度」构成 Kriya 的历史特征。

              项目终止已有记录，且实质不利。Series A 时提出的三个原始糖尿病候选药物——KT-A112（通过肌内胰岛素-葡萄糖激酶治疗 T1D/T2D）、KT-A522（通过 GLP-1 受体激动剂唾液腺递送治疗
              T2D/肥胖）和 KT-A832（通过胰腺 IGF-1 表达治疗 T1D）——被 KRIYA-839 以及 MASH/KRIYA-497 项目完全取代；公司没有给出公开解释。2023 年 9 月
              Tramontane 收购包括一项明确承诺：MASH 基因治疗候选药物将在「2025 年上半年」进入临床——Labiotech 指出，截至 2025 年 9 月该截止期限未达成。KRIYA-497 MASH
              项目目前在管线页面列为 IND-enabling，说明距离首次人体试验可能仍有 6 到 18 个月。

              KRIYA-825 和 KRIYA-748 的 Phase 1/2 数据尚未公开。KRIYA-825 最近一次与有效性相关的披露，是 2025 年 5 月 ARVO 临床前报告，覆盖小鼠有效性和 NHP
              生物分布，而非人体数据。这意味着全部九个项目的投资论点都建立在尚未被人体验证的生物学之上，每个临床决策关口都有很高二元结果风险。地理萎缩中的临床失败尤其后果重大，因为 KRIYA-825
              要与两款已批准补体抑制剂（Syfovre 和 Izervay）竞争，并必须相对既有对照证明临床意义明确的优势，才可能获得监管批准和商业采用。
