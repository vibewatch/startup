      - number: '6.3'
        title: 临床入组、试验启动和专科参与是最接近采用的代理指标
        blocks:
          - type: paragraph
            body: >-
              Kriya 没有商业客户，因此衡量客户采用最有意义的代理指标，是公开披露中可见的临床试验入组状态和专科参与质量。

              KRIYA-825（GA）方面，Kriya 在 2025 年 5 月 ARVO Annual Meeting 新闻稿中确认，「一项针对地理萎缩患者的 KRIYA-825 临床试验」近期已经启动。JPM 2024
              更新曾预期 GA 在「2024 年」进入临床。Phase 1/2 试验随后在 2025 年初启动，是目前最具体的采用代理证据：临床中心医生同意筛查并招募患者，机构审查委员会批准方案，FDA 授予监管 IND
              放行。ARVO 2025 数据报告（2025 年 5 月 8 日）也首次在公开科学论坛上证明，视网膜专科医生认为其临床前数据有吸引力：在一个重要国际眼科会议的「AMD: Clinical and
              Translational Studies」分会中展示，说明关键买方群体（视网膜专科医生）正在主动评估 KRIYA-825 的科学基础。

              KRIYA-748（TN）方面，Labiotech 2025 年 9 月文章明确称「两个候选药物已经进入临床，即 KRIYA-825 和 KRIYA-748」，确认 TN 项目也获得 IND
              放行并启动临床。两个试验都尚未公开披露入组数量、给药数据或研究者数量。

              Everads 2026 年 5 月新闻页报道，Quan Dong Nguyen 医生（在 FLORetina 2025，2025 年 12 月）「分享了一项正在进行的 VV-14295
              地理萎缩成人基因治疗研究亮点，该研究使用 Everads Injector 进行脉络膜上腔递送」。虽然 VV-14295 属于另一赞助方项目，但这一提及确认 Everads 脉络膜上腔递送设备已经在 GA
              基因治疗试验中活跃用于临床，直接验证了支撑 KRIYA-825 的递送平台。这是目前最接近的可得信号，说明视网膜专科医生群体正在实际使用 Kriya 从 Everads 获得许可的技术组件。

              在 ClinicalTrials.gov 搜索「Kriya Therapeutics」会返回 KRIYA-825 和 KRIYA-748 项目，为 Kriya 的 Phase 1/2
              试验方案已经注册提供独立监管确认。Phase 1/2 入组、IND 注册，以及 ARVO 和 FLORetina 的 KOL 参与，构成了 Kriya 当前全部「采用代理」证据。
