            title: 制造平台是最有防御力的长期成本和利润率杠杆
            body: >-
              Kriya 的垂直整合 GMP 平台，是其核心财务论点：规模从 50L 到 3,000L，内部覆盖灌装 / 完成、QC 放行，并用一套流程贯穿研究到商业化。如果 STRIPE
              平台的降本主张能在商业规模验证，每个获批剂量的毛利率可能显著高于依赖 CDMO 的同行。该平台也是 Series D 投资者解释信心的主要依据。制造资产已经建成并投入运营，意味着 capex
              大体已经沉没，未来成本会更多转向经营杠杆，而不是继续扩建。
