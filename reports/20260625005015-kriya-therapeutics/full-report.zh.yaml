      - number: '5.5'
        title: 质量、监管与信任控制
        blocks:
          - type: paragraph
            body: >
              Kriya 的质量体系运行在 FDA cGMP 法规之下，适用于 AAV 基因治疗制造（21 CFR Parts 210/211 以及 CBER 适用的生物制品指南）。KRIYA-825 和 KRIYA-748
              临床供应 cGMP campaign 已经完成，意味着 QC 测试和放行协议已经在运行。分析表征被描述为广泛且前置，从研究阶段就覆盖关键质量属性；ASGCT 2026 报告列出具体检测：用于 AAV
              药品残留宿主细胞 DNA 定量的高灵敏 ddPCR，以及用于血清中载体化胰岛素功能表征的细胞效价检测。两者都代表着超出传统 AAV 批次放行测试的质量控制进展。FDA 的 CBER
              监管细胞和基因治疗产品，并已有基于 IND 的成熟框架；Kriya 的 Phase 1/2 IND 获批（KRIYA-825 和 KRIYA-748）确认监管路径是开放的。FDA 已批准基因治疗产品清单目前包含
              40 多款获批细胞和基因治疗产品，IND-to-BLA 路径已被充分理解。不过，Kriya 没有公开披露任何项目的具体监管认定（Fast Track、Breakthrough、Regenerative
              Medicine Advanced Therapy），也没有发布临床试验方案、患者筛选标准、安全监测计划或临床药理报告。FDA 对基因治疗的长期随访指南通常要求给药后最多 15 年监测；这一 LTFU
              义务会形成长期药物警戒承诺，必须纳入预算并落地运营。行业层面，Sarepta Therapeutics 的 Elevidys 因患者死亡撤回，是一个警示信号：cGMP 制造失败和加速批准可能叠加，进而在 AAV
              领域制造严重安全和商业风险。Kriya 在产品免责声明中承认，任何项目都尚未获得任何监管卫生机构的安全性或有效性批准。
