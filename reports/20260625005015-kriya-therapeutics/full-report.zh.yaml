  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心、风险与估值立场
        blocks:
          - type: paragraph
            body: >-
              对 Kriya Therapeutics
              的投资判断是跟踪，不是买入，也不是回避。平台确实有差异化，投资财团质量也高，但决定私募市场进入的三个变量——披露估值、已证明临床疗效、可信的烧钱与跑道画像——公开证据都太薄。三者一个都没有。Caplight
              确认公司没有估值标记，原始 Form D 和 2025 年 9 月修订文件均未附每股价格，公司也未披露 Series D 后现金跑道。在这种真空里，唯一诚实的立场是保持跟进，把任何资本部署建立在 Phase
              1/2 读出和完整资料室访问之上，而不是今天就承销一个隐含溢价。

              信心低，恰恰因为能提高信心的输入缺失或只有单一来源。风险评级为高：Kriya 处于临床阶段且没有疗效数据，基因疗法融资环境在 2021 至 2024 年间收缩 83%，行业反面案例——bluebird bio
              从约 $10 billion 跌到 $30 million 私有化、Pfizer 撤回已获 FDA 批准的血友病 B 疗法 Beqvez、Sarepta 的 Elevidys 死亡事件和发货暂停使其市值从
              $11.6 billion 降至 $1.76 billion——都说明即使获批也不保证商业生存。估值立场偏紧：隐含私募标记高于已经具备商业或 Phase 3
              证据的上市可比公司。本节锚定的图表和表格呈现了建议逻辑以及逐维度总结。
