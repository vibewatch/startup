      - number: '5.3'
        title: 递送技术与局灶给药论点
        blocks:
          - type: paragraph
            body: >
              Kriya 的总体递送原则是局灶或直达组织给药：在目标组织实现高水平局部转基因表达，同时降低总载体剂量，尽量减少全身生物分布，并降低脱靶免疫激活风险。这个论点塑造了每个项目的给药路径选择。KRIYA-825
              方面，Kriya 于 2023 年 9 月与 Everads Therapy 签订独家许可、合作和供应协议，获得 Everads Suprachoroidal Injector
              的使用权。该专有设备使用几何优化的非锐性组织分离器，为切向注射打开进入脉络膜上腔的路径。脉络膜上腔路径的定位是最大化脉络膜和视网膜色素上皮（RPE）细胞层转导，同时尽量减少历史上与玻璃体内注射相关的眼内炎症。ARVO
              2025 报告中的 NHP 临床前数据确认，脉络膜上腔给药耐受性良好，脉络膜和 RPE 中有强健的 KRIYA-825 转基因 mRNA，眼外组织表达很低。代谢项目（KRIYA-839 和
              KRIYA-497）选择多点肌内注射，使用对骨骼肌有趋向性的 AAV1 血清型。ASGCT 2026 数据评估了 NHP 多点肌内 AAV1 给药后的局部耐受性；另一篇摘要评估了一次性生物工艺袋对 AAV1
              工艺可扩展性的兼容性。KRIYA-586（甲状腺眼病）采用眼球周围注射，瞄准眼外脂肪和肌肉，以最小全身暴露实现局部抗 IGF1R 抗体表达。神经学项目使用靶向神经或局灶脑内注射——KRIYA-748
              注入三叉神经，KRIYA-382 注入癫痫灶。KRIYA-748 的 CNS 递送需要稳定、CNS 耐受的 AAV5 制剂；ASGCT 2026
              海报数据专门报告了这类制剂的开发。局灶递送论点在成本上也有战略意义：更低载体剂量能降低单剂量材料成本。对于一家主张基因治疗可在常见疾病中实现经济可及的公司，这是关键考量。
