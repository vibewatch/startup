      - number: '4.3'
        title: 成本结构、制造资本开支与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              Kriya 的成本结构由两类支出主导：支持多项目临床开发的 R&D 支出，以及 GMP 制造运营。两类都没有公开量化，但可以从已披露运营选择推断其结构。最早的战略决定——2020–2021 年在 Research
              Triangle Park 收购并翻新 51,350 平方英尺设施，规模达到 3,000 升生物反应器产能，并整合灌装封装和 QC 放行——让 Kriya 在提交任何 IND
              之前就锁定了大量固定基础设施投资。平台制造工艺从研究规模到商业规模采用同一系列单元操作，号称可从 50L 经 500L 扩至
              3,000L，而无需工艺变更或高成本技术转移。这一连续性主张在运营上很关键：它构成内部制造相对 CDMO 外包降低未来 COGS 的核心论点。制造页面披露多个管线项目正在进行 GMP
              制造批次，意味着持续年度成本包括设施人员、耗材、质量控制和监管合规，但这些成本没有单独拆分。临床试验支出是第二大成本驱动。已有两个项目确认在临床（KRIYA-825 针对地图样萎缩的 Phase
              1/2、KRIYA-748 针对三叉神经痛），Series D 描述还显示多个额外项目并行推进。由专科注射递送的基因治疗 Phase 1/2 试验，通常每个项目成本 $20–80
              million，取决于患者数和适应症特定监测要求；不过这些是外部基准，不是 Kriya 披露数字。Kriya 还至少完成三项收购——Redpin Therapeutics、Tramontane
              Therapeutics 和 Warden Bio——金额未披露，说明可见 GMP
              建设之外还有实质资本部署。产品获批前，制造基础设施就是纯成本中心。经营杠杆论点是，获批后可把这笔沉没基础设施成本转化为每剂量持久毛利优势，但该论点仍未被公开数据证明。
