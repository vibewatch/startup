  - id: FE001
    title: Kriya 基因疗法产品架构——一体化平台栈
    type: stack
    layout: standard
    summary: |
      从生物学基础到计算设计、生产和临床递送，分层展示 Kriya 的一体化基因疗法引擎。
    data:
      layers:
        - label: 生物学与靶点选择
          modules:
            - 已验证生物学——具有临床 / 监管先例的已知蛋白
            - 疾病选择——具备已验证终点的大规模常见病
            - 学术合作——UAB（FGF21 生物学）、NIH 临床前研究
            - 蛋白工程——计算和实验优化
        - label: SIRVE™ 计算载体工程
          modules:
            - 序列改造——计算驱动的序列优化
            - ML 优化——面向可制造性和表达的机器学习
            - 衣壳选择——已获临床验证的已知血清型（AAV1、AAV5）
            - 生成式深度学习——从零改良生物药
            - 免疫特征筛查——平台内优化免疫原性
        - label: STRIPE™ 生产平台
          modules:
            - 细胞系技术——优化生产细胞系
            - 上游工艺——50L 至 3,000L 高产量生物反应器条件
            - 下游工艺——为纯度和产量优化纯化与制剂
            - 分析开发——ddPCR、效力测定、CQA 监测
        - label: 51,000 平方英尺 RTP 设施内的 GMP 生产
          modules:
            - 面向任意 AAV 血清型的多产品 cGMP 生产
            - 50L、500L 和 3,000L 生物反应器规模
            - 内部灌装 / 完成和 QC 放行检测
            - 同时开展活跃的多项目生产批次
        - label: 局部递送技术
          modules:
            - 脉络膜上腔——Everads Injector 用于 KRIYA-825 和未来眼科项目
            - 肌内——多点 AAV1 用于 KRIYA-839（T1D）和 KRIYA-497（MASH）
            - 球周——针对 KRIYA-586（TED）的眶周脂肪和肌肉注射
            - 神经注射——三叉神经用于 KRIYA-748，脑部病灶用于 KRIYA-382
        - label: 临床管线
          modules:
            - Phase 1/2——KRIYA-825（GA）和 KRIYA-748（TN）
            - 支持 IND 申报——KRIYA-586（TED）、KRIYA-839（T1D）、KRIYA-497（MASH）、KRIYA-382（Epilepsy）
            - 发现 / 研究——KRIYA-296、KRIYA-652、KRIYA-454（未披露）
    approximationNotes: 层级内容基于公开披露；SIRVE/STRIPE 平台规格来自公司主张，未经独立验证。
    claimRefs:
