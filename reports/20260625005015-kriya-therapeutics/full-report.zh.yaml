      - number: '3.3'
        title: 代谢疾病与神经科竞争格局
        blocks:
          - type: paragraph
            body: >-
              Kriya 的代谢管线在两个项目上面对非常不同的竞争动态。MASH（KRIYA-497，FGF21 基因治疗）最直接的可比对象是 Rezdiffra（resmetirom，Madrigal
              Pharmaceuticals），这是一款口服 THRβ 激动剂，也是首个获 FDA 批准、用于伴肝纤维化 MASH 的治疗。多个注射和口服 FGF21
              激动剂项目（efruxifermin、pegozafermin）已生成显示纤维化逆转的 Phase 2 数据，直接验证了 Kriya 所用 FGF21 生物学，但也提供了一个概念证明：竞争者可以不用基因治疗递送
              FGF21 生物学。Kriya 在 MASH 上的潜在差异化，是一次性持久性、稳定的天然 FGF21 水平以降低 Cmax 峰值带来的 GI
              副作用，以及对使用多种口服疗法患者的联合优势——但这些目前都没有临床验证。1 型糖尿病（KRIYA-839）的竞争格局由胰岛素泵和连续血糖监测仪定义技术标准治疗，也由细胞治疗项目（Vertex
              VX-880、CRISPR Therapeutics/ViaCyte 胰岛方法）定义临床基因 / 细胞治疗前沿。Kriya 的骨骼肌胰岛素与 glucokinase
              共表达路径在机制上不同于胰岛替代，但尚未进入临床；T1D 基因治疗领域仍没有任何项目拿出已证明的持久性数据。三叉神经痛（KRIYA-748）的标准治疗仍是 carbamazepine、oxcarbazepine
              等抗惊厥药，这些药物会随时间失效且有耐受性负担；还有 MVD、Gamma Knife、球囊压迫等神经外科手术，侵入性强且持久性不一。目前没有 FDA 批准的 TN 基因治疗；KRIYA-748
              以化学遗传学门控离子通道配合口服 varenicline，确实是一条差异化路径，但其竞争护城河完全取决于尚未生成的临床证明。
