  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界——常见病 AAV vs. 传统罕见病 AAV
        blocks:
          - type: paragraph
            body: >-
              Kriya 的市场边界，最好理解为有意偏离 AAV 基因治疗行业的创始路径。第一波获批 AAV 药物——Luxturna（RPE65 遗传性视网膜营养不良）、Zolgensma（1
              型脊髓性肌萎缩症）、Hemgenix 和 Beqvez（血友病 B）——瞄准的是美国患病人数远低于 100,000 的超罕见病。Kriya 的管线覆盖五个适应症，美国 + 欧盟合计患病人数超过 48
              million：地图样萎缩（约 2M）、甲状腺眼病（约 1M）、1 型糖尿病（约 5M）、MASH（约 40M）和三叉神经痛（约
              400K）。公司定位语言——让基因治疗「面向多数人可及」——以及技术选择都明确体现了这个市场边界迁移：用脉络膜上腔和肌内递送替代玻璃体腔内或 IV，在 Research Triangle Park 自建 cGMP
              制造，并垂直整合 AAV 设计以降低单患者成本。

              Kriya 市场边界内纳入的支出，是在专科医生监督下、针对现有长期维持治疗控制不佳的慢性病患者，使用一次性或低频 AAV 基因治疗。排除支出包括：（a）Kriya 管线中低于 Orphan Drug
              患病率门槛的超罕见单基因 AAV 适应症，（b）CAR-T 或 ex vivo 细胞 / 基因治疗，（c）mRNA 或 RNAi 平台，（d）Kriya
              旨在替代而非补充的现有标准治疗药物经常性支出（Syfovre、Izervay、胰岛素泵）。各适应症的现状替代方案是：GA 每月或每两月玻璃体腔内补体抑制剂注射；TED 静脉给药
              teprotumumab（Tepezza）；T1D 使用胰岛素泵和每日多次注射；晚期 MASH（F3-F4）依赖减重且没有获批抗纤维化药物；TN 则从抗惊厥药轮换到手术。

              相邻市场包括更广义的基因治疗、眼科药物递送平台、代谢疾病生物制剂，以及 AAV CDMO 制造服务。常见病定位由一小群 AAV 开发商共同采用（Ascidian、Adverum、Gyroscope
              Therapeutics 针对 GA；全球 beta-cell/T1D 基因治疗项目），但相对于罕见病优先管线，它仍是少数派策略。Kriya 的 AAV 成本结构能否在主要支付方（尤其
              Medicare）愿意为常见慢性病提供的覆盖水平下实现有利可图的报销，仍是市场准入的核心问题。
