      - number: '5.2'
        title: 管线资产地图与项目状态
        blocks:
          - type: paragraph
            body: >
              Kriya
              披露的管线包括九个在研项目：三个眼科项目（KRIYA-825、KRIYA-586、KRIYA-296）、三个代谢疾病项目（KRIYA-839、KRIYA-497、KRIYA-652）和三个神经学项目（KRIYA-748、KRIYA-382、KRIYA-454）。截至
              2026 年中，KRIYA-825（地理萎缩）和 KRIYA-748（三叉神经痛）是两个确认处于 Phase 1/2 临床试验的项目。KRIYA-825 是一种 AAV 基因治疗，表达 CR2-CR1
              融合蛋白，旨在抑制补体 C3 和 C5，并通过脉络膜上腔注射给药；其机制直接瞄准两款 FDA 批准 GA 药物（pegcetacoplan/syfovre 和 avacincaptad
              pegol/izervay）所抑制的同一补体通路，但方式是单次注射后由 AAV 介导持续表达，而不是每月玻璃体内给药。KRIYA-586 通过眼球周围注射表达抗 IGF1R
              抗体，用于甲状腺眼病，目标是在眼外组织实现局部表达。KRIYA-839 通过肌内双表达胰岛素和葡萄糖激酶治疗 1 型糖尿病，利用骨骼肌在葡萄糖处置中的主导作用（约
              80%），构建生物闭环葡萄糖传感器。KRIYA-497 面向伴 F3 或代偿性 F4 纤维化的 MASH 患者，通过肌内表达天然 FGF21；它以稳态连续表达，区别于由 Cmax 驱动毒性风险的 FGF21
              模拟物 bolus 给药。KRIYA-748 使用化学遗传学工程离子通道（varenicline 激活氯通道），注入三叉神经，以带内置关闭开关的方式降低过度兴奋性。KRIYA-382
              将同一化学遗传学技术用于局灶性癫痫，通过直接脑内注射进入癫痫灶。三个未披露项目（KRIYA-296、KRIYA-652、KRIYA-454）出现在管线页面，但公开层面没有机制或阶段细节。
