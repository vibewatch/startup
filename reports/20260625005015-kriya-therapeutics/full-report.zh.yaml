  - id: FU001
    title: 客户旅程图——从患者需求到潜在商业递送的商业化前路径
    type: journey-map
    layout: wide
    summary: >-
      截至 2026 年 6 月，Kriya 没有商业客户。旅程图追踪一个 GA 患者、视网膜专科医生和付款方从未满足需求，经试验入组走向最终商业化产品使用的假设路径。Kriya 公开走到的阶段只有专科医生互动、IND
      登记和试验启动。
    data:
      nodes:
        - id: j1
          label: 识别未满足疾病需求
          detail: 视网膜专科医生识别正在每月 / 每两月接受玻璃体腔内 Syfovre 或 Izervay 注射、治疗负担显著的 GA 患者。美国 + 欧洲 GA 患者约 200 万；NEI 报告美国 AMD 总患者约 1100 万。
          tone: neutral
        - id: j2
          label: 专科科学评估
          detail: >-
            视网膜专科医生在 ARVO 和其他眼科会议上评估临床前和早期临床数据。Kriya 在 ARVO 2025（2025 年 5 月）和 ARVO 2024 展示 KRIYA-825 临床前数据。具名 KOL Quan
            Dong Nguyen 在 2023 年公开支持该临床逻辑。
          tone: positive
        - id: j3
          label: 临床试验入组（当前阶段）
          detail: 患者在研究中心接受筛查；抗 AAV 抗体预筛会排除一部分人；签署知情同意的患者进入 Phase 1/2 安全性和剂量递增研究。KRIYA-825 Phase 1/2 已确认于 2025 年初启动。
          tone: warning
        - id: j4
          label: Phase 2 / 关键试验和监管审评
          detail: Phase 1/2 安全性数据之后，还需要关键疗效试验。标准 GA 终点是 FAF 影像上病灶面积变化率。FDA 批准和标签将决定符合条件的患者人群和给药场景。尚未启动。
          tone: negative
        - id: j5
          label: 付款方覆盖和报销谈判
          detail: >-
            需要 Medicare Part B 覆盖决定；面对 Medicare 人群中的数百万美元一次性疗法，结果导向合同或 TCET 路径可能适用。GA 中没有商业可比案例；Beqvez 在血友病 B 的商业失败（2024
            年）是警示性先例。
          tone: negative
        - id: j6
          label: 商业处方和给药
          detail: 合格中心的视网膜专科医生会开具、订购并使用 Everads 注射器经脉络膜上腔给药 KRIYA-825。收入在给药点确认。尚未发生商业递送。
          tone: negative
