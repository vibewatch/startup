        - 生成并筛选载体变体，评估可制造性、表达和免疫原性
        - 专有算法；训练数据来自 Kriya 自身实验输出
        - 算法盲区可能到临床失败时才暴露；黑箱优化
      - - STRIPE 制造平台
        - 上下游工艺工程，支撑低成本、可扩展的 AAV 生产
        - 细胞系技术；一次性生物工艺袋；Kriya 特定工艺参数
        - 行业普遍面临可扩展性挑战；产量和纯度基准未公开验证
