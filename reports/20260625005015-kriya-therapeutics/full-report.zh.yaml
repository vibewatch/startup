      - number: '4.4'
        title: 资本充足性、现金位置与融资依赖
        blocks:
          - type: paragraph
            body: >-
              评估 Kriya 的资本充足性，需要分两段看：公开披露过的 Series D 前位置，以及只能从公开数据部分重建的 Series D 后位置。公开数据点是 2024 年 1 月 JPM 声明：公司进入 2024
              年时现金余额为 $325 million，现金续航延伸至 2026 年末，反映了 Series A 至 Series C 延长轮的累计资本。Series D 于 2025 年 9 月 10 日交割，新增 $320
              million，并被描述为相较上一轮显著估值上调且超额认购——交割时由需求驱动，而非困境驱动。所有轮次已确认公告融资合计至少 $920.5 million，这采用保守做法，不重复计算 2025 年 8 月 SEC
              Form D 与 2025 年 9 月 Series D。2025 年 8 月 Form D 显示总发行金额 $313,297,440、2 名投资人，首次销售日期为 2025 年 7 月 31 日——大约早于 9
              月 10 日新闻稿所述 Series D 交割六周。行业报道把这些当作两起不同事件，称六年融资超过 $1.2 billion；公开来源无法最终解决重叠关系，因此 $920.5 million
              的已确认基准情形才是合适的承销锚点。Series D 后现金位置和现金续航未公开披露。倒推来看：如果 Kriya 进入 2024 年时有 $325 million，并在到 2025 年 9
              月的多项目临床开发中持续烧钱（约 20 个月），则 Series D 前余额很可能显著低于 $325 million。$320 million Series D
              随后恢复了相当可观的现金续航，但募资后精确余额、烧钱速度和现金续航时长仍不可得。任何已检索文件或新闻稿中都没有债务、授信额度或项目融资义务。Series D 的具名投资人——Patient Square
              Capital、Premji Invest、Peter Thiel、Narya Capital 和 The T1D Fund——包括多轮参与的重复机构投资人，支持一个判断：这笔融资反映知情信念，而非困境情形。
