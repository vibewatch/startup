      - number: '8.4'
        title: 可比估值组
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，来自 companiesmarketcap.com 行业排名的上市基因疗法可比公司，解释了为什么 Kriya 的隐含私募标记显得偏高。商业化龙头的阶段远高于 Kriya：Krystal
              Biotech 市值 $10.24 billion，已有上市产品 Vyjuvek；CRISPR Therapeutics 市值 $5.27 billion，Casgevy 已获批；Beam
              Therapeutics 市值 $3.48 billion，靠碱基编辑前景支撑。更贴近阶段的组合同样有启发：uniQure 市值 $3.08 billion，拥有商业化产品 Hemgenix；MeiraGTx
              市值 $1.07 billion，拥有多个 Phase 3 项目；REGENXBIO 市值 $0.51 billion，仍是预商业化 NAV 平台。这些公司在临床去风险上显著强于 Kriya，却交易在
              $0.5–3 billion 区间，与 Kriya 推断的 $1.5–2.5 billion 私募估值下半段重叠。

              不利可比公司让警示更尖锐。bluebird bio 曾接近 $10 billion 市值，如今在约 $30 million 私有化之后只剩 $48.66 million；Sarepta 在 Elevidys
              安全事件后，从 2024 年的 $11.6 billion 跌至 2026 年的 $1.76 billion。二者说明，基因疗法业务即便触达市场，也可能几乎抹去全部股权价值。Kriya
              本身仍是未披露估值的私营公司，所以最后一行刻意留白：可比组可以圈定问题边界，但不能给它定价。私募轮和 M&A 可比交易并非公开可得，因此这份枚举不完整；这一限制被记录为与可比表绑定的明确证据缺口。
