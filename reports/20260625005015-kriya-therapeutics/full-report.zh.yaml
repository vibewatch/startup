  - id: TV005
    title: 打破论点与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - KRIYA-825 疗效失败
        - Phase 1/2 读数未能在地理萎缩中显示有临床意义的信号
        - 拿掉核心证据支柱；平台价值只剩制造可选性
        - 从跟踪转为回避；不参与任何估值上调轮
      - - FDA 临床暂停或安全事件
        - KRIYA-825 或 KRIYA-748 被暂停，或脉络膜上腔 / CNS 项目出现严重不良事件
        - 映射 Sarepta/bluebird 先例；损害下一轮融资并压缩隐含估值
        - 暂停接触；重新承销前要求审查 DSMB 章程和停药规则
      - - 降价轮或低于 Series D 的二级市场价格
        - Series E 持平或下调，或二级交易低于 Series D 价格
        - 推翻「显著估值上调」论点，并释放投资者支持恶化信号
        - 将入场价重定到熊市区间；要求修订后的股权结构表和优先权条款
      - - 管线进一步终止
        - 另一个项目从管线中消失，或错过已声明的 IND 截止时间
        - 强化 Labiotech 的批评：资本投入跑在临床产出前面
        - 下调管线广度溢价；只按两个临床资产承销
      - - 资本充足性缺口
        - 披露的烧钱速度显示现金跑道短于下一次价值拐点读数
        - 迫使公司在弱数据下进行稀释性融资，放大降价轮风险
        - 任何承诺都以现金跑道足以覆盖至 KRIYA-825 读数为条件
    notes: 触发项按对论点的杀伤力排序。传导列把每个事件追踪到其驱动的估值结果。依据 Labiotech、行业先例（Sarepta、bluebird）和 Form D 融资证据整理。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV027
      - CV033
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 路径
    rows:
      - - Series D 定价
        - $320.8M Series D 的每股价格和投后估值
        - 把推断的 $1.3-2.1B 区间转化为真实入场估值；决定价格是否站得住
        - 公司 / 资料室；与 SEC Form D/A 和任何股票购买协议交叉核对
      - - 股权结构
        - Series A-D 的清算优先权堆栈和期权池压力
        - 优先权压力可能实质性压低任何退出中的普通股回报
        - 公司 / 法律顾问；在 NDA 下获取股权结构表和章程
      - - 资本充足性
        - 月度烧钱速度和 Series D 后现金跑道
        - 决定下一轮融资是借势完成，还是被迫在弱数据下推进
        - 公司 / CFO Sachiyo Minegishi；索取经营模型和现金跑道桥接表
      - - 临床证据
        - KRIYA-825 Phase 1/2 方案、终点、DSMB 章程和任何中期数据
        - 疗效证据是牛市与熊市之间最大的摆动因素
        - 公司 / 临床；获取方案、统计计划和安全监控规则
      - - 资本对账
        - 将公司「>$1.2B raised」说法与约 $920.5M 备案记录对账
        - 解决 Labiotech 指出的可信度缺口，并测试管理层透明度
        - 公司 / 财务；把每一轮映射到 Form D 备案和投资者名单
      - - 报销策略
        - 面向高患病率疾病一次性基因疗法的付款方和 CMS 沟通计划
        - 商业可行性取决于报销，Beqvez 撤回背后的失败模式正是这里
        - 公司 / 市场准入；索取定价和付款方策略文件
    notes: >-
      问题按从价格发现到商业可行性的顺序排列。每一项都是从跟踪升级为买入的前置条件。来源：sec.gov Form D/A、kriyatherapeutics.com CFO 任命、labiotech.eu、pfizer.com
      Beqvez。
    claimRefs:
      - CV002
      - CV004
      - CV027
      - CV028
      - CV007
      - CV020
