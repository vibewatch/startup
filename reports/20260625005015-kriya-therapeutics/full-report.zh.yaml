      - number: '3.4'
        title: 基因治疗平台与制造可比公司
        blocks:
          - type: paragraph
            body: >-
              Kriya 是少数追求多适应症 AAV 平台的公司之一，其上市公司可比对象也展示了该板块的财务尺度。MeiraGTx（截至 2026 年 6 月市值
              $1.07B）拥有结构上最相似的多项目画像——唾液腺基因治疗（AAV-hAQP1 用于 xerostomia）处于 Phase 3，多个 IRD 视网膜基因治疗项目，以及处于 Phase 2 的
              Parkinson's disease——同时还有用于代谢疾病的核糖开关调控疗法。uniQure（截至 2026 年 6 月市值 $3.08B）是财务上最有分量的纯基因治疗可比公司：其血友病 B 基因治疗在
              2022 年成为全球首个获批血友病基因治疗，为 AAV 在慢性病中的商业化提供了验证点。REGENXBIO（市值 $0.51B）授权其 NAV 平台并拥有视网膜项目。Sarepta Therapeutics（市值
              $1.76B）在 Duchenne 拥有商业化基因治疗和大型制造基地。Bluebird bio（截至 2025 年中市值 $48.66M）说明了严重执行风险——多款 lentiviral
              产品商业化上市未能产生足够收入，最终走向近乎破产。已获批产品方面，Spark Therapeutics（现已完全整合进 Roche/Genentech）凭 Luxturna 拿下首个眼科基因治疗批准；Pfizer
              的 BEQVEZ 获 FDA 批准用于血友病 B，单剂量治疗在 Phase 3 中让 60% 患者消除出血。这些既有厂商带来 Kriya 尚未证明的分销网络、支付方准入和监管信任。Novartis Gene
              Therapies（前 AveXis）拥有用于 SMA 的 Zolgensma，并在神经科和眼科探索 AAV 与 CRISPR 路径，代表该领域最大的平台能力。在这一同业集合中，Kriya
              的差异化是三大治疗领域范围与 3,000L 生物反应器规模内部制造的组合——没有一个公开可比公司能精确复制——但这一优势尚未通过商业吞吐量或独立审计验证。
