      - number: '2.2'
        title: 市场规模——从多重视角看 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              四家独立市场研究公司估计，2025–2026 年全球 AAV 基因治疗 TAM 介于 $2.85 billion 至 $4.35 billion；2030–2035 年预测则从 $6.65
              billion（TBRC，至 2030 年 CAGR 15.6%）到 $112.24 billion（TowardsHealthcare，至 2035 年 CAGR
              40.1%）不等。长期估算相差五倍，反映的是：（1）市场边界定义不同——有些把完整 AAV 研究、制造和 CDMO
              供应链纳入，有些只限商业化治疗；（2）对罕见病和常见病项目有多少能获批的假设不同；（3）获批后的采用率假设不同。这些估算应作为合理情景，而非共识数据；它们之间没有互相独立验证。

              用疾病患病率来做规模测算，可以给出更扎实、但仍不确定的 Kriya 可服务可寻址市场图景。若采用保守治疗渗透率假设（10 年商业化爬坡期覆盖 15% 的合格已诊断患者）、每次基因治疗定价 $1–3
              million，以及美国 + 欧盟合计约 3 million 的合格 GA+TED 人群：仅这两个适应症，粗略的美国 + 欧盟累计收入天花板就是 $3–10 billion。MASH 的美国 + 欧盟 40
              million 患者代表大得多的理论天花板，但在可寻址市场测算有意义之前，需要明显更深的临床和监管证据。

              一个关键 SAM 缺口存在：已检索证据中，没有公开分析师报告单独计算 Kriya 所瞄准的常见病 AAV 合并细分市场 SAM。分析师报告按治疗领域切分（神经系统疾病占 AAV 市场
              29–39%，居主导），但神经系统既包括罕见病也包括常见病。TowardsHealthcare、Precedence 和 Coherent 报告都指出，常见病 AAV
              是新兴而非成熟细分，因此无法靠公开数据自下而上分离 SAM。北美在 AAV 市场中占主导，占总量 42%（Precedence）至 54%（TowardsHealthcare）。
