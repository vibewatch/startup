      - number: '5.4'
        title: 制造模型与 GMP 运营
        blocks:
          - type: paragraph
            body: >
              Kriya 的制造模型是集中式、内部化、多产品制造，位于北卡罗来纳州 Research Triangle Park 的 51,000 平方英尺设施内。该设施历经约一年建设改造，于 2021 年 7
              月完成翻新，涵盖内部工艺开发实验室、分析开发实验室、质量控制测试、试生产区、灌装 / 完成和多个 cGMP 套间，全都在同一屋檐下；Kriya 将其描述为 vial-to-vial 制造能力。GMP 产能覆盖
              50L、500L 和 3,000L 生物反应器规模，支持用同一平台单元操作跨任意 AAV 血清型进行多产品制造。截至 2026 年中，公司称多个管线项目正同步开展活跃 GMP
              制造活动。内部制造的战略理由在公开材料中表述一致：从研究规模到商业规模使用同一系列单元操作，可实现无缝放大，避免昂贵的工艺可比性变更，并增强信心，认为临床前数据能准确转化为临床产品。2021 年 Series B
              融资时，Kriya 公开命名 STRIPE 为其高效率制造平台，具体将细胞系技术进展与上游、下游工艺优化结合，目标是在规模化生产中相对行业常规实现指数级降本。到 JPM 2024 更新时，Kriya
              表示，从最早研究阶段一路做到临床开发和商业化的制造安排，带来「更高程度的信心，相信我们的临床前工作能够转化到临床」。产量 / 升、纯度规格、相对行业基准的单剂量成本等量化生产指标尚未公开披露。基因治疗 CDMO
              PackGene Biotech 将 Kriya 列为一家内部制造能力和多项目产能构成关键竞争优势的公司。STRIPE 是否真正把单剂量成本降到 CDMO 基准以下，外部仍未验证。
