        - 平台生产就绪度
        - 局部递送证据（NHP 或临床）
        - 监管路径清晰度
        - 临床阶段
      rows:
        - label: KRIYA-825（GA）
          values:
            - 高——C3/C5 靶点已由 FDA 获批药物验证
            - 高——已为 Phase 1/2 生产临床级批次
            - 高——Everads 设备 NHP 数据；脉络膜上腔耐受性良好
