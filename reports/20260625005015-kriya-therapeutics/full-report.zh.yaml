      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              AAV 基因治疗市场有清晰的结构性顺风。2024 年多款新药获批（Beqvez、Kebilidi），加上截至 2025 年中超过 176 个活跃临床试验，说明 FDA 和 EMA 处理 AAV BLAs
              越来越熟练。AI 加速的衣壳工程（2024 年 10 月 Roche/Dyno 超过 $1B 的合作就是例子）正在压缩从新血清型到临床候选物的时间。垂直整合制造——Kriya
              的具体策略——则直指历史瓶颈：cGMP AAV 产能有限，小型 biotech 依赖 CDMO 时尤其受制约。

              对常见病 AAV 来说，需求侧驱动力是现有慢性维持疗法不够好。即便 GA 患者每月接受 Syfovre 或 Izervay 注射，病灶仍会进展，疾病控制也只是部分有效。多数 T1D
              患者即使用上先进监测和泵技术，仍达不到血糖目标。这些未满足需求缺口给了 Kriya 一次性基因治疗的临床理由，即使该疗法不能被最终证明为根治。

              最实质的采用约束包括：（1）免疫原性——针对常见 AAV 血清型的预存中和抗体会把相当一部分患者排除在合格人群之外；Pfizer 的 Beqvez 要求治疗前筛查 AAVRh74var NAb，而 Kriya
              所用工程化衣壳的中和抗体血清流行率尚未公开披露；（2）Medicare 主导的 GA 市场存在定价和报销风险——适用于超罕见血友病 B（全球 38,000 名患者）的高额一次性成本模式，套用到美国和欧盟 2
              million 名 GA 患者时会受到远多得多的审查；（3）Elevidys 安全事件——2025 年患者死亡后 FDA 要求 Sarepta 暂停分发，这收紧了支付方和临床医生对系统性 AAV
              项目的风险容忍度，也提高了任何首次人体试验提交的安全数据门槛；（4）制造规模——内部制造占主导（54–60%），但面向常见病体量的商业规模 AAV 生产成本结构尚未被公开验证；（5）GA
              竞争时点风险——Complement Therapeutics CTx001（Phase 1/2 IND 于 2025 年 10 月获批）和多项其他基因 / 细胞治疗项目正竞相建立先发数据读出。
