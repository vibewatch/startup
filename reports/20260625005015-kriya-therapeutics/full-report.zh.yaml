      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              Kriya 的财务画像是典型临床阶段生物制药公司：资本底座大、没有收入、固定成本高，商业化还要多年推进，每个临床和监管关口都有显著二元风险。主要财务强项在于：已确认承诺资本规模足够大（最低 $920.5
              million，2025 年 Series D 提供近期资金续航）、Series D 由需求拉动且超额认购并实现估值上调，以及引入有履历的商业财务
              CFO，显示公司在为商业化前财务体系做准备。主要财务风险则是变现路径完全不清晰（无获批产品、无披露许可经济条款）、维持一体化 GMP
              制造平台并同时推进多条临床项目的资本强度，以及基因治疗行业逆风带来的敞口：2021 至 2024 年，整个领域的风投资金下滑 83%；Pfizer（Beqvez 退市）和 bluebird bio（估值峰值接近
              $10 billion 后以 $30 million 私有化）等同行案例，说明这个行业的财务结局高度二元。承销上的尽调阻断点很明确：没有公开 ARR 或收入；没有披露现金消耗率或 Series D
              后资金续航；没有当前估值；Form D 与 Series D 是否重叠未解决；没有披露 COGS
              或制造单位经济；没有商业化上市时间表或基础设施计划。如果管理层数据室能解决其中任何一项，财务承销质量都会实质改变。在数据可得之前，财务结论只能是：Kriya
              的资本底座看起来足以支撑近期持续运营，但仅靠公开数据，无法承销其风险调整后的财务画像。
            claimRefs:
              - CI005
