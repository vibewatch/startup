        - Tepezza（5 个月内 8 次 IV 输注，抗 IGF1R 单克隆抗体）
        - KRIYA-586 一次性球周注射，表达抗 IGF1R 抗体
        - 眶周局部表达降低全身暴露，避开一系列 IV 输注
        - 支持 IND 阶段；缺少人体数据；表达持久性未知
      - - 控制 T1D 血糖（摆脱胰岛素依赖）
        - 每日多次胰岛素注射，或胰岛素泵 + 连续血糖监测
        - KRIYA-839 一次性 IM 注射，在肌肉表达胰岛素 + 葡萄糖激酶
        - 葡萄糖感知生物闭环减少或消除外源胰岛素需求
        - 支持 IND；无人体数据；需要多点注射；持久性和 β 细胞免疫未解决
      - - 治疗 MASH 晚期肝纤维化（F3-F4）
        - MASH F4 尚无 FDA 批准疗法；resmetirom 已获批用于非 F4
        - KRIYA-497 一次性 IM 基因疗法，表达天然 FGF21 蛋白
        - FGF21 持续表达可逆转肝纤维化并改善代谢谱；避开 Cmax 胃肠毒性
        - 支持 IND；慢性激动带来的 FGF21 受体脱敏风险未解决
      - - 减少 TN 阵发性疼痛发作
        - 抗惊厥药（carbamazepine）或神经外科手术（MVD）；二者受限于耐受性或侵入性
        - KRIYA-748 一次性三叉神经注射化学遗传学离子通道
        - varenicline 按需触发靶向神经元沉默；无需手术即可达到外科级疼痛控制
        - 1/2 期；无人体疗效数据；varenicline 治疗窗和 CNS 耐受性尚未刻画
