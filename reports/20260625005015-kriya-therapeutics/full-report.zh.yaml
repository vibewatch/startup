  - id: TM004
    title: 增长驱动因素与采用约束
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - FDA 批准提速（Beqvez 2024 年 4 月，Kebilidi 2024 年 11 月）
        - 驱动因素
        - 当前（2024-2026）
        - 证明监管路径可行；让付款方积累一次性 AAV 定价模式经验
        - 判断 Kriya 的适应症走加速批准还是标准路径
      - - AI 加速衣壳工程（Roche/Dyno 2024 年 10 月 $1B+ 合作）
        - 驱动因素
        - 中期（2025-2028）
        - 缩短从新型 AAV 衣壳到临床候选物的时间；可能侵蚀 Kriya 衣壳 IP 护城河
        - 评估 Kriya 衣壳专利组合，以及 AI 设计替代品是否能复刻
      - - 高患病率慢性病适应症存在巨大未满足需求
        - 驱动因素
        - 当前
        - 70-80% 的 T1D 患者达不到血糖目标；GA 患者只能部分控制病灶
        - 确认付款方会要求何种临床证据，才会接受一次性治愈主张
      - - 基于结局的保修项目（Pfizer Beqvez 2024 年 4 月保修模式）
        - 驱动因素 / 约束
        - 近期至中期
        - 风险共担模式可打开商业准入；但需要长期结局数据和合同能力
        - 评估 Kriya 付款方策略团队和证据生成计划
      - - 免疫原性预筛障碍（针对 AAV 血清型的中和抗体）
        - 约束
        - 当前
        - 相当一部分患者不符合条件；压低实际可触达患者数
        - 获取 Kriya 特定 AAV 血清型在美国 + 欧盟人群中的 NAb 血清阳性率数据
      - - FDA/Sarepta Elevidys 安全事件（患者死亡，2025 年暂停销售）
        - 约束 / 反向
        - 近期（2025-2026 压力）
        - 付款方和临床医生对全身性 AAV 的风险容忍度收紧；新申报安全数据门槛抬高
        - 审查 KRIYA-825 Phase 1/2 因脉络膜上腔给药路径所需的 Kriya 安全监测计划
      - - 高患病率适应症的一次性定价和 Medicare 覆盖不确定
        - 约束
        - 中长期
        - GA（美国 + 欧盟 200 万）和 T1D（美国 + 欧盟 500 万）面对一次性高价模式时，付款方存在结构性阻力
        - 确认 CMS Medicare 是否已发布高患病率疾病基因疗法覆盖政策
      - - 高患病率疾病规模下的生产放大和成本
        - 约束
        - 中期（商业化阶段）
        - Kriya 内部生产模式需要的剂量远超任何现有 AAV 批准产品；成本曲线未经验证
        - 核实 Kriya RTP 工厂年剂量产能和已披露的 COGS 轨迹
    notes: 时间为定性判断。每个驱动因素 / 约束的证据见章节正文和 claims。尽调问题代表需要一手访问才能回答的开放问题。
