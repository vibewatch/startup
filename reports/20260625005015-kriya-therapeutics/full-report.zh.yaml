      - number: '4.2'
        title: 未来收入模式与商业化路径
        blocks:
          - type: paragraph
            body: >-
              Kriya 主要且目前意图中的收入来源，是一个或多个基因治疗候选物获监管批准后的商业化一次性产品销售。Series D 新闻稿明确称募资将用于「Kriya
              多个治疗领域基因治疗的临床试验」，把商业收入放在未来而非现在。Kriya
              的官方治疗定位把每个项目描述为由专科医生在门诊程序中递送的单剂量治疗。这种递送模式对应已获批基因治疗的商业规律：单患者高标价，向保险公司或支付方计费，并在治疗时确认收入。美国已获批一次性基因治疗的公开单患者标价从约
              $850,000（Luxturna，视网膜营养不良，2017 年）到约 $3.5 million（Hemgenix，血友病 B，2022 年）不等；这些公开基准建立了框架，尽管 Kriya
              的项目瞄准更大患者群（地图样萎缩在美国和欧盟约影响 2 million 人），可能需要低于罕见病极端价格，才能取得有意义的量。制造合作或平台授权也存在次级收入潜力：Kriya 垂直整合的 GMP
              平台原则上支持共同开发和合同制造安排，但没有公开披露任何已产生收入的交易。Series D 投资人 Premji Invest 特别把「基因治疗的开发和商业化」称为制造投资论点，暗示未来 CDMO
              或技术转移收入处于战略视野内。上市执行将需要覆盖神经科、眼科和肝病专科医生、医院系统以及专科药房报销渠道的专科销售基础设施，而 Kriya 尚未公开描述正在搭建这些能力。Sachiyo Minegishi 于
              2026 年 1 月被任命为 CFO，且此前有 Akouos（被 Eli Lilly 收购）和 bluebird bio
              经历，这释放出公司开始做商业化前财务规划的信号，但商业上市时间表或销售团队策略尚未公开披露。
