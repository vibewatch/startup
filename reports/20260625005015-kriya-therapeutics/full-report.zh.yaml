  - id: TU005
    title: 扩张与集中度风险表
    notes: >-
      风险评级是基于截至 2026 年 6 月公开 pipeline 和临床阶段信息作出的定性评估。Kriya 没有披露公司特定商业风险。严重性评级反映分析师判断，并参考基因疗法行业先例（如 Beqvez 退市、Luxturna
      采用挑战）。
    columns:
      - 风险维度
      - 描述
      - 严重性
      - 缓释 / 扩张驱动因素
      - 尽调路径
    rows:
      - - KRIYA-825 单资产集中
        - 这是临床进展最快、外部验证最多的项目；若失败，主要近期商业化路径就会消失
        - 高
        - 五个适应症的 pipeline 旨在分散风险；平台化制造也支持多个项目并行推进
        - 索取内部风险登记册；询问哪些触发因素会导致 KRIYA-825 暂停或终止
      - - 常见 GA 适应症的 Medicare 支付方准入
        - GA 患者以老年人为主；对常见适应症中数百万美元级基因疗法采用 Medicare Part B buy-and-bill 模式，还没有成型先例；Pfizer Beqvez 2024 年撤回说明风险真实存在
        - 高
        - 基于结果的报销安排（类似 Pfizer 的 Beqvez 保修计划）；可能接触 CMS TCET 路径；相较罕见病 AAV 采用更低标价定位
        - 索取 Kriya 报销策略文件；询问是否计划与 ICER 沟通；寻找支付方准入对话证据
      - - AAV 预筛查免疫原性排除
        - 视血清型而定，抗 AAV 抗体流行率会排除 20–40% 候选患者；KRIYA-825 特定衣壳排除率未披露
        - 中
        - 血清型选择和衣壳工程可降低既有免疫影响；直接视网膜递送可能允许更低衣壳剂量
        - 询问 Kriya 筛查过的 KRIYA-825 试验患者中，有多大比例因高抗 AAV 滴度被排除；索取衣壳选择依据
      - - 多项目计划执行滞后
        - JPM 2024 计划要求到 2025 年底最多 5 个项目进入临床；据 Labiotech，截至 2025 年 9 月只确认 2 个；MASH 截止节点（2025 年 Q1）据报未达成
        - 中
        - $320M Series D 为临床和 CMC 运营提供资金；一体化制造让项目排序保留一定弹性
        - 索取当前项目级里程碑与原计划的对照；询问 MASH 延误原因，以及该适应症是否仍在推进
      - - TN 或 TED 未披露患者倡议组织或 KOL 网络
        - 不同于 GA（ARVO 展示、Quan Dong Nguyen 背书）和 T1D（T1D Fund 投资），KRIYA-748（TN）和 KRIYA-586（TED）在公开领域没有具名专家、倡议伙伴或已发表数据
        - 中
        - 据报道 KRIYA-748 已进入临床，意味着存在某种研究者网络；TED 有 Tepezza 这个已验证邻近市场
        - 索取 KRIYA-748 和 KRIYA-586 的具名临床中心研究者及 KOL 顾问委员会构成
