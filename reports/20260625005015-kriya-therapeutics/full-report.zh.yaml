  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: 基因疗法产品获批并商业化上市后，慢性病患者需求如何转化为 Kriya 商业收入，并最终转化为毛利。
    data:
      nodes:
        - id: patient-population
          label: 慢性病患者人群（巨大未满足需求）
          detail: GA 美国 / 欧洲约 200 万；TED 美国 / 欧洲约 100 万；T1D 使用胰岛素患者约 1700 万；TN 美国 / 欧洲约 40 万。Kriya 称大规模存量市场是其区别于罕见病 GT 的核心。
        - id: physician-referral
          label: 专科医生识别并转诊符合条件的患者
          detail: 神经科、眼科或肝病专科医生把住准入口。门诊程序化递送（脉络膜上腔、球周、肌内注射）把渠道限制在专科场景。公司尚未披露商业销售团队。
        - id: payer-approval
          label: 付款方 / 保险公司覆盖决定
          detail: 基因疗法需要个体或机构层面的覆盖决定。获批后的覆盖周期历史上通常为 6–18 个月。Kriya 未披露付款方沟通计划。
        - id: product-sale
          label: 按标价一次性销售产品（待定）
          detail: 收入在治疗时确认；标价尚未确定。美国已获批的一次性 GT 可比产品定价为 $850K–$3.5M。Kriya 面向大人群，定价很可能低于 Hemgenix/Zolgensma 罕见病天花板。
        - id: net-revenue
          label: 净收入（扣除付款方折扣和返利后）
          detail: 经付款方谈判后，实际净价通常比美国标价低 15–40%。净收入未披露；公司还没有商业化产品。
        - id: cogs
          label: 生产 COGS（内部 AAV GMP、灌装 / 完成、QC）
          detail: 公司声称 50L/500L/3,000L 内部平台可相对 CDMO 降低单剂成本。COGS 未公开披露。生产杠杆论点取决于产量效率。
        - id: gross-profit
          label: 单剂毛利（未披露）
          detail: 公开数据无法量化毛利率。如果商业规模下成本主张得到验证，内部生产论点意味着毛利率高于依赖 CDMO 的同行。
    approximationNotes: 患者人群之后的所有节点都属于前瞻且未量化；目前没有商业收入。流程是结构性描述，依据官方来源披露的运营模式。价格、COGS、利润率等财务数值无法从公开来源获得。
    claimRefs:
      - CI001
      - CI026
      - CI027
      - CI029
      - CI032
  - id: FI002
    title: 单位经济桥
    type: flow
    layout: wide
    summary: 从临床阶段患者入组，经获批走向单患者收入经济性的推进路径；所有财务节点均标注为公开数据不可得。
    data:
      nodes:
        - id: clinical-enrollment
          label: 临床试验患者入组（Phase 1/2）
          detail: KRIYA-825 的地理萎缩 Phase 1/2 正在进行。KRIYA-748 已进入三叉神经痛临床。两项试验均属研究性；安全性和有效性尚未确立。
        - id: phase3-pivotal
          label: 关键 Phase 3 试验（未来）
          detail: BLA/NDA 申报需要该试验。时间和成本未披露。面向常见病的基因疗法 Phase 3 试验可能花费 $50M–$300M+，取决于适应症。
        - id: regulatory-approval
          label: FDA / EMA 监管批准（关口事件）
          detail: 获批会触发商业化上市和收入确认。Kriya 尚无获批产品。获批时间线未知；GA 试验于 2025 年启动。
        - id: list-price
          label: 单患者标价（不可得）
          detail: 尚未确定。行业可比：美国已获批一次性基因疗法定价 $850K–$3.5M。Kriya 聚焦大人群，定价可能低于罕见病天花板。
        - id: net-price
          label: 实际净价（不可得；估计较标价折让 15–40%）
          detail: 付款方谈判后的净价通常比美国标价低 15–40%。Kriya 任何项目均未披露。
        - id: cogs-per-dose
          label: 单剂生产 COGS（不可得）
          detail: 公司声称内部平台可降低生产成本。COGS 未公开披露；这是利润率模型的关键未知数。AAV 生产外部基准：每剂 $5K–$100K+，取决于批量规模和工艺成熟度。
        - id: gross-margin
          label: 单剂毛利率（不可得；内部生产支撑正向论点）
          detail: 公开数据无法量化。公司和 Series D 投资人把内部生产视为规模化后实现商业可行利润率的路径。
    approximationNotes: 所有财务节点要么不可得，要么来自外部基准估算；没有一项是 Kriya 披露的数据。临床和监管节点反映公开来源中的当前管线状态。外部 AAV COGS 基准是行业估计，不是 Kriya 数据。
