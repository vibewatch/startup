            title: Approved complement inhibitors and well-capitalized incumbents compress Kriya's window
            body: >-
              Syfovre and Izervay are entrenched in GA with payer coverage and specialist familiarity. JNJ-1887
              (Janssen) and Complement Therapeutics are entering the gene-therapy lane. If either advanced-stage rival
              (especially Janssen, with pharma distribution) reaches approval first, Kriya faces a structurally harder
              market-entry problem than a standard first-mover gene therapy launch, including physician adoption, payer
              contracting, and center certification for suprachoroidal administration.
            calloutType: risk
            claimRefs:
              - CP006
