      - number: '3.4'
        title: Gene-therapy platform and manufacturing comparables
        blocks:
          - type: paragraph
            body: >-
              Kriya is one of a small cohort of companies pursuing multi-indication AAV platforms, and its public
              company comparables illustrate the financial scale of the sector. MeiraGTx ($1.07B market cap as of June
              2026) has the most structurally similar multi-program profile — salivary gland gene therapy (AAV-hAQP1 for
              xerostomia) in Phase 3, retinal gene therapies across several IRDs, and Parkinson's disease in Phase 2 —
              alongside riboswitch-regulated therapies for metabolic disease. uniQure ($3.08B market cap as of June
              2026) is the most financially substantial pure-play comparable: its hemophilia B gene therapy became the
              world's first approved hemophilia gene therapy in 2022, providing a commercial proof point for AAV in
              chronic disease. REGENXBIO ($0.51B market cap) licenses its NAV platform and has retinal programs. Sarepta
              Therapeutics ($1.76B market cap) has a commercial gene therapy in Duchenne and a large manufacturing base.
              Bluebird bio ($48.66M market cap as of mid-2025) illustrates the severe execution risk — commercial
              launches of multiple lentiviral products failed to generate sufficient revenue, leading to
              near-insolvency. On the approved-product front, Spark Therapeutics (now fully integrated into
              Roche/Genentech) achieved the first ocular gene therapy approval with Luxturna; Pfizer's BEQVEZ received
              FDA approval for hemophilia B, with single-dose treatment eliminating bleeding in 60% of Phase 3 patients.
              These incumbents bring distribution networks, payer access, and regulatory trust that Kriya has not yet
              demonstrated. Novartis Gene Therapies (formerly AveXis) fields Zolgensma for SMA and explores AAV and
              CRISPR approaches in neurology and ophthalmology, representing the largest platform capability in the
              sector. Kriya's differentiation within this peer set is its three-therapeutic-area scope paired with
              in-house manufacturing at 3,000L bioreactor scale — a combination no single public comparator precisely
              replicates — but this advantage is unvalidated through commercial throughput or independent audit.
