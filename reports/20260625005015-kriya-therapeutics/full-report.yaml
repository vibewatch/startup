      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Massive Patient Pool Relative to Traditional AAV Indications
            body: >-
              Kriya's five indications collectively represent approximately 48.4 million patients in the US+EU, versus
              the sub-100,000 populations typical of approved AAV drugs. Even at modest penetration rates (1-5%), the
              commercial ceiling for prevalent-disease AAV is an order of magnitude higher than the hemophilia B or SMA
              markets. The GA indication alone (~2M US+EU) is 50x the size of the hemophilia B global patient population
              (~38K worldwide). This market scale justifies the $920M+ capital build if clinical and commercial
              translation is achievable.
            calloutType: strength
            claimRefs:
              - CM001
              - CM003
              - CM035
          - type: callout
            title: AAV Market Size Estimates Diverge 5x and SAM Cannot Be Isolated
            body: >-
              The four principal analyst market estimates for the global AAV gene therapy market diverge by more than
              five times at the 2035 forecast horizon ($21.6B vs. $112.2B), and none provides a dedicated SAM for
              Kriya's specific prevalent-disease AAV sub-segment. This uncertainty is not just methodological noise—it
              reflects genuine unknowns about how many common-disease programs will reach approval, at what prices, and
              with what payer support. Investors relying on headline TAM numbers should apply heavy discounting when
              those numbers are used to justify valuations for a company with no approved product.
            calloutType: risk
            claimRefs:
              - CM017
              - CM040
          - type: callout
            title: Medicare Dominates the GA Market — Reimbursement Pathway Uncharted
            body: >-
              The majority of US geographic atrophy patients are Medicare-eligible (age 65+), and CMS has no published
              coverage policy for prevalent-disease AAV gene therapies as of June 2026. The high one-time price models
              that enabled hemophilia B gene therapy (HEMGENIX, Beqvez) work for a narrow rare-disease population but
              face structural resistance when applied to two million GA patients. Outcomes-based warranties (Pfizer's
              Beqvez model) are emerging but require multi-year durability data. Kriya has not disclosed its pricing
              strategy or payer engagement progress.
            calloutType: risk
            claimRefs:
              - CM033
              - CM030
              - CM041
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Approved GA standard-of-care — the principal displacement target
        blocks:
          - type: paragraph
            body: >-
              Geographic atrophy (GA) is the indication most central to Kriya's near-term investment case, and two
              FDA-approved complement inhibitors define the status quo Kriya must displace. Syfovre (pegcetacoplan,
              Apellis Pharmaceuticals) is a C3 inhibitor administered as monthly or bimonthly intravitreal injection;
              Izervay (avacincaptad pegol, Astellas) is a C5 inhibitor administered monthly by intravitreal injection.
              Both provide clinically-meaningful but incomplete slowing of GA lesion growth; neither halts disease
              progression nor eliminates the need for repeated physician-administered injections. This creates the
              market opening Kriya targets: a one-time suprachoroidal AAV gene therapy (KRIYA-825) that delivers
              continuous complement inhibition without recurrent injections. The displacement logic is mechanistically
              sound, but Syfovre and Izervay benefit from years of real-world safety data, established payer
              relationships, specialist physician familiarity, and commercial distribution infrastructure that Kriya has
              not yet built. The switching-cost for retina specialists who have integrated bimonthly injection schedules
              for existing patients is also non-trivial; a gene therapy entrant must demonstrate durable efficacy and a
              clean safety profile before payers and physicians re-route patients. For thyroid eye disease (TED), the
              comparable incumbent is the intravenously administered anti-IGF1R monoclonal antibody — the only
              FDA-approved TED therapy — which requires multiple IV infusions at infusion centers. KRIYA-586 targets the
              same IGF1R pathway via a single peribulbar AAV injection, offering local expression and reduced systemic
              exposure if clinical data support the mechanism.
