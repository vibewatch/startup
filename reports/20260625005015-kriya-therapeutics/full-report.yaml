  - id: FE001
    title: Kriya gene therapy product architecture — integrated platform stack
    type: stack
    layout: standard
    summary: >
      Layered view of Kriya's integrated gene therapy engine from biology foundation through computational design,
      manufacturing, and clinical delivery.
    data:
      layers:
        - label: Biology & Target Selection
          modules:
            - Validated Biology — known proteins with clinical/regulatory precedent
            - Disease Selection — large prevalent disease with validated endpoints
            - Academic Partnerships — UAB (FGF21 biology), NIH preclinical research
            - Protein Engineering — computational and experimental optimization
        - label: SIRVE™ Computational Vector Engineering
          modules:
            - Sequence Modification — computationally-driven sequence optimization
            - ML Optimization — machine learning for manufacturability and expression
            - Capsid Selection — known clinically-validated serotypes (AAV1, AAV5)
            - Generative Deep Learning — de novo improvement of biologics
            - Immune Profile Screening — immunogenicity optimization in-platform
        - label: STRIPE™ Manufacturing Platform
          modules:
            - Cell Line Technology — optimized production cell lines
            - Upstream Process — bioreactor conditions for high yield at 50L to 3,000L
            - Downstream Process — purification and formulation for purity and yield
            - Analytical Development — ddPCR, potency assays, CQA monitoring
        - label: GMP Production at 51,000 sq ft RTP Facility
          modules:
            - Multi-product cGMP manufacturing for any AAV serotype
            - Scale at 50L, 500L, and 3,000L bioreactors
            - In-house Fill/Finish and QC Release Testing
            - Active multi-program campaigns simultaneously
        - label: Focal Delivery Technologies
          modules:
            - Suprachoroidal — Everads Injector for KRIYA-825 and future ophthalmology
            - Intramuscular — Multi-site AAV1 for KRIYA-839 (T1D) and KRIYA-497 (MASH)
            - Peribulbar — periorbital fat and muscle injection for KRIYA-586 (TED)
            - Nerve Injection — trigeminal nerve for KRIYA-748 and brain foci for KRIYA-382
        - label: Clinical Pipeline
          modules:
            - Phase 1/2 — KRIYA-825 (GA) and KRIYA-748 (TN)
            - IND-Enabling — KRIYA-586 (TED), KRIYA-839 (T1D), KRIYA-497 (MASH), KRIYA-382 (Epilepsy)
            - Discovery/Research — KRIYA-296, KRIYA-652, KRIYA-454 (undisclosed)
