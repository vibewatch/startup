    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Kriya Therapeutics presents itself in 2026 as a clinical-stage biopharmaceutical company pursuing one-time
              gene therapies for common chronic diseases rather than a rare-disease niche player. The core positioning
              is explicit on the company website and in recent financing releases: Kriya wants gene therapy to become
              accessible 'for the many' by pairing validated biology with lower-cost, scalable AAV manufacturing and
              direct-to-tissue delivery. Public materials show a meaningful evolution in how the company describes its
              footprint. Early financing and manufacturing releases used Redwood City or broader Silicon Valley
              datelines, while 2023 onward materials increasingly use Palo Alto and Research Triangle Park. The safest
              working conclusion is that Kriya maintains a Bay Area leadership and design presence while anchoring
              manufacturing and a growing share of clinical operations in RTP. The latest disclosed public pipeline is
              concentrated in ophthalmology, metabolic disease, and neurology.
