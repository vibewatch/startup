  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Kriya scores adequately on market opportunity and platform moat but very low on clinical proof and valuation
      transparency, consistent with a track call.
    data:
      items:
        - label: Market opportunity
          score: 4
          detail: Geographic atrophy and prevalent chronic diseases are large markets for a durable one-time therapy.
          tone: positive
        - label: Clinical proof
          score: 1
          detail: No human efficacy data; KRIYA-825 only entered Phase 1/2 in May 2025.
          tone: negative
        - label: Platform moat
          score: 3
          detail: Internally built GMP AAV manufacturing cited by Premji Invest as differentiated.
          tone: neutral
        - label: Capital efficiency
          score: 2
          detail: ~$920.5M raised with only two of nine programs in the clinic; Labiotech flags capital outrunning output.
          tone: warning
        - label: Financial risk
          score: 2
          detail: No disclosed burn or runway; sector funding fell 83% from 2021 to 2024.
          tone: warning
        - label: Valuation transparency
          score: 1
          detail: No disclosed price per share or post-money; Caplight confirms no mark is available.
          tone: negative
        - label: Evidence quality
          score: 2
          detail: Filing-grade financing data exists, but clinical and valuation evidence is thin or single-sourced.
          tone: warning
    approximationNotes: Scores are 1-5 ordinal judgments synthesized from the public evidence set for IC discussion.
    claimRefs:
      - CV024
      - CV027
      - CV032
      - CV033
