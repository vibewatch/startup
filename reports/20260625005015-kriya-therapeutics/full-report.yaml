      - number: '7.5'
        title: Partner, Political, and Governance Risk
        blocks:
          - type: paragraph
            body: >-
              Kriya's financing structure concentrates disproportionate influence with Patient Square Capital, which led
              the Series B ($100 million, 2021) and co-led the Series D ($320 million, 2025)—covering approximately 45
              percent of the confirmed announced capital. A single GP's strategic or portfolio-level decision to reduce
              support, exit, or renegotiate could create significant financing pressure at a time when the company is
              years from first approval and cash-dependent. The August 2025 SEC Form D showed $313.3 million raised from
              only two investors, indicating a narrow group of sophisticated capital providers at that pre-Series D
              stage—a concentration pattern that, if it continues into the next round, represents structural financing
              risk.

              Three named investors in the Series D—Narya Capital, co-founded by J.D. Vance (now US Vice President);
              Peter Thiel; and The T1D Fund—bring political and ideological associations that create scrutiny risk in
              the current regulatory climate. Labiotech explicitly identified that Shankar Ramaswamy's relationship as
              CEO to his brother Vivek Ramaswamy (billionaire Roivant Sciences founder, political candidate) raises
              questions about deal sourcing and governance independence. J.D. Vance's disclosed $50,000 to $100,000
              investment while a sitting Senator, and his subsequent elevation to Vice President, creates a potential
              conflict-of-interest optic that political opponents could exploit. None of these connections have been
              alleged to constitute legal violations, but they increase governance transparency risk for any future
              public-market exit or government-payee commercial relationship.

              IP dependencies on licensed technology add further structural risk. KRIYA-825 is based on a license from
              the MUSC Foundation for Research; KRIYA-748 uses chemogenetics IP licensed by Redpin from the Howard
              Hughes Medical Institute; and KRIYA-497 uses FGF21 biology developed at UAB via the Tramontane
              acquisition. License revocation, royalty escalation, sublicensing restrictions, or university spinout
              acquisition by a competitor could each disrupt individual programs. The full board composition and
              independent director complement are not publicly disclosed, making it impossible to verify governance
              safeguards from public sources.
