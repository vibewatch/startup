  - id: FU001
    title: Customer journey map — pre-commercial pathway from patient need to potential commercial delivery
    type: journey-map
    layout: wide
    summary: >-
      Kriya has no commercial customers as of June 2026. The journey map traces the hypothetical pathway a GA patient,
      retina specialist, and payer would follow from unmet need through trial enrollment to eventual commercial product
      use. The only stages Kriya has publicly reached are specialist engagement, IND registration, and trial initiation.
    data:
      nodes:
        - id: j1
          label: Unmet disease need recognized
          detail: >-
            Retina specialists identify GA patients currently receiving monthly/bimonthly intravitreal Syfovre or
            Izervay injections with significant treatment burden. Approximately 2 million US+EU patients with GA; NEI
            reports ~11 million total AMD patients in the US.
          tone: neutral
        - id: j2
          label: Specialist scientific evaluation
          detail: >-
            Retinal specialists evaluate preclinical and early clinical data at ARVO and other ophthalmic conferences.
            Kriya presented KRIYA-825 preclinical data at ARVO 2025 (May 2025) and ARVO 2024. Named KOL Quan Dong Nguyen
            publicly endorsed the clinical rationale in 2023.
          tone: positive
        - id: j3
          label: Clinical trial enrollment (current stage)
          detail: >-
            Patients screened at investigational sites; anti-AAV antibody pre-screening excludes a fraction; consenting
            patients enrolled in Phase 1/2 safety and dose-escalation study. KRIYA-825 Phase 1/2 confirmed initiated in
            early 2025.
          tone: warning
        - id: j4
          label: Phase 2 / pivotal trial and regulatory review
          detail: >-
            Following Phase 1/2 safety data, a pivotal efficacy trial would be required. The standard GA endpoint is
            rate of change in lesion area on FAF imaging. FDA approval and labeling would determine the eligible patient
            population and administration setting. Not yet initiated.
          tone: negative
        - id: j5
          label: Payer coverage and reimbursement negotiation
          detail: >-
            Medicare Part B coverage determination required; outcomes-based contract or TCET pathway likely for
            multi-million-dollar one-time therapy in a Medicare population. No commercial analog in GA; Beqvez
            commercial failure in hemophilia B (2024) is the cautionary precedent.
          tone: negative
        - id: j6
          label: Commercial prescription and administration
          detail: >-
            Retina specialists at qualifying centers would prescribe, order, and administer KRIYA-825 via suprachoroidal
            injection using the Everads injector. Revenue recognized at point of administration. No commercial delivery
            has occurred.
          tone: negative
    claimRefs:
