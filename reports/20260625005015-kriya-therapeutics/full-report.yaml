            title: Manufacturing platform represents the most defensible long-term cost and margin lever
            body: >-
              Kriya's vertically integrated GMP platform—built from 50L to 3,000L scale with internal fill/finish, QC
              release, and a single process applicable from research through commercialization—is the central financial
              thesis. If the cost reduction claims of the STRIPE platform are validated at commercial scale, gross
              margins per approved dose could be meaningfully higher than CDMO-dependent peers. The platform is also the
              primary basis on which Series D investors explained their conviction. The manufacturing asset is already
              built and operational, which means the capex has been largely sunk and future costs shift toward operating
              leverage rather than additional buildout.
