              2025; the September 2025 press release announces a $320 million Series D close with multiple named
              investors. The $6.7 million gap and the different investor count create ambiguity: either these reflect
              successive tranches of one transaction or two separate financings. The conservative underwriting anchor is
              $920.5 million confirmed total. If the Form D is additive, the total exceeds $1.23 billion, which changes
              the implied capital intensity and burn durability picture materially.
            calloutType: risk
