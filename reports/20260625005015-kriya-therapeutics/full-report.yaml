            title: Capital Efficiency Concern Is Structural, Not Cyclical
            body: >-
              Kriya has raised more than $920 million in confirmed capital with two programs in early Phase 1/2 and
              seven programs in pre-clinical or IND-enabling stage. The Labiotech critique—"candidates disappearing from
              the pipeline, unmet development deadlines, and a lack of transparency"—reflects a structural pattern of
              platform investment preceding clinical output, not a temporary delay. Three of the original programs from
              2020 have been silently discontinued; the MASH IND missed its public commitment deadline by at least
              twelve months; and the JPM 2024 guidance of five programs in clinic by end-2025 was not achieved. Against
              this backdrop, the Series D was oversubscribed and patient Square Capital doubled down—indicating that
              sophisticated capital is betting on the manufacturing platform thesis despite the clinical lag. But the
              diligence ask is sharp: investors should require an explicit capital efficiency tracker (dollars spent per
