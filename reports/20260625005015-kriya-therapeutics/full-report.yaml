      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The AAV gene therapy market has clear structural tailwinds. Multiple new approvals in 2024 (Beqvez,
              Kebilidi) and a growing pipeline of 176+ active clinical trials as of mid-2025 demonstrate that FDA and
              EMA are processing AAV BLAs with increasing fluency. AI-accelerated capsid engineering (exemplified by
              Roche/Dyno's $1B+ collaboration in October 2024) is compressing the time from novel serotype to clinical
              candidate. Vertically integrated manufacturing—Kriya's specific strategy—addresses the historical
              bottleneck of limited cGMP AAV capacity, which remains a constraint for smaller biotechs relying on CDMOs.

              For prevalent-disease AAV specifically, the demand-side driver is the inadequacy of current chronic
              maintenance therapies. GA patients who are receiving monthly injections of Syfovre or Izervay still
              experience progressive lesion growth, and disease control is partial. The majority of T1D patients do not
              meet glucose targets despite advanced monitoring and pump technology. These unmet-need gaps give Kriya a
              clinical rationale for a one-time gene therapy even if that therapy cannot be definitively curative.

              The most material adoption constraints are: (1) immunogenicity—pre-existing neutralizing antibodies
              against common AAV serotypes exclude a meaningful fraction of the patient population from eligibility;
              Pfizer's Beqvez requires pre-treatment NAb screening for AAVRh74var, and the seroprevalence of
              neutralizing antibodies against engineered capsids used by Kriya has not been publicly disclosed; (2)
              pricing and reimbursement risk in a Medicare-dominated GA market—the high one-time cost model that works
              for ultra-rare hemophilia B (38,000 patients globally) faces far more scrutiny when applied to two million
              GA patients across the US and EU; (3) the Elevidys safety event, in which FDA requested Sarepta to suspend
              distribution following patient deaths in 2025, which tightened payer and clinician risk tolerance for
              systemic AAV programs and raised the bar for safety data in any first-in-human submission; (4)
              manufacturing scale—in-house manufacturing dominates (54–60%) but commercial-scale AAV production cost
              structures for prevalent-disease volumes have not been publicly validated; and (5) competitive timing risk
              in GA, where Complement Therapeutics CTx001 (Phase 1/2 IND cleared October 2025) and multiple other
              gene/cell therapy programs are racing to establish first-mover data readouts.
            claimRefs:
