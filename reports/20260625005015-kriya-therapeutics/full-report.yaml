      - number: '6.4'
        title: Named partner, investor, and specialist validation as customer-proof substitutes
        blocks:
          - type: paragraph
            body: >-
              In the absence of commercial customers, the best available evidence of demand validation comes from three
              categories of named stakeholders who have committed capital, technology, or professional reputation to
              Kriya's clinical programs.

              Delivery technology partnership (Everads Therapy): In September 2023, Kriya and Everads announced an
              exclusive license, collaboration, and supply agreement covering multiple ophthalmic gene therapy programs.
              Moshe Weinstein, Executive Chair and CEO of Everads, stated publicly that "our suprachoroidal delivery
              technology provides a potential leap forward for novel eye care therapies." This partnership means that
              Everads, a technology company with direct commercial incentive to validate the delivery route, has
              committed to Kriya as its gene therapy partner for retinal programs. As of May 2026, the Everads news page
              confirmed that Everads technology was being featured in three poster presentations at ARVO 2026 and that
              first-in-human clinical data had been published in Ophthalmology Science, the peer-reviewed journal of the
              American Academy of Ophthalmology. The clinical validation of the Everads device adds indirect support for
              the feasibility of KRIYA-825's delivery route.

              Disease-advocacy investment (T1D Fund / Breakthrough T1D): The T1D Fund, the investment subsidiary of
              Breakthrough T1D (the largest T1D patient advocacy organization), was a named participant in Kriya's
              September 2025 Series D financing. The T1D Fund's mission is specifically to "catalyze the development of
              T1D cure-oriented therapies through investments" and it describes itself as leveraging "its vast research,
              clinical, regulatory, and medical affairs network on behalf of its portfolio companies." The T1D Fund's
              investment in Kriya constitutes the closest available signal that organized T1D patient and advocacy
              stakeholders have validated KRIYA-839's clinical rationale.

              Strategic PE investor validation (Patient Square Capital, Premji Invest): Patient Square Capital led
              Kriya's Series B and re-led the Series D. Managing Partner Jim Momtazee stated publicly: "We have been
              proud to support Kriya since Patient Square led the company's Series B funding round in 2021 and have been
              impressed with the team's vision and the platform's scientific and commercial potential." Premji Invest's
              Akshay Rai, whose firm co-led the Series D, stated that the investment thesis "centered on the company's
              advanced manufacturing platform, built to support the development and commercialization of gene therapies
              for prevalent diseases in large markets." These named investor statements are the closest available public
              substitutes for commercial buyer validation in a pre-revenue biotech.

              Named specialist KOL endorsement (Quan Dong Nguyen, MD, Stanford): The Everads collaboration press release
              included a public statement from Quan Dong Nguyen, MD, MSc, FARVO, FASRS, Professor of Ophthalmology at
              the Byers Eye Institute at Stanford University School of Medicine, who stated: "Geographic atrophy causes
              a debilitating loss of vision... A gene therapy targeting the C3 and C5 pathways delivered by a
              suprachoroidal injection may be a significant improvement in the treatment of geographic atrophy." This
              named endorsement by a senior retinal specialist at a leading academic center constitutes meaningful
              evidence that the intended prescriber community recognizes the unmet need that KRIYA-825 addresses.

              All of these validation sources are indirect and forward-looking. None constitutes evidence of a
              commercial transaction, patient payment, or payer coverage decision. They represent the diligence
              investor-relevant signals that the relevant stakeholder ecosystem has validated Kriya's clinical
              thesis—but they are not commercial customer proof in the conventional sense.
