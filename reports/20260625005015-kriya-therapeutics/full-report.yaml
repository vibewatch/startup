      - number: '6.2'
        title: Future buyer, user, and payer surfaces mapped by indication
        blocks:
          - type: paragraph
            body: >-
              Each of Kriya's five disclosed indications has a meaningfully distinct buyer-user-payer configuration that
              will shape commercial strategy and market access requirements.

              Geographic atrophy (KRIYA-825): The prescriber is a board-certified retinal specialist at an academic or
              community retinal practice, consistent with the two currently FDA-approved GA treatments (Syfovre and
              Izervay) which are administered by retina specialists. The Syfovre prescribing label specifies
              intravitreal injection by an ophthalmologist; KRIYA-825's suprachoroidal route via the Everads injector
              could similarly be performed by a retinal specialist in an office or ambulatory surgical center setting.
              GA's typical patient age is over 65 (AMD affects approximately 11 million Americans per NEI, with
              prevalence sharply rising after age 55), making Medicare Part B the dominant payer. Part B covers
              physician-administered biologics under a "buy-and-bill" model; gene therapy reimbursement in this channel
              is at an unresolved stage for prevalent chronic diseases. The $3.4 million list price of Hemgenix and the
              $3.5 million price of Zolgensma demonstrate that gene therapy list prices exceed traditional Medicare
              reimbursement norms, creating a payer-access friction specific to prevalent Medicare beneficiary
              populations.

              Thyroid eye disease (KRIYA-586): TED is an autoimmune disease affecting about one-third of Graves' disease
              patients; the American Thyroid Association notes that only 5% develop severe ocular manifestations
              requiring systemic treatment. The prescriber is a neuro-ophthalmologist, oculoplastic surgeon, or
              endocrinologist, and the current standard of care (Tepezza, teprotumumab) is administered by IV infusion
              in a clinical infusion setting. KRIYA-586's peribulbar injection route could be performed by a specialist
              in an office. Commercial insurance dominates TED payer mix because TED commonly affects working-age adults
              with Graves' disease.

              Type 1 diabetes (KRIYA-839): The prescribing physician is a board-certified endocrinologist or pediatric
              endocrinologist. The payer mix spans commercial insurance (children and working-age adults, ~1.7 million
              diagnosed T1D adults taking insulin per NIDDK) and Medicare (T1D adults over 65). The T1D Fund's
              investment in Kriya's Series D signals that the major T1D patient advocacy organization (Breakthrough T1D)
              has validated KRIYA-839's clinical rationale. Intramuscular delivery is procedurally simpler than
              intraocular or IV routes, which would lower the procedure-site barrier for adoption.

              MASH (KRIYA-497): Hepatologists and gastroenterologists are the likely prescribers for patients with MASH
              at F3/F4 fibrosis stages. The payer is likely commercial insurance for younger patients and Medicare for
              older, given MASH's association with metabolic syndrome across age groups. No FDA-approved gene therapy
              exists for MASH; this indication is the least clinically advanced in Kriya's pipeline.

              Trigeminal neuralgia (KRIYA-748): The prescribing physician is a neurologist or pain specialist, with
              referral from primary care for medically refractory patients who have cycled through anticonvulsant
              medications. The NINDS notes that TN affects about 150,000 Americans annually; the NORD database lists
              approximately 400,000 US+EU patients. Commercial insurance and Medicare share coverage depending on
              patient age.
