      - number: '3.2'
        title: Direct ocular gene-therapy competitors
        blocks:
          - type: paragraph
            body: >-
              At least three gene therapy programs are pursuing geographic atrophy using AAV vectors, creating a crowded
              Phase 1–2 gene-therapy space distinct from the approved complement- inhibitor field. Complement
              Therapeutics (CTx001) is the most structurally comparable rival to KRIYA-825: both are AAV-based, both
              target the complement cascade, and both are entering first-in-human trials in 2025-2026. The mechanistic
              split is meaningful — KRIYA-825 delivers a novel CR2-CR1 fusion protein designed to inhibit both C3 and C5
              and to bind complement fragments at the cell surface, whereas CTx001 delivers a truncated version of
              Complement Receptor 1 (mini-CR1) targeting the classical and alternative pathways. The CTx001 IND was
              cleared by the FDA in late 2025; the Opti-GAIN Phase 1/2 first-in-human study was expected to begin dosing
              in the US in Q1 2026, approximately twelve months behind KRIYA-825's May 2025 clinical start. JNJ-1887
              (Janssen) is an intravitreal AAV gene therapy expressing soluble CD59 (sCD59), a complement pathway
              membrane-attack-complex inhibitor, in Phase 2 as of late 2024 — at a more advanced clinical stage but with
              a different mechanism and delivery route. OCU410 (Ocugen) uses AAV5 to deliver the RORA
              transcription-factor gene in a non-complement mechanism, in Phase 1/2. The broader GA pipeline includes
              non-gene modalities competing for the same patients: Annexon's vonaprument (ANX007), an intravitreal Fab
              antibody targeting C1q, moved to Phase 3 (ARCHER II, enrollment completed, data expected 2H 2026); Alkeus
              Pharmaceuticals' oral gildeuretinol (ALK-001) showed a statistically significant 15.3% lesion growth
              reduction from months 6 to 24 in Phase 3 SAGA data. These programs may reduce the available patient pool
              for Kriya's Phase 1/2 enrollment and raise the efficacy bar for any eventual approval.
