      - number: '7.4'
        title: Reimbursement and Business Model Risk
        blocks:
          - type: paragraph
            body: >-
              The single highest-severity long-run risk for Kriya is commercial failure in a reimbursement environment
              that has not yet demonstrated the ability to pay for gene therapy at prevalent-disease scale. Every
              approved gene therapy has targeted rare or ultra-rare diseases where small patient populations justify
              extreme per-patient pricing and payer willingness-to-pay is relatively well-established. Kriya's
              geographic atrophy program targets approximately two million patients in the United States and EU—a
              patient pool more than one hundred times larger than typical rare- disease gene therapy markets. Pricing a
              treatment for a two-million-patient disease at rare-disease list prices ($850,000 to $3.5 million per
              patient) is commercially implausible; but pricing it at a level that penetrates the GA market requires
              manufacturing economics that have never been demonstrated at scale.

              Approved rare-disease gene therapies have already revealed commercial fragility. Hemgenix (etranacogene
              dezaparvovec, CSL Behring, approved 2022) carries a $3.5 million list price and has had minimal commercial
              uptake due to payer resistance. Pfizer withdrew Beqvez from the US market in 2025 despite FDA approval.
              Bluebird bio, the pioneer of commercial gene therapy with approved products Zynteglo and Skysona,
              collapsed from a $8.74 billion market capitalization peak to near- insolvency at approximately $48 million
              by June 2025. These examples directly inform what awaits Kriya: even with regulatory approval, commercial
              success is not guaranteed and commercial failure is precedented.

              Geographic atrophy predominantly affects the elderly; the vast majority of US patients are Medicare
              beneficiaries. CMS Medicare coverage for high-cost gene therapies is uncertain and has historically been
              conservative for new modalities. ICER's health-technology assessment frameworks routinely conclude that
              gene therapy list prices exceed cost-effectiveness thresholds, creating additional payer resistance. Kriya
              has not disclosed any commercial pricing strategy, outcomes-based contracting approach, patient access
              program, or payer engagement roadmap for any program. Sachiyo Minegishi's appointment as CFO in January
              2026, with prior Akouos and bluebird bio experience, is a positive signal for commercialization planning,
              but is entirely a capability building-block and not evidence of a resolved commercial pathway.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
