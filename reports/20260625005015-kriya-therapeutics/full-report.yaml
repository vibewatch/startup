      - number: '3.3'
        title: Metabolic-disease and neurology competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Kriya's metabolic pipeline faces very different competitive dynamics across its two programs. For MASH
              (KRIYA-497, FGF21 gene therapy), the most immediate comparator is Rezdiffra (resmetirom, Madrigal
              Pharmaceuticals), an oral THRβ agonist that was the first FDA-approved treatment for MASH with liver
              fibrosis. Multiple injectable and oral FGF21 agonist programs (efruxifermin, pegozafermin) have generated
              Phase 2 data showing reversal of fibrosis, directly validating the FGF21 biology Kriya uses but providing
              proof-of-concept that competitors can deliver FGF21 biology without gene therapy. Kriya's potential
              differentiation for MASH is one-time durability, steady native FGF21 levels to minimize GI side-effects
              from Cmax spikes, and combination advantage for patients on multiple oral therapies — but none of these
              has clinical validation yet. For type 1 diabetes (KRIYA-839), the competitive landscape is defined by
              insulin pumps and continuous glucose monitors as the technology standard of care, and by cell-therapy
              programs (Vertex VX-880, CRISPR Therapeutics/ViaCyte islet approaches) as the clinical gene/cell-therapy
              frontier. Kriya's skeletal muscle insulin and glucokinase co-expression approach is mechanistically
              distinct from islet replacement but has not yet entered the clinic; the T1D gene therapy field still lacks
              proven durability data from any program. For trigeminal neuralgia (KRIYA-748), the standard of care
              remains anticonvulsants such as carbamazepine and oxcarbazepine, which lose efficacy over time and carry
              tolerability burdens, and neurosurgical procedures (MVD, Gamma Knife, balloon compression) that are
              invasive with variable durability. There is no FDA-approved gene therapy for TN; KRIYA-748's
              chemogenetically-gated ion channel paired with orally administered varenicline represents a genuinely
              differentiated approach, but its competitive moat depends entirely on clinical proof that has not been
              generated.
