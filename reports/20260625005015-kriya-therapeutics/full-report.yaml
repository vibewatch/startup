          - type: callout
            title: Gene therapy sector headwinds add systematic financial risk beyond Kriya-specific factors
            body: >-
              The broader gene therapy field saw venture funding fall 83% from 2021 to 2024. Peer examples illustrate
              the binary outcomes: bluebird bio peaked at nearly $10 billion valuation and was taken private for $30
              million; Pfizer withdrew its hemophilia gene therapy Beqvez from the market. Kriya's unusual fundraising
              success against these headwinds—often attributed in external commentary to political connections rather
              than clinical milestones—means the capital base is real but the sector risk is not diversified away. Any
              delay in clinical readouts or a setback in the GA Phase 1/2 trial could trigger a reassessment of investor
              conviction.
            calloutType: risk
