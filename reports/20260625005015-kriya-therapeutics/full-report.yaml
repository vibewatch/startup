    title: Unit economics bridge
    type: flow
    layout: wide
    summary: >-
      Progression from clinical-stage patient enrollment through approval to per-patient revenue economics, with all
      financial nodes marked as unavailable from public data.
    data:
      nodes:
        - id: clinical-enrollment
          label: Clinical trial patient enrollment (Phase 1/2)
          detail: >-
            KRIYA-825 Phase 1/2 currently underway in geographic atrophy. KRIYA-748 in clinic for trigeminal neuralgia.
