      - number: '7.3'
        title: Manufacturing, CMC, and Operational Risk
        blocks:
          - type: paragraph
            body: >-
              Kriya's investment thesis places manufacturing differentiation at the center of its value proposition: the
              company claims that its Research Triangle Park facility can produce any AAV serotype at scales from 1L to
              3,000L with a uniform platform process that avoids costly tech-transfer events between clinical and
              commercial production. If this claim holds, it provides durable cost advantage over CDMO-dependent
              competitors. If it does not hold at commercial scale or under multi-product GMP conditions, it eliminates
              the primary pillar of the differentiated story.

              No commercial-scale production campaigns have yet been executed because no products are approved. The
              manufacturing platform is entirely unvalidated against the regulatory bar for commercial supply—a material
              distinction between the company's scale-up assertions and what the FDA and EMA will require in the
              Chemistry, Manufacturing, and Controls (CMC) sections of a future BLA. AAV manufacturing is historically
              among the most technically demanding large-molecule processes. Batch failure rates in early platform
              development are material, empty capsid contamination is a persistent quality challenge, and scale-up from
              bench to pilot to GMP clinical to commercial can expose yield inconsistencies that require process changes
              and re-validation cycles. The claimed continuity from 50L to 3,000L without process changes is a
              competitive assertion, not yet a demonstrated regulatory fact.

              A multi-product GMP facility introduces scheduling conflicts and cross-contamination risk across nine
              pipeline programs simultaneously. The company discloses "active GMP manufacturing operations ongoing, with
              multiple large-scale campaigns across several pipeline programs," but does not disclose batch success
              rates, yield per campaign, or COGS per dose. The Everads Therapy suprachoroidal injector used in KRIYA-825
              NHP studies introduces a single-source device dependency that adds FDA combination product complexity
              (drug-device combination requiring coordinated regulatory strategy) and supply chain risk if Everads
              encounters technical or financial difficulties.
