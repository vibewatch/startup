              - CE041
              - CE042
              - CE043
              - CE044
              - CE045
              - CE046
              - CE047
      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Validated-biology target selection minimizes de-risking cost
            body: >
              By selecting targets with prior FDA-approved small-molecule or biologics validation (complement C3/C5 for
              GA, IGF1R for TED, FGF21 for MASH), Kriya dramatically compresses the translational hypothesis risk
              relative to novel biology programs. KRIYA-825 benefits from two approved drugs that confirm C3 and C5
              pathway suppression slows GA, and KRIYA-586 targets the same IGF1R pathway as tepezza. This approach
              justifies lower preclinical proof standards while preserving a differentiated mechanism.
            calloutType: strength
            claimRefs:
              - CE016
              - CE019
              - CE022
          - type: callout
            title: Zero published human data after $1.2 billion raised creates critical diligence gap
            body: >
              As of mid-2026, Kriya has not published human PK, PD, or efficacy data from any trial. KRIYA-825's Phase
              1/2 is underway but no interim readout has been released. The labiotech.eu analysis in September 2025
              explicitly highlighted this asymmetry: more than $1.2B raised with no human clinical data—an unusual
              profile even for a platform-focused gene therapy company. First-in-human safety data from KRIYA-825 and
              KRIYA-748 are the most important upcoming catalysts for fundamental risk reassessment.
            calloutType: risk
            claimRefs:
              - CE040
              - CE047
          - type: callout
            title: Single-source Everads device creates supply chain and combination-product regulatory risk
            body: >
              KRIYA-825's delivery depends entirely on the Everads Suprachoroidal Injector under an exclusive supply
              agreement with a small Israeli biotech. A device-centric combination product regulatory pathway (drug +
              device BLA/PMA) is more complex and potentially slower than a standalone biologics BLA. Supply disruption,
              device recall, or Everads operational failure could halt KRIYA-825 development indefinitely. The company
              has not disclosed contingency plans or alternative delivery options.
            calloutType: risk
            claimRefs:
              - CE028
              - CE038
          - type: callout
            title: ASGCT 2026 assay presentations signal platform maturation but not yet commercial readiness
            body: >
              Kriya's ASGCT 2026 abstracts—covering ddPCR residual DNA testing, vectorized insulin potency assays, and
              AAV1 bioprocessing bag compatibility—suggest the analytical development and quality systems are
              progressing in parallel with clinical trials. This is architecturally sound but means commercial-grade
              lot-release specifications are still being established, not yet confirmed. The assays need FDA
              qualification before they can gate clinical batches, a milestone not yet reached.
            calloutType: insight
            claimRefs:
              - CE034
              - CE035
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Pre-commercial status and how to interpret "customers" for a clinical-stage gene therapy company
        blocks:
          - type: paragraph
            body: >-
              Kriya Therapeutics is unambiguously pre-commercial as of June 2026. No product has received regulatory
              approval from the FDA or any equivalent authority. No revenue has been disclosed in any public filing or
              press release. No named patients have received a commercial Kriya product. The company's own press
              releases and pipeline page describe every asset as investigational. In the Series D press release
              (September 2025), CEO Shankar Ramaswamy described the company as "clinical-stage" and stated that proceeds
              would be used to support clinical trials, not commercialization. The January 2024 JPM update similarly
              positioned all programs as pre-commercial with five programs targeted to be "in clinic" by end-2025. As of
              the most recent available public evidence (ARVO 2025, May), the first Phase 1/2 trial for KRIYA-825 in
              geographic atrophy had recently initiated enrollment, and KRIYA-748 for trigeminal neuralgia was
              reportedly in the clinic, but no patient count, site count, or dosing data had been publicly disclosed.

              For the purposes of this analysis, "customers" are reinterpreted as the future buyer-user-payer surfaces
              Kriya must engage to achieve commercial success in each of its five lead indications. These surfaces break
              into four distinct roles: (1) the prescribing specialist who evaluates and orders the gene therapy; (2)
              the delivery physician or proceduralist who administers it; (3) the patient who consumes it and whose
              outcomes drive reimbursement advocacy; and (4) the payer—either Medicare Part B, commercial insurance, or
              Medicaid—that ultimately reimburses the provider. The current "customers" of Kriya's value proposition are
              therefore clinical investigators who enroll trial patients, technology partners like Everads who validate
              delivery feasibility, disease-advocacy investors like the T1D Fund who validate unmet patient need, and
              specialist opinion leaders who publicly endorse the clinical rationale.
