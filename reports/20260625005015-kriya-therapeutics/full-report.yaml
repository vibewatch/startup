      - number: '7.6'
        title: People, Financing, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              The leadership bench has been built late relative to the capital consumed. CMO Greg Di Russo (appointed
              December 2025) brings Pfizer development experience including oversight of Beqvez, providing direct AAV
              gene therapy regulatory expertise; but his appointment was made after the company entered Phase 1/2 for
              its lead program, meaning clinical development strategy was being executed without a CMO for at least the
              first six months of KRIYA-825's trial. CFO Sachiyo Minegishi (appointed January 2026) brings Akouos and
              bluebird bio experience relevant to gene therapy commercialization planning, but her appointment leaves
              pre-commercial financial architecture only five months in development as of this report date. Both
              appointments represent genuine capability additions, but they also signal that the company operated with
              significant executive bench gaps through much of its most capital-intensive development phase.

              CEO Shankar Ramaswamy holds co-founder, Chairman, and CEO roles simultaneously, creating founder
              concentration risk. His departure or significant distraction— for any reason, including the political
              visibility of his family connections—would create company-threatening leadership instability. The
              scientific co-founder and Chief Gene Therapy Officer J. Fraser Wright provides manufacturing and CMC
              depth, but there is no obvious internal succession path for the CEO strategy function.

              The most significant thesis-break scenario is a combination event: adverse safety data from KRIYA-825
              Phase 1/2 triggering a clinical hold while a next financing round is due. The company's current cash
              position and burn rate are not publicly disclosed; the last disclosed data point ($325 million cash,
              runway into late 2026) precedes the September 2025 Series D by twenty months and is materially stale. If
              the post-Series D runway is three to four years from September 2025, the company faces a next round
              decision in 2028-2029, a period when clinical Phase 2/3 data will be required to attract capital at a
              non-distress valuation. The five kill criteria identified below define the monitoring tripwires that would
