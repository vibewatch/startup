      - number: '4.3'
        title: Cost structure, manufacturing capex, and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Kriya's cost structure is dominated by two categories: R&D expenditure supporting multi-program clinical
              development, and GMP manufacturing operations. Neither category is publicly quantified, but the structural
              shape can be inferred from disclosed operating choices. The earliest strategic decision—acquiring and
              renovating a 51,350 square foot facility in Research Triangle Park in 2020–2021 at a scale reaching
              3,000-liter bioreactor capacity with integrated fill/finish and QC release—committed Kriya to substantial
              fixed infrastructure investment before any IND was filed. The platform manufacturing process uses the same
              series of unit operations from research-scale to commercial-scale, claimed to enable seamless scale-up
              from 50L through 500L to 3,000L without process changes or costly tech-transfer. That continuity claim is
              operationally significant: it represents the key argument that internal manufacturing lowers future COGS
              relative to CDMO outsourcing. The manufacturing page discloses active GMP manufacturing campaigns across
              multiple pipeline programs, implying ongoing annual costs including facility staffing, consumables,
              quality control, and regulatory compliance that are not separately broken out. Clinical trial expenditure
              represents the second major cost driver. Two programs are confirmed in the clinic (KRIYA-825 Phase 1/2 for
              geographic atrophy, KRIYA-748 for trigeminal neuralgia), with the Series D description indicating multiple
              additional programs advancing in parallel. Phase 1/2 trials for a gene therapy delivered by specialist
              injection typically cost $20–80 million per program depending on patient numbers and indication-specific
              monitoring, though these are external benchmarks rather than Kriya-disclosed figures. Kriya also made at
              least three acquisitions—Redpin Therapeutics, Tramontane Therapeutics, and Warden Bio—for undisclosed
              amounts, indicating material capital deployment beyond the observable GMP build. Until products are
              approved, the manufacturing infrastructure is a pure cost center. The operating leverage thesis is that
              approval converts that sunk infrastructure cost into a durable gross-margin advantage per dose, but that
              thesis remains unproven by public data.
