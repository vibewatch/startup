      - number: '5.3'
        title: Delivery technologies and the focal administration thesis
        blocks:
          - type: paragraph
            body: >
              Kriya's overarching delivery principle is focal or direct-to-tissue administration: achieving high local
              transgene expression in the target tissue at lower total vector dose, minimizing systemic biodistribution
              and reducing the risk of off-target immune activation. This thesis shapes every program's
              route-of-administration choice. For KRIYA-825, Kriya entered an exclusive license, collaboration, and
              supply agreement with Everads Therapy in September 2023 to access the Everads Suprachoroidal Injector, a
              proprietary device using a geometrically-optimized non-sharp tissue separator that opens a path into the
              suprachoroidal space for a tangential injection. The suprachoroidal route is positioned to maximize
              transduction of choroid and retinal pigment epithelium (RPE) cell layers while minimizing the intraocular
              inflammation historically associated with intravitreal injection. NHP preclinical data from the ARVO 2025
              presentation confirmed well-tolerated suprachoroidal delivery with robust KRIYA-825 transgene mRNA in
              choroid and RPE and minimal expression in extraocular tissues. For metabolic programs (KRIYA-839 and
              KRIYA-497), multi-site intramuscular injection is the chosen route, using AAV1 serotype for skeletal
              muscle tropism. ASGCT 2026 data assessed local tolerability following multi-site intramuscular AAV1
              administration in NHP, and a separate abstract evaluated single-use bioprocessing bag compatibility for
              AAV1 process scalability. For KRIYA-586 (thyroid eye disease), peribulbar injection targets extraocular
              fat and muscle to achieve local anti-IGF1R antibody expression with minimal systemic exposure. The
              neurology programs use targeted nerve or focal brain injection—trigeminal nerve for KRIYA-748 and
              epileptic foci injection for KRIYA-382. The CNS delivery approach for KRIYA-748 requires a stable,
              CNS-tolerant AAV5 formulation; ASGCT 2026 poster data specifically reported on the development of such a
              formulation. The focal delivery thesis is strategically important for cost reasons as well: lower vector
              doses reduce per-dose material costs, a critical consideration for a company arguing that gene therapy can
              be economically accessible for common diseases.
