      - number: '5.6'
        title: Technical risks and unresolved translational questions
        blocks:
          - type: paragraph
            body: >
              Five categories of unresolved translational risk deserve specific diligence attention. First, the absence
              of published human pharmacokinetics, pharmacodynamics, or efficacy data from any Kriya program is the most
              critical near-term concern: as of mid-2026, every efficacy claim rests on animal models, and a significant
              fraction of gene therapy programs that performed well preclinically have failed in humans due to immune
              response, insufficient expression, or off-target biodistribution. Second, immune-mediated risks are
              clinically relevant: pre-existing neutralizing antibodies to common AAV serotypes (AAV1, AAV5) may exclude
              a material fraction of patients from eligibility or reduce efficacy; Kriya has not disclosed immune
              screening protocols or seroprevalence thresholds for any program. Third, for the intramuscular programs
              (KRIYA-839 and KRIYA-497), the volume and site count of injections required to achieve therapeutic
              expression, long-term vector expression persistence in post-mitotic skeletal muscle versus dividing cells,
              and local tolerance for multi-site dosing are material translational questions. Fourth, the chemogenetic
              programs (KRIYA-748 and KRIYA-382) depend on both durable ion channel expression in neurons and reliable
              varenicline pharmacology at relevant CNS concentrations; the therapeutic window between
              varenicline-mediated neuronal silencing and varenicline's systemic effects is not yet characterized in
              humans. Fifth, the previous pipeline substitution—from KT-A112, KT-A522, and KT-A832 (disclosed at Series
              A in 2020) to the current nine programs— has never been publicly explained, creating diligence uncertainty
              about the factors that led Kriya to abandon its early metabolic programs before IND. The labiotech.eu
              analysis of September 2025 notes that after raising over $1.2 billion, Kriya had not published any human
              clinical data, and had missed a self-stated Q1 2024 NASH timeline, both pointing to execution risk in a
              company that has primarily been a manufacturing and platform buildout story. Competitor Complement
              Therapeutics cleared an IND for CTx001 (a different complement gene therapy for GA using mini-CR1 vs.
              Kriya's CR2-CR1 fusion) in October 2025 and is starting its first-in-human trial, creating competitive
              pressure in KRIYA-825's lead indication.
            claimRefs:
