            title: Sector-Level Safety Precedents Are Directly Adverse and Cannot Be Dismissed
            body: >-
              The 2025 gene therapy safety record creates a direct sector-level regulatory risk for Kriya. The FDA's
              request to halt Elevidys shipments after two patient deaths (Sarepta), its narrowing of Skysona's approved
              population after blood cancer signals (bluebird bio), and Pfizer's voluntary market withdrawal of Beqvez
              after commercial failure all occurred within the twelve months before this report. These events are
              structurally analogous to Kriya's pipeline: all are AAV-based gene therapies, all were administered via
              specialist physicians, and all initially received FDA approval or were in advanced clinical stages. Kriya
              must design its Phase 1/2 safety monitoring plans anticipating exactly this regulatory environment—any
              ambiguity in safety management will be viewed through the lens of these precedents. Investors should
              require detailed DSMB composition, stopping rules, and SAE reporting protocols before committing to the
              next financing round.
