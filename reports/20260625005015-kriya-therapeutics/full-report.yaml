            title: Differentiated delivery technologies are Kriya's most defensible moat
            body: >-
              Among gene therapy peers in GA, Kriya's suprachoroidal delivery (Everads) and dual CR2-CR1 fusion protein
              are genuinely novel. No other GA gene therapy program currently combines suprachoroidal route with dual
              C3/C5 inhibition. If Phase 1/2 data supports the safety and transduction profile, this combination could
