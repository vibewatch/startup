        - id: phase3-pivotal
          label: Pivotal Phase 3 trial (future)
          detail: >-
            Required for BLA/NDA submission. Timing and cost not disclosed. Gene therapy Phase 3 trials for prevalent
            diseases can cost $50M–$300M+ depending on indication.
        - id: regulatory-approval
          label: FDA / EMA regulatory approval (gate event)
          detail: >-
            Approval triggers commercial launch and revenue recognition. No approved Kriya product exists. Approval
            timelines unknown; GA trial initiated in 2025.
        - id: list-price
          label: List price per patient (unavailable)
          detail: >-
            Not established. Industry comparables: $850K–$3.5M for approved one-time gene therapies in the US. Kriya's
            large-population focus may set pricing below rare-disease ceiling.
        - id: net-price
          label: Net realized price (unavailable; estimated 15–40% discount from list)
          detail: Payer-negotiated net prices are typically 15–40% below US list. Not disclosed for any Kriya program.
        - id: cogs-per-dose
          label: Manufacturing COGS per dose (unavailable)
          detail: >-
            Internal platform claimed to reduce production cost. COGS not publicly disclosed; key unknown for margin
            model. External benchmarks for AAV manufacturing: $5K–$100K+/dose depending on batch size and process
            maturity.
        - id: gross-margin
          label: Gross margin per dose (unavailable; positive thesis from internal manufacturing)
          detail: >-
            Not quantifiable from public data. Company and Series D investors cite internal manufacturing as the path to
