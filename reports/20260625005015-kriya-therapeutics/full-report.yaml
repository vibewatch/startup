companyProfile:
  summary: >-
    Kriya Therapeutics is a private clinical-stage gene-therapy company formed in late 2019 and now operating across a
    Bay Area leadership footprint and a large Research Triangle Park manufacturing base. The company is building
    one-time AAV medicines for ophthalmology, metabolic disease, and neurology, with KRIYA-825 in a Phase 1/2 geographic
    atrophy study and additional metabolic and neurology assets supported by acquired and partnered delivery
    technologies. Its differentiation case rests on vertically integrated vector design, high-scale GMP AAV
    manufacturing, and a willingness to target larger chronic-disease markets rather than only ultra-rare indications.
    The capital base is unusually large for the public data available: at least $920.5 million of confirmed announced
    financing through the September 2025 Series D, but no disclosed valuation, burn-rate, or commercial traction
    metrics.
