  - id: TE003
    title: Technology and operating architecture — components, roles, and risks
    columns:
      - Layer / Component
      - Role in Platform
      - Key Technical Dependency
      - Primary Risk
    rows:
      - - SIRVE Computational Design
        - Generates and screens vector variants for manufacturability, expression, immunogenicity
        - Proprietary algorithms; training data from Kriya's own experimental outputs
        - Algorithmic blind spots not identified until clinical failure; black-box optimization
      - - STRIPE Manufacturing Platform
        - Upstream/downstream process engineering for cost-efficient scalable AAV production
        - Cell-line technology; single-use bioprocessing bags; Kriya-specific process parameters
        - Industry-wide scalability challenges; yield and purity benchmarks not publicly verified
      - - ASGCT-Presented Analytical Assays (ddPCR, potency)
        - QC release testing for residual host-cell DNA and functional transgene product
        - Validated assays accepted by FDA; correlate to clinical outcomes
        - Novel assays may require regulatory qualification; potency correlates to efficacy not established in humans
      - - Capsid Library (validated serotypes only)
        - Serotype selection for target tissue tropism in each program
        - Known clinical AAV serotypes (e.g., AAV1 for muscle, AAV5 for CNS)
        - Pre-existing neutralizing antibodies can eliminate up to 40-60% of patients from eligibility
      - - Everads Suprachoroidal Injector
        - Device for non-surgical suprachoroidal delivery of KRIYA-825 to RPE/choroid
        - Exclusive supply agreement; Everads single-source device
        - Single-source device risk; device failure or supply disruption halts KRIYA-825 program
      - - Chemogenetic Ion Channel (HHMI License)
        - Enables varenicline-gated neuronal silencing for KRIYA-748 and KRIYA-382
        - Exclusive license from Howard Hughes Medical Institute via Redpin acquisition
        - IP dependency on HHMI license terms; varenicline interaction profile in CNS needs human validation
      - - 51,000 sq ft RTP GMP Facility
        - Vial-to-vial manufacturing from research to commercialization
        - Multi-product scheduling; operational from 2021; simultaneous multi-program campaigns
        - Single-site operational risk; capacity scheduling not publicly disclosed; no secondary manufacturing site
      - - Academic Partnerships (UAB, NIH)
        - Foundational preclinical biology; AAV-FGF21 data generated at UAB
        - Access to animal models, translational data, and scientific advisory input
        - Partnership dependency for preclinical validation; external biology must translate to Kriya's vectors
    notes: >
      Layer descriptions are based on Kriya's public product design, R&D, manufacturing pages, ASGCT 2026 presentations,
      Series B announcement naming SIRVE and STRIPE, and Redpin/Everads licensing announcements. Risk assessments
      reflect general AAV industry issues plus Kriya-specific disclosures.
