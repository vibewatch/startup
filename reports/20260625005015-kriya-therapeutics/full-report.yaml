      - - Control blood glucose in T1D (insulin independence)
        - Multiple daily insulin injections or insulin pump plus continuous glucose monitoring
        - KRIYA-839 one-time IM injection expressing insulin + glucokinase in muscle
        - Biological closed loop for glucose sensing reduces or eliminates exogenous insulin need
        - IND-enabling; no human data; multi-site injection; durability and beta-cell immunity not addressed
      - - Treat advanced liver fibrosis in MASH (F3-F4)
        - No FDA-approved therapy for MASH F4; resmetirom approved for non-F4
        - KRIYA-497 one-time IM gene therapy expressing native FGF21 protein
        - Continuous FGF21 expression reverses hepatic fibrosis and improves metabolic profile; avoids Cmax GI toxicity
        - IND-enabling; FGF21 receptor desensitization risk with chronic agonism not addressed
