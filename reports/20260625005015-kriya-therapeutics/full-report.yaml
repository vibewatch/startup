            body: >-
              The only disclosed cash data point is $325 million entering 2024 with runway into late 2026 (33 months →
              approximately $10M/month implied). That baseline predated multiple programs entering or approaching the
              clinic and multi-program GMP campaign ramp. With two programs confirmed in the clinic in 2025 plus
              additional pre-IND spending, actual burn during 2024–2025 likely exceeded $10M/month. The $10M figure
              should be treated as a structural lower bound; the plausible range for a company at this stage with active
