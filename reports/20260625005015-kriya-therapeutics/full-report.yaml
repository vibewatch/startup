      - number: '8.5'
        title: Scenarios, Kill Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Scenario framing makes the binary nature of the bet explicit. In the bull case, KRIYA-825 delivers a clean
              Phase 1/2 safety and efficacy signal in geographic atrophy, the platform's manufacturing edge is
              validated, and a step-up financing or partnership pushes the mark toward the $3 billion zone occupied by
              Beam and uniQure. In the base case, the company advances on schedule with mixed early data and holds an
              implied $1.5 billion mark, roughly in line with MeiraGTx. In the bear case, an efficacy miss or a safety
              event combines with sector multiple compression to drag the value toward the $0.5 billion REGENXBIO zone
              or worse, echoing the bluebird and Sarepta precedents. Probability signals favor the base-to-bear region
              given the absence of any human efficacy data and the 83 percent contraction in gene-therapy venture
              funding.

              The diligence program follows directly. The thesis-break and kill-trigger table specifies the events — an
              FDA clinical hold, a Phase 1/2 efficacy miss, a down-round, or a further pipeline discontinuation — that
              would move the call from track to avoid, and the action each implies. The final diligence asks table lists
              the missing evidence that a track-to-buy upgrade requires: Series D price per share and post-money, the
              liquidation-preference and option overhang, monthly burn and runway, the KRIYA-825 trial protocol and DSMB
              charter, and a reconciliation of the company's capital claim to the filing record. The investment-KPI
              figure scores the opportunity across market, proof, moat, economics, risk, valuation transparency, and
              evidence quality, making the low-confidence, high-risk profile legible at a glance. Until those asks are
              answered, conditional interest is the ceiling.
