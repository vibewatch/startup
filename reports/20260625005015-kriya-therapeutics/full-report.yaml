          - type: callout
            title: Bluebird bio's collapse is a cautionary precedent for Kriya's commercial path
            body: >-
              Bluebird bio's decline from an $8.7B market cap in 2017 to near-distress (~$49M by mid-2025) underscores
              that in-house manufacturing, multi-program scope, and approved products are necessary but not sufficient
              for commercial success in gene therapy. Kriya's vertical integration story requires both clinical proof
              and reimbursement strategy to avoid the same execution risk.
