      - number: '7.2'
        title: Clinical Pipeline Execution and Attrition Risk
        blocks:
          - type: paragraph
            body: >-
              The clearest adverse signal in Kriya's public record is the mismatch between capital raised and clinical
              output disclosed. At the January 2024 J.P. Morgan Healthcare Conference, the company guided that up to
              five programs would enter the clinic by end-2025; as of June 2026, only KRIYA-825 and KRIYA-748 are
              confirmed in Phase 1/2 trials, while the seven remaining pipeline programs (KRIYA-586, KRIYA-839,
              KRIYA-296, KRIYA-497, KRIYA-382, KRIYA-454, and an undisclosed neurology program) are listed in
              IND-enabling or research stages on the company's pipeline page. The JPM 2024 five-program target has
              materially missed. The Labiotech investigation published in September 2025 explicitly noted that
              "candidates disappearing from the pipeline, unmet development deadlines, and a lack of transparency about
              where the most recent funds will go" characterize Kriya's history.

              Program discontinuation is documented and materially adverse. The three original diabetes candidates
              presented at Series A (KT-A112 for T1D/T2D via intramuscular insulin- glucokinase, KT-A522 for T2D/obesity
              via GLP-1 receptor agonist salivary gland delivery, and KT-A832 for T1D via pancreatic IGF-1 expression)
              were replaced entirely by KRIYA-839 and the MASH/KRIYA-497 programs; no public explanation was provided.
              The Tramontane acquisition in September 2023 included an explicit commitment that the MASH gene therapy
              candidate would advance to the clinic "by 1H 2025"—a deadline Labiotech identified as unmet as of
              September 2025. The KRIYA-497 MASH program is currently listed as IND-enabling on the pipeline page,
              suggesting it is still six to eighteen months from first-in-human.

              Phase 1/2 data for KRIYA-825 and KRIYA-748 are not yet publicly available. The most recent
              efficacy-related disclosure for KRIYA-825 is a May 2025 ARVO preclinical presentation covering murine
              efficacy and NHP biodistribution—not human data. This means the investment thesis rests on unvalidated
              human biology for all nine programs, creating high binary outcome risk at every clinical decision gate.
              Clinical failures in geographic atrophy are particularly consequential, as KRIYA-825 competes against two
              approved complement inhibitors (Syfovre and Izervay) and must demonstrate a clinically meaningful
              advantage over established comparators to achieve regulatory approval and commercial uptake.
