            title: Reimbursement for Prevalent-Disease Gene Therapy Is an Unsolved Problem Industry-Wide
            body: >-
              The commercial failures of Hemgenix, bluebird bio's Zynteglo and Skysona, and Pfizer's Beqvez demonstrate
              that FDA approval is a necessary but not sufficient condition for gene therapy commercial success—even in
              rare diseases. Kriya's geographic atrophy program targets two million patients, the majority of them
              Medicare beneficiaries, in a payer environment that has never successfully paid for a gene therapy at this
              scale. No public company has demonstrated a commercially viable path for prevalent-disease gene therapy
              pricing. Bluebird bio went from a $8.74 billion market capitalization to near-insolvency at $48 million by
