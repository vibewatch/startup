      - number: '2.2'
        title: Market Sizing — TAM/SAM/SOM Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              Four independent market research firms estimate the global AAV gene therapy TAM at between $2.85 billion
              and $4.35 billion in 2025–2026, with 2030–2035 forecasts ranging from $6.65 billion (TBRC, 15.6% CAGR to
              2030) to $112.24 billion (TowardsHealthcare, 40.1% CAGR to 2035). The fivefold divergence in long-run
              estimates reflects (1) different market perimeter definitions—some include the full AAV research,
              manufacturing, and CDMO supply chain while others restrict to commercial therapies—(2) different
              assumptions about how many rare-disease and common-disease programs reach approval, and (3) different
              assumed uptake rates once approved. These estimates should be treated as plausible scenarios rather than
              consensus data; none independently verifies the others.

              A disease-prevalence-based sizing lens gives a more grounded (if also uncertain) picture of Kriya's
              serviceable addressable market. Taking conservative treatment penetration assumptions (15% of eligible
              diagnosed patients over a 10-year commercial ramp), gene therapy pricing of $1–3 million per treatment,
              and a combined US+EU eligible GA+TED population of approximately 3 million: a rough US+EU revenue ceiling
              for those two indications alone is $3–10 billion on a cumulative basis. MASH's 40 million US+EU patients
              represent a far larger theoretical ceiling but require significantly deeper clinical and regulatory
              evidence before addressable market sizing is meaningful.

              A critical SAM gap exists: no public analyst report in the retrieved evidence base provides a separately
              computed SAM for the combined prevalent-disease AAV segment that Kriya is targeting. Analyst reports
              segment by therapeutic area (neurological disorders dominate at 29–39% of the AAV market), but
              neurological includes rare diseases alongside common ones. The TowardsHealthcare, Precedence, and Coherent
              reports all note that common-disease AAV is an emerging—not established—segment, making bottom-up SAM
              isolation impossible from public data. North America dominates the AAV market at 42% (Precedence) to 54%
              (TowardsHealthcare) of the total.
