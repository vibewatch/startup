  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Confidence, Risk, and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              The investment call on Kriya Therapeutics is track, not buy and not avoid. The platform is genuinely
              differentiated and the investor syndicate is high quality, but the public evidence base is too thin on the
              three variables that decide a private-market entry: a disclosed valuation, demonstrated clinical efficacy,
              and a credible burn-and-runway picture. None of the three is available. Caplight confirms no valuation
              mark exists for the company, no price per share is attached to either the original Form D or the September
              2025 amendment, and the company has not disclosed a post-Series D cash runway. In that vacuum the only
              honest stance is to stay engaged and condition any capital deployment on a Phase 1/2 readout and full
              data-room access rather than to underwrite an implied premium today.

              Confidence is low precisely because the inputs that would raise it are missing or single-sourced. Risk is
              rated high: Kriya is clinical-stage with no efficacy data, the gene therapy financing environment
              contracted 83 percent between 2021 and 2024, and the sector's cautionary tales — bluebird bio collapsing
              from roughly $10 billion to a $30 million take- private, Pfizer withdrawing the FDA-approved hemophilia B
              therapy Beqvez, and Sarepta's Elevidys deaths and shipment halt cutting its market cap from $11.6 billion
              to $1.76 billion — show that even approval does not guarantee commercial survival. Valuation stance is
              stretched: the implied private mark sits above public comparables that already carry commercial or Phase 3
              proof. The recommendation logic and the dimension-by-dimension summary are captured in the figure and
              table anchored to this section.
