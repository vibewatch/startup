  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue status and public financial disclosure
        blocks:
          - type: paragraph
            body: >-
              Kriya Therapeutics carries the descriptor "clinical-stage biopharmaceutical company" in every public
              financing release since at least September 2025, which is a direct statement of pre-revenue status: no
              Kriya product has received regulatory approval, no commercial sales have been made, and no revenue from
              partnerships or licensing is disclosed in any public source retrieved for this report. The official
              pipeline page lists nine programs across three therapeutic areas; the most advanced—KRIYA-825 for
              geographic atrophy—is described as currently in a Phase 1/2 clinical trial. Labiotech independently noted
              in September 2025 that Kriya had accumulated more than $1.2 billion in disclosed financing "despite not
              having much pipeline progress to show for it." Caplight's market-data page explicitly states that Kriya
              valuation information is not publicly available and provides no revenue multiples or earnings data. The
              SEC Form D filings list only equity offerings, with no indication of convertible debt, revenue-based
              financing, or project finance. No ARR, gross merchandise value, active users, unit volume, or any other
              commercial metric appears in any retrieved source. The financial baseline for underwriting is therefore
              one of pure cash burn, with all operating and investment expenditure supported entirely by equity capital
              raises. The complete funding chronology is documented in the Company Overview chapter; this chapter
              focuses on the capital-adequacy and forward-revenue implications of that financing record.
