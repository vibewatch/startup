  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      How chronic-disease patient demand converts into Kriya commercial revenue and eventually gross profit once a gene
      therapy product is approved and commercially launched.
    data:
      nodes:
        - id: patient-population
          label: Chronic disease patient population (large unmet need)
          detail: >-
            GA ~2M US/EU; TED ~1M US/EU; T1D ~17M insulin-using patients; TN ~400K US/EU. Large prevalent markets are
            Kriya's stated differentiation from rare-disease GT.
        - id: physician-referral
          label: Specialist physician identifies and refers eligible patient
          detail: >-
            Neurology, ophthalmology, or hepatology specialists gate access. In-office procedural delivery
            (suprachoroidal, peribulbar, intramuscular injection) limits channel to specialist settings. No commercial
            sales force yet disclosed.
        - id: payer-approval
          label: Payer / insurer coverage decision
          detail: >-
            Gene therapies require individual or institutional coverage decisions. Coverage timelines post-approval
            historically 6–18 months. Kriya has not disclosed a payer engagement plan.
        - id: product-sale
          label: One-time product sale at list price (TBD)
          detail: >-
            Revenue recognized at treatment; list price not yet established. Comparable approved one-time GTs priced
            $850K–$3.5M in the US. Kriya's large-population targeting likely implies pricing below the
            Hemgenix/Zolgensma rare-disease ceiling.
        - id: net-revenue
          label: Net revenue (after payer discount and rebates)
          detail: >-
            Realized net prices typically 15–40% below US list price after payer negotiations. Net revenue not
            disclosed; no commercial product exists.
        - id: cogs
          label: Manufacturing COGS (internal AAV GMP, fill/finish, QC)
          detail: >-
            Internal platform at 50L/500L/3,000L claimed to reduce per-dose cost vs. CDMO. COGS not publicly disclosed.
            Manufacturing leverage thesis depends on volume efficiency.
        - id: gross-profit
          label: Gross profit per dose (undisclosed)
          detail: >-
            Gross margin not quantifiable from public data. Internal manufacturing thesis implies higher margin than
            CDMO-dependent peers if cost claims are validated at commercial scale.
    approximationNotes: >-
      All nodes beyond the patient population are forward-looking and unquantified; no commercial revenue exists. Flow
      is structural, based on the operating model described in official sources. Financial values (price, COGS, margin)
      are unavailable from public sources.
    claimRefs:
      - CI001
      - CI026
      - CI027
      - CI029
      - CI032
