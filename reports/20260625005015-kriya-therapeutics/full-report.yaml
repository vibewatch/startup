      - number: '5.2'
        title: Pipeline asset map and program status
        blocks:
          - type: paragraph
            body: >
              Kriya's disclosed pipeline comprises nine investigational programs: three in ophthalmology (KRIYA-825,
              KRIYA-586, KRIYA-296), three in metabolic disease (KRIYA-839, KRIYA-497, KRIYA-652), and three in
              neurology (KRIYA-748, KRIYA-382, KRIYA-454). KRIYA-825 for geographic atrophy and KRIYA-748 for trigeminal
              neuralgia are the two programs confirmed to be in Phase 1/2 clinical trials as of mid-2026. KRIYA-825 is
              an AAV-based gene therapy expressing a CR2-CR1 fusion protein designed to inhibit complement C3 and C5,
              delivered by suprachoroidal injection; its mechanism directly targets the same complement pathways
              inhibited by the two FDA-approved GA drugs (pegcetacoplan/syfovre and avacincaptad pegol/izervay), but via
              continuous AAV-mediated expression from a single injection rather than monthly intravitreal dosing.
              KRIYA-586 expresses an anti-IGF1R antibody for thyroid eye disease by peribulbar injection, seeking
              localized expression in extraocular tissue. KRIYA-839 targets type 1 diabetes via intramuscular dual
              expression of insulin and glucokinase, leveraging skeletal muscle's dominant role (~80% of glucose
              disposal) to create a biological closed-loop glucose sensor. KRIYA-497 expresses native FGF21
              intramuscularly for MASH patients with F3 or compensated F4 fibrosis, differentiating from Cmax-driven
              toxicity risks of bolus FGF21 analogs by providing steady-state continuous expression. KRIYA-748 uses a
              chemogenetic engineered ion channel (varenicline-activated chloride channel) injected into the trigeminal
              nerve to reduce hyperexcitability with a built-in off-switch. KRIYA-382 uses identical chemogenetic
              technology for focal epilepsy via direct brain injection into epileptic foci. The three undisclosed
              programs (KRIYA-296, KRIYA-652, KRIYA-454) are noted on the pipeline page but show no mechanism or stage
              detail publicly.
