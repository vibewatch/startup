      - number: '3.5'
        title: Moat durability and competitive-risk assessment
        blocks:
          - type: paragraph
            body: >-
              Kriya's competitive moat rests on three claimed pillars: a multi-indication AAV platform, in-house cGMP
              manufacturing at commercial scale, and novel delivery technologies (suprachoroidal for GA, peribulbar for
              TED, chemogenetics for neurology). The durability of each pillar faces distinct risks. The platform
              advantage is real in principle — most gene therapy peers are single-indication or narrow-area specialists
              — but it is not yet protected by clinical proof: Kriya has only one program in Phase 1/2 (KRIYA-825 as of
              May 2025) with no efficacy read-outs disclosed. The manufacturing advantage is claimed robustly on the
              company website (3,000L bioreactor, same unit operations from research to commercial) but has not been
              independently verified through published batch records, regulatory filings, or peer-reviewed data. Several
              public comparables (uniQure, Sarepta) also operate in-house manufacturing at scale, weakening Kriya's
              differentiation on this vector alone. The delivery technology differentiation is the most novel moat
              element: suprachoroidal injection is distinctive from standard IVT, and KRIYA-748's chemogenetic approach
              to pain is unique in the gene therapy field. However, novel delivery creates regulatory proof burden, and
              the suprachoroidal route must be validated for long-term safety and transduction efficiency in human GA
              patients before it confers a durable advantage. The most material competitive risk is displacement at the
              approved-therapy level: if Annexon's ANX007 succeeds in Phase 3 or Alkeus's oral therapy achieves broad
              prescribing, the GA patient flow to a one-time injection trial could slow. Pharma incumbents (Janssen,
              Astellas, Novartis, Roche) possess superior distribution and regulatory trust; if any pivots its existing
              ocular franchise toward an AAV modality similar to Kriya's, the competitive response could be rapid and
              well-resourced.
            claimRefs:
