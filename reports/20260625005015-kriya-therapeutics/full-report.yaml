        title: Milestones and strategic evolution
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern matters because Kriya has spent several years building a vertically integrated
              engine before showing clear clinical crossover. Manufacturing capacity arrived early: facility acquisition
              in 2020, renovation and cGMP suite completion in 2021, and public claims of consistent platform processes
              from research through commercial scale. Strategic scope widened through partnerships and acquisitions: the
              Twist collaboration expanded antibody discovery reach, Redpin added chemogenetics for neurology,
              Tramontane added FGF21 biology for MASH, and Everads contributed suprachoroidal ocular delivery. By 2024
