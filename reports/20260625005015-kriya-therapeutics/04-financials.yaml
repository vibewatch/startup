- id: FI003
  title: Financial estimate range
  type: range
  layout: wide
  summary: >-
    Uncertainty ranges for Kriya's key financial parameters, distinguishing confirmed
    disclosures from estimated proxies and unresolved ambiguities.
  data:
    items:
    - label: Total confirmed announced financing (conservative base)
      low: 920.5
      high: 920.5
      unit: $M
      detail: >-
        Series A ($80.5M) + Series B ($100M) + Series C ($270M) + Series C extension (>$150M)
        + Series D ($320M) = at least $920.5M. Lower bound is confirmed from official press
        releases; no double-counting assumed.
    - label: Total financing if Aug 2025 Form D is additive
      low: 1233
      high: 1250
      unit: $M
      detail: >-
        If the $313.3M Form D filing is entirely separate from the Series D rather than an
        earlier tranche of the same transaction, total could exceed $1.23B. This scenario
        has low confidence; public sources do not resolve the overlap.
    - label: Cash balance at January 2024 (last disclosed)
      low: 325
      high: 325
      unit: $M
      detail: >-
        Management-disclosed at JPM January 2024 with runway into late 2026. Predates the
        Series D by ~20 months; not a current figure.
    - label: Estimated post-Series D cash (Sep 2025 onward)
      low: 250
      high: 500
      unit: $M
      detail: >-
        Rough estimate: $325M Jan 2024 balance, reduced by ~20-month burn at ~$10–15M/month,
        plus $320M Series D. Wide range reflects uncertainty in burn rate. Not disclosed.
    - label: Estimated monthly cash burn (proxy; not disclosed)
      low: 8
