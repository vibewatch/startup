- id: future-revenue-model-and-gtm
  title: Future revenue model and commercialization pathway
  body: >-
    The primary and currently intended revenue stream for Kriya is one-time commercial product
    sales following regulatory approval of one or more gene therapy candidates. The Series D
    press release explicitly describes proceeds funding "clinical trials of Kriya's gene therapies
    in multiple therapeutic areas"—placing commercial revenue in the future, not the present.
    Kriya's official therapeutic positioning describes each program as a single-dose treatment
    delivered by specialist physicians in an outpatient procedure. That delivery model maps to
    the commercial pattern of approved gene therapies: a high list price per patient, billed to
    insurers or payers, with revenue recognized at treatment. Approved one-time gene therapies
    in the US have commanded per-patient list prices from approximately $850,000 (Luxturna,
    retinal dystrophy, 2017) to approximately $3.5 million (Hemgenix, hemophilia B, 2022); these
    publicly reported benchmarks establish the framework, though Kriya's programs target larger
    patient populations (geographic atrophy affecting approximately 2 million people in the US
    and EU), which may require pricing below rare-disease extremes to achieve meaningful volume.
    A secondary revenue potential exists through manufacturing partnerships or platform licensing:
    Kriya's vertically integrated GMP platform in principle supports co-development and contract
    manufacturing arrangements, but no such revenue-generating deal has been publicly disclosed.
    The Series D investor Premji Invest specifically cited "development and commercialization of
    gene therapies" as the manufacturing investment thesis, suggesting future CDMO or
    technology-transfer revenue is within the strategic aperture. GTM execution will require a
    specialty sales infrastructure covering neurology, ophthalmology, and hepatology specialists,
    hospital systems, and specialty pharmacy reimbursement channels—infrastructure that Kriya
    has not yet publicly described building. The appointment of Sachiyo Minegishi as CFO in
    January 2026, with prior Akouos (acquired by Eli Lilly) and bluebird bio experience, provides
    a signal that the company is beginning pre-commercial financial planning, but no commercial
    launch timeline or sales force strategy is publicly disclosed.
