  - - Hemgenix (CSL Behring/UniQure)
    - Hemophilia B
    - IV infusion (one-time)
    - ~$3.5M per patient (US list price, 2022)
    - Ultra-rare; high lifetime treatment cost avoided; value-based pricing
    - Widely reported in trade press at FDA approval (Nov 2022)
