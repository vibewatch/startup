callouts:
- calloutType: risk
  title: Form D ambiguity leaves total capital raised in a material range
  body: >-
    The August 2025 SEC Form D discloses $313.3 million with 2 investors and a first-sale date of
    July 31, 2025; the September 2025 press release announces a $320 million Series D close with
    multiple named investors. The $6.7 million gap and the different investor count create
    ambiguity: either these reflect successive tranches of one transaction or two separate
    financings. The conservative underwriting anchor is $920.5 million confirmed total. If the
    Form D is additive, the total exceeds $1.23 billion, which changes the implied capital
    intensity and burn durability picture materially.
  claimRefs:
  - CI007
  - CI008
  - CI009
  - CI010

- calloutType: risk
  title: Gene therapy sector headwinds add systematic financial risk beyond Kriya-specific factors
  body: >-
    The broader gene therapy field saw venture funding fall 83% from 2021 to 2024. Peer examples
    illustrate the binary outcomes: bluebird bio peaked at nearly $10 billion valuation and was
    taken private for $30 million; Pfizer withdrew its hemophilia gene therapy Beqvez from the
    market. Kriya's unusual fundraising success against these headwinds—often attributed in
    external commentary to political connections rather than clinical milestones—means the capital
    base is real but the sector risk is not diversified away. Any delay in clinical readouts or a
    setback in the GA Phase 1/2 trial could trigger a reassessment of investor conviction.
  claimRefs:
  - CI033
  - CI034
  - CI038

- calloutType: strength
  title: Manufacturing platform represents the most defensible long-term cost and margin lever
  body: >-
    Kriya's vertically integrated GMP platform—built from 50L to 3,000L scale with internal
    fill/finish, QC release, and a single process applicable from research through
    commercialization—is the central financial thesis. If the cost reduction claims of the STRIPE
    platform are validated at commercial scale, gross margins per approved dose could be
    meaningfully higher than CDMO-dependent peers. The platform is also the primary basis on
    which Series D investors explained their conviction. The manufacturing asset is already built
    and operational, which means the capex has been largely sunk and future costs shift toward
    operating leverage rather than additional buildout.
  claimRefs:
  - CI009
  - CI020
  - CI021
  - CI022
  - CI041
  - CI042

- calloutType: assumption
  title: Monthly burn proxy should be treated as a lower bound, not a mean estimate
  body: >-
    The only disclosed cash data point is $325 million entering 2024 with runway into late 2026
    (33 months → approximately $10M/month implied). That baseline predated multiple programs
    entering or approaching the clinic and multi-program GMP campaign ramp. With two programs
    confirmed in the clinic in 2025 plus additional pre-IND spending, actual burn during
    2024–2025 likely exceeded $10M/month. The $10M figure should be treated as a structural
    lower bound; the plausible range for a company at this stage with active GMP operations
    and clinical programs is $10–20M/month.
  claimRefs:
  - CI015
  - CI023
  - CI024

