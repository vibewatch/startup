- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: >-
    Kriya's financial profile is the canonical clinical-stage biopharma pattern: large capital
    base, no revenue, high fixed-cost operating model, and a multi-year commercialization horizon
    with significant binary risk at each clinical and regulatory gate. The primary financial
    strengths are the scale of committed capital ($920.5 million confirmed minimum with a 2025
    Series D providing near-term runway), the demand-driven oversubscribed Series D at a
    valuation step-up, and the presence of a credentialed commercial-finance CFO signaling
    pre-commercial financial preparation. The primary financial risks are the total absence of
    monetization clarity (no approved product, no disclosed licensing economics), the capital
    intensity of maintaining a fully integrated GMP manufacturing platform across multiple
    parallel clinical programs, and exposure to gene therapy sector headwinds: the broader field
    saw venture funding fall 83% from 2021 to 2024, and peers including Pfizer (Beqvez withdrawn
    from market) and bluebird bio (taken private for $30 million after a near-$10 billion peak
    valuation) illustrate the binary financial outcomes in this sector. The diligence blockers
    for underwriting are explicit: no public ARR or revenue; no disclosed cash burn rate or
    post-Series D runway; no current valuation; unresolved Form D versus Series D overlap; no
    disclosed COGS or manufacturing unit economics; no commercial launch timeline or
    infrastructure plan. Resolving any one of these through a management data room would
    materially change the quality of the financial underwriting. Until those data are available,
    the financial conclusion is that Kriya's capital base appears sufficient for continued
    near-term operations, but the risk-adjusted financial profile cannot be underwritten from
    public data alone.
  claimRefs:
  - CI005
  - CI033
  - CI034
  - CI038
  - CI039
  - CI040
