chapter:
  number: 4
  title: Financials
  summary: >-
    Kriya Therapeutics is pre-revenue with no commercially approved products, no publicly disclosed
    revenue, ARR, gross margin, or customer count, operating entirely on staged venture capital.
    Confirmed announced financing totals at least $920.5 million across Series A through Series D
    (May 2020–September 2025), with the conservative lower bound required because an August 2025
    SEC Form D showing $313.3 million at two investors may overlap with the September 2025 $320
    million Series D close. The January 2024 JPM update disclosed a $325 million cash balance and
    runway into late 2026—predating the Series D and now materially stale. No burn rate, current
    valuation, or post-Series D runway is available from public sources, leaving capital adequacy
    dependent on confidential management disclosure.
sections:
- id: pre-revenue-status
  title: Revenue status and public financial disclosure
  body: >-
    Kriya Therapeutics carries the descriptor "clinical-stage biopharmaceutical company" in every
    public financing release since at least September 2025, which is a direct statement of
    pre-revenue status: no Kriya product has received regulatory approval, no commercial sales
    have been made, and no revenue from partnerships or licensing is disclosed in any public source
    retrieved for this report. The official pipeline page lists nine programs across three
    therapeutic areas; the most advanced—KRIYA-825 for geographic atrophy—is described as
    currently in a Phase 1/2 clinical trial. Labiotech independently noted in September 2025 that
    Kriya had accumulated more than $1.2 billion in disclosed financing "despite not having much
    pipeline progress to show for it." Caplight's market-data page explicitly states that Kriya
    valuation information is not publicly available and provides no revenue multiples or earnings
    data. The SEC Form D filings list only equity offerings, with no indication of convertible
    debt, revenue-based financing, or project finance. No ARR, gross merchandise value, active
    users, unit volume, or any other commercial metric appears in any retrieved source. The
    financial baseline for underwriting is therefore one of pure cash burn, with all operating and
    investment expenditure supported entirely by equity capital raises. The complete funding
    chronology is documented in the Company Overview chapter; this chapter focuses on the
    capital-adequacy and forward-revenue implications of that financing record.
