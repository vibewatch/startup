  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: burn-rate
    missingEvidence: >-
      Company-reported quarterly cash burn rate by function (R&D, manufacturing, G&A). No
      public disclosure of any operating expense line item exists.
    whyItMatters: >-
      Without a burn rate, post-Series D runway cannot be estimated with confidence, and
      the capital-adequacy analysis rests entirely on a stale pre-Series D proxy.
    diligencePath: >-
      Request audited or management-reported quarterly financial statements showing cash
      used in operating activities and headcount by function from the management data room.
    relatedQuestionRefs:
    - QI016
  - type: private-evidence-only
    severity: blocking
    topic: post-series-d-cash
    missingEvidence: >-
      Current cash position and management-stated runway as of any date after September 2025.
      The last disclosed data point is January 2024 ($325M, late 2026 runway).
    whyItMatters: >-
      Post-Series D runway determines how much time remains before the next financing event.
      Given the $320M raise in September 2025, current cash is likely significant, but the
      duration and its buffer before the next-round trigger cannot be assessed from public data.
    diligencePath: >-
      Request a current management cash projection or the most recent board-approved budget
      showing cash balance and runway estimate as of at least Q4 2025.
    relatedQuestionRefs:
    - QI019
  - type: private-evidence-only
    severity: material
    topic: manufacturing-unit-economics
    missingEvidence: >-
      Per-dose manufacturing COGS, batch yield metrics, and expected gross margin at commercial
      scale. Kriya claims cost leadership but has not quantified it publicly.
    whyItMatters: >-
      The long-term financial thesis depends on internal manufacturing yielding materially
      higher gross margins per dose than CDMO-dependent competitors. Without COGS data,
      the manufacturing leverage claim cannot be evaluated.
    diligencePath: >-
      Request manufacturing cost model, bill of materials per dose, and batch records or
      yield summaries for at least one commercial-scale GMP campaign.
    relatedTableRefs:
    - TI003
  - type: conflicting-data
    severity: material
    topic: total-raised-form-d-ambiguity
    missingEvidence: >-
      Cap table or investor-by-tranche documentation that resolves whether the August 2025
      Form D ($313.3M, 2 investors, first sale July 31 2025) is an earlier tranche of the
      September 2025 Series D or a separate transaction.
    whyItMatters: >-
      The conservative total is $920.5M; if additive, the total exceeds $1.23B. A $310M
      discrepancy in total capital raised materially affects burn-rate modeling and
      dilution history analysis.
    diligencePath: >-
      Request a complete cap table showing closing dates, investor names, share classes, and
      per-tranche amounts for all rounds since 2023.
    relatedQuestionRefs:
    - QI003
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Pre-money and post-money valuation for the Series D and any prior rounds. Caplight
      explicitly states this is not publicly available.
