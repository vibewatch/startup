- id: capital-adequacy-and-financing
  title: Capital adequacy, cash position, and financing dependency
  body: >-
    Kriya's capital adequacy must be assessed in two stages: the pre-Series D position that was
    publicly disclosed, and the post-Series D position that is only partially reconstructable
    from public data. The publicly disclosed data point is the January 2024 JPM statement: the
    company entered 2024 with a $325 million cash balance and runway into late 2026, reflecting
    cumulative capital from the Series A through Series C extension. The Series D closed
    September 10, 2025, adding $320 million and described as oversubscribed at a significant
    step-up to the prior round—demand-driven rather than distress-driven at the time of close.
    Confirmed announced financing across all rounds totals at least $920.5 million, treating
    the conservative approach of not double-counting the August 2025 SEC Form D and the
    September 2025 Series D. The August 2025 Form D shows a total offering amount of
    $313,297,440 with 2 investors and a first-sale date of July 31, 2025—roughly six weeks
    before the September 10 press-released Series D close. Trade coverage treated these as
    two distinct events totaling more than $1.2 billion in six years; public sources do not
    conclusively resolve the overlap, so the $920.5 million confirmed base case is the
    appropriate underwriting anchor. Post-Series D cash position and runway are not publicly
    disclosed. Working backward: if Kriya entered 2024 with $325 million and ran a
    multi-program clinical development burn through to September 2025 (approximately 20
    months), the pre-Series D balance was likely materially below $325 million. The $320
    million Series D then restores a substantial cash runway, but the precise post-raise
    balance, burn rate, and runway duration remain unavailable. No debt, credit facilities,
    or project-finance obligations appear in any retrieved filing or press release. The named
    investors in the Series D—Patient Square Capital, Premji Invest, Peter Thiel, Narya Capital,
    and The T1D Fund—include repeat institutional investors with multi-round exposure, supporting
    the view that the financing reflects informed conviction rather than a distress situation.
