      detail: >-
        Derived from $325M cash and ~33-month runway to late 2026 (Jan 2024 statement) implies
        ~$10M/month lower bound; multi-program clinical execution and active GMP operations
        suggest upper end could reach $15–20M/month. Low confidence; not company-disclosed.
  approximationNotes: >-
    Row 1 is confirmed from official press releases. Rows 2–5 are estimated or unresolved.
    Row 4 (post-Series D cash) uses the burn proxy in row 5 as an input, compounding uncertainty.
    All values in USD millions except burn rate.
