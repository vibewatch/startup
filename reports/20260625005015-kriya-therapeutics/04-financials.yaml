  - Source Basis
  rows:
  - - KRIYA-825 (Kriya)
    - Geographic Atrophy
    - Suprachoroidal injection (in-office)
    - Not disclosed; no approved product
    - Large patient population (~2M US/EU) may constrain price vs. rare disease
    - Company-claimed target market size from Jan 2024 JPM release
  - - KRIYA-748 (Kriya)
    - Trigeminal Neuralgia
    - Trigeminal nerve injection (specialist)
    - Not disclosed; no approved product
    - Small target (~400K US/EU) may support premium pricing
    - Company pipeline page; structural estimate
  - - KRIYA-586 (Kriya)
    - Thyroid Eye Disease
