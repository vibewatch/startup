- id: milestones-and-strategic-evolution
  title: Milestones and strategic evolution
  body: 'The milestone pattern matters because Kriya has spent several years building a vertically integrated engine before showing clear clinical crossover. Manufacturing capacity arrived early: facility acquisition in 2020, renovation and cGMP suite completion in 2021, and public claims of consistent platform processes from research through commercial scale. Strategic scope widened through partnerships and acquisitions: the Twist collaboration expanded antibody discovery reach, Redpin added chemogenetics for neurology, Tramontane added FGF21 biology for MASH, and Everads contributed suprachoroidal ocular delivery. By 2024 management said the first product candidates were entering the clinic and projected up to five in clinic by end-2025; by May 2025 the company said a Phase 1/2 study for KRIYA-825 in geographic atrophy was already underway. Those milestones support the case that Kriya is no longer only a platform story, but the adverse counterpoint is that external observers still see
    unusually little public clinical data relative to the capital consumed, a critique that Labiotech explicitly raised in September 2025 after tabulating Kriya''s $900-million-plus financing base against its limited published clinical disclosures.'
