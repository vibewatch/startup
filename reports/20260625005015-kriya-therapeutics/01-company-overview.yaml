- id: capitalization-history-and-disclosure
  title: Capitalization history and disclosure quality
  body: Kriya's financing record is unusually large for a private gene-therapy company with limited public clinical readouts. Confirmed announced rounds include an $80.5 million Series A, $100 million Series B, $270 million Series C, a Series C top-up of more than $150 million, and a $320 million Series D close. That yields at least $920.5 million of clearly announced, non-duplicative financing. Public disclosures become messy in 2025, however. An SEC Form D filed in August 2025 shows a $313.3 million offering amount with two investors, and trade coverage debated whether that filing reflected a separate interim round or the same capital later closed and press-released as the oversubscribed $320 million Series D. Because the retrieved evidence does not definitively reconcile those records, the prudent base case is $920.5 million confirmed announced capital with upside to more than $1.23 billion if the Form D were additive. Current valuation is not publicly disclosed in retrieved sources.
