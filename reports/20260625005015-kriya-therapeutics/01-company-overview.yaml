company:
  name: Kriya Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: Kriya Therapeutics is a private, clinical-stage gene-therapy company built around a vertically integrated AAV development and manufacturing engine for common chronic diseases. Public evidence supports at least $920.5 million of announced financing from 2020 through the September 2025 Series D, with unresolved upside if an August 2025 SEC Form D was additive rather than overlapping. The company has clearly crossed from platform buildout into clinical execution through KRIYA-825, but public disclosure still lags its capital base on valuation, headcount, and governance detail.
sections:
- id: identity-and-operating-footprint
  title: Identity, mission, and operating footprint
  body: 'Kriya Therapeutics presents itself in 2026 as a clinical-stage biopharmaceutical company pursuing one-time gene therapies for common chronic diseases rather than a rare-disease niche player. The core positioning is explicit on the company website and in recent financing releases: Kriya wants gene therapy to become accessible ''for the many'' by pairing validated biology with lower-cost, scalable AAV manufacturing and direct-to-tissue delivery. Public materials show a meaningful evolution in how the company describes its footprint. Early financing and manufacturing releases used Redwood City or broader Silicon Valley datelines, while 2023 onward materials increasingly use Palo Alto and Research Triangle Park. The safest working conclusion is that Kriya maintains a Bay Area leadership and design presence while anchoring manufacturing and a growing share of clinical operations in RTP. The latest disclosed public pipeline is concentrated in ophthalmology, metabolic disease, and neurology.'
  claimRefs:
  - CO001
  - CO008
  - CO015
  - CO017
  - CO029
  - CO041
  tableRefs:
  - TO001
  figureRefs:
  - FO002
  - FO003
- id: leadership-and-governance
  title: Leadership bench and governance markers
  body: Founder concentration remains high. Shankar Ramaswamy still anchors strategy, fundraising, and external narrative as co-founder, chairman, and CEO; his Roivant and Axovant background explains why investors have tolerated a platform-first buildout without traditional public-company disclosure. The current executive bench is deeper than the founder-only narrative suggests. Fraser Wright brings gene-therapy product and CMC credibility, Mark Chen represents internal manufacturing and operating continuity, Katherine Eade covers legal and governance, and the 2025-2026 additions of Greg Di Russo and Sachiyo Minegishi indicate that Kriya is staffing for multi-program clinical execution and eventual commercialization planning. Governance disclosure is still incomplete by public-markets standards. The most explicit recent board change is Akshay Rai joining from Premji Invest at the Series D close; beyond that, public sources identify investor relationships and advisory credentials more readily
    than a full current board roster.
