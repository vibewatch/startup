callouts:
- calloutType: risk
  title: Funding opacity remains a diligence issue
  body: The company's financing record is large but not fully reconciled. The August 2025 SEC Form D shows a $313.3 million offering amount with two investors, while the September 2025 press release announces a $320 million Series D. Without cap-table or closing-detail disclosure, underwriting should assume the conservative $920.5 million confirmed total and treat higher totals as unresolved until management clarifies overlap.
  claimRefs:
  - CO018
  - CO033
  - CO042
  - CO043
- calloutType: strength
  title: Manufacturing integration is the core company-defining asset
  body: Kriya's earliest public milestones prioritized internal AAV manufacturing capacity, process continuity from research to commercial scale, and analytical control. That operating choice is unusual for a private platform of this age and is the most defensible reason investors continue to support the company at scale despite limited public clinical data.
  claimRefs:
  - CO003
  - CO004
  - CO006
  - CO030
  - CO031
  - CO032
- calloutType: assumption
  title: Bay Area headquarters should be treated as a moving target, not a single static city
  body: The evidence set alternates between Redwood City, Silicon Valley, and Palo Alto while consistently pairing those Bay Area references with Research Triangle Park. The report therefore treats Kriya as a bi-coastal operating company with a Bay Area executive/design base and an RTP manufacturing base until management explicitly standardizes headquarters language.
  claimRefs:
  - CO008
  - CO012
  - CO017
