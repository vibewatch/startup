  topStrengths:
    - >-
      Integrated AAV development and GMP manufacturing infrastructure gives Kriya more platform depth than many
      single-asset private gene-therapy peers.
    - >-
      Confirmed announced financing of at least $920.5 million provides unusually strong balance-sheet support for a
      pre-commercial biotech.
    - The pipeline spans ophthalmology, metabolic disease, and neurology rather than a single narrow rare-disease niche.
    - >-
      KRIYA-825 has already crossed into the clinic, showing the company is no longer only a platform-construction
      story.
  topRisks:
    - >-
      Public clinical evidence remains thin relative to the capital raised, with no disclosed efficacy readout for
      KRIYA-825 and sparse data for other programs.
    - The Series D price per share, post-money valuation, preference stack, and current cash runway remain undisclosed.
    - >-
      Gene therapy has suffered severe market, safety, and commercialization setbacks, raising the bar for any premium
      private valuation.
    - >-
      Kriya's strategy targets common chronic diseases, which may require unusually strong manufacturing, safety, payer,
      and adoption proof compared with rare-disease precedents.
    - >-
      Governance and operating disclosure lag public-market standards on headcount, full board composition, and
      commercial planning detail.
  unresolvedGaps:
    - >-
      Whether the August 2025 Form D and September 2025 Series D should be reconciled as one financing event or
      partially separate subscriptions.
    - >-
      Any disclosed post-Series-D cash balance, burn rate, and runway update after the January 2024 management
      commentary.
    - Clinical efficacy, durability, and safety data from the KRIYA-825 Phase 1/2 trial and any other human readouts.
    - >-
      A defensible valuation anchor based on price per share, post-money mark, or private-market secondary evidence
      rather than inference.
    - Verified current headquarters convention, headcount, and detailed board composition.
