company:
  name: Kriya Therapeutics
chapter:
  number: 7
  title: Risks
  summary: >-
    Kriya Therapeutics carries a high-severity, multi-dimensional risk profile dominated by four
    reinforcing threat clusters: gene therapy sector-level regulatory and safety precedents showing
    that even approved products can be withdrawn or severely restricted after deaths and safety
    signals; a clinical pipeline execution record with three original programs discontinued, at
    least one missed IND milestone, and only two of nine publicly disclosed programs in the clinic
    after more than $920 million raised; an uncharted reimbursement environment where no gene
    therapy for a prevalent, non-rare disease has been successfully commercialized at scale; and
    structural governance and political-connection opacity that creates scrutiny and conflict-of-
    interest risk. The Labiotech critique—that Kriya accumulated more than $1.2 billion in
    financing with limited public clinical data relative to capital consumed—is a legitimate
    adverse signal that cannot be dismissed as sector commentary. Mitigations include a $320
    million Series D closed oversubscribed in September 2025, an improving leadership bench with
    CMO appointed December 2025 and CFO January 2026, and an internally manufactured GMP
    platform that investor Premji Invest explicitly cited as differentiated. Residual regulatory,
    clinical, and commercial risks nevertheless remain at thesis-threatening levels for an
    investment predicated on approvals in prevalent chronic diseases.

sections:
  - id: regulatory-safety-risk
    title: Gene Therapy Sector Regulatory and Safety Risk
    body: >-
      Kriya operates in the highest regulatory-intensity tier of biopharmaceuticals. All AAV
      gene therapies require Biologics License Applications (BLA) reviewed by FDA's Center for
      Biologics Evaluation and Research (CBER), supported by extensive CMC documentation,
      long-term follow-up protocols spanning up to fifteen years post-dosing, and genotoxicity
      studies addressing the theoretical risk of insertional mutagenesis. The FDA approved-CGT
      product list confirms that only a handful of non-CAR-T gene therapies have been approved
      in the United States, and most target ultra-rare diseases—setting a low regulatory
      precedent for Kriya's prevalent-disease strategy.

      The 2025 sector context is acutely adverse. The FDA narrowed coverage of bluebird bio's
      Skysona (cerebral adrenoleukodystrophy gene therapy) after detecting an elevated risk of
      blood cancer, and the FDA requested a temporary halt on shipments of Sarepta Therapeutics'
      Elevidys (DMD gene therapy) following two patient deaths—both documented by independent
      trade sources as of August 2025. Pfizer voluntarily withdrew its FDA-approved hemophilia
      B gene therapy Beqvez from the US market in 2025, citing commercial viability. None of
      these events involved KRIYA-825 or KRIYA-748 directly, but they establish that approved
      gene therapies can generate fatal adverse events, trigger FDA restriction, and fail
      commercially—all of which represent plausible outcomes on Kriya's development path.

      AAV-specific safety risks include immunogenicity: pre-existing neutralizing antibodies
      (NAbs) to AAV capsid serotypes are prevalent in the general population, and the FDA-
      approved label for Pfizer's Beqvez explicitly requires pre-treatment NAb testing and
      excludes seropositive patients. Hepatotoxicity driven by T-cell immune responses to AAV
      capsid presented in more than 70 percent of Beqvez patients (elevated transaminases) and
      required corticosteroid treatment in more than 50 percent. KRIYA-825's suprachoroidal
      injection route is novel, creating regulatory uncertainty around both the procedural safety
      profile and the device regulatory pathway for the Everads suprachoroidal injector used in
      preclinical NHP studies. KRIYA-748's CNS injection into the trigeminal nerve carries
      intrinsic procedural safety risks that will require careful Phase 1/2 dose escalation
      management. Each indication also requires a separate IND filing; any clinical hold on one
      program could impose operational disruption on the broader development timeline.
