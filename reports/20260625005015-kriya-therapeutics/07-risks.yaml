callouts:
  - calloutType: risk
    title: Sector-Level Safety Precedents Are Directly Adverse and Cannot Be Dismissed
    body: >-
      The 2025 gene therapy safety record creates a direct sector-level regulatory risk
      for Kriya. The FDA's request to halt Elevidys shipments after two patient deaths
      (Sarepta), its narrowing of Skysona's approved population after blood cancer signals
      (bluebird bio), and Pfizer's voluntary market withdrawal of Beqvez after commercial
      failure all occurred within the twelve months before this report. These events are
      structurally analogous to Kriya's pipeline: all are AAV-based gene therapies, all
      were administered via specialist physicians, and all initially received FDA approval
      or were in advanced clinical stages. Kriya must design its Phase 1/2 safety monitoring
      plans anticipating exactly this regulatory environment—any ambiguity in safety
      management will be viewed through the lens of these precedents. Investors should
      require detailed DSMB composition, stopping rules, and SAE reporting protocols before
      committing to the next financing round.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR004
      - CR006
      - CR008

  - calloutType: risk
    title: Reimbursement for Prevalent-Disease Gene Therapy Is an Unsolved Problem Industry-Wide
    body: >-
      The commercial failures of Hemgenix, bluebird bio's Zynteglo and Skysona, and Pfizer's
      Beqvez demonstrate that FDA approval is a necessary but not sufficient condition for
      gene therapy commercial success—even in rare diseases. Kriya's geographic atrophy
      program targets two million patients, the majority of them Medicare beneficiaries, in
      a payer environment that has never successfully paid for a gene therapy at this scale.
      No public company has demonstrated a commercially viable path for prevalent-disease
      gene therapy pricing. Bluebird bio went from a $8.74 billion market capitalization
      to near-insolvency at $48 million by June 2025, with approved products and a first-
      mover advantage. The residual exposure for Kriya's GA commercial strategy is thesis-
      break level, and no public disclosure of a pricing or payer engagement plan exists.
    claimRefs:
      - CR027
      - CR028
      - CR029
      - CR030
      - CR031
      - CR032

  - calloutType: insight
    title: Capital Efficiency Concern Is Structural, Not Cyclical
    body: >-
      Kriya has raised more than $920 million in confirmed capital with two programs in
      early Phase 1/2 and seven programs in pre-clinical or IND-enabling stage. The
      Labiotech critique—"candidates disappearing from the pipeline, unmet development
      deadlines, and a lack of transparency"—reflects a structural pattern of platform
      investment preceding clinical output, not a temporary delay. Three of the original
      programs from 2020 have been silently discontinued; the MASH IND missed its public
      commitment deadline by at least twelve months; and the JPM 2024 guidance of five
      programs in clinic by end-2025 was not achieved. Against this backdrop, the
      Series D was oversubscribed and patient Square Capital doubled down—indicating
      that sophisticated capital is betting on the manufacturing platform thesis despite
      the clinical lag. But the diligence ask is sharp: investors should require an
      explicit capital efficiency tracker (dollars spent per clinical program reached
      Phase 2) relative to comparable gene therapy programs before concluding that
      the buildout period is over rather than ongoing.
    claimRefs:
      - CR011
      - CR013
      - CR014
      - CR016
      - CR043

