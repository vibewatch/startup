  claims:
    - id: CR001
      statement: >-
        The FDA requested a temporary halt on Sarepta Therapeutics' Elevidys (delandistrogene
        moxeparvovec) shipments following two patient deaths linked to the AAV gene therapy for
        Duchenne muscular dystrophy, as reported by BioSpace in August 2025.
      type: observed
      topic: sector regulatory safety precedent
      sourceRefs:
        - SR002
        - SR003
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QR001
      contradictsClaimRefs: []

    - id: CR002
      statement: >-
        The FDA narrowed the approved indication for bluebird bio's Skysona (elivaldogene
        autotemcel) gene therapy to only patients with cerebral adrenoleukodystrophy who have
        no other treatment options, after detecting an elevated risk of blood cancer (myeloid
        malignancy) associated with the lentiviral gene therapy, as reported by BioSpace and
        PackGene in August 2025.
      type: observed
      topic: sector regulatory safety precedent
      sourceRefs:
        - SR002
        - SR003
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QR001
      contradictsClaimRefs: []

    - id: CR003
      statement: >-
        Pfizer voluntarily withdrew its FDA-approved hemophilia B gene therapy Beqvez
        (fidanacogene elaparvovec-dzkt) from the US market in 2025, cited by Labiotech as
        a signal of commercial unviability despite regulatory approval.
      type: observed
      topic: commercial failure precedent
      sourceRefs:
        - SR001
        - SR011
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QR002
      contradictsClaimRefs: []

    - id: CR004
      statement: >-
        FDA approval of Beqvez required pre-treatment neutralizing antibody testing against
        the AAVRh74var capsid, and patients with detectable NAbs were excluded from treatment—
        establishing a precedent that NAb seroprevalence materially constrains eligible patient
        population for any AAV gene therapy.
      type: observed
      topic: AAV immunogenicity patient exclusion risk
      sourceRefs:
        - SR011
        - SR015
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QR004
      contradictsClaimRefs: []

    - id: CR005
      statement: >-
        Beqvez Phase 3 trial data showed elevated liver enzyme levels (elevated transaminases)
        in 43 out of 60 patients (approximately 72%) treated at the recommended dose, with 31 of
        60 patients (52%) requiring corticosteroid treatment to manage hepatotoxicity, indicating
        systemic hepatic immune response to AAV vector is a consistent safety risk class across
        AAV gene therapies.
      type: observed
      topic: AAV hepatotoxicity safety class risk
      sourceRefs:
        - SR011
        - SR015
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QR004
      contradictsClaimRefs: []

    - id: CR006
      statement: >-
        Beqvez prescribing information states that the gene therapy can insert into human cell
        DNA and that this insertion carries a theoretical risk of cancer, for which long-term
        follow-up monitoring up to fifteen years post-dosing is required; this is a class-level
        regulatory obligation for all AAV products including Kriya's programs.
      type: observed
      topic: genotoxicity / long-term regulatory obligation
      sourceRefs:
        - SR011
        - SR015
      confidence: high
      freshness: current
      answersQuestionRefs:
        - QR004
        - QR005
      contradictsClaimRefs: []

    - id: CR007
      statement: >-
        The FDA-maintained list of approved cellular and gene therapy products includes Elevidys
        (DMD), Hemgenix (hemophilia B), and Beqvez (hemophilia B) among approved AAV gene
        therapies, confirming that regulatory precedent for AAV approval exists but is limited
        to rare or ultra-rare indications; no prevalent-disease AAV gene therapy has been
        approved.
      type: observed
      topic: regulatory precedent gap for prevalent disease
      sourceRefs:
        - SR010
        - SR015
      confidence: high
      freshness: current
      answersQuestionRefs:
