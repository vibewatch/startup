  - id: TU005
    title: Expansion and concentration risk table
    notes: Risk ratings are qualitative assessments based on publicly available pipeline and clinical-stage information as of June 2026. No Kriya-specific commercial risk disclosures exist. Severity ratings reflect analyst judgment using gene therapy industry precedent (e.g., Beqvez withdrawal, Luxturna uptake challenges).
    columns:
      - Risk dimension
      - Description
      - Severity
      - Mitigation / expansion driver
      - Diligence path
    rows:
      - - KRIYA-825 single-asset concentration
        - Most clinically advanced and most externally validated program; failure would remove the primary near-term commercial pathway
        - High
        - Five-indication pipeline is intended as diversification; platform manufacturing also supports multiple programs in parallel
        - Request internal risk register; ask what triggers a pause or discontinuation decision for KRIYA-825
      - - Medicare payer access for prevalent GA indication
        - GA patients are predominantly elderly; Medicare Part B buy-and-bill model for a multi-million-dollar gene therapy in a prevalent indication has no established precedent; Pfizer Beqvez withdrawal in 2024 demonstrates the risk is real
        - High
        - Outcomes-based reimbursement arrangements (similar to Pfizer's Beqvez warranty program); potential CMS TCET pathway engagement; lower list price positioning vs. rare-disease AAV
        - Request Kriya's reimbursement strategy documents; ask whether ICER engagement is planned; seek evidence of payer access conversations
      - - AAV pre-screening immunogenicity exclusions
        - Anti-AAV antibody prevalence excludes 20-40% of candidate patients depending on serotype; KRIYA-825's specific capsid exclusion rate is not disclosed
        - Medium
        - Choice of serotype and capsid engineering can reduce pre-existing immunity; direct retinal delivery may allow lower capsid dose
        - Ask Kriya what fraction of screened KRIYA-825 trial patients have been excluded due to high anti-AAV titers; request capsid selection rationale
      - - Execution lag on multi-program plan
        - 'JPM 2024 plan called for up to 5 programs in clinic by end-2025; only 2 confirmed by Sept 2025 per Labiotech; MASH deadline (Q1 2025) reportedly not met'
        - Medium
        - $320M Series D provides capital to support clinical and CMC operations; integrated manufacturing provides some flexibility in sequencing
        - Request current program-level milestones vs. original plan; ask what caused MASH delay and whether the indication is still active
      - - No disclosed patient advocacy or KOL network for TN or TED
        - Unlike GA (ARVO presentations, Quan Dong Nguyen endorsement) and T1D (T1D Fund investment), KRIYA-748 (TN) and KRIYA-586 (TED) have no named specialist, advocacy partner, or published data in the public domain
        - Medium
        - KRIYA-748 is reported in clinic, implying some investigator network exists; TED has Tepezza as validated adjacent market
        - Ask for named clinical site investigators and KOL advisory board composition for KRIYA-748 and KRIYA-586
