  - id: concentration-expansion-and-durability-risk
    title: Concentration risk, payer access barriers, and commercial-readiness gaps
    body: >-
      Kriya's pre-commercial status means that the conventional customer-risk metrics
      (NRR, GRR, churn, concentration) cannot be reported. Instead, this section documents
      the structural risks that Kriya's future customer relationships face.

      Single-asset concentration: KRIYA-825 is the most clinically advanced asset and appears
      to receive the most external validation (ARVO presentations, named KOL engagement,
      Everads partnership). If KRIYA-825 fails in Phase 1/2 safety or efficacy assessments,
      the entire franchise loses its most credible commercial pathway near-term. The JPM 2024
      update anticipated "up to five programs in clinic by end-2025" — as of the Labiotech
      September 2025 report, only two (KRIYA-825 and KRIYA-748) had confirmed clinical entry,
      indicating execution lag relative to earlier projections.

      Payer access risk for Medicare-dominated GA indication: GA patients are predominantly
      elderly (age 70+), making Medicare Part B the dominant payer for KRIYA-825 if approved.
      Medicare Part B reimburses provider-administered drugs under a "buy-and-bill" model
      at ASP+6% or negotiated rates. High-priced one-time gene therapies like Beqvez ($3.5M
      list price) have faced low commercial uptake in Medicare settings; Pfizer withdrew
      Beqvez from the US market in 2024 citing insufficient commercial uptake. The precedent
      from Hemgenix (hemophilia B, also Medicare-adjacent for older patients) and Beqvez
      illustrates that approved gene therapy commercial viability in prevalent, older-patient
      indications remains unproven.

      Adverse competitive pressure: As of mid-2025, at least 10 other programs targeting GA
      were in clinical development (Retinatoday 2024 pipeline overview), including several
      with Phase 3 data. If any competitor achieves approval before KRIYA-825, it could
      establish prescriber habits and payer coverage policies that make a second-to-market
      entry more difficult.

      Immunogenicity and patient-screening burden: AAV gene therapies require pre-treatment
      antibody screening to exclude patients with high titers of neutralizing antibodies
      against the AAV capsid. The Beqvez label required such screening. This reduces the
      eligible patient population by an estimated 20-40% depending on the capsid serotype and
      indication, adding physician burden and reducing the practical addressable population
      relative to the headline prevalence figures.

      Platform expansion as risk mitigation: Kriya's five-indication pipeline is intended
      as concentration risk mitigation—no single indication failure is supposed to end the
      company. However, the adverse observation from Labiotech (September 2025) that "much
      is not known about the progress of these drugs" and that "candidates [have been]
      disappearing from the pipeline" suggests that multi-indication execution risk is real
      and that the platform does not guarantee proportional risk diversification.

      No NRR, GRR, churn, retention cohort, or satisfaction data is available for any
      customer segment. These gaps cannot be bridged from public evidence and are the
      principal diligence asks for any investor or partner evaluating Kriya's commercial
      readiness.
