chapter:
  number: 6
  title: Customers
  summary: >-
    Kriya Therapeutics has no commercial customers, no product revenue, and no disclosed
    retention or churn metrics as of June 2026. The company is explicitly pre-commercial:
    every pipeline asset is investigational, and the first Phase 1/2 trial (KRIYA-825 in
    geographic atrophy) was initiated in early 2025. The "customers" question must therefore
    be reinterpreted as five future buyer-user-payer surfaces mapped to specific physician
    specialties and payer mixes by indication. The closest available substitutes for
    commercial customer proof are: a named exclusive delivery-technology partnership with
    Everads Therapy (suprachoroidal injector for retinal programs); a disease-advocacy
    investment from Breakthrough T1D's T1D Fund in the September 2025 Series D; named
    specialist endorsements of clinical need including Quan Dong Nguyen, MD (Stanford Byers
    Eye Institute) on GA gene therapy; active Phase 1/2 clinical enrollment in KRIYA-825 and
    KRIYA-748; and a $320 million Series D oversubscribed at a step-up, affirming
    sophisticated investor validation of the platform thesis. Concentration risk is high:
    KRIYA-825 dominates the publicly visible clinical timeline, GA is a Medicare-dominated
    indication with unproven payer willingness for one-time high-cost gene therapies in a
    prevalent chronic disease, and no precedent for commercial AAV gene therapy in GA exists.
    No NRR, GRR, churn, or satisfaction data can be reported for any customer segment.

sections:
  - id: pre-commercial-status-and-customer-framework
    title: Pre-commercial status and how to interpret "customers" for a clinical-stage gene therapy company
    body: >-
      Kriya Therapeutics is unambiguously pre-commercial as of June 2026. No product has
      received regulatory approval from the FDA or any equivalent authority. No revenue has
      been disclosed in any public filing or press release. No named patients have received a
      commercial Kriya product. The company's own press releases and pipeline page describe
      every asset as investigational. In the Series D press release (September 2025), CEO
      Shankar Ramaswamy described the company as "clinical-stage" and stated that proceeds
      would be used to support clinical trials, not commercialization. The January 2024 JPM
      update similarly positioned all programs as pre-commercial with five programs targeted to
      be "in clinic" by end-2025. As of the most recent available public evidence (ARVO 2025,
      May), the first Phase 1/2 trial for KRIYA-825 in geographic atrophy had recently
      initiated enrollment, and KRIYA-748 for trigeminal neuralgia was reportedly in the
      clinic, but no patient count, site count, or dosing data had been publicly disclosed.

      For the purposes of this analysis, "customers" are reinterpreted as the future
      buyer-user-payer surfaces Kriya must engage to achieve commercial success in each of
      its five lead indications. These surfaces break into four distinct roles: (1) the
      prescribing specialist who evaluates and orders the gene therapy; (2) the delivery
      physician or proceduralist who administers it; (3) the patient who consumes it and
      whose outcomes drive reimbursement advocacy; and (4) the payer—either Medicare Part B,
      commercial insurance, or Medicaid—that ultimately reimburses the provider. The current
      "customers" of Kriya's value proposition are therefore clinical investigators who
      enroll trial patients, technology partners like Everads who validate delivery feasibility,
      disease-advocacy investors like the T1D Fund who validate unmet patient need, and
      specialist opinion leaders who publicly endorse the clinical rationale.
