tables:
  - id: TU001
    title: Customer segmentation table
    notes: Prevalence estimates are drawn from NEI AMD data, NIDDK T1D statistics, NINDS trigeminal neuralgia data, and Kriya JPM 2024 press release. No Kriya-specific market-sizing disclosure exists; values are third-party epidemiology. Evidence-gap column reflects publicly available information only as of June 2026.
    columns:
      - Indication / program
      - Primary prescriber / buyer
      - Delivery setting
      - Primary payer
      - Prevalence (US+EU est.)
      - Evidence gap
    rows:
      - - KRIYA-825 — Geographic Atrophy
        - Retinal specialist (ophthalmologist, retina subspecialty)
        - In-office suprachoroidal injection (ambulatory surgical center or physician office)
        - Medicare Part B (buy-and-bill) — dominant given median patient age >70
        - ~2 million US+EU (NEI AMD data; ~11M broader AMD population)
        - No commercial precedent for AAV GA gene therapy; Medicare buy-and-bill payer model for high-price gene therapy unproven in prevalent indications
      - - KRIYA-586 — Thyroid Eye Disease
        - Neuro-ophthalmologist or oculoplastic surgeon
        - In-office peribulbar injection
        - Commercial insurance dominant (working-age patients with Graves' disease)
        - ~1 million US+EU with TED; ~5% with severe active TED
        - Tepezza (IV, 8 infusions) is entrenched as standard of care; patient/payer switching inertia unknown
      - - KRIYA-839 — Type 1 Diabetes
        - Endocrinologist (adult) or pediatric endocrinologist
        - Intramuscular injection (office or outpatient clinic)
        - Commercial insurance (pediatric/young adult) + Medicare (T1D adults 65+)
        - ~1.7M US adults taking insulin for T1D; ~304K youth (NIDDK)
        - Long-term durability data absent; payer likely to require proof of insulin independence before coverage; auto-immune mechanism requires chronic disease management
      - - KRIYA-497 — MASH (F3/F4)
        - Hepatologist or gastroenterologist
        - Intramuscular injection (outpatient)
        - Commercial insurance + Medicare (metabolic syndrome affects broad age range)
        - ~40 million US+EU with MASH; F3/F4 subset is estimated at ~5-10% of total
        - Most pre-clinical of disclosed pipeline; no approved AAV therapy for MASH; payer risk high without Phase 2+ data
      - - KRIYA-748 — Trigeminal Neuralgia
        - Neurologist or pain specialist (referral from primary care)
        - Direct injection into trigeminal nerve (hospital or specialty center)
        - Commercial insurance + Medicare (TN onset mainly >50 years)
        - ~400K US+EU refractory TN patients (NINDS/NORD data)
        - Chemogenetic mechanism requires paired oral varenicline dosing (generic); two-component regimen adds adherence layer; limited gene therapy neurology precedent
