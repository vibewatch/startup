  evidenceGaps:
    - type: missing-data
      severity: high
      topic: Clinical enrollment and trial progress
      missingEvidence: >-
        No public disclosure of patient enrollment counts, site counts, dosing data, or safety
        signals for KRIYA-825 or KRIYA-748 Phase 1/2 trials as of June 2026. ClinicalTrials.gov
        search for Kriya Therapeutics returned no detailed registrations.
      whyItMatters: >-
        Without enrollment data, analysts cannot assess whether trial execution pace or patient
        receptivity is consistent with the timeline to pivotal readouts and eventual NDA filing.
      diligencePath: >-
        Request current enrollment status, site activation count, and safety monitoring committee
        status from management in a data-room session.
      relatedQuestionRefs:
        - QU015
        - QU019
        - QU025
    - type: missing-source
      severity: high
      topic: Non-GA program clinical validation
      missingEvidence: >-
        No confirmed public evidence that KRIYA-586 (TED), KRIYA-839 (T1D), or KRIYA-497 (MASH)
        have entered clinical stage as of June 2026; Labiotech (Sept 2025) notes only KRIYA-825
        and KRIYA-748 as confirmed clinical programs.
      whyItMatters: >-
        The multi-asset platform thesis requires clinical-stage diversification; confirmation of
        only two programs versus the JPM 2024 projection of five creates uncertainty about
        execution pace and future customer-surface breadth.
      diligencePath: >-
        Request IND filing dates and clinical development plan for KRIYA-586, KRIYA-839, KRIYA-497
        from management; cross-reference FDA IND clearance notices if available.
      relatedQuestionRefs:
        - QU019
    - type: missing-source
      severity: medium
      topic: Payer access strategy
      missingEvidence: >-
        No payer coverage strategy, outcomes-based agreement framework, or Medicare access
        pathway document has been publicly disclosed by Kriya for any indication.
      whyItMatters: >-
        Gene therapy reimbursement is the single largest commercial hurdle; Pfizer's Beqvez
        withdrawal (2024) illustrates that payer access, not clinical efficacy, often determines
        commercial viability.
      diligencePath: >-
        Request any internal payer engagement or coverage modeling documents; assess whether
        Kriya has health-economics or market-access functions in place.
      relatedQuestionRefs:
        - QU023
    - type: missing-source
      severity: medium
      topic: Commercial infrastructure
      missingEvidence: >-
        No commercial distribution infrastructure (specialty pharmacy partnerships, hub services,
        salesforce, or medical affairs team headcount) has been publicly announced.
      whyItMatters: >-
        Gene therapy commercial launches require specialty-pharmacy distribution and patient
        support programs; absence of any public infrastructure announcement at Phase 1/2 stage
        is not unusual but is a forward watch item.
      diligencePath: >-
        Check for any job postings in commercial or market-access functions; ask management
        about commercial readiness timeline and partnership plans.
      relatedQuestionRefs:
        - QU023
    - type: missing-source
      severity: low
      topic: Developer-community and prescriber signal
      missingEvidence: >-
        No developer-community-equivalent signal (API, SDK, tool adoption) applies to a
        clinical-stage gene therapy company. The nearest practitioner-community proxy is
        the ARVO, ASRS, and ophthalmology conference presentation record.
      whyItMatters: >-
        Prescriber readiness signals are important leading indicators of commercial adoption;
        conference presentation frequency and specialist press coverage are the available proxies.
      diligencePath: >-
        Track ARVO, ASGCT, ASRS, and retina-specialist conference presentation frequency;
        monitor trade press sentiment over the next 12-18 months.
      relatedQuestionRefs:
        - QU016
    - type: missing-data
      severity: high
      topic: Commercial customer metrics
      missingEvidence: >-
        No public NRR, GRR, churn, or customer satisfaction data exists or is expected to
        exist for any Kriya customer segment until commercial launch; Kriya is pre-commercial
        with no revenue, no customers, and no disclosed commercial agreements.
      whyItMatters: >-
        Standard SaaS or commercial-biotech customer quality metrics are completely absent
        by the nature of pre-commercial status; this is expected but must be acknowledged
        for any investor conducting customer diligence.
      diligencePath: >-
        Return to this chapter after first commercial launch; revisit clinical partner
        satisfaction and investigator retention as interim proxies.
      relatedQuestionRefs:
        - QU001
