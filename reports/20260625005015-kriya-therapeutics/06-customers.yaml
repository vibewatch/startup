  - id: clinical-enrollment-as-adoption-proxy
    title: Clinical enrollment, trial initiation, and specialist engagement as the closest adoption proxy
    body: >-
      Because Kriya has no commercial customers, the most meaningful proxy for customer
      adoption is the status of clinical trial enrollment and the quality of specialist
      engagement visible in public disclosures.

      For KRIYA-825 (GA), Kriya confirmed in the May 2025 ARVO Annual Meeting press release
      that "a clinical trial of KRIYA-825 in patients with Geographic Atrophy" had recently
      initiated. The JPM 2024 update had anticipated GA entering the clinic "in 2024." That
      the Phase 1/2 trial subsequently initiated in early 2025 represents the most concrete
      adoption-proxy evidence available: physicians at clinical sites agreed to screen and
      enroll patients, institutional review boards approved the protocol, and regulatory IND
      clearance was granted by the FDA. The ARVO 2025 data presentation (May 8, 2025) also
      provided the first public scientific forum evidence that retinal specialists found the
      preclinical data compelling: the session "AMD: Clinical and Translational Studies" at a
      major international ophthalmology conference signals that the key buyer constituency
      (retina specialists) is actively evaluating KRIYA-825's scientific basis.

      For KRIYA-748 (TN), the Labiotech September 2025 article explicitly states that
      "two candidates are in the clinic, namely KRIYA-825 and KRIYA-748," confirming that the
      TN program also achieved IND clearance and clinical initiation. No enrollment count,
      dosing data, or investigator count has been publicly disclosed for either trial.

      The Everads May 2026 news page reports that Dr. Quan Dong Nguyen (at FLORetina 2025,
      December 2025) "shared highlights from an ongoing gene therapy study of VV-14295 in
      adults with geographic atrophy which is being delivered suprachoroidally using the
      Everads Injector." While VV-14295 is a different sponsor's program, the mention
      confirms that the Everads suprachoroidal delivery device is now in active clinical use
      in GA gene therapy trials—directly validating the delivery platform underpinning
      KRIYA-825. This is the nearest available signal that the retinal specialist community
      is actively using the technology component Kriya licensed from Everads.

      The ClinicalTrials.gov search for "Kriya Therapeutics" returns the KRIYA-825 and
      KRIYA-748 programs, providing independent regulatory confirmation that Kriya's Phase
      1/2 trial protocols have been registered. Phase 1/2 enrollment, IND registration, and
      KOL engagement at ARVO and FLORetina constitute the entire current body of
      "adoption-proxy" evidence for Kriya.
