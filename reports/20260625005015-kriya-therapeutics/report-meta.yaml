summary:
  headline: >-
    Kriya has assembled a rare combination of capital, manufacturing ambition, and chronic-disease
    gene-therapy scope, but the public evidence base is still too thin on clinical efficacy,
    valuation, and burn discipline to support a clear buy posture.
