company:
  name: Kriya Therapeutics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Kriya Therapeutics addresses a deliberately enlarged market boundary—prevalent chronic
    diseases in ophthalmology, metabolic disease, and neurology rather than the ultra-rare
    monogenic disorders that define most of the AAV gene therapy historical record. Combined
    US+EU patient prevalence across its five disclosed indications (GA, TED, T1D, MASH, TN)
    reaches approximately 48.4 million, dwarfing traditional AAV addressable populations.
    The global AAV gene therapy market itself is estimated at $2.85–$4.35 billion in 2025–2026
    depending on source, with 2035 forecasts ranging from $21.6 billion (Coherent Market
    Insights) to $112.2 billion (TowardsHealthcare)—a fivefold spread reflecting genuine
    methodological and scope differences. Adoption constraints are real: immunogenicity
    pre-screening excludes a material fraction of patients, payer willingness for one-time
    high-price therapies in Medicare-dominated indications is unproven at scale, and the
    Elevidys safety event in 2025 created new payer and regulator scrutiny across systemic
    AAV programs.
sections:
  - id: market-boundary
    title: Market Boundary — Prevalent-Disease AAV vs. Traditional Rare-Disease AAV
    body: >-
      Kriya's market boundary is best understood as a deliberate departure from the AAV gene
      therapy industry's founding arc. The first wave of approved AAV drugs—Luxturna (RPE65
      inherited retinal dystrophy), Zolgensma (spinal muscular atrophy type 1), Hemgenix and
      Beqvez (hemophilia B)—targeted ultra-rare diseases with prevalences well below 100,000
      in the US. Kriya's pipeline spans five indications with combined US+EU prevalence
      exceeding 48 million patients: geographic atrophy (~2M), thyroid eye disease (~1M),
      type 1 diabetes (~5M), MASH (~40M), and trigeminal neuralgia (~400K). This shift in
      market boundary is explicit in the company's positioning language—gene therapy
      "accessible for the many"—and in its technology choices: suprachoroidal and
      intramuscular delivery routes instead of intravitreal or IV, in-house cGMP
      manufacturing at Research Triangle Park, and vertically integrated AAV design to reduce
      per-patient cost.

      The included spend within Kriya's market boundary is one-time or infrequent AAV gene
      therapy administered under specialist supervision for patients with chronic conditions
      poorly controlled by existing chronic-maintenance standards of care. Excluded spend
      includes: (a) ultra-rare monogenic AAV indications below the Orphan Drug prevalence
      threshold in Kriya's pipeline, (b) CAR-T or ex vivo cell-gene therapies, (c) mRNA or
      RNAi platforms, (d) the recurring spend on existing standard-of-care drugs (Syfovre,
      Izervay, insulin pumps) that Kriya aims to displace rather than complement. Status-quo
      substitutes in each indication are: monthly or bimonthly intravitreal complement
      inhibitor injections for GA; IV-administered teprotumumab (Tepezza) for TED; insulin
      pumps and multiple daily injections for T1D; weight-loss and no approved antifibrotic
      for advanced MASH (F3-F4); and anticonvulsants cycling to surgery for TN.

      Adjacencies include the broader gene therapy field, ophthalmic drug delivery platforms,
      metabolic disease biologics, and AAV CDMO manufacturing services. The prevalent-disease
      positioning is shared by a small cohort of AAV developers (Ascidian, Adverum, Gyroscope
      Therapeutics for GA; beta-cell/T1D gene therapy programs globally) but remains a
      minority strategy versus rare-disease-first pipelines. Whether Kriya's AAV cost
      structure enables profitable reimbursement at the coverage levels major payers
      (especially Medicare) would provide for common chronic diseases remains the central
      market-access question.
