      - - Geographic atrophy (dry AMD advanced)
        - One-time AAV suprachoroidal complement inhibitor therapy
        - Monthly/bimonthly intravitreal Syfovre or Izervay spend; surgical retinal procedures
        - Retinal specialist (buyer); Medicare Part B (payer)
        - Lead program KRIYA-825 in Phase 1/2; direct competitor to existing approved GA therapies
      - - Thyroid eye disease (Graves'-related TED)
        - One-time AAV peribulbar anti-IGF1R antibody therapy
        - IV teprotumumab (Tepezza) infusion spend; orbital decompression surgery
