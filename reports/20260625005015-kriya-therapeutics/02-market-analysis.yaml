  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: sizing gap
      missingEvidence: >-
        A disease-specific, bottom-up SAM estimate for the combined prevalent-disease AAV
        sub-segment (GA, TED, T1D, MASH, TN) from an independent analyst source; currently
        no published analyst report isolates this sub-segment.
      whyItMatters: >-
        Without a credible SAM, sizing Kriya's addressable market requires assumptions about
        treatment penetration, price, and payer coverage that cannot be independently validated,
        making the market sizing unreliable for investment purposes.
      diligencePath: >-
        Commission a bespoke disease-specific sizing analysis from a health economics
        consultancy; request Kriya's internal market model and payer strategy documents
        (confidential diligence path).
      relatedQuestionRefs:
        - QM016

    - type: missing-source
      severity: material
      topic: immunogenicity exclusion rate
      missingEvidence: >-
        The specific seroprevalence of neutralizing antibodies against the AAV serotypes
        used by Kriya in its five indications; the fraction of patients in each indication's
        target population who would be ineligible at screening due to pre-existing NAbs.
      whyItMatters: >-
        Immunogenicity is the primary adoption constraint cited by multiple analyst sources;
        if NAb seroprevalence against Kriya's capsids is high (above 30%), the effective
        addressable patient pool could be materially smaller than prevalence-based estimates.
      diligencePath: >-
        Request Kriya to disclose NAb seroprevalence data for its proprietary capsid variants
        from the KRIYA-825 Phase 1/2 screening population; cross-reference with published
        literature on seroprevalence for related AAV serotypes.
      relatedQuestionRefs:
        - QM021

    - type: missing-source
      severity: material
      topic: Medicare coverage for prevalent-disease gene therapy
      missingEvidence: >-
        Any CMS Medicare coverage policy or National Coverage Determination for AAV gene
        therapy in geographic atrophy or any other prevalent chronic disease indication;
        payer health technology assessment outcomes for high-priced one-time therapies in
