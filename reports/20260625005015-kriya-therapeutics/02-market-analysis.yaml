  - id: TM004
    title: Growth Drivers and Adoption Constraints
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication
      - Diligence Ask
    rows:
      - - Accelerating FDA approvals (Beqvez April 2024, Kebilidi November 2024)
        - Driver
        - Current (2024-2026)
        - Demonstrates regulatory feasibility; builds payer experience with one-time AAV pricing models
        - Assess whether Kriya's indications fall under Accelerated Approval or standard pathways
      - - AI-accelerated capsid engineering (Roche/Dyno $1B+ collaboration October 2024)
        - Driver
        - Medium-term (2025-2028)
        - Compresses time from novel AAV capsid to clinical candidate; may erode Kriya's capsid IP moat
        - Evaluate Kriya's capsid patent portfolio and whether AI-designed alternatives could replicate them
      - - Large unmet need in prevalent chronic disease indications
        - Driver
        - Current
        - 70-80% of T1D patients fail glucose targets; GA patients have partial lesion control only
        - Confirm clinical evidence standard payers will require for a one-time cure claim
      - - Outcomes-based warranty programs (Pfizer Beqvez warranty model April 2024)
        - Driver / constraint
        - Near-to-medium term
        - Risk-sharing model can unlock commercial access; requires long-term outcomes data and contract capability
        - Assess Kriya's payer strategy team and evidence generation plans
      - - Immunogenicity pre-screening barrier (neutralizing antibodies against AAV serotypes)
        - Constraint
        - Current
        - Substantial patient fraction is ineligible; reduces effective addressable population
        - Obtain Kriya-specific NAb seroprevalence data for its AAV serotype(s) across US+EU populations
      - - FDA/Sarepta Elevidys safety event (patient deaths, sales suspension 2025)
        - Constraint / adverse
        - Near-term (2025-2026 overhang)
        - Tightened payer and clinician risk tolerance for systemic AAV; raises safety data bar for new submissions
        - Review Kriya's safety monitoring plan for KRIYA-825 Phase 1/2 given suprachoroidal delivery route
      - - One-time pricing and Medicare coverage uncertainty for prevalent-disease indications
        - Constraint
        - Medium-to-long term
        - High one-time price model faces structural payer resistance for GA (2M US+EU) and T1D (5M US+EU)
        - Confirm whether CMS Medicare has published coverage policy for prevalent-disease gene therapies
      - - Manufacturing scale and cost at prevalent-disease volume
        - Constraint
        - Medium-term (commercial phase)
        - Kriya's in-house model requires far more doses than any current AAV approval; cost curve unvalidated
        - Verify Kriya's RTP facility capacity in doses per year and stated cost-of-goods trajectory
    notes: >-
      Timing is qualitative. Evidence for each driver/constraint is cited in section body
      and claims. Diligence asks represent open questions requiring primary access.
