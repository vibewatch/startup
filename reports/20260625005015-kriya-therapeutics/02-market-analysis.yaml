        - KRIYA-839 pipeline program; targets insulin independence
      - - MASH (metabolic dysfunction-associated steatohepatitis), F3-F4
        - One-time intramuscular AAV FGF21 gene therapy
        - Weight-loss drugs, resmetirom (Rezdiffra, first approved MASH treatment); liver transplant
        - Hepatologist/gastroenterologist (buyer); commercial/Medicare (payer)
        - Pipeline program; Kriya targets later-stage fibrosis with no approved antifibrotic
      - - Trigeminal neuralgia (medically refractory)
        - One-time intraneural AAV chemogenetic channel plus varenicline oral activator
        - Anticonvulsants (carbamazepine, oxcarbazepine); microvascular decompression surgery
        - Neurologist/pain specialist (buyer); commercial/Medicare (payer)
