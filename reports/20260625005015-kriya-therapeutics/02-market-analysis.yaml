        - Not included — outside Kriya's stated market boundary
        - Full SMA/hemophilia A/B/RPE65 market spend
        - Specialty gene therapy centers; commercial/Medicaid
        - Kriya's strategy explicitly excludes ultra-rare monogenic disease pipeline
    notes: >-
