  - id: buyer-payer-segmentation
    title: Buyer, User, and Payer Segmentation by Indication
    body: >-
      Kriya's five indications span meaningfully different buyer-user-payer configurations,
      which affects go-to-market sequencing, reimbursement strategy, and manufacturing
      logistics. For KRIYA-825 (geographic atrophy), the buyer and user is a retinal
      specialist at an academic or community retinal practice, and the primary payer is
      Medicare Part B (provider-administered biologics) because the average GA patient is
      over 70 years old—AMD prevalence rises sharply after age 55 per NEI data. The
      suprachoroidal delivery route for KRIYA-825 can be performed in an office or ambulatory
      surgical center, which lowers facility cost compared to an operating-room setting.

      For KRIYA-586 (thyroid eye disease), the prescriber is a neuro-ophthalmologist or
      oculoplastic surgeon, and the current standard-of-care payer relationship is governed
      by hospital outpatient infusion billing since Tepezza is administered IV. Kriya's
      localized peribulbar injection route, if approved, would allow the procedure in a
      specialty clinic. TED has roughly 1 million affected in US+EU but the severe subset
      requiring systemic therapy is smaller; commercial insurance is more prominent than
      Medicare because TED onset commonly occurs in younger adults with Graves' disease.

      For KRIYA-839 (T1D), the prescriber is an endocrinologist, and payer is a mix of
      commercial insurance (children and working-age adults) and Medicare (T1D adults 65+).
      Kriya's intramuscular delivery route is clinically simpler than intraocular or
      intravenous routes, but the long-term durability data required for payer acceptance of
      a one-time curative claim for a young-onset chronic disease are absent from the public
      record. For TN, medically refractory patients are the initial target—those who have
      cycled through anticonvulsants and are considering surgery. Neurologists and pain
      specialists own referral; commercial insurance and Medicare share coverage depending
      on patient age.

      MASH (F3/F4 stage with liver-predominant pathology) represents the largest total
      patient pool (40 million US+EU) but requires hepatologist gatekeeping and faces the
      specific challenge that MASH's disease progression can stabilize or reverse with weight
      management, creating a complex benefit-risk threshold for a one-time expensive therapy.
      Medicare and commercial payers would likely require robust biomarker data (liver biopsy
      or MRI-PDFF) for prior authorization at any commercially meaningful price point.
