callouts:
  - calloutType: strength
    title: Massive Patient Pool Relative to Traditional AAV Indications
    body: >-
      Kriya's five indications collectively represent approximately 48.4 million patients in
      the US+EU, versus the sub-100,000 populations typical of approved AAV drugs. Even at
      modest penetration rates (1-5%), the commercial ceiling for prevalent-disease AAV is
      an order of magnitude higher than the hemophilia B or SMA markets. The GA indication
      alone (~2M US+EU) is 50x the size of the hemophilia B global patient population
      (~38K worldwide). This market scale justifies the $920M+ capital build if clinical and
      commercial translation is achievable.
    claimRefs:
      - CM001
      - CM003
      - CM035
  - calloutType: risk
    title: AAV Market Size Estimates Diverge 5x and SAM Cannot Be Isolated
    body: >-
      The four principal analyst market estimates for the global AAV gene therapy market
      diverge by more than five times at the 2035 forecast horizon ($21.6B vs. $112.2B),
      and none provides a dedicated SAM for Kriya's specific prevalent-disease AAV sub-segment.
      This uncertainty is not just methodological noise—it reflects genuine unknowns about how
      many common-disease programs will reach approval, at what prices, and with what payer
      support. Investors relying on headline TAM numbers should apply heavy discounting when
      those numbers are used to justify valuations for a company with no approved product.
    claimRefs:
      - CM017
      - CM040
  - calloutType: risk
    title: Medicare Dominates the GA Market — Reimbursement Pathway Uncharted
    body: >-
      The majority of US geographic atrophy patients are Medicare-eligible (age 65+), and
      CMS has no published coverage policy for prevalent-disease AAV gene therapies as of
      June 2026. The high one-time price models that enabled hemophilia B gene therapy
      (HEMGENIX, Beqvez) work for a narrow rare-disease population but face structural
      resistance when applied to two million GA patients. Outcomes-based warranties (Pfizer's
      Beqvez model) are emerging but require multi-year durability data. Kriya has not
      disclosed its pricing strategy or payer engagement progress.
    claimRefs:
      - CM033
      - CM030
      - CM041
