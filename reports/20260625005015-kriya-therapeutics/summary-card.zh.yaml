  topStrengths:
    - 一体化 AAV 开发和 GMP 制造基础设施，让 Kriya 比许多单资产私人基因治疗同行更有平台深度。
    - 已确认披露融资至少 $920.5 million，为一家尚未商业化的生物技术公司提供了少见强度的资产负债表支撑。
    - 管线覆盖眼科、代谢疾病和神经科学，而不是单一狭窄罕见病生态位。
    - KRIYA-825 已进入临床，说明公司不再只是平台搭建故事。
  topRisks:
    - 相比已融资本，公开临床证据仍薄；KRIYA-825 尚未披露疗效读数，其他项目数据也稀疏。
    - Series D 轮每股价格、投后估值、优先股堆叠和当前现金跑道仍未披露。
    - 基因治疗已经遭遇严重的市场、安全和商业化挫折，任何溢价私募估值都要跨过更高门槛。
    - Kriya 的策略瞄准常见慢病；相比罕见病先例，公司可能需要更强的制造、安全、支付方和采用证据。
    - 在员工数、完整董事会构成和商业规划细节上，治理与运营披露都落后于公开市场标准。
  unresolvedGaps:
    - 2025 年 8 月 Form D 与 2025 年 9 月 Series D 轮究竟应合并视为一次融资事件，还是部分独立认购。
    - 2024 年 1 月管理层评论之后，是否有任何披露的 Series D 后现金余额、烧钱速度和现金跑道更新。
    - KRIYA-825 Phase 1/2 试验以及任何其他人体读数中的临床疗效、持久性和安全性数据。
    - 基于每股价格、投后估值标记或私募市场老股交易证据的可辩护估值锚，而不是推断。
    - 经验证的当前总部口径、员工数和详细董事会构成。
