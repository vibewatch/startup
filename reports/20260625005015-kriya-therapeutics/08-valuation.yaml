  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - KRIYA-825 efficacy miss
        - Phase 1/2 readout fails to show a clinically meaningful signal in geographic atrophy
        - Removes the central proof pillar; platform value reverts to manufacturing optionality only
        - Move from track to avoid; do not participate in any step-up round
      - - FDA clinical hold or safety event
        - Hold on KRIYA-825 or KRIYA-748, or a serious adverse event in the suprachoroidal/CNS programs
        - Mirrors Sarepta/bluebird precedent; impairs next financing and compresses the implied mark
        - Pause engagement; require DSMB charter and stopping-rule review before re-underwriting
      - - Down-round or sub-Series-D secondary marks
        - A flat or down Series E, or secondary trades below the Series D price
        - Invalidates the "significant step-up" thesis and signals deteriorating investor support
        - Re-price entry to the bear band; demand revised cap-table and preference terms
      - - Further pipeline discontinuation
        - Another program disappears from the pipeline or misses a stated IND deadline
        - Reinforces the Labiotech critique that capital is outrunning clinical output
        - Discount the breadth premium; underwrite on the two clinical assets only
      - - Capital adequacy shortfall
        - Disclosed burn implies runway shorter than the next value-inflection readout
        - Forces dilutive financing into weak data, magnifying down-round risk
        - Condition any commitment on a fully funded runway to the KRIYA-825 readout
    notes: >-
      Triggers are ordered by severity to the thesis. Transmission columns trace each event to the valuation outcome it
      drives. Drawn from Labiotech, sector precedents (Sarepta, bluebird), and Form D financing evidence.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV027
      - CV033

  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / path
    rows:
      - - Series D pricing
        - Price per share and post-money valuation for the $320.8M Series D
        - Converts the inferred $1.3-2.1B band into an actual entry mark; decides whether the price is defensible
        - Company / data room; cross-check against SEC Form D/A and any stock-purchase agreement
      - - Cap-table structure
        - Liquidation-preference stack and option-pool overhang across Series A-D
        - Preference overhang can materially reduce common-equity returns at any exit
        - Company / counsel; obtain the capitalization table and charter under NDA
      - - Capital adequacy
        - Monthly burn rate and post-Series D cash runway
        - Determines whether the next financing happens from strength or into weak data
        - Company / CFO Sachiyo Minegishi; request the operating model and runway bridge
      - - Clinical evidence
        - KRIYA-825 Phase 1/2 protocol, endpoints, DSMB charter, and any interim data
        - Efficacy proof is the single largest swing factor between the bull and bear cases
        - Company / clinical; obtain protocol, statistical plan, and safety-monitoring rules
      - - Capital reconciliation
        - Reconciliation of the company's ">$1.2B raised" claim to the ~$920.5M filing record
        - Resolves a credibility gap flagged by Labiotech and tests management transparency
        - Company / finance; map each round to its Form D filing and investor list
      - - Reimbursement strategy
        - Payer and CMS engagement plan for a prevalent-disease one-time gene therapy
        - Commercial viability depends on reimbursement, the failure mode behind Beqvez's withdrawal
        - Company / market access; request the pricing and payer-strategy documents
    notes: >-
      Asks are sequenced from price discovery to commercial viability. Each is a precondition for a track-to-buy upgrade.
      Sources: sec.gov Form D/A, kriyatherapeutics.com CFO appointment, labiotech.eu, pfizer.com Beqvez.
    claimRefs:
      - CV002
      - CV004
      - CV027
      - CV028
      - CV007
