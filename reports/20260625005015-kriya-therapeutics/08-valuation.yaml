  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation disclosure and Series D price per share
      missingEvidence: The Series D price per share, post-money valuation, liquidation-preference stack, and option-pool overhang are not in any public filing.
      whyItMatters: Without a disclosed mark and preference structure, the implied $1.3-2.1B band cannot be converted into a defensible entry price or common-equity return.
      diligencePath: Request the stock-purchase agreement, capitalization table, and charter under NDA and cross-check against SEC Form D/A.
      relatedQuestionRefs:
        - QV030
    - type: missing-source
      severity: material
      topic: capital adequacy burn rate and runway
      missingEvidence: Kriya has not disclosed a monthly burn rate or a post-Series D cash runway.
      whyItMatters: Capital adequacy determines whether the next financing happens from strength or into weak data, driving down-round risk.
      diligencePath: Obtain the operating model and runway bridge from CFO Sachiyo Minegishi.
      relatedQuestionRefs:
        - QV029
    - type: missing-source
      severity: blocking
      topic: KRIYA-825 clinical efficacy data
      missingEvidence: No human efficacy or safety data has been disclosed for KRIYA-825 beyond preclinical ARVO results.
      whyItMatters: Efficacy proof is the single largest swing factor between the bull and bear valuation cases.
      diligencePath: Obtain the Phase 1/2 protocol, statistical analysis plan, DSMB charter, and any interim data from the company.
      relatedQuestionRefs:
        - QV014
    - type: enumeration-incomplete
      severity: minor
      topic: Comparable Valuation Table coverage
      missingEvidence: Private-round and M&A comparables for gene-therapy companies are not publicly accessible, so the comparable set is partial.
      whyItMatters: Private and M&A comps would tighten the valuation triangulation that public market caps alone cannot complete.
      diligencePath: Source private-round and transaction comps from a data room or a paid private-market database such as PitchBook.
      relatedQuestionRefs:
        - QV031
      relatedTableRefs:
        - TV004
