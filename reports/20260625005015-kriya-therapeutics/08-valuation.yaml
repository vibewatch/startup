  - id: financing-valuation-context
    title: Financing Structure, Form D Reconciliation, and Implied Valuation
    body: >-
      The single most important valuation finding in this chapter is a reconciliation, not a new
      number. Prior chapters could not tell whether the August 2025 Form D ($313,297,440, two
      investors) and the September 2025 Series D press cycle represented one financing or two. The
      amended Form D/A filed September 10, 2025 settles it: it reports a total offering amount of
      $320,822,412 across ten investors with a first sale date of July 31, 2025. Because a Form D/A is
      an amendment to the original filing rather than a separate raise, the Series D total is $320.8
      million — the $313.3 million original and the $320.8 million amendment describe the same
      transaction, growing as additional investors closed. EDGAR's filing history confirms seven Form
      D filings between 2020 and 2025, with the two 2025 filings constituting one Series D offering.
      This removes the "additive versus overlap" double-count that would otherwise have inflated
      lifetime capital, anchoring the confirmed base at approximately $920.5 million rather than the
      company's claimed ">$1.2 billion."

      No price per share or post-money valuation appears in any filing, so an implied valuation must be
      inferred from dilution norms. A $320.8 million Series D at typical biotech dilution of 15 to 25
      percent implies a post-money valuation of roughly $1.3 billion (at 25 percent) to $2.1 billion
      (at 15 percent). This is an inference, not a disclosed fact, and it should be treated as a
      planning band rather than a mark. A defensible entry-discipline view widens the practical range
      to $1.5-2.5 billion once a step-up over the prior round and oversubscription are layered in. The
      sensitivity and range figures attached here translate those dilution assumptions into explicit
      valuation outcomes for investment-committee discussion.
