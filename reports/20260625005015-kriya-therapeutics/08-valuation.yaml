callouts:
  - calloutType: recommendation
    title: 'Current call: track, not buy'
    body: >-
      Kriya is worth tracking closely, but with no disclosed valuation, no human efficacy data, and no burn rate, the
      public record cannot support a buy at the implied $1.5-2.5B private mark.
    claimRefs:
      - CV031
      - CV032
      - CV034
  - calloutType: insight
    title: The Form D/A resolves the double-count
    body: >-
      The September 2025 amended Form D shows the Series D is one $320.8M offering across ten investors, not a separate
      $313.3M raise — anchoring confirmed lifetime capital near $920.5M rather than the claimed ">$1.2B."
    claimRefs:
      - CV002
      - CV004
      - CV006
  - calloutType: risk
    title: Approved does not mean safe
    body: >-
      bluebird's collapse to a $30M take-private, Pfizer's Beqvez withdrawal, and Sarepta's $11.6B-to-$1.76B fall show
      that even FDA-approved gene therapies can lose nearly all value; Kriya carries this tail risk pre-approval.
    claimRefs:
      - CV017
      - CV020
      - CV021

