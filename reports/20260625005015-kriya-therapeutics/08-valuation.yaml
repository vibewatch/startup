company:
  name: Kriya Therapeutics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Kriya Therapeutics presents a differentiated, internally manufactured AAV gene-therapy platform
    backed by an unusually deep capital base, but the public record cannot support a buy at any
    implied premium. The amended Form D/A filed September 10, 2025 resolves the prior chapters'
    central ambiguity: the Series D is a single $320,822,412 offering across ten investors with a
    first sale date of July 31, 2025, not an additional $313.3 million layered on top of the
    original $313,297,440 filing. On a filing-anchored basis, confirmed lifetime capital is roughly
    $920.5 million, well below the company's claimed ">$1.2 billion." No price per share, post-money
    valuation, or burn rate is publicly disclosed, and Caplight confirms no valuation mark is
    available. Typical Series D dilution math implies a $1.3-2.1 billion post-money, and a defensible
    investment stance places the private mark in a stretched $1.5-2.5 billion band — above public
    comps such as MeiraGTx ($1.07B, Phase 3) and REGENXBIO ($0.51B) that carry far more clinical
    proof. With KRIYA-825 only entering Phase 1/2 in May 2025 and no efficacy readouts, against a
    sector backdrop where VC funding fell 83% from 2021 to 2024 and approved gene therapies from
    bluebird, Pfizer, and Sarepta were withdrawn, restricted, or collapsed, the recommendation is
    track, confidence low, risk high, valuation stance stretched.

sections:
  - id: recommendation-summary
    title: Recommendation, Confidence, Risk, and Valuation Stance
    body: >-
      The investment call on Kriya Therapeutics is track, not buy and not avoid. The platform is
      genuinely differentiated and the investor syndicate is high quality, but the public evidence
      base is too thin on the three variables that decide a private-market entry: a disclosed
      valuation, demonstrated clinical efficacy, and a credible burn-and-runway picture. None of the
      three is available. Caplight confirms no valuation mark exists for the company, no price per
      share is attached to either the original Form D or the September 2025 amendment, and the
      company has not disclosed a post-Series D cash runway. In that vacuum the only honest stance
      is to stay engaged and condition any capital deployment on a Phase 1/2 readout and full
      data-room access rather than to underwrite an implied premium today.

      Confidence is low precisely because the inputs that would raise it are missing or
      single-sourced. Risk is rated high: Kriya is clinical-stage with no efficacy data, the gene
      therapy financing environment contracted 83 percent between 2021 and 2024, and the sector's
      cautionary tales — bluebird bio collapsing from roughly $10 billion to a $30 million take-
      private, Pfizer withdrawing the FDA-approved hemophilia B therapy Beqvez, and Sarepta's
      Elevidys deaths and shipment halt cutting its market cap from $11.6 billion to $1.76 billion —
      show that even approval does not guarantee commercial survival. Valuation stance is stretched:
      the implied private mark sits above public comparables that already carry commercial or
      Phase 3 proof. The recommendation logic and the dimension-by-dimension summary are captured in
      the figure and table anchored to this section.
    claimRefs:
