  - id: thesis-antithesis
    title: Investment Thesis and Anti-Thesis
    body: >-
      The bull thesis rests on four reinforcing arguments. First, Kriya owns an internally built,
      GMP-capable AAV manufacturing platform that investor Premji Invest has cited as a structural
      differentiator, lowering long-run cost of goods relative to peers that outsource. Second, the
      company has assembled an unusually deep capital base — roughly $920.5 million confirmed across
      Series A through D on a filing-anchored basis — that buys multiple shots on goal. Third, the
      Series D was characterized as oversubscribed at a significant step-up, and the syndicate is
      credible: Patient Square repeated from Series B, Premji Invest brought institutional scale, the
      T1D Fund added mission alignment, and Peter Thiel's Narya Capital added a technology-focused
      lens. Fourth, the addressable indications — geographic atrophy and other prevalent chronic
      diseases — are large markets where a durable one-time therapy could command premium pricing.

      The anti-thesis is equally concrete and, on the current record, better evidenced. KRIYA-825 only
      entered Phase 1/2 in May 2025 and has produced no human efficacy data; the strongest disclosed
      evidence remains a 2025 ARVO preclinical package of a murine NaIO3 model and non-human-primate
      biodistribution. Labiotech's September 2025 investigation called the company unusual for raising
      more than $1.2 billion "despite not having much pipeline progress to show for it" and flagged
      governance and political-connection questions. The company's own ">$1.2 billion" figure exceeds
      what Form D filings actually substantiate. No burn rate is disclosed, so capital adequacy cannot
      be tested. Each thesis pillar has a specific evidence event that would confirm or break it, and
      those triggers are enumerated in the thesis / anti-thesis table.
    claimRefs:
      - CV005
      - CV006
