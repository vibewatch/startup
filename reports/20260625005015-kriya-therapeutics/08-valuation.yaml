  - id: comparable-valuation
    title: Comparable Valuation Set
    body: >-
      Public gene-therapy comparables, drawn from the companiesmarketcap.com sector ranking as of June
      2026, frame why Kriya's implied private mark looks stretched. The commercial leaders sit far
      above Kriya's stage: Krystal Biotech at $10.24 billion with a marketed product (Vyjuvek), CRISPR
      Therapeutics at $5.27 billion with Casgevy approved, and Beam Therapeutics at $3.48 billion on
      base-editing promise. The more stage-relevant cluster is instructive: uniQure trades at $3.08
      billion with a commercial product (Hemgenix), MeiraGTx at $1.07 billion with multiple Phase 3
      programs, and REGENXBIO at $0.51 billion on a pre-commercial NAV platform. These companies carry
      materially more clinical de-risking than Kriya yet trade in a $0.5-3 billion band that overlaps
      the lower half of Kriya's inferred $1.5-2.5 billion private valuation.

      The adverse comparables sharpen the warning. bluebird bio, once near a $10 billion market cap,
      now sits at $48.66 million after a roughly $30 million take-private, and Sarepta fell from $11.6
      billion in 2024 to $1.76 billion in 2026 after Elevidys safety events. Both demonstrate that a
      gene-therapy franchise can lose nearly all of its equity value even after reaching the market.
      Kriya itself remains private with no disclosed valuation, so the final row is a deliberate
      blank: the comparable set can bound the question but cannot price it. Because private-round and
      M&A comparables are not publicly accessible, the enumeration is partial, and that limitation is
      recorded as an explicit evidence gap tied to the comparable table.
