        and physician adoption rates for Syfovre and Izervay in the US GA market.
      whyItMatters: >-
        Kriya's GA market entry challenge depends directly on how entrenched the approved
        complement inhibitor standard of care is; current penetration and payer contracts
        inform the switching cost Kriya faces.
      diligencePath: >-
        Pull Apellis and Astellas quarterly earnings calls and annual reports for
        Syfovre/Izervay net product revenue and patient metrics through 2025–2026.
      relatedQuestionRefs:
        - QP021

    - type: missing-source
      severity: minor
      topic: KRIYA-748 chemogenetic approach peer comparison
      missingEvidence: >-
        Comparative data on other AAV-based pain programs (e.g., Nav channel modulation
        programs for neuropathic pain) and how KRIYA-748's varenicline-gated approach
        compares on predicted safety, duration of effect, and regulatory complexity.
      whyItMatters: >-
        TN is a small market (~400,000 US+EU patients); competitive clarity helps
        investors understand whether KRIYA-748 is a niche asset or the vanguard of
        a broader pain gene therapy platform.
      diligencePath: >-
        Survey ClinicalTrials.gov for AAV neuropathic pain programs; review Redpin
        acquisition documents for preclinical data package.
      relatedQuestionRefs:
        - QP015

