callouts:
  - calloutType: strength
    title: Differentiated delivery technologies are Kriya's most defensible moat
    body: >-
      Among gene therapy peers in GA, Kriya's suprachoroidal delivery (Everads) and
      dual CR2-CR1 fusion protein are genuinely novel. No other GA gene therapy program
      currently combines suprachoroidal route with dual C3/C5 inhibition. If Phase 1/2
      data supports the safety and transduction profile, this combination could represent
      a durable technical advantage independent of the underlying AAV vector.
    claimRefs:
      - CP002
      - CP003
      - CP009
      - CP033

  - calloutType: risk
    title: Approved complement inhibitors and well-capitalized incumbents compress Kriya's window
    body: >-
      Syfovre and Izervay are entrenched in GA with payer coverage and specialist familiarity.
      JNJ-1887 (Janssen) and Complement Therapeutics are entering the gene-therapy lane.
      If either advanced-stage rival (especially Janssen, with pharma distribution) reaches
      approval first, Kriya faces a structurally harder market-entry problem than a standard
      first-mover gene therapy launch, including physician adoption, payer contracting,
      and center certification for suprachoroidal administration.
    claimRefs:
      - CP006
      - CP007
      - CP012
      - CP040
      - CP039

  - calloutType: insight
    title: Bluebird bio's collapse is a cautionary precedent for Kriya's commercial path
    body: >-
      Bluebird bio's decline from an $8.7B market cap in 2017 to near-distress (~$49M
      by mid-2025) underscores that in-house manufacturing, multi-program scope, and
      approved products are necessary but not sufficient for commercial success in gene
      therapy. Kriya's vertical integration story requires both clinical proof and
      reimbursement strategy to avoid the same execution risk.
    claimRefs:
      - CP028
      - CP037
      - CP038

