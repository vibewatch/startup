  evidenceGaps:
    - type: missing-source
      severity: material
      topic: T1D gene therapy competitors
      missingEvidence: >-
        Published clinical or IND-filing evidence for cell-therapy programs (Vertex VX-880,
        CRISPR Therapeutics/ViaCyte) and other T1D gene therapy approaches as direct
        competitors to KRIYA-839.
      whyItMatters: >-
        Without a full T1D competitive map, the investor cannot assess whether KRIYA-839
        faces first-mover advantage or an already-crowded cell/gene therapy field.
      diligencePath: >-
        Pull ClinicalTrials.gov search for T1D gene therapy and islet cell therapy trials;
        review Vertex VX-880 Phase 1/2 data releases from 2024–2026.
      relatedQuestionRefs:
        - QP003

    - type: private-evidence-only
      severity: material
      topic: Kriya manufacturing cost and yield
      missingEvidence: >-
        Actual batch-to-batch manufacturing yields, cost-per-dose, and regulatory CMC
        filing data supporting Kriya's claim of industry-leading manufacturing quality
        and productivity at 3,000L scale.
      whyItMatters: >-
        The manufacturing moat is central to Kriya's competitive differentiation narrative;
        without independent validation, investors cannot weight it against CDMO-dependent
        peers or uniQure's Lexington facility.
      diligencePath: >-
        Request IND-stage CMC sections or manufacturing validation reports in due diligence;
        benchmark cost-per-dose estimates against public CDMO rate cards.
      relatedQuestionRefs:
        - QP010
        - QP014

