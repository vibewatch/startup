company:
  name: Kriya Therapeutics
chapter:
  number: 3
  title: Competitors
  summary: >-
    Kriya Therapeutics competes in three overlapping arenas: ocular gene therapy for geographic
    atrophy (GA), where FDA-approved complement inhibitors Syfovre and Izervay set the
    standard of care and Complement Therapeutics plus Janssen are the nearest gene-therapy
    rivals; metabolic disease (MASH and T1D), where approved small-molecules and cell
    therapies define the benchmark; and trigeminal neuralgia, where anticonvulsants and
    neurosurgery remain the only recourse. Kriya differentiates on its three-therapeutic-area
    AAV platform and in-house cGMP manufacturing at 3,000L scale, but as of June 2026 it
    lacks an approved product and has limited public clinical data relative to its >$920M
    capital base, a gap flagged by independent observers.

sections:
  - id: approved-ga-incumbents
    title: Approved GA standard-of-care — the principal displacement target
    body: >-
      Geographic atrophy (GA) is the indication most central to Kriya's near-term investment
      case, and two FDA-approved complement inhibitors define the status quo Kriya must
      displace. Syfovre (pegcetacoplan, Apellis Pharmaceuticals) is a C3 inhibitor administered
      as monthly or bimonthly intravitreal injection; Izervay (avacincaptad pegol, Astellas)
      is a C5 inhibitor administered monthly by intravitreal injection. Both provide
      clinically-meaningful but incomplete slowing of GA lesion growth; neither halts disease
      progression nor eliminates the need for repeated physician-administered injections.
      This creates the market opening Kriya targets: a one-time suprachoroidal AAV gene
      therapy (KRIYA-825) that delivers continuous complement inhibition without recurrent
      injections. The displacement logic is mechanistically sound, but Syfovre and Izervay
      benefit from years of real-world safety data, established payer relationships, specialist
      physician familiarity, and commercial distribution infrastructure that Kriya has not
      yet built. The switching-cost for retina specialists who have integrated bimonthly
      injection schedules for existing patients is also non-trivial; a gene therapy entrant
      must demonstrate durable efficacy and a clean safety profile before payers and
      physicians re-route patients. For thyroid eye disease (TED), the comparable incumbent
      is the intravenously administered anti-IGF1R monoclonal antibody — the only FDA-approved
      TED therapy — which requires multiple IV infusions at infusion centers. KRIYA-586
      targets the same IGF1R pathway via a single peribulbar AAV injection, offering local
      expression and reduced systemic exposure if clinical data support the mechanism.
