      severity: material
      topic: KRIYA-825 vs CTx001 dual-pathway mechanism head-to-head
      missingEvidence: >-
        Independent comparative analysis or preclinical data directly comparing KRIYA-825's
        dual C3+C5 CR2-CR1 fusion protein against CTx001's single mini-CR1 in terms of
        complement inhibition depth, durability, and retinal cell penetration.
      whyItMatters: >-
        The mechanistic superiority claim for dual C3+C5 targeting over single CR1 is
        the primary clinical differentiation argument; without data it remains unverified.
      diligencePath: >-
        Review conference abstracts and publication pipeline from Kriya's scientific
        founders; request preclinical NHP studies comparing biomarker outcomes.
      relatedQuestionRefs:
        - QP012
        - QP025

    - type: missing-source
