companyProfile:
  summary: >
    Krutrim is a Bengaluru-based sovereign AI company building a broad India-focused stack across AI cloud
    infrastructure, multilingual and multimodal models, maps, and workflow products. Public evidence confirms a December
    2023 public launch, a January 2024 $50 million unicorn round, and a February 2025 founder-backed funding package of
    roughly $230 million, alongside a growing cloud and developer surface. The same public evidence still leaves exact
    current valuation, recurring revenue quality, customer durability, governance depth, and workload-level economics
    materially under-disclosed.
