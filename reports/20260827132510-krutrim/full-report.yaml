  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Founder capital and execution concentration
        blocks:
          - type: paragraph
            body: >-
              Krutrim’s biggest visible risk is concentration around founder capital, founder narrative, and
              founder-driven execution. The public record supports that Bhavish Aggarwal remains the central strategic
              sponsor, that the 2025 funding package was founder-backed, and that the company is building across cloud,
              models, maps, assistants, and future silicon ambitions in parallel. That concentration can be a strength
              when speed matters, but it also means that strategic drift or capital-allocation mistakes can echo across
              the whole stack. Public adverse reporting and shutdown coverage increase that concern. The Times of India
              reality-check story argues that external customer depth remains thinner than the narrative suggests, while
              2026 shutdown coverage around the Kruti assistant indicates that not every product experiment is sticking.
              When a company attempts a full-stack sovereignty story, product reversals matter because they hint at
              prioritization strain, not only ordinary iteration. The key risk is therefore not simply key-man
              dependency; it is that sponsor capital and founder conviction may let the company carry too many bets
              simultaneously before the market proves which layers deserve sustained investment.
            claimRefs:
