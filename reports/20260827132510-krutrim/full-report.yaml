      - number: '1.2'
        title: Founder Control, Leadership Surface, and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Bhavish Aggarwal is the unmistakable center of gravity in every fetched public source. He is the founder,
              the voice behind the largest funding announcements, the face of product launches, and the person most
              clearly associated with Krutrim's national-sovereignty narrative. Public materials also surface some
              second-line technical leadership, including Gautam Bhargava on AI engineering and Sambit Sahu on silicon
              ambitions, but they do not provide a board roster, independent-governance explanation, committee
              structure, or decision-rights detail comparable to what a late-stage investor would want. The result is a
              classic mixed picture. Founder-market fit is strong because Aggarwal can align capital, Ola-group demand,
              and India-tech narrative quickly. Governance visibility is weak because the same evidence set does not
              explain how risk is checked, how priorities are set below the founder level, or what happens if strategy
              narrows under capital pressure. That leadership concentration is not fatal, but it raises execution and
              key-person dependence across every later chapter.
            claimRefs:
              - CO002
