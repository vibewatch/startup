appendices:
  - id: A
    title: Investment committee framing
    blocks:
      - type: paragraph
        body: >
          Krutrim should be treated as a strategically important India AI asset whose public evidence supports curiosity
          and continued diligence, but not relaxed price discipline.
        claimRefs:
          - CV031
          - CV039
      - type: callout
        title: Entry discipline matters more than narrative participation
        calloutType: recommendation
        body: >
          If entry is near a reported ~$2B neighborhood, structure, milestones, and reporting rights matter more than
          simply getting exposure to the story.
        claimRefs:
          - CV031
          - CV034
          - CV035
      - type: list
        items:
          - Verify the exact 2025 price and instrument mix before accepting any headline valuation at face value.
          - Prioritize external customer depth and unit-economics diligence ahead of additional product demos.
          - Treat governance broadening as a real value driver, not a soft qualitative preference.
        claimRefs:
          - CV035
          - CV036
          - CV038
          - CV040
