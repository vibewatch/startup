      - number: '3.3'
        title: Global Substitutes and Open-Ecosystem Pressure
        blocks:
          - type: paragraph
            body: >-
              Krutrim's moat is also pressured by suppliers and substitutes that are not direct Indian startups. Google,
              Azure, and AWS already support broad language stacks and enterprise distribution. Open-source assets such
              as IndicTrans2 and other multilingual models lower the cost of assembling localized workflows without
              depending on one domestic vendor. BharatGen and AI4Bharat add public and research supply that can diffuse
              key capabilities into the ecosystem. The practical result is that Krutrim does not own 'Indian-language
              AI' as a category. Its best case is not exclusivity, but packaging: local cloud, local data posture,
              curated model access, enterprise support, and adjacent products like maps. That is still commercially
              meaningful, especially for buyers who care about data residency or integrated local support. But it is a
              packaging moat, not a pure research moat, and packaging moats erode quickly if pricing, uptime, or
              deployment proof are weak. That framing keeps the conclusion disciplined: Krutrim can still win meaningful
              accounts, but it cannot assume scarcity where substitutes are already abundant.
            claimRefs:
              - CP018
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
