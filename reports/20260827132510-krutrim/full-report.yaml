              The last risk cluster is the one most likely to break the investment thesis if it persists: Krutrim may be
              building a large strategic platform before it has shown durable third-party revenue quality. Public
              evidence gives multiple reasons to take that seriously. The company has list pricing and adoption signals,
              but no public ARR, gross-margin, burn, NRR, or concentration disclosure. The Company Check page reports
