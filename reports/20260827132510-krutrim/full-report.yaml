      - number: '8.4'
        title: Recommendation and final diligence
        blocks:
          - type: paragraph
            body: >-
              The right recommendation is price-sensitive: structured only or research more if entry is being discussed
              near a reported ~$2 billion neighborhood, with the caveat that public evidence on that exact mark is
              weaker than evidence on the funding amount. Krutrim could become a major sovereign-AI platform, but
              investors should not pay as if product breadth, customer durability, and capital efficiency are already
              demonstrated. A disciplined investor would want downside protection, reporting rights, and explicit
              milestones around external customer proof, utilization, gross margin by workload, and governance
              broadening beyond founder centrality. If those conditions are met—or if price moves materially lower—the
              thesis becomes more interesting. If not, the current public package asks buyers to underwrite too much
              optionality too early. Said differently: the burden is now on evidence, not on imagination. Price
              discipline should outrank fear of missing out.
