      - number: '4.2'
        title: Revenue surfaces and monetization design
        blocks:
          - type: paragraph
            body: >-
              Krutrim does have real monetization surfaces. The public site and pricing pages show a mix of compute
              monetization, AI-model access, maps APIs, contact-center software, and sales-led enterprise solutions. The
              AI cloud pages position A100 and H100 GPU capacity, AI Pods, bare metals, object storage, and deployment
