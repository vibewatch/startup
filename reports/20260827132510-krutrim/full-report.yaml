      - number: '1.4'
        title: Milestones, Scale Signals, and Open Cautions
        blocks:
          - type: paragraph
            body: >-
              Krutrim's milestone arc is undeniably fast: public launch in late 2023, unicorn status in early 2024,
              cloud commercialization in mid-2024, DeepSeek-on-Indian-servers positioning in early 2025, and AI Lab plus
              GB200 supercomputer claims shortly after. Official and media surfaces add additional top-line signals such
              as 500+ teams on the platform, Ola-group workload migration, 25,000 developers, 250 billion API calls, and
              separate mapping or language products. But the same corpus also shows why the company still needs deeper
              diligence. Many of the most impressive usage metrics are company-originated rather than independently
              audited. Several ambitions, especially chips and frontier-model competitiveness, are framed
              aspirationally. And adverse reporting from September 2025 argues that Krutrim's original all-layers thesis
              had already narrowed materially toward cloud, with heavy dependence on founder capital and internal Ola
              demand. The right takeaway is not that Krutrim lacks strategic significance; it is that public evidence
              supports a strong strategic narrative faster than it supports a fully verified business-quality narrative.
