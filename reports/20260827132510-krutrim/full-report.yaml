  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Strategic premium exists, but proof still lags price
        blocks:
          - type: paragraph
            body: >-
              Krutrim deserves a strategic premium because it is not just another application startup. It is trying to
              build India-resident cloud infrastructure, multilingual models, and a broader sovereign-AI stack at a time
              when the market and policy environment both favor local capability. The $50 million 2024 round at a $1
              billion valuation and the much larger 2025 founder-backed funding package show that capital markets and
              sponsors are willing to fund that narrative aggressively. But the public evidence still stops far short of
              proving a clean software or infrastructure underwriting case. There is no public ARR, gross margin, burn,
              NRR, or workload-level unit economics. Public customer proof is real but shallow. And the exact implied
              2025 valuation is less cleanly supported than the funding amount itself. This means any premium today is
              largely for strategic scarcity, founder support, and future platform relevance—not for disclosed
              recurring-economics proof. That distinction between strategic relevance and price-clearing proof is the
              core valuation discipline point for this report.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV013
              - CV018
      - number: '8.2'
        title: Comparable context and current price discipline
        blocks:
          - type: paragraph
            body: >-
              The comp set supports both upside and caution. On the upside, sovereign or independent model builders such
              as Mistral, Cohere, Aleph Alpha, Sarvam, and other frontier-AI assets show that investors will pay heavily
              for scarcity, distribution optionality, and national or enterprise relevance. On the caution side, those
              same companies generally offer either stronger frontier-model proof, clearer customer traction, deeper
              financing ecosystems, or better disclosure than Krutrim currently does in public. Analyst-market data on
              Indian AI opportunity is helpful because it explains why investors are willing to pay for the category,
              but category growth does not itself clear company-specific price. The practical comparison is therefore
              not whether Krutrim is ‘important,’ but whether the public evidence already supports paying for multiple
              future layers of success at once. At the run date, it does not. The company can be strategically valuable
              and still be full on price if the entry assumes that cloud utilization, model differentiation, and
              third-party customer depth all materialize on schedule.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
