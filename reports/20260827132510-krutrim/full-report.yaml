  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Krutrim's market should be defined as an overlapping stack, not a single TAM line item. The company's
              current surface includes GPU cloud, hosted models, AI Studio, language services, contact-center
              automation, and India-focused mapping APIs. That means the relevant spend pools include AI infrastructure,
              model inference and fine-tuning, multilingual language tooling, developer cloud, and selected enterprise
              workflow budgets. What should be excluded is equally important: generic consumer-chat usage,
              undifferentiated public cloud spend with no localization requirement, and traditional IT services revenue
              that would accrue to integrators rather than the platform owner. The practical implication is that Krutrim
              sits in a strategically attractive wedge where sovereignty, data locality, and Indian-language support can
              matter, but it also sits in a hard-to-size wedge because those needs cut across several broader market
              categories rather than appearing as a clean standalone analyst segment. The right diligence posture is to
              use multiple market lenses, not one headline TAM number.
