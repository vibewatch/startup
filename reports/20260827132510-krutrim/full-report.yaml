  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A Layered Competitive Set, Not a Single Rival
        blocks:
          - type: paragraph
            body: >-
              Krutrim does not compete with one obvious mirror-image company. It competes across at least four layers:
              domestic sovereign-AI peers such as Sarvam; workflow and conversational incumbents such as
              CoRover/BharatGPT; public-good and open ecosystem builders such as AI4Bharat, IndicTrans2, and BharatGen;
              and global clouds that already support many Indian-language workflows. This matters because buyers are not
              choosing only among model labs. They are choosing among packaged deployment models, localization depth,
              cloud control, and workflow convenience. Krutrim's public evidence is deepest on domestic infrastructure,
              developer tooling, and cloud commercialization. That gives it a differentiated angle, but it also means
              its most direct rivals differ by layer rather than by exact product catalog. The key diligence implication
              is that investors should evaluate Krutrim as a stack-positioning company: it must win enough value across
              cloud, models, and applied tools to justify buying its bundle instead of combining alternatives.
            claimRefs:
