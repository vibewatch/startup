  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Capital base and balance-sheet signals
        blocks:
          - type: paragraph
            body: >-
              Krutrim’s capital story is unusually visible for a private Indian AI company even though operating
              disclosures remain sparse. The January 2024 round established the company as India’s first AI unicorn at a
              $1 billion valuation, while February 2025 coverage described a far larger Rs 2,000 crore (about $230
              million) founder-backed commitment aimed at building a frontier AI lab, supercomputer capacity, and
              broader sovereign-AI infrastructure. The Company Check page adds balance-sheet color that normal startup
              press does not: as of the latest MCA-derived snapshot it shows paid-up capital of roughly Rs 306.79 crore,
              authorized capital of Rs 306.99 crore, and open charges of Rs 210 crore, alongside FY2025 financial
              statements filed with ROC Bangalore. Those figures do not tell us cash on hand, but they do reinforce that
              Krutrim is being capitalized as an infrastructure-heavy build rather than as a capital-light application
              startup. The underwriting implication is straightforward: this company likely has enough sponsor backing
              to continue building, but public evidence also shows financing dependence, formal obligations, and a
              still-thin buffer of disclosed recurring operating performance.
            claimRefs:
