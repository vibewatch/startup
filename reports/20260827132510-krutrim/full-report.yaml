      - number: '2.3'
        title: Demand Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case for Krutrim is real. PIB and BCG materials show rapid AI adoption in India, major public
              investment through IndiaAI Mission, and broad enterprise interest in production use cases. India-specific
              language diversity and local data concerns add a genuine structural reason for domestic AI infrastructure
              and multilingual model tooling. Krutrim's own product mix fits those drivers well: GPU access, hosted
              models, language tools, and workflow surfaces can all benefit from a 'built in India, for India' angle.
              But the adoption constraints are just as important. Buyers can still reach many underlying capabilities
              through hyperscalers, open-source stacks, or direct global-model APIs. Public evidence also suggests that
              commercialization may be services-heavy, that independent model verification remains limited, and that
              hardware dependence on Nvidia and imported components constrains true sovereignty. The market is
              attractive, but it is not protected. Krutrim has to win on total solution value, trust, localization, and
              execution speed—not just on patriotic positioning.
            claimRefs:
