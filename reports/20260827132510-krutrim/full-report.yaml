              - CP020
              - CP025
              - CP028
      - number: '3.4'
        title: Switching Costs, Lock-In, and Moat Durability
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Krutrim's switching costs are still being built rather than already entrenched.
              The company has credible ingredients for stickiness—developer docs, Terraform tooling, AI Pods, maps,
              language APIs, and India-resident infrastructure—but many of those layers are inherently multi-homable.
              Developers can move workloads between clouds if orchestration and data gravity are not yet deep;
              enterprises can mix global models with domestic hosting; workflow buyers can adopt application-layer
              vendors without buying lower-stack infrastructure from Krutrim. The main durable advantages would come
              from three things: price-performance on local compute, enterprise proof in regulated workloads, and
              integrated cross-product value that is annoying to unwind. The main erosion risks are equally clear:
              open-source capability growth, hyperscaler language support, foreign hardware dependence, and a still-thin
              public record on retention or win rates. At the run date, Krutrim looks competitively relevant, but not
              yet competitively locked in. The diligence bar should therefore be real operating leverage and retention
              proof, not just a broad public product catalog.
            claimRefs:
              - CP027
              - CP028
              - CP029
              - CP030
              - CP031
              - CP032
              - CP036
