      - number: '1.3'
        title: Capital Base, Stakeholders, and Strategic Backers
        blocks:
          - type: paragraph
            body: >-
              Krutrim's capital story is one of the most important diligence distinctions in the file. The January 2024
              round is well corroborated as a $50 million financing at a $1 billion valuation led by Matrix Partners
              India. The February 2025 capital package is more complicated. Business Standard, The Economic Times,
              TechCrunch, CNBC TV18, and BusinessWire all support a large Bhavish Aggarwal-backed financing commitment
              around $230 million or ₹2,000 crore, but they frame it as founder-backed funding, at least partly
              debt-linked, and not as a clean institutional re-pricing round with fully disclosed terms. That still
              gives Krutrim a far larger committed capital base than many Indian peers, yet it also means investors
              should separate 'capital available or committed' from 'externally priced follow-on validation.' Strategic
              stakeholders extend beyond pure venture capital: Nvidia is central to supercomputing claims, Ola-group
              workloads appear central to cloud demand, and government sovereign-AI policy creates a favorable narrative
              backdrop even without an explicit public procurement ledger in hand.
