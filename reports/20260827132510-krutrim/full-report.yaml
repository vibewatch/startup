    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Platform Surface, and Current Positioning
        blocks:
          - type: paragraph
            body: >-
              Krutrim's public identity has evolved from a December 2023 India-focused LLM launch story into a broader
              claim to be an AI-first cloud platform for India. The company's current home page, cloud page, and
              documentation emphasize AI infrastructure, data residency, SOC 2 positioning, GPU access, AI Studio, and
              developer tooling at least as much as foundational-model rhetoric. That matters because the public
              commercial surface now looks more like an infrastructure and platform company than a pure frontier-model
              lab. Krutrim still markets itself as part of a sovereign, full-stack Indian AI stack, but the strongest
              directly inspectable evidence on the run date is operational packaging around cloud compute, models, maps,
              language tooling, and enterprise onboarding. The product span is meaningful because it gives later
              chapters a reusable baseline: Krutrim is not just a chatbot or one-model experiment. It is trying to
              assemble an India-native compute, model, and application stack, even though later adverse reporting raises
              questions about which layers remain strategic priorities in practice.
