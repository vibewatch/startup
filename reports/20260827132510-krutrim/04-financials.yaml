    - Rupee-denominated list pricing visible
    - Krutrim is willing to compete on transparent infrastructure acquisition
    - List price may differ materially from enterprise realization
    - SI018/SI004
  - - DeepSeek / model promotions
    - Low promotional entry pricing cited in launch coverage
    - Krutrim is using price to accelerate experimentation and traffic
    - Promotion does not prove sustainable contribution margin
    - SI016/SI020
  - - Maps APIs
    - Commercial APIs positioned but full list pricing not always public
    - Adjacency revenue may rely on enterprise packaging
    - Unclear monetization split between self-serve and contract sales
