- id: revenue-surfaces-and-monetization-design
  title: Revenue surfaces and monetization design
  body: Krutrim does have real monetization surfaces. The public site and pricing pages show a mix of compute monetization, AI-model access, maps APIs, contact-center software, and sales-led enterprise solutions. The AI cloud pages position A100 and H100 GPU capacity, AI Pods, bare metals, object storage, and deployment tooling; the pricing surface exposes list prices in rupees for selected infrastructure and model offers; and the broader site describes maps, language tools, and workflow products that can be sold either self-serve or through enterprise contracts. That matters because many sovereign-AI narratives stop at model releases, whereas Krutrim is clearly trying to collect revenue at multiple layers of the stack. But the public record also limits what can be concluded. List prices are not realized prices, promotional pricing is not gross margin, and developer signups are not the same as durable paid consumption. Public materials support the existence of revenue pathways, not the quality
    of the revenue mix.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
