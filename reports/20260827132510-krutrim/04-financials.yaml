tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public unit / pricing surface
  - Current status
  - Revenue quality lens
  - Diligence ask
  rows:
  - - GPU / cloud compute
    - Hourly or workload-based infrastructure usage
    - Public list pricing on pricing and cloud pages
    - Visible self-serve surface
    - Could become recurring if workloads remain in production
    - Paid utilization by cluster and enterprise cohort
  - - Model inference / hosted AI
    - Token- or request-based AI consumption
    - Promotional and list pricing visible for selected offers
    - Visible but incomplete catalog
    - Attractive only if inference cost falls faster than realized price
    - Paid mix by model family and gross margin by token class
  - - Maps APIs
    - Usage-based API monetization plus enterprise bundles
    - Maps positioned as enterprise-ready API suite
    - Productized surface exists
    - Could support sticky adjacency if adopted with cloud
    - API volume, paid accounts, and attach rate to other products
  - - Contact-center AI / workflow software
    - Seat, usage, or contract-based enterprise sales
    - Sales-led packaging rather than public fixed pricing
    - Enterprise-led
    - May mix services with recurring software
    - Contract structure and share of implementation revenue
  - - Language hub / translation workflows
    - API or enterprise workflow monetization
    - Product surface visible, pricing less complete
    - Early public surface
    - Could broaden revenue mix beyond infra
    - Active customers and retention by workflow
  - - Internal Ola-group workloads
    - Intercompany usage or transfer-pricing equivalent
    - No public economics
    - Confirmed strategic demand source
    - Good for early utilization but weak as external revenue proof
    - Share of revenue from group entities vs third parties
  notes: This table distinguishes visible monetization pathways from disclosed revenue. Public sources prove the former, not the latter.
