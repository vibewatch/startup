  - CI026
  - CI027
  - CI028
- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public signal
  - Why it matters
  - Limitation
  - Diligence ask
  rows:
  - - 2024 equity round
    - $50M at $1B valuation
    - Established Krutrim as a high-expectation AI asset early
    - Does not reveal use-of-funds efficiency
    - Ask how much of the 2024 capital remains deployed vs committed
  - - 2025 founder-backed funding package
    - Rs 2,000 crore / ~$230M announced
    - Creates large near-term build budget for cloud and frontier lab
    - Founder-backed package is not the same as diversified institutional support
    - Clarify instrument mix, funding schedule, and conditions
  - - Paid-up capital
    - ~Rs 306.79 crore on MCA-derived page
    - Shows formal capital base, not just press claims
    - Snapshot is not a cash balance
    - Obtain statutory filings and bank/cash schedule
  - - Open charges
    - Rs 210 crore shown on MCA-derived page
    - Suggests formal borrowing or secured obligations exist
    - Counterparty and covenant detail not public
    - Review charge documents and lender terms
  - - FY2025 filings on record
    - Financial statements filed with ROC Bangalore
    - Indicates at least a filing trail exists for diligence
    - Statements themselves are not publicly unpacked here
    - Obtain filed P&L, balance sheet, and cash-flow statements
  notes: Capital adequacy looks directionally strong but still underexplained because detailed statutory accounts were not publicly retrievable in full.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI008
- id: TI005
  title: Public financial gaps table
  columns:
  - Missing evidence
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Revenue split between third-party and Ola-group demand
    - High—internal usage may overstate external market fit
    - Request customer-by-customer revenue mix and transfer-pricing policy
  - - Realized pricing versus list pricing
    - High—margin and customer quality cannot be inferred from catalog rates
    - Request top 20 contracts, discount ladders, and cohort ASP trends
  - - Gross margin by workload
    - Critical—cloud and model hosting economics may differ sharply
    - Request workload-level cost accounting including GPU, storage, power, and support
  - - Burn, capex, and runway
    - Critical—capital intensity is the main finance risk
    - Request monthly cash bridge, capex plan, and runway forecast
  - - Charge documentation and debt obligations
    - High—secured obligations affect downside protection and flexibility
    - Review charge filings, covenants, and lender priorities
  - - Retention and expansion metrics
    - High—without retention, cloud demand may be transient
    - Request GRR/NRR, logo churn, and expansion by cohort
  notes: These are the minimum finance requests needed before treating Krutrim as more than a strategic option on Indian sovereign AI.
