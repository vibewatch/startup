    - Support, sales, and onboarding surfaces are visible
    - GTM is not purely self-serve
    - Services content may blur software economics
    - SI006/SI007
  - - Workload migration savings
    - Homepage claims <30% lower infrastructure cost for migrated workloads
    - Could imply internal cost advantage and reference value
    - Savings claim is company-reported and may reflect internal baseline
    - SI002/SI003
