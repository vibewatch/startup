- id: cost-structure-utilization-and-disclosure-gaps
  title: Cost structure, utilization, and disclosure gaps
  body: 'The most important financial unknown is not top-line ambition but cost discipline. Krutrim is explicitly building GPU cloud, model hosting, and frontier-model capability in a market where imported hardware, power, datacenter operations, and inference optimization determine whether revenue becomes margin or merely subsidized usage. Public evidence gives several useful but incomplete signals: the homepage claims thousands of VMs, petabytes migrated, and infrastructure-cost reductions for Ola-group workloads; AI cloud marketing cites 3 data centres and 1000+ clusters; and external coverage on DeepSeek hosting and the frontier lab frames Krutrim as a serious infrastructure operator rather than a thin wrapper. Yet none of the reviewed sources disclose revenue, ARR, gross margin, burn, monthly opex, GPU utilization, customer acquisition cost, payback, NRR, or working-capital behavior. Without those inputs, even plausible throughput or deployment claims cannot be translated into financeable
    software economics. The right conclusion is that utilization may be improving, but public materials do not let an outside investor determine whether Krutrim’s cloud and model businesses are yet attractive on a contribution-margin basis.'
