- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Exact diligence ask
  rows:
  - - Revenue / ARR
    - Not publicly disclosed
    - low
    - Without revenue, no valuation or payback underwriting is possible
    - Provide monthly recurring revenue, non-recurring revenue, and ARR bridge
  - - Gross margin
    - Not publicly disclosed
    - low
    - GPU-heavy businesses can grow quickly while destroying value
    - Provide gross margin by compute, model, maps, and services workload
  - - Burn / monthly opex
    - Not publicly disclosed
    - low
    - Capital adequacy depends on operating burn, not funding headlines
    - Provide historical and forward monthly burn
  - - Runway
    - Not publicly disclosed
    - low
    - Founding capital is meaningful but runway cannot be inferred cleanly
    - Provide cash on hand, committed funding, and minimum cash thresholds
  - - GPU utilization
    - Not publicly disclosed
    - low
    - Utilization drives capital efficiency and realized gross margin
    - Provide utilization by cluster and reserved vs on-demand mix
  - - CAC / payback
    - Not publicly disclosed
    - low
    - Needed to judge whether transparent pricing creates efficient acquisition
    - Provide sales efficiency by segment and channel
  - - Retention / NRR
    - Not publicly disclosed
    - low
    - Cloud stickiness is central to long-term value
    - Provide GRR, NRR, and churn by cohort
  notes: Every field is kept explicit as unavailable rather than guessed from traffic or funding headlines.
