  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: statutory-financials
    missingEvidence: Full FY2025 and FY2026 statutory statements, management accounts, and cash position.
    whyItMatters: Without these documents, runway, revenue quality, and capital adequacy cannot be underwritten.
    diligencePath: Obtain audited statements, monthly management reporting, and board-level cash forecasts.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI023
    relatedTableRefs:
    - TI003
    - TI004
  - type: private-evidence-only
    severity: critical
    topic: workload-margins
    missingEvidence: Gross margin and utilization by compute, model, maps, and services workload.
    whyItMatters: Infrastructure-heavy AI businesses can show usage growth while still generating poor contribution economics.
    diligencePath: Request workload-level unit economics and GPU utilization by cluster/cohort.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI024
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-revenue-mix
    missingEvidence: Split between Ola-group demand and third-party external revenue.
    whyItMatters: Internal adoption helps utilization but is not equivalent to broad commercial market validation.
    diligencePath: Request customer concentration report and transfer-pricing or intercompany revenue policy.
    relatedQuestionRefs:
    - QI013
    - QI014
    - QI023
    relatedTableRefs:
    - TI001
    - TI005
