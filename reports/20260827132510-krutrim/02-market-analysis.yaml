tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Why it matters for Krutrim
  rows:
  - - AI infrastructure cloud
    - GPU compute, AI Pods, storage, networking, hosted model runtime
    - Commodity non-AI VM spend with no localization or AI requirement
    - Developers, startups, enterprise infra teams
    - This is Krutrim’s clearest directly inspectable product wedge.
  - - Model access and AI Studio
    - Inference, fine-tuning, evaluation, BYOM, hosted open-source models
    - Pure consumer chatbot usage with no API or deployment component
    - Product, engineering, data-science budgets
    - Krutrim can bundle models with local infrastructure.
  - - Multilingual language services
    - Translation, speech, transcription, localization, sentiment and summarization
    - Generic monolingual NLP tools where Indian-language support is irrelevant
    - CX, operations, support, content teams
    - Indian-language differentiation is central to the India thesis.
  - - Customer experience AI
    - Contact-center agents, support automation, fraud alerts, analytics
    - Generic BPO labor contracts not tied to Krutrim software
    - Support leaders, CIOs, operations
    - Turns infrastructure and language assets into workflow budgets.
  - - Location intelligence for India
    - Maps APIs, routing, places, SDKs, mobility analytics
    - Offline mapping or non-India geospatial services
    - Mobility, logistics, delivery, fintech, insurance
    - Expands Krutrim beyond model APIs into applied platforms.
  - - Public-sector sovereign AI
    - India-resident compute, multilingual citizen-service workflows, trusted hosting
    - General IT modernization spend with no AI layer
    - Mission budgets, digital-governance programs, regulated entities
    - Sovereignty and localization can shift buying criteria in Krutrim’s favor.
  notes: The boundary is intentionally wider than a single LLM market because Krutrim sells overlapping infrastructure, model, and application surfaces.
