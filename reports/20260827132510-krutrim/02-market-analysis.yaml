- id: TM005
  title: Status-quo substitutes and adjacency table
  columns:
  - Alternative
  - Why buyers choose it
  - Where it beats Krutrim
  - Where Krutrim can differentiate
  - Implication
  rows:
  - - Global hyperscaler AI clouds
    - Broad tooling, reliability, enterprise familiarity
    - Scale, ecosystem depth, mature channels
    - India data-locality story, local support, Indic focus
    - Krutrim must sell more than patriotic branding
  - - Open-source self-hosted stack
    - Model flexibility and lower software lock-in
    - Avoids platform dependency
    - Can simplify deployment and offer India-resident managed infrastructure
    - Managed-service value must exceed DIY economics
  - - Specialized translation or speech APIs
    - Best-of-breed narrow functions
    - May outperform on specific tasks or global support
    - Krutrim can bundle cloud, language, and workflow tools together
    - Bundle economics matter
  - - Status-quo BPO / contact-center tools
    - Established vendor relationships and workflows
    - Operational familiarity and procurement history
    - Krutrim can add automation and multilingual AI on top
    - Selling motion may be transformation-heavy
  - - Domestic competitor platforms
    - Closer sovereign-AI narrative fit than global clouds
    - Can match language or regulatory positioning
    - Krutrim can differentiate with compute + maps + cloud bundle
    - Domestic rivalry compresses pricing and moat
  notes: Krutrim’s opportunity exists because many buyers still choose between localization, convenience, and incumbent ecosystems rather than just benchmark scores.
