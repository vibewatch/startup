- id: buyers-users-and-adoption-path
  title: Buyer Segments, Budget Owners, and Adoption Path
  body: Krutrim's buyer map starts with developers and startups but should not end there. The self-serve surface—quickstart docs, AI Pods, rupee pricing, and model access—lowers experimentation friction for individual builders and smaller teams. At the same time, the official support flow, contact-center AI messaging, language hub use cases, maps positioning, and enterprise onboarding cues all point toward larger budgets in BFSI, customer support, logistics, mobility, public-sector service delivery, and regulated enterprises. In many of those cases the user and payer are different. Developers, data teams, and product managers may trial the platform, but CIO, CTO, operations, digital-transformation, or business-unit budgets likely own scaled production decisions. That split matters because Krutrim's path to revenue probably moves from developer-led experimentation into enterprise or group-scale contracts, and the public evidence is much stronger on the first part of that journey than on the
    second. A key diligence task is measuring how much bottom-up usage truly converts into paid, durable institutional spend.
  claimRefs:
