- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Why it matters
  - Timing
  - Diligence ask
  rows:
  - - IndiaAI Mission and public compute push
    - Positive
    - Expands domestic AI infrastructure legitimacy and supply
    - Current
    - What portion of Krutrim demand comes from sovereign-compute procurement or policy alignment?
  - - Enterprise AI adoption in India
    - Positive
    - PIB and BCG indicate widespread experimentation and scaled maturity
    - Current
    - Which Krutrim verticals have repeatable paid use cases today?
  - - Indian-language diversity
    - Positive
    - Localization and multilingual support increase value of domestic platforms
    - Current
    - How much usage is truly language-driven versus generic cloud demand?
  - - Self-serve onboarding and rupee pricing
    - Positive
    - Lower-friction trial path can accelerate developer acquisition
    - Current
    - What share of developer signups converts into recurring paid workloads?
  - - Hyperscalers and open-source models
    - Negative
    - Buyers can source many capabilities elsewhere
    - Current
    - Where does Krutrim win on total cost or control versus global stacks?
  - - Hardware import dependence
    - Negative
    - Nvidia and other foreign hardware remain critical inputs
    - Current
    - What gross-margin and supply-risk exposure comes from imported compute?
  - - Model-verification and proof gaps
    - Negative
    - Independent benchmark and customer proof still lag narrative
    - Near-term
    - Which deployments or third-party evaluations can be independently verified?
  - - Services-heavy enterprise selling
    - Negative
    - Large contracts may require long implementation cycles and custom work
    - Current to medium-term
    - What mix of revenue is usage-based versus services or internal group demand?
  notes: The bull case combines sovereign demand, localization, and easier developer onboarding; the bear case is commoditization plus execution-heavy enterprise sales.
