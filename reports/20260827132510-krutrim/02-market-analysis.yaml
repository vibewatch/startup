  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam-gap
    missingEvidence: Segmented pipeline, booked revenue, and customer counts by cloud, models, maps, and enterprise workflow line.
    whyItMatters: Without product-line data, public TAM lenses cannot be converted into a credible Krutrim-specific SAM or SOM.
    diligencePath: Request product-level revenue bridge, pipeline segmentation, and top-use-case conversion cohorts.
    relatedQuestionRefs:
    - QM010
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: conversion-gap
    missingEvidence: Developer-to-paid conversion, usage-to-contract conversion, and retention by segment.
    whyItMatters: Bottom-up demand signals are only valuable if they convert into durable revenue.
    diligencePath: Request signup cohorts, activation rates, paid conversion, and expansion metrics for self-serve and enterprise channels.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM006
  - type: enumeration-incomplete
    severity: minor
    topic: buyer-map
    missingEvidence: Named public-sector and regulated-enterprise customers by workload and budget owner.
    whyItMatters: Buyer segmentation is plausible, but public proof is still sparse outside broad company messaging.
    diligencePath: Request customer references, proposal logs, and public procurement disclosures.
    relatedQuestionRefs:
    - QM015
    relatedTableRefs:
    - TM003
  - type: conflicting-data
    severity: material
    topic: market-forecast-dispersion
    missingEvidence: A management view reconciling broad AI market estimates with Krutrim’s narrower monetizable wedge.
    whyItMatters: Wide-ranging external TAM figures can encourage over-valuation if management does not reconcile them to actual go-to-market scope.
    diligencePath: Ask management to map each product line to a bottom-up market model and attach realized pricing.
    relatedQuestionRefs:
    - QM005
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-proof
    missingEvidence: Production ROI, payback, and pricing benchmarks for language, contact-center, and maps workloads.
    whyItMatters: The market case improves meaningfully if Krutrim can prove measurable customer outcomes versus substitutes.
    diligencePath: Request case studies with baseline, deployed cost, uptime, and quantified post-deployment benefit.
    relatedQuestionRefs:
    - QM023
    - QM024
    relatedTableRefs:
    - TM004
    - TM006
