chapter:
  number: 2
  title: Market Analysis
  summary: Krutrim is pursuing a broad India-first AI infrastructure and multilingual-services opportunity rather than a narrow chatbot niche. Public market evidence supports strong demand tailwinds in sovereign AI, enterprise adoption, and Indian-language tooling, but it does not cleanly isolate a precise Krutrim-specific SAM or SOM; the public corpus proves market relevance far more clearly than it proves monetized share capture.
sections:
- id: market-boundary-and-included-spend
  title: Market Boundary and Included Spend
  body: 'Krutrim''s market should be defined as an overlapping stack, not a single TAM line item. The company''s current surface includes GPU cloud, hosted models, AI Studio, language services, contact-center automation, and India-focused mapping APIs. That means the relevant spend pools include AI infrastructure, model inference and fine-tuning, multilingual language tooling, developer cloud, and selected enterprise workflow budgets. What should be excluded is equally important: generic consumer-chat usage, undifferentiated public cloud spend with no localization requirement, and traditional IT services revenue that would accrue to integrators rather than the platform owner. The practical implication is that Krutrim sits in a strategically attractive wedge where sovereignty, data locality, and Indian-language support can matter, but it also sits in a hard-to-size wedge because those needs cut across several broader market categories rather than appearing as a clean standalone analyst segment.
    The right diligence posture is to use multiple market lenses, not one headline TAM number.'
