- id: sizing-lenses-and-unresolved-uncertainty
  title: Sizing Lenses and Unresolved Uncertainty
  body: 'Available public sizing lenses are directionally bullish but not precise enough to underwrite Krutrim''s share without internal data. IMARC''s India generative AI estimate gives a narrower current market of about $1.5 billion in 2025, while its broader India AI market lens reaches about $1.6 billion in 2025 and more than $13 billion by 2034. PIB and BCG add adoption and policy context rather than company-specific revenue pools: IndiaAI''s budget, GPU expansion, and enterprise AI penetration all support the idea that domestic supply will meet growing demand. Krutrim''s own 25,000-developer and 250-billion-API-call claims offer bottom-up demand signals, but they still do not reveal conversion rates, realized ARPU, churn, or revenue mix across cloud, models, maps, and enterprise services. The conclusion is straightforward. Krutrim clearly participates in a large and growing Indian AI opportunity, but the public record cannot yet isolate a credible Krutrim-specific SAM, much less a
    near-term SOM. Investors therefore need pipeline, conversion, and cohort data before treating the market case as an investable share-capture case.'
