- id: financial-customer-and-thesis-break-risk
  title: Financial, customer, and thesis-break risk
  body: 'The last risk cluster is the one most likely to break the investment thesis if it persists: Krutrim may be building a large strategic platform before it has shown durable third-party revenue quality. Public evidence gives multiple reasons to take that seriously. The company has list pricing and adoption signals, but no public ARR, gross-margin, burn, NRR, or concentration disclosure. The Company Check page reports open charges, which reinforces that obligations exist even as founder capital appears abundant. The customer chapter shows meaningful signs of usage but still thin proof on renewals, cross-sell, and external depth. In practical terms, that means the most dangerous outcome is not immediate failure but expensive ambiguity: a business that can keep raising or self-funding infrastructure while still leaving investors uncertain whether external commercial validation is deep enough to justify the spend. The right risk posture is therefore conditional. Krutrim can be financeable
    and strategically important while still being a poor underwriting candidate if the next twelve to eighteen months do not produce stronger evidence on customer durability, capital efficiency, and operating control.'
