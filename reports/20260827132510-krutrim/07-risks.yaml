- id: operational-technology-and-partner-risk
  title: Operational, technology, and partner risk
  body: 'Krutrim’s operational risk is inseparable from its infrastructure ambition. GPU supply, datacentre operations, power, cloud control planes, model-serving economics, and security all sit beneath the public product story. That makes imported hardware, platform reliability, and cost control central residual exposures. Public sources help frame the risk: Krutrim is positioning A100 and H100-backed services, India-hosted DeepSeek models, and a frontier-lab roadmap, which is enough to prove technical seriousness but not enough to prove mature reliability. On top of that, India’s sovereign-AI narrative remains incomplete if critical layers still rely on foreign hardware or software ecosystems. The company’s own docs and GitHub surfaces are positive indicators because they show tooling and operational intent, yet they do not answer the hardest diligence questions about incident rates, GPU utilization, uptime, or security-control depth. Partner risk compounds the picture. Krutrim depends
    on suppliers, open-source ecosystems, and potentially a small number of strategic customers or affiliates. If any of those pillars weaken, the company could face simultaneous pressure on product credibility, cost structure, and market adoption.'
  claimRefs:
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
  - CR030
