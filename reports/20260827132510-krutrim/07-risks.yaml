  figureRefs:
  - FR001
- id: regulatory-privacy-and-governance-risk
  title: Regulatory, privacy, and governance risk
  body: Krutrim operates in a jurisdiction that is moving quickly on data protection and AI governance without yet imposing a single standalone AI law. The DPDPA 2023 and its notified rules create a phased compliance burden that becomes fully effective by May 2027, while the November 2025 India AI Governance Guidelines define voluntary but increasingly important expectations around trust, human oversight, accountability, explainability, and safety. For Krutrim, that matters because its products inherently process multilingual data, enterprise workloads, maps or location data, and potentially conversational or decision-support outputs. Public privacy and terms pages show that the company understands the need for legal posture, but legal posture is not the same as operational compliance. The broader Indian commentary emphasizes consent management, breach reporting, data minimization, cross-border transfer discipline, child-data handling, and explainability for consequential decisions. If Krutrim
    wants to win enterprise or public-sector trust, it will need to show that these obligations are embedded into workflows rather than appended as website language. The regulatory risk is manageable, but only if Krutrim’s internal controls are materially stronger than its current public evidence lets outsiders verify.
  claimRefs:
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
