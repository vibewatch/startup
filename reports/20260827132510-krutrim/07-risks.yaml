- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - External customer depth
    - Third-party paying-customer concentration remains opaque
    - No disclosed renewal / reference pack after next diligence cycle
    - Treat valuation support as narrative-heavy and demand structure
  - - Capital efficiency
    - No workload-level margin or burn visibility despite continued expansion
    - Management cannot evidence unit economics by major product line
    - Do not underwrite as scalable software economics
  - - Operational trust
    - Repeated outages or missing assurance materials for enterprise reviews
    - Major buyer cannot clear security diligence or incidents recur
    - Downgrade enterprise adoption assumptions
  - - Regulatory readiness
    - Controls lag DPDPA / AI governance expectations
    - No control mapping, DPIA process, or breach readiness evidence
    - Raise risk rating and delay public-sector/regulated exposure assumptions
  - - Strategy discipline
    - Product stack keeps expanding while proof remains shallow
    - No de-prioritization or module-level KPI discipline visible
    - Assume product sprawl and margin dilution risk
  - - Founder / sponsor concentration
    - Capital or decision-making remains tightly centralized
    - No governance broadening or independent controls
    - Require stronger downside protection and monitoring
  notes: Kill criteria focus on monitorable evidence gaps rather than abstract fears, so they can be tested in diligence.
