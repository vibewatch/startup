  topStrengths:
    - >-
      Krutrim combines India-resident AI infrastructure, multilingual model ambition, maps, and workflow products into a
      strategically valuable full-stack narrative.
    - >-
      Founder backing and a large disclosed 2025 funding package give the company unusual capacity to keep building
