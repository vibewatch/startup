  topStrengths:
  - Krutrim combines India-resident AI infrastructure, multilingual model ambition, maps, and workflow products into a strategically valuable full-stack narrative.
  - Founder backing and a large disclosed 2025 funding package give the company unusual capacity to keep building ahead of many local peers.
  - Public product and developer surfaces show that Krutrim is a real platform build, not only a one-model marketing story.
  topRisks:
  - Public disclosure still does not show ARR, gross margin, burn, retention, or workload-level unit economics needed to underwrite price cleanly.
  - External customer proof remains thinner than the scale of the cloud and sovereignty narrative, with limited public evidence on renewals or concentration.
  - Founder centrality, imported-hardware dependence, and broad product ambition create stacked execution and governance risk.
  unresolvedGaps:
  - Exact cap-table and term-sheet evidence for the implied 2025 valuation and funding structure
  - Third-party customer references, renewal cohorts, and affiliated-vs-external revenue mix
  - Workload-level margin, utilization, burn, and governance controls beyond founder centrality
