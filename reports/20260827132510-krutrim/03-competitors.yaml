  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-rate-gap
    missingEvidence: Competitive win/loss data against Sarvam, CoRover, hyperscalers, and DIY stacks.
    whyItMatters: Public positioning is informative, but only win-rate evidence can show whether Krutrim’s bundle beats alternatives in real buying cycles.
    diligencePath: Request customer-level bake-off history, reasons won/lost, and proof by segment.
    relatedQuestionRefs:
    - QP022
    - QP023
    relatedTableRefs:
    - TP003
    - TP004
  - type: private-evidence-only
    severity: material
    topic: retention-gap
    missingEvidence: Renewal and expansion data showing that cloud, language, or maps customers deepen over time.
    whyItMatters: Durability depends on whether multi-homable products become sticky after deployment.
    diligencePath: Request GRR/NRR, usage expansion by cohort, and cross-sell attachment rates.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP005
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-packaging
    missingEvidence: Reserved-volume and negotiated enterprise pricing for domestic and global rivals.
    whyItMatters: List prices only partially explain actual competitive economics.
    diligencePath: Collect customer quotes, partner proposals, and benchmark TCO cases for common workloads.
    relatedQuestionRefs:
    - QP022
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: proof-gap
    missingEvidence: Named third-party case studies proving Krutrim beat rivals on production workloads.
    whyItMatters: Public evidence currently suggests competitive relevance more than demonstrated superiority.
    diligencePath: Request references, deployment details, and measurable outcomes from external customers.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP002
    - TP004
  - type: conflicting-data
    severity: material
    topic: moat-definition
    missingEvidence: Management articulation of which layer Krutrim truly intends to own long term.
    whyItMatters: A full-stack narrative without layer prioritization can mask strategy drift and spread resources too thin.
    diligencePath: Ask management to define primary control points, bundle priorities, and de-scoped layers.
    relatedQuestionRefs:
