  - - Enterprise support / compliance
    - Relationship knowledge and deployment support
    - Lower portability than pure APIs
    - Can still be displaced by stronger vendor proof
    - Services and trust may become the real moat if product parity rises
  notes: Krutrim’s lock-in opportunity is highest when cloud, language, maps, and support are bought together rather than separately.
