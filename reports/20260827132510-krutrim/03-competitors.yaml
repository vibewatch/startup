    - Comparable clouds and Kubernetes abstractions exist
    - Infrastructure can help but is not unbeatable lock-in
  - - Model access
    - Hosted models, APIs, fine-tuning workflows
    - High portability
    - Open-source and multi-model ecosystems keep switching alive
    - Model layer alone is not durable lock-in
  - - Language workflows
    - Custom prompts, localization tuning, enterprise integrations
    - Medium portability
    - Enterprises can replace APIs if data pipelines are standard
    - Needs workflow depth to become sticky
  - - Maps APIs
    - Routing, geocoding, app integrations
    - Medium portability
    - Apps can migrate over time if alternatives are good enough
