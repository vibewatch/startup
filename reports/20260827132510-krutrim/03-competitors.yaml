    - Few named external production wins
    - Makes infrastructure story feel early
    - High pressure
    - Request win/loss and renewal evidence
  - - Hardware dependence
    - Nvidia and imported hardware remain essential
    - Limits true sovereignty and margin control
    - High pressure
    - How exposed is Krutrim to supply shocks or FX?
