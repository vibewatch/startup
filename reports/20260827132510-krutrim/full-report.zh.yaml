  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Krutrim 的经营模型靠支持方资金、进口硬件、数据中心落地，以及仍偏薄的外部验证撑着。
    data:
      nodes:
        - id: d1
          label: 创始人资金
        - id: d2
          label: GPU / 硬件供应
        - id: d3
          label: 数据中心运营
        - id: d4
          label: 云 + 模型平台
        - id: d5
