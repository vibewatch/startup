      - number: '2.4'
        title: 规模测算镜头与未解不确定性
        blocks:
          - type: paragraph
            body: >-
              现有公开规模测算方向上偏乐观，但若没有内部数据，还不足以支撑 Krutrim 的份额。IMARC 对印度生成式 AI 的估计给出一个较窄的当前市场： 2025 年约 $1.5 billion；其更宽的印度 AI
              市场镜头则达到 2025 年约 $1.6 billion，并在 2034 年超过 $13 billion。PIB 和 BCG 补充的是采用和政策语境，而不是公司特定收入池：IndiaAI 预算、GPU 扩容和企业
              AI 渗透率，都支持本土供给将承接增长需求这一判断。 Krutrim 自称拥有 25,000 名开发者和 250 billion 次 API 调用，提供了自下而上的需求信号，但仍没有揭示转化率、实际
              ARPU、流失率， 或云、模型、地图和企业服务之间的收入组合。结论很直接。Krutrim 明显参与了一个庞大且增长中的印度 AI 机会，但公开记录尚无法隔离出可信的 Krutrim
              专属可服务市场（SAM），更谈不上短期可获取市场（SOM）。因此，投资人在把市场逻辑视为可投资的份额获取逻辑之前，需要看到管线、转化和队列数据。
