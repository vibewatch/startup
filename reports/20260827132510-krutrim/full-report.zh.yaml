      - number: '2.2'
        title: 买方分层、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              Krutrim 的买方地图始于开发者和创业公司，但不应止步于此。自助服务触面——快速入门文档、AI Pods、卢比定价和模型访问——降低了个人开发者和小团队的试验摩擦。 与此同时，官方支持流程、客服中心 AI
              信息、语言中心用例、地图定位和企业引导信号，都指向 BFSI、客户支持、物流、出行、公共部门服务交付和受监管企业里的更大预算。
              在许多场景中，使用者和付费方并不是同一个人。开发者、数据团队和产品经理可能先试用平台，但 CIO、CTO、运营、数字化转型或业务部门预算， 很可能掌握规模化生产决策。这个分裂很关键，因为 Krutrim
              的收入路径大概率从开发者驱动的试验，走向企业或集团级合同；公开证据对旅程前半段的支撑， 远强于后半段。关键尽调任务，是衡量有多少自下而上的使用真正转化为付费且持久的机构支出。
