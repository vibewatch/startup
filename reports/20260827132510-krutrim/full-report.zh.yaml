companyProfile:
  summary: >
    Krutrim 是一家总部位于 Bengaluru 的主权 AI 公司，正围绕 AI 云基础设施、多语言和多模态模型、地图和工作流产品，搭建面向印度的广栈。 公开证据确认其 2023 年 12 月公开发布、2024 年 1 月完成
    $50 million 独角兽轮、2025 年 2 月获得由创始人支持的约 $230 million
    融资方案；云和开发者触点也在扩张。同一组公开证据仍对当前准确估值、经常性收入质量、客户持久性、治理深度和工作负载级经济性披露明显不足。
