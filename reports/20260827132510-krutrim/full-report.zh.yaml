    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、平台触面与当前位置
        blocks:
          - type: paragraph
            body: >-
              Krutrim 的公开身份已从 2023 年 12 月面向印度的 LLM 发布故事，扩展成“为印度打造 AI 优先云平台”的主张。公司当前首页、 云页面和文档把 AI 基础设施、数据驻留、SOC 2 定位、GPU
              获取、AI Studio 和开发者工具，提到和基础模型叙事同等甚至更高的位置。 这一点很关键，因为公开商业触面现在更像一家基础设施和平台公司，而不是纯前沿模型实验室。Krutrim 仍把自己放在主权、全栈印度
              AI 体系里营销，但截至运行日，最能直接核验的证据，是围绕云计算、模型、地图、语言工具和企业引导的运营包装。产品跨度有意义，因为它给后续章节提供了可复用基线： Krutrim
              不只是一个聊天机器人或单模型实验。它在尝试拼出一个印度原生的算力、模型和应用栈，尽管后续负面报道会追问，实操中哪些层仍是战略优先项。
