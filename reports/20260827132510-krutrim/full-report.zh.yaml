              公开证据显示，Krutrim 的切换成本仍在搭建中，还没有深度固化。公司具备形成黏性的可信材料——开发者文档、Terraform 工具、AI Pods、地图、 语言 API
              和印度境内基础设施——但许多层天然可以多平台并用。如果编排和数据重力还不深，开发者可以在云之间迁移工作负载；企业可以把全球模型和本土托管混用； 工作流买方也可以采用应用层供应商，而不必购买 Krutrim
              的低栈基础设施。真正耐久的优势将来自三件事：本地算力上的性价比、受监管工作负载中的企业证明、
              以及难以拆除的跨产品集成价值。同样清楚的侵蚀风险包括：开源能力增长、超大规模云厂商语言支持、外国硬件依赖，以及留存或赢单率公开记录仍然很薄。 截至运行日，Krutrim
              看起来具备竞争意义，但还没有形成竞争锁定。尽调门槛因此应是真实经营杠杆和留存证明，而不只是宽阔的公开产品目录。
