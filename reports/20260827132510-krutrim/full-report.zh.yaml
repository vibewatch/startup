  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Krutrim 的市场应按重叠栈来定义，而不是写成单一总可用市场（TAM）项目。公司当前触面包括 GPU 云、托管模型、AI Studio、 语言服务、客服中心自动化和面向印度的地图
              API。因此，纳入的支出池包括 AI 基础设施、模型推理和微调、多语言工具、开发者云，以及部分企业工作流预算。
              同样重要的是排除项：通用消费级聊天使用、没有本地化要求的无差异公有云支出，以及会流向集成商而不是平台所有者的传统 IT 服务收入。实际含义是， Krutrim
              处在一个有战略吸引力的切口：主权、数据本地性和印度语言支持都可能产生价值；但这个切口也很难精确测算，因为这些需求横跨多个更大的市场类别，
              并不天然呈现为干净的独立分析师分部。正确的尽调姿态，是用多组市场镜头，而不是一个头条 TAM 数字。
