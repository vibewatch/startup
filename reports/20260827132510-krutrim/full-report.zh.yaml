      - number: '2.3'
        title: 需求驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Krutrim 的需求逻辑真实存在。PIB 和 BCG 材料显示，印度 AI 采用正在加速，IndiaAI Mission 带来重要公共投资，企业也广泛关注生产用例。 印度特有的语言多样性和本地数据顾虑，为本土
              AI 基础设施和多语言模型工具提供了真正的结构性理由。Krutrim 自身产品组合也贴合这些驱动因素： GPU
              获取、托管模型、语言工具和工作流触面，都能受益于“在印度打造、服务印度”的角度。但采用约束同样重要。买方仍可通过超大规模云厂商、 开源栈或直接使用全球模型
              API，获得许多底层能力。公开证据也显示，商业化可能较重服务属性，独立模型验证仍有限，而对 Nvidia 和进口组件的硬件依赖约束了真正的主权。 市场有吸引力，但并不受保护。Krutrim
              必须靠整体解决方案价值、信任、本地化和执行速度取胜，而不只是靠爱国定位。
