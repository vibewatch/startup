      - number: '1.3'
        title: 资本基础、利益相关方与战略支持者
        blocks:
          - type: paragraph
            body: >-
              Krutrim 的资本故事，是本文件最重要的尽调区分之一。2024 年 1 月一轮已有充分交叉印证：Matrix Partners India 领投， 融资 $50 million，估值 $1
              billion。2025 年 2 月的资本方案更复杂。Business Standard、The Economic Times、 TechCrunch、CNBC TV18 和 BusinessWire
              都支持一笔由 Bhavish Aggarwal 背书、规模约 $230 million 或 ₹2,000 crore
              的大型融资承诺，但报道把它描述为创始人支持的资金，至少部分带债务属性，而不是一轮条款完全披露、由机构重新定价的干净后续融资。这仍让 Krutrim
              拥有远大于许多印度同业的承诺资本基础，但投资人也应把“可用或承诺资本”和“外部定价的后续验证”分开看。战略利益相关方不只来自纯风险资本： Nvidia 是超级计算主张的核心，Ola
              集团工作负载似乎是云需求的核心；即便手上没有明确公开采购台账，政府主权 AI 政策也提供了有利叙事背景。
