  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: Krutrim 残余风险最高的地方，不在单纯监管不确定性，而在资本效率、外部客户验证和运营信任。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 中等影响
          values:
            - 有限
            - 位置数据复杂性
            - 开源替代
        - label: 高影响
          values:
