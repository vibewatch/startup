  - id: TV004
    title: 可比估值表
    columns:
      - 可比项
      - 公开可见指标
      - 估值 / 状态
      - 参考意义
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most relevant sovereign-AI, independent-LLM, and market-opportunity references needed to judge
        Krutrim’s public pricing context; excludes undisclosed private secondaries and confidential term sheets.
    rows:
      - - Krutrim 2024 轮融资
        - $50M 融资
        - ~$1B 估值
        - Krutrim 最干净、直接有支撑的价格标记
        - 相比 2025 年野心上调，这一标记已旧
      - - Krutrim 2025 融资方案
        - 宣布约 $230M / 创始人支持
        - 公开口径常称 ~$2B 左右，但融资规模证据比确切估值更干净
        - 当前最重要的价格背景
        - 公开重定价证据不完整
      - - Sarvam AI
        - 拥有 2026 年独角兽融资的印度主权 AI 同行
        - 可用于观察主权溢价的本土同行
        - 检验印度如何给主权 AI 叙事定价
        - 阶段、合作伙伴组合和披露集不同
      - - Mistral
        - ~$640M 融资
        - 2024 年 ~$6B 估值
        - 显示全球市场愿意给可信的独立模型开发商溢价
        - 规模和模型动能超过 Krutrim 的公开证据
      - - Cohere
        - 据报道 2025 年估值延展为 $6.8B
        - 企业安全 LLM 参照点
        - 可参考拥有分发深度的企业 AI 叙事
        - Cohere 商业可见度更深
      - - Aleph Alpha
        - $500M 轮融资
        - 欧洲主权 AI 类比对象
        - 支撑印度以外也存在主权溢价
        - 收入模式或地域上不可直接可比
      - - 印度 AI 市场机会
        - IMARC / BCG 的快速市场增长预测
        - 品类层面的需求支撑
        - 解释为何溢价资本可得
        - 品类增长不等于公司价值
      - - 公开 AI 软件可比公司
        - 披露薄弱时，倍数和公开市场可能压缩
        - 估值纪律参照
        - 可为不透明经济性提供下行锚
        - 商业模式差异很大
    notes: 这张表有意混合公司行与市场参照行，因为 Krutrim 的价格目前同时受公司基本面和战略品类期权影响。
    claimRefs:
      - CV001
      - CV002
      - CV014
      - CV015
      - CV016
      - CV017
      - CV018
      - CV019
  - id: TV005
    title: 投资逻辑失效与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 如何传导到投资逻辑
      - 行动指向
    rows:
      - - 外部证据没有加深
        - 没有可信的新第三方背书，也没有续约证据
        - 削弱捆绑包和需求假设
        - 不按战略溢价倍数付价
      - - 经济性仍不透明
        - 没有工作负载层面的毛利率或烧钱透明度
        - 估值只剩期权价值
        - 要求交易结构保护，否则放弃
      - - 治理仍高度集中
        - 资本与战略仍未跳出创始人主导
        - 抬高执行和下行保护风险
        - 要求更强权利与监督
      - - 运营可信度动摇
        - 出现事故、可用性缺口或尽调未通过
        - 打击企业转化和融资信心
        - 大幅下调企业采用假设
      - - 资金支持转弱
        - 创始人投入降温，或外部融资条款恶化
        - 估值压缩打到下行情景和现金跑道假设
        - 按更低出清价重新做投资测算
    notes: 这些触发项盯的是可观察证据变化，而不是宏观噪音。
    claimRefs:
      - CV026
      - CV027
      - CV028
      - CV037
  - id: TV006
    title: 最终尽调追问表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前准确估值
        - 可核验的 2025 年定价条款书或股权结构表证据
        - 融资金额的证据强于精确估值标记
        - 向管理层索取融资文件
      - - 外部客户质量
        - 可背书的第三方客户、续约与集中度
        - 估值不能只靠内部使用量支撑
        - 安排客户访谈并索取队列表
      - - 单位经济性
        - 按工作负载拆分的毛利率、烧钱速度、利用率和实际成交价格
        - 资本强度是投资测算的核心卡点
        - 索取月度管理账和工作负载 P&L
      - - 治理
        - 授权决策权及董事会 / 委员会控制
        - 创始人集中度影响下行风险
        - 索取治理材料和审批矩阵
      - - 交叉销售附着率
        - 地图 / 云 / 模型 / 工作流扩张证据
        - 全栈估值需要全栈变现支撑
        - 索取产品组合队列分析
      - - 安全与可靠性
        - 可用性历史、事故日志和保障材料包
        - 企业价值不仅看功能，也看信任
        - 索取企业级尽调资料包
    notes: 这些是最低尽调要求；只有满足它们，才能把叙事层面的认可转成可定价的投资测算。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV038
      - CV039
      - CV040
