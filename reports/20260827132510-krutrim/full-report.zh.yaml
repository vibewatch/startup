            body: >-
              在印度对手中，Sarvam 和 CoRover 从不同方向挤压 Krutrim。Sarvam 的公开触面在主权模型定位、政府协同、具名企业或公共部门部署主张上更强。 CoRover
              则强在工作流分发，自己声称拥有大规模装机覆盖，也有 Google Cloud 案例研究。Krutrim 的相对优势更靠近栈底： 云 GPU、AI
              Studio、开源模型托管，以及一个包含地图和语言工具的更宽组合。当买方想要一个带底层基础设施控制的印度原生平台时，这一点有吸引力。
              当买方主要想要已经验证的业务工作流或公共部署证明时，它就更弱。实际来看，Sarvam 在主权 AI 雄心上与 Krutrim 竞争，CoRover 则在即时客户证明和工作流嵌入上竞争。 Krutrim
              需要足够的生产证据，才能不再显得像本土全栈故事中基础设施最重、但独立验证最少的一家。
