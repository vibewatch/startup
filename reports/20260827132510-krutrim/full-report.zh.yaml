        title: 资本基础和资产负债表信号
        blocks:
          - type: paragraph
            body: >-
              对一家印度私人 AI 公司而言，Krutrim 的资本故事异常可见，尽管经营披露仍然稀疏。2024 年 1 月一轮让公司以 $1 billion 估值成为印度首家 AI 独角兽；2025 年 2
              月的报道则描述了一笔规模大得多的 Rs 2,000 crore（约 $230 million）创始人支持承诺，用于建设前沿 AI 实验室、 超级计算能力和更宽的主权 AI 基础设施。Company Check
              页面补充了普通创业公司新闻没有的资产负债表色彩：根据最新 MCA 衍生快照， 它显示实缴资本约 Rs 306.79 crore、授权资本 Rs 306.99 crore、未结清担保登记 Rs 210
              crore，同时 FY2025 财务报表已向 ROC Bangalore 备案。这些数字不能告诉我们账上现金，但确实强化了一个判断：Krutrim 正按基础设施重投入来资本化，而不是按轻资本应用创业公司来建设。
              承销含义很直接：公司很可能有足够的赞助方支持继续建设，但公开证据也显示出融资依赖、正式债务约束，以及经披露的经常性经营表现缓冲仍然很薄。
