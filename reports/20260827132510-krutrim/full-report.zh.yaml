      - number: '3.3'
        title: 全球替代品与开放生态压力
        blocks:
          - type: paragraph
            body: >-
              Krutrim 的护城河也受到供应商和替代方案挤压，这些力量并不都是印度创业公司。Google、Azure 和 AWS 已经支持广泛语言栈和企业分发。 IndicTrans2
              等开源资产，以及其他多语言模型，降低了不用单一本土供应商也能拼出本地化工作流的成本。BharatGen 和 AI4Bharat 增加了公共和研究供给， 可把关键能力扩散到生态中。实际结果是，Krutrim
              并不拥有“印度语言 AI”这个品类。它的最佳情景不是排他性，而是包装：本地云、本地数据姿态、
              精选模型访问、企业支持，以及地图等相邻产品。这仍有商业意义，尤其适合关心数据驻留或本地集成支持的买方。但这是包装护城河，不是纯研究护城河；
              如果定价、在线稳定性或部署证明偏弱，包装护城河会很快被侵蚀。这个框架让结论保持克制：Krutrim 仍能赢下有意义的客户，但不能在替代品已经充足的地方假设稀缺性。
