      - number: '1.2'
        title: 创始人控制、领导层触面与治理可见度
        blocks:
          - type: paragraph
            body: >-
              在所有抓取到的公开来源里，Bhavish Aggarwal 都是明确的重心。他是创始人，是最大融资公告背后的声音，是产品发布的门面，也是最清楚绑定 Krutrim
              国家主权叙事的人。公开材料也露出一些第二梯队技术领导者，包括负责 AI 工程的 Gautam Bhargava，以及与芯片雄心相连的 Sambit Sahu；
              但材料没有给出董事会名单、独立治理说明、委员会结构，或晚期投资人会要求的决策权细节。结果是典型的混合图景。Aggarwal 能快速对齐资本、 Ola
              集团需求和印度科技叙事，创始人与市场匹配度强。治理可见度弱，因为同一证据集没有说明风险如何被制衡、创始人以下的优先级如何设定，
              以及资本压力迫使战略收窄时会发生什么。领导力集中并非致命伤，但它把执行和关键人依赖抬高到后续每一章都会面对的位置。
