      - number: '1.4'
        title: 里程碑、规模信号与未解警示
        blocks:
          - type: paragraph
            body: >-
              Krutrim 的里程碑推进速度毋庸置疑：2023 年末公开发布，2024 年初跻身独角兽，2024 年中商业化云业务，2025 年初打出“DeepSeek 跑在印度服务器上”的定位，随后又提出 AI Lab 和
              GB200 超级计算机主张。官方和媒体触面还给出额外的表层规模信号，例如平台上 500+ 个团队、 Ola 集团工作负载迁移、25,000 名开发者、250 billion 次 API
              调用，以及独立的地图或语言产品。但同一组材料也解释了为什么公司仍需要更深尽调。 许多最亮眼的使用指标来自公司自己，而不是独立审计。若干雄心，尤其是芯片和前沿模型竞争力，仍以愿景口吻呈现。2025 年 9
              月的反向报道还认为， Krutrim 最初的全层栈主张已经显著收窄到云，并高度依赖创始人资本和 Ola 内部需求。正确结论不是 Krutrim 缺乏战略意义；而是公开证据支撑强战略叙事的速度，
              快过它支撑一套已充分验证的业务质量叙事。
