        - label: 托管 AI 层
          detail: AI Studio 和托管模型端点在原始基础设施之上开放推理和实验。
        - label: 核心基础设施
          detail: 算力、AI Pods、VM、裸金属和计费构成底层容量与资源控制平面。
        - label: 控制与支持
          detail: 账户管理、控制台导航、支持、隐私和条款，为买方和开发者圈出运营边界。
    approximationNotes: 这套技术栈根据公开产品页面和文档推断，并非来自私有架构图。
    claimRefs:
      - CE001
      - CE002
      - CE010
      - CE013
  - id: FE002
    title: 客户工作流 / 运营流程
