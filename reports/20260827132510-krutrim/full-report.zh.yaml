              以及若干出行、物流或金融服务品牌。第四类是可能使用客服中心 AI 或语言工具等工作流产品的企业或机构；这里的公开证明明显薄于产品目录。这种分层很重要，因为 Krutrim 的公开证据足以否定“没有用户”的说法，
