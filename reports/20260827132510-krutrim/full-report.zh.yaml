      - number: '7.2'
        title: 监管、隐私与治理风险
        blocks:
          - type: paragraph
            body: >-
              Krutrim 所在司法辖区正在快速推进数据保护和 AI 治理，但尚未施加一部单独 AI 法。DPDPA 2023 及其已公布细则带来分阶段合规负担， 到 2027 年 5 月完全生效；2025 年 11 月的
              India AI Governance Guidelines 则围绕信任、人类监督、问责、可解释性和安全， 定义了自愿但日益重要的预期。这对 Krutrim
              很关键，因为其产品天然会处理多语言数据、企业工作负载、地图或位置数据，以及潜在的对话式或决策支持输出。
              公开隐私和条款页面显示，公司理解法律姿态的必要性，但法律姿态不等于运营合规。更广泛的印度评论强调同意管理、泄露报告、数据最小化、 跨境传输纪律、儿童数据处理，以及重大决策中的可解释性。如果 Krutrim
              想赢得企业或公共部门信任，就需要证明这些义务已经嵌入工作流， 而不是附加成网站文字。监管风险可管理，但前提是 Krutrim 的内部控制显著强于当前公开证据能让外部核验的水平。
