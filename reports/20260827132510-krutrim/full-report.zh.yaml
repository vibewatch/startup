              平台，但投资人不应按产品宽度、客户持久性和资本效率都已被证明的价格买单。 纪律严明的投资人会要求下行保护、报告权利，以及围绕外部客户证明、利用率、按工作负载拆分的毛利率、治理从创始人中心向外扩展的明确里程碑。
              如果这些条件满足——或者价格实质下移——投资逻辑会更有意思。否则，当前公开材料要求买方过早承销太多可选性。换句话说： 现在该由证据承担举证责任，而不是想象力。价格纪律要压过怕错过的心理。
