  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 创始人资本与执行集中度
        blocks:
          - type: paragraph
            body: >-
              Krutrim 最大的可见风险，是创始人资本、创始人叙事和创始人驱动执行的集中。公开记录支持三点：Bhavish Aggarwal 仍是核心战略出资方， 2025
              年融资方案由创始人支持，公司同时建设云、模型、地图、助手和未来芯片雄心。当速度重要时，集中可以是优势；但这也意味着战略漂移或资本配置错误， 会沿着整套栈回响。公开反向报道和关停报道加重了这层担忧。Times of
              India 的现实核验报道认为，外部客户深度薄于叙事暗示；2026 年围绕 Kruti
              助手的关停报道则说明，并非每个产品实验都能留住。当一家公司尝试讲全栈主权故事时，产品反转很重要，因为它暗示优先级承压，而不只是普通迭代。
              因此，关键风险不只是关键人依赖；而是赞助方资本和创始人信念，可能让公司在市场证明哪些层值得持续投入之前，同时背负太多押注。
