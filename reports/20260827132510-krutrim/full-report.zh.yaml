              Krutrim 应被看作一个由出资方支持的主权 AI 建设项目，财务成败仍取决于能否把基础设施支出转化为多元化第三方收入。乐观情景是， 创始人资本、公开定价和本地数据中心定位，能帮助 Krutrim
              吸引开发者、迁移 Ola 集团工作负载、赢下需要印度境内算力的企业， 并最终交叉销售模型、地图和工作流产品。谨慎情景是，当前融资方案在市场看到收入质量之前，就先承销了昂贵的期权性。Times of India
              的现实核验文章强化了这层谨慎： 它认为外部客户深度看起来薄于雄心规模。截至运行日，最干净的结论是：Krutrim 看起来能融资，但还没到财务上可承销的程度。任何不止于战略期权性的投资人，
              都应要求客户级收入组合、工作负载级利润率、担保登记约束、资本开支计划，以及一份赞助方融资路线图，说明当前创始人资金被吸收之后会发生什么。
