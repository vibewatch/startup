              Krutrim 的运营风险与基础设施雄心不可分割。GPU 供应、数据中心运营、电力、云控制平面、模型服务经济性和安全，都位于公开产品故事之下。
              这让进口硬件、平台可靠性和成本控制成为核心剩余风险暴露。公开来源帮助勾勒风险：Krutrim 正在定位由 A100 和 H100 支撑的服务、 印度托管的 DeepSeek
              模型和前沿实验室路线图；这些足以证明技术认真度，但不足以证明成熟可靠性。除此之外，如果关键层仍依赖外国硬件或软件生态， 印度的主权 AI 叙事就仍不完整。公司自有文档和 GitHub
              触面是正面指标，因为它们展示了工具和运营意图；但它们没有回答事故率、GPU 利用率、 在线稳定性或安全控制深度这些最难的尽调问题。伙伴风险进一步叠加。Krutrim
              依赖供应商、开源生态，以及可能数量很少的战略客户或关联方。 如果其中任何支柱变弱，公司可能在产品可信度、成本结构和市场采用上同时承压。
