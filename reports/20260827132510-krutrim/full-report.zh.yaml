  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 分层竞争集，而非单一对手
        blocks:
          - type: paragraph
            body: >-
              Krutrim 面对的不是一家明显镜像式公司，而是至少四层竞争：Sarvam 等本土主权 AI 同业；CoRover/BharatGPT 等工作流和对话式既有玩家； AI4Bharat、IndicTrans2 和
              BharatGen 等公共品与开放生态建设者；以及已经支持许多印度语言工作流的全球云厂商。这很关键，因为买方不只在模型实验室之间选择。
              他们也在打包部署模式、本地化深度、云控制和工作流便利性之间做取舍。Krutrim 的公开证据在本土基础设施、开发者工具和云商业化上最深。
              这给了它差异化角度，但也意味着最直接的对手按层而不是按完全相同的产品目录变化。尽调上的关键含义是，投资人应把 Krutrim 当作一家栈定位公司来评估：
              它必须在云、模型和应用工具之间赢到足够多的价值，才能证明买它的组合比拼接替代方案更有道理。
