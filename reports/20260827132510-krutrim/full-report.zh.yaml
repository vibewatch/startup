        title: 成本结构、利用率与披露缺口
        blocks:
          - type: paragraph
            body: >-
              最重要的财务未知数不是收入规模雄心，而是成本纪律。Krutrim 明确在建设 GPU 云、模型托管和前沿模型能力；在这个市场里，进口硬件、电力、
              数据中心运营和推理优化，决定收入会变成利润率，还是只变成补贴出来的用量。公开证据给出几个有用但不完整的信号：首页声称已迁移数千台 VM、 数 PB 数据，并为 Ola 集团工作负载降低基础设施成本；AI
              云营销提到 3 个数据中心和 1000+ 集群；DeepSeek 托管和前沿实验室的外部报道， 则把 Krutrim
              描绘为严肃的基础设施运营者，而不是薄包装。但已审阅来源没有披露收入、年经常性收入（ARR）、毛利率、烧钱速度、月度 opex、 GPU
              利用率、获客成本（CAC）、回本周期、净留存率（NRR）或营运资本行为。没有这些输入，即使吞吐或部署主张看起来合理，也无法转化为可融资的软件经济性。 正确结论是：利用率可能在改善，但公开材料不足以让外部投资人判断
