  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 战略溢价存在，但证明仍落后于价格
        blocks:
          - type: paragraph
            body: >-
              Krutrim 应获得战略溢价，因为它不只是另一家应用创业公司。它试图在市场和政策环境都偏向本土能力之时，建设印度境内云基础设施、多语言模型和更宽的主权 AI 栈。 2024 年 $50 million
              融资、$1 billion 估值，以及规模大得多的 2025 年创始人支持融资方案，说明资本市场和出资方愿意激进资助这条叙事。 但公开证据距离证明一套干净的软件或基础设施承销逻辑仍很远。没有公开
              ARR、毛利率、烧钱速度、NRR 或工作负载级单位经济性。公开客户证明真实但浅。 2025 年隐含估值的准确性，也不如融资金额本身清楚。这意味着今天任何溢价，主要是在为战略稀缺性、创始人支持和未来平台意义买单，
              而不是为已披露的经常性经济性证明买单。战略意义和价格出清证明之间的区别，是本报告估值纪律的核心。
