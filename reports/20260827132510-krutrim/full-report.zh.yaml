      - CR023
      - CR029
      - CR032
      - CR040
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: Krutrim 的推荐逻辑很简单：战略价值强，但经济性披露弱，因此只能结构化参与，不能自动买入。
    data:
      nodes:
        - id: r1
          label: 战略稀缺性 + 主权 AI 上行空间
        - id: r2
          label: 真实产品广度和资金支持
        - id: r3
          label: 客户与利润率披露偏薄
        - id: r4
          label: 高残余风险和估值不确定性
        - id: r5
          label: 仅限结构化 / 继续研究
      edges:
        - from: r1
          to: r2
        - from: r2
          to: r3
        - from: r3
          to: r4
        - from: r4
          to: r5
    approximationNotes: 该流程总结推理链条，不是机械评分卡。
    claimRefs:
      - CV008
      - CV020
      - CV031
      - CV033
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值争议主要由几项因素决定：外部客户深度、利润率证明、治理，以及确切成交价。
    data:
      items:
        - label: 外部客户验证
          value: 9
          detail: 权重最大，因为它验证的不是内部工作负载，而是外部需求。
          tone: warning
        - label: 单位经济性披露
          value: 9
          detail: 没有工作负载利润率，溢价倍数很难站住。
          tone: warning
        - label: 治理结构拓宽
          value: 7
          detail: 创始人控制权过于集中，会放大下行和尽调风险。
          tone: warning
        - label: 印度主权 AI 顺风
          value: 7
          detail: 这是有分量的正向驱动，但仍停留在品类层面。
          tone: positive
        - label: 2025 年确切价格证据
          value: 8
          detail: 估值信心取决于外界报道的估值标记是否有清晰文件支撑。
          tone: warning
    approximationNotes: 条形只是序数敏感性权重，不是回归输出。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV018
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 公开证据支撑的区间很宽：战略上行空间真实存在，但当前确切标记估值和经济性披露不足。
    data:
      items:
        - label: 悲观
          low: 400
          high: 800
          displayValue: $400M-$800M
          detail: 如果证据缺口持续，结果更像期权价值。
          tone: warning
        - label: 基准
          low: 900
          high: 1400
          displayValue: $900M-$1.4B
          detail: 战略价值成立，但平台还没有完全跑通验证。
          tone: neutral
        - label: 乐观
          low: 1800
          high: 2400
          displayValue: $1.8B-$2.4B
          detail: 需要真实外部验证和更好的经济性。
          tone: positive
    approximationNotes: 区间是作者基于公开证据的估计，不应被误读为管理层指引或保密可比公司分析。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Krutrim 市场重要性得分最高，证据完整性和经济性透明度最弱。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          detail: 印度 AI 与主权化顺风很强。
        - label: 产品广度
          value: 8
          unit: /10
          detail: 云、模型、地图和工作流撑起了真实战略覆盖面。
        - label: 客户验证
          value: 5
          unit: /10
          detail: 已有采用信号，但持久第三方证明有限。
        - label: 经济性可见度
          value: 3
          unit: /10
          detail: ARR、利润率、烧钱速度和 NRR 均未公开披露。
        - label: 治理信心
          value: 4
          unit: /10
          detail: 创始人集中度仍高。
        - label: 估值信心
          value: 4
          unit: /10
          detail: 从公开证据看，当前报道水平偏满。
    approximationNotes: 评分是基于公开证据集、可供投委会使用的定性判断。
    claimRefs:
      - CV014
      - CV029
      - CV031
      - CV040
appendices:
  - id: A
    title: 投委会讨论框架
    blocks:
      - type: paragraph
        body: |
          应把 Krutrim 视为具有战略重要性的印度 AI 资产：公开证据足以支持好奇心和持续尽调，但不足以放松价格纪律。
        claimRefs:
          - CV031
          - CV039
      - type: callout
        title: 入场纪律比参与叙事更重要
        calloutType: recommendation
        body: |
          如果入场价接近据报道的约 $2B 区间，结构、里程碑和报告权，比单纯获得故事敞口更重要。
        claimRefs:
          - CV031
          - CV034
          - CV035
      - type: list
        items:
          - 在照单接受任何名义估值前，先核验 2025 年确切价格和融资工具组合。
          - 外部客户深度和单位经济性尽调，应排在更多产品演示之前。
          - 把治理结构拓宽视为真实价值驱动，而不是软性定性偏好。
        claimRefs:
          - CV035
          - CV036
          - CV038
          - CV040
