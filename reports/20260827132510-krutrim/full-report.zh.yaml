  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Krutrim 的公开客户旅程从发现和试用开始，之后可能扩展到基础设施依赖和相邻产品使用。
    data:
      nodes:
        - id: j1
          label: 发现
          detail: 官网、Ola Maps 发布报道和主权叙事带来初始认知。
        - id: j2
          label: 试用
          detail: 开发者或团队注册、试用额度，并评估地图或云 API。
        - id: j3
          label: 部署
          detail: 工作负载通过内部迁移或 Urbanic/Savana 等具名客户部署上线。
        - id: j4
          label: 扩张
          detail: 客户增加更多工作负载、更多 API，或云加地图等相邻产品。
        - id: j5
          label: 续约
          detail: 只有走到这一步，Krutrim 才能证明客户质量耐久；但这一阶段的公开证据很稀疏。
