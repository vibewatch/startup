        - 后续融资或老股估值标记明显低于表面热度
    notes: 区间来自公开证据估算，不是管理层指引，并且刻意避免假装据报 2025 标记已经完全被证明。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
