    - Internal demand anchor and ecosystem affiliate
    - Homepage and later reporting both point to workload migration and ecosystem linkage
    - Potentially valuable first customer but also concentration risk
    - Request intercompany pricing, contract length, and arm’s-length governance
  - - Government sovereign-AI ecosystem
    - Policy and narrative enabler
    - IndiaAI and broader sovereignty agenda strengthen market relevance
    - Helpful demand backdrop without yet proving Krutrim-specific procurement scale
    - Request named government contracts, pilots, or compute-allocation details
  notes: Rows combine financial investors, strategic enablers, and captive-demand stakeholders because Krutrim’s public story blends financing, infrastructure, and national-technology positioning.
