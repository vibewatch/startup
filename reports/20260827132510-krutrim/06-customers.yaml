  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: retention
    missingEvidence: NRR, GRR, logo churn, renewal cadence, and cohort retention by product line.
    whyItMatters: Customer quality cannot be underwritten from signups, logos, or one testimonial alone.
    diligencePath: Request retention dashboards, churn reasons, and cohort analyses for maps, cloud, and workflow products.
    relatedQuestionRefs:
    - QU015
    - QU016
    - QU017
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: critical
    topic: customer-mix
    missingEvidence: Revenue split between affiliated Ola-group demand and third-party external customers.
    whyItMatters: Affiliated usage can support utilization while overstating independent market validation.
    diligencePath: Request customer concentration and revenue mix by affiliated vs unaffiliated accounts.
