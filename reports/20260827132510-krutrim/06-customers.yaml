- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Internal Ola workloads
    - Affiliated demand may dominate early volume
    - Can improve utilization while masking external demand quality
    - Request revenue split between affiliated and third-party customers
  - - Maps logo roster
    - Logo presence may seed wider account expansion
    - If logos are shallow or unpaid, market proof is overstated
    - Request account status, paid usage, and reference calls for listed logos
  - - Developer funnel
    - Large top-of-funnel can compound if conversions stick
    - Low conversion could create noisy but low-value activity
    - Request free-to-paid conversion and 90/180-day activation cohorts
  - - Enterprise workflow products
    - Could raise ACV and improve margin mix
    - Named workflow proof is sparse
    - Request case studies, signed contracts, and renewal data
  - - Government / strategic projects
    - Can anchor sovereignty narrative and long contracts
    - Procurement cycles and political dependence can slow conversion
    - Request pipeline stage, award status, and realized deployment milestones
  notes: Expansion potential is real, but public evidence does not yet show how much of it converts into durable, diversified revenue.
