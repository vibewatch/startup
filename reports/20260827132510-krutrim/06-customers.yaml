company:
  name: Krutrim
chapter:
  number: 6
  title: Customers
  summary: Krutrim has enough public customer evidence to show real usage surfaces, especially through Ola-group internal adoption, developer signups, and Ola Maps references. The strongest named third-party proof is the Ola Maps testimonial from Urbanic/Savana plus a logo roster across several Indian businesses; the weakest area is revenue-quality durability, because public sources do not disclose renewals, contract lengths, or concentration. At the run date, Krutrim looks adopted and interesting, but not yet publicly proven as a deeply validated third-party enterprise franchise.
sections:
- id: segments-and-what-counts-as-customer-proof
  title: Segments and what counts as customer proof
  body: Krutrim’s public customer surface mixes at least four categories that should not be collapsed into a single “customer count.” First are internal or affiliated workloads from the Ola group, which matter for utilization and referenceability but are not the same as third-party market validation. Second are developers and startups experimenting with Krutrim Cloud or Ola Maps APIs, where signups are meaningful but do not necessarily indicate paid, durable usage. Third are third-party businesses referenced through Ola Maps customer stories or logo rosters, such as Urbanic and several mobility, logistics, or financial-services brands. Fourth are enterprises or institutions that may engage with workflow products such as contact-center AI or language tooling, where public proof is materially thinner than the product catalog. This segmentation matters because Krutrim’s public evidence is good enough to reject the idea that it has no users, but not good enough to conclude that it already has
    a large, diversified, sticky base of high-quality paying customers.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  tableRefs:
  - TU001
  - TU006
  figureRefs:
  - FU001
- id: named-proof-and-adoption-signals
  title: Named proof and adoption signals
  body: 'The most supportable named customer evidence sits around Ola Maps and platform migration signals. The maps surface contains a direct Urbanic testimonial from Ashutosh Sharma referencing improved delivery accuracy at Savana and smoother resolution of address-related failures, which is stronger than a bare logo because it ties the product to an operating outcome. The same maps properties also show a broader logo roster that includes Jungleworks, Droom, Tipplr, Zeno Health, DriveU, IIFL, and Chola MS, though these should be treated as weaker proof because public pages do not explain contract scope, deployment depth, or retention. For Krutrim Cloud overall, independent coverage of Ola’s internal migration provides additional adoption evidence: reports say all workloads moved to Krutrim cloud and more than 2,500 developers had signed up soon after launch. That is useful as a top-of-funnel and internal-usage signal, but it still stops well short of proving external recurring revenue.
    The net result is a chapter where named proof exists, but the quality of that proof ranges from moderate to weak depending on the account.'
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
