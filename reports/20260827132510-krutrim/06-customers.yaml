- id: retention-expansion-and-concentration-unknowns
  title: Retention, expansion, and concentration unknowns
  body: Public evidence on durability is much thinner than public evidence on adoption. None of the reviewed materials disclose NRR, GRR, logo churn, contract duration, renewal cadence, support intensity, seat growth, or revenue contribution by customer cohort. Even the strongest usage claims—such as 500+ teams trusting Krutrim, internal Ola-group migration, or thousands of developer signups—do not answer the most important customer-quality questions. How many of those teams are paying? How many are still active after trial? How concentrated is revenue in affiliated entities or in a small set of enterprise logos? How much of maps usage turns into cross-sell for cloud or models? These are the questions that determine whether Krutrim’s customer chapter supports a durable revenue base or only a promising early surface. At the run date, the only honest answer is that customer durability remains underdisclosed.
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU002
- id: customer-verdict
  title: Customer verdict
  body: 'Krutrim’s customer picture is better than a zero-proof startup but weaker than a fully referenceable enterprise platform. Public evidence supports three positive conclusions: first, the company has real internal and external usage surfaces; second, the maps product in particular has at least one outcome-linked testimonial and multiple named logos; third, developer signups and internal migrations imply the platform can attract interest and real workloads. The adverse evidence is equally important. The Times of India reality-check article argues that external customer depth appears thin relative to Krutrim’s ambition, and none of the public materials disproves that concern with renewal, cohort, or contract-quality data. For diligence, that means Krutrim should be treated as having meaningful adoption signals but incomplete proof of customer durability. The next round of diligence should focus less on “do customers exist?” and more on “which customers expand, renew, and generate third-party
    high-margin revenue?”'
  claimRefs:
  - CU027
  - CU028
  - CU029
  - CU030
  - CU031
