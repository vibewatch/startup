    - Public
    - Commercial/legal baseline
    - Does not disclose enterprise security architecture
  - - Support surface
    - Public
    - Onboarding and help channel visibility
    - No public incident ledger or uptime history
  - - Docs and onboarding
    - Public
    - Developer enablement and operational clarity
    - Need proof that docs stay current under product change
  - - Benchmark / model writeups
    - Public
    - Performance and evaluation narrative
    - Mostly company-authored; limited third-party replication
  - - Open-source model / repo presence
    - Public
    - Developer access and experimentation
    - Openness may raise substitution and support burden
  notes: Public trust evidence exists, but it is thinner than what large regulated buyers usually request before broad deployment.
