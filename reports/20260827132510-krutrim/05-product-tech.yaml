- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Krutrim solution
  - Measurable benefit
  - Limitation
  rows:
  - - Provision India-localized AI infrastructure
    - Assemble GPU, storage, and networking from general-purpose clouds
    - AI Cloud, compute, AI Pods, bare metals
    - Potentially simpler local procurement and bundled AI infra
    - Public materials do not reveal comparative uptime or realized cost
  - - Experiment with or deploy hosted models
    - Manually combine infra with model endpoints
    - AI Studio plus model catalog
    - Faster experimentation and hosted access
    - Public evaluation of model quality is limited
  - - Localize language workflows
    - Use global APIs with weaker Indic depth
    - Language Hub and translation surfaces
    - Better India-language fit is the core promise
    - Outcome benchmarks are largely company-authored
  - - Power location-aware apps
    - Buy mapping from separate vendor
    - Ola Maps APIs
    - Adjacent map layer can reduce vendor sprawl
    - Full monetization and enterprise proof remain thin
  - - Run contact-center or agent workflows
    - Patch models into custom business flows
    - Contact-center AI and AI workflow surfaces
    - Could capture higher-value workflow revenue
    - Public reference deployments are sparse
  notes: Benefits are directionally inferred from product packaging and public workflow descriptions, not from disclosed ROI studies.
  claimRefs:
  - CE005
  - CE006
  - CE012
  - CE027
- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Account / console layer
    - Identity, provisioning, and control plane
    - Console and account-management workflows
    - Enterprise reliability depends on invisible control-plane quality
  - - Compute / bare-metal / AI Pods
    - Core infrastructure substrate
    - GPU supply, datacentres, power, billing systems
    - Capex intensity and utilization risk are high
  - - Hosted model layer
    - Inference and experimentation surface
    - Model serving, evaluation, and prompt workflows
    - Performance claims are still lightly independently validated
  - - Applied product layer
    - Maps, language, contact-center workflows
    - Product teams, partner adoption, integrations
    - Breadth can outpace operational maturity
  - - Developer tooling layer
    - SDKs, Terraform, docs
    - Repository maintenance and documentation quality
    - Tooling exists, but community depth is not yet proven
  - - Trust / legal layer
    - Policies, support, and enterprise controls
    - Privacy, terms, process maturity
    - Assurance depth is thinner than mature trust-center norms
  notes: The architecture is reconstructed from public product and docs surfaces, so it is more reliable on interfaces than on back-end internals.
