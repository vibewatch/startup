company:
  name: Krutrim
chapter:
  number: 5
  title: Product & Technology
  summary: 'Krutrim has assembled a visibly broader product stack than a single Indic LLM release: GPU cloud, AI Pods, developer tooling, multilingual models, maps, and workflow products. The strongest public product evidence sits in infrastructure packaging and ecosystem tooling; the weakest sits in independently verified model performance, reliability history, and detailed security/compliance substantiation. The technical question is not whether Krutrim has products, but whether the stack is mature enough to turn breadth into durable enterprise trust.'
sections:
- id: product-surface-and-packaging
  title: Product surface and packaging
  body: 'Krutrim’s public product surface is broad and intentionally layered. The main website positions Krutrim as a sovereign-AI platform spanning AI cloud, AI Studio, contact-center AI, maps, language tooling, and AI-labs model releases. The docs site turns that high-level message into a real builder surface: quickstart, account management, console navigation, compute resources, AI Pods, billing, and deployment pages all exist and imply that the company expects external developers—not only internal Ola teams—to use the platform directly. This matters because many AI startups present only flagship models or demos, whereas Krutrim is clearly trying to productize the surrounding operating environment. The main packaging pattern is lower-stack-first: cloud, models, and APIs create the substrate, while maps and workflow tools try to deepen usage and raise switching costs. That package is coherent for buyers who want India-based compute and adjacent APIs from one vendor, but it also means product
    sprawl is a real risk if maturity differs sharply by module.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  tableRefs:
