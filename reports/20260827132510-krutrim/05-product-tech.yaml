  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: reliability
    missingEvidence: Public uptime history, incident record, and SLA performance for cloud and hosted-model services.
    whyItMatters: Infrastructure businesses win or lose enterprise trust on reliability, not on landing-page breadth.
    diligencePath: Request status history, incident postmortems, and SLA attainment by product line.
    relatedQuestionRefs:
    - QE019
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: model-validation
    missingEvidence: Independent benchmark replication and production-quality evaluation for Krutrim-2 and related models.
    whyItMatters: Company-authored benchmark narratives cannot alone underwrite model differentiation.
    diligencePath: Request third-party eval packs, customer bake-offs, and benchmark methodology.
    relatedQuestionRefs:
    - QE009
    - QE010
    - QE022
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: Security certifications, architecture reviews, pentest summaries, and enterprise assurance packs.
    whyItMatters: Policy pages are helpful but insufficient for regulated or high-value deployments.
    diligencePath: Request security packet, certification scope, and compliance roadmap.
    relatedQuestionRefs:
    - QE018
    - QE019
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: developer-adoption
    missingEvidence: Package downloads, API volume by SDK, active contributors, and issue-resolution velocity.
