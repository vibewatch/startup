  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - AI Cloud / GPU services
    - Developers, ML teams, enterprises
    - Live public cloud surface
    - India-localized GPU cloud and AI infrastructure positioning
    - Need utilization, SLA, and third-party uptime proof
  - - AI Studio
    - Builders and experimentation teams
    - Live product surface
    - Creates hosted experimentation layer above raw compute
    - Need active-user and workflow-depth evidence
  - - Language Hub / Kruti / contact-center AI
    - Enterprise workflow teams
    - Visible applied-AI surfaces
    - Moves beyond bare infrastructure into use-case packaging
    - Need named production deployments and pricing depth
  - - Ola Maps
    - Mobility, logistics, fintech, delivery teams
    - Live product surface with testimonials/logos
    - Geospatial adjacency can deepen bundle stickiness
    - Need attachment-rate and paid API usage data
  - - Krutrim-1 / Krutrim-2 and modality models
    - Developers and platform builders
    - Model pages and tech posts published
    - Indic-language and multimodal breadth
    - Need independent evaluation and production evidence
  - - SDKs and Terraform provider
    - Developers and DevOps teams
    - Public repos live
    - Operational tooling improves adoption and automation
    - Need package or community-usage evidence
  notes: Rows reflect public product visibility and maturity signals, not private revenue contribution.
