- id: architecture-and-dependency-stack
  title: Architecture and dependency stack
  body: The architecture visible in public docs looks more like a cloud platform with applied-AI layers than like a pure model lab. Compute, AI Pods, bare metals, and billing pages imply a standard resource-control layer; AI Studio and model pages imply hosted inference and experimentation; maps, contact-center AI, and language products sit above that as packaged workloads. Public model pages add modality breadth—Krutrim-1, Krutrim-2, Chitrarth, Dhwani, Vyakyarth, and Krutrim Translate—but do not by themselves prove production superiority. Tech-blog posts around Krutrim-2 and Bharat Bench show that the company is trying to articulate evaluation and model-improvement logic, yet the public evidence still leans heavily on company-authored benchmarks and model descriptions. Dependencies are also obvious. The stack depends on GPU supply, data-centre operations, documentation quality, and partner or ecosystem adoption of platform APIs. In practice, Krutrim’s architecture looks credible as an integrated
    platform, but public evidence is stronger on the existence of layers than on the robustness of each layer under heavy enterprise load.
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  tableRefs:
