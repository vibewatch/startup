- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - External proof fails to deepen
    - No credible new third-party reference and no renewal evidence
    - Undermines bundle and demand assumptions
    - Do not pay strategic-premium multiples
  - - Economics stay opaque
    - No workload-level margins or burn transparency
    - Leaves valuation as option value only
    - Require structure or pass
  - - Governance stays centralized
    - No broadening beyond founder-led capital and strategy
    - Raises execution and downside-protection risk
    - Demand stronger rights and oversight
  - - Operational trust falters
    - Incidents, uptime gaps, or failed diligence emerge
    - Hurts enterprise conversion and financing confidence
    - Cut enterprise adoption assumptions sharply
  - - Funding support weakens
    - Founder commitment softens or external financing terms worsen
    - Compression hits downside and runway assumptions
    - Re-underwrite from lower-clearing-price base
  notes: These triggers focus on observable evidence changes rather than macro noise.
  claimRefs:
  - CV026
  - CV027
  - CV028
  - CV037
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Exact current valuation
    - Clean term-sheet or cap-table evidence for 2025 pricing
    - Funding amount is better supported than exact valuation mark
    - Request financing docs from management
  - - External customer quality
    - Referenceable third-party customers, renewals, and concentration
    - Valuation depends on more than internal utilization
    - Request customer calls and cohort tables
  - - Unit economics
    - Gross margin, burn, utilization, and realized pricing by workload
    - Capital intensity is the core underwriting blocker
    - Request monthly management accounts and workload P&Ls
  - - Governance
    - Delegated decision rights and board / committee controls
    - Founder concentration affects downside risk
    - Request governance materials and approval matrix
  - - Cross-sell attachment
    - Maps / cloud / models / workflow expansion evidence
    - Full-stack valuation requires full-stack monetization
    - Request product-bundle cohort analysis
  - - Security and reliability
    - Uptime history, incident logs, and assurance pack
    - Enterprise value depends on trust as much as features
    - Request enterprise diligence packet
  notes: These are the minimum asks needed before turning narrative admiration into priced underwriting.
