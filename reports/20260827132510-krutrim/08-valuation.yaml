- id: scenario-underwriting
  title: Scenario underwriting favors discipline over headline momentum
  body: 'A scenario view makes the tradeoff clearer. The bull case assumes that founder capital continues to fund capacity expansion, Krutrim converts internal utilization into a broad external customer base, India-resident infrastructure becomes more commercially important, and the company proves meaningful cross-sell across cloud, models, maps, and enterprise workflows. Under those assumptions, a valuation in the high one-to-low two billions could eventually be defensible. The base case is more conservative and better aligned with public evidence: Krutrim remains strategically relevant, but customer-depth proof and capital-efficiency disclosure remain incomplete, implying a value closer to the low one billions today. The bear case is not bankruptcy; it is a de-rating to a lower-clearing-price infrastructure option if external customer proof or economics fail to catch up with capital spend. Once those cases are probability-weighted, the conclusion is that current enthusiasm should not override
    evidence discipline.'
  claimRefs:
