  figureRefs: []
- id: comparable-context-and-current-price-discipline
  title: Comparable context and current price discipline
  body: The comp set supports both upside and caution. On the upside, sovereign or independent model builders such as Mistral, Cohere, Aleph Alpha, Sarvam, and other frontier-AI assets show that investors will pay heavily for scarcity, distribution optionality, and national or enterprise relevance. On the caution side, those same companies generally offer either stronger frontier-model proof, clearer customer traction, deeper financing ecosystems, or better disclosure than Krutrim currently does in public. Analyst-market data on Indian AI opportunity is helpful because it explains why investors are willing to pay for the category, but category growth does not itself clear company-specific price. The practical comparison is therefore not whether Krutrim is ‘important,’ but whether the public evidence already supports paying for multiple future layers of success at once. At the run date, it does not. The company can be strategically valuable and still be full on price if the entry assumes
    that cloud utilization, model differentiation, and third-party customer depth all materialize on schedule.
  claimRefs:
  - CV011
  - CV012
  - CV013
  - CV014
