- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Publicly visible metric
  - Valuation / status
  - Relevance
  - Limitation
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant sovereign-AI, independent-LLM, and market-opportunity references needed to judge Krutrim’s public pricing context; excludes undisclosed private secondaries and confidential term sheets.
  rows:
  - - Krutrim 2024 round
    - $50M raised
    - ~$1B valuation
    - Cleanest directly supported price marker for Krutrim
    - Old marker relative to 2025 ambition shift
  - - Krutrim 2025 funding package
    - ~$230M announced / founder-backed
    - Headline often described around ~$2B, but evidence cleaner on funding than on exact valuation
    - Most important current price context
    - Repricing evidence is incomplete publicly
  - - Sarvam AI
    - Indian sovereign-AI peer with 2026 unicorn financing
    - Useful domestic peer for sovereignty premium
    - Tests how India prices sovereign-AI narratives
    - Different stage, partner mix, and disclosure set
  - - Mistral
    - ~$640M raise
    - ~$6B 2024 valuation
    - Shows global premium for credible independent model builders
    - Scale and model momentum exceed Krutrim’s public proof
  - - Cohere
    - $6.8B valuation extension reported in 2025
    - Enterprise-secure LLM comparison point
    - Relevant for enterprise AI narrative with distribution depth
    - Cohere has deeper commercial visibility
  - - Aleph Alpha
    - $500M round
    - European sovereign-AI analogue
    - Supports existence of sovereignty premium outside India
    - Not directly comparable on revenue model or geography
  - - Indian AI market opportunity
    - Rapid market-growth forecasts from IMARC / BCG
    - Category-level demand support
    - Explains why premium capital is available
    - Category growth is not company value
  - - Public AI software comps
    - Multiples and public markets can compress when disclosure is weak
    - Valuation discipline reference
    - Useful downside anchor for opaque economics
    - Business models differ materially
  notes: 'The table is deliberately mixed: some rows are companies, others are market references, because Krutrim’s price is currently a blend of company fundamentals and strategic category optionality.'
