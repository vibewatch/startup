  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Sovereign-AI scarcity
    - India-localized cloud and models deserve a premium
    - Scarcity alone does not create durable economics
    - Show external customer depth and durable margins
  - - Founder-backed capital
    - Large sponsor backing can accelerate platform buildout
    - Founder concentration can mask price and governance risk
    - Show governance broadening and capital-allocation discipline
  - - Full-stack bundle
    - Cloud + models + maps + workflows can create valuable cross-sell
    - Breadth can become product sprawl without focus
    - Show cross-sell attachment and module-level winners
  - - Market tailwinds
    - Indian AI demand and policy support can expand fast
    - Category growth does not prove company-specific monetization
    - Show realized pricing, retention, and conversion quality
  - - Reported 2025 valuation uplift
    - Could reflect real strategic momentum
    - Public evidence on exact implied valuation is weaker than on funding size
    - Produce term-sheet or cap-table evidence of clean repricing
  notes: The anti-thesis is not anti-Krutrim; it is anti-premature certainty.
