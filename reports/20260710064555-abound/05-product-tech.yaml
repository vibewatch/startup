callouts:
- calloutType: insight
  title: Render looks more like lending workflow software than a generic open-banking
    API
  body: The public evidence suggests Abound is not trying to outcompete TrueLayer
    or Yapily on raw connectivity. It is packaging underwriting and operating logic
    for lending-specific outcomes, which is a more defensible layer if performance
    stays superior.
  claimRefs:
  - CE020
  - CE022
  - CE031
  - CE038
- calloutType: risk
  title: Connectivity is becoming standard; proof of model edge is still private
  body: Open-banking providers now make access, onboarding, and payment flows widely
    available. If Abound cannot prove durable loss or approval advantages in diligence,
    its technology premium could compress quickly.
  claimRefs:
