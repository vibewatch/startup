- id: external-infrastructure-and-build-vs-buy
  title: External infrastructure and build-vs-buy context
  body: A central diligence question is whether Abound owns enough of the stack to
    remain differentiated as open-banking infrastructure matures. The external vendor
    landscape suggests raw connectivity is becoming easier to buy. TrueLayer publishes
    developer quickstarts, API libraries, and variable recurring payment guides; Yapily
    markets data and payment APIs across thousands of institutions; GoCardless emphasizes
    99% UK account coverage; Salt Edge explicitly sells real-time bank data for lending
    decisions; and Tink and Plaid frame themselves as large-scale fintech infrastructure
    providers. The implication is not that Abound is merely reselling these rails.
    Rather, it suggests the moat cannot rest on bank connectivity alone. What Abound
    appears to be packaging is lending-specific workflow logic on top of increasingly
    standardised data-access primitives. The stronger the company’s loss performance,
    approval uplift, and partner deployment playbooks, the stronger that moat becomes.
    The weaker those proprietary outcomes are, the more easily a well-funded incumbent
    or infrastructure-savvy lender can reproduce the experience.
  claimRefs:
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE030
  - CE031
  - CE038
  - CE039
  tableRefs:
  - TE003
  figureRefs:
  - FE003
- id: developer-signal-and-unresolved-tech-risk
  title: Developer signal and unresolved tech risk
  body: 'The public hiring signal is meaningful but incomplete. Abound’s careers materials
    show active interest in senior software engineering, senior Python engineering,
    product management, credit-risk, underwriting, and IT support roles, which strongly
    suggests a technology organisation embedded in regulated lending operations rather
    than a pure growth app team. That is directionally positive because it fits the
    product thesis: better models require engineering depth, but they also require
    risk governance and operational feedback loops. Still, the external record does
    not expose the most important details. There is no public API documentation for
    Render, no published architecture diagram, no model-governance disclosure, and
    no evidence in this run on explainability controls, drift monitoring, or override
    workflows. For a regulated AI credit platform, those missing details matter more
    than a polished UI. The product-tech verdict is therefore favorable on concept
    and deployment breadth, but still blocked on production-depth evidence. A buyer
    or investor should assume the stack is credible but unproven until they inspect
    implementation, monitoring, and control layers directly.'
  claimRefs:
  - CE013
  - CE014
  - CE032
  - CE033
  - CE034
  - CE039
  - CE040
