  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: model-governance-and-monitoring
    missingEvidence: No public source in this run documents model explainability,
      monitoring, drift control, override policy, or validation governance for Render.
    whyItMatters: These controls determine whether a regulated AI underwriting platform
      can scale safely and defensibly.
    diligencePath: Request model governance pack, validation reports, drift dashboards,
      override policy, and audit logs.
    relatedQuestionRefs:
    - QE022
    - QE024
    - QE026
    relatedTableRefs:
    - TE002
    - TE005
  - type: private-evidence-only
    severity: material
    topic: partner-implementation-detail
    missingEvidence: Public sources name partner use cases and some clients but do
      not show deployment timelines, integration burden, SLA terms, or partner-specific
      model tuning.
    whyItMatters: This is necessary to judge whether Render is a scalable product
      or a bespoke services-heavy implementation model.
    diligencePath: Request partner architecture diagrams, implementation timelines,
      resourcing assumptions, and post-launch performance reviews.
    relatedQuestionRefs:
    - QE003
    - QE023
    - QE026
    relatedTableRefs:
    - TE001
    - TE003
  - type: public-data-gap
    severity: medium
    topic: engineering-stack-specifics
    missingEvidence: Hiring signals imply strong Python and product engineering needs,
      but exact languages, cloud stack, data tooling, and vendor mix remain undisclosed.
    whyItMatters: Technical debt and scaling risk often sit in infrastructure choices
      that are invisible from marketing pages.
    diligencePath: Request system architecture, stack inventory, dependency map, and
      incident history.
    relatedQuestionRefs:
    - QE013
    - QE024
    relatedTableRefs:
    - TE005
  - type: public-data-gap
    severity: medium
    topic: rail-coverage-friction
    missingEvidence: Public support documentation shows unsupported banks and six-month-history
      requirements, but not the actual decline rate or conversion loss caused by those
      constraints.
    whyItMatters: Infrastructure friction may materially reduce usable market coverage.
    diligencePath: Request bank-link failure rates, unsupported-bank share, and approval-loss
      by missing-data reason.
    relatedQuestionRefs:
    - QE009
    - QE015
    relatedTableRefs:
    - TE002
