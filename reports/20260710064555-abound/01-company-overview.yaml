- id: leadership-and-governance
  title: Founders, management credibility, and governance disclosure
  body: The public record strongly supports Gerald Chappell and Michelle He as the company’s founding core, while disclosure weakens once the question turns from founders to full governance. Abound’s official pages repeatedly identify Chappell as co-founder and CEO, describing prior partner-level experience at McKinsey and EY focused on digital lending and credit analytics. Michelle He is presented as co-founder and COO with prior EY leadership experience and a PhD in AI. The public leadership section also names Mark London as chief risk officer, reinforcing a management bench built around credit-risk analytics. Companies House corroborates that Gerald Chappell and Dr Cong He are active directors, with appointment dates in 2020 that line up with the company’s founding period. That said, the fetched public package still does not provide a clean board roster, independent-director picture, or investor-control summary. Companies House shows historical director changes and PSC notices, but not
    the economic terms that matter most for venture governance. For later-stage diligence, that means the founder-market-fit signal is solid, while governance transparency remains only partial.
