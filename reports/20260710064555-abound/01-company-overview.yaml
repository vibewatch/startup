- id: capital-and-scale
  title: Funding chronology, profitability, and scale signals
  body: 'Abound’s funding story is better documented than its valuation story. The company’s own posts provide a clear capital chronology: a £32 million launch package in 2021, total capital raised reaching £40 million in early 2022, more than £500 million raised in 2023, and a May 2024 package that could extend to £0.8 billion through a combination of Citi asset-backed debt and a GSR Ventures-led Series B equity component. Independent coverage from Open Banking Expo, Business Matters, City A.M., and FinTech Futures broadly confirms that sequence. The March 2025 Deutsche Bank facility added up to £250 million of incremental financing and lifted reported lending capacity to about £1.6 billion. Official investor materials now go further, marketing roughly £2.2 billion of total lending capacity, £69 million of 2024 revenue, and £9 million of 2024 profit before tax. Independent coverage aligns on a narrower but still strong point: Abound turned profitable in April 2024 and surpassed £1 billion
    in cumulative lending during 2025. The newest institutional-proof milestone is the first public securitisation, a roughly £200 million issuance with an AAA-rated senior tranche. That matters because it suggests the loan book now has enough maturity and external scrutiny to support a broader funding base than warehouse and venture capital alone.'
