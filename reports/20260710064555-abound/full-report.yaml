      - number: '4.2'
        title: Capital stack and adequacy
        blocks:
          - type: paragraph
            body: >-
              Abound’s financial story is inseparable from its funding stack. The 2023, 2024, and 2025 announcements
              show a rapid progression from a £500m debt-and-equity round, to an £800m mixed round in 2024, to a further
              Deutsche Bank facility of up to £250m in 2025. Official and independent sources converge on the main
              pattern: Abound raises warehouse or asset-backed capacity from institutional lenders while layering in
              equity from venture investors. That is why capital adequacy matters more here than for a pure software
              company. Loan growth requires funding continuity, covenant headroom, and confidence from debt
              counterparties, while the B2B narrative may only soften that dependence over time. The official 2025 post
              frames diversified funding as resilience; independent press reframes the same point more plainly, noting
              total lending capacity of about £1.6bn after the Deutsche Bank deal. This is encouraging because it
              suggests institutional validation of the underwriting model, but it is also a core risk: if funding costs
              rise or lenders tighten terms, origination growth and profitability can compress quickly even if
              software-like gross margins improve on the platform side.
