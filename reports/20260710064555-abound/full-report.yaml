chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Abound’s public positioning is unusually clear for a UK consumer-credit company. The homepage and company
              overview page both frame the business as a lender that uses Open Banking and AI to make borrowing fairer
              for consumers and smarter for lenders. That message is not limited to one consumer-loan product. The
              company says it runs a two-sided model: it lends directly to UK consumers through unsecured personal
              loans, and it also sells or powers lending infrastructure for business partners that need underwriting,
              servicing, and distribution support. The same materials say Abound has already originated more than £1.5
              billion in loans, is running at roughly £110 million of monthly originations, and has powered more than 15
              partners. Official product pages and legal terms also establish that the consumer offer is aimed at
              UK-resident adults with at least one UK bank account that can be connected through Open Banking, while
              loans are marketed up to £20,000 with affordability assessed from transaction data rather than just bureau
              scores. The published operating footprint is still primarily London, but the careers page also discloses a
              Shenzhen office, implying some distributed operating or engineering presence beyond the UK head office.
