      - number: '5.2'
        title: Data and underwriting core
        blocks:
          - type: paragraph
            body: >-
              The company’s public differentiation remains rooted in transaction-data underwriting. Abound explains open
              banking in unusually plain technical language, explicitly describing APIs, PSD2, consented access to bank
              data, and the limits of traditional credit scores. The investors page adds the scale claim: more than 3bn
              transaction datapoints informing cashflow underwriting, with 50-70% lower default rates versus market
              benchmarks. Meanwhile the 2025 financing announcement links Render directly to lower defaults and lower
              consumer rates, and public partner pages say the system can either approve more customers at the same risk
              level or reduce losses without shrinking the book. This is the heart of the thesis. But there is an
              important caveat: Abound’s own support page shows the model still depends on rail quality. Unsupported
              banks such as Metro Bank and the need for six months of transaction history mean the product can exclude
              otherwise eligible borrowers. So while the technology is more individualized than bureau-only scoring, it
