  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and lending stack
        blocks:
          - type: paragraph
            body: >-
              Abound’s public product surface is broader than a single loan application. The company presents direct
              consumer lending, partner-powered lending products, and Render, a decisioning platform that can be reused
              across multiple workflows. Its public materials say the same core system can support direct personal
              loans, retail finance, premium finance, and lender-partner modules. The partner page is especially
              revealing because it decomposes the stack into debt funding, decisioning, onboarding, underwriting, and
              collections, implying a modular operating model rather than a point solution. That architecture matters
              strategically: it lets Abound treat direct lending as both a revenue stream and a proving ground for
              technology it can later export. The product surface also appears to be expanding. Public partner and
              investor materials reference IVF finance with Gaia, LemFi card launches, retail finance, and mortgages,
              all framed as extensions of the same underwriting and workflow base. The product-tech question is
              therefore not whether Abound has built a loan journey; it has. The question is how much of that stack is
              genuinely proprietary and repeatable across partners, markets, and credit contexts.
