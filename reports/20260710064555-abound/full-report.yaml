  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and the jobs Abound is trying to serve
        blocks:
          - type: paragraph
            body: >-
              Abound does not sit in a single narrow market bucket. Its core direct product is an unsecured UK personal
              loan, but the company’s partner pages make clear that management now thinks in broader credit-workflow
              terms: debt funding, underwriting, servicing, distribution, and regulatory permissions can all be sold as
              modules. That widens the relevant market from “online personal loans” into a larger open-banking-enabled
              credit stack. The direct-consumer use case still matters most because it proves the underwriting engine on
              Abound’s own balance sheet. But the public partner materials show adjacent verticals that can materially
              change the addressable opportunity: retail finance at checkout, premium finance for insurers and brokers,
              and cashflow underwriting sold to other lenders. LemFi Credit extends the adjacency further into
              immigrant-focused remittance-linked credit, where the user problem is not just borrowing but also sending
              money across borders and building a UK credit history. In market-definition terms, the included spend is
              therefore best understood as UK consumer credit and embedded-credit workflows where transaction-data-led
              affordability can change approval rates, price, or losses. Excluded from the core boundary are secured
              mortgages, SME working-capital products, and general-purpose payments infrastructure that does not touch
              credit decisioning.
