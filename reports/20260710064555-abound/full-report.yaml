  - id: TV004
    title: Valuation scenario framing table
    columns:
      - scenario
      - publicly visible support
      - what must be true
      - main breaker
    rows:
      - - Downside lender-only framing
        - Capital intensity and macro sensitivity dominate
        - Funding cost and credit performance prove ordinary rather than differentiated
        - Loan-book losses or covenant pressure
      - - Base hybrid framing
        - Profitable lender with emerging platform optionality
        - Render matters, but is not yet the majority of economics
        - No evidence of scalable B2B margin
      - - Upside platform-premium framing
        - Render becomes repeatable software with superior unit economics
        - Meaningful ARR, high margin, and durable partner adoption are proven
        - Render remains mostly internal tooling
      - - No-confidence case
        - Public data too mixed to price cleanly
        - Investor insists on point estimate from public sources
        - Debt capacity is conflated with equity value
      - - Strategic value case
        - Scarcity of profitable AI-led lenders adds premium
        - Strategic acquirer believes underwriting IP is durable
        - Open-banking rails fully commoditise the edge
    notes: Scenarios are directional framing devices, not point estimates.
