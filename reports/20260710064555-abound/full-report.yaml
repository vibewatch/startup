      - number: '4.4'
        title: Financial verdict and blockers
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to a business that has achieved unusual public momentum for a UK consumer
              lender: meaningful originations, visible profitability claims, and repeated access to institutional
              funding. That is a strong starting point. The problem is that the public record still does not reveal the
              variables that matter most in underwriting a credit business. Abound’s model may be attractive because
              better underwriting lowers defaults and improves funding confidence, but the sources reviewed do not show
              whether that edge is stable by cohort, whether it survives expansion into prime lending, or how much free
              cash the business actually produces after loan-funding and growth needs. Filing cadence also means
              statutory evidence trails management commentary, leaving investors dependent on more current but less
              detailed company claims and press summaries. The correct public-only stance is therefore constructive but
              incomplete: Abound looks more financially credible than a typical pre-profit fintech, yet final diligence
              still hinges on private data for covenant terms, funding costs, loss curves, collections, and the true
              contribution of Render to margin and valuation.
