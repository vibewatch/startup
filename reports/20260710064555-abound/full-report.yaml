  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization signals
        blocks:
          - type: paragraph
            body: >-
              The public record supports a simple top-level view of Abound’s model but not a clean full revenue split.
              Abound itself repeatedly describes a two-sided business: it lends directly to consumers and also supplies
              Render, its credit-decisioning platform, to B2B clients. That implies a blend of lending economics and
              emerging software or partner revenue. The investors page is the single clearest company disclosure, citing
              £69m of revenue and £9m of profit before tax in 2024, alongside a £110m monthly origination run rate and
              £1.5bn of total originations. Those numbers suggest the core engine is still consumer lending at scale,
              with any platform income likely additive rather than dominant today. Public list-pricing evidence also
              points to a traditional loan revenue model: Abound’s home page shows a representative loan example with a
              fee and a representative APR, while older coverage cited a roughly 24.8% representative APR. What remains
              missing is the key split: how much of current revenue comes from net interest margin and fees versus any
              B2B licensing, servicing, or decisioning income. Without that, Abound cannot be treated as a pure software
              multiple story even though Render may widen the long-run margin opportunity.
