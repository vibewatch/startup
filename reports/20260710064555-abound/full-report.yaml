      - number: '3.4'
        title: Brand proof, adverse signals, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Customer-proof data and review footprints underline how hard it is for a private lender to build durable
              mindshare. Monzo, 118 118 Money, Zopa, and Creditspring all show much larger visible review bases than
              Abound’s public footprint, while NatWest demonstrates that incumbency does not guarantee positive digital
              sentiment. These review signals are imperfect, but they are directionally useful for understanding brand
              familiarity, service expectations, and the likelihood that borrowers comparison-shop across multiple apps.
              For Abound, the biggest near-term competitive threat is not one single lender copying every feature. It is
              convergent capability: banks improving digital pre-qualification, neo-banks widening credit availability,
              and specialist lenders adopting similar bank-data narratives. Abound’s partner strategy and funding access
              help counter that threat, yet public sources still do not reveal whether its underwriting edge is
              widening, stable, or being arbitraged away by better-funded rivals. That unresolved point should stay
              central in diligence because it determines whether Abound is simply executing well in a temporarily
              favorable niche or building a lasting credit platform advantage.
