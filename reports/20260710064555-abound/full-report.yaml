      - number: '5.3'
        title: External infrastructure and build-vs-buy context
        blocks:
          - type: paragraph
            body: >-
              A central diligence question is whether Abound owns enough of the stack to remain differentiated as
              open-banking infrastructure matures. The external vendor landscape suggests raw connectivity is becoming
              easier to buy. TrueLayer publishes developer quickstarts, API libraries, and variable recurring payment
              guides; Yapily markets data and payment APIs across thousands of institutions; GoCardless emphasizes 99%
              UK account coverage; Salt Edge explicitly sells real-time bank data for lending decisions; and Tink and
              Plaid frame themselves as large-scale fintech infrastructure providers. The implication is not that Abound
              is merely reselling these rails. Rather, it suggests the moat cannot rest on bank connectivity alone. What
              Abound appears to be packaging is lending-specific workflow logic on top of increasingly standardised
              data-access primitives. The stronger the company’s loss performance, approval uplift, and partner
              deployment playbooks, the stronger that moat becomes. The weaker those proprietary outcomes are, the more
              easily a well-funded incumbent or infrastructure-savvy lender can reproduce the experience.
