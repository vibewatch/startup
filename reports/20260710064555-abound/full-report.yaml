              to contact it before missing a payment, describe the consequences of missed payments, explain
              refundability of late-payment fees in some cured cases, lay out a complaints process, and warn about
              loan-fee fraud and fake social-media approaches. Those are positive signals of operational seriousness. At
              the same time, external debt-advice charities show why this customer set can be difficult. StepChange and
