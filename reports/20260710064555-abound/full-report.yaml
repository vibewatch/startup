      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The risk surface is broadest exactly where Abound’s mission is strongest
            body: >-
              Serving borrowers with imperfect bureau files or financial stress can create social value, but it
              simultaneously raises vulnerability, complaint, suitability, and collections complexity.
            calloutType: risk
            claimRefs:
              - CR018
              - CR034
              - CR037
          - type: callout
            title: Public risk evidence is rich on harm pathways and poor on control effectiveness
            body: >-
              The company and regulators describe what can go wrong in detail. What remains missing is the private
              evidence that shows whether Abound contains those risks better than peers.
            calloutType: insight
            claimRefs:
