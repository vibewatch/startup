            body: >-
              The public record is strongest where it describes customer harm pathways. Abound’s own support pages say
              missed payments can trigger fees and CRA reporting, that customers in trouble should engage early, and
              that the company may use Open Banking to understand their situation. Its fraud page separately warns about
              loan-fee fraud, fake social-media approaches, and impersonation scams. External sources reinforce that
              these are not hypothetical. The FCA has a dedicated warning page on loan-fee fraud, Cifas reports record
              fraud volumes, Take Five focuses on scam prevention, and Action Fraud exists as a national reporting
              point. At the same time, debt-advice and mental-health sources show why this matters more for Abound than
              for some prime lenders. If borrowers are already stressed, the difference between responsible
              consolidation and harmful repeat borrowing can be thin. A lender that grows by serving mis-scored or
              stretched customers can create real social and reputational upside, but only if vulnerability handling,
              complaint resolution, and fraud prevention all work in practice.
