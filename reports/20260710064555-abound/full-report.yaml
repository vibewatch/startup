  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and conduct risk
        blocks:
          - type: paragraph
            body: >-
              Abound operates in one of the most tightly scrutinised corners of fintech: regulated consumer credit. Its
              own legal pages identify Fintern Ltd as the authorised entity, regulated by the FCA and registered with
              the ICO. That basic perimeter is not the real issue. The deeper conduct risk is how that permission is
              exercised when products touch vulnerable consumers, complaints, fraud, and automated decisions. Abound’s
              privacy notice is unusually revealing on this front: it describes CRA use, fraud-prevention agencies,
              automated fraud and money-laundering checks, and the possibility of service refusal or employment refusal
              if those systems flag risk. The complaints page, money-troubles page, and Consumer Duty context all point
              in the same direction: Abound’s real regulatory exposure is less about whether it is authorised and more
              about whether its underwriting, support, and servicing processes consistently deliver fair outcomes. That
              is a higher bar than basic compliance and is especially material for a lender targeting borrowers who may
              already be underserved or financially strained.
            claimRefs:
