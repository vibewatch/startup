              - CP036
              - CP037
              - CP038
          - type: callout
            title: Open-banking access alone is not a moat
            body: >-
              The FCA’s own framing suggests open-banking infrastructure is broadening across the market. If transaction
              data becomes table stakes, Abound’s durable edge must come from model performance, funding, and partner
              distribution rather than from bank connectivity by itself.
