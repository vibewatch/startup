            claimRefs:
              - CV027
              - CV032
              - CV037
              - CV038
              - CV040
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat the £800m 2024 figure as financing-round size, not a proven equity value
            body: >-
              Public sources consistently support a large mixed financing event, but none reviewed here cleanly disclose
              the exact post-money equity valuation or price per share.
            calloutType: assumption
            claimRefs:
              - CV001
              - CV002
              - CV024
              - CV036
              - CV039
          - type: callout
            title: Keep valuation confidence below business-quality confidence
            body: >-
              Abound looks commercially credible on public evidence, but exact valuation should remain a range-based
              judgment until cap-table, round-term, loan-book, and Render economics are produced.
            calloutType: recommendation
            claimRefs:
