  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor archetypes
        blocks:
          - type: paragraph
            body: >-
              Abound does not compete in a single neat bucket. Its direct product is an unsecured personal loan, but its
              public partner pages expand the relevant field to embedded checkout finance, premium finance, and
              decisioning modules for other lenders. That means the company faces at least four overlapping rival
              classes: prime incumbent banks that compete on headline APR and existing customer relationships; digital
              banks such as Zopa and Monzo that combine app-native servicing with broader banking ecosystems; specialist
              lenders such as 118 118 Money, Creditspring, and Salad Money that target weaker-file or financially
              stretched consumers in different ways; and embedded-finance or platform players such as Oakbrook that can
              supply technology or balance-sheet capacity to third parties. The strategic conclusion is that Abound’s
              differentiation has to travel across segments. It cannot rely only on saying it is a cheaper lender than
              subprime specialists or a more inclusive lender than prime banks; it must also defend why its open-banking
              decisioning and partner capability matter against firms that already have stronger brands, broader product
              shelves, or established funding and distribution advantages.
