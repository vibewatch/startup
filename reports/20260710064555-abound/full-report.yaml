      - number: '1.4'
        title: Milestones, customer proof, and what remains opaque
        blocks:
          - type: paragraph
            body: >-
              The milestone arc across Abound’s public sources is impressive but still selective. Investor materials say
              the business moved from launch in 2021 to profitability, an IVF-financing launch with Gaia, prime loans
              with Citi, Spain entry, and partner products such as LemFi card, retail finance, and mortgages by 2025.
              The company also markets itself as the fastest-growing UK tech company in the Sunday Times 2026 ranking
              and as a CNBC top-250 global fintech. Customer-proof signals are mixed but directionally positive:
              Trustpilot showed roughly 24.5 thousand reviews and a 4.9 score at the access date, while independent
              review summaries describe quick application flow and helpful customer service. Even so, the same source
              captures occasional friction around waiting times, repeated verification, and payment-processing
              communications. The largest remaining gap is price and governance transparency. Public filings and company
              pages together show scale, profitability, and financing depth, but they do not disclose a defensible
              post-money valuation, a full board map, or preference-stack detail. That means later chapters can safely
              treat Abound as a scaled, profitable, FCA-regulated growth lender and lending-platform hybrid, but should
              not assume a fully underwritten unicorn-style governance or valuation package from public evidence alone.
