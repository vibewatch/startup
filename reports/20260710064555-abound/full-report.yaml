              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV021
              - CV028
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV013
              - CV014
              - CV015
              - CV016
              - CV020
              - CV021
      - number: '8.4'
        title: Valuation stance and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              A public-only valuation stance should therefore be explicit, hybrid, and range-based. The bull case is
              straightforward: Abound shows real revenue, profitability, substantial funding access, and a product
              thesis that may deserve a premium if Render becomes repeatable, high-margin B2B software. The bear case is
              equally clear: the public record still does not reveal the cap table, round terms, debt-equity split,
              covenant package, loan-book quality, or current Render economics. Without that, a precise equity value
              would be false precision. The most honest stance is to say that Abound looks too commercially mature for a
              trivial valuation, yet too opaque for a confident point estimate, especially if observers conflate
              facility size with equity value. Any serious investment process should keep valuation confidence below the
              business-quality confidence. In practice, that means using public data only to frame the range and to
              preserve the caveat that the exact current valuation remains unresolved until priced private-market
              evidence and deeper financial data are produced.
            claimRefs:
              - CV022
              - CV023
              - CV030
              - CV031
              - CV033
              - CV037
              - CV038
              - CV039
              - CV040
