      - number: '7.3'
        title: Capital, macro, and policy risk
        blocks:
          - type: paragraph
            body: >-
              Abound’s credit model sits on top of both household balance-sheet risk and its own funding stack. Bank of
              England credit data, cost-of-living support guidance, debt-advice charities, and press on the Deutsche
              Bank facility all imply the same macro reality: if households weaken while funding tightens, the company
              can face pressure on both borrower quality and lending economics at the same time. That is a fundamental
              risk for any lender, but it matters even more here because Abound’s public story emphasises inclusion and
              partner-led expansion rather than only prime-bank economics. Add policy risk and the picture becomes more
              complex. Open banking is meant to expand competition, which can help Abound, but the same competitive
              logic can also erode moat if rival lenders gain access to similar rails. Consumer Duty, broader
              competition oversight, and parliamentary scrutiny create additional pressure for fair treatment and
              transparent outcomes. These are manageable risks for a well-run lender, but they raise the premium on
              control quality and capital resilience.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR025
              - CR029
              - CR036
              - CR039
          - type: figure
            figureRef: FR003
            claimRefs:
              - CR011
              - CR019
              - CR022
              - CR039
      - number: '7.4'
        title: Residual risk and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              Despite a large number of public risk signals, the most decision-useful controls remain private. The
              public record shows what can go wrong—poor data, scams, borrower stress, complaints, and policy
              pressure—but it does not show how well Abound actually handles those failures in practice. There are no
              public loss curves, no covenant packs, no decline reason-code distributions, no override rates, no
              model-governance materials, and no segment-level outcomes for vulnerable cohorts. That asymmetry matters.
              It means a reviewer can form a rich picture of the harm pathways while still lacking the internal evidence
              needed to quantify whether those pathways are contained. For diligence, this creates a practical
              conclusion: the residual risk is not that Abound has no controls. It almost certainly does. The residual
              risk is that the company’s public evidence does not let outsiders judge whether those controls are merely
              compliant, genuinely robust, or already under strain as the platform broadens across products and
              partners.
            claimRefs:
              - CR024
              - CR028
              - CR031
              - CR032
              - CR035
              - CR038
              - CR040
          - type: table
            tableRef: TR004
