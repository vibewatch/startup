  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: What public sources do and do not price
        blocks:
          - type: paragraph
            body: >-
              The first valuation question is definitional. Public sources clearly support an £800m financing event in
              2024, but they do not clearly prove that Abound was valued at exactly £800m on an equity or post-money
              basis. The company’s own 2024 announcement, Osborne Clarke’s legal summary, and UK Tech News all describe
              a mixed debt-and-equity transaction that could extend up to £800m, with Citi providing debt and GSR
              Ventures leading the Series B equity component. That is materially different from a clean disclosed equity
              valuation. The same ambiguity appears again in later coverage: debt-facility size, total funding capacity,
              and enterprise or equity value are often discussed in the same breath. Public filings do not fix the
              problem. Companies House confirms the entity and filing cadence, but it does not publish a live
              market-clearing value for the private company. The correct starting point is therefore restraint: public
              sources support a large financing package and a meaningful private-company step-up story, but not a single
              definitive, current equity price that can be cited without caveat.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV024
              - CV025
              - CV026
              - CV034
              - CV036
              - CV039
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV024
              - CV025
              - CV026
              - CV039
              - CV040
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV034
              - CV039
      - number: '8.2'
        title: Fundamental support for value
        blocks:
          - type: paragraph
            body: >-
              Public fundamentals are strong enough to support a constructive valuation discussion even if they cannot
              settle it. The investors page gives the cleanest disclosed operating snapshot: £69m revenue and £9m profit
              before tax in 2024, plus £1.5bn of total originations and £2.2bn of financing secured. Later 2025 articles
              add another useful marker by reporting £8m of net profit for the year to February 2025 and more than £1bn
              of total lending volume by October 2025. These figures matter because they move Abound out of the category
              of pre-revenue or purely narrative fintech. The business has publicly evidenced revenue scale,
              profitability, and institutional funding access. At the same time, those same facts warn against
              over-extrapolation. The model is capital intensive, loan-book dependent, and still partly explained by
              funding capacity rather than only by software margins. So while the fundamentals appear strong enough to
              reject a distressed or trivial valuation stance, they still do not justify treating Abound like a pure
              software company with frictionless recurring revenue.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV027
              - CV029
              - CV032
              - CV035
              - CV037
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV027
              - CV032
              - CV035
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV027
              - CV029
              - CV032
      - number: '8.3'
        title: Public comp anchors and their limits
        blocks:
          - type: paragraph
            body: >-
              The most accessible public comp anchors come from large listed banks, but they must be used carefully.
              July 2026 market data puts Barclays around $92bn of market capitalisation, HSBC around $336bn, Lloyds
              around $87bn, and NatWest around $71bn. Those banks also trade on modest public earnings multiples rather
              than on venture-style revenue multiples. This is useful evidence because it shows how public markets value
              mature, regulated, capital-intensive banking earnings even in a positive performance environment. It is
              also dangerous evidence if applied mechanically. Abound is dramatically smaller and structurally
              different. It combines a private loan-book lender with an early platform story around Render and does not
              offer anything close to the breadth, deposit franchise, or public liquidity of those banks. That means
              bank comps can only provide directional boundaries and valuation logic, not a direct mark. They support
              conservative thinking about capital intensity and macro sensitivity, but they cannot alone price the
              technology upside or the private-market scarcity premium that a credible growth-stage lender might still
              command.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
