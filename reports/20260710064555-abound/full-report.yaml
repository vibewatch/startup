            title: Abound competes across classes, not just against lenders that look like it
            body: >-
              The closest underwriting analogue is Salad, the closest B2B analogue is Oakbrook, the strongest app-first
              rivals are Monzo and Zopa, and the price anchors still come from big banks. Diligence should therefore
              test Abound’s edge separately by borrower segment and channel rather than assume one universal competitor
              set.
