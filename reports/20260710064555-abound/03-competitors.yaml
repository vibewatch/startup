- id: underwriting-distribution-and-lockin
  title: Underwriting, distribution, and lock-in comparison
  body: 'The clearest competitive split is between lenders that mostly monetise prime
    credit access and lenders that try to widen approval through workflow or data
    advantages. Barclays, HSBC, Lloyds, and NatWest show that high-street incumbents
    still set the lowest public APR anchors, and Lloyds in particular demonstrates
    the power of relationship distribution by restricting some journeys to current-account
    holders. Zopa and Monzo show a second model: loans are embedded inside a broader
    app relationship that deepens retention and lowers servicing friction. Abound’s
    strongest direct underwriting analogue in the public record is Salad Money, which
    also markets affordability assessment based on bank data rather than a headline
    credit-score test. Oakbrook is the closest structural analogue on the B2B side
    because it combines lending with a white-label technology platform. The implication
    is that Abound’s moat is not transaction-data access by itself. The FCA’s work
    on open banking suggests more lenders can obtain similar infrastructure, so defensibility
    will come from better models, repeatable partner distribution, funding access,
    and operational execution rather than from simple API connectivity.'
  claimRefs:
