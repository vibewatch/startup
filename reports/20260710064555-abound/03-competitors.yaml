  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-by-risk-band
    missingEvidence: Public pages expose only representative examples and list-style
      pricing, not realized APR by borrower cohort or risk grade.
    whyItMatters: Without realized pricing and acceptance data, it is impossible to
      tell whether Abound is winning on economics or only on marketing narrative.
    diligencePath: Request booked-rate distribution, pricing waterfalls, and conversion
      by score band and channel.
    relatedQuestionRefs:
    - QP023
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: partner-economics-and-lockin
    missingEvidence: Neither Abound nor Oakbrook publicly disclose partner contract
      terms, revenue share, churn, or integration switching cost.
    whyItMatters: These variables determine whether partner distribution creates a
      durable moat or only incremental volume.
    diligencePath: Request partner list, contract duration, integration scope, revenue
      concentration, and renewal history.
    relatedQuestionRefs:
    - QP018
    - QP025
    relatedTableRefs:
    - TP002
    - TP004
  - type: private-evidence-only
    severity: medium
    topic: brand-and-cac-by-channel
