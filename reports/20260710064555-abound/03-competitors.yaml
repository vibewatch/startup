- id: pricing-packaging-and-segment-choice
  title: Pricing, packaging, and segment choice
  body: Public price points show a wide market spread. Prime banks advertise representative
    APRs around the mid-single digits, while 118 118 Money publishes a near-50% representative
    APR and Creditspring wraps small loans in a subscription-like fixed-fee structure
    that still translates into a very high representative APR. Monzo sits between
    those poles with a much higher representative APR than large banks but a cleaner
    app experience and more flexible repayment policies. These comparisons matter
    because they show Abound is not merely choosing between 'cheap banks' and 'expensive
    fintechs'. Different lenders package risk, convenience, and target customer differently.
    Abound’s inclusion story is strongest when it competes for borrowers who can prove
    present affordability but do not fit prime-bank heuristics. It is weaker when
    a customer can already access a low-price bank offer or prefers a broader app
    relationship with a digital bank. The public record does not reveal realized net
    APR, take-up by score band, or conversion at the edge of acceptance, so the pricing
    debate remains incomplete even though list-pricing anchors are visible.
  claimRefs:
  - CP007
