callouts:
- calloutType: insight
  title: Abound competes across classes, not just against lenders that look like it
  body: The closest underwriting analogue is Salad, the closest B2B analogue is Oakbrook,
    the strongest app-first rivals are Monzo and Zopa, and the price anchors still
    come from big banks. Diligence should therefore test Abound’s edge separately
    by borrower segment and channel rather than assume one universal competitor set.
  claimRefs:
  - CP002
  - CP008
  - CP022
  - CP036
  - CP037
  - CP038
- calloutType: risk
  title: Open-banking access alone is not a moat
  body: The FCA’s own framing suggests open-banking infrastructure is broadening across
    the market. If transaction data becomes table stakes, Abound’s durable edge must
    come from model performance, funding, and partner distribution rather than from
    bank connectivity by itself.
  claimRefs:
  - CP033
  - CP040
