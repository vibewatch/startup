summary:
  headline: >-
    Research more: Abound looks like a credible, profitable, and scaled UK open-banking lender, but
    exact valuation still depends on private evidence about round terms, debt structure, loan-book quality,
    and Render economics.
  overallScore: 6.8
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: unknown
  keyMetrics:
