companyProfile:
  summary: >-
    Abound is the consumer-lending brand of Fintern Ltd, a London-based FCA-regulated fintech that
    uses open-banking transaction data and machine-learning-led affordability analysis to originate
    unsecured personal loans for UK borrowers who may be mis-scored by traditional bureau-led models.
    Public evidence also shows an emerging partner-platform layer around Render and institutional
    funding support from banks and asset managers, but issuer-style disclosure remains limited.
