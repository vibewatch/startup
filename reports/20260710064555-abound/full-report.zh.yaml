      - number: '1.4'
        title: 里程碑、客户证明与仍然不透明之处
        blocks:
          - type: paragraph
            body: >-
              Abound 公开来源中的里程碑曲线很亮眼，但仍有选择性。投资人材料称，公司从 2021 年上线一路走到盈利，并在 2025 年前后推出与 Gaia 合作的 IVF 融资、与 Citi
              合作的优质贷款、西班牙进入，以及 LemFi card、零售金融、按揭等伙伴产品。公司还把自己宣传为 Sunday Times 2026 排名中增长最快的英国科技公司，以及 CNBC 全球 250 强
              金融科技公司。客户证明信号喜忧参半但方向正面：截至访问日，Trustpilot 显示约 24.5 thousand 条评论和 4.9
              分；独立评论摘要则描述申请流程快、客服有帮助。即便如此，同一来源也记录了等待时间、重复验证和支付处理沟通上的偶发摩擦。最大剩余缺口是价格和治理透明度。公开申报文件与公司页面合在一起展示了规模、盈利能力和融资深度，但没有披露可防守的融后估值、完整董事会图谱或优先权栈细节。因此，后续章节可以安全地把
              Abound 视为一家已具规模、已盈利、受 FCA 监管的成长型贷款机构和贷款平台混合体，但不能只凭公开证据假设它已具备完整承销后的独角兽式治理或估值包。
