      - number: '8.4'
        title: 估值立场与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              只基于公开信息的估值立场，应当明确、混合、按区间表达。牛市情形很直接：Abound 有真实收入、盈利、可观融资通道，以及一个产品论点；如果 Render 变成可复制、高利润率的 B2B
              软件，就可能值得溢价。熊市情形同样清楚：公开记录仍未披露股权结构表、融资轮条款、债股拆分、契约包、贷款账簿质量或当前 Render 经济性。没有这些，精确股权价值就是虚假精确。最诚实的说法是，Abound
              从公开证据看商业成熟度太高，不能给微不足道的估值；但透明度又太低，不足以给出有信心的点估计，尤其当观察者把融资额度和股权价值混在一起时。任何严肃投资流程都应把估值信心放在业务质量信心之下。实际做法是只用公开数据框定区间，并保留限定：在私募市场定价证据和更深入财务数据拿出来之前，当前精确估值仍未解决。
