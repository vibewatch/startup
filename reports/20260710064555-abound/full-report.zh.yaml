      - number: '2.3'
        title: 开放银行普及，以及模式为何现在能放大
        blocks:
          - type: paragraph
            body: >-
              支撑 Abound 论点的基础设施比几年前成熟得多。Open Banking Limited 现在报告，英国已有超过 19 million 个活跃用户连接、每月支付超过 40 million 笔，API
              可用性高于 99.5%。City A.M. 引述 Abound CEO，将同一用户基数约化为接近 20
              million。这个规模重要，因为它降低了“消费者是否愿意连接账户？”这一风险，相比早期开放银行年份更低。它也让 B2B 分发更可信：贷款机构、零售商或汇款 app
              可以借用用户熟悉的账户连接行为，而不是从零发明一种新的承保输入。Abound 自己的材料也强化了这条逻辑。现金流承保页面称，在风险相同情况下通过率最高可提升
              40%；连接性文章则展示了对英国主要银行的广泛覆盖。更微妙的是，公司的伙伴页面显示，承保只是一个可销售组件。商户关心结账转化，保险公司关心收款和保障持续性，汇款 app
              关心移民信贷可得性。待完成任务的多样性，是市场能同时容纳直接贷款机构和平台提供商的原因之一。
