      - number: '7.4'
        title: 剩余风险与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              公开风险信号很多，但最能支持决策的控制措施仍在私下。公开记录说明哪些地方会出问题——数据质量差、诈骗、借款人承压、投诉、政策压力——却看不出 Abound
              在实践中到底多会处理这些失灵。外部看不到损失曲线、契约条款包、拒绝原因代码分布、人工覆写率、模型治理材料，也看不到弱势客群的分组结果。这种不对称很关键：审查者可以把伤害路径看得很清楚，却仍缺少内部证据，无法量化这些路径是否被压住。尽调上的实际结论是：剩余风险不是
              Abound 没有控制措施。它几乎肯定有。剩余风险在于，公司的公开证据不足以让外部判断这些控制只是合规达标、真正扎实，还是已经在平台跨产品和合作伙伴扩张时承压。
            claimRefs:
