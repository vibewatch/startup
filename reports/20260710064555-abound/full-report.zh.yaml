  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 直接借款人细分与待完成任务
        blocks:
          - type: paragraph
            body: >-
              Abound
              的直接客户论点，在主流信贷档案无法描述当前负担能力时最清晰。公司公开材料反复强调，要为薄档案、新来者或被分数驱动承保误读的人提供更公平的借款。其“搬到英国”解释文章直接描述了现实问题：强劲海外借款记录不会迁移到英国，可能让本来稳定的借款人实际变成“信贷隐形人”。Abound
              自己的信用分解释文章进一步淡化征信局分数的作用，称不存在一个决定资格的单一分数门槛。结合更广的产品页面，最容易理解的直接客户任务是债务整合、为被信贷档案错判的人提供更公平定价，以及让收入扎实但本地历史薄弱的新来借款人获得信贷。公司的支持和比较语境也很重要。个人贷款仍是一个会被比价、对预算敏感的购买。因此，Abound
              的产品不只要做出信贷决策，还要为那些正在主动比较贷款机构或试图摆脱更贵债务的人，提供更好的借款体验。
