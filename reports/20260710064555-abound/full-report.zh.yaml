  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争对手类型
        blocks:
          - type: paragraph
            body: >-
              Abound 并不在一个整齐的单一桶里竞争。它的自营产品是无抵押个人贷款，但公开伙伴页面把竞争战场扩展到嵌入式结账金融、保费金融，以及供其他贷款机构使用的决策模块。这意味着公司至少面对四类重叠对手：以头部 APR
              和既有客户关系竞争的优质客群传统银行；Zopa、Monzo 等把 app 原生服务与更广银行生态结合的数字银行；118 118 Money、Creditspring、Salad Money
              等以不同方式服务弱档案或财务承压消费者的专业贷款机构；以及 Oakbrook 等能向第三方提供技术或资产负债表能力的嵌入式金融 / 平台玩家。战略结论是，Abound
              的差异化必须能跨细分市场迁移。它不能只说自己比次级贷款专业机构更便宜，或比优质客群银行
              银行更包容；它还必须证明，面对已经拥有更强品牌、更宽产品货架或既有资金和分发优势的公司时，自己的开放银行决策和伙伴能力为什么重要。
