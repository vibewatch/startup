  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Abound 要服务的任务
        blocks:
          - type: paragraph
            body: >-
              Abound
              并不处在单一狭窄市场桶里。其核心自营产品是英国无抵押个人贷款，但公司的伙伴页面清楚表明，管理层现在按更宽的信贷工作流思考：债务资金、承保、服务、分发和监管许可都可以模块化出售。这把市场范围从“在线个人贷款”拓宽到更大的开放银行赋能信贷栈。直接面向消费者的用例仍然最重要，因为它在
              Abound 自有资产负债表上验证了承保引擎。但公开伙伴材料展示的相邻垂直领域可能实质改变可服务机会：结账场景零售金融、面向保险公司和经纪人的保费金融，以及出售给其他贷款机构的现金流承保。LemFi Credit
              又把邻近性延伸到以移民为中心、与汇款联动的信贷；这里的用户问题不只是借钱，还包括跨境汇款和建立英国信用历史。按市场定义，纳入范围因此最好理解为英国消费信贷和嵌入式信贷工作流，其中交易数据驱动的负担能力评估能改变通过率、定价或损失。核心边界之外则是有抵押按揭、SME
              营运资金产品，以及不触达信贷决策的通用支付基础设施。
