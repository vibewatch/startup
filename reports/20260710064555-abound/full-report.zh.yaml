      - number: '2.2'
        title: 需求规模、服务不足人群与公开市场信号
        blocks:
          - type: paragraph
            body: >-
              最可靠的公开规模锚点来自英国官方月度消费信贷统计，而不是通用金融科技 TAM 幻灯片。Bank of England 发布数据显示，2026 年 1 月净消费信贷借款为 £1.8 billion，2 月为
              £1.9 billion。其中，个人贷款等非卡消费信贷 1 月为 £0.9 billion，2 月为 £1.2 billion。年增长率分别保持在 8.3% 和 8.5% 的高位，新发个人贷款定价徘徊在 9.0%
              左右。这些数据点不等于 Abound 自己的可服务市场，但确实说明底层信贷池很大且仍在增长。需求侧，Abound
              自己的内容反复指向传统评分可能误读的人群：薄档案借款人、新来英国的人、有过历史信用“瑕疵”的消费者，以及需要债务整合但当前现金流仍稳定的人。LemFi Credit
              页面显示，相邻需求也可能来自移民：他们希望获得一条合规信贷额度，并与汇款需求相连。合在一起，这些来源提示，正确的需求框架不是“全部英国消费信贷”，而是开放银行可见性能相对静态征信局数据显著改善负担能力评估的那一部分。
