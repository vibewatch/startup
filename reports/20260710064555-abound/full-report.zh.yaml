chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与运营版图
        blocks:
          - type: paragraph
            body: >-
              Abound 作为英国消费信贷公司的公开定位异常清晰。官网和公司概览页都把它定义为一家借助开放银行和 AI
              让消费者借款更公平、让贷款机构更聪明的贷款公司。这个叙事并不局限于单一消费贷款产品。公司称自己经营双边模式：一边以无抵押个人贷款直接向英国消费者放款，一边向需要承保、服务和分发支持的企业伙伴销售或驱动放贷基础设施。同一批材料称，Abound
              已累计发放超过 £1.5 billion 贷款，月放款额约 £110 million，并已支持 15
              个以上合作伙伴。官方产品页和法律条款还确认，消费者产品面向英国居民成年人，申请人至少拥有一个可用开放银行连接的英国银行账户；贷款最高宣传至
              £20,000，负担能力主要根据交易数据评估，而不只看征信局分数。已披露的运营版图仍以伦敦为主，但招聘页也披露了深圳办公室，暗示英国总部之外存在一定分布式运营或工程能力。
