      - number: '2.4'
        title: 约束、投诉强度与公开 TAM 精度的上限
        blocks:
          - type: paragraph
            body: >-
              基础设施强并不等于市场没有摩擦。FCA 2025
              年研究说明是一块有用的制衡材料，因为它明确提醒：开放银行和开放金融扩张仍面对老旧技术系统、数据标准不一致和消费者认知不足。这些不是抽象问题：依赖最新银行连接的贷款机构，在借款人最近换行时仍会失去覆盖；公众对金融数据共享的信任也仍不均衡。投诉数据还提醒投资人，英国消费贷款在运营上很敏感。Financial
              Ombudsman Service 在 2025/26 年记录了 7,738
              起个人贷款投诉，另有超过一千起分期短期贷款投诉，说明承保、催收、沟通和负担能力流程仍承受政治和声誉暴露。竞争对手与评论证据从买方角度强化了同一点：客户奖励速度、透明度和简单的 app
              服务，但沟通差或支持笨拙会很快变得可见。尽调层面，最大市场级限制是精度：公开来源能证明需求、增长和基础设施就绪，但无法干净隔离 Abound 自己的 TAM、SAM
              和份额，因为伙伴放款量、活跃借款人数和产品级组合仍是私有信息。
            claimRefs:
