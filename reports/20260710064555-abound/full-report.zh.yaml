  - id: TV004
    title: 估值情景框架表
    columns:
      - 情景
      - 公开可见支撑
      - 必须成立的条件
      - 主要推翻因素
    rows:
      - - 下行情景：纯贷款机构框架
        - 资本密集度和宏观敏感性占主导
        - 融资成本和信用表现被证明普通、并无差异化
        - 贷款账簿损失或契约压力
      - - 基准情景：混合框架
        - 盈利贷款机构，同时有初现的平台可选性
        - Render 很关键，但尚未贡献大部分经济性
        - 缺少可规模化 B2B 利润率证据
      - - 上行情景：平台溢价框架
        - Render 变成可复制软件，单位经济性更优
        - 有意义的 ARR、高利润率和持久伙伴采用得到证明
        - Render 仍主要是内部工具
      - - 无信心情景
        - 公开数据太混杂，无法干净定价
        - 投资者坚持只凭公开来源给点估值
        - 债务容量被混同为股权价值
      - - 战略价值情景
        - 盈利型 AI 驱动贷款机构稀缺，带来溢价
        - 战略收购方相信承保 IP 持久
        - 开放银行通道完全商品化并抹平优势
    notes: 情景只是方向性框架工具，不是点估值。
    claimRefs:
      - CV022
      - CV023
      - CV029
      - CV030
      - CV031
      - CV033
