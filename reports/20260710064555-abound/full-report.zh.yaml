              年文章称，Abound 的模型服务于那些信用档案薄或失真、但财务健康扎实的人，许多客户用产品整合更昂贵债务。同一批文章称，这类客户在贷款期内平均节省超过
              £1,000；如果属实，客户价值就比一句泛泛的“更公平借款”更具体。规模标记也说明这不是利基实验：到 2025 年 10 月，Abound 放款量已超过 £1bn；其官网称累计放款高于
