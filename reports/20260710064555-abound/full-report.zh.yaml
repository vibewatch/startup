      - number: '6.3'
        title: 伙伴客户与渠道扩张
        blocks:
          - type: paragraph
            body: >-
              Abound 的客户群比直接借款人更宽，因为公司越来越多通过伙伴产品触达终端用户。最清晰的公开证明点是 Gaia 和 LemFi，此外还有零售金融和保费金融伙伴页面。Gaia
              展示了这件事为什么重要：生育治疗是一笔大额、情绪负荷高、一次性集中的支出，融资结构可以重塑客户可得性。LemFi 把这种模式延伸到移民和汇款联动的信贷需求。同时，Abound
              的商户和保费金融页面展示了不同于经典无抵押贷款的客户任务：更顺滑的结账、更高批准率、更灵活的保费支付，以及围绕催收或支付连续性的更低摩擦。伙伴渠道从两个方面改变客户地图。第一，它把 Abound
              带入消费者未必从搜索个人贷款开始的需求状态。第二，Abound
              最强的未来获客可能嵌入在其他旅程里，使直接评论足迹不再是衡量真实触达的强指标。公开证据足以说明伙伴路线真实存在，但仍太薄，无法衡量哪些渠道最能留住客户或产生最健康的信贷结果。
