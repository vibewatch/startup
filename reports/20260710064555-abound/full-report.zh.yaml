  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与放贷栈
        blocks:
          - type: paragraph
            body: >-
              Abound 的公开产品表面比单一贷款申请更宽。公司呈现了直接消费放贷、伙伴驱动的贷款产品，以及可在多个工作流复用的决策平台
              Render。公开材料称，同一套核心系统可以支持直接个人贷款、零售金融、保费金融和贷款伙伴模块。伙伴页面尤其有信息量，因为它把栈拆成债务资金、决策、开户、承保和催收，暗示这是一种模块化运营模式，而不是点状解决方案。这种架构具有战略意义：它让
              Abound 能把直接放贷同时当作收入流和技术试验场，之后再把技术输出。产品表面似乎也在扩大。公开伙伴和投资人材料提到与 Gaia 合作的 IVF 融资、LemFi card
              上线、零售金融和按揭，并把它们都定义为同一套承保和工作流基础的延伸。因此，产品技术问题不是 Abound 是否已经搭出贷款旅程；它已经搭出。问题在于，这套栈有多少真正专有，并能在伙伴、市场和信贷语境中重复复制。
            claimRefs:
