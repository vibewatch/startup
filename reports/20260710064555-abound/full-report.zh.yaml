      - 为何重要
      - 具体尽调路径
    rows:
      - - 已定价股权参照和股权结构表
        - 缺少它，就没有干净的当前股权标记
        - 要求提供上一轮条款、每股价格、稀释和期权池
      - - 债务 / 股权拆分和融资安排经济性
        - 需要把企业资金支撑与股权价值拆开
        - 要求提供融资安排定价、契约和债务余额
      - - 按批次划分的贷款账簿表现
        - 需要用来判断贷款业务盈利的耐久性
        - 要求按分部提供放款批次、净损失和资本消耗
      - - Render 收入和毛利率
        - 需要用来证明任何软件溢价
        - 要求提供 ARR、利润率、流失率和伙伴经济性
      - - 现金流转化和资本需求
        - 需要把会计利润桥接到股权价值
        - 要求提供资金管理、烧钱情况和未来资本计划
    notes: 这些阻断项说明，本报告为何应保留确切估值未解决的判断。
