  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现信号
        blocks:
          - type: paragraph
            body: >-
              公开记录支持一个简单的顶层判断：Abound 的模式可以看清，但完整收入拆分看不清。Abound 自己反复描述一门双边业务：一边直接向消费者放贷，一边向 B2B 客户提供 Render
              这一信贷决策平台。这意味着收入混合了放贷经济性以及正在形成的软件或伙伴收入。投资人页面是最清晰的公司披露，列出 2024 年收入 £69m、税前利润 £9m，同时给出 £110m 月放款节奏和 £1.5bn
              累计放款。这些数字提示，核心引擎今天仍是规模化消费贷款，任何平台收入更可能是增量，而非主导。公开列表定价证据也指向传统贷款收入模式：Abound 主页展示带费用和代表性 APR 的代表性贷款示例；更早报道则引用约
              24.8% 的代表性 APR。缺失的是关键拆分：当前收入中多少来自净息差和费用，多少来自 B2B 许可、服务或决策收入。没有这个拆分，即便 Render 可能拓宽长期利润率机会，也不能把 Abound
              当成纯软件倍数故事。
