    借助开放银行交易数据和机器学习驱动的负担能力分析，为可能被传统征信局模型错判的英国借款人发放无抵押个人贷款。公开证据还显示，它围绕 Render 正在形成伙伴平台层，并获得银行和资产管理机构的机构资金支持，但发行人式披露仍然有限。
