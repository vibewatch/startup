      - number: '5.3'
        title: 外部基础设施与自建 / 采购语境
        blocks:
          - type: paragraph
            body: >-
              核心尽调问题是：随着开放银行基础设施成熟，Abound 是否拥有足够多的栈来保持差异化。外部供应商格局显示，原始连接能力正变得更容易购买。TrueLayer 发布开发者快速入门文档、API
              库和可变定期支付指南；Yapily 面向数千家机构营销数据和支付 API；GoCardless 强调 99% 英国账户覆盖；Salt Edge 明确销售用于贷款决策的实时银行数据；Tink 和 Plaid
              则把自己定位为大规模金融科技 基础设施提供商。这并不意味着 Abound 只是转售这些轨道。更准确地说，它说明护城河不能只押在银行连接上。Abound
              看起来是在日益标准化的数据访问原语之上，打包面向放贷的工作流逻辑。公司的损失表现、批准提升和伙伴部署打法 越强，护城河就越强；这些专有结果越弱，资金充足的传统机构或懂基础设施的贷款机构就越容易复刻体验。
