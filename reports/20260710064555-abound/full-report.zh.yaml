            body: >-
              Abound 的财务故事离不开资金栈。2023、2024 和 2025 年公告显示，它从 £500m 债务和股权轮，迅速推进到 2024 年 £800m 混合融资，再到 2025 年最高 £250m 的
              Deutsche Bank 追加额度。官方与独立来源在主要模式上趋同：Abound
              从机构贷款人处获取仓储或资产支持能力，同时叠加风险投资人的股权。这也是资本充足性在这里比纯软件公司更重要的原因。贷款增长需要资金连续性、契约余地和债务交易对手信心；B2B 叙事或许只能随时间推移软化这种依赖。官方
              2025 年文章把多元化融资包装为韧性；独立媒体更直接地重述同一点，称 Deutsche Bank 交易后总放贷能力约
              £1.6bn。这令人鼓舞，因为它暗示机构认可了承保模型；但它也是核心风险：如果资金成本上升或贷款人收紧条款，即便平台侧类似软件的毛利率改善，放款增长和盈利能力也可能很快受压。
