      - number: '1.3'
        title: 融资时间线、盈利与规模信号
        blocks:
          - type: paragraph
            body: >-
              Abound 的融资故事比估值故事更容易验证。公司自己的文章给出清晰资本时间线：2021 年 £32 million 启动融资包、2022 年初累计融资达到 £40 million、2023 年融资超过 £500
              million，以及 2024 年 5 月最高可达 £0.8 billion 的一揽子融资，组合包括 Citi 资产支持债务和 GSR Ventures 领投的 Series B 股权部分。Open
              Banking Expo、Business Matters、City A.M. 和 FinTech Futures 的独立报道大体确认了这条线索。2025 年 3 月，Deutsche Bank 额度又增加最高
              £250 million 的增量融资，并把报道中的放贷能力抬升到约 £1.6 billion。官方投资人材料现在走得更远，宣传总放贷能力约 £2.2 billion、2024 年收入 £69
              million、2024 年税前利润 £9 million。独立报道在一个更窄但仍很强的点上相互印证：Abound 于 2024 年 4 月实现盈利，并在 2025 年累计放款超过 £1
              billion。最新的机构背书里程碑是首笔公开证券化：一笔约 £200 million 发行，其中优先档获 AAA
              评级。这个节点重要，因为它暗示贷款账簿已有足够成熟度和外部审视，可以支撑比仓储融资和风险资本更广的资金基础。
