              Abound 的信贷模型架在家庭资产负债表风险和自身资金栈之上。Bank of England 信贷数据、生活成本支持指南、债务建议慈善机构，以及关于 Deutsche Bank
              额度的媒体报道，都指向同一个宏观现实：如果家庭走弱、资金同时收紧，公司会同时承受借款人质量和放贷经济性压力。这是任何贷款机构的根本风险，但在这里更重要，因为 Abound
              的公开故事强调包容和伙伴主导扩张，而不只是优质客群 银行经济性。再加上政策风险，图景更复杂。开放银行旨在扩大竞争，这可能帮助
