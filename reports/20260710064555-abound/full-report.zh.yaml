        blocks:
          - type: paragraph
            body: >-
              Abound 发布并吸引到足够多的公开牵引力指标，能说明业务已不再是早期实验，但还不足以让外部人有信心承销经济性。公开来源显示，到 2023 年已有 150,000+ 客户，当时月环比增长 30%；到 2025
              年 10 月累计放款量超过 £1bn，并在 2024 年 4 月实现盈利。公司自己的投资人材料补充了 2024 年收入和 PBT 快照；2024 年公告还提到团队从 65 人翻倍到 130
              人的计划。这些都是有用的规模标记，但没有揭示盈利背后的机制。公开披露仍没有给出净息差、按分群
              加权平均票息、加权平均资金成本、预期损失、催收效率、回收率、CAC、复用率或伙伴收入分成。这个缺口重要，因为贷款机构可以交出强劲放款量甚至会计利润，却仍容易受到资金冲击、逆向选择或伙伴集中的影响。如果更高利润率的
              B2B 收入变得重要，Render 可能改善图景；但公开材料今天没有量化这次转变。
