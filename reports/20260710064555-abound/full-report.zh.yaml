      - number: '8.2'
        title: 支撑价值的基本面
        blocks:
          - type: paragraph
            body: >-
              公开基本面足以支撑建设性的估值讨论，即便不能给出定论。投资者页面提供了最干净的运营快照：2024 年收入 £69m、税前利润 £9m，累计发放 £1.5bn，已锁定融资 £2.2bn。2025
              年后续文章又补充了有用标记：截至 2025 年 2 月的年度净利润 £8m，到 2025 年 10 月累计贷款量超过 £1bn。这些数字重要，因为它们把 Abound
              从尚无收入或纯叙事金融科技公司中拉出来。公司已公开证明收入规模、盈利能力和机构资金通道。同时，同一组事实也提醒不能过度外推。这个模式资本密集、依赖贷款账簿，部分仍由融资能力解释，而不只是软件利润率。因此，基本面看起来强到足以排除困境或小体量估值，但仍不足以把
              Abound 当作一家拥有无摩擦经常性收入的纯软件公司。
