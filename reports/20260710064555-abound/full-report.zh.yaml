      - number: '1.2'
        title: 创始人、管理层可信度与治理披露
        blocks:
          - type: paragraph
            body: >-
              公开记录强有力地支持 Gerald Chappell 和 Michelle He 是公司的创始核心，但问题从创始人转向完整治理时，披露就变弱了。Abound 官方页面多次确认 Chappell 是联合创始人兼
              CEO，并称其此前在 McKinsey 和 EY 拥有合伙人级经验，聚焦数字放贷和信贷分析。Michelle He 被介绍为联合创始人兼 COO，曾在 EY 担任领导岗位，并拥有 AI
              博士学位。公开领导团队页面还列出首席风险官 Mark London，进一步说明管理班子围绕信贷风险分析搭建。Companies House 佐证 Gerald Chappell 和 Dr Cong He
              是在任董事，2020 年的任命日期与公司创立期吻合。话虽如此，抓取到的公开材料仍没有给出清晰的董事会名册、独立董事情况或投资人控制权摘要。Companies House 显示历史董事变更和 PSC
              通知，但看不到风投治理最关键的经济条款。后期尽调读到这里，结论是创始人与市场匹配的信号扎实，治理透明度却仍然只有一部分。
