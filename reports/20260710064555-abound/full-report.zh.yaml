        title: 承保、分发与锁定对比
        blocks:
          - type: paragraph
            body: >-
              最清晰的竞争分野，在于有些贷款机构主要变现优质客群 信贷准入，另一些则试图借工作流或数据优势扩大批准。Barclays、HSBC、Lloyds 和 NatWest 说明，高街传统银行仍设定最低公开 APR
              锚点；Lloyds 尤其展示了关系分发的力量，因为它把部分流程限制在往来账户持有人内。Zopa 和 Monzo 展示第二种模式：贷款嵌在更宽的 app 关系里，加深留存并降低服务摩擦。公开记录中，Abound
              最强的直接承保类比是 Salad Money，后者也宣传基于银行数据而非表面信用分测试来评估负担能力。B2B 侧最接近的结构类比是 Oakbrook，因为它把放贷与白标技术平台结合起来。由此可见，Abound
              的护城河不在交易数据访问本身。FCA 关于开放银行的工作表明，更多贷款机构可以获得类似基础设施，因此防御性将来自更好的模型、可复制的伙伴分发、融资准入和运营执行，而不是简单 API 连接。
