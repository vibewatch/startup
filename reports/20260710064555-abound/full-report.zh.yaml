  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开来源能定价什么，不能定价什么
        blocks:
          - type: paragraph
            body: >-
              第一个估值问题先要界定口径。公开来源清楚支持 2024 年一笔 £800m 融资事件，但不能清楚证明 Abound 的股权或投后估值正好是 £800m。公司 2024 年公告、Osborne Clarke
              的法律摘要和 UK Tech News 都把这笔交易描述为债权加股权的混合融资，最高可达 £800m，其中 Citi 提供债务，GSR Ventures 领投 Series B
              股权部分。这和干净披露的股权估值有本质差别。后续报道也有同样模糊：债务额度、总融资能力、企业价值或股权价值常被放在一起讨论。公开申报也没有解决这个问题。Companies House
              确认实体和申报节奏，但不会发布这家私营公司的实时市场出清价值。因此正确起点是克制：公开来源支持一笔大型融资组合和一个有意义的私营公司估值跃升故事，但不支持外部无保留引用一个确定、当前的股权价格。
