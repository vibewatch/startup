      - number: '5.2'
        title: 数据与承保核心
        blocks:
          - type: paragraph
            body: >-
              公司的公开差异化仍扎根在交易数据承保。Abound 用异常直白的技术语言解释开放银行，明确提到 API、PSD2、经同意访问银行数据，以及传统信用分的局限。投资人页面补充了规模声明：超过 3bn
              个交易数据点支撑现金流承保，相比市场基准违约率低 50-70%。与此同时，2025 年融资公告把 Render
              直接连接到更低违约和更低消费者利率；公开伙伴页面称，系统可以在风险相同水平下批准更多客户，或在不缩小贷款账簿的情况下降低损失。这是整个论点的核心。但有一个重要 限定：Abound
              自己的支持页面显示，模型仍依赖基础轨道质量。Metro Bank 等不支持银行，以及需要 6
              个月交易历史，意味着产品可能排除本来合格的借款人。所以，虽然这项技术比只看征信局评分更个体化，它并非无摩擦。基础设施和数据可得性仍是实时约束。
