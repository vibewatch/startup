      - number: '8.3'
        title: 公开可比锚点及其边界
        blocks:
          - type: paragraph
            body: >-
              最容易取得的公开可比锚点来自大型上市银行，但使用时必须谨慎。2026 年 7 月市场数据显示，Barclays 市值约 $92bn，HSBC 约 $336bn，Lloyds 约 $87bn，NatWest 约
              $71bn。这些银行也以温和的公开盈利倍数交易，而不是创投式收入倍数。这个证据有用，因为它说明在业绩向好的环境中，公开市场如何给成熟、受监管、资本密集的银行收益定价。机械套用则很危险。Abound
              规模小得多，结构也完全不同：它把私营贷款账簿放贷方和围绕 Render
              的早期平台故事结合在一起，却没有这些银行的业务宽度、存款业务基础或公开流动性。因此，银行可比只能提供方向性边界和估值逻辑，不能直接打标。它们支持对资本强度和宏观敏感性保持保守，但不足以单独定价技术上行，或一个可信成长期放贷方在私募市场可能仍能拿到的稀缺性溢价。
