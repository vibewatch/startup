company:
  name: Abound
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a constructive but explicitly unresolved valuation
    stance for Abound. The company shows enough revenue, profitability, and institutional
    funding access to merit serious value, but the public record still does not disclose
    a clean current equity price, cap-table terms, loan-book quality, or Render economics
    sufficient for a precise mark.
sections:
- id: what-public-sources-do-and-do-not-price
  title: What public sources do and do not price
  body: 'The first valuation question is definitional. Public sources clearly support
    an £800m financing event in 2024, but they do not clearly prove that Abound was
    valued at exactly £800m on an equity or post-money basis. The company’s own 2024
    announcement, Osborne Clarke’s legal summary, and UK Tech News all describe a
    mixed debt-and-equity transaction that could extend up to £800m, with Citi providing
    debt and GSR Ventures leading the Series B equity component. That is materially
    different from a clean disclosed equity valuation. The same ambiguity appears
    again in later coverage: debt-facility size, total funding capacity, and enterprise
    or equity value are often discussed in the same breath. Public filings do not
    fix the problem. Companies House confirms the entity and filing cadence, but it
    does not publish a live market-clearing value for the private company. The correct
    starting point is therefore restraint: public sources support a large financing
    package and a meaningful private-company step-up story, but not a single definitive,
    current equity price that can be cited without caveat.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV008
  - CV024
  - CV025
  - CV026
  - CV034
  - CV036
  - CV039
  - CV040
  tableRefs:
