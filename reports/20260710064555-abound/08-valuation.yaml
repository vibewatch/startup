- id: TV005
  title: Main valuation blockers table
  columns:
  - missing private evidence
  - why it matters
  - exact diligence path
  rows:
  - - Priced equity reference and cap table
    - Without it there is no clean current equity mark
    - Request last round terms, price per share, dilution, and option pool
  - - Debt-equity split and facility economics
    - Need to separate enterprise support from equity value
    - Request facility pricing, covenants, and debt balances
  - - Loan-book performance by cohort
    - Needed to judge durability of lender earnings
    - Request vintages, net losses, and capital consumption by segment
  - - Render revenue and gross margin
    - Needed to justify any software premium
    - Request ARR, margin, churn, and partner economics
  - - Cash-flow conversion and capital needs
    - Needed to bridge accounting profit to equity value
    - Request treasury, burn, and forward capital plan
  notes: These blockers explain why the report should preserve an unresolved exact
    valuation.
  claimRefs:
  - CV038
  - CV039
  - CV040
- id: TV006
  title: Valuation interpretation table
  columns:
  - valuation input
  - helps with
  - cannot answer
  rows:
  - - Funding-round size
    - Shows investor appetite and capital access
    - Exact equity price or dilution
  - - Revenue and profit disclosures
    - Supports commercial credibility
    - Cash conversion or cohort quality
  - - Public bank market caps
    - Anchor capital-intensity and public-market discipline
    - Private scarcity premium or Render optionality
  - - Debt-facility capacity
    - Shows lending headroom
    - Current enterprise value
  - - Tracker and press summaries
    - Corroborate chronology
    - Binding transaction terms
  notes: This table separates the meaning of each public data type to reduce false
    precision.
