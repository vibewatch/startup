- id: public-comp-anchors-and-their-limits
  title: Public comp anchors and their limits
  body: The most accessible public comp anchors come from large listed banks, but
    they must be used carefully. July 2026 market data puts Barclays around $92bn
    of market capitalisation, HSBC around $336bn, Lloyds around $87bn, and NatWest
    around $71bn. Those banks also trade on modest public earnings multiples rather
    than on venture-style revenue multiples. This is useful evidence because it shows
    how public markets value mature, regulated, capital-intensive banking earnings
    even in a positive performance environment. It is also dangerous evidence if applied
    mechanically. Abound is dramatically smaller and structurally different. It combines
    a private loan-book lender with an early platform story around Render and does
    not offer anything close to the breadth, deposit franchise, or public liquidity
    of those banks. That means bank comps can only provide directional boundaries
    and valuation logic, not a direct mark. They support conservative thinking about
    capital intensity and macro sensitivity, but they cannot alone price the technology
    upside or the private-market scarcity premium that a credible growth-stage lender
    might still command.
  claimRefs:
  - CV009
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
  - CV015
  - CV016
