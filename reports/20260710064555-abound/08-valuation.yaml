- id: fundamental-support-for-value
  title: Fundamental support for value
  body: 'Public fundamentals are strong enough to support a constructive valuation
    discussion even if they cannot settle it. The investors page gives the cleanest
    disclosed operating snapshot: £69m revenue and £9m profit before tax in 2024,
    plus £1.5bn of total originations and £2.2bn of financing secured. Later 2025
    articles add another useful marker by reporting £8m of net profit for the year
    to February 2025 and more than £1bn of total lending volume by October 2025. These
    figures matter because they move Abound out of the category of pre-revenue or
    purely narrative fintech. The business has publicly evidenced revenue scale, profitability,
    and institutional funding access. At the same time, those same facts warn against
    over-extrapolation. The model is capital intensive, loan-book dependent, and still
    partly explained by funding capacity rather than only by software margins. So
    while the fundamentals appear strong enough to reject a distressed or trivial
    valuation stance, they still do not justify treating Abound like a pure software
    company with frictionless recurring revenue.'
  claimRefs:
  - CV005
  - CV006
  - CV007
  - CV027
  - CV029
  - CV032
  - CV035
  - CV037
  tableRefs:
  - TV002
