- id: market-size-and-demand
  title: Demand size, underserved cohorts, and public market signals
  body: 'The most reliable public sizing anchors come from official monthly UK consumer-credit statistics rather than from generic fintech TAM slides. Bank of England releases show net consumer-credit borrowing of £1.8 billion in January 2026 and £1.9 billion in February 2026. Within that, non-card forms of consumer credit such as personal loans ran at £0.9 billion in January and £1.2 billion in February. Annual growth remained strong at 8.3% and 8.5% respectively, while new personal-loan pricing hovered around 9.0%. Those datapoints do not equal Abound’s own addressable market, but they do show a large and still-growing underlying credit pool. On the demand side, Abound’s own content repeatedly points to groups that traditional scoring can misread: thin-file borrowers, people new to the UK, consumers with historic credit “blips,” and those who need debt consolidation but still have stable current cashflow. The LemFi Credit pages show that adjacent demand can also come from immigrants who
    want a compliant credit line linked to remittances. Together, these sources suggest the right demand framing is not “all UK consumer credit,” but the subset where open-banking visibility materially improves affordability assessment relative to static bureau data.'
