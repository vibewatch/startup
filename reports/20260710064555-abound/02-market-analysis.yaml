- id: constraints-and-caveats
  title: Constraints, complaint intensity, and the limits of public TAM precision
  body: 'Strong infrastructure does not make the market frictionless. The FCA’s 2025 research note is a useful counterweight because it explicitly warns that open-banking and open-finance expansion still faces outdated technology estates, inconsistent data standards, and low consumer awareness. Those are not abstract problems: a lender that depends on fresh bank connectivity still loses coverage when a borrower recently switched banks, and broader trust in financial-data sharing remains uneven. Complaint data also reminds investors that UK consumer lending is operationally sensitive. The Financial Ombudsman Service recorded 7,738 personal-loan complaints in 2025/26, alongside more than a thousand instalment short-term-lending complaints, showing that underwriting, collections, communications, and affordability processes remain politically and reputationally exposed. Competitor and review evidence reinforces the same point from a buyer perspective. Customers reward speed, transparency, and
    easy app-led servicing, but poor communication or clunky support can quickly become visible. For diligence, the biggest market-level limitation is precision: public sources can prove demand, growth, and infrastructure readiness, but they cannot cleanly isolate Abound’s own TAM, SAM, and share because partner volumes, active borrower counts, and product-level mix remain private.'
