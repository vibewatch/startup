  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: Public sources do not disclose Abound's active borrower count, funded-loan share by product, or partner-volume split.
    whyItMatters: Those inputs are needed to turn broad UK consumer-credit flows into a usable Abound-specific TAM, SAM, and SOM model.
    diligencePath: Request monthly active borrowers, funded accounts, partner-volume mix, and conversion by segment.
    relatedQuestionRefs:
    - QM021
    - QM026
  - type: stale
    severity: material
    topic: market-definition
    missingEvidence: Most public market anchors are monthly flows or company claims rather than a single third-party annual market report for UK personal loans.
    whyItMatters: A cleaner annual market view would help compare Abound against incumbents on share and penetration.
    diligencePath: Request the latest paid market reports or management's board materials on UK personal-loan market sizing.
    relatedQuestionRefs:
    - QM003
  - type: missing-source
    severity: minor
    topic: TM002 sizing lens
    missingEvidence: No public source in this run isolates Abound's exact share within unsecured personal loans versus partner-enabled credit.
    whyItMatters: The sizing-lens table is informative but not a market-share model.
    diligencePath: Obtain management operating metrics and lender-panel share data.
    relatedQuestionRefs:
    - QM021
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: minor
    topic: TM003 buyer map
    missingEvidence: The segment map captures the main public cohorts but not every funded partner vertical or geography.
    whyItMatters: Full buyer segmentation matters for GTM planning and valuation of the B2B route.
    diligencePath: Request a partner roster and pipeline segmented by product and geography.
    relatedQuestionRefs:
    - QM008
    relatedTableRefs:
    - TM003
  - type: stale
    severity: minor
    topic: TM001 market boundary
    missingEvidence: Public sources show the boundaries directionally but do not quantify exactly how much revenue sits in each adjacent market.
    whyItMatters: Boundary definition is strong, but mix matters for margin and sales-motion analysis.
    diligencePath: Request revenue and gross-profit split by direct lending, platform, and partner vertical.
    relatedQuestionRefs:
    - QM002
    relatedTableRefs:
    - TM001
