- id: adoption-drivers-and-enablers
  title: Open-banking adoption and why the model can scale now
  body: 'The enabling infrastructure behind Abound’s thesis is much more mature than it was even a few years ago. Open Banking Limited now reports more than 19 million active user connections and over 40 million monthly payments in the UK, with API availability above 99.5%. City A.M. quotes Abound’s CEO rounding the same user base to nearly 20 million. That scale matters because it lowers the “will consumers connect accounts?” risk relative to early open-banking vintages. It also makes B2B distribution more plausible: a lender, retailer, or remittance app can use familiar account-linking behaviour rather than inventing a new underwriting input from scratch. Abound’s own materials reinforce this logic. The cashflow-underwriting page claims approval uplift of up to 40% at the same risk, while the connectivity post shows broad bank coverage across major UK institutions. More subtly, the company’s partner pages show that underwriting is only one saleable component. Merchants care about checkout
    conversion, insurers care about collections and cover persistence, and remittance apps care about immigrant credit access. That diversity of jobs-to-be-done is one reason the market can support both direct lenders and platform providers.'
