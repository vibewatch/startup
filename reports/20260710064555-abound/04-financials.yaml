callouts:
- calloutType: insight
  title: Abound is more financially mature than the median fintech, but still structurally
    capital intensive
  body: Public disclosures show revenue, PBT, profitability timing, and repeated institutional
    funding access. That is materially stronger than a typical pre-profit fintech,
    but the business still depends on warehouse-style capital and credit performance
    rather than software gross margin alone.
  claimRefs:
  - CI003
  - CI011
  - CI012
  - CI029
  - CI036
- calloutType: risk
  title: The key underwriting unknown is not topline growth but the hidden bridge
    to cash economics
  body: Without cost of funds, delinquency curves, covenant terms, and B2B revenue
    mix, outsiders cannot determine whether recent profitability is deeply durable
    or simply favorable under current funding conditions.
  claimRefs:
  - CI025
  - CI030
  - CI031
  - CI032
  - CI040
