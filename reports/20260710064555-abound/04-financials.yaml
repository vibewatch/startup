  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: facility-covenants-and-funding-cost
    missingEvidence: No public source provides covenant terms, advance rates, triggers,
      or weighted-average funding cost across Citi, Deutsche Bank, Waterfall-linked
      funding, and other facilities.
    whyItMatters: These factors determine liquidity resilience and whether growth
      remains profitable as rates move.
    diligencePath: Request debt agreements, lender reporting packs, warehouse borrowing-base
      formulas, and hedging policy.
    relatedQuestionRefs:
    - QI010
    - QI011
    - QI012
    - QI021
    relatedTableRefs:
    - TI003
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: credit-performance-vintages
    missingEvidence: Public sources cite lower defaults qualitatively but do not disclose
      delinquency buckets, net charge-offs, recoveries, or vintage migration.
    whyItMatters: Abound’s underwriting edge only matters financially if it survives
      seasoning and collections.
    diligencePath: Request monthly vintages, roll rates, default curves, and collections
      recovery dashboards.
    relatedQuestionRefs:
    - QI008
    - QI017
    - QI026
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: render-revenue-mix
    missingEvidence: Render clients are named publicly, but current ARR, contract
      structure, and gross margin are undisclosed.
    whyItMatters: This determines whether Abound deserves any software-like valuation
      premium.
    diligencePath: Request B2B revenue bridge, signed client count, retention, and
      implementation economics.
    relatedQuestionRefs:
    - QI003
    - QI019
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
