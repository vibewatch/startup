- id: TI005
  title: Public financial gaps table
  columns:
  - missing private metric
  - impact on underwriting
  - exact diligence path
  rows:
  - - Facility covenants, advance rates, and triggers
    - Cannot judge liquidity resilience or downside headroom
    - Request debt agreements, covenant packs, and lender reporting
  - - Delinquency, default, and recovery curves
    - Cannot verify that cashflow underwriting truly delivers superior economics
    - Request cohort vintages and collections dashboards
  - - Funding cost and hedging policy
    - Cannot assess sensitivity to UK rates or spread widening
    - Request weighted-average cost of funds and refinancing plan
  - - Direct-vs-partner CAC and conversion
    - Cannot tell whether growth is efficiently acquired
    - Request channel economics and conversion funnels
  - - Render revenue, ARR, and gross margin
    - Cannot estimate whether platform income deserves software-style valuation credit
    - Request client contracts, ARR bridge, and churn
  - - Cash runway and unrestricted liquidity
    - Cannot distinguish accounting profitability from balance-sheet strain
    - Request treasury, liquidity, and monthly cash-flow reporting
  notes: These are the missing fields most likely to change the investment decision.
