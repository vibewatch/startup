- id: public-traction-and-unit-economics
  title: Public traction and unit-economics proxies
  body: Abound publishes and attracts enough public traction metrics to show that
    the business is no longer an early experiment, but not enough to underwrite economics
    with confidence. Public sources indicate 150,000+ customers by 2023, 30% month-on-month
    growth at that stage, £1bn+ total lending volume by October 2025, and profitability
    by April 2024. The company’s own investor materials add a 2024 revenue and PBT
    snapshot, and the 2024 announcement pointed to a team-doubling plan from 65 to
    130 employees. These are useful scale markers, yet they do not reveal the mechanics
    underneath profitability. There is still no public disclosure of net interest
    margin, weighted-average coupon by cohort, weighted-average cost of funds, expected
    loss, collections efficiency, recovery rate, CAC, repeat usage, or partner revenue
    share. The gap matters because a lender can post strong volume and even accounting
    profit while still being vulnerable to funding shocks, adverse selection, or partner
    concentration. Render could improve the picture if higher-margin B2B revenue becomes
    material, but public materials do not quantify that transition today.
  claimRefs:
  - CI013
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI030
  - CI031
  - CI032
  - CI036
