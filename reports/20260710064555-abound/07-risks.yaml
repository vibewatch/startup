  - - Data error exclusion
    - Incorrect CRA or fraud data
    - ICO credit and correction rights pages
    - Correction rights exist but operational speed unknown
  - - Mental-health vulnerability
    - Financial stress worsens decision-making and vice versa
    - Money and Mental Health
    - No Abound-specific mental-health process disclosed
  - - Complaint dissatisfaction
    - Service or affordability dispute
    - Complaints page and FOS route
    - Three-business-day target and escalation path
  notes: Rows focus on borrower harm rather than enterprise-only risk.
