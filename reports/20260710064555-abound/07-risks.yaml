  - - Fraud and impersonation
    - Digital lending journeys attract fake-fee and identity scams
    - Abound fraud page, FCA warning, Cifas, Action Fraud
    - high
    - Request fraud loss rates, controls, and first-party fraud trend
  - - Funding and capital tightening
    - Loan growth depends on external facilities and rate environment
    - City A.M., BoE, filings
    - high
    - Request facility covenants, advance rates, and refinancing plan
  - - Data quality / automated decision risk
    - Bad bureau or fraud data can unfairly exclude customers
    - ICO credit and correction rights, privacy notice
    - high
    - Request decline reason codes and correction workflows
  - - Vulnerable customer harm
    - Distressed borrowers may be unsuitable for new credit
    - StepChange, National Debtline, Money and Mental Health
    - high
    - Request affordability and post-hardship outcomes by cohort
  notes: These are the main cross-cutting risks that appear repeatedly across public
    sources.
