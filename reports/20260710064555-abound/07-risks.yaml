- id: TR004
  title: Residual diligence blocker table
  columns:
  - missing private evidence
  - impact
  - exact diligence path
  rows:
  - - Loss curves and roll rates
    - Cannot quantify underwriting downside
    - Request vintages, delinquencies, recoveries, and segment migration
  - - Funding covenants and triggers
    - Cannot model refinancing or liquidity stress
    - Request debt agreements and borrowing-base packs
  - - Model governance and overrides
    - Cannot judge fairness or control robustness
    - Request validation reports, override logs, and monitoring dashboards
  - - Complaints and vulnerability MI
    - Cannot tell whether support processes work at scale
    - Request complaint rates, hardship outcomes, and remediation files
  - - Decline reasons and correction workflows
    - Cannot judge unfair exclusion risk
    - Request decline reason codes and CRA dispute handling metrics
  notes: These blockers are the minimum private pack required before underwriting
    residual risk confidently.
