  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: control-effectiveness
    missingEvidence: No public source provides model governance detail, override rates,
      complaint root-cause MI, or control testing results.
    whyItMatters: Residual risk depends on whether controls are robust in practice,
      not merely documented in policies.
    diligencePath: Request risk committee packs, validation reports, complaint MI,
      and internal audit findings.
    relatedQuestionRefs:
    - QR005
    - QR024
    - QR030
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: capital-resilience
    missingEvidence: Funding covenants, triggers, hedging, and liquidity buffers are
      not publicly available.
    whyItMatters: These determine how the business behaves under default pressure
      or tighter markets.
    diligencePath: Request facility agreements, covenant certificates, and treasury
      reporting.
    relatedQuestionRefs:
    - QR020
    - QR028
    - QR030
    relatedTableRefs:
    - TR001
    - TR004
  - type: private-evidence-only
    severity: material
    topic: segment-outcomes
    missingEvidence: Public sources do not reveal arrears, recovery, complaints, or
      support outcomes by cohort such as thin-file or consolidator borrowers.
    whyItMatters: Mission alignment and conduct safety both depend on cohort-level
      results.
    diligencePath: Request segmented arrears, complaints, hardship, and resolution
      metrics.
    relatedQuestionRefs:
    - QR016
    - QR029
    - QR030
    relatedTableRefs:
    - TR003
    - TR004
  - type: public-data-gap
    severity: medium
    topic: policy-change-timing
    missingEvidence: Public sources show active oversight but not a single definitive
      roadmap for future consumer-credit or open-banking rule changes.
    whyItMatters: Policy timing can affect compliance cost, moat, and product design.
    diligencePath: Monitor FCA/CMA/parliamentary consultations and ask management
      for compliance roadmap assumptions.
    relatedQuestionRefs:
    - QR014
    - QR026
    relatedTableRefs:
    - TR001
