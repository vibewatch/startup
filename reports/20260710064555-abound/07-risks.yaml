  - TR002
  figureRefs:
  - FR001
- id: consumer-harm-fraud-and-vulnerability
  title: Consumer harm, fraud, and vulnerability risk
  body: The public record is strongest where it describes customer harm pathways.
    Abound’s own support pages say missed payments can trigger fees and CRA reporting,
    that customers in trouble should engage early, and that the company may use Open
    Banking to understand their situation. Its fraud page separately warns about loan-fee
    fraud, fake social-media approaches, and impersonation scams. External sources
    reinforce that these are not hypothetical. The FCA has a dedicated warning page
    on loan-fee fraud, Cifas reports record fraud volumes, Take Five focuses on scam
    prevention, and Action Fraud exists as a national reporting point. At the same
    time, debt-advice and mental-health sources show why this matters more for Abound
    than for some prime lenders. If borrowers are already stressed, the difference
    between responsible consolidation and harmful repeat borrowing can be thin. A
    lender that grows by serving mis-scored or stretched customers can create real
    social and reputational upside, but only if vulnerability handling, complaint
    resolution, and fraud prevention all work in practice.
  claimRefs:
  - CR006
  - CR007
  - CR009
  - CR010
  - CR011
  - CR012
  - CR017
  - CR018
  - CR033
  - CR034
  - CR037
  tableRefs:
  - TR003
  figureRefs:
  - FR002
- id: capital-macro-and-policy-risk
  title: Capital, macro, and policy risk
  body: 'Abound’s credit model sits on top of both household balance-sheet risk and
    its own funding stack. Bank of England credit data, cost-of-living support guidance,
    debt-advice charities, and press on the Deutsche Bank facility all imply the same
    macro reality: if households weaken while funding tightens, the company can face
    pressure on both borrower quality and lending economics at the same time. That
    is a fundamental risk for any lender, but it matters even more here because Abound’s
    public story emphasises inclusion and partner-led expansion rather than only prime-bank
    economics. Add policy risk and the picture becomes more complex. Open banking
    is meant to expand competition, which can help Abound, but the same competitive
    logic can also erode moat if rival lenders gain access to similar rails. Consumer
    Duty, broader competition oversight, and parliamentary scrutiny create additional
    pressure for fair treatment and transparent outcomes. These are manageable risks
    for a well-run lender, but they raise the premium on control quality and capital
    resilience.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR025
  - CR029
  - CR036
  - CR039
  figureRefs:
  - FR003
- id: evidence-gaps-and-residual-risk
  title: Residual risk and diligence blockers
  body: 'Despite a large number of public risk signals, the most decision-useful controls
    remain private. The public record shows what can go wrong—poor data, scams, borrower
    stress, complaints, and policy pressure—but it does not show how well Abound actually
    handles those failures in practice. There are no public loss curves, no covenant
    packs, no decline reason-code distributions, no override rates, no model-governance
    materials, and no segment-level outcomes for vulnerable cohorts. That asymmetry
    matters. It means a reviewer can form a rich picture of the harm pathways while
    still lacking the internal evidence needed to quantify whether those pathways
    are contained. For diligence, this creates a practical conclusion: the residual
    risk is not that Abound has no controls. It almost certainly does. The residual
    risk is that the company’s public evidence does not let outsiders judge whether
    those controls are merely compliant, genuinely robust, or already under strain
    as the platform broadens across products and partners.'
  claimRefs:
  - CR024
  - CR028
  - CR031
  - CR032
  - CR035
  - CR038
  - CR040
  tableRefs:
  - TR004
  figureRefs:
  - FR004
