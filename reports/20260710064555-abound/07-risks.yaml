- id: TR002
  title: Regulatory / legal risk register
  columns:
  - obligation surface
  - public anchor
  - implication
  rows:
  - - Entity authorisation
    - Terms and privacy notice list FCA FRN 929244 and ICO registration
    - Regulatory perimeter is formal and documented
  - - Consumer credit legal framework
    - Consumer Credit Act 1974
    - Loan terms and process live inside a mature legal regime
  - - Customer outcomes
    - Consumer Duty and LSB customer-outcomes framing
    - Fairness and vulnerability handling are central
  - - Complaints rights
    - Abound complaints process and FOS escalation
    - Conduct issues can escalate beyond the company
  - - Fraud and AML checks
    - Privacy notice fraud-prevention and automated checks
    - Risk controls can deny service and create explainability obligations
  notes: The legal perimeter is clear; the operational adequacy of compliance is not.
  enumerationScope:
    coverage: partial
    basis: Rows enumerate the main legal and conduct obligations surfaced in public
      materials and are not an exhaustive compliance inventory.
