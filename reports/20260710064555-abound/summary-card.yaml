  topStrengths:
    - >-
      Public disclosures support real revenue (£69m) and profitability (£9m PBT) in 2024, which is stronger than the
      median fintech lender story.
    - >-
      Abound has institutional funding support from Citi, Deutsche Bank, Waterfall, and others, with company materials
      citing £2.2bn of financing secured.
    - >-
      The underwriting proposition is differentiated around open-banking cashflow analysis for borrowers underserved by
      traditional bureau-led models.
    - >-
      Public milestones show continued scale, including £1.5bn+ total originations and profitability reported from April
      2024 onward.
  topRisks:
    - >-
      Public sources do not disclose a clean current equity valuation, last share price, cap table, or debt-equity
      split, creating major valuation uncertainty.
    - >-
      Loan-book quality, cohort loss curves, covenant package, and capital-consumption detail remain undisclosed even
      though they drive lender value.
    - >-
      Consumer-credit businesses face conduct, vulnerability, fraud, and affordability risk under FCA oversight and
      Consumer Duty expectations.
    - >-
      Abound's connectivity and open-banking edge may erode as transaction-data access spreads across the UK lending
      market.
    - The bull case for a software premium depends on Render economics that are not publicly quantified.
  unresolvedGaps:
    - Last priced equity round terms, post-money valuation, dilution, and current cap-table structure.
    - Debt-facility pricing, covenants, debt balances, and the exact split between debt capacity and equity support.
    - Loan-book performance by cohort, default curves, provisioning, and capital-efficiency metrics.
    - >-
      Render revenue, gross margin, partner retention, and whether the platform business is material enough to justify
      premium multiples.
    - Current headcount, leadership depth below founders, and broader governance or board-rights disclosure.
