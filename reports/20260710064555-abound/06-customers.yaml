  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cohort-quality-and-repeat-use
    missingEvidence: Public sources do not show repeat-borrowing, retention, regret,
      or arrears by customer cohort.
    whyItMatters: These measures are needed to tell whether Abound’s mission segments
      are economically healthy and sustainably served.
    diligencePath: Request cohort dashboards for newcomer, consolidator, partner-channel,
      and thin-file borrowers.
    relatedQuestionRefs:
    - QU018
    - QU019
    - QU020
    - QU026
    relatedTableRefs:
    - TU001
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: partner-channel-outcomes
    missingEvidence: Public partner references do not reveal conversion, satisfaction,
      loss, or repeat-use outcomes by channel.
    whyItMatters: Embedded channels may widen reach but could have very different
      customer quality from direct lending.
    diligencePath: Request partner-level funnel, loss, NPS, and renewal data for Gaia,
      LemFi, retail finance, and premium finance.
    relatedQuestionRefs:
    - QU014
    - QU024
    - QU026
    relatedTableRefs:
    - TU004
  - type: public-data-gap
    severity: medium
    topic: review-quality-vs-economics
    missingEvidence: Review surfaces signal satisfaction but do not prove durable
      borrower outcomes, especially after hardship or consolidation.
    whyItMatters: Customer happiness at origination can diverge from long-term loan
      quality and conduct outcomes.
    diligencePath: Request post-origination complaint rates, hardship outcomes, and
      customer-regret metrics by segment.
    relatedQuestionRefs:
    - QU007
    - QU018
    - QU020
    relatedTableRefs:
    - TU003
    - TU005
  - type: public-data-gap
    severity: medium
    topic: suitability-boundaries
    missingEvidence: Public sources do not quantify where Abound declines customers
      because the product would be unsuitable versus where rail limitations block
      approval.
    whyItMatters: This boundary is central to judging responsible-lending discipline.
    diligencePath: Request declines by reason code, unsupported-bank share, and debt-distress
      screening outcomes.
    relatedQuestionRefs:
    - QU013
    - QU015
    - QU026
    relatedTableRefs:
    - TU002
    - TU005
