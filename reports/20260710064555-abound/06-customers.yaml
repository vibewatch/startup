tables:
- id: TU001
  title: Customer segment table
  columns:
  - segment
  - core need
  - why Abound fits
  - public evidence
  rows:
  - - Thin-file / newcomer borrower
    - Needs credit access without long UK file history
    - Open-banking affordability can substitute for missing local history
    - Moved-to-UK and credit-score explainers
  - - Debt consolidator
    - Wants to replace higher-cost debt with a clearer instalment loan
    - Abound says many customers save money over the loan life
    - 2025 customer-outcome articles
  - - Mainstream borrower seeking faster fairer pricing
    - Wants simple online loan and same-day decision
    - Official loan product and personalised rates story
    - Home page and what-we-do page
  - - Financially stressed borrower needing early support
    - Needs options before or after payment stress
    - Money-troubles and complaints pages are unusually explicit
    - Support pages
  - - Partner-channel borrower
    - Needs finance within another journey such as IVF, checkout, or remittance-linked
      credit
    - Abound is embedded through partners like Gaia and LemFi
    - Investors page and partner proofs
  notes: Rows reflect the major customer archetypes explicitly visible in public materials.
