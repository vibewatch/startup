company:
  name: Abound
chapter:
  number: 6
  title: Customers
  summary: 'Abound’s customer evidence points to two linked franchises: direct borrowers
    who are misread by bureau-led credit screens or trying to consolidate expensive
    debt, and partner-channel users who encounter financing inside other workflows
    such as retail, insurance, fertility, or remittance-linked credit. Public proof
    is strong on broad satisfaction and category fit, but still thin on cohort-level
    durability and post-hardship outcomes.'
sections:
- id: direct-borrower-segments
  title: Direct borrower segments and jobs-to-be-done
  body: 'Abound’s direct-customer thesis is clearest where mainstream credit files
    fail to describe current affordability. The company’s public materials repeatedly
    emphasise fairer borrowing for people who are thin-file, newly arrived, or otherwise
    misread by score-led underwriting. Its moved-to-the-UK explainer describes the
    practical problem directly: a strong overseas borrowing record does not travel
    to Britain, which can leave otherwise stable borrowers effectively “credit invisible.”
    Abound’s own credit-score explainer softens the role of bureau scores further
    by saying there is no single score threshold that determines eligibility. Combined
    with the broader product pages, that suggests the best-understood direct customer
    jobs are debt consolidation, fairer pricing for people mis-scored by credit files,
    and access for newcomer borrowers with solid income but weak local history. The
    company’s support and comparison context also matters. Personal loans are still
    a comparison-shopped, budget-sensitive purchase. So Abound’s product has to work
    not only as a credit decision, but as a better borrower experience for people
    who are actively choosing between lenders or trying to escape more expensive debt.'
  claimRefs:
