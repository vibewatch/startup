- id: customer-proof-and-borrower-outcomes
  title: Customer proof and borrower outcomes
  body: 'Public customer proof is meaningful but uneven. Trustpilot gives Abound an
    “Excellent” rating, and Smart Money People at least shows a second review surface
    dedicated to the personal-loan product. More substantively, multiple 2025 articles
    claim that Abound’s model serves people with thin or misrepresentative credit
    files yet solid financial health, and that many customers use the product to consolidate
    more expensive debt. Those same articles report that such customers save over
    £1,000 on average over the duration of the loan, which, if accurate, would make
    customer value more tangible than a generic claim of “fairer borrowing.” Scale
    markers reinforce that this is not a niche experiment: Abound had passed £1bn
    in lending volume by October 2025, and its own site says total originations are
    above £1.5bn. The limitation is that outcome quality is still only partly visible.
    Ratings and debt-consolidation anecdotes do not tell us enough about repeat use,
    regret, satisfaction after hardship, or how outcomes differ by segment.'
  claimRefs:
  - CU007
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU038
  - CU039
