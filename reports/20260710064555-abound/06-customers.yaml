- id: TU002
  title: Borrower jobs and pain points table
  columns:
  - job-to-be-done
  - pain point
  - Abound proposition
  - caveat
  rows:
  - - Get a loan after moving to the UK
    - No portable local credit file
    - Use current affordability and limited work history instead of only local score
    - Thin-file risk is still real
  - - Consolidate expensive debt
    - Too many expensive balances or high monthly outflow
    - Potentially lower total cost and one clearer instalment
    - Can backfire if borrower is already in severe distress
  - - Access credit with a misrepresentative score
    - Historical bureau file understates current finances
    - Transaction data offers fuller picture
    - Exact approval uplift by cohort is not public
  - - Avoid missing payments
    - Income shock or temporary pressure
    - Early support, live chat, email, phone, and Open-Banking-based review of options
    - Missed payments can still trigger fees and CRA reporting
  - - Shop for a fair loan
    - Many alternatives with variable APRs and acceptance odds
    - Personalised rates and same-day decisions
    - Customers still comparison-shop heavily
  notes: This table combines official messaging with independent debt-advice cautions.
