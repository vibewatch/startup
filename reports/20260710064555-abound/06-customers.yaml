- id: vulnerability-support-and-evidence-gaps
  title: Vulnerability, support, and evidence gaps
  body: 'Customer quality in lending is inseparable from vulnerability handling. Abound’s
    own pages tell borrowers to contact it before missing a payment, describe the
    consequences of missed payments, explain refundability of late-payment fees in
    some cured cases, lay out a complaints process, and warn about loan-fee fraud
    and fake social-media approaches. Those are positive signals of operational seriousness.
    At the same time, external debt-advice charities show why this customer set can
    be difficult. StepChange and National Debtline both warn that consolidation borrowing
    can deepen problems for people already struggling with essential bills, while
    Turn2us and GOV.UK reflect an environment of persistent financial stress and reduced
    one-off state support. The result is a mixed but realistic picture: demand is
    clearly present, and Abound’s support surface is better disclosed than that of
    many fintechs, yet public evidence still does not reveal which customer cohorts
    remain healthy over time. Without that, it is hard to tell whether today’s positive
    review and volume signals are concentrated in the best borrowers or sustained
    across the harder-to-serve segments that define the company’s mission.'
