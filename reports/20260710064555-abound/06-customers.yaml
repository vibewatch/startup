- id: TU003
  title: Named customer proof table
  columns:
  - proof point
  - public signal
  - what it suggests
  - limitation
  rows:
  - - Trustpilot rating
    - Excellent, 4.9/5
    - Broad satisfaction and strong direct-borrower sentiment
    - Ratings do not show cohort economics
  - - Smart Money People review page
    - Dedicated product review surface exists
    - Abound has visibility beyond one review platform
    - The fetched page did not cleanly expose aggregate review metrics
  - - Savings claim
    - '>£1,000 average saving for many debt-consolidation customers'
    - Potentially meaningful customer surplus
    - Company-aligned press, not statutory evidence
  - - Scale marker
    - £1bn+ lending volume by Oct 2025
    - Large enough base for recurring customer proof
    - Volume is not outcome quality
  - - Official originations marker
    - £1.5bn+ originated
    - Sustained customer demand exists
    - No segment-level split disclosed
  notes: Customer proof is directionally strong, but its quality is uneven across
    cohorts and channels.
