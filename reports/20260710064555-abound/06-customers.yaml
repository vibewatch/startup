- id: partner-customers-and-channel-expansion
  title: Partner customers and channel expansion
  body: 'Abound’s customer base is broader than direct borrowers because the company
    increasingly reaches end users through partner products. The clearest public proof
    points are Gaia and LemFi, alongside retail-finance and premium-finance partner
    pages. Gaia shows why this matters: fertility treatment is a large, emotionally
    loaded, lumpy expense where financing structure can reshape customer access. LemFi
    extends the pattern into immigrant and remittance-linked credit needs. Meanwhile,
    Abound’s merchant and premium-finance pages show customer jobs that are different
    from a classic unsecured loan: smoother checkout, higher approval, more flexible
    premium payments, and lower friction around collections or payment continuity.
    This partner channel changes the customer map in two ways. First, it expands Abound
    into need-states where consumers may not start by searching for a personal loan.
    Second, it means some of Abound’s strongest future customer acquisition may arrive
    embedded inside other journeys, making direct review footprints a weaker guide
    to true reach. Public evidence is enough to say the partner route is real, but
    still too thin to measure which channels retain customers best or create the healthiest
    credit outcomes.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
