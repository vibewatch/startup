    - Customers are told to contact Abound before missing a payment
    - Suggests early-intervention intent
  - - Missed-payment consequences
    - Late fees and CRA reporting can still occur
    - Borrower experience can deteriorate quickly if support fails
  - - Complaints workflow
    - Most complaints targeted for resolution by third business day with FOS escalation
      rights
    - Operational trust signal, but also evidence of friction pathways
  - - Fraud warning
    - Abound warns about loan-fee scams and fake social-media outreach
    - Online lending acquisition creates fraud exposure
  - - External debt-advice caution
    - StepChange and National Debtline warn consolidation can worsen distress in the
      wrong cases
    - Demand exists, but customer suitability is crucial
  notes: This table intentionally mixes positive support signals with adverse suitability
    caveats.
