evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: >-
      Exact current equity valuation, preferred-share terms, and dilution stack are not publicly disclosed in fetched
      sources.
    whyItMatters: >-
      A valuation chapter can judge price only approximately without the exact round terms or a confirmed post-money
      mark.
    diligencePath: Request the latest cap table, term sheet, and any secondary pricing from management or lead investors.
