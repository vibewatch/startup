chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 定位、产品范围与运营规模
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 将自己定位为私募市场 GP 的运营伙伴，而不是单点工具。官网和基金管理材料描述了一套贯通募资、投资者入驻、合规、资金管理、报告和外包基金管理的连接型技术栈；2026
              年产品更新则强调，在同一运营系统上叠加 AI 工作流和不依赖特定模型的集成。公开规模足以影响尽调判断：公司称平台上有超过 2,300 家 GP 在运营基金，拥有超过 750,000 个 LP 账户和约 1
              万亿美元的投资者权益。独立报道从方向上印证了这些数字，但多个重要商业指标仍属非公开信息，因此后续章节应将平台规模视为市场地位的证据，而不是收入质量或留存经济性的证明。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
              - CO015
              - CO016
