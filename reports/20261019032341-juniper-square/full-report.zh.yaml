      - number: '1.2'
        title: 创始人、管理梯队与组织版图
        blocks:
          - type: paragraph
            body: >-
              公开记录仍显示，这是一家以房地产为起点、后来拓展至更广泛私募市场的创始人主导公司。Juniper Square 自己的招聘文案称，公司成立于 2014 年，员工已超过 1,000
              人，并采用混合办公模式，设有旧金山、纽约、孟买和班加罗尔办公室，同时在北美、印度、卢森堡和英格兰拥有更广泛的分布式团队。现有证据中的管理层变动更像是加法，而非动荡：Brandon Sedloff 于 2026
              年从房地产首席官转任客户关系首席官，Stephanie Miller 于 2025 年加入并担任 COO。这支持管理深度正在增加的判断，但现有证据未披露董事会构成、投票控制权或 D
              轮后的股权集中度，而这些都与治理尽调直接相关。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: 融资历史、战略支持者与生态关系
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 似乎通过多轮融资和不断扩大的战略关系，从打造品类的软件供应商成长为规模化成长公司。公司控制的来源和独立来源都支持其 2025 年 6 月以 11 亿美元估值完成 D
              轮融资；新闻档案还显示，公司在 2018、2019、2020 年完成过早期融资，并于 2023 年募资 1.33 亿美元。同一档案还列出多类资本和生态关系，包括 Ribbit Capital、Owl Rock 或
              Blue Owl、Nasdaq Ventures，Nasdaq eVestment 和 Preqin 等数据伙伴，以及 Kudu Investment Management
              等运营伙伴。不过，公开材料没有拆分老股出售、债务、清算优先权或各投资者持股，因此本章可以确认关键融资事件，却无法还原当前资本结构。
            claimRefs:
              - CO004
              - CO008
              - CO009
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO012
      - number: '1.4'
        title: 里程碑、AI 扩张与未解决的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              2025-2026 年的新闻流显示，Juniper Square 正积极推进 AI 工作流扩展，而不是局限于投资者报告和记录保存。公司新闻档案记录了 AI CRM 发布、战略数据集成、一次收购、与 Kudu
              的合作、Headless GPX 以及 Fay 监督代理；独立报道也印证了 2026 年 6 月和 7 月的发布。指定证据中最强的负面信号不是已报道的事故，而是披露缺口：关于 Fay
              的独立评论明确指出，Juniper Square 没有披露开发投入、所需监管批准、合作伙伴范围或实施时间。因而，在商业采用和合规证据更清晰之前，读者应将 AI
              叙事视为具有战略重要性且可能形成差异化，但从尽调角度看仍不完整。
            claimRefs:
