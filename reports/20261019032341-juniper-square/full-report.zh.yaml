      - number: '3.3'
        title: 持久性、迁移成本与替代风险
        blocks:
          - type: paragraph
            body: >
              在指定资料池中，Juniper 的护城河更像数据与工作流整合，而不是纯粹的网络效应。公司如今将投资者记录、报告、管理、AI CRM 和新代理界面连到同一个控制平面；关于 Headless GPX
              的报道称，这些权限和关系可以延伸到第三方 AI 环境，同时不放弃 Juniper
              的信任边界。数据室供应商的评测也指出，实施投入和迁移摩擦虽然常见，却构成真实的迁移成本——一旦报告、投资者沟通和后台工作流嵌入其中，切换就不再轻松。

              同一资料池也清楚显示了替代风险。独立评测提到仍有手工流程、定制能力有限和迁移问题；竞争比较则认为，非房地产或只需要特定工作流的管理人，可能更偏好关系智能产品、基于 Salesforce
              的生命周期工具或高度可配置的企业系统。因此，Juniper 对想要一层私募市场运营底座的买方较为稳固；但当买方更看重募资触达、极致可配置性或单一资产类别工作流，而不是整合广度时，其防护就会减弱。
