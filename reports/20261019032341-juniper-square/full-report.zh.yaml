              - CR006
              - CR008
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 最大剩余风险
            body: 最尖锐的下行风险不是公开证据中可见的某一宗诉讼或宕机，而是 Juniper Square 在极大存量客户基础上扩大 AI 工作流访问权限时发生控制失效。
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR013
          - type: callout
            title: 公开缓解措施可信但不完整
            body: 管理层正在恰当的环节谈论信任控制、可审计性和自动复核，但保留的资料池仍缺乏足够外部证明，无法大幅下调控制和合规风险。
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
              - CR011
          - type: callout
            title: 主要待验证的尽调假设
            body: 指定资料池无法确认当前事故或执法状态；这项缺失的一手证据是一个待验证缺口，不能解读为没有发生任何事件的证明。
            calloutType: assumption
            claimRefs:
              - CR011
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资决策与建议
        blocks:
          - type: paragraph
            body: >-
              建议采取跟踪 / 继续研究的姿态，信心中低、投资判断风险高，而不是直接买入。Juniper Square 可以指向一笔以 11 亿美元估值完成的 1.3 亿美元 D 轮融资，以及超过 2,300 家 GP
              的运营规模；独立报道也描述了广泛的存量客户基础。这些信号支持可信的品类领导者判断，但无法建立今天为股权定价所需的经济基础：保留证据没有提供经审计收入、ARR、毛利率、留存、现金消耗、自由现金流或当前完全摊薄资本化数据。因此，在这些事实得到验证前，入场纪律应只把
              2025 年估值作为谈判参考，并要求下行保护。
            claimRefs:
              - CV001
              - CV010
              - CV015
              - CV016
