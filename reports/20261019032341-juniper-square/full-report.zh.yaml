              正从分别销售技术和基金管理产品，转向成为私募市场公司经营业务的运营系统，并针对私募股权、风险投资和实物资产买方定制叙事。这比普通产品发布更考验执行，因为品类信息、续约证明、销售赋能和产品排序必须在一个大型分布式组织内保持一致。Juniper
