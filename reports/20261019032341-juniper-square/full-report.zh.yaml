      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是 GP 的 CFO 或 COO，投资者关系负责人、财务控制人员、基金会计、合规人员和面向 LP 的团队则是用户。当基金和实体数量、资本调用、分配、K-1 交付、报告或机构 LP
              要求让碎片化工作流变得昂贵时，采用平台的吸引力最强。Coyote Wealth
              的独立但带有商业披露的画像认为，该平台尤其适合新兴管理人和技术优先型管理人，房地产和私募股权领域更是如此；但它也提醒，管理人规模达到机构级复杂度后，应验证服务深度。竞争性数据室供应商 Peony
              则从生命周期的另一端出发，认为小型发起人如果眼下只需要完成一次募资，可能会买下过于复杂的集成运营系统。这些观点不是独立的市场基准，但合在一起揭示了采用触发点：当持续服务复杂度，而不是单次募资交易，成为运营瓶颈时，预算才会从单点工具转向集成平台。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              在指定证据中，产品扩张是最清晰的增长驱动。公司公告描述了 AI 辅助的基金管理人监督、AI CRM、私人信贷能力、对 evergreen
              和半流动结构的支持，以及与市场数据供应商的集成。这些新增能力可以扩大工作流覆盖并提高迁移成本，但证据来自公司自身，未量化新增订单或付费意愿。约束同样重要。实施需要数据迁移和培训；竞争对手撰写的分析质疑其在房地产导向工作流之外的适配性；官方
              AI CRM 发布材料本身也称，通用系统可能需要昂贵的定制、集成和维护，因此信任、数据质量和系统替换都是关键购买障碍。就估值而言，市场逻辑支持一个可信的存量平台及其扩张路径，但不支持精确的自上而下
              TAM。投资判断前，应索取分部 ARR、赢单率、实施时长、价格实现率、流失率和各垂直领域渗透率，再决定是否给予市场份额或增长溢价。
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把平台资本量换算成 TAM
            body: 3000 亿美元以上的管理资产和 1 万亿美元的平台 LP 资本，描述的是公司披露的两种不同覆盖面。两者都不是收入或可触达的软件支出，指定证据也不支持美元口径的 TAM、SAM 或 SOM。
            calloutType: risk
            claimRefs:
              - CM004
              - CM007
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：综合平台对专业化替代方案
        blocks:
          - type: paragraph
            body: >
              指定证据将 Juniper Square 的竞争拆成多个层次，而不是一个整齐的同业集合。独立评测网站和 Juniper 自有页面都持续将其描述为面向私募市场管理人的
              CRM、投资者门户、数据室、报告和基金管理综合栈，因此最接近的直接替代品是其他基金运营套件，而不是独立虚拟数据室或普通 CRM。Software Advice 明确列出 AppFolio Investment
              Manager、Dynamo Software 和 RealPage IMS 作为热门比较对象；竞争对手撰写的资料和评测类来源则将 Affinity、Altvia、DealCloud、Carta 和
              PipelineRoad 放在 Juniper 周围，分别作为关系洞察、LP 生命周期管理、交易管理、VC 管理或漏斗前端募资的相邻替代品。

              这一点很重要，因为买方有两条路径可以离开 Juniper。如果房地产或私募市场 GP 想要广泛的运营系统，它可以将 Juniper 与其他集成平台比较。但如果管理人主要需要新的 LP 获客、熟人引荐或可配置的企业
              CRM，它可以转向更窄的专业工具，而无需购买 Juniper 的完整平台。Juniper 自己在 2025-26 年的发布表明，公司理解这一威胁，并围绕募资、管理和 AI
              监督扩展工作流广度，以应对这一威胁，而不是把这些相邻任务让给独立工具。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP006
              - CP008
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP006
              - CP008
              - CP011
              - CP012
              - CP013
      - number: '3.2'
        title: 能力、定价与买方适配取舍
        blocks:
          - type: paragraph
            body: >
              Juniper 有证据支撑的最强差异化，是在一条私募市场工作流内提供广度。评测网站描述了 CRM、数据室、投资者报告、集成和门户功能的一体化组合；Juniper 自己的 AI CRM 和 Admin
              Oversight 发布则增加了投资者关系自动化、管理复核和第三方管理人支持。Built In 的岗位描述还显示，公司面向私募股权、风险投资和实物资产买方销售，产品营销需要为 CFO 和 COO
              提炼各垂直领域的证明点，而不是使用一套泛化话术。

              包装和定价证据明显弱于工作流证据。评测平台列出的起始价为每年 18,000
              美元，但独立评测也称价格通常需要询价，并未披露实际模块经济性、折扣或企业最低采购额。相比之下，竞争对手比较来源公布了多个替代品的方向性入门价格，从 PipelineRoad 的月度触达产品，到基于
              Salesforce 的 Altvia 和企业级定价的 DealCloud。这使 Juniper
              在买方重视整合和领域适配时最有优势；但当采购方将某个窄任务与更便宜的单点方案比较，或要求透明的公开套餐时，它就相对较弱。
            claimRefs:
