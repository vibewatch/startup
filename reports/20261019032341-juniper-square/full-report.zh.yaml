  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资品类比整个私募市场资产池更窄。Juniper Square
              销售覆盖募资和投资者关系、入驻、报告、资金管理相关工作流以及可选托管管理的基金运营系统；它并不会从每一美元私募资本中收取费用。公司当前招聘材料将私募股权、风险投资和实物资产列为三大核心垂直领域，并把 CFO 和
              COO 列为财务素养较高的买方。因此，实际市场是由 GP 财务、运营和投资者关系团队掌控的软件与服务预算，而不是私募市场 AUM 本身。现状替代方案包括电子表格、通用
              CRM、单点数据室、外部管理人和内部集成工具。官方产品材料称，AI CRM 目前覆盖出资承诺、数字认购、KYC 和内置数据室；竞争对手撰写的比较则强调，漏斗前端 LP
              获客和资产类别专属工作流仍可能需要独立工具。这一区分可以避免把庞大的私募资本宇宙误认为 Juniper Square 可直接触达的收入池。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.2'
        title: 受证据约束的市场规模判断
        blocks:
          - type: paragraph
            body: >-
              现有披露证明了采用规模，而不是市场价值估算。公司当前招聘文案称，Juniper Square 获得超过 2,300 家 GP 信任，平台上有超过 700,000 个 LP，并管理超过 3000 亿美元资产。公司
              2026 年 3 月的公告另称，平台管理的基金超过 40,000 支、LP 资本达 1 万亿美元。这些指标的分母不同：管理资产描述的是托管服务覆盖面，而平台上的 LP
              资本是更广泛的技术平台口径。两者都不是收入、ARR、年度支出或 TAM，不应相加，也不应据此推算市场份额。现有留存来源没有提供当前全市场可触达 GP 数量、分部支出、抽成率或透明的美元 TAM
              方法。合适的投资判断方式是采用受约束的规模拆解：把存量客户指标作为品类采用证据，并要求管理层提供数据，才能将其转换为 SAM、SOM 或估值倍数。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM015
              - CM016
