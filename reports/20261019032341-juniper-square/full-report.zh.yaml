          label: 使用基础
          detail: 2,300+ 家 GP、40k-45k 个实体、700k-750k 个 LP / 账户，以及约 $1T 资本
        - id: monetization
          label: 变现点
          detail: 平台合同、管理费，以及 AI 关联增购或捆绑包
        - id: margin
          label: 毛利路径
          detail: 自动化可能减少复核人工，但实际定价和利润率尚未披露
      edges:
