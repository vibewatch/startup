      - number: '8.3'
        title: 投资论点、反方论点与情景信号
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在规模、工作流广度和产品扩张之上。公司撰写的招聘页面称，Juniper Square 服务超过 2,300 家 GP、管理超过 3000 亿美元；关于 Headless GPX
              的独立报道则描述了其对报告、会计、合规、募资和投资者运营的访问。反方论点是，运营广度未必能在上一轮估值水平上转化为有吸引力的股权回报。对 Fay 发布的独立评测指出，开发投入、监管审批、第三方 AI
              合作和完整实施时间均未披露。这些缺口使产品发布更像领先指标，而不是变现、利润率扩张或持久留存的证明。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              公开证据显示其具有战略相关性，但尚不足以证明退出准备度。Tracxn 在一大批活跃竞争者中将 Juniper Square 排名第一；Juniper Square
              一名高管在独立采访中称，公司数字认购工具每月净流入约 10 亿美元。两者都不能替代经审计的财务表现或可执行流动性路径的证据。投资前，尽调应取得完全摊薄股权结构表和优先权瀑布、经审计的收入和 ARR
              桥接、软件与服务分拆的毛利率和贡献利润率、队列留存、客户集中度、现金消耗，以及 2026 年 AI 发布的产品采用情况。论点失效触发器包括没有补偿性保护的下轮融资、GP 使用量大幅收缩、AI
              发布未能转化为付费采用，或服务强度阻碍规模化利润率。
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格纪律是关键门槛
            body: 只有在尽调将公司声称的规模转换为经审计的经济数据，并核对完全摊薄资本化之后，运营叙事才具备投资价值。在此之前，最近一轮融资估值只是参考，而不是目标价。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV006
              - CV015
              - CV016
