  - id: FE001
    title: 统一运营层与 AI / 控制边界
    type: stack
    summary: Juniper Square 在共享基金数据模型之上叠加私募市场工作流应用、控制措施和 AI 接口。
    data:
      layers:
        - label: 数据基础
          summary: Shared system of record for fund investor asset position and capital-activity data.
          modules:
            - label: 核心实体
              note: funds investors assets positions
            - label: 计算
              note: IRRs multiples distributions custom KPIs
          outputs:
            - label: unified private-markets data model
        - label: 募资与投资者工作流
          summary: Front-office fundraising and LP experience run on the same data layer.
          modules:
            - label: 前台
              note: CRM fundraising investor portal
            - label: 开户
              note: subscriptions AML/KYC side letters
          outputs:
            - label: connected fundraising and LP workflow
        - label: 财务与管理工作流
          summary: Back-office operations sit on the same operating record instead of a separate admin stack.
          modules:
            - label: 核心运营
              note: reporting capital activity waterfall transfers
            - label: 服务叠加层
              note: fund accounting investor services compliance
          outputs:
            - label: shared software plus service execution
        - label: 控制平面
          summary: Human and AI actions inherit one trust boundary.
          modules:
            - label: 访问控制
              note: SSO IP restrictions 2FA RBAC
            - label: 监督
              note: SOC 2 Type II audit logging
          outputs:
            - label: inherited permissions and audit trail
        - label: 外部集成接口
          summary: External tools connect through sanctioned interfaces rather than one-off exports.
          modules:
            - label: 外部接口
              note: MCP developer API partner data feeds
          outputs:
            - label: extensible workflow access
        - label: 原生 AI 与 agent 层
          summary: Native AI products use the same workflows and controls instead of a separate data island.
          modules:
            - label: 原生 AI
              note: AI CRM Fay GPX Agents roadmap
            - label: 自动化用途
              note: investor outreach close oversight compliance review
          outputs:
            - label: agentic workflow surface
    approximationNotes: 分层是分析性表达，不是厂商制作的图稿；标签保留来源描述的组件，但不暗示未披露的内部实现细节。
