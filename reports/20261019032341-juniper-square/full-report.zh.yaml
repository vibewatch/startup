      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              2025 年 6 月交易是最清晰的公开价格标记，但周边融资记录并不完全一致。一家独立数据库报告六轮融资累计 3.69 亿美元；2026 年 8 月的一份资料表则报告六轮累计 3.65
              亿美元。相对于总资本，差异很小，但它说明无法仅凭公开摘要重建股权结构表。同一份资料表将 2025 年 6 月的一项指标标为“Revenue / ARR”，金额为 1.398 亿美元，并明确称 EV/Rev
              未披露。用投后估值除以这一含义不明的指标，只能得到约 7.9 倍的股权价值代理值，既不是企业价值倍数，也不是经审计的 ARR 倍数。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV016
