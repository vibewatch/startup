      - number: '7.3'
        title: 市场依赖、渠道暴露与资本纪律
        blocks:
          - type: paragraph
            body: >-
              Juniper Square 仍然向私募市场管理人的经营状况销售，因此即便是软件加服务平台，也会受到宏观环境和客户周期影响。公司材料和高管访谈都称，买方主要是 GP 的 CFO 和
              COO；行业环境则包括退出延迟、分配减少以及盈利运营压力。这一背景不证明需求崩溃，但如果 GP 预算持续受限，它会提高销售周期拉长、续约审查趋严和扩张放缓的概率。资本端又增加了一层风险。Multiples
              记录称，Juniper Square 于 2025 年 6 月以 11 亿美元估值完成 D 轮融资，记录收入为 1.08 亿美元，所得资金用于 JunieAI 及相关扩张。来源指出，轮次相关的收入字段可能是
              run-rate 收入或已报告的 LTM，因此不能将该指标视为经审计的
              ARR。这提高了将产品广度、卢森堡扩张、收购和生态合作转化为持久经济性，而不是转化为更高复杂度的门槛。这里的风险与偿付能力关系较小，更在于增长投入能否达到最新一轮融资所隐含的回报门槛。
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
