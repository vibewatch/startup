              - CR008
              - CR009
      - number: '7.4'
        title: 缓解措施、论点失效触发器与尽调要求
        blocks:
          - type: paragraph
            body: >-
              公开证据中的缓解措施真实存在，但并不完整。Juniper Square
              正强调信任控制、在面向投资者的错误外泄前进行自动复核、更大的基金管理规模以及更集成的运营模式。这些动作支持一个乐观情景：公司正在主动处理私募市场软件最容易失效的环节。剩余问题在于如何衡量：指定资料池仍没有回答
              AI 专项监管许可、超出已声明控制之外的独立安全姿态、权限和回滚是否有效、经审计的利润率或现金消耗纪律，以及按分部划分的客户集中度等核心尽调问题。实际的论点失效可能来自公共控制失效、新 AI
              界面采用延迟、运营系统重新定位未改善赢单率或续约，或 AI 投入增加的复杂度快于毛利增长。只要这些指标尚未出现，这仍是一个可管理但不可忽视的执行风险故事，而不是一套完全由控制力驱动的扩张案例。
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
