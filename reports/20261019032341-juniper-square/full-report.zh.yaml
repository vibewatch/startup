companyProfile:
  summary: >-
    Juniper Square 是一家由创始人主导的私募市场基金运营系统，为普通合伙人整合软件、数据、基金管理和 AI 工作流。公司称平台上有超过 2,300 家 GP 在运营基金；公开证据还显示，平台拥有超过 750,000 个
    LP 账户和超过 1 万亿美元的投资者权益。其 2025-2026 年产品周期显示，公司在有意推进 AI 工作流和集成，但公开记录仍未披露经审计的收入质量、利润率、留存或完整资本结构条款。
  productSummary: Juniper Square 销售一套覆盖投资者 CRM、募资、入驻、报告、资金管理、基金管理和 AI 工作流工具的私募市场基金运营平台。
