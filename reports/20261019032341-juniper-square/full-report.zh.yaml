  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议从已验证规模出发，经过证据缺口，最终落到对价格敏感的跟踪立场。
    data:
      nodes:
        - id: scale
          label: 规模信号
          detail: 2026 年来源报告的 GP 数量超过 2,300 家。
        - id: platform
          label: 平台扩张
          detail: AI 驱动的工作流扩大了产品覆盖。
        - id: price
          label: 价格参考
          detail: 2025 年 6 月 $1.1B 的融资投后估值。
        - id: economics-gap
          label: 经济效益缺口
          detail: 保留证据中没有经审计的 ARR、利润率、留存、现金消耗或现金流记录。
        - id: structure-gap
          label: 结构缺口
          detail: 公开融资总额相互矛盾，优先权条款也无法获得。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 只有在完成财务和股权结构尽调后，才确定入场价格。
