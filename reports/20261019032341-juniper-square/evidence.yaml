evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-board-enumeration
    missingEvidence: A complete current executive roster, board membership, voting control, and key-person succession plan.
    whyItMatters: >-
      Publicly named leaders do not establish the full governance structure or whether execution depends
      disproportionately on the founder.
    diligencePath: Request the current organization chart, board roster, voting agreements, and succession materials from management.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Current revenue, ARR, gross margin, net revenue retention, and free-cash-flow disclosure.
    whyItMatters: >-
      These metrics are necessary to convert visible platform scale into a defensible quality-of-revenue and valuation
      view.
    diligencePath: Request current audited or board-level operating metrics during management diligence.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: Post-Series-D ownership, debt, liquidation preferences, and any secondary sales by insiders or prior investors.
    whyItMatters: >-
      Capital-structure detail affects governance, downside protection, and how much headline valuation translates into
      common-equity value.
    diligencePath: >-
      Obtain the latest cap table, financing documents, and board materials covering the 2025 financing and later
      strategic investments.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: current-headcount-and-concentration
    missingEvidence: >-
      Independently verified current headcount, customer concentration, and churn data for Juniper Square's largest GP
      accounts.
    whyItMatters: >-
      The assigned public evidence supports scale claims but not whether growth is durable or concentrated among a small
      number of large clients.
    diligencePath: Request current HR, cohort-retention, and customer-concentration reporting from management.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      A current independent market study with a transparent definition of addressable GP software and administration
      spend, market-wide GP counts, geography, and methodology.
    whyItMatters: >-
      Without a market denominator or spend basis, installed-platform metrics cannot support a dollar TAM, SAM, SOM,
      market share, or valuation premium.
    diligencePath: >-
      Request management's market model and underlying customer universe, then triangulate it against an independent
      private-markets operations-software or fund-administration study.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-economics
    missingEvidence: >-
      Segment-level ARR, customer counts, pricing, win rates, retention, and implementation time by private equity,
      venture, and real-assets customer cohort.
    whyItMatters: >-
      Vertical positioning alone does not show which segments pay, retain, or expand enough to define the serviceable
      market.
    diligencePath: >-
      Obtain a management cohort export by vertical and product, reconcile customer counts to contracted ARR, and sample
      recent wins, losses, churn, and implementation records.
    relatedQuestionRefs:
      - QM003
      - QM004
  - type: conflicting-data
    severity: minor
    topic: asset-class-fit
    missingEvidence: >-
      Independent customer evidence comparing workflow fit and implementation outcomes across private equity, venture,
      real assets, and credit.
    whyItMatters: >-
      Company materials describe a multi-vertical platform, while competitor-authored reviews emphasize real-estate
      orientation; neither side independently measures fit.
    diligencePath: >-
      Interview reference customers in each vertical and compare configured workflows, implementation duration,
      exceptions, administrator scope, and renewal behavior.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Verified enterprise contract terms, module-level pricing, discount ranges, and realized customer spend for Juniper
      and close substitutes.
    whyItMatters: >-
      Public list-price snippets do not show whether Juniper is actually more expensive, cheaper, or more bundled at the
      deal level.
    diligencePath: Request current order forms or anonymized proposals from Juniper, Altvia, DealCloud, and Carta during diligence.
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: competitive-risk
    missingEvidence: >-
      Named win/loss data, retention by segment, and customer-switching case studies across Juniper and the most common
      substitutes.
    whyItMatters: >-
      Without direct displacement evidence, the moat assessment rests on product surfaces and reviewer commentary rather
      than observed share shifts.
    diligencePath: Ask management for segment-level churn, top competitive losses, and recent bake-off outcomes by product line.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-quality
    missingEvidence: Audited revenue, ARR, gross margin, and net revenue retention by business line
    whyItMatters: Revenue quality and margin durability cannot be underwritten from workflow breadth alone.
    diligencePath: Request audited financials plus software-versus-services revenue mix and gross-margin bridge.
    relatedQuestionRefs:
      - QI001
      - QI004
      - QI006
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized pricing, contract minimums, discounting practices, and attach rates for GPX, admin, and AI modules
    whyItMatters: Public product availability does not establish monetization strength or pricing power.
    diligencePath: Obtain current price book, sample MSAs or order forms, and realized pricing by segment and module.
    relatedQuestionRefs:
      - QI002
      - QI008
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, debt or credit facilities, monthly burn, runway, and next financing trigger
    whyItMatters: Prior capital raised is not the same as present liquidity or financing dependency.
    diligencePath: Request board-level liquidity plan, debt schedule, and monthly actual-versus-plan cash burn.
    relatedQuestionRefs:
      - QI006
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, CAC payback, pipeline conversion, win rates, and average sales-cycle duration by segment
    whyItMatters: Buyer personas alone do not show whether enterprise GTM is efficient or getting more expensive.
    diligencePath: Review cohort-level sales funnel, quota attainment, and payback data for the last four quarters.
    relatedQuestionRefs:
      - QI003
      - QI004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer concentration, churn, and gross-margin split between software and administration clients
    whyItMatters: Concentration and retention determine how durable the installed base is and whether services dilute margin.
    diligencePath: Request top-customer concentration, logo and dollar retention, and margin by customer cohort.
    relatedQuestionRefs:
      - QI005
      - QI008
  - type: missing-source
    severity: material
    topic: implementation-proof
    missingEvidence: >-
      Independent implementation data on deployment time, customer adoption depth, and realized workflow savings by
      segment.
    whyItMatters: >-
      Product breadth is easy to claim, but underwriting product maturity depends on whether large managers deploy
      multiple modules at scale without long implementation drag.
    diligencePath: >-
      Request implementation case studies, module-level customer penetration, and post-launch usage data split by client
      segment.
    relatedQuestionRefs:
      - QE001
      - QE004
  - type: private-evidence-only
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Independent evidence on uptime, SLA attainment, incident history, external security testing, and control-operation
      results beyond company-issued control statements.
    whyItMatters: >-
      The AI and API story relies on trust boundaries working in production, and public marketing claims do not
      substitute for operating proof.
    diligencePath: >-
      Request the latest SOC 2 report, security questionnaire responses, uptime history, and customer references focused
      on controls and operational resilience.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: agent-roadmap
    missingEvidence: >-
      Public proof that write-enabled agent actions and the planned headless LP surface are generally available and
      adopted in production.
    whyItMatters: >-
      The current product narrative leans heavily on agentic extensibility, but roadmap features should not be
      underwritten as if they were already scaled product capability.
    diligencePath: >-
      Ask for GA timelines, live customer references, API/change-control documentation, and usage metrics for Headless
      GPX write actions.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Public NRR, GRR, logo churn, renewal rates, contract duration, and top-customer concentration disclosure.
    whyItMatters: >-
      Without durability and concentration data, a large installed base cannot be converted into a confident view on
      recurring economics or account risk.
    diligencePath: >-
      Request cohort retention, renewal, churn, and concentration schedules during diligence, ideally split by vertical
      and by software versus administration customers.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: independent-deployment-proof
    missingEvidence: >-
      Independent customer case studies, procurement records, or customer-authored references confirming depth of
      deployment and renewal for named accounts.
    whyItMatters: >-
      The retained named proofs are useful, but they are still company-curated and do not show spend, contract scope, or
      realized ROI.
    diligencePath: >-
      Ask management for customer references willing to confirm production scope, renewal history, and quantified
      outcomes, then verify them against reference calls or customer-authored material.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: AI-and-regulatory-proof
    missingEvidence: >-
      Product-specific regulatory approvals, control-test results, and deployment boundaries for Headless GPX and Fay by
      jurisdiction
    whyItMatters: >-
      These are the fastest-moving risk surfaces and the current public evidence only shows design intent, not
      buyer-grade proof
    diligencePath: >-
      Request the current compliance package, approval map, and any external control-test summaries used in enterprise
      security review
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR005
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-cycle-dependence
    missingEvidence: >-
      Segment-level renewal rates, customer concentration, and win-rate movement across private equity, venture, and
      real assets
    whyItMatters: >-
      The operating-system repositioning only works if it improves segment economics rather than adding selling
      complexity
    diligencePath: >-
      Ask management for cohort renewals, concentration by top accounts, pipeline conversion by segment, and attached
      pricing or expansion data
    relatedQuestionRefs:
      - QR006
      - QR007
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
