    keyQuote: >-
      The Admin Oversight Agent began as an internal tool. Juniper Square's own fund administration team, which oversees
      more than $300 billion in assets under administration, built it to review its own work, and the agent now reviews
      every deliverable the team produces before it reaches a client. The checks were hardened against hundreds of real
      close packs from some of the world's largest and most complex GPs. Juniper Square is now putting that same review
      in the hands of any GP, whichever administrator they use. For clients who choose Juniper Square as their fund
      administrator, the Admin Oversight Agent is already part of the service—one example of how the firm's technology
      investments flow directly into the quality of its administration services.
