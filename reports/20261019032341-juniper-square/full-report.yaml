        - Do not underwrite a buy until financial and cap-table diligence closes.
      - - Confidence
        - Medium-low
        - The financing mark and scale are visible, but current economics are not.
      - - Risk rating
        - High underwriting risk
        - Product breadth is credible; valuation, dilution, and margin evidence remain incomplete.
      - - Valuation stance
        - Indeterminate at the last-round mark
        - Treat $1.1B as a historical reference, not a current fair-value range.
    notes: Analyst judgment based on retained public evidence; no audited operating model or current cap table was available.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV010
      - CV015
      - CV016
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - Scale above 2,300 GPs suggests a meaningful operating footprint.
        - Verified contraction in active GPs or materially weaker cohort retention.
      - - Thesis
        - >-
          Headless GPX expands the platform into AI-enabled reporting, accounting, compliance, fundraising, and investor
          operations.
        - Low paid adoption or evidence that integrations do not produce durable workflow usage.
      - - Anti-thesis
        - The retained evidence does not disclose audited unit economics or an unambiguous recurring-revenue metric.
        - Audited ARR, margins, retention, and cash-flow evidence supporting efficient growth.
      - - Anti-thesis
        - Fay launch coverage identifies undisclosed implementation, regulatory, and partnership details.
        - Production deployment evidence with measurable error reduction, compliance acceptance, and customer expansion.
    notes: Arguments distinguish company-issued scale claims from independent product reporting and disclosure criticism.
    claimRefs:
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - AI products convert into paid adoption; audited growth and retention validate category leadership.
        - >-
          A mark above the 2025 $1.1B reference could be supportable, but public evidence does not support a numeric
          range.
        - Requires verified adoption, margins, and retention.
        - AI releases fail to create paid expansion.
      - - Base
        - Scale holds and product breadth expands, but financial proof remains private.
        - Use $1.1B only as a reference and defer price formation until diligence supplies auditable inputs.
        - Most consistent with the current mixed evidence.
        - A financing is offered at the old mark without improved economics or investor protection.
      - - Bear
        - Growth slows, service intensity constrains margins, or a down round reveals weaker price support.
        - Value could fall below the last-round mark; no defensible public floor is available.
        - Supported by missing economic and capital-structure disclosure, not by a confirmed deterioration.
        - Down round, GP contraction, weak retention, or sustained cash consumption.
    notes: >-
      Scenario ranges are qualitative because public evidence does not support precise current values, probabilities, or
      return targets.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV010
      - CV011
      - CV013
      - CV016
