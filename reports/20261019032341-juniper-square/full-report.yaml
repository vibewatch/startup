      - number: '4.2'
        title: GTM motion, service delivery, and margin drivers
        blocks:
          - type: paragraph
            body: >-
              The public buyer profile is enterprise and operational rather than self-serve. Juniper Square's own hiring
              language says CFOs and COOs at private-equity, venture, and real-assets firms are core buyers, and it
              references pipeline contribution, win rates, sales-cycle movement, and competitive performance as internal
              commercial metrics. On the cost side, the delivery model appears hybrid: software modules and data
              infrastructure are paired with a fund-administration team that Juniper says already oversees more than
              $300 billion in assets under administration. The new Admin Oversight Agent may improve labor leverage if
              its claimed review-time reduction is real, but public evidence does not show service gross margin,
              software gross margin, or whether AI features are billed as premium modules versus being bundled into
              existing contracts.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI009
              - CI017
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
