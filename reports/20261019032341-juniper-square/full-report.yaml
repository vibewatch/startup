chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating scale
        blocks:
          - type: paragraph
            body: >-
              Juniper Square positions itself as an operations partner for private-markets general partners rather than
              a point solution. The homepage and fund-administration materials describe a connected stack spanning
              fundraising, investor onboarding, compliance, treasury, reporting, and outsourced fund administration,
              while the 2026 product updates emphasize AI workflows and model-agnostic integrations layered onto the
              same operating system. Public scale claims are large enough to matter for diligence: the company says more
              than 2,300 GPs run funds on the platform, with more than 750,000 LP accounts and around $1 trillion of
              investor equity on the platform. Those figures are directionally corroborated by independent coverage, but
              several important commercial metrics remain private, so later chapters should treat platform scale as
              evidence of market position rather than proof of revenue quality or retention economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
              - CO015
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO008
              - CO010
              - CO011
              - CO015
              - CO016
      - number: '1.2'
        title: Founders, leadership bench, and organizational footprint
        blocks:
          - type: paragraph
            body: >-
              The public record still points to a founder-led company shaped by a real-estate origin and later expansion
              into broader private markets. Juniper Square's own recruiting copy says the business was founded in 2014,
              has surpassed 1,000 employees, and operates with a hybrid footprint that includes San Francisco, New York
              City, Mumbai, and Bangalore plus a wider distributed workforce across North America, India, Luxembourg,
              and England. Leadership turnover in the current evidence looks additive rather than destabilizing: Brandon
              Sedloff moved from Chief Real Estate Officer to Chief Relationship Officer in 2026, Stephanie Miller
              joined as COO in 2025. That supports a view of increasing managerial depth, but the available evidence
              does not disclose the board composition, voting control, or post-Series D ownership concentration that
              would matter for governance diligence.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO010
              - CO011
          - type: table
            tableRef: TO002
            claimRefs:
              - CO005
              - CO006
              - CO007
      - number: '1.3'
        title: Funding history, strategic backers, and ecosystem ties
        blocks:
          - type: paragraph
            body: >-
              Juniper Square appears to have moved from category-building software vendor to scaled growth company
              through a multi-round financing history and a widening set of strategic relationships. Company-controlled
              and independent sources both support the June 2025 Series D at a $1.1 billion valuation, while the press
              archive also shows earlier funding rounds in 2018, 2019, 2020, and a $133 million fundraise in 2023. The
              same archive highlights a mix of capital and ecosystem relationships including Ribbit Capital, Owl Rock or
              Blue Owl, Nasdaq Ventures, data partners such as Nasdaq eVestment and Preqin, and operating partners such
              as Kudu Investment Management. That said, the public material does not break out secondaries, debt,
              liquidation preferences, or ownership by investor, so this chapter can confirm milestone financing events
              but not the present capital structure.
            claimRefs:
              - CO004
              - CO008
              - CO009
              - CO012
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO012
      - number: '1.4'
        title: Milestones, AI expansion, and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The 2025-2026 news flow shows Juniper Square pushing aggressively into AI-enabled workflow extensions
              rather than staying limited to investor reporting and recordkeeping. The company press archive records an
              AI CRM launch, strategic data integrations, an acquisition, a partnership with Kudu, Headless GPX, and the
              Fay oversight agent, while independent coverage corroborates the June and July 2026 launches. The
              strongest adverse signal in the assigned evidence is not a reported incident but a disclosure gap:
              independent commentary on Fay explicitly notes that Juniper Square did not disclose development spend,
              required regulatory approvals, partner scope, or implementation timing. Readers should therefore treat the
              AI narrative as strategically important and plausibly differentiating, but still incomplete from a
              diligence perspective until commercial adoption and compliance evidence is clearer.
            claimRefs:
              - CO012
              - CO013
              - CO015
