  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              The current public product story is much broader than investor reporting software. Across the GPX platform
              page, the Built In role brief, and Sacra's product summary, Juniper Square describes one operating layer
              that links fundraising, investor management, fund accounting, compliance, reporting, and administration
              for private-markets managers. That breadth matters because the company is explicitly repositioning from
              separate software and fund administration products toward an operating system for firm operations, not
              just a point tool. The customer proof is still marketing-led, but it is directionally consistent: JNR
              Management says the platform replaced manual onboarding and reporting workflows, while Juniper Square's
              own vertical messaging segments the same core product for private equity, venture, credit, real assets,
              and real estate use cases rather than a generic cross-industry CRM.
            claimRefs:
              - CE001
              - CE006
              - CE007
              - CE009
              - CE010
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
