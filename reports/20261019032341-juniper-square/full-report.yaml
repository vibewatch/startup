              - CE004
              - CE005
              - CE009
              - CE011
      - number: '5.2'
        title: Architecture, deployment surfaces, and AI extension
        blocks:
          - type: paragraph
            body: >-
              The clearest architectural pattern in the assigned evidence is a shared data model with multiple execution
              surfaces above it. Juniper Square's GPX page and Sacra both describe a single system of record for funds,
              investors, assets, positions, and capital activity, while the 2026 launch materials show that the company
              is now exposing that same layer through MCP-compatible Headless GPX, its developer API, and native AI
              agents. This is strategically important because it lets Juniper Square extend into agentic workflows
              without asking customers to move data into a second system. At the same time, the public evidence is still
              uneven: integrations and launch stories are visible, but there is little public documentation on
              implementation depth, write permissions in production, or how broadly the new agent surfaces are deployed
              across customers today.
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE011
              - CE014
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
