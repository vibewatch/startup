callouts:
  - calloutType: risk
    title: Top residual risk
    body: >-
      The sharpest downside is not a single lawsuit or outage visible in public evidence; it is control
      failure while Juniper Square broadens workflow access to AI across a very large installed base.
    claimRefs: [CR003, CR004, CR013]
  - calloutType: insight
    title: Public mitigations are credible but incomplete
    body: >-
      Management is talking about trust controls, auditability, and automated review in exactly the right
      places, but the retained pool still lacks enough external proof to downgrade control and compliance
      risk aggressively.
    claimRefs: [CR004, CR005, CR011]
  - calloutType: assumption
    title: Main open diligence assumption
    body: >-
      The assigned pool does not establish current incident or enforcement status; that missing primary
      evidence is a gap to verify and must not be read as proof that no event occurred.
    claimRefs: [CR011, CR014]
