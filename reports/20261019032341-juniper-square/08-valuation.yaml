callouts:
  - calloutType: "recommendation"
    title: "Price discipline is the gating issue"
    body: >-
      The operating narrative is investable only after diligence converts
      company-scale claims into audited economics and reconciles the fully
      diluted capitalization. Until then, the last financing mark is a reference,
      not a target.
    claimRefs: [CV004, CV006, CV015, CV016]
