  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Public NRR, GRR, logo churn, renewal rates, contract duration, and top-customer concentration disclosure.
      whyItMatters: Without durability and concentration data, a large installed base cannot be converted into a confident view on recurring economics or account risk.
      diligencePath: Request cohort retention, renewal, churn, and concentration schedules during diligence, ideally split by vertical and by software versus administration customers.
      relatedQuestionRefs: [QU004]
      relatedTableRefs: [TU002]
    - type: private-evidence-only
      severity: material
      topic: independent-deployment-proof
      missingEvidence: Independent customer case studies, procurement records, or customer-authored references confirming depth of deployment and renewal for named accounts.
      whyItMatters: The retained named proofs are useful, but they are still company-curated and do not show spend, contract scope, or realized ROI.
      diligencePath: Ask management for customer references willing to confirm production scope, renewal history, and quantified outcomes, then verify them against reference calls or customer-authored material.
      relatedTableRefs: [TU003]
