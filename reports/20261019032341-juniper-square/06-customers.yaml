            - Kudu ecosystem
            - Nasdaq eVestment / Preqin data
    claimRefs: [CU001, CU006, CU010, CU011]
callouts:
  - calloutType: strength
    title: Named proof is better than a logo wall
    body: >-
      Juniper's public customer evidence is stronger than a pure logo sheet because H.I.G.,
      Satori Capital, and Tishman Speyer are each tied to a specific workflow or outcome rather
      than being presented as anonymous brand collateral.
    claimRefs: [CU006, CU007, CU008, CU009]
  - calloutType: risk
    title: Durability still has to be underwritten offline
    body: >-
      The customer-count story is credible, but public evidence still does not disclose churn,
      NRR, GRR, contract duration, or concentration, and independent review coverage flags
      implementation and customization friction that could slow expansion.
    claimRefs: [CU012, CU013, CU014]
