schemaVersion: report-v2
artifact: customers
slug: juniper-square
runDate: 2026-10-19
company:
  name: Juniper Square
chapter:
  number: 6
  title: Customers
  summary: >-
    Juniper Square has credible customer adoption proof for a private-markets infrastructure
    company: official surfaces cite a large installed base, and named references from H.I.G.,
    Satori Capital, and Tishman Speyer support production use in investor-services and
    fund-administration workflows. The weak spot is durability: retained public evidence still
    does not disclose churn, NRR, contract length, or customer concentration, while an
    independent review flags implementation and customization friction.
sections:
  - id: customer-base-and-segments
    title: Customer base is GP-centric and increasingly multi-vertical
    body: >-
      Juniper Square's public customer story is centered on private-markets general partners as
      the paying buyer, with LPs and investor accounts positioned as the end-user surface for
      onboarding, reporting, and portal workflows. Official and third-party profiles consistently
      place the product inside private equity, venture, real estate, fund-of-funds, and private
      credit workflows rather than a broad horizontal fintech category. The most useful
      independent segmentation signal is the 2025 Thesis Driven interview with Brandon Sedloff:
      he said two of Juniper Square's five largest clients globally are real estate managers and
      three are not, which implies the platform's customer mix is no longer only commercial real
      estate. What remains missing is revenue mix by vertical, region, channel, and customer
      size, so the public record explains who Juniper targets more clearly than which cohort
      monetizes best.
    claimRefs: [CU001, CU002, CU005]
    tableRefs: [TU001]
  - id: adoption-proof-and-named-deployments
    title: Adoption proof is real, but still mostly company-curated
    body: >-
      Juniper Square presents stronger public adoption evidence than many private B2B software
      vendors, but most of that proof still originates on company-controlled surfaces. Official
      pages cite very large customer and end-user counts, while an independent 2026 vendor
      profile broadly corroborates the narrative that the platform is already operating at scale
      across private markets. Named references are also concrete rather than logo-only: H.I.G.,
      Satori Capital, and Tishman Speyer are each tied to a specific investor-services,
      administration, or investor-experience outcome. Fresh 2026 release notes and partner
      announcements further suggest Juniper is still shipping around LP communications, data
      enrichment, and administration oversight. That is positive for expansion potential, but it
      is not the same as disclosed retention, renewal, or wallet-share data.
    claimRefs: [CU003, CU004, CU006, CU007, CU008, CU009, CU010, CU011, CU015]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-friction-and-gaps
    title: Durability is the weak spot in the public customer case
    body: >-
      The biggest limitation in this chapter is not whether Juniper has customers; it is whether
      public evidence proves those customers are highly durable and broadly expanding. None of
      the retained sources discloses NRR, GRR, logo churn, contract length, or top-customer
      concentration, so a large installed base cannot be treated as proof of sticky economics or
      low concentration risk. The independent review coverage is directionally useful because it
      pairs strong support feedback with a roughly three-month implementation cycle and explicit
      friction points: complex structures can create learning curves, customization is not always
      sufficient, some manual processes remain, and migrations have caused data-transfer issues.
      The resulting read-through is that Juniper appears to deliver value for sophisticated GPs,
      but onboarding and expansion likely still require meaningful services and change-management
      work.
    claimRefs: [CU012, CU013, CU014]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale signal
      - Revenue / strategic value
      - Gap
    rows:
      - - Private equity GPs
        - CFO / COO / IR teams buy; LPs consume onboarding and reporting outputs
        - Fundraising, investor onboarding, reporting, fund administration
        - Included across company and third-party profiles
        - Core software plus administration wallet share
        - No public customer-count split by PE
      - - Venture and growth managers
        - GP operating teams buy; investor-facing teams and LPs use workflow outputs
        - Fundraising, CRM, investor communications, reporting
        - Company pages and third-party profiles list venture among served asset classes
        - Supports vertical expansion beyond real estate
        - No public ARR or retention by venture cohort
      - - Real estate / real assets managers
        - GP finance, IR, and operations teams buy; investors use portal/reporting surfaces
        - Legacy fundraising, reporting, and administration workflows
        - Sedloff says 2 of 5 largest clients are real estate managers
        - Historical beachhead and still a major reference set
        - Public sources do not quantify present real-estate revenue share
      - - Non-real-estate private-markets managers
        - GP operating teams buy; LPs remain the end-user surface
        - Private equity, private credit, infrastructure, and adjacent fund operations
        - Sedloff says 3 of 5 largest clients do not own real estate
        - Evidence of broader category relevance
        - No public count for private-credit or infrastructure customers
    notes: >-
      Segment rows synthesize company-controlled positioning with one independent interview; they
      show target cohorts and strategic direction, not disclosed revenue mix or cohort economics.
    claimRefs: [CU001, CU002, CU005]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / recency
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - GP customer count
        - over 2,000 GPs
        - Current undated company page
        - Company page
        - Medium
        - Very large installed base for a private-markets workflow vendor
        - Company does not define active customer, contract, or account basis
      - - Investor / LP accounts
        - 650,000 investors
        - Current undated company page
        - Company page
        - Medium
        - Large end-user footprint for LP-facing workflows
        - No split by paying buyer, active account, or geography
      - - Investor / LP accounts
        - 750,000+ investor accounts
        - Current undated learn-more page
        - Learn-more page
        - Medium
        - Suggests continued scale growth or a broader measurement basis
        - Public pages do not reconcile why this differs from 650,000
      - - Investment entities and capital / administration scale
        - 45,000+ investment entities, $1T investor equity, $300B+ under administration
        - 2026 independent vendor profile
        - AI FinTech Index
        - Medium
        - Independent profile broadly corroborates a large installed base
        - Methodology and exact as-of date are not disclosed
    notes: >-
      Values mix company-reported and third-party-reported metrics with different denominators;
      they are useful as adoption signals but not a reconciled customer ledger.
    claimRefs: [CU003, CU004]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome / proof
      - Limitation
    rows:
      - - H.I.G.
        - Multi-asset GP / fund manager
        - Investor services outsourcing and reporting support
        - Production-style reference
        - >-
          "scale faster across private equity, real estate, and credit without sacrificing the
          quality or speed of reporting"
        - Company-curated testimonial with no public renewal or contract-scope disclosure
      - - Satori Capital
        - GP / fund manager
        - Fund administration and investor dashboard workflows
        - Production-style reference
        - >-
          Selected Juniper for its "tech-led focus, investor dashboard capabilities, and
          partnership mindset"
        - No independent third-party case study or ROI detail retained here
      - - Tishman Speyer
        - Large real-estate GP
        - Investor experience and cross-team operating workflow
        - Production-style reference
        - >-
          "We wanted our technology to match the quality that an investor expects from Tishman
          Speyer. Juniper Square helps us ensure that result."
        - Public proof is a company quote and logo usage, not an independent deployment write-up
      - - ApexOne Investment Partners
        - Investment manager / CFO buyer persona
        - Early use of Fay for fund-administrator oversight
        - Early adopter reference
        - Independent vendor profile names the CFO of ApexOne as early adopter work for Fay
        - Outcome detail is limited and does not prove broad deployment across the platform
    notes: >-
      Coverage is partial because most retained named references remain company-curated; the rows
      demonstrate concrete use cases, but not independent proof of renewal, spend, or depth of
      deployment.
    enumerationScope:
      coverage: partial
      basis: >-
        Named public references retained in this worker pool for the 2025-2026 refresh window;
        company-curated testimonials were kept only when tied to explicit use-case language.
    claimRefs: [CU006, CU007, CU008, CU009, CU015]
