companyProfile:
  summary: >-
    Juniper Square is a founder-led private-markets fund operating system that combines software, data, fund
    administration, and AI workflows for general partners. The company says more than 2,300 GPs run funds on its
    platform, while public evidence also points to more than 750,000 LP accounts and more than $1 trillion of investor
    equity on the platform. Its 2025-2026 product cycle shows a deliberate push into AI-enabled workflows and
    integrations, but the public record still does not disclose audited revenue quality, margin, retention, or full
    capital-structure terms.
  productSummary: >-
    Juniper Square sells a private-markets fund operations platform that spans investor CRM, fundraising, onboarding,
    reporting, treasury, fund administration, and AI-enabled workflow tools.
