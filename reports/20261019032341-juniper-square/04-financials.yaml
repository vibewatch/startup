      topic: revenue-quality
      missingEvidence: Audited revenue, ARR, gross margin, and net revenue retention by business line
      whyItMatters: Revenue quality and margin durability cannot be underwritten from workflow breadth alone.
      diligencePath: Request audited financials plus software-versus-services revenue mix and gross-margin bridge.
      relatedQuestionRefs: [QI001, QI004, QI006]
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Realized pricing, contract minimums, discounting practices, and attach rates for GPX, admin, and AI modules
      whyItMatters: Public product availability does not establish monetization strength or pricing power.
      diligencePath: Obtain current price book, sample MSAs or order forms, and realized pricing by segment and module.
      relatedQuestionRefs: [QI002, QI008]
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current cash balance, debt or credit facilities, monthly burn, runway, and next financing trigger
      whyItMatters: Prior capital raised is not the same as present liquidity or financing dependency.
      diligencePath: Request board-level liquidity plan, debt schedule, and monthly actual-versus-plan cash burn.
      relatedQuestionRefs: [QI006]
    - type: private-evidence-only
      severity: material
      topic: sales-efficiency
      missingEvidence: CAC, CAC payback, pipeline conversion, win rates, and average sales-cycle duration by segment
      whyItMatters: Buyer personas alone do not show whether enterprise GTM is efficient or getting more expensive.
      diligencePath: Review cohort-level sales funnel, quota attainment, and payback data for the last four quarters.
      relatedQuestionRefs: [QI003, QI004]
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Customer concentration, churn, and gross-margin split between software and administration clients
      whyItMatters: Concentration and retention determine how durable the installed base is and whether services dilute margin.
      diligencePath: Request top-customer concentration, logo and dollar retention, and margin by customer cohort.
      relatedQuestionRefs: [QI005, QI008]
