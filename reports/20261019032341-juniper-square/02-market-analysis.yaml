      severity: "material"
      topic: "segment-economics"
      missingEvidence: "Segment-level ARR, customer counts, pricing, win rates, retention, and implementation time by private equity, venture, and real-assets customer cohort."
      whyItMatters: "Vertical positioning alone does not show which segments pay, retain, or expand enough to define the serviceable market."
      diligencePath: "Obtain a management cohort export by vertical and product, reconcile customer counts to contracted ARR, and sample recent wins, losses, churn, and implementation records."
