    columns:
      - Layer / component
      - Role
      - Dependency
      - Risk
    rows:
      - [Unified data model and system of record, Holds fund investor asset position and capital-activity data in one private-markets structure, Accurate entity mapping and clean fund-level data, Public materials do not expose data-model migration complexity]
      - [Workflow applications, Runs CRM onboarding reporting treasury transfers and waterfall processes on top of the same data, Adoption across IR finance operations and administration teams, Broad scope increases implementation and change-management burden]
      - [Control plane, Applies authentication permissions and audit logging across platform and AI surfaces, SSO 2FA IP restrictions RBAC and SOC 2 Type II controls, Company-issued evidence dominates and external assurance detail is thin]
      - [External and AI surfaces, Extends the same workflows through MCP developer API partner data feeds and native AI agents, Stable APIs integration governance and model-safe permissions, Write-enabled actions and headless LP roadmap items are not yet publicly documented as scaled production use]
    notes: >-
      This table describes the public operating architecture, not a reverse-engineered system diagram; unknowns are kept
      explicit where sources stop at feature or launch language.
    claimRefs: [CE002, CE004, CE008, CE011, CE014]
