      - ["Close, compliance, and oversight", "Controllers and compliance teams use the same connected fund data", "Fay and Headless GPX extend workflows into AI clients while preserving permissions and audit controls", "Launch materials say Fay catches errors before auditors or investors and agents can flag stale AML/KYC or low cash balances", "No public benchmark on false positives or close-cycle improvement"]
    notes: >-
