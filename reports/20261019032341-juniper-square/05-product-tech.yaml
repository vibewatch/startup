  evidenceGaps:
    - type: missing-source
      severity: material
      topic: implementation-proof
      missingEvidence: Independent implementation data on deployment time, customer adoption depth, and realized workflow savings by segment.
      whyItMatters: Product breadth is easy to claim, but underwriting product maturity depends on whether large managers deploy multiple modules at scale without long implementation drag.
      diligencePath: Request implementation case studies, module-level customer penetration, and post-launch usage data split by client segment.
      relatedQuestionRefs: [QE001, QE004]
    - type: private-evidence-only
      severity: material
      topic: security-assurance
      missingEvidence: Independent evidence on uptime, SLA attainment, incident history, external security testing, and control-operation results beyond company-issued control statements.
      whyItMatters: The AI and API story relies on trust boundaries working in production, and public marketing claims do not substitute for operating proof.
      diligencePath: Request the latest SOC 2 report, security questionnaire responses, uptime history, and customer references focused on controls and operational resilience.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: material
      topic: agent-roadmap
      missingEvidence: Public proof that write-enabled agent actions and the planned headless LP surface are generally available and adopted in production.
      whyItMatters: The current product narrative leans heavily on agentic extensibility, but roadmap features should not be underwritten as if they were already scaled product capability.
      diligencePath: Ask for GA timelines, live customer references, API/change-control documentation, and usage metrics for Headless GPX write actions.
      relatedQuestionRefs: [QE007]
