summary:
  headline: >-
    VNLIFE is a real scaled Vietnamese payments platform with durable strategic relevance, but thin public economics and
    only an indicative >US$1B secondary valuation anchor support a RESEARCH MORE recommendation rather than an
    aggressive buy.
  overallScore: 6.1
