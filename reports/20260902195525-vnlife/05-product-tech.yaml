  - - VNPAY-POS / SmartPOS
    - Merchants / SMEs
    - Mature / live
    - All-in-one in-store acceptance plus operational tooling
    - Current hardware fleet utilization not public
  - - PhonePOS / SoftPOS
    - SMEs, micro-merchants, mobile sellers
    - Scaling / recently strengthened
    - Low-capex NFC acceptance on Android phones with strong security certifications
    - No public cross-border acceptance failure-rate or device-compatibility data
  - - VNPAY Merchant reporting
    - Merchants / store operators
    - Live
    - Centralizes transaction visibility, cash-flow and sales oversight
    - Feature depth and retention not public
  - - VNPAY Invoice
    - Businesses / household businesses
    - Live
    - Links payments to e-invoice and tax workflow under local regulation
    - No public invoice volume or attach-rate disclosure
  - - eKYC / biometrics
    - Banks, financial institutions
    - Mature / live
    - Combines OCR, face verification, fraud detection, and bank deployments
    - No public fraud-loss or false-positive performance data
  - - VNeDOC / VNPAYCONTRACT
    - Enterprises / regulated partners
    - Live but earlier-stage than core payments
    - Combines e-contract, remote signing, timestamps, and API / deployment flexibility
    - No public customer count, SLA, or throughput data
  - - Tax-payment / household-business suite
    - SMEs / household businesses / bank partners
    - Live / expansion stage
    - Integrates payment, invoice, signature, storage, and tax transmission in one flow
    - Commercial durability after subsidies remains unclear
  notes: Module maturity is inferred from public deployment evidence, integration depth, and certification sequence; VNPAY does not publish a formal product-maturity grid.
