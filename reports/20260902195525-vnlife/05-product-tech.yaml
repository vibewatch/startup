- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Complete online checkout
    - Merchant site/app routes payer to payment option, bank, or QR method
    - VNPAY Payment Gateway + VNPAY-QR
    - Broader payment-method coverage and automated callbacks / reporting
    - Public sources do not quantify conversion uplift
  - - Accept in-store mixed payments
    - Merchant handles cards, QR, and wallets at point of sale
    - SmartPOS / VNPAY-POS
    - Consolidates methods and can print / scan / report on one device
    - No public device uptime or service-ticket stats
  - - Accept card payment without dedicated POS hardware
    - Small seller needs flexible acceptance on phone
    - PhonePOS / SoftPOS
    - Lower capex and faster deployment for mobile sellers
    - Android / NFC dependency and device-compatibility details are not fully public
  - - Onboard customers digitally
    - Bank or fintech verifies identity remotely
    - eKYC
    - Reduces branch dependency and manual onboarding burden
    - No public bank-by-bank conversion or fraud benchmark
  - - Issue invoice and stay tax-compliant
    - Merchant must record sale, issue invoice, and transmit data
    - VNPAY Invoice + tax suite
    - Unifies sales recording, invoice issuance, and tax workflow
    - No public attach-rate, error-rate, or adoption cohorts
  - - Execute contracts remotely
    - Enterprise or partner needs compliant document execution
    - VNeDOC / VNPAYCONTRACT
    - Supports remote signing, timestamps, and direct verification pathways
    - No public benchmark against DocuSign-class UX or throughput
  - - Embed ecosystem services in banking apps
    - Bank wants consumer utility without building everything in-house
    - VNPAY ecosystem + APIs
    - Expands bank-app value proposition via partner integrations
    - Public architecture details stop at system-level description
  notes: Benefits are described in source language as operational, security, or workflow improvements; most are not independently quantified in public sources.
