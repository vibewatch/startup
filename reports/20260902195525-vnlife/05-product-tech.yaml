- id: trust-security-compliance
  title: Trust, safety, security, and compliance controls
  body: 'Trust is where VNPAY’s public evidence is strongest. Official and independent sources support a sequence from 2022 SoftPOS security and EMV work, to 2023 e-contract certification, to 2025 MPoC for PhonePOS, and to 2025 PCI DSS 4.0.1 Level 1 coverage across six services. The eKYC page adds further non-trivial identity evidence with ISO/IEC 30107-3, ISO/IEC 19795-2, ISO 27001, and government cloud-criteria references. These are meaningful signals because they span different parts of the stack: card acceptance, device security, cloud and gateway controls, identity verification, and legal-document integrity. They also help explain how VNPAY can credibly sell into banks and regulated merchants. The key limitation is that certification evidence is not the same as reliability evidence. The public record still lacks incident transparency, public audit summaries, rate-limit details, bug-bounty posture, and operational metrics such as uptime or failed-transaction ratios. So the correct conclusion
    is not that risk is absent; it is that compliance maturity is visible while runtime transparency is not.'
  claimRefs:
