- id: architecture-integration
  title: Operating architecture, integration model, and deployment
  body: 'Public technical documentation gives enough evidence to describe the operating model at a systems level even if VNPAY does not publish a full architecture white paper. The gateway documentation shows a merchant-to-VNPAY redirect pattern with signed parameters, return URLs, and IPN callbacks; the downloads page lists test cases and code demos across multiple backend languages plus mobile SDK materials. Other product pages imply additional architecture layers on top of that core rail: VNPAY Merchant reporting for sellers, SmartPOS and PhonePOS for in-person acceptance, invoice and tax engines for merchant back office, and identity or signing modules for onboarding and legal execution. VNPAYCONTRACT further suggests the company can package products for both cloud and on-premise deployment while exposing APIs for partner integration. Put differently, the public record supports a platform architecture with several delivery surfaces, but it does not support strong claims on microservice
    layout, database topology, uptime SLOs, or disaster-recovery design. Those remain diligence items.'
