- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Merchant website / app
    - Collects order context and initiates payment
    - Merchant integration quality, HTTPS, parameter handling
    - Integration errors or weak secret handling can break payment flow
  - - Redirect payment URL
    - Transfers customer to VNPAY with signed parameters
    - Correct TmnCode, vnp_HashSecret, callback config
    - Signature or callback misconfiguration can cause failed or untrusted flows
  - - VNPAY gateway core
    - Processes payment request and orchestrates bank / rail interaction
    - VNPAY core availability and partner connectivity
    - Outage or degraded routing impacts merchant revenue directly
  - - Bank / wallet / card rails
    - Provide payer funding source and authentication
    - Issuers, acquirers, bank apps, wallets, card schemes
    - Partner dependency and multi-rail complexity
  - - Return URL
    - Returns front-end payment result to merchant experience
    - Merchant front-end handling
    - Can mislead users if treated as final settlement source
  - - IPN callback
    - Provides server-side transaction outcome to merchant backend
    - Merchant backend availability and idempotent processing
    - Dropped or delayed callbacks can create reconciliation errors
  - - Merchant operations layer
    - Reporting, cash-flow, and transaction management surfaces
    - VNPAY Merchant app / portals
    - Limited public transparency on permissions, audit trail, and uptime
  - - Invoice / tax layer
    - Generates invoices and transmits tax-related data
    - Local tax rules and merchant-system integration
    - Regulatory change or integration fragility
  - - Identity / signing layer
    - eKYC, digital signatures, timestamps, contract integrity
    - Device quality, biometric controls, legal registries
    - Fraud, false rejection, or document-integrity disputes
  notes: This table is systems-level only; VNPAY does not publish a component-by-component internal stack map.
