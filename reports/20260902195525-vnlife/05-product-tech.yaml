callouts:
- calloutType: insight
  title: The moat is workflow stitching, not just payment acceptance
  body: Public evidence points to a stack that connects bank distribution, acceptance, merchant reporting, invoices, contracts, and tax workflows. That integration depth is more defensible locally than any single QR or wallet feature.
  claimRefs:
  - CE002
  - CE009
  - CE016
  - CE036
  - CE037
- calloutType: strength
  title: Trust evidence is stronger than architecture transparency
  body: VNPAY shows recurring payment-security and identity-control signals—PCI DSS, PCI CPoC, MPoC, ISO eKYC evidence, and MOIT registration—but still withholds most runtime and infrastructure details.
  claimRefs:
  - CE026
  - CE027
  - CE029
  - CE030
  - CE031
  - CE034
- calloutType: risk
  title: Private-stack opacity remains a real diligence issue
  body: There is no public status page, uptime record, detailed changelog for the core gateway, or public incident-history view. Any infrastructure-grade investment case still needs private technical and security diligence.
