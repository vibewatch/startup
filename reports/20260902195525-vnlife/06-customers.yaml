- id: customer-verdict
  title: Customer verdict
  body: The customer verdict is positive on breadth and only moderate on quality transparency. VNPAY clearly has real customers across banks, merchants, SMEs, household businesses, and enterprise workflow use cases. The most convincing proof is not raw user counts; it is the repeated evidence that banks and business operators keep finding adjacent reasons to adopt more of the stack—payment acceptance, invoice, contracts, tax, and reporting. That said, investor confidence should stop short of assuming deep retention or low concentration from those rollout announcements alone. Public customer evidence is directionally strong enough to support commercial relevance, but not strong enough to fully underwrite lifetime value, revenue concentration, or renewal durability. Future diligence should therefore center on partner economics, active merchant cohorts, attach rates, and top-bank dependency rather than on whether VNPAY can acquire logos at all.
  claimRefs:
  - CU027
