- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Tax-formalization wave for household businesses
    - If adoption is concentrated in a few bank channels, customer breadth may be overstated
    - Could make growth look broad while revenue remains partner-concentrated
    - Request bank-level customer activation and revenue mix
  - - Bank-led distribution into SMEs
    - Dependence on partner priorities and app shelf space
    - Partner de-prioritization could slow onboarding or attach
    - Review bank contracts, exclusivity, and termination clauses
  - - Cross-sell from payments into invoice / contracts / tax
    - Attach may be lower than marketing suggests
    - Would weaken LTV expansion thesis
    - Request attach rates and cross-sell conversion by cohort
  - - PhonePOS low-capex onboarding
    - High top-of-funnel adoption may not equal durable usage
    - Could create weak device utilization or low-paying cohorts
    - Request monthly transacting businesses and device activity
  - - Consumer reach through bank apps and acceptance points
    - Category-level multi-homing weakens direct loyalty inference
    - May limit pricing power or predictive consumer retention
    - Separate merchant stickiness from consumer app preference
  notes: Expansion is credible, but the channel structure can hide meaningful concentration.
  claimRefs:
  - CU028
  - CU029
  - CU031
  - CU037
  - CU040
- id: TU006
  title: Public customer-data gaps table
  columns:
  - Missing private metric
  - Impact on customer underwriting
  - Exact diligence path
  rows:
  - - Top-10 bank / partner revenue concentration
    - Cannot judge dependency on a few institutions
    - Request partner revenue, TPV, and take-rate contribution by top channel
  - - Active vs signed merchants / enterprises
    - Cannot distinguish logo inventory from real usage
    - Provide monthly active merchants, transacting locations, and active enterprise seats
  - - Merchant churn and reactivation
    - Cannot underwrite durability of SME cohorts
    - Request cohort retention by QR, gateway, SmartPOS, and PhonePOS
  - - Attach rate into invoice, contract, and tax modules
    - Cannot test land-and-expand narrative
    - Provide product penetration by merchant and bank cohort
  - - Consumer-to-merchant funnel by channel
    - Cannot separate end-user reach from monetizable activity
    - Share payer MAU, payment frequency, and routed transaction mix
  - - Reference-customer pipeline and renewal history
    - Cannot judge whether named proof scales beyond PR examples
    - Provide case-study list with contract age, renewal, and expansion status
  notes: These are the minimum private customer metrics needed to turn breadth proof into retention-quality confidence.
  claimRefs:
  - CU023
  - CU024
  - CU028
  - CU035
  - CU040
