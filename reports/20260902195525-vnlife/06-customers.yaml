- id: named-customer-proof
  title: Named customer proof and production evidence
  body: Named customer proof is strongest when VNPAY is attached to a concrete operating workflow rather than presented as a generic logo wall. The best examples include VIB’s SME digitization bundle with Visa, Sacombank’s and OCB’s 2026 tax-formalization rollouts, PGBank’s expansion from digital-banking work into tax and payment tooling, and Vietbank, ACB, Co-opBank, and SAIGONBANK deployments aimed at real customer segments. VNeDOC also offers useful enterprise proof because its site includes customer and partner testimonials from BSC, FSS, and VNSKY with some outcome specificity. None of these should be overstated into perfect retention evidence, but they are stronger than speculative pilot language. The repeated pattern is production-oriented rollout around specific use cases—merchant payment acceptance, invoice issuance, digital contracts, or tax compliance—rather than experimentation detached from monetizable workflows. That makes the customer proof credible even though most of it
    still sits on vendor- or partner-hosted pages.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
