company:
  name: VNLIFE
chapter:
  number: 6
  title: Customers
  summary: 'VNLIFE’s customer base is broad in surface area and strongest in channel-led proof. Public evidence supports a three-sided model: banks and financial institutions as distribution partners and enterprise buyers, merchants and household businesses as direct workflow customers, and consumers as transaction users routed through bank apps, QR, wallet, and card acceptance points. Adoption proof is credible on breadth—40-plus banks, hundreds of thousands of merchant or enterprise touchpoints, tens of millions of end users, 450,000-plus acceptance points, and 10,000-plus PhonePOS businesses—but much weaker on retention quality, revenue concentration, and cohort economics. Named customer evidence is best where VNPAY’s products solve operational pain, especially SME tax formalization, digital contracts, and bank-embedded workflows.'
sections:
- id: customer-segmentation
  title: Customer base segmentation by buyer, user, and payer
  body: 'VNPAY’s customer base is better understood as a routed ecosystem than as one homogeneous customer pool. Banks and financial institutions are both channel partners and buyers of software or infrastructure modules. Merchants, SMEs, and household businesses are direct commercial users of acceptance, invoicing, and tax tools. Consumers are the transacting end users, but often they enter the system through bank apps, QR acceptance points, or merchant checkout rather than through a single VNPAY consumer habit. That distinction matters because breadth at the consumer edge does not automatically reveal who pays VNPAY or how sticky revenue is. Public evidence suggests the highest-value customer relationships sit where VNPAY can combine distribution, payment acceptance, and compliance-linked tooling. The company’s surface is therefore unusually segmented: one buyer may be a bank procurement team, one user may be a merchant cashier, and the economic beneficiary may be an SME owner trying to
    formalize reporting under new tax rules. This complexity is a strength because it creates multiple entry points, but it also complicates simple user-count interpretation.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
