- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - Banks and financial institutions
    - Buyer + channel + integration user
    - Embed QR, gateway, eKYC, or merchant solutions into bank offerings
    - 40+ to 45+ banks across sources
    - High strategic value because banks drive distribution and trust
    - No bank-by-bank revenue concentration disclosed
  - - Merchants / enterprises
    - Buyer + operational user
    - Gateway, QR, SmartPOS, PhonePOS, reporting, invoice
    - 250k+ to 350k+ enterprises / partners across sources
    - Core payment and software monetization surface
    - No active-vs-signed merchant breakdown
  - - Household businesses / micro-SMEs
    - Buyer + daily workflow user
    - Payment acceptance, invoice, tax, bookkeeping, signature
    - Rapid 2025-2026 rollout via bank campaigns
    - Important new expansion wedge under tax formalization
    - No attach, activation, or retention cohorts public
  - - Consumers in bank apps / VNPAY rails
    - End user, indirect payer
    - QR, card, wallet, app-call-app, bank-app transactions
    - 35m+ to 40m+ customer / consumer signals across sources
    - Supports transaction density and merchant value proposition
    - Direct monetization and loyalty are not transparent
  - - Enterprise workflow users
    - Buyer / legal / finance user
    - VNeDOC, invoice, signature, tax, B2B workflows
    - Named testimonial and partner proof but limited counts
    - Higher-value attach opportunity beyond payment routing
    - No public ARR or renewal metrics
  notes: Scale labels are not harmonized across sources; they should be treated as breadth signals rather than as a clean customer hierarchy.
