- id: adoption-trajectory
  title: Adoption trajectory and breadth of deployment
  body: 'The public record gives credible breadth signals even if it does not provide a clean cohort model. Official and partner releases consistently describe 40-plus bank relationships, very large end-customer reach, and broad merchant acceptance across QR, POS, and PhonePOS channels. Additional 2025-2026 sources show the company widening distribution through bank-led SME and household-business programs tied to tax and invoice workflows. That suggests VNPAY is not merely defending a legacy base; it is still adding channel surfaces that can feed new merchant acquisition. The denominator problem remains real: some sources count customers, some count consumers, some count enterprises, some count partners, and some count acceptance points. Even so, the overall direction is clear. VNPAY’s deployment breadth is large enough that the key diligence question is no longer whether customers exist. It is how much revenue quality, retention, and partner concentration sit behind those counts.'
  claimRefs:
