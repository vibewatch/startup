- id: durability-concentration
  title: Durability, expansion, and concentration risk
  body: 'This is the weakest part of the public customer record. There is no disclosed NRR, GRR, churn, contract-length, or renewal-rate series. Consumer-facing evidence from Vietnam’s wallet market actually cuts the other way: multi-homing is common, promotions matter, and bank-owned apps have been taking mindshare. That means VNPAY’s durable revenue likely depends less on exclusive consumer habit and more on operational embed with banks and merchants. The 2025-2026 bank-partnership wave supports that thesis because it shows expansion into tax, invoice, and recordkeeping workflows that are harder to swap than a promo-driven wallet choice. Even so, that same bank dependence creates concentration risk. If a few large banking partners drive a disproportionate share of traffic, VNPAY’s apparent breadth could mask underlying concentration. The right conclusion is balanced: expansion vectors are visible and plausible, but customer durability and top-partner concentration remain materially under-disclosed.'
  claimRefs:
