companyProfile:
  summary: VNLIFE is a Hanoi-founded Vietnamese fintech group established in 2007 and best known for VNPay, its bank-embedded payments and merchant-software franchise. Public evidence describes a platform spanning QR payments, payment gateway, POS/PhonePOS, eKYC and biometrics, invoicing, digital contracts, and tax-linked SME workflows rather than a single-purpose consumer wallet. The strongest scale evidence comes from official VNPAY surfaces and the 2025 Vietcap profile, which together support 40-45+ bank relationships, hundreds of thousands of merchants or enterprise touchpoints, tens of millions of consumers, and roughly 3,000+ staff. Funding history is unusually visible for a private Vietnamese fintech, with about US$550 million of disclosed capital across 2019 and 2021 rounds and a later 2025 secondary-sale discussion implying a valuation above US$1 billion.
  foundedDate: '2007-01-01'
  foundingLocation: Hanoi, Vietnam
  headquarters: Hanoi, Vietnam
  productSummary: VNLIFE sells payment acceptance and bank-distributed digital-finance infrastructure through VNPay QR, online payment gateway, POS and PhonePOS, eKYC, invoicing, digital-signature and contract tools, and tax-linked workflow software for merchants, SMEs, household businesses, and financial institutions.
  customerFocus: Banks and financial institutions as channel partners and buyers; merchants, SMEs, household businesses, and enterprises as direct workflow users; and consumers transacting through bank apps, QR, wallet, and acceptance points.
  businessModel: Multi-stream fintech infrastructure monetized through payment-processing and MDR economics, bank software and service fees, identity and compliance tooling, distribution commissions, and workflow products such as invoice, contract, signature, and tax transmission.
  stage: Late-stage private / unicorn-range secondary
  fundingStatus: Publicly supported funding totals are roughly US$550 million across the 2019 SoftBank/GIC financing and the 2021 Series B led by General Atlantic and Dragoneer, with PayPal Ventures and others participating. September 2025 reporting later indicated existing holders were exploring a stake sale at a valuation above US$1 billion, but no closed new primary financing was publicly identified.
