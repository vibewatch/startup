  topStrengths:
  - 'Bank-embedded distribution is real: public sources support 40-45+ bank relationships plus wide QR and merchant deployment.'
  - The product surface is broader than a consumer wallet, spanning acceptance, gateway, PhonePOS, eKYC, invoicing, tax, and digital-contract workflows.
  - Historical backing from GIC, SoftBank, General Atlantic, Dragoneer, and PayPal Ventures lowers existential credibility risk and supports exit optionality.
  - Recent customer-proof sources show continued 2025-2026 rollout momentum through bank-linked SME and household-business programs.
  topRisks:
  - 'Current public valuation support is thin: the freshest anchor is a reported September 2025 stake-sale discussion above US$1 billion, not a disclosed closed financing.'
  - No public audited bridge exists for revenue, take rates, margins, cash generation, or partner concentration, which makes comp-based pricing necessarily approximate.
  - Regulatory tightening can strengthen the moat while still raising onboarding friction, compliance burden, and operating-cost risk.
  - Bank-app competition and the possibility of concentrated channel economics limit willingness to pay a premium for consumer scale alone.
  - Cap-stack and preference terms remain opaque, so headline valuation may not translate cleanly into common-equity returns.
  unresolvedGaps:
  - Audited net-revenue, gross-margin, EBITDA, and cash-flow bridge by product line.
  - Top-bank and top-merchant concentration, active cohort retention, and attach rates for tax, invoice, and contract modules.
  - Current cap table, liquidation preferences, investor rights, and any debt or senior claims.
  - Quantified impact of newer e-wallet and recordkeeping rules on onboarding conversion, fraud, and compliance cost.
  - Evidence that compliance-led SME and household-business cohorts remain valuable after subsidies or rollout promotions fade.
