      - number: '2.2'
        title: 堆栈测算：TAM、SAM 与证据约束下的 SOM
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数字很多，但它们描述的是堆栈的不同层。Mordor 最宽的支付口径把越南支付市场规模列为 2025 年 US$120.78 billion、2026 年 US$133.35 billion，并到
              2031 年达到 US$218.8 billion。Ken Research 观察的是更窄的数字支付和电子钱包服务商收入池，测算为 2025 年 US$780 million、2031 年 US$1.98
              billion。Digital in Asia 又给出更宽的金融科技市场估计——从 2025 年 US$3.42 billion 到 2030 年 US$7.78 billion——并单独引用 US$47.56
              billion 的移动支付市场。这些不是彼此矛盾，更多是边界错配。总支付流水、服务商收入和全金融科技收入是不同量。对 VNLIFE 最干净的 SAM 不是完整支付 TAM，而是钱包、QR、网关、商户收单和 B2B
              支付工作流中，银行分发和商户分发产品真正发挥作用的那部分。即便如此，公开来源也无法把这个 SAM 可靠换算成 VNLIFE 的 SOM，因为 VNPay 不披露
              GMV、抽成率或分部收入。因此本章保留多种口径，标出方法差异，并把 VNLIFE 的真实市场份额视为尽调缺口，而不是猜一个结论。
