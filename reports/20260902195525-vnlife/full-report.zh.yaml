companyProfile:
  summary: >-
    VNLIFE 是一家 2007 年创立于 Hanoi 的越南金融科技集团，最知名的是 VNPay 这块嵌入银行渠道的支付和商户软件业务。公开证据显示，公司不是单一用途的消费者钱包，而是一套横跨 QR
    支付、支付网关、POS/PhonePOS、eKYC 与生物识别、开票、电子合同，以及接入税务的 SME 工作流的平台。最强规模证据来自 VNPAY 官方页面和 2025 年 Vietcap 公司资料：两者共同支撑 40-45+
    家银行关系、数十万商户或企业触点、数千万消费者，以及约 3,000+ 名员工。作为越南私营金融科技公司，VNLIFE 的融资历史罕见地可见：2019 年和 2021 年两轮合计披露资本约 US$550 million；后续 2025
    年二级股权出售讨论则暗示估值超过 US$1 billion。
