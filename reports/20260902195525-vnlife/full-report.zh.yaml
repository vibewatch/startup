    type: flow
    title: 投资建议逻辑
    layout: wide
    summary: 从 VNLIFE 的战略验证出发，经过披露与估值约束，推导出当前建议的决策流程。
    approximationNotes: 该流程为定性展示，说明建议如何由证据质量推导而来，而不是来自自研评分模型。
    data:
      nodes:
        - id: n1
          label: 当前公开锚点：2025 年 >US$1B 股权出售讨论
          detail: 信号有用，但还不是已成交的价格发现
        - id: n2
          label: 战略验证真实存在
          detail: 银行分发、收单通道和工作流模块已有规模
        - id: n3
          label: 经济性验证不完整
          detail: 收入、利润率、集中度或资本结构都缺少公开审计口径衔接
        - id: n4
          label: 可比公司区间可用但很宽
          detail: MoMo 位于上沿；Marqeta 式下限仍有参考价值
        - id: n5
          label: 当前建议：观察 / 继续研究
          detail: 尊重资产质量，但证据不完整时不要追价
        - id: n6
          label: 上调路径
          detail: 经审计的经济性、低集中度、强队列、可控合规成本
        - id: n7
          label: 下调路径
          detail: 折价融资、净抽佣率偏薄、集中度或控制失效
