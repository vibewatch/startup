      - number: '1.4'
        title: 规模指标与里程碑
        blocks:
          - type: paragraph
            body: >-
              最高置信度的规模证据来自官方和准官方运营材料，但使用这些数字时必须先校准口径。2025 年 Vietcap 公司资料称 VNLIFE 服务 45+ 家银行、35 million+ 名消费者和 400,000+
              家商户；同一材料又称 VNPAY-QR 已接入 45+ 家发卡银行和 17+ 家发卡电子钱包，可触达 30 million+ 用户和 400,000+ 个受理点。2024 年 Visa 新闻稿称 VNPAY
              服务超过 40 million 客户和 250,000+ 家企业；2026 年 VNPAY 官方页面则提到 350,000+ 个商业伙伴和 600,000
              个受理点。更干净的解读不是把这些数字视为矛盾，而是承认公司在不同渠道使用不同分母：企业、商户、受理点、银行、银行 App 和 QR 用户不能互换。2024 年以来的里程碑也显示战略继续变宽。Visa 和
              VNPAY 在 2024 年推出支持国际卡受理的 SoftPOS；VNPAY、VIB 和 Visa 在 2025 年 5 月推出 SME 数字化套件；VNPAY 在 2025 年 7 月获得两项 ABF
              FinTech Awards 和 Visa Digital Pioneer 认可；到 2026 年，VNPAY 一边在 600,000 个受理点足迹上推广由信用卡出资的 QR 支付，一边与 Sacombank
              推出支付和报税打包方案。主线是：公司正从纯支付轨道转向多产品商业基础设施。
