          - type: paragraph
            body: >-
              公开牵引力证据方向上很强，尽管不能替代已审计财务。官方页面和合作伙伴新闻稿指向 40 多家银行关系、数十万商户或企业，以及一层面向 SME 的增长型软件。Vietcap
              材料给出最有财务含义的细节，显示不同业务线如何定价，以及哪些产品意在交叉销售到其他产品。但同一组来源也暴露了核心限制：公开记录几乎不披露实际 GMV、混合净抽成率、毛利率、CAC、回本期、流失率和
              EBITDA。即便公开页面展示规模，分母也在银行、消费者、客户、商户、企业、受理点和钱包用户之间显著漂移。成本结构只能从产品设计推断。VNPAY
              使用软件、银行分发和低资本开支商户设备，这使模型看起来比贷款机构或硬件制造商更轻；但合规、伙伴集成、销售支持、商户补贴和反欺诈工具显然也不轻。正确解读是：相比纯补贴钱包，VNLIFE
              很可能有更有吸引力的利润率路径，但公开披露不足以证明这条路径当前走到哪里。
