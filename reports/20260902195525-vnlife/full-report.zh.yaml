            body: >-
              即使 VNPAY 不发布完整架构白皮书，公开技术文档也足以从系统层面描述其运营模型。网关文档显示出商户跳转到 VNPAY 的重定向模式，配有签名参数、回跳 URL 和 IPN
              回调；下载页列出多种后端语言的测试用例和代码示例，以及移动 SDK 材料。其他产品页面暗示，在这条核心轨道之上还有额外架构层：面向卖家的 VNPAY Merchant 报表，面向线下受理的 SmartPOS 和
              PhonePOS，面向商户后台的发票和税务引擎，以及面向接入 和法律执行的身份或签名模块。VNPAYCONTRACT 进一步显示，公司可以把产品打包成云端和本地部署两种形态，同时开放 API
              给伙伴集成。换句话说，公开记录支撑一个有多种交付表面的平台架构，但不支撑对微服务布局、数据库拓扑、正常运行时间 SLO 或灾备设计作强判断。这些仍是尽调项。
