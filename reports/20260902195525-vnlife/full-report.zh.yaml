            title: 银行 App 和免费转账让基础钱包经济性商品化
            body: >-
              市场正在从 App 新奇感成熟为基础设施。当即时转账免费、VietQR 无处不在、银行 App
              持续改进时，价值会从基础钱包注册转向合作伙伴分发、商户软件和交叉销售。这种格局有利于基础设施主导型玩家，却让薄弱的纯消费者命题更难成立。
            calloutType: risk
            claimRefs:
