  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 未来融资低于当前报道的独角兽区间
        - 任何新定价轮或大额老股交易明显低于约 US$0.9B
        - 将表明私募市场价格发现与当前公开锚点存在实质分歧。
        - 立即下调评级；重审下行情景和回报底线。
      - - 头部银行集中度被证实偏高
        - 少数伙伴贡献大部分 TPV、收入或商户激活
        - 会削弱多元化逻辑，并抬高重谈风险。
        - 要求按集中度调整投资论证，否则退出。
      - - 合规驱动入驻停滞
        - 税务 / 发票 / 商户队列在推广后激活或留存失败
        - 会削弱工作流附着货币化叙事。
        - 下调乐观 / 基准假设，并重定为悲观。
      - - 净抽佣率或利润率结构性偏薄
        - 经审计桥表显示，导流交易量没有转化为有吸引力的经济性
        - 表明有规模，但货币化质量不足。
        - 避免支付高于低端区间的价格；考虑放弃。
      - - 出现重大安全或控制失效
        - 事件或审计发现削弱对支付或身份运营的信任
        - 会同时损害增长和退出可选性。
        - 暂停尽调或终止流程。
    notes: 这些触发项面向投委会监控，应在尽调中验证，而不是等资本投入后再验证。
    claimRefs:
      - CV026
      - CV031
      - CV032
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计财务桥表
        - 主要产品线净收入、毛利率、EBITDA 和现金流
        - 没有这些，估值更多锚定传闻和可比对象，而不是经济性。
        - 财务尽调：索取最新经审计报表和董事会材料包。
      - - 伙伴集中度
        - 按头部银行和头部商户拆分的收入、TPV 和激活结构
        - 广度可能掩盖对少数对手方的依赖。
        - 商业尽调：索取渠道集中度表。
      - - 队列质量
        - 按税务 / 发票 / 受理队列拆分的活跃商户留存、再激活和附着率
        - 需要把真实经常性价值和推广宣传区分开。
        - 增长尽调：索取队列看板。
      - - 股权结构
        - 当前股权结构表、投资人权利、优先股堆叠和任何债务
        - 表面估值未必映射到普通股回报。
        - 法务 / 财务尽调：审查融资文件。
      - - 监管经济性
        - 新电子钱包和记录保存规则带来的增量成本及转化影响
        - 能建立护城河的监管仍可能压缩利润率。
        - 合规尽调：审查内部影响评估。
      - - 退出准备度
        - 关于战略流程、老股兴趣或上市准备的董事会材料
        - 不能把可选性按确定性定价。
        - 董事会 / 公司发展尽调：要求提供流程历史和退出工作流。
    notes: 这些是把观察资产上调为激进定价投资推荐前，必须完成的最低尽调要求。
    claimRefs:
      - CV004
      - CV005
      - CV029
      - CV030
      - CV031
      - CV034
      - CV035
      - CV039
