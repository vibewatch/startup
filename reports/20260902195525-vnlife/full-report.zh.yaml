  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与工作流覆盖
        blocks:
          - type: paragraph
            body: >-
              VNPAY 的公开表面显示，它已经从支付平台扩展成更宽的企业运营堆栈。主页和相关产品页面列出消费者实用服务、嵌入银行的服务、商户受理工具、电商支付网关产品、PhonePOS 和 SmartPOS 受理、QR
              轨道、发票软件、B2B 支付、eKYC 和电子合同产品。重要分析点在于，这些不是彼此割裂的营销页面。它们对应同一交易工作流里的相邻步骤：身份验证、结账
              或店内受理、商户报表、发票开具、合同执行、税务传输和合作银行分发。这影响尽调判断，因为 VNLIFE 的技术价值似乎不主要来自一个标志性 App
              功能，而是来自把多个受监管和运营表面缝在一起的能力。因此，产品战略是集成优先、深入工作流，而不是纯粹争夺消费者注意力。
