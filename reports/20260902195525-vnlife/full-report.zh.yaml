      - - 接受门店混合支付
        - 商户在销售点处理银行卡、QR 和钱包
        - SmartPOS / VNPAY-POS
        - 把多种方式收在一台设备上，并可打印 / 扫码 / 报表
        - 未公开设备可用率或工单统计
      - - 无需专用 POS 硬件即可收银行卡
        - 小卖家需要用手机灵活收款
        - PhonePOS / SoftPOS
        - 流动卖家资本开支更低、部署更快
        - Android / NFC 依赖和设备兼容细节未完全公开
      - - 远程完成客户入驻
        - 银行或金融科技公司远程核验身份
        - eKYC
        - 减少网点依赖和人工开户负担
        - 未公开逐银行转化率或欺诈基准
      - - 开票并保持税务合规
        - 商户必须记录销售、开具发票并传输数据
        - VNPAY Invoice + 税务套件
        - 打通销售记录、开票和税务流程
        - 未公开附加率、错误率或采用队列
      - - 远程签署合同
        - 企业或合作伙伴需要合规签署文件
        - VNeDOC / VNPAYCONTRACT
        - 支持远程签署、时间戳和直接验证路径
        - 未公开与 DocuSign 级 UX 或吞吐量的对标
      - - 将生态服务嵌入银行 App
        - 银行想增加消费者功能，但不想全部自建
        - VNPAY 生态 + API
        - 借合作伙伴集成扩展银行 App 价值主张
        - 公开架构细节停留在系统级描述
    notes: 来源把收益描述为运营、安全或工作流改善；大多数收益缺少 公开来源的独立量化。
