      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              市场的正面逻辑很直接：账户拥有率上升、互联网和智能手机渗透增长、QR 标准化、商户受理扩大、政府支持金融普惠，以及跨境连接，都会扩大可触达支付基础。NAPAS 247 和 VietQR
              提供全国实时支付轨道，降低零售和企业支付摩擦；政策重心也从简单认可数字支付，转向在规模化阶段治理数字支付。但同样的成熟度在扩大可服务交易量的同时，也压缩基础钱包经济性。银行 App
              比五年前好用，转账往往免费，QR 受理正在变成公用事业。由此抬高了商户服务、合作伙伴分发和软件变现的溢价。风控是另一项主要约束。Circular 41 从 2025 年末到 2026
              年收紧开户、实名生物识别、交易限额和信息共享义务。Vietnam News 报道称，2025 年用户因网络诈骗损失约 VND8
              trillion，说明欺诈已经是市场级信任问题，而不是小众运营问题。外汇和跨境监管也是额外约束：外国运营方通常需要本地持牌伙伴，越南的外汇管制制度也限制了轻松走离岸捷径。简言之，交易量增长仍然有吸引力，但持久经济性要靠合规能力和增值变现，而不是只靠闭环钱包规模。
