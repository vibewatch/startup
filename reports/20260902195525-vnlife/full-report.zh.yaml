      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              越南数字支付需求并不来自一类同质化的「钱包用户」。城市消费者用支付来解决便利性、缴费、出行、餐饮和电商。商户采用 QR 和网关工具，是为了降低结账
              摩擦、对账并在不购买昂贵硬件的情况下扩大受理。金融机构和公共部门实体是上游付款方，因为它们为基础设施、合规和分发层买单，让零售用户能够交易。SME 用户对 VNLIFE
              尤其重要，因为公开证据越来越显示，下一层增长正从拉新消费者钱包转向企业工具、开票、电子合同、收款和营运资本赋能。地理也重要：Hanoi 和 Ho Chi Minh City
              主导钱包和支付服务商收入，但农村普惠和新兴省会城市仍是有意义的扩张口袋。消费者行为解释了为什么成熟市场仍然竞争激烈。用户大量多栖在多个超级 App 之间，追逐补贴，并越来越把银行 App
              当作默认金融前端。因此，真正的预算所有者往往不是直接付费的终端用户，而是能把支付接到更大工作流里的商户、合作银行或生态运营方。VNLIFE 因此受益：即使没有单个消费者 App 垄断日常参与，银行分发的 QR
              和商户软件仍然能赢。
