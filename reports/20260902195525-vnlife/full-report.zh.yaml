      - number: '7.4'
        title: 财务模型与执行风险
        blocks:
          - type: paragraph
            body: >-
              财务风险图景主要由披露稀缺和执行复杂性主导，而不是已确认的偿付能力危机。公开证据支持多元变现和有意义的历史融资，但没有给出当前现金、烧钱速度、现金跑道、伙伴集中度或产品线盈利能力。与此同时，VNPAY
              正在同时做几件事：守住核心支付、放大 PhonePOS、挂接发票和税务模块、加深银行分发，并把合规驱动的获客转化为持久复用。跨产品议程长期可能拼出更强平台，但也会提高销售、实施、合规和工程之间的协调与支持负担。到
              2028 年的补贴项目可能帮助培育采用，但也留下未来测试：促销条件变化后，这些队列是否仍有吸引力。这样看，最大财务风险不只是 QR
              或转账上的价格竞争，而是复杂的多产品增长故事在公开材料中看上去更宽，实际单位经济性却未必撑得住。
