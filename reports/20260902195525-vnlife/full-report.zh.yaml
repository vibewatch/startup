      - number: '2.5'
        title: 规模测算与解读缺口
        blocks:
          - type: paragraph
            body: >-
              越南支付市场的核心分析风险是假精确。不同发布方使用相似标签——支付市场、移动支付、电子钱包市场、金融科技市场——却衡量完全不同的东西，比如总支付流水、服务商收入、App
              渗透率或广义行业价值。基于问卷的钱包份额会相互重叠，因为很多用户同时保持多个 App
              活跃。商户足迹数据可以指企业、合作伙伴、商户或受理点，它们都不能互换。即便账户拥有率和数字交易占比这类系统指标看起来很强，也只能支撑方向判断，不足以承销单家公司的经济性。对 VNLIFE 来说，缺失的桥包括
              VNPay GMV、抽成率、商户分层、跨境支付结构、软件收入绑定和银行伙伴集中度。没有这些，公开 TAM
              数据可以支撑市场吸引力，却支撑不了精确承销模型。正确尽调姿态是：用公开市场证据确认顺风和约束，把相互冲突的规模口径摊开保留，然后要求管理层提供 KPI 字典和收入桥，再从市场分析走向估值结论。
            claimRefs:
              - CM026
              - CM027
              - CM039
              - CM040
      - number: '2.6'
        title: 图表要点
        blocks:
          - type: callout
            title: TAM 很大，但可变现层小得多
            body: 越南支付 TAM 显然很大并且在增长，但本报告审阅的来源衡量范围从总支付流水、服务商收入到全金融科技行业价值不等。VNLIFE 的可变现机会在更窄的编排和商户软件层，而不是越南经济中每一美元数字化流转金额。
