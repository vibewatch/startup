        - 增长看起来很广，收入却可能仍集中在伙伴侧
        - 索取银行级客户激活和收入结构
      - - 银行主导向中小企业分销
        - 依赖伙伴优先级和 App 货架位
        - 伙伴降优先级会拖慢开通或挂载
        - 审查银行合同、排他性和终止条款
      - - 从支付交叉销售到发票 / 合同 / 税务
        - 实际挂载率可能低于营销口径
        - 会削弱 LTV 扩张逻辑
        - 按队列索取挂载率和交叉销售转化
      - - PhonePOS 低资本开支获客
