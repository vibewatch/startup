  - id: FV002
    type: bar
    title: 估值敏感性
    layout: wide
    summary: 示意性方向变化，展示哪些尽调结果最可能撬动 VNLIFE 的估值区间。
    approximationNotes: 数值以百万美元计，表示相对基准情景中点的方向性变化，不是预测科目或经审计的敏感性。
    data:
      items:
        - label: 多元化合作伙伴经济性得到确认
          value: 180
          detail: 如果没有单一银行或渠道主导价值创造，信心会上升
        - label: 工作流加挂变现验证强劲
          value: 140
          detail: 税务、发票、合同和 SME 模块提升抽佣质量
        - label: 资本结构确认干净
          value: 90
          detail: 优先权压力更轻，更多企业价值能归属普通股
        - label: 监管成本更高 / 转化更低
          value: -140
          detail: 规则可能强化护城河，但仍会压缩增长和利润率
        - label: 发现银行集中度高
          value: -170
          detail: 分发权力可能反转为重谈风险
        - label: 净抽佣率偏薄或留存偏弱
          value: -220
          detail: 只有规模、缺少变现质量，就应该给更低倍数
