        - 可能形成设备利用率低、付费弱的队列
        - 索取月度交易商户数和设备活跃度
      - - 通过银行 App 和受理点触达消费者
        - 品类层面的多平台并用会削弱直接忠诚度推断
        - 可能限制定价权，也压低消费者留存的可预测性
        - 把商户黏性和消费者 App 偏好拆开
    notes: 扩张可信，但渠道结构可能掩盖有意义的集中度。
