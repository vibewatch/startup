      - 类别
      - 规模 / 融资
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - MoMo
        - 直接同业 / 消费者超级 App
        - 30M+ 用户；50,000 家企业；70+ 家银行和金融机构；300,000 个受理点
        - 大众消费者、商户、服务不足金融用户
        - AI 辅助金融 App，具备广泛消费频次和伙伴网络
        - 促销敏感性和银行 App 替代仍然重要
      - - ZaloPay
        - 直接同业 / 社交支付竞争者
        - 2025 年收入 VND1.11T；TPV +76%；活跃用户 +40%；背靠 VNG / Zalo 生态
        - 已在 Zalo 内的消费者、商户、社交电商用户
        - 聊天内支付、免费转账、Zalo 分发、可见安全信号
        - 金融科技板块仍亏损，忠诚度弱于 MoMo
      - - VNPAY / VNLIFE
        - 直接同业 / 基础设施主导竞争者
        - 2019 年 US$300M，2021 年又 >US$250M；称有 350,000+ 企业合作伙伴；30+ 银行 App 和 15 个钱包接入 VNPAY-QR
        - 银行、商户、公共服务流程、QR 消费者
        - 银行内嵌 QR、网关、POS、PhonePOS、发票、B2B、商户栈
        - 消费者习惯闭环领先证据少于钱包优先同业
      - - Viettel Money
        - 直接同业 / 电信金融生态
        - 持牌中介支付服务商；本次抓取的官网首页未量化规模
        - 电信用户、支付、账单、广泛消费者服务
        - 电信背书生态和持牌支付栈
        - 本次审阅的公开网页证据给出的规模披露弱于 MoMo 或 ZaloPay
      - - ShopeePay
        - 相邻钱包 / 电商专家
        - 与 Shopee 生态挂钩；本次抓取的官网首页未量化消费者规模
        - Shopee 购物者、QR 用户、BNPL 用户
        - 电商嵌入、QR 互通、SPayLater / 优惠券驱动行为
        - 在 Shopee 和合作消费场景中更强，作为通用金融入口较弱
      - - 银行 App / VietQR 集群
        - 既有替代方
        - 2024 年 Q4 银行自有 App 的数字金融渗透率 34%，首选使用偏好 26%
        - 工资账户用户、存款、日常金融、中小企业
        - 主账户关系、信任、存款、贷款、免费转账惯例
        - 促销力度较弱，但经济地位很强
      - - Apple Pay
        - 相邻替代 / 卡片叠加层
        - 2025 年 4 月通过 NAPAS 在越南上线；多家主要银行和商户支持
        - 持合格卡片的 iPhone 用户
        - Apple 不向消费者收费、广泛非接触受理、沿用既有卡凭证
        - 产品范围薄，弱于完整钱包或基础设施平台
    notes: 各行比较的是战略角色，而不是单一可比口径。公开规模指标混合了用户、收入、受理点、企业数量和融资历史。
