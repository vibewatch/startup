            body: >-
              VNLIFE 的竞争位置可防守，但防守理由和消费者超级 App 投资者最初想象的不一样。MoMo 在品牌参与度和宽度上仍显得最强；ZaloPay 拥有最干净的社交分发楔子；银行握有资产负债表和信任优势；Apple
              Pay 减少了非接触式卡支付场景里新增钱包采用的必要性。不过，同一组公开证据也说明，即便钱包偏好迁移，VNPAY 仍可保持相关性。促销降温或某个 App
              参与度下滑时，商户和银行基础设施不会随之消失。话虽如此，护城河并非无懈可击。QR 标准化让受理层商品化，公开网页看不到商户定价透明度，银行 App
              也在吸收更多曾经迫使用户进入独立钱包的支付行为。反向证据已经强到足以改变尽调姿态：应把 VNLIFE
              承销为一家基础设施主导的竞争者，其上行取决于商户软件、伙伴留存和工作流宽度，而不是假设钱包排名就能预测未来经济性。
