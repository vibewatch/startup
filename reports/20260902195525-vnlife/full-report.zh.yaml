    summary: 基于当前公开估值锚点，为 IC 准备的 VNLIFE 评分卡。
    approximationNotes: 分数是 0-10 的定性承销舒适度指标，不是回测模型输出。
    data:
      items:
        - label: 当前估值锚点
          value: '>US$1B'
          detail: 足够新，值得重视；但仍是讨论口径，不是已成交价格
          score: 6
        - label: 战略规模验证
          value: High
          detail: 银行与商户覆盖面广，分发相关性真实
          score: 8
        - label: 财务披露质量
          value: Weak
          detail: 收入、利润率或现金生成缺少公开审计口径衔接
          score: 3
        - label: 可比公司支撑
          value: Usable but uneven
          detail: MoMo、Adyen、Sea 和 Marqeta 提供的是区间，不是可直接套用的倍数
          score: 6
        - label: 监管韧性
          value: Mixed
          detail: 规则收紧可能帮助护城河，但也会抬高成本和摩擦
          score: 5
        - label: 基准情景安全边际
          value: Limited
          detail: 公开证据不支持在低位独角兽估值水平以上激进定价
          score: 4
        - label: 尽调紧迫性
          value: High
