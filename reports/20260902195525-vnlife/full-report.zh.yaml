      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              对一家越南私营金融科技公司来说，资本历史图谱罕见地清晰，尽管持续现金披露并不清晰。PayPal 2021 年新闻稿、GPCA 报道和数据库资料都支撑 2019 年和 2021 年两轮合计约 US$550
              million 的已披露融资。2025 年后续报道称 GIC 和 SoftBank 探索按超过 US$1 billion 估值出售股权，这也重要，但原因不同：它是现有持有人的流动性信号，不是 VNLIFE
              获得新一级资本的证据。这个区分对资本充足性很关键。从公开记录看，VNLIFE
              不像明显缺钱，更像披露不足。其产品架构偏软件和分发，而不是重资产负债表；合作伙伴材料也显示，涉及信贷产品时银行承担融资层。相对贷款机构或硬件车队运营方，这应能降低资本强度。但最关键的未知项仍是传统问题：当前现金余额、月度烧钱额、盈利状态和资金续航。没有这些，历史融资披露能支撑韧性，却不能确认当前财务健康。
