        title: 按买方、用户和付款方拆分客户基础
        blocks:
          - type: paragraph
            body: >-
              VNPAY 的客户基础更像一个经由渠道分发的生态，而不是一池同质客户。银行和金融机构既是渠道伙伴，也是软件或基础设施模块的采购方。商户、SME
              和个体经营户直接使用收单、开票和税务工具。消费者是实际交易终端用户，但他们通常从银行 App、QR 收单点或商户结账入口进入体系，而不是靠单一 VNPAY
              消费习惯进入。这个差别很关键：消费者端触达广，不等于能看清谁在向 VNPAY 付费，收入有多黏。公开证据显示，高价值客户关系集中在 VNPAY
              能把分发、支付受理和合规工具拼在一起的地方。因此，公司触点拆得很细：买方可能是银行采购团队，用户可能是商户收银员，经济受益人可能是想在新税规下规范申报的 SME
              业主。复杂性本身是优势，因为它打开了多个入口；但它也让简单用户数解读变得更难。
