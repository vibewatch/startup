  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 VNLIFE 实际销售的东西
        blocks:
          - type: paragraph
            body: >-
              分析 VNLIFE，应把它放在越南数字支付和商业赋能堆栈里，而不是所有贴着「金融科技」或「数字经济」标签的数字里。纳入边界的支出，是可以通过嵌入银行的 App、QR
              受理、支付网关、POS/PhonePOS、账单支付、公共服务收款、商户软件或相邻企业金融工具来发起、路由、受理或变现的资金流转和结账 行为。这个边界抓住了 VNPay
              产品能直接赚取经济收益或制造粘性分发的市场部分。排除项同样重要：永远不数字化的现金、停留在银行体系内的纯存款余额、没有 VNPay 参与的借贷收入，以及或许与越南经济有关、但与公司支付业务无关的广义软件或 AI
              支出。现状替代品很强。消费者和商户可以用银行 App 转账、VietQR、银行卡、现金或其他钱包完成支付，并不关心底层编排层由谁提供。因此 VNLIFE
              的价值更像嵌入银行和商户的基础设施玩家，而不是纯独立钱包。VietQR 和 NAPAS
              已把受理层拉平到足够标准化；差异化问题不再是「客户能不能数字化付款」，而是「哪一个平台最能把分发、商户工具，以及相邻金融或运营工作流打包起来」。
