            body: >-
              公开定价透明度有限，但已审阅来源仍有信息量。较早的 VNPAY-POS 材料给出明确的机器租赁示例、按门槛减免费用和免费使用的交易量目标；较新的 PhonePOS
              材料称开通免费，商户成本主要是一项折扣后的单笔交易费。报税和商户软件套件更进一步，为符合条件的个体经营户提供最高三年、到 2028 年底的免费使用期。合在一起看，VNPAY
              并不总是在销售点追求短期软件收入最大化。相反，它似乎愿意补贴接入，再通过交易费、软件绑定、银行分发和更长寿命的商户关系回收价值。GTM 动作同样清晰。Visa、VIB 和 Sacombank
              的合作材料显示，VNPAY 通过整合包向 SME 和个体经营户销售，整合包把支付受理、发票、合同、银行连接和税务工作流放在一起。即便基础支付费受免费转账常态和互联互通 QR
