            body: >-
              Circular 41
              和相关生物识别规则应能改善安全性和用户保护，但也带来摩擦、存储义务、交易限额逻辑和合规成本。在一个已经承受欺诈压力的市场里，运营方需要规模，也需要有纪律的风控系统，才能把收入增长转成持久经济性。
