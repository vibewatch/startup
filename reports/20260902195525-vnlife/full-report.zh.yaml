    rows:
      - - 商户网站 / App
        - 收集订单上下文并发起支付
        - 商户集成质量、HTTPS、参数处理
        - 集成错误或密钥处理薄弱会打断支付流程
      - - 重定向支付 URL
        - 携签名参数把客户转到 VNPAY
        - 正确的 TmnCode、vnp_HashSecret、回调配置
        - 签名或回调配置错误会导致流程失败或失去信任
      - - VNPAY 网关核心
        - 处理支付请求，并编排银行 / 支付轨道交互
        - VNPAY 核心可用性和合作伙伴连接
        - 宕机或路由降级会直接冲击商户收入
      - - 银行 / 钱包 / 卡组织轨道
        - 提供付款资金来源和认证
        - 发卡方、收单方、银行 App、钱包、卡组织
        - 合作伙伴依赖和多轨道复杂度
      - - 返回 URL
        - 将前端支付结果返回给商户体验
        - 商户前端处理
        - 如果当作最终清算来源，可能误导用户
      - - IPN 回调
        - 向商户后端提供服务端交易结果
        - 商户后端可用性和幂等处理
        - 回调丢失或延迟会造成对账错误
      - - 商户运营层
        - 报表、现金流和交易管理界面
        - VNPAY Merchant App / 门户
        - 权限、审计轨迹和可用率公开透明度有限
      - - 发票 / 税务层
        - 生成发票并传输税务数据
        - 本地税务规则和商户系统集成
        - 监管变化或集成脆弱性
      - - 身份 / 签署层
        - eKYC、数字签名、时间戳、合同完整性
        - 设备质量、生物识别控制、法律登记系统
        - 欺诈、误拒或文件完整性争议
    notes: 本表仅覆盖系统层；VNPAY 未发布逐组件内部技术栈图谱。
