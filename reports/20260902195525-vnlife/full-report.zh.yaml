  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时点
      - 影响
      - 尽调问题
    rows:
      - - 账户持有率和数字支付使用率提高
        - 正向
        - 当前至长期
        - 银行内嵌和钱包绑定支付可触达的付款人基数更大
        - 索取 SBV / NAPAS 官方序列，验证账户向使用的持续转化
      - - VietQR 与 NAPAS 247 互联互通
        - 正向
        - 当前
        - 降低受理摩擦，支撑商户扩张
        - 衡量 VNPay 交易量中有多少走互通 QR、多少走自有流程
      - - 电商和超级 App 行为
        - 正向
        - 当前至中期
        - 维持高交易频次和广泛商户场景
        - 按电商、旅行、零售和账单拆分 VNPAY 敞口
      - - Circular 41 和更严格的入网规则
        - 双向
        - 当前
        - 抬升信任和正规化，也增加合规成本和入网摩擦
        - 询问管理层 2025 年末以来的转化流失和合规开支
      - - 欺诈和诈骗压力
        - 负向
        - 当前
        - 可能压低信任、增加风控开支，并改变用户行为
        - 索取欺诈损失率、提醒有效性、拒付 / 争议指标
      - - 银行 App 替代和免费转账
        - 负向
        - 当前
        - 挤压消费者钱包差异化和基础支付变现
        - 评估 VNPay 收入有多少依赖商户增值服务和软件层
      - - 中小企业信贷和 B2B 基础设施需求
        - 正向
        - 中期
        - 在消费者结账之外打开更高利润率的扩张路径
        - 索取软件附加率、发票量和 B2B 支付指标
      - - 外汇管制和本地合作伙伴要求
        - 负向
        - 当前至长期
        - 抬高跨境变现和外资进入的复杂度
        - 梳理对合作银行的依赖和跨境结算经济性
    notes: 最关键的结论是，仅靠交易量增长还不够；持久价值取决于合规质量、合作伙伴分发和软件变现。
