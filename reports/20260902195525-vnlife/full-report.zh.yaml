      - number: '8.5'
        title: 尽调要求、投资逻辑破裂触发条件与入场纪律
        blocks:
          - type: paragraph
            body: >-
              从“有意思”走到“按某个价格可投”，路径很直接，哪怕仍未走完。投资人需要干净财务桥、集中度可见性、股权结构清晰度，以及量化证据来证明监管变化可以吸收，而不是摧毁利润率。如果管理层能展示多元伙伴经济性、健康活跃队列、有韧性的抽成率和有限优先权悬挂，VNLIFE
              的估值走廊可以上移，建议也可以改善。反之，如果尽调显示公司依赖少数银行、需求由补贴塑形、净经济性偏薄，或需要以更弱条款融资，下行情景会迅速加强。这就是为什么入场纪律比讲故事更重要。公司已经值得持续跟踪，但还不值得盲目接受价格。明确的投资逻辑破裂触发条件——折价融资、渠道集中、合规拖累或控制失效——应当作为准入门槛，而不是交割后的清理工作。
