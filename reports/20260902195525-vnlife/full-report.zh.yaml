      - number: '8.3'
        title: 可比公司组合与市场定位
        blocks:
          - type: paragraph
            body: >-
              看 VNLIFE，可比对象最好用区间，而不是单一完美同业。MoMo 是最接近的私有市场基准，因为它同样处在越南数字支付经济中，也在同一个 2026 年融资环境里被投资人评估。但即便 MoMo 也不能 1:1
              套用，因为围绕 MoMo 的公开报道更明确提到盈利能力、用户规模和投资人流程。Adyen 和 Sea 是有用的天花板式公开参照：两者都展示了规模化、可信支付或区域数字金融平台可以值多少钱，但两者都远大于
              VNLIFE，也透明得多。Marqeta 则提醒我们，当增长或变现信心被压缩时，公开支付基础设施公司仍可能聚集在低独角兽估值附近。可比组合给出的核心结论是：VNLIFE
              属于真实金融科技估值走廊，但不能默认站在走廊顶部。市场奖励的是证明质量和披露，而不只是赛道或地理敞口。
