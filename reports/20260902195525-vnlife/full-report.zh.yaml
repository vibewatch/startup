      - number: '7.2'
        title: 运营、安全与欺诈风险
        blocks:
          - type: paragraph
            body: >-
              运营上，VNPAY 受益于可见的控制投入，但仍背负显著运行风险。公司围绕 PCI DSS、MPoC、CPoC、EMV 和 eKYC
              标准的公开认证是真正正面信号，说明它在堆栈多层做了有纪律的安全和合规工作。但这些认证也提醒我们，系统运行在高风险环境里，失败会带来真实成本。公开材料没有提供正常运行时间历史、事故报告、拒付率、欺诈损失数据或详细复盘。支付网关文档也清楚显示，商户集成依赖签名参数、回调和对账步骤，规模化后会产生实施风险。与此同时，越南更广泛的数字金融市场正在承受更高欺诈压力和更复杂攻击向量。随着
              VNPAY 扩展 PhonePOS、SmartPOS、生物识别和商户软件，攻击面会沿设备、网络和身份校验一起扩大。因此，认证不能证明运营风险不存在；认证只是部分缓解风险，而日常表现披露仍然不足。
