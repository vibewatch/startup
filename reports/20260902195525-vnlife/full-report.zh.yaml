      - number: '7.3'
        title: 伙伴、渠道与客户依赖风险
        blocks:
          - type: paragraph
            body: >-
              伙伴模式既是 VNPAY 最大优势之一，也是最清晰的风险之一。公司规模深度绑定银行分发、伙伴 App
              入口、商户收单关系，以及与外部机构一起推进的税务正规化活动。这套结构降低获客成本，也提高本地防御性；但它也意味着商业权力可能部分落在 VNPAY 直接控制之外。如果少数大型银行弱化某个产品、调整 App
              展示位、在经济条款上压价，或偏向其他支付伙伴，影响会很快传导到新客户增长或路由交易量。竞争证据已经显示，相比独立电子钱包，银行自有 App
              更受关注，而客户广度数字没有揭示背后的集中度。税务牵引的个体经营户项目又增加一层变量：它们提供了及时的获客切口，但部分取决于监管执行的速度和严肃程度。结论是，VNPAY
              的渠道模式结构上很强；但投资人应把银行集中度和政策驱动需求视为一阶风险，而不是背景噪声。
