      - number: '5.4'
        title: 信任、安全、风控与合规控制
        blocks:
          - type: paragraph
            body: >-
              信任是 VNPAY 公开证据最强的部分。官方和独立来源共同支撑一条序列：从 2022 年 SoftPOS 安全与 EMV 工作，到 2023 年电子合同认证，再到 2025 年 PhonePOS MPoC，以及
              2025 年覆盖六项服务的 PCI DSS 4.0.1 Level 1。eKYC 页面又补充了不轻的身份能力证据，包括 ISO/IEC 30107-3、ISO/IEC 19795-2、ISO 27001
              和政府云标准引用。这些信号有意义，因为它们覆盖堆栈的不同部分：银行卡受理、设备安全、云和网关控制、身份验证，以及法律文件完整性。它们也解释了 VNPAY
              为什么能有说服力地卖给银行和受监管商户。关键限制在于，认证证据不等于可靠性证据。公开记录仍缺少事件透明度、公开审计摘要、限流细节、漏洞赏金计划姿态，以及正常运行时间或失败交易比例等运营指标。因此，正确结论不是风险不存在，而是合规成熟度可见，运行时透明度不可见。
