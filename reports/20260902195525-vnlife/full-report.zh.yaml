  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：直接同业、既有玩家、相邻玩家、替代品与现状
        blocks:
          - type: paragraph
            body: >-
              VNLIFE 的战场比独立电子钱包排行榜更宽。直接品牌同业是 MoMo、ZaloPay、Viettel Money 和 ShopeePay，但结构性最强的替代品是银行自有移动 App、Apple Pay
              这类卡钱包，以及越来越可信的现状方案：用工资账户银行 App 加 VietQR 完成支付。这里需要承接第 2 章的市场判断：一旦 QR
              受理和即时转账轨道标准化，买方不必选择一个封闭支付生态来完成支付任务。用户和商户可以在银行 App、钱包和卡叠加层之间切换，同时保持相近的结账 行为。因此 VNLIFE 看起来不同于 MoMo 或
              ZaloPay。VNPAY 的护城河核心不是形成消费习惯循环的钱包，而是嵌入银行和商户的编排层。竞争问题也不只是「谁拿到最多 App 打开次数」，而是谁控制分发、信任，以及支付受理背后的更高价值工作流。
