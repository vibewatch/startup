        title: 既有玩家与相邻替代：银行 App、Apple Pay 与定价姿态
        blocks:
          - type: paragraph
            body: >-
              最危险的竞争者不一定是声量最大的金融科技品牌。银行 App 正持续补齐功能缺口，并已经提供许多消费者需要的核心行为：转账、QR 支付、银行卡管理、储蓄，以及在单一受监管界面里的高信任账户访问。Fintech
              Singapore 对 Decision Lab 的报道正好说明这一点：2024 年 Q4，银行自有 App 已经是第三常用的数字金融平台，且偏好得分上升，独立金融科技 App 则下滑。Apple Pay
              是更薄、但仍有意义的替代品。NAPAS 和合作银行在 2025 年 4 月接入 Apple Pay 后，iPhone 用户不用再建立另一个完整钱包关系，也能完成许多线下店内和 App
              内支付任务。公开定价姿态进一步拉开对比。ZaloPay 公开营销免费转账和支付交易，Apple 称 Apple Pay
              不向消费者收费，银行转账在用户感知中也越来越像公用事业。相较之下，在已审阅公开页面里，VNPAY
              和多数钱包竞争者的商户侧定价、网关经济性和伙伴收入分成大多不透明。不透明不会让竞争停止，但足以说明公开消费者价格已经不太能区分这个品类。
