        - 20%
        - 伙伴经济性足够分散；工作流附着显著抬高货币化；监管被吸收，且不损害转化。
        - 投资人愿意高于当前报道中的独角兽门槛出价，因为业务更像带软件属性的广义支付平台，而不是商品化导流。
        - US$1.2-1.5B
      - - 基准
        - 50%
        - 规模真实，但披露仍不完整，经济性被证明稳健而非出众。
        - 2025 年老股信号仍大致合理，但拿不到溢价。
        - US$0.9-1.15B
      - - 悲观
        - 30%
        - 少数银行贡献不成比例的价值；规则收紧后入驻或留存走弱；净抽佣率显得偏薄。
        - 公司仍有真实资产，但公开市场买家或私募投资人会要求更大的不透明折价。
        - US$0.6-0.85B
      - - 概率加权判断
        - 100%
        - 规模和不透明度叠加，形成真实的中间走廊，同时保留有意义的下行风险。
        - 基于上述情景加权得到的中枢区间。
        - US$0.9-1.1B
    notes: 这些是明确的假设区间，不是预测。公开证据还不足以支撑精细 DCF，也不足以干净搭出 EV / 收入桥。
