  - id: TP004
    title: 分发与切换成本对比
    columns:
      - 竞争者 / 类别
      - 分发底座
      - 用户为何进入
      - 用户为何留下
      - 切换摩擦
      - 限制因素
    rows:
      - - MoMo
        - 独立超级 App，接入大型合作伙伴网络
        - 补贴、便利性，以及广泛的缴费和金融服务场景
        - 高频、习惯，再向金融交叉销售
        - 有一定习惯和伙伴锁定，但用户仍高度多栖
        - 忠诚度容易受促销疲劳和银行 App 替代冲击
      - - ZaloPay
        - Zalo 聊天 App 和商户网络
        - 聊天内便利与免费转账
        - 支付嵌在聊天里，再叠加 Zalo 触达
        - 低至中；分发强，但支付行为可迁移
        - 需要把社交流量转成持久经济性
      - - VNPAY / VNLIFE
        - 银行 App、商户受理、网关关系
        - 用户接触 VNPAY，更多来自银行或商户流程，而不只是主动选择 App
        - 嵌入式支付轨道与商户流程延续性
        - 合作伙伴侧中等；对消费者 App 偏好的依赖更低
        - 合作伙伴集中度和商户合同可见性仍是未知数
      - - Viettel Money
        - Viettel 用户底座和数字服务生态
        - 既有电信与服务关系
        - 更宽数字服务生态里的便利性
        - 若服务包被广泛使用，切换摩擦中等
        - 公开证据对活跃频次的支撑弱于头部钱包品牌
      - - ShopeePay
        - Shopee 与合作伙伴电商生态
        - 结账便利、优惠券、BNPL
        - 购物和外卖闭环里的重复使用
        - 电商场景外低至中
        - 平台外通用金融粘性看起来更弱
      - - 银行 App / VietQR
        - 主银行账户、薪资关系、存款信任
        - 用户本来就在该银行开户，不需要另一个钱包
        - 账户主关系、QR 普及、综合金融服务
        - 高，薪资、存款和信贷关系会持续
        - 促销不够刺激，但经济性强
      - - Apple Pay
        - Apple 设备上的既有银行卡凭证
        - 无需注册另一个钱包即可快速非接支付
        - 便利性和广泛商户受理
        - 低，因为银行卡可跨商户使用
        - 受支持设备和持卡人限制
    notes: 真正决定切换成本的问题，不是 QR 能不能用，而是用户或商户已经把长期关系放在哪里。
