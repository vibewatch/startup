      - number: '7.5'
        title: 缓释因素、否决标准与剩余风险
        blocks:
          - type: paragraph
            body: >-
              缓释因素足以避免悲观结论。VNPAY 有真实规模、真实银行关系、可见控制投入，并及时切入 SME
              和个体经营户数字化。这些事实降低了业务在浅层意义上脆弱的概率。但缓释不等于通关。剩余风险仍然重要，因为几个核心问题无法仅靠公开证据回答：实时集中度、资金头寸、商户留存、欺诈损失水平、服务可靠性，以及补贴后队列质量。纪律化投资流程因此应设定明确的投资逻辑破裂触发条件。如果新监管显著抬高开户摩擦，如果头部银行伙伴削弱支持，如果税务牵引队列激活停滞，或技术尽调发现运行控制薄弱，判断应迅速下调。反过来，如果管理层能证明多元伙伴经济性、强活跃队列和稳定安全运营，风险评级可以下降。在此之前，VNLIFE
              应被视为一个已有规模、但仍对尽调高度敏感的平台，剩余风险为中高。
