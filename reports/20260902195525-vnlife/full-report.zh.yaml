  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 竞争对手
      - 公开套餐
      - 价格 / 单位 / 合约模式
      - 包含能力
      - 折扣或未知项
      - 含义
    rows:
      - - MoMo
        - 消费金融 App
        - 审阅首页未清楚列出消费者端价格；价值主张由促销驱动
        - 转账、账单、绑定银行流程、AI 定位、安全控制
        - 留存来源未公开商户经济性和实际费用
        - MoMo 更靠参与度和套餐广度竞争，而不是透明标价表
      - - ZaloPay
        - Zalo 内的消费者钱包
        - 官网称转账和支付交易免费，超过月度限额可能收费
        - 聊天内支付、服务缴费、促销、PCI DSS 和 ISO 27001 信号
        - 审阅页面未公开商户定价和月度限额经济性
        - 消费者侧价格容易理解，差异化必须来自分发和体验
      - - VNPAY / VNLIFE
        - 银行科技与商户支付平台
        - 网关和商户定价看似基于合同，审阅的消费者页面未公开
        - 网关、QR、POS、PhonePOS、发票、银行 App 嵌入、B2B
        - 实际 MDR、抽成率和伙伴收入分成未披露
        - 经济性很可能落在商户和伙伴合同里，限制公开对标
      - - Viettel Money
        - 持牌数字金融生态
        - 审阅首页未提取到公开定价细节
        - 转账、账单、数字金融和电信生态服务
        - 留存来源中规模化定价和商户套餐不清楚
        - 竞争价值可能更多来自生态触达，而不是标价
      - - ShopeePay
        - 钱包加电商激励
        - 用户端定价看似由优惠券和生态驱动；未提取到详细费率表
        - QR 支付、缴费、合作伙伴支付、SPayLater、Shopee 电商联动
        - 已审阅公开页面看不清商户和融资经济性
        - 即便独立支付利润率很薄，ShopeePay 也能靠电商促销补贴使用
      - - 银行 App / VietQR
        - 核心银行 App 与账户绑定支付
        - Decision Lab 关联报道和市场指南显示，转账定价对用户往往像免费服务或基础公用服务
        - 转账、QR、账户管理、银行卡、存款、储蓄、信贷
        - 各银行具体费率表不一，本章未逐项列举
        - 支付被打包进更宽的银行经济账，存量银行因此能压低钱包变现空间
      - - Apple Pay
        - 银行卡钱包叠加层
        - Apple 明确表示，用户在门店、线上或 App 内支付不收费
        - 支持银行和商户间的令牌化非接银行卡支付
        - Apple 未披露发卡方或商户经济性
        - Apple 拼的是便利性和凭证复用，而不是独立支付收费模式
    notes: 公开价格卡缺失时，本表保留这种不透明，不按品类惯例推断费率水平。
    enumerationScope:
      coverage: partial
      basis: >-
        The table captures the main public pricing and packaging surfaces visible on retained sources, but private
        merchant contracts, interchange splits, and promotional subsidies are mostly undisclosed.
