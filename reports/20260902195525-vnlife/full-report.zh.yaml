      - number: '8.4'
        title: 乐观、基准与悲观估值区间
        blocks:
          - type: paragraph
            body: >-
              VNLIFE 的情景分析必须明确承认不确定性。公开记录足以排除一个浅层下行情景：这不是一家产品前公司，公司的分发和工作流触达是真实的。但公开记录不足以支持狭窄估值精度。乐观情景假设 VNLIFE
              的支付轨道和工作流模块产生多元、黏性的经济性，从而支撑略高于当前报道独角兽门槛的估值。基准情景假设 2025
              年老股信号方向上公平，但在审计经济性到来之前不应给溢价。悲观情景假设集中度、监管摩擦或低于预期的抽成率把公司拉到心理上的独角兽线以下。因此，概率加权必须偏向中间，同时保留真实下行。这个区间最好作为投委会讨论工具，而不是银行家式公平意见或一手尽调替代品。
