  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              VNLIFE 面临的监管环境正在变得更重规则，而不是更轻。Circular 40/2024/TT-NHNN 为支付中介服务建立了运营框架，随后 2025-2026
              年的修订和解读显示，电子钱包开立、客户认证、记录留存、交易限额和牌照维护要求都在收紧。这对 VNPAY
              有两层影响。第一，更重的监管会抬高准入门槛，帮助已有合规基础设施的规模化在位者。第二，它也提高执行风险，因为公司现在直接进入电子钱包触点、税务、身份、发票和合同等流程；一旦出错，带来的不是单纯 UX
              不便，而是监管暴露。法律态势因此是双刃剑：VNPAY
              看起来比小型挑战者准备更充分，但如果规则收紧、某条产品线需要重新获牌，或客户认证标准再次变化，它失去的也更多。正确框架不是“监管利好”或“监管利空”，而是监管同时放大护城河和运营负担。
            claimRefs:
