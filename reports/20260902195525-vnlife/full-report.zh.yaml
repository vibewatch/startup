      - number: '4.5'
        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              最干净的财务结论是：VNLIFE 有可信的变现设计和强渠道覆盖，但结果披露不足。公开证据足以让人相信，公司不止一条收入线，战术性使用定价和补贴来扩大 SME
              覆盖，也募集了足够资本来建设真实基础设施。但证据不足以承销实际收入质量、利润率耐久性或自我造血增长。实务上，严肃尽调不应把时间花在争论 VNLIFE 是否有商业模式，而应更多要求公司给出严谨 KPI
              字典，以及从支付量到净收入、再到毛利的桥。缺口具体且可执行：合并收入、按产品拆分的 GMV、扣除发卡方分成后的实际 MDR、软件绑定渗透、流失率和队列留存、CAC
              和回本期、毛利率、EBITDA、现金余额，以及按银行和商户分层的渠道集中度。在这些数据出来之前，本章只能支撑偏正面但谨慎的财务立场，而不是完整承销模型。
