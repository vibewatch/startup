      - number: '6.4'
        title: 耐久性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              这是公开客户记录中最弱的一环。公司没有披露 NRR、GRR、流失、合同期限或续约率序列。越南钱包市场的消费者端证据甚至指向相反方向：多栖使用很常见，补贴促销很重要，银行自有 App
              正在抢占心智。这意味着，VNPAY 的持久收入可能不靠独占式消费者习惯，而更靠银行和商户运营流程里的嵌入。2025-2026
              年的银行合作浪潮支持这个判断，因为公司在税务、发票和记账流程中扩张，这些流程比促销驱动的钱包选择更难替换。即便如此，同样的银行依赖也带来集中度风险。如果少数大型银行伙伴贡献了不成比例的流量，VNPAY
              表面的广度就可能掩盖底层集中度。更平衡的结论是：扩张路径可见且可信，但客户耐久性和头部伙伴集中度仍然披露明显不足。
