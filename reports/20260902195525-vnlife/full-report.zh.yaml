  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入架构与变现路径
        blocks:
          - type: paragraph
            body: >-
              公开渠道中，最能解释 VNLIFE 财务模型的证据来自其产品页面和 2025 年 Vietcap 公司资料，而不是已审计公开账目。这些材料显示，公司有几条变现通道：向银行销售全渠道银行软件取得软件费；eKYC
              和生物识别产品产生按账户或按认证计费的经济性；带佣金的分发服务；QR 支付的商户折扣率；银行卡和 App-call-App 结账 的网关式处理经济性；POS 和 PhonePOS
              的租赁或交易挂钩收入；发票和税务软件包；电子签名 SaaS；以及 B2B 支付轨道。这很重要，因为它改变了应如何承销公司。VNLIFE 不只是银行 App 上方的一个 QR
              支付标识，而是一套分层支付和软件平台：有些收入线与交易挂钩，有些像
              SaaS，有些基于收入分成。最强含义偏正面：多元变现架构降低了对单一钱包行为的依赖。主要提醒是，公开来源清楚展示了收费机制和产品逻辑，却远没有同样清楚地披露各收入流的实际贡献。
