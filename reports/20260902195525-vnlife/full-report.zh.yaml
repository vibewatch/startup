              年推出的税务正规化项目、PGBank 从数字银行合作延伸到税务和支付工具，以及 Vietbank、ACB、Co-opBank、SAIGONBANK 面向真实客户群的部署。VNeDOC
              也提供了有用的企业证据，因为它的网站展示了 BSC、FSS、VNSKY
              的客户和伙伴证言，并带有一定结果细节。不能把这些证据夸大成完美留存证明，但它们强过猜测性的试点说法。反复出现的模式是围绕具体用例进入生产部署——商户支付受理、发票开具、电子合同或税务合规——而不是脱离可变现流程的实验。因此，客户证明可信，哪怕多数证据仍来自供应商或合作伙伴页面。
