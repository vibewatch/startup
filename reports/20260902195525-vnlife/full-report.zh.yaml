      - number: '3.4'
        title: 切换成本、多栖与分发权力
        blocks:
          - type: paragraph
            body: >-
              越南支付竞争者面对的不是赢家通吃的用户行为。最强公开证据显示，用户广泛多栖、对促销高度敏感，分发优势来自用户本来花时间的地方，而不是任何独占支付技术。MoMo 在使用频次上看起来仍领先，但这个优势叠加在一个
              90% 用户会为同一服务使用多个超级 App、且超过一半用户会主动套利促销的市场上。因此，ZaloPay 接入聊天、ShopeePay 绑定商业、银行 App 掌握主账户关系，都格外重要。VNPAY
              的位置又不同：只要它嵌在用户已经触达的银行 App、商户软件和受理轨道里，就不必赢下每一次消费者会话。同样的逻辑也解释了 Moca
              的退出为何重要。一个钱包可以有知名品牌和强平台伙伴，但一旦排他性减弱、替代轨道足够好，它仍会失去相关性。在这个市场里，真正的切换成本层不是 QR 扫码本身，而是外围分发基础、商户工作流和金融关系。
