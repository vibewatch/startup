      - number: '3.2'
        title: 直接对手画像：MoMo、ZaloPay、Viettel Money、ShopeePay 与 VNPAY 的重叠
        blocks:
          - type: paragraph
            body: >-
              MoMo 仍是最强的消费者品牌对手，因为它已经从电子钱包重新定位为更广的 AI 辅助金融 App。The Investor 称 MoMo 服务超过 30 million 用户，与 70+
              家银行和金融机构合作，并触达 300,000 个支付受理点；官方主页则强调 AI、生物识别开户和最高级别 PCI DSS 安全。ZaloPay 在公开钱包份额指标上更小，但有独特分发优势，因为它直接嵌入 Zalo
              聊天，宣传免费转账和支付，并在自家网站声称拥有 PCI DSS 与 ISO 27001 认证。2025 年公开报道称，ZaloPay 收入达到 VND1.11 trillion，总支付量增长 76%，活跃用户增长
              40%，尽管 VNG 的金融科技分部仍在亏损。Viettel Money 和 ShopeePay 更窄，但战略上重要：Viettel Money 是带有电信触达能力的持牌中介支付生态，ShopeePay 则把
              QR 支付、账单和先买后付行为放进 Shopee 商业闭环。VNPAY 与所有这些玩家都有重叠，但角度不同。其官网强调银行技术、网关、QR、POS、PhonePOS、发票和 B2B 软件，并声称拥有
              350,000+ 家企业伙伴，VNPAY-QR 进入 30+ 个银行 App 和 15 个钱包。这再次强化第 1 章和第 2 章的结论：VNLIFE
              在支付流里是直接竞争者，但最接近、也最持久的类比是基础设施加分发，而不是纯钱包习惯养成。
