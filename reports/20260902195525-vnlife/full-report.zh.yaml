chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              更准确地看，VNLIFE 是一家支付和数字服务控股公司，旗舰资产是 Vietnam Payment Solution JSC（VNPAY）。从 VNPAY
              官方页面、券商式公司材料到第三方资料，外部叙述都把它描述为一家领先的越南电子支付和银行技术平台，2007 年创立，总部在
              Hanoi。集团并不把自己包装成单一用途的消费者钱包。相反，它把由银行分发的移动银行软件、QR 受理、在线支付网关服务、POS 和 PhonePOS 商户工具、eKYC
              与生物识别、账单支付、旅行、商业、开票、电子签名和企业软件产品打包进一个生态。这个架构很关键：VNPay 的护城河不只是一个独立消费者 App，而是嵌入银行、商户和支付伙伴的分发网络。公司画像证据还显示，它在
              Hanoi、Ho Chi Minh City 和 Da Nang 有较宽的实体布局，说明 VNLIFE 是一家真正运营平台业务的公司，而不是薄薄一层控股壳。到 2025-2026
              年，产品宽度继续外扩；官方页面重点展示 VNPAYB2B、报税套件、电子发票和商户软件，把业务从 QR 受理进一步延伸出去。
