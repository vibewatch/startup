  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: vnpay-som
    missingEvidence: VNPay GMV, take rate, segment revenue split, and contribution margin by QR, gateway, POS, and B2B software product.
    whyItMatters: Without company-specific monetization data, public TAM/SAM evidence can show market attractiveness but cannot quantify VNLIFE’s true SOM or unit economics.
    diligencePath: Request an internal revenue bridge and KPI dictionary from management or investors.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-boundary-mismatch
    missingEvidence: One reconciled taxonomy showing which public sources measure payment flow, provider revenue, wallet penetration, or broader fintech-sector value.
    whyItMatters: Public sizing estimates are directionally useful but can be badly misread when incompatible boundaries are averaged together.
    diligencePath: Build a source-by-source methodology table before using any market number in valuation work.
    relatedQuestionRefs:
    - QM005
    - QM024
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: bank-partner-concentration
    missingEvidence: A concentration breakdown of VNPay volume by partner bank, merchant segment, and public-service vertical.
    whyItMatters: The market chapter shows strong structural tailwinds, but value depends on whether VNLIFE’s exposure is diversified or concentrated in a small set of partners.
    diligencePath: Request top-10 bank and merchant concentration tables and retention metrics.
    relatedQuestionRefs:
    - QM023
  - type: enumeration-incomplete
    severity: minor
    topic: TM003 buyer map coverage
    missingEvidence: A quantified breakdown of segment mix by revenue, transaction volume, and active merchant counts.
    whyItMatters: The buyer map captures the structural roles in the ecosystem, but public-web evidence does not provide a clean quantitative mix by segment.
    diligencePath: Ask management for segment-level revenue or GMV shares across consumers, SMEs, enterprises, and public services.
    relatedQuestionRefs:
    - QM011
    - QM013
    relatedTableRefs:
    - TM003
