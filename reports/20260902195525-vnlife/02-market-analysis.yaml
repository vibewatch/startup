- id: market-gaps
  title: Sizing and Interpretation Gaps
  body: The central analytical risk in Vietnam payments is false precision. Different publishers use similar labels—payments market, mobile payments, e-wallet market, fintech market—while measuring entirely different things such as gross payment flow, provider revenue, app penetration, or broad sector value. Survey-based wallet-share figures overlap because many users keep several apps active at once. Merchant footprint data can mean businesses, partners, merchants, or acceptance points, none of which are interchangeable. Even apparently strong system metrics such as account ownership and digital-transaction share are powerful for direction but insufficient for underwriting one company's economics. For VNLIFE specifically, the missing bridges are VNPay GMV, take rate, merchant segmentation, cross-border payment mix, software revenue attach, and bank-partner concentration. Without those, public TAM data can support market attractiveness but not a precise underwriting model. The right diligence
    posture is therefore to use the public market evidence to establish tailwinds and constraints, preserve contradictory sizing lenses in plain sight, and then ask management for a KPI dictionary and a revenue bridge before moving from market analysis to valuation conclusions.
