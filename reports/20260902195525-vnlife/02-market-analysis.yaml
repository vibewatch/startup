  - - Cross-border and partner-bank flows
    - Inbound tourism, remittance-adjacent acceptance, cross-border QR, partner-bank issuance
    - Unlicensed FX activity or capital-account flows outside local rules
    - Bank, acquirer, or cross-border platform partner
    - Relevant because VNLIFE competes through licensed local rails and partner-bank distribution
