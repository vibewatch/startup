callouts:
- calloutType: insight
  title: The TAM is huge, but the monetizable layer is much smaller
  body: Vietnam’s payments TAM is clearly large and growing, but the sources reviewed here measure everything from total payment flow to provider revenue to all-fintech sector value. VNLIFE’s monetizable opportunity sits in the narrower orchestration and merchant-software layer, not in every dollar that moves digitally through the economy.
  claimRefs:
  - CM006
  - CM007
  - CM009
  - CM039
  - CM040
- calloutType: risk
  title: Bank apps and free transfers commoditize basic wallet economics
  body: The market is maturing into infrastructure rather than app novelty. When instant transfers are free, VietQR is ubiquitous, and bank apps keep improving, value shifts away from basic wallet registration toward partner distribution, merchant software, and cross-sell. That is a favorable setup for infrastructure-led players but a harder one for thin consumer-only propositions.
  claimRefs:
  - CM020
  - CM021
  - CM022
  - CM038
- calloutType: risk
  title: Regulatory trust-building raises the cost of participation
  body: Circular 41 and related biometric rules should improve safety and user protection, but they also add friction, storage obligations, transaction-limit logic, and compliance costs. In a market already facing fraud pressure, operators need both scale and disciplined risk systems to convert top-line growth into durable economics.
  claimRefs:
  - CM014
  - CM015
  - CM016
  - CM033
  - CM034
