  rows:
  - - Consumer payments
    - P2P, bill pay, in-app checkout, QR payments
    - Offline cash that never digitizes
    - Consumer user; bank or wallet funds the transaction
    - Creates daily transaction flow and user touchpoints for bank-embedded VNPay use cases
  - - Merchant acceptance
    - QR checkout, gateway processing, POS / PhonePOS, settlement
    - Standalone card economics or cash-only checkout with no VNPay role
    - Merchant business; end customer triggers payment
    - Directly matches VNPay QR, gateway, POS, and PhonePOS products
  - - Business operations
    - Invoice, digital contracts, tax filing, reconciliation, B2B collections
    - Generic ERP or accounting spend with no payment connection
    - SME or enterprise budget owner
