      - number: '1.4'
        title: Scale Metrics and Milestones
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence scale evidence comes from official and quasi-official operating materials, but
              users should normalize definitions carefully. The 2025 Vietcap profile says VNLIFE serves 45-plus banks,
              35 million-plus consumers, and 400,000-plus merchants, while the same deck says VNPAY-QR is integrated
              into 45-plus issuing banks and 17-plus issuing e-wallets with access to 30 million-plus users and
              400,000-plus acceptance points. A 2024 Visa press release described VNPAY as serving over 40 million
              customers and more than 250,000 enterprises, and official VNPAY pages in 2026 cite 350,000-plus business
              partners and 600,000 acceptance points. Rather than treat those numbers as contradictions, the cleaner
              interpretation is that the company uses different denominators across channels: enterprises, merchants,
              acceptance points, banks, bank apps, and QR users are not interchangeable. Milestones since 2024 also show
              continued strategic broadening. Visa and VNPAY launched SoftPOS with international-card acceptance in
              2024, VNPAY, VIB, and Visa introduced an SME digitization stack in May 2025, VNPAY won two ABF FinTech
              Awards in July 2025 and a Visa Digital Pioneer recognition, and in 2026 VNPAY marketed QR payments funded
              by credit cards across a 600,000-point acceptance footprint while rolling out bundled payment and
              tax-filing solutions with Sacombank. The through-line is a shift from pure payment rail to multi-product
              commerce infrastructure.
