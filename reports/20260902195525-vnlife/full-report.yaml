      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The positive case for this market is straightforward: rising account ownership, growing internet and
              smartphone access, QR standardization, merchant acceptance, government support for financial inclusion,
              and cross-border connectivity all expand the reachable payment base. NAPAS 247 and VietQR create a
              national real-time rail that lowers friction for both retail and business payments, while policy attention
              has shifted from simply legalizing digital payments to governing them at scale. But the same maturity that
              expands addressable volume also compresses basic wallet economics. Bank apps are better than they were
              five years ago, transfers are often free, and QR acceptance is becoming utility-like. That raises the
              premium on merchant services, partner distribution, and software monetization. Risk control is the other
              major constraint. Circular 41 tightens onboarding, biometric verification, transaction limits, and
              information-sharing obligations from late 2025 into 2026. Vietnam News reports that users lost around VND8
              trillion to online scams in 2025, reinforcing that fraud is now a market-level trust issue rather than a
              niche operational problem. FX and cross-border regulation remain additional constraints: foreign operators
              typically need local licensed partners, and Vietnam's currency-control regime limits easy offshore
              shortcuts. In short, volume growth remains attractive, but durable economics depend on compliance strength
              and value-added monetization rather than on closed-loop wallet scale alone.
            claimRefs:
              - CM014
