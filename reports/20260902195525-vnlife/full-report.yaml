      - number: '2.5'
        title: Sizing and Interpretation Gaps
        blocks:
          - type: paragraph
            body: >-
              The central analytical risk in Vietnam payments is false precision. Different publishers use similar
              labels—payments market, mobile payments, e-wallet market, fintech market—while measuring entirely
              different things such as gross payment flow, provider revenue, app penetration, or broad sector value.
              Survey-based wallet-share figures overlap because many users keep several apps active at once. Merchant
              footprint data can mean businesses, partners, merchants, or acceptance points, none of which are
              interchangeable. Even apparently strong system metrics such as account ownership and digital-transaction
              share are powerful for direction but insufficient for underwriting one company's economics. For VNLIFE
              specifically, the missing bridges are VNPay GMV, take rate, merchant segmentation, cross-border payment
              mix, software revenue attach, and bank-partner concentration. Without those, public TAM data can support
              market attractiveness but not a precise underwriting model. The right diligence posture is therefore to
              use the public market evidence to establish tailwinds and constraints, preserve contradictory sizing
              lenses in plain sight, and then ask management for a KPI dictionary and a revenue bridge before moving
              from market analysis to valuation conclusions.
            claimRefs:
              - CM026
              - CM027
              - CM039
              - CM040
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The TAM is huge, but the monetizable layer is much smaller
            body: >-
              Vietnam’s payments TAM is clearly large and growing, but the sources reviewed here measure everything from
              total payment flow to provider revenue to all-fintech sector value. VNLIFE’s monetizable opportunity sits
              in the narrower orchestration and merchant-software layer, not in every dollar that moves digitally
              through the economy.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM039
              - CM040
          - type: callout
            title: Bank apps and free transfers commoditize basic wallet economics
            body: >-
              The market is maturing into infrastructure rather than app novelty. When instant transfers are free,
              VietQR is ubiquitous, and bank apps keep improving, value shifts away from basic wallet registration
              toward partner distribution, merchant software, and cross-sell. That is a favorable setup for
              infrastructure-led players but a harder one for thin consumer-only propositions.
            calloutType: risk
            claimRefs:
              - CM020
              - CM021
              - CM022
              - CM038
          - type: callout
            title: Regulatory trust-building raises the cost of participation
            body: >-
              Circular 41 and related biometric rules should improve safety and user protection, but they also add
              friction, storage obligations, transaction-limit logic, and compliance costs. In a market already facing
              fraud pressure, operators need both scale and disciplined risk systems to convert top-line growth into
              durable economics.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM033
