      - number: '3.4'
        title: Switching costs, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Vietnam's payment competitors do not face winner-take-all user behavior. The strongest public evidence
              shows widespread multi-homing, heavy promotion sensitivity, and distribution advantages that come from
              where users already spend time rather than from any exclusive payment technology. MoMo still appears to
              lead in frequency, but that edge sits on top of a market where 90% of users use multiple super apps for
              the same service and more than half actively arbitrage promotions. That makes ZaloPay's integration into
              chat, ShopeePay's attachment to commerce, and bank apps' ownership of primary account relationships
              especially important. VNPAY's position is again distinct: it does not need to win every consumer session
              if it sits inside the bank apps, merchant software, and acceptance rails that users already touch. The
              same logic explains why Moca's exit matters. A wallet can have a known brand and a powerful platform
              partner and still lose relevance if exclusivity fades and alternative rails become good enough. In this
              market, the real switching-cost layer is not the QR scan itself. It is the surrounding distribution base,
              merchant workflow, and financial relationship.
