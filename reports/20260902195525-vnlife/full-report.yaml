              VNLIFE passes the relevance test but not the valuation-precision test. The right move is disciplined
              tracking and targeted diligence, not generic enthusiasm for a unicorn headline.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV009
              - CV040
          - type: callout
            title: MoMo is the best comp because it shows what a premium Vietnam fintech mark looks like
            body: >-
              The MoMo process demonstrates that the market will pay more for Vietnamese payments leaders when
              profitability and user scale are more explicit.
            calloutType: insight
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV018
          - type: callout
            title: The missing bridge is economics, not market existence
            body: >-
              Investors already know VNLIFE serves a real market. The unresolved question is how efficiently that market
              position converts into durable, diversified returns.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV026
              - CV030
