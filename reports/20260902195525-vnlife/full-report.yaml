  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              VNLIFE’s regulatory environment is becoming more rule-heavy, not lighter. Circular 40/2024/TT-NHNN
              established the operating framework for intermediary payment services, and subsequent 2025-2026 amendments
              and commentary show tighter requirements around e-wallet opening, customer authentication, record
              retention, transaction limits, and licensing maintenance. For VNPAY, this matters in two ways. First,
              heavier regulation can raise barriers to entry and help scaled incumbents that already have compliance
              infrastructure. Second, it increases execution risk because the company is now selling directly into
              workflows—e-wallet surfaces, tax, identity, invoice, and contract processes—where mistakes can create
              regulatory exposure rather than mere UX inconvenience. The legal posture therefore looks double-edged:
              VNPAY appears better prepared than smaller challengers, but it also has more to lose if rules tighten, a
              product line needs relicensing, or customer-authentication standards change again. The correct framing is
              not “regulation is good” or “regulation is bad”; it is that regulation amplifies both moat and operating
              burden at the same time.
            claimRefs:
              - CR001
              - CR002
              - CR003
