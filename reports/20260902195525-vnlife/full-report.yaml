  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor
      - Public package
      - Price / unit / contract model
      - Included capabilities
      - Discount or unknowns
      - Implication
    rows:
      - - MoMo
        - Consumer financial app
        - Consumer-facing pricing not clearly posted on reviewed homepage; promotion-led value proposition
        - Transfers, bills, linked-bank flows, AI positioning, security controls
        - Merchant economics and realized fees not public in retained sources
        - MoMo competes more on engagement and bundle breadth than on a transparent posted price card
      - - ZaloPay
        - Consumer wallet inside Zalo
        - Official site says transfers and payment transactions are free, with possible fees above monthly limits
        - In-chat payments, service payments, promotions, PCI DSS and ISO 27001 signaling
        - Merchant pricing and monthly-limit economics not public on reviewed page
        - Consumer-side price is easy to understand, so differentiation must come from distribution and experience
      - - VNPAY / VNLIFE
        - Bank-tech and merchant payment platform
        - Gateway and merchant pricing appear contract-based and not public on reviewed consumer pages
        - Gateway, QR, POS, PhonePOS, invoice, bank-app embedding, B2B
        - Realized MDR, take rate, and partner revenue shares undisclosed
        - Economics likely sit on merchant and partner contracts, limiting public benchmarking
      - - Viettel Money
        - Licensed digital-finance ecosystem
        - Public pricing details not extracted from reviewed homepage
        - Transfers, bills, digital-finance and telecom ecosystem services
        - Scale pricing and merchant packages unclear in retained sources
        - Competitive value likely comes from ecosystem reach more than posted prices
      - - ShopeePay
        - Wallet plus commerce incentives
        - User-facing pricing appears voucher- and ecosystem-driven; detailed fee tables not extracted
        - QR payments, bills, partner payments, SPayLater, Shopee-commerce linkage
        - Merchant and financing economics not transparent from reviewed public page
        - ShopeePay can subsidize usage through commerce promotions even if standalone payment margins are thin
      - - Bank apps / VietQR
        - Core banking app and account-linked payments
        - >-
          Decision Lab-linked reporting and market guides indicate transfer pricing often feels free or utility-like to
          users
        - Transfers, QR, account management, cards, deposits, savings, credit
        - Specific fee tables vary by bank and were not enumerated in this chapter
        - Incumbents can compress wallet monetization because payments are bundled into broader banking economics
      - - Apple Pay
        - Card wallet overlay
        - Apple explicitly says it does not charge users to pay in store, online, or in apps
        - Tokenized contactless card payments across supported banks and merchants
        - Issuer or merchant economics are not disclosed by Apple
        - Apple competes on convenience and credential reuse, not on a standalone payment-fee model
    notes: >-
      Where public price cards are missing, the table preserves that opacity instead of inferring fee levels from
      category norms.
