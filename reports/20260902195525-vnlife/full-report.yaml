        title: Product surface and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              VNPAY’s public surface shows a payments platform that has expanded into a broader business-operating
              stack. The homepage and related product pages enumerate consumer utility surfaces, bank-embedded services,
              merchant acceptance tools, e-commerce payment gateway products, PhonePOS and SmartPOS acceptance, QR
              rails, invoice software, B2B payments, eKYC, and digital-contract products. The important analytical point
              is that these are not disconnected marketing pages. They map onto adjacent steps in the same transaction
              workflow: identity verification, checkout or in-store acceptance, merchant reporting, invoice issuance,
              contract execution, tax transmission, and partner-bank distribution. That matters for diligence because
              technical value at VNLIFE seems to come less from a single iconic app feature and more from the ability to
              stitch multiple regulated and operational surfaces together. The product strategy is therefore
