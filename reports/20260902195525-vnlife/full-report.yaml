chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              VNLIFE is best understood as a payments-and-digital-services holding company whose flagship asset is
              Vietnam Payment Solution JSC (VNPAY). Across official VNPAY pages, broker-style company material, and
              third-party profiles, the business is consistently described as a leading Vietnamese electronic-payments
              and banking-technology platform founded in 2007 and headquartered in Hanoi. The group does not present
              itself as a single-purpose consumer wallet. Instead, it packages bank-distributed mobile-banking software,
              QR acceptance, online payment gateway services, POS and PhonePOS merchant tools, eKYC and biometrics, bill
              payment, travel, commerce, invoicing, digital-signature, and business software products into one
              ecosystem. That architecture matters because VNPay's moat is not just a standalone consumer app; it is
              embedded distribution through banks, merchants, and payment partners. The company profile evidence also
              shows a wide physical footprint in Hanoi, Ho Chi Minh City, and Da Nang, reinforcing that VNLIFE is an
              operating platform business rather than a thin holding shell. Product breadth has expanded further by
              2025-2026, with official pages highlighting VNPAYB2B, tax-filing bundles, electronic invoicing, and
              merchant software that extend the franchise beyond QR acceptance alone.
