      - number: '4.3'
        title: Scale signals, cost structure, and unit-economics gaps
        blocks:
          - type: paragraph
            body: >-
              Public traction evidence is directionally strong even though it is not a substitute for audited
              financials. Official pages and partner releases point to over 40 bank relationships, hundreds of thousands
              of merchants or enterprises, and a growing software layer aimed at SMEs. The Vietcap deck adds the most
              financially useful detail, showing how separate lines are priced and which products are intended to
              cross-sell into others. But the same source set also exposes the central limitation: the public record is
              almost silent on realized GMV, blended net take rate, gross margin, CAC, payback, churn, and EBITDA. Even
              when public pages show scale, the denominators drift materially across banks, consumers, customers,
              merchants, enterprises, acceptance points, and wallet users. Cost structure has to be inferred from
              product design. The model appears lighter than a lender or hardware manufacturer because VNPAY uses
              software, bank distribution, and low-capex merchant devices, yet compliance, partner integration, sales
              support, merchant subsidies, and fraud tooling are clearly not trivial. The right read is that VNLIFE
              likely has a more attractive margin path than a pure subsidy wallet, but there is not enough public
              disclosure to prove where that margin path currently stands.
