        title: Financial-model and execution risk
        blocks:
          - type: paragraph
            body: >-
              The financial-risk picture is dominated by disclosure scarcity and execution complexity rather than by a
              confirmed solvency crisis. Public evidence supports diversified monetization and meaningful historical
              funding, but it does not provide current cash, burn, runway, partner concentration, or product-line
              profitability. At the same time, VNPAY is trying to do several things at once: defend core payments, scale
              PhonePOS, attach invoice and tax modules, deepen bank distribution, and convert compliance-driven
              acquisition into durable recurring usage. That cross-product agenda can create a stronger platform over
              time, but it also increases coordination and support burden across sales, implementation, compliance, and
              engineering. Subsidy programs through 2028 may help seed adoption, yet they also create a future test:
              whether the cohorts remain attractive once promotional conditions change. Viewed this way, the biggest
              financial risk is not simply price competition on QR or transfers. It is the possibility that a complex,
              multi-product growth story looks broader in public than it proves in unit-economic reality.
