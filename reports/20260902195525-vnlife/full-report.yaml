      - number: '1.2'
        title: Leadership, Governance, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              The clearest public leadership picture comes from the 2025 Vietcap company profile and selected
              third-party profiles rather than from a detailed VNLIFE corporate-governance page. Those materials
              identify Trần Trí Mạnh as chairman of both VNLIFE and VNPAY, Mai Thanh Binh as vice chairman of VNLIFE and
              a founder figure associated with VNPay, Lê Tánh as CEO of VNPAY, Niraan De Silva as CEO and board member
              of VNLIFE, and Kỳ Trần Văn as another board member. VNPAY's own contact page lists a main Hanoi
              headquarters plus offices in Ho Chi Minh City and Da Nang, while the broker deck maps a larger office
              network and 3,000-plus staff, 40% of whom are technical personnel. The operating implication is twofold.
              First, VNLIFE appears managerially deeper than a founder-only startup, which is important for bank
              integrations and merchant operations at national scale. Second, public governance disclosure remains
              partial because the company is private: outside of slide decks and press releases, investors do not yet
              get a full live board roster, committee structure, or standardized annual governance report. That limited
              transparency does not negate the evidence of scale, but it does mean diligence on board rights, reporting
              lines, and succession planning would need direct management access rather than public-web verification.
