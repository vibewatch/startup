        - Would undermine the workflow-attachment monetization story.
        - Lower bull/base assumptions and re-rate to bear.
      - - Net take rates or margins are structurally thin
        - Audited bridge shows routed volume does not translate into attractive economics
        - Would show scale without enough monetization quality.
        - Avoid paying above low-end corridor; consider pass.
      - - Material security or control failure emerges
        - Incident or audit findings weaken trust in payments or identity operations
        - Would impair both growth and exit optionality.
        - Pause diligence or terminate process.
    notes: >-
      These triggers are intended for investment-committee monitoring and should be tested during diligence, not after
      capital is committed.
    claimRefs:
      - CV026
      - CV031
      - CV032
      - CV034
      - CV035
      - CV036
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Audited financial bridge
        - Net revenue, gross margin, EBITDA, and cash flow by major product line
        - Without this, valuation remains anchored to rumor and comps more than economics.
        - 'Finance DD: request latest audited statements and board pack.'
      - - Partner concentration
        - Revenue, TPV, and activation mix by top banks and top merchants
        - Breadth could hide dependency on a few counterparties.
        - 'Commercial DD: request channel concentration tables.'
      - - Cohort quality
        - Active merchant retention, reactivation, and attach by tax / invoice / acceptance cohorts
        - Need to separate real recurring value from rollout PR.
        - 'Growth DD: request cohort dashboards.'
      - - Cap stack
        - Current cap table, investor rights, preference stack, and any debt
        - Headline valuation may not map to common-equity returns.
        - 'Legal / finance DD: review financing documents.'
      - - Regulatory economics
        - Incremental cost and conversion impact from newer e-wallet and recordkeeping rules
        - Moat-building regulation can still compress margins.
        - 'Compliance DD: review internal impact assessment.'
      - - Exit readiness
        - Board materials on strategic process, secondary interest, or listing preparation
        - Optionality should not be priced as certainty.
        - 'Board / corp-dev DD: request process history and exit workstreams.'
    notes: >-
      These are the minimum diligence asks required before turning a monitored asset into an aggressively priced
      investment recommendation.
    claimRefs:
      - CV004
      - CV005
      - CV029
      - CV030
      - CV031
      - CV034
      - CV035
      - CV039
