              contract-length, or renewal-rate series. Consumer-facing evidence from Vietnam’s wallet market actually
              cuts the other way: multi-homing is common, promotions matter, and bank-owned apps have been taking
              mindshare. That means VNPAY’s durable revenue likely depends less on exclusive consumer habit and more on
              operational embed with banks and merchants. The 2025-2026 bank-partnership wave supports that thesis
