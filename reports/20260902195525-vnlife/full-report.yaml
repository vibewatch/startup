            body: >-
              VNPAY’s customer base is better understood as a routed ecosystem than as one homogeneous customer pool.
              Banks and financial institutions are both channel partners and buyers of software or infrastructure
              modules. Merchants, SMEs, and household businesses are direct commercial users of acceptance, invoicing,
              and tax tools. Consumers are the transacting end users, but often they enter the system through bank apps,
              QR acceptance points, or merchant checkout rather than through a single VNPAY consumer habit. That
              distinction matters because breadth at the consumer edge does not automatically reveal who pays VNPAY or
              how sticky revenue is. Public evidence suggests the highest-value customer relationships sit where VNPAY
              can combine distribution, payment acceptance, and compliance-linked tooling. The company’s surface is
              therefore unusually segmented: one buyer may be a bank procurement team, one user may be a merchant
              cashier, and the economic beneficiary may be an SME owner trying to formalize reporting under new tax
              rules. This complexity is a strength because it creates multiple entry points, but it also complicates
              simple user-count interpretation.
