            body: >-
              Trust is where VNPAY’s public evidence is strongest. Official and independent sources support a sequence
              from 2022 SoftPOS security and EMV work, to 2023 e-contract certification, to 2025 MPoC for PhonePOS, and
              to 2025 PCI DSS 4.0.1 Level 1 coverage across six services. The eKYC page adds further non-trivial
              identity evidence with ISO/IEC 30107-3, ISO/IEC 19795-2, ISO 27001, and government cloud-criteria
