  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and monetization routes
        blocks:
          - type: paragraph
            body: >-
              The best public evidence on VNLIFE’s financial model comes from its product surfaces and the 2025 Vietcap
              profile rather than from audited public accounts. Those materials show a business with several
              monetization lanes: software fees from omni-channel banking sold to banks, per-account or
              per-authentication economics from eKYC and biometric products, commission-bearing distribution services,
              merchant discount rates on QR payments, gateway-style processing economics for cards and app-call-app
              checkout, rental or transaction-linked economics in POS and PhonePOS, invoice and tax software packages,
              digital-signature SaaS, and B2B payment rails. This matters because it changes the way the company should
              be underwritten. VNLIFE is not just a QR-payment logo sitting on top of bank apps. It is a layered
              payments-and-software platform where some lines look transaction-linked, some look SaaS-like, and some
              look rev-share based. The strongest implication is positive: diversified monetization architecture reduces
              dependence on any single wallet behavior. The main caution is that public sources reveal list mechanics
              and product logic much more clearly than they reveal realized revenue contribution by stream.
