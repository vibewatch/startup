      - number: '8.4'
        title: Bull, base, and bear valuation range
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis for VNLIFE must stay explicit about uncertainty. The public record is strong enough to
              reject a trivial downside case: this is not a pre-product startup, and the company’s distribution and
              workflow reach are real. It is not strong enough to support narrow valuation precision. The bull case
              assumes VNLIFE’s payment rails and workflow modules produce diversified, sticky economics that justify a
              valuation modestly above the currently reported unicorn threshold. The base case assumes the 2025
              secondary signal is directionally fair but requires no premium until audited economics arrive. The bear
              case assumes that concentration, regulatory friction, or weaker-than-expected take rates pull the company
              below the psychological unicorn line. Probability weighting therefore has to favor the middle while
              preserving real downside. The resulting range is best used as an investment-committee discussion tool, not
              as a banker-style fairness opinion or a substitute for primary diligence.
