  summary: >-
    VNLIFE is a Hanoi-founded Vietnamese fintech group established in 2007 and best known for VNPay, its bank-embedded
    payments and merchant-software franchise. Public evidence describes a platform spanning QR payments, payment
    gateway, POS/PhonePOS, eKYC and biometrics, invoicing, digital contracts, and tax-linked SME workflows rather than a
