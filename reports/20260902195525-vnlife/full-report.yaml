  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers, incumbents, adjacents, substitutes, and the status quo'
        blocks:
          - type: paragraph
            body: >-
              VNLIFE competes in a broader battlefield than standalone e-wallet league tables show. The direct branded
              peers are MoMo, ZaloPay, Viettel Money, and ShopeePay, but the strongest structural substitutes are
              bank-owned mobile apps, card wallets such as Apple Pay, and the increasingly credible status quo of paying
              through a salary-account banking app plus VietQR. The chapter 2 market work matters here: once QR
              acceptance and instant transfer rails are standardized, the buyer no longer has to choose one closed
              payment ecosystem to solve the payment job. Instead, users and merchants can switch between bank apps,
              wallets, and card overlays while keeping similar checkout behavior. That is why VNLIFE looks different
              from MoMo or ZaloPay. VNPAY's moat is not primarily a habit-loop consumer wallet but a bank-embedded and
              merchant-embedded orchestration layer. The competitive question is therefore not merely who wins the most
              app opens; it is who controls distribution, trust, and the higher-value workflows that sit behind payment
              acceptance.
