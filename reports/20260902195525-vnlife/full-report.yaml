      - number: '4.2'
        title: Pricing surfaces, packaging, and GTM proxies
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is partial, but the reviewed sources are still revealing. Older VNPAY-POS
              material published an explicit machine-rental example, threshold-based fee waivers, and a volume target
              for free use, while newer PhonePOS material says setup is free and merchant cost is primarily a discounted
              per-transaction fee. The tax-filing and merchant-software bundle goes further, offering up to three years
              of free usage through end-2028 for qualifying business households. Taken together, this suggests VNPAY
              does not always optimize for near-term software revenue at the point of sale. Instead, it appears willing
              to subsidize onboarding and then recover value through transaction fees, software attach, bank
              distribution, and longer-lived merchant relationships. The GTM motion is equally visible. Visa, VIB, and
              Sacombank partnership materials show VNPAY selling into SMEs and business households through integrated
              packages that combine payment acceptance, invoice, contracts, banking connectivity, and tax workflows.
              That is economically important because it raises the chance of multi-product attachment even if baseline
              payment fees are pressured by free-transfer norms and interoperable QR competition.
