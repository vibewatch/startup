              The cleanest comparable lens for VNLIFE is a bracket, not a single perfect peer. MoMo is the closest
              private benchmark because it operates in the same Vietnamese digital-payments economy and is being
              assessed by investors in the same 2026 financing environment. But even MoMo is not a 1:1 transfer because
              public reporting around MoMo is more explicit about profitability, user scale, and investor process. Adyen
              and Sea are useful ceiling-style public references: both show what scaled, trusted payments or regional
              digital-finance platforms can be worth, but both are far larger and more transparent than VNLIFE. Marqeta
              offers a lower-bound reminder that public payment-infrastructure businesses can still cluster around
              low-unicorn valuations when growth or monetization confidence compresses. The core conclusion from the
