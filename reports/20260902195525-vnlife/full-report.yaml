  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What VNLIFE Actually Sells Into
        blocks:
          - type: paragraph
            body: >-
              VNLIFE should be analyzed inside Vietnam's digital-payments and commerce-enablement stack rather than
              inside every number labeled 'fintech' or 'digital economy.' The included spend is money movement or
              checkout behavior that can be initiated, routed, accepted, or monetized through bank-embedded apps, QR
              acceptance, payment gateways, POS/PhonePOS, bill payment, public-service collection, merchant software, or
              adjacent business-finance tools. That boundary captures the parts of the market where VNPay's products can
              earn economics directly or create sticky distribution. The right exclusions are just as important: cash
              that never digitizes, pure deposit balances sitting inside banks, lending revenue with no VNPay role, and
              broad software or AI spending that may be relevant to Vietnam's economy but not to the company's payment
              franchise. The status-quo substitutes are powerful. Consumers and merchants can use bank-app transfers,
              VietQR, cards, cash, or other wallets without caring who provides the orchestration layer underneath. That
              is why VNLIFE matters more as a bank-embedded and merchant-embedded infrastructure player than as a pure
              standalone wallet. VietQR and NAPAS have flattened the acceptance layer enough that the differentiating
              question is no longer 'can a customer pay digitally?' but 'which platform best bundles distribution,
              merchant tools, and adjacent financial or operational workflows?'
            claimRefs:
