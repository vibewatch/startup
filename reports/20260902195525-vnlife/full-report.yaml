        - Preserve metric definitions and request company-side routed-volume data
      - - Independent wallets remain the primary threat set
        - The strongest long-term threat may be banks plus interoperable rails, not another standalone wallet
        - high
        - The market is maturing toward infrastructure and balance-sheet competition
        - Underwrite VNLIFE against bank-app and rail substitution scenarios, not wallet headlines alone
    notes: Severity reflects competitive durability risk to VNLIFE specifically, not generalized consumer brand popularity.
