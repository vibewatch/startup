      - number: '4.5'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The cleanest financial verdict is that VNLIFE has a credible monetization design and strong channel
              coverage, but insufficient outcome disclosure. There is enough public evidence to believe the company
              monetizes across more than one line, uses pricing and subsidy tactically to expand SME reach, and has
              raised enough capital to build real infrastructure. There is not enough evidence to underwrite actual
              revenue quality, margin durability, or self-funded growth. In practice that means a serious diligence
              process should spend less time debating whether VNLIFE has a business model and more time forcing a
              rigorous KPI dictionary and bridge from payment volume to net revenue to gross profit. The missing pieces
              are specific and actionable: consolidated revenue, GMV by product, realized MDR net of issuer sharing,
              software-attachment penetration, churn and cohort retention, CAC and payback, gross margin, EBITDA, cash
              balance, and channel concentration by bank and merchant segment. Until those are produced, this chapter
