  - id: FV001
    type: flow
    title: Recommendation logic
    layout: wide
    summary: >-
      Decision flow from VNLIFE’s strategic proof through disclosure and valuation constraints to the current
      recommendation.
    approximationNotes: >-
      This flow is qualitative and intended to show how the recommendation is derived from evidence quality rather than
      from a proprietary scoring model.
    data:
      nodes:
        - id: n1
          label: 'Current public anchor: >US$1B 2025 stake-sale discussion'
          detail: Useful signal, but not closed price discovery
        - id: n2
          label: Strategic proof is real
          detail: Bank distribution, acceptance rails, and workflow modules exist at scale
        - id: n3
          label: Economic proof is incomplete
          detail: No public audited bridge for revenue, margins, concentration, or cap stack
        - id: n4
          label: Comp corridor is usable but wide
          detail: MoMo sits above; Marqeta-like lower bounds still matter
        - id: n5
          label: 'Current call: TRACK / RESEARCH MORE'
          detail: Respect the asset, but do not chase price on incomplete evidence
        - id: n6
          label: Upgrade path
          detail: Audited economics, low concentration, strong cohorts, manageable compliance cost
        - id: n7
          label: Downgrade path
          detail: Discounted financing, thin take rates, concentration, or control failure
      edges:
        - from: n1
          to: n2
          label: Test whether the signal reflects real scale
        - from: n2
          to: n3
          label: Then test monetization quality
        - from: n3
          to: n4
          label: Then bracket with comparables
        - from: n4
          to: n5
          label: Current result
        - from: n5
          to: n6
          label: What improves the call
        - from: n5
          to: n7
