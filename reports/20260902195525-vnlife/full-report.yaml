      - number: '7.2'
        title: Operational, security, and fraud risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, VNPAY benefits from visible control investment but still carries meaningful runtime risk.
              Its public certifications around PCI DSS, MPoC, CPoC, EMV, and eKYC standards are a real positive because
              they indicate disciplined security and compliance work across several layers of the stack. Yet those same
              certifications are reminders that the system operates in high-stakes environments where failure has real
              cost. Public materials do not provide uptime history, incident reports, chargeback rates, fraud-loss data,
              or detailed postmortems. The gateway documentation also makes plain that merchant integrations depend on
              signed parameters, callbacks, and reconciliation steps, which creates implementation risk at scale.
              Meanwhile, Vietnam’s broader digital-finance market is experiencing rising fraud pressure and more
              sophisticated attack vectors. As VNPAY expands PhonePOS, SmartPOS, biometrics, and merchant software, the
              attack surface widens across devices, networks, and identity checks. Operational risk is therefore not
              disproven by certification; it is partially mitigated by certification while still under-disclosed in
              day-to-day performance terms.
