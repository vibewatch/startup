      - number: '2.2'
        title: 'Sizing the Stack: TAM, SAM, and Evidence-Constrained SOM'
        blocks:
          - type: paragraph
            body: >-
              Public market-size numbers are abundant, but they describe different layers of the stack. Mordor's
              broadest payments lens puts Vietnam's payments market at US$120.78 billion in 2025, US$133.35 billion in
              2026, and US$218.8 billion by 2031. Ken Research looks at a narrower provider-revenue pool for digital
              payments and e-wallets, sizing it at US$780 million in 2025 and US$1.98 billion by 2031. Digital in Asia
              adds a still-broader fintech-market estimate—US$3.42 billion in 2025 to US$7.78 billion by 2030—and
              separately cites a US$47.56 billion mobile-payments market. These are not contradictions so much as
              boundary mismatches. Total payment flow, provider revenue, and all-fintech revenue are different
              quantities. The cleanest SAM for VNLIFE is therefore not the full payments TAM but the subset of wallet,
              QR, gateway, merchant-acquiring, and B2B payment workflows where bank-distributed and merchant-distributed
              products matter. Even that SAM cannot be converted into VNLIFE SOM with confidence from public sources,
              because VNPay does not disclose GMV, take rate, or segment revenue. The chapter therefore preserves
              multiple lenses, flags their methodological differences, and treats VNLIFE's true share of the market as a
              diligence gap rather than a guessed conclusion.
            claimRefs:
