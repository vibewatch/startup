      - number: '4.4'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The capital-history picture is unusually clear for a private Vietnamese fintech even though ongoing cash
              disclosure is not. PayPal’s 2021 release, GPCA coverage, and database profiles all support roughly US$550
              million of disclosed funding across the 2019 and 2021 rounds. Later 2025 reporting that GIC and SoftBank
              explored stake sales at valuations above US$1 billion is also important, but for a different reason: it is
              a liquidity signal for existing holders, not evidence that VNLIFE raised fresh primary capital. That
              distinction matters for capital adequacy. From the public record, VNLIFE does not look obviously starved
              of funding; it looks under-disclosed. Its product architecture is software- and distribution-heavy rather
              than balance-sheet-heavy, and partner materials show banks carrying the financing layer where credit
              products are involved. That should reduce capital intensity relative to a lender or a hardware fleet
              operator. But the crucial unknowns remain the most traditional ones: current cash balance, monthly burn,
              profitability status, and runway. Without those, disclosed historical fundraising can support resilience
              but not certainty about current financial health.
