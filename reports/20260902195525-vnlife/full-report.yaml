    sections:
      - number: '8.1'
        title: Recommendation, confidence, and thesis framing
        blocks:
          - type: paragraph
            body: >-
              VNLIFE deserves to be treated as a serious late-stage fintech platform, not as a speculative concept. The
              company has blue-chip historical backers, broad bank distribution, a large installed payments surface, and
              credible evidence that it is extending from payments into SME and compliance-linked workflows. Those
              strengths matter because they create replacement cost, strategic relevance, and a plausible path to
              further private transactions or eventual exit optionality. But recommendation quality depends on price and
              disclosure, not on narrative quality alone. The freshest public mark is only a reported 2025 stake-sale
              discussion above US$1 billion, and there is still no public audited bridge for revenue, margins, cash
              flow, or concentration. That means investors can recognize the platform’s quality while still refusing to
              underwrite an aggressive price. The right framing today is TRACK / RESEARCH MORE with medium confidence
              and medium-high risk: the business looks real, but the valuation case is still thinner than the strategic
              case.
