      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Vietnam's digital-payments demand does not come from one homogeneous 'wallet user.' Urban consumers use
              payments for convenience, bill pay, mobility, food, and e-commerce. Merchants adopt QR and gateway tools
              to lower checkout friction, reconcile transactions, and widen acceptance without expensive hardware.
              Financial institutions and public-sector entities are upstream payers because they fund the
              infrastructure, compliance, and distribution layers that allow retail users to transact. SME users are
              especially important for VNLIFE because public evidence increasingly shows the next growth layer shifting
              from consumer wallet acquisition toward business tooling, invoicing, digital contracts, collections, and
              working-capital enablement. Geography also matters: Hanoi and Ho Chi Minh City dominate wallet and
              payment-provider revenue, but rural inclusion and emerging provincial cities remain meaningful expansion
              pockets. Consumer behavior shows why the market is competitive despite maturity. Users multi-home heavily
              across super apps, chase promotions, and increasingly keep bank apps as their default financial front end.
              That means the true budget owner is often the merchant, partner bank, or ecosystem operator that can
              attach payments to a broader workflow rather than the end user paying a direct fee. For VNLIFE, the
              implication is favorable: bank-distributed QR and merchant software can still win even if no single
              consumer app monopolizes daily engagement.
