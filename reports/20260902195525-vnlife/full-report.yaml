      - number: '8.2'
        title: Valuation context and what public evidence actually prices
        blocks:
          - type: paragraph
            body: >-
              Public valuation context for VNLIFE is simultaneously helpful and incomplete. Helpful, because the 2025
              stake-sale reporting confirms that sophisticated holders believed the company still merited a unicorn-plus
              discussion after the 2021 funding cycle. Incomplete, because the reporting does not show that a
              transaction closed, what rights or preferences were attached to any securities, or how the company’s
              current financial performance supports that mark. The strongest publicly visible support comes from scale
              and strategic position: bank-channel reach, merchant acceptance, and workflow products linked to tax and
              SME digitization. What is missing is precisely what matters most for price discipline—audited revenue,
              take rate, gross margin, net retention, partner concentration, and treasury position. As a result,
              investors are not really pricing a clean cash-flow stream from public evidence; they are pricing a scaled
              strategic asset with uncertain monetization quality. That distinction is why the same company can look
              strategically attractive yet still deserve valuation restraint.
