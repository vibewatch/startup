        - Standalone super-app with large partner network
        - Promotions, convenience, broad bill-pay and financial-service use cases
        - Frequency, habit, cross-sell into finance
        - Some habit and partner-locking, but users still multi-home heavily
        - Loyalty is vulnerable to promotion fatigue and bank-app substitution
      - - ZaloPay
        - Zalo messaging app and merchant network
        - In-chat convenience and free transfers
        - Conversation-linked payments and Zalo reach
        - Low-moderate; strong distribution but portable payment behavior
        - Needs to convert social reach into durable economics
      - - VNPAY / VNLIFE
        - Bank apps, merchant acceptance, gateway relationships
        - Users encounter VNPAY through bank or merchant workflow rather than app choice alone
        - Embedded rails and merchant workflow continuity
        - Moderate on partner side; lower dependence on consumer app preference
        - Partner concentration and merchant contract visibility are still unknowns
      - - Viettel Money
        - Viettel customer base and digital-services ecosystem
        - Existing telecom and service relationship
        - Convenience inside broader digital-services ecosystem
        - Moderate if service bundle is used broadly
        - Public evidence on active frequency is thinner than for larger wallet brands
      - - ShopeePay
        - Shopee and partner commerce ecosystem
        - Checkout convenience, vouchers, BNPL
        - Repeat use inside shopping and food-delivery loops
        - Low-moderate outside commerce context
        - Off-platform general-finance stickiness appears weaker
      - - Bank apps / VietQR
        - Primary bank account, salary relationship, deposit trust
        - Users already bank there and do not need another wallet
        - Account primacy, QR ubiquity, integrated financial services
        - High because salary, deposits, and credit relationships persist
        - Less exciting promotions, but economics are strong
      - - Apple Pay
        - Existing card credentials on Apple devices
        - Fast contactless payment without another wallet signup
        - Convenience and broad merchant acceptance
        - Low because cards are portable across merchants
        - Limited to supported devices and cardholders
    notes: >-
      The decisive switching-cost question is not whether QR works, but where the user or merchant already has a durable
      relationship.
