- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Probability signal
  - Assumptions
  - Valuation / return logic
  - Implied value
  rows:
  - - Bull
    - 20%
    - Partner economics are diversified; workflow attachments materially raise monetization; regulation is absorbed without conversion damage.
    - Investors pay above the current reported unicorn threshold because the business looks like a broader software-inflected payments platform rather than commodity routing.
    - US$1.2-1.5B
  - - Base
    - 50%
    - Scale is real, but disclosure remains incomplete and economics prove solid rather than exceptional.
    - The 2025 secondary signal remains roughly fair but does not earn a premium.
    - US$0.9-1.15B
  - - Bear
    - 30%
    - A few banks drive disproportionate value; onboarding or retention weakens under tighter rules; net take rates look thin.
    - The company still has real assets, but public buyers or private investors demand a larger opacity discount.
    - US$0.6-0.85B
  - - Probability-weighted view
    - 100%
    - Scale plus opacity produce a real middle corridor with meaningful downside preserved.
    - Weighted central range from the scenarios above.
    - US$0.9-1.1B
  notes: These are explicit assumption ranges, not forecasts. Public evidence is insufficient for a tight DCF or clean EV/revenue bridge.
