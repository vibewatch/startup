  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financial-bridge
    missingEvidence: No public audited bridge from routed payment activity into consolidated net revenue, gross margin, EBITDA, or free cash flow.
    whyItMatters: Without it, every valuation multiple remains a rough proxy rather than an underwritten price.
    diligencePath: Request the latest audited or board-level management accounts plus product-level revenue and margin bridge.
    relatedQuestionRefs:
    - QV004
    - QV005
    - QV024
    relatedTableRefs:
    - TV003
    - TV004
    - TV006
  - type: private-evidence-only
    severity: material
    topic: concentration-and-cohort-quality
    missingEvidence: No public top-bank / top-merchant concentration table, active cohort retention curve, or attach-rate data for tax, invoice, contract, and merchant modules.
    whyItMatters: Breadth can mask dependency or subsidy-led usage if cohort quality is weak.
    diligencePath: Request partner concentration, cohort retention, attach, and net take-rate dashboards by major channel.
    relatedQuestionRefs:
    - QV018
    - QV020
    - QV024
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cap-stack-and-preferences
    missingEvidence: No public view of current liquidation preferences, investor rights, debt, or other senior claims in the cap table.
    whyItMatters: Common-equity return can diverge materially from headline enterprise value when preference overhang is opaque.
    diligencePath: Obtain current cap table, financing documents, investor-rights agreements, and any debt schedules.
    relatedQuestionRefs:
    - QV023
    - QV027
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: regulatory-cost-and-conversion
    missingEvidence: No public quantitative evidence on how newer e-wallet and recordkeeping rules affect onboarding conversion, fraud, compliance cost, or support burden.
    whyItMatters: Regulatory change may either strengthen the moat or compress economics; without quantified effects the valuation discount cannot shrink confidently.
    diligencePath: Review internal compliance gap assessments, onboarding conversion trends, fraud metrics, and incremental operating-cost impact.
    relatedQuestionRefs:
    - QV025
    - QV029
    relatedTableRefs:
    - TV005
    - TV006
