- id: diligence-and-kill-triggers
  title: Diligence asks, thesis-break triggers, and entry discipline
  body: The path from “interesting” to “investable at price” is straightforward even if it is still incomplete. Investors need a clean financial bridge, concentration visibility, cap-stack clarity, and quantified evidence that regulatory changes are absorbable rather than margin-destructive. If management can show diversified partner economics, healthy active cohorts, resilient take rates, and limited preference overhang, VNLIFE’s valuation corridor can move upward and the recommendation can improve. If instead diligence shows dependence on a few banks, subsidy-shaped demand, thin net economics, or a need for capital at weaker terms, the downside case strengthens quickly. That is why entry discipline matters more than storytelling. The company has earned ongoing attention, but not blind price acceptance. Explicit thesis-break triggers—discounted financing, channel concentration, compliance drag, or control failure—should be treated as gating items, not post-close clean-up work.
