- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Strategic position
    - VNLIFE has durable bank distribution and embedded payments infrastructure.
    - Distribution breadth may conceal weak economics or concentrated dependency.
    - Channel-level revenue, TPV, and renewal disclosures.
  - - Product breadth
    - Tax, invoice, contract, and merchant modules can deepen monetization beyond basic payment routing.
    - Breadth can also add support and compliance burden without enough incremental margin.
    - Attach-rate and gross-margin data by product line.
  - - Market proof
    - The 2025 stake-sale reporting suggests sophisticated holders still see meaningful value.
    - The signal is indicative only because no closed transaction or detailed terms were disclosed.
    - Evidence of a completed arm’s-length transaction or fresh audited mark.
  - - Competitive position
    - VNLIFE’s bank-linked model can be more defensible than a pure promo-driven wallet.
    - MoMo and bank apps still set a higher bar for consumer engagement and price discovery.
    - Proof of sticky active cohorts and superior partner economics.
  - - Capital support
    - Historical backers lower existential risk and increase exit optionality.
    - Historical backing does not guarantee attractive returns at a new entry price.
    - Current cap-stack, treasury, and return waterfall visibility.
  - - Exit path
    - Strategic sale, secondary, or eventual listing are all plausible.
    - None is presently de-risked enough to justify paying up for optionality alone.
    - Board-ready exit preparation and public-quality controls evidence.
  notes: The table separates company quality from underwriting quality; the former is stronger today than the latter.
