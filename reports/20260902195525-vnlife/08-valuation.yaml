- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Future financing comes below the current reported unicorn corridor
    - Any new priced round or large secondary clearly below roughly US$0.9B
    - Would signal that private price discovery materially disagrees with the current public anchor.
    - Downgrade immediately; revisit downside case and return floor.
  - - Top-bank concentration proves high
    - A few partners drive most TPV, revenue, or merchant activation
    - Would weaken the diversification thesis and raise renegotiation risk.
    - Require concentration-adjusted underwriting or walk away.
  - - Compliance-led onboarding stalls
    - Tax / invoice / merchant cohorts fail to activate or retain after rollout
    - Would undermine the workflow-attachment monetization story.
    - Lower bull/base assumptions and re-rate to bear.
  - - Net take rates or margins are structurally thin
    - Audited bridge shows routed volume does not translate into attractive economics
    - Would show scale without enough monetization quality.
    - Avoid paying above low-end corridor; consider pass.
  - - Material security or control failure emerges
    - Incident or audit findings weaken trust in payments or identity operations
    - Would impair both growth and exit optionality.
    - Pause diligence or terminate process.
  notes: These triggers are intended for investment-committee monitoring and should be tested during diligence, not after capital is committed.
