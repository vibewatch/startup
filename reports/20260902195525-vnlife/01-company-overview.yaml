callouts:
- calloutType: strength
  title: Bank-embedded distribution is the core moat
  body: The strongest evidence does not describe VNLIFE as a pure consumer wallet. It describes a bank-embedded distribution network that links banking software, QR acceptance, merchant tools, and business software across 40-45+ banks and hundreds of thousands of acceptance points or partners. That architecture is harder to dislodge than a cashback-driven app alone.
  claimRefs:
  - CO003
  - CO006
  - CO007
  - CO008
  - CO025
  - CO041
- calloutType: risk
  title: Scale metrics are directionally strong but not definitionally clean
  body: 'Reviewed public sources use different denominators for reach: users, consumers, customers, merchants, enterprises, business partners, and acceptance points all appear in different vintages. The trend is clearly upward, but valuation work should request one reconciled internal KPI dictionary before treating any single figure as the canonical operating metric.'
  claimRefs:
  - CO007
  - CO008
  - CO022
  - CO023
  - CO036
- calloutType: risk
  title: Stake-sale reporting creates both valuation support and exit overhang
  body: The September 2025 reports that GIC and SoftBank were testing a sale at US$1B+ are helpful as a current market-pricing anchor, but they also show that major early investors may be looking for liquidity. For a private fintech whose last primary round was in 2021, that can pressure governance, disclosure, and eventual exit timing.
  claimRefs:
