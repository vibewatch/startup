company:
  name: VNLIFE
chapter:
  number: 1
  title: Company Overview
  summary: VNLIFE is a Hanoi-founded fintech group built around VNPay, Vietnam's best-known bank-embedded QR and payment infrastructure franchise. Public evidence supports a 2007 founding, about $550 million of funding across 2019 and 2021 rounds, a still-private ownership base led by GIC, SoftBank, General Atlantic, and Dragoneer, and a September 2025 secondary-sale discussion that implied valuation above $1 billion. The strongest current evidence of scale comes from official VNPAY surfaces and a 2025 company profile deck showing 45+ bank relationships, 30mn+ QR users, 400,000+ acceptance points, and 3,000+ staff, though live company pages now cite even larger merchant and acceptance footprints using slightly different definitions.
sections:
- id: identity-business-model
  title: Identity and Business Model
  body: VNLIFE is best understood as a payments-and-digital-services holding company whose flagship asset is Vietnam Payment Solution JSC (VNPAY). Across official VNPAY pages, broker-style company material, and third-party profiles, the business is consistently described as a leading Vietnamese electronic-payments and banking-technology platform founded in 2007 and headquartered in Hanoi. The group does not present itself as a single-purpose consumer wallet. Instead, it packages bank-distributed mobile-banking software, QR acceptance, online payment gateway services, POS and PhonePOS merchant tools, eKYC and biometrics, bill payment, travel, commerce, invoicing, digital-signature, and business software products into one ecosystem. That architecture matters because VNPay's moat is not just a standalone consumer app; it is embedded distribution through banks, merchants, and payment partners. The company profile evidence also shows a wide physical footprint in Hanoi, Ho Chi Minh City, and Da
    Nang, reinforcing that VNLIFE is an operating platform business rather than a thin holding shell. Product breadth has expanded further by 2025-2026, with official pages highlighting VNPAYB2B, tax-filing bundles, electronic invoicing, and merchant software that extend the franchise beyond QR acceptance alone.
