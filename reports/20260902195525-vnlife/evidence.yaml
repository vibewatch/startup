evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      A current cap table showing founder ownership, investor percentages, board rights, and transfer restrictions after
      the 2021 round.
    whyItMatters: >-
      Ownership concentration and investor rights matter for any future secondary, IPO, or governance assessment, and
      public-web evidence is incomplete beyond one 2019 GIC datapoint.
    diligencePath: >-
      Request the latest cap table, shareholder agreement summary, and board-observer schedule from management or lead
      investors.
    relatedQuestionRefs:
      - QO010
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale-definitions
    missingEvidence: >-
      A reconciled KPI dictionary for users, consumers, customers, merchants, enterprises, partners, and acceptance
      points.
    whyItMatters: >-
      Public scale numbers are directionally positive but use inconsistent denominators, which can distort market-share,
      monetization, and valuation work if treated as identical.
    diligencePath: Request a one-page internal metric glossary and a three-year historical KPI bridge broken out by definition.
    relatedQuestionRefs:
      - QO015
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: financial-disclosure
    missingEvidence: Public revenue, profit, GMV, take-rate, and margin disclosures for VNLIFE or VNPAY after the 2021 financing.
    whyItMatters: >-
      Chapter 1 can establish identity and scale, but valuation-grade underwriting needs financial outputs rather than
      only reach and funding metrics.
    diligencePath: >-
      Search for audited statements, request management accounts, or obtain lender/investor materials with historical
      financials.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: minor
    topic: governance-detail
    missingEvidence: A current full board roster and committee structure for VNLIFE.
    whyItMatters: >-
      The company is clearly operating at large scale, but private-company governance detail is still sparse in public
      sources.
    diligencePath: Request board materials or a current governance chart during management diligence.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology coverage
    missingEvidence: >-
      A complete dated chronology covering every product launch, governance change, and adverse event across the full
      group history.
    whyItMatters: >-
      The milestone table is strong enough for report context, but private-company disclosures do not expose an
      exhaustive event log comparable to a public-company filing history.
    diligencePath: >-
      Request an internal corporate timeline or board materials to fill omitted launches, leadership changes, and
      adverse events.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: vnpay-som
    missingEvidence: >-
      VNPay GMV, take rate, segment revenue split, and contribution margin by QR, gateway, POS, and B2B software
      product.
    whyItMatters: >-
      Without company-specific monetization data, public TAM/SAM evidence can show market attractiveness but cannot
      quantify VNLIFE’s true SOM or unit economics.
    diligencePath: Request an internal revenue bridge and KPI dictionary from management or investors.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: market-boundary-mismatch
    missingEvidence: >-
      One reconciled taxonomy showing which public sources measure payment flow, provider revenue, wallet penetration,
      or broader fintech-sector value.
    whyItMatters: >-
      Public sizing estimates are directionally useful but can be badly misread when incompatible boundaries are
