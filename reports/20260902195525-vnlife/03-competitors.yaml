- id: incumbents-adjacents-pricing
  title: 'Incumbents and adjacents: bank apps, Apple Pay, and pricing posture'
  body: 'The most dangerous competitors are not necessarily the loudest fintech brands. Bank apps are steadily closing feature gaps and already offer the core behaviors many consumers need: transfers, QR payments, card management, savings, and high-trust account access inside one regulated interface. Fintech Singapore''s Decision Lab coverage shows exactly why this matters: bank-owned apps were already the third most-used digital-finance platforms in Q4 2024, and their preference scores were rising while independent fintech apps fell. Apple Pay adds a thinner but still meaningful substitute. Once NAPAS and partner banks turned on Apple Pay in April 2025, iPhone users could complete many in-store and in-app payment jobs without adopting another full wallet relationship. Public pricing posture sharpens the contrast. ZaloPay openly markets free transfers and payment transactions, Apple says it charges no consumer fee for Apple Pay, and bank transfers increasingly feel utility-like to users.
    In contrast, merchant-side pricing, gateway economics, and partner revenue shares remain mostly opaque on reviewed public pages across VNPAY and most wallet competitors. That opacity does not stop competition, but it does make it clear that public consumer pricing no longer differentiates the category very much.'
