  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: merchant-economics
    missingEvidence: VNPAY merchant pricing, gateway MDR/take rate, revenue-share splits with banks, and contribution margin by QR, POS, PhonePOS, gateway, and invoice products.
    whyItMatters: Public pricing surfaces are too thin to compare real unit economics against MoMo, ZaloPay, or bank substitutes.
    diligencePath: Request current merchant contracts, realized take-rate cohorts, and partner-bank revenue-share schedules.
    relatedQuestionRefs:
    - QP017
    - QP024
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Top-bank and top-merchant concentration, renewal terms, exclusivity, and routed-volume dependence for the VNPAY network.
    whyItMatters: Infrastructure-led durability depends on partner retention; consumer-share data cannot substitute for channel concentration analysis.
    diligencePath: Request top-10 partner concentration, renewal history, and churn by bank and merchant cohort.
    relatedQuestionRefs:
    - QP021
    - QP024
    relatedTableRefs:
    - TP004
    - TP005
  - type: conflicting-data
    severity: material
    topic: share-definition-mismatch
    missingEvidence: A reconciled dictionary for users, active users, weekly frequency, acceptance points, enterprise partners, and usage-penetration share across competitors.
    whyItMatters: Without metric harmonization, public comparisons can make one player appear stronger or weaker simply by changing denominators.
    diligencePath: Build a comparable KPI taxonomy before using public share figures in valuation work.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
    - TP005
  - type: enumeration-incomplete
    severity: minor
    topic: feature-matrix-unknown-cells
    missingEvidence: Verified public evidence for some competitor capabilities and pricing cells, especially Viettel Money merchant tools and private merchant-fee structures.
    whyItMatters: The matrix is directionally useful, but some cells remain unclear because reviewed sources emphasize marketing copy over detailed capability disclosure.
    diligencePath: Collect product docs, merchant decks, and direct demos from each named competitor before final investment underwriting.
