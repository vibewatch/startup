- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - MoMo
    - Direct peer / consumer super-app
    - 30M+ users; 50,000 businesses; 70+ banks and financial institutions; 300,000 acceptance points
    - Mass-market consumers, merchants, underserved finance users
    - AI-assisted financial app with broad consumer frequency and partner network
    - Promotion sensitivity and bank-app substitution remain material
  - - ZaloPay
    - Direct peer / social-payments rival
    - VND1.11T 2025 revenue; TPV +76%; active users +40%; backed by VNG / Zalo ecosystem
    - Consumers already inside Zalo, merchants, social-commerce users
    - In-chat payments, free transfers, Zalo distribution, visible security signaling
    - Fintech segment still loss-making and loyalty weaker than MoMo
  - - VNPAY / VNLIFE
    - Direct peer / infrastructure-led rival
    - US$300M in 2019 plus >US$250M in 2021; 350,000+ enterprise partners claimed; 30+ bank apps and 15 wallets on VNPAY-QR
    - Banks, merchants, public-service workflows, QR consumers
    - Bank-embedded QR, gateway, POS, PhonePOS, invoice, B2B, merchant stack
    - Less evidence of consumer habit-loop leadership than wallet-first peers
  - - Viettel Money
    - Direct peer / telco-finance ecosystem
    - Licensed intermediary payment provider; scale not quantified on fetched homepage
    - Telco users, payments, bills, broad consumer services
    - Telecom-backed ecosystem and licensed payment stack
    - Public-web evidence reviewed here gives weaker scale disclosure than MoMo or ZaloPay
  - - ShopeePay
    - Adjacent wallet / commerce specialist
    - Shopee ecosystem-linked; consumer scale not quantified on fetched homepage
    - Shopee shoppers, QR users, BNPL users
    - Commerce embedding, QR interoperability, SPayLater / voucher-led behavior
    - Stronger inside Shopee and partner consumption than as a universal finance destination
  - - Bank apps / VietQR cluster
    - Incumbent substitute
    - 34% digital-finance penetration and 26% primary-use preference in Q4 2024 for bank-owned apps
    - Salary-account users, deposits, everyday finance, SMEs
    - Primary account relationship, trust, deposits, loans, free transfer norms
    - Less promotional energy, but very strong economic position
  - - Apple Pay
    - Adjacent substitute / card overlay
    - Launched in Vietnam via NAPAS in April 2025; supported by multiple major banks and merchants
    - iPhone users with eligible cards
    - No Apple consumer fee, broad contactless acceptance, rides existing card credentials
    - Thin product scope versus full wallets or infrastructure platforms
  notes: Rows compare strategic role rather than a single like-for-like denominator. Public scale metrics are mixed across users, revenue, acceptance points, enterprise counts, and funding history.
