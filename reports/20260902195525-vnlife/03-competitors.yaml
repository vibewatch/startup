- id: direct-rival-profiles
  title: 'Direct rival profiles: MoMo, ZaloPay, Viettel Money, ShopeePay, and VNPAY overlap'
  body: 'MoMo remains the strongest consumer-brand rival because it has already repositioned from an e-wallet into a broader AI-assisted financial app. The Investor says MoMo serves more than 30 million users, works with more than 70 banks and financial institutions, and reaches 300,000 payment acceptance points, while the official homepage emphasizes AI, biometric onboarding, and top-level PCI DSS security. ZaloPay is smaller on public wallet-share metrics but has a distinct distribution advantage because it is embedded directly in Zalo chat, advertises free transfers and payments, and claims PCI DSS plus ISO 27001 certifications on its own site. Public 2025 reporting says ZaloPay reached VND1.11 trillion revenue, with 76% total-payment-volume growth and 40% active-user growth, even though VNG''s fintech segment stayed loss-making. Viettel Money and ShopeePay are narrower but strategically important: Viettel Money is a licensed intermediary-payments ecosystem with telecom reach, while ShopeePay
    combines QR payments, bills, and buy-now-pay-later behavior inside the Shopee commerce loop. VNPAY overlaps with all of them, but from a different angle. Its official site stresses bank-tech, gateway, QR, POS, PhonePOS, invoice, and B2B software, and it claims more than 350,000 enterprise partners plus VNPAY-QR inside 30-plus bank apps and 15 wallets. That reinforces the same conclusion reached in chapters 1 and 2: VNLIFE is a direct competitor in payment flows, but its closest durable analog is infrastructure-plus-distribution rather than pure wallet habit formation.'
