- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Bank-embedded distribution protects VNPAY from pure app-share swings
    - Bank apps may internalize more of the payment experience or reduce visible VNPAY brand power
    - medium
    - Infrastructure relevance can persist even if consumer app loyalty shifts, but economics could still compress
    - Request bank-partner contract renewal terms, exclusivity, and revenue-share changes
  - - Merchant acceptance footprint is a durable asset
    - QR interoperability commoditizes baseline acceptance
    - high
    - If acceptance is universal, value migrates toward software, reconciliation, and partner economics
    - Request attach rates for invoice, POS, PhonePOS, and B2B services
  - - Funding depth supports staying power
    - Large rivals also have strong capital backers or parent-company support
    - medium
    - MoMo, VNG/ZaloPay, and banks can keep investing through slow monetization periods
    - Benchmark VNLIFE capital allocation versus merchant-software expansion priorities
  - - VNPAY wins through infrastructure rather than promotions
    - Promotion-heavy competitors can still distort user and merchant behavior
    - medium
    - Wallet frequency and consumer preference can influence routing and merchant negotiation leverage
    - Measure volume share coming from bank-embedded flows versus direct-app traffic
  - - Banks are partners as well as channels
    - Banks are also substitutes with stronger balance-sheet economics
    - high
    - Partners may capture more value over time or reduce dependence on intermediary brands
    - Request top-bank concentration, churn history, and product ownership boundaries
  - - Contactless card overlays are only adjacent competitors
    - Apple Pay lowers incremental wallet need among affluent card users
    - medium
    - Premium urban users may skip an extra wallet if card acceptance is good enough
    - Split VNPAY exposure by QR versus card-adjacent acceptance and by merchant segment
  - - Category leadership can be inferred from public wallet rankings
    - Published share numbers reflect overlapping usage rather than exclusive control
    - high
    - False precision can misstate who truly controls economics or engagement
    - Preserve metric definitions and request company-side routed-volume data
  - - Independent wallets remain the primary threat set
    - The strongest long-term threat may be banks plus interoperable rails, not another standalone wallet
    - high
    - The market is maturing toward infrastructure and balance-sheet competition
    - Underwrite VNLIFE against bank-app and rail substitution scenarios, not wallet headlines alone
  notes: Severity reflects competitive durability risk to VNLIFE specifically, not generalized consumer brand popularity.
