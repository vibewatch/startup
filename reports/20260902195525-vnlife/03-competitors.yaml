callouts:
- calloutType: insight
  title: VNLIFE’s real threat set is broader than “other wallets”
  body: The public evidence says VNLIFE competes against wallets, but the structurally important substitutes are bank apps, interoperable QR rails, and card overlays that let users pay without adopting another dedicated wallet. That makes bank and merchant channel control more important than headline app downloads.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP019
  - CP035
  - CP040
- calloutType: risk
  title: Consumer loyalty is shallow even when brands are large
  body: MoMo’s category-leading weekly usage does not translate into exclusive control of payment behavior. Multi-homing, promotion arbitrage, and status-quo bank apps mean that consumer payment preference can move quickly when distribution or incentives shift.
  claimRefs:
  - CP024
  - CP025
  - CP026
  - CP032
- calloutType: strength
  title: Infrastructure positioning gives VNLIFE a different kind of durability
  body: Even if consumer wallet rankings fluctuate, bank-embedded QR, merchant acceptance, and enterprise payment tooling can keep VNLIFE relevant. That does not eliminate pricing pressure, but it means the company can survive market-share churn better than a pure app-first wallet.
  claimRefs:
  - CP015
  - CP016
  - CP034
  - CP037
  - CP040
