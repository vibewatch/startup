  topStrengths:
    - 银行内嵌分发是真实存在的：公开资料支持 40-45+ 家银行合作，加上广泛的 QR 和商户铺设。
    - 产品面不止消费钱包，还覆盖收单、网关、PhonePOS、eKYC、开票、税务和数字合同工作流。
    - GIC、SoftBank、General Atlantic、Dragoneer 和 PayPal Ventures 的历史背书降低了存续可信度风险，也支撑退出可选性。
    - 近期客户证据显示，2025-2026 年公司仍借助银行联动的 SME 和个体经营者项目继续落地。
  topRisks:
    - 当前公开估值支撑较薄：最新锚点是据报道 2025 年 9 月高于 US$1 billion 的股权出售讨论，并非已披露完成的融资。
    - 公开资料没有给出收入、抽成率、利润率、现金生成或合作伙伴集中度的审计桥接，基于可比公司的定价只能是近似值。
    - 监管收紧可能加固护城河，但仍会抬高开户摩擦、合规负担和运营成本风险。
    - 银行 App 竞争与渠道经济可能集中，限制了仅凭消费端规模支付溢价的意愿。
    - 资本结构和优先权条款仍不透明，账面估值未必能干净转化为普通股回报。
  unresolvedGaps:
    - 按产品线拆分的已审计净收入、毛利率、EBITDA 和现金流桥接。
    - 头部银行和头部商户集中度、活跃队列留存，以及税务、发票、合同模块的附加率。
    - 当前股权结构、清算优先权、投资者权利，以及任何债务或高级索取权。
    - 新电子钱包和记账规则对开户转化、欺诈和合规成本的量化影响。
    - 合规驱动的 SME 和个体经营者队列在补贴或铺设促销退潮后仍有价值的证据。
