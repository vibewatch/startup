- id: mitigation-kill-criteria
  title: Mitigations, kill criteria, and residual risk
  body: 'There are enough mitigants to avoid a bearish conclusion. VNPAY has real scale, real bank relationships, visible control investment, and timely exposure to SME and household-business digitalization. Those facts lower the chance that the business is fragile in a trivial sense. But mitigants are not the same as clearance. Residual risk remains material because several core questions cannot be answered from public evidence alone: live concentration, treasury position, merchant retention, fraud-loss levels, service reliability, and post-subsidy cohort quality. A disciplined investment process should therefore define explicit thesis-break triggers. If new regulation materially raises onboarding friction, if a top bank partner weakens support, if activation of tax-led cohorts stalls, or if technical due diligence surfaces weak runtime controls, the call should worsen quickly. Conversely, if management can prove diversified partner economics, strong active cohorts, and stable security
    operations, the risk rating can move down. Until then, VNLIFE should be treated as a scaled but still diligence-sensitive platform with medium-high residual risk.'
