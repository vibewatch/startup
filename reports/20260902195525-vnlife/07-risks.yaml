- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory tightening
    - New SBV rule materially increases onboarding burden or narrows service scope
    - Biometric / licensing changes degrade conversion or require major product redesign
    - Downgrade growth confidence and raise risk rating
  - - Bank concentration
    - Loss, downgrade, or economic renegotiation with a top partner bank
    - Top-partner contribution proves outsized or one partner weakens support materially
    - Treat concentration as thesis-break unless replaced quickly
  - - Runtime reliability
    - Private diligence shows weak uptime, reconciliation, or incident discipline
    - Repeated severe incidents, poor MTTR, or missing controls
    - Pause investment or require valuation discount and remediation plan
  - - Subsidy conversion
    - 2026-2028 acquisition cohorts do not retain or attach after promotional periods
    - Activation or paid attach materially below management plan
    - Cut merchant-LTV assumptions and re-rate valuation
  - - Security / fraud
    - Fraud-loss trend or security findings exceed internal thresholds
    - Weak device security, poor biometric governance, or material breach
    - Escalate to major red flag
  - - Disclosure quality
    - Management cannot provide partner mix, cohort retention, or cash data under NDA
    - Core KPI dictionary remains inconsistent or unavailable
    - Keep recommendation capped at research-more / cautious track
  notes: Kill criteria are designed to be observable in diligence or early post-investment monitoring, not abstract concerns.
