- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Gross merchandise volume (GMV)
    - Not publicly disclosed
    - Low
    - Without GMV, payment scale cannot be converted into revenue or take rate
    - Request GMV by QR, gateway, POS, PhonePOS, and B2B
  - - Blended net take rate
    - Not publicly disclosed
    - Low
    - QR MDR is gross and shared; net economics may differ materially by channel
    - Provide gross MDR, issuer share, rebates, and net take rate by cohort
  - - Revenue mix by stream
    - Not publicly disclosed
    - Low
    - The business is multi-stream, so total revenue alone would still be insufficient
    - Share revenue split across software, payments, and partner commissions
  - - Gross margin by product line
    - Not publicly disclosed
    - Low
    - Needed to distinguish software economics from transaction pass-through lines
    - Provide gross margin bridge by line and by partner type
  - - CAC and payback
    - Not publicly disclosed
    - Low
    - Subsidy programs suggest acquisition spend, but efficiency is unknown
    - Show merchant acquisition cost, payback, and retention by segment
  - - Merchant churn / retention
    - Not publicly disclosed
    - Low
    - Infrastructure businesses can look large but still have weak cohort quality
    - Provide annual logo churn, TPV retention, and bank renewal rates
  - - Active device utilization
    - No public device-utilization figures found
    - Low
    - Critical for SmartPOS / PhonePOS profitability and subsidy recovery
    - Report active devices, transactions per device, and payback period
  - - Working-capital or credit-loss load
    - No meaningful public exposure disclosed
    - Medium-low
    - If VNPAY mainly orchestrates rather than lends, capital intensity is lower
    - Clarify any balance-sheet credit risk, reserves, or receivable financing
  notes: The table intentionally leaves core unit-economics fields blank where public disclosure is absent; each blank is paired with a concrete diligence request.
