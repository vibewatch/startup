  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-gmv-bridge
    missingEvidence: Consolidated revenue, GMV/TPV by product line, and net take rate after issuer sharing or rebates.
    whyItMatters: Without these, public scale metrics cannot be translated into revenue quality or valuation inputs.
    diligencePath: Request audited management accounts and a product-level revenue bridge from TPV to net revenue.
    relatedQuestionRefs:
    - QI012
    - QI024
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-runway
    missingEvidence: Cash balance, monthly burn or cash generation, debt facilities, and board-approved financing plan.
    whyItMatters: Historical fundraising alone does not establish current capital adequacy.
    diligencePath: Obtain latest treasury report, debt schedule, and 12–24 month liquidity forecast.
    relatedQuestionRefs:
    - QI016
    - QI017
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: CAC, payback, cohort retention, device utilization, gross margin by line, and active merchant / bank concentration.
    whyItMatters: Subsidized onboarding can look attractive until retention and margin data are tested.
    diligencePath: Request cohort retention and unit-economics dashboards by SME, enterprise, and bank-partner segment.
    relatedQuestionRefs:
    - QI013
    - QI022
    - QI024
    relatedTableRefs:
    - TI002
    - TI003
    - TI005
  - type: conflicting-data
    severity: minor
    topic: scale-denominators
    missingEvidence: A reconciled KPI dictionary for customers, consumers, merchants, enterprises, acceptance points, and wallet users.
    whyItMatters: Different scale labels can distort both revenue-per-user and channel-density interpretations.
    diligencePath: Normalize all public and management-reported scale metrics to one glossary before financial modeling.
