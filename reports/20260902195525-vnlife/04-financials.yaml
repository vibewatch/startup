company:
  name: VNLIFE
chapter:
  number: 4
  title: Financials
  summary: 'VNLIFE’s public financial story is much stronger on revenue architecture than on reported outcomes. Official and quasi-official materials show a diversified monetization stack across bank software, eKYC and biometrics, merchant QR and gateway MDR, POS and PhonePOS, e-invoicing, digital signatures, B2B payments, and commission-bearing distribution services. The problem is disclosure depth: public-web materials do not yield a reliable consolidated revenue, GMV, margin, cash, burn, or take-rate bridge. Funding history is clear at roughly US$550 million raised and a 2025 secondary valuation signal above US$1 billion, but those datapoints support capital depth rather than a full underwriting model.'
sections:
- id: revenue-architecture
  title: Revenue architecture and monetization routes
  body: 'The best public evidence on VNLIFE’s financial model comes from its product surfaces and the 2025 Vietcap profile rather than from audited public accounts. Those materials show a business with several monetization lanes: software fees from omni-channel banking sold to banks, per-account or per-authentication economics from eKYC and biometric products, commission-bearing distribution services, merchant discount rates on QR payments, gateway-style processing economics for cards and app-call-app checkout, rental or transaction-linked economics in POS and PhonePOS, invoice and tax software packages, digital-signature SaaS, and B2B payment rails. This matters because it changes the way the company should be underwritten. VNLIFE is not just a QR-payment logo sitting on top of bank apps. It is a layered payments-and-software platform where some lines look transaction-linked, some look SaaS-like, and some look rev-share based. The strongest implication is positive: diversified monetization
    architecture reduces dependence on any single wallet behavior. The main caution is that public sources reveal list mechanics and product logic much more clearly than they reveal realized revenue contribution by stream.'
