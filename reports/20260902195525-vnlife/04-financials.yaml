    - Digital contract, remote signing, business payments, bank-linked workflows
    - Adoption and renewal rates undisclosed
    - Vietcap + VIB/Visa/VNPAY materials
  notes: Pricing evidence mixes historical public examples, current promotional bundles, and contract-based products. Public price cards should not be mistaken for realized effective rates.
