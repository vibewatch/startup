tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Omni-channel banking software
    - Bank software sold on active paying users or fixed fee / revenue share
    - Per active user per month or fee/account/month
    - Visible in Vietcap 2025 profile; no public stream revenue disclosed
    - Medium
    - Request MAU-paying-bank cohort counts, realized ARPA per bank, and contract tenure
  - - eKYC / biometrics
    - Authentication, account, or verification-linked fees
    - Per authentication or account
    - Visible in Vietcap profile and official product narrative
    - Medium
    - Request volume, price per verification, false-positive cost, and gross margin
  - - Distribution services
    - Commission-bearing B2B2C / B2C services across merchant SDKs
    - Commission / rev share
    - 20,000+ merchants and 26 SDKs cited in Vietcap; no revenue split disclosed
    - Medium
    - Break revenue by mobile top-up, bills, travel, commerce, and partner category
  - - QR payments
    - Merchant MDR shared with issuing side
    - MDR on transaction value
    - Explicitly described in Vietcap and QR page; realized net take rate unknown
    - Medium
    - Provide gross MDR, issuer share, and net take rate by merchant cohort
  - - Payment gateway
    - Card, QR, installment, payment-link, tokenization, and app-call-app processing
    - Merchant / transaction fees
    - Clearly visible product, but no public fee card or revenue amount
    - Medium
    - Show gateway TPV, authorization rates, chargebacks, and enterprise fee bands
  - - POS / PhonePOS
    - Machine rental, transaction fees, and merchant software attach
    - Monthly rent and / or per transaction
    - Historical price examples and current free-setup model visible
    - Medium
    - Provide active devices, device utilization, and contribution margin by form factor
  - - Invoice, tax, contracts, signatures, B2B
    - Per invoice/package, SaaS, partner rev share, workflow attach
    - Package fee / SaaS / transaction
    - Products clearly visible and increasingly bundled into SME packages
    - Medium
    - Break software ARR or recurring revenue by invoice, TVAN, VNeDOC, CA, and B2B
  notes: Public sources show monetization mechanisms more clearly than realized stream revenue. The table therefore distinguishes visible pricing logic from undisclosed financial outcomes.
