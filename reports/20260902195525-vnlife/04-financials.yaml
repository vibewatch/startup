    - VNPAY POS page
  - - VNPAY-POS free-use threshold (historical)
    - Free machine fee above VND30,000,000 volume per machine per month; fee waiver above VND275,000 payment-fee threshold
    - Historical promotional / threshold pricing
    - Encourages throughput and merchant stickiness
    - Not a current universal fee schedule
    - VNPAY POS page
  - - PhonePOS
    - Setup and app installation free; merchants pay discounted transaction fee per order
    - Current public onboarding language
    - Tap-to-pay on Android NFC, reporting, merchant app, card-wallet acceptance
    - Exact MDR / discount rate not posted publicly
    - PhonePOS official pages
  - - QR payment gateway
    - Contract-based MDR / gateway economics implied, not publicly posted
    - Realized pricing opaque
    - QR billing, bank-app payments, cards, app-call-app, settlement tools
    - Gross-to-net fee bridge undisclosed
    - VNPAY QR page + Vietcap
  - - Tax-filing / merchant software bundle
    - Free usage support through end-2028 for eligible business households
    - Promotional / subsidized package
    - Sales software, tax declaration, invoice, cloud storage, digital signature, TVAN
    - Sustainability of subsidy and post-2028 pricing unknown
    - VNPAY tax page + Sacombank/VNPAY
  - - Invoice services
    - Per invoice / package with bundling discount
    - Visible list logic, realized prices not disclosed
    - E-invoice, storage, transmission, compliance workflow
    - Package terms by segment undisclosed
    - Vietcap + tax page
  - - Digital signature / VNeDOC / B2B
    - SaaS fee and partner sharing model
