- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Consolidated revenue and segment revenue mix
    - Cannot judge whether software or payments drives the P&L
    - Request audited management accounts with quarterly segment bridge
  - - GMV / TPV by product line
    - Cannot translate network scale into revenue opportunity
    - Request GMV by QR, gateway, POS, PhonePOS, and B2B
  - - Net take rate after issuer sharing and rebates
    - Cannot compare unit economics with other processors or wallets
    - Provide gross MDR, bank share, rebates, promotions, and net revenue by channel
  - - Gross margin by stream
    - Cannot test whether software lines improve blended economics
    - Request stream-level COGS and gross margin bridge
  - - Merchant / bank retention and concentration
    - Cannot know if distribution is diversified or fragile
    - Provide top-10 partner concentration, renewal rates, and TPV retention
  - - CAC, payback, and subsidy recovery
    - Cannot assess whether free bundles create profitable cohorts
    - Report acquisition cost and payback by SME, enterprise, and household-business segment
  - - Cash balance, burn, and runway
    - Cannot assess current financing dependency
    - Provide latest liquidity report and 12–24 month planning model
  - - Profitability status and EBITDA / operating cash flow
    - Cannot distinguish growth from self-funded scale
    - Share EBITDA, adjusted EBITDA, and cash-flow statements with reconciliation
  notes: These are the minimum private metrics required before using public market or valuation heuristics with confidence.
