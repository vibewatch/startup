callouts:
- calloutType: insight
  title: The business model is visible even when the P&L is not
  body: Public materials are unusually rich on how VNLIFE charges banks, merchants, and SMEs, but unusually thin on what those charges add up to in consolidated revenue or margin terms. That means the diligence challenge is disclosure depth, not business-model absence.
  claimRefs:
  - CI001
  - CI004
  - CI006
  - CI007
  - CI021
  - CI039
- calloutType: risk
  title: Subsidies may help acquisition while obscuring near-term economics
  body: Free setup, fee waivers, and multi-year free software support can accelerate SME adoption, but they also make it difficult to infer realized pricing, margin, and payback from public list examples alone.
  claimRefs:
  - CI010
  - CI011
  - CI013
  - CI014
  - CI034
- calloutType: strength
  title: VNLIFE appears less capital-intensive than a lender-first fintech
  body: Because much of the platform monetizes software, bank distribution, and merchant processing rather than warehousing credit, VNLIFE likely needs less balance-sheet capital than fintechs carrying loans directly. The remaining question is not theoretical model viability but current cash generation and margin quality.
  claimRefs:
  - CI029
  - CI030
  - CI031
  - CI037
