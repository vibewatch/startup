callouts:
  - calloutType: risk
    title: Highest-priority thesis-break test
    body: >-
      Treat a sustained combination of weakening market conversion, rising installation defects, and constrained financing capacity as a thesis-break signal; the public record does not support numeric thresholds.
    claimRefs: [CR003, CR004, CR006, CR007, CR014]
  - calloutType: recommendation
    title: Required pre-investment evidence
    body: >-
      Require audited market-level operating cohorts, certification coverage, complaint and warranty files, financing performance, factory utilization, unrestricted cash, and burn before underwriting the current scale plan.
    claimRefs: [CR001, CR002, CR008, CR009, CR012, CR014, CR015, CR016]
