company:
  name: Aira
chapter:
  number: 7
  title: Risks
  summary: >-
    Aira's highest residual risks are installation quality, policy-sensitive demand, and the capital and coordination burden created by a vertically integrated model. UK policy supports adoption, but European sales volatility, customer-reported defects, long-duration financing, and undisclosed operating denominators make the risk case dependent on primary diligence rather than public growth claims.
sections:
  - id: regulatory-and-demand
    title: Regulatory, legal, and demand exposure
    body: >-
      UK policy is supportive but creates a specific compliance dependency. The government set the Clean Heat Market Mechanism Year 2 heat-pump target at 8% and made MCS the sole certification scheme, so installer certification and scheme continuity are operating inputs rather than background policy. Demand is not uniformly improving across Aira's footprint: a trade publication reported that sales across 13 European countries fell 23% in 2024, with Germany down 48% while the UK rose 63% under supportive schemes. That divergence raises the likelihood of uneven factory and installer utilization. Customer allegations concerning material installation changes and threatened money-claim proceedings add consumer-protection exposure, but the assigned evidence does not establish the volume, outcome, or legal status of such disputes.
    claimRefs: [CR001, CR002, CR003, CR004, CR008]
    tableRefs: [TR001]
  - id: operational-quality-and-service
    title: Operational quality and service reliability
    body: >-
      Aira must scale a labor-intensive installation and service system without allowing speed to degrade workmanship. Fortune identified skilled-installer scarcity and reports of botched heat-pump installations that raised energy bills, while 2026 customer reviews describe both serious installation disruption and an unresolved commissioning fault. These anecdotes are useful failure-mode evidence, not an incident-rate denominator. Aira-issued job reposts show that the company is recruiting for safe installation delivery and for software used by customers and installers, indicating active mitigations but also two coupled dependencies: field execution and application availability. Public sources do not disclose first-time-right installation rates, repeat visits, mean time to repair, warranty losses, safety incidents, or software-service levels.
    claimRefs: [CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
  - id: integration-financing-and-capital
    title: Integration, financing, and capital dependencies
    body: >-
      Vertical integration is both Aira's control mechanism and its principal concentration risk. Kinnevik describes a chain spanning production, acquisition, installation, logistics, financing, and energy management; a syndicated 2024 company release added a 220,000-square-metre Polish facility and 11 regional sales and installation hubs. The model therefore concentrates manufacturing utilization, working capital, installer productivity, credit performance, and aftercare inside the same growth plan. Fortune reported Aira's statement that about 75% of Italian installations used monthly payments, increasing sensitivity to financing availability and portfolio performance. Historical and current funding figures show substantial capital access, but funding raised is not cash available, and the public evidence does not disclose burn, runway, financing losses, or committed future capital.
    claimRefs: [CR011, CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
  - id: residual-risk-and-triggers
    title: Residual risk, monitoring, and thesis-break triggers
    body: >-
      The risk ranking remains high where demand, quality, and financing can reinforce one another. A policy or energy-price shock could reduce orders while leaving manufacturing and regional capacity underused; rushed installation growth could then increase remediation costs and weaken referrals; tighter consumer-finance capacity could further reduce conversion. The investable monitoring set is therefore operational rather than promotional: certified-installer capacity, installation defects, repeat visits, warranty cost, complaint escalation, software availability, market-level conversion, financing approval and loss rates, factory utilization, unrestricted cash, and monthly burn. Thesis-break triggers are a sustained deterioration in two or more of these indicators, loss of required certification, or inability to fund service obligations. Numeric thresholds require management data and should not be invented from the public record.
    claimRefs: [CR002, CR003, CR005, CR007, CR008, CR009, CR011, CR012, CR014, CR016]
    figureRefs: [FR001]
