      - ["Manufacturing and regional capacity", "Polish facility and 11 reported sales and installation hubs", "A major facility and regional hub network require utilization", "Demand slowdown leaves fixed assets and labor underused", "High", "Three-country footprint diversifies local demand", "High while utilization and break-even levels are undisclosed"]
      - ["Consumer financing", "Aira and undisclosed financing providers", "About 75% of Italian installations were reportedly financed through monthly plans in 2024", "Funding cost, approval, or credit losses weaken conversion and contribution margin", "High", "Monthly payments reduce the customer's upfront cost", "High without lender concentration, loss curves, and recourse terms"]
