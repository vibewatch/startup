company:
  name: Aira
chapter:
  number: 3
  title: Competitors
  summary: >-
    Aira competes as a vertically integrated home-electrification platform rather than as a
    stand-alone heat-pump manufacturer. Its long warranty, direct installation model and broad
    home-energy proposition are meaningful differentiators, but Octopus undercuts it on subsidized
    installed price while established OEMs offer wider product ranges and longer operating histories.
sections:
  - id: competitive-landscape
    title: The buyer can choose platforms, incumbent OEMs, or fragmented delivery
    body: >-
      Aira's closest strategic peer is Octopus Energy's Cosy system: both combine proprietary
      equipment, installation, controls and an ongoing service relationship, although Octopus also
      controls the retail-energy tariff. Established manufacturers such as Vaillant, Daikin and
      Mitsubishi compete through installer ecosystems, broader output ranges and brand history,
      while local installers can assemble third-party equipment without committing the household to
      one integrated platform. The comparison set therefore extends beyond heat-pump specifications
      to financing, survey quality, installation capacity, aftercare and energy optimization.
      Independent comparison evidence also names Bosch, Ideal, Grant, Samsung, LG, Viessmann and
      other brands, so this chapter's profile table is a representative rather than exhaustive
      landscape.
    claimRefs: [CP001, CP003, CP004, CP005, CP006, CP010, CP011]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-moat
    title: Integration improves control but does not eliminate product substitution
    body: >-
      Aira controls more of the customer journey than a conventional manufacturer: investor and
      third-party descriptions cover proprietary manufacturing, direct sales, installation,
      financing or subscriptions, software and an expanding home-energy system. That architecture
      can tighten feedback loops and make a single warranty more valuable, but the hardware itself
      remains comparable on familiar dimensions such as output, flow temperature, efficiency and
      refrigerant. The strongest visible moat is therefore execution across the system, not an
      independently proven technical monopoly. Octopus has a similarly integrated system plus tariff
      distribution, while incumbent OEMs can counter with broader size ranges and established
      installer familiarity.
    claimRefs: [CP001, CP002, CP006, CP009, CP010, CP014, CP015, CP016]
    tableRefs: [TP002]
  - id: pricing-and-distribution
    title: Upfront affordability and installer capacity shape competitive conversion
    body: >-
      Public list-price comparisons point to a material affordability challenge. Dwellow reports an
      Aira package at about £14,000 before the £7,500 Boiler Upgrade Scheme grant and about £6,500
      after it, excluding possible radiator upgrades. EE Renewables reports a typical Cosy 6
      installation at £3,818 after the same grant, while The Eco Experts reports Octopus systems from
      £4,300 including standard installation. These are not realized transaction prices and the
      package boundaries differ, but they indicate that Aira asks buyers to value warranty and
      integration over the lowest subsidized entry price. Installer availability is another
      constraint: Aira's chief executive told Reuters that trained labor was a major operational
      bottleneck.
    claimRefs: [CP006, CP007, CP008, CP012]
    tableRefs: [TP003]
  - id: durability-and-disconfirming-evidence
    title: The service layer is both differentiation and the principal execution risk
    body: >-
      Aira's 15-year product-and-installation coverage is unusually long, and one independent
      comparison ranked the product best for quality. Yet the same end-to-end responsibility that
      supports differentiation concentrates installation and aftercare failures on Aira's brand.
      The reviewed Trustpilot page contains praise for responsive engineers alongside complaints
      about repeated visits, incomplete or unsafe-looking work, unresolved faults and weak
      communication. These anecdotes do not establish an incident rate, but they disconfirm any
      assumption that vertical integration guarantees consistent delivery. Aira is also young, so
      independent evidence of fleet durability across a full warranty cycle is unavailable. Chinese
      equipment competition and a market that contracted in 2023 further limit confidence that
      manufacturing scale alone will protect pricing.
    claimRefs: [CP009, CP011, CP013, CP014, CP016]
