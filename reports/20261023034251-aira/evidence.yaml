evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-count
    missingEvidence: Current paying-customer count, installed-system count, churn, renewal, and cohort retention.
    whyItMatters: >-
      Customer scale and retention are necessary to test whether sales run-rate translates into durable installed-base
      economics.
    diligencePath: >-
      Request monthly installations, active customers, cancellations, warranty cohorts, and retention by market from
      management.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete current board, executive committee, committee mandates, voting rights, and succession plan.
    whyItMatters: Public leadership reporting does not establish governance control or depth below the chief executive.
    diligencePath: >-
      Obtain the latest corporate registry extract, board pack, organization chart, shareholder agreement, and
      reserved-matters schedule.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: total-funding
    missingEvidence: >-
      A primary financing schedule reconciling equity, debt, extensions, currency conversion, and duplicate round
      records.
    whyItMatters: >-
      Published total-raised figures differ by more than $450 million and cannot support a reliable capital-efficiency
      assessment.
    diligencePath: >-
      Reconcile bank statements, subscription agreements, debt facilities, cap-table movements, and cash proceeds by
      close date.
    relatedQuestionRefs:
      - QO004
      - QO008
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: Latest priced-round pre-money and post-money valuation, security terms, and fully diluted share count.
    whyItMatters: >-
      Aggregator figures of $1.2 billion and $2 billion are not interchangeable and lack retained primary transaction
      support.
    diligencePath: Obtain the latest term sheet, closing documents, cap table, and option-pool treatment.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-map
    missingEvidence: >-
      Current ownership percentages, security classes, board seats, preferences, and pro-rata or veto rights for all
      holders.
    whyItMatters: Named financing participation does not establish present control, economic seniority, or follow-on capacity.
    diligencePath: Request a fully diluted cap table and investor-rights matrix reconciled to each financing close.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Country-level eligible retrofit households, annual replacement volume, subsidy eligibility, and Aira revenue per
      installation.
    whyItMatters: >-
      Without these inputs, the broad European market forecasts cannot be converted into a defensible serviceable market
