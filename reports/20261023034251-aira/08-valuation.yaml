company:
  name: Aira
chapter:
  number: 8
  title: Valuation
  summary: Aira has material scale-up evidence, including a reported EUR200 million annual sales run-rate, EUR150 million of fresh equity in 2025, and a vertically integrated operating build-out. Public evidence does not establish current post-money valuation, margins, cash runway, or customer retention, so the appropriate stance is track rather than a price-insensitive buy.
sections:
  - id: decision
    title: Investment decision and price discipline
    body: >-
      The evidence supports a credible scale-up thesis but not a fully underwritten
      valuation. A company announcement syndicated by EU-Startups says Aira raised
      EUR150 million in 2025 and reported a EUR200 million annual sales run-rate,
      while the same account says
      the company employed 1,200 people and had opened 18 hubs and four academies.
      Multiples records earlier equity rounds, including EUR145 million in January
      2024 and a EUR63 million extension in October 2024, and describes a direct-to-
      consumer subscription model with manufacturing, installation, and energy
      services. These are useful scale and financing signals, but they are not
      equivalent to audited revenue, ARR, gross margin, free cash flow, or a current
      priced-round valuation. The recommendation is therefore track: invest only
      after receiving current cap-table terms, preference rights, cash runway,
      contribution margin by installation, and retention evidence. Aira's scale,
      investor base, and integrated model are strengths; the missing denominator
      data makes any precise entry multiple speculative.
    claimRefs: [CV001, CV002, CV003, CV004, CV005]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Thesis versus anti-thesis
    body: >-
      The positive thesis is that Aira can turn a fragmented residential heating
      purchase into a repeatable electrification platform: monthly payments reduce
      upfront friction, the company controls product and installation execution,
      and a Polish factory is planned for up to 500,000 heat pumps per year. The
      anti-thesis is that this model combines hardware, field labor, financing,
      inventory, and policy exposure, so scale can increase capital needs before
      unit economics mature. The market backdrop is also cyclical: the European
      Heat Pump Association reports that sales fell 21% in 14 European countries
      in 2024, citing changed support schemes, weak economic conditions, and
      subsidized gas prices. Customer reviews are mixed rather than uniformly
      confirming economics: many describe professional installations, while one
      review alleges unresolved aftercare and another reports electricity costs
      of EUR8 to EUR10 per day during cold weather. These signals do not prove
      systemic failure, but they make conversion, installation quality, running
      costs, and churn central valuation diligence items.
    claimRefs: [CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenarios, comparables, and exit readiness
    body: >-
      A defensible scenario framework must use ranges and explicit gates rather
      than a point estimate. The bull case requires sustained sales growth,
      improving installation contribution margin, low cancellation and service
      costs, and financing capacity that does not force a down round. The base
      case assumes continued geographic expansion but a slower heat-pump market,
      with valuation supported only if management supplies audited revenue quality,
      margin progression, and runway. The bear case combines policy or demand
      weakness with high field-service costs, customer dissatisfaction, and
      additional dilution; the 2024 market contraction and reported customer
      cost complaints are observable downside signals, not probabilities. Public
      comparable evidence is thin: Multiples lists Aira alongside companies with
      materially different business models and reports no Aira revenue multiple,
      while Accumeo shows locked share-issuance records with post-money valuations
      of SEK9.28 billion and SEK9.82 billion for two 2025 entries but does not
      disclose the associated amount raised. The scenario bands below use those
      observed marks as decision boundaries, not intrinsic-value estimates. Exit
      readiness depends on proving
      recurring service economics, repeatable installations, and transparent
      financing terms.
    claimRefs: [CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: diligence
    title: Diligence asks and thesis-break triggers
    body: >-
      The next diligence step is a price-and-evidence package, not another market-
      size narrative. Management should provide monthly cohorts by country,
      cancellation and renewal data, installation gross margin, warranty and
      service reserves, customer acquisition cost, cash balance, burn, debt
      covenants, and the fully diluted cap table with liquidation preferences.
      Investors should reconcile the reported sales run-rate with recognized
      revenue and distinguish subscription receipts from hardware or installation
      revenue. They should also test whether the factory investment and 500,000-
      unit capacity are demand-backed or primarily fixed-cost exposure. A thesis
      break occurs if current financing implies a materially higher value without
      corresponding margin or retention proof, if cash runway requires a down
      round, if policy changes reduce conversion, or if complaint and service data
      show persistent cost or reliability problems. Until those tests are passed,
      the evidence supports tracking Aira and negotiating downside protection rather
      than paying for an unverified platform premium.
    claimRefs: [CV004, CV008, CV009, CV010, CV012, CV014]
    calloutType: recommendation
