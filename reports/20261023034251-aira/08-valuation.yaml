callouts:
  - calloutType: risk
    title: Do not confuse financing with value creation
    body: "Aira's disclosed equity and factory plans demonstrate investor support and capacity ambition, but they do not establish ARR, gross margin, cash runway, or a current post-money valuation."
    claimRefs: [CV001, CV003, CV011, CV013]
  - calloutType: recommendation
    title: Evidence-sensitive entry discipline
    body: "Track the company and require a current cap table, preference stack, cohort economics, and runway before underwriting a platform premium."
    claimRefs: [CV011, CV012, CV014]
