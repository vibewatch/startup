              - CO005
              - CO006
              - CO007
      - number: '1.4'
        title: Milestones and risk signals
        blocks:
          - type: paragraph
            body: >-
              Aira progressed from its 2022 formation and 2023 commercial launch through multiple financing rounds, a
              chief-executive transition, and a November 2025 expansion into residential batteries and inverters. The
              sequence supports a whole-home-energy ambition rather than a single-product installer thesis. Execution
              risk remains visible at the service layer: a September 2026 Trustpilot sample contains complaints alleging
              poor installation quality, unresolved faults, weak aftercare, and escalation toward legal action,
              alongside many favorable service reviews. Those reviews are not a representative incident rate, but they
              show that vertical integration transfers installation and support quality directly onto Aira's brand.
              Current customer count, retention, complaint incidence, and independently verified installation volumes
              remain material diligence gaps.
