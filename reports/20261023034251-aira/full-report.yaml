  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and demand context
        blocks:
          - type: paragraph
            body: >-
              The relevant core market is European residential heating replacement and retrofit: air-source heat-pump
              equipment, installation, financing, service, and associated controls. It excludes commercial and
              industrial heating, standalone electricity generation, and the entire value of every adjacent home-energy
              product unless a household buys those products as part of the same heating transition. This boundary
              matters because Aira's vertically integrated offering can capture installation and financing value, but
              cannot be credited with the whole decarbonization economy. Global Market Insights estimates the European
              residential heat-pump market at USD 11.2 billion in 2025 and identifies high initial deployment cost as a
              challenge. The European Heat Pump Association's country statistics show materially different adoption
              intensity: France sold 528,000 units and Italy 423,000 in 2025, while Norway led sales per 1,000
              households. Those differences imply that country-level policy, building stock, climate, and installer
              availability are material market variables rather than noise.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM010
              - CM013
      - number: '2.2'
        title: Sizing lenses and what they do not prove
        blocks:
          - type: paragraph
            body: >-
              The sizing evidence supports a large core market, but the lenses are not interchangeable. Global Market
              Insights reports USD 11.2 billion for 2025 and forecasts USD 71.2 billion by 2035 at a 20.3% CAGR; its
              2026 starting estimate is USD 13.4 billion. A separate GII Research page repeats the USD 11.2 billion 2025
              base and the USD 71.2 billion 2035 forecast. The agreement is useful corroboration of the direction and
              scale, not proof that the estimates are independent because the pages may share underlying research.
              Aira's investor materials and releases use broader framing: Aira has stated that the European heat-pump
              market could exceed EUR 150 billion by 2030. That company-issued figure uses a different currency, year,
              and possibly a different scope, so it should not be combined with the residential analyst series into a
              single TAM. Within the GMI series, air-source systems represented 95.2% of 2025 market value,
              single-family housing represented USD 6.6 billion, and Germany represented USD 1.9 billion. These are
              useful segment lenses, but they do not establish Aira's serviceable or obtainable share. DealMatrix
              supplies a valuation lens rather than a market size: its illustrative CleanTech benchmark was about 3.8x
              EV/Sales as of 30 June 2025, while current quarterly data was unavailable on the reviewed page.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer segmentation, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is usually a homeowner or household decision-maker, while the user is the household and
              the payer may be the household directly or a financing provider under a monthly plan. The workflow is a
              high-consideration retrofit: diagnosis, system choice, financing, installation, commissioning, and ongoing
              service. Aira's investor Kinnevik describes personalized guidance, installation within four weeks, an
              all-inclusive monthly payment plan, and a 15-year Comfort Guarantee; those are adoption mechanisms, not
              independently verified conversion or retention metrics. The strongest external drivers are replacement of
              fossil heating, energy-cost pressure, subsidies and rebates, building-efficiency rules, and technology
              improvements. GMI identifies regulation, financial schemes, retrofit activity, and energy costs as
              drivers, while also flagging high initial deployment costs. Aira's company-issued release says 130 million
              boilers remain in Europe, but that stock is not an annual sales forecast. Installer capacity is a second
              bottleneck: a reposted Aira installer vacancy explicitly seeks adjacent boiler and heating-system
              experience, indicating that workforce conversion is part of the adoption path. Customer reviews add
              execution risk rather than prevalence evidence. The retained Trustpilot page contains both positive
              service accounts and reports of repeated visits, unfinished or unsafe work, and unresolved aftercare
              faults. Those anecdotes cannot measure failure rates, but they show why installation quality and service
              capacity belong in the market-adoption model.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: Market diligence implications
        blocks:
          - type: paragraph
            body: >-
              The market case is attractive but evidence-constrained. The available sources support equipment-market
              growth and a structural replacement need, but do not isolate Aira's serviceable market by country,
              eligible housing stock, subsidy eligibility, conversion rate, installation gross margin, financing loss
              rate, or recurring service revenue. Nor do they resolve the scope difference between a heat-pump equipment
              market, a full installed-system market, and a broad home electrification wallet. The next diligence step
              is a country-by-country build from installed fossil boilers, retrofit eligibility, annual replacement
              volume, subsidy rules, installer throughput, and Aira's realized revenue per installation. Until that
              bridge is available, the market supports a positive adoption thesis but not a precise SOM or a valuation
              premium over comparable CleanTech revenue.
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Large core market, narrower monetizable wedge
            body: >-
              The independent market estimates support strong heat-pump demand, but Aira's monetizable opportunity is
              the share of eligible retrofit households it can acquire, finance, install, and service at acceptable unit
              economics.
            calloutType: insight
            claimRefs:
              - CM003
              - CM016
          - type: callout
            title: Country and policy heterogeneity
            body: >-
              Adoption intensity, subsidies, building stock, and installer supply differ materially across Europe; a
              pan-European headline TAM is therefore a weak substitute for country-level serviceable-market work.
            calloutType: risk
            claimRefs:
              - CM002
              - CM011
              - CM014
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The buyer can choose platforms, incumbent OEMs, or fragmented delivery
        blocks:
          - type: paragraph
            body: >-
              Aira's closest strategic peer is Octopus Energy's Cosy system: both combine proprietary equipment,
              installation, controls and an ongoing service relationship, although Octopus also controls the
              retail-energy tariff. Established manufacturers such as Vaillant, Daikin and Mitsubishi compete through
              installer ecosystems, broader output ranges and brand history, while local installers can assemble
              third-party equipment without committing the household to one integrated platform. The comparison set
              therefore extends beyond heat-pump specifications to financing, survey quality, installation capacity,
              aftercare and energy optimization. Independent comparison evidence also names Bosch, Ideal, Grant,
              Samsung, LG, Viessmann and other brands, so this chapter's profile table is a representative rather than
              exhaustive landscape.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP010
              - CP011
