      customer reviews are not directly comparable measures.
    claimRefs:
      - CV001
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Sales growth persists; installation margin and retention improve; financing remains available.
        - Above SEK9.82bn only after verified economics justify a premium to the observed Q1 2025 marks.
        - Low-to-medium until margin and cohort data are disclosed.
        - Growth without margin or cash conversion.
      - - Base
        - Geographic expansion continues while heat-pump demand normalizes after the 2024 downturn.
        - SEK9.28-9.82bn observed-mark band; require downside protection until economics are verified.
        - Most defensible pending evidence.
        - Runway shortens or a financing requires materially adverse dilution.
      - - Bear
        - Policy support weakens, demand remains soft, and service or customer costs rise.
        - Below SEK9.28bn; avoid or wait because capital preservation dominates upside optionality.
        - Material risk signal, not a quantified probability.
        - Down round, persistent complaints, or inability to fund factory and field operations.
      - - Exit readiness
        - Recurring service economics and transparent financing terms become demonstrable.
        - Strategic or financial exit becomes underwritable only after KPI disclosure.
        - Unresolved.
        - No cohort, margin, preference, or cap-table transparency.
    notes: >-
      Directional decision bands anchored to two Accumeo Q1 2025 post-money marks; they are not intrinsic-value
      estimates or probability-weighted forecasts.
    claimRefs:
      - CV006
      - CV007
      - CV011
      - CV012
      - CV013
      - CV014
