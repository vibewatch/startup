chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Aira was founded by Vargas in Stockholm in 2022 and publicly launched in June 2023 as a direct-to-consumer
              residential clean-energy company. The operating model is broader than selling heat-pump hardware: retained
              sources describe an integrated chain spanning product development, manufacturing, consumer financing or
              monthly payments, installation, software, and after-sales service. By 2025, that footprint covered
              Germany, Italy, and the United Kingdom, supported by manufacturing in Wroclaw and research and development
              in Sweden. A 2026 company job repost still described more than 1,000 employees, but this is a
              company-issued threshold rather than an audited headcount. The snapshot therefore separates dated
              operating disclosures from genuinely current, independently verified metrics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
