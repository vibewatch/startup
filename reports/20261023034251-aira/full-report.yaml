  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Aira's disclosed model links customer financing and installation to recurring service, but the evidence does not
      disclose the margin or cash conversion at any step.
    data:
      nodes:
        - id: customer
          label: Household demand
          detail: Homeowner selects a heat-pump and clean-energy package.
        - id: financing
          label: Monthly payment
          detail: Public materials describe zero upfront costs and a fixed monthly fee.
        - id: installation
          label: Equipment and installation
          detail: Aira combines hardware, installation, and a target four-week customer journey.
        - id: service
          label: Long-term service
          detail: Service and a 15-year Comfort Guarantee are described, but cost and reserve data are unavailable.
        - id: energy
          label: Energy products
          detail: Solar, batteries, tariffs, and energy management are described as portfolio extensions.
        - id: economics
          label: Gross profit and cash
