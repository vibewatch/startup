              - CE008
              - CE009
              - CE011
              - CE012
      - number: '5.3'
        title: Controls, differentiation, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Aira's defensible proposition is less a novel thermodynamic principle than the integration of hardware,
              software, installation, and service. pv magazine reports that Aira is developing its own inverter to
              access controls, sensors, and firmware, and that its software monitors coefficient-of-performance data
              after installation. Rinnovabili records Aira's description of a system that learns household behavior,
              local weather, and hourly energy prices, with digital twins and predictive controls in development. These
              are promising control loops, but the retained evidence does not establish audited savings, fleet-wide
              uptime, cybersecurity controls, or long-term failure rates. Aira's recruitment material confirms software
              work for customer and installer applications, which is a developer signal rather than proof of
              reliability. September 2026 customer reviews also describe unsafe installation defects and an unresolved
              commissioning fault, showing that field execution and aftercare can fail even if the core architecture is
              sound. Technical diligence should therefore test deployment variance, update and privacy controls, battery
              and inverter certification, and service performance at scale.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwrite the integration layer, not just the hardware
            body: >-
              Product diligence should focus on cohort-level performance, service reliability, software security, and
              the installed maturity of Power and Aira Intelligence modules before treating the full-stack architecture
              as a proven moat.
            calloutType: recommendation
            claimRefs:
              - CE008
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segments
        blocks:
          - type: paragraph
            body: >-
              Aira is principally a residential, business-to-consumer provider rather than an enterprise vendor.
              Multiples describes European households as the customer focus and a model that combines hardware,
              installation, subscriptions, and energy-related services across Germany, Italy, and the UK; The Eco
              Experts separately describes residential coverage across most of England and Scotland. The buyer, user,
              and payer are therefore usually the same household, although financing approval and the UK Boiler Upgrade
              Scheme affect affordability. Kinnevik's account adds a guided, vertically integrated purchase journey,
              Accumeo describes heat pumps adapting to household routines and tariffs, and Aira-issued academy material
              shows an external trade-training channel supporting delivery. None of these sources segments installed
              customers by country, home type, income, revenue band, or product bundle, so public reach should not be
              mistaken for a measured customer mix.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
              - CU012
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
              - CU012
              - CU013
      - number: '6.2'
        title: Adoption trajectory and customer proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public adoption evidence is indirect. Multiples reports that Aira had opened 11 regional
              sales and installation hubs during 2024 and was visiting thousands of homes monthly by October 2024, but
              neither metric is an installed-customer count. The current fetched Trustpilot page carries a 4.3-of-5
              title and includes both multi-year service relationships and recent installations. An older Eco Experts
              review reported 4.4 from 634 reviews, with 77% five-star, while the academy article reports training
              capacity and completions that may support future delivery. These are useful demand, engagement, and
              capacity signals with different periods and denominators; they cannot be combined into a growth rate. The
              sampled customer record is also mixed: responsive repairs and smooth installations coexist with recurring
              faults, unresolved commissioning issues, and allegations of poor installation quality.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU013
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU009
              - CU013
              - CU014
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU014
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports an ongoing service relationship but not quantified retention. Reviewers describe
              annual or two-year servicing and support more than two years after installation, while Aira's software job
              description says its applications serve both household users and installers. The 15-year guarantee and
              monthly-payment proposition could reduce purchase friction and create a long-lived relationship, but they
              are contractual promises rather than observed renewal or net-revenue-retention results. Adverse reviews
              identify the counter-risk: installation variance, repeat engineer visits, unresolved hardware faults, and
              weak communication can erode trust after conversion. Expansion can move from heat pumps into solar,
              storage, tariffs, or other home-energy products, yet no retained source reports attach rates,
              repeat-purchase rates, cohort retention, contract-length distribution, or top-customer and channel
              concentration. Those omissions prevent a defensible durability or concentration judgment.
            claimRefs:
              - CU003
              - CU004
              - CU006
              - CU007
              - CU008
              - CU011
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Retention and concentration remain unmeasured
            body: >-
              Review volume and operating capacity demonstrate customer contact, not renewal or durable economics.
              Diligence still needs customer counts by country and cohort, contract terms, churn, NRR or repeat-purchase
              behavior, product attach rates, and customer or channel concentration.
            calloutType: risk
            claimRefs:
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and demand exposure
        blocks:
          - type: paragraph
            body: >-
              UK policy is supportive but creates a specific compliance dependency. The government set the Clean Heat
              Market Mechanism Year 2 heat-pump target at 8% and made MCS the sole certification scheme, so installer
              certification and scheme continuity are operating inputs rather than background policy. Demand is not
              uniformly improving across Aira's footprint: a trade publication reported that sales across 13 European
              countries fell 23% in 2024, with Germany down 48% while the UK rose 63% under supportive schemes. That
              divergence raises the likelihood of uneven factory and installer utilization. Customer allegations
              concerning material installation changes and threatened money-claim proceedings add consumer-protection
              exposure, but the assigned evidence does not establish the volume, outcome, or legal status of such
              disputes.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
      - number: '7.2'
        title: Operational quality and service reliability
        blocks:
          - type: paragraph
            body: >-
              Aira must scale a labor-intensive installation and service system without allowing speed to degrade
              workmanship. Fortune identified skilled-installer scarcity and reports of botched heat-pump installations
              that raised energy bills, while 2026 customer reviews describe both serious installation disruption and an
              unresolved commissioning fault. These anecdotes are useful failure-mode evidence, not an incident-rate
              denominator. Aira-issued job reposts show that the company is recruiting for safe installation delivery
              and for software used by customers and installers, indicating active mitigations but also two coupled
              dependencies: field execution and application availability. Public sources do not disclose
              first-time-right installation rates, repeat visits, mean time to repair, warranty losses, safety
              incidents, or software-service levels.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Integration, financing, and capital dependencies
        blocks:
          - type: paragraph
            body: >-
              Vertical integration is both Aira's control mechanism and its principal concentration risk. Kinnevik
              describes a chain spanning production, acquisition, installation, logistics, financing, and energy
              management; a syndicated 2024 company release added a 220,000-square-metre Polish facility and 11 regional
              sales and installation hubs. The model therefore concentrates manufacturing utilization, working capital,
              installer productivity, credit performance, and aftercare inside the same growth plan. Fortune reported
              Aira's statement that about 75% of Italian installations used monthly payments, increasing sensitivity to
              financing availability and portfolio performance. Historical and current funding figures show substantial
              capital access, but funding raised is not cash available, and the public evidence does not disclose burn,
              runway, financing losses, or committed future capital.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Residual risk, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The risk ranking remains high where demand, quality, and financing can reinforce one another. A policy or
              energy-price shock could reduce orders while leaving manufacturing and regional capacity underused; rushed
              installation growth could then increase remediation costs and weaken referrals; tighter consumer-finance
              capacity could further reduce conversion. The investable monitoring set is therefore operational rather
              than promotional: certified-installer capacity, installation defects, repeat visits, warranty cost,
              complaint escalation, software availability, market-level conversion, financing approval and loss rates,
              factory utilization, unrestricted cash, and monthly burn. Thesis-break triggers are a sustained
              deterioration in two or more of these indicators, loss of required certification, or inability to fund
              service obligations. Numeric thresholds require management data and should not be invented from the public
              record.
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
              - CR009
              - CR011
              - CR012
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority thesis-break test
            body: >-
              Treat a sustained combination of weakening market conversion, rising installation defects, and constrained
              financing capacity as a thesis-break signal; the public record does not support numeric thresholds.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR014
          - type: callout
            title: Required pre-investment evidence
            body: >-
              Require audited market-level operating cohorts, certification coverage, complaint and warranty files,
              financing performance, factory utilization, unrestricted cash, and burn before underwriting the current
              scale plan.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR002
              - CR008
              - CR009
              - CR012
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision and price discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a credible scale-up thesis but not a fully underwritten valuation. A company
              announcement syndicated by EU-Startups says Aira raised EUR150 million in 2025 and reported a EUR200
              million annual sales run-rate, while the same account says the company employed 1,200 people and had
              opened 18 hubs and four academies. Multiples records earlier equity rounds, including EUR145 million in
              January 2024 and a EUR63 million extension in October 2024, and describes a direct-to- consumer
              subscription model with manufacturing, installation, and energy services. These are useful scale and
              financing signals, but they are not equivalent to audited revenue, ARR, gross margin, free cash flow, or a
              current priced-round valuation. The recommendation is therefore track: invest only after receiving current
              cap-table terms, preference rights, cash runway, contribution margin by installation, and retention
              evidence. Aira's scale, investor base, and integrated model are strengths; the missing denominator data
              makes any precise entry multiple speculative.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV013
      - number: '8.2'
        title: Thesis versus anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Aira can turn a fragmented residential heating purchase into a repeatable
              electrification platform: monthly payments reduce upfront friction, the company controls product and
              installation execution, and a Polish factory is planned for up to 500,000 heat pumps per year. The
              anti-thesis is that this model combines hardware, field labor, financing, inventory, and policy exposure,
              so scale can increase capital needs before unit economics mature. The market backdrop is also cyclical:
              the European Heat Pump Association reports that sales fell 21% in 14 European countries in 2024, citing
              changed support schemes, weak economic conditions, and subsidized gas prices. Customer reviews are mixed
              rather than uniformly confirming economics: many describe professional installations, while one review
              alleges unresolved aftercare and another reports electricity costs of EUR8 to EUR10 per day during cold
              weather. These signals do not prove systemic failure, but they make conversion, installation quality,
              running costs, and churn central valuation diligence items.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, comparables, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              A defensible scenario framework must use ranges and explicit gates rather than a point estimate. The bull
              case requires sustained sales growth, improving installation contribution margin, low cancellation and
              service costs, and financing capacity that does not force a down round. The base case assumes continued
              geographic expansion but a slower heat-pump market, with valuation supported only if management supplies
              audited revenue quality, margin progression, and runway. The bear case combines policy or demand weakness
              with high field-service costs, customer dissatisfaction, and additional dilution; the 2024 market
              contraction and reported customer cost complaints are observable downside signals, not probabilities.
              Public comparable evidence is thin: Multiples lists Aira alongside companies with materially different
              business models and reports no Aira revenue multiple, while Accumeo shows locked share-issuance records
              with post-money valuations of SEK9.28 billion and SEK9.82 billion for two 2025 entries but does not
              disclose the associated amount raised. The scenario bands below use those observed marks as decision
              boundaries, not intrinsic-value estimates. Exit readiness depends on proving recurring service economics,
              repeatable installations, and transparent financing terms.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV007
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV011
              - CV014
      - number: '8.4'
        title: Diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is a price-and-evidence package, not another market- size narrative. Management
              should provide monthly cohorts by country, cancellation and renewal data, installation gross margin,
              warranty and service reserves, customer acquisition cost, cash balance, burn, debt covenants, and the
              fully diluted cap table with liquidation preferences. Investors should reconcile the reported sales
              run-rate with recognized revenue and distinguish subscription receipts from hardware or installation
              revenue. They should also test whether the factory investment and 500,000- unit capacity are demand-backed
              or primarily fixed-cost exposure. A thesis break occurs if current financing implies a materially higher
              value without corresponding margin or retention proof, if cash runway requires a down round, if policy
              changes reduce conversion, or if complaint and service data show persistent cost or reliability problems.
              Until those tests are passed, the evidence supports tracking Aira and negotiating downside protection
              rather than paying for an unverified platform premium.
            claimRefs:
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not confuse financing with value creation
            body: >-
              Aira's disclosed equity and factory plans demonstrate investor support and capacity ambition, but they do
              not establish ARR, gross margin, cash runway, or a current post-money valuation.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV011
              - CV013
          - type: callout
            title: Evidence-sensitive entry discipline
            body: >-
              Track the company and require a current cap table, preference stack, cohort economics, and runway before
              underwriting a platform premium.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV014
