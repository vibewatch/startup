              - CP015
      - number: '3.2'
        title: Integration improves control but does not eliminate product substitution
        blocks:
          - type: paragraph
            body: >-
              Aira controls more of the customer journey than a conventional manufacturer: investor and third-party
              descriptions cover proprietary manufacturing, direct sales, installation, financing or subscriptions,
              software and an expanding home-energy system. That architecture can tighten feedback loops and make a
              single warranty more valuable, but the hardware itself remains comparable on familiar dimensions such as
              output, flow temperature, efficiency and refrigerant. The strongest visible moat is therefore execution
              across the system, not an independently proven technical monopoly. Octopus has a similarly integrated
              system plus tariff distribution, while incumbent OEMs can counter with broader size ranges and established
              installer familiarity.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP009
              - CP010
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP002
