      - number: '4.2'
        title: Pricing, customer acquisition, and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Public materials support a list-level proposition rather than realized pricing. Aira's 2023 launch release
              described a fixed monthly fee, zero upfront costs, and a quote-to-installation journey targeted at four
              weeks; Kinnevik later described an all-inclusive monthly plan and a 15-year Comfort Guarantee. These are
              commercial terms or service promises, not evidence of net price, discounting, CAC, payback, churn, or
              contribution margin. The vertically integrated model could improve conversion and reduce coordination
              costs, but the same integration carries manufacturing, installation, financing, and service-delivery
              exposure. The diligence priority is a cohort-level bridge from lead source to installed system, cash
              collection, service cost, and renewal.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI013
      - number: '4.3'
        title: Cost structure and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Aira is capital intensive by design. It operates or planned a large Polish manufacturing footprint,
              invests in Swedish R&D, and maintains hubs, training academies, installation capacity, and customer
              support. Elemental reports a EUR300 million production site with stated capacity of 500,000 heat pumps per
              year, while the 2023 company release said production would start in 2024. The company raised SEK1 billion
              in October 2023 and EUR150 million in August 2025, with proceeds described for expansion, R&D, production,
              and partnerships. Those financings establish funding raised, not cash available today. No assigned source
              provides cash on hand, monthly burn, debt obligations, working-capital requirements, or runway; those are
              material underwriting gaps.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI009
              - CI010
              - CI011
              - CI012
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a credible scale-up story but not a complete financial underwriting case. Reported
              run-rate growth and financing access are positive, while manufacturing and installation capacity create
              operating leverage potential only if utilization, pricing, warranty incidence, and service costs are
              controlled. Trustpilot evidence is mixed: several customers describe successful support, while another
              review reports installation deviations, leaks, damaged equipment, and repeated calls; the page also
              includes Aira responses, so it is customer signal rather than an independent cost study. Finerva's
              clean-tech benchmark shows a 1.8x median EV/revenue multiple in Q4 2024 for its cohort and notes that only
              about half of companies had positive EBITDA, but that benchmark is not a valuation of Aira. The immediate
              decision gate is access to cohort economics, cash bridge, and financing terms.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and operating model
        blocks:
          - type: paragraph
            body: >-
              Aira sells residential air-source heat pumps together with installation and ongoing service rather than a
              standalone appliance. Dealroom describes the company as designing, manufacturing, and installing heat
              pumps for residential heating and hot water, while its public profile says the offer is sold directly to
              homeowners in Italy, Germany, and the UK through a monthly payment plan covering the heat pump,
              installation, and long-term guarantees. Aira's own recruiting surface describes a state-of-the-art
              production facility in Poland, a Stockholm headquarters, and hubs across the UK, Germany, and Italy.
              Independent coverage adds that Aira manufactures in Wroclaw and maintains staff in its target markets.
              This gives the product a clear customer workflow: assess the home, install the system, connect it, and
              operate it through a managed service. The model may reduce integration friction, but it also makes field
              execution, installer quality, and service capacity part of the product rather than separable channel
              issues.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
