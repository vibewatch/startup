              - CO014
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The clearest documented leadership change occurred in May 2025, when former chief operating officer Peter
              Prem became chief executive, succeeding Martin Lewerth, who had led Aira from its start. That transition
              moves the leadership emphasis from company formation toward operational scaling, but the retained public
              evidence does not establish the complete board, committee structure, voting arrangements, or executive
              bench below the chief executive. Vargas remains central to the origin story, and Harald Mix was identified
              as chair of both Vargas and Aira in the launch release, yet this should not be treated as a current
              cap-table or control disclosure. Governance diligence therefore requires primary corporate records and
              current board materials.
            claimRefs:
              - CO001
              - CO004
