              - CO004
      - number: '1.3'
        title: Financing, scale, and stakeholder alignment
        blocks:
          - type: paragraph
            body: >-
              Aira's financing path includes a reported $91 million Series A in October 2023, a EUR145 million Series B
              in January 2024, and EUR150 million of equity financing in August 2025. The last round was backed by
              Altor, Kallskär, Kinnevik, Lingotto, and Temasek and was directed toward production, research, market
              depth, and the product portfolio. Scale evidence is meaningful but dated: two independent publications
              reported a EUR200 million annual sales run-rate in August 2025. That figure is neither ARR nor audited
              current revenue. Aggregators disagree sharply on cumulative funding, reporting $483 million, $492 million,
              and $943.64 million, so no single total-raised figure should be used without a financing schedule that
              reconciles equity, debt, and duplicate rounds.
            claimRefs:
