      - number: '5.2'
        title: Architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The core product is a connected heat-pump system with outdoor and indoor hardware, a thermostat, an app,
              and Aira Intelligence software. pv magazine reports 6 kW, 8 kW, and 12 kW outdoor units, an all-in-one
              indoor unit with hot-water tank and performance optimizer, 100 L and 250 L configurations, and a compact
              hydrobox. The same account says an installation has about 15 sensors depending on model and that Aira
              samples them at high frequency for measures used by regulation and heat-curve subsystems. The roadmap
              extends this architecture into a modular inverter, battery, solar, and electric-vehicle charging stack.
              November 2025 coverage describes a Power Hub, Power Store, and mobile app as an integrated system, but
              does not provide an audited installed base or field-performance history. Architecture maturity is
              therefore strongest in the launched heat-pump and telemetry layer; the broader energy-management platform
              has less public operating evidence.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE007
              - CE008
              - CE010
              - CE011
              - CE013
          - type: figure
