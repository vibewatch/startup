  - id: FE001
    title: Aira product architecture map
    type: stack
    summary: >-
      Aira's product stack links physical heating assets to telemetry, control software, and a broader home-energy
      orchestration layer.
    data:
      layers:
        - label: Home-energy orchestration
          detail: Whole-home inputs and planned energy-flow integrations.
          items:
            - label: Solar and tariff inputs
              detail: Inputs described for future or expanding whole-home optimization.
            - label: EV charging
              detail: Planned integration in the broader household energy proposition.
        - label: Storage and power conversion
          detail: Power conversion and storage components extending the heat-pump system.
          items:
            - label: Aira Power Store
              detail: Home battery described as storing surplus solar or off-peak grid energy.
            - label: Aira Power Hub
              detail: Power-conversion component described in the integrated home-energy launch.
        - label: Control and application
          detail: Software controls and optimization logic exposed to customers and operators.
          items:
            - label: Aira Intelligence
              detail: App and software layer for monitoring, comfort, tariff, and energy optimization.
            - label: Predictive controls
              detail: Digital twins and predictive system control described as development work.
        - label: Sensing and connected devices
          detail: Connected measurement and user-control surfaces.
          items:
            - label: Heat-pump telemetry
              detail: High-frequency sampling of temperatures, flow, compressor speed, and derived measures.
            - label: Thermostat and connectivity
              detail: Customer-facing controls and connected operation.
        - label: Physical heating system
          detail: Core residential heating and hot-water equipment.
          items:
            - label: Outdoor heat pump
              detail: 6 kW, 8 kW, and 12 kW variants reported.
            - label: Indoor unit or hydrobox
              detail: Hot-water tank and performance optimizer configurations reported.
        - label: Delivery and service
          detail: Installation, monitoring, maintenance, and ongoing customer support.
          items:
            - label: Regional installation hubs
              detail: Aira's integrated operating model includes market-level installation and service capacity.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
      - CE009
      - CE011
      - CE012
  - id: FU001
    title: Household customer journey and expansion surfaces
    type: journey-map
    summary: >-
      Aira's public journey links consultation, financing, installation, software control, service, and potential
      adjacent-product expansion, with evidence gaps concentrated after installation.
    data:
      nodes:
        - id: discovery
          label: 1. Discovery and guidance
          detail: A household engages with a Clean Energy Expert and considers a tailored home-energy solution.
          touchpoints:
            - Customer guidance
            - Needs assessment
            - Product education
        - id: survey
          label: 2. Home survey and design
          detail: >-
            The proposed system and installation plan are adapted to the property; adverse reviews show
            expectation-management risk at this stage.
          touchpoints:
            - Property survey
            - System design
            - Scope confirmation
        - id: financing
          label: 3. Financing and grant
          detail: Monthly-payment positioning and UK grant support can lower upfront friction, subject to financing approval.
          touchpoints:
            - Finance application
            - Boiler Upgrade Scheme
            - Contract and guarantee
        - id: installation
          label: 4. Installation and commissioning
          detail: >-
            Academy-trained delivery capacity supports installation; public reviews show both smooth delivery and
            material variance.
          touchpoints:
            - Installer team
            - Commissioning
            - Handover
        - id: control
          label: 5. App control and optimization
          detail: Customer-facing software supports heating control while internal applications support installers.
          touchpoints:
            - Mobile app
            - Heating controls
            - Installer applications
        - id: service
          label: 6. Service, warranty, and expansion
          detail: >-
            Aftercare and the 15-year guarantee can sustain the relationship; solar, batteries, and tariffs create
            expansion surfaces, but retention and attach rates are undisclosed.
          touchpoints:
            - Engineer visits
            - Guarantee
            - Solar and storage
            - Energy tariffs
    approximationNotes: >-
      The sequence is synthesized from retained public descriptions and reviews; it does not imply measured stage
      conversion, duration, or retention.
    claimRefs:
      - CU003
      - CU004
      - CU009
      - CU010
      - CU011
      - CU015
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Six evidence-backed risks are ranked qualitatively by likelihood, impact, mitigation maturity, and residual
      exposure.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Installation quality
          values:
            - label: High
              detail: Installer scarcity and multiple customer-reported failures
            - label: High
              detail: Safety, remediation cost, and referral damage can compound
            - label: Partial
              detail: Hiring is visible; audited outcomes are not
            - label: High
              detail: No public defect or first-time-right denominator
        - label: Policy-sensitive demand
          values:
            - label: High
              detail: 2024 country sales diverged sharply
            - label: High
              detail: Orders and capacity utilization depend on market support
            - label: Partial
              detail: Three-country operations provide some diversification
            - label: High
              detail: Market-level downside cases are undisclosed
        - label: Consumer financing
          values:
            - label: Medium-high
              detail: Monthly plans were reportedly common in Italy
            - label: High
              detail: Funding cost and credit losses can reduce conversion and margin
            - label: Unknown
              detail: Provider terms and portfolio performance are private
            - label: High
              detail: No loss, recourse, or lender-concentration data
        - label: Integrated capacity
          values:
            - label: Medium-high
              detail: Facility and hub utilization follow demand
            - label: High
              detail: Underutilization creates fixed-cost and cash pressure
            - label: Partial
              detail: Vertical control supports coordination
            - label: Medium-high
              detail: Break-even utilization is undisclosed
        - label: Aftercare and warranty
          values:
            - label: Medium
              detail: Recent reviews include repeat and unresolved faults
            - label: High
              detail: Service failures can create cost and customer harm
            - label: Partial
              detail: Field service and customer-care functions are visible
            - label: Medium-high
              detail: Resolution time and warranty losses are undisclosed
        - label: Software and privacy
          values:
            - label: Unknown
              detail: The assigned sources contain no incident denominator
            - label: Medium-high
              detail: Applications support customers and installers
            - label: Unknown
              detail: Controls, uptime, and testing are not public
            - label: Unknown
              detail: Primary technical and privacy diligence is required
    approximationNotes: >-
      Qualitative labels synthesize cited facts and explicit evidence gaps; they are not statistical probabilities,
      benchmark scores, or incident-rate estimates.
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR008
      - CR009
      - CR010
      - CR011
      - CR014
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Scale and market opportunity are offset by missing valuation denominators and observable demand and customer-cost
      risks.
    data:
      nodes:
        - id: scale
          label: Scale and financing
          detail: EUR150M 2025 equity; EUR200M reported annual sales run-rate
        - id: model
          label: Integrated model
          detail: Product, manufacturing, installation, and monthly payment plan
        - id: market
          label: Market sensitivity
          detail: Heat-pump sales fell 21% across 14 European countries in 2024
        - id: economics
          label: Missing economics
          detail: No current margin, runway, retention, or priced-round terms
        - id: risk
          label: Downside tests
          detail: Policy, service costs, customer bills, and dilution
        - id: call
          label: Recommendation
          detail: Track until price and unit economics are evidenced
    claimRefs:
      - CV001
      - CV006
      - CV008
      - CV011
      - CV014
