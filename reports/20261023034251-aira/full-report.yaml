              - CP010
              - CP014
              - CP015
              - CP016
      - number: '3.3'
        title: Upfront affordability and installer capacity shape competitive conversion
        blocks:
          - type: paragraph
            body: >-
              Public list-price comparisons point to a material affordability challenge. Dwellow reports an Aira package
              at about £14,000 before the £7,500 Boiler Upgrade Scheme grant and about £6,500 after it, excluding
              possible radiator upgrades. EE Renewables reports a typical Cosy 6 installation at £3,818 after the same
              grant, while The Eco Experts reports Octopus systems from £4,300 including standard installation. These
              are not realized transaction prices and the package boundaries differ, but they indicate that Aira asks
              buyers to value warranty and integration over the lowest subsidized entry price. Installer availability is
              another constraint: Aira's chief executive told Reuters that trained labor was a major operational
              bottleneck.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
      - number: '3.4'
        title: The service layer is both differentiation and the principal execution risk
        blocks:
          - type: paragraph
            body: >-
              Aira's 15-year product-and-installation coverage is unusually long, and one independent comparison ranked
              the product best for quality. Yet the same end-to-end responsibility that supports differentiation
              concentrates installation and aftercare failures on Aira's brand. The reviewed Trustpilot page contains
              praise for responsive engineers alongside complaints about repeated visits, incomplete or unsafe-looking
              work, unresolved faults and weak communication. These anecdotes do not establish an incident rate, but
              they disconfirm any assumption that vertical integration guarantees consistent delivery. Aira is also
              young, so independent evidence of fleet durability across a full warranty cycle is unavailable. Chinese
              equipment competition and a market that contracted in 2023 further limit confidence that manufacturing
              scale alone will protect pricing.
            claimRefs:
              - CP009
              - CP011
              - CP013
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Long coverage differentiates the offer
            body: >-
              Retained comparisons cite Aira's 15-year product-and-installation coverage as longer than the warranties
              attached to the named alternatives.
            calloutType: strength
            claimRefs:
              - CP002
              - CP009
          - type: callout
            title: Integration concentrates service accountability
            body: >-
              Mixed customer reports make installation quality and fault resolution a direct test of Aira's brand
              promise, even though the reviewed anecdotes do not quantify failure rates.
            calloutType: risk
            claimRefs:
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and reported traction
        blocks:
          - type: paragraph
            body: >-
              Aira's commercial model combines heat-pump hardware, installation, long-term service, and energy products
              in a direct-to-consumer subscription proposition. The available evidence describes monthly payments with
              no upfront cost, but it does not disclose the split between hardware, installation, recurring service,
              financing, and energy margins. Reported annual sales run-rate figures are company-linked or third-party
              reported and should not be treated as audited revenue or ARR. The strongest recent signal is scale:
              Vestbee and ESG Today both report EUR200 million of annual sales run-rate and 1,200 employees in 2025,
              while Multiples records EUR100 million of annual revenue run-rate in October 2024. This suggests
              commercial expansion, but not the quality, retention, or profitability of revenue.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
