callouts:
  - calloutType: risk
    title: Financing totals do not reconcile
    body: >-
      Published aggregator totals span $483 million to $943.64 million. Diligence should not present a
      single total-raised or valuation figure until equity, debt, extensions, and duplicate rounds are
      reconciled against primary transaction documents.
    claimRefs: [CO008, CO009, CO010, CO011, CO012]
  - calloutType: insight
    title: Vertical integration increases both control and exposure
    body: >-
      Owning product, financing, installation, software, and service can improve the customer journey,
      but customer complaints show that installation and aftercare failures also remain directly with
      Aira rather than an independent dealer network.
    claimRefs: [CO003, CO016]
