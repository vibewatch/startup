company:
  name: Aira
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Aira is a privately held, Stockholm-founded residential electrification company built by Vargas
    around a vertically integrated heat-pump and home-energy model. Its August 2025 equity raise and
    subsequent product expansion demonstrate scale, but published total-funding and valuation figures
    conflict materially, while current customer count and complete governance remain undisclosed.
sections:
  - id: identity-and-business-model
    title: Identity and operating model
    body: >-
      Aira was founded by Vargas in Stockholm in 2022 and publicly launched in June 2023 as a
      direct-to-consumer residential clean-energy company. The operating model is broader than selling
      heat-pump hardware: retained sources describe an integrated chain spanning product development,
      manufacturing, consumer financing or monthly payments, installation, software, and after-sales
      service. By 2025, that footprint covered Germany, Italy, and the United Kingdom, supported by
      manufacturing in Wroclaw and research and development in Sweden. A 2026 company job repost still
      described more than 1,000 employees, but this is a company-issued threshold rather than an audited
      headcount. The snapshot therefore separates dated operating disclosures from genuinely current,
      independently verified metrics.
    claimRefs: [CO001, CO002, CO003, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      The clearest documented leadership change occurred in May 2025, when former chief operating
      officer Peter Prem became chief executive, succeeding Martin Lewerth, who had led Aira from its
      start. That transition moves the leadership emphasis from company formation toward operational
      scaling, but the retained public evidence does not establish the complete board, committee
      structure, voting arrangements, or executive bench below the chief executive. Vargas remains
      central to the origin story, and Harald Mix was identified as chair of both Vargas and Aira in
      the launch release, yet this should not be treated as a current cap-table or control disclosure.
      Governance diligence therefore requires primary corporate records and current board materials.
    claimRefs: [CO001, CO004]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Financing, scale, and stakeholder alignment
    body: >-
      Aira's financing path includes a reported $91 million Series A in October 2023, a EUR145 million
      Series B in January 2024, and EUR150 million of equity financing in August 2025. The last round
      was backed by Altor, Kallskär, Kinnevik, Lingotto, and Temasek and was directed toward production,
      research, market depth, and the product portfolio. Scale evidence is meaningful but dated: two
      independent publications reported a EUR200 million annual sales run-rate in August 2025. That
      figure is neither ARR nor audited current revenue. Aggregators disagree sharply on cumulative
      funding, reporting $483 million, $492 million, and $943.64 million, so no single total-raised
      figure should be used without a financing schedule that reconciles equity, debt, and duplicate
      rounds.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO013]
    tableRefs: [TO003]
  - id: milestones-and-risk-signals
    title: Milestones and risk signals
    body: >-
      Aira progressed from its 2022 formation and 2023 commercial launch through multiple financing
      rounds, a chief-executive transition, and a November 2025 expansion into residential batteries
      and inverters. The sequence supports a whole-home-energy ambition rather than a single-product
      installer thesis. Execution risk remains visible at the service layer: a September 2026
      Trustpilot sample contains complaints alleging poor installation quality, unresolved faults,
      weak aftercare, and escalation toward legal action, alongside many favorable service reviews.
      Those reviews are not a representative incident rate, but they show that vertical integration
      transfers installation and support quality directly onto Aira's brand. Current customer count,
      retention, complaint incidence, and independently verified installation volumes remain material
      diligence gaps.
    claimRefs: [CO002, CO004, CO007, CO015, CO016]
    figureRefs: [FO001]
