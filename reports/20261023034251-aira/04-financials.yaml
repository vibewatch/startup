      - ["Employees", "1,200", "medium", "Indicates substantial operating base and service cost", "Provide personnel cost and productivity by function"]
      - ["Manufacturing site investment", "EUR300 million reported for Polish site", "medium", "Signals fixed-cost and capex intensity", "Confirm Aira spend, ownership, financing, and depreciation"]
      - ["Factory capacity", "500,000 heat pumps/year stated", "medium", "Creates operating leverage only with demand and utilization", "Provide ramp, utilization, yield, and unit conversion cost"]
      - ["Funding raised in August 2025", "EUR150 million", "medium", "Extends financing capacity but not current liquidity", "Provide post-round cash balance and use-of-funds actuals"]
      - ["Funding raised in October 2023", "SEK1 billion", "medium", "Historical capital input for expansion", "Do not treat as current cash; reconcile financing ledger"]
      - ["Gross margin", null, "unavailable", "Core test of hardware-plus-service economics", "Provide gross margin by product and country"]
      - ["Cash on hand", null, "unavailable", "Determines near-term solvency and financing dependency", "Provide latest balance sheet and restricted cash"]
      - ["Burn and runway", null, "unavailable", "Determines next-round timing and downside risk", "Provide monthly cash-flow bridge and base/downside runway"]
      - ["CAC/payback/LTV", null, "unavailable", "Determines whether growth creates or destroys value", "Provide cohort economics with financing and service costs"]
    notes: Values are reported or company-linked proxies with mixed dates and currencies; null means not disclosed in the assigned evidence, not zero. Funding raised is not cash available and factory capacity is not realized throughput.
    claimRefs: [CI002, CI003, CI009, CI010, CI011, CI012, CI016]
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Aira's disclosed model links customer financing and installation to recurring service, but the evidence does not disclose the margin or cash conversion at any step.
    data:
      nodes:
        - id: customer
          label: Household demand
          detail: Homeowner selects a heat-pump and clean-energy package.
        - id: financing
          label: Monthly payment
          detail: Public materials describe zero upfront costs and a fixed monthly fee.
        - id: installation
          label: Equipment and installation
          detail: Aira combines hardware, installation, and a target four-week customer journey.
        - id: service
          label: Long-term service
          detail: Service and a 15-year Comfort Guarantee are described, but cost and reserve data are unavailable.
        - id: energy
          label: Energy products
          detail: Solar, batteries, tariffs, and energy management are described as portfolio extensions.
        - id: economics
          label: Gross profit and cash
          detail: Gross margin, CAC, working capital, cash, burn, and runway are not disclosed in the assigned evidence.
      edges:
        - [customer, financing]
        - [financing, installation]
        - [installation, service]
        - [service, economics]
        - [installation, energy]
        - [energy, economics]
    approximationNotes: This is a disclosed operating-model sequence, not a quantitative waterfall; no conversion rate, margin, or cash value is inferred.
    claimRefs: [CI005, CI006, CI007, CI012, CI016]
