chapter:
  number: 4
  title: Financials
  summary: Aira has assembled a vertically integrated residential-heating proposition with reported annual sales run-rate growth from EUR100 million in October 2024 to EUR200 million in August 2025, but public evidence does not disclose realized subscription revenue, gross margin, cash, burn, runway, or customer-level unit economics. The financial case therefore rests on execution of scale and financing capacity rather than underwritten cash generation.
sections:
  - id: revenue-model
    title: Revenue model and reported traction
    body: >-
      Aira's commercial model combines heat-pump hardware, installation, long-term service, and energy products in a direct-to-consumer subscription proposition. The available evidence describes monthly payments with no upfront cost, but it does not disclose the split between hardware, installation, recurring service, financing, and energy margins. Reported annual sales run-rate figures are company-linked or third-party reported and should not be treated as audited revenue or ARR. The strongest recent signal is scale: Vestbee and ESG Today both report EUR200 million of annual sales run-rate and 1,200 employees in 2025, while Multiples records EUR100 million of annual revenue run-rate in October 2024. This suggests commercial expansion, but not the quality, retention, or profitability of revenue.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-sales-efficiency
    title: Pricing, customer acquisition, and sales efficiency
    body: Public materials support a list-level proposition rather than realized pricing. Aira's 2023 launch release described a fixed monthly fee, zero upfront costs, and a quote-to-installation journey targeted at four weeks; Kinnevik later described an all-inclusive monthly plan and a 15-year Comfort Guarantee. These are commercial terms or service promises, not evidence of net price, discounting, CAC, payback, churn, or contribution margin. The vertically integrated model could improve conversion and reduce coordination costs, but the same integration carries manufacturing, installation, financing, and service-delivery exposure. The diligence priority is a cohort-level bridge from lead source to installed system, cash collection, service cost, and renewal.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002]
  - id: cost-structure-and-capital
    title: Cost structure and financing dependency
    body: Aira is capital intensive by design. It operates or planned a large Polish manufacturing footprint, invests in Swedish R&D, and maintains hubs, training academies, installation capacity, and customer support. Elemental reports a EUR300 million production site with stated capacity of 500,000 heat pumps per year, while the 2023 company release said production would start in 2024. The company raised SEK1 billion in October 2023 and EUR150 million in August 2025, with proceeds described for expansion, R&D, production, and partnerships. Those financings establish funding raised, not cash available today. No assigned source provides cash on hand, monthly burn, debt obligations, working-capital requirements, or runway; those are material underwriting gaps.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The evidence supports a credible scale-up story but not a complete financial underwriting case. Reported run-rate growth and financing access are positive, while manufacturing and installation capacity create operating leverage potential only if utilization, pricing, warranty incidence, and service costs are controlled. Trustpilot evidence is mixed: several customers describe successful support, while another review reports installation deviations, leaks, damaged equipment, and repeated calls; the page also includes Aira responses, so it is customer signal rather than an independent cost study. Finerva's clean-tech benchmark shows a 1.8x median EV/revenue multiple in Q4 2024 for its cohort and notes that only about half of companies had positive EBITDA, but that benchmark is not a valuation of Aira. The immediate decision gate is access to cohort economics, cash bridge, and financing terms.
    claimRefs: [CI013, CI014, CI015, CI016]
    callouts:
      - calloutType: risk
        title: Cash-generation evidence is unavailable
        body: Reported funding and sales run-rate do not establish cash runway, gross margin, or contribution economics; an investor should require a current cash bridge and cohort-level unit economics before underwriting scale.
        claimRefs: [CI003, CI012, CI016]
      - calloutType: strength
        title: Scale infrastructure is already funded
        body: Aira has disclosed substantial financing and a vertically integrated production and service footprint, creating a plausible path to operating leverage if capacity utilization and service quality are proven.
        claimRefs: [CI009, CI010, CI011]
