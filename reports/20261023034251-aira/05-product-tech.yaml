chapter:
  number: 5
  title: Product & Technology
  summary: Aira combines residential air-source heat pumps with installation, connected controls, and an expanding home-energy system. Public evidence supports the integrated product architecture, but fleet reliability, software security, and consistent installation quality remain material diligence gaps.
sections:
  - id: product-and-operating-model
    title: Product and operating model
    body: "Aira sells residential air-source heat pumps together with installation and ongoing service rather than a standalone appliance. Dealroom describes the company as designing, manufacturing, and installing heat pumps for residential heating and hot water, while its public profile says the offer is sold directly to homeowners in Italy, Germany, and the UK through a monthly payment plan covering the heat pump, installation, and long-term guarantees. Aira's own recruiting surface describes a state-of-the-art production facility in Poland, a Stockholm headquarters, and hubs across the UK, Germany, and Italy. Independent coverage adds that Aira manufactures in Wroclaw and maintains staff in its target markets. This gives the product a clear customer workflow: assess the home, install the system, connect it, and operate it through a managed service. The model may reduce integration friction, but it also makes field execution, installer quality, and service capacity part of the product rather than separable channel issues."
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-maturity
    title: Architecture and maturity
    body: "The core product is a connected heat-pump system with outdoor and indoor hardware, a thermostat, an app, and Aira Intelligence software. pv magazine reports 6 kW, 8 kW, and 12 kW outdoor units, an all-in-one indoor unit with hot-water tank and performance optimizer, 100 L and 250 L configurations, and a compact hydrobox. The same account says an installation has about 15 sensors depending on model and that Aira samples them at high frequency for measures used by regulation and heat-curve subsystems. The roadmap extends this architecture into a modular inverter, battery, solar, and electric-vehicle charging stack. November 2025 coverage describes a Power Hub, Power Store, and mobile app as an integrated system, but does not provide an audited installed base or field-performance history. Architecture maturity is therefore strongest in the launched heat-pump and telemetry layer; the broader energy-management platform has less public operating evidence."
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: controls-differentiation-and-risks
    title: Controls, differentiation, and technical risks
    body: "Aira's defensible proposition is less a novel thermodynamic principle than the integration of hardware, software, installation, and service. pv magazine reports that Aira is developing its own inverter to access controls, sensors, and firmware, and that its software monitors coefficient-of-performance data after installation. Rinnovabili records Aira's description of a system that learns household behavior, local weather, and hourly energy prices, with digital twins and predictive controls in development. These are promising control loops, but the retained evidence does not establish audited savings, fleet-wide uptime, cybersecurity controls, or long-term failure rates. Aira's recruitment material confirms software work for customer and installer applications, which is a developer signal rather than proof of reliability. September 2026 customer reviews also describe unsafe installation defects and an unresolved commissioning fault, showing that field execution and aftercare can fail even if the core architecture is sound. Technical diligence should therefore test deployment variance, update and privacy controls, battery and inverter certification, and service performance at scale."
    claimRefs: [CE010, CE011, CE012, CE013, CE014, CE015, CE016]
