  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: "Independent cohort data on heat-pump uptime, seasonal performance, service visits, warranty claims, and component failures across installed homes."
      whyItMatters: "The product promise includes long-term comfort and performance, but public evidence is mainly trade coverage and company statements rather than audited fleet outcomes."
      diligencePath: "Request anonymized installation cohorts, COP and uptime distributions, warranty-claim rates, mean time to repair, and service-level performance by market."
      relatedQuestionRefs: [QE005, QE008]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: "Security architecture, privacy controls, software-update policy, incident history, and relevant certifications for the connected heat-pump and home-energy platform."
      whyItMatters: "A cloud-connected heating, storage, and tariff-control system creates operational and privacy dependencies that are not described in the retained public evidence."
      diligencePath: "Obtain security whitepapers, data-flow diagrams, penetration-test summaries, certification scope, incident-response procedures, and update-support commitments."
      relatedQuestionRefs: [QE008]
    - type: stale
      severity: minor
      topic: rollout
      missingEvidence: "Current 2026 rollout status for Aira Power installations, German availability, and the production maturity of the whole-home energy-management platform."
      whyItMatters: "The retained launch coverage describes planned or early availability, so current installed-base evidence is needed to distinguish roadmap from scaled product."
      diligencePath: "Request a current SKU and market availability matrix, installations by product and country, production volumes, and release notes for Aira Intelligence."
      relatedQuestionRefs: [QE004, QE007]
