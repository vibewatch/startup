chapter:
  number: 6
  title: Customers
  summary: >-
    Aira's public customer proposition is direct-to-consumer home electrification, with household financing, installation, software control, and aftercare combined in one journey. Public reviews and operating-capacity indicators show real use and a mixed service record, but the retained evidence does not disclose customer count, retention, renewal, or concentration.
sections:
  - id: customer-base-and-segments
    title: Customer base and segments
    body: >-
      Aira is principally a residential, business-to-consumer provider rather than an enterprise vendor. Multiples describes European households as the customer focus and a model that combines hardware, installation, subscriptions, and energy-related services across Germany, Italy, and the UK; The Eco Experts separately describes residential coverage across most of England and Scotland. The buyer, user, and payer are therefore usually the same household, although financing approval and the UK Boiler Upgrade Scheme affect affordability. Kinnevik's account adds a guided, vertically integrated purchase journey, Accumeo describes heat pumps adapting to household routines and tariffs, and Aira-issued academy material shows an external trade-training channel supporting delivery. None of these sources segments installed customers by country, home type, income, revenue band, or product bundle, so public reach should not be mistaken for a measured customer mix.
    claimRefs: [CU001, CU002, CU003, CU009, CU010, CU012, CU013]
    tableRefs: [TU001]
  - id: adoption-and-customer-proof
    title: Adoption trajectory and customer proof
    body: >-
      The strongest public adoption evidence is indirect. Multiples reports that Aira had opened 11 regional sales and installation hubs during 2024 and was visiting thousands of homes monthly by October 2024, but neither metric is an installed-customer count. The current fetched Trustpilot page carries a 4.3-of-5 title and includes both multi-year service relationships and recent installations. An older Eco Experts review reported 4.4 from 634 reviews, with 77% five-star, while the academy article reports training capacity and completions that may support future delivery. These are useful demand, engagement, and capacity signals with different periods and denominators; they cannot be combined into a growth rate. The sampled customer record is also mixed: responsive repairs and smooth installations coexist with recurring faults, unresolved commissioning issues, and allegations of poor installation quality.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU013, CU014]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      Public evidence supports an ongoing service relationship but not quantified retention. Reviewers describe annual or two-year servicing and support more than two years after installation, while Aira's software job description says its applications serve both household users and installers. The 15-year guarantee and monthly-payment proposition could reduce purchase friction and create a long-lived relationship, but they are contractual promises rather than observed renewal or net-revenue-retention results. Adverse reviews identify the counter-risk: installation variance, repeat engineer visits, unresolved hardware faults, and weak communication can erode trust after conversion. Expansion can move from heat pumps into solar, storage, tariffs, or other home-energy products, yet no retained source reports attach rates, repeat-purchase rates, cohort retention, contract-length distribution, or top-customer and channel concentration. Those omissions prevent a defensible durability or concentration judgment.
    claimRefs: [CU003, CU004, CU006, CU007, CU008, CU011, CU015]
    figureRefs: [FU001]
