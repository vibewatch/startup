      - ["German and Italian residential households", "Household buyer, payer, and end user", "Direct-to-consumer sales and installation hubs in Germany and Italy", "Heat-pump-led home electrification with monthly-payment positioning", "Part of Aira's three-country operating footprint; installed base undisclosed", "No country customer count, conversion, revenue, or retention data"]
      - ["Affordability-sensitive UK households", "Household borrower supported by financing and potentially the Boiler Upgrade Scheme", "Aira finance plan plus the GBP7,500 UK grant described by The Eco Experts", "Spread installation cost and lower upfront purchase friction", "Potential conversion lever, but approval and take-up are not reported", "No financing approval rate, attach rate, default data, or financed-customer retention"]
