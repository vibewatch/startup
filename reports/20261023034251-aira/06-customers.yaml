          touchpoints: ["Mobile app", "Heating controls", "Installer applications"]
        - id: service
          label: "6. Service, warranty, and expansion"
          detail: "Aftercare and the 15-year guarantee can sustain the relationship; solar, batteries, and tariffs create expansion surfaces, but retention and attach rates are undisclosed."
          touchpoints: ["Engineer visits", "Guarantee", "Solar and storage", "Energy tariffs"]
    approximationNotes: "The sequence is synthesized from retained public descriptions and reviews; it does not imply measured stage conversion, duration, or retention."
    claimRefs: [CU003, CU004, CU009, CU010, CU011, CU015]
callouts:
  - calloutType: risk
    title: Retention and concentration remain unmeasured
    body: >-
      Review volume and operating capacity demonstrate customer contact, not renewal or durable economics. Diligence still needs customer counts by country and cohort, contract terms, churn, NRR or repeat-purchase behavior, product attach rates, and customer or channel concentration.
    claimRefs: [CU015]
