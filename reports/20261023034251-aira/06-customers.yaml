      - ["Trustpilot reviewer, 15 September 2026", "UK household", "Installed system with recurring water-pressure issue", "Production use", "Several engineer visits, but prompt and helpful staff", "Single self-reported experience; fault incidence and resolution durability unknown"]
      - ["Trustpilot reviewer, 9 September 2026", "UK household", "Surveyed and completed installation", "Production installation under dispute", "Alleged material deviations from plan, leaks, damage, and delayed follow-up", "Unverified customer account; no independent inspection or final resolution in the source"]
      - ["Trustpilot reviewer, 22 September 2025", "UK household", "Installed heat pump and post-installation support", "Production use", "Praised efficiency and service but reported floor-cutting remediation", "Single unprompted review; no standardized outcome measurement"]
      - ["Customer quoted by The Eco Experts, August 2025", "UK household", "One year after installation", "Production use", "Reported a positive overall experience and uninterrupted evening hot water during installation", "Selected quotation in an affiliate-supported review; not a representative cohort"]
    notes: "Partial sample of five public 2025-2026 review excerpts; reviewer names are omitted, outcomes are self-reported, and the sample is not representative of Aira's full customer base."
    enumerationScope:
      coverage: sample
      basis: "Five public household-review excerpts retained across Trustpilot and The Eco Experts, spanning positive, mixed, and adverse experiences."
    claimRefs: [CU006, CU007, CU008, CU014]
