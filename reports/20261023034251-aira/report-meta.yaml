companyProfile:
  summary: >-
    Aira is a Stockholm-based private clean-energy company founded in 2022 that combines heat-pump hardware,
    installation, software controls, financing, and energy services for European households. Its vertically integrated
    model has expanded across Germany, Italy, and the UK, but public evidence does not yet establish durable unit
    economics or customer retention at scale.
