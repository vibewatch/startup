      - number: '6.5'
        title: Adverse Evidence and Deployment Risk
        blocks:
          - type: paragraph
            body: >-
              The main adverse signals in the customer chapter are category-level rather than direct churn events.
              First, PHTI concluded that ambient scribes likely improve burnout but that financial impact remains
              unclear. That undercuts any simplistic assumption that high physician satisfaction automatically
              translates into provider-system ROI. Second, The BMJ argued that stronger evidence is still needed to
              ensure ambient scribes do not compromise care quality. Third, the Sharp HealthCare consent litigation
              shows that ambient-AI deployment can create customer-level legal and reputational risk if recording and
              consent workflows are poorly governed.


              These risks matter even if they do not yet disprove Ambience's PMF. They show the boundary conditions of
              adoption: high-quality product and eager clinicians are not enough by themselves. Customers also need
              governance, legal clarity, and proof that the technology scales into safe and economically justified
              standard operating procedure. For investors, the thesis-break risk is therefore not that no one wants the
              product; it is that rollouts could stall, renewals could weaken, or certain customer segments could become
              economically or legally harder to serve than the logo list suggests.
