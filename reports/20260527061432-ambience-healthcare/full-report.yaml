  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Workflow coverage and module map
        blocks:
          - type: paragraph
            body: >-
              Ambience's current product pages frame the company as an AI platform that covers the full clinical
              workflow rather than a transcription-only ambient scribe. The platform is organized around pre-visit,
              in-visit, and post-visit work. Pre-visit tools center on context assembly: patient summaries,
              problem-oriented chart synthesis, hospital-stay summary, and schedule and list synchronization from the
              EHR. In-visit tooling centers on ambient listening, multi-speaker attribution, translation for
              documentation, Chart Chat question answering, medication-order support, and patient-instruction
              generation. Post-visit tooling focuses on structured note assembly, discharge and referral outputs, and
              coding-aware documentation that is meant to improve revenue integrity and compliance. Across the product
              surface, Ambience repeatedly positions itself as serving both clinician experience and downstream
              documentation, CDI, and billing workflows. That breadth matters because it is the company's clearest
              product differentiation claim versus vendors that market a narrower note-capture layer.
