  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Publicly described architecture layers run from EHR and chart inputs through chart-aware intelligence and
      coding/compliance outputs, with partner surfaces carrying much of the observable technical signal.
    data:
      layers:
        - label: Layer 1 — Source systems
          detail: >-
            Epic, Cerner, Athena, and the patient's longitudinal chart provide schedules, problem lists, prior notes,
            diagnostics, and encounter context.
        - label: Layer 2 — Encounter capture
          detail: >-
            Ambient Scribe captures live encounter audio, supports multiple speakers, and can translate conversations
            for documentation.
        - label: Layer 3 — Clinical intelligence
          detail: >-
            Patient Summary, Chart Chat, chart-aware A&P, diagnostics, and Conditions Advisor synthesize chart context
            before or during care.
        - label: Layer 4 — Coding / compliance
          detail: >-
            ICD-10, E/M, HCC, CDI, and related validators shape documentation toward compliant, audit-ready billing
            support.
        - label: Layer 5 — Workflow outputs
          detail: >-
            Structured notes, referrals, patient instructions, and post-visit artifacts are returned to clinician
            workflow and the EHR.
        - label: Cross-cutting partner surfaces
          detail: >-
            Epic Toolbox, Cerner DynDoc, and Microsoft Marketplace / Azure OpenAI form the strongest visible external
            integration and distribution surfaces.
    approximationNotes: >-
      This stack is inferred from public product and launch materials. Ambience does not publicly disclose model-serving
      topology, data pipelines, or rollback architecture.
    claimRefs:
      - CE001
      - CE007
      - CE008
      - CE009
      - CE010
      - CE020
      - CE021
      - CE024
      - CE027
      - CE039
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      The public workflow begins with chart preparation, runs through ambient capture and chart Q&A during the visit,
      and ends with coding-aware documentation outputs and clinician review.
    data:
      nodes:
        - id: n1
          label: Open schedule and chart context
          detail: >-
            Schedule Sync, problem-list sync, patient-list sync, and patient-summary features prepare the clinician
            before the encounter.
        - id: n2
          label: Start encounter recording
          detail: Ambient Scribe captures the live visit with multiple-speaker attribution and translation support.
        - id: n3
          label: Ask chart questions during care
          detail: Chart Chat sits inside the EHR to answer chart, risk-score, or clinical-content questions.
        - id: n4
          label: Generate structured note draft
          detail: >-
            The system produces specialty-tuned, coding-aware documentation and can assemble HPI, A&P, referrals, and
            instructions.
        - id: n5
          label: Surface coding and CDI checks
          detail: ICD-10, E/M, HCC, and related validators support documentation integrity before sign-off.
        - id: n6
          label: Clinician reviews and finalizes
          detail: The clinician remains the final reviewer before the note and associated outputs are committed to workflow.
      edges:
        - from: n1
          to: n2
          label: prepares
        - from: n2
          to: n3
          label: adds context-aware assistance
        - from: n3
          to: n4
          label: supports note creation
        - from: n4
          to: n5
          label: feeds
        - from: n5
          to: n6
          label: requires review
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE024
