          margin.
      - - A premium to pure-note vendors is plausible because Ambience sells workflow depth, not just transcription.
        - >-
          Show that attach rates and renewals actually scale with workflow breadth instead of increasing implementation
          drag.
      - - >-
          Current price already discounts a large portion of the premium thesis despite limited public financial
          evidence.
        - >-
          Provide audited ARR above $50 million, strong retention, and a clear path to 2028 ARR that supports the entry
          multiple.
      - - Bundling from Epic and Nuance can compress pricing before Ambience proves full platform monetization.
        - Demonstrate stable win rates and durable module attach in Epic-heavy accounts despite bundled alternatives.
    notes: >-
      The table separates business-quality arguments from entry-price arguments so the recommendation stays
      valuation-sensitive.
