  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The ambient clinical documentation market has moved from an exploratory category to a structured share
              battle. Menlo Ventures reporting as cited by MedCity News and Becker's put 2025 share at roughly Nuance
              DAX 33%, Abridge 30%, Ambience 13%, Suki 10%, and a long tail of others at 14%. That concentration
              matters: the top two vendors already control most of observed enterprise spend, and both have structural
              advantages that are difficult for smaller vendors to replicate quickly. Nuance rides Microsoft
              distribution and EHR embed depth; Abridge rides fundraising velocity, enterprise momentum, and a strong
              product narrative around linked evidence and multilingual, multi-setting workflows.


              Ambience is therefore not trying to win by being the default ambient note-taker. Its strongest thesis is
              that the market is moving from “scribe replacement” toward a broader clinical workflow and
              revenue-integrity platform. The company's AutoCDI and coding-aware capabilities, paired with specialty
              coverage and enterprise implementation experience, position it against buyers who care about more than
              just visit-note transcription. That creates direct overlap with Abridge and DAX in large health systems,
              partial overlap with Suki, Nabla, and DeepScribe in assistant-first deployments, and increasing overlap
              with Epic, Oracle, and Commure as platform incumbents extend ambient features inside larger clinical
              software stacks.


              The competitive field also includes substitutes and likely entrants. Human scribes and transcription
              remain the status quo in some environments; AWS HealthScribe and general LLM tooling lower the barrier for
              internal build; and EHR vendors can increasingly bundle ambient capabilities into existing platform
              relationships. The result is a landscape where Ambience competes simultaneously against direct ambient
              peers, adjacent workflow platforms, platform incumbents, internal-build options, and entrenched status-quo
              workflows.
