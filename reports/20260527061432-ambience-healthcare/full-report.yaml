    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >
              Ambience Healthcare is a private healthcare artificial intelligence company headquartered at 550
              California Street, San Francisco, California. Founded in 2020 by co-founders Mike Ng and Nikhil Buduma,
              the company's mission is to free clinicians from the administrative burden of the electronic health record
              (EHR) by using ambient AI to automate documentation, coding, and clinical documentation integrity (CDI).
              The company operates as a Series C-stage unicorn following its $243 million Series C round closed July 29,
              2025 at a $1.25 billion post-money valuation.


              Ambience's business model is a B2B enterprise SaaS architecture with annual contracts priced per clinical
              full-time equivalent (FTE). Third-party analyst estimates (Sacra) place base AutoScribe pricing at
              $2,800–$3,200 per provider annually, with the full AI suite reaching $4,000–$5,000 per provider per year
              when adding AutoCDI, AutoAVS, and AutoRefer modules. A one-time implementation fee covers EHR integration
              and specialty template tuning. The platform currently serves outpatient (ambulatory), emergency
              department, and inpatient settings and supports more than 100 clinical specialties. Revenue and ARR are
              not publicly disclosed; analyst estimates are discussed in the cover metrics section.


              The product portfolio spans the entire clinical workflow: AutoScribe (ambient real-time AI scribe),
              AutoCDI (point-of-care ICD-10 and CPT coding assistance), AutoAVS (patient after-visit summaries),
              AutoRefer (specialty referral letters), Patient Recap/AutoPrep (pre-visit chart summarization), and the
              recently launched Chart Chat for Nursing (natural language patient record queries). The platform
              integrates natively with Epic, Oracle Cerner, athenahealth, and several other major EHRs through embedded
              widgets that write to discrete EHR fields rather than creating text blobs.
