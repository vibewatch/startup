      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >
              The procurement architecture for ambient AI clinical documentation is multi-stakeholder and notably unlike
              consumer software. The buyer is a health system's clinical and technology leadership, not the individual
              physician. Specifically, procurement decisions at the enterprise level are typically led by the Chief
              Medical Information Officer (CMIO) or Chief Medical Officer (CMO) as the clinical champion, the Chief
              Information Officer (CIO) as the technology integration owner, and the Chief Financial Officer (CFO) or VP
              of Finance as the budget authority. Revenue cycle leaders and medical coding directors are additionally
              influential when the contract scope extends to CDI or coding automation. Individual physicians are the
              primary users and are the principal adoption lever—utilization and satisfaction rates among physicians
              directly determine whether the health system expands, renews, or churns—but they rarely initiate or own
              the purchase.


              Payer relationships are indirect rather than direct: health systems pay Ambience on a per-clinician
              per-year SaaS contract, and the financial return they expect is a combination of clinician retention
              savings (replacing costly human scribes and reducing physician attrition driven by burnout), incremental
              revenue from improved CDI/HCC capture, and reimbursement uplift from more complete documentation
              supporting appropriate E/M level coding. The Menlo Ventures data show health systems drove approximately
              $1 billion of the $1.4 billion in total healthcare AI spending in 2025, versus only $280 million from
              outpatient/physician-group buyers and $50 million from health insurance payers. This confirms that large
              nonprofit integrated delivery networks are both the largest spenders and the earliest adopters.


              The AJMC study (January 2026, Emory University) provides the most rigorous adoption-pattern data: among
              the 2,784 U.S. hospitals using Epic EHR in June 2025, 62.6% had adopted an ambient AI tool. Adopters were
              disproportionately large, nonprofit, metropolitan, financially stronger (positive operating margins), and
              higher-workload hospitals. For-profit hospitals had a markedly lower adjusted adoption probability (28.8%)
              versus nonprofits (70.2%). This data strongly implies that Ambience's sweet spot—large academic medical
              centers and integrated delivery networks—is already the primary adoption cohort, and penetration growth
              must increasingly come from mid-market systems with thinner margins or smaller for-profit hospital chains,
              where adoption economics are less proven.


              Physician-group and specialty-practice buyers represent a secondary but growing segment, particularly in
              specialties with high documentation complexity relative to reimbursement (oncology, psychiatry, emergency
              medicine, gastroenterology). These groups may have shorter sales cycles than full health systems but
              smaller contract values and potentially higher churn risk. Ambience's claim of 200+ specialty support and
              demonstrated performance in complex specialties (97% E/M coding accuracy in cardiology, 99% in oncology
              per company-published data) addresses this segment's requirements more credibly than generalist scribe
              products. The adoption path for specialty groups typically runs through the health system umbrella if they
              are affiliated, or through a direct commercial relationship for independent groups.
