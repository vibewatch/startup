            body: >-
              The 2025-2026 release cadence shows the company moving deliberately away from a single-documentation use
              case into a broader intelligence stack. August 2025 added Epic Toolbox alignment and the first Chart Chat
              launch inside the EHR. October and November 2025 added inpatient CDI and Conditions Advisor, both
              explicitly aimed at documentation integrity and clinical complexity capture inside hospital workflows.
              February 2026 expanded chart awareness across patient summary, assessment and plan, diagnostics, and
              coding, while April 2026 introduced Chart Chat for Nursing as a pilot-stage nursing copilot with Cleveland
              Clinic. Also in April 2026, Ambience held its inaugural Apex Summit and announced a multiyear platform
              roadmap spanning five domains: clinical workflows, revenue cycle and integrity, patient engagement (via a
              new AI patient agent named Kait that monitors symptom adherence and care escalation between visits), care
              orchestration (including Project Orchestra with Cleveland Clinic and Project Archimedes with Mayo Clinic),
              and clinical research powered by structured reasoning traces. CEO Nikhil Buduma described 2026 as the
              "year of maturity," marking a shift from pilot-stage experimentation to proven, scalable infrastructure.
              Alongside these product announcements, Ardent Health confirmed an enterprise rollout across 30 hospitals
              and 280 care sites in six states following a pilot reporting 90% clinician utilization and a 45% reduction
              in documentation time. This cadence suggests Ambience is deepening workflow share within large
              health-system accounts while simultaneously widening the platform's conceptual scope well beyond ambient
