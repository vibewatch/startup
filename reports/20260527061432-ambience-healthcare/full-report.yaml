  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Definition
        blocks:
          - type: paragraph
            body: >
              Ambience Healthcare straddles three adjacent but analytically distinct spend categories that must be
              bounded separately before any sizing attempt can be credible. The first and most mature category is
              ambient clinical scribing—the real-time AI capture and drafting of clinical encounter notes—where the
              product is sold on a per-provider per-year SaaS basis to health systems. The second category is
              AI-assisted clinical documentation integrity (CDI) and computer-assisted coding (CAC), which generates
              revenue by improving ICD-10/CPT code capture, HCC risk-adjustment accuracy, and audit defensibility. The
              third and broadest category is the ambient clinical intelligence (ACI) platform market, which encompasses
              scribing, CDI, coding, nursing workflow automation, pre-visit prep, post-visit summaries, referral
              letters, and real-time decision support—essentially the full ambient AI clinical operating system that
              Ambience describes as its long-term product architecture.


              The primary status-quo substitutes for ambient scribing are: (1) human medical scribes (virtual or
              in-person), who cost health systems an estimated $33,000–$65,000 per scribe per year in salary plus
              management overhead; (2) structured voice dictation platforms such as Dragon Medical One or M*Modal,
              costing $200–$500 per provider per month and requiring the clinician to pause care and actively narrate;
              and (3) unassisted EHR typing, which Sinsky et al. (2016, Annals of Internal Medicine) estimated consumes
              more than half of a physician's office time. For CDI and coding, traditional substitutes include in-house
              medical coding teams and outsourced healthcare BPO services billed per coded record or
              full-time-equivalent.


              Spend excluded from Ambience's direct market includes: broad EHR licensing (Epic, Oracle Cerner) that
              bundles documentation infrastructure without AI generation; generic hospital IT and cybersecurity budgets;
              clinical decision support tools unrelated to documentation; and non-U.S. markets (Ambience currently
              operates exclusively in the United States). Adjacent markets that create expansion opportunity but should
              not inflate the current TAM include remote patient monitoring, prior authorization automation, and
              AI-enabled patient engagement, all of which share infrastructure with ambient documentation but have
              separate buyers and separate procurement cycles.


              The ACI platform frame is important for valuation purposes because it is the thesis that justifies
              Ambience's $1.25B Series C valuation—not merely an AI scribe company, but the orchestration layer between
              the clinician and the EHR across the care episode. That thesis is directionally supported by product
              evidence (200+ specialties, Epic/Cerner/athenahealth native integrations, AutoCDI, AutoAVS, AutoRefer) but
              remains aspirational for most current deployments, which center on ambient scribing as the primary
              workflow entry point.
