      - number: '4.5'
        title: Capital adequacy, financing dependency, and verdict
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is clearer than operating disclosure. The 2024 SEC Form D records a $70 million
              offering with $54,999,916 sold and a first sale date of 2023-12-08, while TechCrunch described that round
              as a $70 million Series B and reported roughly $100 million total capital raised at the time. The 2025 SEC
              Form D records a $190 million offering with $139,999,680 sold and a first sale date of 2025-07-01.
              Separately, Ambience's official July 2025 announcement described a $243 million Series C intended to scale
              the platform for health systems. Together, those sources show substantial equity backing and a plausible
              staged-close explanation for why the filed sold amount is below the headline announced round size.


              What they do not show is current cash. Ambience has not publicly disclosed cash on hand, monthly burn,
              runway, or debt covenants in the reviewed sources. Public materials also do not reveal credit facilities,
              project-finance structures, or other non-equity financing obligations, so the visible financing record is
              equity-led. That lowers balance-sheet complexity but keeps financing dependency unresolved: as long as the
              company is expanding across inpatient, ED, coding, compliance, and enterprise deployment, outside
              investors still lack the inputs needed to determine how long the current capital base lasts.


              The financial verdict from public evidence alone is therefore constructive but incomplete. Ambience
              appears to have a credible enterprise revenue model, meaningful reimbursement-oriented upsell paths, and
              strong flagship-customer proof. It also has enough public capital support to keep scaling. But the lack of
              disclosed revenue quality metrics, margin data, retention data, burn, cash, and concentration data
              prevents a strict underwriting call. The correct public-only posture is to view Ambience as commercially
              promising and financially under-disclosed: attractive enough to diligence further, not transparent enough
              to underwrite on secondary evidence.
