  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Public Footprint
        blocks:
          - type: paragraph
            body: >-
              Ambience's visible customer base skews heavily toward enterprise health systems and other institutionally
              complex provider organizations. The named-account list includes large not-for-profit health systems,
              academic or innovation-forward systems, regional integrated networks, and a smaller layer of
              specialty-focused providers. Publicly visible proof points include Cleveland Clinic, Houston Methodist,
              St. Luke’s Health System, MultiCare, John Muir Health, Ardent Health, and Onvida Health. Specialty and
              channel expansion is also visible in Midi Health, Pediatric Associates, Alpine Physician Partners, and
              Eventus WholeHealth. This is a materially different customer profile from bottom-up ambient tools that
              rely on self-serve physicians or solo practices.


              The implication is twofold. First, Ambience has won buyers that have real procurement discipline and
              complex workflow requirements, which is a strong PMF signal. Second, it also means the public customer
              record is biased toward high-ACV, low-count accounts. That can be excellent for enterprise credibility,
              but it raises concentration and renewal importance. The broadest defendable public count remains the 40+
              health systems disclosed around the July 2025 Series C, although the growing list of 2026 named rollouts
              suggests the true live footprint is now larger than that public floor.
