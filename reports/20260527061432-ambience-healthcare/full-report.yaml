  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Audited ARR or recognized revenue comes in well below public estimates
        - Sub-$50M recurring revenue or materially weaker recognized revenue conversion than the market assumes
        - Breaks the idea that current pricing reflects a tolerable forward multiple
        - Do not support a new primary round at or above the current price
      - - Epic / Nuance bundling hurts win rates in Epic-heavy systems
        - Meaningful deterioration in Epic-based pipeline conversion or renewal confidence
        - Undercuts the distribution and monetization thesis
        - Re-rate exit multiple assumptions toward public-comp norms
      - - CDI and coding modules fail to show measurable attach or ROI
        - No credible attach-rate or ROI dataset from paying cohorts
        - Removes the main rationale for paying more than scribe-like multiples
        - Shift stance toward avoid at current price
      - - Core unit economics remain undisclosed into the next financing window
        - No audited gross margin, NRR, concentration, or preference disclosure
        - Keeps the risk premium too high for venture-style return underwriting
        - Stay at research-more regardless of brand strength
      - - Material privacy or compliance issue emerges
        - Regulator inquiry, customer pause, or audit-linked revenue controversy
        - Compresses both growth and exit multiple
        - Treat as thesis break until remediation evidence is supplied
    notes: >-
      These triggers intentionally convert abstract concerns into monitorable events that can change the investment
      decision.
    claimRefs:
      - CV025
      - CV026
      - CV028
      - CV029
