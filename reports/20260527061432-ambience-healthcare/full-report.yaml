      - number: '8.4'
        title: Recommendation, thesis-break triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              At the current disclosed price, the recommendation is RESEARCH-MORE with an expensive valuation stance and
              a high risk rating. That call is deliberately price-sensitive. The company may absolutely become worth
              more than $1.25 billion; the public record simply does not show enough to justify paying that price today
              with confidence. The downside case is multiple compression into the range where public healthcare software
              trades if revenue growth stalls or if the category bundles into Epic and Nuance. The upside case requires
              Ambience to prove durable CDI and coding attach, real renewal power, and a cleaner disclosure package.
              That is why the diligence list is not cosmetic. Without audited ARR, margin, concentration, and preference
              data, the difference between “great company” and “bad entry price” cannot be resolved. Price discipline,
              not admiration for the product, is the main open question for this chapter and for any near-term IC
              process. Prioritize clinical quality audits and ARR verification.
