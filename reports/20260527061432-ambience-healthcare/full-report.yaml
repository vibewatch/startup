    rows:
      - - Large Nonprofit Health System (IDN)
        - CMIO, CIO, CFO
        - Attending physicians, residents, NPs, PAs
        - Health system operating budget / IT budget
        - Ambient note capture in Epic/Cerner; CDI/HCC alerts at point of care
        - Clinician burnout KPIs; competitive pilot against incumbent; KLAS evaluation
        - Enterprise multi-year; estimated $2M–$10M+ annually for large IDNs
      - - Academic Medical Center / Teaching Hospital
        - CMIO, VP Medical Affairs, CIO
        - Attending and resident physicians across 50+ specialties
        - Academic health system IT and clinical operations budget
        - Complex specialty documentation; GME supervision workflow; research note quality
        - Faculty satisfaction scores; research compliance; peer institution adoption (e.g., Cleveland Clinic, UCSF)
        - Similar scale to IDN; often drives regional/national validation data for other buyers
      - - Regional Community Hospital System (5–20 hospitals)
        - CMO, CIO, CFO at system level
        - Primary care and specialist physicians
        - System-level shared services budget
        - Ambulatory and ED documentation; simplified CDI
        - Margin pressure; physician retention risk; peer hospital announcements
        - Mid-tier enterprise; smaller than flagship IDNs but growing fastest per AJMC adoption data
      - - Specialty Physician Group (independent)
        - Practice Administrator, Medical Director
        - Specialist physicians (oncology, psych, GI, ENT)
        - Physician group P&L
        - High-complexity specialty documentation; prior authorization letters; specialty coding
        - High documentation complexity relative to reimbursement; burnout in under-served specialties
        - Per-provider SaaS; smaller ACV than health system
      - - For-Profit Hospital Chain
        - C-suite (CFO leads given margin focus)
        - Hospitalists, ED physicians
        - Corporate or facility-level budget
        - ED and inpatient documentation; volume throughput
        - ROI proof required before adoption; slower sales cycle
        - Lower adoption probability (28.8% adjusted) per AJMC; price sensitivity high
      - - Healthcare Insurer / Payer (CDI adjacency)
        - CMO, VP Medical Management
        - Nurse reviewers, coding analysts
        - Medical management budget
        - Prior authorization documentation review; risk-adjustment audit support
        - HCC capture accuracy; Medicare Advantage risk-adjustment
        - Nascent; Menlo Ventures data shows payers at only $50M of $1.4B 2025 spend
    notes: >-
      Segment definitions are derived from Menlo Ventures October 2025 market structure, AJMC adoption study (June
      2025), and Ambience published customer profiles. Contract size indicators are estimates based on per-provider
      pricing ranges and health system sizes; actual contract values are not publicly disclosed.
