      - number: '8.2'
        title: Current price versus public proof
        blocks:
          - type: paragraph
            body: >-
              On public estimates, Ambience’s $1.25 billion July 2025 price implies roughly 42x ARR on the lower Sacra
              figure and still nearly 20x on the higher GetLatka figure. That is not impossible for a category-defining
              AI asset, but it leaves very little room for disclosure gaps. Ambience has not publicly disclosed GAAP
              revenue, gross margin, NRR, burn, or preference structure, so outsiders cannot tell whether the company is
              already compounding efficiently enough to defend that premium. Meanwhile, the most supportive public
              customer evidence—Cleveland and St. Luke’s—shows workflow value, but not the recurring financial profile
              that late-stage investors need. In other words, public proof currently validates the product and the
              category, but it does not fully validate the price.
            claimRefs:
