      - number: '3.4'
        title: Switching Costs, Distribution Power, and Multi-Homing
        blocks:
          - type: paragraph
            body: >-
              Ambient AI has moderate switching costs: high enough to create friction after deployment, but not high
              enough to guarantee durable lock-in. The main switching-cost drivers are implementation work inside the
              EHR, specialty template tuning, clinical governance review, privacy/security approvals, provider
              retraining, and the operational burden of changing note workflows once a system has standardized.
              Cleveland Clinic's competitive bake-off illustrates the reality: health systems are willing to run
              structured pilots with multiple vendors, compare clinician adoption rates closely, and then standardize
              once they believe one vendor has materially better fit.


              Distribution power therefore matters as much as model quality. JAMA Network Open research showed that
              62.6% of Epic hospitals had adopted ambient AI by mid-2025, with uptake concentrated in larger,
              financially healthier nonprofits. That finding implies the procurement battle increasingly happens within
              existing EHR governance and executive sponsorship structures. Microsoft/Nuance, Epic, and Oracle benefit
              from preexisting workflow access; Ambience, Abridge, and others must either match that embed depth or win
              decisively on enterprise outcomes and specialty support.


              Ambience's strongest switching-cost and trust assets are its reference customers and workflow depth. The
              Cleveland Clinic exclusive partnership, St. Luke's/KLAS proof points, and broader health-system footprint
              give it credibility that smaller peers lack. But the category still multi-homes during evaluation periods,
              and most contracts are too young to prove that multi-year renewal behavior is firmly locked. Ambience's
              practical moat is therefore a combination of referenceability, workflow breadth, and implementation
              know-how rather than a hard technical lock-in.
