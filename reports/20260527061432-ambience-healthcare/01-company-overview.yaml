- calloutType: risk
  title: Competitive Consolidation Threatens Market Position
  body: 'The ambient AI market hosts 60+ solutions per PHTI and is expected to narrow to four to six survivors. Epic''s decision to integrate Microsoft/Nuance DAX natively into its EHR creates a formidable bundled competitor—Epic powers a majority of U.S. hospital EHR environments. Third-party ambient AI vendors, including Ambience, face the risk of being commoditized or displaced by a native EHR module that health systems receive through existing Epic relationships.

    '
