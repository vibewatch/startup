- id: funding-history
  title: Funding History and Capital Structure
  body: 'Ambience Healthcare has raised four known rounds of institutional capital since its 2020 founding, totaling approximately $343 million per official company communications as of September 2025. Third-party trackers (Sacra, Fierce Healthcare) cite totals between $345 million and $373 million, a minor discrepancy reflecting different treatments of undisclosed seed capital.


    The seed round was raised in 2020; the amount has not been publicly disclosed. Known seed investors include Kleiner Perkins, Andreessen Horowitz (a16z), OpenAI Startup Fund, Human Capital, Martin Ventures, AIX Ventures, AirTree Ventures, and notable angels including John Doerr (Kleiner Perkins), Jeff Dean (Google DeepMind), Richard Socher (Salesforce AI), and Pieter Abbeel (UC Berkeley). In April 2022, Ambience closed a Series A of approximately $30 million led by Andreessen Horowitz; PitchBook estimated the post-money valuation at approximately $126 million, the only historical valuation benchmark on record. In February 2024, the company closed a $70 million Series B co-led by Kleiner Perkins and the OpenAI Startup Fund, with Andreessen Horowitz and Optum Ventures also participating, bringing cumulative capital raised to approximately $100 million.


    On July 29, 2025, Ambience announced a $243 million Series C co-led by Oak HC/FT and Andreessen Horowitz at a $1.25 billion post-money valuation. New investors in the Series C included Frist Cressey Ventures, Town Hall Ventures, Smash Capital, Georgian, and Founders Circle Capital. No secondary transactions, debt facilities, or credit lines have been publicly disclosed. The Series C conferred unicorn status and represents one of the largest healthcare AI raises in 2025.

    '
