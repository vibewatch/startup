- id: founders-leadership-governance
  title: Founders, Leadership, and Governance
  body: 'Ambience Healthcare was co-founded in 2020 by Michael (Mike) Ng and Nikhil Buduma, who first met as students at MIT and share a personal connection to healthcare through medical traumas they each experienced earlier in life. Prior to Ambience, both co-founders built Remedy Health, an AI clinical diagnostics startup that focused on catching hidden high-risk diagnoses. Remedy Health did not raise beyond the seed stage and closed in 2020 the same year Ambience was founded.


    Mike Ng served as Chief Executive Officer from Ambience''s founding through September 22, 2025, when the company announced a planned leadership transition. On that date, Nikhil Buduma assumed the role of Chief Executive Officer, focusing on day-to-day operations, growth, and product innovation. Ng transitioned to the full-time executive roles of President and Chairman, retaining responsibility for long-term vision, strategy, and investor relationships. Buduma is recognized as one of the early pioneers in deep learning research—he authored "Fundamentals of Deep Learning" (O''Reilly, 2017), widely considered the first major textbook on modern AI—and has been named among Becker''s Hospital Review''s "Rising Stars: 100 Healthcare Leaders Under 40."


    On February 9, 2026, Ambience appointed Mike Valli as Chief Revenue Officer and Chief Value Officer. Valli previously served as Chief Commercial Officer at symplr and held senior executive roles at Optum spanning over a decade. The company also added Richa Gupta, MBBS, MHSA as VP of Care Transformation and Jeffrey Gerson as VP of Marketing in the same announcement. Board governance details are not publicly disclosed; known institutional representation is provided by lead investors Oak HC/FT (Vig Chandramouli, Partner) and Andreessen Horowitz (Julie Yoo, General Partner), both of whom serve as active investor sponsors. Key-person risk is moderate: the CEO transition in September 2025 was planned rather than abrupt, with both co-founders remaining in the C-suite, though Ng''s departure from the CEO chair removes the founding operational leader.

    '
