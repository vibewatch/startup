  - CO050
  - CO051
- calloutType: insight
  title: CEO Transition Introduces Manageable but Real Key-Person Risk
  body: 'The planned September 2025 CEO transition from Mike Ng to Nikhil Buduma is a material organizational event occurring at maximum growth stage. Both co-founders remain in senior roles, reducing but not eliminating the transition risk. Buduma''s technical credibility and KLAS-validated client relationships mitigate the concern, but diligence should assess whether Buduma''s operator vs. scientist background is a fit for the increasingly commercial and enterprise-scaling demands of a 200+ person unicorn.

