- id: customer-traction
  title: Customer Traction, Scale, and Cover Metrics
  body: 'As of the July 2025 Series C announcement, more than 40 U.S. health systems had deployed Ambience''s AI platform. Named customer relationships confirmed through company and press sources include Cleveland Clinic, UCSF Health, Houston Methodist, Memorial Hermann Health System, St. Luke''s Health System (Boise, ID), Ardent Health, John Muir Health, The Oncology Institute, GI Alliance, Midi Health, Eventus WholeHealth, and Onvida Health. In February 2025, Cleveland Clinic announced an exclusive five-year partnership after completing a rigorous six-month competitive evaluation that pitted five ambient AI scribe vendors against each other using more than 300 clinicians across more than 80 specialties. Ambience achieved an 80% clinician adoption rate during the Cleveland Clinic pilot, versus an anecdotal 20–40% baseline for other scribes tested, along with a 32% increase in patient face time, a 49.6% reduction in after-hours documentation ("pajama time"), and a 25% decrease in note creation
    time.


    An independent KLAS Research study at St. Luke''s Health System, published in 2025, confirmed a 41% reduction in active documentation time, a 36% reduction in daily provider burnout, and a 22% increase in clinician/patient face time. Ambience achieved a 97.7 KLAS Spotlight Report score in the Ambient AI category as reported in September 2025. In October 2025, the KLAS Emerging Solutions Top 20 report ranked Ambience #1 for improving clinician experience and #3 for improving patient experience and outcomes. In February 2026, Ambience was named the 2026 KLAS/CHIME Trailblazer Award winner at ViVE 2026 in Los Angeles, recognizing innovation, clinical impact, and client success.


    Cover metrics: valuation $1.25 billion (July 2025); total raised ~$343 million (September 2025); ARR not disclosed by company (third-party estimates: $30M per Sacra in May 2025; $64.1M per GetLatka in September 2025); customers 40+ health systems (July 2025); headcount 200+ employees (September 22, 2025), approximately 212 per third-party data (November 2025); HQ San Francisco, CA. Revenue/ARR figures are unconfirmed analyst estimates and may not reflect actual contracted or recognized revenue.

    '
