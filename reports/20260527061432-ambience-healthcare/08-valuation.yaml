- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Ambience Series C (Jul 2025)
    - Private round vs public ARR estimates
    - $1.25B valuation; roughly 42x on $30M ARR or ~19x on $64.1M estimate
    - Direct current entry point
    - Core revenue numbers are third-party estimates, not audited public disclosures
  - - Abridge Series E (Jun 2025)
    - Private round vs contracted ARR
    - $5.3B valuation; roughly 45x on reported $117M contracted ARR
    - Best private category comp with larger disclosed scale
    - Contracted ARR is not the same as recognized revenue and Abridge has more public scale proof
  - - Nuance acquired by Microsoft (2021)
    - Strategic M&A transaction
    - $19.7B all-cash acquisition of a scaled healthcare voice and cloud asset
    - Shows strategic value ceiling for ambient / voice infrastructure
    - Broader and more mature asset than Ambience, so not a direct stage comp
  - - Tempus AI (May 2026)
    - Public market cap vs 2026 revenue guidance
    - $8.37B market cap; roughly 5x to 6x forward revenue
    - Useful public AI-healthcare software sanity check
    - Different business mix and diagnostics exposure
  - - Doximity (May 2026)
    - Public market cap vs FY2026 revenue
    - $3.56B market cap; roughly 5.5x trailing revenue
    - Useful public healthcare software sanity check for disclosed-scale businesses
    - Different workflow and business model from ambient clinical intelligence
  notes: Public comps use market-cap-to-revenue rather than fully normalized EV/revenue because consistent net-cash adjustments are not available in the current public source set.
