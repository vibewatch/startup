- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited recurring revenue
    - ARR bridge, recognized revenue conversion, and revenue mix by product
    - Needed to know whether the current multiple is 40x, 20x, or something else entirely
    - Finance room data request and auditor-backed ARR schedule
  - - Gross margin and inference cost
    - Hosting / model cost structure and gross margin by module
    - Determines whether growth can support premium software multiples
    - Finance and engineering diligence with cost walk
  - - Retention and concentration
    - Top-10 customer ARR, NRR, churn, and module attach by cohort
    - Base case depends on durable expansion inside large systems
    - Customer analytics request plus cohort export
  - - Cap table and preferences
    - Liquidation stack, pro rata rights, option refresh assumptions, and side-letter economics
    - Preference overhang can destroy apparent upside even if the company grows
    - Legal and finance diligence on term sheet and cap table
  - - Coding / CDI proof
    - Attach rate, ROI, and audit outcomes for post-note modules
    - This is the main premium-to-scribe justification
    - Revenue-cycle and customer-reference diligence
  - - Security / compliance reserves
    - Any incidents, insurance coverage, regulator contact, and compliance reserves
    - A material issue would hit both growth and valuation
    - Security diligence and customer legal-reference calls
  notes: These asks are the minimum package required to turn a narrative-rich opportunity into an underwritten investment decision.
