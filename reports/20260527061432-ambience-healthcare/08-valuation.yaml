- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR reaches roughly $200M to $250M by 2028, CDI/coding attach becomes real, and Epic bundling does not collapse pricing
    - At 10x to 12x exit multiples, value could reach roughly $2.0B to $3.0B and generate attractive but execution-heavy upside from the current entry
    - Needs strong retention, margin proof, and no major compliance setback
    - Possible but requires multiple public and private proof points not yet available
  - - Base
    - ARR reaches roughly $120M to $150M by 2028 with moderate attach and public-like exit multiples near 8x to 10x
    - Value lands near roughly $1.0B to $1.5B, implying limited upside after dilution from today’s price
    - Any slip in growth, pricing, or module attach erodes already thin return headroom
    - Most consistent with the current public evidence
  - - Bear
    - ARR stalls below roughly $80M, bundled competition compresses pricing, and public software multiples remain near today’s 5x to 6x range
    - Value can fall materially below the July 2025 price and set up a down-round or weak exit outcome
    - Bundling, slower renewals, weak module attach, or compliance drag can all trigger this path
    - Credible because the current multiple is high relative to disclosed proof
  notes: Ranges are intentionally approximate. Public evidence is insufficient to justify false precision on ARR, dilution, or exit multiple.
