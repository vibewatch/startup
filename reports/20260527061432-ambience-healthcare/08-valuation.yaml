- id: comparable-set-and-scenarios
  title: Comparable set and scenarios
  body: 'The cleanest private comp is Abridge, and it cuts both ways. Abridge’s 2025 Series E at $5.3 billion was undeniably expensive, but that price sat on much larger disclosed scale and a larger public footprint. Public healthcare software comps are less direct, yet still useful as exit anchors because they show where disclosed-scale businesses trade once the narrative gives way to public-markets discipline. Tempus and Doximity both sit around 5x to 6x revenue on available May 2026 data, far below Ambience’s implied private multiple. That does not mean Ambience should be priced at a public multiple today, but it does mean the current round only works if Ambience compounds into materially larger ARR while preserving a premium exit multiple. The scenario table therefore matters more than the headline round price: current pricing can still work, but only under a fairly demanding growth path. Put differently, the current valuation is not impossible; it is simply intolerant of slippage. A
    modest miss on ARR, slower module attach, or faster-than-expected bundling pressure can move Ambience from a premium private multiple toward public-comp territory very quickly. That asymmetry is why the scenario range is centered closer to capital preservation than to obvious outsized upside.'
