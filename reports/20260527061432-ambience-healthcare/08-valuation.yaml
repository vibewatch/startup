  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cap-table
    missingEvidence: Current cap table, liquidation preferences, pro rata rights, and any structured terms attached to the Series C.
    whyItMatters: Entry valuation alone is insufficient if preferences or seniority further compress common-equivalent upside.
    diligencePath: Request full cap table, term sheet, side letters, and management’s modeled dilution through the next financing.
    relatedQuestionRefs:
    - QV011
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: Audited ARR, recognized revenue, gross margin, inference cost, and module-level attach economics.
    whyItMatters: The recommendation cannot improve without knowing whether scale is profitable enough to defend the price.
    diligencePath: Obtain audited financials, ARR bridge, gross-margin walk, and unit economics by documentation, CDI, and coding modules.
    relatedQuestionRefs:
    - QV011
    - QV018
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Top-customer concentration, renewal schedules, NRR, and module attach by cohort.
    whyItMatters: The base case depends on durable enterprise expansion rather than just one-time marquee wins.
    diligencePath: Request ARR by customer cohort, top-10 concentration, NRR, module penetration, and win-loss by Epic status.
    relatedQuestionRefs:
    - QV011
    - QV031
    relatedTableRefs:
    - TV004
    - TV006
