callouts:
- calloutType: insight
  title: Ambient scribing is the beachhead, not the market
  body: 'The $600M ambient scribe market where Ambience holds 13% market share is only the current revenue anchor. The addressable
    opportunity in AI-assisted CDI, coding, and the broader ACI platform layer is 2–5× larger, and Ambience''s product architecture
    (AutoCDI, multi-specialty coding accuracy, EHR-native integrations) is purpose-built to capture that expansion. Health
    systems that deploy ambient scribing first are more likely to add CDI and coding modules from the same vendor, making
    scribe deployment a low-friction upsell funnel—if Ambience can demonstrate concrete revenue integrity ROI alongside its
    established burnout-reduction proof points.

    '
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM015
  - CM016
- calloutType: risk
  title: Financial ROI ambiguity constrains adoption at margin-sensitive hospitals
  body: 'The Peterson Health Technology Institute''s March 2025 analysis found consistent evidence that ambient AI scribes
    reduce clinician burnout, but no clear evidence of improved patient throughput, billing accuracy, or financial payback
    at the health-system level. This gap is a material constraint: hospitals with negative or thin operating margins (the
    majority of U.S. rural and government hospitals) have lower adjusted adoption probabilities. Ambience''s enterprise focus
    on large nonprofits mitigates near-term exposure, but as the easy-to-reach segment saturates, growth into margin-constrained
    markets will require hard financial ROI data that does not yet exist at scale.

    '
  claimRefs:
  - CM040
  - CM041
  - CM042
  - CM043
- calloutType: risk
  title: EHR vendor encroachment poses a medium-term distribution threat
  body: 'Microsoft Dragon Copilot (33% market share) is embedded in the same Epic, Cerner, and athenahealth ecosystems that
    Ambience depends on for distribution. As EHR vendors extend their own ambient AI features natively into platform fees,
    health systems may perceive less need for an independent vendor. Ambience''s defense rests on clinical quality, specialty
    depth, and CDI/coding bundling—but this is a competitive dynamic that requires ongoing monitoring and investment in EHR
    partnership differentiation.

    '
  claimRefs:
  - CM005
  - CM046
  - CM047
  - CM048
