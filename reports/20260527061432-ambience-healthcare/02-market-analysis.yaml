  rows:
  - - Ambient Clinical Scribing
    - AI-generated clinical encounter notes delivered SaaS per provider/year; EHR integration, specialty template configuration,
      ongoing model tuning
    - EHR base licensing (Epic/Cerner); hardware; non-AI transcription tools
    - CMIO/CMO (clinical champion); CIO (IT owner); CFO (budget authority) at health systems
    - Core current revenue category; ~$600M market in 2025 with ~13% Ambience share
  - - AI-Assisted CDI and Computer-Assisted Coding (CAC)
    - Point-of-care ICD-10/CPT suggestion, HCC risk-adjustment capture, E/M level guidance, coding audit support, all AI-generated
      at encounter time
    - Manual CDI staff outsourcing (BPO); retrospective coding review without AI; generic NLP without physician-facing workflow
    - VP Revenue Cycle; Medical Coding Director; CFO for ROI decisions
    - AutoCDI module; direct adjacency with strong cross-sell economics within existing scribe contracts
  - - Ambient Clinical Intelligence (ACI) Platform
    - 'Full clinical AI operating system: scribing + CDI + coding + nursing workflow + pre-visit prep + post-visit summaries
      + referral letters + real-time decision support'
    - Standalone point solutions for any single workflow without integration across the episode
    - CMIO, CIO, and clinical operations leadership at integrated delivery networks
    - Long-term product thesis and valuation driver; few deployments are at full-platform scope today
  - - 'Status-Quo Substitute: Human Medical Scribes'
    - Virtual or in-person human scribes billing $33K–$65K per FTE per year plus management overhead; real-time documentation
      into EHR by a human listener
    - Varies; usually not SaaS; HR-based cost structure
    - Hospital operations; physician practice management
    - Primary dollar-for-dollar substitute that ambient AI displaces; large installed base in emergency medicine and procedural
      specialties
  - - 'Status-Quo Substitute: Voice Dictation (Dragon Medical / M*Modal)'
    - Provider-initiated structured dictation software at $200–$500 per provider per month; transcription without AI note
      generation
    - Passive ambient capture; requires active provider narration between patient interactions
    - Individual physician; department or enterprise IT
    - Largest incumbent technology; Microsoft/Nuance occupies 33% of current ambient AI market by revenue, having converted
      its Dragon customer base
  - - 'Status-Quo Substitute: Unassisted EHR Typing'
    - Physician-self-documented notes directly in EHR; zero incremental software cost
    - No vendor involved; largest adoption barrier is cost-of-change rather than price
    - Individual physician
    - Baseline status quo for roughly half of U.S. clinician encounters still not covered by any ambient or scribing tool
  - - 'Adjacent: Prior Authorization Automation'
    - AI-driven clinical documentation formatted for insurer PA requirements
    - In-scope only if triggered by ambient encounter data; otherwise separate buyer/workflow
    - Revenue cycle, care management
    - Adjacent expansion vector; Menlo Ventures identifies 10x YoY growth in PA automation in 2025
