- id: market-sizing-lenses-and-tam-sam
  title: Market Sizing — TAM, SAM, and Bottom-Up Lenses
  body: 'Published analyst estimates span a wide range depending on whether the publisher defines the market as: (a) ambient
    clinical scribing only, (b) AI in clinical documentation broadly, (c) the CDI market inclusive of human services, or (d)
    the broader ACI platform opportunity. Each lens produces a materially different number, and no single estimate cleanly
    isolates the U.S. enterprise health-system segment that Ambience actually serves today.


    The narrowest reliable anchor is Menlo Ventures'' October 2025 market-share analysis, which pegged the ambient AI scribe
    market at $600 million in revenue in 2025—the most concrete bottoms-up figure available because it was derived from vendor-level
    spend reported by health system operators rather than analyst modeling. On that base, Ambience''s reported 13% share implies
    approximately $78 million in attributed scribe segment revenue in 2025 (unconfirmed by the company). Coding and billing
    automation was separately sized at $450 million in 2025 by the same report, yielding a combined scribe+coding captured
    market of roughly $1.05 billion.


    Mordor Intelligence sizes the AI-in-clinical-documentation market (a broader definition encompassing scribing, CDI, coding,
    and workflow AI in clinical settings) at $1.15 billion in 2026, growing at a 21.46% CAGR to reach $3.05 billion by 2031.
    The same firm separately sizes the AI-in-medical-coding market at $3.38 billion in 2026, growing at 13.26% CAGR to $6.30
    billion by 2031. The Business Research Company sizes the full CDI market (human services plus software) at $4.65 billion
    globally in 2026, with a more modest 8% CAGR reflecting slower growth in legacy human-led CDI services. The SNS Insider
    ambient clinical intelligence market report (May 2026) takes the broadest view, placing the global ACI market at $7.24
    billion in 2025 and projecting $56.61 billion by 2035 at a 22.85% CAGR; the U.S. sub-segment was separately sized at $2.87
    billion in 2025.


    A bottom-up physician-count lens provides a useful cross-check. The United States has approximately 950,000 actively practicing
    clinicians as of 2026. At Ambience''s reported per-provider pricing of $2,800–$5,000 per year for its full suite, the
    theoretical all-clinician TAM ranges from roughly $2.65 billion to $4.75 billion for scribing and documentation AI alone—net
    of the traditional scribe and dictation substitutes. This lens overstates the near-term SAM because (a) Ambience targets
    large enterprise health systems, not solo practitioners; (b) not all specialty types are currently addressable (though
    Ambience claims 200+ specialties); and (c) PHTI research confirms that even post-deployment, actual clinician utilization
    rates within a given health system typically cluster between 20% and 50% of eligible providers. Applying a 50% penetration
    cap and adjusting for the enterprise-only segment (large nonprofit health systems accounting for roughly 55% of hospital
    spending per Menlo Ventures) yields a more conservative SAM estimate of $700 million to $1.3 billion.


    A specific SOM for Ambience cannot be derived from public data. The company has not disclosed ARR; third-party estimates
    range from $30 million (Sacra, May 2025) to $64.1 million (GetLatka, September 2025), a gap that itself signals uncertain
    SAM penetration. These contradictory ARR estimates are preserved rather than resolved.

    '
