companyProfile:
  summary: >
    Ambience Healthcare is a San Francisco-based AI company founded in 2020 by Mike Ng and Nikhil Buduma.
    The company builds an ambient AI documentation platform that listens to clinician-patient encounters
    in real time and auto-generates structured clinical notes, ICD-10/CPT codes, and patient-facing
    summaries across 100+ medical specialties. Ambience raised $243M in a Series C at a $1.25B valuation
    in July 2025, backed by Andreessen Horowitz and Oak HC/FT, confirming unicorn status. It serves
    40+ health system customers, targeting physician burnout reduction and documentation efficiency.
