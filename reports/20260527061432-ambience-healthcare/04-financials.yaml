- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Recognized revenue / ARR
    - Without company-confirmed revenue or ARR, valuation and growth cannot be anchored
    - Request monthly recurring revenue, ARR bridge, and GAAP revenue reconciliation
  - - Realized pricing / discounting
    - List-like estimates do not show contract quality or price erosion
    - Request booked ASP by cohort, module, and customer size
  - - Gross margin / COGS
    - Cannot assess operating leverage or pricing power
    - Request audited gross margin and COGS by cloud, implementation, and support components
  - - Cash / burn / runway
    - Capital adequacy cannot be quantified
    - Request latest balance sheet, monthly burn, and 18-24 month cash forecast
  - - NRR / churn
    - Expansion thesis remains anecdotal
    - Request gross retention and NRR by cohort and module bundle
  - - Customer concentration
    - Large flagship systems may dominate revenue and renewal risk
    - Request top-10 customers as % of ARR and revenue plus contract end dates
  - - Module revenue mix
    - Cannot tell whether revenue-integrity products are material or merely narrative support
    - Request revenue split by documentation, coding/compliance, inpatient/ED, and services
  notes: These are the core blockers preventing a strict public-only underwriting view. Each line maps to a specific data-room request rather than a generic diligence complaint.
