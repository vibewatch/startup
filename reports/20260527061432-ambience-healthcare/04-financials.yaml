  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-and-burn
    missingEvidence: Current cash balance, monthly burn, and board-approved runway model.
    whyItMatters: Without cash and burn, capital adequacy cannot be quantified and the public financing story cannot be converted into an actual runway view.
    diligencePath: Request the latest balance sheet, trailing-twelve-month monthly cash burn, and an 18-24 month cash bridge from management.
    relatedQuestionRefs:
    - QI012
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: retention-and-expansion
    missingEvidence: Gross retention, NRR, module attach rates, and cohort expansion data.
    whyItMatters: The land-and-expand thesis is visible qualitatively but remains unproven quantitatively without retention and expansion metrics.
    diligencePath: Request NRR by cohort, attach-rate history for coding/compliance modules, and renewal data for flagship accounts.
    relatedQuestionRefs:
    - QI014
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer and top-module revenue concentration, including contract end dates and renewal exposure.
    whyItMatters: Large health-system wins are strategically attractive but can create meaningful concentration risk if a small number of systems dominate ARR.
    diligencePath: Request top-10 customer concentration by ARR and revenue, plus revenue split by documentation, coding/compliance, inpatient/ED, and services.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI005
