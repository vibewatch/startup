  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-opacity
    missingEvidence: Independent evidence on Ambience security certifications, subprocessor roster, and any historical incidents or OCR inquiries.
    whyItMatters: Security posture is central to enterprise health-system procurement and to residual breach-risk sizing.
    diligencePath: Request SOC 2 or HITRUST materials, current subprocessor list, incident log, and any regulator correspondence during diligence.
    relatedQuestionRefs:
    - QR016
    - QR031
    relatedTableRefs:
    - TR002
    - TR004
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Customer concentration, renewal, churn, and module attach data by major health-system account.
    whyItMatters: Revenue concentration can turn a single competitive loss or compliance concern into a material growth shock.
    diligencePath: Obtain cohort retention, top-10 customer ARR, renewal schedules, and win-loss data segmented by Epic vs non-Epic accounts.
    relatedQuestionRefs:
    - QR011
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: contract-governance
    missingEvidence: Business associate agreement terms, PHI training restrictions, and vendor-management controls for model and cloud partners.
    whyItMatters: These controls determine how much legal and reputational exposure sits with Ambience versus with customer health systems.
    diligencePath: Review template BAA, security exhibits, OpenAI and Azure data-handling terms, and any customer-side opt-out controls.
    relatedQuestionRefs:
    - QR023
    relatedTableRefs:
    - TR001
    - TR005
  - type: private-evidence-only
    severity: minor
    topic: staffing-opacity
    missingEvidence: Detailed org chart for implementation, security, privacy, and compliance functions after the 2025-2026 leadership transitions.
    whyItMatters: Execution risk is lower if compliance and deployment functions scaled alongside product scope and customer count.
    diligencePath: Request executive org chart, compliance headcount, and implementation staffing ratios versus active enterprise deployments.
    relatedQuestionRefs:
    - QR031
    relatedTableRefs:
    - TR004
