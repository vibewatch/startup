- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Regulatory / privacy exposure
    - Evidence of OCR inquiry, FTC complaint, or customer-wide consent remediation
    - Any formal regulator contact or a major customer pauses rollout for privacy reasons
    - Move from watch to red-flag diligence and re-underwrite legal reserve assumptions
  - - Coding / CDI compliance risk
    - Audit findings or payer denials linked to AI-assisted documentation
    - Any material dispute suggesting coding suggestions are not reliably human-governed
    - Require detailed compliance controls before supporting new capital
  - - Partner concentration
    - Epic or Microsoft distribution terms worsen or embedded competitor win rates rise sharply
    - Meaningful decline in Epic win rate or a flagship account choosing native alternatives
    - Assume multiple compression and slower net-new ARR
  - - Security opacity
    - No certifiable control evidence or incident transparency in diligence
    - Management cannot supply current security program, subprocessor list, and incident history
    - Treat residual security risk as too high for a premium private price
  - - Execution / economics
    - No visibility into gross margin, NRR, or concentration by the next financing window
    - Core unit-economics evidence remains private while price stays at or above the current unicorn level
    - Shift stance toward avoid-at-price unless valuation resets materially
  notes: Each trigger is designed to translate public signals or diligence findings into an explicit investment action rather than a vague concern.
