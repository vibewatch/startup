chapter:
  number: 7
  title: Risks
  summary: Ambience faces a risk profile driven less by demand risk than by governance and execution risk at a premium price. The highest-severity items are privacy and consent exposure in sensitive clinical workflows, coding and CDI compliance risk as the product expands beyond note drafting, and partner concentration around Epic and Microsoft/Azure. Public customer proof is real but still narrow relative to the breadth of product claims, while financial and security disclosure remain too thin to underwrite low residual risk.
sections:
- id: privacy-and-regulatory-exposure
  title: Privacy, consent, and regulatory exposure
  body: 'Ambience’s core product premise—capturing, structuring, and then coding the clinical conversation—puts the company directly inside the most sensitive portion of the healthcare data stack. That makes generic “AI risk” framing too shallow. The practical legal question is whether Ambience can keep the workflow inside a well-governed documentation-support lane while customers, regulators, and plaintiffs increasingly scrutinize how AI tools ingest protected health information, whether patient consent is meaningful, and which entity carries liability if automated suggestions shape care or billing. Public evidence already points to live exposure: HHS continues to enforce privacy and security failures; FTC rules still govern consumer health-breach scenarios; California maintains separate confidentiality obligations; and legal practitioners now treat consent, BAAs, model-training boundaries, and liability allocation as frontline diligence issues for healthcare AI. Ambience’s expansion from
    note drafting into Chart Chat and point-of-care CDI makes the upside larger, but it also raises the chance that the company is judged against a stricter regulatory and governance standard than a narrow ambient scribe would face. These combined regulatory dimensions represent material pre-commercialization diligence requirements.'
