chapter:
  number: 5
  title: Product & Technology
  summary: 'Ambience now presents itself as an AI platform for the full clinical workflow rather than a single ambient scribe, and in April 2026 unveiled a multiyear platform roadmap spanning five domains including a new AI patient agent (Kait), care orchestration with Cleveland Clinic and Mayo Clinic, and clinical research. Public product pages describe pre-visit chart summarization, in-visit ambient documentation and Chart Chat, and post-visit coding, CDI, and referral outputs, with direct EHR positioning around Epic, Cerner, Athena, and Azure Marketplace distribution. The strongest public differentiation signals are coding-aware workflow breadth inside major EHR surfaces and Ardent Health''s confirmed enterprise rollout at 90% clinician utilization across 30 hospitals. The main diligence gaps remain: public materials are thin on external accuracy benchmarking, uptime and rollback disclosure, and the legal and liability dimensions of ambient AI are now explicitly flagged by a 2026 American Bar Association analysis.'
sections:
- id: product-overview
  title: Workflow coverage and module map
  body: 'Ambience''s current product pages frame the company as an AI platform that covers the full clinical workflow rather than a transcription-only ambient scribe. The platform is organized around pre-visit, in-visit, and post-visit work. Pre-visit tools center on context assembly: patient summaries, problem-oriented chart synthesis, hospital-stay summary, and schedule and list synchronization from the EHR. In-visit tooling centers on ambient listening, multi-speaker attribution, translation for documentation, Chart Chat question answering, medication-order support, and patient-instruction generation. Post-visit tooling focuses on structured note assembly, discharge and referral outputs, and coding-aware documentation that is meant to improve revenue integrity and compliance. Across the product surface, Ambience repeatedly positions itself as serving both clinician experience and downstream documentation, CDI, and billing workflows. That breadth matters because it is the company''s clearest
    product differentiation claim versus vendors that market a narrower note-capture layer.'
