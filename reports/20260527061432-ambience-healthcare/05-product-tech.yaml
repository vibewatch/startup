      detail: The system produces specialty-tuned, coding-aware documentation and can assemble HPI, A&P, referrals, and instructions.
    - id: n5
      label: Surface coding and CDI checks
      detail: ICD-10, E/M, HCC, and related validators support documentation integrity before sign-off.
    - id: n6
