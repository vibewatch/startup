- id: quality-and-compliance
  title: Chart-aware intelligence, coding, and trust controls
  body: Ambience's strongest public technical story is not simply that it generates notes quickly, but that it tries to ground documentation, coding, and compliance in broader chart context. Chart Chat combines patient-chart context with BMJ Best Practice, risk calculators, and literature references. Chart awareness is now described as a shared intelligence layer behind patient summaries, assessment and plan, diagnostics, and coding, with the company explicitly arguing that longitudinal chart reasoning is necessary for higher-fidelity documentation and billing support. The inpatient CDI assistant and Conditions Advisor extend that thesis into hospital workflows by emphasizing explainable audit trails, diagnostic specificity, and standards alignment with AHIMA and ACDIS. On the trust side, Ambience discloses HIPAA, SOC 2 Type I and II, GDPR conformance, 24/7 support, and BAA-ready contracting. The privacy policy also clarifies that de-identified data can be shared with vendors or academic
    researchers under contractual and HIPAA-compliant frameworks. These are meaningful controls, but they remain policy disclosures rather than independent performance audits.
