- id: architecture-integrations
  title: Architecture, integrations, and operating model
  body: 'Public technical positioning is most concrete around EHR integration rather than around model internals. Ambience says it reads from and writes to Epic, Cerner, and Athena workflows using standards-based architecture, with Epic called out as the deepest surface via SMART on FHIR, Ambient APIs, Hyperspace, Haiku, and Epic Toolbox. Cerner write-back is described more explicitly than many rivals describe non-Epic support: notes can be edited section by section in DynDoc and MPages before sign-off. Microsoft Marketplace adds a second external distribution signal, especially because Ambience says its platform leverages Azure OpenAI and exposes marketplace SKUs for pilot and per-user buying. The operating model implied by public hiring is a combined clinical-and-engineering organization: clinical AI, frontier AI, platform, distributed systems, privacy, security, and care-transformation roles all appear on the careers page. That mix is consistent with a forward-deployed product organization
    built to tune features by care setting and health-system workflow rather than a self-serve software motion.'
