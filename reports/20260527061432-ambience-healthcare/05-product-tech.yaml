  evidenceGaps:
  - type: missing-source
    severity: material
    topic: specialty-benchmarking
    missingEvidence: Independent specialty-by-specialty accuracy and error-rate studies for note generation, coding, and chart-aware assistance.
    whyItMatters: Workflow breadth is clear, but underwriting trust and defensibility requires module-level performance evidence beyond pilot anecdotes.
    diligencePath: Request blinded health-system evaluation packets, specialty scorecards, and post-deployment QA dashboards.
  - type: private-evidence-only
    severity: material
    topic: reliability-operations
    missingEvidence: Customer-facing uptime history, incident reporting, rollback controls, and model version-governance documentation.
    whyItMatters: Health-system-scale ambient workflows are operationally sensitive; policy claims alone do not prove resilience.
    diligencePath: Ask for security review packets, incident history, SLA attainment data, and model change-management procedures.
  - type: private-evidence-only
    severity: minor
    topic: developer-surface
    missingEvidence: Public API, SDK, or developer documentation describing extensibility beyond partner marketplaces and EHR surfaces.
    whyItMatters: Without it, the platform looks deeply integrated but hard to evaluate for ecosystem leverage outside curated partner channels.
    diligencePath: Ask Ambience for implementation guides, API references, and customer integration playbooks used outside Epic/Cerner/Athena.
  - type: missing-source
    severity: material
    topic: ai-safety-adverse-incidents
    missingEvidence: No independent clinical audit or adverse incident report specific to Ambience Healthcare's AI documentation errors is publicly available.
    whyItMatters: Hallucinations or missed diagnoses in AI-generated clinical documentation could expose health systems to liability.
    diligencePath: Request vendor safety audits, incident reports, and error rate benchmarks from Ambience directly; review PHTI and KLAS adverse findings.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs: []
