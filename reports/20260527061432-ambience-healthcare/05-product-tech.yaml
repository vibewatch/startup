figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: Publicly described architecture layers run from EHR and chart inputs through chart-aware intelligence and coding/compliance outputs, with partner surfaces carrying much of the observable technical signal.
  data:
    layers:
    - label: Layer 1 — Source systems
      detail: Epic, Cerner, Athena, and the patient's longitudinal chart provide schedules, problem lists, prior notes, diagnostics, and encounter context.
    - label: Layer 2 — Encounter capture
      detail: Ambient Scribe captures live encounter audio, supports multiple speakers, and can translate conversations for documentation.
    - label: Layer 3 — Clinical intelligence
      detail: Patient Summary, Chart Chat, chart-aware A&P, diagnostics, and Conditions Advisor synthesize chart context before or during care.
    - label: Layer 4 — Coding / compliance
      detail: ICD-10, E/M, HCC, CDI, and related validators shape documentation toward compliant, audit-ready billing support.
    - label: Layer 5 — Workflow outputs
      detail: Structured notes, referrals, patient instructions, and post-visit artifacts are returned to clinician workflow and the EHR.
    - label: Cross-cutting partner surfaces
      detail: Epic Toolbox, Cerner DynDoc, and Microsoft Marketplace / Azure OpenAI form the strongest visible external integration and distribution surfaces.
  approximationNotes: This stack is inferred from public product and launch materials. Ambience does not publicly disclose model-serving topology, data pipelines, or rollback architecture.
