- id: TP004
  title: Moat Durability / Competitive Risk Register
  description: Ambience moat claims tested against specific competitor threats and adverse evidence.
  columns:
  - Ambience Moat Claim
  - Threat Vector
  - Severity
  - Evidence
  - Mitigation / Diligence Ask
  rows:
  - - Coding-aware documentation and AutoCDI create deeper ROI than scribe-only rivals
    - Abridge, Commure, and platform vendors add coding-aware or linked-evidence workflows
    - High
    - Peers are broadening product scope beyond note capture while buyers demand measurable financial return
    - Request win/loss data showing why AutoCDI wins and how much incremental CDI value customers realize
  - - Referenceability from Cleveland Clinic and other health systems is a durable trust moat
    - Competitors continue to accumulate marquee accounts and third-party proof points
    - Medium
    - Enterprise buyers still rebid, pilot multiple tools, and weight local specialty fit heavily
    - Review renewal, expansion, and reference-call conversion data across top 10 accounts
  - - Specialty depth is hard for generalist vendors to match quickly
    - DeepScribe and Abridge both emphasize specialty-specific workflow tuning
    - Medium
    - Specialty-specific vendors have already won large deployments where customization mattered
    - Benchmark note quality and clinician adoption by specialty, not only in aggregate
  - - Independent vendors can stay ahead of EHR-native offerings on innovation speed
    - Epic, Oracle, and Microsoft can bundle ambient features into core platform contracts
    - High
    - Platform incumbents control workflow distribution and can compress price or reduce procurement friction
    - Assess dependency on EHR partnerships and model feature parity roadmap
  - - Category growth will sustain several scaled winners
    - PHTI tracked 60+ vendors and public evidence suggests consolidation is likely
    - High
    - Fragmentation plus uneven ROI evidence points toward a smaller approved-vendor set over time
    - Model downside scenarios with 2-3 scaled winners and lower ambient pricing
  - - Provider delight alone is sufficient to maintain premium pricing
    - PHTI and NEJM evidence show satisfaction does not automatically equal hard ROI
    - High
    - Broad enterprise productivity gains remain insufficiently proven in public studies
    - Demand customer-level payback studies, utilization curves, and renewal economics
  - - Implementation friction creates strong lock-in after go-live
    - Contracts are young and many buyers still run bake-offs or multi-home during evaluation
    - Medium
    - Security review and template setup create friction, but not irreversible lock-in
    - Request churn analysis and average time-to-replace for any lost accounts
  notes: Severity reflects how directly the risk could impair Ambience's enterprise win rate, pricing power, or renewal durability over the next 24-36 months.
