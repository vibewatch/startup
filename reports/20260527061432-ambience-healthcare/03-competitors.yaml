  - Contract Model
  - Included Scope
  - Visibility
  - Implication
  rows:
  - - Nuance DAX Copilot
    - $369-$830+ per provider / month reported in market summaries
    - Enterprise subscription, typically annual
    - Ambient note capture, Copilot workflows, EHR embed
    - Medium
    - Most legible public benchmark; often frames buyer expectations for premium ambient tools
  - - Abridge
    - Custom enterprise quote; no durable public list price
    - Enterprise contract by deployment scope
    - Ambient documentation plus linked evidence and expanding inpatient/nursing workflows
    - Low
    - Likely sold on enterprise outcomes rather than transparent seat pricing
  - - Ambience Healthcare
    - ~$2.8K-$5K per provider / year reported by third-party analysts
    - Annual contract by clinician / module mix
    - AutoScribe, AutoCDI, AutoNote and adjacent modules
    - Low
    - Reported annual pricing can appear economical if CDI value is realized
  - - Suki
    - Generally custom; per-seat pricing not consistently public
    - Per-provider or enterprise assistant contracts
    - Assistant, dictation, ambient and partner integrations
    - Low
    - Channel partnerships may matter more than raw headline price
  - - Nabla
    - Enterprise quote; public list pricing uncommon
    - Assistant-first enterprise subscription
    - Ambient documentation, clinician assistant workflows, multilingual support
    - Low
    - Often positioned for easier rollout, not necessarily lowest list price
  - - Human medical scribes
    - $35K-$65K per provider-year in person; ~$14K-$30K virtual
    - Headcount or outsourced service contract
    - Human note prep / transcription support
    - Medium
    - Much higher direct labor cost but familiar and low-model-risk
  - - Internal build / AWS HealthScribe
    - Usage-based infrastructure plus integration cost
    - Internal project budget + cloud usage
    - Speech, summarization, and custom workflow build
    - Medium
    - Can be cost-effective only for teams with strong engineering, security, and EHR integration capacity
  notes: “Visibility” reflects how discoverable pricing is in public sources. Low visibility does not imply lower cost. Ambience pricing is third-party-reported rather than company-confirmed.
