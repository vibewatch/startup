  evidenceGaps:
  - type: missing-source
    severity: moderate
    topic: native-platform scale metrics
    missingEvidence: Public, apples-to-apples deployment counts and renewal metrics for Epic and Oracle native ambient offerings are not disclosed consistently enough to size their competitive overlap with Ambience precisely.
    whyItMatters: Without standardized native-platform metrics, it is hard to determine how much buyer demand is already being absorbed inside EHR bundles versus left open to independent vendors.
    diligencePath: Request vendor-by-vendor production-seat counts from channel partners or health-system references; compare attach rates within Epic and Oracle customer bases.
    relatedQuestionRefs:
    - QP010
  - type: missing-source
    severity: moderate
    topic: cross-vendor proof points
    missingEvidence: Most customer proof points come from isolated case studies, awards, or company-selected deployments; standardized KLAS-style apples-to-apples benchmarks across all major ambient vendors are not public.
    whyItMatters: Lack of comparable proof makes it difficult to separate true product superiority from favorable customer selection or marketing emphasis.
    diligencePath: Collect comparable references, renewal rates, and deployment metrics across Abridge, DAX, Ambience, Suki, DeepScribe, and Nabla in matched health-system contexts.
    relatedQuestionRefs:
    - QP020
  - type: missing-source
    severity: material
    topic: hallucination and note-quality rates
    missingEvidence: Vendor-level hallucination rates, corrected-note percentages, and adverse documentation events are rarely disclosed publicly in a standardized format.
    whyItMatters: Accuracy risk is one of the main blockers to trusting ambient AI beyond low-stakes note drafting; without comparable metrics, trust posture is difficult to underwrite.
    diligencePath: Request QA dashboards, override rates, and audit outcomes from reference customers; compare source-linked evidence systems versus free-form note generators.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: durable ROI and renewal economics
    missingEvidence: Public studies and press coverage do not yet provide multi-year payback, renewal, and cohort economics across ambient AI vendors at enterprise scale.
    whyItMatters: Without durable ROI evidence, investors cannot tell whether ambient AI is a premium workflow platform or a feature destined for pricing compression.
    diligencePath: Request customer-level utilization curves, renewal histories, expansion data, and finance-owner ROI models from Ambience and matched peers.
    relatedQuestionRefs:
    - QP028
acknowledgedWarnings:
