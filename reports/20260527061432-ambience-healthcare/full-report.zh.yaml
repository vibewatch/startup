      - number: '5.3'
        title: 病历感知智能、编码与信任控制
        blocks:
          - type: paragraph
            body: >-
              Ambience 最强的公开技术叙事，不只是快速生成病历，而是试图把文档、编码和合规建立在更广的病历上下文之上。Chart Chat 将患者病历上下文与 BMJ Best
              Practice、风险计算器和文献引用结合起来。公司现在把病历感知描述为患者摘要、评估与计划、诊断和编码背后的共享智能层，并明确主张，纵向病历推理是更高保真文档和计费支持的必要条件。住院 CDI 助手和
              Conditions Advisor 把这套逻辑延伸到医院工作流，强调可解释审计轨迹、诊断具体性，以及与 AHIMA、ACDIS 标准保持一致。信任控制方面，Ambience 披露了 HIPAA、SOC 2
              Type I 和 II、GDPR 合规、24/7 支持和可签 BAA 的合同安排。隐私政策还说明，去标识化数据可以在合同和 HIPAA
              合规框架下与供应商或学术研究人员共享。这些控制有意义，但仍是政策披露，而不是独立性能审计。
