  - id: TV006
    title: 最终尽调需求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计经常性收入
        - ARR 桥接、确认收入转换，以及按产品拆分的收入结构
        - 必须先确认当前倍数到底是 40x、20x，还是别的水平
        - 财务资料室请求，以及审计师背书的 ARR 明细表
      - - 毛利率与推理成本
        - 托管 / 模型成本结构，以及各模块毛利率
        - 决定增长能否支撑溢价软件倍数
        - 财务和工程尽调，逐项核查成本
      - - 留存与集中度
        - 前十大客户 ARR、NRR、流失率，以及按队列拆分的模块挂载
        - 基准情景依赖大型系统内的持久扩张
        - 客户分析请求加队列数据导出
      - - 股权结构表与优先权
        - 清算堆叠、按比例认购权、期权池刷新假设和附函经济条款
        - 即便公司增长，优先权包袱也可能抹掉表面上行
        - 围绕条款清单和股权结构表开展法律与财务尽调
      - - 编码 / CDI 证明
        - 后病历模块的挂载率、ROI 和审计结果
        - 这是相对病历记录工具享有溢价的主要理由
        - 收入周期尽调和客户访谈尽调
      - - 安全 / 合规准备
        - 任何事故、保险覆盖、监管接触和合规准备金
        - 重大问题会同时打击增长和估值
        - 安全尽调和客户法务访谈
    notes: 这些要求是把故事丰富的机会转成可承销投资决定所需的最低资料包。
    claimRefs:
      - CV024
      - CV029
      - CV030
      - CV035
      - CV041
      - CV042
