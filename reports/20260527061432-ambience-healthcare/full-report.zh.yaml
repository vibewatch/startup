      - number: '1.3'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >
              自 2020 年创立以来，Ambience Healthcare 已完成 4 轮已知机构融资。截至 2025 年 9 月，公司官方披露累计约 $343 million。第三方追踪方（Sacra、Fierce
              Healthcare）引用的累计融资在 $345 million 到 $373 million 之间； 差异不大，主要来自对未披露种子资本的不同处理。


              种子轮于 2020 年完成，金额未公开披露。已知种子投资人包括 Kleiner Perkins、Andreessen Horowitz (a16z)、 OpenAI Startup Fund、Human
              Capital、Martin Ventures、AIX Ventures、AirTree Ventures，以及 John Doerr （Kleiner Perkins）、Jeff Dean（Google
              DeepMind）、Richard Socher（Salesforce AI）、Pieter Abbeel（UC Berkeley） 等知名天使。2022 年 4 月，Ambience 完成约 $30
              million Series A，由 Andreessen Horowitz 领投；PitchBook 估计投后估值约 $126 million，这是记录中唯一的历史估值锚点。2024 年 2 月，公司完成
              $70 million Series B， 由 Kleiner Perkins 和 OpenAI Startup Fund 共同领投，Andreessen Horowitz 和 Optum Ventures
              参投，累计融资增至约 $100 million。


              2025 年 7 月 29 日，Ambience 宣布完成 $243 million Series C，由 Oak HC/FT 和 Andreessen Horowitz 共同领投， 投后估值 $1.25
              billion。Series C 新投资人包括 Frist Cressey Ventures、Town Hall Ventures、Smash Capital、 Georgian 和 Founders
              Circle Capital。公司未公开披露任何老股交易、债务融资或授信额度。Series C 赋予其独角兽地位， 也是 2025 年最大规模的医疗 AI 融资之一。
