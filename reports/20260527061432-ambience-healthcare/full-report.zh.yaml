  - id: TR005
    title: 缓释措施与放弃标准表
    columns:
      - 风险
      - 可监测触发因素
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 监管 / 隐私暴露
        - 出现 OCR 调查、FTC 投诉，或面向客户全域的同意整改证据
        - 任何正式监管接触，或主要客户因隐私原因暂停上线
        - 从观察转入红旗尽调，并重估法律准备金假设
      - - 编码 / CDI 合规风险
        - 审计发现或支付方拒付与 AI 辅助文档挂钩
        - 任何重大争议显示编码建议没有可靠的人类把关
        - 支持新融资前，要求公司给出详细合规控制
      - - 合作伙伴集中度
        - Epic 或 Microsoft 分销条款恶化，或嵌入式竞品胜率大幅上升
        - Epic 环境胜率明显下滑，或标杆客户选择原生替代方案
        - 假设估值倍数压缩，新 ARR 增长放慢
      - - 安全透明度不足
        - 尽调中拿不到可认证的控制证据或事故透明度
        - 管理层无法提供当前安全计划、子处理方清单和事故历史
        - 认定剩余安全风险过高，不支持溢价私募价格
      - - 执行 / 经济性
        - 下一轮融资窗口前仍看不到毛利率、NRR 或客户集中度
        - 核心单位经济性仍不披露，同时价格维持在当前独角兽水平或更高
        - 除非估值实质性回调，否则转向按当前价格回避
    notes: 每个触发因素都把公开信号或尽调发现落到明确投资动作，而不是停留在模糊担忧。
