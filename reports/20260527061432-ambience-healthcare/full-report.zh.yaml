  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Ambience 的多头逻辑很直接。公司有可信的企业采用、强投资人基础，产品范围也从病历草拟延伸到编码、CDI 和 EHR
              内辅助。如果基础病历助手工作流被打包或商品化，这些相邻领域正是独立环境式供应商需要的延展方向。问题在于，当前轮次价格已经假设了某种版本的扩张会成功。公开证据支持“这是一家有真实牵引力的真公司”，但还不支持“晚期私有价格下仍有明显风险投资回报”。因此，反向逻辑不是
              Ambience 缺少产品市场匹配，而是投资人被要求支付接近 Abridge 风格的倍数，却没有 Abridge 级别的公开收入披露、品类领导力证明或已披露经济性。关键变量是估值纪律，而不是公司质量。
