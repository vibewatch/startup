            body: >-
              公开材料显示的扩张模式很清楚：先落地，再扩张。Cleveland Clinic 从评估走向独家合作。Houston Methodist
              从分阶段门诊使用，走向覆盖门诊、急诊和住院的更广企业级铺开。MultiCare 从比选走向计划覆盖 1,500 名临床医生的扩张。John Muir 宣布全面企业铺开。Onvida 强调更深的 Epic
              关联工作流。这些都是一个产品能从文档切入，再跨席位、专科和用例扩张的典型特征。Ambience 进入护理和住院工作流，又进一步强化了这个模式，因为它在同一账户内打开了新的买方角色和新的模块挂载机会。


              下行面是集中度和不透明度。公开可见客户偏大型，因此单个医疗系统可能各自代表有意义的 ACV。但本文审阅的公开来源中，没有任何来源披露续约日期、合同期限、流失率、NRR
              或队列扩张曲线。这使外部很难判断，如今的招牌客户是在变成持久的经常性收入关系，还是只是强试点和早期铺开。因此，公司看起来拥有优秀扩张潜力，但公开留存数据仍不足以消除集中度担忧。
