      - number: '1.5'
        title: 里程碑、反向事件与竞争风险
        blocks:
          - type: paragraph
            body: >
              Ambience Healthcare 的里程碑时间线覆盖从创立到 2025、2026 年一系列活跃的商业、融资和组织进展，跨度五年。主要不利和竞争压力包括高度分散的环境式 AI 市场：Peterson
              Health Technology Institute（PHTI）截至 2025 年追踪到 60+ 个独立环境式 AI 解决方案，行业观察者预计市场将实质性整合到少于五到六家领先平台。 2025 年末，Epic
              宣布与 Microsoft 合作，将 Nuance DAX Copilot 原生嵌入 EHR，对第三方环境式 AI 供应商构成直接竞争。


              一项发表于 NEJM AI 的同行评议研究考察了 Atrium Health（Advocate Health）的 Nuance DAX Copilot 部署，发现广泛效率提升有限； 只有高使用率用户（转入超过
              60% DAX notes 的用户）看到文档时间约 7% 的温和下降。研究结论是，除非采用水平很高，否则广泛实施「不太可能为希望提升生产率的医疗系统带来可观收益」。 虽然这一发现适用于竞争对手产品（Nuance
              DAX），但它提示了一个类别级风险：ROI 取决于采用率，这一点与 Ambience 的估值主张相关。 Ambience CEO Nikhil Buduma 在 2025 年 11 月 MedCity News
              报道中承认整合环境，但表示公司正在「打造一家跨世代公司」，并拥有独立验证的第三方 ROI 和多年合作关系。


              其他风险包括：深度集成依赖 EHR 供应商（Epic、Cerner）配合；市场成熟后可能出现定价压缩；2025 年 9 月领导层交接，在公司最关键的规模化阶段把一位未经 CEO
              岗位验证的高管推到首席执行官位置。研究未发现重大诉讼、监管执法或客户流失。
