  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与变现范围
        blocks:
          - type: paragraph
            body: >-
              Ambience Healthcare 的公开材料显示，公司采用企业 B2B SaaS 模式，卖给医疗系统，而不是自助式记录产品。Sacra 将其描述为按临床 FTE 定价、签年度合同的软件，基础
              AutoScribe 估计每名服务提供者每年约 $2,800 到 $3,200，更完整套件约每名服务提供者每年 $4,000 到 $5,000。Sacra
              也指出存在一次性实施费，但未披露金额。这一定价证据来自第三方，应视为方向性而非已确认标价； 不过它与 Ambience 自身产品和业务页面一致，后者营销的是宽工作流平台，而不是狭义病历生成器。


              官方产品、商业、住院和 ED 页面显示，为什么变现故事在财务上重要。Ambience 公开销售就诊前准备、就诊中记录、就诊后转诊和摘要生成、 ICD-10 与 E/M 编码支持、附加代码捕捉、住院
              CDI、住院服务级别指引、ED 重症护理辅助，以及其他收入完整性功能。因此，公司似乎不仅靠临床医生节省时间变现，
              也靠报销捕捉、拒付降低、文档完整性和审计风险降低变现。这一宽功能集支撑先落地再扩张的收入逻辑：先从文档切入，再在同一账户叠加编码、合规、住院和急诊模块。


              客户证据强化了这一框架。John Muir Health 表示，该平台无需要求服务提供者多看患者，也能证明实施合理；St. Luke's 和 KLAS 材料描述的时间节省、
              文档完整性和计费准确性，足以抵消技术成本。因此，公开证据支撑了高质量收入叙事，但尚不足以完全坐实：Ambience 未公开披露确认收入、ARR、实际定价、折扣、模块组合或正式收入确认政策。
              唯一公开收入数字来自外部估计，且差异显著。
