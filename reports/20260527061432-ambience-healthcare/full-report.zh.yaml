      - number: '3.4'
        title: 切换成本、分发权力与多供应商并行
        blocks:
          - type: paragraph
            body: >-
              环境式 AI 的切换成本中等：部署后足以制造摩擦，但不足以保证持久锁定。主要切换成本来自 EHR 内部实施工作、专科模板调优、临床治理审查、隐私 / 安全审批、
              临床人员再培训，以及系统标准化后改动病历工作流的运营负担。Cleveland Clinic 的竞争性竞标评测展示了现实：医疗系统愿意与多家供应商跑结构化试点，
              仔细比较临床医生采用率，并在认为某家供应商明显更匹配后再标准化。


              因此，分发权力与模型质量同样重要。JAMA Network Open 研究显示，到 2025 年中，62.6% Epic 医院已采用环境式 AI，且采用集中在规模更大、财务更健康的非营利医院。
              这一发现意味着采购战越来越多发生在既有 EHR 治理和高管赞助结构内。Microsoft/Nuance、Epic 和 Oracle 受益于既有工作流入口； Ambience、Abridge
              等公司必须要么匹配这种嵌入深度，要么在企业结果和专科支持上明显胜出。


              Ambience 最强的切换成本和信任资产，是标杆客户与工作流深度。Cleveland Clinic 独家合作、St. Luke's/KLAS 证据点以及更广泛的医疗系统足迹，
              给了它小型同业缺少的可信度。但该类别在评估期仍会多供应商并行，多数合同也太年轻，尚不足以证明多年续约行为已经稳固锁定。因此，Ambience 的实际护城河是标杆可引用性、
              工作流广度和实施经验的组合，而不是硬技术锁定。
