      - number: '3.5'
        title: 反向证据、护城河耐久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              类别层面的核心反向证据并不是环境式 AI 不能让临床医生满意；问题在于，这种满意还没有转化为稳健、公开、企业级的 ROI 证明。PHTI 2025 年 3
              月评估发现，职业倦怠和文档负担改善稳定，但规模化财务回报的硬证据有限。DAX Copilot 的 NEJM 研究从另一个角度强化了同一担忧：
              只有高使用率用户看到温和的文档效率提升，说明即使领先产品也不会自动带来全系统生产率提升。这一点很重要，因为 CFO 级购买权越来越要求临床人员满意度之外的证据。


              碎片化是第二个主要风险信号。PHTI 追踪到 60+ 家环境式 AI 供应商，意味着市场很可能随着买方收窄核准供应商、平台公司把环境式功能吸收进更宽软件套件而整合。 资本不对称放大了这种压力。Abridge
              现在拥有远大于 Ambience 的资产负债表和估值；Microsoft 可以交叉补贴 DAX；Epic 和 Oracle 可以把环境式 AI 作为核心平台留存杠杆；Commure
              可以把文档与更宽运营软件捆绑。因此，单纯病历起草本身不太可能继续构成持久护城河。


              Ambience 最好的防守，是产品中更难商品化的部分：具备编码意识的文档、围绕 CDI 的病历生成、专科工作流，以及来自高知名度部署的企业信任。
              但如果买方无法指出可衡量回本，如果平台既有厂商在工作流深度上追上来，或者生成式病历准确性仍难审计，这道护城河也会被侵蚀。该类别正走向更少数规模化供应商； 它们需要证明
              ROI，经得起采购审查，并从环境式病历捕捉延伸到相邻临床 - 财务工作流。
