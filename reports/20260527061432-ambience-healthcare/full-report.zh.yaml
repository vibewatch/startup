        - 医疗系统运营预算 / IT 预算
        - Epic/Cerner 中的环境式笔记采集；就诊现场 CDI/HCC 提醒
        - 临床医生倦怠 KPI；与存量厂商竞争性试点；KLAS 评估
        - 企业级多年合同；大型 IDN 年度估计 $2M–$10M+
      - - 学术医学中心 / 教学医院
        - CMIO、医学事务 VP、CIO
        - 50+ 个专科的主治和住院医师
        - 学术医疗系统 IT 与临床运营预算
        - 复杂专科文档；GME 监管工作流；研究笔记质量
        - 教职医生满意度评分；研究合规；同业机构采用（如 Cleveland Clinic、UCSF）
        - 规模类似 IDN；常为其他买方提供区域 / 全国验证数据
      - - 区域社区医院系统（5–20 家医院）
        - 系统层 CMO、CIO、CFO
        - 初级保健与专科医生
        - 系统级共享服务预算
        - 门诊和 ED 文档；简化 CDI
        - 利润率压力；医生留存风险；同业医院公告
        - 中端企业级；小于旗舰 IDN，但 AJMC 采用数据称增长最快
      - - 独立专科医生集团
        - 诊所管理员、医学主任
        - 专科医生（肿瘤、精神、GI、ENT）
        - 医生集团 P&L
        - 高复杂度专科文档；预授权信；专科编码
        - 文档复杂度高于报销水平；服务不足专科存在倦怠
        - 按提供者 SaaS；ACV 小于医疗系统
      - - 营利性医院连锁
        - 高管层（考虑利润率，CFO 主导）
        - 住院医、ED 医生
        - 公司或院区级预算
        - ED 与住院文档；量能吞吐
        - 采用前必须证明 ROI；销售周期更慢
        - AJMC 称调整后采用概率较低（28.8%）；价格敏感度高
      - - 医疗保险方 / 支付方（CDI 相邻）
        - CMO、医疗管理 VP
        - 护士审核员、编码分析师
        - 医疗管理预算
        - 预授权文档审核；风险调整审计支持
        - HCC 捕捉准确性；Medicare Advantage 风险调整
        - 仍在萌芽；Menlo Ventures 数据显示，支付方仅占 2025 年 $1.4B 支出中的 $50M
    notes: 细分定义来自 Menlo Ventures 2025 年 10 月市场结构、AJMC 采用研究（2025 年 6 月）和 Ambience 已发布客户画像。合同规模指标基于按提供者定价区间和医疗系统规模估算；实际合同金额未公开。
