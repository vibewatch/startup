  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    description: Ambience moat claims tested against specific competitor threats and adverse evidence.
    columns:
      - Ambience 护城河主张
      - 威胁路径
      - 严重性
      - 证据
      - 缓释措施 / 尽调问题
    rows:
      - - 懂编码的文档和 AutoCDI，比单纯做文书记录的对手带来更深 ROI
        - Abridge、Commure 和平台厂商加入懂编码或 Linked Evidence 工作流
        - 高
        - 同业正把产品范围扩到病历捕获之外，买方也要求可衡量的财务回报
        - 索取赢单 / 输单数据，说明 AutoCDI 为什么赢、客户实现了多少增量 CDI 价值
      - - Cleveland Clinic 等医疗系统可被引用，是耐久的信任护城河
        - 竞争者继续积累标杆账户和第三方证明点
        - 中
        - 企业买方仍会重新招标、试点多款工具，并高度看重本地专科匹配
        - 审查前 10 大账户的续约、扩张和参考电话转化数据
      - - 专科深度难让通用厂商快速追上
        - DeepScribe 和 Abridge 都强调按专科调优工作流
        - 中
        - 在定制化重要的大型部署中，专科型厂商已经拿下客户
        - 按专科基准测试病历质量和临床医生采用率，不只看总体数据
      - - 独立厂商可以靠创新速度领先 EHR 原生产品
        - Epic、Oracle 和 Microsoft 可把环境式功能打包进核心平台合同
        - 高
        - 平台既有厂商控制工作流分发，可以压价或降低采购摩擦
        - 评估对 EHR 合作的依赖，以及模型功能同等性的路线图
      - - 品类增长会支撑多个规模化赢家
        - PHTI 追踪了 60+ 家供应商，公开证据显示整合大概率发生
        - 高
        - 格局分散，加上 ROI 证据不均，指向未来批准供应商名单会缩小
        - 建模 2-3 家规模化赢家、环境式定价更低的下行情景
      - - 只靠临床医生满意，就足以维持溢价
        - PHTI 和 NEJM 证据显示，满意度不会自动等于硬 ROI
        - 高
        - 公开研究尚未充分证明企业层面的广泛生产率提升
        - 要求客户级回本研究、使用率曲线和续约经济性
      - - 上线后的实施摩擦会形成强锁定
        - 合同仍年轻，许多买方评估时仍会比选或多家并用
        - 中
