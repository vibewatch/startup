      - number: '1.4'
        title: 客户进展、规模与封面指标
        blocks:
          - type: paragraph
            body: >
              截至 2025 年 7 月 Series C 公告，已有 40+ 家美国医疗系统部署 Ambience 的 AI 平台。公司和媒体资料确认的具名客户关系包括 Cleveland Clinic、UCSF
              Health、Houston Methodist、Memorial Hermann Health System、St. Luke's Health System （Boise, ID）、Ardent
              Health、John Muir Health、The Oncology Institute、GI Alliance、Midi Health、Eventus WholeHealth 和 Onvida
              Health。2025 年 2 月，Cleveland Clinic 在完成严格的六个月竞品评估后宣布与 Ambience 建立独家五年合作； 该评估让五家环境式 AI 记录助手供应商同台竞争，覆盖 300+
              名临床医生和 80+ 个专科。Cleveland Clinic 试点期间，Ambience 达到 80% 临床医生采用率，高于其他被测记录助手 20–40% 的轶事基线；患者面对面时间增加
              32%，下班后文档时间（「pajama time」） 减少 49.6%，病历创建时间下降 25%。


              KLAS Research 在 St. Luke's Health System 开展的一项独立研究于 2025 年发布，确认主动文档时间减少 41%，每日医护人员职业倦怠减少 36%，临床医生 /
              患者面对面时间增加 22%。据 2025 年 9 月报道，Ambience 在 Ambient AI 类别获得 97.7 KLAS Spotlight Report 得分。2025 年 10 月，KLAS
              Emerging Solutions Top 20 报告将 Ambience 评为改善临床医生体验第 1 名、改善患者体验和结果第 3 名。 2026 年 2 月，Ambience 在洛杉矶 ViVE 2026
              上获得 2026 KLAS/CHIME Trailblazer Award，以表彰创新、临床影响和客户成功。


              封面指标：估值 $1.25 billion（2025 年 7 月）；累计融资约 $343 million（2025 年 9 月）；公司未披露 ARR（第三方估计：Sacra 2025 年 5 月为
              $30M；GetLatka 2025 年 9 月为 $64.1M）；客户 40+ 家医疗系统（2025 年 7 月）；员工 200+ 人（2025 年 9 月 22 日）， 第三方数据约 212 人（2025 年
              11 月）；总部位于 CA 旧金山。收入 / ARR 数字是未经确认的分析师估计，可能无法反映实际合同收入或确认收入。
