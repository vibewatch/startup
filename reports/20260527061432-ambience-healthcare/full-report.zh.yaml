  - id: TP001
    title: 竞争对手画像表
    description: >-
      Direct peers, incumbents, and adjacent substitutes summarized by scale, target buyer, differentiation, and
      limitation versus Ambience.
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most commercially relevant ambient AI peers, platform incumbents, and substitutes cited in public
        reporting through May 2026; does not enumerate every small startup or every CDI incumbent.
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标买方 / 细分
      - 差异化
      - 相比 Ambience 的关键局限
    rows:
      - - Nuance DAX Copilot
        - 直接存量厂商 / Microsoft
        - 600+ 家机构；200K+ 临床医生
        - 在 Epic/Cerner/Microsoft 上标准化的大型医疗系统
        - Epic/Cerner 嵌入、Microsoft 分发、企业信任
        - 主要被视为环境式记录工具，而非具备编码意识的 CDI 工作流
      - - Abridge
        - 直接同业 / AI 原生领导者
        - $300M Series E 轮；估值约 $5.3B；150+ 个医疗系统
        - 大型 IDN、AMC、企业级买方
        - Linked Evidence、55 个专科、28 种语言，工作流扩张面广
        - 在旗舰级企业账户上与 Ambience 直接重叠
      - - Ambience Healthcare
        - 公司
        - $343M 融资；$1.25B 估值；40+ 家医疗系统
        - 专科复杂的大型企业客户和大型非营利医疗系统
        - 懂编码的 AutoCDI + AutoScribe 套件；覆盖 100+ 个专科；标杆客户强
        - 份额小于 DAX 和 Abridge，分发也更弱
      - - Suki
        - 直接同业 / 助手主导
        - ~10% 份额；累计融资 ~$168M
        - 医疗系统、诊所、轻量级助手部署
        - 借 Zoom 和 athenahealth 合作伙伴驱动 GTM；助手 UX 友好
        - CDI 和收入完整性深度证据较少
      - - DeepScribe
        - 直接同业 / 专科侧翼
        - 融资 ~$60M；在 Ochsner 推至 4,700 名临床医生
        - 专科密集型企业部署
        - 专科定制深，Epic 导向工作流强
        - 资产负债表更小，GTM 触达更窄
      - - Nabla
        - 直接同业 / 轻量级助手
        - $70M Series C；累计融资 $120M；130+ 家组织
        - 多站点医疗服务集团和医疗系统
        - 部署快，支持多语言，设计以助手为先
        - 编码 / CDI 覆盖尚未充分站稳
      - - Commure / Augmedix
        - 相邻平台整合者
        - $139M 收购；20+ 家大型系统；数百个护理站点
        - 现有 Commure 客户，以及关注 ED / 运营的买方
        - 可把环境式文档打包进更宽的医疗 AI OS
        - 收购后整合路线图仍在统一
      - - Epic / Oracle 原生环境式
        - 平台既有厂商
        - Epic 约占美国住院市场 ~36%；Oracle 正加入 AI 医嘱创建
        - 现有 EHR 装机基础
        - 采购杠杆和原生工作流入口
        - 专科工作流深度仍可能落后于纯厂商
    notes: 规模数据采用截至 2026 年 5 月最新公开披露。私营公司的融资和估值依据官方公告或主要媒体报道。Epic / Oracle 行合并呈现原生平台进入者，因为战略风险在于工作流控制权，而不是产品范围完全相同。
