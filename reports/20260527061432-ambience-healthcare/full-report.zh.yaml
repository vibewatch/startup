      - number: '6.5'
        title: 反向证据与部署风险
        blocks:
          - type: paragraph
            body: >-
              客户章节中的主要反向信号来自品类层面，而不是直接流失事件。第一，PHTI 认为环境式病历助手可能改善倦怠，但财务影响仍不清楚。这削弱了一个简单假设：高医生满意度会自动转化为提供方系统 ROI。第二，The BMJ
              认为仍需要更强证据，来确保环境式病历助手不会损害照护质量。第三，Sharp HealthCare 的同意权诉讼显示，如果录音和同意工作流治理不佳，环境式 AI 部署会给客户带来法律和声誉风险。


              即便这些风险尚未证伪 Ambience 的
              PMF，它们仍然重要。它们划出了采用的边界条件：高质量产品和积极临床医生本身不够。客户还需要治理、法律清晰度，以及技术可以安全、经济合理地扩展成标准作业流程的证明。对投资人而言，击穿投资逻辑的风险不是没人想要产品，而是铺开可能停滞、续约可能走弱，或某些客户细分在经济上或法律上比客户名单显示的更难服务。
            claimRefs:
