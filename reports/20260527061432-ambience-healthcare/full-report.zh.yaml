      - number: '4.2'
        title: 市场进入动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Ambience 的企业销售高度集中在大型综合医疗服务网络和学术医疗系统。Sacra 将其描述为企业优先的销售周期，通常需要 6 到 18 个月。AJMC 的独立市场证据解释了原因：Epic
              医院，以及利润率更高、位于大都市、非营利属性更强的机构，环境式 AI 采用率明显更高；这些正是 Ambience 强调 Epic、Athena、Cerner
              集成和报销导向工作流支持的环境。它不是面向小诊所、刷卡即买的软件销售。


              具名客户案例和 Cleveland Clinic 证据显示了这种销售动作的实际形态。John Muir 表示，2023 年测试了多套方案，最终选择 Ambience，因为它能跨专科运行，并且与 Epic
              无缝集成，之后又扩展到 15 个专科。Cleveland Clinic 在上线前，对 5 家供应商做了覆盖 80 多个专科的评估；Healthcare IT Today 将这段关系描述为 5 年独家合作，并强调
              Ambience 在编码和收入周期能力上的差异化。这些事实指向一种严谨的试点后扩张销售：赢单成本高，但一旦嵌入，关系可能很稳。


              公开 ROI 证据足以支撑商业前景，但还不足以量化获客成本（CAC）或回本周期。St. Luke's 报告称，文档时间和下班后工作大幅下降，面对患者的时间增加；John Muir 则表示，ROI
              足以支持全面铺开，而且没有要求临床医生增加接诊量。两者合在一起，支撑了跨专科、跨模块扩张的可信故事。但 Ambience 没有披露获客成本、回本周期、胜率、销售效率或实际平均合同额，因此 GTM
              效率仍只能从买方质量、试点严谨度和扩张潜力推断，而不是来自硬 SaaS 指标。
