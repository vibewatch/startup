  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 主要买方 / 支付方
      - 与 Ambience 的关系
    rows:
      - - 环境式临床记录
        - AI 生成临床就诊记录，按提供者 / 年以 SaaS 交付；EHR 集成、专科模板配置、持续模型调优
        - EHR 基础授权（Epic/Cerner）；硬件；非 AI 转录工具
        - 医疗系统内 CMIO/CMO（临床推动者）；CIO（IT 负责人）；CFO（预算负责人）
        - 当前核心收入类别；2025 年市场约 $600M，Ambience 份额约 13%
      - - AI 辅助 CDI 与计算机辅助编码（CAC）
        - 就诊当场给出 ICD-10/CPT 建议、HCC 风险调整捕捉、E/M 等级指引、编码审计支持，均由 AI 在就诊时生成
        - 人工 CDI 外包（BPO）；没有 AI 的回溯式编码审核；不面向医生工作流的通用 NLP
        - 收入周期 VP；医学编码总监；负责 ROI 决策的 CFO
        - AutoCDI 模块；与现有记录合同直接相邻，交叉销售经济性强
      - - 环境式临床智能（ACI）平台
        - 完整临床 AI 操作系统：记录 + CDI + 编码 + 护理工作流 + 访前准备 + 访后总结 + 转诊信 + 实时决策支持
        - 未打通整个诊疗周期、只覆盖单一工作流的独立点状方案
        - 整合交付网络中的 CMIO、CIO 与临床运营负责人
        - 长期产品假设和估值驱动；今天达到全平台范围的部署仍少
      - - 现状替代：真人医疗文书助理
        - 虚拟或现场真人医疗文书助理，按每 FTE 每年 $33K–$65K 收费，另加管理开销；由真人听诊并实时写入 EHR
        - 口径不一；通常不是 SaaS；基于人力的成本结构
        - 医院运营；医生诊所管理
        - 环境式 AI 按美元一比一替代的主要对象；急诊医学和操作型专科有庞大存量
      - - 现状替代：语音听写（Dragon Medical / M*Modal）
        - 医生主动发起的结构化听写软件，每名提供者每月 $200–$500；转录但不生成 AI 笔记
        - 被动环境式采集不在内；需要医生在患者互动间主动口述
        - 单个医生；科室或企业 IT
        - 最大存量技术；Microsoft/Nuance 将 Dragon 客户群转化后，按收入占当前环境式 AI 市场 33%
      - - 现状替代：无辅助 EHR 打字
        - 医生直接在 EHR 中自行记录；零增量软件成本
        - 没有厂商参与；最大采用障碍是改变成本而非价格
        - 单个医生
        - 基线现状；美国临床医生就诊中约一半仍未被任何环境式或记录工具覆盖
      - - 相邻：预授权自动化
        - AI 驱动的临床文档，按保险方 PA 要求格式化
        - 只有由环境式就诊数据触发时才纳入；否则属于单独买方 / 工作流
        - 收入周期、护理管理
        - 相邻扩张向量；Menlo Ventures 认为 PA 自动化 2025 年 YoY 增长 10x
    notes: >-
      市场边界定义基于 Ambience 的产品组合和 Menlo Ventures 2025 年 10 月市场测算框架。真人医疗文书助理和听写成本来自已发布指南中的行业区间；实际合同金额会有差异。不同发布方对 CDI/CAC 和
      ACI 类别的衡量存在重叠。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
