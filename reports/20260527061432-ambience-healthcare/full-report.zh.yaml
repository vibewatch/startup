      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Ambience Healthcare 由 Michael (Mike) Ng 和 Nikhil Buduma 于 2020 年共同创立。两人在 MIT 求学时相识，
              也都因早年经历过医疗创伤而与医疗行业有个人连接。创立 Ambience 前，两位联合创始人曾打造 Remedy Health， 一家 AI 临床诊断创业公司，聚焦发现隐匿的高风险诊断。Remedy Health
              未能在种子轮之后继续融资，并在 Ambience 创立同年（2020 年）关闭。


              Mike Ng 从创立起担任 CEO，直到 2025 年 9 月 22 日公司宣布一项计划内的领导层交接。当天，Nikhil Buduma 接任 CEO，负责日常运营、增长和产品创新。Ng
              转任全职总裁兼董事长，继续负责长期愿景、战略和投资人关系。Buduma 被认为是深度学习研究早期先锋之一—— 他撰写《Fundamentals of Deep
              Learning》（O'Reilly，2017），普遍被视为现代 AI 的第一本重要教材——并入选 Becker's Hospital Review「Rising Stars: 100 Healthcare
              Leaders Under 40」。


              2026 年 2 月 9 日，Ambience 任命 Mike Valli 为首席营收官兼首席价值官。Valli 此前在 symplr 担任首席商务官， 并在 Optum
              任职十余年，担任多个高级管理岗位。公司在同一公告中还任命 Richa Gupta, MBBS, MHSA 为护理转型副总裁， Jeffrey Gerson
              为市场副总裁。董事会治理细节未公开披露；已知机构代表来自领投方 Oak HC/FT（合伙人 Vig Chandramouli） 和 Andreessen Horowitz（普通合伙人 Julie
              Yoo），两人都是活跃的投资人支持者。关键人风险为中等：2025 年 9 月的 CEO 交接是计划内而非突发，两位联合创始人都留在高管层；但 Ng 离开 CEO 岗位，意味着创始运营负责人不再直接掌舵。
