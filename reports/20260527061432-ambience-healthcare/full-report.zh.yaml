  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              环境式临床文档市场已从探索性类别进入结构化份额战。MedCity News 和 Becker's 引用的 Menlo Ventures 报告显示，2025 年份额大致为 Nuance DAX
              33%、Abridge 30%、Ambience 13%、Suki 10%，其他长尾合计 14%。这种集中度很重要：前两大供应商已经控制大部分可观察企业支出，
              并且都拥有小供应商难以快速复制的结构性优势。Nuance 借助 Microsoft 分发和 EHR 嵌入深度；Abridge 借助融资速度、企业客户势能， 以及围绕 Linked Evidence
              和多语言、多场景工作流的强产品叙事。


              因此，Ambience 并不是要靠成为默认环境式病历记录工具取胜。它最强的论点是，市场正从「替代记录员」走向更宽的临床工作流和收入完整性平台。 公司的 AutoCDI
              和具备编码意识的能力，叠加专科覆盖和企业实施经验，使其定位于那些关心不止诊疗记录转写的买方。由此，Ambience 在大型医疗系统中与 Abridge 和 DAX 正面重叠，在助手优先部署中与
              Suki、Nabla、DeepScribe 部分重叠，并且随着 Epic、Oracle、Commure 等平台既有厂商把环境式功能扩展进更大的临床软件栈，重叠也在增加。


              竞争场内还包括替代品和潜在进入者。真人记录员和转写在部分环境中仍是现状；AWS HealthScribe 和通用 LLM 工具降低了内部自建门槛；EHR
              供应商也越来越能把环境式能力捆绑进既有平台关系。结果是，Ambience 同时面对直接环境式 AI 同业、相邻工作流平台、平台既有厂商、内部自建选项， 以及根深蒂固的现状工作流。
