      - number: '8.4'
        title: 建议、击穿投资逻辑的触发因素与尽调问题
        blocks:
          - type: paragraph
            body: >-
              按当前披露价格，建议是继续研究（RESEARCH-MORE），估值立场为昂贵，风险评级为高。这个判断刻意对价格敏感。公司完全可能变得比 $1.25 billion
              更值钱；公开记录只是还不足以让投资人有信心今天支付这个价格。下行情景是，如果收入增长停滞，或品类被打包进 Epic 和 Nuance，倍数可能压缩到公开医疗软件交易区间。上行情景要求 Ambience 证明持久的
              CDI 和编码挂载、真实续约能力，以及更干净的披露包。因此，尽调清单不是装饰。没有经审计
              ARR、毛利、集中度和优先权数据，就无法判断“好公司”和“差入场价”之间的差异。价格纪律，而不是对产品的欣赏，才是本章和任何近期 IC 流程的主要未决问题。优先核验临床质量审计和 ARR。
