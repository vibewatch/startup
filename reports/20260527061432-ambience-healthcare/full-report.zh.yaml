  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 隐私、同意权与监管暴露
        blocks:
          - type: paragraph
            body: >-
              Ambience 的核心产品假设——捕捉临床对话、结构化对话，再为其编码——把公司直接放进医疗数据栈最敏感的部分。因此，泛泛而谈“AI 风险”太浅。实际法律问题是：当客户、监管者和原告越来越审视 AI
              工具如何摄取受保护健康信息、患者同意是否有意义、以及自动化建议一旦影响照护或计费时由谁承担责任，Ambience 能否把工作流稳稳留在治理良好的文档支持范围内。公开证据已经指向现实暴露：HHS
              继续执法隐私和安全失败；FTC 规则仍约束消费者健康数据泄露场景；California 维持单独的保密义务；法律从业者如今也把同意权、BAA、模型训练边界和责任分配视为医疗 AI 尽调一线问题。Ambience
              从病历草拟扩张到 Chart Chat 和即时 CDI，放大了上行空间，也提高了公司被拿来用比狭窄环境式病历助手更严格的监管和治理标准衡量的概率。这些监管维度合在一起，构成商业化前的实质尽调要求。
