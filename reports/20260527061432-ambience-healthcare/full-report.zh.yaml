  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Ambience C 轮（2025 年 7 月）
        - 私募轮次对比公开 ARR 估计
        - $1.25B 估值；基于 $30M ARR 约 42x，基于 $64.1M 估计约 19x
        - 当前直接入场价格
        - 核心收入数字来自第三方估计，不是经审计的公开披露
      - - Abridge E 轮（2025 年 6 月）
        - 私募轮次对比合同 ARR
        - $5.3B 估值；基于据报道 $117M 合同 ARR 约 45x
        - 披露规模更大的最佳私募品类可比
        - 合同 ARR 不等于确认收入，且 Abridge 有更多公开规模证据
      - - Microsoft 收购 Nuance（2021 年）
        - 战略并购交易
        - $19.7B 全现金收购规模化医疗语音和云资产
        - 展示环境式 / 语音基础设施的战略价值上限
        - 资产比 Ambience 更宽、更成熟，因此不是直接阶段可比
      - - Tempus AI（2026 年 5 月）
        - 公开市值对比 2026 年收入指引
        - $8.37B 市值；约 5x 至 6x 前瞻收入
        - 可作为公开 AI 医疗软件估值合理性校验
        - 业务组合和诊断业务敞口不同
      - - Doximity（2026 年 5 月）
        - 公开市值对比 FY2026 收入
        - $3.56B 市值；约 5.5x 历史收入
        - 可为已披露规模的医疗软件公司提供公开估值校验
        - 工作流和商业模式不同于环境式临床智能
    notes: 公开可比公司采用市值 / 收入，而不是完全标准化的 EV / 收入，因为当前公开来源集无法取得一致的净现金调整。
