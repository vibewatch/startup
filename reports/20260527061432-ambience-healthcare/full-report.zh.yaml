      - number: '3.3'
        title: 既有厂商、相邻玩家与替代品
        blocks:
          - type: paragraph
            body: >-
              Ambience 还要与那些看起来不像纯环境式 AI 记录助手的公司竞争。Epic 和 Oracle 是最重要的平台既有厂商，因为它们已经控制临床医生记录诊疗的 EHR 界面。Epic
              的环境式文档项目今天在原始功能上没那么重要，更重要的是分发控制：一旦医疗系统能在既有 Epic 治理框架内激活环境式工具， 独立供应商就必须解释为什么自己值得第二条采购路径。Oracle 在 2026 年 2
              月为 Clinical AI Agent 增加自动医嘱创建，说明 Cerner 侧路线图也正从病历起草走向更丰富的工作流自动化。


              Commure/Augmedix 代表另一类威胁：整合成更宽的医疗 AI 操作系统。Commure 以 $139 million 收购
              Augmedix，把环境式文档纳入一个覆盖排班、收入周期、消息和临床运营的更宽技术栈。 相邻文档和 CDI 既有厂商，包括 Solventum 类型的收入完整性供应商和临床 -
              财务工作流平台，仍然重要，因为很多买方会同时从临床和财务两个视角评估文档软件。


              现状替代品仍有经济意义。真人记录员和转写成本可能很高，但它们熟悉、低风险，有时比完整 AI 变革管理项目更容易试点。内部自建现在更可信，因为 AWS HealthScribe
              和通用基础模型提供合规的语音转文字和摘要基础设施；但这些做法仍要求买方自行解决 PHI 处理、可审计性、模型 QA、 EHR
              回写、模板治理和临床医生采用。对多数企业医疗系统而言，内部自建是最后选项，而不是默认选择。
