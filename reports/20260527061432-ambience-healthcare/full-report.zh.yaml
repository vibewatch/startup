      - number: '7.3'
        title: 合作伙伴、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              对一家估值已达 $1.25 billion 的私营公司而言，Ambience 的外部依赖图谱异常集中。产品触达依赖 Epic、Azure、OpenAI 和其他 EHR 路径。竞争压力如今来自
              Microsoft/Nuance 更深的 Epic 嵌入，也来自 Abridge 明显更大的资本基础和更广的已披露医疗系统足迹。与此同时，Ambience 自身经济性仍不透明：公开 ARR
              估计差异很大，集中度、续约、模块挂载和毛利率数据都未披露。也就是说，投资人看得到客户名单和融资质量，却看不到模型在竞争压缩定价或合规事件推迟部署时的底层韧性。2025 年底和 2026
              年初的领导层变化又增加了一个规模化变量。投资含义很直接：Ambience
              看起来是真正的品类竞争者，但公司的业务宽度、伙伴依赖和披露缺口，使剩余执行风险过高，不能把当前价格当作运营成熟度已经被证明来处理。一个实际后果是，看似分散的风险彼此紧密相连。如果 Epic
              分发变弱，Ambience
              很可能需要更深的客户扩张来抵消新增客户增长放缓；如果客户集中度高，即便失去一个旗舰账户也会放大影响；如果毛利率或推理成本弱于预期，公司就更缺少用降价让步应对的空间。因此，缺少公开队列经济性，会把合作伙伴风险变成融资风险，而不只是
              GTM 风险。
