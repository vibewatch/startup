      - number: '4.5'
        title: 资本充足性、融资依赖与结论
        blocks:
          - type: paragraph
            body: >-
              公开融资证据比经营披露清楚。2024 年 SEC Form D 记录了一笔 $70 million 发行，其中已售出 $54,999,916，首次销售日期为 2023-12-08；TechCrunch
              将该轮描述为 $70 million Series B，并报道当时累计融资约 $100 million。2025 年 SEC Form D 记录了一笔 $190 million 发行，其中已售出
              $139,999,680，首次销售日期为 2025-07-01。另据 Ambience 2025 年 7 月官方公告，$243 million Series C
              旨在为医疗系统扩展平台。合并来看，这些来源显示公司获得了大量股权资金支持，也给出了一个合理解释：备案已售金额低于公告轮次标题金额，可能是分阶段交割造成的。


              这些材料没有显示当前现金。本文审阅的来源中，Ambience
              没有公开披露账上现金、月度烧钱速度、现金跑道或债务契约。公开材料也没有显示信贷额度、项目融资结构或其他非股权融资义务，因此可见融资记录以股权为主。这降低了资产负债表复杂度，但融资依赖仍未解决：只要公司继续向住院、急诊、编码、合规和企业部署扩张，外部投资人仍缺少判断当前资本基础能撑多久的关键输入。


              因此，只看公开证据，财务结论是建设性但不完整。Ambience
              似乎拥有可信的企业收入模型、有意义的报销导向增购路径和强旗舰客户证明。公开资本支持也足以继续扩张。但收入质量指标、毛利数据、留存数据、烧钱速度、现金和集中度数据缺失，无法做出严格承销判断。正确的公开资料姿态，是把
              Ambience 视为商业上有前景、财务披露不足的公司：值得继续尽调，但不足以凭二级证据承销。
