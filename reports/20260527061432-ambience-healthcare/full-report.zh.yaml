  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与类别定义
        blocks:
          - type: paragraph
            body: >
              Ambience Healthcare 横跨三个相邻但分析上不同的支出类别；任何可信的市场规模测算都必须先分别圈定边界。第一、也是最成熟的类别是环境式临床记录——AI
              实时捕捉并起草临床诊疗记录——产品按每名服务提供者每年 SaaS 卖给医疗系统。第二类是 AI 辅助临床文档完整性（CDI）和计算机辅助编码（CAC）， 通过提升 ICD-10/CPT 代码捕捉、HCC
              风险调整准确性和审计可辩护性创造收入。第三、也是最宽的类别是环境式临床智能（ACI）平台市场，涵盖记录、 CDI、编码、护理工作流自动化、就诊前准备、就诊后摘要、转诊信和实时决策支持——本质上是 Ambience
              所描述的长期产品架构：完整的环境式 AI 临床操作系统。


              环境式记录的主要现状替代品包括：（1）真人医疗记录员（虚拟或现场），估计每名记录员每年让医疗系统承担 $33,000–$65,000 的薪酬加管理开销； （2）Dragon Medical One 或
              M*Modal 等结构化语音听写平台，每名服务提供者每月 $200–$500，且要求临床医生暂停诊疗并主动口述； （3）无辅助的 EHR 打字，Sinsky 等（2016，Annals of Internal
              Medicine）估计这会消耗医生门诊时间的一半以上。CDI 和编码的传统替代品包括院内医疗编码团队， 以及按编码记录或全职当量计费的外包医疗 BPO 服务。


              Ambience 直接市场排除的支出包括：宽泛的 EHR 授权（Epic、Oracle Cerner），它捆绑文档基础设施但不生成 AI 内容；通用医院 IT 和网络安全预算；
              与文档无关的临床决策支持工具；以及非美国市场（Ambience 目前只在美国运营）。相邻市场会创造扩张机会，但不应抬高当前 TAM，包括远程患者监测、事前授权自动化和 AI
              患者互动；这些市场与环境式文档共享基础设施，但买方不同，采购周期也不同。


              ACI 平台框架对估值很重要，因为支撑 Ambience $1.25B Series C 估值的正是这一论点——公司不只是 AI 记录助手，而是临床医生与 EHR 之间、贯穿诊疗事件的编排层。产品证据（200+
              专科、Epic/Cerner/athenahealth 原生集成、AutoCDI、AutoAVS、AutoRefer）
              在方向上支持这一论点，但多数当前部署仍以环境式记录作为主要工作流入口，因此该论点仍带有愿景色彩。
