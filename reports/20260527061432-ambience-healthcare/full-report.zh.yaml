      - number: '7.2'
        title: 质量、安全与实施风险
        blocks:
          - type: paragraph
            body: >-
              运营层面，Ambience 最强的卖点也是实施风险的主要来源。平台不只是病历生成器；它跨多个场景触达编码、CDI、病历摘要、诊前准备和 EHR
              内智能助手。这种宽度能在企业医疗系统里形成更强楔子，也会成倍增加失败模式：笔记不完整、建议被过度信任、编码漂移、工作流配置错误、模型或云中断，以及
              Ambience、客户和公司模型供应商之间的安全控制缺口。Cleveland Clinic 和 St. Luke’s
              的公开证明点显示了真实用户价值，但即便是支持性案例，仍然只是有边界的试点或旗舰部署，而不是广泛发表的运营数据集。同时，独立研究和基准报道仍显示，全系统 ROI 不一致。剩余风险不是 Ambience
              没有产品市场匹配，而是广泛部署质量和治理可能比标题采用指标暗示的更难规模化。Ambience
              越把自己卖成企业运营层，每一个薄弱控制、不完整病历和被改写的编码建议，就越会成为反驳溢价平台叙事的证据，而不是孤立产品缺陷。即便没有正式监管结果，这种声誉反馈循环也会拖慢部署，因为企业买方往往先响应感知到的控制弱点，再响应经审计的
              ROI 或已签署的整改计划。
