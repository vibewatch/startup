      - number: '4.3'
        title: 成本结构、毛利驱动因素与单位经济限制
        blocks:
          - type: paragraph
            body: >-
              Ambience 的公开材料没有披露毛利率或销售成本，但已经暴露出这套模型的主要驱动因素。Azure Marketplace 公告显示，平台建立在 Azure OpenAI
              之上，并配有企业部署和管理工具。产品页和发布页显示，实时文档、编码、CDI、HCC 验证、住院和急诊工作流都需要 EHR
              集成、合规逻辑和临床级可靠性。因此，成本结构里会有实质性的云端推理费用、实施工作、客户成功、合规审查和按工作流维护的产品成本。这仍然像软件，但绝不是轻量级消费 AI 的成本栈。


              这套成本基础的变现上限同样清晰。Ambience 的住院、急诊、CDI、HCC 和编码材料，都明确把产品与报销获取、审计防御、更快出账和文档具体性绑定。理论上，这些收入完整性功能应当支撑更高 ARPU
              和优于普通环境式病历助手的留存。但同样的功能也可能要求更多企业支持、更复杂的实施和更多产品验证。因此，公开证据只能证明账本两边都存在强毛利驱动因素——更高价值的模块，以及可能更重的服务 /
              合规负担——却没有说明哪一边占主导。


              独立和反向文献在这里很关键。PHTI 报道、Healthcare IT News 和 Nature 综述都提醒，整个品类的财务 ROI
              仍不确定，生产力提升有限或取决于用户，隐私、责任、病历质量和监管问题也没有完全解决。Commure 的低端定价和转写对比还说明，在市场低端，买方可以拿 AI
              文档工具与便宜得多的替代品做基准。因此，Ambience 的单位经济最终可能有吸引力，但今天的公开证据还不足以验证毛利率、净留存率（NRR）、流失率或 CAC 回本。
