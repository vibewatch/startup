  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 到 2028 年 ARR 达到约 $200M 至 $250M，CDI / 编码挂载真正跑通，Epic 捆绑没有击穿定价
        - 若退出倍数为 10x 至 12x，价值可达约 $2.0B 至 $3.0B；相对当前入场价格，上行有吸引力但高度依赖执行
        - 需要强留存、毛利率证明，且不能出现重大合规挫折
        - 存在可能，但需要多项尚未公开的公私域证据
      - - 基准
        - 到 2028 年 ARR 达到约 $120M 至 $150M，挂载率适中，退出倍数接近公开市场的 8x 至 10x
        - 价值落在约 $1.0B 至 $1.5B；考虑摊薄后，较当前价格上行有限
        - 增长、定价或模块挂载任何一项失速，都会吃掉本就很薄的回报空间
        - 最符合当前公开证据
      - - 悲观
        - ARR 停在约 $80M 以下，捆绑竞争压缩定价，公开软件倍数仍接近当前 5x 至 6x 区间
        - 价值可能大幅低于 2025 年 7 月价格，并导致下轮降价或疲弱退出
        - 捆绑、续约放慢、模块挂载疲弱或合规拖累都可能触发这条路径
        - 当前倍数相对已披露证据偏高，因此该情景可信
    notes: 区间刻意保持近似。公开证据不足，无法对 ARR、摊薄或退出倍数给出虚假的精确感。
