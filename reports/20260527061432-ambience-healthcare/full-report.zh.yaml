      - number: '5.4'
        title: 发布节奏与产品扩张
        blocks:
          - type: paragraph
            body: >-
              2025–2026 年的发布节奏显示，公司正有意从单一文档用例，走向更宽的智能栈。2025 年 8 月增加了 Epic Toolbox 对齐，并首次在 EHR 内推出 Chart Chat。2025 年 10
              月和 11 月增加了住院 CDI 和 Conditions Advisor，两者都明确面向医院工作流中的文档完整性和临床复杂性捕捉。2026 年 2
              月，病历感知能力扩展到患者摘要、评估与计划、诊断和编码；2026 年 4 月，公司又推出 Chart Chat for Nursing，作为与 Cleveland Clinic 合作的试点阶段护理智能助手。同在
              2026 年 4 月，Ambience 举办首届 Apex Summit，并公布多年平台路线图，覆盖 5 个领域：临床工作流、收入周期与完整性、患者参与（通过名为 Kait 的新 AI
              患者智能体，在两次就诊之间监测症状依从性和照护升级）、照护编排（包括与 Cleveland Clinic 合作的 Project Orchestra、与 Mayo Clinic 合作的 Project
              Archimedes），以及由结构化推理轨迹驱动的临床研究。CEO Nikhil Buduma 将 2026
              年称为“成熟之年”，标志着公司从试点阶段实验转向经过验证、可规模化的基础设施。产品公告之外，Ardent Health 也确认，在一项报告 90% 临床医生使用率和文档时间下降 45% 的试点之后，将在 6
              个州的 30 家医院和 280 个照护点进行企业级铺开。这个节奏说明，Ambience 正在大型医疗系统客户内加深工作流份额，同时把平台概念范围扩展到远超环境式病历的层面。
