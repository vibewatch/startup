      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              在这个品类的私营公司里，Ambience 的公开牵引力证据少见地强。客户和官方材料记录了 John Muir 覆盖 15 个专科的部署、St. Luke's 试点中的 11 个专科、Cleveland
              Clinic 评估中的 80 多个专科、已有 8 家机构上线 HCC 验证器，以及官方 Series C 公告中提到的 100
              多个专科。编码基准文章又补上一条商业化证据：它把性能主张与收入完整性工作流绑定。官网也持续把 Ambience 定位为文档和编码平台。


              问题在于，这些牵引信号没有转化成硬财务能见度。本文审阅的来源中，Ambience 没有公开披露确认收入、ARR、毛利率、烧钱速度、现金余额、NRR、流失率、客户集中度或模块级收入结构。外部最常被引用的两个数字，是
              Sacra 对 2025 年 5 月约 $30M ARR 的估计，以及 GetLatka 对 2025 年 $64.1M
              收入的估计。两者有方向参考价值，但都未经公司确认，不应视为管理层指引。它们相差太大，不能支撑精确的估值或现金跑道模型。


              这个缺口就是第 4 章的核心承销问题。公开证据足以说明，产品正在卖进大型系统、跨工作流扩张，并且产生了客户可见的
              ROI。但它还不足以说明，这些牵引力有多少转化为确认收入、合同利润有多高，或扩张经济性是否足以支撑溢价倍数。因此，任何只基于公开证据的投资逻辑，都建立在扎实的定性商业故事之上，同时又伴随不完整的量化财务披露。
