      - number: '3.2'
        title: 直接同业画像：DAX、Abridge、Suki、DeepScribe、Nabla
        blocks:
          - type: paragraph
            body: >-
              Nuance DAX Copilot 是既有直接竞争者，因为它把强环境式文档质量与无可匹敌的分发结合起来。Microsoft 报告 DAX 覆盖 600+ 家医疗组织和 200,000+
              名临床医生，同时产品被置于 Epic、Cerner 和 Microsoft 工作流内。已经标准化 Microsoft 生产力工具，或希望获得既有供应商安全感的买方， 常常先把 DAX 放入候选名单。相较
              Ambience，它的弱点在于 DAX 仍主要被理解为记录产品，而不是具备编码意识的临床文档完整性平台。


              Abridge 是最危险的 AI 原生同业。到 2025 年中，它已完成 $300 million Series E 融资，估值 $5.3 billion，触达 150+ 家企业医疗系统，并称 2025 年将支持
              50 million+ 次医疗对话。它的「Linked Evidence」定位具有战略意义，因为该定位通过把病历输出指回源对话上下文来回应信任担忧；
              公司也早已从门诊初级保健扩展到急诊、住院、儿科和护理工作流。Abridge 现在与 Ambience 正面争夺旗舰企业账户。


              Suki、DeepScribe 和 Nabla 各自切入更窄楔子。Suki 强调助手易用性，以及 Zoom、athenahealth 等渠道合作。DeepScribe 已证明专科工作流可以拿下大型部署，
              典型案例是 Ochsner 面向 46 家医院、370+ 个站点、4,700 名临床医生的部署。Nabla 已完成有意义融资，触达 130+ 家美国组织和 85,000+
              名临床医生，主张一种更轻量的临床医生助手，可快速扩散到不同诊疗场景。它们尚未匹配 Ambience 有文档支持的 CDI 中心定位， 但每一家都可能在特定买方细分中压低 Ambience。
