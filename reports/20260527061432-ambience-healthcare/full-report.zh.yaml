  - id: TV005
    title: 逻辑破裂与放弃触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经审计 ARR 或确认收入明显低于公开估计
        - 经常性收入低于 $50M，或确认收入转换明显弱于市场假设
        - 击穿当前定价对应可容忍前瞻倍数的假设
        - 不支持按当前价格或更高价格参与新一轮新股融资
      - - Epic / Nuance 捆绑冲击 Epic 占比较高系统中的胜率
        - 基于 Epic 的管线转化率或续约信心明显恶化
        - 削弱分销和变现逻辑
        - 将退出倍数假设下调至公开可比公司常态
      - - CDI 和编码模块无法证明可衡量的挂载或 ROI
        - 付费队列没有可信的挂载率或 ROI 数据集
        - 拿掉高于病历记录类倍数的主要理由
        - 转向按当前价格回避
      - - 核心单位经济性到下一轮融资窗口仍不披露
        - 没有经审计的毛利率、NRR、集中度或优先权披露
        - 风险溢价过高，无法支撑风险投资式回报测算
        - 无论品牌强度如何，维持继续研究
      - - 出现重大隐私或合规问题
        - 监管调查、客户暂停，或与审计挂钩的收入争议
        - 同时压缩增长和退出倍数
        - 在拿到整改证据前，按投资逻辑破裂处理
    notes: 这些触发因素刻意把抽象担忧转成可监测事件，并可据此改变投资决定。
    claimRefs:
      - CV025
      - CV026
      - CV028
      - CV029
      - CV030
