  - id: TP002
    title: 定价 / 包装对比
    description: >-
      Public pricing signals are uneven; where list pricing is unavailable, packaging structure and visibility are shown
      instead.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly available price signals are sparse for enterprise contracts. Table captures disclosed pricing, reported
        ranges, or explicit unknowns for the main comparison set.
    columns:
      - 产品
      - 公开价格信号
      - 合同模式
      - 包含范围
      - 可见度
      - 启示
    rows:
      - - Nuance DAX Copilot
        - $369-$830+ / 每名临床医生 / 月，见市场摘要报道
        - 企业订阅，通常按年
        - 环境式病历记录、Copilot 工作流、EHR 嵌入
        - 中
        - 最清晰的公开基准；常常塑造买方对高端环境式工具的价格预期
      - - Abridge
        - 企业定制报价；没有稳定公开标价
        - 按部署范围签企业合同
        - 环境式文档，加上 Linked Evidence，并扩展住院 / 护理工作流
        - 低
        - 销售更可能围绕企业结果，而不是透明座席定价
      - - Ambience Healthcare
        - ~$2.8K-$5K / 每名临床医生 / 年，第三方分析师报道
        - 按临床医生 / 模块组合签年度合同
        - AutoScribe、AutoCDI、AutoNote 及相邻模块
        - 低
        - 若 CDI 价值兑现，报道中的年度定价会显得划算
      - - Suki
        - 通常定制；单席价格并未持续公开
        - 按临床医生或企业签助手合同
        - 助手、听写、环境式功能和伙伴集成
        - 低
        - 渠道合作可能比表面标价更关键
      - - Nabla
        - 企业报价；公开标价少见
        - 以助手为先的企业订阅
        - 环境式文档、临床医生助手工作流、多语言支持
        - 低
        - 定位常在于更容易铺开，不一定是最低标价
      - - 人工医疗文书员
        - $35K-$65K / 每名临床医生-年（现场）；~$14K-$30K（远程）
        - 编制或外包服务合同
        - 人工病历准备 / 转录支持
        - 中
        - 直接人工成本高得多，但熟悉且模型风险低
      - - 内部自建 / AWS HealthScribe
        - 按用量计费的基础设施，加集成成本
        - 内部项目预算 + 云用量
        - 语音、摘要和定制工作流建设
        - 中
        - 只有工程、安全和 EHR 集成能力强的团队，才可能跑出成本效率
    notes: “可见度”反映公开来源中价格有多容易被找到。低可见度不代表成本更低。Ambience 定价来自第三方报道，并非公司确认。
    claimRefs:
      - CP003
      - CP016
      - CP017
      - CP030
