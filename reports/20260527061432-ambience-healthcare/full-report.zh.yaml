      - number: '5.2'
        title: 架构、集成与运营模型
        blocks:
          - type: paragraph
            body: >-
              公开技术定位最具体的部分是 EHR 集成，而不是模型内部机制。Ambience 表示，它用基于标准的架构读写 Epic、Cerner 和 Athena 工作流；其中 Epic 被点名为最深的触达面，覆盖
              SMART on FHIR、Ambient APIs、Hyperspace、Haiku 和 Epic Toolbox。Cerner 写回支持的描述也比许多竞品对非 Epic 支持的描述更具体：签署前，笔记可以在
              DynDoc 和 MPages 里按章节编辑。Microsoft Marketplace 又提供了第二个外部分发信号，尤其是 Ambience 表示其平台使用 Azure OpenAI，并通过
              Marketplace SKU 支持试点和按用户购买。公开招聘所暗示的运营模型，是临床与工程结合的组织：职业页上同时出现临床 AI、前沿
              AI、平台、分布式系统、隐私、安全和照护转型角色。这种组合更像一个前置部署的产品组织，围绕照护场景和医疗系统工作流调优功能，而不是自助式软件销售。
