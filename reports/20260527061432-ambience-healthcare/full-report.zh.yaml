      - number: '8.3'
        title: 可比公司与情景
        blocks:
          - type: paragraph
            body: >-
              最干净的私营可比公司是 Abridge，但它同时支持和削弱 Ambience 的估值。Abridge 2025 年 Series E 的 $5.3 billion
              估值确实昂贵，但那个价格建立在大得多的已披露规模和更大的公开足迹之上。公开医疗软件可比公司没那么直接，但仍适合作为退出锚点，因为它们显示了当叙事让位于公开市场纪律后，已披露规模的业务会如何交易。按 2026 年
              5 月可用数据，Tempus 和 Doximity 都在约 5x 到 6x 收入附近，远低于 Ambience 隐含私有倍数。这不意味着 Ambience 今天就应按公开市场倍数定价，但意味着当前轮次只有在
              Ambience 复合增长到大得多的
              ARR、同时保住溢价退出倍数时才成立。因此，情景表比标题轮次价格更重要：当前定价仍可能跑通，但需要一条相当苛刻的增长路径。换句话说，当前估值并非不可能，只是不能容忍滑坡。ARR
              小幅低于预期、模块挂载更慢，或打包压力来得比预期更快，都可能让 Ambience 很快从溢价私有倍数滑向公开可比公司区间。正是这种不对称，让情景区间的中心更接近保本，而不是显而易见的超额上行。
