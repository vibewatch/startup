  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与公开足迹
        blocks:
          - type: paragraph
            body: >-
              Ambience 可见客户群明显偏向企业级医疗系统和其他组织复杂度高的提供方机构。具名账户包括大型非营利医疗系统、学术或创新导向系统、区域综合网络，以及一层较小的专科提供方。公开可见的证明点包括
              Cleveland Clinic、Houston Methodist、St. Luke’s Health System、MultiCare、John Muir Health、Ardent Health 和
              Onvida Health。专科与渠道扩张也体现在 Midi Health、Pediatric Associates、Alpine Physician Partners 和 Eventus
              WholeHealth。这种客户画像，与依赖自助医生或单体诊所的自下而上环境式工具有实质差异。


              含义有两层。第一，Ambience 赢下了具备真实采购纪律和复杂工作流要求的买方，这是很强的 PMF 信号。第二，公开客户记录也因此偏向高
              ACV、低数量账户。这对企业信誉很好，但会提高集中度和续约重要性。最宽口径的可防守公开数量，仍是 2025 年 7 月 Series C 前后披露的 40+ 家医疗系统；不过，2026
              年具名铺开名单不断增加，说明真实上线足迹如今可能已经高于这个公开下限。
