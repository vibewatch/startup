  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 工作流覆盖与模块地图
        blocks:
          - type: paragraph
            body: >-
              Ambience 现有产品页把公司定位为覆盖完整临床工作流的 AI
              平台，而不是只做转写的环境式病历助手。平台围绕诊前、诊中、诊后三段组织。诊前工具聚焦上下文汇总：患者摘要、按问题组织的病历整合、住院摘要，以及来自 EHR
              的日程和清单同步。诊中工具聚焦环境式聆听、多说话人归属、用于文档的翻译、Chart Chat
              问答、医嘱支持和患者指导生成。诊后工具聚焦结构化病历组装、出院和转诊输出，以及旨在提升收入完整性和合规性的编码感知文档。整个产品面上，Ambience 反复强调同时服务临床医生体验，以及下游文档、CDI
              和计费工作流。这种宽度很重要，因为它是公司相对只营销狭窄病历捕捉层的供应商，最清晰的产品差异化主张。
