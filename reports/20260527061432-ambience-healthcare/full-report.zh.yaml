      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >
              环境式 AI 临床文档的采购架构涉及多方，明显不同于消费软件。买方是医疗系统的临床和技术领导层，而不是单个医生。具体看，企业级采购通常由首席医疗信息官（CMIO）
              或首席医疗官（CMO）作为临床倡导者牵头，首席信息官（CIO）负责技术集成，首席财务官（CFO）或财务副总裁掌握预算。当合同范围延伸到 CDI
              或编码自动化时，收入周期负责人和医疗编码主管也有额外影响力。单个医生是主要用户，也是采用率的关键杠杆——医生使用率和满意度直接决定医疗系统是否扩张、续约或流失—— 但他们很少发起或拥有采购。


              支付方关系是间接而非直接的：医疗系统按每名临床人员每年的 SaaS 合同向 Ambience 付费，预期财务回报来自几部分组合：临床人员留任节省（替代昂贵真人记录员，
              并降低职业倦怠导致的医生流失）、CDI/HCC 捕捉改善带来的增量收入，以及更完整文档支撑合适 E/M level 编码后带来的报销提升。Menlo Ventures 数据显示，2025 年 $1.4
              billion 医疗 AI 总支出中，医疗系统贡献约 $1 billion，而门诊 / 医生集团买方只有 $280 million， 医疗保险支付方只有 $50
              million。这确认大型非营利整合型医疗服务网络既是最大支出方，也是最早采用者。


              AJMC 研究（2026 年 1 月，Emory University）提供了最严谨的采用模式数据：在 2025 年 6 月使用 Epic EHR 的 2,784 家美国医院中，62.6% 已采用某种环境式 AI
              工具。采用者明显偏向大型、非营利、都市区、财务更强（经营利润为正）且工作负荷更高的医院。 营利性医院的调整后采用概率明显更低（28.8%），低于非营利医院（70.2%）。这组数据强烈暗示，Ambience
              的甜蜜点——大型学术医疗中心和整合型医疗服务网络—— 已经是主要采用人群，未来渗透增长必须越来越多来自利润更薄的中端市场系统或规模较小的营利性连锁医院，而这些场景的采用经济性证据较弱。


              医生集团和专科诊所买方是次要但在增长的细分，尤其是相对报销水平而言文档复杂度高的专科（肿瘤、精神科、急诊医学、胃肠病学）。这些集团的销售周期可能短于完整医疗系统，
              但合同金额更小，流失风险也可能更高。Ambience 声称支持 200+ 专科，并在复杂专科展示业绩（公司发布数据显示，心脏病学 E/M 编码准确率 97%， 肿瘤学
              99%），比通用记录产品更可信地回应了这一细分的需求。专科集团若隶属于医疗系统，采用路径通常走医疗系统伞形架构；独立集团则通过直接商业关系采购。
