    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与商业模式
        blocks:
          - type: paragraph
            body: >
              Ambience Healthcare 是一家私营医疗 AI 公司，总部位于加利福尼亚州旧金山 550 California Street。公司由 Mike Ng 和 Nikhil Buduma 于 2020
              年联合创立，使命是用环境式 AI 自动化文档、编码和临床文档完整性（CDI）工作， 把临床医生从电子健康记录（EHR）的行政负担中解放出来。2025 年 7 月 29 日，公司完成 $243 million
              Series C 融资， 投后估值 $1.25 billion，进入 Series C 阶段独角兽行列。


              Ambience 的商业模式是 B2B 企业 SaaS，按临床全职当量（FTE）签年度合同收费。第三方分析师 Sacra 估计， 基础 AutoScribe 定价为每名临床服务提供者每年
              $2,800–$3,200；加入 AutoCDI、AutoAVS 和 AutoRefer 模块后， 完整 AI 套件达到每名临床服务提供者每年 $4,000–$5,000。一次性实施费覆盖 EHR
              集成和专科模板调优。 平台目前服务门诊（ambulatory）、急诊和住院场景，支持 100+ 临床专科。公司未公开收入和 ARR；分析师估计在封面指标部分讨论。


              产品组合覆盖完整临床工作流：AutoScribe（环境式实时 AI 记录助手）、AutoCDI（诊疗现场 ICD-10 和 CPT 编码辅助）、
              AutoAVS（患者就诊后摘要）、AutoRefer（专科转诊信）、Patient Recap/AutoPrep（就诊前病历摘要），以及近期推出的 Chart Chat for
              Nursing（用自然语言查询患者记录）。平台通过嵌入式组件原生集成 Epic、Oracle Cerner、athenahealth 和其他几家主要 EHR，写入离散 EHR 字段，而不是生成文本块。
