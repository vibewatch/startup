        title: 具名生产部署与铺开证明
        blocks:
          - type: paragraph
            body: >-
              最强的客户证据来自具名医疗系统，它们同时披露了生产范围和可量化结果。St. Luke’s 提供了最丰富的公开案例之一，拥有 1,313 名附属提供者、8 个医疗中心和 350+
              家诊所。它的公开故事包括多专科试点数据、病历记录负担下降，以及更像真实生产使用、而非实验室演示的生活质量叙事。Houston Methodist
              提供了第二个强证明点，因为其铺开覆盖门诊、急诊和住院场景。这种宽度很重要：它显示产品可以越过相对简单的门诊病历生成，进入运营更复杂的环境。


              MultiCare 的重要性在另一处。它公开把决策描述为一次严格的正面对比评估，涉及 550 名临床医生、20 多个专科和 3 个竞品方案。Cleveland Clinic 同样重要，因为它的五方比选和 5
              年独家合作，读起来像企业买方眼中的参考级市场验证。John Muir、Onvida 和 Ardent 则补齐了图景：Ambience 能在不同区域系统和 EHR 语境中落地、扩张和运行，而不只是依赖一个旗舰账户。
