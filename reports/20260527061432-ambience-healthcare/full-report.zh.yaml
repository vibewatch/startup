      - number: '8.2'
        title: 当前价格与公开证明
        blocks:
          - type: paragraph
            body: >-
              按公开估计，Ambience 2025 年 7 月 $1.25 billion 的价格，意味着按较低的 Sacra 数字计算约 42x ARR，按较高的 GetLatka 数字计算仍接近 20x。对一个定义品类的
              AI 资产来说，这并非不可能，但留给披露缺口的空间很小。Ambience 没有公开披露 GAAP
              收入、毛利率、NRR、烧钱速度或优先股结构，因此外部无法判断公司是否已经高效复合增长到足以防守这个溢价。与此同时，最支持性的公开客户证据——Cleveland 和 St.
              Luke’s——证明了工作流价值，却没有证明晚期投资人需要的经常性财务画像。换句话说，当前公开证明验证了产品和品类，但还没有充分验证价格。
