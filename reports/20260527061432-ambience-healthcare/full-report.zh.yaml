  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 哪些证据会改变判断
    rows:
      - - Ambience 已有真实企业客户牵引，平台也比单纯环境式病历记录工具更宽。
        - 披露模块级经济性，证明 CDI、编码和 EHR 内产品能显著改善 ARR 质量和毛利率。
      - - Ambience 卖的是工作流深度，不只是转录；因此相对纯病历记录厂商享有溢价有一定道理。
        - 证明挂载率和续约确实随工作流宽度扩张，而不是拖累实施。
      - - 尽管公开财务证据有限，当前价格已经计入了相当一部分溢价逻辑。
        - 提供经审计且超过 $50 million 的 ARR、强留存，以及能支撑入场倍数的 2028 年 ARR 路径。
      - - 在 Ambience 证明完整平台变现前，Epic 和 Nuance 的捆绑销售可能先压缩价格。
        - 证明即便面对捆绑替代方案，Epic 占比较高客户中的胜率和模块挂载仍然稳定。
    notes: 该表把业务质量论点和入场价格论点拆开，确保投资建议始终受估值约束。
