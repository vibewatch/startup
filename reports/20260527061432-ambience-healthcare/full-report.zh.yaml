      - number: '2.2'
        title: 市场规模测算——TAM、SAM 与自下而上视角
        blocks:
          - type: paragraph
            body: >
              已发布的分析师估计跨度很大，取决于发布方把市场定义为：（a）仅环境式临床记录，（b）广义临床文档 AI，（c）包含人工服务的 CDI 市场， 或（d）更宽的 ACI
              平台机会。每个视角都会得出显著不同的数字，且没有任何单一估计能干净隔离 Ambience 今天实际服务的美国企业医疗系统细分市场。


              最窄且可靠的锚点是 Menlo Ventures 2025 年 10 月的市场份额分析。该分析把 2025 年环境式 AI 记录市场定为 $600 million 收入；
              这是目前最具体的自下而上数字，因为它来自医疗系统运营者报告的供应商级支出，而不是分析师建模。在这一基数上，Ambience 报告的 13% 份额意味着 2025 年约 $78 million
              归因于记录细分的收入（公司未确认）。同一报告另将编码和计费自动化市场定为 2025 年 $450 million， 合并后的记录 + 编码已捕获市场约 $1.05 billion。


              Mordor Intelligence 将临床文档 AI 市场（更宽定义，涵盖临床场景中的记录、CDI、编码和工作流 AI）测算为 2026 年 $1.15 billion，并以 21.46% CAGR 增长，到
              2031 年达到 $3.05 billion。同一机构另将医疗编码 AI 市场测算为 2026 年 $3.38 billion，并以 13.26% CAGR 增长，到 2031 年达到 $6.30
              billion。The Business Research Company 将完整 CDI 市场（人工服务加软件）测算为 2026 年全球 $4.65 billion；较温和的 8% CAGR 反映传统人工主导
              CDI 服务增长较慢。 SNS Insider 的环境式临床智能市场报告（2026 年 5 月）采取最宽口径，认为全球 ACI 市场 2025 年为 $7.24 billion，并预计到 2035 年达
              $56.61 billion，CAGR 为 22.85%；美国子细分市场另被测算为 2025 年 $2.87 billion。


              自下而上的医生数量视角提供有用交叉校验。美国截至 2026 年约有 950,000 名活跃执业临床人员。按 Ambience 披露的完整套件每名服务提供者每年 $2,800–$5,000 定价，仅记录和文档 AI
              的理论全临床人员 TAM 约为 $2.65 billion 到 $4.75 billion，已扣除传统记录员和听写替代品。 这个视角高估近期 SAM，因为：（a）Ambience
              面向大型企业医疗系统，而非个体执业者；（b）并非所有专科类型当前都可触达（尽管 Ambience 声称支持 200+ 专科）；（c）PHTI
              研究确认，即便部署后，单个医疗系统内符合条件的服务提供者实际使用率通常也集中在 20% 到 50%。 若采用 50% 渗透率上限，并按企业级细分（Menlo Ventures 称大型非营利医疗系统约占医院支出的
              55%）调整，可得到更保守的 SAM 估计： $700 million 到 $1.3 billion。


              公开数据无法推导 Ambience 的具体 SOM。公司未披露 ARR；第三方估计从 $30 million（Sacra，2025 年 5 月）到 $64.1 million （GetLatka，2025 年 9
              月）不等，这一差距本身就提示 SAM 渗透不确定。这些相互矛盾的 ARR 估计在此保留，而不强行调和。
