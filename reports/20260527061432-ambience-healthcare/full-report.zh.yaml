      - number: '2.5'
        title: 展项
        blocks:
          - type: callout
            title: 环境式记录是滩头阵地，不是整个市场
            body: >
              Ambience 持有 13% 市场份额的 $600M 环境式记录市场，只是当前收入锚点。AI 辅助 CDI、编码和更宽 ACI 平台层的可触达机会大 2–5×，而 Ambience
              的产品架构（AutoCDI、多专科编码准确性、EHR 原生集成）正是为捕捉该扩张而设计。先部署环境式记录的医疗系统， 更可能从同一供应商加购 CDI 和编码模块，使记录部署成为低摩擦增购漏斗——前提是
              Ambience 能在已建立的降低职业倦怠证据点之外，证明具体收入完整性 ROI。
            calloutType: insight
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: callout
            title: 财务 ROI 模糊限制利润敏感型医院采用
            body: >
              Peterson Health Technology Institute 2025 年 3 月分析发现，环境式 AI
              记录助手降低临床人员职业倦怠的证据稳定，但在医疗系统层面改善患者吞吐、计费准确性或财务回本的证据不清晰。
              这个缺口构成重大约束：经营利润为负或很薄的医院（美国多数农村和政府医院）调整后采用概率较低。Ambience 聚焦大型非营利机构，缓解了近期敞口； 但随着容易触达的细分市场饱和，向利润承压市场增长需要硬财务
              ROI 数据，而这种数据尚未大规模出现。
