      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释
      - 尽调路径
    rows:
      - - CEO / 创始人领导力
        - Mike Ng 交棒给 Nikhil Buduma，扩张期运营节奏会变化
        - 中
        - 高
        - 创始人延续性仍在；若职责清晰，角色拆分应能降低集中度
        - 审查交接后的运营指标、董事会节奏和授权职责
      - - 收入领导力
        - 新 CRO/CVO 搭建说明 GTM 扩张仍在推进
        - 中
        - 中高
        - 高管加入补强了有经验的运营班底
        - 索取管线转化、销售效率和企业级实施交接指标
      - - 安全 / 隐私 / 合规职能
        - 公开证据看不到团队深度、认证或一线归属
        - 中
        - 高
        - 价值观叙事和采购纪律可能有帮助，但不能证明控制成熟
        - 索取组织架构图、认证以及具名负责领导
      - - 实施与临床信息学能力
        - 多场景产品线需要深度部署支持和专科调校
        - 高
        - 中高
        - 客户签约能证明能力，但不能证明人员配置足够
        - 核查各模块部署人手比例、积压项目和价值兑现周期
    notes: 领导层变动、人员深度不透明和产品线宽度交叠时，执行风险会抬高。
