            body: Sharp HealthCare 环境式 AI 诉讼说明，即便临床医生喜欢产品，客户层面的治理风险也会产生影响。因此，Ambience 的长期耐久性不仅取决于工作流质量，也取决于客户如何安全地运营录音和同意流程。
