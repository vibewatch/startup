      figures across publisher segments cannot be reconciled without company disclosure.
    whyItMatters: >-
      The 2× ARR spread and the 6× variation in TAM estimates across publishers ($600M scribe to $7.24B ACI) prevent
      confident sizing of the addressable market and Ambience's penetration within it.
    diligencePath: >-
      Obtain company-provided ARR, cohort data, and NRR at due diligence; select a single market definition for the
      sizing model and document the choice explicitly.
