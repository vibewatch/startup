evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: metrics
    missingEvidence: >-
      Ambience Healthcare's actual ARR, revenue, gross margin, and net revenue retention rate—none of which are publicly
      disclosed. Third-party estimates diverge ($30M–$64M) and may be based on self-reported or modeled data.
    whyItMatters: >-
      ARR is the primary metric for evaluating the $1.25B valuation multiple (implied 20–40x ARR); without a confirmed
      ARR figure, valuation analysis rests on competitive comparables rather than fundamental metrics.
    diligencePath: >-
      Request audited financial statements or a detailed revenue schedule from the company; cross-reference with
      customer contract counts and average contract values from product pricing analysis.
    relatedQuestionRefs:
      - QO011
  - type: private-evidence-only
    severity: material
    topic: investors
    missingEvidence: >-
      Full board composition, director identities, board seat assignments per funding round, and formal governance
      documents (voting agreements, information rights, protective provisions).
    whyItMatters: >-
      Board governance determines the balance of power among founders, early investors, and later-stage institutional
      investors at a $1.25B valuation; key-person protections and founder control arrangements are not determinable from
      public sources.
    diligencePath: >-
      Request shareholder agreement, voting agreement, and board observer list from the company directly; cross-check
      with SEC EDGAR form D filings.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: minor
    topic: funding
    missingEvidence: >-
      Seed round size, pre-money valuation, and complete investor list for the 2020 seed round are not publicly
      available.
    whyItMatters: >-
      Seed round terms establish original founder dilution and the historical cap table structure; without this data,
      the fully diluted share count and founder equity position cannot be estimated.
    diligencePath: >-
      Review Delaware Secretary of State filings or Series A certificate of incorporation for authorized share classes;
      request cap table from company.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: metrics
    missingEvidence: >-
      Current employee headcount as of May 2026 is not officially published; the most recent official figure ('200+')
      dates to September 22, 2025.
    whyItMatters: Headcount growth rate informs burn rate estimates and organizational scaling capacity at the Series C phase.
    diligencePath: Review LinkedIn headcount trend data; request company head count confirmation as of Q1 2026.
    relatedQuestionRefs:
      - QO013
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: >-
      Internal product milestones, platform version history, architecture pivots, and any private adverse events
      (regulatory inquiries, customer escalations, staff reductions) prior to Series C are not publicly documented.
    whyItMatters: >-
      A complete milestone record is essential for assessing execution pacing, any pivot risk, and whether growth has
      been linear or punctuated by setbacks.
    diligencePath: >-
      Request internal product roadmap and any board-level milestone tracking from the company; review Glassdoor and
      LinkedIn for organizational signals.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: minor
    topic: customers
    missingEvidence: >-
      Customer retention rate, churn history, contract renewal data, or net revenue retention (NRR) have not been
      publicly disclosed.
    whyItMatters: >-
      In enterprise SaaS at $4K+ per provider annually, NRR is a critical indicator of land-and-expand viability and
      competitive switching risk.
    diligencePath: >-
      Request customer cohort data and contract renewal history from the company; review public customer testimonials
      for any indication of switching or partial adoption rollback.
  - type: private-evidence-only
    severity: material
    topic: market-size
    missingEvidence: Ambience Healthcare's actual ARR, contract count, and per-health-system economics are not publicly disclosed.
    whyItMatters: >-
      Without confirmed ARR, the SOM calculation relies entirely on conflicting third-party estimates ranging from $30M
      to $64M—a 2× spread that prevents accurate market penetration analysis.
    diligencePath: >-
      Request audited financials or management representation letter as part of Series C due diligence; compare with
      independent ARR estimates from Sacra and GetLatka.
    relatedQuestionRefs:
      - QM002
      - QM028
  - type: missing-source
    severity: material
    topic: market-size
    missingEvidence: >-
      No published, methodology-disclosed SAM calculation specifically isolating the U.S. large nonprofit health-system
      enterprise ambient AI market exists from a primary-tier source.
    whyItMatters: >-
      Published TAM figures (SNS Insider, Mordor, BRC) all use different market boundary definitions; none cleanly maps
      to Ambience's actual go-to-market segment, making addressable market sizing inherently uncertain.
    diligencePath: >-
      Commission primary analyst work (KLAS, Definitive Healthcare, or IDC Health Insights) to produce a
      definition-aligned SAM for enterprise health systems.
    relatedQuestionRefs:
      - QM001
      - QM028
  - type: missing-source
    severity: material
    topic: financial-roi
    missingEvidence: >-
      No large-scale, peer-reviewed study has demonstrated statistically significant physician productivity improvement
      or health system financial payback from ambient AI scribing at full enterprise scale.
    whyItMatters: >-
      The PHTI March 2025 analysis specifically identified this gap; it limits CFO-level budget authorization at
      margin-constrained health systems and constrains Ambience's ability to price on financial ROI rather than burnout
      reduction.
    diligencePath: >-
      Track Ambience-sponsored ROI studies; evaluate whether the Cleveland Clinic and UCSF partnership data include
      financial outcome metrics beyond documentation time.
    relatedQuestionRefs:
      - QM018
      - QM025
