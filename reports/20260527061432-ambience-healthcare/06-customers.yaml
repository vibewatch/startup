- id: TU005
  title: Expansion and Concentration Risk Table
  columns:
  - Expansion Driver
  - Concentration / Risk
  - Impact
  - Diligence Path
  rows:
  - - Pilot-to-enterprise progression
    - Large logos may each represent material ACV
    - Few wins or losses could move revenue disproportionately
    - Request ACV by top 10 accounts
  - - Cross-setting expansion (ambulatory → ED → inpatient)
    - Operational complexity may slow standardization
    - Can raise service burden even while expanding ARR
    - Review deployment staffing by module
  - - Nursing and inpatient adjacencies
    - Roadmap-stage features may be over-credited in ARR forecasts
    - Attach-rate assumptions could be too optimistic
    - Request current attach rates and active-user counts by module
  - - Specialty-group expansion
    - SMB or specialty channels may churn faster than IDNs
    - Could dilute perceived retention quality
    - Segment churn by customer type
  - - Consent / privacy governance
    - Customer legal exposure can damage deployment willingness
    - Could stall or reverse rollout in sensitive markets
    - Review consent workflows and lawsuit history
  - - Economic proof burden
    - High satisfaction without hard ROI may not support renewals
    - Could limit expansion into margin-constrained systems
    - Request customer ROI scorecards and CFO references
  notes: This table mixes customer expansion vectors with risks that could weaken retention or standardization.
