- id: named-production-deployments
  title: Named Production Deployments and Rollout Proof
  body: 'The strongest customer evidence comes from named health systems that disclosed both production scope and measurable outcomes. St. Luke’s offers one of the richest public case studies, with 1,313 affiliated providers, eight medical centers, and 350+ clinics. Its public story includes multi-specialty pilot data, reductions in charting burden, and a quality-of-life narrative that feels like genuine production use rather than a lab demo. Houston Methodist provides a second strong proof point because its rollout spans ambulatory, emergency, and inpatient settings. That breadth matters: it shows the product can move beyond note generation in relatively simple outpatient clinics and into more operationally complex environments.


    MultiCare is important for a different reason. It publicly framed its decision as the result of a rigorous head-to-head evaluation involving 550 clinicians across more than 20 specialties and three competing solutions. Cleveland Clinic is similarly important because its five-way bake-off and five-year exclusive partnership read like reference-level market validation for enterprise buyers. John Muir, Onvida, and Ardent then round out the picture by showing that Ambience can land, expand, and work inside different regional systems and EHR contexts, not just in one flagship account.'
