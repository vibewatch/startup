callouts:
- calloutType: strength
  title: Public customer proof is unusually strong for a private healthcare AI company
  body: Ambience is not relying on anonymous logo walls. It has public rollout and outcome evidence from multiple large systems, including Cleveland Clinic, Houston Methodist, St. Luke’s, and MultiCare. That breadth of production proof is a meaningful moat in enterprise procurement.
  claimRefs:
  - CU003
  - CU006
  - CU009
  - CU012
  - CU035
- calloutType: risk
  title: Retention is the main blind spot in the customer record
  body: The public record is rich on adoption and rollout, but poor on renewals, NRR, churn, and contract terms. That means the customer story is compelling but still incomplete for recurring-revenue underwriting.
  claimRefs:
  - CU024
  - CU031
  - CU032
  - CU039
- calloutType: risk
  title: Consent and governance failures could slow or reverse deployments
  body: The Sharp HealthCare ambient-AI litigation illustrates that customer-level governance risk can matter even when clinicians like the product. Ambience's long-term durability therefore depends not only on workflow quality but also on how safely customers operationalize recording and consent.
  claimRefs:
  - CU029
  - CU038
  - CU040
