- id: expansion-and-concentration
  title: Expansion Dynamics, Concentration, and Retention Limits
  body: 'The expansion pattern visible in public materials is clearly land-and-expand. Cleveland Clinic progressed from evaluation to exclusive partnership. Houston Methodist progressed from phased ambulatory use to broader enterprise rollout across ambulatory, emergency, and inpatient settings. MultiCare moved from bake-off to planned expansion across 1,500 clinicians. John Muir announced a full enterprise rollout. Onvida highlighted deeper Epic-linked workflows. These are all hallmarks of a product that can start with documentation and then expand across seats, specialties, and use cases. Ambience''s move into nursing and inpatient workflows strengthens that pattern further because it opens new buyer personas and new module attach opportunities inside the same account.


    The downside is concentration and opacity. Publicly visible logos skew large, so individual health systems may each represent meaningful ACV. Yet no public source reviewed disclosed renewal dates, contract length, churn, NRR, or cohort expansion curves. That makes it hard to know whether today''s marquee logos are becoming durable recurring-revenue relationships or simply strong pilots and early rollouts. The company therefore looks like it has excellent expansion potential, but still insufficient public retention data to remove concentration concerns.'
