  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, renewal schedules, logo churn, and cohort expansion data by customer vintage.
    whyItMatters: Without retention metrics it is impossible to distinguish durable platform adoption from early rollout enthusiasm.
    diligencePath: Request cohort dashboards and renewal schedules for the last 12–24 months.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU025
  - type: missing-source
    severity: material
    topic: customer-count-denominator
    missingEvidence: A current, company-confirmed customer-count figure with definition of what counts as live, pilot, paid, or enterprise.
    whyItMatters: Named accounts are plentiful, but the public denominator for total paying customers is stale and ambiguous.
    diligencePath: Ask management for a current customer-count bridge and live-account definition.
    relatedQuestionRefs:
    - QU023
  - type: conflicting-data
    severity: material
    topic: financial-impact-proof
    missingEvidence: Independent multi-customer financial impact studies showing margin or throughput lift beyond case studies.
    whyItMatters: Customer love alone does not prove that deployments scale into durable profitability for providers or for Ambience.
    diligencePath: Request third-party ROI reports and provider-side measurement methodology.
    relatedQuestionRefs:
    - QU020
