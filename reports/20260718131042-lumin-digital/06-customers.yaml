- id: TU005
  title: Expansion and concentration risk table
  columns:
  - expansion driver
  - concentration risk
  - impact
  - diligence path
  rows:
  - - Retail + business breadth on one platform
    - Large multi-workflow customers may become strategically important
    - Supports land-and-expand but raises account-specific dependency risk
    - Request revenue by customer size band and module attach
  - - Positive satisfaction and referenceability signals
    - High satisfaction may not equal high realized expansion revenue
    - Could overstate durability if references come from a favored subset
    - Request expansion ARR and referenceable-client overlap
  - - Client-investor advisory model
    - Customer-shareholders may influence roadmap or pricing expectations
    - Can deepen stickiness but complicate governance and concentration analysis
    - Request ownership concentration and commercial independence policies
  - - Large client-investors such as Redwood
    - A few large institutions could matter disproportionately to brand and pipeline
    - Loss of one influential client could have outsized signaling effects
    - Request top-10 revenue share and pipeline concentration
  - - Named enterprise-scale wins such as Ent
    - Very large deployments can absorb implementation resources
    - Operational focus on marquee accounts may pressure smaller-customer service
    - Request implementation staffing mix and support SLAs by account tier
  notes: This risk table focuses on customer-base durability and concentration, not broader product or regulatory risks covered elsewhere.
