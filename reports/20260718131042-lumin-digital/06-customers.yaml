  rows:
  - - Credit unions
    - CU executives and digital leaders
    - Members plus branch/contact-center staff
    - Retail/mobile banking plus business/member-service workflows
    - Largest clearly signaled segment in public materials
    - Exact count and revenue mix by credit-union cohort not disclosed
  - - Community banks
    - Bank executives and digital leaders
    - Retail customers, business users, bank staff
    - Online/mobile banking, account opening, controls, service
    - Shows Lumin is not CU-only and broadens TAM
    - Public bank count is inconsistent across pages
  - - Retail / consumer users
    - Institution as buyer; end user is consumer/member
    - Consumers and members
    - Balances, transfers, alerts, wallets, card controls, savings tools
    - High-frequency engagement layer that drives relationship depth
    - Active-user rate and MAU not disclosed
  - - Business / commercial users
    - Institution as buyer; business accounts as end users
    - Business owners, treasury users, sub-users
    - ACH, entitlements, wires, RDC, cash management
    - Raises contract value and switching cost versus consumer-only banking
    - Attach rate and business-user penetration not disclosed
  notes: Segmentation is based on public buyer and workflow evidence, not on disclosed revenue breakdowns.
