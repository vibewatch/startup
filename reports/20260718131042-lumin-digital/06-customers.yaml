- id: durability-satisfaction-and-repeat-usage
  title: Durability, satisfaction, and repeat usage
  body: 'Public durability evidence is encouraging but incomplete. Lumin’s own pages emphasize 97% to 100% referenceability, near-90 NPS, and zero reported customer loss. The 451 Research study adds more substantive operating proxies: products per customer up 11%, churn down 15%, call-center volume down 21%, branch transactions down 17%, and some deployments achieving NPS increases of up to 30 points. If directionally true, those data points suggest that Lumin is not only getting deployed, but also driving deeper digital usage and supporting longer-lived customer relationships.


    Third-party sentiment is broadly aligned with that story. Lumin’s G2 marketing page says 100% of reviewers gave 4 or 5 stars and 95% would recommend the platform. The live review page shows a 4.7/5 score across 19 reviews and repeatedly praises responsiveness, partnership, and implementation support. That said, the same reviews surface non-trivial friction: some features launch before they are fully fleshed out, and some buyers find enhancement, analytics, or feature pricing expensive. Those caveats matter because they hint at the kinds of issues that can slow expansion or create renewal tension even when core satisfaction is high.


    The key underwriting limit is that none of these public signals substitute for true GRR, NRR, contract-duration, or cohort-renewal disclosure. They are useful durability proxies, but they remain proxies.'
