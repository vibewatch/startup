chapter:
  number: 6
  title: Customers
  summary: Lumin has credible public customer proof across both credit unions and community banks, with real launches, live feature evidence, positive satisfaction signals, and an unusual client-investor alignment model. The main limitation is not adoption itself; it is the absence of underwriter-grade public disclosure on retention cohorts, module attach, and customer concentration.
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: 'Lumin’s customer base is clearly institutional, but it is not monolithic. The retained sources show two primary buyer groups—credit unions and community banks—and two major end-user populations inside those buyers: retail/member users and business/commercial users. Lumin’s retail and commercial product pages reinforce that the company is not selling a narrow consumer-only app; it is selling a broader digital-banking relationship layer that can cover both everyday consumer workflows and more complex business cash-management needs.


    Public scale disclosures are directionally strong, though not perfectly clean. The about page says Lumin serves nearly eight million consumer accounts across ninety financial institutions. The credit-unions page says 90+ credit unions and 8M+ users. The banks page says 50+ financial institutions and 8M+ users. Those numbers confirm meaningful customer breadth, but they also imply denominator drift: the company appears to update different marketing surfaces at different times and with different segmentation logic. Investors should treat the figures as proof of scale, not as audit-grade cohort accounting.


    The most useful segmentation conclusion is that Lumin has reached multi-asset, multi-segment relevance inside U.S. community finance. It is not just selling to small institutions, nor only to one side of the market. Named customer proofs span community banks and large credit unions, and the product surface supports both consumer/member engagement and business-banking workflows.'
  claimRefs:
  - CU001
  - CU003
  - CU006
  - CU008
  - CU031
  - CU032
  tableRefs:
  - TU001
  - TU002
  figureRefs:
