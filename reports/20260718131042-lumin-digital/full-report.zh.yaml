      - number: '3.3'
        title: 定价、GTM 杠杆和转换成本
        blocks:
          - type: paragraph
            body: >-
              整个领域的公开定价透明度都很弱。保留来源更清楚地展示产品打包和货币化姿态，而不是字面标价。Alkami 是少数披露足够财务细节的公司之一，可以通过
              ARR、用户数和每注册用户收入推断货币化效率。多数其他公司——包括 Lumin、Q2、Jack Henry、Fiserv 和
              Tyfone——售前图景大多由报价或配置驱动。对复杂企业银行软件来说，这种不透明很正常，但它让外部价值基准更难做。


              因此，GTM 杠杆和原始功能广度同样重要。Jack Henry 和 Fiserv 可以把数字能力与长期核心、支付和服务关系一起销售。Q2 可以指向大型银行胜利和近十亿美元规模。Alkami
              可以指向专注数字银行规模和更清晰的货币化模型。Tyfone 可以吸引想要现代但不那么庞杂选项的小型机构。Lumin
              的合作型所有权和可背书性主张，可能在进入会议室后增强信任，但其较小的公开规模意味着它不能只靠市场力量赢。


              采购之后，转换成本变高。数字银行供应商位于核心系统、支付、欺诈控制、提醒、服务工作流和用户行为数据的交汇处。任何可信在位者都会因此变得粘性，替换决策成本也会提高。这也意味着胜率、实施成功率和流失率极其重要——但
              Lumin 和多数同业在这些指标上的公开证据仍然薄弱。
