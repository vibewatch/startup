      - number: '2.4'
        title: 需求驱动、约束和开放的规模缺口
        blocks:
          - type: paragraph
            body: >-
              Lumin 所在市场的需求逻辑很强。Federal Reserve 数据显示，数字支付使用频繁且越来越移动化，这让数字体验始终处在客户留存的中心。机构侧，CSI 报告称受访社区银行中只有 2%
              没有现代化计划；FIS 则报告几乎普遍使用云、技术预算上升、P2P 优先级扩大，以及广泛的 AI 试验。因此，客户预期、预算优先级，以及供应商路线图向数据、支付和 AI 扩张，正在同时推高这个品类。


              约束同样真实。CSBS 称网络安全仍是社区银行的首要内部风险，技术实施成本也仍然接近榜单顶部。FFIEC 和 FDIC
              指引把认证、分层安全和基于风险的控制留在关键路径上。非银支付竞争正在上升。银行整合压力也重要，因为最急于现代化的机构仍可能面对预算限制或 M&A
              不确定性。所有这些动态都会提高可信供应商的价值，但也会拉长尽调和实施工作。


              剩下的缺口是规模精度。保留来源能让我们界定信用合作社外壳，并证明广泛的银行技术需求，但不能清楚分离出有多少社区银行或信用合作社在 Lumin
              当前产品深度下是替换候选。因此，最诚实的承销立场是：把市场视为庞大、持久且仍在现代化，同时保留围绕机构数量和预算匹配的真实 SAM 不确定性。
