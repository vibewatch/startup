      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 私有收入支撑失效
        - 管理层无法展示与同业隐含负担测算大体一致的收入 / ARR
        - 当前估值失去量化支撑
        - 不要按 $1.6B 承销
      - - 留存或集中度不及预期
