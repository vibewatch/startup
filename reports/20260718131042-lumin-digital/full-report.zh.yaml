          - type: callout
            title: 不透明度而非质量，是主要估值障碍
            body: 在 $1.6 billion 估值下，承销问题不是 Lumin 是否真实，而是隐藏的收入和留存基础是否足够大、足够持久，能支撑同业式倍数。
            calloutType: risk
