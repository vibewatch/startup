      - number: '6.3'
        title: 耐久性、满意度和重复使用
        blocks:
          - type: paragraph
            body: >-
              公开的客户持久性证据偏正面，但仍不完整。Lumin 自己的页面强调 97% 至 100% 的客户可背书率、接近 90 的 NPS，以及零报告客户流失。451 Research
              研究给出更实质的运营代理指标：单客户产品数提升 11%，流失率下降 15%，呼叫中心话务量下降 21%，网点交易下降 17%，部分部署的 NPS 最高提升 30 点。如果方向属实，这些数据说明 Lumin
              不只是完成上线，也在推动更深的数字化使用，并支撑更长久的客户关系。


              第三方情绪大体吻合。Lumin 的 G2 营销页面称，100% 评论者给出 4 或 5 星，95% 愿意推荐该平台。实时评论页显示 19 条评论的评分为
              4.7/5，并反复赞扬响应速度、伙伴关系和实施支持。不过，同一批评论也露出不小摩擦：有些功能在完全打磨前就上线，一些买家觉得增强功能、分析或功能定价偏贵。这些限定很重要，因为它们提示，即便核心满意度高，哪些问题仍可能拖慢扩张或在续约时制造张力。


              关键承销限制在于，公开信号都不能替代真实的总留存率（GRR）、净留存率（NRR）、合约期限或队列续约披露。它们是有用的持久性代理指标，但仍只是代理指标。
