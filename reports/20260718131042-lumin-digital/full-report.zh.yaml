  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和工作流范围
        blocks:
          - type: paragraph
            body: >-
              Lumin
              的市场，是信用合作社、社区或区域银行用来在线上和移动渠道服务零售及企业客户的数字互动层。划定这个市场，最清晰的方法是按工作流，而不是套用宽泛的「fintech」语言。纳入的支出覆盖数字前端——账户访问、资金转移、提醒、消息、自助服务、企业银行、个性化，以及嵌入日常银行界面的
              CRM、贷款入口、营销活动工具等相邻体验。Lumin 自己的零售银行、商业银行、技术和可扩展性页面都指向这一定义。


              最重要的排除项是核心处理系统。Lumin 并不把自己呈现为存款和贷款的记录系统；它强调的是位于其他系统之上或旁侧的
              API、SDK、开发者工具和伙伴集成。这个区别重要，因为许多银行技术市场的标题估算，会把数字渠道、核心系统、欺诈、支付基础设施和服务混在一个巨大篮子里。Lumin
              真正面对的竞争更窄：传统数字银行供应商、在位银行技术提供商销售的数字套件，以及由线上银行、支付和服务工具拼成的内部组合。


              品类边界也解释了为什么集成如此重要。数字银行平台必须连接核心系统、支付轨道、安全控制、第三方 fintech 工具和产品系统，同时不让用户离开渠道。Lumin 自己的生态页面称已有或在开发的集成超过 200
              个，进一步说明这个市场不只是界面设计；核心在于掌握互动层，同时协调更广的金融服务技术栈。
