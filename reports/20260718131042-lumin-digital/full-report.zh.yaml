      - number: '8.2'
        title: 可比估值背景
        blocks:
          - type: paragraph
            body: >-
              最有用的公开估值框架，是由真实披露收入和市场倍数的数字银行或银行软件公司拼出的同业区间。Alkami、Q2 和 nCino 是产品逻辑上最接近的纯粹型或相邻可比公司。Jack Henry 和 Fiserv
              是更宽的老牌厂商，直接可比性较弱，但仍可作为低 beta 边界。它们的共同点不是完全相似，而是披露。每家公司都提供公开收入、利润率和监管文件界面，而 Lumin 目前缺少这些。


              这很重要，因为 Lumin 的 $1.6 billion 估值从绝对值看并不明显荒唐。它接近 Alkami 和 nCino 的公开市值规模，低于 Q2、Jack Henry 和
              Fiserv。但同业倍数也说明，价格支撑取决于是否已有足够大的收入基础。最相关同业给出的公开区间大致是中个位数 EV/sales，而不是无限溢价制度。


              因此，可比公司给出的教训是混合的。Lumin 在质地上像那些服务金融机构、估值较高的上市软件业务。但没有直接收入披露，投资者仍是在推断当前估值是否合理，而不是证明它。
