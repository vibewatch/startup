  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局和直接竞品集合
        blocks:
          - type: paragraph
            body: >-
              Lumin 的竞争场分层明显。距离最近的是专注型数字银行供应商，它们向美国银行和信用合作社销售现代零售及企业银行体验。在保留来源中，Alkami 和 Tyfone 最直接符合这个框架。范围略宽但仍高度相关的是
              Q2、Jack Henry 和 Fiserv，它们都营销数字银行平台，同时带来相邻产品、更深装机基础或更强在位关系。nCino
              并不是一对一的数字银行前端，但它重要，因为它位于相邻工作流中，例如引导开户、账户开立、贷款，以及 AI 赋能的银行运营。


              这种结构重要，因为买方不会进行一场完美的同类对比。信用合作社或银行可以选择专注数字层、在位套件扩展、更广的平台供应商，或通过既有核心系统 /
              服务关系打包采购。对小型挑战者来说，这让品类更难：它们不只是在产品优雅度上竞争，还要比拼分销、信任、相邻模块和集成负担。


              Lumin
              的公开定位仍有三点突出。第一，它反复强调云原生架构，而不是改造过的数字渠道。第二，它同时营销零售和企业银行工作流，让自己留在更大交易的讨论中。第三，它把产品叙事与合作型客户股东模式结合起来，在保留的公开同业中显得少见。这些是真实差异点，但它们所在的市场里，没有一个严肃对手会停步不前。
