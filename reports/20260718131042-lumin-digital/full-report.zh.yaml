        - 云原生数字银行平台，采用客户兼投资人的合作模式
        - 美国信用合作社、社区银行及相邻金融机构
        - 零售银行、企业银行、集成、AI 工具，以及支付 / CRM / 贷款扩展
        - 覆盖 90 家金融机构、近 8M 个消费者账户
        - 现代化挑战者，客户利益绑定鲜明，但公开收入披露有限。
      - - Alkami
        - 面向美国金融机构的专注型数字银行平台
        - 寻求数字化转型的银行和信用合作社
        - 消费者数字银行、企业银行、入驻 / 开户、数据和营销
        - 22.4M 用户；$480.3M ARR
        - 最直接的公开数字银行规模参照。
      - - Q2 Holdings
        - 零售、小企业和商业数字银行的一体化平台
        - 银行和信用合作社，包括较大型机构
        - 数字银行、商业业务工作流、数据和 AI、集成工作流
        - 2025 年收入 $794.8M；订阅 ARR $780.1M
        - 规模更大，大型银行案例也比 Lumin 更强。
      - - Jack Henry / Banno
        - 服务社区金融机构的既有厂商，提供开放生态数字套件
        - 社区银行和信用合作社
        - 数字银行、开户、即时资金流转、营销、企业银行附加模块
        - 上市既有厂商，客户存量广泛
        - 捆绑销售和存量客户杠杆是关键优势。
      - - Fiserv
        - 围绕核心系统和支付的既有厂商数字套件
        - 各规模段银行和信用合作社
        - 数字旅程、支付、集成、关系增长工具
        - 大型多元化上市公司
        - 主要靠广度和企业关系竞争，而不是纯数字业务聚焦。
      - - Tyfone
        - 聚焦社区金融机构的现代数字银行平台
        - 希望获得可配置数字银行的银行和信用合作社
        - AI 驱动的零售银行、企业银行扩展、即时支付、无障碍功能、管理控制台
        - 未见大型公开收入披露
        - 规模较窄，但仍是可信的社区机构替代选项。
      - - nCino
        - 相邻的智能银行平台，并非纯前端数字银行
        - 全球金融机构
        - 入驻、开户、贷款、投资组合管理、AI 赋能银行套件
