        - 收入基数已接近或超过同业可比估值隐含的收入门槛；AI 和产品扩张提高客户钱包份额；留存强劲
        - 当前估值显得保守，后续上行仍在
        - 执行或网络安全失误打断溢价叙事
        - 有可能，但需要私有指标支撑
      - - 基准
        - Lumin 质量高，但私有指标只是不错，并非异常出色
        - 只有隐藏 KPI 在收入、留存和利润率上都扎实，当前估值才大致合理
        - 不透明让新买方对价格敏感
