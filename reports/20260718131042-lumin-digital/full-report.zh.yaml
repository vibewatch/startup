      - number: '6.2'
        title: 具名部署验证
        blocks:
          - type: paragraph
            body: >-
              本章最强部分是具名生产验证。Lumin 对 Community Financial、SELCO、Affinity Plus、First Bank of Berne 和 Ent
              都有公开部署证据；其中几项证据比标识页面更强，因为它们包含上线日期、机构规模、高管引述和产品细节。Community Financial 2023 年上线材料称，平台已为超过 80,000 名成员上线，并把
              Lumin 推到 50 多家上线机构、400 万签约用户以上。SELCO 2022 年上线覆盖超过 150,000 名成员，而 SELCO 当前页面仍显示具体数字银行功能，例如
              Zelle、外部转账、旅行通知和企业现金管理服务。


              Affinity Plus 和 Ent 进一步拉宽了机构规模区间。Affinity Plus 被描述为一家近 270,000 名成员、资产 $4.2 billion 的信用合作社；Ent 则被描述为服务超过
              550,000 名成员、资产近 $10 billion。First Bank of Berne 增加了一个社区银行验证点，并强调一次成功实施和无缝转换过程。


              合在一起，这些验证说明三件重要事情：Lumin
              能赢下信用合作社和银行，能支持规模差异明显的机构，且这些部署看起来是真实生产关系，而不是愿景式销售管线标识。它们没有显示的是收入集中度、续约定价，或按模块划分的加购深度。
