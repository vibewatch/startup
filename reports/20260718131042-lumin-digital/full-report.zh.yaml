      - number: '8.4'
        title: 投资逻辑破裂点与最终尽调
        blocks:
          - type: paragraph
            body: >-
              对 Lumin 的最终决策，应围绕少数证据请求转动，而不是陷入无尽的泛泛好奇。第一，管理层需要把估值桥接到当前运营规模：ARR
              或确认收入、留存、集中度和利润率质量。第二，管理层需要证明客户投资者模式是优势，而不是掩盖集中度或治理重叠。第三，管理层需要证明网络安全和可靠性控制在实践中有效，而不只是纸面上好看。


              这些要求范围很窄，但足以决定结论。如果 Lumin
              能拿出与同业隐含收入负担和耐久客户经济性大体一致的私有数据，当前估值就能从「说得通」走向「站得住」。如果不能，最新估值就应被视为愿望型或谈判驱动，而不是独立验证后的公允价值。


              投资逻辑破裂事件也很清楚。重大安全事件、标杆客户投资者关系明显恶化，或私有指标显著低于同业负担，都会迅速削弱估值论证。因此，正确姿态是：兴趣高、尊重高，但价格纪律不能放松。
            claimRefs:
              - CV032
              - CV033
              - CV035
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
