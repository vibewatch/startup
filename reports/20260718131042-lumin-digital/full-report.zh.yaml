  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础和细分
        blocks:
          - type: paragraph
            body: >-
              Lumin 的客户基础显然是机构型，但并不单一。保留来源显示两个主要买方群体——信用合作社和社区银行——以及这些买方内部两类主要终端用户：零售 / 会员用户和企业 / 商业用户。Lumin
              的零售和商业产品页面进一步说明，公司卖的不是狭窄的纯消费者应用；它卖的是更广的数字银行关系层，可以覆盖日常消费者工作流和更复杂的企业现金管理需求。


              公开规模披露方向上很强，但并不完全干净。简介页称 Lumin 服务 90 家金融机构、近 800 万个消费者账户。信用合作社页面称 90+ 家信用合作社和 8M+ 用户。银行页面称 50+ 家金融机构和 8M+
              用户。这些数字确认了有意义的客户广度，但也暗示分母漂移：公司似乎在不同时间、按不同细分逻辑更新不同营销页面。投资人应把这些数字视为规模证明，而不是审计级队列核算。


              最有用的细分结论是，Lumin 已经在美国社区金融内部达到多资产、多细分市场相关性。它不是只卖给小机构，也不是只卖给市场一侧。具名客户验证横跨社区银行和大型信用合作社，产品覆盖面同时支持消费者 /
              会员互动和企业银行工作流。
