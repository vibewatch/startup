  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Lumin 所处领域监管预期异常严格，即使公司本身不是银行。FFIEC 和 FDIC 指引明确，数字银行认证风险不仅覆盖终端客户，也覆盖员工、第三方、服务账户、API 和云连接系统。这一点重要，因为 Lumin
              直接位于认证、会话和数据访问路径上，而其服务对象本身要接受安全性、稳健性、隐私和信息安全标准监管。实际效果是，即便法律义务在技术上首先落在金融机构身上，监管短板也会在商业上惩罚 Lumin。


              Lumin 自己的公开法律文本也确认控制责任是共担的。隐私政策披露了网站端广泛的数据收集和共享实践；条款则广泛排除责任和建议质量。更重要的是，可接受使用政策把
              KYC、OFAC、管理员角色、白名单和用户政策义务推给客户，SDK 许可也对围绕平台开发的开发者设置了实质限制和责任上限。单看这些并不是红旗——它们是正常合同保护——但这意味着实施错误或客户侧控制薄弱，仍会反噬
              Lumin 的声誉和续约画像。


              主要法律风险结论是，Lumin 在共担控制设计上显得周到，但公司仍处在高暴露区域：监管预期、客户误配置和合同责任限制条款彼此交织。只有真实世界的治理和事件响应成熟度与公开文件所示一致，这种风险才可管理。
