      - number: '4.4'
        title: 财务结论和披露缺口
        blocks:
          - type: paragraph
            body: >-
              从公开证据得出的最清楚财务结论是，Lumin 很可能已经不再是低规模小众供应商。Alkami、Q2 和 nCino
              等公开可比公司显示，数字银行和相邻银行软件公司可以达到数亿美元经常性或年度收入；简单外部测算也显示，Lumin $1.6 billion
              估值很可能假设类似的数亿美元中段收入基础，而不是早期阶段数字。代理测算并不完美，但指向一致。


              公开证据也显示运营质量已经改善。管理层声称公司超额完成财务目标，同时提升利润率和效率；委托 ROI
              研究则显示客户能够在经济上证明采用合理。这一组合支持一家有真实规模、经济性正在改善的公司，而不是一家还在证明产品能否成立的公司。


              同时，披露仍然明显不完整。没有公开
              ARR、毛利率、烧钱、现金余额、留存队列数据、客户集中度披露，也没有直接销售效率证据。这意味着正面的公开图景是真实的，但仍不足以支撑完整承销精度。正确结论是「有规模、有前景，但披露不足」，而不是「风险已完全排除」。
