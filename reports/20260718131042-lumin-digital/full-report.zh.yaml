      - number: '3.2'
        title: 能力和平台比较
        blocks:
          - type: paragraph
            body: >-
              最清楚的竞争事实是，功能重叠很广。Alkami 营销消费者数字银行、企业银行深度、引导开户、数据和营销，以及反欺诈相邻能力。Q2 营销一套横跨零售、小企业和商业银行的平台，并用 SDK 访问、UI 定制、数据和
              AI 工具强化这套叙事。Jack Henry 的 Banno 平台把开户、企业银行功能、营销插件和即时资金转移叠加进社区金融机构渠道。Fiserv
              借助更大的银行技术足迹，但仍营销数字旅程、集成、支付和企业工具。Tyfone 规模更窄，却仍展示 AI、即时支付、无障碍、管理工具和企业银行扩展。


              也就是说，Lumin 不能只说自己有现代数字银行功能而别人没有。更可防守的公开论点是架构和关系：Lumin 声称拥有专用云原生技术栈、灵活生态、内嵌 AI
              工具，以及异常强的客户对齐。即便如此，距离也不是绝对的。Q2 和 Alkami 都营销开发者工具和数据上下文；Jack Henry 和 Fiserv 都营销开放生态；Tyfone 也愿意非常直接地营销 AI
              和即时支付。


              简言之，品类已经收敛到共同功能基线。零售和企业银行、开放集成、具备欺诈意识的工作流，以及 AI
              相邻能力，越来越像入场券。因此，差异化转向实施质量、分销深度、信任和客户经济性——这些话题的公开证据远比产品页面语言薄。
