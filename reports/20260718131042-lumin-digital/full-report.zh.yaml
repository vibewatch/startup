        - 留存公开材料没有披露
        - 利润率质量决定软件经济性是否支撑溢价倍数
        - 要求提供经审计 P&L 和管理层经营指标包。
      - - 现金余额 / 现金跑道 / 烧钱速度
        - 公开材料只有“强劲资产负债表”表述
        - 只看融资标题，无法完整判断资本充足性
        - 要求提供现金、烧钱速度、现金跑道和契约安排表。
      - - 留存 / NRR / GRR
        - 公开材料只有间接结果代理指标
        - 切换成本只有转化成持久扩张和续约才有意义
        - 要求提供队列留存和续约分析。
      - - 客户集中度
        - 没有公开集中度披露
        - 少数大型机构可能扭曲收入质量和续约风险
