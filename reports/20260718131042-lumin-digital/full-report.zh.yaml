  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型和货币化逻辑
        blocks:
          - type: paragraph
            body: >-
              保留的公开证据支持一个经典企业软件收入模型：金融机构支付经常性平台费，旁边还有来自相邻模块和实施工作的更多钱包份额潜力。Lumin
              一直把自己呈现为数字银行平台，而不是咨询或支付处理公司。这意味着经济核心更像订阅式软件收入，与账户规模、机构复杂度、产品广度和部署范围绑定。平台现在覆盖零售银行、企业银行、集成和 AI 赋能工具，而 2026 年
              7 月融资新闻稿明确点名 AI、支付、CRM 和贷款是活跃扩张品类。


              最有意思的货币化线索是，Lumin 第一套 AI 工具被发布到现有客户的基础平台中。这意味着 AI
              的初始经济价值可能体现在留存、销售效率或未来加售，而不是立即单独按席位收费。不过，随着时间推移，路线图显示更多可货币化层可以围绕核心数字银行合同累积，尤其是当支付、CRM 和贷款模块成为重要产品线之后。


              公开记录在实际价格点上弱得多。没有保留来源披露 Lumin 自身稳定标价或清晰收费指标。这对企业 fintech
              来说很正常，但也意味着投资人必须从产品广度、客户结果主张和外部品类基准推断货币化逻辑，而不是依赖一张干净价目表。
