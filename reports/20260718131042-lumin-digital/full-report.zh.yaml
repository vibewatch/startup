            body: >-
              公开证据持续把架构强调为 Lumin 的核心产品论点。公司称平台云原生、对开发者友好，并用比许多营销页面更技术化的细节填充这个主张。外部 API 架构文章称，产品现在开放 40+ 个即用端点，横跨 8
              个类别，已经有 7 个伙伴集成进入生产，另有 20+ 个推进中，每月处理约 200 万次 API 调用。文章还称，该 API 专为外部调用者构建，面向开发者提供文档，由沙箱环境支持，并从底层核心系统中抽象出来。


              最后一点重要，因为它把 Lumin 重新定义为集成层，而不只是 UI 层。面向未来的案例研究强化了同一主题：Lumin
              称自己通过中间件完成集成，同时保持与银行核心和平台的兼容性。可扩展性页面更进一步，称目标是帮助员工和最终用户留在数字银行内部，而不是在断裂工具之间来回跳转。


              累积起来的图景是，一个平台比简单前端刷新更有技术主张。它的产品论点是，在现代银行中，可扩展性、核心抽象和快速伙伴集成具有结构性重要性。最难的尽调问题不是这些主张是否存在——它们显然存在——而是它们在多大频率上转化为低摩擦集成和有差异的规模化客户结果。
