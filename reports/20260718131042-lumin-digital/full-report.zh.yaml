  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 核心摇摆因素是：按同业倍数支撑当前估值，需要多大的收入底盘。
    data:
      items:
        - label: 4.7x 所需收入
          value: 340.4
          detail: 按 Alkami 类似 EV/sales 支撑 $1.6B，大约需要多少百万美元收入。
          tone: warning
        - label: 4.1x 所需收入
          value: 390.2
          detail: 按 Q2 类似 EV/sales 支撑 $1.6B，大约需要多少百万美元收入。
          tone: warning
        - label: 3.6x 所需收入
          value: 444.4
          detail: 按 nCino / JKHY 类似 EV/sales 区间支撑 $1.6B，大约需要多少百万美元收入。
          tone: negative
        - label: 2.6x 所需收入
          value: 615.4
          detail: 按 Fiserv 式既有厂商倍数支撑 $1.6B，大约需要多少百万美元收入。
