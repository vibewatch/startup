          mid: 1.6
          high: 1.9
        - label: 估值乐观情景
          low: 1.8
          mid: 2.2
          high: 2.6
    approximationNotes: 区间按十亿美元口径粗略给出，依据是同业估值约束、私营公司折价和情景质量；明确只是近似值。
