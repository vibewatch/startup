      - number: '4.2'
        title: 公开牵引力和单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Lumin 有足够公开牵引力支撑外部单位经济测算，尽管它不发布经审计软件指标。公司称服务 90 家金融机构、近 800 万个消费者账户；更早客户新闻稿显示，到 2024 年初，它已有超过 50 家上线机构和超过
              400 万签约用户。Affinity Plus、Ent 和 First Bank of Berne 等更多客户胜利显示，平台既服务大型信用合作社，也服务社区银行，降低了规模由某个异常狭窄客户层级驱动的风险。


              最量化的公开单位经济证据来自委托 451 Research 研究。研究报告称 ROI 145%、回本 10.8 个月、累计影响 $12.8 million、75% 价值来自收入增长、每客户产品数增加
              11%、流失下降 15%、呼叫中心量下降 21%、网点交易减少 17%、宕机时间降低 95%。这些数字不等于 Lumin
              自身合并利润率或留存指标，但它们确实表明产品能为客户带来有财务意义的结果，并可能支撑溢价定价或持久扩张。


              基于同业的代理指标有助于把这些信号转成收入数学。Alkami 披露，2025 年底每注册用户收入为 $21.44。粗略套到 Lumin 近 800 万个账户上，指向约 $171 million
              的年化收入水平。由于账户和注册用户不是同一个分母，这应该被视为方向性代理，而不是点估计，但它仍有助于给业务画边界。
