figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 融资、规模和产品里程碑显示，Lumin 从细分银行平台快速跃升为客户背书的独角兽。
    data:
      items:
        - label: 成立
          date: '2016-01-01'
          detail: Jeff Chambers 创立 Lumin，打造面向银行和信用合作社的云原生数字银行平台。
          tone: positive
          claimRefs:
            - CO001
            - CO002
        - label: 第 50 次上线
          date: '2024-01-30'
          detail: Community Financial 上线后，Lumin 突破 50 家已投产金融机构和 4 million 名签约用户。
          tone: positive
          claimRefs:
            - CO034
        - label: 安全披露
          date: '2024-06-28'
          detail: 公开白皮书详述董事会关联的风险监督、审计和单租户控制体系。
          tone: neutral
          claimRefs:
            - CO012
            - CO013
        - label: Affinity Plus 胜出
          date: '2024-09-24'
          detail: Affinity Plus 将云原生架构、上市速度和正常运行时间列为选择因素。
          tone: positive
          claimRefs:
            - CO008
            - CO035
        - label: 增长型再融资
          date: '2024-12-02'
          detail: Light Street、NewView 和 Partners Group 领投超过 $160 million 的增长股权轮。
          tone: positive
          claimRefs:
            - CO015
            - CO016
            - CO017
        - label: 客户兼投资人轮
          date: '2025-03-12'
          detail: 超过 $75 million 的客户资本引入合作式所有权层。
          tone: positive
          claimRefs:
            - CO018
            - CO019
