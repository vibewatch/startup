      - number: '1.4'
        title: 规模信号、客户结果和未解决的尽调提示
        blocks:
          - type: paragraph
            body: >-
              Lumin 已经不只是一个有前景的平台故事，最强证据来自部署规模、客户背书和量化客户结果三者叠加。到 2024 年 1 月，Community Financial 的上线新闻稿称，Lumin 已支持超过 50
              家上线金融机构，签约用户超过 400 万。到 2026 年 7 月，公司更广泛的营销足迹声称拥有近 800 万个消费者账户、90 家金融机构，以及 94 的 NPS。围绕 Lumin 委托 451
              Research 研究的第三方和转载报道又加入更多可衡量结果：五年 ROI 145%、回本周期 10.8 个月、累计影响 $12.8 million，以及从第一年到第五年年度业务价值增长 4x。G2
              评论证据正面，但并非完全无瑕；综合评分高达 4.7/5，但仍有几位评论者提到功能增强定价、早期功能上线不完整，以及需要更好的同业基准。净图景很有吸引力：Lumin
              似乎拥有真实客户满意度和有意义的采用动能，但公开记录仍缺少收入、ARR、客户集中度和精确留存经济性的直接披露。
