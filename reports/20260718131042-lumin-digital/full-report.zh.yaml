      - number: '8.3'
        title: 情景区间与置信度
        blocks:
          - type: paragraph
            body: >-
              情景分析让建议更清晰。乐观情景下，Lumin 最终披露私有指标，显示收入基础大体符合上市同业的估值逻辑；同时
              AI、支付和贷款扩张加深钱包份额，客户投资者飞轮让留存保持强劲。在这种世界里，当前估值可以显得合理，甚至保守。


              基准情景下，Lumin
              是一家强公司，产品和客户证据都真实，但当前价格只有在隐藏指标已经相当出色时才成立。这是可行结果，但恰恰是公开记录今天无法验证的部分。悲观情景下，收入或留存弱于可比公司隐含负担，或集中度、网络安全、合作伙伴依赖带来的风险画像迫使私募市场打折。届时公司可能仍然不错，但入场价格错了。


              这就是置信度应停留在中等而不是高的原因。判断并不是被市场需求不足或明显产品弱点卡住，而是被溢价估值与不完整承销数据之间的缺口卡住。
