      - number: '5.3'
        title: 安全、欺诈和合规控制
        blocks:
          - type: paragraph
            body: >-
              对一家私有 fintech 来说，Lumin 的公开安全姿态异常详细。安全页面和白皮书描述了零信任、云原生架构，配有每周发布、基础设施即代码、由 CRO 领导的信息安全项目、SOC 2 Type II
              审计覆盖、面向 PCI 和 GLBA 的控制、SSDLC 实践、外部测试和分层认证。白皮书进入了实施细节：TLS 1.2+、HSTS、DNSSEC、设备验证、基于风险的认证、依赖扫描、代码审查，以及参考
              BSIMM 的成熟度工作。这比泛泛一句「我们认真对待安全」具体得多。


              欺诈和认证并没有被当成独立的事后补丁。通行密钥发布把用户体验与基于 FIDO2 公钥凭证的抗钓鱼能力连在一起。BioCatch 伙伴关系加入行为智能和连续会话风险信号。FINBOA
              伙伴关系把产品延伸到争议和合规工作流。合在一起，这些来源说明 Lumin 的安全模型正越来越多地嵌入客户旅程和交易后运营，而不只是登录屏幕。


              法律和政策材料强化了这个控制环境。AUP 把基于角色的安全责任分配给客户管理员，SDK 许可对开发者设定义务，条款支持负责任漏洞披露，隐私通知则描述匿名化威胁情报共享。主要缺失项是运营指标，例如 SLA
              达成、延迟、事件频率，以及通行密钥等新控制的可衡量采用。
