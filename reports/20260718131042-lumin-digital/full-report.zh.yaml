        title: 路线图、成熟度和依赖
        blocks:
          - type: paragraph
            body: >-
              保留的发布材料显示，这个平台在持续出货，而不是只描述未来愿景。Lumin 于 2024 年推出通行密钥，2025 年初加入 FINBOA 争议管理伙伴关系，2025 年 12 月发布第一套 AI 助手套件，并在
              2026 年 5 月推出 Solaire，作为 AI 原生智能层。Solaire 新闻稿称，这些能力已经投入生产并被日常使用，未来阶段将扩展到对话式、主动式和智能体式 AI。这是从简单功能营销走向平台级 AI
              论点的有意义路线图推进。


              客户证据也支撑生产成熟度。Lumin 已在从社区银行到 Ent、Affinity Plus、SELCO、Community Financial
              等大型信用合作社的机构中上线。这个跨度重要，因为它说明平台能支持不同机构规模和运营模型。客户验证来源不能证明每个部署都同样成功，但确实反驳了产品仍处试点阶段的说法。


              同时，伙伴和架构依赖仍是产品故事的核心。欺诈控制部分依赖 BioCatch，争议自动化依赖
              FINBOA，更广的可扩展性依赖伙伴和中间件选择。这不一定是弱点——现代金融软件平台常常部分由伙伴生态拼装而成——但它意味着 Lumin 的产品护城河同样取决于编排质量，而不只是任何单一自有模块。
