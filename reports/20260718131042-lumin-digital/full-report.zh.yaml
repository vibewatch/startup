      - number: '1.3'
        title: 融资历史、估值跃升和投资者组合
        blocks:
          - type: paragraph
            body: >-
              自 2024 年底以来，Lumin 的资本形成最清楚地说明，公司现在更像一家有规模的私有 fintech，而不是小众软件供应商。2024 年 12 月的公司公告称，Lumin 已完成超过 $160 million
              成长股权融资，由 Light Street Capital、NewView Capital 和 Partners Group 领投；同时披露 Velera 是主要长期投资者，Chuck Fagan
              担任董事会主席。2025 年 3 月，Lumin 宣布客户投资超过 $75 million，并点名由客户投资者组成的成员顾问委员会。2026 年 7 月，公司和多家媒体称，客户又追加超过 $70
              million，Light Street 则领投近期 $45 million 成长股权融资，使 2026 年新资本超过 $115 million，隐含估值达到 $1.6 billion。尽调上的细节是，Lumin
              自己 2026 年 7 月材料回溯称 2024 年 12 月轮融资为 $170 million，而 2024 年 12 月原始新闻稿称超过 $160 million。这个不一致不改变大结论——Lumin
              资本充足，并获得财务投资人和客户双重强力支持——但投资人应索取逐轮资本结构表，而不是依赖任何单一摘要标题。
