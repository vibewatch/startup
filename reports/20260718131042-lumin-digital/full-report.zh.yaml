  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品范围和模块图谱
        blocks:
          - type: paragraph
            body: >-
              Lumin 的产品更适合理解为金融机构的数字互动运营层，而不是单一功能的手机银行应用。保留来源显示，零售银行、企业银行、资金转移、提醒、数字开户支持、卡控制、自助服务、争议受理，以及 AI
              赋能的工作流辅助，都位于或邻近同一个平台体验。这比「查余额和转账」范围更宽，重要之处在于它同时提高了买方相关性和潜在合同价值。


              产品也明显刻意模块化。SDK 材料称，机构可以在 Lumin 环境中加入自定义导航组件、微服务磁贴、新产品和员工生产力增强。生态页面称已有或在开发的集成超过 200 个。这说明 Lumin
              想掌握面向客户的关系，同时允许大量第三方功能接入；这在战略上不同于封闭套件。


              因此，最有决策价值的看法是：Lumin 提供一个专用数字银行外壳，并带有多个扩张面，包括核心零售和企业工作流、伙伴驱动扩展、争议自动化，以及越来越 AI
              原生的功能。开放的尽调问题不是产品是否有足够广度——显然有——而是客户在多深程度上采用每一层，以及实际付费加购情况如何。
