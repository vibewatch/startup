      - number: '1.2'
        title: 领导层深度、治理和合作型所有权模式
        blocks:
          - type: paragraph
            body: >-
              公开披露中，领导层信息比所有权权利更充分。Lumin 的简介页列出一整套高管班子，覆盖行政、运营、财务、云、风险、增长、人力和产品 / 技术；这比单一创始人运营故事成熟得多。同一页面还披露董事会由 Chuck
              Fagan 担任主席，董事包括 Sean Rathjen、Amy Sink、Ankit Sud 和 Kevin Sullivan，John Crawford 为董事会观察员。安全治理材料也支撑治理质量：Lumin
              的安全白皮书称，首席风险官直接向 CEO
              汇报，每周与高级领导层会面，并定期向董事会汇报；这指向正式化控制环境，而不是临时拼凑的创业公司姿态。仍然缺失的是公开解释：投票权、保留事项，以及客户投资者所有权到底如何与传统财务投资人群体互动。这个缺口重要，因为
              Lumin 越来越多地营销一种合作型股权模式，即客户机构成为股东。它在战略上很有辨识度，也可能提高粘性，但公开记录仍未说明该模式是否带来异常治理复杂度、集中度保护，或未来流动性约束。
