      - number: '2.3'
        title: 买方、细分市场和采用路径
        blocks:
          - type: paragraph
            body: >-
              数字银行平台的买方很少只是一个人。在信用合作社，运营发起人可能是首席体验官、数字、运营或零售银行负责人；风险、反欺诈、信息安全和核心银行团队都可能影响决策。在社区银行，发起人可能位于零售银行、数字渠道、首席运营官或创新团队之下，财务和风险职能则充当守门人。用户是机构的客户或成员，但预算所有者几乎总是机构本身，而不是最终用户。


              采用路径同样跨职能。项目常从可见的客户痛点出发——移动体验差、企业银行功能弱、互动不足，或需要加入更快支付和更好自助服务的压力。随后，它会扩展到集成、数据、安全和变革管理问题，因为新的数字层必须跨机构核心系统和第三方技术栈运转。这就是为什么
              Lumin 的 API 和伙伴生态故事，比在独立消费者应用中更重要。


              Lumin 的合作型客户投资者模式，在这个语境下也比在更简单的 SaaS
              市场中更合理。数字银行部署是战略性、高粘性、高信任关系。当机构既是投资人又是客户，这一模式可以增强可背书性，并降低替换风险。代价是，公开来源仍未量化银行侧究竟有多少目标机构真正适合这个模式。
