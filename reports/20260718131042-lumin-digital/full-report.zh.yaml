chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围和运营足迹
        blocks:
          - type: paragraph
            body: >-
              Lumin Digital 把自己定位为面向美国银行和信用合作社的专用数字银行平台，而不是横向 fintech 技术栈。公司简介页称，创始人 Jeff Chambers 于 2016 年创办
              Lumin，是为了给信用合作社和社区银行打造第一代现代云原生数字银行平台；后续营销页面又把目标客群拓展到各种规模的金融机构。当前最强的身份信号在三点上保持一致：平台是云原生的，面向零售和企业银行两类场景，并且设计成可配置系统，配有
              API、SDK 工具和伙伴生态，而不是封闭单体。官方营销还称，Lumin 目前服务 90 家金融机构、近 800 万个消费者账户；同时，细分页面又声称支持 90 多家信用合作社，并单独支持 50
              多家金融机构。因此，正确的承销视角是：Lumin 确实有规模，也有客户广度，但部分漏斗顶端的营销计数按细分市场统计，或已经滞后；在管理层澄清前，不能把它们当成完全可调和的同一个分母。
