companyProfile:
  summary: >-
    Lumin Digital 是一家位于加州 San Ramon 的私有数字银行软件公司，Jeff Chambers 于 2016 年创办。公开证据支持它在信用合作社和社区银行中拥有真实的平台资产：约 90 家机构、近 800
    万个消费者账户，云原生产品覆盖零售和企业银行，并采用客户投资者模式，最终在 2026 年 7 月以约 $1.6 billion
