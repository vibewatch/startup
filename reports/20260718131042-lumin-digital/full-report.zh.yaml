      - number: '2.2'
        title: 市场外壳和规模测算视角
        blocks:
          - type: paragraph
            body: >-
              没有一个公开数字能干净测出 Lumin 的市场规模，因此正确方法是三角交叉。最具体的官方外壳是美国信用合作社体系。NCUA 报告称，截至 2025 年底，联邦保险信用合作社有 4,287 家、成员 144.7
              million、资产 $2.43 trillion。即便这个外壳也不均质：2,514 家机构资产低于 $100 million，2,390 家带有低收入认定，资产超过 $15 billion
              的最大机构又落入不同监管画像。这种分布重要，因为不同层级的供应商要求、实施预算和销售周期差异很大。


              Lumin 当前规模提供的是第二个视角，而不是市场总量。公司简介页称平台服务 90 家金融机构、近 800
              万个消费者账户。这足以证明产品市场匹配，但即便只看信用合作社成员基础，它仍然只占很小一部分，更不用说还要加上社区银行市场。换句话说，公开证据支持 Lumin 已有真实装机基础，但不支持品类接近饱和的说法。


              第三个视角来自公开同业的品类经济性。Alkami 2025 年底拥有 22.4 million 数字银行用户和 $480.3 million ARR，而 Q2 报告的收入为 $794.8 million、订阅
              ARR 为 $780.1 million。这些披露说明，数字银行互动层可以支撑数亿美元经常性软件收入。它们本身并不能定义 Lumin 的 TAM，但确实证明这是金融机构技术预算中的重要支出品类。
