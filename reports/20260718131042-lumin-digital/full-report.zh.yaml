      - number: '8.5'
        title: 图表要点
        blocks:
          - type: callout
            title: 公司可以很强，但股票价格等价物尚未被证明
            body: Lumin 的客户、产品和融资证据都明显强于典型私营金融科技公司的公开轨迹。问题在于，估值支撑仍取决于市场还没看到的私有数据。
            calloutType: insight
            claimRefs:
