      - number: '6.4'
        title: Expansion, alignment, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Lumin’s customer model has an unusual and strategically important twist: some customers are also
              investors. The March 2025 release says more than 20 client partners invested over $75 million into the
              company, and it specifically names BCU, Redwood Credit Union, Wings Credit Union, Consumers Credit Union,
              and Summit Credit Union as advisory-committee investors. This matters because it deepens alignment in a
              way that most SaaS vendors cannot easily replicate. If customers have ownership stakes and advisory
              influence, they are more likely to provide roadmap feedback, referenceability, and possibly expansion
              opportunities.


              That same model, however, has a second edge. A customer-shareholder base can blur commercial and
              governance relationships, and it may increase concentration risk if a handful of large institutions matter
              both commercially and strategically. Redwood’s public site, for example, says it serves more than 530,000
              members, showing that at least one client-investor is a meaningful institution in its own right. Yet Lumin
              does not publicly disclose top-customer revenue contribution, contract concentration, or how much of the
              client-investor base overlaps with its largest accounts.


              The right conclusion is balanced. The client-investor structure likely helps land-and-expand and
              strengthens retention incentives, but it also raises diligence questions on governance, pricing
              independence, and exposure to a concentrated set of influential accounts. Those are manageable issues only
              if the internal customer mix is sufficiently diversified.
