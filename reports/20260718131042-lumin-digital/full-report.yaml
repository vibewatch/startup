      - number: '7.2'
        title: Operational, security, and platform risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Lumin’s public record is a blend of strong mitigations and unresolved evidence gaps. On the
              mitigation side, the security page and whitepaper describe a zero-trust architecture, weekly releases,
              infrastructure-as-code, CRO-led governance, SOC 2 Type II coverage, penetration testing, SSDLC controls,
              risk-based authentication, and increasingly phishing-resistant access through passkeys. Those controls are
              credible and relatively detailed by private-fintech standards.


              But the same evidence set also highlights why residual operational risk remains material. Fast release
              cadence can be a competitive strength while simultaneously increasing change-management and regression
              risk, especially in a mission-critical banking workflow. The public sources do not disclose historical SLA
              attainment, incident frequency, or broad passkey adoption. G2 review evidence is directionally positive on
              support and usability, yet still flags incomplete feature maturity at times and budget friction on certain
              enhancements. In other words, the control story is good, but the hard operating-history evidence is thin.


              For a digital-banking vendor, that distinction matters. Buyers can tolerate some roadmap rough edges, but
              they cannot tolerate security incidents, authentication failures, or repeated outages in production. That
              is why operational and security risk still deserve a top-tier ranking despite the company’s visible
              mitigation posture.
