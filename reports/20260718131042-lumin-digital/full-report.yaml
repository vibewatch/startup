companyProfile:
  summary: >-
    Lumin Digital is a San Ramon, California-based private digital-banking software company founded in 2016 by Jeff
    Chambers. Public evidence supports a real platform franchise across credit unions and community banks, with roughly
    ninety institutions, nearly eight million consumer accounts, a cloud-native product surface spanning retail and
    business banking, and a client-investor model that culminated in a July 2026 financing at roughly a $1.6 billion
    valuation. The company looks strategically relevant in U.S. community-finance infrastructure, but public
    underwriting evidence remains incomplete on revenue scale, retention, concentration, margin quality, and the
    cap-table economics behind the current mark.
  foundedDate: '2016-01-01'
