      - number: '5.3'
        title: Security, fraud, and compliance controls
        blocks:
          - type: paragraph
            body: >-
              Lumin's public security posture is unusually detailed for a private fintech. The security page and
              whitepaper describe a zero-trust, cloud-native architecture with weekly releases, infrastructure-as-code,
              a CRO-led information-security program, SOC 2 Type II audit coverage, PCI and GLBA-oriented controls,
              SSDLC practices, external testing, and layered authentication. The whitepaper goes into implementation
              detail: TLS 1.2+, HSTS, DNSSEC, device verification, risk-based authentication, dependency scanning, code
              review, and BSIMM-informed maturity work. That is materially more concrete than generic “we take security
              seriously” copy.


              Fraud and authentication are not presented as stand-alone afterthoughts. The passkey release ties user
              experience to phishing resistance through FIDO2-based public-key credentials. The BioCatch partnership
              adds behavioral-intelligence and continuous session-risk signals. The FINBOA partnership extends the
              product into dispute and compliance workflow. Together these sources suggest that Lumin's security model
              is increasingly integrated with the customer journey and with post-transaction operations, not just with
              login screens.


              Legal and policy surfaces reinforce this control environment. The AUP assigns role-based security
              responsibility to client administrators, the SDK license places obligations on developers, the terms
              support responsible vulnerability disclosure, and the privacy notice describes anonymized
              threat-intelligence sharing. The main missing items are operational metrics such as SLA attainment,
              latency, incident frequency, and measurable adoption of newer controls such as passkeys.
