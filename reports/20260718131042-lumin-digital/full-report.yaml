            body: >-
              The retained release set shows a platform that is shipping, not one merely describing future aspirations.
              Lumin launched passkeys in 2024, added the FINBOA dispute-management partnership in early 2025, shipped
              the first AI assistant suite in December 2025, and unveiled Solaire as an AI-native intelligence layer in
              May 2026. The Solaire release says those capabilities are already in production and daily use, and that
              future phases will expand into conversational, proactive, and agentic AI. This is a meaningful roadmap
              progression from simple feature marketing toward a platform-level AI thesis.


              Production maturity is also supported by customer evidence. Lumin is live with institutions ranging from
              community banks to large credit unions such as Ent, Affinity Plus, SELCO, and Community Financial. That
              range matters because it suggests the platform can support different institution sizes and operating
              models. The customer-proof sources do not prove uniform success, but they do rebut the idea that the
              product is still pilot-stage.


