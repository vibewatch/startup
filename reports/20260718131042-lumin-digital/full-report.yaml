      - number: '8.2'
        title: Comparable valuation context
        blocks:
          - type: paragraph
            body: >-
              The most useful public valuation frame is a peer band built from digital-banking or banking-software
              companies that actually disclose revenue and market multiples. Alkami, Q2, and nCino are the closest
              pure-play or adjacent comparables in product logic. Jack Henry and Fiserv are broader incumbents, which
              makes them less directly comparable but still useful as lower-beta boundary markers. The common feature
              across all of them is not perfect similarity—it is disclosure. Each provides public revenue, margin, and
              filing surfaces that Lumin currently lacks.


              That matters because Lumin’s $1.6 billion mark is not obviously absurd in absolute terms. It sits close to
              the public market-cap scale of Alkami and nCino and below Q2, Jack Henry, and Fiserv. But peer multiples
              also make clear that price support depends on having a substantial revenue base. The public band from the
              most relevant peers is roughly mid-single-digit EV/sales, not an unlimited premium regime.


              So the comp lesson is mixed. Lumin looks qualitatively comparable to valuable public software franchises
              serving financial institutions. Yet without direct revenue disclosure, investors are still inferring
              whether the current mark is fair rather than proving it.
            claimRefs:
