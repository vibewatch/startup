            body: >-
              The strongest part of the chapter is named production proof. Lumin has public deployment evidence for
              Community Financial, SELCO, Affinity Plus, First Bank of Berne, and Ent, and in several cases the evidence
              is stronger than a logo page because it includes launch dates, institution scale, quoted executives, and
              product detail. Community Financial’s 2023 launch said the platform was live for more than 80,000 members
              and pushed Lumin above 50 live institutions and four million users under contract. SELCO’s 2022 launch
              covered more than 150,000 members, while current SELCO pages still show concrete digital-banking features
              such as Zelle, external transfers, travel notices, and business cash-management services.


              Affinity Plus and Ent further widen the institution-size range. Affinity Plus was described as a nearly
              270,000-member, $4.2 billion-asset credit union, while Ent was described as serving more than 550,000
              members with nearly $10 billion in assets. First Bank of Berne adds a community-bank proof point and
              emphasized a successful implementation with a seamless conversion process.


              Taken together, these proofs show three important things: Lumin can win both credit unions and banks, it
              can support institutions of materially different sizes, and the deployments appear to be real production
              relationships rather than aspirational pipeline logos. What they do not show is revenue concentration,
              renewal pricing, or attach depth by module.
