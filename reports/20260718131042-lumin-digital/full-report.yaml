  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - scenario
      - assumptions
      - valuation / return logic
      - key risks
      - probability signal
    rows:
      - - Bull
        - >-
          Revenue base already near or above peer-implied burden; AI and product expansion deepen share of wallet;
          retention is strong
        - Current mark proves conservative and follow-on upside remains
        - Execution or cyber slip interrupts premium narrative
        - Possible but needs private metrics
      - - Base
        - Lumin is high quality but private metrics are merely good rather than exceptional
        - Current mark is roughly fair only if hidden KPIs are solid across revenue, retention, and margin
        - Opacity keeps new buyers price-sensitive
        - Most plausible from public evidence
      - - Bear
        - Revenue base materially below implied burden or concentration / risk profile worse than expected
        - Current mark embeds too much optimism versus public comp alternatives
        - Cyber, concentration, or valuation compression force discount
        - Material enough to block a buy call
    notes: Scenario probabilities are qualitative because public evidence is insufficient for a precise distribution.
