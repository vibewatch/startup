    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Lumin Digital presents itself as a purpose-built digital banking platform for U.S. banks and credit unions
              rather than a horizontal fintech stack. The company’s about page says founder Jeff Chambers launched Lumin
              in 2016 to build a first modern, cloud-native digital banking platform for credit unions and community
              banks, and later marketing pages broaden the target to financial institutions of all sizes. The strongest
              current identity signals are consistent on three points: the platform is cloud-native, it is aimed at both
              retail and business-banking use cases, and it is designed to operate as a configurable system with APIs,
              SDK tooling, and a partner ecosystem rather than as a closed monolith. Official marketing also says Lumin
              now serves nearly eight million consumer accounts across ninety financial institutions, while segment
              pages simultaneously claim ninety-plus credit unions supported and a separate fifty-plus financial
              institutions supported. The right underwriting view is therefore that Lumin has real scale and real
              customer breadth, but some top-of-funnel marketing counters are segment-specific or stale and should not
              be treated as one perfectly reconciled denominator without management clarification.
