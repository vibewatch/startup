      - number: '1.2'
        title: Leadership depth, governance, and the cooperative ownership model
        blocks:
          - type: paragraph
            body: >-
              Public disclosure around leadership is stronger than disclosure around ownership rights. Lumin’s about
              page lists a full executive bench spanning administration, operations, finance, cloud, risk, growth,
              people, and product/technology, which is more mature than a single-founder operating story. The same page
              also discloses a board chaired by Chuck Fagan, alongside directors including Sean Rathjen, Amy Sink, Ankit
              Sud, and Kevin Sullivan, with John Crawford identified as a board observer. Governance quality is also
              supported by security-governance materials: Lumin’s security white paper says the chief risk officer
              reports directly to the CEO and meets senior leadership weekly and the board periodically, which suggests
              a formalized control environment rather than an ad hoc startup posture. What is still missing is a public
              explanation of voting rights, reserved matters, and exactly how client-investor ownership interacts with
              the traditional sponsor group. That gap matters because Lumin increasingly markets a cooperative equity
              model in which customer institutions become shareholders. It is strategically distinctive and likely
              sticky, but the public record still does not show whether that model creates unusual governance
              complexity, concentration protections, or future liquidity constraints.
