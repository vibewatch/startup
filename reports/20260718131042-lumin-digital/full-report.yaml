  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Lumin is easier to like as a company than to underwrite as an investment at the currently publicized
              price. The positive case is real: multiple independent sources confirm a $115+ million financing at a $1.6
              billion valuation; the company appears to have a meaningful installed base; customer proof is credible;
              the product story is architecture-led and security-aware; and the client-investor model is unusual in a
              way that can deepen alignment. Those are legitimate premium characteristics.


              The problem is not quality. The problem is price support. Public evidence still does not disclose ARR,
              recognized revenue, gross margin, free cash flow, concentration, or retention in a way that lets an
              outside investor test whether the latest valuation is conservative, fair, or aggressive. The 451 study
              helps, but it is commissioned and based on six institutions. That is supportive evidence, not valuation
              closure.


              Accordingly, the recommendation should be price-disciplined and evidence-disciplined. Public evidence
              supports staying close to Lumin, but not writing a full-conviction “buy at face value” memo. A
              research-more stance with medium confidence is more honest than either a blanket endorsement or a blanket
              rejection.
            claimRefs:
