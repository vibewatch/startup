            body: >-
              The clearest financial conclusion from public evidence is that Lumin is probably not a subscale niche
              vendor anymore. Public comparables such as Alkami, Q2, and nCino show that digital-banking and adjacent
              banking-software companies can reach several hundred million dollars of recurring or annual revenue, and
              simple outside-in math suggests Lumin's $1.6 billion valuation likely assumes a similar
              mid-hundreds-of-millions revenue base rather than an early-stage number. The proxy math is imperfect, but
              it points in a consistent direction.


              Public evidence also suggests operating quality has improved. Management claims the company exceeded
              financial goals while improving margins and efficiency, and the commissioned ROI study suggests customers
              can justify adoption economically. That combination supports a company with real scale and improving
              economics, not one still proving whether the product works.


              At the same time, disclosure remains materially incomplete. There is no public ARR, no gross margin, no
              burn, no cash balance, no retention cohort data, no customer-concentration disclosure, and no direct
              sales-efficiency evidence. That means the positive public picture is real but still insufficient for full
              underwriting precision. The right takeaway is “scaled and promising, but under-disclosed,” not “fully
              de-risked.”
