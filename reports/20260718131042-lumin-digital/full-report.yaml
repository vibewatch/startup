  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct rival set
        blocks:
          - type: paragraph
            body: >-
              Lumin's competitive field is layered. At the closest distance are focused digital-banking vendors that
              sell modern retail and business-banking experiences to U.S. banks and credit unions. Alkami and Tyfone fit
              that frame most directly in the retained sources. Slightly broader but still highly relevant are Q2, Jack
              Henry, and Fiserv, all of which market digital-banking platforms but also bring adjacent products, deeper
              installed bases, or stronger incumbent relationships. nCino is not a like-for-like digital-banking front
              end, yet it matters because it sits in adjacent workflows such as onboarding, account opening, lending,
              and AI-enabled banking operations.


              That structure matters because buyers do not run one perfect apples-to-apples bake-off. A credit union or
              bank can choose a focused digital layer, an incumbent suite extension, a broader platform vendor, or a
              bundled path through an existing core or services relationship. This makes the category harder for smaller
              challengers: they are not only competing on product elegance, but also on distribution, trust, adjacent
              modules, and integration burden.


              Lumin's public positioning still stands out in three ways. First, it repeatedly emphasizes cloud-native
              architecture rather than retrofitted digital channels. Second, it markets both retail and business-banking
              workflows, which keeps it in larger deal conversations. Third, it pairs that product narrative with a
              cooperative customer-shareholder model that appears unusual in the retained public peer set. Those are
              real differentiators, but they operate inside a field where no serious rival is standing still.
            claimRefs:
              - CP001
              - CP002
              - CP003
