      - number: '3.2'
        title: Capability and platform comparison
        blocks:
          - type: paragraph
            body: >-
              The clearest competitive fact is that feature overlap is broad. Alkami markets consumer digital banking,
              business-banking depth, onboarding, data and marketing, and fraud-adjacent capabilities. Q2 markets a
              single platform across retail, small business, and commercial, then reinforces that story with SDK access,
              UI customization, and data-and-AI tooling. Jack Henry's Banno platform layers account opening,
              business-banking features, marketing add-ons, and instant money movement into a
              community-financial-institution channel. Fiserv leans on a larger bank-tech footprint but still markets
              digital journeys, integrations, payments, and business tools. Tyfone is narrower in scale yet still shows
              AI, instant payments, accessibility, admin tooling, and business-banking extensions.


              That means Lumin cannot rely on saying it has modern digital-banking features while others do not. The
              more defendable public argument is architectural and relational: Lumin claims a purpose-built cloud-native
              stack, a flexible ecosystem, embedded AI tools, and unusually strong customer alignment. Even there,
              however, the distance is not absolute. Q2 and Alkami both market developer tooling and data context; Jack
              Henry and Fiserv both market open ecosystems; and Tyfone is willing to market AI and instant payments very
              directly.


              In short, the category has converged toward a common feature baseline. Retail and business banking, open
              integration, fraud-aware workflows, and AI adjacency are increasingly table stakes. Differentiation
              therefore shifts toward quality of implementation, depth of distribution, trust, and customer
              economics—topics where public evidence is much thinner than product-page language.
