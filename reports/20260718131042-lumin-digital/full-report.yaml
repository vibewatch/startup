  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization logic
        blocks:
          - type: paragraph
            body: >-
              The retained public evidence supports a classic enterprise-software revenue model centered on recurring
              platform fees paid by financial institutions, with additional wallet-share potential from adjacent modules
              and implementation work. Lumin consistently presents itself as a digital-banking platform rather than as a
              consulting or payments-processing company. That suggests the economic core is subscription-like software
              revenue tied to account scale, institution complexity, product breadth, and deployment scope. The platform
              now spans retail banking, business banking, integrations, and AI-enabled tools, while the July 2026
              funding release explicitly names AI, payments, CRM, and lending as active expansion categories.


              The most interesting monetization clue is that Lumin's first AI toolset was released into the base
              platform for existing clients. That implies the initial economic value of AI may be retention, sales
              efficiency, or future upsell rather than immediate separate-seat revenue. Over time, however, the roadmap
              suggests more monetizable layers can accumulate around the core digital-banking contract, especially if
              payments, CRM, and lending modules become material product lines.


              The public record is much weaker on actual price points. No retained source exposes stable list pricing or
              a clear charging metric for Lumin itself. That is normal for enterprise fintech, but it means investors
              must infer monetization logic from product breadth, customer-outcome claims, and external category
              benchmarks rather than from a clean price sheet.
