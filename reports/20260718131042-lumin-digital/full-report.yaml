  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Lumin operates in a domain where regulatory expectations are unusually strict even if the company itself
              is not a bank. FFIEC and FDIC guidance make clear that digital-banking authentication risk covers not only
              end customers, but also employees, third parties, service accounts, APIs, and cloud-connected systems.
              That matters because Lumin sits directly in the authentication, session, and data-access path for
              institutions that are themselves supervised on safety, soundness, privacy, and information-security
              standards. In practical terms, Lumin can be commercially punished for regulatory shortcomings even if the
              legal obligation technically lands first on the financial institution.


              Lumin’s own public legal surfaces confirm that control responsibility is shared. The privacy policy
              discloses broad data collection and sharing practices for the website surface, while the terms broadly
              disclaim liability and advice quality. More importantly, the acceptable-use policy pushes KYC, OFAC,
              admin-role, allow-list, and user-policy obligations onto clients, and the SDK license places meaningful
              restrictions and liability limits on developers building around the platform. Those are not red flags by
              themselves—they are normal contractual protections—but they do mean implementation mistakes or weak
              client-side controls can still boomerang onto Lumin’s reputation and renewal profile.


              The main legal-risk conclusion is that Lumin appears thoughtful about shared-control design, but the
              company still sits in a highly exposed zone where regulatory expectations, customer misconfiguration, and
              contractual limitation clauses all interact. That is manageable only if real-world governance and incident
              response are as mature as the public documents suggest.
            claimRefs:
