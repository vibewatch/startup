      - number: '2.4'
        title: Demand drivers, constraints, and open sizing gaps
        blocks:
          - type: paragraph
            body: >-
              The demand case for Lumin's market is strong. Federal Reserve data shows digital payments are frequent and
              increasingly mobile, which keeps digital experience central to customer retention. On the institution
              side, CSI reports that only 2% of surveyed community banks had no modernization plans, while FIS reports
              near-universal cloud usage, rising tech budgets, expanding P2P priorities, and broad AI experimentation.
              The category is therefore being pushed simultaneously by customer expectations, budget priorities, and
              vendor-roadmap expansion into data, payments, and AI.


              The constraints are just as real. CSBS says cybersecurity remained the top internal risk for community
              banks and technology implementation costs remained near the top of the list. FFIEC and FDIC guidance keeps
              authentication, layered security, and risk-based controls on the critical path. Nonbank competition in
              payments is rising. Bank consolidation pressures also matter because the institutions most eager to
              modernize may still face budget limits or M&A uncertainty. All of those dynamics increase the value of
              trusted vendors but also lengthen diligence and implementation work.


              The remaining gap is sizing precision. The retained sources let us bound the credit-union shell and prove
              broad bank-tech demand, but they do not let us cleanly isolate how many community banks or credit unions
              are replacement candidates at Lumin's exact product depth. That is why the most honest underwriting stance
              is to treat the market as large, durable, and still modernizing, while preserving a real SAM uncertainty
              around institution counts and budget fit.
