        blocks:
          - type: paragraph
            body: >-
              Lumin’s capital formation since late 2024 is the clearest reason the company now screens as a scaled
              private fintech instead of a niche software provider. The December 2024 company announcement said Lumin
              had raised over $160 million of growth equity led by Light Street Capital, NewView Capital, and Partners
              Group, while also identifying Velera as the primary long-term investor and Chuck Fagan as board chair. In
