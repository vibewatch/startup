  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and module map
        blocks:
          - type: paragraph
            body: >-
              Lumin's product is best understood as a digital-engagement operating layer for financial institutions
              rather than as a single-feature mobile-banking app. The retained sources show retail banking, business
              banking, money movement, alerts, digital account-opening support, card controls, self-service, dispute
              intake, and AI-enabled workflow assistance living in or adjacent to one platform experience. That is a
              broader scope than “check balances and transfer funds,” and it matters because it increases both buyer
              relevance and potential contract value.


              The product also appears intentionally modular. The SDK materials say institutions can add custom
              navigation components, microservice tiles, new products, and employee-productivity enhancements inside the
              Lumin environment. The ecosystem page says more than 200 integrations are available or in development.
              That suggests Lumin is trying to own the customer-facing relationship while allowing a large amount of
              third-party functionality to plug into it, which is strategically different from a closed suite.


              The most decision-useful view is therefore that Lumin offers a purpose-built digital banking shell with
              multiple expansion surfaces: core retail and business workflows, partner-powered extensions, dispute
              automation, and increasingly AI-native functionality. The open diligence question is not whether there is
              meaningful product breadth—it is how deeply customers adopt each layer and what paid attach looks like in
              practice.
