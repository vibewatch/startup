              more than $70 million while Light Street led a recent $45 million growth equity financing, taking fresh
              2026 capital above $115 million and the implied valuation to $1.6 billion. The diligence wrinkle is that
              Lumin’s own July 2026 materials refer back to a $170 million December 2024 round, while the original
              December 2024 release said over $160 million. That inconsistency does not change the broad
              conclusion—Lumin is well capitalized and heavily backed by both sponsors and customers—but it does mean an
              investor should request a round-by-round capitalization table rather than rely on any one summary
