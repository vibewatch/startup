      - number: '1.4'
        title: Scale signals, customer outcomes, and unresolved diligence caveats
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence that Lumin has moved beyond a promising platform story is the combination of
              deployment scale, customer references, and quantified customer-outcome claims. By January 2024, a
              Community Financial launch release said Lumin supported more than fifty live financial institutions and
              more than four million users under contract. By July 2026, the company’s broader marketing footprint
              claimed nearly eight million consumer accounts, ninety financial institutions, and an NPS of 94.
              Third-party and syndication coverage around a 451 Research study commissioned by Lumin adds more
              measurable outcome claims: 145% ROI over five years, a 10.8-month payback period, $12.8 million cumulative
              impact, and a 4x increase in annual business value from year one to year five. G2 review evidence is
              constructive but not uniformly perfect; the aggregate rating is high at 4.7 out of 5, yet several
              reviewers still flag enhancement pricing, incomplete early feature rollouts, and a need for better peer
              benchmarking. The net picture is attractive: Lumin appears to have real customer satisfaction and
              meaningful adoption momentum, but the public record still lacks direct disclosure of revenue, ARR,
              customer concentration, and precise retention economics.
