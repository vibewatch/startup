- id: pricing-gtm-and-switching-costs
  title: Pricing, GTM leverage, and switching costs
  body: 'Public pricing transparency is weak across the field. The retained sources show product packaging and monetization posture more clearly than literal list prices. Alkami is one of the few companies that discloses enough financial detail to infer monetization efficiency through ARR, user counts, and revenue per registered user. For most others—including Lumin, Q2, Jack Henry, Fiserv, and Tyfone—the pre-sale picture is mostly quote-led or configuration-led. That opacity is normal for complex enterprise banking software, but it makes outside-in value benchmarking harder.


    GTM leverage therefore matters as much as raw feature breadth. Jack Henry and Fiserv can sell digital capability alongside longer-standing core, payments, and services relationships. Q2 can point to large-bank wins and near-billion-dollar scale. Alkami can point to focused digital-banking scale and a clearer monetization model. Tyfone can appeal to smaller institutions wanting a modern but less sprawling option. Lumin''s cooperative ownership and referenceability claims may strengthen trust once it is in the room, but its smaller public scale means it cannot win purely on market power.


    After purchase, switching costs become high. Digital-banking vendors sit at the intersection of the core, payments, fraud controls, alerts, service workflows, and user-behavior data. That creates stickiness for any credible incumbent and raises the cost of a replacement decision. It also means win rates, implementation success, and churn matter enormously—yet public evidence on those metrics remains thin for Lumin and most peers.'
  claimRefs:
  - CP028
  - CP029
