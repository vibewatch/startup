- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - evidence-backed rationale
  - mitigation / diligence ask
  rows:
  - - Cloud-native modern architecture
    - Feature parity from other modern platforms
    - Medium
    - Alkami, Q2, and Tyfone all market modern architectures or developer flexibility.
    - Test implementation speed, uptime, and change velocity rather than slogans.
  - - Cooperative customer-shareholder model
    - Governance complexity or limited transferability
    - Medium
    - The model is distinctive, but public evidence on exact economic benefits and governance rights is thin.
    - Request churn, referenceability, and cap-table evidence tied to customer-investors.
  - - Broad ecosystem and integrations
    - Incumbents also market openness
    - High
    - Q2, Jack Henry, Fiserv, and Alkami all make open-platform claims.
    - Request partner attach, integration depth, and integration-led win stories.
  - - AI-enabled roadmap
    - AI commoditization by larger rivals
    - High
    - Lumin, Q2, nCino, Alkami, and Tyfone all market AI narratives.
    - Request evidence on adoption, pricing uplift, and workflow outcomes.
  - - Sticky customer relationships
    - Incumbent bundling and long sales cycles
    - High
    - Jack Henry and Fiserv can bundle digital banking into broader relationships; public-company risk factors highlight long cycles and consolidation.
    - Request win/loss data against incumbent bundles and conversion success rates.
  notes: Severity reflects investability impact, not product quality alone. The strongest unresolved risk is whether Lumin wins enough head-to-head replacements against bigger bundled rivals.
