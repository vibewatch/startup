  - - Lumin Digital
    - Cloud-native digital banking platform with cooperative client-investor model
    - U.S. credit unions, community banks, and adjacent financial institutions
    - Retail banking, business banking, integrations, AI tools, payments/CRM/lending expansion
    - Nearly 8M consumer accounts across 90 financial institutions
    - Modern challenger with distinctive customer alignment but limited public revenue disclosure.
  - - Alkami
    - Focused digital-banking platform for U.S. financial institutions
    - Banks and credit unions seeking digital transformation
    - Consumer digital banking, business banking, onboarding/account opening, data and marketing
    - 22.4M users; $480.3M ARR
