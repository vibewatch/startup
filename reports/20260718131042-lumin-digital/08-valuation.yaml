- id: scenario-range-and-confidence
  title: Scenario range and confidence
  body: 'Scenario analysis is where the recommendation becomes clearest. In the bull case, Lumin eventually discloses private metrics that show a revenue base broadly consistent with public-peer valuation logic, while AI, payments, and lending expansion deepen wallet share and the client-investor flywheel keeps retention strong. In that world, the current mark can look justified or even conservative.


    In the base case, Lumin is a strong company with real product and customer proof, but the current price only works if the hidden metrics are already quite good. That is a viable outcome, but it is precisely the part the public record cannot validate today. In the bear case, revenue or retention turns out weaker than the comp-implied burden, or the risk profile around concentration, cyber, or partner dependency forces a private-market discount. Then the company may still be good, but the entry price is wrong.


    This is why confidence should stay medium rather than high. The call is not blocked by lack of market demand or by obvious product weakness. It is blocked by the gap between a premium valuation and incomplete underwriting data.'
