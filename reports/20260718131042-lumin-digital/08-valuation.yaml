- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Private revenue support fails
    - Management cannot show revenue / ARR broadly consistent with peer-burden math
    - Current mark loses quantitative support
    - Do not underwrite at $1.6B
  - - Retention or concentration disappoints
    - GRR / NRR or top-customer concentration materially worse than hoped
    - Premium valuation durability weakens
    - Increase discount or walk away
  - - Cyber or reliability event
    - Meaningful security incident or repeated production outage
    - Trust, renewal, and multiple support compress quickly
    - Re-rate risk higher immediately
  - - Marquee customer-investor loss
    - Visible relationship break with a large client-investor
    - Signaling and governance thesis weakens
    - Treat the client-investor moat as overstated
  - - Expansion roadmap slips
    - AI / payments / lending expansion lacks adoption proof after capital deployment
    - Bull-case narrative weakens while cash is consumed
    - Lower terminal-multiple assumptions
  notes: Triggers are chosen because they can change both intrinsic value assumptions and willingness to pay.
  claimRefs:
  - CV023
  - CV032
  - CV035
  - CV042
  - CV043
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Revenue scale
    - ARR or recognized revenue, revenue growth, and gross margin
    - Needed to test whether $1.6B is in-line or aggressive
    - Management KPI pack / CFO diligence
  - - Retention durability
    - GRR, NRR, logo retention, contract term
    - Determines whether premium multiple is sustainable
    - Management cohort analysis
  - - Concentration and governance
    - Top-customer revenue, overlap with client-investors, special rights
    - Tests whether alignment hides concentration
    - Cap-table and customer analysis
  - - Operational proof
    - SLA history, incident logs, support metrics, security exercises
    - Separates good security narrative from durable execution
    - CTO / CRO operating review
  - - Expansion quality
    - Module attach, AI adoption, payments / lending uptake
    - Determines whether growth capital is compounding or merely sustaining
    - Product and finance review
  notes: These asks are intentionally narrow because each one could move either the recommendation or the acceptable entry price.
