- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: Representative public comparables selected for digital-banking or adjacent banking-software relevance plus active market or filing visibility.
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Alkami
    - FY2025 revenue $443.6M; ARR $480.3M; EV/Sales 4.66x; market cap $1.92B
    - Public digital-banking peer near Lumin’s valuation scale
    - Strong direct digital-banking relevance
    - Still public and more transparent than Lumin
  - - Q2 Holdings
    - FY2025 revenue $794.8M; subscription ARR $780.1M; EV/Sales 4.14x; market cap $3.43B
    - Scaled digital-banking peer with better profitability disclosure
    - Very relevant on workflow and customer type
    - Larger and more mature than Lumin
  - - nCino
    - FY2025 revenue $540.7M; subscription revenue $469.2M; EV/Sales 3.57x; market cap $1.96B
    - Adjacent banking-software comp with disclosed ACV
    - Useful public software benchmark close in valuation range
    - Less consumer-digital-banking centric
  - - Jack Henry
    - EV/Sales 4.33x; market cap $10.78B
    - Incumbent core and digital provider
    - Useful quality anchor and public disclosure benchmark
    - Far broader, older, and more profitable than Lumin
  - - Fiserv
    - FY2025 revenue $21.19B; EV/Sales 2.63x; market cap $27.00B
    - Incumbent floor multiple for broad fintech infrastructure
    - Helps bound downside multiple assumptions
    - Much broader business mix and scale
  notes: These comparables provide valuation discipline, not a claim that any one company is a perfect analog to Lumin.
