- id: thesis-breakers-and-final-diligence
  title: Thesis-breakers and final diligence
  body: 'The final decision on Lumin should pivot on a small set of evidence requests rather than on endless generic curiosity. First, management needs to bridge valuation to current operating scale: ARR or recognized revenue, retention, concentration, and margin quality. Second, management needs to show that the client-investor model is a strength without hiding concentration or governance overlap. Third, management needs to show that cyber and reliability controls perform in practice, not just on paper.


    Those asks are narrow but decisive. If Lumin can produce private data broadly consistent with the peer-implied revenue burden and durable customer economics, the current valuation can move from “plausible” to “supportable.” If it cannot, then the latest mark should be treated as aspirational or negotiation-driven rather than as independently validated fair value.


    The thesis-breaking events are also clear. A meaningful security incident, visible deterioration in a marquee customer-investor relationship, or private metrics materially below the peer burden would all undermine the valuation case quickly. The right posture is therefore: high interest, high respect, but no relaxed pricing discipline.'
