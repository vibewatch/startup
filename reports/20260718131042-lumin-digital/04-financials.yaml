- id: TI005
  title: Public financial gaps table
  columns:
  - gap
  - current public state
  - why it matters
  - exact diligence path
  rows:
  - - ARR / revenue
    - No direct public disclosure
    - Valuation support depends heavily on the true recurring-revenue base
    - Request CFO-level ARR and revenue bridge by year.
  - - Gross margin / EBITDA / FCF
    - No retained public disclosure
    - Margin quality determines whether software economics justify a premium multiple
    - Request audited P&L and management operating-metric pack.
  - - Cash balance / runway / burn
    - Only “strong balance sheet” language is public
    - Capital adequacy cannot be fully underwritten from headline raises alone
    - Request cash, burn, runway, and covenant schedule.
  - - Retention / NRR / GRR
    - Only indirect outcome proxies are public
    - Switching costs matter only if they translate into durable expansion and renewals
    - Request cohort retention and renewal analysis.
  - - Customer concentration
    - No public concentration disclosure
    - A few large institutions could distort revenue quality and renewal risk
    - Request top-10 customer revenue share and concentration trends.
  - - Sales efficiency / CAC
    - No retained public CAC or payback data for Lumin itself
    - Go-to-market quality is essential for evaluating scale durability
    - Request CAC payback, cycle length, and implementation-cost metrics.
  notes: These are the minimum missing items needed to move from public-evidence triangulation to full financial underwriting.
