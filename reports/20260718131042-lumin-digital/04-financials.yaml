- id: public-traction-and-unit-economics-proxies
  title: Public traction and unit-economics proxies
  body: 'Lumin has enough public traction to support outside-in economics work, even though it does not publish audited software metrics. The company says it serves nearly eight million consumer accounts across ninety financial institutions, and earlier customer releases show it had more than fifty live institutions and more than four million users under contract by early 2024. Additional customer wins across Affinity Plus, Ent, and First Bank of Berne show the platform serving both large credit unions and community banks, which reduces the risk that scale is driven by one unusually narrow customer tier.


    The most quantitative public unit-economics evidence comes from the commissioned 451 Research study. It reports 145% ROI, 10.8-month payback, $12.8 million of cumulative impact, 75% of value from revenue growth, 11% more products per customer, 15% lower churn, 21% less call-center volume, 17% fewer branch transactions, and 95% lower downtime. Those numbers are not the same thing as Lumin''s own consolidated margin or retention metrics, but they do suggest the product can generate financially meaningful customer outcomes and potentially support premium pricing or durable expansion.


    A peer-based proxy helps convert those signals into revenue math. Alkami disclosed $21.44 of revenue per registered user at year-end 2025. Applied crudely to Lumin''s nearly eight million accounts, that suggests an annualized revenue level around $171 million. Because accounts and registered users are not the same denominator, this should be treated as a directional proxy rather than a point estimate, but it is still helpful for bounding the business.'
