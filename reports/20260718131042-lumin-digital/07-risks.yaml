  claims:
  - id: CR001
    statement: FFIEC authentication guidance says effective access and authentication risk management applies to customers, employees, third parties, service accounts, applications, and devices that touch digital banking services or institution systems.
    type: third-party-reported
    topic: regulatory-scope
    sourceRefs:
    - SR007
    - SR009
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
    - QR002
  - id: CR002
    statement: The same guidance says multi-factor authentication or controls of equivalent strength, plus layered security, may be needed when single-factor controls are inadequate for the risk profile.
    type: third-party-reported
    topic: mfa-expectation
    sourceRefs:
    - SR007
    - SR009
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR003
    statement: FFIEC guidance explicitly identifies mobile computing, APIs, cloud service providers, and increased third-party connectivity as factors that expand the attack surface and account-takeover risk.
    type: third-party-reported
    topic: attack-surface
    sourceRefs:
    - SR007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR004
  - id: CR004
    statement: The FFIEC cyber guide says ransomware incidents continue to evolve in severity and complexity and highlights assessment, exercise, information-sharing, and response tooling for financial institutions.
    type: third-party-reported
    topic: ransomware-risk
    sourceRefs:
    - SR008
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR005
    statement: NCUA's 2025 annual report shows the credit-union system still matters at national scale, with 4,287 federally insured credit unions, 144.7 million members, and $2.43 trillion in assets.
    type: third-party-reported
    topic: sector-scale
    sourceRefs:
    - SR010
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QR001
    - QR023
  - id: CR006
    statement: The same NCUA report shows a 103-basis-point delinquency rate and six failed federally insured credit unions in 2025, underscoring that Lumin serves a regulated customer base where stress events can still occur.
    type: third-party-reported
    topic: sector-stress
    sourceRefs:
    - SR010
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QR023
  - id: CR007
    statement: FDIC's Q1 2026 profile says FDIC-insured institutions maintained strong capital and liquidity, which limits near-term systemic stress but also means Lumin sells into buyers that remain tightly supervised and risk-sensitive.
    type: third-party-reported
    topic: sector-stability
    sourceRefs:
    - SR011
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QR023
  - id: CR008
    statement: Lumin's privacy notice says personal information may be shared with affiliates, partners, and service providers and that anonymous threat intelligence may be shared with FS-ISAC, law enforcement, and other legitimate forums.
    type: company-claimed
    topic: privacy-sharing
    sourceRefs:
    - SR003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR009
    statement: The privacy notice also says website-collected data can include IP address, user-agent, requested resources, cookies, and marketing-contact information, expanding the data-governance surface even before a prospect becomes a client.
    type: company-claimed
    topic: privacy-surface
    sourceRefs:
    - SR003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR010
    statement: Lumin's terms of use say website materials are not legal, compliance, regulatory, or financial advice and broadly disclaim liability and warranties, with disputes routed to California courts.
    type: company-claimed
    topic: terms-limits
    sourceRefs:
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
