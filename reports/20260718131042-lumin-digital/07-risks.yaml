- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Cyber / authentication failure
    - Reportable breach, large-scale account takeover, or regulator contact
    - Any notifiable incident or repeated credential-compromise pattern
    - Immediately re-rate legal, trust, and valuation risk higher
  - - Platform reliability
    - Outage cadence or SLA failure
    - Two meaningful incidents in a quarter or one customer-visible high-severity outage
    - Treat reliability as thesis-threatening for digital-banking workflows
  - - Partner dependency
    - Loss or degradation of a key partner path
    - Material disruption in BioCatch, FINBOA, or core-integration portability
    - Assume slower launches, weaker controls, and lower expansion durability
  - - Customer concentration / governance
    - Large client-investor churn or conflict
    - Loss of a marquee customer-investor or visible board/advisory tension
    - Escalate concentration and signaling risk immediately
  - - Execution and roadmap strain
    - Roadmap slips without adoption proof
    - AI / product expansion misses milestones while support friction rises
    - Do not underwrite valuation premium as if expansion is de-risked
  notes: These triggers are framed to be objectively testable during live diligence rather than narrative judgments after the fact.
