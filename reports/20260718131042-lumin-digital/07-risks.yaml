  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: incident-history-and-sla
    missingEvidence: Historical outage logs, SLA attainment, severity-by-incident counts, and postmortem evidence.
    whyItMatters: Mission-critical digital banking risk cannot be fully assessed from control descriptions alone.
    diligencePath: Request 12-24 months of status history, incident reports, SLA scorecards, and customer credit records.
    relatedQuestionRefs:
    - QR010
    - QR012
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-governance
    missingEvidence: Top-customer revenue share, overlap between largest customers and client-investors, and formal governance protections around roadmap influence.
    whyItMatters: The client-investor model can be a moat or a concentration amplifier depending on internal mix.
    diligencePath: Request top-10 revenue concentration, shareholder overlap, board rights, and pricing-governance policies.
    relatedQuestionRefs:
    - QR017
    - QR018
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: private-company-financial-disclosure
    missingEvidence: ARR, gross margin, burn, runway, support cost, and implementation-services economics.
    whyItMatters: A $1.6 billion valuation is hard to underwrite without basic private-company operating metrics.
    diligencePath: Request current KPI pack, board materials, and cohort economics.
    relatedQuestionRefs:
    - QR019
    - QR020
    relatedTableRefs:
    - TR005
  - type: public-conflict
    severity: minor
    topic: customer-counter-consistency
    missingEvidence: One reconciled active-client and active-user baseline across about, credit-union, and bank pages.
    whyItMatters: Inconsistent public counters undermine confidence in exact concentration and scale calculations.
    diligencePath: Request management bridge for contracted, live, and active clients/users.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: minor
    topic: TR001 legal and regulatory coverage
    missingEvidence: Full register of customer contractual terms, negotiated indemnities, and any historical regulator or customer disputes beyond the representative risk sample.
    whyItMatters: The regulatory/legal table is intentionally a sample because public legal surfaces do not show negotiated enterprise contract outcomes or dispute history.
    diligencePath: Request form agreements, negotiated redlines, customer security exhibits, and any historical legal or regulatory notices.
    relatedQuestionRefs:
    - QR001
    - QR006
    - QR007
    relatedTableRefs:
    - TR001
