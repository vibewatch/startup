- id: buyers-segments-and-adoption-path
  title: Buyers, segments, and adoption path
  body: 'The buyer for a digital-banking platform is rarely a single person. In a credit union, the operational sponsor may be the chief experience, digital, operations, or retail-banking leader, while risk, fraud, information security, and the core-banking team can all influence the decision. In a community bank, the sponsor may sit under retail banking, digital channels, the chief operating officer, or an innovation team, with finance and risk functions acting as gatekeepers. Users are the institution''s customers or members, but the budget owner is almost always the institution itself rather than the end user.


    The adoption path is similarly cross-functional. A project often starts from visible customer pain—poor mobile experience, weak business-banking functionality, low engagement, or pressure to add faster payments and better self-service. It then expands into integration, data, security, and change-management questions because the new digital layer has to work across the institution''s core systems and third-party stack. This is why Lumin''s API and partner-ecosystem story matters more than it would in a standalone consumer app.


    Lumin''s cooperative client-investor model also makes more sense in this context than it would in a simpler SaaS market. Digital-banking deployments are strategic, sticky, and high-trust relationships. When institutions become investors as well as customers, the model can strengthen referenceability and reduce replacement risk. The tradeoff is that public sources still do not quantify how many target institutions on the bank side are truly in-scope for that model.'
  claimRefs:
  - CM005
