- id: market-shell-and-sizing-lenses
  title: Market shell and sizing lenses
  body: 'No single public number cleanly sizes Lumin''s market, so the right approach is triangulation. The most concrete official shell is the U.S. credit-union system. NCUA reports 4,287 federally insured credit unions, 144.7 million members, and $2.43 trillion of assets at year-end 2025. Even that shell is not homogeneous: 2,514 institutions were under $100 million of assets, 2,390 carried low-income designations, and the largest institutions above $15 billion fall under a different supervisory profile. That distribution matters because vendor requirements, implementation budgets, and sales cycles differ sharply across those tiers.


    Lumin''s current scale provides a second lens rather than a market total. Its about page says the platform serves nearly eight million consumer accounts across ninety financial institutions. That is large enough to prove product-market fit, but it is still a small share of the credit-union member base alone, before adding the community-bank side of the market. Put differently, public evidence supports a real installed base but does not support any claim that the category is near saturation.


    The third lens is category economics from public peers. Alkami ended 2025 with 22.4 million digital-banking users and $480.3 million of ARR, while Q2 reported $794.8 million of revenue and $780.1 million of subscription ARR. Those disclosures show that the digital-banking engagement layer can support hundreds of millions of recurring software revenue. They do not define Lumin''s TAM by themselves, but they do prove that this is a major spend category inside financial-institution technology budgets.'
