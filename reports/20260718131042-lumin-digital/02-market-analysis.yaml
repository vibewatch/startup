- id: TM003
  title: Segment / buyer map
  columns:
  - segment
  - primary buyer
  - primary user
  - payer / budget owner
  - workflow
  - adoption trigger
  rows:
  - - Small credit union
    - CEO, COO, or member-experience leader
    - Members and front-line staff
    - Institution operating budget
    - Replace dated online and mobile banking while keeping implementation manageable
    - Need to modernize UX without adding unmanageable complexity.
  - - Large or complex credit union
    - Digital leader plus risk, IT, and operations
    - Members, business users, service staff
    - Institution operating and transformation budget
    - Broader platform decision that must satisfy scale, controls, and multi-product expectations
    - Need for better growth, analytics, business banking, or merger readiness.
  - - Community bank
    - Head of digital, retail, or operations with finance and risk input
    - Retail and small-business customers
    - Institution technology and deposit-growth budget
    - Digital-channel refresh tied to competitiveness, deposits, and efficiency
    - Need to improve customer retention, self-service, and product agility.
  - - Regional or commercial-focused bank
    - Digital channel executive plus treasury or commercial sponsor
    - Retail and commercial users
    - Cross-functional digital-transformation budget
    - Digital-banking platform becomes a front-end operating layer tied to payments and service
    - Need to support commercial workflows and keep pace with larger peers and nonbanks.
  notes: The buyer is institutional, but the end-user experience and security obligations make the decision highly cross-functional.
