    - negative
    - current
    - Raises the bar for payment UX, fraud controls, and partner integration
    - Test whether Lumin wins on embedded payments and fraud workflows, not just UI.
  notes: The table separates structural demand drivers from adoption frictions so the market case does not hide execution and compliance realities.
