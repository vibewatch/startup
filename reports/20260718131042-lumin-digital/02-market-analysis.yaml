company:
  name: Lumin Digital
chapter:
  number: 2
  title: Market Analysis
  summary: Lumin Digital sells into a large but not perfectly countable U.S. digital-banking market anchored by 4,287 federally insured credit unions, an active community-bank modernization cycle, and public peers that already generate hundreds of millions of recurring revenue. The underwriting-positive facts are that digital engagement, cloud delivery, payments innovation, and AI remain live buying priorities; the main caveat is that retained public evidence still cannot cleanly isolate Lumin's exact serviceable bank and credit-union count.
sections:
- id: market-boundary-and-workflow-scope
  title: Market boundary and workflow scope
  body: 'Lumin''s market is the digital engagement layer used by credit unions and community or regional banks to serve retail and business customers online and in mobile channels. The cleanest way to bound that market is by workflow, not by broad “fintech” language. Included spend covers the digital front end—account access, money movement, alerts, messaging, self-service, business banking, personalization, and adjacent experiences such as CRM, lending-entry, and campaign tools that are embedded in the day-to-day banking interface. Lumin''s own retail-banking, commercial-banking, technology, and extensibility pages all point toward that workflow definition.


    The most important exclusion is core processing. Lumin does not present itself as the system of record for deposits and loans; instead it emphasizes APIs, SDKs, developer tooling, and partner integrations that sit on top of or alongside other systems. That distinction matters because many headline market estimates for banking technology blend digital channels, core systems, fraud, payments infrastructure, and services into one giant bucket. Lumin''s real competition is narrower: legacy digital-banking vendors, digital suites sold by incumbent bank-tech providers, and in-house assemblages of online-banking, payments, and service tools.


    The category boundary also explains why integrations matter so much. A digital-banking platform has to connect to the core, the payment rails, security controls, third-party fintech tools, and product systems without making users leave the channel. Lumin''s own ecosystem page says more than 200 integrations are available or in development, reinforcing that the market is not just about interface design; it is about owning the engagement layer while coordinating a wider financial-services stack.'
