callouts:
  - calloutType: strength
    title: Customer-shareholder alignment is a real differentiator
    body: >-
      Lumin's capital stack is unusual for enterprise software: institutions that use the platform are also investing in it, which strengthens referenceability and may reduce near-term churn risk.
    claimRefs:
      - CO018
      - CO019
      - CO020
      - CO021
  - calloutType: insight
    title: Outcome marketing is unusually quantitative for a private fintech
    body: >-
      The 451 Research study gives Lumin a stronger public ROI narrative than many private peers, especially because it emphasizes revenue growth and payback rather than only cost reduction.
    claimRefs:
      - CO025
      - CO026
      - CO027
      - CO028
      - CO029
  - calloutType: risk
    title: Public counter inconsistencies limit precision
    body: >-
      Institutional counts, referenceability percentages, and the 2024 funding total vary across official pages and later press releases, so investors should request a reconciled source-of-truth pack.
    claimRefs:
      - CO006
      - CO007
      - CO024
      - CO040
