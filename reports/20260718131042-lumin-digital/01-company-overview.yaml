      topic: funding-discrepancy
      missingEvidence: A reconciled round-by-round capitalization table covering the December 2024 financing and any subsequent close adjustments.
      whyItMatters: Without a reconciled schedule, public totals of $160M and $170M cannot be cleanly aligned for dilution analysis.
      diligencePath: Request board-approved financing summaries, closing memos, and the latest cap table from management.
      relatedQuestionRefs:
