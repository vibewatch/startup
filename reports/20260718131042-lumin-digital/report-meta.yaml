  topStrengths:
    - Real customer proof across credit unions and community banks, including large institutions.
    - Architecture-led product with meaningful security, API, and partner depth.
    - Strong customer-alignment signal from the client-investor model and repeat financing support.
    - Clear market relevance in a regulated category with real digital-transformation demand.
  topRisks:
    - Public revenue, retention, concentration, and margin disclosure remain insufficient for full underwriting.
    - Cyber, partner, and reliability risk remain top-tier for a mission-critical digital-banking workflow.
    - Customer-shareholder overlap may amplify governance or concentration issues.
    - Current valuation already assumes substantial operating scale that has not been publicly bridged.
  unresolvedGaps:
    - ARR or recognized revenue, gross margin, and free-cash-flow profile.
    - GRR, NRR, contract duration, and top-customer concentration including client-investor overlap.
    - Incident history, SLA attainment, and support-operating metrics.
    - Cap-table preferences and the real common-equity economics of the current mark.
    - Module attach, AI adoption, and expansion revenue by customer cohort.
