companyProfile:
  summary: Lumin Digital is a San Ramon, California-based private digital-banking software company founded in 2016 by Jeff Chambers. Public evidence supports a real platform franchise across credit unions and community banks, with roughly ninety institutions, nearly eight million consumer accounts, a cloud-native product surface spanning retail and business banking, and a client-investor model that culminated in a July 2026 financing at roughly a $1.6 billion valuation. The company looks strategically relevant in U.S. community-finance infrastructure, but public underwriting evidence remains incomplete on revenue scale, retention, concentration, margin quality, and the cap-table economics behind the current mark.
  foundedDate: '2016-01-01'
  founders:
    - name: Jeff Chambers
      role: Founder & CEO
      background: Founder who launched Lumin to build a modern cloud-native digital banking platform for credit unions and community banks and remains the company’s public operating leader.
      claimRefs: [CO001, CO002]
  foundingLocation: San Ramon, California, USA
  headquarters: San Ramon, California, USA
  productSummary: Lumin sells a cloud-native digital-banking platform with retail and business-banking workflows, extensibility through APIs and SDKs, partner-led integrations, embedded security controls, dispute automation, and an emerging AI layer.
  customerFocus: U.S. credit unions, community banks, their retail account holders, and business-banking users.
  businessModel: Subscription software and digital-banking platform contracts with partner and module expansion, plus customer-aligned capital from a cooperative investor base.
  stage: Growth-stage private / late-stage fintech
  fundingStatus: More than $115 million of new capital announced in July 2026 at roughly a $1.6 billion valuation, following a $170 million 2024 round and more than $75 million of client investment in 2025.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO005, CO022, CO025, CO033, CU001, CU003, CV001, CV002]
