  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, and renewal cadence by major customer segment.
    whyItMatters: Customer quality is much easier to prove publicly than customer durability, and valuation risk sits in that gap.
    diligencePath: Request renewal cohorts and segment-level retention dashboards.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-customer revenue share, top-program ACV, and services intensity.
    whyItMatters: A private infrastructure company can look diversified by logo while remaining concentrated by revenue.
    diligencePath: Request top-10 account concentration and attach-rate detail by module.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: independent-references
    missingEvidence: Independent customer interviews or analyst-survey evidence outside company-curated case studies.
    whyItMatters: Case studies are useful but still inherently selective.
    diligencePath: Run third-party customer calls across at least one OEM, one trucking account, and one defense-adjacent account.
    relatedQuestionRefs:
    - QU024
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: minor
    topic: segment-economics
    missingEvidence: Bookings, ARR, and gross-margin contribution by end market.
    whyItMatters: Expansion into many verticals is positive only if economics are durable and scalable by segment.
    diligencePath: Request a segment revenue bridge and customer-lifetime-value analysis.
    relatedQuestionRefs:
    - QU025
    relatedTableRefs:
    - TU001
