- id: named-customer-proof
  title: Named customer proof and deployment quality
  body: |-
    Named customer proof and deployment quality is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied has unusually strong named-reference coverage for a private infrastructure company, but most of the public proof still comes from curated success stories. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. Toyota, AISIN, Isuzu, May Mobility, and Scientific Systems give the chapter real customer names, executive quotes, and concrete use cases spanning passenger vehicles, commercial vehicles, and defense-adjacent autonomy. That is materially better than a logo slide with no detail. Still, these references remain company-published case studies, which means they are useful but not equivalent to audited retention data or independent user-survey evidence. For diligence, the important distinction is between reference quality and cohort durability: the former is clearly present, while the latter is still only partially visible. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
  claimRefs:
