- id: partnership-scale-and-adoption
  title: Partnership scale and adoption trajectory
  body: |-
    Partnership scale and adoption trajectory is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the companys adoption trajectory is visible through repeated strategic program wins across major OEM and trucking names rather than through disclosed customer-count dashboards. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. Public partnership announcements with Audi, Porsche, Nissan, TRATON, Stellantis, and Isuzu show that Applied keeps winning programs where the buyer is sophisticated and the integration burden is high. External reporting from WardsAuto, PRNewswire, TNGlobal, TTNews, and TechCrunch adds some corroboration that the programs are not isolated logos. Even so, the available evidence tells investors more about who Applied sells to than about how quickly those relationships expand, renew, or monetize over time. That asymmetry means design-win quality is well supported, while account-level adoption curves are still mostly inferred. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
