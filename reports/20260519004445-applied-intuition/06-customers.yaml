    Customer segments, buyers, and use cases is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuitions customer base is best understood as a cluster of high-complexity industrial buyers rather than as a homogeneous software user base. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory. Retention, concentration, and disclosure gaps is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the biggest customer-underwriting weakness is not lack of logos but lack of denominator data on retention, concentration, and repeat purchase. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.
sections:
- id: customer-segments-and-buyers
  title: Customer segments, buyers, and use cases
  body: |-
    Customer segments, buyers, and use cases is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuitions customer base is best understood as a cluster of high-complexity industrial buyers rather than as a homogeneous software user base. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The strongest public segment evidence comes from Applieds own about, products, and year-in-review materials, plus third-party summaries from Craft, TTNews, and Automotive World. Taken together, they show a buyer set anchored in automotive OEMs and trucking programs but expanding into mining, construction, defense, and other mission-critical machine categories. This matters because adoption drivers vary sharply by segment: passenger OEMs care about software ownership and validation throughput, while commercial and defense users emphasize operational reliability, shortage-driven automation, and trusted autonomy. The public record supports breadth, but it does not yet quantify how much revenue sits in each segment. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
