- id: retention-concentration-and-gaps
  title: Retention, concentration, and disclosure gaps
  body: |-
    Retention, concentration, and disclosure gaps is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the biggest customer-underwriting weakness is not lack of logos but lack of denominator data on retention, concentration, and repeat purchase. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. Sacras ARR estimate and the companys expanding end-market narrative suggest a business that has scaled materially, but public sources still do not disclose NRR, GRR, churn, top-account share, or renewal cadence. That makes it hard to distinguish between a broad, durable customer base and one that is still dependent on a small number of strategic programs. Independent adverse commentary also matters here: SWOT Analysis explicitly flags customer insourcing risk, which is a useful reminder that even marquee OEM relationships can weaken if buyers decide to internalize more of the stack. In short, customer quality looks strong, but customer durability is still under-disclosed. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
