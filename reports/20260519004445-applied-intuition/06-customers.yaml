- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Cross-sell from simulation into OS / SDS / infotainment
    - Large programs may still be concentrated within a few OEM groups
    - Positive if Applied owns more stack; negative if one platform loss removes several modules
    - Request module-adoption map by top 20 accounts
  - - Geographic trucking and logistics rollout
    - Commercial-route programs may remain country-specific and regulation-bound
    - Can deepen account value but may scale slower than headline logos imply
    - Request route count, vehicle count, and commercialization milestones
  - - Defense diversification
    - Government and defense work can be lumpy and procurement-driven
    - Reduces auto cyclicality but may raise volatility and compliance cost
    - Request public-sector and defense revenue mix
  - - Marquee OEM references
    - Reference prestige can hide weak denominator economics if only a handful of programs pay materially
    - Supports valuation narrative but not necessarily durable recurring revenue
    - Request ACV, renewal, and services intensity for top OEM accounts
  - - Customer insourcing risk
    - Sophisticated buyers may internalize more of the stack over time
    - Can compress pricing and reduce long-term attach rates
    - Review win-loss and renewal churn reasons for prior large programs
  notes: Expansion logic is public and intuitive, but concentration risk remains under-disclosed and is therefore one of the most important customer diligence topics.
