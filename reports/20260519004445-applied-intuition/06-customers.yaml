tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Passenger automotive OEMs
    - 'Buyer: OEM software and ADAS leaders; user: engineering teams; payer: OEM program budgets'
    - ADAS stacks, validation, infotainment, software-defined vehicle programs
    - Multiple named public references
    - Strategically central to brand and volume credibility
    - No public revenue split by OEM
  - - Commercial vehicles and trucking
    - 'Buyer: truck OEM and logistics-autonomy teams'
    - Autonomous trucking, fleet software platforms, vehicle OS
    - TRATON and Isuzu are public anchors
    - Important for multi-domain scale and freight use-case credibility
    - No disclosed deployment counts or commercial-route economics
  - - Mobility and robo-transit operators
    - 'Buyer: autonomy startup engineering teams'
    - Simulation and autonomy-development acceleration
    - May Mobility public case study
    - Useful proof of developer-value proposition
    - No renewal or ACV disclosure
  - - Defense and trusted autonomy users
    - 'Buyer: government or defense-adjacent program owners'
    - Simulation, trusted autonomy, multi-domain mission workflows
    - Scientific Systems and government-agency references
    - Supports diversification beyond auto cyclicality
    - Public government revenue visibility is thin
  - - Industrial and off-road machines
    - 'Buyer: OEM and program teams in mining, construction, agriculture'
    - Physical AI and autonomy stack deployment
    - Visible in year-in-review narrative, less visible in named customer list
    - Expands TAM beyond highway vehicles
    - Need named references and live-production proof
  notes: Segmentation relies on retained public sources only; strategic value is easier to support publicly than segment-level revenue contribution.
