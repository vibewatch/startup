companyProfile:
  summary: |
    Applied Intuition is a Mountain View-based vehicle-intelligence software company
    founded in 2017 by Qasar Younis and Peter Ludwig. The company has expanded from
    simulation and validation tooling into a broader stack spanning vehicle platform,
    ADAS/autonomy software, developer tooling, and physical-AI workflows sold into
    automotive, commercial-vehicle, defense, and industrial-machine programs. Public
    evidence shows major OEM and partner relationships, strong private-market support,
    and a latest financing anchor of $600M at a $15B valuation, but the company still
    discloses little about margin, burn, concentration, or renewal quality.
  foundedDate: "2017-01-01"
