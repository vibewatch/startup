coverageNotes: |
  Public evidence is strong on Applied Intuition's product breadth, named customer and
  partner proofs, and financing history, but weak on audited operating metrics. The
  fetched record supports a $250M Series E at a $6B valuation in March 2024, a later
  >$300M secondary/liquidity transaction, and a $600M Series F fundraise and tender at
  a $15B valuation in June 2025; it does not directly support the narrower phrasing of
  an October 2024 a16z-led $300M primary round at $6B. ARR figures come from Sacra and
  should be treated as third-party estimates rather than company-disclosed financials.
  Gross margin, burn, cash, NRR, and customer concentration remain undisclosed.
