  topStrengths:
    - 从仿真、验证、车辆平台到 ADAS/自动驾驶和 AI 工具，宽栈布局让 Applied Intuition 嵌入 OEM 工作流的深度超过单点工具供应商。
    - 公开客户和伙伴证据覆盖 Toyota/Woven、AISIN、Isuzu、Audi、Porsche 以及 TRATON 相关项目等头部汽车和商用车名字。
    - 对一家私营 mobility 软件公司来说，融资通道异常强：约 15 个月内完成 $6B 估值的 Series E、大额员工流动性老股交易，以及 $15B 估值的 Series F。
    - Sacra 估计 2025 年 ARR 约为 ~$830M；该数字尚未验证，但暗示公司可能已经跑到足以支撑大型软件平台叙事的规模。
    - 如果 OEM 继续把更多技术栈外包，Applied Intuition 看起来能承接长期的软件定义汽车和自动驾驶支出。
  topRisks:
    - 公开披露仍不足以承保 $15B 估值：保留来源没有给出毛利率、烧钱速度、现金余额、NRR 或客户集中度。
    - 最新私募估值接近 Aurora 的公开市值，也高于若干其他公开 ADAS/自动驾驶同业，容错空间有限。
    - OEM 和大项目集中度风险很可能不小，但分母未披露；大客户也可能随着时间把部分技术栈收回内部。
    - 汽车行业采购、发布和监管周期很长，头部 logo 转化为耐久经常性收入可能被拖慢。
    - Embark 合并诉讼记录不足以推翻投资逻辑，但提醒我们：公司仍不透明时，战略交易会带来法律和披露摩擦。
  unresolvedGaps:
    - 经审计收入、毛利率、烧钱速度、现金和现金跑道没有公开披露。
    - 客户集中度、续约行为和净收入留存仍未知。
    - Series F / tender 中新股与老股的精确拆分，以及优先权影响，在保留的公开证据里看不见。
    - 工具、车辆平台和自动驾驶产品之间的产品线收入结构没有公开拆分。
    - 当前董事会构成、委员会结构和接班安排只能从公开来源看到一部分。
