- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited revenue and margin
    - No audited current ARR, gross margin, or burn disclosure
    - Premium valuation requires confidence in economic quality, not just customer prestige
    - Management / data room request
  - - Cap table and preference stack
    - No public preference, dilution, or waterfall detail
    - A high headline valuation can still leave common-equity economics unattractive
    - Finance team / counsel review
  - - Customer concentration and renewals
    - No public top-account exposure or renewal schedule
    - Durability matters more than logo count at a premium price
    - Revenue operations and customer-success review
  - - Module-level economics
    - No evidence on how much revenue comes from infrastructure, OS, autonomy, or defense products
    - Business mix changes both margin profile and comp selection
    - Segment P&L request
  - - Defense and government commercialization
    - Public narrative is stronger than public contract detail
    - Diversification credit should be based on revenue and backlog, not just strategy
    - Business-line review with defense leadership
  notes: These asks represent the minimum diligence package needed before treating the public evidence as investment-grade valuation support.
