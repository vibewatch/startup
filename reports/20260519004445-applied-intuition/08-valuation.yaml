- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue quality disappoints
    - Private diligence shows ARR or gross margin materially below implied premium expectations
    - Breaks the argument that the current mark is supported by software-like economics
    - Demand a materially lower entry price or pass
  - - Concentration is too high
    - One or two customer groups drive an outsized share of revenue or roadmap attention
    - Weakens durability and raises insourcing risk
    - Haircut growth assumptions and multiple
  - - Private mark loses support
    - Secondary or new-round demand comes in materially below prior mark
    - Signals premium narrative has weakened before disclosure quality improved
    - Re-underwrite from latest clean mark
  - - Public comp reset
    - Comparable autonomy / SDV equities re-rate sharply downward without company-specific offsetting proof
    - Shrinks tolerance for premium private multiple
    - Increase discount rate and downside weighting
  - - Defense / diversification stalls
    - Expansion beyond core auto is slower or thinner than the narrative implies
    - Reduces strategic optionality that helps justify the premium
    - Treat business as more cyclical and lower-multiple
  notes: Kill triggers focus on evidence that would change valuation discipline rather than on soft narrative shifts.
