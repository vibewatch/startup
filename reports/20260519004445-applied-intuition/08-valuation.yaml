    - Different hardware and public-company profile
  - - Ambarella
    - Market cap
    - $3.45B (May 2026)
    - Useful embedded-vehicle-AI comp for valuation floor thinking
    - Semiconductor exposure differs from Applieds software profile
  - - Ouster
    - Market cap
    - $1.95B (May 2026)
    - Illustrates how public autonomy-adjacent valuations can stay much lower than premium private marks
    - Sensor-company economics are not directly comparable
  - - Luminar
    - Market cap
    - $14.66M (May 2026)
    - Sharp reminder of downside when autonomy narratives collide with execution and market skepticism
    - Extreme distress case; not a balanced central comp
  notes: The comp set is intentionally heterogeneous because no single public company cleanly matches Applieds private business mix.
