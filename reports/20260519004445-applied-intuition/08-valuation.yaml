- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Applied has become a category-defining vehicle-software platform with repeated late-stage private-market validation.
    - Need audited proof that the company converts scale into durable, software-like economics.
  - - The company sits in large, structurally growing SDV and autonomy markets.
    - If growth is mostly services-heavy or limited to a handful of programs, the market tailwind matters less.
  - - Marquee customer and investor quality justify premium attention.
    - If concentration or insourcing risk is materially higher than public sources suggest, the premium should shrink.
  - - 'Anti-thesis: cyclical auto demand, insourcing pressure, and public-comp volatility can compress the private mark quickly.'
    - Independent evidence of sticky ARR, margin expansion, and diversified account exposure would soften the anti-thesis.
  notes: The anti-thesis is not a rejection of the business; it is the main reason to demand price discipline.
