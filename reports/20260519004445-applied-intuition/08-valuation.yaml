- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR materially exceeds current estimate, defense and OEM expansion continue, and premium multiple holds.
    - A valuation above the current mark could be justified if growth compounds and public peers recover.
    - Execution breadth, concentration, and comp multiple compression
    - Possible but requires strong private metrics
  - - Base
    - ARR tracks near current estimate, private support stays strong, and comp volatility does not worsen materially.
    - Current $15B mark can be sustained but needs continued commercial traction.
    - Under-disclosed economics and sensitivity to large customer programs
    - Most plausible from current public evidence
  - - Bear
    - Growth slows, public multiples stay volatile, and private diligence reveals weak margin or concentration.
    - Valuation resets materially below the latest private mark.
    - Opaque gross margin, burn, or preference stack; customer insourcing
    - Real and should anchor downside discipline
  notes: Scenarios are qualitative because the public record is missing audited operating data and cap-table detail.
