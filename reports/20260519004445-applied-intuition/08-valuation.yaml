- id: market-backdrop-and-scenario-framing
  title: Market backdrop and bull / base / bear framing
  body: |-
    Market backdrop and bull / base / bear framing is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the market backdrop is strong enough to justify upside imagination, but not strong enough to remove valuation discipline. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. Grand View, Deloitte, and MarketsandMarkets all point in the same direction: software-defined vehicles, ADAS, and autonomy software remain structurally attractive markets. That helps explain why investors may be willing to pay a premium for a company that appears to sit across several layers of the stack. Yet a good market does not immunize any one vendor from multiple compression or customer insourcing. Scenario work therefore has to translate industry growth into company-specific conditions: how much ARR growth is needed, what multiple is realistic, and which risks would break the thesis even if the category stays healthy. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
