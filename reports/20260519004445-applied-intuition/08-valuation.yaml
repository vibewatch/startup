- id: public-comparable-context
  title: Public comparable context and filing visibility
  body: |-
    Public comparable context and filing visibility is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applieds private mark sits in a public-comparable range that is directionally useful but structurally unstable. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The public comp set is wide: Aurora trades near Applieds latest private valuation, while Mobileye, Ouster, Ambarella, and especially Luminar sit at very different levels. That dispersion tells investors two things at once. First, the idea of a multi-billion-dollar autonomy or vehicle-software equity story is not inherently absurd. Second, the market is punishing weaker business models and inconsistent execution very aggressively, which means public comps are both informative and dangerous. Filing-rich public peers provide better disclosure context than Applied does today, but they do not solve the private-company opacity problem for us. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
