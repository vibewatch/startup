- id: recommendation-and-final-diligence
  title: Recommendation, discipline, and final diligence asks
  body: |-
    Recommendation, discipline, and final diligence asks is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the correct IC posture is constructive but disciplined: Applied may deserve premium attention, but the public evidence still stops short of fully supporting a conviction valuation call. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The latest private mark can be rationalized in a bull or even base case if Sacras ARR estimate is directionally right and if the company keeps expanding across OEM, trucking, and defense programs without margin collapse. But the public record is still missing the pieces an investment committee would normally want before underwriting a premium multiple with confidence: audited revenue quality, gross margin, burn, preference stack, and concentration. That leaves the recommendation in a research-more zone where the company remains highly interesting, but price discipline and diligence gating should dominate the final decision. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
