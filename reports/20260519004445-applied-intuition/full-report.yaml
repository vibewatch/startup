              commercial durability. This is the central competitive takeaway from the retained evidence set. Applied
              has a plausible differentiation story built on breadth, white-box posture, and platform embedding. But no
              part of the market looks empty. Simulation and synthetic-data messaging is crowded; open source sets a
              lower bound on experimentation; and public rivals can spend through long development cycles while offering
