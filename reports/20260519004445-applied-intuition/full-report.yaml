              commercial durability. The latest private mark can be rationalized in a bull or even base case if Sacras
              ARR estimate is directionally right and if the company keeps expanding across OEM, trucking, and defense
              programs without margin collapse. But the public record is still missing the pieces an investment
              committee would normally want before underwriting a premium multiple with confidence: audited revenue
              quality, gross margin, burn, preference stack, and concentration. That leaves the recommendation in a
              research-more zone where the company remains highly interesting, but price discipline and diligence gating
              should dominate the final decision. Where the public record stays incomplete, the section makes the
              remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into
              unsupported precision.
