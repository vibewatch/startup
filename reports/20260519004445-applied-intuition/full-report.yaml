        title: Distribution power, switching cost, and multi-homing
        blocks:
          - type: paragraph
            body: >-
              Distribution power, switching cost, and multi-homing is framed through the retained 2026 evidence set
              rather than through a single marketing narrative. The working thesis in this section is that competitive
              outcomes in this market are shaped as much by workflow embedding and partnership access as by raw product
              features. The strongest reviewed evidence comes from official Applied Intuition product, funding, and
              partner materials, supplemented where possible with market data, customer proof, filing-style references,
              and independent reporting. The analysis separates company-claimed facts from third-party reported facts
              and treats missing private-company metrics as diligence asks instead of filling them in from memory.


              The investment implication is less about whether the theme sounds attractive in the abstract and more
              about what the available evidence actually proves about execution quality, dependency structure, and
              commercial durability. The retained evidence points to a common pattern: teams can evaluate several
              vendors in parallel during the early simulation phase, but lock-in rises sharply once the chosen stack
              touches release workflows, data infrastructure, and vehicle-platform architecture. That means Applied does
              not need to win every evaluation dimension to build a defensible position; it needs to become expensive to
              remove after adoption. At the same time, this same pattern empowers incumbents and open-source tools
              during early evaluation. Distribution, partner leverage, and the exact entry wedge still matter
              enormously. Where the public record stays incomplete, the section makes the remaining uncertainty explicit
              so later chapters can reuse the same fact pattern without drifting into unsupported precision.
