              The investment implication is less about whether the theme sounds attractive in the abstract and more
              about what the available evidence actually proves about execution quality, dependency structure, and
              commercial durability. Safety regulation, NCAP shifts, AI advances, and OEM interest in software ownership
              all push adoption forward. At the same time, switching costs cut both ways: they can improve retention
              after a win, but they also make procurement slower because validation, release, and type-approval
              workflows are hard to re-platform. That is why the headline outcome for diligence is nuanced. The market
              backdrop is attractive, yet the real investment question is how much of that broad growth pool converts
              into repeatable serviceable demand for Applied’s combined simulation-plus-platform stack. Where the public
