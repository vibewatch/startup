- id: drivers-constraints
  title: Growth drivers, adoption constraints, and market verdict
  body: |-
    Growth drivers, adoption constraints, and market verdict is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that market momentum is real, but the monetizable portion of that growth still depends on integration complexity, compliance intensity, and the exact mix of customers Applied can win. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. Safety regulation, NCAP shifts, AI advances, and OEM interest in software ownership all push adoption forward. At the same time, switching costs cut both ways: they can improve retention after a win, but they also make procurement slower because validation, release, and type-approval workflows are hard to re-platform. That is why the headline outcome for diligence is nuanced. The market backdrop is attractive, yet the real investment question is how much of that broad growth pool converts into repeatable serviceable demand for Applied’s combined simulation-plus-platform stack. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
