- id: sizing-lenses
  title: TAM, SAM, and sizing-lens dispersion
  body: |-
    TAM, SAM, and sizing-lens dispersion is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the public evidence proves a large and growing market, but it does not support a single precise market size for Applied Intuition without additional segmentation work. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The retained analyst sources describe very different scopes: broad autonomous-vehicle markets, narrower autonomy-software markets, and even broader software-defined-vehicle platforms. Those are all informative, but they are not interchangeable. The right diligence move is therefore to keep multiple lenses in view: a broad strategic TAM, a narrower software-centered SAM, and a bottom-up SOM built from actual buyer groups such as OEM ADAS teams, truck-platform programs, Tier 1 suppliers, and defense autonomy developers. Public dispersion is a feature of the evidence set, not an error to be smoothed away. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
