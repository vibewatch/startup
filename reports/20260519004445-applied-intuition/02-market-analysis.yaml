- id: buyers-budgets
  title: Buyer, user, payer, and adoption path
  body: |-
    Buyer, user, payer, and adoption path is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition’s likely buyers are large technical programs with centralized budgets, long planning cycles, and multiple internal stakeholders rather than lightweight self-serve accounts. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The customer proof in the retained source set is telling: Toyota, AISIN, Isuzu, TRATON, Audi, and Scientific Systems all imply complex programs where engineering leaders, software platform owners, safety teams, and program managers participate in adoption. Deloitte’s SDV work reinforces this by pointing to centralized decision-making, while S&P’s long-horizon model-level forecasts show why procurement cycles are tied to multiyear vehicle programs. In practice, this means the sales path is probably closer to platform standardization and release-process embedding than to seat-based software conversion. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
  claimRefs:
