- id: workflow-data-and-research-stack
  title: Workflow, data, and research stack
  body: |-
    Workflow, data, and research stack is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the companys technical story is strongest where it connects real-world data ingestion, simulation fidelity, and proprietary research assets into one workflow. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The physical-AI, applied-autonomy, and engineering-blog sources collectively show a recurring architecture: ingest data, model behavior with enough fidelity to matter, validate edge cases, and feed the learnings back into deployed systems. Research assets such as SPACeR and S2GO reinforce that the company is still investing in frontier modeling rather than simply packaging older infrastructure. The key diligence question is whether these research and workflow components are standardized enough to be repeatably deployed across customers or whether too much of the value still depends on high-touch services from a large engineering bench. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
