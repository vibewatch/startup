- id: trust-safety-and-compliance-controls
  title: Trust, safety, and compliance controls
  body: |-
    Trust, safety, and compliance controls is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition has a stronger public trust-and-compliance record than many autonomy-tool vendors, but the public record still emphasizes process evidence over outcome evidence. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. ISO 26262 and ISO/SAE 21434 certifications, NCAP preparation content, and NHTSA-aligned safety framing all help support the claim that the company is trying to productize safety and cybersecurity discipline rather than bolt it on after the fact. That said, public materials still do not offer customer-level defect rates, audit findings, or incident-history disclosure, so the companys control posture should be treated as a real positive but not as proof that operational risk is closed. In diligence, the missing bridge is from certified process to measured customer outcomes. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
  claimRefs:
  - CE021
  - CE022
  - CE023
  - CE024
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
