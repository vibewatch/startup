- id: FE001
  title: Product architecture map
  type: stack
  layout: wide
  summary: Layered view of Applied Intuitions product stack from workflow infrastructure through deployment and trust controls.
  data:
    layers:
    - id: data-workflows
      label: Data and Workflow Infrastructure
      detail: Physical AI tooling for petabyte-scale ingestion, orchestration, and reproducible workflow execution across cloud, on-prem, and air-gapped environments.
    - id: simulation-validation
      label: Simulation and Validation Layer
      detail: HD maps, high-fidelity vehicle models, ODD coverage workflows, and quality metrics for scenario execution and regression analysis.
    - id: autonomy-applications
      label: Autonomy Application Layer
      detail: SDS for Automotive and multi-domain autonomy assets spanning passenger vehicles, trucks, defense, and industrial machines.
    - id: systems-platform
      label: Vehicle OS Layer
      detail: Single platform intended to unify perception, planning, controls, and other critical machine systems.
    - id: trust-controls
      label: Trust and Compliance Layer
      detail: Metrics-based validation plus ISO 26262, ISO/SAE 21434, and NCAP-oriented readiness messaging.
  approximationNotes: Layer boundaries are analyst-defined from retained product and engineering pages because the company has not published one canonical internal architecture diagram.
