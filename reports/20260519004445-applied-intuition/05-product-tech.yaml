  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: product-usage-metrics
    missingEvidence: Customer-level deployment counts, implementation time, and defect-rate metrics by product pillar.
    whyItMatters: Public materials show breadth and process discipline but not the denominator-rich operating metrics needed to underwrite repeatability.
    diligencePath: Request product-level KPI dashboards and implementation benchmarks by customer cohort.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: integration-burden
    missingEvidence: Independent proof that Vehicle OS and SDS materially reduce customer integration effort across live programs.
    whyItMatters: A large part of the moat story depends on lowering system-complexity cost, not just adding more modules.
    diligencePath: Request pre- and post-deployment integration timelines from reference customers.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: minor
    topic: research-transfer
    missingEvidence: Examples showing how SPACeR, S2GO, or related research assets moved into revenue-generating products.
    whyItMatters: Research depth is valuable, but underwriting improves when the commercialization path is explicit.
    diligencePath: Ask product leadership for a research-to-product transfer log and revenue attribution.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: minor
    topic: control-outcomes
    missingEvidence: Incident history, audit findings, and customer outcomes linked to ISO and NCAP readiness workflows.
    whyItMatters: The public trust story is process-heavy; diligence still needs outcome evidence.
    diligencePath: Request recent customer audit reports, control exceptions, and safety KPI deltas.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
