- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - SDS for Automotive
    - Automotive OEM engineering teams
    - Launched product
    - White-box ADAS stack with pathway from L2++ toward higher automation
    - Need win-rate and production-program count by OEM
  - - Applied Autonomy / multi-domain SDS
    - Defense, industrial, and off-road autonomy teams
    - Active platform layer
    - Cross-domain sensing, compute, and control architecture
    - Need evidence on domain-specific commercial mix
  - - Vehicle OS
    - Vehicle software and systems-integration teams
    - Strategic platform layer
    - Single architecture across perception, planning, and controls with integration-effort reduction claim
    - Need proof that 5x integration improvement holds outside reference programs
  - - Physical AI tooling
    - ML, data, and simulation platform teams
    - Core infrastructure
    - Petabyte-scale ingestion plus orchestration across cloud, on-prem, and air-gapped settings
    - Need cost and deployment-complexity benchmarks
  - - Research assets (SPACeR, S2GO)
    - Advanced autonomy and perception teams
    - Research-to-product pipeline
    - Extends the stack beyond commercial packaging into proprietary technical methods
    - Need evidence of production transfer into customer programs
  - - Trust / compliance assets
    - Safety, security, and validation owners
    - Certified process layer
    - ISO 26262 and ISO/SAE 21434 anchors support enterprise trust
    - Need customer-level control-test and audit evidence
  notes: This table maps the product stack by functional layer rather than by marketing page so the chapter can test where value is packaged versus where it is still aspirational.
