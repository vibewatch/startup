  title: Product & Technology
  summary: |-
    Platform scope and product surface is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition should be underwritten as a broad physical-AI software stack rather than as a single simulation tool. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory. Competitive position and product maturity is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the product moat appears to come from integrated workflow depth and deployment breadth more than from owning any one isolated technical primitive. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.
sections:
- id: platform-scope-and-modules
  title: Platform scope and product surface
  body: |-
    Platform scope and product surface is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition should be underwritten as a broad physical-AI software stack rather than as a single simulation tool. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The strongest product evidence is on the companys own product and launch pages, where the stack is broken into SDS, Vehicle OS, physical-AI workflow tooling, and domain-spanning autonomy assets. That matters because customers appear to be buying not only scenario generation or simulation rendering but also validation workflows, system integration layers, and deployed autonomy capabilities. The product set is broad enough that diligence should ask whether commercial packaging and implementation capacity keep pace with technical ambition, especially as the company extends from passenger vehicles to trucking, defense, and other moving machines. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
