  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Simulation and validation software
    - Recurring enterprise software and workflow tooling
    - Program / contract
    - Clearly part of product suite; no split disclosed
    - Likely recurring but undisclosed mix
    - Break out ARR and gross margin by tooling
  - - Vehicle platform / OS
    - Platform software for vehicle programs such as TRATON ONE OS
    - Program / platform contract
    - Visible in retained platform announcements
    - Potentially high-value and sticky
    - Show booked revenue and deployment schedule
  - - Autonomy / SDS products
    - Deployable ADAS and autonomy software
    - Program / model-family contract
    - Publicly visible but no pricing disclosed
    - Could improve software value capture
    - Disclose pilot-to-production conversion and pricing model
  - - Data / physical AI infrastructure
    - Data tooling, orchestration, and ML workflow revenue
    - Enterprise contract
    - Publicly visible in product materials
    - Supports multi-year programs
    - Separate software from services and cloud pass-through
  - - Implementation / support / deployment
    - Integration, setup, enablement, and ongoing support
    - Services or bundled support
    - Implied by delivery model; no public quantification
    - Can help win deals but may dilute margins
    - Provide services mix and attach rate
  notes: Revenue rows are constrained to streams directly visible in retained public materials and third-party estimates; no unsupported private metric is inserted here.
