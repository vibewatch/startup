  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross margin and services mix
    missingEvidence: Gross margin by product pillar and the share of revenue coming from services, support, and implementation.
    whyItMatters: This is the core test of whether Applied is a high-quality software business or a more services-intensive platform vendor.
    diligencePath: Request audited revenue and gross-margin bridge by product line.
    relatedQuestionRefs:
    - QI022
  - type: private-evidence-only
    severity: material
    topic: cash and runway
    missingEvidence: Cash balance, monthly burn, and explicit runway after Series F.
    whyItMatters: Fundraising success cannot substitute for a real capital-adequacy analysis.
    diligencePath: Request latest balance sheet, cash forecast, and downside burn scenarios.
    relatedQuestionRefs:
    - QI023
  - type: private-evidence-only
    severity: material
    topic: customer concentration and retention
    missingEvidence: Top-customer revenue concentration, contract duration, NRR, and renewal behavior.
    whyItMatters: A few large OEM or defense accounts could dominate revenue quality and volatility.
    diligencePath: Request cohort tables and top-account exposure analysis.
    relatedQuestionRefs:
    - QI024
  - type: missing-corroboration
    severity: medium
    topic: third-party ARR estimate
    missingEvidence: Company-confirmed revenue or ARR to validate Sacra’s estimate.
    whyItMatters: The strongest public traction number in the evidence set is still not management-confirmed.
    diligencePath: Reconcile internal board metrics to the third-party estimate and revenue recognition policy.
    relatedQuestionRefs:
    - QI025
