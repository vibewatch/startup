- id: capital-history
  title: Funding chronology, valuation context, and capital adequacy
  body: |-
    Funding chronology, valuation context, and capital adequacy is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition has strong public evidence of private-market financing strength, but not enough disclosure to translate that into a precise runway view. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The financing chronology is unusually clear for a private company. There is a Series E at $6 billion, an oversubscribed employee-liquidity secondary above $300 million, and a Series F fundraise plus tender at $15 billion. TechCrunch and TTNews both corroborate the latest round. That is a strong capital-access signal. Yet none of those sources provide the data investors actually need to assess adequacy: cash on hand, burn, debt, or next-round trigger. In other words, fundraising strength is visible, but balance-sheet sufficiency remains mostly opaque. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
