- id: unit-economics
  title: Unit economics proxies and disclosure asymmetry
  body: |-
    Unit economics proxies and disclosure asymmetry is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the public evidence supports a plausible premium enterprise-software model, but not a completed CAC/LTV or margin story. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. There are hints of quality—multi-pillar software products, enterprise deployment programs, and third-party ARR estimates at meaningful scale. But none of the retained public sources disclose realized pricing, gross margin, CAC, payback, or renewal behavior. The contrast with public comps is important here. Mobileye, Aurora, Luminar, Ouster, and Ambarella operate in adjacent markets with regular filing cadence, while Applied remains much harder to underwrite from outside materials. That asymmetry is not itself a red flag, but it is a real diligence cost. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
