- id: scale-milestones-gaps
  title: Scale signals, milestones, and open disclosure gaps
  body: |-
    Scale signals, milestones, and open disclosure gaps is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition has enough scale and partner density to look like a category leader, but the public record still leaves key underwriting items unresolved. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The company’s milestone set now includes public programs with Audi, Porsche, TRATON, and government-adjacent work, a visible GitHub footprint, and a history of employee-liquidity transactions that signal private-market demand. At the same time, the public record still lacks direct revenue, margin, customer concentration, and full-governance disclosure. The Embark merger complaint shows that even a fast-scaling software supplier can attract legal friction around disclosure quality when it pursues strategic transactions. For diligence purposes, that means the headline valuation story is real, but the investment committee should still treat private-company opacity—not technical ambition—as the main remaining overview blocker. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
