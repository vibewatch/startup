- id: funding-valuation-history
  title: Funding history, valuation progression, and qualification check
  body: |-
    Funding history, valuation progression, and qualification check is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition has clearly been a unicorn for multiple financing cycles, but the fetched record updates and partially corrects the specific qualification statement in the user prompt. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The strongest directly corroborated milestones are a $3.6 billion Series D, a $6 billion Series E, an over-$300 million secondary that followed that Series E, and a June 2025 Series F at $15 billion. The public sources do not directly support an October 2024 a16z-led primary round at $6 billion. Instead, they show Lux Capital, Elad Gil, and Porsche as the lead names on the March 2024 Series E, with Andreessen Horowitz participating rather than leading, and a later secondary round that provided liquidity rather than new primary capital. The qualification result is still positive because the company’s fetched evidence supports multiple post-threshold valuation events after the requested date window. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
  claimRefs:
