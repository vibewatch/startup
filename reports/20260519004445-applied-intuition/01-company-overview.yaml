  title: Company Overview
  summary: |-
    Identity, mission, and operating scope is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition should be understood as a cross-vertical vehicle intelligence software company whose commercial core is enterprise software rather than vehicle manufacturing. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory. Scale signals, milestones, and open disclosure gaps is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition has enough scale and partner density to look like a category leader, but the public record still leaves key underwriting items unresolved. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.
sections:
- id: identity-business-model
  title: Identity, mission, and operating scope
  body: |-
    Identity, mission, and operating scope is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition should be understood as a cross-vertical vehicle intelligence software company whose commercial core is enterprise software rather than vehicle manufacturing. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The official homepage, product pages, and company overview all point to the same operating model: Applied sells digital infrastructure, simulation, vehicle OS, and self-driving system software into customers that already own the physical machine and deployment channel. That matters because the company’s capital profile, deployment risk, and margin path differ materially from robotaxi operators or hardware-heavy autonomy startups. The public evidence also supports significant internal scale, including a 1,000+ engineer claim and a multi-domain product story that reaches beyond passenger automotive into trucking, mining, construction, agriculture, and defense. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
