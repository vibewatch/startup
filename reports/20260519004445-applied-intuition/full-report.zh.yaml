companyProfile:
  summary: >
    Applied Intuition 是一家总部位于 Mountain View 的车辆智能软件公司，2017 年由 Qasar Younis 和 Peter Ludwig
    创立。公司从仿真与验证工具扩展到更宽的技术栈，覆盖车辆平台、ADAS/自动驾驶软件、开发者工具，以及卖给汽车、商用车、防务和工业机械项目的物理 AI 工作流。公开证据显示，它拥有重要 OEM 和伙伴关系、强劲的私募市场支持，以及
    $600M、$15B 估值的最新融资锚点；但公司对毛利率、烧钱速度、集中度和续约质量披露仍少。
