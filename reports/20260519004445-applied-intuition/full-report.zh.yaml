              财务风险因素与总体结论基于留存的 2026 年证据集展开，而不是沿用单一营销叙事。本节工作假设是，主要财务风险不是融资能力，而是可见的估值动能与不可见的经营基本面之间的落差。已审阅的最强证据来自 Applied
              Intuition 官方产品、融资和伙伴材料，并在可行处补充市场数据、客户证明、类监管文件资料和独立报道。本分析区分公司自称事实和第三方报道事实；私营公司未披露的指标被列为尽调问题，而不是凭记忆补齐。


