            body: >-
              建议、纪律与最终尽调问题，放在留存的 2026 年证据集里看，而不是靠单一营销叙事判断。本节的工作假设是：正确的 IC 姿态是建设性但有纪律——Applied
              可能值得溢价关注，但公开证据仍不足以完整支撑一个高确信估值判断。已审阅证据中，最强的一组来自 Applied Intuition
              的官方产品、融资和合作伙伴材料；在可能的地方，再用市场数据、客户证明、监管文件式引用和独立报道补强。分析会区分公司自称事实与第三方报道事实；私有公司未披露的指标，会列为尽调索取项，而不是凭记忆补齐。


              投资含义不在于这个主题听起来是否抽象地诱人，而在于现有证据到底证明了多少执行质量、依赖结构和商业耐久性。如果 Sacra 的 ARR 估计方向正确，且公司能在
              OEM、卡车和防务项目之间持续扩张而不出现利润率坍塌，最新私募估值标记可以在乐观情景、甚至基准情景中被合理化。但公开记录仍缺少投资委员会通常需要的拼图，难以有信心地承销一个溢价倍数：经审计的收入质量、毛利率、烧钱速度、优先股堆叠和集中度。因此，建议仍落在继续研究区间：公司依然高度有意思，但价格纪律和尽调闸门应主导最终决定。公开记录不完整的地方，本节会把剩余不确定性说清楚，方便后续章节复用同一事实模式，而不滑向没有支撑的精确度。
