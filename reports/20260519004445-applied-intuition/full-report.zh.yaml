              是参投方而非领投方；之后的老股交易提供的是流动性，而不是新的新股资本。资格结论仍然为正，因为检索到的证据支持公司在请求日期窗口之后有多次超门槛估值事件。公开记录仍不完整处，本节明确留下不确定性，供后续章节复用同一事实模式，而不滑向没有证据支撑的精确化。
