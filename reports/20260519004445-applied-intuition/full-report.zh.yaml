              留存、集中度与披露缺口，放在留存的 2026 年证据集里看，而不是靠单一营销叙事判断。本节的工作假设是：客户承销中最大的弱点不是缺少 logo，而是留存、集中度和重复购买缺少分母数据。已审阅证据中，最强的一组来自
              Applied Intuition
              的官方产品、融资和合作伙伴材料；在可能的地方，再用市场数据、客户证明、监管文件式引用和独立报道补强。分析会区分公司自称事实与第三方报道事实；私有公司未披露的指标，会列为尽调索取项，而不是凭记忆补齐。


