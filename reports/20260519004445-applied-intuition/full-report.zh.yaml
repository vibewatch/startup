  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与经营范围
        blocks:
          - type: paragraph
            body: >-
              身份、使命与经营范围基于留存的 2026 年证据集展开，而不是沿用单一营销叙事。本节工作假设是，Applied Intuition
              应被理解为一家跨垂直领域的车辆智能软件公司，商业核心是企业软件，而不是造车。已审阅的最强证据来自 Applied Intuition
              官方产品、融资和伙伴材料，并在可行处补充市场数据、客户证明、类监管文件资料和独立报道。本分析区分公司自称事实和第三方报道事实；私营公司未披露的指标被列为尽调问题，而不是凭记忆补齐。


              投资含义不在于这个主题抽象上是否好听，而在于现有证据到底能证明多少执行质量、依赖结构和商业耐久性。官方首页、产品页和公司概览都指向同一种经营模式：Applied
              向已经拥有实体机器和部署渠道的客户销售数字基础设施、仿真、Vehicle OS
              和自动驾驶系统软件。这一点重要，因为公司的资本结构、部署风险和毛利率路径，明显不同于自动驾驶出租车运营商或重硬件自动驾驶创业公司。公开证据还支持公司已有明显内部规模，包括 1,000+
              工程师的说法，以及从乘用车延伸到卡车、矿业、建筑、农业和防务的多领域产品叙事。公开记录仍不完整处，本节明确留下不确定性，供后续章节复用同一事实模式，而不滑向没有证据支撑的精确化。
