  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计收入和利润率
        - 没有经审计的当前 ARR、毛利率或烧钱速度披露
        - 溢价估值需要确信经济质量，而不只是客户光环
        - 管理层 / 数据室请求
      - - 股权结构表和优先股堆叠
        - 没有公开的优先权、稀释或分配瀑布细节
        - 高名义估值仍可能让普通股经济性缺乏吸引力
        - 财务团队 / 法律顾问复核
      - - 客户集中度和续约
        - 没有公开头部客户敞口或续约排期
        - 在溢价价格下，持久性比客户标识数量更重要
        - 收入运营和客户成功复核
      - - 模块级经济性
        - 没有证据说明收入分别来自基础设施、OS、自动驾驶或国防产品的比例
        - 业务组合会同时改变利润率画像和可比公司选择
        - 分部 P&L 请求
      - - 国防和政府商业化
        - 公开叙事强于公开合同细节
        - 多元化信用应基于收入和积压订单，而不只是战略
        - 与国防负责人做业务线复核
    notes: 这些问题构成最低尽调包；只有拿到它，公开证据才足以成为投资级估值支撑。
