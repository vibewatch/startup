      - - 反向逻辑：汽车需求周期、自研压力和上市可比公司的波动，可能迅速压缩私募估值。
        - 如果有独立证据证明 ARR 黏性、利润率扩张和客户敞口分散，反向逻辑会缓和。
    notes: 反向逻辑不是否定业务，而是要求价格纪律的主要原因。
