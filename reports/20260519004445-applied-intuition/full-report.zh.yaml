              相关投诉说明，即便案件最终解决，交易流程也可能产生法律成本和尽调拖累。更重要的是，留存证据集留下了重大经营问题：收入集中度、按产品支柱划分的毛利率、现金跑道，以及软件和服务之间的平衡。因此，正确的财务结论是谨慎正面但不完整。Applied
              看起来有融资能力，也有相当商业体量；但投资委员会仍需要内部指标，才能判断公司估值究竟由耐久的单位经济支撑，还是只靠品类热度支撑。公开记录仍不完整处，本节明确留下不确定性，供后续章节复用同一事实模式，而不滑向没有证据支撑的精确化。
