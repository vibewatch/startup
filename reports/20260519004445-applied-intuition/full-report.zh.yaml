              单位经济代理指标与披露不对称基于留存的 2026 年证据集展开，而不是沿用单一营销叙事。本节工作假设是，公开证据支持一个可信的高端企业软件模型，但还没有补全 CAC/LTV 或毛利率故事。已审阅的最强证据来自
              Applied Intuition
              官方产品、融资和伙伴材料，并在可行处补充市场数据、客户证明、类监管文件资料和独立报道。本分析区分公司自称事实和第三方报道事实；私营公司未披露的指标被列为尽调问题，而不是凭记忆补齐。


              投资含义不在于这个主题抽象上是否好听，而在于现有证据到底能证明多少执行质量、依赖结构和商业耐久性。质量线索是有的——多支柱软件产品、企业部署项目，以及第三方 ARR
              估计已经达到有意义规模。但留存公开来源没有披露实际定价、毛利率、CAC、回本周期或续约行为。这里与上市可比公司的反差很重要。Mobileye、Aurora、Luminar、Ouster 和 Ambarella
              处在相邻市场，并按固定节奏提交监管文件；Applied
              仅靠外部材料仍难以投资判断。这种不对称本身不是红旗，但确实是真实的尽调成本。公开记录仍不完整处，本节明确留下不确定性，供后续章节复用同一事实模式，而不滑向没有证据支撑的精确化。
