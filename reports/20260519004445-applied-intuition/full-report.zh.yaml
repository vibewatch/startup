      - number: '8.2'
        title: 公开可比公司背景与文件可见度
        blocks:
          - type: paragraph
            body: >-
              公开可比公司背景与文件可见度，放在留存的 2026 年证据集里看，而不是靠单一营销叙事判断。本节的工作假设是：Applied
              的私募估值标记落在一个方向上有用、但结构上不稳定的公开可比区间内。已审阅证据中，最强的一组来自 Applied Intuition
              的官方产品、融资和合作伙伴材料；在可能的地方，再用市场数据、客户证明、监管文件式引用和独立报道补强。分析会区分公司自称事实与第三方报道事实；私有公司未披露的指标，会列为尽调索取项，而不是凭记忆补齐。


              投资含义不在于这个主题听起来是否抽象地诱人，而在于现有证据到底证明了多少执行质量、依赖结构和商业耐久性。公开可比公司区间很宽：Aurora 的交易估值接近 Applied 最新私募估值，而
              Mobileye、Ouster、Ambarella，尤其是
              Luminar，处在非常不同的水平。这种分散同时告诉投资人两件事。第一，一个价值数十亿美元的自动驾驶或车辆软件股权故事，并非天然荒谬。第二，市场正在非常激进地惩罚较弱商业模式和不稳定执行，这意味着公开可比既有信息价值，也很危险。披露丰富的上市同行，比
              Applied 今天提供了更好的披露参照，但并不能替我们解决私有公司不透明问题。公开记录不完整的地方，本节会把剩余不确定性说清楚，方便后续章节复用同一事实模式，而不滑向没有支撑的精确度。
