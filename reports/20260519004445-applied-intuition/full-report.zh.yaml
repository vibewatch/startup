      - - 私募估值失去支撑
        - 老股或新一轮需求显著低于上一轮估值
        - 表明在披露质量改善前，溢价叙事已经走弱
        - 基于最新清晰估值重新承销
      - - 上市可比公司重估
        - 可比自动驾驶 / SDV 股票大幅下调估值，且公司没有自身证据抵消
        - 压缩对私募溢价倍数的容忍度
