- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitoring, and kill criteria
  body: |-
    Mitigations, monitoring, and kill criteria is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that the right posture is neither alarmist nor complacent: the company has meaningful mitigants, but the residual risk is still investment-relevant because disclosure depth lags strategic breadth. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. Process certifications, public regulatory engagement, a large engineering base, and diversified end markets all count as genuine mitigants. But none of those fully resolves the biggest public uncertainties around concentration, field performance, or defense-program economics. Investors should therefore watch for threshold events rather than abstract narratives: adverse regulatory shifts, weak evidence on concentration, or execution slippage in defense and multi-domain expansion would matter more than another glossy product announcement. The chapter conclusion is that risk is manageable only if diligence can convert process signals into operating proof. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
