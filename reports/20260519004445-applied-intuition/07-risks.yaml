sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: |-
    Regulatory and legal risk is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applieds top public risk signals come from evolving automotive rule frameworks and the reminder that strategic transactions can create disclosure litigation. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. NHTSA, Regulations.gov, Applieds own regulatory commentary, and the Embark-related complaint together show that the company operates in a rule-sensitive environment where validation expectations are not static. That is especially important for a software supplier whose customers depend on type approval, safety validation, and changing NCAP or AEB requirements. The legal issue here is not that Applied faces an existential public lawsuit today; it is that disclosure quality, program release, and policy interpretation can all become board-level risk if the company moves faster than the surrounding compliance infrastructure. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
