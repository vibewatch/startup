- id: government-defense-and-dependency-risk
  title: Government, defense, and dependency risk
  body: |-
    Government, defense, and dependency risk is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that defense expansion may improve diversification, but it also raises the consequence of execution errors and increases diligence demands on procurement, security, and mission assurance. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. Applieds government and defense narrative is strongest around the EpiSci acquisition and TechCrunchs reporting that the company works with government agencies. Those signals are meaningful, but the public visibility into government revenue and contract structure remains thin, as shown by the unusable USAspending recipient page. The investment implication is that defense can help solve auto cyclicality, yet it can also raise the threshold for trust, export-control awareness, and operational reliability. A company that spans trucks, cars, and military autonomy inherits the most demanding aspects of each environment. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
