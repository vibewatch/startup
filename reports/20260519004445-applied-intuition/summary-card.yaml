  topStrengths:
    - >-
      Broad stack breadth across simulation, validation, vehicle platform, ADAS/autonomy, and AI tooling creates a
      deeper embed into OEM workflows than a single-point tool vendor can offer.
    - >-
      Public customer and partner proof spans marquee automotive and commercial names including Toyota/Woven, AISIN,
      Isuzu, Audi, Porsche, and TRATON-linked programs.
    - >-
      Capital access is unusually strong for a private mobility software company: Series E at $6B, a large
      employee-liquidity secondary, and Series F at $15B within roughly fifteen months.
    - >-
      Sacra's estimate of ~$830M ARR in 2025, while unverified, suggests the company may already operate at a scale that
      can support a large software-platform narrative.
    - >-
      The company appears positioned for long-duration software-defined-vehicle and autonomy spending if OEMs keep
      externalizing more of the stack.
  topRisks:
    - >-
      Public disclosure is still inadequate for underwriting a $15B valuation: no retained source provides gross margin,
      burn, cash balance, NRR, or customer concentration.
    - >-
      The latest private valuation is near Aurora's public-market capitalization and above several other public
      ADAS/autonomy peers, leaving limited room for disappointment.
    - >-
      OEM and large-program concentration risk is likely meaningful, but the denominator is undisclosed; major customers
      may also insource parts of the stack over time.
    - >-
      Long automotive procurement, release, and regulatory cycles can delay conversion from marquee logo to durable
      recurring revenue.
    - >-
      The Embark merger litigation record is not thesis-breaking, but it is a reminder that strategic transactions can
      create legal and disclosure friction around a still-opaque company.
  unresolvedGaps:
    - Audited revenue, gross margin, burn, cash, and runway are not publicly disclosed.
    - Customer concentration, renewal behavior, and net revenue retention remain unknown.
    - >-
      The precise primary-versus-secondary split and preference implications of the Series F/tender are not visible in
      retained public evidence.
    - Product-line revenue mix across tools, vehicle platform, and autonomy products is not publicly broken out.
    - >-
      Current board composition, committee structure, and succession planning are only partially visible from public
      sources.
