- id: feature-breadth
  title: Feature breadth, production readiness, and OEM-control narrative
  body: |-
    Feature breadth, production readiness, and OEM-control narrative is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition’s strongest visible differentiation is that it combines validation infrastructure with deployable software and a control-friendly OEM narrative. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The white-box framing matters because it speaks to a specific buyer anxiety: large OEMs do not want to swap one black-box dependency for another. Applied’s retained sources repeatedly emphasize deployable ADAS software, cross-domain platform integration, and ownership-friendly architecture. That breadth is hard for pure-play simulation vendors to match. But it also creates a tougher comparison set, because integrated players such as Mobileye can answer with full-stack credibility of their own. The feature contest is therefore less about who has a simulator and more about who can become part of the customer’s long-term software architecture. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
  claimRefs:
