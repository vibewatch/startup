- id: distribution-lockin
  title: Distribution power, switching cost, and multi-homing
  body: |-
    Distribution power, switching cost, and multi-homing is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that competitive outcomes in this market are shaped as much by workflow embedding and partnership access as by raw product features. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. The retained evidence points to a common pattern: teams can evaluate several vendors in parallel during the early simulation phase, but lock-in rises sharply once the chosen stack touches release workflows, data infrastructure, and vehicle-platform architecture. That means Applied does not need to win every evaluation dimension to build a defensible position; it needs to become expensive to remove after adoption. At the same time, this same pattern empowers incumbents and open-source tools during early evaluation. Distribution, partner leverage, and the exact entry wedge still matter enormously. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
  claimRefs:
  - CP027
  - CP028
  - CP029
  - CP030
  - CP031
  - CP032
  - CP033
  tableRefs:
  - TP004
  figureRefs: []
- id: moat-verdict
  title: Moat durability, commoditization risk, and competitive verdict
  body: |-
    Moat durability, commoditization risk, and competitive verdict is framed through the retained 2026 evidence set rather than through a single marketing narrative. The working thesis in this section is that Applied Intuition’s moat looks real but uneven: broader in enterprise integration and weaker in the most commoditizable simulation layers. The strongest reviewed evidence comes from official Applied Intuition product, funding, and partner materials, supplemented where possible with market data, customer proof, filing-style references, and independent reporting. The analysis separates company-claimed facts from third-party reported facts and treats missing private-company metrics as diligence asks instead of filling them in from memory.

    The investment implication is less about whether the theme sounds attractive in the abstract and more about what the available evidence actually proves about execution quality, dependency structure, and commercial durability. This is the central competitive takeaway from the retained evidence set. Applied has a plausible differentiation story built on breadth, white-box posture, and platform embedding. But no part of the market looks empty. Simulation and synthetic-data messaging is crowded; open source sets a lower bound on experimentation; and public rivals can spend through long development cycles while offering richer disclosure. The moat case is therefore not that competition is light. It is that Applied may be one of the few vendors trying to connect the whole chain from testing to deployed software, and that connection can become valuable if customers standardize around it. Where the public record stays incomplete, the section makes the remaining uncertainty explicit so later chapters can reuse the same fact pattern without drifting into unsupported precision.
  claimRefs:
  - CP034
  - CP035
  - CP036
