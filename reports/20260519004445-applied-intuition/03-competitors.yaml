- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / implication
  - Diligence ask
  rows:
  - - Broad stack breadth
    - Pure-play tools commoditize lower layers
    - High
    - Breadth matters only if customers buy multiple layers together
    - Measure module attach and expansion after first win
  - - White-box OEM-control narrative
    - Integrated public rivals may still win on maturity and trust
    - High
    - Control story is strongest where OEMs resist black-box lock-in
    - Request win-loss data against bundled stacks
  - - Workflow embedding and switching cost
    - Multi-homing remains possible during evaluation
    - Medium
    - Need proof that pilots convert into standardization
    - Review pilot-to-production conversion metrics
  - - Partner ecosystem leverage
    - Partners can also become stronger independent alternatives
    - Medium
    - Coopetition must still preserve software ownership for Applied
    - Map dependency and revenue share by partner
  - - Developer credibility
    - Open-source alternatives attract experimentation mindshare
    - Medium
    - Public repos help but do not equal open platform leadership
    - Assess hiring and developer-adoption pull
  - - Public-capital rivals face transparency advantage
    - Private-company opacity can hurt buyer trust and investor underwriting
    - Medium
    - Applied needs stronger evidence on production readiness and customer outcomes
    - Request audited customer-case metrics and roadmap proof
  notes: Risk severity reflects the retained public evidence, not management-only internal metrics.
