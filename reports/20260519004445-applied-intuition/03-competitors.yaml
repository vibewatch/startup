  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-loss evidence
    missingEvidence: Named wins and losses against Cognata, Foretellix, CarMaker, Mobileye, and internal build.
    whyItMatters: The retained public record shows crowding, but not Applied’s real competitive conversion rate.
    diligencePath: Request CRM win-loss data and RFP outcome summaries.
    relatedQuestionRefs:
    - QP022
  - type: private-evidence-only
    severity: material
    topic: pricing and packaging
    missingEvidence: Actual price cards, minimum contract sizes, and deployment phasing by competitor.
    whyItMatters: Feature breadth alone cannot explain why buyers choose one stack over another.
    diligencePath: Request deal sheets and procurement comparisons from recent evaluations.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: medium
    topic: switching cost proof
    missingEvidence: Module attach, retention, and platform-standardization evidence after first deployment.
    whyItMatters: The moat case depends on embedding, not only on product breadth.
    diligencePath: Review customer expansion cohorts and churn by product line.
    relatedQuestionRefs:
    - QP024
  - type: missing-corroboration
    severity: medium
    topic: competitive readiness vs public rivals
    missingEvidence: Comparable evidence on production deployments, pricing, and roadmap against Mobileye and Aurora.
    whyItMatters: Public-rival scale can matter more than technical messaging in enterprise buying cycles.
    diligencePath: Benchmark Applied against public-comp filings, customer wins, and deployment counts.
