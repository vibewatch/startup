      - number: '4.4'
        title: Financial Diligence Verdict, Secondary Liquidity, and Risk Assessment
        blocks:
          - type: paragraph
            body: >-
              From an underwriting perspective, MiRus presents an exceptional corporate partnership profile coupled with
              acute private financial reporting opacity. The implied $4.4 billion valuation is primarily supported by
              strategic validation from Boston Scientific rather than audited public commercial revenue fundamentals.
              Because MiRus operates as a closely held private enterprise, it does not publish audited income
              statements, annual revenue run-rates, or product-specific gross margins. Independent secondary trading
              platforms such as Forge Global report limited secondary liquidity with no established transaction price
              history, preventing independent mark-to-market pricing or near-term equity exits for minority
              shareholders. Consequently, an investment decision cannot rely on historical cash flow metrics or
              established EBITDA multiples. Institutional underwriters must treat clinical milestone attainment in the
              STAR trial and Boston Scientific's eventual option exercise as the primary economic return drivers,
              demanding deep diligence access to proprietary manufacturing COGS and confidential transaction terms.
            claimRefs:
              - CI002
              - CI008
              - CI009
              - CI014
              - CI015
