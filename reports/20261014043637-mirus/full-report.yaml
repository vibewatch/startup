      - number: '7.3'
        title: Strategic Partner Dependencies and Commercialization Concentration
        blocks:
          - type: paragraph
            body: >-
              MiRus's strategic capitalization and exit architecture are overwhelmingly concentrated in a single
              corporate partner: Boston Scientific Corporation. In May 2026, Boston Scientific executed a $1.5 billion
              strategic investment in exchange for an approximate 34% equity stake in MiRus, establishing a post-money
              valuation of $4.4 billion. Critically, the investment agreement grants Boston Scientific an exclusive
              option to acquire the entire MiRus TAVR business for an additional $3.0 billion in aggregate cash payments
              upon the achievement of specified clinical and regulatory milestones. If exercised, MiRus retains future
              earnout rights based on net sales of the SIEGEL valve, and Boston Scientific secures a further exclusive
              option to acquire mitral and tricuspid replacement valve assets. While this structure validates the SIEGEL
              platform, it concentrates corporate destiny into a single strategic counterparty. If STAR trial results
              exhibit delayed enrollment velocity or adverse clinical signals, Boston Scientific retains unilateral
              discretion to let the option lapse, leaving MiRus with significant clinical burn, a stalled transaction,
              and limited alternative strategic acquirers in structural heart. Outside of cardiovascular assets,
              commercial spine operations lack public revenue disclosures, making it uncertain whether commercial
              orthopedic sales can sustain operational overhead independently.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR011
              - CR014
