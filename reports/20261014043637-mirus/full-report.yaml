      - number: '5.4'
        title: Clinical Maturity, Operating Model, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              MiRus's operating model combines in-house precision metallurgical manufacturing with clinical trial
              sponsorship and strategic corporate collaboration. Commercial distribution of spine and extremity implants
              provides ongoing cash flow and clinical validation, but the company's valuation upside is tied directly to
              the clinical progress of the SIEGEL TAVR system. In 2026, MiRus initiated the STAR pivotal trial, a
              prospective multicenter randomized controlled study evaluating safety and effectiveness in up to 1,025
              patients across surgical risk profiles. Boston Scientific's $1.5 billion minority investment and $3
              billion exclusive acquisition option establish strong corporate validation, yet significant technical and
              regulatory risks remain. The SIEGEL valve is an investigational device without commercial clearance in any
              jurisdiction. Transcatheter biological valves face inherent risks of long-term structural valve
              deterioration, calcific stiffening, paravalvular regurgitation, and thrombosis that require rigorous
              multi-year clinical endpoint verification before premarket approval can be achieved.
            claimRefs:
              - CE012
              - CE013
              - CE014
