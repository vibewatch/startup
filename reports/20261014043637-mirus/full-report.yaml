      - number: '8.2'
        title: Scenario Modeling, Downside Triggers, and Public-Private Comparables
        blocks:
          - type: paragraph
            body: >-
              Evaluating MiRus' $4.4 billion valuation requires decomposing the corporate structure into its
              cardiovascular call option and its commercial spine-biomaterials foundation. In a bull case, the STAR
              pivotal trial meets non-inferiority or superiority endpoints across its 1,025-patient cohort, triggering
              Boston Scientific's $3 billion cash option exercise alongside commercial expansion of the EUROPA posterior
              cervical system, yielding high returns and net sales royalties. In the base case, pivotal trial execution
              proceeds on an extended timeline, delaying the option decision and requiring bridge financing, while spine
              revenue growth remains constrained by hospital purchasing dynamics. In a bear case, clinical setbacks in
              the STAR trial or cardiovascular adverse events prompt Boston Scientific to abandon its acquisition
              option, stranding equity holders in a standalone biomaterials firm whose spine revenue cannot support
              multi-billion-dollar valuation multiples. Comparable transactions demonstrate that large medtech
              strategics are divesting or deprioritizing conventional spine hardware—evidenced by Zimmer Biomet spinning
              off ZimVie, Stryker selling U.S. spinal implants to VB Spine, and Johnson & Johnson separating DePuy
              Synthes—placing immense pressure on MiRus to prove that MoRe alloy commands genuine pricing power rather
              than commoditized hardware economics.
            claimRefs:
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
