    title: Clinical Workflow and Use-Case Comparison
    columns:
      - Clinical Procedure
      - Standard Clinical Workflow
      - MiRus Solution
      - Measurable Clinical Benefit
      - Workflow Limitation
    rows:
      - - Transfemoral TAVR Delivery
        - 14-Fr to 16-Fr large-bore sheath delivery with crimped valves and high risk of vascular injury
        - SIEGEL 8-Fr expandable sheath delivery with pre-mounted valve on balloon
        - Approximately 50% smaller sheath cross-section reducing vascular trauma and access complications
        - Requires procedural familiarity with balloon expansion protocol and novel frame dynamics
      - - Complex Cervical Spine Reconstruction
        - Bulky 3.5 mm to 4.0 mm titanium rods requiring extensive tissue retraction and prominent hardware profile
        - EUROPA PCF system utilizing 2.9 mm high-strength MoRe rods
        - Significantly reduced hardware prominence and lower tissue dissection in small anatomy
        - Surgeons must adapt to tighter screw tulip tolerances and rigid rod bending behavior
      - - Adult Spinal Deformity Fusion
        - Long thoracolumbar construct with high lifetime risk of titanium rod fatigue fracture and revision surgery
        - MoRe superalloy rod construct backed by lifetime replacement warranty
        - Superior fatigue endurance and elimination of patient/hospital rod fracture replacement cost
        - High initial implant acquisition cost relative to commoditized titanium hardware
      - - Foot and Ankle Evans Osteotomy
        - Static structural bone grafts or fixed spacers with imprecise intraoperative mechanical correction
        - IO Expandable Wedge Osteotomy System with MoRe Expansion Engine
        - Precise intraoperative titratable wedge expansion to match anatomy
        - Requires dedicated insertion tooling and surgeon learning curve for expansion mechanism
    notes: >-
      Workflow benefits derived from manufacturer specifications and comparative clinical publications; vascular injury
      reduction subject to ongoing STAR trial validation.
