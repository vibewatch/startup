            title: Bifurcated Business Model Couples Commercial Cash Flow with Binary TAVR Option
            body: >-
              MiRus' financial structure combines an operating commercial spine hardware business with a massive binary
              strategic asset in the SIEGEL TAVR program. The $1.5 billion investment by Boston Scientific effectively
              funds pivotal trial development while locking in exclusive acquisition rights, shifting late-stage
              clinical financing risk away from balance-sheet cash reserves.
