  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Clinical Portfolio
        blocks:
          - type: paragraph
            body: >-
              MiRus defines its clinical product portfolio around high-performance implantable medical devices that
              replace conventional titanium and cobalt-chromium alloys with its proprietary MoRe molybdenum-rhenium
              superalloy. The company's commercialized portfolio is organized into specialized surgical systems spanning
              spine reconstruction, interbody fusion, and extremity deformity correction. Within spine surgery, the
              EUROPA Posterior Cervical Fusion system utilizes a 2.9 mm MoRe rod that substantially reduces hardware
              prominence compared to standard commercial constructs while maintaining structural rigidity. Complementing
              posterior instrumentation, the Cygnus MoRe anterior cervical plate and 3DR lateral lumbar interbody fusion
              systems provide low-profile fixation with 510(k) regulatory clearance. In extremities, MiRus
              commercializes the IO Expandable Wedge Osteotomy System, which incorporates the proprietary MoRe Expansion
              Engine to provide titratable intraoperative correction during Evans foot and ankle osteotomies. Across
              each application, MiRus positions its product line as premium hardware designed to reduce anatomical
              disruption and minimize revision surgical intervention.
            claimRefs:
              - CE001
