      - number: '4.3'
        title: Capital Adequacy, Strategic Investment, and Corporate Option
        blocks:
          - type: paragraph
            body: >-
              MiRus fundamentally reshaped its balance sheet and forward capital adequacy in May 2026 by securing a $1.5
              billion strategic equity investment from Boston Scientific. The transaction represents one of the largest
              private medtech financing transactions recorded in 2026, granting Boston Scientific an approximate 34%
              equity interest and establishing an implied post-money enterprise valuation of $4.4 billion. Prior to this
              corporate round, MiRus had raised approximately $65 million in disclosed venture financing in 2021,
              bringing cumulative historical funding to $1.56 billion. The substantial capital influx provides
              multi-year operating runway that effectively insulates the company from near-term private venture market
              volatility. Furthermore, Boston Scientific publicly disclosed that the transaction is anticipated to be
              immaterial to its 2026 adjusted earnings per share, reflecting an accounting structure where developmental
              risk is segregated. This capital base comprehensively finances pivotal clinical execution for the STAR
              trial while eliminating immediate debt refinancing pressures.
