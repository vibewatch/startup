  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Dynamics
        blocks:
          - type: paragraph
            body: >-
              MiRus addresses two distinct medical customer segments characterized by fundamentally different
              procurement dynamics and clinical buyer profiles. In its commercial-stage spine business, the primary
              clinical decision-makers are orthopedic spine surgeons and neurosurgeons performing cervical, lumbar, and
              complex deformity procedures across inpatient hospitals and ambulatory surgery centers. Purchasing
              authority, however, resides with hospital value analysis committees (VACs), group purchasing organizations
              (GPOs), and integrated delivery networks (IDNs). To establish commercial access, MiRus has secured
              distribution contracts across regional and national health systems. In structural heart disease, the
              customer dynamic centers on academic medical centers and cardiac catheterization laboratories evaluating
              the investigational Siegel 8-Fr balloon-expandable TAVR platform. Unlike spine hardware sold directly
              through hospital purchasing channels, MiRus's structural heart commercialization pathway is structurally
              anchored to Boston Scientific Corporation, which holds an exclusive option to acquire the TAVR asset.
            claimRefs:
