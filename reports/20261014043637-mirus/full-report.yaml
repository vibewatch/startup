      - number: '5.3'
        title: SIEGEL TAVR Architecture and Delivery Differentiation
        blocks:
          - type: paragraph
            body: >-
              MiRus's most strategically valuable development pipeline asset is the SIEGEL Balloon Expandable
              Transcatheter Aortic Valve Replacement (TAVR) system, designed for treating severe symptomatic aortic
              valve stenosis. Unlike legacy balloon-expandable valves that rely on cobalt-chromium frames, the SIEGEL
              valve incorporates a nitric oxide-coated rhenium frame with radial strength exceeding that of both cobalt
              and titanium alloys. This increased material strength allows for thinner frame struts while preserving
              radial expansion force, eliminating foreshortening during deployment, and facilitating precise anatomical
              alignment at the aortic annulus. Furthermore, the prosthesis uses dry porcine pericardial tissue leaflets
              and comes pre-mounted directly onto the delivery balloon. Uniquely, all three clinical valve diameters (23
              mm, 26 mm, and 29 mm) are delivered through an 8 French expandable sheath. Because standard commercial
              TAVR delivery sheaths require 14 to 16 French access profiles, the SIEGEL sheath is approximately 50
              percent smaller in cross-section, significantly reducing transfemoral vascular injury and access-site
              bleeding complications.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
