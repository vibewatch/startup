chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Leadership
        blocks:
          - type: paragraph
            body: >-
              MiRus is a private medical technology firm founded in 2015 and headquartered in Marietta, Georgia. The
              company was established to develop and commercialize medical implants and procedural solutions powered by
              its proprietary molybdenum-rhenium (MoRe) superalloy technology. This advanced metallic platform delivers
              superior fatigue resistance, biofriendliness, and mechanical strength compared to conventional titanium or
              cobalt-chromium alloys, allowing the firm to manufacture dramatically thinner and narrower orthopedic and
              spinal implants. The organization is led by founder and chief executive officer Dr. Jay Yadav, a prominent
              cardiologist and serial medtech entrepreneur with a track record of founding disruptive medical device
              ventures. Management includes experienced regulatory leaders such as Jordan Bauman, Vice President of
              Regulatory and Quality, who directs pivotal clinical submissions and FDA interactions. Due to Dr. Yadav's
              central role as scientific visionary, inventor, and corporate leader, MiRus exhibits notable key-person
              dependence, while disclosures regarding the broader operational executive roster and board governance
              remain private.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO009
      - number: '1.2'
        title: Capitalization, Strategic Investment, and Valuation Structure
        blocks:
          - type: paragraph
            body: >-
              In May 2026, Boston Scientific Corporation executed a transformative $1.5 billion equity investment in
              MiRus LLC in exchange for an approximate 34% equity stake. This strategic transaction established an
              implied post-money corporate valuation of roughly $4.4 billion, placing MiRus among the most highly valued
              private medical device developers globally. Under the investment agreement, Boston Scientific also secured
              an exclusive option to acquire 100% of the MiRus TAVR business for additional aggregate cash payments
              totaling $3.0 billion upon milestone achievement, alongside potential future net sales royalties and
              options over mitral and tricuspid valve assets. This transaction followed a prior $65 million financing
              round in July 2021 led by Mammoth Scientific at an estimated $260 million valuation. Despite this headline
              corporate valuation, secondary private equity trading tracked by Forge Global shows limited trading
              activity and no established matched pricing, indicating that equity value is heavily driven by Boston
              Scientific's strategic commitment rather than liquid secondary market consensus.
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO013
      - number: '1.3'
        title: Product Portfolio, Regulatory Trajectory, and Clinical Milestones
        blocks:
          - type: paragraph
            body: >-
              MiRus maintains a dual-track commercial and clinical portfolio addressing cardiovascular diseases and
              complex spinal disorders. The firm's flagship cardiovascular asset is the SIEGEL Balloon Expandable
              Transcatheter Aortic Valve Replacement (TAVR) system, a novel nickel-free valve featuring dry porcine
              leaflets and a nitric oxide-coated rhenium frame delivered via an ultra-low-profile 8 French expandable
              sheath. In April 2026, MiRus initiated patient enrollment in the prospective, randomized STAR pivotal
              trial evaluating the SIEGEL valve across up to 1,025 patients with severe aortic stenosis. Simultaneously,
              the company has built commercial traction across its MoRe orthopedic portfolio: the FDA granted
              Breakthrough Device Designation for the EUROPA Posterior Cervical System in July 2024, followed by CMS New
              Technology Add-on Payment (NTAP) reimbursement approval in August 2025. In February 2026, MiRus secured
              FDA 510(k) clearance and commercially launched the IO Expandable Wedge Osteotomy System for foot and ankle
              procedures, demonstrating sustained cadence across both its commercial orthopedic business and
              investigational interventional cardiology pipeline.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
