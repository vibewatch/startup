        title: Named Institutional Customer Proof and Clinical Trials
        blocks:
          - type: paragraph
            body: >-
              Publicly verified customer proof for MiRus is concentrated in high-visibility clinical trial institutions
              and strategic industry relationships. In structural heart, initial clinical deployments of the Siegel 8-Fr
              TAVR valve were executed at Piedmont Heart Institute in Atlanta under the leadership of Dr. Pradeep K.
              Yadav and Dr. Vinod H. Thourani, who treated the first sequential patients in both the Early Feasibility
              Study and the STAR pivotal randomized trial. Additional investigator proof emerged at Cedars-Sinai Heart
