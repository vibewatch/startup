      - number: '6.4'
        title: Surgeon Workflow, Procurement Friction, and Retention Diligence
        blocks:
          - type: paragraph
            body: >-
              The customer adoption journey for MiRus implants requires navigating significant procurement and risk
              barriers inherent in hospital medical device purchasing. Value analysis committees frequently resist
              adding new spinal implant vendors unless clinical data or mechanical performance demonstrates clear
              superiority over incumbent titanium and cobalt-chromium systems. Industry rates of spine implant breakage
              and revision surgery remain a persistent clinical and financial concern for hospitals. MiRus mitigates
              surgeon and hospital purchasing hesitation through the MoRe Promise, a commercial warranty pledging to
              cover the cost of all revision implants if a MoRe rod fractures. However, private secondary trading
              markets and regulatory filings disclose no audited data on hospital reorder frequency, net revenue
              retention (NRR), or account-level churn. While surgeon feedback on the low-profile 2.9 mm rod diameter and
              8-Fr TAVR delivery sheath is favorable, customer durability metrics across established orthopedic cohorts
              remain a central diligence gap.
