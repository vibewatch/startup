            title: 'Capital Allocation Stance: Research-More at Headline Valuation'
            body: >-
              While Boston Scientific's $1.5 billion investment provides extraordinary institutional validation,
              underwriting MiRus at a $4.4 billion headline valuation requires accepting unhedged binary clinical risk
              in the STAR trial and unverified private operating margins in spine. Investors should withhold direct
              equity commitments until pivotal trial interim safety and audited financials are available.
