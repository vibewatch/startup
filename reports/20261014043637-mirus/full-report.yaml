      - number: '4.2'
        title: Pricing Strategy, Unit Economics, and Margin Drivers
        blocks:
          - type: paragraph
            body: >-
              Monetization in MiRus' commercial spine segment is driven by hospital DRG reimbursement schedules, private
              facility contracts, and specialized add-on payment mechanisms rather than standard retail price lists.
              Because MiRus manufactures implants from a proprietary MoRe superalloy requiring specialized vacuum
              melting and precision machining, unit production costs are substantially higher than conventional titanium
              constructs. However, these elevated manufacturing expenses are commercially offset by superior material
              strength, lower revision rates, and premium procedural positioning, which justify favorable contracting
              terms with surgical centers. Commercial adoption is supported by a dedicated commercial and operational
              workforce of approximately 130 to 134 employees, balancing direct surgical specialists and independent
              distributor networks. Meanwhile, the MoRe Promise warranty program guarantees lifetime replacement of rods
              and associated pedicle screw hardware in the event of mechanical fracture, creating an embedded warranty
              liability that requires disciplined balance-sheet reserve provisioning. Unit margins on commercial spine
              hardware remain shielded from public disclosure, making direct contribution margin analysis dependent on
              private channel audits.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI010
              - CI014
              - CI015
