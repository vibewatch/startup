      - number: '6.2'
        title: Clinical Adoption Trajectory and Evidence Milestones
        blocks:
          - type: paragraph
            body: >-
              Because MiRus operates as a private life sciences entity, commercial account volumes, annual surgical case
              counts, and line-item implant revenues are not publicly disclosed. Adoption trajectory must therefore be
              tracked through regulatory milestones, portfolio clearances, and clinical trial expansion cadence. In
              spine, commercial adoption has progressed through a sequence of 510(k) clearances and FDA Breakthrough
              Device Designations for MoRe-based implants, including the Europa posterior cervical system and Cygnus
              anterior cervical plates. Reimbursement adoption was strengthened in August 2025 when CMS granted a New
              Technology Add-on Payment (NTAP) for Europa, providing incremental Medicare payment to hospitals for
              cervicothoracic procedures. In February 2026, MiRus extended its orthopedic customer reach into foot and
              ankle surgery via the commercial launch of the IO Expandable Wedge Osteotomy System. For the structural
              heart platform, adoption has shifted from initial Early Feasibility Study cases into the active STAR
              pivotal randomized controlled trial targeting up to 1,025 patients across surgical risk profiles.
