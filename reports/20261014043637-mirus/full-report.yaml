  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Pathway and Clinical Trial Execution Risks
        blocks:
          - type: paragraph
            body: >-
              MiRus operates across two starkly divergent regulatory paradigms that define its technical and commercial
              risk profile. In spine and orthopedics, the company has established substantial regulatory validation,
              securing FDA 510(k) clearance K220441 for its CYGNUS MoRe Anterior Cervical Plate System as a Class II
              intervertebral body fixation orthosis manufactured from proprietary wrought molybdenum-47.5 rhenium alloy
              per ASTM F3273. It has further secured Breakthrough Device Designation for the EUROPA posterior cervical
              system, which leverages a 2.9 mm MoRe rod to reduce surgical profile and hardware prominence. Conversely,
              the company's valuation anchor—the SIEGEL balloon-expandable transcatheter aortic valve replacement (TAVR)
              system—remains an investigational device without commercial approval or premarket approval (PMA) clearance
              in any global jurisdiction. To address this hurdle, MiRus initiated the prospective, multicenter,
              randomized controlled STAR pivotal trial designed to evaluate the safety and effectiveness of the SIEGEL
              valve across three sizes in up to 1,025 patients spanning low, intermediate, and high surgical
              complication risk cohorts. While early feasibility study data demonstrated favorable hemodynamics and
              delivery through a low-profile 8 French sheath, transitioning to a pivotal 1,025-patient trial exposes
              investors to severe binary clinical risks, including structural valve deterioration, leaflet thrombosis,
              conduction abnormalities, and endpoint underperformance relative to established commercial benchmarks.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
