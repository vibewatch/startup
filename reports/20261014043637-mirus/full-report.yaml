      - number: '7.2'
        title: Operational Scalability and Manufacturing Quality Exposures
        blocks:
          - type: paragraph
            body: >-
              Translating proprietary material science into commercial implant production introduces acute operational
              and clinical concentration bottlenecks. Initial patient enrollment and clinical procedures for the STAR
              pivotal trial commenced at the Piedmont Heart Institute in Atlanta under principal investigator
              leadership. Heavy reliance on a single regional cardiovascular institution for early enrollment velocity
              creates severe execution vulnerability if institutional review board delays, protocol adjustments, or
              investigator turnover occur before multicenter site onboarding accelerates. Concurrently, MiRus maintains
              an estimated headcount of approximately 130 employees according to Dealroom private market tracking,
              representing a lean operational base that must simultaneously manufacture complex MoRe-alloy orthopedic
              instrumentation and support large-scale cardiovascular clinical trial monitoring. Beyond clinical
              staffing, specialized fabrication of molybdenum-rhenium alloy components requires tightly controlled
              vacuum melting, powder metallurgy, and precision toll-processing under strict ASTM F3273 specifications.
              Any disruption in specialized rhenium supply, raw material price escalation, or lot-to-lot tolerances in
              the pre-mounted balloon and expandable sheath assembly could stall trial supply. Furthermore, recent
              cybersecurity disruptions across large-cap medtech peers—highlighted by Stryker's 2026 enterprise system
              compromise wiping data across 200,000 systems—underscore the vulnerability of interconnected medical
              device supply chains and clinical data repositories to external operational shocks.
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
