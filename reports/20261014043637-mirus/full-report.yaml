  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Strategic Financing Structure
        blocks:
          - type: paragraph
            body: >-
              MiRus presents an extraordinary strategic financing structure for a private medical technology business,
              marked by Boston Scientific Corporation's announcement on May 18, 2026, of a $1.5 billion investment for
              an approximate 34% equity stake. This transaction implicitly prices the Marietta, Georgia-based company at
              approximately $4.4 billion on a post-money basis. In addition to the direct equity purchase, the agreement
              grants Boston Scientific an exclusive option to acquire the MiRus transcatheter aortic valve replacement
              (TAVR) system for an additional $3 billion in cash, subject to clinical and regulatory milestones. If
              exercised, Boston Scientific secures 100% ownership of the TAVR business, MiRus retains rights to
              sales-based earnout payments on the SIEGEL valve, and Boston Scientific holds a follow-on option to
              purchase mitral and tricuspid valve assets. The central investment thesis rests on MiRus' proprietary
              molybdenum-rhenium superalloy (MoRe), which enables radical device miniaturization, including the 8 French
              SIEGEL TAVR delivery sheath and fracture-resistant spinal implants. However, the anti-thesis highlights
              that the current $4.4 billion valuation relies almost entirely on the speculative success of an unapproved
              cardiovascular asset in pivotal testing, while private financial statements, standalone commercial
              revenue, and gross margins for the commercialized orthopedic business remain opaque.
            claimRefs:
