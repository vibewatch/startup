      - number: '5.2'
        title: Material Science and the MoRe Superalloy Platform
        blocks:
          - type: paragraph
            body: >-
              The foundation of MiRus's intellectual property and clinical differentiation is the MoRe
              molybdenum-rhenium superalloy, developed over fifteen years of materials science research inspired by
              high-temperature refractory metallurgy in aerospace propulsion. Medical-grade titanium and cobalt-chromium
              alloys face known biomechanical trade-offs between tensile strength, fatigue endurance, and biological
              inertness; repetitive physiological loading frequently causes rod notch sensitivity, hardware fatigue
              fracture, or local metallosis from ionic release. In contrast, the MoRe alloy demonstrates markedly higher
              fatigue strength, greater ductility, and lower metal-ion dissolution in surrounding tissue. To underscore
              the material's mechanical reliability in spine fusion, MiRus provides the MoRe Promise, a lifetime limited
              warranty program covering replacement MoRe rods and all associated EUROPA pedicle screw implant components
              if revision surgery is necessitated by rod fracture. This warranty represents an uncommon manufacturer
              guarantee in the orthopedic implant sector, reflecting high material confidence.
            claimRefs:
              - CE002
              - CE003
          - type: figure
            figureRef: FE001
            claimRefs:
