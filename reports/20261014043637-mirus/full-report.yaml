      - number: '1.4'
        title: Operational Scale, Secondary Markets, and Diligence Realities
        blocks:
          - type: paragraph
            body: >-
              Operating primarily from its corporate facilities in Marietta, Georgia, MiRus maintains an estimated
              operational headcount of approximately 130 employees with modest 2.4% annual workforce growth. This lean
              organizational footprint suggests that extensive clinical trial execution, including the multicenter STAR
              trial, is conducted through partner clinical institutions such as Piedmont Heart Institute rather than a
              massive internal administrative apparatus. However, prospective diligence must navigate substantial
              information opacity. As an unlisted private company, MiRus does not disclose revenue run-rates, gross
              margin profiles, or unit shipment volumes for its commercialized spine and osteotomy products.
              Furthermore, non-controlling equity holders face severe illiquidity: Forge Global reports an absence of
              matched trades, meaning minority stakes cannot be marked to liquid secondary benchmarks. Diligence must
              establish whether the orthopedic commercial operations are self-sustaining or reliant on corporate
              funding, while recognizing that realization of the headline valuation hinges entirely on the clinical
              success of the STAR pivotal trial and Boston Scientific's subsequent option exercise.
            claimRefs:
              - CO012
              - CO013
              - CO014
