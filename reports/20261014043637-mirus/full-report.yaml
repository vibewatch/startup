      - number: '8.3'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              MiRus' path to liquidity is structurally intertwined with Boston Scientific's contractual call option,
              which establishes a predetermined acquisition route for the cardiovascular business while leaving the
              ultimate disposition of the spine and biomaterials franchise ambiguous. A recommendation of research-more
              with a stretched valuation stance reflects this structural bifurcation: public investors and secondary
              market participants cannot verify the underlying cap-table terms, liquidation preference waterfall, or
              minority shareholder protections negotiated alongside the $1.5 billion round. Secondary trading
              indications on private platforms such as Forge Global exhibit limited activity with unpriced bids and
              asks, preventing market-driven price discovery. Pre-investment diligence must prioritize four critical
              areas: first, obtaining verified enrollment cadence, site activation data, and adverse event logs from the
              STAR randomized trial; second, auditing private revenue, product-level gross margins, and customer
              concentration across the MoRe spine implant catalog; third, reviewing the exact contractual milestones
              governing Boston Scientific's $3 billion option; and fourth, monitoring thesis-break triggers including
              clinical trial halts, primary endpoint failure, or down-round recapitalizations.
            claimRefs:
              - CV012
              - CV014
              - CV015
              - CV016
