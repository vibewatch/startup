              - CR011
      - number: '7.4'
        title: Financial Opacity, Secondary Illiquidity, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Private market ownership dynamics present pronounced illiquidity and valuation realization risks for
              non-strategic equity holders. Secondary trading data from Forge Global reveals limited private market
              activity with no published Forge Price, reflecting thin transactional volume and significant bid-ask
              spreads for private MiRus shares. Because Boston Scientific's $3.0 billion acquisition option caps the
              terminal valuation of the TAVR asset, equity co-investors bear asymmetric downside risk without unbounded
              upside participation. Furthermore, private corporate reporting provides no audited disclosures regarding
              orthopedic revenue run rates, product-line gross margins, research-and-development cash burn, or available
              runway. If Boston Scientific exercises its option, the transaction splits the high-growth cardiovascular
              franchise from the residual orthopedic implant business, forcing investors to evaluate a standalone spine
              operation without verified public financial statements. Key thesis-break triggers that warrant immediate
              diligence escalation include: (1) STAR trial enrollment velocity dropping below projected multi-center
              milestones or encountering unpredicted stroke/death adverse events, (2) formal communication from Boston
              Scientific indicating hesitation or renegotiation regarding the $3.0 billion option terms, (3) supply
              chain bottlenecks in ASTM F3273 rhenium alloy procurement, and (4) secondary equity discounts widening
              beyond private-market peer medtech marks.
            claimRefs:
              - CR006
