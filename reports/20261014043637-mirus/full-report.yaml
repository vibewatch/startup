  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market Boundaries and Scope: Cardiovascular TAVR and Orthopedic Spine'
        blocks:
          - type: paragraph
            body: >-
              MiRus occupies an unusual dual-sector position within the medical technology landscape, operating
              simultaneously in high-growth interventional cardiology and specialized orthopedic spine surgery. The
              commercial boundaries of these two segments differ fundamentally in capital intensity, regulatory pathway,
              and clinical adoption velocity. In cardiovascular disease, MiRus focuses strictly on transcatheter aortic
              valve replacement (TAVR) for severe aortic stenosis through its proprietary SIEGEL balloon-expandable
              valve system, deliberately excluding surgical valve replacement (SAVR) and broad cardiac diagnostics. In
              orthopedic surgery, the company confines its commercial scope to spinal instrumentation, notably the
              Europa posterior cervical fixation system, Cygnus anterior cervical plates, and 3DR lateral lumbar
              interbody fusion platforms. Both segments are anchored in MiRus's proprietary molybdenum-rhenium (MoRe)
              superalloy technology, which provides superior tensile strength and fatigue resistance compared to
              traditional titanium and cobalt chromium alloys. Strategic corporate backing from Boston Scientific
              Corporation validates this biomaterial platform across both clinical domains while maintaining clear
              procedural boundaries.
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
              - CM010
      - number: '2.2'
        title: 'Addressable Market Sizing: Global TAVR and Spinal Fixation Lenses'
        blocks:
          - type: paragraph
            body: >-
              Sizing MiRus's addressable opportunity requires separating global macro-market expenditure from
              clinical-indication filters and transaction-backed valuation reality. The global transcatheter aortic
              valve replacement market represents a $7.0 billion to $10.0 billion total addressable market (TAM)
              expanding at an estimated 10% to 13% compound annual growth rate, fueled by demographic aging and
              guideline expansion toward lower-risk patient populations. Within this macro TAM, the addressable
              serviceable market (SAM) for balloon-expandable valves in severe symptomatic aortic stenosis is
              approximately $3.0 billion to $4.5 billion, which MiRus targets directly through its multi-center STAR
              pivotal trial across up to 1,025 enrolled patients. Concurrently, the global spinal fusion and fixation
              hardware market provides an established $10.0 billion to $14.0 billion TAM; however, MiRus addresses a
              specialized $500 million to $1.2 billion serviceable niche focused on complex cervical deformity, revision
              surgeries, and low-profile fixation. Rather than relying on unconstrained top-down estimates, Boston
              Scientific's $1.5 billion investment for a 34% equity stake establishes a calibrated $4.4 billion private
              market valuation benchmark, supplemented by a structured $3 billion acquisition option tied strictly to
              TAVR milestones.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM012
