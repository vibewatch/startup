company:
  name: MiRus
chapter:
  number: 4
  title: Financials
  summary: MiRus couples commercial revenue from proprietary MoRe-alloy spine implants with a transformative $1.5 billion strategic investment from Boston Scientific that values the business at $4.4 billion while securing exclusive acquisition option rights over its investigational SIEGEL TAVR system.
sections:
  - id: commercial-revenue-architecture-and-monetization-models
    title: Commercial Revenue Architecture and Monetization Models
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI007
      - CI011
    tableRefs:
      - TI001
    figureRefs: []
    body: MiRus operates a bifurcated commercial and developmental revenue model centered on its proprietary molybdenum-rhenium (MoRe) alloy platform. In the orthopedic and spine division, the company generates commercial hardware revenue through institutional sales to hospitals, health systems, and ambulatory surgical centers. The commercial portfolio includes the EUROPA Posterior Cervical Fusion System, which secured FDA Breakthrough Device Designation and supplemental Medicare reimbursement via CMS New Technology Add-on Payments, alongside cleared lumbar plating and osteotomy systems. In parallel, MiRus' cardiovascular franchise centers on the investigational SIEGEL balloon-expandable transcatheter aortic valve replacement system, which commenced patient enrollment in the prospective multicenter STAR randomized controlled trial in April 2026. Commercialization for SIEGEL is structured through an exclusive strategic partnership with Boston Scientific, which committed $1.5 billion in strategic equity while securing exclusive milestone-dependent option rights to acquire the TAVR program. This arrangement bifurcates MiRus' financial profile between steady procedural implant revenue and lumpy milestone capital, supported by the MoRe Promise lifetime warranty program that covers revision hardware costs.
  - id: pricing-strategy-unit-economics-and-margin-drivers
    title: Pricing Strategy, Unit Economics, and Margin Drivers
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI010
      - CI014
      - CI015
    tableRefs:
      - TI002
    figureRefs:
      - FI001
    body: Monetization in MiRus' commercial spine segment is driven by hospital DRG reimbursement schedules, private facility contracts, and specialized add-on payment mechanisms rather than standard retail price lists. Because MiRus manufactures implants from a proprietary MoRe superalloy requiring specialized vacuum melting and precision machining, unit production costs are substantially higher than conventional titanium constructs. However, these elevated manufacturing expenses are commercially offset by superior material strength, lower revision rates, and premium procedural positioning, which justify favorable contracting terms with surgical centers. Commercial adoption is supported by a dedicated commercial and operational workforce of approximately 130 to 134 employees, balancing direct surgical specialists and independent distributor networks. Meanwhile, the MoRe Promise warranty program guarantees lifetime replacement of rods and associated pedicle screw hardware in the event of mechanical fracture, creating an embedded warranty liability that requires disciplined balance-sheet reserve provisioning. Unit margins on commercial spine hardware remain shielded from public disclosure, making direct contribution margin analysis dependent on private channel audits.
  - id: capital-adequacy-strategic-investment-and-corporate-option
    title: Capital Adequacy, Strategic Investment, and Corporate Option
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI012
      - CI013
    tableRefs:
      - TI003
    figureRefs: []
    body: MiRus fundamentally reshaped its balance sheet and forward capital adequacy in May 2026 by securing a $1.5 billion strategic equity investment from Boston Scientific. The transaction represents one of the largest private medtech financing transactions recorded in 2026, granting Boston Scientific an approximate 34% equity interest and establishing an implied post-money enterprise valuation of $4.4 billion. Prior to this corporate round, MiRus had raised approximately $65 million in disclosed venture financing in 2021, bringing cumulative historical funding to $1.56 billion. The substantial capital influx provides multi-year operating runway that effectively insulates the company from near-term private venture market volatility. Furthermore, Boston Scientific publicly disclosed that the transaction is anticipated to be immaterial to its 2026 adjusted earnings per share, reflecting an accounting structure where developmental risk is segregated. This capital base comprehensively finances pivotal clinical execution for the STAR trial while eliminating immediate debt refinancing pressures.
  - id: financial-diligence-verdict-secondary-liquidity-and-risk-assessment
    title: Financial Diligence Verdict, Secondary Liquidity, and Risk Assessment
    claimRefs:
      - CI002
      - CI008
      - CI009
      - CI014
      - CI015
    tableRefs: []
    figureRefs: []
    body: From an underwriting perspective, MiRus presents an exceptional corporate partnership profile coupled with acute private financial reporting opacity. The implied $4.4 billion valuation is primarily supported by strategic validation from Boston Scientific rather than audited public commercial revenue fundamentals. Because MiRus operates as a closely held private enterprise, it does not publish audited income statements, annual revenue run-rates, or product-specific gross margins. Independent secondary trading platforms such as Forge Global report limited secondary liquidity with no established transaction price history, preventing independent mark-to-market pricing or near-term equity exits for minority shareholders. Consequently, an investment decision cannot rely on historical cash flow metrics or established EBITDA multiples. Institutional underwriters must treat clinical milestone attainment in the STAR trial and Boston Scientific's eventual option exercise as the primary economic return drivers, demanding deep diligence access to proprietary manufacturing COGS and confidential transaction terms.
tables:
  - id: TI001
    title: Revenue Streams Table
    columns:
      - Revenue Stream
      - Monetization Mechanism
      - Unit / Metric
      - Current Value / Status
      - Revenue Quality
      - Diligence Ask
    rows:
      - - Spine & Orthopedic Implants
        - Direct hospital and ASC hardware sales
        - Per-implant construct / case fee
        - Commercial (multi-product 510(k) clearances)
        - Recurring procedural volume; high stickiness
        - Disclose historical implant revenue run-rate and ASC mix
      - - CMS Reimbursement Add-On (NTAP)
        - Supplemental Medicare add-on payments for EUROPA PCF
        - Per-case NTAP allowance
        - Active CMS NTAP designation (awarded 2025)
        - High quality policy-backed reimbursement
        - Quantify hospital adoption under NTAP and revenue contribution
      - - Investigational TAVR (SIEGEL)
        - Development milestones and corporate option fees
        - Milestone payment / Option exercise
        - STAR trial active enrollment (April 2026)
        - Lumpy strategic corporate milestone capital
        - Obtain confidential milestone schedule and option strike formula
      - - Surgical Warranty & Services
        - Bundled MoRe Promise lifetime implant coverage
        - Warranty commitment per implanted construct
        - Active commercial program
        - Cost center / value-add sales enablement
        - Audit replacement reserve provisions and historical claim rates
    notes: Values reflect public regulatory clearances, partnership disclosures, and private-market estimates; unit revenue and case volumes are not publicly broken out.
    claimRefs:
      - CI001
      - CI003
      - CI005
      - CI006
      - CI007
  - id: TI002
    title: Pricing / Monetization Table
    columns:
      - Product / Program Line
      - Contract / Unit Model
      - List vs Realized Pricing
      - Discounts & Commercial Unknowns
      - Source & Verification Posture
    rows:
      - - EUROPA Posterior Cervical Fusion System
        - Capital and disposable instrument/implant trays
        - List prices unreleased; reimbursed via DRG + NTAP
        - GPO and hospital system discount tiers undisclosed
        - CMS NTAP award and company press disclosures (SI003, SI007)
      - - IO Expandable Wedge Osteotomy System
        - Per-procedure implant package
        - Private hospital catalog pricing
        - Volume-based rebates and distributor margins unknown
        - FDA 510(k) clearance announcements (SI003)
      - - SIEGEL 8-Fr TAVR System
        - Strategic option and milestone development agreement
        - Option valuation tied to $1.5B equity and milestone rights
        - Future commercial transfer price and royalty structure undisclosed
        - Boston Scientific strategic agreement disclosures (SI004, SI005)
      - - MoRe Promise Warranty
        - Bundled zero-cost lifetime rod replacement
        - Zero explicit list fee; implicit cost embedded in hardware
        - Revision coverage exclusions and liability caps private
        - MiRus commercial technology terms (SI006)
    notes: Private medical device list pricing and confidential GPO discount schedules are withheld from public filings; status inferred from commercial clearances.
    claimRefs:
      - CI003
      - CI005
      - CI006
      - CI007
  - id: TI003
    title: Unit Economics Table
    columns:
      - Unit Metric
      - Reported Value
      - Confidence
      - Underwriting Relevance
      - Diligence Ask
    rows:
      - - Average Selling Price (ASP) per Spine Construct
        - null
        - Low
        - Determines per-case gross revenue and hospital contribution margin
        - Request trailing 24-month ASP trends by product line and care setting
      - - Gross Margin on MoRe Alloy Hardware
        - null
        - Low
        - Reflects cost of proprietary raw rhenium synthesis and specialized machining
        - Examine COGS breakdown including alloy manufacturing and sterilization
      - - Sales Efficiency / Rep Payback Period
        - null
        - Low
        - Gauges commercial distributor vs direct sales force productivity
        - Inspect sales rep commission structures, ramp timelines, and territory CAC
      - - Post-Money Strategic Valuation
        - $4.4B
        - High
        - Establishes pricing benchmark for 34% equity stake and option underwriting
        - Verify cap-table liquidation preferences and Boston Scientific option strike
    notes: MiRus does not publicly report unit economics; reported $4.4B valuation is corroborated across strategic investor and analyst disclosures.
    claimRefs:
      - CI001
      - CI002
      - CI008
      - CI014
