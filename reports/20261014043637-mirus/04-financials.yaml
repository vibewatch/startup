callouts:
  - calloutType: insight
    title: Bifurcated Business Model Couples Commercial Cash Flow with Binary TAVR Option
    body: MiRus' financial structure combines an operating commercial spine hardware business with a massive binary strategic asset in the SIEGEL TAVR program. The $1.5 billion investment by Boston Scientific effectively funds pivotal trial development while locking in exclusive acquisition rights, shifting late-stage clinical financing risk away from balance-sheet cash reserves.
    claimRefs:
      - CI001
      - CI003
      - CI011
  - calloutType: risk
    title: Private Financial Opacity Precludes Standalone Cash Burn and Margin Verification
    body: While the headline $4.4 billion valuation provides strong strategic validation, the complete absence of publicly disclosed revenue run-rates, gross margins, or secondary market liquidity means financial underwriting relies heavily on Boston Scientific's willingness to exercise its acquisition option.
    claimRefs:
      - CI002
      - CI008
      - CI009
      - CI015
