          to: node-ortho-rev
          label: Reimbursement realization
        - from: node-ortho-rev
          to: node-warranty-exp
          label: COGS and warranty deduction
        - from: node-warranty-exp
          to: node-tavr-trials
          label: Operating cash reinvestment
        - from: node-tavr-trials
          to: node-option-payout
          label: Milestone achievement trigger
    approximationNotes: Flow architecture models the commercial and strategic monetization relationship; financial allocations between divisions are not publicly quantified.
