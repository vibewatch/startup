companyProfile:
  summary: >-
    MiRus is a private Marietta, Georgia medical technology company founded in 2015 that commercializes MoRe-alloy
    spine, cervical, and extremity implants while developing the investigational SIEGEL balloon-expandable TAVR system.
    The company combines commercial orthopedic products with a strategic cardiovascular program that drew a $1.5 billion
    Boston Scientific investment and an exclusive TAVR acquisition option, but the underlying private financials remain
    undisclosed.
  foundedDate: '2015-06-01'
