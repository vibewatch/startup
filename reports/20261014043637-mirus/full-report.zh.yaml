chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与领导层
        blocks:
          - type: paragraph
            body: >-
              MiRus 是一家成立于 2015 年、总部位于乔治亚州 Marietta
              的私营医疗技术公司。公司成立的目标，是利用自有钼铼（MoRe）超合金技术开发并商业化医疗植入物和手术解决方案。与传统钛合金或钴铬合金相比，这一先进金属平台具备更强的抗疲劳性、生物相容性和机械强度，使公司能够制造明显更薄、更窄的骨科和脊柱植入物。公司由创始人兼首席执行官
              Jay Yadav 医生领导；他是知名心脏科医生和连续创业的医疗器械企业家，曾创办多家颠覆性医疗器械公司。管理层还包括 Jordan Bauman 等监管经验丰富的负责人；Bauman
              担任监管与质量副总裁，负责关键临床申报和 FDA 沟通。由于 Yadav 医生同时承担科学愿景、发明和公司领导等核心职责，MiRus 存在明显的关键人物依赖；更广泛的运营高管阵容和董事会治理情况仍属私有信息。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO009
      - number: '1.2'
        title: 资本结构、战略投资与估值机制
        blocks:
          - type: paragraph
            body: >-
              2026 年 5 月，Boston Scientific Corporation 向 MiRus LLC 投资 $1.5 billion，换取约 34% 的股权。这笔战略交易对应约 $4.4 billion
              的投后公司估值，使 MiRus 成为全球估值最高的私有医疗器械开发商之一。根据投资协议，Boston Scientific 还取得了独家期权，可在达成里程碑后以总计 $3.0 billion 的额外现金支付收购
              MiRus 100% 的 TAVR 业务，另有潜在的未来净销售额特许权使用费，以及针对二尖瓣和三尖瓣资产的期权。这笔交易承接了 2021 年 7 月由 Mammoth Scientific 领投的一轮 $65
              million 融资，当时据估计估值约为 $260 million。尽管公司表面估值很高，Forge Global 追踪的私募股权交易活动有限，也没有形成匹配价格，说明股权价值很大程度由 Boston
              Scientific 的战略承诺驱动，而非流动的二级市场共识。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO007
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
