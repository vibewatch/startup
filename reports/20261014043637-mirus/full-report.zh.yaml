              - CO013
      - number: '1.3'
        title: 产品组合、监管进展与临床里程碑
        blocks:
          - type: paragraph
            body: >-
              MiRus 同时推进商业化和临床项目，覆盖心血管疾病与复杂脊柱疾病。公司的旗舰心血管资产是 SIEGEL
              球囊扩张式经导管主动脉瓣置换（TAVR）系统：这是一款无镍瓣膜，采用干式猪瓣叶和一氧化氮涂层铼合金框架，并通过超低外形的 8 French 可扩张鞘输送。2026 年 4 月，MiRus 开始在前瞻性、随机
              STAR 关键试验中入组患者，计划评估最多 1,025 名重度主动脉瓣狭窄患者。同时，公司已在 MoRe 骨科产品组合中建立商业牵引力：FDA 于 2024 年 7 月为 EUROPA
              后路颈椎系统授予突破性器械认定，CMS 随后于 2025 年 8 月批准新技术附加支付（NTAP）报销。2026 年 2 月，MiRus 获得 FDA 510(k) 许可并商业发布 IO
              可扩张楔形截骨系统，用于足踝手术，显示其商业骨科业务和在研介入心脏管线都在持续推进。
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
