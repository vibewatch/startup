      - number: '8.2'
        title: 情景建模、下行触发因素与公私市场可比交易
        blocks:
          - type: paragraph
            body: >-
              评估 MiRus 的 44 亿美元估值，需要把公司结构拆成心血管看涨期权和商业化脊柱生物材料基础业务。在乐观情景下，STAR 关键性试验在 1,025 名患者队列中达到非劣效或优效终点，触发 Boston
              Scientific 行使 30 亿美元现金选择权，同时 EUROPA 后路颈椎系统商业扩张，
              带来高回报和净销售额特许权使用费。在基准情景下，关键性试验按延长后的时间表推进，选择权决策被推迟并需要过桥融资，而医院采购机制 继续限制脊柱收入增长。在悲观情景下，STAR 试验出现临床挫折或心血管不良事件，促使
              Boston Scientific 放弃收购选择权，股东被困在 一家独立的生物材料公司中，而其脊柱收入无法支撑数十亿美元级的估值倍数。可比交易显示，大型医疗科技战略买家正在剥离或降低传统脊柱
              硬件的优先级：Zimmer Biomet 分拆 ZimVie，Stryker 将美国脊柱植入业务出售给 VB Spine，Johnson & Johnson 则拆分 DePuy Synthes。 这给 MiRus
              带来巨大压力，迫使其证明 MoRe 合金具备真正的定价权，而非只是商品化硬件经济性。
