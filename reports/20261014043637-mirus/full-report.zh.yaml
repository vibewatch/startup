            body: >-
              MiRus 商业脊柱业务的变现依靠医院 DRG 报销计划、私立机构合同和专门的附加支付机制，而不是标准零售价目表。由于植入物采用自有 MoRe
              超合金制造，需要特殊真空熔炼和精密加工，单位生产成本显著高于传统钛合金构造。不过，更高的材料强度、更低的翻修率和高端手术定位，可以抵消制造成本，并支持公司与手术中心签订更有利的合同。商业采用由约 130 至
