  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方动态
        blocks:
          - type: paragraph
            body: >-
              MiRus
              面向两个截然不同的医疗客户群，其采购机制和临床买方画像存在根本差异。在商业阶段的脊柱业务中，主要临床决策者是负责颈椎、腰椎和复杂畸形手术的骨科脊柱外科医生及神经外科医生，手术地点包括住院医院和门诊手术中心。但采购权限掌握在医院价值分析委员会（VAC）、集团采购组织（GPO）和整合医疗网络（IDN）手中。为取得商业准入，MiRus
              已在区域及全国医疗系统签下分销合同。在结构性心脏病领域，客户关系围绕评估在研 Siegel 8-Fr 球囊扩张式 TAVR 平台的学术医疗中心和心脏导管室展开。不同于直接通过医院采购渠道销售的脊柱硬件，MiRus
              的结构性心脏商业化路径在结构上依托 Boston Scientific Corporation，后者持有收购 TAVR 资产的独家期权。
