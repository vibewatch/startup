      - number: '7.2'
        title: 运营扩张性与制造质量风险
        blocks:
          - type: paragraph
            body: >-
              把自有材料科学转化为商业植入物生产，会带来尖锐的运营瓶颈和临床集中风险。STAR 关键试验最初的患者入组和临床手术，在亚特兰大的 Piedmont Heart Institute
              由主要研究者团队启动。早期入组速度高度依赖单一地区心血管机构；如果多中心站点加速启动前出现机构审查委员会延误、方案调整或研究者更替，执行就会严重受损。同时，根据 Dealroom 私募市场追踪，MiRus
              估计约有 130 名员工；这样精简的运营基础必须同时制造复杂的 MoRe 合金骨科器械，并支持大规模心血管临床试验监测。除临床人员配置外，钼铼合金组件的专业制造还要求在严格 ASTM F3273
              规范下进行高度受控的真空熔炼、粉末冶金和精密委托加工。专用铼供应中断、原材料价格上涨，或预装球囊与可扩张鞘组件的批次间公差失控，都可能拖慢试验供应。此外，近期大型医疗技术同行发生的网络安全中断——Stryker
              的 2026 年企业系统遭入侵并抹去 200,000 个系统中的数据——也凸显了互联医疗器械供应链和临床数据存储库容易受到外部运营冲击。
            claimRefs:
              - CR002
              - CR003
              - CR010
              - CR012
              - CR013
