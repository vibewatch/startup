      - number: '7.4'
        title: 财务不透明、二级市场流动性枯竭与打破投资论点的触发因素
        blocks:
          - type: paragraph
            body: >-
              私募市场的持股结构给非战略股东带来显著的流动性不足和估值兑现风险。Forge Global 的二级交易数据显示，私募市场活动有限，且没有公布 Forge Price，反映出 MiRus
              私股成交量稀薄、买卖价差显著。由于 Boston Scientific 的 30 亿美元收购选择权封顶了 TAVR 资产的终端估值，
              共同投资的股东承担不对称的下行风险，却无法参与无上限的上行收益。此外，私营公司报告没有经审计的骨科收入运行率、产品线毛利率、研发 现金消耗或可用现金续航披露。若 Boston Scientific
              行使选择权，交易会把高增长心血管业务与剩余骨科植入业务拆开，迫使投资者在没有经过 核实的公开财务报表的情况下，单独评估脊柱业务。需要立即升级尽调的关键投资论点破坏触发因素包括：（1）STAR
              试验入组速度低于预期的 多中心里程碑，或出现未预料的卒中 / 死亡不良事件；（2）Boston Scientific 正式表示对 30 亿美元选择权条款犹豫或要求重新谈判； （3）ASTM F3273
              铼合金采购出现供应链瓶颈；（4）二级股权折价幅度超过私募市场同类医疗科技公司的估值水平。
