  - id: TV002
    title: 核心投资论点与反论点平衡
    columns:
      - 支柱
      - 论点
      - 反论点
      - 论点失效触发条件
    rows:
      - - 心血管 TAVR
        - 专有 MoRe 合金支持 8-Fr 输送鞘管（小 50%）及零缩短的无镍框架
        - 该试验器械尚未在任何国家获商业批准；STAR 试验能否在广泛中心执行仍未经验证
        - STAR 试验临床暂停、卒中 / 漏血并发症升高，或未达到非劣效终点
      - - 战略合作伙伴关系
        - Boston Scientific 承诺 $1.5B 股权投资并附带结构化 $3B 收购选择权，显示其完成了深入技术尽调
        - 选择权结构限制估值上行空间，而若里程碑失败，Boston Scientific 没有收购义务
        - Boston Scientific 在里程碑到期时终止或不执行 $3B TAVR 选择权
      - - 生物材料与脊柱
        - MoRe 合金获得 FDA 批准，并为 EUROPA 后路颈椎系统取得突破性器械认定
        - 随着同行剥离商品化资产（ZimVie、VB Spine），脊柱植入硬件面临利润率压缩
        - 无法证明相较标准钛结构的临床优势或更高的报销水平
      - - 资本结构
        - 巨额 $1.5B 现金注入消除近期资不抵债风险，并为关键试验运营提供全部资金
        - 34% 的战略持股及选择权悬置制造治理摩擦，少数股东优先权利不明
        - 不透明的清算瀑布在资产剥离时损害普通股分配
    notes: 分析在 MoRe 平台的技术优势、临床试验障碍与公司治理悬置之间进行权衡。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV006
      - CV008
      - CV011
  - id: TV003
    title: 情景分析：估值结果与回报逻辑
    columns:
      - 情景
      - 概率
      - 核心假设与运营里程碑
      - 隐含估值 / 回报逻辑
      - 关键下行风险与触发条件
    rows:
      - - 乐观情景
        - 25%
        - STAR 试验提前达到主要终点；Boston Scientific 执行 $3B 选择权；商业化特许权使用费开始产生；脊柱 ARR 增长 >30%
        - '>$5.5B 总企业价值；TAVR 全额支付，加上独立的高利润率脊柱业务'
        - TAVR 监管审批延迟或上市后的商业化采用受阻
      - - 基准情景
        - 50%
        - STAR 试验在延长的时间线上达到安全性 / 有效性终点；选择权执行延迟至 2028 年或更晚；脊柱业务取得中等区域性进展
        - $3.5B–$4.4B 估值区间；二级市场进入带来适度回报，但漫长临床随访期间资本被占用
        - 试验执行成本超支，Piedmont 以外中心的患者入组速度放缓
      - - 悲观情景
        - 25%
        - STAR 试验显示瓣周漏或结构问题升高；Boston Scientific 拒绝 $3B 选择权；TAVR 资产搁置；脊柱业务退回小众硬件
        - <$800M 估值完全基于适度的脊柱植入现金流；相较峰值估值股权减值 >80%
        - 选择权失效、股权结构表遭严重稀释、脊柱定价商品化压力
    notes: 情景模拟 Boston Scientific 执行 $3B 选择权及 STAR 试验执行可能带来的结果。概率和区间均为分析性估计。
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV009
      - CV010
      - CV012
