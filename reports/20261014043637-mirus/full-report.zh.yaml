        title: 展示材料
        blocks:
          - type: callout
            title: 采用分拆式收购结构的双轨商业模式
            body: Boston Scientific 以 $1.5B 投资取得 34% 股权，并通过一项独家 $3.0B 收购期权单独锁定心血管 TAVR 资产；商业化的 MoRe 骨科和脊柱植入业务则留在剩余的私营实体中。
