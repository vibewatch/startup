      - number: '5.3'
        title: SIEGEL TAVR 架构与输送差异化
        blocks:
          - type: paragraph
            body: >-
              MiRus 价值最高的战略开发管线资产，是用于治疗有严重症状主动脉瓣狭窄的 SIEGEL 球囊扩张式经导管主动脉瓣置换（TAVR）系统。不同于依赖钴铬框架的传统球囊扩张式瓣膜，SIEGEL
              采用一氧化氮涂层铼合金框架，径向强度超过钴合金和钛合金。更高的材料强度允许框架支柱更薄，同时保持径向扩张力，部署时不发生缩短，并能在主动脉瓣环处实现精确解剖对位。假体还采用干式猪心包组织瓣叶，直接预装在输送球囊上。三个临床瓣膜直径（23
              mm、26 mm 和 29 mm）都能通过 8 French 可扩张鞘输送。标准商业 TAVR 输送鞘需要 14 至 16 French 的通路外形，因此 SIEGEL 鞘的横截面约小
              50%，可显著降低经股动脉血管损伤和穿刺部位出血并发症。
            claimRefs:
              - CE008
