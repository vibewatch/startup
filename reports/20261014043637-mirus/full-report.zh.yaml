      - number: '2.3'
        title: 买方、临床用户与第三方报销分层
        blocks:
          - type: paragraph
            body: >-
              MiRus 产品的医院采购，需要在介入心脏科和骨科脊柱科之间应对不同的决策层级。对在研 SIEGEL TAVR
              平台而言，临床用户是混合导管室中的介入心脏科医生和心胸外科医生。机构买方包括医院心血管业务线负责人，报销则依托住院 Medicare 严重程度诊断相关组（MS-DRG 266 和
              267）及商业健康险。相比之下，商业脊柱器械的采用由在手术室和门诊手术中心开展颈胸椎融合的神经外科医生及骨科脊柱专科医生推动。医院价值分析委员会（VAC）和物资管理负责人是主要机构把关人，会评估植入物的成本效益、临床并发症减少情况和翻修手术负担。MiRus
              通过为 MoRe 棒及配套 Europa 椎弓根螺钉组件提供终身有限保修，主动应对行政成本敏感性，直接瞄准成人脊柱翻修手术的高昂临床和医院支出。
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM011
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM008
              - CM011
              - CM015
      - number: '2.4'
        title: 采用驱动因素、结构性约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              MiRus 产品组合的采用速度由材料科学优势和严格监管门槛共同决定，私募市场的信息不透明则进一步增加判断难度。在脊柱手术中，FDA 为 Europa 系统授予突破性器械认定，验证了市场对 2.9 mm MoRe
              棒的需求；这种细棒能让螺钉头更低，降低手术侵入性和小体型患者体内的器械突出。不过，既有供应商关系、与 Medtronic 和 Stryker
              等医疗技术集团签订的多供应商医院供货合同，以及医生切换产品的摩擦，都构成明显商业阻力。在心血管 TAVR 领域，SIEGEL 瓣膜具备明确的结构性驱动因素，包括约比现有商业输送鞘小 50% 的 8 French
              可扩张输送鞘，以及无需镍且能消除部署缩短的开放式框架。但在 STAR 试验完成并取得正式 FDA 上市前批准（PMA）之前，短期商业采用完全被挡住。关键是，Forge Global
              等二级市场平台报告私募交易有限，独立脊柱产品收入仍是未披露的私有事实，导致独立市场规模测算存在重大缺口。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM011
              - CM013
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 双市场暴露：商业脊柱现金流与临床阶段 TAVR 上行空间
            body: >-
              MiRus 横跨两个不同的医疗技术市场：成熟的商业脊柱植入产品线（Europa、Cygnus），以及由 Boston Scientific $1.5B 战略投资和 $3B 期权协议支撑的高估值在研心血管 TAVR
              资产（SIEGEL）。市场规模模型必须把短期脊柱采用与二元 TAVR 临床里程碑分开。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM005
          - type: callout
            title: 机构采用瓶颈：医院 VAC 采购与 STAR 试验执行
            body: 新型植入材料进入医院，会受到既有供应商合同和价值分析委员会（VAC）严格采购审查的双重约束。在 1,025 人规模的 STAR 关键试验完成并取得后续 FDA 批准前，TAVR TAM 在商业上仍完全无法触达。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与市场替代方案
        blocks:
          - type: paragraph
            body: >-
              MiRus 面对的竞争，一端是高销量的心血管经导管瓣膜巨头，另一端是多元化骨科脊柱集团。在结构性心脏领域，经导管主动脉瓣置换（TAVR）由 Edwards Lifesciences 的 SAPIEN
              球囊扩张式产品线和 Medtronic 的 Evolut 自膨式平台主导。这两家跨国领导者凭借广泛的临床登记数据和稳固的医院心脏科关系，合计控制绝大多数商业 TAVR
              手术量。在脊柱植入领域，Stryker、Medtronic 和 Zimmer Biomet
              等大型医疗器械企业依靠完整的器械目录、机器人导航整合和跨专科医院供货协议占据强势地位。脊柱手术的现状替代方案主要依赖传统钛合金和钴铬合金棒；TAVR 手术则使用镍钛或钴铬框架，通过相当于 14-French 至
              16-French 的鞘输送。在这一既有格局下，MiRus 以专业材料科学创新者身份，在两个治疗领域商业化钼铼植入物。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
      - number: '3.2'
        title: 能力与材料差异化对比既有厂商
        blocks:
          - type: paragraph
            body: >-
              MiRus 通过自有 MoRe 钼铼超合金打造产品差异化，相比传统医用合金，该材料兼具机械和生物学优势。在结构性心脏应用中，在研 SIEGEL 球囊扩张式 TAVR
              系统采用开放式铼合金框架，部署时不会缩短，径向强度也高于钛或钴合金。更重要的是，瓣膜构造完全无镍，可降低患者对金属敏感的潜在风险，并预装在 8 French 可扩张鞘上。该鞘的外形约比 Edwards 和
              Medtronic 使用的商业引导鞘小 50%，有望降低复杂解剖通路中的血管并发症。在骨科脊柱应用中，MiRus 利用 MoRe 更强的抗疲劳性缩小器械体积；其获 FDA 突破性认定的 EUROPA
              后路颈椎系统采用 2.9 mm 棒，使螺钉头更低、组织突出更少。MiRus 还为翻修手术中的棒更换提供终身有限保修，这也说明公司对合金结构完整性有信心；传统钛合金厂商没有同等保障。
