      - number: '3.4'
        title: 护城河持久性与不利替代风险
        blocks:
          - type: paragraph
            body: >-
              MiRus 竞争护城河的持久性，根本上取决于自有冶金知识产权和临床验证速度，而不是商业规模。MoRe 超合金配方及制造技术经过超过 15
              年冶金研究开发，竞争者在法律和技术上都很难直接仿制薄壁钼铼植入物。不过，如果执行时间表失控，MiRus 也会面临重大替代风险。在 TAVR 市场，Boston Scientific 的 $3B
              收购期权取决于正在进行的 STAR 关键试验成功完成及后续监管里程碑；如果试验入组放缓，或临床终点无法证明相对 Edwards 和 Medtronic 的明确优势，Boston Scientific
              可能放弃期权，MiRus 也会失去全球心血管商业化伙伴。在脊柱领域，Stryker 和 Medtronic 的商品化压力及激进捆绑折扣，可能把市场渗透限制在复杂畸形等利基病例。Forge Global
              的二级市场交易显示交易有限、尚无明确二级价格，也进一步说明股东价值仍系于公司期权是否执行。
