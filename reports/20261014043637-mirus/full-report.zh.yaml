        title: 商业收入架构与变现模式
        blocks:
          - type: paragraph
            body: >-
              MiRus 围绕自有钼铼（MoRe）合金平台，形成商业与开发并行的收入模式。在骨科和脊柱业务中，公司向医院、医疗系统和门诊手术中心机构销售硬件，取得商业收入。商业产品包括 EUROPA
              后路颈椎融合系统；该系统获得 FDA 突破性器械认定，并通过 CMS 新技术附加支付获得额外 Medicare 报销，另有已获许可的腰椎钢板和截骨系统。与此同时，MiRus 的心血管业务围绕在研 SIEGEL
              球囊扩张式经导管主动脉瓣置换系统展开；该系统于 2026 年 4 月在前瞻性多中心 STAR 随机对照试验中开始入组患者。SIEGEL 的商业化通过与 Boston Scientific
              的独家战略合作推进：Boston Scientific 承诺 $1.5B 战略股权投资，并取得按里程碑触发的 TAVR 项目独家期权。这一安排让 MiRus
              的财务画像呈现两部分：稳定的手术植入收入，以及波动较大的里程碑资本；MoRe Promise 终身保修计划则覆盖翻修硬件成本。
