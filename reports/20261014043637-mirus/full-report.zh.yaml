              后路颈椎融合系统使用 2.9 mm MoRe 棒，在保持结构刚性的同时，显著降低器械相对标准商业构造的突出程度。Cygnus MoRe 前路颈椎钢板和 3DR 侧路腰椎椎间融合系统补充后路器械，提供已获
