  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与战略融资结构
        blocks:
          - type: paragraph
            body: >-
              对一家私营医疗科技公司而言，MiRus 的战略融资结构极为特殊。Boston Scientific Corporation 于 2026 年 5 月 18 日宣布投资 $1.5 billion，获得约 34%
              的股权。按投后口径计算，这笔交易隐含 MiRus 估值约为 $4.4 billion。除直接股权购买外，协议还授予 Boston Scientific 一项独家选择权：在满足临床和监管里程碑的前提下，额外支付
              $3 billion 现金收购 MiRus 的经导管主动脉瓣置换（TAVR）系统。若选择权行使，Boston Scientific 将取得 TAVR 业务 100% 的所有权，MiRus 保留 SIEGEL
              瓣膜按销售额计算的业绩支付权，Boston Scientific 还拥有后续 购买二尖瓣和三尖瓣资产的选择权。核心投资论点建立在 MiRus 专有的钼铼超合金（MoRe）上：该材料支持设备大幅小型化，包括 8
              French 的 SIEGEL TAVR 输送鞘，以及抗断裂脊柱植入物。但反方论点指出，当前 $4.4 billion 估值几乎完全依赖一项尚未获批、正在进行关键性试验的
              心血管资产能否取得推测性成功；而商业化骨科业务的私营财务报表、独立商业收入和毛利率仍不透明。
