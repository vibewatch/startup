  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管路径与临床试验执行风险
        blocks:
          - type: paragraph
            body: >-
              MiRus 同时处于两套截然不同的监管范式中，技术和商业风险画像由此分化。在脊柱和骨科领域，公司已取得较强监管验证：其 CYGNUS MoRe 前路颈椎钢板系统获得 FDA 510(k) 许可
              K220441，属于采用 ASTM F3273 规定的自有锻造钼-47.5 铼合金制造的 II 类椎间体固定矫形器。公司还为 EUROPA 后路颈椎系统取得突破性器械认定；该系统采用 2.9 mm MoRe
              棒，减少手术外形和器械突出。相反，公司的估值锚点——SIEGEL 球囊扩张式经导管主动脉瓣置换（TAVR）系统——仍是尚未获得任何全球司法辖区商业批准或上市前批准（PMA）的在研器械。为跨过这一门槛，MiRus
              启动了前瞻性、多中心、随机对照 STAR 关键试验，计划在低、中、高三种手术并发症风险队列中，评估三种尺寸的 SIEGEL 瓣膜，最多覆盖 1,025
              名患者。虽然早期可行性研究数据显示血流动力学表现良好，并可通过低外形 8 French 鞘输送，但转入 1,025
              人关键试验后，投资者会暴露于严重的二元临床风险，包括结构性瓣膜退化、瓣叶血栓、传导异常，以及相对既有商业基准的终点表现不足。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR013
