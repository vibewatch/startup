      - number: '1.4'
        title: 运营规模、二级市场与尽调现实
        blocks:
          - type: paragraph
            body: >-
              MiRus 主要在乔治亚州 Marietta 的公司设施运营，估计约有 130 名员工，年度员工增幅仅 2.4%。这种精简组织结构说明，包括多中心 STAR 试验在内的大规模临床试验执行，更多依托
              Piedmont Heart Institute 等合作临床机构，而不是庞大的内部行政体系。不过，潜在尽调必须面对严重的信息不透明。作为未上市私营公司，MiRus
              不披露脊柱和截骨商业产品的收入跑率、毛利率或出货量。此外，非控股股东面临严重流动性不足：Forge Global 报告没有匹配交易，少数股权无法按流动性二级市场基准估值。             
              尽调必须确认骨科商业运营能否自我造血，还是依赖公司融资；同时应看到，表面估值能否兑现，完全取决于 STAR 关键试验的临床成功及 Boston Scientific 后续是否行使期权。
            claimRefs:
              - CO012
