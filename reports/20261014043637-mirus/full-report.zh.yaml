      - number: '3.3'
        title: 定价、包装与商业分销能力
        blocks:
          - type: paragraph
            body: >-
              心血管和脊柱两个市场的商业采购，核心都是医院议价能力和供应商整合。Edwards、Medtronic 和 Stryker
              等全球既有厂商依靠广泛产品组合，为医院网络提供一体化企业折扣、手术设备租赁和集团采购组织返利，降低多供应商采购意愿。医院采购委员会评估新型脊柱系统时，要承担重新培训手术人员、增加重复器械灭菌托盘库存，以及可能失去更广泛骨科产品线批量折扣等切换成本。在
              TAVR 中，手术报销按固定 Medicare MS-DRG 支付，因此医院要采用高价瓣膜，必须看到减少血管并发症或缩短 ICU 住院时间等可验证临床优势。MiRus 的 EUROPA
              椎弓根螺钉系统受益于新技术附加支付（NTAP）报销，但其独立商业分销覆盖仍小于数十亿美元级别的现场销售组织。Boston Scientific 以 $1.5B 投资取得 34%
              股权，为这一分销差距提供了弥补路径：如果临床里程碑触发 $3B 期权，公司便有机会实现全球商业化。
