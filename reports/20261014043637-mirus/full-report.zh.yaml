  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与范围：心血管 TAVR 和骨科脊柱
        blocks:
          - type: paragraph
            body: >-
              MiRus 同时处于高增长介入心脏病学和专业骨科脊柱手术两个医疗技术赛道，形成少见的双行业定位。两大细分市场在资本强度、监管路径和临床采用速度上存在根本差异。在心血管领域，MiRus 专注于通过自有 SIEGEL
              球囊扩张式瓣膜系统治疗重度主动脉瓣狭窄的经导管主动脉瓣置换（TAVR），明确排除外科主动脉瓣置换（SAVR）和广义心脏诊断。在骨科领域，公司把商业范围限定在脊柱器械，重点包括 Europa
              后路颈椎固定系统、Cygnus 前路颈椎钢板和 3DR 侧路腰椎椎间融合平台。两个业务都以 MiRus
              自有的钼铼（MoRe）超合金技术为基础；与传统钛合金和钴铬合金相比，该技术具备更强的抗拉强度和抗疲劳性。Boston Scientific Corporation
              的战略支持验证了这一生物材料平台在两个临床领域的价值，同时保持清晰的手术边界。
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM008
              - CM010
      - number: '2.2'
        title: 可服务市场规模：全球 TAVR 与脊柱固定视角
        blocks:
          - type: paragraph
            body: >-
              评估 MiRus 的可服务机会，需要把全球宏观市场支出、临床适应症筛选和交易支持的估值现实拆开看。全球经导管主动脉瓣置换市场对应 $7.0B 至 $10.0B 的总可服务市场（TAM），预计以 10% 至 13%
              的复合年增长率扩张，驱动力来自人口老龄化以及指南向低风险患者群体扩展。在这一宏观 TAM 中，重度、有症状主动脉瓣狭窄患者的球囊扩张式瓣膜可服务市场（SAM）约为 $3.0B 至 $4.5B，MiRus
              正通过面向最多 1,025 名入组患者的多中心 STAR 关键试验直接切入。与此同时，全球脊柱融合和固定器械市场提供了 $10.0B 至 $14.0B 的成熟 TAM；但 MiRus 面向的是约 $500M 至
              $1.2B 的专业可服务利基市场，聚焦复杂颈椎畸形、翻修手术和低外形固定。Boston Scientific 以 $1.5B 换取 34% 股权，对应 $4.4B 私人市场估值基准；再加上一项严格绑定 TAVR
              里程碑的 $3B 结构化收购期权，这比不受约束的自上而下估算更有校准意义。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM012
