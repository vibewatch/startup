  - id: TE002
    title: 临床流程与使用场景对比
    columns:
      - 临床手术
      - 标准临床流程
      - MiRus 方案
      - 可量化的临床收益
      - 流程限制
    rows:
      - - 经股 TAVR 输送
        - 使用 14-Fr 至 16-Fr 大口径鞘管输送压缩瓣膜，血管损伤风险高
        - SIEGEL 8-Fr 可扩张鞘管输送，球囊上预装瓣膜
        - 鞘管横截面约缩小 50%，减少血管创伤和入路并发症
        - 需要熟悉球囊扩张流程及新型支架动力学
      - - 复杂颈椎重建
        - 使用 3.5 mm 至 4.0 mm 粗大钛杆，需要大范围牵开组织，硬件外形突出
        - EUROPA PCF 系统采用 2.9 mm 高强度 MoRe 杆
        - 显著降低硬件突出度，在小型解剖结构中减少组织剥离
        - 外科医生必须适应更紧的螺钉 tulip 公差及刚性杆的弯曲特性
      - - 成人脊柱畸形融合
        - 长节段胸腰椎构件长期存在钛杆疲劳断裂和翻修手术风险
        - MoRe 超级合金杆构件，配有终身更换保修
        - 疲劳耐久性更强，消除患者 / 医院承担的杆断裂更换成本
        - 相比标准化钛硬件，初始植入物采购成本更高
      - - 足踝 Evans 截骨术
        - 使用静态结构性骨移植物或固定间隔物，术中机械矫正不够精确
        - 配备 MoRe Expansion Engine 的 IO Expandable Wedge Osteotomy System
        - 术中可精确调节楔形扩张，以匹配解剖结构
        - 需要专用插入工具，医生需经历扩张机制学习曲线
    notes: 流程收益来自制造商规格和对比临床出版物；血管损伤减少仍有待 STAR 试验持续验证。
