      - number: '8.3'
        title: 退出准备度、尽调要求与打破投资论点的触发因素
        blocks:
          - type: paragraph
            body: >-
              MiRus 的流动性路径在结构上与 Boston Scientific 的合同收购选择权紧密相连。该选择权为心血管业务预设了收购路径，却没有明确脊柱和
              生物材料业务最终如何处置。在估值偏高的前提下，建议继续研究，正是因为这种结构性分拆：公众投资者和二级市场参与者无法核实 15 亿美元 融资轮同时谈定的底层股权表条款、清算优先权分配顺序或少数股东保护。Forge
              Global 等私募平台上的二级交易迹象显示，活动有限，买卖盘 没有定价，无法形成市场化价格发现。投资前尽调必须优先覆盖四个关键领域：第一，取得 STAR 随机试验经过核实的入组节奏、中心启用数据
              和不良事件日志；第二，审计 MoRe 脊柱植入物产品目录的私营收入、产品级毛利率和客户集中度；第三，审阅约束 Boston Scientific 30 亿美元
              选择权的确切合同里程碑；第四，持续监测包括临床试验暂停、主要终点失败或下轮融资重组在内的投资论点破坏触发因素。
            claimRefs:
              - CV012
              - CV014
              - CV015
