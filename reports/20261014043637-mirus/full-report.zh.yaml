      - number: '5.2'
        title: 材料科学与 MoRe 超合金平台
        blocks:
          - type: paragraph
            body: >-
              MiRus 知识产权和临床差异化的基础，是经过 15 年材料科学研究开发的 MoRe
              钼铼超合金；这一研究受到航空航天推进领域高温难熔冶金的启发。医用钛合金和钴铬合金在抗拉强度、疲劳耐久性和生物惰性之间存在已知的生物力学取舍；反复的生理负荷经常造成棒材缺口敏感、器械疲劳断裂或离子释放引起的局部金属中毒。相比之下，MoRe
              合金具备显著更高的疲劳强度、更强的延展性，并能减少周围组织中的金属离子溶出。为突出材料在脊柱融合中的机械可靠性，MiRus 提供 MoRe Promise 终身有限保修：如果棒断裂导致必须翻修，计划覆盖 MoRe
              棒及所有配套 EUROPA 椎弓根螺钉植入组件的更换。这在骨科植入行业属于少见的制造商保障，也说明公司对材料性能有信心。
            claimRefs:
