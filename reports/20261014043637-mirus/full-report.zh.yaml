      - number: '6.2'
        title: 临床采用轨迹与证据里程碑
        blocks:
          - type: paragraph
            body: >-
              由于 MiRus 是一家私营生命科学公司，商业客户数量、年度手术病例数和逐项植入收入均未公开。因此，采用轨迹必须盯住监管里程碑、产品许可和临床试验扩展节奏。在脊柱领域，MoRe 植入物已获一系列 510(k)
              许可和 FDA 突破性器械认定，推进商业采用，包括 Europa 后路颈椎系统和 Cygnus 前路颈椎钢板。2025 年 8 月，CMS 为 Europa
              批准新技术附加支付（NTAP），医院开展颈胸椎手术可获得额外 Medicare 支付，进一步加强报销采用。2026 年 2 月，MiRus 商业发布 IO
              可扩张楔形截骨系统，把骨科客户覆盖扩展到足踝手术。对结构性心脏平台而言，采用路径已从早期可行性研究病例推进到正在开展的 STAR 随机对照关键试验，目标覆盖不同手术风险层级的最多 1,025 名患者。
