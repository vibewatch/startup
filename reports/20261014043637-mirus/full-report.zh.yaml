              交易结构授予 Boston Scientific 一项 30 亿美元收购 TAVR 资产的独家选择权，实质上封顶了心血管业务的股权上行空间；如果临床里程碑 失败且选择权被放弃，MiRus
              将面临估值倍数大幅压缩的风险。
