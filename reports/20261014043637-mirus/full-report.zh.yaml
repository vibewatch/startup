        blocks:
          - type: paragraph
            body: >-
              从投资评估角度看，MiRus 拥有极强的公司合作伙伴画像，但私有财务报告高度不透明。$4.4B 隐含估值主要由 Boston Scientific 的战略验证支撑，而不是经审计的公开商业收入基本面。MiRus
              是股权高度集中的私营企业，不发布经审计的损益表、年度收入跑率或产品级毛利率。Forge Global
              等独立二级交易平台显示流动性有限，也没有成熟的交易价格历史，少数股东无法独立按市价估值或在短期内退出。因此，投资决策不能依赖历史现金流指标或成熟 EBITDA 倍数。机构投资评估者必须把 STAR
              试验临床里程碑达成和 Boston Scientific 最终行使期权视为主要经济回报驱动因素，并深入获取自有制造成本和保密交易条款。
