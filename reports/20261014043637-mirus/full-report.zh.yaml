      - number: '7.3'
        title: 战略合作伙伴依赖与商业化集中
        blocks:
          - type: paragraph
            body: >-
              MiRus 的战略资本结构和退出安排几乎全部押注于单一企业合作方：Boston Scientific Corporation。2026 年 5 月，Boston Scientific 以约 34% 的 MiRus
              股权为对价，完成 15 亿美元战略投资，使 MiRus 投后估值达到 44 亿美元。更关键的是，投资协议授予 Boston Scientific 一项独家选择权：在达到指定临床和监管里程碑后，Boston
              Scientific 可再支付合计 30 亿美元现金，收购 MiRus 全部 TAVR 业务。若该选择权行使，MiRus 仍保留基于 SIEGEL 瓣膜净销售额的未来业绩支付权，Boston Scientific
              还将获得收购二尖瓣和 三尖瓣置换瓣膜资产的进一步独家选择权。这一结构验证了 SIEGEL 平台，但也把公司的命运集中到单一战略交易对手手中。如果 STAR 试验 入组速度延迟，或出现不利临床信号，Boston
              Scientific 可单方面决定让选择权失效，MiRus 将面临高额临床烧钱、交易停滞，以及结构性心脏病
              领域有限的替代战略买家。在心血管资产之外，商业脊柱业务没有公开收入披露，因此无法确定商业骨科销售能否独立覆盖运营开支。
