  title: Customers
  summary: MiRus commercializes its MoRe-alloy spine implants across US hospitals and surgery centers while partnering with
    Boston Scientific on its pivotal STAR TAVR trial, though account retention and revenue concentration metrics remain private.
sections:
- id: customer-segmentation-and-buyer-dynamics
  title: Customer Segmentation and Buyer Dynamics
  body: MiRus addresses two distinct medical customer segments characterized by fundamentally different procurement dynamics
    and clinical buyer profiles. In its commercial-stage spine business, the primary clinical decision-makers are orthopedic
    spine surgeons and neurosurgeons performing cervical, lumbar, and complex deformity procedures across inpatient hospitals
    and ambulatory surgery centers. Purchasing authority, however, resides with hospital value analysis committees (VACs),
    group purchasing organizations (GPOs), and integrated delivery networks (IDNs). To establish commercial access, MiRus
    has secured distribution contracts across regional and national health systems. In structural heart disease, the customer
    dynamic centers on academic medical centers and cardiac catheterization laboratories evaluating the investigational Siegel
    8-Fr balloon-expandable TAVR platform. Unlike spine hardware sold directly through hospital purchasing channels, MiRus's
    structural heart commercialization pathway is structurally anchored to Boston Scientific Corporation, which holds an exclusive
    option to acquire the TAVR asset.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU010
  tableRefs:
  - TU001
- id: adoption-trajectory-and-clinical-milestones
  title: Clinical Adoption Trajectory and Evidence Milestones
  body: Because MiRus operates as a private life sciences entity, commercial account volumes, annual surgical case counts,
    and line-item implant revenues are not publicly disclosed. Adoption trajectory must therefore be tracked through regulatory
    milestones, portfolio clearances, and clinical trial expansion cadence. In spine, commercial adoption has progressed through
    a sequence of 510(k) clearances and FDA Breakthrough Device Designations for MoRe-based implants, including the Europa
    posterior cervical system and Cygnus anterior cervical plates. Reimbursement adoption was strengthened in August 2025
    when CMS granted a New Technology Add-on Payment (NTAP) for Europa, providing incremental Medicare payment to hospitals
    for cervicothoracic procedures. In February 2026, MiRus extended its orthopedic customer reach into foot and ankle surgery
    via the commercial launch of the IO Expandable Wedge Osteotomy System. For the structural heart platform, adoption has
    shifted from initial Early Feasibility Study cases into the active STAR pivotal randomized controlled trial targeting
    up to 1,025 patients across surgical risk profiles.
  claimRefs:
  - CU004
  - CU006
  - CU007
  - CU011
  - CU012
  - CU013
  tableRefs:
  - TU002
- id: named-customer-proof-and-institutional-adoption
  title: Named Institutional Customer Proof and Clinical Trials
  body: Publicly verified customer proof for MiRus is concentrated in high-visibility clinical trial institutions and strategic
    industry relationships. In structural heart, initial clinical deployments of the Siegel 8-Fr TAVR valve were executed
    at Piedmont Heart Institute in Atlanta under the leadership of Dr. Pradeep K. Yadav and Dr. Vinod H. Thourani, who treated
    the first sequential patients in both the Early Feasibility Study and the STAR pivotal randomized trial. Additional investigator
    proof emerged at Cedars-Sinai Heart Institute in Los Angeles, where Dr. Raj R. Makkar presented 30-day EFS clinical outcomes
    at the New York Valves symposium in July 2025. In the spine portfolio, specific hospital account names are protected under
    commercial confidentiality, but corporate distribution agreements cover leading surgery centers and hospital IDNs nationwide.
    Strategic customer validation is underscored by Boston Scientific's $1.5 billion investment for a 34% equity stake and
    structured $3.0 billion acquisition option, which aligns the TAVR system with a top-tier global distribution channel.
  claimRefs:
  - CU003
  - CU005
  - CU006
  - CU008
  tableRefs:
  - TU003
- id: customer-journey-and-retention-risks
  title: Surgeon Workflow, Procurement Friction, and Retention Diligence
  body: The customer adoption journey for MiRus implants requires navigating significant procurement and risk barriers inherent
    in hospital medical device purchasing. Value analysis committees frequently resist adding new spinal implant vendors unless
    clinical data or mechanical performance demonstrates clear superiority over incumbent titanium and cobalt-chromium systems.
    Industry rates of spine implant breakage and revision surgery remain a persistent clinical and financial concern for hospitals.
    MiRus mitigates surgeon and hospital purchasing hesitation through the MoRe Promise, a commercial warranty pledging to
    cover the cost of all revision implants if a MoRe rod fractures. However, private secondary trading markets and regulatory
    filings disclose no audited data on hospital reorder frequency, net revenue retention (NRR), or account-level churn. While
    surgeon feedback on the low-profile 2.9 mm rod diameter and 8-Fr TAVR delivery sheath is favorable, customer durability
    metrics across established orthopedic cohorts remain a central diligence gap.
  claimRefs:
  - CU001
  - CU008
  - CU009
  - CU010
  - CU014
  figureRefs:
  - FU001
