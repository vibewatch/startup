callouts:
- calloutType: insight
  title: Commercialization Bifurcation Between Spine Cash Flow and TAVR Option Upside
  body: 'MiRus maintains a dual commercialization posture: a commercial-stage spine business generating ongoing adoption across
    hospital GPO and IDN networks with warranty backing, and a high-stakes structural heart platform whose commercialization
    is effectively outsourced to Boston Scientific via a $3.0 billion acquisition option.'
  claimRefs:
  - CU001
  - CU003
- calloutType: risk
  title: Hospital Customer Concentration and Retention Opacity
  body: While MiRus has demonstrated investigator traction at premier academic institutions including Piedmont and Cedars-Sinai,
    customer retention rates, hospital reorder frequencies, and specific account concentrations remain completely undisclosed
    in private records.
  claimRefs:
  - CU005
  - CU014
