chapter:
  number: 8
  title: "Valuation"
  summary: "MiRus' $4.4 billion post-money valuation is anchored by Boston Scientific's $1.5 billion investment for an approximate 34% equity stake and structured $3 billion TAVR buyout option, but sustaining this enterprise value requires clinical execution in the STAR pivotal trial and commercial validation of its MoRe-alloy spine franchise where unaudited private financials remain unverified."
sections:
  - id: "investment-thesis-and-valuation-context"
    title: "Investment Thesis and Strategic Financing Structure"
    body: "MiRus presents an extraordinary strategic financing structure for a private medical technology business, marked by Boston Scientific Corporation's announcement on May 18, 2026, of a $1.5 billion investment for an approximate 34% equity stake. This transaction implicitly prices the Marietta, Georgia-based company at approximately $4.4 billion on a post-money basis. In addition to the direct equity purchase, the agreement grants Boston Scientific an exclusive option to acquire the MiRus transcatheter aortic valve replacement (TAVR) system for an additional $3 billion in cash, subject to clinical and regulatory milestones. If exercised, Boston Scientific secures 100% ownership of the TAVR business, MiRus retains rights to sales-based earnout payments on the SIEGEL valve, and Boston Scientific holds a follow-on option to purchase mitral and tricuspid valve assets. The central investment thesis rests on MiRus' proprietary molybdenum-rhenium superalloy (MoRe), which enables radical device miniaturization, including the 8 French SIEGEL TAVR delivery sheath and fracture-resistant spinal implants. However, the anti-thesis highlights that the current $4.4 billion valuation relies almost entirely on the speculative success of an unapproved cardiovascular asset in pivotal testing, while private financial statements, standalone commercial revenue, and gross margins for the commercialized orthopedic business remain opaque."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV013"
    tableRefs:
      - "TV001"
      - "TV002"
    figureRefs:
      - "FV001"
  - id: "scenarios-and-comparable-benchmarks"
    title: "Scenario Modeling, Downside Triggers, and Public-Private Comparables"
    body: "Evaluating MiRus' $4.4 billion valuation requires decomposing the corporate structure into its cardiovascular call option and its commercial spine-biomaterials foundation. In a bull case, the STAR pivotal trial meets non-inferiority or superiority endpoints across its 1,025-patient cohort, triggering Boston Scientific's $3 billion cash option exercise alongside commercial expansion of the EUROPA posterior cervical system, yielding high returns and net sales royalties. In the base case, pivotal trial execution proceeds on an extended timeline, delaying the option decision and requiring bridge financing, while spine revenue growth remains constrained by hospital purchasing dynamics. In a bear case, clinical setbacks in the STAR trial or cardiovascular adverse events prompt Boston Scientific to abandon its acquisition option, stranding equity holders in a standalone biomaterials firm whose spine revenue cannot support multi-billion-dollar valuation multiples. Comparable transactions demonstrate that large medtech strategics are divesting or deprioritizing conventional spine hardware—evidenced by Zimmer Biomet spinning off ZimVie, Stryker selling U.S. spinal implants to VB Spine, and Johnson & Johnson separating DePuy Synthes—placing immense pressure on MiRus to prove that MoRe alloy commands genuine pricing power rather than commoditized hardware economics."
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV008"
      - "CV009"
      - "CV010"
      - "CV011"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence-asks"
    title: "Exit Readiness, Diligence Asks, and Thesis-Break Triggers"
    body: "MiRus' path to liquidity is structurally intertwined with Boston Scientific's contractual call option, which establishes a predetermined acquisition route for the cardiovascular business while leaving the ultimate disposition of the spine and biomaterials franchise ambiguous. A recommendation of research-more with a stretched valuation stance reflects this structural bifurcation: public investors and secondary market participants cannot verify the underlying cap-table terms, liquidation preference waterfall, or minority shareholder protections negotiated alongside the $1.5 billion round. Secondary trading indications on private platforms such as Forge Global exhibit limited activity with unpriced bids and asks, preventing market-driven price discovery. Pre-investment diligence must prioritize four critical areas: first, obtaining verified enrollment cadence, site activation data, and adverse event logs from the STAR randomized trial; second, auditing private revenue, product-level gross margins, and customer concentration across the MoRe spine implant catalog; third, reviewing the exact contractual milestones governing Boston Scientific's $3 billion option; and fourth, monitoring thesis-break triggers including clinical trial halts, primary endpoint failure, or down-round recapitalizations."
    claimRefs:
      - "CV012"
      - "CV014"
      - "CV015"
      - "CV016"
