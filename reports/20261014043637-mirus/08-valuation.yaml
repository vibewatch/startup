callouts:
  - calloutType: "recommendation"
    title: "Capital Allocation Stance: Research-More at Headline Valuation"
    body: "While Boston Scientific's $1.5 billion investment provides extraordinary institutional validation, underwriting MiRus at a $4.4 billion headline valuation requires accepting unhedged binary clinical risk in the STAR trial and unverified private operating margins in spine. Investors should withhold direct equity commitments until pivotal trial interim safety and audited financials are available."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV007"
  - calloutType: "risk"
    title: "Strategic Option Overhang and Asymmetric Outcome Distribution"
    body: "The transaction structure grants Boston Scientific an exclusive option to purchase the TAVR asset for $3 billion, effectively capping equity upside on the cardiovascular franchise while leaving MiRus vulnerable to severe multiple compression if clinical milestones fail and the option is abandoned."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV009"
      - "CV010"
