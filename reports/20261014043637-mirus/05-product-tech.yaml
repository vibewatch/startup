chapter:
  number: 5
  title: "Product & Technology"
  summary: "MiRus develops and commercializes proprietary orthopedic, spine, extremity, and cardiovascular implants utilizing its proprietary MoRe molybdenum-rhenium superalloy platform, which delivers superior fatigue resistance and tensile strength over traditional titanium alloys to enable ultra-low-profile spine fixation systems and the investigational 8-French SIEGEL balloon-expandable TAVR valve currently undergoing pivotal clinical evaluation."
sections:
  - id: "product-definition-and-clinical-portfolio"
    title: "Product Definition and Clinical Portfolio"
    body: "MiRus defines its clinical product portfolio around high-performance implantable medical devices that replace conventional titanium and cobalt-chromium alloys with its proprietary MoRe molybdenum-rhenium superalloy. The company's commercialized portfolio is organized into specialized surgical systems spanning spine reconstruction, interbody fusion, and extremity deformity correction. Within spine surgery, the EUROPA Posterior Cervical Fusion system utilizes a 2.9 mm MoRe rod that substantially reduces hardware prominence compared to standard commercial constructs while maintaining structural rigidity. Complementing posterior instrumentation, the Cygnus MoRe anterior cervical plate and 3DR lateral lumbar interbody fusion systems provide low-profile fixation with 510(k) regulatory clearance. In extremities, MiRus commercializes the IO Expandable Wedge Osteotomy System, which incorporates the proprietary MoRe Expansion Engine to provide titratable intraoperative correction during Evans foot and ankle osteotomies. Across each application, MiRus positions its product line as premium hardware designed to reduce anatomical disruption and minimize revision surgical intervention."
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE001"
  - id: "material-science-and-more-superalloy-platform"
    title: "Material Science and the MoRe Superalloy Platform"
    body: "The foundation of MiRus's intellectual property and clinical differentiation is the MoRe molybdenum-rhenium superalloy, developed over fifteen years of materials science research inspired by high-temperature refractory metallurgy in aerospace propulsion. Medical-grade titanium and cobalt-chromium alloys face known biomechanical trade-offs between tensile strength, fatigue endurance, and biological inertness; repetitive physiological loading frequently causes rod notch sensitivity, hardware fatigue fracture, or local metallosis from ionic release. In contrast, the MoRe alloy demonstrates markedly higher fatigue strength, greater ductility, and lower metal-ion dissolution in surrounding tissue. To underscore the material's mechanical reliability in spine fusion, MiRus provides the MoRe Promise, a lifetime limited warranty program covering replacement MoRe rods and all associated EUROPA pedicle screw implant components if revision surgery is necessitated by rod fracture. This warranty represents an uncommon manufacturer guarantee in the orthopedic implant sector, reflecting high material confidence."
    claimRefs:
      - "CE002"
      - "CE003"
    figureRefs:
      - "FE001"
  - id: "siegel-tavr-architecture-and-delivery-differentiation"
    title: "SIEGEL TAVR Architecture and Delivery Differentiation"
    body: "MiRus's most strategically valuable development pipeline asset is the SIEGEL Balloon Expandable Transcatheter Aortic Valve Replacement (TAVR) system, designed for treating severe symptomatic aortic valve stenosis. Unlike legacy balloon-expandable valves that rely on cobalt-chromium frames, the SIEGEL valve incorporates a nitric oxide-coated rhenium frame with radial strength exceeding that of both cobalt and titanium alloys. This increased material strength allows for thinner frame struts while preserving radial expansion force, eliminating foreshortening during deployment, and facilitating precise anatomical alignment at the aortic annulus. Furthermore, the prosthesis uses dry porcine pericardial tissue leaflets and comes pre-mounted directly onto the delivery balloon. Uniquely, all three clinical valve diameters (23 mm, 26 mm, and 29 mm) are delivered through an 8 French expandable sheath. Because standard commercial TAVR delivery sheaths require 14 to 16 French access profiles, the SIEGEL sheath is approximately 50 percent smaller in cross-section, significantly reducing transfemoral vascular injury and access-site bleeding complications."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE002"
  - id: "clinical-maturity-operating-model-and-technical-risks"
    title: "Clinical Maturity, Operating Model, and Technical Risks"
    body: "MiRus's operating model combines in-house precision metallurgical manufacturing with clinical trial sponsorship and strategic corporate collaboration. Commercial distribution of spine and extremity implants provides ongoing cash flow and clinical validation, but the company's valuation upside is tied directly to the clinical progress of the SIEGEL TAVR system. In 2026, MiRus initiated the STAR pivotal trial, a prospective multicenter randomized controlled study evaluating safety and effectiveness in up to 1,025 patients across surgical risk profiles. Boston Scientific's $1.5 billion minority investment and $3 billion exclusive acquisition option establish strong corporate validation, yet significant technical and regulatory risks remain. The SIEGEL valve is an investigational device without commercial clearance in any jurisdiction. Transcatheter biological valves face inherent risks of long-term structural valve deterioration, calcific stiffening, paravalvular regurgitation, and thrombosis that require rigorous multi-year clinical endpoint verification before premarket approval can be achieved."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE003"
