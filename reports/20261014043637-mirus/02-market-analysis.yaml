- id: buyer-user-and-payer-segmentation
  title: Buyer, Clinical User, and Third-Party Reimbursement Segmentation
  body: Hospital procurement dynamics for MiRus products require navigating distinct decision-making hierarchies across interventional cardiology and orthopedic spine departments. For the investigational SIEGEL TAVR platform, clinical users are interventional cardiologists and cardiothoracic surgeons operating in hybrid catheterization laboratories. Institutional buyers include hospital cardiovascular service line directors, with reimbursement established under inpatient Medicare Severity Diagnosis Related Groups (MS-DRG 266 and 267) alongside commercial health plans. In contrast, commercial spine hardware adoption is driven by neurosurgeons and orthopedic spine specialists performing cervicothoracic fusions in surgical suites and ambulatory surgery centers. Hospital Value Analysis Committees (VACs) and materials management directors serve as the primary institutional gatekeepers, evaluating implant cost-effectiveness, clinical complication reduction, and revision surgery liabilities. MiRus
    actively addresses administrative cost sensitivity by offering a lifetime limited warranty on MoRe rods and associated Europa pedicle screw components, directly targeting the high clinical and hospital expense of adult spinal revision surgeries.
  claimRefs:
  - CM003
  - CM006
  - CM007
  - CM011
  - CM015
  tableRefs:
  - TM003
- id: adoption-drivers-and-structural-constraints
  title: Adoption Drivers, Structural Constraints, and Diligence Gaps
  body: Adoption velocity across MiRus's portfolio is governed by compelling material science advantages countered by rigid regulatory gates and private market opacity. In spine surgery, FDA Breakthrough Device Designation for the Europa system validates clinical demand for 2.9 mm MoRe rods, which allow low-profile screw tulips to reduce surgical invasiveness and hardware prominence in smaller patient anatomies. However, entrenched vendor relationships, multi-vendor hospital supply contracts with medtech conglomerates like Medtronic and Stryker, and surgeon switching friction create meaningful commercial headwinds. In cardiovascular TAVR, the SIEGEL valve offers distinct structural drivers—including an 8 French expandable delivery sheath that is approximately 50% smaller than existing commercial delivery sheaths and an open-cell frame that eliminates foreshortening without nickel. Nonetheless, near-term commercial adoption is completely barred until completion of the STAR trial and formal
    FDA premarket approval (PMA). Crucially, secondary market platforms such as Forge Global report limited private trading activity, and standalone spine product revenue figures remain undisclosed private facts, representing a material gap for independent market sizing.
