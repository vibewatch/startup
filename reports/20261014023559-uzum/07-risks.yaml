callouts:
  - calloutType: risk
    title: Credit and Underwriting Opacity in the Core Profit Vertical
    body: Fintech operations represent Uzum's primary profit generator, yet the group provides no public disclosure regarding non-performing loans, delinquency vintages, or loss provisioning across its $226 million gross loan portfolio and $421 million in BNPL originations.
    claimRefs:
      - CR011
      - CR014
  - calloutType: insight
    title: Proprietary Infrastructure as Both Moat and Capital Trap
    body: The complete absence of institutional third-party fulfillment providers in Uzbekistan forces Uzum to build and operate its own 125,000-square-meter warehouse network and 1,500 pickup points, creating a competitive barrier that simultaneously imposes severe ongoing capital expenditure and fixed payroll burden.
    claimRefs:
      - CR003
      - CR004
      - CR005
  - calloutType: recommendation
    title: Pre-IPO Thesis-Break Triggers and Monitoring Thresholds
    body: 'Investors should monitor two vital tripwires ahead of the planned 2026-2027 listing: any central bank intervention capping digital consumer lending margins below funding costs, or any failure to refinance the $50 million convertible instrument prior to scheduled maturity.'
    claimRefs:
      - CR006
      - CR014
