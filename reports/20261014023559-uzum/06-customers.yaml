company:
  name: "Uzum"
chapter:
  number: 6
  title: "Customers"
  summary: "Uzum has established nationwide consumer penetration in Uzbekistan, serving over 20 million monthly active users—more than half the national population—across integrated marketplace commerce, digital banking, and express delivery. Customer acquisition is anchored in e-commerce and rapidly cross-sold into Sharia-compliant BNPL lending and digital cards, though customer retention curves, cohort churn, and delivery unit economics remain undisclosed diligence gaps."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation & Multi-Sided Demographics"
    body: "Uzum operates a multi-sided ecosystem serving four distinct customer segments: mass-market retail consumers, digital banking clients, installment credit borrowers, and commercial merchants. Mass-market consumers represent the largest user base, engaging with the Uzum Market marketplace across both major urban metropolitan hubs and over 450 regional cities and towns. Consumers in Uzbekistan demonstrate high smartphone penetration alongside low historical formal banking access, creating favorable conditions for a unified super-app model. On the supply side, Uzum segments merchants into third-party marketplace sellers, partner dining establishments on Uzum Tezkor, and vehicle dealerships on Uzum Avto, creating self-reinforcing network effects between buyer demand and commercial inventory."
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001
  - id: "adoption-trajectory-ecosystem-scale"
    title: "Adoption Trajectory & Ecosystem Scale"
    body: "The adoption trajectory of Uzum has accelerated dramatically since the marketplace launched in October 2022. Ecosystem monthly active users (MAU) expanded from approximately 8 million in early 2024 to nearly 16 million by the end of 2024, representing 40% of Uzbekistan's population. By early 2026, monthly active user metrics surpassed 20 million, reaching more than half of the national population. This user growth has been accompanied by a rapid expansion of commercial activity, with e-commerce gross merchandise value growing from $150 million in 2023 to $345 million in 2024 and exceeding $500 million in 2025. This rapid adoption highlights strong consumer resonance in a retail market historically dominated by informal bazaar trade."
    claimRefs:
      - CU004
      - CU005
      - CU006
      - CU007
    tableRefs:
      - TU002
  - id: "merchant-enterprise-proof"
    title: "Merchant & Partner Enterprise Proof"
    body: "Commercial proof of adoption is evidenced by the rapid onboarding of domestic and international merchants across Uzum's platforms. Uzum Market scaled its seller base from 9,000 merchants in early 2024 to more than 18,000 active sellers by 2026, expanding the available catalog from 600,000 SKUs to over 1 million domestic items and international selections. Uzum Tezkor expanded its restaurant partnerships to over 3,000 cafes and eateries across 26 cities, establishing a major express delivery footprint. Furthermore, Uzum Avto has integrated approximately 300 automotive dealerships to provide instant digital loan approvals. While merchant growth demonstrates strong commercial demand, the absence of granular seller concentration disclosures leaves open questions regarding dependency on top merchant accounts."
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
    tableRefs:
      - TU003
  - id: "retention-cross-sell-durability"
    title: "Retention Loops, Cross-Sell Mechanics & Durability"
    body: "Customer retention and durability within Uzum rely on closed-loop ecosystem mechanics that cross-sell e-commerce shoppers into financial products. Customers acquired through low-friction retail purchases are converted into fintech users via Uzum Nasiya, which powers more than 50% of marketplace transactions. The Sharia-compliant positioning of Uzum's lending solutions provides cultural alignment for an estimated 85% of Uzbekistan's population, lowering friction for credit adoption. Once onboarded into financing, users transition into daily digital banking through Uzum Bank, which has issued over 4 million Visa debit cards. However, corporate disclosures do not provide audited cohort retention curves, repeat purchase frequencies, or long-term consumer churn, presenting an ongoing diligence gap."
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
    figureRefs:
      - FU001
