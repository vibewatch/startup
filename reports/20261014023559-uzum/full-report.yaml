chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Ecosystem Architecture
        blocks:
          - type: paragraph
            body: >-
              Uzum operates as the leading digital platform and super-app ecosystem in Uzbekistan, offering an
              interconnected consumer and merchant stack that spans online marketplace retail, express delivery, digital
              and licensed commercial banking, buy now pay later credit, and merchant infrastructure. Formally founded
              in 2022, the group combines operational entities based in Tashkent under corporate parent Uzum Holding
              Ltd, registered in Abu Dhabi Global Market. By integrating daily transactional touchpoints across commerce
              and financial services, Uzum engages more than 20 million monthly users, representing more than half of
              the national population. For FY2025, the group reported unaudited consolidated revenue of $691 million and
              net profit of $176 million, supported by an e-commerce gross merchandise value surpassing $500 million and
              total payment volume exceeding $11.1 billion. Headcount across logistics, financial technology, corporate
              functions, and customer support exceeds 14,000 employees.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Founders, Governance, and Key-Person Assessment
        blocks:
          - type: paragraph
            body: >-
              The ecosystem was established in 2022 by chief executive officer Djasur Djumaev alongside co-founders
              Nikolay Seleznev and Roman Lavrentyev, pairing local commercial execution with international platform
              management experience. Operational decision-making remains centralized around Djumaev, while corporate
              strategy, institutional investor relations, and capital allocation are directed by Seleznev. Executive
              management has integrated banking talent through majority-controlled JSCB Kapitalbank and fintech leaders
              overseeing Uzum Bank and Uzum Nasiya. Early corporate reporting in 2023 generated media scrutiny regarding
              potential advisory roles and option incentives tied to former VK chief executive Boris Dobrodeev; however,
              Uzum corporate representatives issued explicit denials confirming Dobrodeev never held equity shares or
              options in the holding company. Detailed disclosure regarding board committee oversight, independent
              director representation, and minority shareholder voting protections remains limited.
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: Capitalization History, Valuation Progression, and Stakeholder Mapping
        blocks:
          - type: paragraph
            body: >-
              Uzum achieved unicorn status in March 2024 with a $114 million Series A round led by FinSight Ventures
              with participation from Xanara Investment Management, valuing the company at $1.16 billion post-money.
              Capital expansion accelerated in August 2025 with a $70 million equity round co-led by Tencent and VR
              Capital at a $1.5 billion valuation. In March 2026, Uzum closed a strategic financing exceeding $130
              million anchored by sovereign entities of the Sultanate of Oman alongside existing backers, establishing a
              $2.3 billion pre-money valuation reference point. The 2026 transaction incorporated primary equity and
              structured capital with conversion economics tied to an upcoming Series B round. Capital resources are
              augmented by non-dilutive credit facilities, including a digital economy loan from the Eurasian
              Development Bank that expanded from $70 million to $100 million in 2026, alongside corporate bond issues
              placed on the Tashkent Republican Stock Exchange.
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Operational Milestones and Growth Trajectory
        blocks:
          - type: paragraph
            body: >-
              The group's operational evolution reflects rapid expansion from a single marketplace into a multi-vertical
              regional champion. Uzum Market launched in October 2022, rapidly building nationwide fulfillment
              infrastructure that expanded to 1,500 pickup points across more than 450 localities by early 2026.
              Financial services quickly emerged as the core engine of monetization, with consumer installment platform
              Uzum Nasiya disbursing $1.2 billion in 2025 and digital bank Uzum Bank issuing over 7 million Visa cards.
              Integration with commercial banking asset Kapitalbank broadened institutional reach, growing the bank's
              loan book to $3.1 billion and deposits to $3.7 billion by year-end 2025. International rating recognition
              followed, with Fitch Ratings upgrading Uzum's Long-Term Issuer Default Rating from B to B+ with a Stable
              Outlook in September 2026, citing deepening operational synergies across banking, retail commerce, and
              digital payments.
            claimRefs:
              - CO004
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
