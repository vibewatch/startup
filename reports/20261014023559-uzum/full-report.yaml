    data:
      layers:
        - label: User Engagement & Touchpoints
          detail: Consumer mobile super-apps, merchant management portal, web portals, and instant Telegram bot interactions.
        - label: E-Commerce & Delivery Engine
          detail: >-
            Uzum Market marketplace catalog, search and recommendation services, and Uzum Tezkor express dispatch
            algorithms.
        - label: Digital Banking & Credit Platform
          detail: >-
            Uzum Bank core banking ledger, localized card processing host, and Uzum Nasiya Sharia-compliant scoring and
            installment engine.
        - label: Data Streaming & Storage Layer
          detail: >-
            Apache Kafka event streaming pipelines, PostgreSQL relational databases for core transactions, and Redis
            distributed caching.
        - label: Compute & Deployment Infrastructure
          detail: >-
            Containerized microservice clusters orchestrated with Kubernetes across localized server environments and
            cloud infrastructure.
        - label: Physical Logistics & Fulfillment Network
          detail: >-
            Centralized sorting complexes, nationwide fleet logistics, regional distribution hubs, and branded pickup
            points.
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Multi-stage customer adoption lifecycle illustrating top-of-funnel marketplace entry, BNPL conversion, habitual
      delivery engagement, and deepening into digital banking and merchant services.
    data:
      items:
        - label: Discovery & Marketplace Entry
          role: New Consumer / Buyer
          stage: Top-of-Funnel Acquisition
          touchpoints:
            - Uzum Market app download
            - E-commerce catalog browsing
          detail: Consumers enter through low-friction product search and next-day delivery promises across 450+ localities.
        - label: Initial Checkout & BNPL Activation
          role: Transacting Shopper
          stage: First-Order Conversion
          touchpoints:
            - Uzum Nasiya installment checkout
            - Instant identity verification
          detail: Sharia-compliant instalment payment option converts first-time online shoppers into credit-linked consumers.
        - label: High-Frequency Express Delivery
          role: Active Consumer
          stage: Habitual Daily Usage
          touchpoints:
            - Uzum Tezkor food orders
            - On-demand grocery delivery
          detail: Frequent meal and grocery orders across 26 cities deepen weekly engagement and app retention.
        - label: Banking & Card Adoption
          role: Fintech User
          stage: Financial Deepening
          touchpoints:
            - Uzum Bank Visa debit card
            - P2P card-to-card transfers
          detail: Users adopt digital debit cards with revolving credit limits and commission-free Uzcard/Humo transfers.
        - label: Merchant Onboarding & Catalog Listing
          role: SME Merchant / Seller
          stage: Commercial Integration
          touchpoints:
            - Uzum Business portal
            - Logistics warehouse fulfillment
          detail: Merchants onboard to access 20M monthly users, utilizing FBM warehousing and DBS delivery channels.
        - label: Ecosystem Expansion & Cross-Sell
          role: Ecosystem Power User
          stage: Multi-Vertical Retention
          touchpoints:
            - Uzum Avto vehicle financing
            - Merchant payroll and tax tools
          detail: >-
            High-value car purchases and integrated merchant enterprise tools lock in both consumers and business
            owners.
    approximationNotes: >-
      Journey stages and conversion mechanics reflect published super-app architecture and disclosed cross-sell
