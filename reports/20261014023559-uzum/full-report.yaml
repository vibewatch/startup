              - CI004
              - CI006
      - number: '4.2'
        title: Operating Cost Structure, Unit Economics, and Credit Dynamics
        blocks:
          - type: paragraph
            body: >-
              The group's cost structure reflects a balance between capital-intensive logistics infrastructure and
              highly accretive digital financial services. In commerce, Uzum invested heavily in physical
              infrastructure, operating Central Asia's largest warehousing facility and countrywide logistics pickup
              points enabling next-day delivery across 26 cities. Food and express delivery via Uzum Tezkor adds
              variable courier costs across more than 3,000 partner restaurants and merchants. However, management
              strategy identifies fintech and consumer lending as the primary drivers of group profitability. In 2025,
              consolidated net income reached $176 million (up from $150 million unaudited net income reported for
              FY2024), demonstrating corporate-level profitability. However, detailed credit loss provisioning, BNPL
              non-performing loan (NPL) vintages, and capital reserve adequacy for the $400 million loan portfolio are
              undisclosed in top-line press statements. Because consumer financing finances over 50% of Uzum Market
              orders, the true unit margin of marketplace retail is deeply intertwined with credit subsidization and
              financing yields.
            claimRefs:
              - CI001
              - CI006
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI008
      - number: '4.3'
        title: Capital Adequacy, Financing Dependency, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Uzum's forward capitalization was reinforced on March 10, 2026, when the holding company completed a
              $131.5 million financing round led by sovereign wealth funds from Oman alongside existing shareholders
              Tencent, VR Capital, and FinSight Ventures. The transaction was structured as $81.5 million in primary
              equity and $50 million in convertible financing, establishing a $2.3 billion pre-money valuation
              benchmark. Total cumulative funding stands at approximately $367 million according to private company
              tracking datasets. Management indicated plans to raise a further $250 million to $300 million pre-IPO
              round in late 2026 or early 2027 ahead of a public listing. From a diligence perspective, Uzum
              demonstrates strong self-reported profitability ($176 million net profit) and substantial international
              sovereign backing. Nonetheless, new common equity underwriting is constrained by convertible debt
              conversion terms tied to the next qualified round, unaudited segment accounting, regulatory capital
              requirements in regulated banking entities, and currency risk in the Uzbek som.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demonstrated Group-Level Net Profitability
            body: >-
              Unlike typical emerging-market e-commerce unicorns burning venture capital, Uzum reported $176 million in
              net income for 2025 on $691 million in revenue. The combination of high-margin fintech products,
              Sharia-compliant installment finance, and payment acquiring provides an internal cash engine that
              subsidizes fulfillment infrastructure.
            calloutType: strength
            claimRefs:
              - CI001
              - CI006
          - type: callout
            title: Structured Capital Terms and Lack of Segment Audit
            body: >-
              The March 2026 funding round included $50 million of convertible debt alongside $81.5 million in equity,
              with conversion mechanics tied to future rounds. Combined with the absence of audited segment financial
              statements, potential equity investors face valuation uncertainty regarding true credit loss vintages and
              capital adequacy.
            calloutType: risk
            claimRefs:
              - CI012
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Ecosystem Architecture and Customer Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Uzum's core commercial architecture is designed around an integrated consumer ecosystem that bridges
              retail e-commerce, food delivery, and digital financial services into a synchronized customer journey. The
              ecosystem combines the nationwide marketplace Uzum Market, express food delivery service Uzum Tezkor,
              digital neobank Uzum Bank, and consumer installment provider Uzum Nasiya. Rather than maintaining
              disparate operational entities, the group unifies consumer identity and transactions so that users
              purchasing retail goods on Uzum Market transition seamlessly into digital bank cardholders and installment
              borrowers. Over 50% of e-commerce checkout payments are routed directly through in-house fintech rails,
              and more than half of marketplace orders are financed via Uzum Nasiya's Sharia-compliant installment
              infrastructure. This closed-loop financial integration minimizes third-party payment processing fees,
              mitigates merchant checkout drop-off, and provides a continuous transaction loop across retail and banking
              touchpoints.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
