    title: Ecosystem Product and Technology Architecture Stack
    type: stack
    summary: >-
      Six-layer architectural stack spanning user touchpoints, commerce applications, banking engines, shared data
      services, container infrastructure, and physical logistics.
    approximationNotes: >-
      Architectural layers reflect reported microservices and operational infrastructure; internal proprietary service
      boundaries are unverified.
