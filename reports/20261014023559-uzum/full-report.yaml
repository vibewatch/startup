        title: Exhibits
        blocks:
          - type: callout
            title: Fintech Integration as the Central Profit Driver
            body: >-
              While Uzum established market presence via nationwide e-commerce, consumer installments (Uzum Nasiya) and
              integrated payments have become the primary profit generators, accounting for over $1.2 billion in credit
              disbursements and enabling consolidated net income of $176 million.
