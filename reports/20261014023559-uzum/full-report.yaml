              - CU012
              - CU013
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dominant Population Reach via Super-App Synergy
            body: >-
              Uzum captures over 20 million monthly active users, representing more than 50% of Uzbekistan's total
              population, creating self-reinforcing acquisition funnels from retail commerce into high-margin fintech
              products.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
          - type: callout
            title: Customer Concentration in Unaudited BNPL Disclosures
            body: >-
              While installment transactions drive more than 50% of marketplace order volume, the lack of audited
              disclosures regarding cohort retention, credit loss vintages, and consumer delinquency creates material
              diligence uncertainty.
            calloutType: risk
            claimRefs:
              - CU003
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory Framework, Banking Licenses, and Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              Uzum operate within a rapidly formalizing Central Asian regulatory landscape that poses distinct
              institutional and compliance risks. The group operates domestically through foreign enterprise limited
              liability entities that are ultimately consolidated under UMARKET SPV LTD, an offshore holding company
              registered in the Abu Dhabi Global Market. While this international holding structure provides legal
              protections for foreign sovereign and institutional equity partners such as the Oman Investment Authority
              and Tencent, it creates jurisdictional complexity regarding cross-border dividend repatriation, bilateral
              tax residency, and local regulatory oversight. Domestically, the group's financial backbone relies on
              licensed commercial operations through Uzum Bank, which was rebranded from Bank Apelsin, alongside
              strategic majority control of JSCB Kapitalbank. Integrating banking deposits and digital consumer credit
              within a commercial marketplace requires ongoing compliance with Central Bank of Uzbekistan capital
              adequacy standards, anti-money laundering frameworks, and digital banking reserve thresholds. While the
              early founding phase exhibited corporate opacity regarding managerial equity allocation and shareholder
              registers, the corporate entity now interfaces directly with state regulatory clearinghouses, making any
              sudden tightening in non-bank consumer lending or microfinance licensing a primary threat to consolidated
              profitability.
            claimRefs:
              - CR001
              - CR002
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR008
      - number: '7.2'
        title: Operational Reliability, Logistics Scaling, and Execution Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Unlike e-commerce operators in mature markets who leverage mature commercial courier networks, Uzum has
              been compelled to build an end-to-end physical fulfillment infrastructure entirely on its own balance
              sheet. The profound absence of institutional third-party logistics and fulfillment providers across
              Uzbekistan means that next-day delivery promises depend entirely on proprietary sorting centers, localized
              delivery fleets, and a national network of approximately 1,500 pickup points. The company currently
              utilizes roughly 125,000 square meters of operational warehouse capacity and has committed substantial
              capital toward developing four major regional distribution complexes designed to expand total storage
              toward 500,000 square meters. While this proprietary asset footprint establishes a formidable competitive
              moat against regional entrants, it transforms Uzum into an infrastructure-heavy enterprise subject to
              construction delays, leasehold inflation, and operational execution bottlenecks. Furthermore, scaling
              physical distribution alongside digital banking has expanded the total corporate headcount above 12,500
              people, rising toward more than 14,000 employees. This massive payroll creates high fixed operational
              overhead and exposes margins to acute wage inflation, labor compliance burdens, and frontline warehouse
              retention friction as fulfillment volumes multiply.
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
      - number: '7.3'
        title: Financial Model, Credit Exposure, and Capital Structure Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              The central economic vulnerability of the Uzum ecosystem lies in the disproportionate reliance of group
              profitability on unsecured consumer lending. While marketplace GMV reached $345 million in 2024 and
              surpassed $500 million in 2025, executive disclosures confirm that retail e-commerce operates near
              breakeven, with digital fintech serving as the dominant profit engine. Buy-now-pay-later financing powers
              between 45% and 50% of all marketplace sales, directly linking GMV expansion to balance sheet credit
              growth. In FY2024 alone, BNPL transaction financing volume reached $421 million, and the gross consumer
              loan portfolio expanded to $226 million across more than 6 million issued cards. However, Uzum provides no
              audited visibility into delinquency vintage migration, non-performing loan write-offs, or loss
              provisioning reserves. Because a large fraction of merchandise purchases are facilitated by internal
              installment credit, any macroeconomic shock, regional currency depreciation, or real wage contraction in
              Uzbekistan would trigger surging credit loss rates that directly impair core net income. On the funding
              side, Uzum carries significant structural leverage, including historical Series A debt of $62 million,
              subsequent institutional lines such as $70 million from the Eurasian Development Bank, and a recent $50
              million convertible instrument from Oman-led investors tied to pre-IPO benchmarks. A failure to achieve
              target pre-IPO pricing between $250 million and $300 million could create severe dilution overhang or
              refinancing friction.
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Mitigations, Monitoring Indicators, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Uzum has established credible operational mitigations across its primary risk verticals, including
              Sharia-compliant certification for its consumer credit products, multi-channel payment rail redundancy
              across Visa and domestic switches, and long-term equity alignment with top-tier sovereign and strategic
              backers. Nevertheless, institutional investors must track rigorous thesis-break indicators to evaluate
              position durability. The primary operational kill criterion is a sustained surge in consumer lending
              delinquency that degrades fintech operating margins below the cost of institutional wholesale debt. A
              second regulatory break trigger would occur if the Central Bank of Uzbekistan introduces restrictive
              interest rate caps or statutory leverage ceilings on non-bank BNPL originations, severing the financial
              cross-subsidy that underpins retail e-commerce logistics. A third corporate break condition involves
              capital structure execution: if regional market volatility prevents the closing of the targeted $250
              million to $300 million pre-IPO financing round in late 2026 or early 2027, the conversion mechanics of
              the $50 million convertible note could trigger punitive equity dilution or acute working capital
              contraction. Diligence must focus on obtaining unredacted IFRS loan loss vintage schedules and verified
              Central Bank inspection documentation.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR011
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Credit and Underwriting Opacity in the Core Profit Vertical
            body: >-
              Fintech operations represent Uzum's primary profit generator, yet the group provides no public disclosure
              regarding non-performing loans, delinquency vintages, or loss provisioning across its $226 million gross
              loan portfolio and $421 million in BNPL originations.
            calloutType: risk
            claimRefs:
              - CR011
              - CR014
          - type: callout
            title: Proprietary Infrastructure as Both Moat and Capital Trap
            body: >-
              The complete absence of institutional third-party fulfillment providers in Uzbekistan forces Uzum to build
              and operate its own 125,000-square-meter warehouse network and 1,500 pickup points, creating a competitive
              barrier that simultaneously imposes severe ongoing capital expenditure and fixed payroll burden.
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: Pre-IPO Thesis-Break Triggers and Monitoring Thresholds
            body: >-
              Investors should monitor two vital tripwires ahead of the planned 2026-2027 listing: any central bank
              intervention capping digital consumer lending margins below funding costs, or any failure to refinance the
              $50 million convertible instrument prior to scheduled maturity.
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Recommendation
        blocks:
          - type: paragraph
            body: >-
              Uzum presents an extraordinary emerging-market digitization narrative, having established Uzbekistan's
              premier horizontal ecosystem spanning e-commerce, express food delivery, payments, digital banking, and
              installment financing. With over 20 million monthly users reaching more than half of the national
              population, the platform enjoys strong local network effects and high consumer mindshare. The core
              investment thesis rests on the self-reinforcing flywheel where high-frequency consumer touchpoints in
              retail and logistics generate low-cost acquisition for high-margin financial services, notably through
              Uzum Bank and Uzum Nasiya. However, the anti-thesis centers on extreme single-country macroeconomic
              exposure, emerging regulatory scrutiny on consumer debt products, and the absence of fully audited segment
              accounting. Balances between high operating momentum and valuation terms lead to an overall recommendation
              of track with a fair-to-stretched valuation stance and a high risk rating.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: Financing History and Valuation Context
        blocks:
          - type: paragraph
            body: >-
              The group's capital structure has expanded rapidly across multiple landmark rounds. In March 2024, Uzum
              achieved tech unicorn status with a $114 million Series A round at a $1.16 billion post-money valuation
              led by FinSight Ventures, structured with $52 million in equity and $62 million in debt while diluting
              under 5% of common equity. Growth accelerated in August 2025 with an additional $70 million round at a
              $1.5 billion mark backed by Tencent and VR Capital. Most recently, in March 2026, Uzum announced a
              strategic investment exceeding $130 million led by sovereign wealth entities from the Sultanate of Oman,
              benchmarking pre-money valuation at approximately $2.3 billion. This latest transaction blends $81.5
              million of primary equity with $50 million of structured convertible financing tied to future qualified
              rounds, introducing preference overhang that institutional investors must carefully evaluate.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: Scenario Analysis and Valuation Ranges
        blocks:
          - type: paragraph
            body: >-
              Evaluating forward returns across 12- to 24-month investment horizons requires segmenting potential
              operating outcomes into distinct bull, base, and bear scenarios. In the bull case (25% probability),
              ecosystem monthly active users expand toward 25 million, payment total payment volume exceeds $18 billion,
              and e-commerce scale delivers operating leverage sufficient to support an international initial public
              offering above $3.5 billion at 3.5x to 4.0x revenue multiples. In the base case (55% probability), Uzum
              defends domestic leadership with steady 20% to 30% top-line growth, generating sustainable net margins
              while maintaining valuation in the $2.3 billion to $2.6 billion corridor. Conversely, the bear case (20%
              probability) models tighter Central Bank intervention on installment lending caps, consumer credit
              defaults across the $1.2 billion BNPL book, and macroeconomic currency shocks, contracting sustainable
              equity valuation below $1.5 billion and activating preference protections.
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
      - number: '8.4'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Institutional readiness for an ultimate liquidity event or overseas public listing requires resolving
              several material diligence gaps. First, investors require comprehensive visibility into the conversion
              mechanics, seniority rights, and liquidation multiples embedded within the $50 million convertible tranche
              of the March 2026 funding. Second, given that Uzum's profitability is primarily driven by fintech
              operations rather than asset-heavy e-commerce, audited segment-level disclosure is essential to
              substantiate underlying unit economics. Third, credit portfolio performance across Uzum Bank and
              Kapitalbank must be benchmarked against macroeconomic indicators to detect rising non-performing loan
              trends early. Primary thesis-break triggers that would prompt a downgrade to avoid include any regulatory
              action capping installment markups, material market share loss in core marketplace logistics to
              cross-border competitors like Wildberries, or evidence of deteriorating credit recovery.
            claimRefs:
              - CV003
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Stance: Track'
            body: >-
              Uzum has established undeniable domestic market leadership across commerce, banking, and consumer payments
              in Uzbekistan. However, entering at the $2.3 billion headline valuation requires greater clarity regarding
              the convertible terms of the Oman sovereign investment, audited segment margins, and consumer credit loss
              rates.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
