  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform / Segment
      - Price / Unit / Contract Model
      - Included Capabilities
      - Discount or Unknown Terms
      - Strategic Diligence Implication
    rows:
      - - Uzum Market & Nasiya
        - Merchant commission (3-15%) plus 0% consumer BNPL
        - End-to-end warehousing, last-mile delivery, payment processing
        - Volume rebates and category commission schedules undisclosed
        - Ecosystem subsidizes marketplace fulfillment via high-margin BNPL credit
      - - TBC Bank / Payme
        - P2P transfer fees (0.5-1%) and merchant acquiring rates
        - Payment gateway, mobile bill pay, P2P card transfers, digital deposits
        - Commercial acquiring discount rates negotiated bilaterally with SMEs
        - Monetizes transaction velocity; lacks e-commerce commission upside
      - - Wildberries / Ozon
        - Seller marketplace commission (5-18%) plus cross-border logistics fee
        - Catalog listing, international customs routing, regional pickup points
        - Tariff fluctuations and cross-border currency conversion margins
        - Higher gross margins on cross-border goods offset by tariff uncertainties
      - - Informal Social Commerce
        - 0% platform commission; direct cash or P2P card transfer
        - Direct chat selling on Telegram/Instagram without buyer protection
        - No standardized return policy or transaction insurance costs
        - Sets consumer zero-fee baseline expectation but lacks fulfillment scale
    notes: Fee structures reflect standard public marketplace take-rates and payment acquiring schedules; specific seller tier rebates and bilateral banking fees are private.
