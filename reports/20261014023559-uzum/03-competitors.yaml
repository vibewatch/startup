  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / Funding
      - Target Segment
      - Differentiation
      - Limitation
    rows:
      - - TBC Uzbekistan (Payme)
        - Fintech & Digital Banking
        - Subsidiary of listed parent TBC Bank Group
        - Mass retail consumers, mobile payers, and SMEs
        - Strong P2P payment market share and established brand recognition
        - Limited first-party physical logistics and retail e-commerce presence
      - - Wildberries
        - Cross-Border E-commerce
        - Major private Russian e-commerce operator
        - Online shoppers seeking broad apparel and consumer goods
        - Massive catalog depth and established pickup point network
        - Longer cross-border delivery times and currency/sanction exposure
      - - Ozon
        - Cross-Border E-commerce
        - Publicly listed Russian multi-category marketplace
        - Price-sensitive online retail shoppers
        - Cross-border logistics capabilities and branded pickup points
        - Lack of integrated Uzbek licensed banking and local BNPL engine
      - - Click
        - Payments & FinTech
        - Established private domestic payment platform
        - National mobile wallet users and utility payers
        - Pervasive QR payment acceptance and high bill-pay transaction volume
        - Pure-play payments provider without integrated commerce marketplace
      - - Alif
        - Islamic FinTech & BNPL
        - Regional venture-backed fintech operator
        - Faith-conscious consumers and installment shoppers
        - Sharia-compliant financial branding and dedicated merchant partnerships
        - Smaller active consumer base and narrower product catalog vs Uzum
