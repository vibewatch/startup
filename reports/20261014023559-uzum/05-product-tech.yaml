callouts:
  - calloutType: "insight"
    title: "Closed-Loop Fintech Integration Drives E-Commerce Conversion"
    body: "Uzum's structural competitive moat lies in the symbiotic integration of payment and credit infrastructure into consumer e-commerce. With more than 50% of marketplace payments processed via proprietary fintech and over half of orders financed through Uzum Nasiya, the company reduces merchant payment friction and customer cart abandonment while capturing incremental interchange and interest margin."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE012"
  - calloutType: "risk"
    title: "Microservices Fragmentation and Scalability Overhead"
    body: "While autonomous microservices enabled rapid time-to-market across disparate banking and delivery business units, technical leadership acknowledges the mounting challenge of harmonizing heterogeneous platforms without accumulating legacy drag. October 2026 service disruptions emphasize that infrastructure reliability under high-load scaling remains an active operational risk."
    claimRefs:
      - "CE006"
      - "CE009"
      - "CE010"
