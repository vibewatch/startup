  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Evidence & Drivers
      - What Would Change The View
    rows:
      - - Investment Thesis
        - Dominant national digital ecosystem with self-reinforcing flywheel
        - 20M monthly users, >50% population reach, marketplace and fintech synergy
        - Slowing user growth or marketplace share loss to foreign platforms
      - - Investment Thesis
        - Fintech monetization engine powers self-funded infrastructure
        - $1.2B BNPL disbursements, 4M+ Visa cards issued, $176M net profit
        - Margin compression from rising funding costs or regulatory interest rate caps
      - - Anti-Thesis
        - Single-country macroeconomic and currency concentration risk
        - 100% of operations in Uzbekistan; banking and BNPL credit book exposed to local shock
        - Successful geographic expansion into neighboring Central Asian markets
      - - Anti-Thesis
        - Valuation overhang and structured preference liquidation seniority
        - $130M+ round includes $50M convertible capital with round-linked conversion terms
        - Full public disclosure of clean cap table and common equity terms
    notes: Core investment thesis pillars versus anti-thesis counterarguments, with monitorable thesis-break triggers.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Signal
      - Operating & Growth Assumptions
      - Implied Valuation / Return Logic
      - Downside Triggers & Risks
    rows:
      - - Bull Case
        - 25%
        - Ecosystem MAU reaches 25M; fintech TPV exceeds $18B; clean IPO at >$3.5B
        - 3.5x+ EV/revenue multiple on >$1B revenue; 25%+ IRR for growth investors
        - Execution bottlenecks in logistics or foreign platform price wars
      - - Base Case
        - 55%
        - Stable leadership in Uzbekistan; steady 20-30% GMV growth; $2.3B-$2.6B valuation
        - Hold value at 3.0-3.5x revenue; moderate equity dilution from Series B
        - Rising consumer credit defaults or slower banking cross-sell conversion
      - - Bear Case
        - 20%
        - Central Bank limits BNPL margins; currency depreciation; valuation down-round to <$1.5B
        - Structured capital absorbs downside; common equity suffers significant dilution
        - Macro shock, regulatory cap on BNPL fees, or banking credit losses
    notes: Scenario models estimating 12-24 month return profiles and downside protection mechanisms under distinct macroeconomic and regulatory conditions.
    claimRefs:
      - CV008
      - CV009
      - CV010
