callouts:
  - calloutType: "strength"
    title: "Demonstrated Group-Level Net Profitability"
    body: "Unlike typical emerging-market e-commerce unicorns burning venture capital, Uzum reported $176 million in net income for 2025 on $691 million in revenue. The combination of high-margin fintech products, Sharia-compliant installment finance, and payment acquiring provides an internal cash engine that subsidizes fulfillment infrastructure."
    claimRefs:
      - "CI001"
      - "CI006"
  - calloutType: "risk"
    title: "Structured Capital Terms and Lack of Segment Audit"
    body: "The March 2026 funding round included $50 million of convertible debt alongside $81.5 million in equity, with conversion mechanics tied to future rounds. Combined with the absence of audited segment financial statements, potential equity investors face valuation uncertainty regarding true credit loss vintages and capital adequacy."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI016"
