companyProfile:
  summary: >-
    Uzum is Uzbekistan's leading digital ecosystem, combining marketplace commerce, express delivery, payments, digital
    banking, BNPL, and merchant tooling into one consumer and merchant platform. Founded in 2022 and operating from
    Tashkent under a broader ADGM holding structure, the company reached more than 20 million monthly active users and
    reported unaudited FY2025 revenue of $691 million and net profit of $176 million.
