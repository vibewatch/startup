figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Uzum 从创立、电商平台上线，到成为独角兽并获得主权资本战略支持的演进时间线。
    data:
      items:
        - label: 生态创立
          date: '2022-03-15'
          detail: Djasur Djumaev 与乌兹别克斯坦合作伙伴创立 Uzum；公司在 ADGM 控股架构下注册。
        - label: 电商平台上线
          date: '2022-10-01'
          detail: Uzum Market 开始商业运营，建成首批履约中心并提供次日配送。
        - label: A 轮独角兽融资
          date: '2024-03-26'
          detail: FinSight Ventures 领投 1.14 亿美元融资，使公司成为乌兹别克斯坦首家科技独角兽，估值达 $1.16B。
        - label: Tencent 成长股权融资
          date: '2025-08-05'
          detail: Tencent 与 VR Capital 领投 7000 万美元融资，投后估值升至 15 亿美元。
        - label: FY2025 实现盈利
          date: '2026-02-12'
          detail: 公司披露 FY2025 未经审计净利润为 $176M；电商 GMV 超过 $500M，支付 TPV 为 $11.1B。
        - label: 阿曼主权战略融资轮
          date: '2026-03-10'
          detail: 以 23 亿美元投前估值基准完成超过 1.3 亿美元的股权及结构化资本融资。
        - label: EDB 金融科技债务融资
          date: '2026-05-19'
          detail: 与 Eurasian Development Bank 签署授信额度，随后扩大至 1 亿美元，用于金融科技放贷。
        - label: 惠誉信用评级上调
          date: '2026-09-18'
          detail: Fitch Ratings 将长期发行人违约评级从 B 上调至 B+，展望稳定，理由是生态协同效应。
    approximationNotes: 里程碑日期来自正式公司公告、监管登记文件及新闻稿。
    claimRefs:
      - CO013
      - CO014
      - CO015
  - id: FM001
