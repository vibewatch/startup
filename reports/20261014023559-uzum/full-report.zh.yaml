              Click
              之间切换，以获取点对点转账费减免和公用事业优惠。服装和消费电子商户的转换成本也很低，本地供应商可以同时使用国内竞争平台和俄罗斯平台。主要结构性替代风险来自资本充足的国际运营商：如果俄罗斯电商巨头在当地建立保税仓，或
              Kaspi.kz 等区域老牌公司直接进入乌兹别克斯坦，Uzum 的物流速度优势可能被削弱。机构尽调应跟踪群组留存曲线、不同履约层级的商户流失，以及自有 BNPL 信贷利润的稳定性。
