              - CR014
      - number: '7.4'
        title: 缓释措施、监测指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Uzum 已针对主要风险垂直线建立可信的运营缓释措施，包括为消费信贷产品取得符合伊斯兰教法的认证、在 Visa
              与本地清算网络之间建立多渠道支付冗余，以及与一流主权和战略投资者保持长期股权绑定。不过，机构投资者必须跟踪严格的论点失效指标，判断持仓能否持续。首要运营失效标准是消费贷款逾期持续上升，使金融科技运营利润率跌破机构批发债务成本。第二个监管触发器是乌兹别克斯坦央行若对非银行
              BNPL 发放设置限制性利率上限或法定杠杆上限，切断支撑零售电商物流的金融交叉补贴。第三个公司层面触发器涉及资本结构执行：若区域市场波动导致 2026 年末或 2027 年初无法完成目标 $250 million
              至 $300 million 的 IPO 前融资，$50 million 可转票据的转换机制可能触发惩罚性股权稀释或营运资金急剧收缩。尽调应重点取得未删节的 IFRS 贷款损失批次明细和经核实的央行检查文件。
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR011
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 核心利润垂直线的信贷与投资判断透明度不足
            body: 金融科技业务是 Uzum 的主要利润来源，但集团没有公开披露 $226 million 总贷款组合和 $421 million BNPL 发放额中的不良贷款、逾期批次或损失准备。
            calloutType: risk
            claimRefs:
              - CR011
              - CR014
          - type: callout
            title: 自有基础设施既是护城河，也是资本陷阱
            body: 乌兹别克斯坦完全缺少机构化第三方履约商，迫使 Uzum 自建并运营 125,000 平方米仓储网络和 1,500 个取货点；这构成竞争壁垒，同时也带来持续高额资本开支和固定工资负担。
            calloutType: insight
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: IPO 前论点失效触发器与监测阈值
            body: 在计划于 2026 至 2027 年上市前，投资者应监测两个关键预警：央行干预，将数字消费贷款利润率压到融资成本以下；或无法在计划到期前为 $50 million 可转工具再融资。
            calloutType: recommendation
            claimRefs:
              - CR006
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议
        blocks:
          - type: paragraph
            body: >-
              Uzum 展示了非凡的新兴市场数字化故事，已在乌兹别克斯坦建立横向领先生态，覆盖电商、即时食品配送、支付、数字银行和分期融资。月活用户超过 2,000
              万，覆盖全国一半以上人口，平台拥有强本地网络效应和较高消费者心智份额。核心投资论点是自我强化的飞轮：零售和物流中的高频消费触点，以低成本为高毛利金融服务获客，尤其受益于 Uzum Bank 和 Uzum
              Nasiya。但反向论点在于极端的单一国家宏观敞口、监管对消费债务产品的审查正在加强，以及缺少完全审计的分部会计。运营动能强劲，却伴随估值条款压力，综合建议为继续跟踪；估值处于合理至偏高区间，风险评级为高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV008
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: 融资历史与估值背景
        blocks:
          - type: paragraph
            body: >-
              集团资本结构在多轮关键融资中迅速扩张。2024 年 3 月，Uzum 以 1.14 亿美元 A 轮融资、投后估值 11.6 亿美元跻身科技独角兽，FinSight Ventures 领投；其中股权融资 5200
              万美元、债务融资 6200 万美元，普通股稀释低于 5%。2025 年 8 月，在 Tencent 和 VR Capital 支持下，公司追加完成 7000 万美元融资，估值达到 15 亿美元。最近一次是
              2026 年 3 月，Uzum 宣布获得由阿曼苏丹国主权财富实体领投、金额超过 1.3 亿美元的战略投资，投前估值约为 23 亿美元。该交易由 8150 万美元原始股权和 5000
              万美元结构化可转债组成，后者与未来合格融资轮次挂钩，带来优先权悬置，机构投资者必须仔细评估。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
      - number: '8.3'
        title: 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >-
              评估未来 12- to 24-month 投资回报时，应先把经营结果拆成乐观、基准和悲观三种情景。乐观情景（概率 25%）下，生态月活用户接近 25 million，支付总额超过 $18
              billion；电商规模带来的经营杠杆足以支撑超过 $3.5 billion 的国际 IPO，对应 3.5x 至 4.0x 的收入倍数。基准情景（概率 55%）下，Uzum 以稳定的 20% 至 30%
              营收增长守住国内领先地位，在维持可持续净利率的同时，把估值维持在 $2.3 billion 至 $2.6 billion 区间。悲观情景（概率 20%）则假设央行收紧对分期贷款上限的干预，$1.2 billion
              的 BNPL 资产组合出现消费者信用违约，并遭遇宏观货币冲击，使可持续股权估值跌破 $1.5 billion，同时触发优先权保护。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
      - number: '8.4'
        title: 退出准备度、尽调要求与论点破坏触发因素
        blocks:
          - type: paragraph
            body: >-
              要为最终流动性事件或海外上市做好机构层面的准备，仍需解决几项重大尽调缺口。首先，投资者需要全面了解 2026 年 3 月融资中 5000 万美元可转债的转换机制、优先级权利和清算倍数。其次，Uzum
              的盈利主要来自金融科技业务而非重资产电商，因此必须取得经审计的分部披露，证明其底层单位经济。第三，应将 Uzum Bank 和 Kapitalbank
              的信贷组合表现与宏观经济指标对标，以便尽早发现不良贷款率上升。任何限制分期加价的监管行动、核心平台物流市场份额被 Wildberries 等跨境竞争者明显夺走，或信贷回收恶化的证据，都会触发下调至回避的判断。
            claimRefs:
              - CV003
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 投资立场：跟踪
            body: Uzum 已在乌兹别克斯坦的电商、银行和消费者支付领域建立无可否认的国内领先地位。不过，若按 23 亿美元的名义估值入场，投资者仍需进一步厘清阿曼主权投资的可转债条款、经审计的分部利润率以及消费者信贷损失率。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
