  - id: FV001
    title: 估值与建议决策逻辑
    type: flow
    summary: 将 Uzum 的全国覆盖、金融科技变现、资本结构条款及集中度风险连接至跟踪建议的逻辑链。
    data:
      nodes:
        - id: n1
          label: 全国覆盖与规模
          detail: 商业、支付及银行业务合计拥有 20M 多个月活用户
        - id: n2
          label: 金融科技变现
          detail: $1.2B BNPL 放款额及 $11.1B 支付 TPV
        - id: n3
          label: 资本结构现实
          detail: $130M 多融资轮由原始股权与可转换资本构成
        - id: n4
          label: 估值标记：$2.3B
          detail: 阿曼领投的投前融资轮设定了较高估值门槛
        - id: n5
          label: 单一国家集中度
          detail: 乌兹别克斯坦的 BNPL 监管审查与宏观经济依赖
        - id: n6
          label: 最终立场：跟踪
          detail: 进入前关注经审计的分部利润率和可转债条款
    approximationNotes: 流程图展示定性决策逻辑；经营数据基于报告所述的 2025 年和 2026 年数据点。
