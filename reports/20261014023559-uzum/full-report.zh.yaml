  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、宏观驱动与零售业跨越式发展
        blocks:
          - type: paragraph
            body: >-
              乌兹别克斯坦是中亚人口最多、数字化速度最快的消费市场，全国人口约为 35 至 38m，其中超过 60% 的居民年龄低于 30 岁。过去，当地消费商业几乎完全绕过结构化的实体连锁零售，主要依赖非正式露天集市，以及在
              Telegram、Instagram 等社交平台上点对点下单。KPMG 于 2022 年 12 月发布的里程碑研究显示，线上零售仅占全国零售支出的 2.2%；尽管智能手机普及率超过 75%，互联网连接率在 76%
              至 90% 之间，正规基础设施的渗透仍严重不足。如今，乌兹别克斯坦正经历结构性跨越：消费交易直接从分散的现金集市转向统一的数字商业生态。Uzum
              把电商商品、即时食品配送、消费贷款和数字银行服务整合到一个适配本地支付习惯的平台中，已经占据全国市场领先地位。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM011
      - number: '2.2'
        title: 可服务市场测算：宏观基础、电商扩张与无现金支付速度
        blocks:
          - type: paragraph
            body: >-
              要测算乌兹别克斯坦数字平台的可服务机会，需要同时评估多个经济层次，不能只看单一总量估计。宏观层面，乌兹别克斯坦名义 GDP 在 2025 年达到约 $147 billion，年度增长
              7.7%，中期预计复合年增长率为 8%。在经济扩张的同时，政府和银行业预测，到 2027 年无现金支付将达到 GDP 的三分之一，形成接近 $49 billion 的交易支付池。Uzum
              的一体化生态已成为承接这一转变的核心渠道，2025 年在数字银行和零售服务中处理了 $11 billion TPV。商品交易方面，Uzum Market 的 GMV 从 2023 年的 $150
              million、2024 年的 $345 million 增至 2025 年的 $500 million；生态合并营收达到 $691 million，净利润为 $176
              million。虽然历史电商渗透率低，但随着实体履约能力释放全国居民消费，数字零售可服务市场正迅速迈向数十亿美元规模。
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM008
              - CM010
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM005
              - CM006
              - CM008
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM008
              - CM010
              - CM013
      - number: '2.3'
        title: 买家、商户与付款方分层：工作流和采用触发因素
        blocks:
          - type: paragraph
            body: >-
              Uzum 生态覆盖三类经济群体：年轻数字消费者、无银行账户的家庭收入者，以及中小企业商户。乌兹别克斯坦成年人口中历史上超过 56% 没有银行账户，因此金融科技整合对消费采用的推动尤其明显。Uzum
              没有把商业和银行做成两个独立应用，而是把先买后付分期融资直接嵌入平台结算，让没有信用卡的消费者也能通过自动微型分期购买家居用品、智能手机和服装。仅 2025 年，Uzum Bank 就发出 410
              万张借记卡，接近全国新发支付卡的一半，并将活跃生态用户扩大到月活 2,000 万。供给端有超过 17,000 家本地商户使用 Uzum
              Market，接入一个远大于传统集市客流的集中客户池，将库存从无序摊位转入由电子回款支持的有组织履约渠道。
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM009
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM007
              - CM009
              - CM012
      - number: '2.4'
        title: 采用瓶颈、基础设施约束与结构性尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管收入增长迅速，乌兹别克斯坦数字市场扩张仍受关键运营和财务约束。第一，独立商业履约基础设施完全缺位，迫使市场参与者承担大量资本开支。Uzum 必须自建、持有并运营完整物流供应链，目前维护 1,500 个取货点和
              125,000 平方米仓库；为在省级地区守住次日达承诺，公司需要扩展到 3,000 个网点和 500,000 平方米仓储。第二，由于平台利润主要由金融科技信贷而非纯电商 take-rate 驱动，生态暴露于
              $400 million 无抵押贷款组合的消费信贷违约周期。最后，能够剥离非食品零售支出并独立衡量电商份额的宏观审计仍然有限，因而无法充分判断有组织数字商业相对于根深蒂固的现金集市习惯，最终渗透上限在哪里。
            claimRefs:
              - CM001
              - CM007
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 中亚零售的跨越式发展
            body: >-
              西方和东亚市场的数字商业通常逐步取代有组织的超市和连锁零售；乌兹别克斯坦则直接从非正式街头集市和点对点社交商业（Telegram、Instagram）转向垂直整合的数字平台。Uzum 自有物流基础设施覆盖
              1,500 个取货点和主要履约中心，形成较高转换成本和进入壁垒，海外平台若没有本地实体资本投入，难以复制。
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM014
          - type: callout
            title: 购买力敏感度与信贷组合脆弱性
            body: >-
              虽然用户采用和交易总量快速增长，月活用户已超过 2,000 万，但乌兹别克斯坦人均 GDP
              仍不高。平台高度依赖先买后付分期推动电商销售，因此若家庭收入收紧或监管提高准备金要求，盈利将暴露于消费信贷违约周期和宏观冲击。
            calloutType: risk
            claimRefs:
              - CM005
              - CM007
              - CM011
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 市场结构与竞争格局
        blocks:
          - type: paragraph
            body: >-
              乌兹别克斯坦数字经济正从分散的非正式商业快速转向机构化平台竞争。零售电商方面，Uzum Market 与俄罗斯跨境平台 Wildberries、Ozon
              竞争，后两者均在乌兹别克斯坦主要城市运营区域取货点。消费金融和数字支付方面，国内竞争来自 TBC Bank Group 旗下 Payme、Click 以及无网点挑战者 Anorbank。专业零售领域，Olcha
              和 Asaxiy 在消费电子和家电领域守住细分市场。但市场现实仍由非正式替代渠道塑造：过去大量零售交易通过 Telegram 频道、Instagram 商店和露天集市完成。Uzum
              明确把平台商业、数字银行和消费信贷整合成统一生态，与缺少实体履约或自有持牌资产负债表融资能力的单垂直竞争者拉开差异。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
              - CP008
              - CP014
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP007
      - number: '3.2'
        title: 能力差异化与多垂直整合
        blocks:
          - type: paragraph
            body: >-
              Uzum 与竞争者的核心差异，在于实体物流和资产负债表金融科技之间的运营协同。Wildberries、Ozon 等跨境平台拥有数百万 SKU 的宽广目录，但由于清关和跨境运输，送达乌兹别克斯坦消费者通常需要 3
              至 7 天。Uzum Market 建立本地履约中心和自有车队，把目录优势转化为次日覆盖主要人口中心的能力。更关键的是，实体履约与集团自有先买后付服务 Uzum Nasiya
              直接连接。消费分期覆盖近一半电商交易，大幅降低了购买阻力；在信用卡渗透率仍处于早期的经济体中，这一优势尤其明显。这种双引擎模式类似哈萨克斯坦的区域标杆
              Kaspi.kz：交易型平台活动带动日常数字银行使用和信贷评估。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP011
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP007
              - CP011
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP013
      - number: '3.3'
        title: 定价动态、佣金结构与 take-rate
        blocks:
          - type: paragraph
            body: >-
              乌兹别克斯坦数字生态的变现，靠两台不同的引擎驱动：资本密集的零售物流，以及高毛利的金融产品。商业端，Uzum Market 按商品类别收取通常为百分之三至百分之十五
              的商户佣金，并在集中仓储和商户自履约模式下收取履约费。Olcha、Asaxiy 和非正式 Telegram 频道等竞争平台几乎没有上架门槛，因此 Uzum 提高商户 take-rate
              的空间受到结构性限制。金融科技业务则补上了零售利润被压缩的缺口：Uzum Nasiya
              通过商户补贴的融资费，以及按伊斯兰教法设计的分期利润，实现消费信贷变现。市场平台是消费者借款的主要获客漏斗，能带来高交易量；Uzum Bank 和 Uzum Nasiya 再从中获取持续的净利息和交易费收入。
