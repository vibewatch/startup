chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与生态架构
        blocks:
          - type: paragraph
            body: >-
              Uzum 是乌兹别克斯坦领先的数字平台和超级应用生态，提供相互连接的消费者与商户服务，覆盖线上零售、即时配送、数字银行和持牌商业银行、先买后付信贷及商户基础设施。集团于 2022
              年正式成立，将总部位于塔什干的运营实体置于注册于阿布扎比全球市场的 Uzum Holding Ltd 旗下。通过整合电商和金融服务中的日常交易触点，Uzum 月活用户超过 2,000
              万，覆盖全国一半以上人口。FY2025 集团披露未经审计的合并营收为 $691 million，净利润为 $176 million；电商 GMV 超过 $500 million，TPV 超过 $11.1
              billion。物流、金融科技、公司职能和客服团队合计员工超过 14,000 人。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: 创始人、治理与关键人物评估
        blocks:
          - type: paragraph
            body: >-
              该生态由首席执行官 Djasur Djumaev 于 2022 年与联合创始人 Nikolay Seleznev、Roman Lavrentyev
              共同建立，将本地商业执行力与国际平台管理经验结合起来。运营决策仍集中在 Djumaev 周围；公司战略、机构投资者关系和资本配置由 Seleznev 主导。管理层通过控股 JSCB Kapitalbank
              引入银行人才，并由团队负责人管理 Uzum Bank 和 Uzum Nasiya。2023 年早期公司报告曾因前 VK 首席执行官 Boris Dobrodeev 可能担任顾问及获得期权激励而受到媒体关注；但
              Uzum 公司代表明确否认，确认 Dobrodeev 从未持有控股公司的股权或期权。董事会委员会监督、独立董事代表性和少数股东投票保护的详细披露仍然有限。
            claimRefs:
              - CO006
              - CO007
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO008
      - number: '1.3'
        title: 资本化历史、估值演进与利益相关方地图
        blocks:
          - type: paragraph
            body: >-
              Uzum 于 2024 年 3 月凭借由 FinSight Ventures 领投、Xanara Investment Management 参与的 $114 million A 轮融资成为独角兽，投后估值为
              $1.16 billion。2025 年 8 月，Tencent 与 VR Capital 共同领投 $70 million 股权融资，估值达到 $1.5 billion。2026 年 3 月，Uzum
              在阿曼苏丹国主权实体和既有投资者支持下完成超过 $130 million 的战略融资，形成 $2.3 billion 投前估值参考点。该交易包含普通股融资和结构化资本，其转换经济条款与即将到来的 B
              轮融资挂钩。除股权外，公司还获得非稀释性信贷，包括欧亚开发银行的数字经济贷款，该额度在 2026 年由 $70 million 增至 $100 million；公司债券则在塔什干共和证券交易所发行。
            claimRefs:
              - CO003
              - CO009
              - CO010
              - CO011
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: 运营里程碑与增长轨迹
        blocks:
          - type: paragraph
            body: >-
              集团从单一平台快速扩展为多垂直区域龙头。Uzum Market 于 2022 年 10 月上线，到 2026 年初已在超过 450 个地区建立覆盖全国的履约网络，设有 1,500
              个取货点。金融服务迅速成为变现核心：消费分期平台 Uzum Nasiya 在 2025 年发放 $1.2 billion，数字银行 Uzum Bank 发出超过 700 万张 Visa 卡。与商业银行资产
              Kapitalbank 的整合扩大了机构覆盖面，截至 2025 年末，银行贷款余额达到 $3.1 billion，存款达到 $3.7 billion。2026 年 9 月，Fitch Ratings 将 Uzum
              的长期发行人违约评级从 B 上调至 B+，展望稳定，理由是银行、零售和数字支付之间的运营协同不断加深。
