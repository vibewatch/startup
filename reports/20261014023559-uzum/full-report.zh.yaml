  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管框架、银行牌照与公司治理
        blocks:
          - type: paragraph
            body: >-
              Uzum 处于快速正规化的中亚监管环境中，面临独特的机构和合规风险。集团在当地通过外国企业有限责任实体运营，最终并入注册于阿布扎比全球市场的离岸控股公司 UMARKET SPV
              LTD。该国际控股结构为阿曼投资局、Tencent 等外国主权和机构股权伙伴提供法律保护，但也带来跨境股息汇回、双边税务居民身份和本地监管交叉带来的管辖复杂性。集团金融基础依托持牌商业业务：Uzum Bank 由
              Bank Apelsin 更名而来，并拥有 JSCB Kapitalbank
              的战略控股权。把银行存款和数字消费信贷整合进商业平台，需要持续符合乌兹别克斯坦央行的资本充足标准、反洗钱框架和数字银行准备金门槛。早期创立阶段在管理层股权分配和股东名册上不透明；如今公司实体直接对接国家监管清算机构，因此非银行消费贷款或小额金融牌照一旦突然收紧，就会成为合并盈利的主要威胁。
            claimRefs:
              - CR001
              - CR002
              - CR008
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR008
      - number: '7.2'
        title: 运营可靠性、物流扩张与执行脆弱性
        blocks:
          - type: paragraph
            body: >-
              与利用成熟商业快递网络的成熟市场电商不同，Uzum 被迫完全依靠自身资产负债表搭建端到端实体履约基础设施。乌兹别克斯坦几乎没有机构化的第三方物流和履约服务商，因此次日达承诺完全依赖自有分拣中心、本地配送车队和约
              1,500 个取货点组成的全国网络。公司目前使用约 125,000 平方米运营仓储，并投入大量资本建设四个主要区域配送中心，目标是把总存储空间扩大至 500,000
              平方米。自有资产网络对区域进入者构成强大护城河，却也使 Uzum 变成重基础设施企业，受制于施工延误、租赁成本上涨和运营执行瓶颈。实体配送与数字银行同步扩张后，公司总员工超过 12,500 人，并向 14,000
              多人增长。庞大的工资单带来较高固定运营开销，也让利润率暴露于工资急升、劳动合规负担和履约量增长时一线仓库留人困难。
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
      - number: '7.3'
        title: 财务模型、信贷敞口与资本结构脆弱性
        blocks:
          - type: paragraph
            body: >-
              Uzum 生态的核心经济脆弱性，在于集团盈利过度依赖无抵押消费贷款。平台 GMV 从 2024 年的 $345 million 增至 2025 年超过 $500
              million，但管理层披露确认，零售电商接近盈亏平衡，数字金融科技才是主要利润引擎。BNPL 融资覆盖平台 45% 至 50% 的销售，直接把 GMV 扩张与资产负债表信贷增长绑定。仅 FY2024，BNPL
              交易融资额就达到 $421 million；超过 600 万张已发卡对应的消费贷款组合扩大至 $226 million。然而，Uzum
              没有提供逾期批次迁移、不良贷款核销或损失准备的审计可见度。由于大量商品购买依靠内部分期信贷，任何宏观冲击、区域货币贬值或乌兹别克斯坦实际工资收缩，都可能推高信贷损失率，直接侵蚀核心净利润。融资方面，Uzum
              还承担显著结构性杠杆，包括历史 A 轮债务 $62 million、欧亚开发银行等机构提供的 $70 million 授信，以及阿曼牵头投资者近期提供、与 IPO 前基准挂钩的 $50 million
              可转工具。如果无法实现 $250 million 至 $300 million 的目标 IPO 前定价，可能出现严重稀释压力或再融资摩擦。
            claimRefs:
              - CR006
              - CR007
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
