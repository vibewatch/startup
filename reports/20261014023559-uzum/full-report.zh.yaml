  - id: FE001
    title: 生态产品与技术架构栈
    type: stack
    summary: 六层架构覆盖用户触点、商业应用、银行引擎、共享数据服务、容器基础设施及实体物流。
    approximationNotes: 架构层反映已报道的微服务与运营基础设施；内部自有服务边界尚未核实。
    claimRefs:
      - CE001
      - CE006
      - CE007
      - CE011
      - CE012
    data:
      layers:
        - label: 用户互动与触点
          detail: 消费者移动超级应用、商户管理门户、网页门户及即时 Telegram 机器人互动。
        - label: 电商与配送引擎
          detail: Uzum Market 平台目录、搜索与推荐服务，以及 Uzum Tezkor 快速派送算法。
        - label: 数字银行与信贷平台
          detail: Uzum Bank 核心银行账簿、本地化卡处理主机，以及 Uzum Nasiya 符合伊斯兰教法的评分与分期引擎。
        - label: 数据流与存储层
          detail: Apache Kafka 事件流管道、用于核心交易的 PostgreSQL 关系数据库，以及 Redis 分布式缓存。
        - label: 计算与部署基础设施
          detail: 通过 Kubernetes 编排的容器化微服务集群，运行于本地服务器环境及云基础设施。
        - label: 实体物流与履约网络
          detail: 集中分拣中心、全国车队物流、区域配送枢纽及品牌自提点。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 分阶段展示客户采用生命周期：从漏斗顶部进入平台、转化为 BNPL 用户、形成配送习惯，再深入数字银行与商户服务。
    data:
      items:
        - label: 发现与进入平台
          role: New Consumer / Buyer
          stage: 漏斗顶部获客
          touchpoints:
            - 下载 Uzum Market 应用
            - 浏览电商目录
          detail: 消费者通过低门槛商品搜索和覆盖 450 多个地区的次日配送承诺进入平台。
        - label: 首次结账与 BNPL 激活
          role: Transacting Shopper
          stage: 首单转化
          touchpoints:
            - Uzum Nasiya 分期结账
            - 即时身份验证
          detail: 符合伊斯兰教法的分期付款选项，把首次网购者转化为与信贷绑定的消费者。
        - label: 高频快速配送
          role: Active Consumer
          stage: 日常使用习惯
          touchpoints:
            - Uzum Tezkor 餐食订单
            - 按需杂货配送
          detail: 覆盖 26 个城市的高频餐食与杂货订单，加深每周互动并提升应用留存。
        - label: 银行与银行卡采用
          role: Fintech User
          stage: 金融深化
          touchpoints:
            - Uzum Bank Visa 借记卡
            - P2P 卡间转账
          detail: 用户开始使用带循环授信额度的数字借记卡，并享受免佣金 Uzcard / Humo 转账。
        - label: 商户入驻与目录上架
          role: SME Merchant / Seller
          stage: 商业整合
          touchpoints:
            - Uzum Business 门户
            - 物流仓储履约
          detail: 商户入驻以触达 20M 月活用户，并使用 FBM 仓储与 DBS 配送渠道。
        - label: 生态扩张与交叉销售
          role: Ecosystem Power User
          stage: 多垂直留存
          touchpoints:
            - Uzum Avto 车辆融资
            - 商户薪资与税务工具
          detail: 高价值购车和一体化商户企业工具，把消费者与企业主都留在生态内。
    approximationNotes: 旅程阶段与转化机制反映公开的超级应用架构及披露的交叉销售动态；用户群体流失率尚未公开披露。
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
