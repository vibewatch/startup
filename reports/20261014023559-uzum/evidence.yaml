evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: conversion-terms-and-cap-table
    missingEvidence: >-
      Detailed term sheet, liquidation preferences, and cap table breakdown for the March 2026 $130 million structured
      sovereign financing.
    whyItMatters: >-
      Without exact conversion formulas linked to the planned Series B, common equity dilution and downside senior
      preference overhang cannot be fully modeled.
    diligencePath: >-
      Review Uzum Holding Ltd constitutional documents, convertible instrument agreements, and ADGM register filings
      during confirmatory diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-diligence
    missingEvidence: >-
      Independent comprehensive census data verifying Uzbekistan's non-food retail market total, granular market share
      breakdowns across e-commerce competitors, and vintage delinquency schedules for Uzum's $400 million consumer loan
      book.
    whyItMatters: >-
      Without independent verification of total consumer retail trade and loan portfolio default performance, external
      estimates of market penetration, addressable ceiling, and BNPL credit loss resilience remain reliant on company
      disclosures.
    diligencePath: >-
      Request audited segment financial ledgers, vintage-level loan loss reserve ratios from Uzum Bank data rooms, and
      national retail trade statistical bulletins from the State Statistics Agency of Uzbekistan.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-retention-metrics
    missingEvidence: >-
      Audited cohort retention curves, merchant churn percentages, and unit contribution margins for regional
      competitors TBC Bank, Wildberries, Ozon, and Uzum.
    whyItMatters: >-
      Without segmented cohort data, evaluating whether Uzum ecosystem lock-in durably insulates it against price
      competition from regional incumbents remains constrained.
    diligencePath: >-
      Request management reporting on customer lifetime value (LTV), 12-month cohort retention by vertical, and merchant
      renewal rates across fulfillment tiers.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: segment-reporting
    missingEvidence: >-
      Audited segment income statements detailing disaggregated revenue, gross margins, EBITDA, and capital allocations
      across Uzum Market, Uzum Bank, Uzum Nasiya, and Uzum Tezkor.
    whyItMatters: >-
      Without audited segment accounts, an investor cannot determine whether marketplace e-commerce is self-sustaining
      or dependent on fintech profits and credit subsidies.
    diligencePath: >-
      Request IFRS-audited consolidated and segment financial statements from Uzum management during formal data room
      diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: credit-quality
    missingEvidence: >-
      Detailed delinquency vintage curves (PAR30, PAR90), loan loss reserve ratios, and net charge-off data for Uzum
      Nasiya's $400 million gross credit portfolio.
    whyItMatters: >-
      Consumer installment lending drives the majority of group profit; hidden credit deterioration would rapidly erode
      group net margins.
    diligencePath: >-
      Obtain credit portfolio stratification reports, loan vintage matrices, and regulatory risk asset filings from the
      Central Bank of Uzbekistan.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: convertible-terms
    missingEvidence: >-
      Detailed term sheet of the March 2026 $50 million convertible instrument, including valuation caps, discount
      rates, interest accruals, and liquidation preference seniorities.
    whyItMatters: >-
      Structured debt instruments can create substantial dilution or return hurdles that impair returns for new common
      equity.
    diligencePath: Review full shareholder agreement and subscription documentation for the Series B / structured round.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: missing-source
    severity: material
    topic: security-certifications
    missingEvidence: >-
      Third-party information security audit attestations including SOC 2 Type II reports, ISO/IEC 27001 certifications,
      or annual external penetration testing executive summaries.
    whyItMatters: >-
      As an integrated digital ecosystem handling payment processing, customer credit scoring, and personal
      identification data for over 20 million users, verified technical audit attestations are critical to evaluate
      cybersecurity posture and resilience against data breaches.
    diligencePath: >-
      Request confidential SOC 2 or ISO 27001 audit summaries and recent third-party vulnerability assessment letters
      from Uzum's chief information security officer.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: cohort-retention-disclosure
    missingEvidence: >-
      Audited customer cohort retention curves, net revenue retention (NRR), gross revenue retention (GRR), and annual
      churn rates across Uzum Market and Uzum Bank.
    whyItMatters: >-
      Without cohort disclosure, it is impossible to determine whether Uzum's rapid GMV and user growth reflects durable
      customer lifetime value or continuous high-churn customer replacement.
    diligencePath: >-
      Request confidential management cohort retention data segmented by acquisition channel, vintage year (2022-2025),
      and cross-vertical product adoption.
    relatedQuestionRefs:
      - QU008
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive merchant and partner registry detailing individual GMV contributions, contract terms, commission
      schedules, and retention rates across all 18,000+ sellers.
    whyItMatters: >-
      Public data provides only sample partner listings and aggregate merchant numbers, preventing granular
      concentration risk assessment among top third-party sellers.
    diligencePath: >-
      Review Uzum Business merchant tiering schedules and top-20 seller concentration metrics during confidential due
      diligence.
    relatedTableRefs:
      - TU003
  - type: access-blocked
    severity: material
    topic: regulatory-enforcement-audit
    missingEvidence: >-
      Comprehensive regulatory inspection logs, central bank audit findings, and consumer court filings for Uzum Bank
      and Uzum Market.
    whyItMatters: >-
      Direct insight into pending compliance inquiries or consumer protection disputes is necessary to quantify legal
      liability before pre-IPO filing.
    diligencePath: >-
      Request legal diligence disclosures, local registry litigation certificates, and Central Bank of Uzbekistan
      regulatory correspondence.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: credit-loss-vintages
    missingEvidence: >-
      Audited vintage-level delinquency curves, 30/60/90-day non-performing loan ratios, and provision coverage for Uzum
      Nasiya and Uzum Bank revolving credit.
