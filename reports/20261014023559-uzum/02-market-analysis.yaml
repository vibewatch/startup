  - TM003
  figureRefs: []
- id: adoption-constraints-and-diligence-gaps
  title: Adoption Bottlenecks, Infrastructure Constraints, and Structural Diligence Gaps
  body: Despite rapid top-line growth, digital market expansion in Uzbekistan faces critical operational and financial constraints.
    First, the complete absence of independent commercial fulfillment infrastructure forces market participants to internalize
    extensive capital expenditures. Uzum has had to build, own, and operate its entire logistics supply chain, currently maintaining
    1,500 pickup points and 125,000 square meters of warehousing, with capital requirements demanding an expansion to 3,000
    locations and 500,000 square meters to preserve next-day delivery promises across provincial regions. Second, because
    platform profitability is heavily driven by fintech credit rather than pure e-commerce take-rates, the ecosystem is exposed
    to consumer credit default cycles across its $400 million unsecured loan book. Finally, independent macroeconomic audits
    isolating non-food retail spending and competitive e-commerce market share remain limited, creating empirical diligence
    gaps regarding the ultimate penetration ceiling of organized digital commerce relative to entrenched cash-based bazaar
    habits.
