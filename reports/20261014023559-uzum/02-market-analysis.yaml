- id: buyer-and-payer-segmentation
  title: 'Buyer, Merchant, and Payer Segmentation: Workflows and Adoption Triggers'
  body: 'Adoption across Uzum''s ecosystem spans three distinct economic cohorts: young digital consumers, unbanked household
    earners, and small-to-medium enterprise merchants. With over 56% of Uzbekistan''s adult population historically unbanked,
    consumer adoption is uniquely catalyzed by fintech integration. Rather than treating commerce and banking as separate
    applications, Uzum links buy-now-pay-later installment financing directly into marketplace checkout, allowing consumers
    who lack credit cards to acquire household goods, smartphones, and apparel through automated micro-installments. Uzum
    Bank issued 4.1 million debit cards in 2025 alone, representing nearly half of all newly issued payment cards nationwide,
    and expanded its active ecosystem user base to 20 million monthly users. On the supply side, over 17,000 local merchants
    utilize Uzum Market to access a centralized customer pool that dwarfs the foot traffic of traditional bazaars, transitioning
    their inventory from unorganized stalls into organized fulfillment channels supported by guaranteed electronic payouts.'
  claimRefs:
  - CM001
  - CM003
  - CM007
  - CM009
  - CM011
  - CM012
