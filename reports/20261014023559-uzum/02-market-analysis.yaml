callouts:
- calloutType: insight
  title: The Leapfrog Dynamics of Central Asian Retail
  body: Unlike Western and East Asian markets where digital commerce gradually disintermediated organized hypermarkets and
    retail chains, Uzbekistan is transitioning directly from informal street bazaars and peer-to-peer social commerce (Telegram,
    Instagram) into vertically integrated digital platforms. Uzum's proprietary logistics infrastructure—spanning 1,500 pickup
    points and major fulfillment centers—creates high switching costs and barriers to entry that foreign platforms cannot
    easily replicate without localized physical capital.
  claimRefs:
  - CM001
  - CM002
  - CM004
  - CM014
- calloutType: risk
  title: Purchasing Power Sensitivity and Credit Portfolio Vulnerability
  body: While user adoption and headline transaction volumes have grown rapidly to reach over 20 million monthly active users,
    Uzbekistan's per-capita GDP remains modest. High reliance on buy-now-pay-later (BNPL) installment financing to drive e-commerce
    sales exposes the platform's profitability to consumer credit default cycles and macroeconomic shocks if household incomes
    tighten or regulatory reserve requirements increase.
  claimRefs:
  - CM005
  - CM007
  - CM011
  - CM015
