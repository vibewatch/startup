- id: addressable-market-sizing
  title: 'Addressable Market Sizing: Macroeconomic Base, E-Commerce Expansion, and Cashless Velocity'
  body: Sizing the addressable opportunity for digital platforms in Uzbekistan requires evaluating multiple economic layers
    rather than relying on a single top-line estimate. At the macroeconomic base, Uzbekistan's nominal GDP reached approximately
    $147 billion in 2025, expanding at 7.7% annually with a projected medium-term compound annual growth rate of 8%. Within
    this expanding economy, national authorities and banking sector forecasts target cashless payments to reach up to one-third
    of total GDP by 2027, unlocking a transactional payment velocity pool approaching $49 billion. Uzum's integrated ecosystem
    has emerged as the central pipeline capturing this shift, processing $11 billion in total payment volume across digital
    banking and retail services in 2025. In goods commerce, Uzum Market generated $500 million in gross merchandise value
    in 2025, surging from $345 million in 2024 and $150 million in 2023, while consolidated ecosystem revenues reached $691
    million with $176 million in net profit. While historical baseline e-commerce penetration was low, the addressable digital
    retail sector is expanding rapidly toward multi-billion dollar scale as physical fulfillment unlocks nationwide household
    consumption.
