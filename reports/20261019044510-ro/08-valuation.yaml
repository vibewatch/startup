      - ["Confidence", "Medium", "Public operating signals are useful but current financial disclosure is incomplete."]
      - ["Risk rating", "High", "Valuation opacity, D2C execution risk, and competition can still impair returns."]
      - ["Valuation stance", "Stretched", "The only clean public mark is $7B from February 2022."]
      - ["Decision implication", "Price-disciplined diligence", "Seek updated cap-table, financial, and retention evidence before sizing."]
    notes: >-
      Based on retained 2022-2026 public sources only; current ARR, audited margin, burn,
      cash, and preference terms are not disclosed in this chapter's evidence.
    claimRefs: [CV001, CV007, CV010, CV011]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Thesis", "Ro still shows scaled demand capture through GLP-1 distribution, insurance-checker usage, and a 3M+ member marketing base.", "Audited 2025-2026 retention and contribution margin would strengthen conviction."]
      - ["Thesis", "Ro's vertically integrated care-plus-pharmacy model can matter to manufacturers that want nationwide direct-to-patient access.", "Proof of recurring manufacturer economics or durable pharmacy take-rate would improve the valuation case."]
      - ["Anti-thesis", "The public price anchor is stale because the latest disclosed valuation is still the February 2022 $7B round.", "A lower or otherwise updated market-clearing mark would make entry discipline more concrete."]
      - ["Anti-thesis", "D2C pricing premia, cancellation friction, and rising competition can compress retention or marketing efficiency.", "Customer cohort, CAC, and service-level disclosures would show whether these risks are contained."]
    notes: >-
      Thesis rows combine company-issued commercialization evidence with independent company
      profiles and reviews; anti-thesis rows emphasize valuation staleness and execution
      frictions rather than making unsupported liquidation claims.
    claimRefs: [CV001, CV003, CV005, CV007, CV008, CV011, CV012]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "GLP-1 partnerships convert into sustained growth while vertically integrated fulfillment protects service quality and economics.", "Underwrite upside only if fresh financial disclosure shows growth durability well beyond the old 2022 mark assumptions.", "Manufacturer concentration or reimbursement changes can still compress economics.", "Would require audited growth and margin proof plus evidence of benign preference terms."]
      - ["Base", "Ro keeps scaling demand and product breadth but remains privately opaque on economics and cap-table terms.", "Treat valuation as a watchlist exercise anchored to stale marks and operating momentum rather than a precise price target.", "Investors may overpay for scale that is real operationally but under-documented financially.", "Best fit for current public evidence."]
      - ["Bear", "Competition, pricing friction, or service strain exposes weaker retention or a lower clearing valuation than the last round implied.", "Downside comes from a reset below the stale $7B marker or unattractive seniority terms in a new round.", "Cash-pay churn, multiple compression, and governance overhang can all impair exit value.", "Triggered by a down-round, weak cohort data, or disclosed preference overhang."]
    notes: >-
      Scenario framing is directional because the retained sources do not disclose a current
      enterprise-value bridge, audited 2025-2026 financials, or secondary-market marks.
    claimRefs: [CV001, CV002, CV007, CV008, CV010, CV012, CV013]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and partnership proof are real, but stale pricing and execution opacity keep the call at track.
    data:
      nodes:
        - id: demand-proof
          label: Demand proof
          detail: 2024 revenue estimate of $598M and 3M+ marketed members show real scale.
          tone: positive
        - id: distribution-leverage
          label: Distribution leverage
          detail: Novo's 2026 oral Wegovy launch and Ro's insurance-checker funnel reinforce patient-routing value.
          tone: positive
        - id: stale-price-anchor
          label: Stale price anchor
          detail: Last public valuation marker is still the February 2022 $7B round.
          tone: risk
        - id: disclosure-gap
          label: Disclosure gap
          detail: Public evidence still lacks current ARR, margin, burn, cash, and preference-stack detail.
          tone: risk
        - id: execution-drag
          label: Execution drag
          detail: D2C pricing premia, cancellation friction, and competition can still pressure returns.
          tone: risk
        - id: track-recommendation
          label: "Recommendation: track"
          detail: Need fresher financial and cap-table evidence before underwriting a buy.
          tone: neutral
      edges:
        - from: demand-proof
          to: distribution-leverage
          label: supports upside
        - from: distribution-leverage
          to: stale-price-anchor
          label: but valuation lags operations
        - from: stale-price-anchor
          to: disclosure-gap
          label: needs current underwriting data
        - from: disclosure-gap
          to: execution-drag
          label: missing disclosure amplifies risk
        - from: execution-drag
          to: track-recommendation
          label: keeps price discipline high
    claimRefs: [CV001, CV003, CV005, CV007, CV010, CV011]
