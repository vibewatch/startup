  evidenceGaps:
    - type: missing-source
      severity: material
      topic: valuation-mark
      missingEvidence: Post-2022 primary, tender, secondary, or 409A valuation evidence plus any disclosed preference-stack terms.
      whyItMatters: A current price anchor is necessary to know whether today's entry is attractive, merely fair, or still stretched.
      diligencePath: Request the latest board deck, financing history, secondary transactions, and cap-table waterfall from management.
      relatedQuestionRefs: [QV001, QV006]
    - type: private-evidence-only
      severity: material
      topic: disclosure-gap
      missingEvidence: Audited 2025-2026 revenue, gross margin, burn, cash runway, CAC, retention, and cohort contribution data.
      whyItMatters: Scenario analysis cannot become valuation underwriting without current financial quality and durability data.
      diligencePath: Obtain audited financial statements, KPI cohort packs, and a monthly operating dashboard under NDA.
      relatedQuestionRefs: [QV002, QV007, QV008]
    - type: missing-source
      severity: minor
      topic: exit-readiness
      missingEvidence: Concrete evidence of an exit process, bank mandate, or board-approved timing for IPO, sale, or long-duration private financing.
      whyItMatters: Exit timing drives return realization even if the business continues to scale operationally.
      diligencePath: Ask management and lead investors for current exit planning materials and financing contingency plans.
      relatedQuestionRefs: [QV007]
