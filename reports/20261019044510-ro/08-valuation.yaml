company:
  name: Ro
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence still supports Ro as a scaled, commercially credible direct-to-patient
    healthcare platform, but the investable price signal is stale. The last disclosed
    valuation marker remains the February 2022 $7 billion inside round, while fresher
    2025-2026 demand and partnership signals are mostly company-issued, so the supportable
    stance is track rather than buy until diligence closes the disclosure gap or resets
    the entry price.
sections:
  - id: recommendation-setup
    title: Recommendation setup
    body: >-
      The public record still shows a real operating asset rather than a concept-stage
      story. Multiples attributes roughly $598 million of 2024 revenue to Ro after an
      estimated $360 million in 2023, while Ro's own 2026 materials show continued GLP-1
      commercialization through a direct Novo Nordisk launch and a homepage now marketed to
      more than 3 million members. BounceWatch also still lists roughly $1.03 billion of
      cumulative funding and a 1,473-person workforce, which matters because investors are
      underwriting a scaled platform with meaningful fixed costs, not an early experiment.
      That said, the latest public price anchor remains the February 2022 $7 billion round.
      With no current audited ARR, margin, burn, cash, or preference-stack disclosure in
      the retained evidence, public support is strong enough for interest but not for a
      clean buy call at the old mark.
    claimRefs: [CV001, CV002, CV003, CV005, CV006, CV011]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: valuation-context-and-scenarios
    title: Valuation context and scenarios
    body: >-
      The positive case is easy to understand: Ro is converting scale in telehealth,
      pharmacy, labs, and GLP-1 access into broader manufacturer relevance. The 2026 Novo
      pill launch and Ro's insurance-checker funnel both suggest that the platform has
      demand capture and patient-routing value that smaller point solutions do not.
      However, public valuation work remains directional rather than dispositive. Multiples
      preserves Ro's historical financing ladder and reports a 6.0x revenue multiple at the
      July 2020 $1.5 billion Series C, but later rounds disclose valuation without a
      contemporaneous public revenue denominator. At the same time, third-party reviews flag
      D2C telehealth pricing premia, cancellation friction, and response delays, while even
      a sponsored sector write-up frames competition and handoff into traditional care as
      unresolved questions. That combination supports scenario ranges and diligence gates,
      not a precise intrinsic value.
    claimRefs: [CV001, CV003, CV004, CV007, CV008, CV009, CV010, CV012, CV013]
    tableRefs: [TV003]
  - id: diligence-triggers-and-exit-discipline
    title: Diligence triggers and exit discipline
    body: >-
      The practical implication is price discipline. A move toward buy would require either
      fresher private-market evidence showing that the 2022 mark has already reset into a
      more attractive entry zone, or audited proof that Ro's current GLP-1 mix produces
      durable revenue growth with acceptable gross margin, retention, and service quality.
      A move toward avoid would become more likely if updated disclosures show material
      preference overhang, weaker-than-implied unit economics, or customer-service drag that
      makes cash-pay demand expensive to retain. Because the assigned public evidence stops
      short of those underwriting inputs, the right current posture is to keep Ro on the
      watchlist, define the next diligence packet, and avoid pretending that a stale private
      mark is a present-day fair value.
    claimRefs: [CV007, CV008, CV010, CV011, CV012]
callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Track. Ro has enough operating proof and strategic partner validation to stay on the
      list, but not enough current valuation disclosure to support a buy at the last public
      mark.
    claimRefs: [CV001, CV003, CV010, CV011]
  - calloutType: risk
    title: What would break the thesis
    body: >-
      A disclosed down-round, punitive preference stack, or evidence that D2C pricing and
      service friction are eroding retention would move the case from track toward avoid.
    claimRefs: [CV007, CV008, CV010, CV012]
