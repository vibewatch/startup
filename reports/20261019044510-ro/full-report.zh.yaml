              Melynda Barnes、Raoul Manalac 和 Nitin Vaswani 等临床负责人。这说明 Ro 不是单一创始人的科学项目；但公开叙事仍明显以 CEO 为中心，因为 Reitano
              仍是发布里程碑和战略定位的主要发言人。治理透明度低于运营透明度：资料池显示董事会成员曾陆续增加，却没有披露当前董事名单、委员会架构或投资人控制条款。
