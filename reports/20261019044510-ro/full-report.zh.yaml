chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、规模与运营模式
        blocks:
          - type: paragraph
            body: >-
              Ro 可以定位为一家起源于纽约、直达患者的医疗公司；其当前模式把远程问诊接入、药房履约、诊断和软件协调结合起来，而不是只做单一病症应用。最强的官方证据来自 ro.OS 页面和 2023 年 Ro Body
              上线公告：两者都描述了覆盖患者接入、临床审核、实验室和药物配送的端到端平台。因此，后续产品、客户和风险分析都可以放在同一个操作系统下理解，而不是拆成多个品牌。规模数据则部分受公司控制：Ro
              宣称拥有数百万会员或患者、数千万次治疗和数亿次护理互动，但指定资料池没有经审计的 2026 年收入、员工数或 2022 年之后估值披露。
