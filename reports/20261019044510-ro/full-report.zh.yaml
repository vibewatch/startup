            body: >-
              公开可见的信任控制有实际意义，但比完整的企业技术尽调材料更窄。Ro 和当前资料披露了医生审核、州别和年龄限制、GLP-1 安全警示、处方门槛，以及 Ro
              平台与附属医疗机构的区别。这些都是有用的工作流控制，尤其适用于受监管的消费者医疗模式。薄弱之处在于软件和运营成熟度的独立证明：指定资料池没有公开可用性报告、事故历史、API
              文档、隐私控制架构或工程遥测，投资人无法据此检验整合栈的表现是否真的显著好于叙事。这个证明缺口很重要，因为产品面已足够广，实验室、履约、保险支持或复诊中的运营失误都可能同时损害护理质量和留存。
