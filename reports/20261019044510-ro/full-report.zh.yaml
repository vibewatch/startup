  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场或类别
      - 纳入的支出或流程
      - 排除的支出或流程
      - 买方或付款方
      - 与 Ro 的相关性
    rows:
      - - 面向患者的肥胖护理
        - 在线问诊登记、医生审核、保险覆盖导航、用药管理、按需进行的化验、履约协调和后续跟进。
        - 药品制造商利润、PBM 回扣、医院服务和全面慢病管理。
        - 患者购买并使用服务；药品费用可能由患者、保险方或制造商援助计划承担。
        - 核心市场，因为 Ro 围绕品牌 GLP-1 药物打包提供获取渠道和护理。
      - - 直接药品支出
        - 患者通过 Ro 流程购买处方药所支付的费用。
        - 不假设全部药价都是 Ro 的收入，也不假设 Ro 控制制造商定价。
        - 患者、保险方和制造商援助计划，取决于资格。
        - 能带动需求的相邻交易价值，但不等同于 Ro 护理层的经济价值。
      - - Ro 的其他门诊类别
        - 性健康、脱发和皮肤护理的在线治疗流程。
        - 住院护理、专科操作和完整的初级保健关系。
        - 消费者患者，通常直接付费。
        - 属于获客和交叉销售的相邻业务，而不是只针对肥胖市场的分母组成部分。
      - - 传统医生与药房
        - 线下或混合式诊断、开药、事先授权、监测和零售药房履约。
        - Ro 的数字化便利、消息沟通和一体化导航层。
        - 患者和健康计划。
        - 现状替代方案，尤其适合需要体格检查或多专科护理的复杂患者。
      - - 制造商直达渠道
        - LillyDirect、NovoCare 及类似的现金支付或履约渠道，由药品制造商控制。
        - Ro 独立的会员费和更广泛的多疾病关系。
        - 患者和制造商；适用时也涉及保险方。
        - 既是供应合作方，也是可能压低 Ro 定价权或绕开其护理层的替代方案。
    notes: 这一边界将 Ro 的护理与获取角色同药品及更广泛的医疗支出区分开来；按流程划分的确切收入分配属于非公开信息。
