  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 相关市场是护理与可及性层，而不是药物制造
        blocks:
          - type: paragraph
            body: >-
              Ro 的相关市场是美国面向患者的常见门诊病症工作流，当前最显眼的切入口是肥胖护理。纳入的支出包括线上接入、医生审核、保险导航、用药管理、药房或配送协调、实验室和复诊。药物支出虽在经济上相邻，但不能因为药物通过
              Ro 的工作流提供，就把它视为 Ro 控制的收入：DrugPatentWatch 描述为厂商决定 GLP-1 药价，而 Ro 另收护理会员费。Ro
              也销售性健康、脱发和皮肤服务，这些类别可以贡献获客和交叉销售，但不属于仅针对肥胖的市场估算。

              排除项包括药厂经济利益、PBM 返利、医院护理、专科操作和完整初级保健。现状替代方案是本地医生和药房；相邻替代方案包括 LillyDirect、NovoCare
              等厂商直达渠道，它们可能让远程医疗中介变得可有可无。这个边界意味着，Ro 的投资逻辑取决于便利、导航、连续性和分销可及性的价值，而不是专有治疗知识产权。
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
              - CM014
      - number: '2.2'
        title: 触达信号有分量，但不能构成 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              指定证据支持几种有用但不可相加的规模视角。DrugPatentWatch 引述 Novo Nordisk 的评论称，2026 年 Q2 美国注射 Wegovy 销售中自费患者约占 35%，高于一年前约 10% 至
              15%。Ro 另称拥有超过 300 万会员，TipRanks 则报道其保险查询器帮助超过 200 万人评估保障范围。Ro 2023 年公告称较早的 Plenity 项目服务过超过 160,000
              名患者；后续公司研究跟踪了 655 名持续使用 semaglutide 的患者 68 周。这些数字分别反映渠道需求、漏斗顶部触达、历史项目规模和选定临床队列，但分母并不相同。

              留存来源没有披露活跃肥胖会员数、Ro 可触达的美国合资格患者、保险查询到转化的比例、支付方构成或当前肥胖收入。把这些触达指标硬套进 TAM、SAM 和 SOM
              层级，会制造虚假的精确度。合适的估值处理是承认其已形成规模化分销和护理触点，同时在管理层提供队列和收入分母前，暂不锁定市场份额和变现假设。
            claimRefs:
              - CM005
              - CM007
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
