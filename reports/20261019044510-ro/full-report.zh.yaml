              的厂商直达渠道。这支持一个真实的产品逻辑：Ro 销售的是便利、协调和渠道可及性，而不只是低摩擦开方。代价是依赖关系复杂。Ro 的广度现在横跨传统 Roman
              产品、新的减重项目、收购的生育和诊断资产、附属诊所、合作药房或实验室，以及药品供应关系；因此，产品质量持续稳定，取决于多个受监管且由第三方控制的瓶颈，而公开证据对这些瓶颈的透明度有限。
