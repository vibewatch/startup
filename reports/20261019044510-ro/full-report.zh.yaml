  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 规模和合作证据真实存在，但价格过时且执行不透明，因此建议仍为持续跟踪。
    data:
      nodes:
        - id: demand-proof
          label: 需求证明
          detail: 2024 年 $598M 的收入估算和 3M+ 营销会员显示出真实规模。
          tone: positive
        - id: distribution-leverage
          label: 分销杠杆
          detail: Novo 于 2026 年推出口服 Wegovy，加上 Ro 的保险检查器漏斗，进一步证明其患者导流价值。
          tone: positive
        - id: stale-price-anchor
          label: 过时的价格锚点
          detail: 最近的公开估值标记仍是 2022 年 2 月的 $7B 轮。
          tone: risk
        - id: disclosure-gap
          label: 披露缺口
          detail: 公开证据仍缺少当前 ARR、利润率、烧钱、现金和优先权结构细节。
          tone: risk
        - id: execution-drag
          label: 执行拖累
          detail: D2C 溢价定价、取消阻力和竞争仍可能压低回报。
          tone: risk
        - id: track-recommendation
          label: 建议：持续跟踪
          detail: 在把买入纳入投资判断前，需要更新的财务和股权结构证据。
          tone: neutral
      edges:
        - from: demand-proof
          to: distribution-leverage
          label: 支持上行空间
        - from: distribution-leverage
          to: stale-price-anchor
          label: 但估值落后于运营
        - from: stale-price-anchor
          to: disclosure-gap
          label: 需要当前投资判断数据
        - from: disclosure-gap
          to: execution-drag
          label: 披露缺失放大风险
        - from: execution-drag
          to: track-recommendation
          label: 保持价格纪律
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV010
      - CV011
