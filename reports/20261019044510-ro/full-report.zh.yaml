      - number: '4.4'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              Ro 的财务可信度高于典型早期远程医疗项目，因为公开证据支持其具有规模、品类广度，以及从仿制药扩展到高客单价肥胖管理的复购护理收入循环。问题不是商业信号不足，而是缺少可用于投资判断的披露。收入质量仍取决于偏重
              GLP-1 的组合；挂牌价比实际利润率更容易观察；当前最强的增长催化剂由 Novo 和 Lilly 控制，而不是 Ro 单独控制。我的工作判断是：Ro
              已经是一项规模可观、可能拥有持续收入的业务，但在管理层提供按品类审计收入、毛利率、现金消耗、现金、债务及留存或回本数据前，利润路径和融资需求仍未经证明。
