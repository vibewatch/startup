      - number: '3.4'
        title: 关键不确定性在渠道经济和未来进入者
        blocks:
          - type: paragraph
            body: >-
              指定资料池足以描绘今天的定位，却不足以回答所有持久性问题。独立来源显示，Ro 的运营模式从 2023 年推出带辅导的 GLP-1 项目，逐渐转向 2026
              年以品牌药可及性、会员经济和选择性实验室或视频服务为中心的姿态。资料池没有揭示厂商链接背后的经济性、护理团队带来的留存收益，或支付方、雇主和药厂是否会继续承担患者旅程的更多环节。这些缺口很重要，因为它们决定了肥胖治疗分销标准化后，Ro
              能否维持溢价。
            claimRefs:
              - CP006
              - CP007
              - CP014
              - CP016
      - number: '3.5'
        title: 展示项
