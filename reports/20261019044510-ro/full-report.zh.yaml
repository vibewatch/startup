            body: >-
              Ro 的公开牵引力方向很强，但仍是公司口径和第三方估算拼成的图景，而非经审计披露。Sacra 和 DrugPatentWatch 都将 2024 年年化收入估在约 $598
              million，收入同比增速处于中段；Sacra 将其中很大一部分增长归因于 GLP-1 扩张。Ro 官方渠道也以数百万会员的口径强化消费者触达；最初的 Body 上线公告称，在 GLP-1
              之前的减重产品已经服务超过 160,000 名患者。这些数据说明了真实规模，但没有回答利润质量最关键的投资判断：减重收入的贡献经济性比传统品类更好还是更差，GLP-1 采用初期激增后有多少收入可持续，以及 Ro
              为维持运转需要承担多少临床、药房、实验室和支持成本。
