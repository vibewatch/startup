      - number: '4.3'
        title: 资本充足性是核心尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开记录更清楚地支持融资依赖风险，而不是当前资本充足。Wikipedia 和 Sacra 仍回溯到 2022 年 2 月、$7 billion 估值的融资，以及约 $1.0 billion
              累计一级资本；但指定来源没有更新现金、债务或现金跑道。如果模式明显轻资产，这一问题会小一些；但现有证据恰恰相反：Ro
              的平台整合远程医疗、实验室、药房编排、保险支持工作流和持续复诊，外部分析师也认为这种连续护理模式在服务侧更耗资本。同时，当前上行叙事很大程度依赖厂商渠道和上市时点。结果是，投资人能看到收入动能，却还无法核实公司能否靠内部资金增长，还是需要新资本维持增长。
