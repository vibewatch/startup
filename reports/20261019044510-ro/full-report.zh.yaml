  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争集合覆盖直接同行、相邻方案和现状替代
        blocks:
          - type: paragraph
            body: >-
              Ro 面对的不是单一的同类远程医疗克隆体。在指定证据中，最接近的直接基准是 Hims & Hers 及更广泛的纯处方异步服务群；Calibrate 和 FORM
              则代表更依赖临床人员的肥胖护理。Found、Noom 式行为项目和 Sesame 式急诊接入处于相邻位置；当患者有复杂共病或希望建立更完整的医疗关系时，传统初级保健仍是现状替代方案。因此 Ro
              真正争夺的不是一个排他的品类定义，而是买方愿意在药物可及性之上叠加多少支持、监督和便利。
            claimRefs:
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP008
