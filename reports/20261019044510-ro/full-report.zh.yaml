              公开证据中置信度最高的风险，是 GLP-1 品类及为该品类供给的厂商渠道集中。一个 2026 年资料称 Ro 在 2024 年创造约 $370 million 的 GLP-1 收入；另一篇 2026 年文章称
              Novo Nordisk 正把 Ro 作为口服 Wegovy 的主要直达患者上市渠道。这种组合有利于增长，但也意味着供应政策、品牌定价和合作方议价能力可能比 Ro
              自身产品路线更快地改变业务。第二大风险是监管解释：独立报道称，即便远程医疗平台点名药物，只要不是厂商关联方，也可能不受 FDA 广告公平平衡制度约束；Ro
              自己的广告活动已经引发争议。第三个风险是运营模糊。公开描述对当前减重方案是否包含实时辅导、代谢检测和同步互动并不一致，因此在判断留存、安全或利润前，必须先核对实际运营手册。
