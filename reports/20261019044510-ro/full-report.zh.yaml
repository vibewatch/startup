        title: 收入模式与公开定价证据
        blocks:
          - type: paragraph
            body: >-
              公开证据指向以现金支付、按病症打包的护理收入，而不是广泛的保险报销。Ro 自有页面直接向消费者销售
              GLP-1、勃起功能障碍治疗和其他项目，并展示相对标价的节省；独立评论则描述了把问诊、药物和配送合并在一起的订阅定价。这支持一种判断：Ro
              变现的是由药物驱动的持续路径，而不是孤立的线上问诊。最强的公开定价证据来自肥胖护理：第三方评论将复配 semaglutide 定价放在每月约 $145-$299，Ro 当前官网则突出
              Wegovy、Zepbound 和 Foundayo 的较低现金支付起始价。缺失的是实际成交价：公开材料展示挂牌价和促销价，却没有披露退款、拒付、节省卡使用或产品组合影响后的平均售价。
