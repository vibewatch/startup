companyProfile:
  summary: >-
    Ro 是一家总部位于纽约、2017 年成立的直达患者医疗公司，通过 ro.OS 工作流把远程问诊接入、药房履约、诊断和持续护理串在一起。公司最初以 Roman 运营，之后从男性健康扩展到 GLP-1
    肥胖护理、生育、女性健康、戒烟、头发、皮肤和日常健康项目。现有证据仍显示其拥有可观的消费者触达、真实的运营平台和持续推进的 GLP-1 商业化；最新第三方规模估算则指向约 1,473 名员工和约 $1.03 billion
    累计融资。核心问题没有改变：当前增长有多少可持续，GLP-1 组合有多赚钱，以及旧的 $7 billion 私募估值是否仍接近现实。
