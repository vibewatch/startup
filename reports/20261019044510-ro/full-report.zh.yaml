          - type: paragraph
            body: >-
              Ro 的运营模式降低了简单病症的摩擦，但当病例涉及多种药物、慢性病或快速变化时，同一设计可能把复杂性转嫁给患者。一篇 2026 年评论称平台依赖患者准确自我披露，并引用公开证据称 23%
              的远程医疗用户未报告至少一种正在使用的处方药。The Verge 还报道，Ro
              的临床医生属于附属网络而非直接雇员，这可能让处方、药房履约和后续随访之间的责任变得碎片化。独立评论进一步指出服务质量风险：以消息为主的互动和与剂量挂钩的涨价，对简单续方体验或许可以接受，但当副作用、拒付争议或品牌药与复配药替换增加时，可能推高流失和支持负荷。没有拒付率、不良事件或投诉解决数据，这些风险目前仍只能部分界定。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR014
              - CR015
      - number: '7.4'
        title: 依赖经济与终止标准
        blocks:
          - type: paragraph
            body: >-
              剩余的经济风险是：Ro 可能是强大的分销层，却对底层价值池的控制弱于预期。公开来源一致认为，大多数项目仍主要由用户自付；自有页面展示的减重价格约从每月 $149 到 $299 起；独立评论则显示复配
              semaglutide 价格随剂量上升，从 $145 上升到 $289。这是一个可用的消费者方案，但如果厂商重定价品牌药可及性、监管进一步收紧复配空间，或患者面对持续月度支出后高剂量留存走弱，Ro
              就会暴露。可监测的实际终止标准包括：失去优先厂商可及性；证据显示当前护理路径明显薄于公开上线材料中的宣称所暗示的程度；或内部数据表明，高剂量自费层的取消、副作用升级或续方拒付显著上升。
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 厂商渠道集中是核心论点破坏因素
            body: 如果 Ro 的优先品牌 GLP-1 可及性减弱，公开证据无法保证单靠软件便利就能抵消短缺风险、重新定价或更高自费剂量下更差的留存。
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR015
          - type: callout
            title: 当前护理强度需要直接尽调
            body: 2023 年官方上线材料与 2026 年独立评论并不一致，无法确认辅导、代谢检测和同步医生联系是否是当前减重路径的标准配置；因此，在判断安全或流失假设前，应要求管理层核对实际运营模式。
            calloutType: assumption
            claimRefs:
              - CR004
              - CR013
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建立投资建议
        blocks:
          - type: paragraph
            body: >-
              公开记录仍显示 Ro 是真实的运营资产，而不是概念阶段项目。Multiples 将 Ro 2024 年收入估为约 $598 million，高于 2023 年估算的 $360 million；Ro 自己的
              2026 年材料也显示其通过 Novo Nordisk 直达上市继续推进 GLP-1 商业化，官网如今面向超过 300 万会员。BounceWatch 还列出约 $1.03 billion 累计融资和 1,473
              名员工，这很重要，因为投资人面对的是一家固定成本可观的规模化平台，而非早期试验。话虽如此，最新公开价格锚点仍是 2022 年 2 月的 $7 billion 轮次。在留存证据没有当前经审计
              ARR、利润率、现金消耗、现金或优先股堆叠披露的情况下，公开支持足以引起兴趣，却不足以按旧估值给出明确买入判断。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV010
              - CV011
      - number: '8.2'
        title: 估值背景与情景
        blocks:
          - type: paragraph
            body: >-
              正面情景容易理解：Ro 正把远程医疗、药房、实验室和 GLP-1 可及性的规模，转化为更广泛的厂商相关性。2026 年 Novo 药片上市和 Ro
              的保险查询漏斗都暗示，平台具有小型单点方案不具备的需求捕获和患者分流价值。但公开估值工作仍是方向性的，而非决定性的。Multiples 保留了 Ro 的历史融资阶梯，并报告 2020 年 7 月 $1.5
              billion Series C 对应 6.0x 收入倍数；不过后续轮次虽披露估值，却没有同时期公开收入分母。与此同时，第三方评论指出 D2C
              远程医疗的定价溢价、取消摩擦和响应延迟；甚至一篇有赞助的行业文章也把竞争和转回传统医疗视为未解决问题。因此，应使用情景区间和尽调门槛，而不是给出精确内在价值。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: 尽调触发条件与退出纪律
        blocks:
          - type: paragraph
            body: >-
              实际含义是要守住价格纪律。若要转向买入，至少需要更新的私募市场证据，证明 2022 年估值已重置到更有吸引力的入场区间；或者需要审计证明，Ro 当前 GLP-1
              组合能够以可接受的毛利率、留存和服务质量带来持久收入增长。若更新披露显示优先权负担明显、单位经济性弱于暗示，或客服拖累让自费需求难以留存，则转向回避的可能性会更高。由于指定公开证据尚未提供这些投资判断输入，当前正确姿态是把
              Ro 留在观察名单，明确下一轮尽调材料，不要把过时的私募估值假装成今天的公平价值。
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: 展示项
        blocks:
          - type: callout
            title: 建议
            body: 跟踪。Ro 有足够的运营证明和战略合作方验证，值得留在名单上；但当前估值披露不足，无法支持按上一次公开估值买入。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
          - type: callout
            title: 什么会破坏论点
            body: 若披露下轮融资、惩罚性优先股堆叠，或证据显示 D2C 定价和服务摩擦正在侵蚀留存，投资判断会从跟踪转向回避。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV012
