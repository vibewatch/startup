      - number: '2.3'
        title: 患者是买方，也常常是预算承担者
        blocks:
          - type: paragraph
            body: >-
              Ro
              主要服务重视速度、隐私、远程接入，或需要帮助穿越碎片化保险体系的消费者。在自费路径中，患者同时是会员费和药费的买方、用户与预算承担者。在保险辅助的品牌药路径中，患者仍选择并使用服务，但保险公司和厂商节省计划可能承担部分药费，患者仍要承担剩余自付额。HealthRx
              认为 Ro 大多数项目不在传统保险范围内，而 Ro 官网明确同时营销有保险和无保险的 GLP-1 可及性，因此支付责任会随产品和资格变化。

              用户先在线上完成接入和临床审核，必要时再进行检测或视频问诊、保险处理、处方管理和持续支持。Ro 2023 年 Body Program
              公告提到代谢检测、护士辅导、体重追踪和医生复诊。现有证据不能证明每个产品都包含所有服务，因此尽调应区分不同药物和支付路径的工作流及服务成本，而不是假定存在统一的会员套餐。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM008
              - CM009
              - CM014
      - number: '2.4'
        title: 厂商可及性和自费增长推动采用，但渠道力量限制价值捕获
        blocks:
          - type: paragraph
            body: >-
              Ro 受益于这样一个品类：品牌 GLP-1 厂商越来越需要直接现金支付和数字化支持的分销。Charles Kirkland 的分析认为，Ro 原有的医生、药房、实验室、保险和获客基础设施，在 GLP-1
              需求加速后变得更有价值。TipRanks 也把 Ro 描述为 Novo Nordisk 口服 Wegovy 上市的主要直达患者平台。这一定位可以降低患者摩擦，使 Ro
              在全国上市时对厂商有用；同时，公司更广的会员基础可以降低推出相邻护理项目的成本。

              同一结构也带来约束。厂商直达渠道掌握定价，并可绕过或替代中介；药价下降时，Ro 的独立会员费会变得更显眼。留存研究队列同样是筛选后的样本：其中患者坚持治疗，并在第 68
              周报告体重，因此不能据此推导整体留存或总需求。没有活跃会员数、转化、流失、获客成本和路径贡献利润率，市场动能还不能等同于已验证的持久经济性。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 触达不等于可变现的市场份额
            body: 累计会员、保险查询、历史患者和选定临床队列都说明了需求与运营触达，但没有一个披露活跃肥胖会员、转化、留存或分部收入。
            calloutType: risk
            claimRefs:
