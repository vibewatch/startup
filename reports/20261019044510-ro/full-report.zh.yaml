  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Ro 的公开发展轨迹从早期远程医疗和融资里程碑，走向 2023-2026 年以 GLP-1 为核心的运营故事。
    data:
      items:
        - date: '2017'
          label: Roman 启动并获得种子轮融资
          detail: Wikipedia 称，公司于 2017 年以 Roman 之名启动，并获得由 General Catalyst 领投的 $3.1 million 种子轮融资。
          tone: neutral
        - date: '2018'
          label: 更名为 Ro 并扩张 Series A
          detail: Wikipedia 称，公司更名为 Ro，完成 $88 million Series A 融资，并让 Alexis Ohanian 加入董事会。
          tone: positive
        - date: 2020-01
          label: Pfizer 采购合作
          detail: Wikipedia 称，Ro 于 2020 年 1 月与 Pfizer 合作采购西地那非。
          tone: positive
        - date: 2020-12
          label: 收购 WorkPath
          detail: Wikipedia 称，Ro 于 2020 年 12 月收购 WorkPath，以扩展居家诊断能力。
          tone: positive
        - date: 2021-03
          label: Series D 确立历史资本基准
          detail: Wikipedia 称，Ro 于 2021 年 3 月以 $5 billion 估值筹得 $500 million。
          tone: positive
        - date: 2021-05 to 2021-06
          label: 收购 Modern Fertility 和 Kit
          detail: Wikipedia 称，Ro 于 2021 年收购 Modern Fertility 和 Kit，拓展女性健康和居家检测业务。
          tone: positive
        - date: 2023-01
          label: Ro Body 上线
          detail: PR Newswire 称，Body Program 上线时提供 GLP-1 获取、代谢检测、医生视频问诊和护士指导。
          tone: positive
        - date: '2024'
          label: LillyDirect / Zepbound 集成
          detail: Wikipedia 描述了 2024 年末的 LillyDirect 集成，用户可通过平台获取 Zepbound。
          tone: positive
        - date: '2025'
          label: 降价 Wegovy 合作
          detail: Wikipedia 称，Ro 随后宣布与 Novo Nordisk 集成，以较低价格提供 Wegovy。
          tone: positive
        - date: 2026-01
          label: 通过 Ro 推出 Wegovy 口服药片
          detail: Wikipedia 和 2026 年 1 月的 TipRanks 文章均指出 Ro 参与了 Wegovy 口服药片的推出。
          tone: positive
    approximationNotes: 时间线项目综合指定来源中的带日期里程碑，强调面向公众的公司事件，而非私有运营变化。
    claimRefs:
      - CO002
      - CO005
      - CO009
      - CO010
      - CO011
      - CO013
      - CO015
      - CO016
  - id: FM001
    title: 市场规模评估的证据层级
    type: pyramid
    summary: 公开信号从品类需求逐步收窄到 Ro 的触达范围和选定结果队列，但并未建立嵌套的 TAM/SAM/SOM 层级。
    data:
      items:
        - label: 美国自费品牌药需求
          value: 35%
          unit: injectable Wegovy sales
          detail: 2026 年第二季度约为 35%，高于前一年同期约 10% 至 15%。
        - label: Ro 累计会员触达
          value: 3,000,000+
          unit: members
          detail: 公司披露的平台累计触达，并非活跃肥胖症会员数。
        - label: 保险导航触达
          value: 2,000,000+
          unit: people
          detail: TipRanks 报道的保险检查器用户数，并非转化数。
        - label: 历史体重管理触达
          value: 160,000+
          unit: patients
          detail: Ro 于 2023 年披露的早期 Plenity 项目触达。
        - label: 坚持治疗的研究队列
          value: '655'
          unit: patients
          detail: 坚持治疗并在第 68 周报告体重的患者。
        - label: 选定队列结果
          value: 16.6%
          unit: average body-weight reduction
          detail: 选定的 655 名患者队列所报告的结果。
        - label: 护理会员费
          value: $145
          unit: per month after month one
          detail: 在 DrugPatentWatch 的定价分析中，该费用与药物费用分开。
    approximationNotes: 数值按保留来源原样呈现，未做转换。各层的人群、期间和单位不同；它们既非嵌套关系，也不可相加，不应解读为 TAM、SAM、SOM 或漏斗。
    claimRefs:
      - CM005
      - CM006
      - CM007
      - CM010
      - CM011
      - CM012
      - CM013
      - CM016
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 基于证据的序数评分将 Ro 定位在纯处方便利性和专业代谢项目之间，而厂商渠道已经在缩小履约差异化。
    data:
      points:
        - label: Ro
          x: 3
          'y': 5
          note: 中等强度的临床体系，整合远程医疗、实验室和药房运营。
          claimRefs:
            - CP001
            - CP007
            - CP008
            - CP014
        - label: Hims / 纯处方异步服务
          x: 2
          'y': 4
          note: 获取阻力更低、结构更轻；在指定比较中，表面套餐价格更便宜。
          claimRefs:
            - CP009
            - CP010
            - CP011
        - label: Calibrate / 专业项目
          x: 5
          'y': 2
          note: 监管最严格，需要实验室检查、指导和高承诺度的经济模式。
          claimRefs:
            - CP008
            - CP012
        - label: Found / 行为导向的相邻方案
          x: 4
          'y': 3
          note: 比纯处方同业更偏重项目，但样本中未将其呈现为一体化履约栈。
          claimRefs:
            - CP008
            - CP010
        - label: 传统初级保健
          x: 4
          'y': 1
          note: 更适合复杂的多系统护理，但对简单 D2C 场景而言，打包便利性较低。
          claimRefs:
            - CP013
        - label: 厂商直达渠道
          x: 2
          'y': 4
          note: LillyDirect 和 NovoCare 已经介入品牌 GLP-1 获取，把价值重心推向药厂。
          claimRefs:
            - CP014
    approximationNotes: 仅依据引用证据进行 1-5 分序数分析：X 越高代表临床强度 / 支持越高；Y 越高代表对分销和便利性的直接控制越强。分数并非来源发布的基准。
    claimRefs:
      - CP001
      - CP008
      - CP010
      - CP012
      - CP013
      - CP014
  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: Ro 将消费者从线上需求获取导入持续性的临床和用药流程来变现，但利润率最终受服务交付和厂商渠道经济性约束。
    data:
      nodes:
        - label: 直达消费者的需求获取
          detail: 首页定价和按品类获客带来漏斗顶部流量。
        - label: 结构化问诊与资格审核
          detail: 线上问诊将患者导入临床审核和特定项目流程。
        - label: 订阅或问诊变现
          detail: 公开材料强调打包月度项目或按次定价。
        - label: 用药路径选择
          detail: Ro 将患者引导至复配药、品牌药或仿制药履约路径。
        - label: 持续随访与支持
          detail: 随访、消息、指导和保险支持让收入循环持续发生。
        - label: 扣除护理和渠道成本后的贡献利润率
          detail: 由于公开证据未披露销货成本或合作伙伴经济性，毛利可见度有限。
    approximationNotes: 这是从公开流程和定价证据推导出的定性运营桥接；指定来源池未披露贡献利润率或中间转化率，因此不是量化瀑布图。
    claimRefs:
      - CI002
      - CI004
      - CI007
      - CI008
      - CI010
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据将 Ro 描绘为分层护理运营栈，把问诊、临床审核、履约、检测和用户互动都纳入一个产品系统。
    data:
      layers:
        - label: 消费者入口与问诊
          detail: 患者通过特定病症的店面进入，并在临床审核前完成结构化线上评估。
          modules:
            - label: 产品目录
              note: Weight loss sexual health hair skin fertility and daily-health offers
            - label: 线上评估
            - label: 资格与安全提示
              note: GLP-1 warnings and contraindication disclosures are public
          outputs:
            - 特定病症问诊资料包
            - 患者病史与目标数据
        - label: 临床审核与护理规划
          detail: 关联临床医生审核问诊数据、与患者沟通，并在护理交付流程中记录治疗或随访决定。
          modules:
            - label: Care Delivery App
            - label: 异步审核加视频升级
            - label: 医生消息与病历记录
          outputs:
            - 处方或治疗决定
            - 随访任务与护理计划
        - label: 药房、实验室与保险运营
          detail: ro.OS 将用药履约、检测和保险覆盖支持串在同一条路径上，而不是交给彼此割裂的环节。
          modules:
            - label: Pharmacy App
            - label: Lab App
            - label: 居家代谢检测
            - label: 保险导航支持
          outputs:
            - 用药履约路径
            - 返回患者和医生的结果与保险覆盖更新
        - label: 持续互动与监测
          detail: Ro 让患者留在平台内完成进度跟踪、副作用报告、指导、排期和续订触点。
          modules:
            - label: Patient App
            - label: 副作用管理流程
            - label: AI 分诊与保险透明度内容
          outputs:
            - 进度跟踪与续订循环
            - 持续消息沟通与指导
        - label: 信任与资格控制
          detail: 公开控制包括临床医生审核、取决于服务和州别的可用性、安全警示，以及 Ro 平台与关联诊所之间的区隔。
          modules:
            - label: 临床医生授权
            - label: 可用性与资格规则
            - label: 用药安全披露
          outputs:
            - 受控治疗路径
            - 已披露的平台与诊所边界
        - label: 外部运营依赖
          detail: 这套一体化体验仍依赖关联诊所、检测与履约合作伙伴、收购资产和药品供应关系。
          modules:
            - label: 关联诊所
            - label: 实验室和药房合作伙伴
            - label: 厂商渠道
          outputs:
            - 护理与履约能力
            - 供应与服务约束
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE009
      - CE010
      - CE013
      - CE014
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Ro 的客户路径是一个数字化消费者循环：从自助问诊进入医生审核、保险覆盖或定价决策、履约和持续支持。
    data:
      nodes:
        - label: 需求识别
          actor: Consumer
          phase: Discovery
          touchpoints:
            - Roman, Rory, and Ro Body condition-specific entry points
            - Direct-to-patient positioning rather than employer or provider referral
          tone: neutral
        - label: 线上问诊
          actor: Consumer
          phase: Screening
          touchpoints:
            - Online questionnaire covering health history, medications, and goals
            - Some pathways add lab orders or additional screening
          tone: neutral
        - label: 临床审核
          actor: Licensed provider
          phase: Qualification
          touchpoints:
            - Asynchronous review with optional or required video in some pathways
            - Prescription only if the provider confirms eligibility
          tone: neutral
        - label: 保险覆盖与定价决策
          actor: Consumer, insurer, and Ro support
          phase: Conversion
          touchpoints:
            - Membership fee plus medication price
            - Insurance concierge and prior-authorization help for branded GLP-1s
          tone: warning
        - label: 履约
          actor: Ro and manufacturer channels
          phase: Treatment start
          touchpoints:
            - Ro Pharmacy for some categories
            - LillyDirect or Novo-linked branded GLP-1 channels for current weight-loss expansion
          tone: neutral
        - label: 持续依从
          actor: Member and care team
          phase: Retention
          touchpoints:
            - Provider messaging, check-ins, and app-based support
            - Customer-service delays or billing friction can interrupt the experience
          tone: opportunity
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU010
      - CU011
      - CU012
      - CU013
