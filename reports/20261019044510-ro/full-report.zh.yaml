      - number: '3.3'
        title: 运营整合真实存在，但厂商和替代方案的力量限制护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Ro 的可防御优势在运营，而非治疗本身。公司材料和独立评论都持续指出其整合了远程医疗、药房、实验室和履约工作流；Telehealth Match 还强调了品牌 GLP-1 的 Lilly 和 Novo
              直达渠道。这些能力应能改善质量控制、事前授权支持和患者体验。但当竞争者销售相似药物时，它们不会形成高切换成本；若厂商加深直达渠道，或患者因需求更复杂而回到初级保健，这种中介价值还可能被部分削弱。因此，护城河是服务层优势，必须持续赚取溢价。
