      - number: '3.2'
        title: Ro 的定价高于最轻量的远程医疗选项，以支撑更结构化的护理层
        blocks:
          - type: paragraph
            body: >-
              最强的直接比较是 Ro 与 Hims 式用药可及性。Ro 官网销售多专科产品组合和品牌 GLP-1 入门价；U.S. News 与 TelehealthAlly
              则描述了包含保险导航、消息沟通和部分辅导的会员加药物模式。这一结构明显比纯异步处方履约更丰富，但仍比要求实验室检查和更长期承诺的 Calibrate 式专科项目轻。结果是夹在中间：Ro
              必须证明会员费合理，却无法匹配市场中最深的临床项目。
