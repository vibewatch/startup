  evidenceGaps:
    - type: missing-source
      severity: material
      topic: exact-market-sizing
      missingEvidence: Active obesity members, eligible population, coverage-check conversion, payer mix, current obesity revenue, and comparable category denominators needed for TAM, SAM, SOM, and market share.
      whyItMatters: Without common denominators, company reach and clinical cohorts can materially overstate Ro's monetizable market.
      diligencePath: Obtain management cohort counts and segment revenue, then reconcile them to an independently sourced eligible U.S. patient population.
      relatedQuestionRefs:
        - QM008
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: pathway-unit-economics
      missingEvidence: Customer-acquisition cost, conversion, churn, retention, gross margin, and contribution margin by medication and payer path.
      whyItMatters: Channel growth creates enterprise value only if Ro retains durable economics after clinical, fulfillment, support, and acquisition costs.
      diligencePath: Request cohort-level unit economics for cash-pay and insurance-assisted branded pathways, including manufacturer-linked programs.
      relatedQuestionRefs:
        - QM005
    - type: stale
      severity: minor
      topic: workflow-consistency
      missingEvidence: Current product-level documentation showing which pathways include labs, video visits, coaching, insurance support, and ongoing clinician contact.
      whyItMatters: Service intensity affects both adoption and cost-to-serve, and the detailed workflow evidence retained here dates to 2023.
      diligencePath: Review each current onboarding flow and care protocol, then map included services and fees by medication.
      relatedQuestionRefs:
        - QM004
