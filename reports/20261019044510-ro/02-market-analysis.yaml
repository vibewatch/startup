  - id: TM003
    title: Segment and buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Cash-pay branded GLP-1 seeker
        - Adult patient seeking convenient obesity treatment.
        - Same patient.
        - Patient, potentially using manufacturer savings.
        - Online intake, clinician review, cash payment, medication coordination, and follow-up.
        - Patient.
        - Faster access, predictable price, or preference for remote care.
      - - Insurance-assisted branded GLP-1 seeker
        - Adult patient seeking help obtaining covered treatment.
        - Same patient.
        - Insurer and patient, potentially supplemented by manufacturer assistance.
        - Online intake, provider review, coverage navigation, authorization work, and fulfillment.
        - Health plan for covered drug spend; patient for residual cost.
        - Need for navigation through coverage and out-of-pocket complexity.
      - - Non-obesity Ro consumer
        - Consumer seeking sexual-health, hair-loss, or skin treatment.
        - Same patient.
        - Commonly the patient.
        - Digital intake, provider review, prescription when appropriate, and delivery.
        - Patient.
        - Privacy, convenience, or familiarity with Ro's existing categories.
      - - Pharmaceutical manufacturer
        - Drug company seeking direct patient reach and supported distribution.
        - Patients and prescribers use the pathway.
        - Manufacturer funds its channel; patients or insurers fund medication.
        - Integrate launch, pricing, prescription, payment, and home delivery through a care partner.
        - Manufacturer channel and commercial leadership.
        - National launch reach and access to patients who prefer direct or non-injectable options.
      - - Complex-care patient
        - Patient with comorbidity or examination needs beyond a standardized remote workflow.
        - Same patient.
        - Insurer and patient.
        - In-person primary or specialist care with local diagnostics and pharmacy.
        - Health plan and patient.
        - Need for physical examination, coordinated specialty care, or broader chronic-disease management.
    notes: >-
      Segment roles are derived from the retained workflow, insurance, pricing,
      and channel evidence; Ro does not disclose payer mix or conversion by segment.
