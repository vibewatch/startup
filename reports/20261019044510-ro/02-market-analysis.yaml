figures:
  - id: FM001
    title: Evidence hierarchy for market sizing
    type: pyramid
    summary: >-
      Public signals narrow from category demand to Ro-specific reach and a
      selected outcomes cohort, but they do not establish nested TAM/SAM/SOM layers.
    data:
      items:
        - label: U.S. self-pay branded demand
          value: "35%"
          unit: injectable Wegovy sales
          detail: About 35% in Q2 2026, up from roughly 10% to 15% a year earlier.
        - label: Ro cumulative member reach
          value: "3,000,000+"
          unit: members
          detail: Company-reported cumulative platform reach, not active obesity members.
        - label: Coverage-navigation reach
          value: "2,000,000+"
          unit: people
          detail: Insurance-checker users reported by TipRanks, not conversions.
        - label: Historical weight-management reach
          value: "160,000+"
          unit: patients
          detail: Earlier Plenity program reach reported by Ro in 2023.
        - label: Persistent study cohort
          value: "655"
          unit: patients
          detail: Patients who persisted and reported weight at 68 weeks.
        - label: Selected cohort outcome
          value: "16.6%"
          unit: average body-weight reduction
          detail: Reported outcome for the selected 655-patient cohort.
        - label: Care membership fee
          value: "$145"
          unit: per month after month one
          detail: Separate from medication in the DrugPatentWatch pricing analysis.
    approximationNotes: >-
      Values are reproduced from retained sources without transformation. The
      layers have different populations, periods, and units; they are neither
      nested nor additive and must not be read as TAM, SAM, SOM, or a funnel.
    claimRefs:
