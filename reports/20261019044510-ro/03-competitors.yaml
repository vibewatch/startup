callouts:
  - calloutType: "risk"
    title: "Manufacturer channels can compress Ro's moat"
    body: "Ro's operational integration matters most where it controls the workflow. On branded GLP-1s, LillyDirect and NovoCare already own more of the channel, so Ro's durable edge depends on patient acquisition, care-team support, and prior-authorization execution rather than on exclusive drug supply."
    claimRefs: ["CP010", "CP014"]
  - calloutType: "insight"
    title: "Ro wins if buyers want structure, but not a full clinic"
    body: "The clearest niche in the assigned evidence is the middle: patients who want more guidance than Hims-style access provides, but who do not want Calibrate-style commitment, specialist intensity, or price."
    claimRefs: ["CP008", "CP009", "CP012"]
