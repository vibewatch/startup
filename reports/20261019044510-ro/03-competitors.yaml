      - ["Hims & Hers", "Direct peer / public D2C telehealth", "Public company; $872M 2023 revenue per HealthRx", "Convenience-first buyers for ED, hair loss, and weight management", "Comparable product categories with lower-friction, async-first access and a stronger cited branded-Wegovy insurance pathway", "Less bundled structure and less direct control over pharmacy operations than Ro"]
