  - id: "TP003"
    title: "Pricing / packaging comparison"
    columns: ["Provider / class", "Price / unit / contract model", "Included capabilities", "Discounts / unknowns", "Implication"]
    rows:
      - ["Ro", "Membership $39 first month, then $74-$149/month depending on prepay; branded GLP-1 examples include Wegovy pill $149-$299, Wegovy pen $199-$349, and Zepbound vial $299-$449", "Insurance support, unlimited messaging, side-effect support, and coaching/lab features depending program flow", "Realized medication spend depends on dose, insurance, and plan configuration", "Ro is selling a structured convenience layer, not just a script"]
      - ["Hims & Hers", "$249-$399/month self-pay for GLP-1 in TelehealthAlly's cited comparison; no program fee", "Medication access without mandatory behavioral structure", "Assigned pool does not fully decompose branded-versus-compounded mix beyond the cited Wegovy pathway advantage", "Closest direct peer wins on simplicity and lower overhead"]
      - ["Calibrate", "Approximately $1,500-$1,900 per year with a 12-month commitment in HealthRx", "GLP-1 prescribing, nutrition coaching, and metabolic labs", "Assigned pool does not provide a full medication-cost breakout on top of program pricing", "Comprehensive-care buyers have a clearer premium option than Ro"]
