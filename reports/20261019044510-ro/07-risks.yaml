callouts:
  - calloutType: risk
    title: Manufacturer-channel concentration is the core thesis-breaker
    body: >-
      If Ro's preferred branded GLP-1 access weakens, public evidence gives no
      assurance that software convenience alone can offset shortage risk,
      repricing, or worse retention at higher cash-pay doses.
    claimRefs: [CR010, CR011, CR012, CR015]
  - calloutType: assumption
    title: Current care intensity needs direct diligence
    body: >-
      Official 2023 launch materials and independent 2026 reviews do not agree
      on whether coaching, metabolic testing, and synchronous clinician contact
      are standard in the current weight-loss pathway, so management should be
      asked to reconcile the live operating model before underwriting safety or
      churn assumptions.
    claimRefs: [CR004, CR013, CR014]
