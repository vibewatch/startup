      - ["Broader GLP-1 manufacturer support", "Novo and Lilly ecosystem", "Supports shift from compounded to branded, on-label dispensing", "Medium-High", "Policy or economics narrow branded access before Ro replaces compounded demand.", "High", "Ro can still offer multiple therapies and insurance-navigation tools.", "Medium-High"]
