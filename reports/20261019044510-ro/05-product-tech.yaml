  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-and-reliability
      missingEvidence: Independent evidence on uptime history, incident reporting, privacy-control architecture, and security certifications for ro.OS or adjacent operational systems.
      whyItMatters: Ro's product claim depends on trusted orchestration of regulated care workflows, but public product pages do not show whether the software layer meets enterprise-grade reliability and control standards.
      diligencePath: Request a security packet, status-history exports, incident postmortems, HIPAA or SOC attestations, and a map of which workflows run on owned versus third-party systems.
      relatedQuestionRefs: [QE006, QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: developer-signal
      missingEvidence: Public practitioner or developer signal such as integration documentation, public APIs, repos, engineering talks, package usage, or partner implementation detail.
      whyItMatters: Without a practitioner surface, it is difficult to test whether the product moat is extensibility and technical depth or primarily a closed operational wrapper around vendor relationships.
      diligencePath: Request partner integration docs, engineering recruiting material, implementation case studies, and an explicit explanation if management believes no public developer proxy should exist for this model.
      relatedQuestionRefs: [QE006, QE008]
    - type: private-evidence-only
      severity: material
