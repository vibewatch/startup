  foundingLocation: New York City, US
  headquarters: New York City, US
  productSummary: >-
    Ro sells direct-pay telehealth consultations, prescriptions, pharmacy fulfillment, diagnostics, and ongoing care
    programs across weight loss, men's health, women's health, fertility, smoking cessation, hair, skin, and daily
    health. Its ro.OS platform connects patient intake, clinical review, pharmacy operations, lab ordering, and in-home
    care logistics.
  customerFocus: >-
    US consumers seeking discreet, convenient direct-pay healthcare access for stigmatized or chronic conditions,
    especially obesity and related weight-loss care.
  businessModel: >-
    Direct-to-consumer subscriptions and visit fees, pharmacy or service revenue on prescriptions, diagnostics, and
    manufacturer-linked branded GLP-1 distribution pathways.
  stage: Late-stage private company with a stale 2022 growth-round benchmark
  fundingStatus: >-
