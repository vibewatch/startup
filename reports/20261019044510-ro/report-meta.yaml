companyProfile:
  summary: >-
    Ro is a New York-based direct-to-patient healthcare company founded in 2017 that combines telehealth intake,
    pharmacy fulfillment, diagnostics, and ongoing care through its ro.OS workflow. The company began as Roman and has
    expanded from men's health into GLP-1 obesity care, fertility, women's health, smoking cessation, hair, skin, and
    daily health programs. Current evidence still points to meaningful consumer reach, a real operating platform, and
    continued GLP-1 commercialization, while the latest third-party scale estimate describes roughly 1,473 employees and
    about $1.03 billion of cumulative funding. The main open questions remain the same: how much of the current growth
    is durable, how profitable the GLP-1 mix is, and whether the old $7 billion private mark still reflects reality.
  founders:
    - name: Zachariah Reitano
      role: CEO, co-founder
      background: Public-facing chief executive and long-running spokesperson for Ro's current GLP-1 and platform narrative.
