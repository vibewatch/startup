evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-valuation
    missingEvidence: A verified 2025-2026 financing, tender, secondary, or internal valuation reference tied to Ro.
    whyItMatters: >-
      Historical valuation marks from 2021 are not a safe proxy for current price expectations, dilution, or downside
      risk.
    diligencePath: Request the latest board deck, financing documents, cap table, and any 409A or secondary transaction materials.
  - type: missing-source
    severity: material
    topic: current-operating-metrics
    missingEvidence: Audited or independently reported 2025-2026 revenue, headcount, retention, and customer counts.
    whyItMatters: >-
      Company marketing scale claims are directionally useful but insufficient for underwriting unit economics, burn, or
      valuation.
    diligencePath: Obtain monthly KPI reporting, audited financial statements, and internal cohort or retention dashboards.
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: A current board roster, committee structure, observer seats, investor protective provisions, and voting rights.
    whyItMatters: Governance concentration and investor-control rights affect both decision velocity and downside protection.
    diligencePath: Request board materials, investor-rights agreements, and the latest corporate governance schedule.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: manufacturer-partner-economics
    missingEvidence: The economics, exclusivity, duration, and fulfillment responsibility split for Lilly and Novo relationships.
    whyItMatters: >-
      Ro's most visible current momentum is GLP-1-partnership driven, so undisclosed partner terms create real
      concentration risk.
    diligencePath: Review partner agreements, rebate schedules, pharmacy economics, and any exclusivity or performance clauses.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: exact-market-sizing
    missingEvidence: >-
      Active obesity members, eligible population, coverage-check conversion, payer mix, current obesity revenue, and
      comparable category denominators needed for TAM, SAM, SOM, and market share.
    whyItMatters: Without common denominators, company reach and clinical cohorts can materially overstate Ro's monetizable market.
    diligencePath: >-
      Obtain management cohort counts and segment revenue, then reconcile them to an independently sourced eligible U.S.
      patient population.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pathway-unit-economics
    missingEvidence: >-
      Customer-acquisition cost, conversion, churn, retention, gross margin, and contribution margin by medication and
      payer path.
    whyItMatters: >-
      Channel growth creates enterprise value only if Ro retains durable economics after clinical, fulfillment, support,
      and acquisition costs.
    diligencePath: >-
      Request cohort-level unit economics for cash-pay and insurance-assisted branded pathways, including
      manufacturer-linked programs.
    relatedQuestionRefs:
      - QM005
  - type: stale
    severity: minor
    topic: workflow-consistency
    missingEvidence: >-
      Current product-level documentation showing which pathways include labs, video visits, coaching, insurance
      support, and ongoing clinician contact.
    whyItMatters: >-
      Service intensity affects both adoption and cost-to-serve, and the detailed workflow evidence retained here dates
      to 2023.
    diligencePath: Review each current onboarding flow and care protocol, then map included services and fees by medication.
    relatedQuestionRefs:
      - QM004
  - type: missing-source
    severity: material
    topic: future-entrant-risk
    missingEvidence: >-
      Current partner economics, exclusivity terms, and retention data for manufacturer-linked GLP-1 fulfillment, plus
      evidence on payer or employer channels that may absorb the same workflow.
    whyItMatters: >-
      Without those economics, the chapter cannot quantify whether Ro's service layer can keep a fee premium if
      branded-drug distribution standardizes.
    diligencePath: >-
      Ask management for Lilly/Novo agreement scope, branded-versus-compounded order mix, prior-authorization
      conversion, and cohort retention by acquisition channel.
    relatedQuestionRefs:
      - QP008
  - type: conflicting-data
    severity: material
    topic: glp1-formulation-mix
    missingEvidence: >-
      A dated 2026 breakdown of Ro's current branded-versus-compounded GLP-1 availability by state, medication, and
      patient type.
    whyItMatters: >-
      Independent 2026 sources describe Ro's formulation mix differently, which affects price comparisons and the
      strength of its manufacturer-channel moat.
    diligencePath: >-
      Request the current formulary, state availability matrix, and monthly active-member mix across branded and
      compounded obesity prescriptions.
    relatedQuestionRefs:
      - QP002
      - QP007
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash balance, debt balances, monthly burn, and runway by scenario.
    whyItMatters: >-
      Financing dependency cannot be underwritten from a 2022 round marker plus growth estimates; current liquidity
      determines whether Ro can self-fund expansion.
    diligencePath: Request the latest board package or lender/investor update with cash, debt, covenant, and runway detail.
    relatedQuestionRefs:
      - QI007
  - type: private-evidence-only
    severity: material
    topic: margin-structure
    missingEvidence: Gross margin and contribution margin by program, including pharmacy, lab, support, and refunds.
    whyItMatters: List pricing and revenue estimates do not show whether GLP-1 growth improves or dilutes Ro's unit economics.
    diligencePath: >-
      Request category-level P&L detail and a bridge from revenue to contribution profit for obesity, ED, hair, and
      mental-health programs.
    relatedQuestionRefs:
      - QI004
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: customer-acquisition
    missingEvidence: CAC, payback period, retention, churn, and refund or denial rates by program.
    whyItMatters: >-
      D2C healthcare economics depend on acquisition efficiency and cohort durability, neither of which public pricing
      pages reveal.
    diligencePath: Request cohort tables showing CAC, payback, retention, reorder cadence, and cancellation by major product line.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: manufacturer-economics
    missingEvidence: Economics, exclusivity, rebate, and renewal terms with Novo Nordisk and Eli Lilly.
    whyItMatters: >-
      The current growth case depends on manufacturer-linked GLP-1 distribution, so unknown contract terms create both
      upside uncertainty and downside channel risk.
    diligencePath: >-
      Review signed partnership agreements, pricing schedules, and any minimum-volume or marketing-commitment
      provisions.
    relatedQuestionRefs:
      - QI006
      - QI008
  - type: missing-source
    severity: material
    topic: security-and-reliability
    missingEvidence: >-
      Independent evidence on uptime history, incident reporting, privacy-control architecture, and security
      certifications for ro.OS or adjacent operational systems.
    whyItMatters: >-
      Ro's product claim depends on trusted orchestration of regulated care workflows, but public product pages do not
      show whether the software layer meets enterprise-grade reliability and control standards.
    diligencePath: >-
      Request a security packet, status-history exports, incident postmortems, HIPAA or SOC attestations, and a map of
      which workflows run on owned versus third-party systems.
    relatedQuestionRefs:
      - QE006
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public practitioner or developer signal such as integration documentation, public APIs, repos, engineering talks,
      package usage, or partner implementation detail.
    whyItMatters: >-
      Without a practitioner surface, it is difficult to test whether the product moat is extensibility and technical
      depth or primarily a closed operational wrapper around vendor relationships.
    diligencePath: >-
      Request partner integration docs, engineering recruiting material, implementation case studies, and an explicit
      explanation if management believes no public developer proxy should exist for this model.
    relatedQuestionRefs:
