company:
  name: Ro
chapter:
  number: 4
  title: Financials
  summary: >-
    Ro's public financial picture shows a real, scaled direct-pay revenue engine led by GLP-1
    care, but the underwrite is still constrained by estimated revenue, list-price-heavy pricing
    evidence, and no public disclosure of gross margin, burn, or cash runway. The clearest
    forward revenue lever is manufacturer-channel expansion with Lilly and Novo, which also
    heightens channel and regulatory dependency.
sections:
  - id: revenue-model
    title: Revenue model and public pricing evidence
    body: >-
      Public evidence points to a revenue model built around cash-pay, condition-specific care
      bundles rather than broad insurance reimbursement. Ro's own surface markets GLP-1s,
      erectile-dysfunction treatments, and other programs directly to consumers with visible
      savings-versus-list-price framing, while independent reviews describe bundled subscription
      pricing that combines consultation, medication, and shipping. That supports a view of Ro as
      monetizing recurring medication-driven pathways instead of isolated virtual visits. The
      strongest public pricing evidence sits in obesity care, where third-party reviews place
      compounded semaglutide at roughly $145-$299 per month and Ro's current homepage highlights
      reduced cash-pay entry points for Wegovy, Zepbound, and Foundayo. What remains missing is
      realized pricing: public materials show list and promotional prices, but not average
      selling price after refunds, denials, savings-card usage, or product mix.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI010
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-cost-structure
    title: Traction is visible; margin quality is not
    body: >-
      Ro's public traction signal is directionally strong, but it is still a patchwork of company
      claims and third-party estimates rather than audited disclosure. Sacra and DrugPatentWatch
      both peg 2024 annualized revenue around $598 million with year-over-year growth in the mid
      60s, and Sacra attributes much of that step-up to GLP-1 expansion. Ro's official channels
      reinforce meaningful consumer reach, claiming millions of members, and the original Body
      launch said the pre-GLP-1 weight-loss offering had already served more than 160,000
      patients. Those datapoints suggest real scale, but they do not answer the underwriting
      questions that matter most for margin quality: whether weight-loss revenue carries better or
      worse contribution economics than legacy categories, what share of revenue is recurring
      after the initial surge of GLP-1 adoption, and how much clinical, pharmacy, lab, and
      support overhead Ro must absorb to keep the model running.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI013
    tableRefs:
      - TI003
  - id: capital-dependency
    title: Capital adequacy is the core diligence blocker
    body: >-
      The public record supports financing dependency risk more clearly than it supports current
      adequacy. Wikipedia and Sacra still point back to the February 2022 financing at a $7
      billion valuation and roughly $1.0 billion of cumulative primary capital, but nothing in
      the assigned source set updates cash on hand, debt balances, or runway. That would be less
      problematic if the model were obviously asset-light, yet the available evidence points in
      the opposite direction: Ro's platform combines telehealth, labs, pharmacy orchestration,
      insurance-support workflows, and ongoing follow-up, and outside analysts describe that
      continuity-of-care model as more capital-intensive on the service side. At the same time,
      much of the current upside narrative depends on manufacturer channels and launch timing.
      That combination means investors can see revenue momentum, but cannot yet verify whether the
      company can fund growth internally or needs fresh capital to sustain it.
    claimRefs:
      - CI007
      - CI010
      - CI011
      - CI012
      - CI014
  - id: verdict
    title: Financial verdict
    body: >-
      Ro looks financially more credible than a typical early telehealth story because public
      evidence supports meaningful scale, category breadth, and a repeat-care revenue loop that
      has expanded from generics into higher-ticket obesity management. The problem is not lack of
      commercial signal; it is lack of underwriteable disclosure. Revenue quality still hinges on
      a GLP-1-heavy mix, list pricing is easier to observe than realized margin, and the strongest
      current growth catalysts are controlled by Novo and Lilly rather than by Ro alone. My
      working view is that Ro has a substantial business with plausible recurring revenue, but the
      margin path and financing needs remain unproven until management provides audited revenue by
      category, gross margin, burn, cash, debt, and retention or payback data.
    claimRefs:
      - CI001
      - CI005
      - CI007
      - CI012
      - CI013
      - CI014
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value/status
      - Quality
      - Diligence ask
    rows:
      - - GLP-1 weight-loss memberships
        - Cash-pay clinical program plus medication access and follow-up
        - Per patient per month
        - Public prices from roughly $145-$299 per month depending on product and dose snapshot
        - Largest visible growth engine, but realized net revenue is undisclosed
        - Active subscribers, realized ASP, refund rate, and branded-vs-compounded mix
      - - Branded manufacturer-channel GLP-1
        - Wegovy and Zepbound access via manufacturer-linked pathways
        - Per patient per month
        - Current public launch pricing exists, but Ro's economics versus manufacturer partners are not public
        - Revenue lever is current, but channel margin split is opaque
        - Contract economics, rebates, exclusivity, and renewal terms with Novo and Lilly
      - - ED treatment
        - Direct-to-consumer prescription and fulfillment
        - Per dose
        - Public pricing ranges from about $2 to $44 per dose depending on molecule and brand
        - Mature category with visible list pricing, but no disclosed category revenue share
        - Category revenue, refill frequency, and blended gross margin
      - - Hair loss and mental health
        - Subscription plans and initial consultations
        - Per month or per visit
        - Hair-loss plans were quoted around $20-$45 per month and mental-health intake from $99
        - Monetization is visible, but scale contribution is not
        - Revenue mix, cohort retention, and cross-sell rates
    notes: >-
      Public sources mainly show list or promotional pricing; realized pricing, mix, and revenue
      contribution by stream remain undisclosed.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI010
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offering
      - Price/unit/contract
      - List vs realized pricing
      - Discounts/unknowns
      - Source
    rows:
      - - Wegovy pill / Foundayo
        - Cash-pay monthly price shown at $149 per month
        - Homepage price is a public offer, not realized revenue
        - Savings-card usage, channel fees, and renewal price are unknown
        - ro.co homepage
      - - Wegovy injection
        - Current homepage shows $199 per month entry pricing against $1,349 list price
        - Public offer is visible; patient out-of-pocket varies with insurance and savings programs
        - Introductory structure and realized retention are unknown
        - ro.co homepage plus HealthRX reviews
      - - Zepbound
        - Homepage shows $299 per month entry pricing; Wikipedia and TipRanks tie the category to Lilly and launch-channel expansion
        - Public launch pricing is visible; Ro's gross take rate is not
        - Manufacturer economics and any exclusivity are unknown
        - ro.co homepage, Wikipedia, TipRanks
      - - Compounded semaglutide
        - Independent reviews quoted about $145-$299 per month
        - Third-party snapshot rather than audited realized pricing
        - Regulatory transition may alter availability and price
        - HealthRX overview and prescription-process review
      - - ED / hair / mental health
        - ED at roughly $2-$44 per dose, hair at $20-$45 per month, mental-health intake from $99
        - Public list pricing only
        - Discounting, refill rates, and churn are unknown
        - HealthRX prescription-process review
    notes: >-
      Source evidence mixes current homepage prices with independent review snapshots taken at
      different times; none disclose realized net pricing or contribution margin.
    claimRefs:
      - CI001
      - CI003
      - CI010
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value/null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - 2024 annualized revenue
        - $598M estimate
        - Medium
        - Indicates Ro is already operating at meaningful scale
        - Reconcile estimate to audited GAAP revenue by quarter
      - - 2024 revenue growth
        - 66% year-over-year estimate
        - Medium
        - Supports the current growth narrative but may be mix-shift driven
        - Provide quarterly growth bridge by category
      - - GLP-1 share of revenue
        - ~40% of revenue by end-2024 estimate
        - Medium
        - Concentration in one therapy class raises durability risk
        - Provide product-level revenue mix and active subscriber counts
      - - Cash-pay pricing model
        - Bundled subscriptions with limited traditional insurance acceptance
        - Medium
        - Implies Ro is underwriting affordability, approval friction, and churn directly
        - Provide approval rate, refund rate, and realized ASP by program
      - - Gross margin
        - null
        - Low
        - No public evidence in this pool discloses gross margin or COGS by category
        - Provide gross margin by product plus pharmacy, lab, and support cost structure
      - - CAC payback / retention
        - null
        - Low
        - D2C economics cannot be underwritten without customer acquisition and retention data
        - Provide blended CAC, payback period, churn, and retention by program
    notes: >-
      Null means the metric is not disclosed in the assigned public source pool, not that the
      value is zero or immaterial.
    claimRefs:
      - CI002
      - CI005
      - CI006
      - CI007
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Ro monetizes by moving a consumer from online demand capture into recurring clinical and
      medication workflows, with margin ultimately constrained by service delivery and manufacturer
      channel economics.
    data:
      nodes:
        - label: Direct-to-consumer demand capture
          detail: Homepage pricing and category-specific acquisition drive top-of-funnel traffic.
        - label: Structured intake and eligibility review
          detail: Online intake routes patients into clinician review and program-specific protocols.
        - label: Subscription or visit monetization
          detail: Public materials emphasize bundled monthly programs or per-visit pricing.
        - label: Medication pathway selection
          detail: Ro steers patients into compounded, branded, or generic fulfillment pathways.
        - label: Ongoing follow-up and support
          detail: Follow-ups, messaging, coaching, and insurance support make the revenue loop recurring.
        - label: Contribution margin after care and channel costs
          detail: Gross-profit visibility is limited because public evidence does not disclose COGS or partner economics.
    approximationNotes: >-
      This is a qualitative operating bridge derived from public workflow and pricing evidence; it
      is not a quantified waterfall because the assigned source pool does not disclose contribution
      margins or intermediate conversion rates.
    claimRefs:
      - CI002
      - CI004
      - CI007
      - CI008
      - CI010
      - CI012
callouts:
  - calloutType: risk
    title: "Underwriting blocker: margin and runway are still private"
    body: >-
      The public story is strong enough to show real scale and a plausible recurring-care loop,
      but it is not strong enough to underwrite free-cash-flow durability. The missing data is not
      cosmetic: gross margin by category, CAC payback, retention, debt balances, and cash runway
      determine whether Ro's GLP-1 expansion is self-funding or still dependent on outside capital.
    claimRefs:
      - CI005
      - CI007
      - CI012
      - CI014
