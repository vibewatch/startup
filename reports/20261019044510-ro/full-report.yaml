              Leadership continuity is a real asset here. Wikipedia and Ro's own surfaces still place the founding trio
              of Zachariah Reitano, Saman Rahmanian, and Rob Schutz in operating roles, while the homepage foregrounds
              clinical operators such as Melynda Barnes, Raoul Manalac, and Nitin Vaswani. That mix suggests Ro is not a
              single-founder science project, but the public narrative is still notably CEO-centric because Reitano
              remains the visible spokesperson for launch milestones and strategic positioning on the press page.
              Governance visibility is thinner than operating visibility: the assigned pool points to notable board
