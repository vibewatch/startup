  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: The relevant market is the care-and-access layer, not drug manufacturing
        blocks:
          - type: paragraph
            body: >-
              Ro's relevant market is the U.S. direct-to-patient workflow for common outpatient conditions, with obesity
              care now the most visible wedge. Included spend covers online intake, provider review, coverage
              navigation, medication management, pharmacy or delivery coordination, labs, and follow-up. Medication
              spend is economically adjacent but should not be treated as Ro-controlled revenue merely because the drug
              is available through its workflow: DrugPatentWatch describes the manufacturer as setting the GLP-1 drug
              price while Ro charges a separate care membership. Ro also markets sexual health, hair loss, and skin
              services, so those categories can supply acquisition and cross-sell, but they are not part of an
              obesity-only market estimate.


              Excluded spend includes drug-manufacturer economics, PBM rebates, hospital care, specialist procedures,
              and comprehensive primary care. Status-quo substitutes are local clinicians and pharmacies; adjacent
              substitutes include manufacturer-direct channels such as LillyDirect and NovoCare, which can make the
              telehealth intermediary optional. This boundary makes Ro's investment case depend on the value of
              convenience, navigation, continuity, and distribution access rather than proprietary therapeutic
              intellectual property.
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM008
              - CM009
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM006
              - CM008
              - CM014
      - number: '2.2'
        title: Reach signals are material, but they do not form a TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports several useful but non-additive sizing lenses. Novo Nordisk commentary
              cited by DrugPatentWatch put self-pay patients at about 35% of U.S. injectable Wegovy sales in Q2 2026, up
              from roughly 10% to 15% a year earlier. Ro separately claims more than three million members, while
              TipRanks reports that its insurance checker has helped more than two million people assess coverage. A
              2023 Ro release said the earlier Plenity program had served more than 160,000 patients, and a later
              company study followed 655 persistent semaglutide patients for 68 weeks. These figures show channel
              demand, top-of-funnel reach, historical program scale, and a selected clinical cohort; they do not share a
              denominator.


              No retained source discloses active obesity members, eligible U.S. patients addressable by Ro, conversion
              from coverage checks, payer mix, or current obesity revenue. Assigning those reach metrics to TAM, SAM,
              and SOM layers would therefore create false precision. The appropriate valuation treatment is to recognize
              a scaled distribution and care surface while holding market-share and monetization assumptions open until
              management supplies cohort and revenue denominators.
            claimRefs:
              - CM005
              - CM007
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM007
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
              - CM011
              - CM012
              - CM013
              - CM016
      - number: '2.3'
        title: The patient is the buyer and often the budget owner
        blocks:
          - type: paragraph
            body: >-
              Ro primarily serves consumers who value speed, privacy, remote access, or help navigating fragmented
              coverage. In a cash-pay path, the patient is buyer, user, and budget owner for the membership and
              medication. In an insurance-assisted branded path, the patient still chooses and uses the service, but the
              insurer and manufacturer savings program may fund part of the drug while the patient retains residual
              out-of-pocket exposure. HealthRx characterizes most Ro programs as outside traditional insurance, and Ro's
              homepage explicitly markets GLP-1 access both with and without insurance, so payer responsibility varies
              by product and eligibility.


              The adoption path starts with online intake and clinical review, then moves through testing or a video
              visit when required, coverage work, prescription management, and continuing support. Ro's 2023 Body
              Program release described metabolic testing, nurse coaching, weight tracking, and provider follow-up.
              Current evidence does not establish that every product includes every service, so diligence should
              distinguish the workflow and cost-to-serve of each medication and payer path rather than assume one
              uniform membership bundle.
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM008
              - CM009
              - CM014
      - number: '2.4'
        title: Manufacturer access and self-pay growth drive adoption, while channel power constrains value capture
        blocks:
          - type: paragraph
            body: >-
              Ro benefits from a category in which branded GLP-1 manufacturers increasingly need direct cash-pay and
              digitally supported distribution. Charles Kirkland's analysis argues that Ro's pre-existing provider,
              pharmacy, lab, insurance, and acquisition infrastructure became more valuable when GLP-1 demand
              accelerated. TipRanks likewise describes Ro as a primary direct-to-patient platform for Novo Nordisk's
              oral Wegovy launch. That positioning can reduce patient friction and make Ro useful to manufacturers at
              national launch, while the company's broader member base can lower the cost of introducing adjacent care
              programs.


              The same structure creates constraints. Manufacturer-direct channels set price and can bypass or replace
              an intermediary, while Ro's separate membership becomes more visible when drug prices fall. The retained
              study cohort is also selected: it includes patients who persisted with treatment and reported weight at 68
              weeks, so its outcome cannot be generalized into retention or total demand. Without active-member counts,
              conversion, churn, customer-acquisition cost, and pathway contribution margin, market momentum is not yet
              equivalent to proven durable economics.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM009
              - CM012
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reach is not monetizable market share
            body: >-
              Cumulative members, coverage checks, historical patients, and a selected clinical cohort indicate demand
              and operating reach, but none discloses active obesity members, conversion, retention, or segment revenue.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set spans direct peers, adjacencies, and the status quo
        blocks:
          - type: paragraph
            body: >-
              Ro is not competing with a single like-for-like telehealth clone. In the assigned evidence, the closest
              direct benchmark is Hims & Hers and the broader pure-prescription async cohort, while Calibrate and FORM
              represent the more clinician-intensive end of obesity care. Found, Noom-style behavioral programs, and
              Sesame-like urgent-care access sit in adjacent positions, and traditional primary care remains the
              status-quo substitute when a patient has complex comorbidities or wants a fuller medical relationship.
              That means Ro's real battle is over how much support, oversight, and convenience buyers want layered on
              top of medication access, not over an exclusive category definition.
            claimRefs:
              - CP008
              - CP010
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
              - CP003
              - CP004
              - CP008
              - CP010
              - CP011
              - CP012
              - CP013
              - CP015
      - number: '3.2'
        title: Ro prices above the lightest telehealth options to fund a more structured care layer
        blocks:
          - type: paragraph
            body: >-
              The strongest direct comparison is between Ro and Hims-style medication access. Ro's own site markets a
              multispecialty product set and branded GLP-1 entry prices, while U.S. News and TelehealthAlly describe a
              membership-plus-medication model with insurance navigation, messaging, and some coaching. That structure
              is meaningfully richer than async-only prescription fulfillment, but it is still lighter than
              Calibrate-style specialist programs with required labs and longer commitments. The consequence is a
              squeeze in the middle: Ro has to justify a membership fee without matching the deepest clinical program in
              the market.
            claimRefs:
              - CP003
              - CP005
              - CP006
              - CP007
              - CP009
              - CP012
              - CP016
