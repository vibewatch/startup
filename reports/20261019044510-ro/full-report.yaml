      items:
        - date: '2017'
          label: Roman launches and raises seed capital
          detail: >-
            Wikipedia says the company launched as Roman in 2017 and raised a $3.1 million seed round led by General
            Catalyst.
          tone: neutral
        - date: '2018'
          label: Rebrand to Ro and Series A expansion
          detail: >-
            Wikipedia says the company rebranded to Ro, raised an $88 million Series A, and added Alexis Ohanian to the
            board.
          tone: positive
        - date: 2020-01
          label: Pfizer sourcing partnership
          detail: Wikipedia says Ro partnered with Pfizer for sildenafil sourcing in January 2020.
          tone: positive
        - date: 2020-12
          label: WorkPath acquisition
          detail: Wikipedia says Ro acquired WorkPath in December 2020 to expand home diagnostic capabilities.
          tone: positive
        - date: 2021-03
          label: Series D sets the historical capital benchmark
          detail: Wikipedia says Ro raised $500 million at a $5 billion valuation in March 2021.
          tone: positive
        - date: 2021-05 to 2021-06
          label: Modern Fertility and Kit acquisitions
          detail: >-
            Wikipedia says Ro acquired Modern Fertility and Kit in 2021, extending women's-health and at-home testing
            exposure.
          tone: positive
        - date: 2023-01
          label: Ro Body launches
          detail: >-
