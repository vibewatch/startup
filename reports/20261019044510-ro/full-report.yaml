chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scale, and operating model
        blocks:
          - type: paragraph
            body: >-
              Ro can be anchored as a New York-founded direct-to-patient healthcare company whose current model combines
              telehealth intake, pharmacy fulfillment, diagnostics, and software coordination rather than a
              single-condition app. The strongest official evidence is the combination of the ro.OS page and the 2023 Ro
              Body launch release, which both describe an end-to-end platform spanning patient intake, clinical review,
              labs, and medication delivery. That makes later product, customer, and risk analysis easier to frame
              around one operating system rather than around separate brands. The scale claims, however, remain partly
              company-controlled: Ro markets millions of members or patients, tens of millions of treatments, and
              hundreds of millions of care interactions, but the assigned pool does not contain an audited 2026 revenue,
              headcount, or post-2022 valuation disclosure.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO012
