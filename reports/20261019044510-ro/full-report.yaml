  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - >-
          Ro still shows scaled demand capture through GLP-1 distribution, insurance-checker usage, and a 3M+ member
          marketing base.
        - Audited 2025-2026 retention and contribution margin would strengthen conviction.
      - - Thesis
        - >-
          Ro's vertically integrated care-plus-pharmacy model can matter to manufacturers that want nationwide
          direct-to-patient access.
        - Proof of recurring manufacturer economics or durable pharmacy take-rate would improve the valuation case.
      - - Anti-thesis
        - The public price anchor is stale because the latest disclosed valuation is still the February 2022 $7B round.
        - A lower or otherwise updated market-clearing mark would make entry discipline more concrete.
      - - Anti-thesis
        - >-
          D2C pricing premia, cancellation friction, and rising competition can compress retention or marketing
          efficiency.
        - Customer cohort, CAC, and service-level disclosures would show whether these risks are contained.
    notes: >-
      Thesis rows combine company-issued commercialization evidence with independent company profiles and reviews;
      anti-thesis rows emphasize valuation staleness and execution frictions rather than making unsupported liquidation
      claims.
