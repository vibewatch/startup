  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Scale and partnership proof are real, but stale pricing and execution opacity keep the call at track.
    data:
      nodes:
        - id: demand-proof
          label: Demand proof
          detail: 2024 revenue estimate of $598M and 3M+ marketed members show real scale.
          tone: positive
        - id: distribution-leverage
          label: Distribution leverage
          detail: Novo's 2026 oral Wegovy launch and Ro's insurance-checker funnel reinforce patient-routing value.
          tone: positive
        - id: stale-price-anchor
          label: Stale price anchor
          detail: Last public valuation marker is still the February 2022 $7B round.
          tone: risk
        - id: disclosure-gap
          label: Disclosure gap
          detail: Public evidence still lacks current ARR, margin, burn, cash, and preference-stack detail.
          tone: risk
        - id: execution-drag
          label: Execution drag
          detail: D2C pricing premia, cancellation friction, and competition can still pressure returns.
          tone: risk
        - id: track-recommendation
          label: 'Recommendation: track'
          detail: Need fresher financial and cap-table evidence before underwriting a buy.
          tone: neutral
      edges:
        - from: demand-proof
          to: distribution-leverage
          label: supports upside
        - from: distribution-leverage
          to: stale-price-anchor
          label: but valuation lags operations
        - from: stale-price-anchor
          to: disclosure-gap
          label: needs current underwriting data
        - from: disclosure-gap
          to: execution-drag
          label: missing disclosure amplifies risk
        - from: execution-drag
          to: track-recommendation
          label: keeps price discipline high
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV007
      - CV010
      - CV011
