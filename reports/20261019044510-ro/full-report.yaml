  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Ro monetizes by moving a consumer from online demand capture into recurring clinical and medication workflows,
      with margin ultimately constrained by service delivery and manufacturer channel economics.
    data:
      nodes:
        - label: Direct-to-consumer demand capture
          detail: Homepage pricing and category-specific acquisition drive top-of-funnel traffic.
        - label: Structured intake and eligibility review
          detail: Online intake routes patients into clinician review and program-specific protocols.
        - label: Subscription or visit monetization
          detail: Public materials emphasize bundled monthly programs or per-visit pricing.
        - label: Medication pathway selection
          detail: Ro steers patients into compounded, branded, or generic fulfillment pathways.
        - label: Ongoing follow-up and support
          detail: Follow-ups, messaging, coaching, and insurance support make the revenue loop recurring.
        - label: Contribution margin after care and channel costs
          detail: Gross-profit visibility is limited because public evidence does not disclose COGS or partner economics.
    approximationNotes: >-
      This is a qualitative operating bridge derived from public workflow and pricing evidence; it is not a quantified
      waterfall because the assigned source pool does not disclose contribution margins or intermediate conversion
      rates.
    claimRefs:
      - CI002
      - CI004
      - CI007
      - CI008
      - CI010
      - CI012
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence depicts Ro as a layered care-operations stack that keeps intake, clinical review, fulfillment,
      testing, and engagement inside one product system.
    data:
      layers:
        - label: Consumer entry and intake
          detail: >-
            Patients enter through condition-specific storefronts and complete a structured online assessment before
            clinical review.
          modules:
            - label: Product catalog
              note: Weight loss sexual health hair skin fertility and daily-health offers
            - label: Online assessment
            - label: Eligibility and safety prompts
              note: GLP-1 warnings and contraindication disclosures are public
          outputs:
            - Condition-specific intake packet
            - Patient history and goal data
        - label: Clinical review and care planning
          detail: >-
            Affiliated clinicians review intake data, communicate with patients, and document treatment or follow-up
            decisions in a care-delivery workflow.
          modules:
            - label: Care Delivery App
            - label: Async review plus video escalation
            - label: Provider messaging and charting
          outputs:
            - Prescription or treatment decision
            - Follow-up tasks and care plan
        - label: Pharmacy, lab, and insurance operations
          detail: >-
            ro.OS ties medication fulfillment, testing, and coverage support into the same journey instead of a
            disconnected handoff.
          modules:
            - label: Pharmacy App
            - label: Lab App
            - label: At-home metabolic testing
            - label: Insurance-navigation support
          outputs:
            - Medication fulfillment path
            - Results and coverage updates returned to patient and provider
        - label: Ongoing engagement and monitoring
          detail: >-
            Ro keeps patients inside the platform for progress tracking, side-effect reporting, coaching, scheduling,
            and renewal touchpoints.
          modules:
            - label: Patient App
            - label: Side-effect management workflows
            - label: AI triage and insurance-transparency content
          outputs:
            - Progress tracking and renewal loop
            - Ongoing messaging and coaching
        - label: Trust and eligibility controls
          detail: >-
            Public controls include clinician review, service- and state-dependent availability, safety warnings, and
            separation between Ro's platform and affiliated practices.
          modules:
            - label: Clinician authorization
            - label: Availability and eligibility rules
            - label: Medication safety disclosures
          outputs:
            - Gated treatment pathway
            - Disclosed platform and practice boundaries
        - label: External operating dependencies
          detail: >-
            The integrated experience still depends on affiliated practices, testing and fulfillment partners, acquired
            assets, and medication-supply relationships.
          modules:
            - label: Affiliated practices
            - label: Lab and pharmacy partners
            - label: Manufacturer channels
          outputs:
            - Care and fulfillment capacity
            - Supply and service constraints
