      - number: '6.3'
        title: Durability looks directionally positive, but complaints and channel dependence matter
        blocks:
          - type: paragraph
            body: >-
              Public customer durability evidence is suggestive rather than complete. Ratings and testimonials indicate
              that many users find the service convenient, and the published GLP-1 cohort suggests Ro can support
              patients through a long treatment window. At the same time, external review surfaces repeatedly flag
              customer-service delays, billing disputes, insurance confusion, and cost shocks as adverse experience
              drivers. That matters because Ro's current growth story appears concentrated in branded weight-loss
              access, where customer value depends on manufacturer channel integrations and prior-authorization success.
              The assigned pool does not disclose NRR, GRR, churn, repeat prescription rates, or top-customer
              concentration, so durability and concentration should be treated as open diligence items rather than
              proven strengths.
            claimRefs:
              - CU008
              - CU009
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Public adoption proof is credible but not cleanly segmented
            body: >-
              The chapter has credible evidence that Ro is serving real customers at scale, but the proof mixes broad
              member claims, legacy weight-loss cohorts, public reviews, and one published treatment cohort rather than
              a disclosed split by product line, payer, or active retained members.
            calloutType: insight
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Weight-loss concentration and support quality are the main customer risks
            body: >-
              Ro's visible customer momentum is heavily tied to branded GLP-1 access and related support workflows,
              while public complaint patterns still cluster around service responsiveness, billing, and insurance
              handling. Without renewal or cohort economics, concentration and durability remain open.
            calloutType: risk
            claimRefs:
              - CU009
              - CU011
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk stack
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence public risk is concentration around the GLP-1 category and the manufacturer
              channels now feeding that category. One 2026 profile says Ro generated roughly $370 million in GLP-1
              revenue in 2024, while a separate 2026 article says Novo Nordisk is using Ro as a primary
              direct-to-patient launch channel for oral Wegovy. That mix can be positive for growth, but it means supply
              policy, branded pricing, and partner leverage can move the business faster than Ro's own product roadmap
              can. The second major risk is regulatory interpretation: independent reporting says telehealth platforms
              can fall outside the FDA's ad fair-balance regime even when they name a drug, and Ro's own ad campaigns
              have already drawn controversy. The third risk is operational ambiguity. Public descriptions of the care
              model disagree on whether the current weight-loss offer includes live coaching, metabolic testing, and
              synchronous interaction, so the diligence burden is to reconcile the actual operating playbook before
              underwriting retention, safety, or margin.
            claimRefs:
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR005
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory and clinical guardrails
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real, not hypothetical, legal and clinical guardrail risk. The Verge reported
              that telehealth platforms which are not manufacturer affiliates do not have to meet the FDA's fair-balance
              standard when naming a drug, creating a gray zone Ro can use but does not fully control. The same
              reporting shows Ro paused advertising during shortage conditions, which ties compliance and growth to
              market availability rather than just creative execution. Ro's own site does publish material GLP-1 safety
              warnings, and the 2023 launch release described labs plus provider video visits, but an independent 2026
              review says the current program looks lighter-touch than that older launch framing. The investable
              implication is not that Ro is non-compliant; it is that public evidence is too inconsistent to underwrite
              clinical oversight quality without primary diligence on current protocols, escalation rules, and complaint
              history.
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR007
              - CR008
              - CR013
              - CR014
              - CR016
          - type: table
