      - number: '5.3'
        title: Differentiation, maturity, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The best-corroborated differentiator is operational integration. Company and third-party sources
              consistently describe Ro as more vertically integrated than many telehealth peers because it combines its
              own software layer with pharmacy, diagnostics, and care-management workflows, while current reviews also
              highlight direct manufacturer channels for branded GLP-1 products. That supports a real product thesis: Ro
              is selling convenience, coordination, and channel access rather than only low-friction prescribing. The
              tradeoff is dependency complexity. Ro's breadth now spans legacy Roman products, newer weight-loss
              programs, acquired fertility and diagnostics assets, affiliated practices, partner pharmacies or labs, and
              drug-supply relationships, so continued product quality depends on execution across several regulated and
              third-party bottlenecks that are only partially transparent in public evidence.
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE014
      - number: '5.4'
        title: Trust, safety, and unresolved technical diligence items
        blocks:
          - type: paragraph
            body: >-
              Publicly visible trust controls are meaningful but narrower than a full enterprise-technology diligence
              packet. Ro and current profiles disclose clinician review, state and age limitations, GLP-1 safety
              warnings, prescription gating, and the distinction between Ro's platform and affiliated medical practices.
              Those are useful workflow controls, especially in a regulated consumer-health model. What remains thin is
              independent proof of software and operational maturity: the assigned source pool does not include public
              uptime reporting, incident history, API documentation, privacy-control architecture, or engineering
              telemetry that would let an investor test whether the integrated stack performs materially better than the
              narrative suggests. That missing proof matters because product breadth is now broad enough that
              operational failure in labs, fulfillment, coverage support, or follow-up could damage both care quality
              and retention.
            claimRefs:
              - CE010
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer segments center on self-pay and insurance-assisted telehealth
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a consumer telehealth model rather than an enterprise or payer-sold one.
              Ro's current surface is organized around direct-to-patient categories including weight loss, sexual
              health, hair loss, and skin or wellness workflows, with the weight-loss funnel drawing the clearest
              current customer evidence. Public materials describe a member-facing journey that starts online, moves
              through provider review, and then branches into self-pay medication purchase, insurance authorization
              support, or ongoing digital follow-up. That means the buyer, user, and payer are often the same
              individual, but the economics depend on whether branded GLP-1 access is insurer supported or fully cash
              pay. Current expansion signals also point to Ro relying on branded-channel relationships rather than a
              large disclosed base of named reference customers.
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU010
              - CU012
              - CU013
