  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation or return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          GLP-1 partnerships convert into sustained growth while vertically integrated fulfillment protects service
          quality and economics.
        - >-
          Underwrite upside only if fresh financial disclosure shows growth durability well beyond the old 2022 mark
          assumptions.
        - Manufacturer concentration or reimbursement changes can still compress economics.
        - Would require audited growth and margin proof plus evidence of benign preference terms.
      - - Base
        - Ro keeps scaling demand and product breadth but remains privately opaque on economics and cap-table terms.
        - >-
          Treat valuation as a watchlist exercise anchored to stale marks and operating momentum rather than a precise
          price target.
        - Investors may overpay for scale that is real operationally but under-documented financially.
        - Best fit for current public evidence.
      - - Bear
        - >-
          Competition, pricing friction, or service strain exposes weaker retention or a lower clearing valuation than
          the last round implied.
        - Downside comes from a reset below the stale $7B marker or unattractive seniority terms in a new round.
        - Cash-pay churn, multiple compression, and governance overhang can all impair exit value.
        - Triggered by a down-round, weak cohort data, or disclosed preference overhang.
    notes: >-
      Scenario framing is directional because the retained sources do not disclose a current enterprise-value bridge,
      audited 2025-2026 financials, or secondary-market marks.
    claimRefs:
      - CV001
