      - number: '6.2'
        title: Adoption proof is real, but mostly cohort and review-surface evidence
        blocks:
          - type: paragraph
            body: >-
              Ro has more than marketing-logo proof of adoption, but much of it is still broad or proxy evidence. The
              strongest company-controlled proof is the homepage claim of 3,000,000+ members and the launch-era
              statement that Ro had already helped more than 160,000 patients through Plenity before scaling the newer
              GLP-1 push. Independent proof is more limited but not absent: third-party reviews describe large review
              volumes, and a published semaglutide cohort summarized by TipRanks points to hundreds of patients followed
              over 68 weeks with outcomes comparable to clinical trial benchmarks. What is still missing is the kind of
              named customer case-study evidence or account-level deployment detail that would show how much of this
              adoption is durable, profitable, or concentrated in a narrower subset of high-value users.
            claimRefs:
              - CU001
