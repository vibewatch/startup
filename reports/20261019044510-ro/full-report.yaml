              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.3'
        title: Operating model and service risk
        blocks:
          - type: paragraph
            body: >-
              Ro's operating model reduces friction for straightforward conditions, but the same design can externalize
              complexity onto the patient when cases are multi-drug, chronic, or fast-changing. One 2026 review says the
              platform depends on accurate patient self-disclosure and cites published evidence that 23% of telehealth
              users failed to report at least one active prescription. The Verge also reports that Ro's clinicians are
              part of an affiliated network rather than direct employees, which can fragment accountability across
              prescribing, pharmacy fulfillment, and downstream follow-up. Independent review content adds a
              service-quality vector: messaging-first interaction and dose-linked price increases may be fine for a
              simple refill experience, but they can raise churn and support-load risk when adverse effects, denial
              disputes, or brand-versus-compounded substitutions increase. Without denial-rate, adverse-event, or
              complaint resolution data, those risks remain only partially bounded in public.
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR014
              - CR015
      - number: '7.4'
        title: Dependency economics and kill criteria
        blocks:
          - type: paragraph
            body: >-
              The residual economic risk is that Ro may be a strong distribution layer sitting on weaker-than-assumed
              control of the underlying value pool. Public sources agree that most programs are still largely
              out-of-pocket, that featured weight-loss pricing starts at roughly $149 to $299 per month on owned
              surfaces, and that independent reviews see compounded semaglutide pricing rising from $145 to $289 as dose
              increases. That is a usable consumer proposition, but it leaves Ro exposed if manufacturers reprice
              branded access, regulators further narrow compounding flexibility, or high-dose retention weakens once
              patients face sustained monthly spend. The practical kill criteria are monitorable: loss of preferred
              manufacturer access, evidence that current care pathways are materially thinner than public launch claims
              implied, or internal data showing that cancellation, side-effect escalation, or refill denials rise
              sharply at higher-dose cash-pay tiers.
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR011
              - CR012
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR005
              - CR010
              - CR011
              - CR012
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Manufacturer-channel concentration is the core thesis-breaker
            body: >-
              If Ro's preferred branded GLP-1 access weakens, public evidence gives no assurance that software
              convenience alone can offset shortage risk, repricing, or worse retention at higher cash-pay doses.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR015
          - type: callout
            title: Current care intensity needs direct diligence
            body: >-
              Official 2023 launch materials and independent 2026 reviews do not agree on whether coaching, metabolic
              testing, and synchronous clinician contact are standard in the current weight-loss pathway, so management
              should be asked to reconcile the live operating model before underwriting safety or churn assumptions.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation setup
        blocks:
          - type: paragraph
            body: >-
              The public record still shows a real operating asset rather than a concept-stage story. Multiples
              attributes roughly $598 million of 2024 revenue to Ro after an estimated $360 million in 2023, while Ro's
              own 2026 materials show continued GLP-1 commercialization through a direct Novo Nordisk launch and a
              homepage now marketed to more than 3 million members. BounceWatch also still lists roughly $1.03 billion
              of cumulative funding and a 1,473-person workforce, which matters because investors are underwriting a
              scaled platform with meaningful fixed costs, not an early experiment. That said, the latest public price
              anchor remains the February 2022 $7 billion round. With no current audited ARR, margin, burn, cash, or
              preference-stack disclosure in the retained evidence, public support is strong enough for interest but not
              for a clean buy call at the old mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV007
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV008
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV010
              - CV011
      - number: '8.2'
        title: Valuation context and scenarios
        blocks:
          - type: paragraph
            body: >-
              The positive case is easy to understand: Ro is converting scale in telehealth, pharmacy, labs, and GLP-1
              access into broader manufacturer relevance. The 2026 Novo pill launch and Ro's insurance-checker funnel
              both suggest that the platform has demand capture and patient-routing value that smaller point solutions
              do not. However, public valuation work remains directional rather than dispositive. Multiples preserves
              Ro's historical financing ladder and reports a 6.0x revenue multiple at the July 2020 $1.5 billion Series
              C, but later rounds disclose valuation without a contemporaneous public revenue denominator. At the same
              time, third-party reviews flag D2C telehealth pricing premia, cancellation friction, and response delays,
              while even a sponsored sector write-up frames competition and handoff into traditional care as unresolved
              questions. That combination supports scenario ranges and diligence gates, not a precise intrinsic value.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Diligence triggers and exit discipline
        blocks:
          - type: paragraph
            body: >-
              The practical implication is price discipline. A move toward buy would require either fresher
              private-market evidence showing that the 2022 mark has already reset into a more attractive entry zone, or
              audited proof that Ro's current GLP-1 mix produces durable revenue growth with acceptable gross margin,
              retention, and service quality. A move toward avoid would become more likely if updated disclosures show
              material preference overhang, weaker-than-implied unit economics, or customer-service drag that makes
              cash-pay demand expensive to retain. Because the assigned public evidence stops short of those
              underwriting inputs, the right current posture is to keep Ro on the watchlist, define the next diligence
              packet, and avoid pretending that a stale private mark is a present-day fair value.
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Track. Ro has enough operating proof and strategic partner validation to stay on the list, but not enough
              current valuation disclosure to support a buy at the last public mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
          - type: callout
            title: What would break the thesis
            body: >-
              A disclosed down-round, punitive preference stack, or evidence that D2C pricing and service friction are
              eroding retention would move the case from track toward avoid.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV010
              - CV012
