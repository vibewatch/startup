      - ["Zachariah Reitano", "CEO, co-founder", "Wikipedia lists Reitano as founder/CEO; Ro's press page repeatedly features him on GLP-1 launches.", "Company strategy, media narrative, and category positioning", "High: current public momentum is still closely associated with the CEO."]
