          label: "Oral Wegovy pill launch through Ro"
          detail: "Wikipedia and a January 2026 TipRanks article both point to Ro's role in the oral Wegovy pill launch."
          tone: "positive"
    approximationNotes: "Timeline items synthesize dated milestones from assigned sources and emphasize public company-facing events rather than private operating changes."
