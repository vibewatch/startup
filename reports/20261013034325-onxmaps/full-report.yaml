      - number: '2.4'
        title: Adoption Drivers, Regulatory Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Adoption of onX is propelled by significant secular and regulatory drivers, most notably the severe legal
              liability associated with accidental land trespass. With over 16 million acres of Western public lands
              landlocked within private holdings, digital parcel boundary verification functions as essential risk
              mitigation. Regulatory enforcement, such as U.S. Forest Service Motor Vehicle Use Map compliance and the
              April 2026 cessation of digital MVUM updates on the Avenza platform, further incentivizes motorized
              vehicle operators to adopt updated commercial navigation apps. Conversely, market expansion faces notable
              constraints, including high switching costs for established recreation communities, cellular dead zones
              requiring proactive map caching, and the absence of public developer APIs that prevents deeper integration
              into third-party enterprise platforms. A key diligence gap remains management's opacity regarding
              vertical-specific churn and revenue contribution, leaving the durability of newer non-hunting products
              unverified.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Land Ownership Asymmetry Moat
            body: >-
              The primary driver of user willingness to pay for onX is not generic cartography, but legal land tenure
              verification. Western public lands encompass 852 million acres heavily fragmented with private holdings,
              including 16 million landlocked public acres. Recreationists face strict criminal and civil trespass
              liability, making accurate parcel ownership mapping an essential risk management purchase rather than a
              discretionary outdoor amenity.
            calloutType: insight
            claimRefs:
              - CM006
