      - number: '3.2'
        title: Feature Matrices, Pricing Models, and Go-To-Market Economics
        blocks:
          - type: paragraph
            body: >-
              Competitive differentiation across outdoor GPS applications rests heavily on offline reliability,
              proprietary parcel boundary ingestion, and curated route intelligence. OnX Hunt pioneered parcel-boundary
              overlays identifying private landowners and public government acreage, delivering offline downloads and 3D
              web scouting. In off-road navigation, independent product reviews indicate that while OnX Offroad excels
              in curated trail databases with user-submitted difficulty ratings and turn-by-turn navigation, Gaia GPS
              provides superior pre-trip planning flexibility, photo waypoints, and cellular network coverage overlays
              (AT&T, Verizon, T-Mobile). From a pricing perspective, OnX segments subscriptions by geography and feature
              depth: Hunt and Offroad single-state tiers list at $34.99 per year, two-state tiers at $49.99 per year,
              and nationwide Elite tiers at $99.99 per year ($14.99 monthly). By comparison, HuntStand Pro offers
              property boundaries nationwide for $29.99 per year (with an optional $69.99 Whitetail tier), and Gaia GPS
              Premium unlocks all map layers nationwide for $39.99 per year. Promotional coupon tracking indicates OnX
              actively discounts first-time subscriptions by 20% to 30% through seasonal coupon codes to soften the
              pricing premium against competitors.
            claimRefs:
              - CP003
              - CP004
              - CP006
