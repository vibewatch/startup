      - number: '1.2'
        title: Executive Leadership, Governance, and Ecosystem Expansion
        blocks:
          - type: paragraph
            body: >-
              The leadership architecture of onX reflects an effective pairing of domain-native founder authenticity and
              institutional operational discipline. Founder Eric Siegfried continues to spearhead public access policy,
              strategic conservation partnerships, and national advocacy, cementing customer trust across traditional
              outdoor constituencies. Chief Executive Officer Laura Orvidas, a former Amazon executive who joined in
              2018, directed the operational transition from a single-product hunting utility to an enterprise-grade
              multi-app organization. Under her tenure, onX expanded its engineering bench nearly fivefold and executed
              key strategic acquisitions, absorbing Outdoor Project and the Adventure Project network (including
              Mountain Project, Hiking Project, and MTB Project). Governance oversight is anchored by lead growth
              investor Colin Mistele of Summit Partners and former NBCUniversal CEO Steve Burke of Madison Valley
              Partners, ensuring rigorous institutional board guidance.
