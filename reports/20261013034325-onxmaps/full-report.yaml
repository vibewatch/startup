      - number: '4.4'
        title: Capital Adequacy, Institutional Financing, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              OnX exhibits strong forward capital adequacy backed by top-tier growth equity investors, while presenting
              substantial financial information asymmetry for prospective underwriters. The company secured an $87.4
              million Series B investment led by Summit Partners in October 2022 and followed with a major strategic
              growth investment from TCV in November 2025. Coinciding with the TCV transaction, management announced
              that annual recurring revenue had nearly tripled over the preceding three-year period. However, commercial
              database providers publish unverified estimates modeling onX as a wholesale merchant with over $500
              million in revenue, highlighting the degree of distortion in unverified third-party firmographic profiles.
              Essential underwriting metrics—including GAAP recognized revenue, net revenue retention, subscriber cohort
              churn, and cash burn—remain undisclosed. While institutional sponsorship provides deep capital reserves,
              independent underwriting requires audited financial statements and cohort retention schedules.
            claimRefs:
              - CI002
              - CI008
              - CI009
              - CI012
              - CI015
