      - number: '6.3'
        title: Named Customer Proof and Enterprise Operations
        blocks:
          - type: paragraph
            body: >-
              Enterprise validation for onX mapping extends beyond recreational sportsmen into critical mission-driven
              operational deployments. Public agency endorsements include wildland hotshot fire crews who utilize
              offline terrain folder coordination during wildfire suppression missions, and Colorado Parks and Wildlife
              officers who deploy mobile boundary layers to enhance field readiness. In the federal sector, USDA Forest
              Service and Natural Resources Conservation Service staff in Minnesota utilize parcel boundaries for land
              stewardship, conservation easement monitoring, and agricultural tract management. Furthermore, over 5,000
              state and federal game wardens nationwide rely on onX Hunt to enforce property boundaries and prevent
              unintentional trespassing. These institutional reference points demonstrate that onX's cadastral data and
              offline mapping engine serve as an operational standard for land boundary verification.
            claimRefs:
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU007
              - CU008
      - number: '6.4'
        title: Customer Journey and Retention Dynamics
        blocks:
          - type: paragraph
            body: >-
              The customer journey transitions from top-of-funnel discovery and 7-day mobile trials into tiered annual
              subscriptions spanning single-state Premium, multi-state Premium+, and nationwide Elite access. To
              increase average revenue per user, onX expands subscriber lifetime value through add-on emergency safety
              services, notably the $49.99 annual onX SOS subscription powered by Overwatch x Rescue, alongside
              community trail stewardship initiatives co-sponsored with corporate partners like Toyota. Despite strong
              top-line engagement, negative user reviews on Android reveal critical retention risks centered on county
              property transfer data lag, occasional map layer rendering failures, and authentication lockouts during
              peak hunting preparation seasons. Additionally, technical architecture boundaries prevent automatic
              waypoint and markup synchronization between Hunt, Offroad, Backcountry, and Fish, creating operational
              friction that restricts cross-vertical portfolio expansion.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
