      - number: '2.3'
        title: Buyer Segmentation, Workflows, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              The buyer landscape for onX divides sharply across direct-to-consumer recreationists and organizational
              field operations. Consumer subscribers represent the foundational user base, purchasing annual recurring
              memberships directly through web and app store channels funded by personal discretionary entertainment
              budgets. These users exhibit distinct workflow requirements: hunters demand public versus private parcel
              boundaries to ensure legal compliance, off-road enthusiasts require motorized vehicle trail difficulty
              ratings and legal designation layers, and backcountry travelers rely on slope angles and offline route
              caching. In parallel, onX for Business targets professional crews across conservation agencies, emergency
              first responders, agriculture operators, and utilities. Business buyers purchase per-user annual licenses
              through administrative purchase orders and corporate credit cards, driven by organizational needs for
              centralized team folder collaboration, unified invoicing, and legally cleared commercial use rights.
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
