  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Thesis Argument
      - Anti-Thesis Counterargument
      - Thesis-Break Indicator
    rows:
      - - Market & TAM
        - Deep customer engagement across 852M public land acres and 170k+ trail miles
        - Recreational participation growth could plateau following post-pandemic peak engagement
        - Deceleration in hunting/fishing license sales in federal recreation surveys
      - - Product Moat
        - Proprietary geospatial property boundaries, offline caching, and crowdsourced trail guides
        - Commoditization risk from tech giants or specialized competitors expanding offline mapping
        - Sharp decline in mobile app store review rankings or paid download velocity
      - - Financials
        - High estimated lifetime value from recurring annual subscriptions across multi-app suite
        - Public record exhibits zero verified recognized revenue, ARR, gross margin, or CAC data
        - Evidence of deteriorating payback periods or inability to cross-sell between apps
      - - Governance
        - Top-tier sponsor backing from Summit Partners, TCV, and Cross Creek providing growth runway
        - Senior liquidation preferences from growth rounds could compress returns for non-preferred equity
        - Down-round financing, structured recapitalization, or distressed secondary share transfers
    notes: >-
      Thesis arguments, counterarguments, and thesis-break indicators synthesized from company product documentation,
      federal wildlife surveys, and private financing records.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV013
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core Operating Assumptions
      - Valuation Multiple & Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          ARR accelerates to $150M+ with 25%+ operating margin; enterprise field mapping scales across utility and
          forestry crews
        - $1.8B–$2.2B valuation based on 12x–15x ARR premium vertical subscription software multiple
        - Subscriber saturation in core hunting vertical; enterprise B2B sales cycles lengthen
        - 20% (requires flawless multi-vertical expansion and strong enterprise adoption)
      - - Base Case
        - ARR reaches $100M–$120M; stable retention in Hunt and Offroad; steady renewal pricing power
        - $1.2B–$1.4B valuation based on 10x–12x ARR, sustaining the July 2025 post-money mark
        - Rising customer acquisition costs on mobile app platforms; general discretionary consumer belt-tightening
        - 55% (consistent with durable category leadership and highly engaged outdoor user base)
      - - Bear Case
        - >-
          ARR stagnates below $80M; gross margin compressed by spatial data licensing and cloud hosting costs; churn
          increases
        - $600M–$800M valuation based on 6x–8x ARR multiple contraction reflecting single-digit growth
        - Aggressive pricing competition from alternative mapping tools; broad macro pullback in outdoor recreation
        - 25% (elevated risk due to complete absence of audited public unit economics)
    notes: >-
      Forward ARR assumptions, revenue multiples, and scenario probabilities represent analytical estimates calibrated
      against public consumer subscription and vertical software benchmarks.
    claimRefs:
      - CV008
      - CV009
      - CV010
