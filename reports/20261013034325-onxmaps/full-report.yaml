chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Origins, and Core Navigation Suite
        blocks:
          - type: paragraph
            body: >-
              Founded in 2009 by Eric Siegfried in Missoula, Montana, onXmaps began with a focused technological
              insight: outdoor enthusiasts required plug-and-play digital boundary precision to distinguish public lands
              from private parcels while in the field. What commenced as physical micro-SD chips loaded into handheld
              GPS receivers evolved into a full-scale mobile navigation ecosystem starting with the national rollout of
              onX Hunt in 2013. Under the executive leadership of Chief Executive Officer Laura Orvidas, the company
              expanded its software portfolio into a tripartite consumer suite comprising onX Hunt, onX Offroad, and onX
              Backcountry. Today, the platform provides offline mapping across 852 million acres of public land and
              550,000 miles of motorized trails, positioning its technology as dependable backcountry infrastructure
              built for real field conditions rather than algorithmic engagement feeds.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO014
