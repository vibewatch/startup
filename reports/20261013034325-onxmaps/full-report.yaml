      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Dominant Consumer App Store Brand Moat
            body: >-
              onX Hunt has established exceptional market leadership in outdoor navigation, evidenced by 9.1 million
              cumulative Android installs and over 274,000 iOS reviews averaging 4.9 stars. Institutional trust from
              over 5,000 game wardens reinforces brand authority that competitors struggle to dislodge.
            calloutType: strength
            claimRefs:
              - CU002
              - CU003
              - CU008
          - type: callout
            title: Subscription Churn Exposure and Product Silos
            body: >-
              Customer feedback indicates real churn vulnerabilities when county land ownership records lag property
              transactions or when map layer rendering fails in the field. Furthermore, the lack of automatic markup
              synchronization across Hunt, Offroad, Backcountry, and Fish inhibits seamless multi-sport cross-selling
              and limits portfolio expansion.
            calloutType: risk
            claimRefs:
              - CU009
              - CU011
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal, Regulatory, and Land Ownership Liability
        blocks:
          - type: paragraph
            body: >-
              Outdoor mapping platforms navigate a delicate legal boundary between informational route planning and
              legal land survey guarantees. In the case of onXmaps, the company's core consumer appeal centers on its
              ability to demarcate public from private land boundaries in remote backcountry environments where cell
              coverage is nonexistent. However, this high-stakes consumer reliance creates profound product liability
              and trespassing exposure when cadastral parcel layers drift or fail to reflect recent deed conveyances.
              Under Section 16 of the onX Terms of Use, the company expressly disclaims that its software constitutes a
              legal survey, explicitly advising recreationists that ownership can change at any time and directing users
              to visually confirm boundaries and consult local county deed records before entering disputed property.
              Furthermore, onX enforces an aggressive liability shield that caps total recoverable damages to the
              greater of fifty dollars or the prior twelve months of subscription fees paid, while compelling all
              disputes into individual binding arbitration under American Arbitration Association rules in Missoula,
              Montana. These contractual defenses insulate the corporate entity from catastrophic tort liability arising
              from landowner conflicts, but they simultaneously shift substantial legal and physical risk directly onto
              end users who assume the app provides definitive boundary protection.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational Mapping Precision, Cache Reliability, and Product Silos
        blocks:
          - type: paragraph
            body: >-
              Operating a mission-critical outdoor GPS navigation platform requires continuous data freshness, seamless
              offline caching, and robust cross-device synchronization. For hunters, off-road enthusiasts, and
              backcountry travelers venturing beyond cellular infrastructure, offline map access is not merely a
              convenience but a fundamental life-safety utility. While onX enables users to download comprehensive
              offline map layers across hundreds of thousands of trail miles and over 850 million acres of public lands,
              customer feedback across SlashGear and app stores indicates periodic cadastral discrepancies, occasional
              GPS tracking drift on mobile operating systems, and satellite imagery that may lag real-world terrain
              developments by multiple years in rural jurisdictions. Operationally, onX maintains strict product silos
              across its four core applications: onX Hunt, onX Offroad, onX Backcountry, and onX Fish. A paid membership
              to one application does not grant access to paid functionality in any sibling app, and custom user markups
              such as tracks, waypoints, and boundary notes do not synchronize across different product databases. This
              architectural isolation protects monetization by forcing multi-activity users to maintain multiple
              distinct subscriptions, but it introduces substantial user friction, limits cross-product data network
              effects, and increases vulnerability to unified competitors offering all-in-one outdoor recreation suites.
            claimRefs:
              - CR005
              - CR006
              - CR013
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR013
      - number: '7.3'
        title: Partner Distribution Channels, In-App Billing, and Commercial Licensing
        blocks:
          - type: paragraph
            body: >-
              From a commercial and partner distribution perspective, onX remains fundamentally dependent on mobile
              platform gatekeepers, particularly the Apple App Store and Google Play Store. While native app stores
              drive top-of-funnel consumer discovery and streamline in-app purchases, they extract significant platform
              commission fees and maintain exclusive control over subscription cancellation and refund workflows. This
              structural intermediation creates recurring customer friction: subscriber records from the Better Business
              Bureau highlight complaints from users who deleted the onX application or attempted web cancellations,
              only to experience repeated automated renewal billing because in-app platform subscriptions must be
              managed directly through Apple or Google account settings. In response to commercial field use and
              enterprise demand across forestry, utility infrastructure, and emergency response, onX established strict
              license segmentation. To serve corporate and public agency crews, onX operates onX for Business, offering
              centralized license seat administration, consolidated invoicing, and multi-user map sharing.
            claimRefs:
              - CR002
              - CR007
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR009
              - CR010
      - number: '7.4'
        title: Risk Heatmap Synthesis, Capital Structure, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Synthesizing onX’s overall risk profile reveals that while technical platform stability and brand equity
              in the hunting sector remain formidable, the business faces material structural dependencies and
              persistent valuation diligence gaps. The company’s capitalization history includes a pivotal $20.3 million
              growth equity round led by Summit Partners in 2018, followed by subsequent private growth financings that
              supported expanding headcount beyond 400 full-time employees across Montana and national remote hubs.
              However, because onX operates as a privately held entity without public financial reporting, critical
              operational variables remain opaque to outside diligence. Most notably, the ongoing capital burden of
              licensing, cleansing, and refreshing county-level GIS cadastral parcel data across more than three
              thousand United States counties is undisclosed, obscuring underlying gross margin dynamics and true data
              moat durability. Furthermore, should app store operators adjust subscription commission rules, or should
              county governments restrict commercial bulk access to parcel records, onX would face direct margin
              compression and operational friction. For prospective investors, confirmatory diligence must center on
              auditing exact county data acquisition cost structures, measuring multi-app subscriber cohort retention
              versus single-app churn, and examining whether enterprise Business licensing can successfully scale into a
              durable B2B recurring revenue engine.
            claimRefs:
              - CR011
              - CR012
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR006
              - CR009
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Legal Survey Disclaimers vs. Consumer Marketing Promises
            body: >-
              While onX markets precision boundary mapping that empowers hunters and off-roaders to navigate public and
              private lands, Section 16 of its Terms of Use explicitly disclaims legal survey validity and warns users
              that boundaries must be visually confirmed, exposing recreationists to real-world trespassing liability.
            calloutType: risk
            claimRefs:
              - CR001
              - CR005
          - type: callout
            title: Siloed App Architectures Exacerbate Cross-Vertical Churn
            body: >-
              By siloing Hunt, Offroad, Backcountry, and Fish into separate subscription paywalls and preventing
              cross-app markup synchronization, onX protects average revenue per user but increases friction for
              multi-sport outdoor enthusiasts and professional crews.
            calloutType: insight
            claimRefs:
              - CR006
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation and Valuation Stance
        blocks:
          - type: paragraph
            body: >-
              Our investment assessment for onXmaps is research-more with a risk rating of high and a valuation stance
              of fair relative to its reported July 2025 post-money valuation mark of $1,400M. The company has
              established indisputable category leadership in outdoor GPS navigation across four distinct pursuits: onX
              Hunt, onX Offroad, onX Backcountry, and onX Fish. However, because onXmaps remains a closely held private
              company with zero publicly audited ARR figures, recognized revenue, gross margin schedules, or cohort
              retention metrics, committing growth capital without confirmatory data room access introduces unacceptable
              underwriting risk. The fair valuation stance reflects that a $1.4B mark is consistent with a
              market-leading vertical subscription software franchise generating an estimated $100M to $120M in
              annualized recurring revenue at an assumed 10x to 12x multiple. Nevertheless, until audited disclosures
              confirm sustainable net revenue retention and positive operating free cash flow, investors must maintain
              strict entry discipline and condition any capital allocation on granular verification of subscriber unit
              economics.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV011
              - CV012
      - number: '8.2'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for onXmaps rests on its powerful proprietary geospatial data layer, offline
              mobile caching capabilities, and deeply embedded community workflow across hunting, off-roading, and
              backcountry recreation. By aggregating public land boundaries, private parcel ownership, and over 170,000
              miles of off-road trail data, onXmaps provides an indispensable utility for outdoor enthusiasts navigating
              remote environments without cellular coverage. Furthermore, expansion into enterprise field mapping with
              onX for Business demonstrates an attractive avenue to commercialize its platform across professional
              utility, conservation, and resource management crews. Conversely, the anti-thesis centers on macro
              recreational spending vulnerabilities and the structural ceiling of vertical subscription markets. If
              outdoor recreation engagement normalizes or economic headwinds curb consumer willingness to maintain
              premium annual app subscriptions, growth could decelerate sharply. Additionally, competition from
              diversified tech platforms and navigation hardware manufacturers could constrain long-term pricing power
              unless onXmaps continuously broadens its technological and workflow moat.
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV013
              - CV014
      - number: '8.3'
        title: Financing Context and Scenario Analysis
        blocks:
          - type: paragraph
            body: >-
              onXmaps has accumulated $387.68M in total capital across five financing rounds, culminating in a July 2025
              Series C round that established its $1,400M valuation and a subsequent November 2025 growth equity
              investment from TCV, Cross Creek, and returning backer Summit Partners. Under our base case scenario (55%
              probability), onXmaps generates $100M to $120M in ARR with stable single-app retention and modest
              enterprise contribution, justifying a fair valuation range of $1.2B to $1.4B at 10x to 12x ARR. Under our
              bull case scenario (20% probability), effective cross-selling across the multi-app portfolio and rapid
              enterprise adoption of onX for Business propel ARR past $150M with 25%+ operating margins, supporting an
              expanded valuation of $1.8B to $2.2B at 12x to 15x ARR. In our bear case scenario (25% probability),
              subscriber churn accelerates due to consumer fatigue, spatial licensing costs compress margins, and growth
              slows to single digits, triggering multiple compression to 6x to 8x ARR and a down-round valuation of
              $600M to $800M.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
      - number: '8.4'
        title: Exit Readiness, Thesis-Break Triggers, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              onXmaps possesses multiple plausible liquidity pathways, including an eventual public offering as an
              outdoor software pure-play or a strategic acquisition by navigation conglomerates such as Garmin, consumer
              tech platforms like Apple, or diversified outdoor equipment holdings. However, successful execution of an
              exit is heavily contingent upon resolving key governance and capital structure unknowns. The presence of
              $387.68M in total funding, particularly late-stage growth equity from institutional sponsors, suggests
              that substantial senior liquidation preferences and protective covenants may sit ahead of common equity
              holders. Critical thesis-break triggers that would prompt an immediate downgrade to avoid include any
              documented deceleration in active paid subscribers, an increase in customer acquisition costs that
              outpaces lifetime value, or down-round secondary share transactions indicating private valuation stress.
              Prior to any investment decision, diligence must specifically demand audited financial statements,
              historical monthly retention cohorts, gross margin builds, and complete certificates of incorporation
              detailing share class seniority.
            claimRefs:
              - CV004
              - CV007
              - CV010
              - CV011
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation Call: Research-More at Fair Valuation Stance'
            body: >-
              While onXmaps demonstrates category-defining scale across hunting and off-road mapping, the total absence
              of public ARR, gross margin, and retention disclosures precludes an unconditional buy stance at a $1.4B
              valuation.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV007
              - CV011
              - CV012
          - type: callout
            title: Senior Capital Overhang and Governance Uncertainty
            body: >-
              With $387.68M in cumulative capital including growth equity from TCV, Cross Creek, and Summit Partners,
              common equity holders face potential preference overhang in a down-market or flat exit.
            calloutType: risk
            claimRefs:
              - CV001
              - CV003
              - CV004
