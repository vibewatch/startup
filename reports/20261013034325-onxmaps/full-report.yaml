            title: Compounding Subscription Expansion Across Core Outdoor Verticals
            body: >-
              OnX has achieved significant scale by moving beyond its single-product hunting roots into a multi-vertical
              outdoor ecosystem spanning off-roading, backcountry snow sports, fishing, and enterprise crews. Expanding
              into adjacent recreations has enabled the company to surpass 3 million subscribers and nearly triple ARR
              over three years, validating consumer willingness to pay for specialized offline geospatial utility.
            calloutType: insight
            claimRefs:
