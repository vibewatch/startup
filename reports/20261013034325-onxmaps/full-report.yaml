      - number: '1.3'
        title: Financing History, Valuation Trajectory, and Commercial Tiers
        blocks:
          - type: paragraph
            body: >-
              onXmaps has accumulated significant institutional capital while demonstrating sustained top-line expansion
              across multiple venture and growth cycles. Following its 2018 Series A, the company closed an $87.4
              million Series B financing in 2022 led by Summit Partners with participation from Madison Valley Partners.
              In 2025, PitchBook records published by TechCrunch confirmed that onX closed a $280 million Series C
              financing, elevating total capital raised to over $380 million and establishing a post-money valuation of
              nearly $1.4 billion. Alongside its consumer subscription base, onX introduced onX for Business, licensing
              its Elite geospatial toolset at $99.99 per seat annually for commercial field crews, conservation
              managers, and emergency response personnel. While top-line growth is supported by reported tenfold active
              user surges, audited GAAP profitability, net revenue retention, and specific churn dynamics remain
              undisclosed private records.
