  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model Architecture and Multi-Vertical Expansion
        blocks:
          - type: paragraph
            body: >-
              OnX generates revenue primarily through annual recurring subscriptions across consumer outdoor verticals
              and enterprise field mapping contracts. Originally established around public land hunting boundaries, the
              company has successfully diversified its subscription base into six core outdoor verticals, including
              off-roading, backcountry snow sports, fishing, hiking, and mountain biking. In addition to individual
              consumer mobile subscriptions, onX offers specialized per-user enterprise licensing through onX for
              Business, serving field crews across emergency response, land conservation, and agriculture. The company
              has also expanded consumer monetization with ancillary recurring tiers, such as onX SOS, an emergency
              rescue add-on subscription operated in partnership with Overwatch x Rescue. Institutional investor Summit
              Partners reports that onX has expanded to more than 3 million subscribers and grown annual recurring
              revenue by over 19x since initial institutional capitalization in 2018, demonstrating meaningful consumer
              willingness to pay for specialized offline mapping utility.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
