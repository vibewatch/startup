      - number: '1.4'
        title: User Satisfaction, Operational Headwinds, and Stewardship Initiatives
        blocks:
          - type: paragraph
            body: >-
              Public customer sentiment demonstrates strong overall satisfaction tempered by critical technical
              vulnerabilities inherent to offline geospatial navigation. Across major mobile storefronts, onX Hunt
              maintains ratings of 4.9 stars on iOS and 4.7 stars on Android, with users praising responsive customer
              support and indispensable boundary overlays. However, third-party analysis reveals persistent customer
              friction points, including occasional multi-year lags in localized property cadastral data and
              intermittent GPS tracking malfunctions on Android hardware. Because users rely on boundary precision to
              avoid inadvertent trespassing, stale parcel updates present meaningful operational risk. Concurrently, onX
              reinforces brand equity through philanthropic advocacy, supporting conservation projects across 23 states
              in 2025 via its Adventure Forever Grants and informing key legislative access frameworks including the
              MAPLand and EXPLORE Acts.
            claimRefs:
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Dual-Engine Strategy: Consumer Subscription Scale Backed by Commercial Licensing'
            body: >-
              onXmaps has successfully bridged the enthusiast-to-enterprise divide. While consumer outdoor subscriptions
              across Hunt, Offroad, and Backcountry drive brand advocacy and millions of active users, the formalization
              of onX for Business establishes an operational efficiency tool with annual team licensing and defensible
              utility.
            calloutType: insight
            claimRefs:
