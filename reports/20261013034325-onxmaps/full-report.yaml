      - number: '3.3'
        title: Moat Durability, Platform Switching Costs, and Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              OnX's moat durability derives from localized proprietary data assets, brand authority in hunting, and
              enterprise expansion into B2B field mapping. The company aggregates county parcel datasets, public-land
              boundary determinations, and active trail infrastructure spanning over 650,000 miles of off-road trails
              and 9,568 hunting units. Furthermore, OnX has integrated safety ecosystems including in-app SOS services
              powered by Overwatch x Rescue to lock in high-risk backcountry adventurers. However, switching costs for
              consumer end users remain moderate. While historical waypoints, saved hunting stands, and offline cached
              maps create platform friction, competitor tools allow GPX data import and export. Multi-homing is
              prevalent among multi-sport athletes who maintain AllTrails for casual hiking while using OnX for hunting
              or off-roading. The company's expansion into multi-app team memberships (covering Backcountry, Offroad,
              Fish, and Hunt) and enterprise site planning aims to establish institutional switching costs across
              conservation and agriculture crews, counteracting consumer churn and low-cost mobile app substitution.
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP011
              - CP014
              - CP015
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Pricing Umbrella Vulnerability to Multi-State Competitors
            body: >-
              OnX's $99.99 annual Elite tier creates a pricing umbrella that competitors exploit. Gaia GPS provides
              nationwide parcel data and custom layers for $39.99 per year, while HuntStand provides nationwide land
              ownership for $29.99 per year. Multi-state hunters and overlanders face a significant pricing premium when
              choosing OnX over capable lower-cost alternatives.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP013
          - type: callout
            title: Curated Trail and Parcel Integration Moat
            body: >-
              Unlike general navigation utilities that rely solely on automated GIS ingestion, OnX combines 650,000+
              miles of curated off-road trails with landowner contact boundaries and enterprise group licensing. This
              curated intelligence makes displacement difficult among core hunting and motorized enthusiasts.
            calloutType: strength
            claimRefs:
              - CP001
