      - number: '4.2'
        title: Pricing Architecture, Monetization Dynamics, and Distribution Channels
        blocks:
          - type: paragraph
            body: >-
              Monetization at onX is anchored on annual recurring memberships distributed across direct-to-consumer
              digital channels and multi-seat commercial procurement. Consumer memberships have historically listed
              across single-state and nationwide tiers ranging from $30 per year for entry off-road coverage to $100 per
              year for elite multi-tier bundles. Enterprise customers using onX for Business are billed on an annual
              per-seat licensing model featuring centralized invoicing and administrative console management, with
              custom procurement support for organizations deploying thirty or more seats. In-app subscription purchases
              are processed through mobile platform stores including the Apple App Store and Google Play Store,
              alongside direct credit card checkout on the company website. Mobile app store channels impose standard
              15% to 30% take rates on billings, creating an inherent gross margin divergence between web transactions
              and native mobile storefronts, while also subjecting mobile subscriptions to platform-governed refund and
              renewal mechanisms.
            claimRefs:
              - CI004
              - CI006
              - CI013
