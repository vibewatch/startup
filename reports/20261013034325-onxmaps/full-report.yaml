      - number: '4.3'
        title: Cost Structure, Gross Margin Dynamics, and Service Delivery Burden
        blocks:
          - type: paragraph
            body: >-
              The cost structure of onX combines software platform hosting economics with continuous geospatial data
              acquisition and stewardship expenses. Cost of goods sold is driven by cloud infrastructure for tile
              rendering and offline map sync, commercial satellite imagery licensing, and app store transaction fees.
              Unlike standard SaaS providers that maintain static codebases, onX must continuously ingest, cleanse, and
              normalize land ownership data, county tax parcel boundaries, and public land designations across thousands
              of local, state, and federal jurisdictions. In addition, the company commits operating resources to public
              land access initiatives, funding stewardship and trail restoration projects across 23 states. Because
              audited GAAP financial statements remain strictly private, exact gross margin percentages and software
              contribution margins cannot be verified independently, leaving institutional underwriters to estimate
              gross margins based on analog consumer subscription benchmarks.
            claimRefs:
              - CI007
              - CI010
              - CI011
          - type: table
            tableRef: TI003
