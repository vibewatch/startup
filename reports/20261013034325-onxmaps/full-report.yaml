              - CU005
              - CU006
              - CU015
      - number: '6.2'
        title: Adoption Trajectory and App Store Scale
        blocks:
          - type: paragraph
            body: >-
              The company's customer scale is heavily anchored by onX Hunt's dominant mobile app distribution footprint.
              On the Google Play Android platform, onX Hunt has achieved more than 9.1 million cumulative downloads
              since its November 2013 launch, maintaining an average monthly installation run rate of approximately
              140,000 installs and holding the number one grossing sports application ranking in the United States.
              Customer sentiment remains exceptionally high across iOS distribution channels, where the application
              boasts more than 274,000 ratings averaging 4.9 out of 5 stars. However, public platform statistics obscure
              vital recurring revenue health metrics: conversion percentages from free trials to paid annual
              memberships, renewal rates across single-state and nationwide tiers, and active paid subscriber
              denominators remain strictly undisclosed private figures.
            claimRefs:
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU002
