              - CE013
              - CE015
              - CE016
      - number: '5.3'
        title: Competitive Moats, Platform Governance, and Technical Risks
        blocks:
          - type: paragraph
            body: >-
              OnX's primary technical moat lies in its historical compilation of nationwide parcel ownership and
              public-access boundaries, bolstered by institutional domain expertise and registered intellectual
              property. The company holds 24 registered trademarks with the USPTO, including foundational marks for ONX
              and specialized assets such as TROUTROUTES, acquired to accelerate its angling offering. Furthermore, onX
              leverages policy and advocacy initiatives, such as its published geospatial analysis documenting 16.4
              million acres of landlocked public land across Western states, to position its data stack as the
              authoritative standard for public access. In 2025, the company introduced specialized algorithmic layers
              such as the Dispersed Camping layer to translate complex multi-agency land management regulations into
              field guidance, and rolled out onX SOS, an emergency satellite/cellular incident dispatch integration
              powered by Overwatch x Rescue's 24/7 crisis center. Despite these differentiation factors, the company
              faces substantial technical and governance challenges. Cloud infrastructure uptime remains dependent on
              third-party hosting, while data procurement relies on perpetual county data licensing and public
              legislative funding such as the MAPLand Act. From a security and assurance standpoint, onX recruits site
              reliability and security analysts, but public disclosures provide no evidence of independent SOC 2 Type II
              audits, ISO 27001 certifications, or formal penetration testing summaries, presenting an underwriting gap
              for enterprise adoption in regulated industries.
            claimRefs:
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Data Ingestion Moat and Regulatory Coordination
            body: >-
              OnX's primary technical advantage is its sustained capability to ingest, reconcile, and clean disparate
              land parcel and public boundary datasets across thousands of municipal jurisdictions. Because public land
              records vary widely in format and technical sophistication, onX has effectively built a private national
              cadastral fabric that would require substantial capital and years of engineering effort for competitors to
              replicate.
            calloutType: insight
            claimRefs:
              - CE009
              - CE010
              - CE016
          - type: callout
            title: Siloed Application Data and Synchronization Friction
            body: >-
              The platform's legacy architectural pattern of treating Hunt, Offroad, Backcountry, and Fish as discrete
              product silos prevents automatic markup synchronization across apps. Multi-sport outdoor enthusiasts are
              forced to manually export and import GPX/KML files, which strip visual formatting and icons. This
              technical debt creates user friction and hinders seamless cross-product adoption.
            calloutType: risk
            claimRefs:
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Commercial Structure
        blocks:
          - type: paragraph
            body: >-
              onX structures its outdoor subscriber platform across four distinct recreation verticals: Hunt, Offroad,
              Backcountry, and Fish. Each vertical addresses a specialized outdoor persona and operates at a different
              stage of commercial maturity, with Hunt representing the foundational flagship business and Offroad
              representing the primary expansion driver. Beyond the direct-to-consumer mobile applications, onX has
              institutionalized commercial B2B licensing through onX for Business and group memberships. Organizations
              purchasing 30 or more seats receive custom enterprise pricing, centralized billing, and dedicated account
              support. This multi-tiered go-to-market structure enables the company to monetize individual
              recreationists via annual mobile app store subscriptions while capturing recurring budget allocations from
              commercial field crews, conservation bodies, and public agency operations across North America.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
