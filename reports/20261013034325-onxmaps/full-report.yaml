  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Category Definition
        blocks:
          - type: paragraph
            body: >-
              The addressable market for onX exists at the intersection of consumer mobile outdoor navigation, digital
              cartography, and specialized land tenure verification. Rather than competing against general consumer
              mapping platforms such as Apple Maps or Google Maps, onX delineates its category boundary around
              recreation activities requiring offline reliability and parcel boundary precision across 852 million acres
              of public land. Included software spend encompasses annual direct-to-consumer mobile application
              subscriptions, web mapping planning seats, specialized emergency response add-on services like onX SOS,
              and enterprise multi-user field licensing. Excluded spend includes physical hardware devices, satellite
              communicators, physical recreational vehicles, outdoor equipment, and generic GIS enterprise software
              suites. Status-quo substitutes include paper Forest Service Motor Vehicle Use Maps, state wildlife agency
              regulatory pamphlets, and free offline GPS utilities, none of which integrate real-time location sharing
              with private parcel ownership boundaries.
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM011
              - CM012
