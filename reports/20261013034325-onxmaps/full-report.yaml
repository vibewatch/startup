              - CM012
      - number: '2.2'
        title: Addressable Market Sizing and Economic Foundations
        blocks:
          - type: paragraph
            body: >-
              Evaluating the market opportunity for onX requires separating macroeconomic outdoor recreation spending
              from addressable digital subscription capture. Data from the U.S. Bureau of Economic Analysis establishes
              that the outdoor recreation economy generated $696.7 billion in current-dollar value added in 2024, or 2.4
              percent of national GDP. Conventional outdoor recreation activities contributed $205.5 billion, with
              boating and fishing generating $38.4 billion, RVing contributing $27.5 billion, and hunting, shooting, and
              trapping delivering $16.5 billion. However, this macro spending consists primarily of hospitality,
              equipment, and transportation. The Serviceable Addressable Market for specialized outdoor navigation
              software is constrained to an estimated 4 million to 6 million active North American enthusiast
              participants paying $35 to $100 annually, yielding a domestic TAM of $450 million to $650 million. While
              onX has reported multi-million user engagement, audited product-level annual recurring revenue and paid
              subscriber numbers remain undisclosed, indicating an estimated realized SOM between $80 million and $120
              million.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM015
