              - CM013
          - type: callout
            title: The Valuation vs. ARR Disclosure Disconnect
            body: >-
              While onX has achieved substantial brand recognition and millions of registered accounts across outdoor
              pursuits, private company management maintains strict confidentiality regarding audited ARR, churn rates,
              and vertical revenue mix. Without verified disclosure on how revenue divides between legacy hunting and
              newer off-road, fishing, and enterprise tiers, underwriting late-stage growth valuations requires
              significant conservatism.
