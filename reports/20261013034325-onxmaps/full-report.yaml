  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Recreation Navigation Landscape and Alternative Paradigms
        blocks:
          - type: paragraph
            body: >-
              The outdoor digital cartography and GPS recreation market divides into specialized niche vertical
              solutions, broad multi-sport backcountry navigation engines, and status-quo analog or hardware navigation
              tools. In hunting navigation, OnX Hunt contends directly with HuntStand and GoHunt Maps. HuntStand targets
              whitetail deer hunters and shared hunt lease syndicates, providing reservation tools and low-cost
              subscriptions starting at $34.99 per year. Meanwhile, GoHunt Maps targets western big-game hunters
              requiring draw-odds analytics and elevation profiles at premium annual price points reaching $169.99. In
              motorized off-road navigation, OnX Offroad competes primarily against Gaia GPS (an Outside Inc. property),
              which emphasizes flexible map-layer customization, multi-carrier cellular coverage maps, and route
              building across overlanding communities. Across adjacent activities including hiking, trail running, and
              general mountaineering, multi-sport incumbents such as AllTrails, Gaia GPS, and dedicated hardware devices
              from Garmin capture significant recreational usage. Furthermore, internal build motions and status-quo
              government tools—such as U.S. Forest Service Motor Vehicle Use Maps (MVUM), BLM GIS portals, state
              wildlife agency PDF maps, and handheld satellite GPS units—remain common baseline alternatives for
              conservative recreationalists.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP001
