      - number: '5.2'
        title: Geospatial Data Pipeline and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              The core technical asset of onX is its automated and human-curated geospatial aggregation pipeline, which
              resolves disparately formatted municipal, county, state, and federal datasets into an integrated
              nationwide cadastral and topographic database. Parcel ownership boundaries in the United States are
              governed across more than 3,100 individual county assessor offices with vast disparities in digitization
              maturity, data schema standards, and update cadences. OnX ingests public records, USGS 3D Elevation
              Program (3DEP) lidar data, satellite imagery, and public agency access records, normalizing them into
              proprietary vector tiles served through AWS cloud infrastructure. Client runtimes on iOS, Android, and web
              browsers render complex multi-layer overlays directly on device hardware using local vector styling. A
              critical operational capability across all outdoor products is offline field navigation: mobile clients
              allow subscribers to cache maps, elevation profiles, and property boundaries to device storage prior to
              entering remote terrain without cellular connectivity. However, the platform's multi-app technical
              evolution has created architectural silos. Support documentation confirms that customer markup
              databases—including waypoints, tracks, lines, and custom routes—do not automatically synchronize across
              onX Hunt, Offroad, Backcountry, and Fish. Moving user-generated data between apps requires manual GPX or
              KML export and re-import, during which styling attributes such as colors, line weights, and custom icons
              are lost.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE013
          - type: figure
            figureRef: FE001
            claimRefs:
