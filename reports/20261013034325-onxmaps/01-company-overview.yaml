  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics-disclosure
    missingEvidence: Audited GAAP financial statements, exact recognized annual recurring
      revenue (ARR), gross margins, net retention rate (NRR), customer acquisition
      cost (CAC), and cash burn rates.
    whyItMatters: Valuation underwriting at nearly $1.4 billion requires concrete
      unit economics, churn dynamics, and margin structure rather than growth multiples
      on undisclosed base figures.
    diligencePath: Request confidential management presentations, audited financial
      statements, and subscription cohort retention ledgers under non-disclosure agreement
      during formal diligence.
