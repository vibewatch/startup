company:
  name: OnXmaps
chapter:
  number: 1
  title: Company Overview
  summary: Founded in 2009 in Missoula, Montana, onXmaps has expanded from a handheld
    GPS hunting chip into a multi-app outdoor navigation platform valued at nearly
    $1.4 billion following a $280 million Series C in 2025. Led by CEO Laura Orvidas,
    the company pairs consumer subscriptions across Hunt, Offroad, and Backcountry
    with commercial enterprise mapping, though key profitability and detailed retention
    metrics remain confidential.
sections:
- id: identity-and-market-position
  title: Company Identity, Origins, and Core Navigation Suite
  body: 'Founded in 2009 by Eric Siegfried in Missoula, Montana, onXmaps began with
    a focused technological insight: outdoor enthusiasts required plug-and-play digital
    boundary precision to distinguish public lands from private parcels while in the
    field. What commenced as physical micro-SD chips loaded into handheld GPS receivers
    evolved into a full-scale mobile navigation ecosystem starting with the national
    rollout of onX Hunt in 2013. Under the executive leadership of Chief Executive
    Officer Laura Orvidas, the company expanded its software portfolio into a tripartite
    consumer suite comprising onX Hunt, onX Offroad, and onX Backcountry. Today, the
    platform provides offline mapping across 852 million acres of public land and
    550,000 miles of motorized trails, positioning its technology as dependable backcountry
    infrastructure built for real field conditions rather than algorithmic engagement
    feeds.'
  claimRefs:
  - CO001
  - CO002
  - CO007
  - CO014
  figureRefs:
  - FO001
- id: executive-leadership-and-governance
  title: Executive Leadership, Governance, and Ecosystem Expansion
  body: The leadership architecture of onX reflects an effective pairing of domain-native
    founder authenticity and institutional operational discipline. Founder Eric Siegfried
    continues to spearhead public access policy, strategic conservation partnerships,
    and national advocacy, cementing customer trust across traditional outdoor constituencies.
    Chief Executive Officer Laura Orvidas, a former Amazon executive who joined in
    2018, directed the operational transition from a single-product hunting utility
    to an enterprise-grade multi-app organization. Under her tenure, onX expanded
    its engineering bench nearly fivefold and executed key strategic acquisitions,
    absorbing Outdoor Project and the Adventure Project network (including Mountain
    Project, Hiking Project, and MTB Project). Governance oversight is anchored by
    lead growth investor Colin Mistele of Summit Partners and former NBCUniversal
    CEO Steve Burke of Madison Valley Partners, ensuring rigorous institutional board
    guidance.
  claimRefs:
  - CO002
  - CO005
  - CO008
  - CO015
  tableRefs:
  - TO002
- id: capitalization-valuation-and-enterprise-pricing
  title: Financing History, Valuation Trajectory, and Commercial Tiers
  body: onXmaps has accumulated significant institutional capital while demonstrating
    sustained top-line expansion across multiple venture and growth cycles. Following
    its 2018 Series A, the company closed an $87.4 million Series B financing in 2022
    led by Summit Partners with participation from Madison Valley Partners. In 2025,
    PitchBook records published by TechCrunch confirmed that onX closed a $280 million
    Series C financing, elevating total capital raised to over $380 million and establishing
    a post-money valuation of nearly $1.4 billion. Alongside its consumer subscription
    base, onX introduced onX for Business, licensing its Elite geospatial toolset
    at $99.99 per seat annually for commercial field crews, conservation managers,
    and emergency response personnel. While top-line growth is supported by reported
    tenfold active user surges, audited GAAP profitability, net revenue retention,
    and specific churn dynamics remain undisclosed private records.
  claimRefs:
  - CO003
  - CO004
  - CO009
  - CO010
  tableRefs:
  - TO001
  - TO003
- id: operational-resilience-user-feedback-and-stewardship
  title: User Satisfaction, Operational Headwinds, and Stewardship Initiatives
  body: Public customer sentiment demonstrates strong overall satisfaction tempered
    by critical technical vulnerabilities inherent to offline geospatial navigation.
    Across major mobile storefronts, onX Hunt maintains ratings of 4.9 stars on iOS
    and 4.7 stars on Android, with users praising responsive customer support and
    indispensable boundary overlays. However, third-party analysis reveals persistent
    customer friction points, including occasional multi-year lags in localized property
    cadastral data and intermittent GPS tracking malfunctions on Android hardware.
    Because users rely on boundary precision to avoid inadvertent trespassing, stale
    parcel updates present meaningful operational risk. Concurrently, onX reinforces
    brand equity through philanthropic advocacy, supporting conservation projects
    across 23 states in 2025 via its Adventure Forever Grants and informing key legislative
    access frameworks including the MAPLand and EXPLORE Acts.
  claimRefs:
  - CO011
  - CO012
  - CO013
