callouts:
  - calloutType: "insight"
    title: "The Land Ownership Asymmetry Moat"
    body: "The primary driver of user willingness to pay for onX is not generic cartography, but legal land tenure verification. Western public lands encompass 852 million acres heavily fragmented with private holdings, including 16 million landlocked public acres. Recreationists face strict criminal and civil trespass liability, making accurate parcel ownership mapping an essential risk management purchase rather than a discretionary outdoor amenity."
    claimRefs:
      - "CM006"
      - "CM007"
      - "CM013"
  - calloutType: "risk"
    title: "The Valuation vs. ARR Disclosure Disconnect"
    body: "While onX has achieved substantial brand recognition and millions of registered accounts across outdoor pursuits, private company management maintains strict confidentiality regarding audited ARR, churn rates, and vertical revenue mix. Without verified disclosure on how revenue divides between legacy hunting and newer off-road, fishing, and enterprise tiers, underwriting late-stage growth valuations requires significant conservatism."
    claimRefs:
      - "CM014"
      - "CM015"
