- id: TP001
  title: Outdoor Navigation Competitive Landscape and Competitor Profiles
  notes: Profiles compiled from independent product comparisons, published company
    subscription portals, and secondary directory listings.
  columns:
  - Competitor
  - Category
  - Scale / Funding
  - Target Segment
  - Core Differentiation
  - Key Limitations
  rows:
  - - OnXmaps (OnX)
    - Direct Category Leader
    - $175M+ reported raised; 251-500 employees
    - Hunters, off-roaders, backcountry explorers, field crews
    - Proprietary parcel boundaries, 650k+ off-road miles, curated trails
    - Premium pricing ($99.99 Elite), rigid map customization vs Gaia
  - - HuntStand
    - Direct Hunting Peer
    - Commercial private entity (Media Fusion Technologies)
    - Whitetail hunters, private deer lease syndicates
    - Stand reservation management, monthly satellite imagery, $29.99 entry
    - Limited zoom resolution in base tiers; narrower western big-game depth
  - - GoHunt Maps
    - Direct Hunting Peer
    - Commercial private entity (growth equity backed)
    - Western big-game hunters, tag application applicants
    - Best-in-class tag draw odds algorithms, unit profiles, layer opacity
    - High subscription cost ($169.99/year); steep learning curve
  - - Gaia GPS (Outside Inc.)
    - Direct Offroad / Backcountry Peer
    - Acquired by Outside Inc.
    - Overlanders, backcountry skiers, multi-sport hikers
    - Deep map layer stacking, cell coverage overlays, $39.99/yr nationwide
    - Steeper learning curve; less off-road trail curation and community vetting
  - - AllTrails
    - Adjacent Multi-Sport
    - Growth-equity backed (Spectrum Equity)
    - Day hikers, trail runners, casual walkers
    - Massive global trail directory, crowd-sourced condition reviews
    - Lacks private land parcel boundaries and motorized trail granularity
  - - Garmin (Hardware & InReach)
    - Incumbent / Substitute
    - 'Public enterprise (NYSE: GRMN)'
    - High-end backcountry expeditions, off-grid professionals
    - Dedicated satellite hardware, long battery life, rugged durability
    - High upfront hardware capital expense ($300-$700+); clunky mobile UI
