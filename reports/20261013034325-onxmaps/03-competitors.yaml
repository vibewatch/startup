callouts:
- calloutType: risk
  title: Pricing Umbrella Vulnerability to Multi-State Competitors
  body: OnX's $99.99 annual Elite tier creates a pricing umbrella that competitors
    exploit. Gaia GPS provides nationwide parcel data and custom layers for $39.99
    per year, while HuntStand provides nationwide land ownership for $29.99 per year.
    Multi-state hunters and overlanders face a significant pricing premium when choosing
    OnX over capable lower-cost alternatives.
  claimRefs:
  - CP006
  - CP007
  - CP010
  - CP013
- calloutType: strength
  title: Curated Trail and Parcel Integration Moat
  body: Unlike general navigation utilities that rely solely on automated GIS ingestion,
    OnX combines 650,000+ miles of curated off-road trails with landowner contact
    boundaries and enterprise group licensing. This curated intelligence makes displacement
    difficult among core hunting and motorized enthusiasts.
  claimRefs:
  - CP001
  - CP004
  - CP008
  - CP011
  - CP016
