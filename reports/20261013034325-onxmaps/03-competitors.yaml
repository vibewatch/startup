- id: moat-durability-and-switching-costs
  title: Moat Durability, Platform Switching Costs, and Displacement Risks
  body: OnX's moat durability derives from localized proprietary data assets, brand
    authority in hunting, and enterprise expansion into B2B field mapping. The company
    aggregates county parcel datasets, public-land boundary determinations, and active
    trail infrastructure spanning over 650,000 miles of off-road trails and 9,568
    hunting units. Furthermore, OnX has integrated safety ecosystems including in-app
    SOS services powered by Overwatch x Rescue to lock in high-risk backcountry adventurers.
    However, switching costs for consumer end users remain moderate. While historical
    waypoints, saved hunting stands, and offline cached maps create platform friction,
    competitor tools allow GPX data import and export. Multi-homing is prevalent among
    multi-sport athletes who maintain AllTrails for casual hiking while using OnX
    for hunting or off-roading. The company's expansion into multi-app team memberships
    (covering Backcountry, Offroad, Fish, and Hunt) and enterprise site planning aims
    to establish institutional switching costs across conservation and agriculture
    crews, counteracting consumer churn and low-cost mobile app substitution.
  claimRefs:
  - CP001
  - CP005
  - CP008
  - CP011
  - CP014
  - CP015
  - CP016
