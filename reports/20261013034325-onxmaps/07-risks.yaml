callouts:
  - calloutType: risk
    title: Legal Survey Disclaimers vs. Consumer Marketing Promises
    body: While onX markets precision boundary mapping that empowers hunters and off-roaders to navigate public and private lands, Section 16 of its Terms of Use explicitly disclaims legal survey validity and warns users that boundaries must be visually confirmed, exposing recreationists to real-world trespassing liability.
    claimRefs:
      - CR001
      - CR005
  - calloutType: insight
    title: Siloed App Architectures Exacerbate Cross-Vertical Churn
    body: By siloing Hunt, Offroad, Backcountry, and Fish into separate subscription paywalls and preventing cross-app markup synchronization, onX protects average revenue per user but increases friction for multi-sport outdoor enthusiasts and professional crews.
    claimRefs:
      - CR006
      - CR010
