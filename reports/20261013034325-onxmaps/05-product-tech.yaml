callouts:
- calloutType: insight
  title: The Data Ingestion Moat and Regulatory Coordination
  body: OnX's primary technical advantage is its sustained capability to ingest, reconcile,
    and clean disparate land parcel and public boundary datasets across thousands
    of municipal jurisdictions. Because public land records vary widely in format
    and technical sophistication, onX has effectively built a private national cadastral
    fabric that would require substantial capital and years of engineering effort
    for competitors to replicate.
  claimRefs:
  - CE009
  - CE010
  - CE016
- calloutType: risk
  title: Siloed Application Data and Synchronization Friction
  body: The platform's legacy architectural pattern of treating Hunt, Offroad, Backcountry,
    and Fish as discrete product silos prevents automatic markup synchronization across
    apps. Multi-sport outdoor enthusiasts are forced to manually export and import
    GPX/KML files, which strip visual formatting and icons. This technical debt creates
    user friction and hinders seamless cross-product adoption.
  claimRefs:
  - CE013
