- id: TE002
  title: Outdoor Recreation Workflow Mapping Across Customer Personas
  columns:
  - User Job
  - Legacy / Alternative Workflow
  - OnX Technical Solution
  - Measurable User Benefit
  - Technical Limitation
  rows:
  - - Boundary Verification
    - Physical plat maps, county courthouse records, paper forest maps
    - Nationwide vector parcel layer overlaid on aerial satellite imagery
    - Instant boundary identification preventing accidental trespass
    - County parcel updates depend on irregular local municipal cycles
  - - Offline Field Navigation
    - Handheld dedicated GPS devices (Garmin) with preloaded SD cards
    - On-device mobile caching of vector tiles, topo lines, and markups
    - Full navigation functionality without active cellular network access
    - Heavy mobile battery drain and device storage consumption
  - - Motorized Route Planning
    - Paper USFS motor vehicle use maps (MVUM) with static designations
    - Digitized trail catalog with vehicle width filters and turn-by-turn guidance
    - Immediate filtering of routes matching vehicle physical dimensions
    - Dynamic closures or seasonal gate statuses may lag real-time conditions
  - - Public Land Access Route Finding
    - Trial-and-error navigation, risk of corner-crossing disputes
    - Geospatial landlocked parcel identification and access corridor layers
    - Identification of legal access corridors across 852M public acres
    - Legal ambiguity surrounding corner-crossing in selected jurisdictions
  - - Field Crew Coordination
    - Consumer apps with individual expense receipts, disconnected field notes
    - OnX for Business consolidated seat management and shared folder structures
    - Single renewal invoice, standardized team layers, commercial use license
    - No automated real-time cross-app markup synchronization
  notes: Workflow comparison synthesized from official documentation, Fast Company
    analysis, and support guides.
