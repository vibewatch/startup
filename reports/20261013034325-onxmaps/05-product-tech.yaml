company:
  name: OnXmaps
chapter:
  number: 5
  title: Product & Technology
  summary: OnX operates a multi-vertical outdoor geospatial platform spanning Hunt,
    Offroad, Backcountry, Fish, and onX for Business, built around proprietary land-boundary
    compilation and offline vector rendering. While its nationwide parcel and public-land
    stack provides strong defensibility in consumer recreation, the architecture remains
    client-heavy with siloed user markup databases and unverified enterprise-grade
    security assurances.
sections:
- id: product-portfolio-and-workflows
  title: Product Portfolio and Outdoor Workflow Delivery
  body: 'OnX delivers specialized geospatial navigation tools tailored to distinct
    outdoor recreation activities and field operations rather than offering a generalized
    consumer mapping utility. Its consumer lineup centers on four dedicated products:
    onX Hunt, onX Offroad, onX Backcountry, and onX Fish, complemented by an emerging
    enterprise offering, onX for Business. Each vertical application wraps curated
    thematic map layers, land ownership intelligence, and offline navigation around
    specific practitioner workflows. In onX Hunt, launched initially in 2013 and accounting
    for over 9.1 million Android installs alone, users track big game seasons, assess
    species distributions across 9,568 distinct hunting units, and identify public
    hunting access boundaries across 852 million acres of public land. OnX Offroad
    targets motorized recreation, indexing more than 650,000 miles of motorized trails
    categorized by vehicle width allowances (including singletrack, 50-inch, and 60-inch
    trails) alongside turn-by-turn navigation. OnX Backcountry provides human-powered
    navigation across 650,000 miles of non-motorized trails and 170,000 miles of mountain
    bike trails, integrating USGS 3D terrain models, avalanche forecasts, and wildfire
    perimeters. OnX Fish addresses freshwater angling by mapping lake structures and
    fish species distributions across eight Midwestern states. For commercial crews,
    onX for Business packages multi-seat centralized billing, shared team folders,
    and commercial-use rights across emergency response, land trust conservation,
    and utility field inspections.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
