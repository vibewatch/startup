  - CE011
  - CE013
figures:
- id: FE001
  title: OnX Geospatial Platform Architecture Stack
  type: stack
  summary: Multi-tiered architecture spanning external geospatial ingest, cloud vector
    processing, cross-vertical product delivery, and edge mobile execution.
  data:
    layers:
    - label: Client Application & Edge Tier
      modules:
      - Native iOS & Android Clients (OpenGL/Metal)
      - Local SQLite Vector Cache & Offline Map Store
      - Web Map Browser Application
      - OnX SOS Incident Trigger (Overwatch x Rescue)
      notes: Executes offline vector map rendering, GPS location tracking, and client-side
        markup authoring without cellular network connectivity.
    - label: Product & Vertical Application Tier
      modules:
      - onX Hunt (9,568 Hunting Units, Species Data)
      - onX Offroad (650k Trail Miles, Width Filters)
      - onX Backcountry (USGS 3D Lidar, Avalanche Layers)
      - onX Fish (Lake Contours, Species Depth Filters)
      - onX for Business (Team Management & Licensing)
      notes: Tailors thematic layers and navigation workflows to specific recreation
        verticals while isolating user markup databases.
    - label: Cloud Processing & API Services Tier
      modules:
      - AWS Geospatial Processing & Vector Tile Streaming
      - Account & Enterprise Subscription Management
      - User Markup Storage & Sync Engine
      - Dispersed Camping & Regulatory Rule Engine
      notes: Serves tiled geospatial data, manages authentication, and hosts business
        administrative infrastructure.
    - label: Data Ingestion & Normalization Pipeline
      modules:
      - 3,100+ County Assessor Parcel Boundary Ingestion
      - USGS 3DEP Lidar & Elevation Mesh Processing
      - Federal/State Public Land Access Mapping (BLM/USFS)
      - Real-Time Hazards (Wildfire Perimeters, Avalanche Risk)
      notes: Ingests and harmonizes thousands of disparate municipal, state, and federal
        datasets into standardized vector layers.
    - label: Infrastructure, Compute & Hosting Substrate
      modules:
      - Amazon Web Services Scalable Compute Clusters
      - Distributed Spatial Indexing & Geospatial Datastores
      - Third-Party Incident Dispatch APIs (Overwatch x Rescue)
      - Enterprise Administrative Security Gateways
      notes: Underlying cloud hosting and compute infrastructure powering tile streaming,
        user authentication, and data redundancy.
    - label: External Geospatial Data Provider Substrate
      modules:
      - County Tax Assessor & Recorder Public Databases
      - USGS 3DEP Lidar Point Clouds & National Hydrography
      - USFS, BLM & State DNR Digital Land Access Portals
      - Commercial Satellite Imagery & Aerial Flyover Providers
      notes: Primary authoritative public and licensed data feeds supplying raw cadastral
        and remote-sensing inputs.
  approximationNotes: Architecture layers synthesized from technical job openings,
    official API/system documentation, and verified product specifications.
