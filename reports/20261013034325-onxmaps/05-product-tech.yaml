- id: architecture-and-operating-model
  title: Geospatial Data Pipeline and Operating Architecture
  body: 'The core technical asset of onX is its automated and human-curated geospatial
    aggregation pipeline, which resolves disparately formatted municipal, county,
    state, and federal datasets into an integrated nationwide cadastral and topographic
    database. Parcel ownership boundaries in the United States are governed across
    more than 3,100 individual county assessor offices with vast disparities in digitization
    maturity, data schema standards, and update cadences. OnX ingests public records,
    USGS 3D Elevation Program (3DEP) lidar data, satellite imagery, and public agency
    access records, normalizing them into proprietary vector tiles served through
    AWS cloud infrastructure. Client runtimes on iOS, Android, and web browsers render
    complex multi-layer overlays directly on device hardware using local vector styling.
    A critical operational capability across all outdoor products is offline field
    navigation: mobile clients allow subscribers to cache maps, elevation profiles,
    and property boundaries to device storage prior to entering remote terrain without
    cellular connectivity. However, the platform''s multi-app technical evolution
    has created architectural silos. Support documentation confirms that customer
    markup databases—including waypoints, tracks, lines, and custom routes—do not
    automatically synchronize across onX Hunt, Offroad, Backcountry, and Fish. Moving
    user-generated data between apps requires manual GPX or KML export and re-import,
    during which styling attributes such as colors, line weights, and custom icons
    are lost.'
  claimRefs:
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  figureRefs:
  - FE001
  tableRefs:
  - TE003
- id: differentiation-security-and-risks
  title: Competitive Moats, Platform Governance, and Technical Risks
  body: OnX's primary technical moat lies in its historical compilation of nationwide
    parcel ownership and public-access boundaries, bolstered by institutional domain
    expertise and registered intellectual property. The company holds 24 registered
    trademarks with the USPTO, including foundational marks for ONX and specialized
    assets such as TROUTROUTES, acquired to accelerate its angling offering. Furthermore,
    onX leverages policy and advocacy initiatives, such as its published geospatial
    analysis documenting 16.4 million acres of landlocked public land across Western
    states, to position its data stack as the authoritative standard for public access.
    In 2025, the company introduced specialized algorithmic layers such as the Dispersed
    Camping layer to translate complex multi-agency land management regulations into
    field guidance, and rolled out onX SOS, an emergency satellite/cellular incident
    dispatch integration powered by Overwatch x Rescue's 24/7 crisis center. Despite
    these differentiation factors, the company faces substantial technical and governance
    challenges. Cloud infrastructure uptime remains dependent on third-party hosting,
    while data procurement relies on perpetual county data licensing and public legislative
    funding such as the MAPLand Act. From a security and assurance standpoint, onX
    recruits site reliability and security analysts, but public disclosures provide
    no evidence of independent SOC 2 Type II audits, ISO 27001 certifications, or
    formal penetration testing summaries, presenting an underwriting gap for enterprise
    adoption in regulated industries.
  claimRefs:
  - CE011
  - CE012
  - CE014
  - CE015
  - CE016
