evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-metrics-disclosure
    missingEvidence: >-
      Audited GAAP financial statements, exact recognized annual recurring revenue (ARR), gross margins, net retention
      rate (NRR), customer acquisition cost (CAC), and cash burn rates.
    whyItMatters: >-
      Valuation underwriting at nearly $1.4 billion requires concrete unit economics, churn dynamics, and margin
      structure rather than growth multiples on undisclosed base figures.
    diligencePath: >-
      Request confidential management presentations, audited financial statements, and subscription cohort retention
      ledgers under non-disclosure agreement during formal diligence.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: cap-table-governance
    missingEvidence: >-
      Complete Series C capitalization table, option pool size, investor liquidation preferences, and board voting
      agreements.
    whyItMatters: >-
      Governance control rights, protective provisions, and liquidation seniority determine downside economic outcomes
      for later-stage equity investors.
    diligencePath: >-
      Review the amended and restated certificate of incorporation, investor rights agreement, and voting agreement via
      virtual data room.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: product-level-revenue-and-subscriber-mix
    missingEvidence: >-
      Audited product-level ARR, active paid subscriber counts, and average revenue per user segmented across onX Hunt,
      Offroad, Backcountry, Fish, and onX for Business.
    whyItMatters: >-
      Without segmented subscriber and ARR disclosures, diligence cannot determine whether enterprise and new vertical
      adoption represent durable expansion or whether revenue remains overwhelmingly concentrated in legacy hunting
      subscriptions.
    diligencePath: >-
      Request confidential management financial schedules detailing paid subscriber cohort retention, gross margin, and
      revenue contribution by app vertical in management meetings.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Recognized Revenue and Unit Economics Disclosures
    missingEvidence: >-
      Audited financial statements detailing exact recognized GAAP revenue, ARR dollar figures, gross margin percentage,
      and customer acquisition cost payback.
    whyItMatters: >-
      Without recognized revenue and margin data, institutional investors cannot evaluate operational profitability,
      software leverage, or terminal cash flow generation.
    diligencePath: >-
      Request audited historical income statements, revenue recognition schedules, and customer acquisition cost metrics
      under non-disclosure agreement.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: Vertical-Specific Subscriber Mix and Retention
    missingEvidence: >-
      Disaggregated active paid subscriber counts, cohort churn rates, and net revenue retention figures across Hunt,
      Offroad, Backcountry, Fish, and Business tiers.
    whyItMatters: >-
      Subscriber concentration in legacy hunting versus emerging offroad or business licensing dictates long-term growth
      durability and addressable market ceilings.
    diligencePath: >-
      Obtain cohort-level retention curves, vertical ARR breakdowns, and cross-sell penetration data during management
      meetings.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
  - type: conflicting-data
    severity: minor
    topic: Firmographic Revenue Modeling Discrepancies
    missingEvidence: >-
      Third-party registry filings reconciling generic statistical wholesale estimates ($500M+) with venture-backed
      recurring software revenue dynamics.
    whyItMatters: >-
      External automated models create distorted market size and employee productivity proxies that diverge from actual
      software subscription economics.
    diligencePath: Validate proprietary tax or corporate filings to refute automated commercial database classifications.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: security-compliance-gap
    missingEvidence: >-
      Third-party security audit reports including SOC 2 Type II attestation, ISO 27001 certification, and external
      penetration test summaries.
    whyItMatters: >-
      Enterprise and government field crews utilizing onX for Business require verified compliance documentation to
      satisfy data security requirements.
    diligencePath: >-
      Request SOC 2 Type II report, vendor security assessment questionnaire, and incident management protocols during
      enterprise underwriting.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-and-churn-metrics
    missingEvidence: >-
      Audited gross retention rates, net revenue retention (NRR) percentages, cohort churn curves, and annual contract
      value breakdowns across consumer and commercial tiers.
    whyItMatters: >-
      Without cohort retention or renewal data, underwriters cannot verify whether subscriber scale represents durable
      recurring cash flow or high-churn transactional acquisition.
    diligencePath: >-
      Request confidential management presentations, cohort-level retention exhibits, and merchant processor churn
      schedules during confirmatory diligence.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Exhaustive roster of commercial and government enterprise accounts, contractual contract values, and seat count
      commitments for onX for Business.
    whyItMatters: >-
      Public testimonials illustrate use cases but omit contract size, procurement vehicle stability, and agency renewal
      rates.
    diligencePath: >-
      Examine public agency procurement registries (GSA Advantage, state purchasing contracts) and request commercial
      customer concentration schedules.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: data-licensing-economics
    missingEvidence: >-
      Audited financial disclosure of annual county GIS cadastral licensing fees, proprietary mapping refresh costs, and
      data vendor agreements.
    whyItMatters: >-
      Cadastral data refresh is the foundational utility of the onX platform; opaque licensing economics obscure gross
      margin durability and operating leverage.
    diligencePath: >-
      Request management accounting schedules breaking out data acquisition COGS, county-by-county data contract
      structures, and refresh cycle commitments.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: liquidation-preferences-cap-table
    missingEvidence: >-
      Audited cap table disclosure detailing liquidation preferences, dividend seniority, participation rights, and
      voting controls across Series A through Growth Equity share classes.
    whyItMatters: >-
      Senior preference stacks from the July 2025 Series C and November 2025 TCV/Cross Creek rounds could impair junior
      equity returns in a sub-$1.4B M&A exit scenario.
    diligencePath: >-
      Obtain and review certificate of incorporation filings, voting agreements, and investor rights agreements in the
      formal diligence dataroom.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: audited-revenue-and-unit-economics
    missingEvidence: >-
      GAAP recognized revenue, ARR build, cohort net revenue retention (NRR), customer acquisition cost (CAC), and gross
      margin broken out by app vertical.
    whyItMatters: >-
      Without verified ARR and retention metrics, underwriting the July 2025 $1.4B valuation mark relies on inferred
      private peer multiples rather than fundamental financial quality.
    diligencePath: >-
      Request audited financial statements (FY2024–FY2025) and monthly cohort retention schedules from onXmaps
      management during confirmatory diligence.
    relatedQuestionRefs:
      - QV010
