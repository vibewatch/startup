    title: "Dominant Consumer App Store Brand Moat"
    body: "onX Hunt has established exceptional market leadership in outdoor navigation, evidenced by 9.1 million cumulative Android installs and over 274,000 iOS reviews averaging 4.9 stars. Institutional trust from over 5,000 game wardens reinforces brand authority that competitors struggle to dislodge."
    claimRefs:
      - CU002
      - CU003
      - CU008
  - calloutType: risk
    title: "Subscription Churn Exposure and Product Silos"
    body: "Customer feedback indicates real churn vulnerabilities when county land ownership records lag property transactions or when map layer rendering fails in the field. Furthermore, the lack of automatic markup synchronization across Hunt, Offroad, Backcountry, and Fish inhibits seamless multi-sport cross-selling and limits portfolio expansion."
    claimRefs:
