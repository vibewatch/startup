artifact: financials
slug: onxmaps
runDate: '2026-10-13'
company:
  name: OnXmaps
chapter:
  number: 4
  title: Financials
  summary: OnX operates a scaled multi-vertical subscription platform across outdoor recreation, reporting over 3 million subscribers, 19x ARR expansion since 2018, and nearly 3x ARR growth over the three years leading into late 2025. However, foundational underwriting metrics—including exact recognized revenue, gross margin, subscriber retention, CAC payback, and cash burn—remain undisclosed private data.
sections:
- id: revenue-streams-and-vertical-expansion
  title: Revenue Model Architecture and Multi-Vertical Expansion
  body: OnX generates revenue primarily through annual recurring subscriptions across consumer outdoor verticals and enterprise field mapping contracts. Originally established around public land hunting boundaries, the company has successfully diversified its subscription base into six core outdoor verticals, including off-roading, backcountry snow sports, fishing, hiking, and mountain biking. In addition to individual consumer mobile subscriptions, onX offers specialized per-user enterprise licensing through onX for Business, serving field crews across emergency response, land conservation, and agriculture. The company has also expanded consumer monetization with ancillary recurring tiers, such as onX SOS, an emergency rescue add-on subscription operated in partnership with Overwatch x Rescue. Institutional investor Summit Partners reports that onX has expanded to more than 3 million subscribers and grown annual recurring revenue by over 19x since initial institutional capitalization in
    2018, demonstrating meaningful consumer willingness to pay for specialized offline mapping utility.
  claimRefs:
  - CI001
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
- id: pricing-packaging-and-channel-economics
  title: Pricing Architecture, Monetization Dynamics, and Distribution Channels
  body: Monetization at onX is anchored on annual recurring memberships distributed across direct-to-consumer digital channels and multi-seat commercial procurement. Consumer memberships have historically listed across single-state and nationwide tiers ranging from $30 per year for entry off-road coverage to $100 per year for elite multi-tier bundles. Enterprise customers using onX for Business are billed on an annual per-seat licensing model featuring centralized invoicing and administrative console management, with custom procurement support for organizations deploying thirty or more seats. In-app subscription purchases are processed through mobile platform stores including the Apple App Store and Google Play Store, alongside direct credit card checkout on the company website. Mobile app store channels impose standard 15% to 30% take rates on billings, creating an inherent gross margin divergence between web transactions and native mobile storefronts, while also subjecting mobile subscriptions
    to platform-governed refund and renewal mechanisms.
  claimRefs:
  - CI004
  - CI006
  - CI013
  - CI014
  tableRefs:
  - TI002
  figureRefs:
  - FI001
- id: cost-structure-and-margin-drivers
  title: Cost Structure, Gross Margin Dynamics, and Service Delivery Burden
  body: The cost structure of onX combines software platform hosting economics with continuous geospatial data acquisition and stewardship expenses. Cost of goods sold is driven by cloud infrastructure for tile rendering and offline map sync, commercial satellite imagery licensing, and app store transaction fees. Unlike standard SaaS providers that maintain static codebases, onX must continuously ingest, cleanse, and normalize land ownership data, county tax parcel boundaries, and public land designations across thousands of local, state, and federal jurisdictions. In addition, the company commits operating resources to public land access initiatives, funding stewardship and trail restoration projects across 23 states. Because audited GAAP financial statements remain strictly private, exact gross margin percentages and software contribution margins cannot be verified independently, leaving institutional underwriters to estimate gross margins based on analog consumer subscription benchmarks.
  claimRefs:
  - CI007
  - CI010
  - CI011
  tableRefs:
  - TI003
- id: capital-adequacy-and-diligence-verdict
  title: Capital Adequacy, Institutional Financing, and Diligence Verdict
  body: OnX exhibits strong forward capital adequacy backed by top-tier growth equity investors, while presenting substantial financial information asymmetry for prospective underwriters. The company secured an $87.4 million Series B investment led by Summit Partners in October 2022 and followed with a major strategic growth investment from TCV in November 2025. Coinciding with the TCV transaction, management announced that annual recurring revenue had nearly tripled over the preceding three-year period. However, commercial database providers publish unverified estimates modeling onX as a wholesale merchant with over $500 million in revenue, highlighting the degree of distortion in unverified third-party firmographic profiles. Essential underwriting metrics—including GAAP recognized revenue, net revenue retention, subscriber cohort churn, and cash burn—remain undisclosed. While institutional sponsorship provides deep capital reserves, independent underwriting requires audited financial statements
    and cohort retention schedules.
  claimRefs:
  - CI002
  - CI008
  - CI009
  - CI012
  - CI015
