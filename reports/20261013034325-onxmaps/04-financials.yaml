callouts:
- calloutType: insight
  title: Compounding Subscription Expansion Across Core Outdoor Verticals
  body: OnX has achieved significant scale by moving beyond its single-product hunting roots into a multi-vertical outdoor ecosystem spanning off-roading, backcountry snow sports, fishing, and enterprise crews. Expanding into adjacent recreations has enabled the company to surpass 3 million subscribers and nearly triple ARR over three years, validating consumer willingness to pay for specialized offline geospatial utility.
  claimRefs:
  - CI001
  - CI002
  - CI003
- calloutType: risk
  title: Private Information Asymmetry and Opaque Margin Fundamentals
  body: Despite high-level milestone announcements, onX maintains strict private disclosure standards regarding unit economics. Public third-party estimates that claim revenues exceeding $500 million rely on automated wholesale merchant assumptions rather than verified subscription accounting. Prospective underwriters must treat historical top-line multiples as unverified until audited recognized revenue, gross margins, and customer cohort retention schedules are provided.
  claimRefs:
  - CI009
  - CI010
  - CI012
