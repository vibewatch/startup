      - number: '4.2'
        title: 定价架构、变现动态与分销渠道
        blocks:
          - type: paragraph
            body: >-
              onX 的变现以年度订阅为核心，依托数字渠道和多席位商业采购。消费者会员历史上按单州和全国层级定价：入门级越野覆盖每年约 $30，多层级 Elite 套餐每年约 $100。使用 onX for Business
              的企业客户按年度、按席位授权付费，配套集中开票和管理控制台；部署 30 个或以上席位的组织还可获得定制采购支持。应用内订阅通过 Apple App Store 和 Google Play Store
              等移动平台商店处理，同时公司网站也支持直接信用卡结账。移动应用商店通常抽取账单金额 15% 至 30% 的分成，使网页交易和原生移动商店之间天然存在毛利率差异；移动订阅还受平台控制的退款和续订机制约束。
