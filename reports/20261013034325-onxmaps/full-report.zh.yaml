chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与核心导航套件
        blocks:
          - type: paragraph
            body: >-
              onXmaps 由 Eric Siegfried 于 2009 年在蒙大拿州 Missoula
              创立，起点是一个明确的技术洞察：户外爱好者在野外需要即插即用、足够精准的数字边界信息，以区分公共土地和私人地块。最初装载在手持 GPS 接收器中的实体 micro-SD 卡，后来演变成完整的移动导航生态；2013
              年，onX Hunt 开始在全国推出。CEO Laura Orvidas 负责管理期间，公司把软件产品扩展为三款消费者核心产品：onX Hunt、onX Offroad 和 onX
              Backcountry。如今，平台覆盖 852 million acres 公共土地和 550,000 miles
              机动化道路的离线地图，把自身定位成服务真实野外环境的可靠荒野基础设施，而不是依赖算法驱动的互动信息流。
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO014
