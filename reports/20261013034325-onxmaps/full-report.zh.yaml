      - CU010
      - CU011
      - CU012
      - CU013
    data:
      items:
        - label: 发现与获客
          surface: Organic search, word-of-mouth, app store search, trail and hunting community recommendations
          touchpoints:
            - Google Play Store 搜索
            - Apple App Store 体育类排名
            - 步道合作伙伴联合营销
        - label: 引导与试用导航
          surface: Free app download with 7-day trial layer access and offline map downloading
          touchpoints:
            - GPS 基础地图图层探索
            - 私人土地所有者边界查询
            - 离线地图缓存设置
        - label: 消费者变现
          surface: Annual subscription paywall conversion across state and nationwide plans
          touchpoints:
            - Premium 单州订阅（$39.99/yr）
            - Premium+ 双州方案
            - Elite 全国版（$99.99/yr）
        - label: 价值扩展与附加服务
          surface: In-app safety upselling and multi-season outdoor feature usage
          touchpoints:
            - onX SOS 危机响应附加服务（$49.99/yr）
            - CarPlay 车辆仪表盘集成
            - 测距仪与装备配对
        - label: 跨产品扩展
          surface: Multi-sport activity across Hunt, Offroad, Backcountry, and Fish
          touchpoints:
            - 共享账户凭证登录
            - 应用间手动导入 / 导出标注
            - 跨垂直领域促销活动
        - label: 企业团队许可
          surface: onX for Business organizational procurement and multi-seat field crew deployment
          touchpoints:
            - 群组成员门户
            - 集中式管理开票
            - 共享团队文件夹与战术图层
