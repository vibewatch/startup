      - number: '2.3'
        title: 买方分层、工作流与预算归属
        blocks:
          - type: paragraph
            body: >-
              onX
              的买方明显分为直接面向消费者的休闲用户和组织化野外运营团队。消费者订阅者构成基础用户群，通过网页和应用商店直接购买年度订阅，费用来自个人可支配娱乐预算。这些用户的工作流需求各不相同：猎人需要公共与私人地块边界来确保合规，越野爱好者需要机动化车辆道路难度评级和合法性图层，荒野旅行者则依赖坡度角度和离线路线缓存。与此同时，onX
              for Business 面向保护机构、紧急响应人员、农业运营商和公用事业等专业团队。企业买方通过行政采购单和公司信用卡购买按用户计费的年度授权，目的在于集中团队文件夹协作、统一开票以及取得合法的商业使用权。
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 采用驱动因素、监管约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              onX 的采用由强劲的长期趋势和监管因素推动，其中最重要的是意外越界带来的严重法律责任。西部公共土地中有超过 16 million acres
              被私人持有土地包围，数字地块边界核验因此成为必要的风险缓释工具。美国林务局 Motor Vehicle Use Map 合规要求，以及 Avenza 平台于 2026 年 4 月停止数字 MVUM
              更新，都进一步促使机动车辆驾驶者采用更新及时的商业导航应用。反过来，市场扩张也受到明显限制，包括成熟休闲社群的高迁移成本、需要提前缓存地图的蜂窝网络盲区，以及缺少公开开发者
              API、阻碍第三方企业平台深度集成。一个关键尽调缺口是管理层对垂直场景流失率和收入贡献缺乏透明度，使较新的非狩猎产品能否持续仍未得到验证。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 土地所有权不对称护城河
            body: >-
              用户愿意为 onX 付费的首要原因不是通用制图，而是土地权属的法律核验。西部公共土地面积达 852 million acres，其中高度交错分布着私人持有土地，并包括 16 million acres
              被私人土地包围的公共土地。休闲用户面临严格的刑事和民事越界责任，因此准确的地块所有权地图是风险管理采购，而非可有可无的户外服务。
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM013
          - type: callout
            title: 估值与 ARR 披露脱节
            body: >-
              onX 虽已在户外活动领域建立显著品牌认知并拥有数百万注册账户，但私人公司管理层仍严格保密经过审计的
              ARR、流失率和垂直收入组合。若没有经核实的披露来说明收入如何在传统狩猎、新兴越野、钓鱼和企业层级之间分配，就必须以高度审慎的方式评估晚期成长估值。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 休闲导航格局与替代路径
        blocks:
          - type: paragraph
            body: >-
              户外数字制图和 GPS 休闲市场分为专业细分垂直解决方案、覆盖多种运动的荒野导航引擎，以及现状模拟或硬件导航工具。在狩猎导航领域，OnX Hunt 直接与 HuntStand 和 GoHunt Maps
              竞争。HuntStand 面向白尾鹿猎人和共享狩猎租赁联盟，提供预订工具，订阅起价为每年 $34.99。GoHunt Maps 则面向需要抽签概率分析和海拔剖面的西部大型猎物猎人，年度价格最高达到
              $169.99。在机动越野导航领域，OnX Offroad 的主要竞争对手是 Gaia GPS（Outside Inc.
              的资产），后者强调灵活的地图图层定制、多运营商蜂窝覆盖地图，以及服务越野旅行社群的路线规划。在徒步、越野跑和一般登山等相邻活动中，AllTrails、Gaia GPS 等多运动平台和 Garmin
              的专用硬件设备占据了大量休闲使用场景。此外，内部自建方案和现状政府工具——例如美国林务局 Motor Vehicle Use Maps（MVUM）、BLM GIS 门户、州野生动物机构 PDF 地图和手持卫星
              GPS 设备——仍是保守型休闲用户常用的基础替代品。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
