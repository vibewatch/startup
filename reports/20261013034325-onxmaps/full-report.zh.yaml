            title: 核心户外垂直领域的订阅复合扩张
            body: >-
              OnX 从单一狩猎产品起步，扩展为覆盖越野、荒野雪上运动、钓鱼和企业团队的多垂直户外生态，由此实现了显著规模。进入相邻休闲领域后，公司订阅用户超过 3 million，ARR
              在三年内接近增长三倍，验证了消费者为专业离线地理空间工具付费的意愿。
            calloutType: insight
