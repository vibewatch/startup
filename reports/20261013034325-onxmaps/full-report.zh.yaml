            body: >-
              onX 的户外订阅平台分为四个独立休闲垂直领域：Hunt、Offroad、Backcountry 和 Fish。每个垂直领域服务特定户外用户画像，商业成熟度也不同；Hunt 是基础旗舰业务，Offroad
              是主要扩张驱动力。除直接面向消费者的移动应用外，onX 还通过 onX for Business 和团队会员制度建立了商业 B2B 授权。购买 30
              个或以上席位的组织可获得定制企业价格、集中计费和专属账户支持。这种多层次获客结构，让公司既能通过年度移动应用商店订阅向个人休闲用户变现，也能从北美商业野外团队、保护机构和公共机构运营中获取持续预算。
