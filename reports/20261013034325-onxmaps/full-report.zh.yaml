        - id: retention
          label: 付费订阅变现
        - id: opacity
          label: 运营与单位指标不透明
        - id: capital
          label: 后期增长资本压力
        - id: valuation
          label: 2025 年 7 月 $1.4B 估值审视
        - id: stance
          label: 最终判断：继续研究 / 公允
      edges:
        - from: scale
          to: engagement
        - from: engagement
          to: retention
        - from: retention
          to: opacity
        - from: opacity
          to: capital
        - from: capital
          to: valuation
        - from: valuation
          to: stance
    approximationNotes: 这是从已观察到的运营牵引力走向投资立场时，分析上需要跨过的概念路径。
