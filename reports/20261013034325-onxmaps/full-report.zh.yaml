      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 多州竞争者带来的价格伞脆弱性
            body: >-
              OnX 每年 $99.99 的 Elite 层级形成了竞争者可以利用的价格伞。Gaia GPS 每年 $39.99 就提供全国地块数据和自定义图层，HuntStand 每年 $29.99
              就提供全国土地所有权信息。选择 OnX 的多州猎人和越野旅行者，相比能力相近的低价替代品要承担明显的价格溢价。
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
              - CP010
              - CP013
          - type: callout
            title: 精选道路与地块整合护城河
            body: 不同于仅依赖自动 GIS 导入的通用导航工具，OnX 把 650,000+ miles 的精选越野道路、地主联系边界和企业团队授权结合起来。这种精选信息让核心狩猎和机动化用户难以被替代。
            calloutType: strength
            claimRefs:
              - CP001
              - CP004
              - CP008
              - CP011
              - CP016
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式架构与多垂直扩张
        blocks:
          - type: paragraph
            body: >-
              OnX
              主要通过消费者户外垂直产品的年度经常性订阅和企业野外制图合同创造收入。公司最初围绕公共土地狩猎边界建立业务，随后成功把订阅基础扩展到六个核心户外垂直领域，包括越野、荒野雪上运动、钓鱼、徒步和山地自行车。除个人消费者移动订阅外，onX
              还通过 onX for Business 提供按用户计费的企业授权，服务应急响应、土地保护和农业领域的野外团队。公司还通过 onX SOS 等附加经常性层级扩大消费者变现；该紧急救援增值订阅由 Overwatch
              x Rescue 合作运营。机构投资人 Summit Partners 报告称，onX 已扩展到超过 3 million 订阅用户，自 2018 年首次获得机构资本以来 ARR 增长超过 19
              倍，说明消费者愿意为专业离线地图工具付费。
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
