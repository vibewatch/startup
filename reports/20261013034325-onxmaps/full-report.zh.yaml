      - number: '5.2'
        title: 地理空间数据管线与运营架构
        blocks:
          - type: paragraph
            body: >-
              onX 的核心技术资产是自动化与人工精选结合的地理空间聚合管线，它把格式各异的市、县、州和联邦数据集解析为全国一体化地籍和地形数据库。美国的地块所有权边界由超过 3,100
              个县评估办公室分别管理，各地在数字化成熟度、数据模式标准和更新频率上差异巨大。OnX 摄取公共记录、USGS 3D Elevation
              Program（3DEP）激光雷达数据、卫星影像和公共机构准入记录，并将其规范化为通过 AWS 云基础设施提供的自有矢量瓦片。iOS、Android
              和网页浏览器客户端在设备本地利用矢量样式渲染复杂的多图层叠加。所有户外产品的关键运营能力都是离线野外导航：移动客户端允许订阅用户在进入没有蜂窝网络的偏远地形前，把地图、海拔剖面和地块边界缓存到设备存储中。不过，多应用技术演进也造成了架构孤岛。支持文档确认，包含航点、轨迹、线条和自定义路线的客户标注数据库，不会在
              onX Hunt、Offroad、Backcountry 和 Fish 之间自动同步。用户生成数据在应用之间迁移时必须手动导出和重新导入 GPX 或 KML，在此过程中颜色、线宽和自定义图标等样式属性会丢失。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE003
            claimRefs:
              - CE009
              - CE010
