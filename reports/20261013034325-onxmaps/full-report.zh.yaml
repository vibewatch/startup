      - number: '1.2'
        title: 高管领导、治理与生态扩张
        blocks:
          - type: paragraph
            body: >-
              onX 的领导架构把创始人对行业的真实理解与机构化运营纪律结合起来。创始人 Eric Siegfried 继续主导公共准入政策、保护合作和全国性倡议，在传统户外客群中巩固客户信任。曾任 Amazon 高管、于
              2018 年加入公司的 CEO Laura Orvidas，推动业务从单一狩猎工具转型为企业级多应用组织。在她任内，onX 的工程团队规模接近扩大五倍，并完成关键收购，吸收 Outdoor Project 及
              Adventure Project 网络（包括 Mountain Project、Hiking Project 和 MTB Project）。治理监督由主要成长投资人、Summit Partners 的
              Colin Mistele，以及 Madison Valley Partners 的前 NBCUniversal CEO Steve Burke 牵头，为董事会提供严格的机构化指导。
            claimRefs:
              - CO002
              - CO005
              - CO008
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO015
      - number: '1.3'
        title: 融资历史、估值轨迹与商业层级
        blocks:
          - type: paragraph
            body: >-
              onXmaps 在多个风险投资和成长资本周期中持续扩大收入规模，同时积累了大量机构资本。2018 年完成 Series A 后，公司于 2022 年完成 $87.4 million 的 Series B 融资，由
              Summit Partners 领投、Madison Valley Partners 参与。TechCrunch 发布的 PitchBook 记录显示，onX 于 2025 年完成 $280 million 的
              Series C 融资，使累计融资超过 $380 million，投后估值接近 $1.4 billion。除消费者订阅外，onX 还推出 onX for Business，以每席位每年 $99.99
              的价格向商业野外团队、保护区管理者和应急响应人员授权 Elite 地理空间工具套件。尽管据报道活跃用户增长达到十倍，经过审计的 GAAP 盈利能力、净收入留存率和具体流失情况仍属于未公开的私人记录。
