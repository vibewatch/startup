      - number: '4.3'
        title: 成本结构、毛利率动态与服务交付负担
        blocks:
          - type: paragraph
            body: >-
              onX 的成本结构同时包含软件平台托管经济性，以及持续获取和维护地理空间数据的费用。销售成本来自瓦片渲染和离线地图同步所需的云基础设施、商业卫星影像授权和应用商店交易费。不同于代码库相对静态的标准 SaaS
              供应商，onX 必须持续摄取、清洗和规范化数千个地方、州和联邦辖区的土地所有权数据、县级税务地块边界和公共土地标记。此外，公司还投入运营资源支持公共土地准入倡议，为 23
              个州的保护和道路修复项目提供资金。由于经过审计的 GAAP 财务报表严格保密，确切毛利率和软件贡献利润率无法独立核实，机构投资人只能参照消费者订阅业务基准估算毛利率。
            claimRefs:
              - CI007
              - CI010
              - CI011
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI010
              - CI012
      - number: '4.4'
        title: 资本充足性、机构融资与尽调结论
        blocks:
          - type: paragraph
            body: >-
              OnX 在一流成长股权投资人的支持下具备较强的前瞻资本充足性，但对潜在投资人而言存在明显的财务信息不对称。公司于 2022 年 10 月完成由 Summit Partners 领投的 $87.4 million
              Series B 投资，并在 2025 年 11 月获得 TCV 的重要战略成长投资。与 TCV 交易同时，管理层宣布 ARR 在此前三年几乎增长三倍。然而，商业数据库供应商发布的未核实估算把 onX
              模拟成收入超过 $500 million 的批发商，凸显未经核实的第三方企业画像可能产生多大偏差。GAAP 确认收入、净收入留存、订阅用户 cohort
              流失和现金消耗等关键投资评估指标仍未披露。机构股东提供了深厚资本储备，但独立投资判断仍需要经过审计的财务报表和 cohort 留存计划。
            claimRefs:
              - CI002
              - CI008
              - CI009
              - CI012
              - CI015
      - number: '4.5'
        title: 展示项
        blocks:
