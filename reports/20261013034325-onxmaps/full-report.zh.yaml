  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与户外工作流交付
        blocks:
          - type: paragraph
            body: >-
              OnX 提供针对不同户外休闲活动和野外运营的专业地理空间导航工具，而非通用消费者地图工具。消费者产品线以四款专用产品为核心：onX Hunt、onX Offroad、onX Backcountry 和 onX
              Fish，并辅以新兴企业产品 onX for Business。每款垂直应用都围绕特定从业者工作流，封装精选主题地图图层、土地所有权信息和离线导航。onX Hunt 于 2013 年最初推出，仅 Android
              安装量就超过 9.1 million；用户可以追踪大型猎物季节，评估 9,568 个不同狩猎单元的物种分布，并在 852 million acres 公共土地中识别公共狩猎准入边界。OnX Offroad
              面向机动化休闲用户，索引超过 650,000 miles 的机动化道路，按车辆宽度限制分类（包括 singletrack、50-inch 和 60-inch 道路），并提供逐向导航。OnX Backcountry
              覆盖 650,000 miles 非机动化道路和 170,000 miles 山地自行车道路，提供人力户外导航，并整合 USGS 3D 地形模型、雪崩预报和野火边界。OnX Fish
              面向淡水垂钓，绘制八个中西部州的湖泊结构和鱼类分布。对商业团队而言，onX for Business 提供多席位集中计费、共享团队文件夹，以及面向应急响应、土地信托保护和公用事业现场检查的商业使用权。
            claimRefs:
