      - number: '3.3'
        title: 护城河韧性、平台迁移成本与替代风险
        blocks:
          - type: paragraph
            body: >-
              OnX 的护城河来自本地化自有数据资产、在狩猎领域的品牌权威，以及向 B2B 野外制图扩展的企业业务。公司汇集县级地块数据、公共土地边界判定和超过 650,000 miles 的活跃越野道路基础设施，覆盖
              9,568 个狩猎单元。除此之外，OnX 还整合了由 Overwatch x Rescue 提供动力的应用内 SOS
              安全生态，以锁定高风险荒野探险者。不过，消费者终端用户的迁移成本仍属中等。历史航点、保存的狩猎点位和离线缓存地图会制造平台摩擦，但竞争工具支持 GPX
              数据导入和导出。多运动用户同时使用多个平台的情况很普遍：他们可能用 AllTrails 徒步，转而用 OnX 狩猎或越野。公司向多应用团队会员（覆盖 Backcountry、Offroad、Fish 和
              Hunt）及企业场地规划扩张，意在建立保护和农业团队的机构迁移成本，从而抵消消费者流失和低价移动应用替代。
            claimRefs:
              - CP001
              - CP005
              - CP008
              - CP011
              - CP014
              - CP015
