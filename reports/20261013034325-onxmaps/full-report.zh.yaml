        - 回收期恶化，或应用之间无法交叉销售的证据
      - - 治理
        - Summit Partners、TCV 和 Cross Creek 等顶级投资方支持，提供增长空间
        - 成长轮的优先级清算权可能压缩非优先股权回报
        - 下轮融资、结构化资本重组或困境二级股份转让
    notes: 论点、反论点和论点破坏指标综合自公司产品文档、联邦野生动物调查和私人融资记录。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV013
      - CV014
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心运营假设
      - 估值倍数与逻辑
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 加速至 $150M+，运营利润率达到 25%+；企业现场制图扩展至公用事业和林业团队
        - 估值 $1.8B–$2.2B，基于 ARR 的 12x–15x 垂直订阅软件溢价倍数
        - 核心狩猎垂直领域订阅者趋于饱和；企业 B2B 销售周期拉长
        - 20%（需要多垂直领域扩张毫无瑕疵，且企业采用强劲）
      - - 基准情景
        - ARR 达到 $100M–$120M；Hunt 与 Offroad 留存稳定；续订定价能力稳健
        - 估值 $1.2B–$1.4B，基于 ARR 的 10x–12x，维持 2025 年 7 月投后估值
        - 移动应用平台上的获客成本上升；消费者普遍削减可选支出
        - 55%（符合持久的品类领先地位和高度参与的户外用户基础）
      - - 悲观情景
        - ARR 停滞在 $80M 以下；空间数据许可和云托管成本压缩毛利率；流失率上升
        - 估值 $600M–$800M，基于 6x–8x ARR 倍数收缩，反映个位数增长
        - 替代地图工具激烈价格竞争；户外休闲活动面临宏观环境普遍收缩
        - 25%（完全缺少经审计公开单位经济数据，风险较高）
    notes: 远期 ARR 假设、收入倍数和情景概率是分析估算值，参考公开消费者订阅和垂直软件基准校准。
    claimRefs:
      - CV008
      - CV009
      - CV010
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从 2009 年成立到 2026 年企业业务扩张的公司、融资、产品和保护行动关键里程碑。
    approximationNotes: 日期来自官方新闻稿、产品发布公告和媒体报道；私人交易的交割日期可能有所不同。
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO007
      - CO008
      - CO011
      - CO014
    data:
      items:
        - date: '2009'
          label: 公司成立
          detail: Eric Siegfried 在蒙大拿州 Missoula 创立 onX，为 GPS 设备制作最初的 onX Chip，用于显示公共和私人土地边界。
          tone: neutral
        - date: '2013'
          label: onX Hunt 应用上线
          detail: 从实体 SD 芯片转向移动应用生态，在全国推出 onX Hunt，提供数字边界导航。
          tone: positive
        - date: '2018'
          label: Series A 融资与新任 CEO
          detail: Summit Partners 领投 Series A 融资；Laura Orvidas 加入并担任 CEO，加速软件业务增长。
          tone: positive
        - date: '2020'
          label: 收购 Adventure Project
          detail: 收购 Outdoor Project 和 Adventure Project 资产，新增 Mountain Project、Hiking Project 和 MTB Project。
          tone: positive
        - date: '2022'
          label: $87.4M Series B 投资
          detail: Summit Partners 和 Madison Valley Partners 投资 $87.4 million，扩大工程团队并加快平台开发。
          tone: positive
        - date: '2023'
          label: 公共土地准入承诺
          detail: 通过 Adventure Forever 计划，承诺拿出一定比例销售额，保障 150,000 英亩公共土地的准入并修复 150 英里步道。
          tone: neutral
        - date: '2025'
          label: Series C 独角兽里程碑
          detail: 获得 $280 million Series C 融资；据 PitchBook 和 TechCrunch 记录，onXmaps 估值接近 $1.4 billion。
          tone: positive
        - date: '2026'
          label: 企业与商业扩张
          detail: 以 $99.99/user/year 商业化推出 onX for Business，面向现场团队、应急响应和保护领域专业人士。
          tone: positive
