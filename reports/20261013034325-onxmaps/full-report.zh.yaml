      - number: '3.2'
        title: 功能矩阵、定价模式与获客经济性
        blocks:
          - type: paragraph
            body: >-
              户外 GPS 应用的竞争差异，主要取决于离线可靠性、自有地块边界导入和精选路线智能。OnX Hunt 首创了标示私人地主和公共政府土地的地块边界叠加层，并提供离线下载和网页 3D
              勘察。越野导航方面，独立产品评测显示，OnX Offroad 擅长精选道路数据库、用户提交的难度评级和逐向导航；Gaia GPS
              则在出行前规划灵活性、照片航点和蜂窝网络覆盖叠加层（AT&T、Verizon、T-Mobile）方面更强。定价上，OnX 按地域和功能深度分层：Hunt 和 Offroad 单州层级每年
              $34.99、双州层级每年 $49.99，全国 Elite 层级每年 $99.99（每月 $14.99）。相比之下，HuntStand Pro 以每年 $29.99 提供全国地块边界（另有可选的 $69.99
              Whitetail 层级），Gaia GPS Premium 以每年 $39.99 解锁全国所有地图图层。促销优惠追踪显示，OnX 通过季节性优惠码主动给首次订阅打 20% 至 30%
              的折扣，以缓解相对竞争对手的价格溢价。
            claimRefs:
