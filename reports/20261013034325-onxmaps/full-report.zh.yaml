      - number: '5.3'
        title: 竞争护城河、平台治理与技术风险
        blocks:
          - type: paragraph
            body: >-
              OnX 的首要技术护城河，是多年积累的全国地块所有权与公共准入边界数据，再加上机构化行业经验和注册知识产权。公司在 USPTO 注册了 24 个商标，包括 ONX 基础商标，以及为加速垂钓业务而收购的
              TROUTROUTES 等专用资产。此外，onX 还通过政策和倡议活动强化数据权威性，例如发布地理空间分析，记录西部各州 16.4 million acres
              被私人土地包围的公共土地，把自身数据栈定位为公共准入的权威标准。2025 年，公司推出 Dispersed Camping 等专用算法图层，把复杂的多机构土地管理法规转化为野外指引；同时推出 onX
              SOS，这是由 Overwatch x Rescue
              全天候危机中心提供动力的紧急卫星/蜂窝事故调度集成。尽管具备这些差异化因素，公司仍面临重大技术和治理挑战。云基础设施可用性仍依赖第三方托管，数据采购也依赖持续的县级数据授权和 MAPLand Act
              等公共立法资金。从安全与保障角度看，onX 招聘站点可靠性和安全分析师，但公开披露没有提供独立 SOC 2 Type II 审计、ISO 27001
              认证或正式渗透测试摘要的证据，这给受监管行业的企业采用留下了投资评估缺口。
            claimRefs:
              - CE011
              - CE012
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 数据摄取护城河与监管协同
            body: >-
              OnX 的主要技术优势，是持续摄取、对账和清洗数千个市级辖区的不同土地地块和公共边界数据。公共土地记录在格式和技术成熟度上差异很大，因此 onX
              实际上建立了一张私有的全国地籍网络；竞争者若要复制，需要投入大量资本和多年工程工作。
            calloutType: insight
            claimRefs:
              - CE009
              - CE010
              - CE016
          - type: callout
            title: 应用数据孤岛与同步摩擦
            body: >-
              平台把 Hunt、Offroad、Backcountry 和 Fish 视为彼此独立的产品孤岛，沿袭的架构模式阻止了应用之间自动同步标注。多运动户外爱好者被迫手动导出和导入 GPX/KML
              文件，视觉格式和图标也会随之丢失。这项技术债制造了用户摩擦，阻碍了跨产品的顺畅采用。
            calloutType: risk
            claimRefs:
              - CE013
