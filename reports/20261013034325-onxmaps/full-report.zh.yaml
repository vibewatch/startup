  - id: FE001
    title: OnX 地理空间平台架构栈
    type: stack
    summary: 覆盖外部地理空间数据导入、云端矢量处理、跨垂直产品交付和移动端执行的多层架构。
    data:
      layers:
        - label: 客户端应用与边缘层
          modules:
            - 原生 iOS 与 Android 客户端（OpenGL/Metal）
            - 本地 SQLite 矢量缓存与离线地图存储
            - 网页地图浏览应用
            - OnX SOS 事件触发器（Overwatch x Rescue）
          notes: >-
            Executes offline vector map rendering, GPS location tracking, and client-side markup authoring without
            cellular network connectivity.
        - label: 产品与垂直应用层
          modules:
            - onX Hunt（9,568 个狩猎单元、物种数据）
            - onX Offroad（650k 英里步道、宽度筛选）
            - onX Backcountry（USGS 3D Lidar、雪崩图层）
            - onX Fish（湖泊等深线、物种深度筛选）
            - onX for Business（团队管理与许可）
          notes: >-
            Tailors thematic layers and navigation workflows to specific recreation verticals while isolating user
            markup databases.
        - label: 云处理与 API 服务层
          modules:
            - AWS 地理空间处理与矢量瓦片流传输
            - 账户与企业订阅管理
            - 用户标注存储与同步引擎
            - 分散式露营与监管规则引擎
          notes: Serves tiled geospatial data, manages authentication, and hosts business administrative infrastructure.
        - label: 数据导入与标准化流水线
          modules:
            - 3,100+ 县级评估官地块边界导入
            - USGS 3DEP Lidar 与高程网格处理
            - 联邦 / 州公共土地准入制图（BLM/USFS）
            - 实时风险（野火范围、雪崩风险）
          notes: >-
            Ingests and harmonizes thousands of disparate municipal, state, and federal datasets into standardized
            vector layers.
        - label: 基础设施、计算与托管底座
          modules:
            - Amazon Web Services 可扩展计算集群
            - 分布式空间索引与地理空间数据存储
            - 第三方事件调度 API（Overwatch x Rescue）
            - 企业管理安全网关
          notes: >-
            Underlying cloud hosting and compute infrastructure powering tile streaming, user authentication, and data
            redundancy.
        - label: 外部地理空间数据提供商底座
          modules:
            - 县级税务评估官与记录官公共数据库
            - USGS 3DEP Lidar 点云与国家水文数据
            - USFS、BLM 与州 DNR 数字土地准入门户
            - 商业卫星影像与航空测绘提供商
          notes: Primary authoritative public and licensed data feeds supplying raw cadastral and remote-sensing inputs.
    approximationNotes: 架构层综合自技术岗位招聘、官方 API / 系统文档和已验证的产品规格。
    claimRefs:
      - CE002
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE013
      - CE015
      - CE016
