    type: journey-map
    summary: 覆盖发现、试用采用、分层变现、多应用扩展和 B2B 团队许可的客户生命周期阶段。
    approximationNotes: 生命周期阶段根据 onX 订阅条款、移动端引导流程和客户评价反馈构想。
