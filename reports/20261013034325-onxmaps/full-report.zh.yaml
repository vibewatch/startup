      - number: '1.4'
        title: 用户满意度、运营阻力与公益举措
        blocks:
          - type: paragraph
            body: >-
              公开客户情绪总体强劲，但离线地理空间导航固有的技术漏洞仍带来负面影响。在主要移动应用商店中，onX Hunt 在 iOS 上维持 4.9 星、在 Android 上维持 4.7
              星，用户称赞其响应迅速的客户支持和不可或缺的边界图层。不过，第三方分析也发现持续存在的摩擦点，包括本地地籍数据偶尔滞后多年，以及 Android 硬件上的 GPS 跟踪间歇性故障。             
              用户依赖边界精度来避免无意越界，因此地块更新滞后构成了实际运营风险。与此同时，onX 通过公益倡议强化品牌资产：2025 年借助 Adventure Forever Grants 支持 23
              个州的保护项目，并参与推动 MAPLand 和 EXPLORE Acts 等关键土地准入立法框架。
            claimRefs:
              - CO011
              - CO012
              - CO013
      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 双引擎战略：消费者订阅规模由商业授权支撑
            body: >-
              onXmaps 成功跨越了从发烧友到企业客户的鸿沟。Hunt、Offroad 和 Backcountry 的消费者户外订阅带来品牌拥护和数百万活跃用户；正式推出 onX for Business
              后，公司又提供年度团队授权和具有防御性的实用工具，帮助客户提升运营效率。
            calloutType: insight
            claimRefs:
              - CO006
              - CO007
              - CO009
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >-
              onX 所处的可服务市场，位于消费者移动户外导航、数字制图和专业土地权属核验的交汇处。它并不与 Apple Maps 或 Google Maps
              等通用消费者地图平台正面竞争，而是把品类边界定义在需要离线可靠性和地块边界精度的休闲活动上，覆盖 852 million acres
              公共土地。纳入的软件支出包括年度直销消费者移动应用订阅、网页地图规划席位、onX SOS 等专业应急响应增值服务，以及企业多用户野外授权。排除项包括实体硬件、卫星通信设备、实体休闲车辆、户外装备和通用企业 GIS
              软件套件。现状替代品包括纸质 Forest Service Motor Vehicle Use Maps、州野生动物机构监管手册和免费离线 GPS 工具；这些产品都没有把实时位置共享与私人地块所有权边界结合起来。
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM011
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM006
              - CM007
              - CM009
              - CM011
              - CM012
      - number: '2.2'
        title: 可服务市场规模与经济基础
        blocks:
          - type: paragraph
            body: >-
              评估 onX 的市场机会时，必须把宏观户外休闲支出与可捕获的数字订阅支出分开。美国经济分析局数据显示，户外休闲经济在 2024 年创造了 $696.7 billion 的当期美元增加值，占全国 GDP 的
              2.4%。传统户外休闲活动贡献 $205.5 billion，其中划船和钓鱼贡献 $38.4 billion，房车活动贡献 $27.5 billion，狩猎、射击和诱捕贡献 $16.5
              billion。但这些宏观支出主要流向住宿、设备和交通。专业户外导航软件的可服务市场仅覆盖约 4 million 至 6 million 名活跃的北美爱好者，他们每年支付 $35 至 $100，对应国内 TAM
              $450 million 至 $650 million。虽然 onX 报告了数百万用户参与，经过审计的产品级年度经常性收入和付费订阅用户数仍未公开，因此估计实际 SOM 在 $80 million 至 $120
              million 之间。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: figure
