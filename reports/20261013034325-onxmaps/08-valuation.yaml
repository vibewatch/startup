company:
  name: OnXmaps
chapter:
  number: 8
  title: Valuation
  summary: Comprehensive valuation analysis evaluating onXmaps against its July 2025
    $1.4B private valuation mark, issuing a research-more recommendation with a fair
    valuation stance pending verified ARR, retention, and cap table disclosures.
sections:
- id: section-recommendation-and-stance
  title: Investment Recommendation and Valuation Stance
  body: 'Our investment assessment for onXmaps is research-more with a risk rating
    of high and a valuation stance of fair relative to its reported July 2025 post-money
    valuation mark of $1,400M. The company has established indisputable category leadership
    in outdoor GPS navigation across four distinct pursuits: onX Hunt, onX Offroad,
    onX Backcountry, and onX Fish. However, because onXmaps remains a closely held
    private company with zero publicly audited ARR figures, recognized revenue, gross
    margin schedules, or cohort retention metrics, committing growth capital without
    confirmatory data room access introduces unacceptable underwriting risk. The fair
    valuation stance reflects that a $1.4B mark is consistent with a market-leading
    vertical subscription software franchise generating an estimated $100M to $120M
    in annualized recurring revenue at an assumed 10x to 12x multiple. Nevertheless,
    until audited disclosures confirm sustainable net revenue retention and positive
    operating free cash flow, investors must maintain strict entry discipline and
    condition any capital allocation on granular verification of subscriber unit economics.'
  claimRefs:
  - CV001
  - CV002
  - CV005
  - CV011
  - CV012
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: section-thesis-and-antithesis
  title: Investment Thesis and Anti-Thesis
  body: The core investment thesis for onXmaps rests on its powerful proprietary geospatial
    data layer, offline mobile caching capabilities, and deeply embedded community
    workflow across hunting, off-roading, and backcountry recreation. By aggregating
    public land boundaries, private parcel ownership, and over 170,000 miles of off-road
    trail data, onXmaps provides an indispensable utility for outdoor enthusiasts
    navigating remote environments without cellular coverage. Furthermore, expansion
    into enterprise field mapping with onX for Business demonstrates an attractive
    avenue to commercialize its platform across professional utility, conservation,
    and resource management crews. Conversely, the anti-thesis centers on macro recreational
    spending vulnerabilities and the structural ceiling of vertical subscription markets.
    If outdoor recreation engagement normalizes or economic headwinds curb consumer
    willingness to maintain premium annual app subscriptions, growth could decelerate
    sharply. Additionally, competition from diversified tech platforms and navigation
    hardware manufacturers could constrain long-term pricing power unless onXmaps
    continuously broadens its technological and workflow moat.
  claimRefs:
  - CV003
  - CV005
  - CV006
  - CV013
  - CV014
  tableRefs:
  - TV002
- id: section-valuation-and-scenario-analysis
  title: Financing Context and Scenario Analysis
  body: onXmaps has accumulated $387.68M in total capital across five financing rounds,
    culminating in a July 2025 Series C round that established its $1,400M valuation
    and a subsequent November 2025 growth equity investment from TCV, Cross Creek,
    and returning backer Summit Partners. Under our base case scenario (55% probability),
    onXmaps generates $100M to $120M in ARR with stable single-app retention and modest
    enterprise contribution, justifying a fair valuation range of $1.2B to $1.4B at
    10x to 12x ARR. Under our bull case scenario (20% probability), effective cross-selling
    across the multi-app portfolio and rapid enterprise adoption of onX for Business
    propel ARR past $150M with 25%+ operating margins, supporting an expanded valuation
    of $1.8B to $2.2B at 12x to 15x ARR. In our bear case scenario (25% probability),
    subscriber churn accelerates due to consumer fatigue, spatial licensing costs
    compress margins, and growth slows to single digits, triggering multiple compression
    to 6x to 8x ARR and a down-round valuation of $600M to $800M.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV007
  - CV008
  - CV009
  - CV010
  tableRefs:
  - TV003
- id: section-exit-readiness-and-diligence-path
  title: Exit Readiness, Thesis-Break Triggers, and Diligence Asks
  body: onXmaps possesses multiple plausible liquidity pathways, including an eventual
    public offering as an outdoor software pure-play or a strategic acquisition by
    navigation conglomerates such as Garmin, consumer tech platforms like Apple, or
    diversified outdoor equipment holdings. However, successful execution of an exit
    is heavily contingent upon resolving key governance and capital structure unknowns.
    The presence of $387.68M in total funding, particularly late-stage growth equity
    from institutional sponsors, suggests that substantial senior liquidation preferences
    and protective covenants may sit ahead of common equity holders. Critical thesis-break
    triggers that would prompt an immediate downgrade to avoid include any documented
    deceleration in active paid subscribers, an increase in customer acquisition costs
    that outpaces lifetime value, or down-round secondary share transactions indicating
    private valuation stress. Prior to any investment decision, diligence must specifically
    demand audited financial statements, historical monthly retention cohorts, gross
    margin builds, and complete certificates of incorporation detailing share class
    seniority.
  claimRefs:
  - CV004
  - CV007
  - CV010
  - CV011
tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Supporting Signal
  - Decision Implication
  rows:
  - - Recommendation
    - research-more
    - Category-defining scale in Hunt and Offroad tempered by private financials
    - Hold capital commitment pending verified ARR, retention, and gross margin data
  - - Confidence
    - medium
    - Corroborated institutional rounds from Preqin and CB Insights without audited
      statements
    - Avoid speculative valuation step-ups; require confirmatory dataroom inspection
  - - Risk Rating
    - high
    - Concentration in discretionary outdoor subscription spending and platform app
      stores
    - Model downside stress cases reflecting potential consumer churn and multiple
      compression
  - - Valuation Stance
    - fair
    - Reported July 2025 $1.4B mark matches market leadership but lacks public multiple
      verification
    - Refuse valuation expansion without verified ARR scale exceeding $100M
  - - Capital Overhang
    - moderate-high
    - $387.68M raised including Series C and November 2025 TCV/Cross Creek round
    - Analyze liquidation preference structures to quantify junior equity downside
      cushion
  notes: Assessments reflect synthesis of available private funding records, product
    footprint, and absence of audited public financial disclosures as of October 2026.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV011
  - CV012
- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis Argument
  - Anti-Thesis Counterargument
  - Thesis-Break Indicator
  rows:
  - - Market & TAM
    - Deep customer engagement across 852M public land acres and 170k+ trail miles
    - Recreational participation growth could plateau following post-pandemic peak
      engagement
    - Deceleration in hunting/fishing license sales in federal recreation surveys
  - - Product Moat
    - Proprietary geospatial property boundaries, offline caching, and crowdsourced
      trail guides
    - Commoditization risk from tech giants or specialized competitors expanding offline
      mapping
    - Sharp decline in mobile app store review rankings or paid download velocity
  - - Financials
    - High estimated lifetime value from recurring annual subscriptions across multi-app
      suite
    - Public record exhibits zero verified recognized revenue, ARR, gross margin,
      or CAC data
    - Evidence of deteriorating payback periods or inability to cross-sell between
      apps
  - - Governance
    - Top-tier sponsor backing from Summit Partners, TCV, and Cross Creek providing
      growth runway
    - Senior liquidation preferences from growth rounds could compress returns for
      non-preferred equity
    - Down-round financing, structured recapitalization, or distressed secondary share
      transfers
  notes: Thesis arguments, counterarguments, and thesis-break indicators synthesized
    from company product documentation, federal wildlife surveys, and private financing
    records.
  claimRefs:
  - CV003
  - CV005
  - CV006
  - CV013
  - CV014
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core Operating Assumptions
  - Valuation Multiple & Logic
  - Key Risks & Downside Triggers
  - Probability Signal
  rows:
  - - Bull Case
    - ARR accelerates to $150M+ with 25%+ operating margin; enterprise field mapping
      scales across utility and forestry crews
    - $1.8B–$2.2B valuation based on 12x–15x ARR premium vertical subscription software
      multiple
    - Subscriber saturation in core hunting vertical; enterprise B2B sales cycles
      lengthen
    - 20% (requires flawless multi-vertical expansion and strong enterprise adoption)
  - - Base Case
    - ARR reaches $100M–$120M; stable retention in Hunt and Offroad; steady renewal
      pricing power
    - $1.2B–$1.4B valuation based on 10x–12x ARR, sustaining the July 2025 post-money
      mark
    - Rising customer acquisition costs on mobile app platforms; general discretionary
      consumer belt-tightening
    - 55% (consistent with durable category leadership and highly engaged outdoor
      user base)
  - - Bear Case
    - ARR stagnates below $80M; gross margin compressed by spatial data licensing
      and cloud hosting costs; churn increases
    - $600M–$800M valuation based on 6x–8x ARR multiple contraction reflecting single-digit
      growth
    - Aggressive pricing competition from alternative mapping tools; broad macro pullback
      in outdoor recreation
    - 25% (elevated risk due to complete absence of audited public unit economics)
  notes: Forward ARR assumptions, revenue multiples, and scenario probabilities represent
    analytical estimates calibrated against public consumer subscription and vertical
    software benchmarks.
  claimRefs:
  - CV008
  - CV009
  - CV010
