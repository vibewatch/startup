    claimRefs: [CI003, CI004, CI005, CI006, CI012, CI015]
callouts:
  - calloutType: risk
    title: Compute scale currently destroys gross margin
    body: >-
      FY2025 cost of revenue equaled 124.0% of revenue, and the company subsequently
      signed a 60-month RMB3.491 billion compute-service agreement without disclosing
      its payment schedule or matched contracted demand.
    claimRefs: [CI005, CI006, CI012]
  - calloutType: recommendation
    title: Underwrite on cohort and service-line evidence
    body: >-
      Request monthly service-line revenue, realized pricing, compute utilization,
      gross margin, retention, CAC payback, and current sources and uses before
      assigning value to user growth or treating financing as runway.
    claimRefs: [CI002, CI004, CI008, CI009, CI014]
