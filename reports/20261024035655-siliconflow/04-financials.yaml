schemaVersion: "report-v2"
artifact: financials
slug: siliconflow
runDate: 2026-10-24
company:
  name: SiliconFlow
chapter:
  number: 4
  title: Financials
  summary: >-
    SiliconFlow's 2025 revenue grew 653.2% to RMB55.33 million, but cost of revenue
    exceeded revenue and produced a 24.0% gross loss margin. The business has three
    monetization modes and substantial financing support, yet current cash, post-round
    burn, product-level margins, retention, and customer-acquisition economics remain
    insufficiently disclosed for underwriting.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      SiliconFlow monetizes one infrastructure stack through three economically distinct
      products. Serverless service is primarily prepaid and metered by tokens, dedicated
      instances charge either a fixed reserved-period fee or token usage, and on-premise
      deployments combine software licensing, implementation, and sometimes maintenance.
      In 2025, public cloud contributed RMB29.261 million, or 52.9% of revenue, while
      on-premise deployments contributed RMB26.069 million, or 47.1%. Within public
      cloud, serverless generated RMB14.3 million and dedicated instances RMB15.0 million.
      Those modes have different recognition timing and cost-to-serve, so neither a token
      list price nor a reserved-capacity quote is a reliable proxy for realized blended
      revenue. Industry batch-inference documentation also illustrates that asynchronous
      jobs and provisioned capacity are distinct service modes, reinforcing the need to
      normalize comparisons by workload, latency, utilization, and contract structure.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: margin-and-sales-efficiency
    title: Margin structure and sales-efficiency proxies
    body: >-
      Top-line growth has not yet demonstrated attractive unit economics. Revenue rose
      from RMB7.346 million in 2024 to RMB55.33 million in 2025, but 2025 cost of revenue
      was RMB68.632 million, leaving a RMB13.302 million gross loss and a negative 24.0%
      gross margin. Computing-resource costs represented 86.9% of cost of revenue, making
      utilization, lease pricing, model mix, and customer pricing the central gross-margin
      variables. The operating expense base was also much larger than revenue: 2025 sales
      and marketing expense was RMB83.743 million, including RMB54.2 million of promotional
      computing resources, while R&D expense was RMB209.176 million. The public record
      shows rapid user and token growth, but it does not disclose CAC, payback, cohort
      retention, net revenue retention, or contribution margin by service line. User scale
      therefore remains a demand indicator rather than proof of efficient monetization.
    claimRefs: [CI001, CI005, CI006, CI007, CI014, CI015]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and financing dependency
    body: >-
      SiliconFlow used RMB172.402 million of cash in operating activities in 2025 and
      reported an RMB14.8 million historical average monthly cash-burn rate. At year-end
      it held RMB171.533 million of cash and cash equivalents plus RMB100.0 million of time
      deposits, but those balances predate the 2026 financings and do not establish current
      liquidity. The filing records RMB1.48 billion of aggregate cash consideration from
      post-year-end Series A+, B, and B+ financings, while independent reports described a
      June round of more than RMB2 billion; the differing scopes cannot be converted into
      one current-cash figure. Capital demand also rose: in June 2026 the company entered a
      60-month computing-power service agreement carrying a total RMB3.491 billion service
      fee. Without its payment schedule, current cash, post-round burn, or committed debt
      and lease maturity data, no defensible runway can be calculated.
    claimRefs: [CI008, CI009, CI010, CI011, CI012]
  - id: financial-verdict
    title: Financial verdict and underwriting blockers
    body: >-
      The revenue architecture is credible and diversified across usage, reserved capacity,
      and enterprise deployment, but revenue quality is not yet proven. Customer
      concentration improved in 2025, yet supplier concentration remains material and
      exposes gross margin to compute availability and pricing. A third-party API monitor's
      current sample also showed weak observed availability; it is not a company-wide SLA
      measurement, but it is a reason to connect service reliability to credits, churn, and
      realized margin during diligence. The underwriting case therefore depends on evidence
      that dedicated and on-premise mix can offset serverless price pressure, that promotional
      usage converts into retained paid spend, and that the large compute commitment is
      matched to contracted demand. Until management supplies current monthly financials,
      service-line gross margins, customer cohorts, realized pricing, and a sources-and-uses
      schedule, the margin path and capital sufficiency remain material blockers.
    claimRefs: [CI005, CI006, CI013, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams and quality
    columns: [Stream, Mechanism, Unit, "2025 value / status", Quality assessment, Diligence ask]
    rows:
      - ["Serverless token services", "Shared-resource API consumption", "Tokens consumed", "RMB14.3m revenue", "High-volume, low-price usage; gross margin by stream undisclosed", "Monthly paid usage, realized price per token, credits, churn, and stream gross margin"]
      - ["Dedicated instances", "Reserved public-cloud capacity", "Reserved period or tokens consumed", "RMB15.0m revenue", "Potentially steadier enterprise spend; utilization and renewal data unavailable", "Bookings, term, utilization, renewal, minimum commitments, and stream gross margin"]
      - ["On-premise deployment", "License plus implementation and optional maintenance", "Deployment / license / service", "RMB26.069m revenue", "Higher-ticket and project-based; acceptance timing and recurring mix matter", "Backlog, acceptance milestones, recurring maintenance share, and deployment gross margin"]
      - ["Public cloud aggregate", "Serverless plus dedicated instances", "Multiple", "RMB29.261m; 52.9% of revenue", "Growing mix but lower-margin exposure identified in the filing", "Reconcile revenue, credits, deferred balances, and compute cost by public-cloud product"]
    notes: "Amounts are 2025 revenue from the company filing; stream-level gross margins, discounts, and current 2026 mix were not disclosed."
    claimRefs: [CI002, CI003, CI004, CI005]
  - id: TI002
    title: Pricing, contracting, and recognition
    columns: [Offer, Contract / price basis, Revenue recognition, "List vs. realized pricing", Underwriting implication]
    rows:
      - ["Serverless", "Primarily prepaid credits deducted by token use; some enterprise monthly postpaid terms", "Point in time as tokens are used", "Public evidence set does not disclose realized price, discounting, or credits", "Consumption growth may not translate proportionally into revenue or margin"]
      - ["Dedicated instances", "Fixed fee for reserved period or token-based usage charge", "Over time for fixed fee; point in time for token usage", "Contract values, discounts, and utilization are undisclosed", "Reserved capacity can improve predictability only if utilization and renewal are strong"]
      - ["On-premise", "Subscription or perpetual license plus implementation and possible maintenance", "Point in time on delivery and acceptance in the disclosed model", "Terms vary with deployment scale, configuration, and requirements", "Project timing and one-time licensing can make mix and period comparisons volatile"]
      - ["Batch-inference comparator", "Asynchronous multi-prompt job; AWS directs users to a separate pricing page", "Comparator only; not a SiliconFlow contract", "Not comparable with provisioned models without workload normalization", "Benchmark by latency, throughput, utilization, support, and commitment—not headline unit price alone"]
    notes: "Contract structures come from SiliconFlow's filing; the AWS row is an operating-model comparator and does not evidence SiliconFlow pricing."
    claimRefs: [CI004]
  - id: TI003
    title: Unit economics and capital indicators
    columns: [Metric, Value, Period / denominator, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Revenue", "RMB55.330m", "FY2025", "High", "Establishes the disclosed accounting revenue base, not ARR", "Monthly 2026 revenue and service-line reconciliation"]
      - ["Gross margin", "-24.0%", "FY2025 consolidated", "High", "Shows revenue did not cover cost of revenue", "Monthly and service-line gross margin bridge"]
      - ["Cost of revenue", "RMB68.632m", "FY2025", "High", "Exceeded revenue and drove gross loss", "Fixed/variable split and committed-versus-consumed compute"]
      - ["Computing-resource cost share", "86.9%", "Share of FY2025 cost of revenue", "High", "Makes utilization and supplier pricing the primary margin levers", "Supplier rate cards, utilization, idle capacity, and take-or-pay terms"]
      - ["Net loss", "RMB345.491m", "FY2025 IFRS", "High", "Measures accounting loss; it is not cash burn", "2026 monthly P&L and noncash reconciliation"]
      - ["Operating cash use", "RMB172.402m", "FY2025 cash flow", "High", "Shows operating funding consumption before investing cash flows", "Current operating, capex, and lease cash burn separately"]
      - ["Historical monthly cash burn", "RMB14.8m", "FY2025 company definition", "High", "Provides a dated burn reference, not current runway", "Post-financing monthly burn and management runway case"]
      - ["Cash plus time deposits", "RMB271.533m", "2025-12-31; RMB171.533m cash plus RMB100.0m deposits", "High", "Pre-financing liquidity snapshot only", "Current unrestricted cash, restricted cash, debt, and maturity schedule"]
      - ["CAC / payback", null, "Not publicly disclosed", "Low", "Promotional compute made acquisition spend economically material", "Cohort CAC, gross-margin payback, organic share, and credit-adjusted acquisition cost"]
      - ["NRR / cohort retention", null, "Not publicly disclosed", "Low", "Required to distinguish durable enterprise spend from promotional or episodic use", "Logo and revenue retention by serverless, dedicated, and on-premise cohort"]
    notes: "Values are reported historical figures; null means unavailable in the assigned public evidence, not zero. Funding raised is excluded from cash available."
    claimRefs: [CI001, CI005, CI006, CI007, CI008, CI009, CI014]
