chapter:
  number: 7
  title: Risks
  summary: "SiliconFlow's principal risks are not hypothetical product breadth issues but evidence gaps around production reliability, enterprise controls, Chinese AI-content compliance, and the economics of capacity commitments. Public sources support a diligence-heavy posture: the platform appears operationally useful, but contractual service levels, audit artifacts, incident history, and supplier/capacity resilience remain incompletely evidenced."
sections:
  - id: regulatory-and-legal
    title: Regulatory and legal exposure
    body: >-
      SiliconFlow serves generative-AI workloads in China, so content provenance and
      labeling obligations are a material compliance surface. China Law Translate's
      translation of the Measures says the rules apply to online information service
      providers and define synthetic content broadly across text, images, audio, video,
      and virtual scenes. The Measures require explicit labels and metadata labels,
      require service agreements to explain labeling, and permit unlabeled outputs only
      after the user's obligations are made clear and relevant logs are retained for at
      least six months. Regulations.ai likewise describes a multi-agency enforcement
      model and says the Measures and GB 45438-2025 entered force on September 1, 2025,
      but it expressly advises readers to verify the rewrite against the official text.
      The risk is therefore implementation and evidence, not a claim that SiliconFlow
      has been sanctioned. The public pool does not establish whether SiliconFlow's
      API, export, customer-deployment, or model-specific workflows satisfy each
      labeling and logging requirement. A buyer should obtain the current compliance
      matrix, algorithm-filing materials, labeling test results, retention schedule,
      and allocation of liability between SiliconFlow and customers.
    claimRefs: [CR001, CR002, CR003, CR004, CR005]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, security, and quality risk
    body: >-
      Independent procurement-oriented evidence identifies operational controls as a
      gating issue. RFP Wiki says buyers should verify regional availability, enterprise
      support, data-retention terms, audit artifacts, model lifecycle policies, and
      workload-specific latency and throughput; it also recommends testing fallback
      behavior, observability, rollback, support response, model changes, and data
      handling before production. Its SiliconFlow-specific assessment says public
      contractual uptime credits or penalties were not verified, independent benchmark
      coverage is sparse, and public SOC 2, ISO, or HIPAA certificates and subprocessor
      lists were not verified on primary pages. LMSpeed reports a 48.50% 30-day
      availability figure for its SiliconFlow provider baseline and shows a historical
      health-check view, but this is an external monitoring signal rather than a
      contractual SLA or a complete incident record. Toolin's review says occasional
      stability fluctuations appear under extremely high concurrency and that it has no
      user reviews. These signals do not prove an outage or security incident; they
      support a cautious diligence path focused on measured reliability, tenant
      isolation, regional failover, model rollback, and incident ownership.
    claimRefs: [CR006, CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependency-and-financial
    title: Partner, dependency, and financial-model risk
    body: >-
      SiliconFlow's operating model appears exposed to the interaction between
      usage-based pricing, model and GPU supply, and enterprise capacity commitments.
      The assigned evidence describes serverless usage pricing alongside reserved or
      dedicated capacity and BYOC options, which can move customers from variable
      consumption into commitments whose economics depend on demand curves, utilization,
      support tiers, and egress. RFP Wiki specifically warns that token pricing can
      understate total cost when GPU reservation, storage, egress, support tiers, or
      burst overages matter, and that reserved-capacity demand should be validated.
      InforCapital reports a 2026 Series B of $294 million and approximately $370
      million raised across four rounds, but the profile is a secondary database whose
      FAQ inconsistently calls a January 2024 Angel round the most recent round. It
      does not provide cash balance, burn, supplier contracts, or runway. Tech in Asia
      reported the February 2025 pre-A as over 100 million yuan and described
      commercialization and infrastructure investment, but it does not establish
      current liquidity or margin. The key downside is therefore a mismatch between
      capacity, pricing, and realized utilization, compounded by dependence on model
      publishers, GPU vendors, and enterprise partners. Obtain monthly burn, committed
      capacity, supplier concentration, gross-margin bridge, and stress cases before
      treating the funding headline as financial resilience.
    claimRefs: [CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR003]
  - id: diligence-triggers
    title: Monitoring and thesis-break triggers
    body: >-
      The evidence supports measurable controls rather than a binary risk label.
      NIST's voluntary AI Risk Management Framework provides a useful governance
      baseline for incorporating trustworthiness into design, development, use, and
      evaluation, but it is not evidence that SiliconFlow has implemented those
      controls. Regulatory monitoring should track labeling test failures, missing
      provenance metadata, customer requests for unlabeled output, and log-retention
      exceptions.
      Operational monitoring should track 30-day availability by region and endpoint,
      p95 latency, failed-request rates, rate-limit escalations, incident acknowledgement
      and resolution times, rollback frequency, and the percentage of production
      workloads with tested failover. Security monitoring should track certification
      coverage, subprocessor changes, access-control exceptions, and customer data
      retention. Financial and dependency monitoring should track committed versus
      utilized GPU capacity, gross margin by deployment mode, top supplier share,
      reserved-capacity take-or-pay exposure, and cash runway. A thesis break would be
      a material compliance failure, repeated service degradation without contractual
      remedies, inability to demonstrate tenant isolation or incident ownership, or
      sustained margin compression caused by underutilized committed capacity. These
      are diligence thresholds, not observed events, because the assigned public
      evidence does not disclose SiliconFlow's internal operating series.
    claimRefs: [CR005, CR006, CR007, CR008, CR012, CR013]
