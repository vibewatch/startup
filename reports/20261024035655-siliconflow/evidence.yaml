evidenceGaps:
  - type: missing-source
    severity: blocking
    topic: funding
    missingEvidence: >-
      Executed financing documents, cap table, post-money valuation, and proof of proceeds received for the reported
      2026 round and prior rounds.
    whyItMatters: >-
      Reported financing amounts and masked database fields cannot establish cash available, dilution, valuation, or
      investor control.
    diligencePath: Request board-approved cap table, signed term sheets, closing statements, and bank evidence under confidentiality.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: >-
      Monthly revenue bridge, active versus registered users, paying-customer definition, cohort retention, and
      product-line gross margin.
    whyItMatters: User, token, customer, and growth claims do not establish recurring revenue quality or profitability.
    diligencePath: Obtain monthly management accounts and anonymized cohort, usage, and customer-concentration schedules.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: identity
    missingEvidence: Authoritative legal-entity chart and confirmation of every operating location.
    whyItMatters: Legal entity, tax, regulatory, and governance conclusions depend on the correct corporate perimeter.
    diligencePath: Review incorporation certificates, group structure, registered-office records, and current operating-entity chart.
    relatedQuestionRefs:
      - QO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Complete director biographies, committee charters, beneficial ownership, and succession plan.
    whyItMatters: The available board list does not show control rights, independence effectiveness, or key-person resilience.
    diligencePath: Request the listing application governance section, shareholder register, and board materials.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      A comparable, methodology-disclosed TAM, SAM, or SOM for managed inference within SiliconFlow's eligible
      geographies and deployment modes.
    whyItMatters: >-
      Without buyer counts, traffic volumes, and category-consistent spend, market size and attainable share cannot be
      quantified.
    diligencePath: >-
      Obtain independent market data with explicit category boundaries, then reconcile it with management's traffic,
      geography, and deployment-mix records.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-adoption
    missingEvidence: >-
      Customer mix, contract values, conversion, retention, workload concentration, and serverless-to-dedicated
      expansion by buyer segment.
    whyItMatters: >-
      These metrics determine whether broad developer interest converts into durable enterprise revenue and a credible
      SOM.
    diligencePath: Review anonymized customer cohorts, billing exports, renewal data, and pipeline conversion by deployment mode.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: availability
    missingEvidence: >-
      A reconciled uptime series using the same endpoints, models, geography, sampling interval, and incident
      definition.
    whyItMatters: >-
      The 24-hour and 30-day third-party signals use different windows and samples, preventing a reliable
      production-availability conclusion.
    diligencePath: >-
      Obtain SiliconFlow status history and customer SLO reports, then reproduce endpoint tests across a defined 90-day
      period.
    relatedQuestionRefs:
      - QM006
      - QM008
  - type: missing-source
    severity: material
    topic: assurance-comparison
    missingEvidence: >-
      Comparable current certifications, uptime commitments, incident histories, data-retention terms, and SLA-credit
      schedules for SiliconFlow and each principal alternative.
    whyItMatters: Trust and availability can decide enterprise procurement even when model breadth and public prices are attractive.
    diligencePath: >-
      Request current assurance packages and twelve-month service reports, then normalize them against signed enterprise
      SLAs.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: retention-and-margins
    missingEvidence: >-
      Cohort retention, multi-homing, realized discounts, contribution margin, renewal rates, and API-to-dedicated or
      on-premise conversion.
    whyItMatters: >-
      These measures determine whether low-friction acquisition converts into durable switching costs and profitable
      expansion.
    diligencePath: >-
      Review customer cohorts, billing records, renewal contracts, workload concentration, and product-line contribution
      margins under NDA.
    relatedQuestionRefs:
      - QP010
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: minor
    topic: catalogue-scope
    missingEvidence: >-
      A date-aligned definition of active, production-supported, and merely listed models across SiliconFlow and
      competitors.
    whyItMatters: >-
      Retained sources report 129, more than 170, 200+, and 162 models under different scopes and dates, so raw counts
      are not directly comparable.
    diligencePath: >-
      Obtain dated catalogue exports and production-traffic counts by model, then reconcile delisted and duplicate
      variants.
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: current-financials
    missingEvidence: Current 2026 monthly revenue, service-line mix, cost of revenue, and gross margin.
    whyItMatters: The 2025 negative gross margin may have improved or deteriorated after financing and the compute commitment.
    diligencePath: >-
      Obtain monthly management accounts through September 2026 with a revenue and gross-margin bridge by serverless,
      dedicated, and on-premise service.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, post-round sources and uses, monthly burn, debt and lease maturities, and the RMB3.491
      billion compute-agreement payment schedule.
    whyItMatters: >-
      Historical cash, financing proceeds, and a total service fee cannot be converted into current runway without
      timing and restriction data.
    diligencePath: >-
      Reconcile bank statements to the latest balance sheet and produce a 24-month base, downside, and supplier-shock
      liquidity schedule.
    relatedQuestionRefs:
      - QI010
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CAC, gross-margin payback, logo and revenue retention, credit-adjusted usage, and contribution margin by customer
      cohort.
    whyItMatters: >-
      Rapid user and token growth may reflect promotional credits or low-retention usage rather than durable revenue
      quality.
    diligencePath: >-
      Provide quarterly cohorts by acquisition channel and product, including paid spend, credits, retained usage, gross
      profit, and churn.
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: realized-pricing
    missingEvidence: >-
      Current list prices, realized prices, enterprise discounts, service credits, minimum commitments, and renewal
      terms.
    whyItMatters: >-
      Different billing units and contract structures prevent a reliable price or margin comparison from public
      disclosures.
    diligencePath: >-
      Sample executed contracts and invoices across serverless, dedicated, and on-premise customers and reconcile them
      to recognized revenue.
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: security-assurance
    missingEvidence: >-
      Current independent security or privacy attestation, control scope, exception record, penetration-test summary,
      and incident history.
    whyItMatters: >-
      Company descriptions of isolation and compliance do not establish that controls are designed and operating
      effectively across serverless, dedicated, and private deployments.
    diligencePath: >-
      Request current certification or assurance reports, control matrices, subprocessor and data-flow documentation,
      penetration-test results, and the complete incident and status history.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: performance
    missingEvidence: Reproducible benchmark definitions and results for the claimed latency, throughput, and compute-reduction ranges.
    whyItMatters: >-
      The percentage improvements cannot be compared with alternatives or translated into customer economics without
      workload, model, hardware, baseline, geography, and concurrency details.
    diligencePath: >-
      Run a buyer-controlled benchmark across representative models and regions and reconcile the results to
      SiliconFlow's test harness and capacity configuration.
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Contractual SLA terms, status-page history, incident postmortems, sampled availability methodology, and production
      failover evidence.
    whyItMatters: >-
      The adverse third-party availability signal cannot be reconciled with the company's stability claims or mapped to
      a contractual production service level.
    diligencePath: >-
      Obtain the SLA and 12-month incident export, inspect failover and capacity procedures, and run a sustained
      multi-region production-path trial.
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      Named end-customer references with workload, production date, deployment scope, measured outcome, and renewal or
