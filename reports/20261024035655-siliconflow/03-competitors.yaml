    notes: >-
      Cells reflect only retained source text as of 2026-10-24. "Unknown" and "not established" mean
      the assigned pool did not support a comparison, not that the capability is absent; LMSpeed
      values are one third-party snapshot rather than contractual SLAs.
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP011, CP012, CP013]
  - id: TP003
    title: Pricing and packaging comparison
    columns:
      - Provider or route
      - Price or unit
      - Contract model
      - Included capabilities
      - Discount or unknown
      - Competitive implication
    rows:
      - - SiliconFlow serverless
        - Tokens consumed
        - Generally prepaid credits; some recurring enterprises settle monthly
        - Shared-resource model access and technical support
        - Realized discounts and contribution margin are undisclosed
        - Low-friction adoption but easy price comparison
      - - SiliconFlow dedicated instances
        - Reserved compute capacity or token usage in an exclusive instance
        - Fixed subscription or usage-based charge
        - Reserved capacity and some latency, throughput, or stability guarantees
        - Capacity utilization and discount schedule are undisclosed
        - Greater operational stickiness than shared serverless
      - - SiliconFlow on-premise
        - Software license, implementation, and optional maintenance
        - Subscription or perpetual buyout
        - Inference engine and orchestration in customer infrastructure
        - Contract values and renewal rates are undisclosed
        - Stronger control and switching friction
      - - OpenRouter
        - Model/provider usage through one endpoint
        - API, client SDK, or agent SDK
        - Automatic fallback and cost-aware provider selection
        - Assigned quickstart has no realized price or discount schedule
        - Increases provider substitutability
      - - Fireworks AI
        - Finished-task economics and cached-input claims
        - Serverless with reserved-throughput expansion
        - Open/custom models, routing, and data residency
        - No comparable retained list-price table
        - Direct enterprise alternative on performance and control
      - - Internal build
        - Compute, engineering, and operations cost
        - Owned or separately procured infrastructure
        - Full serving-stack control
        - No comparable public total-cost evidence
        - Avoids platform margin but absorbs integration burden
    notes: >-
      SiliconFlow terms come from its application proof; OpenRouter and Fireworks terms come from
      competitor-issued pages. Public packaging is not realized customer pricing, revenue, ARR, or
      gross margin, and missing commercial values remain diligence gaps.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP014, CP016]
figures:
  - id: FP001
    title: Competitive positioning by openness and deployment control
    type: quadrant
    summary: >-
      SiliconFlow spans managed API access and customer-controlled deployment, while routers maximize
      openness and internal build maximizes control.
    data:
      xAxis: "Deployment control: 1 managed endpoint to 5 customer-controlled infrastructure"
      yAxis: "Ecosystem openness: 1 closed ecosystem to 5 multi-model and multi-provider"
      points:
        - label: SiliconFlow serverless
          x: 2
          y: 5
          detail: Unified access to more than 170 models with broad chip support.
        - label: SiliconFlow on-premise
          x: 5
          y: 5
          detail: Inference engine and orchestration deployed in customer infrastructure.
        - label: Closed cloud ecosystem
          x: 2
          y: 1
          detail: Integrated proprietary resources, models, cloud, and applications.
        - label: OpenRouter
          x: 1
          y: 5
          detail: Multi-provider endpoint with automatic fallback and cost-aware selection.
        - label: Fireworks AI
          x: 3
          y: 4
          detail: Serverless or reserved open-model inference in Fireworks or customer cloud.
        - label: Internal build
          x: 5
          y: 3
          detail: Maximum control, with openness limited by the customer's engineering capacity.
    approximationNotes: >-
      Coordinates are ordinal analyst assessments derived from retained product descriptions, not
      measured performance, market share, or independent benchmark scores; one-point differences
      are directional rather than precise.
    claimRefs: [CP002, CP003, CP005, CP006, CP007, CP014]
callouts:
  - calloutType: strength
    title: Cross-environment delivery is the clearest differentiator
    body: >-
      SiliconFlow can serve an initial shared-API workload, reserve capacity for a scaling customer,
      and deploy its software into customer-controlled infrastructure without changing the core
      inference proposition.
    claimRefs: [CP005, CP014]
  - calloutType: risk
    title: Reliability and incumbent scale constrain the moat
    body: >-
      The filing's 1.5% China share and LMSpeed's materially lower observed 30-day uptime indicate
      that breadth and neutral positioning have not yet established scale or reliability leadership.
    claimRefs: [CP001, CP008]
