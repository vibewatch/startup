        - Varies by incumbent; not compared here
        - Not established
        - Not established
        - Depends on internal stack
      - - Independent availability snapshot
        - "48.50% 30-day uptime on LMSpeed"
        - Not listed in retained comparison
        - "99.90% 30-day uptime on LMSpeed"
        - "91.30% 30-day uptime on LMSpeed"
        - No comparable measure
      - - Data control
        - Shared cloud, dedicated, or on-premise
        - Ecosystem-specific controls
        - Routing-layer controls not compared
