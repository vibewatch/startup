artifact: competitors
slug: siliconflow
runDate: 2026-10-24
company:
  name: SiliconFlow
chapter:
  number: 3
  title: Competitors
  summary: >-
    SiliconFlow occupies a narrow but defensible position between closed Chinese cloud ecosystems,
    global multi-provider routing, specialized inference platforms, and customer self-build. Its
    cross-chip deployment breadth and on-premise path differentiate it, but independent snapshots
    show materially weaker observed availability than OpenRouter, NVIDIA NIM, and Fireworks AI,
    while the filing's 1.5% China token-throughput share underscores incumbent scale pressure.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant market is broader than named model-serving startups. SiliconFlow's application
      proof divides token suppliers into independent ecosystems, which connect multiple models,
      chips, data centers, and deployment environments, and closed ecosystems built around a cloud
      or technology company's own resources. On the filing's commissioned Frost & Sullivan data,
      SiliconFlow ranked fourth in China by 2025 token throughput with 1.5% share, while the three
      anonymized leaders held 42.7%, 32.5%, and 11.8%. It ranked first only within the independent
      ecosystem category. OpenRouter competes for the unified developer endpoint and routing layer;
      Fireworks competes for optimized open-model inference and reserved throughput; and internal
      build remains credible for enterprises that already own compute. The filing identities are
      redacted, so assigning those market shares to named clouds would be speculation.
    claimRefs: [CP001, CP002, CP003, CP006, CP007, CP015]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-and-trust
    title: Capability, performance, and trust comparison
    body: >-
      SiliconFlow's strongest product distinction is the span from prepaid serverless tokens to
      reserved instances and software deployed inside a customer's own environment. The filing says
      the same interface covers more than 170 models and pairs international and domestic chips,
      while third-party directories confirm broad model and multimodal positioning. That breadth is
      not equivalent to service leadership. LMSpeed's access-date snapshot lists SiliconFlow at 162
      models, 62 tokens per second, and 48.50% 30-day uptime, below OpenRouter's 686 models, 96 tokens
      per second, and 99.90% uptime and Fireworks AI's 139 tokens per second and 91.30% uptime.
      Artificial Analysis also shows that price and speed vary materially by model, so platform-wide
      performance claims should not be inferred from one model row. Security posture is likewise
      asymmetric: SiliconFlow describes isolation and on-premise processing, but comparable current
      assurance packages for every alternative were not available in the assigned evidence.
    claimRefs: [CP004, CP005, CP008, CP009, CP010, CP011, CP012, CP013]
    tableRefs: [TP002]
  - id: packaging-and-distribution
    title: Pricing, packaging, and distribution power
    body: >-
      Packaging determines which rival appears in a procurement process. SiliconFlow's serverless
      service is token-metered and generally prepaid, dedicated instances reserve capacity and are
      priced from infrastructure cost, and on-premise deployments combine software licensing,
      implementation, and sometimes maintenance fees. OpenRouter instead emphasizes automatic
      fallback and cost-aware selection through one endpoint, which can reduce dependence on any
      single underlying provider. Fireworks markets serverless-to-reserved expansion, global data
      residency, and model routing, making it a more direct enterprise inference peer. SiliconFlow
      also depends on upstream compute access: its filing reports that the five largest suppliers
      represented 70.8% of 2025 purchases and says supply is generally not protected by long-term
      guarantees. Its chip breadth diversifies technical compatibility, but does not by itself prove
      bargaining power or durable capacity access.
    claimRefs: [CP005, CP006, CP007, CP008, CP009, CP016]
    tableRefs: [TP003]
  - id: durability
    title: Switching costs and moat durability
    body: >-
      The moat is operational rather than contractual at the API edge. SiliconFlow argues that
      repeated model adaptation, deployment migration, orchestration, and production operations
      create reusable know-how and customer switching costs. That mechanism is credible for
      dedicated and on-premise deployments, where customer infrastructure and support workflows are
      integrated, but weaker for serverless traffic exposed through OpenAI-compatible interfaces or
      an external router. The company's own filing also warns that enterprise buyers may prefer
      internally developed products or more favorable competitor terms. A durable advantage
      therefore requires evidence that customers expand from low-friction API use into reserved or
      private deployments without sacrificing reliability or margin. Public evidence does not
      disclose cohort retention, multi-homing, realized discounts, workload concentration, or
      renewal behavior, so the durability judgment remains provisional.
    claimRefs: [CP005, CP006, CP008, CP014, CP015, CP016]
tables:
  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor or alternative
      - Category
      - Public scale or funding signal
      - Target segment
      - Differentiation
      - Limitation
    rows:
      - - SiliconFlow
        - Independent token-supply and inference platform
        - "1.5% of China token throughput in 2025; over 170 supported models in the filing"
        - Developers, SMEs, large enterprises, and institutions
        - Cross-chip model adaptation plus serverless, dedicated, and on-premise delivery
        - Ranking and scale data are company-filed and partly based on a commissioned report
      - - Anonymized closed-ecosystem leaders
        - Integrated cloud, model, and application incumbents
        - "Top three filing shares were 42.7%, 32.5%, and 11.8% of 2025 China token throughput"
        - Buyers already procuring cloud and AI services from an incumbent
        - Integrated infrastructure, procurement, models, and application distribution
        - Filing redacts identities, preventing named share attribution
      - - OpenRouter
        - Multi-provider model router and unified API
        - Hundreds of models through one endpoint; LMSpeed lists 686 models
        - Developers prioritizing provider choice and rapid model substitution
        - Automatic fallback and cost-aware routing
        - Assigned evidence does not establish private deployment or comparable enterprise assurance
      - - Fireworks AI
        - Specialized open-model inference platform
        - "Company claims 10,000+ customers and 30+ regions"
        - Multi-model enterprises needing optimized or reserved inference
        - Custom models, routing, data residency, and reserved throughput
        - Scale and throughput advantages are competitor-issued claims
      - - Internal build
        - Status quo and self-hosted substitute
        - No comparable public scale metric in the assigned evidence
        - Enterprises with owned clusters, platform engineers, or strict data controls
        - Maximum operational control and direct use of existing compute
        - Requires scarce engineering, orchestration, and ongoing model-adaptation capability
      - - SiliconFlow through OpenRouter
        - Partner-distributed route to SiliconFlow capacity
        - SiliconFlow appears as one routeable provider in a broader aggregation workflow
        - Overseas developers already integrated with OpenRouter
        - Low-friction distribution beyond SiliconFlow's direct endpoint
        - The channel also lowers buyer dependence on SiliconFlow
    notes: >-
      Scale uses the filing's 2025 token-throughput denominator or each competitor's stated current
      catalogue/customer scope; these are not equivalent metrics, and unknowns are stated rather
      than estimated.
    claimRefs: [CP001, CP002, CP003, CP004, CP006, CP007, CP010, CP015]
