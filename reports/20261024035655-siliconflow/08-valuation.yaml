          label: Scale signals
          value: "10M+ registered users and 13,000+ enterprise clients reported"
        - id: financing
          label: Financing momentum
          value: "Nearly RMB2.9B raised in 2026"
        - id: economics
          label: Economics constraint
          value: "RMB55.33M 2025 revenue and loss-making"
        - id: reliability
          label: Reliability signal
          value: "48.50% 30-day availability on LMSpeed"
        - id: price
          label: Price gap
          value: "Current post-money valuation and terms unavailable"
