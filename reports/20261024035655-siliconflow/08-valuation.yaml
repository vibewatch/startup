    claimRefs: [CV001, CV004, CV005, CV006, CV010, CV014]
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: >-
      Financing and adoption signals justify continued diligence, but the absence of a current price, ownership terms, audited economics, and reconciled reliability evidence prevents a price-sensitive buy recommendation.
    claimRefs: [CV001, CV004, CV006, CV010, CV014]
  - calloutType: risk
    title: The missing denominator controls the decision
    body: >-
      Funding raised does not establish valuation, cash available, or investor return. The decision turns on round terms, dilution, preferences, cash runway, revenue quality, and infrastructure margin.
    claimRefs: [CV002, CV006, CV012, CV013]
