      - ["13,000+ enterprise customers", "Aggregate enterprise base", "Public cloud, dedicated, and on-premise services", "Aggregate served count; individual stage undisclosed", null, "Company filing does not identify representative customer names or workload outcomes"]
      - ["Five largest 2025 customers", "Anonymized large-customer cohort", "Product mix and customer identities undisclosed", "Revenue-producing cohort", "45.0% of 2025 revenue in aggregate", "No customer names, renewal data, contracts, or customer-attributed outcomes"]
    notes: "This is a sample of the assigned public proof surfaces, not an exhaustive customer list; null means no customer-attributed outcome was disclosed in the fetched evidence."
    enumerationScope:
      coverage: sample
      basis: "Assigned prefetched evidence available to the customers chapter as of the 2026-10-24 run date."
    claimRefs: [CU007, CU010, CU013]
figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: "The disclosed commercial path progresses from ecosystem discovery and serverless use toward reserved capacity or private deployment, but public retention evidence is missing between stages."
    data:
      nodes:
        - id: discover
          label: Ecosystem discovery
          detail: "Developers encounter SiliconFlow through application ecosystems such as Dify."
          touchpoints: ["Marketplace listing", "Developer outreach"]
        - id: register
          label: Register and test
          detail: "Cumulative registrations reached 10.282 million at April 30, 2026."
          touchpoints: ["Account registration", "Trial or prepaid credits"]
        - id: consume
          label: Active serverless use
          detail: "Active-user counts measure use during the relevant year or four-month period."
          touchpoints: ["Shared-resource API", "Token consumption"]
        - id: pay
          label: Paid serverless use
          detail: "Customers purchase prepaid credits or, for some recurring enterprises, settle monthly."
          touchpoints: ["Prepaid credits", "Monthly postpaid settlement"]
        - id: reserve
          label: Dedicated instance
          detail: "Enterprises can reserve capacity for stability, performance, or supply assurance."
          touchpoints: ["Reserved capacity", "Subscription or usage charges"]
        - id: deploy
          label: On-premise deployment
          detail: "Large enterprises and institutions can deploy within private computing environments."
          touchpoints: ["Software license", "Implementation", "Maintenance"]
    approximationNotes: "This is the company's disclosed route-to-expansion logic, not a measured conversion funnel; no stage conversion or retention rates are publicly disclosed."
    claimRefs: [CU004, CU005, CU006, CU013, CU016]
callouts:
  - calloutType: strength
    title: Scale is real, but denominators differ
    body: "The filing supports substantial registrations, token throughput, and paid-account growth; none of those metrics alone establishes enterprise retention or recurring spend."
    claimRefs: [CU001, CU002, CU004]
  - calloutType: risk
    title: Customer durability remains unproven
    body: "No public NRR, GRR, churn, renewal, contract-length, SLA-attainment, or named customer-outcome series was found in the assigned evidence."
    claimRefs: [CU010, CU011, CU015]
