schemaVersion: "report-v2"
artifact: customers
slug: siliconflow
runDate: 2026-10-24
company:
  name: SiliconFlow
chapter:
  number: 6
  title: Customers
  summary: >-
    SiliconFlow has demonstrated rapid top-of-funnel adoption and a large paid serverless base, but
    public evidence is much stronger on registrations, token throughput, and customer counts than on
    retention or named production outcomes. Enterprise monetization appears to deepen through dedicated
    instances and on-premise deployments, while 2025 concentration remained material and external
    monitoring raises a reliability diligence question.
sections:
  - id: customer-segments-and-buyers
    title: Customer segments and buying paths
    body: >-
      SiliconFlow serves three economically distinct customer groups rather than one homogeneous user
      base. Serverless token services target developers and small or midsize enterprises that prepay for
      flexible consumption; dedicated instances target enterprises that value reserved capacity,
      stability, or supply assurance; and on-premise deployments target institutions with their own
      compute and tighter data-location, network-boundary, or integration requirements. The 2025 revenue
      mix was nearly balanced between public cloud services at 52.9% and on-premise solutions at 47.1%,
      despite the much larger public-cloud account base. A Dify Marketplace listing provides concrete
      ecosystem-distribution evidence, but it is partner-surface proof rather than proof of an end
      customer's production workload.
    claimRefs: [CU008, CU009, CU013]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and commercial density
    body: >-
      The filing reports 10.282 million cumulative registered users at April 30, 2026 and average daily
      throughput of 578.5 billion tokens in April, establishing substantial platform reach. Paid
      serverless customers rose from 2,455 in 2024 to 716,012 in 2025; the 642,866 figure for the first
      four months of 2026 is explicitly a period count and is not annualized. Active-user and dedicated-
      instance data also show growth, but registrations, activity, and paid accounts use different
      denominators and must not be read as a conversion funnel. Tech in Asia's earlier report of more
      than three million users supports the direction of growth, while the later company-issued release
      uses a broader, undated "past year" frame that cannot be cleanly reconciled to the filing cut-off.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU007, CU012, CU014]
    tableRefs: [TU002]
  - id: enterprise-durability-and-concentration
    title: Enterprise durability, expansion, and concentration
    body: >-
      Enterprise depth is visible in higher-value deployment formats, but durability remains only partly
      observable. Dedicated-instance customers increased from seven to 49 between 2024 and 2025, while
      on-premise customers declined from 28 to 20 as average revenue per on-premise customer increased
      from RMB224,184 to RMB1,303,448. The filing describes a path from public-cloud proof of concept to
      dedicated or on-premise deployment, yet it provides no NRR, GRR, churn, renewal, or contract-length
      series. Concentration improved but remained meaningful in 2025: the top five customers represented
      45.0% of revenue and the largest represented 13.6%. The company's statement that it experienced no
      contract terminations or major complaints during the track record period is useful but does not
      substitute for independently verified retention evidence.
    claimRefs: [CU005, CU006, CU010, CU011, CU016]
    figureRefs: [FU001]
  - id: named-proof-and-diligence-gaps
    title: Named proof and diligence gaps
    body: >-
      The public record does not identify a representative set of end customers with deployment stage,
      workload, outcomes, renewal history, and spend expansion. The filing discloses more than 13,000
      enterprise customers and anonymized concentration metrics, while the assigned partner evidence
      confirms a Dify Marketplace presence; neither establishes named production adoption. External
      analysis also estimates only about RMB20 of 2025 serverless revenue per year-end paying account,
      illustrating low average commercial density even though actual cohort spending is not disclosed.
      Separately, LMSpeed displayed weak recent availability at access, but its measurement window and
      model coverage are insufficient to establish SiliconFlow's contractual uptime. Customer
      references, cohort retention, SLA attainment, and incident-level evidence therefore remain
      material diligence requests.
    claimRefs: [CU007, CU010, CU013, CU015]
    tableRefs: [TU003]
