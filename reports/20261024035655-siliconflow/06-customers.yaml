      - Confidence
      - Interpretation and denominator
    rows:
      - ["Cumulative registered users", "127,133", "9,197,439", "10,282,431", "High", "Period-end cumulative registrations; not active or paying users"]
      - ["Average daily token throughput in last month", "47.8B", "163.1B", "578.5B", "High", "Input plus output tokens; December for annual columns and April for 2026"]
      - ["Active serverless users", "57,431", "5,452,952", "1,453,923", "Medium", "Users active during each year or period; 2026 is four months and not annualized"]
      - ["Paying serverless customers", "2,455", "716,012", "642,866", "High", "Users purchasing serverless services during each year or period; 2026 is not annualized"]
      - ["Dedicated-instance customers", "7", "49", "20", "Medium", "Customers during each year or period; no renewal cohort disclosed"]
    notes: "All values and denominator definitions are preserved from the application proof; the four-month 2026 counts are not annualized and are not directly comparable with full-year counts."
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
  - id: TU003
    title: Named customer proof table
    columns:
      - Publicly identifiable proof surface
      - Segment
      - Deployment or use case
      - Production vs. pilot
      - Outcome
      - Limitation
    rows:
