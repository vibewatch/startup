      - ["Dedicated instances", "Enterprise users with steady, latency-sensitive, or high-throughput demand", "Reserved public-cloud capacity", "49 customers in 2025; RMB305,353 average revenue per customer", "Potential public-cloud expansion tier", "No renewal rate, contract duration, or 2026 annualized count"]
      - ["On-premise deployment", "Large enterprises and institutions with their own compute", "Private deployment, licensing, implementation, and maintenance", "20 customers and RMB1,303,448 average revenue per customer in 2025", "Higher-ticket and data-control-led enterprise motion", "No named deployments, backlog, renewal, or implementation outcome data"]
      - ["Ecosystem distribution", "Developers using third-party application platforms", "Marketplace discovery and configuration", "Dify Marketplace listing confirmed; installation count unavailable in fetched text", "Lower-friction integration surface", "Partner listing does not prove active end-customer usage"]
    notes: "Segment definitions and 2024-2026 metrics come from the application proof; the Dify row records partner-surface evidence only, and missing retention or outcome fields are not estimated."
    claimRefs: [CU004, CU005, CU006, CU008, CU013]
  - id: TU002
