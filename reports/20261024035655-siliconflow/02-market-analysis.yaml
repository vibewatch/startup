      - ["SiliconFlow catalog price proxy", "$5.65 median blended price per 1M tokens", "LLMAPI catalog, refreshed 2026-10-18; seven listed models", "Potential revenue per token under that intermediary's catalog", "Not SiliconFlow direct pricing, traffic, realized discount, or revenue"]
      - ["Competing usage-price floor", "$0.15 input and $0.60 output per 1M tokens for selected low-cost Together AI chat models", "Together AI serverless catalog fetched 2026-10-24", "Observable competitive price pressure", "Model-specific list prices do not reveal buyer volumes or SiliconFlow share"]
      - ["Subscription budget proxy", "$6-$68 monthly promotional personal tiers and $20-$200 monthly promotional or list team-seat tiers", "Alibaba Cloud Token Plan fetched 2026-10-24", "Adjacent developer and team budget envelopes", "Credits bundle models, tools, and services; not directly comparable with per-token MaaS revenue"]
    notes: >-
      Values preserve each publisher's metric, period, unit, and denominator; no row is
      converted into a market-size estimate because traffic and eligible-account counts
      are unavailable.
    claimRefs: [CM007, CM011, CM012]
