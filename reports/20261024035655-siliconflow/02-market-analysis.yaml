      - "Principal constraint"
    rows:
      - ["Individual developer or researcher", "Application developer", "Individual payment card or project credit", "Prototype with shared serverless APIs", "No provisioning and usage-based access", "Price volatility, model churn, and limited support"]
      - ["Startup AI product team", "Software and ML engineers", "Engineering leader under cloud or product budget", "Integrate multiple open models into a production feature", "OpenAI-compatible API and broad model access", "Reliability, unit economics, and migration testing"]
      - ["Enterprise platform team", "Central AI or developer-platform team", "CIO, CTO, or infrastructure procurement", "Standardize access and graduate to reserved capacity", "Governance, support, predictable capacity, and analytics", "Procurement cycle, vendor concentration, and service assurance"]
      - ["Data-sensitive enterprise", "ML platform and security teams", "Business owner with security and compliance approval", "Private, isolated, or custom deployment", "Control over data and serving environment", "Unverified residency, retention, certification, and audit controls"]
      - ["Internal self-hosting team", "ML infrastructure engineers", "Infrastructure leader funding hardware and labor", "Operate model serving directly", "Control, custom optimization, or high sustained utilization", "Capital intensity and operational complexity"]
    notes: >-
      Buyer roles are analytical segmentation inferred from documented deployment and
      pricing modes; public sources do not disclose SiliconFlow's actual customer mix or
      procurement conversion.
    claimRefs: [CM003, CM004, CM005, CM010, CM015]
figures:
  - id: "FM001"
    title: "Serviceable-market eligibility filter"
    type: "pyramid"
    summary: >-
      A qualitative narrowing from broad inference demand to buyers that SiliconFlow can
      plausibly serve under the evidence available.
    data:
      nodes:
        - label: "All AI computation"
          value: "Excluded as a sizing base"
          detail: "Includes training, hardware, applications, and other spend outside managed inference."
        - label: "Inference workloads"
          value: "Boundary begins"
          detail: "Consumption shifts from model training toward production inference, but no quantified total is retained."
        - label: "Managed model access"
          value: "MaaS-eligible"
          detail: "Buyers prefer an API or managed serving layer over operating the inference stack."
        - label: "Open and multimodal models"
          value: "Catalog fit"
          detail: "Demand includes language, image, video, and speech workloads supported by the platform category."
        - label: "Commercially eligible deployments"
          value: "Serverless, reserved, or private"
          detail: "Price, capacity, geography, governance, and deployment requirements determine eligibility."
        - label: "SiliconFlow serviceable buyers"
          value: "Unquantified"
          detail: "Attainable share requires traffic, buyer counts, retention, win rates, and geographic eligibility that are not public."
    approximationNotes: >-
      Qualitative boundary filter only; the assigned source pool does not disclose a
      comparable numeric TAM, SAM, or SOM, so layer widths do not represent value.
    claimRefs: [CM016]
callouts:
  - calloutType: "strength"
    title: "Market fit is strongest where abstraction matters"
    body: >-
      Unified API access, multimodal breadth, and multiple deployment modes address a
      real operational burden for teams that do not want to provision each model stack.
    claimRefs: [CM001, CM002, CM003]
  - calloutType: "risk"
    title: "Growth does not resolve reliability or margin"
    body: >-
      Competitive token prices, different uptime signals, and rising tokens per task mean
      industry demand can expand without guaranteeing durable service quality or margin.
    claimRefs: [CM007, CM009, CM013, CM014]
