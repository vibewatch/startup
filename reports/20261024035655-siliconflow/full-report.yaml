              - CI004
              - CI005
              - CI006
              - CI012
              - CI015
      - number: '4.2'
        title: Margin structure and sales-efficiency proxies
        blocks:
          - type: paragraph
            body: >-
              Top-line growth has not yet demonstrated attractive unit economics. Revenue rose from RMB7.346 million in
              2024 to RMB55.33 million in 2025, but 2025 cost of revenue was RMB68.632 million, leaving a RMB13.302
              million gross loss and a negative 24.0% gross margin. Computing-resource costs represented 86.9% of cost
              of revenue, making utilization, lease pricing, model mix, and customer pricing the central gross-margin
              variables. The operating expense base was also much larger than revenue: 2025 sales and marketing expense
              was RMB83.743 million, including RMB54.2 million of promotional computing resources, while R&D expense was
              RMB209.176 million. The public record shows rapid user and token growth, but it does not disclose CAC,
              payback, cohort retention, net revenue retention, or contribution margin by service line. User scale
              therefore remains a demand indicator rather than proof of efficient monetization.
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI007
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI014
      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow used RMB172.402 million of cash in operating activities in 2025 and reported an RMB14.8
              million historical average monthly cash-burn rate. At year-end it held RMB171.533 million of cash and cash
              equivalents plus RMB100.0 million of time deposits, but those balances predate the 2026 financings and do
              not establish current liquidity. The filing records RMB1.48 billion of aggregate cash consideration from
              post-year-end Series A+, B, and B+ financings, while independent reports described a June round of more
              than RMB2 billion; the differing scopes cannot be converted into one current-cash figure. Capital demand
              also rose: in June 2026 the company entered a 60-month computing-power service agreement carrying a total
              RMB3.491 billion service fee. Without its payment schedule, current cash, post-round burn, or committed
              debt and lease maturity data, no defensible runway can be calculated.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The revenue architecture is credible and diversified across usage, reserved capacity, and enterprise
              deployment, but revenue quality is not yet proven. Customer concentration improved in 2025, yet supplier
              concentration remains material and exposes gross margin to compute availability and pricing. A third-party
              API monitor's current sample also showed weak observed availability; it is not a company-wide SLA
              measurement, but it is a reason to connect service reliability to credits, churn, and realized margin
              during diligence. The underwriting case therefore depends on evidence that dedicated and on-premise mix
              can offset serverless price pressure, that promotional usage converts into retained paid spend, and that
              the large compute commitment is matched to contracted demand. Until management supplies current monthly
              financials, service-line gross margins, customer cohorts, realized pricing, and a sources-and-uses
              schedule, the margin path and capital sufficiency remain material blockers.
            claimRefs:
              - CI005
              - CI006
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Compute scale currently destroys gross margin
            body: >-
              FY2025 cost of revenue equaled 124.0% of revenue, and the company subsequently signed a 60-month RMB3.491
              billion compute-service agreement without disclosing its payment schedule or matched contracted demand.
            calloutType: risk
            claimRefs:
              - CI005
              - CI006
              - CI012
          - type: callout
            title: Underwrite on cohort and service-line evidence
            body: >-
              Request monthly service-line revenue, realized pricing, compute utilization, gross margin, retention, CAC
              payback, and current sources and uses before assigning value to user growth or treating financing as
              runway.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI004
              - CI008
              - CI009
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and product surface
        blocks:
          - type: paragraph
            body: >-
              The self-service path is legible: a user signs in, reviews model details and price information, tests a
              model in the browser experience center, creates an API key, and then invokes a REST endpoint or points the
              OpenAI Python client at SiliconFlow's base URL. That sequence lowers migration work for application teams
              already using OpenAI-style interfaces, while the documented catalog covers language, speech, image, video,
              and embedding workloads. Beyond serverless APIs, the company describes dedicated instances for core
              enterprise inference and private deployments spanning gateway and inference. These are meaningfully
              different delivery modes, but the public pages do not disclose adoption, support-response performance, or
              a common maturity measure for each line, so buyers should validate the selected mode rather than
              generalize from the API trial.
