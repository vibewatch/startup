      - number: '3.2'
        title: Capability, performance, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow's strongest product distinction is the span from prepaid serverless tokens to reserved
              instances and software deployed inside a customer's own environment. The filing says the same interface
              covers more than 170 models and pairs international and domestic chips, while third-party directories
              confirm broad model and multimodal positioning. That breadth is not equivalent to service leadership.
              LMSpeed's access-date snapshot lists SiliconFlow at 162 models, 62 tokens per second, and 48.50% 30-day
              uptime, below OpenRouter's 686 models, 96 tokens per second, and 99.90% uptime and Fireworks AI's 139
              tokens per second and 91.30% uptime. Artificial Analysis also shows that price and speed vary materially
              by model, so platform-wide performance claims should not be inferred from one model row. Security posture
              is likewise asymmetric: SiliconFlow describes isolation and on-premise processing, but comparable current
              assurance packages for every alternative were not available in the assigned evidence.
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP011
              - CP012
              - CP013
      - number: '3.3'
        title: Pricing, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Packaging determines which rival appears in a procurement process. SiliconFlow's serverless service is
              token-metered and generally prepaid, dedicated instances reserve capacity and are priced from
              infrastructure cost, and on-premise deployments combine software licensing, implementation, and sometimes
              maintenance fees. OpenRouter instead emphasizes automatic fallback and cost-aware selection through one
              endpoint, which can reduce dependence on any single underlying provider. Fireworks markets
              serverless-to-reserved expansion, global data residency, and model routing, making it a more direct
              enterprise inference peer. SiliconFlow also depends on upstream compute access: its filing reports that
              the five largest suppliers represented 70.8% of 2025 purchases and says supply is generally not protected
              by long-term guarantees. Its chip breadth diversifies technical compatibility, but does not by itself
              prove bargaining power or durable capacity access.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP014
              - CP016
      - number: '3.4'
        title: Switching costs and moat durability
        blocks:
          - type: paragraph
            body: >-
              The moat is operational rather than contractual at the API edge. SiliconFlow argues that repeated model
              adaptation, deployment migration, orchestration, and production operations create reusable know-how and
              customer switching costs. That mechanism is credible for dedicated and on-premise deployments, where
              customer infrastructure and support workflows are integrated, but weaker for serverless traffic exposed
              through OpenAI-compatible interfaces or an external router. The company's own filing also warns that
              enterprise buyers may prefer internally developed products or more favorable competitor terms. A durable
              advantage therefore requires evidence that customers expand from low-friction API use into reserved or
              private deployments without sacrificing reliability or margin. Public evidence does not disclose cohort
              retention, multi-homing, realized discounts, workload concentration, or renewal behavior, so the
              durability judgment remains provisional.
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-environment delivery is the clearest differentiator
            body: >-
              SiliconFlow can serve an initial shared-API workload, reserve capacity for a scaling customer, and deploy
              its software into customer-controlled infrastructure without changing the core inference proposition.
            calloutType: strength
            claimRefs:
              - CP005
              - CP014
          - type: callout
            title: Reliability and incumbent scale constrain the moat
            body: >-
              The filing's 1.5% China share and LMSpeed's materially lower observed 30-day uptime indicate that breadth
              and neutral positioning have not yet established scale or reliability leadership.
            calloutType: risk
            claimRefs:
              - CP001
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              SiliconFlow monetizes one infrastructure stack through three economically distinct products. Serverless
              service is primarily prepaid and metered by tokens, dedicated instances charge either a fixed
              reserved-period fee or token usage, and on-premise deployments combine software licensing, implementation,
              and sometimes maintenance. In 2025, public cloud contributed RMB29.261 million, or 52.9% of revenue, while
              on-premise deployments contributed RMB26.069 million, or 47.1%. Within public cloud, serverless generated
              RMB14.3 million and dedicated instances RMB15.0 million. Those modes have different recognition timing and
              cost-to-serve, so neither a token list price nor a reserved-capacity quote is a reliable proxy for
              realized blended revenue. Industry batch-inference documentation also illustrates that asynchronous jobs
              and provisioned capacity are distinct service modes, reinforcing the need to normalize comparisons by
              workload, latency, utilization, and contract structure.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI002
            claimRefs:
