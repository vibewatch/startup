  - id: FP001
    title: Competitive positioning by openness and deployment control
    type: quadrant
    summary: >-
      SiliconFlow spans managed API access and customer-controlled deployment, while routers maximize openness and
      internal build maximizes control.
    data:
      xAxis: 'Deployment control: 1 managed endpoint to 5 customer-controlled infrastructure'
      yAxis: 'Ecosystem openness: 1 closed ecosystem to 5 multi-model and multi-provider'
      points:
        - label: SiliconFlow serverless
          x: 2
          'y': 5
          detail: Unified access to more than 170 models with broad chip support.
        - label: SiliconFlow on-premise
          x: 5
          'y': 5
          detail: Inference engine and orchestration deployed in customer infrastructure.
        - label: Closed cloud ecosystem
          x: 2
          'y': 1
          detail: Integrated proprietary resources, models, cloud, and applications.
        - label: OpenRouter
          x: 1
          'y': 5
          detail: Multi-provider endpoint with automatic fallback and cost-aware selection.
        - label: Fireworks AI
          x: 3
          'y': 4
          detail: Serverless or reserved open-model inference in Fireworks or customer cloud.
        - label: Internal build
          x: 5
          'y': 3
