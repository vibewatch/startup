  - id: TV002
    title: Thesis / anti-thesis and comparable signals
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Capital access
        - Nearly RMB2.9B of 2026 financing reported by three publishers
        - Reconcile round-by-round proceeds, primary versus secondary capital, and cash remaining
      - - Platform scale
        - 10M+ registered users, 13,000+ enterprise clients, 170+ models, and 10+ chip types reported
        - Verify active paying cohorts, retention, spend concentration, and revenue conversion
      - - 'Anti-thesis: immature economics'
        - RMB55.33M of 2025 revenue and continued losses reported
        - Audited current revenue, gross margin, contribution margin, and burn
      - - 'Peer context: Fireworks'
        - >-
          US$17.5B valuation after more than US$1B annualized revenue; approximately 50% gross margin reported
          separately
        - Normalize revenue definition, margin, geography, and customer concentration
      - - 'Peer context: Together AI'
        - US$8.3B valuation and US$1.15B prior-quarter annual bookings reported
        - Reconcile bookings to recognized revenue and margin before using a multiple
    notes: >-
      Peer figures retain each source's metric name and period; annualized revenue and annual bookings are not treated
      as SiliconFlow revenue or as interchangeable denominators.
