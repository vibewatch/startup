  - id: FM001
    title: Serviceable-market eligibility filter
    type: pyramid
    summary: >-
      A qualitative narrowing from broad inference demand to buyers that SiliconFlow can plausibly serve under the
      evidence available.
    data:
      nodes:
        - label: All AI computation
          value: Excluded as a sizing base
          detail: Includes training, hardware, applications, and other spend outside managed inference.
        - label: Inference workloads
          value: Boundary begins
          detail: Consumption shifts from model training toward production inference, but no quantified total is retained.
        - label: Managed model access
          value: MaaS-eligible
          detail: Buyers prefer an API or managed serving layer over operating the inference stack.
        - label: Open and multimodal models
          value: Catalog fit
          detail: Demand includes language, image, video, and speech workloads supported by the platform category.
        - label: Commercially eligible deployments
          value: Serverless, reserved, or private
          detail: Price, capacity, geography, governance, and deployment requirements determine eligibility.
        - label: SiliconFlow serviceable buyers
          value: Unquantified
          detail: >-
            Attainable share requires traffic, buyer counts, retention, win rates, and geographic eligibility that are
            not public.
    approximationNotes: >-
