      - CV003
      - CV004
      - CV007
      - CV008
      - CV009
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Enterprise and private-deployment mix expands; margins and uptime improve; listing completes
        - A premium could become supportable only after audited economics and financing terms establish a denominator
        - Execution, chip supply, compliance, and listing timing
        - Low-to-medium pending evidence
      - - Base
        - Reported platform scale grows, but retention, margins, cash, and terms remain only partly disclosed
        - Track with no numeric range or target return until price and operating evidence are verified
        - Capital intensity, competition, and dilution
        - Medium
      - - Bear
        - Pricing commoditizes, reliability remains weak, or fresh capital is required before margin proof
        - Downside through a lower multiple, preference overhang, dilution, or delayed liquidity
        - Losses, concentration, substitution, and financing risk
        - Medium
    notes: >-
      Scenarios are qualitative because the assigned evidence does not disclose a current valuation, fully diluted
      ownership, current cash, or audited forward revenue and margin assumptions.
    claimRefs:
      - CV003
