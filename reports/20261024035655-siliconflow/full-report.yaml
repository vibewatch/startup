chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >
              SiliconFlow was founded in August 2023 by Yuan Jinhui and Pan Yang, with the available sources describing
              a Beijing-based AI infrastructure business. Its core proposition is a model-as-a-service layer that
              exposes multiple open-source models through APIs and related deployment products. The product descriptions
              consistently point to inference, image and video generation, speech, fine-tuning, dedicated compute, and
              private deployment, although the breadth and performance claims are largely directory-derived rather than
              independently benchmarked. The business therefore appears to sit between underlying compute and
              application developers, with a product surface that can serve both usage-based developers and enterprise
              infrastructure buyers. Beijing is the supported operating location in the assigned evidence; the complete
              legal-entity and geographic footprint still requires corporate records.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
