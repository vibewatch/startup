      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              Public documentation describes a three-part foundation of proprietary inference engines, elastic compute
              infrastructure, and scalable API services. It further claims that its engine can reduce latency by as much
              as 70% and increase throughput three-to-five times, while dynamic quantization can reduce inference
              compute requirements by 60%-80%. Those figures describe the intended optimization model, not independently
              reproduced performance: the pages do not identify the benchmark workload, model, hardware, baseline,
              geography, or test date. A third-party directory separately names SiliconLLM and OneDiff as the
              acceleration libraries, which adds architectural specificity but not benchmark validation. The investable
              technical thesis therefore rests on hardware-software optimization across a reusable API and multiple
              deployment modes, with the quantitative advantage still requiring workload-level diligence.
