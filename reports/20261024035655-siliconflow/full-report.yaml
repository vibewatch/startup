        blocks:
          - type: paragraph
            body: >-
              Yuan Jinhui is identified as chief executive and, in the Hong Kong announcement, chairman; Pan Yang is
              identified as a co-founder. The same regulatory announcement lists Liu Juncheng and Zeng Hua as executive
              directors, Chen Yingjie as a non-executive director, and Wu Chuan, Li Dan, and Hou Hong as proposed
              independent non-executive directors. This is meaningful evidence of a formalizing governance process
              linked to a contemplated Hong Kong listing, but it is not evidence that the listing was approved or
              completed. The record does not provide sufficient detail on director backgrounds, board committee
              operation, voting control, or succession arrangements, so key-person dependence around the technical and
              commercial leadership team remains a material diligence question.
