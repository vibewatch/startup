callouts:
  - calloutType: strength
    title: Product breadth and ecosystem position
    body: The assigned sources consistently describe a unified inference platform spanning multiple model modalities and deployment modes, which may help SiliconFlow capture both developer usage and enterprise infrastructure demand.
    claimRefs: [CO002, CO003, CO004]
  - calloutType: risk
    title: Scale claims require primary verification
    body: The largest 2026 claims on financing, users, and enterprise customers appear in a company-issued syndicated report and should not be treated as independently verified.
    claimRefs: [CO009, CO014, CO015]
  - calloutType: recommendation
    title: Prioritize transaction and cash diligence
    body: Obtain the cap table, round instruments, proceeds received, valuation, cash balance, and listing documents before relying on the reported financing trajectory.
    claimRefs: [CO008, CO009, CO010, CO011]
