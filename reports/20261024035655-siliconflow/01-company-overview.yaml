company:
  name: SiliconFlow
chapter:
  number: 1
  title: Company Overview
  summary: SiliconFlow is a Beijing-linked AI infrastructure company founded in 2023 that offers model inference and multimodal deployment services. The public record supports a rapidly expanding product and financing narrative, but current revenue quality, cash position, governance depth, and operating resilience remain incompletely disclosed.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >
      SiliconFlow was founded in August 2023 by Yuan Jinhui and Pan Yang, with the available sources describing a Beijing-based AI infrastructure business. Its core proposition is a model-as-a-service layer that exposes multiple open-source models through APIs and related deployment products. The product descriptions consistently point to inference, image and video generation, speech, fine-tuning, dedicated compute, and private deployment, although the breadth and performance claims are largely directory-derived rather than independently benchmarked. The business therefore appears to sit between underlying compute and application developers, with a product surface that can serve both usage-based developers and enterprise infrastructure buyers. Beijing is the supported operating location in the assigned evidence; the complete legal-entity and geographic footprint still requires corporate records.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and control
    body: Yuan Jinhui is identified as chief executive and, in the Hong Kong announcement, chairman; Pan Yang is identified as a co-founder. The same regulatory announcement lists Liu Juncheng and Zeng Hua as executive directors, Chen Yingjie as a non-executive director, and Wu Chuan, Li Dan, and Hou Hong as proposed independent non-executive directors. This is meaningful evidence of a formalizing governance process linked to a contemplated Hong Kong listing, but it is not evidence that the listing was approved or completed. The record does not provide sufficient detail on director backgrounds, board committee operation, voting control, or succession arrangements, so key-person dependence around the technical and commercial leadership team remains a material diligence question.
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-milestones
    title: Financing, scale, and milestones
    body:     SiliconFlow has disclosed or been reported to have completed multiple financings, but the amount and characterization vary by source and period. Tech in Asia reported a late-2024 pre-A round of more than RMB100 million, while a June 2026 company-issued syndicated report described more than RMB2 billion of Series B financing. Tracxn reports a Series C entry dated September 20, 2026 but masks the amounts and investor fields in the accessible page. These figures should not be combined into a total without a cap table and transaction documents. A July 2026 company announcement filed through HKEX confirms sponsor and coordinator appointments for a listing application while expressly stating that approval and an offering were not assured. Separately, the company-issued June report claims more than 10 million users and 10,000 enterprise customers, but neither denominator is defined. LMSpeed displayed 18% recent availability at access; that point-in-time signal is not proof of a recorded outage, but it warrants primary service logs.
    claimRefs: [CO008, CO009, CO010, CO011, CO012, CO014, CO015, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
