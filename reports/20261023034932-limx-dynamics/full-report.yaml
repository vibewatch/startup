      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The clearest public architecture is a layered control-and-agent stack. LimX's repositories show a
              simulation-to-real workflow built around MuJoCo, Isaac Lab, ROS integrations, ONNX deployment, and a
              low-level SDK. COSA descriptions add a three-layer conceptual architecture: whole-body motion control at
              the foundation, skill and perception capabilities in the middle, and cognition, memory, world-modeling,
              and task planning at the top. The public GitHub surface also lists VLA, motion-retargeting, navigation,
              and manipulation projects, suggesting an effort to make data collection, policy training, and deployment
              reusable across robot families. An arXiv paper on passive-body locomotion supports the general technical
              relevance of body dynamics and reinforcement learning, but it does not establish that LimX uses that exact
              method in a released product. The architecture is therefore specific enough to map dependencies, but not
              enough to verify fleet-level performance.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
