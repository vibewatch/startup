  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The competitive set spans more than humanoid startups. LimX sells a development platform across full-size
              humanoid, modular biped, and wheeled-legged form factors, so direct comparisons include Unitree and
              AgiBot, while Figure, Apptronik, and Agility compete for industrial automation budgets with narrower named
              workflows. Unitree and AgiBot are the scale reference: two current secondary sources report 2025 shipments
              of about 5,500 and 5,168 units respectively, whereas the reviewed guide does not place LimX among vendors
              shipping thousands. That omission is a dataset limitation, not proof of zero shipments. Incumbent fixed
              automation, specialist mobile manipulators, systems integrators, and an internal build on an open robot
              platform remain substitutes whenever a buyer values uptime and task specificity more than general-purpose
              mobility.
