chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product platform
        blocks:
          - type: paragraph
            body: >-
              LimX Dynamics is a Shenzhen robotics company whose public portfolio spans Luna, Oli, TRON 2, TRON 1, COSA,
              FluxVLA Engine, DreamActor, and VGM. The mix reaches beyond one humanoid body into legged hardware, motion
              control, embodied-agent software, and developer tooling. The official website offers products through
              direct purchase or cooperation prompts, while independent profiles emphasize research and developer
              adoption; this points to a hardware-and-platform sales model, but the retained evidence does not disclose
              recurring software, service, or leasing economics. Product breadth is established more clearly than
              monetization breadth, and performance or autonomy claims remain company- or reseller-issued rather than
              independently benchmarked.
            claimRefs:
