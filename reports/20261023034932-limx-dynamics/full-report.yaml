      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The retained public pages identify LimX as a Shenzhen-headquartered robotics company but do not provide a
              complete, current roster of founders, executives, directors, or board observers. Product and financing
              coverage emphasizes technology, investors, and deployment ambitions rather than governance composition.
              This evidence limitation is material for a capital-intensive hardware company because engineering
              continuity, supplier relationships, safety accountability, and financing decisions may be concentrated in
              a small leadership group, yet the degree of dependence cannot be measured here. Named investors should be
              treated as financing stakeholders rather than directors or controllers unless cap-table and governance
              records confirm their rights. Founder biographies, the executive roster, board minutes, ownership, and
              succession planning remain diligence requirements.
