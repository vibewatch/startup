      - number: '5.3'
        title: Maturity, safety, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Public maturity signals are mixed. The documentation center lists current manuals and SDK guides for TRON
              2, Luna, Oli, and FluxVLA, while the TRON 2 product page labels its stage as pilot delivery. Luna's
              official launch describes four-hour battery life, external power, force detection, fall mitigation, action
              override, and multi-device emergency stops, but these remain company-reported specifications and operating
              claims. RobotHub separately lists safety-boundary protection and a redundant-power behavior for TRON 2,
              without publishing a validation protocol. Independent coverage of COSA treats a continuous household demo
              as proof of possibility rather than a reliability statistic and notes that success rates and trial counts
              were not published. Proposed U.S. scrutiny of adversary-produced robots is a sector-level deployment risk,
              not evidence of a LimX incident. Buyers therefore need failure-rate, safety-validation, cybersecurity,
              update-governance, regulatory, supply-continuity, and production-deployment evidence before treating the
              stack as enterprise-ready.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Reusable developer surface
            body: >-
              Public repositories and documentation expose a coherent simulation, training, SDK, and deployment path
              across several robot families.
            calloutType: strength
            claimRefs:
              - CE005
              - CE009
          - type: callout
            title: Demonstration-to-reliability gap
            body: >-
              Public materials show capabilities and safety features, but independent success-rate, incident,
              cybersecurity, and production-deployment evidence is still limited.
            calloutType: risk
            claimRefs:
              - CE011
              - CE013
              - CE015
          - type: callout
            title: Underwrite deployment evidence before platform breadth
            body: >-
              The portfolio and developer surface are credible product signals, but investment confidence should depend
              on independent reliability, safety, security, and production-deployment evidence rather than
              demonstrations or feature lists.
            calloutType: recommendation
            claimRefs:
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              LimX positions its products across research, manufacturing, commercial services, inspection, construction,
              and household applications rather than around a single vertical. The official company page names B2B and
              B2C sectors including R&D, manufacturing, business, and household services, while the 36Kr report
              identifies scientific research and education, commercial services, all-terrain inspection, industrial
              applications, and construction as deployment scenarios. This points to a platform-selling motion:
              researchers and developers can buy or integrate a robot, while industrial and service operators are the
              eventual task owners. The buyer, payer, and end user are therefore not necessarily the same party. Public
              materials do not disclose segment revenue, contract sizes, procurement cycles, or the share of sales from
              each use case. The commercial opportunity is broad, but breadth also increases implementation and support
              requirements.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
      - number: '6.2'
        title: Adoption and commercialization trajectory
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption signal is volume and delivery language, not disclosed recurring usage. 36Kr reports
              that LimX has secured thousands of orders in total, with over half from overseas markets, and says Luna
              batch deliveries to domestic and international customers were completed less than a month after launch.
              WebProNews separately reports that Oli began delivering months before January 2026 and describes a plan
              for several thousand Middle East units for research, development, and service trials. These are meaningful
              commercialization indicators, but the sources do not define whether orders are paid, shipped, active, or
              repeat purchases. The 18-robot autonomous egress demonstration shows a deployment workflow, not a customer
              outcome. No public source in the assigned pool provides active accounts, utilization, renewal, churn, NRR,
              GRR, cohort retention, or customer satisfaction.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU015
              - CU016
      - number: '6.3'
        title: Named proof, durability, and expansion risk
        blocks:
          - type: paragraph
            body: >-
              Named customer proof is thin in the retained evidence. The sources identify investor and ecosystem
              relationships, including Alibaba, JD.com, SAIC Motor, NIO Capital, and global developers, but those
              relationships do not by themselves prove a production deployment or recurring revenue. The public product
              pages emphasize open SDKs, ROS compatibility, simulation environments, and customization, which may reduce
              integration friction for developer and research buyers; they do not document a customer's realized
              productivity, safety, uptime, or payback. LimX's stated overseas strategy relies on local partnerships and
              trial deployments, particularly in the Middle East, while the report does not identify a named end
              customer or published trial result. Accordingly, expansion potential is plausible but unproven, and
              concentration, channel dependence, and renewal risk cannot be quantified from public evidence.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU011
              - CU012
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU005
              - CU007
              - CU010
              - CU013
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Demand signal is ahead of retention proof
            body: >-
              Reported orders, deliveries, and overseas plans support a commercial-demand signal, but the assigned
              evidence does not establish active usage, customer outcomes, or repeat purchasing.
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU009
              - CU015
              - CU016
          - type: callout
            title: Customer-quality gap
            body: >-
              The key diligence gap is not whether LimX can name markets; it is whether shipped or ordered robots become
              reliable, paid, repeatable production deployments with measurable customer value.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              LimX sells robotics hardware and software into an environment where export controls, procurement
              restrictions, data governance, and product-safety obligations can change faster than a private company's
              disclosures. The official Oli page tells purchasers to comply with local laws and says configurations vary
              by version, which is a useful limitation but not a certification. Separately, the U.S. GUARD Act was
              introduced and referred to committee; an industry association describes a possible FCC Covered List
              pathway for certain foreign-adversary robotics. That proposal is not a LimX-specific enforcement action,
              yet it establishes a credible market-access and deployment risk for a Chinese robotics supplier. Investors
              should require a jurisdiction-by-jurisdiction compliance matrix, customer data-flow map, and confirmation
              of any certifications, export classifications, insurance, and product-liability controls before treating
              overseas orders as durable revenue.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
      - number: '7.2'
        title: Operational, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              The product evidence is strongest for platform capability and weakest for sustained field reliability.
              LimX's own materials describe independent compute, multiple sensors, interfaces, and continuous iteration,
              while third-party descriptions emphasize dynamic locomotion and simulation-to-reality workflows. Those
              features increase integration surface area: customers may need to validate sensors, software versions,
              external end-effectors, and local safety procedures. A company profile also describes an industrial proof
              of concept that still depended on teleoperation and human oversight, a meaningful boundary between a
              demonstration and autonomous production. Publicly available material does not provide failure rates, mean
              time between failures, recall history, incident counts, battery-cycle data, or independently audited
              safety results. Until those controls are disclosed, the residual risk is execution and support risk rather
              than a proven defect.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR015
      - number: '7.3'
        title: Partner, financial, and thesis-break risks
        blocks:
          - type: paragraph
            body: >-
              LimX's dependency risk combines a capital-intensive hardware model with opaque operating metrics and a
              competitive market that is scaling unevenly. A trade publication confirms RMB500 million of Series A
              funding but gives no revenue, margin, burn, runway, or customer-concentration data. A profile reports a
              large later financing and valuation, but also says no public filing had been identified; those figures
              should therefore be treated as reported rather than audited. Industry coverage describes a competitor's
              production scale and buyer-satisfaction constraints, which are not LimX measurements but illustrate the
              commercialization bar. The investment thesis should break if the company cannot document production
              acceptance, service economics, or sufficient liquidity; monitoring should focus on audited financials,
              shipment-to-activation conversion, warranty claims, support staffing, financing terms, and partner
              concentration.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR012
      - number: '7.4'
        title: Mitigations, monitoring, and diligence triggers
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a staged diligence response rather than a claim that the risks are already
              controlled. Before a material deployment, the buyer should test the exact hardware configuration, obtain
              software-update and vulnerability-management commitments, and document where telemetry and training data
              flow. Before underwriting growth, the investor should reconcile financing announcements, verify cash
              balances and runway, and separate orders, paid deliveries, active deployments, and repeat revenue. Before
              relying on overseas expansion, counsel should review export, sanctions, procurement, privacy, and
              product-liability exposure in each target market. The key kill criteria are a material safety or security
              incident without a documented response, a regulatory or procurement restriction that blocks the target
              market, or inability to evidence paid production deployments and liquidity on a reasonable diligence
              timetable.
            claimRefs:
              - CR002
              - CR005
              - CR009
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Treat an uncontained safety or security incident, a market-access restriction in a target jurisdiction, or
              failure to evidence paid production deployments and liquidity as thesis-break events rather than ordinary
              execution noise.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR013
          - type: callout
            title: Evidence boundary
            body: >-
              The assigned pool supports policy, product, financing, and competitive-context risks; it does not support
              a conclusion that LimX has suffered a specific breach, recall, litigation event, or customer failure.
            calloutType: assumption
            claimRefs:
              - CR002
              - CR007
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              LimX should be tracked rather than bought on the available public record. The company announced a US$200
              million Series B and described a credible plan to fund research, manufacturing, and global expansion, but
              financing raised is not revenue, cash available, or evidence that an entry price offers an acceptable
              return. Secondary profiles disagree on cumulative funding, and none of the assigned sources supplies a
              signed valuation notice, audited revenue, gross margin, burn, runway, preference stack, or dilution
              schedule. Independent sector reporting also warns that humanoid robotics remains exposed to reliability,
              dexterity, inference, cost, and hype risk. Those gaps make a price-insensitive buy call unjustifiable; a
              verified cap table and repeatable paid-deployment economics are prerequisites to underwriting value.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV007
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV012
              - CV014
              - CV015
      - number: '8.2'
        title: Financing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The strongest current financing evidence is LimX's own announcement of a US$200 million Series B. A
              third-party supplier profile instead reports approximately US$400 million of cumulative financing and a
              roughly RMB15 billion post-money valuation, while Robotico's sparse profile reports US$296 million raised.
              These figures have different scopes and unsupported methodologies, so they should not be blended into a
              synthetic total. Figure AI provides a useful ceiling on sector exuberance rather than a direct multiple:
              Sacra reports a US$39 billion post-money valuation after a Series C exceeding US$1 billion, but also
              identifies execution complexity and an unproven commercial market as core risks. Different capital
              structures, product maturity, and disclosure quality prevent a mechanical read-across to LimX.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
      - number: '8.3'
        title: Thesis, anti-thesis, and commercialization proof
        blocks:
          - type: paragraph
            body: >-
              The thesis is that LimX can turn a locomotion-led hardware base, modular products, and an embodied-AI
              stack into a reusable platform for research and eventual industrial deployment. Product pages show
              accessible research tooling and a broad set of intended uses, while one secondary profile claims thousands
              of orders with more than half from overseas. The anti-thesis is that these statements do not establish
              paid production deployments, retention, utilization, safety, service cost, or gross margin. A separate
              directory still labels CL-1 a prototype and "Not verified," and a reseller's product description is
              company-positioned marketing rather than independent deployment proof. Commercial value therefore remains
              the decisive diligence variable, not the breadth of demonstrations or the amount of capital raised.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV012
              - CV013
      - number: '8.4'
        title: Scenarios, downside triggers, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              A qualitative scenario framework is more honest than a fabricated valuation range. The bull case requires
              independently verified paid deployments, repeat orders, acceptable reliability, improving unit economics,
              and financing terms that preserve upside. The base case is continued technical progress and access to
              capital without enough operating disclosure to support a price conclusion, which preserves a track stance.
              The bear case is delayed commercialization combined with sector multiple compression, a down round, or
              preference terms that subordinate new investors. Exit readiness is not established by the assigned
              evidence: no source provides a verified IPO timetable, governance structure, lock-up terms, or secondary
              liquidity. Those items, plus audited financials and customer-level proof, are the immediate diligence asks
              and the conditions for changing the recommendation.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Recommendation: track'
            body: >-
              Do not underwrite a buy or precise entry valuation until primary financing terms, audited operating
              metrics, and repeat paid deployments are verified.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV014
              - CV015
          - type: callout
            title: Funding does not establish fair value
            body: >-
              The US$200 million Series B demonstrates financing access, but the evidence does not establish cash
              available, revenue, profitability, or investor return.
            calloutType: risk
            claimRefs:
              - CV001
              - CV014
