  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product portfolio and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              LimX Dynamics' public portfolio spans the TRON 2 multi-form robot, the Oli full-size general-purpose
              humanoid, and Luna, a full-size interactive humanoid. The portfolio serves different workflows rather than
              one homogeneous SKU: TRON 2 is positioned for research and manipulation, Oli for general-purpose
              embodied-AI development, and Luna for interactive commercial experiences. The company's GitHub profile
              exposes robot descriptions, simulation, training, deployment, navigation, manipulation, and SDK
              repositories, which gives developers a concrete path from model files and simulation to deployment.
              Third-party product material describes Oli as a 165 cm, 31-DoF platform with open SDK and ROS-compatible
              software, while the TRON 2 listing describes a three-mode design, arm payload and research pricing. These
              are product descriptions, not independent proof of production maturity or realized customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
