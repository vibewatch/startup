        title: Milestones and near-term proof points
        blocks:
          - type: paragraph
            body: >-
              The dated record shows a progression from a 2022 founding and 2025 Series A+ financing into a denser 2026
              product and capital cycle. China introduced a national humanoid and embodied-intelligence standards system
              in March; TrendForce then identified two other vendors as the likely shipment leaders. LimX launched Luna
