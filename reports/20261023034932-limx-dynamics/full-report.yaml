figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Reported milestones trace LimX from founding and legged-robot development toward full-size humanoid products and
      major 2026 financing.
    data:
      items:
        - date: '2022'
          label: Company founded
          details: Humanoid.Guide reports LimX Dynamics was founded in 2022.
          tone: neutral
          claimRefs:
            - CO009
        - date: '2025-03-10'
          label: Series A+ financing reported
          details: Gasgoo reported that the round brought total Series A funding to 500 million yuan within six months.
          tone: neutral
          claimRefs:
            - CO004
        - date: '2026-03-03'
          label: National standards context
          details: The Diplomat reported China's first national standard system for humanoid robots and embodied intelligence.
          tone: positive
          claimRefs:
            - CO010
        - date: '2026-04-09'
          label: Competitive benchmark published
          details: TrendForce projected Unitree and AgiBot would account for nearly 80% of 2026 shipments.
          tone: risk
          claimRefs:
            - CO015
        - date: '2026-05-26'
          label: Luna launch
          details: The official site lists the launch of the full-size Luna humanoid.
          tone: positive
          claimRefs:
            - CO011
        - date: '2026-05-30'
          label: Tokyo summit coverage
          details: Associated Press coverage identified LimX among Chinese newcomers at the Tokyo Humanoids Summit.
          tone: neutral
          claimRefs:
            - CO014
