      - number: '3.2'
        title: Differentiation, capability, and positioning
        blocks:
          - type: paragraph
            body: >-
              LimX's strongest documented differentiation is platform breadth rather than proven task economics. COSA
              and TRON 2 combine a robot operating layer with configurable bodies, while the Oli listing describes an
              open SDK, ROS compatibility, and support for Isaac Sim, MuJoCo, and Gazebo. These interfaces can reduce
              developer onboarding friction and permit buyers to retain more application-layer control. They may also
              make multi-homing easier, weakening hardware lock-in unless LimX accumulates proprietary deployment data
              or superior support. The positioning map therefore scores LimX high on platform openness but low on
              externally documented deployment proof. Scores are ordinal evidence syntheses, not performance
              measurements, and no assigned source supplies a controlled head-to-head benchmark for autonomy, dexterity,
              safety, or uptime.
