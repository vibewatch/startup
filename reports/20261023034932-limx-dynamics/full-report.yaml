      - number: '3.3'
        title: Pricing, packaging, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Public price transparency favors Unitree. The reviewed 2026 guide reports manufacturer-listed Unitree
              configurations from $4,900 for R1 AIR to $13,500 for G1, while describing higher-end H1 and H2 pages as
              contact-sales rather than transactable prices. A separate third-party database lists the older LimX CL-1
              at $40,000, labels it a prototype, and marks the record unverified; that is neither an Oli quote nor
              evidence of realized selling price. Figure, Apptronik, and Agility likewise lack a comparable published
              purchase price in the assigned evidence. LimX's current pricing, discounts, support terms, lead times,
              integration fees, and channel economics therefore remain material procurement gaps rather than inputs that
              can be estimated reliably from public listings.
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              LimX has credible ingredients for differentiation: self-developed motion control, modular hardware, broad
              simulation compatibility, and a 2026 release cadence spanning COSA, Luna, FluxVLA, and application
              demonstrations. Its $200 million Series B also increases capacity to invest, but funding raised is not
              installed-base evidence or cash available. The adverse case is that Chinese supply-chain density and fast
              prototyping compress hardware differentiation while Unitree and AgiBot establish volume, price, and
              developer mindshare. RoboHorizon separately frames the unresolved challenge as moving from controlled
              demonstrations to reliable 24/7 industrial work. Without independent task-completion, intervention-rate,
              safety, and total-cost data, LimX's moat is best treated as promising motion and platform IP whose
              durability remains unproven against lower-priced Chinese volume vendors and workflow-specific Western
              deployments.
            claimRefs:
              - CP004
              - CP006
              - CP008
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Deployment proof is the gating competitive gap
            body: >-
              Product demos, funding, and open interfaces do not establish eight-hour-shift reliability or lower total
              cost; require matched-task evidence before crediting a moat.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              LimX appears to monetize a portfolio of embodied-AI hardware, software, and related services rather than a
              disclosed recurring SaaS stream. Preqin describes revenue from embodied-AI and legged-robot products and
              services for industrial inspection, intelligent manufacturing, logistics, and both B2B and B2C use cases,
              while company-linked coverage describes TRON 2 orders from developers, research institutions, and
              enterprises and thousands of orders across product lines. Those signals establish commercial activity, but
              they do not establish recognized revenue, recurring software revenue, or realized gross profit. A
              third-party directory displays USD 40,000 for the CL-1 but marks the product as a prototype and not
              verified, while a reseller lists USD 3,500 in freight and customs duties for Oli without a base price.
              These weak pricing signals cannot establish realized price or revenue mix across robot sales, integration,
              software, and service.
