      - number: '1.3'
        title: Funding, valuation, and disclosure profile
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a company-announced US$200 million pre-IPO financing in July 2026, but not one
              reconciled lifetime total. Gasgoo reported in March 2025 that Series A funding had reached 500 million
              yuan within six months and named strategic and financial participants. RobotAIGeek later reported a US$2.2
              billion valuation and about US$400 million raised during 2026, while Robotico displays US$296 million
              raised without a period or methodology. Those totals conflict rather than corroborate one another. They
              may use different dates, currencies, instruments, or inclusion rules. Financing raised is not cash
              available, and no retained source establishes revenue, ARR, gross margin, burn, runway, customer count, or
              headcount.
