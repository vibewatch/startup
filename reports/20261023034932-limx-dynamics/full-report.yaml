  - id: FE001
    title: LimX product architecture map
    type: stack
    summary: >-
      Public materials describe a reusable path from robot hardware and low-level control through simulation and skills
      to embodied-agent orchestration.
    data:
      layers:
        - label: Cognition and orchestration
          modules:
            - label: COSA agent layer
              detail: Natural-language instruction, memory, planning, and task decomposition are described in launch coverage.
            - label: Task editor and interaction
              detail: Luna Studio is described as a no-code task and motion orchestration surface.
        - label: Skills and perception
          modules:
            - label: VLA and manipulation
              detail: Public repositories include VLA, manipulation, and visual-grasp projects.
            - label: Navigation and retargeting
              detail: Public repositories include navigation stacks and human-motion retargeting.
        - label: Simulation and training
          modules:
            - label: MuJoCo and Isaac Lab
              detail: Simulation and reinforcement-learning repositories support TRON, Oli, and Luna.
            - label: Sim-to-real deployment
              detail: ONNX, ROS, and SDK deployment paths are exposed in public repositories.
        - label: Hardware and control
          modules:
            - label: Robot platforms
              detail: TRON 2, Oli, and Luna are the named public platforms.
            - label: LimX SDK
              detail: The low-level SDK is described as the communication and real-time-control layer.
        - label: Safety and operations
          modules:
            - label: Emergency controls
              detail: Luna launch material describes force detection, fall mitigation, action override, and emergency stops.
        - label: Documentation and support
          modules:
            - label: Manuals and SDK guides
              detail: The documentation center lists product manuals and SDK development guides.
    approximationNotes: >-
      Conceptual synthesis of public product, documentation, repository, and launch descriptions; it is not a disclosed
      reference architecture.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE009
