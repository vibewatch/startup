      - number: '4.2'
        title: Unit economics and cost structure
        blocks:
          - type: paragraph
            body: >-
              The economic engine is likely shaped by sensor, actuator, compute, mechanical, assembly, integration,
              maintenance, and safety costs, but LimX has not publicly disclosed a bill of materials, manufacturing
              yield, realized gross margin, warranty burden, service utilization, or customer payback. The external 2026
              industry analysis gives directional context rather than LimX-specific measurement: reported humanoid
              hardware costs range from approximately $50,000 to $200,000, while deployment economics also absorb
              engineering integration, safety controls, maintenance, downtime, and fleet-management overhead. That
              evidence supports a capital-intensive hardware underwriting lens, not a company-specific margin estimate.
              LimX’s modular architecture could improve hardware reuse and reduce customization, but the claim remains
              strategic positioning until customer-level deployment costs and repeatable utilization are disclosed.
            claimRefs:
              - CI005
              - CI006
              - CI007
