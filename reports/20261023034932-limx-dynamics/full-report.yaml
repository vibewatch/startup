  - id: FP001
    title: Competitive positioning by deployment proof and platform openness
    type: quadrant
    summary: >-
      LimX screens as an open, broad development platform but has less externally documented deployment proof than
      workflow-focused US peers and less volume evidence than Unitree or AgiBot.
    data:
      xAxis:
        label: External deployment evidence (1 = limited, 5 = strongest in this set)
        min: 1
        max: 5
      yAxis:
        label: Platform openness and form-factor breadth (1 = narrow, 5 = broad)
        min: 1
        max: 5
      points:
        - label: LimX Dynamics
          x: 1
          'y': 5
          detail: >-
            Open SDK and simulation stack across multiple legged forms; scaled independent deployment evidence is
            missing.
        - label: Unitree
          x: 3
          'y': 4
          detail: High reported shipments and developer SDK, but named production outcomes are limited in the assigned pool.
        - label: AgiBot
          x: 3
          'y': 4
          detail: High reported volume and open-source strategy; comparable pricing and reliability evidence are missing.
        - label: Figure AI
          x: 4
          'y': 2
          detail: Named BMW factory deployment with a proprietary AI stack and undisclosed purchase price.
        - label: Apptronik
          x: 3
          'y': 2
          detail: Named Mercedes-Benz and GXO pilots, focused on logistics and manufacturing.
        - label: Agility Robotics
          x: 5
          'y': 1
          detail: Named Amazon deployment and a narrow warehouse workflow orientation.
    approximationNotes: >-
      Analyst-authored ordinal scores from assigned source descriptions; they are not measured performance,
      market-share, reliability, or customer-satisfaction values.
