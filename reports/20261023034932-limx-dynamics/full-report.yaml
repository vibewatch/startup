          detail: Paid repeat deployments and unit economics required
        - id: terms
          label: Price and terms gate
          detail: Cap table, preferences, cash, and audited metrics required
        - id: downside
          label: Downside screen
          detail: Reliability, cost, hype, and multiple-compression risk
        - id: recommendation
          label: Track
          detail: Reassess only when both gates close
      edges:
