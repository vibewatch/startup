              - CM006
              - CM008
              - CM014
          - type: callout
            title: Effective output is the adoption gate
            body: >-
              Falling hardware prices improve the theoretical economics, but the reviewed evidence repeatedly conditions
              ROI on utilization, task continuity, integration quality, reliability, and productive output.
            calloutType: risk
            claimRefs:
