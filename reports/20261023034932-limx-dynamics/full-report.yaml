      - number: '4.3'
        title: Capital adequacy and financial diligence verdict
        blocks:
          - type: paragraph
            body: >-
              LimX has recently raised substantial capital and says the funds will expand manufacturing and delivery
              capacity, global supply-chain capabilities, and international market presence. The official July 2026
              release confirms a US$200 million pre-IPO round and planned use, while independent coverage reports the
              same round and describes thousands of customer orders and international delivery. Other coverage reports
              approximately US$400 million raised over six months, and a prior Series A report records RMB500 million of
              Series A funding; these are financing announcements, not cash-on-hand or available liquidity. No assigned
              source reports cash, burn, debt, covenants, runway, next-round trigger, or audited revenue. The financial
              verdict is therefore positive on financing access and commercial intent but cautious on revenue quality,
              margin path, and capital sufficiency: scaling manufacturing before disclosed unit economics creates a
              material financing dependency.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Underwriting gaps and scenario boundaries
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a scenario framework, not a point valuation model. A base case can treat robot
              orders as non-recurring hardware demand with uncertain conversion to delivered revenue, while an upside
              case would require repeatable deployments, software attach, improving utilization, and falling unit cost;
              a downside case would include delayed autonomy, integration overruns, lower-than-expected production
              yields, or a new financing need before operating cash flow turns positive. The adverse industry evidence
              says current humanoid deployments remain task-constrained and that broad autonomy lags the marketing
              narrative, which directly challenges assumptions about rapid, high-margin scale. Management should provide
              monthly bookings-to-cash reconciliation, delivered-unit cohorts, realized ASP and discounting,
              gross-margin bridge, cash and restricted cash, burn, debt obligations, inventory, warranty provisions,
              customer concentration, and runway under production ramp scenarios.
            claimRefs:
              - CI005
              - CI006
              - CI012
              - CI013
              - CI014
