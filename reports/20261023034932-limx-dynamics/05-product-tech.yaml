company:
  name: LimX Dynamics
chapter:
  number: 5
  title: Product & Technology
  summary: LimX Dynamics presents a family of modular legged and humanoid robots tied together by simulation, reinforcement-learning, and an embodied-agent software stack. Public evidence is strongest on product surfaces and developer tooling; commercial reliability, independent benchmarks, and deployment security remain unresolved.
sections:
  - id: product-portfolio
    title: Product portfolio and buyer workflow
    body: "LimX Dynamics' public portfolio spans the TRON 2 multi-form robot, the Oli full-size general-purpose humanoid, and Luna, a full-size interactive humanoid. The portfolio serves different workflows rather than one homogeneous SKU: TRON 2 is positioned for research and manipulation, Oli for general-purpose embodied-AI development, and Luna for interactive commercial experiences. The company's GitHub profile exposes robot descriptions, simulation, training, deployment, navigation, manipulation, and SDK repositories, which gives developers a concrete path from model files and simulation to deployment. Third-party product material describes Oli as a 165 cm, 31-DoF platform with open SDK and ROS-compatible software, while the TRON 2 listing describes a three-mode design, arm payload and research pricing. These are product descriptions, not independent proof of production maturity or realized customer outcomes."
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-operating-model
    title: Architecture and operating model
    body: "The clearest public architecture is a layered control-and-agent stack. LimX's repositories show a simulation-to-real workflow built around MuJoCo, Isaac Lab, ROS integrations, ONNX deployment, and a low-level SDK. COSA descriptions add a three-layer conceptual architecture: whole-body motion control at the foundation, skill and perception capabilities in the middle, and cognition, memory, world-modeling, and task planning at the top. The public GitHub surface also lists VLA, motion-retargeting, navigation, and manipulation projects, suggesting an effort to make data collection, policy training, and deployment reusable across robot families. An arXiv paper on passive-body locomotion supports the general technical relevance of body dynamics and reinforcement learning, but it does not establish that LimX uses that exact method in a released product. The architecture is therefore specific enough to map dependencies, but not enough to verify fleet-level performance."
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-trust-gaps
    title: Maturity, safety, and technical risks
    body: Public maturity signals are mixed. The documentation center lists current manuals and SDK guides for TRON 2, Luna, Oli, and FluxVLA, while the TRON 2 product page labels its stage as pilot delivery. Luna's official launch describes four-hour battery life, external power, force detection, fall mitigation, action override, and multi-device emergency stops, but these remain company-reported specifications and operating claims. RobotHub separately lists safety-boundary protection and a redundant-power behavior for TRON 2, without publishing a validation protocol. Independent coverage of COSA treats a continuous household demo as proof of possibility rather than a reliability statistic and notes that success rates and trial counts were not published. Proposed U.S. scrutiny of adversary-produced robots is a sector-level deployment risk, not evidence of a LimX incident. Buyers therefore need failure-rate, safety-validation, cybersecurity, update-governance, regulatory, supply-continuity, and production-deployment evidence before treating the stack as enterprise-ready.
    claimRefs: [CE009, CE010, CE011, CE012, CE013, CE014, CE015]
