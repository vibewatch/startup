      - [Oli, "Researchers, developers, and integrators", "Commercial platform description", "Full-size biped with open SDK, ROS compatibility, and simulation support", "Verify production deployments, failure rates, and task success outside demos"]
      - [Luna, "Retail, events, showrooms, and experiential venues", "Global pre-orders announced", "Interactive humanoid with no-code task editing and multi-robot synchronization", "Verify delivered units, service model, and public-space safety validation"]
      - [LimX COSA, "Humanoid application developers and operators", "Announced operating-system layer", "Three-layer cognition, skills, and whole-body control concept", "Obtain technical report, interfaces, model provenance, and trial statistics"]
    notes: "Status and differentiation combine company materials with third-party descriptions; nulls would mean no public evidence, not that the capability is absent."
    claimRefs: [CE001, CE002, CE003, CE006, CE011]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Train locomotion", "Develop policy in simulation, then deploy to robot", "MuJoCo or Isaac Lab plus LimX SDK and deployment repositories", "Shorter simulation-to-real path is the stated design goal", "No independent transfer-rate benchmark"]
      - ["Develop manipulation", "Collect data, train VLA or motion policies, test on hardware", "TRON 2 VLA tooling, manipulation repositories, and arm interfaces", "Reusable examples and interfaces", "Task success and dataset quality are not independently reported"]
      - ["Operate interactive venue", "Program repeated performances and respond to visitors", "Luna Studio, motion learning, multimodal interaction, synchronized control", "Up to 200-unit synchronization is company-reported", "Crowd-safety and sustained duty-cycle evidence is unavailable"]
      - ["Execute household task", "Interpret instruction, plan, navigate, and manipulate", "COSA agent layer on Oli", "Continuous demo of a chore sequence is reported", "No published success-rate denominator or trial count"]
    notes: "Benefits are framed as stated or observable workflow features; they are not verified ROI or reliability outcomes."
    claimRefs: [CE005, CE006, CE008, CE010, CE011]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Robot hardware", "Actuators, sensors, body mechanics, and end effectors", "Robot-specific mechanical and electrical supply chain", "Reliability, serviceability, and component continuity are not public"]
      - ["Low-level control", "Motor and sensor communication plus real-time control", "LimX SDK, robot runtime, and ROS or direct interfaces", "Safety boundaries and update controls need validation"]
      - ["Simulation and training", "Model-based simulation and reinforcement-learning policy development", "MuJoCo, Isaac Lab, Gazebo, ONNX, and training data", "Sim-to-real mismatch and dataset coverage"]
      - ["Skills and perception", "Navigation, manipulation, VLA, and motion retargeting", "Sensors, policy models, and task-specific data", "Generalization and failure recovery are unverified"]
      - ["Cognition and orchestration", "Natural-language interpretation, memory, planning, and task decomposition", "COSA agent layer and world-model or memory components", "Latency, hallucination, privacy, and operator override"]
      - ["Operations and safety", "Monitoring, emergency stops, thermal management, and deployment support", "Hardware interlocks, app controls, manuals, and service processes", "Independent certification, incident history, and cybersecurity evidence"]
    notes: "This is an analytical dependency map grounded in public interfaces and product descriptions; it does not certify implementation completeness."
    claimRefs: [CE005, CE006, CE007, CE009, CE010, CE012]
