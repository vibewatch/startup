callouts:
  - calloutType: strength
    title: Reusable developer surface
    body: Public repositories and documentation expose a coherent simulation, training, SDK, and deployment path across several robot families.
    claimRefs: [CE005, CE009]
  - calloutType: risk
    title: Demonstration-to-reliability gap
    body: Public materials show capabilities and safety features, but independent success-rate, incident, cybersecurity, and production-deployment evidence is still limited.
    claimRefs: [CE011, CE013, CE015]
  - calloutType: recommendation
    title: Underwrite deployment evidence before platform breadth
    body: The portfolio and developer surface are credible product signals, but investment confidence should depend on independent reliability, safety, security, and production-deployment evidence rather than demonstrations or feature lists.
    claimRefs: [CE011, CE012]
