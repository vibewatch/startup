callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: Treat an uncontained safety or security incident, a market-access restriction in a target jurisdiction, or failure to evidence paid production deployments and liquidity as thesis-break events rather than ordinary execution noise.
    claimRefs: [CR003, CR007, CR009, CR013]
  - calloutType: assumption
    title: Evidence boundary
    body: The assigned pool supports policy, product, financing, and competitive-context risks; it does not support a conclusion that LimX has suffered a specific breach, recall, litigation event, or customer failure.
    claimRefs: [CR002, CR007, CR013]
