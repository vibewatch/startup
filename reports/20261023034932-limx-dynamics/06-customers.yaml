schemaVersion: "report-v2"
artifact: customers
slug: limx-dynamics
runDate: 2026-10-23
company:
  name: LimX Dynamics
chapter:
  number: 6
  title: Customers
  summary: Public evidence shows LimX has a developer/research-oriented product line, reported cumulative orders in the thousands, and an overseas expansion thesis. The evidence does not establish active customer count, retention, production deployment, or customer-level outcomes, so adoption quality remains materially unverified.
sections:
  - id: segments-and-buyers
    title: Buyer and user segments
    body: "LimX positions its products across research, manufacturing, commercial services, inspection, construction, and household applications rather than around a single vertical. The official company page names B2B and B2C sectors including R&D, manufacturing, business, and household services, while the 36Kr report identifies scientific research and education, commercial services, all-terrain inspection, industrial applications, and construction as deployment scenarios. This points to a platform-selling motion: researchers and developers can buy or integrate a robot, while industrial and service operators are the eventual task owners. The buyer, payer, and end user are therefore not necessarily the same party. Public materials do not disclose segment revenue, contract sizes, procurement cycles, or the share of sales from each use case. The commercial opportunity is broad, but breadth also increases implementation and support requirements."
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption and commercialization trajectory
    body: "The strongest adoption signal is volume and delivery language, not disclosed recurring usage. 36Kr reports that LimX has secured thousands of orders in total, with over half from overseas markets, and says Luna batch deliveries to domestic and international customers were completed less than a month after launch. WebProNews separately reports that Oli began delivering months before January 2026 and describes a plan for several thousand Middle East units for research, development, and service trials. These are meaningful commercialization indicators, but the sources do not define whether orders are paid, shipped, active, or repeat purchases. The 18-robot autonomous egress demonstration shows a deployment workflow, not a customer outcome. No public source in the assigned pool provides active accounts, utilization, renewal, churn, NRR, GRR, cohort retention, or customer satisfaction."
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU015, CU016]
    tableRefs: [TU002]
  - id: proof-retention-and-expansion
    title: Named proof, durability, and expansion risk
    body: "Named customer proof is thin in the retained evidence. The sources identify investor and ecosystem relationships, including Alibaba, JD.com, SAIC Motor, NIO Capital, and global developers, but those relationships do not by themselves prove a production deployment or recurring revenue. The public product pages emphasize open SDKs, ROS compatibility, simulation environments, and customization, which may reduce integration friction for developer and research buyers; they do not document a customer's realized productivity, safety, uptime, or payback. LimX's stated overseas strategy relies on local partnerships and trial deployments, particularly in the Middle East, while the report does not identify a named end customer or published trial result. Accordingly, expansion potential is plausible but unproven, and concentration, channel dependence, and renewal risk cannot be quantified from public evidence."
    claimRefs: [CU010, CU011, CU012, CU013]
    tableRefs: [TU003]
    figureRefs: [FU001]
tables:
  - id: TU001
    title: Customer segmentation and buying motion
    columns: [Segment, Buyer or user, Product/use case, Evidence and gap]
    rows:
      - ["Research and education", "Research institutions and developers", "Oli/CL-1/TRON platforms for embodied-AI experimentation", "Open SDK, ROS-compatible stack, and simulation support are described; paid-account count and usage are undisclosed."]
      - ["Industrial and inspection", "Industrial operators and integrators", "Locomotion, manipulation, inspection, and construction tasks", "36Kr lists these scenarios; no named production customer or measured outcome is supplied."]
      - ["Commercial and household services", "Service operators or household buyers", "Full-size interactive and general-purpose humanoids", "Official positioning includes business and household services; deployment economics and support requirements are unknown."]
      - ["International expansion", "Local partners and overseas R&D/service users", "Oli deliveries and planned Middle East trials", "Partnership-led expansion is reported; named end customers and conversion from trials are not disclosed."]
    notes: "Segments are reconstructed from official positioning and external reporting, not a disclosed customer or revenue segmentation. Buyer, payer, and user may differ; null outcomes indicate missing public evidence."
    claimRefs: [CU001, CU002, CU003, CU007]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Date or period, Confidence, Implication, Missing denominator]
    rows:
      - [Cumulative orders, "Thousands of orders", "Reported in 2026", medium, "Indicates commercial demand beyond a single prototype sale", "Orders versus paid shipments, active deployments, and repeat orders"]
      - [Overseas order share, ">50% of cumulative orders", "Reported in 2026", medium, "Suggests international demand is strategically important", "Exact order base, geography, and revenue contribution"]
      - [Luna delivery timing, "Batch deliveries to domestic and international customers", "Less than one month after May 2026 launch", medium, "Signals manufacturing and delivery execution", "Customer names, units, acceptance criteria, and operating outcomes"]
      - [Middle East plan, "Several thousand robots targeted for R&D/service trials", "Starting in 2026", low, "Creates a route to global reference deployments", "Committed purchase orders, delivery status, and trial-to-production conversion"]
    notes: "Values are reported claims from external sources and are not independently audited. The table separates order volume, geographic mix, deliveries, and forward trial plans; they are not interchangeable adoption measures."
    claimRefs: [CU005, CU006, CU007, CU015, CU016]
  - id: TU003
    title: Named customer proof table
    columns: [Named relationship or proof point, Segment, Deployment or use case, Production versus pilot, Outcome, Limitation]
    rows:
      - [Global developers and ecosystem partners, Research/developer, Open development and embodied-AI toolchain collaboration, "Not specified", "No customer outcome reported", "36Kr does not name the developers or disclose contracts."]
      - [Middle East local partners, Commercial/service, Planned R&D and service trials for Oli, Pilot/trial planned, "Case studies intended but not yet reported", "WebProNews says the investor and partners were not fully named."]
      - [Domestic and international Luna customers, Research/industrial/service, Batch deliveries after product launch, Production delivery claimed, "No uptime, task, or ROI metric reported", "Customer identities and acceptance evidence are absent."]
    notes: "Enumeration is partial: the assigned sources do not provide a complete customer list. Relationships, deliveries, and planned trials are kept separate from verified production outcomes; rows are supported by the related claims and their source set."
    enumerationScope:
      coverage: partial
      basis: "Publicly named or described relationships and deployment signals available in the assigned 2026 source pool"
    claimRefs: [CU006, CU007, CU010, CU011, CU012, CU016]
figures:
  - id: FU001
    title: Customer journey from platform access to repeatable deployment
    type: journey-map
    summary: LimX's public customer path moves from developer access and initial delivery toward trials and production references, with the final adoption and retention stages still unverified.
    data:
      nodes:
        - id: research
          label: Research / developer access
          title: Research / developer access
          description: "Open SDK, ROS compatibility, and simulation support lower the entry point for experimentation."
          touchpoints: [Oli platform, CL-1/TRON research use, simulation]
        - id: integration
          label: Integration
          title: Integration and customization
          description: "Open interfaces and simulation environments support secondary development, but implementation effort is not quantified."
          touchpoints: [SDK, ROS, simulation, custom end-effectors]
        - id: delivery
          label: Initial delivery
          title: Initial delivery
          description: "External reporting describes cumulative orders and Luna batch deliveries."
          touchpoints: [Orders, domestic and international delivery]
        - id: trial
          label: Trial deployment
          title: Trial deployment
          description: "The reported Middle East plan targets research, development, and service trials."
          touchpoints: [Local partnerships, R&D, service trials]
        - id: reference
          label: Reference case
          title: Reference case and outcome
          description: "A repeatable reference requires independently verifiable task, uptime, safety, and payback evidence."
          touchpoints: [Customer KPI, site reference, acceptance evidence]
        - id: production
          label: Repeatable production use
          title: Repeatable production use
          description: "No retained source verifies named production customers, measured outcomes, or renewals."
          touchpoints: [Production deployment, utilization, renewal]
    claimRefs: [CU003, CU005, CU007, CU010, CU013, CU016]
callouts:
  - calloutType: insight
    title: Demand signal is ahead of retention proof
    body: "Reported orders, deliveries, and overseas plans support a commercial-demand signal, but the assigned evidence does not establish active usage, customer outcomes, or repeat purchasing."
    claimRefs: [CU005, CU006, CU007, CU009, CU015, CU016]
  - calloutType: risk
    title: Customer-quality gap
    body: "The key diligence gap is not whether LimX can name markets; it is whether shipped or ordered robots become reliable, paid, repeatable production deployments with measurable customer value."
    claimRefs: [CU010, CU011, CU012, CU013]
