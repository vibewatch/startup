callouts:
  - calloutType: strength
    title: Financing access supports scale investment
    body: The July 2026 pre-IPO round gives LimX disclosed capital earmarked for manufacturing, delivery, supply-chain, and international expansion, reducing near-term dependence on a single product launch.
    claimRefs: [CI009, CI010]
  - calloutType: risk
    title: Capital raised is not cash runway
    body: Public financing announcements do not establish cash on hand, burn, debt, runway, or the amount still available after investment and operating spend; these remain material underwriting blockers.
    claimRefs: [CI012, CI013, CI014]
  - calloutType: recommendation
    title: Underwrite only after cohort economics are disclosed
    body: A financing-backed order narrative should not be converted into a revenue or margin forecast until LimX provides delivered-unit cohorts, realized pricing, gross-margin evidence, and cash-flow forecasts.
    claimRefs: [CI002, CI005, CI012, CI013]
