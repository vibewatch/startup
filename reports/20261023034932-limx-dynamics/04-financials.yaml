chapter:
  number: 4
  title: Financials
  summary: LimX has a hardware-led embodied-AI revenue model with public evidence of product orders and substantial recent financing, but no public audited revenue, realized pricing, gross margin, burn, cash balance, or runway. The financing supports manufacturing and international expansion, while constrained deployment economics and limited operating disclosure keep underwriting confidence low.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: LimX appears to monetize a portfolio of embodied-AI hardware, software, and related services rather than a disclosed recurring SaaS stream. Preqin describes revenue from embodied-AI and legged-robot products and services for industrial inspection, intelligent manufacturing, logistics, and both B2B and B2C use cases, while company-linked coverage describes TRON 2 orders from developers, research institutions, and enterprises and thousands of orders across product lines. Those signals establish commercial activity, but they do not establish recognized revenue, recurring software revenue, or realized gross profit. A third-party directory displays USD 40,000 for the CL-1 but marks the product as a prototype and not verified, while a reseller lists USD 3,500 in freight and customs duties for Oli without a base price. These weak pricing signals cannot establish realized price or revenue mix across robot sales, integration, software, and service.
    claimRefs: [CI001, CI002, CI003, CI004, CI015, CI016]
    tableRefs: [TI001, TI002]
  - id: unit-economics
    title: Unit economics and cost structure
    body: >-
      The economic engine is likely shaped by sensor, actuator, compute, mechanical, assembly, integration, maintenance, and safety costs, but LimX has not publicly disclosed a bill of materials, manufacturing yield, realized gross margin, warranty burden, service utilization, or customer payback. The external 2026 industry analysis gives directional context rather than LimX-specific measurement: reported humanoid hardware costs range from approximately $50,000 to $200,000, while deployment economics also absorb engineering integration, safety controls, maintenance, downtime, and fleet-management overhead. That evidence supports a capital-intensive hardware underwriting lens, not a company-specific margin estimate. LimX’s modular architecture could improve hardware reuse and reduce customization, but the claim remains strategic positioning until customer-level deployment costs and repeatable utilization are disclosed.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and financial diligence verdict
    body: >-
      LimX has recently raised substantial capital and says the funds will expand manufacturing and delivery capacity, global supply-chain capabilities, and international market presence. The official July 2026 release confirms a US$200 million pre-IPO round and planned use, while independent coverage reports the same round and describes thousands of customer orders and international delivery. Other coverage reports approximately US$400 million raised over six months, and a prior Series A report records RMB500 million of Series A funding; these are financing announcements, not cash-on-hand or available liquidity. No assigned source reports cash, burn, debt, covenants, runway, next-round trigger, or audited revenue. The financial verdict is therefore positive on financing access and commercial intent but cautious on revenue quality, margin path, and capital sufficiency: scaling manufacturing before disclosed unit economics creates a material financing dependency.
    claimRefs: [CI009, CI010, CI011, CI012, CI013, CI014]
    tableRefs: []
  - id: diligence-gaps
    title: Underwriting gaps and scenario boundaries
    body: Public evidence supports a scenario framework, not a point valuation model. A base case can treat robot orders as non-recurring hardware demand with uncertain conversion to delivered revenue, while an upside case would require repeatable deployments, software attach, improving utilization, and falling unit cost; a downside case would include delayed autonomy, integration overruns, lower-than-expected production yields, or a new financing need before operating cash flow turns positive. The adverse industry evidence says current humanoid deployments remain task-constrained and that broad autonomy lags the marketing narrative, which directly challenges assumptions about rapid, high-margin scale. Management should provide monthly bookings-to-cash reconciliation, delivered-unit cohorts, realized ASP and discounting, gross-margin bridge, cash and restricted cash, burn, debt obligations, inventory, warranty provisions, customer concentration, and runway under production ramp scenarios.
    claimRefs: [CI005, CI006, CI012, CI013, CI014]
