    notes: "The USD 40,000 robot display is explicitly unverified and USD 3,500 is a reseller-listed freight/customs charge; neither establishes realized LimX pricing, while nulls mean unavailable evidence rather than zero."
    claimRefs: [CI004, CI015, CI016]
  - id: TI003
    title: Unit-economics underwriting inputs
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [Average selling price, null, low, "Determines revenue per delivered robot and payback", "Provide realized ASP by product, geography, and cohort"]
      - [Gross margin, null, low, "Tests whether hardware growth can fund service and R&D", "Provide audited gross-margin bridge by product and period"]
      - [Customer payback period, null, low, "Separates pilot interest from economically repeatable deployment", "Provide customer ROI cases with labor baseline and uptime"]
      - [Manufacturing cost per unit, null, low, "Measures scale benefit and financing need during ramp", "Provide BOM, labor, yield, warranty, and contract-manufacturing terms"]
      - [Maintenance and service cost, null, low, "Reduces effective contribution margin and utilization", "Provide support hours, spare-parts cost, and warranty claims"]
      - [Cash burn and runway, null, low, "Determines whether another round is required before scale", "Provide monthly cash flow, cash balance, debt, and scenario runway"]
    notes: "LimX-specific values are not publicly disclosed in the assigned sources; directional industry cost figures are not substituted for company metrics."
    claimRefs: [CI005, CI006, CI007, CI008, CI013, CI014]
