      - Qualification or unknown
      - Procurement implication
    rows:
      - [LimX Dynamics, "US$40,000 third-party CL-1 listing", "Prototype humanoid record", "Listing is unverified and does not quote current Oli, support, or integration", "Request a dated configuration-level quote and total-cost schedule"]
      - [Unitree, "R1 AIR US$4,900; R1 US$5,900; R1 EDU US$10,500; G1 US$13,500", "Hardware tiers with secondary development limited to EDU on R1 line", "H1/H2 pages route to sales; taxes, service, and integration may differ", "Creates a low public anchor for research and pilot procurement"]
      - [1X, "US$20,000 upfront or US$499 monthly", "NEO home robot preorder", "Consumer use case is not directly comparable with industrial Oli", "Shows alternative subscription packaging but not an industrial benchmark"]
      - [Figure AI, "No published purchase price", "Industrial humanoid and software stack", "Contact-sales process; estimates are not treated as price", "Commercial comparison requires a direct quote and deployment assumptions"]
      - [Apptronik, "RaaS described, price not listed", "Apollo for logistics and manufacturing", "No assigned source gives a transactable rate", "Compare on workflow output and support, not unsupported hardware price"]
      - [Agility Robotics, "No published purchase price", "Digit warehouse automation", "US$8,500 monthly appears only as an illustrative investor-model assumption", "Do not treat the assumption as a quoted customer rate"]
    notes: >-
      Prices retain the source's model, date, and qualification; they are list or reported
      signals, not realized prices, equivalent configurations, or evidence of unit economics.
    claimRefs: [CP005, CP009, CP010, CP011, CP012]
figures:
  - id: FP001
    title: Competitive positioning by deployment proof and platform openness
    type: quadrant
    summary: >-
      LimX screens as an open, broad development platform but has less externally documented
      deployment proof than workflow-focused US peers and less volume evidence than Unitree or AgiBot.
    data:
      xAxis:
        label: "External deployment evidence (1 = limited, 5 = strongest in this set)"
        min: 1
        max: 5
      yAxis:
        label: "Platform openness and form-factor breadth (1 = narrow, 5 = broad)"
        min: 1
        max: 5
      points:
        - label: LimX Dynamics
          x: 1
          y: 5
          detail: "Open SDK and simulation stack across multiple legged forms; scaled independent deployment evidence is missing."
        - label: Unitree
          x: 3
          y: 4
          detail: "High reported shipments and developer SDK, but named production outcomes are limited in the assigned pool."
        - label: AgiBot
          x: 3
          y: 4
          detail: "High reported volume and open-source strategy; comparable pricing and reliability evidence are missing."
        - label: Figure AI
          x: 4
          y: 2
          detail: "Named BMW factory deployment with a proprietary AI stack and undisclosed purchase price."
        - label: Apptronik
          x: 3
          y: 2
          detail: "Named Mercedes-Benz and GXO pilots, focused on logistics and manufacturing."
        - label: Agility Robotics
          x: 5
          y: 1
          detail: "Named Amazon deployment and a narrow warehouse workflow orientation."
    approximationNotes: >-
      Analyst-authored ordinal scores from assigned source descriptions; they are not
      measured performance, market-share, reliability, or customer-satisfaction values.
    claimRefs: [CP003, CP008, CP010, CP011, CP012]
callouts:
  - calloutType: risk
    title: Deployment proof is the gating competitive gap
    body: >-
      Product demos, funding, and open interfaces do not establish eight-hour-shift
      reliability or lower total cost; require matched-task evidence before crediting a moat.
    claimRefs: [CP013, CP014]
