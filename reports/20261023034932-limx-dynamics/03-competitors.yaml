      - [Unitree, "Direct Chinese volume peer", "About 5,500 humanoids reported shipped in 2025", "Research, industry, and export buyers", "Low published entry prices, developer SDK, and broad product ladder", "Named production-customer outcomes are thinner than shipment evidence"]
      - [AgiBot, "Direct Chinese volume peer", "5,168 units reported for 2025; 10,000th Expedition A3 reported in March 2026", "Industrial and logistics buyers, initially China-focused", "Production scale and an open-source adoption strategy", "Assigned sources do not provide comparable pricing or reliability data"]
      - [Figure AI, "Direct industrial humanoid peer", "Named BMW factory deployment; purchase price undisclosed", "Automotive manufacturing and logistics", "Helix AI stack and documented factory workflow", "Newer Figure 03 production-scale evidence remains limited"]
      - [Apptronik, "Direct industrial humanoid peer", "About US$935M total funding reported; Mercedes-Benz and GXO pilots", "Logistics and manufacturing", "Industrial reliability focus and partner-led deployments", "Fleet size, uptime, and purchase economics are not disclosed here"]
      - [Agility Robotics, "Workflow-focused humanoid peer", "Amazon deployment and a 10,000-unit annual factory capacity reported", "Warehouse material handling", "Narrow logistics workflow and manufacturing capacity", "Capacity is not equivalent to shipments; purchase price is unpublished"]
      - ["Fixed automation and mobile manipulators", "Incumbent substitute", "Mature installed base; no comparable figure in assigned evidence", "Repetitive factory and warehouse tasks", "Task-specific reliability and established integrator channels", "Less adaptable to stairs, mixed terrain, and changing tasks"]
      - ["Internal build or systems integrator", "Build substitute", "No comparable public scale metric", "Buyers with robotics engineering teams", "Control of application software and choice of base platform", "Integration burden, safety validation, and ongoing support remain with the buyer"]
    notes: >-
      Scale metrics use different periods and denominators; funding is not shipment volume,
      capacity is not output, and unknown values are left undisclosed rather than estimated.
    claimRefs: [CP001, CP006, CP007, CP008, CP010, CP011, CP012, CP013, CP015]
