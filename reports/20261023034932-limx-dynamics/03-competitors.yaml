    claimRefs: [CP001, CP002, CP003, CP005, CP008, CP009, CP010, CP011, CP012, CP013, CP015]
  - id: TP003
    title: Public pricing and packaging comparison
    columns:
      - Vendor or alternative
      - Public price or contract signal
