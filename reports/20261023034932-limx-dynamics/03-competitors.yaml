      - ["Developer openness", "Open SDK, ROS compatibility, and three named simulation environments", "Developer SDK reported", "Open-source strategy reported", "Mixed; several proprietary AI stacks", "Maximum software control, subject to integration effort"]
      - ["Mobility and manipulation", "Multiple legged forms; Oli is reported at 31 DoF with 10 kg arm payload", "Dynamic motion and recovery reported", "Detailed comparable specification not available", "Task-focused dexterity and industrial workflows reported", "Usually optimized for a constrained task or environment"]
