evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: financial-disclosure
    missingEvidence: Audited revenue, ARR, gross margin, cash burn, runway, and current balance-sheet cash.
    whyItMatters: Reported financing and valuation do not establish operating performance or available cash for manufacturing.
    diligencePath: Request audited statements, management accounts, bank-confirmed cash, budget, and post-financing runway model.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete current founder, executive, board, and governance roster.
    whyItMatters: Specialized robotics execution and financing decisions may be exposed to unmeasured key-person dependence.
    diligencePath: Obtain cap table, board composition, executive biographies, retention data, and succession plan under NDA.
