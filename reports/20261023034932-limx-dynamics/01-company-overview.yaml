company:
  name: LimX Dynamics
chapter:
  number: 1
  title: Company Overview
  summary: LimX Dynamics is a Shenzhen embodied-AI robotics company developing legged, bipedal, wheeled-humanoid, and full-size humanoid systems. Current evidence supports a broad product portfolio and substantial 2026 financing activity, while audited financials, governance, customer concentration, and repeat commercial deployment remain undisclosed or incompletely corroborated.
sections:
  - id: identity-and-product-platform
    title: Identity and product platform
    body: LimX Dynamics is a Shenzhen robotics company whose public portfolio spans Luna, Oli, TRON 2, TRON 1, COSA, FluxVLA Engine, DreamActor, and VGM. The mix reaches beyond one humanoid body into legged hardware, motion control, embodied-agent software, and developer tooling. The official website offers products through direct purchase or cooperation prompts, while independent profiles emphasize research and developer adoption; this points to a hardware-and-platform sales model, but the retained evidence does not disclose recurring software, service, or leasing economics. Product breadth is established more clearly than monetization breadth, and performance or autonomy claims remain company- or reseller-issued rather than independently benchmarked.
    claimRefs: [CO001, CO011, CO012]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: "The retained public pages identify LimX as a Shenzhen-headquartered robotics company but do not provide a complete, current roster of founders, executives, directors, or board observers. Product and financing coverage emphasizes technology, investors, and deployment ambitions rather than governance composition. This evidence limitation is material for a capital-intensive hardware company because engineering continuity, supplier relationships, safety accountability, and financing decisions may be concentrated in a small leadership group, yet the degree of dependence cannot be measured here. Named investors should be treated as financing stakeholders rather than directors or controllers unless cap-table and governance records confirm their rights. Founder biographies, the executive roster, board minutes, ownership, and succession planning remain diligence requirements."
    claimRefs: [CO002, CO005]
    tableRefs: [TO002]
  - id: funding-scale-and-disclosure
    title: Funding, valuation, and disclosure profile
    body: The evidence supports a company-announced US$200 million pre-IPO financing in July 2026, but not one reconciled lifetime total. Gasgoo reported in March 2025 that Series A funding had reached 500 million yuan within six months and named strategic and financial participants. RobotAIGeek later reported a US$2.2 billion valuation and about US$400 million raised during 2026, while Robotico displays US$296 million raised without a period or methodology. Those totals conflict rather than corroborate one another. They may use different dates, currencies, instruments, or inclusion rules. Financing raised is not cash available, and no retained source establishes revenue, ARR, gross margin, burn, runway, customer count, or headcount.
    claimRefs: [CO003, CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO003]
  - id: milestones-and-near-term-proof
    title: Milestones and near-term proof points
    body: "The dated record shows a progression from a 2022 founding and 2025 Series A+ financing into a denser 2026 product and capital cycle. China introduced a national humanoid and embodied-intelligence standards system in March; TrendForce then identified two other vendors as the likely shipment leaders. LimX launched Luna in May, appeared in Associated Press coverage of the Tokyo Humanoids Summit, and announced its pre-IPO financing in July. Biped.News reported that Luna deliveries began within a month of launch, but also cautioned that large-scale industrial value remained unproven. Launches, event appearances, and initial deliveries are milestones, not substitutes for repeat orders, uptime, safety certification, production yield, or independently measured task reliability."
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
