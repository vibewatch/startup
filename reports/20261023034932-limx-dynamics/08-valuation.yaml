    rows:
      - [Thesis, "LimX has financing capacity for R&D and expansion", "Audited deployment of proceeds against milestones", "Execution capacity improved"]
      - [Thesis, "Product materials show modular research and development tooling", "Independent usage and reliability benchmarks", "Platform potential, not proven economics"]
      - [Thesis, "A secondary profile claims thousands of orders and overseas demand", "Customer contracts, shipment acceptance, and repeat orders", "Treat as unverified demand signal"]
      - [Anti-thesis, "CL-1 remains marked prototype and not verified by one directory", "Independent production-status verification", "Commercial maturity remains uncertain"]
      - [Anti-thesis, "Sector reporting flags reliability, dexterity, inference, and cost constraints", "Field uptime, task success, service cost, and gross-margin data", "Material scale-up risk"]
      - [Anti-thesis, "Sector capital may be running ahead of commercial evidence", "Revenue quality and durable customer ROI", "Multiple-compression risk"]
    notes: "Company-positioned product descriptions and secondary estimates are not treated as independent customer proof."
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV009, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Probability signal, Downside or upgrade trigger]
    rows:
      - [Bull, "Repeat paid deployments, improving reliability and unit economics, supportive financing terms", "A premium could be considered only against verified revenue and dilution; no range is supportable now", "Requires multiple new primary proofs", "Audited growth, margin, repeat orders, and acceptable preferences"]
      - [Base, "Technical progress and financing access continue while operating disclosure stays limited", "Track without assigning a point valuation or target return", "Best fit with current evidence", "Primary financing and operating documents become available"]
      - [Bear, "Commercialization lags as reliability or cost limits adoption and sector multiples compress", "Down-round, dilution, or preference overhang may impair returns; magnitude is not quantifiable", "Credible sector-warning evidence exists", "Failed pilots, weak repeat orders, or adverse financing terms"]
      - [No-decision, "Reported funding and valuation data remain unreconciled", "Preserve optionality and decline price discovery from secondary estimates", "Current documentation gap", "Signed cap table and valuation notice"]
    notes: "Scenarios are qualitative because the assigned evidence contains no reconciled valuation, audited financial base, cash balance, or cap table."
    claimRefs: [CV003, CV004, CV005, CV010, CV011, CV012, CV013, CV014, CV016]
