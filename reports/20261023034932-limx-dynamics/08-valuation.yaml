  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: valuation-inputs
      missingEvidence: "Audited revenue by product, gross margin, contribution margin, cash balance, monthly burn, runway, and customer-level repeat paid deployments."
      whyItMatters: "Without operating and cash evidence, no defensible valuation multiple, target return, or downside magnitude can be calculated."
      diligencePath: "Obtain audited statements, monthly management accounts, bank-backed cash evidence, bookings-to-revenue bridges, and customer contracts under NDA."
      relatedQuestionRefs: [QV003]
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: "A signed capitalization table and financing documents reconciling cumulative funding, share price, post-money valuation, preferences, debt, and option-pool dilution."
      whyItMatters: "Conflicting secondary totals and undisclosed terms can materially change ownership, preference overhang, and investor return."
      diligencePath: "Request the latest cap table, Series B and any pre-IPO term sheets, shareholder register, debt schedule, option plan, and board approvals."
      relatedQuestionRefs: [QV002, QV007]
    - type: missing-source
      severity: material
      topic: comparables
      missingEvidence: "A matched comparable set with disclosed revenue, margins, shipments, business model, financing terms, and valuation date."
      whyItMatters: "A high private-company valuation in the same sector is context for capital intensity, not a reliable multiple for LimX."
      diligencePath: "Build a dated private-round, public-company, and M&A set normalized for stage, revenue basis, capital structure, and geography."
      relatedQuestionRefs: [QV005]
    - type: private-evidence-only
      severity: material
      topic: exit-readiness
      missingEvidence: "Verified IPO timetable, governance and board composition, regulatory advisers, lock-up terms, shareholder approvals, and secondary liquidity."
      whyItMatters: "Exit timing and realizable proceeds cannot be modeled without ownership, governance, and liquidity terms."
      diligencePath: "Obtain counsel and underwriter status, board materials, filing readiness, shareholder consents, lock-ups, and recent secondary indications."
      relatedQuestionRefs: [QV007]
