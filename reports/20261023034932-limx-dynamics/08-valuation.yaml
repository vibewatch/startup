company:
  name: LimX Dynamics
chapter:
  number: 8
  title: Valuation
  summary: LimX disclosed a US$200 million Series B, but the assigned public evidence does not provide audited operating metrics, cash, cap-table terms, or a reliable current valuation. The defensible recommendation is therefore to track the company and condition any investment decision on primary financing documents and verified commercial economics.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      LimX should be tracked rather than bought on the available public record. The company
      announced a US$200 million Series B and described a credible plan to fund research,
      manufacturing, and global expansion, but financing raised is not revenue, cash
      available, or evidence that an entry price offers an acceptable return. Secondary
      profiles disagree on cumulative funding, and none of the assigned sources supplies a
      signed valuation notice, audited revenue, gross margin, burn, runway, preference stack,
      or dilution schedule. Independent sector reporting also warns that humanoid robotics
      remains exposed to reliability, dexterity, inference, cost, and hype risk. Those gaps
      make a price-insensitive buy call unjustifiable; a verified cap table and repeatable
      paid-deployment economics are prerequisites to underwriting value.
    claimRefs: [CV001, CV003, CV004, CV005, CV007, CV012, CV013, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-comparable-context
    title: Financing and comparable context
    body: >-
      The strongest current financing evidence is LimX's own announcement of a US$200
      million Series B. A third-party supplier profile instead reports approximately US$400
      million of cumulative financing and a roughly RMB15 billion post-money valuation,
      while Robotico's sparse profile reports US$296 million raised. These figures have
      different scopes and unsupported methodologies, so they should not be blended into a
      synthetic total. Figure AI provides a useful ceiling on sector exuberance rather than
      a direct multiple: Sacra reports a US$39 billion post-money valuation after a Series C
      exceeding US$1 billion, but also identifies execution complexity and an unproven
      commercial market as core risks. Different capital structures, product maturity, and
      disclosure quality prevent a mechanical read-across to LimX.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV010, CV011]
  - id: thesis-and-commercial-proof
    title: Thesis, anti-thesis, and commercialization proof
    body: >-
      The thesis is that LimX can turn a locomotion-led hardware base, modular products, and
      an embodied-AI stack into a reusable platform for research and eventual industrial
      deployment. Product pages show accessible research tooling and a broad set of intended
      uses, while one secondary profile claims thousands of orders with more than half from
      overseas. The anti-thesis is that these statements do not establish paid production
      deployments, retention, utilization, safety, service cost, or gross margin. A separate
      directory still labels CL-1 a prototype and "Not verified," and a reseller's product
      description is company-positioned marketing rather than independent deployment proof.
      Commercial value therefore remains the decisive diligence variable, not the breadth of
      demonstrations or the amount of capital raised.
    claimRefs: [CV006, CV007, CV008, CV009, CV011, CV013, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-exit-readiness
    title: Scenarios, downside triggers, and exit readiness
    body: >-
      A qualitative scenario framework is more honest than a fabricated valuation range.
      The bull case requires independently verified paid deployments, repeat orders,
      acceptable reliability, improving unit economics, and financing terms that preserve
      upside. The base case is continued technical progress and access to capital without
      enough operating disclosure to support a price conclusion, which preserves a track
      stance. The bear case is delayed commercialization combined with sector multiple
      compression, a down round, or preference terms that subordinate new investors. Exit
      readiness is not established by the assigned evidence: no source provides a verified
      IPO timetable, governance structure, lock-up terms, or secondary liquidity. Those
      items, plus audited financials and customer-level proof, are the immediate diligence
      asks and the conditions for changing the recommendation.
    claimRefs: [CV010, CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
callouts:
  - calloutType: recommendation
    title: "Recommendation: track"
    body: Do not underwrite a buy or precise entry valuation until primary financing terms, audited operating metrics, and repeat paid deployments are verified.
    claimRefs: [CV005, CV014, CV015]
  - calloutType: risk
    title: Funding does not establish fair value
    body: The US$200 million Series B demonstrates financing access, but the evidence does not establish cash available, revenue, profitability, or investor return.
    claimRefs: [CV001, CV014]
