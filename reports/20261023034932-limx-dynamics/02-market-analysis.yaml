      - ["Automotive manufacturing", "Plant automation or operations executive", "Production and maintenance teams", "Automation capex and operations", "Standardized repetitive tasks with measurable uptime and output"]
      - ["Logistics and distribution", "Warehouse or 3PL operations executive", "Warehouse operators and integrators", "Site automation budget", "Labor intensity plus task continuity"]
