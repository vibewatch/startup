      - ["IDTechEx lens reported by Edge AI and Vision Alliance", "2036 / global application set", "approximately $29.5B", "Not stated", "Underlying analyst report was not available in the assigned pool"]
      - ["IDTechEx cost lens reported by Robotics and Automation News", "2024 to 2030", "ASP from approximately $114,700 to around $37,000", "Not a market-size CAGR", "Hardware-price trajectory is not LimX revenue or realized customer ROI"]
    notes: These are separate external lenses with different geography, application coverage, units, and dates; they are not additive and do not isolate LimX's SAM or SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM016]
