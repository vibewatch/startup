callouts:
  - calloutType: insight
    title: Opportunity is real but not yet company-sized
    body: Forecasts support strong category growth, while LimX-specific market capture remains unquantified because verified deployments, pricing mix, utilization, and target-geography volumes are not disclosed in the assigned evidence.
    claimRefs: [CM004, CM006, CM008, CM014]
  - calloutType: risk
    title: Effective output is the adoption gate
    body: Falling hardware prices improve the theoretical economics, but the reviewed evidence repeatedly conditions ROI on utilization, task continuity, integration quality, reliability, and productive output.
    claimRefs: [CM010, CM011, CM012, CM013]
