        - 创作前需要订阅；当前具体档位藏在账户流程后
        - 通过 Midjourney 工作流生成图像和视频
        - 保留证据中未公开实际企业 / 商业定价
        - 简单自助访问支持创作者多平台使用
      - - Ideogram
        - 免费档，Plus $15/月，Pro $42/月，Team $20/用户/月（按年计费）
        - 优先积分、私密生成、批量生成和团队账单
        - 使用结构和企业折扣未公开
        - 清晰自助阶梯争夺创作者和小团队预算
      - - Runway
        - Standard $12/月，Pro $28/月，Max $76/月
        - 视频和图像积分，加上更高容量模型访问
        - 定制企业定价未公开
        - 透明的高端视频定价锚定高端创作者市场
      - - Canva
        - 免费、Pro、Business 和 Enterprise 档位
        - 设计套件，加 AI 额度和大型模板 / 素材库
        - 捆绑套件内 AI 功能的边际成本很难拆分
        - 捆绑会挤压营销和 SMB 团队里的独立 AI 工具
      - - Figma AI
        - 团队 AI 积分，采用按量付费或订阅结构
        - 设计探索、绘图、图像编辑和代码支撑原型
        - 实际 AI 成本取决于团队积分分配
        - 嵌入式 AI 能在协作设计组织中替代点工具
      - - PixAI
        - 会员制为主的消费者定价页面
        - 聚焦动漫的图像生成和创作者工具
        - 企业 / 商业条款未公开
        - 竞争点是垂直创作者负担能力，而不是完整工作流深度
