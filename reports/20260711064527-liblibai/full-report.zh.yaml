      - number: '1.4'
        title: 里程碑、治理缺口与负面背景
        blocks:
          - type: paragraph
            body: >-
              看 LiblibAI，一个有用的尽调视角，是把高增长叙事和压力信号放在同一张图里。正面看，里程碑节奏确实存在：2023 年创立，2025 年快速融资，2025 年 10 月发布 LiblibAI 2.0，2026
              年 3 月推出 LibTV，2026 年 5 月推出团队版，2026 年 6 月完成 Evoken 更名和 B+ 融资。负面看，同一份公开记录也解释了为什么不能照单全收。36Kr
              回顾了早期因备案中断和补贴消耗导致的近破产阶段，说明资本纪律并不总是强项。更重要的是，OECD、OFweek 和 AIbase 保留了 2026 年 4
              月的内容审核失效事件：规避性提示词生成了露骨内容，迫使公司公开道歉并做技术修复。对于一家在中国受监管 AI 内容市场建设业务的公司，这不只是产品
              bug，而是关乎治理和牌照相关性的事件。公司响应看起来快速且有实质内容，但事件表明，运营控制是投资命题的一部分，而不是旁注。因此整体画像是：一个高速度、创始人主导、产品-市场动能清晰的平台，同时仍带着治理不透明和内容安全执行风险；后续章节必须持续纳入这些问题。
