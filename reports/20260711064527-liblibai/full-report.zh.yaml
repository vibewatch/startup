  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 的正确市场定义不是“所有生成式 AI”，甚至也不是“所有 AI
              内容”。公司竞争的地方，是创作者和专业团队购买工具，以比传统软件或代理公司更快的速度生产视觉素材、设计输出和成片视频。这个市场包括文生图、图生视频、文生视频、设计智能体工具、模型分享社区，以及让产出可商业使用的周边工作流层。它不包括基础模型基础设施、通用
              copilots，以及大多数非生成式传统软件，除非这些产品现在内置创意生成并争夺同一条预算线。边界很重要，因为市场报告若只统计独立生成器，或统计更宽的创意工作流栈，数字会截然不同。LiblibAI
              自身的产品方向——社区加 API，再延伸到视频和设计——支持更宽的工作流解释。与此同时，真实竞争仍来自低摩擦替代品，如 Midjourney、Firefly、Canva AI、Civitai
              communities、Runway、Kling、Jimeng、Hunyuan 和 Wanxiang。尽调时，现状不只是传统 Adobe
              或代理公司生产；它是一个多栖世界，团队会在追求速度、质量和合规时混用专有工具、开放生态和大厂捆绑包。
