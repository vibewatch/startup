      - number: '5.3'
        title: 技术栈以编排为核心，并深度依赖外部模型生态
        blocks:
          - type: paragraph
            body: >-
              公开证据指向一种围绕聚合和编排搭建的架构，而不是单一纵向整合的基础模型。LiblibAI 自有 API 材料描述了 Star-3
              图片能力和自定义模型访问，但周边生态证据显示，平台仍与更广阔的开放模型宇宙紧密耦合。Flowith 把 Liblib.art 的崛起归因于 Stable Diffusion、LoRA checkpoints
              和工作流分享。Black Forest Labs 通过 API 或开放权重提供 FLUX，Stability 推广企业就绪的创意生产，Kolors 通过 Hugging Face 公开分发，LibTV
              的公开描述称它可在 Kling、Wan、Midjourney、Seedance 等数十个外部模型之间切换。这个架构选择有明显好处：LiblibAI
              可以快速移动，向用户呈现模型宽度，并在不自行训练每个底层基础模型的情况下变现工作流层。但它也带来对模型质量、许可、供应商经济性和 API
              可用性的依赖，而这些并不完全受管理层控制。因此，最强的产品技术命题不是专有模型至上，而是把许多模型包进一个社区和工作流系统，让中国创作者和团队更容易高效使用。
