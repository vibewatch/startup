  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格要求不低，但对一家私有 AI 应用公司来说，收入证据异常具体
        blocks:
          - type: paragraph
            body: >-
              判断 LiblibAI 当前估值，首先应看实际披露，而不是泛泛的 AI 热度。第一财经、AIbase、BigGo 和 GPCA 支撑出同一幅大图景：到 2026 年中，公司 ARR 已超过 $300
              million，用户超过 30 million，并以超过 $2 billion 的估值完成近 $300 million 的 Series B+。这组组合罕见，因此重要。许多 AI
              私募轮定价主要靠模型声望、战略稀缺性或未来平台可选性，而不是已经验证的商业规模。相比之下，LiblibAI 已经有大型消费者社区、可变现的 API
              和工作流界面，并且产品向量不止一个聊天机器人或一个模型。估值数学仍然激进——约 6.7x
              ARR——但比起公开收入披露更薄的中国前沿模型公司，这个倍数更容易辩护。反论点同样重要：公开证据仍未披露毛利率、付费用户比例、企业收入组合，或 2026
              年融资对应的优先权结构。因此当前价格有支撑，但置信度只能给中等。
