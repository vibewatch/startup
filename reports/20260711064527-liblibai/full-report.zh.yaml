      - number: '4.3'
        title: B+ 后资产负债表更好，但资本充足性仍取决于毛利现实
        blocks:
          - type: paragraph
            body: >-
              公开融资史显示，到 2026 年中，LiblibAI 已从早期应用层融资迅速进入更好的资本位置。Gunder 和 INCE 描述了 2025 年 2 月融资，随后是 2025 年 10 月 $130
              million Series B；2026 年 6 月 B+ 又从 Granite Asia、Tencent 和 Shunwei 领投的一线投资人阵容获得接近 $300
              million。这给管理层留出空间投入算力、模型集成、审核，以及视频和设计工具扩张，而不必马上重返资本市场。尽管如此，不能只从融资规模判断资本充足性。ChinabizInsider
              的负面观点有价值，正因为它点出了战略脆弱性：Evoken 被描述为第三方模型 API 聚合者，而非专有基础模型所有者；这或许降低训练
              capex，但也可能让公司暴露在供应商定价、使用波动和平台抽成压缩之下。备案镜像给出第二个警示。QCC 和 Aiqicha 提供了所需备案证据，但也暴露出一些对承销不太顺眼的实体数据，包括较低注册资本，以及与公开
              AI 增长故事并不完全匹配的年报员工或经营范围字段。这个错配不推翻运营业务，但意味着投资人应要求一份经核对的法律实体图和投后现金头寸，而不是依赖注册页面或数据库。
