      - number: '1.3'
        title: 产品矩阵、运营规模与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              公司概览中最强的证据不是融资本身，而是融资背后的产品矩阵形态。LiblibAI 仍是锚定社区和分发入口：公开来源称其累计服务超过 3000 万用户，托管超过 50 万个原创模型，现在每日生成超过 500
              万张图片。官方 API 材料还给出重要变现线索：结构化点数经济、付费套餐，以及对自研和自定义模型的支持。这指向的业务不只是休闲消费者订阅；它覆盖购买点数的创作者、使用 API
              的开发者或工作室，以及从试验转为工作流开支的专业内容团队。第二、第三款产品延续了这套逻辑。LibTV
              围绕结构化视频生产，而非一次性生成；公开指南强调节点工作流、团队协作和智能体访问，不只是炫目的模型演示。Lovart 及其国内版本 Xingliu
              则把公司从图片工具推向设计执行。合在一起，证据支撑了管理层的说法：Evoken 正在打造一条从素材到生产再到交付的 AI
              内容链。风险在于，许多头部指标仍来自公司口径，后续财务和客户章节必须检验这些规模究竟有多少能转化为可重复、高毛利收入。
