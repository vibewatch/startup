      - number: '5.2'
        title: 工作流深度和开发者工具让平台区别于简单生成器
        blocks:
          - type: paragraph
            body: >-
              最有说服力的产品技术证据，集中在工作流深度。LibTV 被反复描述为结构化 AI 视频操作环境，而不是一次性提示词输入框。AIGC 和 Gongke
              都把它描述成无限画布、节点式工作流系统，能把创作者从脚本和分镜带到图片、视频、音频、字幕和最终导出。Gongke 还称，LibTV 聚合了 30 多个模型，并开放 Skill 接口，让 AI agents
              编排生产步骤。开发者侧，官方和社区工具也显示出真实的 API 成熟度。LiblibAI 官方 API 页面推广 Star-3 和自定义模型访问；公开 Go wrapper 暴露文生图、图生图、状态轮询，以及模型
              ID、权重等 additional-network 字段。面向 LibTV 风格生成的 Rust CLI 称，它使用 HMAC-SHA1 签名请求和异步生成轮询，直接连接官方
              openapi.liblibai.cloud 端点。npm package
              则提供了更小但仍有用的信号：外部开发者正在围绕平台封装。合在一起，这些证据材料暗示这是一个真正的运营平台：工作流编排、生成端点和开发者抽象，而不是纯消费级 UI。
