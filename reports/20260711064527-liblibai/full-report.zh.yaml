  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 估值 / 状态
      - 收入 / ARR 背景
      - 重要性
      - 局限
    rows:
      - - LiblibAI
        - '>$2.0B 私营估值（2026 年 6 月）'
        - '>$300M ARR，30M+ 用户'
        - 锚定案例；AI 应用中少见的具体商业披露
        - 私营、未经审计，结构未知
      - - Adobe
        - ~$90.35B 企业价值
        - ~$25.2B TTM 收入，~3.6x EV/revenue
        - 规模化创意软件估值的公开基准
        - 成熟、盈利的既有巨头，不是高增长 AI 应用
      - - Runway
        - ~$5.3B 私营估值（2026 年 2 月）
        - 2025 年中年化收入 ~$90M；Sacra 称 2026 年底年化目标为 $265M–$300M
        - 最好的 AI 视频应用可比公司；市场愿为模态扩张支付溢价
        - 收入是估算，不是经审计披露
      - - Midjourney
        - 无公开融资估值；自筹资金
        - Sacra 估计 2023 年 ARR 为 $200M；Axis 估计 2025 年收入约 ~$500M
        - 证明品类领先的图像产品可以实现巨大规模变现
        - 没有干净可观察估值倍数
      - - Moonshot AI
        - ~$20B 私营估值（2026 年 5 月）
        - 公开来源更强调融资规模，而非经审计收入
        - 说明中国 AI 龙头即使财务透明度有限，也能获得很高估值
        - 不是直接可比对象，因为它是前沿模型实验室
      - - MiniMax
        - ~$6.5B IPO 定价估值，上市首日部分公开引用更高
        - 公开上市和产品宽度使其成为中国 AI 情绪标记
        - 有助于读取香港市场的退出胃口
        - 公开资料对所用准确估值存在冲突
      - - Stability AI
        - 融资 / 重组基准，不是干净的溢价可比公司
        - Sacra 估计重组后 2024 年收入约 ~$50M
        - 提醒开放模型龙头也可能遭遇估值压缩和融资压力
        - 保留来源中没有干净的 2026 年新估值标记
    notes: 这组可比公司有意混合选取：没有单一纯粹公开或私营同业能覆盖 LiblibAI 在社区图像生成、模型生态、视频和设计工具上的组合。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public and private valuation references retained for this chapter as of
        2026-07-11; it is not an exhaustive creative-AI comp universe.
