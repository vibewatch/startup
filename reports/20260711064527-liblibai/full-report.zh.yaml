    公司品牌。公开来源显示，公司已经从图片生成与模型分享社区，扩展为覆盖社区图片生成、API 变现、LibTV 视频创作，以及 Xingliu/Lovart 设计智能体界面的创意栈。到 2026 年中，公司据称用户超过 3000
    万、ARR 超过 US$300 million，并完成接近 US$300 million 的 Series B+，估值超过 US$2 billion。
