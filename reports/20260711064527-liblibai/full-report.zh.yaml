            body: >-
              保留的公开证据一致指向一个非常大的创作者中心用户基础。Yicai、AIbase 和 BigGo 都重复称，到 2026 年中 LiblibAI 累计用户超过 3000 万；AIbase
              更早关于企业升级的报道提到超过 2000 万创作者和 10 万个原创模型。Flowith 有助于解释这些数字：它把 Liblib.art 描述为最大的中文 AI
              模型和工作流社区，服务此前被英语优先平台覆盖不足的、以普通话为主的受众。官方产品界面强化了这种解读。LiblibAI 不只是提供一个生成框；它呈现的是创作者平台、资产页、教学资源、模板、API 和
              LibTV。因此，最可能的客户分层是一个金字塔：底部是庞大的免费或轻度变现创作者群体；中间是规模较小的活跃模型分享者和工作流用户；上层则是为点数、API
              或相邻工作流工具付费的开发者、工作室和专业团队。公开证据对创作者基础规模支撑最强，对付费子集规模支撑较弱。
