    rows:
      - - API 积分
        - 官方 API 平台按用量消耗积分
        - 100 积分 = RMB1，API 基础套餐 RMB10 起
        - 如果嵌入生产工作流，可能具备粘性，但利润率取决于推理成本
        - 拆分自助开发者和企业合同贡献的 API 收入
      - - 个人订阅
        - LiblibAI 平台上的创作者订阅和充值
        - 头部规模和创作者社区意味着可循环的自助变现
        - 覆盖面可能很广，但价格敏感，且容易多平台并用
        - 按用户群组提供付费用户数、流失率和 ARPPU
      - - 企业 / 商业合同
        - API 和相邻产品上的商务联系与工作流定位
        - LibTV、Lovart 和团队式定位都指向更大合同
        - 如果部署和留存真实，收入质量可能更高
        - 披露 ACV 区间、销售周期长度和头部客户集中度
      - - 设计智能体变现
        - Lovart 点数包和 API 访问
        - Lovart 定价和开发者资料显示，它有独立的点数经济
        - 如果采用能撑住，可降低对核心图像生成的依赖
        - 展示 Lovart 或 Xingliu 当前运行收入贡献
      - - 市场 / 生态抽成率
        - 模型分享和创作者生态变现
        - 公开来源显示有创作者激励，但未披露抽成机制
        - 公司披露分成和附加率经济性之前仍未知
        - 说明模型销售或加速包是否已对 ARR 构成实质贡献
    notes: 本表把已直接观察到的定价机制，与符合公开产品形态的推断型变现来源区分开。
