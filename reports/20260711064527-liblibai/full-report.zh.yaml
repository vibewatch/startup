      - number: '8.4'
        title: 退出路径存在，但最终承销仍需要毛利率、优先权和企业质量的私有证据
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 已经有规模，有中国主要科技与创投投资人领投的融资团，也有足够宽的产品组合来支撑 IPO 叙事，因此比早期 AI 实验室更接近退出准备状态。最可信的两条路径是：作为中国优先的 AI
              应用冠军赴港上市；或者如果独立扩张停滞，与 Tencent
              等主要生态投资人产生战略结果。但“准备好”不等于“任何价格都准备好”。最终承销缺口很清楚：公开证据没有显示清算优先权、老股交易、按付费群组划分的留存、扣除 GPU
              支出后的贡献利润率，也没有清晰拆分订阅、企业和市场收入。缺少这些细节，投资人只能把当前估值辩护为合理到有吸引力，而不是明显便宜。因此最终尽调问题应少盯抽象 TAM，多看收入质量、控制系统，以及 2026
              年叙事会在什么具体情形下破裂。
