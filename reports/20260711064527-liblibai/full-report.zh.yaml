  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 示意估值区间
      - 以 $2.0B 入场的回报逻辑
      - 概率信号
    rows:
      - - 牛
        - 到 2028 年 ARR 达到 ~$550M–$650M；企业 / API 结构改善；没有重大监管冲击；投资者仍奖励中国 AI 龙头
        - ~$5.0B–$6.5B
        - ~2.5x–3.3x 总 MOIC
        - 产品宽度必须变成变现宽度
      - - 基准
        - 到 2028 年 ARR 达到 ~$400M–$500M；增速放缓但仍强劲；倍数稳定在约 ~8x–9x 远期 ARR 等值附近
        - ~$3.4B–$4.5B
        - ~1.7x–2.3x 总 MOIC
        - 假设当前品类领导地位延续，但没有溢价扩张
      - - 熊
        - ARR 停在 ~$250M–$320M 附近；审核 / 监管挫折或套件捆绑打击转化；市场套用成熟软件式倍数
        - ~$1.0B–$1.5B
        - ~0.5x–0.75x 总 MOIC
        - 由信任破裂、变现偏弱或安全事故反复触发
    notes: 区间是情景构造，不是管理层指引或正式 DCF 输出。
    claimRefs:
      - CV014
      - CV015
      - CV040
      - CV041
      - CV042
