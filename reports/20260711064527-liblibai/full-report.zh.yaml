      - number: '7.3'
        title: 第三方模型依赖与大科技竞争会同时压缩护城河和利润率
        blocks:
          - type: paragraph
            body: >-
              模型聚合让 LiblibAI 的架构和上市速度都受益，但同一套设计也埋下真实依赖风险。ChinaBizInsider 认为 Evoken 没有自有基础模型，而是把产品套件搭在第三方模型 API 之上；Black
              Forest Labs 明确通过 API 或开放权重提供 FLUX，Stability 也开始直接销售企业级创意生产能力。中国市场里，通义、万相、即梦、Kling、Kolors
              都说明，大型或资金充足的生态正在快速切入 LiblibAI 想变现的图像和视频表面。OpenAI 停止 Sora 的网页和 App
              体验，也提醒市场：即便在最高端，应用层领先位置也可能快速变化。因此战略危险有两面。外部模型提供商改条款时，供应商依赖会侵蚀利润率或产品质量；更大平台若把足够好的图像 /
              视频功能打包进更广的套件或云，竞争性捆绑又会削弱需求。公司可能同时输掉等式两端：上游成本更高，下游付费意愿更低。
