      - - 监管合规
        - 主动申报、标注，以及事后控制
        - 任何重大执法行动，或公开安全事故反复出现
        - 说明控制体系没有跟上业务扩张
      - - 供应商 / 模型依赖
        - 备用供应商，以及更多自有工作流 IP
        - 第三方 API 成本大幅上升，且没有定价权应对
        - 会同时压缩毛利、削弱产品质量
      - - 企业信任
        - 有记录的案例、安全证明和续约证据
        - 持续无法把规模转化为具名企业背书
        - 意味着规模主要停留在消费端，变现更弱
      - - 创作者社区健康度
        - 稳定的上传、分享和激励经济
        - 政策收紧或价格调整后，创作者活跃度急剧下滑
        - 会伤到平台供给侧和护城河
      - - 执行能力
        - 清晰的业务线归属和路线图纪律
        - 图像、视频、设计发布同时反复延期
        - 表明组织消化不了产品宽度
    notes: 终止标准是尽调团队应跟踪的分析阈值，不是公司的公开指引。
    claimRefs:
      - CR006
      - CR010
      - CR019
      - CR031
      - CR032
