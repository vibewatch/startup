  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 中国监管体系让内容安全和标识成为核心运营风险
        blocks:
          - type: paragraph
            body: >-
              对 LiblibAI 而言，监管不是背景问题，而是位于产品正中央。中国的深度合成、生成式 AI，以及更新的 2026 年 AI-agent 和拟人化交互规则，都直接适用于平台的图片生成、视频生成、社区分发和 AI
              辅助工作流工具组合。AI Governance Institute 将深度合成规则概括为覆盖 AI 生成或 AI 操纵的文本、图片、音频、视频和虚拟人；Deep Lex
              则认为，中国已经运行全球最广泛的有约束力行业 AI 监管体系。Rimon 和 SesameDisk 把 2026
              年含义说得更明确：合规现在意味着围绕标识、备案、审核和内部控制的具体义务，而不是模糊最佳实践。TC260
              标识页面可见的征求意见时间进一步说明，规则手册仍在运营化，而非已经冻结。对一个允许用户上传、混合和商业化模型与输出的平台，这会形成永久负担。风险不只是罚款或下架，还包括产品迭代变慢、误伤更多、审核成本更高，以及监管演进时平台必须持续收紧控制而可能削弱用户体验。
