        blocks:
          - type: paragraph
            body: >-
              虽然 LiblibAI 没有披露经典 SaaS 留存指标，但公开资料中有几类重复参与的代理信号。官方教学界面提供文章、视频教程和付费课程；模板文章称，平台已有 1000
              多个可复用图片模板，覆盖常见创作者和商业场景。只有管理层预期用户会反复回来，而不是生成一张新奇图片后离开，这些投入才讲得通。创作者平台和资产页同样指向一个为持续工作流参与而设计的产品。财务背景也强化了这种解读：披露的
              $300 million ARR 分摊到 3000 万用户，意味着每名注册用户年混合收入只有约
              $10；这符合庞大免费人群加较小高频付费子集的形态，而不是整个用户基础的一次性交易。未解问题是可见度。没有保留公开来源披露付费用户数、净留存、总留存、cohort
              衰减或客户支持满意度。因此，重复使用命题是合理的，但它仍是代理指标命题，而不是经审计留存故事。
