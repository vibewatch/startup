  - id: TV005
    title: 论点失效与终止触发表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 增长减速
        - ARR 增速跌破约 ~50%，且看不到利润率改善
        - 打破当前溢价倍数由品类领先动能支撑的论证
        - 按成熟软件倍数重新承销
      - - 审核失败复发
        - 2026 年 4 月整改后，再次出现公开安全或合规事件
        - 同时抬高监管成本、品牌风险和企业信任压力
        - 冻结确信度，并重新审视仓位规模
      - - 变现结构令人失望
        - 企业 / API 贡献相对消费订阅仍然过小
        - 削弱持久性，并降低对大厂套件捆绑的防御力
        - 将判断转向跟踪
      - - 供应商 / 模型利润率挤压
        - 第三方模型或 GPU 经济性恶化，且没有定价应对
        - 把收入增长变成质量更低的收入
        - 下调情景倍数和下行情形
      - - 退出窗口关闭
        - 香港或战略买方对 AI 应用的退出胃口显著降温
        - 即便运营稳健，也会削弱终值倍数支撑
        - 延长持有期假设，或避免追加资本
    notes: 这些是投资者监控触发项，不是必然发生的预测事件。
    claimRefs:
      - CV036
      - CV040
      - CV041
      - CV043
      - CV045
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 收入结构
        - 订阅、企业 / API、市场收入的拆分
        - 决定收入持久性和合适倍数
        - 管理层数据室 / 财务团队
      - - 扣除算力后的毛利
        - 按产品线拆分的贡献利润率和 GPU 成本敏感性
        - 区分亮眼 ARR 和真正有吸引力的经济性
        - CFO 模型加供应商合同
      - - 优先权结构和稀释
        - 清算优先权、优先级、期权池扩张和老股交易
        - 私募轮 IRR 取决于股权结构条款，不只是头部估值
        - 法律文件和条款清单
      - - 企业质量
        - 具名付费客户、ACV 区间、续约，以及安全 / 合规证明
        - 检验企业收入能否加深 ARPU，并经得起审查
        - 销售运营、客户背书、续约队列
      - - 安全与合规控制
        - 事后控制、审核人员配置，以及按产品划分的监管申报
        - 守住增长和退出准备度的关键
        - 信任与安全审查加法律顾问备忘录
    notes: 如果公司能干净回答这五项问题，当前估值就更容易被证明有吸引力，而不只是公允。
    claimRefs:
      - CV038
      - CV039
      - CV043
      - CV044
      - CV045
