      - number: '3.2'
        title: 全球图片领导者与开放社区从相反方向挤压 LiblibAI
        blocks:
          - type: paragraph
            body: >-
              全球图片竞争者分成两个战略阵营。Midjourney、Ideogram 和 OpenAI 主要在前端生成质量、消费者心智和简单套餐访问上竞争。Midjourney
              自身材料仍把它描述为精简、自筹资金的实验室，其入门指南强调通过订阅创建图片和视频，而不是开放模型市场。Ideogram 同样提供从免费访问到团队套餐的自助分层；OpenAI 则把 DALL·E 留在
              ChatGPT 和 API 栈内。第二个阵营是开放生态。Stability AI 面向图片、视频、音频和 3D 推广开源生成式 AI；Black Forest Labs 明确同时提供 API
              访问和可在客户自有基础设施上运行的开放权重。Civitai 和 Hugging Face 把这种开放延伸到社区：Civitai 组织模型和创作者作品，Hugging Face Spaces
              则把模型演示变成可分享应用。这很重要，因为 LiblibAI 的力量来自社区和模型流动性，但这些开放生态也让模型发现和实验更可迁移，从而降低切换成本。面对全球图片领导者，LiblibAI
              的相对优势是本地化和中国社区密度；面对开放生态，它的优势是工作流包装和本地合规，而非独占模型所有权。
