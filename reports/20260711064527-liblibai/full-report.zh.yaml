      - number: '2.3'
        title: 买家、预算负责人和增长驱动因素
        blocks:
          - type: paragraph
            body: >-
              需求最强证据来自行为，而不是供应商乐观叙事。Wyzowl 2026 年调查显示，视频已经是多数企业的核心营销媒介，AI 辅助视频使用率已过半，支出意愿仍为正。这很重要，因为 LiblibAI
              的邻近产品——LibTV 和设计工具——争夺的是营销、电商、工作室和代理公司预算，而不只是爱好者开支。Axis 给出供给侧解释：相较传统工作流，AI
              视频制作成本已经大幅下降，能盈利生产的活动和素材范围因此扩大。设计侧，Worldmetrics 认为 40% 专业设计师已经每天使用
              AI，说明创意专业人士不再只是在场边测试。因此买家地图很宽，但仍能看清：营销人员要吞吐量和
              ROI，设计师要可控视觉，工作室要更快生产，企业要嵌入现有工作流的多模态工具。增长由更低成本、更快迭代、视频作为营销渠道的主流化，以及多模态生成向设计和内容运营扩散驱动。需求中最值得投资的部分，是专业工作流层；在那里，切换摩擦和重复开支可能真正形成。
