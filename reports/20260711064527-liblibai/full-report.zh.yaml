            body: >-
              官方产品界面现在覆盖的远不止图片生成。LiblibAI 关于页面把用户导向主平台、资产、创作者中心、教学资源、API 和 LibTV，说明管理层把社区、学习、变现和生产视为一个整合产品家族。主页仍把
              LiblibAI 定位为领先 AI 创作平台；AIbase 2025 年关于 LiblibAI 2.0 的文章更明确地描述了产品转向：平台从模型和工具集合，转向面向创作者的完整 AI 工作室。Flowith
              提供了有用的生态背景，把 Liblib.art 描述为最大的中文模型和工作流社区，根植于 Stable Diffusion 和 LoRA 分享，而不只是提示词生成图片。Lovart
              把栈进一步延伸到专业设计，LibTV 则把它带入结构化视频生产。技术含义很重要。LiblibAI 不是简单套在某个模型上的网页前端。它是一个产品组合，试图掌握资产发现、创作者激励、API 消费、训练 /
              分享行为，并越来越多地掌握从构想到交付的端到端工作流。
