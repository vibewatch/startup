      - CR045
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 重要性
      - 证据基础
      - 决策含义
    rows:
      - - 投资建议
        - 买入
        - 相比商业披露更弱的 AI 应用同业，价格并未明显过高
        - ARR、估值和同业可比证据
        - 若投资者能承受监管和执行波动，可继续推进
      - - 信心
        - 中
        - 核心估值事实已公开，但结构和利润率细节缺失
        - 融资报道加上缺失数据缺口
        - 仓位应按不确定性配置，而非押满最高确信度
      - - 风险评级
        - 高
        - 监管、审核、竞争和模型依赖可能彼此强化
        - 第 7 章风险栈加同业压力
        - 需要严格监控和终止标准
      - - 估值立场
        - 公允
        - ~6.7x ARR 高于成熟软件，但低于许多 2026 年 AI 私营可比公司
        - Liblib 与同业倍数交叉验证
        - 只有增长继续领跑品类，入场才算合理
      - - 目标结果
        - 基准情形约 3 年实现 1.7x–2.3x
        - 若增长结构改善、退出窗口保持打开，仍有上行空间
        - 情景分析
        - 回报逻辑真实存在，但下行并不对称
    notes: 该建议明确对价格敏感，并假设 2026 年融资大致反映市场出清的入场点。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV014
      - CV015
      - CV040
      - CV044
  - id: TV002
    title: 正方 / 反方投资论点表
    columns:
      - 论点
      - 方向
      - 说服力来源
      - 何种情况会改变判断
    rows:
      - - 商业验证已经存在
        - 看多
        - 很少有 AI 创意平台同时披露超大用户规模和 $300M ARR
        - 收入重述，或付费方集中度数据偏弱
      - - 相比 AI 私营可比公司，估值温和
        - 看多
        - Runway、Moonshot 和中国热门 AI 标的意味着定价区间可以高得多
        - 全行业倍数急剧重置，或后续融资失败
      - - 护城河弱于收入表象
        - 看空
        - 聚合器依赖和大厂套件捆绑可能同时压缩利润率和需求
        - 出现持久企业锁定或自有模型优势证据
      - - 监管负担不是理论风险
        - 看空
        - 2026 年 4 月审核事件说明合规风险已经碰到运营
        - 连续多个季度安全记录干净，且没有新的公开事件
      - - 单位经济缺失限制确信度
        - 看空
        - 毛利、收入结构和优先权包袱均未披露
        - 私下尽调确认毛利强劲且融资条款干净
    notes: 反方论点不是泛泛说「存在竞争」；核心问题是，在收入质量被证明之前，估值是否配得上溢价。
