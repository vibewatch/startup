  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 头部牵引强，但收入质量仍大多是黑箱
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 最干净的公开财务信号，不是详细利润表，而是一组相互印证的 2026 年头条。Yicai、AIbase、BigGo、GPCA 和 36Kr 都指向接近 $300 million 的 Series
              B+ 和超过 $2 billion 的估值；Yicai 还称，截至 2026 年 5 月，年度经常性收入已达到 $300 million，是上一年水平的 30
              多倍。即便基数较小，这也是异常增长。官方产品页说明了为什么这个数字方向上可信：LiblibAI 通过 API 平台上的点数和订阅变现，并扩展到 Lovart、LibTV
              等相邻产品，可以支撑更高价值的商业工作流。但同一份公开记录留下了大洞。没有保留来源披露创作者订阅、API
              使用、企业合同或市场抽成之间的拆分。也没有公开毛利率、留存或递延收入披露。结果是：财务画像在收入动能和融资验证上很强，但在收入质量与耐久度上异常不透明。
