      - number: '2.4'
        title: 约束：监管、版权、技能与捆绑压力
        blocks:
          - type: paragraph
            body: >-
              这个市场增长很快，但并不顺滑。中国 AI 监管体系异常偏运营：备案、标识、深度合成规则，以及更新的人形化 AI
              义务，都会增加成本，并放慢鲁莽迭代。对图片和视频平台而言，审核和可追溯性不是可选产品功能，而是市场准入要求。版权风险同样是结构性的。Axis 记录到 2025 年底已有 70 多起 AI
              图片版权诉讼，法律追踪显示，中国现在也要求越来越具体的标识和审计纪律。采用约束还存在于买方组织内部。Wyzowl
              暗示，成本已不再是许多团队的主要阻碍；内部技能、感知必要性和质量控制变得更重要。与此同时，替代品集合拥挤，大平台可以把生成式功能捆进更宽的云、生产力套件和创作者生态。OpenAI 停用 Sora
              就是警示性的极端案例：品类需求不保证可持续单位经济性，如果算力消耗快过收入，业务仍会失衡。对 LiblibAI
              而言，这意味着市场机会真实但有条件。胜出不只靠模型访问或增长营销，还要在沉重替代压力下守住持久工作流价值、信任和监管执行。
