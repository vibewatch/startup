      - number: '7.2'
        title: 审核、版权和用户规避风险已在公开记录中可见
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月的审核失灵之所以重要，是因为它把理论上的合规风险变成了已经暴露的运营弱点。OECD 将该事件收录为 AI 安全事件，AIbase 和 OFweek
              则记录了公司的道歉以及后续收紧控制。OFweek 的梳理尤其有价值：它揭示了更大的生态问题——提示词绕过方法和付费教程会围绕不安全内容生成形成灰色市场，平台要防的不是简单关键词，而是有创造力的对抗者。版权和 IP
              风险同样关键。Andersen v. Stability AI 案件梳理显示，在生成式图像案件中，艺术家仍在围绕训练数据、直接侵权理论和版权管理信息持续主张权利。LiblibAI 面临的风险不是它与
              Stability 或 Midjourney 完全相同，而是一个拥有大量用户生成模型库存、又输出图像 /
              视频的平台，既可能卷入上游训练数据争议，也可能因下游创作者上传嵌入受版权保护的风格或素材而暴露风险。换句话说，审核风险和版权风险会互相放大：平台越开放、越依赖创作者驱动，就越需要持续合规监控，同时又不能扼杀支撑增长的参与循环。
