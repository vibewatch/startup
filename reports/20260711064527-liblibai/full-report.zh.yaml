      - number: '1.2'
        title: 资本形成、投资人阵容与所有权信号
        blocks:
          - type: paragraph
            body: >-
              Evoken 的融资史少见之处，在于它从近乎求生迅速跃升为独角兽。公开报道支撑了一条可信路径：2023 年早期天使轮，2024 年经历备案相关停摆和激进补贴开支后的承压期，2025 年 2 月由 INCE 和
              Shunwei 领投的救援兼扩张轮，2025 年 10 月由 HongShan 和 CMC 领投、战略投资方广泛报道为 Ant Group 的 $130 million Series B，随后在 2026 年 6
              月完成接近 $300 million 的 Series B+，估值超过 $2 billion。按中国应用层标准，最近一轮投资人阵容一线：Granite Asia、Tencent 和 Shunwei
              领投，大量老股东跟投。投资人厚度重要，因为它降低了近期融资风险，也给公司带来战略渠道。但这不能消除围绕一级 / 二级份额、清算层级或董事会控制权的不确定性。公开数据库对累计融资额也分歧很大，Tracxn 与 CB
              Insights 的统计互不兼容。这个差异本身就是尽调信号：公司仍为私营，披露具有选择性，任何投资判断都应建立在经核对的股权结构表上，而不能只依赖第三方数据库。
