            body: >-
              因此，承销结论是混合但可投。收入线索足够真实，值得重视：多家独立 2026 年报道支撑约 $300 million ARR
              和创纪录融资轮，产品界面也显示出与重复使用一致的变现架构，而不是一次性新奇消费。混合来看，$300 million ARR 分摊到 3000 万用户，意味着每名注册用户年收入只有约
              $10；这与一个庞大免费人群加一个小得多的付费或高频使用人群相容。这本身不是弱点，而是社区驱动免费增值平台的标准形态。问题在于，公开证据在触及决定耐久度的问题之前就停止了。没有披露毛利率，没有干净烧钱率，没有投后现金余额，没有企业
              ACV 数据，没有 cohort 留存，也没有订阅、API
              和企业交易之间的经验证结构。公开数据库对累计融资额的分歧也非常大。正确财务判断是：需求和商业化动能为正，单位经济性需谨慎，若要建立完整机构承销模型，仍被多项私有指标卡住。
