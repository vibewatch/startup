      - number: '3.4'
        title: 耐久度取决于社区流动性，而非独占模型
        blocks:
          - type: paragraph
            body: >-
              现有证据不支持强势判断：LiblibAI 拥有独特且防御性很强的基础模型护城河。更耐久的护城河候选项，是社区流动性、本地化、模型库存、适配中国的审核 /
              合规能力，以及把庞大免费创作者基本盘转化为经常性工作流开支的能力。Black Forest Labs 和 Stability 都让开发者与创作者更容易接触强大模型，而无需绑定一个终端用户平台。Civitai 和
              Hugging Face 保持发现和实验开放。Midjourney、Ideogram、Runway、Canva 和 Figma
              都让多栖变得理性，因为每个工具优化不同任务：艺术图片生成、字体排印、视频、营销设计或协作式产品设计。甚至 OpenAI 在 2026 年停用 Sora
              网页和应用产品，也说明应用层的模态领先会多快转移。由此得出的竞争结论是平衡的。LiblibAI
              确有位置，因为它把中国优先分发、开放模型社区和相邻商业工具结合起来；但其护城河是运营和生态驱动，而不是扎根于封闭专有模型。因此，执行质量——社区留存、企业转化、创作者激励和合规——比头部模型平价本身更重要。
