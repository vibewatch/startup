      - number: '4.2'
        title: 公开定价界面指向免费增值和用量变现，但算力敏感性仍高
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 自己的 API 页面比融资头条更具体地呈现了商业模式。页面称，API 图片生成消耗点数，100 点按标价等于 RMB1，API 基础套餐从 RMB10
              起；这是典型的用量驱动设计，而不是纯粹按席位收费的 SaaS 模型。Lovart 的定价和 API 材料强化了同一模式：月度和年度点数按账期重置，加购包不会过期，典型图片生成约消耗 1
              点，重度用户可购买更高用量套餐。点数架构有吸引力，因为收入能跟随使用峰值上升，也允许从爱好者试验向专业生产追加销售。但它也让毛利暴露在算力强度下。Replicate
              解释，私有模型托管会按启动、空闲和活跃处理时间计费；Lambda 公开定价显示，H100 实例约为每 GPU-hour $3.99，A100 实例约为每 GPU-hour $1.99 到 $2.79。Modal
              的定价示例也显示同一主题：serverless GPU 工作负载在规模化时会迅速叠加，且还未计入支持、带宽和审核开销。Runway、Figma 和 Canva
              的公开定价同样重要，因为这些公司让市场接受两种模式：高价视频定价，或把 AI 嵌入更宽的订阅；它们既提供支付意愿基准，也给独立变现施压。
