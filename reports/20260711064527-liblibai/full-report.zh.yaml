      - number: '8.2'
        title: 相比 AI 私募轮，LiblibAI 看起来克制；相比成熟软件，它仍在为雄心定价
        blocks:
          - type: paragraph
            body: >-
              读 LiblibAI 估值，最好的办法不是硬套一个错误的同业组，而是在三组可比对象之间三角定位。面对成熟上市创意软件，Adobe 是最干净的基准：其企业价值和过去十二个月收入对应的收入倍数在 3x 中段，这意味着
              LiblibAI 相对规模化、高利润软件仍有明显溢价。面对 AI 原生私有应用同业，图景就变了。Runway 2026 年 2 月的 $5.3 billion 融资，结合 Sacra
              的收入估计，无论按历史收入还是指引收入，都隐含比 LiblibAI 高得多的收入倍数。Midjourney
              自筹资金，投资人没有直接给出标价，但独立市场数据源把它描述为比多数同业大得多的图像变现机器，说明品类领导者可以拿到溢价价值。Moonshot、MiniMax
              等中国前沿模型公司显示的资本市场行为更热：公开资料引用了数十亿美元估值或 IPO 标价，尽管经审计收入透明度有限。在这个背景下，LiblibAI 披露的 ARR 让它的倍数显得更扎实，而不是泡沫化。
