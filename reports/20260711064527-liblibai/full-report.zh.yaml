      - number: '8.3'
        title: 回报逻辑更取决于收入组合质量和监管，而不只是收入规模
        blocks:
          - type: paragraph
            body: >-
              给 LiblibAI 做情景框架，关键不只是“增长会不会继续”。几乎任何合理观点都已经假设，公司会从 2026 年的大基数继续增长。真正的承销变量是变现组合、监管可靠性，以及视频 /
              设计产品能否加深单用户支出。牛市情景下，LibTV 和星流成为有意义的收入贡献方，企业 / API 占比上升，投资人继续奖励同时拥有开放模型生态和商业证明的中国 AI
              领导者；这可能支撑两位数远期倍数，并让估值区间从今天价格继续复利。基准情景下，增长从 2026 年的爆发显著放缓，但仍远高于传统
              SaaS；同时，市场要求更清晰的利润率和更持久的企业证据，倍数支撑小幅压缩。熊市情景下，反复审核失灵、巨头平台捆绑，或免费到付费转化疲弱，会把公司压向成熟软件倍数，即便收入仍在增长。因此结论是买入，而不是强确信买入：上行空间存在，但能支撑它的执行结果集合，比表面用户数暗示的更窄。
