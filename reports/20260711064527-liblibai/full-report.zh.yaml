      - number: '2.2'
        title: TAM / SAM / SOM 视角需要严格边界
        blocks:
          - type: paragraph
            body: >-
              公开规模测算只有在口径明确时才有用。最宽的视角把 AI 图片和创意工作流视为一个生态，因此给出很大的数字：Axis 引用 2025 年 $9.1 billion 的图片生成市场，并预计到 2035 年增至
              $272.8 billion；Worldmetrics 则引用 2027 年 $45.5 billion 的 AI 创意产业结果，以及 2030 年 $11.8 billion 的 AI
              创意工具市场。更窄的单点估算小得多：Axis 同时引用 2023 年 $349.6 million 的独立 AI 图片生成器市场，到 2030 年也只是略高于 $1 billion；AI
              视频生成器市场即便快速采用，2026 年仍低于 $1 billion。实际结论是，不能默认按最大的“全部创意 AI”TAM 给 LiblibAI
              定价。它可服务市场更接近图片、设计和视频创作中的付费专业工作流，尤其是用户需要结构化生产而非新奇图片的场景。公开来源足以定义方向性 TAM 和可能的专业工作流 SAM，但无法隔离出干净的 Liblib 专属
              SOM。最后一步需要内部数据：付费创作者、企业账户、品类结构、地域和留存。
