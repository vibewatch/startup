chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与公司足迹
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 起步于 Stable Diffusion 之后中国视觉 AI 创业潮的第一波，但公开记录显示，它很快从创作者工具转成更宽的内容生产平台。Baidu Baike、Yicai 和 36Kr 均指向
              2023 年 3 月前后由 Chen Mian 创立；他曾负责 ByteDance CapCut/Jianying
              商业化，离开消费互联网时带着一个更明确的判断：专业创作者会成为生成式工具第一批可持续付费人群。运营法律实体 Beijing Yanyu Technology 于 2023-05-16
              注册成立，注册地在北京市海淀区。到 2026 年中，母品牌已转向 Evoken，说明管理层不再希望外界只把 LiblibAI 看作图片生成社区。官方页面仍把 LiblibAI
              品牌放在旗舰产品正中央，但公司叙事已经覆盖图片、视频和智能体式设计工作流。公开履历披露仍高度围绕创始人；这在中国私营初创公司中常见，却也留下了完整领导班子、董事会构成和内部分工的尽调问题。现有证据足以确认身份和创始人-市场匹配，但不足以推断创始人主导的运营核心之外，公司治理已经成熟。
