  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局分层与 LiblibAI 定位
        blocks:
          - type: paragraph
            body: >-
              LiblibAI 面对的不是单一竞争对手集合。其核心产品位于提示词生成图片、模型托管、创作者社区和商业工作流工具的交叉点，因此相关对手地图横跨多个不同类别。一端是 Midjourney、Ideogram
              等全球图片领导者，它们在输出质量、品牌和低摩擦订阅上竞争。另一端是 Adobe Firefly、Canva、Figma AI 等企业套件玩家，它们能把生成能力捆进既有创意工作流和团队预算。第三类是
              Stability AI、Black Forest Labs、Civitai、Hugging Face 等开放生态，它们广泛提供模型、权重或演示应用，从而降低任何单一应用层平台的排他性。在中国，LiblibAI
              还面对 Tongyi Wanxiang、Wan、Jimeng、Kling、Kolors、SeaArt、PixAI 等本土图片和视频挑战者。因此，证据支撑最强的 LiblibAI
              定位不是“最佳模型”，而是“中国优先、规模最大的开放模型社区，并带有商业工作流扩展”。其披露的 3000 万以上用户、50 万以上模型和每日 500
              万张图片，让它更像创作者生态，而非单一用途图片应用；但同样的开放性也意味着，买家和创作者仍能在多个相邻工具之间多栖。
