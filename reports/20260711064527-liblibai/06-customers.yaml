- id: repeat-usage-and-monetization-proxies
  title: Repeat Usage Looks Plausible, but Retention and Payer Metrics Are Still Undisclosed
  body: 'Although LiblibAI does not disclose classical SaaS retention metrics, there are several public proxies for repeat
    engagement. The official teaching surface offers articles, video tutorials, and paid courses, while the template article
    says the platform already has more than 1,000 reusable image templates covering common creator and commercial scenarios.
    Those investments only make sense if management expects users to return repeatedly rather than generate one novelty image
    and disappear. The creator platform and asset pages similarly suggest a product designed for ongoing workflow participation.
    Financial context reinforces that interpretation: a reported $300 million ARR over 30 million users implies only about
    $10 of annual blended revenue per registered user, which is consistent with a large free cohort and a smaller high-frequency
    paying subset rather than one-off transactions across the whole base. The unresolved issue is visibility. No retained
    public source discloses paying-user count, net retention, gross retention, cohort decay, or customer-support satisfaction.
    Therefore the repeat-usage thesis is reasonable, but it remains a proxy thesis rather than an audited retention story.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU016
  - CU021
