company:
  name: LiblibAI
chapter:
  number: 6
  title: Customers
  summary: 'The public customer picture supports a very large creator-led user base with emerging enterprise proof but weak
    visibility on payer quality. Multiple 2026 sources repeat 30 million-plus registered users, millions of daily images,
    and large model inventories, while official surfaces such as creator, teaching, asset, API, LibTV, and Lovart pages show
    a product stack aimed at digital creators, developers, and increasingly professional content teams. The strongest customer
    risk is not lack of adoption but lack of disclosure: named enterprise references are sparse, retention and paying-user
    counts are not public, and independent traffic or app-store verification remains incomplete.'
sections:
- id: user-base-and-segmentation
  title: The User Base Is Large and Still Primarily Creator-Led
  body: 'The retained public evidence consistently points to a very large creator-centric user base. Yicai, AIbase, and BigGo
    repeat that LiblibAI had more than 30 million cumulative users by mid-2026, while AIbase’s earlier enterprise-upgrade
    coverage referred to more than 20 million creators and 100,000 original models. Flowith helps interpret what those numbers
    mean: it describes Liblib.art as the largest Chinese-language AI model and workflow community, built for a predominantly
    Mandarin-speaking audience that was previously underserved by English-first platforms. Official product surfaces reinforce
    that reading. LiblibAI does not only expose a generation box; it presents a creator platform, an asset page, teaching
    resources, templates, APIs, and LibTV. The most likely customer segmentation is therefore a pyramid: a very large free
    or lightly monetized creator cohort at the base, a smaller group of active model sharers and workflow users in the middle,
    and an upper layer of developers, studios, and professional teams that pay for credits, APIs, or adjacent workflow tools.
    Public evidence is strongest on the size of the creator base and weaker on the size of the paying subset.'
