- id: use-cases-and-named-customer-proof
  title: Use Cases Span Creators, E-commerce, Agencies, and Early Enterprise References
  body: The product surfaces and the small amount of named proof suggest LiblibAI is serving several customer archetypes at
    once. The teaching article on image templates shows concrete use cases in e-commerce, posters, illustration, IP, photography,
    materials, and creative experimentation, which fits a broad content-creator base rather than a narrow studio segment.
    LibTV extends the use-case map into script-driven video production and AI-agent orchestration, which is more relevant
    to media teams, agencies, and structured commercial content operations. Lovart points toward design professionals who
    need product pages, campaign posters, and brand-consistent layouts. The strongest public named-customer proof comes from
    AIbase’s upgrade coverage, which says LiblibAI serves enterprises and institutions including Tmall Campus, Luckin Coffee,
    and Tsinghua University. That is directionally useful, but still thin. None of the retained sources specify contract sizes,
    deployment depth, or renewal behavior for those names. As a result, the customer base clearly extends beyond hobbyists,
    yet the quality of enterprise proof remains much lower than the quality of user-scale proof.
  claimRefs:
