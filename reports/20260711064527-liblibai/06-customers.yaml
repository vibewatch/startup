  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: paying-users
    missingEvidence: Paying-user count, payer mix, and ARPPU are not publicly disclosed.
    whyItMatters: User scale without payer quality does not tell investors how durable revenue really is.
    diligencePath: Request paying-user count, subscription conversion, ARPPU, and cohort retention by customer segment.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: blocking
    topic: retention
    missingEvidence: No public NRR, GRR, churn, or satisfaction metrics are available.
    whyItMatters: Repeat usage is currently inferred from product surfaces rather than measured directly.
    diligencePath: Request retention dashboards, support metrics, and cohort decay curves.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU004
  - type: access-blocked
    severity: material
    topic: independent-traffic-proof
    missingEvidence: Independent traffic and startup-profile sources such as Similarweb and F6S were blocked or low quality
      during the run.
    whyItMatters: Blocked third-party sources reduce confidence in external verification of user geography and scale.
    diligencePath: Re-run with alternative profiles or acquire Similarweb / Sensor Tower snapshots from the company or data
      providers.
    relatedQuestionRefs:
    - QU016
    - QU020
  - type: missing-source
    severity: material
    topic: enterprise-depth
    missingEvidence: Named enterprise references exist, but no retained source provides deployment depth, spend, or renewal
      detail.
    whyItMatters: Enterprise quality and concentration risk cannot be sized from brand names alone.
    diligencePath: Request named case studies, ACV bands, contract lengths, and renewal evidence for top enterprise accounts.
    relatedQuestionRefs:
    - QU007
    - QU017
    relatedTableRefs:
    - TU003
    - TU005
