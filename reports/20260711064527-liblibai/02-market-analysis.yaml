    - Marketers, studios, ad teams, creators
    - LibTV expands into this adjacent but fast-growing budget
  - - Design-agent / creative workflow tools
    - Design subscriptions, enterprise workflow seats, campaign asset production
    - Non-generative design seats used only for manual editing
    - Design teams, SMBs, marketing orgs
    - Xingliu / Lovart competes here
  - - Model-sharing / creator communities
    - Memberships, community subscriptions, boosts, creator ecosystem spend
    - Pure social communities without generation or model exchange
    - Prosumer creators, hobbyists, semi-pro teams
    - LiblibAI shares DNA with Civitai and SeaArt models/community layer
  - - Enterprise multimodal suites
    - Broader AI-platform spend that includes image/video generation
    - General cloud spend unrelated to content generation
    - Large enterprises and platform teams
    - Big-tech bundling is a major substitute force
  - - Status quo alternatives
    - Agency production, in-house design/video teams, legacy software
    - Unrelated enterprise SaaS
    - Marketing and content budgets
    - Defines the budgets AI tools are trying to displace
  notes: Boundary deliberately focuses on paid creative workflows rather than the entire generative-AI stack.
