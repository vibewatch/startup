chapter:
  number: 2
  title: Market Analysis
  summary: LiblibAI sits inside a fast-growing but definition-sensitive market spanning AI image generation, AI video generation, design-agent tools, and model-sharing communities. Broad ecosystem lenses produce multi-billion-to-tens-of-billions TAMs, while narrow standalone-tool lenses remain much smaller, making market-boundary discipline essential. Buyer demand is real—video is already mainstream, AI-assisted video adoption is above 60%, and cost compression is dramatic—but China's filing, labeling, and safety rules, plus copyright and bundling pressure from large platforms, mean the addressable market should be framed around professional creative workflow budgets rather than the entire generative-AI narrative.
sections:
- id: market-boundary
  title: Market Boundary and Status-Quo Substitutes
  body: |-
    The right market definition for LiblibAI is not “all generative AI” and not even “all AI content.” The company competes where creators and professional teams buy tools to produce visual assets, design outputs, and finished video more quickly than traditional software or agencies can. That market includes text-to-image, image-to-video, text-to-video, design-agent tooling, model-sharing communities, and the surrounding workflow layers that make outputs commercially usable. It excludes foundation-model infrastructure, general-purpose copilots, and most non-generative legacy software unless those products now ship native creative generation that competes for the same budget line. The boundary matters because market reports vary radically depending on whether they count only standalone generators or the broader creative-workflow stack. LiblibAI’s own product direction—community plus API, then video and design adjacencies—supports the broader workflow interpretation. At the same time, real competition still arrives through low-friction substitutes such as Midjourney, Firefly, Canva AI, Civitai communities, Runway, Kling, Jimeng, Hunyuan, and Wanxiang. For diligence purposes, the status quo is not only legacy Adobe or agency production; it is a multi-homing world in which teams mix proprietary tools, open ecosystems, and big-tech bundles as they chase speed, quality, and compliance.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM031
  - CM032
  - CM033
  - CM034
