- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR
    - ~$300M as of May 2026
    - medium-high
    - Anchors top-line scale and valuation context
    - Provide audited revenue, monthly run rate, and mix
  - - Growth rate
    - 30x year-over-year according to Yicai
    - medium
    - Explains why the financing multiple can still look reasonable
    - Provide monthly revenue bridge and cohort growth
  - - Blended annual ARPU
    - ~$10 per registered user based on $300M ARR / 30M users
    - medium
    - Shows how much of the user base is likely free or lightly monetized
    - Disclose paying-user share and payer retention
  - - Inference cost benchmark
    - Public cloud GPU prices span roughly $1.99 to $3.99 per GPU-hour on Lambda
    - medium
    - Margins on generation-heavy products are sensitive to utilization and mix
    - Share actual blended serving cost per image / video minute
  - - Private-model billing pattern
    - Replicate bills for setup, idle, and active time on dedicated private models
    - medium
    - Idle time and queue design can materially compress gross margin
    - Provide utilization, queueing, and reserved-capacity strategy
  - - Gross margin
    - Not publicly disclosed
    - low
    - This is the core missing metric for underwriting software-like quality
    - Disclose gross margin by image, video, and API products
