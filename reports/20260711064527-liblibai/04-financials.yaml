  rows:
  - - LiblibAI API
    - 100 credits = RMB1 list price; basic plan from RMB10
    - Image generation API with Star-3 positioning and business contact
    - Realized discounts and enterprise terms are not public
    - Confirms usage-led monetization rather than seat-only SaaS
  - - Lovart subscriptions
    - Monthly and annual credits reset each cycle; top-up packs do not expire
    - Design-agent generation with credit-controlled usage
    - Headline plan prices are not fully visible in retained output
    - Supports an expandable credit economy across adjacent products
  - - Lovart API
    - 1 image typically costs 1 credit; Pro example includes 5,000 credits monthly
    - Developer access to brand kits, logos, and social assets
    - Official status of all external developer-guide claims should be confirmed in diligence
    - Useful directional proxy for how design workloads can be monetized
  - - Runway video plans
    - $12 / $28 / $76 monthly public plans
    - Transparent credit ladder for image and video workloads
    - Enterprise pricing still custom
    - Shows premium willingness to pay for video-heavy AI workflows
  - - Canva / Figma bundle
    - AI is embedded in broader paid subscriptions or shared team credits
    - AI features sit inside larger design suites
    - Marginal AI monetization is not directly comparable to standalone tools
    - Bundling pressure can compress standalone pricing power
  notes: Public list pricing is not the same as realized pricing, but it is still the best available external evidence on
