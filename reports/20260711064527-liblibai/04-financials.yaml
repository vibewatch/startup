company:
  name: LiblibAI
chapter:
  number: 4
  title: Financials
  summary: 'LiblibAI’s financial story is compelling on headline growth but still thin on underwriting detail. Multiple 2026
    sources converge on roughly $300 million ARR and a nearly $300 million Series B+ at a valuation above $2 billion, while
    official surfaces show a credit-based API monetization model and adjacent design tooling that can support subscriptions,
    usage fees, and enterprise sales. The gaps are equally important: public sources do not disclose revenue mix, gross margin,
    burn, cash on hand, or retention, and third-party databases conflict materially on lifetime funding totals and even basic
    entity filings, so later valuation work should treat the topline as strong but the margin structure as unproven.'
sections:
- id: headline-traction-and-revenue-model
  title: Headline Traction Is Strong, but Revenue Quality Is Still Mostly a Black Box
  body: 'The cleanest public financial signal on LiblibAI is not a detailed income statement but a cluster of mutually reinforcing
    2026 headlines. Yicai, AIbase, BigGo, GPCA, and 36Kr all converge on a nearly $300 million Series B+ and a valuation above
    $2 billion, while Yicai says annual recurring revenue had reached $300 million as of May 2026 and was more than 30 times
    the prior-year level. That is extraordinary growth even if it came off a small base. Official product pages show why the
    figure is plausible directionally: LiblibAI monetizes through credits and subscriptions on its API platform, and the company
    has expanded into adjacent products such as Lovart and LibTV that can support higher-value commercial workflows. But the
    same public record leaves major holes. No retained source discloses the split between creator subscriptions, API usage,
    enterprise contracts, or marketplace take rates. There is also no public gross margin, retention, or deferred-revenue
    disclosure. The result is a financial picture that looks very strong on topline momentum and fundraising validation, while
    remaining unusually opaque on revenue quality and durability.'
