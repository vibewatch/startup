- id: capital-formation-and-adequacy
  title: The Balance Sheet Looks Better After the B+, but Capital Adequacy Still Depends on Margin Reality
  body: 'Public financing history suggests LiblibAI moved rapidly from early application-layer fundraising into a much better
    capital position by mid-2026. Gunder and INCE describe a February 2025 financing followed by a $130 million Series B in
    October 2025, and the June 2026 B+ added nearly another $300 million from a blue-chip syndicate led by Granite Asia, Tencent,
    and Shunwei. That gives management room to invest in compute, model integration, moderation, and expansion into video
    and design tools without immediately returning to market. Still, capital adequacy cannot be judged from round size alone.
    ChinabizInsider’s adverse take is useful precisely because it highlights the strategic vulnerability: Evoken is portrayed
    as an aggregator of third-party model APIs rather than a proprietary foundation-model owner, which may reduce training
    capex but can leave the company exposed to supplier pricing, usage volatility, and platform take-rate compression. Filing
    mirrors add a second caution flag. QCC and Aiqicha provide the required filing evidence, but they also surface entity
    data that is awkward for underwriting, including a low registered capital base and annual-report employment or business-scope
    fields that do not map neatly onto the public AI growth story. That mismatch does not invalidate the operating business,
    but it does mean investors should ask for a reconciled legal-entity map and post-money cash position rather than rely
    on registry pages or databases.'
