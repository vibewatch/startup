- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public signal
  - Revenue quality view
  - Diligence ask
  rows:
  - - API credits
    - Usage-based credit consumption on official API platform
    - 100 credits = RMB1 and API basic plan starts at RMB10
    - Potentially sticky if integrated into production workflows, but margin depends on inference cost
    - Split API revenue by self-serve developers versus enterprise contracts
  - - Individual subscriptions
    - Creator subscriptions and top-ups on LiblibAI platform
    - Headline scale and creator community imply recurring self-serve monetization
    - Likely broad but price-sensitive and multi-homing exposed
    - Provide paying-user count, churn, and ARPPU by cohort
  - - Enterprise / commercial deals
    - Business contact and workflow positioning on API and adjacent products
    - LibTV, Lovart, and team-style positioning imply larger contracts
    - Probably higher-quality revenue if deployment and retention are real
    - Disclose ACV bands, sales-cycle length, and top customer concentration
  - - Design-agent monetization
    - Lovart credit bundles and API access
    - Lovart pricing and developer materials show a separate credit economy
    - Could diversify away from core image generation if adoption holds
    - Show current run-rate contribution from Lovart or Xingliu
  - - Marketplace / ecosystem take rate
    - Model-sharing and creator ecosystem monetization
    - Public sources imply creator incentives but do not disclose take-rate mechanics
    - Unknown until company shares payout and attach-rate economics
    - Clarify whether model sales or boosts are material to ARR
  notes: The table distinguishes directly observed pricing mechanisms from inferred monetization streams that fit the public
    product surface.
