  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin by image, video, API, and marketplace revenue stream is not publicly disclosed.
    whyItMatters: Without gross margin, it is impossible to tell whether LiblibAI behaves like software, cloud resale, or
      a lower-quality usage business.
    diligencePath: Request audited management accounts or board materials with product-level COGS and gross margin.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Cash on hand, monthly burn, and post-B+ runway are not public.
    whyItMatters: Large fundraising does not prove efficient cash conversion or adequate downside protection.
    diligencePath: Request latest balance sheet, cash forecast, and downside runway scenario from finance.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: material
    topic: database-funding
    missingEvidence: Public databases conflict on lifetime capital raised and cannot be reconciled from public evidence alone.
    whyItMatters: Cap-table and dilution analysis depend on a single correct funding chronology.
    diligencePath: Obtain the official financing timeline, cap table, and round-by-round post-money history from management.
    relatedQuestionRefs:
    - QI014
    - QI015
  - type: missing-source
    severity: material
    topic: revenue-mix
    missingEvidence: No retained public source decomposes ARR into subscriptions, API, enterprise, and marketplace revenue.
    whyItMatters: Revenue quality and defensibility depend on mix, not just topline scale.
    diligencePath: Request a revenue-mix waterfall and top-customer summary by product line.
    relatedQuestionRefs:
    - QI005
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
