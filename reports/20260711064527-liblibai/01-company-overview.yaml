company:
  name: LiblibAI
chapter:
  number: 1
  title: Company Overview
  summary: LiblibAI, now grouped under the Evoken corporate brand, grew from a 2023 AI image community into a multi-product creative-content platform spanning image generation, video production, and design agents. Public evidence supports a June 2026 B+ round of nearly $300 million at a valuation above $2 billion, plus reported ARR of $300 million, 30 million cumulative users, 500,000 original models, and a rapid expansion into LibTV and Xingliu. The same record also shows governance opacity, inconsistent third-party funding totals, and an April 2026 moderation incident, so later chapters should treat scale claims as directionally strong but still selectively disclosed.
sections:
- id: identity-and-founding
  title: Identity, Founding, and Corporate Footprint
  body: |-
    LiblibAI started in the first wave of post-Stable-Diffusion Chinese visual-AI startups, but the public record shows a company that moved quickly from a creator tool into a broader content-production platform. Baidu Baike, Yicai, and 36Kr all point to a March 2023 founding around Chen Mian, a former ByteDance CapCut/Jianying commercialization executive who left consumer internet with a sharper thesis: professional creators would become the first durable paying cohort for generative tools. The operating legal entity, Beijing Yanyu Technology, was incorporated on 2023-05-16 and is registered in Haidian District, Beijing. By mid-2026 the parent brand had shifted to Evoken, signaling that management no longer wanted to present LiblibAI as only an image-generation community. Official surfaces still keep the LiblibAI brand front and center for the flagship product, but the corporate story now spans image, video, and agentic design workflows. Public biographical disclosure remains founder-heavy, which is common for Chinese private startups but still leaves diligence questions around the full leadership bench, board composition, and internal division of labor. The available evidence is strong enough to establish identity and founder-market fit, but not strong enough to infer governance maturity beyond the founder-led operating core.
  claimRefs:
