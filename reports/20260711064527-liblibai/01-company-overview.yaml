- id: milestones-governance-and-adverse-context
  title: Milestones, Governance Gaps, and Adverse Context
  body: |-
    A useful diligence lens for LiblibAI is to keep the celebratory growth story and the stress signals in the same frame. On the positive side, the milestone cadence is real: founding in 2023, rapid financing through 2025, the October 2025 LiblibAI 2.0 release, the March 2026 LibTV launch, the May 2026 team edition, and the June 2026 Evoken rebrand plus B+ financing. On the negative side, the same public record shows why the story cannot be accepted at face value. 36Kr recounts an early near-bankruptcy period after filing disruption and subsidy burn, which implies that capital discipline was not always a strength. More importantly, OECD, OFweek, and AIbase preserved the April 2026 moderation failure in which evasive prompts produced explicit content, forcing a public apology and technical remediation. For a company building in China’s regulated AI-content market, that is not just a product bug; it is a governance and licensing-relevance event. The company’s response appears fast and substantive, but the incident shows that operational controls remain part of the investment thesis, not a side note. The overall picture is therefore a high-velocity founder-led platform with clear product-market momentum, still carrying governance opacity and content-safety execution risk that later chapters must keep in scope.
  claimRefs:
  - CO025
  - CO030
