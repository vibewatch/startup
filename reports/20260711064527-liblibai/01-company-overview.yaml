  title: Governance and dependency risk remain under-disclosed
  body: Public sources do not reconcile the cap table, full board, or supplier dependency profile, while adverse analysis argues that API-provider pricing and first-party competition could compress the moat if workflow stickiness fails to deepen.
  claimRefs:
  - CO010
  - CO040
  - CO043
- calloutType: insight
  title: The monetization story appears more workflow-driven than consumer-subscription-driven
  body: Official pricing, creator-tool surfaces, and June 2026 coverage all point toward professional production budgets and repeat workflow usage as the revenue engine, which matters for how later customer and valuation chapters should interpret the reported 30 million users.
