  - type: private-evidence-only
    severity: material
    topic: headcount-and-footprint
    missingEvidence: A current employee count, office footprint, and functional distribution across product, safety, and go-to-market teams.
    whyItMatters: Efficiency, burn, and operating leverage cannot be underwritten from user and ARR claims alone without knowing staffing scale and org shape.
    diligencePath: Ask management for headcount by function and location plus the last two recruiting plans.
