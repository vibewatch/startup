  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-control
    missingEvidence: A reconciled cap table, board roster, observer rights, and reserved-matters schedule for the 2025 and 2026 rounds.
    whyItMatters: The investment case depends on who controls governance after two large rounds and whether strategic investors hold rights that affect future financing or exit paths.
    diligencePath: Request current cap table, board consents, and term-sheet side letters in a diligence room; reconcile with investor interviews.
    relatedQuestionRefs:
    - QO019
    - QO023
    relatedTableRefs:
