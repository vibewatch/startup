evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-control
    missingEvidence: A reconciled cap table, board roster, observer rights, and reserved-matters schedule for the 2025 and 2026 rounds.
    whyItMatters: >-
      The investment case depends on who controls governance after two large rounds and whether strategic investors hold
      rights that affect future financing or exit paths.
    diligencePath: >-
      Request current cap table, board consents, and term-sheet side letters in a diligence room; reconcile with
      investor interviews.
    relatedQuestionRefs:
      - QO019
      - QO023
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount-and-footprint
    missingEvidence: >-
      A current employee count, office footprint, and functional distribution across product, safety, and go-to-market
      teams.
    whyItMatters: >-
      Efficiency, burn, and operating leverage cannot be underwritten from user and ARR claims alone without knowing
      staffing scale and org shape.
    diligencePath: Ask management for headcount by function and location plus the last two recruiting plans.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding-ledger
    missingEvidence: >-
      A source-of-truth financing ledger that reconciles angel, 2025 rounds, the 2025 Series B, and the 2026 Series B+
      against third-party databases.
    whyItMatters: >-
      Lifetime capital raised and dilution assumptions vary materially depending on whether Tracxn, CB Insights, or
      media summaries are closer to the cap-table truth.
    diligencePath: Reconcile funding history from signed transaction docs and shareholder registers rather than database summaries.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financial-quality
    missingEvidence: >-
      Audited revenue mix, gross margin, compute pass-through cost, burn, and cash runway behind the reported $300
      million ARR figure.
    whyItMatters: >-
      The headline ARR is impressive, but valuation and sustainability depend on margin quality, enterprise mix, and the
      cost of third-party model access.
    diligencePath: >-
      Request monthly management accounts, cohort retention by product, and supplier-cost schedules for model APIs and
      compute.
    relatedQuestionRefs:
      - QO009
      - QO013
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: china-sam
    missingEvidence: >-
      A clean China-specific breakdown of paid image, design, and video workflow spend that maps to LiblibAI's
      professional use cases.
    whyItMatters: Public global TAMs overstate the directly serviceable budget for a China-rooted application platform.
    diligencePath: >-
      Request management segmentation by geography, product, and customer type; compare against Chinese ad-tech, design,
      and short-drama budgets.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: primary-cac-text
    missingEvidence: Direct fetchable copies of CAC primary texts for filing, deep synthesis, and labeling rules.
    whyItMatters: Current retained legal summaries are sufficient for direction but not ideal for clause-level compliance analysis.
    diligencePath: Retry direct CAC fetches or obtain mirrored official translations / PDFs for the cited rules.
    relatedQuestionRefs:
      - QM020
      - QM022
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: material
    topic: buyer-mix
    missingEvidence: Segment-level revenue split between creators, agencies, brands, and enterprises for LiblibAI and LibTV.
    whyItMatters: The attractiveness of the market depends on which buyer cohorts actually convert into recurring spend.
    diligencePath: Request cohort revenue by customer type, ACV, and renewal behavior.
    relatedQuestionRefs:
      - QM011
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: market-estimates
    missingEvidence: A harmonized model that normalizes market estimates to one definition and one time horizon.
    whyItMatters: Public reports use incompatible boundaries, which can distort top-down sizing and multiple selection.
    diligencePath: Normalize every retained report to a common scope before using the figures in valuation work.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: private-peer-metrics
    missingEvidence: >-
      Peer ARR, paying-user counts, and realized enterprise contract values for most private competitors remain
      undisclosed.
    whyItMatters: >-
      Without comparable revenue quality or enterprise ACV data, competitive share and pricing power are hard to
      underwrite cleanly.
    diligencePath: Request management’s win-loss deck and any third-party market-share or enterprise-customer benchmarks.
    relatedQuestionRefs:
      - QP023
  - type: missing-source
    severity: material
    topic: multi-homing
    missingEvidence: Public data on how many creators use LiblibAI exclusively versus across several image and video tools is absent.
    whyItMatters: Creator multi-homing determines whether reported scale converts into durable pricing power and retention.
    diligencePath: Request cohort retention, creator posting overlap, and wallet-share surveys or internal attribution data.
    relatedQuestionRefs:
      - QP020
      - QP024
    relatedTableRefs:
      - TP004
  - type: access-blocked
    severity: minor
    topic: private-pricing
    missingEvidence: >-
      Some competitor pricing and enterprise packaging details remain gated behind sign-in flows or negotiated sales
      processes.
    whyItMatters: The public comparison is directionally useful but still weak on realized discounts and procurement terms.
    diligencePath: Collect screenshots or sales quotes from management’s competitive intelligence repository for the top five rivals.
    relatedQuestionRefs:
      - QP018
      - QP019
