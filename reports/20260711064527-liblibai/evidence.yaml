    whyItMatters: Fast-moving AI competitors can shift product direction faster than stale market maps capture.
    diligencePath: Refresh peer maps quarterly using direct product pages and current investor or media coverage.
    relatedQuestionRefs:
      - QP022
  - type: private-evidence-only
    severity: blocking
    topic: gross-margin
    missingEvidence: Gross margin by image, video, API, and marketplace revenue stream is not publicly disclosed.
    whyItMatters: >-
      Without gross margin, it is impossible to tell whether LiblibAI behaves like software, cloud resale, or a
      lower-quality usage business.
    diligencePath: Request audited management accounts or board materials with product-level COGS and gross margin.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
