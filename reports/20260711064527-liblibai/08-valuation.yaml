- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Direction
  - Why it is persuasive
  - What would change the view
  rows:
  - - Commercial proof already exists
    - Bullish
    - Few AI creative platforms disclose both very large user scale and $300M ARR
    - Revenue restatement or weak payer concentration data
  - - Valuation is moderate versus AI private comps
    - Bullish
    - Runway, Moonshot, and hot China AI marks imply much richer pricing regimes
    - A sharp sector-wide multiple reset or failed financing follow-on
  - - Moat is weaker than the topline suggests
    - Bearish
    - Aggregator dependence and big-tech bundling can compress both margin and demand
    - Evidence of durable enterprise lock-in or proprietary-model advantage
  - - Regulatory burden is not theoretical
    - Bearish
    - The April 2026 moderation incident shows compliance risk already touches operations
    - Clean multi-quarter safety record and no further public incidents
  - - Missing unit economics cap conviction
    - Bearish
    - Gross margin, revenue mix, and preference overhang are undisclosed
    - Private diligence confirms strong margins and clean financing terms
  notes: The anti-thesis is not a generic “competition exists” objection; it is specifically about whether valuation deserves
    a premium before revenue quality is proven.
