company:
  name: LiblibAI
chapter:
  number: 8
  title: Valuation
  summary: 'At a $2 billion-plus valuation on $300 million ARR, LiblibAI is not cheap in absolute terms, but it is notably
    cheaper than many AI private comps when adjusted for disclosed commercial proof. The company already shows scale that
    many frontier-model or AI-video peers do not publicly show, yet the investment case is still constrained by missing gross-margin,
    preference-stack, and enterprise-conversion detail. The right framing is therefore price-sensitive optimism: the current
    mark can support a buy view for investors who believe LiblibAI can convert image-community dominance into multi-product
    monetization without suffering regulatory or bundling-driven compression.'
sections:
- id: price-versus-proof
  title: The Current Price Is Demanding, but the Revenue Proof Is Unusually Concrete for a Private AI App
  body: 'LiblibAI’s current mark should be judged first against what is actually disclosed, not against the general excitement
    around AI. Yicai, AIbase, BigGo, and GPCA all support the same broad picture: by mid-2026 the company had crossed $300
    million ARR, reached 30 million-plus users, and closed a nearly $300 million Series B+ at a valuation above $2 billion.
    That combination matters because it is rare. Many AI private rounds are priced primarily on model prestige, strategic
    scarcity, or future platform optionality rather than demonstrated commercial scale. LiblibAI, by contrast, already has
    a large consumer community, monetized API and workflow surfaces, and multiple product vectors beyond one chatbot or one
    model. The math is still aggressive—roughly 6.7x ARR—but that multiple is far easier to defend than marks given to Chinese
    frontier-model companies with thinner public revenue disclosure. The anti-thesis is equally important: public evidence
    still does not disclose gross margin, paying-user ratio, enterprise mix, or the preference stack attached to the 2026
    financing. So the price is supported, but only at medium confidence.'
