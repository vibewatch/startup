  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Public reporting does not show liquidation preferences, participation rights, secondary sales, or option-pool
      expansion tied to the 2026 B+ round.
    whyItMatters: Late-stage return math can differ materially from the headline post-money valuation if investor protections
      are heavy.
    diligencePath: Request executed term sheet, cap table, and post-financing ownership waterfall.
    relatedQuestionRefs:
    - QV006
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: There is no audited public disclosure of gross margin, contribution margin, or revenue mix across subscription,
      API, enterprise, and marketplace streams.
    whyItMatters: Without these inputs, it is impossible to know whether a 6.7x ARR multiple is cheap or expensive on a quality-adjusted
      basis.
    diligencePath: Request monthly management accounts, cohort margin analysis, and GPU-spend sensitivity by product line.
    relatedQuestionRefs:
    - QV005
    - QV024
    - QV030
    relatedTableRefs:
    - TV006
  - type: missing-source
    severity: minor
    topic: private-comparable-precision
    missingEvidence: Several private AI comp valuations rely on media reports or analyst estimates rather than audited filings.
    whyItMatters: Comparable analysis is directionally useful but should not be mistaken for precise mark-to-market truth.
    diligencePath: Cross-check with investor decks, secondary market data, or direct portfolio marks where available.
