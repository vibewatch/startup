- id: comparable-stack
  title: Compared with AI Private Rounds, LiblibAI Looks Disciplined; Compared with Mature Software, It Still Prices in Ambition
  body: 'The best way to read LiblibAI’s valuation is to triangulate across three comp buckets rather than force one false
    peer set. Against mature public creative software, Adobe is the cleanest benchmark: its enterprise value and trailing
    revenue imply a revenue multiple in the mid-3x range, meaning LiblibAI still trades at a sizable premium to scaled, highly
    profitable software. Against AI-native private application peers, however, the picture changes. Runway’s February 2026
    $5.3 billion round, when paired with Sacra’s revenue estimates, implies a materially richer revenue multiple than LiblibAI
    on both trailing and guided revenue bases. Midjourney is self-funded and not directly marked by investors, but independent
    market-data sources describe it as a much larger image-monetization machine than most peers, reinforcing that category
    leaders can command premium value. Chinese frontier-model names such as Moonshot and MiniMax show even hotter capital
    markets behavior: public references cite multi-billion-dollar valuations or IPO marks despite limited audited revenue
    transparency. In that context, LiblibAI’s disclosed ARR makes its multiple look more grounded than frothy.'
