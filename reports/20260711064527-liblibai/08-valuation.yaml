- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Valuation / status
  - Revenue / ARR context
  - Why it matters
  - Limitation
  rows:
  - - LiblibAI
    - '>$2.0B private mark (June 2026)'
    - '>$300M ARR, 30M+ users'
    - Anchor case; unusually concrete AI app commercial disclosure
    - Private, unaudited, and mix unknown
  - - Adobe
    - ~$90.35B enterprise value
    - ~$25.2B TTM revenue, ~3.6x EV/revenue
    - Public benchmark for scaled creative software valuation
    - Mature, profitable incumbent not a hypergrowth AI app
  - - Runway
    - ~$5.3B private mark (Feb 2026)
    - ~$90M annualized revenue in mid-2025; Sacra says $265M–$300M annualized target by end-2026
    - Best AI-video application comp; market pays a premium for modality expansion
    - Revenue estimate, not audited disclosure
  - - Midjourney
    - No public financing mark; self-funded
    - Sacra estimated $200M ARR in 2023; Axis estimated ~$500M 2025 revenue
    - Shows a category-leading image product can monetize at enormous scale
    - No clean observed valuation multiple
  - - Moonshot AI
    - ~$20B private mark (May 2026)
    - Public sources emphasize funding scale more than audited revenue
    - Shows how richly China AI leaders can be valued despite limited financial transparency
    - Not directly comparable because it is a frontier-model lab
  - - MiniMax
    - ~$6.5B IPO pricing mark, with some public references higher on debut
    - Public listing and product breadth make it a China AI sentiment marker
    - Useful for reading exit appetite in Hong Kong markets
    - Public references conflict on the exact mark used
  - - Stability AI
    - Funding/restructuring benchmark, not clean premium comp
    - Sacra estimated ~$50M 2024 revenue after recapitalization
    - Reminder that open-model leaders can face valuation compression and financing stress
    - No fresh clean 2026 valuation mark in retained sources
  notes: 'This is a mixed comp set by design: no single pure-play public or private peer captures LiblibAI’s combination of
    community image generation, model ecosystem, video, and design tools.'
