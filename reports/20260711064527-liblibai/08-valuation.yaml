  - CV043
  - CV045
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Revenue mix
    - Split of subscription, enterprise/API, and marketplace revenue
    - Determines durability and proper multiple selection
    - Management data room / finance team
  - - Gross margin after compute
    - Contribution margin by product line and GPU cost sensitivity
    - Separates impressive ARR from truly attractive economics
    - CFO model plus vendor contracts
  - - Preference stack and dilution
    - Liquidation preferences, seniority, option pool expansion, and secondary activity
    - Private-round IRR depends on cap-table terms, not just headline valuation
    - Legal docs and term sheets
  - - Enterprise quality
    - Named paying customers, ACV ranges, renewals, and security/compliance proofs
    - Tests whether enterprise revenue can deepen ARPU and hold up under scrutiny
    - Sales ops, customer references, renewal cohorts
  - - Safety and compliance controls
    - Post-incident controls, moderation staffing, and regulatory filings by product
    - Key to defending both growth and exit readiness
    - Trust-and-safety review plus counsel memo
  notes: If the company can answer these five asks cleanly, the current valuation becomes much easier to defend as attractive
    rather than merely fair.
