- id: operating-architecture-and-dependencies
  title: The Technical Stack Is Orchestration-Led and Deeply Dependent on External Model Ecosystems
  body: 'Public evidence points to an architecture built around aggregation and orchestration rather than a single vertically
    integrated foundation model. LiblibAI’s own API materials describe Star-3 image capabilities and custom-model access,
    but the surrounding ecosystem evidence suggests the platform remains tightly coupled to the wider open-model universe.
    Flowith portrays Liblib.art’s rise as tied to Stable Diffusion, LoRA checkpoints, and workflow sharing. Black Forest Labs
    offers FLUX via API or open weights, Stability markets enterprise-ready creative production, Kolors is openly distributed
    through Hugging Face, and LibTV’s public descriptions say it can switch among dozens of outside models including Kling,
    Wan, Midjourney, and Seedance. That architectural choice has clear benefits: LiblibAI can move quickly, present users
    with model breadth, and monetize workflow layers without training every underlying foundation model itself. But it also
    creates dependencies on model quality, licensing, supplier economics, and API availability outside management’s full control.
    The strongest product-technology thesis is therefore not proprietary model supremacy; it is the ability to wrap many models
    in a community and workflow system that is easier for Chinese creators and teams to use productively.'
  claimRefs:
  - CE003
