- id: workflow-and-developer-stack
  title: Workflow Depth and Developer Tooling Differentiate the Platform from Simple Generators
  body: 'The most convincing product-technology evidence is around workflow depth. LibTV is repeatedly described not as a
    one-shot prompt box but as a structured AI video operating environment. AIGC and Gongke both describe it as an infinite-canvas,
    node-based workflow system that takes creators from script and storyboard through image, video, audio, subtitles, and
    final export. Gongke further says LibTV aggregates more than 30 models and exposes a Skill interface so AI agents can
    orchestrate production steps. On the developer side, official and community tooling also show real API maturity. LiblibAI’s
    official API page markets Star-3 and custom model access, while the public Go wrapper exposes text-to-image, image-to-image,
    status polling, and additional-network fields such as model IDs and weights. The Rust CLI for LibTV-style generation says
    it talks directly to the official openapi.liblibai.cloud endpoint using HMAC-SHA1 signed requests and asynchronous generation
    polling. The npm package adds a smaller but still useful signal that outside developers are packaging against the platform.
    Together these artifacts suggest a genuine operating platform: workflow orchestration, generation endpoints, and developer
    abstractions rather than a purely consumer-facing UI.'
  claimRefs:
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
