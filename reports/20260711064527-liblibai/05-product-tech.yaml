chapter:
  number: 5
  title: Product & Technology
  summary: LiblibAI’s product surface now looks like a layered creative stack rather than a single image generator. Official
    pages and third-party technical coverage show a community-centered platform with creator, asset, teaching, API, and video
    surfaces, plus adjacent design-agent tooling through Lovart/Xingliu. The evidence also shows that LiblibAI’s technical
    advantage is orchestration and workflow packaging on top of open and third-party models—supported by APIs, HMAC-signed
    developer tooling, and multi-model video workflows—while its main technical risks are dependency on external model ecosystems
    and still-limited public proof on trust, mobile maturity, and proprietary model depth.
sections:
- id: product-surface-and-modules
  title: LiblibAI Has Expanded from an Image Community into a Full Creative Surface
  body: 'The official product surface now spans much more than image generation. LiblibAI’s about page links users into the
    main platform, assets, creator center, teaching resources, APIs, and LibTV, which implies that management sees community,
    learning, monetization, and production as one integrated product family. The homepage still brands LiblibAI as a leading
    AI creation platform, while AIbase’s 2025 write-up on LiblibAI 2.0 describes the product shift more explicitly: the platform
    moved from a collection of models and tools toward a full AI studio for creators. Flowith adds useful ecosystem context
    by describing Liblib.art as the largest Chinese-language model and workflow community, rooted in Stable Diffusion and
    LoRA sharing rather than only prompt-to-image usage. Lovart extends the stack further into professional design, while
    LibTV carries it into structured video production. The technical implication is important. LiblibAI is not merely a web
    front end over one model. It is a product portfolio that tries to own asset discovery, creator incentives, API consumption,
    training/sharing behavior, and increasingly the end-to-end workflow from ideation to delivery.'
  claimRefs:
  - CE001
  - CE002
  - CE012
  - CE015
  - CE017
  - CE018
  - CE030
  - CE037
