    severity: material
    topic: proprietary-depth
    missingEvidence: Public sources do not cleanly separate proprietary LiblibAI model IP from third-party model aggregation
      and fine-tuning.
    whyItMatters: The strength of the technical moat depends on how much of the stack the company truly controls.
    diligencePath: Request internal architecture diagrams, model ownership map, and external API spend by model family.
