        - Can block launch or trigger takedown if not compliant
        - What filings does LiblibAI / LibTV maintain today?
      - - AI-content labeling
        - Visible + invisible labeling required from Sep 2025
        - Image/video platforms
        - Adds watermarking / metadata burden and moderation overhead
        - How automated is labeling across outputs and APIs?
      - - Deep synthesis governance
        - Synthetic image/video/text subject to deep-synthesis rules
        - Consumer-facing creation tools
        - Raises safety, traceability, and disclosure expectations
        - What red-team and recall processes exist?
      - - Anthropomorphic AI measures
        - July 2026 measures add minors, disclosure, and safety-threshold rules
        - Agentic / companion / interactive AI services
        - Expands governance burden as agents become more autonomous
        - Does any LiblibAI agent workflow trip these thresholds?
      - - Copyright litigation
        - 70+ image-AI lawsuits by late 2025
        - Image platforms and commercial users
        - Can affect dataset trust and enterprise willingness to adopt
        - What indemnities or provenance controls can vendors offer?
      - - Brand trust and output quality
        - 89% say video quality affects brand trust
        - Marketing buyers
        - Low-quality output can depress ROI and renewals
        - How do teams govern quality at scale?
    notes: >-
