  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The right market definition for LiblibAI is not “all generative AI” and not even “all AI content.” The
              company competes where creators and professional teams buy tools to produce visual assets, design outputs,
              and finished video more quickly than traditional software or agencies can. That market includes
              text-to-image, image-to-video, text-to-video, design-agent tooling, model-sharing communities, and the
              surrounding workflow layers that make outputs commercially usable. It excludes foundation-model
              infrastructure, general-purpose copilots, and most non-generative legacy software unless those products
              now ship native creative generation that competes for the same budget line. The boundary matters because
              market reports vary radically depending on whether they count only standalone generators or the broader
              creative-workflow stack. LiblibAI’s own product direction—community plus API, then video and design
              adjacencies—supports the broader workflow interpretation. At the same time, real competition still arrives
              through low-friction substitutes such as Midjourney, Firefly, Canva AI, Civitai communities, Runway,
              Kling, Jimeng, Hunyuan, and Wanxiang. For diligence purposes, the status quo is not only legacy Adobe or
              agency production; it is a multi-homing world in which teams mix proprietary tools, open ecosystems, and
              big-tech bundles as they chase speed, quality, and compliance.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM031
              - CM032
