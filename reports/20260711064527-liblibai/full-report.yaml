      - number: '1.2'
        title: Capital Formation, Investor Syndicate, and Ownership Signals
        blocks:
          - type: paragraph
            body: >-
              Evoken’s capital history is unusual for the speed with which it moved from near-survival to unicorn
              status. Public reporting supports a credible sequence: an early angel round in 2023, a stressed period in
              2024 after a filing-related shutdown and aggressive subsidy spend, a February 2025 rescue-and-expansion
              round led by INCE and Shunwei, a $130 million Series B in October 2025 led by HongShan and CMC with a
              strategic investor widely reported as Ant Group, and then a nearly $300 million Series B+ in June 2026 at
              a valuation above $2 billion. The most recent syndicate is blue-chip by China application-layer standards,
              with Granite Asia, Tencent, and Shunwei leading and a broad set of prior backers following on. That
              investor depth matters because it reduces near-term financing risk and gives the company access to
              strategic channels. It does not, however, eliminate uncertainty around primary-versus-secondary mix,
              liquidation stack, or board control rights. Public databases also disagree sharply on total capital
              raised, with Tracxn and CB Insights showing incompatible tallies. That discrepancy is itself a diligence
              signal: the company is private, disclosure is selective, and any investment view should rely on a
              reconciled cap table rather than third-party databases alone.
