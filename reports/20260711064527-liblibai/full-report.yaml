        title: Public Pricing Surfaces Suggest Freemium and Usage Monetization, but Compute Sensitivity Remains High
        blocks:
          - type: paragraph
            body: >-
              LiblibAI’s own API page makes the business model more concrete than the fundraising headlines do. The page
              states that API image generation consumes credits, that 100 credits equals RMB1 at list price, and that an
              API basic plan starts from RMB10, which is a classic usage-led design rather than a pure flat-seat SaaS
              model. Lovart’s pricing and API materials reinforce the same pattern: monthly and annual credits reset by
              billing cycle, top-up packs do not expire, and a typical image generation costs roughly one credit with
              higher-volume plans available for heavier users. This credit architecture is attractive because it aligns
              revenue with usage spikes and allows upsell from hobbyist experimentation into professional production. It
              also exposes margins to compute intensity. Replicate explains that private model hosting bills for setup,
              idle, and active processing time, while Lambda’s public pricing puts H100 instances at about $3.99 per
              GPU-hour and A100 instances at roughly $1.99 to $2.79 per GPU-hour. Modal’s pricing examples show the same
              theme: serverless GPU workloads can compound quickly at scale even before support, bandwidth, and
              moderation overhead are added. Public pricing from Runway, Figma, and Canva also matters because these
              companies normalize either premium video pricing or AI embedded inside broader subscriptions, creating
              both a willingness-to-pay benchmark and competitive pressure on standalone monetization.
