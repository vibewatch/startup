      - number: '2.4'
        title: 'Constraints: Regulation, Copyright, Skills, and Bundling Pressure'
        blocks:
          - type: paragraph
            body: >-
              This market is growing fast, but it is not frictionless. China’s AI regime is unusually operational:
              filing, labeling, deep-synthesis rules, and newer anthropomorphic-AI obligations all add cost and slow
              reckless iteration. For image and video platforms, moderation and traceability are not optional product
              features—they are market-entry requirements. Copyright risk is similarly structural. Axis records more
              than 70 AI image copyright lawsuits by late 2025, and legal trackers show that China now expects
              increasingly specific labeling and audit discipline. Adoption constraints also remain inside the buyer
              organization. Wyzowl suggests that cost is no longer the dominant blocker for many teams; in-house skills,
              perceived necessity, and quality control have become more important. Meanwhile, the substitute set is
              crowded with large platforms that can bundle generative features into broader clouds, productivity suites,
              and creator ecosystems. OpenAI’s Sora discontinuation is the cautionary extreme: category demand does not
              guarantee sustainable unit economics if compute burns faster than revenue. For LiblibAI, this means the
              market opportunity is real but conditional. Winning requires not just model access or growth marketing,
              but durable workflow value, trust, and regulatory execution under heavy substitute pressure.
            claimRefs:
