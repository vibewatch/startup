      - number: '2.3'
        title: Buyers, Budget Owners, and Growth Drivers
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence for demand comes from behavior rather than vendor optimism. Wyzowl’s 2026 survey
              shows that video is already a core marketing medium for most businesses, that AI-assisted video usage has
              crossed into the majority, and that spending intent remains positive. That matters because LiblibAI’s
              adjacencies—LibTV and design tooling—are competing for marketing, e-commerce, studio, and agency budgets
              rather than only hobbyist spending. Axis adds the supply-side explanation: AI video production costs have
              collapsed relative to traditional workflows, which expands the set of campaigns and assets that can be
              produced profitably. On the design side, Worldmetrics argues that 40% of professional designers already
              use AI daily, suggesting that creative professionals are no longer testing from the sidelines. The buyer
              map is therefore broad but still legible: marketers want throughput and ROI, designers want controllable
              visuals, studios want faster production, and enterprises want multimodal tools embedded in existing
              workflows. Growth is driven by lower cost, faster iteration, the mainstreaming of video as a marketing
              channel, and the spread of multimodal generation into design and content operations. The most investable
              part of demand is the professional workflow layer where switching friction and repeat spend can become
              real.
