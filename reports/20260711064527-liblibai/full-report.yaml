              heavily China-first: Flowith explicitly frames the platform as a Mandarin-speaking creative commons, and
              the official product surfaces are predominantly Chinese even though a U.S.-facing about page exists.
              Customer concentration is also a real possibility because named enterprise proof is sparse and the company
              does not disclose revenue by cohort or customer type. Independent traffic tools and startup directories
              were either blocked or low-resolution during this run, which further limits external verification.
              Finally, the OECD-preserved moderation incident and adverse reporting on subsidized growth matter for
              customer trust. If enterprise buyers worry about safety controls or the durability of a model-aggregator
              strategy, conversion from community scale into durable commercial spend could slow even if creator usage
              remains strong.
