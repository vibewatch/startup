  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The Current Price Is Demanding, but the Revenue Proof Is Unusually Concrete for a Private AI App
        blocks:
          - type: paragraph
            body: >-
              LiblibAI’s current mark should be judged first against what is actually disclosed, not against the general
              excitement around AI. Yicai, AIbase, BigGo, and GPCA all support the same broad picture: by mid-2026 the
              company had crossed $300 million ARR, reached 30 million-plus users, and closed a nearly $300 million
              Series B+ at a valuation above $2 billion. That combination matters because it is rare. Many AI private
              rounds are priced primarily on model prestige, strategic scarcity, or future platform optionality rather
              than demonstrated commercial scale. LiblibAI, by contrast, already has a large consumer community,
              monetized API and workflow surfaces, and multiple product vectors beyond one chatbot or one model. The
              math is still aggressive—roughly 6.7x ARR—but that multiple is far easier to defend than marks given to
              Chinese frontier-model companies with thinner public revenue disclosure. The anti-thesis is equally
              important: public evidence still does not disclose gross margin, paying-user ratio, enterprise mix, or the
              preference stack attached to the 2026 financing. So the price is supported, but only at medium confidence.
            claimRefs:
