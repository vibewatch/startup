      - number: '8.4'
        title: >-
          Exit Paths Exist, but Final Underwriting Still Requires Private Evidence on Margins, Preferences, and
          Enterprise Quality
        blocks:
          - type: paragraph
            body: >-
              LiblibAI is much closer to exit readiness than an early-stage AI lab because it already has scale, a
              financing syndicate led by major Chinese technology and venture investors, and a product portfolio broad
              enough to support an IPO narrative. The two most credible paths are a Hong Kong listing for a China-first
              AI application champion or a strategic outcome involving a major ecosystem investor such as Tencent if
              independent scale-building stalls. But readiness is not the same as readiness at any price. The final
              underwriting gap is clear: public evidence does not show liquidation preferences, secondary sales,
              retention by payer cohort, contribution margin after GPU spend, or a clean split between subscription,
              enterprise, and marketplace revenue. Without those details, investors can defend the current mark only as
              fair-to-attractive rather than obviously cheap. That is why the final diligence asks focus less on
              abstract TAM and more on revenue quality, control systems, and the exact circumstances under which the
              2026 narrative could break.
            claimRefs:
              - CV025
