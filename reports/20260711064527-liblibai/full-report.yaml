      - number: '3.4'
        title: Durability Depends on Community Liquidity, Not Exclusive Models
        blocks:
          - type: paragraph
            body: >-
              The evidence does not support a strong claim that LiblibAI owns a uniquely defensible base model moat. The
              more durable moat candidates are community liquidity, localization, model inventory, moderation/compliance
              adaptation for China, and the ability to convert a huge free creator base into recurring workflow spend.
              Black Forest Labs and Stability both make it easier for developers and creators to access powerful models
              without committing to one end-user platform. Civitai and Hugging Face keep discovery and experimentation
              open. Midjourney, Ideogram, Runway, Canva, and Figma all make multi-homing rational because each optimizes
              a different job: artistic image generation, typography, video, marketing design, or collaborative product
              design. Even OpenAI’s decision to discontinue the Sora web and app product in 2026 shows how quickly
              modality leadership can shift at the application layer. The resulting competitive verdict is balanced.
              LiblibAI has a real position because it combines China-first distribution with an open model community and
              adjacent commercial tools, but its moat is operational and ecosystem-driven rather than rooted in a closed
              proprietary model. That makes execution quality—community retention, enterprise conversion, creator
              incentives, and compliance—more important than headline model parity alone.
