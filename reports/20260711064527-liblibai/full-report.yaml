            title: LiblibAI looks cheaper than the AI hype cycle, not cheaper than software
            body: >-
              That distinction matters. Versus Adobe or other mature public software, the company still trades at a
              premium. Versus AI-native private application and model leaders, the current price looks restrained given
              the disclosed ARR base.
