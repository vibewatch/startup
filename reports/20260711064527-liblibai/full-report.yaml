      - number: '2.2'
        title: TAM / SAM / SOM Lenses Need Boundary Discipline
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is useful only when the scope of each estimate is explicit. The broadest lens
              treats AI image and creative workflows as an ecosystem and produces very large numbers: Axis cites a $9.1
              billion 2025 image-generation market growing to $272.8 billion by 2035, while Worldmetrics cites a $45.5
              billion 2027 AI creative-industry outcome and an $11.8 billion 2030 AI creative-tools market. Narrower
              point estimates are much smaller: Axis also cites a $349.6 million 2023 standalone AI image-generator
              market growing to just over $1 billion by 2030, while the AI video-generator market is still under $1
              billion in 2026 even after rapid adoption. The practical takeaway is that LiblibAI should not be valued
              against the largest “all creative AI” TAM by default. Its serviceable market is closer to paid
              professional workflows across image, design, and video creation, especially where users need structured
              production rather than novelty images. Public sources are good enough to define directional TAM and a
              likely professional-workflow SAM, but they do not isolate a clean Liblib-specific SOM. That last step
              needs internal data on paying creators, enterprise accounts, category mix, geography, and retention.
            claimRefs:
