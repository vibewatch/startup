      - number: '1.3'
        title: Product Matrix, Operating Scale, and Monetization Logic
        blocks:
          - type: paragraph
            body: >-
              The strongest company-overview evidence is not the financing itself but the shape of the product matrix
              behind it. LiblibAI remains the anchor community and distribution surface: public sources say it serves
              more than 30 million cumulative users, hosts more than 500,000 original models, and now generates more
              than 5 million images per day. Official API materials add an important monetization clue by showing a
              structured credit economy, paid packages, and support for both proprietary and custom models. That points
              to a business that is broader than casual consumer subscriptions. It spans creators who buy credits,
              developers or studios that use APIs, and professional content teams that convert from experimentation into
              workflow spend. The second and third products extend that logic. LibTV is built around structured video
              production rather than one-off generation, and public guides emphasize node workflows, team collaboration,
              and agent access rather than only flashy model demos. Lovart and its domestic Xingliu variant push the
              company from image tooling into design execution. Taken together, the evidence supports management’s claim
              that Evoken is building an AI content chain from assets to production to delivery. The caveat is that many
              of the headline metrics remain company-claimed, so later financial and customer chapters must test how
              much of this scale converts into repeatable, high-margin revenue.
