      - number: '8.3'
        title: The Return Case Depends More on Mix Quality and Regulation Than on Topline Alone
        blocks:
          - type: paragraph
            body: >-
              A useful scenario frame for LiblibAI is not simply “does growth continue,” because almost any reasonable
              view already assumes it keeps growing from a large 2026 base. The real underwriting variables are
              monetization mix, regulatory reliability, and whether video/design products deepen spend per user. In the
              bull case, LibTV and Xingliu become meaningful revenue contributors, enterprise/API share rises, and
              investors keep rewarding China AI leaders that combine open-model ecosystems with commercial proof; that
              could justify double-digit forward multiples and a valuation range that compounds well from today’s price.
              In the base case, growth slows sharply from the 2026 surge but remains far above conventional SaaS, while
              multiple support compresses modestly as the market demands cleaner margins and more durable enterprise
              evidence. In the bear case, repeat moderation failures, giant-platform bundling, or weak free-to-paid
              conversion compress the company toward mature-software multiples despite still-growing revenue. That is
              why the call is a buy rather than a conviction buy: the upside exists, but it is carried by a narrower set
              of execution outcomes than the headline user count implies.
