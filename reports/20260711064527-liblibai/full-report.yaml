      - number: '7.3'
        title: Third-Party Model Dependency and Big-Tech Competition Can Compress Moat and Margin Together
        blocks:
          - type: paragraph
            body: >-
              LiblibAI’s architecture and go-to-market speed both benefit from model aggregation, but the same design
              also creates a real dependency risk. ChinaBizInsider argues that Evoken does not own a proprietary
              foundation model and instead builds its product suite on third-party model APIs, while Black Forest Labs
              explicitly offers FLUX through API or open weights and Stability now markets enterprise-ready creative
              production directly. On the China side, Tongyi, Wan, Jimeng, Kling, and Kolors all show that large or
              well-capitalized ecosystems are moving quickly across the same image and video surface areas that LiblibAI
              wants to monetize. OpenAI’s discontinuation of Sora’s web and app experience is a useful reminder that
              application-layer leadership can change quickly even at the top end of the market. The strategic danger is
              therefore two-sided. Supplier dependency can erode margin or product quality if outside model providers
              change terms, and competitive bundling can erode demand if larger platforms offer good-enough image/video
              features inside broader suites or clouds. A company can lose both sides of the equation at once: higher
              upstream costs and lower downstream willingness to pay.
