chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Corporate Footprint
        blocks:
          - type: paragraph
            body: >-
              LiblibAI started in the first wave of post-Stable-Diffusion Chinese visual-AI startups, but the public
              record shows a company that moved quickly from a creator tool into a broader content-production platform.
              Baidu Baike, Yicai, and 36Kr all point to a March 2023 founding around Chen Mian, a former ByteDance
              CapCut/Jianying commercialization executive who left consumer internet with a sharper thesis: professional
              creators would become the first durable paying cohort for generative tools. The operating legal entity,
              Beijing Yanyu Technology, was incorporated on 2023-05-16 and is registered in Haidian District, Beijing.
              By mid-2026 the parent brand had shifted to Evoken, signaling that management no longer wanted to present
              LiblibAI as only an image-generation community. Official surfaces still keep the LiblibAI brand front and
              center for the flagship product, but the corporate story now spans image, video, and agentic design
              workflows. Public biographical disclosure remains founder-heavy, which is common for Chinese private
              startups but still leaves diligence questions around the full leadership bench, board composition, and
              internal division of labor. The available evidence is strong enough to establish identity and
              founder-market fit, but not strong enough to infer governance maturity beyond the founder-led operating
              core.
