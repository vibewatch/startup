  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Growth deceleration
        - ARR growth slows below ~50% without visible margin improvement
        - Breaks the argument that current premium multiple is earned by category-leading momentum
        - Re-underwrite to mature-software multiples
      - - Repeat moderation failure
        - Another public safety or compliance incident after the April 2026 remediation
        - Raises regulatory cost, brand risk, and enterprise-trust pressure simultaneously
        - Freeze conviction and revisit position size
      - - Monetization mix disappointment
        - Enterprise/API contribution remains too small versus consumer subscriptions
        - Weakens durability and lowers defensibility against big-tech bundling
        - Move call toward track
      - - Supplier / model margin squeeze
        - Third-party model or GPU economics worsen without pricing response
        - Turns topline growth into lower-quality revenue
        - Cut scenario multiples and downside case
      - - Exit window closure
        - Hong Kong or strategic exit appetite for AI apps materially cools
        - Reduces terminal multiple support even if operations stay solid
        - Extend hold period assumptions or avoid adding capital
    notes: These are investor monitoring triggers rather than guaranteed forecast events.
    claimRefs:
      - CV036
      - CV040
      - CV041
      - CV043
      - CV045
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Revenue mix
        - Split of subscription, enterprise/API, and marketplace revenue
        - Determines durability and proper multiple selection
        - Management data room / finance team
      - - Gross margin after compute
        - Contribution margin by product line and GPU cost sensitivity
        - Separates impressive ARR from truly attractive economics
        - CFO model plus vendor contracts
      - - Preference stack and dilution
        - Liquidation preferences, seniority, option pool expansion, and secondary activity
        - Private-round IRR depends on cap-table terms, not just headline valuation
        - Legal docs and term sheets
      - - Enterprise quality
        - Named paying customers, ACV ranges, renewals, and security/compliance proofs
        - Tests whether enterprise revenue can deepen ARPU and hold up under scrutiny
        - Sales ops, customer references, renewal cohorts
      - - Safety and compliance controls
        - Post-incident controls, moderation staffing, and regulatory filings by product
        - Key to defending both growth and exit readiness
        - Trust-and-safety review plus counsel memo
    notes: >-
      If the company can answer these five asks cleanly, the current valuation becomes much easier to defend as
      attractive rather than merely fair.
    claimRefs:
      - CV038
      - CV039
      - CV043
      - CV044
      - CV045
