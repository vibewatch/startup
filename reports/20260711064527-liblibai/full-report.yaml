  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape Segmentation and LiblibAI Positioning
        blocks:
          - type: paragraph
            body: >-
              LiblibAI does not face one monolithic competitor set. Its core product sits at the intersection of
              prompt-to-image creation, model hosting, creator community, and commercial workflow tooling, so the
              relevant rival map spans several distinct categories. At one end are global image leaders such as
              Midjourney and Ideogram, which compete on output quality, brand, and low-friction subscriptions. At
              another are enterprise suite players such as Adobe Firefly, Canva, and Figma AI, which can bundle
              generation into incumbent creative workflows and existing team budgets. A third class comprises open
              ecosystems such as Stability AI, Black Forest Labs, Civitai, and Hugging Face, which make models, weights,
              or demo apps broadly available and therefore reduce the exclusivity of any one application-layer platform.
              In China, LiblibAI also faces local image and video challengers including Tongyi Wanxiang, Wan, Jimeng,
              Kling, Kolors, SeaArt, and PixAI. The strongest evidence-backed positioning for LiblibAI is therefore not
              “best model” but “largest China-first open model community with commercial workflow extensions.” Its
              reported 30 million-plus users, 500,000-plus models, and 5 million daily images put it closer to a creator
              ecosystem than to a single-purpose image app, but that same openness means buyers and creators can still
              multi-home across several adjacent tools.
            claimRefs:
