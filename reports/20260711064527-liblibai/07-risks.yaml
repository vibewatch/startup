chapter:
  number: 7
  title: Risks
  summary: LiblibAI’s main risks are structural, not cosmetic. China’s expanding AI-media regime imposes labeling, filing,
    moderation, and agent-specific obligations on exactly the kinds of image and video workflows LiblibAI sells; the April
    2026 moderation incident proves those obligations are operational rather than theoretical. At the same time, the platform’s
    product breadth depends heavily on third-party and open-model ecosystems, while far larger rivals such as Alibaba, ByteDance/Kuaishou,
    and global suite vendors can compete with more distribution, more capital, and in some cases deeper model control.
sections:
- id: regulatory-and-legal-risk
  title: China’s Regulatory Regime Makes Content Safety and Labeling a Core Operating Risk
  body: 'For LiblibAI, regulation is not a background issue. It sits in the middle of the product. China’s deep synthesis,
    generative-AI, and newer 2026 AI-agent and anthropomorphic-interaction rules all apply directly to the platform’s mix
    of image generation, video generation, community distribution, and AI-assisted workflow tooling. AI Governance Institute
    summarizes the deep synthesis rules as covering AI-generated or AI-manipulated text, images, audio, video, and virtual
    humans, while Deep Lex argues that China already operates the world’s most extensive binding sectoral AI regime. Rimon
    and SesameDisk make the 2026 implication explicit: compliance now means concrete duties around labeling, filing, moderation,
    and internal controls, not vague best practices. The consultation timing visible on the TC260 labeling page further shows
    the rulebook is still being operationalized rather than frozen. For a platform that lets users upload, remix, and commercialize
    models and outputs, that creates a permanent burden. The risk is not only fines or takedowns. It is slower product iteration,
    more false positives, higher review costs, and potentially weaker user experience if the platform must keep tightening
    controls as regulations evolve.'
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR019
