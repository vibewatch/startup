  rows:
  - - Deep synthesis obligations
    - Rules cover AI-generated text, images, audio, video, and virtual humans
    - Directly applies to LiblibAI’s image and video products
    - High
    - Request current filing, labeling, and moderation-control map
  - - Generative AI filing and labeling
    - Deep Lex and Sesame describe filing and labeling as core obligations
    - User-generated model sharing and AI outputs are distribution-sensitive
    - High
    - Confirm which products, models, and workflows are filed and labeled today
  - - 2026 AI-agent / anthropomorphic rules
    - Rimon says July 2026 added new binding instruments around AI agents and interaction services
    - Relevant because LibTV markets AI-agent workflow capability
    - Medium-High
    - Assess whether LibTV and future agent features require new compliance workflows
  - - Regulatory change velocity
    - TC260 consultation timing shows rule development is ongoing
    - Compliance requirements can tighten after product launch
    - Medium-High
    - Track compliance backlog and legal review cycle time
  - - Cross-border chip controls
    - BIS guidance and export rules constrain advanced computing items tied to China risk categories
    - Could raise compute cost or limit supply flexibility
    - Medium-High
    - Map GPU suppliers, cloud exposure, and contingency planning
  notes: Severity reflects the expected impact on LiblibAI’s operations if the risk is poorly managed, not the probability
    of immediate enforcement.
