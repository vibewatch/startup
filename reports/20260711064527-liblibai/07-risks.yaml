- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Risk
  - Observed evidence
  - Why it matters
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Moderation bypass / unsafe outputs
    - OECD, AIbase, and OFweek all preserve the April 2026 incident
    - Proves safety controls can fail under adversarial prompting
    - High
    - Review post-incident controls, penetration tests, and enterprise churn impact
  - - User-experience degradation from stricter review
    - OFweek says platform review tightened after the incident
    - Can hurt engagement even while reducing compliance risk
    - Medium
    - Track creator complaints, blocked generations, and session abandonment
  - - Copyright / training-data litigation spillover
    - Artists continue to litigate Stability/Midjourney style cases
    - Open model and creator ecosystems can inherit upstream and downstream IP risk
    - High
    - Request IP policy, takedown workflow, and rights-clearance governance
  - - Prompt-evasion gray market
    - OFweek describes tutorials and gray-market prompt evasion around unsafe content
    - Makes moderation an adversarial problem, not a static rules engine
    - High
    - Assess red-team resources and repeat vulnerability closure time
  - - Public-trust damage
    - Safety incidents and public remediation can weaken brand trust with enterprises
    - Enterprise conversion may be more fragile than creator usage
    - Medium-High
    - Measure incident-driven churn, support tickets, and lost enterprise deals
  notes: This register focuses on observed or directly adjacent operating failures rather than generic “AI can go wrong” statements.
