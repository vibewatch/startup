- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk cluster
  - Mitigation to watch
  - Kill criterion / red flag
  - Why it is decisive
  rows:
  - - Regulatory compliance
    - Proactive filing, labeling, and post-incident controls
    - Any major enforcement action or repeat public safety failure
    - Would show control systems are not scaling with the business
  - - Supplier / model dependency
    - Fallback providers and more proprietary workflow IP
    - Material increase in third-party API costs without pricing power response
    - Would compress gross margin and weaken product quality simultaneously
  - - Enterprise trust
    - Documented case studies, security proof, and renewal evidence
    - Persistent inability to convert scale into named enterprise references
    - Would imply consumer-only scale with weaker monetization
  - - Creator community health
    - Stable uploads, sharing, and incentive economics
    - Sharp drop in creator activity after policy tightening or price changes
    - Would undermine the platform’s supply side and moat
  - - Execution capacity
    - Clear business-line ownership and roadmap discipline
    - Repeated slippage across image, video, and design launches at once
    - Would suggest the organization cannot absorb product breadth
  notes: The kill criteria are analytical thresholds a diligence team should monitor, not public company guidance.
