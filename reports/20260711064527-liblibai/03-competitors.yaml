- id: china-video-and-design-incumbents
  title: China-Native Image, Video, and Design Rivals Have Deeper Distribution
  body: 'The local Chinese field is strategically dangerous because several rivals combine generative capability with far
    larger distribution systems than LiblibAI can match on its own. Alibaba operates Tongyi Wanxiang and Wan under the Tongyi
    stack, giving it cloud and enterprise channel leverage. Jimeng focuses on Chinese-language text- and image-to-video generation
    with controllable first-frame and last-frame inputs, while Kling markets an all-in-one AI video and image generator around
    its 3.0 model family. Kuaishou’s Kolors technical materials show that the company also has a photorealistic text-to-image
    foundation of its own. SeaArt and PixAI compete closer to LiblibAI’s creator base by mixing community, image generation,
    and stylized consumer use cases. At the same time, Canva and Figma AI matter because design buyers often prefer embedded
    generative features inside tools they already use for brand systems, prototypes, and collaboration. This creates a two-sided
    local pressure point for LiblibAI: big-tech incumbents can out-distribute it in enterprise and video, while creator-focused
    communities can chip away at prosumer acquisition and engagement. LiblibAI therefore needs its ecosystem breadth—models,
    training, sharing, API access, and China-native community—to be meaningfully better than any single point tool.'
