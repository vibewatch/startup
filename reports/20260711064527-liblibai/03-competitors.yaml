    severity: material
    topic: private-peer-metrics
    missingEvidence: Peer ARR, paying-user counts, and realized enterprise contract values for most private competitors remain
      undisclosed.
    whyItMatters: Without comparable revenue quality or enterprise ACV data, competitive share and pricing power are hard
      to underwrite cleanly.
    diligencePath: Request management’s win-loss deck and any third-party market-share or enterprise-customer benchmarks.
    relatedQuestionRefs:
    - QP023
  - type: missing-source
    severity: material
    topic: multi-homing
    missingEvidence: Public data on how many creators use LiblibAI exclusively versus across several image and video tools
      is absent.
    whyItMatters: Creator multi-homing determines whether reported scale converts into durable pricing power and retention.
    diligencePath: Request cohort retention, creator posting overlap, and wallet-share surveys or internal attribution data.
    relatedQuestionRefs:
    - QP020
    - QP024
    relatedTableRefs:
    - TP004
  - type: access-blocked
    severity: minor
    topic: private-pricing
    missingEvidence: Some competitor pricing and enterprise packaging details remain gated behind sign-in flows or negotiated
      sales processes.
    whyItMatters: The public comparison is directionally useful but still weak on realized discounts and procurement terms.
    diligencePath: Collect screenshots or sales quotes from management’s competitive intelligence repository for the top five
      rivals.
    relatedQuestionRefs:
    - QP018
    - QP019
  - type: stale
    severity: minor
    topic: market-rankings
    missingEvidence: Several third-party league tables or valuation estimates for peers lag current 2026 product and distribution
      changes.
    whyItMatters: Fast-moving AI competitors can shift product direction faster than stale market maps capture.
    diligencePath: Refresh peer maps quarterly using direct product pages and current investor or media coverage.
    relatedQuestionRefs:
    - QP022
