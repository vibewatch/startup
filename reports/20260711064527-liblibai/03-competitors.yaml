- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Platform
  - Public pricing posture
  - Included capabilities
  - Unknowns
  - Implication
  rows:
  - - Midjourney
    - Subscription required before creation; exact current tiers behind account flow
    - Image and video generation through Midjourney workflow
    - Realized enterprise/commercial pricing is not public in retained evidence
    - Simple self-serve access supports creator multi-homing
  - - Ideogram
    - Free tier, Plus at $15/month, Pro at $42/month, Team at $20/user/month billed annually
    - Priority credits, private generation, batch generation, and team billing
    - Usage mix and enterprise discounts are not public
    - Clear self-serve ladder competes for creator and small-team budgets
  - - Runway
    - Standard $12/month, Pro $28/month, Max $76/month
    - Video and image credits plus higher-capacity model access
    - Custom enterprise pricing not public
    - Transparent premium video pricing anchors the high-end creator market
  - - Canva
    - Free, Pro, Business, and Enterprise tiers
    - Design suite plus AI allowance and large template / asset library
    - Marginal cost of AI features inside bundled suites is hard to isolate
    - Bundling puts pressure on standalone AI tools in marketing and SMB teams
  - - Figma AI
    - Team AI credits with pay-as-you-go or subscription structure
    - Design exploration, diagramming, image edits, and code-backed prototyping
    - Exact effective AI cost depends on team credit allocation
    - Embedded AI can displace point tools inside collaborative design orgs
  - - PixAI
    - Membership-led consumer pricing surface
    - Anime-focused image generation and creator tools
    - Enterprise/commercial terms not public
    - Competes on niche creator affordability rather than full workflow depth
