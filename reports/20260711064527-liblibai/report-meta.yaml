companyProfile:
  summary: >-
    LiblibAI is a Beijing-based AI creative platform founded in 2023 around founder Chen Mian and operated
    through Beijing Yanyu Technology under the broader Evoken corporate brand. Public sources support a business
    that has scaled from an image-generation and model-sharing community into a wider creative stack spanning
    community image generation, API monetization, video creation through LibTV, and design-agent surfaces through
    Xingliu/Lovart. By mid-2026 the company had reportedly reached more than 30 million users and more than
    US$300 million ARR, while also closing a nearly US$300 million Series B+ at a valuation above US$2 billion.
  foundedDate: "2023-03-01"
  founders:
    - name: Chen Mian
      role: Founder
      background: >-
        Former ByteDance CapCut/Jianying global commercialization lead; prior operating roles at Mobike,
        Didi, and Meituan.
      claimRefs: [CO001, CO004, CO005]
  foundingLocation: Beijing, China
