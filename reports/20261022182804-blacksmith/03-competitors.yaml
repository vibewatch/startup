company:
  name: Blacksmith
chapter:
  number: 3
  title: Competitors
  summary: Blacksmith competes in managed GitHub Actions execution, where hyperscaler and GitHub-hosted runners, self-hosted infrastructure, and specialist runner vendors offer credible alternatives. Its strongest disclosed differentiation is bare-metal performance and cost control, while hardware availability, security features, operating-system breadth, and potential encroachment by AI coding platforms remain material durability questions.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant market is broader than named CI startups. Blacksmith's own category is managed
      continuous-integration execution for GitHub Actions, but a buyer can also stay with GitHub
      Actions, run jobs on AWS/Azure/GCP-backed or self-managed runners, adopt a broader DevOps
      suite such as GitLab or Harness, or select a specialist such as Depot, Namespace, RunsOn,
      WarpBuild, BuildJet, or Ubicloud. Distill's directory explicitly lists GitHub, Ubicloud,
      GitLab, Depot, Harness, Namespace, RunsOn, WarpBuild, BuildJet, and CircleCI as Blacksmith
      competitors. This is a discovery taxonomy rather than independent proof of product parity;
      the categories differ in control plane, workload scope, and deployment model.
    claimRefs: [CP001, CP002, CP003]
    tableRefs: [TP001]
  - id: capability-and-economics
    title: Capability, pricing, and distribution trade-offs
    body: >-
      Available evidence supports a capability comparison, but not a complete apples-to-apples
      benchmark. TechCrunch reports that Blacksmith complements GitHub Actions, targets companies
      with teams of 500 engineers or more, and claims up to double processing speed with compute
      costs lowered by as much as 75%; those are reported company claims, not independently tested
      results. The CRACI comparison describes Blacksmith as a managed runner service with
      Firecracker microVMs, 2-to-32-vCPU Linux shapes, caching, analytics, and a September 2026
      list price of $0.004 per minute for 2-vCPU x64 and $0.0025 for ARM. Competitors can win on
      larger single machines, bring-your-own-cloud, Windows/macOS availability, egress policy,
      SBOMs, or remote build caching. Public evidence for realized discounts, uptime, migration
      friction, and customer retention is not available in this pool.
    claimRefs: [CP004, CP005, CP006, CP007]
    tableRefs: [TP002, TP003]
    figureRefs: [FP001]
  - id: durability-and-risk
    title: Moat durability and displacement risk
    body: >-
      Blacksmith's proposed moat combines owned hardware, custom scheduling software, caching,
      and a workflow switch that can be made by changing a runner label or a line of configuration.
      Fortune reports that Blacksmith owns tens of thousands of machines and that capacity
      planning is difficult because demand can jump when a new model launches; it also reports a
      40% one-day workload increase after Anthropic launched Claude Fable 5. The same reporting
      identifies AI model vendors and GitHub as potential rivals that could absorb validation
      workloads, while Blacksmith argues that more generated code increases its demand. The
      resulting advantage is meaningful but operationally exposed: supply constraints, security
      requirements, and platform bundling could erode differentiation faster than hardware scale
      compounds it.
    claimRefs: [CP008, CP009, CP010, CP011]
  - id: decision
    title: Competitive conclusion
    body: >-
      Blacksmith appears best positioned for engineering organizations that already standardize
      on GitHub Actions and value faster, lower-cost Linux execution without operating a runner
      fleet. It is less clearly advantaged where buyers require their own cloud account, strict
      egress controls, software-bill-of-materials evidence, broad Windows or macOS support, or
      very large machine shapes. The evidence does not establish that Blacksmith's performance
      claims are durable against hyperscaler price changes, specialist competitors, or in-house
      optimization. A diligence-grade conclusion is therefore conditional: the product has a
      focused wedge and visible adoption, but moat durability depends on supply access, enterprise
      security posture, and whether validation remains an external infrastructure layer.
    claimRefs: [CP012, CP013, CP014, CP015, CP016]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits separate market taxonomy from directly reported company facts and from
      competitor-authored comparisons. Unknown cells are deliberate: the assigned evidence does
      not support a score for every vendor's pricing, compliance, operating-system coverage, or
      deployment model. The comparison should be refreshed with primary pricing, security,
      service-level, customer evidence, retention cohorts, and controlled benchmark results before
      an investment decision. This prevents directory lists and vendor claims from being mistaken
      for independent proof of equivalent reliability, economics, or buyer outcomes.
    claimRefs: [CP005, CP006, CP015]
