  - id: TP002
    title: Capability and buying-criteria comparison
    columns: [Buying criterion, Blacksmith evidence, Specialist alternatives, Incumbent or internal alternative, Investment implication]
    rows:
      - [GitHub Actions compatibility, "Complements GitHub Actions; TechCrunch says switching can require changing a single line of code", "CRACI describes the same runner-label migration pattern for alternatives", "GitHub Actions is native to the repository and workflow control plane", "Low migration friction supports trialability but weakens lock-in"]
      - [Performance and compute economics, "Company-reported up to double processing speed and up to 75% lower compute cost", "Tenki page claims up to 30% faster and cheaper; CRACI lists multiple price points", "No assigned independent benchmark", "Claims need controlled workload tests before underwriting"]
      - [Caching and observability, "CRACI describes colocated cache, sticky disks, metrics, and test analytics", "Depot, Namespace, and other specialists are described with caching or build services", "GitHub provides logs and Marketplace integrations", "Caching may be feature parity rather than durable moat"]
      - [Security and supply-chain evidence, "CRACI says SBOMs are not among Blacksmith's documented features", "CRACI differentiates on SBOM export and fail-closed egress", "GitHub is reported by CRACI as offering artifact attestations", "Enterprise security requirements can redirect demand"]
      - [Deployment control, "CRACI says cited Blacksmith pages do not describe buyer-cloud deployment", "WarpBuild, RunsOn, and Cirun are described as buyer-account options", "Self-hosted runners maximize network control", "Control-plane trust and data locality are material selection criteria"]
      - [Operating-system and shape breadth, "CRACI describes Blacksmith as 2-to-32-vCPU Linux, with Windows public beta and macOS on Apple M4", "Depot and Namespace are described up to 64 vCPUs with Windows/macOS", "GitHub larger runners are described up to 64 cores", "Non-Linux and large-build requirements cap addressable accounts"]
    notes: "Descriptions and prices are taken from the CRACI comparison, which is issued by a competitor; Blacksmith-specific performance and feature claims remain unverified in independent testing."
    claimRefs: [CP004, CP005, CP006, CP007, CP012, CP013]
  - id: TP003
    title: Public pricing and packaging signals
    columns: [Option, Stated price or package, Unit and period, Included capability, Qualification]
    rows:
      - [Blacksmith x64, "$0.004", "per minute for 2 vCPU x64", "Managed GitHub Actions runner; 3,000 free minutes monthly stated by CRACI", "September 2026 list price from competitor-authored comparison"]
      - [Blacksmith ARM, "$0.0025", "per minute for ARM", "Managed runner option", "September 2026 list price from competitor-authored comparison"]
      - [Depot Developer, "$20 plus $0.006 beyond allowance", "monthly plan and per-minute usage", "2,000 minutes; 64-vCPU Linux and remote BuildKit described", "September 2026 list price from competitor-authored comparison"]
      - [WarpBuild x86-64, "$0.004", "per minute for 2 vCPU", "Managed runners, Windows/macOS, and bring-your-own-cloud described", "September 2026 list price from competitor-authored comparison"]
      - [Ubicloud 2 vCPU, "$0.00125", "per minute on x64 and ARM", "About 1,250 minutes from a stated $2.50 monthly credit", "September 2026 price from competitor-authored comparison; verify billing minimums"]
      - [Self-hosted runners, "No GitHub per-minute charge stated", "Buyer pays host and operations costs", "Owned infrastructure and network control", "Total cost, patching, isolation, and idle utilization are not quantified"]
    notes: "These are public list-price signals, not realized revenue, discounts, gross margin, or customer total cost of ownership. Competitor-authored figures require direct primary confirmation."
    claimRefs: [CP005, CP006, CP014]
