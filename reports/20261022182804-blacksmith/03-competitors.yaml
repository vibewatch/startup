    claimRefs: [CP003, CP006, CP012, CP013]
callouts:
  - calloutType: strength
    title: Focused wedge
    body: Blacksmith's clearest advantage is a low-friction replacement for GitHub-hosted execution that combines claimed speed and cost benefits with owned compute. TechCrunch reported more than 700 customers and $3.5 million ARR in 2025; later 2026 reporting described materially larger usage, but those metrics are company-reported and should not be treated as independently audited.
    claimRefs: [CP004, CP010]
  - calloutType: risk
    title: Platform and supply exposure
    body: Hardware ownership may improve economics, but Fortune and SiliconANGLE both describe capacity planning and component shortages as operating risks. The same sources identify AI coding vendors and GitHub as plausible competitors in validation, so Blacksmith must defend both infrastructure economics and control-plane relevance.
    claimRefs: [CP008, CP009, CP011]
