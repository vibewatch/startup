      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              Blacksmith's cost thesis is operational rather than software-margin pure. It buys and operates hardware in
              data centers, using purpose-built capacity for spiky CI workloads instead of renting only general-purpose
              cloud machines. The company claims jobs run twice as fast and cost 60% less on average; a LangChain
              infrastructure engineer was quoted as reporting roughly 40% runner-cost savings, excluding engineering
              time. These are not audited gross-margin data, and the difference between the headline average and the
              customer example signals workload dependence. Hardware ownership may improve control over compute
              economics, but it also creates depreciation, colocation, power, memory, maintenance, and
              capacity-utilization exposure. Public sources do not provide CAC, payback, contribution margin, failure
              cost, or support cost.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
