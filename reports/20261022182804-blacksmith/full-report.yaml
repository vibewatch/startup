    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Blacksmith is described as a San Francisco-based developer-tools company founded in 2024. Its product is a
              continuous-integration cloud that automates building and testing code before it is merged and deployed.
              TechCrunch describes it as a complement to GitHub Actions, while SiliconANGLE says the company owns
              servers and operates a dedicated CI cloud across multiple locations. The product thesis is that
              AI-assisted development increases code volume and shifts the bottleneck toward validation. Named users are
              companies, placing the offering in B2B infrastructure rather than code generation, but public sources do
              not provide audited financial statements or a complete customer contract profile. The operating model
              therefore combines a clear infrastructure proposition with meaningful execution exposure to hardware
              procurement, capacity planning, and reliability.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO013
