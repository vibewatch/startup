  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is hosted continuous-integration infrastructure: automated builds, tests, and
              validation that run before code is merged and deployed. Blacksmith's stated product replaces or
              complements CI jobs that customers otherwise run on AWS, Microsoft Azure, Google Cloud, GitHub-hosted
              machines, or self-managed infrastructure. The boundary should exclude generic developer productivity
              software, code-generation models, and broad cloud spend unless the spend is specifically attributable to
              CI execution. The practical substitute set therefore includes hyperscaler instances, GitHub Actions and
              other hosted CI providers, and internal CI clouds. Blacksmith's differentiation claim is purpose-built
              infrastructure and operational simplicity rather than a new software-development stage. That positioning
              makes switching friction, workload portability, and customer trust central to market capture. The source
              pool also contains same-name blacksmithing and hydraulic-equipment material; those sources are retained as
              adjacency evidence only and must not be treated as evidence of Blacksmith's CI market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and adoption trajectory
        blocks:
          - type: paragraph
            body: >-
              No eligible source isolates Blacksmith's addressable CI spend by geography, customer segment, or workload
              type. The strongest available sizing lens is bottom-up operating evidence: Fortune reports more than
              10,000 companies, approximately 90 million validation checks, revenue in the tens of millions of dollars,
              and largest customers spending more than $1 million annually. TechCrunch earlier reported more than 700
              customers and $3.5 million ARR, showing rapid expansion but also a time-series break that should not be
              blended into a single market estimate. Blacksmith's own Series B announcement says CI jobs grew 5–10% week
              over week and that more than 6,000 companies used the platform at that time. These are company-reported
              traction measures, not market share. A hydraulic blacksmith-equipment report gives a separate industrial
              adjacency estimate of $1.2 billion in 2025 and $1.8 billion in 2034 at a reported 5.2% CAGR, but its
              population, product category, and buyer are not comparable to hosted CI and it cannot be used as
              Blacksmith's TAM. The valuation and funding figures further indicate investor appetite, not customer spend
              or available cash.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
