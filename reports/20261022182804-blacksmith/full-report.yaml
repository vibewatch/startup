            title: Platform and supply exposure
            body: >-
              Hardware ownership may improve economics, but Fortune and SiliconANGLE both describe capacity planning and
              component shortages as operating risks. The same sources identify AI coding vendors and GitHub as
              plausible competitors in validation, so Blacksmith must defend both infrastructure economics and
              control-plane relevance.
            calloutType: risk
            claimRefs:
              - CP008
              - CP009
              - CP011
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and public traction
        blocks:
          - type: paragraph
            body: >-
              Blacksmith sells infrastructure that runs customers' continuous-integration builds and tests, with
              migration for GitHub Actions described as a one-line workflow change. Public reporting identifies a
              usage-based infrastructure model but does not disclose a price card, contract minimum, realized revenue,
              or revenue mix. The strongest disclosed traction indicators are company claims: weekly CI jobs rose from 5
              million in January 2026 to more than 90 million, ARR rose 17-fold over the same period, and the customer
              base exceeded 10,000. TechCrunch previously reported $3.5 million ARR and more than 700 customers in
              September 2025, providing an earlier point-in-time baseline rather than a current financial statement. The
              gap between usage growth and disclosed dollars prevents direct assessment of conversion, retention, or
              revenue quality.
            claimRefs:
