      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Blacksmith's proposed moat combines owned hardware, custom scheduling software, caching, and a workflow
              switch that can be made by changing a runner label or a line of configuration. Fortune reports that
              Blacksmith owns tens of thousands of machines and that capacity planning is difficult because demand can
              jump when a new model launches; it also reports a 40% one-day workload increase after Anthropic launched
              Claude Fable 5. The same reporting identifies AI model vendors and GitHub as potential rivals that could
              absorb validation workloads, while Blacksmith argues that more generated code increases its demand. The
              resulting advantage is meaningful but operationally exposed: supply constraints, security requirements,
              and platform bundling could erode differentiation faster than hardware scale compounds it.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Competitive conclusion
        blocks:
          - type: paragraph
            body: >-
              Blacksmith appears best positioned for engineering organizations that already standardize on GitHub
              Actions and value faster, lower-cost Linux execution without operating a runner fleet. It is less clearly
              advantaged where buyers require their own cloud account, strict egress controls,
              software-bill-of-materials evidence, broad Windows or macOS support, or very large machine shapes. The
              evidence does not establish that Blacksmith's performance claims are durable against hyperscaler price
              changes, specialist competitors, or in-house optimization. A diligence-grade conclusion is therefore
              conditional: the product has a focused wedge and visible adoption, but moat durability depends on supply
              access, enterprise security posture, and whether validation remains an external infrastructure layer.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits separate market taxonomy from directly reported company facts and from competitor-authored
              comparisons. Unknown cells are deliberate: the assigned evidence does not support a score for every
              vendor's pricing, compliance, operating-system coverage, or deployment model. The comparison should be
              refreshed with primary pricing, security, service-level, customer evidence, retention cohorts, and
              controlled benchmark results before an investment decision. This prevents directory lists and vendor
              claims from being mistaken for independent proof of equivalent reliability, economics, or buyer outcomes.
            claimRefs:
