              - CP006
              - CP015
      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Focused wedge
            body: >-
              Blacksmith's clearest advantage is a low-friction replacement for GitHub-hosted execution that combines
              claimed speed and cost benefits with owned compute. TechCrunch reported more than 700 customers and $3.5
              million ARR in 2025; later 2026 reporting described materially larger usage, but those metrics are
              company-reported and should not be treated as independently audited.
            calloutType: strength
            claimRefs:
