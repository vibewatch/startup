  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Blacksmith is described as a continuous-integration cloud that runs automated builds and tests before code
              is merged and deployed. The workflow starts with code pushed to repositories such as GitHub, continues
              through CI jobs executed on Blacksmith infrastructure, and ends with validation results that inform
              release decisions. TechCrunch says the service complements GitHub Actions and can be adopted by changing a
              single line of code, while Northflank's comparison characterizes the product as managed, high-performance
              GitHub Actions runners with caching, Docker build acceleration, and CI observability. The available
              evidence therefore supports a focused execution layer rather than a replacement for source control or
              workflow syntax. Public materials do not establish the full supported integration matrix, pricing
              mechanics, service-level commitments, or measurable customer-level outcomes.
