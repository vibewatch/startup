      - number: '3.2'
        title: Capability, pricing, and distribution trade-offs
        blocks:
          - type: paragraph
            body: >-
              Available evidence supports a capability comparison, but not a complete apples-to-apples benchmark.
              TechCrunch reports that Blacksmith complements GitHub Actions, targets companies with teams of 500
              engineers or more, and claims up to double processing speed with compute costs lowered by as much as 75%;
              those are reported company claims, not independently tested results. The CRACI comparison describes
              Blacksmith as a managed runner service with Firecracker microVMs, 2-to-32-vCPU Linux shapes, caching,
              analytics, and a September 2026 list price of $0.004 per minute for 2-vCPU x64 and $0.0025 for ARM.
              Competitors can win on larger single machines, bring-your-own-cloud, Windows/macOS availability, egress
              policy, SBOMs, or remote build caching. Public evidence for realized discounts, uptime, migration
              friction, and customer retention is not available in this pool.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
