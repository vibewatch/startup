  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant market is broader than named CI startups. Blacksmith's own category is managed
              continuous-integration execution for GitHub Actions, but a buyer can also stay with GitHub Actions, run
              jobs on AWS/Azure/GCP-backed or self-managed runners, adopt a broader DevOps suite such as GitLab or
              Harness, or select a specialist such as Depot, Namespace, RunsOn, WarpBuild, BuildJet, or Ubicloud.
              Distill's directory explicitly lists GitHub, Ubicloud, GitLab, Depot, Harness, Namespace, RunsOn,
              WarpBuild, BuildJet, and CircleCI as Blacksmith competitors. This is a discovery taxonomy rather than
              independent proof of product parity; the categories differ in control plane, workload scope, and
              deployment model.
