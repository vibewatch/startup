              - CE007
              - CE008
              - CE009
              - CE012
              - CE013
      - number: '5.4'
        title: Evidence boundaries and diligence priorities
        blocks:
          - type: paragraph
            body: >-
              Two allocated net-new results were clear namesakes: one is a municipal document about a Blacksmith Drive
              address, and the other is an unrelated open-source penetration-testing project. Neither is retained as
              target evidence. The strongest relevant evidence is instead concentrated in independent technology
              reporting and a current job repost that reproduces company hiring language. No assigned source
              independently verifies Blacksmith's security posture, reliability, integration breadth, or customer
              benefit claims. A technical diligence package should therefore request architecture and threat-model
              documentation, isolation and secrets controls, SOC 2 or equivalent assurance, incident and SLA history,
              capacity and regional failover plans, benchmark methodology, and customer references tied to production
              workloads.
            claimRefs:
              - CE017
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Infrastructure control is the clearest product edge
            body: >-
              Owned hardware, custom scheduling, and reported high concurrency give Blacksmith a differentiated
              operating model versus generic cloud runners, although public benchmarks remain limited.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Capacity and trust controls remain under-documented
            body: >-
              Demand spikes and component shortages create capacity risk, while the assigned evidence does not establish
              sandbox security, reliability history, compliance, or incident response.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE017
          - type: callout
            title: Make production controls a gating diligence request
            body: >-
              Before underwriting technical maturity, obtain independent assurance and operating evidence covering
              isolation, secrets, uptime, regional recovery, and customer-impacting incidents.
            calloutType: recommendation
            claimRefs:
              - CE014
              - CE017
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and user segments
        blocks:
          - type: paragraph
            body: >-
              Blacksmith sells continuous-integration infrastructure to software teams whose developers need builds and
              tests to pass before code is merged and deployed. The clearest externally reported target is companies
              with teams of 500 or more engineers, while the named customer set is concentrated in technology startups
              and digital enterprises. Peak XV describes AI-native startups and digital enterprises as early adopters,
              and TechCrunch names Ashby, Chroma, Clerk, Devsisters, Mintlify, Pylon, Slope, Supabase, and VEED as
              customers running GitHub Actions through the platform. This supports a developer-led, infrastructure buyer
              profile, but the pool does not disclose customer revenue bands, payer authority, geographic mix, contract
              size distribution, or the share of usage from large enterprises versus startups.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.2'
        title: Adoption trajectory and usage proof
        blocks:
          - type: paragraph
            body: >-
              The available evidence indicates accelerating adoption, but the measures are not interchangeable.
              TechCrunch reported hundreds of customers and $3.5 million ARR in 2025, whereas Fortune reported that
              Blacksmith said more than 10,000 companies used the platform in October 2026, up from about 5,000 in
              August. Fortune also reported a rise from 5 million validation checks per week at the start of the year to
              90 million, and a 17-fold ARR increase over the same period. These are company-reported figures carried by
              independent publications, not audited retention or revenue disclosures. The denominator for “companies” is
              unspecified, and the evidence does not establish how many accounts are active, paid, in production, or
              only evaluating the service.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The customer case is promising on usage momentum but incomplete on durability. Peak XV says it spoke with
              customers and observed rapid adoption, while Fortune reports that the largest customers spend more than $1
              million annually. Those signals support the possibility of high-value expansion as AI-generated code
              increases validation demand, yet neither source supplies gross retention, net retention, churn, renewal
              rates, cohort behavior, or customer-level revenue concentration. Fortune also reports that Blacksmith's
              capacity planning is difficult because demand can jump when a stronger model launches, and that the
              company owns much of its hardware. This creates a customer-experience and concentration diligence
              question: demand may be strong, but service capacity and a small number of large accounts could affect
              durability.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU013
              - CU014
      - number: '6.4'
        title: Customer evidence exhibits
        blocks:
          - type: paragraph
            body: >-
              Named-company references are useful proof of market reach, but they vary in evidentiary strength.
              TechCrunch provides a contemporaneous list of customers running GitHub Actions through Blacksmith, while
              Fortune gives a later list and a company-reported usage count. SiliconANGLE repeats several customer names
              in coverage of the financing, which corroborates visibility but is not an independent customer reference.
              A separate TELUS page concerns the acquired Blacksmith Applications trade-promotion product, and a Federal
              Register result concerns blacksmith shops; both are retained only to document name-collision risk and are
              not evidence about this company's customer base. Direct customer interviews, contracts, usage exports,
              renewal records, and cohort data remain the appropriate next diligence inputs.
            claimRefs:
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reported adoption is scaling faster than the early customer base
            body: >-
              Fortune reports more than 10,000 companies using Blacksmith in October 2026, versus about 5,000 in August,
              alongside 90 million validation checks.
            calloutType: strength
            claimRefs:
              - CU006
              - CU007
          - type: callout
            title: Retention and concentration are not demonstrated
            body: >-
              The pool lacks GRR, NRR, churn, renewal, cohort, and customer-level revenue data; the largest-customer
              spending disclosure increases the need for concentration analysis.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk assessment
        blocks:
          - type: paragraph
            body: >
              Blacksmith's risk profile is shaped by a deliberate infrastructure choice: it buys and operates its own
              compute rather than renting only hyperscaler capacity. Fortune reports that this improves performance
              control but exposes the company to shortages of compute and memory, while capacity planning becomes
              difficult when model launches create abrupt demand spikes. SiliconANGLE describes a more than 40%
              single-day workload increase after one model launch. This creates a coupled availability and margin risk:
              capacity bought too early can depress utilization, while capacity bought too late can constrain service
              quality or growth. The risk is material because the company's stated expansion plan also calls for buying
              more servers. The evidence supports high severity for capacity execution, but not a quantified outage
              probability.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR009
              - CR014
      - number: '7.2'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >
              A customer account review provides useful but bounded operating evidence. Across an unfiltered
              organization view, 801 PLANET recorded 1,527 Blacksmith jobs from January 23 to July 23, 2026, with a
              13.75% failure rate; the reviewer explicitly says this is not a Blacksmith incident rate because it
              combines failed tests, application errors, workflow mistakes, and deliberate failures. The same review
              found cache-lineage problems: a successful sticky-disk commit was later followed by restoration of an
              older parent snapshot, and cold or invalidated builds were materially slower than the prior median. A
              separate implementation plan records authentication, environment propagation, shallow-fetch, stop
              semantics, and API-outage cleanup findings. These are integration and reliability risks, not proof of a
              platform-wide incident rate.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR006
              - CR011
              - CR012
      - number: '7.3'
        title: Dependencies, competition, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >
              Blacksmith keeps GitHub Actions as the workflow control plane and changes the runner target, so GitHub
              organization support and GitHub availability are strategic dependencies. The 801 PLANET review says the
              service is unavailable for personal repositories and becomes a less simple choice when GitLab or
              CodeCommit is the source of truth. Fortune and SiliconANGLE also identify a structural competitive risk:
              AI model vendors and GitHub already provide adjacent test execution or hosted machines, and could absorb
              validation. The company's current growth claims are reported by the company through journalists, while
              independent operating baselines remain sparse. The investment thesis should therefore break if capacity
              shortages cause sustained queueing or SLA deterioration, cache correctness remains unresolved, or core AI
              and source-control platforms bundle equivalent validation at lower friction.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority diligence
            body: >-
              Request capacity headroom and SLA data, cache correctness and recovery evidence, security/compliance
              artifacts, and a customer-level incident taxonomy before underwriting scale.
            calloutType: risk
            claimRefs:
              - CR001
              - CR006
              - CR009
          - type: callout
            title: Thesis-break trigger
            body: >-
              Treat sustained queueing, repeated cache corruption, or a bundled validation feature from a core platform
              as a thesis-break event unless Blacksmith can show measurable reliability or workflow advantages.
            calloutType: assumption
            claimRefs:
              - CR006
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Blacksmith is positioned at a bottleneck created by AI-assisted software
              development: more generated code increases the volume of builds and tests that must be validated.
              Independent coverage reports that the company said annual recurring revenue grew 17-fold. Fortune also
              reports that validation checks rose from about 5 million per week at the start of 2026 to 90 million at
              publication, more than 10,000 companies used the platform, and revenue was in the tens of millions of
              dollars. The financing record also shows strong investor demand: a $45 million Series B at a $550 million
              valuation was followed about two months later by a $66 million Series C at a reported $1 billion
              valuation. Those facts support a high-growth infrastructure thesis, but they do not establish revenue
              quality, gross margin, retention, or cash conversion.

              The anti-thesis is that the same infrastructure model carries substantial execution and valuation risk.
              Blacksmith owns much of its compute hardware, so capacity expansion requires capital and exposes it to
              memory and component shortages. Fortune reports that capacity planning is difficult and that demand rose
              40% in one day after a new frontier model launch. It also identifies a strategic threat from AI model
              vendors and adjacent developer tools that may provide code validation themselves. Public evidence
              therefore supports monitoring growth and infrastructure economics rather than paying a premium solely for
              headline usage or a recent financing mark.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV009
              - CV011
              - CV014
      - number: '8.2'
        title: Financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The disclosed financing sequence is a useful reference point but not a substitute for an investable
              valuation. TechCrunch reports a $10 million Series A at a $60 million valuation in 2025, a $45 million
              Series B at $550 million two months before the current report, and a $66 million Series C at $1 billion.
              SiliconANGLE independently reports the Series C and approximately $125 million of total funding. The jump
              from $550 million to $1 billion is a financing reference, not evidence that common equity has the same
              value or that a new investor can obtain the same terms. The public sources do not disclose the
              capitalization table, liquidation preferences, option-pool treatment, secondary volume, debt, or
              security-specific rights.

              Entry discipline should therefore require a current cap table, the exact security and preference stack,
              primary-versus-secondary allocation, and trailing ARR with cohort retention and gross margin. A buyer
              should also test whether hardware ownership produces durable contribution-margin advantage after
              depreciation, colocation, memory, and replacement costs. Without those inputs, a precise multiple, target
              return, or exit value would be false precision. The appropriate decision implication is to keep the
              company on the diligence list and negotiate only against verified operating metrics and terms.
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
      - number: '8.3'
        title: Scenarios, exit readiness, and decision
        blocks:
          - type: paragraph
            body: >-
              The bull case is a durable AI-era validation workload with sustained customer expansion, improving
              hardware economics, and enough retention to convert rapid check growth into recurring revenue. The base
              case is continued usage growth but a slower conversion of usage into durable, high-margin revenue while
              Blacksmith funds capacity and faces competition from hyperscalers, model vendors, and developer-tool
              platforms. The bear case is multiple compression or a down-round if compute shortages, hardware intensity,
              customer concentration, or competing validation features weaken margins and retention. Public sources
              provide signals for these cases but not probabilities or a supportable valuation range.

              The recommendation is research-more, with medium confidence and a stretched valuation stance relative to
              disclosed operating evidence. The stance is not a claim that the company is worth less than its latest
              reported financing; it reflects that a $1 billion financing mark is difficult to underwrite without
              verified ARR, margin, retention, and terms. A move toward buy would require independently verifiable
              revenue and retention, a clean preference stack, and evidence that owned infrastructure creates durable
              unit-economic advantage. A move toward avoid would be warranted by a down round, material customer
              concentration, inability to procure capacity, or credible displacement by integrated AI coding platforms.
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV004
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV012
              - CV013
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              The growth signal is compelling, but public valuation support is incomplete; require operating and
              security-term diligence before underwriting an entry price.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
          - type: callout
            title: Hardware intensity and competitive response
            body: >-
              Owned compute can improve control and performance, but it also creates capital, component, and
              capacity-planning exposure while AI model vendors may move into validation.
            calloutType: risk
            claimRefs:
              - CV005
              - CV006
