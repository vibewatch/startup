              - CM005
              - CM006
              - CM009
              - CM010
      - number: '2.3'
        title: Buyers, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is an engineering organization with enough CI volume and reliability sensitivity to
              justify moving execution from general-purpose cloud or self-hosted systems. Developers and platform teams
              are users; engineering leadership or infrastructure procurement is the likely budget owner, while security
              and reliability teams can act as adoption gates. The adoption trigger is a rising validation queue caused
              by AI-generated code: Blacksmith's sources describe developers writing more code, validation becoming the
              bottleneck, and Anthropic's validation workload growing 25-fold in six months. The same evidence
              identifies material constraints. Blacksmith owns much of its hardware, which may improve performance
              control but exposes it to memory and component shortages; demand can jump sharply when a new model
              launches, making capacity planning difficult. Hyperscalers, GitHub, and coding-agent vendors remain
              substitutes or potential entrants into validation. The evidence therefore supports an attractive adoption
              driver but not a proven durable moat, pricing ceiling, or serviceable market boundary.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Sizing and adoption diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The principal unresolved question is not whether CI demand is growing, but how much of that demand is
              economically serviceable for Blacksmith after cloud alternatives, internal infrastructure, workload
              concentration, and compute costs. The current pool lacks independent CI market revenue, customer-level
              retention, pricing by workload, gross margin, geographic mix, and a defensible conversion from code checks
              to spend. It also lacks evidence separating platform usage counts from paying customers. Management should
              provide a segmented bookings and usage bridge, customer concentration, renewal and expansion cohorts,
              workload-level unit economics, infrastructure capacity commitments, and a competitor benchmark against
              GitHub Actions and hyperscaler offerings. Until then, the report should present the market as
              evidence-constrained rather than adopt a generic cloud or developer-tools TAM.
            claimRefs:
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: AI increases validation demand
            body: >-
              The most credible near-term adoption driver is the shift from code-generation scarcity to validation
              capacity: AI coding tools increase code output while CI remains a required gate before merge and
              deployment.
            calloutType: insight
            claimRefs:
              - CM011
              - CM012
          - type: callout
            title: Compute ownership cuts both ways
            body: >-
              Owning hardware may improve performance control, but the cited component shortage and model-driven demand
