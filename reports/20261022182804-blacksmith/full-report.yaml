  - id: FE001
    title: Blacksmith product architecture map
    type: stack
    summary: >-
      Managed CI workloads move from repository workflows through scheduling and isolated execution to validation
      analytics.
    data:
      layers:
        - name: Workflow interface
          label: Workflow interface
          detail: Repository workflows enter through GitHub Actions-compatible CI execution.
          items:
            - name: GitHub Actions compatibility
              detail: Customer code is pushed to repositories and CI jobs are run through an Actions-compatible workflow.
            - name: Repository handoff
              detail: Customers can route existing CI workflows to Blacksmith without replacing their source-control system.
        - name: Orchestration
          label: Orchestration
          detail: Scheduling and setup reuse coordinate bursty CI workloads.
          items:
            - name: Job scheduler
              detail: Custom software schedules bursty CI workloads across Blacksmith's global infrastructure.
            - name: Setup reuse
              detail: Software saves repetitive setup work that would otherwise be repeated for each test run.
        - name: Execution
          label: Execution
          detail: Isolated virtualized jobs run on owned bare-metal capacity.
          items:
            - name: Firecracker VM layer
              detail: A company job posting reports orchestration of tens of millions of Firecracker VMs each week.
            - name: Bare-metal fleet
              detail: Blacksmith buys and operates servers across multiple locations, including high-performance CPUs.
        - name: Security boundary
          label: Security boundary
          detail: >-
            Customer workloads require isolation, secrets handling, and controlled access; public evidence does not
            document the controls.
          items:
            - name: Tenant isolation
              detail: >-
                Firecracker-based execution is described, but independent isolation assurance is not available in the
                assigned pool.
        - name: Reliability operations
          label: Reliability operations
          detail: Capacity planning, regional placement, and recovery determine service continuity under bursty CI demand.
          items:
            - name: Capacity and failover
              detail: Component shortages and burst demand are reported risks requiring operational diligence.
        - name: Data and insight
          label: Data and insight
          detail: Storage, caching, analytics, and observability support the CI workflow.
          items:
            - name: Ceph storage
              detail: The same job posting reports a petabyte-scale Ceph cluster managed by the company.
            - name: Test analytics
              detail: Reporting describes test analytics and an observability roadmap for GitHub Actions.
            - name: Validation output
              detail: CI execution produces build and test results used for release decisions.
    claimRefs:
      - CE001
      - CE005
      - CE007
      - CE008
      - CE009
      - CE012
