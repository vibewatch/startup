              - CI013
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The October 2026 Series C materially extends Blacksmith's financing capacity but does not establish
              runway. Sequoia led a $66 million round at a reported $1 billion valuation, bringing total funding to
              approximately $125 million; prior reporting described a $45 million Series B at a $550 million valuation.
              Fortune reports that most new money is intended for computing power, with the footprint near 10 megawatts
              and a planned fivefold expansion in 2027, while also describing exposure to compute and memory shortages.
              The company has not disclosed cash on hand, burn, debt, lease obligations, capex schedule, or next-round
              trigger. The resulting verdict is strong demand with infrastructure-scale capital requirements, not
              demonstrated cash self-sufficiency. Underwriting should require cohort revenue, realized price per job or
              compute unit, gross contribution after hardware and data-center costs, and a capacity plan tied to
              contracted demand.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The public record supports a growth narrative but leaves the inputs needed for a financing-quality model
              unavailable. There is no disclosed bridge from CI jobs to recognized revenue, no published
              list-versus-realized pricing schedule, and no customer-level concentration or retention data. The
              financing record also does not reveal how much of the new round is committed to hardware purchases versus
              hiring and working capital. Because Blacksmith owns much of its infrastructure, a diligence model should
              separate recurring software-like revenue from pass-through or capacity-sensitive economics and stress
              utilization, power, hardware lead times, and AI-agent demand volatility. The open strategic risk is that
              GitHub or model vendors could absorb validation functionality, which could pressure pricing or increase
              customer acquisition costs even while aggregate CI demand grows.
            claimRefs:
              - CI013
              - CI014
