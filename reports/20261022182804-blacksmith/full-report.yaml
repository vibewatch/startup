      - number: '5.2'
        title: Infrastructure and operating architecture
        blocks:
          - type: paragraph
            body: >-
              The technical differentiation is an infrastructure operating model: Blacksmith buys and operates its own
              servers, deploys them across multiple locations, and writes software to schedule customer CI workloads.
              Fortune reports tens of thousands of company-owned machines and software that avoids repeating setup work
              for every test run; SiliconANGLE describes a dedicated CI cloud spanning global locations. Earlier
              reporting describes high-performance, gaming-grade CPUs and cites company claims of up to double
              processing speed and up to 75% lower compute costs, while a current engineering posting says the company
              orchestrates tens of millions of Firecracker VMs weekly, schedules 100k-plus vCPUs concurrently, and
              manages a petabyte-scale Ceph cluster. These details indicate substantial systems engineering, but they
              are company-reported or company-job-posting evidence, not an independently audited architecture or
              benchmark.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
      - number: '5.3'
        title: Maturity, trust, and technical risks
        blocks:
          - type: paragraph
            body: >-
              Usage growth is a meaningful maturity signal: SiliconANGLE reports approximately 90 million code checks
              and more than 10,000 companies, while Fortune reports that weekly validation checks rose from about 5
              million at the start of 2026 to 90 million. The same reporting identifies capacity planning and memory
              availability as operational constraints because demand can jump when a new frontier model launches; it
              also flags the possibility that AI model vendors could add competing validation features. Blacksmith's
              public evidence describes test analytics and an observability roadmap, but does not provide incident
              history, uptime, isolation design, secrets handling, compliance attestations, vulnerability disclosure
              practices, or independent performance tests. Those omissions are material for a CI provider that executes
              customer code and should remain diligence requests rather than being treated as proof of safe operation.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
          - type: table
            tableRef: TE003
