callouts:
  - calloutType: strength
    title: Infrastructure positioning is legible
    body: The retained reporting consistently describes a focused CI infrastructure product with a differentiated bare-metal operating model and a clear AI-driven demand thesis.
    claimRefs: [CO002, CO003, CO004]
  - calloutType: risk
    title: Scale metrics need reconciliation
    body: Funding totals, revenue labels, customer counts, and headcount vary materially by source and time basis; diligence should obtain the cap table, audited or management accounts, and metric definitions before relying on headline growth.
    claimRefs: [CO009, CO010, CO011, CO013, CO014, CO015, CO016]
