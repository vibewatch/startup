company:
  name: Blacksmith
chapter:
  number: 1
  title: Company Overview
  summary: Blacksmith is a privately held San Francisco continuous-integration infrastructure company founded in 2024. Current reporting describes rapid financing and usage growth, but public metrics are inconsistent across sources and several operating figures remain company-reported rather than independently verified.
sections:
  - id: identity-and-business
    title: Identity, product, and operating model
    body: Blacksmith is described as a San Francisco-based developer-tools company founded in 2024. Its product is a continuous-integration cloud that automates building and testing code before it is merged and deployed. TechCrunch describes it as a complement to GitHub Actions, while SiliconANGLE says the company owns servers and operates a dedicated CI cloud across multiple locations. The product thesis is that AI-assisted development increases code volume and shifts the bottleneck toward validation. Named users are companies, placing the offering in B2B infrastructure rather than code generation, but public sources do not provide audited financial statements or a complete customer contract profile. The operating model therefore combines a clear infrastructure proposition with meaningful execution exposure to hardware procurement, capacity planning, and reliability.
    claimRefs: [CO001, CO002, CO003, CO004, CO013]
    tableRefs: [TO001]
  - id: people-and-governance
    title: Founders, leadership, and stakeholder structure
    body: Public coverage consistently identifies Aditya Jayaprakash as co-founder and chief executive and names Aayush Shah and Aditya Maru as co-founders. TechCrunch links the founding team to prior distributed-systems work at Cockroach Labs and Faire, which is relevant founder-market fit for infrastructure software. The available evidence does not establish a formal board, independent directors, voting control, or succession plan. The company has disclosed a lean team at different points in its growth, moving from eight or eleven people in 2025 reporting to about 40 in October 2026, with a stated plan to reach about 75 by year-end. This span is directional rather than a reconciled headcount series, so key-person and governance diligence remains material.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002, TO003]
  - id: financing-scale-and-milestones
    title: Financing, scale, and milestone record
    body: Blacksmith's financing history is reported differently by sources. Multiples lists six rounds and $170 million total funding, while Fortune and SiliconANGLE report approximately $124.5 million or $125 million after the October 2026 Series C; 311 Institute cites at least $58.6 million from Form D filings and cautions that Form D figures are minimums. The latest reported transaction is a $66 million Series C led by Sequoia at a $1 billion valuation, following a $45 million Series B at a $550 million valuation. Usage and ARR claims have also accelerated, including more than 10,000 companies, 90 million weekly checks, and ARR growth of 17x in recent reporting, but those figures are attributed to the company or executives. The investment case has strong reported momentum, alongside unresolved reconciliation of funding, revenue, customer, and workforce definitions.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
