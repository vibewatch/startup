  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financing-terms
      missingEvidence: Current cap table, security type, liquidation preferences, option-pool treatment, and primary-versus-secondary allocation for the Series C.
      whyItMatters: A preferred financing mark may not equal the value available to a new common or preferred investor, and dilution or preference overhang can materially change return outcomes.
      diligencePath: Obtain the latest cap table, financing documents, preference schedule, option-pool model, and a breakdown of primary versus secondary proceeds from management and lead investors.
      relatedQuestionRefs: [QV007]
    - type: missing-source
      severity: material
      topic: valuation-support
      missingEvidence: Audited or management-verified ARR bridge, gross margin, net retention, customer concentration, burn, and cash runway.
      whyItMatters: Usage and customer counts do not establish revenue quality, margin durability, or the cash required to scale owned compute.
      diligencePath: Request monthly recurring-revenue cohorts, renewal and expansion data, compute-level gross margin, cash-flow statements, and a capacity investment plan.
      relatedQuestionRefs: [QV002, QV003, QV008]
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: A comparable-company and transaction set with normalized revenue, growth, margin, and security terms.
      whyItMatters: The public record contains financing marks but no comparable basis for testing whether the latest mark is attractive, fair, or stretched.
      diligencePath: Build a normalized set of public CI and developer-infrastructure companies, private financings, and relevant M&A transactions using comparable operating metrics.
      relatedQuestionRefs: [QV005]
