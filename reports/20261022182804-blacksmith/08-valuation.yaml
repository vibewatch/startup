company:
  name: Blacksmith
chapter:
  number: 8
  title: Valuation
  summary: Blacksmith has shown unusually rapid usage, revenue, and financing growth, but the public record does not disclose enough recurring revenue, margin, cap-table, or preference detail to support a defensible entry price. The evidence therefore supports a research-more posture despite strong operating momentum.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that Blacksmith is positioned at a bottleneck created by
      AI-assisted software development: more generated code increases the volume of
      builds and tests that must be validated. Independent coverage reports that the
      company said annual recurring revenue grew 17-fold. Fortune also reports that
      validation checks rose from about 5 million per week at the start of 2026 to
      90 million at publication, more than 10,000 companies used the platform, and
      revenue was in the tens of millions of dollars. The financing
      record also shows strong investor demand: a $45 million Series B at a $550
      million valuation was followed about two months later by a $66 million Series C
      at a reported $1 billion valuation. Those facts support a high-growth
      infrastructure thesis, but they do not establish revenue quality, gross margin,
      retention, or cash conversion.

      The anti-thesis is that the same infrastructure model carries substantial
      execution and valuation risk. Blacksmith owns much of its compute hardware, so
      capacity expansion requires capital and exposes it to memory and component
      shortages. Fortune reports that capacity planning is difficult and that demand
      rose 40% in one day after a new frontier model launch. It also identifies a
      strategic threat from AI model vendors and adjacent developer tools that may
      provide code validation themselves. Public evidence therefore supports
      monitoring growth and infrastructure economics rather than paying a premium
      solely for headline usage or a recent financing mark.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV014]
    tableRefs: [TV001, TV002]
    figureRefs: [FV001]
  - id: financing-and-entry-discipline
    title: Financing context and entry discipline
    body: >-
      The disclosed financing sequence is a useful reference point but not a
      substitute for an investable valuation. TechCrunch reports a $10 million Series
      A at a $60 million valuation in 2025, a $45 million Series B at $550 million
      two months before the current report, and a $66 million Series C at $1 billion.
      SiliconANGLE independently reports the Series C and approximately $125 million
      of total funding. The jump from $550 million to $1 billion is a financing
      reference, not evidence that common equity has the same value or that a new
      investor can obtain the same terms. The public sources do not disclose the
      capitalization table, liquidation preferences, option-pool treatment, secondary
      volume, debt, or security-specific rights.

      Entry discipline should therefore require a current cap table, the exact
      security and preference stack, primary-versus-secondary allocation, and
      trailing ARR with cohort retention and gross margin. A buyer should also test
      whether hardware ownership produces durable contribution-margin advantage after
      depreciation, colocation, memory, and replacement costs. Without those inputs,
      a precise multiple, target return, or exit value would be false precision. The
      appropriate decision implication is to keep the company on the diligence list
      and negotiate only against verified operating metrics and terms.
    claimRefs: [CV003, CV007, CV008, CV009, CV010]
  - id: scenarios-and-decision
    title: Scenarios, exit readiness, and decision
    body: >-
      The bull case is a durable AI-era validation workload with sustained customer
      expansion, improving hardware economics, and enough retention to convert rapid
      check growth into recurring revenue. The base case is continued usage growth but
      a slower conversion of usage into durable, high-margin revenue while Blacksmith
      funds capacity and faces competition from hyperscalers, model vendors, and
      developer-tool platforms. The bear case is multiple compression or a down-round
      if compute shortages, hardware intensity, customer concentration, or competing
      validation features weaken margins and retention. Public sources provide signals
      for these cases but not probabilities or a supportable valuation range.

      The recommendation is research-more, with medium confidence and a stretched
      valuation stance relative to disclosed operating evidence. The stance is not a
      claim that the company is worth less than its latest reported financing; it
      reflects that a $1 billion financing mark is difficult to underwrite without
      verified ARR, margin, retention, and terms. A move toward buy would require
      independently verifiable revenue and retention, a clean preference stack, and
      evidence that owned infrastructure creates durable unit-economic advantage. A
      move toward avoid would be warranted by a down round, material customer
      concentration, inability to procure capacity, or credible displacement by
      integrated AI coding platforms.
    claimRefs: [CV002, CV005, CV006, CV009, CV011, CV012, CV013]
    tableRefs: [TV004]
callouts:
  - calloutType: recommendation
    title: Research-more
    body: The growth signal is compelling, but public valuation support is incomplete; require operating and security-term diligence before underwriting an entry price.
    claimRefs: [CV003, CV007, CV008, CV009]
  - calloutType: risk
    title: Hardware intensity and competitive response
    body: Owned compute can improve control and performance, but it also creates capital, component, and capacity-planning exposure while AI model vendors may move into validation.
    claimRefs: [CV005, CV006]
