company:
  name: Blacksmith
chapter:
  number: 5
  title: Product & Technology
  summary: Blacksmith provides managed CI infrastructure for GitHub Actions, using owned bare-metal capacity and custom orchestration to accelerate code validation. Public evidence supports a credible infrastructure advantage and rapidly scaling workload, but leaves important details about security controls, reliability, integrations, and production maturity undisclosed.
sections:
  - id: product-and-workflow
    title: Product and customer workflow
    body: >-
      Blacksmith is described as a continuous-integration cloud that runs automated builds and tests before code is merged and deployed. The workflow starts with code pushed to repositories such as GitHub, continues through CI jobs executed on Blacksmith infrastructure, and ends with validation results that inform release decisions. TechCrunch says the service complements GitHub Actions and can be adopted by changing a single line of code, while Northflank's comparison characterizes the product as managed, high-performance GitHub Actions runners with caching, Docker build acceleration, and CI observability. The available evidence therefore supports a focused execution layer rather than a replacement for source control or workflow syntax. Public materials do not establish the full supported integration matrix, pricing mechanics, service-level commitments, or measurable customer-level outcomes.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: infrastructure-and-architecture
    title: Infrastructure and operating architecture
    body: >-
      The technical differentiation is an infrastructure operating model: Blacksmith buys and operates its own servers, deploys them across multiple locations, and writes software to schedule customer CI workloads. Fortune reports tens of thousands of company-owned machines and software that avoids repeating setup work for every test run; SiliconANGLE describes a dedicated CI cloud spanning global locations. Earlier reporting describes high-performance, gaming-grade CPUs and cites company claims of up to double processing speed and up to 75% lower compute costs, while a current engineering posting says the company orchestrates tens of millions of Firecracker VMs weekly, schedules 100k-plus vCPUs concurrently, and manages a petabyte-scale Ceph cluster. These details indicate substantial systems engineering, but they are company-reported or company-job-posting evidence, not an independently audited architecture or benchmark.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
  - id: maturity-trust-and-risks
    title: Maturity, trust, and technical risks
    body: >-
      Usage growth is a meaningful maturity signal: SiliconANGLE reports approximately 90 million code checks and more than 10,000 companies, while Fortune reports that weekly validation checks rose from about 5 million at the start of 2026 to 90 million. The same reporting identifies capacity planning and memory availability as operational constraints because demand can jump when a new frontier model launches; it also flags the possibility that AI model vendors could add competing validation features. Blacksmith's public evidence describes test analytics and an observability roadmap, but does not provide incident history, uptime, isolation design, secrets handling, compliance attestations, vulnerability disclosure practices, or independent performance tests. Those omissions are material for a CI provider that executes customer code and should remain diligence requests rather than being treated as proof of safe operation.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
  - id: evidence-boundaries
    title: Evidence boundaries and diligence priorities
    body: >-
      Two allocated net-new results were clear namesakes: one is a municipal
      document about a Blacksmith Drive address, and the other is an unrelated
      open-source penetration-testing project. Neither is retained as target
      evidence. The strongest relevant evidence is instead concentrated in
      independent technology reporting and a current job repost that reproduces
      company hiring language. No assigned source independently verifies
      Blacksmith's security posture, reliability, integration breadth, or
      customer benefit claims. A technical diligence package should therefore
      request architecture and threat-model documentation, isolation and secrets
      controls, SOC 2 or equivalent assurance, incident and SLA history, capacity
      and regional failover plans, benchmark methodology, and customer
      references tied to production workloads.
    claimRefs: [CE017]

