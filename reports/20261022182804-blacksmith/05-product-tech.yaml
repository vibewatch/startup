      - ["Inspect CI performance", "Use workflow logs and native CI tooling", "Use test analytics and planned observability", "Deeper GitHub Actions insight is reported", "Feature scope and customer adoption are not quantified"]
      - ["Validate AI-generated code volume", "Run more checks as coding agents generate more code", "Absorb bursty CI demand on managed infrastructure", "Fortune reports checks rose from about 5m to 90m weekly in 2026", "Growth is reported, not an independent quality or reliability measure"]
    notes: "Benefits are reported signals rather than controlled comparisons; no source in the assigned pool supplies a common benchmark population, period, or methodology."
    claimRefs: [CE002, CE003, CE006, CE010, CE011]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Dependency, Risk or diligence question]
    rows:
      - ["Source and workflow interface", "Receives GitHub Actions CI workloads", "GitHub repositories and Actions-compatible workflows", "Verify supported actions, permissions, secrets, and failure semantics"]
      - ["Job scheduler", "Schedules bursty CI jobs across compute", "Regional fleet capacity and orchestration software", "Test queueing, fairness, noisy-neighbor controls, and failover"]
      - ["Execution isolation", "Runs customer build and test workloads", "Firecracker VMs and host kernel controls", "Request threat model, sandbox escape history, and tenant isolation proof"]
      - ["Compute fleet", "Provides execution capacity and performance", "Owned servers, CPUs, memory, and data centers", "Memory shortages and hardware refresh can constrain availability"]
      - ["Storage and caching", "Stores CI artifacts or reusable setup state", "Reported petabyte-scale Ceph cluster and cache logic", "Verify durability, encryption, retention, and regional recovery"]
      - ["Analytics and observability", "Exposes execution and test insights", "Telemetry pipeline and GitHub Actions metadata", "Confirm data minimization, access controls, and shipped scope"]
    notes: "Architecture layers synthesize explicit descriptions from reporting and a job posting; the pool does not include a technical design document or independent controls assessment."
    claimRefs: [CE005, CE007, CE008, CE009, CE012, CE013]

figures:
  - id: FE001
    title: Blacksmith product architecture map
    type: stack
    summary: Managed CI workloads move from repository workflows through scheduling and isolated execution to validation analytics.
    data:
      layers:
        - name: Workflow interface
          label: Workflow interface
          detail: Repository workflows enter through GitHub Actions-compatible CI execution.
          items:
            - name: GitHub Actions compatibility
              detail: Customer code is pushed to repositories and CI jobs are run through an Actions-compatible workflow.
            - name: Repository handoff
              detail: Customers can route existing CI workflows to Blacksmith without replacing their source-control system.
        - name: Orchestration
          label: Orchestration
          detail: Scheduling and setup reuse coordinate bursty CI workloads.
          items:
            - name: Job scheduler
              detail: Custom software schedules bursty CI workloads across Blacksmith's global infrastructure.
            - name: Setup reuse
              detail: Software saves repetitive setup work that would otherwise be repeated for each test run.
        - name: Execution
          label: Execution
          detail: Isolated virtualized jobs run on owned bare-metal capacity.
          items:
            - name: Firecracker VM layer
              detail: A company job posting reports orchestration of tens of millions of Firecracker VMs each week.
            - name: Bare-metal fleet
              detail: Blacksmith buys and operates servers across multiple locations, including high-performance CPUs.
        - name: Security boundary
          label: Security boundary
          detail: Customer workloads require isolation, secrets handling, and controlled access; public evidence does not document the controls.
          items:
            - name: Tenant isolation
              detail: Firecracker-based execution is described, but independent isolation assurance is not available in the assigned pool.
        - name: Reliability operations
          label: Reliability operations
          detail: Capacity planning, regional placement, and recovery determine service continuity under bursty CI demand.
          items:
            - name: Capacity and failover
              detail: Component shortages and burst demand are reported risks requiring operational diligence.
        - name: Data and insight
          label: Data and insight
          detail: Storage, caching, analytics, and observability support the CI workflow.
          items:
            - name: Ceph storage
              detail: The same job posting reports a petabyte-scale Ceph cluster managed by the company.
            - name: Test analytics
              detail: Reporting describes test analytics and an observability roadmap for GitHub Actions.
            - name: Validation output
              detail: CI execution produces build and test results used for release decisions.
    claimRefs: [CE001, CE005, CE007, CE008, CE009, CE012]

callouts:
  - calloutType: strength
    title: Infrastructure control is the clearest product edge
    body: Owned hardware, custom scheduling, and reported high concurrency give Blacksmith a differentiated operating model versus generic cloud runners, although public benchmarks remain limited.
    claimRefs: [CE005, CE006, CE007, CE008]
  - calloutType: risk
    title: Capacity and trust controls remain under-documented
    body: Demand spikes and component shortages create capacity risk, while the assigned evidence does not establish sandbox security, reliability history, compliance, or incident response.
    claimRefs: [CE012, CE013, CE014, CE017]
  - calloutType: recommendation
    title: Make production controls a gating diligence request
    body: Before underwriting technical maturity, obtain independent assurance and operating evidence covering isolation, secrets, uptime, regional recovery, and customer-impacting incidents.
    claimRefs: [CE014, CE017]

