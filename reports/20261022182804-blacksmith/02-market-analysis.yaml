      - [AI-intensive software teams, "Engineering leadership and developer productivity", Developers and coding agents, Engineering infrastructure budget, "Validate AI-generated changes", Engineering/platform leadership, "More generated code shifts bottleneck to validation"]
      - [Regulated or reliability-sensitive teams, "Engineering plus security/reliability", Developers, Engineering and reliability budgets, "Gate releases with repeatable checks", Engineering/reliability leadership, "Need for predictable execution and auditability"]
      - [Smaller teams, "Technical founder or engineering lead", Developers, Engineering software budget, "Run hosted CI without operating fleet", Founder or engineering lead, "Avoid internal CI operations; willingness to pay is unverified"]
    notes: "Buyer roles and adoption paths are analytical segmentation hypotheses anchored in the cited workflow descriptions; customer-level budget ownership and willingness to pay remain unverified."
    claimRefs: [CM011, CM012, CM013, CM014]
