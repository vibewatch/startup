callouts:
  - calloutType: insight
    title: AI increases validation demand
    body: "The most credible near-term adoption driver is the shift from code-generation scarcity to validation capacity: AI coding tools increase code output while CI remains a required gate before merge and deployment."
    claimRefs: [CM011, CM012]
  - calloutType: risk
    title: Compute ownership cuts both ways
    body: "Owning hardware may improve performance control, but the cited component shortage and model-driven demand spikes make capacity planning and infrastructure financing material market-execution risks."
    claimRefs: [CM013, CM014]
  - calloutType: assumption
    title: TAM remains unproven
    body: "A defensible market size requires customer-level spend, workload economics, and a substitute benchmark; current public evidence supports traction, not a clean serviceable market estimate."
    claimRefs: [CM015, CM016]
