    title: Customer adoption and expansion journey
    summary: "The available evidence traces a path from engineering-team adoption to higher validation volume and possible enterprise expansion, with retention proof still open."
    type: journey-map
    data:
      nodes:
        - id: segment
          label: "500+ engineer teams"
          touchpoints: ["Engineering/platform buyer", "Developer workflow"]
        - id: deploy
          label: "GitHub Actions deployment"
          touchpoints: ["CI build and test execution", "Single-line migration described by TechCrunch"]
        - id: usage
          label: "Validation workload"
          touchpoints: ["5M checks/week at start of 2026", "90M checks reported in October 2026"]
        - id: ai-volume
          label: "AI-generated code volume"
          touchpoints: ["More code to validate", "AI-native startup adoption"]
        - id: expansion
          label: "Large-account expansion"
          touchpoints: ["Largest customers reportedly spend >$1M/year", "Capacity planning becomes material"]
        - id: durability
          label: "Renewal and retention"
          touchpoints: ["GRR/NRR not disclosed", "Cohort and churn evidence required"]
callouts:
  - calloutType: strength
    title: Reported adoption is scaling faster than the early customer base
    body: "Fortune reports more than 10,000 companies using Blacksmith in October 2026, versus about 5,000 in August, alongside 90 million validation checks."
    claimRefs: [CU006, CU007]
  - calloutType: risk
    title: Retention and concentration are not demonstrated
    body: "The pool lacks GRR, NRR, churn, renewal, cohort, and customer-level revenue data; the largest-customer spending disclosure increases the need for concentration analysis."
    claimRefs: [CU009, CU010, CU011]

