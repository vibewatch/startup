schemaVersion: "report-v2"
artifact: customers
slug: blacksmith
runDate: 2026-10-22
company:
  name: Blacksmith
chapter:
  number: 6
  title: Customers
  summary: Blacksmith's customer footprint appears to have expanded rapidly from hundreds of developer customers in 2025 to a company-reported 10,000-plus in October 2026, alongside a sharp increase in validation volume. The evidence is strongest for adoption scale and named startup users, but independent production-use, retention, concentration, and denominator detail remain limited.
sections:
  - id: customer-segments
    title: Buyer and user segments
    body: >-
      Blacksmith sells continuous-integration infrastructure to software teams whose
      developers need builds and tests to pass before code is merged and deployed. The
      clearest externally reported target is companies with teams of 500 or more
      engineers, while the named customer set is concentrated in technology startups
      and digital enterprises. Peak XV describes AI-native startups and digital
      enterprises as early adopters, and TechCrunch names Ashby, Chroma, Clerk,
      Devsisters, Mintlify, Pylon, Slope, Supabase, and VEED as customers running
      GitHub Actions through the platform. This supports a developer-led, infrastructure
      buyer profile, but the pool does not disclose customer revenue bands, payer
      authority, geographic mix, contract size distribution, or the share of usage
      from large enterprises versus startups.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory and usage proof
    body: >-
      The available evidence indicates accelerating adoption, but the measures are not
      interchangeable. TechCrunch reported hundreds of customers and $3.5 million ARR
      in 2025, whereas Fortune reported that Blacksmith said more than 10,000
      companies used the platform in October 2026, up from about 5,000 in August.
      Fortune also reported a rise from 5 million validation checks per week at the
      start of the year to 90 million, and a 17-fold ARR increase over the same
      period. These are company-reported figures carried by independent publications,
      not audited retention or revenue disclosures. The denominator for “companies”
      is unspecified, and the evidence does not establish how many accounts are
      active, paid, in production, or only evaluating the service.
    claimRefs: [CU005, CU006, CU007, CU008]
    tableRefs: [TU002]
  - id: durability-expansion
    title: Durability, expansion, and concentration
    body: >-
      The customer case is promising on usage momentum but incomplete on durability.
      Peak XV says it spoke with customers and observed rapid adoption, while Fortune
      reports that the largest customers spend more than $1 million annually. Those
      signals support the possibility of high-value expansion as AI-generated code
      increases validation demand, yet neither source supplies gross retention, net
      retention, churn, renewal rates, cohort behavior, or customer-level revenue
      concentration. Fortune also reports that Blacksmith's capacity planning is
      difficult because demand can jump when a stronger model launches, and that the
      company owns much of its hardware. This creates a customer-experience and
      concentration diligence question: demand may be strong, but service capacity
      and a small number of large accounts could affect durability.
    claimRefs: [CU009, CU010, CU011, CU012]
    tableRefs: [TU003]
  - id: customer-exhibits
    title: Customer evidence exhibits
    body: >-
      Named-company references are useful proof of market reach, but they vary in
      evidentiary strength. TechCrunch provides a contemporaneous list of customers
      running GitHub Actions through Blacksmith, while Fortune gives a later list and
      a company-reported usage count. SiliconANGLE repeats several customer names in
      coverage of the financing, which corroborates visibility but is not an
      independent customer reference. A separate TELUS page concerns the acquired
      Blacksmith Applications trade-promotion product, and a Federal Register result
      concerns blacksmith shops; both are retained only to document name-collision
      risk and are not evidence about this company's customer base. Direct customer
      interviews, contracts, usage exports, renewal records, and cohort data remain
      the appropriate next diligence inputs.
    claimRefs: [CU013, CU014]
    tableRefs: []

tables:
  - id: TU001
    title: Customer segmentation
    columns: [Segment, Buyer/user, Use case, Evidence of scale or value, Gap]
    rows:
      - [AI-native startups and digital enterprises, "Engineering/platform teams", "CI builds, tests, and code validation", "Peak XV says thousands already rely on the platform; no denominator disclosed", "Paid share, contract size, and geography"]
      - [Large software organizations, "Teams with 500+ engineers", "Run GitHub Actions and high-volume validation workloads", "TechCrunch reports this as the target segment", "Actual penetration and procurement cycle"]
      - [Named developer-tool companies, "Developers and engineering leaders", "GitHub Actions through Blacksmith", "TechCrunch names Ashby, Chroma, Clerk, Devsisters, Mintlify, Pylon, Slope, Supabase, and VEED", "Production depth and renewal status"]
      - [Large accounts, "Enterprise engineering organizations", "High-volume CI and validation", "Fortune says the largest customers spend more than $1M annually", "Number of such accounts and concentration"]
    notes: "Segment synthesis from TechCrunch, Fortune, and Peak XV; customer counts and spending are reported claims, not audited distributions."
    claimRefs: [CU001, CU002, CU003, CU012]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns: [Metric, Value, Period, Source and confidence, Implication, Missing denominator]
    rows:
      - [Customers, "hundreds", "September 2025 report", "TechCrunch; medium confidence", "Early commercial adoption was already visible", "Exact count, paid share, active definition"]
      - [ARR, "$3.5M", "2025 report", "TechCrunch; medium confidence", "Commercial scale was established before later expansion", "Audited revenue and ARR bridge"]
      - [Companies using platform, ">10,000", "October 2026 company claim reported by Fortune", "Fortune; medium confidence", "Reported reach expanded materially", "Paid, active, production, and account definitions"]
      - [Validation checks, "5M per week to 90M", "Start of 2026 to October 2026", "Fortune; medium confidence", "Workload volume accelerated sharply", "Checks per customer and repeat-usage distribution"]
    notes: "Values preserve the periods and denominators stated by the cited publications; no conversion rate or growth estimate is derived."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or cohort, Segment, Deployment/use case, Production vs pilot, Outcome or signal, Limitation]
    enumerationScope:
      coverage: sample
      basis: "Named companies appearing in assigned 2025-2026 coverage, not a complete customer census"
    rows:
      - [Supabase, Developer infrastructure, GitHub Actions through Blacksmith, "Customer reported by TechCrunch; production depth not specified", "Named reference in independent coverage", "No contract, renewal, or usage detail"]
      - [Granola, AI/software startup, Blacksmith code validation platform, "Customer reported by Fortune and SiliconANGLE; status not specified", "Appears in multiple 2026 reports", "No customer quote or outcome metric"]
      - [Handshake, Technology company, Blacksmith platform, "Customer reported by Fortune; status not specified", "Named in later customer list", "No retention, spend, or deployment scope"]
      - [LangChain, AI/software startup, Blacksmith platform, "Customer reported by Fortune; status not specified", "Named in later customer list", "No production, renewal, or cohort evidence"]
    notes: "Enumeration is a sample of named accounts, not exhaustive. Publication repetition is corroboration of reporting visibility, not an independent customer reference."
    claimRefs: [CU013, CU014]

figures:
