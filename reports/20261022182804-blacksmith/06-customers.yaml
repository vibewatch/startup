  evidenceGaps:
    - type: missing-source
      severity: material
      topic: "retention-gap"
      missingEvidence: "Gross retention, net retention, churn, renewal, cohort, contract-length, and customer-satisfaction data segmented by customer vintage and plan."
      whyItMatters: "Reported customer counts and validation volume show reach but do not establish durable paid adoption or expansion economics."
      diligencePath: "Request monthly cohort tables, renewal schedules, churn reasons, GRR/NRR definitions, and customer-level ARR concentration from management."
      relatedQuestionRefs: [QU005]
    - type: missing-source
      severity: material
      topic: "named-customers"
      missingEvidence: "Direct customer references or contracts confirming production status, deployment scope, outcomes, and renewal for named accounts."
      whyItMatters: "Media lists and investor commentary can establish visibility but do not independently verify production usage or customer value."
      diligencePath: "Obtain reference calls with at least three named customers and reconcile their statements to anonymized usage and renewal records."
      relatedQuestionRefs: [QU003]
    - type: missing-source
      severity: material
      topic: "concentration"
      missingEvidence: "Customer-level ARR and usage concentration, including the share represented by accounts spending more than $1 million annually."
      whyItMatters: "Large-account expansion may be attractive, but dependence on a few accounts could amplify churn, capacity, or procurement risk."
      diligencePath: "Request top-10 ARR and validation-volume shares, account-level renewal dates, and sensitivity to the largest customers' AI workloads."
