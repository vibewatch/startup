callouts:
  - calloutType: insight
    title: Demand is clearer than economics
    body: Job volume, customer count, and ARR growth point to strong adoption, but the public record does not show whether hardware utilization and realized pricing produce durable contribution margins.
    claimRefs: [CI001, CI002, CI003, CI005, CI009]
  - calloutType: assumption
    title: Funding is a capacity enabler, not runway evidence
    body: The Series C and total funding figures establish financing raised, not cash available after prior spending, current burn, debt, leases, or committed capex.
    claimRefs: [CI009, CI010, CI013]
