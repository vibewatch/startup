      - [Customer expansion, "Enterprise and startup CI usage", customer accounts, "More than 10,000 companies claimed", company-claimed, "Request cohort, retention, and concentration schedules"]
    notes: "Public sources describe mechanisms and company-claimed usage, not audited revenue recognition; null or undisclosed pricing and revenue fields require primary diligence."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [price or contract, basis, list versus realized, disclosed evidence, uncertainty, diligence ask]
    rows:
      - [Not disclosed, "Likely tied to CI infrastructure usage", "Unknown", "Sources describe the service but provide no price card", "Cannot infer realized revenue from job counts", "Obtain standard and enterprise pricing"]
      - [Not disclosed, "GitHub Actions migration", "Unknown", "One-line migration is described; no contract terms are public", "Switching friction is not price", "Review minimums, overages, and SLA credits"]
      - [60% lower cost claim, "Average customer cost comparison", "Company-claimed average", "Blacksmith reports 60% lower cost", "Workload mix and denominator are unspecified", "Benchmark representative workflows"]
      - [Roughly 40% lower runner costs, "LangChain production example", "Customer-reported realized proxy", "Quoted customer example excludes engineering-time savings", "Single customer and no baseline disclosed", "Validate invoices and scope of savings"]
    notes: "The cited percentages are cost comparisons, not Blacksmith revenue, gross margin, or cash savings verified across the customer base."
    claimRefs: [CI005, CI006, CI007, CI008]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [metric, value, confidence, why it matters, diligence ask]
    rows:
      - [Weekly CI jobs, "5 million to more than 90 million from January to October 2026", medium, "Shows demand and capacity load but not monetization", "Reconcile telemetry to billable jobs and revenue"]
      - [ARR growth, "17-fold since January 2026; absolute current ARR undisclosed in most coverage", medium, "Indicates rapid recurring-demand expansion", "Provide ARR bridge, churn, expansion, and cohort definitions"]
      - [Compute footprint, "Just under or nearly 10 MW", medium, "Indicates infrastructure intensity and capacity commitment", "Provide owned versus leased capacity and utilization"]
      - [Planned capacity growth, "At least fivefold in 2027", medium, "Creates capex, power, and execution exposure", "Provide capex schedule, lead times, and contracted demand"]
      - [Cash and runway, null, low, "Determines financing dependency and next-round timing", "Provide cash, burn, debt, leases, and runway"]
    notes: "Values are sourced or explicitly unavailable; the ARR and MW figures are not independently audited, and null means no public disclosure rather than zero."
    claimRefs: [CI001, CI002, CI009, CI010, CI011, CI012, CI013]
