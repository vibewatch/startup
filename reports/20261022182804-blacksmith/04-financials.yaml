company:
  name: Blacksmith
chapter:
  number: 4
  title: Financials
  summary: Blacksmith presents unusually rapid CI-volume, customer, and ARR growth, but public disclosure remains company-claimed and does not include revenue, gross margin, burn, cash, or runway. The financial case therefore rests on demand evidence and a plausible infrastructure model while leaving capital efficiency and realized unit economics unresolved.
sections:
  - id: monetization-and-traction
    title: Monetization and public traction
    body: >-
      Blacksmith sells infrastructure that runs customers' continuous-integration builds and tests, with migration for GitHub Actions described as a one-line workflow change. Public reporting identifies a usage-based infrastructure model but does not disclose a price card, contract minimum, realized revenue, or revenue mix. The strongest disclosed traction indicators are company claims: weekly CI jobs rose from 5 million in January 2026 to more than 90 million, ARR rose 17-fold over the same period, and the customer base exceeded 10,000. TechCrunch previously reported $3.5 million ARR and more than 700 customers in September 2025, providing an earlier point-in-time baseline rather than a current financial statement. The gap between usage growth and disclosed dollars prevents direct assessment of conversion, retention, or revenue quality.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-unit-economics
    title: Cost structure and unit economics
    body: Blacksmith's cost thesis is operational rather than software-margin pure. It buys and operates hardware in data centers, using purpose-built capacity for spiky CI workloads instead of renting only general-purpose cloud machines. The company claims jobs run twice as fast and cost 60% less on average; a LangChain infrastructure engineer was quoted as reporting roughly 40% runner-cost savings, excluding engineering time. These are not audited gross-margin data, and the difference between the headline average and the customer example signals workload dependence. Hardware ownership may improve control over compute economics, but it also creates depreciation, colocation, power, memory, maintenance, and capacity-utilization exposure. Public sources do not provide CAC, payback, contribution margin, failure cost, or support cost.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-financial-verdict
    title: Capital adequacy and underwriting verdict
    body: The October 2026 Series C materially extends Blacksmith's financing capacity but does not establish runway. Sequoia led a $66 million round at a reported $1 billion valuation, bringing total funding to approximately $125 million; prior reporting described a $45 million Series B at a $550 million valuation. Fortune reports that most new money is intended for computing power, with the footprint near 10 megawatts and a planned fivefold expansion in 2027, while also describing exposure to compute and memory shortages. The company has not disclosed cash on hand, burn, debt, lease obligations, capex schedule, or next-round trigger. The resulting verdict is strong demand with infrastructure-scale capital requirements, not demonstrated cash self-sufficiency. Underwriting should require cohort revenue, realized price per job or compute unit, gross contribution after hardware and data-center costs, and a capacity plan tied to contracted demand.
    claimRefs: [CI009, CI010, CI011, CI012]
    tableRefs: []
  - id: diligence-blockers
    title: Financial diligence blockers
    body: The public record supports a growth narrative but leaves the inputs needed for a financing-quality model unavailable. There is no disclosed bridge from CI jobs to recognized revenue, no published list-versus-realized pricing schedule, and no customer-level concentration or retention data. The financing record also does not reveal how much of the new round is committed to hardware purchases versus hiring and working capital. Because Blacksmith owns much of its infrastructure, a diligence model should separate recurring software-like revenue from pass-through or capacity-sensitive economics and stress utilization, power, hardware lead times, and AI-agent demand volatility. The open strategic risk is that GitHub or model vendors could absorb validation functionality, which could pressure pricing or increase customer acquisition costs even while aggregate CI demand grows.
    claimRefs: [CI013, CI014]
    callouts:
      - calloutType: risk
        title: Underwriting remains disclosure-limited
        body: Public traction is substantial, but cash, burn, margin, realized pricing, retention, and customer concentration are not disclosed; financing should not be underwritten from ARR growth or total funding alone.
        claimRefs: [CI003, CI009, CI013]
