  topStrengths:
    - Reported customer and validation-volume growth places Blacksmith at a potentially important AI-era software bottleneck.
    - Owned compute and custom orchestration may provide performance and cost control versus generic cloud runners.
    - Institutional financing support includes Sequoia, Peak XV, GV, and other recurring investors.
  topRisks:
    - Revenue quality, retention, margins, cash position, and capital efficiency are not publicly disclosed.
    - Hardware ownership creates capacity, memory, depreciation, and supply-chain exposure.
    - Security controls, reliability history, isolation design, and compliance evidence remain under-documented.
    - AI coding platforms and GitHub could expand into adjacent code-validation workflows.
  unresolvedGaps:
    - Obtain verified recurring revenue, gross margin, retention, customer concentration, cash, and runway data.
    - Reconcile financing totals, cap-table ownership, liquidation preferences, and primary-versus-secondary proceeds.
    - Review independent security assurance, sandbox and secrets controls, incident history, SLAs, and regional failover.
    - Validate infrastructure unit economics and the durability of reported performance and cost savings.
