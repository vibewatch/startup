evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled capitalization and financing schedule showing gross proceeds, round dates, debt, and whether totals
      include unannounced or secondary transactions.
    whyItMatters: >-
      Conflicting lifetime-funding figures change dilution, financing runway, and the interpretation of the latest
      valuation.
    diligencePath: Request the current cap table, signed financing summaries, bank statements, and Form D filings from management.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Board composition, voting rights, liquidation preferences, and succession responsibilities.
    whyItMatters: A concentrated founder or investor structure could materially affect control and key-person risk.
    diligencePath: Obtain the charter, investor rights agreement, board roster, and latest governance materials under NDA.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: >-
      Independent verification of customers, ARR, weekly checks, gross margin, and employee count using consistent
      periods and definitions.
    whyItMatters: >-
      Headline growth is central to the investment case, but the retained figures are largely company-reported and not
      directly comparable.
    diligencePath: >-
      Request metric definitions, cohort data, billing exports, usage logs, and an employee roster as of the reporting
      date.
    relatedQuestionRefs:
      - QO006
      - QO007
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: Independent CI infrastructure market revenue and customer-spend data segmented by geography and company size.
    whyItMatters: Without a denominator, company-reported customer and check counts cannot establish TAM, SAM, SOM, or market share.
    diligencePath: >-
      Commission or obtain a segmented CI spend study and reconcile it to Blacksmith's paying-customer and workload
      cohorts.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Pricing, retention, expansion, gross margin, workload unit economics, and customer concentration by segment.
    whyItMatters: Adoption volume may not translate into durable revenue or attractive economics, especially with owned compute.
    diligencePath: Request cohort revenue, contract, renewal, compute-cost, and customer-concentration schedules under NDA.
    relatedQuestionRefs:
      - QM005
      - QM008
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: minor
    topic: customer-count
    missingEvidence: A reconciled definition and time series for companies using the platform versus paying customers.
    whyItMatters: >-
      The 700-customer, 6,000-company, and 10,000-company snapshots use different dates and may use different
      denominators.
    diligencePath: Ask management for monthly active, paying, contracted, and cumulative customer definitions with cohort bridges.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Primary current pricing, discounts, billing minimums, and comparable customer total cost for Blacksmith and each
      major specialist.
    whyItMatters: >-
      List prices from a competitor comparison do not establish realized economics or whether Blacksmith's cost
      advantage survives workload, architecture, and support differences.
    diligencePath: >-
      Obtain current vendor pricing sheets and anonymized invoices for matched Linux, ARM, Windows, and Docker-heavy
      workloads.
    relatedQuestionRefs:
      - QP003
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: infrastructure
    missingEvidence: >-
      Primary documentation and operating data on hardware procurement, geographic capacity, queue-time performance, and
      component availability.
    whyItMatters: >-
      Owned infrastructure can improve unit economics but can also create supply and capacity constraints that determine
      whether the reported advantage scales.
    diligencePath: >-
      Review capacity plans, supplier concentration, data-center commitments, queue-time distributions, and outage or
      saturation history.
    relatedQuestionRefs:
      - QP004
      - QP008
  - type: missing-source
    severity: material
    topic: security
    missingEvidence: >-
      Primary security documentation covering SBOMs, attestations, egress policy, tenancy, isolation, and compliance
      scope.
    whyItMatters: >-
      Enterprise buyers may select a slower or more expensive runner if it satisfies software-supply-chain and
      network-control requirements.
    diligencePath: >-
      Review current security documentation, SOC reports, customer procurement requirements, and independent
      attestations.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Customer interviews or cohort data on migration effort, workflow portability, multi-homing, renewal, and
      retention.
    whyItMatters: >-
      A one-line runner-label change can make competitive displacement easier even when the product is operationally
      useful.
    diligencePath: >-
      Interview customers that moved from GitHub-hosted, specialist, and self-hosted runners and request retention by
      cohort.
    relatedQuestionRefs:
      - QP007
  - type: missing-source
    severity: minor
    topic: benchmark
    missingEvidence: Independent benchmark results across representative repositories, cache hit rates, queue times, and failure rates.
    whyItMatters: >-
      Company-reported speed and cost claims are central to differentiation but are not independently validated in the
      assigned evidence.
    diligencePath: Run a controlled bake-off using matched repositories, concurrency, regions, architectures, and test suites.
    relatedQuestionRefs:
      - QP002
      - QP008
  - type: missing-source
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
      Audited or management-provided revenue bridge, realized pricing, gross margin, contribution margin, CAC, payback,
      retention, and customer concentration.
    whyItMatters: >-
      The public record shows demand growth but cannot establish revenue quality, margin durability, or sales
      efficiency.
    diligencePath: >-
      Request monthly cohort data, ARR-to-revenue reconciliation, customer contracts, invoices, churn, expansion, CAC,
      and gross-margin bridge under NDA.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI003
      - QI008
      - QI009
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Cash balance, monthly burn, committed capex, hardware ownership and leases, debt facilities, and runway after the
      Series C.
    whyItMatters: >-
      Owned infrastructure and a planned fivefold capacity expansion can create financing dependency even with strong
      ARR growth.
    diligencePath: >-
      Obtain the latest balance sheet, 24-month cash forecast, capex plan, debt schedule, lease commitments, and
      board-approved financing triggers.
    relatedQuestionRefs:
      - QI006
      - QI009
  - type: missing-source
    severity: material
    topic: financing-risk
    missingEvidence: Scenario analysis for platform disintermediation by GitHub, cloud vendors, or AI model providers.
    whyItMatters: >-
      Validation may be bundled into incumbent developer platforms, pressuring pricing, retention, and acquisition
      economics.
    diligencePath: >-
      Request win-loss analysis, churn reasons, competitive pricing tests, and customer dependency by CI platform and
      AI-agent workflow.
    relatedQuestionRefs:
      - QI007
  - type: missing-source
    severity: material
    topic: trust
    missingEvidence: >-
      Independent evidence of sandbox isolation, secrets management, vulnerability handling, compliance, uptime, and
      customer-impacting incidents.
    whyItMatters: >-
      Blacksmith executes customer code, so control failures could expose source code, credentials, build artifacts, or
      release integrity.
    diligencePath: >-
      Request SOC 2 or equivalent reports, security architecture and threat model, incident register, SLA history, and a
      customer security questionnaire.
    relatedQuestionRefs:
      - QE003
      - QE007
  - type: missing-source
    severity: material
    topic: performance
    missingEvidence: Reproducible benchmark comparing Blacksmith with GitHub-hosted or self-hosted runners on matched workloads.
    whyItMatters: >-
      Reported speed and cost advantages are central to product differentiation but lack a disclosed population,
      methodology, or independent replication.
    diligencePath: >-
      Obtain benchmark methodology, workload mix, percentile latency, cache assumptions, and third-party customer
      references.
    relatedQuestionRefs:
      - QE004
  - type: missing-source
    severity: material
    topic: integrations
    missingEvidence: >-
      Complete current integration and compatibility matrix, including actions, repositories, secrets, artifacts, and
      deployment workflows.
    whyItMatters: >-
      A narrow compatibility surface could increase migration cost or limit adoption despite the runner performance
      proposition.
    diligencePath: Request current product documentation, supported integrations, known limitations, and failure-mode runbooks.
    relatedQuestionRefs:
      - QE005
  - type: missing-source
    severity: material
    topic: capacity-risk
    missingEvidence: Regional capacity, component procurement, failover, and disaster-recovery evidence.
    whyItMatters: >-
      Owned hardware improves control but creates exposure to memory shortages, refresh cycles, and burst-demand
      mismatch.
    diligencePath: >-
      Review fleet utilization, capacity buffers, supplier concentration, recovery objectives, and recent demand-spike
      postmortems.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      No company-attributable public repository, package registry, release history, API forum, or practitioner-community
      source was present in the relevant assigned evidence.
    whyItMatters: >-
      A company-issued recruiting post signals architecture and scale but does not independently demonstrate developer
      adoption, release cadence, or ecosystem health.
    diligencePath: >-
      Obtain the company's canonical product documentation, repositories, package links, changelog, status page, and
      community-support metrics.
    relatedQuestionRefs:
      - QE009
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: >-
      Gross retention, net retention, churn, renewal, cohort, contract-length, and customer-satisfaction data segmented
      by customer vintage and plan.
    whyItMatters: >-
      Reported customer counts and validation volume show reach but do not establish durable paid adoption or expansion
      economics.
    diligencePath: >-
      Request monthly cohort tables, renewal schedules, churn reasons, GRR/NRR definitions, and customer-level ARR
      concentration from management.
    relatedQuestionRefs:
      - QU005
  - type: missing-source
    severity: material
    topic: named-customers
    missingEvidence: >-
      Direct customer references or contracts confirming production status, deployment scope, outcomes, and renewal for
      named accounts.
    whyItMatters: >-
      Media lists and investor commentary can establish visibility but do not independently verify production usage or
      customer value.
    diligencePath: >-
      Obtain reference calls with at least three named customers and reconcile their statements to anonymized usage and
      renewal records.
    relatedQuestionRefs:
      - QU003
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: >-
      Customer-level ARR and usage concentration, including the share represented by accounts spending more than $1
      million annually.
    whyItMatters: >-
      Large-account expansion may be attractive, but dependence on a few accounts could amplify churn, capacity, or
      procurement risk.
    diligencePath: >-
      Request top-10 ARR and validation-volume shares, account-level renewal dates, and sensitivity to the largest
      customers' AI workloads.
    relatedQuestionRefs:
      - QU007
  - type: enumeration-incomplete
    severity: minor
    topic: segments
    missingEvidence: >-
      A complete customer census by geography, vertical, company size, payer, use case, and paid-versus-evaluation
      status.
    whyItMatters: The named references are a sample and may not represent the actual mix or revenue-weighted customer base.
    diligencePath: Reconcile CRM and billing exports to a segmented customer census as of the run date.
    relatedQuestionRefs:
      - QU001
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: security-compliance
