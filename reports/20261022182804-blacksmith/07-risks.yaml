      - ["Entity and contractual counterparty identification", "Global diligence", "Search pool contains unrelated mining and Rowhammer uses of the Blacksmith name", "Medium", "Medium", "Partial", "Medium", "Verify legal entity, contract entity, domains, and all security/legal records against blacksmith.sh"]
    notes: "Publicly retained evidence did not establish a specific Blacksmith lawsuit, regulator action, certification, or SLA. Null-like status language is an evidence gap, not evidence that no issue exists."
    enumerationScope:
      coverage: partial
      basis: "Publicly accessible assigned URLs and implementation evidence through 2026-10-22; private contracts and regulatory databases were not available."
    claimRefs: [CR009, CR014]
  - id: TR002
    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Compute or memory shortage during AI-driven workload spikes", "Medium", "High", "Developing", "High", "Capacity headroom, regional failover, and SLA performance are undisclosed"]
      - ["Persistent-cache snapshot lineage or concurrent-writer error", "Medium", "High", "Developing", "High", "Root cause of older-parent restoration was not confirmed"]
      - ["Workflow/control-plane or CLI integration failure", "Medium", "High", "Developing", "Medium-high", "Need production incident and recovery metrics across supported GitHub organizations"]
      - ["Build failure signal misinterpreted as platform incident", "High", "Medium", "Partial", "Medium", "Separate customer test/application failures from Blacksmith service failures in reporting"]
    notes: "The 801 PLANET review is a single customer account and explicitly cautions that its 13.75% failure rate is not a Blacksmith incident rate. Operational severity is therefore directional, not a population estimate."
    claimRefs: [CR005, CR006, CR007, CR008, CR010]
  - id: TR003
    title: Partner and dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Workflow control plane", "GitHub / GitHub Actions", "Source integration and orchestration", "High for GitHub-centric customers", "API, organization-policy, or hosted-runner change disrupts execution or migration path", "High", "Maintain supported runner and recovery paths; verify API and outage runbooks", "High"]
      - ["Source and deployment ecosystem", "AWS, GitLab, CodeCommit, ECR/ECS", "Customer-specific source, identity, and deployment path", "Customer-dependent", "Incompatible source control or private-network requirements make Blacksmith less simple than native tooling", "Medium", "Qualify control-plane fit and use narrowly scoped OIDC roles", "Medium"]
      - ["AI coding vendors and GitHub", "Anthropic, OpenAI, Cursor, Microsoft/GitHub", "Adjacent code generation, testing, and hosted execution", "Strategic", "Bundled validation compresses pricing or removes the need for a separate CI layer", "Medium", "Demonstrate independent performance, reliability, and analytics value", "High"]
    notes: "Concentration is qualitative because the pool does not disclose revenue by platform or customer. The GitHub dependency is product-architecture evidence, not a claim that an outage occurred."
    claimRefs: [CR011, CR012, CR013]

