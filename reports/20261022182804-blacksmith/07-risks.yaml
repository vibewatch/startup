          values: ["", "Medium likelihood", "High residual", ""]
        - label: Cache snapshot lineage error
          values: ["", "Medium likelihood", "High residual", ""]
        - label: GitHub or CLI integration failure
          values: ["", "Medium likelihood", "Medium-high residual", ""]
        - label: AI platform substitution
          values: ["", "Medium likelihood", "High residual", ""]
        - label: Customer-specific source-control mismatch
          values: ["", "Medium likelihood", "Medium residual", ""]
        - label: Legal/privacy evidence gap
          values: ["", "Medium likelihood", "High residual", ""]
    claimRefs: [CR001, CR006, CR011, CR012]

callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Request capacity headroom and SLA data, cache correctness and recovery evidence, security/compliance artifacts, and a customer-level incident taxonomy before underwriting scale.
    claimRefs: [CR001, CR006, CR009]
  - calloutType: assumption
    title: Thesis-break trigger
    body: Treat sustained queueing, repeated cache corruption, or a bundled validation feature from a core platform as a thesis-break event unless Blacksmith can show measurable reliability or workflow advantages.
    claimRefs: [CR006, CR011, CR012]

