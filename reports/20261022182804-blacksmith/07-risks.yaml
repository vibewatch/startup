schemaVersion: "report-v2"
artifact: risks
slug: blacksmith
runDate: 2026-10-22
company:
  name: Blacksmith
chapter:
  number: 7
  title: Risks
  summary: Blacksmith's principal risks are capacity and hardware exposure, dependency on the GitHub control plane, cache and execution reliability, and the possibility that AI coding vendors internalize validation. Public evidence is strongest on operating constraints and customer-observed failure modes; legal and security posture remain under-disclosed.
sections:
  - id: risk-ranking
    title: Ranked risk assessment
    body: >
      Blacksmith's risk profile is shaped by a deliberate infrastructure choice: it buys and operates its own compute rather than renting only hyperscaler capacity. Fortune reports that this improves performance control but exposes the company to shortages of compute and memory, while capacity planning becomes difficult when model launches create abrupt demand spikes. SiliconANGLE describes a more than 40% single-day workload increase after one model launch. This creates a coupled availability and margin risk: capacity bought too early can depress utilization, while capacity bought too late can constrain service quality or growth. The risk is material because the company's stated expansion plan also calls for buying more servers. The evidence supports high severity for capacity execution, but not a quantified outage probability.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-and-security
    title: Operational, quality, and security exposure
    body: >
      A customer account review provides useful but bounded operating evidence. Across an unfiltered organization view, 801 PLANET recorded 1,527 Blacksmith jobs from January 23 to July 23, 2026, with a 13.75% failure rate; the reviewer explicitly says this is not a Blacksmith incident rate because it combines failed tests, application errors, workflow mistakes, and deliberate failures. The same review found cache-lineage problems: a successful sticky-disk commit was later followed by restoration of an older parent snapshot, and cold or invalidated builds were materially slower than the prior median. A separate implementation plan records authentication, environment propagation, shallow-fetch, stop semantics, and API-outage cleanup findings. These are integration and reliability risks, not proof of a platform-wide incident rate.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependency-and-thesis-breaks
    title: Dependencies, competition, and thesis-break triggers
    body: >
      Blacksmith keeps GitHub Actions as the workflow control plane and changes the runner target, so GitHub organization support and GitHub availability are strategic dependencies. The 801 PLANET review says the service is unavailable for personal repositories and becomes a less simple choice when GitLab or CodeCommit is the source of truth. Fortune and SiliconANGLE also identify a structural competitive risk: AI model vendors and GitHub already provide adjacent test execution or hosted machines, and could absorb validation. The company's current growth claims are reported by the company through journalists, while independent operating baselines remain sparse. The investment thesis should therefore break if capacity shortages cause sustained queueing or SLA deterioration, cache correctness remains unresolved, or core AI and source-control platforms bundle equivalent validation at lower friction.
    claimRefs: [CR011, CR012, CR013, CR014]
    tableRefs: [TR003]

