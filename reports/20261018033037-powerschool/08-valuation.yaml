  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: post-lbo-capital-structure
      missingEvidence: Current debt quantum, covenant package, amortization schedule, interest cost, and any preferred or preference overhang after the Bain buyout.
      whyItMatters: Without the capital-structure burden, investors cannot convert the disclosed control price into an equity return case or a reliable downside floor.
      diligencePath: Request the current lender deck, debt agreements, cap table, and any board-approved financing summary during management diligence.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: breach-liability-quantification
      missingEvidence: Quantified breach reserve, insurance recovery assumptions, settlement exposure, and current renewal cohort data after the 2024 incident.
      whyItMatters: These items determine whether PowerSchool can defend Bain's entry valuation or whether legal and retention drag should push the underwriting case materially lower.
      diligencePath: Obtain management's latest breach-response reserve memo, insurance correspondence, and cohort renewal bridge for 2025 to 2026 school-year contracts.
      relatedQuestionRefs: [QV003, QV007, QV008]
