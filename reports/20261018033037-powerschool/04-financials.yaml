      - [Finance and HR operations, "Subscription software with analytics and workflow automation", district contract, "Current official offering; no public numeric list price on cited page", "Good product evidence; weak pricing transparency", "List price, realized price, implementation fees, and attach rate to HR modules"]
      - [Learning and classroom workflow, "Subscription or renewal contract", district/site contract, "Public renewal example includes a $285,339 Schoology LMS/PLMS renewal", "Transactional proof exists, but example pricing is not portfolio-wide", "Seat counts, contract term, services attach, and renewal uplift"]
      - [Communications and messaging, "Subscription renewal contract", district/site contract, "Public example includes a $36,748 SchoolMessenger contract over three years", "Shows module-level monetization, not standardized price architecture", "Average contract value, churn, and bundle attachment to SIS"]
      - [Partner-extended workflows, "Partner integrations widen the product surface and potential attach opportunities", district platform account, "Partner ecosystem is visible; direct revenue-share economics are not", "Supports ecosystem GTM inference but not margin math", "Partner revenue share, reseller economics, and implementation ownership"]
    notes: >-
      Rows mix official product-surface evidence with isolated public contract examples.
      Public sources support revenue mechanisms, not a quantified revenue mix or
      product-level ARR split.
    claimRefs: [CI001, CI002, CI003, CI009, CI010, CI015]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product or contract
      - Price / unit / contract
      - List vs realized pricing
      - Discounts or unknowns
      - Source
    rows:
      - ["Budget & Finance suite", "No numeric public list price on cited page; contact-sales flow", "List price unavailable", "Discounts, services, implementation, and user tiers unknown", "PowerSchool budget & finance page"]
      - ["Schoology LMS / PLMS renewal", "$285,339 renewal", "Realized contract example", "Term details, seat base, discounting, and services mix not disclosed", "Civic IQ contract example"]
      - ["SchoolMessenger", "$36,748 over three years", "Realized contract example", "Scope, district size, and negotiated concessions not disclosed", "Civic IQ contract example"]
      - ["Digital document storage / software examples", "$3,280 to $30,700 across cited examples", "Realized contract examples", "Examples span different modules and should not be treated as a single price book", "Civic IQ contract examples"]
    notes: >-
      The assigned public evidence shows contract examples and contact-sales motions,
      not a reliable list-price architecture. Realized contract values are district-
      specific and not evidence of portfolio-wide realized pricing.
    claimRefs: [CI009, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / null
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [CAC and payback, null, low, "Public evidence does not disclose sales efficiency, making growth quality hard to underwrite", "Provide CAC, payback, and win-rate data by major product cloud"]
      - [Gross margin, null, low, "Margin path is central to software underwriting, but current post-take-private gross margin is not public here", "Provide LTM gross margin and gross-profit bridges by hosted vs services-heavy products"]
      - [Cash balance and runway, null, low, "Debt-backed ownership matters only in context of cash and covenant headroom, which are not public in this pool", "Provide cash, revolver availability, covenant package, amortization, and maturity schedule"]
      - ["Retention quality after breach", "Renewals continued, but terms reportedly tightened", medium, "Directionally positive for stickiness, but could still mask price pressure or higher concessions", "Provide GRR, NRR, churn, and renewal pricing by cohort before and after the breach"]
      - ["Installed-base scale", ">55M students / >17k customers at announcement; >60M students on current homepage", medium, "Scale supports revenue durability, but not monetization per account or margin quality", "Provide paying-customer count, ARPA, module penetration, and revenue per district cohort"]
    notes: >-
      Null values reflect unavailable public data in the assigned evidence set, not
      zero. The one directional signal is renewal continuity after the breach, which is
      not a substitute for disclosed retention or margin metrics.
    claimRefs: [CI005, CI006, CI007, CI008, CI009, CI014, CI016]
