    claimRefs: [CI001, CI002, CI003, CI009, CI010, CI011, CI015, CI016]
callouts:
  - calloutType: risk
    title: "Underwriting blocker: post-take-private opacity"
    body: >-
      The public evidence names the acquisition valuation and lender roster, but not
      the debt amount, pricing, covenants, cash balance, or current margin profile.
      That is the primary reason the chapter stops short of an underwritten capital-
      adequacy view.
    claimRefs: [CI004, CI005, CI008, CI014]
  - calloutType: insight
    title: Revenue quality looks broader than it looks transparent
    body: >-
      Product breadth, partner extensions, and post-breach renewals all point to a
      sticky district platform, but public contract examples are still only spot checks
      and not a substitute for realized pricing or retention data.
    claimRefs: [CI003, CI009, CI010, CI011, CI015, CI016]
