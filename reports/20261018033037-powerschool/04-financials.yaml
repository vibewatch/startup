  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: capital-adequacy
      missingEvidence: Current LTM revenue, ARR, gross margin, EBITDA, cash balance, and detailed post-LBO debt schedule.
      whyItMatters: These are the minimum inputs needed to underwrite leverage, runway, and margin resilience under private ownership.
      diligencePath: Request the latest lender deck, monthly management accounts, debt agreements, covenant calculations, and a sources-and-uses bridge from management.
      relatedQuestionRefs: [QI005, QI006, QI007]
    - type: private-evidence-only
      severity: material
      topic: pricing-quality
      missingEvidence: Realized pricing, discounts, contract term distribution, seat counts, and implementation or services mix by product cloud.
      whyItMatters: Public contract examples cannot show whether revenue quality comes from healthy price realization or from concessions and bundling.
      diligencePath: Request cohort renewal files, top-50 customer contracts, pricing waterfalls, and product-level ARR by district size band.
      relatedQuestionRefs: [QI002, QI003]
    - type: private-evidence-only
      severity: material
      topic: breach-liability
      missingEvidence: Breach reserve, insurance recovery, settlement exposure, and churn or NRR changes attributable to the cyber incident.
      whyItMatters: Ongoing litigation and trust remediation can affect cash needs, customer retention, and required security spend.
      diligencePath: Request legal reserve memos, insurance correspondence, breach-remediation budget, and renewal analytics for affected districts.
      relatedQuestionRefs: [QI004, QI007]
