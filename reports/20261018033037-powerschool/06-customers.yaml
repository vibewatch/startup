  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-durability
      missingEvidence: Post-breach GRR, NRR, churn, renewal rates, and average contract terms by major product line.
      whyItMatters: Public footprint and procurement signals cannot prove whether the installed base is sticky or merely broad.
      diligencePath: Request cohort retention data, renewal cohorts, and contract-term disclosure from management and board materials.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue share, exposure to statewide contracts, and reseller or channel concentration by product.
      whyItMatters: Concentration can turn a large installed base into a much riskier revenue base than the customer-count headline implies.
      diligencePath: Ask for the top-10 customer concentration schedule, state contract exposure, and channel mix in the data room.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: minor
      topic: named-customer-proof
      missingEvidence: Independent deployment and outcome evidence for more named districts across multiple modules.
      whyItMatters: The current public set proves customer association better than it proves measured ROI, renewal quality, or fleet-wide adoption.
      diligencePath: Collect customer references, procurement files, or implementation case studies from independent district or state sources.
      relatedTableRefs: [TU003]
