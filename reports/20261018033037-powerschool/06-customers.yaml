schemaVersion: "report-v2"
artifact: customers
slug: powerschool
runDate: 2026-10-18
company:
  name: PowerSchool
chapter:
  number: 6
  title: Customers
  summary: >-
    PowerSchool still shows broad K-12 reach, with current sources pointing to over 60 million
    students, more than 18,000 school organizations, and continued district renewals after the
    2024 breach. The customer story is strongest around the SIS-led land-and-expand motion into
    special programs, finance/HR, and adjacent modules, but public retention, concentration, and
    post-breach cohort quality remain materially under-disclosed.
sections:
  - id: customer-footprint
    title: Footprint and segment breadth
    body: >-
      The installed base remains large enough that customer breadth is still a core part of the
      thesis. PowerSchool's current homepage says the platform serves over 60 million students in
      90 countries, while a third-party 2026 breach explainer describes the SIS as used by more
      than 18,000 school organizations. The historical public-company record is directionally
      consistent: the 2022 annual report said PowerSchool served more than 16,000 customers,
      reached over 90 of the 100 largest U.S. districts by enrollment, and held more than 30
      statewide, province-wide, or territory-wide contracts in North America. The buyer map is
      also broader than a single principal or curriculum owner because the product set spans SIS,
      student support, classroom workflows, district analytics, finance, HR, and partner-led
      extensions.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU009, CU010, CU011]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Adoption proof and expansion vectors
    body: >-
      Evidence of real use is strongest where PowerSchool names live district references and
      module-level activity rather than relying on unlabeled logos. Special Programs reports 9.5
      million students supported, 1,200-plus districts supported, 417,297 forms completed in 2025,
      and four statewide partnerships, which is useful because it shows activity inside a product
      other than the core SIS. The homepage adds named references spanning superintendent,
      classroom, special education, analytics, and technology roles, while Civic IQ reports that
      districts continued signing and renewing PowerSchool contracts through 2025 and into 2026.
      Together, that points to a credible land-and-expand motion from a system-of-record anchor
      into adjacent instructional, student-support, and district-operations budgets.
    claimRefs: [CU005, CU007, CU008, CU011, CU012, CU013, CU014]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-friction
    title: Durability, procurement friction, and concentration limits
    body: >-
      Durability looks better in footprint and renewal signals than it does in disclosed retention
      metrics. Civic IQ says districts kept renewing despite the breach, but also says buyers are
      adding enhanced security provisions, evaluating alternatives, and tightening cybersecurity
      oversight, which implies extra friction in future renewals and expansions. Security.org's
      reporting makes the trust issue concrete: the 2024 incident exposed data for approximately
      62 million students and 9.5 million teachers, and extortion attempts later reached individual
      districts. What remains missing is the quantitative quality of the base: the assigned source
      pool does not disclose GRR, NRR, churn, average contract term, top-customer concentration, or
      channel concentration, so public evidence still cannot separate a very sticky installed base
      from a broad but more contested renewal book.
    claimRefs: [CU013, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Scale
      - Revenue / strategic value
      - Gap
    rows:
      - - Core SIS
        - District administrators, registrars, educators, parents, students / district software budget
        - System of record for enrollment, attendance, grades, compliance, and family records
        - ">18,000 school organizations; >60M students; 90 countries"
        - Anchor product that supports broad workflow embed and cross-sell
        - No public split between core-SIS revenue and attached modules
      - - Student support and compliance
        - Special education leaders, case managers, families / district special-programs budget
        - IEP, 504, ELL, gifted, service capture, and compliance workflows
        - "9.5M students; 1,200+ districts; 4 statewide partnerships"
        - Evidence that adoption extends into regulated student-support workflows
        - No disclosed attach rate versus the SIS installed base
      - - Teaching, learning, and student engagement
        - Teachers, students, counselors / instructional-technology budget
        - LMS, AI-assisted support, and college-and-career readiness workflows
        - "Named classroom references plus Naviance reach of >8M students at 35% of U.S. high schools"
        - Expands wallet share beyond records management into daily instruction
        - Public sources do not quantify active users, frequency, or renewals by module
      - - District operations and partner-led extensions
        - Finance, HR, IT, operations teams / district operations budget
        - Finance, HR, analytics, payments, residency verification, and other integrations
        - Official district-operations and partner pages show multi-function coverage
        - Broadens buyer set and creates more expansion surfaces after SIS adoption
        - No public revenue concentration by partner, channel, or administrative product line
    notes: >-
      Mixes official and third-party disclosures across vintages; the table shows segment coverage,
      not segment revenue weights or retention by segment.
    claimRefs: [CU005, CU006, CU007, CU009, CU010, CU011]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Customers served
        - More than 16,000 customers
        - "2022 filing"
        - SEC annual report
        - Medium
        - Historical baseline for installed-base breadth before the take-private
        - No current public bridge from 2022 customers to 2026 organizations
      - - Large-district penetration
        - Over 90 of the 100 largest U.S. districts by student enrollment
        - "2022 filing"
        - SEC annual report
        - Medium
        - Shows enterprise-grade district penetration, not just long-tail accounts
        - No current refresh of the same top-100 penetration metric
      - - Statewide / province-wide contracts
        - More than 30 in North America
        - "2022 filing"
        - SEC annual report
        - Medium
        - Indicates capacity to win large umbrella deployments
        - No public disclosure of revenue share from these contracts
      - - Current platform reach
        - Over 60 million students in 90 countries
        - "2026 access"
        - PowerSchool homepage
        - Medium
        - Current scale claim still supports a very broad installed base
        - No public breakdown by region, product, or paid versus enabled users
      - - Current organization reach
        - More than 18,000 school organizations
        - "2026-07-08"
        - Security.org
        - Medium
        - Third-party corroboration that footprint remained broad after the breach
        - Derived from external reporting rather than audited customer ledger detail
      - - Special Programs districts supported
        - 1,200+ districts supported
        - "2026 access"
        - Special Programs page
        - Medium
        - Module adoption extends beyond the core SIS footprint
        - No disclosed share of total districts or attach by state
      - - Special Programs workflow activity
        - 417,297 forms completed in 2025
        - "2025 activity disclosed in 2026 access"
        - Special Programs page
        - Medium
        - Indicates active usage rather than logo inventory alone
        - Module-specific metric, not a company-wide engagement denominator
      - - College and career readiness reach
        - Over 8 million students at 35% of U.S. high schools
        - "2026 reporting"
        - Civic IQ
        - Medium
        - Shows scale in an adjacent workflow beyond the SIS core
        - No cohort, renewal, or monetization disclosure for this module
    notes: >-
      Dates mix historical SEC disclosure with 2026-accessed product and third-party reporting;
      denominators remain sparse, so the table is strongest on footprint and weaker on retention.
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU007, CU008, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Oxford Public Schools (MA)
        - District student-support administration
        - Special Programs compliance and reporting workflows
        - Production reference
        - PowerSchool says Oxford strengthened compliance confidence and reporting accuracy
        - Outcome is company-curated and not independently quantified
      - - McCall-Donnelly Joint School District 421
        - Special programs team
        - IEP and 504 data entry / tracking
        - Production reference
        - Named administrator says Special Programs is the easiest platform used in two decades
        - Testimonial quality is strong, but deployment scope is not disclosed
      - - Tomball ISD (TX)
        - District leadership
        - Broader PowerSchool ecosystem and student support narrative
        - Production reference
        - Homepage quote positions the platform as a tool that empowers students and educators
        - No quantified ROI, renewal term, or module list is disclosed
      - - Haddon Heights SD (NJ)
        - District operations
        - SIS, Ecollect, and Naviance contract activity
        - Active contract signal
        - Civic IQ lists a 2026 contract line item, showing post-breach buying continuity
        - Procurement activity does not prove realized outcomes or user satisfaction
    notes: >-
      Sample of named public references only; rows mix company-curated testimonials and
      procurement signals, so they prove live customer association better than they prove
      retention or measured ROI.
    enumerationScope:
      coverage: sample
      basis: Publicly named district references and procurement signals visible in the assigned customer evidence pool.
    claimRefs: [CU011, CU012, CU013, CU014]
figures:
  - id: FU001
    title: Customer journey from SIS anchor to suite expansion
    type: journey-map
    summary: >-
      Public evidence points to a customer path that starts with SIS record-keeping and expands
      into student support, instruction, district operations, partner integrations, and security-led
      renewal review.
    data:
      items:
        - label: SIS system-of-record entry
          stage: Initial adoption
          actors: District administrators, registrars, school IT
          touchpoints:
            - Enrollment, attendance, grades, and compliance workflows
            - Back-end records system embedded in district operations
          tone: neutral
        - label: Student-support attach
          stage: Workflow expansion
          actors: Special education leaders, case managers, families
          touchpoints:
            - IEP, 504, ELL, gifted, and service-capture workflows
            - Compliance and documentation activity inside Special Programs
          tone: positive
        - label: Teaching and learning expansion
          stage: Daily use growth
          actors: Teachers, students, counselors
          touchpoints:
            - Schoology and adjacent classroom tools
            - Naviance and other student-engagement surfaces
          tone: positive
        - label: Operations and HR expansion
          stage: Budget broadening
          actors: Finance, HR, district operations teams
          touchpoints:
            - Business operations, analytics, and talent workflows
            - SIS positioned as the heart of the broader ecosystem
          tone: opportunity
        - label: Partner-led extension
          stage: Ecosystem coverage
          actors: IT teams, integration partners
          touchpoints:
            - Residency, payments, wellness, and library extensions
            - Partner network used to widen use cases without replacing the core
          tone: neutral
        - label: Renewal and security review
          stage: Post-breach durability test
          actors: District leadership, boards, security stakeholders
          touchpoints:
            - Enhanced security provisions in renewals
            - Alternative-vendor evaluation and tighter oversight after the breach
          tone: risk
    claimRefs: [CU005, CU009, CU010, CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Large footprint still converts into cross-sell optionality
    body: >-
      The strongest customer evidence is not just the top-line footprint; it is the combination of
      SIS penetration, module-level activity in Special Programs, named role-diverse references, and
      continued district contract activity after the breach.
    claimRefs: [CU005, CU007, CU008, CU011, CU013]
  - calloutType: risk
    title: Breadth is public, but retention quality is not
    body: >-
      Public sources show continued adoption, yet they do not disclose GRR, NRR, churn, contract
      length, or customer concentration, so the market can observe scale without being able to prove
      the stickiness or concentration quality of the post-breach base.
    claimRefs: [CU014, CU015, CU016]
