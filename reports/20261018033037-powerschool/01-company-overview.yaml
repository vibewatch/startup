chapter:
  number: 1
  title: "Company Overview"
  summary: "PowerSchool presents itself as a private, Bain-owned K-12 operating system serving more than 15,000 organizations and over 60 million students through a broad software stack that reaches from SIS and learning to finance and talent. The retained evidence supports platform breadth, current scale language, and the seriousness of the December 2024 breach, but current executive attribution, post-LBO leverage, consolidated headcount, and enterprise pricing remain only partially visible in the assigned source set."
sections:
  - id: "identity-stage-and-platform"
    title: "Identity, stage, and platform footprint"
    body: |-
      The strongest official evidence frames PowerSchool as a private K-12 software platform rather than a point product. Its current About and product pages describe a connected operating system that joins student information, teaching and learning, student support, family engagement, HR, finance, analytics, and AI assistants, with current scale language of more than 15,000 organizations, over 60 million students worldwide, and penetration into over 80% of districts in North America. That makes the company relevant as both a mission system of record and a cross-sell platform inside district workflows.

      Public commercial visibility is still uneven. EdTech Impact offers a useful but narrow window into public pricing by listing teacher-tier PowerSchool Learning subscriptions at $4.95 to $30 per month while routing broader solution pricing back to sales. That supports the business-model description, but it does not answer district contract economics, bundle attach rates, or how much revenue comes from the non-SIS modules that PowerSchool now markets alongside the core platform.
    claimRefs: ["CO001", "CO002", "CO003", "CO008", "CO009", "CO010"]
    tableRefs: ["TO001"]
  - id: "ownership-leadership-and-stakeholders"
    title: "Ownership, leadership, and stakeholder dependencies"
    body: |-
      Tracxn's profile anchors the long-run company identity around a 1997 founding in Folsom by Greg Porter, John Stone, and Wong, and it also records $32 million of early venture funding before the company moved through multiple later ownership transitions. The current official FAQ confirms the endpoint that matters for today's diligence: PowerSchool is private again after Bain Capital's October 2024 acquisition. What the assigned pool does not reveal is the current debt package, sponsor economics, or a clean post-close board and committee map, which is a material omission for underwriting control, cash obligations, and refinancing risk.

      Leadership visibility is similarly incomplete. Tracxn still names Hardeep Gulati as CEO, while Civic IQ reports that Antonio Pietri took over effective October 2025 and that Gulati stayed on as a senior advisor. Because the official current company pages in this pool do not publish a full executive or board roster, the evidence supports a real leadership-transition question rather than a settled primary-source answer. Operational dependency remains broad: district customers, partner integrations, and back-office users all matter because PowerSchool positions finance, HR, and interoperability as part of the same platform relationship.
    claimRefs: ["CO003", "CO004", "CO005", "CO006", "CO007", "CO015"]
    tableRefs: ["TO002", "TO003"]
  - id: "milestones-commercialization-and-risk"
    title: "Milestones, commercialization, and current risk posture"
    body: |-
      The retained milestones point to a company that kept expanding product scope even before the Bain take-private. A January 2023 release introduced LearningNav, ContentNav, a new MTSS resource library, and role-specific software Clouds, reinforcing the strategy of selling a broader district workflow stack rather than a standalone SIS. The current budget, finance, and partner pages continue that same storyline by emphasizing integrated operations, single sign-on, and partner extensions that cover adjacent healthcare, residency, payments, and library workflows.

      The clearest negative event is the December 2024 breach. Security.org's reconstruction says attackers used subcontractor credentials and a PowerSource environment without mandatory MFA to exfiltrate data affecting roughly 62 million students and 9.5 million teachers, and it says the fallout extended into follow-on extortion, litigation, and privacy-regulator scrutiny during 2025. That does not disprove PowerSchool's current trust messaging, but it does mean the diligence case has to test whether product breadth and customer entrenchment are strong enough to offset security remediation costs, legal exposure, and reputational drag.
    claimRefs: ["CO011", "CO012", "CO013", "CO014", "CO015"]
    figureRefs: ["FO001"]
