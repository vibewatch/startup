  evidenceGaps:
    - type: missing-source
      severity: material
      topic: engineering-telemetry
      missingEvidence: Public or shared diligence evidence on uptime history, customer-visible SLAs, security certifications, and post-breach control remediation.
      whyItMatters: Without external telemetry or audited controls, investors cannot independently validate reliability or judge whether the current security posture is materially improved.
      diligencePath: Request current trust-center materials, status-history exports, certification reports, security architecture documentation, and customer SLA commitments.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: architecture-depth
      missingEvidence: Architecture diagrams or technical design documents showing API boundaries, data model integration, and support-tool access controls across the product suite.
      whyItMatters: Product breadth is visible, but the integration depth and operational coupling between modules drive implementation risk, breach blast radius, and upgrade complexity.
      diligencePath: Review product architecture diagrams, integration reference docs, identity model documentation, and customer implementation materials under NDA.
      relatedQuestionRefs: [QE002, QE007]
