chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and platform footprint
        blocks:
          - type: paragraph
            body: >-
              The strongest official evidence frames PowerSchool as a private K-12 software platform rather than a point
              product. Its current About and product pages describe a connected operating system that joins student
              information, teaching and learning, student support, family engagement, HR, finance, analytics, and AI
              assistants, with current scale language of more than 15,000 organizations, over 60 million students
              worldwide, and penetration into over 80% of districts in North America. That makes the company relevant as
              both a mission system of record and a cross-sell platform inside district workflows.


              Public commercial visibility is still uneven. EdTech Impact offers a useful but narrow window into public
              pricing by listing teacher-tier PowerSchool Learning subscriptions at $4.95 to $30 per month while routing
              broader solution pricing back to sales. That supports the business-model description, but it does not
              answer district contract economics, bundle attach rates, or how much revenue comes from the non-SIS
              modules that PowerSchool now markets alongside the core platform.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
              - CO009
              - CO013
      - number: '1.2'
        title: Ownership, leadership, and stakeholder dependencies
        blocks:
          - type: paragraph
            body: >-
              Tracxn's profile anchors the long-run company identity around a 1997 founding in Folsom by Greg Porter,
              John Stone, and Wong, and it also records $32 million of early venture funding before the company moved
              through multiple later ownership transitions. The current official FAQ confirms the endpoint that matters
              for today's diligence: PowerSchool is private again after Bain Capital's October 2024 acquisition. What
              the assigned pool does not reveal is the current debt package, sponsor economics, or a clean post-close
              board and committee map, which is a material omission for underwriting control, cash obligations, and
              refinancing risk.


              Leadership visibility is similarly incomplete. Tracxn still names Hardeep Gulati as CEO, while Civic IQ
              reports that Antonio Pietri took over effective October 2025 and that Gulati stayed on as a senior
              advisor. Because the official current company pages in this pool do not publish a full executive or board
              roster, the evidence supports a real leadership-transition question rather than a settled primary-source
              answer. Operational dependency remains broad: district customers, partner integrations, and back-office
              users all matter because PowerSchool positions finance, HR, and interoperability as part of the same
              platform relationship.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO006
              - CO007
          - type: table
            tableRef: TO003
            claimRefs:
              - CO002
              - CO003
              - CO013
              - CO014
              - CO015
      - number: '1.3'
        title: Milestones, commercialization, and current risk posture
        blocks:
          - type: paragraph
            body: >-
              The retained milestones point to a company that kept expanding product scope even before the Bain
              take-private. A January 2023 release introduced LearningNav, ContentNav, a new MTSS resource library, and
              role-specific software Clouds, reinforcing the strategy of selling a broader district workflow stack
              rather than a standalone SIS. The current budget, finance, and partner pages continue that same storyline
              by emphasizing integrated operations, single sign-on, and partner extensions that cover adjacent
              healthcare, residency, payments, and library workflows.


              The clearest negative event is the December 2024 breach. Security.org's reconstruction says attackers used
              subcontractor credentials and a PowerSource environment without mandatory MFA to exfiltrate data affecting
              roughly 62 million students and 9.5 million teachers, and it says the fallout extended into follow-on
              extortion, litigation, and privacy-regulator scrutiny during 2025. That does not disprove PowerSchool's
              current trust messaging, but it does mean the diligence case has to test whether product breadth and
              customer entrenchment are strong enough to offset security remediation costs, legal exposure, and
              reputational drag.
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO003
              - CO004
              - CO005
              - CO007
              - CO011
              - CO013
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary is broader than a stand-alone student information system. PowerSchool's
              public surfaces consistently position the platform as a connected K-12 operating layer spanning SIS,
              analytics, communications, finance/HR, and partner-led extensions rather than only records management.
              That means included spend covers core SIS, data/analytics, district operations, and adjacent workflow
              modules that influence retention and expansion. Excluded spend should include generic enterprise software
              and category-adjacent tools that districts can buy without adopting PowerSchool's core data model. The
              status quo substitute is not just another SIS vendor; it is also fragmented point solutions, manual
              reporting, and district-specific integrations that keep data in disconnected systems.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
      - number: '2.2'
        title: Sizing lenses and observable scale
        blocks:
          - type: paragraph
            body: >-
              Public sizing evidence is directionally useful but methodologically mixed. The clearest third-party lens
              is installed-base share: Civic IQ cites ListEdTech's November 2025 dataset of more than 23,000 districts
              and places PowerSchool at roughly 23% of identified SIS implementations, ahead of Infinite Campus at
              around 10% and Skyward at 7%. Contract data adds a second lens by showing PowerSchool's lower base SIS
              price point but meaningful renewal and module upsell economics. Company-reported scale adds a third lens
              through customer, student, and analytics-workflow metrics. None of those lenses cleanly converts into
              TAM/SAM/SOM, so the correct diligence posture is to preserve the observable signals and note that public
              market sizing remains denominator-sensitive.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM013
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM013
      - number: '2.3'
        title: Demand drivers and budget ownership
        blocks:
          - type: paragraph
            body: >-
              The demand case is strongest where districts want a single operating model for data, interventions,
              communication, and administrative coordination. PowerSchool's own product and survey material points to
              AI-enabled teaching support, whole-child analytics, integrated communication, and real-time dashboards as
              current buying priorities. Budget ownership therefore likely spans more than one line item: district
              leadership, IT/data teams, curriculum or student services, and business-operations stakeholders can all
              influence the purchase because the workflow crosses central office, classroom, and home. That multi-
              stakeholder buying path helps explain why integrated suites can expand inside a district even when the
              initial SIS contract appears modest.
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Constraints, switching behavior, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              Switching costs are real, but they do not eliminate market risk. Third-party sources still describe low
              barriers to entry, budget sensitivity, and rising security requirements as structural constraints on
              growth, while the North Carolina migration after the December 2024 breach shows trust failures can
              override incumbent stickiness. The biggest diligence gap is that public evidence does not isolate a clean
              serviceable market for PowerSchool's current product bundle: accessible sources mix broad industry value,
              district implementation share, customer counts, and product-usage metrics without a shared denominator.
              That limits valuation work because it is still unclear how much of the adjacent K-12 software stack
              PowerSchool can monetise directly versus through partner ecosystems and modular upsell.
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sticky market, but not cleanly sizeable from public data
            body: >-
              The strongest public lens is installed-base share and district contract pricing, not a bottom-up
              serviceable market model. That makes PowerSchool's market look durable, but still hard to value without
              management-only module mix, attach-rate, and win-rate data.
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
          - type: callout
            title: Trust is part of the market boundary
            body: >-
              The North Carolina migration after the 2024 breach shows that security and trust are not side constraints;
              they can directly reshape competitive share even in a category with high switching costs.
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct peers
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence points to a layered competitive set rather than one clean one-to-one substitute.
              Independent comparison pages repeatedly return Aeries, Infinite Campus, Tyler SIS, and Skyward when buyers
              evaluate replacing PowerSchool SIS, while Veracross, FACTS SIS, and TeacherEase appear more often as
              school-first or independent-school alternatives than as district-scale peers. That pattern matters because
              it suggests PowerSchool is defended less by having no alternatives and more by selling into broad district
              workflows where the replacement set narrows to a handful of operationally comparable SIS vendors.


              PowerSchool also starts from a larger incumbent footprint than most rivals. Civic IQ describes it as still
              powering roughly three-quarters of the K-12 SIS market in 2026 despite post-breach scrutiny, and official
              pages continue to position the company as a connected operating system rather than a single SIS module. In
              practice, districts looking for a full districtwide replacement should screen Infinite Campus, Tyler SIS,
              Aeries, and Skyward first, while districts with narrower independent-school or classroom-workflow needs
              can widen the shortlist to school-first tools.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP010
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
