      - number: '3.2'
        title: Buying criteria and package tradeoffs
        blocks:
          - type: paragraph
            body: >-
              PowerSchool's own current materials argue that districts are evaluating vendors on reliability,
              integrations, governance, privacy, and multilingual family engagement rather than on point features alone.
              That framing is consistent with the company's broader positioning: the budget/finance page puts SIS at the
              center of a larger district operating stack, and the communication buyer guide emphasizes connected
              workflows across departments. The competitive implication is that PowerSchool is strongest when the
              district wants to consolidate multiple workflows into one platform rather than optimize a single SIS
              feature in isolation.


              The main public weakness in this comparison set is pricing transparency. The reviewed PowerSchool pages
              route buyers toward a sales conversation, while SoftwareSuggest pages surface repeated "Get Pricing"
              prompts and blank starting-price fields instead of comparable contract terms. That makes public web
              evidence useful for shortlist construction and capability screening, but weak for underwriting whether a
              challenger wins on total cost, discounting, or module-by-module packaging. Procurement references and
              actual district quotes remain necessary.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP012
      - number: '3.3'
        title: Durability, switching friction, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              PowerSchool's moat is real but not unqualified. Official materials emphasize ecosystem breadth,
              integrations, and partner-led workflow extension, which raises the cost of ripping out the platform if a
              district already uses multiple modules or relies on partner-connected processes. That breadth supports
              cross-sell and renewal resilience, and Civic IQ still reports ongoing contract activity in 2025-2026. The
              company is therefore competing more as a deeply embedded suite incumbent than as a best-of-breed point
              product.


              The clearest displacement risk in the assigned evidence is trust. Security.org's breach review makes the
              2024-2025 incident concrete, including the scale of exposed records and the role of missing MFA, while G2
              comparison excerpts show that some alternatives are perceived as easier to do business with or better at
              support. That combination does not prove immediate share loss, but it does create a credible attack path
              for rivals: win districts that are already frustrated with service or security governance rather than
              outflanking PowerSchool purely on breadth.
            claimRefs:
              - CP002
              - CP005
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: PowerSchool still competes as the suite incumbent
            body: >-
              The strongest evidence advantage is breadth plus installed base: official materials position PowerSchool
              as a connected K-12 platform, and Civic IQ still describes the company as the dominant SIS incumbent in
              2026.
            calloutType: strength
            claimRefs:
              - CP001
              - CP010
          - type: callout
            title: Trust is the most credible opening for challengers
            body: >-
              Support perception on G2 and the continuing aftereffects of the 2024-2025 breach create a more plausible
              challenger wedge than pure feature breadth does.
            calloutType: risk
            claimRefs:
              - CP005
              - CP009
              - CP011
          - type: callout
            title: Public pricing is too opaque for a clean winner
            body: >-
              The assigned web evidence is strong enough to rank workflow fit, but not strong enough to underwrite which
              vendor is structurally cheaper once district-level bundling and discounting are considered.
            calloutType: insight
            claimRefs:
              - CP008
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization surface
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a broad subscription-style product surface rather than a single-product
              business. PowerSchool's official pages position the company as an integrated K-12 platform that links
              student information, learning, special programs, finance, HR, analytics, and partner extensions. That
              matters financially because it creates multiple attach points inside the same district account and
              supports cross-sell logic across operational and instructional budgets. What the public evidence does not
              provide is a clean revenue mix by product cloud, so the right reading is "diversified surface, opaque mix"
              rather than a quantified recurring-revenue stack or a disclosed product-level gross profit bridge. The
              cited partner directory also does not disclose revenue-share terms.
            claimRefs:
