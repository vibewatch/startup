  - id: FE001
    title: PowerSchool public product architecture map
    type: stack
    summary: >-
      Public materials depict PowerSchool as a layered K-12 operating system with SIS at the core, adjacent workflow
      modules above it, and a partner/support layer around it.
    data:
      layers:
        - label: User workflow surfaces
          detail: Distinct public help surfaces exist for administrator, teacher, student, and parent roles.
          modules:
            - PowerSchool SIS - Administrator
            - PowerSchool SIS Teacher
            - PowerSchool SIS - Student and Parent
        - label: Core student operations
          detail: >-
            Student Information Cloud bundles student information, enrollment, and core operational records into a
            connected cloud suite.
          modules:
            - PowerSchool SIS
            - Student Information Management
            - Online Enrollment Management
        - label: Data, forms, and analytics services
          detail: The cloud suite adds data submission, document, and analytics capabilities around the student record.
          modules:
            - Year-Round Data Submission
            - Document Distribution and Storage
            - Data Analytics
        - label: Central-office extensions
          detail: Finance and HR offerings expand the suite beyond classroom and SIS workflows.
          modules:
            - Unified Operations
            - Unified Talent
            - Business Analytics
            - eFinancePlus
        - label: Integration ecosystem
          detail: Partner applications extend the platform into operational edge cases and specialized education workflows.
          outputs:
            - Residency and identity verification
            - Health and wellbeing tools
            - Payments and billing
            - Library and asset management
        - label: Support and control plane
          detail: >-
            Versioned documentation, Customer Central, and the PowerSource support path support operations but also
            represent a concentrated control point.
          modules:
            - PowerSchool SIS Administrator Help
            - Customer Central
            - PowerSource support portal
    approximationNotes: >-
      This stack is a public-surface operating model, not a reverse-engineered infrastructure diagram; internal service
      boundaries, APIs, and hosting topology remain undisclosed.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE010
  - id: FU001
    title: Customer journey from SIS anchor to suite expansion
    type: journey-map
    summary: >-
      Public evidence points to a customer path that starts with SIS record-keeping and expands into student support,
      instruction, district operations, partner integrations, and security-led renewal review.
    data:
      items:
        - label: SIS system-of-record entry
          stage: Initial adoption
          actors: District administrators, registrars, school IT
          touchpoints:
            - Enrollment, attendance, grades, and compliance workflows
            - Back-end records system embedded in district operations
          tone: neutral
        - label: Student-support attach
          stage: Workflow expansion
          actors: Special education leaders, case managers, families
          touchpoints:
            - IEP, 504, ELL, gifted, and service-capture workflows
            - Compliance and documentation activity inside Special Programs
          tone: positive
        - label: Teaching and learning expansion
          stage: Daily use growth
          actors: Teachers, students, counselors
          touchpoints:
            - Schoology and adjacent classroom tools
            - Naviance and other student-engagement surfaces
          tone: positive
        - label: Operations and HR expansion
          stage: Budget broadening
          actors: Finance, HR, district operations teams
          touchpoints:
            - Business operations, analytics, and talent workflows
            - SIS positioned as the heart of the broader ecosystem
          tone: opportunity
        - label: Partner-led extension
          stage: Ecosystem coverage
          actors: IT teams, integration partners
          touchpoints:
            - Residency, payments, wellness, and library extensions
            - Partner network used to widen use cases without replacing the core
          tone: neutral
        - label: Renewal and security review
          stage: Post-breach durability test
          actors: District leadership, boards, security stakeholders
          touchpoints:
            - Enhanced security provisions in renewals
            - Alternative-vendor evaluation and tighter oversight after the breach
          tone: risk
    claimRefs:
      - CU005
      - CU009
      - CU010
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      The highest residual risk sits in student-data governance and AI compliance, while operational friction and
      ecosystem dependency remain medium-high because PowerSchool's platform is positioned as district-critical
      infrastructure.
    data:
      columns:
        - label: Likelihood
          detail: Probability the issue surfaces in the next 12 to 18 months.
        - label: Impact
          detail: Potential effect on district operations, contracts, or underwriting.
        - label: Mitigation maturity
          detail: How concrete the public mitigation evidence looks today.
        - label: Residual exposure
          detail: Net risk after considering the disclosed mitigations.
        - label: Detection speed
          detail: How quickly management should know the problem is occurring.
        - label: Evidence strength
          detail: How strong the public evidence is relative to a full diligence data room.
      rows:
        - label: Student-data privacy and AI compliance
          note: >-
            Processor obligations, customer-owned data, and district-specific contracting make compliance failure
            expensive.
          values:
            - label: High
            - label: High
            - label: Moderate
            - label: High
            - label: Medium
            - label: Moderate
        - label: Operational reliability and implementation drag
          note: >-
            Review evidence shows setup, maintenance, support, and data-quality friction despite official reliability
            messaging.
          values:
            - label: Medium-High
            - label: High
            - label: Moderate
            - label: Medium-High
            - label: Medium
            - label: Moderate
        - label: Partner and platform dependency
          note: Interoperability is a selling point, but concentration and failover details are not public.
          values:
            - label: Medium
            - label: Medium-High
            - label: Moderate
            - label: Medium
            - label: Low-Medium
            - label: Moderate
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR006
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Public evidence still supports a durable platform, but the breach and post-LBO opacity block an immediate buy
      call.
    data:
      nodes:
        - id: scale
          label: 'Scale proof: >60M students and 90 countries'
          note: Installed-base evidence still points to category leadership.
        - id: breadth
          label: 'Platform breadth: SIS plus finance HR and partner ecosystem'
          note: Multiple workflows can deepen attachment beyond the core record system.
        - id: economics
          label: 'Historical economics: $701.5M ARR and 22.2% EBITDA margin in 2023'
          note: Public evidence shows a mature profitable vertical-software profile.
        - id: entry
          label: 'Entry anchor: Bain paid $5.6B in 2024'
          note: The last visible control price already embeds material quality.
        - id: overhang
          label: 'Downside overhang: 62M student records 9.5M teacher records and tighter contract language'
          note: Breach fallout and opacity widen downside more than upside.
        - id: output
          label: 'Output: research-more expensive high-risk'
          note: Wait for liability leverage and renewal-quality diligence before underwriting upside.
      edges:
        - from: scale
          to: breadth
        - from: breadth
          to: economics
        - from: economics
          to: entry
        - from: entry
          to: overhang
        - from: overhang
          to: output
    approximationNotes: Flow sequence is an analytic synthesis of cited evidence rather than a process disclosed by the company.
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
