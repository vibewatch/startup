      - number: '4.2'
        title: Public traction signals and unit-economics limits
        blocks:
          - type: paragraph
            body: >-
              The public signals are stronger on installed-base scale than on operating efficiency. Bain's 2024
              announcement cited more than 55 million students and more than 17,000 customers, while the current
              homepage markets the platform to over 60 million students in 90 countries. Civic IQ also points to
              contract renewals continuing through 2025 despite breach fallout, with example deal values across multiple
              modules. Those signals support durability and breadth, but they do not reveal current ARR, gross margin,
              CAC, payback, or cash conversion. The most important financial conclusion from this evidence set is
              therefore that scale is visible, while efficiency is not.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI014
              - CI016
