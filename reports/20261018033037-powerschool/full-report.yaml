      - number: '6.3'
        title: Durability, procurement friction, and concentration limits
        blocks:
          - type: paragraph
            body: >-
              Durability looks better in footprint and renewal signals than it does in disclosed retention metrics.
              Civic IQ says districts kept renewing despite the breach, but also says buyers are adding enhanced
              security provisions, evaluating alternatives, and tightening cybersecurity oversight, which implies extra
              friction in future renewals and expansions. Security.org's reporting makes the trust issue concrete: the
              2024 incident exposed data for approximately 62 million students and 9.5 million teachers, and extortion
              attempts later reached individual districts. What remains missing is the quantitative quality of the base:
              the assigned source pool does not disclose GRR, NRR, churn, average contract term, top-customer
              concentration, or channel concentration, so public evidence still cannot separate a very sticky installed
              base from a broad but more contested renewal book.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Large footprint still converts into cross-sell optionality
            body: >-
              The strongest customer evidence is not just the top-line footprint; it is the combination of SIS
              penetration, module-level activity in Special Programs, named role-diverse references, and continued
              district contract activity after the breach.
            calloutType: strength
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU011
              - CU013
          - type: callout
            title: Breadth is public, but retention quality is not
            body: >-
              Public sources show continued adoption, yet they do not disclose GRR, NRR, churn, contract length, or
              customer concentration, so the market can observe scale without being able to prove the stickiness or
              concentration quality of the post-breach base.
            calloutType: risk
            claimRefs:
              - CU014
              - CU015
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Risk posture: regulated infrastructure with meaningful execution drag'
        blocks:
          - type: paragraph
            body: >-
              PowerSchool is carrying infrastructure-like obligations without infrastructure-grade public disclosure.
              Its own privacy statement says the company processes student education records as a data processor for
              school and district customers, may rely on third-party cloud providers across jurisdictions, and treats
              incident monitoring as a core control surface. That puts privacy, subprocessor governance, uptime, and
              contractual compliance at the center of the thesis rather than at the edge. The public mitigation story is
              real - dedicated security resources, annual SOC 2 audits, ISO 27001:2013 certification, protected cloud,
              and single sign-on - but public user evidence still points to nontrivial reliability and maintenance
              friction. Because PowerSchool also presents itself as a connected operating system used across SIS,
              finance, HR, learning, and partner integrations, failure in one control plane can spill into multiple
              district workflows.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR006
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR006
              - CR012
              - CR013
              - CR015
      - number: '7.2'
        title: Student-data governance and AI compliance are the highest-severity legal risks
        blocks:
          - type: paragraph
            body: >-
              The regulatory and legal burden is high because PowerSchool's own materials describe a business that
              handles customer-controlled student records, uses subprocessors and cloud infrastructure, and deploys AI
              features only within district agreements and state-specific privacy rules. That does not prove a present
              enforcement action, but it does mean every product change can create contract, privacy, and procurement
              exposure at district scale. The key underwriting issue is not whether the company has policies; it does.
              The issue is whether those policies are sufficient when districts, parents, and state regimes demand
              localized handling of student data, opt-in boundaries for identified data, and tighter controls around
              AI-assisted workflows. Public evidence in this pool does not quantify current breach-related reserve,
              settlement, or regulator-remedy exposure, so residual legal downside still needs direct diligence.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
      - number: '7.3'
        title: Operational risk is elevated because districts depend on the platform for daily workflows
        blocks:
          - type: paragraph
            body: >-
              PowerSchool's own product and solutions pages frame the platform as always-on infrastructure for district
              operations, finance, reporting, family access, and compliance. That positioning magnifies ordinary
              software weaknesses: configuration burden, weak support, or data-quality defects can quickly become
              district-level operating problems. The independent review signal is mixed rather than broken.
              SoftwareReviews shows solid recommend and renewal intent, but lower cost/value and support scores plus at
              least one validated complaint about unreliable data. Gartner Peer Insights is also middling at 3.7 out of
              5 from 15 ratings, with a highlighted complaint that setup and maintenance are difficult. The result is a
              credible but not fully de-risked operating profile: controls exist, yet the public customer voice still
              implies nontrivial service and implementation drag.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Partner breadth is a growth asset but also a dependency surface
        blocks:
          - type: paragraph
            body: >-
              PowerSchool highlights an extensive partner ecosystem and repeatedly markets interoperability as a
              feature, while its 2023 product release tied AI-driven recommendations to curated content and external
              organizations. That matters because the more the value proposition depends on external content, integrated
              applications, cloud platforms, and implementation partners, the harder it is to isolate failure causes or
              preserve service quality when one node underperforms. The public materials do not disclose concentration
              by partner, subprocessor, or workflow, so investors cannot yet size which external dependency matters
              most. That leaves partner concentration, integration breakage, and vendor-management discipline as
              diligence items rather than closed risks.
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR007
              - CR008
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Top risk: compliance failure in a student-data-heavy operating model'
            body: >-
              PowerSchool's own disclosures show a business that processes customer-controlled student records, uses
              subprocessors, and deploys AI features inside district-specific privacy and procurement boundaries. That
              makes privacy, contract, and governance drift a thesis-level risk even without a publicly quantified 2026
              enforcement event in this pool.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Independent user sentiment is not broken, but it is not clean enough to ignore
            body: >-
              Recommend and renewal intent are solid, yet public reviews still flag setup difficulty, middling support,
              and unreliable data. For software positioned as district operating infrastructure, that is enough to keep
              residual execution risk elevated.
            calloutType: risk
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: callout
            title: Interoperability increases both moat and blast radius
            body: >-
              PowerSchool's platform breadth and partner network help it sell a connected operating system, but they
              also make outages, partner failures, and implementation defects more likely to propagate across multiple
              customer workflows.
            calloutType: insight
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              PowerSchool still has real scale: company materials say it serves over 60 million students in 90
              countries, and independent coverage still describes its student information system as category-leading.
              The current question is not whether there is a business, but whether new capital can underwrite it
              attractively after Bain Capital paid $5.6 billion to take the company private. Civic IQ still sees
              districts renewing contracts through 2025 and into 2026, but Security.org's breach chronology and the
              tougher security language now showing up in contracts mean the installed base is durable yet more
              encumbered. That mix supports a research-more recommendation rather than an avoid, but it does not support
              paying above the last known control price on today's public evidence.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV008
              - CV010
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.2'
        title: Thesis, anti-thesis, and the entry anchor
        blocks:
          - type: paragraph
            body: >-
              The positive case rests on three proof points: installed-base scale, expanding platform breadth, and
              historical economics. PowerSchool markets an integrated stack spanning student information, finance and HR
              workflows, and partner-connected extensions, which matters because deeper workflow attachment is the
              clearest route to defend renewals and eventual exit value. Public analysis from Overlooked still gives the
              best disclosed economics snapshot in this pool: $701.5 million of ARR in 2023, 17.7% year-over-year
              growth, and a 22.2% EBITDA margin. But the current entry anchor is the 2024 Bain control transaction, not
              the older public-market quote, so the thesis has to clear a higher burden of proof than simple product
              quality or category leadership.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario framing and valuation range
        blocks:
          - type: paragraph
            body: >-
              Scenario framing has to stay broad because the available evidence is stale on capital structure and
              incomplete on ultimate breach liability. Even so, the public record gives enough to structure cases around
              the 2024 control transaction without inventing a current valuation range. The bull case requires proof
              that breach fallout is contained, that cross-sell into finance, HR, and adjacent modules still works, and
              that leverage and liability burdens are manageable. The base case assumes the business can defend renewals
              but has not yet earned a premium to Bain's price. The bear case is driven by churn, regulatory/legal
              escalation, or a tighter debt stack than outside investors can currently see.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The remaining diligence burden is specific. Investors need current audited financials, post-LBO debt and
              covenant detail, quantified litigation and regulatory exposure from the breach, and cohort evidence that
              2025 and 2026 renewals are holding without punitive pricing or concession creep. Without that package, a
              buyer is anchoring to a 2024 transaction while underwriting 2026 risk. Exit readiness is therefore
              conditional rather than absent: the platform still looks strategic because of scale and breadth, but the
              next attractive entry probably requires either a lower price or clear evidence that the breach did not
              structurally impair retention, margins, or financing flexibility.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV008
              - CV009
              - CV013
