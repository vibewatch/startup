  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The retained timeline shows early venture roots, 2023 product expansion, the 2024 Bain take-private, and the
      2024-2025 breach and leadership reset.
    data:
      items:
        - date: '1997'
          label: Founded in Folsom
          detail: Tracxn says PowerSchool was founded in 1997 in Folsom, California by Greg Porter, John Stone, and Wong.
          tone: positive
        - date: 1999-10
          label: Series A financing
          detail: Tracxn lists an October 1999 Series A round as part of the company's $32 million historical venture funding.
          tone: neutral
        - date: '2000-04-06'
          label: Series B financing
          detail: Tracxn lists a Series B round on April 6, 2000.
          tone: neutral
        - date: '2023-01-30'
          label: LearningNav and ContentNav announced
          detail: >-
            PowerSchool announced LearningNav, ContentNav, an MTSS resource library, and six role-specific software
            Clouds.
          tone: positive
        - date: 2024-10
          label: Bain take-private closes
          detail: The current official FAQ says PowerSchool is a private company acquired by Bain Capital in October 2024.
          tone: positive
        - date: 2024-12
          label: PowerSource breach disclosed
          detail: >-
            Security.org says PowerSchool learned of the breach on December 28, 2024 after an extortion demand following
            data exfiltration from the support portal.
          tone: risk
        - date: 2025-05
          label: Criminal case and downstream extortion
          detail: >-
            Security.org says the alleged attacker pleaded guilty in May 2025 and that districts later received
            follow-on extortion demands using the same stolen data.
          tone: risk
        - date: 2025-10
          label: Reported CEO transition
          detail: >-
            Civic IQ says Antonio Pietri became CEO effective October 2025 while Hardeep Gulati remained as a senior
            advisor.
          tone: neutral
        - date: 2026-10
          label: Current official scale snapshot
          detail: >-
            PowerSchool's current About page says the company serves more than 15,000 organizations and over 60 million
            students worldwide.
          tone: neutral
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO005
      - CO007
      - CO011
      - CO013
      - CO014
