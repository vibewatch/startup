              - CI009
              - CI014
              - CI016
      - number: '4.3'
        title: Capital adequacy, breach overhang, and verdict
        blocks:
          - type: paragraph
            body: >-
              Bain's acquisition price and lender list show that capital structure matters, but the assigned public
              evidence stops short of disclosing the actual debt quantum, pricing, covenants, amortization, or cash on
              hand after the take-private. Combined with continuing breach litigation and incomplete public disclosure
              after 2023, that leaves PowerSchool's margin path and liquidity cushion outside what a public-market style
              diligence pass can underwrite. The financial verdict is not that the company lacks revenue quality; it is
              that the quality is partly evidenced by renewals and product breadth, while the capital-intensity and
              leverage questions remain management-only diligence items.
            claimRefs:
              - CI004
              - CI005
              - CI008
              - CI009
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Underwriting blocker: post-take-private opacity'
            body: >-
              The public evidence names the acquisition valuation and lender roster, but not the debt amount, pricing,
              covenants, cash balance, or current margin profile. That is the primary reason the chapter stops short of
              an underwritten capital- adequacy view.
            calloutType: risk
            claimRefs:
              - CI004
              - CI005
              - CI008
              - CI014
          - type: callout
            title: Revenue quality looks broader than it looks transparent
            body: >-
              Product breadth, partner extensions, and post-breach renewals all point to a sticky district platform, but
              public contract examples are still only spot checks and not a substitute for realized pricing or retention
              data.
            calloutType: insight
            claimRefs:
