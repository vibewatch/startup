      - number: '6.2'
        title: Adoption proof and expansion vectors
        blocks:
          - type: paragraph
            body: >-
              Evidence of real use is strongest where PowerSchool names live district references and module-level
              activity rather than relying on unlabeled logos. Special Programs reports 9.5 million students supported,
              1,200-plus districts supported, 417,297 forms completed in 2025, and four statewide partnerships, which is
              useful because it shows activity inside a product other than the core SIS. The homepage adds named
              references spanning superintendent, classroom, special education, analytics, and technology roles, while
              Civic IQ reports that districts continued signing and renewing PowerSchool contracts through 2025 and into
              2026. Together, that points to a credible land-and-expand motion from a system-of-record anchor into
              adjacent instructional, student-support, and district-operations budgets.
            claimRefs:
              - CU005
              - CU007
