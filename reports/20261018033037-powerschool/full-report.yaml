  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product breadth centers on a connected K-12 operating system
        blocks:
          - type: paragraph
            body: |-
              Public materials consistently frame PowerSchool as a platform company whose
              core job is to sit at the center of district operations, not just to sell a
              single student-record database. The strongest official articulation is the
              Student Information Cloud page, which describes a "complete cloud-hosted
              solution for student information, enrollment, data management, and
              analytics" for smaller schools and districts. The homepage broadens that
              framing by calling PowerSchool "the world's most comprehensive K-12
              software" and by positioning the suite as a connected operating system for
              administrators, educators, families, and students.

              The public help and product surfaces reinforce that this is a multi-module
              suite. PowerSchool exposes distinct help/documentation entry points for SIS
              administrator, teacher, student and parent workflows, enrollment, single
              sign-on, Naviance, and Allovue. The finance and HR solution page also shows
              that SIS is only one layer inside a wider central-office stack that includes
              Unified Operations, Unified Talent, Business Analytics, and eFinancePlus.
              Taken together, the public surface supports a real product-line map with
              operational breadth; it does not, however, disclose module-level adoption,
              attach rates, or architecture boundaries between the acquired components.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE004
              - CE005
              - CE006
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE010
      - number: '5.2'
        title: Operating model emphasizes interoperability, cloud hosting, and support depth
        blocks:
          - type: paragraph
            body: |-
              The public product story is organized around interoperability and cloud
              operations rather than around a deeply disclosed technical stack. The
              Student Information Cloud page says the platform gives centralized access to
              tools, combines multiple software products and features, and offers cloud
              hosting, enrollment management, document workflows, and analytics. The
              budget-and-finance page separately places PowerSchool SIS "at the heart of
              your edtech ecosystem" and ties that positioning to data integration, secure
              single sign-on, and remote access. The partner directory extends the same
              model outward by presenting PowerSchool as an integration hub that can be
              extended with third-party applications across student, wellness, payments,
              library, and identity-adjacent workflows.

              Maturity is easier to verify than architecture. The public documentation
              surface includes versioned SIS help, release-note references, training
              videos, Customer Central support, and recurring customer-community town
              halls. That is credible evidence that the installed base is large and that
              PowerSchool runs a structured support and change-management apparatus.
              Still, the assigned source pool does not disclose customer-visible uptime,
              incident metrics, API usage, hosting topology, or module-by-module roadmap
              governance, so investors can underwrite process breadth and support habits
              more confidently than low-level technical implementation.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE007
              - CE008
              - CE010
              - CE011
      - number: '5.3'
        title: Trust and security remain the most material public technology risk
        blocks:
          - type: paragraph
            body: |-
              The same platform centralization that gives PowerSchool operating leverage
              also creates concentrated trust risk. Independent 2026 breach coverage says
              attackers used contractor credentials to access the PowerSource support
              portal, which in turn gave reach into district SIS environments. Security.org
              says PowerSource did not require multi-factor authentication at the time and
              describes the compromise as a breach of student and staff data at enormous
              scale. The Learning Standard adds that the aftermath now includes
              multidistrict litigation and renewed scrutiny of access control, encryption,
              and plain-language data-governance practices.

              That does not prove the entire PowerSchool stack is technically weak, but it
              does mean public diligence should treat security posture as an open
              underwriting issue instead of a settled strength. The official pages
              repeatedly market security, interoperability, and cloud reliability, yet the
              assigned evidence set does not include independently verified uptime
              telemetry, current certification scope, detailed breach-remediation
              architecture, or a public practitioner/developer signal that would let an
              outsider judge product quality below the marketing layer. Product breadth is
              real; confidence in control effectiveness is still limited.
            claimRefs:
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Footprint and segment breadth
        blocks:
          - type: paragraph
            body: >-
              The installed base remains large enough that customer breadth is still a core part of the thesis.
              PowerSchool's current homepage says the platform serves over 60 million students in 90 countries, while a
              third-party 2026 breach explainer describes the SIS as used by more than 18,000 school organizations. The
              historical public-company record is directionally consistent: the 2022 annual report said PowerSchool
              served more than 16,000 customers, reached over 90 of the 100 largest U.S. districts by enrollment, and
              held more than 30 statewide, province-wide, or territory-wide contracts in North America. The buyer map is
              also broader than a single principal or curriculum owner because the product set spans SIS, student
              support, classroom workflows, district analytics, finance, HR, and partner-led extensions.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
