company:
  name: "PowerSchool"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Public evidence supports treating PowerSchool as a broad K-12 operating-system
    vendor rather than a point SIS tool: Civic IQ/ListEdTech attributes roughly
    23% of identified SIS implementations to PowerSchool, while company materials
    extend the spend pool into analytics, communications, finance/HR, and partner
    integrations. Demand signals around unified data, AI-assisted workflows, and
    school-home communication are strong, but public sources still do not isolate
    a clean SAM/SOM because they mix incompatible denominators such as students,
    customers, districts, implementations, and paid-report previews.
sections:
  - id: "market-boundary-and-substitutes"
    title: "Market boundary and status-quo substitutes"
    body: >-
      The relevant market boundary is broader than a stand-alone student information
      system. PowerSchool's public surfaces consistently position the platform as a
      connected K-12 operating layer spanning SIS, analytics, communications,
      finance/HR, and partner-led extensions rather than only records management.
      That means included spend covers core SIS, data/analytics, district operations,
      and adjacent workflow modules that influence retention and expansion. Excluded
      spend should include generic enterprise software and category-adjacent tools
      that districts can buy without adopting PowerSchool's core data model. The
      status quo substitute is not just another SIS vendor; it is also fragmented
      point solutions, manual reporting, and district-specific integrations that keep
      data in disconnected systems.
    claimRefs: ["CM001", "CM002", "CM008", "CM016"]
    tableRefs: ["TM001", "TM003"]
  - id: "sizing-lenses-and-observable-scale"
    title: "Sizing lenses and observable scale"
    body: >-
      Public sizing evidence is directionally useful but methodologically mixed.
      The clearest third-party lens is installed-base share: Civic IQ cites
      ListEdTech's November 2025 dataset of more than 23,000 districts and places
      PowerSchool at roughly 23% of identified SIS implementations, ahead of
      Infinite Campus at around 10% and Skyward at 7%. Contract data adds a second
      lens by showing PowerSchool's lower base SIS price point but meaningful
      renewal and module upsell economics. Company-reported scale adds a third lens
      through customer, student, and analytics-workflow metrics. None of those
      lenses cleanly converts into TAM/SAM/SOM, so the correct diligence posture is
      to preserve the observable signals and note that public market sizing remains
      denominator-sensitive.
    claimRefs: ["CM003", "CM004", "CM005", "CM006", "CM007", "CM010", "CM013"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "demand-drivers-and-budget-owners"
    title: "Demand drivers and budget ownership"
    body: >-
      The demand case is strongest where districts want a single operating model for
      data, interventions, communication, and administrative coordination. PowerSchool's
      own product and survey material points to AI-enabled teaching support,
      whole-child analytics, integrated communication, and real-time dashboards as
      current buying priorities. Budget ownership therefore likely spans more than
      one line item: district leadership, IT/data teams, curriculum or student
      services, and business-operations stakeholders can all influence the purchase
      because the workflow crosses central office, classroom, and home. That multi-
      stakeholder buying path helps explain why integrated suites can expand inside
      a district even when the initial SIS contract appears modest.
    claimRefs: ["CM002", "CM011", "CM012", "CM013"]
  - id: "constraints-switching-and-gaps"
    title: "Constraints, switching behavior, and unresolved gaps"
    body: >-
      Switching costs are real, but they do not eliminate market risk. Third-party
      sources still describe low barriers to entry, budget sensitivity, and rising
      security requirements as structural constraints on growth, while the North
      Carolina migration after the December 2024 breach shows trust failures can
      override incumbent stickiness. The biggest diligence gap is that public
      evidence does not isolate a clean serviceable market for PowerSchool's
      current product bundle: accessible sources mix broad industry value, district
      implementation share, customer counts, and product-usage metrics without a
      shared denominator. That limits valuation work because it is still unclear how
      much of the adjacent K-12 software stack PowerSchool can monetise directly
      versus through partner ecosystems and modular upsell.
    claimRefs: ["CM003", "CM004", "CM010", "CM014", "CM015", "CM016"]
