callouts:
  - calloutType: "insight"
    title: "Sticky market, but not cleanly sizeable from public data"
    body: >-
      The strongest public lens is installed-base share and district contract
      pricing, not a bottom-up serviceable market model. That makes PowerSchool's
      market look durable, but still hard to value without management-only module
      mix, attach-rate, and win-rate data.
    claimRefs: ["CM005", "CM006", "CM007", "CM010"]
  - calloutType: "risk"
    title: "Trust is part of the market boundary"
    body: >-
      The North Carolina migration after the 2024 breach shows that security and
      trust are not side constraints; they can directly reshape competitive share
      even in a category with high switching costs.
    claimRefs: ["CM014", "CM015"]
