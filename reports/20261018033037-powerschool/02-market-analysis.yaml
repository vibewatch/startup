      - ["Family communication and engagement", "District communications or school leadership", "Families, teachers, support staff", "District technology or engagement program budgets", "School-home communication, access to progress and updates, consolidated visibility", "Family engagement or school operations leadership", "Need for a 'single pane of glass' across home and school touchpoints"]
