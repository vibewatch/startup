companyProfile:
  summary: >-
    PowerSchool is a Folsom, California-based K-12 software platform founded in 1997 and now owned by Bain Capital.
    Public evidence still shows a broad operating-system footprint across SIS, learning, special programs, finance, HR,
    analytics, and partner integrations, with current scale claims of more than 60 million students and roughly 18,000
    school organizations. The business remains strategically important as a districtwide workflow layer, but post-LBO
    leverage, private-company financials, and breach liability remain under-disclosed.
