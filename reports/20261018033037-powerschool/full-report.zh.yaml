      - number: '8.4'
        title: 最终尽调要求与投资逻辑破坏触发点
        blocks:
          - type: paragraph
            body: >-
              剩余尽调要求很明确。投资者需要最新审计财务数据、LBO 后债务和契约细节、泄露引发的量化诉讼与监管敞口，以及证明 2025 年和 2026
              年续约保持稳定、没有惩罚性定价或让步不断增加的队列证据。没有这套材料，买方就是在以 2024 年交易为锚的同时评估 2026
              年风险。因此，退出准备度是有条件而非不存在：平台凭借规模和广度仍显得具有战略价值，但下一次有吸引力的入场可能需要更低价格，或清晰证据证明泄露没有结构性损害留存、利润率或融资灵活性。
            claimRefs:
              - CV001
              - CV002
