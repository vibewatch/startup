companyProfile:
  summary: >-
    PowerSchool 总部位于加州 Folsom，是一家成立于 1997 年的 K-12 软件平台，现由 Bain Capital
    持有。公开证据仍显示其操作系统覆盖学生信息系统、学习、特殊项目、财务、人力资源、分析和合作伙伴集成，公司声称当前规模超过 6000 万名学生、约 18,000 个学校组织。该业务仍是学区级工作流的重要基础层，但 LBO
    后的杠杆、私有公司财务数据和泄露责任仍缺乏公开披露。
