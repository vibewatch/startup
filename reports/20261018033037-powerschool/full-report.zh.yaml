              - CO009
              - CO013
      - number: '1.2'
        title: 所有权、管理层与利益相关方依赖
        blocks:
          - type: paragraph
            body: >-
              Tracxn 的资料把公司长期身份锚定在 1997 年于 Folsom 由 Greg Porter、John Stone 和 Wong 创立，并记录公司在多次后续所有权变更前获得了 $32 million
              早期风险投资。当前官方 FAQ 确认了今天尽调最关键的终点：PowerSchool 在 Bain Capital 于 2024 年 10
              月收购后再次成为私有公司。指定资料池没有披露当前债务包、赞助方经济安排，或清晰的交割后董事会和委员会架构；这些信息缺失，使控制权、现金义务和再融资风险难以评估。

              管理层信息同样不完整。Tracxn 仍将 Hardeep Gulati 列为 CEO，而 Civic IQ 报道 Antonio Pietri 于 2025 年 10 月生效接任 CEO，Gulati
              则留任高级顾问。由于资料池中的官方当前页面没有发布完整高管或董事会名单，现有证据支持的是确实存在管理层交接问题，而不是已经确定的主要来源答案。运营依赖面仍很广：学区客户、合作伙伴集成和后台用户都很重要，因为
              PowerSchool 将财务、人力资源和互操作性都定位为同一平台关系的一部分。
            claimRefs:
              - CO003
