            body: >-
              PowerSchool 仍具备真实规模：公司材料称其服务 90 个国家的超过 6000 万名学生，独立报道仍将其学生信息系统描述为品类领先。当前问题不是公司是否有业务，而是 Bain Capital 以 $5.6
              billion 将公司私有化后，新资本能否以有吸引力的条件评估这项业务。Civic IQ 仍看到学区合同续约延续到 2025 年并进入 2026 年，但 Security.org
              的泄露时间线和合同中日益严格的安全措辞意味着存量客户基础虽持久，却负担更重。这个组合支持“继续研究”而不是“回避”，但基于今天的公开证据，不支持支付高于上次已知控制价的价格。
            claimRefs:
