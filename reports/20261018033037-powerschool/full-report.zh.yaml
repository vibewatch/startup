  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              相关市场边界大于独立的学生信息系统。PowerSchool 的公开页面一贯将平台定位为互联的 K-12 运营层，横跨 SIS、分析、沟通、财务 /
              人力资源和合作伙伴扩展，而不只是记录管理。因此，纳入的支出包括核心 SIS、数据 / 分析、学区运营，以及影响留存和扩张的相邻工作流模块。应排除的是通用企业软件，以及学区无需采用 PowerSchool
              核心数据模型即可购买的相邻品类工具。现状替代品不只是另一家 SIS 厂商，也包括零散单点解决方案、人工报表和让数据停留在彼此割裂系统中的学区定制集成。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
