        title: 资本充足性、泄露余波与结论
        blocks:
          - type: paragraph
            body: >-
              Bain 的收购价和贷款方名单表明资本结构很重要，但指定公开证据没有披露私有化后的实际债务规模、定价、契约、摊销或手头现金。再叠加持续的泄露诉讼以及 2023 年后不完整的公开披露，PowerSchool
              的利润路径和流动性缓冲超出了公开市场式尽调能够承保的范围。财务结论不是公司缺乏收入质量，而是这种质量部分由续约和产品广度支撑；资本强度和杠杆问题仍是只能向管理层核实的尽调事项。
