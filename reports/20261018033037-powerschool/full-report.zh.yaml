      - number: '5.3'
        title: 信任与安全仍是最重大的公开技术风险
        blocks:
          - type: paragraph
            body: >-
              带来 PowerSchool 运营杠杆的平台集中化，也造成了集中的信任风险。独立的 2026 年泄露报道称，攻击者利用承包商凭证进入 PowerSource 支持门户，进而触达学区 SIS
              环境。Security.org 称，PowerSource 当时没有要求多因素认证，并将此次入侵描述为大规模学生和教职员工数据泄露。The Learning Standard
              补充称，余波如今还包括多学区诉讼，以及对访问控制、加密和通俗易懂的数据治理实践的新一轮审查。


              这不能证明整个 PowerSchool
              技术栈都很薄弱，但意味着公开尽调应把安全姿态视为尚未解决的投资判断问题，而不是已经坐实的优势。官方页面反复营销安全、互操作性和云可靠性，但指定证据集没有独立验证的正常运行时间遥测、当前认证范围、详细泄露整改架构，或足以让外部人判断营销层以下产品质量的公开实践者
              / 开发者信号。产品广度是真实的；对控制有效性的信心仍然有限。
            claimRefs:
              - CE010
              - CE011
              - CE012
