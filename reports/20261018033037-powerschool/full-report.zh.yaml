              - CP009
              - CP010
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: 采购标准与套餐取舍
        blocks:
          - type: paragraph
            body: >-
              PowerSchool 当前材料称，学区评估厂商时关注的不是单点功能，而是可靠性、集成、治理、隐私和多语言家庭参与。这一框架与公司的广泛定位一致：预算 / 财务页面把 SIS
              放在更大的学区运营堆栈中心，沟通买方指南则强调跨部门互联工作流。竞争含义是，学区若想把多个工作流整合到一个平台，PowerSchool 的优势最强；若只想优化某个 SIS 功能，则不一定如此。

              这组比较中最明显的公开弱点是定价透明度。审阅的 PowerSchool 页面把买方引向销售沟通；SoftwareSuggest 页面则反复出现“Get
              Pricing”提示，起始价格栏为空，没有可比合同条款。因此，公开网页证据适合构建候选名单和筛选能力，但不足以判断挑战者在总成本、折扣或逐模块打包上是否胜出。仍需要采购资料和真实学区报价。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP007
              - CP009
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP005
              - CP008
              - CP012
      - number: '3.3'
        title: 持久性、切换摩擦与替代风险
        blocks:
          - type: paragraph
            body: >-
              PowerSchool
              的护城河真实存在，但并非没有条件。官方材料强调生态广度、集成和合作伙伴驱动的工作流扩展；如果学区已经使用多个模块，或依赖连接合作伙伴的流程，拆除平台的成本就会更高。这种广度支持交叉销售和续约韧性，而 Civic
              IQ 仍报告 2025–2026 年持续有合同活动。因此，公司更像深度嵌入的套件老牌厂商，而不是单点功能的最佳产品。

              指定证据中最清晰的替代风险是信任。Security.org 的泄露审查具体说明了 2024–2025 年事件，包括暴露记录规模和 MFA 缺失的作用；G2
              比较摘录则显示，一些替代品被认为更容易合作或支持更好。这并不能证明份额会立即流失，但确实为竞争对手创造了可信切入口：争取那些已经对服务或安全治理不满的学区，而不是单纯在功能广度上正面超越 PowerSchool。
            claimRefs:
              - CP002
              - CP005
              - CP009
              - CP010
              - CP011
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: PowerSchool 仍以套件老牌厂商身份竞争
            body: 最强的证据优势是广度加存量客户基础：官方材料将 PowerSchool 定位为互联 K-12 平台，Civic IQ 仍称其为 2026 年占主导地位的 SIS 老牌厂商。
            calloutType: strength
            claimRefs:
              - CP001
              - CP010
          - type: callout
            title: 信任是挑战者最可信的突破口
            body: G2 上的支持体验认知和 2024–2025 年泄露事件的持续余波，比单纯功能广度更可能成为挑战者的切入口。
            calloutType: risk
            claimRefs:
              - CP005
              - CP009
              - CP011
          - type: callout
            title: 公开定价过于不透明，无法清晰判断赢家
            body: 指定网页证据足以比较工作流匹配度，但不足以判断考虑学区层面的打包和折扣后，哪家厂商在结构上更便宜。
            calloutType: insight
            claimRefs:
              - CP008
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现面
        blocks:
          - type: paragraph
            body: >-
              指定证据支持的是广泛的订阅型产品面，而不是单一产品业务。PowerSchool 官方页面将公司定位为集成式 K-12
              平台，连接学生信息、学习、特殊项目、财务、人力资源、分析和合作伙伴扩展。这在财务上很重要，因为它能在同一学区账户内创造多个附加点，并支持运营和教学预算之间的交叉销售逻辑。公开证据没有提供按产品云划分的清晰收入组合，因此更合理的解读是“变现面多元、组合不透明”，而不是量化的经常性收入堆栈或已披露的产品级毛利桥接。所引用的合作伙伴目录也没有披露收入分成条款。
            claimRefs:
              - CI001
              - CI002
