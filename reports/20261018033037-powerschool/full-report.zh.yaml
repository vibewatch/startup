      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 数据泄露成本趋于稳定，续约保持韧性，向财务、人力资源及相邻模块交叉销售持续扩大。
        - 只有当尽调显示经济表现至少接近 2023 年快照，且负债责任外溢受控时，才有理由支持高于 2024 年交易参考价的溢价。
        - 法律尾部风险、安保问题反复以及公共部门预算放缓
        - 需要新的经审计财务数据，以及当前尚未公开的清晰续约和负债责任证据。
      - - 基准
        - 续约保持，但安全条款更严格，所有权不透明仍在
        - 估值应处于 2024 年交易参考价或其下方，因为当前公开证据支持业务耐久性，却不足以支持相对该价格的溢价。
        - 倍数压缩、让步条款增多以及未披露的偿债压力
        - 最符合今天的公开证据，但没有赋予数值概率。
      - - 悲观
        - 客户大量流失、负债责任超预期扩大，或杠杆限制再投资
        - 估值应较 2024 年交易参考价大幅折价，或应作出回避决定，因为没有当前债务和负债责任数据，就无法支撑精确的下行底线。
        - 集体诉讼、监管行动和再融资压力
        - 由不利的续约、负债责任或融资披露触发。
    notes: 情景判断是定性的，以 Bain 披露的 2024 年私有化价值为锚；由于 LBO 后债务和最终数据泄露负债结果在本来源池中均未公开，无法支撑数值化的估值区间或概率。
    claimRefs:
