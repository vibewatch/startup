  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险姿态：受监管的基础设施与明显执行拖累
        blocks:
          - type: paragraph
            body: >-
              PowerSchool
              承担着类似基础设施的义务，却没有基础设施级别的公开披露。其隐私声明称，公司作为学校和学区客户的数据处理方处理学生教育记录，可能在不同司法辖区依赖第三方云供应商，并将事故监控视为核心控制面。因此，隐私、分包商治理、正常运行时间和合同合规位于投资逻辑中心，而不是外围。公开缓解叙事确实存在——专门的安全资源、年度
              SOC 2 审计、ISO 27001:2013 认证、受保护云环境和单点登录——但公开用户证据仍指向不容忽视的可靠性和维护摩擦。由于 PowerSchool 还把自己定位为横跨
              SIS、财务、人力资源、学习和合作伙伴集成的互联操作系统，一个控制平面的失效可能波及多个学区工作流。
            claimRefs:
              - CR001
