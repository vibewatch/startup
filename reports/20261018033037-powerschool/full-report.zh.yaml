  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 互联的 K-12 操作系统撑起产品广度
        blocks:
          - type: paragraph
            body: >-
              公开材料一贯把 PowerSchool 描述为平台公司：它的核心工作是站在学区运营中心，而不是只销售单一的学生记录数据库。最有力的官方表述来自 Student Information Cloud
              页面，该页面将其描述为面向较小学校和学区的“完整云托管学生信息、招生、数据管理和分析解决方案”。主页进一步扩大了这一定位，称 PowerSchool 是“全球最全面的 K-12
              软件”，并将套件定位为服务管理人员、教育工作者、家庭和学生的互联操作系统。


              公开帮助和产品页面进一步证明这是一套多模块套件。PowerSchool 为 SIS 管理员、教师、学生和家长工作流、招生、单点登录、Naviance 和 Allovue 分别提供帮助 /
              文档入口。财务与人力资源解决方案页面也显示，SIS 只是更广泛中央办公室堆栈中的一层，该堆栈还包括 Unified Operations、Unified Talent、Business Analytics 和
              eFinancePlus。合起来看，公开页面支持一个真实的产品线地图和运营广度，但没有披露模块级采用率、附加率，或被收购组件之间的架构边界。
