chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、阶段与平台覆盖
        blocks:
          - type: paragraph
            body: >-
              最有力的官方证据将 PowerSchool 定义为私有 K-12 软件平台，而非单点产品。其当前 About
              页面和产品页面描述了一套互联操作系统，把学生信息、教学与学习、学生支持、家庭参与、人力资源、财务、分析和 AI 助手连在一起；当前规模口径为超过 15,000 个组织、全球超过 6000 万名学生，并覆盖北美超过
              80% 的学区。因此，公司既是学区关键的系统记录层，也是学区工作流内的交叉销售平台。

              公开商业信息仍不完整。EdTech Impact 提供了一个有用但狭窄的公开定价窗口：教师层 PowerSchool Learning 订阅每月 $4.95 至
              $30，更广泛的解决方案则引导客户回到销售团队。这能支撑商业模式描述，但无法回答学区合同经济性、套餐附加率，或 PowerSchool 目前与核心平台并列销售的非 SIS 模块贡献了多少收入。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
              - CO009
              - CO010
