      - number: '2.3'
        title: 需求驱动因素与预算归属
        blocks:
          - type: paragraph
            body: >-
              当学区希望用一个运营模型统一数据、干预、沟通和行政协调时，需求逻辑最强。PowerSchool 自有产品和调研材料指出，AI
              教学支持、全人分析、集成沟通和实时仪表板是当前采购重点。因此预算归属可能横跨多个科目：学区领导、IT /
              数据团队、课程或学生服务部门以及业务运营利益相关方都可能影响采购，因为工作流贯穿中央办公室、课堂和家庭。这条多利益相关方采购路径，也解释了为什么集成套件即使初始 SIS 合同看起来不大，仍能在学区内部扩张。
            claimRefs:
              - CM002
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 约束、切换行为与未决缺口
        blocks:
          - type: paragraph
            body: >-
              切换成本确实存在，但不能消除市场风险。第三方来源仍将进入壁垒低、预算敏感度高和日益严格的安全要求列为增长的结构性约束；2024 年 12
              月泄露事件后北卡罗来纳州的迁移则表明，信任失败可以压过老牌厂商的黏性。最大的尽调缺口是，公开证据没有为 PowerSchool
              当前产品组合分离出清晰的可服务市场：可获得来源把广义行业价值、学区实施份额、客户数和产品使用指标混在一起，没有共同分母。这限制了估值工作，因为目前仍不清楚 PowerSchool 能直接变现多少相邻 K-12
              软件堆栈，又有多少要通过合作伙伴生态和模块增购实现。
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 市场黏性仍在，但公开数据无法清晰测算规模
            body: 最有力的公开视角是存量客户份额和学区合同定价，而不是自下而上的可服务市场模型。因此，PowerSchool 的市场看起来持久，但没有管理层独有的模块组合、附加率和赢单率数据，仍很难估值。
            calloutType: insight
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM010
          - type: callout
            title: 信任也是市场边界的一部分
            body: 2024 年泄露事件后北卡罗来纳州的迁移表明，安全和信任不是外围约束；即使在切换成本很高的品类中，它们也能直接重塑竞争份额。
            calloutType: risk
            claimRefs:
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与直接同行
        blocks:
          - type: paragraph
            body: >-
              指定证据指向的是分层竞争集合，而不是一个清晰的一对一替代品。独立比较页面在买方评估替换 PowerSchool SIS 时反复列出 Aeries、Infinite Campus、Tyler SIS 和
              Skyward；Veracross、FACTS SIS 和 TeacherEase 则更常作为学校优先或独立学校替代品出现，而非学区规模同行。这很重要，因为它说明 PowerSchool
              的防守力不在于没有替代品，而在于它面向广泛学区工作流销售，替代范围会收窄到少数运营上可比的 SIS 厂商。

              PowerSchool 的起点也比多数对手拥有更大的老牌客户基础。Civic IQ 称，尽管泄露事件带来审查，PowerSchool 在 2026 年仍支撑约四分之三的 K-12 SIS
              市场；官方页面也继续将公司定位为互联操作系统，而非单一 SIS 模块。实际采购中，寻找全学区替换方案的客户应先筛选 Infinite Campus、Tyler SIS、Aeries 和
              Skyward；有更窄的独立学校或课堂工作流需求的客户，则可把学校优先工具纳入候选。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP010
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
