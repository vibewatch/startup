      - number: '8.2'
        title: 投资逻辑、反向逻辑与入场锚点
        blocks:
          - type: paragraph
            body: >-
              正面逻辑建立在三个证明点上：存量客户规模、不断扩大的平台广度和历史经济数据。PowerSchool
              营销的是一套覆盖学生信息、财务与人力资源工作流及合作伙伴扩展的集成堆栈；这很重要，因为更深的工作流附着是守住续约和最终退出价值最清晰的路径。Overlooked
              的公开分析仍给出了资料池中最好的已披露经济快照：2023 年 $701.5 million 的 ARR、17.7% 的同比增长和 22.2% 的 EBITDA 利润率。但当前入场锚点是 2024 年 Bain
              控制权交易，而不是较早的公开市场报价，因此投资逻辑必须通过比单纯产品质量或品类领导力更高的证明门槛。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV015
