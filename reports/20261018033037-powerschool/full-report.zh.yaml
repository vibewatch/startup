      - number: '8.3'
        title: 情景框架与估值区间
        blocks:
          - type: paragraph
            body: >-
              由于资本结构信息过时、最终泄露责任信息不完整，情景框架必须保持宽泛。即便如此，公开记录仍足以围绕 2024
              年控制权交易构建情景，而不必编造当前估值区间。乐观情景需要证明泄露余波已被控制，财务、人力资源和相邻模块的交叉销售仍然有效，杠杆和责任负担也可管理。基准情景假定业务能够守住续约，但尚未赢得相对于 Bain
              价格的溢价。悲观情景则由流失、监管 / 法律升级，或外部投资者目前无法看到的更紧债务堆栈驱动。
            claimRefs:
              - CV001
