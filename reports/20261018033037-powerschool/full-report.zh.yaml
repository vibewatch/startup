            body: >-
              公开信号更多反映存量客户规模，而非运营效率。Bain 2024 年公告称客户覆盖超过 5500 万名学生、超过 17,000 个客户；当前主页则将平台营销为覆盖 90 个国家的超过 6000 万名学生。Civic
