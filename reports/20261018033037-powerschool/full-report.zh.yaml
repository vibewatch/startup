              - CM012
              - CM013
      - number: '2.2'
        title: 市场规模视角与可观察规模
        blocks:
          - type: paragraph
            body: >-
              公开规模证据具有方向性价值，但方法混杂。最清晰的第三方视角是存量客户份额：Civic IQ 引用 ListEdTech 2025 年 11 月覆盖超过 23,000 个学区的数据，将 PowerSchool
              在已识别 SIS 实施中的份额定为约 23%，领先于约 10% 的 Infinite Campus 和 7% 的 Skyward。合同数据提供了第二个视角，显示 PowerSchool 的基础 SIS
              定价较低，但续约和模块增购经济性可观。公司报告的规模则通过客户、学生和分析工作流指标提供第三个视角。这些视角都不能直接转换成 TAM / SAM /
              SOM，因此正确的尽调姿态是保留可观察信号，并注明公开市场规模仍高度依赖分母。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM010
              - CM013
