      - number: '1.3'
        title: 里程碑、商业化与当前风险姿态
        blocks:
          - type: paragraph
            body: >-
              保留下来的里程碑显示，在 Bain 私有化之前，公司仍在持续扩大产品范围。2023 年 1 月发布的版本推出 LearningNav、ContentNav、新的 MTSS 资源库和按角色划分的软件
              Clouds，进一步印证了公司销售更广泛学区工作流堆栈、而非单独 SIS 的策略。当前预算、财务和合作伙伴页面仍在延续这一叙事，强调集成运营、单点登录，以及覆盖医疗、居住、支付和图书馆工作流的合作伙伴扩展。

              最明确的负面事件是 2024 年 12 月的数据泄露。Security.org 的重建称，攻击者利用分包商凭证和未强制启用 MFA 的 PowerSource 环境，窃取了影响约 6200 万名学生和 950
              万名教师的数据；报道还称，余波在 2025 年延伸至后续勒索、诉讼和隐私监管审查。这并不能推翻 PowerSchool
              当前的信任叙事，但尽调必须检验：产品广度和客户嵌入度是否足以抵消安全整改成本、法律敞口和声誉拖累。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
