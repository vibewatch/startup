  - id: FE001
    title: PowerSchool 公开产品架构图
    type: stack
    summary: 公开材料将 PowerSchool 描绘为分层的 K-12 操作系统：SIS 位于核心，其上是相邻工作流模块，外围则是合作伙伴与支持层。
    data:
      layers:
        - label: 用户工作流界面
          detail: 管理员、教师、学生和家长角色分别拥有独立的公开帮助界面。
          modules:
            - PowerSchool SIS - Administrator
            - PowerSchool SIS Teacher
            - PowerSchool SIS - 学生与家长
        - label: 核心学生运营
          detail: Student Information Cloud 将学生信息、入学和核心运营记录整合进一套相互连接的 Cloud 套件。
          modules:
            - PowerSchool SIS
            - 学生信息管理
            - 在线入学管理
        - label: 数据、表单与分析服务
          detail: 该 Cloud 套件围绕学生记录增加数据提交、文档和分析能力。
          modules:
            - 全年数据提交
            - 文档分发与存储
            - 数据分析
        - label: 中央办公室扩展
          detail: 财务和人力资源产品让套件超出课堂与 SIS 工作流。
          modules:
            - 统一运营
            - 统一人才管理
            - 商业分析
            - eFinancePlus
        - label: 集成生态
          detail: 合作伙伴应用把平台延伸至运营边缘场景和专业教育工作流。
          outputs:
            - 居住地与身份验证
            - 健康与福祉工具
            - 支付与账单
            - 图书馆与资产管理
        - label: 支持与控制平面
          detail: 版本化文档、Customer Central 和 PowerSource 支持路径支撑运营，但也构成一个高度集中的控制点。
          modules:
            - PowerSchool SIS Administrator Help
            - Customer Central
            - PowerSource 支持门户
    approximationNotes: 这是基于公开界面的运营模型，而非逆向还原的基础设施图；内部服务边界、API 和托管拓扑仍未披露。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE010
  - id: FU001
    title: 从 SIS 锚点到套件扩张的客户旅程
    type: journey-map
    summary: 公开证据显示，客户路径从 SIS 记录管理开始，逐步扩展至学生支持、教学、学区运营、合作伙伴集成，以及由安全事件驱动的续约审查。
    data:
      items:
        - label: SIS 作为记录系统入口
          stage: 初始采用
          actors: District administrators, registrars, school IT
          touchpoints:
            - 入学、出勤、成绩和合规工作流
            - 嵌入学区运营的后端记录系统
          tone: neutral
        - label: 学生支持追加销售
          stage: 工作流扩展
          actors: Special education leaders, case managers, families
          touchpoints:
            - IEP、504、ELL、资优和服务记录工作流
            - Special Programs 内的合规与文档活动
          tone: positive
        - label: 教学与学习扩张
          stage: 日常使用增长
          actors: Teachers, students, counselors
          touchpoints:
            - Schoology 及相邻课堂工具
            - Naviance 及其他学生参与界面
          tone: positive
        - label: 运营与人力资源扩张
          stage: 预算拓宽
          actors: Finance, HR, district operations teams
          touchpoints:
            - 商业运营、分析和人才管理工作流
            - SIS 被定位为更广泛生态的核心
          tone: opportunity
        - label: 合作伙伴主导的扩展
          stage: 生态覆盖
          actors: IT teams, integration partners
          touchpoints:
            - 居住地、支付、健康和图书馆扩展
            - 借助合作伙伴网络扩大使用场景，同时不替换核心系统
          tone: neutral
        - label: 续约与安全审查
          stage: 数据泄露后的耐久性测试
          actors: District leadership, boards, security stakeholders
          touchpoints:
            - 续约中的增强安全条款
            - 数据泄露后的替代厂商评估与更严格监督
          tone: risk
    claimRefs:
      - CU005
      - CU009
      - CU010
      - CU013
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最大的剩余风险在于学生数据治理和 AI 合规；由于 PowerSchool 被定位为学区关键基础设施，运营摩擦和生态依赖仍处于中高水平。
    data:
      columns:
        - label: 可能性
          detail: 该问题在未来 12 至 18 个月内暴露的概率。
        - label: 影响
          detail: 对学区运营、合同或投资判断的潜在影响。
        - label: 缓释成熟度
          detail: 当前公开缓释措施证据的具体程度。
        - label: 剩余风险敞口
          detail: 考虑已披露缓释措施后的净风险。
        - label: 检测速度
          detail: 管理层应多快发现问题正在发生。
        - label: 证据强度
          detail: 相对于完整尽调数据室，公开证据的强弱。
      rows:
        - label: 学生数据隐私与 AI 合规
          note: 数据处理方义务、客户所有的数据以及按学区定制的合同安排，使合规失败的代价很高。
          values:
            - label: 高
            - label: 高
            - label: 中等
            - label: 高
            - label: 中
            - label: 中等
        - label: 运营可靠性与实施拖累
          note: 审阅证据显示，尽管官方强调可靠性，设置、维护、支持和数据质量仍存在摩擦。
          values:
            - label: 中
            - label: 高
            - label: 中等
            - label: 中高
            - label: 中
            - label: 中等
        - label: 合作伙伴与平台依赖
          note: 互操作性是卖点，但集中度和故障切换细节并未公开。
          values:
            - label: 中
            - label: 中高
            - label: 中等
            - label: 中
            - label: 中低
            - label: 中等
    claimRefs:
      - CR002
      - CR003
      - CR005
      - CR006
      - CR012
      - CR013
      - CR015
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 公开证据仍支持一个经久耐用的平台，但数据泄露和 LBO 后的信息不透明，阻止了立即买入的判断。
    data:
      nodes:
        - id: scale
          label: 规模证据：超过 6,000 万名学生，覆盖 90 个国家
          note: 装机基础证据仍指向品类领先地位。
        - id: breadth
          label: 平台广度：SIS 加上财务、人力资源和合作伙伴生态
          note: 多种工作流可以在核心记录系统之外进一步加深客户绑定。
        - id: economics
          label: 历史经济表现：2023 年 ARR $701.5M，EBITDA 利润率 22.2%
          note: 公开证据显示出成熟且盈利的垂直软件画像。
        - id: entry
          label: 进入锚点：Bain 于 2024 年支付 $5.6B
          note: 最近可见的控制权价格已经计入了较高的质量溢价。
        - id: overhang
          label: 下行压力：6,200 万条学生记录、950 万条教师记录，以及更严格的合同措辞
          note: 数据泄露后果和信息不透明扩大了下行空间，超过了上行空间。
        - id: output
          label: 结论：继续研究、昂贵、高风险
          note: 在把上行空间计入投资判断前，等待负债责任、杠杆和续约质量尽调。
      edges:
        - from: scale
          to: breadth
        - from: breadth
          to: economics
        - from: economics
          to: entry
        - from: entry
          to: overhang
        - from: overhang
          to: output
    approximationNotes: 该流程顺序是对所引用证据的分析性综合，并非公司披露的流程。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV008
      - CV010
      - CV011
      - CV013
      - CV015
