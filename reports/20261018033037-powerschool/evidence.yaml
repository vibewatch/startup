evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current debt quantum, pricing, amortization, covenant package, and sponsor economics after the Bain take-private.
    whyItMatters: Leverage and covenant headroom determine resilience against litigation cost, remediation spend, and exit timing.
    diligencePath: >-
      Request lender presentations, debt agreements, management case forecasts, and current cap table materials in the
      data room.
    relatedQuestionRefs:
      - QO004
  - type: missing-source
    severity: material
    topic: leadership and governance enumeration
    missingEvidence: A current primary-source executive roster, board composition, committee structure, and authority map.
    whyItMatters: Conflicting retained sources name different CEOs, so governance accountability cannot be treated as closed.
    diligencePath: >-
      Obtain current board materials, management biographies, and ownership governance documents directly from the
      company or transaction counsel.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map coverage
    missingEvidence: A complete investor, lender, major customer, and partner concentration map with revenue or control weights.
    whyItMatters: >-
      The retained sample identifies who matters, but not concentration thresholds or which relationships are
      economically decisive.
    diligencePath: >-
      Request customer concentration tables, partner revenue-share schedules, lender list, and sponsor governance
      rights.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: enterprise pricing and current operating metrics
    missingEvidence: District contract pricing, ARR, NRR, gross margin by product family, and a clean consolidated headcount.
    whyItMatters: >-
      The public evidence confirms product breadth and some teacher-tier pricing, but it does not support underwriting
      unit economics or operating leverage.
    diligencePath: Request current board deck, pricing architecture, customer cohort analysis, and HR census export.
  - type: private-evidence-only
    severity: material
    topic: sam-som-isolation
    missingEvidence: >-
      Module-level customer counts, attach rates, ACV by product family, and win/loss data by district size and
      geography.
    whyItMatters: >-
      Without those denominators, public TAM and share proxies cannot be converted into a defensible serviceable market
      or obtainable share model for valuation.
    diligencePath: >-
      Request management's current customer segmentation, module penetration by district cohort, and recent new-logo
      versus cross-sell bookings by product line.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: scale-denominators
    missingEvidence: >-
      A reconciled metric dictionary for students, customers, districts, implementations, dashboards, and interventions,
      each with date stamps and coverage scope.
    whyItMatters: >-
      The public record mixes ecosystem reach, installed-base share, and workflow activity, so averaging or stacking
      them would overstate market precision.
    diligencePath: >-
      Ask management to reconcile 55M versus 60M student claims, define the 17,000-customer base, and map
      analytics-usage metrics to actual paying districts.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: access-blocked
    severity: minor
    topic: paid-market-sizing
    missingEvidence: >-
      Full analyst-market-data methodology for K-12 SIS market value, CAGR, and regional segment splits rather than
      preview text.
    whyItMatters: >-
      Public preview pages identify the market categories and drivers but do not expose enough methodology to support a
      precise market-size conclusion.
    diligencePath: >-
      Obtain the underlying paid market report or an equivalent public filing or procurement dataset that discloses
      category value, growth, and segment definitions.
    relatedQuestionRefs:
      - QM006
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Recent district contract quotes, module bundles, discount schedules, and per-student or per-school pricing terms
      for PowerSchool and its core SIS peers.
    whyItMatters: >-
      Without quote-level pricing, the chapter cannot test whether PowerSchool's broader suite offsets higher contract
      cost or whether challengers are winning mainly on economics.
    diligencePath: >-
      Request recent RFP responses, district board approvals, or anonymized contracts for PowerSchool, Infinite Campus,
      Skyward, and Tyler SIS.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: partial-replacement-paths
    missingEvidence: >-
      District case studies or procurement records showing schools replacing selected PowerSchool modules with
      internally built tools or custom integrations instead of a full platform migration.
    whyItMatters: >-
      The assigned evidence supports partner-led extension and direct vendor replacement, but it does not quantify how
      often districts choose bespoke partial replacement.
    diligencePath: >-
      Review district board packets, implementation postmortems, and module-specific procurement files for partial
      replacements or internal-build decisions.
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current LTM revenue, ARR, gross margin, EBITDA, cash balance, and detailed post-LBO debt schedule.
    whyItMatters: These are the minimum inputs needed to underwrite leverage, runway, and margin resilience under private ownership.
    diligencePath: >-
      Request the latest lender deck, monthly management accounts, debt agreements, covenant calculations, and a
      sources-and-uses bridge from management.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
  - type: private-evidence-only
    severity: material
    topic: pricing-quality
    missingEvidence: >-
      Realized pricing, discounts, contract term distribution, seat counts, and implementation or services mix by
      product cloud.
    whyItMatters: >-
      Public contract examples cannot show whether revenue quality comes from healthy price realization or from
      concessions and bundling.
    diligencePath: >-
      Request cohort renewal files, top-50 customer contracts, pricing waterfalls, and product-level ARR by district
      size band.
    relatedQuestionRefs:
      - QI002
      - QI003
  - type: private-evidence-only
    severity: material
    topic: breach-liability
    missingEvidence: >-
      Breach reserve, insurance recovery, settlement exposure, and churn or NRR changes attributable to the cyber
      incident.
    whyItMatters: Ongoing litigation and trust remediation can affect cash needs, customer retention, and required security spend.
    diligencePath: >-
      Request legal reserve memos, insurance correspondence, breach-remediation budget, and renewal analytics for
      affected districts.
    relatedQuestionRefs:
      - QI004
      - QI007
  - type: missing-source
    severity: material
    topic: engineering-telemetry
    missingEvidence: >-
      Public or shared diligence evidence on uptime history, customer-visible SLAs, security certifications, and
      post-breach control remediation.
    whyItMatters: >-
      Without external telemetry or audited controls, investors cannot independently validate reliability or judge
      whether the current security posture is materially improved.
    diligencePath: >-
      Request current trust-center materials, status-history exports, certification reports, security architecture
      documentation, and customer SLA commitments.
    relatedQuestionRefs:
      - QE007
  - type: private-evidence-only
    severity: material
    topic: architecture-depth
    missingEvidence: >-
      Architecture diagrams or technical design documents showing API boundaries, data model integration, and
      support-tool access controls across the product suite.
    whyItMatters: >-
      Product breadth is visible, but the integration depth and operational coupling between modules drive
      implementation risk, breach blast radius, and upgrade complexity.
    diligencePath: >-
      Review product architecture diagrams, integration reference docs, identity model documentation, and customer
      implementation materials under NDA.
    relatedQuestionRefs:
      - QE002
      - QE007
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: Post-breach GRR, NRR, churn, renewal rates, and average contract terms by major product line.
    whyItMatters: Public footprint and procurement signals cannot prove whether the installed base is sticky or merely broad.
    diligencePath: Request cohort retention data, renewal cohorts, and contract-term disclosure from management and board materials.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Top-customer revenue share, exposure to statewide contracts, and reseller or channel concentration by product.
    whyItMatters: >-
      Concentration can turn a large installed base into a much riskier revenue base than the customer-count headline
      implies.
    diligencePath: Ask for the top-10 customer concentration schedule, state contract exposure, and channel mix in the data room.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof
    missingEvidence: Independent deployment and outcome evidence for more named districts across multiple modules.
    whyItMatters: >-
      The current public set proves customer association better than it proves measured ROI, renewal quality, or
      fleet-wide adoption.
    diligencePath: >-
      Collect customer references, procurement files, or implementation case studies from independent district or state
      sources.
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: breach-liability
    missingEvidence: >-
      Current quantified breach-related reserve, settlement exposure, insurance recovery, or regulator-imposed remedy
      obligations.
    whyItMatters: >-
      The legal and financial downside of a privacy or security event cannot be sized from the assigned public pool,
      which keeps residual legal risk wider than the disclosed controls imply.
    diligencePath: >-
      Request current board or lender materials covering breach reserves, outside-counsel updates, insurer
      correspondence, and any active regulator or MDL milestones.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: service-reliability
    missingEvidence: Product-level uptime, incident frequency, mean time to recovery, and support-backlog data by major workflow.
    whyItMatters: >-
      PowerSchool sells always-on district operations, but the public pool offers only marketing claims plus anecdotal
      review evidence, which is not enough to underwrite operational resilience.
    diligencePath: >-
      Ask for internal uptime dashboards, customer SLA reports, incident postmortems, and support-ticket trend lines for
      SIS, finance, and learning products.
    relatedQuestionRefs:
      - QR005
  - type: missing-source
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      A ranked map of critical partners, subprocessors, and content providers by workflow, revenue exposure, and
      failover readiness.
    whyItMatters: >-
      The partner ecosystem is clearly broad, but investors cannot tell which external nodes are mission-critical or how
      quickly districts could recover if one fails.
    diligencePath: >-
      Request the current subprocessor register, top partner list by attached ARR or customer count, and documented
      failover plans for integrated workflows.
    relatedQuestionRefs:
      - QR006
  - type: private-evidence-only
    severity: material
    topic: post-lbo-capital-structure
    missingEvidence: >-
      Current debt quantum, covenant package, amortization schedule, interest cost, and any preferred or preference
      overhang after the Bain buyout.
    whyItMatters: >-
      Without the capital-structure burden, investors cannot convert the disclosed control price into an equity return
      case or a reliable downside floor.
    diligencePath: >-
      Request the current lender deck, debt agreements, cap table, and any board-approved financing summary during
      management diligence.
    relatedQuestionRefs:
      - QV008
  - type: missing-source
    severity: material
    topic: breach-liability-quantification
    missingEvidence: >-
      Quantified breach reserve, insurance recovery assumptions, settlement exposure, and current renewal cohort data
      after the 2024 incident.
    whyItMatters: >-
      These items determine whether PowerSchool can defend Bain's entry valuation or whether legal and retention drag
      should push the underwriting case materially lower.
    diligencePath: >-
      Obtain management's latest breach-response reserve memo, insurance correspondence, and cohort renewal bridge for
      2025 to 2026 school-year contracts.
    relatedQuestionRefs:
      - QV003
      - QV007
      - QV008
