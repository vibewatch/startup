company:
  name: LigaChem Biosciences
chapter:
  number: 8
  title: Valuation
  summary: >-
    LigaChem has partnered ADC licensing evidence and a newly dosed in-house
    candidate, but its retained public evidence does not establish a date-matched
    equity value, fully diluted share count, risk-adjusted pipeline value, or
    current cash runway. The evidence therefore supports research-more rather
    than a numeric target or buy call; entry discipline depends on clinical
    proof, financing reconciliation, and a current valuation model.
sections:
  - id: price-sensitive-judgment
    title: A price-sensitive research-more call
    body: >-
      LigaChem's licensing history and clinical progress create a credible
      platform thesis, but they do not convert headline deal values into current
      revenue or cash. A Seoul Economic Daily report cited a $1.7 billion total
      LCB84/J&J deal and $100 million upfront payment, while describing a further
      $200 million as conditional on J&J exercising an option; those contingent
      amounts are not realized receipts (CV002, CV003). The same retained pool
      reports losses and declining cash, as well as a KRW 500 billion financing
      transaction (CV008-CV011). Gosset's preview lists market capitalization,
      enterprise value, and total revenue, but does not date or define the
      financial periods for those figures (CV013). In the absence of a
      date-matched share count, current price, cash/debt bridge, and risk-adjusted
      revenue model, no responsible entry multiple, target return, or numeric
      bull/base/bear range can be calculated. The practical call is research-more,
      with a high risk rating and no numeric target until those inputs are
      reconciled.
    claimRefs:
      - CV002
      - CV003
      - CV008
      - CV009
      - CV011
      - CV013
    tableRefs:
      - TV001
  - id: asset-value-and-conditions
    title: Partner economics and clinical proof are real but uneven
    body: >-
      LigaChem describes itself as a clinical-stage company focused on ADC and
      immuno-oncology medicines, and the retained evidence includes both an
      out-licensed asset and internally advanced programs (CV001, CV002,
      CV004). The LCB84 agreement supplies strategic validation and an upfront
      payment, but the reported total deal value includes contingent economics;
      the analyst's additional $200 million is explicitly conditional rather
      than booked cash or guaranteed revenue (CV002, CV003). Separately, after
      NextCure's strategic pivot, LigaChem assumed sole development,
      manufacturing, and commercialization authority for LNCB74, while
      accepting future milestone and royalty obligations (CV005, CV006). That
      control can improve strategic optionality while also shifting clinical
      execution and funding burden to LigaChem. A PharmaLetter company profile
      documents an earlier CS5001 licensing arrangement, but it is a dated
      profile and not evidence of current royalty conversion or repeatable
      economics (CV014). The thesis strengthens only when trial outcomes and
      partner cash conversion—not deal headlines alone—are observable.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV014
    tableRefs:
      - TV002
  - id: capital-risk-and-dilution
    title: Financing extends capacity but does not settle runway
    body: >-
      BizHankook reported KRW 141.6 billion of 2025 consolidated revenue,
      alongside a KRW 106.5 billion operating loss and KRW 91.6 billion net
      loss; it also reported cash and cash equivalents falling from KRW 98.6
      billion at year-end 2025 to KRW 63.5 billion at the end of the first
      quarter of 2026, with KRW 46.4 billion of first-quarter outsourced
      research and development costs (CV007-CV010). These are distinct
      accounting and cash measures, not a single burn-rate calculation. A
      separate report describes KRW 500 billion in convertible bonds and
      convertible preferred shares, while another attributes an approximately
      KRW 1 trillion development-funds figure to an Orion official (CV011,
      CV012). The latter estimate combines reported funding and purported
      existing cash, but its date, restrictions, and reconciliation to the
      quarter-end cash figure are not established in the retained text.
      Convertible securities can also dilute equity or create preference
      overhang; issue-level terms, fully diluted shares, and current available
      cash remain diligence items, not assumed funding capacity.
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
  - id: scenarios-and-decision-gates
    title: Scenarios remain directional until valuation inputs are verified
    body: >-
      The bull case requires partner progression on LCB84, demonstrated safety
      and efficacy in clinical programs, and cash receipts that convert
      contracted economics into reported revenue; a first dose in LCB02A's
      global Phase 1/2 trial is execution evidence, not efficacy evidence
      (CV002-CV004). The base case should assume milestone timing remains
      uncertain and that internal development continues to consume capital.
      The bear case is a clinical delay or failure combined with continuing
      losses, financing needs, or dilution; the LNCB74 rights transition also
      leaves LigaChem responsible for future program obligations (CV005,
      CV006, CV008-CV012). The available evidence does not establish
      probability-weighted cash flows, comparable-company assumptions, or a
      date-matched fully diluted valuation. Accordingly, the scenario table
      gives qualitative probability signals and explicitly withholds numeric
      value ranges rather than manufacturing precision. A refreshed price and
      capitalization bridge, financing terms, partner receipts, and trial
      readouts are the decision gates for moving from research-more to a
      return-based recommendation.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV011
      - CV013
    tableRefs:
      - TV003
    figureRefs:
      - FV001
tables:
  - id: TV001
    title: Recommendation summary
    columns:
      - Decision metric
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - research-more
        - Partnered ADC economics and clinical execution are promising, but contingent receipts and clinical outcomes remain uncertain.
        - Do not issue a buy call or numeric target before resolving current price, capitalization, cash, and risk-adjusted pipeline value.
      - - Confidence
        - low
        - Public valuation inputs are not date-matched or sufficiently specified for an entry multiple or return calculation.
        - Reassess after primary financing disclosures and a current fully diluted share count are reconciled.
      - - Risk rating
        - high
        - Reported operating and net losses, falling quarter-end cash, ongoing clinical spend, and convertible securities create execution and dilution exposure.
        - Monitor cash runway, financing terms, trial safety and efficacy, and partner-option decisions.
      - - Valuation stance
        - unproven; price-sensitive
        - A third-party preview reports market capitalization and enterprise value without an explicit valuation date or revenue period.
        - No defensible fair-value range or target return from the assigned evidence.
    notes: >-
      Judgment uses reported figures with their stated periods and attribution;
      the scenario and valuation conclusions are not company guidance or a
      calculated target price.
    claimRefs:
      - CV002
      - CV008
      - CV009
      - CV011
      - CV013
  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Side
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis
        - ADC licensing offers external validation and potential economics.
        - The reported LCB84/J&J deal includes a $100 million upfront payment; additional option-linked proceeds remain conditional.
        - Verify actual milestone and royalty receipts and whether J&J exercises the remaining option.
      - - Thesis
        - LigaChem is advancing an internal ADC program alongside partner assets.
        - Chosun reported first patient dosing in the global Phase 1/2 LCB02A trial on 2026-10-16.
        - Review dose-escalation safety, response data, enrollment, and trial timing; first dosing alone is not clinical validation.
      - - Anti-thesis
        - Operating losses and the quarter-end cash decline make execution capital-intensive.
        - BizHankook reported 2025 operating and net losses and lower cash and cash equivalents at 2026 Q1 end.
        - Reconcile audited cash flow, restricted cash, committed spend, and runway by program.
      - - Anti-thesis
        - Taking sole control of LNCB74 adds strategic flexibility but transfers obligations and execution risk.
        - Reports describe milestone and royalty payments to NextCure as well as LigaChem's sole development role.
        - Confirm the complete contract, funding plan, regulatory transfer, and decision rights.
    notes: >-
      Qualitative synthesis of reported facts; the payment and clinical
      milestones are conditional or unreported where noted, and no row implies
      a guaranteed commercial outcome.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger and diligence threshold
    rows:
      - - Bull
        - LCB84 progresses with J&J; an option is exercised; internal trials produce credible safety and efficacy evidence; partner cash receipts become observable.
        - "Numeric range withheld: no date-matched market capitalization, fully diluted share count, probability-weighted cash flows, or comparable multiple is available in the assigned evidence."
        - Upside is conditional and presently low-confidence; not a numeric probability.
        - Reduce the case if trial safety or efficacy disappoints, partner development stalls, or option-linked receipts do not materialize.
      - - Base
        - Clinical programs advance without proven efficacy; option and milestone timing remain uncertain; development spend continues.
        - "Numeric range withheld: reported revenue and losses do not supply a current forward revenue base or a risk-adjusted pipeline model."
        - Use as a planning case, not an estimated likelihood or expected return.
        - Reassess against dated cash, committed spend, actual partner receipts, clinical milestones, and fully diluted capitalization.
      - - Bear
        - Clinical delay or failure coincides with continued losses, capital needs, and dilution or preference overhang.
        - "Numeric downside range withheld: current equity value, net debt, share count, and security conversion terms are not reconciled."
        - Material downside is plausible; the available sources do not support a percentage probability.
        - Trigger review on safety signals, enrollment or regulatory delay, reduced partner commitment, cash runway deterioration, or adverse conversion terms.
    notes: >-
      These are directional assumptions, not forecasts. Numeric valuation ranges
      and probability estimates are intentionally omitted because the retained
      evidence lacks consistent, dated market, capitalization, clinical
      probability, and cash-flow inputs.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
      - CV013
