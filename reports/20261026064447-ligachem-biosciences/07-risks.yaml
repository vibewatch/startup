figures:
  - id: FR001
    title: Evidence-weighted risk heatmap
    type: matrix
    summary: "Qualitative impact and residual exposure are highest for clinical outcomes and partner continuity; unknown operating controls remain un-cleared rather than being scored as safe."
    data:
      columns:
        - label: Impact
          detail: Potential effect on value or execution if the risk materializes.
        - label: Likelihood
          detail: Directional assessment only; no calibrated probabilities are available.
        - label: Mitigation maturity
          detail: Publicly evidenced controls, not management intent alone.
        - label: Residual exposure
          detail: Analyst assessment after the limited visible mitigation.
      rows:
        - label: Partner continuity
          values:
            - value: High
              detail: A reported partner strategy shift changed the LNCB74 arrangement.
            - value: Medium
              detail: The event demonstrates possibility, not a measured recurrence rate.
            - value: Partial
              detail: Sole decision authority was obtained for LNCB74 only.
            - value: High
              detail: Portfolio-wide contract protections and counterparty concentration are unknown.
        - label: Clinical progression
          values:
            - value: High
              detail: Failure or delay can defer milestones and royalties.
            - value: Medium
              detail: Clinical programs remain exposed to uncertain outcomes; no failure is asserted.
            - value: Partial
              detail: Programs and stages are listed, but trial-level controls are not.
            - value: High
              detail: No program-level probabilities or contingency evidence were prefetched.
        - label: CMC and manufacturing
          values:
            - value: High
              detail: A quality or supply shortfall could interrupt trials or launch readiness.
            - value: Unknown
              detail: The assigned pool contains no operational metrics to estimate likelihood.
            - value: Unknown
              detail: Capacity, release, and supplier controls are undocumented in this evidence set.
            - value: High
              detail: Treat as unresolved pending an audited CMC package.
        - label: Liquidity and financing
          values:
            - value: High
              detail: Development spend can precede contingent receipts.
            - value: Medium
              detail: Reports show cash use and losses, alongside later cash and financing indicators.
            - value: Partial
              detail: Published metrics exist, but dated cash and spend do not reconcile to a runway.
            - value: Medium-high
              detail: Require current unrestricted cash, instrument terms, and asset-level forecasts.
        - label: Milestone visibility
          values:
            - value: High
              detail: Milestone and royalty receipts are contingent on partner progress and commercialization.
            - value: Medium
              detail: A payment was reported after first patient dosing, but future timing is uncertain.
            - value: Partial
              detail: The reported payment milestone was confirmed, while its exact amount remained confidential.
            - value: High
              detail: Program-level waterfalls and timing are unavailable.
        - label: Financing and dilution
          values:
            - value: High
              detail: Capital needs can affect ownership and runway.
            - value: Medium
              detail: Stockopedia lists financing notices, but full terms are not on the page.
            - value: Partial
              detail: Public notices exist; proceeds and fully diluted effects remain unresolved.
            - value: Medium-high
              detail: Obtain filed terms and a cash-to-clinical-budget reconciliation.
    claimRefs:
      - CR003
      - CR004
      - CR005
      - CR006
      - CR007
      - CR008
      - CR009
      - CR012
      - CR014
      - CR015
      - CR016
