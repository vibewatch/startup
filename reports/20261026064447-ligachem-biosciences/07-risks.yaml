company:
  name: LigaChem Biosciences
chapter:
  number: 7
  title: Risks
  summary: LigaChem's clearest exposures are partner-controlled asset economics, clinical-development uncertainty, and milestone-driven financial volatility. A partner's strategic shift has already changed an ADC co-development arrangement, while current market data and earlier reporting show that liquidity and losses must be reconciled by reporting date; public evidence does not establish current freedom-to-operate, regulatory compliance, or manufacturing readiness.
sections:
  - id: legal-and-regulatory
    title: Contractual, legal, and regulatory exposure
    body: >-
      The strongest evidenced legal/contractual risk is counterparty continuity rather than a reported dispute. After NextCure shifted its business direction following a merger, the LNCB74 collaboration terms changed and LigaChem obtained sole decision authority; the revised economics include milestone and royalty obligations to NextCure. This demonstrates that partner strategy can change who controls development and bears cost, but the available report does not establish that the change involved a breach or litigation. The assigned sources do not provide a current patent-office landscape, freedom-to-operate opinion, regulator inspection history, or complete trial authorization records. These are evidence gaps, not evidence that a dispute, compliance failure, or safety event exists. Obtain counsel-reviewed contract and patent diligence and regulator records before treating these exposures as cleared.
    claimRefs:
      - CR003
      - CR012
      - CR014
    tableRefs:
      - TR001
  - id: clinical-and-operational
    title: Clinical execution, quality, and operational risk
    body: >-
      The portfolio remains exposed to the ordinary but consequential uncertainty of clinical development: early-stage progress does not establish safety, efficacy, approval, or commercial supply. A third-party pipeline database lists multiple ADC programs and identifies LCB-84 as Phase 1/2, while the company profile describes LigaChem as clinical-stage. The source pool contains no trial-level adverse-event, enrollment, CMC validation, manufacturing-capacity, or product-quality records sufficient to assess those controls. Treat trial failure or delay as a high-impact exposure, but do not infer a current failure or quality defect. Diligence should track protocol milestones, enrollment and safety updates, comparability and release metrics, qualified manufacturing capacity, and contingency plans; a material safety signal, repeated timeline reset, or unresolved CMC deficiency should pause incremental risk-taking.
    claimRefs:
      - CR001
      - CR006
      - CR016
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: financial-and-capital
    title: Financial resilience and capital needs
    body: >-
      Cash and earnings indicators are period-sensitive and should not be collapsed into a single runway estimate. Yahoo Finance's late-October snapshot reports KRW 383.86 billion of cash, 0.59% total debt/equity, negative TTM net income, and negative levered free cash flow. BizHanKook's earlier report instead describes cash declining from KRW 98.6 billion at 2025 year-end to KRW 63.5 billion at 2026 Q1-end, alongside Q1 operating and net losses and KRW 46.4 billion of outsourced R&D costs. Those snapshots are not necessarily contradictory: the earlier report also describes a subsequent financing effort, while the newer cash figure has a different as-of period. They do not prove current distress or a durable runway. Reconcile audited cash, restricted balances, financing proceeds, asset-level spend, and quarterly burn before relying on any runway claim.
    claimRefs:
      - CR004
      - CR005
      - CR008
      - CR009
      - CR010
      - CR015
  - id: partner-dependencies
    title: Partner dependence and thesis-break monitoring
    body: >-
      Licensing can shift late-stage trial and commercialization costs to partners, but it also leaves LigaChem dependent on counterparties' priorities, execution, and contractual options. The LNCB74 change illustrates this control risk; the LCB97 report provides a separate example of a partner-triggered milestone whose exact amount was confidential and whose payment was expected after invoicing. The source pool does not quantify partner-level revenue concentration, milestone timing by program, or royalty-conversion history, so the degree of portfolio diversification remains unknown despite multiple programs. Track partner trial progression, option exercises, termination notices, milestone receipts, and concentration by counterparty. A partner withdrawal from a lead program, repeated deferral of clinical milestones, or evidence that one counterparty dominates expected receipts should trigger a downside re-underwrite rather than be offset by unverified pipeline breadth.
    claimRefs:
      - CR007
      - CR011
      - CR013
      - CR014
    tableRefs:
      - TR003
