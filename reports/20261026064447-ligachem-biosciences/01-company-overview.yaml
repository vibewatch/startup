company:
  name: LigaChem Biosciences
chapter:
  number: 1
  title: Company Overview
  summary: LigaChem Biosciences is a KOSDAQ-listed ADC developer whose historic licensing platform is being supplemented by selective in-house clinical development. Public reporting documents recent clinical and financing milestones, but the assigned evidence does not establish a full leadership roster, current valuation, revenue, headcount, or post-financing cash and runway.
sections:
  - id: identity-and-model
    title: Identity, platform, and operating model
    body: >-
      LigaChem Biosciences is identified in recent reporting as a South Korean
      KOSDAQ-listed biotechnology company (141080), with its headquarters
      reported in Daejeon. The assigned evidence describes a clinical-stage
      business organized around antibody-drug conjugate (ADC) discovery,
      platform licensing, and a growing option to advance selected assets
      itself. ChosunBiz describes a shift away from relying only on early
      licensing toward internal antibody design and later-stage development;
      a separate financing report says licensing remains alongside that
      approach. These are complementary choices, not evidence that late-stage
      trials have already generated commercial revenue. The available sources
      do not establish a founding date, a complete corporate profile, or a
      current audited scale baseline, so those items remain explicit diligence
      gaps rather than inferred facts.
    claimRefs: [CO001, CO002, CO003]
    tableRefs: [TO001]
  - id: partnered-pipeline-and-milestones
    title: Partnered pipeline and dated execution
    body: >-
      Public updates show a mixture of licensed and company-directed programs.
      In June 2026, a securities analyst described LCB84 as being in a global
      Phase 1 trial and discussed a possible later option exercise by Janssen;
      that payment was prospective, not cash already received. At the July
      2026 R&D event, the company reported clinical progress across partner
      assets, including LCB97 with Ono, SOT106 with SOTIO, IKS014 with Iksuda,
      and CS5001 with CStone. Separate reports describe LigaChem taking sole
      development decision rights for LNCB74 after NextCure changed its
      oncology strategy, and reporting first-patient dosing for in-house
      LCB02A in October. These milestones establish activity, not clinical
      efficacy or approval; the timeline distinguishes completed events from
      forecasts and reported company plans.
    claimRefs: [CO004, CO005, CO006, CO007, CO008, CO016]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: financing-and-scale
    title: Financing, cash visibility, and scale gaps
    body: >-
      June 2026 reporting described a KRW 500 billion financing comprising
      convertible preferred shares and convertible bonds, with the Korea
      Development Bank and Pan Orion among the named participants. That
      financing is not interchangeable with cash currently available: a
      separate report placed cash, time deposits, and repurchase agreements at
      approximately KRW 443.7 billion at the end of the first quarter of 2026,
      before the later financing and subsequent uses. The two reports translate
      the KRW 500 billion financing into different U.S.-dollar amounts, so the
      KRW denomination is the reliable common measure here. No assigned source
      provides a current valuation, revenue or run-rate, total historical
      capital raised, employee count, customer count, or a post-financing
      runway calculation. Those unsupported metrics are left unquantified.
    claimRefs: [CO009, CO010, CO011, CO012]
  - id: leadership-and-governance
    title: Leadership coverage and execution risk
    body: >-
      The available reporting identifies Park Se-jin as CEO in August and
      October 2026 coverage and identifies Kim Yong-ju as chair at the July
      2026 R&D event; an earlier company announcement described Kim as CEO.
      This time-stamped evidence is not a complete executive or board roster
      and does not establish founder backgrounds, board composition, succession
      arrangements, or key-person dependence. The company has publicly
      described ambitious pipeline expansion and an increased willingness to
      fund later-stage trials, making capital allocation and clinical execution
      important diligence questions. An independent blog author also questioned
      whether Orion can produce tangible biotech synergies and whether its
      capital-allocation culture fits high-risk drug development. That is a
      reported concern, not proof of failed integration; governance records
      and asset-level budgets are needed to resolve it.
    claimRefs: [CO013, CO014, CO015]
    tableRefs: [TO002]
