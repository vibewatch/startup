  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: identity
      missingEvidence: >-
        A current corporate registry extract and official company profile
        confirming founding date, registered headquarters, founders, and
        current board composition.
      whyItMatters: >-
        The assigned reports support a listing and reported Daejeon
        headquarters but do not establish founding history or a full
        governance baseline for later chapters to reuse.
      diligencePath: >-
        Obtain the current company registry and latest annual report, then
        reconcile legal entity, founding date, headquarters, founder roles,
        and board appointments.
      relatedQuestionRefs: [QO001]
    - type: private-evidence-only
      severity: material
      topic: company-scale
      missingEvidence: >-
        Current-period revenue and run-rate, total historical capital raised,
        valuation, headcount, customer or active-partner count, and cash and
        runway after the June financing and subsequent deployment.
      whyItMatters: >-
        These private-company and time-sensitive measures affect scale,
        dilution, liquidity, concentration, and valuation, and the Q1 cash
        figure predates the financing and later uses.
      diligencePath: >-
        Reconcile the latest audited and interim filings, cap table,
        financing close documents, current bank balances, quarterly burn,
        and asset-level operating budgets with management.
      relatedQuestionRefs: [QO004, QO008]
    - type: conflicting-data
      severity: minor
      topic: financing-usd-conversion
      missingEvidence: >-
        The exchange-rate basis and measurement date used to translate KRW
        500 billion into U.S. dollars in the two cited financing reports.
      whyItMatters: >-
        The reports give different dollar equivalents for the same stated
        KRW amount, so combining them would imply false precision.
      diligencePath: >-
        Use the underlying financing disclosure's KRW amount and document a
        single dated FX conversion only if a dollar equivalent is needed.
      relatedQuestionRefs: [QO004]
    - type: enumeration-incomplete
      severity: material
      topic: leadership
      missingEvidence: >-
        A complete, current executive and board roster with biographies,
        founder history, committee responsibilities, succession coverage, and
        key-person dependencies.
      whyItMatters: >-
        Selected news-event titles do not establish the full governance
        structure or whether execution depends on a small number of leaders.
      diligencePath: >-
        Review the latest annual report, board biographies, committee
        charters, and management succession disclosures.
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: minor
      topic: stakeholder-map
      missingEvidence: >-
        A complete list of active licensees, co-development partners,
        counterparties, deal economics, and current asset-level responsibilities.
      whyItMatters: >-
        The stakeholder table is a selected sample of named relationships,
        not a complete partner roster or measure of revenue concentration.
      diligencePath: >-
        Reconcile the current pipeline and licensing schedule against
        executed agreements, milestone schedules, and partner-level revenue.
      relatedQuestionRefs: [QO006, QO008]
      relatedTableRefs: [TO003]
