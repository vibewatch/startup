company:
  name: LigaChem Biosciences
chapter:
  number: 4
  title: Financials
  summary: >-
    Public reporting shows a partnership-led ADC licensing model alongside rising losses and a 2026 financing package
    intended for later-stage clinical work. License milestones can produce episodic revenue, but disclosed cash,
    accounting losses, and contractual ceilings do not establish current cash runway, recurring revenue, or asset-level
    economics.
sections:
  - id: monetization-model
    title: Licensing monetizes pipeline progress, not recurring software revenue
    body: >-
      LigaChem describes a clinical-stage therapeutics business spanning ADCs, small molecules, and worldwide
      partnerships; the public sources reviewed do not disclose a recurring subscription or unit-based pricing schedule.
      Available deal reporting instead supports a mix of upfront consideration, development and regulatory milestones,
      and post-launch royalties, with timing contingent on partner and clinical progress. For LCB84, coverage reports a
      $100 million upfront payment within a deal valued at up to $1.7 billion, while the additional $200 million
      discussed by an analyst depended on a future option exercise. For LCB97, the trial-start milestone was
      confidential and a news outlet estimated its minimum from prior-year revenue. These deal ceilings and estimates
      are not recognized revenue or guaranteed cash receipts. The first table separates the evidenced streams from terms
      and operating metrics that remain private.
    claimRefs:
      - CI008
      - CI005
      - CI009
      - CI010
      - CI015
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: reported-financial-performance
    title: Reported losses make revenue quality and cash conversion central
    body: >-
      BizHankook reported 2025 consolidated revenue of KRW 141.6 billion, operating loss of KRW 106.5 billion, and net
      loss of KRW 91.6 billion; Seoul Economic Daily gave the underlying revenue figure as KRW 141.55307 billion. The
      same BizHankook report put first-quarter 2026 revenue at KRW 35.9 billion, operating loss at KRW 37.4 billion, and
      net loss at KRW 33.3 billion. These are reported accounting results, not a cash-burn calculation. The source also
      described cash and cash equivalents falling from KRW 98.6 billion at 2025 year-end to KRW 63.5 billion at
      first-quarter end, and KRW 46.4 billion of first-quarter outsourcing costs related to new-drug R&D. Neither a
      single-quarter loss nor one cost line establishes total operating cash use, asset-level cost, or runway.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
    tableRefs:
      - TI003
  - id: capital-adequacy
    title: New financing expands the stated development envelope, not verified runway
    body: >-
      June coverage described a KRW 500 billion financing package, but differs in how it characterizes completion and
      the instrument and investor mix. WOWTALE called it a raised direct investment and reported KRW 170 billion of
      convertible bonds plus KRW 330 billion of convertible preferred shares; BizHankook described a KRW 500 billion
      fundraising effort and a different allocation among policy funds, the controlling shareholder, development bank,
      and institutions. The stated use was R&D and clinical development, including building capacity for Phase 2 and
      Phase 3 trials. This is financing raised or arranged, not proof of cash currently available: conversion terms,
      timing of proceeds, restrictions, current balance, and planned asset-level commitments need reconciliation.
      Independent reporting also described late-stage trials and independent development as increasing funding pressure;
      no precise cash runway can be inferred from the disclosed accounting losses.
    claimRefs:
      - CI004
      - CI005
      - CI006
      - CI005
      - CI011
      - CI012
  - id: underwriting-gaps
    title: Underwriting remains blocked by private contract and cost data
    body: >-
      The public record is useful for identifying the revenue mechanism and selected milestone events, but not for
      estimating repeatability or contribution margin. Ono's LCB97 payment amount was confidential, with the reported
      minimum an outside estimate; the LCB84 deal ceiling includes future contingencies, and reported royalties begin
      only after launch. LigaChem's transfer of sole LNCB74 decision-making rights also leaves it responsible for
      development choices and contingent milestone and royalty payments to NextCure. Meanwhile, the company is advancing
      an in-house clinical candidate, which adds a distinct cost-bearing path. There is no cited product-level revenue
      mix, realized royalty rate, gross margin, program budget, working-capital schedule, or reconciled post-financing
      cash-and-burn bridge. The diligence priority is to obtain partner-level revenue and recognition schedules,
      asset-level spend, and a current treasury forecast before underwriting runway or margin expansion.
    claimRefs:
      - CI007
      - CI008
      - CI005
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
tables:
  - id: TI001
    title: Revenue streams evidenced in public sources
    columns:
      - Stream
      - Mechanism
      - Current value or status
      - Revenue-quality implication
      - Diligence ask
    rows:
      - - Upfront licensing
        - Partner pays at rights transfer or agreement execution
        - LCB84 reported $100 million upfront; terms differ by asset
        - Contract-specific and non-recurring; do not annualize as ARR
        - Obtain executed agreements and recognition schedules
      - - Development milestones
        - Payments depend on clinical or other contractual events
        - LCB97 trial-start payment amount confidential; article estimates at least KRW 14.1 billion
        - Lumpy and contingent; invoice and expected receipt are not confirmation of cash
        - Reconcile trigger, invoice, collection date, and accounting treatment
      - - Royalties
        - Post-launch share of partner product sales
        - Reported for LCB97 and LNCB74; rates and launch timing not disclosed
        - Potentially recurring only after commercialization; not current sales
        - Request royalty rates, sales forecasts, deductions, and audit rights
      - - In-house development
        - Company advances selected assets through clinical trials
        - LCB02A first-patient dosing reported in October 2026; no product revenue reported in the cited article
        - Consumes capital before any commercial revenue; outcome and timing uncertain
        - Request asset-level budgets and stage-gate funding plan
    notes: >-
      Deal terms and figures are attributed to the cited sources; maximum deal values and estimated or contingent
      milestone amounts are not recognized revenue, cash available, or guaranteed receipts.
    claimRefs:
      - CI007
      - CI008
      - CI005
      - CI009
      - CI010
      - CI011
      - CI012
  - id: TI002
    title: Selected licensing and monetization terms
    columns:
      - Asset or program
      - Counterparty and mechanism
      - Disclosed economics
      - Status and uncertainty
      - Underwriting implication
    rows:
      - - LCB84
        - Johnson & Johnson; global TROP2 ADC license
        - >-
          Reported deal up to $1.7 billion, including $100 million upfront; a further $200 million was described as
          dependent on option exercise
        - Analyst coverage; future option and milestones are contingent
        - Do not treat the ceiling or prospective option as booked or received revenue
      - - LCB97
        - Ono Pharmaceutical; global development and commercialization rights
        - Reported deal up to $700 million, including upfront and milestones, plus royalties after launch
        - Exact first-patient-dosing milestone amount confidential; estimated by the outlet
        - Request payment history and full milestone/royalty schedule
      - - LNCB74
        - NextCure; converted co-development arrangement
        - LigaChem gained sole decision authority and owes milestones and royalties tied to commercialization results
        - Specific terms and future development spending not disclosed
        - Confirm remaining obligations and cost-sharing changes
      - - New antibody-target agreements
        - Novarock; global exclusive development and commercialization rights
        - Financial terms undisclosed for business confidentiality
        - Company announcement carried by BusinessKorea
        - Obtain upfront, milestone, royalty, and development-cost terms
    notes: >-
      Reported deal ceilings, options, and confidential or undisclosed terms are not comparable to current-period
      revenue; verify signed contracts and recognition under the applicable accounting policy.
    claimRefs:
      - CI007
      - CI008
      - CI005
      - CI009
      - CI010
      - CI015
  - id: TI003
    title: Reported financial indicators and underwriting gaps
    columns:
      - Metric
      - Reported value or status
      - Period and basis
      - Confidence
      - Diligence request
    rows:
      - - Consolidated revenue
        - KRW 141.55307 billion; another outlet rounds to KRW 141.6 billion
        - FY2025
        - Third-party reporting; rounded figures align
        - Obtain audited statements and revenue breakdown by partner and recognition type
      - - Operating loss
        - KRW 106.5 billion
        - FY2025
        - Third-party reported
        - Reconcile operating loss to cash flow and non-cash items
      - - Net loss
        - KRW 91.6 billion
        - FY2025
        - Third-party reported
        - Reconcile to audited income statement
      - - Revenue / operating loss / net loss
        - KRW 35.9 billion / KRW 37.4 billion / KRW 33.3 billion
        - Q1 2026
        - Third-party reported
        - Obtain subsequent quarter financials and cash-flow statement
      - - Cash and cash equivalents
        - KRW 98.6 billion at 2025 year-end; KRW 63.5 billion at Q1 2026 end
        - Reported balance-sheet dates
        - Third-party reported; post-quarter funding not reconciled
        - Reconcile subsequent financing proceeds and current restricted/unrestricted cash
      - - New-drug R&D outsourcing costs
        - KRW 46.4 billion
        - Q1 2026
        - Third-party reported; not total R&D or total cash burn
        - Break out CRO, CMO, trial, and asset-level spend
      - - Cash burn and runway
        - null
        - Current post-financing period
        - Unavailable in assigned public evidence
        - Request monthly cash-flow bridge, committed liabilities, and runway scenarios
      - - Gross margin and asset-level economics
        - null
        - Current portfolio
        - Unavailable in assigned public evidence
        - Request royalty contribution, direct costs, and program-level budgets
    notes: >-
      Losses are accounting measures, not cash burn. Figures preserve the reporting period and basis; null means no
      supported value was found in the assigned evidence, not zero.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI012
      - CI013
figures:
  - id: FI001
    title: Conditional path from pipeline work to licensing revenue
    type: flow
    summary: >-
      Licensing can convert selected development events into upfront, milestone, and post-launch royalty receipts, while
      self-advancement consumes capital before commercialization.
    data:
      nodes:
        - id: discovery
          label: Pipeline development
          detail: LigaChem and collaborators generate ADC candidates; development stage and program ownership vary.
        - id: licensing
          label: Rights transfer
          detail: Selected programs are licensed to partners; terms and cost sharing are asset-specific.
        - id: upfront
          label: Upfront payment
          detail: Some agreements report an upfront amount, including LCB84; no recurring revenue is implied.
        - id: milestones
          label: Development milestones
          detail: Payments depend on contract-defined events; LCB97's trial-start amount was confidential.
        - id: commercialization
          label: Partner commercialization
          detail: Commercial sales depend on development, approval, and launch; no sales are assumed.
        - id: royalties
          label: Post-launch royalties
          detail: Reported for selected deals, but rates and realized royalty revenue are not disclosed.
        - id: internal
          label: Selective in-house trials
          detail: Self-advancement creates clinical-development spend before any potential commercial receipts.
      edges:
        - from: discovery
          to: licensing
          label: Selected candidates
        - from: licensing
          to: upfront
          label: If agreement includes upfront
        - from: licensing
          to: milestones
          label: If event triggers payment
        - from: milestones
          to: commercialization
          label: Subject to further development and approval
        - from: commercialization
          to: royalties
          label: If product launches
        - from: discovery
          to: internal
          label: "Alternative: self-advance selected assets"
    claimRefs:
      - CI007
      - CI008
      - CI005
      - CI009
      - CI010
      - CI011
callouts:
