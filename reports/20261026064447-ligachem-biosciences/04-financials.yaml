    title: Runway is not established by the financing headline
    body: >-
      The KRW 500 billion package is a financing event, while the cited cash balances predate or do not reconcile
      post-financing proceeds; losses and one R&D cost line cannot substitute for an updated cash-flow forecast.
    claimRefs:
