artifact: customers
slug: ligachem-biosciences
runDate: 2026-10-26
company:
  name: LigaChem Biosciences
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence identifies pharma licensees, antibody-technology partners,
    a manufacturing collaborator, and several partner-led clinical programs, but
    does not establish a recurring customer base, retention, or commercial
    product use. A live Phase 1 registry record and an Ono milestone triggered
    by first-patient dosing are concrete development-stage signals, not proof
    of product sales or durable customer economics.
sections:
  - id: partner-model
    title: Partner-led model and customer segments
    body: >-
      The disclosed commercial surface is predominantly business-to-business
      partnering rather than a directly served end-user base. The sources identify
      global licensees, an antibody technology provider, a co-development
      counterparty, and a contract-manufacturing collaboration; those roles have
      different economics and should not be counted as interchangeable customers.
      J&J and Ono are associated with licensed assets, while NovaRock supplied
      antibody technology and Samsung Biologics was described as a manufacturing
      collaborator. The public materials reviewed do not reconcile counterparties
      to recognized revenue, contract duration, or active commercial products.
      A news report also described Orion's strategic investment and said Orion
      had no further investment planned at that time; this is shareholder
      support, not customer demand. (CU001, CU003, CU005, CU007, CU012,
      CU014, CU015)
    claimRefs: [CU001, CU003, CU005, CU007, CU012, CU014, CU015]
    tableRefs: [TU001]
  - id: adoption-evidence
    title: Adoption is visible as pipeline progress, not recurring use
    body: >-
      The strongest adoption indicators in this evidence set are partner-led
      clinical progression and a milestone linked to patient dosing. ClinicalTrials.gov
      listed the LNCB74 study as recruiting in Phase 1 at its August 2026 update,
      with estimated enrollment of 145; the registry names NextCure as sponsor
      and LigaChem as collaborator. Separately, a July report said an Ono
      milestone was triggered by first-patient dosing of LCB97, but the payment
      amount was confidential and the article's KRW 14.1 billion minimum was an
      estimate. These are meaningful development and contract-conversion signals,
      yet neither confirms launch, realized royalties, repeat purchasing, or
      patient outcomes. The July plan for LCB02A to enter Phase 1 in Q3 2026
      remains a dated plan in the available evidence, not a verified enrollment
      event. (CU006, CU008, CU009, CU010, CU011, CU013, CU015)
    claimRefs: [CU006, CU008, CU009, CU010, CU011, CU013, CU015]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: named-proof-and-gaps
    title: Named partner proof and durability gaps
    body: >-
      Named relationships provide proof of counterparties and contractual
      activity, but the evidence is uneven in independence and maturity. The
      NovaRock antibody agreements appear in two company-announcement reports,
      so those articles are not independent confirmation of the same transaction;
      their target identities and financial terms were withheld. The LNCB74
      relationship has stronger external triangulation because a public trial
      record complements reporting on the rights transition. The reviewed sources
      do not disclose an active customer count, partner-level revenue
      concentration, renewals, retention, or repeat-use rates. Those gaps prevent
      a reliable durability or customer-concentration estimate; the available
      named-deal sample is not an exhaustive customer list. (CU001, CU002,
      CU010, CU011, CU012, CU016)
    claimRefs: [CU001, CU002, CU010, CU011, CU012, CU016]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer and partner segmentation
    columns:
      - Relationship segment
      - Named counterparty / asset
      - Disclosed role and commercial signal
      - Scale or durability evidence still missing
    rows:
      - ["Global licensee", "Johnson & Johnson / LCB84", "LigaChem licensed the asset; an analyst report described a $1.7 billion total deal and $100 million upfront payment.", "No current recognized revenue, renewal, launch, or realized royalty evidence in this source set."]
      - ["Global licensee", "Ono Pharmaceutical / LCB97", "Global development and commercialization rights were transferred; first-patient dosing triggered a milestone.", "Exact milestone is confidential; the reported minimum is an estimate, and no post-launch royalty is shown."]
      - ["Co-development counterparty", "NextCure / LNCB74", "After a partner business shift, LigaChem obtained sole development, manufacturing, and commercialization decision rights; a Phase 1 study remains registered.", "The record does not quantify shared economics, remaining obligations, or partner-level revenue."]
      - ["Antibody technology provider", "NovaRock Biotherapeutics", "Two antibody-technology introduction agreements provided global exclusive development and commercialization rights.", "Target identities and contract amounts were not disclosed; the two reports repeat the company announcement."]
      - ["Manufacturing collaborator", "Samsung Biologics", "A reported collaboration covered more than three ADC projects that year, following CDO and material-transfer agreements.", "No evidence here establishes completed manufacturing, production volume, fees, or a commercial product."]
    notes: >-
      Publicly described relationships only; deal values are not equivalent to
      recognized revenue, and the NovaRock reports cover the same company-issued
      announcement.
    claimRefs: [CU001, CU003, CU004, CU005, CU007, CU012, CU014, CU015]
  - id: TU002
    title: Customer-linked adoption and development trajectory
    columns:
      - Asset / metric
      - Publicly reported value or status
      - Evidence vintage
      - Confidence and implication
      - Missing denominator or next proof
    rows:
      - ["LCB84 / J&J", "Licensed in 2023; reported global Phase 1, with Phase 2 targeted within 2026.", "Analyst coverage dated 2026-06-23.", "Medium; partner development is a signal, while the Phase 2 timing was a target.", "Actual enrollment, option exercise, clinical outcomes, and realized milestones."]
      - ["LCB97 / Ono", "First-patient dosing triggered a milestone; reported minimum payment estimate was KRW 14.1 billion.", "News report dated 2026-07-09.", "Medium; milestone trigger is reported, but its exact value is confidential and the minimum is estimated.", "Exact payment, patient count, trial outcomes, launch, and royalty conversion."]
      - ["LNCB74 / NextCure", "Phase 1 study listed as recruiting; estimated enrollment 145.", "ClinicalTrials.gov record updated 2026-08-21.", "High for registry status and estimate; a study listing does not establish actual enrollment or efficacy.", "Actual enrollment, completion, response, retention, or commercial use."]
      - ["LCB02A", "Company report described preclinical efficacy and a planned 191-patient Phase 1 study, targeting first-patient dosing in Q3 2026.", "Company-attributed report dated 2026-07-21.", "Medium; this is a dated plan, not confirmation that dosing occurred.", "Updated study status, actual enrollment, results, and partner or payer."]
    notes: >-
      Values preserve each source's metric and status; estimated enrollment is
      not actual enrollment, and dated targets are not treated as completed
      events.
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Named relationship
      - Proof and relationship status
      - Evidence quality / limitation
    rows:
      - ["NextCure / LNCB74", "LigaChem's rights transition is reported; the Phase 1 record lists NextCure as lead sponsor and LigaChem as collaborator.", "Independent news plus a public trial registry; the study is recruiting, not a commercial deployment."]
      - ["Ono Pharmaceutical / LCB97", "License rights and a first-patient milestone are reported by two articles; the milestone's exact amount is confidential.", "Two reports support the relationship; the second article provides analyst context, not a filing-level payment amount."]
      - ["NovaRock Biotherapeutics", "Two antibody-technology introduction agreements are described in company-attributed reporting.", "Two publications repeat one company announcement; target identities and economics remain undisclosed."]
    notes: >-
      Partial, non-exhaustive sample of named public relationships; company
      announcements and repeated coverage do not establish independent
      corroboration, production, or retention.
    enumerationScope:
      coverage: partial
      basis: >-
        Three named relationships selected from public reports and a trial
        registry available through 2026-10-26; private or undisclosed deals are
        outside this sample.
    claimRefs: [CU001, CU002, CU008, CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Selected partner-to-clinical conversion signals
    type: journey-map
    summary: >-
      Illustrative relationship stages across different assets, not a single
      asset's linear development history; clinical activity is not commercial
      adoption.
    data:
      items:
        - label: Antibody access
          detail: NovaRock agreements granted global exclusive development and commercialization rights for two antibody targets.
          touchpoints: ["LigaChem", "NovaRock"]
        - label: Candidate creation
          detail: LigaChem described combining introduced antibody technology with its ADC platform; target identities and deal economics were not disclosed.
          touchpoints: ["LigaChem"]
        - label: Partner license
          detail: LCB84 was licensed to J&J and LCB97 to Ono; both are partner-led asset relationships.
          touchpoints: ["LigaChem", "Johnson & Johnson", "Ono Pharmaceutical"]
        - label: Clinical study
          detail: The LNCB74 Phase 1 registry record lists NextCure as sponsor and LigaChem as collaborator.
          touchpoints: ["NextCure", "LigaChem", "ClinicalTrials.gov"]
        - label: Patient-dosing milestone
          detail: A reported Ono milestone followed first-patient dosing of LCB97; the exact payment is confidential.
          touchpoints: ["Ono Pharmaceutical", "LigaChem"]
        - label: Royalty conversion
          detail: The article describes royalties after product launch, but the reviewed evidence does not establish a launch or royalty receipt.
          touchpoints: ["Ono Pharmaceutical", "LigaChem"]
    claimRefs: [CU001, CU003, CU007, CU011, CU015]
