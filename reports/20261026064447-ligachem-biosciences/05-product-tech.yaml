        - label: Antibody
          detail: TechTimes describes a human IgG1 antibody.
        - label: Conjugation
          detail: TechTimes reports engineered light-chain cysteine conjugation with DAR4.
        - label: Linker
          detail: A beta-glucuronidase-cleavable glucuronide linker is reported.
        - label: Payload
          detail: MMAE is the reported cytotoxic payload.
        - label: Intended cell effect
          detail: TechTimes describes tubulin disruption after payload release; patient benefit is not established.
    claimRefs: [CE003, CE004, CE007]
