  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: buyer-budget-ownership
      missingEvidence: Indication-level payer mix, net prices, reimbursement status, procurement authority, and budget ownership for commercial ADC medicines.
      whyItMatters: The reported hospital-pharmacy channel share does not reveal who pays or controls adoption, so addressable demand and purchasing friction cannot be assigned to a buyer.
      diligencePath: Obtain country- and indication-level reimbursement and net-price data, hospital procurement evidence, and interviews with oncology budget owners and clinicians.
      relatedQuestionRefs:
        - QM005
      relatedTableRefs:
        - TM003
    - type: conflicting-data
      severity: material
      topic: adc-market-size
      missingEvidence: Comparable publisher definitions, source data, geography, recognition basis, and forecast assumptions for the differing global ADC market estimates.
      whyItMatters: Grand View Research and The Business Research Company differ on 2025 market size and forecast trajectory; selecting or averaging one would create unsupported precision.
      diligencePath: Review the underlying full reports and reconcile product-sales versus factory-gate definitions, segment inclusions, base years, and forecast methods before building a consensus case.
      relatedQuestionRefs:
        - QM002
        - QM003
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: ligachem-sam-som
      missingEvidence: LigaChem-specific target- and indication-level eligible spend, asset rights, partner territories, royalty bases, clinical probabilities, and achievable share.
      whyItMatters: Global ADC drug sales are not LigaChem revenue; without asset rights and partner economics, neither serviceable market nor obtainable revenue can be isolated.
      diligencePath: Build an asset-by-asset rights and indication map from current contracts, then reconcile eligible patient populations, expected treatment pricing, partner commercialization scope, milestone schedules, and royalty terms.
      relatedQuestionRefs:
        - QM010
      relatedTableRefs:
        - TM002
        - TM003
