company:
  name: LigaChem Biosciences
chapter:
  number: 2
  title: Market Analysis
  summary: Published estimates place the global antibody-drug conjugate (ADC) therapeutics market in the mid-teens of billions of US dollars in 2025, but forecast levels and growth rates diverge materially by publisher. These broad drug-sales estimates do not isolate LigaChem's licensing opportunity; the most consequential gaps are payer economics, asset-specific rights, and a defensible SAM/SOM.
sections:
  - id: boundary-and-value-capture
    title: Market boundary and value capture
    body: >-
      The usable market boundary is commercial ADC medicine revenue, not every dollar associated with developing an ADC. Market-research pages segment the category by application, product, technology, payload, geography, and distribution channel, while The Business Research Company explicitly describes factory-gate values; those conventions should not be silently combined with downstream hospital spending. Licensing upfronts, development milestones, and royalties are a separate value-capture path for a platform developer, and dedicated ADC manufacturing is an adjacent supply market rather than a directly comparable drug-sales total (CM001, CM012, CM016). Seoul Economic Daily reported a move from licensing candidates toward more direct late-stage trials and commercialization, changing who would bear clinical and commercialization costs but not the definition of worldwide ADC drug sales (CM012). A separate reported rights change illustrates why asset-level scope and economics vary: LigaChem secured sole rights over LNCB74 after its partner shifted direction, while retaining milestone and royalty obligations (CM014, CM015). The boundary table therefore keeps therapeutic sales, licensing economics, manufacturing, and substitutes separate. None of the supplied market previews identifies an auditable LigaChem-specific market share.
    claimRefs:
      - CM001
      - CM012
      - CM014
      - CM015
      - CM016
    tableRefs:
      - TM001
  - id: published-sizing-lenses
    title: Published market estimates are not a single TAM
    body: >-
      Three publisher lenses establish a useful scale range but not a consensus forecast. Grand View Research reports a 2025 global market of $14.5 billion and projects $32.1 billion by 2033, with an 11.5% CAGR for 2026–2033; The Business Research Company reports $16.53 billion in 2025 and $46.95 billion in 2030, with a 23.3% CAGR for 2026–2030; Research and Markets previews $13.77 billion of incremental growth over 2025–2030 at a 15.7% CAGR, without disclosing base or ending market values in the preview (CM002–CM004). These estimates retain their own periods and definitions: no average is justified, and the incremental-growth figure is not a market-size starting point. As a directional composition lens, Grand View reports 2025 shares across applications, products, technologies, payloads, channels, and regions; those shares describe separate cuts of the same market and must not be summed (CM005–CM008). The bar chart displays selected shares as separate indicators, not as nested layers or a LigaChem SAM.
    claimRefs:
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: segments-and-buyers
    title: Segments, buyers, and adoption path
    body: >-
      The market is segmented by the therapy's commercial indication and product attributes, but the assigned evidence does not show who holds each treatment budget or how net prices are negotiated. Grand View identifies hospital pharmacy as the largest 2025 distribution channel at 52.8%; this is a channel share, not proof that hospitals are the ultimate payer or procurement decision-maker (CM008). The buyer map distinguishes commercial ADC distribution from upstream licensing and clinical development and labels budget ownership as unavailable where the sources do not specify it. On LigaChem's supply side, Seoul Economic Daily reported a 2026 ₩500 billion investment package alongside a strategic shift toward directly pursuing late-stage trials and commercialization; this is reported financing and strategy, not evidence of commercial product sales (CM012). Chosun reported first dosing in the company's in-house LCB02A global Phase 1/2 study, and Patsnap Synapse separately lists LCB-02A at Phase 1/2 (CM013). These development milestones show a path toward possible adoption, not approval, uptake, reimbursement, or realized demand.
    claimRefs:
      - CM008
      - CM011
      - CM012
      - CM013
    tableRefs:
      - TM003
  - id: drivers-constraints-and-diligence
    title: Adoption drivers, constraints, and unresolved sizing
    body: >-
      Publisher summaries identify cancer burden, precision-oncology adoption, biomarker-driven targets, and linker/payload innovation as demand drivers; they also flag high development and manufacturing costs, supply-chain complexity, off-target safety concerns, and regulatory requirements as constraints (CM009, CM010). These industry-level observations do not establish that LigaChem's platform will win a specific target or that broad market growth will convert into its revenue. The reported LNCB74 arrangement shows that rights, cost exposure, and potential proceeds are contract-specific: LigaChem gained sole decision-making authority after its partner changed direction, while milestone and royalty payments remain tied to commercialization (CM014, CM015). This case does not quantify market demand or a company-wide opportunity. The estimate dispersion, missing payer economics, and lack of asset-level addressable-spend data mean SAM and SOM remain unquantified. Diligence should obtain report-level definitions and underlying models, indication-specific treatment and reimbursement data, and partner contracts showing rights, milestones, royalties, and commercialization responsibilities before translating the global drug-sales market into LigaChem value.
    claimRefs:
      - CM009
      - CM010
      - CM011
      - CM014
      - CM015
tables:
  - id: TM001
    title: ADC market boundary and value capture
    columns:
      - Segment/category
      - Included spend
      - Excluded spend or adjacency
      - Buyer/payer evidence
      - Relevance to LigaChem
    rows:
      - - Commercial ADC medicines
        - Global ADC drug-sales estimates; publishers segment by product, application, technology, and geography.
        - Licensing fees and service revenue should not be assumed to be drug sales.
        - Hospital pharmacy is a reported channel; final budget owner and reimbursement split are not established.
        - Broad category context, not a company-specific addressable revenue pool.
      - - ADC licensing and development rights
        - Upfront, milestone, and royalty economics when a candidate or platform is licensed.
        - Excluded from published ADC medicine-sales estimates unless a publisher explicitly says otherwise.
        - Pharma/biotech counterparties are evidenced in reported licensing activity; contract-level value capture is incomplete.
        - A direct route to platform value, but not a proxy for commercial ADC product sales.
      - - ADC manufacturing and supply services
        - Adjacent capacity for specialized development and manufacturing.
        - Separate from therapeutic product sales; the supplied preview does not quantify this as a standalone market.
        - R&M identifies dedicated CDMO capacity as a growth driver, not a disclosed spend denominator.
        - Potential industry constraint and adjacent opportunity; LigaChem-specific participation is not established.
      - - Oncology substitutes and status quo
        - Other cancer treatments compete for clinical use and budgets.
        - Non-ADC therapies are outside the ADC-specific market totals.
        - Comparative payer budgets and treatment-line substitution rates are unavailable.
        - Necessary adoption context; no comparable substitute-spend figure is supported here.
    notes: >-
      Boundary is an evidence-based analytical convention, not a harmonized publisher definition. ADC medicine sales, licensing economics, and CDMO services are kept separate; buyer or payer details marked unavailable are not inferred from distribution-channel shares.
    claimRefs:
      - CM001
      - CM008
      - CM012
      - CM014
      - CM015
      - CM016
  - id: TM002
    title: Global ADC market sizing lenses
    columns:
      - Publisher
      - Year / geography
      - Reported value and period
      - CAGR
      - Methodology visible in assigned material
      - Confidence and limitation
    rows:
      - - Grand View Research
        - 2025 base; global
        - "$14.5B (2025); $16.7B (2026 estimate); $32.1B (2033 forecast)"
        - 11.5%, 2026–2033
        - Page cites company research, investor-relations documents, primary interviews, and paid databases; no detailed weighting is visible in the fetched summary.
        - Medium; preserve its forecast period and segmentation; not an estimate of LigaChem revenue.
      - - The Business Research Company
        - 2025 base; global
        - "$16.53B (2025); $20.28B (2026); $46.95B (2030 forecast)"
        - 22.7%, 2025–2026; 23.3%, 2026–2030
        - Preview defines factory-gate values and lists product, application, technology, and end-user segments; full model is not in the assigned text.
        - Medium; its definition and forecast differ from other publishers; no company-specific SAM.
      - - Research and Markets
        - Forecast 2025–2030; global
        - '$13.77B forecast market growth during 2025–2030; base and ending totals not supplied in preview.'
        - 15.7%, 2025–2030
        - Preview describes a report covering market sizing, segmentation, regional analysis, and vendor analysis; underlying model is not supplied.
        - Medium; incremental growth is not a market-size level and cannot be used as one.
    notes: >-
      USD billions. Values and periods are transcribed from the assigned publisher previews and are not harmonized. Do not average these estimates; the R&M figure is incremental growth, while its base and ending totals are unavailable in the preview.
    claimRefs:
      - CM002
      - CM003
      - CM004
