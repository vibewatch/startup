    title: "Segment and buyer map: evidence versus open budget questions"
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Commercial ADC medicines
        - Hospital pharmacy is a reported distribution channel; purchaser authority is unspecified.
        - Treatment users and clinicians are not quantified in the assigned market previews.
        - Not specified by the assigned sources.
        - Product distribution and use in oncology care.
        - Not established; channel share is not payer share.
        - Approved indication, clinical evidence, reimbursement, and access data are not isolated in the previews.
      - - ADC licensing / platform access
        - Pharma or biotech counterparties in reported licensing arrangements.
        - Licensee development and clinical teams; workflow detail is not provided.
        - Counterparty pays disclosed or undisclosed contract consideration.
        - Candidate/platform rights transfer, with potential milestone and royalty economics.
        - Contract-specific spending owner and amounts are not fully available.
        - Evidence, rights, target fit, and partner strategy; deal conversion is not guaranteed.
      - - Sponsored ADC clinical trials
        - Trial sponsor; site contracting and procurement details are unavailable.
        - Eligible patients and participating cancer centers in a specific reported trial.
        - Sponsor funding; payer coverage for trial participation is not established.
        - Clinical development before any commercial adoption.
        - Sponsor-specific trial budget is not disclosed in the assigned source.
        - Trial eligibility and clinical evidence; a first dose is not proof of efficacy or market uptake.
      - - ADC manufacturing / CDMO capacity
        - Not identified in the assigned sources.
        - Not identified in the assigned sources.
        - Not identified in the assigned sources.
        - Specialized manufacturing is identified as an adjacent industry driver.
        - No budget owner or spend is quantified.
        - Capacity, quality, safety, and supply requirements; company-specific role is unproven.
    notes: >-
      Partial evidence map, not an exhaustive enumeration. Market-report channel categories and reported company transactions do not establish payer identity, net prices, procurement budgets, or adoption rates; unavailable cells are explicit evidence gaps.
