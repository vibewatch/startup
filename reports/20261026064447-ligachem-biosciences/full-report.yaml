companyProfile:
  summary: >-
    LigaChem Biosciences is a South Korean, KOSDAQ-listed clinical-stage biotechnology company headquartered in Daejeon.
    Its ADC business combines licensing and partner-led development with selective in-house clinical advancement. Public
    reporting documents partnerships, an October 2026 first-patient dose for in-house LCB02A, and a reported KRW 500
    billion financing package; these milestones do not establish clinical efficacy, current runway, or repeatable cash
    conversion.
  productSummary: >-
    The company develops antibody-drug conjugate candidates and related platform technologies, licenses selected
    programs to pharmaceutical partners, and advances selected candidates in its own clinical trials.
  customerFocus: >-
    Pharmaceutical and biotechnology partners licensing or co-developing ADC candidates; clinical programs ultimately
    target oncology indications.
  businessModel: >-
    Partner agreements can generate upfront payments, development and regulatory milestones, and post-launch royalties;
    selected in-house clinical programs add direct development and funding obligations.
