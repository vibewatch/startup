      - number: '5.3'
        title: Partnering and manufacturing dependencies
        blocks:
          - type: paragraph
            body: >-
              The product model combines internal discovery with external development and manufacturing relationships.
              LigaChem obtained sole decision-making authority over LNCB74 after NextCure exited co-development, while
              NextCure retains potential milestone and royalty economics. A Samsung Biologics release says it will
              support a series of LigaChem ADC programs at its dedicated ADC facility; the announcement describes a
              500-liter reactor and services from late discovery through development and conjugation, but does not name
              which programs receive capacity. CStone holds global development and commercialization rights to CS5001
              outside Korea, according to The Pharma Letter. A 2026 report also describes eight global trials, including
              one Phase 3 breast-cancer trial, as a portfolio snapshot. Capacity allocation, process validation, lot
              quality, supply reliability, and the identity and status of that Phase 3 asset remain diligence items.
              (CE005, CE013, CE014, CE015, CE016)
            claimRefs:
              - CE005
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: What the evidence does not establish
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence is about candidate descriptions, trial design, and announced
              relationships—not clinical performance. The ClinicalTrials.gov record for LCB02A lists no study results
              and records no data monitoring committee; this is registry metadata, not proof that no other safety
              oversight exists. TechTimes itself notes that LNCB74's proposed linker and payload advantages still need
              to be demonstrated in patients. No assigned source provides comparative human outcomes, validated CMC
              release metrics, facility allocation or uptime, or freedom-to-operate analysis for ConjuALL. Nor does the
              assigned evidence establish a public developer surface or a practitioner-community proxy for this clinical
              biotech product. These are material gaps for assessing repeatable product performance, safety, and
              execution risk. (CE002, CE003, CE012, CE014, CE016)
            claimRefs:
              - CE002
              - CE003
              - CE012
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Partner-led model and customer segments
        blocks:
          - type: paragraph
            body: >-
              The disclosed commercial surface is predominantly business-to-business partnering rather than a directly
              served end-user base. The sources identify global licensees, an antibody technology provider, a
              co-development counterparty, and a contract-manufacturing collaboration; those roles have different
              economics and should not be counted as interchangeable customers. J&J and Ono are associated with licensed
              assets, while NovaRock supplied antibody technology and Samsung Biologics was described as a manufacturing
              collaborator. The public materials reviewed do not reconcile counterparties to recognized revenue,
              contract duration, or active commercial products. A news report also described Orion's strategic
              investment and said Orion had no further investment planned at that time; this is shareholder support, not
              customer demand. (CU001, CU003, CU005, CU007, CU012, CU014, CU015)
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU007
              - CU012
              - CU014
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
              - CU007
              - CU012
              - CU014
              - CU015
      - number: '6.2'
        title: Adoption is visible as pipeline progress, not recurring use
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption indicators in this evidence set are partner-led clinical progression and a
              milestone linked to patient dosing. ClinicalTrials.gov listed the LNCB74 study as recruiting in Phase 1 at
              its August 2026 update, with estimated enrollment of 145; the registry names NextCure as sponsor and
              LigaChem as collaborator. Separately, a July report said an Ono milestone was triggered by first-patient
              dosing of LCB97, but the payment amount was confidential and the article's KRW 14.1 billion minimum was an
              estimate. These are meaningful development and contract-conversion signals, yet neither confirms launch,
              realized royalties, repeat purchasing, or patient outcomes. The July plan for LCB02A to enter Phase 1 in
              Q3 2026 remains a dated plan in the available evidence, not a verified enrollment event. (CU006, CU008,
              CU009, CU010, CU011, CU013, CU015)
            claimRefs:
              - CU006
              - CU008
              - CU009
              - CU010
              - CU011
              - CU013
              - CU015
