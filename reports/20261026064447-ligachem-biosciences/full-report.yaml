        title: Reported losses make revenue quality and cash conversion central
        blocks:
          - type: paragraph
            body: >-
              BizHankook reported 2025 consolidated revenue of KRW 141.6 billion, operating loss of KRW 106.5 billion,
              and net loss of KRW 91.6 billion; Seoul Economic Daily gave the underlying revenue figure as KRW 141.55307
              billion. The same BizHankook report put first-quarter 2026 revenue at KRW 35.9 billion, operating loss at
              KRW 37.4 billion, and net loss at KRW 33.3 billion. These are reported accounting results, not a cash-burn
              calculation. The source also described cash and cash equivalents falling from KRW 98.6 billion at 2025
              year-end to KRW 63.5 billion at first-quarter end, and KRW 46.4 billion of first-quarter outsourcing costs
              related to new-drug R&D. Neither a single-quarter loss nor one cost line establishes total operating cash
              use, asset-level cost, or runway.
            claimRefs:
