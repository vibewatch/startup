            body: >-
              The disclosed portfolio spans targets and partner models rather than a single product workflow. LNCB74 is
              a Phase 1 B7-H4 program; LCB84 is a TROP2 ADC licensed to Johnson & Johnson and reported in global Phase
              1; LCB97 is a licensed L1CAM ADC reported to have entered global Phase 1; LCB02A is a CLDN18.2 ADC whose
              registry describes a Phase 1/2 study, with first-patient dosing reported on October 16, 2026. The registry
              lists an estimated enrollment of 191, not completed enrollment or a result. These stages show clinical
              activity, but the evidence does not establish response rates, durability, dose selection, or commercial
              readiness. Target-positive eligibility, trial progression, and any treatment benefit must therefore stay
              separate. (CE004, CE005, CE006, CE008, CE009, CE010, CE011, CE012)
