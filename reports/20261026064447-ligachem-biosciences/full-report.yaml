  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Platform and reported molecular design
        blocks:
          - type: paragraph
            body: >-
              LigaChem presents ConjuALL as a next-generation antibody-drug-conjugate platform and claims a higher
              therapeutic index, but its public technology page does not provide comparative data. TechTimes describes
              LNCB74 as a B7-H4-directed, MMAE-payload ADC using site-specific light-chain conjugation, a
              glucuronidase-cleavable linker, and an engineered DAR4 design; those details are reported design
              attributes, not independently verified clinical advantages. The architecture figure keeps the distinction
              visible: antigen recognition and controlled payload delivery are hypotheses to test in patients, not
              evidence of improved outcomes. The article says LNCB74 is in Phase 1, and the reported mechanism remains
              preclinical in this evidence set. (CE001, CE002, CE003, CE004)
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
