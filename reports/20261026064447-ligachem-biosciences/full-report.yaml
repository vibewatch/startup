              - CU003
              - CU007
              - CU011
              - CU015
      - number: '6.3'
        title: Named partner proof and durability gaps
        blocks:
          - type: paragraph
            body: >-
              Named relationships provide proof of counterparties and contractual activity, but the evidence is uneven
              in independence and maturity. The NovaRock antibody agreements appear in two company-announcement reports,
              so those articles are not independent confirmation of the same transaction; their target identities and
              financial terms were withheld. The LNCB74 relationship has stronger external triangulation because a
              public trial record complements reporting on the rights transition. The reviewed sources do not disclose
              an active customer count, partner-level revenue concentration, renewals, retention, or repeat-use rates.
              Those gaps prevent a reliable durability or customer-concentration estimate; the available named-deal
              sample is not an exhaustive customer list. (CU001, CU002, CU010, CU011, CU012, CU016)
            claimRefs:
              - CU001
              - CU002
              - CU010
