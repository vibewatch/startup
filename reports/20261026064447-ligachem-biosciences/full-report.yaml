        - unproven; price-sensitive
        - >-
          A third-party preview reports market capitalization and enterprise value without an explicit valuation date or
          revenue period.
        - No defensible fair-value range or target return from the assigned evidence.
    notes: >-
      Judgment uses reported figures with their stated periods and attribution; the scenario and valuation conclusions
      are not company guidance or a calculated target price.
    claimRefs:
      - CV002
      - CV008
      - CV009
      - CV011
