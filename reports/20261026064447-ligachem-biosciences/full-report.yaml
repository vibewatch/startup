  - id: FI001
    title: Conditional path from pipeline work to licensing revenue
    type: flow
    summary: >-
      Licensing can convert selected development events into upfront, milestone, and post-launch royalty receipts, while
      self-advancement consumes capital before commercialization.
    data:
      nodes:
        - id: discovery
          label: Pipeline development
          detail: LigaChem and collaborators generate ADC candidates; development stage and program ownership vary.
        - id: licensing
          label: Rights transfer
          detail: Selected programs are licensed to partners; terms and cost sharing are asset-specific.
        - id: upfront
          label: Upfront payment
          detail: Some agreements report an upfront amount, including LCB84; no recurring revenue is implied.
        - id: milestones
          label: Development milestones
          detail: Payments depend on contract-defined events; LCB97's trial-start amount was confidential.
        - id: commercialization
          label: Partner commercialization
          detail: Commercial sales depend on development, approval, and launch; no sales are assumed.
        - id: royalties
          label: Post-launch royalties
          detail: Reported for selected deals, but rates and realized royalty revenue are not disclosed.
        - id: internal
          label: Selective in-house trials
          detail: Self-advancement creates clinical-development spend before any potential commercial receipts.
      edges:
        - from: discovery
          to: licensing
          label: Selected candidates
        - from: licensing
          to: upfront
          label: If agreement includes upfront
        - from: licensing
          to: milestones
          label: If event triggers payment
        - from: milestones
          to: commercialization
          label: Subject to further development and approval
        - from: commercialization
          to: royalties
          label: If product launches
        - from: discovery
          to: internal
          label: 'Alternative: self-advance selected assets'
