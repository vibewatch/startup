              - CI006
              - CI012
              - CI013
      - number: '4.3'
        title: New financing expands the stated development envelope, not verified runway
        blocks:
          - type: paragraph
            body: >-
              June coverage described a KRW 500 billion financing package, but differs in how it characterizes
              completion and the instrument and investor mix. WOWTALE called it a raised direct investment and reported
              KRW 170 billion of convertible bonds plus KRW 330 billion of convertible preferred shares; BizHankook
              described a KRW 500 billion fundraising effort and a different allocation among policy funds, the
              controlling shareholder, development bank, and institutions. The stated use was R&D and clinical
              development, including building capacity for Phase 2 and Phase 3 trials. This is financing raised or
              arranged, not proof of cash currently available: conversion terms, timing of proceeds, restrictions,
              current balance, and planned asset-level commitments need reconciliation. Independent reporting also
              described late-stage trials and independent development as increasing funding pressure; no precise cash
              runway can be inferred from the disclosed accounting losses.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI005
              - CI011
              - CI012
      - number: '4.4'
        title: Underwriting remains blocked by private contract and cost data
        blocks:
          - type: paragraph
            body: >-
              The public record is useful for identifying the revenue mechanism and selected milestone events, but not
              for estimating repeatability or contribution margin. Ono's LCB97 payment amount was confidential, with the
              reported minimum an outside estimate; the LCB84 deal ceiling includes future contingencies, and reported
              royalties begin only after launch. LigaChem's transfer of sole LNCB74 decision-making rights also leaves
              it responsible for development choices and contingent milestone and royalty payments to NextCure.
              Meanwhile, the company is advancing an in-house clinical candidate, which adds a distinct cost-bearing
              path. There is no cited product-level revenue mix, realized royalty rate, gross margin, program budget,
              working-capital schedule, or reconciled post-financing cash-and-burn bridge. The diligence priority is to
              obtain partner-level revenue and recognition schedules, asset-level spend, and a current treasury forecast
              before underwriting runway or margin expansion.
            claimRefs:
              - CI007
              - CI008
              - CI005
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
