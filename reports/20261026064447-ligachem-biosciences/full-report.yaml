chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform, and operating model
        blocks:
          - type: paragraph
            body: >-
              LigaChem Biosciences is identified in recent reporting as a South Korean KOSDAQ-listed biotechnology
              company (141080), with its headquarters reported in Daejeon. The assigned evidence describes a
              clinical-stage business organized around antibody-drug conjugate (ADC) discovery, platform licensing, and
              a growing option to advance selected assets itself. ChosunBiz describes a shift away from relying only on
              early licensing toward internal antibody design and later-stage development; a separate financing report
              says licensing remains alongside that approach. These are complementary choices, not evidence that
              late-stage trials have already generated commercial revenue. The available sources do not establish a
              founding date, a complete corporate profile, or a current audited scale baseline, so those items remain
              explicit diligence gaps rather than inferred facts.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.2'
        title: Partnered pipeline and dated execution
        blocks:
          - type: paragraph
            body: >-
              Public updates show a mixture of licensed and company-directed programs. In June 2026, a securities
              analyst described LCB84 as being in a global Phase 1 trial and discussed a possible later option exercise
              by Janssen; that payment was prospective, not cash already received. At the July 2026 R&D event, the
              company reported clinical progress across partner assets, including LCB97 with Ono, SOT106 with SOTIO,
              IKS014 with Iksuda, and CS5001 with CStone. Separate reports describe LigaChem taking sole development
              decision rights for LNCB74 after NextCure changed its oncology strategy, and reporting first-patient
              dosing for in-house LCB02A in October. These milestones establish activity, not clinical efficacy or
              approval; the timeline distinguishes completed events from forecasts and reported company plans.
            claimRefs:
