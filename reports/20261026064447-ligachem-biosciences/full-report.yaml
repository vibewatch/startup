  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and value capture
        blocks:
          - type: paragraph
            body: >-
              The usable market boundary is commercial ADC medicine revenue, not every dollar associated with developing
              an ADC. Market-research pages segment the category by application, product, technology, payload,
              geography, and distribution channel, while The Business Research Company explicitly describes factory-gate
              values; those conventions should not be silently combined with downstream hospital spending. Licensing
              upfronts, development milestones, and royalties are a separate value-capture path for a platform
              developer, and dedicated ADC manufacturing is an adjacent supply market rather than a directly comparable
              drug-sales total (CM001, CM012, CM016). Seoul Economic Daily reported a move from licensing candidates
              toward more direct late-stage trials and commercialization, changing who would bear clinical and
              commercialization costs but not the definition of worldwide ADC drug sales (CM012). A separate reported
              rights change illustrates why asset-level scope and economics vary: LigaChem secured sole rights over
              LNCB74 after its partner shifted direction, while retaining milestone and royalty obligations (CM014,
              CM015). The boundary table therefore keeps therapeutic sales, licensing economics, manufacturing, and
              substitutes separate. None of the supplied market previews identifies an auditable LigaChem-specific
              market share.
            claimRefs:
              - CM001
              - CM012
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM012
              - CM014
              - CM015
              - CM016
      - number: '2.2'
        title: Published market estimates are not a single TAM
        blocks:
          - type: paragraph
            body: >-
              Three publisher lenses establish a useful scale range but not a consensus forecast. Grand View Research
              reports a 2025 global market of $14.5 billion and projects $32.1 billion by 2033, with an 11.5% CAGR for
              2026–2033; The Business Research Company reports $16.53 billion in 2025 and $46.95 billion in 2030, with a
              23.3% CAGR for 2026–2030; Research and Markets previews $13.77 billion of incremental growth over
              2025–2030 at a 15.7% CAGR, without disclosing base or ending market values in the preview (CM002–CM004).
              These estimates retain their own periods and definitions: no average is justified, and the
              incremental-growth figure is not a market-size starting point. As a directional composition lens, Grand
              View reports 2025 shares across applications, products, technologies, payloads, channels, and regions;
              those shares describe separate cuts of the same market and must not be summed (CM005–CM008). The bar chart
              displays selected shares as separate indicators, not as nested layers or a LigaChem SAM.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Segments, buyers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The market is segmented by the therapy's commercial indication and product attributes, but the assigned
              evidence does not show who holds each treatment budget or how net prices are negotiated. Grand View
              identifies hospital pharmacy as the largest 2025 distribution channel at 52.8%; this is a channel share,
              not proof that hospitals are the ultimate payer or procurement decision-maker (CM008). The buyer map
              distinguishes commercial ADC distribution from upstream licensing and clinical development and labels
              budget ownership as unavailable where the sources do not specify it. On LigaChem's supply side, Seoul
              Economic Daily reported a 2026 ₩500 billion investment package alongside a strategic shift toward directly
              pursuing late-stage trials and commercialization; this is reported financing and strategy, not evidence of
              commercial product sales (CM012). Chosun reported first dosing in the company's in-house LCB02A global
              Phase 1/2 study, and Patsnap Synapse separately lists LCB-02A at Phase 1/2 (CM013). These development
              milestones show a path toward possible adoption, not approval, uptake, reimbursement, or realized demand.
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.4'
        title: Adoption drivers, constraints, and unresolved sizing
        blocks:
          - type: paragraph
            body: >-
              Publisher summaries identify cancer burden, precision-oncology adoption, biomarker-driven targets, and
              linker/payload innovation as demand drivers; they also flag high development and manufacturing costs,
              supply-chain complexity, off-target safety concerns, and regulatory requirements as constraints (CM009,
              CM010). These industry-level observations do not establish that LigaChem's platform will win a specific
              target or that broad market growth will convert into its revenue. The reported LNCB74 arrangement shows
              that rights, cost exposure, and potential proceeds are contract-specific: LigaChem gained sole
              decision-making authority after its partner changed direction, while milestone and royalty payments remain
              tied to commercialization (CM014, CM015). This case does not quantify market demand or a company-wide
              opportunity. The estimate dispersion, missing payer economics, and lack of asset-level addressable-spend
              data mean SAM and SOM remain unquantified. Diligence should obtain report-level definitions and underlying
              models, indication-specific treatment and reimbursement data, and partner contracts showing rights,
              milestones, royalties, and commercialization responsibilities before translating the global drug-sales
              market into LigaChem value.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A crowded ADC field makes evidence stage the key comparison
        blocks:
          - type: paragraph
            body: >
              The relevant competitive set is not limited to other ADC platform companies: it includes approved
              target-specific therapies, partnered pipeline assets, and the standard-of-care regimen patients receive
              before or after progression. Grand View Research estimates the global ADC market at USD 14.5 billion in
              2025 and forecasts USD 32.1 billion by 2033 at an 11.5% CAGR from 2026 to 2033; its report also assigns
              Enhertu a 27.9% share of 2025 product revenue (CP010, CP011). ResearchandMarkets lists a different
              forecast horizon and growth rate, so the estimates should not be combined as if they were a single
              consensus (CP014). These are third-party market estimates, not LigaChem revenue or an addressable market
              calculation. The operational test is whether LigaChem's clinical candidates convert mechanism and
              preclinical differentiation into patient-level benefit, while established products retain clinical
              adoption and commercial reach.
            claimRefs:
              - CP010
              - CP011
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
              - CP011
      - number: '3.2'
        title: LCB02A enters an early evidence slot against an established first-line option
        blocks:
          - type: paragraph
            body: >
              LCB02A is a CLDN18.2-directed ADC in a global Phase 1/2 study, with LigaChem reporting preclinical
              activity and a trial design that includes patients previously treated with CLDN18.2-directed therapy
              (CP001, CP002, CP003). The immediate comparator is not another platform claim: IRpharm describes Astellas'
              zolbetuximab (Vyloy) as an established first-line regimen and reports no approved alternative after
              progression (CP004). That creates a plausible post-progression opening, but it does not show LCB02A will
              be safe or effective in that setting. In HER2, Iksuda's Phase 1b LCB14/IKS014 and marketed Enhertu occupy
              different evidence and commercial positions; Edaily reports Pfizer acquired global rights to RemeGen's
              disitamab vedotin for a stated total deal value of USD 4.3 billion (CP005, CP006, CP007). The ordinal
              figure summarizes these stage differences; it is not a clinical ranking or a measured market-share
              comparison.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP008
              - CP011
              - CP013
      - number: '3.3'
        title: Platform differentiation is promising but partner and execution dependencies remain
        blocks:
          - type: paragraph
            body: >
              LigaChem's ConjuALL platform is described by the company as a next-generation ADC platform, and IRpharm
              reports that it was used to construct LCB02A (CP001). The same article reports a homogeneous DAR 4,
              exatecan-based payload, and CLDN18.2 selectivity, but these are preclinical and company-presented findings
              rather than independent head-to-head evidence (CP003). For partnered programs, Edaily reports that Iksuda
              is developing LCB14/IKS014 and CStone is advancing the ROR1 ADC CS5001/LCB71; The Pharma Letter describes
              CStone's exclusive global rights outside South Korea (CP005, CP008, CP013). LigaChem also regained sole
              decision authority over LNCB74 after NextCure shifted away from oncology, taking on future milestone and
              royalty obligations (CP015). Partner access expands reach, but partner strategy changes can return
              development responsibility and cost exposure to LigaChem. Patent enforceability, manufacturing
              consistency, supply access, and partner-level clinical execution are not established by this evidence set.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP008
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP012
              - CP015
      - number: '3.4'
        title: Pricing and independent comparative proof remain diligence gaps
        blocks:
          - type: paragraph
            body: >
              The assigned sources do not provide comparable per-dose prices, realized discounts, payer terms, or
              customer switching data for the listed therapies. The reported LCB97 licensing ceiling and milestone
              estimate are contract economics, not product pricing, recognized revenue, or cash available for
              development (CP009, CP012). Nor does the company-issued comparison of CS5001 with other ROR1 ADCs
              substitute for a prespecified independent benchmark or head-to-head clinical result (CP008). The
              competitive thesis therefore remains conditional: clinical differentiation must be confirmed in patients,
              partner execution must continue, and the platform's freedom-to-operate and scalable supply position
              require separate diligence. Internal-build alternatives and likely new entrants are not sufficiently
              enumerated in the available sources to rank.
            claimRefs:
              - CP008
              - CP009
              - CP012
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The gap is clinical proof, not a shortage of platform claims
            body: >
              LigaChem has target-specific early programs and partner validation, but the evidence reviewed does not
              establish head-to-head superiority or durable commercial advantage over approved ADCs.
            calloutType: insight
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP011
          - type: callout
            title: Partner strategy can change who controls the next development step
            body: >
              LNCB74 illustrates that partner portfolio changes can return sole development control to LigaChem while
              adding payment obligations; other partner assets remain dependent on external trial execution.
            calloutType: risk
            claimRefs:
              - CP008
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Licensing monetizes pipeline progress, not recurring software revenue
        blocks:
          - type: paragraph
            body: >-
              LigaChem describes a clinical-stage therapeutics business spanning ADCs, small molecules, and worldwide
              partnerships; the public sources reviewed do not disclose a recurring subscription or unit-based pricing
              schedule. Available deal reporting instead supports a mix of upfront consideration, development and
              regulatory milestones, and post-launch royalties, with timing contingent on partner and clinical progress.
              For LCB84, coverage reports a $100 million upfront payment within a deal valued at up to $1.7 billion,
              while the additional $200 million discussed by an analyst depended on a future option exercise. For LCB97,
              the trial-start milestone was confidential and a news outlet estimated its minimum from prior-year
              revenue. These deal ceilings and estimates are not recognized revenue or guaranteed cash receipts. The
              first table separates the evidenced streams from terms and operating metrics that remain private.
            claimRefs:
