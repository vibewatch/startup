      - number: '1.3'
        title: Financing, cash visibility, and scale gaps
        blocks:
          - type: paragraph
            body: >-
              June 2026 reporting described a KRW 500 billion financing comprising convertible preferred shares and
              convertible bonds, with the Korea Development Bank and Pan Orion among the named participants. That
              financing is not interchangeable with cash currently available: a separate report placed cash, time
              deposits, and repurchase agreements at approximately KRW 443.7 billion at the end of the first quarter of
              2026, before the later financing and subsequent uses. The two reports translate the KRW 500 billion
              financing into different U.S.-dollar amounts, so the KRW denomination is the reliable common measure here.
              No assigned source provides a current valuation, revenue or run-rate, total historical capital raised,
              employee count, customer count, or a post-financing runway calculation. Those unsupported metrics are left
              unquantified.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
      - number: '1.4'
        title: Leadership coverage and execution risk
        blocks:
          - type: paragraph
            body: >-
              The available reporting identifies Park Se-jin as CEO in August and October 2026 coverage and identifies
              Kim Yong-ju as chair at the July 2026 R&D event; an earlier company announcement described Kim as CEO.
              This time-stamped evidence is not a complete executive or board roster and does not establish founder
              backgrounds, board composition, succession arrangements, or key-person dependence. The company has
              publicly described ambitious pipeline expansion and an increased willingness to fund later-stage trials,
              making capital allocation and clinical execution important diligence questions. An independent blog author
              also questioned whether Orion can produce tangible biotech synergies and whether its capital-allocation
              culture fits high-risk drug development. That is a reported concern, not proof of failed integration;
              governance records and asset-level budgets are needed to resolve it.
