  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Contractual, legal, and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest evidenced legal/contractual risk is counterparty continuity rather than a reported dispute.
              After NextCure shifted its business direction following a merger, the LNCB74 collaboration terms changed
              and LigaChem obtained sole decision authority; the revised economics include milestone and royalty
              obligations to NextCure. This demonstrates that partner strategy can change who controls development and
              bears cost, but the available report does not establish that the change involved a breach or litigation.
              The assigned sources do not provide a current patent-office landscape, freedom-to-operate opinion,
              regulator inspection history, or complete trial authorization records. These are evidence gaps, not
              evidence that a dispute, compliance failure, or safety event exists. Obtain counsel-reviewed contract and
              patent diligence and regulator records before treating these exposures as cleared.
            claimRefs:
              - CR003
              - CR012
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
      - number: '7.2'
        title: Clinical execution, quality, and operational risk
        blocks:
          - type: paragraph
            body: >-
              The portfolio remains exposed to the ordinary but consequential uncertainty of clinical development:
              early-stage progress does not establish safety, efficacy, approval, or commercial supply. A third-party
              pipeline database lists multiple ADC programs and identifies LCB-84 as Phase 1/2, while the company
              profile describes LigaChem as clinical-stage. The source pool contains no trial-level adverse-event,
              enrollment, CMC validation, manufacturing-capacity, or product-quality records sufficient to assess those
              controls. Treat trial failure or delay as a high-impact exposure, but do not infer a current failure or
              quality defect. Diligence should track protocol milestones, enrollment and safety updates, comparability
              and release metrics, qualified manufacturing capacity, and contingency plans; a material safety signal,
              repeated timeline reset, or unresolved CMC deficiency should pause incremental risk-taking.
            claimRefs:
              - CR001
              - CR006
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR012
              - CR014
              - CR015
              - CR016
      - number: '7.3'
        title: Financial resilience and capital needs
        blocks:
          - type: paragraph
            body: >-
              Cash and earnings indicators are period-sensitive and should not be collapsed into a single runway
              estimate. Yahoo Finance's late-October snapshot reports KRW 383.86 billion of cash, 0.59% total
              debt/equity, negative TTM net income, and negative levered free cash flow. BizHanKook's earlier report
              instead describes cash declining from KRW 98.6 billion at 2025 year-end to KRW 63.5 billion at 2026
              Q1-end, alongside Q1 operating and net losses and KRW 46.4 billion of outsourced R&D costs. Those
              snapshots are not necessarily contradictory: the earlier report also describes a subsequent financing
              effort, while the newer cash figure has a different as-of period. They do not prove current distress or a
              durable runway. Reconcile audited cash, restricted balances, financing proceeds, asset-level spend, and
              quarterly burn before relying on any runway claim.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR009
              - CR010
              - CR015
      - number: '7.4'
        title: Partner dependence and thesis-break monitoring
        blocks:
          - type: paragraph
            body: >-
              Licensing can shift late-stage trial and commercialization costs to partners, but it also leaves LigaChem
              dependent on counterparties' priorities, execution, and contractual options. The LNCB74 change illustrates
              this control risk; the LCB97 report provides a separate example of a partner-triggered milestone whose
              exact amount was confidential and whose payment was expected after invoicing. The source pool does not
              quantify partner-level revenue concentration, milestone timing by program, or royalty-conversion history,
              so the degree of portfolio diversification remains unknown despite multiple programs. Track partner trial
              progression, option exercises, termination notices, milestone receipts, and concentration by counterparty.
              A partner withdrawal from a lead program, repeated deferral of clinical milestones, or evidence that one
              counterparty dominates expected receipts should trigger a downside re-underwrite rather than be offset by
              unverified pipeline breadth.
            claimRefs:
              - CR007
              - CR011
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR007
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner control is an evidenced, not hypothetical, exposure
            body: >-
              NextCure's strategic shift changed the LNCB74 arrangement; diligence must establish whether comparable
              termination, cost, or royalty provisions exist across other licensed programs.
            calloutType: risk
            claimRefs:
              - CR003
              - CR014
          - type: callout
            title: Do not translate headline cash into runway
            body: >-
              The newer cash snapshot and earlier reported cash decline are from different periods and financing
              contexts; neither reveals unrestricted cash or asset-level burn today.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR008
              - CR015
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: A price-sensitive research-more call
        blocks:
          - type: paragraph
            body: >-
              LigaChem's licensing history and clinical progress create a credible platform thesis, but they do not
              convert headline deal values into current revenue or cash. A Seoul Economic Daily report cited a $1.7
              billion total LCB84/J&J deal and $100 million upfront payment, while describing a further $200 million as
              conditional on J&J exercising an option; those contingent amounts are not realized receipts (CV002,
              CV003). The same retained pool reports losses and declining cash, as well as a KRW 500 billion financing
              transaction (CV008-CV011). Gosset's preview lists market capitalization, enterprise value, and total
              revenue, but does not date or define the financial periods for those figures (CV013). In the absence of a
              date-matched share count, current price, cash/debt bridge, and risk-adjusted revenue model, no responsible
              entry multiple, target return, or numeric bull/base/bear range can be calculated. The practical call is
              research-more, with a high risk rating and no numeric target until those inputs are reconciled.
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV008
              - CV009
              - CV011
              - CV013
      - number: '8.2'
        title: Partner economics and clinical proof are real but uneven
        blocks:
          - type: paragraph
            body: >-
              LigaChem describes itself as a clinical-stage company focused on ADC and immuno-oncology medicines, and
              the retained evidence includes both an out-licensed asset and internally advanced programs (CV001, CV002,
              CV004). The LCB84 agreement supplies strategic validation and an upfront payment, but the reported total
              deal value includes contingent economics; the analyst's additional $200 million is explicitly conditional
              rather than booked cash or guaranteed revenue (CV002, CV003). Separately, after NextCure's strategic
              pivot, LigaChem assumed sole development, manufacturing, and commercialization authority for LNCB74, while
              accepting future milestone and royalty obligations (CV005, CV006). That control can improve strategic
              optionality while also shifting clinical execution and funding burden to LigaChem. A PharmaLetter company
              profile documents an earlier CS5001 licensing arrangement, but it is a dated profile and not evidence of
              current royalty conversion or repeatable economics (CV014). The thesis strengthens only when trial
              outcomes and partner cash conversion—not deal headlines alone—are observable.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
      - number: '8.3'
        title: Financing extends capacity but does not settle runway
        blocks:
          - type: paragraph
            body: >-
              BizHankook reported KRW 141.6 billion of 2025 consolidated revenue, alongside a KRW 106.5 billion
              operating loss and KRW 91.6 billion net loss; it also reported cash and cash equivalents falling from KRW
              98.6 billion at year-end 2025 to KRW 63.5 billion at the end of the first quarter of 2026, with KRW 46.4
              billion of first-quarter outsourced research and development costs (CV007-CV010). These are distinct
              accounting and cash measures, not a single burn-rate calculation. A separate report describes KRW 500
              billion in convertible bonds and convertible preferred shares, while another attributes an approximately
              KRW 1 trillion development-funds figure to an Orion official (CV011, CV012). The latter estimate combines
              reported funding and purported existing cash, but its date, restrictions, and reconciliation to the
              quarter-end cash figure are not established in the retained text. Convertible securities can also dilute
              equity or create preference overhang; issue-level terms, fully diluted shares, and current available cash
              remain diligence items, not assumed funding capacity.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Scenarios remain directional until valuation inputs are verified
        blocks:
          - type: paragraph
            body: >-
              The bull case requires partner progression on LCB84, demonstrated safety and efficacy in clinical
              programs, and cash receipts that convert contracted economics into reported revenue; a first dose in
              LCB02A's global Phase 1/2 trial is execution evidence, not efficacy evidence (CV002-CV004). The base case
              should assume milestone timing remains uncertain and that internal development continues to consume
              capital. The bear case is a clinical delay or failure combined with continuing losses, financing needs, or
              dilution; the LNCB74 rights transition also leaves LigaChem responsible for future program obligations
              (CV005, CV006, CV008-CV012). The available evidence does not establish probability-weighted cash flows,
              comparable-company assumptions, or a date-matched fully diluted valuation. Accordingly, the scenario table
              gives qualitative probability signals and explicitly withholds numeric value ranges rather than
              manufacturing precision. A refreshed price and capitalization bridge, financing terms, partner receipts,
              and trial readouts are the decision gates for moving from research-more to a return-based recommendation.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV011
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV009
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No numeric target from this evidence set
            body: >-
              Obtain a date-matched market capitalization and fully diluted share count, reconcile available cash and
              convertible terms, and update the view after partner receipts and clinical readouts.
            calloutType: recommendation
            claimRefs:
              - CV011
              - CV012
              - CV013
