  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Case
      - Explicit assumptions
      - Valuation / return logic
      - Probability signal
      - Downside trigger and diligence threshold
    rows:
      - - Bull
        - >-
          LCB84 progresses with J&J; an option is exercised; internal trials produce credible safety and efficacy
          evidence; partner cash receipts become observable.
        - >-
          Numeric range withheld: no date-matched market capitalization, fully diluted share count, probability-weighted
          cash flows, or comparable multiple is available in the assigned evidence.
        - Upside is conditional and presently low-confidence; not a numeric probability.
        - >-
          Reduce the case if trial safety or efficacy disappoints, partner development stalls, or option-linked receipts
          do not materialize.
      - - Base
        - >-
          Clinical programs advance without proven efficacy; option and milestone timing remain uncertain; development
          spend continues.
        - >-
          Numeric range withheld: reported revenue and losses do not supply a current forward revenue base or a
          risk-adjusted pipeline model.
        - Use as a planning case, not an estimated likelihood or expected return.
        - >-
          Reassess against dated cash, committed spend, actual partner receipts, clinical milestones, and fully diluted
          capitalization.
      - - Bear
        - Clinical delay or failure coincides with continued losses, capital needs, and dilution or preference overhang.
        - >-
          Numeric downside range withheld: current equity value, net debt, share count, and security conversion terms
          are not reconciled.
        - Material downside is plausible; the available sources do not support a percentage probability.
        - >-
          Trigger review on safety signals, enrollment or regulatory delay, reduced partner commitment, cash runway
          deterioration, or adverse conversion terms.
    notes: >-
      These are directional assumptions, not forecasts. Numeric valuation ranges and probability estimates are
      intentionally omitted because the retained evidence lacks consistent, dated market, capitalization, clinical
      probability, and cash-flow inputs.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV009
      - CV011
      - CV013
