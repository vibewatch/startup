  topStrengths:
    - >-
      Established pharmaceutical partnerships and reported licensing economics provide strategic validation, although
      much of the headline deal value is contingent.
    - >-
      Reported first-patient dosing for in-house LCB02A shows selective movement from licensing toward internal clinical
      execution.
    - >-
      The reported 2026 financing package expands the stated development envelope, subject to reconciliation with
      current cash and commitments.
  topRisks:
    - >-
      Clinical efficacy and safety remain unproven for the cited programs, and internal development increases execution
      and funding exposure.
    - Reported losses and changing cash balances do not establish a post-financing runway or asset-level funding plan.
    - >-
      Partner revenue concentration, milestone triggers, royalty conversion, and contract economics remain
      insufficiently disclosed.
    - No reliable date-matched valuation inputs support a current entry price or risk-adjusted pipeline valuation.
    - Manufacturing quality, supply reliability, and freedom-to-operate across key jurisdictions remain diligence gaps.
  unresolvedGaps:
    - Partner-level revenue concentration, milestone timing, and royalty-conversion history.
    - Current cash, financing proceeds, per-asset spend, and runway to decisive clinical milestones.
    - Clinical efficacy and safety data for internally advanced and partnered ADC programs.
    - CMC quality metrics, supply reliability, and launch-readiness evidence for any self-developed path.
    - Full freedom-to-operate and patent-landscape analysis for ConjuAll-related chemistry across key jurisdictions.
    - >-
      Date-matched market capitalization, fully diluted share count, and transparent risk-adjusted valuation
      assumptions.
