summary:
  headline: >-
    LigaChem’s partnered ADC platform and selective in-house clinical progress offer meaningful optionality, but losses,
    uncertain cash runway, contingent deal economics, and the absence of a defensible current valuation support
    research-more rather than a high-conviction entry.
