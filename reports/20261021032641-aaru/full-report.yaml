  - id: FM001
    title: Adoption evidence hierarchy for synthetic behavioral simulation
    type: pyramid
    summary: Evidence requirements tighten from exploratory use at the base to high-stakes deployment at the apex.
    data:
      items:
        - label: Exploratory scenario generation
          value: Lowest evidentiary threshold
          detail: Use synthetic output to generate hypotheses and compare directions, not to establish demand.
        - label: Historical blind replay
          value: Known outcome
          detail: Test a past survey or observed result that was withheld from model setup.
        - label: Domain-specific calibration
          value: Comparable population and task
          detail: Require performance evidence for the buyer's own outcome type, segment, and geography.
        - label: Live pilot
          value: Pre-agreed success criteria
          detail: Compare predictions with first-party data, live tests, or recruited fieldwork.
        - label: Repeatable operational workflow
          value: Budgeted and governed
          detail: Establish procurement, data rights, monitoring, renewal, and accountable human review.
        - label: High-stakes decision use
          value: Highest evidentiary threshold
          detail: Retain empirical validation because bias, transfer, and high-variance behavior remain material limits.
    approximationNotes: >-
      Qualitative adoption hierarchy only; no TAM, SAM, SOM, conversion rate, or value-proportional layer size is
      implied.
    claimRefs:
      - CM004
      - CM008
      - CM012
      - CM013
      - CM016
  - id: FP001
    title: Competitive positioning by decision job and workflow model
    type: quadrant
    summary: >-
      An ordinal map separates outcome-prediction specialists from exploratory research tools and vendor-led engagements
      from researcher-operated workflows.
    data:
      xAxis:
        label: 'Decision orientation: exploration (1) to outcome prediction (5)'
        min: 1
        max: 5
      yAxis:
        label: 'Operating model: vendor-led (1) to researcher-operated (5)'
        min: 1
        max: 5
      points:
        - label: Aaru
          x: 5
          'y': 2
          detail: Population prediction with contact-led enterprise engagement.
        - label: Simile
          x: 4
          'y': 2
          detail: Enterprise behavior simulation; operating details are limited in retained evidence.
        - label: Minds
          x: 2
          'y': 5
          detail: Self-serve persona and structured-study workspace.
        - label: Synthetic Users
          x: 1
          'y': 4
          detail: Conversational product and UX exploration.
        - label: Qualtrics Edge
          x: 2
          'y': 4
          detail: Synthetic capability inside an established enterprise survey workflow.
        - label: Highlight
          x: 1
          'y': 2
          detail: Managed real-human and physical-product validation.
    approximationNotes: >-
      Ordinal scores are analyst synthesis of documented product orientation and buying model, not measured performance,
      market share, accuracy, or absolute ranking; missing primary competitor evidence limits precision.
    claimRefs:
