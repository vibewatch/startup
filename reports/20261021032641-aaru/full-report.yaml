chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Aaru was founded in March 2024 by Cameron Fink, Ned Koh, and John Kessler, and a May 2026 profile places
              its headquarters in New York City. The company describes its product as simulated populations grounded in
              real-world behavior and outcomes: a customer changes a product, price, message, or strategy in the model
              and evaluates predicted behavior before committing in the market. Its published use cases span product
              innovation, marketing and brand, audience segmentation, scenario planning, and strategic communications.
              That positions Aaru as a contact-led enterprise research and decision-support vendor rather than a
              self-serve survey tool; a competitor comparison reports that Aaru does not publish pricing. Public sources
              describe an ambitious operating proposition, but they do not disclose the recurring-revenue base, customer
              count, headcount, or unit economics needed to establish current scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO015
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              The three founders remain the visible leadership core. Secondary reporting identifies Cameron Fink as
              chief executive, Ned Koh as president, and John Kessler as chief technology officer. The concentration
              gives the company a clear founder-led structure and aligns commercial, operating, and technical authority
              with the founding team. It also creates key-person exposure: the assigned evidence does not identify a
              board roster, independent directors, finance leadership, legal leadership, or a broader executive bench.
              The public record therefore supports the founders' identities and reported roles, but not a conclusion
              that governance and succession depth are institutionally mature. Confirming board composition, delegated
              authorities, founder vesting, and succession coverage remains a direct diligence requirement.
            claimRefs:
              - CO001
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
      - number: '1.3'
        title: Financing and stakeholders
        blocks:
          - type: paragraph
            body: >-
              Financing reports show exceptional velocity but require metric discipline. The Agent Times reported a $1.5
              billion valuation and approximately $94 million of cumulative funding in April 2026, explicitly describing
              the latter as self-reported; neither amount establishes cash available. For the December 2025 Series A,
              Nextomoro reported a Redpoint-led round above $50 million with a multi-tier structure and a $1 billion
              headline valuation, while Minds reported an $80 million Series A. These are different levels of
              specificity rather than cleanly comparable audited figures, and the blended entry price remains
              undisclosed. Nextomoro also names A*, Abstract Ventures, Felicis, General Catalyst, Accenture Ventures,
              and Z Fellows as earlier capital providers. Separately, Research Live confirms an Accenture Ventures
              investment but says its amount was not disclosed, and reports a planned Accenture Song integration of
              Aaru's Lumen model.
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
      - number: '1.4'
        title: Milestones, proof points, and open diligence
        blocks:
          - type: paragraph
            body: >-
              Aaru's public proof story combines an election simulation, strategic distribution, and vendor-published
              validation. Research Live reported that Aaru predicted the June 2024 New York Democratic primary within
              371 votes, attributing that result to Semafor. In 2025, Accenture paired investment with a proposed Lumen
              integration, and the December financing elevated Aaru to a reported unicorn headline valuation. By April
              2026, secondary reporting put the valuation at $1.5 billion. A competitor later summarized Aaru's
              September 2026 validation study as a 3.53-point mean absolute error and 0.970 Pearson correlation across
              2,993 questions, while correctly characterizing the results as vendor-published and recommending a blinded
              pilot. The evidence therefore supports commercial and technical momentum, not independent proof that
              simulations generalize across customer populations or replace observed human behavior.
            claimRefs:
              - CO006
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
              - CO016
