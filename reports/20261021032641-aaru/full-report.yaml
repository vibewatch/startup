      - CP004
      - CP007
      - CP008
      - CP009
      - CP012
      - CP013
  - id: FI001
    title: Revenue model bridge from scoped decision to gross profit
    type: flow
    summary: Public evidence supports the operating sequence, but neither price nor cost values are disclosed at any stage.
    data:
      nodes:
        - id: scoped-sale
          label: Sales-led scoped engagement
          detail: No public tariff; negotiated buyer conversation
        - id: decision-design
          label: Objectives, audiences, and questions
          detail: Customer decision criteria define the work
        - id: data-inputs
          label: Public, licensed, and customer data
          detail: Input mix creates data-access and governance work
        - id: simulation
          label: Population simulation
          detail: Compute and specialist research produce scenario outputs
        - id: validation
          label: Engagement-specific validation
          detail: Outputs are compared with available customer or observed evidence
        - id: deliverables
          label: Decision-ready deliverables
          detail: Reports and analyses are provided under negotiated orders
        - id: fees
          label: Contract revenue
          detail: Fees and billing basis are not publicly disclosed
        - id: gross-profit
          label: Gross profit after delivery costs
          detail: Margin remains unknown without data, compute, and labor costs
      edges:
        - from: scoped-sale
          to: decision-design
        - from: decision-design
          to: data-inputs
        - from: data-inputs
          to: simulation
        - from: simulation
          to: validation
        - from: validation
          to: deliverables
        - from: deliverables
          to: fees
        - from: fees
          to: gross-profit
    approximationNotes: >-
      Conceptual sequence only; it is not a quantified waterfall and does not imply disclosed conversion rates, prices,
      costs, or margins.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI014
  - id: FE001
    title: Publicly disclosed product architecture
    type: stack
    summary: >-
      Six disclosed layers connect decision framing to reviewed artifacts, while key implementation details remain
      private.
    data:
      layers:
        - label: Objectives
          name: Objectives
          detail: Define the decision options success criteria and constraints.
          items:
            - options
            - success criteria
            - constraints
        - label: Audiences
          name: Audiences
          detail: Configure target populations with demographic and behavioral parameters.
          items:
            - segments
            - hard parameters
            - behavioral descriptions
        - label: Evidence
          name: Evidence
          detail: Weight public licensed and available customer signals.
          items:
            - public records
            - licensed data
            - customer data
        - label: Population model
          name: Population model
          detail: Learn supported trait relationships and sample complete profiles.
          items:
            - joint traits
            - learned network
            - sampled profiles
        - label: Simulation and validation
          name: Simulation and validation
          detail: Apply questions or interventions and compare outputs with scoped evidence.
          items:
            - questions
            - hypotheticals
            - holdouts
        - label: Artifacts
          name: Artifacts
          detail: Produce distributions executive summaries and interactive result experiences.
          items:
            - distributions
            - reports
            - interactive outputs
    approximationNotes: >-
      This is a synthesis of disclosed workflow layers, not a claim about internal software services, physical
      infrastructure, or data-security boundaries.
