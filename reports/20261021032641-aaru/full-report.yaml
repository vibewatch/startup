  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Aaru's relevant market is narrower than all market research or all enterprise AI. The product models
              population responses to a defined decision: product concepts, pricing, positioning, advertising, policy,
              or electoral scenarios. Included spend is therefore the portion of research, strategy, innovation, and
              forecasting budgets used to anticipate group behavior before a decision. The direct status quo includes
              surveys, panels, focus groups, agencies, historical-data extrapolation, and internal judgment. Adjacent
              spend includes audience segmentation, scenario planning, and strategic communications, but excludes
              general-purpose analytics, media buying, CRM, and research that requires recruited humans as the final
              evidentiary standard. Aaru and its investor describe speed and iteration as the wedge, while independent
              and competitor sources emphasize that simulated output remains directional unless benchmarked against
              observed behavior.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM016
      - number: '2.2'
        title: Sizing without false precision
        blocks:
          - type: paragraph
            body: >-
              None of the eight retained sources provides a transparent market value, spend base, growth rate, or
              bottom-up customer count for Aaru's precise category. Broad synthetic data, generative AI, and global
              market-research totals would include substantial spend that Aaru cannot address and would overstate TAM.
              The available quantitative evidence is instead an adoption-and-validation set: an EY recreation covered
              3,600 investors across more than 30 markets; a New York election simulation modeled nearly two million
              voters; and TechCrunch reported that ARR was below $10 million in December 2025. These figures demonstrate
              scope, not addressable revenue. A defensible SAM requires customer-level pricing, annual study volume,
              eligible enterprise counts, and the share of workflows that can pass domain-specific validation. SOM
              additionally requires capacity, sales-cycle, renewal, and partner-sourced pipeline data that are not
              public.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to enterprise and institutional buying rather than a self-serve research-software
              motion. Likely economic buyers sit in strategy, innovation, marketing, insights, or public-affairs
              leadership; day-to-day users are researchers, strategists, creatives, and analysts; procurement, legal,
              privacy, and model-risk teams can gate deployment. The Accenture relationship is strategically important
              because Accenture Song said it would integrate Aaru's private-sector model across product development,
              marketing, customer strategy, and customer service. That creates a partner-led route into existing
              budgets, but public evidence does not separate direct from partner-sourced demand. Adoption is most
              plausible as a scoped pilot against a known historical outcome, followed by a custom engagement if the
              model meets pre-agreed accuracy and governance criteria. No public pricing means budget ownership and
              procurement friction remain material diligence questions.
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM011
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              The demand case rests on faster iteration, lower marginal cost per scenario, access to difficult-to-survey
              populations, and dissatisfaction with self-reported intent. Named enterprises, agency partners, and public
              validation cases can accelerate trust. The constraints are equally central: model bias can flatten
              minority perspectives, training data can be incomplete or irregular, behavior may not transfer across
              domains, and some high-variance individuals remain unpredictable even with extensive data. Public accounts
              also conflict on whether one election result was within 2,000 votes or 371 votes, so metric definitions
              need reconciliation. For valuation, the category deserves optionality only if pilots convert into
              repeatable, budgeted workflows with measured out-of-sample accuracy. Until pricing, renewal, sales-cycle,
              and category-spend evidence are disclosed, market size should not be used to justify a premium multiple.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM008
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: No defensible public TAM
            body: >-
              The assigned evidence contains no category revenue base, eligible-account count, public price, or purchase
              frequency from which to calculate TAM, SAM, or SOM. Broad AI or market-research totals would create false
              precision.
            calloutType: risk
            claimRefs:
              - CM006
              - CM014
              - CM015
          - type: callout
            title: Partner distribution may be the fastest budget bridge
            body: >-
              Accenture Song's stated integration across product, marketing, customer strategy, and service can place
              Aaru inside existing advisory and transformation budgets, although the direct-versus-partner revenue mix
              is not disclosed.
            calloutType: insight
            claimRefs:
              - CM007
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The market is a set of overlapping jobs, not one peer list
        blocks:
          - type: paragraph
            body: >-
              Aaru's closest direct category is population-scale simulation: its official material describes simulated
              populations built from public, licensed, and customer data, while third-party and competitor sources place
              Simile beside it as an enterprise behavior-simulation peer. The broader buyer set is less tidy. Ditto,
              Synthetic Users, Minds, FishDog, and Qualtrics Edge address adjacent jobs such as reusable synthetic
              audiences, conversational discovery, self-serve studies, and survey-stack augmentation. Highlight
              represents a different substitute: operationally assisted research with real people and physical products.
              Traditional surveys, focus groups, internal data-science builds, and simply making decisions from
              historical data remain status-quo alternatives. This job-based framing matters because a buyer selecting a
              fast concept-screening tool is not necessarily choosing among the same vendors as a buyer commissioning a
              high-stakes population forecast.
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP007
              - CP010
              - CP011
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
      - number: '3.2'
        title: Differentiation is strongest in population modeling, but trust is the purchase gate
        blocks:
          - type: paragraph
            body: >-
              Aaru's documented workflow is more specific than a generic persona chatbot: it models traits jointly,
              trains against individual effects and aggregate distributions, samples complete profiles, and presents
              results as population distributions rather than promises about named individuals. The company also
              publishes an EY replication result, but the retained proof remains company-issued and should be treated as
              a vendor benchmark rather than independent validation. Competitors emphasize different trust mechanisms:
              self-serve inspectability, research-method modules, integration with established survey operations, or
              real-human product use. Across the retained evidence, the consistent adverse signal is methodological:
              synthetic output is useful for hypothesis generation and early screening, but high-stakes pricing, demand,
              physical-product, and launch decisions still require empirical validation. That keeps human research and
              hybrid workflows inside the competitive set rather than outside it.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP008
              - CP016
      - number: '3.3'
        title: Distribution may matter more than feature breadth
        blocks:
          - type: paragraph
            body: >-
              Aaru's Accenture relationship creates a potentially meaningful route into enterprise product, marketing,
              customer-strategy, and service work. This can lower buyer-access friction and embed the simulation engine
              inside a larger advisory workflow, but it can also make partner economics, account control, and services
              dependence important diligence questions. Incumbent distribution is a counterweight: Qualtrics can place
              synthetic audiences inside an existing research stack, and internal teams can combine foundation models,
              licensed data, and conventional panels without adding a new strategic vendor. Commercial transparency is
              weak. A competitor page reports that Aaru uses contact-led sales and does not publish pricing, while Minds
              advertises self-serve prices. These are not directly comparable realized prices, yet they illustrate a
              procurement contrast between scoped enterprise engagement and immediate departmental adoption.
            claimRefs:
              - CP004
              - CP009
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP009
              - CP013
      - number: '3.4'
        title: The moat depends on calibration evidence and embedded workflow, not agents alone
        blocks:
          - type: paragraph
            body: >-
              Foundation-model access and multi-agent orchestration are unlikely to be sufficient defenses because
              adjacent vendors already claim similar synthetic-persona and simulation capabilities. A more durable Aaru
              advantage would require proprietary behavioral data rights, repeatable calibration against withheld
              outcomes, customer-specific integrations, and distribution that produces cumulative learning or switching
              costs. The retained sources show pieces of that thesis but not the full chain: Aaru describes licensed and
              customer data, Research Live documents Accenture integration, and its site publishes a validation example.
              They do not disclose retention, migration costs, exclusive data rights, realized pricing, or independent
              head-to-head accuracy. Competitor-authored comparisons also have obvious incentives and cannot establish
              superiority. The practical displacement risk is therefore two-sided: simulation specialists can converge
              on Aaru's technical proposition, while incumbents and hybrid human-research vendors can win buyers that
              value procurement familiarity or ground truth over maximum speed.
            claimRefs:
              - CP002
              - CP004
              - CP006
              - CP010
              - CP011
              - CP014
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Vendor comparisons are useful maps, not independent benchmarks
            body: >-
              Highlight, FishDog, and Minds describe real buyer tradeoffs, but each sells an alternative and therefore
              cannot independently establish Aaru's relative accuracy, cost, or product limitations.
            calloutType: risk
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP014
          - type: callout
            title: Run a blinded, decision-specific bake-off
            body: >-
              Require Aaru and shortlisted alternatives to reproduce withheld historical results, disclose error by
              segment and question type, and price the same scoped engagement before treating published validation or
              list pricing as comparable.
            calloutType: recommendation
            claimRefs:
              - CP002
              - CP006
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and quality
        blocks:
          - type: paragraph
            body: >-
              Aaru appears to monetize through negotiated enterprise engagements rather than a public self-serve tariff.
              Two competitor-authored comparisons say Aaru does not publish pricing and directs buyers into a sales
              conversation, while an independent profile describes enterprise software and simulation services sold
              through orders that specify fees and deliverables. That evidence supports a contract-led model, but not a
              conclusion about annual contract value, subscription mix, usage pricing, discounts, recognition timing, or
              renewal quality. Accenture Song's stated plan to integrate Lumen into product development, marketing,
              customer strategy, and customer service provides a credible distribution path, yet neither the investment
              amount nor partner economics were disclosed. Investors should therefore treat partner reach as a pipeline
              advantage, not as booked or recurring revenue, until contracts and cohort data demonstrate otherwise.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
              - CI012
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI008
              - CI012
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI007
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
              - CI014
      - number: '4.2'
        title: Delivery economics and cost base
        blocks:
          - type: paragraph
            body: >-
              The available workflow implies meaningful variable and semi-variable delivery work. Aaru says engagements
              begin with customer objectives, audiences, questions, and decision criteria; populations then draw on
              public, licensed, and customer data, and engagement-specific validation compares outputs with first-party
              data, historical outcomes, prior research, or live tests. These steps can improve defensibility, but they
              also create likely data-license, cloud-compute, research, deployment, and quality-assurance costs. A
              current company job repost advertises a research engineer at $200,000-$600,000 per year plus equity and
              asks that person to make simulations fast and inexpensive at scale, a direct signal that both specialist
              labor and compute efficiency matter. The evidence does not quantify utilization, cost per study,
              implementation hours, or gross margin, so no SaaS-like margin assumption is supportable.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI009
              - CI010
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
      - number: '4.3'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              YesPress reports that Redpoint confirmed an $80 million Series A in April 2026, which establishes
              financing raised but not current cash available. A separate market profile says specific growth metrics
              are not public, and the assigned evidence contains no current cash balance, monthly burn, runway, debt
              facility, project-finance obligation, or next-round trigger. Capital adequacy is consequently not
              underwritable from public data. Commercial proof is also incomplete: the EY replication reportedly ran in
              one day rather than six months and achieved a 0.90 median Spearman correlation across 53 questions, but
              that is an efficiency and validation result, not revenue, retention, or customer ROI. Competitor analysis
              correctly warns that synthetic outputs do not establish exact willingness to pay or demand. The financial
              verdict is therefore promising revenue mechanics with unproven revenue quality, margin path, and runway.
            claimRefs:
              - CI006
              - CI011
              - CI012
              - CI013
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Financing is not runway
            body: >-
              The reported $80 million Series A is a historical financing amount. Without current cash, burn, debt, and
              committed-spend data, it cannot establish how many months of operating runway remain.
            calloutType: risk
            claimRefs:
              - CI011
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Aaru's product is best understood as an engagement-scoped decision simulation rather than a conventional
              survey panel or a self-serve chatbot. The official workflow begins by defining the decision objective,
              success criteria, constraints, target audiences, and questions or stimuli. Audience descriptions can
              combine demographic and behavioral parameters; Aaru's illustrative grocery scenario assigns 10,000 agents
              to each of three segments, but that example is not evidence of a standard production scale. The resulting
              product surface spans population construction, scenario execution, response distributions,
              cross-tabulation, and report artifacts. Public descriptions support product, price, message, policy, and
              political-poll use cases, while the available evidence does not expose standardized SKUs, service tiers,
              implementation timelines, or a public API contract.
            claimRefs:
              - CE001
              - CE002
              - CE011
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE012
              - CE013
              - CE016
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE009
              - CE013
              - CE014
      - number: '5.2'
        title: Operating architecture and modeling method
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture starts with public and licensed records and can incorporate customer data for
              the decision at hand. Aaru says sources are weighted against one another so agreement strengthens a signal
              and disagreement remains visible. Rather than storing a fixed spreadsheet of synthetic respondents, the
              system reportedly learns a network of supported relationships among traits and samples complete profiles
              from that network. It then trains at individual and aggregate resolutions to constrain both plausible
              agents and population totals. This is a meaningful methodological distinction from independent-column
              persona generation, but the public materials do not disclose model families, infrastructure,
              reproducibility controls, calibration code, or how licensed-data rights flow into generated outputs.
            claimRefs:
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE014
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE007
              - CE013
      - number: '5.3'
        title: Maturity, deployment, and roadmap signals
        blocks:
          - type: paragraph
            body: >-
              Product maturity is evidenced more by scoped deployments and an active artifact roadmap than by public
              technical release history. Research Live reported that Accenture Song would integrate Lumen into offerings
              spanning product development, marketing, customer strategy, and customer service, showing a
              partner-mediated deployment path. Two company job reposts describe an Artifacts team building executive
              summaries, insight-generating documents, and interactive result experiences, with explicit work on
              evaluation criteria, launch criteria, model-reasoning failures, adoption, trust, and quality. Those
              postings are company-issued recruiting evidence, not independent proof that every capability is generally
              available. No assigned source provides uptime history, support commitments, integration documentation,
              versioned releases, or a dated roadmap against which delivery can be tested.
            claimRefs:
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Validation, trust, safety, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Aaru explicitly frames outputs as population distributions under stated conditions, not predictions of a
              named person's next action. Its official material describes internal holdout testing and
              engagement-specific comparisons with first-party data, historical outcomes, prior research, and live
              tests. The cited EY recreation covered 3,600 affluent investors in more than 30 markets and reported a
              median Spearman correlation of 0.90, but it remains a company-reported, scoped exercise rather than a
              universal performance guarantee. A competitor's methodological warning is directionally appropriate:
              synthetic outputs do not establish representativeness, causality, real-world demand, or exact willingness
              to pay. The assigned evidence does not document security certifications, privacy controls, incident
              history, model-governance ownership, data retention, or independent red-team results, so those controls
              require primary diligence rather than optimistic inference.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE015
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Validation is scoped, not universal
            body: >-
              Public benchmark results should be repeated on the investor's own withheld outcomes and target segments
              before Aaru outputs influence pricing, launch, or capital-allocation decisions.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segments, buyers, and use cases
        blocks:
          - type: paragraph
            body: >
              Aaru's public customer surface is enterprise-led rather than self-serve. Independent coverage says the
              current base skews toward large businesses and spans consumer companies in retail, technology, and CPG,
              alongside financial services, government-policy work, media, and utilities. The likely economic buyer is
              therefore a strategy, insights, innovation, marketing, or policy leader, while researchers, creatives, and
              operators use the resulting simulations. Aaru's own workflow starts with a decision objective, defines
              audiences and questions, and can incorporate customer data to narrow the modeled world. This supports a
              high-touch, scoped engagement interpretation, but the reviewed evidence does not provide segment-level
              customer counts, revenue contribution, average contract value, or proof that every named sector is a
              recurring production cohort.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU005
              - CU006
              - CU009
              - CU015
      - number: '6.2'
        title: Named proof and deployment quality
        blocks:
          - type: paragraph
            body: >
              The strongest named proof is concentrated in validation and distribution relationships. Aaru says EY asked
              it to recreate the 2025 Global Wealth Study blind, covering 3,600 affluent investors across more than 30
              markets, and reports completion in one day with a median Spearman correlation of 0.90. Research Live
              reports that Accenture Song planned to integrate Aaru's Lumen model into work across product development,
              marketing, customer strategy, and service. Fortune separately names EY, Accenture, Interpublic Group,
              McDonald's, Boston Beer, A24, and Bayer among organizations buying into the methodology, and reports that
              work with Spindrift preceded a still-tea launch. These references establish real commercial interest, but
              public materials usually do not disclose contract status, scope, spend, renewal, or whether each
              relationship is a pilot, partner channel, or recurring production deployment.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
      - number: '6.3'
        title: Adoption evidence and durability
        blocks:
          - type: paragraph
            body: >
              Public adoption evidence is episodic rather than longitudinal. The pool contains named organizations, one
              quantified EY validation, an Accenture integration announcement, and a reported Spindrift product outcome,
              but no time series for active accounts, deployed populations, studies run, locations, usage frequency,
              repeat purchase, or paid conversions. An analyst profile explicitly says specific growth metrics are not
              public. The reviewed sources also do not disclose NRR, GRR, gross or logo churn, renewal rates, contract
              length, satisfaction, implementation time, or customer-level revenue. A prudent underwriting view should
              therefore treat the named references as proof of market access and project activity, not as evidence of
              durable recurring adoption. Cohort and renewal data remain necessary to distinguish repeatable software
              economics from bespoke research engagements.
            claimRefs:
              - CU004
              - CU006
              - CU007
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
      - number: '6.4'
        title: Expansion, channel dependence, and customer risk
        blocks:
          - type: paragraph
            body: >
              Aaru has two visible expansion paths: direct enterprise engagements that begin with a scoped validation
              exercise, and partner-led distribution through firms such as Accenture. Fortune reports that prospects may
              provide an old survey for a blind rerun against known outcomes, creating a credible land motion before a
              broader decision workflow. Yet the public record does not quantify direct versus partner-sourced revenue,
              expansion within an account, top-customer exposure, procurement duration, or partner economics.
              Methodological limits also matter for durability: Fortune reports bias risk in AI respondents and cases
              Aaru says it could not predict reliably, while competitor-issued guidance argues that synthetic outputs
              remain directional and require empirical validation. Those limitations could constrain expansion into
              high-stakes decisions unless account-specific benchmarks and governance controls are demonstrated.
            claimRefs:
              - CU005
              - CU009
              - CU012
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU012
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reference quality is better than a logo wall
            body: >-
              EY provides a quantified blind-recreation example, Accenture provides a documented integration path, and
              Fortune connects Spindrift work to a launched product category.
            calloutType: strength
            claimRefs:
              - CU004
              - CU005
              - CU007
          - type: callout
            title: Durability remains private
            body: >-
              No reviewed public source provides retention, renewal, contract-duration, cohort, active-usage, or
              concentration metrics, so recurring adoption cannot be inferred from the named relationships.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Model-validity risk ranks first because Aaru's own method says coverage gaps, irregular updates, bias,
              chance, and unobserved circumstances remain limits, while EY says future behavior cannot be guaranteed.
              The commercial consequence is potentially high when customers use a forecast to commit capital or
              reputation, even though the likelihood of a material miss is not quantifiable from the assigned evidence.
              Data-rights and regulatory exposure ranks alongside validity because the product combines public,
              licensed, and customer data, but the pool contains no primary regulator, court, certification, or
              data-rights artifact. Partner, financing, and team-capacity risks are important but less measurable:
              Accenture is both investor and channel partner, its investment amount was undisclosed, public growth
              metrics are absent in one market profile, and Aaru describes itself as a small team. The investment thesis
              should break if Aaru cannot pass an investor-designed blinded holdout, document rights for every material
              data input, or show a credible plan to operate through a major partner loss.
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR010
              - CR011
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory, legal, and data-governance exposure
        blocks:
          - type: paragraph
            body: >-
              The principal legal diligence issue is provenance rather than a documented enforcement event. Aaru says
              simulated worlds draw on public records, licensed transactions and visits, search and media signals, and
              customer context. That mix creates potential privacy, contract, licensing, and purpose-limitation
              questions, but the assigned pool does not contain the contracts, data inventory, privacy impact
              assessment, regulator correspondence, or certification evidence needed to determine compliance. A
              low-reputation market profile also says patent and IP information is not public; this is a weak signal
              that defines a diligence request, not proof that protection is absent. Mitigation maturity is therefore
              only partially visible: Aaru describes source assessment and carrying limitations into reports, but legal
              controls are not evidenced. A failure to provide chain-of-title, data-use rights, deletion controls, and
              jurisdiction-specific reviews should stop underwriting for sensitive use cases.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR010
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR005
              - CR010
              - CR014
      - number: '7.3'
        title: Operational, quality, and model risk
        blocks:
          - type: paragraph
            body: >-
              Aaru's published process contains sensible controls but does not eliminate generalization risk. The
              company says it trains at individual and aggregate resolutions, withholds evidence for internal testing,
              compares interventions with observed changes where available, and sets engagement-specific criteria before
              interpreting results. EY's recreation of a wealth study supplies useful partner evidence across 3,600
              affluent investors in more than 30 markets, but a competitor correctly notes that rank correlation and
              distribution overlap answer different questions. A second competitor warns that synthetic findings remain
              directional and do not establish representativeness or causal proof. These critiques are not independent
              benchmarks, yet they identify valid test design. Mitigation should require versioned validation by
              audience and decision type, blind holdouts, uncertainty disclosure, drift monitoring, and human or
              observed-behavior confirmation before high-stakes action.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR016
      - number: '7.4'
        title: Partner, financial, and execution risk
        blocks:
          - type: paragraph
            body: >-
              Accenture provides capital, distribution, and strategic guidance: its release says the investment supports
              expansion and that an Accenture Song executive became a strategic adviser, while Research Live reports
              that Song would integrate Aaru's Lumen model into its offerings. That is meaningful validation, but it
              also creates a dependency question because public evidence does not disclose partner-sourced revenue,
              concentration, minimum commitments, exclusivity, or termination rights. EY supplies a second prominent
              validation relationship, although its published test is still partner evidence rather than independent
              peer review. Financial resilience is not underwritable from this pool: Accenture's investment amount was
              not disclosed and a low-reputation profile reports no specific public growth metrics. Management should
              provide partner-level pipeline and revenue, cash, burn, runway to the next milestone, service capacity,
              key-person coverage, and a partner-loss continuity plan; inability to do so is a thesis-break trigger.
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not treat a successful benchmark as universal validation
            body: >-
              The EY result is useful partner evidence, but its population, questions, and correlation metric do not
              establish accuracy for a different decision. Require a blind, investor-selected holdout with acceptance
              criteria fixed before results are seen.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
          - type: callout
            title: Make private diligence conditions explicit
            body: >-
              Underwriting should remain conditional on data-rights documentation, task-specific validation, partner
              concentration, customer and revenue quality, cash and burn, runway through the next milestone, and
              key-person continuity.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The public record supports interest, not a priced investment decision. Fortune reported that Aaru's
              December Series A carried a $1 billion headline valuation, used multiple pricing tiers, and was completed
              while annual recurring revenue was below $10 million. On that disclosed bound, the headline price exceeded
              100 times ARR; the blended round price was lower but remains undisclosed. Redpoint later announced an $80
              million Series A, while April coverage cited a $1.5 billion valuation and roughly $94 million raised.
              Those figures do not reconcile into a current cap-table value, and funding raised is not cash available.
              The appropriate stance is therefore stretched and presently unpriceable. Proceed only to diligence, not
              commitment, until management supplies current ARR, growth, retention, margin, burn, cash, preferences,
              ownership, and a fully diluted capitalization table.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and quality of proof
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Aaru may compress expensive research cycles and distribute through large
              professional-services and advertising channels. EY describes a one-day recreation of a six-month,
              3,600-investor study across more than 30 markets, with simulation results correlated over 90% to the
              survey. Fortune also identifies a broad set of enterprise relationships, and Research Live describes
              Accenture Song integrating Lumen into client work. The anti-thesis is equally material: EY explicitly says
              simulation cannot guarantee future behavior, Fortune describes model-bias and hard-to-forecast cases, and
              Aaru's homepage labels an EY result as "100% Accuracy" without the denominator shown on that page. A
              competitor also warns that synthetic outputs remain directional. Premium valuation requires repeatable,
              independently blinded results rather than selected demonstrations.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario framework without false precision
        blocks:
          - type: paragraph
            body: >-
              A numeric valuation range would be false precision because the retained public evidence lacks current
              revenue, growth, retention, gross margin, burn, cash, dilution, preference rights, and a verified current
              share price. The bull case requires third-party replication of the EY-style result, durable enterprise
              renewals, and economics that can support a premium software multiple. The base case assumes real demand
              and useful distribution partnerships but treats the disclosed financing marks as negotiation references
              rather than intrinsic value. The bear case activates if blinded tests fail to generalize, revenue remains
              small relative to the reported marks, or structured preferences shift downside to common holders.
              Probability signals are therefore qualitative and evidence-triggered; assigning percentages without
              operating data would overstate confidence.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is low despite strategic relevance. The company is young, has no public price list, and has
              not disclosed the growth metrics needed to test whether an eventual strategic sale or public-market path
              can clear the reported private marks. Before investment, obtain monthly ARR and bookings cohorts, logo and
              revenue retention, gross margin after model and data costs, burn and runway, customer concentration,
              partner-sourced revenue, the preference stack, and a fully diluted waterfall. Re-run at least three
              historical studies blind, including a known failure case, and compare results with human panels and
              observed outcomes. Break the thesis if blinded error materially worsens outside showcased domains, major
              customers do not renew, current economics cannot justify the blended Series A price, or preferences
              prevent a credible venture return at realistic exits.
            claimRefs:
              - CV002
              - CV007
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive call
            body: >-
              Research more rather than buy the headline. A materially lower effective entry price can improve the
              risk-reward, but only current cohort economics, validated model performance, and the actual preference
              waterfall can define how much lower.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV009
              - CV010
              - CV015
              - CV016
