      - CE003
      - CE004
      - CE005
      - CE007
      - CE013
  - id: FU001
    title: Enterprise customer journey and expansion loop
    type: journey-map
    summary: >-
      The public evidence supports a scoped, validation-led enterprise journey with direct and partner expansion paths,
      but not quantified conversion or retention.
    data:
      nodes:
        - id: need
          label: Frame a consequential decision
          detail: Enterprise, policy, or research teams identify a product, price, campaign, or scenario decision.
        - id: scope
          label: Scope objectives and audiences
          detail: Aaru defines decision criteria, audience parameters, questions, stimuli, and constraints.
        - id: ground
          label: Ground the simulated world
          detail: Public, licensed, and available customer data narrow the model to the decision context.
        - id: run
          label: Run population simulations
          detail: >-
            Questions and scenarios are tested across modeled populations, producing distributions rather than
            individual promises.
        - id: validate
          label: Validate against known outcomes
          detail: Prospects may use historical surveys or outcomes for a blind rerun before broader adoption.
        - id: expand
          label: Expand directly or through partners
          detail: >-
            Successful work can extend to more decisions or enter enterprise workflows through partners such as
            Accenture; public conversion and renewal rates are unavailable.
    approximationNotes: >-
      Ordered stages synthesize the public workflow; they do not represent measured conversion rates, elapsed time, or a
      common customer cohort.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU012
      - CU015
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: >-
      Evidence-based qualitative ordering of residual exposure; likelihood remains unknown when the assigned public pool
      provides no frequency or concentration denominator.
    data:
      columns:
        - id: likelihood
          label: Likelihood
          detail: Observed frequency or evidence-based qualitative likelihood
        - id: impact
          label: Impact
          detail: Potential effect on customer decisions and investment value
        - id: mitigation
          label: Mitigation maturity
          detail: Controls visible in the assigned public evidence
      rows:
        - label: Out-of-scope model validity
          note: Public benchmarks do not establish performance for every audience or decision.
          values:
            - value: Medium
              detail: Aaru and partners acknowledge uncertainty and scope dependence.
            - value: High
              detail: A wrong forecast can affect capital, pricing, or reputation.
            - value: Developing
              detail: Internal holdouts and engagement validation are described.
        - label: Data rights and privacy
          note: No primary legal-control artifact was present in the assigned pool.
          values:
            - value: Unknown
              detail: No incident or violation rate is established.
            - value: High
              detail: The model uses public, licensed, and customer data.
            - value: Unverified
              detail: Source assessment is described; legal controls are not.
        - label: Input bias and coverage drift
          note: Aaru expressly carries gaps, cadence, and bias into model limits.
          values:
            - value: Medium
              detail: The limitation is inherent, but occurrence frequency is not public.
            - value: High
              detail: Sparse inputs can distort segment-level decisions.
            - value: Developing
              detail: Weighting, holdouts, and limitation reporting are described.
        - label: Strategic-partner concentration
          note: Accenture has capital, advisory, integration, and distribution roles.
          values:
            - value: Unknown
              detail: Revenue and pipeline concentration are not disclosed.
            - value: High if material
              detail: A partner loss could affect capital and route to market.
            - value: Unverified
              detail: No partner-loss continuity plan was public.
        - label: Financial resilience
          note: Investment amount, growth metrics, burn, cash, and runway are not established.
          values:
            - value: Unknown
              detail: The public pool lacks current financial statements.
            - value: High
              detail: Insufficient runway could constrain validation and enterprise delivery.
            - value: Unverified
              detail: No financing or runway mitigation was retained.
        - label: Team and delivery capacity
          note: Aaru describes itself as a small team and lists four open roles.
          values:
            - value: Unknown
              detail: Headcount, attrition, and service load are not public.
            - value: Medium-high
              detail: Rapid enterprise scaling can strain controls and support.
            - value: Unverified
              detail: Staffing depth and succession controls were not retained.
    approximationNotes: >-
      Qualitative placement only; no numeric probability, loss estimate, incident rate, or concentration denominator is
      available in the assigned evidence.
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR010
      - CR011
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Evidence moves from demonstrated use and distribution to unresolved economics, metric risk, and a research-more
      decision.
    data:
      nodes:
        - id: validation
          label: Customer validation
          detail: EY reports over 90% correlation on a 3,600-investor study completed in one day.
        - id: distribution
          label: Enterprise distribution
          detail: Accenture Song integration and named enterprise relationships support a channel thesis.
        - id: caveat
          label: Behavioral uncertainty
          detail: EY says simulation cannot guarantee future behavior, and Fortune describes bias and forecasting limits.
        - id: economics
          label: Economics gap
          detail: The only public ARR bound is below $10M at the reported $1B headline Series A mark.
        - id: terms
          label: Price and terms gap
          detail: The blended valuation, preferences, dilution, cash, and ownership are not disclosed in retained evidence.
        - id: decision
          label: Research more
          detail: Require reconciled economics, blind validation, and price protection before underwriting.
    approximationNotes: null
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV015
      - CV016
