company:
  name: Aaru
chapter:
  number: 8
  title: Valuation
  summary: >-
    Aaru has credible customer and investor proof, but public financing reports span a
    $1.0 billion headline Series A mark and a later $1.5 billion report while the only
    disclosed ARR bound is below $10 million. The price-sensitive recommendation is
    research-more: require current economics, a reconciled cap table, and blinded
    validation before underwriting a premium entry.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The public record supports interest, not a priced investment decision. Fortune
      reported that Aaru's December Series A carried a $1 billion headline valuation,
      used multiple pricing tiers, and was completed while annual recurring revenue was
      below $10 million. On that disclosed bound, the headline price exceeded 100 times
      ARR; the blended round price was lower but remains undisclosed. Redpoint later
      announced an $80 million Series A, while April coverage cited a $1.5 billion
      valuation and roughly $94 million raised. Those figures do not reconcile into a
      current cap-table value, and funding raised is not cash available. The appropriate
      stance is therefore stretched and presently unpriceable. Proceed only to diligence,
      not commitment, until management supplies current ARR, growth, retention, margin,
      burn, cash, preferences, ownership, and a fully diluted capitalization table.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008]
    tableRefs: [TV001]
  - id: thesis-anti-thesis-and-proof
    title: Thesis, anti-thesis, and quality of proof
    body: >-
      The thesis is that Aaru may compress expensive research cycles and distribute
      through large professional-services and advertising channels. EY describes a
      one-day recreation of a six-month, 3,600-investor study across more than 30
      markets, with simulation results correlated over 90% to the survey. Fortune also
      identifies a broad set of enterprise relationships, and Research Live describes
      Accenture Song integrating Lumen into client work. The anti-thesis is equally
      material: EY explicitly says simulation cannot guarantee future behavior, Fortune
      describes model-bias and hard-to-forecast cases, and Aaru's homepage labels an EY
      result as "100% Accuracy" without the denominator shown on that page. A competitor
      also warns that synthetic outputs remain directional. Premium valuation requires
      repeatable, independently blinded results rather than selected demonstrations.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenario-framework
    title: Scenario framework without false precision
    body: >-
      A numeric valuation range would be false precision because the retained public
      evidence lacks current revenue, growth, retention, gross margin, burn, cash,
      dilution, preference rights, and a verified current share price. The bull case
      requires third-party replication of the EY-style result, durable enterprise
      renewals, and economics that can support a premium software multiple. The base
      case assumes real demand and useful distribution partnerships but treats the
      disclosed financing marks as negotiation references rather than intrinsic value.
      The bear case activates if blinded tests fail to generalize, revenue remains small
      relative to the reported marks, or structured preferences shift downside to common
      holders. Probability signals are therefore qualitative and evidence-triggered;
      assigning percentages without operating data would overstate confidence.
    claimRefs: [CV001, CV002, CV003, CV005, CV009, CV010, CV012, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-final-diligence
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness is low despite strategic relevance. The company is young, has no
      public price list, and has not disclosed the growth metrics needed to test whether
      an eventual strategic sale or public-market path can clear the reported private
      marks. Before investment, obtain monthly ARR and bookings cohorts, logo and revenue
      retention, gross margin after model and data costs, burn and runway, customer
      concentration, partner-sourced revenue, the preference stack, and a fully diluted
      waterfall. Re-run at least three historical studies blind, including a known
      failure case, and compare results with human panels and observed outcomes. Break
      the thesis if blinded error materially worsens outside showcased domains, major
      customers do not renew, current economics cannot justify the blended Series A
      price, or preferences prevent a credible venture return at realistic exits.
    claimRefs: [CV002, CV007, CV010, CV013, CV014, CV015, CV016]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Decision field, Assessment, Evidence basis, Decision implication]
    rows:
      - [Recommendation, Research more, "External validation and enterprise relationships exist, but current economics and financing terms do not", "Advance only to confirmatory diligence"]
      - [Confidence, Medium-low, "Financing and benchmark reports are specific but incomplete and partly inconsistent", "Do not convert company quality into price confidence"]
      - [Risk rating, High, "Historical ARR was reported below $10M at a $1B headline mark, with model-generalization risk", "Require a large evidence and price margin of safety"]
      - [Valuation stance, "Stretched / unpriceable", "Reported marks range from a $1B headline Series A to a later $1.5B account", "Use the lower blended round price only after cap-table reconciliation"]
      - [Entry discipline, Conditional, "No public preference stack, current ARR, burn, cash, retention, or fully diluted ownership", "No term sheet until the data room closes these gaps"]
    notes: "Assessments use reported private-round marks and a historical ARR upper bound; they are not a current fair-value estimate, and funding raised is not treated as cash available."
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [View, Argument, Public evidence, What would change the view]
    rows:
      - [Thesis, "Simulation can shorten research cycles", "EY describes one day versus six months and over 90% correlation on a 3,600-investor study", "Independent blind replications across multiple use cases"]
      - [Thesis, "Enterprise channels may accelerate distribution", "Fortune names major customers and partners; Research Live describes Accenture Song integration", "Renewal, expansion, and partner-sourced revenue cohorts"]
      - [Anti-thesis, "The entry mark outruns disclosed economics", "Fortune reports sub-$10M ARR at the $1B headline Series A valuation", "Current audited ARR, growth, retention, margin, and a materially lower effective entry price"]
      - [Anti-thesis, "Public validation labels are not fully reconcilable", "Aaru displays 100% accuracy while EY reports over 90% correlation and cautions that behavior is uncertain", "A preregistered benchmark with definitions, denominators, and failure cases"]
    notes: "The EY material is customer evidence, Redpoint is investor-issued, and the Minds comparison is competitor-issued; none is treated as an independent benchmark."
    claimRefs: [CV002, CV009, CV010, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Explicit assumptions, Valuation and return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Blind validation generalizes; enterprise renewals and margins are strong; channels scale efficiently", "A premium could become supportable, but no numeric range is defensible until current economics and ownership are disclosed", "Low until independent replication and cohorts arrive", "Failed cross-domain replication or weak expansion"]
      - [Base, "Product utility is real, partnerships contribute pipeline, and economics remain undisclosed", "Anchor negotiation below the undisclosed blended Series A price rather than the $1B-$1.5B headlines", "Most consistent with the current mixed evidence", "ARR and retention fail to close the gap to the private marks"]
      - [Bear, "Bias, generalization, concentration, or preference overhang impairs outcomes for common holders", "Decline the round until a price reset or protective terms create venture-return capacity; no numeric floor is supportable", "Rises if diligence reveals weak renewals or structured downside", "Blinded errors widen, key customers churn, or preferences dominate proceeds"]
    notes: "Scenarios are conditional frameworks, not forecasts; no probabilities, exit multiples, or valuation ranges are invented where the public denominators are missing."
    claimRefs: [CV001, CV002, CV003, CV005, CV007, CV009, CV010, CV012, CV015, CV016]
