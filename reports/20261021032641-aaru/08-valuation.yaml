callouts:
  - calloutType: recommendation
    title: Price-sensitive call
    body: >-
      Research more rather than buy the headline. A materially lower effective entry
      price can improve the risk-reward, but only current cohort economics, validated
      model performance, and the actual preference waterfall can define how much lower.
    claimRefs: [CV002, CV003, CV007, CV009, CV010, CV015, CV016]
