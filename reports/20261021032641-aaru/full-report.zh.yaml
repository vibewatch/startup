            title: 头条估值不是混合入场价格
            body: 公开报道同时提到多层结构、头条估值 10 亿美元的 Series A，以及之后 15 亿美元的估值，但没有披露混合价格、优先股堆叠、稀释或投资者权利。
            calloutType: risk
