chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与经营模式
        blocks:
          - type: paragraph
            body: >-
              Aaru 于 2024 年 3 月由 Cameron Fink、Ned Koh 和 John Kessler 创立；2026 年 5
              月的一篇报道称其总部位于纽约市。公司将产品描述为基于真实世界行为和结果的模拟人群：客户在模型中调整产品、价格、信息或策略，再在投入市场前评估预测行为。公司公开的用例覆盖产品创新、营销与品牌、受众细分、情景规划和战略传播。由此看，Aaru
              更像一家靠人工接洽获客的企业研究与决策支持供应商，而不是自助式调研工具；竞争对比显示，Aaru
              不公开定价。公开来源描绘了雄心勃勃的经营主张，但没有披露足以判断当前规模所需的经常性收入基础、客户数、员工数或单位经济。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO015
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO015
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              三位创始人仍是外部可见的领导核心。二手报道分别将 Cameron Fink、Ned Koh 和 John Kessler 认定为 CEO、总裁和
              CTO。权力集中让公司保持清晰的创始人主导结构，也使商业、经营和技术权责与创始团队一致；但这同时带来关键人物风险：现有证据没有列出董事会、独立董事、财务负责人、法务负责人或更完整的高管梯队。公开记录支持创始人的身份及据报道的职务，却不足以证明治理和继任深度已达到机构化成熟水平。确认董事会构成、授权边界、创始人归属安排和继任覆盖仍是直接的尽调要求。
            claimRefs:
              - CO001
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO005
      - number: '1.3'
        title: 融资与利益相关方
        blocks:
          - type: paragraph
            body: >-
              融资报道显示增长速度惊人，但必须区分指标口径。The Agent Times 于 2026 年 4 月报道估值 15 亿美元、累计融资约 9400 万美元，并明确称后者为公司自报；两者都不能证明可用现金。对于
              2025 年 12 月的 Series A，Nextomoro 报道称该轮由 Redpoint 领投、金额超过 5000 万美元，采用多层结构，头条估值 10 亿美元；Minds 则报道 Series A 为
              8000 万美元。这些是披露细度不同的数字，并非可以直接比较的审计数据，混合入场价格仍未披露。Nextomoro 还将 A*、Abstract Ventures、Felicis、General
              Catalyst、Accenture Ventures 和 Z Fellows 列为早期出资方。另据 Research Live，Accenture Ventures 确实投资，但金额未披露；该报道还称
              Accenture Song 计划整合 Aaru 的 Lumen 模型。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
