  - id: TV003
    title: 乐观、基准和悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 盲测验证可泛化；企业续约和利润率强劲；渠道高效扩张
        - 溢价可能具备支撑，但在当前经济数据和持股披露之前，无法为任何数值区间提供依据
        - 在独立复现和客户队列出现前，概率低
        - 跨领域复现失败或扩张能力弱
      - - 基准
        - 产品效用真实，合作伙伴贡献管线，但经济数据仍未披露
        - 以未披露的混合 Series A 价格以下作为谈判锚点，而不是 $1B–$1.5B 的头条估值
        - 与当前混合证据最一致
        - ARR 和留存无法填平与私募估值之间的差距
      - - 悲观
        - 偏差、泛化、集中度或优先清算悬置风险损害普通股持有人的结果
        - 在价格重置或保护性条款创造风险投资回报空间前，拒绝参与该轮；无法支持任何数值底价
        - 若尽调发现续约疲弱或存在结构性下行，概率上升
        - 盲测错误扩大、关键客户流失，或优先股堆叠吞噬大部分收益
    notes: 这些情景是有条件的分析框架，不是预测；公开分母缺失时，不虚构概率、退出倍数或估值区间。
