      - number: '1.4'
        title: 里程碑、验证点与待尽调事项
        blocks:
          - type: paragraph
            body: >-
              Aaru 的公开证明故事由选举模拟、战略分销和供应商发布的验证组成。Research Live 报道称，Aaru 将 2024 年 6 月纽约民主党初选预测到误差 371 票以内，并将该结果归于
              Semafor。2025 年，Accenture 将投资与拟议的 Lumen 集成结合起来；同年 12 月的融资让 Aaru 获得了报道中的独角兽头条估值。到 2026 年 4 月，二手报道称估值为 $1.5
              billion。随后，一家竞争对手将 Aaru 2026 年 9 月的验证研究概括为：在 2,993 个问题上，平均绝对误差 3.53 分、Pearson 相关系数
              0.970；同时它正确指出结果由供应商发布，并建议进行盲测试点。因此，证据支持商业和技术势头，但不能独立证明模拟结果能跨客户人群泛化，或能替代真实人类行为。
            claimRefs:
              - CO006
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
