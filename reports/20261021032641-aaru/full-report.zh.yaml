              - CR006
              - CR008
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把成功基准当作普遍验证
            body: EY 结果是有用的合作伙伴证据，但其人群、问题和相关性指标不能证明另一项决策的准确率。应要求投资者选择的盲留出测试，并在看到结果前固定验收标准。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
          - type: callout
            title: 明确私有尽调条件
            body: 投资判断应以数据权利文件、任务特定验证、合作伙伴集中度、客户和收入质量、现金与消耗、到下一里程碑的跑道以及关键人物连续性为前提。
            calloutType: recommendation
            claimRefs:
