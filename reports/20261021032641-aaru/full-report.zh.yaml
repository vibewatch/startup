      - number: '7.4'
        title: 合作伙伴、财务与执行风险
        blocks:
          - type: paragraph
            body: >-
              Accenture 提供资本、分销和战略指导：其公告称投资将支持扩张，并称 Accenture Song 高管成为战略顾问；Research Live 则报道 Song 将把 Aaru 的 Lumen
              模型整合到其方案中。这是有意义的验证，但也带来依赖问题，因为公开证据没有披露合作伙伴来源收入、集中度、最低承诺、排他性或终止权。EY
              提供了第二个重要验证关系，但其公开测试仍是合作伙伴证据，而非独立同行评审。资料池不足以判断财务韧性：Accenture
              投资金额未披露，信誉较弱的报道也没有具体公开增长指标。管理层应提供按合作伙伴拆分的管道和收入、现金、消耗、到下一里程碑的跑道、服务产能、关键人物覆盖和合作伙伴流失后的连续性计划；无法提供就应触发论点失效。
            claimRefs:
              - CR006
              - CR008
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
