  - id: FM001
    title: 合成行为模拟的采用证据层级
    type: pyramid
    summary: 从底层的探索性使用到顶层的高风险部署，证据要求逐步收紧。
    data:
      items:
        - label: 探索性情景生成
          value: Lowest evidentiary threshold
          detail: 用合成输出生成假设、比较方向，但不要用来证明需求。
        - label: 历史盲测回放
          value: Known outcome
          detail: 测试一项在模型设置时被隐藏的过往调查或观测结果。
        - label: 领域专项校准
          value: Comparable population and task
          detail: 要求针对买方自身结果类型、细分群体和地理区域的表现证据。
        - label: 现场试点
          value: Pre-agreed success criteria
          detail: 将预测与一手数据、实时测试或招募的实地研究进行比较。
        - label: 可重复的运营流程
          value: Budgeted and governed
          detail: 建立采购、数据权利、监测、续约和负责任的人审机制。
        - label: 高风险决策使用
          value: Highest evidentiary threshold
          detail: 保留实证验证，因为偏差、迁移和高方差行为仍是重大限制。
    approximationNotes: 仅表示定性采用层级；不代表 TAM、SAM、SOM、转化率或与价值成比例的层级大小。
