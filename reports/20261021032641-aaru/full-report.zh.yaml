          detail: 没有公开价目表；与买方协商
        - id: decision-design
          label: 目标、受众与问题
          detail: 客户决策标准定义工作范围
        - id: data-inputs
          label: 公开、许可和客户数据
          detail: 输入组合带来数据访问和治理工作
        - id: simulation
          label: 人群模拟
          detail: 算力和专业研究产出情景结果
        - id: validation
          label: 项目专项验证
          detail: 将输出与可获得的客户或观测证据进行比较
        - id: deliverables
          label: 可直接用于决策的交付物
          detail: 按协商订单提供报告和分析
        - id: fees
          label: 合同收入
          detail: 费用和计费基础未公开披露
        - id: gross-profit
          label: 扣除交付成本后的毛利
          detail: 在数据、算力和人工成本未知的情况下，利润率仍未知
      edges:
        - from: scoped-sale
          to: decision-design
        - from: decision-design
          to: data-inputs
        - from: data-inputs
          to: simulation
        - from: simulation
          to: validation
        - from: validation
          to: deliverables
        - from: deliverables
          to: fees
        - from: fees
          to: gross-profit
    approximationNotes: 仅为概念性流程；不是量化瀑布图，也不代表已披露的转化率、价格、成本或利润率。
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI014
  - id: FE001
    title: 公开披露的产品架构
    type: stack
    summary: 六个已披露层级将决策框架连接到经审阅的交付物，但关键实现细节仍属未公开信息。
    data:
      layers:
        - label: 目标
          name: Objectives
          detail: 明确决策选项、成功标准和约束。
          items:
            - 选项
            - 成功标准
            - 约束
        - label: 受众
          name: Audiences
          detail: 用人口统计和行为参数配置目标人群。
          items:
            - 细分群体
            - 硬参数
            - 行为描述
        - label: 证据
          name: Evidence
          detail: 对公开、获许可和可获得的客户信号进行加权。
          items:
            - 公共记录
            - 许可数据
            - 客户数据
        - label: 人群模型
          name: Population model
          detail: 学习受支持的特征关系，并抽样生成完整画像。
          items:
            - 联合特征
            - 学习网络
            - 抽样画像
        - label: 模拟与验证
          name: Simulation and validation
          detail: 应用问题或干预措施，并将输出与限定范围的证据比较。
          items:
            - 问题
            - 假设情景
            - 留出集
        - label: 交付物
          name: Artifacts
          detail: 生成分布、管理层摘要和交互式结果体验。
          items:
            - 分布
            - 报告
            - 交互式输出
    approximationNotes: 这是对已披露工作流层级的综合，不是对内部软件服务、物理基础设施或数据安全边界的声明。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE005
      - CE007
      - CE013
  - id: FU001
    title: 企业客户旅程与扩张闭环
    type: journey-map
    summary: 公开证据支持一条范围明确、以验证为先的企业旅程，既有直销扩张路径，也有合作伙伴扩张路径，但没有量化转化率或留存率。
    data:
      nodes:
        - id: need
          label: 明确一项重要决策
          detail: 企业、政策或研究团队确定产品、价格、营销活动或情景决策。
        - id: scope
          label: 界定目标和受众
          detail: Aaru 明确决策标准、受众参数、问题、刺激材料和约束。
        - id: ground
          label: 为模拟世界提供基础
          detail: 公开、获许可和可获得的客户数据，将模型收窄到具体决策场景。
        - id: run
          label: 运行人群模拟
          detail: 在建模人群中测试问题和情景，产出分布，而非对个体作出承诺。
        - id: validate
          label: 与已知结果验证
          detail: 潜在客户可以先用历史调查或结果进行盲测重跑，再扩大采用范围。
        - id: expand
          label: 直销扩张或通过合作伙伴进入
          detail: 成功项目可以扩展到更多决策，也可以通过 Accenture 等合作伙伴进入企业工作流；公开转化率和续约率不可得。
    approximationNotes: 有序阶段综合了公开工作流；不代表实测转化率、经过时间或共同客户队列。
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU012
      - CU015
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 这是对剩余风险敞口的证据驱动定性排序；当指定公开证据池没有频率或集中度分母时，可能性仍未知。
    data:
      columns:
        - id: likelihood
          label: 可能性
          detail: 观测频率或基于证据的定性可能性
        - id: impact
          label: 影响
          detail: 对客户决策和投资价值的潜在影响
        - id: mitigation
          label: 缓解措施成熟度
          detail: 指定公开证据中可见的控制措施
      rows:
        - label: 超出范围的模型有效性
          note: 公开基准无法证明模型适用于每类受众或每种决策。
          values:
            - value: Medium
              detail: Aaru 及其合作伙伴承认不确定性和范围依赖。
            - value: High
              detail: 错误预测可能影响资本、定价或声誉。
            - value: Developing
              detail: 已描述内部留出集和项目验证。
        - label: 数据权利与隐私
          note: 指定证据池中没有一手法律控制材料。
          values:
            - value: Unknown
              detail: 无法确认事故或违规率。
            - value: High
              detail: 模型使用公开、获许可和客户数据。
            - value: Unverified
              detail: 已描述来源评估，但未描述法律控制措施。
        - label: 输入偏差与覆盖漂移
          note: Aaru 明确表示，缺口、更新频率和偏差会进入模型限制。
          values:
            - value: Medium
              detail: 该限制固有存在，但发生频率未公开。
            - value: High
              detail: 稀疏输入可能扭曲细分群体层面的决策。
            - value: Developing
              detail: 已描述加权、留出集和限制披露。
        - label: 战略合作伙伴集中度
          note: Accenture 同时承担资本、顾问、集成和分销角色。
          values:
            - value: Unknown
              detail: 收入和管线集中度未披露。
            - value: High if material
              detail: 失去合作伙伴可能影响资本和市场进入路径。
            - value: Unverified
              detail: 未公开合作伙伴流失后的连续性计划。
        - label: 财务韧性
          note: 投资金额、增长指标、烧钱速度、现金和现金跑道尚未确定。
          values:
            - value: Unknown
              detail: 公开证据池缺少当前财务报表。
            - value: High
              detail: 现金跑道不足可能限制验证和企业交付。
            - value: Unverified
              detail: 未保留融资或现金跑道缓解措施。
        - label: 团队与交付能力
          note: Aaru 形容自己是小团队，并列出四个开放职位。
          values:
            - value: Unknown
              detail: 员工人数、离职率和服务负载未公开。
            - value: Medium-high
              detail: 企业快速扩张可能使控制和支持承压。
            - value: Unverified
              detail: 未保留人员深度和继任控制措施。
    approximationNotes: 仅作定性定位；指定证据中没有数值概率、损失估计、事故率或集中度分母。
    claimRefs:
      - CR002
      - CR003
      - CR007
      - CR010
      - CR011
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 证据从已展示的使用和分销，转向尚未解决的经济数据、指标风险，以及“继续研究”的决策。
    data:
      nodes:
        - id: validation
          label: 客户验证
          detail: EY 报告一项 3,600 名投资者研究的相关性超过 90%，研究在一天内完成。
        - id: distribution
          label: 企业分销
          detail: Accenture Song 集成和已点名的企业关系支持渠道论点。
        - id: caveat
          label: 行为不确定性
          detail: EY 表示模拟无法保证未来行为，Fortune 则描述了偏差和预测限制。
        - id: economics
          label: 经济数据缺口
          detail: 唯一公开的 ARR 上限是低于 $10M，且对应报道中的对外公布的 $1B Series A 估值。
        - id: terms
          label: 价格与条款缺口
          detail: 保留证据未披露混合估值、优先权、稀释、现金和持股。
        - id: decision
          label: 继续研究
          detail: 在投资判断前要求对账后的经济数据、盲测验证和价格保护。
    approximationNotes: null
    claimRefs:
      - CV002
      - CV003
      - CV007
      - CV009
      - CV010
      - CV012
      - CV013
      - CV015
      - CV016
