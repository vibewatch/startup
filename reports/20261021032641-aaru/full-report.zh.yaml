  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Aaru 所处市场比全部市场调研或全部企业 AI
              更窄。产品针对一个明确决策，模拟人群反应，包括产品概念、定价、定位、广告、政策或选举情景。因此，纳入的支出是研究、战略、创新和预测预算中用于在决策前预判群体行为的部分。直接的现状替代方案包括调查、样本面板、焦点小组、代理机构、历史数据外推和内部判断。相邻支出包括受众细分、情景规划和战略传播，但不包括通用分析、媒体采买、CRM，以及必须以招募真人作为最终证据标准的研究。Aaru
              及其投资方强调速度和迭代是切入口，而独立来源和竞争对手则强调，模拟输出除非与观察行为进行基准对照，否则只能提供方向性参考。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM016
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM016
      - number: '2.2'
        title: 避免虚假精确的市场规模测算
        blocks:
          - type: paragraph
            body: >-
              保留的八个来源中，没有一个为 Aaru 的精确品类提供透明的市场价值、支出基础、增长率或自下而上的客户数。广义合成数据、生成式 AI 和全球市场调研总额都包含 Aaru 无法覆盖的大量支出，直接套用会夸大
              TAM。现有量化证据更像一组采用与验证数据：EY 的复现研究覆盖 30 多个市场的 3,600 名投资者；纽约选举模拟覆盖近 200 万名选民；TechCrunch 报道称 2025 年 12 月 ARR 低于
              $10 million。这些数字说明覆盖范围，不是可触达收入。要得出站得住脚的 SAM，需要客户级定价、年度研究量、符合条件的企业数，以及能通过特定领域验证的工作流占比。SOM
              还需要产能、销售周期、续约和合作伙伴来源的管道数据，而这些都未公开。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM014
              - CM015
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开证据指向企业和机构采购，而不是自助式研究软件。可能的经济买方位于战略、创新、营销、洞察或公共事务领导层；日常用户是研究员、策略师、创意人员和分析师；采购、法务、隐私和模型风险团队则可能卡住部署。Accenture
              关系具有战略重要性，因为 Accenture Song 表示会在产品开发、营销、客户战略和客户服务中整合 Aaru
              的私营部门模型。这为进入现有预算提供了合作伙伴路径，但公开证据没有区分直接需求和合作伙伴带来的需求。最合理的采用路径，是先针对已知历史结果开展范围明确的试点；如果模型达到事先约定的准确率和治理标准，再扩展为定制项目。由于没有公开定价，预算归属和采购摩擦仍是重要尽调问题。
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
              - CM011
      - number: '2.4'
        title: 增长驱动、约束与估值关联
        blocks:
          - type: paragraph
            body: >-
              需求逻辑建立在更快迭代、每个情景更低的边际成本、触达难以调研的人群，以及客户对自报意图的不满之上。知名企业、代理合作伙伴和公开验证案例可以加速信任建立。约束同样关键：模型偏差可能抹平少数群体视角，训练数据可能不完整或更新不规律，行为未必能跨领域迁移，即使数据很多，高方差个体仍可能无法预测。公开报道还对一次选举结果究竟在
              2,000 票以内还是 371
              票以内存在冲突，因此需要统一指标定义。就估值而言，只有当试点转化为可重复、已有预算且具备样本外准确率测量的工作流时，这一品类才值得保留期权价值。在定价、续约、销售周期和品类支出证据披露前，不应拿市场规模为高倍数估值背书。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
              - CM013
              - CM014
              - CM016
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM008
              - CM012
              - CM013
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 没有站得住脚的公开 TAM
            body: 现有证据没有品类收入基础、符合条件的账户数、公开价格或购买频率，无法计算 TAM、SAM 或 SOM。直接套用广义 AI 或市场调研总额只会制造虚假精确。
            calloutType: risk
            claimRefs:
              - CM006
              - CM014
              - CM015
          - type: callout
            title: 合作伙伴分销可能是最快的预算桥梁
            body: Accenture Song 宣称将产品、营销、客户战略和服务整合起来，这可能把 Aaru 带入现有咨询和转型预算；但直接收入与合作伙伴来源收入的构成未披露。
            calloutType: insight
            claimRefs:
              - CM007
              - CM011
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 这是相互重叠的任务集合，而非一张同业名单
        blocks:
          - type: paragraph
            body: >-
              Aaru 最接近的直接品类是大规模人群模拟：官方材料称其用公开、许可和客户数据构建模拟人群；第三方和竞争对手来源则将 Simile 列为企业行为模拟同类。更广泛的买方选择没那么整齐。Ditto、Synthetic
              Users、Minds、FishDog 和 Qualtrics Edge 分别覆盖可复用合成人群、对话式探索、自助研究和调查栈增强等相邻任务。Highlight
              是另一种替代方案：由真人和实体产品参与、运营协助的研究。传统调查、焦点小组、内部数据科学开发，以及直接用历史数据做决定，仍是现状替代方案。这种按任务划分的框架很重要：选择快速概念筛选工具的买方，不一定会在同一批供应商中做选择；委托高风险人群预测的买方也一样。
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP008
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP005
              - CP007
              - CP010
              - CP011
              - CP012
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP007
              - CP008
              - CP009
              - CP012
              - CP013
      - number: '3.2'
        title: 差异化最强在于人群建模，但信任决定是否购买
        blocks:
          - type: paragraph
            body: >-
              Aaru 的已披露工作流比通用人格聊天机器人更具体：它联合建模各项特征，针对个体效应和总体分布训练，抽样完整画像，并将结果呈现为人群分布，而不是对具体个人作出承诺。公司也发布了 EY
              复现结果，但现有证明仍由公司提供，应视为供应商基准，而非独立验证。竞争对手强调的信任机制各不相同，包括自助检查、研究方法模块、与成熟调查运营的集成，以及让真人使用产品。             
              保留证据中最一致的不利信号来自方法论：合成输出适合生成假设和早期筛选，但高风险定价、需求、实体产品和上市决策仍需实证验证。因此，真人研究和混合工作流仍在竞争范围内，并没有被排除。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP008
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
              - CP008
              - CP016
      - number: '3.3'
        title: 分销可能比功能广度更重要
        blocks:
          - type: paragraph
            body: >-
              Aaru 与 Accenture
              的关系可能为进入企业产品、营销、客户战略和服务工作创造有意义的路径。它可以降低接触买方的摩擦，把模拟引擎嵌入更大的咨询工作流；但也会让合作伙伴经济性、账户控制权和对服务的依赖成为重要尽调问题。现有渠道构成反制：Qualtrics
              可以把合成人群放进既有研究栈，内部团队也可以组合基础模型、许可数据和传统面板，而不必新增战略供应商。商业透明度较弱。竞争对手页面称 Aaru 通过人工接洽销售且不公开定价，而 Minds
              则宣传自助价格。这些并非可直接比较的实际成交价，却展示了范围明确的企业项目与部门即时采用之间的采购差异。
            claimRefs:
              - CP004
              - CP009
              - CP013
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP009
              - CP013
      - number: '3.4'
        title: 壁垒依赖校准证据和嵌入式工作流，而不只是智能体
        blocks:
          - type: paragraph
            body: >-
              基础模型访问和多智能体编排不太可能构成充分防线，因为相邻供应商已经声称拥有类似的合成人格和模拟能力。Aaru
              更持久的优势需要专有行为数据权利、针对留出结果的可重复校准、客户专属集成，以及能积累学习或转换成本的分销。保留来源展示了这套逻辑的部分环节，却没有完整链条：Aaru 描述了许可和客户数据，Research
              Live 记录了 Accenture
              集成，其网站发布了验证案例。但它们没有披露留存、迁移成本、排他数据权利、实际定价或独立的正面对比准确率。竞争对手撰写的比较也有明显利益动机，不能证明优势。实际替代风险是双向的：模拟专家可能逐渐追上 Aaru
              的技术主张；重视采购熟悉度或真实结果、而非最大速度的客户，则可能被现有供应商和混合真人研究供应商拿下。
            claimRefs:
              - CP002
