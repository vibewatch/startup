  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              公开记录支持市场兴趣，不支持已定价的投资决策。Fortune 报道 Aaru 的 12 月 Series A 采用多档定价，              头条估值为 $1 billion，完成时 ARR 低于
              $10 million。按这一已披露边界，头条价格超过 ARR 的 100 倍；混合轮次价格较低，但仍未披露。Redpoint 随后宣布 $80 million Series A，而 4 月报道提到估值 $1.5
              billion、融资约 $94 million。这些数字无法汇总为当前的股权结构表价值，已融资额也不等于可用现金。因此，恰当判断是估值偏高且目前无法定价。只有在管理层提供当前
              ARR、增长、留存、利润率、消耗、现金、优先权、持股和完全稀释资本表前，才应继续尽调，不应承诺投资。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV015
              - CV016
      - number: '8.2'
        title: 论点、反论点与证明质量
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Aaru 可能压缩昂贵的研究周期，并通过大型专业服务和广告渠道分发。EY 描述了一项一天完成、原本需六个月的研究复现，覆盖 30 多个市场的 3,600 名投资者，模拟结果与调查结果的相关性超过
              90%。Fortune 还列出一组广泛的企业关系，Research Live 则描述 Accenture Song 将 Lumen 集成到客户工作中。反论点同样重要：EY
              明确表示模拟不能保证未来行为，Fortune 描述了模型偏差和难以预测的案例，而 Aaru 首页把一项 EY 结果标成“100%
              Accuracy”，但页面未显示分母。竞争对手也警告合成输出仍具方向性。溢价估值需要可重复、独立盲测的结果，而不是精选演示。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV009
              - CV010
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 避免虚假精确的情景框架
        blocks:
          - type: paragraph
            body: >-
              量化估值区间会制造虚假精确，因为保留的公开证据缺少当前收入、增长、留存、毛利率、消耗、现金、稀释、优先权以及经验证的当前股价。乐观情景要求第三方复现 EY
              式结果、企业续约持久，并形成足以支撑软件溢价倍数的经济性。基准情景假设真实需求和有用的分销伙伴，但把已披露融资标记视为谈判参考，而非内在价值。悲观情景在盲测无法泛化、收入相对报道估值仍很小，或结构化优先权把下行风险转嫁给普通股股东时启动。因此，概率信号只能定性且由证据触发；没有经营数据就给出百分比，会夸大信心。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV010
              - CV012
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV009
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              尽管具有战略相关性，退出准备度仍低。公司成立时间短，没有公开价目表，也没有披露足以检验未来战略出售或公开市场路径能否承受当前私有市场标记的增长指标。投资前，应取得月度 ARR
              和订单客户群、客户数与收入留存、扣除模型和数据成本后的毛利率、消耗和跑道、客户集中度、合作伙伴来源收入、优先股堆叠以及完全稀释的瀑布表。至少盲测复跑三项历史研究，其中包括一个已知失败案例，并与真人面板和观察结果比较。如果盲测误差在展示领域之外明显恶化、主要客户不续约、当前经济性无法支撑混合
              Series A 价格，或优先权让现实退出下无法获得可信的风险投资回报，论点就应失效。
            claimRefs:
              - CV002
              - CV007
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 先继续研究，不要买入头条叙事。有效入场价格显著下降可以改善风险回报，但下降多少只能由当前客户群经济性、已验证的模型表现和实际优先权瀑布表决定。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV009
              - CV010
              - CV015
              - CV016
