      - ["Large enterprises", "Strategy or innovation executive", "Insights and analytics team", "Enterprise operating budget", "Test product, price, or expansion scenarios", "Strategy, innovation, or product", "Blind replay against a known historical result"]
      - ["Advertising and marketing organizations", "CMO or agency strategy leader", "Strategists, creatives, and researchers", "Brand or client-services budget", "Test messages, audiences, and campaign concepts", "Marketing, insights, or agency account", "Faster iteration than recruited panels"]
      - ["Consultancies and systems integrators", "Practice or offering leader", "Consultants and data scientists", "Partner offering or client engagement", "Embed simulation in advisory delivery", "Practice P&L or client budget", "Reusable capability integrated into an existing service"]
      - ["Political campaigns and public affairs", "Campaign or public-affairs leadership", "Pollsters and strategists", "Campaign or program budget", "Model voter or constituent response", "Campaign manager or public-affairs lead", "Out-of-sample accuracy on a comparable contest"]
      - ["Government and institutions", "Policy or program executive", "Policy analysts and researchers", "Program, research, or procurement budget", "Evaluate response to policy scenarios", "Agency or institutional program owner", "Documented governance, data provenance, and domain validation"]
    notes: "Roles and budget ownership are inferred from published use cases and customer types; exact buyer titles, contract owners, and procurement paths remain undisclosed."
    claimRefs: [CM002, CM005, CM006, CM007, CM011]
figures:
  - id: "FM001"
    title: "Adoption evidence hierarchy for synthetic behavioral simulation"
    type: "pyramid"
    summary: "Evidence requirements tighten from exploratory use at the base to high-stakes deployment at the apex."
    data:
      items:
        - label: "Exploratory scenario generation"
          value: "Lowest evidentiary threshold"
          detail: "Use synthetic output to generate hypotheses and compare directions, not to establish demand."
        - label: "Historical blind replay"
          value: "Known outcome"
          detail: "Test a past survey or observed result that was withheld from model setup."
        - label: "Domain-specific calibration"
          value: "Comparable population and task"
          detail: "Require performance evidence for the buyer's own outcome type, segment, and geography."
        - label: "Live pilot"
          value: "Pre-agreed success criteria"
          detail: "Compare predictions with first-party data, live tests, or recruited fieldwork."
        - label: "Repeatable operational workflow"
          value: "Budgeted and governed"
          detail: "Establish procurement, data rights, monitoring, renewal, and accountable human review."
        - label: "High-stakes decision use"
          value: "Highest evidentiary threshold"
          detail: "Retain empirical validation because bias, transfer, and high-variance behavior remain material limits."
    approximationNotes: "Qualitative adoption hierarchy only; no TAM, SAM, SOM, conversion rate, or value-proportional layer size is implied."
    claimRefs: [CM004, CM008, CM012, CM013, CM016]
callouts:
  - calloutType: "risk"
    title: "No defensible public TAM"
    body: >-
      The assigned evidence contains no category revenue base, eligible-account count,
      public price, or purchase frequency from which to calculate TAM, SAM, or SOM.
      Broad AI or market-research totals would create false precision.
    claimRefs: [CM006, CM014, CM015]
  - calloutType: "insight"
    title: "Partner distribution may be the fastest budget bridge"
    body: >-
      Accenture Song's stated integration across product, marketing, customer strategy,
      and service can place Aaru inside existing advisory and transformation budgets,
      although the direct-versus-partner revenue mix is not disclosed.
    claimRefs: [CM007, CM011]
