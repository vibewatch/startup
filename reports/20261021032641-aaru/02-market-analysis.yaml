company:
  name: "Aaru"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Aaru is best bounded as an enterprise behavioral-simulation and synthetic-research
    product competing with surveys, panels, focus groups, historical-data analysis, and
    internal forecasting. Public evidence supports buyer interest and several validation
    cases, but it does not support a defensible dollar TAM, SAM, or SOM.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitutes"
    body: >-
      Aaru's relevant market is narrower than all market research or all enterprise AI.
      The product models population responses to a defined decision: product concepts,
      pricing, positioning, advertising, policy, or electoral scenarios. Included spend
      is therefore the portion of research, strategy, innovation, and forecasting budgets
      used to anticipate group behavior before a decision. The direct status quo includes
      surveys, panels, focus groups, agencies, historical-data extrapolation, and internal
      judgment. Adjacent spend includes audience segmentation, scenario planning, and
      strategic communications, but excludes general-purpose analytics, media buying, CRM,
      and research that requires recruited humans as the final evidentiary standard.
      Aaru and its investor describe speed and iteration as the wedge, while independent
      and competitor sources emphasize that simulated output remains directional unless
      benchmarked against observed behavior.
    claimRefs: [CM001, CM002, CM004, CM016]
    tableRefs: [TM001]
  - id: "sizing-without-false-precision"
    title: "Sizing without false precision"
    body: >-
      None of the eight retained sources provides a transparent market value, spend base,
      growth rate, or bottom-up customer count for Aaru's precise category. Broad synthetic
      data, generative AI, and global market-research totals would include substantial spend
      that Aaru cannot address and would overstate TAM. The available quantitative evidence
      is instead an adoption-and-validation set: an EY recreation covered 3,600 investors
      across more than 30 markets; a New York election simulation modeled nearly two million
      voters; and TechCrunch reported that ARR was below $10 million in December 2025.
      These figures demonstrate scope, not addressable revenue. A defensible SAM requires
      customer-level pricing, annual study volume, eligible enterprise counts, and the share
      of workflows that can pass domain-specific validation. SOM additionally requires
      capacity, sales-cycle, renewal, and partner-sourced pipeline data that are not public.
    claimRefs: [CM008, CM009, CM010, CM014, CM015]
    tableRefs: [TM002]
  - id: "buyers-and-adoption"
    title: "Buyers, users, payers, and adoption path"
    body: >-
      Public evidence points to enterprise and institutional buying rather than a
      self-serve research-software motion. Likely economic buyers sit in strategy,
      innovation, marketing, insights, or public-affairs leadership; day-to-day users are
      researchers, strategists, creatives, and analysts; procurement, legal, privacy, and
      model-risk teams can gate deployment. The Accenture relationship is strategically
      important because Accenture Song said it would integrate Aaru's private-sector model
      across product development, marketing, customer strategy, and customer service. That
      creates a partner-led route into existing budgets, but public evidence does not
      separate direct from partner-sourced demand. Adoption is most plausible as a scoped
      pilot against a known historical outcome, followed by a custom engagement if the model
      meets pre-agreed accuracy and governance criteria. No public pricing means budget
      ownership and procurement friction remain material diligence questions.
    claimRefs: [CM003, CM005, CM006, CM007, CM011]
    tableRefs: [TM003]
  - id: "drivers-constraints-and-valuation"
    title: "Growth drivers, constraints, and valuation relevance"
    body: >-
      The demand case rests on faster iteration, lower marginal cost per scenario, access
      to difficult-to-survey populations, and dissatisfaction with self-reported intent.
      Named enterprises, agency partners, and public validation cases can accelerate trust.
      The constraints are equally central: model bias can flatten minority perspectives,
      training data can be incomplete or irregular, behavior may not transfer across
      domains, and some high-variance individuals remain unpredictable even with extensive
      data. Public accounts also conflict on whether one election result was within 2,000
      votes or 371 votes, so metric definitions need reconciliation. For valuation, the
      category deserves optionality only if pilots convert into repeatable, budgeted
      workflows with measured out-of-sample accuracy. Until pricing, renewal, sales-cycle,
      and category-spend evidence are disclosed, market size should not be used to justify
      a premium multiple.
    claimRefs: [CM008, CM009, CM010, CM012, CM013, CM014, CM016]
    figureRefs: [FM001]
