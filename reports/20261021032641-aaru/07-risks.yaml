    notes: >-
      Severity reflects potential decision impact, not a measured incident rate; the sources
      disclose method limitations and selected controls but not production incident frequency,
      security certifications, uptime, or staffing capacity.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR009, CR010, CR016]
  - id: "TR003"
    title: "Partner and dependency risk register"
    columns:
      - "Dependency / counterparty"
      - "Role"
      - "Concentration evidence"
      - "Failure scenario"
      - "Severity"
      - "Visible mitigation"
      - "Residual exposure / diligence path"
    rows:
      - - "Capital and strategic advice / Accenture"
        - "Investor; Accenture Song executive named as strategic adviser"
        - "Investment amount and governance rights not disclosed"
        - "Capital or strategic support is reduced"
        - "Medium-high"
        - "No continuity mitigation was public in the assigned pool"
        - "Obtain financing terms, rights, board/adviser scope, cash, burn, and runway"
      - - "Enterprise distribution and product integration / Accenture Song"
        - "Research Live reported integration of Lumen into Song offerings"
        - "Partner-sourced pipeline and revenue are not public"
        - "Channel priorities change or integration underperforms"
        - "High if concentration is material"
        - "Broader customer and partner set is asserted by profiles, not quantified"
        - "Test direct-versus-partner pipeline, concentration, exclusivity, renewals, and termination rights"
      - - "External validation / EY"
        - "Partner-published blinded wealth-study recreation"
        - "No independent replication share or benchmark mix disclosed"
        - "Headline result does not generalize to a new population or decision"
        - "High for credibility and renewal"
        - "Aaru describes engagement-specific validation"
        - "Require investor-selected blind holdouts across multiple use cases and an external methods review"
    notes: >-
      Public sources establish relationships and selected roles, not economics or
      concentration; severity is conditional on private partner and revenue data.
    claimRefs: [CR005, CR006, CR008, CR011, CR012, CR013, CR015]
figures:
  - id: "FR001"
    title: "Residual risk heatmap"
    type: "matrix"
    summary: >-
      Evidence-based qualitative ordering of residual exposure; likelihood remains unknown
      when the assigned public pool provides no frequency or concentration denominator.
    data:
      columns:
        - id: "likelihood"
          label: "Likelihood"
          detail: "Observed frequency or evidence-based qualitative likelihood"
        - id: "impact"
          label: "Impact"
          detail: "Potential effect on customer decisions and investment value"
        - id: "mitigation"
          label: "Mitigation maturity"
          detail: "Controls visible in the assigned public evidence"
      rows:
        - label: "Out-of-scope model validity"
          note: "Public benchmarks do not establish performance for every audience or decision."
          values:
            - value: "Medium"
              detail: "Aaru and partners acknowledge uncertainty and scope dependence."
            - value: "High"
              detail: "A wrong forecast can affect capital, pricing, or reputation."
            - value: "Developing"
              detail: "Internal holdouts and engagement validation are described."
        - label: "Data rights and privacy"
          note: "No primary legal-control artifact was present in the assigned pool."
          values:
            - value: "Unknown"
              detail: "No incident or violation rate is established."
            - value: "High"
              detail: "The model uses public, licensed, and customer data."
            - value: "Unverified"
              detail: "Source assessment is described; legal controls are not."
        - label: "Input bias and coverage drift"
          note: "Aaru expressly carries gaps, cadence, and bias into model limits."
          values:
            - value: "Medium"
              detail: "The limitation is inherent, but occurrence frequency is not public."
            - value: "High"
              detail: "Sparse inputs can distort segment-level decisions."
            - value: "Developing"
              detail: "Weighting, holdouts, and limitation reporting are described."
        - label: "Strategic-partner concentration"
          note: "Accenture has capital, advisory, integration, and distribution roles."
          values:
            - value: "Unknown"
              detail: "Revenue and pipeline concentration are not disclosed."
            - value: "High if material"
              detail: "A partner loss could affect capital and route to market."
            - value: "Unverified"
              detail: "No partner-loss continuity plan was public."
        - label: "Financial resilience"
          note: "Investment amount, growth metrics, burn, cash, and runway are not established."
          values:
            - value: "Unknown"
              detail: "The public pool lacks current financial statements."
            - value: "High"
              detail: "Insufficient runway could constrain validation and enterprise delivery."
            - value: "Unverified"
              detail: "No financing or runway mitigation was retained."
        - label: "Team and delivery capacity"
          note: "Aaru describes itself as a small team and lists four open roles."
          values:
            - value: "Unknown"
              detail: "Headcount, attrition, and service load are not public."
            - value: "Medium-high"
              detail: "Rapid enterprise scaling can strain controls and support."
            - value: "Unverified"
              detail: "Staffing depth and succession controls were not retained."
    approximationNotes: >-
      Qualitative placement only; no numeric probability, loss estimate, incident rate, or
      concentration denominator is available in the assigned evidence.
    claimRefs: [CR002, CR003, CR007, CR010, CR011, CR013, CR015, CR016]
callouts:
  - calloutType: "risk"
    title: "Do not treat a successful benchmark as universal validation"
    body: >-
      The EY result is useful partner evidence, but its population, questions, and
      correlation metric do not establish accuracy for a different decision. Require a
      blind, investor-selected holdout with acceptance criteria fixed before results are seen.
    claimRefs: [CR005, CR006, CR008, CR009]
  - calloutType: "recommendation"
    title: "Make private diligence conditions explicit"
    body: >-
      Underwriting should remain conditional on data-rights documentation, task-specific
      validation, partner concentration, customer and revenue quality, cash and burn,
      runway through the next milestone, and key-person continuity.
    claimRefs: [CR001, CR010, CR011, CR013, CR014, CR015, CR016]
