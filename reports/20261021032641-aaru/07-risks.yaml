      type: "mechanism"
      targets: ["contentRequirements/5"]
      status: "answered"
    - id: "QR007"
      question: "Could undisclosed burn, runway, growth, or concentration break the investment thesis?"
      type: "adverse"
      targets: ["contentRequirements/4", "contentRequirements/5"]
      status: "unresolved"
    - id: "QR008"
