        - "High"
        - "Developing: source weighting and limitation reporting are described"
        - "High for sparse or fast-changing audiences"
        - "Coverage by segment, source freshness, missingness, and sensitivity to source removal"
      - - "Aggregate fit masks subgroup or individual errors"
        - "Inherent; Aaru says it does not predict one person's next act"
        - "High for person-level or narrow-segment use"
        - "Developing: individual and population resolutions are trained together"
        - "Medium-high"
        - "Worst-segment error, calibration, and minimum subgroup sample/ground-truth coverage"
      - - "A benchmark is generalized beyond its audience, question format, or metric"
        - "Plausible; public examples use different correlation and overlap measures"
        - "High"
        - "Partial: engagement criteria and available customer evidence are compared"
        - "High without task-specific holdouts"
        - "Blind replication by use case; stop deployment when pre-agreed acceptance criteria fail"
      - - "Small-team capacity or key-person dependency impairs delivery and controls"
