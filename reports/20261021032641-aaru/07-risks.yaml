  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "legal-and-data-governance"
      missingEvidence: >-
        Data inventory, supplier and customer licenses, privacy impact assessments,
        retention/deletion controls, security certifications, regulator correspondence,
        litigation records, and IP chain-of-title.
      whyItMatters: >-
        Public descriptions of source assessment do not establish legal rights, privacy
        compliance, security maturity, or freedom to operate in each customer jurisdiction.
      diligencePath: >-
        Complete counsel-led legal, privacy, security, and IP review with samples of source
        contracts and controls mapped to each intended use case.
      relatedQuestionRefs: [QR002]
      relatedTableRefs: [TR001]
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-and-concentration-risk"
      missingEvidence: >-
        Current cash, accounting burn, runway, growth, gross margin, customer and partner
        concentration, contract terms, renewal evidence, service capacity, and financing rights.
      whyItMatters: >-
        Funding participation and partner announcements do not establish cash available,
        economic durability, operating capacity, or resilience to a partner loss.
      diligencePath: >-
        Review management accounts, bank evidence, cap table and financing documents,
        customer-level cohorts, partner contracts, pipeline attribution, staffing, and a
        milestone-based operating plan.
      relatedQuestionRefs: [QR007]
      relatedTableRefs: [TR003]
