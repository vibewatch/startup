evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Current ARR, recognized revenue, growth, net retention, gross margin, burn, runway, customer count, headcount, and
      ACV mix.
    whyItMatters: Without operating metrics, financing momentum cannot be translated into business quality or capital efficiency.
    diligencePath: >-
      Obtain monthly management accounts, cohort schedules, customer-level revenue, payroll roster, and cash forecast
      through the data room.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: Complete board, observer, executive, delegated-authority, and founder-succession roster.
    whyItMatters: >-
      The public record shows a founder-concentrated leadership team but cannot establish governance independence or
      succession resilience.
    diligencePath: Review the charter, bylaws, board minutes, committee mandates, executive roster, and succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: financing
    missingEvidence: >-
      Complete cap table, financing tranches, blended entry price, liquidation preferences, dilution, investor rights,
      debt, and secondary transactions.
    whyItMatters: >-
      Headline valuations and round totals do not reveal ownership, downside protections, or the effective investor
      entry price.
    diligencePath: Reconcile signed financing documents, capitalization records, funds-flow statements, and option-pool changes.
    relatedQuestionRefs:
      - QO004
      - QO006
      - QO009
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: >-
      Independent legal, regulatory, outage, security, and customer-reference diligence beyond the bounded public
      search.
    whyItMatters: >-
      No directly relevant incident source was retained, but that absence is not evidence that no incident or dispute
      exists.
    diligencePath: >-
      Run jurisdiction-specific litigation and regulatory searches, review security and outage logs, and conduct blinded
      customer references.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Public pricing, contract values, eligible-account counts, annual study frequency, sales capacity, conversion,
      renewal, and direct-versus-partner pipeline data.
    whyItMatters: Without these inputs, neither a bottom-up SAM nor an attainable SOM can be calculated without false precision.
    diligencePath: >-
      Request customer-level pricing bands, contract cohorts, pipeline by channel, renewal data, study frequency,
      delivery capacity, and a management-built market model with auditable assumptions.
    relatedQuestionRefs:
      - QM002
      - QM010
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: political-validation
    missingEvidence: >-
      A common metric definition and underlying result file reconciling the publicly reported 2,000-vote and 371-vote
      accuracy figures.
    whyItMatters: >-
      Election performance is used as category proof, so denominator or metric drift can overstate transferability and
      precision.
    diligencePath: >-
      Obtain the frozen pre-election forecast, timestamp, race definition, final-result dataset, error formula, and
      independent replication.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing-and-procurement
    missingEvidence: >-
      First-party pricing structure, implementation timeline, procurement requirements, economic buyer, and budget
      source by segment.
    whyItMatters: >-
      Adoption speed and reachable spend depend on contract friction and the budget category from which Aaru is
      purchased.
    diligencePath: >-
      Request anonymized order forms, recent win-loss analyses, sales-cycle distributions, buyer-title data, and
      implementation plans.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable scoped proposals showing Aaru and competitor list price, realized price, services content, term,
      discounts, and renewal mechanics.
    whyItMatters: >-
      Public list prices and contact-led sales models do not establish total cost, gross margin, or procurement friction
      for equivalent work.
    diligencePath: >-
      Issue one standardized RFP to Aaru, Simile, Minds, Qualtrics, and a human-research provider, then normalize
      deliverables and contract terms.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary financing documents or company confirmation reconciling the reported $50 million-plus and $80 million
      Series A figures.
    whyItMatters: >-
      Conflicting round sizes undermine competitor-scale comparisons and may reflect different definitions of committed,
      closed, or headline capital.
    diligencePath: Request the capitalization table, closing documents, tranche schedule, and company-approved financing chronology.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: validation
    missingEvidence: >-
      Independent, decision-specific head-to-head benchmarks using withheld outcomes, consistent populations, error
      definitions, and segment-level results.
    whyItMatters: >-
      Vendor claims use different tasks and metrics, so public accuracy figures cannot establish relative performance or
      a durable calibration moat.
    diligencePath: >-
      Run a blinded bake-off on prior studies and compare error distributions, failure modes, reproducibility, and
      performance by segment.
    relatedQuestionRefs:
      - QP007
      - QP009
    relatedTableRefs:
      - TP002
  - type: enumeration-incomplete
    severity: minor
    topic: competitive-landscape
    missingEvidence: >-
      Primary product, pricing, customer, and security documentation for each named competitor and internal-build
      alternative.
    whyItMatters: >-
      The allocated pool supports a representative job-based landscape but not an exhaustive vendor census or
      feature-by-feature certification.
    diligencePath: Collect official documentation and customer references for the final procurement shortlist before scoring vendors.
    relatedQuestionRefs:
      - QP001
      - QP003
      - QP008
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Monthly revenue, ARR definition and bridge, revenue mix, bookings, backlog, renewal, expansion, churn, customer
      concentration, and realized pricing by segment and channel.
    whyItMatters: >-
      These records determine whether negotiated engagements create recurring, diversified software revenue or primarily
      one-off project work.
    diligencePath: >-
      Obtain audited statements, the recurring-revenue schedule, anonymized invoices, CRM cohorts, and the top-20
      customer and partner concentration bridge for the last 24 months.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross margin by stream, compute and licensed-data cost per study, implementation hours, utilization, CAC, sales
      cycle, win rate, and payback by direct and partner channel.
    whyItMatters: >-
      Without these inputs, investors cannot determine whether revenue growth produces operating leverage or expands
      specialist delivery requirements.
    diligencePath: >-
      Reconcile project-level time, cloud, data, and third-party costs to the general ledger and match them to
      contract-level revenue and acquisition spend.
    relatedQuestionRefs:
      - QI003
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly net burn, committed hiring and data spend, debt or credit terms, downside plan,
      runway, use of funds, and the operating trigger for the next financing.
    whyItMatters: Funding raised is not cash available, and absent obligations prevent a defensible runway or dilution assessment.
    diligencePath: >-
      Review bank statements, the latest balance sheet, a 24-month cash forecast, debt agreements, board-approved hiring
      plan, and downside financing scenarios.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: customer-value
    missingEvidence: >-
      Independent customer ROI, repeat-purchase, decision-impact, and error-cost evidence tied to actual contract values
      and retained cohorts.
    whyItMatters: >-
      Validation accuracy and faster study execution do not by themselves show willingness to pay, renewal, realized
      savings, or avoided losses.
    diligencePath: >-
      Select a customer cohort for reference calls, compare pre- and post-Aaru research cost and cycle time, and
      reconcile claimed decisions to measured commercial outcomes.
    relatedQuestionRefs:
      - QI004
      - QI008
  - type: missing-source
    severity: material
    topic: security-privacy
    missingEvidence: >-
      Primary security and privacy documentation covering certifications, encryption, tenant isolation, retention,
      model-training use, subprocessors, and incident response.
    whyItMatters: >-
      Customer and licensed behavioral data may be sensitive, and the public workflow does not establish how those data
      are protected or governed.
    diligencePath: >-
      Obtain the security package, data-processing agreement, subprocessor list, retention schedule, architecture
      diagram, and latest independent penetration-test summary.
  - type: missing-source
    severity: material
    topic: reliability
    missingEvidence: >-
      Versioned service documentation, uptime history, latency and capacity benchmarks, support commitments, and a
      production incident record.
    whyItMatters: >-
      Partner integration and decision workflows require predictable availability and repeatability that product
      descriptions alone cannot demonstrate.
    diligencePath: >-
      Review twelve months of status history and support tickets, then reproduce a benchmark workload under the proposed
      service-level agreement.
  - type: private-evidence-only
    severity: material
    topic: benchmark-transferability
    missingEvidence: >-
      Customer-specific holdout packs and independent replications across interventions, subsegments, geographies, and
      failure cases outside the cited EY exercise.
    whyItMatters: >-
      A scoped correlation result does not show that performance transfers to the investor's target decisions or remains
      stable under distribution shift.
    diligencePath: >-
      Run a blinded pilot against withheld human or behavioral outcomes with pre-registered thresholds, segment cuts,
      and failure reporting.
  - type: missing-source
    severity: minor
    topic: developer-surface
    missingEvidence: >-
      Public API documentation, SDK or package activity, release notes, repository history, and an integration-partner
      technical implementation account.
    whyItMatters: >-
      Recruiting posts indicate technical work but do not demonstrate integration ergonomics, release cadence, developer
      adoption, or operational maturity.
    diligencePath: >-
