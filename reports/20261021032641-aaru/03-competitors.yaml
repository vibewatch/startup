    title: "Vendor comparisons are useful maps, not independent benchmarks"
    body: "Highlight, FishDog, and Minds describe real buyer tradeoffs, but each sells an alternative and therefore cannot independently establish Aaru's relative accuracy, cost, or product limitations."
    claimRefs: ["CP006", "CP008", "CP009", "CP014"]
  - calloutType: "recommendation"
    title: "Run a blinded, decision-specific bake-off"
    body: "Require Aaru and shortlisted alternatives to reproduce withheld historical results, disclose error by segment and question type, and price the same scoped engagement before treating published validation or list pricing as comparable."
    claimRefs: ["CP002", "CP006", "CP013", "CP014"]
