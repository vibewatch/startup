  topStrengths:
    - >-
      EY reported a one-day recreation of a 3,600-investor study across more than 30 markets with results correlated
      above 90% to the original survey.
    - Accenture combines investment, strategic-adviser, integration, and enterprise-distribution signals.
    - >-
      Public reporting names recognizable enterprise relationships across consulting, consumer, financial-services,
      advertising, and media contexts.
  topRisks:
    - >-
      The $1 billion headline Series A mark exceeded 100 times the disclosed sub-$10 million ARR bound, while later
      reporting cited a $1.5 billion valuation.
    - >-
      Selected validation results do not establish generalization, causal validity, or reliable performance across new
      audiences and decisions.
    - >-
      Data rights, privacy controls, security posture, IP chain-of-title, and jurisdiction-specific governance are not
      documented in the public evidence.
    - >-
      Revenue quality, retention, margin, burn, runway, customer concentration, and partner dependence remain
      unquantified.
  unresolvedGaps:
    - >-
      Current ARR, growth, retention, gross margin, burn, cash, runway, customer concentration, and
      direct-versus-partner revenue mix.
    - >-
      The fully diluted cap table, blended Series A price, liquidation preferences, dilution, investor rights, debt, and
      option-pool treatment.
    - >-
      Independent blinded validation across multiple use cases, including segment-level errors, failure cases, drift,
      and observed commercial outcomes.
    - >-
      Data inventory, licensing and customer-data rights, privacy and deletion controls, security certifications, IP
      ownership, and incident history.
    - >-
      Customer cohorts covering paid production status, renewals, expansion, churn, usage, contract duration,
      satisfaction, and reference quality.
