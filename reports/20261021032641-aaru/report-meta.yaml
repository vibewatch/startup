companyProfile:
  summary: >-
    Aaru is a New York-based, founder-led company that builds simulated populations for testing products, prices,
    messages, policies, and other consequential decisions before market deployment. Public evidence supports meaningful
    enterprise interest and partner-led distribution, while the operating and financial disclosures needed to assess
    repeatability remain private.
