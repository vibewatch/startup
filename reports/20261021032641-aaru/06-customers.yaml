chapter:
  number: 6
  title: "Customers"
  summary: "Public evidence places Aaru primarily in enterprise and institutional decision workflows, with named proof spanning EY, Accenture, Interpublic Group, Spindrift, and several brands. The evidence is strongest for pilots, validation work, and partner-led distribution; it does not disclose retention, customer concentration, contract durability, or a longitudinal customer count."
sections:
  - id: "segments-and-buyers"
    title: "Segments, buyers, and use cases"
    body: |
      Aaru's public customer surface is enterprise-led rather than self-serve. Independent coverage says the current base skews toward large businesses and spans consumer companies in retail, technology, and CPG, alongside financial services, government-policy work, media, and utilities. The likely economic buyer is therefore a strategy, insights, innovation, marketing, or policy leader, while researchers, creatives, and operators use the resulting simulations. Aaru's own workflow starts with a decision objective, defines audiences and questions, and can incorporate customer data to narrow the modeled world. This supports a high-touch, scoped engagement interpretation, but the reviewed evidence does not provide segment-level customer counts, revenue contribution, average contract value, or proof that every named sector is a recurring production cohort.
    claimRefs: ["CU001", "CU002", "CU003", "CU009"]
    tableRefs: ["TU001"]
  - id: "named-customer-proof"
    title: "Named proof and deployment quality"
    body: |
      The strongest named proof is concentrated in validation and distribution relationships. Aaru says EY asked it to recreate the 2025 Global Wealth Study blind, covering 3,600 affluent investors across more than 30 markets, and reports completion in one day with a median Spearman correlation of 0.90. Research Live reports that Accenture Song planned to integrate Aaru's Lumen model into work across product development, marketing, customer strategy, and service. Fortune separately names EY, Accenture, Interpublic Group, McDonald's, Boston Beer, A24, and Bayer among organizations buying into the methodology, and reports that work with Spindrift preceded a still-tea launch. These references establish real commercial interest, but public materials usually do not disclose contract status, scope, spend, renewal, or whether each relationship is a pilot, partner channel, or recurring production deployment.
    claimRefs: ["CU005", "CU006", "CU007", "CU008"]
    tableRefs: ["TU003"]
  - id: "adoption-and-durability"
    title: "Adoption evidence and durability"
    body: |
      Public adoption evidence is episodic rather than longitudinal. The pool contains named organizations, one quantified EY validation, an Accenture integration announcement, and a reported Spindrift product outcome, but no time series for active accounts, deployed populations, studies run, locations, usage frequency, repeat purchase, or paid conversions. An analyst profile explicitly says specific growth metrics are not public. The reviewed sources also do not disclose NRR, GRR, gross or logo churn, renewal rates, contract length, satisfaction, implementation time, or customer-level revenue. A prudent underwriting view should therefore treat the named references as proof of market access and project activity, not as evidence of durable recurring adoption. Cohort and renewal data remain necessary to distinguish repeatable software economics from bespoke research engagements.
    claimRefs: ["CU004", "CU006", "CU007", "CU010", "CU011", "CU012"]
    tableRefs: ["TU002"]
  - id: "expansion-concentration-and-risk"
    title: "Expansion, channel dependence, and customer risk"
    body: |
      Aaru has two visible expansion paths: direct enterprise engagements that begin with a scoped validation exercise, and partner-led distribution through firms such as Accenture. Fortune reports that prospects may provide an old survey for a blind rerun against known outcomes, creating a credible land motion before a broader decision workflow. Yet the public record does not quantify direct versus partner-sourced revenue, expansion within an account, top-customer exposure, procurement duration, or partner economics. Methodological limits also matter for durability: Fortune reports bias risk in AI respondents and cases Aaru says it could not predict reliably, while competitor-issued guidance argues that synthetic outputs remain directional and require empirical validation. Those limitations could constrain expansion into high-stakes decisions unless account-specific benchmarks and governance controls are demonstrated.
    claimRefs: ["CU005", "CU009", "CU012", "CU013", "CU014", "CU015"]
    figureRefs: ["FU001"]
