callouts:
  - calloutType: risk
    title: Validation is scoped, not universal
    body: >-
      Public benchmark results should be repeated on the investor's own withheld outcomes and
      target segments before Aaru outputs influence pricing, launch, or capital-allocation decisions.
    claimRefs: [CE008, CE009, CE010, CE015]
