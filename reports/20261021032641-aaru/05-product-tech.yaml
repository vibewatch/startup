  evidenceGaps:
    - type: missing-source
      severity: material
      topic: security-privacy
      missingEvidence: >-
        Primary security and privacy documentation covering certifications, encryption,
        tenant isolation, retention, model-training use, subprocessors, and incident response.
      whyItMatters: >-
        Customer and licensed behavioral data may be sensitive, and the public workflow does not
        establish how those data are protected or governed.
      diligencePath: >-
        Obtain the security package, data-processing agreement, subprocessor list, retention
        schedule, architecture diagram, and latest independent penetration-test summary.
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: >-
        Versioned service documentation, uptime history, latency and capacity benchmarks,
        support commitments, and a production incident record.
      whyItMatters: >-
        Partner integration and decision workflows require predictable availability and
        repeatability that product descriptions alone cannot demonstrate.
      diligencePath: >-
        Review twelve months of status history and support tickets, then reproduce a benchmark
        workload under the proposed service-level agreement.
    - type: private-evidence-only
      severity: material
      topic: benchmark-transferability
      missingEvidence: >-
        Customer-specific holdout packs and independent replications across interventions,
        subsegments, geographies, and failure cases outside the cited EY exercise.
      whyItMatters: >-
        A scoped correlation result does not show that performance transfers to the investor's
        target decisions or remains stable under distribution shift.
      diligencePath: >-
        Run a blinded pilot against withheld human or behavioral outcomes with pre-registered
        thresholds, segment cuts, and failure reporting.
    - type: missing-source
      severity: minor
      topic: developer-surface
      missingEvidence: >-
        Public API documentation, SDK or package activity, release notes, repository history,
        and an integration-partner technical implementation account.
      whyItMatters: >-
        Recruiting posts indicate technical work but do not demonstrate integration ergonomics,
        release cadence, developer adoption, or operational maturity.
      diligencePath: >-
        Request API and integration documentation, sandbox access, release history, and a
        reference call with a partner engineering team.
