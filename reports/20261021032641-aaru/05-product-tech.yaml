  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or process
      - Disclosed role
      - Dependency
      - Principal risk
    rows:
      - [Evidence inputs, Combine public licensed and available customer data, Data rights coverage cadence and customer access, Sparse biased or stale inputs can constrain the modeled population]
      - [Relationship network, Preserve supported joint relationships among traits, Statistical selection of useful interactions, Undisclosed methods make independent reproducibility difficult]
      - [Dual-resolution training, Compare individual effects and population distributions with observed evidence, Appropriate outcomes at both resolutions, Aggregate fit can still fail on a new intervention or subsegment]
      - [Scenario and artifact layer, Apply interventions and convert distributions into decision-oriented outputs, Stable model behavior evaluation criteria and review, Reasoning failures or presentation quality can undermine trust]
    notes: >-
      Architecture reflects the level of detail in Aaru's public materials; model families,
      cloud topology, security boundaries, and service-level performance are not disclosed.
    claimRefs: [CE003, CE004, CE005, CE006, CE014]
