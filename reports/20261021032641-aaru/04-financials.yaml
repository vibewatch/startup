schemaVersion: report-v2
artifact: financials
slug: aaru
runDate: 2026-10-21
company:
  name: Aaru
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence supports a sales-led, negotiated enterprise model combining
    software and simulation services, but it does not disclose realized pricing,
    revenue, gross margin, retention, burn, or runway. The financial case
    therefore depends on converting custom, data- and research-intensive
    engagements into repeatable revenue without allowing delivery costs or
    channel economics to absorb the value created.
sections:
  - id: revenue-model-and-quality
    title: Revenue model and quality
    body: >-
      Aaru appears to monetize through negotiated enterprise engagements rather
      than a public self-serve tariff. Two competitor-authored comparisons say
      Aaru does not publish pricing and directs buyers into a sales conversation,
      while an independent profile describes enterprise software and simulation
      services sold through orders that specify fees and deliverables. That
      evidence supports a contract-led model, but not a conclusion about annual
      contract value, subscription mix, usage pricing, discounts, recognition
      timing, or renewal quality. Accenture Song's stated plan to integrate
      Lumen into product development, marketing, customer strategy, and customer
      service provides a credible distribution path, yet neither the investment
      amount nor partner economics were disclosed. Investors should therefore
      treat partner reach as a pipeline advantage, not as booked or recurring
      revenue, until contracts and cohort data demonstrate otherwise.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
      - CI012
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: delivery-economics-and-cost-base
    title: Delivery economics and cost base
    body: >-
      The available workflow implies meaningful variable and semi-variable
      delivery work. Aaru says engagements begin with customer objectives,
      audiences, questions, and decision criteria; populations then draw on
      public, licensed, and customer data, and engagement-specific validation
      compares outputs with first-party data, historical outcomes, prior
      research, or live tests. These steps can improve defensibility, but they
      also create likely data-license, cloud-compute, research, deployment, and
      quality-assurance costs. A current company job repost advertises a research
      engineer at $200,000-$600,000 per year plus equity and asks that person to
      make simulations fast and inexpensive at scale, a direct signal that both
      specialist labor and compute efficiency matter. The evidence does not
      quantify utilization, cost per study, implementation hours, or gross
      margin, so no SaaS-like margin assumption is supportable.
    claimRefs:
      - CI003
      - CI004
      - CI005
      - CI009
      - CI010
      - CI014
      - CI015
    tableRefs:
      - TI003
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and underwriting verdict
    body: >-
      YesPress reports that Redpoint confirmed an $80 million Series A in April
      2026, which establishes financing raised but not current cash available.
      A separate market profile says specific growth metrics are not public, and
      the assigned evidence contains no current cash balance, monthly burn,
      runway, debt facility, project-finance obligation, or next-round trigger.
      Capital adequacy is consequently not underwritable from public data.
      Commercial proof is also incomplete: the EY replication reportedly ran in
      one day rather than six months and achieved a 0.90 median Spearman
      correlation across 53 questions, but that is an efficiency and validation
      result, not revenue, retention, or customer ROI. Competitor analysis
      correctly warns that synthetic outputs do not establish exact willingness
      to pay or demand. The financial verdict is therefore promising revenue
      mechanics with unproven revenue quality, margin path, and runway.
    claimRefs:
      - CI006
      - CI011
      - CI012
      - CI013
callouts:
  - calloutType: risk
    title: Financing is not runway
    body: >-
      The reported $80 million Series A is a historical financing amount. Without
      current cash, burn, debt, and committed-spend data, it cannot establish how
      many months of operating runway remain.
    claimRefs:
      - CI011
      - CI012
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Enterprise simulation services
        - Negotiated order with fees and deliverables
        - Engagement or contract
        - Third-party description; value not disclosed
        - Potentially project-based and implementation-heavy
        - Provide bookings, recognized revenue, backlog, and renewal data by cohort
      - - Enterprise software
        - Lumen or platform access within a scoped engagement
        - Contract; billing basis undisclosed
        - Product and channel evidence exists; price absent
        - Recurrence and usage exposure are unknown
        - Separate subscription, usage, service, and pass-through revenue
      - - Partner-embedded distribution
        - Accenture Song integration into client services
        - Referral, resale, or embedded delivery terms undisclosed
        - Integration intent announced; economics not disclosed
        - Could accelerate pipeline but may introduce revenue share
        - Produce partner-sourced bookings, take rate, concentration, and renewal terms
      - - Self-serve or standardized recurring plans
        - No public plan or tariff identified
        - Unavailable
        - Not publicly supported
        - Cannot be included in an underwriting base case
        - Confirm whether any standardized SKU, minimum term, or usage commitment exists
    notes: >-
      Public descriptions establish possible streams and contract mechanics, not
      realized prices, accounting recognition, revenue mix, or recurrence; null
      economics require management documentation.
    claimRefs:
      - CI001
      - CI002
      - CI007
      - CI008
      - CI012
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Pricing element
      - Public evidence
      - Value
      - Confidence
      - Underwriting implication
    rows:
      - - Public list price
        - Competitor comparisons checked vendor surfaces
        - Not published
        - Medium
        - Model no list-price anchor or self-serve conversion
      - - Buying motion
        - Contact-led sales conversation
        - Sales-led
        - Medium
        - Expect procurement and solution-scoping friction
      - - Contract structure
        - Negotiated orders specifying fees and deliverables
        - Terms undisclosed
        - Medium
        - Revenue recognition and services allocation require contract review
      - - Realized price, discounts, and channel share
        - No assigned source discloses these fields
        - Unavailable
        - Low
        - Request invoice-level pricing and gross-to-net bridge
    notes: >-
      This table separates observed public selling mechanics from unavailable
      realized economics; no competitor list price is used as an Aaru price proxy.
    claimRefs:
      - CI001
      - CI002
      - CI007
  - id: TI003
    title: Unit economics and capital adequacy gaps
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Specific diligence request
    rows:
      - - Revenue or ARR
        - Unavailable
        - Low
        - Establishes scale and recurring mix
        - Monthly GAAP revenue, ARR definition, and bridge for the last 24 months
      - - Gross margin
        - Unavailable
        - Low
        - Tests whether custom delivery can scale
        - Gross margin by software, services, partner, and data pass-through stream
      - - CAC and payback
        - Unavailable
        - Low
        - Measures efficiency of the sales-led motion
        - Fully loaded CAC, sales cycle, win rate, and payback by segment and channel
      - - Delivery cost per engagement
        - Unavailable
        - Low
        - Captures data, compute, research, and deployment intensity
        - Compute, licensed-data, research, and forward-deployment hours by project
      - - Retention and expansion
        - Unavailable
        - Low
        - Distinguishes repeatable software value from one-off studies
        - Gross and net revenue retention plus cohort renewal and expansion schedules
      - - Cash, burn, runway, and debt
        - Unavailable; $80M financing raised is not cash on hand
        - Low
        - Determines financing dependency and downside protection
        - Current cash, monthly net burn, committed spend, debt terms, and downside runway
    notes: >-
      Every unavailable value is a private-evidence gap; the reported financing
      amount and recruiting signals are not substitutes for accounting statements
      or a cash forecast.
    claimRefs:
      - CI004
      - CI005
      - CI009
      - CI010
      - CI011
      - CI012
      - CI014
      - CI015
figures:
  - id: FI001
    title: Revenue model bridge from scoped decision to gross profit
    type: flow
    summary: >-
      Public evidence supports the operating sequence, but neither price nor cost
      values are disclosed at any stage.
    data:
      nodes:
        - id: scoped-sale
          label: Sales-led scoped engagement
          detail: No public tariff; negotiated buyer conversation
        - id: decision-design
          label: Objectives, audiences, and questions
          detail: Customer decision criteria define the work
        - id: data-inputs
          label: Public, licensed, and customer data
          detail: Input mix creates data-access and governance work
        - id: simulation
          label: Population simulation
          detail: Compute and specialist research produce scenario outputs
        - id: validation
          label: Engagement-specific validation
          detail: Outputs are compared with available customer or observed evidence
        - id: deliverables
          label: Decision-ready deliverables
          detail: Reports and analyses are provided under negotiated orders
        - id: fees
          label: Contract revenue
          detail: Fees and billing basis are not publicly disclosed
        - id: gross-profit
          label: Gross profit after delivery costs
          detail: Margin remains unknown without data, compute, and labor costs
      edges:
        - from: scoped-sale
          to: decision-design
        - from: decision-design
          to: data-inputs
        - from: data-inputs
          to: simulation
        - from: simulation
          to: validation
        - from: validation
          to: deliverables
        - from: deliverables
          to: fees
        - from: fees
          to: gross-profit
    approximationNotes: >-
      Conceptual sequence only; it is not a quantified waterfall and does not
      imply disclosed conversion rates, prices, costs, or margins.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI014
