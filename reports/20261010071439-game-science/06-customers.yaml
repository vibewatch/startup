company:
  name: "Game Science"
chapter:
  number: 6
  title: "Customers"
  summary: "Black Myth: Wukong demonstrates exceptional consumer adoption, with third-party reporting of 20 million copies sold in its first month and more than 30 million within its first year. Public evidence also shows franchise demand through concerts and co-branded products, but it does not disclose active users, repeat purchase, retention, platform mix, geographic mix, or Game Science's share of partner retail sales."
sections:
  - id: "customer-base-and-channels"
    title: "Customer base and buying channels"
    body: >-
      Game Science primarily serves individual premium-game buyers rather than a disclosed roster
      of enterprise customers. Its official site lists Black Myth: Wukong across PS5, Steam, Epic
      Games Store, WeGame, and Xbox Series X|S, while The Wire China independently confirms
      availability on Sony's PlayStation platform. Those storefronts are distribution channels,
      not evidence of customer concentration by themselves: the retained sources do not disclose
      unit or revenue shares by platform, geography, edition, or payer cohort. Earlier reach is
      visible but not directly comparable: a community history says Art of War: Red Tides received
      App Store recommendations in 154 countries and regions. Franchise licensees and co-brand
      partners form a secondary commercial surface, but their gross consumer sales must not be
      treated as Game Science revenue.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU001"
  - id: "adoption-and-demand-proof"
    title: "Adoption and demand proof"
    body: >-
      The clearest customer proof is paid sell-through. Wikipedia and KrASIA both report 20 million
      copies in the first month, and KrASIA reports that sales exceeded 30 million within the first
      year. KrASIA also reports 15 million copies in the first week and nearly 700 million views for
      related Bilibili videos, showing that purchase velocity and audience attention reinforced one
      another. Demand extended beyond the software transaction: a symphonic concert series sold out
      almost immediately, a Luckin Coffee collaboration made a themed latte a top seller, and Chow
      Tai Fook reported RMB 1.5 billion in retail sales for its co-branded jewelry. These are strong
      franchise-affinity signals, but only unit sales are direct evidence of game buyers; views,
      sell-outs, and partner retail sales use different populations and denominators.
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "durability-expansion-and-risk"
    title: "Durability, expansion, and concentration risk"
    body: >-
      Public adoption evidence does not establish durable engagement. One independent analysis
      describes premium single-player games as front-loaded, with the first month potentially
      accounting for 80% of total sales, and another investment page explicitly identifies
      single-title dependency as a risk. Game Science's 2026 official page shows periodic 25% and
      30% sale announcements, but promotions do not reveal active users, repeat purchase, churn, or
      cohort retention. Co-branding may extend the franchise into food, jewelry, peripherals, and
      lifestyle products; however, reported partner sell-through and licensing-fee ranges do not
      disclose Game Science's net receipts, contract duration, renewal rate, or minimum guarantees.
      Separately, reporting about historical sexism allegations and the company's decision not to
      answer questions creates a reputational diligence issue, but the retained sources do not
      quantify any customer loss attributable to it.
    claimRefs:
      - "CU010"
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    figureRefs:
      - "FU001"
callouts:
  - calloutType: "strength"
    title: "Paid adoption is proven"
    body: "Independent reports converge on 20 million copies sold in the first month, and KrASIA reports more than 30 million within the first year; this is materially stronger customer proof than views, wishlists, or logo placement."
    claimRefs:
      - "CU003"
      - "CU004"
  - calloutType: "risk"
    title: "Retention remains unmeasured"
    body: "No retained source discloses active users, repeat purchase, cohort retention, refund rate, platform mix, geographic mix, or the studio's net share of co-brand retail sales."
    claimRefs:
      - "CU012"
      - "CU013"
