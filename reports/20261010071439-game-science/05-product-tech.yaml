chapter:
  number: 5
  title: "Product & Technology"
  summary: "Game Science has demonstrated a shipping, multi-platform AAA action-RPG product and a technically ambitious Unreal Engine 5 rendering stack, but independent tests show demanding PC requirements, shader and traversal stutter, and visible Xbox compromises. The next Black Myth title remains early, while public evidence is insufficient to underwrite internal architecture, security governance, quality controls, service levels, or delivery timing."
sections:
  - id: "product-and-user-workflow"
    title: "Product Surface and User Workflow"
    body: >-
      Game Science's public product surface is centered on Black Myth: Wukong, which
      the company describes as a Chinese-mythology action RPG available across PS5,
      Steam, Epic Games Store, WeGame, and Xbox Series X|S. Its corporate portal also
      presents two earlier products, Art of War: Red Tides and 100 Heroes, alongside
      a first look at Black Myth: Zhong Kui. This establishes a real shipped catalog,
      but not a repeatable release cadence: independent reporting says Zhong Kui had
      been in development only a few months and had no playable build when announced.
      For users, the workflow is conventional premium-game discovery, hardware and
      platform selection, installation, play, and patching. Distribution breadth is a
      strength, while the reported concentration of roughly 70% of Wukong sales in
      China indicates that global platform availability should not be mistaken for a
      geographically balanced demand base.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE015"
    tableRefs:
      - "TE001"
  - id: "publicly-visible-architecture"
    title: "Publicly Visible Architecture and Dependencies"
    body: >-
      The evidence supports a component inventory rather than a verified internal
      architecture. A community history reports that Wukong moved to Unreal Engine 5
      by 2021, while independent benchmark coverage identifies Unreal Engine 5,
      DirectX 12, path tracing on NVIDIA hardware, and DLSS, FSR, XeSS, and native
      temporal upscaling options. SteamDB's detected-technology record adds a wider
      set of third-party dependencies, including NVIDIA graphics SDKs, AMD FidelityFX,
      Intel XeSS, Wwise, XAudio2, iZotope, PhysX, NvCloth, and Denuvo. Those observations
      make engine, GPU-vendor, audio-middleware, DRM, and platform compatibility
      dependencies visible, but they do not establish Game Science's source-code
      structure, build pipeline, test automation, telemetry, security controls, or
      ownership boundaries. The architecture map therefore separates evidenced
      layers from diligence gaps instead of presenting inferred proprietary systems
      as fact.
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-reliability-and-support"
    title: "Deployment, Reliability, and Support"
    body: >-
      Technical ambition creates measurable deployment friction. TechPowerUp framed
      its review around 35 GPUs and documented a feature-heavy PC renderer; DSOGaming
      found that only an RTX 4090 reached 60 fps at 1080p maximum settings without ray
      tracing, while no tested GPU reached 60 fps at native 4K maximum settings. The
      same analysis reported shader-compilation and traversal stutter even after an
      initial compilation step. Platform adaptation is uneven as well: SteamDB marks
      the game unsupported on Steam Deck despite SteamOS compatibility, and IGN
      reported screen tearing below 60 fps on Xbox Series X plus lower resolution,
      pixel count, and visual detail on Series S. Game Science does publish coordinated
      PC, PS5, and Xbox patch versions, showing an active maintenance channel, but the
      retained evidence does not disclose service targets, defect escape rates,
      incident history, or time-to-remediation metrics.
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
      - "CE012"
    tableRefs:
      - "TE002"
  - id: "differentiation-roadmap-and-controls"
    title: "Differentiation, Roadmap, and Control Gaps"
    body: >-
      The defensible public differentiation is execution rather than disclosed
      proprietary infrastructure: Game Science combined a Chinese-mythology product
      identity with a demanding contemporary rendering stack and shipped it across
      major PC and console channels. Independent roadmap reporting says Zhong Kui is
      intended to use new visuals, technologies, and storytelling, but the same report
      places the project at a very early stage with no playable build at announcement.
      That makes the roadmap direction visible while leaving schedule, budget, staffing,
      platform scope, and technical reuse unverified. Trust evidence is narrower still.
      SteamDB detects Denuvo and numerous middleware SDKs, but anti-tamper software is
      not evidence of secure development, privacy governance, vulnerability handling,
      accessibility assurance, or formal quality management. Management diligence
      should therefore focus on milestone readiness and operating controls, not on
      extrapolating Wukong's shipped quality into the next title.
    claimRefs:
      - "CE001"
      - "CE004"
      - "CE005"
      - "CE012"
      - "CE013"
      - "CE014"
      - "CE016"
callouts:
  - calloutType: "risk"
    title: "Rendering Ambition Raises the Portability Burden"
    body: "Independent PC and Xbox evidence shows that the visual stack can require top-end hardware, still exhibit shader or traversal stutter, and force visible console compromises; future platform plans need milestone-level performance proof."
    claimRefs:
      - "CE008"
      - "CE009"
      - "CE010"
      - "CE011"
  - calloutType: "recommendation"
    title: "Underwrite Controls, Not Just the Technology List"
    body: "Request the Zhong Kui milestone plan, target hardware matrix, automated test coverage, security and privacy ownership, incident-response process, and historical defect metrics before assigning value to roadmap reuse."
    claimRefs:
      - "CE013"
      - "CE014"
      - "CE016"
