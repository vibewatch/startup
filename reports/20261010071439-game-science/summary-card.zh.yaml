  topStrengths:
    - 《黑神话：悟空》成为具备全球竞争力的 AAA 爆款，验证了市场对中国单机游戏的高价需求。
    - 工作室保留了创始人主导的创意控制，也延续了腾讯《斗战神》团队的技术积累。
    - 腾讯整合后的少数股权提供了战略支持，但没有取代创始人的控制权。
  topRisks:
    - Game Science 仍高度依赖单一 IP；下一款作品上线前，收入可能出现较长空档。
    - 私人公司的公开披露很少，收入、现金流和估值都难以评估。
    - 腾讯持有 24% 股权，而公开治理细节缺失，带来股权集中和控制权方面的不确定性。
  unresolvedGaps:
    - 一轮已披露价格的融资、要约或经审计的公允价值标记，以说明《悟空》上线后投资者实际为 Game Science 支付了什么价格。
    - 经审计或管理层确认的收入、利润率、现金和自由现金流数据，并区分消费者总支出与工作室净收入。
    - 《黑神话：钟馗》或其他后续作品的当前员工数、开发预算和人员规划。
    - 首年集中售出期过后，海外销售结构、平台结构、退款率和实际活跃度曲线的准确数据。
    - 腾讯新增持股的经济条款、投资者优先权，以及任何影响普通股价值的治理权利。
