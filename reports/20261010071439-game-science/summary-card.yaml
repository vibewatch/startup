  topStrengths:
    - >-
      Black Myth: Wukong delivered a globally competitive AAA hit and validated premium demand for Chinese single-player
      games.
    - The studio retained founder-led creative control and technical continuity from the Tencent Asura team.
    - Tencent’s consolidated minority stake provides strategic backing without displacing the founders.
  topRisks:
    - >-
      Game Science remains highly concentrated in a single franchise, creating a long revenue lull before the next title
      ships.
    - Private-company disclosure remains thin, leaving revenue, cash flow, and valuation difficult to underwrite.
    - Tencent’s 24% holding and the lack of public governance detail create concentration and control uncertainty.
  unresolvedGaps:
    - >-
      A disclosed priced financing round, tender, or audited fair-value mark showing what investors actually paid for
      Game Science after Wukong launched.
    - >-
      Audited or management-confirmed revenue, margin, cash, and free-cash-flow data separating gross consumer spend
      from studio net receipts.
    - 'Current headcount, development budget, and staffing plan for Black Myth: Zhong Kui or any other follow-on title.'
    - >-
      Exact overseas sales mix, platform mix, refund rate, and live engagement curve after the first-year sell-through
      burst.
    - >-
      The economic terms of Tencent's newer stake position, any investor preferences, and any governance rights that
      affect common-equity value.
