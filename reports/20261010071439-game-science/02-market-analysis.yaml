callouts:
  - calloutType: "insight"
    title: "Supply-Side Disruption of China's Free-to-Play Equilibrium"
    body: "For over a decade, China's gaming ecosystem was dominated by free-to-play mobile juggernauts like Honor of Kings that generated recurring microtransaction revenues with shorter development lead times. Black Myth: Wukong established that a massive domestic audience possesses both the hardware and willingness to pay premium upfront prices for world-class single-player AAA experiences, creating a viable domestic market segment that previously did not exist at scale."
    claimRefs:
      - "CM001"
      - "CM004"
      - "CM007"
      - "CM015"
  - calloutType: "risk"
    title: "Structural Margin Dilution and Long-Cycle Cash Conversion"
    body: "Unlike recurring mobile games with immediate live-service cash flows, premium AAA releases concentrate the vast majority of lifecycle revenues in the initial launch window while requiring multi-year development lead times and absorbing a 30 percent platform take rate and 5 percent engine royalty. Game Science's decision to bypass DLC expansions to focus on Black Myth: Zhong Kui delays immediate incremental monetization in favor of longer-cycle sequel economics."
    claimRefs:
      - "CM003"
      - "CM008"
      - "CM009"
      - "CM013"
