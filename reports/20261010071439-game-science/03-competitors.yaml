callouts:
  - calloutType: "insight"
    title: "The Cost-Efficiency Arbitrage in Chinese AAA Production"
    body: "Game Science developed Black Myth: Wukong for roughly 500 million RMB ($70 million) over six years with approximately 140 internal staff, a fraction of the $200 million to $1 billion production outlays typical of Western peers such as Concord, Cyberpunk 2077, or Horizon Forbidden West. This structural cost advantage enables Game Science to achieve break-even and generate substantial net profits at lower unit sales thresholds, establishing an attractive risk-adjusted margin profile for domestic high-end game development."
    claimRefs:
      - "CP006"
      - "CP013"
  - calloutType: "risk"
    title: "Single-Title Revenue Decay and Sequel Release Gaps"
    body: "Unlike domestic peers operating live-service franchises that generate predictable recurring microtransactions, Game Science is bound to the cyclical economics of single-player releases. With initial sell-through capturing up to 80% of lifetime revenues within the first two months, Game Science faces an extended cash generation void while developing Black Myth: Zhong Kui, compounded by zero player switching costs and emerging competition from well-funded domestic action RPG contenders."
    claimRefs:
      - "CP004"
      - "CP005"
      - "CP009"
      - "CP014"
