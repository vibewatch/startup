chapter:
  number: 4
  title: "Financials"
  summary: "Black Myth: Wukong has demonstrated exceptional premium-game demand, with reported sell-through exceeding 30 million copies in its first year. Public estimates suggest attractive development leverage, but audited revenue, platform settlements, margins, cash, burn, and forward production commitments remain unavailable, so neither profitability nor runway can be underwritten from public evidence."
sections:
  - id: "revenue-model-and-monetization"
    title: "Revenue Model and Monetization"
    body: "Game Science's evidenced core model is an upfront premium-game sale across PlayStation, Steam, Epic Games Store, WeGame, and Xbox, rather than a disclosed subscription or recurring-revenue contract [CI001]. The public catalogue also includes two earlier titles, but no retained source provides current revenue by product [CI002]. A secondary analysis reports mainland and overseas Wukong price points, while translated reporting describes co-brand licensing fees and partner merchandise sales [CI009, CI013, CI014]. Those partner retail figures are not Game Science revenue: the studio's royalty percentage, minimum guarantees, and cash collection terms are undisclosed. Revenue quality is therefore proven at the franchise-demand level but remains concentrated, transaction-driven, and opaque below gross consumer spend."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI009"
      - "CI013"
      - "CI014"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "demand-and-gtm-evidence"
    title: "Demand and GTM Evidence"
    body: "Launch evidence indicates unusually efficient demand generation. RPG Site reported 10 million copies sold within three days, while Niko Partners measured more than 2.2 million first-day Steam peak concurrent users and more than 4 million pre-launch wishlists [CI004, CI005, CI006]. KrASIA later reported that first-year sell-through exceeded 30 million copies [CI007]. These metrics support strong awareness and conversion, but they do not disclose paid media spend, customer-acquisition cost, refunds, platform mix, geographic net receipts, or the durability of post-launch sales. RPG Site also quoted criticism of design and performance issues, an adverse signal that product quality can still influence refunds, discounting, and long-tail franchise economics [CI008]."
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure and Unit Economics"
    body: "The only retained cost bridge is an unaudited secondary model. It estimates a 30% storefront deduction, roughly RMB 500 million of development cost, and RMB 6.1 billion of gross consumer revenue in the first two weeks [CI010, CI011, CI012]. These values suggest substantial operating leverage if directionally correct, but they do not establish recognized studio revenue, gross margin, operating profit, or free cash flow. The model does not disclose refunds, taxes, publisher shares, foreign-exchange effects, payment timing, capitalized development accounting, or subsequent operating costs. Consequently, gross consumer spend cannot be treated as Game Science revenue, and estimated accounting profit cannot be treated as cash available for the next production cycle."
    claimRefs:
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-verdict"
    title: "Capital Adequacy and Financial Verdict"
    body: "A community account says Game Science previously used commercially successful mobile games to secure Hero Games funding for console development, which is useful directional history but low-confidence evidence [CI003]. More recently, Game World Observer reported that Tencent increased its holding to 24% and became the sole external shareholder; the transaction consideration was not disclosed [CI015, CI016]. Neither fact reveals current cash, debt, burn, contractual obligations, or committed budget for the next title. The financial verdict is therefore mixed: Wukong validates premium demand and potential development leverage, yet revenue concentration and private-company disclosure prevent a reliable margin or runway assessment. Underwriting requires audited statements, storefront settlement reports, licensing contracts, and an approved forward production budget."
    claimRefs:
      - "CI003"
      - "CI015"
      - "CI016"
