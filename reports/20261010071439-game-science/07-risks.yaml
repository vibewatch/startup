company:
  name: Game Science
chapter:
  number: 7
  title: Risks
  summary: 'Game Science faces severe franchise concentration and multi-year revenue lulls as it shifts from Black Myth: Wukong to Black Myth: Zhong Kui without interim downloadable content. Operational scale-up, domestic regulatory approvals, and shareholder concentration with Tencent owning 24% as the sole external investor compound commercial and execution exposure.'
sections:
  - id: franchise-and-pipeline-concentration
    title: Single-Franchise Concentration and Sequel Execution Gap
    body: 'Game Science achieved unprecedented commercial scale with Black Myth: Wukong, selling over twenty million copies globally in its first month and establishing the studio as China''s premier premium video game developer. However, this breakthrough success creates severe single-title revenue concentration. The studio shelved planned downloadable content in favor of initiating development on Black Myth: Zhong Kui, a standalone action title centered on a demon-quelling Taoist figure. Because blockbuster action games typically require three to five years or more of production, Game Science faces an extended revenue lull. Without steady recurring monetization or interim expansions, the business must absorb ongoing fixed studio operating expenses entirely from back-catalog sales and brand licensing partnerships.'
    claimRefs:
      - CR001
      - CR003
      - CR004
      - CR005
      - CR014
    tableRefs:
      - TR001
  - id: operational-and-production-scaling
    title: Operational Scale, Production Overhead, and Talent Bottlenecks
    body: 'Transitioning from mobile development—where Game Science previously created 100 Heroes and Art of War: Red Tides—to high-budget AAA development fundamentally shifted the studio''s operational cost structure. Developing Black Myth: Wukong required seven years and an estimated five hundred million yuan in total production expenditures. The studio maintains a core internal staff of approximately one hundred forty employees in Shenzhen and Hangzhou, supported by nearly three hundred specialized outsourcing collaborators handling environmental modeling, character animation, and visual effects. Operating with Unreal Engine 5 advanced graphics systems, such as Nanite virtual geometry and Lumen real-time global illumination, demands rare technical talent. Managing this hybrid internal and outsourced pipeline creates delivery bottlenecks, execution friction, and quality control risks as the studio begins multi-year asset creation for Zhong Kui.'
    claimRefs:
      - CR002
      - CR006
      - CR007
      - CR011
      - CR012
    tableRefs:
      - TR002
  - id: partner-shareholder-and-platform-concentration
    title: Platform Distribution Cut and Shareholder Concentration
    body: 'Game Science relies heavily on third-party distribution platforms to reach its worldwide audience, selling Black Myth: Wukong through digital storefronts including Steam, PlayStation Network, Epic Games Store, and WeGame. Digital storefronts such as Steam standardly deduct a thirty percent commission from gross sales, imposing substantial margin drag before net proceeds reach the studio. Concurrently, external shareholder concentration has reached a critical threshold. In May 2026, Tencent expanded its minority equity holding to twenty-four percent by acquiring shares from long-time partner Hero Games, becoming Game Science''s sole external institutional shareholder. This single-counterparty governance position creates potential alignment risks regarding future publishing rights, intellectual property exploitation, strategic platform choices, and live-service monetization preferences.'
    claimRefs:
      - CR008
      - CR009
      - CR010
      - CR015
    tableRefs:
      - TR003
  - id: regulatory-compliance-and-risk-matrix
    title: Domestic Regulatory Oversight and Residual Risk Profile
    body: 'Operating within mainland China subjects Game Science to strict regulatory oversight administered by the National Press and Publication Administration. Every commercial game release requires a formal domestic publishing license, known as an ISBN approval, alongside compliance with mandatory minor playtime anti-addiction authentication systems. While Black Myth: Wukong navigated domestic regulatory clearance successfully and secured massive cultural endorsement, each subsequent title, including Black Myth: Zhong Kui, must independently obtain regulatory approval before domestic commercial launch. Any potential regulatory tightening, content modification mandate, or extended approval freeze poses direct scheduling and revenue risks. Overall, Game Science exhibits a concentrated risk profile characterized by high creative execution hurdles, multi-year pipeline lulls, platform commission friction, and single-shareholder governance sensitivity.'
    claimRefs:
      - CR003
      - CR005
      - CR009
      - CR013
    figureRefs:
      - FR001
