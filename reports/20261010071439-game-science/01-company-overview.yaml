company:
  name: "Game Science"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Game Science (Shenzhen Youke Interactive Technology Co., Ltd.) is a Chinese independent game studio founded in 2014 by former Tencent Asura developers that delivered China's first breakout AAA hit, Black Myth: Wukong. While achieving over 10 million copies sold in its opening four days and expanding Tencent's minority stake to 24%, the studio maintains founder control under CEO Feng Ji while confronting single-franchise dependency and unverified secondary market estimates."
sections:
  - id: "corporate-identity-origins"
    title: "Corporate Identity, Origins, and Operating Model"
    body: "Shenzhen Youke Interactive Technology Co., Ltd., operating commercially as Game Science, was incorporated on June 13, 2014, by a team of seven former Tencent developers led by Feng Ji and Yang Qi. The team had previously developed the mythology-infused MMO Asura at Tencent's Quantum Studio before departing to establish an independent development vehicle dedicated to high-fidelity gameplay. Game Science operates dual studio locations across China, anchoring corporate administration in Shenzhen's Nanshan District and creative development in Hangzhou's Xihu District. Prior to embarking on full-scale AAA production, Game Science sustained operations through two initial titles: the 2015 Three Kingdoms card-battler 100 Heroes (Bai Jiang Xing), published by NetEase, and the 2016 multiplatform real-time strategy title Art of War: Red Tides, published with Hero Entertainment. While neither early release achieved breakout commercial status, they provided cash flow and validated production workflows. The studio's operating model relies on a lean core internal staff of approximately 100 to 140 developers, heavily augmented by hundreds of external contractors specializing in visual assets, 3D scanning, animation, and motion capture."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO001"

  - id: "leadership-and-governance"
    title: "Founding Leadership, Creative Authority, and Governance"
    body: "Game Science exhibits intense key-person dependency on its two principal leaders, Chief Executive Officer Feng Ji (online handle Yocar) and Art Director Yang Qi. Feng Ji drives high-level studio strategy, franchise architecture, commercial positioning, and core design philosophy, having previously served as lead designer for Tencent's Asura. Yang Qi oversees visual design, aesthetic world-building, mythological creature conception, and cinematic staging. The executive duo is supported by five additional co-founders who transitioned together from Tencent in 2014, ensuring exceptional technical continuity across game engineering, combat mechanics, and Unreal Engine pipelines. This concentration of authority has enabled uncompromising creative control, as demonstrated when leadership chose to shelve near-term downloadable content for Black Myth: Wukong to focus on a brand-new title. However, the studio lacks an independent board of directors or public governance oversight, concentrating strategic and key-person execution risk directly in the founders."
    claimRefs:
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO002"

  - id: "capitalization-and-shareholding"
    title: "Capitalization History, Ownership Structure, and Stakeholder Dynamics"
    body: "The capitalization trajectory of Game Science reflects selective external financing structured to preserve founder operational control. In March 2021, following the viral success of the studio's initial pre-alpha gameplay trailer, Tencent acquired an initial 5% minority equity stake to support technical migration to Unreal Engine 5. Chinese commercial registration filings indicate that by late April 2026, Tencent's equity stake expanded to 24.0% when Hero Jin Kong, an affiliate of early investor Hero Entertainment that held 19.0%, divested its position. Tencent acquired this position to become Game Science's sole external institutional shareholder. Despite Tencent's increased equity presence, founder Feng Ji remains the largest individual shareholder with 38.76% direct equity, while two Shenzhen employee partnership vehicles hold approximately 37.0% combined. Game Science has never announced a formal post-launch priced financing round or institutional tender, leaving post-launch equity valuation and private market pricing unverified."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO014"
    tableRefs:
      - "TO003"

  - id: "commercial-scale-and-roadmap"
    title: "Commercial Scale, Milestone Chronology, and Franchise Roadmap"
    body: "Black Myth: Wukong launched globally on August 20, 2024, across PC and PlayStation 5 platforms. On August 23, 2024, Game Science published its only officially verified sales milestone: exceeding 10 million copies sold across all platforms within four days, accompanied by peak concurrent player counts exceeding 3 million. Subsequent external estimates citing 18 million, 20 million, or 30 million copies sold have proliferated across secondary research, along with claims of winning mainstream Game of the Year honors. However, studio leadership has repeatedly clarified that external figures are unconfirmed and that Wukong won category honors (such as Best Action Game and Players' Voice at The Game Awards 2024) rather than jury Game of the Year. Beyond software unit sales, Game Science has generated significant ancillary revenue through consumer licensing, including beverage promotions and co-branded jewelry lines exceeding RMB 1.5 billion in retail sales. At Gamescom 2025, Game Science revealed a cinematic teaser for Black Myth: Zhong Kui, inaugurating its multi-title mythological universe. Development remains in early stages with no confirmed engine, release window, or playable code, leaving follow-on revenue visibility constrained."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO013"
    figureRefs:
      - "FO001"
