callouts:
  - calloutType: "risk"
    title: "Franchise Concentration and Sequel Execution Risk"
    body: "Game Science's commercial success rests entirely on a single release. Leadership's decision to shelve near-term downloadable content for Black Myth: Wukong in favor of initiating Black Myth: Zhong Kui from scratch leaves the studio facing a multi-year gap in core game revenue while confronting substantial creative and production pressure to replicate Wukong's historic performance."
    claimRefs:
      - "CO009"
      - "CO010"
  - calloutType: "strength"
    title: "Founder Equity Control Preserved Amid Secondary Consolidation"
    body: "Despite Tencent expanding its equity stake to 24% via secondary buyout of early backer Hero Jin Kong, founder Feng Ji maintains operational leadership and 38.76% direct equity alongside 37% employee equity pools. This corporate architecture protects Game Science's independent creative decision-making from publisher interference."
    claimRefs:
      - "CO003"
      - "CO006"
