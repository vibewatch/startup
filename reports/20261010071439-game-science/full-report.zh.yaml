      - number: '3.4'
        title: 护城河持久度与系列扩张动力
        blocks:
          - type: paragraph
            body: >-
              Game Science 的战略护城河来自艺术执行、文化真实性和中国民间传说中的先发品牌资产，而不是结构性转换成本或自有分发平台。玩家完成单人流程后转向其他作品没有摩擦，因此工作室无法依靠网络效应隔绝竞争。认识到
              DLC 扩展的局限后，Game Science 有意将资源转向 Black Myth: Zhong Kui，扩大 Black Myth 神话宇宙。为了保持对新兴中国动作 RPG
              同行和资金充足的西方老牌厂商的差异化，Game Science 必须持续交付定义品类的战斗和叙事，同时管理多年的发行间隔，避免损害财务储备。
            claimRefs:
              - CP006
              - CP009
              - CP010
              - CP014
