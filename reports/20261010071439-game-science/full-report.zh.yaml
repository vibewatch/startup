      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 中国 AAA 制作的成本效率套利
            body: >-
              Game Science 用约 500 million RMB（$70 million）在 6 年内开发 Black Myth: Wukong，内部员工约 140 人，仅为 Concord、Cyberpunk
              2077 或 Horizon Forbidden West 等西方同行常见 $200 million 至 $1 billion 制作投入的一小部分。这种结构性成本优势使 Game Science
              能在较低销量门槛下实现盈亏平衡并创造可观净利润，为国内高端游戏开发建立有吸引力的风险调整后利润画像。
            calloutType: insight
            claimRefs:
              - CP006
              - CP013
          - type: callout
            title: 单作品收入衰减与续作发行空档
            body: >-
              与经营长线运营系列、能产生可预测持续微交易的国内同行不同，Game Science 受单人发行周期经济性的约束。初期销量在前两个月最多可占生命周期收入的 80%，因此工作室在开发 Black Myth:
              Zhong Kui 期间会面临长期现金创造空档，同时还要承受玩家零转换成本和资金充足的国内动作 RPG 竞争。
