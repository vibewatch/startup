      - number: '3.3'
        title: 变现模式与平台分成
        blocks:
          - type: paragraph
            body: >-
              Game Science 与中国老牌游戏巨头的经济差异，凸显了单人游戏和长线运营模式之间的根本取舍。Tencent 的 Honor of Kings 通过持续销售外观和战斗通行证，年收入稳定超过 $1.5
              billion；而 Black Myth: Wukong 完全依赖一次性预付费，国内价格为 268 RMB，国际价格为 $60 至
              $70。单人游戏的收入高度前置，绝大部分生命周期销量都在首发窗口实现。此外，Game Science 还要向 Steam 和 PlayStation Store 等数字分发商支付标准 30% 分成，并向 Epic
              Games 支付 5% 毛引擎版税，扣除营销和运营开销前只剩约 65% 的毛账单收入。
            claimRefs:
