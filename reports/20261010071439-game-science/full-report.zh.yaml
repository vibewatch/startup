              Wukong 需要 7 年，预计总制作支出约为 5 亿元人民币。工作室在深圳和杭州维持约 140 名核心内部员工，并由近 300 名专业外包协作者支持环境建模、角色动画和视觉特效。使用 Unreal Engine
              5 的 Nanite 虚拟几何、Lumen 实时全局光照等先进图形系统，需要稀缺技术人才。当工作室开始为 Zhong Kui 进行多年资产制作时，管理这条内外结合的生产线会制造交付瓶颈、执行摩擦和质量控制风险。
