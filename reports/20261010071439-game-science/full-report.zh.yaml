  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 逐步评估框架，最终得出继续研究的建议。
    data:
      nodes:
        - id: scale
          label: 商业规模
          description: 终身销量超过 30M 份，确立中国顶级 AAA 系列
        - id: efficiency
          label: 资本效率
          description: $70M 开发预算带来出色的运营利润率
        - id: concentration
          label: 系列集中度
          description: 高度依赖单一 IP，且高端销售收入前置后迅速衰减
        - id: governance
          label: 股东结构
          description: Tencent 持股 24%，成为权利不明确的唯一外部股东
        - id: pipeline
          label: 续作执行
          description: Black Myth Zhong Kui 的开发周期横跨多年，至 2027-2028 年仍有空档
        - id: recommendation
          label: 继续研究立场
          description: 在续作里程碑和条款得到核实前，保持有纪律的跟踪
      edges:
        - from: scale
          to: efficiency
        - from: efficiency
          to: concentration
        - from: concentration
          to: governance
        - from: governance
          to: pipeline
        - from: pipeline
          to: recommendation
    approximationNotes: 该框架综合已观察到的商业规模、股权结构表变化和多年产品管线空档。
