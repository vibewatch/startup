    sections:
      - number: '7.1'
        title: 单一系列集中度与续作执行空档
        blocks:
          - type: paragraph
            body: >-
              Game Science 凭借 Black Myth: Wukong 达到前所未有的商业规模，首月全球销量超过 20
              两千万，确立了中国顶级精品游戏开发商的地位。但这次突破也造成严重的单作品收入集中。工作室搁置原计划 DLC，转而开发以降妖除魔的道教人物为核心的独立动作作品 Black Myth: Zhong
              Kui。由于爆款动作游戏通常需要 3 至 5 年甚至更久制作，Game Science 将面临长期收入低谷。没有稳定的经常性变现或中间扩展时，公司必须完全依靠目录销售和品牌授权合作来承担持续的固定运营费用。
