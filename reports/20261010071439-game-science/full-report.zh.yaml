      - number: '1.4'
        title: 商业规模、里程碑时间线与系列路线图
        blocks:
          - type: paragraph
            body: >-
              Black Myth: Wukong 于 2024 年 8 月 20 日在 PC 和 PlayStation 5 平台全球上线。2024 年 8 月 23 日，Game Science
              发布了唯一经官方核验的销量里程碑：所有平台 4 天内销量超过 10 million 份，峰值同时在线玩家超过 3 million。随后二手研究中不断出现 18 million、20 million 或 30
              million 份销量的外部估算，也出现了其赢得主流年度游戏荣誉的说法。但工作室领导层多次澄清，外部数字未经确认，Wukong 获得的是类别奖项（如 The Game Awards 2024 的 Best
              Action Game 和 Players' Voice），而不是评审团评选的 Game of the Year。除软件销量外，Game Science
              还通过消费品授权获得可观的配套收入，包括饮料促销和联名珠宝系列，其零售额超过 RMB 1.5 billion。Game Science 在 Gamescom 2025 上公布了 Black Myth: Zhong
              Kui 的电影化预告片，开启多作品神话宇宙。该项目仍处早期，没有确认的引擎、发布时间窗口或可玩代码，后续收入可见度因此受限。
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO013
