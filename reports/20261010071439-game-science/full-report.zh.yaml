  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出纳入项与现状替代品
        blocks:
          - type: paragraph
            body: >-
              评估 Game Science 的可触达市场，首先要划清预付费精品游戏购买与中国长期占主导地位的免费移动游戏之间的边界。工作室主要处于 PC
              和高端主机平台的精品单人动作角色扮演游戏（ARPG）领域，覆盖标准数字版、数字豪华包和实体收藏版 SKU。该类别不包括 Honor of Kings、Genshin Impact
              等移动游戏常见的游戏内微交易、付费取胜机制、抽卡角色变现和平台订阅费。移动长线运营游戏确实直接争夺消费者的休闲时间和可选娱乐预算，但 Black Myth: Wukong
              证明，精品全价游戏软件能让核心玩家展现独立的支付意愿。除直接软件销售外，市场边界还包括高毛利的配套 IP 商业化，例如联名生活方式商品、实体收藏品和文化旅游合作，以变现系列的文化影响力。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
              - CM012
              - CM015
