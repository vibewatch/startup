    title: 多空论点表
    columns:
      - 论点组成
      - 核心论述
      - 关键证据
      - 哪些情况会改变判断
    rows:
      - - 核心论点：AAA 制作效率
        - Game Science 以远低于西方制作预算的成本，展现了世界级 AAA 执行能力（$70M 对比 $200M+）。
        - 500M RMB 预算、140 人核心团队，在 PC 和主机平台售出 30M 份。
        - 续作预算不断升至 $150M 以上，或关键技术总监流失。
      - - 核心论点：已验证的 IP 长寿性
        - Black Myth 已成为文化标志，并拥有强劲的周边和授权变现能力。
        - 联名零售珠宝销售额超过 1.5B RMB，且在 Gamescom 重磅公布续作。
        - 续作预购量大幅下滑，或无法将世界观转化为西方市场吸引力。
      - - 反方论点：收入波动集中
        - 单机 AAA 发布通常高度依赖前置变现，后续收入会严重衰减。
        - '80% 的销量发生在首月；Black Myth: Zhong Kui 发售前存在多年空档。'
        - 引入持续运营模式或年度化扩展收入。
      - - 反方论点：治理集中
        - Tencent 整合为唯一外部股东，限制了流动性选择和少数股东的议价能力。
        - Tencent 收购早期投资者 Hero Games 的股份，将持股扩大至 24%。
        - 独立的 IPO 前重组，或在科创板 / 港交所上市。
    notes: 将竞争优势与单机工作室变现模式的结构性约束进行对照。
