      - number: '1.2'
        title: 创始领导层、创意权力与治理
        blocks:
          - type: paragraph
            body: >-
              Game Science 对两位核心领导人高度依赖：CEO Feng Ji（网名 Yocar）和艺术总监 Yang Qi。Feng Ji 负责工作室顶层战略、系列架构、商业定位和核心设计理念，此前曾任
              Tencent Asura 的首席设计师。Yang Qi 统筹视觉设计、审美世界构建、神话生物创作和电影化场景调度。管理层还由另外 5 名于 2014 年共同离开 Tencent
              的联合创始人支持，确保游戏工程、战斗机制和 Unreal Engine 流程保持高度技术连续性。这种权力集中带来了不妥协的创意控制力：例如领导层选择搁置 Black Myth: Wukong 的近期
              DLC，转而专注全新作品。但工作室没有独立董事会或公开治理监督，战略和关键人物执行风险直接集中在创始人身上。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
      - number: '1.3'
        title: 资本化历史、所有权结构与利益相关方动态
        blocks:
          - type: paragraph
            body: >-
              Game Science 的资本化轨迹显示，公司选择外部融资时始终把创始人的运营控制权放在核心位置。2021 年 3 月，工作室早期预 alpha 游戏预告片走红后，Tencent 收购了初始 5%
              的少数股权，以支持迁移到 Unreal Engine 5。中国商业登记文件显示，截至 2026 年 4 月下旬，早期投资者 Hero Entertainment 的关联方 Hero Jin Kong（原持股
              19.0%）出售所持股份后，Tencent 的股权增至 24.0%。Tencent 由此成为 Game Science 唯一的外部机构股东。尽管 Tencent 持股增加，创始人 Feng Ji 仍以
              38.76% 的直接股权成为最大个人股东，深圳两家员工合伙持股平台合计持有约 37.0%。Game Science 从未宣布正式的上线后定价融资轮或机构要约，所以上线后股权估值和私募市场定价仍未得到验证。
            claimRefs:
              - CO005
              - CO006
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
