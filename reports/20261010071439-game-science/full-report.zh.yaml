companyProfile:
  summary: >-
    Game Science 是一家成立于 2014 年的中国 AAA 电子游戏工作室，由前 Tencent 开发者 Feng Ji 和 Yang Qi 创办。公司最知名的作品是 Black Myth: Wukong，这款爆款动作
    RPG 证明了中国创始人主导的工作室也能推出具备全球竞争力的精品游戏。如今，公司以私有、上线后的系列扩张体形式运营，在深圳和杭州设有双工作室，Tencent 是唯一外部股东，且正在开发下一部 Black Myth 作品。
  foundedDate: '2014-06-13'
  founders:
    - name: Feng Ji
      role: 联合创始人兼 CEO
      background: 前 Tencent Asura 首席设计师，负责工作室战略和系列方向。
    - name: Yang Qi
      role: 联合创始人兼艺术总监
      background: 前 Tencent Asura 创意负责人，统筹视觉方向和世界构建。
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: '以 Black Myth: Wukong 和在研的 Black Myth: Zhong Kui 为核心的精品动作 RPG 与系列 IP。'
  customerFocus: 精品 PC 和主机游戏玩家，尤其是中国及全球动作 RPG 玩家
  businessModel: 预付费精品游戏销售，辅以 IP 授权和联名消费品
  stage: Private, post-launch franchise scale-up
  fundingStatus: 私人持有；Hero Games 退出后，Tencent 作为唯一外部股东持有 24%，且尚未披露上线后的定价融资轮。
  disclosureProfile: private-undisclosed
chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、起源与运营模式
        blocks:
          - type: paragraph
            body: >-
              Shenzhen Youke Interactive Technology Co., Ltd. 以 Game Science 名义开展商业运营，由 Feng Ji 和 Yang Qi 带领的 7 名前
              Tencent 开发者于 2014 年 6 月 13 日注册成立。团队此前在 Tencent Quantum Studio 开发了融入神话元素的 MMO
              Asura，之后离开并成立独立开发主体，专注于高保真游戏体验。Game Science 在中国设有双工作室：公司行政中枢位于深圳南山区，创意开发位于杭州西湖区。在进入全规模 AAA
              制作前，公司靠两款早期作品维持运营：NetEase 发行的 2015 年三国卡牌游戏 100 Heroes（Bai Jiang Xing），以及与 Hero Entertainment 合作发行的 2016
              年多平台即时战略游戏 Art of War: Red Tides。两款早期作品都没有成为商业爆款，但带来了现金流，也验证了制作流程。工作室采用精简的内部核心团队，约有 100 至 140
              名开发者，并大量借助数百名外部承包商完成视觉资产、3D 扫描、动画和动作捕捉。
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
