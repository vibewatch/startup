            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 爆款驱动型私有工作室的估值纪律
            body: >-
              尽管 Game Science 凭 Black Myth: Wukong 取得了历史性的商业成就，但当作品之间的过渡期超过 3 年时，爆款驱动型工作室的私募股权估值会严重压缩。Tencent
              整合为唯一外部股东，凸显战略一致性，却限制了外部价格发现。
            calloutType: insight
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV014
