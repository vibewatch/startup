      layers:
        - label: 产品与 IP 表面
          detail: 'Black Myth: Wukong 是已交付的动作 RPG；Zhong Kui 是已宣布、处于早期阶段的后续作品。'
          modules:
            - 'Black Myth: Wukong'
            - 'Black Myth: Zhong Kui'
        - label: 核心引擎
          detail: 据报道，Unreal Engine 5 是核心引擎，但工作室的修改内容和引擎治理模式并未公开。
          modules:
            - Unreal Engine 5
        - label: 渲染与重建
          detail: DirectX 12、路径追踪、DLSS、FSR、XeSS 和原生时间性升频构成多厂商图形技术栈。
          modules:
            - DirectX 12 与路径追踪
            - DLSS、FSR、XeSS 与 TSR
        - label: 中间件与保护
          detail: SteamDB 检测到音频、物理、布料、图形和反篡改依赖，而非专有的全栈平台。
          modules:
            - Wwise、XAudio2 与 iZotope
            - PhysX、NvCloth 与图形 SDK
            - Denuvo
        - label: 平台执行
          detail: 公开目标覆盖 PC 商店、PS5 和 Xbox Series X|S，但受到 Steam Deck 约束。
          modules:
            - PC 商店
            - PS5
            - Xbox Series X|S
            - SteamOS 兼容性
        - label: 运营与控制
          detail: 官方补丁证明存在维护活动；安全治理、测试自动化、事件响应和服务目标没有公开证据。
          modules:
            - 多平台版本化补丁
            - 未披露的工程和控制指标
    approximationNotes: 层级顺序是对已观察组件的分析性呈现，不主张未披露的内部数据流或专有架构。
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE012
      - CE013
      - CE016
  - id: FU001
    title: 已观察到的客户旅程与证据断点
    type: journey-map
    summary: 该旅程将已观察到的需求信号，与仍未量化、构成尽调缺口的留存和变现环节分开。
    data:
      items:
        - label: 认知
          description: 预告片、社交讨论及相关 Bilibili 视频带来发现度。
          touchpoints:
            - Bilibili 视频活动
            - 系列公告
        - label: 商店访问
          description: 官方网站列出了 PC 和主机商店的可用性。
          touchpoints:
            - Steam、Epic Games Store 和 WeGame
            - PS5 和 Xbox Series X|S
        - label: 付费转化
          description: 已披露销量直接证明认知转化成了购买。
          touchpoints:
            - 首周 1,500 万份
            - 首月 2,000 万份
        - label: 发布后需求
          description: 首年销量超过 3,000 万份，但月度曲线未披露。
          touchpoints:
            - 首年售出量
            - 2026 年折扣公告
        - label: 系列延伸
          description: 演唱会和联名产品显示需求已超出基础游戏。
          touchpoints:
            - 售罄的交响音乐会
            - Luckin Coffee 和 Chow Tai Fook 联动活动
        - label: 持久性缺口
          description: 留存、续约、重复购买以及工作室在合作方经济收益中的份额仍未量化。
          touchpoints:
            - 没有活跃用户队列
            - 没有披露授权续约或净回款
    approximationNotes: 该序列是分析框架，而非实测转化漏斗；不代表任何转化率或共同用户群体。
