figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 记录 Game Science 自 2014 年由 Tencent 前员工创立，到全球 AAA 商业化和系列扩张的历史沿革。
    data:
      items:
        - date: '2014-06-13'
          label: 工作室成立
          detail: Feng Ji 和 Yang Qi 携五名核心同事离开 Tencent，成立深圳游科互动科技。
          tone: positive
        - date: '2015-07-23'
          label: 100 Heroes 上线
          detail: 工作室发布由 NetEase 发行的三国题材移动卡牌战斗游戏，获得基础运营现金流。
          tone: neutral
        - date: '2016-12-22'
          label: '《Art of War: Red Tides》游戏'
          detail: 工作室在 Steam 抢先体验和 iOS App Store 上线 RTS 游戏，获得 Hero Entertainment 的发行支持。
          tone: neutral
        - date: '2020-08-20'
          label: 首支 Wukong 游戏预告片
          detail: 在 Bilibili 发布的 13 分钟预 Alpha 游戏演示于 24 小时内获得 10M 次观看，点燃全球关注。
          tone: positive
        - date: '2021-03-30'
          label: Tencent 5% 少数股权投资
          detail: Tencent 初始收购 5% 少数股权，以支持技术扩张及向 Unreal Engine 5 迁移。
          tone: positive
        - date: '2024-08-20'
          label: 'Black Myth: Wukong 全球发售'
          detail: 'Game Science 在 PC 和 PS5 上推出 Black Myth: Wukong，四天内销量超过 1,000 万份。'
          tone: positive
        - date: '2025-08-20'
          label: Gamescom 发布 Zhong Kui 预告
          detail: '工作室在 Gamescom 揭晓 Black Myth: Zhong Kui CGI 预告，将资源转向下一款游戏，同时搁置 Wukong DLC。'
          tone: neutral
        - date: '2026-04-30'
          label: Tencent 持股扩大至 24%
          detail: 根据工商备案，Tencent 收购 Hero Jin Kong 的 19% 股份，成为 Game Science 唯一的外部股东。
          tone: positive
    approximationNotes: 日期源自公司注册记录、游戏平台发布信息及可核验的工作室公开公告。
    claimRefs:
