      - number: '2.2'
        title: TAM、SAM 与受约束的估值视角
        blocks:
          - type: paragraph
            body: >-
              评估 Game Science 的市场潜力，需要多个量化视角，而不是一个投机性的自上而下数字。最宽口径下，TAM 是超过 $180 billion 的全球电子游戏软件市场，覆盖所有形态；其中全球精品 PC
              和主机游戏软件约为 $60 billion。SAM 聚焦中国国内单人游戏市场，以及全球动作 RPG 爱好者的需求。据 Statista，中国国内单人游戏市场 2023 年规模为 $2 billion，7
              年间从小众基础扩张至原来的二十倍；相比之下，2016 年美国和日本成熟的单人游戏市场分别为 $10 billion 和 $5 billion。Black Myth: Wukong
              在首发窗口占据了这一可触达细分市场的异常高份额；据 Niko Partners，其两周内产生 $700 million 毛收入，销量达到 18 million 份，而制作预算为 $70
              million。首年全球销量超过 30 million 份，为中国开发的 AAA 游戏商业速度建立了经验性的上限基准，也验证了玩家对高保真神话 IP 的数百万份需求。
