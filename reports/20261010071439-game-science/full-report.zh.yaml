            body: >-
              Game Science 高度依赖第三方分发平台触达全球受众，通过 Steam、PlayStation Network、Epic Games Store 和 WeGame 等数字商店销售 Black Myth:
              Wukong。Steam 等数字商店通常从毛销售额中扣除百分之三十佣金，在净收入到达工作室前造成显著利润拖累。同时，外部股东集中度已达到关键阈值。2026 年 5 月，Tencent 从长期伙伴 Hero
              Games 手中收购股份，将少数股权扩大至百分之二十四，成为 Game Science
              唯一外部机构股东。这种单一交易对手治理结构，在未来发行权、知识产权开发、战略平台选择和长线运营变现偏好上都可能产生利益一致性风险。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: 国内监管监督与剩余风险画像
        blocks:
          - type: paragraph
            body: >-
              在中国大陆运营，意味着 Game Science 受到国家新闻出版署严格监管。每一款商业游戏上线都需要正式国内出版许可，即版号审批，并遵守强制的未成年人游戏时长防沉迷认证系统。Black Myth: Wukong
              虽成功通过国内监管并获得巨大的文化认可，但包括 Black Myth: Zhong Kui
              在内的每部后续作品，都必须在国内商业上线前独立取得监管批准。任何潜在监管收紧、内容修改要求或审批长期冻结，都会直接带来排期和收入风险。总体而言，Game Science
              的风险画像高度集中，特征包括较高的创意执行难度、多年的制作管线空档、平台佣金摩擦，以及对单一股东治理的敏感性。
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR009
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 续作开发空档威胁商业动能
            body: '搁置 DLC、转而从零开始 Black Myth: Zhong Kui，会造成 3 至 5 年收入空档，使 Game Science 在承担完整 AAA 工作室开销的同时依赖目录长尾销售。'
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: 单一外部股东集中
            body: Tencent 收购 Hero Games 股份、将持股扩大至 24% 后，Game Science 对这家行业巨头的分发、技术协同和资本治理依赖加深，战略依赖风险随之上升。
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与商业进展
        blocks:
          - type: paragraph
            body: >-
              Game Science 通过推出 Black Myth: Wukong 并取得压倒性的口碑和财务成功，重新定义了中国精品游戏的全球商业可行性。工作室 3 天售出 10 million 份，首年生命周期销量超过
              30 million，证明融入古典神话的高保真动作作品可以在全球获得精品定价。积极投资论点的基础是非凡的资本效率：工作室以据估算约为 500 million yuan（$70 million）的预算、140
              名内部开发者和 300 名专业外包伙伴，达成了 AAA 级制作水准；西方大片的成本则通常超过 $200 million。但反面论点指出，单人精品发行天然收入波动剧烈，初期几周可能收割最多 80%
              的主要生命周期商业销量，下一部大作前会留下多年的收入低谷。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
      - number: '8.2'
        title: 融资背景、股权结构表与估值基准
        blocks:
          - type: paragraph
            body: >-
              Game Science 的股权轨迹显示，公司已从早期战略支持转向与大型集团紧密整合。2017 年，Hero Games 以 60 million yuan 收购 20% 股权，建立了 300 million
              yuan（按历史汇率为 $8.5 million）的早期投后估值基准。2026 年 5 月，Tencent 达成协议收购 Hero Games 的股份，将总持股扩大至 24%，并巩固其作为 Game
              Science 唯一外部机构股东的地位。双方都没有披露财务对价或隐含估值倍数，外部投资者因此无法获得透明的二级定价。可比独立精品工作室的基准估值通常为正常化现金流的 8x 至 12x；将这一倍数用于 Game
              Science 的估算现金收益，意味着 $1.8 billion 至 $2.5 billion 的企业价值，但治理可见度不足，需保持谨慎。
            claimRefs:
              - CV001
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV014
      - number: '8.3'
        title: 情景分析、单位经济性与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              评估 Game Science，需要考虑爆款驱动收入衰减和不断上升的开发支出的情景财务模型。乐观情景（20% 概率）假设 Black Myth: Zhong Kui 在 2027 年前商业发行并售出 20
              million 份，强劲的多平台授权和目录长尾使企业估值维持在 $3.5 billion 至 $4.5 billion。基准情景（55% 概率）假设开发周期延续至 2028 年、续作销量为 12 至 15
              million 份，对应估值 $1.8 billion 至 $2.5 billion。悲观情景（25% 概率）假设开发延迟至 2029 年以后、每小时游戏内容制作成本上升、创作者可能疲劳，估值压缩至 $800
              million 至 $1.0 billion 的净现金储备附近。下行触发因素包括核心领导离职，或未缓解的职场和沟通审查引发严重品牌损害。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV014
      - number: '8.4'
        title: 投资建议与尽调路线图
        blocks:
          - type: paragraph
            body: >-
              我们的结论是：Game Science
              应保持继续研究立场，风险评级较高，估值判断为合理。工作室的技术实力和已验证的票房执行力使其处于全球开发商的精英梯队，但私人资本配置者仍面临重大结构性风险。单一系列集中、缺乏区分消费者毛支出和工作室净现金收入的公开财务报表，以及
              Tencent 作为唯一外部股东的主导地位，共同构成较高治理壁垒。关键尽调里程碑包括跟踪 Black Myth: Zhong Kui 的早期玩法展示和制作节奏、监测创始技术团队的高管留任，以及在投入扩张资本前核实
              Tencent 股权的经济条款和优先权。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
