      - number: '3.2'
        title: 技术能力与制作架构
        blocks:
          - type: paragraph
            body: >-
              Game Science 的竞争力很大程度依赖高端图形工程和深厚的神话世界构建，并以 Epic Games 的 Unreal Engine 5 执行。工作室采用 Nanite 虚拟化几何和 Lumen
              全局光照等前沿技术，达到了顶级国际动作 RPG 的视觉呈现，同时维持约 140 名内部员工，辅以 300 名外包贡献者。这套制作模式实现了显著成本效率：以据估算约为 $70 million
              的开发成本交付了获好评的 20 多小时流程，远低于 Cyberpunk 2077 或 Horizon Forbidden West 等国际同类作品。不过，技术执行也是一把双刃剑：Xbox Series X 和 S
              等不同硬件配置上的多平台主机优化持续带来工程难题，可能延迟发布并压缩平台首发覆盖。
            claimRefs:
