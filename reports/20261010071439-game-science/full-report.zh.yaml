      - number: '2.3'
        title: 玩家与买家分层、预算分配和采用触发因素
        blocks:
          - type: paragraph
            body: >-
              Game Science 产品的商业采用路径，取决于国内外不同地区的消费者和机构买家类型。主要客户群是拥有能运行 Unreal Engine 5 游戏的现代显卡设备的中国 PC
              游戏爱好者。对这类玩家而言，Black Myth: Wukong 是文化里程碑，带动了 Steam 和 WeGame 上以 268 RMB 标准价进行的大量首日自发购买。第二个核心群体是北美、欧洲和东亚的国际动作
              RPG 主机及 PC 玩家，工作室通过 Sony PlayStation 5 和 Microsoft Xbox Series 商店触达他们，标准精品价位为 300 至 500 RMB（相当于 $60 至 $70
              USD）。第三层变现来自购买联名消费品的文化兴趣非游戏玩家和收藏者，例如 Chow Tai Fook 的授权珠宝系列零售额超过 1.5 billion RMB。Nvidia 等硬件厂商和 Sony
              等平台运营商也属于机构利益相关方，它们通过联合营销展示尖端图形能力，成为战略采用伙伴。
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM012
