      - number: '2.4'
        title: 市场增长动力、商业逆风与监管约束
        blocks:
          - type: paragraph
            body: >-
              Game Science 的持续市场增长由多项结构性顺风推动，包括国内对文化真实性叙事游戏的需求上升、PC
              硬件普遍升级，以及中国监管机构推动高质量文化出口的明确政策取向。但工作室的长期商业画像也受到重要结构性约束。第一，精品单人游戏的收入前置，生命周期销量大部分在上线后的最初几周完成，因此发行间隔需要很长的资本周期。第二，Steam
              和 PlayStation Store 等数字分发商通常抽取 30% 的平台分成，Epic Games 还收取 5% 的 Unreal Engine 5 版税，工作室收到款项前固定扣除 35%
              的毛平台费用。第三，国内商业化必须应对中国严格的游戏版号审批和游戏时长合规框架。最后，工作室战略性搁置近期 DLC 扩展、转而开发 Black Myth: Zhong
              Kui，会推迟眼前的增量现金创造，使长期估值高度依赖续作多年的执行。
            claimRefs:
              - CM003
              - CM004
              - CM008
              - CM009
              - CM011
              - CM013
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 中国免费游戏均衡的供给侧扰动
            body: >-
              十多年来，中国游戏生态由 Honor of Kings 等免费移动巨头主导，它们凭借更短的开发周期产生持续的微交易收入。Black Myth: Wukong 证明，庞大的国内受众既有硬件，也愿意为世界级单人
              AAA 体验支付高额预付费，创造了此前没有形成规模的可行国内市场细分。
            calloutType: insight
            claimRefs:
              - CM001
              - CM004
              - CM007
              - CM015
          - type: callout
            title: 结构性利润稀释与长周期现金转化
            body: >-
              与能立即产生长线运营现金流的移动游戏不同，精品 AAA 作品的绝大多数生命周期收入集中在首发窗口，同时需要多年的开发周期，并承担 30% 平台分成和 5% 引擎版税。Game Science 放弃 DLC
              扩展、转向 Black Myth: Zhong Kui，牺牲眼前的增量变现，换取更长周期的续作经济性。
            calloutType: risk
            claimRefs:
              - CM003
              - CM008
              - CM009
              - CM013
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局概览与分类
        blocks:
          - type: paragraph
            body: >-
              围绕 Game Science 的竞争场域包含三类开发商：国内长线运营移动游戏巨头、新兴中国精品主机工作室，以及成熟的欧美和日本 AAA 发行商。在国内，Tencent 和 NetEase
              长期依靠社交网络驱动的免费移动游戏和持续微交易，占据市场市值和收入主导地位。相比之下，Game Science 于 2024 年 8 月 20 日在 PC 和主机平台推出 Black Myth:
              Wukong，开创了中国精品单人 AAA 细分市场，证明国内工作室可以在高保真动作 RPG 领域全球竞争。但 Wukong 的商业突破也打破了此前壁垒，带动 S-Game 的 Phantom Blade
              Zero、Leenzee 的 Wuchang: Fallen Feathers，以及 NetEase 等大厂的 Blood Message 等国内同行快速入场。
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
