            title: 二次股权整合下仍保留创始人控制权
            body: >-
              尽管 Tencent 通过二次收购早期支持者 Hero Jin Kong 的股份，将持股扩大至 24%，创始人 Feng Ji 仍掌握运营领导权和 38.76% 的直接股权，员工持股池另有
              37%。这种公司架构保护了 Game Science 的独立创意决策，使其免受发行商干预。
            calloutType: strength
            claimRefs:
