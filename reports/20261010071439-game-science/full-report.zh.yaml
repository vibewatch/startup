      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 系列集中度与续作执行风险
            body: >-
              Game Science 的商业成功完全押注于一部作品。领导层决定搁置 Black Myth: Wukong 的近期 DLC，转而从零开始开发 Black Myth: Zhong
              Kui，使工作室面临核心游戏收入的多年空档，同时还要承受复制 Wukong 历史表现的巨大创意和制作压力。
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
