  - id: FE001
    title: Evidence-Bounded Product Technology Stack
    type: stack
    summary: >-
      Six publicly evidenced layers show the shipped product surface, third-party dependencies, platform targets, and
      the operational boundary that remains private.
    data:
      layers:
        - label: Product and IP surface
          detail: 'Black Myth: Wukong is the shipped action RPG; Zhong Kui is the announced early-stage follow-on.'
          modules:
            - 'Black Myth: Wukong'
            - 'Black Myth: Zhong Kui'
        - label: Core engine
          detail: >-
            Unreal Engine 5 is reported as the core engine, but the studio's modifications and engine-governance model
            are not public.
          modules:
            - Unreal Engine 5
        - label: Rendering and reconstruction
          detail: >-
            DirectX 12, path tracing, DLSS, FSR, XeSS, and native temporal upscaling expose a multi-vendor graphics
            surface.
          modules:
            - DirectX 12 and path tracing
            - DLSS, FSR, XeSS, and TSR
        - label: Middleware and protection
          detail: >-
            SteamDB detects audio, physics, cloth, graphics, and anti-tamper dependencies rather than a proprietary
            full-stack platform.
          modules:
            - Wwise, XAudio2, and iZotope
            - PhysX, NvCloth, and graphics SDKs
            - Denuvo
        - label: Platform execution
          detail: The public target surface spans PC storefronts, PS5, and Xbox Series X|S, with Steam Deck constraints.
          modules:
            - PC storefronts
            - PS5
            - Xbox Series X|S
            - SteamOS compatibility
        - label: Operations and controls
          detail: >-
            Official patches evidence maintenance activity; security governance, test automation, incident response, and
            service targets are not publicly evidenced.
          modules:
            - Versioned multi-platform patches
            - Undisclosed engineering and control metrics
    approximationNotes: >-
      Layer ordering is an analytical presentation of observed components and does not assert undocumented internal data
      flows or proprietary architecture.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE012
      - CE013
      - CE016
  - id: FU001
    title: Observed customer journey and evidence breaks
    type: journey-map
    summary: >-
      The journey separates observed demand signals from the unmeasured retention and monetization steps that remain
      diligence gaps.
    data:
      items:
        - label: Awareness
          description: Trailers, social discussion, and related Bilibili videos create discovery.
          touchpoints:
            - Bilibili video activity
            - Franchise announcements
        - label: Storefront access
          description: The official site lists PC and console storefront availability.
          touchpoints:
            - Steam, Epic Games Store, and WeGame
            - PS5 and Xbox Series X|S
        - label: Paid conversion
          description: Reported unit sales provide direct proof that awareness converted into purchases.
          touchpoints:
            - 15M copies in the first week
            - 20M copies in the first month
        - label: Post-launch demand
          description: First-year sales exceeded 30M copies, but the monthly curve is not disclosed.
          touchpoints:
            - First-year sell-through
            - 2026 discount announcements
        - label: Franchise extension
          description: Concerts and co-brand products show demand beyond the base game.
          touchpoints:
            - Sold-out symphonic concerts
            - Luckin Coffee and Chow Tai Fook activations
        - label: Durability gap
          description: Retention, renewal, repeat purchase, and studio share of partner economics remain unmeasured.
          touchpoints:
            - No active-user cohorts
            - No disclosed licensing renewals or net receipts
    approximationNotes: >-
      The sequence is analytical rather than a measured conversion funnel; no conversion rate or shared population is
      implied.
    claimRefs:
