              - CU003
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.2'
        title: Adoption and demand proof
        blocks:
          - type: paragraph
            body: >-
              The clearest customer proof is paid sell-through. Wikipedia and KrASIA both report 20 million copies in
              the first month, and KrASIA reports that sales exceeded 30 million within the first year. KrASIA also
              reports 15 million copies in the first week and nearly 700 million views for related Bilibili videos,
              showing that purchase velocity and audience attention reinforced one another. Demand extended beyond the
              software transaction: a symphonic concert series sold out almost immediately, a Luckin Coffee
              collaboration made a themed latte a top seller, and Chow Tai Fook reported RMB 1.5 billion in retail sales
              for its co-branded jewelry. These are strong franchise-affinity signals, but only unit sales are direct
              evidence of game buyers; views, sell-outs, and partner retail sales use different populations and
              denominators.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
      - number: '6.3'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public adoption evidence does not establish durable engagement. One independent analysis describes premium
              single-player games as front-loaded, with the first month potentially accounting for 80% of total sales,
              and another investment page explicitly identifies single-title dependency as a risk. Game Science's 2026
              official page shows periodic 25% and 30% sale announcements, but promotions do not reveal active users,
              repeat purchase, churn, or cohort retention. Co-branding may extend the franchise into food, jewelry,
              peripherals, and lifestyle products; however, reported partner sell-through and licensing-fee ranges do
              not disclose Game Science's net receipts, contract duration, renewal rate, or minimum guarantees.
              Separately, reporting about historical sexism allegations and the company's decision not to answer
              questions creates a reputational diligence issue, but the retained sources do not quantify any customer
              loss attributable to it.
            claimRefs:
              - CU010
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
