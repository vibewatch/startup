  - id: FP001
    title: 'Competitive Positioning: Production Budget vs Monetization Horizon'
    type: quadrant
    summary: >-
      Strategic positioning map contrasting game developers across development cost basis (X-axis) and monetization
      durability (Y-axis), positioning Game Science as a high-efficiency premium player.
    approximationNotes: >-
      Scores represent ordinal positioning on a 0 to 10 scale derived from reported production budgets, team sizes, and
      monetization mechanics rather than continuous metrics.
