chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Origins, and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Shenzhen Youke Interactive Technology Co., Ltd., operating commercially as Game Science, was incorporated
              on June 13, 2014, by a team of seven former Tencent developers led by Feng Ji and Yang Qi. The team had
              previously developed the mythology-infused MMO Asura at Tencent's Quantum Studio before departing to
              establish an independent development vehicle dedicated to high-fidelity gameplay. Game Science operates
              dual studio locations across China, anchoring corporate administration in Shenzhen's Nanshan District and
              creative development in Hangzhou's Xihu District. Prior to embarking on full-scale AAA production, Game
              Science sustained operations through two initial titles: the 2015 Three Kingdoms card-battler 100 Heroes
              (Bai Jiang Xing), published by NetEase, and the 2016 multiplatform real-time strategy title Art of War:
              Red Tides, published with Hero Entertainment. While neither early release achieved breakout commercial
              status, they provided cash flow and validated production workflows. The studio's operating model relies on
              a lean core internal staff of approximately 100 to 140 developers, heavily augmented by hundreds of
              external contractors specializing in visual assets, 3D scanning, animation, and motion capture.
            claimRefs:
              - CO001
              - CO002
              - CO011
              - CO012
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO008
              - CO011
      - number: '1.2'
        title: Founding Leadership, Creative Authority, and Governance
        blocks:
          - type: paragraph
            body: >-
              Game Science exhibits intense key-person dependency on its two principal leaders, Chief Executive Officer
              Feng Ji (online handle Yocar) and Art Director Yang Qi. Feng Ji drives high-level studio strategy,
              franchise architecture, commercial positioning, and core design philosophy, having previously served as
              lead designer for Tencent's Asura. Yang Qi oversees visual design, aesthetic world-building, mythological
              creature conception, and cinematic staging. The executive duo is supported by five additional co-founders
              who transitioned together from Tencent in 2014, ensuring exceptional technical continuity across game
              engineering, combat mechanics, and Unreal Engine pipelines. This concentration of authority has enabled
              uncompromising creative control, as demonstrated when leadership chose to shelve near-term downloadable
              content for Black Myth: Wukong to focus on a brand-new title. However, the studio lacks an independent
              board of directors or public governance oversight, concentrating strategic and key-person execution risk
              directly in the founders.
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO001
              - CO003
              - CO004
      - number: '1.3'
        title: Capitalization History, Ownership Structure, and Stakeholder Dynamics
        blocks:
          - type: paragraph
            body: >-
              The capitalization trajectory of Game Science reflects selective external financing structured to preserve
              founder operational control. In March 2021, following the viral success of the studio's initial pre-alpha
              gameplay trailer, Tencent acquired an initial 5% minority equity stake to support technical migration to
              Unreal Engine 5. Chinese commercial registration filings indicate that by late April 2026, Tencent's
              equity stake expanded to 24.0% when Hero Jin Kong, an affiliate of early investor Hero Entertainment that
              held 19.0%, divested its position. Tencent acquired this position to become Game Science's sole external
              institutional shareholder. Despite Tencent's increased equity presence, founder Feng Ji remains the
              largest individual shareholder with 38.76% direct equity, while two Shenzhen employee partnership vehicles
              hold approximately 37.0% combined. Game Science has never announced a formal post-launch priced financing
              round or institutional tender, leaving post-launch equity valuation and private market pricing unverified.
            claimRefs:
              - CO005
              - CO006
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO012
      - number: '1.4'
        title: Commercial Scale, Milestone Chronology, and Franchise Roadmap
        blocks:
          - type: paragraph
            body: >-
              Black Myth: Wukong launched globally on August 20, 2024, across PC and PlayStation 5 platforms. On August
              23, 2024, Game Science published its only officially verified sales milestone: exceeding 10 million copies
              sold across all platforms within four days, accompanied by peak concurrent player counts exceeding 3
              million. Subsequent external estimates citing 18 million, 20 million, or 30 million copies sold have
              proliferated across secondary research, along with claims of winning mainstream Game of the Year honors.
              However, studio leadership has repeatedly clarified that external figures are unconfirmed and that Wukong
              won category honors (such as Best Action Game and Players' Voice at The Game Awards 2024) rather than jury
              Game of the Year. Beyond software unit sales, Game Science has generated significant ancillary revenue
              through consumer licensing, including beverage promotions and co-branded jewelry lines exceeding RMB 1.5
              billion in retail sales. At Gamescom 2025, Game Science revealed a cinematic teaser for Black Myth: Zhong
              Kui, inaugurating its multi-title mythological universe. Development remains in early stages with no
              confirmed engine, release window, or playable code, leaving follow-on revenue visibility constrained.
            claimRefs:
              - CO007
              - CO008
              - CO009
              - CO010
              - CO013
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO009
              - CO010
              - CO012
              - CO013
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Franchise Concentration and Sequel Execution Risk
            body: >-
              Game Science's commercial success rests entirely on a single release. Leadership's decision to shelve
              near-term downloadable content for Black Myth: Wukong in favor of initiating Black Myth: Zhong Kui from
              scratch leaves the studio facing a multi-year gap in core game revenue while confronting substantial
              creative and production pressure to replicate Wukong's historic performance.
            calloutType: risk
            claimRefs:
              - CO009
              - CO010
          - type: callout
            title: Founder Equity Control Preserved Amid Secondary Consolidation
            body: >-
              Despite Tencent expanding its equity stake to 24% via secondary buyout of early backer Hero Jin Kong,
              founder Feng Ji maintains operational leadership and 38.76% direct equity alongside 37% employee equity
              pools. This corporate architecture protects Game Science's independent creative decision-making from
              publisher interference.
            calloutType: strength
            claimRefs:
              - CO003
              - CO006
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Spend Inclusions, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Defining the addressable market for Game Science requires drawing a clean boundary between upfront premium
              game purchases and China's historically dominant free-to-play mobile gaming industry. The studio operates
              primarily within the premium single-player action role-playing game (ARPG) sector across PC and high-end
              console platforms, encompassing standard digital editions, digital deluxe packages, and physical collector
              SKUs. This category excludes in-game microtransactions, pay-to-win mechanics, gacha character
              monetization, and recurring platform subscription fees that characterize mobile titles such as Honor of
              Kings and Genshin Impact. While live-service mobile games compete directly for consumer leisure time and
              discretionary entertainment budgets, Black Myth: Wukong demonstrated that premium full-price game software
              commands distinct willingness to pay among core players. Beyond direct software sales, the market boundary
              encompasses high-margin ancillary IP commercialization, including co-branded consumer lifestyle
              merchandise, physical collectibles, and cultural tourism partnerships that monetize the franchise's
              cultural footprint.
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM010
              - CM012
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM012
      - number: '2.2'
        title: TAM, SAM, and Constrained Sizing Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating Game Science's market potential requires multiple quantitative lenses rather than a single
              speculative top-down figure. At the broadest level, the total addressable market (TAM) encompasses the
              global video game software market exceeding $180 billion across all form factors, within which global
              premium PC and console gaming software accounts for approximately $60 billion. The serviceable addressable
              market (SAM) focuses on the domestic Chinese single-player gaming sector alongside global action-RPG
              enthusiast demand. According to Statista, China's domestic single-player game market stood at $2 billion
              in 2023, having expanded twentyfold over seven years from a niche base, compared to mature single-player
              markets of $10 billion in the United States and $5 billion in Japan as of 2016. In its initial launch
              window, Black Myth: Wukong captured an extraordinary share of this addressable segment, generating $700
              million in gross revenue within two weeks according to Niko Partners and selling 18 million units against
              a $70 million production budget. First-year sell-through surpassed 30 million units worldwide,
              establishing an empirical upper-bound benchmark for Chinese-developed AAA commercial velocity while
              validating multi-million unit demand for high-fidelity mythological IP.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM008
              - CM009
              - CM010
              - CM013
              - CM014
