              - CE014
      - number: '5.2'
        title: Publicly Visible Architecture and Dependencies
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a component inventory rather than a verified internal architecture. A community
              history reports that Wukong moved to Unreal Engine 5 by 2021, while independent benchmark coverage
              identifies Unreal Engine 5, DirectX 12, path tracing on NVIDIA hardware, and DLSS, FSR, XeSS, and native
              temporal upscaling options. SteamDB's detected-technology record adds a wider set of third-party
              dependencies, including NVIDIA graphics SDKs, AMD FidelityFX, Intel XeSS, Wwise, XAudio2, iZotope, PhysX,
              NvCloth, and Denuvo. Those observations make engine, GPU-vendor, audio-middleware, DRM, and platform
              compatibility dependencies visible, but they do not establish Game Science's source-code structure, build
              pipeline, test automation, telemetry, security controls, or ownership boundaries. The architecture map
              therefore separates evidenced layers from diligence gaps instead of presenting inferred proprietary
              systems as fact.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE012
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE012
              - CE013
              - CE016
      - number: '5.3'
        title: Deployment, Reliability, and Support
        blocks:
          - type: paragraph
            body: >-
              Technical ambition creates measurable deployment friction. TechPowerUp framed its review around 35 GPUs
              and documented a feature-heavy PC renderer; DSOGaming found that only an RTX 4090 reached 60 fps at 1080p
              maximum settings without ray tracing, while no tested GPU reached 60 fps at native 4K maximum settings.
              The same analysis reported shader-compilation and traversal stutter even after an initial compilation
              step. Platform adaptation is uneven as well: SteamDB marks the game unsupported on Steam Deck despite
              SteamOS compatibility, and IGN reported screen tearing below 60 fps on Xbox Series X plus lower
              resolution, pixel count, and visual detail on Series S. Game Science does publish coordinated PC, PS5, and
              Xbox patch versions, showing an active maintenance channel, but the retained evidence does not disclose
              service targets, defect escape rates, incident history, or time-to-remediation metrics.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation, Roadmap, and Control Gaps
        blocks:
          - type: paragraph
            body: >-
              The defensible public differentiation is execution rather than disclosed proprietary infrastructure: Game
              Science combined a Chinese-mythology product identity with a demanding contemporary rendering stack and
              shipped it across major PC and console channels. Independent roadmap reporting says Zhong Kui is intended
              to use new visuals, technologies, and storytelling, but the same report places the project at a very early
              stage with no playable build at announcement. That makes the roadmap direction visible while leaving
              schedule, budget, staffing, platform scope, and technical reuse unverified. Trust evidence is narrower
              still. SteamDB detects Denuvo and numerous middleware SDKs, but anti-tamper software is not evidence of
              secure development, privacy governance, vulnerability handling, accessibility assurance, or formal quality
              management. Management diligence should therefore focus on milestone readiness and operating controls, not
              on extrapolating Wukong's shipped quality into the next title.
            claimRefs:
              - CE001
              - CE004
              - CE005
              - CE012
              - CE013
              - CE014
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rendering Ambition Raises the Portability Burden
            body: >-
              Independent PC and Xbox evidence shows that the visual stack can require top-end hardware, still exhibit
              shader or traversal stutter, and force visible console compromises; future platform plans need
              milestone-level performance proof.
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
          - type: callout
            title: Underwrite Controls, Not Just the Technology List
            body: >-
              Request the Zhong Kui milestone plan, target hardware matrix, automated test coverage, security and
              privacy ownership, incident-response process, and historical defect metrics before assigning value to
              roadmap reuse.
            calloutType: recommendation
            claimRefs:
              - CE013
              - CE014
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying channels
        blocks:
          - type: paragraph
            body: >-
              Game Science primarily serves individual premium-game buyers rather than a disclosed roster of enterprise
              customers. Its official site lists Black Myth: Wukong across PS5, Steam, Epic Games Store, WeGame, and
              Xbox Series X|S, while The Wire China independently confirms availability on Sony's PlayStation platform.
              Those storefronts are distribution channels, not evidence of customer concentration by themselves: the
              retained sources do not disclose unit or revenue shares by platform, geography, edition, or payer cohort.
              Earlier reach is visible but not directly comparable: a community history says Art of War: Red Tides
              received App Store recommendations in 154 countries and regions. Franchise licensees and co-brand partners
              form a secondary commercial surface, but their gross consumer sales must not be treated as Game Science
              revenue.
            claimRefs:
              - CU001
              - CU002
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU001
            claimRefs:
