    title: Thesis / anti-thesis table
    columns:
      - Thesis Component
      - Core Argument
      - Key Evidence
      - What Would Change View
    rows:
      - - 'Core Thesis: AAA Production Efficiency'
        - >-
          Game Science demonstrated world-class AAA execution at a fraction of Western production budgets ($70M vs
          $200M+).
        - 500M RMB budget, 140 core team, 30M units sold across PC and console platforms.
        - Escalating sequel budgets exceeding $150M or loss of key technical directors.
      - - 'Core Thesis: Proven IP Longevity'
        - Black Myth established a cultural touchstone with strong merchandise and licensing monetization.
        - Over 1.5B RMB in co-branded retail jewelry sales and major Gamescom announcement for sequel.
        - Severe drop-off in sequel pre-orders or inability to translate lore to Western markets.
      - - 'Anti-Thesis: Revenue Lumpiness'
        - Single-player AAA releases suffer from acute front-loaded monetization and severe subsequent revenue decay.
        - '80% of sales occur in month one; multi-year gap until Black Myth: Zhong Kui ships.'
        - Introduction of recurring live-service modes or annualized expansion revenue.
      - - 'Anti-Thesis: Governance Concentration'
        - >-
          Tencent's consolidation as sole outside shareholder limits liquidity options and minority shareholder
          leverage.
        - Tencent expanded ownership to 24% by buying out early backer Hero Games.
        - Independent pre-IPO recapitalization or public listing on STAR/HKEX.
    notes: Synthesizes competitive advantages against structural single-player studio monetization constraints.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV009
      - CV012
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Key Assumptions
      - Valuation / Return Logic
      - Primary Risks
      - Probability Signal
    rows:
      - - Bull Case
        - Zhong Kui launches by 2027 selling 20M+ units; franchise sustains annual licensing of $50M+
        - Implied valuation of $3.5B-$4.5B (12x-15x normalized FCF); substantial return on capital
        - Sequel production delays or creative burnout from core founders
        - 20%
      - - Base Case
        - Zhong Kui releases 2028 selling 12M-15M units; steady catalog tail sales of 2M units/yr
        - Implied valuation of $1.8B-$2.5B (8x-10x normalized FCF); fair investment hold
        - Lengthening production cycle and rising cost per hour of gameplay
        - 55%
      - - Bear Case
        - Zhong Kui delayed past 2029; developer departures; international player alienation
        - Valuation compresses toward studio liquidation value / net cash ($800M-$1.0B)
        - Key talent departures; intensified domestic regulatory restrictions
        - 25%
    notes: >-
      Scenario models evaluate equity value sensitivity to franchise sequel timing, unit sales, and production cost
      inflation.
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV009
      - CV012
      - CV014
figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Historical chronology of Game Science from its 2014 founding by Tencent veterans to global AAA commercialization
      and franchise expansion.
    data:
      items:
        - date: '2014-06-13'
          label: Studio Incorporation
          detail: >-
            Feng Ji and Yang Qi depart Tencent with five core colleagues to establish Shenzhen Youke Interactive
            Technology.
          tone: positive
        - date: '2015-07-23'
          label: Launch of 100 Heroes
          detail: >-
            Studio releases Three Kingdoms mobile card-battler published by NetEase, securing foundational operational
            cash flow.
          tone: neutral
        - date: '2016-12-22'
          label: 'Art of War: Red Tides'
          detail: >-
            Studio launches RTS title in Steam Early Access and iOS App Store with publishing support from Hero
            Entertainment.
          tone: neutral
        - date: '2020-08-20'
          label: First Wukong Gameplay Trailer
          detail: >-
            Thirteen-minute pre-alpha gameplay demo released on Bilibili hits 10 million views in 24 hours, igniting
            global interest.
          tone: positive
        - date: '2021-03-30'
          label: Tencent 5% Minority Investment
          detail: >-
            Tencent acquires an initial 5% minority equity stake to support technical scaling and transition to Unreal
            Engine 5.
          tone: positive
        - date: '2024-08-20'
          label: 'Global Release of Black Myth: Wukong'
          detail: 'Game Science launches Black Myth: Wukong on PC and PS5, selling over 10 million copies within four days.'
          tone: positive
        - date: '2025-08-20'
          label: Gamescom Teaser of Zhong Kui
          detail: >-
            Studio unveils Black Myth: Zhong Kui CGI teaser at Gamescom, pivoting resources to next game while shelving
            Wukong DLC.
          tone: neutral
        - date: '2026-04-30'
          label: Tencent Equity Stake Expands to 24%
          detail: >-
            Tencent acquires Hero Jin Kong's 19% stake according to business filings, becoming Game Science's sole
            external shareholder.
          tone: positive
    approximationNotes: >-
      Dates derived from corporate registration records, game platform releases, and verifiable studio public
      announcements.
