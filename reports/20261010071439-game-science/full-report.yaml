companyProfile:
  summary: >-
    Game Science is a Chinese AAA video game studio founded in 2014 by former Tencent developers Feng Ji and Yang Qi. It
    is best known for Black Myth: Wukong, the blockbuster action RPG that proved a founder-led Chinese studio can ship a
    globally competitive premium hit. The company now operates as a private, post-launch franchise scale-up with
    dual-studio roots in Shenzhen and Hangzhou, Tencent as its sole external shareholder, and a follow-on Black Myth
    title in development.
  foundedDate: '2014-06-13'
  founders:
    - name: Feng Ji
      role: Co-founder and CEO
      background: Former Tencent Asura lead designer who drives studio strategy and franchise direction.
    - name: Yang Qi
      role: Co-founder and art director
      background: Former Tencent Asura creative lead who oversees visual direction and world-building.
  foundingLocation: Shenzhen, China
  headquarters: Shenzhen, China
  productSummary: 'Premium action RPGs and franchise IP, led by Black Myth: Wukong and the in-development Black Myth: Zhong Kui.'
  customerFocus: Premium PC and console gamers, especially Chinese and global action-RPG players
  businessModel: Upfront premium game sales with ancillary IP licensing and co-branded consumer merchandise
