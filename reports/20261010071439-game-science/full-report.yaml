              - CU009
              - CU010
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Paid adoption is proven
            body: >-
              Independent reports converge on 20 million copies sold in the first month, and KrASIA reports more than 30
              million within the first year; this is materially stronger customer proof than views, wishlists, or logo
              placement.
            calloutType: strength
            claimRefs:
              - CU003
              - CU004
          - type: callout
            title: Retention remains unmeasured
            body: >-
              No retained source discloses active users, repeat purchase, cohort retention, refund rate, platform mix,
              geographic mix, or the studio's net share of co-brand retail sales.
            calloutType: risk
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Single-Franchise Concentration and Sequel Execution Gap
        blocks:
          - type: paragraph
            body: >-
              Game Science achieved unprecedented commercial scale with Black Myth: Wukong, selling over twenty million
              copies globally in its first month and establishing the studio as China's premier premium video game
              developer. However, this breakthrough success creates severe single-title revenue concentration. The
              studio shelved planned downloadable content in favor of initiating development on Black Myth: Zhong Kui, a
              standalone action title centered on a demon-quelling Taoist figure. Because blockbuster action games
              typically require three to five years or more of production, Game Science faces an extended revenue lull.
              Without steady recurring monetization or interim expansions, the business must absorb ongoing fixed studio
              operating expenses entirely from back-catalog sales and brand licensing partnerships.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR005
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR009
              - CR013
      - number: '7.2'
        title: Operational Scale, Production Overhead, and Talent Bottlenecks
        blocks:
          - type: paragraph
            body: >-
              Transitioning from mobile development—where Game Science previously created 100 Heroes and Art of War: Red
              Tides—to high-budget AAA development fundamentally shifted the studio's operational cost structure.
              Developing Black Myth: Wukong required seven years and an estimated five hundred million yuan in total
              production expenditures. The studio maintains a core internal staff of approximately one hundred forty
              employees in Shenzhen and Hangzhou, supported by nearly three hundred specialized outsourcing
              collaborators handling environmental modeling, character animation, and visual effects. Operating with
              Unreal Engine 5 advanced graphics systems, such as Nanite virtual geometry and Lumen real-time global
              illumination, demands rare technical talent. Managing this hybrid internal and outsourced pipeline creates
              delivery bottlenecks, execution friction, and quality control risks as the studio begins multi-year asset
              creation for Zhong Kui.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR007
              - CR011
      - number: '7.3'
        title: Platform Distribution Cut and Shareholder Concentration
        blocks:
          - type: paragraph
            body: >-
              Game Science relies heavily on third-party distribution platforms to reach its worldwide audience, selling
              Black Myth: Wukong through digital storefronts including Steam, PlayStation Network, Epic Games Store, and
              WeGame. Digital storefronts such as Steam standardly deduct a thirty percent commission from gross sales,
              imposing substantial margin drag before net proceeds reach the studio. Concurrently, external shareholder
              concentration has reached a critical threshold. In May 2026, Tencent expanded its minority equity holding
              to twenty-four percent by acquiring shares from long-time partner Hero Games, becoming Game Science's sole
              external institutional shareholder. This single-counterparty governance position creates potential
              alignment risks regarding future publishing rights, intellectual property exploitation, strategic platform
              choices, and live-service monetization preferences.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: Domestic Regulatory Oversight and Residual Risk Profile
        blocks:
          - type: paragraph
            body: >-
              Operating within mainland China subjects Game Science to strict regulatory oversight administered by the
              National Press and Publication Administration. Every commercial game release requires a formal domestic
              publishing license, known as an ISBN approval, alongside compliance with mandatory minor playtime
              anti-addiction authentication systems. While Black Myth: Wukong navigated domestic regulatory clearance
              successfully and secured massive cultural endorsement, each subsequent title, including Black Myth: Zhong
              Kui, must independently obtain regulatory approval before domestic commercial launch. Any potential
              regulatory tightening, content modification mandate, or extended approval freeze poses direct scheduling
              and revenue risks. Overall, Game Science exhibits a concentrated risk profile characterized by high
              creative execution hurdles, multi-year pipeline lulls, platform commission friction, and
              single-shareholder governance sensitivity.
            claimRefs:
              - CR003
              - CR005
              - CR009
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR005
              - CR008
              - CR009
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sequel Development Gap Threatens Commercial Momentum
            body: >-
              Shelving downloadable content in favor of starting Black Myth: Zhong Kui from scratch introduces a 3 to 5
              year revenue gap, leaving Game Science dependent on back-catalog tail sales while carrying full AAA studio
              overhead.
            calloutType: risk
            claimRefs:
              - CR001
              - CR003
              - CR004
          - type: callout
            title: Single External Shareholder Concentration
            body: >-
              With Tencent expanding its equity stake to 24% by buying out Hero Games, Game Science faces heightened
              strategic dependence on a dominant industry incumbent for distribution, technical alignment, and capital
              governance.
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Commercial Traction
        blocks:
          - type: paragraph
            body: >-
              Game Science has redefined the global commercial viability of Chinese premium gaming by delivering Black
              Myth: Wukong to overwhelming critical and financial success. Selling 10 million units in three days and
              surpassing 30 million lifetime copies within its inaugural year, the studio established that high-fidelity
              action titles steeped in classical mythology can command premier pricing worldwide. The foundation of the
              positive investment thesis rests on extraordinary capital efficiency: the studio achieved AAA production
              values on an estimated budget of approximately 500 million yuan ($70 million) with 140 internal developers
              and 300 specialized outsourcing partners, contrasting sharply with Western blockbusters that routinely
              consume over $200 million. However, the anti-thesis highlights acute revenue lumpiness inherent to
              single-player premium releases, where up to 80% of primary lifetime commercial volume is harvested in
              initial weeks, leaving multi-year revenue troughs before the next major release.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
      - number: '8.2'
        title: Financing Context, Cap Table, and Valuation Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Game Science's equity trajectory reflects a transition from early strategic sponsorship to tight
              conglomerate consolidation. In 2017, Hero Games acquired a 20% equity stake for 60 million yuan,
              establishing an early post-money valuation benchmark of 300 million yuan ($8.5 million at historical
              rates). In May 2026, Tencent executed an agreement to acquire Hero Games' stake, expanding Tencent's total
              holdings to 24% and cementing its position as Game Science's sole external institutional shareholder.
              Neither party disclosed financial consideration or implied valuation multiples, depriving outside
              investors of transparent secondary pricing. Benchmark valuations for comparable independent premium
              studios typically range between 8x and 12x normalized cash flow; applying this multiple to Game Science's
              estimated cash earnings implies an enterprise value between $1.8 billion and $2.5 billion, though lack of
              governance visibility warrants caution.
            claimRefs:
              - CV001
              - CV011
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV014
      - number: '8.3'
        title: Scenario Analysis, Unit Economics, and Downside Triggers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Game Science requires scenario-based financial modeling that accounts for hit-driven revenue
              decay and rising development expenditures. In the bull case (20% probability), Black Myth: Zhong Kui
              reaches commercial release by 2027 and achieves 20 million units sold, supplemented by robust
              multi-platform licensing and catalog longevity that sustains enterprise valuation between $3.5 billion and
              $4.5 billion. In the base case (55% probability), development cycles extend into 2028 with 12 to 15
              million sequel units sold, supporting an implied valuation of $1.8 billion to $2.5 billion. The bear case
              (25% probability) models development delays extending beyond 2029, escalating production costs per hour of
              gameplay, and potential creator fatigue, compressing valuation toward net cash reserves of $800 million to
              $1.0 billion. Downside triggers include key leadership departures or acute brand damage from unmitigated
              workplace and communications scrutiny.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV014
      - number: '8.4'
        title: Investment Recommendation and Diligence Roadmap
        blocks:
          - type: paragraph
            body: >-
              We conclude that Game Science warrants a research-more stance with a high risk rating and a fair valuation
              stance. While the studio's technical prowess and proven box office execution place it in an elite tier of
              global developers, private capital allocators face substantial structural risks. Single-title franchise
              concentration, the absence of public financial statements distinguishing gross consumer spend from net
              studio cash receipts, and Tencent's dominant position as the sole outside shareholder create high
              governance barriers. Crucial diligence milestones include tracking early gameplay reveals and production
              cadence for Black Myth: Zhong Kui, monitoring executive retention across the founding technical team, and
              verifying the economic terms and preference rights attached to Tencent's equity stake before committing
              expansion capital.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV008
              - CV009
              - CV010
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Discipline in Private Hit-Driven Studios
            body: >-
              While Game Science's commercial achievement with Black Myth: Wukong is historic, private equity valuations
              in hit-driven studios face severe compression when transition periods between releases exceed three years.
              Tencent's consolidation as the sole external shareholder underscores strategic alignment but limits
              outside price discovery.
            calloutType: insight
            claimRefs:
              - CV001
              - CV005
              - CV012
              - CV014
