      - CP006
      - CP010
      - CP014
    data:
      points:
        - label: Game Science (Black Myth)
          x: 4.5
          'y': 4
          description: Moderate $70M development budget; one-time premium sales model with multi-year release gaps.
        - label: Tencent (Honor of Kings)
          x: 3
          'y': 9.5
          description: Low-to-moderate initial cost basis; perpetual live-service microtransaction stream exceeding $1.5B annually.
        - label: NetEase (Blood Message / Live Portfolio)
          x: 5
          'y': 8
          description: Substantial live-service base branching into premium console R&D with dual monetization options.
        - label: S-Game (Phantom Blade Zero)
          x: 3.5
          'y': 3.5
          description: Emerging domestic venture-backed studio targeting premium console market with specialized action focus.
        - label: Western Blockbusters (Sony / CD Projekt)
          x: 9
          'y': 5.5
          description: High $200M-$500M+ budgets with premium pricing and long-tail catalog sales.
        - label: Live-Service Failures (Sony Concord)
          x: 8.5
          'y': 1
          description: $200M high-capital outlay resulting in total loss and immediate server shutdown due to poor player adoption.
