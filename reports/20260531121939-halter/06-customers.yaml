- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale signal
  - Revenue / strategic value
  - Gap
  rows:
  - - NZ dairy owner-operators
    - Buyer and payer appear to be farm owners/managers; users are farm operators and staff
    - Pasture allocation, labor reduction, breeding support, and herd monitoring
    - Named farms at 440, 580, 733, and 1,545 cows
    - Likely core recurring base tied to daily workflow depth
    - No public ARR per dairy farm or renewal profile
  - - U.S. beef ranch owners / managers
    - Buyer and payer appear to be ranch owners/managers; users include ranch hands and operators
    - Virtual fencing, carrying-capacity lift, winter grazing, public-land flexibility, and fence avoidance
    - Named stories at 100, 160, 300, 400, and 900 head plus large-acreage ranches
    - Strategically important for U.S. growth and satellite use cases
    - No public realized payback or contract length by ranch archetype
  - - Large remote ranches
    - Ranch leadership and operations teams
    - Satellite-enabled grazing across expansive terrain
    - 225,000-acre High Lonesome example
    - Important reference segment for infrastructure-light expansion
    - Only a small number of large-ranch references are public
  - - Pasture-intensive NZ hill-country operators
    - Farm owner-operators
    - Doubling stock units, more milk with less effort, pasture-led management
    - Waikato and hill-country stories highlighted
    - Shows Halter can sell outcome narratives beyond fence substitution
    - Public proof still skews to best-story farms
  - - Public-land / partner-mediated accounts
    - Rancher plus conservation or public-land counterparties
    - Access and grazing management where permanent fence is difficult or undesirable
    - Rio Grande and NSW advocacy examples
    - Creates channel-like expansion route and policy leverage
    - Commercial terms and repeatability are not public
  notes: The table segments the visible public proof set, not Halter’s full customer ledger.
