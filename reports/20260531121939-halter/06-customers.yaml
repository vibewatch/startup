- id: adoption-trajectory-and-named-production-proof
  title: Adoption Trajectory and Named Production Proof Are Stronger Than the Retention Story
  body: The strongest customer evidence is not an app-store score or a venture article; it is the accumulation of specific production markers. Halter’s public materials and third-party coverage now point to a U.S. footprint well beyond a handful of rancher testimonials, including 11,000 miles of virtual fencing, 250 rancher partnerships across 24 states, and early satellite deployments on very large ranch acreage. The named proof set is also concrete. On the U.S. side, the file includes public stories around carrying-capacity gains, avoided fencing spend, stocking-rate improvement, and hours saved. On the New Zealand side, the proof set includes visible dairy farms with hundreds to more than 1,500 cows and a study-backed ROI narrative. The important judgment call is that this is mostly production proof, not pilot proof. These stories read as currently operating accounts, but they still do not resolve how many of those accounts expand, how long they stay, or how representative the public
    sample is versus the whole customer base.
