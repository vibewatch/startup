  - TU004
  - TU006
- id: expansion-concentration-and-adverse-signals
  title: Expansion Loops Exist, but So Do Cost, Welfare, and Concentration Blind Spots
  body: Halter’s public customer motion looks expandable. The company does not present itself as a one-time fence substitute; it layers in education, public-land partnerships, and proof stories that point toward bigger acreage, more cattle, more use cases, and broader operational adoption after the first deployment. That is the good news. The bad news is that the same public book leaves major underwriting holes. There is still no view into revenue concentration, top-account dependence, or realized account expansion by cohort. Independent adverse coverage also keeps the customer story grounded. Multiple outside sources continue to point to high cost, battery or connectivity concerns, welfare skepticism, and organized opposition or regulatory drag. None of those signals prove weak product-market fit, but together they explain why the customer chapter should land as validated adoption plus unresolved durability and concentration risk, not as a closed-form retention story.
