- id: TU006
  title: Public proof quality and diligence-gap table
  columns:
  - Missing metric
  - Why the gap matters
  - Best public proxy
  - What the proxy does not prove
  - Exact diligence ask
  rows:
  - - Renewal / cohort retention
    - Durability is the main unresolved customer-quality question
    - Named production stories and app ratings
    - Does not prove cohorts renew or expand
    - Request NRR/GRR, cohort curves, and account-level renewal history
  - - Customer concentration
    - A few ranches or farms could drive a disproportionate share of revenue
    - Breadth proxies like 24 states or 11,000 miles
    - Does not show spend per account or top-customer exposure
    - Request top 20 accounts by spend and head deployed
  - - Procurement funnel health
    - Field products can stall between demo and live operation
    - Onboarding stories and free-year promotion
    - Does not quantify conversion or implementation burden
    - Request lead-to-live funnel metrics and time-to-value by segment
  - - Realized account economics
    - Strategic value by segment depends on realized payback, not anecdote
    - Fence-cost anecdotes and productivity stories
    - Does not give realized margin, payback, or net expansion by cohort
    - Request realized payback and ROI by archetype
  notes: This table translates the public proof set into the exact diligence asks needed to underwrite durability and concentration.
