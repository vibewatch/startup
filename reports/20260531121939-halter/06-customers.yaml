- id: durability-satisfaction-and-missing-retention-data
  title: Durability, Satisfaction, and the Limits of Public Retention Visibility
  body: 'Public durability evidence is the thinnest part of Halter’s customer chapter. There are useful proxies: iOS and Android app surfaces confirm the product is actively distributed and maintained, and the app stores show non-trivial user engagement. But those proxies are not the same as buyer retention, renewal quality, or account-level satisfaction. The official customer proof set also leans heavily on live use and on outcomes that imply ongoing value, which is directionally positive. Still, the public book stops before contract length, renewal rate, NRR, GRR, or even a basic churn figure. That matters because a hardware-plus-software field product can win impressive first deployments and still underperform later on expansion or support burden. The practical conclusion is that Halter has enough public proof to establish active customer usage and enough app signal to show a living operator surface, but not enough to underwrite durability without direct diligence materials.'
  claimRefs:
  - CU025
  - CU026
  - CU027
  - CU028
  - CU029
  - CU038
