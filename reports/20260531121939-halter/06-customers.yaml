- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Larger acreage or more head once the first deployment works
    - Unknown whether expansion is common or rare across cohorts
    - Could drive strong account growth if real, or overstate LTV if rare
    - Request cohort-level acreage/head expansion curves
  - - Management education and consultant attachment
    - Program may deepen stickiness only for larger customers
    - Could improve retention and product adoption in sophisticated ranches
    - Request uptake and retention outcomes for resource-initiative participants
  - - Public-land and conservation partnerships
    - Partner-mediated accounts may be lumpy and politically contingent
    - Could accelerate marquee logos but create policy concentration risk
    - Request pipeline and conversion by partner-led vs direct-led accounts
  - - High hardware / deployment cost
    - Can narrow the prospect pool or slow conversions
    - Expands customer concentration risk if only the best-capitalized ranches can adopt
    - Request sales funnel conversion and lost-deal reasons by segment
  - - No public top-account disclosure
    - True revenue concentration cannot be externally assessed
    - Makes customer-quality underwriting incomplete even if adoption is real
    - Request top-customer revenue share and spend distribution
  notes: The public book proves multiple expansion vectors exist, but not whether they compound into diversified high-quality revenue.
