chapter:
  number: 6
  title: Customers
  summary: 'Halter’s customer evidence shows real production adoption, not just logos: the book now includes a visible U.S. ranching motion and a deeper New Zealand dairy proof set, with named operations, acreage, herd sizes, and outcome anecdotes that are too specific to dismiss as generic marketing. The weakness is durability rather than existence—public evidence says far more about who uses Halter and why than about renewal, concentration, or revenue-per-account, so the customer case is commercially credible but still incomplete for underwriting retention quality.'
sections:
- id: visible-customer-segments-and-economics
  title: Visible Customer Segments, Buyer Logic, and What the Public Book Actually Covers
  body: 'Halter’s customer book is not broad in every direction, but it is broad enough to establish a real market footprint. The visible pattern is a two-engine customer base: New Zealand dairy farms on one side and U.S. beef ranches on the other. That matches the product split established in the prior chapter and helps explain why the customer stories emphasize different value language by segment. Dairy materials lean toward labor, pasture, breeding, and stock-unit productivity, while U.S. rancher materials emphasize avoided fence build, carrying capacity, public-land flexibility, and winter or rough-terrain management. The likely economic buyer in both cases is the owner-operator or ranch/farm decision maker because the public stories keep returning to operating ROI rather than downstream processor or consumer outcomes. What remains missing is segment-level monetization depth: the public file shows enough customer heterogeneity to underwrite real demand, but not enough to rank which segment
    carries the best retention or revenue quality.'
  claimRefs:
