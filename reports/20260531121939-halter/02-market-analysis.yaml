callouts:
- calloutType: insight
  title: Animal counts imply long runway, but not all cattle are equal TAM
  body: The most useful sizing lens is not a generic ag-software market; it is the cattle headcount in live geographies that combine pasture-based systems with enough labor, grazing, or stewardship pain to justify virtual fencing economics. That still leaves a very large runway versus Halter’s current one million collars.
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM009
  - CM010
  - CM011
  - CM036
- calloutType: risk
  title: The market is real, but economics and welfare still gate adoption
  body: 'Virtual fencing is no longer conceptual, yet Arizona economics, Farm Progress field reporting, and NZVA welfare guidance all point to the same caution: adoption depends on costs, training discipline, battery and connectivity performance, and producer confidence that the system is both humane and financially sensible.'
  claimRefs:
  - CM024
  - CM025
  - CM026
  - CM027
  - CM029
  - CM038
- calloutType: strength
  title: Halter is pointed at a workflow with multiple value hooks, not a single-feature niche
  body: The market case is stronger because Halter can sell labor savings, grazing precision, monitoring, and land-stewardship flexibility into the same cattle operation. That makes the budget owner’s decision less about buying a gadget and more about changing how a farm or ranch is run.
  claimRefs:
  - CM001
  - CM002
  - CM015
  - CM016
  - CM020
