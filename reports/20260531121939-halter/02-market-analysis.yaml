chapter:
  number: 2
  title: Market Analysis
  summary: 'Halter sells into a specific slice of the cattle economy: pasture-based dairy and beef operations that can justify software-managed virtual fencing, herd guidance, and animal/pasture monitoring. Public data across New Zealand, Australia, and the United States imply a very large headcount opportunity versus Halter’s current one million collars, but adoption still depends on labor scarcity, grazing intensity, regulation, and the economics of subscriptions, base hardware, and workflow change.'
sections:
- id: market-boundary-and-status-quo
  title: Market Boundary, Included Spend, and Status-Quo Alternatives
  body: 'The market Halter is attacking is much narrower than “all livestock tech” and much broader than a single collar SKU. The company’s product pages and 2026 funding materials position Halter as a pasture-based cattle operating system that combines virtual fencing, shifting, pasture planning, and animal monitoring. Included spend therefore covers collars, software, connectivity hardware or satellite backhaul, and the workflow layer that helps farmers allocate feed, move mobs, and monitor health or reproduction. Excluded spend includes permanent perimeter fences, corrals, sheds, milking robots, generic EID tags, and indoor feedlot software. The status quo is still powerful: ranchers can keep using physical fencing, temporary wire, dogs, bikes, quad bikes, and manual labor. WireMesh, Farm Progress, and UC Davis sources all reinforce that virtual fencing is a management overlay rather than a total wire replacement. That is important for sizing. Halter is not trying to displace every cattle-tech
    dollar, only the subset where remote grazing control, more frequent moves, environmental exclusion zones, and labor savings create a compelling return.'
