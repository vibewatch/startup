    - Hardware, subscriptions, and support can still make payback marginal for family-scale operators.
    - Model payback by herd size and terrain before underwriting fast penetration.
  - - Connectivity, battery, and training demands
    - Negative for adoption
    - Current
    - Operational friction remains material, especially in remote terrain and winter conditions.
    - Request performance data on uptime, training days, and battery-change intervals.
