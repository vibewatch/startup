- id: sizing-lenses-across-live-geographies
  title: Sizing Lenses Across Live Geographies
  body: A credible market view for Halter comes from cattle inventories rather than a generic software TAM deck. New Zealand official statistics put dairy cattle at 5.75 million and beef cattle at 3.833 million as of June 2025, while LIC describes a dairy sector with just under 5 million cows across about 10,000 herds. In the United States, USDA NASS reported 86.2 million cattle and calves on farms as of January 2026, including 27.6 million beef cows and 9.57 million milk cows. In Australia, MLA’s March 2026 industry projections keep the national herd just above 31 million head. Those datasets support multiple market lenses. A narrow operational lens focused on New Zealand cattle, the Australian herd, and U.S. beef cows already yields a core opportunity above 68 million head. A broader ceiling that uses all U.S. cattle and calves pushes the current-geography animal base above 126 million head. Against that, Halter’s one million installed collars imply substantial runway, even before UK,
    Ireland, Canada, or South America are counted.
