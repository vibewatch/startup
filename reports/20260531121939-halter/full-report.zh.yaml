      - number: '1.3'
        title: 融资历史、投资人基础与规模信号
        blocks:
          - type: paragraph
            body: >-
              Halter 近年的资本历史显示，公司正从强势区域创业公司走向全球关注的成长期平台。2025 年 6 月 D 轮把公司推到约 $1B 的美元估值，2026 年 3 月 E 轮又把估值抬到
              $2B。这几轮投资人的重叠很重要：Bond、Bessemer、DCVC、Blackbird、NewView、Promus、Icehouse 和 Ubiquity 仍然可见，Founders Fund
              也在早期投资后回归领投 2026 年轮次。公开来源还支持融资背后已有实质运营规模：超过 2,000 名客户、一百万条项圈、400 多名员工，以及 220
              多人的招聘计划。不过，免费公开记录没有完全披露精确累计融资额，因为早期轮次多见于公司摘要和数据库式报道，而不是一条清晰的官方时间线。这可以处理，但并不理想。因此，资本故事读起来可信、强劲且赞助方质量高，但围绕历史实际募资额、轮次间稀释和当前投资人治理权利，仍留下尽调工作。
