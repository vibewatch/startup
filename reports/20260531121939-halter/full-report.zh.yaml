  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品系统、用户工作流与公开表面真正证明了什么
        blocks:
          - type: paragraph
            body: >-
              核心产品问题是，Halter 卖的是项圈、牧场管理应用，还是完整操作系统。公开材料更支持第三种解读，而不是前两种。Halter
              自身的技术表面，把项圈硬件、连接、移动端和网页端工作流，以及机器智能打包成一个系统，覆盖奶牛和肉牛场景中的日常调群、牧草分配、繁育支持和远程监测。奶牛产品围绕高强度、高频次农场管理展开，包括近实时调群和发情 /
              健康更新；肉牛产品则围绕崎岖偏远土地、更低基础设施负担和卫星覆盖展开。这个区别很重要，因为它说明 Halter 搭建的是针对工作流的产品逻辑，而不是把同一条通用项圈套上不同营销话术再卖。围绕 2026
              年卫星铺开的独立报道，也强化了一个判断：肉牛不是奶牛产品的复制版，而是一套部署架构不同、运营约束和买方价值驱动不同的独立方案。
