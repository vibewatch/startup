      - number: '3.3'
        title: 切换成本、现状替代方案与分销力量
        blocks:
          - type: paragraph
            body: >-
              对任何虚拟围栏供应商来说，最大的竞争对手往往仍是少做一点。实体围栏、便携铁丝围栏和人工调群，在劳动力可得且经营者想避免高额前期项圈和基础设施成本的地方，仍是可信选择。这一点很重要，因为买方不必只在
              Halter、Gallagher、Vence 和 Nofence
              之间选择；他们也可以推迟整个品类。当买方真正参与时，切换成本并不低。训练动物、培训员工、学习每家供应商的地图逻辑，以及围绕不可互操作组件运行，都会制造摩擦。分销力量在各家之间也不同。Gallagher 和
              Merck 可以把虚拟围栏挂到更大的地面销售和信任界面上；Nofence 和 Halter
              则在更简单的部署故事比既有渠道宽度更能打动买方时获胜。相邻监测供应商承诺健康或产犊结果，却不要求买方投入完整的软件定义放牧栈，从而给预算分配增加压力。
