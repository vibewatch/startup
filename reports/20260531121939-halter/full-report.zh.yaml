    rows:
      - - 乐观
        - ARR 明显跑赢公开粗略估计；卫星扩大美国可触达市场；新市场转化良好；留存和毛利率证明高质量溢价
        - 结果区间 US$2.6B-US$3.4B；若以 US$2.0B 入场，稀释前大约对应 1.3x-1.7x 总价值提升
        - 执行落空、事件风险或毛利率失望会击穿溢价情景
        - 有可能，但需要多项目前未公开的私人证据支撑
      - - 基准
        - 增长仍强，但经济性更像高端工业 / 垂直软件混合体，而不是纯 SaaS 异常值
        - 区间 US$1.6B-US$2.2B；除非私有指标明显好于公开代理指标，否则相对当前标记上行有限
        - 入场纪律很关键，因为平庸经济性可能抹掉大部分上行
        - 当前公开证据最能支持
      - - 悲观
        - 价格敏感、品类摩擦或服务强度暴露出业务偏硬件，经常性质量更低、扩张更弱
