      - number: '3.2'
        title: 能力宽度、基础设施选择与公开定价信号
        blocks:
          - type: paragraph
            body: >-
              能力和基础设施设计，才是真正拉开直接竞争对手差距的地方。Halter
              最强的产品宽度故事，仍是它在奶牛和肉牛两端的拆分定位：奶牛方案覆盖牧场、调群和动物健康工作流，肉牛方案现在则重押偏远地形的直连卫星覆盖。Gallagher 和 Vence 要求买方围绕蜂窝、LoRa
              或基站接受更明确的基础设施选择；Nofence
              则推动无基站模式，配合订阅经济性和五年质保。独立来源强化了一个判断：这些系统不是可互换模块。买方不能假设项圈、软件和训练协议可以在供应商之间干净替换，这让架构成为持久切换成本的一部分。公开定价信号也不均衡。Halter
              当前的公开价格代理仍主要来自第三方评论；eShepherd 有一个学术比较点；Nofence 披露订阅结构比披露美元标价更清楚；早期进入者大多宣传试点或折扣，而不是稳定商业价格表。
