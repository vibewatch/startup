  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入口径与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Halter 正在进攻的市场，比“所有畜牧科技”窄得多，又比单一项圈 SKU 宽得多。公司的产品页面和 2026 年融资材料，把 Halter
              定位为放牧型牛只运营系统，组合了虚拟围栏、调群、牧场规划和动物监测。因此，纳入支出包括项圈、软件、连接硬件或卫星回传，以及帮助农场主分配饲草、移动牛群、监测健康或繁殖的工作流层。不纳入的支出包括永久边界围栏、围栏圈、棚舍、挤奶机器人、通用
              EID 耳标和室内育肥场软件。现状替代方案仍很强：牧场主可以继续用实体围栏、临时铁丝、牧羊犬、摩托车、四轮摩托和人工。WireMesh、Farm Progress 和 UC Davis
              来源都强化同一点：虚拟围栏是管理叠加层，而不是彻底替代铁丝围栏。这个判断对测算规模很重要。Halter
              不是要替代每一美元牛业科技支出，而是只打远程放牧控制、更频繁转场、环境隔离区和节省人工能产生足够回报的那部分。
