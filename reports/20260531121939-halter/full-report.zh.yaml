  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 口径评分：从证据、经济性、风险和估值匹配度评估 Halter。
    data:
      items:
        - label: 市场 / 品类证据
          value: 8/10
          note: 真实装机基础和地域证据，不只是产品演示
        - label: 客户成果证据
          value: 7/10
          note: ROI 信号积极，但样本仍少且经过筛选
        - label: 竞争护城河
          value: 6/10
          note: 早期领先明显，但 Merck 和 Gallagher 仍有可信替代方案
        - label: 单位经济性可见度
          value: 3/10
          note: ARR、利润率、流失率和 CAC 基本仍未公开
        - label: 风险水平
          value: 4/10
          note: 执行、定价、动物福利和合作伙伴依赖让下行风险仍然很现实
        - label: 估值公允性
          value: 4/10
          note: 相对公开可比公司边界，当前估值标记偏贵
        - label: 证据质量
          value: 5/10
          note: 公司公开叙事强，财务披露弱
        - label: 退出就绪度
          value: 4/10
          note: 进入 IPO 式研判前，大概率还需要更多私募轮融资或战略成熟
    approximationNotes: 评分是作者仅基于公开证据按 1-10 分做出的判断，分数越高越好。整体读法：资产有潜力，入场价偏高。
    claimRefs:
      - CV005
      - CV018
      - CV032
      - CV038
      - CV042
      - CV044
      - CV045
      - CV046
