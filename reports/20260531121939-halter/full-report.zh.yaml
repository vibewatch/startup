  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公司基本面确实成立，但当前估值已经计入大量成功预期
        blocks:
          - type: paragraph
            body: >-
              Halter
              的估值章节从一个不舒服但有用的拆分开始。投资逻辑并非凭空想象：公司已有大额融资、可见的装机基数验证、优质投资人阵容、足够强的产品野心，以及足以说明它不只是新奇硬件生意的客户结果证据。反向逻辑同样真实：公开材料在高估值通常决胜的位置仍然很薄，包括经审计
              ARR、毛利率、留存、股权结构条款，以及部署强度归一化之后的队列经济性。因此，当前估值更容易让人欣赏，却不容易让人按机构标准核算通过。公开来源足以解释为什么公司相对普通农机业务值得一个溢价叙事，但还不足以支持把纯
              SaaS 式倍数照单全收。2026 轮融资因此像是一项高质量资产，只是价格已经假设了强执行会持续。
