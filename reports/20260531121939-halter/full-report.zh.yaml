      - number: '8.4'
        title: 建议：保持接触，但要求价格纪律和私有尽调证据
        blocks:
          - type: paragraph
            body: >-
              最终估值立场不是否定公司，而是拒绝把公司质量和入场质量的确定性混为一谈。Halter
              已经有足够公开证据，值得认真尽调：真实客户、真实融资、竞争上确实有分量，以及足够支撑持续关注的运营野心。但公开材料仍没有展示股权结构表、优先股堆叠、经审计 ARR、毛利率或分细分的回本数据，投资人还不能放心地把
              $2B 估值视为已经核算通过。决策问题因此从「这家公司有意思吗？」变成「什么条款下才有吸引力？」合理姿态是观察，或在严格价格纪律下接触，而不是按完整公开估值领投或追价。退出路径上，下一轮私募融资或战略方兴趣比近期
              IPO 更可信。最快改变判断的不是另一篇叙事文章，而是硬的私有证据：公司增长具备软件式质量，而不只是软件式叙事，尤其是在留存、毛利率和稀释方面。
