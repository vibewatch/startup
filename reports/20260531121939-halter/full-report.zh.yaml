      - number: '4.3'
        title: 成本结构、资本强度与 E 轮后的资本充足性
        blocks:
          - type: paragraph
            body: >-
              成本结构是 Halter 最明显偏离标准垂直 SaaS
              故事的地方。面向肉牛的工程、项圈、连接、客户铺开和持续产品开发，都意味着毛利率和现金转化会受硬件与服务层塑形，而不只是软件使用塑形。卫星扩张可能通过移除塔台要求改善客户经济性，但不会神奇地把公司变成轻资产；它只是把运营模式转向更广覆盖，同时继续承受产品和伙伴复杂度。可比公开文件即便不直接披露
              Halter 数字，也有助于建立框架。Merck 的 SEC 文件显示，一家规模化动物健康平台仍有可见销售成本、SG&A 和 R&D
              层，这比纯云基准更有方向性可比性。最新一轮融资明显改善了资本充足性，也给管理层留下地理扩张和大举招聘的空间。但由于现金余额、烧钱速度、现金跑道、债务和毛利率仍未披露，外部投资人只能得出一个结论：Halter
              资金更充足了；至于按当前扩张速度能撑多久，仍无法精确判断。
