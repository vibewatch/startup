      - number: '2.3'
        title: 买方、用户、付费方与采用路径
        blocks:
          - type: paragraph
            body: >-
              各地区的购买中心相当一致。经济买方通常是农场主、牧场主或运营主体；日常用户是农场经理或畜群团队；技术验证者往往负责放牧计划、动物处理和合规。奶牛和肉牛工作流差异足够大，不能忽略。Halter
              的奶牛页面强调牧草分配、发情与健康监测，以及降低日常工作量；肉牛页面则强调远程覆盖、隔离区，以及更高效地利用粗放或陡峭土地。采用路径也比软件更运营化：生产者先测试经济性和覆盖能力，再在封闭环境训练动物，在真实牧场证明可靠性，最后才扩展到多牧区或整座牧场。供应商格局也印证这一点。Gallagher、Vence、Nofence
              和 Halter 都要求买方围绕基站、订阅捆绑或蜂窝依赖做架构选择；Datamars、Cowlar 和 Moocall 等相邻供应商，则仍更专注于监测，而不是完全软件定义的放牧控制。
