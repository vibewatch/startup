        - 稀释、优先权包袱或公共土地 / 动物福利受挫，可能加速这一情景
        - 可信，因为公开记录恰好在通常支撑高溢价轮次的指标上仍然很薄
    notes: 区间是作者基于公开可比公司、价格代理指标和当前私有标记设定的情景带；不是 DCF 输出。
