      - number: '8.3'
        title: 乐观、基准、悲观情景区间很宽，因为缺失数据正落在估值精度最该来自的位置
        blocks:
          - type: paragraph
            body: >-
              这里情景区间宽，不是分析弱，而是经济性证据缺失后的诚实结果。乐观情景能成立，是因为 Halter
              确实已有规模、国际扩张野心和产品宽度的证据，也因为当增长仍然陡峭时，私募市场有时会给品类领导者远高于上市工业可比公司的估值。悲观情景也能成立，因为公开记录不断提醒我们：这是一套硬件加服务的系统，卖给成本敏感的运营环境，同时还带着动物福利、执行和价格敏感性问题。基准情景因此落在当前估值附近，但并不会自动高于当前估值。关键结论是：公开证据足以让
              Halter 留在可投资范围内，但若没有能显著提高留存、毛利率和融资栈质量信心的私有数据，还不足以从当前入场点核算出可观上行。
            claimRefs:
