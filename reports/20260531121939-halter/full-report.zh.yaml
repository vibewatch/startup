      - number: '4.4'
        title: 财务判断、主要风险与承保缺失证据
        blocks:
          - type: paragraph
            body: >-
              对 Halter 做可支撑的公开市场式财务判断，必须把业务质量和披露质量拆开。业务质量看起来有希望：公司卖进日常农场工作流，刚拿到增长资本，也至少有一些第三方定价信号和 ROI
              证明。披露质量弱得多。收入结构不公开，毛利率不公开，现金和烧钱速度不公开，留存或回本指标也不公开。这意味着投资人可以承保需求和战略动能，但还不能承保完整资本效率。主要反向信号并不是业务缺乏牵引，而是虚拟围栏仍有可见按头成本和动物福利服务负担；如果客户支持需求居高不下，两者都可能放慢采用或压缩经济性。实际含义很简单：Halter
              可能是一门优秀生意，但投资人要负责任地声称相信其利润率路径或现金跑道耐久性，仍需要管理层访问和非公开财务材料。
