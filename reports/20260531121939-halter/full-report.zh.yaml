  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和动物福利正当性在 2026 年改善，但风险并未闭合
        blocks:
          - type: paragraph
            body: >-
              Halter 的公开记录在法律和政策动能上比一年前强得多，但关键判断并不是监管消失了，而是争论从抽象可行性转向有条件接受。Dairy Australia 的 2026
              年更新显示，虚拟围栏现在已在澳大利亚全部六个奶业州合法；美国公共土地机构也公开支持包含虚拟围栏的创新试点。这是真进展。同时，UK Animal Welfare Committee 意见和 New Zealand
              Veterinary Association 立场声明，仍让动物福利问题保持开放，足以要求公司谨慎使用、可辩护的训练协议，以及更长期的独立证据。做承保时，这意味着 Halter
              不再像被标题层面的合法性卡住，但仍暴露于政策反转、地方反对，以及未来任何会削弱动物福利正当性的事故流。
