      - number: '2.2'
        title: 现有地理市场的多重测算视角
        blocks:
          - type: paragraph
            body: >-
              对 Halter 来说，可信的市场视角来自牛只存栏量，而不是通用软件 TAM 幻灯片。New Zealand 官方统计显示，截至 2025 年 6 月，奶牛为 5.75 million 头、肉牛为 3.833
              million 头；LIC 则描述了一个约 10,000 个牛群、略低于 5 million 头奶牛的奶业市场。在 United States，USDA NASS 报告称，截至 2026 年 1 月，农场中有
              86.2 million 头牛和犊牛，其中包括 27.6 million 头肉母牛和 9.57 million 头奶牛。在 Australia，MLA 的 2026 年 3 月行业预测把全国牛群维持在略高于 31
              million 头。这些数据支持多重市场视角。窄口径运营视角只看 New Zealand 牛只、Australia 牛群和美国肉母牛，核心机会已经超过 68 million
              头。更宽的上限若纳入所有美国牛和犊牛，当前地理市场的动物基础超过 126 million 头。相较之下，Halter 的一百万条已安装项圈意味着仍有充足跑道，且尚未计入 UK、Ireland、Canada 或
              South America。
