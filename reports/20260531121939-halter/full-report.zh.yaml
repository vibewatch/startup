      - number: '8.2'
        title: 公开可比公司给足额追价设置了硬上限，不能随意越过
        blocks:
          - type: paragraph
            body: >-
              最干净的公开估值校验不是完美可比公司，而是一个有边界的可比区间。Deere 和 AGCO 展示了公开市场愿意为硬件占比高的农业敞口支付什么价格。Trimble
              展示了工作流更重的工业技术如何拿到更好倍数。Merck 提供了大规模动物健康参照，但仍不是完美类比，因为 Vence 只是一个庞大企业里的一小块。即便有这些保留，结果方向上仍然醒目：选取的公开公司大约在 0.7x
              到 4.6x 收入之间，而 Halter 自己的公开 ARR 估计值意味着当前估值约为 20x 到 29x ARR。这个差距不能证明本轮定价错误，但证明投资人买的是一个非常具体的未来——Halter
              复利成长为定义品类的畜牧运营系统，而不是最后落成一个资本密集型小众工具：采用不错，利润率中等。
