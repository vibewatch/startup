            body: >-
              Halter 的客户簿并非向所有方向都很宽，但足以建立真实市场足迹。可见模式是一套双引擎客户基础：一端是 New Zealand
              奶牛场，另一端是美国肉牛牧场。这与上一章建立的产品拆分相匹配，也解释了为什么客户故事会按分群强调不同价值语言。奶牛材料偏向劳动力、牧场、繁育和存栏单位生产力；美国牧场主材料则强调避免建围栏、承载能力、公共土地灵活性，以及冬季或崎岖地形管理。两类场景的经济买方很可能都是业主经营者或牧场
              / 农场决策者，因为公开故事反复回到运营 ROI，而不是下游加工商或消费者结果。缺失的是分群级变现深度：公开材料足以显示客户异质性和真实需求，但不足以排序哪个分群拥有最佳留存或收入质量。
