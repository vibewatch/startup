  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、变现方式与公开定价真正说明了什么
        blocks:
          - type: paragraph
            body: >-
              Halter 的公开材料指向的是混合模式，而不是单一干净的 SaaS
              费用。产品按系统销售：项圈、连接、虚拟围栏、牧场和牛群工作流，以及越来越多面向肉牛或顾问的工具，把使用深度推到简单围栏之外。在变现上，独立报道比公司自身更明确。AgFunder
              描述的是按牛逐月计费的订阅业务，再叠加一次性塔台基础设施；iStart 和 CMK 则提供了公开价格代理，大致集中在按动物逐月收费。这给出了可用的方向，尽管官网仍没有公布稳定费率表。更合适的读法是，Halter
              通过动物级经常性使用来变现，同时也背负会随市场、牛群规模和连接路径变化的硬件与部署经济性。采用一旦粘住，这在财务上很有吸引力；但仅凭公开定价证据，不能把公司建模成低摩擦的纯软件业务。
