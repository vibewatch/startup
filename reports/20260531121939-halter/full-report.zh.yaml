companyProfile:
  summary: >-
    Halter 是一家源自 New Zealand 的私营牛业科技公司，围绕太阳能 GPS 项圈、连接能力和软件，搭建畜牧运营系统，让奶牛场主和肉牛牧场主能远程围栏、调群和监测牛群。公开证据支持它在 New
    Zealand、Australia 和 United States 已有实质运营牵引：服务超过 2,000 名农场主和牧场主，售出一百万条项圈，并在 2026
    借助直连卫星连接，把远程肉牛场景继续铺开。同一份公开材料也显示，相比当前估值，治理可见度、经审计经营经济性和长期独立动物福利证据仍不完整。
