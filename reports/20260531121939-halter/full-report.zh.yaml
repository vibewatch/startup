      - number: '1.2'
        title: 创始人、管理梯队与治理可见度
        blocks:
          - type: paragraph
            body: >-
              创始人延续性仍是 Halter 故事的重要部分。Craig Piggott 仍是公开可见的领导者，外部投资人与媒体来源也继续围绕他的奶牛场成长经历、Rocket Lab
              背景，以及以产品驱动数字化牛群管理的野心来讲述公司。也有足够证据把 Max Olson 视为真正的联合创始人和首任 CTO，尽管他已经不是当前运营高管。Halter
              的招聘页面显示，公司已经在创始人层之下搭出一定管理厚度，重点展示了产品工程、市场、战略和运营等职能的内部晋升负责人。不过，相对于估值和增长速度，公开治理可见度仍偏弱。已审阅来源没有披露常设董事会名单、委员会结构、当前持股比例或投资人控制条款。做尽调时，这意味着公司看起来仍由创始人带队，管理纵深在改善，但治理还不够透明；外部投资人仅凭公开材料，还无法画出正式制衡、权利安排或接班韧性。
