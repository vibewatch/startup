      - number: '5.3'
        title: 信任、动物福利与监管控制真实存在，但仍部分由 Halter 自己书写
        blocks:
          - type: paragraph
            body: >-
              与许多早期农业科技公司相比，Halter 已经发布了更多治理和动物福利材料。公司维护结构化动物福利章程，公布 Veterinary Advisory
              Board，阐述方向性提示训练逻辑，并解释其如何处理各市场的立法合规。这些控制有用，尤其是因为虚拟围栏采用仍取决于动物福利正当性，而不只是 ROI。独立来源也支持 Australia 监管推进，以及 2026
              年合法使用扩展到奶牛场主。但信任图景还没有完全闭合。批评性评论仍然存在，包括动物福利怀疑，以及 RSPCA 在 UK 采取限制性立场等例子。Halter
              自身动物健康页面引用了非环境性跛行减少等轶事收益，但长期独立证据基础仍薄于公司的产品成熟度主张。实际看，信任 /
              控制栈已经足够可信，可以支持继续承保商业进展；但还不足以消除围绕动物福利结果、安全保障和现场可靠性透明度的尽调要求。
