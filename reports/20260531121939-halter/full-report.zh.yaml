chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、产品系统与地理覆盖
        blocks:
          - type: paragraph
            body: >-
              以私营农业科技公司标准看，Halter 现在的定位异常清晰：官方 2026 年材料称它是奶牛与肉牛农场的操作系统，底层是太阳能、GPS
              项圈、连接层和移动应用，农场主可以远程围栏、调群和监测牛群。这个定位很关键。Halter 卖的不是狭窄的单点传感器，而是试图拿下牧草分配、动物引导、健康观察和用工协调的日常运营闭环。公司 2026 年 3 月 E
              轮材料和 2026 年 4 月卫星发布，都支撑一个判断：Halter 已经越过 New Zealand 试点阶段，成为真正多市场平台。公开来源一致显示，Halter 覆盖 New
              Zealand、Australia 和 United States；总部在 Auckland，Australia 业务以 Melbourne 为基地，美国业务在 Colorado
              扎根。规模口径已经大到足以支撑本报告后续判断：Halter 称其服务超过 2,000 名农场主和牧场主，售出一百万条项圈，并且现在能通过直连卫星连接，把虚拟围栏延伸到更偏远的肉牛地形。
