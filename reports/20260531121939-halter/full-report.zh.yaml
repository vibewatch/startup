      - number: '1.4'
        title: 里程碑、认可、动物福利证据与开放风险
        blocks:
          - type: paragraph
            body: >-
              从 2025 到 2026 的里程碑足以同时证明产品市场匹配和外部审视升温。Halter 先后完成 D 轮和规模更大的 E 轮，同时拿出 Bureau of Land Management 合作、TIME
              Best Inventions 认可、New Zealand 奶牛场独立公开的 ROI
              研究，以及面向肉牛经营的直连卫星发布等运营标记。这些是真实证明点，不只是创始人口号。同一组来源也说明，尽调不能停在增长数字标题。Halter 自身的动物福利材料很详细，也引用独立的 Tasmanian 研究，但
              New Zealand Veterinary Association 仍称长期证据有限，强有力的保障、培训和监管监督仍必不可少。Dairy Australia
              同样把合法化表述为近期且有条件，而不是永久尘埃落定。客户经济性看起来有希望，但并不轻：第三方农场财务评论仍把高级 Halter 定价放在约每头牛每月
              NZ$9.90，还要叠加额外基础设施和工作流改变要求。结论是，公司动能异常强，但治理披露、成本负担和动物福利监管暴露面仍需要主动承保，不能被动接受。
