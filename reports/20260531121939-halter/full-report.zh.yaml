      - number: '4.2'
        title: 牵引、收入质量信号与公开来源允许的单位经济代理
        blocks:
          - type: paragraph
            body: >-
              最强的公开财务证据不是 P&L，而是牵引标记和客户结果证明的组合。Halter 的 E 轮公告给出最佳规模锚点：一百万条项圈售出、超过 2,000 名客户、400
              多名员工。这些数字只能支持粗略运营代理，但粗略代理也有用：披露的平均每客户项圈数足够大，意味着是真正的牛群级部署，而不是纯试点活动；客户数相对员工数也说明，产品周围仍需要相当多人力。收入质量更多由运营结果支撑，而不是会计披露。十家农场研究和顾问材料显示，利润、牧场、牛奶和劳动力都有改善；产品一旦落地，就像任务关键系统。缺失的是投资人通常用来把价值证明转成单位经济性的那组数据——队列留存、获客成本（CAC）、回本周期和净收入留存。公开证据因此只能方向性支持粘性，还不能给出数值证明。
