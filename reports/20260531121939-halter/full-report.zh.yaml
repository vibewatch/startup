            body: >-
              公开耐久性证据，是 Halter 客户章节中最薄的一部分。可用代理存在：iOS 和 Android
              应用表面确认产品仍在活跃分发和维护，应用商店也显示有非微不足道的用户互动。但这些代理不等同于买方留存、续约质量或账户级满意度。官方客户证明集也高度依赖现有使用，以及暗示持续价值的结果，这在方向上是正面的。问题是，公开客户簿止步于合同期限、续约率、NRR、GRR，甚至连基本流失数字都没有。这很重要，因为硬件加软件的现场产品可以赢下亮眼的首批部署，却在后续扩张或支持负担上表现不佳。实际结论是，Halter
              有足够公开证据证明活跃客户使用，也有足够应用信号证明运营界面仍然鲜活；但没有直接尽调材料，就不足以承保耐久性。
