            body: >-
              运营风险故事已经不再是简单的技术就绪问题。多个来源如今支持虚拟围栏能在真实牧场环境中运行，尤其是在动物经过训练之后。更难的承保问题，是成本调整后的可重复性。North Dakota State
              University 的定价框架、Farm Progress 的成本怀疑，以及 New Zealand
              需要折扣，都指向一个仍要求客户吞下可观运营和融资负担的品类。卫星连接减少了一个障碍，但它把塔台依赖换成了新的外部基础设施依赖，并没有抹掉现场维护或可靠性风险。Colorado State
              的真实经验——项圈脱落、受潮问题和电池失望——很重要，因为它显示采用风险现在落在部署质量的混乱中段，而不只是演示能否打动人。公司可能领先，但卖的仍是现场系统，不是无摩擦软件。
