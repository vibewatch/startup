      - number: '7.4'
        title: 剩余风险只有在公司持续把政策、产品和融资动能转化为更低风险的证明时，才具备可投资性
        blocks:
          - type: paragraph
            body: >-
              重要的组合结论是，只有几件事同时继续走对，Halter
              的风险栈才算可控。公司确实有势能：资本更多、合法性范围更广、连接能力更好，生产者采用也看得见。但公开记录在最关乎下行保护的问题前仍然断开：真实事故率、公有土地依赖的经济性、合作伙伴集中度，以及 200
              多人的招聘计划能否撑住客户交付质量。由此形成的风险画像是：缓释手段存在，但成熟度还不够，不足以把剩余敞口降到可以忽略。投资委员会因此不能用二元框架，而要用条件框架。如果卫星铺开确实降低服务摩擦，降价不意味着单位经济性走弱，动物福利或监管反对也保持可控，风险调整后的投资案例就会改善；如果其中任何一个变量反转，估值支撑会很快变弱。换句话说，Halter
              已经跨过一个门槛：执行质量现在比叙事质量更重要。也正是在这里，今天要让机构投资核算信得过价格，尽调纪律必须先收紧。
