  customerFocus: New Zealand dairy farmers and U.S. beef ranchers, with broader pasture-based cattle operations across New Zealand, Australia, and the United States.
  businessModel: Subscription-led hardware-and-software system sold around animal-based pricing, with infrastructure and onboarding embedded in deployment.
