companyProfile:
  summary: Halter is a private New Zealand-founded cattle-tech company building a livestock operating system around solar-powered GPS collars, connectivity, and software that lets dairy farmers and beef ranchers fence, shift, and monitor cattle remotely. Public evidence supports meaningful operating traction across New Zealand, Australia, and the United States, with more than 2,000 farmers and ranchers, one million collars sold, and a broadened 2026 push into remote beef use cases via direct-to-satellite connectivity. The same public file also shows that governance visibility, audited economics, and long-duration independent welfare evidence remain incomplete relative to the current valuation.
