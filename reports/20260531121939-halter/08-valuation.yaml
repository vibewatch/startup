- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What the public file says
  - What would change the view
  rows:
  - - 'Thesis: category leader with real proof'
    - Installed base, large round, customer usage, and product breadth make Halter more than a concept company
    - Audited retention and margin data would turn this from plausible to underwritten
  - - 'Thesis: premium multiple can be earned'
    - Investors and media increasingly frame Halter as infrastructure/software for livestock operations
    - Proof that ARR quality and gross margin are nearer software-like than field-service-like
  - - 'Anti-thesis: valuation is ahead of disclosure'
    - Public ARR and price proxies are rough, while cap-table and preference terms remain hidden
    - Full financial package and liquidation waterfall showing the current mark is not equity-hostile
  - - 'Anti-thesis: hardware-plus-service economics cap upside'
    - Price cuts, field costs, and category friction suggest lower-quality recurring economics than pure SaaS
    - Sustained cohort evidence showing pricing power, low churn, and manageable support burden
  notes: Rows intentionally separate company quality from entry-price quality; both can be true at once.
