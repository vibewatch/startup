  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-arr-and-margin
    missingEvidence: Audited ARR, GAAP revenue, recurring versus non-recurring mix, gross margin, churn, and cohort retention for the 2026 operating year.
    whyItMatters: Public valuation comfort breaks at the exact point where premium multiples require proof of recurring quality and margin structure rather than only adoption proof.
    diligencePath: Request audited 2025 and year-to-date 2026 financial statements plus a management bridge from disclosed collar count and pricing to reported revenue and gross profit.
    relatedQuestionRefs:
    - QV007
    - QV023
    - QV027
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-preferences
    missingEvidence: Current cap table, liquidation preferences, participation terms, employee-option overhang, and any ratchets or investor protections attached to recent rounds.
    whyItMatters: A headline valuation can still produce weak common-equity outcomes if senior preferences or dilution stack absorb value ahead of a new investor or employee pool.
    diligencePath: Request the latest capitalization table with option pool, preferred terms summary, liquidation waterfall examples, and any side letters from Series D and Series E.
    relatedQuestionRefs:
    - QV026
    - QV027
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: cohort-economics
    missingEvidence: CAC, payback, deployment cost, support cost, NRR, GRR, and expansion rates split by NZ dairy, U.S. beef, and newer geographies.
    whyItMatters: Without cohort economics, the current mark depends on narrative extrapolation rather than validated evidence that the business scales efficiently across segments.
    diligencePath: Request segment-level cohort dashboards with payback, churn, expansion, and support burden over at least eight quarters.
    relatedQuestionRefs:
    - QV020
    - QV021
    - QV023
    - QV027
    relatedTableRefs:
    - TV003
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable-set-scope
    missingEvidence: A more complete private-market and public-comp set that includes additional vertical SaaS, animal-health tech, and precision-livestock references with cleaner business-model similarity.
    whyItMatters: The current public comp set is intentionally imperfect and mostly gives upper and lower bounds rather than a clean single-point fair value.
    diligencePath: Add private-company transaction comps, strategic M&A precedents, and segment-level public comps once private databases or banker books are available.
    relatedQuestionRefs:
    - QV009
    - QV018
    relatedTableRefs:
    - TV004
