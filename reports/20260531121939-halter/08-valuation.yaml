- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Audited ARR or gross margin lands well below premium expectations
    - ARR below public rough range or gross margin structurally far below software-style expectations
    - Undermines the argument that the current mark is buying high-quality recurring economics
    - Do not pay or support the full public mark
  - - Cap-table terms are investor-unfriendly
    - Liquidation preferences, participation, or dilution stack materially limit common-equity outcomes
    - Headline valuation stops being the right frame for return analysis
    - Re-price or require structural protections
  - - Price sensitivity worsens after current discounting
    - Further major price resets or weak conversion despite discounting
    - Suggests adoption is cost-constrained and premium multiple is overstated
    - Shift toward bear-case underwriting
  - - Operational / welfare setbacks hit expansion quality
    - Incident clusters, public-land friction, or service strain from the hiring wave
    - Converts growth narrative into de-rating risk
    - Pause or tighten exposure until durability is proven
  notes: These are IC-oriented kill triggers, not management KPIs; they focus on what most quickly breaks valuation support.
  claimRefs:
  - CV013
  - CV038
  - CV039
  - CV044
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited ARR / revenue quality
    - Audited ARR, revenue mix, gross margin, churn, and retention by cohort
    - This is the fastest way to validate or reject the premium-multiple case
    - Finance team / data room request
  - - Cap table and liquidation stack
    - Preference terms, dilution, option pool, and waterfall examples
    - Returns can disappoint even when the headline mark looks stable
    - Company counsel and CFO
  - - Segment economics
    - CAC, payback, support cost, expansion, and burn split by NZ dairy vs U.S. beef vs new geographies
    - Shows whether scale is compounding or becoming more expensive
    - Revenue operations and FP&A
  - - Exit readiness
    - Board maturity, audit readiness, policy history, and segment-level disclosure package
    - Clarifies whether the next logical step is IPO, strategic sale, or another private round
    - Leadership team and bankers
  notes: These asks are intentionally limited to the few missing items that most change valuation comfort.
