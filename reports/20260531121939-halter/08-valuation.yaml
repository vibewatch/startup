  - CV041
- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - AGCO
    - US$8.13B market cap / US$11.662B TTM revenue
    - ~0.7x market cap / revenue
    - Useful lower-bound hardware-heavy agricultural comp
    - Too OEM-like and less software-recurring than Halter
  - - Deere
    - US$146.44B market cap / US$44.433B TTM revenue
    - ~3.3x market cap / revenue
    - Shows premium industrial/ag exposure can trade well above pure machinery laggards
    - Still a far broader industrial platform than Halter
  - - Trimble
    - US$13.14B market cap / US$3.601B TTM revenue
    - ~3.65x market cap / revenue
    - Best workflow-heavy industrial-tech comp in the set
    - Not livestock-native and still public-market mature
  - - Merck
    - US$293.21B market cap / US$64.235B TTM revenue
    - ~4.56x market cap / revenue
    - Useful animal-health scale reference and strategic-acquirer lens
    - Vence is only a tiny part of Merck, so the multiple is a noisy proxy
  notes: 'Coverage is partial by design: the set provides directional public bounds, not a perfect one-to-one peer basket for Halter.'
  enumerationScope:
    coverage: partial
    basis: Selected to bracket Halter from lower-bound ag hardware exposure to upper-mid industrial software and animal-health references using public 2026 market-cap and revenue pages.
