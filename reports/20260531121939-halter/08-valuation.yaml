- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - ARR clearly outruns public rough estimates; satellite broadens U.S. addressability; new markets convert well; retention and margins prove premium quality
    - US$2.6B-US$3.4B outcome; from a US$2.0B entry that implies roughly 1.3x-1.7x gross value uplift before dilution
    - Execution misses, incident risk, or margin disappointment collapse the premium case
    - Possible, but requires multiple private proofs that are not public today
  - - Base
    - Growth remains strong, but economics look more like a premium industrial / vertical-software hybrid than a pure SaaS outlier
    - US$1.6B-US$2.2B range; limited upside from the current mark unless private metrics are materially better than public proxies
    - Entry discipline matters because mediocre economics could erase most upside
    - Most supportable with current public evidence
  - - Bear
    - Price sensitivity, category friction, or service intensity reveal a hardware-heavy business with lower recurring quality and weaker expansion
    - US$0.9B-US$1.3B range; from a US$2.0B entry that implies material downside and a likely painful financing reset
    - Could be accelerated by dilution, preference overhang, or public-land / welfare setbacks
    - Credible because the public record is still thin on exactly the metrics that usually defend premium rounds
  notes: Ranges are author scenario bands based on public comparables, price proxies, and the current private mark; they are not discounted-cash-flow outputs.
