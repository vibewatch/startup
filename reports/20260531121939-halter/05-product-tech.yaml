chapter:
  number: 5
  title: Product & Technology
  summary: 'Halter’s public product surface supports the core underwriting idea that this is an integrated operating system for grazing, not just a smart collar: the company explicitly shows collars, connectivity, apps, and machine intelligence working together across dairy and beef workflows. The strongest verified technical differentiators are satellite-enabled beef deployment, a large claimed behavioral-data asset, and active IP/developer signals, but public reliability, API, and security-assurance detail still lag the ambition of the story.'
sections:
- id: product-system-and-workflow-fit
  title: Product System, User Workflow, and What the Public Surface Actually Proves
  body: The main product question is whether Halter sells a collar, a pasture-management app, or a full operating system. Public materials support the third interpretation more than the first two. Halter’s own technology surface bundles collar hardware, connectivity, mobile and web workflows, and machine intelligence into one system that spans daily shifting, pasture allocation, breeding support, and remote monitoring across both dairy and beef use cases. The dairy product is framed around intensive, high-cadence farm management, including near-real-time shifting and heat/health updates, while the beef product is framed around rugged remote land, lower infrastructure burden, and satellite reach. That distinction matters because it suggests Halter has built workflow-specific product logic rather than simply reselling one generic collar with marketing overlays. Independent coverage of the 2026 satellite rollout strengthens the view that beef is not just a copy of the dairy product, but a separate
    deployment architecture with different operating constraints and buyer value drivers.
  claimRefs:
