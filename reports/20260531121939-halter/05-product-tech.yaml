  evidenceGaps:
  - type: missing-source
    severity: material
    topic: reliability-transparency
    missingEvidence: Public uptime history, failure-rate data, battery replacement cadence, and SLA commitments for dairy and beef deployments.
    whyItMatters: Without reliability disclosures it is impossible to separate a polished product surface from a field-hardened operating system.
    diligencePath: Request 12-month uptime, hardware-failure, battery-service, and incident logs segmented by dairy, tower-based beef, and satellite beef deployments.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: material
    topic: integrations
    missingEvidence: Public API documentation, integration reference architecture, or partner-implementation guides for third parties.
    whyItMatters: Integration depth drives implementation cost, data portability, and whether Halter can embed into broader farm-management workflows.
