- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow / pain
  - Halter solution
  - Measurable benefit signal
  - Limitation
  rows:
  - - Daily paddock shifts on dairy
    - Manual fence moves and repeated stock movement
    - App-driven virtual breaks and remote shifting
    - Halter says dairy shifts respond in about 90 seconds
    - No independent time-and-motion benchmark on public record
  - - Pasture allocation and utilization
    - Pasture walks and delayed feed visibility
    - Live paddock data plus granular pasture updates
    - Public materials position pasture utilization as a core ROI lever
    - No public cross-farm calibration or error-rate disclosure
  - - Breeding and heat management
    - Observation-heavy mating management and fragmented records
    - Heat lists, cycling activity, and estimated pregnancy status in product workflows
    - Roadmap and module pages show breeding support as first-class functionality
    - No public false-positive rate or breed-by-breed performance data
  - - Remote beef grazing on rugged land
    - Physical fence builds, polywire, or inaccessible terrain
    - Satellite-connected collars with no tower build required
    - Independent coverage ties the launch to very large ranch terrain
    - No public throughput, battery, or monthly connectivity economics
  - - Public / leased land grazing
    - Fence construction can be prohibited or economically unattractive
    - Collars plus satellite make temporary grazing control possible without permanent infrastructure
    - Official positioning and DTN coverage align on this use case
    - Regulatory and welfare acceptance still varies by jurisdiction and stakeholder
  notes: Benefit signals are a mix of company-claimed workflow claims and independent coverage; they are not a controlled ROI study.
