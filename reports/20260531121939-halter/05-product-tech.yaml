    - Data infrastructure and storage economics
    - No public uptime, data-retention, or resilience metrics
  - - Machine-learning / IP layer
    - Pasture-cover estimation, guidance logic, and behavior interpretation
    - Cowgorithm claims plus patent-marking page and assignee index
    - Model training data and proprietary know-how
    - No public model validation packet or customer-visible accuracy thresholds
  notes: This table stays at the layer level because Halter does not publish a low-level architecture diagram or developer implementation guide.
