    - Live across dairy and beef
    - Solar-powered form factor plus cue-delivery logic are core to the product identity
    - No public MTBF, battery-replacement cadence, or hardware-failure data
  - - Tower connectivity
    - Dairy operator
    - Connects collars farm-wide without mobile reception
    - Live on dairy footprint
    - Self-powered, on-farm coverage layer avoids telco dependence
    - No public coverage density, redundancy, or outage history
  - - Satellite connectivity
    - Remote beef operator
    - Extends collar connectivity to rugged land without towers or cell coverage
    - Launched in 2026 for beef
    - Infrastructure-light deployment unlocks public and leased land use cases
    - No public satellite latency, battery trade-off, or unit-economics disclosure
  - - Mobile / web app
    - Farmer / rancher / staff
    - Creates shifts, fences, tasks, and monitoring views
    - Live with active 2026 updates
    - Workflow control and monitoring sit in one interface across herd and pasture
    - No public API or integration documentation
  - - Intelligence / Cowgorithm / data platform
    - Operator and Halter internal models
    - Turns telemetry into guidance, alerts, pasture estimates, and decision support
    - Live but partly opaque
    - Large claimed behavior-data corpus plus machine-learning positioning
    - No public model-accuracy, false-positive, or data-governance detail
  notes: Rows separate visible live modules from the architecture or data claims that still depend mainly on vendor-authored materials.
