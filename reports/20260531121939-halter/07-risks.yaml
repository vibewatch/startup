  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operational-incidents
    missingEvidence: Customer-level incident rates for collar failure, battery replacement cadence, escaped-stock events, welfare complaints, and service uptime by geography.
    whyItMatters: Public sources prove the category works in many settings but do not reveal how often the system fails, how severe failures are, or how quickly Halter resolves them at scale.
    diligencePath: Request a 24-month incident log with severity, root cause, time to resolution, geography, animal count affected, and any regulator or customer escalation history.
    relatedQuestionRefs:
    - QR014
    - QR016
    - QR026
    relatedTableRefs:
    - TR002
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-surface
    missingEvidence: A complete jurisdiction-by-jurisdiction register of permits, notices, comments, approvals, and any litigation or formal challenges affecting Halter or its end users.
    whyItMatters: The public record is enough to show policy dependence, but not enough to prove there are no adverse agency actions, comment campaigns, or dormant legal blockers in key ranching markets.
    diligencePath: Request counsel memo covering the U.S., New Zealand, Australia, Ireland, and the U.K., including permit dependencies, comment dockets, welfare complaints, and any threatened or pending disputes.
    relatedQuestionRefs:
    - QR002
    - QR003
    - QR025
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: partner-dependency
    missingEvidence: Commercial terms, SLA structure, fallback arrangements, and concentration exposure for Starlink, manufacturing partners, public-land partners, and advisor/channel relationships.
    whyItMatters: Recent launches reduce some friction but also shift the dependency stack outward to third parties whose economics and reliability are not visible in public sources.
    diligencePath: Request the top counterparty dependency map with spend, volume, exclusivity, SLA metrics, termination rights, and contingency plans for each critical supplier or partner.
    relatedQuestionRefs:
    - QR010
    - QR018
    - QR025
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: governance-and-scale
    missingEvidence: Board composition, committee structure, executive succession, leadership span-of-control, and measured onboarding productivity for the 2026 hiring wave.
    whyItMatters: Public coverage confirms aggressive scaling, but it does not show whether management systems and governance have matured as quickly as headcount and capital have.
    diligencePath: Request current org chart, board deck summary, key-person risk matrix, attrition metrics, and time-to-productivity data for customer and engineering hires.
    relatedQuestionRefs:
    - QR024
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
