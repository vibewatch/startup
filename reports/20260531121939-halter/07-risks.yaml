    - AWC opinion and NZVA position are live reference points; evidence base still debated
    - medium
    - high
    - Published welfare guidance, training protocols, lower-energy pulse design, external study library
    - A material incident stream or critical long-run study could reopen legitimacy risk quickly
    - Obtain incident history, independent long-duration studies, and any regulator or veterinary complaints since launch
  - - Virtual fencing legality in dairy states
    - Australia
    - Dairy Australia says it is now legal in all six dairying states
    - low-medium
    - medium
    - Company can now cite an explicit 2026 legality expansion in a core market
    - State legality does not guarantee customer economics or acceptance in every production setting
    - Request market-by-market compliance memo and any use restrictions by state or species
  - - Public-land permit and grazing-policy dependence
    - U.S. federal lands
    - USDA/DOI encourage innovation; BLM grazing rule remains live and comment-sensitive
    - medium
    - high
    - Agency engagement, partner-funded pilots, rancher consultation, no-net-loss AUM language
    - Public-land access remains policy-mediated and vulnerable to procedural or political change
    - Review permit dependencies, comment exposure, and contingency plan if BLM rulemaking shifts
  - - Conservation / access partnerships
    - California / New Mexico / western U.S.
    - Halter has active partnership announcements but execution still relies on counterparties
    - medium
    - medium-high
    - Foundation funding and local partner relationships create near-term proof points
    - Projects can stall if agencies, foundations, or local groups deprioritize programs
    - Request project economics, signed commitments, renewal terms, and concentration by partner
  - - Corporate and cross-jurisdiction governance surface
    - New Zealand / United States
    - NZ entity extract shows U.S. ultimate holding company and limited public governance detail
    - medium
    - medium
    - Formal entity status is current and publicly searchable
    - Board, committee, and intercompany details are still mostly private
    - Request full structure chart, board list, reserved matters, and intercompany transfer terms
