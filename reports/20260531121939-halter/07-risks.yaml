- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Welfare legitimacy deteriorates
    - Independent complaints, adverse studies, or regulator interventions
    - Any formal restriction, credible welfare incident cluster, or long-run study showing material harm
    - Pause underwriting until incident data, remediation, and regulatory path are clear
  - - Price cuts mask weak economics
    - Discounting cadence and payback narrative
    - Another major price reset without matching evidence of lower cost-to-serve or better conversion
    - Move thesis from growth-quality to growth-at-risk and tighten entry discipline
  - - Satellite dependence disappoints
    - Coverage reliability and customer testimonials in remote terrain
    - Meaningful outage pattern, SLA weakness, or stalled remote-ranch adoption after the 2026 launch
    - Reduce confidence in the U.S. expansion wedge and haircut valuation assumptions
  - - Public-land strategy stalls
    - Pilot-to-commercial conversion and policy continuity
    - BLM or partner projects fail to renew, or rule changes create new friction for permittees
    - Treat public-land proof as non-core and refocus diligence on purely commercial accounts
  - - Hiring wave outruns operating system
    - Field-ops productivity and customer-quality signals
    - Implementation delays, visible support strain, or elevated attrition through the 2026-2027 scale-up
    - Assume slower growth and higher burn until operating metrics prove otherwise
  notes: Triggers are chosen for observability in diligence and IC follow-up; they are not intended as precise internal company KPIs.
