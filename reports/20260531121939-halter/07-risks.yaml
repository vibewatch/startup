chapter:
  number: 7
  title: Risks
  summary: 'Halter’s 2026 risk profile is no longer dominated by whether virtual fencing can work at all. The harder issue is whether the company can convert real regulatory momentum, visible public-land partnerships, and materially better connectivity into lower-risk unit economics and durable execution. Welfare legitimacy, pricing pressure, partner dependence, and organizational scale-up all remain live enough that the company looks investable only conditionally: the upside case is credible, but the residual downside is still driven by operating-system quality rather than by a lack of customer imagination.'
sections:
- id: regulatory-and-welfare-legitimacy
  title: Regulatory and Welfare Legitimacy Improved in 2026, but It Is Not Closed-Form Risk
  body: Halter’s public record is now much stronger on legal and policy momentum than it was a year ago, but the key judgment is not that regulation disappeared. It is that the debate moved from abstract feasibility toward conditional acceptance. Dairy Australia’s 2026 update shows virtual fencing is now legal across all six Australian dairying states, and U.S. public-land agencies are publicly endorsing innovation pilots that include virtual fencing. That is real progress. At the same time, the UK Animal Welfare Committee opinion and the New Zealand Veterinary Association position statement both keep the welfare question open enough that the company still needs careful use, defensible training protocols, and more long-duration independent evidence. For underwriting, that means Halter no longer looks blocked by headline legality, but it still looks exposed to policy reversals, localized objections, and any future incident stream that undermines welfare legitimacy.
