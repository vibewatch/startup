      - number: '3.3'
        title: Switching Costs, Status-Quo Alternatives, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              The biggest competitor to any virtual-fencing vendor is still often doing less. Physical fence, portable
              wire, and manual shifting remain credible options where labor is available and operators want to avoid
              high upfront collar and infrastructure costs. That matters because buyers do not have to choose among
              Halter, Gallagher, Vence, and Nofence; they can also postpone the whole category. When they do engage,
              switching costs are meaningful. Training animals, training staff, learning each vendor’s mapping logic,
              and operating around non-interoperable components all create friction. Distribution power also differs
              across the set. Gallagher and Merck can attach virtual fencing to larger field-sales and trust surfaces,
              while Nofence and Halter win when a simpler deployment story resonates more than incumbent channel
              breadth. Adjacent monitoring vendors put additional pressure on budget allocation by promising health or
              calving outcomes without asking the buyer to commit to a full software-defined grazing stack.
            claimRefs:
              - CP030
              - CP031
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP041
      - number: '3.4'
        title: Moat Durability, Entrant Pressure, and the Hardest Competitive Questions
        blocks:
          - type: paragraph
            body: >-
              Halter’s moat is real, but it looks operational rather than absolute. The company has the clearest public
              installed-base proof point in the reviewed set, plus differentiated remote-coverage messaging and a
              broader operating-system pitch than most peers. At the same time, the field is unlikely to stay static.
              Dairy Australia explicitly expects new entrants as regulation opens, while Corral, Drover, Collie, and
              Ranchflow show that competitor pressure can arrive through specialized cow-calf workflows, ear-tag form
