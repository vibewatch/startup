  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Halter’s customer journey appears to move from grazing pain to live deployment and then to broader operational
      attachment rather than one-off hardware sale.
    claimRefs:
      - CU001
      - CU016
      - CU021
      - CU036
      - CU039
      - CU040
    data:
      items:
        - stage: Problem recognition
          actors:
            - Owner-operator
            - Ranch or farm manager
          touchpoints:
            - Outcome stories
            - Media coverage
            - Virtual Fencing 101 guide
          emotion: Buyers respond to fence cost, labor burden, pasture control, and productivity pressure.
          label: Problem recognition
        - stage: Onboarding / setup
          actors:
            - Halter rep
            - Farm or ranch staff
          touchpoints:
            - Collaring
            - Tower or connectivity setup
            - Training and first shifts
          emotion: Adoption feels operational and field-heavy rather than self-serve software.
          label: Onboarding / setup
        - stage: Live operational use
          actors:
            - Owner-operator
            - Field staff
          touchpoints:
            - Daily shifts
            - Winter grazing
            - Breeding workflows
            - Remote monitoring
          emotion: The system becomes more valuable when it compresses daily work and unlocks land flexibility.
          label: Live operational use
        - stage: Expansion / attachment
          actors:
            - Owner-operator
            - Partners / educators
          touchpoints:
            - More acres or head
            - Public-land partnerships
            - Management training
          emotion: Expansion happens when initial use proves value and the operator wants more from the same platform.
          label: Expansion / attachment
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: >-
      The public funnel is not just demo-to-sale; it runs from grazing pain through field onboarding to live deployment
      and broader operational rollout.
    claimRefs:
      - CU019
      - CU020
      - CU022
      - CU031
      - CU034
      - CU036
      - CU040
    data:
      nodes:
        - id: f1
          label: Pain identified
          description: Fence cost, labor burden, winter grazing, or pasture-control pain starts the search.
        - id: f2
          label: Proof / education
          description: Buyers consume stories, guides, or peer references before committing to field deployment.
        - id: f3
          label: Field onboarding
          description: Collars, towers or connectivity, and initial training create implementation work before value appears.
        - id: f4
          label: Live deployment
          description: Operational use begins on real paddocks, ranches, or breeding workflows.
        - id: f5
          label: Expand or stall
          description: Accounts either broaden acreage/head/use cases or hit cost, regulatory, or support friction.
      edges:
        - from: f1
          to: f2
          label: Why change?
        - from: f2
          to: f3
          label: Commit to setup
        - from: f3
          to: f4
          label: Go live
        - from: f4
          to: f5
          label: Prove value or face friction
