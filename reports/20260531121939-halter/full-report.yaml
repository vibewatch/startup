  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The Company Case Is Real, but the Current Mark Already Prices in a Lot of Success
        blocks:
          - type: paragraph
            body: >-
              Halter’s valuation chapter starts with an uncomfortable but useful split. The thesis is not imaginary: the
              company now has a large financing, visible installed-base proof, a premium investor set, strong product
              ambition, and enough customer outcome evidence to argue it is building more than a novelty hardware
              business. The anti-thesis is equally real: the public file is still thin where premium valuations are
              usually won or lost, namely audited ARR, gross margin, retention, cap-table terms, and the shape of cohort
              economics once deployment intensity is normalized. That makes the current mark easier to admire than to
              underwrite. Public sources can justify why the company deserves a premium narrative versus ordinary farm
              equipment businesses, but they do not yet justify assuming the market should pay pure-SaaS style multiples
              at face value. The 2026 round therefore looks like a high-quality asset at a price that already assumes
              strong execution continuity.
            claimRefs:
