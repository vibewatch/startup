      - number: '7.2'
        title: Operational Risk Has Shifted from “Can It Work?” to “Can It Work Cheaply and Repeatably at Scale?”
        blocks:
          - type: paragraph
            body: >-
              The operating risk story is no longer a simple technology-readiness question. Multiple sources now support
              that virtual fencing can work in real ranch settings, especially once animals are trained. The harder
              underwriting issue is cost-adjusted repeatability. North Dakota State University’s pricing framework, Farm
              Progress’ cost skepticism, and the need for discounting in New Zealand all point to a category that still
              asks customers to swallow meaningful operating and financing burdens. Satellite connectivity reduced one
              barrier, but it replaced tower dependence with new external infrastructure dependence and did not erase
              field-maintenance or reliability risk. Colorado State’s real-world experience—collars falling off,
              moisture issues, and battery disappointment—matters because it shows that adoption risk now sits in the
              messy middle of deployment quality, not merely in whether a demo can impress. The company may be ahead,
              but it is still selling a field system, not effortless software.
