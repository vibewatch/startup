      - number: '2.4'
        title: Growth Drivers, Adoption Constraints, and Market Gaps
        blocks:
          - type: paragraph
            body: >-
              The most convincing demand drivers are labor, grazing precision, and land-management flexibility. Arizona
              extension, Farm Progress, WireMesh, and UC Davis all point to the same logic: virtual fencing can save
              time, reduce the need to build or move temporary fence, and help operators use forage, riparian
              exclusions, fuel breaks, or public-land grazing more precisely. Australia’s regulatory opening also
              removes an important adoption barrier. But the constraints are just as real. First-year virtual-fence
              costs in Arizona can run from roughly $175 to $400 per cow, with ongoing annual costs still meaningful.
              Farm Progress quotes Halter’s U.S. pricing at $72 per collar per year plus a one-time tower cost, while
              New Zealand advisory content still frames advanced Halter pricing around NZ$9.90 per cow per month.
              Connectivity, batteries, training discipline, perimeter fencing, and welfare scrutiny remain gating
              factors. The market opportunity is therefore large and real, but the near-term serviceable market is
              narrower than total cattle counts and still depends on where the economics actually pencil for producers.
            claimRefs:
