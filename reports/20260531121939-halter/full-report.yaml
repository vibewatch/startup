      - number: '7.3'
        title: The Growth Story Depends on Outside Counterparties, Not Just Halter’s Collar and App
        blocks:
          - type: paragraph
            body: >-
              A notable feature of Halter’s 2026 narrative is how dependent it is on external actors. Public-land growth
              relies on federal agencies, conservation groups, and foundation funding; satellite reach relies on
              Starlink-type infrastructure; advisor adoption loops rely on consultants and vets; and the 2026 operating
              plan relies on a large hiring wave executing well in multiple geographies at once. None of those
              dependencies are inherently fatal, but together they create a risk profile that looks more like
              infrastructure orchestration than a pure software rollout. The Companies Office extract also shows a
              cross-jurisdiction structure with a U.S. ultimate holding company layered over the New Zealand entity,
              while public governance visibility remains thin. For investors, that means the company can win category
              leadership and still disappoint if partner economics, talent absorption, or governance maturity lag the
              pace of expansion.
