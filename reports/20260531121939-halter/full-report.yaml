      - number: '1.4'
        title: Milestones, Recognition, Welfare Evidence, and Open Risks
        blocks:
          - type: paragraph
            body: >-
              The milestone trail from 2025 into 2026 is strong enough to show both product-market fit and widening
              external scrutiny. Halter paired a Series D and then a much larger Series E with operational markers such
              as a Bureau of Land Management partnership, TIME Best Inventions recognition, independently publicized ROI
              studies on New Zealand dairy farms, and a direct-to-satellite launch for beef operations. Those are real
              proof points, not just founder rhetoric. The same source pack also shows why the diligence case cannot
              stop at the headline growth numbers. Halter’s own welfare materials are detailed and cite independent
              Tasmanian research, but the New Zealand Veterinary Association still says long-term evidence is limited
              and that strong safeguards, training, and regulatory oversight remain essential. Dairy Australia similarly
              frames legalization as recent and conditional rather than permanently settled. Customer economics also
              look promising but non-trivial: third-party farm-finance commentary still puts advanced Halter pricing
              around NZ$9.90 per cow per month, with additional infrastructure and workflow-change requirements. The
              result is a company with unusually strong momentum, but one whose governance disclosure, cost burden, and
              welfare-regulation surface still deserve active underwriting rather than passive acceptance.
