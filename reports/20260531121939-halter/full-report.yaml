      - number: '7.4'
        title: >-
          Residual Risk Is Investable Only If the Company Keeps Converting Policy, Product, and Financing Momentum into
          Lower-Risk Proof
        blocks:
          - type: paragraph
            body: >-
              The important portfolio conclusion is that Halter’s risk stack is manageable only if several things
              continue to go right at the same time. The company has real momentum: more capital, broader legality,
              better connectivity, and visible producer adoption. But the public record still breaks before the
              questions that matter most to downside protection: true incident rates, public-land dependency economics,
              partner concentration, and whether a 200-plus hiring plan can sustain customer-quality delivery. That
              leaves a risk profile where mitigations exist but are not yet mature enough to make the residual exposure
              trivial. The right IC framing is therefore not binary. It is conditional. If satellite rollout genuinely
              lowers service friction, if price reductions do not imply weakening unit economics, and if welfare or
              regulatory objections remain manageable, the risk-adjusted case improves. If any of those vectors reverse,
              valuation support will weaken quickly. Put differently, Halter has crossed the threshold where execution
              quality now matters more than storytelling quality, and that is exactly where diligence discipline has to
              tighten before price can be trusted in an institutional underwriting process today.
            claimRefs:
