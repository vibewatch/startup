            body: >-
              The strongest public financial evidence is not a P&L; it is the combination of traction markers and
              customer-outcome proof. Halter’s Series E announcement gives the best scale anchor: one million collars
              sold, more than 2,000 customers, and more than 400 employees. Those numbers allow only rough operating
              proxies, but even rough proxies are useful: disclosed average collars per customer are large enough to
              imply real herd-level deployments rather than pure pilot activity, and the company’s customer count
              relative to headcount suggests a business that still needs meaningful people around the product. Revenue
              quality is supported more by operating outcomes than by accounting disclosure. The ten-farm study and
              advisor materials show profit, pasture, milk, and labor improvements that make the system look
              mission-critical when adoption works. What remains missing is exactly the data an investor would normally
              use to convert that value proof into unit economics—cohort retention, CAC, payback, and net revenue
