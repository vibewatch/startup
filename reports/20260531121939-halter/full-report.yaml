      - number: '8.2'
        title: Public Comps Put a Hard Ceiling on How Casual One Can Be About Paying the Full Mark
        blocks:
          - type: paragraph
            body: >-
              The cleanest public valuation check is not a perfect peer; it is a bounded comp band. Deere and AGCO show
              what public markets will pay for hardware-heavy agricultural exposure. Trimble shows how workflow-rich
              industrial technology can command a better multiple. Merck adds a large-scale animal-health reference
              point but is still an imperfect analogue because Vence is only one sliver of a far larger enterprise. Even
              with those caveats, the result is directionally sobering: the selected public set sits around 0.7x to 4.6x
              revenue, while Halter’s own public ARR estimate implies something like 20x to 29x ARR at the current mark.
              That gap does not prove the round is wrong, but it does prove that investors are paying for a very
              specific future—one where Halter compounds into a category-defining livestock operating system rather than
              settling into a capital-intensive niche tool with decent adoption and middling margins.
