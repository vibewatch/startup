          public proxies
        - Entry discipline matters because mediocre economics could erase most upside
        - Most supportable with current public evidence
      - - Bear
        - >-
          Price sensitivity, category friction, or service intensity reveal a hardware-heavy business with lower
          recurring quality and weaker expansion
        - >-
          US$0.9B-US$1.3B range; from a US$2.0B entry that implies material downside and a likely painful financing
          reset
        - Could be accelerated by dilution, preference overhang, or public-land / welfare setbacks
        - Credible because the public record is still thin on exactly the metrics that usually defend premium rounds
    notes: >-
      Ranges are author scenario bands based on public comparables, price proxies, and the current private mark; they
      are not discounted-cash-flow outputs.
    claimRefs:
      - CV011
      - CV039
      - CV040
      - CV041
