        title: Product System, User Workflow, and What the Public Surface Actually Proves
        blocks:
          - type: paragraph
            body: >-
              The main product question is whether Halter sells a collar, a pasture-management app, or a full operating
              system. Public materials support the third interpretation more than the first two. Halter’s own technology
              surface bundles collar hardware, connectivity, mobile and web workflows, and machine intelligence into one
              system that spans daily shifting, pasture allocation, breeding support, and remote monitoring across both
              dairy and beef use cases. The dairy product is framed around intensive, high-cadence farm management,
              including near-real-time shifting and heat/health updates, while the beef product is framed around rugged
              remote land, lower infrastructure burden, and satellite reach. That distinction matters because it
              suggests Halter has built workflow-specific product logic rather than simply reselling one generic collar
              with marketing overlays. Independent coverage of the 2026 satellite rollout strengthens the view that beef
              is not just a copy of the dairy product, but a separate deployment architecture with different operating
