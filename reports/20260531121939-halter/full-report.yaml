    the United States, with more than 2,000 farmers and ranchers, one million collars sold, and a broadened 2026 push
    into remote beef use cases via direct-to-satellite connectivity. The same public file also shows that governance
    visibility, audited economics, and long-duration independent welfare evidence remain incomplete relative to the
    current valuation.
