  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Welfare Legitimacy Improved in 2026, but It Is Not Closed-Form Risk
        blocks:
          - type: paragraph
            body: >-
              Halter’s public record is now much stronger on legal and policy momentum than it was a year ago, but the
              key judgment is not that regulation disappeared. It is that the debate moved from abstract feasibility
              toward conditional acceptance. Dairy Australia’s 2026 update shows virtual fencing is now legal across all
              six Australian dairying states, and U.S. public-land agencies are publicly endorsing innovation pilots
              that include virtual fencing. That is real progress. At the same time, the UK Animal Welfare Committee
              opinion and the New Zealand Veterinary Association position statement both keep the welfare question open
              enough that the company still needs careful use, defensible training protocols, and more long-duration
              independent evidence. For underwriting, that means Halter no longer looks blocked by headline legality,
              but it still looks exposed to policy reversals, localized objections, and any future incident stream that
              undermines welfare legitimacy.
            claimRefs:
              - CR017
