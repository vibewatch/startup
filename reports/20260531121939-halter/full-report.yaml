  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: How scale proof, economic opacity, public comp bounds, and risk converge on a price-disciplined recommendation.
    data:
      nodes:
        - id: n1
          label: Scale proof
          detail: 2,000+ customers, 1M collars, large round.
        - id: n2
          label: Recurring-price narrative
          detail: Per-animal pricing and operating-system ambition support a premium story.
        - id: n3
          label: Economic opacity
          detail: ARR, churn, gross margin, and cap-table terms remain private.
        - id: n4
          label: Public comp band
          detail: Listed references mostly sit between 0.7x and 4.6x revenue.
        - id: n5
          label: Scenario width
          detail: Bull exists, but base and bear remain very live.
        - id: n6
          label: Entry discipline
          detail: Terms and price matter more than admiration for the company.
        - id: n7
          label: Recommendation
          detail: Monitor or engage only with price discipline.
