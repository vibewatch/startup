  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scoring of Halter across proof, economics, risk, and valuation fit.
    data:
      items:
        - label: Market / category proof
          value: 8/10
          note: Real installed-base and geographic proof, not just product demos
        - label: Customer outcome proof
          value: 7/10
          note: Positive ROI signals exist, but samples remain limited and curated
        - label: Competitive moat
          value: 6/10
          note: Strong early lead, but credible alternatives from Merck and Gallagher remain
        - label: Unit-economics visibility
          value: 3/10
          note: ARR, margin, churn, and CAC remain largely private
        - label: Risk level
          value: 4/10
          note: Execution, pricing, welfare, and partner dependence keep downside live
        - label: Valuation fairness
          value: 4/10
          note: Current mark looks rich relative to public comp bounds
        - label: Evidence quality
          value: 5/10
          note: Strong public company story, weak public financial disclosure
        - label: Exit readiness
          value: 4/10
          note: Likely needs more private-round or strategic maturation before IPO-style underwriting
    approximationNotes: >-
      Scores are author judgments on a 1-10 scale using public evidence only; higher is better. Overall read-through:
      promising asset, stretched entry.
