  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Halter’s public stack reads as four connected layers from animal hardware to cloud intelligence and user
      workflows.
    approximationNotes: >-
      Layer boundaries are analyst-imposed from public materials because Halter does not publish a formal reference
      architecture.
    claimRefs:
      - CE001
      - CE008
      - CE009
      - CE010
      - CE011
      - CE016
    data:
      layers:
        - label: Animal hardware layer
          modules:
            - Solar-powered collar
            - Sensors and cue-delivery hardware
            - Durability / ergonomic design
          note: Publicly visible and clearly productized.
        - label: Connectivity layer
          modules:
            - On-farm tower coverage
            - Satellite connectivity for beef
            - Command / telemetry transport
          note: Architecture splits between dairy and beef operating contexts.
        - label: Application layer
          modules:
            - Mobile app
            - Web views for monitoring
            - Task and shift workflows
          note: Most buyer-visible workflow value sits here.
        - label: Intelligence layer
          modules:
            - Cloud data platform
            - Cowgorithm
            - Pasture and behavior models
          note: Most technical moat claims concentrate here, but validation remains private.
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      The public workflow begins with grazing intent in the app and ends with cattle movement, monitoring, and
      management insight.
    claimRefs:
      - CE002
      - CE005
      - CE020
      - CE021
      - CE022
    data:
      nodes:
        - id: n1
          label: Operator sets intent
          description: Farmer or rancher creates a break, shift, task, or breeding action in the app.
        - id: n2
          label: Connectivity relays command
          description: Tower or satellite path connects field hardware to Halter’s software stack.
        - id: n3
          label: Collars guide animals
          description: Directional cues and boundary logic move cattle or contain them in a virtual area.
        - id: n4
          label: Telemetry returns live data
          description: Animal location, health, and pasture signals are returned to the data platform.
        - id: n5
          label: Operator adjusts management
          description: The app turns telemetry into follow-on decisions on grazing, heat management, or tasks.
      edges:
        - from: n1
          to: n2
          label: Digital command
        - from: n2
          to: n3
          label: Field execution
        - from: n3
          to: n4
          label: Behavior and telemetry
        - from: n4
          to: n5
          label: Decision support
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Halter’s product delivery depends on hardware, connectivity, welfare legitimacy, and proprietary software/data
      layers all working together.
    claimRefs:
      - CE005
      - CE014
      - CE015
      - CE016
      - CE023
      - CE027
      - CE038
    data:
      nodes:
        - id: d1
          label: Collar hardware
          detail: Physical device must remain durable, comfortable, and serviceable in field conditions.
        - id: d2
          label: Tower / satellite path
          detail: Connectivity differs by dairy vs. beef context and is a gating dependency for remote control.
        - id: d3
          label: Cloud data platform
          detail: Processes telemetry and returns decisions to app surfaces.
        - id: d4
          label: Cowgorithm + ML stack
          detail: Proprietary behavior and pasture models drive most differentiation claims.
        - id: d5
          label: IP portfolio
          detail: Patent-marking and assignee records support defensibility narrative.
        - id: d6
          label: Regulatory / welfare legitimacy
          detail: Adoption still depends on jurisdictional permissibility and welfare acceptance.
        - id: d7
          label: User app workflows
          detail: Buyers experience value through the app, not only through the collar.
      edges:
        - from: d1
          to: d2
          label: Telemetry source
        - from: d2
          to: d3
          label: Data transport
        - from: d3
          to: d4
          label: Model inputs
        - from: d4
          to: d7
          label: Actionable outputs
        - from: d5
          to: d4
          label: Defensibility
        - from: d6
          to: d7
          label: Permitted use
        - from: d2
          to: d7
          label: Real-time workflow availability
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Public evidence suggests live maturity in the core workflow stack, but much thinner maturity evidence in external
      assurance and integrations.
