  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization, and What Public Pricing Actually Shows
        blocks:
          - type: paragraph
            body: >-
              Halter’s public materials point to a hybrid model rather than a single clean SaaS fee. The product is sold
              as a system: collars, connectivity, virtual fencing, pasture and herd workflows, and increasingly
              beef-specific or advisor-facing tooling that deepen usage beyond simple containment. Independent reporting
              is more explicit than the company itself on monetization. AgFunder describes a subscription business with
              per-cow monthly pricing plus one-time tower infrastructure, while iStart and CMK provide public price
              proxies that cluster around a per-animal monthly fee. That gives a usable direction of travel even though
              the official site still does not publish a durable rate card. The right reading is that Halter monetizes
              recurring animal-level usage while also carrying hardware and deployment economics that can vary by
              market, herd size, and connectivity path. That is financially attractive when adoption sticks, but it
              means the business cannot be modeled as low-friction pure software from public pricing evidence alone.
