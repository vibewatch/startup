- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Why it matters
  - Exact diligence path
  rows:
  - - Audited ARR / revenue
    - Material
    - Third-party ARR estimates are not enough for valuation or runway analysis
    - Request audited revenue bridge with recurring vs non-recurring split
  - - Gross margin by line
    - Material
    - Hardware-enabled recurring businesses can look strong on demand but weak on margin
    - Request hardware, services, and software gross margin waterfall
  - - Cash / burn / runway
    - Blocking
    - Latest raise size alone does not reveal how long expansion can be funded
    - Request monthly cash flow, burn history, and board runway model
  - - CAC / payback / NRR / churn
    - Material
    - Revenue quality cannot be fully judged without cohort efficiency and retention
    - Request cohort tables by dairy vs beef, geography, and product bundle
  - - Debt / leases / off-balance-sheet obligations
    - Material
    - Hidden financing can change downside risk materially
    - Request debt schedule, lease commitments, and supplier financing terms
  - - Revenue mix by hardware, subscription, and services
    - Material
    - Mix determines margin path and how scalable the business really is
    - Request management P&L segmented by revenue stream and geography
  notes: These are the minimum missing metrics required to move from promising public story to underwritten financial model.
