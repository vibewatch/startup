  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix-gap
    missingEvidence: Audited revenue split across hardware, recurring subscriptions, and services by geography or product line.
    whyItMatters: Without revenue mix, investors cannot model true gross-margin path or whether Halter scales like hardware, software, or a hybrid.
    diligencePath: Request audited management accounts with hardware, recurring software, and services segmentation plus geographic mix.
    relatedQuestionRefs:
    - QI001
    - QI014
    - QI022
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: runway-gap
    missingEvidence: Current cash balance, monthly burn, runway case, and financing plan.
    whyItMatters: Series E size alone does not reveal liquidity duration or next-round risk.
    diligencePath: Request board reporting on cash, burn, runway, and planned spend by expansion program.
    relatedQuestionRefs:
    - QI017
    - QI024
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-gap
    missingEvidence: Gross margin and contribution margin by hardware, services, and recurring software.
    whyItMatters: A hardware-enabled recurring-revenue business can look attractive on demand while still struggling to convert growth into cash.
    diligencePath: Request gross-margin bridge, unit BOM, warranty reserve, and installation-support costs.
    relatedQuestionRefs:
    - QI015
    - QI016
    - QI023
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: efficiency-gap
    missingEvidence: CAC, payback, retention, churn, and NRR by dairy vs beef cohort.
    whyItMatters: Revenue quality cannot be underwritten without understanding sales efficiency and customer durability.
    diligencePath: Request cohort tables and sales-funnel metrics by geography, herd size, and product bundle.
    relatedQuestionRefs:
    - QI018
    - QI019
    - QI021
    - QI022
    relatedTableRefs:
    - TI003
