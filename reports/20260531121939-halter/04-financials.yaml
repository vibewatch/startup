- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict, Main Risks, and the Missing Evidence for Underwriting
  body: 'A supportable public-market-style financial verdict on Halter has to separate business quality from disclosure quality. Business quality looks promising: the company sells into daily farm workflows, has fresh growth capital, and has at least some third-party pricing signals and ROI proof. Disclosure quality is much weaker. Revenue mix is not public, gross margin is not public, cash and burn are not public, and retention or payback metrics are not public. That means the investor can underwrite demand and strategic momentum, but not yet full capital efficiency. The main adverse signals are not that the business lacks traction; they are that virtual fencing still carries visible per-head cost and welfare-service burden, both of which can slow adoption or compress economics if customer support needs stay high. The practical implication is simple: Halter may be an excellent business, but it still requires management access and private financial materials before an investor can responsibly
    claim confidence in margin path or runway durability.'
