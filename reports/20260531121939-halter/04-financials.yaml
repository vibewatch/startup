callouts:
- calloutType: strength
  title: Public evidence supports real recurring value, not just gadget demand
  body: The strongest financial positive is that Halter appears to sit inside daily operating loops. Public study evidence and advisor tooling both suggest that, when the product works, it changes pasture allocation, labor usage, and profit rather than serving as a novelty sensor.
  claimRefs:
  - CI004
  - CI015
  - CI016
  - CI017
  - CI037
- calloutType: risk
  title: The hardest missing numbers are exactly the ones that determine capital efficiency
  body: Halter has fresh money and visible growth, but investors still cannot see audited revenue mix, gross margin, cash burn, runway, or retention. That means the public file supports momentum, not yet a complete underwriting model.
  claimRefs:
  - CI024
  - CI027
  - CI028
  - CI029
  - CI031
  - CI039
  - CI040
- calloutType: insight
  title: Satellite helps the customer economics story more than it resolves Halter’s margin opacity
  body: Removing towers and widening beef coverage should lower friction for customers and enlarge the serviceable market. It does not, however, remove the need to understand Halter’s own hardware, support, and R&D cost structure.
