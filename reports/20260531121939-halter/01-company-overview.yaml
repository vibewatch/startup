- id: funding-history-and-scale-signals
  title: Funding History, Investor Base, and Scale Signals
  body: 'Halter’s recent capital history shows a company moving from strong regional startup into globally noticed growth-stage platform. The June 2025 Series D put the business at roughly a $1 billion U.S. valuation, while the March 2026 Series E lifted that mark to $2 billion. The investor overlap across those rounds is important: Bond, Bessemer, DCVC, Blackbird, NewView, Promus, Icehouse, and Ubiquity all remain visible, while Founders Fund returned to lead the 2026 round after having backed Halter early. Public sources also support meaningful operating scale behind the financing: more than 2,000 customers, one million collars, over 400 employees, and a 220-plus hiring plan. Still, the exact lifetime capital figure is not perfectly disclosed in free public records because early rounds are mostly referenced through company summaries and database-style reporting rather than a clean official chronology. That is manageable but not ideal. The capital story therefore reads as credibly strong
    and well sponsored, while still leaving some diligence work around exact historical proceeds, dilution between rounds, and current investor governance rights.'
