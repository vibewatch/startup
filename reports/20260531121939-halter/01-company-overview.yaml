    severity: material
    topic: total-funding
    missingEvidence: A clean public round-by-round financing ledger for Series A through C, including proceeds, dates, and investor participation.
    whyItMatters: Lifetime capital raised and dilution history remain approximate when early rounds are only summarized in later releases or databases.
    diligencePath: Obtain a company-provided financing chronology or access paid venture databases and legal filings for early rounds.
