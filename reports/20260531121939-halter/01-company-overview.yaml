company:
  name: Halter
chapter:
  number: 1
  title: Company Overview
  summary: Halter is an Auckland-founded private agritech company building solar-powered, GPS-enabled cattle collars, virtual fencing, and pasture-management software for dairy and beef farmers. The business reached a $2 billion valuation in March 2026 on the back of more than 2,000 customers and one million collars sold, but public governance detail, early-round funding precision, and long-term independent welfare evidence remain thinner than the growth narrative.
sections:
- id: identity-product-and-footprint
  title: Identity, Product System, and Geographic Footprint
  body: 'Halter’s current identity is unusually crisp for a private agritech company: official 2026 materials describe it as the operating system for dairy and beef farms, built around solar-powered, GPS-enabled cattle collars, a connectivity layer, and a mobile app that lets farmers fence, shift, and monitor cattle remotely. That positioning matters because Halter is not selling a narrow sensor point solution; it is trying to own the day-to-day operating loop of pasture allocation, animal guidance, health observation, and labor coordination. The company’s March 2026 Series E materials and April 2026 satellite launch both support a business that has moved past New Zealand pilot status into a genuinely multi-market platform. Public sources consistently place Halter in New Zealand, Australia, and the United States, with Auckland as headquarters, a Melbourne base for Australia, and a Colorado foothold for the U.S. business. Scale claims are now large enough to anchor the rest of the report:
    Halter says it serves more than 2,000 farmers and ranchers, has sold one million collars, and can now extend virtual fencing into more remote beef terrain via direct-to-satellite connectivity.'
