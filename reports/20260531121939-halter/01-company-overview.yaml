- id: founders-leadership-and-governance
  title: Founders, Leadership Bench, and Governance Visibility
  body: Founder continuity remains a major part of the Halter story. Craig Piggott is still the visible public leader, and external investor and media sources continue to frame the company around his dairy-farm upbringing, Rocket Lab background, and product-led ambition to digitize cattle management. There is also enough evidence to treat Max Olson as a genuine co-founder and first CTO, even though he is no longer a current operating executive. Halter’s careers page shows that the company has built some bench depth below the founder layer, highlighting internally promoted leaders across product engineering, marketing, strategy, and operations. That said, public governance visibility is still weak relative to the valuation and growth pace. The reviewed source set does not expose a standing board roster, committee structure, current ownership percentages, or investor control terms. For diligence, that means the business looks founder-led with improving managerial depth, but not yet transparently
    governed in a way that lets an outside investor map formal checks, rights, or succession resilience from public materials alone.
  claimRefs:
