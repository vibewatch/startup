callouts:
- calloutType: strength
  title: Halter’s current edge is breadth plus deployment proof, not just collar hardware
  body: Halter has the clearest public installed-base disclosure in the reviewed set and a broader operating-system pitch than most peers, especially once beef satellite coverage is added to dairy workflow depth. That combination is meaningful because buyers are underwriting change-management effort, not merely buying devices.
  claimRefs:
  - CP004
  - CP005
  - CP031
  - CP040
  - CP045
- calloutType: risk
  title: Cost and trust remain the fastest ways for a buyer to reject the whole category
  body: The harshest competitive threat may be inertia. Independent sources keep showing that virtual fencing can still look expensive, operationally demanding, and exposed to welfare or regulatory scrutiny versus familiar wire-and-labor routines.
  claimRefs:
  - CP026
  - CP027
  - CP035
  - CP037
  - CP041
- calloutType: insight
  title: Entrant pressure is likely to come from lighter infrastructure and narrower wedges
  body: Corral, Drover, Collie, and Ranchflow suggest that newer challengers do not need to out-copy Halter on every feature. They can come in through cow-calf specialization, ear tags, virtual herding, or AI monitoring and still pressure the category’s pricing and differentiation story.
  claimRefs:
  - CP015
  - CP016
  - CP017
  - CP018
  - CP042
