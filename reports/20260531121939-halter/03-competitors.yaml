- id: capability-pricing-and-architecture
  title: Capability Breadth, Infrastructure Choice, and Public Pricing Signals
  body: 'Capability and infrastructure design are where the direct rivals actually separate. Halter’s strongest product-breadth story remains its split positioning across dairy and beef: the dairy offer reaches pasture, shifting, and animal-health workflows, while the beef offer now leans heavily on direct-to-satellite coverage in remote terrain. Gallagher and Vence ask buyers to accept more explicit infrastructure choices around cellular, LoRa, or base stations; Nofence instead pushes a no-base-station model with subscription economics and a five-year warranty. Independent sources reinforce that these systems are not interchangeable modules. Buyers cannot assume collars, software, and training protocols swap cleanly across vendors, which makes architecture a durable part of switching cost. Public pricing signals are also uneven. Halter’s current list proxy still comes mainly from third-party commentary, eShepherd shows one academic comparison point, Nofence discloses subscription structure
    more clearly than dollar list pricing, and early entrants mostly advertise pilots or discounts rather than a durable commercial schedule.'
