- id: moat-durability-and-open-risks
  title: Moat Durability, Entrant Pressure, and the Hardest Competitive Questions
  body: 'Halter’s moat is real, but it looks operational rather than absolute. The company has the clearest public installed-base proof point in the reviewed set, plus differentiated remote-coverage messaging and a broader operating-system pitch than most peers. At the same time, the field is unlikely to stay static. Dairy Australia explicitly expects new entrants as regulation opens, while Corral, Drover, Collie, and Ranchflow show that competitor pressure can arrive through specialized cow-calf workflows, ear-tag form factors, virtual herding, or AI-led monitoring rather than only through direct clones of Halter’s collar stack. The hardest underwriting questions are still unresolved in public sources: real net pricing, renewal behavior, customer concentration by competitor, and verified deployment scale for the newer entrants. Those gaps matter because they determine whether Halter’s apparent lead is economically durable or simply the first visible wave in a category that will compress
    as infrastructure gets lighter and feature claims converge.'
