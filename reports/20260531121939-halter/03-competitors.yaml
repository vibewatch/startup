- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Installed-base proof and product breadth
    - New entrants can still target sub-workflows such as tags, AI monitoring, or virtual herding
    - Medium-High
    - Ask for cohort-level evidence that breadth really improves retention and expansion, not just brochure scope
  - - Remote deployment flexibility
    - Gallagher, Vence, and other rivals can compete where buyers accept more infrastructure
    - Medium
    - Map win rates by terrain type and connectivity profile rather than assuming one architecture fits all
  - - Animal-training and operational know-how
    - Status quo fence and labor still look cheaper when full-category cost is visible
    - High
    - Request implementation playbooks, training completion rates, and time-to-value by herd type
  - - Trust and welfare posture
    - Category-wide scrutiny can slow procurement or legalization even if a single vendor executes well
    - High
    - Review welfare incidents, regulator engagement, and customer safeguards instead of relying on marketing
  - - Pricing power
    - Public pricing opacity makes it hard to know whether feature breadth translates into net revenue quality
    - High
    - Get realized price waterfalls, hardware subsidies, and renewal/churn data
  - - Channel and procurement access
    - Gallagher and Merck can bundle trust and field-sales relationships into competitive bids
    - Medium-High
    - Review procurement win-loss notes and which buyers choose specialists versus incumbents
  notes: Severity is a judgment based on likely impact on switching, procurement, and margin durability. The register is meant to translate fetched evidence into diligence asks, not to claim quantified loss outcomes.
