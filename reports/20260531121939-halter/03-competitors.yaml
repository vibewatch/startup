  rows:
  - - Halter
    - Direct platform
    - 'Officially disclosed: 1M collars sold; 2,000+ farmers and ranchers'
    - NZ/AU dairy; remote beef ranches
    - Broad operating-system pitch across fencing, shifting, pasture, and animal monitoring; satellite for beef
    - Realized pricing and renewal behavior remain private
  - - Gallagher eShepherd
    - Direct platform / incumbent-backed
    - Commercialized by Gallagher inside a large fencing brand
    - Extensive grazing and beef operations
    - Solar GPS neckbands; cellular or LoRa options; incumbent trust surface
    - More infrastructure-heavy than no-base-station models
  - - Merck Vence
    - Direct platform / incumbent-backed
    - Owned by Merck Animal Health
    - Large ranch and rangeland cattle operations
    - Base-station architecture designed for large acreage
    - Base stations raise installation complexity and capital needs
  - - Nofence
    - Direct platform / independent specialist
    - Public product pages emphasize product structure more than scale
    - Beef plus dry-cow and replacement-heifer dairy workflows
    - No base stations required; 5-year warranty; subscription model
    - Public list-price dollars remain unclear in reviewed sources
  - - Corral
    - Likely entrant / specialist
    - Early-partner discounting visible; broader scale not public
    - Cow-calf operations
    - Cow-calf specialization and customer-support wedge
    - Verified deployment scale not public in reviewed sources
  - - Drover
    - Likely entrant / tag-based
    - No public deployment count in reviewed sources
    - Ranchers seeking lighter infrastructure
    - Ear tags instead of collars; no base stations; no electric shock claim
    - Commercial traction and pricing depth remain thin publicly
  - - Collie
    - Likely entrant / Europe-led
    - Public site highlights outcome claims, not deployed fleet size
    - Pasture dairy and grazing herds
    - Virtual herding plus fencing; labor-saving message
    - Evidence is mostly company-issued and Europe-centric
  - - Adjacent monitoring stack
    - Adjacent substitute
    - Datamars, Cowlar, and Moocall each sell narrower animal-data workflows
    - Monitoring-led buyers
    - Lower-scope path for health, behavior, or calving outcomes
    - Does not match full grazing-control breadth
  - - Status quo / internal build
    - Substitute
    - No software spend required beyond existing tools
    - Cost-sensitive or low-change operators
    - Physical wire, portable fence, and manual labor are familiar
    - Sacrifices remote control, richer data, and faster paddock changes
