evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board roster, committee structure, shareholder rights, and investor ownership percentages.
    whyItMatters: >-
      Without these materials, outside investors cannot map governance checks, downside protections, or succession
      resilience from public evidence.
    diligencePath: Request cap table, board documents, and shareholder agreements directly from the company or lead investors.
    relatedQuestionRefs:
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: total-funding
    missingEvidence: >-
      A clean public round-by-round financing ledger for Series A through C, including proceeds, dates, and investor
      participation.
    whyItMatters: >-
      Lifetime capital raised and dilution history remain approximate when early rounds are only summarized in later
      releases or databases.
    diligencePath: >-
      Obtain a company-provided financing chronology or access paid venture databases and legal filings for early
      rounds.
    relatedQuestionRefs:
      - QO011
      - QO025
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: series-d
    missingEvidence: A company-published currency bridge clarifying NZD versus USD presentation for the 2025 Series D amount.
    whyItMatters: >-
      The public record is directionally consistent but not perfectly normalized, which can create avoidable confusion
      in historical funding analysis.
    diligencePath: Confirm whether the 2025 round is best cited as NZD 165M, USD 100M, or both with exchange-rate context.
    relatedQuestionRefs:
      - QO008
      - QO009
  - type: stale
    severity: material
    topic: welfare-evidence
    missingEvidence: >-
      Long-term independent welfare outcomes across beef systems and larger multi-year datasets not mediated through
      company summaries.
    whyItMatters: >-
      Halter’s current welfare case is encouraging but still partly company-curated, while external veterinary and
      regulatory bodies explicitly want longer-term independent evidence.
    diligencePath: >-
      Collect the full peer-reviewed publications, regulator reviews, and any independent beef-specific welfare studies
      as they are released.
    relatedQuestionRefs:
      - QO022
      - QO023
      - QO025
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-som
    missingEvidence: >-
      A direct public dataset isolating pasture-based cattle operations in Halter’s live markets that can economically
      justify full virtual-fencing deployment now.
    whyItMatters: >-
      Without a sourced SAM or SOM, valuation and penetration analysis must rely on analytical headcount lenses rather
      than spend-based market sizing.
    diligencePath: >-
      Request cohort economics from Halter or combine paid farm-operation datasets with regional labor and fencing cost
      data.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: willingness-to-pay
    missingEvidence: Customer-level retention, expansion, and realized payback data by herd size and geography.
    whyItMatters: >-
      Public pricing proxies exist, but robust demand forecasting requires cohort-level willingness-to-pay and realized
      ROI data.
    diligencePath: Request customer cohort economics, churn, and expansion data from Halter or major channel partners.
    relatedQuestionRefs:
      - QM018
      - QM025
    relatedTableRefs:
      - TM004
  - type: conflicting-data
    severity: minor
    topic: market-scope
    missingEvidence: >-
      A standardized cross-country definition for dairy versus beef versus all-cattle scopes across New Zealand,
      Australia, and the U.S.
    whyItMatters: >-
      Current official datasets are individually strong, but they mix slightly different scopes and dates, which limits
      the precision of combined market math.
    diligencePath: Normalize all animal counts to matching cattle classes and dates before using them in valuation models.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: stale
    severity: material
    topic: adoption-stage
    missingEvidence: >-
      Longitudinal public data showing how quickly early virtual-fencing deployments convert from pilots to full-ranch
      production usage.
    whyItMatters: >-
      The category is still described as early adoption, so scaling assumptions need evidence on conversion and
      durability, not just interest.
    diligencePath: Collect multi-year deployment case studies from vendors, universities, and public-land programs.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: entrant-scale-gap
    missingEvidence: >-
      Verified deployment counts, paying-customer totals, and financing history for Corral, Drover, Collie, and
      Ranchflow.
    whyItMatters: Without scale data it is hard to separate real emerging threats from marketing-stage entrants.
    diligencePath: Request investor materials, customer references, and shipment or ARR disclosures for each entrant under NDA.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: pricing-visibility-gap
    missingEvidence: Net realized pricing, hardware subsidies, renewal terms, and churn behavior for Halter and its peers.
    whyItMatters: Competitive differentiation only matters if it holds after discounting and implementation support costs.
    diligencePath: Request price waterfalls, standard order forms, renewal schedules, and cohort retention by product line.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: channel-win-loss
    missingEvidence: Buyer-level win-loss evidence showing when incumbents like Gallagher or Merck beat specialists and why.
    whyItMatters: Distribution power is a key moat input, but current public evidence is directional rather than account-specific.
    diligencePath: Interview recent prospects, channel partners, and lost accounts across beef and dairy segments.
    relatedQuestionRefs:
      - QP019
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix-gap
    missingEvidence: Audited revenue split across hardware, recurring subscriptions, and services by geography or product line.
    whyItMatters: >-
      Without revenue mix, investors cannot model true gross-margin path or whether Halter scales like hardware,
      software, or a hybrid.
    diligencePath: >-
      Request audited management accounts with hardware, recurring software, and services segmentation plus geographic
