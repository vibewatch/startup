chapter:
  number: 2
  title: Market Analysis
  summary: Parallel sells into a real but uneven market centered on web grounding, retrieval, and search infrastructure for AI agents rather than the entire AI-software stack. Public evidence supports a multi-lens opportunity that runs from narrow retrieval budgets to broad agent-platform spend, with the most credible near-term buyers concentrated in coding, research, enterprise AI, and legal or investigative workflows that need fresh, cited, controllable web access.
sections:
- id: market-boundary
  title: Market boundary, included spend, and status-quo substitutes
  body: 'The most defensible market boundary around Parallel is not “AI” and not even generic “search.” The common thread across Parallel’s homepage and docs, OpenAI’s agent-tool launch, Anthropic’s computer-use release, and Google’s AI Mode is that agents need a layer that can reach live information, compress it into model-usable context, and preserve enough provenance for a human to trust the answer. That means included spend is the retrieval and grounding layer: search APIs, file and web retrieval, extraction, monitoring, investigation search, and similar infrastructure that connects models to current external or authoritative sources. Excluded spend is everything that does not primarily solve the grounding problem, such as raw model inference, generic chatbot subscriptions, and broad digital-ad or consumer-search monetization pools. The substitute set is also clearer than a generic TAM slide suggests. Buyers can continue to use manual research, incumbent search interfaces, internal crawl
    or RAG stacks, or bundled model-native browsing and computer-use tools from large model vendors. Parallel therefore sits in a market defined by control, freshness, and provenance, not by aggregate AI excitement.'
