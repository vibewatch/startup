tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Parallel
  rows:
  - - Agent web search / grounding APIs
    - Web search, live retrieval, citation or provenance layers, query routing, result compression
    - Generic model inference spend and consumer chat subscriptions
    - Enterprise AI teams, developers, research leaders
    - Direct core market because it solves the live-web grounding problem
  - - Enterprise search / file search
    - Knowledge-base retrieval, document search, file indexing, enterprise-answer layers
    - Broader collaboration or storage suites with no retrieval wedge
    - IT, workplace, operations, knowledge-management owners
    - Closest incumbent budget pool and often the first comparables buyers recognize
  - - Web data extraction and monitoring
    - Structured extraction, change monitoring, entity discovery, investigation search
    - Generic ETL or data-lake tooling not purchased for agent grounding
    - Ops, risk, research, and data-platform owners
    - Important adjacent spend because many agents need data gathering before reasoning
  - - Legal / investigation grounded research
    - Premium public-records search, law or compliance research, audit-trail outputs
    - Uncited chat outputs or pure drafting tools with no retrieval authority
    - General counsel, investigators, compliance and risk leaders
    - High-value wedge because citations, trust, and defensibility carry premium willingness to pay
  - - LLM-native browsing / computer use
    - Bundled web-search, browser, or computer-use capabilities sold inside model platforms
    - Standalone search spend when buyer can accept bundled behavior
    - AI-product owners using OpenAI, Google, Anthropic or similar stacks
    - Direct substitute that compresses standalone SAM unless a buyer needs more control
  - - Outer categories to exclude
    - Only the retrieval-linked slice of agent software and workflow automation
    - All AI software, all digital advertising, all browser usage, all consumer search revenue
    - Broad software and marketing buyers
    - Useful context but too broad to treat as Parallel’s direct addressable market
  notes: Rows define the retrieval and grounding layer explicitly and keep bundled browsing plus broad AI software as context rather than direct addressable spend.
