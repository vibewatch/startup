- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Enterprise AI-agent expansion
    - driver
    - Current through 2026
    - Broadens the account base likely to test retrieval and grounding layers
    - Ask which buyer cohorts convert from pilots into recurring retrieval contracts
  - - Recurring AI budget ownership
    - driver
    - Current
    - Makes retrieval a line item instead of an innovation experiment
    - Request evidence that Parallel lands inside core IT or business-unit budgets rather than side pilots
  - - Information-overload and app sprawl
    - driver
    - Current
    - Sustains demand for search, file retrieval, and answer compression inside work
    - Test whether customer ROI is measured in analyst time saved, error reduction, or agent completion rate
  - - Citation and defensibility requirements
    - driver
    - Current
    - Favors vendors that can preserve provenance and source transparency
    - Verify whether customers use outputs in legal, compliance, or externally auditable workflows
  - - Bundled model-native browsing
    - constraint
    - Current
    - OpenAI, Google, and Anthropic can absorb part of the standalone retrieval surface
    - Measure how often buyers still need vendor-neutral retrieval after adopting native model tools
  - - Privacy, compliance, and data-governance requirements
    - constraint
    - Current
    - Raises the bar for security, retention, audit trails, and training-data promises
    - Request security architecture, retention defaults, and regulated-customer references
  - - Build-vs-buy and vendor lock-in concerns
    - constraint
    - Current through 2027
    - Some sophisticated teams may prefer internal pipelines or cheaper bundled options
    - Model the workload level where a dedicated vendor is cheaper, safer, or easier to govern
  - - Reliability limits of browser or computer-use agents
    - constraint
    - Current
    - Human oversight remains necessary for many high-stakes workflows
    - Ask where Parallel replaces rather than complements LLM-native browsing or RPA-style approaches
  notes: The rows tie every positive adoption signal to a concrete constraint or diligence question rather than treating category growth as automatically favorable to Parallel.
