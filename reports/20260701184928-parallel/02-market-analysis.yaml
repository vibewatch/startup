  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sam and som gap
    missingEvidence: Segment-level customer counts, retained query volume, and renewal behavior for Parallel across coding, research, enterprise AI, and legal workflows.
    whyItMatters: Without mix and retention data, public evidence can bound the market but cannot prove which slice Parallel actually serves durably.
    diligencePath: Request cohort retention, top-customer concentration, and segment revenue mix from management.
    relatedQuestionRefs:
    - QM026
    - QM027
    relatedTableRefs:
    - TM002
    - TM003
  - type: private-evidence-only
    severity: material
    topic: economic crossover gap
    missingEvidence: Observed workload thresholds at which buyers leave manual research, bundled search, or internal RAG for a dedicated retrieval vendor.
    whyItMatters: The investment case depends on whether dedicated retrieval becomes a repeatable budget line before a bundled model stack absorbs the workflow.
    diligencePath: Ask for customer case studies with query volumes, prior toolchain, and economic rationale for switching.
    relatedQuestionRefs:
    - QM028
    relatedTableRefs:
    - TM002
    - TM004
  - type: private-evidence-only
    severity: minor
    topic: buyer budgeting
    missingEvidence: Named examples of which function actually pays for Parallel in enterprise accounts and how that changes after pilot stage.
    whyItMatters: Bottom-up adoption may start with developers or analysts, but durable contracts usually depend on a stable budget owner.
    diligencePath: Request account-level examples covering pilot sponsor, expansion owner, and renewal owner by segment.
