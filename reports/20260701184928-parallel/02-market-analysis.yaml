callouts:
- calloutType: insight
  title: Treat market studies as lenses, not one TAM
  body: The relevant public estimates range from $1.85B RAG to $21.1B AI search today because they measure different layers of the same stack. That spread is useful boundary evidence, not a number to sum.
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM009
  - CM010
  - CM011
- calloutType: strength
  title: Citation-sensitive workflows are the best wedge
  body: Legal, investigation, coding, and enterprise platform teams value fresh context, controllable retrieval, and defensible provenance more than generic chatbot convenience, which makes them the most credible near-term buyers for Parallel-like infrastructure.
  claimRefs:
  - CM020
  - CM024
  - CM027
  - CM028
  - CM048
- calloutType: risk
  title: Bundled browsing can compress standalone SAM
  body: OpenAI, Google, and Anthropic are all embedding web search, deep research, or computer use into their core stacks. Parallel still has room where buyers need neutrality, freshness control, or auditability, but that room is narrower than the headline AI-agent market.
