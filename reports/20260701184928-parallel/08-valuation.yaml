- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable / band
  - Current public reference
  - Why it matters
  - Relevance to Parallel
  - Limitation
  rows:
  - - Exa
    - $85M Series B at $700M valuation; thousands of companies served; revenue undisclosed
    - Closest search-first AI infrastructure peer with a disclosed private mark
    - Shows Parallel carries a materially higher valuation than another AI-native search provider
    - Operating metrics are largely company-authored and revenue is not public
  - - Tavily
    - $25M Series A; 700k users; 1M monthly installs; valuation undisclosed
    - Validates broad demand for agent-grounding tools
    - Category demand is real even outside Parallel
    - Earlier stage and no public valuation or revenue
  - - You.com
    - $100M Series C at $1.5B valuation; 1B+ API calls/month; revenue undisclosed
    - Adjacent AI search and infrastructure platform with disclosed scale indicators
    - Parallel trades above this public mark despite thinner disclosed operating detail
    - Secondary coverage rather than audited company disclosure
  - - Perplexity
    - $20B valuation; ARR approaching $200M per external reporting and Sacra estimates
    - Shows what a premium AI-search valuation looks like when some revenue signal exists
    - Useful upper bound for AI-search enthusiasm and disclosure contrast
    - Consumer/search mix is broader than Parallel’s B2B agent infrastructure focus
  - - OpenRouter
    - ~$1.3B valuation; 25T tokens/week; 8M users; revenue undisclosed
    - Strong adjacent infrastructure comp around model routing and anti-lock-in
    - Parallel trades above another agent-enabling infrastructure layer with visible usage
    - Model routing is different from web-grounding and search
  - - Public software bands
    - 'June 2026: AI ~3.7x EV/revenue; data infrastructure ~5.4x; cloud infrastructure ~2.8x; BVP cloud index ~6.3x'
    - Anchors what audited public markets pay for software and infra
    - Useful discipline check on how much ARR a $2B mark implicitly needs
    - Public comps are imperfect for a private agent-web startup
  - - Filed public comp standard
    - Cloudflare, Datadog, and Snowflake all maintain current SEC reporting
    - Public comps provide audited revenue, margin, and governance disclosure
    - Highlights the information-risk discount that should apply to Parallel
    - Validates disclosure standard more than direct multiple comparability
  notes: 'Rows cover every benchmark cluster explicitly used in this chapter: AI-native search peers, adjacent AI infrastructure, public software multiple bands, and public disclosure anchors.'
  enumerationScope:
    coverage: exhaustive
    basis: Rows enumerate every comparable cluster explicitly used in the valuation call as of 2026-07-01 rather than every AI search or software company in the market.
