  evidenceGaps:
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: Current ARR or run-rate by product line, recurring-versus-usage mix, and gross margin by product.
    whyItMatters: These are the core inputs needed to judge whether the $2B mark belongs in premium software territory or ordinary infrastructure territory.
    diligencePath: Request a finance packet with product-level revenue and margin bridges plus board-approved 2026 plan assumptions.
    relatedQuestionRefs:
    - QV019
    - QV027
  - type: missing-source
    severity: material
    topic: retention-quality
    missingEvidence: NRR, GRR, customer concentration, and logo churn by major segment.
    whyItMatters: Named logos and developer adoption are not enough to underwrite durability without cohort quality and concentration data.
    diligencePath: Obtain customer-cohort analytics and top-customer exposure from management before relying on the current valuation.
    relatedQuestionRefs:
    - QV028
  - type: private-evidence-only
    severity: material
    topic: series-b-terms
    missingEvidence: Series B term sheet, secondary allocation, liquidation preference stack, and any participating or anti-dilution terms.
    whyItMatters: Headline post-money valuation can materially overstate the attractiveness of the common-equity entry price.
    diligencePath: Review the definitive financing documents and cap-table summary with counsel before making any pricing judgment.
    relatedQuestionRefs:
    - QV029
  - type: missing-source
    severity: material
    topic: content-access-economics
    missingEvidence: The share of traffic that needs special licensing, blocked-domain exposure, and the actual cost of any publisher-compensation mechanisms.
    whyItMatters: Web-access costs and restrictions can directly hit coverage quality, gross margin, and product reliability at scale.
    diligencePath: Ask product and legal teams for the current blocked-domain map, licensing agreements, and any modeled crawl- or compensation-cost assumptions.
    relatedQuestionRefs:
    - QV017
    - QV019
