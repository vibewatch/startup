- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Market need
    - Agents need fresh, grounded web context and cannot rely on static training data alone.
    - Large model vendors can bundle that retrieval layer into their own platforms.
    - Evidence that customers prefer neutral infrastructure over bundled tools at renewal.
  - - Product design
    - Parallel’s cited, compressed, agent-oriented outputs fit real production workflows.
    - Most differentiation claims are company-authored and may prove reproducible by peers.
    - Independent benchmark replication and customer-led technical references.
  - - Customer proof
    - Harvey, Opendoor, and Genpact show production value in legal, real-estate, and insurance workflows.
    - Public sources do not reveal contract size, NRR, or revenue concentration behind the logos.
    - Cohort data, reference calls, and revenue contribution by named customer.
  - - Distribution
    - 100k+ developers can become a durable top-of-funnel asset.
    - Developer scale may still be mostly free or experimental usage.
    - Paid conversion, expansion, and self-serve-to-enterprise conversion rates.
  - - Financing signal
    - Elite investors repeatedly increased exposure and added Sequoia at Series B.
    - Fast markups can front-run evidence and hide preference overhang or secondaries.
    - Term-sheet disclosure and a cleaner common-equity entry price.
  - - Web access economics
    - Publisher compensation mechanisms could align content owners with agent usage over time.
    - Anti-scraping enforcement and licensing costs could raise COGS or reduce coverage.
    - Proof of sustainable access economics and signed licensing coverage.
  notes: The anti-thesis is mostly multiple compression and evidence-quality risk, not a prediction of operational failure.
