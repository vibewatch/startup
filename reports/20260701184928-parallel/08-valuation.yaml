  - CV037
  - CV038
  - CV039
  - CV040
- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue-quality gap
    - Disclosed ARR materially below ~$100M or heavily non-recurring usage mix
    - Breaks the premium-multiple logic behind the $2B mark
    - Mark fair value down and avoid chasing the round
  - - Margin evidence
    - Gross margin below ~65% or materially rising crawl/licensing cost
    - Pushes Parallel toward infra-like rather than premium software economics
    - Compress multiple band and revisit business-model quality
  - - Retention / concentration
    - NRR below ~110% or a top customer above ~20% of ARR
    - Weakens moat and durability behind the logo set
    - Pause entry until cohort quality is clearer
  - - Platform substitution
    - Major customers shift to bundled OpenAI, Anthropic, or Google retrieval stacks
    - Shrinks SAM and questions product independence
    - Re-underwrite competitive position and churn risk
  - - Publisher access
    - New blocking or licensing regimes reduce coverage or raise content costs sharply
    - Threatens freshness, completeness, and margin at once
    - Treat as thesis break until mitigated
  - - Round terms
    - Aggressive liquidation preferences, participation, or large secondary component
    - Headline valuation no longer reflects common-share economics
    - Demand price adjustment or walk away
  notes: These are monitorable events that would change the investment call quickly, not generic operating risks.
  claimRefs:
  - CV023
  - CV024
  - CV025
  - CV032
  - CV033
  - CV047
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue bridge
    - ARR or run-rate by product, segment, and recurring vs usage mix
    - Core numerator for any valuation method
    - Finance packet and CFO walkthrough
  - - Unit economics
    - Gross margin, infra cost, crawl/licensing cost, and contribution margin by product
    - Determines whether Parallel deserves software or infra-style multiples
    - Finance + engineering review
  - - Retention and concentration
    - NRR, GRR, logo churn, and top-customer concentration
    - Tests whether named logos represent durable revenue or design-partner risk
    - Customer cohort analysis
  - - Series B terms
    - Liquidation preferences, anti-dilution, participation, and secondary allocation
    - Headline valuation may overstate common-equity attractiveness
    - Term sheet and counsel review
  - - Content access economics
    - Current licensing agreements, blocked-domain exposure, and compensation obligations to publishers
    - Core anti-thesis and COGS driver
    - Product + legal diligence
  - - Reliability and trust
    - SLA history, uptime, incident archive, and enterprise security exceptions
    - Enterprise expansion depends on trust, not just retrieval quality
    - Trust-center review and reference calls
  - - Exit preparation
    - Audit status, executive bench, governance depth, and public-company controls roadmap
    - Separates strategic-asset appeal from IPO readiness
    - Board/CFO roadmap review
  notes: Each ask is a gating item for converting this from a narrative-positive company into a priced investment decision.
