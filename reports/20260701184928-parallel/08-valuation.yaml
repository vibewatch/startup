- id: recommendation-confidence-and-entry-discipline
  title: Recommendation, confidence, risk rating, and entry discipline
  body: |-
    The recommendation is research-more. Parallel has more product and customer proof than a typical narrative-only AI round, and the company’s architecture lines up with a real agent need: grounded, current, programmatic web access. That prevents a reflexive avoid call. But the price has moved faster than the public evidence. Investors are being asked to trust premium economics without seeing revenue quality, gross margin, retention, or the true common-equity entry price underneath the Series B headline.

    That makes the valuation stance stretched and the risk rating high. The optimistic case is not impossible; it simply requires more evidence than the company has put on the table publicly. Entry discipline therefore matters more than admiration for the product. The right move is to keep the company in diligence, not to underwrite the April 2026 mark as if the financial profile were already proven. A better price, stronger disclosure, or both would materially improve the call.
