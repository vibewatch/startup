- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Indicative multiple band
  - Illustrative fair-value range (USD B)
  - Probability signal
  rows:
  - - Bull
    - Parallel is already near $120M-$160M ARR, keeps gross margin above 75%, proves 115%+ NRR, and customer proof expands beyond the current named set.
    - 12x-16x revenue
    - 1.4-2.6
    - Possible, but requires economics that are not yet public
  - - Base
    - Parallel is nearer $70M-$100M ARR, keeps healthy but not elite software margins, and faces normal pricing pressure from bundled and adjacent tools.
    - 8x-12x revenue
    - 0.6-1.2
    - Highest-probability case on current evidence
  - - Bear
    - Parallel is only $30M-$60M ARR, retention is weaker, or crawl/licensing costs keep margins below premium-software levels.
    - 4x-7x revenue
    - 0.1-0.4
    - Non-trivial if free-tier usage or platform substitution dominates
  - - Current Series B mark
    - The round prices Parallel as if it is already clearing upper-tier AI-infrastructure economics.
    - Implied ~12x-16x requires roughly $125M-$167M ARR; 6.3x requires ~$317M ARR
    - '2.0'
    - Sits near the top of the modeled bull band
  notes: Ranges are assumption-driven because Parallel has not publicly disclosed ARR, gross margin, or retention; they illustrate what the current round implies rather than a formal fairness opinion.
  claimRefs:
