- id: TI004
  title: Capital Adequacy Table
  columns:
  - Item
  - Public value / status
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Total capital raised
    - ' $230M'
    - Series A and Series B disclosures plus TechCrunch corroboration
    - Balance sheet should support continued platform and GTM investment, but not enough to infer runway alone
    - Provide post-Series-B cash balance net of transaction costs and any secondary proceeds
  - - Latest public valuation
    - ' $2.0B after April 2026 Series B'
    - Official Series B announcement and PRNewswire
    - Investors are underwriting rapid category creation and infrastructure leadership rather than disclosed current profitability
    - 'Provide internal valuation bridge: ARR, growth, gross margin, and efficiency assumptions used with investors'
  - - Planned use of funds
    - Index growth, enterprise customer expansion, deeper infrastructure, and open-web economics
    - PRNewswire and management blog
    - Capital appears directed at scale infrastructure and enterprise go-to-market, not merely brand marketing
    - Break out planned spend among infrastructure, model/vendor costs, sales hiring, and publisher/data-owner economics
  - - Cash on hand
    - 'null'
    - No public disclosure in official materials or SEC issuer filings under company name
    - Near-term adequacy cannot be measured, only inferred from fundraising size
    - Provide unrestricted cash, short-term investments, and any covenant restrictions
  - - Monthly burn / runway months
    - 'null'
    - No burn or runway disclosures in public file
    - The company may have ample runway, but the exact window is unknowable from public evidence
    - Provide current net burn, gross burn, and runway by base and downside scenarios
  - - Debt / project-finance obligations
    - No public debt or project-finance obligations disclosed
    - No issuer filing found under company name; funding materials emphasize equity rounds
    - Absence of disclosure is not proof of absence; hidden vendor commitments or financing lines could still exist
    - Disclose debt, cloud commitments, prepayments, and any financing attached to infrastructure procurement
  - - Next-round trigger
    - Likely tied to scaling index coverage, enterprise expansion, and proving durable margins rather than to a public revenue threshold
    - Inferred from stated uses of funds and lack of public revenue disclosure
    - Future financing risk depends on whether scale converts into margin and retention before cash burn re-expands
    - Share internal plan for next financing milestone or path to self-funded growth
  notes: Capital access is visible, but cash conversion, debt, and runway are not. The table therefore distinguishes disclosed financing facts from the private metrics still needed for solvency underwriting.
  claimRefs:
  - CI011
  - CI024
  - CI034
  - CI036
  - CI037
  - CI043
- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing private metric
  - Impact on analysis
  - Why it matters now
  - Exact diligence path
  rows:
  - - ARR / trailing revenue by product
    - Prevents any hard valuation multiple or growth-efficiency analysis
    - Public sources show adoption and capital raised, but not whether paid demand is large enough to justify the current step-up in valuation
    - Request monthly recurring revenue, trailing-12-month revenue, growth by API family, and revenue concentration by top 10 customers
  - - Gross margin by workload class
    - Blocks a real view on whether higher-compute agents are software-like or services-like
    - Parallel operates across search, task, monitoring, crawl, and likely external model spend; economics may vary sharply by product
    - Request GAAP gross margin plus contribution margin by Search, Task, Monitor, and enterprise deployments
  - - Cash balance, burn, and runway
    - Blocks capital-adequacy underwriting
    - The company is scaling index and enterprise operations aggressively, but public filings do not show how much balance-sheet time remains
    - Request cash, net burn, gross burn, and runway under base, growth, and stress cases
  - - Retention, ACV, and sales efficiency
    - Blocks confidence on GTM quality and payback
    - Developer count and customer logos do not prove efficient revenue expansion or durable net retention
    - Request ACV distribution, gross retention, NRR, CAC payback, sales productivity, and deal-cycle data
  - - Cloud / model vendor concentration
    - Blocks cost-stack and resiliency analysis
    - Public benchmark methodology confirms LLM and tool-call costs matter, but not which suppliers dominate spend
    - Request top infrastructure and model vendors, minimum commitments, regional concentration, and repricing sensitivity
  - - Publisher compensation / legal exposure
    - Blocks forward gross-margin and supply-side risk assessment
    - Adverse coverage shows the economics of open-web access may tighten as publishers seek compensation or consent
    - Request current publisher-payment programs, takedown disputes, indemnities, and legal budget assumptions
  - - Customer concentration and contract structure
    - Blocks downside analysis if a few large accounts drive usage
    - Named logos are helpful, but no public source reveals what share of usage or bookings comes from top customers or what contract floors exist
    - Request top-10 customer revenue share, renewal schedules, committed spend, overage structure, and termination rights
  notes: These are the missing facts that prevent the chapter from moving from informed directional judgment to full underwriting confidence.
  enumerationScope:
    coverage: partial
    basis: Rows enumerate the principal financial blind spots that remain after reviewing official pricing, funding, customer case studies, SEC search results, and comparable public-company filings.
