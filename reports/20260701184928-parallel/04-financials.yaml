tables:
- id: TI001
  title: Revenue Streams Table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Search API
    - Structured ranked web results for agent tool calls
    - Per request
    - Public list price at $0.005 for 10 results; self-serve and synchronous
    - High
    - Disclose paid-query mix by customer segment and average query volume per account
  - - Task / Deep Research APIs
    - Higher-compute multi-step research, enrichment, and workflow automation
    - Per request / processor tier
    - Publicly priced from $0.005 to $2.4 per request depending on processor tier
    - High
    - Show what share of revenue comes from premium processors versus low-cost tiers
  - - Extract and Chat APIs
    - Utility web extraction and chat-style grounded responses
    - Per request
    - Extract priced at $0.001 and Chat at $0.005 per request on list pricing
    - High
    - Provide attach rate and whether these are stand-alone revenue lines or support tools for broader contracts
  - - Monitor API
    - Continuous tracking of queries, prices, regulatory changes, and events
    - Per scheduled run / event stream
    - List priced at $0.003-$0.01 per request and docs say active monitors consume usage continuously
    - Medium
    - Quantify retained usage from long-lived monitors versus ad hoc searches
  - - Enterprise deployment / security wrappers
    - Private-cloud, on-prem, permissions, compliance, and partner-led production rollouts
    - Contracted enterprise commitment
    - FAQ discloses private-cloud and on-prem options for qualified enterprise customers, but no public minimums or pricing
    - Medium
    - Share enterprise minimum spend, implementation fees, and support terms
  notes: Public evidence shows monetization layers and list pricing, but not realized revenue mix, discounts, or contract minimums.
