- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Developer adoption base
    - '>100,000 developers'
    - Medium
    - Signals broad top-of-funnel and potential usage volume, but not monetized accounts
    - Break out paying accounts, free-to-paid conversion, and revenue concentration by cohort
  - - Named enterprise proof
    - Harvey, Notion, Opendoor, Genpact, insurers, banks, and hedge funds are named publicly
    - Medium
    - Shows the product can clear enterprise quality bars and cross regulated workflows
    - Provide ACV by segment and current number of contracted enterprise customers
  - - Workflow ROI proxy
    - Genpact reports ~50% cycle-time reduction and ~40% lower human review; Opendoor reports ~10 minutes reduced to ~2 minutes
    - Medium
    - Outcome proof supports willingness to pay and expansion inside existing accounts
    - Share realized pricing take rate against quantified customer ROI
  - - Public throughput scale
    - Homepage says the platform powers millions of daily requests
    - Medium
    - High throughput can create strong gross-profit leverage if routing and vendor costs are controlled
    - Disclose billable request mix, cache hit rates, and infrastructure cost per 1,000 requests
  - - Comparable gross-margin range
    - Cloudflare gross margin fell to 75% in 2025; Snowflake product gross margin was 72% in FY2026
    - Medium
    - Provides a realistic boundary for scaled infrastructure-heavy software, not a direct Parallel metric
    - Provide Parallel GAAP gross margin by core product and by self-serve versus enterprise workload
  - - Third-party model cost proxy
    - OpenAI lists GPT-5.5 at $5/$30 per 1M input/output tokens; Google lists Gemini 3.1 Pro at $2-$4 input and $12-$18 output per 1M tokens
    - Medium
    - Shows why model choice, cache policy, and processor routing can materially move contribution margin
    - Quantify what share of COGS comes from external model inference versus Parallel-owned crawl/index/fetch infrastructure
  - - Direct sales efficiency metrics
    - 'null'
    - Low
    - CAC payback, NRR, churn, and sales productivity determine whether heavy infrastructure spend converts into efficient recurring revenue
    - Provide CAC payback, magic number or equivalent, NRR, gross retention, and customer concentration
  notes: Public sources support throughput, pricing, and ROI proxies, but not the internal metrics required to convert those signals into true unit economics.
