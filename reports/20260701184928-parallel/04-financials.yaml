  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR, trailing-12-month revenue, revenue growth, and revenue mix by API family and customer segment.
    whyItMatters: Without actual paid revenue scale and mix, the chapter cannot test whether list pricing and customer logos translate into a durable business.
    diligencePath: Request a board-ready revenue bridge showing self-serve versus enterprise revenue, top 10 customers, and growth by product.
    relatedQuestionRefs:
    - QI005
    - QI010
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cost-stack
    missingEvidence: GAAP gross margin, contribution margin by workload class, and external model or cloud vendor cost concentration.
    whyItMatters: Parallel's valuation depends on proving that query growth compounds into software-like gross profit rather than into infrastructure-heavy pass-through costs.
    diligencePath: Request gross-margin decomposition by Search, Task, Monitor, and enterprise deployments, plus top infrastructure and model-vendor spend shares.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    - QI023
  - type: private-evidence-only
    severity: material
    topic: runway-and-burn
    missingEvidence: Cash balance, net burn, gross burn, debt, vendor commitments, and base/downside runway assumptions after the Series B.
    whyItMatters: Capital adequacy cannot be underwritten from fundraising totals alone when the company is explicitly investing in index scale and enterprise growth.
    diligencePath: Request current balance-sheet summary, monthly burn bridge, committed cloud/model spend, and a 12- to 24-month runway forecast.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI021
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-and-retention
    missingEvidence: ACV, sales cycle, CAC payback, gross retention, NRR, and customer concentration.
    whyItMatters: Named logos and developer counts are not substitutes for the repeatable GTM metrics needed to judge revenue quality and durability.
    diligencePath: Request cohort retention, sales productivity, and customer-concentration schedules, ideally split between self-serve, mid-market, and enterprise cohorts.
    relatedQuestionRefs:
    - QI006
    - QI007
    - QI008
    - QI022
  - type: missing-source
    severity: material
    topic: publisher-economics
    missingEvidence: Concrete disclosure of publisher-payment programs, content-owner economics, takedown disputes, and any legal reserves tied to scraping or licensing.
    whyItMatters: If content access becomes more expensive or more restricted, future gross margins and growth assumptions could change materially.
    diligencePath: Request management's current policy, contractual obligations, and forecast cost assumptions for publisher compensation or litigation exposure.
    relatedQuestionRefs:
    - QI019
    - QI020
