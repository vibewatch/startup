- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Source / product
  - Price / unit / contract
  - List vs realized
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Pricing page free tier
    - Up to 16,000 requests for free
    - List signal only
    - Developer onboarding across API catalog
    - No information on overage conversion or expiration
    - Supports low-friction product-led entry and experimentation
  - - Task API
    - ' $0.005-$2.4 per request'
    - List signal only
    - Deep research, structured enrichments, workflow automation
    - Processor mix and enterprise discounts undisclosed
    - Higher-compute workloads can materially lift revenue per successful production use case
  - - Search API
    - ' $0.005 for 10 results'
    - List signal only
    - Ranked URLs and compressed excerpts for agent search calls
    - No public committed-spend terms
    - Very low unit price favors high-volume adoption over high ticket size per call
  - - Extract API and Chat API
    - ' $0.001 and $0.005 per request'
    - List signal only
    - Page extraction and grounded chat outputs
    - Unknown bundling into broader enterprise deals
    - Utility APIs likely support adoption and expansion more than they define overall account value
  - - Monitor API
    - ' $0.003-$0.01 per request'
    - List signal only
    - Ongoing event-stream or snapshot monitoring
    - No disclosure on minimum cadence or webhook surcharges
    - Recurring schedules can compound usage inside deployed workflows
  - - Qualified enterprise deployments
    - Private-cloud / on-prem and enterprise governance options
    - Realized contract terms not public
    - Security, permissions, deployment control, and regulated use cases
    - No public rate card or professional-services disclosure
    - Parallel almost certainly runs a sales-assisted enterprise lane above self-serve pricing
  notes: This table distinguishes published list pricing from the hidden realized economics that would depend on workload mix, volume, and enterprise contracting.
