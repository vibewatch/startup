  - id: FE002
    title: Parallel 驱动 agent 的客户工作流 / 运行流程
    type: flow
    layout: wide
    summary: Parallel 把 agent 的网络工作拆成发现、抽取、研究、数据集构建和监控几步，而不是一次无差别搜索调用。
    data:
      nodes:
        - id: n1
          label: Agent 收到目标
          detail: 当前事实回答、尽调任务、实体列表或观察清单请求
          type: start
        - id: n2
          label: Search 为目标提供事实锚点
          detail: 目标驱动调用返回压缩摘录和 URL
          type: step
        - id: n3
          label: Extract 规范化目标 URL
          detail: 从网页、PDF 和 JS 密集站点提取完整 markdown 或聚焦摘录
          type: step
        - id: n4
          label: Task 运行异步研究
          detail: 排队的深度研究或富集任务在后台继续
          type: step
        - id: n5
          label: FindAll 构建实体集
          detail: 自然语言条件生成已验证候选，并补充富集信息
          type: step
        - id: n6
          label: Monitor 调度变更检测
          detail: event_stream 或 snapshot Monitor 在变更时发送 webhook 事件
          type: step
        - id: n7
          label: Agent 返回带引用输出
          detail: 答案、数据集或后续工作流在下游复用 Parallel 产物
          type: end
      edges:
        - from: n1
          to: n2
          label: 需要当前事实锚点
        - from: n2
          to: n3
          label: 抓取特定页面
        - from: n2
