    rows:
      - - Exa
        - $7/1k 次搜索；$1/1k 页；每次智能体运行 $0.012-$2.00
        - 按用量计费，企业定价另议
        - 搜索、内容提取、深度搜索、监控、智能体
        - 实际企业定价未披露
        - 能力覆盖广，但主打搜索费率不是最低
      - - Tavily
        - 1,000 个免费点数；随用随付 $0.008/点
        - 点数模式，配月度或企业计划
        - 搜索、提取、映射、爬取、研究
        - 实际企业折扣未披露
        - 开发者友好的入口，成本随工作流深度变化
      - - Serper
        - 规模化后从 $1.00/1k 降至 $0.30/1k
        - 预付充值点数
        - 多模式 Google 结果访问
        - 留存材料中没有公开企业控制细节
        - 买方主要想要原始 Google 结果时，这是最低成本路径
      - - SerpAPI
        - 每月免费 250 次；1k $25；5k $75；15k $150；30k $275
        - 月度订阅层级加企业方案
        - 广泛 SERP 覆盖和保证吞吐
        - 企业定价定制
        - 广度和可靠性比检索抽象更重要时最适合
      - - Brave Search API
        - $5/1k 请求；答案 API $4/1k 查询，另加 token 费用
        - 按用量计费加企业计划
        - 独立索引搜索、LLM 上下文、答案 API
        - 企业条款定制
        - 介于低价 SERP 转售和更高层研究平台之间
      - - You.com API（搜索 API）
        - $5/1k 次网页搜索调用；$1/1k 页；更高研究层级价格更高
        - 多个 API 按用量计费
        - 产品：Web Search、Contents、Research、Finance Research
        - 研究层级经济性和企业折扣不完全可见
        - 以平台组合而不是单一端点竞争
      - - Perplexity API
        - 每次 web_search $0.005；每次 fetch_url $0.0005，另加 Sonar 模型定价
        - 工具收费加模型 token 定价
        - Agent API、Sonar、搜索和抓取工具
        - 总混合成本取决于模型组合
        - 答案中心型工作流按单次工具调用看似便宜，但仍背负模型支出
      - - OpenAI 内置搜索
        - 所引用发布显示，search-preview 查询每千次 $25-$30；定价页列出捆绑工具费率
        - 捆绑在 Responses API 和工具使用中
        - 网页搜索、文件搜索、计算机使用、Agents SDK
        - 总成本取决于 token 和更广的平台用量
        - 对 OpenAI 优先团队便利，但缩窄模型选择
      - - Azure 托管 / Google 传统路线
        - Google：现有客户每天 100 次免费查询，之后每 1,000 次 $5，每天最高 10k；Azure 定价嵌在 Foundry 智能体费用中
        - 受限传统定价或托管栈定价
        - 可编程搜索或托管事实锚定
        - 迁移、退场和合规复杂度让直接比较并不完美
        - 这些是兜底或既有路线，不是干净的专用搜索替代品
