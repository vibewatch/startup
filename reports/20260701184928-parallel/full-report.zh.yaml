    rows:
      - - Exa
        - 直接 AI 原生同业
        - $85M B 轮，估值 $700M；数千家公司
        - 编码智能体、研究、PE / 咨询、企业团队
        - AI 原生搜索，覆盖全页内容、深度搜索、监控、智能体运行、ZDR
        - 标价高于低价 SERP 工具；主张高度依赖公司和投资方来源
      - - Tavily
        - 直接 AI 原生同业
        - 融资 $25M；声称用户 700k+、月安装 1M+
        - 开发者、研究智能体、GTM、法律 / 反欺诈工作流
        - 按点数计费的搜索，加上提取 / 映射 / 爬取 / 研究；PLG 叙事强
        - 留存证据中，公开合规和企业控制披露较少
      - - You.com API（搜索 API）
        - 答案 / 研究平台同业
        - 留存来源未披露规模；多产品 API 平台
        - 需要事实锚定网页、内容和研究 API 的开发者
        - Web Search + Contents + Research + Finance Research，带 SOC 2 和不用于训练承诺
        - 抽象层更高，因此比传统 SERP 供应商更少强调原始结果控制
      - - Perplexity API
        - 答案 / 研究平台同业
        - 留存来源未披露规模；定位为 Agent API + Sonar
        - 构建答案中心型智能体和研究工作流的开发者
        - 兼容 OpenAI 的 Sonar，加上 web_search 和 fetch_url 工具定价
        - 公开定价拆在模型层和工具层，直接比较会更复杂
      - - Brave Search API
        - 传统 / 邻近搜索基础设施
        - 公开定价加企业计划；声称拥有独立索引
        - 注重隐私的智能体、聊天机器人、搜索功能
        - 独立索引、$5/1k 请求、答案 API、企业计划提供 ZDR
        - 深层工作流抽象证据少于 Exa、Tavily、You 或 Perplexity
      - - Serper
        - 低价 SERP 替代品
        - 2,500 次免费查询；充值定价最低 $0.30/1k
        - 需要廉价 Google 式结果的构建者
        - 覆盖多种结果模式的快速低价 Google SERP 访问
        - 相比控制更强的同业，公开信任 / 企业披露很少
      - - SerpAPI
        - 广度 / 可靠性 SERP 替代品
        - 从免费到企业层级；保证吞吐并覆盖多种搜索场景
        - 需要广泛 SERP 覆盖和稳定运营的开发者
        - 广度、可靠性、ZeroTrace 和公开认证
        - 仍依赖上游搜索生态，层级低于证据优先型智能体工具
      - - Google Custom Search
        - 现状传统选项
        - 每天 100 次免费查询；已停止接纳新客户；现有用户到 2027 年完成迁移
        - 现有以 Google 为中心的网页搜索集成
        - 从可编程搜索引擎简单取回 JSON
        - 无新客户、每天 10k 上限和退场路径限制战略相关性
      - - Azure Grounding with Bing（Bing grounding 服务）
        - 托管事实锚定替代品
        - 仅在更广的 Azure 智能体栈和付费订阅内可用
        - 使用 Foundry 智能体、Azure 优先的企业团队
        - 带引用和智能体集成的托管事实锚定
        - 无原始内容、合规边界分离、托管工具复杂度高
      - - OpenAI / Anthropic 捆绑工具
        - LLM 原生替代品
        - 规模由模型平台决定，而不是检索 SKU
        - 已标准化到单一模型供应商的团队
        - 内置网页搜索、引用、浏览器 / 计算机使用工作流
        - 造成供应商锁定，且可调性可能弱于专用检索层
      - - 内部自建
        - 现状替代品
        - 经济性取决于内部团队产能和所选 API
        - 成熟平台团队和成本敏感型构建者
        - 可针对具体工作负载优化，并在多个供应商间多栖
        - 把可靠性、评估和治理负担转嫁给客户
    notes: 规模或融资单元格只反映留存的公开证据。空白或定性描述表示该供应商在本来源集中披露不足，无法给出更精确数字。
