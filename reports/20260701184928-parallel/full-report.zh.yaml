      - - OpenRouter
        - ~$1.3B 估值；每周 25T tokens；8M 用户；收入未披露
        - 围绕模型路由和反锁定的强相邻基础设施可比对象
        - Parallel 的估值高于另一层可见使用量的 agent 赋能基础设施
        - 模型路由不同于 web 事实锚定和搜索
      - - 公开软件区间
        - 2026 年 6 月：AI ~3.7x EV/revenue；数据基础设施 ~5.4x；云基础设施 ~2.8x；BVP 云指数 ~6.3x
