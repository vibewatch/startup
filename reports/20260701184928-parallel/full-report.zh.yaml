              Extract 增加基础和高级模式并扩大检索覆盖，Search MCP 免费化，面向终端智能体的 CLI 分发上线，以及 Vercel 分发扩展到完整 API 产品线。按工作流看，Parallel 相比传统搜索
              API 最清晰的差异化，在于它围绕智能体任务打包检索：Search 做有事实锚点的答案，Extract 做 URL 规范化，Task 做异步深度研究，FindAll 做实体数据集创建，Monitor
