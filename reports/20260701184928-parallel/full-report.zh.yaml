        title: 信任、隐私和可靠性控制
        blocks:
          - type: paragraph
            body: >-
              Parallel 在产品和文档界面直接发布了几类信任信号，但深度不均。正面看，公开页面宣传零数据留存、SOC 2 Type 2 认证和不用于训练。隐私政策在 2026 年 6
              月下旬更新，包含数据安全、留存、披露和广告控制章节。FAQ 材料还划清公开 Web 和私有数据的边界，称 Parallel 不会原生拉取私有数据，除非客户明确把私有数据传入任务。Web
              获取本身也有明确操作要求：爬虫文档说明了如何在 robots.txt 和指定 IP 范围中允许 ShapBot，这让爬取权限成为明确的运营依赖。可靠性可见度更薄：审阅时公开状态页为绿色，但审查材料没有发布公开
              SLA、错误预算或历史事故档案。企业尽调可以把公司的头部控制视为真实信号，但还不能用它替代完整信任中心包和端点级留存矩阵。
