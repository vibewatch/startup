      - number: '6.3'
        title: 采购摩擦、控制和实施现实
        blocks:
          - type: paragraph
            body: >-
              案例显示，采购摩擦真实存在，而且随客户而变。Opendoor 买的不是抽象搜索；上线生产前，它要求 SOC 2 Type 2、SSO、细粒度权限、数据保护控制，以及在最难 HOA 案例上的证明。Harvey
              的上线在工作区管理员层面可选，并强调来源排序、精确引用片段、URL 范围限定和仅在美国处理。Genpact
              的保险公司实施又加了一层：明确业务规则、零售商排除、置信度分数，以及把低置信度结果路由给人类。这些都是典型企业采用信号，因为它们显示 Parallel
              是作为受监管或准确性关键运营中的受控子系统被采购，而不是无人监管的新奇功能。


              同一证据也限制了 Parallel 在单个客户内部扩散的速度。需要引用、权限和人工审核兜底的工作流，通常要穿过平台、安全和领域负责人等利益相关方，而不是靠单个开发者刷卡。Parallel
              自己的文档和补全材料也强化了这种姿态，把引用、置信度分数和来源链路放在一阶产品输出位置。这支持企业信任，但也意味着扩张前需要集成工作、利益相关方评审和治理开销。因此，公开证据支持生产就绪和运营价值，同时也暗示客户扩张取决于实施能力和控制要求，而不只是模型质量。
