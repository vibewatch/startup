        - label: 经济性可见度
          value: 2
          unit: /10
        - label: 竞争强度
          value: 4
          unit: /10
        - label: 估值纪律
          value: 3
          unit: /10
        - label: 证据质量
          value: 4
          unit: /10
    approximationNotes: 分数是基于本章所审阅公开证据的定性判断，不是管理层提供的评分卡。
