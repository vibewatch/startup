        - 运行 event_stream 或 snapshot 监控，并发出变更事件
        - 调度器可靠性、webhook 交付和任务串联
        - 没有面向企业可靠性审查的公开 SLA 或事故归档
      - - 集成与认证入口
        - 通过 CLI、MCP、SDK 和合作伙伴插件分发能力
        - OAuth 端点、API key、合作伙伴运行时和包注册表
        - 合作伙伴客户端行为一变，开发者体验可能中断或降级
      - - 爬虫 / AI 格式指引
        - 鼓励发布方配置 llms.txt 和 ShapBot 放行规则，让内容更适合模型使用
        - 配合爬虫和格式指引的开放网页发布方
