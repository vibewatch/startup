  - id: FE001
    title: Parallel 产品架构图
    type: stack
    layout: wide
    summary: 分层展示 Parallel 如何把开放网络内容路由到适配 agent 的产品、集成和 AI 优化格式。
    data:
      layers:
        - label: 面向 agent 的工作流界面
          modules:
            - Search（有据检索）
            - Extract（URL 转 markdown）
            - Task（异步深度研究）
            - FindAll（实体发现）
            - Monitor（定时变更检测）
        - label: 交付与控制界面
          modules:
            - CLI + agent 技能
            - MCP 端点（API key 或 OAuth）
            - SDK / 原生工具调用
            - Vercel AI Gateway
            - Pi 和 OpenCode 插件
        - label: 检索与规范化层
          modules:
            - 语义目标解析
            - token 相关性排序
            - 摘录压缩
            - 为网页、PDF 和 JS 密集站点转换 markdown
        - label: 抓取、索引与调度基础设施
          modules:
            - 网络规模抓取 / 索引
            - 重抓取新鲜度策略
            - Task 队列 / 交互状态
            - Monitor 调度器和 webhook 投递
        - label: 发布方与 AI 格式边界
          modules:
            - ShapBot 爬虫访问
            - robots.txt / IP 允许规则
            - llms.txt markdown 映射
            - 开放网络发布方内容
