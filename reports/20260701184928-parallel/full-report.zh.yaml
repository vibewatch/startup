      - number: '8.4'
        title: 建议、置信度、风险评级和入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议是继续研究。相比典型只讲叙事的 AI 融资，Parallel 有更多产品和客户证明；公司的架构也对准一个真实的 Agent 需求：有出处、够新鲜、可程序化的 Web
              访问。这使得投资人不该条件反射式回避。但价格涨得比公开证据更快。投资人被要求在看不到收入质量、毛利率、留存，或 Series B 标题之下真实普通股入场价格的情况下，相信公司有溢价经济性。


              因此，估值立场偏紧，风险评级高。乐观情景并非不可能；它只是需要比公司公开摆出的证据更多的支撑。入场纪律因此比产品好感更重要。正确动作是继续尽调，而不是把 2026 年 4
              月估值当作财务画像已经被证明来承销。更好的价格、更强的披露，或两者兼有，都会实质改善判断。
