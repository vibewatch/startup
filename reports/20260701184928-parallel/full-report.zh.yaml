  - id: TI003
    title: 单位经济表
    columns:
      - 指标
      - 数值 / 公开代理指标
      - 置信度
      - 重要性
      - 尽调问题
    rows:
      - - 开发者采用基础
        - '>100,000 名开发者'
        - 中
        - 显示漏斗顶部很宽、潜在用量大，但不等于已变现账户
        - 拆分付费账户、免费转付费转化，以及按同期群拆分的收入集中度
      - - 具名企业验证
        - Harvey、Notion、Opendoor、Genpact、保险公司、银行和对冲基金均被公开点名
        - 中
        - 说明产品能通过企业质量门槛，并切入受监管工作流
        - 按细分披露 ACV，以及当前签约企业客户数量
      - - 工作流 ROI 代理指标
        - Genpact 报告周期时间约降 50%、人工审核约降 40%；Opendoor 报告约 10 分钟缩短到约 2 分钟
        - 中
        - 结果证据支撑付费意愿，也支撑在现有账户内扩张
        - 披露已实现定价对量化客户 ROI 的捕获率
      - - 公开吞吐规模
        - 官网称平台每天支撑数百万次请求
        - 中
        - 如果路由和供应商成本受控，高吞吐可带来强毛利杠杆
        - 披露可计费请求组合、缓存命中率和每 1,000 次请求的基础设施成本
      - - 可比毛利率区间
        - Cloudflare 毛利率在 2025 年降至 75%；Snowflake 产品毛利率在 FY2026 为 72%
        - 中
        - 为规模化、基础设施较重的软件给出现实边界，不是 Parallel 的直接指标
        - 提供 Parallel 按核心产品、自助式与企业工作负载拆分的 GAAP 毛利率
      - - 第三方模型成本代理指标
        - OpenAI 列示 GPT-5.5 每 1M 输入 / 输出 tokens 为 $5/$30；Google 列示 Gemini 3.1 Pro 每 1M tokens 输入 $2-$4、输出 $12-$18
        - 中
        - 说明模型选择、缓存策略和处理器路由为何能显著影响贡献毛利
        - 量化 COGS 中有多少来自外部模型推理，相比 Parallel 自有爬取 / 索引 / 抓取基础设施
      - - 直销效率指标
        - 'null'
        - 低
        - CAC 回收期、NRR、流失率和销售产能决定重基础设施投入能否转化为高效经常性收入
        - 提供 CAC 回收期、magic number 或同等指标、NRR、总留存和客户集中度
    notes: 公开来源支撑吞吐、定价和 ROI 代理指标，但缺少把这些信号转成真实单位经济所需的内部指标。
