      - number: '1.2'
        title: 创始人、治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Parag Agrawal 是 Parallel 故事里最核心的人物事实。公开报道持续把公司描述成他的后 Twitter
              事业，本次审阅的来源没有浮现另一位同等可见的高管声音。早期基础设施公司出现这种集中度不难理解，但它很重要：创始人声誉、招募能力和客户信任都异常绑定在一个人身上。一个备案信息镜像还给出另一位具名运营者——CFO
              Olin T Nisbet——但 Agrawal 之外的公开高管深度仍然稀薄。招聘页显示组织确实在扩张，却没有展示一支广泛、具名的领导班子。


              治理在投资人侧比在管理层侧更可见。Series A 材料列出 Mamoon Hamid、Vinod Khosla、Shardul Shah 和 Josh Kopelman 等董事会层面的投资人，Series B
              又加入 Sequoia 的 Andrew Reed。这给 Parallel
              带来一流赞助方监督和强信号价值，但也意味着外部治理主要由财务投资人主导，而不是由充分披露的独立运营班子支撑。承销含义很直接：Parallel 有顶级资本支持，但仍带着明显关键人依赖，管理层深度的公开透明度也有限。
