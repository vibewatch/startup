      - number: '8.3'
        title: 可比公司、公开基准区间和情景范围
        blocks:
          - type: paragraph
            body: >-
              可比组同时说明两件事。第一，资本明显流向 AI 搜索和基础设施：Exa、Tavily、You.com、Perplexity、OpenRouter
              都围绕相邻问题完成了有分量的融资。第二，相对于已公开披露的信息，Parallel 的 $2B 标记偏激进。它高于 Exa、You.com 和 OpenRouter；而 Perplexity
              更高的估值至少有部分公开 ARR 背景支撑，Parallel 没有。


              公开市场数据进一步收紧纪律。Multiples.vc 2026 年 6 月的软件倍数区间，以及 Nate Lind 对 BVP
              云指数的讨论都表明，即便是不错的软件公司，退出倍数也多在中个位数到低双位数收入倍数；私营公司还要因信息风险打折。Parallel 不披露
              ARR，估值就必须建模成一组明确假设范围，而不是从已报告财务反推。在这个框架下，只有当 Parallel 已经接近高端私营 AI 基础设施的收入质量时，本轮才显得舒服；基准和悲观情景都明显低于标题估值。
