      - number: '5.3'
        title: 部署和集成路径
        blocks:
          - type: paragraph
            body: >-
              Parallel 把分发讲得异常明确。文档告诉开发者在三种部署模式中选择：当智能体已有终端访问时，用 CLI 加 Skills；当运行时是助手或 工具调用客户端时，用 MCP；当生产应用需要完全控制时，用原生
              SDK/工具调用。这个决策树重要，因为 Parallel 试图在智能体已经运行的地方接住它们。Vercel AI Gateway 可以通过单一端点，把 parallelSearch 路由到多个模型提供商。Pi 和
              OpenCode 插件把 Search 和 Extract 安装成即插即用的智能体工具。Agent Skills 把同一能力集扩展到 GitHub Copilot、Cursor、Windsurf
              和一长串编程智能体。底层公开包面已经很宽：Python SDK、parallel-cli 工具、AI SDK tools
              和插件包都已发布在公开代码仓库和包注册表。采用摩擦因此降低，但体验也取决于第三方运行时、OAuth 流程和包生态能否保持稳定。
