      - number: '2.2'
        title: 自上而下与自下而上的 TAM、SAM、SOM 视角
        blocks:
          - type: paragraph
            body: >-
              公开市场研究支持一个相邻大机会的存在，但不支持一个单一「正确」的 TAM。企业搜索是最接近的既有软件预算，比宽泛 AI 搜索定义小得多。RAG 更窄；AI 驱动的 Web
              抓取捕捉的是数据获取预算，通常位于搜索下一层。AI
              智能体市场预测则是更宽的外边界，包含远超专用检索供应商的编排层和应用层。合理读法不是把这些数字相加，而是把它们当作围绕同一新兴工作流的叠层镜头。买方视角的自下而上模型指向同一结论。一个活跃团队一旦每天跑数千次
              Web 查询，检索就会变成独立支出项，经济问题也从「有没有市场？」转向「哪些团队对专用控制的需求强到愿意另买一层？」这把最可信的 SAM 推向高强度知识工作团队，而不是大众消费搜索；在 Parallel
              披露真实分部组合和留存前，SOM 还会更窄。
