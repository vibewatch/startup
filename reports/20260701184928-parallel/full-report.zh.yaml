      - number: '4.3'
        title: 成本结构、毛利路径和资本强度
        blocks:
          - type: paragraph
            body: >-
              Parallel 自有材料暗示，它的成本栈比轻量 API 封装 更重。管理层反复把公司描述成建立在爬取、索引、检索、排序、监控和企业级可验证性之上的基础设施层；首页称平台已经支撑每天数百万次请求，基准方法也明确把
              LLM token 成本和工具调用成本计入整体经济性。文档还补充，活跃 Monitor
              每次计划运行都会消耗用量，意味着部分收入只有在重复爬取、抓取和模型工作也重复发生时才会复现。上市公司可比对象说明了为什么这件事重要。Cloudflare 2025 年 10-K
              把收入成本与网络、机房托管、折旧和支持联系起来，同时披露部分免费客户成本计入销售和营销；Snowflake 2026 年 10-K 把产品成本与第三方云基础设施、GPU、AI 推理和支持挂钩，并明确警告新 AI
              功能在规模化前可能压缩利润率。这些申报文件不是 Parallel 的经济性，但它们是有用边界标记：成熟基础设施软件可以达到 70% 出头到 75%
              左右的毛利率，但这条路依赖规模、路由效率、供应商议价能力，以及对免费或低价入口的纪律化商业化。Parallel 的公开材料尚未披露它位于这条曲线的哪个位置。
