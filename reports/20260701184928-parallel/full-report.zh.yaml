  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对分析的影响
      - 当前重要性
      - 具体尽调路径
    rows:
      - - 按产品拆分的 ARR / 往绩收入
        - 无法计算硬估值倍数，也无法做增长效率分析
        - 公开来源显示采用和融资额，但不能说明付费需求是否大到足以支撑当前估值跃升
        - 索取 MRR、过去 12 个月收入、按 API 家族拆分的增长，以及前 10 大客户收入集中度
      - - 按工作负载类别拆分的毛利率
        - 无法判断算力更高的智能体到底像软件，还是像服务
        - Parallel 覆盖搜索、任务、监控、爬取，以及可能的外部模型支出；各产品经济性可能差异很大
        - 索取 GAAP 毛利率，以及 Search、Task、Monitor 和企业部署的贡献毛利率
      - - 现金余额、烧钱和 runway
        - 阻断资本充足性承销
        - 公司正在激进扩张索引和企业运营，但公开文件没有显示资产负债表还剩多少时间
        - 索取现金、净烧钱、总烧钱，以及基准、增长和压力情景下的 runway
      - - 留存、ACV 和销售效率
        - 无法判断 GTM 质量和回收期
        - 开发者数量和客户 logo 不能证明收入扩张高效或净留存耐久
        - 索取 ACV 分布、总留存、NRR、CAC 回收期、销售产能和成交周期数据
      - - 云 / 模型供应商集中度
        - 阻断成本栈和韧性分析
        - 公开基准方法确认 LLM 和工具调用成本重要，但没有说明哪些供应商主导支出
        - 索取主要基础设施和模型供应商、最低承诺、区域集中度和重新定价敏感性
      - - 出版商补偿 / 法律敞口
        - 阻断前瞻毛利率和供给侧风险评估
        - 负面报道显示，随着出版商寻求补偿或同意，开放网络访问的经济性可能收紧
        - 索取当前出版商付款计划、下架争议、赔偿责任和法律预算假设
      - - 客户集中度和合约结构
        - 如果少数大账户驱动用量，就无法做下行情景分析
        - 具名 logo 有帮助，但公开来源没有说明头部客户贡献多少用量或 bookings，也没有说明合约底线
        - 索取前 10 大客户收入占比、续约时间表、承诺消费、超额结构和终止权
    notes: 这些缺失事实，使本章还只能停在有依据的方向性判断，无法进入完整承销信心。
    enumerationScope:
      coverage: partial
      basis: >-
        Rows enumerate the principal financial blind spots that remain after reviewing official pricing, funding,
        customer case studies, SEC search results, and comparable public-company filings.
