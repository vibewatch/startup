  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式和定价信号
        blocks:
          - type: paragraph
            body: >-
              Parallel 的公开变现材料在包装上远强于已实现收入。定价页展示了真正的自助入口：最高 16,000 次免费请求，之后 Task、Search、Extract、Chat、Monitor 和 Find All
              API 采用按量付费。公司首页进一步强化这个框架，承诺成本可预测、按 query 而不是按 token 付费；FAQ
              则说明价格基于用量，并单独披露面向合格企业客户的私有云和本地部署选项。合起来看，证据指向的产品组合是：先由开发者或小团队低摩擦采用 API，再把更高价值工作负载迁移到计算更重的 Task
              或研究产品，最后进入企业部署、安全和数据治理封装。公开材料仍看不到的是已实现组合：没有 Search 与 Task 收入拆分，没有企业最低承诺，没有折扣模式，也没有披露
              Monitor、客户专属部署或出版商经济性功能是否产生独立收入线。因此，收入模式的机制可见，但美元构成尚不可见。
