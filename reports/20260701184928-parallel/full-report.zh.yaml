      - number: '1.4'
        title: 里程碑、合作关系和不利的 Web 访问摩擦
        blocks:
          - type: paragraph
            body: >-
              公司概览还需要一条干净时间线，供后续章节复用，而不是反复重新找日期。最强版本从 2023 年正式成立开始，然后是 2024 年 1 月种子融资、2025 年 8 月公开发布、2025 年 11 月 Series
              A、2026 年 2 月出版商问责升级、2026 年 4 月 Genpact 合作，以及 2026 年 4 月 Series B。Genpact 公告尤其有用，因为它把 Parallel
              从抽象的基础设施叙事推进到合作伙伴描述的生产环境：保险和销售工作流、所引用的结果指标，以及受监管行业客户重视新鲜 Web 研究的证据。


              时间线的不利一面同样重要。出版商和行业组织对 AI 抓取越来越敌对，而 Parallel 的整个论点恰恰依赖开放 Web 访问。Press Gazette 记录了围绕出版商防护的第三方抓取策略，MediaPost
              报道 IAB 拟议反抓取立法，The Current 描述了上升的 bot 活动和不断升级的出版商抵抗。Parallel
              的答案是一个补偿内容所有者的「开放市场机制」，但还没有公开来源显示这个机制已规模化商业采用。因此，投资人应把 Web 访问经济性和出版商关系当作核心尽调问题，而不是附注。
