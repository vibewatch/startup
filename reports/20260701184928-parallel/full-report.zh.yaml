chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位、产品和公司版图
        blocks:
          - type: paragraph
            body: >-
              Parallel 最清晰的身份不是「又一家基础模型公司」，而是一家软件基础设施供应商，试图让 AI 智能体用得上实时 Web。官方页面描述的技术栈覆盖搜索、抽取、深度研究、聊天、监控和数据集构建
              API，核心不是人类浏览，而是证据、时效性和机器可用输出。这个定位对尽调重要，因为它的商业模式是卖给开发者和企业的 API
              软件，不是靠广告变现的消费级入口。定价页、文档和产品页进一步说明：公司按请求变现，用免费层级种下开发者采用，再用价格更高的研究处理器服务更复杂的工作流。


              公司的物理足迹比产品野心窄。公开可支撑的地点证据集中在 Palo Alto；招聘页和备案相关记录也能看到 San Francisco 办公室或邮寄地址。创立时间线没有那么干净：一份 2023 年备案和多篇
              2025 年新闻报道把正式成立追溯到 2023 年，而 2024 年 1 月是首个明确披露的融资节点，因此也是最早被广泛看见的运营路标。后续章节复用时，最稳妥的表述是：2023 年正式成立，2024
              年融资后开始建设，而不是把来源无法支撑的单一日期说成整齐答案。
