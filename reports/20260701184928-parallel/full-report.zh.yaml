  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局、同侪组和真正与 Parallel 竞争的对象
        blocks:
          - type: paragraph
            body: >-
              Parallel 不是在一个扁平的「搜索 API」市场里竞争。最接近的直接同侪是 Exa 和 Tavily，因为两者都销售 AI 原生检索栈，把实时 Web
              搜索与更丰富的智能体工作流、研究或抽取层结合起来。You.com API 和 Perplexity
              也重要，但它们在栈里略高一层：两者把产品包装成更宽的答案或研究平台，而不只是原始检索原语。再往下是传统管道层——Serper、SerpAPI、Brave Search API、Google Custom
              Search 和 Microsoft 基于 Bing 的工具——它们仍能为愿意自建编排的团队完成任务。再往上和旁边，是 OpenAI 和 Anthropic 的捆绑替代品，它们现在把 Web 访问、引用，甚至
              computer use 压进模型平台功能。结果是一个分层格局：Parallel 很少只靠「有搜索」取胜。只有当买方认定出处、模型中立和检索控制足够重要，值得单独购买一层，而不是用更便宜的 SERP
              管道、更高层的答案引擎，或现有模型合同里的捆绑工具时，它才会赢。
