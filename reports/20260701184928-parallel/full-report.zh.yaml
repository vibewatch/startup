  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 按智能体工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Parallel 卖的不是单个通用搜索端点，而是面向 AI 智能体的工作流路由器。技术栈拆成五类主要任务。Search 接受自然语言目标，返回密集、带引用的摘录，而不只是 SERP
              链接，用一次往返完成实时事实锚定。Extract 负责定向页面检索，把特定公开 URL——包括 JavaScript 较重的页面和 PDF——转换成可直接放入模型上下文窗口的 markdown。Task
              是长时运行的研究和补全层：把 Web 搜索、爬取和推理打包成异步运行，可持续数秒到数小时。FindAll
              是数据集构建界面，把自然语言条件转换成经过验证的公司、人物或其他实体集合，并附上结构化补全和引用。Monitor 则把模型从拉取改成推送，把 query 或 Task 输出变成带 webhook
              交付的定期变更检测任务。
