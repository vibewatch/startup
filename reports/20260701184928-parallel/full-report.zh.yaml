  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Parallel 方案
      - 可衡量收益
      - 局限
    rows:
      - - 用当前事实支撑单个答案
        - 发起多次关键词搜索、打开页面，再手工为模型压缩证据
        - Search API 通过一次目标驱动调用返回面向 LLM 优化的摘录
        - 搜索跳转更少，上下文窗口里的 token 浪费也更少
        - 结果质量仍取决于爬取新鲜度和公共网页可访问性
      - - 抓取已识别页面的精确内容
        - 临时写爬虫，或把原始 HTML 发给模型
        - Extract 将目标 URL 转成干净 markdown，并可选返回聚焦摘录
        - HTML 清理更少，PDF / JS 页面处理更好
        - Extract 不会自行发现页面
      - - 跑深度尽调或丰富化
        - 人工研究员或定制工作流逐步调度搜索、抽取和综合
        - Task 把网页搜索、爬取、推理和异步执行打包成可复用运行
        - 研究可在后台继续，并嵌入生产运营
        - 处理器栈和成本质量取舍仍部分不透明
      - - 从零构建列表
        - 手工搜索、筛选、去重，并在全网丰富化实体
        - FindAll 把自然语言条件转成带丰富化和引用的已验证候选集
        - 更快为版图梳理、拓客或格局研究创建数据集
        - 基准和召回率主张由营销主导，并非独立结论
      - - 长期跟踪网页变化
        - 手工重跑搜索，或临时轮询来源
        - Monitor 创建带 webhook 和 Task 跟进的计划式变化检测任务
        - 为新闻、监管和竞争观察清单推送更新
        - 公开文档未量化误报率或可用性承诺
      - - 把网页情报装进编码智能体
        - 为每个模型 / 运行时手写工具适配器
        - CLI、MCP、Pi、OpenCode、Vercel 和 Agent Skills 提供预建入口
        - 部署时间更短，胶水代码更少
        - 每条路径都会增加对外部客户端、市场或认证流程的依赖
    notes: 收益概括的是工作流试图减少的任务量，并非经审计的 ROI 数字。局限区分每个界面本身解决不了的问题。
