      - number: '3.2'
        title: 按供应商类别拆分的能力、定价和信任姿态
        blocks:
          - type: paragraph
            body: >-
              买方选择集可以按供应商优化目标清楚切开。Exa 和 Tavily 是最直接的 AI 原生同侪：Exa 强调整页内容、深度搜索、智能体运行、自定义索引和 Zero Data Retention；Tavily 则偏向
              PLG 采用、适合引用的研究工作流，以及搜索—抽取—映射—爬取—研究的宽工具包。传统 SERP 供应商在某些情况下仍更便宜或覆盖更广。Serper 是低成本 Google 访问选项，SerpAPI 则以多种
              Google 界面和更强的公开合规姿态主打覆盖与可靠性。Brave 不同，因为它把标价、独立索引和明确的隐私或 ZDR 表述绑在一起。You.com 和 Perplexity
              又是另一类：它们把搜索、内容检索和答案生成包装成更高层研究产品，一些用户实施更简单，但原始控制透明度下降。信任姿态同样不均衡。Exa、SerpAPI、Brave 和 You.com 都披露了
              ZDR、ZeroTrace、SOC 2 或不训练承诺等具体公开控制。Tavily 的公开材料显示牵引很强，但在保留证据集中，信任披露更轻；如果买方是安全审查委员会，而不是单个开发者，这一点很重要。
