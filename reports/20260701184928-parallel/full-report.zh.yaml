      - number: '7.2'
        title: 溯源质量与可靠性是下一组实质运营风险
        blocks:
          - type: paragraph
            body: >-
              第二大风险层在运营和技术。Parallel 面向企业 Agent 承诺有出处、够新鲜的 Web 研究，但自家文档已经写明不可避免的取舍。FAQ 称，Task API 结果当天就能触达实时链接；低端 Search
              和 Chat 处理器则用新鲜度换延迟。Search 模式和 Search API 文档还显示，产品把结果压缩成带引用感知的摘录，而不是把原始 Web
              直接交给客户；这有利于速度，却也多了一层可能丢失细微差别、保留溯源错误的环节。可靠性披露也偏薄。公开状态页在本次报告日显示系统全部正常，但没有给出投资人评估关键任务工作流时会想看的
              SLA、故障赔付或复盘深度。外部品类证据让风险更具体：OpenAI 和 Anthropic 都称计算机使用系统仍处早期、容易出错，OpenAI 自己披露的基准也远未达到生产级完美。Parallel
              披露的缓释措施——SOC-II、加密、不用客户数据训练，以及私有云或本地部署选项——都是真措施，但不能消除答错、结果过期或事故补救风险。
