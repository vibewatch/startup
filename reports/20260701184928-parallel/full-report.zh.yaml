      - number: '6.2'
        title: 具名生产证明和结果质量
        blocks:
          - type: paragraph
            body: >-
              最好的客户证明是真实生产工作流证据，而不是客户标识陈列。Harvey 使用 Parallel，在 60 多个司法辖区内为法律推理做事实锚定，并通过管理员级选择加入流程把供应商切换暴露给客户。Opendoor
              的证明更具运营实感：Parallel 在上市公司房地产流程内自动化 HOA 研究，把研究时间从约 10 分钟降到 2 分钟，并且是在混乱的县级记录和 HOA 边缘案例上达到准确性门槛后，才赢下比测。Genpact
              的保险公司工作流同样强，因为公开记录声称已经在两家美国前 10 大 P&C 保险公司生产上线，并实现 55% 无人工处理和约 50% 更快周期时间。Profound 则把最强证明集补完整：它把 Parallel
              嵌入内容智能体，把基于研究的内容创作从数天压缩到数分钟。


              Notion 和 Clay 可支撑，但作为参考客户较弱。Notion 的 AI 负责人公开称 Parallel 能支持后台研究、分析和利益相关方工作，Notion 自己的 AI 页面也确认其智能体可跨连接应用和
              Web 运行。Clay 网站清楚展示 AI 账户研究是核心工作流，独立报道也称 Parallel 驱动其 Web 研究层。但在审阅来源集中，两家公司都没有提供 Parallel
              专属案例或量化结果。因此，投资人应把 Harvey、Opendoor、Genpact 保险理赔和 Profound 视为生产证明；Notion 和 Clay 则仍是披露深度不完整的参考客户标识。
