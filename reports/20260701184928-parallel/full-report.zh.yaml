      - number: '2.3'
        title: 买方、用户和付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图在「陈旧或薄弱上下文代价高」的场景最强。编程智能体团队已经习惯 AI 辅助，能直接受益于更好的文档检索、最新包或框架上下文，以及更低摩擦地接入现有开发者工具。GTM
              和研究智能体也天然适配，因为它们需要新鲜 Web 事实、账户研究和多来源综合，而捆绑式助手未必开放足够控制。企业 AI
              平台团队往往是组织层面的买方，掌握从试点转为经常性支出的预算，尤其在智能体编排、安全审查和多模型可移植性成为明确需求之后。法律、调查和合规敏感研究工作流尤其有吸引力，因为它们把引用、防御性、审计轨迹和数据治理承诺视为高价值。四个分层里，终端用户可能是单个分析师或构建者，但付款方通常是职能负责人或平台所有者，关心规模化的准确性、合规性或吞吐。因此，开发者或分析师采用可以自下而上启动，但持久合同通常要等团队负责人看见可复制的
              ROI 和治理故事后才落地。
