  - id: FU001
    title: 客户旅程地图
    type: journey-map
    layout: standard
    summary: Parallel 通常从痛点明显的研究工作流切入，经过安全和准确性审查；只有客户能把引用和控制运营化，才会扩张。
    data:
      items:
        - label: 工作流痛点出现
          note: 客户遇到实时网络问题，通用搜索或静态数据库不足以干净地支撑生产。
        - label: 评估启动
          note: 买方把准确性、网络覆盖、引用和集成适配度，与替代方案或内部权宜方案对比。
        - label: 安全与治理审查
          note: 管理员或平台负责人审查权限、SSO、数据控制、来源链路和人工复核路径。
        - label: 工作流比拼或受控上线
          note: Harvey 采用选择加入式启用，Opendoor 做准确性比拼，Genpact 在生产前编码业务规则。
        - label: 生产部署
          note: Parallel 成为经常性工作流里的网络研究层，例如 HOA 核查、法律研究、理赔定价或内容事实锚定。
        - label: 扩张或集中度问题
          note: 账户可能扩到更多工作流，但公开数据在续约数学、ARR 结构或头部客户集中度之前就停止了。
