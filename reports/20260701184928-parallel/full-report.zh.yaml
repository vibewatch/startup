        - Harvey、Opendoor 和 Genpact 证明，它在法律、房地产和保险工作流里有生产价值。
        - 公开资料没有披露这些 logo 背后的合同规模、NRR 或收入集中度。
        - 队列数据、客户访谈，以及按具名客户拆分的收入贡献。
      - - 分发
        - 100k+ 开发者可能成为耐久的漏斗顶部资产。
        - 开发者规模可能仍以免费或试验性使用为主。
        - 付费转化、扩张，以及自助用户转向企业客户的转化率。
      - - 融资信号
        - 顶级投资人多次加仓，Series B 又引入 Sequoia。
        - 估值快速上调可能跑在证据前面，也可能掩盖优先权负担或老股转让。
        - 条款清单披露，以及更干净的普通股入场价格。
      - - 网页访问经济性
        - 出版方补偿机制可能随时间把内容所有者与 agent 使用量对齐。
        - 反爬执行和授权成本可能推高 COGS，或缩窄覆盖范围。
        - 可持续访问经济性的证明，以及已签约授权覆盖范围。
