        title: 开放 Web 访问、平台邻近性和公开客户集中度都可能传导到收入
        blocks:
          - type: paragraph
            body: >-
              合作伙伴和依赖风险不止来自基础设施供应商；起点就是开放 Web 本身。Parallel 只能在无需认证时触达公开内容，因此发布方、平台或站点所有者一旦转向登录、API
              收费、特定爬虫规则或付费授权，检索面就会变窄。Google 的爬虫指南显示，发布方可以用细粒度控制瞄准特定爬虫和非 HTML 资源；Press Gazette 和 Axios
              也都显示，出版商反弹已不再是假设。同时，Parallel 还必须顶住相邻平台压力。OpenAI 已把 Web 搜索和计算机使用打包进自家 Agent 技术栈，Anthropic
              也在商业化类似的计算机使用能力；这提高了一个风险：核心 Agent-Web 工具可能成为大型模型平台内的功能，而不是独立采购品类。客户证明有希望，但公开视野里仍集中。TechCrunch
              只点名少数客户，并称部分金融客户仍未具名；最强的公开企业证明来自单一、高度受监管的 Genpact 合作。这足以验证需求，却不足以消除集中度或渠道风险。
