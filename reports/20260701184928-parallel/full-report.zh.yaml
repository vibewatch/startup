        - 为 Search 提供候选语料池，并支撑快速检索
        - 发布方抓取许可，加上 Parallel 的重抓取 / 索引作业
        - 如果抓取权限收窄，或重抓取策略漏掉变化快的页面，覆盖率和新鲜度会下降
      - - 语义排序 + 摘录压缩
        - 把目标转成面向模型可用性排序的高信息密度摘录
        - 检索、压缩和重排序启发式的质量
        - 公司自测基准的胜出结果，未必能泛化到所有提示分布
      - - Extract 标准化层
        - 把指定 URL、PDF 和 JS 很重的页面转成 markdown
        - 页面抓取成功率，以及按站点定制的渲染兜底
        - 没有公开拆分敌对或高度动态站点上的成功率
      - - 异步研究编排
        - 排队并管理长时间运行的 Task，以及交互状态
        - Task 处理器、后端模型和运行管理基础设施
        - 模型供应商和处理器细节未公开，成本与集中度尽调因此更难
