  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层、买方、用户和付款方
        blocks:
          - type: paragraph
            body: >-
              Parallel 的公开客户界面覆盖几类不同买方，而不是单一 ICP。Harvey 和 Notion 展示的是平台或 AI 产品团队为知识工作者购买 Web 访问；Opendoor 和 Genpact
              展示的是运营团队为准确性关键工作流购买；Profound 和 Clay 则对应需要有事实锚点的研究、而不是浏览器式搜索的营销和 GTM
              团队。几乎所有案例里，终端用户都不是经济买方。付款方通常是拥有工作流的产品、运营、创新或平台预算，下游用户则是客户自有产品或流程中的律师、知识工作者、理赔审核员、营销人员或 RevOps
              用户。这一点有吸引力，因为它拓宽了分层地图；但也意味着 Parallel 把基础设施卖给那些自身会中介终端关系的公司。最强的公开广度证据是垂直行业多样性，而不是已披露的持久收入账户数量。


              用例拆分关系到耐久性和变现。Harvey、Opendoor 和 Genpact 属于高风险工作流，引用、完整性和受控升级比便宜查询更重要。Notion 和 Clay 是更宽的智能体助手动作，Parallel
              看起来是更大系统里的一个基础设施组件；Profound 介于两者之间，是一种营销工作流，吞吐改善可衡量，但监管负担较不明显。因此，公开证据支持按买方、用户、付款方和用例划分的真实分层故事，但不支持按
              ARR、地域或合同 cohort 划分的收入分层故事。
