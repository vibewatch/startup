      - number: '1.3'
        title: 融资历史、估值轨迹与可支撑规模
        blocks:
          - type: paragraph
            body: >-
              Parallel 的资本路径现在是它最重要的身份事实之一。公开序列从 2024 年 1 月此前披露的 $30 million pre-Series-A 融资开始，到 $740 million 估值的 $100
              million Series A，再到仅约五个月后的 $2 billion 估值 $100 million Series B。既有投资人多次加仓，Sequoia 在 Series B
              进入并拿到董事会席位。这强烈说明，成熟赞助方相信公司站在智能体式 AI 的重要基础设施层上。同时，预期也被迅速抬高：这么快的估值跳升，通常意味着公司必须快速商业化扩张、证明防御性，并争夺品类领导权。


              公开规模证据有意义，但不完整。TechCrunch 报道超过 100,000 名开发者，并点名 Clay、Harvey、Notion 和 Opendoor 等客户，这比泛泛炒作更强；Parallel
              自有材料也支撑每天数百万次请求或研究任务。与此同时，来源集没有披露收入、ARR、精确的当前客户数或 2026
              年当前员工数。因此，本章后续复用应保留分裂视角：牵引信号是真实的，但完整财务承销所需的硬运营指标仍在私下。
