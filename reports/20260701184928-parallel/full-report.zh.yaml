      - number: '8.2'
        title: 围绕市场、产品、客户和风险的投资正论与反论
        blocks:
          - type: paragraph
            body: >-
              投资正论是自洽的。Parallel 不是卖通用聊天机器人；它卖的是检索、抽取、研究和监控层，让 Agent 以可控方式使用实时
              Web。公开产品材料强调带引用感知的输出、新鲜度控制，以及为上下文窗口设计的压缩摘录；Harvey、Opendoor 和 Genpact 则给出高价值工作流的具体例子，在这些场景里，把 Web
              用准很重要。正因为这种组合，公司才有理由说自己是基础设施，而不是薄封装。


              反论同样自洽。OpenAI 正把 Web 搜索、文件搜索和计算机使用打包进自家 Agent 平台，第三方评测者则把更广的趋势描述为面向 Agent 的溯源 API
              从专有护城河变成一个品类。与此同时，出版商和行业组织正在升级对 AI 爬取的反制。如果 Parallel 的毛利率依赖昂贵的爬取、抽取或未来授权付款，它可能更配基础设施或普通软件倍数，而不是稀缺的高溢价 AI
              倍数。这就是估值争议的核心。
