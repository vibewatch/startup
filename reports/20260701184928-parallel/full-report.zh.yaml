      - number: '6.4'
        title: 耐久性、集中度缺口和市场依赖
        blocks:
          - type: paragraph
            body: >-
              缺失最大的层是耐久性。Parallel 公开披露 100,000+ 开发者和一小组旗舰客户，但没有披露付费客户数、NRR、GRR、流失、合同期限、续约 批次，或按具名客户
              计算的集中度。未具名银行、对冲基金和保险公司可能具有商业意义，但外部投资人无法充分审计，难以判断收入是广泛、集中，还是仍偏设计合作伙伴。结果是，本章可以承销工作流级采用和生产证明，但不能承销账户级收入耐久性。


              不利来源强化了这种谨慎。一篇 2025 年替代方案评测认为，Parallel 在规模化时会变贵，深度研究延迟差异很大，简单查询用这个平台显得过重；更宽的 2026 年事实锚定 API 对比也显示，企业可以混用
              AI 原生或传统栈 + 解析器，而不是标准化到一家供应商。即便这些批评并不完美，它们仍凸显真实依赖风险：Parallel
              仍需要客户把其多产品基础设施标准化，而不是在工作流的部分环节用更便宜、更快或更专门的工具替代。再加上公司自撰证明占比高，续约深度、扩张数学，以及合作伙伴或渠道依赖都应成为核心尽调问题，而不是已经解决的公开事实。
