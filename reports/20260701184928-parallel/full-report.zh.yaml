  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              围绕 Parallel 最可辩护的市场边界不是「AI」，甚至也不是泛化的「搜索」。Parallel 首页和文档、OpenAI 的智能体工具发布、Anthropic 的 computer-use 发布、Google
              的 AI Mode 之间共同的主线是：智能体需要一层能力，可以触达实时信息，把信息压缩成模型可用的上下文，并保留足够的来源，让人类信任答案。纳入的支出因此是检索与事实锚定层：搜索 API、文件与 Web
              检索、抽取、监控、调查搜索，以及把模型连接到当前外部来源或权威来源的类似基础设施。排除的支出是所有不以解决事实锚定为核心的问题，比如原始模型推理、通用聊天机器人订阅，以及广义数字广告或消费搜索变现池。替代方案也比泛泛的
              TAM 幻灯片更清晰。买方可以继续使用人工研究、现有搜索界面、内部爬取或 RAG 栈，或者大型模型厂商捆绑的模型原生浏览和 computer-use 工具。因此，Parallel
              所处市场由控制力、时效性和来源链路定义，而不是由整体 AI 热度定义。
