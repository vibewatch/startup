      - number: '2.4'
        title: 增长驱动、采用约束和未解矛盾
        blocks:
          - type: paragraph
            body: >-
              增长逻辑真实存在。Cloudera、Gartner、a16z 和 BCG 都指向企业智能体采用提速、预算上升和可衡量的生产率目标。Google、OpenAI 和 Anthropic 也确认，Web
              访问、深度研究和 computer use 正在进入主流模型栈，验证了 Parallel
              所解决问题的重要性。但同一批发布也制造了核心市场约束：主要模型厂商的捆绑工具链可能吸收独立检索供应商希望捕获的一部分价值池。只有当买方需要模型中立、领域过滤、更强的新鲜度控制、更扎实的来源链路，或受监管工作流保障时，专用供应商仍然重要。即便如此，隐私、安全和人工监督要求仍是门槛。OpenAI
              自身的 CUA 基准和 Anthropic 的产品提示说明，浏览器或 computer-use
              智能体在进步，但还不可靠到可以取消监督。因此，应保留相互矛盾的估计，而不是把它们抹平：市场显然在扩张，但究竟哪一块属于专用事实锚定基础设施，公开披露仍不足。剩下最大的尽调缺口不是需求，而是这类需求有多少会变成面向
              Parallel 这样的供应商的持久、高留存支出，而不是更大模型平台里的一个功能。
            claimRefs:
