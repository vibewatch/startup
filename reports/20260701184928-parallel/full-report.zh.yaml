  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 版权、隐私和出版商访问规则是最主要的剩余风险
        blocks:
          - type: paragraph
            body: >-
              Parallel 最大的剩余风险在法律和监管：公司的产品命题正压在开放 Web 访问与权利人控制之间那条争议边界上。Parallel 自己的材料称，AI 使用 Web 的频率会超过人类；付费墙、门禁 API
              和私有数据孤岛会威胁这一未来。同时，它的爬虫文档明确要求发布方通过 robots.txt 和指定 IP 段放行
              ShapBot。只有发布方、平台和法院继续容忍这种访问模式，这套打法才跑得通。外部证据却指向相反方向：欧盟 AI Act 提高了对通用 AI 来源记录和事件治理的预期；DSM Directive
              允许权利人用机器可读方式保留文本和数据挖掘权；美国版权局正围绕授权和市场稀释问题重塑训练框架；出版商行业组织也在推动新的 2026 年反爬取立法。Parallel
              也不能把美国法当作干净保护伞。合理使用仍是高度依赖事实、看市场影响的测试；CFAA 争议仍要看具体情境；NYT v. Microsoft/OpenAI
              等进行中的诉讼说明，即便产品不是消费者聊天机器人，出版内容争议也可能长期昂贵且公开。
