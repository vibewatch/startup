        title: GTM 路径和销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              GTM 看起来是混合型：前端开发者主导，扩张阶段企业主导。官方和独立来源都指向超过 100,000 名开发者使用
              Parallel；一家不到两岁的基础设施公司能有这个自助漏斗，意义不小。但更强的变现线索来自企业和工作流结果，而不是下载量。Parallel 和 Genpact 描述了生产中的保险理赔工作流，周期时间快
              50%、人工审核减少 40%；Opendoor 案例则显示，一个 10 分钟 HOA 工作流被压缩到约 2 分钟验证。这类量化结果支持的是有预算的工作流级销售，而不是纯实验性 API
              试用。公开点名的客户组合——Harvey、Notion、Opendoor、Genpact、保险公司、银行和对冲基金——也说明 Parallel 可以从 AI 原生构建者切入，再扩展到需要
              SOC-II、权限，甚至私有云选项的受监管大客户部署。缺失的是直接效率数学：ACV、胜率、CAC 回收期、NRR、毛留存和渠道贡献均未披露，因此只能用代理指标判断销售效率，而不能用报告的单位经济性判断。
