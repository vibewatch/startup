      - number: '5.2'
        title: 技术架构和运营模型
        blocks:
          - type: paragraph
            body: >-
              Parallel 各个界面的共同运营思路，是把 Web 路由成模型原生工件。Search 围绕专有爬取 / 索引 / 排序栈构建；Parallel 称该栈覆盖数十亿页面、每天新增数百万页面，并把结果压缩成
              token 高效的摘录。Extract 位于旁边，是面向页面、PDF 和 JavaScript 较重内容的 URL-to-markdown 规范化器。Task 和 Monitor 再在检索底座上叠加编排：Task
              暴露异步运行、交互状态和非阻塞 MCP 模式；Monitor 则用 event_stream 或 snapshot monitors，在固定计划上应用同一套 Web 智能。公司也在围绕 Web 本身设计 AI
              原生接口。它的 llms.txt 指引把纯文本 markdown 地图视为模型的一等发现界面，爬虫文档要求出版商在 robots.txt 和指定 IP 范围中允许 ShapBot
              访问。结果是一套同样依赖发布格式和爬取权限、而不只依赖原始模型质量的技术栈。
