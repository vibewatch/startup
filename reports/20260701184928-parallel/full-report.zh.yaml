        blocks:
          - type: paragraph
            body: >-
              资本可得性是资产负债表叙事里最强的一部分。Parallel 的 Series A 和 Series B 公告经 TechCrunch 佐证，显示公司五个月内融资 $230 million，估值从 $740
              million 跳到 $2 billion。资金用途也很说明问题：加速索引增长、加深基础设施层、扩展企业客户。这听起来像一家仍在收入基础足以规模化自我供血之前提前投资的公司。但披露缺口很宽。SEC
              公司搜索没有显示与公司名匹配的发行人，公开材料也没有现金余额、月度现金消耗、资金续航期、债务或项目融资义务、ARR、GAAP 收入、毛利率、NRR
              和集中度指标。围绕出版商的不利报道和反抓取立法草案也提示，随着智能体 Web 市场成熟，内容访问或补偿成本可能上升。最终判断不是 Parallel
              弱，而是披露不足。收入质量看起来好过实验室试验，因为包装真实、采用真实、企业工作流证明真实。但在管理层披露组合、供应商依赖、留存和 现金消耗之前，毛利路径和资本效率仍要靠尽调判断。
