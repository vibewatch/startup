  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 公开数值 / 状态
      - 证据
      - 含义
      - 尽调问题
    rows:
      - - 累计融资额
        - ' $230M'
        - Series A 和 Series B 披露，加上 TechCrunch 佐证
        - 资产负债表应能支撑继续投入平台和 GTM，但仅凭这一点不足以推断 runway
        - 提供 Series B 后扣除交易成本和任何老股出售后的现金余额
      - - 最新公开估值
        - ' 2026 年 4 月 Series B 后 $2.0B'
        - 官方 Series B 公告和 PRNewswire
        - 投资人押注的是快速造类目和基础设施领导力，而不是已披露的当前盈利能力
        - 提供内部估值桥：ARR、增长、毛利率，以及与投资人沟通时采用的效率假设
      - - 计划资金用途
        - 索引扩张、企业客户扩展、更深的基础设施和开放网络经济
        - PRNewswire 和管理层博客
        - 资金看起来投向规模化基础设施和企业 GTM，而不只是品牌营销
        - 拆分基础设施、模型 / 供应商成本、销售招聘和出版商 / 数据所有者经济之间的计划支出
      - - 账上现金
        - 'null'
        - 官方材料或以公司名义检索的 SEC 发行人文件中没有公开披露
        - 短期充足性无法衡量，只能从融资规模推断
        - 提供不受限制现金、短期投资和任何契约限制
      - - 月度烧钱 / runway 月数
        - 'null'
        - 公开文件未披露烧钱或 runway
        - 公司可能 runway 充足，但公开证据无法知道准确窗口
        - 提供当前净烧钱、总烧钱，以及基准和下行情景下的 runway
      - - 债务 / 项目融资义务
        - 未披露公开债务或项目融资义务
        - 未找到以公司名义提交的发行人文件；融资材料强调股权轮
        - 没有披露不等于没有；隐藏供应商承诺或融资额度仍可能存在
        - 披露债务、云承诺、预付款，以及任何绑定基础设施采购的融资
      - - 下一轮融资触发点
        - 可能绑定索引覆盖扩张、企业拓展和证明毛利耐久性，而不是某个公开收入门槛
        - 根据披露的资金用途和缺少公开收入披露推断
        - 未来融资风险取决于规模能否在现金消耗重新扩张前转化为利润率和留存
        - 分享下一轮融资里程碑或走向自我造血增长的内部计划
    notes: 能看到资本获取，但看不到现金转化、债务和 runway。因此，本表把已披露融资事实与偿付能力承销仍需的私有指标区分开。
