  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Parallel 的相关性
    rows:
      - - Agent Web 搜索 / 溯源 API
        - Web 搜索、实时检索、引用或来源层、查询路由、结果压缩
        - 通用模型推理支出和消费者聊天订阅
        - 企业 AI 团队、开发者、研究负责人
        - 直接核心市场，因为它解决实时 Web 溯源问题
      - - 企业搜索 / 文件搜索
        - 知识库检索、文档搜索、文件索引、企业问答层
        - 没有检索切口的更宽协作或存储套件
        - IT、办公协作、运营、知识管理负责人
        - 最接近的既有预算池，往往也是买方首先想到的可比项
      - - Web 数据抽取与监控
        - 结构化抽取、变化监控、实体发现、调查搜索
        - 并非为 Agent 溯源采购的通用 ETL 或数据湖工具
        - 运营、风控、研究和数据平台负责人
        - 重要相邻支出，因为许多 Agent 在推理前需要收集数据
      - - 法务 / 调查类有出处研究
        - 高端公共记录搜索、法律或合规研究、审计追踪输出
        - 无引用聊天输出，或没有检索权威性的纯写作工具
        - 总法律顾问、调查人员、合规和风控负责人
        - 高价值切口，因为引用、信任和可抗辩性支撑更高付费意愿
      - - LLM 原生浏览 / 计算机使用
        - 模型平台内打包销售的 Web 搜索、浏览器或计算机使用能力
        - 买方可接受打包行为时的独立搜索支出
        - 使用 OpenAI、Google、Anthropic 或类似技术栈的 AI 产品负责人
        - 直接替代品；除非买方需要更强控制，否则会压缩独立 SAM
      - - 应排除的外围类别
        - 仅 Agent 软件与工作流自动化中与检索相关的部分
        - 所有 AI 软件、所有数字广告、所有浏览器使用、所有消费者搜索收入
        - 广义软件和营销买方
        - 可作背景，但范围太宽，不能视为 Parallel 的直接可服务市场
    notes: 各行明确界定检索和溯源层，并把打包浏览及广义 AI 软件放在背景里，而非直接可服务支出。
