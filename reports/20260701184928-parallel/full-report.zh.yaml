      - 阈值或事件
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 收入质量缺口
        - 披露 ARR 明显低于 ~$100M，或使用量结构高度非经常性
        - 打破 $2B 标记背后的溢价倍数逻辑
        - 下调公允价值，不追高本轮
      - - 毛利证据
        - 毛利率低于 ~65%，或抓取 / 授权成本明显上升
        - 把 Parallel 推向基础设施式经济性，而非溢价软件经济性
        - 压缩倍数区间，重审商业模式质量
      - - 留存 / 集中度
        - NRR 低于 ~110%，或头部客户贡献超过 ARR 的 ~20%
        - 削弱 logo 组合背后的护城河和耐久性
        - 暂停入场，等队列质量更清晰
      - - 平台替代
        - 主要客户转向 OpenAI、Anthropic 或 Google 打包检索栈
        - 压缩 SAM，并质疑产品独立性
        - 重做竞争地位和流失风险判断
      - - 出版方访问
        - 新的封锁或授权机制减少覆盖，或大幅抬高内容成本
        - 同时威胁新鲜度、完整性和毛利
        - 在缓释前视为论点破裂
      - - 融资条款
        - 激进清算优先权、参与权，或大额老股成分
        - 名义估值不再反映普通股经济性
        - 要求调价，或直接放弃
    notes: 这些是会快速改变投资结论的可监控事件，不是泛泛的运营风险。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV032
      - CV033
      - CV047
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 收入桥
        - 按产品、客群、经常性与使用量拆分的 ARR 或 run-rate
        - 任何估值方法的核心分子
        - 财务资料包和 CFO 访谈
      - - 单位经济性
        - 按产品拆分的毛利率、基础设施成本、抓取 / 授权成本和贡献毛利
        - 决定 Parallel 应拿软件倍数还是基础设施式倍数
        - 财务 + 工程评审
      - - 留存和集中度
        - NRR、GRR、logo 流失和头部客户集中度
        - 测试具名 logo 代表耐久收入，还是设计伙伴风险
        - 客户队列分析
      - - Series B 条款
        - 清算优先权、反稀释、参与权和老股分配
        - 名义估值可能高估普通股吸引力
        - 条款清单和律师审查
      - - 内容访问经济性
        - 现有授权协议、被封域名敞口，以及对出版方的补偿义务
        - 核心反方论点，也是 COGS 驱动项
        - 产品 + 法务尽调
      - - 可靠性和信任
        - SLA 历史、正常运行时间、事故档案和企业安全例外
        - 企业扩张靠信任，不只靠检索质量
        - 信任中心审查和客户访谈
      - - 退出准备
        - 审计状态、管理层厚度、治理深度和上市公司控制路线图
        - 区分战略资产吸引力和 IPO 就绪度
        - 董事会 / CFO 路线图审查
    notes: 每个问题都是门槛项：只有通过，才能把这家公司从叙事正面的标的转成可定价的投资决策。
    claimRefs:
      - CV032
      - CV033
      - CV041
      - CV042
      - CV046
      - CV048
