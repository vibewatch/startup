          label: 重定价
    claimRefs:
      - CR005
      - CR006
      - CR008
      - CR029
      - CR031
      - CR038
      - CR039
      - CR043
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Parallel 同时依赖出版方、企业渠道、公开背书客户，以及更大的 agent 平台格局。
    data:
      nodes:
        - id: parallel
          label: Parallel
          detail: 面向 AI agent 的网页搜索和研究 API
        - id: publishers
          label: 出版方 / 网站
          detail: 开放网页内容供给和爬虫访问
        - id: shapbot
          label: ShapBot
          detail: 爬虫和 IP 地址段访问要求
        - id: customers
          label: 具名客户
          detail: Clay、Harvey、Notion、Opendoor 及未具名金融客户
        - id: genpact
          label: Genpact
          detail: 受监管工作流伙伴和背书渠道
        - id: openai
          label: OpenAI / Anthropic
          detail: 相邻 agent 平台和捆绑工具
        - id: regulators
          label: 权利方 / 监管方
          detail: AI Act、隐私、版权和诉讼压力
      edges:
        - from: publishers
          to: shapbot
          label: 放行或阻断
        - from: shapbot
          to: parallel
          label: 支撑覆盖
        - from: parallel
          to: customers
          label: 服务
        - from: parallel
          to: genpact
          label: 驱动工作流
        - from: openai
          to: parallel
          label: 竞争 / 商品化
        - from: regulators
          to: publishers
          label: 塑造权利规则
        - from: regulators
          to: parallel
          label: 抬高合规门槛
        - from: customers
          to: parallel
          label: 设定可靠性预期
    claimRefs:
      - CR004
      - CR005
      - CR029
      - CR038
      - CR041
      - CR045
      - CR046
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 投资建议沿融资和客户证明推进，再经过不透明度和风险筛选，最终落到继续研究。
    data:
      nodes:
        - id: funding
          label: 估值快速抬升：约 5 个月内，从 $740M Series A 轮到 $2B Series B 轮
        - id: proof
          label: 真实验证：100k+ 开发者，以及 Harvey、Opendoor 和 Genpact 的生产工作流
        - id: product
          label: 产品切口：面向 agent、懂引用且更新鲜的网页基础设施
        - id: opacity
          label: 经济性缺口：未公开 ARR、毛利率、NRR 或客户集中度数据
        - id: risk
          label: 压缩风险：捆绑式 agent 平台、出版方摩擦，以及未知融资条款
        - id: rec
          label: 输出：继续研究、高风险、估值偏高
      edges:
        - from: funding
          to: proof
          label: 需要支撑
        - from: proof
          to: product
          label: 可由此解释
        - from: product
          to: opacity
          label: 仍撞上
        - from: opacity
          to: risk
          label: 放大
        - from: risk
          to: rec
          label: 推动
    approximationNotes: 投资决策的逻辑链条，并非财务模型。
    claimRefs:
      - CV003
      - CV005
      - CV012
      - CV029
      - CV031
      - CV043
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: $2B 估值需要多少 ARR 支撑，取决于投资人最终给 Parallel 套用哪一档收入倍数，差异会很大。
    data:
      items:
        - label: $2B，16x 收入
          value: 125
        - label: $2B，12x 收入
          value: 167
        - label: $2B，8x 收入
          value: 250
        - label: $2B，6.3x 收入
          value: 317
        - label: $2B，5.4x 收入
          value: 370
        - label: $2B，3.7x 收入
          value: 541
        - label: $2B，2.8x 收入
          value: 714
      yAxis:
        label: 支撑 $2B 估值所需 ARR（USD M）
    approximationNotes: 用公开和准公开的 2026 年基准倍数区间做简单敏感性测算：估值除以收入倍数；Parallel 尚未披露实际 ARR。
    claimRefs:
      - CV002
      - CV026
      - CV027
      - CV029
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 乐观、基准和悲观的示意估值区间显示，当前轮次多大程度上要靠高溢价经济性假设撑住。
    data:
      items:
        - label: 乐观区间
          low: 1.4
          mid: 2
          high: 2.6
        - label: 基准区间
          low: 0.6
          mid: 0.9
          high: 1.2
        - label: 悲观区间
          low: 0.1
          mid: 0.25
          high: 0.4
        - label: 当前 Series B 估值标记
          low: 1.95
          mid: 2
          high: 2.05
    approximationNotes: 这些区间不是目标价，而是在明确 ARR 和倍数假设下、受证据约束的估值带。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV046
  - id: FV004
    title: 投资 KPI
