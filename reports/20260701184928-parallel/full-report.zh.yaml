      - number: '3.3'
        title: 切换成本、多供应商并用、分发杠杆和供应商依赖
        blocks:
          - type: paragraph
            body: >-
              这个品类在结构上比核心记录系统更容易多供应商并用。大多数产品通过 API、SDK 或提示词级工具定义暴露，技术切换成本真实存在，但通常有边界。买方可以把不同工作负载路由给不同供应商，保留传统 SERP
              供应商做兜底，或把答案引擎与独立检索层搭配使用。这对客户有利，对弱护城河不利。因此，分发几乎和产品质量一样重要。OpenAI 和 Anthropic
              可以在更大的模型关系里追加销售搜索和浏览器能力；Microsoft 可以把 Azure 客户导向 Bing 事实锚定；即便 Custom Search 收窄，Google 仍拥有默认搜索心智；SerpAPI
              受益于开发者熟悉度和广泛界面覆盖。同一模式也制造供应商风险。Serper 和 SerpAPI 对上游搜索生态有实质依赖。Google 和 Microsoft
              都收紧过传统访问，证明平台所有者可以几乎不预警地重置产品边界。Parallel 只有在说服客户相信独立、模型无关的检索层比任何单一上游供应商或捆绑模型工具更稳定时，才能从这种动荡中受益。
