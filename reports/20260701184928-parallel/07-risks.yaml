- id: partner-customer-and-platform-dependencies
  title: Open-web access, platform adjacency, and public customer concentration can all transmit into revenue
  body: Partner and dependency risk is not limited to infrastructure vendors; it starts with the open web itself. Parallel only reaches public content without authentication, so every move by publishers, platforms, or site owners toward logins, API tolls, specific crawler rules, or paid licensing can narrow the retrieval surface. Google's crawler guidance shows that publishers can target specific crawlers and non-HTML resources with granular controls, and Press Gazette and Axios both show that publisher backlash is no longer hypothetical. At the same time, Parallel must defend its position against adjacent platform pressure. OpenAI now bundles web search and computer use into its agent stack, and Anthropic is commercializing similar computer-use capabilities, which raises the risk that core agent-web tooling becomes a feature inside larger model platforms rather than a standalone procurement category. Customer proof is promising but still concentrated in public view. TechCrunch names only
    a handful of customers and says some financial customers remain unnamed, while the strongest public enterprise proof comes from a single highly regulated Genpact partnership. That is enough to validate demand, but not enough to eliminate concentration or channel risk.
