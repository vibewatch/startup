  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sla-remedies
    missingEvidence: Customer-tier SLAs, uptime history, incident postmortems, service credits, and negotiated indemnity language.
    whyItMatters: Public status and marketing pages show only a thin reliability surface, so investors cannot yet size downside from outages or bad outputs.
    diligencePath: Request the standard MSA/DPA/SLA pack, last twelve months of Sev1/Sev2 incident logs, and enterprise redlines from the top ten accounts.
    relatedQuestionRefs:
    - QR014
    - QR031
    relatedTableRefs:
    - TR002
    - TR005
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue concentration, retention, top-customer ARR, bank/hedge-fund exposure, and partner-sourced pipeline share.
    whyItMatters: The public customer proof set is credible but narrow, making it impossible to tell whether valuation is supported by durable breadth or a few concentrated accounts.
    diligencePath: Ask for customer cohort tables, top-10 revenue concentration, logo-to-revenue mapping, and renewal/churn metrics by vertical.
    relatedQuestionRefs:
    - QR023
    - QR025
    relatedTableRefs:
    - TR003
    - TR005
  - type: private-evidence-only
    severity: material
    topic: leadership-bench-depth
    missingEvidence: Succession plan, leadership org chart, senior trust/compliance ownership, and engineering management depth below the founder layer.
    whyItMatters: Scaling from a fast-moving startup into enterprise trust infrastructure requires redundancy in security, compliance, and go-to-market execution.
    diligencePath: Request the org chart, key-hire plan, succession memo, and ownership map for privacy, trust, and incident response.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
  - type: access-blocked
    severity: material
    topic: publisher-access-loss
    missingEvidence: Coverage-loss metrics when major domains deny crawler access, plus any paid licensing, allowlists, or exception workflows.
    whyItMatters: Publisher blocks and opt-outs could directly degrade answer quality or increase cost, yet the public record does not reveal how much of Parallel's retrieval surface is protected by contracts versus general web crawl rights.
    diligencePath: Ask for blocked-domain concentration, domain-level fallback rates, licensed-content agreements, and historical examples of coverage deterioration after access changes.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR001
    - TR003
