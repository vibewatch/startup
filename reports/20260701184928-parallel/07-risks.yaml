chapter:
  number: 7
  title: Risks
  summary: 'Parallel''s highest residual risks are legal and supply-side: publisher rights, scraping/terms disputes, privacy obligations, and AI-governance expectations can all narrow the open-web surface that its product depends on. The next layer is operational: public docs show real mitigations, but they also admit freshness, compression, and early-agent reliability trade-offs while leaving SLA, concentration, and bench-depth questions unresolved.'
sections:
- id: legal-regulatory-and-ip
  title: Copyright, privacy, and publisher-access rules are the top residual risks
  body: 'Parallel''s highest residual risk is legal and regulatory because the company''s product thesis sits directly on the contested boundary between open-web access and rights-holder control. Parallel''s own materials say AI will use the web more than humans and that paywalls, gated APIs, and private silos threaten that future, while its crawler documentation explicitly asks publishers to allow ShapBot through robots.txt and designated IP ranges. That is workable only while publishers, platforms, and courts tolerate the access pattern. The external evidence points the other way: the EU AI Act has raised provenance and incident-governance expectations for general-purpose AI, the DSM Directive lets rights-holders machine-reserve text-and-data-mining rights, the Copyright Office is actively framing training around licensing and market-dilution concerns, and publisher trade groups are pushing fresh 2026 anti-scraping legislation. Parallel also cannot treat U.S. law as clean cover. Fair use
    remains a fact-intensive market-effect test, CFAA fights remain contextual, and live litigation such as NYT v. Microsoft/OpenAI shows that publisher-content disputes can stay expensive and public even when the product is not a consumer chatbot.'
