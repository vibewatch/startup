- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Publisher rights and access loss
    - Blocked or reserved domains among top content sources
    - If top-ten-source coverage materially shrinks or key publishers demand paid access without viable substitutes
    - Pause bullish assumptions on gross margin and answer quality until licensed coverage or verified substitutes are in place.
  - - Grounding / reliability failure
    - Sev1 incidents or wrong-answer escalations
    - Repeated critical incidents, no credible postmortem program, or SLA redlines from top accounts
    - Treat enterprise expansion assumptions as impaired and require direct reliability evidence before underwriting growth.
  - - Privacy / compliance posture
    - Retention, DPA, and rights-fulfillment evidence
    - Inability to show a retention matrix, subprocessor list, and enterprise privacy annexes
    - Assume slower procurement and higher legal cost; do not price regulated-vertical upside aggressively.
  - - Customer concentration
    - Top-customer and vertical mix
    - If top five accounts or one regulated vertical dominate ARR beyond management comfort
    - Haircut revenue durability and require concentration-adjusted downside cases.
  - - Platform commoditization
    - Bundled competitor feature velocity
    - Major model vendors close the retrieval, citation, and workflow gap faster than Parallel widens differentiation
    - Compress terminal-margin and valuation assumptions unless Parallel proves superior workflow depth or proprietary supply.
  - - People / execution depth
    - Bench visibility and succession readiness
    - No visible trust/compliance leadership depth or succession plan by the next major financing or enterprise push
    - Cap position size and treat founder-dependence as unresolved key-person risk.
  notes: These kill criteria are meant to be monitored after diligence, not admired in hindsight. Each row converts a qualitative risk into a reviewable threshold or document request.
