- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role in the system
  - Key dependency
  - Primary risk
  rows:
  - - Web-scale crawl / index
    - Supplies the candidate universe for Search and underpins fast retrieval
    - Publisher crawl permissions plus Parallel recrawl/indexing operations
    - Coverage or freshness can degrade if crawl access narrows or recrawl policy misses fast-moving pages
  - - Semantic ranking + excerpt compression
    - Turns objectives into token-dense excerpts ranked for model usefulness
    - Quality of retrieval, compression, and reranking heuristics
    - Company-run benchmark wins may not generalize to every prompt distribution
  - - Extract normalization layer
    - Converts specific URLs, PDFs, and JS-heavy pages into markdown
    - Successful page fetches and site-specific rendering fallbacks
    - No public success-rate breakdown across hostile or highly dynamic sites
  - - Async research orchestration
    - Queues and manages long-lived Task runs plus interaction state
    - Task processors, backend models, and run-management infrastructure
    - Model-provider and processor details are not public, which complicates cost and concentration diligence
  - - Scheduled monitor engine
    - Runs event_stream or snapshot monitors and emits change events
    - Scheduler reliability, webhook delivery, and task chaining
    - No public SLA or incident archive for enterprise reliability review
  - - Integration and auth surfaces
    - Distributes capability via CLI, MCP, SDKs, and partner plugins
    - OAuth endpoints, API keys, partner runtimes, and package registries
    - Changes in partner client behavior can break or degrade the developer experience
  - - Crawler / AI-format guidance
    - Encourages llms.txt and ShapBot allow rules so publishers expose better model-ready content
    - Open-web publishers cooperating with crawler and format guidance
    - Parallel cannot force crawl access or llms.txt adoption, so content quality varies by publisher
  notes: This table abstracts public operating layers from docs and product pages. Where architecture is inferred from workflow
    contracts rather than explicitly diagrammed, the risk column marks the uncertainty.
