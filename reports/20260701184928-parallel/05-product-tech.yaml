  evidenceGaps:
  - type: missing-source
    severity: material
    topic: adoption-visibility
    missingEvidence: Product-level active-user, active-account, or installation metrics split by Search, Task, FindAll, Monitor,
      and integration surface.
    whyItMatters: Public package and repo signals show the ecosystem exists, but they do not prove adoption depth or retention
      by surface.
    diligencePath: Request a product-mix dashboard, active-customer counts by API surface, and package download/install trends
      from the company.
    relatedQuestionRefs:
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: retention-boundary
    missingEvidence: An endpoint-level data-retention and subprocessor matrix covering Search, Extract, Task, Monitor, MCP,
      and partner integrations.
    whyItMatters: The public privacy policy is broad; enterprise deployment review needs product-specific storage, training,
      and sharing boundaries.
    diligencePath: Request the trust-center packet, DPA, subprocessor schedule, and per-endpoint retention controls from security/legal.
    relatedQuestionRefs:
    - QE023
    - QE028
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-sla
    missingEvidence: Public SLA, error-budget, incident-history, and webhook-delivery reliability metrics for Monitor and
      Task.
    whyItMatters: Always-on research workflows and ambient monitoring are hard to underwrite without operational guarantees
      and failure-history context.
    diligencePath: Request the enterprise SLA, last-12-month availability report, and example incident postmortems for Monitor
      and Task.
    relatedQuestionRefs:
    - QE024
    - QE028
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: model-provider-opacity
    missingEvidence: A list of model providers, processor tiers, and routing logic behind advanced research, Task processors,
      and related backend inference.
    whyItMatters: Provider concentration, privacy exposure, latency, and cost structure cannot be underwritten from public
      materials alone.
    diligencePath: Request architecture review materials naming provider dependencies, failover strategy, and which surfaces
      rely on third-party models.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: benchmark-independence
    missingEvidence: Independent reproduction packs for Search and FindAll benchmark claims on customer-like prompt sets.
    whyItMatters: Company-run benchmarks can still be directionally useful, but buyers should validate performance on their
      own workloads before underwriting vendor lock-in.
    diligencePath: Rerun Parallel against representative production prompts and compare against OpenAI, Exa, and Tavily on
      cost, latency, and citation quality.
    relatedQuestionRefs:
    - QE003
    - QE013
    relatedTableRefs:
    - TE005
