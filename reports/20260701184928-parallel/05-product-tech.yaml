- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / surface
  - Primary user / agent job
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - Search API
    - App agent needing current web grounding
    - GA / benchmarked core surface
    - Semantic objective + token-relevance ranking + dense excerpts instead of generic link lists
    - Public benchmark claims are company-run; independent reproduction is not bundled
  - - Extract API
    - Agent that already knows the target URL
    - GA extraction surface
    - URL-to-markdown conversion for JS-heavy pages and PDFs with objective-scoped excerpts
    - No public per-site success-rate or fallback-rate disclosure
  - - Task API / Deep Research
    - Background agent or workflow orchestration layer
    - Current async research surface
    - Packages search, crawling, inference, and long-running runs into programmable research jobs
    - Model providers, processor internals, and SLA details remain undisclosed publicly
  - - FindAll API
    - Dataset-building / lead-gen / mapping workflows
    - Current discovery surface
    - Turns NL criteria into verified entity sets with structured enrichments and citations
    - 61% recall claim is self-reported and no independent benchmark pack is published
  - - Monitor API
    - Competitive, regulatory, or news watchlist owner
    - GA according to changelog
    - Scheduled event_stream or snapshot monitors with webhook delivery and Task follow-ups
    - Public uptime history, event-volume expectations, and enterprise SLA are not disclosed
  - - CLI / MCP / SDK / plugins
    - Developer or coding-agent operator
    - Current distribution layer
    - Parallel meets agents through terminal, assistant, SDK, Vercel, Pi, and OpenCode surfaces instead of one integration
      path
    - Experience depends on partner runtimes, OAuth flows, and package ecosystem stability
  notes: Statuses reflect public product pages and changelog language as of 2026-07-01. Diligence gaps highlight missing public
    evidence, not confirmed product defects.
