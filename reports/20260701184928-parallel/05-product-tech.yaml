company:
  name: Parallel
chapter:
  number: 5
  title: Product & Technology
  summary: 'Parallel sells a workflow-native web stack for AI agents rather than a single search API: Search for grounded
    lookups, Extract for URL-to-markdown retrieval, Task for asynchronous deep research, FindAll for entity-dataset creation,
    and Monitor for continuous change detection. The technical differentiation is its agent-oriented routing of retrieval,
    extraction, scheduling, and developer distribution through CLI, MCP, SDK, and partner integrations. The main diligence
    risks are opaque backend model/provider details, limited public SLA or incident history, and still-early public adoption
    signals outside Parallel''s own materials.'
sections:
- id: product-definition
  title: Product Definition in Agent Workflow Terms
  body: 'Parallel is not selling a single generic search endpoint; it is selling a workflow router for AI agents. The stack
    is split into five major jobs. Search handles real-time grounding in one round-trip by accepting a natural-language objective
    and returning dense, citation-aware excerpts rather than just SERP links. Extract handles targeted page retrieval, turning
    specific public URLs, including JavaScript-heavy pages and PDFs, into markdown that can be dropped straight into a model
    context window. Task is the long-running research and enrichment layer: it packages web search, crawling, and inference
    into asynchronous runs that can last from seconds to hours. FindAll is the dataset-building surface, translating natural-language
    criteria into verified sets of companies, people, or other entities with structured enrichment and citations. Monitor
    flips the model from pull to push by turning queries or task outputs into scheduled change-detection jobs with webhook
    delivery.'
