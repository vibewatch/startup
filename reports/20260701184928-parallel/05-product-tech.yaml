- id: deployment-and-integrations
  title: Deployment and Integration Paths
  body: 'Parallel is unusually explicit about distribution. Its docs tell developers to choose between three deployment modes:
    CLI plus Skills when the agent already has terminal access, MCP when the runtime is an assistant or tool-calling client,
    and native SDK/tool-calling when a production application needs full control. That decision tree matters because Parallel
    is trying to meet agents wherever they already run. Vercel AI Gateway can route parallelSearch through a single endpoint
    across many model providers. Pi and OpenCode plugins install Search and Extract as drop-in agent tools. Agent Skills extend
    the same capability set to GitHub Copilot, Cursor, Windsurf, and a long tail of coding agents. Under the hood, the public
    package surface is already broad: Python SDK, parallel-cli tooling, AI SDK tools, and plugin packages are all published
    in public repos and registries. This lowers adoption friction, but it also means the experience depends on third-party
    runtimes, OAuth flows, and package ecosystems remaining stable.'
  claimRefs:
