- id: trust-privacy-controls
  title: Trust, Privacy, and Reliability Controls
  body: 'Parallel publishes several trust signals directly on product and documentation surfaces, but those signals are uneven
    in depth. On the positive side, public pages advertise zero data retention, SOC 2 Type 2 certification, and no training.
    The privacy policy was refreshed in late June 2026 and includes sections on data security, retention, disclosures, and
    advertising controls. FAQ materials also draw a line between the public web and private data, saying Parallel does not
    natively pull private data unless a customer explicitly passes it into a task. For web acquisition itself, the crawler
    docs describe how ShapBot should be allowed in robots.txt and via designated IP ranges, which makes crawl permission an
    explicit operational dependency. Reliability visibility is thinner: the public status page was green when reviewed, but
    the materials examined do not publish a public SLA, error budget, or historical incident archive. For enterprise diligence,
    the company''s headline controls are real signals, but they are not yet a substitute for a trust-center packet and endpoint-level
    retention matrix.'
  claimRefs:
  - CE007
  - CE039
  - CE041
  - CE042
  - CE043
  - CE053
  - CE054
  tableRefs:
  - TE004
- id: roadmap-differentiation-risks
  title: Roadmap, Differentiation, and Core Dependencies
  body: 'The recent release pattern shows Parallel broadening from a search primitive into an agent-workflow platform. Changelog
    items point to Monitor reaching GA with event streams and snapshots, Search and Extract adding basic versus advanced modes
    plus broader retrieval coverage, Search MCP going free, CLI distribution arriving for terminal agents, and Vercel distribution
    expanding across the full API family. In workflow terms, the clearest differentiation versus traditional search APIs is
    that Parallel packages retrieval around agent jobs: Search for grounded answers, Extract for URL normalization, Task for
    asynchronous deep research, FindAll for entity-dataset creation, and Monitor for continuous change detection. The key
    diligence risks are that many of the company''s strongest claims are self-reported, developer-signal is still early, and
    crucial backend details remain opaque. Public materials do not disclose the model-provider stack, public SLA metrics,
    or product-level adoption by surface, so underwriting still depends on private diligence for reliability, concentration,
    and long-term cost predictability.'
