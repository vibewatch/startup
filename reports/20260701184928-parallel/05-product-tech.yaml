- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / signal
  - Status
  - Scope
  - Gap / caveat
  rows:
  - - Zero data retention
    - Published product claim
    - Advertised on Search surface
    - Public docs do not map retention behavior endpoint by endpoint or by integration
  - - SOC 2 Type 2 / SOC-II Type 2
    - Published product claim
    - Homepage and Search marketing surfaces
    - No public audit report, control matrix, or trust-center artifact is linked from reviewed materials
  - - No training
    - Published product claim
    - Search marketing surface
    - Public docs do not translate this promise into a per-product or per-subprocessor schedule
  - - Privacy policy updated 2026-06-24
    - Current policy page
    - Website-level privacy disclosures, retention, security, disclosures, ad controls
    - Policy is general-purpose; deployment review still needs DPA, subprocessor list, and API-specific handling detail
  - - Public-web boundary for private data
    - FAQ states private data must be passed in explicitly
    - Task inputs and post-processing boundary
    - No public examples define how private inputs are retained across every processor or partner workflow
  - - Status page
    - Green at fetch time
    - Public operational communications
    - No historical incident archive, SLO, or error-budget publication in reviewed sources
  - - Crawler guidance
    - Published ShapBot robots/IP instructions
    - Discovery/indexing relationship with publishers
    - Parallel depends on third-party sites granting crawl access and preserving AI-friendly formats
  notes: These are public-facing signals only. None of them replace enterprise diligence on the actual report, DPA, subprocessors,
