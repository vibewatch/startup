callouts:
- calloutType: strength
  title: Workflow-native segmentation is the clearest differentiator
  body: Parallel packages the web around agent jobs—grounding, extraction, deep research, dataset creation, and monitoring—rather
    than exposing only a generic search layer. That makes it easier to compose inside autonomous workflows than a classic
    SERP API.
  claimRefs:
  - CE001
  - CE002
  - CE011
  - CE017
  - CE022
- calloutType: insight
  title: Distribution breadth already exceeds the public maturity signals
  body: CLI, MCP, SDKs, Agent Skills, Vercel AI Gateway, Pi, and OpenCode all show a deliberate effort to meet developers
    inside existing agent runtimes. The breadth of those hooks is more mature than the still-early public repo metrics.
  claimRefs:
  - CE027
  - CE028
  - CE029
  - CE031
  - CE032
  - CE051
- calloutType: risk
  title: The hardest diligence questions sit behind the public surface
  body: Public docs explain what each workflow surface does, but not which model providers power advanced modes, what SLA
    or error-budget backs Monitor and Task, or how retention differs across every endpoint and partner path. Those omissions
    matter for enterprise deployment review.
  claimRefs:
  - CE041
  - CE042
  - CE053
  - CE054
  - CE055
