evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-timeline
    missingEvidence: >-
      A company-authored or filing-grade explanation that reconciles 2023 formal formation with the 2024 first-funding
      milestone and clarifies what date management wants investors to treat as founding.
    whyItMatters: >-
      The founding date is a basic identity fact reused across legal, talent, and capital narratives, and the current
      public record supports a formation window rather than one clean year.
    diligencePath: >-
      Ask management for incorporation documents, formation memo, and a canonical corporate timeline used in board and
      financing materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: leadership-depth
    missingEvidence: >-
      A current executive roster, org chart, and clearer disclosure of independent versus investor-controlled governance
      roles.
    whyItMatters: >-
      Key-person concentration is visible today, but the public record does not reveal whether there is enough
      operational depth under Parag Agrawal to de-risk execution.
    diligencePath: >-
      Request the latest org chart, board roster, committee structure, and biographies for functional leaders below the
      CEO.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: current-scale-metrics
    missingEvidence: Current 2026 headcount, exact paying-customer count, revenue, ARR, and major retention or growth metrics.
    whyItMatters: >-
      The public traction picture is promising, but valuation underwriting requires current operating metrics rather
      than launch-era team size and selected customer anecdotes.
    diligencePath: >-
      Ask for a board-ready KPI pack covering headcount by function, customer counts, ARR or revenue run rate, cohort
      retention, and sales efficiency.
    relatedQuestionRefs:
      - QO018
      - QO020
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: publisher-compensation-model
    missingEvidence: >-
      Signed publisher or content-owner agreements showing how Parallel’s proposed open market mechanism works in
      practice.
    whyItMatters: >-
      Publisher relations and web-access economics are central to product durability, margin structure, and regulatory
      resilience, yet the public record still describes the mechanism conceptually.
    diligencePath: >-
      Request pilot agreements, payout logic, and evidence of live publisher participation or fallback access strategies
      if content availability narrows.
    relatedQuestionRefs:
      - QO023
      - QO024
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: sam and som gap
    missingEvidence: >-
      Segment-level customer counts, retained query volume, and renewal behavior for Parallel across coding, research,
      enterprise AI, and legal workflows.
    whyItMatters: >-
      Without mix and retention data, public evidence can bound the market but cannot prove which slice Parallel
      actually serves durably.
    diligencePath: Request cohort retention, top-customer concentration, and segment revenue mix from management.
    relatedQuestionRefs:
      - QM026
      - QM027
    relatedTableRefs:
      - TM002
      - TM003
  - type: private-evidence-only
    severity: material
    topic: economic crossover gap
    missingEvidence: >-
      Observed workload thresholds at which buyers leave manual research, bundled search, or internal RAG for a
      dedicated retrieval vendor.
    whyItMatters: >-
      The investment case depends on whether dedicated retrieval becomes a repeatable budget line before a bundled model
      stack absorbs the workflow.
    diligencePath: Ask for customer case studies with query volumes, prior toolchain, and economic rationale for switching.
    relatedQuestionRefs:
      - QM028
    relatedTableRefs:
      - TM002
      - TM004
  - type: private-evidence-only
    severity: minor
    topic: buyer budgeting
    missingEvidence: >-
      Named examples of which function actually pays for Parallel in enterprise accounts and how that changes after
      pilot stage.
    whyItMatters: >-
      Bottom-up adoption may start with developers or analysts, but durable contracts usually depend on a stable budget
      owner.
    diligencePath: Request account-level examples covering pilot sponsor, expansion owner, and renewal owner by segment.
    relatedQuestionRefs:
      - QM012
      - QM013
      - QM014
      - QM015
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: market-study overlap
    missingEvidence: >-
      A third-party study that isolates web grounding or retrieval infrastructure for agents without overlapping
      AI-search, web-scraping, or general agent-platform spend.
    whyItMatters: >-
      The present TAM discussion relies on adjacent categories with different scope, so investors must translate rather
      than accept one clean figure.
    diligencePath: >-
      Commission or locate a narrower category cut from an analyst with explicit methodology for retrieval
      infrastructure.
    relatedQuestionRefs:
      - QM009
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: regulated-workflow validation
    missingEvidence: >-
      Independent customer evidence showing how much auditability and citation quality matter in legal, investigation,
      or compliance workflows relative to cheaper bundled tools.
    whyItMatters: >-
      Regulated segments look attractive in theory, but premium willingness to pay has to be validated by actual
      deployment and renewal behavior.
    diligencePath: Interview regulated customers and review red-team, audit, and incident data for those deployments.
    relatedQuestionRefs:
      - QM017
      - QM022
    relatedTableRefs:
      - TM003
      - TM004
  - type: missing-source
    severity: material
    topic: tavily-enterprise-controls
    missingEvidence: >-
      Public trust-center or compliance documentation from Tavily comparable to the ZDR, SOC 2, or certification
      disclosures peers advertise.
    whyItMatters: >-
      Enterprise win rates may depend as much on security review as on search quality, and the current public evidence
      for Tavily is thinner than for several peers.
    diligencePath: >-
      Request Tavily security documentation, retention defaults, and any enterprise data-processing commitments shared
      during procurement.
    relatedQuestionRefs:
      - QP027
  - type: private-evidence-only
    severity: material
    topic: realized-pricing-retention
    missingEvidence: >-
      Customer-level realized pricing, discounts, committed minimums, usage expansion, and retention by segment across
      direct peers and Parallel.
    whyItMatters: >-
      List pricing is transparent, but underwriting competitive durability requires knowing who discounts most
      aggressively and whether customers stay once pilots scale.
    diligencePath: >-
      Request redacted contracts, cohort retention, win-loss analyses, and average realized pricing by customer segment
      from Parallel and relevant comps.
    relatedQuestionRefs:
      - QP028
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: independent-head-to-head-benchmarks
    missingEvidence: >-
      Independent head-to-head quality tests that compare Parallel, Exa, Tavily, You.com, and Perplexity on the same
      prompt set and retrieval criteria.
    whyItMatters: >-
      Current benchmark narratives are mostly vendor-authored or low-reputation review content, which limits confidence
      in claimed quality gaps.
    diligencePath: >-
      Run a controlled bake-off on the company's real workloads or commission an independent evaluator to compare
      citation quality, freshness, and cost per successful task.
    relatedQuestionRefs:
      - QP026
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Current ARR, trailing-12-month revenue, revenue growth, and revenue mix by API family and customer segment.
    whyItMatters: >-
      Without actual paid revenue scale and mix, the chapter cannot test whether list pricing and customer logos
      translate into a durable business.
    diligencePath: >-
      Request a board-ready revenue bridge showing self-serve versus enterprise revenue, top 10 customers, and growth by
      product.
    relatedQuestionRefs:
      - QI005
      - QI010
  - type: private-evidence-only
    severity: material
    topic: gross-margin-and-cost-stack
    missingEvidence: GAAP gross margin, contribution margin by workload class, and external model or cloud vendor cost concentration.
    whyItMatters: >-
