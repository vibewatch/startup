  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments, buyers, users, and payers
        blocks:
          - type: paragraph
            body: >-
              Parallel's public customer surface spans several distinct buyer types rather than a single ICP. Harvey and
              Notion show platform or AI-product teams buying web access for knowledge workers; Opendoor and Genpact
              show operations teams buying it for accuracy-critical workflows; Profound and Clay map to marketing and
              GTM teams that need grounded research rather than browser-style search. In almost every example, the
              end-user is not the economic buyer. The payer is usually the product, operations, innovation, or platform
              budget that owns the workflow, while the downstream users are lawyers, knowledge workers, claims
              reviewers, marketers, or RevOps users inside the customer's own product or process. That is attractive
              because it broadens the segment map, but it also means Parallel is selling infrastructure into companies
              that themselves mediate the end relationship. The strongest public breadth evidence is vertical diversity,
              not a disclosed count of durable revenue accounts.


              The use-case split matters for durability and monetization. Harvey, Opendoor, and Genpact are high-stakes
              workflows where citations, completeness, and controlled escalation matter more than a cheap lookup. Notion
              and Clay are broader agent-assistant motions where Parallel appears as one infrastructure component inside
              a larger system, and Profound sits between them as a marketing workflow with measurable throughput
              improvements but less visible regulatory burden. Public evidence therefore supports a real segmentation
              story by buyer, user, payer, and use case, but not a revenue segmentation story by ARR, geography, or
              contract cohort.
