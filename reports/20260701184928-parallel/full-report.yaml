  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what the $2 billion mark assumes
        blocks:
          - type: paragraph
            body: >-
              Parallel’s financing context is strong on narrative and weak on disclosed economics. The company publicly
              moved from a $100 million Series A at a $740 million valuation in November 2025 to a $100 million Series B
              at a $2 billion valuation in April 2026, with total disclosed capital reaching $230 million and Sequoia
              joining the board. That speed matters: it implies investors believed Parallel had already crossed from
              promising infrastructure story to category leader.


              Public evidence partly supports that leap. TechCrunch and company materials point to more than 100,000
              developers plus named customers such as Clay, Harvey, Notion, and Opendoor. Customer and partner materials
              add real workflow proof in legal research, real-estate operations, and insurance claims. But the record
              still omits the inputs that let an outside investor test whether the markup is underwritten: revenue, ARR,
              gross margin, NRR, customer concentration, and the economic quality of the developer funnel. The right
              starting question is therefore not whether Parallel is real, but what must already be true economically
              for $2 billion to be fair.
            claimRefs:
              - CV001
