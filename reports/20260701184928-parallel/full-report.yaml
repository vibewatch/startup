  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation moves from financing and customer proof through opacity and risk filters to a research-more
      conclusion.
    data:
      nodes:
        - id: funding
          label: 'Fast markup: $740M Series A to $2B Series B in ~5 months'
        - id: proof
          label: 'Real proof: 100k+ developers and production workflows at Harvey, Opendoor, and Genpact'
        - id: product
          label: 'Product wedge: citation-aware, fresh web infrastructure for agents'
        - id: opacity
          label: 'Missing economics: no public ARR, margin, NRR, or concentration data'
        - id: risk
          label: 'Compression risks: bundled agent platforms, publisher friction, and unknown round terms'
        - id: rec
          label: 'Output: research-more, high risk, stretched valuation stance'
      edges:
        - from: funding
          to: proof
          label: needs support from
        - from: proof
          to: product
          label: is explained by
        - from: product
          to: opacity
          label: still runs into
        - from: opacity
          to: risk
          label: magnifies
        - from: risk
          to: rec
          label: drives
    approximationNotes: Logical chain of the investment decision, not a financial model.
    claimRefs:
      - CV003
      - CV005
      - CV012
      - CV029
      - CV031
      - CV043
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      A $2B valuation implies very different ARR requirements depending on which multiple band investors ultimately
      apply to Parallel.
    data:
      items:
        - label: $2B at 16x revenue
          value: 125
        - label: $2B at 12x revenue
          value: 167
        - label: $2B at 8x revenue
          value: 250
        - label: $2B at 6.3x revenue
          value: 317
        - label: $2B at 5.4x revenue
          value: 370
        - label: $2B at 3.7x revenue
          value: 541
        - label: $2B at 2.8x revenue
          value: 714
      yAxis:
        label: ARR required to justify $2B valuation (USD M)
    approximationNotes: >-
      Simple valuation divided by revenue-multiple sensitivities using public and quasi-public 2026 benchmark bands;
      Parallel has not disclosed actual ARR.
