  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Copyright, privacy, and publisher-access rules are the top residual risks
        blocks:
          - type: paragraph
            body: >-
              Parallel's highest residual risk is legal and regulatory because the company's product thesis sits
              directly on the contested boundary between open-web access and rights-holder control. Parallel's own
              materials say AI will use the web more than humans and that paywalls, gated APIs, and private silos
              threaten that future, while its crawler documentation explicitly asks publishers to allow ShapBot through
              robots.txt and designated IP ranges. That is workable only while publishers, platforms, and courts
              tolerate the access pattern. The external evidence points the other way: the EU AI Act has raised
              provenance and incident-governance expectations for general-purpose AI, the DSM Directive lets
              rights-holders machine-reserve text-and-data-mining rights, the Copyright Office is actively framing
              training around licensing and market-dilution concerns, and publisher trade groups are pushing fresh 2026
              anti-scraping legislation. Parallel also cannot treat U.S. law as clean cover. Fair use remains a
              fact-intensive market-effect test, CFAA fights remain contextual, and live litigation such as NYT v.
              Microsoft/OpenAI shows that publisher-content disputes can stay expensive and public even when the product
              is not a consumer chatbot.
