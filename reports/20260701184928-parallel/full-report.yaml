chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and company footprint
        blocks:
          - type: paragraph
            body: >-
              Parallel’s clearest identity is not ‘another foundation model company’ but a software infrastructure
              vendor trying to make the live web usable for AI agents. Official pages describe a stack that spans
              search, extraction, deep research, chat, monitoring, and dataset-building APIs, all organized around
              evidence, freshness, and machine-ready outputs rather than human browsing. That matters for diligence
              because the business model is API software sold to developers and enterprises, not an ad-driven consumer
              surface. Pricing, docs, and product pages reinforce that the company is monetizing per request, with a
              free tier to seed developer adoption and higher-priced research processors for more complex workflows.


              The physical footprint is narrower than the product ambition. Publicly supportable location evidence
              centers on Palo Alto, with a San Francisco office or mailing presence visible in careers and
              filing-related records. The founding timeline is less clean: a 2023 filing and several 2025 news reports
              trace formal formation to 2023, while January 2024 is the first clearly disclosed financing milestone and
              therefore the first widely visible operating waypoint. For later chapters, the safest reusable framing is
              a 2023 formal formation with 2024 funded buildout, not a single neat date unsupported by the source set.
