  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      External access restrictions and answer-quality failures would flow through trust, adoption, margin, and valuation
      quickly.
    data:
      nodes:
        - id: publisher
          label: Publisher opt-outs
          detail: Reserved rights, paywalls, blocks, or licensing demands
        - id: coverage
          label: Coverage loss
          detail: Narrower source pool and weaker live retrieval
        - id: quality
          label: Answer quality
          detail: More stale, partial, or wrong grounding
        - id: trust
          label: Enterprise trust
          detail: Procurement, legal, and security review confidence
        - id: margin
          label: Margin
          detail: Higher manual review, legal, and content-acquisition cost
        - id: revenue
          label: Revenue durability
          detail: Renewals, expansion, and new workloads
        - id: comp
          label: Platform alternatives
          detail: Bundled tools from major model vendors
        - id: valuation
          label: Valuation support
          detail: Whether the $2B mark remains credible
      edges:
        - from: publisher
          to: coverage
          label: narrows
        - from: coverage
          to: quality
          label: weakens
        - from: quality
          to: trust
          label: erodes
        - from: trust
          to: revenue
          label: slows
        - from: publisher
          to: margin
          label: raises content cost
        - from: quality
          to: margin
          label: raises remediation cost
        - from: comp
          to: revenue
          label: compresses win rate
        - from: margin
          to: valuation
          label: compresses
        - from: revenue
          to: valuation
          label: anchors
        - from: trust
          to: valuation
          label: re-rates
    claimRefs:
