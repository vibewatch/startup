            body: >-
              The comparable set says two things at once. First, capital is clearly flowing into AI search and
              infrastructure: Exa, Tavily, You.com, Perplexity, and OpenRouter all raised meaningful rounds around
              adjacent problems. Second, Parallel’s $2 billion mark is aggressive relative to what is publicly
              disclosed. It is above Exa, You.com, and OpenRouter, while Perplexity’s far larger mark comes with at
              least some public ARR context that Parallel does not provide.


              Public-market data sharpens the discipline. Multiples.vc’s June 2026 software bands and Nate Lind’s
              discussion of the BVP cloud index both imply that even good software businesses clear at mid-single-digit
              to low-double-digit revenue multiples, with private companies still discounted for information risk.
              Because Parallel discloses no ARR, valuation has to be modeled as a range of explicit assumptions rather
              than reverse-engineered from reported financials. Under that framing, the current round only looks
              comfortable if Parallel is already near premium private-AI-infrastructure revenue quality; base and bear
              cases clear well below the headline mark.
