      - number: '3.4'
        title: Moat durability, commoditization, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Parallel's strongest competitive case is not generic web access. Too many vendors already sell that, often
              with transparent or low headline pricing. The more durable wedge is evidence quality: provenance on every
              result, model neutrality, and workflow-tuned retrieval that still works when buyers do not want to hand
              their full research stack to OpenAI, Anthropic, or Microsoft. That wedge is real, but it is not
              unassailable. Pricing is transparent across the category, direct peers are well funded, and several
              substitutes can be multi-homed with relatively modest engineering work. Bundled model-platform tools are
              the sharpest displacement threat because they can turn retrieval into a “good enough” feature inside a
              broader contract. Independent proof of quality is also still thin; Parallel's benchmark page is useful
              positioning evidence, not third-party validation. The underwriting implication is that Parallel's moat
              must come from measurable task-level accuracy, provenance, and governance advantages on customer workflows
              where the cost of a weak answer is high. If buyers only need cheap raw results or generic cited answers,
              the category looks increasingly commoditized.
