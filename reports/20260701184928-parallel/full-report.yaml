      - number: '8.5'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Parallel does not look near-term IPO-ready from public evidence. Public-infrastructure comparables operate
              with ongoing SEC disclosure, while Parallel still presents investors with a founder-led story plus
              selected customer proof. That does not preclude a strategic outcome; in fact, a strategic buyer may care
              more about the index, developer distribution, and enterprise integrations than about near-term IPO polish.
              But as of July 2026, the company looks earlier on governance and evidence quality than its valuation
              suggests.


              The practical implication is a short diligence list with clear kill criteria. If management can show a
              credible ARR bridge, strong gross margins, healthy retention, and economically reasonable publisher or
              access costs, today’s mark becomes more defensible. If those answers fail, the comp set shifts immediately
              toward lower-multiple infrastructure or ordinary SaaS. This chapter therefore ends with monitorable
              thesis-break triggers and diligence asks rather than a false-precision target price.
