      - number: '1.3'
        title: Funding history, valuation trajectory, and supportable scale
        blocks:
          - type: paragraph
            body: >-
              Parallel’s capital path is now one of its most important identity facts. The public sequence runs from a
              previously disclosed $30 million pre-Series-A financing in January 2024, to a $100 million Series A at a
              $740 million valuation, to a $100 million Series B at a $2 billion valuation only about five months later.
              Existing investors repeatedly increased exposure, while Sequoia entered at Series B and won a board seat.
              That is a strong signal that sophisticated sponsors believe the company sits on an important
              infrastructure layer for agentic AI. It also raises expectations sharply: a valuation step-up this fast
              usually implies pressure for rapid commercial scaling, defensibility, and category leadership.


              Public scale evidence is meaningful but incomplete. TechCrunch’s report of more than 100,000 developers
              and named customers including Clay, Harvey, Notion, and Opendoor is stronger than generic hype, while
              Parallel’s own materials support millions of daily requests or research tasks. At the same time, the
              source set does not disclose revenue, ARR, exact current customer count, or a current 2026 headcount. This
              chapter should therefore preserve a split view for later reuse: traction signals are real, but the hard
              operating metrics needed for full financial underwriting remain private.
