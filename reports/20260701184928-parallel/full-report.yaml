  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, included spend, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The most defensible market boundary around Parallel is not “AI” and not even generic “search.” The common
              thread across Parallel’s homepage and docs, OpenAI’s agent-tool launch, Anthropic’s computer-use release,
              and Google’s AI Mode is that agents need a layer that can reach live information, compress it into
              model-usable context, and preserve enough provenance for a human to trust the answer. That means included
              spend is the retrieval and grounding layer: search APIs, file and web retrieval, extraction, monitoring,
              investigation search, and similar infrastructure that connects models to current external or authoritative
              sources. Excluded spend is everything that does not primarily solve the grounding problem, such as raw
              model inference, generic chatbot subscriptions, and broad digital-ad or consumer-search monetization
              pools. The substitute set is also clearer than a generic TAM slide suggests. Buyers can continue to use
              manual research, incumbent search interfaces, internal crawl or RAG stacks, or bundled model-native
              browsing and computer-use tools from large model vendors. Parallel therefore sits in a market defined by
              control, freshness, and provenance, not by aggregate AI excitement.
