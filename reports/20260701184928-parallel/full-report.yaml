  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Parallel solution
      - Measurable benefit
      - Limitation
    rows:
      - - Ground a single answer with current facts
        - Issue several keyword searches, open pages, and manually compress evidence for the model
        - Search API returns LLM-optimized excerpts from one objective-driven call
        - Fewer search hops and less token waste in the context window
        - Result quality still depends on crawl freshness and public-web accessibility
      - - Pull the exact contents of a page already identified
        - Build one-off scrapers or send raw HTML to a model
        - Extract converts the target URL into clean markdown with optional focused excerpts
        - Less HTML cleanup and better PDF / JS-page handling
        - Extract does not discover pages on its own
      - - Run deep diligence or enrichment
        - Human researcher or bespoke workflow juggles search, extraction, and synthesis step by step
        - Task packages web search, crawling, inference, and asynchronous execution into a repeatable run
        - Research can continue in the background and be embedded in production ops
        - Processor stack and cost-quality trade-offs remain partly opaque
      - - Build a list from scratch
        - Manually search, shortlist, dedupe, and enrich entities across the web
        - FindAll turns NL criteria into verified candidate sets with enrichments and citations
        - Faster dataset creation for mapping, prospecting, or landscape work
        - Benchmark and recall claims are marketing-led, not independent
      - - Track web changes over time
        - Re-run searches manually or poll sources ad hoc
        - Monitor creates scheduled change-detection jobs with webhooks and Task follow-ups
        - Push-style updates for news, regulatory, and competitive watchlists
        - Public docs do not quantify false-positive rates or uptime commitments
      - - Install web intelligence into a coding agent
        - Hand-write tool adapters for every model/runtime
        - CLI, MCP, Pi, OpenCode, Vercel, and Agent Skills provide prebuilt entry points
        - Lower deployment time and less glue code
        - Each route adds dependence on external clients, marketplaces, or auth flows
    notes: >-
      Benefits summarize the job the workflow is trying to reduce, not audited ROI figures. Limitations distinguish what
      each surface does not solve on its own.
    claimRefs:
      - CE002
      - CE008
      - CE010
      - CE011
      - CE017
