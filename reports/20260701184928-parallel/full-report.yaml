  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Capability map comparing how mature, distributed, observable, and dependency-heavy the core Parallel surfaces
      appear from public materials.
    data:
      columns:
        - Workflow maturity
        - Distribution reach
        - Observability / evidence
        - Main dependency risk
      rows:
        - label: Search
          values:
            - label: GA / benchmarked
              tone: low
              detail: Flagship surface with public benchmark and pricing claims
            - label: Broad
              tone: low
              detail: Search product, MCP, CLI, Vercel, and tool-calling paths all point here
            - label: Moderate
              tone: medium
              detail: Strong product-page evidence but benchmark independence still needs customer replication
            - label: Crawl freshness
              tone: medium
              detail: Depends on recrawling quality and publisher access
        - label: Extract
          values:
            - label: GA / stable
              tone: low
              detail: Well-documented URL-to-markdown surface
            - label: Broad
              tone: low
              detail: Used directly and inside Pi/OpenCode/Vercel-style workflows
            - label: Moderate
              tone: medium
              detail: Capabilities are clear, but public success-rate data is not
            - label: Site complexity
              tone: medium
              detail: Quality depends on hostile-site and JS fallback behavior
        - label: Task
          values:
            - label: Current / expanding
              tone: medium
              detail: Async run model, interaction state, Task MCP, and changelog velocity
            - label: Growing
              tone: medium
              detail: CLI, MCP, and docs support are public, but usage metrics are not
            - label: Partial
              tone: high
              detail: Public docs explain workflow shape, not backend model/provider stack
            - label: Opaque processors
              tone: high
              detail: Cost, latency, and concentration diligence need private materials
        - label: FindAll
          values:
            - label: Current / specialized
              tone: medium
              detail: Useful for entity discovery with generators, enrichments, and webhooks
            - label: Narrower
              tone: medium
              detail: Most public distribution emphasis still sits on Search and Task surfaces
            - label: Marketing-led
              tone: high
              detail: 61% recall claim is company-reported and needs independent validation
            - label: Benchmark dependence
              tone: high
              detail: Quality claims rest on Parallel's own benchmark framing
        - label: Monitor
          values:
            - label: GA but newer
              tone: medium
              detail: GA status is recent and feature set is still expanding
            - label: Improving
              tone: medium
              detail: Docs, webhooks, and task chaining are public, but external references are limited
            - label: Thin
              tone: high
              detail: Public status exists, but no SLA, incident archive, or false-positive metrics are published
            - label: Scheduler reliability
              tone: high
              detail: Operational guarantees are still private-diligence items
    claimRefs:
      - CE021
      - CE046
      - CE047
      - CE048
      - CE049
      - CE050
      - CE051
      - CE052
      - CE054
      - CE055
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Parallel typically enters through a painful research workflow, passes security and accuracy review, and then
      expands only if the customer can operationalize citations and controls.
    data:
      items:
        - label: Workflow pain appears
          note: >-
            A customer hits a live-web problem that generic search or static databases cannot solve cleanly enough for
            production.
        - label: Evaluation starts
          note: >-
            The buyer compares accuracy, web coverage, citations, and integration fit against alternatives or in-house
            workarounds.
        - label: Security and governance review
          note: Admins or platform owners examine permissions, SSO, data controls, provenance, and human-review paths.
        - label: Workflow bake-off or controlled rollout
          note: >-
            Harvey uses opt-in enablement, Opendoor runs an accuracy bake-off, and Genpact encodes business rules before
            production.
        - label: Production deployment
          note: >-
            Parallel becomes the web-research layer inside a recurring workflow such as HOA checks, legal research,
            claims pricing, or content grounding.
        - label: Expansion or concentration question
          note: >-
            Accounts may widen into more workflows, but public data stops before renewal math, ARR mix, or top-customer
            concentration.
    approximationNotes: This is a synthesized operating journey built from public case studies and docs, not a disclosed CRM funnel.
    claimRefs:
      - CU007
      - CU016
      - CU017
      - CU021
      - CU040
      - CU042
      - CU044
