        title: Revenue Model and Pricing Signals
        blocks:
          - type: paragraph
            body: >-
              Parallel's public monetization file is much stronger on packaging than on realized revenue. The pricing
              page exposes a true self-serve entry point: up to 16,000 free requests, then pay-as-you-go pricing across
              Task, Search, Extract, Chat, Monitor, and Find All APIs. The company homepage reinforces that framing by
              promising predictable costs and payment per query rather than per token, while the FAQ says pricing is
              usage-based and separately discloses private-cloud and on-prem options for qualified enterprise customers.
              Taken together, the evidence points to a package mix that starts with developers or small teams adopting
              low-friction APIs, then migrates higher-value workloads into more compute-intensive Task or research
              products and finally into enterprise deployment, security, and data-governance wrappers. What the public
              file still does not show is realized mix: there is no breakout of Search versus Task revenue, no
              enterprise minimum commitments, no discounting pattern, and no disclosure of whether monitors,
              customer-specific deployments, or publisher-economics features generate distinct revenue lines. So the
