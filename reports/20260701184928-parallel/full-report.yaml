      - number: '5.2'
        title: Technical Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >-
              The common operating idea across Parallel's surfaces is to route the web into model-native artifacts.
              Search is built around a proprietary crawl/index/ranking stack that Parallel says spans billions of pages,
              adds millions daily, and compresses results into token-efficient excerpts. Extract sits beside it as a
              URL-to-markdown normalizer for pages, PDFs, and JavaScript-heavy content. Task and Monitor then add
              orchestration on top of that retrieval substrate: Task exposes asynchronous runs, interaction state, and
              non-blocking MCP patterns, while Monitor applies the same web intelligence on a fixed schedule using
              event_stream or snapshot monitors. The company is also designing for AI-native interfaces around the web
              itself. Its llms.txt guidance treats plain-text markdown maps as a first-class discovery surface for
              models, and its crawler documentation asks publishers to permit ShapBot access in robots.txt and from
              designated IP ranges. The result is a stack that depends as much on publishing formats and crawl access as
              on raw model quality.
