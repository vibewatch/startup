      - number: '2.4'
        title: Growth drivers, adoption constraints, and unresolved contradictions
        blocks:
          - type: paragraph
            body: >-
              The growth case is real. Cloudera, Gartner, a16z, and BCG all point to fast enterprise-agent adoption,
              rising budgets, and measurable productivity aspirations. Google, OpenAI, and Anthropic also confirm that
              web access, deep research, and computer use are moving into mainstream model stacks, which validates the
              importance of the problem Parallel solves. But those same launches also create the central market
              constraint: bundled toolchains from major model vendors can absorb part of the value pool that standalone
              retrieval vendors hope to capture. Dedicated vendors still matter where buyers need model neutrality,
              domain filtering, fresher control over retrieval, stronger provenance, or regulated-workflow assurances.
              Even there, privacy, security, and human-oversight requirements remain a gating factor. OpenAI’s own CUA
              benchmarks and Anthropic’s product caveats show that browser or computer-use agents are improving but not
              yet reliable enough to eliminate supervision. The contradictory estimates should therefore be preserved,
              not reconciled away: the market is clearly expanding, but the exact slice that belongs to dedicated
              grounding infrastructure remains under-disclosed. The biggest remaining diligence gap is not demand; it is
              how much of that demand becomes durable, high-retention spend for a vendor like Parallel rather than a
              feature inside a broader model platform.
