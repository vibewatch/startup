      - number: '2.2'
        title: Top-down and bottom-up TAM, SAM, and SOM lenses
        blocks:
          - type: paragraph
            body: >-
              Public market studies support the existence of a sizable adjacent opportunity, but they do not support one
              single “correct” TAM. Enterprise search is the closest incumbent software budget and is much smaller than
              broad AI-search definitions. RAG is narrower still, while AI-driven web scraping captures data-acquisition
              budgets that often sit one layer below search. AI-agent market forecasts are broader outer bounds that
              include orchestration and application layers far beyond dedicated retrieval vendors. The useful
              interpretation is not to add these numbers together; it is to treat them as stacked lenses around the same
              emerging workflow. A buyer-lens bottom-up model points to the same conclusion. Once an active team starts
              running thousands of web lookups per day, retrieval becomes its own spend line, and the economic question
              shifts from “is there a market?” to “which teams need dedicated control badly enough to buy a separate
              layer?” That pushes the most credible SAM toward high-intensity knowledge-work teams rather than
              mass-market consumer search, and it keeps SOM narrower still until Parallel discloses actual segment mix
              and retention.
