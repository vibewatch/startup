companyProfile:
  summary: >-
    Parallel is a Palo Alto AI-infrastructure company building the retrieval, extraction, deep research, monitoring, and
    dataset-building layer for AI agents that need live web information. Led publicly by former Twitter CEO Parag
    Agrawal, the company sells usage-based APIs and enterprise workflow infrastructure rather than a consumer search
    surface. Parallel disclosed a $100 million Series A at a $740 million valuation in November 2025 and a $100 million
    Series B at a $2 billion valuation in April 2026, while public evidence points to 100,000-plus developers and named
    customers including Harvey, Notion, Opendoor, and Clay.
  foundedDate: '2023-10-19'
  founders:
    - name: Parag Agrawal
      role: Founder & CEO
      claimRefs:
        - CO013
  foundingLocation: Palo Alto, California, USA
  headquarters: Palo Alto, California, USA
  productSummary: >-
    Parallel offers Search, Task/Deep Research, Extract, Monitor, Chat, and Find All APIs that convert live web content
    into citation-aware, machine-ready outputs for coding agents, go-to-market agents, legal-research agents, and
    enterprise workflows.
  customerFocus: >-
    AI-agent developers plus enterprise workflow teams in functions such as legal research, operations, sales
    intelligence, and insurance claims that need current web evidence.
  businessModel: >-
    Usage-based API pricing with a free developer tier and higher-priced enterprise or research workflows, plus
    enterprise integrations and partner-led deployments.
  stage: Series B (private, venture-backed)
  fundingStatus: >-
    $100 million Series B at a $2 billion valuation in April 2026 after a $100 million Series A at a $740 million
    valuation in November 2025; total disclosed funding is $230 million.
