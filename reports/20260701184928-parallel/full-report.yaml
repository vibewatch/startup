      - number: '6.3'
        title: Procurement friction, controls, and implementation reality
        blocks:
          - type: paragraph
            body: >-
              The case studies show that procurement friction is real and customer-specific. Opendoor did not buy search
              in the abstract; it required SOC 2 Type 2, SSO, granular permissions, data-protection controls, and proof
              on the hardest HOA cases before production deployment. Harvey's rollout is optional at the workspace-admin
              level and emphasizes ranked sources, exact citation snippets, URL scoping, and U.S.-only processing.
              Genpact's insurer implementation adds another layer: explicit business rules, retailer exclusions,
              confidence scores, and routing of low-confidence results to humans. These are classic enterprise-adoption
              signals because they show Parallel being purchased as a controlled subsystem inside regulated or
              accuracy-critical operations, not as an unsupervised novelty feature.


              The same evidence also limits how fast Parallel can spread inside a customer. Workflows that need
              citations, permissions, and human-review fallbacks usually move through platform, security, and
              domain-owner stakeholders rather than a single developer swipe. Parallel's own docs and enrichment
              materials reinforce that posture by centering citations, confidence scores, and provenance as first-order
              product outputs. That supports enterprise trust, but it also implies integration work, stakeholder review,
              and governance overhead before expansion. Public evidence therefore supports production readiness and
              operational value, while also implying that customer expansion depends on implementation capacity and
              control requirements, not just model quality.
