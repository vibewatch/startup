    {
      "id": "capability-pricing-and-trust",
      "title": "Capability, pricing, and trust posture by vendor class",
      "body": "The buyer choice set divides cleanly by what the vendor is optimizing. Exa and Tavily are the most direct AI-native peers: Exa emphasizes full-page content, deep search, agent runs, custom indexing, and Zero Data Retention, while Tavily leans into PLG adoption, citation-friendly research workflows, and a broad search-extract-map-crawl-research toolkit. Legacy SERP vendors remain cheaper or broader in some cases. Serper is the budget Google-access option, while SerpAPI is the breadth-and-reliability option with many Google surfaces and a stronger public compliance posture. Brave is distinct because it couples list pricing with an independent index and explicit privacy or ZDR language. You.com and Perplexity are different again: they package search, content retrieval, and answer generation into higher-level research products, which can simplify implementation for some users while reducing raw-control transparency. Trust posture is similarly uneven. Exa, SerpAPI, Brave, and You.com all disclose concrete public controls such as ZDR, ZeroTrace, SOC 2, or no-training promises. Tavily's public materials show strong traction but lighter trust disclosures in the retained evidence set, which matters if the buyer is a security review committee rather than an individual developer.",
