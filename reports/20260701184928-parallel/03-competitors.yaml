    {
      "id": "switching-costs-distribution-and-supplier-power",
      "title": "Switching costs, multi-homing, distribution leverage, and supplier dependence",
      "body": "This category is structurally more multi-homeable than a core system of record. Most products are exposed through APIs, SDKs, or prompt-level tool definitions, which means technical switching costs are real but usually bounded. Buyers can route different workloads to different vendors, keep a legacy SERP provider as fallback, or pair an answer engine with an independent retrieval layer. That is good for customers and bad for weak moats. Distribution therefore matters almost as much as product quality. OpenAI and Anthropic can upsell search and browser capabilities inside broader model relationships; Microsoft can steer Azure customers toward Bing grounding; Google still owns default search mindshare even as Custom Search narrows; SerpAPI benefits from developer familiarity and broad surface coverage. The same pattern creates supplier risk. Serper and SerpAPI depend materially on upstream search ecosystems. Google and Microsoft have both tightened legacy access, proving that platform owners can reset product boundaries with little warning. Parallel benefits from that churn only if it can convince customers that an independent, model-agnostic retrieval layer is a more stable control point than any single upstream vendor or bundled model tool.",
