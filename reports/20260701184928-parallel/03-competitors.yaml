    "number": 3,
    "title": "Competitors",
    "summary": "Parallel competes in a stratified search and grounding market rather than one flat API category. Exa and Tavily are the closest AI-native peers, You.com and Perplexity sell more answer-centric research layers, and legacy or bundled options from Serper, SerpAPI, Brave, Google, Microsoft, OpenAI, and Anthropic keep pricing transparent and switching friction relatively low. The practical moat is therefore provenance, model neutrality, and workflow-tuned retrieval—not generic web access."
  },
