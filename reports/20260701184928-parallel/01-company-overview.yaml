- id: section-4
  title: Milestones, partnerships, and adverse web-access friction
  body: >-
    The company overview also needs one clean chronology that later chapters can reuse without rediscovering dates. The strongest version begins with 2023 formal formation, then January 2024 seed financing, August 2025 public launch, November 2025 Series A, February 2026 publisher-accountability escalation, April 2026 Genpact partnership, and April 2026 Series B. The Genpact announcement is especially useful because it moves Parallel from abstract infrastructure rhetoric into a partner-described production setting with insurance and sales workflows, cited outcome metrics, and evidence that regulated-industry customers value fresh web research.


    The adverse side of the chronology is equally important. Parallel’s whole thesis depends on open-web access just as publishers and trade groups are becoming more hostile to AI scraping. Press Gazette documented third-party scraper tactics around publisher defenses, MediaPost covered the IAB’s proposed anti-scraping legislation, and The Current described rising bot activity and escalating publisher resistance. Parallel’s answer is an ‘open market mechanism’ that would compensate content owners, but no public source yet shows scaled commercial adoption of that mechanism. Investors should therefore treat web-access economics and publisher relations as core diligence issues, not side notes.
  claimRefs:
