  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding-timeline
    missingEvidence: A company-authored or filing-grade explanation that reconciles 2023 formal formation with the 2024 first-funding milestone and clarifies what date management wants investors to treat as founding.
    whyItMatters: The founding date is a basic identity fact reused across legal, talent, and capital narratives, and the current public record supports a formation window rather than one clean year.
    diligencePath: Ask management for incorporation documents, formation memo, and a canonical corporate timeline used in board and financing materials.
    relatedQuestionRefs:
    - QO003
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: leadership-depth
    missingEvidence: A current executive roster, org chart, and clearer disclosure of independent versus investor-controlled governance roles.
    whyItMatters: Key-person concentration is visible today, but the public record does not reveal whether there is enough operational depth under Parag Agrawal to de-risk execution.
    diligencePath: Request the latest org chart, board roster, committee structure, and biographies for functional leaders below the CEO.
    relatedQuestionRefs:
    - QO009
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: current-scale-metrics
    missingEvidence: Current 2026 headcount, exact paying-customer count, revenue, ARR, and major retention or growth metrics.
    whyItMatters: The public traction picture is promising, but valuation underwriting requires current operating metrics rather than launch-era team size and selected customer anecdotes.
    diligencePath: Ask for a board-ready KPI pack covering headcount by function, customer counts, ARR or revenue run rate, cohort retention, and sales efficiency.
    relatedQuestionRefs:
    - QO018
    - QO020
    relatedTableRefs:
    - TO001
    - TO003
  - type: missing-source
    severity: material
    topic: publisher-compensation-model
    missingEvidence: Signed publisher or content-owner agreements showing how Parallel’s proposed open market mechanism works in practice.
    whyItMatters: Publisher relations and web-access economics are central to product durability, margin structure, and regulatory resilience, yet the public record still describes the mechanism conceptually.
    diligencePath: Request pilot agreements, payout logic, and evidence of live publisher participation or fallback access strategies if content availability narrows.
    relatedQuestionRefs:
    - QO023
    - QO024
    relatedTableRefs:
    - TO003
    - TO004
