- id: named-production-proof
  title: Named production proof and outcome quality
  body: |-
    The best customer proof is genuine production workflow evidence rather than logo placement. Harvey uses Parallel to ground legal reasoning across more than 60 jurisdictions and exposed the provider switch to customers through an admin-level opt-in flow. Opendoor's proof is even more operationally concrete: Parallel automates HOA research inside a public-company real-estate process, cut research time from roughly ten minutes to two minutes, and won a bake-off only after meeting an accuracy bar on messy county and HOA edge cases. Genpact's insurer workflow is similarly strong because the public record claims live production with two top-10 U.S. P&C insurers plus 55% touchless processing and roughly 50% faster cycle time. Profound rounds out the strongest set by embedding Parallel into content agents and compressing research-grounded content creation from days to minutes.

    Notion and Clay are supportable, but weaker, references. Notion's AI lead publicly described Parallel as enabling background research, analysis, and stakeholder work, and Notion's own AI page confirms that its agents operate across connected apps and the web. Clay's site clearly shows AI account research as a core workflow, and independent coverage says Parallel powers the web-research layer. But neither company provided a Parallel-specific case study or quantified outcome in the reviewed source set. Investors should therefore treat Harvey, Opendoor, Genpact-insurer claims, and Profound as production proof, while Notion and Clay remain reference logos with incomplete disclosure depth.
