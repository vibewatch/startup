  layout: standard
  summary: Parallel typically enters through a painful research workflow, passes security and accuracy review, and then expands only if the customer can operationalize citations and controls.
  data:
    items:
    - label: Workflow pain appears
      note: A customer hits a live-web problem that generic search or static databases cannot solve cleanly enough for production.
    - label: Evaluation starts
      note: The buyer compares accuracy, web coverage, citations, and integration fit against alternatives or in-house workarounds.
    - label: Security and governance review
      note: Admins or platform owners examine permissions, SSO, data controls, provenance, and human-review paths.
    - label: Workflow bake-off or controlled rollout
      note: Harvey uses opt-in enablement, Opendoor runs an accuracy bake-off, and Genpact encodes business rules before production.
    - label: Production deployment
      note: Parallel becomes the web-research layer inside a recurring workflow such as HOA checks, legal research, claims pricing, or content grounding.
    - label: Expansion or concentration question
      note: Accounts may widen into more workflows, but public data stops before renewal math, ARR mix, or top-customer concentration.
