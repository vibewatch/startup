  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-disclosure
    missingEvidence: Public or diligence-room disclosure of NRR, GRR, churn, renewal rate, contract duration, and cohort behavior by customer segment.
    whyItMatters: Workflow proof establishes adoption but does not show whether accounts renew or expand economically, which is central to underwriting durability.
    diligencePath: Request customer cohort tables, renewal calendars, and retention metrics by enterprise segment and by top ten accounts.
    relatedQuestionRefs:
    - QU018
    - QU025
  - type: private-evidence-only
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-customer ARR contribution, named-logo revenue mix, and revenue exposure to unnamed banks, hedge funds, and insurer programs.
    whyItMatters: A small set of design partners or platform customers could dominate ARR even if the public logo list looks broad.
    diligencePath: Request top-10 customer concentration, ARR by named account, and channel or partner contribution over the last four quarters.
    relatedQuestionRefs:
    - QU019
    - QU020
    - QU025
  - type: missing-source
    severity: material
    topic: reference-quality
    missingEvidence: Independent case studies or customer-issued documentation for Notion and Clay that describe Parallel-specific deployment scope, rollout depth, and outcomes.
    whyItMatters: The current evidence base for those logos is mostly company or media reference material, which is weaker than production case-study proof.
    diligencePath: Ask for customer references, procurement records, or customer-authored implementation notes from Notion and Clay.
    relatedQuestionRefs:
    - QU010
    - QU011
    - QU021
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: minor
    topic: developer-conversion
    missingEvidence: Disclosure that connects the 100,000+ developer figure to active paid accounts, enterprise customers, or usage-based revenue.
    whyItMatters: Developer usage can be a strong top-of-funnel signal, but it does not by itself prove durable enterprise monetization.
    diligencePath: Request paid-account conversion, enterprise-logo conversion, and revenue concentration by self-serve versus enterprise channels.
    relatedQuestionRefs:
    - QU017
    - QU025
