  topStrengths:
    - 'Product scope aligns with a real agent need: fresh, cited, machine-ready web access.'
    - Elite repeat investors and a fast Series A-to-B progression validate category importance.
    - Named workflow proof exists across Harvey, Opendoor, Genpact, and other enterprise contexts.
    - Developer adoption exceeds 100,000 publicly cited users, creating a plausible bottoms-up wedge.
  topRisks:
    - Revenue, ARR, gross margin, retention, and concentration are still undisclosed.
    - OpenAI, Anthropic, and other bundled agent platforms may compress differentiation and pricing.
    - Publisher backlash, anti-scraping rules, and future licensing costs may raise COGS or limit coverage.
    - Leadership visibility and key-person dependence remain concentrated around Parag Agrawal.
  unresolvedGaps:
    - Current ARR, revenue by product, gross margin, burn, and runway are not public.
    - Paid conversion from the 100,000-plus developer base and total paying-customer count are undisclosed.
    - Series B terms, secondary components, and any preference overhang are not publicly disclosed.
    - Sustainable publisher-access economics and scaled licensing coverage remain unproven.
