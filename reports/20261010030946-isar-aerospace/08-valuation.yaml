callouts:
  - calloutType: "recommendation"
    title: "Disciplined Underwriting: Why Research-More Overrides Momentum"
    body: "While reaching orbit on September 5, 2026, cements Isar Aerospace as the premier continental European launcher candidate, investors must distinguish technical breakthroughs from underwriteable risk-adjusted value. At an implied post-money valuation between €1.9 billion and €2.4 billion, common equity investors are paying a premium multiple before the company has demonstrated recurring commercial cadence, positive unit economics, or transparent backlog payment milestones."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV008"
      - "CV014"
  - calloutType: "risk"
    title: "Capital Intensity and Downside Dilution Exposure"
    body: "Isar Aerospace consumed €106 million in operating cash during 2024, leaving €29.7 million at year-end prior to bridging with €150 million in Eldridge convertible debt and the €270 million Series D. In a capital-intensive serial production ramp, any launch anomaly or multi-quarter fleet grounding could rapidly deplete liquidity and trigger dilutive down-round recaps or structured debt overhangs."
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
