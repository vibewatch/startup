company:
  name: "Isar Aerospace"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Isar Aerospace is a German orbital launch service provider developing the two-stage Spectrum vehicle to provide flexible small-satellite access to space. Founded in 2018 out of the Technical University of Munich, the company has accumulated approximately EUR 870 million in total funding through its June 2026 Series D. On September 5, 2026, Isar Aerospace achieved the first successful commercial orbital launch from continental Europe on its second flight from Andøya Spaceport, overcoming an initial maiden flight failure in March 2025."
sections:
  - id: "corporate-identity-and-facilities"
    title: "Corporate Identity, Foundation, and Industrial Footprint"
    body: "Isar Aerospace SE is a private German aerospace manufacturer founded in March 2018 by Daniel Metzler, Josef Fleischmann, and Markus Brandl following their work on the Technical University of Munich student rocketry team WARR. The company develops Spectrum, a 28-meter tall, two-meter diameter two-stage small-lift launch vehicle utilizing clean-burning liquid oxygen and propane propellants. Spectrum is engineered to deploy payloads of up to 1,000 kilograms into low Earth orbit and 700 kilograms into sun-synchronous orbit, powered by nine in-house developed Aquila engines on the first stage and one vacuum-optimized restartable Aquila engine on the second stage. The company operates from its corporate headquarters in Ottobrunn near Munich and is expanding into a newly constructed 40,000 square meter headquarters and manufacturing facility in Parsdorf, designed for serial production of up to 40 Spectrum rockets per year. Isar Aerospace maintains engine testing facilities in Kiruna, Sweden, orbital launch operations at Andøya Spaceport in Norway, and planned launch pads at the Guiana Space Centre in French Guiana and Spaceport Nova Scotia in Canada."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Organizational Structure"
    body: "Isar Aerospace is directed by Chief Executive Officer Daniel Metzler, who co-founded the business alongside Markus Brandl and Josef Fleischmann. Governance is chaired by former SpaceX vice president Bulent Altan, providing substantial commercial launch and avionics engineering experience to the board. The organization experienced a significant executive transition on September 21, 2026, when co-founder Josef Fleischmann stepped down from his combined Chief Operating Officer and Chief Technology Officer roles to establish an in-orbit computing company, Bavaria Instruments. Following Fleischmann operational departure, veteran engineering leader Can Araz, who joined at company founding, was promoted to Chief Technology Officer, while Patrick Adcock assumed oversight of global manufacturing operations. Commercial strategy is directed by Chief Commercial Officer Stella Guillen, who oversees international launch sales and sovereign mission manifests. The company employs over 400 specialists representing more than 50 nationalities across five international locations, with external industry estimates citing between 500 and 774 personnel in mid-2026."
    claimRefs:
      - "CO001"
      - "CO003"
      - "CO004"
      - "CO010"
    tableRefs:
      - "TO002"
  - id: "capitalization-history-and-investor-structure"
    title: "Capitalization History, Funding Rounds, and Investor Base"
    body: "Isar Aerospace has established one of the most heavily capitalized private balance sheets in the global launch sector, raising approximately EUR 870 million in cumulative equity, convertible debt, and public milestone grants. Initial venture funding was secured through a USD 17 million Series A in December 2019 led by Earlybird Venture Capital and Airbus Ventures, followed by a USD 91 million Series B in December 2020 led by Lakestar. In March 2023, the company raised a USD 165 million Series C backed by 7-Industries Holding, Bayern Kapital, and Porsche Automobil Holding SE. In June 2025, Isar Aerospace bolstered its production liquidity with a EUR 150 million convertible bond commitment from Eldridge Industries. Most recently, on June 9, 2026, the company completed a EUR 270 million Series D financing round co-led by Island Green Capital and Molten Ventures alongside existing backers HV Capital, Lakestar, and UVC Partners. Bloomberg reported in March 2026 that Series D discussions targeted a valuation of roughly EUR 2 billion, although final terms and post-money valuation metrics were not officially disclosed."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO003"
  - id: "flight-test-campaign-and-operational-milestones"
    title: "Flight Test Campaign, Maiden Failure, and Orbital Qualification"
    body: "Isar Aerospace orbital development program achieved flight validation through a rigorous two-mission test campaign from its dedicated pad at Andøya Spaceport in Norway. The maiden test flight, designated Going Full Spectrum, launched on March 30, 2025, but experienced a catastrophic loss of attitude control at T+25 seconds after an unexpected vent valve opening during its pitch-over maneuver, prompting an automated flight termination command at T+30 seconds that dropped the vehicle into the Norwegian Sea. Following extensive root-cause investigation, software upgrades, and structural margin enhancements, the team prepared its second flight, Onward and Upward. The campaign endured multiple scrubbed attempts in early 2026 due to faulty pressurization valves, harsh Arctic weather, range safety violations, elevated engine fuel temperatures, and fluid system anomalies. On September 5, 2026, Spectrum lifted off successfully, executed stage separation, and reached sun-synchronous orbit, deploying five customer CubeSats and proving orbital delivery capability for European small-launch customers."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
    figureRefs:
      - "FO001"
