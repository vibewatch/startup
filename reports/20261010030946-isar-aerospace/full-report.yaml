      - number: '1.3'
        title: Capitalization History, Funding Rounds, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace has established one of the most heavily capitalized private balance sheets in the global
              launch sector, raising approximately EUR 870 million in cumulative equity, convertible debt, and public
              milestone grants. Initial venture funding was secured through a USD 17 million Series A in December 2019
              led by Earlybird Venture Capital and Airbus Ventures, followed by a USD 91 million Series B in December
              2020 led by Lakestar. In March 2023, the company raised a USD 165 million Series C backed by 7-Industries
              Holding, Bayern Kapital, and Porsche Automobil Holding SE. In June 2025, Isar Aerospace bolstered its
              production liquidity with a EUR 150 million convertible bond commitment from Eldridge Industries. Most
              recently, on June 9, 2026, the company completed a EUR 270 million Series D financing round co-led by
              Island Green Capital and Molten Ventures alongside existing backers HV Capital, Lakestar, and UVC
              Partners. Bloomberg reported in March 2026 that Series D discussions targeted a valuation of roughly EUR 2
              billion, although final terms and post-money valuation metrics were not officially disclosed.
            claimRefs:
