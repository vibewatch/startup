  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Institutional Demand Drivers
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace addresses a tri-part customer universe defined by commercial small-satellite operators,
              sovereign European defense and civil space agencies, and third-party mission aggregation brokers. The core
              commercial segment comprises NewSpace constellation builders requiring dedicated or rideshare orbital
              insertion for communications, Earth observation, and IoT payloads. In parallel, European defense and
              institutional entities represent an anchor buyer profile motivated by geopolitical necessity; following
              the retirement of Russian Soyuz launch capacity in 2022 and persistent operational delays with the Vega
              rocket series, European institutional planners face a critical deficit in sovereign access to space.
              Consequently, civil agencies such as the European Space Agency and national defense ministries view
              commercial launchers like Spectrum as essential strategic assets to preserve regional autonomous launch
              capability. Beyond orbital launch services, the company maintains a direct-to-consumer digital storefront
              marketing branded merchandise to retail enthusiasts, though launch service contracting remains the sole
              meaningful economic engine.
