      - number: '6.3'
        title: Operational Flight Qualification and Deployed Customer Payloads
        blocks:
          - type: paragraph
            body: >-
              Customer adoption reached operational validation on September 5, 2026, when Isar Aerospace launched its
              second Spectrum orbital mission, designated Onward and Upward, from the Orbital Launch Pad at Andøya
              Spaceport in Norway. The flight successfully achieved orbit and deployed Spectrum's initial cohort of six
              customer payloads, qualifying the two-stage launch vehicle under genuine operational conditions. The
              flight manifest integrated an experimental deployment from German hardware manufacturer Dcubed alongside
              five cubesats: TU Berlin's CybeeSat, Norway's NTNU FramSat-1, the University of Maribor's TriSat-S, TU
              Wien's SpaceTeamSat-1, and EnduroSat's commercial Platform 6. Deployer hardware was integrated in
              collaboration with smallsat aggregator Exolaunch. This orbital milestone succeeded an initial test flight
              failure in March 2025, where an unintended vent valve opening caused flight termination at T+30 seconds,
              followed by months of launch scrubs throughout 2026 due to pressure valve anomalies, thermal transients,
              and fluid system issues.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
