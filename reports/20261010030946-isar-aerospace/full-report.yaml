      - number: '4.2'
        title: Cost base and launch-cadence sensitivity
        blocks:
          - type: paragraph
            body: >
              The public cost thesis rests on manufacturing scale, not disclosed accounting. Isar says automation,
              additive manufacturing, carbon composites, and vertical integration are intended to reduce launch cost,
              but no retained source quantifies vehicle cost, launch-site expense, utilization, or gross margin.
              Independent reporting records repeated 2026 scrubs involving a pressurization valve, weather and range
              issues, a suspected pressure-vessel leak, and fluid-system behavior before the successful September
              mission. Those delays lengthen campaigns and plausibly add standing labor, range, and working-capital
              exposure, but the amount is unavailable. A credible margin case therefore requires both repeatable cadence
              and evidence that serial production lowers fully loaded cost per delivered mission.
            claimRefs:
              - CI007
              - CI014
              - CI015
      - number: '4.3'
        title: Capitalization signals do not establish runway
        blocks:
          - type: paragraph
            body: >
              Public capitalization data are internally inconsistent and should not be promoted to a single precise
              total. Multiples.vc reports $912 million across seven rounds, while Silicon Valley Investclub reports $671
              million-plus across six rounds; the company homepage separately states more than €500 million of private
              capital. These measures may differ by currency, cut-off date, grants, debt, or round treatment, but the
              retained sources do not reconcile their denominators. Multiples.vc also reports a €270 million June 2026
              Series D intended for global scaling and serial production and a $1.1 billion June 2025 valuation, while
              another profile says a reliably sourced latest valuation is unavailable. None of these financing figures
              equals cash currently available, and none establishes net burn or runway.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
              - CI016
      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >
              Revenue quality is not yet underwritable from public evidence. The business can become attractive if
              successful orbital delivery converts into repeat missions, standardized integration, higher factory
              utilization, and positive contribution margin; however, the retained public sources do not disclose
              revenue or profitability. They also do not provide cash on hand, monthly burn, customer deposits,
              cancellation rights, payment milestones, debt obligations, insurance cost, regulatory cost, or per-launch
              gross profit. Management accounts and contract-level evidence are therefore required to distinguish funded
              industrial progress from a capital-intensive program that needs another round before reaching sustainable
              cadence. Until those materials are reviewed, funding raised is only a financing signal, not proof of
              liquidity or economic viability.
            claimRefs:
