      - number: '6.4'
        title: Contract Durability, Intermediary Dependence, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace's commercial expansion strategy relies heavily on multi-mission agreements with launch
              brokers and institutional anchor initiatives. In September 2026, the company expanded its contractual
              agreement with U.S.-based mission integrator SEOPS by adding five Spectrum launches, bringing its total
              contracted manifest with SEOPS to six dedicated flights through 2030. In the institutional sector, Isar
              Aerospace secured two launch service agreements under the European Space Agency Flight Ticket Initiative
              to launch CASSINI and Tom and Jerry commercial missions, alongside planned flights for the Norwegian Space
              Agency and Redwire. While these multi-flight arrangements provide forward manifest visibility, they
              introduce significant counterparty and aggregator concentration risks. Aggregators capture customer
              relationships and negotiate volume discounts, buffering Isar Aerospace from direct constellation accounts.
              Furthermore, public disclosures provide no verified net revenue retention metrics, customer renewal rates,
              or cohort retention statistics, leaving post-qualification customer lifetime value unvalidated.
            claimRefs:
              - CU005
              - CU010
              - CU011
              - CU014
