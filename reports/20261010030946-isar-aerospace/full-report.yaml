          - type: callout
            title: Subsystem Sensitivity and Industrial Scaling Chasm
            body: >-
              Pre-launch delays caused by pressurization valve glitches, COPV leaks, and fluid anomalies indicate tight
              technical margins, while scaling from a single qualification flight to a 40-vehicle annual cadence poses
              severe industrialization risks.
            calloutType: risk
            claimRefs:
              - CE009
