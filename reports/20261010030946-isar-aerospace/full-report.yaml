  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change the View
    rows:
      - - Investment Thesis
        - Sovereign European launch monopoly potential in a structurally supply-constrained market.
        - >-
          Over 60% defense demand shift, NATO Innovation Fund backing, and ESA European Launcher Challenge anchor
          contracts.
        - Rapid competitive entry by RFA or Ariane 6 capturing institutional small-satellite launch manifests.
      - - Investment Thesis
        - Proven orbital delivery capability and vertically integrated serial manufacturing.
        - Second test flight achieved orbit and deployed five customer CubeSats from Andøya on September 5, 2026.
        - Catastrophic mission loss on Flight 3 or persistent staging anomalies that ground the Spectrum fleet.
      - - Anti-Thesis
        - Valuation prices future execution perfection ahead of commercial revenue visibility.
        - Implied €1.9B–€2.4B valuation with zero reported revenue in 2023–2024 and unproven multi-flight cadence.
        - Rapid commercial flight cadence (>=4 orbital flights in 2027) with profitable realized launch contracts.
      - - Anti-Thesis
        - Severe balance sheet cash consumption and reliance on complex convertible instruments.
        - >-
          €106M operating cash burn in 2024, €150M Eldridge convertible bond conversion, and prior 2021 audit
          qualification.
        - >-
          Delivery of audited 2025–2026 financial accounts demonstrating positive operating cash flow and extended
          runway.
    notes: >-
      Primary sources: Munich commercial register, ESA contract documentation, and Flight 1/2 flight event data; thesis
      balance compares sovereign strategic moat against commercial execution hurdles.
