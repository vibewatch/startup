        title: Executive Leadership, Governance, and Organizational Structure
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace is directed by Chief Executive Officer Daniel Metzler, who co-founded the business
              alongside Markus Brandl and Josef Fleischmann. Governance is chaired by former SpaceX vice president
              Bulent Altan, providing substantial commercial launch and avionics engineering experience to the board.
              The organization experienced a significant executive transition on September 21, 2026, when co-founder
              Josef Fleischmann stepped down from his combined Chief Operating Officer and Chief Technology Officer
              roles to establish an in-orbit computing company, Bavaria Instruments. Following Fleischmann operational
              departure, veteran engineering leader Can Araz, who joined at company founding, was promoted to Chief
              Technology Officer, while Patrick Adcock assumed oversight of global manufacturing operations. Commercial
              strategy is directed by Chief Commercial Officer Stella Guillen, who oversees international launch sales
              and sovereign mission manifests. The company employs over 400 specialists representing more than 50
              nationalities across five international locations, with external industry estimates citing between 500 and
              774 personnel in mid-2026.
