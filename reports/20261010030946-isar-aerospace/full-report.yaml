        title: Exhibits
        blocks:
          - type: callout
            title: European Orbital First from Continental Soil
            body: >-
              Achieving successful orbital insertion and payload separation on its second test flight validates Isar
              Aerospace's ten-engine architecture and establishes Spectrum as continental Europe's first operational
              private orbital launcher.
            calloutType: strength
            claimRefs:
