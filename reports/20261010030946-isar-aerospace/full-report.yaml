      - number: '6.2'
        title: Commercial Adoption Trajectory and Pipeline Transparency
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace's commercial pipeline has evolved from early non-binding expressions of interest to
              contracted flight reservations and manifest commitments. In December 2020, concurrent with its Series B
              financing round, the company publicly highlighted that commercial customer inquiries exceeded half a
              billion USD ($500 million), indicating substantial market appetite for small-satellite launch alternatives
              in Europe. However, translating exploratory commercial inquiries into legally enforceable launch service
              agreements with binding upfront cash deposits remains an opaque dimension of the company's financial
              model. The commercial launch market typically features customer down payments tied to milestone reviews,
              but Isar Aerospace does not publicly disclose contract-level backlog economics, deposit schedules, or
              milestone payment structures. While the customer inquiry figure established early pipeline scale,
              verifying actual cash-backed customer commitment requires scrutiny of non-refundable down-payment terms
              and contract duration.
