      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV013
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Cadence & Operating Assumptions
      - Implied Valuation / Return Logic
      - Key Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Spectrum achieves 6–8 commercial launches/year by 2028; average realization €10M–€12M/flight; defense
          contracts expand margin.
        - €3.0B–€4.0B valuation at 8x–10x revenue exit; 1.5x–2.0x MOIC from Series D entry.
        - Launch cadence bottlenecks, second-stage restart failure, or European defense budget reallocations.
        - 25%
      - - Base Case
        - >-
          Spectrum completes 2–4 launches/year through 2028; revenue reaches €25M–€45M; ongoing subsidies required for
          factory overhead.
        - >-
          €1.8B–€2.2B valuation mark; capital preservation to modest 1.0x–1.2x return; additional dilutive financing
          required.
        - Production delays at Parsdorf facility, slow launch site commissioning in Nova Scotia, margin compression.
        - 50%
      - - Bear Case
        - >-
          Operational anomaly causes launch pause (>12 months); commercial customers defect to SpaceX rideshare; cash
          runway drains.
        - >-
          €600M–€900M distressed recapitalization or down-round; substantial equity dilution from convertible
          liquidation preferences.
        - Flight failure, regulatory grounding, or loss of ESA anchor institutional funding commitments.
        - 25%
    notes: >-
      Primary sources: Bundesanzeiger historical accounts, Series D terms, and launcher pricing benchmarks; scenarios
      model Spectrum flight cadence, revenue ramp, and margin assumptions.
