            title: First Continental European Commercial Orbital Launch
            body: >-
              By reaching a sun-synchronous orbit on September 5, 2026, Isar Aerospace validated its two-stage
              liquid-propellant architecture and became the first commercial venture to achieve orbit from continental
              Europe, establishing a critical technological lead over regional small-launch competitors.
