chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Foundation, and Industrial Footprint
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace SE is a private German aerospace manufacturer founded in March 2018 by Daniel Metzler,
              Josef Fleischmann, and Markus Brandl following their work on the Technical University of Munich student
              rocketry team WARR. The company develops Spectrum, a 28-meter tall, two-meter diameter two-stage
              small-lift launch vehicle utilizing clean-burning liquid oxygen and propane propellants. Spectrum is
              engineered to deploy payloads of up to 1,000 kilograms into low Earth orbit and 700 kilograms into
              sun-synchronous orbit, powered by nine in-house developed Aquila engines on the first stage and one
              vacuum-optimized restartable Aquila engine on the second stage. The company operates from its corporate
              headquarters in Ottobrunn near Munich and is expanding into a newly constructed 40,000 square meter
              headquarters and manufacturing facility in Parsdorf, designed for serial production of up to 40 Spectrum
              rockets per year. Isar Aerospace maintains engine testing facilities in Kiruna, Sweden, orbital launch
              operations at Andøya Spaceport in Norway, and planned launch pads at the Guiana Space Centre in French
              Guiana and Spaceport Nova Scotia in Canada.
            claimRefs:
