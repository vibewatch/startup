            - Flexible lead customer versus standard rideshare booking
        - label: 3. Aggregator & Institutional Contracting
          summary: Intermediaries like SEOPS and institutional programs like ESA Flight Ticket secure flight capacity.
          touchpoints:
            - Multi-mission block agreements through 2030
            - Institutional grant and Flight Ticket subsidy execution
        - label: 4. Technical Integration & Processing
          summary: Payload adapter mating, cleanroom integration, and deployer installation at Andøya Spaceport.
          touchpoints:
