      - number: '7.2'
        title: Technical Flight Heritage and Operational Execution Risks
        blocks:
          - type: paragraph
            body: >-
              The technical risk profile of the Spectrum vehicle is defined by early flight failure followed by orbital
              recovery. The maiden flight on March 30, 2025 was terminated approximately 30 seconds after liftoff when
              an unintended vent valve opening during the pitch-over maneuver caused loss of attitude control, forcing a
              range safety abort. After engineering corrective actions, software upgrades, and hot-fire tests, the
              second mission endured four launch scrubs between January and June 2026 due to pressurization valve
              faults, safety perimeter range violations, composite overwrapped pressure vessel leaks, and fluid system
              anomalies. On September 5, 2026, Spectrum achieved orbit and payload deployment, yet transition from a
              single successful demonstration to an operational commercial cadence remains a primary execution hurdle.
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR010
          - type: table
            tableRef: TR002
