      - number: '1.4'
        title: Flight Test Campaign, Maiden Failure, and Orbital Qualification
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace orbital development program achieved flight validation through a rigorous two-mission test
              campaign from its dedicated pad at Andøya Spaceport in Norway. The maiden test flight, designated Going
              Full Spectrum, launched on March 30, 2025, but experienced a catastrophic loss of attitude control at T+25
              seconds after an unexpected vent valve opening during its pitch-over maneuver, prompting an automated
              flight termination command at T+30 seconds that dropped the vehicle into the Norwegian Sea. Following
              extensive root-cause investigation, software upgrades, and structural margin enhancements, the team
              prepared its second flight, Onward and Upward. The campaign endured multiple scrubbed attempts in early
              2026 due to faulty pressurization valves, harsh Arctic weather, range safety violations, elevated engine
              fuel temperatures, and fluid system anomalies. On September 5, 2026, Spectrum lifted off successfully,
              executed stage separation, and reached sun-synchronous orbit, deploying five customer CubeSats and proving
              orbital delivery capability for European small-launch customers.
            claimRefs:
              - CO012
              - CO013
              - CO014
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO005
              - CO006
              - CO007
              - CO012
              - CO014
