      - number: '7.3'
        title: Launch Concessions, Infrastructure, and Counterparty Commitments
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace faces geographic concentration risk across its launch infrastructure. European orbital
              launches currently depend entirely on the Andøya Space Center in Norway, where Isar secured an exclusive
              pad concession for up to twenty years. While providing dedicated access, any physical pad mishap, harsh
              Arctic weather pattern, or local range restriction would immediately halt all orbital operations.
              Potential diversification remains nascent: Isar has not established an operational pad at the Guiana Space
              Centre in Kourou, holding only an early CNES feasibility agreement. Meanwhile, an international agreement
              with Maritime Launch Services for Spaceport Nova Scotia in Canada introduces long-term financial
              commitments, requiring quarterly payments of 3.75 million US dollars after a thirty-month waiver, prior to
              established commercial flight revenue.
            claimRefs:
              - CR005
              - CR006
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
