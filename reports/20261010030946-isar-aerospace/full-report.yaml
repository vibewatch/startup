  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Sizing Lenses, and Addressable Spend
        blocks:
          - type: paragraph
            body: >-
              The commercial space transportation sector is undergoing a structural transition characterized by the
              proliferation of small-to-medium satellite constellations in Low Earth Orbit (LEO) and Sun-Synchronous
              Orbit (SSO). Historically, satellite operators faced severe access bottlenecks governed by large,
              infrequently launched vehicles where booking secondary payload space required multi-year planning horizons
              and steep costs between $30,000 and $40,000 per kilogram. Isar Aerospace defines its addressable market
              boundary around dedicated and flexible launch services for payloads up to 1,000 kilograms to LEO
              (approximately 700 kilograms to SSO), intentionally excluding heavy-lift telecommunications platforms,
              human spaceflight missions, and deep-space infrastructure that remain the domain of heavy launch vehicles
              such as Ariane 6 and Falcon 9. Macro-level market projections articulated by Isar management foresee the
              global space launch services market expanding to over 30 billion euros by 2027 within a wider
              trillion-dollar space economy by 2040. However, underwriting this addressable market requires isolating
              the small launcher segment from aggregate launch spending. Independent benchmark analysis reveals that
              dedicated small launch pricing in 2026 dollars ranges from $7,600 to $31,000 per kilogram depending on
              vehicle capacity and orbit, while heavy-lift rideshare seats average roughly $7,000 per kilogram.
              Spectrum's target pricing of approximately 10,000 euros per kilogram (around 10 million euros per
              dedicated launch) positions the company squarely in the mid-tier of dedicated small-launch providers,
              seeking to capture premium commercial spend from operators willing to pay for schedule certainty and
              custom orbital insertion rather than waiting for bulk rideshare missions.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
