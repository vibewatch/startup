  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Spectrum Launch Vehicle and Orbital Delivery Architecture
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace's primary commercial product is Spectrum, a two-stage liquid-propellant orbital launch
              vehicle designed specifically for flexible deployment of small and medium-sized satellite payloads into
              low Earth orbit and sun-synchronous orbit. Standing 28 meters tall with a 2-meter diameter, the vehicle is
              engineered to transport payloads of up to 1,000 kilograms to low Earth orbit and up to 700 kilograms to
              sun-synchronous orbit, providing dedicated and rideshare options for satellite constellations, academic
              institutions, and commercial operators. On 5 September 2026, Spectrum achieved a historic milestone for
              European commercial spaceflight during its second qualification mission, designated 'Onward and Upward.'
              Lifting off from Isar Aerospace's dedicated launch complex at Launch Pad 1 of Andøya Spaceport in northern
              Norway, the rocket completed a nominal ascent profile, transited maximum dynamic pressure (MaxQ), executed
              main engine cutoff (MECO) and stage separation, ignited its upper stage, and successfully deployed five
              customer CubeSats along with an in-orbit technology demonstration into a 500-kilometer orbit. This flight
              verified the end-to-end orbital delivery capability of continental Europe's first privately developed
              orbital rocket, fulfilling the primary technical milestone of the European Space Agency's European
              Launcher Challenge.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE012
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE012
      - number: '5.2'
        title: Aquila Propulsion, Additive Manufacturing, and Vertical Integration
        blocks:
          - type: paragraph
            body: >-
              The core technological foundation of Spectrum is Isar Aerospace's proprietary Aquila rocket engine, which
              operates on a bipropellant combination of liquid oxygen and propane. Propane provides higher density and
              cleaner combustion characteristics than conventional kerosene, simplifying propellant handling and
              reducing soot accumulation in turbomachinery. Spectrum's first stage is powered by a cluster of nine
              sea-level Aquila engines, while the second stage utilizes a single vacuum-optimized Aquila engine
              engineered for multiple in-space restart cycles required for complex orbital insertion profiles. Rather
              than relying on traditional aerospace subcontracting models across fragmented European defense suppliers,
              Isar Aerospace pursues deep vertical integration, developing its propulsion systems, carbon composite
              airframes, avionics, guidance systems, and launch facility control software almost entirely in-house. A
              central differentiator in Isar's manufacturing strategy is the extensive deployment of additive
              manufacturing: combustion chambers and turbopump housings are 3D-printed in metal at the company's Munich
              production center, dramatically reducing component counts, lead times, and manufacturing overhead compared
              to subtractive machining. Production quality assurance is maintained through highly automated test
              facilities utilizing Beckhoff PC-based control and EtherCAT architectures at Ottobrunn and Esrange Space
              Center in Kiruna, Sweden, where expanded test stands support throughput exceeding 30 engine acceptance
              firings per month.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE008
              - CE015
          - type: figure
            figureRef: FE001
            claimRefs:
