        title: Exhibits
        blocks:
          - type: callout
            title: Aggregator Intermediaries Dominate Commercial Backlog
            body: >-
              While Isar Aerospace markets direct launch booking, key commercial volume is secured through third-party
              mission aggregators like SEOPS, shifting end-customer relationship ownership and margin capture to service
              intermediaries.
            calloutType: insight
            claimRefs:
