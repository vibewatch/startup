  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Licensing, and Jurisdictional Posture
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace operates under German and European Union jurisdiction, having restructured its legal form
              from a German limited liability company (GmbH) to a European public company (Societas Europaea, SE)
              registered with the Munich District Court under HRB 290907. This corporate conversion reflects preparation
              for eventual public market access and international expansion. Commercial registry filings define the
              company's scope around the development, production, and qualification of orbital rocket motors and launch
              systems. While the corporate foundation is formalized, historical financial disclosures reveal past
              vulnerability: Deloitte issued an audit disclaimer on Isar Aerospace's 2021 financial statements due to
              unconfirmed financing commitments prior to the Series C round, though subsequent audits received
              unqualified opinions following substantial equity injections.
            claimRefs:
              - CR001
              - CR002
              - CR009
