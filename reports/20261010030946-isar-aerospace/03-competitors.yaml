callouts:
  - calloutType: "risk"
    title: "The Starship and Falcon 9 Rideshare Pricing Umbrella"
    body: "SpaceX's Transporter rideshare program imposes a severe pricing ceiling on small launchers by offering slots at approximately $7,000 to $7,500 per kilogram to Sun-Synchronous Orbit. While dedicated launchers like Spectrum provide orbital customization and schedule autonomy, sustaining price points between $12,700 and $15,300 per kilogram requires commercial buyers to value orbital timing and insertion precision above baseline launch ticket economics."
    claimRefs:
      - "CP006"
      - "CP011"
  - calloutType: "strength"
    title: "European Sovereign Launch Mandate and ELC Backing"
    body: "The European Space Agency's EUR 200 million commitment under the European Launcher Challenge reinforces a captive institutional market for domestic launchers. With Russian Soyuz vehicles unavailable and Vega C facing constrained cadence, Isar Aerospace holds a privileged political moat as the sole privately financed European launcher to demonstrate orbital capability."
    claimRefs:
      - "CP003"
      - "CP008"
      - "CP013"
