companyProfile:
  summary: >-
    Isar Aerospace is a German launch-service company developing the Spectrum small-lift orbital vehicle and launch
    services for commercial, institutional, and sovereign customers. Founded in 2018 out of the Technical University of
    Munich's WARR rocketry ecosystem, the company is headquartered near Munich, has built a vertically integrated
    manufacturing and launch footprint across Germany, Sweden, Norway, and planned overseas sites, and on September 5,
    2026 became the first commercial venture from continental Europe to reach orbit on its second Spectrum flight. The
    company remains privately held and funding-rich, but public evidence still leaves revenue, burn, backlog economics,
    and contract-level unit economics opaque.
