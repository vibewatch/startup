  topStrengths:
    - Orbital success on the second Spectrum flight establishes real launch capability.
    - >-
      Strong sovereign demand, including ESA and defense-adjacent customer interest, supports a long runway for launch
      demand.
    - Large private capital base gives the company more flexibility than most launcher peers.
  topRisks:
    - Audited revenue, burn, and gross-margin data are still unavailable publicly.
    - Launch cadence and execution remain unproven beyond a single orbital success.
    - Infrastructure concentration and capital intensity could pressure liquidity if cadence slips.
