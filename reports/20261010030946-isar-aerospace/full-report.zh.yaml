      - number: '1.4'
        title: 飞行测试、首次失败与入轨认证
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 的轨道开发计划在挪威 Andøya Spaceport 专用发射台开展两次任务测试，最终完成飞行验证。首次测试飞行名为 Going Full Spectrum，于 2025 年 3
              月 30 日发射；但俯仰转向过程中排气阀意外打开，导致 T+25 秒姿态控制灾难性丧失，随后在 T+30 秒触发自动飞行终止指令，火箭坠入挪威海。团队完成深入根因调查、软件升级和结构裕度增强后，准备第二次飞行
              Onward and Upward。2026 年初，故障增压阀、严酷北极天气、靶场安全违规、发动机燃料温度升高和流体系统异常导致多次尝试取消。2026 年 9 月 5 日，Spectrum
              成功升空，完成级间分离并进入太阳同步轨道，释放 5 颗客户 CubeSat，证明其为欧洲小型发射客户提供轨道交付的能力。
