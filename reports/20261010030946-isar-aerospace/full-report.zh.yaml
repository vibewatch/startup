      - number: '4.4'
        title: 财务结论与尽调阻碍
        blocks:
          - type: paragraph
            body: >
              仅凭公开证据，收入质量尚不能纳入投资判断。如果成功入轨能转化为重复任务、标准化集成、更高工厂利用率和正向贡献利润，这项业务会变得有吸引力；但保留的公开来源没有披露收入或盈利能力，也没有提供手头现金、月度现金消耗、客户定金、取消权、付款里程碑、债务义务、保险成本、监管成本或每次发射的毛利。因此需要管理层账目和合同层面证据，区分有资金支持的工业进展与一个在达到可持续节奏前还需要再次融资的资本密集型项目。在这些材料审阅前，已筹资金只是融资信号，不能证明流动性或经济可行性。
            claimRefs:
