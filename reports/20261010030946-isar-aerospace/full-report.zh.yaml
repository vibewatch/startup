      - number: '5.2'
        title: Aquila 推进、增材制造与纵向一体化
        blocks:
          - type: paragraph
            body: >-
              Spectrum 的核心技术基础是 Isar Aerospace 自研的 Aquila
              火箭发动机，采用液氧和丙烷双组元推进剂。与传统煤油相比，丙烷密度更高、燃烧更清洁，能简化推进剂处理并减少涡轮机械中的积碳。Spectrum 一级由 9 台海平面 Aquila 发动机组成的集群驱动，二级使用 1
              台真空优化 Aquila 发动机，支持复杂轨道注入所需的多次太空重启。Isar Aerospace
              不依赖分散的欧洲国防供应商和传统航天分包模式，而是深度纵向一体化，几乎完全在内部开发推进系统、碳复合材料箭体、航空电子、制导系统和发射设施控制软件。其制造战略的一项核心差异，是广泛使用增材制造：在慕尼黑生产中心以金属
              3D 打印制造燃烧室和涡轮泵壳体，相比减材加工大幅减少零部件数量、交付周期和制造间接成本。生产质量保证依靠高度自动化的测试设施，在 Ottobrunn 和瑞典 Kiruna 的 Esrange Space
              Center 使用 Beckhoff 基于 PC 的控制和 EtherCAT 架构；扩建后的试车台每月支持超过 30 次发动机验收点火。
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
