  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 以轨道验证、主权需求顺风、资本结构约束和商业定价摩擦为决策框架，得出“继续研究”的立场。
    approximationNotes: 展示从技术资质认证到商业投资判断的逐级逻辑进程，以及各阶段的门槛。
    claimRefs:
      - CV003
      - CV011
      - CV013
      - CV014
    data:
      nodes:
        - id: orbital-validation
          label: 轨道飞行验证
          detail: Spectrum Flight 2 于 2026 年 9 月 5 日进入轨道并完成载荷部署。
          status: passed
        - id: sovereignty-demand
          label: 主权需求顺风
          detail: 在 NATO 和 ESA 的机构支持下，新增需求转向国防领域，占比达到 60%。
          status: favorable
        - id: capital-access
          label: 资本获取与 D 轮
          detail: 完成 €270M 的 D 轮融资，并将 €140.5M 可转换债务转为股权。
          status: funded
        - id: valuation-overhang
          label: 估值与流动性门槛
          detail: 投后估值升至 €1.9B–€2.4B，而年度经营现金消耗为 €106M。
          status: stretched
        - id: commercial-friction
          label: 商业节奏摩擦
          detail: 专用小型发射定价为 €10k/kg，持续面临 SpaceX 拼车发射的竞争。
          status: challenging
        - id: underwriting-stance
          label: 建议：继续研究
          detail: 在核实商业积压订单利润率及 2024 年之后经审计的现金消耗前，暂缓买入股权。
          status: neutral
      edges:
        - from: orbital-validation
          to: sovereignty-demand
        - from: sovereignty-demand
          to: capital-access
        - from: capital-access
          to: valuation-overhang
        - from: valuation-overhang
          to: commercial-friction
        - from: commercial-friction
          to: underwriting-stance
