  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: Spectrum 运载火箭与轨道交付架构
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 的核心商业产品是 Spectrum，一款两级液体推进轨道运载火箭，专为将中小型卫星载荷灵活部署到低地球轨道和太阳同步轨道而设计。火箭高 28 米、直径 2 米，可将最多 1,000
              千克载荷送入低地球轨道、最多 700 千克送入太阳同步轨道，为卫星星座、学术机构和商业运营商提供专属与拼车选项。2026 年 9 月 5 日，Spectrum 在名为 Onward and Upward
              的第二次认证任务中，为欧洲商业航天飞行创造里程碑。火箭从挪威北部 Andøya Spaceport 的 Launch Pad 1
              专用发射设施升空，完成正常爬升，穿越最大动压（MaxQ），完成主发动机关闭（MECO）和级间分离，点燃上面级，并将 5 颗客户 CubeSat 及一项在轨技术演示成功部署到 500
              千米轨道。这次飞行验证了欧洲大陆首枚私人开发轨道火箭的端到端轨道交付能力，完成了 European Space Agency European Launcher Challenge 的核心技术里程碑。
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE012
