      - number: '4.2'
        title: 成本基础与发射节奏敏感性
        blocks:
          - type: paragraph
            body: >
              公开成本逻辑建立在制造规模上，而非已披露的会计数据。Isar 称自动化、增材制造、碳复合材料和纵向一体化旨在降低发射成本，但没有保留的来源量化单枚火箭成本、发射场费用、利用率或毛利率。独立报道记录了 2026
              年多次因增压阀、天气和靶场问题、疑似压力容器泄漏及流体系统行为而取消发射；成功任务最终于 9
              月完成。这些延误会拉长任务周期，也很可能增加待命人员、靶场和营运资金敞口，但具体金额不可得。因此，可信的利润率判断既需要可重复的发射节奏，也需要证据证明批量生产降低了每次交付任务的全包成本。
            claimRefs:
              - CI007
              - CI014
              - CI015
      - number: '4.3'
        title: 资本化信号不能证明现金跑道
        blocks:
          - type: paragraph
            body: >
              公开资本化数据彼此不一致，不应被拔高为一个精确总额。Multiples.vc 报告七轮融资合计 $912 million，Silicon Valley Investclub 报告六轮融资超过 $671
              million；公司官网另称私人资本超过 €500 million。这些口径可能在货币、截止日期、补助、债务或轮次处理上不同，但保留的来源并未调和分母。Multiples.vc 还报告 2026 年 6 月
              €270 million D 轮融资用于全球扩张和批量生产，以及 2025 年 6 月 $1.1 billion
              估值；另一份资料则称没有可靠来源可确认最新估值。上述融资数字都不等于当前可用现金，也都不能证明净现金消耗或现金跑道。
            claimRefs:
              - CI008
