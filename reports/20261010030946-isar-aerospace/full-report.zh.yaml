              - CP014
      - number: '3.4'
        title: 主权护城河的持久性与市场替代风险
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 的主要竞争护城河来自欧洲主权太空准入要求和大规模机构资本承诺。欧洲国防部、European Space Agency 和各国航天机构越来越需要有保障、由本国控制的入轨通道，以绕开
              ITAR 限制和外国出口依赖。但 Isar 也面临长期替代风险。随着 Rocket Lab 扩大中型 Neutron 火箭规模、SpaceX 推进 Starship
              商业运营，重型运力可能进一步压低拼车价格，使其趋于标准化。此外，Firefly Aerospace 和 Rocket Lab
              等成熟美国发射商已经证明可以重复入轨，形成客户信任优势。初始机构补贴退坡后，要维持竞争防御力，Isar 必须展示快速飞行节奏，推动运载火箭在 2030 年前实现可复用，并将初步商业协议转化为持续付费收入。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP010
              - CP011
              - CP013
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: Starship 与 Falcon 9 拼车定价上限
            body: >-
              SpaceX 的 Transporter 拼车项目将小型发射器的价格上限压得很低，到太阳同步轨道的席位约为每千克 $7,000 至 $7,500。Spectrum
              等专属发射器虽可提供轨道定制和排期自主权，但要维持每千克 $12,700 至 $15,300 的价格，就要求商业买家把轨道时机和注入精度看得高于基础发射票价。
            calloutType: risk
            claimRefs:
              - CP006
