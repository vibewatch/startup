  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、规模测算口径与可触达支出
        blocks:
          - type: paragraph
            body: >-
              商业航天运输行业正经历结构性转型，低地球轨道（LEO）和太阳同步轨道（SSO）中的中小型卫星星座快速增加。过去，卫星运营商受制于大型且低频发射的火箭；预订次级载荷位置往往需要提前数年规划，每千克成本高达
              $30,000 至 $40,000。Isar Aerospace 将可触达市场界定为面向最多 1,000 千克 LEO 载荷（SSO 约 700
              千克）的专属和灵活发射服务，并明确排除重型电信平台、载人航天任务及深空基础设施；后者仍由 Ariane 6、Falcon 9 等重型运载火箭主导。Isar 管理层提出的宏观市场预测认为，到 2027
              年全球太空发射服务市场将扩大至超过 30 billion euros，而更广义的太空经济到 2040 年将达到 trillion-dollar
              规模。但要评估这个可触达市场，必须把小型发射器细分市场从总发射支出中拆出来。独立基准分析显示，按 2026 年美元计，专属小型发射价格因运力和轨道不同，在每千克 $7,600 至 $31,000
              之间；重型火箭拼车席位平均约为每千克 $7,000。Spectrum 的目标价格约为每千克 10,000 euros（每次专属发射约 10 million
              euros），处于专属小型发射服务商的中档，意在争取愿意为确定的发射排期和定制轨道注入付费、而不愿等待大批量拼车任务的商业客户。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM011
              - CM014
