      - number: '3.2'
        title: 技术架构、载荷能力与运营节奏
        blocks:
          - type: paragraph
            body: >-
              在技术能力上，Isar Aerospace 的 Spectrum 目标是将最多 1,000 千克载荷送入低地球轨道，将 700 千克送入太阳同步轨道，处于小型发射类别的上限。其运力显著超过 Rocket Lab
              在役 Electron 的 300 千克门槛，也超过 Rocket Factory Augsburg 基础版 RFA One 的 500 千克 SSO 载荷。Isar
              通过激进的纵向一体化策略实现这一性能：从零开始在内部开发丙烷—液氧 Aquila 气体发生器发动机、碳复合材料箭体和任务软件。RFA 等竞争者强调使用现成工业部件以降低开发支出，而 Isar
              的内部工程路线意在优化长期制造成本和发射灵活性。公司在挪威 Andøya 运营专用发射基础设施，并已签署多年协议，计划在 2028 年前从加拿大 Spaceport Nova Scotia
              建立跨大西洋轨道发射能力。
