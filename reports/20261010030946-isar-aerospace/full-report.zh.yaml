companyProfile:
  summary: >-
    Isar Aerospace 是一家德国发射服务公司，正在开发 Spectrum 小型运载火箭及面向商业、机构和主权客户的发射服务。公司于 2018 年脱胎于慕尼黑工业大学 WARR
    火箭生态，总部位于慕尼黑附近；目前已在德国、瑞典、挪威及计划中的海外基地搭建纵向一体化的制造和发射体系，并于 2026 年 9 月 5 日在第二次 Spectrum
    飞行中成为首家从欧洲大陆进入轨道的商业企业。公司仍为非上市企业，资金充裕，但公开证据对收入、现金消耗、订单积压经济性及合同层面单位经济性的说明仍很有限。
