  - id: FE001
    title: 产品架构图
    type: stack
    summary: Isar Aerospace Spectrum 发射系统所包含的技术与运营层。
    approximationNotes: 根据 Spectrum 工程披露和测试基础设施规格综合整理架构层。
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE006
      - CE007
      - CE008
      - CE013
      - CE015
    data:
      layers:
        - label: 载荷与任务管理层
          detail: 标准化 CubeSat 部署器、载荷整流罩和客户集成接口。
        - label: 制导、导航与控制（GNC）层
          detail: 实时飞行计算机、自主航电、遥测和冗余传感器总线。
        - label: 二级推进层
          detail: 单台真空优化 Aquila 发动机，使用液氧 / 丙烷推进剂，并支持多次重新点火。
        - label: 一级推进与助推器层
          detail: 9 台 Aquila 发动机，配备 3D 打印燃烧室并产生起飞推力。
        - label: 结构与推进剂储存层
          detail: 超轻碳复合材料推进剂箱和复合材料缠绕压力容器。
        - label: 分布式测试与发射基础设施层
          detail: Ottobrunn 测试台、Esrange 发动机测试设施、Andøya 1 号发射台和规划中的 Nova Scotia 航天港。
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从识别初始轨道需求，到形成运营中的星座发射节奏，覆盖客户全生命周期。
    data:
      items:
        - label: 1. 需求与轨道识别
          summary: Commercial and sovereign operators define orbital altitude, inclination, and launch window requirements.
          touchpoints:
            - 确定轨道参数和载荷质量
            - 对比欧洲主权发射选项与 SpaceX 拼车发射
        - label: 2. 合同架构选择
          summary: Customers select dedicated, lead, or rideshare mission structures based on budget and timing.
          touchpoints:
            - 谈判 Spectrum 发射服务协议
            - 灵活的首要客户安排与标准拼车预订
        - label: 3. 聚合商与机构签约
          summary: Intermediaries like SEOPS and institutional programs like ESA Flight Ticket secure flight capacity.
          touchpoints:
            - 签订截至 2030 年的多任务批量协议
            - 执行机构拨款和 Flight Ticket 补贴
        - label: 4. 技术集成与处理
          summary: Payload adapter mating, cleanroom integration, and deployer installation at Andøya Spaceport.
          touchpoints:
            - 集成 Exolaunch 部署器硬件
            - 在航天港洁净室完成载荷加注和封装
        - label: 5. 入轨与部署
          summary: Two-stage Spectrum flight with vacuum Aquila restart delivering payloads into precise orbits.
          touchpoints:
            - 俯仰转向机动和级间分离遥测
            - 在轨 CubeSat 分离及客户遥测联络
        - label: 6. 发射排期扩张
          summary: Repeat mission scheduling and fleet deployment across Andøya and future CSG French Guiana pads.
          touchpoints:
            - 确认后续任务发射席位
            - 规划星座补充发射节奏
    approximationNotes: null
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU007
      - CU012
