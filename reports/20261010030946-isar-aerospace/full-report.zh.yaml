        - 航天制造资本密集、历史上首次发射失败，且年度运营现金消耗较高（2024 年为 €106M）。
        - 新承诺应设置专门里程碑、按分期释放资本，并给予高级清算优先权。
      - - 估值立场
        - 偏高
        - Series D 隐含 €1.9B–€2.4B 估值；在收入爬坡前，Spectrum 相对运营同业已按溢价倍数定价。
        - 避免无对冲的普通股权；寻求可转债工具，或与主权债务担保方共同投资。
    notes: 主要来源：Isar Aerospace 新闻稿、慕尼黑商业登记文件和 Moon to Mars 估值估算；该建议反映经私人市场风险调整后的投资判断。
    claimRefs:
      - CV001
      - CV002
      - CV008
      - CV014
  - id: TV002
    title: 正 / 反论点表
    columns:
      - 视角
      - 核心论点
      - 支持证据
      - 什么会改变这一判断
    rows:
      - - 投资正论
        - 在结构性供给受限的市场中，存在成为欧洲主权发射垄断者的潜力。
        - 国防需求转移超过 60%、NATO Innovation Fund 支持，以及 ESA European Launcher Challenge 锚定合同。
        - RFA 或 Ariane 6 快速进入竞争，抢走机构客户的小卫星发射排期。
      - - 投资正论
        - 已证明轨道交付能力，并拥有纵向一体化的连续制造能力。
        - Spectrum 第二次试飞实现入轨，并于 2026 年 9 月 5 日从 Andøya 部署了 5 颗客户 CubeSat。
        - Flight 3 发生灾难性任务损失，或级间异常持续，导致 Spectrum 机队停飞。
      - - 投资反论
        - 估值在商业收入尚不透明前，已把未来执行近乎完美的预期计入价格。
        - 2023–2024 年报告收入为零，隐含 €1.9B–€2.4B 估值，且多次飞行节奏尚未得到验证。
        - 商业发射节奏迅速提升（2027 年至少 4 次轨道发射），且已实现的发射合同具备盈利能力。
      - - 投资反论
        - 资产负债表现金消耗严重，并依赖复杂的可转债工具。
        - 2024 年运营现金消耗 €106M、€150M Eldridge 可转债转换，以及此前 2021 年审计保留意见。
        - 交付经审计的 2025–2026 年财务账目，证明运营现金流为正且现金跑道延长。
    notes: 主要来源：慕尼黑商业登记文件、ESA 合同文件和 Flight 1/2 飞行事件数据；该论点对比主权战略护城河与商业执行障碍。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV013
  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 发射节奏与运营假设
      - 隐含估值 / 回报逻辑
      - 主要下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 到 2028 年，Spectrum 达到每年 6–8 次商业发射；平均实现收入为每次 €10M–€12M；国防合同扩大利润率。
        - 退出时按收入的 8x–10x 估值 €3.0B–€4.0B；相对 Series D 入场价的 MOIC 为 1.5x–2.0x。
        - 发射节奏瓶颈、二级重新点火失败，或欧洲国防预算重新分配。
        - 25%
      - - 基准情景
        - Spectrum 到 2028 年每年完成 2–4 次发射；收入达到 €25M–€45M；工厂间接成本仍需持续补贴。
        - 估值标记为 €1.8B–€2.2B；资本保全，回报温和达到 1.0x–1.2x；还需要额外的稀释性融资。
        - Parsdorf 工厂生产延误、Nova Scotia 发射场启用缓慢、利润率承压。
        - 50%
      - - 悲观情景
        - 运营异常导致发射暂停（超过 12 个月）；商业客户转向 SpaceX 拼车发射；现金跑道耗尽。
        - 进行 €600M–€900M 困境重组融资或下轮融资；可转债清算优先权造成大幅股权稀释。
        - 发射失败、监管停飞，或 ESA 机构锚定资金承诺流失。
        - 25%
    notes: 主要来源：Bundesanzeiger 历史账目、Series D 条款和运载火箭定价基准；情景对 Spectrum 发射节奏、收入爬坡和利润率假设建模。
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV009
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 梳理 Isar Aerospace 自 2018 年成立至 2026 年 9 月完成轨道资格验证期间的公司、融资、测试和飞行里程碑。
    data:
      items:
        - label: 公司成立
          date: 2018-03
          detail: 由 TUM WARR 火箭工程师 Daniel Metzler、Josef Fleischmann 和 Markus Brandl 在慕尼黑创立。
          tone: positive
        - label: Series A 融资（$17M）
          date: 2019-12
          detail: 获得由 Earlybird 和 Airbus Ventures 领投的早期机构风险投资。
          tone: positive
        - label: Series B 融资（$91M）
          date: 2020-12
          detail: 完成由 Lakestar 领投的大型欧洲 SpaceTech 股权轮，用于推进运载器工业化。
          tone: positive
        - label: Series C 融资（$165M）
          date: 2023-03
          detail: 完成由 7-Industries Holding、Bayern Kapital 和 Porsche SE 支持的全球深科技股权轮。
          tone: positive
        - label: 首次飞行失败（Going Full Spectrum）
          date: '2025-03-30'
          detail: 首次从 Andøya 发射的飞行任务因排放阀意外开启，在 T+25s 失去姿态控制；任务于 T+30s 终止。
          tone: adverse
        - label: Eldridge 可转债（EUR 150M）
          date: '2025-06-25'
          detail: 与 Eldridge Industries 签署可转债承诺，为制造规模扩张提供资金。
          tone: neutral
        - label: Series D 融资（EUR 270M）
          date: '2026-06-09'
          detail: 获得由 Island Green Capital 和 Molten Ventures 领投的增长资本，使累计融资达到约 EUR 870M。
          tone: positive
        - label: 成功入轨（Onward and Upward）
          date: '2026-09-05'
          detail: 第二次 Spectrum 发射从 Andøya 成功进入太阳同步轨道，并部署了 5 颗客户 CubeSat。
          tone: positive
    approximationNotes: 时间线综合 2018 年至 2026 年 9 月已核验的公司公告、公开融资披露和发射任务记录。
    claimRefs:
      - CO001
      - CO005
      - CO006
      - CO007
      - CO012
      - CO014
