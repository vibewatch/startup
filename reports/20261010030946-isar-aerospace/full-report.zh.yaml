  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与商业转化
        blocks:
          - type: paragraph
            body: >
              Isar Aerospace 销售的是发射服务，而不是经常性软件订阅；其公开报价区分专属任务、主载荷任务和拼车运力。网站展示了定价选项，但没有公布具体费率，因此挂牌价和实际成交价都不能视为已知。公司 2020
              年的一份公告称客户询问金额超过 $500 million，但询问不等于合同订单、确认收入或现金。2026 年 9 月客户载荷成功入轨，是更强的运营证据；而 Aviation Week
              仅报道称首次商业发射可能发生在 2026 年。因此，商业转化仍取决于未公开的合同条款、定金、验收里程碑、发射节奏和回款。
