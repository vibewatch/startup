      - number: '5.3'
        title: 运营用例与欧洲发射服务定位
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 将 Spectrum 定位为灵活、响应商业需求的发射服务，用来解决长期压制欧洲商业卫星运营商和主权防务架构的发射能力瓶颈。过去，欧洲小卫星运营商要么等待 Falcon 9 或
              Ariane 6 等重型火箭上不频繁的次级拼车席位，承受漫长任务延误和不理想的轨道倾角；要么依赖受到复杂出口许可约束的海外微型发射器。Spectrum
              通过三种运营预订模式提供直接入轨：专属单客户飞行由买方决定具体发射时间和轨道参数；主载荷配置由主要乘客设定轨迹并共享剩余运力；标准多载荷拼车则进入常用太阳同步轨道。Andøya Spaceport
              的发射轨迹不受阻碍，可越过开阔水域进入高倾角极地轨道，适合地球观测、环境监测和侦察星座。为扩大地理覆盖并提供赤道或中倾角轨迹，Isar 于 2026 年 7 月与 Maritime Launch Services
              签署协议，在加拿大 Spaceport Nova Scotia 建设额外的 Spectrum 发射场，目标在 2028 年前后投入运营。
            claimRefs:
              - CE001
