      - number: '2.2'
        title: 客户分层、采购流程与预算归属
        blocks:
          - type: paragraph
            body: >-
              Spectrum 发射服务的需求来自三类客户：商业星座运营商、主权民用航天机构，以及国防与安全组织。商业买家包括地球观测、IoT
              连接和宽带星座运营商，是主要的数量驱动者。这些买家通常签署商业发射服务协议，按里程碑支付进度款；预算由企业技术负责人和 CFO 掌握，他们会将资本支出与轨道收入生成能力进行比较。机构买家主要包括 European
              Space Agency（ESA）及德国 DLR
              等国家航天组织，遵循以长期公共航天运输政策为基础的正式竞争性采购框架。对这些机构而言，发射采购并不只由商业化的每千克价格驱动，还受到欧洲数字与技术主权要求推动，目标是终结对外国发射系统的依赖。第三类新兴买家包括第三方拼车经纪商和国防创新机构，如
              NATO Innovation Fund 及盟国国防部；它们采购专属发射时段，用于快速恢复轨道能力和执行主权侦察任务。面对不同的卫星形态和预算，Isar 提供三种标准化预订配置：享有专属轨道控制的
              Dedicated launches、可与共同乘客协同安排的 Lead slots，以及用于常规轨道投放的 Rideshare。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM012
      - number: '2.3'
        title: 增长驱动、战略主权与采用约束
        blocks:
          - type: paragraph
            body: >-
              推动 Isar Aerospace 商业采用的长期增长动力，主要包括商业卫星星座部署呈指数增长、传感器和通信载荷不断小型化，以及欧洲对主权发射自主权前所未有的政治诉求。欧洲失去俄罗斯 Soyuz
              火箭的使用权、传统欧洲重型运载平台持续延误后，地缘政治重组促使欧洲机构大举调动资本，培育本土私人发射能力。2026 年 8 月，ESA 在 European Launcher Challenge 下授予 Isar
              Aerospace 一份金额达 197.8 million euro 的标志性合同，这一动力达到高潮，也确立了 Isar 作为主权发射锚点供应商的地位。为承接预期的机构和商业订单，Isar
              在慕尼黑附近大举投资纵向一体化自动化制造设施，目标是稳定实现每年最多生产 40 枚 Spectrum。市场扩张仍受强约束：小型发射器资本密集度极高，Andøya Space Center
              等海上发射通道存在严重监管许可瓶颈；卫星运营商的业务模式依赖已验证的飞行可靠性，因此转换成本很高。在多次成功入轨任务验证飞行履历和发射节奏稳定性之前，风险厌恶型卫星运营商仍会犹豫，往往把任务排期分散给成熟的全球发射服务商。
            claimRefs:
              - CM007
              - CM008
              - CM012
              - CM013
      - number: '2.4'
        title: 商业管线现实、订单质量与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              评估 Isar Aerospace 的市场进展，需要区分宣传口径和经审计的商业承诺。2026 年 1 月，Isar 管理层公开声称其发射能力已售罄至 2028 年，商业和国防问询构成的累计业务管线超过 $10
              billion。但财务尽调显示，这些管线数字主要是无约束力的意向表达和未经加权的潜在客户询问，并非可强制执行、不可取消的合同订单。对法定申报的独立审查显示，截至 2023 年底，公司已签署的确定发射合同总额约为
              133 million euros；在首次轨道演示前，确认的商业收入截至 2024
              年仍为零。由于早期航天商业发射协议通常包含与排期里程碑挂钩的客户取消条款，如果生产节奏落后，潜在客户询问可能流失或转向竞争对手。评估 Isar
              市场地位的关键尽调缺口，是公开信息完全看不到客户合同中的现金定金条款、里程碑付款安排和取消罚金。后续尽调必须核实所报管线中有约束力的预付款与软性期权各占多少，才能建立现实的现金转化时间表。
            claimRefs:
              - CM005
              - CM006
              - CM014
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 专属发射灵活性与拼车价格差
            body: >-
              SpaceX Falcon 9 拼车任务的价格约为每千克 $7,000，较低；Spectrum
              等微型发射器则靠排期控制和精确轨道交付竞争。星座运营商愿意为专属发射窗口支付溢价，以避免大批量拼车带来的数月轨道相位调整延迟。
            calloutType: insight
            claimRefs:
              - CM004
              - CM010
              - CM011
          - type: callout
            title: 商业管线转化与收入实现阻力
            body: >-
              Isar Aerospace 宣称的 $10 billion 业务管线及截至 2028 年售罄的状态，与法定账目中确认的 €133 million
              合同订单形成鲜明对比。历史客户兴趣大多没有约束力，未来收入转化高度依赖持续的轨道发射可靠性。
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM015
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 欧洲与全球发射市场的竞争格局
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 面对的商业航天发射市场分为三块：欧洲新兴微型发射器、成熟的全球专属小型发射服务商，以及由中重型运载火箭运营的大型商业拼车项目。在欧洲，Isar
              直接与区域发射初创公司竞争，包括正在开发 RFA One 的 Rocket Factory Augsburg、正在开发 MIURA 5 的 PLD Space，以及正在开发 SL1 的
              HyImpulse。Ariane 5 退役、Avio 的 Vega C 运力受限，以及俄罗斯 Soyuz 从法属圭亚那发射受到地缘政治禁运后，欧洲机构买家面临严重的发射缺口。Isar 于 2026 年 9 月 5
              日从挪威 Andøya Space 完成入轨，在区域初创竞争者中取得显著开发领先；其背后还有超过 EUR 800 million 私募股权和可转债融资，以及 European Launcher Challenge
              下 EUR 200 million 的项目承诺。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP013
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
