      - number: '3.3'
        title: 定价经济性、拼车替代与转换阻力
        blocks:
          - type: paragraph
            body: >-
              商业发射采购的核心经济权衡，是低成本标准化拼车与高价专属轨道交付之间的选择。SpaceX 的 Falcon 9 Transporter
              任务是小型卫星星座运营商的主流经济替代方案，将到太阳同步轨道的低成本基准设在每千克约 $7,000 至 $7,500。相比之下，Isar Aerospace 目标是每枚一次性使用的 Spectrum 发射价格
              EUR 10 million 至 EUR 12 million，按 2026 年美元计相当于每千克约 $12,700 至
              $15,300。拼车虽然节省成本，但也带来严格的运营限制：排期僵化、轨道倾角固定，还需要二级推进或轨道转移飞行器才能抵达工作轨道。对于有时效要求的商业星座运营商，例如与 Planet 签约部署下一代
              Pelican 成像卫星的客户，Isar 可提供专属轨道注入、定制发射方位角，以及 Dedicated、Lead 和 Rideshare 之间灵活的飞行组合。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP012
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
