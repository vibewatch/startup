      - number: '5.4'
        title: 子系统脆弱性、飞行异常与规模化瓶颈
        blocks:
          - type: paragraph
            body: >-
              尽管 Isar Aerospace 在第二次飞行中进入轨道，但从原型认证转向可重复的商业发射节奏时，仍面临重大技术和运营风险。开发计划始于 2025 年 3 月的首次飞行；由于阀门故障，火箭在升空约 30
              秒后发生异常并坠海，坠点靠近发射台。通向 2026 年 9 月认证飞行的活动多次被技术原因中断，包括 2026 年 1 月增压阀故障、2026 年 4 月复合材料缠绕压力容器（COPV）泄漏，以及 2026 年
              6 月非正常流体系统遥测。这些反复出现的流体和增压异常，说明低温推进剂装载和气动执行机构的运行容差较窄。此外，Isar 的长期商业模式依赖在慕尼黑附近建成一座 40,000 平方米的设施，每年最多生产 40 枚
              Spectrum，相当于前所未有的约每 9 天生产 1 枚火箭。要在复杂的 3D 打印排程、Esrange 发动机验收测试、前往 Andøya
              的长距离北极运输和发射场周转之间维持这一节奏，是尚未验证的重大工业规模化挑战。
