      - number: '1.3'
        title: 资本化历史、融资轮次与投资者基础
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 已建立全球发射行业中资本最充足的私人资产负债表之一，累计募集约 EUR 870 million，来源包括股权、可转债和公共里程碑补助。公司最初于 2019 年 12 月完成 USD
              17 million A 轮融资，由 Earlybird Venture Capital 和 Airbus Ventures 领投；随后于 2020 年 12 月完成 USD 91 million B 轮融资，由
              Lakestar 领投。2023 年 3 月，公司获得由 7-Industries Holding、Bayern Kapital 和 Porsche Automobil Holding SE 支持的 USD
              165 million C 轮融资。2025 年 6 月，Eldridge Industries 承诺提供 EUR 150 million 可转债，增强公司的生产流动性。最近一次是 2026 年 6 月 9
              日，公司完成 EUR 270 million D 轮融资，由 Island Green Capital 和 Molten Ventures 共同领投，现有投资者 HV Capital、Lakestar 和 UVC
              Partners 参与。Bloomberg 于 2026 年 3 月报道称，D 轮讨论目标估值约为 EUR 2 billion，但最终条款和投后估值指标并未正式披露。
