            body: |
              公开来源对累计融资存在分歧，也没有披露当前现金或现金消耗。投资判断应使用实际到账现金、剩余不受限现金、债务和可转债条款，以及发射节奏运营计划，而不能把宣传中的融资额当作可用流动性。
