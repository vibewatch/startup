    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、成立背景与工业布局
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace SE 是一家德国私人航天制造商，由 Daniel Metzler、Josef Fleischmann 和 Markus Brandl 于 2018 年 3
              月创立，三人此前参与慕尼黑工业大学学生火箭团队 WARR。公司开发 Spectrum：一款高 28 米、直径 2 米的两级小型运载火箭，使用清洁燃烧的液氧和丙烷推进剂。Spectrum 设计为可将最多 1,000
              千克载荷送入低地球轨道，将 700 千克载荷送入太阳同步轨道；一级配备 9 台自研 Aquila 发动机，二级配备 1 台真空优化、可重启的 Aquila 发动机。公司总部位于慕尼黑附近的
              Ottobrunn，目前正迁入 Parsdorf 新建的 40,000 平方米总部及制造基地，该基地设计产能为每年批量生产最多 40 枚 Spectrum 火箭。Isar Aerospace 在瑞典 Kiruna
              设有发动机测试设施，在挪威 Andøya Spaceport 开展轨道发射，并计划在法属圭亚那的圭亚那航天中心和加拿大的 Spaceport Nova Scotia 建设发射台。
            claimRefs:
