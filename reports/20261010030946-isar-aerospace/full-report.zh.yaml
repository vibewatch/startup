  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与机构需求驱动
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 面向三类客户：商业小卫星运营商、欧洲主权防务与民用航天机构，以及第三方任务聚合经纪商。核心商业客户是需要通信、地球观测和 IoT 载荷专属或拼车轨道注入的 NewSpace
              星座建设者。与此同时，欧洲防务与机构客户是由地缘政治刚需驱动的锚定买家：俄罗斯 Soyuz 发射能力于 2022 年退役、Vega
              系列火箭持续出现运营延误后，欧洲机构规划者面临主权进入太空的关键缺口。因此，European Space Agency 和各国国防部等民用机构将 Spectrum
              等商业发射器视为维护区域自主发射能力的战略资产。除轨道发射服务外，公司还运营面向消费者的数字商店，向零售爱好者销售品牌周边，但发射服务合同仍是唯一具有实质经济意义的引擎。
