          - type: callout
            title: 欧洲主权发射要求与 ELC 支持
            body: >-
              European Space Agency 在 European Launcher Challenge 下承诺 EUR 200 million，强化了本土发射器的封闭机构市场。俄罗斯 Soyuz
              无法使用、Vega C 发射节奏受限之际，Isar Aerospace 作为唯一一家已由私人资本融资并证明入轨能力的欧洲发射器，享有特殊的政治护城河。
            calloutType: strength
