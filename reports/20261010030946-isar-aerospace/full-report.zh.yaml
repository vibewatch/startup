      - number: '6.2'
        title: 商业采用轨迹与管线透明度
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 的商业管线已从早期无约束力的意向表达，发展到合同化飞行预订和任务清单承诺。2020 年 12 月，在完成 B 轮融资的同时，公司公开强调商业客户询问金额超过 5 亿美元（$500
              million），显示欧洲小卫星发射替代方案拥有强烈市场需求。但把探索性的商业询问转化为具有法律约束力、带有前置现金定金的发射服务协议，仍是公司财务模式中不透明的一环。商业发射市场通常要求客户按里程碑审查支付首付款，但
              Isar Aerospace 没有公开合同层面的订单经济性、定金安排或里程碑付款结构。客户询问金额证明了早期管线规模；要验证客户是否真正以现金支持承诺，仍需审查不可退还的首付款条款和合同期限。
            claimRefs:
              - CU004
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
      - number: '6.3'
        title: 运营飞行认证与客户载荷部署
        blocks:
          - type: paragraph
            body: >-
              2026 年 9 月 5 日，Isar Aerospace 从挪威 Andøya Spaceport 的 Orbital Launch Pad 发射第二次 Spectrum 轨道任务 Onward and
              Upward，客户采用由此得到运营验证。飞行成功入轨，并部署 Spectrum 首批 6 个客户载荷，使这款两级运载火箭在真实运营条件下获得认证。任务清单包括德国硬件制造商 Dcubed 的实验性部署，以及 5
              颗立方体卫星：TU Berlin 的 CybeeSat、挪威 NTNU FramSat-1、University of Maribor 的 TriSat-S、TU Wien 的 SpaceTeamSat-1 和
              EnduroSat 的商业 Platform 6。部署硬件由小卫星聚合商 Exolaunch 协助集成。这一轨道里程碑此前经历了 2025 年 3 月的首次测试飞行失败：排气阀意外打开，在 T+30
              秒触发飞行终止；此后 2026 年又因压力阀异常、热瞬态和流体系统问题多次取消发射。
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU007
              - CU008
              - CU010
              - CU011
      - number: '6.4'
        title: 合同持久性、中间商依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 的商业扩张战略高度依赖与发射经纪商签订的多任务协议，以及机构锚定项目。2026 年 9 月，公司扩展与总部位于美国的任务集成商 SEOPS 的合同，新增 5 次 Spectrum
              发射，使双方截至 2030 年的签约任务清单增至 6 次专属飞行。在机构领域，Isar Aerospace 根据 European Space Agency Flight Ticket Initiative
              获得两份发射服务协议，用于发射 CASSINI 及 Tom and Jerry 商业任务，另有为 Norwegian Space Agency 和 Redwire
              计划的飞行。这些多次飞行安排虽提供了未来任务清单可见度，却也带来显著的交易对手和聚合商集中风险。聚合商掌握客户关系并协商批量折扣，使 Isar Aerospace
              与直接星座客户隔开。此外，公开披露没有经过验证的净收入留存率、客户续约率或客户群留存统计，因此认证后的客户终身价值仍未验证。
            claimRefs:
              - CU005
              - CU010
              - CU011
              - CU014
      - number: '6.5'
        title: 展示项
        blocks:
          - type: callout
            title: 聚合中间商主导商业订单
            body: 尽管 Isar Aerospace 推广直接预订发射，但关键商业规模通过 SEOPS 等第三方任务聚合商获得，终端客户关系和利润捕获由服务中间商掌握。
            calloutType: insight
            claimRefs:
              - CU005
              - CU012
          - type: callout
            title: 未经验证的客户订单经济性
            body: 公开客户承诺混合了确定发射合同和无约束力预订；由于没有公开定金或取消罚金结构，订单脆弱性无法量化。
            calloutType: risk
            claimRefs:
              - CU004
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、许可与司法辖区态势
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 受德国和欧盟司法管辖，已将法律形式从德国有限责任公司（GmbH）重组为欧洲公众公司（Societas Europaea，SE），并在慕尼黑地方法院登记，注册号 HRB
              290907。这一公司转换为未来进入公开市场和开展国际扩张做准备。商业登记文件将公司业务范围界定为轨道火箭发动机和发射系统的开发、生产与认证。公司基础虽已正式化，但历史财务披露显示其过去存在脆弱性：Deloitte
              因 Series C 轮之前融资承诺未获确认，对 Isar Aerospace 2021 年财务报表出具审计保留意见；在大规模注入股权后，后续审计才获得无保留意见。
            claimRefs:
              - CR001
              - CR002
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
      - number: '7.2'
        title: 技术飞行履历与运营执行风险
        blocks:
          - type: paragraph
            body: >-
              Spectrum 的技术风险画像是早期飞行失败后实现入轨恢复。2025 年 3 月 30 日首次飞行时，俯仰转向过程中排气阀意外打开，导致姿态控制丧失并迫使靶场安全终止，火箭在升空约 30
              秒后结束任务。完成工程纠正措施、软件升级和热试车后，第二次任务在 2026 年 1 月至 6 月间因增压阀故障、安全周界靶场违规、复合材料缠绕压力容器泄漏和流体系统异常而 4 次取消发射。2026 年 9 月 5
              日，Spectrum 成功入轨并部署载荷，但从一次成功演示过渡到商业化运营节奏，仍是首要执行难题。
            claimRefs:
              - CR003
              - CR004
              - CR007
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR007
              - CR008
      - number: '7.3'
        title: 发射特许、基础设施与交易对手承诺
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 的发射基础设施存在地理集中风险。目前欧洲轨道发射完全依赖挪威 Andøya Space Center，公司在那里获得最长 20
              年的专属发射台特许权。虽然这提供了专用通道，但任何发射台物理事故、严酷北极天气或当地靶场限制，都会立即叫停全部轨道运营。潜在多元化仍处于早期：Isar 尚未在库鲁的圭亚那航天中心建立运营发射台，目前只有一份早期
              CNES 可行性协议。同时，公司与 Maritime Launch Services 就加拿大 Spaceport Nova Scotia 达成国际协议，带来长期财务承诺：30
              个月豁免期结束后，在商业飞行收入形成前，公司每季度需要支付 3.75 million US dollars。
            claimRefs:
              - CR005
              - CR006
              - CR011
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
      - number: '7.4'
        title: 资本密集度、运营现金消耗与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              航天器开发具有极高资本密集度。集团 2024 年财务报表披露 IFRS 年度净亏损 77.0 million euros，年末现金余额降至 29.7 million euros，全年现金支出为 106
              million euros。高现金消耗迫使公司在 2026 年 6 月完成 270 million euro D 轮融资前，先从 Eldridge 和 Lakestar
              获得过渡性可转债融资。高管接班又增加了一个监测变量：联合创始人 Josef Fleischmann 于 2026 年 9 月离开管理委员会，由 Can Araz 接任
              CTO。潜在投资者应跟踪后续现金消耗、Parsdorf 制造产量和复飞周转时间；若出现未受控发射异常或监管停工令，则构成投资论点失效触发器。
            claimRefs:
              - CR008
              - CR012
              - CR013
              - CR014
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 资本密集度与复飞节奏
            body: 尽管 Isar Aerospace 已在 Spectrum 第二次飞行中证明具备入轨能力，但公司仍面临高资本密集度和巨额年度现金消耗，商业发射频次也尚未得到验证。
            calloutType: risk
            claimRefs:
              - CR008
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与建议框架
        blocks:
          - type: paragraph
            body: >
              评估 Isar Aerospace 的股权投资，需要在已证实的技术突破、战略主权价值与私人市场估值倍数之间权衡；后者已把近期运营近乎完美的预期计入价格。公司于 2026 年 9 月 5 日在第二次
              Spectrum 飞行中从 Andøya Spaceport 成功进入低地球轨道，并部署了 5 颗商业及机构 CubeSat 和一项 ESA 实验。这一历史里程碑使 Isar Aerospace
              成为唯一一家从欧洲大陆本土实现入轨的欧洲私人企业，也打开了关键的主权防务需求。过去一年，流入需求已从以民用询盘为主转向约 60% 的防务和政府需求，反映出欧洲迫切需要解决严重的太空进入能力缺口。然而，2026 年
              6 月 Series D 融资给出的企业估值为 €1.9 billion 至 €2.4
              billion，价格跑在已验证的持续发射频次、稳定单位经济性和透明客户回款里程碑之前。独立分析师已明确警告，投资者在多级点火重启和商业交付频次得到证明前，就已经在为未来执行力买单。因此，在持续商业飞行和经审计财务指标验证资本基础之前，我们以“继续研究”建议、高风险评级和偏高估值判断启动覆盖。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV008
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV011
              - CV013
              - CV014
      - number: '8.2'
        title: 资本结构、融资历史与估值标记
        blocks:
          - type: paragraph
            body: >
              Isar Aerospace 已筹集约 €870 million 总资金，形成欧洲发射器历史上最大的私人资本储备，其中历史股权轮和可转债工具合计追踪到 $884 million。资本结构从 Lakestar 于
              2020 年 12 月领投的 $91 million Series B，发展到 €165 million Series C，以及 2025 年 6 月与总部位于迈阿密的 Eldridge Industries
              签订的 €150 million 可转债协议。慕尼黑商业登记文件显示，Eldridge 可转票据与 Lakestar 工具一起，以 €1.0 billion 至 €1.25 billion
              的估值上限转为股权，对应每股 €6,615 至 €8,269。随后于 2026 年 6 月 9 日签署的 €270 million Series D 向 22 家机构投资者发行 21,274 股，有效发行价为每股
              €10,336 至 €12,692，投资者包括 Island Green Capital、Molten Ventures、HV Capital 和 NATO Innovation Fund。按 186,445
              股登记股份计算，由此推算投后估值为 €1.93 billion 至 €2.37 billion，且该估值在入轨证明前三个月确定。与此同时，Isar Aerospace 集团 2024 年账目显示，年度会计亏损
              €77.0 million，经营现金消耗 €106 million，2024 年末现金仅 €29.7 million。历史文件还显示，因未来融资无保障及持续经营现金风险已危及生存，审计师 Deloitte 拒绝对
              2021 年出具审计意见，凸显开发计划极高的资本密集度和对流动性的敏感性。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
              - CV010
              - CV012
      - number: '8.3'
        title: 情景建模与相对估值基准
        blocks:
          - type: paragraph
            body: >
              为评估 €1.9 billion 至 €2.4 billion 的 Series D 估值是否提供可承受的安全边际，我们构建了按概率加权的乐观、基准和悲观运营情景。在太空发射行业，估值倍数不能照搬软件 SaaS
              类比，而应反映航空航天资本开支、固定设施摊销和发射频次经济性。Spectrum 专属任务目标发射价格为每公斤 €10,000 至 €12,000，送入低地球轨道，最大载荷 1,000 kg。相比之下，SpaceX
              Falcon 9 在 2026 年价目表中对大宗拼车舱位报价为每公斤 $7,000 至 $7,500；专用发射器虽有竞争溢价，却能提供定制轨道参数、灵活时间安排和主权级非 ITAR 合规。与 Rocket Lab
              Electron 等小型专用发射器相比，后者送入低地球轨道的价格约为每公斤 $31,000，Spectrum 载荷规模更大、单位公斤价格更低。尽管如此，实现盈利仍需消化新建 40,000 平方米 Parsdorf
              制造工厂的固定开支；该工厂设计产能为每年最多 40 枚火箭。在基准情景下，2028 年前每年 2 至 4 次的温和发射频次可实现盈亏平衡倍数，但仍需持续营运资金支持，进一步印证估值偏高。
            claimRefs:
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV009
              - CV014
      - number: '8.4'
        title: 退出准备度、尽调要求与论点失效触发条件
        blocks:
          - type: paragraph
            body: >
              Isar Aerospace 的退出机会将集中于在欧洲大陆首次公开募股，或在不断扩张的欧洲防务工业体系内进行战略整合。公司转为 SE 法人结构，并由 Bulent Altan
              担任主席、组建国际监事会，显示其公司治理已趋成熟，具备上市条件。2026 年 7 月与 Maritime Launch Services 为 Spaceport Nova Scotia 签署的 10
              年租约进一步支撑运营扩张，允许公司自 2028 年起执行中倾角轨道发射。不过，潜在股权投资方在投入资金前，必须解决关键尽调盲点。近期尽调要求包括取得 2025–2026
              年经审计的现金消耗数据、核实客户预付款，以及检查不可取消的积压订单条款。明确的论点失效条件包括 Flight 3 出现灾难性的飞行中级间异常、ESA 或 DLR 的锚定载荷承诺被取消，或在 Parsdorf
              工厂固定开支耗尽 Series D 流动性储备前无法完成后续非稀释性防务融资。
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV011
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 审慎投资判断：为何“继续研究”优先于势头
            body: >-
              Isar Aerospace 于 2026 年 9 月 5 日入轨，巩固了其作为欧洲大陆头部发射器候选者的地位；但投资者必须区分技术突破与可纳入投资判断的风险调整后价值。按 €1.9 billion 至 €2.4
              billion 的隐含投后估值计算，普通股投资者在公司尚未证明持续商业发射频次、正向单位经济性或透明积压订单回款里程碑前，就已支付溢价倍数。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV008
              - CV014
          - type: callout
            title: 资本密集度与下行稀释风险
            body: >-
              Isar Aerospace 2024 年经营现金消耗 €106 million，年末仅余 €29.7 million，之后才通过 €150 million Eldridge 可转债和 €270 million
              Series D 获得过桥资金。在资本密集的批量生产爬坡期，任何发射异常或持续多个季度的机队停飞，都可能迅速耗尽流动性，并触发稀释性的下轮重组或结构化债务负担。
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
