      - number: '1.2'
        title: 高管领导、治理与组织结构
        blocks:
          - type: paragraph
            body: >-
              Isar Aerospace 由首席执行官 Daniel Metzler 领导，他与 Markus Brandl 和 Josef Fleischmann 共同创办公司。董事会由前 SpaceX 副总裁
              Bulent Altan 主持，为公司带来商业发射和航空电子工程经验。2026 年 9 月 21 日，公司经历重大高管交接：联合创始人 Josef Fleischmann 辞去 COO 和 CTO
              的合并职务，创办轨道计算公司 Bavaria Instruments。Fleischmann 离开运营岗位后，创始时即加入公司的资深工程负责人 Can Araz 晋升为 CTO，Patrick Adcock
              则负责全球制造运营。商业战略由首席商务官 Stella Guillen 负责，她统筹国际发射销售和主权任务清单。公司在五个国际地点雇佣 400 多名、来自 50 多个国籍的专业人员；外部行业估计显示，2026
              年中员工数约为 500 至 774 人。
