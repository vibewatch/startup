evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-financial-disclosures
    missingEvidence: >-
      Audited financial statements, revenue recognition schedules, cash burn rates, and margin disclosures for
      commercial launch operations.
    whyItMatters: >-
      Without audited financial statements, investors cannot assess gross margins per launch, underlying unit economics
      of the Spectrum vehicle, or runway sustainability without relying on external capital injections.
    diligencePath: >-
      Request audited German commercial register filings (Bundesanzeiger) for Isar Aerospace SE and inspect confidential
      investor data room materials regarding flight pricing, customer deposits, and burn rate.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: executive-management-enumeration
    missingEvidence: >-
      Full organizational chart and vice president-level leadership roster beyond core founders and publicly named
      executives.
    whyItMatters: >-
      Partial enumeration limits visibility into mid-level functional engineering redundancy and succession planning
      beneath the executive committee.
    diligencePath: Review internal org chart or comprehensive employee directory during management diligence sessions.
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: cap-table-ownership-enumeration
    missingEvidence: >-
      Complete share register detailing exact percentage ownership, option pool sizing, and voting control across all
      equity classes.
    whyItMatters: >-
      Sample investor mapping does not reveal exact shareholder concentration, founder voting control, or senior
      liquidation preferences.
    diligencePath: >-
      Inspect cap table export and articles of association (Satzung) from Munich commercial register or investor data
      room.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: pipeline-conversion-economics
    missingEvidence: >-
      Granular breakdown of customer contract terms, non-refundable deposit amounts, milestone payment schedules, and
      cancellation penalty clauses within the reported $10 billion commercial pipeline.
    whyItMatters: >-
      Without visibility into binding deposit commitments, underwriting cannot distinguish firm contracted revenue from
      soft non-binding launch inquiries.
    diligencePath: >-
      Request customer contract schedules, deposit verification from commercial escrow accounts, and cancellation
      penalty terms during confirmatory diligence.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Audited commercial launch service agreements disclosing realized per-flight net pricing, volume discounts, and
      cancellation penalty clauses for Spectrum versus RFA One and Electron.
    whyItMatters: >-
      Public list pricing and early marketing targets (EUR 10M-12M) often deviate substantially from realized
      institutional and commercial contract values, clouding gross margin and competitive durability assessments.
    diligencePath: >-
      Review customer contract annexes, customer deposit payment schedules, and SEC customer disclosures from anchor
      clients like Planet Labs.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: flight-cadence-and-reusability
    missingEvidence: >-
      Empirical operational turnaround times, stage refurbishment data, and multi-flight cadence schedules for European
      competitors attempting orbital recovery or high launch rates.
    whyItMatters: >-
      Economic parity with reusable heavy lift requires high flight frequency or reusable architectures; lack of
      disclosed operational flight cadence makes cost-amortization projections speculative.
    diligencePath: >-
      Track spaceport launch licensing filings with Norwegian CAA (Luftfartstilsynet) and Nova Scotia environmental
      monitoring reports for cadence caps.
    relatedQuestionRefs:
      - QP003
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: financial-statements
    missingEvidence: |
      Audited revenue, cost of revenue, gross profit, operating expenses, cash, debt, monthly burn, and runway.
    whyItMatters: >
      Without these figures, investors cannot assess revenue quality, contribution margin, capital adequacy, or the
      timing and dilution risk of another financing.
    diligencePath: >
      Obtain audited FY2024-FY2026 statements, current management accounts, bank statements, debt schedules, the board
      budget, and a monthly cash runway bridge under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: >
      Executed mission prices, deposits, payment milestones, cancellation and delay rights, customer concentration,
      backlog conversion, and revenue-recognition policies.
    whyItMatters: >
      Inquiry volume and orbital success do not establish contracted revenue, cash collection, or durable per-mission
      economics.
    diligencePath: >
      Sample signed contracts and invoices across dedicated, lead, and rideshare configurations and reconcile them to
      deferred revenue, backlog, and recognized revenue.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
      - TI002
  - type: conflicting-data
    severity: material
    topic: capitalization
    missingEvidence: >
      A reconciled capitalization schedule explaining the $912 million, $671 million-plus, and €500 million-plus public
      funding measures and the basis for the reported June 2025 valuation.
    whyItMatters: |
      Unreconciled round counts, currencies, instruments, and dates prevent a reliable liquidity or dilution analysis.
    diligencePath: >
      Review the fully diluted cap table, round closing documents, convert terms, grant schedule, debt, and cash
      proceeds received, with a consistent currency and cut-off date.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: production-scaling
    missingEvidence: >-
      Independent industrial audit data verifying serial takt times, component supply yields, and factory tooling
      readiness for the 40,000 m² Munich facility.
    whyItMatters: >-
      Projected 40-vehicle annual cadence requires producing a vehicle every 9 days, which is unprecedented in European
      launch manufacturing and unproven by single-flight qualification.
    diligencePath: >-
      Request facility inspection records, factory automation milestones, supplier lead-time audits, and capital capex
      burn schedules for Munich factory line expansion.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: customer-backlog-economics
    missingEvidence: >-
      Audited contract values, non-refundable deposit schedules, and cancellation milestone penalties for Isar
      Aerospace's multi-launch commercial customer agreements.
    whyItMatters: >-
      Without audited deposit figures, distinguishing firm commercial backlog from non-binding launch reservations or
      exploratory memoranda of understanding is impossible.
    diligencePath: >-
      Request customer contract schedules, escrow deposit verifications, and signed launch service agreement annexes
      during formal commercial diligence.
    relatedQuestionRefs:
      - QU009
  - type: missing-source
    severity: material
    topic: retention-and-churn-metrics
    missingEvidence: >-
      Net revenue retention (NRR), repeat customer renewal rates, and cohort-based customer re-booking metrics across
      commercial smallsat operators.
    whyItMatters: >-
      Small-launch business models depend on repeat constellation replenishment cadence; lack of retention data prevents
      validating customer lifetime value versus customer acquisition cost.
    diligencePath: >-
      Review historical customer re-booking rates, cohort retention tables, and constellation replacement cycle
