schemaVersion: "report-v2"
artifact: financials
slug: isar-aerospace
runDate: 2026-10-10
company:
  name: Isar Aerospace
chapter:
  number: 4
  title: Financials
  summary: >
    Isar Aerospace has a launch-services model with dedicated, lead, and rideshare configurations, and its
    September 2026 orbital mission materially improves the evidence of deliverability. Financial underwriting
    remains blocked by conflicting third-party funding totals and no public revenue, realized pricing, gross
    margin, cash, burn, or runway disclosure.
sections:
  - id: revenue-model-and-commercial-conversion
    title: Revenue model and commercial conversion
    body: >
      Isar Aerospace sells launch services rather than a recurring software subscription: its public offer
      separates dedicated missions, lead-payload missions, and rideshare capacity. The website advertises
      pricing options but publishes no numeric tariff, so neither list price nor realized price can be treated
      as known. A 2020 company release described more than $500 million of customer inquiries, but inquiries
      are not contracted backlog, recognized revenue, or cash. The September 2026 orbital delivery of customer
      payloads is stronger operational evidence, while Aviation Week reported only that a first commercial
      launch might occur in 2026. Conversion therefore still depends on contract terms, deposits, acceptance
      milestones, cadence, and collections that are not public.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: cost-base-and-launch-cadence
    title: Cost base and launch-cadence sensitivity
    body: >
      The public cost thesis rests on manufacturing scale, not disclosed accounting. Isar says automation,
      additive manufacturing, carbon composites, and vertical integration are intended to reduce launch cost,
      but no retained source quantifies vehicle cost, launch-site expense, utilization, or gross margin.
      Independent reporting records repeated 2026 scrubs involving a pressurization valve, weather and range
      issues, a suspected pressure-vessel leak, and fluid-system behavior before the successful September
      mission. Those delays lengthen campaigns and plausibly add standing labor, range, and working-capital
      exposure, but the amount is unavailable. A credible margin case therefore requires both repeatable
      cadence and evidence that serial production lowers fully loaded cost per delivered mission.
    claimRefs:
      - CI007
      - CI014
      - CI015
  - id: capitalization-and-runway
    title: Capitalization signals do not establish runway
    body: >
      Public capitalization data are internally inconsistent and should not be promoted to a single precise
      total. Multiples.vc reports $912 million across seven rounds, while Silicon Valley Investclub reports
      $671 million-plus across six rounds; the company homepage separately states more than €500 million of
      private capital. These measures may differ by currency, cut-off date, grants, debt, or round treatment,
      but the retained sources do not reconcile their denominators. Multiples.vc also reports a €270 million
      June 2026 Series D intended for global scaling and serial production and a $1.1 billion June 2025
      valuation, while another profile says a reliably sourced latest valuation is unavailable. None of these
      financing figures equals cash currently available, and none establishes net burn or runway.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
    tableRefs:
      - TI003
  - id: financial-verdict-and-diligence-blockers
    title: Financial verdict and diligence blockers
    body: >
      Revenue quality is not yet underwritable from public evidence. The business can become attractive if
      successful orbital delivery converts into repeat missions, standardized integration, higher factory
      utilization, and positive contribution margin; however, the retained public sources do not disclose
      revenue or profitability. They also do not provide cash on hand, monthly burn, customer deposits,
      cancellation rights, payment milestones, debt obligations, insurance cost, regulatory cost, or
      per-launch gross profit. Management accounts and contract-level evidence are therefore required to
      distinguish funded industrial progress from a capital-intensive program that needs another round before
      reaching sustainable cadence. Until those materials are reviewed, funding raised is only a financing
      signal, not proof of liquidity or economic viability.
    claimRefs:
      - CI005
      - CI006
      - CI009
      - CI010
      - CI011
      - CI014
      - CI015
      - CI016
tables:
  - id: TI001
    title: Revenue streams and service configurations
    columns:
      - Stream
      - Mechanism
      - Commercial unit
      - Public status
      - Revenue-quality implication
      - Diligence ask
    rows:
      - - Dedicated launch
        - Customer flies alone and determines orbit and launch timing
        - Mission contract
        - Publicly offered; realized price and completed commercial revenue undisclosed
        - High contract concentration and milestone sensitivity
        - Obtain signed contracts, deposits, acceptance terms, and cancellation rights
      - - Lead configuration
        - Lead payload sets destination and timing while sharing the vehicle
        - Lead slot plus secondary capacity
        - Publicly offered; pricing and manifest economics undisclosed
        - Depends on allocation of unused capacity and schedule obligations
        - Reconcile lead price, secondary-fill assumptions, and integration costs
      - - Rideshare configuration
        - Multiple payloads share a mission to a predetermined orbit
        - Payload slot or mass allocation
        - Publicly offered; qualification flight carried customer payloads
        - Potentially diversified, but aggregation and delay risk remain
        - Review rate card, minimum manifest, broker fees, and refund terms
    notes: >
      Service configurations come from Isar Aerospace's public website; no retained source provides realized
      pricing, recognized revenue, contract mix, or gross margin.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI005
      - CI006
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Configuration
      - Public price
      - Realized price
      - Discount evidence
      - Underwriting treatment
      - Required evidence
    rows:
      - - Dedicated
        - null
        - null
        - Not disclosed
        - Unknown; do not substitute competitor pricing
        - Executed contract, invoice schedule, and payload-specific change orders
      - - Lead
        - null
        - null
        - Not disclosed
        - Unknown; shared-capacity economics cannot be inferred
        - Lead and secondary allocation, minimum payment, and delay remedies
      - - Rideshare
        - null
        - null
        - Not disclosed
        - Unknown; no supported per-kilogram or slot yield
        - Rate card, broker share, integration fees, and collected deposits
    notes: >
      Null means absent from the retained public evidence, not zero; the company website mentions pricing
      options without publishing numeric prices.
    claimRefs:
      - CI001
      - CI002
      - CI003
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue or ARR
        - null
        - Low
        - Establishes commercial scale; launch revenue is not ARR
        - Audited revenue by mission, customer, and recognition milestone
      - - Realized mission price
        - null
        - Low
        - Sets gross revenue per flight
        - Executed contracts and invoiced consideration by configuration
      - - Gross profit per launch
        - null
        - Low
        - Tests whether cadence can absorb production and range costs
        - Vehicle bill of materials, launch-site cost, insurance, and contribution margin
      - - CAC, sales cycle, and payback
        - null
        - Low
        - Measures efficiency of converting pipeline into cash
        - CRM cohort, bid cost, sales expense, win rate, and collection timing
      - - Cash, net burn, and runway
        - null
        - Low
        - Determines financing dependency and next-round timing
        - Current bank balances, monthly cash flow, debt schedule, and board forecast
      - - Cumulative funding
        - "$912M / seven rounds versus $671M+ / six rounds"
        - Low
        - Conflicting denominators prevent a clean capitalization baseline
        - Reconcile equity, converts, grants, debt, currency dates, and round count
      - - June 2026 Series D
        - "€270M reported by Multiples.vc"
        - Medium
        - Supports industrial scaling but does not equal remaining liquidity
        - Closing documents, proceeds received, uses, and restricted cash
      - - Latest valuation
        - "$1.1B reported for June 2025; disputed as reliably sourced"
        - Low
        - Affects entry price and dilution analysis
        - Signed financing documents, cap table, and convert mechanics
    notes: >
      Funding and valuation values are third-party reports with conflicting coverage; all null financial fields
      are disclosure gaps and must not be interpreted as zero.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
      - CI016
