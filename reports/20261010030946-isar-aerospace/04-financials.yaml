      - CI004
      - CI005
      - CI006
      - CI007
      - CI014
      - CI015
      - CI016
callouts:
  - calloutType: risk
    title: Financing totals are not a runway calculation
    body: >
      Public sources disagree on cumulative funding and do not disclose current cash or burn. Underwriting
      should use cash actually received, remaining unrestricted cash, debt and convert terms, and a
      launch-cadence operating plan rather than treating headline funding as available liquidity.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI014
      - CI016
