callouts:
  - calloutType: "insight"
    title: "Dedicated Launch Agility Versus Rideshare Price Disparity"
    body: "While SpaceX Falcon 9 rideshare missions offer low pricing around $7,000 per kilogram, micro-launchers like Spectrum compete on schedule control and precise orbital delivery. Constellation operators pay a premium for dedicated launch windows to avoid multi-month orbital phasing delays associated with bulk rideshares."
    claimRefs:
      - "CM004"
      - "CM010"
      - "CM011"
  - calloutType: "risk"
    title: "Commercial Pipeline Conversion and Revenue Realization Friction"
    body: "Isar Aerospace's headline $10 billion business pipeline and sold-out posture through 2028 contrast sharply with the €133 million in confirmed contract backlog recorded in statutory accounts. Historical customer interest remains largely non-binding, leaving future revenue conversion heavily dependent on sustained orbital launch reliability."
    claimRefs:
      - "CM005"
      - "CM006"
      - "CM015"
