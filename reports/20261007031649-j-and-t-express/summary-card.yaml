  topStrengths:
    - Large 13-country parcel network with leading disclosed scale in Southeast Asia.
    - FY2025 and 1H2026 results show profitable growth, positive cash flow, and strong liquidity.
    - Automation, network density, and multi-market expansion support operating leverage.
  topRisks:
    - Platform concentration and bargaining power remain under-disclosed and strategically important.
    - China pricing pressure and thin unit margins can compress profitability quickly.
    - Regulatory, labor-safety, and governance exposure remains material across the network.
  unresolvedGaps:
    - A live valuation bridge and independent comparable-multiple set are still missing.
    - Public filings do not disclose platform concentration by revenue or parcel volume with enough precision.
    - China parcel-yield and rebate mechanics remain insufficiently transparent to judge durable margins.
    - New Markets country-level return math and sponsor economics remain only partially disclosed.
    - A clean employee headcount remains unavailable outside mixed service-personnel disclosures.
