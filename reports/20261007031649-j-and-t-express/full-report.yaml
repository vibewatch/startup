  summary: >-
    J&T Express is a Hong Kong-listed express logistics operator that built scale from Indonesia into a 13-country
    network across Southeast Asia, China, the Middle East, and Latin America. The business combines automated sorting
    hubs, line-haul transport, franchise and network-partner last mile, and platform-linked merchant volume to move more
    than 30 billion parcels annually, while recent results show improving profitability and cash generation alongside
    persistent platform-concentration, pricing, and regulatory risk.
