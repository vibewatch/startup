              - CE010
              - CE011
              - CE012
              - CE016
      - number: '5.3'
        title: Digital Platform Architecture and Telecommunications Infrastructure
        blocks:
          - type: paragraph
            body: >-
              J&T Express's technology stack is structured into a four-tier architecture encompassing digital
              infrastructure, a self-developed platform layer, operational application systems, and frontline
              operational tools. The base infrastructure layer integrates self-built computing resources with
              third-party cloud services. On top of this base, J&T Express maintains core platform engines including an
              automated address resolution platform, a big data management platform, an early warning and
              decision-making system, and a dedicated AI model platform. At the operational network layer, branch
              connectivity in island geographies such as the Philippines previously suffered from severe typhoon fiber
              cuts, prompting J&T Express to implement Huawei AR611W-LTE6EA hyper-converged SD-WAN gateways with
              automated LTE cellular failover, cutting branch telecommunications operating expenses by 30% and reducing
              failover recovery latency from 120 minutes to under 3 minutes. For group-wide enterprise resource
              planning, financial consolidation, and supply chain control, the company deployed Yonyou's global platform
              across operating jurisdictions, automating 85% of accounting processes.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: System Integration Bottlenecks, Quality Control, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Rapid multi-country expansion across divergent regulatory and operational regimes has generated acute
              technical and operational vulnerabilities. A critical bottleneck has been legacy system fragmentation
              across regional entities: J&T Express previously maintained disconnected data flows across five core
              internal systems—JMS, Zhitu i+, WeCom, Lark, and OA—across more than 25 administrative regions, causing
              systemic cross-departmental coordination delays that required third-party customer service integration
              from Udesk. In customer-facing support, independent dispute monitors reveal severe service execution
              deficits; on public consumer grievance repositories such as ComplaintsBoard, over 1,932 customer
              complaints are recorded with a 0% formal resolution rate, driven by unannounced delivery rescheduling and
              lost package escalations. On the compliance and cyber front, J&T Express holds ISO27001, ISO27701, and
              Level 3 national information security protection certification in China, and expanded ISO27001
              certification to Indonesia, Malaysia, the Philippines, Thailand, and Vietnam in 2024 to mitigate data
              protection liabilities across international boundaries.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: China Operational Know-How Replication in Emerging Markets
            body: >-
              A central technical driver of J&T Express's rapid market share acquisition in Southeast Asia and Latin
              America is the systematic replication of China's automated logistics playbook. By deploying high-capacity
              automated cross-belt sorting machinery, proprietary address parsing engines, and algorithmic vehicle
              loading optimization across regions like Vietnam, the Philippines, and Brazil, J&T achieves significant
              scale economies that smaller regional carriers struggle to match.
            calloutType: insight
            claimRefs:
              - CE002
              - CE007
              - CE011
          - type: callout
            title: Customer Resolution Deficits and Franchise Service Inconsistency
            body: >-
              Despite extensive automation in sorting and network infrastructure, J&T Express faces severe customer
              dissatisfaction in last-mile package delivery. Data from third-party complaint tracking platforms
              highlights chronic issues with unannounced delivery delays, courier status manipulation, and an effective
              0% complaint resolution rate across 1,932 tracked cases, pointing to structural gaps in franchisee
              oversight and customer support execution.
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Multi-Tier Service Architecture
        blocks:
          - type: paragraph
            body: >-
              J&T Express organizes its commercial customer base across three primary geographic divisions—China,
              Southeast Asia, and New Markets (encompassing Latin America and the Middle East)—each exhibiting distinct
              customer profiles, buyer motivations, and volume profiles. In Southeast Asia and China, the core paying
              customers are e-commerce platform marketplaces (such as Shopee, TikTok Shop, Taobao/Tmall, and Pinduoduo)
              and their registered merchants, who require low-cost, high-reliability parcel sorting and door-to-door
              delivery. In New Markets, cross-border platforms such as SHEIN, Temu, and AliExpress partner alongside
              domestic platforms like Mercado Libre to secure localized last-mile fulfillment. To address varying
              delivery urgency and price sensitivity, J&T operates differentiated service tiers, exemplified in
              Indonesia by standard EZ delivery (1–3 days), economical J&T Eco for inter-island transport (5–14 days),
              and premium same-day J&T Super in major metropolitan areas. In parallel, the company is actively expanding
              non-platform commercial segments—including direct enterprise contracts, social commerce merchants, brand
              chains, and retail individual senders—supported by over 19,800 service outlets and specialized industrial
              belt collection hubs.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU012
      - number: '6.2'
        title: Volume Adoption Trajectory and Global Network Scale
        blocks:
          - type: paragraph
            body: >-
              J&T Express's customer adoption trajectory reached a historic operational milestone in the second quarter
              of 2026, when average daily parcel volume surpassed 101 million parcels, bringing total quarterly volume
              to 9.177 billion parcels (up 24.2% year-on-year). For the first half of 2026, cumulative global volume
              expanded to 17.503 billion parcels, driven primarily by outsized growth in non-China markets. Southeast
              Asia maintained its position as a primary growth engine, delivering 5.523 billion parcels in 1H 2026 (a
              71.2% year-on-year surge) after rising 79.9% in Q1 2026, propelled by elevated social commerce engagement
              and major promotional events such as the Ramadan shopping festival. In China, where the express delivery
              sector has transitioned toward high-quality operational consolidation, J&T handled 11.615 billion parcels
              in 1H 2026 (up 9.6% year-on-year), capturing an 11.6% volume market share according to Frost & Sullivan.
              Meanwhile, New Markets volume surged 119.9% year-on-year in 1H 2026 to 365 million parcels, reflecting
              accelerating merchant and consumer onboarding across Brazil, Mexico, Saudi Arabia, the UAE, and Egypt.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
      - number: '6.3'
        title: Enterprise Customer Proof and Cross-Border Platform Partnerships
        blocks:
          - type: paragraph
            body: >-
              Commercial proof of adoption for J&T Express centers on deep, production-grade API integrations and volume
              fulfillment agreements with the world's fastest-growing e-commerce ecosystems. In Southeast Asia, J&T
              serves as an anchor logistics backbone for ByteDance's TikTok Shop and Sea Limited's Shopee, enabling
              high-density sorting and rapid dispatch across fragmented island geographies. In Latin America, J&T has
              expanded bilateral relationships with regional marketplace titan Mercado Libre in Brazil and Mexico, while
              simultaneously handling inbound destination fulfillment for global cross-border discount leaders Temu,
              SHEIN, and AliExpress. On the ground in Brazil, J&T achieved an 8.2/10 consumer rating on the Reclame Aqui
              consumer protection portal, demonstrating international service adaptability. For domestic merchants and
              SMEs, J&T's nationwide sorting networks and drop-point density provide direct logistical access, although
              service quality variance and carrier competition remain ongoing operational challenges across complex
              regional geographies.
            claimRefs:
              - CU004
              - CU007
              - CU008
              - CU009
              - CU013
          - type: table
            tableRef: TU003
            claimRefs:
