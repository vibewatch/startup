  - id: FE001
    title: J&T Express Four-Tier Digital Intelligence and Operations Stack
    type: stack
    summary: >-
      Structural architecture map illustrating J&T Express's digital infrastructure, platform algorithms, application
      suites, and operational execution channels.
    data:
      layers:
        - label: Field Operations & Fulfillment Layer
          description: Execution touchpoints across 260 sorting centers, ~19,800 outlets, and ~600 unmanned delivery vehicles
          modules:
            - Automated cross-belt sorters in core transit hubs
            - Franchisee network partner outlet point-of-sale systems
            - Autonomous unmanned last-mile electric delivery vehicles
          note: Frontline logistics infrastructure spanning 13 national operational networks
        - label: Application & Enterprise Management Layer
          description: Operational management tools, route dispatching dashboards, and enterprise systems
          modules:
            - J&T Digital Intelligence dispatch and vehicle load planning suite
            - Yonyou global financial and supply chain management platform
            - Udesk omnichannel customer inquiry and automated ticketing platform
          note: Centralized operational oversight coordinating cross-border logistics workflows
        - label: Platform & Algorithmic Intelligence Layer
          description: Proprietary algorithms for geospatial address matching, volume prediction, and routing
          modules:
            - Dynamic map AOI and automated address resolution engine
            - Volume forecasting and intelligent capacity scheduling platform
            - Early warning, decision-making, and line-haul optimization algorithms
          note: Algorithmic decision core driving operational cost efficiencies
        - label: Network Communications Layer
          description: High-availability enterprise networking and automated disaster recovery links
          modules:
            - Huawei hyper-converged AR611W-LTE6EA SD-WAN branch gateways
            - Automated sub-3-second LTE wireless cellular backup connections
            - Real-time link quality telemetry and visualized network digital map
          note: Critical branch telecommunications infrastructure for disaster resilience
        - label: Cloud & Compute Infrastructure Layer
          description: Hybrid computing environment hosting core logistics databases and services
          modules:
            - Self-built private computing power cloud clusters
            - Third-party commercial cloud platform hosting services
            - Distributed multi-region containerized application environments
          note: Scalable compute foundation supporting global operations across 13 countries
        - label: Information Security & Data Defense Layer
          description: Multi-jurisdictional compliance and information security controls
          modules:
            - ISO27001 certified security defenses across SEA and China
            - ISO27701 privacy information management framework
            - China National Information Security Level Protection Class 3 controls
          note: Standardized cybersecurity and data privacy baseline across operating regions
    approximationNotes: >-
      Layer classifications and functional module allocations synthesized directly from J&T Express corporate
      presentations and partner implementation disclosures.
