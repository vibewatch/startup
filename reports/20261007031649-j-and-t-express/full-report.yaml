      - number: '5.2'
        title: Operating Model and Sorting Infrastructure
        blocks:
          - type: paragraph
            body: >-
              The group's operational model combines centralized sorting hubs with a hybrid line-haul transportation
              fleet and franchised network partner outlets. As of mid-2026, J&T Express operates 260 sorting centers and
              approximately 19,800 courier outlets worldwide, supported by over 6,400 network partner franchisees who
              manage localized last-mile operations. Line-haul transit relies on an active fleet of more than 12,700
              line-haul vehicles globally, of which over 7,200 are self-owned trucks and the remainder contracted
              through third-party logistics carriers. In China and Southeast Asia, J&T Express has progressively
              deployed high-capacity automated cross-belt sorting systems, reaching 397 automated sorting machines
              globally by late 2025 and 413 units by year-end. Major capital projects including the Yangzhou Sorting
              Center and Guangzhou Sorting Center were engineered to expand automated hub throughput ahead of major peak
              shopping campaigns. To reduce dependence on manual labor in last-mile pickup and delivery, the company has
              deployed approximately 600 unmanned delivery vehicles across selected Chinese municipal zones.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
