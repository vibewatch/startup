              - CR006
      - number: '7.2'
        title: Operational Vulnerabilities in Sorting Automation, Labor Dynamics, and Quality Control
        blocks:
          - type: paragraph
            body: >-
              J&T Express conducts operations at immense physical scale, processing 30.1 billion parcels in FY2025
              across 246 sorting centers and approximately 19,800 outlets globally. Maintaining service reliability and
              labor safety across this distributed footprint creates persistent execution friction. Rapid throughput
              expansion, including handling peak volumes exceeding 100 million parcels daily in Q2 2026, places severe
              operational stress on hub facilities and line-haul routes. While the group operates over 7,200 line-haul
              vehicles in China and expanded automated sorting sets to 413 by end-2025, network partner outlets and
              delivery contractors exhibit variable execution standards. Consumer complaint aggregation indicates
              friction in last-mile parcel handling and complaint resolution, where consumer sentiment tracks issues
              surrounding falsified delivery statuses, non-responsive customer service, and rider disputes. Operational
              safety accidents identified by Chinese authorities underscore that rapid volume expansion without
              centralized enforcement of safety protocols poses material brand damage and legal liability risks.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
