chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Listing, and Network Footprint
        blocks:
          - type: paragraph
            body: >-
              J&T Express is a global express logistics operator established in August 2015 with founding operational
              roots in Indonesia. Following rapid expansion across Southeast Asia and mainland China, the operating
              parent J&T Global Express Limited completed a public listing on the Main Board of the Hong Kong Stock
              Exchange in October 2023 under ticker 01519. The company's core operations center on express courier
              delivery, cross-border fulfillment, and supply chain logistics services. J&T Express has structured an
              integrated parcel delivery network covering 13 countries globally, including core Southeast Asian
              territories (Indonesia, Vietnam, Malaysia, the Philippines, Thailand, Cambodia, Singapore), mainland
              China, Middle Eastern expansion markets (Saudi Arabia, the United Arab Emirates, Egypt), and Latin
              American markets (Mexico, Brazil). This diversified geographic footprint allows J&T Express to capture
              escalating cross-border and domestic e-commerce shipment volumes from global and regional merchant
              platforms.
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
              - CO010
              - CO015
      - number: '1.2'
        title: Executive Leadership and Corporate Governance
        blocks:
          - type: paragraph
            body: >-
              Corporate leadership and global execution at J&T Express are led by a senior management team with deep
              operational experience across emerging market logistics and technology distribution. Dylan Tey serves as
              Chief Financial Officer, directing group financial reporting, capital expenditure allocations, free cash
              flow management, and public market engagement on the Hong Kong Stock Exchange. Charles Hou serves as Group
              Vice President, overseeing international network expansion, sorting infrastructure investments, and
              commercial partnerships across Southeast Asia, China, and New Markets. Corporate governance is coordinated
              by group headquarters with local operational execution managed by regional subsidiaries in each target
              geography. In mainland China, the group established a formalized labor negotiation framework covering over
              290,000 self-operated and franchise workers, addressing algorithm transparency and delivery driver
              compensation. However, key-person dependence remains concentrated around founder-aligned leadership and
              executive committee members who drove the initial regional buildouts.
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: Capital Structure, Commercial Partnerships, and Network Dynamics
        blocks:
          - type: paragraph
            body: >-
              J&T Express operates an open-platform delivery ecosystem that combines heavy capital infrastructure
              investments with strategic commercial relationships across major digital commerce platforms. Rather than
              relying on a captive parent marketplace, J&T Express positions itself as an independent logistics
              infrastructure provider serving multi-platform volume. In Southeast Asia, the company serves leading
              digital marketplaces including TikTok Shop, Shopee, Lazada, and SHEIN, expanding regional market share to
              34.4% in 2025. In Latin America, J&T Express established a commercial delivery partnership with regional
              e-commerce leader Mercado Libre in 2025, enabling the New Markets division to rapidly scale local parcel
              density. The company relies on a hybrid network model combining self-operated sorting hubs and line-haul
              fleets with local franchise outlets and network partners. Capital allocation has prioritized hub
              automation, fleet renewal, and self-built regional logistics parks to drive down unit processing costs.
            claimRefs:
              - CO008
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO012
              - CO013
      - number: '1.4'
        title: Operational Scale, Financial Turnaround, and Quality Challenges
        blocks:
          - type: paragraph
            body: >-
              Fiscal year 2025 represented an operational and financial inflection point for J&T Express. Consolidated
              annual parcel volume surpassed 30 billion pieces for the first time, reaching 30.1 billion parcels (up
              22.2% year-over-year) and generating US$12.2 billion in revenue (up 18.5% year-over-year). Adjusted net
              profit surged 112.3% to US$425 million, supported by operating cash flow of US$1.09 billion and free cash
              flow of US$494 million. The company's geographic diversification strategy gained significant traction as
              non-China markets contributed 44% of consolidated revenue, up from 37% in 2024. Most notably, the New
              Markets segment (Middle East and Latin America) generated its first full-year adjusted EBIT profit of US$4
              million, turning positive within three years of operations. First quarter 2026 data confirmed continued
              operating momentum, with global parcel volume reaching 8.326 billion pieces. However, rapid volume scaling
              has strained last-mile delivery quality, as evidenced by consumer review platform tracking showing chronic
              complaints regarding failed deliveries, parcel misplacement, and customer service responsiveness.
            claimRefs:
              - CO006
              - CO007
              - CO009
              - CO010
              - CO011
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Geographic Decoupling and Emerging Market Profitability
            body: >-
              J&T Express has materially reduced its dependence on China express delivery, lifting non-China revenue to
              44% of consolidated revenue in 2025. Crucially, the New Markets segment in Latin America and the Middle
              East swung to positive adjusted EBIT of US$4 million within three years of launch, proving that the
              cross-border delivery flywheel can replicate outside Southeast Asia.
            calloutType: insight
            claimRefs:
              - CO006
              - CO009
              - CO012
          - type: callout
            title: Customer Service Escalation and Delivery Friction
            body: >-
              Despite rapid volume scaling and network automation, third-party complaint data reveals notable consumer
              dissatisfaction in last-mile parcel handoffs. Independent tracking on ComplaintsBoard recorded an
              unresolved complaint rate of 100% across 1,932 customer submissions, pointing to chronic post-delivery
              resolution gaps that threaten long-term brand equity.
            calloutType: risk
            claimRefs:
              - CO014
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Category Scope, and Adjacencies
        blocks:
          - type: paragraph
            body: >-
              The core addressable market for J&T Express encompasses courier, express, and parcel (CEP) logistics
              services, specifically focusing on high-velocity B2C and C2C e-commerce parcel fulfillment across
              Southeast Asia, mainland China, Latin America, and the Middle East [CM001]. Express parcel delivery
              operates on contracted transit windows typically ranging from 12 to 48 hours, supported by automated
              sorting hubs, regional line-haul transit routes, and dense last-mile delivery networks [CM002]. Included
              logistics spend comprises door-to-door express deliveries, regional line-haul transportation, sorting and
              processing fees, time-definite priority services, and cash-on-delivery (COD) settlement administration
              [CM001, CM006]. Conversely, excluded market spend comprises bulk non-containerized ocean freight, heavy
              industrial contract logistics, standard postal letter carriage, and traditional corporate parcel courier
              contracts unrelated to digital commerce workflows [CM001, CM002]. Adjacent market vectors such as
              cloud-integrated fulfillment warehousing, cross-border customs bonded clearance zones, and
              micro-fulfillment urban dark stores increasingly intersect with express operations, while internal
              logistics arms of major platforms represent the primary status-quo substitute [CM004, CM006].
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
      - number: '2.2'
        title: 'Market Sizing Lenses: TAM, SAM, and SOM Breakdown'
        blocks:
          - type: paragraph
            body: >-
              Sizing the express logistics landscape requires multiple analytical lenses across global, regional, and
              company fulfillment boundaries. On a global scale, the total addressable market (TAM) for express delivery
              services reached $77.41 billion in 2025 and is projected to expand to $99.97 billion by 2035 at a compound
              annual growth rate of 2.59% according to Market Research Future estimates [CM003]. A broader domestic
              courier, express, and parcel study estimates a $368.3 billion market in 2024, illustrating how category
              boundaries produce materially different totals that are not directly comparable with express-delivery-only
              estimates [CM013]. At the regional serviceable addressable market (SAM) level, Southeast Asia's e-commerce
              retail transaction value reached $162 billion in 2025 with express parcel volume of 22 billion units,
              projected by Frost & Sullivan to reach 29 billion parcels in 2026 and 54 billion parcels by 2030 [CM004].
              Within specific national territories, Thailand's CEP market alone is valued at $3.03 billion in 2026 by
              Mordor Intelligence, growing at 7.11% CAGR toward $4.27 billion by 2031 [CM005]. J&T Express's serviceable
              obtainable market (SOM) captured 34.4% of Southeast Asian parcel volume in FY2025 and handled 5.523
              billion parcels in the region during 1H2026, alongside an 11.6% volume market share in China and 8.9% in
              newly developed emerging markets [CM007, CM008, CM009]. Cross-border parcel flows and live-stream impulse
              buying continue to expand volume throughput across primary regional markets [CM005, CM006].
            claimRefs:
              - CM003
              - CM013
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: Buyer Segmentation, Workflow Integration, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              Demand for express fulfillment originates from three primary customer tiers: international and domestic
              e-commerce marketplaces, social-commerce and live-stream merchants, and direct-to-consumer brand
              enterprises [CM001, CM006, CM007]. Multi-national e-commerce platforms such as Shopee, Lazada, TikTok
              Shop, TEMU, SHEIN, AliExpress, and Mercado Libre maintain master service agreements with express carriers,
              where platform logistics leadership and merchant-operations teams own vendor allocation based on service
              level agreement (SLA) attainment, baseline tariff rates, and automated API integration stability [CM001,
              CM007, CM010]. Independent digital merchants and social-commerce sellers prioritize rapid working-capital
              turnaround and cash-on-delivery liquidity, adopting carriers that provide accelerated payment cycles such
              as 24-hour COD settlement [CM006, CM008]. Non-platform enterprise accounts and retail chain brands
              evaluate door-to-door reliability, customized packaging integrity, priority service channels, and
              dedicated account support [CM008, CM011].
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM010
      - number: '2.4'
        title: Structural Growth Drivers and Operational Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Market growth is propelled by secular digital commerce expansion, rising parcel volumes per capita across
              emerging economies, and the explosive proliferation of social-commerce live-streaming formats that
              fragment basket sizes into single-item deliveries [CM004, CM006]. In response, automated sorting
              technology and autonomous line-haul vehicles are deployed to compress sorting dwell times and manage
              peak-hour demand surges [CM006, CM008, CM011]. Conversely, operational adoption faces substantial
              structural constraints. Margin compression from recurring free-shipping price competition limits regional
              carrier profitability, while dense urban alley geography and non-standardized addressing require
              labor-intensive delivery mechanisms [CM005, CM006, CM011]. Furthermore, persistent customer
              dissatisfaction regarding unfulfilled deliveries and ineffective complaint resolution processes creates
              brand trust friction, highlighting ongoing service delivery bottlenecks across fast-growing fulfillment
              networks [CM012].
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM011
              - CM012
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Fintech Settlement Acceleration as an E-Commerce Merchant Adoption Catalyst
            body: >-
              In emerging Southeast Asian e-commerce corridors, logistics adoption is dictated as much by financial
              liquidity as by transit velocity. By partnering with institutional fintech providers such as HSBC in
              Thailand to compress cash-on-delivery settlement cycles from seven days down to 24 hours, express
              operators directly alleviate merchant cash flow constraints, securing sticky delivery volumes in
              cash-reliant retail segments [CM006].
            calloutType: insight
            claimRefs:
              - CM006
          - type: callout
            title: Consumer Trust Deficit from Customer Support Friction
            body: >-
              Despite rapid volume expansion and high headline parcel throughput, independent customer review platforms
              report substantial consumer dissatisfaction. Data from ComplaintsBoard reveals an unresolved complaint
              backlog across thousands of consumer filings regarding lost shipments, false delivery status markers, and
              ineffective customer service escalation, indicating that operational scale has outpaced frontline
              resolution capabilities [CM012].
            calloutType: risk
            claimRefs:
              - CM012
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and relative scale
        blocks:
          - type: paragraph
            body: >-
              The competitive set changes by geography and by the buyer's actual alternative. In Southeast Asia, J&T's
              FY2025 presentation reports 34.4% market share, ahead of both third-party carriers and e-commerce-owned
              fleets; independent reporting names SPX, LGS, and Flash as the most visible regional alternatives. In
              China, J&T reports an 11.1% share and a top-five position, placing it against established national
              networks rather than only venture-backed entrants. A prospective US expansion would face a different
              structure: USPS, FedEx, and UPS reportedly control more than 85% of last-mile volume, while GOFO and
              UniUni have already accumulated meaningful daily parcel scale. Generic competitor directories produce
              different lists because they mix freight platforms, supply-chain providers, and couriers; they are
              discovery aids, not proof of a single exhaustive peer set.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: Operating-system differentiation and distribution power
        blocks:
          - type: paragraph
            body: >-
              J&T's defensible advantage is less a unique delivery product than the combination of network density,
              local operating partners, automation, and a portable technology layer. The company reported 246 sorting
              centers, more than 13,300 line-haul vehicles, and coverage across 13 countries at December 2025; its
              website later reported 260 sorting centers, approximately 19,800 outlets, and around 6,400 network
              partners at June 2026. The regional sponsor model delegates outlet ownership and local execution while
              headquarters supplies strategy and technology. That structure can accelerate entry and reduce capital
              intensity, but it also distributes service execution across partners. Platform-owned fleets possess a
              different advantage: they control order flow. J&T's reported dependence on TikTok volume therefore makes
              multi-homing and platform bargaining power central durability questions, not merely customer-concentration
              footnotes.
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP011
              - CP015
      - number: '3.3'
        title: Pricing pressure and geographic portability
        blocks:
          - type: paragraph
            body: >-
              The strongest public pricing evidence is unit economics rather than customer tariffs or contract terms.
              J&T reported Southeast Asian FY2025 revenue of US$0.71 and adjusted EBIT of US$0.07 per parcel, consistent
              with a high-volume, thin-unit-margin model. China showed US$0.30 revenue and US$0.004 adjusted EBIT per
              parcel, while New Markets reached US$0.01 adjusted EBIT per parcel for FY2025 and US$0.09 in the second
              half. Historical reporting shows that aggressive China pricing previously produced gross losses per
              shipment, so scale alone does not guarantee attractive economics. The US portability test is harsher:
              independent reporting estimates that a national launch could require more than US$100 million, while
              incumbents and low-cost challengers can respond on price. Because competitor tariffs, rebates,
              service-level penalties, and realized contract prices are not public in the assigned evidence, the
              comparison must remain directional.
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP016
      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              J&T's moat appears strongest where density, e-commerce growth, and its sponsor network reinforce one
              another; it appears weakest when the company must buy share in a high-cost market or when a large platform
              internalizes logistics. The disclosed improvement in Southeast Asian delivery time and lost-parcel rate
              supports an operating-learning thesis, but consumer evidence is mixed. ComplaintsBoard counted 1,932
              complaints through June 11, 2026 and marked only four resolved; this is a self-selected complaint sample
              and not a population-level failure rate, yet it is a useful adverse signal. Historical Chinese
              satisfaction data also placed J&T below the leading five brands. The investment implication is a
              conditional moat: density and execution can sustain low prices, while platform dependence, partner-level
              consistency, and incumbent responses can erode the advantage. Diligence should prioritize platform
              concentration, independently measured service quality, and like-for-like realized pricing.
            claimRefs:
              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is not the same as buyer control
            body: >-
              J&T's parcel density can lower unit cost, but a platform that owns demand can redirect volume or expand an
              in-house fleet. Underwrite the network advantage together with platform concentration and multi-carrier
              behavior.
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Commercial Model
        blocks:
          - type: paragraph
            body: >-
              J&T Express operates primarily as an express delivery service provider, deriving the vast majority of its
              top-line revenue from domestic express parcel handling across Southeast Asia, China, and New Markets
              (including Saudi Arabia, UAE, Mexico, Brazil, and Egypt), complemented by cross-border logistics. In
              FY2025, group revenue expanded by 18.5% year-on-year to US$12.16 billion (up from US$10.26 billion in
              FY2024), with express delivery services representing US$12.08 billion of total core operations. Growth
              accelerated significantly in 1H 2026, where group revenue reached US$7.67 billion, representing a 39.5%
              year-on-year increase, with express services contributing US$7.46 billion. Southeast Asia remains a
              high-margin engine, generating US$4.50 billion in FY2025 revenue (19.1% gross margin) and surging 71.2% in
              parcel volume in 1H 2026. China represents the largest revenue contributor at US$6.71 billion in FY2025,
              but operates at a narrower 6.7% gross margin due to intense domestic tariff competition. The emerging New
              Markets segment contributed US$870 million in FY2025 revenue and grew parcel volume by 119.9% in 1H 2026,
              demonstrating rapid commercial scaling.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI006
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI006
      - number: '4.2'
        title: Unit Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              The group's cost structure is characterized by heavy variable operating expenditures across pickup and
              delivery, line-haul transportation, and automated sorting center operations. In FY2025, group cost of
              revenue stood at US$10.70 billion, yielding a consolidated gross profit of US$1.46 billion (12.0% gross
              margin). Segmental unit economics reveal contrasting regional dynamics: Southeast Asia generated an
              average selling price (ASP) of US$0.59 per parcel against COGS of US$0.48, delivering an adjusted EBIT of
              US$0.07 per parcel in FY2025. In China, ASP reached US$0.30 per parcel against COGS of US$0.28 per parcel,
              generating an adjusted EBIT of US$0.004 per parcel. In New Markets, ASP was US$2.15 per parcel against
              COGS of US$2.14 in FY2025, turning adjusted EBIT positive to US$0.01 per parcel for the full year and
              US$0.09 per parcel in 2H 2025. By 1H 2026, group adjusted EBIT per parcel expanded 77% year-on-year to
              US$0.025, underpinned by extensive hub automation and network density. However, consumer complaints
              regarding parcel handling and service execution highlight operational strain during high-volume periods.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI008
              - CI009
      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              J&T Express has transitioned from high cash burn to self-sustaining operational cash flow, significantly
              reducing financing dependency. In FY2025, net cash generated from operating activities reached US$1.09
              billion, up from US$807 million in FY2024, yielding free cash flow of US$494 million after capex of US$594
              million. Operating cash flow momentum continued into 1H 2026, reaching US$640 million (up 50.9%
              year-on-year). As of June 30, 2026, cash and cash equivalents, restricted cash, and bank wealth management
              products totaled US$2.91 billion, compared to US$2.20 billion at year-end FY2025. Debt obligations have
              been actively restructured: total borrowings at December 31, 2025 stood at US$2.41 billion, including a
              syndicated loan of RMB 10 billion utilized to replace US$1.25 billion in high-interest debt due in October
              2028. Strategic institutional ties remain notable; competitor SF Express (S.F. Holding) holds equity in
              J&T Express recorded at a book value of RMB 1.01 billion (US$140 million equivalent) as of June 30, 2025,
              following the earlier Fengwang Express transaction. Capital adequacy is sufficient for near-term network
              expansion, though capex commitments of US$154 million and ongoing automated sorting investments require
              disciplined underwriting.
            claimRefs:
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Southeast Asian Margin Buffer Offsets China Price War Pressures
            body: >-
              J&T Express's geographic diversification serves as a critical structural hedge. While China accounts for
              55% of revenue, intense market competition compresses its adjusted EBIT to US$0.004 per parcel. In
              contrast, Southeast Asia delivers US$0.07 adjusted EBIT per parcel with a 19.1% gross margin, funding
              group-wide innovation, hub automation, and aggressive Latin American and Middle Eastern expansion.
            calloutType: insight
            claimRefs:
              - CI002
              - CI007
              - CI008
          - type: callout
            title: Last-Mile Delivery Friction and Complaint Resolution Vulnerabilities
            body: >-
              Rapid volume expansion to over 100 million parcels daily has exacerbated frontline customer service
              friction. External review platforms report severe complaint backlogs with near-zero resolution rates for
              recorded complaints, indicating that automated sorting and driver density have outpaced customer care
              infrastructure.
            calloutType: risk
            claimRefs:
              - CI010
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Service Portfolio and Regional Product Lines
        blocks:
          - type: paragraph
            body: >-
              J&T Express structures its core operations around standardized express courier delivery, intra-city
              distribution, and cross-border logistics tailored specifically for high-velocity e-commerce merchants.
              Founded in Indonesia in 2015, the group rapidly expanded its product offerings across Southeast Asia,
              China, Latin America, and the Middle East, reaching 13 operational country networks. Its primary product
              SKUs center on standard express parcel handling for e-commerce platforms such as Shopee, TikTok Shop, and
              Mercado Libre, supplemented by specialized fulfillment capabilities including agricultural green channels
              and remote-area parcel aggregation in mainland China. In mature markets, J&T Express has developed cloud
              warehousing services spanning 152 warehouses covering 490,000 square meters, allowing online sellers to
              co-locate inventory directly within logistics transfer corridors. However, service tiers remain heavily
              anchored to standard e-commerce deliveries, leaving specialized cold-chain and premium enterprise courier
              capabilities under-represented.
            claimRefs:
              - CE001
              - CE002
