              - CR014
              - CR015
      - number: '7.3'
        title: Platform Concentration and Regional Sponsor Governance Fragility
        blocks:
          - type: paragraph
            body: >-
              The group's commercial model depends heavily on key e-commerce marketplace counterparties and
              unconsolidated regional operating sponsors. In Southeast Asia, e-commerce platforms generated over 90% of
              delivered parcel volumes historically, with Sea Group's Shopee serving as a pivotal anchor. Shifts in
              platform partner logistics allocations present acute localized disruption. In early 2026, Philippine
              merchants and consumers reported that Shopee issued fulfillment advisories discontinuing J&T Express as an
              integrated platform logistics partner in February 2026, causing commercial disruption and highlighting
              vulnerability to platform insourcing via proprietary networks like SPX Express. Furthermore, J&T's
              regional sponsor structure delegates localized pickup and delivery network management to third-party
              entrepreneurs and regional entities. While capital-efficient during rapid international expansion across
              New Markets in the Middle East and Latin America, regional sponsors vary significantly in operational
              discipline, financial capitalization, and regulatory compliance, creating brand-wide spillover risks
              whenever localized partner failures emerge.
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Crackdown Escalates from Local Fines to Headquarters Accountability
            body: >-
              The June 2026 State Post Bureau probe represents an inflection point in Chinese regulatory posture toward
              J&T Express. By targeting headquarters-level responsibility for operating accidents across branded
              entities, regulators have challenged the structural buffer previously afforded by the regional sponsor and
              franchisee model. Investors must treat this as a thesis-level operational risk capable of imposing direct
              financial penalties and operational curtailments.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The recommendation is research-more, with medium confidence, high risk, and an indeterminate valuation
              stance. J&T is already a listed, multinational operator rather than a private startup: company-issued
              materials identify stock code 1519.HK and a 13-country network. Operating results are improving, but
              company quality and security attractiveness are different questions. The retained evidence supplies no
              live share price, current diluted market capitalization, enterprise value, or independent peer multiple
              set. It therefore cannot establish an evidence-backed entry price, target return, or holding-period
              return. The HKD10.10 SF issuance is useful as a strategic transaction anchor, not as a standalone
              fair-value opinion. A new position should wait for the live valuation bridge and comparable-set work
              identified below.
            claimRefs:
              - CV001
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: Operating proof and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis has measurable support. FY2025 revenue was US$12.158 billion, IFRS profit for the year was
              US$225.3 million, and company-defined free cash flow was US$494 million. Momentum continued in 1H2026:
              revenue reached US$7.67 billion, adjusted net profit reached US$350.6 million, and operating cash flow
              reached US$635.5 million. These periods and definitions must remain separate: adjusted net profit is a
              non-IFRS measure and is not cash flow. The anti-thesis is equally material. A retained independent profile
              describes brutal regional price competition and painfully thin margins, while the operating footprint
              includes 14 self-built core logistics parks covering 1.05 million square meters at end-2025. Scale can
              improve unit economics, but it also makes capital discipline and pricing resilience central to value.
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: Financing, dilution, and governance
        blocks:
          - type: paragraph
            body: >-
              The January 2026 SF Holding agreement is the strongest retained valuation reference: J&T agreed to issue
              822 million Class B shares at HKD10.10 each, after which SF would own 10% of J&T's enlarged share base.
              Those terms mechanically imply about 8.22 billion post-issue shares and an HKD83.0 billion equity-value
              anchor at the issue price; that calculation is not a current market capitalization or fair-value target.
              The same disclosure also signals material dilution and strategic concentration, although J&T's 1H2026
              repurchases partly offset issuance at a different scale. Governance remains a diligence item because
              founder Jet Jie Li simultaneously serves as chairman and chief executive. Completion status, the current
              fully diluted share count, and any remaining preference-like or fair-value liabilities must be reconciled
              before underwriting an entry price.
            claimRefs:
              - CV003
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: Scenarios, exit readiness, and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              Scenario framing is directional because the valuation denominator is missing. The bull case requires
              sustained revenue growth, rising IFRS earnings, positive free cash flow, and proof that pricing discipline
              survives parcel-volume expansion; it would justify a value above the strategic transaction anchor, but the
              retained evidence does not support a ceiling. The base case keeps valuation near that anchor while
              requiring a live enterprise-value bridge before action. The bear case places value below the anchor if
              price competition compresses margins, cash generation reverses, or capital needs rise. A public listing
              provides an exit route, and Hang Seng Index inclusion is a positive market-access signal, but neither
              proves an attractive entry. Thesis-breaks are two consecutive reporting periods of weaker cash conversion,
              loss of IFRS profitability, or evidence that issuance and leverage overwhelm buybacks.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline overrides company quality
            body: >-
              Improving earnings and cash generation justify diligence, but they do not justify a buy without a live
              market-value denominator and independent comparable multiples.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV015
              - CV016
          - type: callout
            title: Do not treat the SF issue price as fair value
            body: >-
              The HKD10.10 issue price reflects a strategic cross-shareholding transaction and may embed bilateral
              benefits that public minority investors cannot replicate.
            calloutType: risk
            claimRefs:
              - CV011
              - CV012
