      - number: '6.4'
        title: Customer Journey Dynamics, Retention, and Concentration Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              The merchant customer journey begins with e-commerce platform API integration and digital waybill
              generation, progressing through local outlet drop-off or courier pickup, line-haul transit, automated
              regional sorting, and final last-mile doorstep handoff. High-volume enterprise customers are retained
              through value-added capabilities such as cloud warehousing, priority customer service channels, and the
              Tuyouda premium delivery framework. Despite these sticky operational touchpoints, customer experience is
              vulnerable to last-mile execution friction. Consumer reviews and dispute logs reveal recurring customer
              complaints regarding failed delivery attempts, premature delivery status markings, and delayed customer
              service escalations. More critically, J&T faces structural customer concentration risk: because public
              filings do not disclose the exact percentage revenue or parcel volume contribution from top platform
              clients such as ByteDance or PDD Holdings, investors face unhedged uncertainty regarding platform
              bargaining power, merchant shipping fee clawbacks, and the threat of captive in-house logistics
              displacement.
            claimRefs:
              - CU007
              - CU010
              - CU013
              - CU014
              - CU015
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU008
              - CU010
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Social Commerce Flywheel Drives Southeast Asian Volume Density
            body: >-
              J&T Express's rapid expansion across Southeast Asia demonstrates how deeply tied express parcel throughput
              is to social commerce adoption. Rather than relying solely on legacy search-based marketplace
              integrations, J&T's early integration with TikTok Shop and livestream commerce creates high-frequency
              parcel density that lowers unit line-haul and sorting costs, reinforcing its number-one regional market
              position.
            calloutType: insight
            claimRefs:
              - CU004
              - CU007
              - CU008
          - type: callout
            title: Platform Allocation Power and Realized Yield Uncertainty
            body: >-
              While J&T Express has scaled beyond 100 million daily parcels globally, its dependence on a handful of
              mega-platforms—notably ByteDance/TikTok, Pinduoduo/Temu, and regional leaders—leaves it vulnerable to
              platform policy shifts, in-house carrier substitution, and aggressive price negotiation. Because detailed
              revenue share per platform remains undisclosed, customer concentration represents an unhedged operational
              risk.
            calloutType: risk
            claimRefs:
              - CU001
              - CU007
              - CU013
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: State Postal Bureau Scrutiny and Cross-Border Compliance Exposure
        blocks:
          - type: paragraph
            body: >-
              Regulatory and administrative enforcement represents an acute operational and headline risk for J&T
              Express. In June 2026, China's State Post Bureau formally initiated an administrative case against J&T
              Express Co following multiple fatal work process safety accidents at operating enterprises using the J&T
              brand, trade name, and delivery waybills. Market reaction was immediate, with shares tumbling as much as
              11.5% to HK$7.85 during intraday trading on the Hong Kong Stock Exchange. Unlike historical low-level
              warnings and minor local fines, regulators targeted headquarters-level management failures, alleging
              systematic lapses in unified safety protocols and inadequate oversight across brand-licensed entities. The
              company acknowledged deficiencies and established a specialized rectification task force, but exposure to
              formal operational rectification orders or substantial administrative fines remains active. Beyond China,
              J&T operates across thirteen diverse legal jurisdictions, requiring strict adherence to local corporate
              registration, customs clearance, and transport licensing regimes such as the Courier Service Operation
              Permit in China and the transport management license framework in Thailand.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
