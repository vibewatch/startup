      - CR010
  - id: TR003
    title: Partner and Dependency Risk Register
    columns:
      - Dependency / Counterparty
      - Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - Shopee (Sea Group)
        - Core Southeast Asian e-commerce marketplace
        - Substantial platform parcel volume share
        - Exclusion from logistics options, shifting volumes to SPX Express, higher commission take-rates
        - Critical
        - Diversification into non-platform brand clients, social e-commerce (TikTok Shop), and local merchants
        - Volume loss in contested markets like the Philippines, margin compression from unilateral rate demands
      - - Regional Operating Sponsors
        - Franchise managers for local outlets and depots
        - 12,900+ network partner-operated outlets globally
        - Sponsor insolvency, service termination, labor wildcat strikes, or regulatory non-compliance
        - High
        - Regular KPI performance reviews set by country headquarters, standardized training
        - Difficulties finding timely replacement sponsors in remote regions; localized service shutdowns
      - - Cross-Border Marketplaces (SHEIN, Temu, AliExpress)
        - Anchor volume providers in New Markets
        - Primary volume driver in Latin America & Middle East
        - Customs regulatory shifts, tariff elimination (de minimis changes), or route internalization
        - High
        - Local-to-local e-commerce partnerships (e.g. Mercado Libre in Brazil and Mexico)
        - Volatile international parcel volumes and fluctuating unit economics in early-stage markets
      - - Third-Party Line-Haul Carriers
        - Supplemental trunk-line transportation
        - Significant vehicle share during peak periods
        - Fuel price spikes, driver shortages, service interruption during peak holiday surges
        - Medium
        - Expanding self-owned fleet (1,880 net self-owned line-haul vehicles added in FY2025)
        - Operating leverage risk and capital intensity from owned fleet depreciation
    notes: >-
      Ordered by severity. Reflects counterparty concentration across platform marketplaces, franchise partners, and
      cross-border aggregators.
    claimRefs:
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
      - CR016
  - id: TV001
    title: Recommendation summary table
    columns:
      - Decision field
      - Current view
      - Evidence boundary
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Operating proof is current but live valuation inputs are absent.
        - Do not issue a price-insensitive buy or sell call.
      - - Confidence
        - Medium
        - Official operating data are strong; market-value evidence is incomplete.
        - Confidence rises only after an independently checked valuation bridge.
      - - Risk rating
        - High
        - Price competition, capital intensity, dilution, and founder role concentration remain material.
        - Require downside and governance diligence before entry.
      - - Valuation stance
        - Indeterminate
        - HKD10.10 per share is a strategic issuance anchor, not a current fair-value conclusion.
        - Compare live price and enterprise value with the anchor and peers.
      - - Entry discipline
        - No evidence-backed threshold
        - Current market capitalization, net debt, and comparable multiples are missing.
        - Set target return and hold period only after those inputs are obtained.
    notes: >-
      Decision as of 2026-10-07; the retained sources do not provide a live share price or current fully diluted market
      capitalization.
    claimRefs:
      - CV001
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Lens
      - Evidence-led argument
      - What would change the view
    rows:
      - - Thesis
        - FY2025 revenue reached US$12.158B and IFRS profit reached US$225.3M.
        - A restatement or reversal of IFRS profitability would weaken the thesis.
      - - Thesis
        - 1H2026 revenue rose 39.5% YoY to US$7.67B.
        - Material deceleration without better margins would reduce the growth premium.
      - - Thesis
        - 1H2026 adjusted net profit rose 124.3% YoY to US$350.6M.
        - Reconcile adjusted earnings to IFRS profit and cash conversion each period.
      - - Thesis
        - Operating cash flow was US$635.5M in 1H2026 after US$494M of company-defined free cash flow in FY2025.
        - Negative free cash flow or weaker cash conversion for two reporting periods would break the cash thesis.
      - - Anti-thesis
        - An independent profile characterizes regional logistics as a brutal price war with painfully thin margins.
        - Sustained parcel-yield and segment-margin improvement would reduce this risk.
      - - Anti-thesis
        - >-
          Year-end 2025 cash and cash equivalents were below reported borrowings before considering leases and other
          liabilities.
        - A current net-debt bridge and lower leverage would improve downside protection.
    notes: >-
      US-dollar values preserve the reported periods and definitions; adjusted net profit is non-IFRS, and free cash
      flow is company-defined as operating cash flow less capex.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Operating assumptions
      - Valuation / return range
      - Probability signal
      - Trigger
    rows:
      - - Bull
        - Growth persists, IFRS profit expands, cash conversion remains positive, and pricing discipline holds.
        - Above the HKD83.0B transaction-implied equity anchor; no evidence-backed ceiling.
        - Multiple reporting periods confirm margin and cash-flow durability.
        - Positive segment yield and free cash flow despite volume growth.
      - - Base
        - Growth and profitability remain positive, but thin-margin competition and capital needs persist.
        - Near the HKD83.0B transaction-implied anchor; return is not calculable without a live entry price.
        - Current momentum continues without independent evidence of multiple expansion.
        - Live enterprise-value bridge supports the transaction anchor.
      - - Bear
        - Pricing pressure compresses margins, cash conversion reverses, or issuance and leverage rise.
        - Below the HKD83.0B transaction-implied anchor; downside floor is unsupported.
        - Two weaker reporting periods or adverse dilution evidence.
        - Loss of IFRS profitability or sustained negative free cash flow.
    notes: >-
      Ranges are directional relative to the SF issuance anchor, not price targets; HKD83.0B is derived from 822M shares
      representing 10% of the enlarged base at HKD10.10 per share.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV014
      - CV015
      - CV016
