  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 运营证据增强了论点，但定价、资本、治理和估值缺口让结论停留在继续研究。
    data:
      nodes:
        - id: public-scale
          label: 公开规模
          detail: 在港交所上市、拥有覆盖 13 个国家网络的运营商
        - id: operating-proof
          label: 运营证据
          detail: FY2025 IFRS 利润和 2026 上半年收入增长
        - id: cash-proof
          label: 现金证据
          detail: FY2025 自由现金流和 2026 上半年经营现金流
        - id: transaction-anchor
          label: 战略锚点
          detail: HKD10.10 的 SF 发行；发行后隐含股权价值 HKD83.0B
        - id: risk-filter
          label: 风险筛选
          detail: 低利润率竞争、资本密集度、稀释和治理
        - id: recommendation
          label: 继续研究
          detail: 入场前取得实时估值和独立可比倍数
      edges:
        - from: public-scale
          to: operating-proof
        - from: operating-proof
          to: cash-proof
        - from: cash-proof
          to: transaction-anchor
        - from: transaction-anchor
          to: risk-filter
        - from: risk-filter
          to: recommendation
    approximationNotes: HKD83.0B 是机械性的发行价锚点，不是预测或当前市值。
