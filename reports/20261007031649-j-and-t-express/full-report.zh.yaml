      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              J&T Express 已从高额烧钱转向自我维持的经营现金流，融资依赖显著下降。FY2025 经营活动产生的净现金达到 US$1.09 billion，高于 FY2024 的 US$807 million；扣除
              US$594 million 资本开支后，自由现金流为 US$494 million。经营现金流动能延续至 1H 2026，达到 US$640 million，同比增长 50.9%。截至 2026 年 6 月
              30 日，现金及现金等价物、受限现金和银行理财产品合计 US$2.91 billion， FY2025 年末为 US$2.20 billion。债务也在主动重组：截至 2025 年 12 月 31 日，总借款
              US$2.41 billion，其中包括用于替换 2028 年 10 月到期 US$1.25 billion 高息债务的 RMB 10 billion 银团贷款。机构关系同样值得注意：竞争对手 SF
              Express（S.F. Holding） 截至 2025 年 6 月 30 日持有 J&T Express 股权，账面价值 RMB 1.01 billion（折合 US$140 million），源自此前的
              Fengwang Express 交易。资本充足性足以支持近期网络扩张，但 US$154 million 资本开支承诺和持续的自动化分拣投资需要审慎评估。
