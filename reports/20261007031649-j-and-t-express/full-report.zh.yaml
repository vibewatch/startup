        - label: GOFO
          x: 3
          'y': 2
          detail: 已报告的美国日均包裹规模可观，但未披露平台所有权。
        - label: UniUni
          x: 3
          'y': 2
          detail: 已报告的美国日均包裹规模可观，但未披露平台所有权。
    approximationNotes: 1-5 序数评分是分析师对已报告市场份额、日均货量和平台所有权的转译：x 代表所引区域集合内的相对披露规模，y 代表对源头电商订单流的控制力。评分不可作为东南亚与美国之间可比的市场份额。
