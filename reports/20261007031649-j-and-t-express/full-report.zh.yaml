          tone: neutral
        - label: 下单与寄件
          detail: 包裹在本地投递点或服务网点发出，或通过上门取件收取
          tone: neutral
        - label: 自动分拣
          detail: 包裹经过区域网关和分拨中心的自动化线路
          tone: opportunity
        - label: 干线运输
          detail: 通过由自有卡车和合作承运商组成的干线车队进行路线运输
          tone: neutral
        - label: 末端配送
          detail: 快递员交接，尝试送货上门，提供移动追踪和送达确认
          tone: positive
        - label: 扩张循环
          detail: 大货量商户采用 Tuyouda、仓储等增值服务
          tone: positive
    approximationNotes: 展示东南亚及跨境电商商户通道中的一般运营履约流程。
