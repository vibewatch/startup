      - number: '6.2'
        title: 货量采用轨迹与全球网络规模
        blocks:
          - type: paragraph
            body: >-
              J&T Express 的客户采用在 2026 年第二季度达到历史运营里程碑：日均包裹量超过 101 million 件，季度总量达到 9.177 billion 件，同比增长 24.2%。2026
              年上半年全球累计货量扩大至 17.503 billion 件，主要由非中国市场的强劲增长推动。东南亚仍是主要增长引擎，1H 2026 处理 5.523 billion 件，同比增长 71.2%；Q1 2026
              已增长 79.9%，受社交电商活跃度上升和斋月购物节等大型促销活动推动。在快递业转向高质量运营整合的中国，J&T 1H 2026 处理 11.615 billion 件，同比增长 9.6%，据 Frost &
              Sullivan 份额为 11.6%。与此同时，New Markets 1H 2026 货量同比增长 119.9% 至 365 million
              件，反映巴西、墨西哥、沙特阿拉伯、阿联酋和埃及的商户及消费者入网加速。
