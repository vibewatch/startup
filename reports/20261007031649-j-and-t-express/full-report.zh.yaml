      - number: '5.3'
        title: 数字平台架构与电信基础设施
        blocks:
          - type: paragraph
            body: >-
              J&T Express 的技术栈采用四层架构，包括数字基础设施、自研平台层、运营应用系统和一线运营工具。底层基础设施把自建计算资源与 第三方云服务结合。其上，J&T Express
              维护自动地址解析平台、大数据管理平台、预警决策系统和专用 AI 模型平台等核心引擎。 在运营网络层，菲律宾等岛屿地区的网点连接过去曾因台风导致光纤严重中断，因此 J&T Express 部署 Huawei
              AR611W-LTE6EA 超融合 SD-WAN 网关，支持自动 LTE 蜂窝故障切换，使网点电信运营费用下降 30%，故障切换恢复延迟从 120 分钟降至 3 分钟以内。为统一
              企业资源规划、财务合并和供应链控制，公司在各运营地区部署 Yonyou 全球平台，将 85% 的会计流程自动化。
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: 系统整合瓶颈、质量控制与运营风险
        blocks:
          - type: paragraph
            body: >-
              在不同监管和运营制度下快速扩张至多个国家，带来了明显的技术与运营脆弱性。关键瓶颈是区域实体的旧系统碎片化：J&T Express 过去在 25 个以上行政区域中使用彼此割裂的五套核心内部系统——JMS、Zhitu
              i+、WeCom、Lark 和 OA——造成跨部门协调长期延迟，不得不接入 Udesk 的第三方客服系统。面向客户的支持也存在执行缺口；ComplaintsBoard 等公开消费者投诉库记录了超过 1,932
              起投诉，正式解决率 为 0%，原因包括未通知的改期配送和丢件升级。合规与网络安全上，J&T Express 在中国持有 ISO27001、ISO27701 和国家信息安全 保护等级三级认证，并于 2024 年把
              ISO27001 扩展至印度尼西亚、马来西亚、菲律宾、泰国和越南，以降低跨境数据保护责任。
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: 图表
        blocks:
          - type: callout
            title: 中国运营经验在新兴市场复制
            body: >-
              J&T Express 在东南亚和拉丁美洲快速获取份额，一个核心技术驱动是系统复制中国的自动化物流打法。公司在越南、菲律宾和巴西等地区
              部署大容量交叉带自动分拣设备、自有地址解析引擎和算法化车辆装载优化，取得小型区域承运商难以匹敌的规模经济。
            calloutType: insight
            claimRefs:
              - CE002
              - CE007
              - CE011
          - type: callout
            title: 客户解决能力缺口与加盟服务不一致
            body: >-
              尽管分拣和网络基础设施高度自动化，J&T Express 在末端包裹配送上仍面临严重客户不满。第三方投诉追踪平台数据显示，未通知的配送 延迟、快递员状态篡改等问题长期存在；1,932 起追踪案例的有效投诉解决率为
              0%，暴露出加盟商监督和客户支持执行的结构性缺口。
            calloutType: risk
            claimRefs:
              - CE014
              - CE015
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与多层服务架构
        blocks:
          - type: paragraph
            body: >-
              J&T Express 将商业客户分为三个主要地域部门：中国、东南亚和 New Markets（拉丁美洲及中东），各自拥有不同的客户画像、买方动机和 货量特征。在东南亚和中国，核心付费客户是
              Shopee、TikTok Shop、淘宝 / 天猫、拼多多等电商平台及其注册商户；他们需要低成本、 高可靠的包裹分拣和门到门配送。在 New Markets，SHEIN、Temu、AliExpress
              等跨境平台与 Mercado Libre 等本地平台合作，获得本地 末端履约。为适应不同配送时效和价格敏感度，J&T 运营差异化服务层级，例如印度尼西亚的标准 EZ 配送（1–3 天）、跨岛运输的经济型 J&T
              Eco（5–14 天），以及大都市的高端当日 J&T Super。同时，公司正积极拓展平台之外的商业客户，包括直接企业合同、社交电商商户、 品牌连锁和零售个人寄件人，并由超过 19,800
              个服务网点和专业产业带集货中心支持。
