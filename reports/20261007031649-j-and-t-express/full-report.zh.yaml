  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 服务组合与区域产品线
        blocks:
          - type: paragraph
            body: >-
              J&T Express 以标准化快递配送、城内分拨和面向高频电商商户的跨境物流为核心运营。集团 2015 年在印度尼西亚成立，随后快速把产品 扩展至东南亚、中国、拉丁美洲和中东，形成 13 个运营国家网络。主要
              SKU 是为 Shopee、TikTok Shop 和 Mercado Libre 等电商平台 提供的标准包裹处理，并辅以中国大陆农产品绿色通道、偏远地区包裹集散等专业履约能力。在成熟市场，J&T Express
              已发展云仓服务， 覆盖 152 个仓库、49 万平方米，让线上卖家可直接在物流中转走廊内共置库存。不过，服务层级仍高度依赖标准电商配送，专业冷链和 高端企业快递能力相对不足。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE008
      - number: '5.2'
        title: 运营模式与分拣基础设施
        blocks:
          - type: paragraph
            body: >-
              集团运营模式把集中式分拣中心、混合干线运输车队和加盟网络合作网点结合起来。截至 2026 年中，J&T Express 在全球运营 260 个分拣 中心和约 19,800 个快递网点，由超过 6,400
              个网络合作加盟商负责本地末端运营。干线运输依靠全球超过 12,700 辆在役车辆，其中 7,200 多辆为自有卡车，其余由第三方物流承运商提供。J&T Express
              在中国和东南亚逐步部署大容量交叉带自动分拣系统，全球自动分拣机 2025 年末达到 397 台，年末达到 413 台。扬州分拣中心和广州分拣中心等重大资本项目，旨在大型购物活动前扩大自动化中心吞吐量。
              为降低末端揽收配送对人工的依赖，公司已在中国部分城市区域部署约 600 辆无人配送车。
            claimRefs:
