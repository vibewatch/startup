  - id: TV002
    title: 正向论点 / 反向论点表
    columns:
      - 视角
      - 证据支持的论点
      - 哪些变化会改变判断
    rows:
      - - 正向论点
        - FY2025 收入达到 US$12.158B，IFRS 利润达到 US$225.3M。
        - 若重述或逆转 IFRS 盈利，正向论点会被削弱。
      - - 正向论点
        - 2026 上半年收入同比增长 39.5%，达到 US$7.67B。
        - 若增速明显放缓而利润率没有改善，增长溢价会收窄。
      - - 正向论点
        - 2026 上半年调整后净利润同比增长 124.3%，达到 US$350.6M。
        - 每个期间都要将调整后盈利与 IFRS 利润及现金转化核对。
      - - 正向论点
        - FY2025 公司定义的自由现金流为 US$494M，2026 上半年经营现金流为 US$635.5M。
        - 若连续两个报告期自由现金流为负或现金转化变弱，现金论点就会失效。
      - - 反向论点
        - 一份独立资料将区域物流描述为残酷的价格战，利润率低得令人难受。
        - 若包裹单价和分部利润率持续改善，这一风险会下降。
      - - 反向论点
        - 2025 年末现金及现金等价物低于已报告借款，且尚未计入租赁及其他负债。
        - 当前净债务桥接和更低杠杆会改善下行保护。
    notes: 美元数值保留报告期和定义；调整后净利润为非 IFRS 指标，自由现金流由公司定义为经营现金流减资本开支。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV010
      - CV014
