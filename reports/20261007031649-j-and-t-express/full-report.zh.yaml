            title: 社交电商飞轮推动东南亚货量密度
            body: >-
              J&T Express 在东南亚快速扩张，说明快递吞吐量与社交电商采用高度相关。J&T 早期接入 TikTok Shop 和直播电商，而不是只依赖传统
              搜索型市场集成，由此形成高频包裹密度，降低单位干线和分拣成本，巩固区域第一的市场地位。
