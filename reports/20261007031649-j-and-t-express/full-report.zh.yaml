          - type: callout
            title: 平台分配权与实际收益率不确定性
            body: >-
              J&T Express 全球日均包裹量已超过 1 亿件，但对少数超级平台——尤其是 ByteDance/TikTok、拼多多/Temu 和区域龙头——的依赖，使其
              容易受到平台政策变化、自有承运商替代和激进议价影响。由于各平台详细收入占比仍未披露，客户集中构成未对冲的运营风险。
            calloutType: risk
            claimRefs:
              - CU001
              - CU007
              - CU013
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 国家邮政局审查与跨境合规风险
        blocks:
          - type: paragraph
            body: >-
              监管和行政执法是 J&T Express 面临的重大运营及舆情风险。2026 年 6 月，中国国家邮政局在多家使用 J&T 品牌、商号和面单的运营企业 发生致命生产安全事故后，正式对 J&T Express Co
              立案调查。市场立即反应，香港证券交易所盘中股价最多下跌 11.5% 至 HK$7.85。
              与过去的低级别警告和地方小额罚款不同，监管机构把目标指向总部管理失误，指称统一安全制度存在系统性缺失、品牌授权实体监督不足。
              公司承认缺陷并成立专项整改工作组，但仍面临正式运营整改令或重大行政罚款。除中国外，J&T 还在 13 个不同法律辖区运营，必须严格
              遵守当地公司注册、海关清关和运输许可制度，例如中国快递业务经营许可证及泰国运输管理许可框架。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 分拣自动化、劳动力动态与质量控制的运营脆弱性
        blocks:
          - type: paragraph
            body: >-
              J&T Express 以极大物理规模运营，FY2025 通过全球 246 个分拣中心和约 19,800 个网点处理 301 亿件包裹。在分散网络中维持服务 可靠性和劳动安全，持续带来执行摩擦。快速扩容，包括
              2026 年第二季度日峰值超过 1 亿件，使中心设施和干线路线承受巨大压力。 集团在中国运营超过 7,200 辆干线车，截至 2025 年末把自动分拣设备扩至 413
              台，但网络合作网点和配送承包商的执行标准不一。 消费者投诉汇总显示末端包裹处理和投诉解决存在摩擦，问题包括虚假配送状态、客服不响应和骑手争议。中国监管机构发现的运营安全事故
              表明，如果快速扩量却没有集中执行安全制度，会带来重大的品牌损害和法律责任风险。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR009
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR011
              - CR013
              - CR014
              - CR015
      - number: '7.3'
        title: 平台集中与区域赞助商治理脆弱性
        blocks:
          - type: paragraph
            body: >-
              集团商业模式高度依赖主要电商市场交易对手和未并表的区域运营赞助商。历史上，东南亚电商平台贡献超过 90% 的配送包裹量，其中 Sea Group 的 Shopee
              是关键锚点。平台伙伴改变物流分配会造成严重的局部中断。2026 年初，菲律宾商户和消费者称 Shopee 发布履约 通知，于 2026 年 2 月停止将 J&T Express
              作为集成物流伙伴，造成商业扰动，也凸显其可能被 SPX Express 等自有网络内包替代。 此外，J&T 的区域赞助商结构把本地揽收配送网络管理交给第三方企业家和区域实体。虽然这在中东和拉丁美洲 New
              Markets 快速国际扩张 中节省资本，但各区域赞助商在运营纪律、资金实力和监管合规上差异很大；一旦本地伙伴失误，就会产生波及全品牌的风险。
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.4'
        title: 图表
        blocks:
          - type: callout
            title: 监管打击从地方罚款升级至总部问责
            body: >-
              2026 年 6 月国家邮政局调查标志着中国对 J&T Express 监管态度的转折。监管机构追究品牌实体运营事故的总部责任，挑战了区域赞助商
              和加盟模式此前提供的结构性缓冲。投资者必须把它视为投资逻辑层面的运营风险，因为它可能带来直接财务处罚和运营限制。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，信心中等、风险高，估值立场不确定。J&T 已是上市跨国运营商，而非私营初创公司：公司材料显示股票代码为 1519.HK， 拥有 13
              国网络。运营业绩在改善，但公司质量和证券投资吸引力是两个问题。现有证据没有实时股价、当前摊薄市值、企业价值或独立 可比公司倍数集合，因此无法建立有证据支持的入场价、目标回报或持有期回报。HKD10.10 的 SF
              发行价可作为战略交易锚点，但不能 单独视为公允价值意见。建立新仓位前，应等待下文所列的实时估值桥接和可比公司分析。
            claimRefs:
              - CV001
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 运营验证与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              投资逻辑有可量化支持。FY2025 收入为 US$12.158 billion，IFRS 年利润为 US$225.3 million，公司定义的自由现金流为 US$494 million。 动能延续至
              1H2026：收入达到 US$7.67 billion，调整后净利润 US$350.6 million，经营现金流 US$635.5 million。这些期间和定义必须 分开：调整后净利润是非 IFRS
              指标，不是现金流。反向逻辑同样重要。一份保留的独立公司画像描述了残酷的区域价格竞争和极薄利润， 而截至 2025 年末运营足迹包括 14 个自建核心物流园、覆盖 105
              万平方米。规模可以改善单位经济性，但也让资本纪律和定价韧性成为 价值判断的核心。
            claimRefs:
              - CV002
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV014
      - number: '8.3'
        title: 融资、稀释与治理
        blocks:
          - type: paragraph
            body: >-
              2026 年 1 月 SF Holding 协议是目前保留的最强估值参考：J&T 同意按每股 HKD10.10 发行 822 million 股 B 类股，交易完成后 SF 将持有 J&T 扩大后股本的
              10%。按这些条款机械推算，发行后总股数约为 8.22 billion 股，按发行价计算的股权价值锚点为 HKD83.0
              billion；但该计算既不是当前市值，也不是公允价值目标。相同披露还显示出显著稀释和战略集中风险，尽管 J&T 在 1H2026 的回购以另一种规模部分抵消了发行。治理仍是尽调事项，因为创始人 Jet Jie
              Li 同时担任董事长和首席执行官。在判断入场价格前，必须核对交易完成状态、当前完全稀释后股数，以及仍存在的类似优先权或公允价值负债。
            claimRefs:
              - CV003
              - CV011
              - CV012
              - CV013
              - CV015
      - number: '8.4'
        title: 情景、退出准备度与论点失效点
        blocks:
          - type: paragraph
            body: >-
              由于缺少估值分母，情景判断只能给出方向。乐观情景要求收入持续增长、IFRS
              盈利提升、自由现金流为正，并证明包裹量扩张后仍能守住定价纪律；这可以支持高于战略交易锚点的估值，但现有证据不足以给出上限。基准情景将估值维持在锚点附近，同时要求在行动前拿到实时企业价值桥接。若价格竞争压低利润率、现金创造反转或资本需求上升，悲观情景下的价值将低于锚点。公开上市提供退出路径，纳入恒生指数也是改善市场可进入性的信号，但二者都不能证明入场价格有吸引力。论点失效点包括连续两个报告期现金转化走弱、失去
              IFRS 盈利能力，或证据显示发行与杠杆的压力超过回购的抵消作用。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
