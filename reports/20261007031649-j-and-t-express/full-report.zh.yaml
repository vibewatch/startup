              J&T Express 的地域多元化构成关键的结构性对冲。中国贡献 55% 收入，但激烈竞争把其每件调整后 EBIT 压到 US$0.004。相比之下， 东南亚每件调整后 EBIT 为 US$0.07，毛利率
