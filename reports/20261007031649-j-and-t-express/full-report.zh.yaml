      - number: '4.2'
        title: 单位经济性与成本结构
        blocks:
          - type: paragraph
            body: >-
              集团成本结构的特点是揽收配送、干线运输和自动化分拣中心运营均有较高的变动运营支出。FY2025 集团收入成本为 US$10.70 billion， 合并毛利润为 US$1.46 billion，毛利率
              12.0%。分部单位经济性呈现明显地域差异：东南亚每件平均售价 US$0.59、COGS US$0.48， FY2025 每件调整后 EBIT 为 US$0.07；中国每件 ASP US$0.30、COGS
              US$0.28，调整后 EBIT US$0.004。New Markets FY2025 每件 ASP US$2.15、COGS US$2.14，全年每件调整后 EBIT 转正至 US$0.01，2H 2025
              为 US$0.09。到 1H 2026，集团每件调整后 EBIT 同比增长 77% 至 US$0.025，依靠中心自动化和网络密度支撑。不过，关于包裹处理和服务执行的消费者投诉显示高峰期运营承压。
