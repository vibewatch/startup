  - id: FE001
    title: J&T Express 四层数字智能与运营技术栈
    type: stack
    summary: 结构架构图展示 J&T Express 的数字基础设施、平台算法、应用套件和运营执行渠道。
    data:
      layers:
        - label: 一线运营与履约层
          description: 覆盖 260 个分拨中心、约 19,800 个网点和约 600 辆无人配送车的执行触点
          modules:
            - 核心中转枢纽的自动交叉带分拣机
            - 加盟网络合作伙伴网点的销售点系统
            - 自主无人末端电动配送车
          note: Frontline logistics infrastructure spanning 13 national operational networks
        - label: 应用与企业管理层
          description: 运营管理工具、路线调度仪表盘和企业系统
          modules:
            - J&T 数字智能调度与车辆装载规划套件
            - Yonyou 全球财务与供应链管理平台
            - Udesk 全渠道客户咨询与自动工单平台
          note: Centralized operational oversight coordinating cross-border logistics workflows
        - label: 平台与算法智能层
          description: 用于地理空间地址匹配、货量预测和路径规划的专有算法
          modules:
            - 动态地图 AOI 与自动地址解析引擎
            - 货量预测与智能运力调度平台
            - 预警、决策和干线优化算法
          note: Algorithmic decision core driving operational cost efficiencies
        - label: 网络通信层
          description: 高可用企业网络与自动灾备链路
          modules:
            - Huawei 超融合 AR611W-LTE6EA SD-WAN 分支网关
            - 自动化的 3 秒以内 LTE 无线蜂窝备份连接
            - 实时链路质量遥测与可视化网络数字地图
          note: Critical branch telecommunications infrastructure for disaster resilience
        - label: 云与计算基础设施层
          description: 承载核心物流数据库和服务的混合计算环境
          modules:
            - 自建私有算力云集群
            - 第三方商业云平台托管服务
            - 分布式多区域容器化应用环境
          note: Scalable compute foundation supporting global operations across 13 countries
        - label: 信息安全与数据防御层
          description: 多司法辖区合规与信息安全控制
          modules:
            - 覆盖东南亚和中国的 ISO27001 认证安全防御
            - ISO27701 隐私信息管理框架
            - 中国国家信息安全等级保护三级控制
          note: Standardized cybersecurity and data privacy baseline across operating regions
    approximationNotes: 层级分类和功能模块分配直接综合自 J&T Express 企业演示材料及合作伙伴实施披露。
    claimRefs:
      - CE005
      - CE008
      - CE010
      - CE011
      - CE012
      - CE016
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从商户接入到末端配送和留存循环的端到端客户采用与包裹履约旅程。
    data:
      items:
        - label: 平台接入
