  - id: FP001
    title: 东南亚与美国挑战者定位
    type: quadrant
    summary: 基于证据的序数视角，对比已报告配送规模与对源头订单流的控制力；这不是市场份额估计。
    data:
      points:
        - label: J&T Express
          x: 5
          'y': 3
          detail: 在该组中披露的东南亚规模最高，但据报告存在重大的平台依赖。
        - label: SPX
          x: 4
          'y': 5
          detail: 已报告的东南亚份额较大，并直接控制 Shopee 生态。
        - label: LGS
          x: 2
          'y': 5
          detail: 已报告的东南亚份额较小，但直接控制 Lazada 生态。
        - label: Flash
          x: 2
          'y': 2
