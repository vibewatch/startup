            body: >-
              商户旅程从电商平台 API 集成和电子面单生成开始，经过本地网点投递或快递员揽收、干线运输、区域自动分拣，最终送到客户家门口。 云仓、优先客服渠道和 Tuyouda
              高端配送框架等增值能力帮助留住大货量企业客户。但末端执行摩擦会损害客户体验。消费者评价和 争议记录反复提到配送失败、提前标记配送状态和客服升级延迟。更重要的是，J&T 面临结构性客户集中风险：公开文件没有披露
              ByteDance 或 PDD Holdings 等头部平台客户贡献的确切收入或包裹量比例，投资者因此无法对平台议价能力、商户运费追扣和自有物流替代威胁进行对冲。
