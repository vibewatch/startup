    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 估值 / 回报区间
      - 概率信号
      - 触发条件
    rows:
      - - 乐观
        - 增长延续、IFRS 利润扩大、现金转化保持为正，定价纪律得到维持。
        - 高于交易隐含的 HKD83.0B 股权锚点；没有证据支持的上限。
        - 多个报告期确认利润率和现金流的持续性。
        - 即使货量增长，分部单价和自由现金流仍为正。
      - - 基准
        - 增长和盈利保持为正，但低利润率竞争和资本需求持续。
        - 接近交易隐含的 HKD83.0B 锚点；没有实时入场价格，回报无法计算。
        - 当前势头延续，但没有独立证据证明倍数扩张。
        - 实时企业价值桥接支持该交易锚点。
      - - 悲观
        - 定价压力压缩利润率、现金转化逆转，或发行和杠杆上升。
        - 低于交易隐含的 HKD83.0B 锚点；下行底部没有证据支持。
        - 两个较弱报告期，或出现不利稀释证据。
        - IFRS 盈利消失，或自由现金流持续为负。
    notes: 区间相对于 SF 发行锚点仅指示方向，不是价格目标；HKD83.0B 由 822M 股推导而来，这些股份按每股 HKD10.10 代表扩大后股本的 10%。
