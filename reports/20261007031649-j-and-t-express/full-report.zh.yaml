chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、上市与网络覆盖
        blocks:
          - type: paragraph
            body: >-
              J&T Express 是一家全球快递物流运营商，2015 年 8 月成立，业务根基在印度尼西亚。公司随后快速扩张至东南亚和中国大陆， 运营母公司 J&T Global Express Limited 于
              2023 年 10 月在香港证券交易所主板上市，股票代码为 01519。公司核心业务包括 快递配送、跨境履约和供应链物流服务。J&T Express 已搭建覆盖全球 13
              个国家的综合包裹配送网络，包括东南亚核心市场 （印度尼西亚、越南、马来西亚、菲律宾、泰国、柬埔寨、新加坡）、中国大陆、中东扩张市场（沙特阿拉伯、阿联酋、埃及）
              以及拉丁美洲市场（墨西哥、巴西）。这种多元化地域布局帮助 J&T Express 承接全球及区域商户平台不断增长的跨境和国内电商货量。
            claimRefs:
              - CO001
              - CO002
              - CO003
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
              - CO010
              - CO015
      - number: '1.2'
        title: 高管团队与公司治理
        blocks:
          - type: paragraph
            body: >-
              J&T Express 的公司领导和全球执行由一支资深管理团队负责，成员在新兴市场物流和技术分销领域拥有深厚运营经验。Dylan Tey
              任首席财务官，负责集团财务报告、资本开支分配、自由现金流管理及在香港证券交易所的公开市场沟通。Charles Hou 任集团副总裁， 负责东南亚、中国和 New Markets
              的国际网络扩张、分拣基础设施投资及商业合作。公司治理由集团总部统筹，各目标地区的区域 子公司负责本地运营执行。在中国大陆，集团建立了覆盖超过 29 万名自营及加盟员工的正式劳资协商框架，处理算法透明度和配送员
              薪酬问题。不过，公司仍高度依赖与创始人关系密切的领导层，以及推动早期区域建设的执行委员会成员。
            claimRefs:
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
      - number: '1.3'
        title: 资本结构、商业合作与网络动态
        blocks:
          - type: paragraph
            body: >-
              J&T Express 运营开放平台配送生态，把重资产基础设施投资与各大数字商业平台的战略商业关系结合起来。J&T Express 不依赖
              自有母平台市场，而是定位为服务多平台货量的独立物流基础设施提供商。在东南亚，公司服务 TikTok Shop、Shopee、Lazada 和 SHEIN 等领先数字市场，2025 年区域份额扩大至
              34.4%。在拉丁美洲，J&T Express 于 2025 年与区域电商龙头 Mercado Libre 建立商业配送合作，使 New Markets
              部门得以快速提高本地包裹密度。公司采用混合网络模式，将自营分拣中心和干线车队与 本地加盟网点及网络合作伙伴结合。资本配置优先投向中心自动化、车队更新和自建区域物流园，以降低单位处理成本。
            claimRefs:
              - CO008
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO012
              - CO013
      - number: '1.4'
        title: 运营规模、财务反转与质量挑战
        blocks:
          - type: paragraph
            body: >-
              2025 财年是 J&T Express 运营和财务的转折点。合并年包裹量首次超过 300 亿件，达到 301 亿件（同比增长 22.2%），收入达到 US$12.2 billion（同比增长
              18.5%）。调整后净利润增长 112.3% 至 US$425 million，经营现金流为 US$1.09 billion，自由现金流为 US$494
              million。地域多元化战略开始显著见效：非中国市场收入占合并收入的 44%，高于 2024 年的 37%。尤其是 New Markets 部门（中东和拉丁美洲）首次实现全年调整后 EBIT 盈利，为 US$4
              million，在运营三年内转正。2026 年第一季度数据确认运营 动能延续，全球包裹量达到 8.326 billion 件。不过，快速放量给末端配送质量带来压力，消费者评价平台持续记录配送失败、包裹错置
              和客服响应不佳等投诉。
            claimRefs:
              - CO006
              - CO007
              - CO009
              - CO010
              - CO011
              - CO014
              - CO015
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO001
              - CO002
              - CO006
              - CO007
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
      - number: '1.5'
        title: 图表
        blocks:
          - type: callout
            title: 地域脱钩与新兴市场盈利能力
            body: >-
              J&T Express 已显著降低对中国快递业务的依赖，2025 年非中国收入升至合并收入的 44%。关键在于，拉丁美洲和中东的 New Markets 部门在启动三年内转为调整后 EBIT 盈利 US$4
              million，说明跨境配送飞轮可以在东南亚之外复制。
            calloutType: insight
            claimRefs:
              - CO006
              - CO009
              - CO012
          - type: callout
            title: 客服升级与配送摩擦
            body: >-
              尽管货量快速增长、网络自动化程度提高，第三方投诉数据仍显示消费者对末端包裹交接明显不满。ComplaintsBoard 的独立追踪显示， 1,932 份客户提交中未解决投诉率为
              100%，暴露出长期存在的配送后解决缺口，威胁品牌长期价值。
            calloutType: risk
            claimRefs:
              - CO014
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、品类范围与相邻领域
        blocks:
          - type: paragraph
            body: >-
              J&T Express 的核心可服务市场包括快递、速递和包裹（CEP）物流服务，重点覆盖东南亚、中国大陆、拉丁美洲和中东的高频 B2C、 C2C 电商包裹履约 [CM001]。快递配送通常按 12 至 48
              小时的合同运输时限运营，由自动化分拣中心、区域干线和密集的末端 配送网络支撑 [CM002]。纳入的物流支出包括门到门快递、区域干线运输、分拣处理费、限时优先服务和货到付款（COD）结算管理 [CM001,
              CM006]。排除的市场支出包括散装非集装箱海运、重型工业合同物流、普通邮政信件运输，以及与数字商业流程无关的传统 企业包裹快递合同 [CM001,
              CM002]。云端整合履约仓储、跨境海关保税清关区和城市微型履约暗仓等相邻领域正越来越多地与快递 运营交叉，而大型平台的内部物流部门是主要的现状替代方案 [CM004, CM006]。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM006
      - number: '2.2'
        title: 市场规模测算视角：TAM、SAM 与 SOM 拆解
        blocks:
          - type: paragraph
            body: >-
              测算快递物流市场，需要同时观察全球、区域和公司履约边界。全球层面，Market Research Future 估计快递服务 TAM 在 2025 年达到 $77.41 billion，预计到 2035 年以
              2.59% 的复合年增长率扩大至 $99.97 billion [CM003]。更宽口径的国内快递、速递和包裹研究 估计 2024 年市场为 $368.3
              billion，说明不同品类边界会产生明显不同、且不能直接与纯快递估算比较的总额 [CM013]。区域 SAM 层面，东南亚电商零售交易额在 2025 年达到 $162 billion，快递包裹量为 22
              billion 件；Frost & Sullivan 预计 2026 年达到 29 billion 件、2030 年达到 54 billion 件 [CM004]。在具体国家，Mordor
              Intelligence 估计泰国 CEP 市场 2026 年单独达到 $3.03 billion，并以 7.11% CAGR 增长至 2031 年的 $4.27 billion [CM005]。J&T
              Express 的 SOM 在 FY2025 覆盖东南亚包裹量的 34.4%，并在 1H2026 于该地区处理 5.523 billion 件包裹；在中国和新兴市场的货量份额分别为 11.6% 和 8.9%
              [CM007, CM008, CM009]。跨境包裹流和直播冲动 消费仍在推动主要区域市场的吞吐量增长 [CM005, CM006]。
            claimRefs:
              - CM003
              - CM013
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM007
              - CM008
              - CM009
      - number: '2.3'
        title: 买方分层、工作流整合与预算归属
        blocks:
          - type: paragraph
            body: >-
              快递履约需求主要来自三类客户：国内外电商市场、社交电商和直播商户，以及 DTC 品牌企业 [CM001, CM006, CM007]。Shopee、 Lazada、TikTok
              Shop、TEMU、SHEIN、AliExpress 和 Mercado Libre 等跨国电商平台与快递商签订主服务协议，由平台物流负责人和 商户运营团队根据 SLA 达成率、基础资费及自动化 API
              集成稳定性分配供应商 [CM001, CM007, CM010]。独立数字商户和社交电商卖家 重视营运资金周转速度与货到付款流动性，会选择提供 24 小时 COD 结算等加速付款周期的承运商 [CM006,
              CM008]。非平台企业客户 和零售连锁品牌则评估门到门可靠性、定制包装完整性、优先服务渠道及专属客户支持 [CM008, CM011]。
            claimRefs:
              - CM001
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM006
              - CM008
              - CM010
      - number: '2.4'
        title: 结构性增长驱动与运营采用约束
        blocks:
          - type: paragraph
            body: >-
              市场增长由数字商业长期扩张、新兴经济体人均包裹量上升，以及把购物篮拆成单件配送的社交电商直播形式爆发共同推动 [CM004,
              CM006]。因此，行业部署自动分拣技术和自动驾驶干线车辆，缩短分拣停留时间并应对高峰需求激增 [CM006, CM008, CM011]。
              但运营采用也受到结构性约束。反复的包邮价格竞争压缩利润，限制区域承运商盈利；密集的城市巷道和非标准地址又要求高人工配送 [CM005, CM006,
              CM011]。此外，配送未完成和投诉处理低效导致的持续不满会侵蚀品牌信任，暴露快速增长的履约网络仍有服务瓶颈 [CM012]。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM011
              - CM012
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 金融科技加速结算，推动电商商户采用
            body: >-
              在东南亚新兴电商走廊，物流采用既取决于运输速度，也取决于资金流动性。快递运营商与泰国 HSBC 等机构型金融科技服务商合作， 把货到付款结算周期从 7 天压缩到 24
              小时，直接缓解商户现金流压力，从依赖现金的零售细分市场锁定稳定货量 [CM006]。
            calloutType: insight
            claimRefs:
              - CM006
          - type: callout
            title: 客服摩擦造成的消费者信任缺口
            body: >-
              尽管货量快速增长、包裹吞吐量很高，独立客户评价平台仍报告消费者明显不满。ComplaintsBoard 数据显示，数千份消费者提交中存在
              关于包裹丢失、虚假配送状态和客服升级无效的未解决投诉积压，说明运营规模已经超过一线解决问题的能力 [CM012]。
            calloutType: risk
            claimRefs:
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与相对规模
        blocks:
          - type: paragraph
            body: >-
              竞争对手会随地域和买方真实替代方案而变化。在东南亚，J&T 的 FY2025 演示材料显示份额为 34.4%，领先第三方承运商和电商自有车队； 独立报道把 SPX、LGS 和 Flash
              列为最显眼的区域替代者。在中国，J&T 报告份额为 11.1%，位居前五，因此面对的是成熟的全国性 网络，而不只是风险投资支持的新进入者。若拓展美国，竞争结构会不同：据报道 USPS、FedEx 和 UPS
              控制超过 85% 的末端货量， GOFO 和 UniUni 也已积累可观的日均包裹规模。通用竞争对手目录把货运平台、供应链服务商和快递商混在一起，所以名单各不相同；
              它们只能用于发现线索，不能证明存在一套完整且唯一的可比公司集合。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP014
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP002
              - CP008
              - CP009
              - CP010
      - number: '3.2'
        title: 运营系统差异化与分销能力
        blocks:
          - type: paragraph
            body: >-
              J&T 可守住的优势，与其说是独特的配送产品，不如说是网络密度、本地运营伙伴、自动化和可移植技术层的组合。公司披露截至 2025 年 12 月拥有 246 个分拣中心、超过 13,300 辆干线车辆，覆盖 13
              个国家；其网站后来披露截至 2026 年 6 月拥有 260 个分拣中心、 约 19,800 个网点和约 6,400 个网络合作伙伴。区域赞助商模式把网点所有权和本地执行交给合作方，总部提供战略与技术。该结构能
              加快进入市场、降低资本强度，但也把服务执行分散到合作伙伴手中。平台自有车队的优势不同：它们控制订单流。因此，J&T 对 TikTok
              货量的披露依赖，使多平台经营和平台议价能力成为决定护城河耐久性的核心问题，而不只是客户集中度脚注。
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP007
              - CP010
              - CP011
              - CP015
      - number: '3.3'
        title: 定价压力与地域可移植性
        blocks:
          - type: paragraph
            body: >-
              最有力的公开定价证据是单位经济性，而非客户资费或合同条款。J&T 报告东南亚 FY2025 每件收入 US$0.71、调整后 EBIT US$0.07， 符合高货量、薄单位利润模式。中国每件收入
              US$0.30、调整后 EBIT US$0.004；New Markets FY2025 每件调整后 EBIT 为 US$0.01， 下半年为
              US$0.09。历史报道显示，中国此前激进定价曾导致每票毛亏损，因此规模本身不能保证经济性。美国的可移植性测试更严苛： 独立报道估计全国启动可能需要超过 US$100
              million，而现有巨头和低成本挑战者都能以价格回应。由于指定证据中没有公开竞争对手 资费、返利、服务水平罚金和实际合同价格，比较只能保持方向性。
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP013
              - CP016
      - number: '3.4'
        title: 护城河耐久性与反向证据
        blocks:
          - type: paragraph
            body: >-
              当网络密度、电商增长和赞助商网络彼此强化时，J&T 的护城河最强；当公司必须在高成本市场买份额，或大型平台把物流内置时，护城河
              最弱。东南亚配送时间和丢件率改善支持运营学习逻辑，但消费者证据喜忧参半。ComplaintsBoard 截至 2026 年 6 月 11 日统计了 1,932 起投诉，仅标记 4
              起已解决；这是一组自选投诉样本，不是总体失败率，但仍是有用的反向信号。历史中国满意度数据也把 J&T
              排在前五品牌之后。投资含义是条件性护城河：密度和执行力可以支撑低价，但平台依赖、合作伙伴一致性和现有巨头的回应可能侵蚀 优势。尽调应优先核查平台集中度、独立测量的服务质量和同口径实际定价。
            claimRefs:
              - CP004
              - CP007
              - CP011
              - CP012
              - CP013
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 规模不等于买方控制力
            body: J&T 的包裹密度可以降低单位成本，但掌握需求的平台能够转移货量或扩大自有车队。评估网络优势时，必须同时考虑平台集中度和多承运商行为。
            calloutType: risk
            claimRefs:
              - CP007
              - CP010
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与商业模式
        blocks:
          - type: paragraph
            body: >-
              J&T Express 主要是快递服务商，绝大部分收入来自东南亚、中国和 New Markets（包括沙特阿拉伯、阿联酋、墨西哥、巴西和埃及）的 国内快递包裹处理，另有跨境物流补充。FY2025 集团收入同比增长
              18.5% 至 US$12.16 billion，高于 FY2024 的 US$10.26 billion， 其中快递服务贡献核心业务收入 US$12.08 billion。1H 2026
              增长显著加速，集团收入达到 US$7.67 billion，同比增长 39.5%，快递服务 贡献 US$7.46 billion。东南亚仍是高毛利引擎，FY2025 收入 US$4.50 billion，毛利率
              19.1%，1H 2026 包裹量增长 71.2%。中国是 最大收入来源，FY2025 收入 US$6.71 billion，但受激烈国内资费竞争影响，毛利率仅 6.7%。新兴 New Markets 部门
              FY2025 收入 US$870 million，1H 2026 包裹量增长 119.9%，显示商业规模快速扩大。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
