      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 定价纪律优先于公司质量
            body: 盈利和现金创造改善值得继续尽调，但在没有实时市值分母和独立可比公司倍数前，不足以支持买入。
            calloutType: recommendation
