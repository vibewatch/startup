callouts:
  - calloutType: "insight"
    title: "Social Commerce Flywheel Drives Southeast Asian Volume Density"
    body: "J&T Express's rapid expansion across Southeast Asia demonstrates how deeply tied express parcel throughput is to social commerce adoption. Rather than relying solely on legacy search-based marketplace integrations, J&T's early integration with TikTok Shop and livestream commerce creates high-frequency parcel density that lowers unit line-haul and sorting costs, reinforcing its number-one regional market position."
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU008"
  - calloutType: "risk"
    title: "Platform Allocation Power and Realized Yield Uncertainty"
    body: "While J&T Express has scaled beyond 100 million daily parcels globally, its dependence on a handful of mega-platforms—notably ByteDance/TikTok, Pinduoduo/Temu, and regional leaders—leaves it vulnerable to platform policy shifts, in-house carrier substitution, and aggressive price negotiation. Because detailed revenue share per platform remains undisclosed, customer concentration represents an unhedged operational risk."
    claimRefs:
      - "CU001"
      - "CU007"
      - "CU013"
      - "CU015"
