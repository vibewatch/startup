  title: "Customers"
  summary: "J&T Express serves a bifurcated customer base spanning dominant e-commerce platforms, cross-border marketplaces, and millions of distributed merchants, scaling beyond 100 million daily parcels in 2026 through explosive Southeast Asian and New Markets adoption alongside steady China network throughput."
sections:
  - id: "customer-segmentation-and-service-architecture"
    title: "Customer Segmentation and Multi-Tier Service Architecture"
    body: >-
      J&T Express organizes its commercial customer base across three primary geographic divisions—China, Southeast Asia, and New Markets (encompassing Latin America and the Middle East)—each exhibiting distinct customer profiles, buyer motivations, and volume profiles. In Southeast Asia and China, the core paying customers are e-commerce platform marketplaces (such as Shopee, TikTok Shop, Taobao/Tmall, and Pinduoduo) and their registered merchants, who require low-cost, high-reliability parcel sorting and door-to-door delivery. In New Markets, cross-border platforms such as SHEIN, Temu, and AliExpress partner alongside domestic platforms like Mercado Libre to secure localized last-mile fulfillment. To address varying delivery urgency and price sensitivity, J&T operates differentiated service tiers, exemplified in Indonesia by standard EZ delivery (1–3 days), economical J&T Eco for inter-island transport (5–14 days), and premium same-day J&T Super in major metropolitan areas. In parallel, the company is actively expanding non-platform commercial segments—including direct enterprise contracts, social commerce merchants, brand chains, and retail individual senders—supported by over 19,800 service outlets and specialized industrial belt collection hubs.
    claimRefs:
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU001"
  - id: "volume-adoption-trajectory-and-geographic-scale"
    title: "Volume Adoption Trajectory and Global Network Scale"
    body: >-
      J&T Express's customer adoption trajectory reached a historic operational milestone in the second quarter of 2026, when average daily parcel volume surpassed 101 million parcels, bringing total quarterly volume to 9.177 billion parcels (up 24.2% year-on-year). For the first half of 2026, cumulative global volume expanded to 17.503 billion parcels, driven primarily by outsized growth in non-China markets. Southeast Asia maintained its position as a primary growth engine, delivering 5.523 billion parcels in 1H 2026 (a 71.2% year-on-year surge) after rising 79.9% in Q1 2026, propelled by elevated social commerce engagement and major promotional events such as the Ramadan shopping festival. In China, where the express delivery sector has transitioned toward high-quality operational consolidation, J&T handled 11.615 billion parcels in 1H 2026 (up 9.6% year-on-year), capturing an 11.6% volume market share according to Frost & Sullivan. Meanwhile, New Markets volume surged 119.9% year-on-year in 1H 2026 to 365 million parcels, reflecting accelerating merchant and consumer onboarding across Brazil, Mexico, Saudi Arabia, the UAE, and Egypt.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
    tableRefs:
      - "TU002"
  - id: "enterprise-customer-proof-and-platform-partnerships"
    title: "Enterprise Customer Proof and Cross-Border Platform Partnerships"
    body: >-
      Commercial proof of adoption for J&T Express centers on deep, production-grade API integrations and volume fulfillment agreements with the world's fastest-growing e-commerce ecosystems. In Southeast Asia, J&T serves as an anchor logistics backbone for ByteDance's TikTok Shop and Sea Limited's Shopee, enabling high-density sorting and rapid dispatch across fragmented island geographies. In Latin America, J&T has expanded bilateral relationships with regional marketplace titan Mercado Libre in Brazil and Mexico, while simultaneously handling inbound destination fulfillment for global cross-border discount leaders Temu, SHEIN, and AliExpress. On the ground in Brazil, J&T achieved an 8.2/10 consumer rating on the Reclame Aqui consumer protection portal, demonstrating international service adaptability. For domestic merchants and SMEs, J&T's nationwide sorting networks and drop-point density provide direct logistical access, although service quality variance and carrier competition remain ongoing operational challenges across complex regional geographies.
    claimRefs:
      - "CU004"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU013"
    tableRefs:
      - "TU003"
  - id: "customer-journey-retention-and-concentration-risks"
    title: "Customer Journey Dynamics, Retention, and Concentration Vulnerabilities"
    body: >-
      The merchant customer journey begins with e-commerce platform API integration and digital waybill generation, progressing through local outlet drop-off or courier pickup, line-haul transit, automated regional sorting, and final last-mile doorstep handoff. High-volume enterprise customers are retained through value-added capabilities such as cloud warehousing, priority customer service channels, and the Tuyouda premium delivery framework. Despite these sticky operational touchpoints, customer experience is vulnerable to last-mile execution friction. Consumer reviews and dispute logs reveal recurring customer complaints regarding failed delivery attempts, premature delivery status markings, and delayed customer service escalations. More critically, J&T faces structural customer concentration risk: because public filings do not disclose the exact percentage revenue or parcel volume contribution from top platform clients such as ByteDance or PDD Holdings, investors face unhedged uncertainty regarding platform bargaining power, merchant shipping fee clawbacks, and the threat of captive in-house logistics displacement.
    claimRefs:
      - "CU007"
      - "CU010"
      - "CU013"
