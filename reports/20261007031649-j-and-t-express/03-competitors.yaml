  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: competitive-landscape
      missingEvidence: >-
        A geography-by-geography exhaustive peer set spanning direct carriers, platform fleets,
        freight adjacencies, merchant multi-carrier tools, and internal logistics operations.
      whyItMatters: >-
        Directory lists mix business models, so an incomplete set can overstate differentiation
        or omit the buyer's most credible substitute.
      diligencePath: >-
        Obtain country-level tender shortlists and carrier allocation data from major merchants,
        then reconcile them with regulator and carrier filings.
      relatedQuestionRefs: [QP001]
      relatedTableRefs: [TP001]
    - type: private-evidence-only
      severity: material
      topic: competitor-pricing
      missingEvidence: >-
        Comparable realized tariffs, rebates, minimum-volume commitments, service-level penalties,
        and renewal terms for J&T and its major competitors.
      whyItMatters: >-
        Public per-parcel revenue and profit do not reveal customer price, discounting, or the
        economics of switching and multi-homing.
      diligencePath: >-
        Review anonymized customer contracts and current multi-carrier tenders on a matched
        geography, parcel-weight, service-level, and volume basis.
      relatedQuestionRefs: [QP005, QP006]
      relatedTableRefs: [TP003]
