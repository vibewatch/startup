      shares across SEA and the US.
    claimRefs: [CP002, CP008, CP009, CP010]
callouts:
  - calloutType: risk
    title: Scale is not the same as buyer control
    body: >-
      J&T's parcel density can lower unit cost, but a platform that owns demand can redirect volume
      or expand an in-house fleet. Underwrite the network advantage together with platform
      concentration and multi-carrier behavior.
    claimRefs: [CP007, CP010]
