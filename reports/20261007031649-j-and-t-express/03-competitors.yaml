      - ["Local distribution model", "Network partners plus directly operated outlets", "Platform-controlled demand and fulfillment", "Established carrier networks", "Newer last-mile networks"]
      - ["Technology", "Unified digital platform, routing, forecasting, and capacity scheduling", "Unknown in assigned evidence", "Unknown in assigned evidence", "Unknown in assigned evidence"]
      - ["Order-flow control", "Carrier partner; meaningful TikTok exposure reported", "High within the parent platform", "Broad shipper base; mix unsupported", "Primarily cross-border and e-commerce flows in assigned reporting"]
      - ["Capital intensity", "Sponsor model is claimed to lower J&T-funded capital needs", "Unknown in assigned evidence", "Established sunk network; current incremental cost unsupported", "Network build required; private cost structures unsupported"]
      - ["Service / trust proof", "Company reports faster delivery and lower lost-parcel rate; complaint signal remains adverse", "No comparable assigned benchmark", "No comparable assigned benchmark", "Fulfillment stability reported for GOFO and UniUni, without a common service metric"]
    notes: >-
      Capability cells use only the assigned evidence; "unknown" means no comparable proof was
      retained, not that a capability is absent.
    claimRefs: [CP001, CP007, CP010, CP011, CP015]
  - id: TP003
    title: Pricing and unit-economics evidence
    columns:
      - Geography / alternative
      - Period
      - Public metric
      - Value
      - Comparability caveat
      - Competitive implication
    rows:
      - ["J&T Southeast Asia", "FY2025", "Revenue / adjusted EBIT per parcel", "US$0.71 / US$0.07", "Company-reported segment economics, not a customer tariff", "Density supports low unit pricing with a thin absolute profit pool"]
      - ["J&T China", "FY2025", "Revenue / adjusted EBIT per parcel", "US$0.30 / US$0.004", "Company-reported segment economics, not realized contract price", "Very narrow unit profit increases sensitivity to price responses"]
      - ["J&T New Markets", "FY2025; 2H2025", "Adjusted EBIT per parcel", "US$0.01; US$0.09", "Mix spans five countries and changed during the year", "Improvement is promising but not yet a stable cross-market benchmark"]
      - ["US domestic vs Chinese cross-border orders", "2026 independent report", "Indicative price per parcel", "Around US$3 vs just over US$2", "Reported market indication, not audited J&T pricing", "Cross-border focus can start with a structurally lower revenue pool"]
      - ["J&T China historical entry", "2020-2022", "Average gross loss per shipment", "US$0.28 / US$0.15 / US$0.06", "Historical third-party report based on IPO-era evidence", "Price-led share acquisition improved but did not immediately establish profitability"]
    notes: >-
      Values preserve each source's metric and period; unit revenue, adjusted EBIT, gross loss,
      and indicative market price are not interchangeable.
    claimRefs: [CP005, CP006, CP013, CP016]
