evidenceGaps:
  - topic: labor-and-headcount-transparency
    type: missing-source
    severity: material
    missingEvidence: >-
      Official reporting provides an agreement covering over 290,000 Chinese network workers but lacks a precise global
      consolidated employee headcount distinct from third-party contractors and franchise partners.
    whyItMatters: >-
      Distinguishing internal payroll employees from franchised or contracted service staff is essential for calculating
      true labor productivity and operational fixed-cost leverage.
    diligencePath: >-
      Review future annual report disclosures and ESG labor census data to extract direct full-time employee headcounts
      by operational region.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
  - topic: stakeholder-and-investor-map
    type: private-evidence-only
    severity: minor
    missingEvidence: >-
      Detailed equity cap table breakdown showing post-IPO voting power and secondary transaction holdings across
      pre-IPO venture backers.
    whyItMatters: >-
      Evaluating board voting control and potential secondary overhang requires comprehensive disclosure of pre-IPO
      institutional shareholder stakes.
    diligencePath: >-
      Inspect HKEX disclosure of interests notifications and statutory filings for major shareholder holdings exceeding
      5% thresholds.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: platform-concentration-and-yield
    missingEvidence: >-
      Granular revenue breakdown and parcel volume split by individual e-commerce platform partner (Shopee, TikTok,
      TEMU, SHEIN) and route-specific parcel yield across Southeast Asia and China.
    whyItMatters: >-
      Concentration risks and per-parcel yield compression directly govern operating margin sustainability and
      vulnerability to platform in-housing.
    diligencePath: >-
      Review subsequent statutory interim financial report disclosures, platform master service agreement filings, or
      request private commercial breakdown in institutional investor meetings.
    relatedQuestionRefs:
      - QM008
  - type: enumeration-incomplete
    severity: material
    topic: competitive-landscape
    missingEvidence: >-
      A geography-by-geography exhaustive peer set spanning direct carriers, platform fleets, freight adjacencies,
      merchant multi-carrier tools, and internal logistics operations.
    whyItMatters: >-
      Directory lists mix business models, so an incomplete set can overstate differentiation or omit the buyer's most
      credible substitute.
    diligencePath: >-
      Obtain country-level tender shortlists and carrier allocation data from major merchants, then reconcile them with
      regulator and carrier filings.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Comparable realized tariffs, rebates, minimum-volume commitments, service-level penalties, and renewal terms for
      J&T and its major competitors.
    whyItMatters: >-
      Public per-parcel revenue and profit do not reveal customer price, discounting, or the economics of switching and
      multi-homing.
    diligencePath: >-
      Review anonymized customer contracts and current multi-carrier tenders on a matched geography, parcel-weight,
      service-level, and volume basis.
    relatedQuestionRefs:
      - QP005
      - QP006
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
