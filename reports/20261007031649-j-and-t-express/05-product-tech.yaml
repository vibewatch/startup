callouts:
  - calloutType: "insight"
    title: "China Operational Know-How Replication in Emerging Markets"
    body: "A central technical driver of J&T Express's rapid market share acquisition in Southeast Asia and Latin America is the systematic replication of China's automated logistics playbook. By deploying high-capacity automated cross-belt sorting machinery, proprietary address parsing engines, and algorithmic vehicle loading optimization across regions like Vietnam, the Philippines, and Brazil, J&T achieves significant scale economies that smaller regional carriers struggle to match."
    claimRefs:
      - "CE002"
      - "CE007"
      - "CE011"
  - calloutType: "risk"
    title: "Customer Resolution Deficits and Franchise Service Inconsistency"
    body: "Despite extensive automation in sorting and network infrastructure, J&T Express faces severe customer dissatisfaction in last-mile package delivery. Data from third-party complaint tracking platforms highlights chronic issues with unannounced delivery delays, courier status manipulation, and an effective 0% complaint resolution rate across 1,932 tracked cases, pointing to structural gaps in franchisee oversight and customer support execution."
    claimRefs:
      - "CE014"
      - "CE015"
