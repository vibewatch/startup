company:
  name: "J&T Express"
chapter:
  number: 1
  title: "Company Overview"
  summary: "J&T Express is a Hong Kong-listed global logistics service provider operating across 13 countries spanning Southeast Asia, China, the Middle East, and Latin America. In fiscal year 2025, the company achieved US$12.2 billion in revenue and handled 30.1 billion parcels, with adjusted net profit surging 112.3% to US$425 million as New Markets reached initial full-year operating profitability. However, rapid volume expansion continues to face persistent delivery quality and customer complaint resolution challenges in last-mile networks."
sections:
  - id: "corporate-identity-and-scale"
    title: "Corporate Identity, Listing, and Network Footprint"
    body: "J&T Express is a global express logistics operator established in August 2015 with founding operational roots in Indonesia. Following rapid expansion across Southeast Asia and mainland China, the operating parent J&T Global Express Limited completed a public listing on the Main Board of the Hong Kong Stock Exchange in October 2023 under ticker 01519. The company's core operations center on express courier delivery, cross-border fulfillment, and supply chain logistics services. J&T Express has structured an integrated parcel delivery network covering 13 countries globally, including core Southeast Asian territories (Indonesia, Vietnam, Malaysia, the Philippines, Thailand, Cambodia, Singapore), mainland China, Middle Eastern expansion markets (Saudi Arabia, the United Arab Emirates, Egypt), and Latin American markets (Mexico, Brazil). This diversified geographic footprint allows J&T Express to capture escalating cross-border and domestic e-commerce shipment volumes from global and regional merchant platforms."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership and Corporate Governance"
    body: "Corporate leadership and global execution at J&T Express are led by a senior management team with deep operational experience across emerging market logistics and technology distribution. Dylan Tey serves as Chief Financial Officer, directing group financial reporting, capital expenditure allocations, free cash flow management, and public market engagement on the Hong Kong Stock Exchange. Charles Hou serves as Group Vice President, overseeing international network expansion, sorting infrastructure investments, and commercial partnerships across Southeast Asia, China, and New Markets. Corporate governance is coordinated by group headquarters with local operational execution managed by regional subsidiaries in each target geography. In mainland China, the group established a formalized labor negotiation framework covering over 290,000 self-operated and franchise workers, addressing algorithm transparency and delivery driver compensation. However, key-person dependence remains concentrated around founder-aligned leadership and executive committee members who drove the initial regional buildouts."
    claimRefs:
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capital-structure-and-strategic-partners"
    title: "Capital Structure, Commercial Partnerships, and Network Dynamics"
    body: "J&T Express operates an open-platform delivery ecosystem that combines heavy capital infrastructure investments with strategic commercial relationships across major digital commerce platforms. Rather than relying on a captive parent marketplace, J&T Express positions itself as an independent logistics infrastructure provider serving multi-platform volume. In Southeast Asia, the company serves leading digital marketplaces including TikTok Shop, Shopee, Lazada, and SHEIN, expanding regional market share to 34.4% in 2025. In Latin America, J&T Express established a commercial delivery partnership with regional e-commerce leader Mercado Libre in 2025, enabling the New Markets division to rapidly scale local parcel density. The company relies on a hybrid network model combining self-operated sorting hubs and line-haul fleets with local franchise outlets and network partners. Capital allocation has prioritized hub automation, fleet renewal, and self-built regional logistics parks to drive down unit processing costs."
    claimRefs:
      - "CO008"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"
  - id: "operational-performance-and-service-quality"
    title: "Operational Scale, Financial Turnaround, and Quality Challenges"
    body: "Fiscal year 2025 represented an operational and financial inflection point for J&T Express. Consolidated annual parcel volume surpassed 30 billion pieces for the first time, reaching 30.1 billion parcels (up 22.2% year-over-year) and generating US$12.2 billion in revenue (up 18.5% year-over-year). Adjusted net profit surged 112.3% to US$425 million, supported by operating cash flow of US$1.09 billion and free cash flow of US$494 million. The company's geographic diversification strategy gained significant traction as non-China markets contributed 44% of consolidated revenue, up from 37% in 2024. Most notably, the New Markets segment (Middle East and Latin America) generated its first full-year adjusted EBIT profit of US$4 million, turning positive within three years of operations. First quarter 2026 data confirmed continued operating momentum, with global parcel volume reaching 8.326 billion pieces. However, rapid volume scaling has strained last-mile delivery quality, as evidenced by consumer review platform tracking showing chronic complaints regarding failed deliveries, parcel misplacement, and customer service responsiveness."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO014"
      - "CO015"
    figureRefs:
      - "FO001"
