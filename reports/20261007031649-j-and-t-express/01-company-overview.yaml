callouts:
  - calloutType: "insight"
    title: "Geographic Decoupling and Emerging Market Profitability"
    body: "J&T Express has materially reduced its dependence on China express delivery, lifting non-China revenue to 44% of consolidated revenue in 2025. Crucially, the New Markets segment in Latin America and the Middle East swung to positive adjusted EBIT of US$4 million within three years of launch, proving that the cross-border delivery flywheel can replicate outside Southeast Asia."
    claimRefs:
      - "CO006"
      - "CO009"
      - "CO012"
  - calloutType: "risk"
    title: "Customer Service Escalation and Delivery Friction"
    body: "Despite rapid volume scaling and network automation, third-party complaint data reveals notable consumer dissatisfaction in last-mile parcel handoffs. Independent tracking on ComplaintsBoard recorded an unresolved complaint rate of 100% across 1,932 customer submissions, pointing to chronic post-delivery resolution gaps that threaten long-term brand equity."
    claimRefs:
      - "CO014"
