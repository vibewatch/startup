slug: j-and-t-express
runDate: 2026-10-07
company:
  name: "J&T Express"
chapter:
  number: 8
  title: Valuation
  summary: >-
    J&T's FY2025 and 1H2026 disclosures show stronger growth, profitability, and cash
    generation, while the SF Holding share exchange supplies a recent HKD10.10-per-share
    strategic anchor. The retained evidence does not include a live share price, current
    diluted market capitalization, or independent trading-multiple set, so the evidence-led
    recommendation is research-more rather than a price-insensitive buy.
sections:
  - id: decision-and-entry-discipline
    title: Decision and entry discipline
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and an
      indeterminate valuation stance. J&T is already a listed, multinational operator rather
      than a private startup: company-issued materials identify stock code 1519.HK and a
      13-country network. Operating results are improving, but company quality and security
      attractiveness are different questions. The retained evidence supplies no live share
      price, current diluted market capitalization, enterprise value, or independent peer
      multiple set. It therefore cannot establish an evidence-backed entry price, target
      return, or holding-period return. The HKD10.10 SF issuance is useful as a strategic
      transaction anchor, not as a standalone fair-value opinion. A new position should wait
      for the live valuation bridge and comparable-set work identified below.
    claimRefs: [CV001, CV015, CV016]
    tableRefs: [TV001]
  - id: operating-proof-and-anti-thesis
    title: Operating proof and anti-thesis
    body: >-
      The thesis has measurable support. FY2025 revenue was US$12.158 billion, IFRS profit
      for the year was US$225.3 million, and company-defined free cash flow was US$494
      million. Momentum continued in 1H2026: revenue reached US$7.67 billion, adjusted net
      profit reached US$350.6 million, and operating cash flow reached US$635.5 million.
      These periods and definitions must remain separate: adjusted net profit is a non-IFRS
      measure and is not cash flow. The anti-thesis is equally material. A retained
      independent profile describes brutal regional price competition and painfully thin
      margins, while the operating footprint includes 14 self-built core logistics parks
      covering 1.05 million square meters at end-2025. Scale can improve unit economics, but
      it also makes capital discipline and pricing resilience central to value.
    claimRefs: [CV002, CV004, CV005, CV006, CV008, CV009, CV010, CV014]
    tableRefs: [TV002]
  - id: financing-dilution-and-governance
    title: Financing, dilution, and governance
    body: >-
      The January 2026 SF Holding agreement is the strongest retained valuation reference:
      J&T agreed to issue 822 million Class B shares at HKD10.10 each, after which SF would
      own 10% of J&T's enlarged share base. Those terms mechanically imply about 8.22
      billion post-issue shares and an HKD83.0 billion equity-value anchor at the issue price;
      that calculation is not a current market capitalization or fair-value target. The same
      disclosure also signals material dilution and strategic concentration, although J&T's
      1H2026 repurchases partly offset issuance at a different scale. Governance remains a
      diligence item because founder Jet Jie Li simultaneously serves as chairman and chief
      executive. Completion status, the current fully diluted share count, and any remaining
      preference-like or fair-value liabilities must be reconciled before underwriting an
      entry price.
    claimRefs: [CV003, CV011, CV012, CV013, CV015]
  - id: scenarios-exit-and-thesis-breaks
    title: Scenarios, exit readiness, and thesis-breaks
    body: >-
      Scenario framing is directional because the valuation denominator is missing. The bull
      case requires sustained revenue growth, rising IFRS earnings, positive free cash flow,
      and proof that pricing discipline survives parcel-volume expansion; it would justify a
      value above the strategic transaction anchor, but the retained evidence does not
      support a ceiling. The base case keeps valuation near that anchor while requiring a
      live enterprise-value bridge before action. The bear case places value below the anchor
      if price competition compresses margins, cash generation reverses, or capital needs
      rise. A public listing provides an exit route, and Hang Seng Index inclusion is a
      positive market-access signal, but neither proves an attractive entry. Thesis-breaks
      are two consecutive reporting periods of weaker cash conversion, loss of IFRS
      profitability, or evidence that issuance and leverage overwhelm buybacks.
    claimRefs: [CV001, CV005, CV006, CV007, CV008, CV009, CV010, CV011, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
