callouts:
  - calloutType: recommendation
    title: Price discipline overrides company quality
    body: >-
      Improving earnings and cash generation justify diligence, but they do not justify a
      buy without a live market-value denominator and independent comparable multiples.
    claimRefs: [CV004, CV005, CV006, CV008, CV009, CV010, CV015, CV016]
  - calloutType: risk
    title: Do not treat the SF issue price as fair value
    body: >-
      The HKD10.10 issue price reflects a strategic cross-shareholding transaction and may
      embed bilateral benefits that public minority investors cannot replicate.
    claimRefs: [CV011, CV012]
