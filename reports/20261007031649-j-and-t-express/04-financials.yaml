chapter:
  number: 4
  title: "Financials"
  summary: "J&T Express achieved positive operating cash flow and profitability inflection across FY2025 and 1H 2026, driven by rapid volume expansion in Southeast Asia and New Markets, while maintaining a lean cost structure and a strong cash buffer of US$2.91 billion. However, tight net margins in China and ongoing capital commitments in emerging regions require rigorous ongoing diligence on parcel yield durability and capital allocation."
sections:
  - id: "revenue-streams-and-commercial-model"
    title: "Revenue Streams and Commercial Model"
    body: "J&T Express operates primarily as an express delivery service provider, deriving the vast majority of its top-line revenue from domestic express parcel handling across Southeast Asia, China, and New Markets (including Saudi Arabia, UAE, Mexico, Brazil, and Egypt), complemented by cross-border logistics. In FY2025, group revenue expanded by 18.5% year-on-year to US$12.16 billion (up from US$10.26 billion in FY2024), with express delivery services representing US$12.08 billion of total core operations. Growth accelerated significantly in 1H 2026, where group revenue reached US$7.67 billion, representing a 39.5% year-on-year increase, with express services contributing US$7.46 billion. Southeast Asia remains a high-margin engine, generating US$4.50 billion in FY2025 revenue (19.1% gross margin) and surging 71.2% in parcel volume in 1H 2026. China represents the largest revenue contributor at US$6.71 billion in FY2025, but operates at a narrower 6.7% gross margin due to intense domestic tariff competition. The emerging New Markets segment contributed US$870 million in FY2025 revenue and grew parcel volume by 119.9% in 1H 2026, demonstrating rapid commercial scaling."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "unit-economics-and-cost-structure"
    title: "Unit Economics and Cost Structure"
    body: "The group's cost structure is characterized by heavy variable operating expenditures across pickup and delivery, line-haul transportation, and automated sorting center operations. In FY2025, group cost of revenue stood at US$10.70 billion, yielding a consolidated gross profit of US$1.46 billion (12.0% gross margin). Segmental unit economics reveal contrasting regional dynamics: Southeast Asia generated an average selling price (ASP) of US$0.59 per parcel against COGS of US$0.48, delivering an adjusted EBIT of US$0.07 per parcel in FY2025. In China, ASP reached US$0.30 per parcel against COGS of US$0.28 per parcel, generating an adjusted EBIT of US$0.004 per parcel. In New Markets, ASP was US$2.15 per parcel against COGS of US$2.14 in FY2025, turning adjusted EBIT positive to US$0.01 per parcel for the full year and US$0.09 per parcel in 2H 2025. By 1H 2026, group adjusted EBIT per parcel expanded 77% year-on-year to US$0.025, underpinned by extensive hub automation and network density. However, consumer complaints regarding parcel handling and service execution highlight operational strain during high-volume periods."
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI011"
    tableRefs:
      - "TI002"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Capital Adequacy and Financing Dependency"
    body: "J&T Express has transitioned from high cash burn to self-sustaining operational cash flow, significantly reducing financing dependency. In FY2025, net cash generated from operating activities reached US$1.09 billion, up from US$807 million in FY2024, yielding free cash flow of US$494 million after capex of US$594 million. Operating cash flow momentum continued into 1H 2026, reaching US$640 million (up 50.9% year-on-year). As of June 30, 2026, cash and cash equivalents, restricted cash, and bank wealth management products totaled US$2.91 billion, compared to US$2.20 billion at year-end FY2025. Debt obligations have been actively restructured: total borrowings at December 31, 2025 stood at US$2.41 billion, including a syndicated loan of RMB 10 billion utilized to replace US$1.25 billion in high-interest debt due in October 2028. Strategic institutional ties remain notable; competitor SF Express (S.F. Holding) holds equity in J&T Express recorded at a book value of RMB 1.01 billion (US$140 million equivalent) as of June 30, 2025, following the earlier Fengwang Express transaction. Capital adequacy is sufficient for near-term network expansion, though capex commitments of US$154 million and ongoing automated sorting investments require disciplined underwriting."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
    tableRefs:
      - "TI003"
