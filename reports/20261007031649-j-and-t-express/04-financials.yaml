callouts:
  - calloutType: "insight"
    title: "Southeast Asian Margin Buffer Offsets China Price War Pressures"
    body: "J&T Express's geographic diversification serves as a critical structural hedge. While China accounts for 55% of revenue, intense market competition compresses its adjusted EBIT to US$0.004 per parcel. In contrast, Southeast Asia delivers US$0.07 adjusted EBIT per parcel with a 19.1% gross margin, funding group-wide innovation, hub automation, and aggressive Latin American and Middle Eastern expansion."
    claimRefs:
      - "CI002"
      - "CI007"
      - "CI008"
  - calloutType: "risk"
    title: "Last-Mile Delivery Friction and Complaint Resolution Vulnerabilities"
    body: "Rapid volume expansion to over 100 million parcels daily has exacerbated frontline customer service friction. External review platforms report severe complaint backlogs with near-zero resolution rates for recorded complaints, indicating that automated sorting and driver density have outpaced customer care infrastructure."
    claimRefs:
      - "CI010"
      - "CI011"
