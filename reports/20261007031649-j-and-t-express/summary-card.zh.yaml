  topStrengths:
    - 覆盖 13 个国家的大型包裹网络，在东南亚拥有披露口径领先的规模。
    - FY2025 和 1H2026 业绩显示公司实现盈利增长、现金流为正，流动性也很强。
    - 自动化、网络密度和多市场扩张为经营杠杆提供支撑。
  topRisks:
