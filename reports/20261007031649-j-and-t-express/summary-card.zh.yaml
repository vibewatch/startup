    - 公开文件没有足够精确地披露按收入或包裹量计算的平台集中度。
    - 中国市场的单票收益和返利机制仍不够透明，无法判断利润率是否可持续。
    - New Markets 各国层面的回报测算和发起方经济模型仍只披露了一部分。
    - 除了混合口径的服务人员披露外，仍无法获得干净的员工总数。
