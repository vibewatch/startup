    approximationNotes: "Placement is a qualitative synthesis of the cited evidence and explicit evidence gaps; it is not a quantified probability model."
    claimRefs: [CR013, CR014]
callouts:
  - calloutType: risk
    title: Highest-priority unresolved risk
    body: Ai.tech's public materials do not establish current privacy controls, incident history, infrastructure concentration, or consolidated financial capacity; these gaps prevent a defensible reduction in residual risk.
    claimRefs: [CR013, CR014]
  - calloutType: recommendation
    title: Diligence before risk reduction
    body: Require entity-level financials, data maps, security evidence, vendor concentration, and asset-level operating metrics before treating the reported valuation or bootstrapped structure as evidence of resilience.
    claimRefs: [CR010, CR012, CR014]
