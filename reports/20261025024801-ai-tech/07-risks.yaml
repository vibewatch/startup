    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Invalid traffic or supply-chain fraud", "Medium", "High", "Industry standards exist; company controls unverified", "High", "Obtain IVT rates, certification scope, vendor coverage, and loss reconciliations."]
      - ["Cloud, hardware, or model-provider concentration", "Medium", "High", "Not publicly verified", "High", "Obtain architecture, provider concentration, failover tests, and portability plan."]
      - ["Model-cost escalation or weak productivity realization", "Medium", "High", "Management rationale only", "Medium-high", "Reconcile inference/training cost, gross margin, usage, and measured customer outcomes."]
      - ["Security incident, outage, or data-provenance failure", "Unknown", "High", "Not publicly verified", "High", "Obtain SOC reports, incident register, RTO/RPO, access controls, and provenance policy."]
    notes: "Rows distinguish external industry evidence from missing Ai.tech operating metrics; unknown likelihood is not treated as zero."
    claimRefs: [CR005, CR006, CR007, CR008]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Advertising ecosystem standards and measurement, "MRC/TAG/IAB standards and vendors", "Unknown", "Fraud measurement or accreditation coverage is incomplete", "High", "Independent measurement and vendor-level controls", "Medium-high"]
      - [AI compute and energy, "Cloud, hardware, and data-center providers", "Unknown", "Capacity, price, export-control, or energy constraint interrupts delivery", "High", "Multi-provider architecture and capacity commitments", "High"]
      - [Portfolio asset and customer relationships, "Media.net, Advertising.tech, and counterparties", "Unknown", "Asset underperformance or counterparty loss reduces cash generation", "High", "Asset-level reporting and continuity plans", "High"]
      - [Founder-controlled capital allocation, "Founder / holding-company treasury", "High by reported structure", "Opaque intercompany funding or control rights impair liquidity", "High", "Audited consolidated accounts, cap table, and related-party review", "High"]
    notes: "Counterparty concentration is not disclosed in the retained sources; 'Unknown' identifies a diligence gap, while founder-control wording reflects the reported holding-company context rather than a quantified ownership percentage."
    claimRefs: [CR009, CR010, CR011, CR012]
