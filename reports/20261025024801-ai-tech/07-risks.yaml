chapter:
  number: 7
  title: Risks
  summary: Ai.tech's risk profile is shaped by opaque company-level disclosure, exposure to changing ad-tech privacy and competition rules, and dependencies on capital-intensive AI infrastructure and advertising supply-chain controls. Public evidence supports identifiable monitoring and diligence paths, but not a verified view of current incident history, consolidated finances, or mitigation maturity.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: The most directly evidenced external risk is regulatory complexity in the advertising and data ecosystem. IAPP describes diverging privacy requirements across jurisdictions and specifically distinguishes EU consent requirements from California opt-out mechanics, while also noting that smaller businesses may lack resources to localize controls. The U.S. Department of Justice's Google ad-tech monopolization case shows that market structure and auction conduct can draw enforcement attention beyond privacy compliance. These sources do not establish a violation by Ai.tech; they establish a material exposure surface for an ad-tech portfolio whose current data flows, contracting model, and jurisdictional controls are not publicly documented. The legal risk should therefore be monitored through a jurisdiction-by-jurisdiction data map, consent and opt-out testing, customer contract review, and a search of litigation and regulator records.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-technical
    title: Operational, technical, and model risk
    body: The available evidence points to a business model that may combine an AI holding-company strategy with advertising technology and inherited ad-tech operating capabilities, but it does not disclose current reliability, security, model governance, or service-level performance. Rest of World quotes Divyank Turakhia describing large-model training costs as already above $100 million and potentially reaching billions, and identifies hardware concentration as a single-point-of-failure concern. TAG's industry study also shows that invalid traffic remains a persistent problem even after standards reduced losses in certified channels. For Ai.tech, the practical risk is not a proven outage or breach; it is the unverified ability to control model cost, uptime, fraud, data provenance, and quality across multiple assets. A kill criterion is breached customer-impacting downtime, fraud loss, or model-cost inflation that cannot be passed through or offset by measured productivity gains.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-financial
    title: Partner, dependency, and financial-model risk
    body: Historical reporting shows that Media.net was sold to a Chinese consortium for approximately $900 million, while more recent reporting describes Ai.tech as having reached a reported $1.5 billion valuation without external funding. Those figures are not consolidated financial statements, current cash availability, or proof of present asset ownership economics. They do, however, highlight dependence on founder-controlled capital allocation, asset-level performance, counterparties, and a valuation narrative that is difficult to underwrite from public data. The company-specific diligence path is to obtain the current legal-entity chart, intercompany agreements, cap table, cash and debt schedule, asset-level revenue and margin, top counterparties, and continuity plans for key cloud, ad-exchange, and payment dependencies. A thesis-break trigger is inability to reconcile reported valuation with independently supported assets, cash generation, and control rights.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: monitoring-and-kill-criteria
    title: Monitoring plan and thesis-break triggers
    body: "Public sources support a monitoring framework but do not verify Ai.tech's current mitigation maturity. Management should provide evidence for privacy-control coverage, incident response, fraud rates, infrastructure concentration, model economics, customer concentration, and legal entities. The most decision-relevant indicators are measurable: unresolved privacy complaints or regulator inquiries, material invalid-traffic leakage, security incidents, sustained service-level misses, dependence on a single model or cloud provider, and cash requirements that exceed internally generated funding. Until those metrics are disclosed and reconciled to contracts and financial records, residual risk remains high and the appropriate stance is research-more rather than a definitive risk reduction conclusion."
    claimRefs: [CR013, CR014]
    figureRefs: [FR001]
