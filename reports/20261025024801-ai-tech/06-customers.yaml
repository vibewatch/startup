      - [Publisher onboarding, "Manual site review and invite workflow", "Undated source page", "MonetizeMore; medium", "Approval is a gating step before implementation", "No approval rate, time-to-live, or active-site count"]
      - [Implementation, "Copy and paste ad code after account access", "Undated source page", "MonetizeMore; medium", "Deployment can be technically lightweight for publishers", "No deployment completion or utilization rate"]
      - [Reporting, "Breakdowns by site, ad unit, and date range", "Undated source page", "MonetizeMore; medium", "Usage measurement is available at account level", "No aggregate engagement or retention data"]
      - [Payment threshold, "$100 minimum; NET30", "Undated source page", "MonetizeMore; medium", "Cash collection terms may matter to smaller publishers", "No observed payout timing or publisher retention"]
      - [Historical revenue geography, "90% of Media.net revenue in the U.S.", "2016", "TechCrunch; high", "Indicates historical geographic concentration and expansion need", "Not current and no account-level concentration denominator"]
    notes: "Values are reported operational or historical indicators, not a comparable time series; null or missing denominators mean the source did not disclose the relevant population."
    claimRefs: [CU002, CU003, CU005, CU009, CU016]
  - id: TU003
    title: Named customer proof table
    columns: [Named organization or segment, Segment, Deployment/use case, Production versus pilot, Reported outcome, Limitation]
    rows:
      - [Symitri, "Ad-tech partner", "Real-time data-cleanroom integration for Media.net advertisers", "Integration/partnership reported; production scale not established", "Audience matching, activation, and measurement are described as enabled", "No campaign volume, paid contract value, renewal, or measured lift"]
      - [Media.net publishers, Publishers, "Contextual ad units, reporting, and monetization of site traffic", "Platform workflow and publisher approval described; individual deployments unnamed", "Revenue generation and customizable creatives are described", "No named publisher, active-account count, or retention evidence"]
      - [Media.net advertisers, Advertisers, "Contextual and Yahoo! Bing-linked advertising reach", "Commercial capability described; individual deployments unnamed", "Relevant ads and campaign reach are described", "No named advertiser, spend, conversion, or outcome evidence"]
    enumerationScope:
      coverage: partial
      basis: "Named organizations and customer segments identified in the assigned 2016-2025 source set; private account-level deployments are not enumerated."
    notes: "This is a partial enumeration of publicly named proof; generic publisher and advertiser segments are included only where the sources describe their use of Media.net."
    claimRefs: [CU001, CU003, CU004, CU014]
figures:
  - id: FU001
    title: Customer journey from supply onboarding to partner expansion
    type: journey-map
    summary: Public evidence shows a publisher onboarding path and a separate partner-integration path, with retention and expansion metrics unreported.
    data:
      nodes:
        - id: segment
          label: "Publisher or advertiser identifies a monetization need"
          detail: "Publishers seek contextual monetization; advertisers seek targeted reach."
          touchpoints: ["Publisher site", "Advertiser campaign"]
        - id: eligibility
          label: "Eligibility and policy screening"
          detail: "Media.net manually reviews submitted publisher sites and may reject low-quality or unsuitable traffic."
          touchpoints: ["Invite request", "Policy review"]
        - id: integration
          label: "Ad unit or partner integration"
          detail: "Publishers add generated code; Symitri is reported as a first third-party integration partner."
          touchpoints: ["Ad code", "Data cleanroom"]
        - id: activation
          label: "Campaign or inventory activation"
          detail: "Contextual and search-intent capabilities connect demand to publisher inventory."
          touchpoints: ["Contextual ads", "Yahoo! Bing network"]
        - id: measurement
          label: "Reporting and performance measurement"
          detail: "Account-level reporting and, for the Symitri integration, campaign measurement are described."
          touchpoints: ["Site/ad-unit reports", "Campaign measurement"]
        - id: expansion
          label: "Renewal or expansion"
          detail: "No public evidence establishes retention, repeat purchase, expansion, or partner scaling."
          touchpoints: ["Unreported renewal", "Unreported expansion"]
    claimRefs: [CU002, CU003, CU005, CU006, CU016]
callouts:
  - calloutType: insight
    title: Evidence supports workflow, not durability
    body: "The assigned sources establish customer-facing mechanics and one named partner relationship, but they do not establish current active accounts, retention, customer outcomes, or revenue concentration for Ai.tech."
    claimRefs: [CU002, CU003, CU007, CU008, CU013]
  - calloutType: risk
    title: Customer disclosure is the central gap
    body: "Without account counts, cohorts, renewal data, or top-customer exposure, the durability and concentration of the customer base cannot be independently assessed."
    claimRefs: [CU007, CU008, CU009, CU010, CU015]
