chapter:
  number: 6
  title: Customers
  summary: Ai.tech's available customer evidence is concentrated in Media.net's publisher and advertiser ecosystem, with one externally reported partner integration involving Symitri. The sources show product access, eligibility, payment, and support mechanics, but do not disclose an Ai.tech-wide customer count, retention, cohort, or concentration denominator.
sections:
  - id: customer-segments
    title: Buyer, user, and payer segments
    body: >-
      The evidence supports a two-sided customer model around Media.net rather than a
      disclosed consolidated Ai.tech customer base. Publishers are the operating user and
      revenue recipient: they submit sites for review, place ad code, choose formats, and
      receive payments. Advertisers are the demand-side payer whose campaigns are matched
      to publisher inventory through contextual and Yahoo! Bing-linked capabilities. A
      separate ad-tech partner segment is evidenced by Symitri's reported integration with
      Media.net's cleanroom, where the stated workflow is audience matching, ad activation,
      and measurement. These are distinct buyer, user, and payer roles; the sources do not
      establish how many accounts sit in each segment or how much revenue each contributes.
    claimRefs: [CU001, CU002, CU003, CU004, CU014]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption, implementation, and durability
    body: >-
      Adoption proof is stronger for product availability and onboarding mechanics than for
      realized customer outcomes. MonetizeMore describes a manual publisher invite review,
      account credentials after approval, ad-unit generation, copy-and-paste implementation,
      reporting by site or ad unit, and a $100 payment threshold on a NET30 basis. Publisher
      Collective characterizes Media.net as a managed header-bidding option with account
      advisors, while its comparison is a competitor-produced benchmark rather than an
      independent customer survey. AdTechRadar reports Media.net as Symitri's first
      third-party partner and describes a live integration, but the cited statement does
      not provide campaign volume, renewal, or measured lift. No source supplies NRR, GRR,
      churn, renewal rates, contract lengths, cohorts, or customer satisfaction at Ai.tech
      or Media.net scale. IAB and Dentsu report continued digital and programmatic advertising
      growth, but that market demand does not demonstrate Media.net account growth; IAB also
      flags fragmentation and uneven measurement standards as barriers to continued commerce
      media investment.
    claimRefs: [CU005, CU006, CU007, CU008, CU011, CU012, CU013, CU016]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named proof, expansion, and concentration limits
    body: >-
      The named commercial proof is narrow. Symitri is identified as a first third-party
      partner for Media.net, and TechCrunch's historical reporting describes Media.net's
      publisher inventory, demand-side-platform and ad-exchange distribution, and a
      historical 90% U.S. revenue concentration. The latter is a 2016 Media.net datum,
      not a current Ai.tech concentration measure, and should not be used as a present-day
      customer denominator. The evidence also indicates that Media.net's publisher
      eligibility depends on traffic quality, geography, content, and policy compliance,
      which can create procurement friction and limit the addressable supply pool. The
      current customer base, top-account exposure, geographic mix, channel dependence,
      expansion rate, and production-versus-pilot split remain unresolved.
    claimRefs: [CU007, CU008, CU009, CU010, CU015]
    tableRefs: [TU003]
    figureRefs: [FU001]
