company:
  name: Ai.tech
chapter:
  number: 1
  title: Company Overview
  summary: "Ai.tech is described by available reporting as a Divyank Turakhia-founded AI and machine-learning startup studio and holding company, founded in January 2022 and reported at a $1.5 billion valuation in September 2025 without external funding. The profile is strategically interesting but disclosure remains limited: the assigned evidence does not establish current revenue, ownership economics, governance, customer concentration, or audited financial statements."
sections:
  - id: identity-and-business
    title: Identity, product perimeter, and founder history
    body: >
      Available reporting identifies Ai.tech as a startup studio and holding company specializing in artificial intelligence and machine learning. NewsBytes reported that it was founded in January 2022 by Divyank Turakhia and that its portfolio included Advertising.tech and Media.net. The same report described more than 1,600 employees globally, but that is a reported company-scale figure rather than an independently audited headcount. Forbes' profile places Bhavin and Divyank Turakhia's wealth in technology and describes a cluster spanning web hosting, cloud infrastructure, payments, and advertising technology. This supports a founder-led, multi-asset identity, but not a complete legal-entity or subsidiary map.
    claimRefs: [CO001, CO004, CO005, CO006, CO007]
    tableRefs: [TO001, TO002]
  - id: capital-and-scale
    title: Capital, valuation, and operating scale
    body: >
      The strongest current capital signal in the pool is a September 15, 2025 NewsBytes report stating that Ai.tech became an Indian unicorn at a reported $1.5 billion valuation after three years without external funding. That is a third-party report of a company milestone, not a priced financing disclosure, and it does not establish cash available, a valuation methodology, or a current ownership split. The pool contains no current income statement, balance sheet, ARR, revenue run-rate, customer count, debt schedule, or cap table. External industry sources show a large and growing advertising backdrop, but those market totals cannot be substituted for Ai.tech operating metrics.
    claimRefs: [CO002, CO003, CO008, CO009, CO010, CO011, CO012]
  - id: leadership-governance-and-gaps
    title: Leadership, governance, and diligence posture
    body: >
      Divyank Turakhia is the only Ai.tech leader explicitly identified in the assigned company-specific material. Forbes provides historical context on both Turakhia brothers, while NewsBytes attributes Ai.tech's founding to Divyank and links his prior Media.net experience to the new holding company. The evidence does not identify a board, executive bench, institutional investors, independent directors, material leadership changes, or key-person mitigation. That makes founder dependence a material diligence question rather than a proven failure. The external comparison material also illustrates why scale claims in ad technology require careful metric definitions: platform revenue, ad spend, headcount, valuation, and cash generation are different measures.
    claimRefs: [CO004, CO006, CO007, CO010, CO013, CO014]
    tableRefs: [TO003]
    figureRefs: [FO001]
