      - ["Optimize campaigns with AI", "Apply models to signals and campaign decisions", "AI/ML focus is reported, but production operation is not", "No Ai.tech model-quality or business-outcome metric disclosed", "Teads scale figures are competitor-issued benchmarks, not Ai.tech results"]
    notes: "Rows separate Ai.tech-specific evidence from industry workflow requirements and competitor benchmarks; no external benchmark is attributed to Ai.tech."
    claimRefs: [CE001, CE005, CE006, CE007, CE008, CE010, CE012]
  - id: "TE003"
    title: "Technology and operating architecture diligence map"
    columns:
      - "Layer / component"
      - "Required role"
      - "Public evidence"
      - "Dependency"
      - "Primary risk"
    rows:
      - ["Portfolio governance", "Allocate technology, people, IP, and capital across assets", "Studio and named portfolio assets are reported", "Ownership and shared-service design", "Unclear boundaries can obscure asset-level maturity and accountability"]
      - ["Supply and distribution connectivity", "Reach publishers, advertisers, devices, and inventory", "No Ai.tech connectivity metrics; Teads publishes its own media and OEM access", "Publisher and platform relationships", "Concentration and integration fragility"]
      - ["Identity and addressability", "Translate consented signals into targetable audiences", "No Ai.tech design disclosed; IAB documents a changing privacy toolkit", "Browsers, operating systems, consent, and first-party data", "Signal loss, policy change, and compliance failure"]
      - ["Decisioning and models", "Score opportunities and optimize outcomes", "No Ai.tech throughput or model inventory; Teads claims one billion predictions per minute and 50 live models", "Data quality, compute, evaluation, and feedback loops", "Weak prediction quality, bias, drift, latency, or uneconomic inference"]
      - ["Measurement and reporting", "Attribute outcomes and inform optimization", "No Ai.tech methodology disclosed; Privacy Sandbox includes aggregated and noised reporting", "Browser APIs, advertiser data, and experimental design", "Delayed or noisy measurement and unverifiable incrementality"]
      - ["Security and reliability", "Protect systems and data while meeting service levels", "No Ai.tech control or uptime evidence in the assigned set", "Cloud and service providers, incident response, and access governance", "Breach, outage, recovery failure, or customer remediation exposure"]
    notes: "Architecture is a diligence map, not a representation of Ai.tech's implemented stack; competitor and industry sources define required proof and dependencies only."
    claimRefs: [CE005, CE006, CE007, CE012, CE013, CE014, CE016]
