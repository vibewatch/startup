artifact: "product-tech"
slug: "ai-tech"
runDate: "2026-10-25"
company:
  name: "Ai.tech"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Public evidence identifies Ai.tech as an AI/ML startup studio with Advertising.tech and Media.net in its portfolio, but it does not expose an Ai.tech-specific product catalog, architecture, deployment model, reliability record, or control framework. The strongest technical conclusion is therefore dependency-driven: its ad-tech assets operate in a market shaped by browser policy, privacy-preserving addressability, first-party data, concentrated platforms, and competitors that publish far more concrete scale and model-operating benchmarks.
sections:
  - id: "public-product-surface"
    title: "Public product surface and maturity"
    body: >-
      The assigned evidence supports a portfolio-level description rather than a product-level specification. NewsBytes characterized Ai.tech as a startup studio and holding company specializing in artificial intelligence and machine learning, and named Advertising.tech and Media.net as portfolio companies. It also reported more than 1,600 global employees in September 2025, which indicates organizational scale but does not establish product maturity, active deployments, technical performance, or current staffing in October 2026. No assigned page defines SKUs, APIs, buyer workflows, release status, implementation requirements, support tiers, or roadmaps for either asset. Consequently, the matrix below treats the studio, named assets, and claimed AI/ML capability as evidenced surfaces while marking buyer, maturity, differentiation, and integration details as unverified rather than inferring them from brand names.
    claimRefs: [CE001, CE002, CE003, CE016]
    tableRefs: [TE001]
  - id: "workflow-and-external-dependencies"
    title: "Workflow value and external dependencies"
    body: >-
      The broader operating context is more visible than Ai.tech's own workflow. IAB reported that privacy rules and signal loss are pushing advertisers toward first-party data, contextual targeting, and consent-based tools, while data readiness, fragmented tooling, and compliance constrain adoption of AI-driven advertising. Google ultimately retained third-party cookies rather than completing deprecation, and the CMA released the associated commitments in October 2025, but IAB Tech Lab still describes Privacy Sandbox as affecting auctions, audience assignment, creative isolation, reporting, attribution, and bot detection. This means an ad-tech operator cannot treat browser policy as settled architecture: products must accommodate coexistence among cookies, privacy APIs, first-party signals, and regulatory requirements. None of the assigned evidence shows how Ai.tech's assets perform those jobs.
    claimRefs: [CE004, CE005, CE006, CE007, CE008, CE010]
    tableRefs: [TE002]
  - id: "architecture-and-competitive-proof"
    title: "Architecture expectations and competitive proof"
    body: >-
      Public competitors illustrate the technical proof an underwriter should expect, not capabilities that can be attributed to Ai.tech. Teads states that its combined platform makes one billion predictions and processes four billion signals each minute across 50 live AI models; it also describes direct media and OEM access. Those issuer-supplied figures are unaudited competitor benchmarks, but they make the missing Ai.tech disclosures concrete: data-ingestion scale, model inventory, latency, accuracy, supply connectivity, observability, and cost per decision are all absent. The market backdrop raises the bar further. WARC's forecast placed 55.8% of 2025 ad spend outside China with Alphabet, Amazon, and Meta, while IAB measured continued U.S. digital-ad growth. A credible architecture case must therefore show differentiated access and measurable outcomes rather than invoke AI generically.
    claimRefs: [CE009, CE011, CE012, CE013, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "trust-reliability-and-roadmap"
    title: "Trust, reliability, and roadmap gaps"
    body: >-
      Trust and reliability remain diligence blockers. Teads' own transaction disclosure identifies platform scaling, recommendation quality, data-use restrictions, security breaches, infrastructure failures, outages, and changing regulation as material operating risks for a scaled ad-tech platform. These are competitor risks, not evidence of an Ai.tech incident, but they define the controls Ai.tech should substantiate: security ownership, encryption and access controls, consent lineage, model governance, incident history, availability targets, disaster recovery, vendor dependencies, and customer remedies. The assigned Trade Desk page offers only investor-alert privacy language and no usable product benchmark, while the entire assigned set lacks Ai.tech-specific certifications, status history, developer activity, release notes, patents, performance testing, or roadmap evidence. Absence from this bounded evidence set is not proof that controls do not exist; it is a requirement for primary diligence.
    claimRefs: [CE014, CE015, CE016]
callouts:
  - calloutType: "risk"
    title: "Architecture remains unverified"
    body: >-
      Do not underwrite Ai.tech's AI differentiation from portfolio labels or competitor benchmarks. Require asset-level architecture, production metrics, control evidence, and customer deployment proof before assigning a technical moat.
    claimRefs: [CE001, CE002, CE012, CE016]
