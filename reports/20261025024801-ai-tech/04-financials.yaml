      - [Services pricing, null, "Not disclosed", low, "Separate project fees, recurring contracts, and intercompany charges"]
    notes: "No assigned source provides Ai.tech pricing; nulls represent unavailable private evidence rather than zero prices."
    claimRefs: [CI005, CI008]
  - id: TI003
