    title: Revenue model bridge
    type: flow
    summary: Public evidence supports a qualitative bridge from advertising activity to potential Ai.tech revenue, but not a quantified gross-profit bridge.
    data:
      nodes:
        - {id: demand, label: "Advertiser demand", detail: "Budget enters digital advertising markets"}
        - {id: inventory, label: "Publisher / CTV inventory", detail: "Media owners supply impressions"}
        - {id: platform, label: "Ad-tech platform", detail: "Targeting, auction, workflow, or measurement layer"}
        - {id: data, label: "Data and infrastructure", detail: "Potential signal, compute, and compliance costs"}
        - {id: payouts, label: "Publisher and partner payouts", detail: "Potential pass-through or cost of revenue"}
        - {id: revenue, label: "Recognized revenue", detail: "Ai.tech-specific value not disclosed"}
        - {id: grossprofit, label: "Gross profit", detail: "Ai.tech-specific value not disclosed"}
      edges:
        - {from: demand, to: inventory}
        - {from: inventory, to: platform}
        - {from: platform, to: revenue}
        - {from: data, to: revenue}
        - {from: payouts, to: grossprofit}
        - {from: revenue, to: grossprofit}
    approximationNotes: "This is a qualitative operating bridge. No revenue, payout, cost, or gross-profit amount is inferred from market-size or competitor figures."
    claimRefs: [CI003, CI005, CI006, CI008]
