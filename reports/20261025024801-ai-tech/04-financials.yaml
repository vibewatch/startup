chapter:
  number: 4
  title: Financials
  summary: Ai.tech has a reported $1.5 billion valuation without external funding, but public evidence does not disclose revenue, margins, cash, burn, runway, or asset-level economics. The business sits in a growing digital-advertising market, yet concentration, platform competition, and a bootstrapped holding-company structure make underwriting dependent on private financial statements.
sections:
  - id: monetization-and-market
    title: Monetization and revenue quality
    body: >-
      Ai.tech is described as an AI and machine-learning start-up studio and holding company with a portfolio including Advertising.tech and Media.net, but the available public record does not state a consolidated revenue figure, revenue mix, pricing schedule, customer concentration, or recognition policy. The reported $1.5 billion valuation is therefore not an ARR or revenue multiple. Industry evidence supports a large addressable advertising pool: IAB reports $258.6 billion of U.S. internet advertising revenue in 2024, while Magna projects $715 billion of digital-platform ad sales in 2025. Those market figures are not Ai.tech results. The investable question is whether Ai.tech's assets monetize through publisher yield, managed services, software, data, or some combination, and whether reported revenue is gross or net of media and traffic-acquisition costs.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001]
  - id: pricing-and-unit-economics
    title: Pricing, cost structure, and unit economics
    body: >-
      No public source in the assigned pool provides Ai.tech list pricing, realized take rates, gross margin, CAC, payback, sales cycle, retention, working capital, capex, or service-delivery cost. The revenue mechanism is consequently better represented as an evidence-backed operating bridge than as a quantified forecast. Comparable ad-tech evidence shows why metric definitions matter: an independent comparison reports Magnite's 2025 revenue and adjusted EBITDA separately from PubMatic's, and distinguishes reported growth from adjusted growth after removing a legacy DSP effect and political advertising. For Ai.tech, diligence should reconcile booked billings, media spend, publisher payouts, data and infrastructure costs, personnel, and any intercompany transfers across the holding company and operating assets.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI002, TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy and financial underwriting verdict
    body: >-
      The available evidence says Ai.tech reached a reported $1.5 billion valuation in three years without external funding and employed more than 1,600 people globally, but it does not show cash on hand, burn, debt, credit facilities, planned uses of cash, or a next-round trigger. Bootstrapping can reduce dilution and financing dependence, but it can also conceal asset-level cash transfers and leave less room for a downturn in advertising demand. The market backdrop is favorable but concentrated: WARC says Alphabet, Amazon, and Meta are expected to capture 55.8% of ad spend excluding China in 2025, while Pixalate reports Magnite at 25% of U.S. Roku CTV SSP share. The financial verdict is research-more: valuation support is plausible only after obtaining consolidated and asset-level statements, revenue-quality reconciliations, cash-flow evidence, and capital-allocation policies.
    claimRefs: [CI001, CI009, CI010, CI011, CI012]
    tableRefs: []
callouts:
  - calloutType: risk
    title: Underwriting blocker
    body: Public valuation and headcount signals are not substitutes for revenue, cash, burn, margin, or runway disclosure; the missing fields are material to any valuation or capital-adequacy conclusion.
    claimRefs: [CI001, CI012]
  - calloutType: recommendation
    title: Financial stance
    body: Keep the financial case in research-more territory until Ai.tech provides consolidated statements and asset-level economics for its principal advertising businesses.
    claimRefs: [CI008, CI012]
