      - [Gross margin, null, low, "Separates software/data economics from media pass-through", "Gross-profit definition and cost allocation by asset"]
      - [CAC and payback, null, low, "Tests sales efficiency and capital intensity", "Cohort CAC, contract value, churn, and payback schedule"]
      - [Cash burn and runway, null, low, "Tests financing dependency despite bootstrapping", "Monthly cash-flow statements, debt schedule, and liquidity plan"]
    notes: "All four fields are unavailable in the assigned evidence; a null is an explicit diligence request, not an estimate."
    claimRefs: [CI005, CI006, CI008, CI012]
