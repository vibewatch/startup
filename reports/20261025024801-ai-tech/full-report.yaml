  - id: FE001
    title: Evidence stack from public surface to underwriting proof
    type: stack
    summary: The visible portfolio surface sits above multiple technical and control layers that remain unverified for Ai.tech.
    data:
      layers:
        - label: Corporate surface
          detail: Ai.tech is publicly described as an AI/ML startup studio and holding company.
          items:
            - Studio identity
            - Portfolio ownership
        - label: Named asset surface
          detail: >-
            Advertising.tech and Media.net are named, but their current product lines and maturity are not documented in
            the assigned evidence.
          items:
            - Advertising.tech
            - Media.net
        - label: Market workflow
          detail: Ad-tech products must support audience, auction, creative, reporting, attribution, and outcome workflows.
          items:
            - Addressability
            - Auctioning
            - Measurement
        - label: External platform dependency
          detail: Browser and operating-system policy controls cookies, privacy APIs, IP access, identifiers, and reporting.
          items:
            - Chrome policy
            - Privacy APIs
            - Consent
        - label: Competitive proof threshold
          detail: >-
            A competitor publishes model, prediction, signal, media-access, and device-access figures that Ai.tech does
            not.
          items:
            - Model operations
            - Signal throughput
            - Distribution access
        - label: Underwriting proof
          detail: >-
            Ai.tech-specific architecture, deployment, controls, reliability, developer activity, and measurable
            outcomes remain required.
          items:
            - Architecture
            - SLAs
            - Security
            - Benchmarks
    approximationNotes: >-
      Conceptual evidence hierarchy only; layer order does not indicate technical implementation, relative scale, or
      maturity.
    claimRefs:
