  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and spend pools
        blocks:
          - type: paragraph
            body: >-
              Ai.tech describes itself as an AI and machine-learning startup studio and holding company, while public
              reporting identifies Advertising.tech and Media.net as portfolio assets. The relevant market is therefore
              not “AI” in the abstract: it is the monetization and infrastructure layer around digital advertising,
              including demand generation, programmatic buying and selling, contextual or privacy-preserving targeting,
              retail media, video and CTV, and the software that connects buyers with publisher inventory. The boundary
              excludes general enterprise AI spend, non-advertising machine-learning applications, and the full gross
              merchandise value of media businesses. Status-quo substitutes include direct platform buying on Meta,
              Alphabet and Amazon, internal publisher sales teams, agency-managed insertion orders, and first-party
              retail-media networks. That distinction matters because the largest spend pools are increasingly
              controlled by closed platforms rather than independent ad-tech intermediaries.
            claimRefs:
              - CM001
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM015
      - number: '2.2'
        title: Sizing lenses and concentration
        blocks:
          - type: paragraph
            body: >-
              Available estimates describe different populations and should not be collapsed into a single TAM. IAB
              reports U.S. internet advertising revenue of $258.6 billion in 2024, including $62.1 billion of digital
              video, $74.3 billion of display, and $53.7 billion of retail media. WARC provides a wider global lens:
              $1.17 trillion of advertising spend in 2025, with 55.8% outside China attributed to Alphabet, Amazon and
              Meta. The Trade Desk's reported 2024 revenue and platform spend illustrate the scale of one independent
              demand-side benchmark, not Ai.tech's revenue opportunity. These lenses imply a large top-down market, but
              they do not establish Ai.tech's SAM or SOM: the company does not publicly disclose asset-level revenue,
              take rate, customer concentration, or the share of inventory it can reach. A defensible sizing model
              should therefore separate total advertising spend from addressable programmatic and contextual-advertising
              software revenue, then haircut for closed-platform concentration and reachable geographies.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
              - CM017
      - number: '2.3'
        title: Buyers, users, payers, and adoption paths
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-sided. Brands and agencies are the economic buyers of audience reach and measurable
              outcomes; traders, planners, and marketing operations teams are the daily users; publishers and streaming
              platforms are supply-side customers seeking yield, fill, and compliant monetization; and retail-media
              operators own first-party data and budget allocation. The IAB identifies first-party data, contextual
              targeting, consent tools, streaming CTV, retail media, and self-serve platforms as active industry
              directions. The Trade Desk's disclosure of $12 billion of 2024 platform spend demonstrates that scaled
              buyers value an operating layer, while WARC's concentration data shows that many buyers can instead place
              budgets directly into closed platforms. Ai.tech's public site invites enterprises exploring AI at scale
              and builders founding companies, but it does not disclose which advertising buyer segment pays, what
              workflow is replaced, or how portfolio assets share distribution. Those omissions make adoption triggers
              plausible but not yet measurable.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Growth drivers are visible but conditional. Digital advertising is expanding, video and retail media are
              growing faster than the overall U.S. internet market in IAB's 2024 data, and WARC expects most incremental
              global dollars to flow to online-only platforms. AI can automate campaign operations and enable contextual
              or agentic workflows, but IAB explicitly notes data readiness, tool fragmentation, compliance, and
              continued need for human creativity. Privacy regulation and browser changes increase the value of
              consent-based and first-party approaches while raising implementation cost. The main constraint is
              platform concentration: WARC says the three largest owners already take more than half of advertising
              spend outside China, and a public benchmark from The Trade Desk shows the scale required to compete.
              Ai.tech's claimed $1.5 billion valuation and bootstrapped status are market-position signals, not proof of
              recurring advertising revenue or attainable market share. The key valuation diligence is to obtain
              asset-level revenue, gross versus net reporting, customer retention, take rates, geographic exposure, and
              evidence that AI products improve advertiser or publisher ROI.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The exhibits preserve the distinction between observed market measurements, company descriptions, and
              directional analyst forecasts. The market-definition table identifies which spend pools belong in the
              boundary; the sizing table keeps geography, period, denominator, and methodology visible; and the segment
              map distinguishes buyer, user, payer, workflow, and trigger. The pyramid is a presentation of nested
              sizing lenses in authored order rather than a claim that the layers are directly convertible. Because
              Ai.tech's public materials do not disclose a company-specific SAM or SOM, the final layer is explicitly
              marked as unavailable and carried as a diligence gap rather than a guessed percentage.
            claimRefs:
              - CM005
              - CM008
              - CM013
              - CM017
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Large and growing spend pool
            body: >-
              U.S. internet advertising reached $258.6 billion in 2024 and WARC forecasts $1.17 trillion of global
              advertising spend in 2025, supporting a meaningful category tailwind.
            calloutType: strength
            claimRefs:
              - CM005
              - CM006
          - type: callout
            title: Closed-platform concentration
            body: >-
              More than half of advertising spend outside China is forecast to accrue to Alphabet, Amazon and Meta,
              which constrains the independently reachable market for ad-tech intermediaries.
            calloutType: risk
            claimRefs:
              - CM008
              - CM015
          - type: callout
            title: Company-specific sizing remains open
            body: >-
              Ai.tech's valuation and portfolio descriptions do not disclose the revenue base, take rate, retention, or
              reachable inventory needed to calculate a defensible SAM or SOM.
            calloutType: assumption
            claimRefs:
              - CM009
              - CM017
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and scale anchors
        blocks:
          - type: paragraph
            body: >-
              Ai.tech is described by independent reporting as an AI and machine-learning startup studio and holding
              company whose portfolio includes Advertising.tech and Media.net. That makes the relevant competitive set
              broader than a single SaaS peer: the company may face demand-side platforms, supply-side platforms, ad
              servers, identity and measurement vendors, publisher-owned systems, and the internal teams of large
              advertisers and media owners. The public record does not establish which of these products Ai.tech sells
              directly, which it owns through subsidiaries, or whether the portfolio is integrated commercially. The
              clearest scale anchor is The Trade Desk, which reported $2.445 billion of 2024 revenue, $12 billion of
              platform spend, and customer retention above 95% for eleven consecutive years. Its self-service cloud
              platform, integrations with data, inventory, and publisher partners, and enterprise APIs illustrate the
              breadth of incumbent distribution that a smaller or less disclosed portfolio must overcome. The Trade Desk
              also presents a direct strategic threat through CTV, retail media, identity, supply-chain optimization,
              and audio, while its Ventura streaming-TV operating system extends the competitive surface into
              distribution.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP007
              - CP010
              - CP013
      - number: '3.2'
        title: Capability, distribution, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              Competitive advantage in programmatic advertising is shaped by access to inventory and buyer demand,
              workflow integration, measurement credibility, and the ability to operate across channels. A market study
              identifies Google, Meta, Amazon, Microsoft, Alibaba, Adobe, The Trade Desk, Criteo, NextRoll, and
              MediaMath among prominent programmatic players, while its segmentation places mobile and tablets at 49.4%
              of 2023 revenue, video at 41.8%, and retail and consumer goods at 36.3%. These figures are market-level
              estimates rather than Ai.tech or peer results, but they show why a portfolio must prove reach across
              mobile, video, CTV, and commerce media rather than rely on a generic AI proposition. The Trade Desk's
              stated integrations and APIs provide a high-scale benchmark for buyer-side breadth. Magnite and PubMatic
              illustrate a different trade-off: a specialist can build publisher-side or CTV depth, but distribution and
              revenue quality still depend on embedded relationships and reported scale. An independent comparison
              reported Magnite's 2025 revenue of $714.0 million, up 7%, versus PubMatic's $282.9 million, down 3% on a
              reported basis; it also described Magnite's CTV ad-server position as structurally deeper while noting
              PubMatic's cleaner balance sheet and early agentic-AI positioning. This is evidence about competitors, not
              an independent benchmark of Ai.tech.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
              - CP009
              - CP014
      - number: '3.3'
        title: Moat durability, substitutes, and unresolved evidence
        blocks:
          - type: paragraph
            body: >-
              The competitive moat is not established by the size of the surrounding advertising market. It depends on
              durable access to premium supply, identity and consent infrastructure, data and measurement quality,
              switching costs in publisher or advertiser workflows, and trusted performance under privacy and fraud
              constraints. Industry research identifies ad fraud, including non-human traffic and low-quality or
              fraudulent inventory, as a restraint; it also describes privacy regulation as a medium-impact constraint
              because GDPR, CCPA, COPPA, and related regimes restrict data collection and targeting. It identifies
              influencer advertising and traditional television, radio, print, and outdoor channels as substitutes,
              while noting their weaker targeting or optimization in some use cases. WARC reporting adds concentration
              risk: Alphabet, Amazon, and Meta were expected to capture 55.8% of advertising spend outside China in
              2025, with their share forecast to exceed 60% by 2030. Ai.tech's reported $1.5 billion valuation and more
              than 1,600 employees indicate scale claims, but do not reveal product-level retention, take rates,
              customer concentration, integration depth, or pricing. The central diligence conclusion is therefore
              conditional: the portfolio may own valuable ad-tech assets, but public evidence is insufficient to
              distinguish proprietary distribution from exposure to powerful incumbents and commoditizing
              infrastructure.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP007
              - CP008
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The competitive proof point is distribution, not the AI label
            body: >-
              The strongest public peer evidence points to platform spend, retention, inventory integrations, ad-server
              embedding, and streamer relationships. Ai.tech's valuation and headcount do not substitute for those
              product-level proofs.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP008
          - type: callout
            title: Public disclosure leaves the moat unverified
            body: >-
              Ai.tech's assigned sources do not disclose pricing, customer concentration, retention, product-level
              revenue, take rates, or integration depth. Incumbent concentration and privacy, fraud, and substitution
              risks therefore remain material.
            calloutType: risk
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP014
          - type: callout
            title: Portfolio-level comparison is provisional
            body: >-
              The analysis treats Advertising.tech and Media.net as reported portfolio assets but does not assume that
              Ai.tech's holding-company economics equal the economics of any one asset.
            calloutType: assumption
            claimRefs:
              - CP001
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Ai.tech is described as an AI and machine-learning start-up studio and holding company with a portfolio
              including Advertising.tech and Media.net, but the available public record does not state a consolidated
              revenue figure, revenue mix, pricing schedule, customer concentration, or recognition policy. The reported
              $1.5 billion valuation is therefore not an ARR or revenue multiple. Industry evidence supports a large
              addressable advertising pool: IAB reports $258.6 billion of U.S. internet advertising revenue in 2024,
              while Magna projects $715 billion of digital-platform ad sales in 2025. Those market figures are not
              Ai.tech results. The investable question is whether Ai.tech's assets monetize through publisher yield,
              managed services, software, data, or some combination, and whether reported revenue is gross or net of
              media and traffic-acquisition costs.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI008
      - number: '4.2'
        title: Pricing, cost structure, and unit economics
        blocks:
          - type: paragraph
            body: >-
              No public source in the assigned pool provides Ai.tech list pricing, realized take rates, gross margin,
              CAC, payback, sales cycle, retention, working capital, capex, or service-delivery cost. The revenue
              mechanism is consequently better represented as an evidence-backed operating bridge than as a quantified
              forecast. Comparable ad-tech evidence shows why metric definitions matter: an independent comparison
              reports Magnite's 2025 revenue and adjusted EBITDA separately from PubMatic's, and distinguishes reported
              growth from adjusted growth after removing a legacy DSP effect and political advertising. For Ai.tech,
              diligence should reconcile booked billings, media spend, publisher payouts, data and infrastructure costs,
              personnel, and any intercompany transfers across the holding company and operating assets.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI008
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI005
              - CI006
              - CI008
      - number: '4.3'
        title: Capital adequacy and financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The available evidence says Ai.tech reached a reported $1.5 billion valuation in three years without
              external funding and employed more than 1,600 people globally, but it does not show cash on hand, burn,
              debt, credit facilities, planned uses of cash, or a next-round trigger. Bootstrapping can reduce dilution
              and financing dependence, but it can also conceal asset-level cash transfers and leave less room for a
              downturn in advertising demand. The market backdrop is favorable but concentrated: WARC says Alphabet,
              Amazon, and Meta are expected to capture 55.8% of ad spend excluding China in 2025, while Pixalate reports
              Magnite at 25% of U.S. Roku CTV SSP share. The financial verdict is research-more: valuation support is
              plausible only after obtaining consolidated and asset-level statements, revenue-quality reconciliations,
              cash-flow evidence, and capital-allocation policies.
            claimRefs:
              - CI001
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting blocker
            body: >-
              Public valuation and headcount signals are not substitutes for revenue, cash, burn, margin, or runway
              disclosure; the missing fields are material to any valuation or capital-adequacy conclusion.
            calloutType: risk
            claimRefs:
              - CI001
              - CI012
          - type: callout
            title: Financial stance
            body: >-
              Keep the financial case in research-more territory until Ai.tech provides consolidated statements and
              asset-level economics for its principal advertising businesses.
            calloutType: recommendation
            claimRefs:
              - CI008
              - CI012
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Public product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence supports a portfolio-level description rather than a product-level specification.
              NewsBytes characterized Ai.tech as a startup studio and holding company specializing in artificial
              intelligence and machine learning, and named Advertising.tech and Media.net as portfolio companies. It
              also reported more than 1,600 global employees in September 2025, which indicates organizational scale but
              does not establish product maturity, active deployments, technical performance, or current staffing in
              October 2026. No assigned page defines SKUs, APIs, buyer workflows, release status, implementation
              requirements, support tiers, or roadmaps for either asset. Consequently, the matrix below treats the
              studio, named assets, and claimed AI/ML capability as evidenced surfaces while marking buyer, maturity,
              differentiation, and integration details as unverified rather than inferring them from brand names.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE016
      - number: '5.2'
        title: Workflow value and external dependencies
        blocks:
          - type: paragraph
            body: >-
              The broader operating context is more visible than Ai.tech's own workflow. IAB reported that privacy rules
              and signal loss are pushing advertisers toward first-party data, contextual targeting, and consent-based
              tools, while data readiness, fragmented tooling, and compliance constrain adoption of AI-driven
              advertising. Google ultimately retained third-party cookies rather than completing deprecation, and the
              CMA released the associated commitments in October 2025, but IAB Tech Lab still describes Privacy Sandbox
              as affecting auctions, audience assignment, creative isolation, reporting, attribution, and bot detection.
              This means an ad-tech operator cannot treat browser policy as settled architecture: products must
              accommodate coexistence among cookies, privacy APIs, first-party signals, and regulatory requirements.
              None of the assigned evidence shows how Ai.tech's assets perform those jobs.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
              - CE012
      - number: '5.3'
        title: Architecture expectations and competitive proof
        blocks:
          - type: paragraph
            body: >-
              Public competitors illustrate the technical proof an underwriter should expect, not capabilities that can
              be attributed to Ai.tech. Teads states that its combined platform makes one billion predictions and
              processes four billion signals each minute across 50 live AI models; it also describes direct media and
              OEM access. Those issuer-supplied figures are unaudited competitor benchmarks, but they make the missing
              Ai.tech disclosures concrete: data-ingestion scale, model inventory, latency, accuracy, supply
              connectivity, observability, and cost per decision are all absent. The market backdrop raises the bar
              further. WARC's forecast placed 55.8% of 2025 ad spend outside China with Alphabet, Amazon, and Meta,
              while IAB measured continued U.S. digital-ad growth. A credible architecture case must therefore show
              differentiated access and measurable outcomes rather than invoke AI generically.
            claimRefs:
              - CE009
              - CE011
              - CE012
              - CE013
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE012
              - CE013
              - CE014
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE007
              - CE011
              - CE015
              - CE016
      - number: '5.4'
        title: Trust, reliability, and roadmap gaps
        blocks:
          - type: paragraph
            body: >-
              Trust and reliability remain diligence blockers. Teads' own transaction disclosure identifies platform
              scaling, recommendation quality, data-use restrictions, security breaches, infrastructure failures,
              outages, and changing regulation as material operating risks for a scaled ad-tech platform. These are
              competitor risks, not evidence of an Ai.tech incident, but they define the controls Ai.tech should
              substantiate: security ownership, encryption and access controls, consent lineage, model governance,
              incident history, availability targets, disaster recovery, vendor dependencies, and customer remedies. The
              assigned Trade Desk page offers only investor-alert privacy language and no usable product benchmark,
              while the entire assigned set lacks Ai.tech-specific certifications, status history, developer activity,
              release notes, patents, performance testing, or roadmap evidence. Absence from this bounded evidence set
              is not proof that controls do not exist; it is a requirement for primary diligence.
            claimRefs:
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Architecture remains unverified
            body: >-
              Do not underwrite Ai.tech's AI differentiation from portfolio labels or competitor benchmarks. Require
              asset-level architecture, production metrics, control evidence, and customer deployment proof before
              assigning a technical moat.
            calloutType: risk
            claimRefs:
              - CE001
              - CE002
              - CE012
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and payer segments
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a two-sided customer model around Media.net rather than a disclosed consolidated
              Ai.tech customer base. Publishers are the operating user and revenue recipient: they submit sites for
              review, place ad code, choose formats, and receive payments. Advertisers are the demand-side payer whose
              campaigns are matched to publisher inventory through contextual and Yahoo! Bing-linked capabilities. A
              separate ad-tech partner segment is evidenced by Symitri's reported integration with Media.net's
              cleanroom, where the stated workflow is audience matching, ad activation, and measurement. These are
              distinct buyer, user, and payer roles; the sources do not establish how many accounts sit in each segment
              or how much revenue each contributes.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU014
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU014
      - number: '6.2'
        title: Adoption, implementation, and durability
        blocks:
          - type: paragraph
            body: >-
              Adoption proof is stronger for product availability and onboarding mechanics than for realized customer
              outcomes. MonetizeMore describes a manual publisher invite review, account credentials after approval,
              ad-unit generation, copy-and-paste implementation, reporting by site or ad unit, and a $100 payment
              threshold on a NET30 basis. Publisher Collective characterizes Media.net as a managed header-bidding
              option with account advisors, while its comparison is a competitor-produced benchmark rather than an
              independent customer survey. AdTechRadar reports Media.net as Symitri's first third-party partner and
              describes a live integration, but the cited statement does not provide campaign volume, renewal, or
              measured lift. No source supplies NRR, GRR, churn, renewal rates, contract lengths, cohorts, or customer
              satisfaction at Ai.tech or Media.net scale. IAB and Dentsu report continued digital and programmatic
              advertising growth, but that market demand does not demonstrate Media.net account growth; IAB also flags
              fragmentation and uneven measurement standards as barriers to continued commerce media investment.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU011
              - CU012
              - CU013
              - CU016
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU009
              - CU016
      - number: '6.3'
        title: Named proof, expansion, and concentration limits
        blocks:
          - type: paragraph
            body: >-
              The named commercial proof is narrow. Symitri is identified as a first third-party partner for Media.net,
              and TechCrunch's historical reporting describes Media.net's publisher inventory, demand-side-platform and
              ad-exchange distribution, and a historical 90% U.S. revenue concentration. The latter is a 2016 Media.net
              datum, not a current Ai.tech concentration measure, and should not be used as a present-day customer
              denominator. The evidence also indicates that Media.net's publisher eligibility depends on traffic
              quality, geography, content, and policy compliance, which can create procurement friction and limit the
              addressable supply pool. The current customer base, top-account exposure, geographic mix, channel
              dependence, expansion rate, and production-versus-pilot split remain unresolved.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU003
              - CU005
              - CU006
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Evidence supports workflow, not durability
            body: >-
              The assigned sources establish customer-facing mechanics and one named partner relationship, but they do
              not establish current active accounts, retention, customer outcomes, or revenue concentration for Ai.tech.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU007
              - CU008
              - CU013
          - type: callout
            title: Customer disclosure is the central gap
            body: >-
              Without account counts, cohorts, renewal data, or top-customer exposure, the durability and concentration
              of the customer base cannot be independently assessed.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU010
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              The most directly evidenced external risk is regulatory complexity in the advertising and data ecosystem.
              IAPP describes diverging privacy requirements across jurisdictions and specifically distinguishes EU
              consent requirements from California opt-out mechanics, while also noting that smaller businesses may lack
              resources to localize controls. The U.S. Department of Justice's Google ad-tech monopolization case shows
              that market structure and auction conduct can draw enforcement attention beyond privacy compliance. These
              sources do not establish a violation by Ai.tech; they establish a material exposure surface for an ad-tech
              portfolio whose current data flows, contracting model, and jurisdictional controls are not publicly
              documented. The legal risk should therefore be monitored through a jurisdiction-by-jurisdiction data map,
              consent and opt-out testing, customer contract review, and a search of litigation and regulator records.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, technical, and model risk
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to a business model that may combine an AI holding-company strategy with
              advertising technology and inherited ad-tech operating capabilities, but it does not disclose current
              reliability, security, model governance, or service-level performance. Rest of World quotes Divyank
              Turakhia describing large-model training costs as already above $100 million and potentially reaching
              billions, and identifies hardware concentration as a single-point-of-failure concern. TAG's industry study
              also shows that invalid traffic remains a persistent problem even after standards reduced losses in
              certified channels. For Ai.tech, the practical risk is not a proven outage or breach; it is the unverified
              ability to control model cost, uptime, fraud, data provenance, and quality across multiple assets. A kill
              criterion is breached customer-impacting downtime, fraud loss, or model-cost inflation that cannot be
              passed through or offset by measured productivity gains.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner, dependency, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Historical reporting shows that Media.net was sold to a Chinese consortium for approximately $900 million,
              while more recent reporting describes Ai.tech as having reached a reported $1.5 billion valuation without
              external funding. Those figures are not consolidated financial statements, current cash availability, or
              proof of present asset ownership economics. They do, however, highlight dependence on founder-controlled
              capital allocation, asset-level performance, counterparties, and a valuation narrative that is difficult
              to underwrite from public data. The company-specific diligence path is to obtain the current legal-entity
              chart, intercompany agreements, cap table, cash and debt schedule, asset-level revenue and margin, top
              counterparties, and continuity plans for key cloud, ad-exchange, and payment dependencies. A thesis-break
              trigger is inability to reconcile reported valuation with independently supported assets, cash generation,
              and control rights.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Monitoring plan and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Public sources support a monitoring framework but do not verify Ai.tech's current mitigation maturity.
              Management should provide evidence for privacy-control coverage, incident response, fraud rates,
              infrastructure concentration, model economics, customer concentration, and legal entities. The most
              decision-relevant indicators are measurable: unresolved privacy complaints or regulator inquiries,
              material invalid-traffic leakage, security incidents, sustained service-level misses, dependence on a
              single model or cloud provider, and cash requirements that exceed internally generated funding. Until
              those metrics are disclosed and reconciled to contracts and financial records, residual risk remains high
              and the appropriate stance is research-more rather than a definitive risk reduction conclusion.
            claimRefs:
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority unresolved risk
            body: >-
              Ai.tech's public materials do not establish current privacy controls, incident history, infrastructure
              concentration, or consolidated financial capacity; these gaps prevent a defensible reduction in residual
              risk.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: Diligence before risk reduction
            body: >-
              Require entity-level financials, data maps, security evidence, vendor concentration, and asset-level
              operating metrics before treating the reported valuation or bootstrapped structure as evidence of
              resilience.
            calloutType: recommendation
            claimRefs:
              - CR010
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment call and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              Ai.tech's reported USD 1.5 billion valuation is supported by two 2025 accounts of the ASK Private Wealth
              and Hurun India classification, and both describe the company as reaching unicorn status in under three
              years. That is evidence of a reported market mark, not proof of a priced financing, cash proceeds,
              enterprise value methodology, or current fair value. NewsBytes describes the company as having no external
              funding and a portfolio including Media.net and Advertising.tech, while Express Computer reports the same
              USD 1.5 billion figure through the 2025 Hurun report. The evidence therefore supports a high-visibility
              valuation reference but not a conventional venture multiple. The recommendation is research-more rather
              than buy: entry discipline should require current cap-table terms, preference seniority, consolidated and
              asset-level financials, and a defensible bridge from operating cash generation to the valuation. A track
              decision could become investable if those materials show durable revenue, margins, and liquidity at a
              price that compensates for concentration and disclosure risk.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: Thesis, anti-thesis, and market context
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Ai.tech combines a fast-growing digital advertising market with an operating
              portfolio that includes a contextual advertising and sell-side platform asset. IAB reports US internet
              advertising revenue of $258.6 billion in 2024, up 14.9% year over year, and says mid-tier media companies
              gained share; AdTechRadar reports Media.net's integration of Experian audiences and search-intent signals.
              WARC and Magna both show continued digital growth, but their forecasts also differ materially: WARC
              projects $1.17 trillion of global ad spend while Magna projects $979 billion of global advertising revenue
              for 2025, reflecting definitional and forecast uncertainty. The anti-thesis is that market growth accrues
              disproportionately to scaled platforms: WARC says Alphabet, Amazon, and Meta are set to take 55.8% of
              spend excluding China, while independent programmatic comparables show materially different revenue scale
              and valuation outcomes. The public record also lacks Ai.tech's revenue and cash-flow denominator, so the
              USD 1.5 billion mark cannot be tested against ARR, revenue, EBITDA, or free cash flow. The key diligence
              question is not whether advertising grows, but whether Ai.tech captures durable economics after platform
              concentration, privacy changes, and capital-structure claims are accounted for.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, downside triggers, and exit readiness
        blocks:
          - type: paragraph
            body: >-
              The scenarios below are decision ranges, not a forecast or an independently established fair-value range.
              The bull case requires evidence that the portfolio produces scalable, high-margin cash flow and that
              Media.net or other assets can compound within a privacy-compliant open-web market. The base case assumes
              the reported valuation remains a directional private-market reference while operating disclosure stays
              incomplete; that supports tracking, not a purchase decision. The bear case reflects multiple compression,
              commercialization shortfall, concentration, or preference overhang that could leave common equity worth
              materially less than the headline mark. Comparable public-company evidence helps bound the question but is
              not a direct peer set: The Trade Desk reported $2.4 billion of 2024 revenue and 26% growth, while an
              independent 2025 comparison placed Magnite at roughly 3x revenue and PubMatic at roughly 1x revenue. Those
              figures demonstrate the importance of disclosed denominators, not a justified multiple for Ai.tech. Exit
              readiness is therefore conditional: confirm audited accounts, current financing terms, asset ownership,
              debt, preference stack, customer concentration, and a credible liquidity route before underwriting target
              return or hold/exit timing.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV006
              - CV007
              - CV010
              - CV011
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more
            body: >-
              The USD 1.5B valuation is a meaningful reported signal, but public evidence does not establish the
              operating denominator, security terms, or downside protection required for a buy decision.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
          - type: callout
            title: Headline valuation is not a cash-flow multiple
            body: >-
              The assigned pool provides no audited Ai.tech revenue, ARR, EBITDA, free cash flow, debt, or
              preference-stack disclosure, so precise fair value and target return remain unsupported.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV016
          - type: callout
            title: Market growth is necessary but not sufficient
            body: >-
              Digital advertising is expanding, yet WARC's concentration estimate and the differing WARC/Magna forecasts
              show why scale, definitions, and defensibility matter to valuation.
            calloutType: insight
            claimRefs:
              - CV006
              - CV008
              - CV009
