      - CE002
      - CE005
      - CE007
      - CE011
      - CE015
      - CE016
  - id: FU001
    title: Customer journey from supply onboarding to partner expansion
    type: journey-map
    summary: >-
      Public evidence shows a publisher onboarding path and a separate partner-integration path, with retention and
      expansion metrics unreported.
    data:
      nodes:
        - id: segment
          label: Publisher or advertiser identifies a monetization need
          detail: Publishers seek contextual monetization; advertisers seek targeted reach.
          touchpoints:
            - Publisher site
            - Advertiser campaign
        - id: eligibility
          label: Eligibility and policy screening
          detail: Media.net manually reviews submitted publisher sites and may reject low-quality or unsuitable traffic.
          touchpoints:
            - Invite request
            - Policy review
        - id: integration
          label: Ad unit or partner integration
          detail: Publishers add generated code; Symitri is reported as a first third-party integration partner.
          touchpoints:
            - Ad code
            - Data cleanroom
        - id: activation
          label: Campaign or inventory activation
          detail: Contextual and search-intent capabilities connect demand to publisher inventory.
          touchpoints:
            - Contextual ads
            - Yahoo! Bing network
        - id: measurement
          label: Reporting and performance measurement
          detail: Account-level reporting and, for the Symitri integration, campaign measurement are described.
          touchpoints:
            - Site/ad-unit reports
            - Campaign measurement
        - id: expansion
          label: Renewal or expansion
          detail: No public evidence establishes retention, repeat purchase, expansion, or partner scaling.
          touchpoints:
            - Unreported renewal
            - Unreported expansion
    claimRefs:
      - CU002
      - CU003
      - CU005
      - CU006
      - CU016
