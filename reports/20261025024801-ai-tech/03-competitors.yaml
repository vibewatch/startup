company:
  name: Ai.tech
chapter:
  number: 3
  title: Competitors
  summary: Ai.tech competes through a portfolio model in an advertising technology ecosystem where scale, inventory access, data quality, and trusted measurement matter more than an AI label alone. Public evidence supports strong incumbency around The Trade Desk, Magnite, PubMatic, and platform owners, but does not disclose Ai.tech's product-level positioning, pricing, or customer overlap well enough to establish a durable moat.
sections:
  - id: landscape
    title: Competitive landscape and scale anchors
    body: >-
      Ai.tech is described by independent reporting as an AI and machine-learning startup studio and holding company whose portfolio includes Advertising.tech and Media.net. That makes the relevant competitive set broader than a single SaaS peer: the company may face demand-side platforms, supply-side platforms, ad servers, identity and measurement vendors, publisher-owned systems, and the internal teams of large advertisers and media owners. The public record does not establish which of these products Ai.tech sells directly, which it owns through subsidiaries, or whether the portfolio is integrated commercially. The clearest scale anchor is The Trade Desk, which reported $2.445 billion of 2024 revenue, $12 billion of platform spend, and customer retention above 95% for eleven consecutive years. Its self-service cloud platform, integrations with data, inventory, and publisher partners, and enterprise APIs illustrate the breadth of incumbent distribution that a smaller or less disclosed portfolio must overcome. The Trade Desk also presents a direct strategic threat through CTV, retail media, identity, supply-chain optimization, and audio, while its Ventura streaming-TV operating system extends the competitive surface into distribution.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: capability-and-buyer-tradeoffs
    title: Capability, distribution, and buyer trade-offs
    body: >-
      Competitive advantage in programmatic advertising is shaped by access to inventory and buyer demand, workflow integration, measurement credibility, and the ability to operate across channels. A market study identifies Google, Meta, Amazon, Microsoft, Alibaba, Adobe, The Trade Desk, Criteo, NextRoll, and MediaMath among prominent programmatic players, while its segmentation places mobile and tablets at 49.4% of 2023 revenue, video at 41.8%, and retail and consumer goods at 36.3%. These figures are market-level estimates rather than Ai.tech or peer results, but they show why a portfolio must prove reach across mobile, video, CTV, and commerce media rather than rely on a generic AI proposition. The Trade Desk's stated integrations and APIs provide a high-scale benchmark for buyer-side breadth. Magnite and PubMatic illustrate a different trade-off: a specialist can build publisher-side or CTV depth, but distribution and revenue quality still depend on embedded relationships and reported scale. An independent comparison reported Magnite's 2025 revenue of $714.0 million, up 7%, versus PubMatic's $282.9 million, down 3% on a reported basis; it also described Magnite's CTV ad-server position as structurally deeper while noting PubMatic's cleaner balance sheet and early agentic-AI positioning. This is evidence about competitors, not an independent benchmark of Ai.tech.
    claimRefs: [CP005, CP006, CP007, CP008, CP009]
    tableRefs: [TP002]
  - id: durability-and-gaps
    title: Moat durability, substitutes, and unresolved evidence
    body: >-
      The competitive moat is not established by the size of the surrounding advertising market. It depends on durable access to premium supply, identity and consent infrastructure, data and measurement quality, switching costs in publisher or advertiser workflows, and trusted performance under privacy and fraud constraints. Industry research identifies ad fraud, including non-human traffic and low-quality or fraudulent inventory, as a restraint; it also describes privacy regulation as a medium-impact constraint because GDPR, CCPA, COPPA, and related regimes restrict data collection and targeting. It identifies influencer advertising and traditional television, radio, print, and outdoor channels as substitutes, while noting their weaker targeting or optimization in some use cases. WARC reporting adds concentration risk: Alphabet, Amazon, and Meta were expected to capture 55.8% of advertising spend outside China in 2025, with their share forecast to exceed 60% by 2030. Ai.tech's reported $1.5 billion valuation and more than 1,600 employees indicate scale claims, but do not reveal product-level retention, take rates, customer concentration, integration depth, or pricing. The central diligence conclusion is therefore conditional: the portfolio may own valuable ad-tech assets, but public evidence is insufficient to distinguish proprietary distribution from exposure to powerful incumbents and commoditizing infrastructure.
    claimRefs: [CP010, CP011, CP012, CP013, CP014]
    tableRefs: [TP003]
    figureRefs: [FP001]
