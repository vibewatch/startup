    claimRefs: [CP001, CP003, CP007, CP008, CP014]
callouts:
  - calloutType: insight
    title: "The competitive proof point is distribution, not the AI label"
    body: "The strongest public peer evidence points to platform spend, retention, inventory integrations, ad-server embedding, and streamer relationships. Ai.tech's valuation and headcount do not substitute for those product-level proofs."
    claimRefs: [CP002, CP003, CP006, CP008]
  - calloutType: risk
    title: "Public disclosure leaves the moat unverified"
    body: "Ai.tech's assigned sources do not disclose pricing, customer concentration, retention, product-level revenue, take rates, or integration depth. Incumbent concentration and privacy, fraud, and substitution risks therefore remain material."
    claimRefs: [CP010, CP011, CP012, CP014]
  - calloutType: assumption
    title: "Portfolio-level comparison is provisional"
    body: "The analysis treats Advertising.tech and Media.net as reported portfolio assets but does not assume that Ai.tech's holding-company economics equal the economics of any one asset."
    claimRefs: [CP001, CP014]
