      - ["Influencer and traditional media", Substitute channels, "Industry source identifies them as substitutes", "Brands seeking reach or trusted creator context", "Authenticity, reach, or broad awareness", "Less targeting and real-time optimization than programmatic in some use cases"]
    notes: "Sources include company-reported peer metrics, independent comparison, market research, and trade-association reporting; Ai.tech product overlap and private operating metrics are not disclosed."
    claimRefs: [CP001, CP003, CP005, CP007, CP010, CP013]
  - id: TP002
    title: Capability and buying-criteria matrix
    columns: [Buying criterion, Ai.tech evidence, The Trade Desk, Magnite, PubMatic, Implication]
    rows:
      - [Advertiser-side campaign management, "Unknown; portfolio structure is reported but product scope is not", "Self-service cloud platform and enterprise APIs", "Primarily supply-side and CTV ad-server exposure", "Supply-side platform with direct-buying capabilities", "Ai.tech must disclose buyer workflow and ownership to establish direct comparability"]
      - [Publisher and CTV workflow integration, "Unknown", "Publisher and data integrations; Ventura planned with OEM and distribution partners", "Embedded CTV ad-server position", "Partnerships with 28 of the top 30 global streamers are reported", "Embedded workflow relationships may be harder to displace than a feature-level AI advantage"]
      - [Cross-channel reach, "AI/ML portfolio claim; coverage unknown", "Digital formats and devices, including CTV, retail media, identity, and audio", "CTV, mobile app, and open-web display", "CTV, mobile app, and open-web display", "Channel coverage is a material unknown for Ai.tech"]
      - ["Measurement, identity, and privacy posture", "Unknown", "UID2 support and data/inventory integrations are disclosed", "Comparison source discusses exchange and CTV positioning", "Comparison source discusses infrastructure and direct buying", "Trust and compliance evidence is required before treating AI as a moat"]
      - [Pricing and packaging, "Not publicly disclosed in assigned sources", "Not disclosed in assigned sources", "Not disclosed in assigned sources", "Not disclosed in assigned sources", "No defensible price comparison can be made"]
      - [Retention and customer proof, "Not publicly disclosed", ">95% retention for eleven consecutive years", "No comparable retention metric in assigned sources", "No comparable retention metric in assigned sources", "Ai.tech needs customer-level evidence rather than valuation or headcount proxies"]
    notes: "Unknown cells are intentional: the assigned successful prefetched sources do not support a comparable Ai.tech product, price, or customer metric."
    claimRefs: [CP002, CP003, CP006, CP008, CP009, CP014]
  - id: TP003
    title: Competitive durability and displacement risks
    columns: [Factor, Evidence, Competitive reading, Ai.tech diligence implication]
    rows:
      - [Scale and demand concentration, "Alphabet, Amazon, and Meta forecast at 55.8% of ex-China ad spend in 2025", "Large platforms can absorb data, distribution, and advertiser budgets", "Test whether Ai.tech assets have differentiated supply or demand access"]
      - [CTV and publisher lock-in, "Magnite CTV ad-server relationships are described as deeply integrated; PubMatic has 28 of top 30 streamer partnerships", "Workflow integration can create switching costs beyond feature parity", "Obtain contract tenure, renewal, integration, and concentration data"]
      - [AI differentiation, "PubMatic's agentic-AI narrative is contrasted with declining reported revenue", "AI positioning alone does not prove monetization or durability", "Separate deployed revenue-generating AI from roadmap language"]
      - [Fraud and measurement, "Industry research identifies non-human traffic and fraudulent inventory as restraints", "Trust, verification, and quality controls are part of the product", "Request fraud rates, verification coverage, and outcome evidence"]
      - [Privacy and regulation, "GDPR, CCPA, COPPA, and related regimes constrain data use", "Consent and first-party-data capability can become a buying criterion", "Review compliance controls, data provenance, and jurisdictional exposure"]
      - [Substitution, "Influencer, TV, radio, print, and outdoor are identified as substitutes", "Budgets can move outside programmatic when reach or trust is preferred", "Measure win/loss reasons and budget displacement"]
    notes: "This is a qualitative comparison of disclosed risks and relationships; it does not score competitors or imply that Ai.tech has failed any control."
    claimRefs: [CP010, CP011, CP012, CP013]
