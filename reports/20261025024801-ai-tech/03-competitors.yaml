      - [PubMatic, Sell-side platform, "$282.9M 2025 revenue; 3% reported decline", "Publishers, buyers, and omnichannel video", "Owned infrastructure, direct buying, and early agentic-AI positioning", "Reported revenue decline and early AI monetization make durability uncertain"]
      - ["Alphabet, Meta, and Amazon", Platform owners and major ad ecosystems, "55.8% of ad spend outside China forecast for 2025", "Advertisers using scaled owned ecosystems", "First-party data, distribution, and large demand pools", "Concentration creates access and dependency risk for independent ad-tech"]
