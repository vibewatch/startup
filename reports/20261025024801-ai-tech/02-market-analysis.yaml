callouts:
  - calloutType: strength
    title: Large and growing spend pool
    body: U.S. internet advertising reached $258.6 billion in 2024 and WARC forecasts $1.17 trillion of global advertising spend in 2025, supporting a meaningful category tailwind.
    claimRefs: [CM005, CM006]
  - calloutType: risk
    title: Closed-platform concentration
    body: More than half of advertising spend outside China is forecast to accrue to Alphabet, Amazon and Meta, which constrains the independently reachable market for ad-tech intermediaries.
    claimRefs: [CM008, CM015]
  - calloutType: assumption
    title: Company-specific sizing remains open
    body: Ai.tech's valuation and portfolio descriptions do not disclose the revenue base, take rate, retention, or reachable inventory needed to calculate a defensible SAM or SOM.
    claimRefs: [CM009, CM017]
