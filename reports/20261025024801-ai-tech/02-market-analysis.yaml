company:
  name: Ai.tech
chapter:
  number: 2
  title: Market Analysis
  summary: Ai.tech participates in a large, growing digital advertising ecosystem, but the addressable opportunity is fragmented across social, search, retail media, video, and open-web infrastructure. The evidence supports a broad market tailwind and identifiable privacy/AI adoption drivers, while the company's serviceable share, buyer economics, and asset-level exposure remain unverified.
sections:
  - id: market-boundary
    title: Market boundary and spend pools
    body: >-
      Ai.tech describes itself as an AI and machine-learning startup studio and holding
      company, while public reporting identifies Advertising.tech and Media.net as portfolio
      assets. The relevant market is therefore not “AI” in the abstract: it is the monetization
      and infrastructure layer around digital advertising, including demand generation,
      programmatic buying and selling, contextual or privacy-preserving targeting, retail
      media, video and CTV, and the software that connects buyers with publisher inventory.
      The boundary excludes general enterprise AI spend, non-advertising machine-learning
      applications, and the full gross merchandise value of media businesses. Status-quo
      substitutes include direct platform buying on Meta, Alphabet and Amazon, internal
      publisher sales teams, agency-managed insertion orders, and first-party retail-media
      networks. That distinction matters because the largest spend pools are increasingly
      controlled by closed platforms rather than independent ad-tech intermediaries.
    claimRefs: [CM001, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and concentration
    body: >-
      Available estimates describe different populations and should not be collapsed into a
      single TAM. IAB reports U.S. internet advertising revenue of $258.6 billion in 2024,
      including $62.1 billion of digital video, $74.3 billion of display, and $53.7 billion
      of retail media. WARC provides a wider global lens: $1.17 trillion of advertising spend
      in 2025, with 55.8% outside China attributed to Alphabet, Amazon and Meta. The Trade
      Desk's reported 2024 revenue and platform spend illustrate the scale of one independent
      demand-side benchmark, not Ai.tech's revenue opportunity. These lenses imply a large
      top-down market, but they do not establish Ai.tech's SAM or SOM: the company does not
      publicly disclose asset-level revenue, take rate, customer concentration, or the share
      of inventory it can reach. A defensible sizing model should therefore separate total
      advertising spend from addressable programmatic and contextual-advertising software
      revenue, then haircut for closed-platform concentration and reachable geographies.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-segmentation
    title: Buyers, users, payers, and adoption paths
    body: >-
      The buyer map is multi-sided. Brands and agencies are the economic buyers of audience
      reach and measurable outcomes; traders, planners, and marketing operations teams are
      the daily users; publishers and streaming platforms are supply-side customers seeking
      yield, fill, and compliant monetization; and retail-media operators own first-party
      data and budget allocation. The IAB identifies first-party data, contextual targeting,
      consent tools, streaming CTV, retail media, and self-serve platforms as active
      industry directions. The Trade Desk's disclosure of $12 billion of 2024 platform spend
      demonstrates that scaled buyers value an operating layer, while WARC's concentration
      data shows that many buyers can instead place budgets directly into closed platforms.
      Ai.tech's public site invites enterprises exploring AI at scale and builders founding
      companies, but it does not disclose which advertising buyer segment pays, what workflow
      is replaced, or how portfolio assets share distribution. Those omissions make adoption
      triggers plausible but not yet measurable.
    claimRefs: [CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Growth drivers, constraints, and diligence implications
    body: >-
      Growth drivers are visible but conditional. Digital advertising is expanding, video and
      retail media are growing faster than the overall U.S. internet market in IAB's 2024
      data, and WARC expects most incremental global dollars to flow to online-only platforms.
      AI can automate campaign operations and enable contextual or agentic workflows, but IAB
      explicitly notes data readiness, tool fragmentation, compliance, and continued need for
      human creativity. Privacy regulation and browser changes increase the value of
      consent-based and first-party approaches while raising implementation cost. The main
      constraint is platform concentration: WARC says the three largest owners already take
      more than half of advertising spend outside China, and a public benchmark from The
      Trade Desk shows the scale required to compete. Ai.tech's claimed $1.5 billion
      valuation and bootstrapped status are market-position signals, not proof of recurring
      advertising revenue or attainable market share. The key valuation diligence is to obtain
      asset-level revenue, gross versus net reporting, customer retention, take rates,
      geographic exposure, and evidence that AI products improve advertiser or publisher ROI.
    claimRefs: [CM014, CM015, CM016, CM017]
  - id: exhibits
    title: Exhibits
    body: >-
      The exhibits preserve the distinction between observed market measurements, company
      descriptions, and directional analyst forecasts. The market-definition table identifies
      which spend pools belong in the boundary; the sizing table keeps geography, period,
      denominator, and methodology visible; and the segment map distinguishes buyer, user,
      payer, workflow, and trigger. The pyramid is a presentation of nested sizing lenses in
      authored order rather than a claim that the layers are directly convertible. Because
      Ai.tech's public materials do not disclose a company-specific SAM or SOM, the final
      layer is explicitly marked as unavailable and carried as a diligence gap rather than a
      guessed percentage.
    claimRefs: [CM005, CM008, CM013, CM017]
    tableRefs: []
    figureRefs: []
tables:
  - id: TM001
    title: Market definition and substitutes
    columns: [Segment/category, Included spend or activity, Excluded spend, Buyer/payer, Relevance]
    rows:
      - ["Digital advertising infrastructure", "Programmatic buying/selling", "General enterprise AI software", "Brands/agencies and publishers", "Core adjacency for Media.net and Advertising.tech"]
      - ["Digital video and CTV", "Video inventory monetization and campaign execution", "Linear TV without digital activation", "Brands/agencies and streaming platforms", "High-growth format with fragmented supply"]
      - ["Retail media", "Sponsored placements and first-party audience activation", "General ecommerce GMV", "Retailers/brands", "Privacy-resilient budget pool"]
      - ["Contextual and privacy-preserving targeting", "Consent-based, contextual and first-party activation", "Unconsented user-level tracking", "Brands/agencies and publishers", "Adoption driver under signal loss"]
      - ["Closed-platform buying", "Direct spend on Meta, Alphabet and Amazon properties", "Independent open-web intermediary revenue", "Brands/agencies; platforms retain budget", "Substitute that limits reachable SAM"]
    notes: Market categories overlap in practice; rows are analytical boundaries, not additive totals. Sources describe different populations and do not support summing these rows.
    claimRefs: [CM001, CM003, CM004, CM015]
  - id: TM002
    title: Sizing lenses and limitations
    columns: [Publisher, Year/period, Geography, Value, Growth or share, Methodology, Confidence, Limitation]
    rows:
      - [IAB/PwC Internet Advertising Revenue Report, 2024, United States, "$258.6B internet advertising revenue", "14.9% YoY", Industry revenue report, High, Not a global or Ai.tech-specific SAM]
      - [IAB/PwC category data, 2024, United States, "$62.1B digital video; $74.3B display; $53.7B retail media", "19.2%; 12.4%; 23.0% YoY respectively", "Category aggregation", High, "Categories overlap with broader platform definitions"]
      - [WARC global advertising forecast, 2025 forecast, Global, "$1.17T advertising spend", "7.4% growth forecast", 100 markets and proprietary neural network using over two million data points, Medium, Forecast and includes closed platforms]
      - [WARC concentration lens, 2025, Global excluding China, "55.8% share for Alphabet, Amazon and Meta", "60%+ projected by 2030", Aggregated market-share forecast, Medium, Concentration reduces independent-ad-tech serviceable share]
      - [The Trade Desk FY2024 results, Year ended 2024-12-31, Global platform, "$12B platform spend; $2.445B revenue", "26% revenue growth", Company-reported operating metrics, High, Competitor benchmark not Ai.tech performance]
      - ["Ai.tech public/company reporting", 2025, "Not disclosed", "$1.5B valuation", "Reached in three years", "Company and press reporting", Medium, "Valuation is not revenue, ARR, or market share"]
    notes: Values retain their original denominators and periods. The table mixes U.S. revenue, global spend, platform spend, and company valuation as separate sizing lenses; no conversion or aggregation is implied.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment, buyer, payer, and adoption map
    columns: [Segment, Buyer, User, Payer, Workflow, Adoption trigger]
    rows:
      - ["Brands and agencies", "Marketing/procurement", "Traders and planners", "Brand marketing budget", "Plan, buy, measure", "First-party or contextual reach with measurable ROI"]
      - [Publishers and streaming platforms, Revenue or yield leadership, Ad-operations teams, Publisher monetization budget, Package and monetize inventory, CTV growth and demand fragmentation]
      - [Retail media networks, Retail media leadership, Media-network operators, Retailer/brand trade budgets, Activate first-party audiences and report outcomes, Closed-loop measurement and high-intent data]
      - ["Ad-tech platforms", "Product and revenue leadership", "Engineers and operations", "Platform operating budget", "Connect demand, supply, identity and measurement", "Automation, interoperability and lower manual operations"]
      - ["Enterprise AI adopters", "Digital or innovation leadership", "Builders and technical teams", "Enterprise transformation budget", "Build or deploy AI-enabled workflows", "AI readiness and workflow replacement"]
    notes: The map is an evidence-constrained operating hypothesis. Ai.tech's public site confirms enterprise and builder outreach but does not identify a paying segment or quantify adoption.
    claimRefs: [CM010, CM011, CM012, CM013]
