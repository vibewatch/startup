  evidenceGaps:
    - type: missing-source
      severity: material
      topic: sizing-gap
      missingEvidence: Asset-level revenue, gross-versus-net reporting, take rates, retention, reachable inventory, and geographic exposure for Media.net, Advertising.tech, and the Ai.tech holding company.
      whyItMatters: Broad advertising-spend estimates cannot establish Ai.tech's serviceable market, attainable share, or valuation support.
      diligencePath: Request consolidated and asset-level management accounts, cohort metrics, customer concentration, inventory access, and a bridge from market categories to current revenue.
      relatedQuestionRefs: [QM004, QM010]
      relatedTableRefs: [TM002]
    - type: conflicting-data
      severity: material
      topic: sizing
      missingEvidence: A reconciled market taxonomy linking U.S. internet-ad revenue, global advertising spend, programmatic infrastructure, and closed-platform spend.
      whyItMatters: The available estimates use different geographies, periods, denominators, and category definitions and should not be added together.
      diligencePath: Obtain source methodologies and build a non-overlapping geography-and-channel bridge before using a single TAM in valuation.
      relatedQuestionRefs: [QM003]
      relatedTableRefs: [TM001, TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-segmentation
      missingEvidence: Customer-level proof of which buyer segment pays for Ai.tech products and which workflow or budget line is displaced.
      whyItMatters: Public materials establish a broad enterprise and builder proposition but not repeatable demand or budget ownership.
      diligencePath: Request anonymized customer cohorts, contract types, renewal and expansion data, buyer titles, and measured ROI by asset.
      relatedQuestionRefs: [QM005, QM006]
      relatedTableRefs: [TM003]
