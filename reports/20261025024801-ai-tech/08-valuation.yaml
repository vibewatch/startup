      - [Entry discipline, "Price-sensitive", "Require cap-table preferences, dilution, debt, and a downside case before entry."]
    notes: "Public reporting provides a valuation reference but not audited operating denominators or transaction terms; null or missing financial inputs are treated as unresolved evidence gaps."
    claimRefs: [CV001, CV003, CV004, CV005]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - [Large addressable market, "IAB reports $258.6B US internet ad revenue in 2024, up 14.9% YoY.", "Evidence that Ai.tech captures durable share and economics rather than only market growth."]
      - [Portfolio product proof, "Media.net added Experian audience data and search-intent signals to its SSP.", "Independent performance, retention, take-rate, and margin data for the asset."]
      - [Fast private-market signal, "Hurun/ASK reports Ai.tech at a USD 1.5B valuation in under three years.", "A priced round, cap-table mark, or third-party valuation methodology with terms."]
      - [Platform concentration risk, "WARC projects Alphabet, Amazon, and Meta at 55.8% of ad spend excluding China.", "Evidence of defensible differentiation, distribution, and bargaining power."]
      - [Denominator risk, "The assigned sources do not disclose Ai.tech revenue, ARR, EBITDA, or free cash flow.", "Audited consolidated and asset-level statements with reconciled definitions."]
    notes: "This table separates company/market signals from the missing denominators needed to test a private valuation; market forecasts are not Ai.tech operating results."
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation / return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Portfolio assets show sustained growth, strong margins, and privacy-compliant demand; ownership and terms are clean.", "A USD 1.5B reference could be supportable or exceeded if audited cash generation validates a scalable multiple.", "Low-to-medium; dependent on private evidence not in the pool.", "Growth or margins fail to persist, or the mark depends on a non-comparable headline."]
      - [Base, "Market grows, but Ai.tech financial disclosure and transaction terms remain incomplete.", "No reliable target return or fair-value range; track until denominators and price are verified.", "Highest given current public evidence.", "No timely access to audited accounts, cap table, or asset-level economics."]
      - [Bear, "Platform concentration, privacy/commercialization friction, or preference/dilution overhang reduces common-equity value.", "Material markdown from the reported USD 1.5B reference is plausible; do not infer a precise downside price.", "Material; evidence gap rather than a quantified forecast.", "Down round, weak cash generation, customer concentration, or adverse terms."]
      - [Decision gate, "Entry only after financial, legal, ownership, and liquidity diligence.", "Underwrite target return from verified cash flows and security terms, not the unicorn label.", "Required before investment.", "Any unresolved preference, debt, or ownership issue blocks a buy call."]
    notes: "Scenarios are qualitative underwriting cases, not probability-weighted valuations; the assigned evidence does not support precise ranges, return targets, or probabilities."
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
