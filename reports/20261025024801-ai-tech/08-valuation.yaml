callouts:
  - calloutType: recommendation
    title: Research-more
    body: The USD 1.5B valuation is a meaningful reported signal, but public evidence does not establish the operating denominator, security terms, or downside protection required for a buy decision.
    claimRefs: [CV001, CV003, CV004, CV005]
  - calloutType: risk
    title: Headline valuation is not a cash-flow multiple
    body: The assigned pool provides no audited Ai.tech revenue, ARR, EBITDA, free cash flow, debt, or preference-stack disclosure, so precise fair value and target return remain unsupported.
    claimRefs: [CV010, CV011, CV016]
  - calloutType: insight
    title: Market growth is necessary but not sufficient
    body: Digital advertising is expanding, yet WARC's concentration estimate and the differing WARC/Magna forecasts show why scale, definitions, and defensibility matter to valuation.
    claimRefs: [CV006, CV008, CV009]
