callouts:
  - calloutType: recommendation
    title: Diligence Asks and Key Thesis-Break Monitoring Triggers
    body: >-
      Institutional investors evaluating secondary share transactions or prospective follow-on financing must prioritize three critical diligence verifications before upgrading Plata from Track to Buy. First, request non-public vintage-level static pool loss data and net charge-off tables covering originations from 2024 through 2026 to verify that proprietary AI risk algorithms maintain default resilience under sustained macroeconomic inflation. Second, audit the retail deposit mobilization velocity of Banco Plata to confirm that low-cost consumer savings accounts are actively substituting high-cost wholesale warehouse lines. Third, monitor the final resolution of the CNBV Circular review regarding Tarjeta Plata's promotional fee mechanics to ensure that regulatory compliance adjustments do not trigger significant non-interest fee revenue contraction or customer attrition.
    claimRefs:
      - CV005
      - CV007
      - CV009
      - CV010
      - CV011
      - CV012
