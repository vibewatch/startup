        - Defer primary equity allocation until credit vintage loss stability and deposit funding traction are audited
      - - Risk Rating
        - High
        - Over 750,000 first-time unbanked borrowers, CNBV fee transparency review, and $800M loan book exposure
        - Requires close monitoring of regulatory sanction exposure and macro-driven consumer delinquency trends
      - - Confidence
        - Medium
        - Extensive disclosed round structure and institutional investor syndication, but opaque unit-level financials
        - Underwriting model requires secondary diligence verification on net charge-offs and unit contribution margins
      - - Valuation Stance
        - Stretched
        - $5.0B post-money valuation at 8.3x annualized revenue multiple represents a rich premium over mature peers
        - Demands flawless operational execution and rapid substitution of wholesale debt with retail deposits
    notes: Evaluation reflects Series C capitalization closed in April 2026 and published regulatory disclosures through October 2026.
