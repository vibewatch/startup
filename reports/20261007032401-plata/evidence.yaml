evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founding chronology
    missingEvidence: A primary corporate or registry document establishing the legal formation date and first commercial launch date.
    whyItMatters: The assigned independent profiles conflict between 2022 and 2023, preventing a single verified founding date.
    diligencePath: >-
      Request incorporation documents and dated launch records from the company, then reconcile them to Mexican registry
      filings.
    relatedQuestionRefs:
      - QO002
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, executive responsibility map, beneficial ownership, investor voting rights, and succession
      plan.
    whyItMatters: >-
      Without governance documents, board independence, founder control, and key-person concentration cannot be
      assessed.
    diligencePath: Request the cap table, shareholder agreement, board minutes, executive biographies, and succession materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: stakeholder rights
    missingEvidence: Ownership percentages, liquidation preferences, board rights, and complete private-credit facility terms.
    whyItMatters: Disclosed participant names do not reveal control, dilution, debt cost, covenant pressure, or available liquidity.
    diligencePath: Obtain financing agreements, the fully diluted cap table, investor-rights schedules, and facility draw statements.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: cover metrics
    missingEvidence: >-
      Verified total headcount, audited revenue and profitability, cash burn, customer activity definition, and segment
      economics.
    whyItMatters: >-
      Company-reported scale cannot be converted into operating efficiency, runway, or customer economics without
      denominators and audited periods.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, payroll totals, cohort definitions, and
      product-level unit economics.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse attribution
    missingEvidence: >-
      A primary CNBV notice, docket, complaint record, or reputable independent report that clearly identifies Banco
      Plata as the subject.
    whyItMatters: >-
      The allocated adverse pages disclaim certainty about the issuer, so they do not establish a Banco Plata regulatory
      incident.
    diligencePath: Search CNBV and CONDUSEF records and request the company's complaint and regulatory-correspondence logs.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
