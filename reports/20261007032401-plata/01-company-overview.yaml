company:
  name: "Plata"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Plata operates Banco Plata in Mexico and closed a $405 million Series C at a $5 billion valuation in April 2026. The strongest current scale figures—more than 3.5 million active credit-card customers and over $600 million of annualized revenue—remain company-reported, while total headcount, board composition, ownership rights, and an alleged consumer-transparency controversy are not independently resolved by the assigned evidence."
sections:
  - id: "identity-and-operating-status"
    title: "Identity, footprint, and operating status"
    body: >-
      Plata is a Mexico-focused digital financial institution that operates Banco Plata, a
      fully regulated bank in Mexico. Independent company profiles place its headquarters in
      Mexico City, but disagree on whether the business was founded in 2022 or 2023; the
      evidence therefore supports a 2022-2023 formation and launch window rather than a single
      definitive founding date. Its disclosed product progression runs from consumer credit
      and cards into deposit and debit services after full banking operations launched in
      March 2026. Public materials describe lending and payment products, but do not disclose
      a segment-level revenue model, audited profitability, or economics by product. The
      snapshot consequently separates priced-round facts from management scale claims and
      leaves unsupported cover metrics null.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO013"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Neri Tollardo is consistently identified as co-founder and chief executive. The broader
      founding record is less settled: one independent profile names Tollardo and Danil
      Anisimov as co-founders, while separate transaction coverage says Plata was founded in
      2023 by Oleg Tinkov and partners. These sources establish a founding group but not a
      complete allocation of operating responsibility or ownership. None of the assigned
      evidence provides a current board roster, voting rights, beneficial-ownership chain, or
      succession plan. That disclosure gap makes key-person dependence difficult to quantify
      and prevents an exhaustive governance assessment. The company says more than 800 STEM
      professionals built its technology, but that functional-team figure is not a substitute
      for a verified total headcount.
    claimRefs:
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO012"
    tableRefs:
      - "TO002"
  - id: "capital-and-stakeholders"
    title: "Capital history and stakeholder structure"
    body: >-
      The April 2026 Series C is the clearest current capitalization marker: $405 million of
      equity at a $5 billion valuation, led by Bicycle Capital and joined by QIA, BTG Pactual,
      Valor Capital Group, existing investors, and other institutions. Trade reporting places
      the prior Series A at $160 million and a $1.5 billion valuation in March 2025, followed
      by a $250 million Series B and $3.1 billion valuation in October 2025. Company and
      investor materials state that total debt and equity raised exceeded $2 billion; this is
      not an equity-only funding total or cash-available measure. June reporting describes
      $300 million from Oaktree and Macquarie as contributing to a $500 million facility
      structured by Nomura, so adding both amounts would risk double counting. Ownership
      percentages, liquidation preferences, board rights, and facility terms remain private.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO015"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "scale-and-adverse-readthrough"
    title: "Scale evidence and adverse read-through"
    body: >-
      Plata reported more than 3.5 million active credit-card customers in April 2026,
      including over 750,000 people receiving a first credit card, and reported annualized
      revenue above $600 million. Annualized revenue is neither ARR nor audited revenue, and
      the pool contains no audited income statement, cash-burn figure, customer-retention
      series, or verified total workforce count. Two low-reputation web publications alleged
      fee-transparency complaints and regulatory scrutiny involving a product called Tarjeta
      Plata, yet both also said the issuing institution or bank had not been publicly
      confirmed. No primary CNBV notice or clearly attributable independent report appears in
      the assigned pool. The allegation is therefore an unresolved adverse diligence lead,
      not evidence that Banco Plata suffered a recorded regulatory incident.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO016"
