callouts:
  - calloutType: "insight"
    title: "Do not add disclosed financing figures mechanically"
    body: "The company-reported total of more than $2 billion combines debt and equity. Separate June coverage links $300 million from Oaktree and Macquarie to a $500 million Nomura-structured facility, so treating both as additive would overstate capital."
    claimRefs:
      - "CO009"
      - "CO015"
  - calloutType: "risk"
    title: "Adverse allegation is not attributable on current evidence"
    body: "The allocated adverse pages allege complaints concerning a product called Tarjeta Plata, but also say its issuer was not publicly confirmed. Without a primary regulator notice, the allegation should remain an open diligence lead rather than a Banco Plata incident."
    claimRefs:
      - "CO016"
