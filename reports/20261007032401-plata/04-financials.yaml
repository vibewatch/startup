callouts:
  - calloutType: "risk"
    title: "Credit Loss Provisioning and Wholesale Debt Dependency Threaten Underwriting Margins"
    body: "Banco Plata's extraordinary growth velocity masks two fundamental financial vulnerabilities: an annualized cost of risk reaching 23.9% in 1Q26 alongside a 4.8% Stage 3 impaired loan ratio, and an overwhelming reliance on wholesale credit facilities reflected in a 933.5% loan-to-deposit ratio. Until retail deposit accumulation significantly lowers funding expenses and loan seasoning confirms asset-quality stability, institutional underwriting must discount headline revenue run-rates."
