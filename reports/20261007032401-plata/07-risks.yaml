figures:
  - id: "FR001"
    title: "Evidence-calibrated risk heatmap"
    type: "matrix"
    summary: "Likelihood, impact, and mitigation maturity are shown separately so missing evidence is not converted into false precision."
    data:
      columns:
        - label: "Likelihood signal"
          detail: "Observed, elevated, or unknown based on retained evidence rather than a numeric probability."
        - label: "Potential impact"
          detail: "Conditional effect on capital, authorization, liquidity, or service continuity."
        - label: "Mitigation maturity"
          detail: "Only controls or resources evidenced in the assigned pool are credited."
      rows:
        - label: "Credit deterioration"
          note: "Provision expense is visible, but vintage loss performance is not."
          values:
            - label: "Elevated signal"
              tone: "risk"
            - label: "High"
              tone: "risk"
            - label: "Unverified"
              tone: "neutral"
        - label: "Operating cash demand"
          note: "Net operating cash flow is not labeled as burn or runway."
          values:
            - label: "Observed in 9M 2025"
              tone: "risk"
            - label: "High if persistent"
              tone: "risk"
            - label: "External capital available"
              tone: "warning"
        - label: "Wholesale funding rollover"
          note: "Facility terms and maturity ladder are unavailable."
          values:
            - label: "Material dependency"
              tone: "warning"
            - label: "High"
              tone: "risk"
            - label: "Provider diversity claimed"
              tone: "warning"
        - label: "Consumer-transparency action"
          note: "The alleged CNBV review lacks a retained primary record."
          values:
            - label: "Unknown"
              tone: "neutral"
            - label: "High if confirmed"
              tone: "risk"
            - label: "No remediation evidence"
              tone: "neutral"
        - label: "Bank-operation transition"
          note: "Launch is reported by independent transaction intelligence, not a regulator record."
          values:
            - label: "Transition reported"
              tone: "warning"
            - label: "High"
              tone: "risk"
            - label: "Board signal only"
              tone: "warning"
        - label: "Cyber and service resilience"
          note: "No incident history or control assurance is retained."
          values:
            - label: "Unknown"
              tone: "neutral"
            - label: "High"
              tone: "risk"
            - label: "Unknown"
              tone: "neutral"
    approximationNotes: "Qualitative categories preserve disclosed uncertainty; no event probability or loss amount is estimated."
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR008"
      - "CR011"
      - "CR012"
      - "CR015"

callouts:
  - calloutType: "risk"
    title: "Do not underwrite an unverified enforcement narrative"
    body: >-
      The fee-transparency allegation is relevant enough to investigate but too weak to
      treat as a confirmed CNBV action. The investment case should use a primary
      regulator record, company correspondence, and complaint data before assigning a
      probability or penalty amount.
    claimRefs:
      - "CR012"
  - calloutType: "recommendation"
    title: "Make credit and funding evidence the gating diligence package"
    body: >-
      Require portfolio vintages, charge-offs, recoveries, fraud losses, facility terms,
      deposit mix, and a monthly liquidity bridge before treating rapid asset growth or
      financing announcements as evidence of durable, internally funded economics.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR005"
      - "CR006"
      - "CR008"
      - "CR009"

