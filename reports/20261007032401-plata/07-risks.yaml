schemaVersion: "report-v2"
artifact: "risks"
slug: "plata"
runDate: "2026-10-07"
company:
  name: "Plata"
chapter:
  number: 7
  title: "Risks"
  summary: "Plata's clearest evidenced risks are credit-cost absorption, negative operating cash flow, and continued dependence on external funding while its loan book scales. A claimed consumer-transparency review appears only in low-reputation secondary articles and should be treated as an unverified diligence lead, not a confirmed enforcement action."
sections:
  - id: "risk-ranking"
    title: "Risk ranking and evidence standard"
    body: >-
      The highest-evidence risks are financial rather than legal: Banco Plata reported a
      MXN 1,246 million net loss and MXN 5,307 million of net operating cash outflow for
      the first nine months of 2025, while loan-loss provisions reached MXN 1,492 million.
      Those figures do not establish future default rates or cash runway, but they show
      that growth still consumes capital and absorbs a material amount of pre-provision
      income. Regulatory severity is potentially high, yet likelihood remains unscored
      because the assigned pool contains no primary CNBV or CONDUSEF record confirming
      the alleged fee-transparency review. The heatmap therefore separates observed
      financial signals from unverified event allegations and unknown control maturity.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR012"
    figureRefs:
      - "FR001"

  - id: "regulatory-legal"
    title: "Regulatory, legal, and governance exposure"
    body: >-
      Plata's transition into regulated-bank operations is supported by a sequence of
      public claims rather than a regulator document in this pool: a December 2025
      company-syndicated release said bank operations had not yet started, while M&A
      Insights reported a March 2026 launch. Two low-reputation websites separately
      allege an April 2026 CNBV review of Tarjeta Plata fee disclosures, but neither is a
      substitute for the underlying regulator statement and both use questionable
      descriptions of the issuer. The allegation should trigger direct record checks,
      not a conclusion that enforcement exists. Renascence's report of adding a former
      regulator and former ambassador to the board is a governance signal, but it does
      not evidence remediation, compliance testing, or reduced residual exposure.
    claimRefs:
      - "CR011"
      - "CR012"
      - "CR015"
    tableRefs:
      - "TR001"

  - id: "credit-operational"
    title: "Credit, profitability, and operating execution"
    body: >-
      The September 2025 company release shows a fast-expanding balance sheet: net loans
      reached MXN 8,205 million, up 122% year to date, and personal loans increased from
      3.6% to 6.5% of the portfolio. Scale alone does not prove underwriting quality.
      Public evidence in the assigned pool does not provide vintage curves, delinquency,
      charge-offs, fraud losses, recoveries, or risk-adjusted unit economics. Funding
      growth with MXN 3,586 million of equity injections and MXN 3,854 million of bond
      issuance and other borrowings during the period reduces immediate liquidity
      pressure but does not demonstrate self-funding economics. Operational resilience
      is also an open diligence item because no assigned source provides uptime,
      incident, recovery, or security-control evidence.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
    tableRefs:
      - "TR002"

  - id: "dependencies-kill-criteria"
    title: "Funding dependencies and thesis-break criteria"
    body: >-
      Plata's capital access is a strength and a dependency. A company-issued release
      describes a Nomura-arranged facility of up to US$500 million and more than US$1.6
      billion of cumulative institutional financing; these amounts are financing raised,
      not cash available. Independent market-data sources report a US$405 million Series
      C at a US$5 billion valuation, while Multiples labels US$600 million as revenue but
      warns that recorded figures may be run-rate or LTM. The investment thesis should
      break if verified credit losses outrun pricing and provisions, material funding
      facilities cannot renew on economic terms, regulatory records confirm unresolved
      disclosure violations, or operating cash outflow persists without a credible path
      to internally funded growth. Facility terms, maturities, covenants, collateral,
      deposit mix, and current capital ratios remain required diligence.
    claimRefs:
      - "CR003"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR016"
    tableRefs:
      - "TR003"

