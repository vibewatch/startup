callouts:
  - calloutType: "risk"
    title: "Regulatory Scrutiny on Promotional Credit Fee Transparency"
    body: "Adverse reporting from financial press and consumer forums indicates that Tarjeta Plata has faced criticism regarding promotional 'months without interest' terms, where customers reported unexpected interest accruals and fee triggers following minor payment timing discrepancies. Mexico's CNBV confirmed an ongoing review under the 2025 Circular on Credit Product Transparency. If violations are substantiated under Article 87 of Mexico's Credit Institutions Law, potential penalties could reach up to 10% of gross product revenue, posing reputational and financial risks to customer acquisition."
    claimRefs:
      - "CU013"
      - "CU014"
  - calloutType: "strength"
    title: "Organic Referral Efficiency and Open Finance Automation"
    body: "Banco Plata demonstrates substantial customer acquisition leverage with over 40% of its 3.5+ million cardholders acquired organically through referrals, dramatically lowering blended acquisition costs. Concurrently, integrating Belvo's Open Finance infrastructure connects automated employment data verification directly with bank direct debit collection rails, streamlining onboarding and fortifying payment predictability across underbanked customer demographics."
    claimRefs:
      - "CU001"
      - "CU009"
      - "CU010"
