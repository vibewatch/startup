  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        A primary, current denominator for Mexican adults eligible for formal credit,
        outstanding revolving and installment balances, annual purchase volume, and
        risk-adjusted category revenue.
      whyItMatters: >-
        Without those denominators, customer counts cannot be converted into defensible TAM,
        SAM, SOM, penetration, or revenue-pool estimates.
      diligencePath: >-
        Obtain current INEGI, Banco de México, CNBV, and industry-association datasets, then
        reconcile population, account, card, receivable, and transaction definitions.
      relatedQuestionRefs: [QM002, QM009]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: segment-economics
      missingEvidence: >-
        Approval rates, credit limits, balances, loss rates, acquisition cost, reward funding,
        interchange allocation, and contribution margin by customer segment.
      whyItMatters: >-
        These metrics determine whether documented adoption creates attractive risk-adjusted
        economics and which buyer segments support valuation.
      diligencePath: >-
        Request management cohort data and reconcile it to audited financials, warehouse
        reports, and board-approved risk policies.
      relatedQuestionRefs: [QM003, QM005, QM009]
      relatedTableRefs: [TM001, TM003]
