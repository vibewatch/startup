  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and evidence standard
        blocks:
          - type: paragraph
            body: >-
              The highest-evidence risks are financial rather than legal: Banco Plata reported a MXN 1,246 million net
              loss and MXN 5,307 million of net operating cash outflow for the first nine months of 2025, while
              loan-loss provisions reached MXN 1,492 million. Those figures do not establish future default rates or
              cash runway, but they show that growth still consumes capital and absorbs a material amount of
              pre-provision income. Regulatory severity is potentially high, yet likelihood remains unscored because the
              assigned pool contains no primary CNBV or CONDUSEF record confirming the alleged fee-transparency review.
              The heatmap therefore separates observed financial signals from unverified event allegations and unknown
              control maturity.
