      - number: '5.3'
        title: Compliance, Product Transparency, and Operational Risks
        blocks:
          - type: paragraph
            body: >-
              Rapid portfolio expansion to a reported 3.4 million customers and more than $600 million in annualized
              revenue has introduced operational and regulatory friction within Plata's product delivery mechanisms. In
              April 2026, Mexico's National Banking and Securities Commission (CNBV) confirmed an active regulatory
              review of Tarjeta Plata under its Circular on Credit Product Transparency, evaluating consumer complaints
              regarding unclear fee triggers, retroactive promotional cancellations, and interest accrual conditions on
              months-without-interest purchases. Under Article 87 of Mexico's Credit Institutions Law, potential
              sanctions could reach up to 10% of annual gross product income. These transparency challenges highlight
              critical dependencies on algorithmic clarity and user-facing disclosures across Plata's lending software
              stack.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Scrutiny Over Credit Transparency
            body: >-
              The April 2026 CNBV regulatory inquiry into Tarjeta Plata demonstrates that technological agility in
              promotional installment lending cannot substitute for unambiguous, transparent disclosure mechanisms.
              Misaligned software rules governing conditional fee triggers risk substantial regulatory fines and
              customer migration.
            calloutType: risk
            claimRefs:
              - CE012
