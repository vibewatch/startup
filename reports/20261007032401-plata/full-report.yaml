            body: >-
              Banco Plata demonstrates substantial customer acquisition leverage with over 40% of its 3.5+ million
              cardholders acquired organically through referrals, dramatically lowering blended acquisition costs.
              Concurrently, integrating Belvo's Open Finance infrastructure connects automated employment data
              verification directly with bank direct debit collection rails, streamlining onboarding and fortifying
              payment predictability across underbanked customer demographics.
            calloutType: strength
