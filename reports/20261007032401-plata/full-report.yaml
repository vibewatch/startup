      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The end user and payer are usually the same household, while Plata owns underwriting, servicing, and
              product-disclosure responsibilities. First-time cardholders are the clearest documented segment, but the
              product also targets rewards-oriented transactors, consumers smoothing purchases through installments, and
              cash-reliant users moving money into a digital account. Adoption can begin with no annual fee and
              cashback, progress to installment conversion, and deepen through repeated payments and deposits. The
              evidence does not disclose which party funds cashback, merchant economics, acquisition cost, approval
              rates, credit limits by segment, or contribution margin. Those omissions prevent a segment-level budget
              and profitability model even though the workflow and consumer value proposition are visible.
            claimRefs:
