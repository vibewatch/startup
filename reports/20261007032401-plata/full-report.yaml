        blocks:
          - type: paragraph
            body: >-
              Plata is a Mexico-focused digital financial institution that operates Banco Plata, a fully regulated bank
              in Mexico. Independent company profiles place its headquarters in Mexico City, but disagree on whether the
              business was founded in 2022 or 2023; the evidence therefore supports a 2022-2023 formation and launch
