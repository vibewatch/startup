      - number: '7.4'
        title: Funding dependencies and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              Plata's capital access is a strength and a dependency. A company-issued release describes a
              Nomura-arranged facility of up to US$500 million and more than US$1.6 billion of cumulative institutional
              financing; these amounts are financing raised, not cash available. Independent market-data sources report
              a US$405 million Series C at a US$5 billion valuation, while Multiples labels US$600 million as revenue
              but warns that recorded figures may be run-rate or LTM. The investment thesis should break if verified
              credit losses outrun pricing and provisions, material funding facilities cannot renew on economic terms,
              regulatory records confirm unresolved disclosure violations, or operating cash outflow persists without a
              credible path to internally funded growth. Facility terms, maturities, covenants, collateral, deposit mix,
              and current capital ratios remain required diligence.
