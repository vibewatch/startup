        title: Scale evidence and adverse read-through
        blocks:
          - type: paragraph
            body: >-
              Plata reported more than 3.5 million active credit-card customers in April 2026, including over 750,000
              people receiving a first credit card, and reported annualized revenue above $600 million. Annualized
              revenue is neither ARR nor audited revenue, and the pool contains no audited income statement, cash-burn
