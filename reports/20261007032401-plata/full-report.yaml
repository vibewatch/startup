  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Plata operates as a licensed digital bank (Banco Plata, S.A., Institución de Banca Múltiple) headquartered
              in Mexico City, delivering consumer financial services entirely through mobile application interfaces. The
              core product offering centers on Tarjeta Plata, a credit card featuring flexible payment arrangements and
              promotional zero-percent interest installments alongside digital account management. Onboarding and
              origination flows are engineered to automate customer verification, KYC identity checks, and credit
              scoring directly within the mobile application. Product design teams maintain Plata Card's design language
              across all lending origination workflows, balancing conversion optimization against rigorous compliance
              mandates. In contrast to unrelated technological initiatives bearing the Plata name—such as environmental
              chemistry processes developed at MIT—Banco Plata focuses strictly on retail financial technology and
              consumer credit delivery.
            claimRefs:
