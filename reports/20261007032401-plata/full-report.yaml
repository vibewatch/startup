              - CV001
              - CV002
              - CV005
              - CV007
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.3'
        title: Scenario Analysis and Comparable Benchmark Dynamics
        blocks:
          - type: paragraph
            body: >-
              To rigorously evaluate the $5.0 billion Series C equity benchmark, scenario modeling establishes three
              distinct forward trajectories across bull, base, and bear operating assumptions over a 24-month investment
              horizon. In the bull case (25% probability), Banco Plata rapidly converts its 3.5 million active credit
              card holders into primary banking depositors, gathering low-cost retail deposits that expand net interest
              margins by over 400 basis points while reducing warehouse borrowing costs. Annualized revenue reaches $1.2
              billion, vintage net loss rates stabilize under proprietary AI credit scoring, international expansion in
              Colombia gains commercial scale, and Plata achieves sustained net profitability, supporting a potential
              $8.0 billion to $10.0 billion valuation (8.0x–10.0x revenue multiple) via a US initial public offering.


              In the base case (50% probability), Plata sustains solid top-line credit card expansion to $850 million in
              revenue, but retail deposit conversion proceeds at a moderate pace, leaving blended cost of funds
              elevated. Credit provisions remain high given the unbanked customer demographic, and regulatory compliance
              adjustments cap aggressive installment fee revenues. Under this trajectory, valuation remains compressed
              near the entry mark at $4.5 billion to $5.5 billion (5.5x–6.5x revenue multiple), reflecting
              holding-period multiple digestion. In the bear case (25% probability), macro inflation exacerbates
              consumer delinquency across Mexico, elevating net charge-offs on the $800 million loan portfolio.
              Simultaneously, adverse findings from the CNBV credit product transparency review result in statutory
              financial penalties, restrictions on promotional installment mechanics, and reputational attrition to
              transparent rivals like Nu Holdings. Under downside stress, revenue growth decelerates toward $650 million
              and valuation contracts sharply to $2.5 billion to $3.5 billion (4.0x–5.0x revenue multiple), triggering
              significant preference overhang and down-round restructuring for common equity holders.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV012
              - CV014
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV014
              - CV015
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence Asks and Key Thesis-Break Monitoring Triggers
            body: >-
              Institutional investors evaluating secondary share transactions or prospective follow-on financing must
              prioritize three critical diligence verifications before upgrading Plata from Track to Buy. First, request
              non-public vintage-level static pool loss data and net charge-off tables covering originations from 2024
              through 2026 to verify that proprietary AI risk algorithms maintain default resilience under sustained
              macroeconomic inflation. Second, audit the retail deposit mobilization velocity of Banco Plata to confirm
              that low-cost consumer savings accounts are actively substituting high-cost wholesale warehouse lines.
              Third, monitor the final resolution of the CNBV Circular review regarding Tarjeta Plata's promotional fee
              mechanics to ensure that regulatory compliance adjustments do not trigger significant non-interest fee
              revenue contraction or customer attrition.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
