            title: Regulatory Scrutiny on Promotional Credit Fee Transparency
            body: >-
              Adverse reporting from financial press and consumer forums indicates that Tarjeta Plata has faced
              criticism regarding promotional 'months without interest' terms, where customers reported unexpected
              interest accruals and fee triggers following minor payment timing discrepancies. Mexico's CNBV confirmed
              an ongoing review under the 2025 Circular on Credit Product Transparency. If violations are substantiated
              under Article 87 of Mexico's Credit Institutions Law, potential penalties could reach up to 10% of gross
              product revenue, posing reputational and financial risks to customer acquisition.
            calloutType: risk
