  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than “Latin American fintech.” Plata competes first for Mexican consumer
              revolving-credit and installment balances, then for the deposits, payments, and transaction frequency that
              can deepen a primary banking relationship. The official product surface supports a no-annual-fee card,
              category cashback, and app-managed installment conversion; a market-data profile also describes BNPL and
              cash top-ups through OXXO. Included economics therefore comprise consumer interest, card and payment
              economics, and product-linked fee or interchange pools where applicable. Corporate treasury, merchant
              acquiring, cross-border B2B payments, and unrelated Latin American banking spend are excluded. Status-quo
              substitutes include incumbent-bank cards, cash, informal borrowing, debit-only usage, and delaying a
              purchase rather than borrowing.
            claimRefs:
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM004
              - CM005
              - CM006
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The strongest assigned demand signal is a third-party report that more than 60% of Mexican adults lack
              formal credit access. The same report states that Plata had 3.5 million active credit-card customers,
              including more than 750,000 receiving their first card through Plata. These figures indicate substantial
              reach and an inclusion wedge, but they are not a market-size denominator: the evidence does not identify
              the adult population base, eligible borrowers, outstanding balances, annual spend, or risk-adjusted
              revenue pool. A historical market-data summary says Plata represented about 10% of new cards at an earlier
              point, but its period and underlying issuance count are not disclosed. The chapter therefore reports
              observed adoption and failed sizing paths rather than manufacturing a precise TAM, SAM, or SOM.
            claimRefs:
