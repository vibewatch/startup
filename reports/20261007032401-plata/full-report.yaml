      - number: '6.3'
        title: Underwriting Infrastructure, Operational Durability, and Regulatory Friction
        blocks:
          - type: paragraph
            body: >-
              Plata's customer retention and credit durability depend on proprietary automated risk systems supported by
              key infrastructure partnerships. To verify income and mitigate default rates among applicants lacking
              traditional tax or banking documentation, Plata established a strategic alliance with Open Finance
              infrastructure provider Belvo. This deployment links two critical touchpoints in the customer lifecycle:
              consenting users provide employment and payroll data for instant automated income verification, while bank
              direct debit automates recurring installment collections directly from external bank or payroll accounts.
              CEO Neri Tollardo highlighted that this integration addresses operational friction, aiming to lower
              delinquency and prevent late payment penalties. Nevertheless, rapid customer expansion in unsecured
              consumer credit has introduced acute friction and external risk. In April 2026, investigative reporting
              and consumer forums spotlighted customer dissatisfaction and disputes regarding Tarjeta Plata's
              promotional 'months without interest' programs, citing retroactive interest accrual and fee triggers
              linked to minor payment timing variances. Independent consumer satisfaction for the card fell to 3.1 out
              of 5.0, prompting Mexico's National Banking and Securities Commission (CNBV) to initiate an active review
              under its 2025 Circular on Credit Product Transparency. Furthermore, persistent Latin American
              macroeconomic inflation averaging 8.3% YoY and benchmark credit card APRs around 42.5% heighten
              vulnerability to customer delinquency and attrition toward transparent neobank rivals.
            claimRefs:
              - CU009
              - CU010
              - CU013
              - CU014
              - CU015
              - CU016
