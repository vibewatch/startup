      - number: '7.2'
        title: Regulatory, legal, and governance exposure
        blocks:
          - type: paragraph
            body: >-
              Plata's transition into regulated-bank operations is supported by a sequence of public claims rather than
              a regulator document in this pool: a December 2025 company-syndicated release said bank operations had not
              yet started, while M&A Insights reported a March 2026 launch. Two low-reputation websites separately
              allege an April 2026 CNBV review of Tarjeta Plata fee disclosures, but neither is a substitute for the
              underlying regulator statement and both use questionable descriptions of the issuer. The allegation should
              trigger direct record checks, not a conclusion that enforcement exists. Renascence's report of adding a
              former regulator and former ambassador to the board is a governance signal, but it does not evidence
              remediation, compliance testing, or reduced residual exposure.
