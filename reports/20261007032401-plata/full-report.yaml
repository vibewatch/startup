      - number: '7.3'
        title: Credit, profitability, and operating execution
        blocks:
          - type: paragraph
            body: >-
              The September 2025 company release shows a fast-expanding balance sheet: net loans reached MXN 8,205
              million, up 122% year to date, and personal loans increased from 3.6% to 6.5% of the portfolio. Scale
              alone does not prove underwriting quality. Public evidence in the assigned pool does not provide vintage
              curves, delinquency, charge-offs, fraud losses, recoveries, or risk-adjusted unit economics. Funding
              growth with MXN 3,586 million of equity injections and MXN 3,854 million of bond issuance and other
              borrowings during the period reduces immediate liquidity pressure but does not demonstrate self-funding
              economics. Operational resilience is also an open diligence item because no assigned source provides
              uptime, incident, recovery, or security-control evidence.
