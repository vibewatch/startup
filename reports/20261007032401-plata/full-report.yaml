      - number: '4.3'
        title: Capital Adequacy, Funding Transition, and Underwriting Verdict
        blocks:
          - type: paragraph
            body: >-
              Plata's financing profile reflects exceptional equity capital support coupled with an early-stage, highly
              concentrated liability structure. In April 2026, the company closed an oversubscribed USD 405 million
              Series C round led by Bicycle Capital at a USD 5.0 billion post-money valuation, bringing lifetime capital
              injections from shareholders to over USD 500 million since inception and cumulative debt and equity
              financing above USD 2 billion. Institutional backers now include sovereign wealth funds such as Qatar
              Investment Authority (QIA), BTG Pactual, Valor Capital Group, and major US university endowments. Fitch
              Ratings highlights capitalization as a primary rating strength, noting a Fitch Core Capital (FCC) to
              Risk-Weighted Assets (RWA) ratio of 12.2%, a tangible equity-to-assets ratio of 11.8%, and a regulatory
              total capitalization ratio of 18.0% as of 1Q26.


              Despite robust equity loss absorption, Plata faces a pivotal structural transition in its funding base.
              Historically reliant on wholesale credit lines and market debt issuances—which drove unsecured funding
              from zero in 2023 to 48.8% of total funding at year-end 2025—Plata launched retail deposit operations in
              mid-March 2026. As of 1Q26, customer deposits totaled just USD 78 million, resulting in an extreme
              loan-to-deposit ratio of 933.5%. Until Banco Plata can gather low-cost retail deposits at scale to
              displace expensive wholesale facilities, its net interest spread will remain vulnerable to monetary
              tightening and wholesale debt rollover conditions. In conclusion, while Plata's capital buffers and
              top-line velocity are formidable, institutional underwriters must treat profitability guidance with
              caution until asset quality stabilizes through an economic downturn and retail deposit mobilization
              materializes.
            claimRefs:
              - CI001
              - CI007
              - CI008
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Credit Loss Provisioning and Wholesale Debt Dependency Threaten Underwriting Margins
            body: >-
              Banco Plata's extraordinary growth velocity masks two fundamental financial vulnerabilities: an annualized
              cost of risk reaching 23.9% in 1Q26 alongside a 4.8% Stage 3 impaired loan ratio, and an overwhelming
              reliance on wholesale credit facilities reflected in a 933.5% loan-to-deposit ratio. Until retail deposit
              accumulation significantly lowers funding expenses and loan seasoning confirms asset-quality stability,
              institutional underwriting must discount headline revenue run-rates.
            calloutType: risk
            claimRefs:
              - CI005
              - CI007
