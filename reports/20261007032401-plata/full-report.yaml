  - id: TV002
    title: Investment Thesis Versus Anti-Thesis Framework
    columns:
      - Perspective
      - Core Pillar
      - Supporting Operational Evidence
      - Thesis-Break / Disconfirming Trigger
    rows:
      - - Thesis
        - Underserved Banking Market TAM
        - 40% of Mexican adults unbanked; 750K+ first-time credit cardholders underwritten by Plata
        - Slowdown in new customer acquisition or material deterioration in newly underwritten vintages
      - - Thesis
        - Deposit Funding Cost Transformation
        - Commercial banking license launched March 2026 allows retail deposit mobilization
        - Inability to attract low-cost retail deposits, forcing continued reliance on expensive warehouse lines
      - - Thesis
        - Organic Growth and Proprietary Tech
        - 40%+ organic customer referral share; proprietary core system built by 800+ STEM professionals
        - Sharp rise in blended CAC or core technological outages during transaction processing scaling
      - - Anti-Thesis
        - Regulatory Sanction and Scrutiny
        - Active CNBV review under 2025 Circular on fee transparency and 0% promotional installment rules
        - >-
          Formal administrative fines up to 10% of product revenue or court-ordered bans on promotional installment
          models
      - - Anti-Thesis
        - Credit-Loss and Vintage Risk
        - Lack of public net charge-off disclosure across $800M loan book in persistent inflationary environment
        - Spike in non-performing loans above industry benchmarks or material warehouse credit line impairment
      - - Anti-Thesis
        - Competitive Pressure from Neobanks
        - Nu Holdings counts 12.7M Mexican users with 92% customer satisfaction vs 3.1 rating for Tarjeta Plata
        - Acceleration in account churn toward transparent digital lenders offering fee-free credit structures
    notes: Synthesis contrasts competitive advantages with regulatory, credit, and market vulnerability factors.
    claimRefs:
