      - number: '4.2'
        title: Cost Structure, Asset Quality, and Unit Economics Realities
        blocks:
          - type: paragraph
            body: >-
              Plata's operating architecture combines proprietary digital distribution and in-house core banking systems
              with severe credit provisioning costs typical of early-stage unsecured consumer lending. The bank's credit
              portfolio expanded aggressively to USD 800 million by April 2026, having grown 1.7x year-over-year at
              year-end 2025 and 1.4x year-over-year in 1Q26 according to Fitch Ratings. However, this high-yield
              appetite has driven elevated credit impairment. Fitch reported that Plata's Stage 3 impaired loans ratio
              deteriorated to 4.8% in 1Q26, up from 4.4% at year-end 2025 and 3.4% in 2024. Most critically, Plata's
              annualized cost of risk reached 23.9% in 1Q26, substantially outstripping conventional unsecured retail
              banking benchmarks.


              From an operating profitability standpoint, Plata remains pre-profitable despite narrowing its operating
              deficit. Fitch notes that Plata's ratio of operating loss to average assets stood at -16.5% in 1Q26,
              reflecting marked improvement from -28.1% in 2025 and -70.8% in 2024. This trajectory validates growing
              operating leverage against fixed technology investments—developed by a reported team of more than 800 STEM
              professionals—yet highlights that credit loss provisions and expansion overhead continue to absorb gross
              yields. Customer acquisition efficiency presents a relative bright spot, with management asserting that
              over 40% of its 3.5 million active cardholders were onboarded via organic and referral channels.
              Nevertheless, private unit-economic metrics—including customer acquisition cost (CAC), customer lifetime
              value (LTV), vintage net charge-offs, and customer-level contribution margins—remain undisclosed,
              preventing independent verification of cohort payback.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI010
              - CI012
          - type: table
            tableRef: TI003
