  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Consumer Segmentation and Core Demographics
        blocks:
          - type: paragraph
            body: >-
              Banco Plata targets Mexico's historically underbanked and underserved consumer population, addressing a
              national credit penetration deficit where traditional incumbent banks have imposed prohibitive
              underwriting hurdles and documentation requirements. The primary customer segment comprises digital-first
              retail consumers, salaried workers, and informal-economy participants seeking access to unsecured
              revolving credit, flexible installment financing, and digital deposit accounts. Through its mobile-first
              application, Plata delivers core financial products including the no-annual-fee Plata Card backed by
              Mastercard, buy-now-pay-later capabilities via Plata Difiere supporting installment credit up to MXN
              200,000, and customizable merchant category cashback reaching up to 15%. A critical demographic subset
              within this consumer base consists of first-time credit borrowers; public operating disclosures confirm
              that out of more than 3.5 million active credit card users, over 750,000 consumers obtained their first
              formal credit card through Plata. By pairing automated mobile onboarding with cash top-up and payment
              acceptance across nationwide retail networks such as OXXO, Plata addresses structural liquidity
              constraints that previously isolated cash-reliant workers from formal digital financial ecosystems. The
              launch of full retail banking operations under a regulated Mexican banking charter in early 2026 further
              expanded this relationship, enabling Plata to capture consumer payroll and retail deposits alongside
              credit balances.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU011
