      - number: '6.2'
        title: Adoption Trajectory and Channel Economics
        blocks:
          - type: paragraph
            body: >-
              The adoption velocity of Banco Plata has accelerated rapidly since its inception, transitioning from a
              localized credit card fintech into one of Latin America's most valuable private digital banks. Operating
              disclosures illustrate that Plata expanded its customer base from early unicorn milestones of 1 million
              active card users to approximately 2.5 million active credit customers by late 2025, and subsequently
              surpassed 3.5 million active credit card customers by the close of its Series C funding round in April
              2026. This customer growth directly fueled an expansion of Plata's credit portfolio, which grew from $563
              million in 2025 to over $800 million alongside an annualized revenue run rate exceeding $600 million.
              Distribution efficiency is characterized by a dual-channel acquisition engine combining paid performance
              marketing optimization and organic peer-to-peer distribution. More than 40% of Plata's accumulated
              customer base has been acquired via referral and organic viral channels, substantially mitigating blended
              customer acquisition costs. Concurrently, paid acquisition across digital surfaces was optimized through
              specialized App Store programmatic tooling with partners such as Asapty, where restructured single-keyword
              ad groups and automated bidding algorithms elevated brand impression share from below 20% to over 91%,
              generating a 1050% surge in app installs alongside a 12% reduction in cost-per-install (CPI).
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU002
