        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Customer scale, first-time credit issuance, and reported 170% loan-portfolio growth suggest strong product
              pull, while the March 2026 move into full banking operations could support deposits and broader
              relationship depth. Capital-market evidence is also strong but must not be mistaken for market size:
