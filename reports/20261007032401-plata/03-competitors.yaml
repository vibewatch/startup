callouts:
  - calloutType: risk
    title: Regulatory Transparency Crackdown Threatens Promotional Mechanics
    body: |
      The active CNBV review of Tarjeta Plata underscores an escalating regulatory shift across Latin America against fine-print fee structures. Because Plata relies heavily on promotional grace periods and conditional 0% interest terms to win customers from neobanks like Nu, any mandated simplification or penalty under Article 87 could compress net operating yields and impair user acquisition efficiency.
    claimRefs:
      - CP010
      - CP012
      - CP015
