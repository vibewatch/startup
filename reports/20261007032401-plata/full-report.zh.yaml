      - - 建议
        - 跟踪
        - 3.5m+ 活跃用户和 $600m 年化收入，与未经验证的信贷客户群及监管审查形成平衡
        - 在审计确认信贷客户群损失稳定性和存款融资进展前，暂缓主要股权配置
      - - 风险评级
        - 高
        - 超过 750,000 名首次获得银行服务的借款人、CNBV 费用透明度审查，以及 $800M 贷款账簿敞口
        - 需要密切监测监管处罚敞口及宏观因素驱动的消费者逾期趋势
      - - 信心
        - 中
        - 融资轮结构和机构投资者银团披露充分，但单位层面财务数据不透明
        - 投资判断仍需通过二次尽调核实净核销额和单位贡献利润率
      - - 估值立场
        - 偏高
        - $5.0B 投后估值相当于 8.3 倍年化收入，高于成熟同业的估值溢价较高
        - 要求运营执行近乎无瑕，并迅速用零售存款替代批发债务
    notes: 评估反映 2026 年 4 月完成的 C 轮资本化，以及截至 2026 年 10 月公布的监管披露。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV010
      - CV011
      - CV013
      - CV015
  - id: TV002
    title: 投资论点与反论点框架
    columns:
      - 视角
      - 核心支柱
      - 支持性运营证据
      - 论点失效 / 反证触发因素
    rows:
      - - 论点
        - 未获充分服务的银行市场 TAM
        - 40% 的墨西哥成年人没有银行账户；Plata 为 750K 以上首次信用卡持有人提供授信
        - 新客户获客放缓，或新承保客户群明显恶化
      - - 论点
        - 存款融资成本转型
        - 2026 年 3 月推出商业银行牌照，允许吸收零售存款
        - 无法吸引低成本零售存款，被迫继续依赖昂贵的仓储授信额度
      - - 论点
        - 有机增长与自有技术
        - 超过 40% 的客户来自自然转介绍；自有核心系统由 800 多名 STEM 专业人员搭建
        - 综合 CAC 急升，或交易处理规模扩大时核心技术频繁中断
      - - 反论点
        - 监管处罚与审查
        - CNBV 正依据 2025 年费用透明度通告及 0% 促销分期规则进行审查
        - 处以最高相当于产品收入 10% 的正式行政罚款，或法院命令禁止促销分期模式
      - - 反论点
        - 信贷损失与客户群风险
        - 在持续通胀环境下，$800M 贷款账簿缺少公开净核销披露
        - 不良贷款升至高于行业基准，或仓储授信额度出现重大减值
      - - 反论点
        - 新银行竞争压力
        - Nu Holdings 在墨西哥拥有 12.7M 名用户，客户满意度为 92%，而 Tarjeta Plata 评分为 3.1
        - 客户加速流失至提供免手续费信贷结构、定价更透明的数字贷款方
    notes: 综合比较竞争优势与监管、信贷和市场脆弱性因素。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV012
  - id: TV003
    title: 未来 24 个月估值情景矩阵
    columns:
      - 情景
      - 概率
      - 核心运营假设
      - 24 个月收入目标
      - 隐含估值区间
      - 下行 / 上行触发因素
    rows:
      - - 乐观情景
        - 25%
        - 存款快速增长并替代仓储债务；AI 风险引擎保持信贷损失稳定；哥伦比亚上线成功
        - $1,200M run-rate
        - $8.0B – $10.0B（8.0x–10.0x 倍数）
        - 实现持续经营盈利并申请美国 IPO 上市
      - - 基准情景
        - 50%
        - 信用卡持续增长；零售存款适度增加；合规调整解决 CNBV 调查
        - $850M run-rate
        - $4.5B – $5.5B（5.5x–6.5x 倍数）
        - 24 个月内消化估值，收入倍数向同业基准压缩
      - - 悲观情景
        - 25%
        - 无银行账户客户群的逾期上升；CNBV 监管罚款及产品重构；客户流失至 Nu
        - $650M run-rate
        - $2.5B – $3.5B（4.0x–5.0x 倍数）
        - 重大信贷减值、仓储融资困境及下轮股权重组
    notes: 远期预测评估 $800M 贷款账簿及 $5.0B C 轮基准估值下的潜在表现。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV006
      - CV007
      - CV009
      - CV014
      - CV015
