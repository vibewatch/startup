      - number: '3.2'
        title: 能力、定价与透明度权衡
        blocks:
          - type: paragraph
            body: >-
              Plata 通过高参与度功能打造核心产品 Tarjeta Plata 的差异化，包括合作品类最高 15% 的可定制返现、免息分期（meses sin intereses）以及延长至 60
              天的账单还款宽限期。Plata Difiere 还提供非信用卡分期融资，额度最高 MXN 200,000，期限 3 至 24 个月。这些灵活激励推动了中等收入及年轻城市墨西哥消费者的快速采用。

              但竞争基准显示定价清晰度和产品执行存在明显摩擦。独立市场报道和消费者金融分析称，Tarjeta Plata 的平均年利率约为 42.5%，高于 NuAdd 的 38.9% 和 Santander Zero Fee
              的 40.2%。此外，2026 年第一季度用户满意度调查显示，Tarjeta Plata 得分 3.1/5.0，低于 Banorte Platinum 的 3.4、Santander Zero Fee 的 3.8
              和 NuAdd 的 4.6。

              满意度不足的主要原因，是消费者认为条件性促销机制不透明。当广告中的 0% 利息促销因轻微付款时间差异被取消或追溯调整时，投诉便会出现。相比之下，Nu Holdings
              通过零促销、零意外成本结构建立了更强品牌资产和 92% 的内部满意度。Plata 的返现和宽限期激励能推动初次激活，但费用触发条件复杂；随着用户财务成熟，这会增加客户流失和品牌受损风险。
