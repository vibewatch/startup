            title: 不要基于未经核实的执法叙事做授信
            body: 费用透明度指控值得调查，但证据太弱，不能当作已确认的 CNBV 行动。投资案例应在指定概率或罚款金额前，取得监管机构主要记录、公司往来函件和投诉数据。
            calloutType: risk
