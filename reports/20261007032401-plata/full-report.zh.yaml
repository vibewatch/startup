            body: >-
              可投资市场比“拉丁美洲金融科技”更窄。Plata
              首先争夺墨西哥消费者的循环信贷和分期余额，其次争夺能够加深主银行关系的存款、支付和交易频次。官方产品支持无年费信用卡、品类返现以及应用管理的分期转换；一份市场数据简介还提到 BNPL 和通过 OXXO
              现金充值。因此，纳入的经济池包括消费利息、信用卡及支付经济性，以及适用时与产品挂钩的费用或交换费池。企业资金管理、商户收单、跨境 B2B
              支付及无关的拉美银行支出均排除在外。现状替代品包括传统银行信用卡、现金、非正式借贷、仅使用借记卡，以及宁可推迟购买而不借款。
