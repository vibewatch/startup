      - CR015
  - id: FV001
    title: 推荐逻辑与决策框架
    type: flow
    summary: 将市场机会、机构融资、信用风险和监管审查串联起来，形成最终“跟踪”建议的方法论路径。
    data:
      nodes:
        - id: market-traction
          label: 市场牵引力（3.5M+ 用户 / $600M 收入）
        - id: institutional-backing
          label: C 轮资本（估值 $5.0B，融资 $405M）
        - id: operational-risks
          label: 结构性风险（分期批次不透明 / CNBV 审查）
        - id: valuation-multiple
          label: 估值立场（8.3x 倍数 / 偏高）
        - id: diligence-gates
          label: 尽调要求（经审计损失 / 存款规模）
        - id: final-recommendation
          label: 投资立场（跟踪 / 高风险评级）
      edges:
        - from: market-traction
          to: institutional-backing
        - from: institutional-backing
          to: operational-risks
        - from: operational-risks
          to: valuation-multiple
        - from: valuation-multiple
          to: diligence-gates
        - from: diligence-gates
          to: final-recommendation
    approximationNotes: 节点是基于已核实的 C 轮融资条款和监管申报整理出的结构化定性综合判断。
    claimRefs:
      - CV001
      - CV002
      - CV005
      - CV007
      - CV010
      - CV011
      - CV013
      - CV015
