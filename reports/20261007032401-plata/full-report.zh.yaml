            body: >-
              Plata 是一家聚焦墨西哥、运营 Banco Plata 的数字金融机构；Banco Plata 是一家在墨西哥受到全面监管的银行。独立公司简介均将总部置于墨西哥城，但对公司成立于 2022 年还是 2023
              年存在分歧，因此证据只支持 2022—2023 年的成立及启动窗口，不能确定单一成立日期。公开披露的产品路径从消费信贷和信用卡，延伸至 2026 年 3
              月全面银行业务启动后的存款和借记服务。公开材料介绍了贷款及支付产品，却没有披露分部收入模型、经审计盈利能力或按产品划分的经济性。因此，本快照将定价轮次事实与管理层声称的规模分开，并把缺乏支持的封面指标保留为
              null。
