      - number: '8.3'
        title: 情景分析与可比基准动态
        blocks:
          - type: paragraph
            body: >-
              为严格评估 $5.0 billion 的 C 轮股权基准，情景建模在 24 个月投资期内，基于乐观、基准和悲观运营假设，搭建三条不同的前瞻路径。乐观情景（概率 25%）下，Banco Plata 快速把 3.5
              million 名活跃信用卡持卡人转化为主要银行存款客户，吸收低成本零售存款，使净息差扩大 400 个基点以上，同时降低仓储融资成本。年化收入达到 $1.2 billion；在自研 AI
              信用评分支持下，各发放批次净损失率趋稳；哥伦比亚国际扩张获得商业规模；Plata 实现持续净盈利，并可能通过美国 IPO 支撑 $8.0 billion–$10.0 billion 估值（收入倍数
              8.0x–10.0x）。


              基准情景（概率 50%）下，Plata 维持信用卡业务的稳健增收，收入达到 $850
              million，但零售存款转化速度中等，综合资金成本仍然偏高。由于客户中无银行账户人群占比高，信用拨备维持高位；监管合规调整也限制了分期手续费收入的激进增长。在这一路径下，估值因持有期倍数消化而压缩至接近入场水平的
              $4.5 billion–$5.5 billion（收入倍数 5.5x–6.5x）。悲观情景（概率 25%）下，宏观通胀加剧墨西哥消费者逾期，使 $800 million 贷款组合的净核销率上升。同时，CNBV
              信用产品透明度审查的不利结论可能带来法定财务处罚、限制促销分期机制，并导致客户和声誉流向 Nu Holdings 等透明度更高的竞争者。在下行情景压力下，收入增速放缓至约 $650 million，估值大幅收缩至
              $2.5 billion–$3.5 billion（收入倍数 4.0x–5.0x），普通股股东将面临显著的优先权悬置和向下轮重组。
            claimRefs:
