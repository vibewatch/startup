      - number: '4.3'
        title: 资本充足性、融资转型与授信结论
        blocks:
          - type: paragraph
            body: >-
              Plata 获得了强大的股权资本支持，但负债结构仍处早期，集中度很高。2026 年 4 月，公司完成由 Bicycle Capital 领投、超额认购的 USD 405 million Series C，投后估值
              USD 5.0 billion；自成立以来，股东累计注资超过 USD 500 million，债务及股权累计融资超过 USD 2 billion。机构支持者包括 Qatar Investment
              Authority（QIA）、BTG Pactual、Valor Capital Group 及美国主要大学捐赠基金。Fitch Ratings 将资本化列为主要评级优势：2026 年第一季度 Fitch
              核心资本（FCC）/风险加权资产（RWA）为 12.2%，有形权益/资产为 11.8%，监管总资本比率为 18.0%。

              尽管股权吸收损失能力强，Plata 的融资基础正经历关键结构转型。公司过去依赖批发信贷额度和市场债务发行，使无抵押融资占比从 2023 年的 0 上升到 2025 年末的 48.8%；随后于 2026 年 3
              月中旬启动零售存款业务。截至 1Q26，客户存款仅 USD 78 million，贷款存款比率达到极高的 933.5%。在 Banco Plata
              能大规模吸收低成本零售存款、取代昂贵批发融资之前，净利差仍会暴露于货币收紧和批发债务展期条件。总的来说，Plata
              的资本缓冲和收入增长速度虽很强，但在资产质量经受经济下行并稳定、零售存款动员真正落地前，机构授信方应谨慎看待盈利指引。
