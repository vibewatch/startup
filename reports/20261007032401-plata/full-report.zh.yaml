      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 尽调问题与核心论点失效监测触发点
            body: >-
              评估老股交易或潜在后续融资的机构投资者，在把 Plata 的评级从继续跟踪上调至买入前，必须优先完成三项关键尽调核验。第一，索取覆盖 2024–2026 年发放贷款的非公开 vintage
              级静态池损失数据和净核销表，确认自研 AI 风控算法在宏观通胀持续时仍能抵御违约。第二，审计 Banco Plata 的零售存款动员速度，确认低成本消费者储蓄账户正在主动替代高成本批发仓储融资额度。第三，跟踪
              CNBV 关于 Tarjeta Plata 促销手续费机制的 Circular 审查最终结论，确保合规调整不会造成显著的非利息手续费收入收缩或客户流失。
            calloutType: recommendation
            claimRefs:
              - CV005
