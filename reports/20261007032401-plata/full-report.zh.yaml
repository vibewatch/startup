  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Banco Plata 是拉美扩张最快的消费金融平台之一：2023 年成立后不到三年，活跃信用卡客户已超过 3.5 million，年化收入超过 $600
              million。核心投资论点来自墨西哥巨大的结构性银行服务缺口：约 40% 的成年人没有正式金融产品，超过 60% 无法获得正式信贷。Plata 采用自建核心银行架构、自动化 CRM 和由超过 800 名
              STEM 专业人员开发的 AI 授信模型，已向超过 750,000 名此前不在传统商业贷款机构视野内的首次信用卡持有人授信。获客自然增长强劲，推荐渠道贡献了超过 40% 的新客户开户，压低了综合获客成本。2026
              年 3 月 Banco Plata
              作为墨西哥全面持牌商业银行正式运营，同时获得在哥伦比亚设立融资公司的监管授权，从而打开零售吸收存款的空间。若能成功动员，零售储蓄账户将提供低成本、黏性强的本土资金基础，相较传统非银行仓储借款，根本性降低
              Plata $800 million 贷款组合的资本成本。

              反论点则强调威胁长期股权回报的信贷、监管和资本风险。Plata 服务近优质及此前未获得银行服务的墨西哥消费者，形成结构性信用风险，尤其是在拉美主要市场宏观通胀持续高企之际。Plata
              尚未公开披露按批次的净核销曲线、回收率或欺诈损失率，因此无法独立核验信贷组合的可持续性。运营和监管摩擦进一步放大风险：2026 年 4 月，CNBV 确认依据 2025 年《信贷产品透明度通告》审查
              Tarjeta Plata，涉及客户对费用触发条件不透明及促销免息分期条款被有条件取消的投诉。根据《信贷机构法》第 87 条，监管处罚可能达到年度产品收入的
              10%，并伴随强制促销重设计。与此同时，资本雄厚的数字银行巨头 Nu Holdings 在墨西哥拥有 12.7 million 活跃用户和未经提示的 92% 客户满意度评分；若费用透明度问题持续，其竞争可能威胁
              Plata 的定价能力和客户留存。
            claimRefs:
              - CV001
              - CV002
              - CV003
