  - id: FR001
    title: 经证据校准的风险热力图
    type: matrix
    summary: 将可能性、影响和缓释成熟度分开呈现，避免把证据缺口误读为虚假的精确度。
    data:
      columns:
        - label: 可能性信号
          detail: 根据保留证据判断为已观察到、偏高或未知，而非给出数值概率。
        - label: 潜在影响
          detail: 对资本、授权、流动性或服务连续性的条件性影响。
        - label: 缓释成熟度
          detail: 仅计入指定证据池中有证据支持的控制措施或资源。
      rows:
        - label: 信贷恶化
          note: 可以看到拨备费用，但看不到分期批次的损失表现。
          values:
            - label: 偏高信号
              tone: risk
            - label: 高
              tone: risk
            - label: 未验证
              tone: neutral
        - label: 运营现金需求
          note: 净经营现金流没有被标注为现金消耗或现金跑道。
          values:
            - label: 2025 年 9M 观察到
              tone: risk
            - label: 若持续则为高
              tone: risk
            - label: 可获得外部资本
              tone: warning
        - label: 批发融资续作
          note: 融资安排条款和到期梯次不可得。
          values:
            - label: 重大依赖
              tone: warning
            - label: 高
              tone: risk
            - label: 声称供应方多元化
              tone: warning
        - label: 消费者透明度行动
          note: 所称的 CNBV 审查没有保留的一手记录。
          values:
            - label: Unknown
              tone: neutral
            - label: 若确认则为高
              tone: risk
            - label: 无整改证据
              tone: neutral
        - label: 银行业务转型
          note: 上线情况由独立交易情报报道，而非监管机构记录。
          values:
            - label: 已报道转型
              tone: warning
            - label: 高
              tone: risk
            - label: 仅有董事会信号
              tone: warning
        - label: 网络与服务韧性
          note: 没有保留事故历史或控制保障证据。
          values:
            - label: Unknown
              tone: neutral
            - label: 高
              tone: risk
            - label: Unknown
              tone: neutral
    approximationNotes: 定性类别保留已披露的不确定性；未估算事件概率或损失金额。
