      - number: '4.2'
        title: 成本结构、资产质量与单位经济性现实
        blocks:
          - type: paragraph
            body: >-
              Plata 以自有数字分销和自建核心银行系统支撑运营，但也承担早期无抵押消费贷款常见的高额信贷拨备成本。根据 Fitch Ratings，截至 2026 年 4 月，银行信贷组合已扩大至 USD 800
              million；2025 年末同比增长 1.7x，2026 年第一季度同比增长 1.4x。但追逐高收益也推高了信贷减值。Fitch 报告称，Plata 的第三阶段减值贷款率在 1Q26 恶化至 4.8%，高于
              2025 年末的 4.4% 和 2024 年的 3.4%。更关键的是，Plata 的年化风险成本在 1Q26 达到 23.9%，显著高于传统无抵押零售银行基准。

              从运营盈利角度看，Plata 仍未盈利，尽管运营亏损正在收窄。Fitch 指出，2026 年第一季度运营亏损/平均资产比率为 -16.5%，较 2025 年的 -28.1% 和 2024 年的 -70.8%
              明显改善。这一轨迹说明固定技术投入（据称由超过 800 名 STEM 专业人员开发）正在产生运营杠杆，但信贷损失拨备和扩张开支仍持续吞噬毛收益。获客效率是相对亮点：管理层称 3.5 million
              活跃持卡人中超过 40% 通过自然及推荐渠道获客。然而，CAC、LTV、按批次计算的净核销和客户层面贡献利润等私有单位经济指标均未披露，无法独立验证群组回本。
