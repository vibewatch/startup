      - number: '3.3'
        title: 护城河持久性、监管暴露与替代风险
        blocks:
          - type: paragraph
            body: >-
              Plata 的长期竞争持久性取决于能否从依靠昂贵批发仓储融资的资产端单一信贷模式，转向多元化、由存款支持的全服务银行。Plata 已于 2024 年 12 月获得 National Banking and
              Securities Commission（CNBV）颁发的墨西哥商业银行牌照，但其分销、客户转换成本和监管合规护城河仍然脆弱。

              与企业平台或工资账户绑定的零售银行不同，数字信用卡应用的客户转换成本很低。墨西哥消费者经常同时持有多张信用卡，以优化奖励、现金预借可得性和分期促销安排。传统机构及 Nu
              等新银行还通过工资账户迁移能力和成熟商户网络保持强大分销力。TeamSystem（收入 $310.8M）或 Mambu 等企业软件及 B2B
              平台拥有较强合同锁定，而消费信贷平台一旦奖励利润率收缩，就持续暴露于客户迁移风险。

              更关键的是，监管审查构成可能限制 Plata 产品机制的急性运营风险。2026 年 4 月，CNBV 确认依据其 2025 年《信贷产品透明度通告》对 Tarjeta Plata
              展开监管审查，调查涉及费用触发条件和利息计提条件的投诉披露。根据墨西哥《信贷机构法》第 87 条，误导性条款可能面临最高相当于产品年度收入 10% 的处罚。在 JPMorgan 分析师预计感知费用不透明度每增加
              100 个基点，就会把 1.5% 的千禧一代市场份额转向透明新银行的市场中，Plata 可能因强制重新设计披露和加强合规监督而面临利润率压缩。
