      - number: '7.4'
        title: 融资依赖与论点破坏标准
        blocks:
          - type: paragraph
            body: >-
              Plata 的资本获取既是优势也是依赖。公司发布的公告描述一项由 Nomura 安排、额度最高 $500m 的融资机制以及超过 $1.6b 的累计机构融资；这些是已筹融资，不是可用现金。独立市场数据来源报告
              $405m Series C、$5b 估值；Multiples 将 $600m 标为收入，但警告记录数字可能是运行率或
              LTM。如果经核实的信贷损失超过定价和拨备，重大融资机制无法按经济条件续期，监管记录确认披露违规仍未解决，或运营现金流出持续而没有可信的内部融资增长路径，投资论点应被打破。融资机制条款、到期日、契约、抵押品、存款结构和当前资本比率仍需尽调。
