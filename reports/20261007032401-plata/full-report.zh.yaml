  - id: FE001
    title: Plata 银行技术架构栈
    type: stack
    summary: 分层的软件与基础设施架构，为 Banco Plata 的数字银行运营提供动力。
    data:
      layers:
        - label: 客户体验层
          detail: 基于 Kotlin、Jetpack Compose 和 MVI 架构模式构建的原生移动应用界面。
        - label: 获客与风险层
          detail: 数字开户引擎自动执行 KYC、信用评分和动态资格评估。
        - label: 核心银行与服务层
          detail: 微服务平台通过 gRPC 和 REST 协调转账、ATM 集成及账户管理。
        - label: 事件与流处理层
          detail: 由 Apache Kafka 驱动的异步消息骨干，处理高吞吐交易遥测数据。
        - label: 数据持久化与账本层
          detail: 以 PostgreSQL 为基础的关系型数据存储，处理交易余额和系统记录状态。
        - label: 可观测性与平台运营
          detail: 集中式遥测、指标采集框架和仪表盘，跟踪分布式枢纽中的应用稳定性。
    approximationNotes: 组件映射根据工程岗位资料、架构披露和招聘要求重构。
    claimRefs:
