  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价机制与收入增长轨迹
        blocks:
          - type: paragraph
            body: >-
              Banco Plata 主要靠高收益的循环无抵押消费信贷变现，核心产品是 Tarjeta Plata 信用卡和 Plata Difiere 分期贷款。公司自 2026 年 3 月起以获授权的多功能银行 Banco
              Plata S.A. 运营，收入来自循环余额融资费、商户交换费、分期转换融资和其他客户费用。根据 Fitch Ratings 2026 年 5 月的信用评估，Plata 2026 年第一季度本币总运营收入同比增至
              1.9x，达到 USD 112 million；2025 全年为 USD 276 million，2022—2025 年年度平均为 USD 83 million。公司高管 2026 年 4
              月披露，年化收入运行率已超过 USD 600 million，增速位居拉美消费数字银行前列。

              尽管墨西哥结构性缺乏银行服务使名义收入增长保持强劲，收入确认和质量仍深受循环消费信贷动态及费用结构影响。Tarjeta Plata 标准循环余额的估计平均 APR 为 42.5%，并配有期限 3 至 6
              个月的条件性免息分期促销。但依赖免息促销和分层罚费已引发监管压力。2026 年 4 月，CNBV 确认依据 2025 年《信贷产品透明度通告》调查 Tarjeta
              Plata，评估有关利息计提条件和费用触发条件披露的投诉。若监管机构要求标准化披露或限制追溯计息，非利息费用收入可能被压缩，因此评估收入质量时必须把纯风险调整后利差与附加罚费分开。
