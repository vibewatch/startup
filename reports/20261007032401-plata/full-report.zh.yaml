            claimRefs:
              - CU013
              - CU014
          - type: callout
            title: 自然推荐效率与开放金融自动化
            body: >-
              Banco Plata 展现出显著的获客杠杆：350 万以上持卡人中超过 40% 通过推荐自然获得，大幅降低综合获客成本。同时，整合 Belvo
              的开放金融基础设施，将自动就业数据核验直接连接银行扣款通道，简化开户并提升缺乏银行服务的客户群体的付款可预测性。
            calloutType: strength
            claimRefs:
              - CU001
              - CU009
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与证据标准
        blocks:
          - type: paragraph
            body: >-
              证据最充分的是财务风险，而非法律风险：Banco Plata 报告 2025 年前九个月净亏损 MXN 1,246m、净运营现金流出 MXN 5,307m，贷款损失拨备达到 MXN
              1,492m。这些数字不能证明未来违约率或现金续航，但显示增长仍在消耗资本，并吸收相当多拨备前收入。监管严重性可能很高，但由于指定证据池没有 CNBV 或 CONDUSEF
              确认所谓费用透明度审查的主要记录，发生可能性尚未评分。因此热力图将已观察到的财务信号与未经核实的事件指控、未知的控制成熟度分开。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR012
