  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与结构性定位
        blocks:
          - type: paragraph
            body: >-
              墨西哥零售银行市场正快速转型，数字银行平台正在服务一个结构性缺乏银行服务的人群；历史上超过 60% 的成年人无法获得正式信贷。Plata
              主要是一家数字消费贷款机构，也是一家新获授权的商业银行，面临五类竞争：规模化数字原生新银行、传统本土银行的数字子品牌、区域企业金融科技公司、传统零售银行以及非正式信贷这一现状替代品。

              最直接、最强大的数字竞争者是 Nu Holdings（在墨西哥运营 Nu Mexico 和 NuAdd），其报告称 2026 年第一季度在墨西哥拥有 1,270 万活跃客户，同比增加 34%。Nu
              在产品设计和客户信任上构成结构性基准，提供透明、无促销的信用卡模式，避免分期促销混乱。Nu 能够吸收低成本零售储蓄存款，因此相较 Plata
              的批发信贷机制拥有可持续的资金成本优势。除此之外，Bineo（Banorte 的数字银行）、Openbank（Santander 的数字业务）以及 Klar、Uala 和 Stori
              等区域挑战者，也在争夺同一批技术导向的消费者。

              传统商业银行，主要是 BBVA Mexico、Banorte 和 Banco Santander，在零售网点、工资账户获取（dispersión de
              nómina）和广泛的企业信贷关系方面拥有显著结构优势。BBVA 和 Banorte 主导信用卡应收账款；Banorte 单独报告 2026 年第一季度信用卡应收账款为 MXN 2850
              亿。不过，传统银行的消费卡资产质量正承压；受通胀影响，Banorte 信用卡逾期率在 2026 年第一季度上升 40 个基点至 3.8%。

              除零售商业银行外，Plata 还与零售商店卡和非正式现状机制竞争。百货商店贷款方（如 Coppel 和 Elektra/Banco Azteca）向低收入人群提供线下销售点信贷，但实际年利率通常超过 80% 至
              100%。相反，非正式借贷网络（tandas、家庭借款和未注册放贷人）仍是缺少文件的家庭的主要现状替代品，不过消费者风险严重。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
          - type: table
            tableRef: TP001
