      - number: '7.3'
        title: 信贷、盈利与运营执行
        blocks:
          - type: paragraph
            body: >-
              2025 年 9 月公司公告显示资产负债表快速扩张：净贷款达到 MXN 8,205m，年初至今增长 122%，个人贷款在组合中的占比从 3.6% 升至
              6.5%。规模本身不能证明授信质量。指定证据池没有提供按批次曲线、逾期、核销、欺诈损失、回收或风险调整后的单位经济性。期间以 MXN 3,586 百万股权注资和 MXN 3,854
              百万债券发行及其他借款推动增长，可缓解即时流动性压力，但不能证明自我融资经济性。运营韧性也仍是开放的尽调事项，因为没有指定来源提供正常运行时间、事故、恢复或安全控制证据。
            claimRefs:
