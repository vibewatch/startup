      - number: '8.2'
        title: 建议、估值背景与融资结构
        blocks:
          - type: paragraph
            body: >-
              综合权衡市场推进速度、信用风险和监管风险后，投资建议为继续跟踪，风险评级为高，置信度为中，估值判断为偏高。Plata 于 2026 年 4 月 15–16 日完成超额认购的 $405 million C
              轮融资，投后股权估值达到 $5.0 billion，成为拉丁美洲估值最高的非上市数字银行。此轮融资由 Bicycle Capital 领投，卡塔尔投资局（QIA）、Banco BTG Pactual、Valor
              Capital Group、Kora、Hedosophia、Spice Expeditions、Audeo Ventures 以及美国顶尖大学捐赠基金等全球主权及机构投资者参与，Morgan Stanley
              担任独家配售代理。本轮融资后，Plata 累计债务与股权融资超过 $2.0 billion；此前公司于 2025 年 3 月完成 $160 million A 轮，投后估值 $1.5 billion，并于
              2025 年 10 月完成 $250 million B 轮，估值 $3.1 billion。


              C 轮融资验证了机构需求，但 $5.0 billion 估值对应 Plata               $600m 收入运行率的 8.3x。相较成熟的上市同业，这一估值包含了显著的增长溢价；例如，Nu
              Holdings 虽已证明具备信贷风控盈利能力、实现净利润为正，并在巴西拥有庞大存款基础，但其远期倍数仍更低。Plata
              要撑住这一估值倍数，必须把运营执行做到无可挑剔、大幅扩张贷款规模，并立即用低成本零售存款替代高成本债务仓储融资。在 Plata 证明各发放批次的核销率经审计后保持稳定、在不伤及业务模式的前提下解决 CNBV
              透明度审查，并给出净经营利润盈亏平衡的明确日历时间表之前，机构资金不应追逐表面估值，而应跟踪每季度存款动员和信用表现。
