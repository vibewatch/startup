      - number: '7.2'
        title: 监管、法律与治理暴露
        blocks:
          - type: paragraph
            body: >-
              Plata 转入受监管银行运营，依据的是一系列公开口径，而非本证据池中的监管文件：2025 年 12 月公司联合发布的新闻稿称银行业务尚未启动，而 M&A Insights 报道 2026 年 3
              月启动。两家信誉较低的网站分别声称 2026 年 4 月 CNBV 审查 Tarjeta Plata
              费用披露，但都不能替代底层监管陈述，并且对发行方的描述可疑。该指控应触发直接记录核查，而不是得出已存在执法的结论。Renascence
              报道董事会新增一名前监管人士和一名前大使，这是治理信号，但不能证明补救、合规测试或剩余风险降低。
            claimRefs:
              - CR011
