  summary: >-
    Plata is a Mexico-focused digital bank operating Banco Plata, with mobile-first consumer credit, Tarjeta Plata,
    installment financing, and deposit and debit services now layered on top of a full banking charter. The company
    reported a $405 million Series C at a $5 billion valuation in April 2026, more than 3.5 million active credit-card
