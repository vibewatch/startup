- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / signal
  - Public price or unit
  - Source type
  - Interpretation
  - What remains unknown
  rows:
  - - Cuenta Empresarial
    - No annuality; no opening minimum; MXN 5,000 average monthly balance expectation.
    - Official + legal
    - Entry pricing is low-friction, but economics still depend on balances and cross-sell.
    - Actual fee waivers, transaction revenue, and relationship profitability remain undisclosed.
  - - Cuenta PyME
    - MXN 5,000 opening amount; MXN 170 + IVA fee if average balance falls below MXN 2,500.
    - Official + legal
    - More explicit retail-SMB pricing signal than many fintech peers.
    - Net revenue per account, waiver frequency, and average balances remain undisclosed.
  - - Banca Kapital software
    - MXN 1,199/month + IVA.
    - Official
    - Clear list price for the software layer.
    - Paid-customer count, discounting, and software gross margin are not public.
  - - Crédito PyME
    - 3% opening fee; 58.3% CAT example on MXN 200,000 up to 36 months; insurance fee disclosed in example.
    - Official + legal
    - Lending economics are materially monetized in public view.
    - Realised APR by risk bucket, approval rate, and loss-adjusted yield are unknown.
  - - Crédito FLEX
    - Annual rate 30%; CAT 61.9%; disposition fee / prepayment penalties disclosed in example.
    - Official
    - Supplier-finance economics appear high-yield but also high-risk.
    - Average draw size, draw frequency, default rates, and net spread are not public.
  - - Factoring
    - Factoring CAT example and disposition fee disclosed; marketing promises early invoice cash-out.
    - Official
    - Factoring is an explicit monetization rail, not just a marketing adjacency.
    - Advance rate, collection duration, and anchor concentration are not public.
  - - FX transfers
    - Illustrative market rates only; no public client spread table.
    - Official
    - Kapital evidences capability but not realised FX pricing.
    - Spread, minimum fees, corridor economics, and treasury hedging costs remain undisclosed.
  - - Cards / payroll
    - No standalone public price found.
    - Official
    - Most likely bundled for retention or monetized indirectly.
    - Interchange economics, payroll fees, and attach rates are all undisclosed.
  notes: Public list pricing is strongest in lending and the software layer. FX, cards, and payroll remain economically visible only at the feature level.
