- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on analysis
  - Current public status
  - Exact diligence path
  rows:
  - - Consolidated revenue by stream
    - Prevents serious underwriting of revenue quality and diversification.
    - No retained source discloses stream-level revenue, ARR, or gross profit by stream.
    - Request monthly management accounts splitting software, deposit/payment, lending, factoring, FX, cards, payroll, and other income.
  - - Realised pricing versus list pricing
    - Blocks validation of take rates, discounting, and contribution margin.
    - List pricing is public for some products, but realised pricing is not.
    - Request realised-price cohorts, discount / waiver logs, and product P&Ls for software, FX, cards, and payroll.
  - - Group cash, burn, and runway
    - Makes financing dependency impossible to size.
    - No retained source discloses consolidated cash, monthly burn, or runway.
    - Obtain treasury reports, budget-to-actual burn, and scenario runway by legal entity.
  - - Product-level delinquency and loss curves
    - Prevents underwriting of reserve adequacy and lending durability.
    - Only a bank-wide 2.8% NPL ratio and 107.3% coverage ratio are public.
    - Request vintages, bucket migrations, recoveries, restructures, and concentration by lending product.
  - - Sales efficiency and CAC / payback
    - Stops meaningful comparison to other SMB fintechs.
    - No retained source discloses CAC, conversion, or payback.
    - Provide channel mix, CAC, sales compensation, activation, and payback by product line.
  - - FX, card, and payroll monetization
    - Leaves three visible workflow features economically unscored.
    - Capability is public; unit economics are not.
    - Provide FX volumes and spreads, active-card spend and interchange, payroll-account counts, and payroll-fee revenue.
  - - Non-Mexico entity contribution
    - Obscures whether the Mexico bank filing represents most of the economics or just one profitable core.
    - Public sources cite Colombia and U.S. reach but not segment P&Ls.
    - Request segment balance sheets, revenue, direct costs, and capital usage by country / entity.
  - - Covenants and holdco debt map
    - Leaves downside financing risk underexplained.
    - Independent coverage raises covenant and stress-scenario questions, but no debt schedule is public.
    - Obtain the full debt stack, covenant package, collateral map, and liquidity trigger thresholds.
  notes: Each row identifies a specific missing input that blocks standard fintech, SME-lending, or regulated-bank underwriting despite the unusually rich public disclosure set.
