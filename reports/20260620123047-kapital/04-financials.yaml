  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: group-runway
    missingEvidence: A consolidated group cash, debt, and monthly burn bridge after the 2025 Series C, with base and downside runway months.
    whyItMatters: Without holdco cash and burn, investors cannot tell whether the bank entity's liquidity offsets ecosystem build-out costs or whether another raise is already embedded.
    diligencePath: Request the monthly treasury report, board cash dashboard, debt schedule, and a 12-18 month runway model segmented by Mexico bank, Colombia, and U.S. operations.
    relatedQuestionRefs:
    - QI023
    - QI028
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: revenue-mix
    missingEvidence: A monthly revenue bridge splitting software subscription, deposit/payment fees, lending interest, factoring, FX, cards, payroll, and other services.
    whyItMatters: The visible product stack is broad, but public sources never show which rails actually drive revenue quality or whether high-risk balance-sheet income dominates.
    diligencePath: Request monthly management accounts with stream-level revenue, gross profit, and customer counts by product for the last 12 months.
    relatedQuestionRefs:
    - QI022
    - QI029
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
  - type: private-evidence-only
    severity: material
    topic: loss-curves
    missingEvidence: Vintage-level delinquency, charge-off, recovery, and restructuring data for Crédito PyME, Crédito FLEX, factoring, and cards.
    whyItMatters: Bank-wide NPL ratios are not enough to underwrite underwriting quality, reserve adequacy, or whether specific products are subsidising growth.
    diligencePath: Obtain the credit-risk pack by product, including vintages, roll rates, reserve methodology, and concentration by sector and obligor.
    relatedQuestionRefs:
    - QI024
    - QI030
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Realized FX spreads, card interchange/net revenue, payroll monetization, and discounting against list pricing.
    whyItMatters: Public list pricing does not reveal true take rates, contribution margins, or whether low-friction account economics rely on cross-subsidy from other products.
    diligencePath: Request product P&Ls showing list price, realised price, gross revenue, contra-revenue, and direct cost for FX, cards, payroll, and software.
    relatedQuestionRefs:
    - QI026
    relatedTableRefs:
    - TI001
    - TI002
    - TI003
    - TI005
