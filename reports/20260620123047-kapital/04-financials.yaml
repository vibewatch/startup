- id: cost-structure-unit-economics-and-public-traction
  title: Cost Structure, Unit Economics, and Public Traction
  body: 'Public evidence suggests Kapital''s economics are shaped more by banking and credit infrastructure than by a lightweight SaaS stack. The KPTL México Bank filing shows MXN 1,239 million of interest income in 1Q26 against MXN 867 million of interest expense, MXN 144 million of provisioning expense, and MXN 334 million of administration and promotion expense. That combination points to at least five cost buckets that matter for underwriting: deposit funding, credit losses, operating overhead, regulatory/compliance infrastructure, and treasury or market-making activity linked to FX and securities. Product pages add two more burdens. First, underwriting relies on CIEC access, tax data, statements, and guarantor structures, implying ongoing verification and servicing costs. Second, the business platform includes cards, payroll, supplier payments, invoice management, and projections, which widen the workflow but also widen customer-support and control obligations. Public traction is real:
    by September 2025 management and independent coverage were citing roughly 300,000 customers and a $3 billion balance sheet, while the 1Q26 bank filing showed MXN 71,946 million of assets, MXN 58,421 million of deposits, and MXN 25,786 million of net loans. But the visible traction is still not the same as public unit economics. No retained source discloses CAC, payback, churn, software gross margin, FX spread capture, card interchange net of incentives, or cohort loss curves by lending product. The result is a strong scale signal with only partial underwriting resolution.'
