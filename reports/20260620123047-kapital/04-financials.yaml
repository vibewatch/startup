- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Consolidated revenue / ARR
    - 'null'
    - low
    - Without a group revenue bridge, investors cannot test product mix, growth quality, or whether software is materially diversifying lending income.
    - Provide monthly consolidated revenue by stream and gross profit by stream for the last 12 months.
  - - Visible software list price
    - MXN 1,199/month + IVA
    - medium
    - Shows there is a software revenue rail, but not its scale or profitability.
    - Provide paying customers, average realised price, churn, and software gross margin.
  - - Bank-entity interest income
    - MXN 1,239m in 1Q26
    - medium
    - Demonstrates that balance-sheet economics are already material.
    - Break out interest income by product, sector, and credit type.
  - - Bank-entity provisioning expense
    - MXN 144m in 1Q26
    - medium
    - A real credit-loss line is visible, which makes loss curves central to underwriting.
    - Provide reserve methodology and vintage roll-rates by Crédito PyME, FLEX, factoring, and cards.
  - - Capital / liquidity buffer
    - 13.52% capital ratio; LCR 407; MXN 22,233m cash and equivalents
    - high
    - Shows the regulated bank is not obviously liquidity-constrained today.
    - Provide holdco cash, trapped-cash analysis, and any internal upstreaming restrictions.
  - - Customer / scale proxy
    - ~300,000 customers and $3bn balance sheet claimed in Sept. 2025 coverage
    - medium
    - Shows real reach, but not revenue per customer or cohort value.
    - Provide active-revenue customers, ARPA, and multi-product attachment by cohort.
  - - Sales efficiency / payback
    - 'null'
    - low
    - Capital-efficient GTM cannot be assessed without CAC, conversion, and payback data.
    - Provide blended CAC, channel mix, sales compensation, and payback by product family.
  - - Credit quality detail beyond NPL
    - Bank-wide NPL 2.8%; no product-level curves
    - medium
    - Bank-wide NPL is useful but too coarse for lending-product underwriting.
    - Provide delinquency buckets, recoveries, restructures, and concentration by product and sector.
  notes: Null values are deliberate where the public record remains silent. Non-null entries mix hard filing data with softer traction proxies and should not be treated as a full management reporting pack.
