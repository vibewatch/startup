- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Series C funding
    - Up to $100m at $1.3bn valuation in Sept. 2025.
    - medium
    - This is the main external equity signal for ecosystem expansion.
    - Provide the round documents, liquidation preferences, board rights, and any tranched close mechanics.
  - - Management-stated profitability and scale
    - Management said Kapital was profitable with ~300,000 customers and a $3bn balance sheet.
    - medium
    - Helpful context, but still management-sourced rather than consolidated audited proof.
    - Provide audited consolidated FY2025 / TTM P&L, balance sheet, and cash-flow statements.
  - - Regulated-bank liquidity
    - MXN 22,233m cash and equivalents at 1Q26.
    - medium
    - Shows the Mexico bank entity itself is liquid.
    - Provide entity-by-entity cash and any ring-fencing or upstream restrictions to holdco.
  - - Regulated-bank capital buffer
    - 13.52% capital ratio, LCR 407, and MXN 5,289m net capital in 1Q26.
    - high
    - Suggests the bank is above minimum capital and liquidity requirements.
    - Provide internal stress tests, management buffers, and trigger levels for fresh capital.
  - - Quarterly earnings support
    - MXN 533m 1Q26 net income for KPTL México Bank.
    - medium
    - Positive earnings support capital formation at the entity level.
    - Provide consolidated earnings bridge showing how much of group profitability comes from this bank entity.
  - - Off-balance-sheet credit commitments
    - MXN 4,830m at 1Q26.
    - medium
    - Commitments can pull future capital and liquidity into growth assets.
    - Provide undrawn commitment utilisation assumptions and contingent funding needs.
  - - Group cash / burn / runway
    - 'null'
    - low
    - This is the single largest remaining capital-adequacy blind spot.
    - Provide consolidated cash, monthly burn, budget-to-actual, and base/downside runway.
  - - Debt or other financing obligations
    - MXN 2,421m issued debt securities at the bank entity; no public holdco debt schedule found.
    - medium
    - Entity-level liabilities are visible, but group financing complexity is not.
    - Provide full debt stack, covenants, warehouse lines, guarantees, and intercompany funding map.
  notes: Historical funding is included only to frame forward adequacy. Public entity-level liquidity is meaningful, but it is not a substitute for a consolidated runway view.
