company:
  name: Kapital
chapter:
  number: 4
  title: Financials
  summary: 'Kapital has unusually rich public product and regulated-bank disclosure for a private fintech, but the evidence still stops short of full underwriting. Public pages and legal docs show monetization rails across business accounts, software, SME credit, factoring, FX, payroll, and card-linked workflows, while the 1Q26 KPTL México Bank filing adds real balance-sheet, earnings, liquidity, and credit-quality metrics. The core blocker is consolidation: public sources still do not show stream-level revenue mix, realised take rates, group cash, burn, runway, or product-level loss curves.'
sections:
- id: revenue-streams-pricing-and-hybrid-gtm
  title: Revenue Streams, Pricing, and Hybrid GTM Motion
  body: 'Kapital''s public monetization surface is broader than the usual SME neobank pitch. Official pages show at least six live or adjacent rails: business deposit accounts, a paid finance-management platform, SME term credit, revolving supplier finance, factoring, and FX transfers, with payroll and card controls embedded inside the same operating workflow. Importantly, these rails are not all priced the same way. The clearest explicit software price is MXN 1,199 per month plus VAT for the business platform, while account economics depend more on balance thresholds, transaction fees, and cross-sell. Cuenta Empresarial is marketed with no annuality and no opening minimum, but Cuenta PyME requires MXN 5,000 to open and charges MXN 170 plus VAT if the average monthly balance drops below MXN 2,500. Credit products are far more monetized in public view: Crédito PyME carries a 3 percent opening fee and a 58.3 percent CAT in Kapital''s own example, and public FLEX/factoring disclosures show
    high CATs and draw fees. GTM also looks hybrid rather than purely self-serve: clients can open online and manage operations digitally, yet the site repeatedly pushes advisor callbacks, executive help, CIEC-based data ingestion, and documentation-heavy underwriting. That combination suggests Kapital is selling a scalable SMB operating system, but one whose realised economics likely depend on lending and treasury cross-sell more than on software list pricing alone.'
