callouts:
- calloutType: insight
  title: Kapital is selling an SMB operating system, not just a checking account
  body: The public surface shows cross-sell across accounts, software, lending, FX, payroll, and cards. That breadth is strategically attractive because it can deepen retention and data advantage, but it also means investors need a stream-level revenue bridge rather than a single top-line number.
  claimRefs:
  - CI010
