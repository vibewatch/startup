tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / pricing basis
  - Current public value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Business deposit accounts
    - Float, balance-linked fees, payment activity, and ancillary banking services.
    - 'Cuenta Empresarial: no annuality; Cuenta PyME: MXN 5,000 opening amount and MXN 170 + IVA penalty below average-balance threshold.'
    - Visible and live, but realised account yield is undisclosed.
    - Medium — sticky rails exist, but public disclosure does not show net revenue per account.
    - Provide account-level ARPA, average balances, fee waivers, and transaction monetization by cohort.
  - - Banca Kapital software
    - Monthly subscription for analytics, payment automation, projections, and operating workflows.
    - MXN 1,199/month + IVA.
    - Explicit list price is public.
    - Medium — clearest list price, but no disclosed adoption, gross margin, or churn.
    - Provide paying-seat counts, attach rate to accounts, gross margin, and churn / retention by cohort.
  - - Crédito PyME
    - Interest income plus opening fee, insurance attachment, and potential penalty fees.
    - 'Public example: 3% opening fee; 58.3% CAT on MXN 200,000 up to 36 months.'
    - Live and explicitly priced.
    - Medium-high — credit revenue is real, but loss-adjusted returns are still undisclosed.
    - Provide net interest margin, default / recovery curves, and realised yield after provisions.
  - - Crédito FLEX / supplier finance
    - Revolving or staged credit for supplier payments and invoice financing.
    - Public disclosures reference up to 7 MDP, up to 12 months, annual rate 30%, and CAT 61.9% in an example.
    - Live and explicitly monetized.
    - Medium-high — pricing is visible, but utilisation and credit losses are not.
    - Provide utilisation, repeat draw rate, average ticket, NPL, and reserve assumptions.
  - - Factoring
    - Advance against receivables with fee and interest economics.
    - Marketing says invoices payable in up to 120 days can be monetized today; costs page shows factoring CAT example and disposition fee structure.
    - Product is live, but realised take rate is not public.
    - Medium — revenue mechanism is clear, realised spread is not.
    - Provide average advance rate, fee take, duration, losses, and concentration by anchor debtor.
  - - FX transfers
    - Transfer fees, FX spread, settlement services, and treasury activity.
    - Currencies disclosed; customer spread or markup not publicly disclosed.
    - Capability is live, economics are opaque.
    - Low-medium — useful adjacency, but no visible realised spread or volume revenue.
    - Provide FX volume, realised spread, hedging cost, and net revenue by corridor and currency.
  - - Cards and payroll workflows
    - Card interchange / net spend economics plus payroll-processing monetization or bundled retention value.
    - Feature presence is public; standalone pricing is not.
    - Workflow is visible, monetization is not.
    - Low until card and payroll take rates are disclosed.
    - Provide active cards, spend volume, interchange net of rewards, payroll accounts, and payroll monetization.
  notes: This table separates product visibility from monetization certainty. Public list pricing exists for some rails, but realised revenue mix is still undisclosed.
