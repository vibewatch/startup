  - CI012
  - CI040
- calloutType: risk
  title: The regulated-bank filing is strong, but it is not the full company
  body: KPTL México Bank disclosed healthy liquidity, capital, and profitability metrics in 1Q26, yet none of those numbers reveal holdco burn, cross-border segment economics, or the consolidated mix between software-like and credit-like revenue. Investors should resist treating entity-level strength as a proxy for group-level runway.
  claimRefs:
  - CI022
  - CI023
  - CI025
  - CI035
  - CI039
- calloutType: recommendation
  title: Demand a consolidated stream and loss bridge before underwriting the next round
  body: The key diligence pack should include monthly revenue mix, realised pricing, holdco cash and burn, and product-level loss curves for Crédito PyME, FLEX, factoring, and cards. Without those, the investment case rests too heavily on management-sourced scale and profitability claims.
  claimRefs:
  - CI034
  - CI035
  - CI036
  - CI045
