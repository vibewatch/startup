  topStrengths:
    - 持有受监管银行资产叠加工作流软件，使 Kapital 的基础设施护城河比许多仍依赖第三方轨道的 LatAm SMB 金融科技同行更完整。
    - 公开 1Q26 银行指标显示真实存款、贷款、资本、流动性和盈利，不只是增长叙事。
    - Tribe Capital、Pelion Ventures、Y Combinator 等风险投资方反复支持，验证了公司继续获取增长资本的能力。
    - Mexico 及更广泛 LatAm SMB 银行服务在信贷、运营软件和数字资金管理上仍渗透不足，支撑结构性需求。
  topRisks:
    - 合并收入、ARR、股权结构表和优先股堆叠披露仍太薄，无法高置信度给出后期入场定价。
    - Intercam 交易把卖方遭美国反洗钱行动后的合规、整合和声誉风险一并带入。
    - 据报道 2024 年发生的数据暴露事件削弱了这家受监管、重身份数据贷款机构的信任与控制叙事。
    - SME 信贷增长快、产品重担保人、公开 vintage 数据有限，承销和催收质量仍未充分证明。
  unresolvedGaps:
    - 合并收入、ARR、收入流构成，以及控股公司烧钱速度或现金跑道，在保留公开来源中仍未披露。
    - 完全摊薄股权结构表、Series C 清算优先权和更广泛优先权悬挂未公开。
    - 公开证据没有展示 2025–2026 信贷 vintage、欺诈拆分、催收曲线或产品级损失表现。
    - 董事会委员会结构、当前股权图谱和监督细节，仍有部分无法从公开治理材料取得。
    - Intercam 整合 KPI、客户重叠度和收购后资产质量影响，目前仍无法公开量化。
