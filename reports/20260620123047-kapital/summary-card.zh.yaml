summary:
  headline: Kapital 看起来像真正的全栈 SMB 银行平台：既有受监管银行的盈利和规模，也有软件工作流；但公开证据仍缺合并收入、股权结构表和优先股堆叠细节，无法激进承销 2025 年 9 月的独角兽价格。
