  - id: exit-readiness-kill-triggers-and-diligence
    title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
    body: |
      Exit readiness is improving, but it is not yet investment-committee clean. The combination of a unicorn round, a
      regulated-bank disclosure layer, and broader financial-group ambitions means internal expectations are moving from
      private growth financing toward public-market eligibility. The problem is that 2026 market conditions are selective, not
      forgiving.
      Eqvista's late-stage market note explicitly argues that the IPO window rewards readiness, punishes stale private marks,
      and forces companies without governance and disclosure readiness into dual-track or bridge-financing behavior. Kapital can
      likely tell a stronger IPO story than many fintechs because it has regulated-bank filings and visible profitability, but
      the public record still looks too thin on consolidated economics and shareholder structure.

      The thesis-break triggers are measurable. A down-round or structured bridge below the US$1.3 billion mark would show that
      the last round is not holding. Evidence of integration or compliance slippage at Intercam would undercut the premium case
      for becoming a broader financial group. A deterioration in bank capital, liquidity, or asset quality would matter because
      the bank is the main public anchor supporting today's valuation. And any new security incident would directly weaken the
      claim that Kapital deserves an AI- or infrastructure-led valuation premium.

      Final diligence should therefore focus less on another marketing deck and more on missing underwriting mechanics. The
      highest-priority asks are consolidated revenue and ARR, the fully diluted cap table, Series C preferences and liquidation
      waterfall, cohort-level credit and deposit quality after the acquisition wave, and explicit proof that the profitable
      regulated-bank layer can actually translate into holdco cash generation. Those are the items that can convert a plausible
      price into an attractive entry.
