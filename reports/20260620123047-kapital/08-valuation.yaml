      - ["Public evidence still lacks consolidated revenue run rate or ARR, so software-style price support is weak.", anti-thesis, "A disclosed consolidated revenue bridge and product mix would directly improve valuation support."]
      - ["The fully diluted share count, preference stack, and Series C liquidation terms are not public.", anti-thesis, "A clean cap-table and preference-waterfall disclosure would narrow return uncertainty."]
      - ["Intercam integration and sanctions-adjacent compliance work can destroy value if execution slips.", anti-thesis, "Clean integration KPIs, stable asset quality, and regulatory comfort would soften the discount."]
      - ["The Cybernews exposure weakens any claim to an automatic AI or infrastructure premium.", anti-thesis, "Independent proof of remediated controls and no repeat incidents would reduce this risk."]
    notes: >-
