callouts:
  - calloutType: recommendation
    title: Track the company, not the 2025 round narrative
    body: >-
      Kapital has enough disclosed bank-quality evidence to stay investable, but not enough consolidated economic and cap-table
      evidence to justify paying up at the last disclosed round. The right near-term posture is disciplined monitoring rather
      than enthusiasm.
    claimRefs:
      - CV005
      - CV013
      - CV014
      - CV046

  - calloutType: risk
    title: ARR, dilution, and preference opacity are the real blockers
    body: >-
      The main reason to stop short of a buy call is not a weak business; it is that public evidence still cannot answer the
      three return-defining questions of consolidated revenue quality, fully diluted ownership, and liquidation overhang.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV045

