      - ["Holdco cash conversion", "No public bridge from regulated-bank earnings to group cash generation and usable upstream dividends", "A profitable bank does not automatically mean attractive equity free cash flow", "Treasury and legal memo on upstreaming constraints and intercompany structure"]
