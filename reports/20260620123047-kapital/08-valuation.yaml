      - ["Fully diluted cap table", "No public share count, option pool, convertibles, or post-Series C ownership map", "Return math and dilution cannot be modeled", "Finance team cap-table export plus counsel-confirmed share classes"]
      - ["Series C terms", "No liquidation preference, anti-dilution, or participation detail for the US$1.3B round", "Preference overhang can erase apparent entry upside", "Lead-investor side letter or financing documents"]
