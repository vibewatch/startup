  title: Valuation
summary: >-
  Kapital's September 2025 US$1.3 billion Series C is not obviously detached from reality: the company can point to 300,000
  customers, a US$3 billion balance-sheet claim, and a regulated Mexican bank entity that reported 1Q26 profitability,
  capital, and liquidity metrics stronger than most private fintechs disclose. The problem is not that the round looks
  implausible; it is that public evidence still stops before the consolidated metrics investors need to underwrite entry
  price, dilution, and exit value with confidence. Public and private fintech comparables therefore support a track call
  with medium confidence, high risk, and a fair valuation stance rather than an outright buy.
sections:
  - id: thesis-recommendation
    title: Investment Thesis, Anti-Thesis, and Recommendation
    body: |
      Kapital's investable thesis is stronger than a normal late-stage private fintech because the business now has real
      regulated-bank disclosure underneath the venture narrative. The retained evidence shows a September 2025 Series C of up
      to US$100 million at a US$1.3 billion valuation, customer reach of 300,000, a US$3 billion balance-sheet claim, and a
      1Q26 Mexican bank filing with MXN 71.946 billion of assets, MXN 58.421 billion of deposits, MXN 25.786 billion of net
      loans, and MXN 533 million of quarterly net income. That combination matters: unlike many private neobanks, Kapital can
      point to disclosed balance-sheet scale, profitability, and regulatory capital rather than just revenue claims and user
      growth.

      The anti-thesis is that investors still cannot bridge those bank-level metrics to the consolidated equity story that the
      US$1.3 billion round is actually pricing. Public sources do not disclose consolidated revenue run rate or ARR, the fully
      diluted share count, the post-Series C ownership map, or any liquidation preferences and preference overhang across the
      venture stack. The Intercam transaction also imports integration and compliance risk, while the December 2024 Cybernews
      exposure weakens any claim that Kapital deserves an AI or infrastructure premium simply because it owns more of the
      regulated stack.

      The right conclusion is therefore price-sensitive rather than company-quality-sensitive. Kapital looks like a real
      financial platform with enough operational proof to justify continuing diligence, but not enough disclosure to justify a
      buy at the last disclosed round price. The recommendation is track with medium confidence, a high risk rating, and a
      fair valuation stance. A cheaper entry, or a new disclosure package that closes the ARR, cap-table, and preference-stack
      gaps, would move the call more than another generic growth headline would.
