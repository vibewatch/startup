  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              For Kapital, the relevant market is not “all fintech” or even all business banking. The tighter boundary
              is SMB operating finance: business accounts, spend controls, supplier payments, collections,
              short-duration working-capital credit, and the data layer that turns payment activity into underwriting
              and workflow automation. This boundary matters because the buyer is solving a daily operating problem —
              how to get paid, pay suppliers, manage cards and cash, and unlock credit without heavy paperwork — rather
              than shopping for a long-term treasury relationship or a consumer bank account. The World Bank and IFC
              frame SME finance as a core development and productivity bottleneck, while also highlighting that open
              finance, embedded finance, and alternative credit rails can lower working-capital frictions for small
              firms.

              Mexico is the clearest core market in the evidence reviewed. INEGI's 2024 economic census recorded 7.09
              million establishments and 5.51 million private-sector/parastatal economic units, while local 2026
              industry reporting tied to Plan México sizes the SME base at roughly 4.9 million firms that account for
              99.8% of the business landscape and 72% of formal employment. Colombia is a natural adjacent market
              because the formal business base is large enough to be strategic — 1.74 million active firms in 2024 per
              Confecámaras — but still shows meaningful financing and payments frictions, especially for micro and small
              companies. The U.S. context is relevant mainly as a comparator and corridor: 5.58 million firms with 1-499
              employees existed in 2023, and those firms made up 99.7% of employer establishments, but the broad U.S.
              business-banking universe is too large and too mature to treat as Kapital's evidenced core SAM without
              company disclosures.

              The status-quo alternative is still the incumbent bank account combined with manual processes: cash
              collection, spreadsheet reconciliation, branch-based service, card acquirers that do not solve
              working-capital needs, and separate credit applications that do not reuse transaction data. In Mexico,
              this status quo remains sticky because 80% of transactions are still cash-based and 30% of the population
              reports digital-security concerns. In Colombia, the problem is not lack of formal-firm registration so
              much as shallow product depth: many firms have a deposit relationship, but far fewer have active credit.
              In the U.S., the comparator evidence is that digital lender access has improved convenience, yet pricing
              surprises and lender dissatisfaction persist. Together these facts imply Kapital competes less with a
              single neobank and more with fragmented incumbent relationships plus cash-heavy workflows.
            claimRefs:
