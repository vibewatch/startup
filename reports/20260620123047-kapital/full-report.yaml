  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round or structured bridge
        - New financing below the US$1.3B mark or with punitive terms
        - Shows that the last round is not holding and raises preference-stack risk
        - Move from track to avoid until the new waterfall is understood
      - - Intercam integration slippage
        - Regulatory, AML/KYC, or customer-migration problems tied to the acquired assets
        - Breaks the premium case for becoming a broader financial group
        - Pause underwriting and re-cut the bear case
      - - Asset-quality deterioration
        - Capital, liquidity, or credit metrics worsen materially from the 1Q26 bank baseline
        - Removes the main public profitability anchor supporting the round
        - Treat as a major valuation reset signal
      - - Security / data-control failure
        - Repeat high-severity incident after the 2024 leak
        - Undercuts AI-premium and compliance narratives at once
        - Increase discount rate and require third-party control audit
      - - IPO-ready evidence fails to appear
        - No disclosure progress on revenue, cap table, or governance despite IPO messaging
        - Turns the IPO narrative into a marketing claim rather than an exit path
        - Keep the company on track/research-more instead of upgrading
    notes: Triggers are framed to be monitorable from public or diligence-channel evidence rather than generic macro fear.
    claimRefs:
      - CV008
      - CV011
      - CV012
      - CV036
      - CV044
      - CV048
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Consolidated revenue / ARR
        - No retained public source discloses group revenue run rate, ARR, or product-level mix
        - Without this, software-style or blended fintech multiples cannot be defended
        - Management data room; audited or board-level KPI pack
      - - Fully diluted cap table
        - No public share count, option pool, convertibles, or post-Series C ownership map
        - Return math and dilution cannot be modeled
        - Finance team cap-table export plus counsel-confirmed share classes
      - - Series C terms
        - No liquidation preference, anti-dilution, or participation detail for the US$1.3B round
        - Preference overhang can erase apparent entry upside
        - Lead-investor side letter or financing documents
      - - Intercam integration KPIs
        - No public schedule for customer migration, compliance remediation, or branch/asset performance
        - This is the main swing factor in the platform-upside case
        - Integration workstream review with risk and operations leads
      - - Asset quality by vintage
        - No public NPL, reserve, or charge-off bridge by acquired versus originated books
        - Investors cannot tell whether reported profitability is durable
        - Credit committee materials and vintage tables
      - - Holdco cash conversion
        - No public bridge from regulated-bank earnings to group cash generation and usable upstream dividends
        - A profitable bank does not automatically mean attractive equity free cash flow
        - Treasury and legal memo on upstreaming constraints and intercompany structure
    notes: >-
      The first three asks are blocking for precise valuation work; the latter three determine whether Kapital deserves
      to trade closer to a bank, a software-led fintech, or a hybrid discount.
    claimRefs:
      - CV013
      - CV014
      - CV015
      - CV038
      - CV045
      - CV049
