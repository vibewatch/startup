      - number: '3.4'
        title: Moat durability, multi-homing risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >
              The adverse evidence in this landscape is not that one rival already dominates every layer; it is that
              every

              layer Kapital wants to own is being strengthened by a different competitor. Konfío is explicitly trying to
              move

              from lending into deposits and treasury. Clip already couples regulated money movement, terminals, and
              merchant

              cash-flow lending. Conekta makes local online-payment economics legible and argues it outperforms global
              processors

              on Mexican authorization and chargeback dynamics. Nu Mexico is still consumer-only in public product
              terms, yet its

              scale and bank-transition spending show how quickly a trusted consumer brand can accumulate distribution
              power.

              Incumbents continue to anchor buyer trust with full-bank status and published fee schedules, while Adyen
              keeps

              pushing farther into orchestration and AI-enabled commerce.


              That leaves Kapital with a real but fragile moat. Its strongest differentiation is bundle convergence: a
              buyer can

              see credit, corporate card, factoring, accounts, FX, and digital banking on one surface. The problem is
              that the

              public evidence does not yet show the kind of hard lock-in that would stop a merchant from mixing Kapital
              credit

              with Clip terminals, Conekta checkout, and a BBVA or Santander operating account. In other words, the moat
              is

              executional, based on how well Kapital converts its bundle into primary-account behavior, not structural
              in the

              sense of a regulatory charter, unique payment rail, or irreplaceable distribution channel. Investors
              should treat

              competitive durability as improving only if Kapital can show attachment, retention, and primary-bank share
              of wallet.
