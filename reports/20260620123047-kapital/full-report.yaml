      - number: '1.5'
        title: Adverse Signals and Evidence Gaps
        blocks:
          - type: paragraph
            body: >
              This chapter has two material adverse signals. First, Cybernews reported in December 2024 that researchers
              found

              an exposed Google Cloud Storage bucket attributed to Kapital containing roughly 1.67 million files,
              largely voter

              IDs and selfies used for verification. Cybernews says it sent multiple disclosure notices and contacted
              CERT-MX

              before publication without receiving a response from Kapital. On its face, that is a meaningful
              operational-risk

              signal for any company positioning itself as an AI-enabled regulated financial institution, because it
              cuts against

              the company's compliance-and-infrastructure narrative.


              Second, the Intercam acquisition may be strategically smart but it imports compliance and reputation risk.
              Several

              retained sources frame the deal in the context of U.S. sanctions and money-laundering allegations against

              Intercam. Even where the criticism is directed primarily at Intercam or the wider Mexican banking crisis,
              Kapital

              still becomes the integrating buyer that must prove customer onboarding, AML/KYC, and asset vetting work
              as

              promised. This does not invalidate the growth story, but it does mean later chapters should test whether
              the 2026

              financial acceleration came with elevated integration or conduct risk.


              Important overview gaps remain unresolved. Public sources do not give a clean, accessible 2026 employee
              count,

              a full board composition, a reconciled lifetime-funding table, or a clearly disclosed post-Series C cap
              structure.

              Some local profiles even drift on founding year and valuation, reporting 2019 or $1.35 billion where
              higher-

              quality fundraising coverage points to 2020 and $1.3 billion. The correct diligence posture is to preserve
              those

              inconsistencies explicitly rather than flatten them into a single polished company narrative.
