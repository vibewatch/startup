      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Kapital's public financial case is stronger than that of a typical private fintech because the business
              discloses real banking-product pricing and a real licensed-bank filing rather than only growth marketing.
              That is the positive. The negative is that the public record still does not show the consolidated
              economics that matter for equity underwriting. Investors can see that there are multiple monetization
              rails and that the regulated bank has real scale, liquidity, profitability, and acceptable credit metrics;
              they cannot see which rails actually generate durable high-quality earnings, whether software meaningfully
              diversifies the lending model, or how much cash the broader group burns to keep expanding. That gap
              matters because management's profitability claim, the $3 billion balance-sheet claim, and the
              300,000-customer claim all sit alongside unresolved questions on stream mix, realised spreads,
              product-level delinquencies, and holdco runway. The complaint record is not alarming, but it is also not
              zero-risk: the Buró disclosure logged 310 complaints in 2025, and independent coverage still highlighted
              that credit investors care about covenants and cash-flow stress scenarios. The right financial verdict is
              therefore constructive but conditional: Kapital appears to have built a real banking-and-software revenue
              engine, yet the case still depends on private evidence before investors can underwrite revenue quality,
              margin durability, and financing independence with confidence.
