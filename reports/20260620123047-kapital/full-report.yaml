      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Kapital's public record provides more balance-sheet evidence than most private fintechs, but the evidence
              is split between a regulated Mexican bank entity and holdco-level fundraising announcements. On the
              regulated-entity side, the picture is presently solid: KPTL México Bank reported MXN 22,233 million of
              cash and equivalents, a 13.52 percent capital ratio, a liquidity coverage coefficient of 407, and MXN
              5,289 million of net capital in 1Q26. Deposits continued to grow quarter on quarter, and the entity
              generated MXN 533 million of quarterly net income. HR Ratings also showed a Stable outlook and HR A+
              rating in March 2026. On the holdco side, the main public signal is the September 2025 Series C of up to
              $100 million at a $1.3 billion valuation, which management and multiple news outlets said would accelerate
              AI-powered ecosystem build-out. That new capital reduces obvious near-term financing pressure, but it does
              not close the core diligence loop. Public sources still do not disclose consolidated group cash, burn,
              runway, covenant headroom, or the capital intensity of non-Mexico operations. Nor do they show how much of
              the group's growth depends on further acquisitions, off-balance-sheet commitments, or credit expansion.
              Financially, the right reading is that the Mexico bank looks fundable and liquid, but the group's
              next-round dependency cannot be sized from public evidence alone.
