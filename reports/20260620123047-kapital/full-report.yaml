      - number: '8.3'
        title: Bull, Base, Bear Cases and Comparable Set
        blocks:
          - type: paragraph
            body: >
              Comparable evidence points to a middle-ground read on Kapital's price. Public LatAm and digital-banking
              comps span a

              very wide quality range: Nu and MercadoLibre trade at enormous scale because they combine broad
              distribution with proven

              earnings engines, while StoneCo, PagBank, and LendingClub show what more focused payments, SMB, and
              digital-bank models

              can command in public markets. Private comps are also mixed. Ualá's March 2026 round valued a full-stack
              LatAm neobank

              at US$3.2 billion, Mercury's May 2026 Series D valued a profitable U.S. SMB banking fintech at US$5.2
              billion, and Clara

              still screens around a US$1 billion value in Tracxn despite a later debt raise. Kapital's US$1.3 billion
              price sits

              above Clara, below Ualá and Mercury, and far below scaled public winners.


              That placement is directionally sensible but not self-validating. Customer-value lenses are especially
              revealing.

              Kapital's last disclosed round implies roughly US$4.3 thousand per customer using the 300,000-customer
              figure. That is

              materially richer than mass-market LatAm neobanks such as Nu or Ualá, but still much cheaper than
              Mercury's SMB-focused

              customer value. The implication is that the market is already pricing Kapital as a higher-value business
              customer and

              balance-sheet platform rather than a commodity retail neobank. That can be reasonable, but only if
              underwriting,

              attachment, and retention really are better than the public record can currently prove.


              The scenario range therefore stays deliberately disciplined. The bear case assumes integration,
              compliance, or credit

              quality problems push Kapital into a flat or down-round outcome. The base case assumes the 1Q26
              profitability signal is

              durable but not yet enough to unlock a premium rerating. The bull case requires consolidated earnings
              visibility,

              successful Intercam integration, and a credible IPO or strategic-exit path in a 2027-2028 window. With the
              stock of

              public evidence available today, the base case clusters around the last round rather than far above it.
