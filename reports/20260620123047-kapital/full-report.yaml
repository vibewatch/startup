  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute set
        blocks:
          - type: paragraph
            body: >
              Kapital is not fighting a single peer group. In Mexico's SMB finance stack, buyers can solve the same job

              through at least five wedges: a credit-led fintech such as Konfío, a merchant operating stack such as
              Clip,

              a payments orchestration layer such as Conekta or Adyen, a full-bank incumbent such as BBVA, Santander, or

              Banorte, and an adjacent consumer-to-bank brand such as Nu that could later extend into business banking.

              Kapital's own official surfaces show why that overlap matters: it sells business credit, a corporate card,

              factoring, and business accounts on one brand surface rather than as a single-purpose product. That means

              the real competitive question is who can become the primary operating account for the SMB, not who matches

              one isolated feature.


              The strongest near-term substitutes are the firms that already own a daily workflow. Konfío owns the
              credit

              relationship and is trying to add deposits and treasury; Clip owns in-person acceptance and same-day
              merchant

              settlement; Conekta owns online checkout, SPEI, and cash collection rails; BBVA and Santander own
              regulated

              deposit accounts and merchant acquiring; Adyen owns omnichannel acceptance for more sophisticated
              merchants.

              Nu Mexico is not yet a public business-banking competitor, but its licensed-bank transition and scale
              still

              matter because it could compress customer acquisition economics if it enters SME products later. This
              means

              Kapital must defend against unbundled multi-homing almost as much as against direct one-to-one
              displacement.
