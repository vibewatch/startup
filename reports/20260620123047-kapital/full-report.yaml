      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer/user/payer pattern is more concentrated in this market than in large- enterprise software. In
              Mexico's micro and small businesses, the owner-manager is usually the buyer, the operational user, and the
              ultimate payer, even if a bookkeeper or family member helps with reconciliation. In somewhat larger
              Mexican SMEs and in Colombian legal entities, the user base broadens to include finance, operations, and
              procurement staff, but budget ownership still tends to sit with the founder, legal representative, or
              finance head. The U.S. comparator market is similar for firms with fewer than 500 employees: financing
              demand is often driven by immediate operating needs rather than centrally planned capital budgeting.

              What these users buy is not just a bank account. They buy speed, certainty, and data reuse. Mastercard's
              Latin American SME research shows that 93% of SMEs that already accept digital payments see those rails as
              essential or very important, 84% believe they could not stay in business without them, 75% rely on them to
              pay suppliers, and 88% link them to access to credit. Those results matter because they show the wallet
              owner is not optimizing for lowest nominal account fee; the buyer is optimizing for continuity of trade,
              checkout conversion, and downstream financing. In the Mexico/Central America/Caribbean acceptance study,
              nearly 11 million businesses could still benefit from expanded digital acceptance and 77% did not yet
              accept digital payments, which leaves a large onboarding wedge before a lender or operating-finance
              platform can become system-of-record.

              The adoption trigger therefore varies by segment. Cash-heavy merchants move when customers demand card or
              digital acceptance. Growth SMEs move when supplier payments, reconciliation, and credit requests become
              too manual. Colombian formal firms move when interoperable payment rails and open-finance rules make
              multi-bank workflows easier. U.S.-linked cross-border SMBs move when delays, opacity, and FX/fee drag on
              supplier payments become painful enough to justify switching. Trust is central across all of these
              segments: Mastercard's 2026 study found that 88% of payment-accepting SMEs prioritize trustworthiness and
              scalability in a provider, while Mexico's public-policy discussion still describes trust and behavior
              change as the main adoption bottleneck rather than raw technical availability.
