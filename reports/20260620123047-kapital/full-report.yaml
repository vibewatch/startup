  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Kapital’s strongest customer motion starts with SMB acquisition around accounts or credit, then deepens into daily
      workflow, treasury, and expansion products.
    data:
      items:
        - id: discover
          label: Discover
          actor: SMB owner or finance lead
          description: >-
            Prospects encounter Kapital through SME banking marketing, chamber or ecosystem referrals, and
            country-specific digital surfaces in Mexico or Colombia.
          channels:
            - Official product pages
            - Chamber / ecosystem referrals
            - Customer stories
        - id: onboard
          label: Open account / qualify
          actor: Legal representative and finance admin
          description: >-
            The relationship often begins with Cuenta PyME, Cuenta Empresarial, or Crédito PyME onboarding, which
            requires tax and identity documents rather than a branch-heavy process.
          channels:
            - Cuenta PyME
            - Cuenta Empresarial
            - Crédito PyME
        - id: operate
          label: Operate daily workflows
          actor: Ops, treasury, and admin teams
          description: >-
            Customers move into payments, payroll, supplier management, invoicing, treasury, and online banking once the
            account is live.
          channels:
            - Banca Empresarial
            - Banca en Línea
            - Payroll / supplier tools
        - id: expand
          label: Expand product usage
          actor: CFO, founder, controller
          description: >-
            Higher-value customers can add FX, working-capital credit, debit cards, factoring, or Colombia-specific
            offerings as operational complexity grows.
          channels:
            - FX
            - Crédito PyME
            - Colombia stack
        - id: retain
          label: Retain or reassess
          actor: Customer and support teams
          description: >-
            Retention appears to depend on embedded workflow depth and support quality, but public evidence here is
            indirect and partially offset by mixed app reviews and complaint data.
          channels:
            - Support service
            - Mobile apps
            - Regulatory complaint channels
