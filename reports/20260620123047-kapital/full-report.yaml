  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Layered view of how Kapital packages regulated-bank products, enterprise workflows, and mobile surfaces into one
      SME finance stack.
    data:
      layers:
        - id: access-layer
          label: Access and onboarding layer
          detail: Cuenta PyME, Cuenta Empresarial, onboarding flows, and mobile / web entry points for regulated customers.
        - id: operations-layer
          label: Operations workflow layer
          detail: >-
            Banca Empresarial manages payroll, supplier invoices, scheduled payments, cards, dashboards, and
            projections.
        - id: banking-control-layer
          label: Banking control layer
          detail: >-
            Banca en línea, token / softtoken, SPEI controls, account notifications, and support / clarification
            channels.
        - id: capital-layer
          label: Capital and treasury layer
          detail: >-
            Crédito PyME, Crédito FLEX, factoring, deposit balances, and FX transfer workflows sit beside the operating
            account.
        - id: group-layer
          label: Group integration layer
          detail: >-
            Bank, brokerage, deposit franchise, and acquired operating platform are described by Moody's as integrated
            and harmonized.
    approximationNotes: >-
      Kapital does not publish a canonical architecture diagram; the stack is inferred from official workflow pages, app
      surfaces, and ratings commentary.
    claimRefs:
      - CE001
      - CE011
      - CE012
      - CE015
      - CE019
      - CE027
      - CE029
      - CE032
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: End-to-end SME flow from regulated account opening into operations, card control, financing, and support.
    data:
      nodes:
        - id: onboard
          label: Business opens Cuenta PyME or Cuenta Empresarial
        - id: activate
          label: User activates platform, token, and digital channels
        - id: operate
          label: Team runs transfers, payroll, supplier payments, and invoice workflows
        - id: cards
          label: Admin creates, funds, and monitors employee or business cards
        - id: finance
          label: Business requests Crédito PyME, FLEX, factoring, or FX transfers when needed
        - id: support
          label: Issues route to support, clarifications, branch help, or CONDUSEF escalation
      edges:
        - from: onboard
          to: activate
          label: Account and access setup
        - from: activate
          to: operate
          label: Web and mobile channels unlock daily operations
        - from: operate
          to: cards
          label: Spend control is embedded into the same workflow
        - from: operate
          to: finance
          label: Cash-flow gaps can trigger credit, factoring, or FX products
        - from: finance
          to: operate
          label: Capital products feed back into working-capital operations
        - from: operate
          to: support
          label: Clarifications and disputes use official support channels
    approximationNotes: >-
      The flow compresses multiple retained official pages into one user journey because Kapital publishes the
      components separately rather than as a single operating diagram.
