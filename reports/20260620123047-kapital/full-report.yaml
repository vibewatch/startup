    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Footprint
        blocks:
          - type: paragraph
            body: >
              Kapital's core identity is now best described as a hybrid of bank, lending platform, and operating
              software for

              small and medium-sized businesses. TechCrunch's 2023 coverage framed the company as a Mexico City fintech
              founded

              in 2020 by René Saúl and Fernando Sandoval to give SMBs large-enterprise style visibility into cash flow,
              credit,

              invoicing, and operating decisions. CNBC's 2024 Disruptor 50 profile and later 2025 funding coverage show
              the

              platform broadening from credit and cash-management tooling into a fuller bundle spanning accounts, cards,
              payroll,

              benefits, and AI-assisted underwriting. The retained official governance page also shows Kapital
              presenting itself

              as a group with business and consumer products across accounts, credit, FX, investments, digital banking,
              and AI.


              The clearest strategic through-line is that management did not want to remain a thin software layer on top
              of

              incumbent banking rails. Instead, Kapital's product positioning combines workflow software with regulated
              balance-

              sheet products. TechCrunch described this explicitly in 2023: the founders wanted SMEs to have one place
              for cash

              flow, credit, and investment needs, while later company materials described Kapital as a technology-first
              bank.

              That distinction matters for the rest of the report because later chapter conclusions on economics,
              underwriting,

              and defensibility should treat ownership of banking infrastructure as a central claim, not just a
              marketing phrase.


              Geographic evidence also shows a shifting operating footprint that tracks the company's acquisition-led
              expansion.

              2023 sources referenced Mexico, Colombia, and Peru, while 2025 round reporting instead emphasized Mexico,

              Colombia, and the U.S. That is not necessarily a contradiction; it likely reflects changing priorities and
              which

              jurisdictions had meaningful activity at each disclosure date. What is well supported is that Mexico is
              the

              operational center of gravity and that the company increasingly pitches itself as a regulated group rather
              than a

              single-product fintech app.
