  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Core customer segmentation is SMB-first, with enterprise, cross-border, and consumer-adjacent spillover
        blocks:
          - type: paragraph
            body: >-
              Kapital’s public customer map is broad, but the center of gravity is still small and medium-sized
              businesses rather than general retail banking. Multiple independent and official surfaces converge on that
              point. Mexico Business News says Kapital “proudly targets only SMEs,” while TechCrunch described the
              company in 2023 as serving small businesses across Mexico, Colombia, and Peru. Sacra narrows the
              product-market-fit archetype further, describing Latin American SMBs with roughly 10-100 employees and USD
              2-10 million in revenue as the sweet spot. Official product pages then show how Kapital slices that base
              in practice: Cuenta PyME serves small companies and PFAEs, Cuenta Empresarial serves larger legal-entity
              operators, Banca Empresarial wraps payments, supplier management, analytics, and payroll into one
              operating layer, and the FX page targets businesses paying suppliers or receiving income in multiple
              currencies.


              The important nuance is that Kapital is no longer only an SMB bank in the narrowest sense. Its
              online-banking page still advertises services for both companies and individuals, the bank report
              explicitly separates commercial books into Empresarial and PyME while also carrying consumer portfolios
              such as auto, personal, and payroll, and the Colombia site adds debit cards, payroll, factoring, and a
              community/workspace layer. Customer segmentation therefore works best across buyer, user, and use-case
              dimensions: owner-managers and finance teams buy the relationship, operators use treasury and workflow
              tools, employees may touch payroll or cards, and some acquired retail or wealth customers now sit adjacent
              to the core SMB thesis. What remains undisclosed is the exact customer split by segment, geography, and
              monetization layer, so the segment map is directionally strong but numerically incomplete.
