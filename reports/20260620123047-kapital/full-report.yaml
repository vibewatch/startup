      - number: '6.5'
        title: Expansion levers are visible, but concentration and definition risk still cap conviction
        blocks:
          - type: paragraph
            body: >-
              Kapital’s expansion logic is one of the more convincing parts of the customer story. The same relationship
              can start with an account, move into treasury or FX, add payroll, then deepen into working-capital credit,
              supplier finance, and analytics. Official pages repeatedly market that bundled motion. Cuenta Empresarial
              and Cuenta PyME promise operating accounts; Banca Empresarial layers analysis, payment calendars, supplier
              administration, cards, and payroll; Crédito PyME and FX add liquidity and treasury adjacency; and Sacra
              argues the broader multi-product strategy is intended to expand revenue per customer over time. The
              Colombia page shows the same pattern in another market, combining factoring, credit, Flex, debit cards,
              payroll, and workflow tools. From a strategic lens, Kapital is trying to become the finance operating
              system for SMEs rather than a single-product lender.


              The risk is that public evidence on customer concentration and expansion quality is still partial. The
              bank’s 1Q26 report explicitly says two individual clients or economic groups had exposures above 10% of
              Tier 1 capital, and the same report says management wants to diversify the client base and prioritize
              public deposits to mitigate concentration risk. That is valuable disclosure, but it does not answer the
              deeper underwriting questions: what share of revenue comes from the top 10 customers, how concentrated are
              deposits or loan balances by sector, how much of the 300,000-customer headline is active and monetized,
              and whether cross-sell increases lifetime value without raising support burden. Until those questions are
              answered, Kapital’s customer thesis is best graded as broad and promising on acquisition, but still
              under-documented on durability and concentration.
