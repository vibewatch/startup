      - number: '6.4'
        title: Durability evidence is thinner than growth proof, and adverse app or complaint signals deserve attention
        blocks:
          - type: paragraph
            body: >-
              Kapital’s weakest public customer disclosure is retention and satisfaction. There is no disclosed NRR,
              GRR, logo retention, churn, renewal duration, or cohort table in any retained chapter source. The
              available proxies are therefore indirect: recurring-workflow product design, public customer quotes,
              app-store ratings, and complaint disclosures. The strongest positive proxies are product depth and
              embedded workflow. Banca Empresarial includes supplier-pay management, projections, payroll, and one-click
              invoice workflows, Banca en Línea handles treasury and utility payments, and the FX page is designed for
              businesses that repeatedly move money across currencies. Those are sticky motions if customers adopt them
              deeply. Mexico Business News also quotes management saying the company learns from questionnaires,
              chatbots, and complaints to improve the platform, which at least suggests an active feedback loop.


              The adverse evidence, however, is material enough to document explicitly. Google Play shows Kapital Banca
              Móvil at 3.1 stars from 852 reviews and the legacy Kapital Bank Móvil app at 2.4 stars from 627 reviews,
              with cited complaints about lag, confusing flows, digital-token friction, and even an ATM cash-dispense
              dispute. Finantres likewise argues that Kapital fits businesses better than users who simply want a basic
              personal account and warns readers to review commissions carefully. The Buró de Entidades Financieras PDF
              adds a harder service datapoint: 310 complaints in 2025, an index of 6.3 complaints per 10,000 contracts,
              and a 9.46 attention score. The correct read is not that customer quality is broken; it is that public
              durability proof is mixed and operational-service quality remains a real diligence lane.
