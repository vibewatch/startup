      - number: '1.3'
        title: Funding History, Investors, and Capital Structure
        blocks:
          - type: paragraph
            body: >
              Kapital's funding history is directionally clear even though some exact totals remain messy. The 2023
              Series A

              and Series B steps are well documented: TechCrunch and LatAmList described a May 2023 round of $20 million
              plus a

              $45 million debt facility, while the later Series B press release said the company had announced a $23
              million

              Series A plus the same $45 million debt facility. That discrepancy is small in percentage terms but large
              enough

              to keep exact lifetime-capital math from being treated as a clean fact. By December 2023, Kapital had
              raised an

              oversubscribed $40 million Series B equity round plus a $125 million debt line led by Tribe Capital and
              supported

              by investors including Cervin Ventures, Tru Arrow, MS&AD Ventures, and Alumni Ventures.


              The most important capital event for current stage assessment is the September 2025 Series C. Company and
              press

              coverage converge on an up-to-$100 million round at a $1.3 billion valuation, led by Tribe Capital and
              co-led by

              Pelion Ventures, with Y Combinator, Marbruck Ventures, and True Arrow participating. Multiple sources also
              state

              that Kapital was already profitable by that point. Reuters/Yahoo, Fintech Global, Nearshore Americas, and
              other

              outlets all repeat management's framing that the banking license plus proprietary software stack is the
              mechanism

              behind higher margins and faster scaling.


              Investor mapping still has limits. Public sources disclose lead investors by round, but not a full cap
              table,

              liquidation preferences, debt covenants, or the exact line between announced and fully drawn capital.
              CNBC's 2024

              profile listed cumulative funding at $295 million before the unicorn round, which is useful as an external
              check

              but still not enough to reconcile every later figure. The correct analytical stance is that Kapital is
              clearly

              late-stage and well financed, but exact total raised should remain partially open until management
              provides a

              reconciled round history and debt utilization schedule.
