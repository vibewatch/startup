        - Useful benchmark for what public markets pay for diversified digital-banking earnings
        - U.S. consumer mix and funding base differ materially from Kapital
      - - LendingClub
        - Public digital bank / lender
        - US$2.21B market cap; US$252.3M Q1 revenue; US$10.2B deposits; US$67.3M pre-tax income
        - Helpful downside benchmark for a profitable but narrower digital-bank model
        - Consumer lending and U.S. regulation limit direct comparability
      - - Ualá
        - Private LatAm neobank round
        - US$3.2B post-money in Mar-2026; 11M+ customers
        - Best recent LatAm full-stack private neobank round
        - Customer base is mass-market retail, not SMB-led
      - - Mercury
        - Private U.S. SMB banking fintech round
        - US$5.2B valuation in May-2026; US$650M annualized revenue; 300k customers
        - Most relevant private SMB-banking comp for customer-value and profitability framing
        - U.S. startup-banking mix and valuation environment differ from Mexico
      - - Clara
        - Private LatAm B2B spend / payments platform
        - ~US$1.0B valuation in Tracxn; US$204M total funding; US$70M debt round in Dec-2025
        - Nearest LatAm B2B-fintech value anchor below Kapital's current mark
        - Valuation is secondary-data based and may lag the live private market
