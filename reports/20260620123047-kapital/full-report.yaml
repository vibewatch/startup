      - CE002
      - CE008
      - CE011
      - CE013
      - CE016
      - CE021
      - CE043
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Directional dependency map for the parts of Kapital's product stack that most directly affect product delivery and
