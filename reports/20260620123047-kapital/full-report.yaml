  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Qualitative maturity map across Kapital's visible modules using depth of public documentation, update cadence, and
      evidence quality.
    data:
      columns:
        - Public maturity
        - Visible strength
        - Main caveat
      rows:
        - id: accounts
          label: Regulated accounts
          values:
            - Mature
            - Product pages, FAQs, and cost schedules are relatively detailed
            - Operational metrics and customer-scale by product are still undisclosed
        - id: business-platform
          label: Banca Empresarial workflow
          values:
            - Mature
            - Broadest official workflow surface spanning payroll, cards, invoices, and projections
            - No public systems documentation or admin-role detail
        - id: online-banking
          label: Banca en línea control layer
          values:
            - Mature
            - Explicit token, hours, limits, and fee logic are published
            - Branch-linked setup and token friction point to legacy-bank process complexity
        - id: capital-products
          label: SME credit and working-capital products
          values:
            - Mature
            - Underwriting requirements and public CAT examples are unusually specific
            - Public pages do not show decisioning performance or portfolio quality by product
        - id: mobile-stack
          label: Mobile / app portfolio
          values:
            - Active but mixed
            - Multiple live app surfaces and 2026 updates show ongoing maintenance
            - Ratings, review sentiment, and data-safety posture are inconsistent across apps
        - id: ai-privacy-card-docs
          label: AI, privacy, and direct card documentation
          values:
            - Partially visible
            - Business-platform copy references AI-driven analytics and cards are embedded in workflows
            - Dedicated AI, privacy, and card URLs were inaccessible or unstable in this run
    approximationNotes: >-
      Maturity is qualitative and based on the depth and quality of retained public evidence, not on confidential
      adoption or release-velocity data.
