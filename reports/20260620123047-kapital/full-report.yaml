  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: IC-style scorecard on a 1-5 scale, where 5 is strongest and most attractive.
    data:
      items:
        - label: Market opportunity
          value: 4
          note: SMB banking and operating-finance pain is real across Mexico and adjacent markets
        - label: Product / balance-sheet proof
          value: 4
          note: Regulated-bank filing and visible product breadth are stronger than typical private fintech disclosure
        - label: Moat durability
          value: 3
          note: Bundle convergence is useful, but lock-in still looks executional rather than structural
        - label: Economics visibility
          value: 2
          note: Bank profits are visible; consolidated revenue quality and ARR are not
        - label: Governance / compliance
          value: 2
          note: Intercam complexity and the 2024 leak keep this below neutral
        - label: Valuation evidence quality
          value: 2
          note: The price is plausible, but cap-table and preference details are missing
        - label: Financing flexibility
          value: 3
          note: Fresh Series C plus bank capital help, though holdco cash visibility remains weak
        - label: Exit readiness
          value: 2
          note: IPO narrative exists, but 2026 markets reward much cleaner disclosure than Kapital currently offers
    approximationNotes: >-
      Scores are author judgments from public evidence only. The low valuation-evidence score reflects missing data, not
      a conclusion that the business lacks value.
    claimRefs:
      - CV008
      - CV012
      - CV013
      - CV015
      - CV036
      - CV038
      - CV048
