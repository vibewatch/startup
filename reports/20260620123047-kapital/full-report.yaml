      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              The most consistently corroborated founder-operator pair is René Saúl as CEO and Fernando Sandoval as CFO.

              TechCrunch named them as co-founders in both the 2023 Series A and Series B coverage, and the 2025
              PRNewswire

              and Reuters/Yahoo items still quoted them as the principal executive voices. CNBC's Disruptor 50 profile
              widened

              the founder set to include Eder Echeverria and Arjun Sethi, while later local profiles repeated those
              names with

              varying emphasis. For diligence purposes, the safe conclusion is that René Saúl and Fernando Sandoval are
              the two

              indispensable operating executives in public materials, while Eder Echeverria and Arjun Sethi appear in
              some

              founder/board enumerations but with less consistent role detail.


              Leadership messaging is unusually founder-centric. The FinTech México Festival speaker page presents René
              Saúl as

              the executive who led the transition from fintech to commercial bank and then to financial group, while
              public

              funding and media coverage frequently quote him on product, regulation, and expansion. This concentration
              creates

              clear key-person dependence around CEO narrative control, regulatory relationship management, and
              acquisition

              execution. Sandoval appears as the public counterpart on balance sheet growth, profitability, and AI/risk
              systems.


              Governance transparency is materially weaker than growth disclosure. Kapital's accessible
              investor-relations page

              is useful for understanding how the company markets itself and what document sets should exist, but the
              most direct

              governance artifacts on that page are linked PDFs that were bot-protected or otherwise inaccessible during
              this

              run. As a result, the report can verify that a governance and investor-relations surface exists, but not a
              full

              public board roster, committee structure, or ownership map. That is an explicit diligence gap, not a
              reason to

              infer absence of oversight.
