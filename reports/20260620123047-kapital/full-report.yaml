        title: Exhibits
        blocks:
          - type: callout
            title: Track the company, not the 2025 round narrative
            body: >-
              Kapital has enough disclosed bank-quality evidence to stay investable, but not enough consolidated
              economic and cap-table evidence to justify paying up at the last disclosed round. The right near-term
              posture is disciplined monitoring rather than enthusiasm.
            calloutType: recommendation
