      - number: '5.3'
        title: Deployment, integration, reliability, and support
        blocks:
          - type: paragraph
            body: >
              Kapital's deployment story is strongest where the product touches regulated operations and weakest where
              investors would normally expect software telemetry. Official pages show multiple live deployment surfaces:
              Banca Empresarial for finance operations, Banca en línea for tokenized web banking, Google Play and App
              Store apps for mobile control, and app-store developer pages that imply separate app distribution for
              retail/mobile banking, tokening, and FX. Those surfaces support real jobs today, and several of them show
              2025-2026 update activity. Support and escalation paths are also concrete: official clarification and
              CONDUSEF pages publish phone, email, branch, and regulator routes; app-store listings add support contact
              details; and online banking documents token-recovery processes. The problem is reliability visibility.
              Kapital does not publish a status page, API docs, incident history, or service-level commitments, and some
              direct URLs that should matter product-tech-wise were unstable in this run. The dedicated card page
              returned a branded 404, the dedicated AI page returned 403, and the privacy-notice URL linked in official
              footers was not retrievable through the retained fetch path. Independent app feedback also shows friction.
              One Google Play business app listing states data is not encrypted and carries more than 2,000 reviews,
              while the newer banking-app surfaces still show mixed operational feedback around tokens, UX, and specific
              banking tasks. The right diligence read is that deployment is real, but software-quality evidence is
              thinner than the breadth of the feature surface suggests.
