      - number: '1.4'
        title: Milestones, Scale, and Consolidation
        blocks:
          - type: paragraph
            body: >
              Kapital's milestone arc is not just fundraising; it is institutional transformation. The 2022 Y Combinator

              affiliation and the 2023 launch of Kapital Flex show the company still behaving like a product-led
              startup. The

              2023 Banco Autofin acquisition then became the step-change event because it moved Kapital from
              software-led

              distribution into regulated banking infrastructure. Multiple acquisition writeups describe the logic
              similarly:

              acquire Banco Autofin, preserve its automotive-finance channel, and use the banking platform to widen the
              product

              set into cards, automated investments, and broader SME banking.


              The 2025 Intercam transaction is a second transformation point. Public reporting describes Kapital
              stepping into a

              stressed situation created by U.S. sanctions on Intercam and then agreeing to buy brokerage, asset
              management, and

              operational banking assets while promising another $100 million of operational and compliance investment.
              That

              move is strategically significant because it turns Kapital from a single-bank story into a broader
              financial-group

              consolidation story. It also explains why later sources speak about customer and asset scale in much
              bigger

              numbers than the 2023 startup-era materials.


              Scale evidence by late 2025 and early 2026 is strong enough to anchor later chapters. The Series C press
              release,

              Reuters/Yahoo, and supporting trade coverage consistently place customer reach at 300,000 and
              balance-sheet scale

              at $3 billion by September 2025. Excélsior and El Cronista then show 1Q26 assets at MXN 71.9 billion,
              loans at

              MXN 26.6 billion, deposits at MXN 58.4 billion, and trailing-12-month net income at MXN 1.229 billion.
              Those are

              unusually large figures relative to the company's 2023 profile and suggest that acquisition integration,
              not just

              organic SaaS growth, now drives the company overview.
