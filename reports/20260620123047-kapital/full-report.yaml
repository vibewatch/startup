      - number: '8.2'
        title: Financing Context, Price Support, and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              The current financing context is unusually mixed. On the positive side, Kapital entered late 2025 with a
              fresh Series C,

              management's profitability claim, repeat investor support, and independent coverage confirming that the
              company had moved

              well beyond the pure-startup stage. The 1Q26 bank filing and HR Ratings update reinforce that picture by
              showing usable

              capital, liquidity, and earnings support at the regulated-bank layer. Those facts mean the US$1.3 billion
              mark is not a

              random narrative price; public evidence can at least show why investors were willing to pay it.


              But the same evidence also shows why public support for the price is incomplete. Kapital still has no
              retained public

              disclosure of consolidated revenue run rate or ARR, no fully diluted cap table, no liquidation waterfall,
              and no clean

              explanation of how much of the economic value sits in the regulated bank versus the broader group. That
              makes software-

              style valuation methods fragile and makes even simple per-share return math speculative. Finro's Q1 2026
              dataset is a

              useful reminder that fintech comp work now needs stage and niche discipline: payments and transfers
              medians are far below

              peak-cycle private marks, and 2026 investors are increasingly stress-testing private rounds against public
              market reality.

              Eqvista's 2026 late-stage note points in the same direction, arguing that public investors no longer
              accept 2022-style

              pricing without governance and metric readiness.


              Entry discipline should therefore be explicit. Investors should not pay for an AI-premium narrative alone.
              A disciplined

              entry either requires a lower price than the last round or a higher proof package than the market
              currently has. In

              practice, that means demanding one of three catalysts before upgrading the call: disclosed consolidated
              revenue and

              product mix, a fully diluted cap-table and Series C term bridge, or sustained evidence that Intercam
              integration creates

              fee and deposit upside without pulling down compliance or asset quality. Until then, the last disclosed
              round should be

              treated as broadly defensible but not obviously cheap.
            claimRefs:
              - CV001
              - CV004
              - CV007
              - CV008
