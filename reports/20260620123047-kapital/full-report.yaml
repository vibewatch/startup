  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product suite and user workflow
        blocks:
          - type: paragraph
            body: >
              Kapital's enterprise product is best understood as a bundled finance workflow for Mexican SMEs rather than
              as a standalone bank account or loan. The official enterprise navigation and retained product pages show
              one stack that starts with regulated operating accounts, then extends into business banking software,
              online banking, FX transfers, SME credit, supplier finance, and invoice-backed financing. Cuenta PyME and
              Cuenta Empresarial are the entry rails: both pages emphasize account opening, real-time balances, SPEI,
              mass payments, and payroll dispersion, while the business-platform page adds supplier invoice management,
              projections, card issuance, and credit access from the same interface. That means the practical user
              journey is: open or migrate the operating account, activate the digital channels, run payables and
              payroll, create cards for spend control, then pull credit or factoring when working-capital needs appear.
              Public mobile evidence reinforces that framing. Kapital's Android and iPhone listings show active mobile
              surfaces for balances, transfers, investments, card management, and token-based security, while the Google
              Play developer profile also exposes Token Kapital and Kapital FX as separate app footprints. The workflow
              is therefore broad and plausibly sticky, but it is not purely self-serve: account-opening thresholds,
              documentation-heavy underwriting, token activation, and some branch-linked online-banking setup steps
              still make the product feel like regulated banking infrastructure wrapped in fintech UX rather than a
              fully software-only platform.
