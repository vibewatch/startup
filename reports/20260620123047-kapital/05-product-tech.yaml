  - id: underwriting-operations-and-architecture
    title: 'Underwriting, operations, and operating architecture'
    body: |
      Kapital's public architecture is operational rather than deeply technical, but the pieces are clear enough to map how the stack works. At the channel layer, clients touch the system through Cuenta PyME or Cuenta Empresarial onboarding, Banca Empresarial, Banca en línea, and at least three visible mobile-app surfaces. At the control layer, Banca en línea requires a client number plus token or softtoken activation, and official pages spell out different operating windows and channel economics for SPEI. At the workflow layer, Banca Empresarial concentrates accounts, scheduled payments, supplier invoices, payroll registration, projections, and card funding. At the underwriting layer, Crédito PyME requires last-three-month bank statements, SAT status documents, read-only CIEC access, beneficial-owner identity documents, and corporate deed information; the FAQ also discloses guarantor and liquid-collateral expectations. Public economics show that this is not lightweight embedded credit: Crédito PyME, FLEX, and factoring all publish opening or disposition fees, CAT examples, and prepayment logic in the official cost book. Group-level architecture matters too. Moody's describes the September 2025 integration of Intercam assets, people, and operating platform into Kapital's bank and brokerage footprint, while its March 2026 public report says the entities are highly integrated and harmonized but still in a transition period. The architecture is therefore differentiated by regulated-bank depth and workflow breadth, but it remains partly opaque because Kapital does not publish an API surface, systems diagram, uptime history, or detailed AI implementation notes.
