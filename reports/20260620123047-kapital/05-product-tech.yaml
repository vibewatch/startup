  - id: TE003
    title: 'Technology / operating architecture table'
    columns:
      - Layer / process / component
      - Role
      - Public evidence
      - Key dependency
      - Risk
    rows:
      - - Regulated account core
        - Holds deposits, balances, transfers, and the operating-account record for PyME and enterprise users
        - Cuenta PyME, Cuenta Empresarial, cost book, and CNBV / IPAB references on official pages
        - Bank license, funding base, and protected-product treatment
        - Public sources do not disclose core-banking vendor, ledger model, or incident metrics
      - - Business workflow layer
        - Aggregates cards, payroll, supplier invoices, projections, and financing access into one finance dashboard
        - Banca Empresarial page
        - UI/admin model, document ingestion, and workflow orchestration
        - No public API, role-permission, or export-control documentation
      - - Online banking control layer
        - Provides tokenized web banking, payments, and explicit operation windows
        - Banca en línea FAQ and fees
        - Token / softtoken issuance, branch support, and web authentication
        - Token recovery friction appears in public app reviews and support instructions
      - - Mobile app layer
        - Delivers balances, transfers, card controls, investments, token actions, and wallet functions from mobile devices
        - Google Play, App Store, and developer-profile listings
        - Ongoing app maintenance, mobile OS compatibility, and app-store compliance
        - Ratings and reviews show inconsistent UX quality across app generations
      - - Credit underwriting layer
        - Pulls statements, tax data, CIEC access, IDs, guarantor information, and collateral expectations into loan decisioning
        - Crédito PyME page and official cost book
        - SAT data access, document verification, and risk operations
        - Public sources do not reveal automated-decisioning rates, model variables, or loss monitoring
      - - Group integration and treasury layer
        - Ties bank, brokerage, deposit franchise, and acquired operating platform into one financial-group stack
        - Moody's press release and public report, HR Ratings signal
        - Successful integration of acquired assets, people, and controls
        - Rating agencies still treat the group as being in transition with operational and cost risk
    notes: This architecture is assembled from retained workflow, pricing, app-store, and ratings evidence because Kapital does not publish a canonical technical stack or developer portal.
