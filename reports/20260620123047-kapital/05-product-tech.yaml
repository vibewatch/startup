  - id: TE004
    title: 'Trust / quality / compliance table'
    columns:
      - Control / signal
      - Current public status
      - Scope
      - Why it matters
      - Gap or concern
    rows:
      - - CNBV-supervised bank entity
        - Explicitly claimed on official pages and echoed by third-party review coverage
        - KPTL México Bank and group financial operations
        - Regulated-bank status is the foundation for trust, product permissions, and complaint handling
        - Public product pages still do not explain operational-control architecture in technical detail
      - - IPAB protection for covered products
        - Official pages and third-party review coverage cite protection up to 400,000 UDIS for applicable products
        - Deposit-product trust for covered bank balances
        - Important differentiator versus unlicensed fintech surfaces
        - Coverage depends on the product and legal structure, not every service in the ecosystem
      - - CONDUSEF and clarifications channels
        - Official pages publish complaint phone, email, branch, and regulator escalation routes
        - Customer support and dispute resolution
        - Stronger than generic chatbot-only support claims
        - No public SLA, ticket-resolution metrics, or support satisfaction data
      - - Token / softtoken controls
        - Banca en línea requires token or softtoken activation and documents recovery paths
        - Web-banking authentication and payment control
        - Shows explicit control design for sensitive operations
        - Public token friction appears in app reviews and no fraud-rate metrics are disclosed
      - - Mobile-app data-safety disclosures
        - App-store pages disclose update cadence, collection/sharing practices, and encryption posture by app
        - Mobile-channel privacy and security transparency
        - Useful external signal on software-operating maturity
        - Different app surfaces show inconsistent disclosures, suggesting fragmented channel governance
      - - Security-adverse incident history
        - Cybernews documented a 2024 exposed bucket of IDs and selfies and recommended remediation actions
        - Identity-verification data and privacy operations
        - Material because KYC documents are core to Kapital's onboarding and underwriting workflow
        - No retained public postmortem or remediation disclosure was found in this run
      - - Ratings-agency control commentary
        - Moody's and HR Ratings are positive on capitalization, risk management, and integration, but still cite transition risk
        - Group-level financial and operational controls
        - Independent external view that the regulated stack is real
        - Ratings are not substitutes for product reliability or privacy-control evidence
    notes: Trust evidence is strongest at the regulatory and balance-sheet layer; quality evidence for software operations is materially thinner.
