  - id: TE002
    title: 'Workflow / use-case table'
    columns:
      - User job
      - Current workflow
      - Kapital solution
      - Measurable benefit
      - Limitation
    rows:
      - - Open an SME operating account and start transacting
        - Business submits opening documents, funds the account, and moves into daily transfers and payments
        - Cuenta PyME or Cuenta Empresarial
        - Publicly stated 48-business-hour PyME opening path and digital account operations reduce branch dependence
        - Opening still depends on complete documentation and regulated approval
      - - Run payroll and recurring payables
        - Finance team registers collaborators, schedules payments, and executes dispersions from the same operating stack
        - Banca Empresarial plus account rails
        - Payroll, mass payments, and reminders are embedded into one workflow instead of separate tools
        - No public payroll-integration catalog or export/API detail is available
      - - Control employee and business spend
        - Admin creates cards, allocates funds, and monitors spend by user or trip
        - Card controls inside Banca Empresarial plus mobile wallet management
        - Physical and virtual-card use cases are supported across platform and app surfaces
        - The direct card page was unstable, so rule depth and card-program structure are not fully documented
      - - Finance supplier invoices and smooth cash flow
        - Company reviews invoices, schedules provider payments, or finances them through working-capital products
        - Supplier workflow in Banca Empresarial with Crédito FLEX or factoring
        - Same-surface payables, financing, and projections reduce context switching
        - Public sources do not show policy rules for credit-line changes or invoice eligibility
      - - Move money internationally
        - User operates an existing Kapital relationship or FX contract and submits entity documents for cross-border transfers
        - Transferencias en divisas empresas
        - Official page documents multi-currency movement and clear minimum document set
        - Pricing is illustrative and public integration depth is not disclosed
      - - Operate from web and mobile channels
        - User activates token / softtoken, logs in, executes SPEI, tracks balances, and uses mobile app functions
        - Banca en línea, Kapital Business, Kapital Banca Móvil, and Kapital Bank Móvil apps
        - Multi-channel access supports 24/365 visibility and low-cost digital transfers
        - App-store reviews show usability and token friction on some surfaces
    notes: Benefits are constrained to what the public sources explicitly document; they should not be read as audited customer outcomes.
