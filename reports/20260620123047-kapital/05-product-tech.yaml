summary: |
  Kapital's public product surface is broad enough to look like an SMB operating account plus finance stack, not a single lending SKU. The strongest verified workflow runs from regulated deposit accounts into payments, payroll dispersion, card controls, supplier payables, FX transfers, and working-capital products inside one business platform, with mobile and web banking layers around it. The main product-tech risk is not missing feature copy but uneven technical transparency: Kapital publishes meaningful banking and pricing detail, yet its dedicated AI, card, and privacy pages were not fully reviewable in this run, app-store feedback is mixed, and the most concrete independent security signal is a 2024 identity-document exposure report.
sections:
  - id: product-suite-and-user-workflow
    title: 'Product suite and user workflow'
    body: |
      Kapital's enterprise product is best understood as a bundled finance workflow for Mexican SMEs rather than as a standalone bank account or loan. The official enterprise navigation and retained product pages show one stack that starts with regulated operating accounts, then extends into business banking software, online banking, FX transfers, SME credit, supplier finance, and invoice-backed financing. Cuenta PyME and Cuenta Empresarial are the entry rails: both pages emphasize account opening, real-time balances, SPEI, mass payments, and payroll dispersion, while the business-platform page adds supplier invoice management, projections, card issuance, and credit access from the same interface. That means the practical user journey is: open or migrate the operating account, activate the digital channels, run payables and payroll, create cards for spend control, then pull credit or factoring when working-capital needs appear. Public mobile evidence reinforces that framing. Kapital's Android and iPhone listings show active mobile surfaces for balances, transfers, investments, card management, and token-based security, while the Google Play developer profile also exposes Token Kapital and Kapital FX as separate app footprints. The workflow is therefore broad and plausibly sticky, but it is not purely self-serve: account-opening thresholds, documentation-heavy underwriting, token activation, and some branch-linked online-banking setup steps still make the product feel like regulated banking infrastructure wrapped in fintech UX rather than a fully software-only platform.
