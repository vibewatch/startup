  evidenceGaps:
    - type: access-blocked
      severity: material
      topic: privacy-disclosure-gap
      missingEvidence: A fetchable, reviewable public privacy notice for Kapital's live bank and business-platform products.
      whyItMatters: Without the actual privacy notice, diligence cannot confirm retention, sharing, storage, cross-border transfer, or incident-notification language for the KYC-heavy workflow.
      diligencePath: Request the current privacy notice PDF or HTML from Kapital and verify it against app-store data-safety disclosures and any internal privacy-control documentation.
      relatedQuestionRefs:
        - QE020
        - QE025
    - type: access-blocked
      severity: material
      topic: card-disclosure-gap
      missingEvidence: A stable public corporate-card product page covering issuance rules, spend controls, virtual-card logic, acceptance scope, and fee terms.
      whyItMatters: Cards are central to Kapital's enterprise value proposition, but direct documentation was fragmented during this run.
      diligencePath: Ask for the current corporate-card product deck, program T&Cs, and admin-control screenshots, then reconcile them with the broken public URL and app-store evidence.
      relatedQuestionRefs:
        - QE021
        - QE025
      relatedTableRefs:
        - TE001
    - type: access-blocked
      severity: material
      topic: ai-disclosure-gap
      missingEvidence: A dedicated, reviewable description of Kapital IA's actual capabilities, model boundaries, data inputs, and customer-facing controls.
      whyItMatters: The platform markets AI as a named feature, but public evidence does not show whether it is simple analytics, rule-based assistance, or a materially differentiated ML layer.
      diligencePath: Request product notes, screenshots, and any security / privacy review for Kapital IA, plus usage metrics and examples of decisions or recommendations produced by the feature.
      relatedQuestionRefs:
        - QE022
        - QE025
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: material
      topic: reliability-gap
      missingEvidence: A public status page, uptime history, incident archive, or developer / integration documentation for Kapital's business platform and banking channels.
      whyItMatters: Product breadth is visible, but investors still cannot judge production reliability, release discipline, or operational maturity from public evidence.
      diligencePath: Request internal uptime, incident, recovery-time, token-failure, and app-crash metrics by channel; ask whether a merchant- or customer-facing status surface exists.
      relatedQuestionRefs:
        - QE024
        - QE025
    - type: private-evidence-only
      severity: material
      topic: underwriting
      missingEvidence: Approval rates, automated-decisioning coverage, post-origination risk monitoring, and realized loss metrics for Crédito PyME, FLEX, and factoring.
      whyItMatters: Public underwriting inputs and CAT examples are helpful, but they do not show whether Kapital's embedded-banking and credit workflow scales with durable risk quality.
      diligencePath: Request underwriting policy documents, risk-score inputs, cohort approval curves, delinquency / recovery data, and any model-governance review tied to SME credit products.
      relatedQuestionRefs:
        - QE011
        - QE012
