    title: 'Product architecture map'
    type: stack
    layout: wide
    summary: Layered view of how Kapital packages regulated-bank products, enterprise workflows, and mobile surfaces into one SME finance stack.
    data:
      layers:
        - id: access-layer
          label: Access and onboarding layer
          detail: Cuenta PyME, Cuenta Empresarial, onboarding flows, and mobile / web entry points for regulated customers.
        - id: operations-layer
          label: Operations workflow layer
          detail: Banca Empresarial manages payroll, supplier invoices, scheduled payments, cards, dashboards, and projections.
        - id: banking-control-layer
          label: Banking control layer
          detail: Banca en línea, token / softtoken, SPEI controls, account notifications, and support / clarification channels.
        - id: capital-layer
          label: Capital and treasury layer
          detail: Crédito PyME, Crédito FLEX, factoring, deposit balances, and FX transfer workflows sit beside the operating account.
        - id: group-layer
          label: Group integration layer
          detail: Bank, brokerage, deposit franchise, and acquired operating platform are described by Moody's as integrated and harmonized.
    approximationNotes: Kapital does not publish a canonical architecture diagram; the stack is inferred from official workflow pages, app surfaces, and ratings commentary.
    claimRefs:
