tables:
  - id: TE001
    title: 'Product module / asset matrix'
    columns:
      - Module / asset
      - Primary user
      - Public status / maturity
      - Differentiation
      - Diligence gap
    rows:
      - - Cuenta PyME
        - Small businesses and PFAEs
        - Mature and live
        - Combines operating account, SPEI, mass payments, payroll dispersion, and real-time visibility in one regulated account surface
        - Direct throughput, active-account, and retention metrics are not public
      - - Cuenta Empresarial
        - Personas morales and larger operating-account users
        - Mature and live
        - Low-friction operating account with payroll and provider-payment workflow plus regulated-bank protections for covered products
        - Public materials do not disclose attach rate into cards, FX, or lending
      - - Banca Empresarial
        - Finance teams, owners, and controllers
        - Live and central to the suite
        - Adds cards, supplier invoices, projections, financing access, widgets, and payroll controls beyond a basic bank account
        - No public architecture diagram, API surface, or admin-role model is published
      - - Banca en línea + token layer
        - Users needing web banking and higher-control operations
        - Live, legacy-regulated, and actively documented
        - Softtoken / token gating plus explicit operating windows and channel-level fee disclosure show bank-grade process controls
        - Public docs do not disclose MFA failure rates, fraud controls, or enterprise-admin delegation detail
      - - Tarjetas / wallet controls
        - Employees, traveling staff, and spend managers
        - Live but fragmented in documentation
        - Card creation, funding, assignment, wallet controls, lock flows, and mixed physical / virtual use cases are visible across the business platform and apps
        - The direct card page returned 404, so card-rule depth is dispersed rather than centralized
      - - Crédito PyME
        - SMEs needing working-capital financing
        - Mature and underwritten
        - Publicly documented underwriting inputs, guarantor / guarantee expectations, and CAT / fee disclosure are stronger than typical private-fintech marketing
        - Approval rates, risk segmentation, and post-origination performance remain private
      - - Crédito FLEX + Crédito Factoring
        - Supplier-payments and receivables-financing users
        - Live but economically risk-heavy
        - Both products are embedded into the same ecosystem and publish draw-fee / CAT examples in the official cost book
        - Public pages do not show utilization, repeat use, or debtor concentration
      - - FX and mobile-app stack
        - Businesses moving funds internationally and users needing on-the-go control
        - Live and multi-surface
        - FX transfer workflows plus separate banking, token, and FX app footprints suggest a broader embedded-banking stack than a single monolithic app
        - No public integration docs or release notes explain how these app surfaces interact behind the scenes
    notes: Rows describe product maturity based on retained public evidence, not on confidential customer counts or usage depth.
    enumerationScope:
      coverage: exhaustive
      basis: Covers the materially visible enterprise-facing product modules retained from official Kapital pages, app-store listings, and third-party product coverage as of the run date.
