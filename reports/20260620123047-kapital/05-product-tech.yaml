  - calloutType: risk
    title: 'Transparency lags the feature surface'
    body: |
      The public stack shows real deployment, but broken direct URLs, mixed mobile reviews, no public uptime disclosure, and a documented identity-document exposure mean product-control diligence cannot stop at marketing pages.
