  - id: differentiation-trust-and-product-risks
    title: 'Differentiation, trust stack, and product risks'
    body: |
      Kapital's clearest product differentiation is not a public developer moat; it is bundle convergence on top of a licensed-bank and group-financial structure. Official pages, cost schedules, review coverage, and ratings reports collectively show one institution trying to own the SME operating account, the finance dashboard, the corporate card controls, FX transfers, and the credit stack. That is stronger than a pure neobank or point-lending wedge because the same surface can hold deposits, trigger payroll, pay suppliers, reconcile invoices, and finance shortfalls. Public AI messaging sharpens that thesis, but only modestly: the business-platform page talks about real-time financial data, trend detection, and projections, yet the dedicated Kapital IA page was not inspectable in this run, so the AI layer should be treated as workflow augmentation rather than a verified proprietary model stack. Trust is mixed. Official pages repeatedly cite CNBV supervision, CONDUSEF escalation, and IPAB protection for covered products, and rating agencies are positive on integration, capitalization, and risk management. But the adverse evidence is material: Cybernews reported a large 2024 exposure of voter IDs and selfies tied to Kapital, with concrete remediation steps that imply prior weaknesses in storage controls, logging, and customer-notification practice. The trust stack is therefore real at the regulatory and balance-sheet layers, but diligence on privacy operations, resilience, and software control maturity is still incomplete.
