  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律和制裁背景风险是最严重的一组
        blocks:
          - type: paragraph
            body: >-
              Kapital 已不再只是高增长 SME fintech；它现在是一个受监管银行集团，并选择在墨西哥和美国当局已经关注 AML 与跨境控制时，从 Grupo Financiero Intercam
              购买敏感资产。Kapital 2025 年 8 月公告称，交易覆盖券商、资管和运营银行资产，并包含另 US$100 million 运营投资。保留的美国 Federal Register
              记录把法律背景说得很清楚：FinCEN 发布命令，禁止涉及 Intercam Banco 的若干资金传输，原因是认定其在非法阿片类药物流量背景下构成主要洗钱疑虑。独立报道随后把这笔出售描述为 Intercam
              在财政部压力和制裁时期压力下推动的动作，而不是干净的战略组合轮换。


              这并不意味着保留来源集中 Kapital 自身有公开执法记录；事实上，Buró 披露显示 2025 年零制裁。问题不同：Kapital
              主动进入高审查边界，同时给市场的公开治理表面仍相对单薄。公司确有公司治理和投资者关系页面，但保留公开材料仍未展示合并董事会委员会图、对齐后的 cap table，或详细的 holdco
              风险叙事。对于一家正在整合承压资产并讨论 IPO 时间表的公司，这一披露缺口实质抬高了法律、治理和审批风险。关键私有证据缺口是管理层关于 Intercam 交易的监管沟通包，包括先决条件、客户迁移控制和 AML
              整改责任。
