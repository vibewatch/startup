      - number: '7.3'
        title: 运营、投诉处理和隐私 / 安全风险是真实问题，不是假设
        blocks:
          - type: paragraph
            body: >-
              官方和负面证据都显示，Kapital 的运营风险不只是泛泛的 fintech 噪音。Kapital 的 Buró de Entidades Financieras 披露称，2025 年有 310 起投诉，每
              10,000 份合同投诉指数为 6.3，用户服务评分为 9.46。这不是危机信号，但足以说明当前规模下存在有意义的真实客户摩擦。公司也维护公开 Condusef 帮助页面，这是有用的缓释项，因为它证明
              Kapital 有正式消费者保护接口，而不只是 App 内支持。


              更严重的运营信号来自 Cybernews 2024 年 12 月报告：一个归因于 Kapital 的云存储桶配置错误，暴露约 1.67 million
              个文件，包括选民身份证和自拍照；该媒体还称，在多次披露尝试后，公司在发布前没有回应。对于处理身份验证的贷款机构和银行，这正是可能同时流入信任、行为和监管关注的事件。产品文件也强化了运营模型包含非轻量控制义务：Crédito
              PyME 使用担保人、流动存款支持、佣金和罚息机制；Cuenta PyME
              设置开户余额和低余额条件。因此，公开来源显示这是一个广泛且活跃的运营系统，但还没有提供事故复盘、投诉账龄数据、欺诈损失拆分或独立安全控制证据，来证明风险已经完全受控。
