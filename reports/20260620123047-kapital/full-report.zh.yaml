  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 类型
      - 指标 / 估值 / 状态
      - 相关性
      - 关键限制
    rows:
      - - Kapital
        - 标的公司 / 私募轮次
        - US$1.3B 2025 年 9 月估值；300k 客户；US$3B 资产负债表口径
        - 本章的直接价格锚
        - 没有合并收入、ARR 或优先权栈披露
      - - Nu Holdings
        - 上市拉美新银行
        - US$61.79B 市值；135M 客户；US$871M Q1 净利润
        - 大规模拉美零售金融科技中，盈利能力和客户货币化的最佳基准
        - 零售占比高，使单客户比较比 SMB 银行更平
      - - MercadoLibre / Mercado Pago
        - 上市拉美商业 - 金融科技生态
        - US$82.89B 市值；Mercado Pago US$4.0B Q1 收入；83M 金融科技 MAU
        - 展示拉美高溢价生态经济性可支撑的估值
        - 商业飞轮和规模远超 Kapital 范围
      - - StoneCo
        - 上市 SMB 支付 / 银行 / 信贷平台
        - US$2.57B 市值；Q1 2026 业绩围绕支付、银行和信贷展开
        - 比零售新银行更接近 SMB 运营金融工作流
        - 当前公开材料在清晰盈利背景上弱于 Nu 或 SoFi
      - - PagBank
        - 上市支付 - 银行混合体
        - US$2.46B 市值；R$575M Q1 non-GAAP 净利润；信贷账簿同比 +36%
        - 对拉丁美洲支付 + 银行 + 信贷组合经济性有参考价值
        - 巴西零售 / 商户组合并非干净的墨西哥 SMB 类比
      - - SoFi
        - 上市数字银行 / 贷款平台
        - US$22.97B 市值；US$1.1B Q1 收入；US$167M 净利润；US$40.2B 存款
        - 可作为公开市场如何定价多元化数字银行盈利的有用基准
        - 美国消费者组合和资金基础与 Kapital 存在实质差异
      - - LendingClub
        - 上市数字银行 / 贷款机构
        - US$2.21B 市值；US$252.3M Q1 收入；US$10.2B 存款；US$67.3M 税前利润
        - 对盈利但更窄的数字银行模型，是有用的下行基准
        - 消费贷款和美国监管限制了直接可比性
      - - Ualá
        - 私有拉美新银行轮次
        - 2026 年 3 月投后 US$3.2B；11M+ 客户
        - 最近拉美全栈私有新银行轮次中最佳基准
        - 客户基础是大众零售，而非 SMB 主导
      - - Mercury
        - 私有美国 SMB 银行金融科技轮次
        - 2026 年 5 月估值 US$5.2B；US$650M 年化收入；300k 客户
        - 在客户价值和盈利框架上，最相关的私有 SMB 银行可比对象
        - 美国创业公司银行组合和估值环境不同于墨西哥
      - - Clara
        - 私有 LatAm B2B 支出 / 支付平台
        - Tracxn 显示估值约 US$1.0B；累计融资 US$204M；2025 年 12 月完成 US$70M 债务轮
        - Kapital 当前估值标记之下，最接近的 LatAm B2B 金融科技估值锚
        - 估值来自二级数据，可能滞后于实时私募市场
    notes: 没有单一可比公司能直接解决 Kapital 的估值问题。上市可比公司规模更大、指标更干净；私有可比公司模式更接近， 但透明指标弱得多。应把这组可比公司当作三角定位框架，而不是估值公式。
