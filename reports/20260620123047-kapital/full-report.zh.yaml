              页面公布电话、邮件、网点和监管渠道；应用商店列表补充支持联系方式；网上银行文件说明 token 找回流程。问题在于可靠性可见度。Kapital 未公布状态页、API
              文档、事故历史或服务级别承诺，一些对产品技术应当重要的直接 URL 在本轮抓取中并不稳定。独立卡片页面返回品牌 404，独立 AI 页面返回 403，官方页脚链接的隐私通知 URL
              无法通过保留抓取路径取回。独立应用反馈也显示摩擦。一个 Google Play 商业 App 列表称数据未加密，且有 2,000 多条评论；较新的银行 App 入口仍围绕 token、UX
              和具体银行任务出现混合运营反馈。合理的尽调解读是：部署确实存在，但软件质量证据比功能表面看起来更薄。
