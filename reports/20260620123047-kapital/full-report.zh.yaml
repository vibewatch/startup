      - number: '1.4'
        title: 里程碑、规模与整合
        blocks:
          - type: paragraph
            body: >
              Kapital 的里程碑弧线不只是融资，而是机构形态的改造。2022 年加入 Y Combinator、2023 年推出 Kapital Flex，显示公司当时仍像产品驱动型创业公司。2023 年收购 Banco
              Autofin 则是阶跃事件：Kapital 从软件驱动分发转入受监管银行基础设施。多篇并购报道对逻辑的描述类似：收购 Banco
              Autofin，保留其汽车金融渠道，并借助银行平台把产品集扩展到卡、自动化投资和更广的 SME 银行业务。


              2025 年 Intercam 交易是第二个转型点。公开报道描述 Kapital 进入了一个由美国对 Intercam 制裁造成的压力局面，随后同意购买券商、资产管理和运营银行资产，并承诺再投入 $100
              million 做运营和合规投资。这一步有战略意义，因为它把 Kapital 从单一银行故事推向更广义的金融集团整合故事。它也解释了为什么后续来源谈论客户和资产规模时，数字远大于 2023 年创业公司阶段材料。


              到 2025 年末和 2026 年初，规模证据已经足以支撑后续章节。Series C 新闻稿、Reuters/Yahoo 和配套行业报道一致把客户覆盖写为 300,000，把 2025 年 9
              月资产负债表规模写为 $3 billion。Excélsior 和 El Cronista 随后显示，1Q26 资产为 MXN 71.9 billion，贷款为 MXN 26.6 billion，存款为 MXN
              58.4 billion，过去 12 个月净利润为 MXN 1.229 billion。相较公司 2023 年档案，这些数字异常庞大，也说明驱动公司概览的已不只是有机 SaaS 增长，而是并购整合。
