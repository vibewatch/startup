      - number: '3.2'
        title: 直接同业、能力重叠与定价姿态
        blocks:
          - type: paragraph
            body: >
              在金融科技同业中，Konfío 是最接近 Kapital 更大野心的信贷驱动替代者。其公开信贷页面宣传最高 MXN 5 million 的无抵押企业贷款、固定利率、数字开户和 48
              小时放款；第三方和新闻报道则显示，它正试图通过银行牌照增加存款和资金管理服务。这个方向重要，因为 Kapital 也想坐到 SME 运营栈中心，而不是停留在单点方案。Clip
              是微型和小型企业端最接近的商户栈替代者：它把刷卡终端、受监管数字账户和基于 offer 的企业贷款结合起来，再用硬件折扣和当日结算降低采用门槛。


              Conekta 与 Kapital 的贷款重叠较少，但在栈里的支付钱包份额上重叠更多。它的官方界面强调一次集成即可覆盖卡、SPEI、现金、BNPL 和钱包，并给出明确的 SMB
              标价。当买方痛点是结账转化、支付方式组合或对账，而不是信贷时，Conekta 就是强替代品。Adyen 更偏高端商户，但战略上重要，因为它提供线上加 POS 的统一支付平台、透明的 Interchange++
              定价，并持续扩展 Adyen Agentic 等编排能力。对 Kapital 的含义很清楚：买方可以拆包这套栈，选择其最关心工作流中最强的专家，再围绕其他需求多归属。
