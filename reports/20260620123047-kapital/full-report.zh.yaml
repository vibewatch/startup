        title: 财务结论与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Kapital 的公开财务案例强于典型私营金融科技公司，因为公司披露了真实银行产品定价和真实持牌银行备案，而不只是增长营销。这是正面。负面在于，公开记录仍没有展示股权承保真正需要的合并经济性。投资者能看到多条变现
              rails，也能看到受监管银行已有真实规模、流动性、盈利能力和可接受的信贷指标；但看不到哪些 rails
              真正产生可持续的高质量收益，软件是否有意义地分散贷款模型，或更广义集团为保持扩张消耗了多少现金。这个缺口重要，因为管理层的盈利声明、$3 billion 资产负债表声明和 300,000
              客户声明，都与收入流组合、实际 spreads、产品层面逾期和控股公司 runway 的未解问题并列存在。投诉记录并不惊人，但也不是零风险：Buró 披露 2025 年记录 310
              起投诉，独立报道仍强调信贷投资者关注契约和现金流压力情境。因此，正确的财务结论是建设性但有条件：Kapital
              似乎已搭建真实的银行加软件收入引擎，但在投资者能有信心承保收入质量、利润率耐久度和融资独立性之前，案例仍依赖私下证据。
