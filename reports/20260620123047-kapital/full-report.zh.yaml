      - number: '6.5'
        title: 扩张杠杆清晰可见，但集中度和定义风险仍限制确信度
        blocks:
          - type: paragraph
            body: >-
              Kapital 的扩张逻辑是客户故事中更有说服力的一部分。同一段客户关系可以从账户开始，进入资金管理或 FX，加入发薪，再深化到营运资金信贷、供应商金融和分析。官方页面反复营销这种打包动作。Cuenta
              Empresarial 和 Cuenta PyME 承诺运营账户；Banca Empresarial 叠加分析、付款日历、供应商管理、卡和发薪；Crédito PyME 和 FX
              增加流动性与资金管理相邻能力；Sacra 认为更广的多产品策略旨在随时间扩大单客收入。哥伦比亚页面在另一个市场展示同样模式，把保理、信贷、Flex、借记卡、发薪和工作流工具组合起来。从战略视角看，Kapital
              试图成为 SMEs 的财务操作系统，而不是单一产品贷款机构。


              风险在于，公开证据对客户集中度和扩张质量仍然只讲了一部分。银行 1Q26 报告明确称，两名个人客户或经济集团的风险敞口超过一级资本的
              10%；同一报告还称，管理层希望分散客户基础，并优先发展公众存款以缓释集中度风险。这是有价值的披露，但没有回答更深的承销问题：前 10 大客户贡献多少收入，按行业看存款或贷款余额有多集中，300,000
              客户标题中有多少活跃且已变现，以及交叉销售能否在不抬高支持负担的情况下提升生命周期价值。在这些问题回答之前，Kapital 的客户论点最好评为获客广泛且有前景，但耐久性和集中度仍证据不足。
