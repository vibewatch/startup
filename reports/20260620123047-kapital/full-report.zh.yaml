      - number: '1.3'
        title: 融资历史、投资者与资本结构
        blocks:
          - type: paragraph
            body: >
              Kapital 的融资历史方向清晰，只是部分精确总额仍有噪音。2023 年 Series A 和 Series B 两步记录较完整：TechCrunch 和 LatAmList 描述 2023 年 5 月一轮
              $20 million 融资外加 $45 million 债务额度；后来的 Series B 新闻稿称公司曾宣布 $23 million Series A，另有同一笔 $45 million
              债务额度。差异按比例看不大，但足以让生命周期募资精算不能被当作干净事实。到 2023 年 12 月，Kapital 已完成超额认购的 $40 million Series B 股权融资，并获得由 Tribe
              Capital 牵头、Cervin Ventures、Tru Arrow、MS&AD Ventures 和 Alumni Ventures 等支持的 $125 million 债务额度。


              判断当前阶段最重要的资本事件，是 2025 年 9 月的 Series C。公司和媒体报道一致指向：最高 $100 million，估值 $1.3 billion，由 Tribe Capital
              领投、Pelion Ventures 共同领投，Y Combinator、Marbruck Ventures 和 True Arrow 参投。多方来源也称 Kapital
              当时已经盈利。Reuters/Yahoo、Fintech Global、Nearshore Americas 和其他媒体都重复了管理层的叙事：银行牌照加自有软件栈，是更高利润率和更快规模化背后的机制。


              投资者地图仍有边界。公开来源披露了各轮领投方，但没有完整 cap table、清算优先权、债务契约，或已宣布资本与已完全提款资本之间的精确界线。CNBC 2024 年档案称独角兽轮之前累计融资为 $295
              million，这可以作为外部校验，但仍不足以对齐后续每一个数字。正确的分析立场是：Kapital 已明确进入后期阶段且资金充足，但在管理层提供经调和的轮次历史和债务使用计划之前，精确累计融资额应保持部分开放。
