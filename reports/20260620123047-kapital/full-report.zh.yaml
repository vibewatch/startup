            body: >
              Kapital 公开披露的架构更偏运营，而不是深层技术细节，但已足够拼出这套栈的运行方式。渠道层上，客户通过 Cuenta PyME 或 Cuenta Empresarial 开户、Banca
              Empresarial、Banca en línea，以及至少三个可见移动 App 入口接触系统。控制层上，Banca en línea 要求客户号加 token 或 softtoken 激活，官方页面也写明
              SPEI 不同操作窗口和渠道费用。工作流层上，Banca Empresarial 把账户、预约付款、供应商发票、薪资登记、预测和卡资金归集在一起。授信层上，Crédito PyME 要求最近三个月银行流水、SAT
              状态文件、只读 CIEC 访问、受益所有人身份证明和公司章程信息；FAQ 也披露了担保人和流动抵押品要求。公开经济条款显示，这不是轻量嵌入式信贷：Crédito PyME、FLEX
              和保理都在官方成本手册中公布开户或提款费用、CAT 示例和提前还款逻辑。集团层架构同样关键。Moody's 描述了 2025 年 9 月将 Intercam 的资产、人员和运营平台整合进 Kapital
              银行和券商版图；其 2026 年 3 月公开报告称，各实体高度整合并已协调一致，但仍处于过渡期。因此，这套架构的差异化来自受监管银行深度和工作流广度；但 Kapital 未公布 API
              接口、系统图、正常运行时间历史或 AI 落地细节，架构仍有部分不透明。
