    rows:
      - - Intercam 监管进度滑坡
        - 批准函、监管声明和管理层整合更新
        - 出现与 Intercam 资产或客户迁移有关的新条件、延期或执法信号
        - 在文件证据闭环之前，将伙伴 / 整合风险视为打破投资论点的风险
      - - 信贷恶化
        - IMOR、覆盖率、重组和批次账龄数据
        - 2026 年批次表现弱于计划，或覆盖率显著走弱且没有解释性的准备金增加
        - 暂停任何承保评级上调，并用更高损失假设重切下行情景估值
      - - 投诉或行为合规恶化
        - Buró、Condusef 和内部投诉包
        - 投诉率或正式争议的增长明显快于合同增长
        - 提高行为合规和留存风险，并假设服务成本更高
      - - 安全控制失效复发
        - 安全事件、泄露通知或第三方审计发现
        - 又一次可信的敏感数据事件，或重大事件后缺少事后复盘
        - 将隐私 / 安全视为尽调门槛项，而不是背景担忧
      - - 融资 / 披露短板
        - 控股公司现金报告、财务约束条款余量和 IPO 就绪披露
        - 下一次资本市场动作前，治理或控股公司透明度没有实质改善
        - 下调估值，并要求更强的投资者保护或资本结构清晰度
      - - 宏观 / 利率压力
        - Banxico 路径、IMF 增长修订和按行业划分的组合表现
        - 限制性环境持续，同时 SME 还款或放款显著走弱
        - 重新承销增长和催收假设，并降低对当前盈利叙事的信心
    notes: 这些是承销触发项，不是预测。多个触发项只有在管理层分享私有运营数据后，才能被妥善监测。
