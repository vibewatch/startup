  - id: TV002
    title: 投资论点 / 反向论点表
    columns:
      - 论点
      - 类型
      - 什么会改变判断
    rows:
      - - Kapital 有真实的受监管银行验证：资产、存款、贷款、资本和季度盈利均已公开披露。
        - 投资论点
        - 若有证据显示控股公司经济性与银行层面盈利显著背离，该支柱会被削弱。
      - - 公司在 2026 年银行业绩公布前已达到 300,000 名客户和 US$3B 资产负债表口径，显示出有意义的规模。
        - 投资论点
        - 客户质量、使用率或资产质量若显著恶化，将削弱规模故事。
      - - 如果承保和留存更强，掌握更多受监管栈可能支撑比大众市场新银行更高的客户价值。
        - 投资论点
        - 如果证据显示 SMB 客户大量多栖，或交叉销售偏弱，溢价逻辑会被压低。
      - - 公开证据仍缺少合并收入年化规模或 ARR，因此软件式定价支撑偏弱。
        - 反向论点
        - 披露合并收入桥接和产品结构，会直接改善估值支撑。
      - - 完全摊薄股数、优先权栈和 Series C 清算条款未公开。
        - 反向论点
        - 清晰的股权结构和优先权瀑布披露，会缩小回报不确定性。
      - - Intercam 整合和制裁相邻合规工作若执行滑坡，可能毁掉价值。
        - 反向论点
        - 干净的整合 KPI、稳定资产质量和监管舒适度会减轻折价。
      - - Cybernews 曝光削弱了任何自动获得 AI 或基础设施溢价的说法。
        - 反向论点
        - 独立证明控制已修复且没有复发事件，会降低该风险。
    notes: 这些行旨在说明哪些事实支撑故事，哪些缺失事实仍阻止在披露的 2025 年轮次价格上给出买入判断。
