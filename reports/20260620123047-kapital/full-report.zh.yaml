  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资信号
      - 目标细分
      - 差异化
      - 相比 Kapital 的局限
    rows:
      - - Kapital
        - 公司 / 一体化中小企业金融栈
        - 私营；公开网站覆盖信贷、卡、保理、账户、外汇和数字银行
        - 希望用一段关系覆盖资金和运营工作流的墨西哥中小企业
        - 融资、卡、保理和账户界面的捆绑收敛
        - 公开页面未披露实际定价或附着指标
      - - Konfío
        - 直接同业 / 信贷主导型金融科技
        - 2021 年独角兽画像；Legal Paradox 称股权 >$380M、债务额度 >MXN7.4B
        - 需要无抵押营运资本、且越来越需要更广泛资金管理的中小企业
        - MXN5M 无抵押信贷加卡和支付；明确的银行牌照扩张计划
        - 存款栈尚未上线；官方定价细节仍有限
      - - Clip
        - 直接同业 / 商户栈
        - 1M+ App 下载量、受监管钱包、终端和商户贷款报价
        - 需要收卡和当日现金可视性的微型和小型商户
        - 把终端、受监管账户和基于报价的贷款组合起来，上手摩擦低
        - 更广泛的资金管理和信贷深度仍弱于银行在位者
      - - Conekta
        - 直接同业 / 线上支付基础设施
        - 处理 US$15B、428M 笔交易、8K+ 商户
        - 需要银行卡、SPEI、现金和结账编排的数字商户
        - 面向墨西哥的一次集成，定价明确，优化本地支付方式
        - 对大多数中小企业没有贷款或运营账户切入点
      - - Adyen Mexico
        - 邻近 / 企业支付平台
        - 全球平台，公布定价，线上加 POS 栈统一
        - 需要全渠道受理和跨境编排的商户
        - 单一平台提供强转化、反欺诈和 POS 运营
        - 偏向大客户，没有中小企业信贷产品
      - - BBVA PyME
        - 在位银行
        - 全银行存款和收单基础设施；公布 TPV 费用和数字信贷条款
        - 优先考虑受监管账户、TPV 和关系型银行服务的中小企业
        - 信任、公开费用和运营账户深度
        - 上手摩擦更高，数字信贷受报价门槛限制
      - - Santander PyME
        - 在位银行
        - 全银行组合，PFAEs 方案从 MXN0 起，并配有 Getnet 终端工具
        - 希望账户、终端和分行支持服务打包的中小企业
        - 账户 + 终端 + App 一体化组合，并延伸到支付链接
        - 相比 BBVA 或 Conekta，实际 MDR 公开细节更少
      - - Banorte PyME
        - 在位银行
        - 公司发布的认可说明称中小企业贷款份额 15%、中小企业存款份额 14%
        - 希望获得全国性银行资产负债表信任和融资渠道的中小企业
        - 规模、存款和已获认可的 SME 品牌
        - 本轮中，官方自助网页产品细节不稳定
      - - Nu Mexico
        - 相邻赛道 / 消费者优先的数字银行转型
        - 墨西哥约 1400 万客户，计划到 2030 年投入 US$4.2B
        - 当前以消费者用户为主；未来可能延伸到 SMB
        - 低成本数字分发规模大，并在转向银行牌照
        - 目前没有公开的墨西哥商业银行业务界面
      - - Mercury
        - 美国基准 / 软件驱动的企业银行
        - 300K+ 创业者，每月交易量 US$20B+
        - 需要低费率账户、银行卡和自动化的初创公司与 SMB
        - 免费基础银行服务、1.5% 返现，以及金融软件分层定价
        - 未针对墨西哥本地化；没有本地支付轨道
      - - Brex
        - 美国基准 / 支出 + 银行平台
        - 声称覆盖 1/3 初创公司，最高 3.68% 现金管理收益，最高 US$6M FDIC 保障
        - 有风投资金、正在扩张且支出 / 合规需求更高的公司
        - 高额度银行卡，加上现金管理、AP 和全球控制
        - 未针对墨西哥本地化；经济性绑定美国银行基础设施
      - - Lili
        - 美国基准 / 小企业银行
        - 服务 200K+ 企业；4.00% APY；US$3M FDIC sweep 保障
        - 需要简单数字银行服务的小型 SMB 和个体经营者
        - 低费率运营账户，内嵌信贷和支付
        - 只是美国基准，不是墨西哥运营商
    enumerationScope:
      coverage: partial
      basis: >-
        Profiles focus on the direct peers, incumbents, adjacents, and benchmark entrants most relevant to Mexico's SMB
        banking-credit-payments stack as of 2026-06-20; they are not an exhaustive list of all Mexican PSPs, neobanks,
        or non-bank lenders.
    notes: 规模信号混合了官方产品说法和独立报道。Banorte 一行采用公司发布的 SME 认可数据，因为本轮中官方自助产品 URL 不稳定。
