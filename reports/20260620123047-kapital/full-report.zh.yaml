      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              最强采用驱动并非完全来自公司自身，而是运营环境的结构性改善。在 Mexico，公共政策栈试图同时推动信贷深度和数字使用。Plan México 的目标包括 30% 的可持续 SME 信贷可得性、MX$4
              billion 首贷基金，以及更紧密的银行-金融科技合作。Banco de México 2026 年关于新账户层级的咨询明确被定义为扩大普惠和数字支付使用的方式。在 Colombia，驱动更偏监管：2026
              年第 0368 号法令把该国从自愿开放金融推进到受监管实体强制开放，Superfinanciera 必须在六个月内定义标准化时间表。Colombia 也已经有 Bre-B 这条运行中的互操作
              rail，能产生支持收款、供应商付款以及最终更好承保的交易数据尾迹。

              商业驱动同样强。Latin American SME 与供应商网络和跨境流动深度绑定：已有 3/5 与国际供应商合作，Mexico、Brazil 等市场中 75% 的受访 SME
              计划扩大全球伙伴关系。因此，支付摩擦就是 SMB 税。如果发送 US$250 平均要消耗 23.3% 费用，部分情况下高达
              30%，任何能降低结算成本、延迟或不透明度的产品，都能承担运营金融角色，而不只是狭义支付角色。

              约束同样实质。第一，2018 年 Fintech Law 已过去八年，Mexico
              的开放银行制度仍不完整：开放数据规则存在，但有约束力的交易数据、同意和认证层仍缺位。这会拖慢承保自动化，并迫使公司做定制集成。第二，信任和安全仍是活跃采用障碍。Mexico 约 80% 的交易仍用现金，30%
              的人口表示担心数字安全。第三，数字 rails 改善不等于信贷缺口被解决。Colombia
              公司数据表明，基础产品可得性与活跃信贷使用之间差距很大，尤其是微型企业。第四，美国比较市场提醒，不能假设数字渠道自动带来更好的借款人经济性：2026 年 4 月 SLOOS 报告 C&I 贷款标准收紧，SBCS
              中 60% 的在线贷款借款人表示实际借款成本高于预期。

              负面解读很清楚：市场巨大且结构性供给不足，但信任、监管和切换摩擦会拖慢变现。Kapital 与估值最相关的机会，出现在支付、承保和工作流自动化彼此强化的场景；最弱的场景，是产品必须逐个用例对抗现金习惯、不完整数据
              rails 或借款人不信任。
