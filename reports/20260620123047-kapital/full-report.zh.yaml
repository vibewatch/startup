        - 72.5% 至少拥有一项产品；26.7% 有活跃信贷
        - 存款可得性很广，但信贷深度浅得多。
        - 信贷指标覆盖法人实体，不涵盖每个个体经营者。
      - - 哥伦比亚
        - 实时支付采用
        - 前五个月 >500m 笔 Bre-B 交易、>100m 个支付密钥
        - 更快的互操作轨道可以改善收款，并为承保留下数据尾迹。
        - 早期上线统计；长期留存和变现仍未知。
      - - 美国
        - 融资需求和结果
        - 60% 寻求融资；42% 获得全额；线上贷款机构申请人占比升至 29%
        - 即使在成熟市场，融资需求和渠道取舍也很强。
        - 基于雇主企业的调查结果，不涵盖所有美国小企业。
    notes: 指标刻意混合信贷、支付和信任，因为实际可服务市场取决于三者， 不能只看企业数量。
