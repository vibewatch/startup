      - number: '7.5'
        title: 缓释项真实存在，但承销仍需要监测触发器
        blocks:
          - type: paragraph
            body: >-
              本章不应被解读为 Kapital 已立即陷入困境。公开证据显示，这是一家有规模、盈利、资本、流动性、HR A+/Stable 评级，且在保留 Buró
              披露中零公开制裁的运营中银行。这些事实重要，因为它们让彻底偿付能力或牌照丧失情景目前低于最高风险层级。公司也有正式投诉和 Condusef
              界面、可见信贷文件和足够公开报告，证明它是真实受监管运营商，而不是薄薄包一层的 fintech。


              如果少数可观察触发器走错方向，投资论点仍会很快破裂。最清晰的淘汰标准包括：2026 批次 账龄成熟后披露的不良或覆盖率恶化；任何与 Intercam
              整合相关的监管条件、执法或审批延迟；另一场涉及开户数据的可信隐私 / 安全事件；在 IPO 规划升温前，无法把 Series C 势头转化为更清晰披露；或证据显示控股公司
              融资、契约或客户迁移执行比公开材料暗示的更差。因此，正确尽调姿态是持续监测且渴求证据：在把当前增长视为已去风险之前，要求私有组合、治理、整合和安全材料。
