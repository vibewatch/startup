  - id: TM005
    title: 增长驱动因素和约束表
    columns:
      - 因素
      - 方向
      - 时间
      - 证据
      - 对 Kapital 的含义
    rows:
      - - Plan México 信贷推动
        - 驱动因素
        - 近期
        - 30% 可持续中小企业信贷目标和 MX$4bn 首次融资基金
        - 扩大中小企业承保和首贷产品的政策顺风。
      - - 墨西哥数字轨道规模
        - 驱动因素
        - 近期
        - 69% 手机银行采用率和 2025 年 >6bn 笔数字交易
        - 更多用户可以数字化上手，并留下可用交易数据。
      - - 哥伦比亚强制开放金融
        - 驱动因素
        - 12-24 个月
        - 0368/2026 号法令加六个月标准化时间表
        - 提高机构之间复用账户和上手数据的概率。
      - - Bre-B 互操作 RTP 轨道
        - 驱动因素
        - 近期
        - 前五个月 >500m 笔交易、>100m 个支付密钥
        - 提高收款速度，并生成更丰富的支付历史。
      - - 跨境支付摩擦
        - 驱动因素
        - 持续
        - US$1.4T 区域机会，以及小额转账 23.3%-30% 费率痛点
        - 支撑面向供应商密集型中小企业的支付加金融价值主张。
      - - 墨西哥开放银行延迟
        - 约束
        - 持续
        - 2018 年法律已存在，但交易数据和同意规则仍未完成
        - 让集成保持定制化，并拖慢大规模自动承保。
      - - 信任和现金依赖
        - 约束
        - 持续
        - 墨西哥 80% 现金使用率和 30% 数字安全担忧
        - 推高 CAC、教育负担和上手摩擦。
      - - 哥伦比亚信贷深度缺口
        - 约束
        - 持续
        - 72.5% 法人实体拥有产品，但只有 26.7% 有活跃信贷；微型企业为 15.3%
        - 需求真实存在，但风险、文件和产品设计仍然重要。
      - - 成熟市场定价警示
        - 约束
        - 持续
        - 美国银行收紧 C&I 标准；60% 线上贷款机构借款人遇到高于预期的成本
        - 只扩张数字渠道，不能保证好的单位经济或借款人信任。
    notes: 最高置信度的增长逻辑来自更好的支付轨道叠加更好的承保； 最高置信度的风险则是信任转化缓慢。
    claimRefs:
