      - number: '8.2'
        title: 融资背景、价格支撑与入场纪律
        blocks:
          - type: paragraph
            body: >
              当前融资背景异常混合。正面看，Kapital 进入 2025 年末时拥有新鲜 Series C、管理层盈利说法、重复投资人支持，以及确认公司已远离纯创业阶段的独立报道。1Q26 银行文件和 HR Ratings
              更新也通过展示受监管银行层可用资本、流动性和利润支撑，强化了这一图景。这些事实意味着 US$1.3 billion 标记并不是随机叙事价格；公开证据至少能解释为什么投资人愿意支付这个价格。


              但同一批证据也说明，公开材料对价格的支撑并不完整。Kapital 仍没有保留的公开合并收入运行率或 ARR 披露，没有完全稀释
              股权结构表，没有清算瀑布，也没有清楚解释经济价值有多少落在受监管银行，多少落在更广集团。这让软件式估值方法变得脆弱，也让简单单股回报计算带有猜测。Finro 的 Q1 2026 数据集是有用提醒：fintech
              可比公司工作现在需要严守阶段和细分纪律；支付和转账中位数远低于周期高点私人估值， 2026 年投资人也越来越用公开市场现实压力测试私人轮次。Eqvista 的 2026
              后期阶段笔记指向同一方向，认为没有治理和指标准备度时，公开市场投资人已不再接受 2022 年式定价。


              入场纪律因此必须明确。投资人不应单为 AI
              溢价叙事买单。有纪律的入场要么要求低于上一轮的价格，要么要求高于当前市场掌握程度的证据包。实际操作中，这意味着在上调判断前要求三类催化之一：披露合并收入和产品组合、完全稀释 股权结构表与 Series C
              条款桥，或持续证据证明 Intercam 整合能创造费用和存款上行，同时不拖累合规或资产质量。在此之前，上一轮披露价格应视为大体可辩护，但并不明显便宜。
