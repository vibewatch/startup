  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位 / 定价基础
      - 当前公开数值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 企业存款账户
        - 浮存金、余额相关费用、支付活动和附属银行服务。
        - Cuenta Empresarial：无年费；Cuenta PyME：开户金额 MXN 5,000，若低于平均余额门槛，罚金 MXN 170 + IVA。
        - 可见且已上线，但实际账户收益率未披露。
        - 中——存在有粘性的轨道，但公开披露看不出每账户净收入。
        - 提供按客群拆分的账户级 ARPA、平均余额、费用减免和交易变现。
      - - Banca Kapital 软件
        - 面向分析、支付自动化、预测和运营工作流的月度订阅。
        - MXN 1,199/月 + IVA。
        - 明确标价已公开。
        - 中——标价最清楚，但未披露采用量、毛利率或流失。
        - 提供付费席位数、账户绑定率、毛利率，以及按客群拆分的流失 / 留存。
      - - Crédito PyME（中小企业信贷）
        - 利息收入，加开户费、保险绑定和潜在罚金。
        - 公开示例：3% 开户费；MXN 200,000、最长 36 个月，对应 CAT 58.3%。
        - 已上线且明确定价。
        - 中高——信贷收入真实存在，但扣除损失后的回报仍未披露。
        - 提供净息差、违约 / 回收曲线，以及计提后的实际收益率。
      - - Crédito FLEX / 供应商金融
        - 面向供应商付款和发票融资的循环或分阶段信贷。
        - 公开披露提到最高 7 MDP、最长 12 个月、年利率 30%，并在示例中给出 CAT 61.9%。
        - 已上线且明确变现。
        - 中高——定价可见，但使用率和信贷损失不可见。
        - 提供使用率、重复提款率、平均票据金额、NPL 和准备金假设。
      - - 保理
        - 针对应收款预付资金，并收取费用和利息。
        - 营销材料称，最长 120 天到期的发票今天即可变现；成本页给出保理 CAT 示例和放款手续费结构。
        - 产品已上线，但实际抽成率未公开。
        - 中——收入机制清楚，实际利差不清楚。
        - 提供平均预付率、费用抽成、期限、损失，以及按核心债务人拆分的集中度。
      - - FX 转账
        - 转账费、FX 价差、结算服务和现金管理活动。
        - 披露了币种；客户价差或加价未公开披露。
        - 能力已上线，经济性不透明。
        - 低-中——是有用的相邻能力，但看不到实际价差或交易量收入。
        - 提供 FX 交易量、实际价差、对冲成本，以及按通道和币种拆分的净收入。
      - - 银行卡和薪资工作流
        - 卡交换费 / 净消费经济性，加薪资处理变现或打包留存价值。
        - 功能存在已公开；独立定价未公开。
        - 工作流可见，变现不可见。
        - 在披露银行卡和薪资抽成率前，质量偏低。
        - 提供活跃银行卡、消费量、扣除奖励后的交换费、薪资账户和薪资变现。
    notes: 本表把产品可见度和变现确定性分开。部分轨道有公开标价，但实际收入结构仍未披露。
