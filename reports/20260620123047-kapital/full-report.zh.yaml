  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价与混合 GTM 动作
        blocks:
          - type: paragraph
            body: >-
              Kapital 的公开变现界面比常见 SME neobank 叙事更宽。官方页面显示至少六条已上线或相邻 rails：企业存款账户、付费财务管理平台、SME 定期信贷、循环供应商融资、保理和 FX
              转账，薪资和卡控制也嵌在同一运营工作流中。关键是，这些 rails 的定价方式并不相同。最清晰的显性软件价格，是企业平台每月 MXN 1,199 加
              VAT；账户经济性则更多依赖余额门槛、交易费和交叉销售。Cuenta Empresarial 宣传无年费、无开户最低额，但 Cuenta PyME 要求 MXN 5,000 开户，若月均余额低于 MXN
              2,500，则收取 MXN 170 加 VAT。信贷产品在公开视角中变现更重：Kapital 自身示例中，Crédito PyME 有 3 percent 开户费和 58.3 percent CAT，公开
              FLEX / 保理披露也显示较高 CAT 和提款费用。GTM 看起来也是混合型，而非纯自助：客户可以线上开户并数字化管理运营，但网站反复推动顾问回电、高管协助、基于 CIEC
              的数据导入和文件密集型承保。这个组合说明 Kapital 在销售一个可规模化的 SMB 操作系统，但其实际经济性很可能更依赖贷款和资金管理交叉销售，而不只是软件标价。
