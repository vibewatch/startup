      - number: '1.5'
        title: 负面信号与证据缺口
        blocks:
          - type: paragraph
            body: >
              本章有两个重要负面信号。第一，Cybernews 在 2024 年 12 月报道称，研究人员发现一个归属于 Kapital 的 Google Cloud Storage bucket 对外暴露，包含约 1.67
              million 个文件，主要是用于验证的选民 ID 和自拍照。Cybernews 称，在发布前曾多次发送披露通知并联系 CERT-MX，但未收到 Kapital 回复。表面看，这对任何把自己定位为 AI
              驱动、受监管金融机构的公司都是实质运营风险信号，因为它削弱了公司的合规与基础设施叙事。


              第二，收购 Intercam 可能有战略价值，但也带入合规和声誉风险。多份留存来源把交易放在美国制裁和针对 Intercam 的洗钱指控背景下。即便批评主要指向 Intercam 或更广泛的 Mexico
              银行业危机，Kapital 仍成为整合方，必须证明客户准入、AML/KYC 和资产审查能按承诺运行。这不会推翻增长故事，但意味着后续章节应检验 2026 年财务加速是否伴随更高的整合风险或行为风险。


              重要概览缺口仍未解决。公开来源没有给出清晰、可访问的 2026 年员工数、完整董事会构成、经调和的生命周期融资表，或清晰披露的 Series C
              后资本结构。一些本地档案甚至在创立年份和估值上漂移：在高质量融资报道指向 2020 年和 $1.3 billion 时，仍有来源写成 2019 年或 $1.35
              billion。正确的尽调姿态，是明确保留这些不一致，而不是把它们抹平为单一精致的公司叙事。
