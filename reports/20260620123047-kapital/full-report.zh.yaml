      - number: '6.4'
        title: 耐久性证据比增长证明更薄，App 和投诉负面信号值得关注
        blocks:
          - type: paragraph
            body: >-
              Kapital 最弱的公开客户披露是留存和满意度。保留章节来源中没有披露 NRR、GRR、logo 留存、流失、续约期限或 cohort
              表。因此，可用代理指标都是间接的：经常性工作流产品设计、公开客户引述、应用商店评分和投诉披露。最强的正向代理指标是产品深度和嵌入式工作流。Banca Empresarial
              包含供应商付款管理、预测、发薪和一键发票工作流，Banca en Línea 处理资金管理和水电等缴费，FX 页面面向反复跨币种转移资金的企业。如果客户深度采用，这些动作具有黏性。Mexico Business
              News 还引用管理层称，公司从问卷、聊天机器人和投诉中学习以改进平台，至少说明存在活跃反馈回路。


              不过，负面证据足够重要，必须明确记录。Google Play 显示 Kapital Banca Móvil 在 852 条评论中得 3.1 星，旧版 Kapital Bank Móvil App 在 627
              条评论中得 2.4 星，评论提到卡顿、流程混乱、数字 token 摩擦，甚至 ATM 出钞争议。Finantres 同样认为 Kapital
              更适合企业，而不是只想要基础个人账户的用户，并提醒读者仔细审查佣金。Buró de Entidades Financieras PDF 给出更硬的服务数据点：2025 年 310 起投诉，每 10,000
              份合同投诉指数 6.3，关注评分 9.46。正确解读不是客户质量已经坏掉，而是公开耐久性证明混合，运营服务质量仍是真实尽调线索。
