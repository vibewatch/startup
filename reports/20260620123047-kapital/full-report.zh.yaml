  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 竞争对手
      - 公开价格 / 单位
      - 合同模式
      - 包含能力
      - 未知项 / 折扣
      - 含义
    rows:
      - - Kapital
        - 抓取的产品页面没有公开标价
        - 信贷 / 卡 / 保理以邀约驱动打包
        - 信贷、公司卡、保理、账户、FX、数字银行
        - 实际利率、费用和组合折扣未公开
        - 有利于销售灵活度，但削弱透明自助对比
      - - Konfío
        - 固定利率信贷定位；抓取页面没有公开银行卡或现金管理费用表
        - 贷款以邀约驱动，正扩展更广业务栈
        - 信贷、银行卡、终端、未来存款 / 现金管理野心
        - 抓取摘录中没有公开实际利率
        - 适合顾问式销售，不利于即时价格对比
      - - Clip
        - 硬件套装 MXN2,598 起；无月租；高交易量佣金有竞争力
        - 硬件驱动商户采用，加上基于邀约的贷款定价
        - 终端、受监管账户、链接、商户贷款
        - 抓取页面没有公布完整 MDR 费率表
        - 对微型 SMB 商户获客很有吸引力
      - - Conekta
        - 银行卡 3.4% + MXN3 起；现金 2.6% + MXN3；SPEI MXN12.50 起；均另加 IVA
        - 按成功交易付费的平台定价
        - API、收银台、插件、链接、银行卡、现金、转账
        - 企业费率按交易量谈判
        - 数字商户对比 PSP 经济性时透明度高
      - - BBVA TPV
        - MXN300 入网；额外终端每月 MXN150；便携借记卡费率 2.15%；低交易量罚金
        - 传统银行收单加关系银行
        - 账户、TPV、网点服务、数字信贷邀约
        - 摘录中信用卡 MDR 细节和谈判费率不完全可见
        - 传统银行可以直接用商户收单经济性竞争
      - - Santander PyME
        - PFAE 方案 MXN0 起；抓取页面看不到更深的终端定价
        - 账户 + 终端 + 应用组合
        - 账户、终端、链接、目录 / 库存、网点 / 数字银行
        - 抓取摘录没有公开 MDR、硬件和谈判组合细节
        - 即便没有完整公开费率披露，头部组合仍有吸引力
      - - Mercury
        - US$0 基础版；US$29.90 Plus；US$299 Pro
        - 在免费银行服务上叠加软件变现
        - 支票 / 储蓄、电汇、开票、银行卡、审批、会计自动化
        - 现金管理有余额门槛；经济性仅限美国
        - 展示金融软件打包可以长成什么样
      - - Brex
        - 现金管理收益最高 3.68%；价格页绑定账户 / 现金管理组合，而不是简单 MDR 表
        - 银行 + 现金管理 + 支出管理组合
        - 企业账户、现金管理、AP、开票、银行卡、控制
        - 对墨西哥的意义仅是基准
        - 说明现金管理和 AP 可以成为变现层，而不只是卡交换费
    notes: 本表比较公开标价或头部打包方式，不是实际谈判经济性。实际利率缺失是重要尽调缺口，因为真实折扣很可能决定竞争交易的胜率。
