        - 低摩擦经营账户，带薪资和供应商付款工作流；适用产品享有持牌银行保护
        - 公开材料没有披露卡、FX 或贷款的挂载率
      - - Banca Empresarial
        - 财务团队、业主和财务控制人员
        - 已上线，是套件核心
        - 在基础银行账户之外加入卡、供应商发票、预测、融资入口、组件和薪资控制
        - 没有公开架构图、API 界面或管理员角色模型
      - - Banca en línea + token 层
        - 需要网银和更高控制操作的用户
        - 已上线，沿用受监管体系，并有主动文档
        - Softtoken / token 门控、明确操作窗口和渠道级费用披露，显示银行级流程控制
        - 公开文档没有披露 MFA 失败率、欺诈控制或企业管理员授权细节
      - - Tarjetas / 钱包控制
        - 员工、出差人员和支出管理员
        - 已上线，但文档分散
        - 企业平台和 app 里可见开卡、充值、分配、钱包控制、锁卡流程，以及实体 / 虚拟卡混合场景
        - 直接卡页面返回 404，卡规则深度分散在各处，没有集中呈现
      - - Crédito PyME（中小企业信贷）
        - 需要营运资金贷款的 SME
        - 成熟并已承保
        - 公开记录了承保输入、担保人 / 担保预期和 CAT / 费用披露，强于典型私营 fintech 营销材料
        - 通过率、风险分层和放款后表现仍不公开
      - - Crédito FLEX + Crédito Factoring（灵活信贷 + 保理）
        - 供应商付款和应收账款融资用户
        - 已上线，但经济风险较重
        - 两个产品嵌入同一生态，并在官方成本手册中披露提款费 / CAT 示例
        - 公开页面没有展示使用率、复用或债务人集中度
      - - FX 和移动 app 栈
        - 跨境调拨资金的企业，以及需要随时控制的用户
        - 已上线，覆盖多个界面
        - FX 转账工作流，加上独立的银行、token 和 FX app 足迹，表明其嵌入式银行栈比单一巨型 app 更宽
        - 没有公开集成文档或发布说明解释这些 app 界面在后台如何交互
    notes: 各行基于留存公开证据描述产品成熟度，而不是基于保密客户数或使用深度。
