      - number: '3.3'
        title: 既有银行、监管姿态与切换成本
        blocks:
          - type: paragraph
            body: >
              既有银行仍具结构性威胁，因为它们把信任、存款和商户收单打包在一起，而金融科技公司仍无法完全匹配。BBVA 发布的 Cuenta Maestra Pyme 看起来摩擦很低，开户最低 MXN
              1；但运营现实是网点开户、部分法人实体需要实际受益人声明，并依赖既有 BBVA 关系才能解锁数字信贷 offer。它还公布了商户收单经济性，包括便携 TPV 的 2.15%
              借记卡折扣率，以及入会和低交易量费用。Santander 的 PyME 组合也围绕账户、终端和 app 控制打包，PFAE 的头部计划从 MXN 0 起，另有 Getnet
              的付款链接、目录、库存和终端工作流等功能。Banorte 在当前抓取流程中透明度较低，因为其官方 SME 产品 URL 不稳定，但公司发布的认可信息仍指向重要的 SME 贷款和存款份额。


              这些银行结构以不同于金融科技 UX 的方式抬高切换成本。一旦 SMB 把存款、供应商付款、卡和 POS 结算都接入一个银行账户，换供应商会同时影响合规、网点服务、资金控制和支付
              rails。这并不意味着既有银行总是更好用；事实上，它们的文件和 offer 门控信贷流程给金融科技公司留下了用速度取胜的空间。但这意味着 Kapital
              不能假设软件便利性本身就能形成锁定。要守住主账户，它必须匹配或超过银行明确展示的信任、披露和运营账户相关性。
