      - number: '8.3'
        title: 牛市、基准、熊市情景与可比公司组
        blocks:
          - type: paragraph
            body: >
              可比证据指向对 Kapital 价格的中间判断。公开 LatAm 和数字银行可比公司质量跨度很大：Nu 和 MercadoLibre
              估值巨大，因为它们把广泛分发与已验证盈利引擎结合起来；StoneCo、PagBank 和 LendingClub 则展示更聚焦的支付、SMB 和数字银行模型在公开市场能拿到什么价格。私人可比也混合。Ualá
              2026 年 3 月轮次把一家全栈 LatAm neobank 估到 US$3.2 billion；Mercury 2026 年 5 月 Series D 把一家盈利的美国 SMB 银行 fintech 估到
              US$5.2 billion；Clara 尽管后来有债务融资，在 Tracxn 中仍约为 US$1 billion。Kapital 的 US$1.3 billion 价格高于 Clara，低于 Ualá 和
              Mercury，也远低于规模化公开赢家。


              这个位置方向上合理，但不能自证有效。客户价值视角尤其有启发。用 300,000 客户数字计算，Kapital 上一轮披露价格意味着每客户约 US$4.3 thousand。这明显高于 Nu 或 Ualá
              等大众市场 LatAm neobank，但仍远低于 Mercury 的 SMB 客户价值。含义是，市场已经把 Kapital 定价为更高价值的企业客户和资产负债表平台，而不是商品化零售
              neobank。这可能合理，但前提是承销、附着和留存确实好于当前公开记录所能证明的水平。


              因此，情景区间刻意保持纪律。熊市情景假设整合、合规或信贷质量问题把 Kapital 推向估值持平或降价轮。基准情景假设 1Q26 盈利信号可持续，但尚不足以解锁溢价重估。牛市情景要求合并盈利可见、Intercam
              整合成功，并在 2027-2028 年窗口形成可信 IPO 或战略退出路径。以今天可获得的公开证据看，基准情景聚集在上一轮附近，而不是远高于上一轮。
