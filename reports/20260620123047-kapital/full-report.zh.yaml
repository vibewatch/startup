            body: >-
              相比多数私营金融科技公司，Kapital 的公开记录提供了更多资产负债表证据，但证据分裂在受监管 Mexico 银行实体和控股公司层面融资公告之间。在受监管实体一侧，当前画面稳健：KPTL México Bank
              1Q26 报告现金及等价物 MXN 22,233 million，资本比率 13.52 percent，流动性覆盖系数 407，净资本 MXN 5,289 million。存款继续环比增长，该实体季度净利润
              MXN 533 million。HR Ratings 也在 2026 年 3 月给出 Stable 展望和 HR A+ 评级。在控股公司一侧，主要公开信号是 2025 年 9 月以 $1.3 billion
              估值完成最高 $100 million 的 Series C；管理层和多家新闻机构称这将加速 AI 驱动生态建设。这笔新资本降低了明显的近期融资压力，但没有闭合核心尽调回路。公开来源仍未披露合并集团现金、烧钱、
              runway、契约余量，或非 Mexico 业务的资本强度。也没有显示集团增长有多少依赖进一步并购、表外承诺或信贷扩张。财务上，正确解读是 Mexico
              银行看起来可融资且流动性充足，但仅凭公开证据无法测算集团的下一轮融资依赖。
