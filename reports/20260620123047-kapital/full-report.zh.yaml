      - number: '2.2'
        title: 受约束的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              用一个 TAM 数字概括会误导判断，因为相关市场会随企业数量、信贷可得性、支付数字化或跨境需求等不同视角而变化。最宽的企业数量视角显示规模很大：Mexico 约 4.9 million 家
              SME，Colombia 1.739 million 家活跃企业，美国 5.58 million 家 500
              人以下雇主企业。但这些宽口径数量高估了工作流驱动金融平台的实际可触达市场，因为许多企业过于非正式、太依赖现金、数字化太浅，或客单价太小，启动阶段经济性不够好。

              第二个视角是金融可得性。在新兴市场，正式 MSME 融资缺口估计为 US$5.7 trillion；若纳入非正式企业，升至 US$8 trillion。新兴市场仍有 70% 的 MSME 缺乏足够融资，Latin
              America 和 Caribbean 的正式 MSME 金融供给在 2015-2019 年还以约每年 4% 收缩。国家证据说明这为什么对 Kapital 重要。在 Mexico，引用 CNBV 的 2026
              年本地报道称，只有约 15% 的 SME 能获得正式信贷，即便 Plan México 正在推动 30% 的可持续信贷可得性目标。在 Colombia，2024 年 72.5%
              的法人实体至少有一项存款或信贷产品，但只有 26.7% 有活跃信贷，微型企业远比大型企业更缺服务。在美国比较市场，融资更可得，但仍非无摩擦：过去 12 个月里 60% 的雇主企业寻求融资，却只有 42%
              拿到所需全额。

              第三个视角是支付和数据就绪度。Mexico 的移动银行采用率在 2024 年达到 69%，Banco de México 基础设施在 2025 年处理超过 6 billion
              笔数字交易，但现金仍占主导，针对交易数据的开放银行规则仍未完成。Colombia 的互操作 rails 看起来更成熟：Bre-B 已作为即时支付系统上线，前五个月处理超过 500 million 笔交易，支付
              key 超过 100 million 个。区域支付数据同样重要，因为许多 SMB 痛点与供应商和贸易有关，而非纯国内问题。Mastercard 和 PCMI 描述了一个 US$1.4 trillion 的
              Latin American 跨境 SME 机会，但也显示一笔 US$250 汇款平均费用可达 23.3%，部分走廊达到 30%。

              综合看，证据支持受约束的规模测算，而不是激进 TAM 叙事。实际 SAM 是正式 Mexico 和 Colombia SMB 的子集，加上部分与美国相关的走廊用户；这些企业已经运行在数字或半数字支付 rails
              上，并且有重复性的供应商、收款或营运资本工作流。公开来源无法拆出 SOM，因为 Kapital 没有按地理和分部公开活跃客户数、支付量或信贷余额。
