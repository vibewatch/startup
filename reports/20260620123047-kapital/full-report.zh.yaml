  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 合并收入 / ARR
        - 留存公开来源没有披露集团收入运行规模、ARR 或产品层级结构
        - 缺少这一项，软件式或混合金融科技倍数都站不住
        - 管理层资料室；经审计或董事会级 KPI 包
      - - 完全稀释股权结构
        - 公开信息没有股数、期权池、可转债或 Series C 后所有权图谱
        - 回报测算和稀释无法建模
        - 财务团队导出的股权表，加上律师确认的股份类别
      - - Series C 条款
        - US$1.3B 轮没有清算优先权、反稀释或参与权细节
        - 优先权悬顶可能抹掉表面入场上行
        - 领投方附函或融资文件
      - - Intercam 整合 KPI
        - 公开信息没有客户迁移、合规整改或网点 / 资产表现时间表
        - 这是平台上行情景里最大的摆动因素
        - 与风险和运营负责人复盘整合工作流
      - - 按年份分层的资产质量
        - 公开信息没有按收购账簿与自营账簿拆分的 NPL、拨备或核销桥
        - 投资人无法判断披露盈利是否可持续
        - 信贷委员会材料和年份分层表
      - - 控股公司现金转化
        - 公开信息没有从受监管银行盈利到集团现金生成、可上划股息的桥
