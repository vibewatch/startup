  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Kapital 方案
      - 可衡量收益
      - 限制
    rows:
      - - 开通 SME 经营账户并开始交易
        - 企业提交开户文件、向账户入金，然后进入日常转账和付款
        - Cuenta PyME 或 Cuenta Empresarial
        - 公开声称的 48 个工作小时 PyME 开户路径和数字账户操作，降低对网点的依赖
        - 开户仍取决于文件完整性和监管审批
      - - 运行薪资和经常性应付账款
        - 财务团队在同一经营栈中登记协作者、安排付款并执行发放
        - Banca Empresarial 加账户通道
        - 薪资、批量付款和提醒嵌入同一工作流，而不是分散在多个工具里
        - 没有公开薪资集成目录或导出 / API 细节
      - - 控制员工和企业支出
        - 管理员开卡、分配资金，并按用户或行程监控支出
        - Banca Empresarial 内的卡控制，加移动钱包管理
        - 平台和 app 界面支持实体卡和虚拟卡用例
        - 直接卡页面不稳定，因此规则深度和卡项目结构没有完整文档
      - - 融资供应商发票并平滑现金流
        - 公司审核发票、安排供应商付款，或通过营运资金产品融资
        - Banca Empresarial 中的供应商工作流，配 Crédito FLEX 或保理
        - 同一界面里的应付账款、融资和预测减少上下文切换
        - 公开来源没有展示授信额度调整或发票适格性的政策规则
      - - 跨境转账
        - 用户基于既有 Kapital 关系或 FX 合同操作，并为跨境转账提交实体文件
        - 企业外汇转账
        - 官方页面记录多币种转移和清晰的最低文件集
        - 定价只是示例，公开资料没有披露集成深度
      - - 通过 web 和移动渠道操作
        - 用户激活 token / softtoken、登录、执行 SPEI、跟踪余额，并使用移动 app 功能
        - Banca en línea、Kapital Business、Kapital Banca Móvil 和 Kapital Bank Móvil app
        - 多渠道访问支持 24/365 可见性和低成本数字转账
        - 应用商店评论显示部分界面存在可用性和 token 摩擦
    notes: 收益只限于公开来源明确记录的内容，不应解读为经审计的客户结果。
