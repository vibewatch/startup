  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失的私有指标
      - 对分析的影响
      - 当前公开状态
      - 具体尽调路径
    rows:
      - - 按收入流拆分的合并收入
        - 阻碍对收入质量和多元化做严肃承保。
        - 留存来源没有披露收入流层面的收入、ARR 或毛利。
        - 要求提供月度管理账，拆分软件、存款 / 支付、贷款、保理、FX、卡、薪资和其他收入。
      - - 实际定价与标价
        - 无法验证 take rate、折扣和贡献利润率。
        - 部分产品标价公开，但实际定价不公开。
        - 要求提供软件、FX、卡和薪资的实际价格 cohort、折扣 / 减免日志及产品 P&L。
      - - 集团现金、burn 和 runway
        - 无法估算融资依赖度。
        - 留存来源没有披露合并现金、月度 burn 或 runway。
        - 按法律实体取得资金报告、预算对实际 burn，以及情景 runway。
      - - 产品层面的逾期和损失曲线
        - 无法承保准备金充足性和贷款耐久性。
        - 公开信息只有全行 2.8% NPL 率和 107.3% 覆盖率。
        - 要求按贷款产品披露 vintages、分桶迁移、回收、重组和集中度。
      - - 销售效率和 CAC / 回本
        - 难以与其他 SMB fintech 做有意义比较。
        - 留存来源没有披露 CAC、转化率或回本。
        - 按产品线披露渠道结构、CAC、销售薪酬、激活和回本。
      - - FX、卡和薪资商业化
        - 三个可见工作流功能仍无法给经济性打分。
        - 能力公开；单位经济性不公开。
        - 披露 FX 交易量和点差、活跃卡消费和 interchange、薪资账户数，以及薪资收费收入。
      - - 非墨西哥实体贡献
        - 看不清墨西哥银行申报代表了大部分经济性，还是只是一个盈利核心。
        - 公开来源提到哥伦比亚和美国触达，但没有分部 P&L。
        - 按国家 / 实体要求分部资产负债表、收入、直接成本和资本使用。
      - - 契约和控股公司债务图
        - 下行融资风险解释不足。
        - 独立报道提出契约和压力情景问题，但公开没有债务明细表。
        - 取得完整债务栈、契约包、抵押图和流动性触发阈值。
    notes: 尽管公开披露集异常丰富，每一行仍标出一个具体缺失输入；没有它，标准 fintech、SME 贷款或持牌银行承保都会卡住。
    claimRefs:
