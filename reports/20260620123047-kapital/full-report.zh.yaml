        - Cuenta PyME、Cuenta Empresarial、成本手册，以及官方页面上的 CNBV / IPAB 引用
        - 银行牌照、资金基础和受保护产品待遇
        - 公开来源没有披露核心银行供应商、账本模型或事故指标
      - - 企业工作流层
        - 把卡、薪资、供应商发票、预测和融资入口聚合到一个财务仪表盘
        - Banca Empresarial 页面
        - UI / 管理模型、文件摄取和工作流编排
        - 没有公开 API、角色权限或导出控制文档
      - - 网银控制层
        - 提供 token 化网银、付款和明确操作窗口
        - Banca en línea FAQ 和费用
        - Token / softtoken 发放、网点支持和 web 认证
        - 公开 app 评论和支持说明中出现 token 恢复摩擦
      - - 移动 app 层
        - 通过移动设备提供余额、转账、卡控制、投资、token 操作和钱包功能
        - Google Play、App Store 和开发者资料列表
        - 持续 app 维护、移动 OS 兼容性和应用商店合规
        - 评分和评论显示不同代 app 的 UX 质量不一致
