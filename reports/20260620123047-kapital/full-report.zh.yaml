  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与建议
        blocks:
          - type: paragraph
            body: >
              Kapital 的可投资论点强于普通后期私人 fintech，因为这家公司在风险投资叙事之下已有真实受监管银行披露。

              保留证据显示：2025 年 9 月 Series C 最高 US$100 million，估值 US$1.3 billion；客户触达 300,000；资产负债表口径 US$3 billion；以及 1Q26
              墨西哥银行文件披露资产 MXN 71.946 billion、存款 MXN 58.421 billion、净贷款 MXN 25.786 billion、季度净利润 MXN 533
              million。这一组合很重要：不同于许多私人 neobank，Kapital 能指向已披露的资产负债表规模、盈利能力和监管资本，而不只是收入说法和用户增长。


              反论点是，投资人仍无法把这些银行层指标桥接到 US$1.3 billion 轮次真正定价的合并股权故事。公开来源没有披露合并收入 收入运行率或 ARR、完全稀释股数、Series C
              后所有权图，也没有披露风险投资层级中的任何清算优先权和优先权负担。Intercam 交易还引入整合和合规风险，而 2024 年 12 月 Cybernews 泄露事件削弱了 Kapital
              仅因掌握更多受监管栈就应获得 AI 或基础设施溢价的说法。


              因此，正确结论对价格敏感，而不是对公司质量敏感。Kapital
              看起来是一个真实金融平台，运营证据足以支持继续尽调，但披露还不足以支持按上一轮披露价格买入。建议是跟踪，置信度中等，风险评级高，估值立场为公允。更便宜的入场价，或一套能补上
              ARR、股权结构表和优先权栈缺口的新披露包，比另一条泛泛增长新闻更能改变判断。
