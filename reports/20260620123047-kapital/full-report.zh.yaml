companyProfile:
  summary: >-
    Kapital 是一家创立于 Mexico City 的 SMB 金融平台，把工作流软件、贷款和资金管理工具与并购取得的银行基础设施结合起来，到 2025 年已成为受监管金融集团。公司主要在 Mexico
    向企业销售企业账户、中小企业信贷、供应商和发票融资、卡、薪资和财务运营软件；更早和更晚的披露也提到 Colombia、Peru 和美国。公开证据显示，Kapital 在 2025 年 9 月完成独角兽轮融资，客户约 300,000
    家，1Q26 银行资产负债表已有实质规模，但关键的控股公司层面经济性和治理细节仍未披露。
