      - number: '7.4'
        title: 整合和创始人集中放大了伙伴、依赖和人员执行风险
        blocks:
          - type: paragraph
            body: >-
              Kapital 下一阶段的执行负担异常高，因为多项依赖必须同时跑通。公司一边运营高速增长的银行，一边整合在制裁时期压力下收购的 Intercam 资产，还要在 2025 年独角兽轮后维持外部资本可及性，并讨论
              IPO 时间线。公开指标和评级显示受监管银行今天在运转，但它们不能消除对监管批准、迁移质量、资金市场信心或墨西哥特定宏观条件的依赖。Intercam 交易尤其重要，因为它不是简单补一个产品功能，而是在更高 AML
              和声誉审查下增加券商、资管和运营银行复杂度。


              人员风险同样集中。René Saúl 的公开简介明确把 Kapital 从 fintech 进化到商业银行、再到金融集团归功于他的带领；主流人物报道也继续把 René Saúl 和 Fernando
              Sandoval 呈现为核心公开运营者。创始人市场契合重要时，这是实实在在的优势；但这也意味着，公开视野中很大一部分执行可信度仍落在小团队身上。治理页面有帮助，但可访问材料仍没有给投资人一张清晰公开的委员会图或
              控股公司风险看板。实际含义是，执行风险已不再主要是能否推出产品；而是管理层能否足够快地工业化治理、报告和整合控制，以支撑下一轮融资或 IPO。
