  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >
              Kapital 面对的不是单一同业群体。在 Mexico 的 SMB 金融栈里，买方至少可以通过五个楔子解决同一任务：像 Konfío 这样的信贷驱动金融科技公司、像 Clip 这样的商户运营栈、像
              Conekta 或 Adyen 这样的支付编排层、像 BBVA、Santander 或 Banorte 这样的全牌照既有银行，以及像 Nu 这样未来可能延伸进商业银行的相邻消费者到银行品牌。

              Kapital 自己的官方界面说明了这种重叠为什么重要：它在同一品牌表面销售企业信贷、公司卡、保理和企业账户，而不是单一用途产品。这意味着真正的竞争问题，不是谁能匹配某个孤立功能，而是谁能成为 SMB
              的主运营账户。


              最强的短期替代者，是已经掌握日常工作流的公司。Konfío 掌握信贷关系，并试图增加存款和资金管理；Clip 掌握线下受理和商户当日结算；Conekta 掌握线上结账、SPEI 和现金收款 rails；BBVA
              和 Santander 掌握受监管存款账户和商户收单；Adyen 掌握更成熟商户的全渠道受理。

              Nu Mexico 公开产品上还不是商业银行竞争者，但其持牌银行转型和规模仍然重要，因为如果后续进入 SME 产品，它可能压缩获客经济性。这意味着 Kapital 几乎要像防御直接一对一替代一样，防御拆包多归属。
