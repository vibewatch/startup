chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与版图
        blocks:
          - type: paragraph
            body: >
              Kapital 现在最准确的身份，是一家面向中小企业的银行、贷款平台和运营软件混合体。TechCrunch 2023 年的报道把公司定义为一家 Mexico City 金融科技公司，由 René Saúl 和
              Fernando Sandoval 于 2020 年创立，目标是让 SMB 也能像大型企业一样看清现金流、信贷、开票和运营决策。CNBC 2024 年 Disruptor 50 档案以及后续 2025
              年融资报道显示，平台已经从信贷和现金管理工具扩展为更完整的组合，覆盖账户、卡、薪资、福利和 AI 辅助承保。留存的官方治理页面也显示，Kapital
              将自己定位为一个集团，业务和消费者产品覆盖账户、信贷、FX、投资、数字银行和 AI。


              最清晰的战略主线，是管理层不想长期停留在既有银行 rails 之上的薄软件层。Kapital 的产品定位把工作流软件与受监管资产负债表产品绑在一起。TechCrunch 在 2023
              年直接写到：创始人希望中小企业在一个地方解决现金流、信贷和投资需求；后来的公司材料则把 Kapital
              描述为技术优先的银行。这个区分会影响报告后续判断：经济性、承保和防御性章节应把银行基础设施所有权视为核心主张，而不只是营销话术。


              地理证据也显示，公司的运营版图随并购扩张而变化。2023 年来源提到 Mexico、Colombia 和 Peru；2025 年轮次报道则强调 Mexico、Colombia
              和美国。这未必矛盾，更可能反映不同披露日期下优先级变化以及哪些司法辖区已有实质活动。可以确认的是，Mexico 是运营重心，公司也越来越把自己包装为受监管集团，而不是单一产品的金融科技 app。
