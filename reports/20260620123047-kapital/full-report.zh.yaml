    rows:
      - - 降价轮或结构化过桥融资
        - 新融资低于 US$1.3B 标记，或附带惩罚性条款
        - 说明上一轮估值站不住，也抬高优先权栈风险
        - 从跟踪转为回避，直到新清算瀑布被厘清
      - - Intercam 整合滑坡
        - 与被收购资产相关的监管、AML/KYC 或客户迁移问题
        - 打破公司成为更广义金融集团的溢价叙事
        - 暂停承销判断，重算熊市情景
      - - 资产质量恶化
        - 资本、流动性或信用指标较 1Q26 银行基线显著变差
        - 拿掉支撑本轮估值的主要公开盈利锚
        - 视为重大估值重置信号
      - - 安全 / 数据控制失效
        - 2024 年泄露后，再次出现高严重性事件
        - AI 溢价和合规叙事会同时被削弱
        - 提高折现率，并要求第三方控制审计
      - - IPO 就绪证据未出现
        - 尽管公司释放 IPO 信息，收入、股权结构或治理披露仍无进展
        - IPO 叙事从退出路径变成营销说法
        - 维持跟踪 / 继续研究，不上调评级
    notes: 这些触发因素要能被公开信息或尽调渠道监测，而不是泛泛的宏观恐惧。
