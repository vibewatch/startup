      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              这个市场里的买方 / 用户 / 付款方模式，比大型企业软件更集中。在 Mexico 的微型和小型企业中，业主经理通常同时是买方、运营用户和最终付款方，即便会计或家人协助对账。规模稍大的 Mexico SME 以及
              Colombia 法人实体中，用户群扩展到财务、运营和采购人员，但预算所有权通常仍在创始人、法定代表人或财务负责人手里。美国 500
              人以下企业比较市场也类似：融资需求往往由即时运营需要驱动，而不是由集中规划的资本预算驱动。

              这些用户买的不只是银行账户。他们买的是速度、确定性和数据复用。Mastercard 的 Latin American SME 研究显示，已经接受数字支付的 SME 中，93% 认为这些 rails
              必不可少或非常重要，84% 认为没有它们企业无法维持，75% 依靠它们支付供应商，88%
              把它们与获得信贷联系起来。这些结果重要，因为它们说明钱包所有者不是在优化最低名义账户费；买方优化的是贸易连续性、结账转化和后续融资。在 Mexico / Central America / Caribbean
              受理研究中，仍有近 11 million 家企业可受益于扩大数字受理，77% 尚未接受数字支付，这给贷款方或运营金融平台成为 system-of-record 留下了很大的开户楔子。

              因此，采用触发点因分部而异。现金密集商户在客户要求刷卡或数字受理时迁移。成长型 SME 在供应商付款、对账和信贷申请过于手工时迁移。Colombia 正式企业在互操作支付 rails
              和开放金融规则让多银行工作流更容易时迁移。与美国相关的跨境 SMB 在供应商付款的延迟、不透明和 FX / 费用拖累痛到足以换供应商时迁移。信任贯穿所有分部：Mastercard 2026 年研究发现，88%
              接受支付的 SME 优先考虑供应商可信度和可扩展性；Mexico 公共政策讨论仍把信任和行为改变描述为主要采用瓶颈，而不是原始技术可用性。
