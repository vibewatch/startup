  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在五种不同证据视角下给出示意性估值输出（US$M），而不是制造单一的伪精确模型。
    data:
      items:
        - label: 披露折价 / down-round 视角
          value: 900
        - label: 上一轮披露轮次锚
          value: 1300
        - label: 银行盈利支撑视角
          value: 1450
        - label: 合并证明上行视角
          value: 1800
        - label: IPO-ready 平台溢价视角
          value: 2200
    approximationNotes: 数值为作者对股权价值的估算，单位 US$M。它们展示当投资者能否依赖合并收入、资本结构和整合证据时，结果会移动多远。
    claimRefs:
      - CV001
      - CV008
      - CV035
      - CV036
      - CV038
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 相对上一轮披露的 US$1.3B 轮次锚，给出熊、基准、牛三档股权价值区间。
    data:
      items:
        - label: 熊
          low: 700
          mid: 900
          high: 1100
        - label: 基准
          low: 1100
          mid: 1350
          high: 1600
        - label: 牛
          low: 1800
          mid: 2200
          high: 2600
    approximationNotes: 所有数值均为作者估算，单位 US$M，不包含未披露清算优先权或进一步稀释。以 US$1.3B 入场时，隐含 MOIC 区间大致为熊 0.5x-0.85x、基准 0.85x-1.2x、牛 1.4x-2.0x。
    claimRefs:
      - CV001
      - CV042
      - CV043
      - CV044
      - CV045
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分卡，采用 1-5 分制，5 分代表最强、最具吸引力。
    data:
      items:
        - label: 市场机会
          value: 4
          note: 墨西哥及周边市场的 SMB 银行和运营金融痛点真实存在
        - label: 产品 / 资产负债表证明
          value: 4
          note: 受监管银行备案和可见产品广度，强于典型私营 fintech 披露
        - label: 护城河耐久度
          value: 3
          note: 组合收敛有用，但锁定效应看起来仍靠执行，而非结构性壁垒
        - label: 经济性可见度
          value: 2
          note: 银行利润可见；合并收入质量和 ARR 不可见
        - label: 治理 / 合规
          value: 2
          note: Intercam 复杂度和 2024 年泄露事件，使这一项低于中性
        - label: 估值证据质量
          value: 2
          note: 价格看起来合理，但股权结构和清算优先权细节缺失
        - label: 融资灵活性
          value: 3
          note: 新 Series C 资金和银行资本都有帮助，但控股公司现金可见度仍然偏弱
        - label: 退出准备度
          value: 2
          note: IPO 叙事已经有了，但 2026 年的市场会奖励比 Kapital 目前披露干净得多的公司
    approximationNotes: 评分仅代表作者基于公开证据的判断。估值证据得分偏低，反映的是数据缺口，不是说这门生意没有价值。
    claimRefs:
      - CV008
      - CV012
      - CV013
      - CV015
      - CV036
      - CV038
      - CV048
