  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              对 Kapital 来说，相关市场不是「所有金融科技」，甚至也不是全部商业银行业务。更窄的边界是 SMB
              运营金融：企业账户、支出控制、供应商付款、收款、短周期营运资本信贷，以及把支付活动转化为承保和工作流自动化的数据层。这个边界重要，因为买方解决的是日常运营问题——如何收款、付供应商、管理卡和现金、在不承担大量纸面流程的情况下获得信贷——而不是采购长期资金管理关系或消费者银行账户。World
              Bank 和 IFC 把 SME 金融描述为发展和生产率的核心瓶颈，同时也指出开放金融、嵌入式金融和替代信贷 rails 可以降低小企业的营运资本摩擦。

              Mexico 是证据中最清晰的核心市场。INEGI 2024 年经济普查记录 7.09 million 家机构和 5.51 million 个私营 / 准国有经济单位；与 Plan México 相关的 2026
              年本地行业报道则把 SME 基数估为约 4.9 million 家企业，占商业版图的 99.8%、正式就业的 72%。Colombia
              是自然相邻市场，因为正式企业基数足够大，具有战略意义——Confecámaras 称 2024 年活跃企业 1.74 million
              家——但融资和支付摩擦仍然明显，尤其在微型和小型公司中。美国语境主要作为比较项和走廊存在：2023 年有 5.58 million 家 1-499 名员工企业，占雇主机构的
              99.7%；但美国商业银行整体过大且成熟，若没有公司披露，不能把它当作 Kapital 有证据支撑的核心 SAM。

              现状替代方案仍是既有银行账户加手工流程：现金收款、电子表格对账、网点服务、不解决营运资本需求的收单机构，以及不复用交易数据的独立信贷申请。在 Mexico，这种现状仍很黏，因为 80% 的交易仍基于现金，30%
              的人口表示担心数字安全。在
              Colombia，问题与其说是缺少正式企业注册，不如说是产品深度不足：许多企业有存款关系，但实际使用信贷的少得多。在美国，比较证据显示数字贷款机构提升了便利性，但定价意外和借款人不满依然存在。合在一起看，Kapital
              的竞争对象不太是某一家 neobank，而更像碎片化的既有关系加现金密集工作流。
