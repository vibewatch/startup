      - number: '7.2'
        title: 信贷、资金和宏观风险偏高，尽管当前偿付信号看起来扎实
        blocks:
          - type: paragraph
            body: >-
              最重要的财务模型风险并不是 Kapital 能否报价信贷产品或展示资产负债表增长；它显然可以。1Q26 银行文件显示：资产 MXN 71.9 billion、存款 MXN 58.4 billion、净贷款 MXN
              25.8 billion、权益 MXN 5.7 billion、资本比率 13.52%、流动性覆盖系数 407、净资本 MXN 5.289 billion，以及表外信贷承诺 MXN 4.83
              billion。Excélsior 还强调不良贷款率 2.8%、资本化率约 13.9%。这些是有意义的缓释项，因为它们展示的是一张真实受监管资产负债表，而不只是只有故事的 fintech。


              剩余风险在于，增长和定价远比下行信贷质量更可见。Kapital 自有 SME 信贷文件显示报价 CAT 高、开户费、担保人结构、流动存款保证和罚息条款，这意味着回报高度依赖承销、催收和行为纪律。但公开材料仍不披露
              账龄批次曲线、欺诈损失拆分、重组、滚动率、回收或控股公司现金需求。因此 Crowdfund Insider
              提到信贷投资人仍关注预付率、契约和现金流压力情景，这一点很重要。宏观背景增加压力，而不是提供缓解：Banxico 表示，即便 2026 年 5 月将隔夜利率降至 6.50%，政策仍具限制性；IMF 则预计
              2026 年增长只有 1.5%，贸易不确定性仍压制活动。因此，投资人已有足够证据排除偿付恐慌，但还不足以承销下一轮信贷下行周期。关键私有证据缺口是按产品拆分的损失和资金桥，能把高增长放款连接到真实账龄、准备金和
              控股公司流动性。
