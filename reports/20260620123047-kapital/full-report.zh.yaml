  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从披露规模和盈利能力，到缺失估值机制，再到跟踪建议的推荐链条。
    data:
      nodes:
        - id: n1
          label: US$1.3B 轮次 + 新资本
        - id: n2
          label: 30 万客户 + US$3B 资产负债表口径
        - id: n3
          label: 1Q26 银行盈利、资本、流动性
        - id: n4
          label: 缺少 ARR / 收入桥
        - id: n5
          label: 缺少稀释 + 优先权堆栈
        - id: n6
          label: Intercam + 安全风险折价
        - id: n7
          label: 价格看起来合理，但不便宜
        - id: n8
          label: 推荐：TRACK
        - id: n9
          label: 升级触发器：更多披露或更好入场价
