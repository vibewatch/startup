      - number: '6.2'
        title: 采用轨迹真实存在，但公开口径混合了自然增长 SMB、收购来的银行客户和宽泛客户标签
        blocks:
          - type: paragraph
            body: >-
              公开采用证据足以证明客户规模有意义，但还不足以给出一个投资级活跃客户分母。TechCrunch 称 Kapital 2023 年在墨西哥、哥伦比亚和秘鲁拥有 80,000 名小企业客户，并另行收购了已有
              65,000 名客户的 Banco Autofin。Milenio 随后报道，到 2Q24 客户超过 100,000。到 2025 年独角兽轮时，PR Newswire 和 Pulse 2 都称 Kapital
              在美国、墨西哥和哥伦比亚已达到 300,000 名客户，Reuters 也独立确认其墨西哥和哥伦比亚运营版图。在哥伦比亚，Kapital 自有网站给出一个更窄但更运营化的指标：服务超过 1,300
              家哥伦比亚公司，放款超过 USD 86 million。


              这些披露很重要，但口径并不一一对应。有些专指 SMB
              客户，有些指全部客户，有些似乎包含收购来的银行关系，还有一些描述的是特定国家运营公司，而不是合并集团。因此，采用轨迹有助于证明增长和地域扩张，但对承销留存或活跃钱包份额质量帮助有限。官方产品页面也强化了这一解读。Cuenta
              PyME 承诺 48 小时内开户，Crédito PyME 要求一年经营历史，并定位于营运资金、供应商付款或扩张；Banca Empresarial
              围绕发薪、应付账款和财务规划等经常性工作流搭建。合在一起，这些页面暗示运营型企业确有真实生产使用。但它们没有说明 300,000
              名客户中有多少是活跃软件用户、活跃存款人、经常性借款人、收购来的存量账户或低频零售关系。
