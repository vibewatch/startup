      - number: '4.2'
        title: 成本结构、单位经济性与公开牵引
        blocks:
          - type: paragraph
            body: >-
              公开证据表明，Kapital 的经济性更多由银行和信贷基础设施塑造，而不是轻量 SaaS 栈。KPTL México Bank 备案显示，1Q26 利息收入 MXN 1,239 million，利息费用 MXN
              867 million，拨备费用 MXN 144 million，行政和推广费用 MXN 334 million。这个组合至少指向五个影响承保的成本桶：存款资金、信贷损失、运营开销、监管 / 合规基础设施，以及与
              FX 和证券相关的资金或做市活动。产品页面还增加了两项负担。第一，承保依赖 CIEC
              访问、税务数据、报表和担保人结构，意味着持续验证和服务成本。第二，企业平台包含卡、薪资、供应商付款、发票管理和预测，工作流更宽，客服和控制义务也更重。公开牵引是真实的：到 2025 年 9
              月，管理层和独立报道都引用约 300,000 名客户和 $3 billion 资产负债表；1Q26 银行备案则显示资产 MXN 71,946 million、存款 MXN 58,421 million、净贷款
              MXN 25,786 million。但可见牵引仍不等于公开单位经济性。留存来源没有披露 CAC、回本期、流失、软件毛利率、FX spread 捕获、扣除激励后的卡 interchange，或按贷款产品分
              cohort 的损失曲线。结果是规模信号很强，但承保分辨率仍然有限。
