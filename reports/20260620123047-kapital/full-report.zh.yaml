  - id: TI002
    title: 定价 / 变现表
    columns:
      - 产品 / 信号
      - 公开价格或单位
      - 来源类型
      - 解读
      - 仍未知的内容
    rows:
      - - Cuenta Empresarial
        - 无年费；无开户最低额；预期月均余额 MXN 5,000。
        - 官方 + 法律文件
        - 入门定价摩擦低，但经济性仍取决于余额和交叉销售。
        - 实际费用减免、交易收入和客户关系盈利能力仍未披露。
      - - Cuenta PyME
        - 开户金额 MXN 5,000；若平均余额低于 MXN 2,500，收取 MXN 170 + IVA。
        - 官方 + 法律文件
        - 相比许多金融科技同行，零售型 SMB 定价信号更明确。
        - 每账户净收入、减免频率和平均余额仍未披露。
      - - Banca Kapital 软件
        - MXN 1,199/月 + IVA。
        - 官方
        - 软件层标价清晰。
        - 付费客户数、折扣和软件毛利率未公开。
      - - Crédito PyME（中小企业信贷）
        - 3% 开户费；MXN 200,000、最长 36 个月示例 CAT 58.3%；示例披露保险费。
        - 官方 + 法律文件
        - 贷款经济性在公开信息中已有实质变现。
        - 按风险桶拆分的实际 APR、审批率和扣除损失后的收益率未知。
      - - Crédito FLEX（灵活信贷）
        - 年利率 30%；CAT 61.9%；示例披露放款手续费 / 提前还款罚金。
        - 官方
        - 供应商金融经济性看起来高收益，也高风险。
        - 平均提款规模、提款频率、违约率和净利差未公开。
      - - 保理
        - 披露保理 CAT 示例和放款手续费；营销承诺发票提前兑现。
        - 官方
        - 保理是明确变现轨道，不只是营销相邻能力。
        - 预付率、回款期限和核心债务人集中度未公开。
      - - FX 转账
        - 仅有示例市场汇率；没有公开客户价差表。
        - 官方
        - Kapital 证明了能力，但没有证明实际 FX 定价。
        - 价差、最低费用、通道经济性和现金管理对冲成本仍未披露。
      - - 银行卡 / 薪资
        - 未找到独立公开价格。
        - 官方
        - 最可能用于打包留存，或间接变现。
        - 交换费经济性、薪资费用和绑定率均未披露。
    notes: 公开标价在贷款和软件层最强。FX、银行卡和薪资的经济性仍只在功能层面可见。
    enumerationScope:
