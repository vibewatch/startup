      - number: '3.4'
        title: 护城河耐久度、多归属风险与负面证据
        blocks:
          - type: paragraph
            body: >
              这个格局里的负面证据，不是某个对手已经统治所有层，而是 Kapital 想拥有的每一层都在被不同竞争者强化。Konfío 明确试图从贷款走向存款和资金管理。Clip
              已把受监管资金流转、终端和商户现金流贷款耦合起来。Conekta 让本地线上支付经济性变得清晰，并主张自己在 Mexico 授权和拒付动态上优于全球处理商。Nu Mexico
              公开产品上仍只面向消费者，但其规模和银行转型投入显示，一个可信消费者品牌能多快积累分发力。既有银行继续用全牌照银行身份和公开费率表锚定买方信任，Adyen 则不断深入编排和 AI 驱动商业。


              这让 Kapital 拥有真实但脆弱的护城河。它最强的差异化是组合收敛：买方可以在一个界面看到信贷、公司卡、保理、账户、FX 和数字银行。问题是，公开证据还没有显示出强锁定，足以阻止商户把 Kapital 信贷与
              Clip 终端、Conekta 结账、BBVA 或 Santander 运营账户混用。换句话说，护城河来自执行，取决于 Kapital 能否把组合转化为主账户行为；它还不是结构性的，不是由监管牌照、独特支付
              rail 或不可替代分发渠道构成。投资者应只在 Kapital 能展示 attach、留存和主银行钱包份额时，才把竞争耐久度视为改善。
