      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              公开材料中最稳定互证的创始运营组合，是 CEO René Saúl 与 CFO Fernando Sandoval。TechCrunch 在 2023 年 Series A 和 Series B
              报道中都把二人列为联合创始人，2025 年 PRNewswire 和 Reuters/Yahoo 文章仍把他们作为主要高管声音引用。CNBC 的 Disruptor 50 档案把创始人范围扩大到 Eder
              Echeverria 和 Arjun Sethi，后续本地人物稿也以不同侧重点重复这些名字。尽调中的稳妥结论是：René Saúl 和 Fernando Sandoval
              是公开材料里不可替代的两名运营高管；Eder Echeverria 和 Arjun Sethi 出现在部分创始人 / 董事会列举中，但角色细节不够一致。


              领导层叙事高度创始人中心化。FinTech México Festival 的演讲者页面把 René Saúl
              描述为带领公司从金融科技转向商业银行、再转向金融集团的高管；公开融资和媒体报道也频繁引用他对产品、监管和扩张的说法。这种集中度带来明确的关键人依赖：CEO 掌控叙事、维护监管关系并执行并购。Sandoval
              则在资产负债表增长、盈利能力和 AI / 风险系统上担任公开对应人物。


              治理透明度明显弱于增长披露。Kapital 可访问的投资者关系页面有助于理解公司如何营销自身，也能判断应存在什么文件集；但该页面上最直接的治理文件是链接 PDF，本次运行期间受到 bot
              保护或无法访问。因此，本报告能验证治理和投资者关系界面存在，却不能验证完整公开董事会名单、委员会结构或所有权地图。这是明确的尽调缺口，不应被解读为缺乏监督。
