      - number: '5.4'
        title: 差异化、信任栈与产品风险
        blocks:
          - type: paragraph
            body: >
              Kapital 最清晰的产品差异化并不是公开开发者护城河，而是在持牌银行和集团金融结构之上做套件融合。官方页面、成本表、测评报道和评级报告共同显示：同一家机构试图拿下 SME 运营账户、财务看板、公司卡控制、FX
              转账和信贷栈。这比单纯 neobank 或点状贷款切入更强，因为同一个界面可以承接存款、触发发薪、支付供应商、对账发票并为资金缺口融资。公开 AI
              叙事让这一论点更锋利，但幅度有限：商业平台页面谈到实时财务数据、趋势识别和预测，但本轮未能检查独立 Kapital IA 页面，因此 AI
              层应视为工作流增强，而不是已验证的自有模型栈。信任证据则混合。官方页面反复引用 CNBV 监管、CONDUSEF 升级和适用产品的 IPAB
              保护，评级机构也肯定整合、资本化和风险管理。但负面证据很重要：Cybernews 报道了 2024 年一场与 Kapital
              相关的大规模选民身份证和自拍照泄露，并列出具体补救步骤，暗示此前在存储控制、日志记录和客户通知实践上存在弱点。因此，信任栈在监管和资产负债表层面是真实的，但隐私运营、韧性和软件控制成熟度尽调仍不完整。
