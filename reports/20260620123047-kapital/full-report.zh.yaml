        - Crédito PyME 页面和官方成本手册
        - SAT 数据访问、文件验证和风险运营
        - 公开来源没有披露自动决策率、模型变量或损失监控
      - - 集团整合和资金层
        - 把银行、券商、存款业务和收购来的运营平台串成一个金融集团栈
