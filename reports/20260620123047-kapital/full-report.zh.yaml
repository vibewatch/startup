      - 缓释 / 尽调问题
    rows:
      - - 横跨信贷、银行卡、保理和账户的一体化品牌栈
        - 买家仍可拆开使用：银行运营账户、Clip 终端、Conekta 收银台，都可以和 Kapital 信贷并行
        - 高
        - 索取主账户渗透率、产品绑定率，以及按绑定产品数量拆分的留存
      - - 信贷驱动的承保能力和营运资金相关性
        - Konfío 的 MXN5M 无抵押信贷加银行牌照路径，会迅速缩小战略差距
        - 高
        - 按票据金额、期限和账户所有权目标，验证相对 Konfío 的赢单 / 输单数据
      - - 商户运营工作流适配
        - Clip 已把当天商户资金流转、终端和贷款组合给更小卖家
        - 中-高
        - 衡量商户已用 Clip 做结算时，Kapital 在哪里赢、哪里输
      - - 墨西哥支付编排
        - Conekta 明确披露本地支付方式定价和性能主张，可能拉走以收银台为核心的买家
        - 中-高
        - 测试 Kapital 能否在不依赖外部 PSP 的情况下，匹配 SPEI / 现金 / 收银台经济性
      - - 信任和监管信心
        - 完整银行传统玩家和即将成为银行的挑战者，可把 Kapital 定位成次级供应商
        - 高
        - 验证客户愿不愿意把主余额放在 Kapital，而不是传统银行
      - - 未来产品范围护城河
        - Adyen、Mercury、Brex 和 Lili 说明，金融软件能很快围绕核心账户叠加银行卡、现金管理和 AP
        - 中
        - 跟踪现金管理、AP 控制和自助入驻的路线图速度，相对基准业务栈深度如何
      - - 入驻后的客户惯性
        - 公开证据尚未证明采用后低流失或低多栖
        - 中-高
        - 索取总收入留存、净收入留存、流失原因，以及 6/12/24 个月后的钱包份额变化
    enumerationScope:
