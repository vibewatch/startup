      - number: '8.4'
        title: 退出准备度、论点破裂触发器与最终尽调问题
        blocks:
          - type: paragraph
            body: >
              退出准备度在改善，但还没有达到投资委员会可直接通过的清洁程度。独角兽轮、受监管银行披露层和更广金融集团野心结合在一起，意味着内部预期正从私人增长融资转向公开市场资格。问题在于 2026
              年市场环境挑剔，而不是宽容。

              Eqvista 的后期市场笔记明确认为，IPO 窗口奖励准备度，惩罚过期私人估值，并迫使缺乏治理和披露准备度的公司走向双轨或桥接融资。Kapital 可能比许多 fintech 更能讲出 IPO
              故事，因为它有受监管银行文件和可见盈利；但公开记录在合并经济性和股东结构上仍显得太薄。


              论点破裂触发器可以衡量。低于 US$1.3 billion 标记的降价轮或结构化桥接会说明上一轮价格守不住。Intercam
              整合或合规滑坡证据会削弱其成为更广金融集团的溢价案例。银行资本、流动性或资产质量恶化会很重要，因为这家银行是支撑今天估值的主要公开锚。任何新的安全事件都会直接削弱 Kapital 应获得 AI
              或基础设施驱动估值溢价的说法。


              最终尽调应少看又一份营销材料，多看缺失的承销机制。最高优先级问题是合并收入和 ARR、完全稀释股权结构表、Series C
              优先权和清算瀑布、收购潮后的批次级信贷与存款质量，以及能明确证明盈利的受监管银行层确实能转化为控股公司 现金生成的证据。这些项目才能把一个看似合理的价格转化为有吸引力的入场。
