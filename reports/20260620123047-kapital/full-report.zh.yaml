        - 提供内部压力测试、管理层缓冲目标，以及补充资本触发线。
      - - 季度盈利支撑
        - KPTL México Bank 1Q26 净利润 MXN 533m。
        - 中
        - 正向盈利支撑实体层面的资本形成。
        - 提供合并盈利桥，说明集团盈利中有多少来自该银行实体。
