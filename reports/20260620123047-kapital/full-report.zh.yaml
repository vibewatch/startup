        - 混合了中小企业和经营场所两个概念，因此只是宽口径 TAM 视角，而非精确 SAM。
      - - 企业数量
        - 哥伦比亚
        - 2024 年 1.739m 家活跃公司
        - 正规公司密度足够支撑一个规模化第二市场。
        - 活跃公司数量不能直接说明卡、信贷或软件准备度。
      - - 企业数量
        - 美国
        - 5.58m 家拥有 1-499 名员工的雇主企业；占雇主经营场所的 99.7%
        - 极大的对照和走廊市场。
        - 市场过宽且成熟，不宜当作 Kapital 已有证据支撑的核心 SAM。
      - - 融资缺口视角
        - EMDE / LAC 背景
        - 正规 MSME 缺口 US$5.7T；含非正规为 US$8T；LAC 金融供给在 2015-2019 年约每年收缩 4%
        - 证实替代型中小企业金融供给方的结构性逻辑。
        - 这是全球和区域背景，不是 Kapital 的国家级 TAM。
      - - 跨境支付视角
