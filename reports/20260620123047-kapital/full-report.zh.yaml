      - - 跨境资金管理邻近业务
        - FX 页面服务需要跨多币种转移供应商或收入资金流的企业
        - 增加粘性资金管理收入和价值更高的企业使用场景
        - 要求提供活跃 FX 客户、月度交易量，以及按走廊划分的续约或留存。
      - - 墨西哥以外的地域扩张
        - Kapital Colombia 声称已服务 1,300+ 家公司，并有本地客户具名证言
        - 显示打法可以跨国复制
        - 要求按国家提供活跃客户、CAC、损失和产品组合。
      - - 客户数量定义风险
        - 公开里程碑混合使用 SMB 客户、收购银行客户和宽泛客户标签
        - 如果投资人把所有计数都当作同一队列，可能高估可比有机增长
        - 要求按分层和收购来源，把 80k SMB 到 300k 客户做对账桥。
      - - 服务质量拖累
        - 应用商店评价和 Finantres 评论提示 UX 摩擦、token 问题和费用敏感性
        - 如果支持能力跟不上增长，可能削弱留存或交叉销售
        - 要求提供月度投诉趋势、应用崩溃率和工单解决结果。
      - - 客户集中度不透明
        - 1Q26 报告披露，两个客户或集团的风险敞口超过一级资本的 10%，并称银行希望多元化
        - 这表明集中度已经重要到需要管理，即便完整收入或存款集中度尚未披露
        - 要求提供收入、余额和损失口径下前 10 大客户、存款人和借款人集中度。
    notes: 主要客户风险不是缺少增长证明，而是公开披露没有说明增长是否足够多元、持久，并且能在已安装客户基础中持续提高变现。
