  - id: TE004
    title: 信任 / 质量 / 合规表
    columns:
      - 控制 / 信号
      - 当前公开状态
      - 范围
      - 重要性
      - 缺口或担忧
    rows:
      - - CNBV 监管的银行实体
        - 官方页面明确声称，第三方评论报道也有呼应
        - KPTL México Bank 和集团金融运营
        - 持牌银行身份是信任、产品许可和投诉处理的基础
        - 公开产品页面仍未用技术细节解释运营控制架构
      - - 适用产品的 IPAB 保护
        - 官方页面和第三方评论报道提到适用产品最高 400,000 UDIS 的保护
        - 覆盖银行余额的存款产品信任
        - 相比无牌 fintech 界面，这是重要差异点
        - 覆盖取决于产品和法律结构，不是生态里的每项服务都适用
      - - CONDUSEF 和澄清渠道
        - 官方页面发布投诉电话、邮箱、网点和监管升级路径
        - 客户支持和争议解决
        - 强于泛泛的仅聊天机器人支持说法
        - 没有公开 SLA、工单解决指标或支持满意度数据
      - - Token / softtoken 控制
        - Banca en línea 要求激活 token 或 softtoken，并记录恢复路径
        - 网银认证和付款控制
        - 说明敏感操作有明确控制设计
        - 公开 app 评论中出现 token 摩擦，且没有披露欺诈率指标
      - - 移动 app 数据安全披露
        - 应用商店页面按 app 披露更新节奏、收集 / 共享实践和加密姿态
        - 移动渠道隐私和安全透明度
        - 对软件运营成熟度是有用的外部信号
        - 不同 app 界面披露不一致，暗示渠道治理碎片化
      - - 安全负面事件历史
        - Cybernews 记录了 2024 年一个暴露 ID 和自拍照的 bucket，并建议补救动作
        - 身份验证数据和隐私运营
        - KYC 文件是 Kapital onboarding 和承保工作流的核心，因此影响重大
        - 本轮没有找到留存的公开事后复盘或补救披露
      - - 评级机构控制评论
        - Moody's 和 HR Ratings 对资本化、风险管理和整合持正面看法，但仍提到转型风险
        - 集团层面财务和运营控制
        - 独立外部视角确认受监管栈真实存在
        - 评级不能替代产品可靠性或隐私控制证据
    notes: 信任证据在监管和资产负债表层最强；软件运营质量证据明显更薄。
