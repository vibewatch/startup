  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 核心客户分层以 SMB 为先，同时外溢到企业、跨境和近消费场景
        blocks:
          - type: paragraph
            body: >-
              Kapital 的公开客户图谱很宽，但重心仍是中小企业，而不是一般零售银行。多处独立和官方信息都指向这一点。Mexico Business News 称 Kapital “自豪地只瞄准
              SMEs”，TechCrunch 在 2023 年则描述公司服务墨西哥、哥伦比亚和秘鲁的小企业。Sacra 进一步收窄产品市场契合画像，称约 10-100 名员工、收入 USD 2-10 million 的拉美
              SMB 是甜蜜点。官方产品页面随后展示 Kapital 如何实际切分这批客户：Cuenta PyME 服务小公司和 PFAE，Cuenta Empresarial 服务更大的法人运营主体，Banca
              Empresarial 把付款、供应商管理、分析和发薪包进一个运营层，FX 页面则面向向供应商付款或用多币种收款的企业。


              关键细节在于，Kapital 已不再只是狭义 SMB 银行。网上银行页面仍宣传同时服务公司和个人，银行报告明确把商业账簿分为 Empresarial 和
              PyME，同时也承载汽车、个人和工资贷款等消费组合；哥伦比亚网站还加入借记卡、发薪、保理和社区 /
              工作空间层。因此，客户分层最好按买方、用户和使用场景来看：业主经理和财务团队购买关系，运营人员使用资金管理和工作流工具，员工可能接触薪资或卡，一些被收购的零售或财富客户如今也贴近核心 SMB
              论点。尚未披露的是按细分、地域和变现层拆分的精确客户结构，因此分层图谱方向上很强，但数字仍不完整。
