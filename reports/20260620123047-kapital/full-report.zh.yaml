      - number: '6.3'
        title: 墨西哥和哥伦比亚都有具名客户证据，但多数证据经过公司筛选，缺少独立量化
        blocks:
          - type: paragraph
            body: >-
              Kapital 达到了基本的具名客户证明门槛。公司案例研究页面明确展示墨西哥的 Day Store、Commando 和 Makora；Kapital Colombia 则发布了 Todos Comemos 和
              Yoyoso 的引述。重要的是，证明质量并不一致。Commando 是最强的墨西哥参考客户，因为独立案例页包含具体运营细节——超过 16 间 studio、超过 600 名员工和教练、扩张到西班牙，以及 CEO
              直接评价 Kapital 在需要时响应迅速。Day Store 和 Makora 较弱，但仍有用，因为成功故事分类页把它们与 Kapital 绑定，而它们自己的官网证明其是真实运营业务，不只是 logo
              墙。DayStore 网站称拥有 100 多个仓库、1,200 多名客户和 24/7 运营；Makora 网站称服务超过 78,000 户家庭。


              Kapital Colombia 补充了更新、更明确的客户证言。其首页点名 Todos Comemos 和 Yoyoso，分别署名 CEO 引述，并把 Kapital
              定位为战略盟友，而不是商品化银行供应商。客户自有网站也佐证两者都是真实运营企业，并有可识别的商业足迹。这足以支持生产成熟度判断：Kapital 正在服务物流、家具 /
              DTC、健身、食品分销和消费零售领域的真实企业。但这些证据仍低于机构级客户尽调要求。公开记录没有披露合同规模、按客户拆分的产品组合、实施周期、续约历史，或存款增长、贷款使用率、软件席位扩张等可衡量结果。因此，具名客户证明存在，但大多由公司筛选，且缺少结果指标。
