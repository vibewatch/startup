  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品套件与用户工作流
        blocks:
          - type: paragraph
            body: >
              Kapital 的企业产品最好理解为面向 Mexico SME 的打包财务工作流，而不是独立银行账户或贷款。官方企业导航和留存产品页面显示，这是一套从受监管运营账户开始的栈，随后延伸到企业银行软件、网上银行、FX
              转账、SME 信贷、供应商融资和发票支持融资。Cuenta PyME 和 Cuenta Empresarial 是入口
              rails：两个页面都强调开户、实时余额、SPEI、批量付款和薪资发放；企业平台页面则在同一界面增加供应商发票管理、预测、发卡和信贷访问。这意味着实际用户旅程是：开立或迁移运营账户，激活数字渠道，运行应付账款和薪资，为支出控制创建卡，然后在营运资本需求出现时提取信贷或保理。

              公开移动端证据强化了这个判断。Kapital 的 Android 和 iPhone listing 展示了余额、转账、投资、卡管理和基于 token 的安全等活跃移动界面；Google Play
              开发者档案还暴露了 Token Kapital 和 Kapital FX 作为独立 app 足迹。因此，工作流很宽且有一定黏性，但它并非纯自助：开户门槛、文件密集型承保、token
              激活，以及部分与网点相关的网上银行设置步骤，仍让产品更像包着金融科技 UX 的受监管银行基础设施，而不是完全软件化的平台。
