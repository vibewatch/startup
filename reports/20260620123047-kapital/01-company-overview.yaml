  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: total-raised-gap
      missingEvidence: "A reconciled financing schedule showing exact seed, Series A, Series B, Series C, and debt amounts drawn versus merely committed."
      whyItMatters: "Valuation and dilution analysis for later chapters depends on whether public totals mix equity, debt facilities, and undrawn commitments."
      diligencePath: "Request management's financing history table and debt facility summaries, then reconcile against signed term sheets and board approvals."
      relatedQuestionRefs: [QO014]
    - type: private-evidence-only
      severity: material
      topic: governance-gap
      missingEvidence: "Current board roster, committee structure, investor-director seats, and governance rights for major investors."
      whyItMatters: "Without governance details, the report cannot fully assess control, oversight quality, or key-person risk mitigation."
      diligencePath: "Request board minutes, governance PDFs, shareholder agreements, and any internal org chart showing committee membership."
      relatedQuestionRefs: [QO009]
      relatedTableRefs: [TO002]
    - type: enumeration-incomplete
      severity: material
      topic: stakeholder or investor map remains partial because no public cap table or debt schedule is accessible
      missingEvidence: "A full investor list, ownership percentages, board rights, and debt provider terms behind Kapital's capital structure."
      whyItMatters: "The stakeholder map can name visible investors and counterparties, but not who actually controls economics, vetoes, or refinancing risk."
      diligencePath: "Request the cap table, debt agreements, and latest shareholder-rights summary from management, then expand TO003 from public map to controlled ownership view."
      relatedQuestionRefs: [QO013, QO014]
      relatedTableRefs: [TO003]
    - type: private-evidence-only
      severity: material
      topic: headcount-gap
      missingEvidence: "A verified 2026 employee count with geography and function split."
      whyItMatters: "Headcount is a standard scale indicator and helps test whether recent asset and customer growth was driven by operating leverage or hiring intensity."
      diligencePath: "Request HR headcount by month for 2024-2026 and compare with payroll expense and branch integration plans."
      relatedQuestionRefs: [QO019]
      relatedTableRefs: [TO001]
    - type: access-blocked
      severity: minor
      topic: governance-documents
      missingEvidence: "Accessible underlying governance PDFs linked from Kapital's investor-relations surface."
      whyItMatters: "The page suggests board and corporate-act artifacts exist, but inaccessible documents limit independent verification of governance details."
      diligencePath: "Obtain the linked PDFs directly from management or test from a browser session with whitelisted access, then compare against the public page."
      relatedQuestionRefs: [QO009]
