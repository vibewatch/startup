companyProfile:
  summary: >-
    Harmonic is a Palo Alto-based AI research lab founded in 2023 by Tudor Achim and Vlad Tenev that is commercializing
    Aristotle, a Lean-backed mathematical reasoning system positioned around formal verification rather than generic
    chat. The company has achieved visible technical milestones and attracted major investor support, but it still looks
    like an early commercial platform: public pricing remains undisclosed, revenue and ARR are not public, and the
    operating footprint is still light on customer and governance disclosure.
  foundedDate: 2023-01-01T00:00:00.000Z
  founders:
    - name: Tudor Achim
      role: CEO & co-founder
      background: Former CTO of Helm.ai and the operating lead for Harmonic's research-to-product execution.
    - name: Vlad Tenev
      role: Co-founder & executive chairman
      background: Robinhood co-founder and CEO, providing external signaling and strategic credibility.
  foundingLocation: Palo Alto, CA
  headquarters: Palo Alto, CA
  productSummary: >-
    Aristotle is Harmonic's proof-backed reasoning product, available through an API beta and related workflows that
    formalize problems in Lean 4 and return machine-checkable proofs.
  customerFocus: Mathematicians, researchers, developers, and verification-oriented engineering teams
  businessModel: Free API beta today with an implied path toward enterprise licensing, paid usage, and higher-touch commercialization
  stage: Series C
  fundingStatus: Roughly $295M raised across three rounds, including a $120M Series C at a $1.45B valuation
  disclosureProfile: private-undisclosed
summary:
