  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合广泛，并非单一对手市场
        blocks:
          - type: paragraph
            body: >-
              Harmonic 面对的竞争格局异常宽，因为买方可以用多条路径完成同一任务：足以用自然语言推理的前沿模型、针对奥数式表现调优的专用数学系统，或由 Lean、Rocq、Isabelle
              专家执行的人工形式化方法工作流。因此 Harmonic 同时面对高分发量的既有巨头和内部自建这一现状方案。核心产品主张不是“最好的通用模型”，而是“将形式化验证接到推理上”；所以最相关的公开比较集中在
              OpenAI、Google/DeepMind 以及人工定理证明，而不是典型的垂直 SaaS 对手。这一定位降低了市场出现清晰赢家通吃的可能性，也提高了工作流适配度和信任成本的重要性。
