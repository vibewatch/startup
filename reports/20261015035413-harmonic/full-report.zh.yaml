  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场边界不是“所有 AI 推理”，甚至也不是所有开发者工具。证据始终将 Aristotle 定位在可由机器校验的证明、经验证代码及其他以证明为关键的任务上；在这些任务中，正确性比表达流畅更重要。因此
              Harmonic
              更接近形式化验证、定理证明、科学推理和安全敏感型工程，而不包括大多数开放式写作、通用编程副驾驶和通识聊天。现实替代方案包括人工形式化方法团队、没有代理层的传统定理证明工作流，以及更易采用但在证明支撑的正确性上明显较弱的通用
              LLM 副驾驶。估值时，邻近企业 AI 支出只能作为背景，除非它具有同样的证明与可审计性要求。
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM011
              - CM012
              - CM015
