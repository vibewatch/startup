      - number: '1.3'
        title: 里程碑、产品化信号与未解决的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开里程碑证据显示，Harmonic 以研究为先，并试图从技术可信度出发推进产品化。保留资料将 2025 年 7 月阶段与 Series B 融资及 Harmonic 达到 IMO
              金牌级别的数学成绩联系起来，随后记录了 2025 年 10 月 API 上线、2025 年 11 月独角兽融资、2026 年 1 月 Erdős 问题形式化文章，以及 2026 年 3 月带有
              ProofBench
              领先声明的自主代理发布叙事。这些里程碑足以证明产品和研究势头，却不足以完成公司概览层面的规模质量尽调。收入、ARR、员工人数、具名客户以及完整董事会或持股表仍不在本章保留的公开证据中；后续章节应将
              Harmonic 视为资金充裕、技术进展可见但商业化证明仍有限的研究阶段平台。
