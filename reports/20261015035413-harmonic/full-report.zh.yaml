      - number: '3.3'
        title: 买方可以多平台并用，切换成本看起来不高
        blocks:
          - type: paragraph
            body: >-
              保留证据中最重要的竞争信号不是锁定，而是互补。The Cognitive Revolution 文字稿明确描述用户将 GPT-5.2 Pro 与 Aristotle 搭配使用来完成形式化；Deep Noodle
              则强调一种 Erdős 问题工作流：OpenAI 生成非形式化论证，Harmonic 提供机器校验的证明。因此买方可以把通用推理留在上游，再把 Harmonic 作为下游验证层。因此 Harmonic
              的潜在护城河不是分发广度，而是它在经验证工作流中节省的时间和建立的信任。风险在于，大型实验室可能追平基准成绩，再把形式化或证明校验吸收进更完整的套件，尤其当买方已经在 ChatGPT 或 Google
              产品中开始工作时。
