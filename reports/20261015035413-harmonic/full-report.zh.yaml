  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 即使技术和融资证明很强，商业化和信息披露缺口仍限制推荐结论。
    data:
      nodes:
        - id: technical-proof
          label: 技术证明
          detail: 公开来源强调形式化验证、API 可用性和基准测试里程碑。
        - id: investor-validation
          label: 投资者验证
          detail: 私募估值从 A 轮上升到 C 轮，累计披露融资约 $295M。
        - id: productization-stage
          label: 产品化阶段
          detail: 来源仍描述免费 API 访问、研究用户或收入前商业化。
        - id: disclosure-gap
          label: 信息披露缺口
          detail: 指定资料池没有公开 EV/Rev、ARR、留存率和优先权结构数据。
        - id: entry-discipline
          label: 入场纪律
          detail: 只有在付费使用、定价和资本结构表得到证明后，才以最后一轮融资为基础评估。
        - id: recommendation
          label: 推荐
          detail: 继续研究；中等信心；高风险；估值偏高。
      edges:
        - from: technical-proof
          to: investor-validation
          label: 促成
        - from: investor-validation
          to: productization-stage
          label: 超越
        - from: productization-stage
          to: disclosure-gap
          label: 留下
        - from: disclosure-gap
          to: entry-discipline
          label: 驱动
        - from: entry-discipline
          to: recommendation
          label: 导致
    approximationNotes: 该流程总结定性的估值逻辑；不会根据缺失的收入数据推断数值公允价值。
