        title: 融资轨迹、治理信号与商业化阶段
        blocks:
          - type: paragraph
            body: >-
              即使运营指标缺失，Harmonic 的公开融资故事仍很清楚：保留资料支持 2024 年 9 月 $75M 的 Series A、2025 年 7 月近 $900M 投后估值的 $100M Series B，以及
              2025 年 11 月以 $1.45B 投后估值完成的 $120M Series C，累计融资约 $295M。Sequoia、Index Ventures、Kleiner Perkins、Ribbit
              Capital、Paradigm 以及后来的 Emerson Collective 对公司表现出异常强的支持，但这些融资尚未转化为公开收入证据。独立报道仍将公司描述为未产生收入或正在建设产品，除免费
              API／测试版访问外，价格也未披露。治理披露比融资叙事更薄弱：保留的 Series B 公告提到董事会和观察员关系，却没有完整董事名单、持股结构，或针对 Tenev 同时担任 Robinhood
              职务的明确时间分配约束。
