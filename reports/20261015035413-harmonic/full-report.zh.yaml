        title: 能力差异真实存在，但产品包装仍处早期
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Harmonic 存在真实的技术差异：Aristotle 输出基于 Lean、可机械校验的证明，而保留资料对 OpenAI 和 Google/DeepMind
              的描述，仍是更宽泛的推理系统，或缺乏同等端到端公开验证保证的数学系统。对于重视量化或代码相关工作流正确性的买方，这一优势最有价值。但商业化形态仍很早期。TechCrunch 报道了测试版消费者应用和计划中的企业
              API；GrowthEngineer 仍将 Harmonic 描述为未产生收入，只有免费 API 测试版，也没有公开企业价格。实际来看，Harmonic 易于试用，却还难以按成熟企业平台来评估。
