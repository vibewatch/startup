      - number: '7.3'
        title: 治理与融资依赖仍然明显
        blocks:
          - type: paragraph
            body: >-
              治理集中目前还不足以推翻投资逻辑，但已明显到需要纳入投资判断。AI Wiki 指出，Vlad Tenev 在担任 Harmonic 执行董事长的同时继续领导
              Robinhood，因此相当一部分品牌、融资渠道和战略背书集中在一位同时经营上市公司的创始人身上。与此同时，Tudor Achim
              仍是公司的技术与运营核心。实际形成的是两人集中风险：一位创始人支撑技术可信度和产品执行，另一位支撑外部可信度和资本渠道。


              因此，触发退出的标准很具体：如果 Harmonic
              到下一轮融资或战略里程碑时，仍未披露付费企业参考客户、定价纪律，或形式化验证工作流转化为生产价值的更清晰证据，估值就主要仍由研究期权支撑。如果算力需求继续快于商业化证明增长，即使融资
              $295M，融资依赖也会保持高位。缓解路径同样清晰：高风险工作流中的可引用部署、可复现的企业证明结果，以及有记录的客户或合规包装，都能显著降低当前剩余风险。
            claimRefs:
