            body: >-
              公开证据支持多种市场观察角度，但只有一种带有数字，而且范围也很宽。一篇 Idea Usher 文章称“AI Reasoning Models”市场当前为 $4.6B、到 2033 年达
              $22.8B；TechCompanyNews 则围绕 2030 年潜在 $50B 的 AI 验证类别展开评论。两者范围都过宽、来源都不够扎实，不能作为 Harmonic 的 SAM 或
              SOM。更稳妥的估算方式应从工作流出发：先看证明关键型工程和研究场景，再收窄到愿意采用 Lean 关联或形式化证明工作流的团队，最后收窄到愿意为经验证输出付费、而非只购买通用 AI
              辅助的组织。这一框架明确了用户群体——研究人员、数学家、开发者和验证工程师——但预算归属与变现证据仍不完整。
