companyProfile:
  summary: >-
    Harmonic 是一家位于 Palo Alto、由 Tudor Achim 和 Vlad Tenev 于 2023 年创办的 AI 研究实验室，正在将 Aristotle 商业化。Aristotle 是一套以 Lean
    为后端、主打形式化验证而非通用聊天的数学推理系统。公司已取得明显的技术里程碑，也获得主要投资者支持，但目前仍像一个商业化早期平台：公开价格尚未披露，收入和 ARR 未公开，客户与治理信息也十分有限。
  foundedDate: 2023-01-01T00:00:00.000Z
  founders:
    - name: Tudor Achim
      role: CEO 与联合创始人
      background: 曾任 Helm.ai CTO，负责推动 Harmonic 从研究走向产品。
    - name: Vlad Tenev
      role: 联合创始人兼执行董事长
      background: Robinhood 联合创始人兼 CEO，为公司带来外部背书和战略可信度。
  foundingLocation: Palo Alto, CA
  headquarters: Palo Alto, CA
  productSummary: Aristotle 是 Harmonic 以证明为支撑的推理产品，目前通过 API 测试版及相关工作流提供服务：它把问题形式化为 Lean 4 表达，并返回可由机器校验的证明。
  customerFocus: 数学家、研究人员、开发者和重视验证的工程团队
  businessModel: 当前提供免费 API 测试版，未来可能走向企业授权、付费调用和更深度的商业化服务
  stage: Series C
  fundingStatus: 三轮累计融资约 $295M，其中包括以 $1.45B 估值完成的 $120M Series C
  disclosureProfile: private-undisclosed
chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品定位与创始人匹配度
        blocks:
          - type: paragraph
            body: >-
              保留的公开资料一致将 Harmonic 描述为专注于 Mathematical Superintelligence 的 AI 研究实验室，旗舰系统 Aristotle 用于生成经 Lean
              校验的数学证明，而非自由形式的语言答案。这一产品定位很关键：公司的叙事围绕形式化验证、高风险软件场景和可数学检验的推理展开，而不是面向大众的通用助手或已经成熟的企业应用栈。             
              公开资料显示公司位于 Palo Alto、成立于 2023 年；一家仍未产生收入的公司随后密集融资，速度异常快。创始人与市场的匹配度也很清晰：Tudor Achim 是负责日常运营的 CEO，曾在 Helm.ai
              担任技术负责人；Vlad Tenev 则以 Robinhood CEO 和 Harmonic 执行董事长的双重身份，带来数学品牌和外部曝光。
