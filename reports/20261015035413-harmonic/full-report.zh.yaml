            body: >-
              指定资料中的公开融资路径很清晰，尽管运营模式并不清晰。Harmonic 披露的投后估值从 Series A 约 $325M，升至 Series B 约 $875M，再升至 Series C 的
              $1.45B；公开摘要还称三轮累计融资约
              $295M。如此快速的重定价，与投资者评估前沿研究进展和技术里程碑相符，而不是评估已披露的使用量、留存或现金流证明。对入场纪律的实际含义是：本轮价格有充分证据，但高于该价格的经济支撑尚不存在。[CV001][CV002][CV003][CV009]
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV008
              - CV010
              - CV014
      - number: '8.2'
        title: 投资逻辑的强项是技术证明，反方论点是变现证明
        blocks:
          - type: paragraph
            body: >-
              投资逻辑最强的输入是技术差异化和反复出现的投资者验证。公开来源将 Aristotle 描述为形式化证明系统，指出其提供公开
              API，并显示多家顶级基金在公司从研究走向商业化时提供融资。反方论点同样明显：第三方来源仍将 Harmonic 描述为未产生收入，或称其商业化路径仍待证明；其他来源讨论的是免费 API
              和路线图式变现，而不是公开企业转化指标。因此现有证据更能证明技术潜力，而非经济持久性。[CV004][CV005][CV006][CV007][CV008][CV013]
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: 情景纪律应锚定融资轮估值，而非无支撑的可比公司
        blocks:
          - type: paragraph
            body: >-
              由于指定资料未披露 EV/Rev、ARR 或公开留存指标，本章唯一站得住脚的公开估值锚点，是 Harmonic
              自身的私募融资估值以及投资者围绕这些估值表现出的热情。由此只能建立定性情景：只有出现付费企业采用，才考虑高于上一轮；若商业化仍早期，则以上一轮附近为基准情景；若产品化停滞或市场不再奖励研究优先的 AI
              故事，则考虑低于上一轮的悲观情景。搜索资料还出现了另一家名为 Harmonic Security
              的公司，提醒我们在把新闻片段当作可比公司或融资证据前，必须先核实发行主体。[CV009][CV010][CV011][CV012][CV013]
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV012
              - CV014
      - number: '8.4'
        title: 建议与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              本章建议是“继续研究”：信心中等、风险高，估值偏紧。价格信号真实存在，但公开证据仍未回答 Harmonic
              能否足够快地把形式数学领先转化为付费、可重复的企业需求，从而支持通过上一轮价格继续买入。在从跟踪进入投资判断前，应取得当前收入或付费使用证据、客户转化与续约数据、实际价格、任何 2026
              年融资更新，以及支撑披露估值的真实持股表和优先权文件。没有这些材料，下行情景仍是持平或下轮融资，而不是清晰的上调路径。[CV008][CV010][CV011][CV013][CV014]
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
