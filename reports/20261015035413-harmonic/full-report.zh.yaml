  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 商业证明仍落后于基准证明
        blocks:
          - type: paragraph
            body: >-
              最强的公开证据仍集中在 Harmonic 的研究演示，而不是可重复的商业证明。独立摘要将公司描述为未产生收入，拥有免费开发者
              API、没有公开价格，也没有公开宣布具名企业客户。这一点很重要，因为公司的估值已经按产品公司计算：Deep Noodle 明确称投资者定价的是研究轨迹，而不是使用量；TechCompanyNews
              表示，商业化要看 Harmonic 能否把 API 访问和潜在企业工具变成可规模化产品。结果是典型的前沿模型风险：基准成绩带来的势头可能比持续付费意愿的证明更快吸引资本。


              基准成绩本身令人印象深刻，但单独看还达不到采购级证明。AI Wiki 指出，Harmonic 广受关注的 IMO 成绩需要人工将题目翻译成形式化陈述，运行了数天而非官方比赛时限，且未获 IMO
              正式认证。对投资者而言，这不否定底层技术进步，但限制了将其视为企业验证的程度。在 Harmonic 展示付费生产使用、参考客户或脱离宣传时刻的可重复工作流采用之前，默认应认为商业化风险仍是公司最高等级的风险暴露。
