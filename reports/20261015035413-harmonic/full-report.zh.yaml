    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - Aristotle 将技术领先转化为已披露的企业采用、付费使用和更清晰的商业化。
        - 下一轮融资由运营证明而非单独的研究证明支撑，因此相对上一轮的溢价变得站得住脚。
        - 管理层能够展示付费客户增长、定价以及持续带来客户的标杆账户。
        - 商业试点无法转化，或新一轮融资需要附带大量结构性条款。
      - - 基准情景
        - 研究团队保持稳定，但产品化和信息披露只会缓慢改善。
        - 在上一轮披露估值附近持有，比支付大幅溢价更站得住脚。
        - 技术势头延续，但公开指标仍不完整。
        - 在收入证明出现前，市场转而不再追捧前沿 AI 故事驱动的估值。
      - - 悲观情景
        - 商业化滞后，投资者不再以此前的加价水平奖励尚未产生收入的前沿 AI 故事。
        - 由于没有公开 EV/Rev 或留存率底线来支撑这一估值，平价或下调估值融资占据主导。
        - 没有重要的新客户披露，没有定价证明，也看不清干净的资本结构表。
        - 融资市场收紧，或技术进展没有转化为需求。
    notes: 情景逻辑是定性的，因为指定资料池没有披露收入、ARR 或上市公司可比数据。
