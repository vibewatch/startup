  evidenceGaps:
    - type: missing-source
      severity: material
      topic: comparable-set
      missingEvidence: Public-company, private-round, or M&A comparables tied to a disclosed revenue, usage, or contract milestone for Harmonic.
      whyItMatters: Without model-appropriate comparables, scenario ranges can anchor only to Harmonic's own round marks and not to an external market-clearing benchmark.
      diligencePath: Build a comp set from disclosed frontier-AI, developer-tooling, or verification-software transactions after obtaining better revenue and customer context.
      relatedQuestionRefs: [QV006]
    - type: private-evidence-only
      severity: material
      topic: cap-table-disclosure
      missingEvidence: Actual cap-table, liquidation-preference, participation, and board-rights documents for the latest financing.
      whyItMatters: Entry discipline depends on more than the headline valuation because structure can change realized outcomes materially.
      diligencePath: Request the latest financing documents, cap-table summary, and any secondary-sale terms directly from the company or lead investors.
      relatedQuestionRefs: [QV005]
    - type: private-evidence-only
      severity: material
      topic: monetization-gap
      missingEvidence: Current paid-customer count, pricing, usage conversion, renewal, and retention data for Aristotle.
      whyItMatters: The key question is whether Harmonic's research advantage is already converting into economic proof commensurate with the last round mark.
      diligencePath: Request a pipeline review, signed customer list, cohort data, and billing evidence for the latest quarter.
      relatedQuestionRefs: [QV003, QV004, QV007, QV008]
