schemaVersion: "report-v2"
artifact: company-overview
slug: harmonic
runDate: 2026-10-15
company:
  name: Harmonic
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Harmonic is a Palo Alto formal-reasoning AI lab founded in 2023 by Tudor Achim and
    Vlad Tenev, with Aristotle positioned as a Lean-based mathematical reasoning product
    rather than a scaled commercial software business. Retained public coverage shows
    rapid financing to a $1.45 billion Series C valuation and visible research milestones,
    but still leaves revenue, customer count, headcount, and full governance disclosure
    unresolved.
sections:
  - id: identity-and-product
    title: Identity, product framing, and founder fit
    body: >-
      Retained public profiles consistently describe Harmonic as an AI research lab focused
      on Mathematical Superintelligence, with Aristotle as the flagship system for producing
      Lean-checked mathematical proofs rather than free-form language answers. That product
      framing matters because the current company narrative is built around formal
      verification, high-stakes software use cases, and mathematically checkable reasoning,
      not around a broad consumer assistant or already-mature enterprise application stack.
      Public profiles place the company in Palo Alto and trace the founding to 2023, which
      makes the subsequent financing cadence unusually fast for a still pre-revenue company.
      Founder-market fit is legible at the top layer: Tudor Achim is the operating CEO with
      prior technical leadership at Helm.ai, while Vlad Tenev brings both mathematical
      branding and external visibility as Robinhood's CEO and Harmonic's executive chairman.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO012
    tableRefs:
      - TO002
  - id: financing-and-stakeholders
    title: Financing trajectory, governance signals, and commercialization stage
    body: >-
      Harmonic's public financing story is straightforward even if operating metrics are not:
      retained sources support a $75 million Series A in September 2024, a $100 million
      Series B in July 2025 at nearly $900 million post-money, and a $120 million Series C
      in November 2025 at a $1.45 billion post-money valuation, for roughly $295 million
      raised. That round sequence shows unusually strong investor sponsorship from Sequoia,
      Index Ventures, Kleiner Perkins, Ribbit Capital, Paradigm, and later Emerson
      Collective, but it does not yet translate into disclosed revenue evidence. Independent
      coverage still characterizes the company as pre-revenue or building product, while
      pricing remains undisclosed beyond free API / beta-access language. Governance
      disclosure is thinner than the funding narrative: the retained Series B announcement
      names board and observer relationships, but not a full board roster, ownership
      breakdown, or clear time-allocation guardrails for Tenev's concurrent Robinhood role.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO009
      - CO013
      - CO014
      - CO015
    tableRefs:
      - TO001
      - TO003
  - id: milestones-and-open-issues
    title: Milestones, productization signals, and unresolved diligence gaps
    body: >-
      Public milestone evidence supports a research-first company that is trying to
      productize from technical credibility outward. Retained sources tie the July 2025
      phase to the Series B round and Harmonic's IMO gold-medal-level mathematics result,
      then show October 2025 API availability, November 2025 unicorn financing, a January
      2026 Erdős-problem formalization writeup, and a March 2026 autonomous-agent launch
      narrative with ProofBench leadership claims. Those milestones are enough to establish
      product and research momentum, but not enough to close the company-overview diligence
      loop on scale quality. Revenue, ARR, headcount, named customers, and a complete board
      or cap-table view remain outside the public evidence retained for this chapter, so the
      next chapters should treat Harmonic as a well-financed research-stage platform with
      visible technical traction but still-limited commercialization proof.
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO015
    figureRefs:
      - FO001
