      - ["Sequoia Capital", "Series A lead; continuing investor", "Early institutional sponsor and named board presence via Andrew Reed.", "Named in Series A history and the Series B board-observer disclosure.", "Confirm current board rights, pro-rata position, and follow-on ownership."]
      - ["Kleiner Perkins", "Series B lead", "Led the $100M Series B and added observer representation.", "Business Wire names Ilya Fushman as a new observer.", "Confirm observer rights, reserves, and any structured terms."]
