figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: Harmonic's public timeline shows fast financing layered onto research and product-access milestones.
    data:
      items:
        - date: "2023"
          label: Founding
          detail: Harmonic was formed by Tudor Achim and Vlad Tenev to pursue Mathematical Superintelligence.
        - date: "2024-09"
          label: Series A
          detail: Retained sources describe a $75M Series A led by Sequoia, with Index Ventures participating.
        - date: "2024-09-23"
          label: Investor thesis published
          detail: Index Ventures published its MSI thesis on Harmonic and highlighted 90% MiniF2F performance.
        - date: "2025-07-10"
          label: Series B
          detail: Business Wire announced a $100M Series B at nearly $900M post-money led by Kleiner Perkins.
        - date: "2025-07-28"
          label: IMO milestone and app waitlist
          detail: Harmonic announced gold-medal-level IMO 2025 performance and opened the Aristotle iOS beta waitlist.
        - date: "2025-10"
          label: Public API availability
          detail: Deep Noodle says Aristotle became publicly available through an API in October 2025.
        - date: "2025-11"
          label: Series C / unicorn valuation
          detail: Retained November 2025 coverage says Harmonic raised $120M at a $1.45B valuation and $295M total funding.
        - date: "2026-01-12"
          label: Erdős-problem writeup
          detail: Deep Noodle cites a Jan. 12, 2026 writeup where Aristotle supplied the Lean formalization for an Erdős problem resolution.
        - date: "2026-03-18"
          label: Autonomous-agent launch narrative
          detail: AI Automation Global described the Aristotle Agent launch, #1 ProofBench ranking, and a 24-hour autonomous run loop.
    approximationNotes: >-
      Some retained sources provide only month-level timing for financing or API availability,
      so those milestones are rendered at the same month precision rather than inventing days.
