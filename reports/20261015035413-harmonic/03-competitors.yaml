    claimRefs: [CP002, CP005, CP006, CP007, CP009, CP010, CP011, CP013]
callouts:
  - calloutType: strength
    title: Verification-first wedge is credible
    body: >-
      Harmonic's cleanest competitive wedge is not "best model overall" but "best trust profile for
      formal math and code workflows," because retained sources repeatedly tie Aristotle to
      machine-checkable proofs and mission-critical verification use cases.
    claimRefs: [CP002, CP004, CP010]
  - calloutType: risk
    title: Multi-homing weakens exclusivity
    body: >-
      Public evidence already shows buyers can use broader models upstream and Aristotle
      downstream, which means larger labs can pressure Harmonic even without displacing its
      verification step outright.
    claimRefs: [CP006, CP009, CP011]
