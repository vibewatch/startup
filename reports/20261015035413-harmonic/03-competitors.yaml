company:
  name: Harmonic
chapter:
  number: 3
  title: Competitors
  summary: >-
    Harmonic is not competing against one like-for-like startup so much as against a stack of
    alternatives: frontier reasoning labs such as OpenAI and Google/DeepMind, specialized formal
    methods workflows, and internal expert teams. Its strongest wedge is verification-first trust
    in math and code workflows, but public evidence still shows a beta-stage distribution surface,
    no disclosed enterprise pricing, and buyer behavior that can multi-home Harmonic alongside
    broader-purpose models instead of replacing them.
sections:
  - id: landscape
    title: Competitive set is broad, not a single-peer market
    body: |-
      Harmonic's landscape is unusually broad because buyers can solve the same job through several
      routes: a frontier model that reasons well enough in natural language, a specialized math
      system tuned for olympiad-style performance, or a manual formal-methods workflow staffed by
      Lean, Rocq, or Isabelle experts. That means Harmonic is competing simultaneously with
      high-distribution incumbents and with status-quo internal build. The central product claim is
      not "best general model" but "formal verification attached to reasoning," which is why the
      most relevant public comparisons cluster around OpenAI, Google/DeepMind, and manual theorem
      proving rather than around typical vertical-SaaS peers. This framing matters because it lowers
      the odds of a clean winner-take-all market and raises the importance of workflow fit and trust
      cost.
    claimRefs: [CP001, CP002, CP005, CP013]
    tableRefs: [TP001]
  - id: capability-and-packaging
    title: Capability differentiation is real, but packaging remains early
    body: |-
      Public evidence supports a real technical distinction for Harmonic: Aristotle emits Lean-based
      proofs that are mechanically checked, while OpenAI and Google/DeepMind are still described in
      the retained sources either as broader reasoning systems or as math systems without the same
      end-to-end public verification guarantee. That edge is most relevant for buyers who care about
      correctness in quantitative or code-adjacent workflows. The commercial surface, however, looks
      early. TechCrunch described a beta consumer app and a planned enterprise API, while
      GrowthEngineer still characterized Harmonic as pre-revenue, with a free API beta and no public
      enterprise pricing. In practice, Harmonic looks easier to trial than to underwrite as a mature
      enterprise platform.
    claimRefs: [CP003, CP004, CP008, CP009, CP010]
    tableRefs: [TP002, TP003]
  - id: switching-and-moat
    title: Switching costs look modest because buyers can multi-home
    body: |-
      The most important competitive signal in the retained evidence is not lock-in but
      complementarity. The Cognitive Revolution transcript explicitly described users pairing
      GPT-5.2 Pro with Aristotle for formalization, and Deep Noodle highlighted an Erdős-problem
      workflow where OpenAI generated an informal argument and Harmonic provided the machine-checked
      proof. That pattern implies buyers can keep general-purpose reasoning upstream and use
      Harmonic as a verification layer downstream. Harmonic's moat candidate is therefore not
      distribution breadth but the time and trust it saves in verified workflows. The risk is that
      larger labs can match benchmark outcomes and then absorb formalization or proof-checking into
      broader suites, especially if buyers already start their workflow inside ChatGPT or Google
      surfaces.
    claimRefs: [CP006, CP007, CP009, CP010, CP011]
    figureRefs: [FP001]
  - id: verdict-and-gaps
    title: Durable advantage depends on proving paid workflow ownership
    body: |-
      The current chapter supports a cautious read on durability. Harmonic's proof-checking posture
      gives it a credible niche in safety-critical and mathematically rigorous workflows, and public
      fundraising clearly tracks research demonstrations rather than pure hype. But the same public
      record does not yet prove enterprise distribution power, pricing leverage, or hard customer
      lock-in. Without named paying customers, third-party software-verification benchmarks, or
      evidence that verified deployment is sticky once buyers adopt it, the company still looks more
      like a technically distinctive component in a wider reasoning stack than the settled control
      point of the category.
    claimRefs: [CP008, CP010, CP011, CP012]
