      - ["Benchmark credibility in retained sources", "Gold-level IMO and MiniF2F claims", "Gold-level IMO claim", "Gold-level IMO claim plus AlphaProof silver history", "No benchmark claims in retained sources"]
    notes: >-
      Cells marked partial or unknown reflect retained-source limits rather than a negative claim;
      the matrix compares disclosed public positioning, not private product capability.
    claimRefs: [CP002, CP003, CP005, CP007, CP010, CP013]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer
      - Public package
      - Public price or contract model
      - Included capabilities
      - Unknowns or implication
    rows:
      - [Harmonic Aristotle, "Free API beta; app waitlist/beta", "No public enterprise pricing disclosed", "Formal proof generation and verification in Lean-backed workflows", "Easy to trial, but willingness to pay is still unproven publicly"]
      - ["OpenAI o1", "Model access inside OpenAI ecosystem", "$15-60 per million tokens", "Broad advanced reasoning", "Retained sources do not show a formal-verification guarantee"]
      - ["Google/DeepMind AlphaProof / AlphaGeometry", "Specialized math systems and broader Google stack", "No stand-alone public price in retained sources", "Olympiad-style math systems and geometry specialization", "Commercial packaging is unclear from retained sources"]
      - ["Manual theorem-prover workflow", "Internal expert workflow", "Labor- and staffing-driven rather than publicly packaged", "Proof checking and formalization through human experts", "Higher switching cost for expertise, but slower and less productized"]
    notes: >-
      Public pricing data is sparse; only OpenAI's token pricing is numerically disclosed in the
      retained source set, so the table emphasizes packaging and what remains unknown.
    claimRefs: [CP003, CP008, CP009, CP013]
