      - ["Consumer / education math users", "User: public app user; payer: undisclosed", "Math-app usage and learning", "Consumer-facing app and iOS beta or waitlist references", "Top-of-funnel awareness and possible self-serve lead generation", "No download, activation, or retention metrics"]
    notes: >-
      Public evidence mixes live access surfaces with target-account messaging;
      null commercial detail means the assigned sources do not disclose payer,
      pricing, or cohort size.
    claimRefs: [CU001, CU002, CU003, CU005, CU009, CU010, CU012]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - ["Public developer access", "API publicly available", "2025-10 to 2026", "Deep Noodle; Entrepreneur Loop; NeuronFeed", "Medium", "There is real self-serve trial access rather than pure stealth R&D", "No active developers, organizations, or paid conversion data"]
      - ["Consumer access", "Consumer-facing math app and app-beta references", "2025-07 to 2026", "NeuronFeed; TechCompanyNews", "Medium", "Harmonic is widening awareness beyond a closed research audience", "No downloads, MAU, or conversion data"]
      - ["Commercialization narrative", "Funding tied to commercialization and putting capability into users' hands", "2025-07", "Business Wire", "High", "Management was already pitching user-facing deployment by Series B", "No disclosed revenue or customer-count baseline"]
      - ["Early-adopter cohort", "Mathematicians and quantitative researchers cited as API-beta users", "2026", "Growth Engineer", "Low", "Public evidence points first to expert users, not broad enterprise rollout", "No named institutions, seats, or spend"]
      - ["Usage metric", "1M+ academic API queries", "2025-11", "TechCompanyNews", "Low", "Could indicate meaningful research usage if accurate", "No company corroboration, user count, or billing context"]
    notes: >-
      This table separates observable availability from proven commercial scale;
      low-confidence rows are explicitly uncorroborated in the assigned source
      pool and should not be read as audited traction.
    claimRefs: [CU001, CU003, CU006, CU009, CU010, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / proof surface
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - ["Unnamed developers via public API", "Developer", "Integrate Aristotle into software workflows", "Publicly accessible trial surface, not disclosed enterprise production", "Shows the product can be tested externally today", "No named company, contract, or production KPI"]
      - ["Mathematicians and quantitative researchers using API beta", "Research / academic", "Proof exploration and quantitative reasoning", "Early-adopter beta", "Best available public evidence of active specialist usage", "No named institution, retention data, or paid status"]
      - ["Public math-app or mobile-beta users", "Consumer / education", "Math assistance and top-of-funnel discovery", "Public app plus beta/waitlist references", "Shows Harmonic is testing broader access surfaces", "No user counts, conversion, or outcome evidence"]
    notes: >-
      Harmonic does not disclose named enterprise references in the assigned
      pool; this enumeration therefore captures the public proof surfaces that
      exist instead of pretending logos or access alone prove production
      customers.
    enumerationScope:
      coverage: partial
      basis: >-
        Enumerates the public customer-proof surfaces visible in the assigned
        pool as of 2026-10-15; it is not a full customer roster because no named
        enterprise accounts are disclosed.
    claimRefs: [CU004, CU007, CU009, CU010, CU014]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Harmonic's public customer journey currently moves from benchmark-led
      awareness into self-serve trial, with the biggest evidence gap at renewal
      and enterprise expansion.
    data:
      nodes:
        - label: Benchmark-led awareness
          actor: Investors, researchers, and developers
          phase: Awareness
          channel: Press, benchmark, and fundraising coverage
          touchpoints:
            - IMO and formal-math benchmark visibility
            - Fundraising announcements amplify discovery
        - label: Self-serve trial
          actor: Developers and math users
          phase: Trial
          channel: Public API and public app access
          touchpoints:
            - Public API availability
            - Consumer-facing math app and app beta
        - label: Research workflow fit
          actor: Mathematicians and quantitative researchers
          phase: Early usage
          channel: API beta
          touchpoints:
            - Early adopters cited in independent review coverage
            - Proof exploration and specialized reasoning workflows
        - label: Developer validation
          actor: Software verification teams
          phase: Evaluation
          channel: Verified-code and software-correctness pitch
          touchpoints:
            - Software correctness adjacency
            - Mission-critical reliability message
        - label: Enterprise expansion thesis
          actor: Finance, aerospace, and other safety-critical teams
          phase: Expansion thesis
          channel: Potential enterprise tools
          touchpoints:
            - Target industries are named publicly
            - Potential enterprise tooling is described but not evidenced
        - label: Renewal and concentration proof gap
          actor: Investors and diligence teams
          phase: Unresolved durability
          channel: Private diligence needed
          touchpoints:
            - No public NRR, churn, or contract-length metrics
            - No named enterprise deployments or concentration disclosure
    claimRefs: [CU001, CU005, CU006, CU007, CU010, CU011, CU012, CU014]
