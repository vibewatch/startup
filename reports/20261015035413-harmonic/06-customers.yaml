schemaVersion: report-v2
artifact: customers
slug: harmonic
runDate: 2026-10-15
company:
  name: Harmonic
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence shows Harmonic has opened Aristotle through a developer API,
    a public math app, and app-beta surfaces, which supports early developer and
    researcher adoption rather than proven enterprise scale. Independent sources
    still describe the company as pre-revenue with no named enterprise
    customers, no public retention metrics, and fundraising milestones tied more
    to benchmarks and productization than to disclosed customer usage. The
    customer story is therefore strongest at awareness and trial, and weakest on
    production deployments, expansion, and durability.
sections:
  - id: observable-segments
    title: Observable customer segments are still narrow and use-case led
    body: >-
      The assigned public evidence points to a small set of observable Harmonic
      user groups: developers who can access a public API, mathematicians and
      quantitative researchers described as early adopters of that API, and
      software-verification teams or safety-critical enterprises that appear in
      Harmonic's target-account narrative rather than in disclosed customer
      lists. Multiple sources also point to a consumer-facing math app or mobile
      beta, which broadens awareness but does not by itself prove monetized or
      durable usage. In practice, the buyer/user/payer stack is still blurry in
      public materials because Harmonic speaks more often about whom Aristotle
      could help than about which customer cohorts already pay for it.
    claimRefs: [CU001, CU002, CU003, CU005, CU009, CU010]
    tableRefs: [TU001]
  - id: adoption-proof
    title: Public adoption proof is real at the access layer but thin at the deployment layer
    body: >-
      Harmonic has moved beyond pure research secrecy: several assigned sources
      agree that Aristotle is publicly reachable through a free API, and others
      add a public math app or iOS beta/waitlist as top-of-funnel surfaces.
      That matters because it means outsiders can at least try the product.
      Even so, the best public adoption evidence remains availability rather than
      verified production use. Independent coverage ties 2025 fundraising to
      benchmark wins, app/API launch, and commercialization messaging rather
      than to disclosed enterprise revenue or contract expansion. The result is
      a customer narrative with genuine trial evidence but limited public proof
      of repeatable paid deployment.
    claimRefs: [CU001, CU003, CU004, CU006, CU007, CU010, CU013, CU014]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration remain diligence gaps
    body: >-
      The central underwriting problem is not whether Harmonic has demand
      signals; it is whether those signals convert into sticky enterprise
      revenue. None of the assigned public sources disclose NRR, GRR, churn,
      renewal rates, contract length, or customer concentration, and none names
      a production enterprise account with a quoted business outcome. The
      company and its backers clearly describe an expansion thesis into finance,
      aerospace, software verification, and other safety-critical workflows, but
      the step from research/developer usage to scaled commercial deployment is
      not publicly evidenced here. Until Harmonic provides cohort, deployment,
      or named-reference proof, concentration and durability risk must be
      treated as unresolved rather than assumed away.
    claimRefs: [CU004, CU005, CU007, CU008, CU011, CU012, CU014]
callouts:
  - calloutType: strength
    title: Self-serve access exists today
    body: >-
      Harmonic is not purely pre-product: the assigned pool consistently shows a
      public API and app-level access surfaces, which creates a real top-of-
      funnel for developers and math users even though public monetization proof
      is still thin.
    claimRefs: [CU001, CU007, CU010]
  - calloutType: risk
    title: Public durability proof is missing
    body: >-
      No assigned public source discloses renewals, churn, contract length, or
      top-customer mix, so investors cannot underwrite retention or
      concentration from public evidence alone.
    claimRefs: [CU011, CU012, CU014]
