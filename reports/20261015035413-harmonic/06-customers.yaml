  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: named-customer-proof
      missingEvidence: Named enterprise customer references with deployment scope, contract status, and customer-quoted outcomes.
      whyItMatters: Without named production references, public proof of real enterprise adoption remains weak and investors cannot distinguish pilots from durable rollouts.
      diligencePath: Request three reference calls or redacted customer case studies that specify live use case, buyer, contract form, and measured outcome.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: NRR, GRR, churn, renewal rate, contract length, or cohort-retention disclosure.
      whyItMatters: Retention is the clearest public test of whether Harmonic's research-led adoption converts into durable customer value.
      diligencePath: Ask management for cohort tables by start year and segment, plus renewal and churn definitions consistent with SaaS reporting.
      relatedQuestionRefs: [QU004, QU005]
      relatedTableRefs: [TU002]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Top-customer share, partner-channel mix, and revenue concentration by account or segment.
      whyItMatters: A few lighthouse accounts or a single partner could overstate demand quality and understate downside concentration risk.
      diligencePath: Request the top-10 customer list with revenue share, deployment stage, renewal status, and any reseller or channel contribution.
      relatedQuestionRefs: [QU006]
      relatedTableRefs: [TU001]
    - type: enumeration-incomplete
      severity: minor
      topic: usage-metrics
      missingEvidence: API query volumes, app downloads, active-user counts, and self-serve-to-enterprise conversion rates from company systems of record.
      whyItMatters: Access surfaces alone do not show whether the funnel is compounding or merely generating curiosity traffic.
      diligencePath: Ask for monthly active users, API-call trends, conversion by cohort, and the definition behind any reported usage metric.
      relatedQuestionRefs: [QU002, QU007]
      relatedTableRefs: [TU002, TU003]
