schemaVersion: report-v2
artifact: product-tech
slug: harmonic
runDate: 2026-10-15
company:
  name: Harmonic
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Harmonic's product surface is a proof-backed reasoning system rather than a
    general assistant: Aristotle is positioned as a Lean 4-verified engine for
    mathematics, software, and hardware workflows where correctness matters
    more than breadth. The public product story is technically differentiated
    and increasingly productized through API, English-input, terminal, and
    repository workflows, but commercial maturity still looks beta-stage
    because public pricing, named enterprise deployments, and enterprise-grade
    trust documentation remain thin.
sections:
  - id: product-surface
    title: Product definition and workflow fit
    body: >-
      Harmonic sells a narrow but distinctive workflow: Aristotle is presented
      as a reasoning agent for software, hardware, and mathematics that backs
      outputs with machine-checked proofs instead of free-form prose. The
      customer-facing surfaces now span API beta access, English-input problem
      solving, and direct work inside Lean projects or code repositories, which
      makes the product legible both to researchers and to verification-minded
      engineering teams. Public external coverage still frames usage around
      mathematicians, researchers, developers, and other rigor-heavy users,
      which supports the thesis that Harmonic is commercializing a specialized
      correctness workflow rather than a broad horizontal copilot.
    claimRefs: [CE001, CE003, CE004, CE005, CE011]
    tableRefs: [TE001, TE002]
  - id: architecture-and-ops
    title: Architecture and operating model
    body: >-
      The core technical wedge is formal verification. Harmonic repeatedly says
      Aristotle uses Lean 4 so each answer is checked as code, while partner
      commentary adds that the system also leans on synthetic data rather than
      only internet-scale corpora. Public hiring gives the clearest operating
      model signal: Harmonic is building ETL and automated-evaluation pipelines
      around reinforcement-learning research, then wrapping that work with
      experiment tracking, CI/CD, telemetry, Kubernetes, Docker, and cloud
      infrastructure. That implies a hybrid stack where product behavior
      depends not just on theorem-prover correctness but also on ML research
      operations becoming repeatable enough for production use.
    claimRefs: [CE002, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-and-deployment
    title: Deployment maturity and productization
    body: >-
      Public maturity signals are real but still early. Harmonic's November
      2025 release says Aristotle was already in API beta and being used by
      mathematicians and researchers, while the product page says the system
      can formalize from English and contribute directly inside Lean projects.
      Deep Noodle independently describes October 2025 API availability and
      later English-input support, which is useful corroboration that the
      product surface moved beyond a pure benchmark demo. Even so, the most
      visible proof points remain benchmark and workflow claims, not production
      customer deployments or packaged enterprise documentation, so diligence
      still has to separate technical capability from repeatable enterprise
      delivery.
    claimRefs: [CE003, CE004, CE005, CE006, CE010, CE013, CE014]
  - id: controls-and-risks
    title: Trust controls and technical risks
    body: >-
      Harmonic's strongest publicly documented control is epistemic, not
      operational: the company and its partners keep emphasizing Lean-backed
      proof checking as the mechanism that reduces hallucinations in
      correctness-critical work. That supports a differentiated quality story
      for formalizable tasks, but it does not yet substitute for public
      enterprise-control evidence such as security documentation, privacy
      commitments, uptime history, or compliance attestations. External
      commercialization profiles still describe the business as beta-stage and
      pre-revenue, with capital continuing to fund compute, researchers, and
      broader applications. The core product risk is therefore not whether the
      proof kernel is novel, but whether Harmonic can turn research-grade
      infrastructure into an enterprise-ready platform with auditable controls
      and repeatable customer delivery.
    claimRefs: [CE002, CE010, CE011, CE012, CE013]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Public status / maturity
      - Differentiation proof
      - Diligence gap
    rows:
      - - Aristotle API beta
        - Developers, mathematicians, and researchers
        - Public beta by late 2025
        - Proof-backed reasoning exposed as an external interface
        - Need usage, rate limits, support coverage, and paid-plan timing
      - - English-to-proof interface
        - Researchers and engineers who start from natural language
        - Publicly disclosed in the Nov. 2025 update
        - Plain-English input tied to a Lean-backed workflow
        - Need task-level accuracy, fallback behavior, and error handling
      - - Lean / repository workflow
        - Lean users and software verification teams
        - Live on the current product page
        - Can work inside Lean projects or code repositories directly
        - Need permissions model, audit logging, and rollback controls
      - - Mobile / self-serve app beta
        - Prospective self-serve users
        - Beta / waitlist stage in external commercial coverage
        - Extends distribution beyond a pure API surface
        - Need launch status, retention, and overlap with enterprise roadmap
    notes: >-
      Mixes official product statements with external commercialization
      summaries; maturity labels distinguish live surface claims from beta or
      waitlist references.
    claimRefs: [CE003, CE004, CE005, CE010, CE014]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit claimed / implied
      - Current limitation
    rows:
      - - Formal mathematics research
        - Translate arguments into machine-checkable proofs
        - Aristotle formalizes and verifies proofs in Lean
        - Faster proof checking and exploration for researchers
        - No public proof yet of sustained paid adoption
      - - Software / hardware verification
        - Validate correctness where failure is expensive
        - Proof-backed reasoning plus Lean / repo workflow
        - Reduces dependence on unverified natural-language reasoning
        - No public customer case studies, certifications, or SLAs
      - - Developer experimentation
        - Embed formal reasoning into tools through an external interface
        - Free API beta for developers
        - Lets users test workflows before full commercialization
        - Pricing, quotas, and enterprise packaging are undisclosed
      - - Internal model development
        - Turn research ideas into repeatable evaluation and deployment loops
        - ETL, automated evaluation, telemetry, and CI/CD around RL research
        - Improves repeatability of training and deployment work
        - Public evidence does not show uptime history or support coverage
    notes: >-
      Benefits are framed from public product positioning and hiring signals,
      not from disclosed ROI metrics or independent enterprise case studies.
    claimRefs: [CE001, CE003, CE005, CE007, CE008, CE010, CE011, CE013]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Key public dependency
      - Reliability / control signal
      - Open risk
    rows:
      - - Problem ingestion and UX
        - Accept English or Lean-native tasks and route them into Aristotle
        - API beta, English-input interface, and terminal workflow
        - Users can start from natural language or existing Lean/code context
        - No published task taxonomy, latency, or failure-rate data
      - - Proof search and formalization
        - Generate formal steps and supporting lemmas
        - Reasoning model plus automated lemma generation
        - Formalization constrains output more than free-form prose
        - Benchmark wins do not by themselves prove workflow fit
      - - Verification kernel
        - Check whether every logical step compiles in Lean 4
        - Lean 4 proof assistant
        - Machine-checked proofs are the clearest public quality control
        - No public disclosure of security, privacy, or compliance controls
      - - Research ops and infrastructure
        - Train, evaluate, and deploy models at scale
        - Synthetic data, ETL/evaluation pipelines, Kubernetes, Docker, cloud
        - Hiring explicitly calls out telemetry and CI/CD for model health
        - No public evidence on multi-tenant isolation, SLOs, or support model
    notes: >-
      The first three columns summarize disclosed architecture; the risk column
      captures diligence asks created by missing public operating evidence.
    claimRefs: [CE002, CE004, CE007, CE008, CE009, CE012]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence shows a layered product stack from user surfaces through
      proof verification into research-ops infrastructure.
    data:
      layers:
        - label: User surfaces
          detail: Public entry points into Aristotle for external users
          items:
            - label: API beta
              note: Public external interface by late 2025
            - label: English problem input
              note: Added in the Nov. 2025 product update
            - label: Lean project / repository workflow
              note: Can work directly inside Lean projects or code repositories
        - label: Access packaging
          detail: Product packaging is still beta-stage rather than a mature enterprise SKU
          outputs:
            - label: Free developer access
            - label: Beta / waitlist distribution
        - label: Reasoning and formalization
          detail: Model layer that turns user prompts into formal proof work
          modules:
            - label: Proof search
            - label: Autoformalization
            - label: Automated lemma generation
        - label: Verification kernel
          detail: Correctness layer that checks whether the reasoning compiles
          modules:
            - label: Lean 4 proof assistant
            - label: Machine-checked proof validation
          outputs:
            - label: Verified result
              note: Core product promise is a checked answer, not just a fluent one
        - label: Integration targets
          detail: Publicly named workflows where the company expects proof-backed value
          outputs:
            - label: Software verification
            - label: Scientific discovery
            - label: Safety-critical quantitative workflows
        - label: Research ops backbone
          detail: Infrastructure that turns research ideas into repeatable model operations
          modules:
            - label: Synthetic data generation
            - label: ETL and automated evaluation
            - label: Kubernetes, Docker, and cloud deployment
          outputs:
            - label: Telemetry and training-health observability
    approximationNotes: >-
      The stack shows publicly disclosed layers and dependencies rather than an
      exhaustive system design or data-flow diagram.
    claimRefs: [CE002, CE004, CE005, CE007, CE008, CE009, CE012]
callouts:
  - calloutType: strength
    title: Formal verification is the product moat
    body: >-
      Harmonic is not presenting Aristotle as a generic chat interface. The
      moat is that reasoning is converted into Lean-checked code, which is a
      materially different trust story for software, hardware, and math use
      cases where a plausible answer is not good enough.
    claimRefs: [CE001, CE002, CE005]
  - calloutType: risk
    title: Commercial proof still trails technical proof
    body: >-
      Public evidence supports a capable beta product and a serious research
      infrastructure, but not yet a fully packaged enterprise platform. Missing
      pricing, named production customers, and enterprise trust artifacts are
      the biggest product-tech diligence gaps.
    claimRefs: [CE010, CE012, CE013]
