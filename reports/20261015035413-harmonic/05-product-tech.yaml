  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: commercialization
      missingEvidence: Public pricing, packaging, rate limits, and enterprise support terms for Aristotle.
      whyItMatters: Product maturity cannot be underwritten cleanly if the company has not disclosed how the current beta converts into a paid SKU.
      diligencePath: Request current pricing sheets, pilot-to-paid conversion data, API usage bands, and standard support terms.
      relatedQuestionRefs: [QE006, QE007]
      relatedTableRefs: [TE001, TE002]
    - type: missing-source
      severity: material
      topic: trust-controls
      missingEvidence: Public security, privacy, compliance, or uptime documentation tied to Aristotle deployments.
      whyItMatters: Formal proof checking addresses answer correctness, but enterprise adoption also depends on operational controls, auditability, and data handling assurances.
      diligencePath: Request trust-center materials, security architecture, privacy terms, incident history, certifications, and uptime/SLO documentation.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: missing-source
      severity: material
      topic: customer-proof
      missingEvidence: Named production deployments, support references, and independently documented customer outcomes.
      whyItMatters: Current evidence shows technical capability and beta availability, but not repeatable enterprise delivery under real production constraints.
      diligencePath: Request named customer references, deployment case studies, renewal or usage metrics, and post-deployment support artifacts.
      relatedQuestionRefs: [QE006, QE007]
      relatedTableRefs: [TE001, TE002]
