      - number: '3.3'
        title: Switching costs look modest because buyers can multi-home
        blocks:
          - type: paragraph
            body: |-
              The most important competitive signal in the retained evidence is not lock-in but
              complementarity. The Cognitive Revolution transcript explicitly described users pairing
              GPT-5.2 Pro with Aristotle for formalization, and Deep Noodle highlighted an Erdős-problem
              workflow where OpenAI generated an informal argument and Harmonic provided the machine-checked
              proof. That pattern implies buyers can keep general-purpose reasoning upstream and use
              Harmonic as a verification layer downstream. Harmonic's moat candidate is therefore not
              distribution breadth but the time and trust it saves in verified workflows. The risk is that
              larger labs can match benchmark outcomes and then absorb formalization or proof-checking into
              broader suites, especially if buyers already start their workflow inside ChatGPT or Google
              surfaces.
