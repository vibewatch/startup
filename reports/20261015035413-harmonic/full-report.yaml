        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The core technical wedge is formal verification. Harmonic repeatedly says Aristotle uses Lean 4 so each
              answer is checked as code, while partner commentary adds that the system also leans on synthetic data
              rather than only internet-scale corpora. Public hiring gives the clearest operating model signal: Harmonic
              is building ETL and automated-evaluation pipelines around reinforcement-learning research, then wrapping
              that work with experiment tracking, CI/CD, telemetry, Kubernetes, Docker, and cloud infrastructure. That
              implies a hybrid stack where product behavior depends not just on theorem-prover correctness but also on
              ML research operations becoming repeatable enough for production use.
