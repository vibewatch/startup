chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product framing, and founder fit
        blocks:
          - type: paragraph
            body: >-
              Retained public profiles consistently describe Harmonic as an AI research lab focused on Mathematical
              Superintelligence, with Aristotle as the flagship system for producing Lean-checked mathematical proofs
              rather than free-form language answers. That product framing matters because the current company narrative
              is built around formal verification, high-stakes software use cases, and mathematically checkable
              reasoning, not around a broad consumer assistant or already-mature enterprise application stack. Public
              profiles place the company in Palo Alto and trace the founding to 2023, which makes the subsequent
              financing cadence unusually fast for a still pre-revenue company. Founder-market fit is legible at the top
              layer: Tudor Achim is the operating CEO with prior technical leadership at Helm.ai, while Vlad Tenev
              brings both mathematical branding and external visibility as Robinhood's CEO and Harmonic's executive
              chairman.
