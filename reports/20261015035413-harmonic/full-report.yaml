      - number: '1.2'
        title: Financing trajectory, governance signals, and commercialization stage
        blocks:
          - type: paragraph
            body: >-
              Harmonic's public financing story is straightforward even if operating metrics are not: retained sources
              support a $75 million Series A in September 2024, a $100 million Series B in July 2025 at nearly $900
              million post-money, and a $120 million Series C in November 2025 at a $1.45 billion post-money valuation,
              for roughly $295 million raised. That round sequence shows unusually strong investor sponsorship from
              Sequoia, Index Ventures, Kleiner Perkins, Ribbit Capital, Paradigm, and later Emerson Collective, but it
              does not yet translate into disclosed revenue evidence. Independent coverage still characterizes the
              company as pre-revenue or building product, while pricing remains undisclosed beyond free API /
              beta-access language. Governance disclosure is thinner than the funding narrative: the retained Series B
              announcement names board and observer relationships, but not a full board roster, ownership breakdown, or
              clear time-allocation guardrails for Tenev's concurrent Robinhood role.
