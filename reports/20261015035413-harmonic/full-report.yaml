  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary is not "all AI reasoning" or even all developer tooling. The evidence
              consistently positions Aristotle around machine-checkable proofs, verified code, and other proof-critical
              tasks where correctness matters more than fluency. That pulls Harmonic toward formal verification, theorem
              proving, scientific reasoning, and safety-sensitive engineering, while excluding most open-ended writing,
              generic coding copilots, and general knowledge chat. The practical substitutes are human formal-methods
              teams, conventional theorem-proving workflows without an agentic layer, and broad LLM copilots that are
              easier to adopt but materially weaker on proof-backed correctness. For valuation purposes, adjacent
              enterprise-AI spend should be treated as context rather than available TAM unless it shares the same proof
              and auditability requirement.
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM011
              - CM012
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
