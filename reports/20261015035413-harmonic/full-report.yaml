      - number: '6.3'
        title: Durability, expansion, and concentration remain diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The central underwriting problem is not whether Harmonic has demand signals; it is whether those signals
              convert into sticky enterprise revenue. None of the assigned public sources disclose NRR, GRR, churn,
              renewal rates, contract length, or customer concentration, and none names a production enterprise account
              with a quoted business outcome. The company and its backers clearly describe an expansion thesis into
              finance, aerospace, software verification, and other safety-critical workflows, but the step from
              research/developer usage to scaled commercial deployment is not publicly evidenced here. Until Harmonic
              provides cohort, deployment, or named-reference proof, concentration and durability risk must be treated
              as unresolved rather than assumed away.
            claimRefs:
              - CU004
              - CU005
              - CU007
              - CU008
              - CU011
              - CU012
              - CU014
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Self-serve access exists today
            body: >-
              Harmonic is not purely pre-product: the assigned pool consistently shows a public API and app-level access
              surfaces, which creates a real top-of- funnel for developers and math users even though public
              monetization proof is still thin.
            calloutType: strength
            claimRefs:
              - CU001
              - CU007
              - CU010
          - type: callout
            title: Public durability proof is missing
            body: >-
              No assigned public source discloses renewals, churn, contract length, or top-customer mix, so investors
              cannot underwrite retention or concentration from public evidence alone.
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Commercial proof still trails benchmark proof
        blocks:
          - type: paragraph
            body: >-
              The strongest public evidence still centers on Harmonic's research demonstrations rather than on
              repeatable commercial proof. Independent summaries describe the company as pre-revenue, with a free
              developer API, no public pricing, and no named enterprise customers publicly announced. That matters
              because the company is already valued like a product company: Deep Noodle explicitly frames the financing
              story as investors pricing a research trajectory rather than usage, and TechCompanyNews says
              commercialization will be tested by whether Harmonic can turn API access and prospective enterprise tools
              into scalable products. The result is a familiar frontier-model risk profile: benchmark momentum can
              attract capital faster than it proves durable willingness to pay.


              The benchmark story itself is impressive but not procurement-grade on its own. AI Wiki notes that
              Harmonic's celebrated IMO result required manual translation into formal statements, ran for days rather
              than the official competition window, and was not officially certified by the IMO. For an investor, that
              does not negate the underlying technical advance, but it does limit how much the result should be treated
              as equivalent to enterprise validation. Until Harmonic can show paid production usage, reference
              customers, or repeatable workflow adoption outside publicity moments, the default assumption should be
              that commercialization risk remains the company's highest-ranked exposure.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR007
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR008
              - CR009
              - CR010
              - CR012
              - CR013
      - number: '7.2'
        title: High-stakes positioning raises the cost of any miss
        blocks:
          - type: paragraph
            body: >-
              Harmonic is deliberately aiming Aristotle at safety-sensitive categories such as finance, aerospace,
              engineering, and software verification. That aspiration is strategically attractive because formal
              verification offers a clearer value proposition than generic AI copilots. It also means that any failure
              in product scope, proof workflow, or customer implementation would have outsized regulatory, liability,
              and reputation consequences compared with a consumer novelty app. Business Wire and USTechTimes both
              stress commercialization into mission-critical or high-stakes environments, while AI Wiki makes clear that
              the no-hallucination guarantee is bounded to supported mathematical domains rather than arbitrary queries.


              The operational risk is that the public evidence still describes a narrow, specialized system whose edge
              depends on rigorous formalization. Growth Engineer and Idea Usher both place Lean 4 and formal
              verification at the center of the product architecture. That should create a defensible moat, but it also
              makes deployment, talent, and integration more specialized than for mainstream LLM products. In parallel,
              Entrepreneur Loop says scaling the system demands immense compute, and USTechTimes says new capital will
              be used to scale infrastructure and expand teams. In combination, Harmonic faces a double operational
              burden: it must keep frontier research performance improving while also building the enterprise
              reliability, legal packaging, and implementation muscle that regulated buyers expect.
            claimRefs:
              - CR003
              - CR004
              - CR008
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR007
              - CR008
              - CR012
      - number: '7.3'
        title: Governance and funding dependencies stay visible
        blocks:
          - type: paragraph
            body: >-
              Governance concentration is not a thesis breaker today, but it is visible enough to merit underwriting
              attention. AI Wiki notes that Vlad Tenev continues to run Robinhood while serving as Harmonic's executive
              chairman, which means a meaningful share of brand, financing access, and strategic signaling sits with a
              founder who also leads a public company. At the same time, Tudor Achim remains the technical and operating
              center of the company. In practice, that creates a two-person concentration risk: one founder anchors
              technical credibility and product execution, while the other anchors external credibility and capital
              access.


              The kill criteria are therefore concrete. If Harmonic reaches its next financing or strategic milestone
              without disclosing paid enterprise references, pricing discipline, or clearer proof that its
              formal-verification workflow translates into production value, the valuation will remain supported mostly
              by research optionality. If compute needs keep expanding faster than commercialization proof, financing
              dependence will stay high even after raising $295 million. The mitigation case is also clear:
              referenceable deployments in high-stakes workflows, reproducible enterprise proof outcomes, and documented
              customer or compliance packaging would all reduce the current residual risk profile materially.
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
      - number: '7.4'
        title: Mitigations are knowable, but not yet publicly proven
        blocks:
          - type: paragraph
            body: >-
              The good news for diligence is that Harmonic's major risks are measurable rather than philosophical.
              Investors do not need to guess what would de-risk the story: paid production references, pricing and
              contract structure, customer renewal or expansion evidence, enterprise security and legal documentation,
              and independent reproduction of benchmark-style proof workflows would all be legible improvements.
              Likewise, governance risk is monitorable through disclosed operating roles, hiring depth, and evidence
              that commercial execution does not depend on a single founder's external profile.


              The chapter therefore lands on a pragmatic view. Harmonic likely has a real technical moat in formal
              verification, and that moat is itself a mitigation against generic hallucination risk. But today's public
              evidence still leaves open whether that moat can be monetized quickly enough, packaged safely enough, and
              scaled cheaply enough to justify a unicorn valuation without another round of expectation-heavy capital.
              The company remains attractive to track, but not yet de-risked enough for the risk chapter to treat its
              research lead as equivalent to an enterprise-ready platform.
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Most important underwriting risk
            body: >-
              The critical open question is whether Harmonic can convert a research-led, pre-revenue proof engine into
              paid, referenceable enterprise deployments before its capital needs or valuation expectations reset
              investor leverage.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR010
          - type: callout
            title: Formal verification is real but bounded
            body: >-
              Harmonic likely has a genuine product advantage inside formal mathematical domains, yet the public record
              still distinguishes that bounded guarantee from a general-purpose claim of trustworthy AI across arbitrary
              enterprise workflows.
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR012
              - CR013
          - type: callout
            title: Monitorable kill criteria
            body: >-
              Treat the thesis as weakened if the next major financing or product milestone still lacks paid customer
              references, disclosed pricing structure, reproducible customer-like proof workflows, or clearer governance
              depth beyond the founder pair.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR009
              - CR010
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and what the round prices in
        blocks:
          - type: paragraph
            body: |-
              The public financing path in the assigned pool is clear even though the
              operating model is not. Harmonic's disclosed post-money marks moved from
              about $325 million in Series A to roughly $875 million in Series B and then
              to $1.45 billion in Series C, while public summaries also describe about
              $295 million of total capital raised across the three rounds. That pace of
              repricing is consistent with investors underwriting frontier research
              progress and technical milestones rather than already-disclosed usage,
              retention, or cash-flow proof. The practical implication for entry
              discipline is that the headline round price is well evidenced, but the
              economic support for paying above it is not. [CV001][CV002][CV003][CV009]
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV008
              - CV010
              - CV014
      - number: '8.2'
        title: Thesis strength is technical proof; anti-thesis is monetization proof
        blocks:
          - type: paragraph
            body: |-
              The strongest thesis inputs are technical differentiation and repeated
              investor validation. Public sources describe Aristotle as a formal-proof
              system, note public API availability, and show multiple top-tier funds
              financing the company as it moved from research mode toward
              commercialization. The anti-thesis is just as visible: third-party sources
              still describe Harmonic as pre-revenue or as a company whose
              commercialization path remains to be proven, while other sources discuss a
              free API and roadmap-style monetization rather than disclosed enterprise
              conversion metrics. That means the evidence base is better at proving
              technical promise than economic durability. [CV004][CV005][CV006][CV007][CV008][CV013]
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
      - number: '8.3'
        title: Scenario discipline should anchor on round marks, not unsupported comps
        blocks:
          - type: paragraph
            body: |-
              Because the assigned pool does not disclose EV/Rev, ARR, or a public
              retention metric, the only defensible public valuation anchors inside this
              chapter are Harmonic's own private round marks and the disclosed shape of
              investor enthusiasm around them. That supports qualitative scenario ranges:
              a premium-to-last-round case only if paid enterprise adoption emerges, a
              flat-to-last-round base case if commercialization remains early, and a
              below-last-round bear case if productization stalls or the market stops
              rewarding research-first AI stories. Even the search pool itself surfaced a
              different company called Harmonic Security, which is a reminder that issuer
              verification matters before counting press snippets as comps or financing
              evidence. [CV009][CV010][CV011][CV012][CV013]
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV012
              - CV014
      - number: '8.4'
        title: Recommendation and final diligence asks
        blocks:
          - type: paragraph
            body: |-
              The chapter-level call is research-more with medium confidence, high risk,
              and a stretched valuation stance. The price signal is real, but public
              evidence still leaves unanswered whether Harmonic can convert formal-math
              leadership into paid, repeatable enterprise demand quickly enough to justify
              paying through the last disclosed round. Before moving from tracking to
              underwriting, diligence should obtain current revenue or paid-usage
              evidence, customer conversion and renewal data, price realization, any 2026
              financing updates, and the actual cap-table and preference documents behind
              the disclosed valuations. Without that package, the downside case remains a
              flat or down-round outcome rather than a clear mark-up path. [CV008][CV010][CV011][CV013][CV014]
            claimRefs:
              - CV008
              - CV010
              - CV011
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current posture
            body: >-
              Do not underwrite above the last disclosed round on public evidence alone; wait for paid customer proof or
              materially better entry terms.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV008
              - CV010
