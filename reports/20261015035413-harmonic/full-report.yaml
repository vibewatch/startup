              - CV014
          - type: callout
            title: Highest-priority diligence asks
            body: >-
              Request current revenue or paid-usage data, customer conversion and renewal evidence, pricing, 2026
              financing updates, and the actual cap-table and preference documents.
            calloutType: risk
            claimRefs:
