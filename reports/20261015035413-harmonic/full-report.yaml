      - number: '2.2'
        title: Evidence-constrained sizing and buyer segmentation
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports several market lenses, but only one is numeric and even that one is broad. An
              Idea Usher article cites a general "AI Reasoning Models" market at $4.6 billion today and $22.8 billion by
              2033, while TechCompanyNews editorializes around a potential $50 billion AI-verification category by 2030;
              both are too broad and weakly sourced to function as Harmonic's SAM or SOM. The more defensible sizing
              approach is workflow-first: start with proof-critical engineering and research use cases, then narrow to
              teams willing to adopt Lean-linked or formal-proof workflows, then narrow again to organizations willing
              to pay for verified outputs rather than general AI assistance. That framework clarifies the user
              base—researchers, mathematicians, developers, and verification engineers—but leaves budget ownership and
              monetization evidence incomplete.
