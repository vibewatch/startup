company:
  name: Harmonic
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Harmonic's market is best defined as proof-critical reasoning software rather
    than broad enterprise AI: the retained evidence repeatedly narrows the wedge
    to formal verification, advanced mathematics, and other workflows where a
    wrong answer is costly. Public sources support category breadth and strong
    investor belief, but they do not yet support a defendable Harmonic-specific
    SAM/SOM or a paid-enterprise demand curve.
sections:
  - id: market-boundary
    title: Market boundary, adjacencies, and substitutes
    body: >-
      The relevant market boundary is not "all AI reasoning" or even all
      developer tooling. The evidence consistently positions Aristotle around
      machine-checkable proofs, verified code, and other proof-critical tasks
      where correctness matters more than fluency. That pulls Harmonic toward
      formal verification, theorem proving, scientific reasoning, and
      safety-sensitive engineering, while excluding most open-ended writing,
      generic coding copilots, and general knowledge chat. The practical
      substitutes are human formal-methods teams, conventional theorem-proving
      workflows without an agentic layer, and broad LLM copilots that are easier
      to adopt but materially weaker on proof-backed correctness. For valuation
      purposes, adjacent enterprise-AI spend should be treated as context rather
      than available TAM unless it shares the same proof and auditability
      requirement.
    claimRefs: [CM001, CM002, CM005, CM011, CM012, CM015]
    tableRefs: [TM001]
  - id: sizing-and-buyer-map
    title: Evidence-constrained sizing and buyer segmentation
    body: >-
      Public evidence supports several market lenses, but only one is numeric
      and even that one is broad. An Idea Usher article cites a general
      "AI Reasoning Models" market at $4.6 billion today and $22.8 billion by
      2033, while TechCompanyNews editorializes around a potential $50 billion
      AI-verification category by 2030; both are too broad and weakly sourced to
      function as Harmonic's SAM or SOM. The more defensible sizing approach is
      workflow-first: start with proof-critical engineering and research use
      cases, then narrow to teams willing to adopt Lean-linked or formal-proof
      workflows, then narrow again to organizations willing to pay for verified
      outputs rather than general AI assistance. That framework clarifies the
      user base—researchers, mathematicians, developers, and verification
      engineers—but leaves budget ownership and monetization evidence incomplete.
    claimRefs: [CM003, CM004, CM006, CM007, CM008, CM013, CM014]
    tableRefs: [TM002, TM003]
    figureRefs: [FM001]
  - id: adoption-drivers-and-constraints
    title: Adoption drivers, timing, and commercialization constraints
    body: >-
      Harmonic's strongest adoption driver is clear: sources repeatedly frame
      provable correctness and hallucination reduction as the reason to deploy
      Aristotle in finance, blockchain, aerospace, verified software, and other
      high-consequence domains. That matters because the buyer trigger here is
      failure cost—bugs, unsafe code paths, or wrong reasoning—not generic
      productivity. The same evidence also highlights why adoption may lag
      benchmarks. Harmonic is still described as pre-revenue, public materials
      emphasize a free API and app rather than contracted deployments, and the
      product is tied to formal-proof workflows that are narrower than
      natural-language copilots. The result is a compelling category thesis with
      strong technical pull but a still-unproven conversion from research demand
      to recurring enterprise budgets.
    claimRefs: [CM002, CM005, CM009, CM010, CM011, CM012, CM013, CM014]
tables:
  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Formal proof verification software
        - Proof assistants, formal-methods tooling, verified-code workflows
        - Generic coding copilots and broad dev productivity tools
        - CTO, platform engineering, verification lead
        - Core near-term wedge described across official and independent sources
      - - Mathematical and scientific reasoning
        - Theorem proving, research workflows, machine-checkable proof generation
        - General research assistants without formal verification
        - Research lab lead, PI, university or lab tooling budget
        - Current public user base is strongest here
      - - Financial and blockchain verification
        - Smart-contract verification, code integrity, quantitative logic checks
        - General trading assistants or consumer fintech AI
        - Security lead, engineering leader, CTO
        - Frequently cited high-trust deployment vertical
      - - Aerospace and safety-sensitive systems
        - Control-software verification, assurance tooling, proof-backed checks
        - Broad simulation or CAD spend without proof requirements
        - Chief engineer, safety or quality budget owner
        - High-value but likely slower-entering enterprise segment
    notes: Public evidence defines workflows and likely budget homes; it does not disclose actual segment spend or customer counts.
    claimRefs: [CM001, CM002, CM004, CM005, CM015]
