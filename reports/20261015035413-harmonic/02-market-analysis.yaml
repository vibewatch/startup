      Public evidence supports a qualitative narrowing from broad AI-reasoning
      categories to a much smaller proof-critical wedge, but not a numeric
      Harmonic-specific SAM or SOM.
    data:
      items:
        - label: Broad AI reasoning models
          value: $4.6B current / $22.8B by 2033
          note: Idea Usher category frame; not Harmonic-specific
          tone: neutral
          claimRefs: [CM006]
        - label: Verified AI / proof-critical infrastructure
          value: Potential $50B by 2030
          note: TechCompanyNews editorial projection rather than attributed benchmark research
          tone: warning
          claimRefs: [CM007]
        - label: Named enterprise workflows
          value: Finance, blockchain, aerospace, verified software
          note: Repeated end-markets, but no public spend split
          tone: positive
          claimRefs: [CM002]
        - label: Current user entry points
          value: Free API + consumer app
          note: Public access is broader than disclosed paying demand
          tone: neutral
          claimRefs: [CM003, CM010]
        - label: Likely paying buyers
          value: Engineering, security, and verification budgets
          note: Budget owners are inferred from mission-critical use cases
          tone: warning
          claimRefs: [CM004, CM005]
        - label: Harmonic-specific SAM / SOM
          value: Not publicly disclosed
          note: Missing deployment, pricing, and segment spend data block precise sizing
          tone: adverse
          claimRefs: [CM008, CM009, CM011, CM014]
    approximationNotes: >-
      The first two layers reproduce broad third-party category frames; the
      lower layers are qualitative because retained sources do not disclose
      public spend, deployment counts, or paid-conversion data for Harmonic's
      immediate wedge.
    claimRefs: [CM002, CM003, CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM011, CM014]
