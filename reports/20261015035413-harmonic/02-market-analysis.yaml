      - CAGR
      - Methodology
      - Confidence
      - Limitation
    rows:
      - - Idea Usher
        - "2025"
        - Global
        - $4.6B current market; $22.8B by 2033
        - 21.9%-23.4% cited in article
        - Broad "AI Reasoning Models" category framing
        - Low
        - Wider than Harmonic's formal-verification wedge and not tied to named buyer segments
      - - TechCompanyNews
        - "2025"
        - Global
        - Potential $50B AI-verification market by 2030
        - n/d
        - Editorial projection from verified-AI thesis
        - Low
        - Presented as article analysis rather than attributed benchmark research
      - - Harmonic / Business Wire + supporting press
        - "2025"
        - Global
        - n/d
        - n/d
        - Workflow-first narrowing from named verticals such as finance, blockchain, aerospace, and verified software
        - Medium
        - Supports boundary logic, but not a numeric SAM or SOM
    notes: n/d means the retained source does not disclose a value; numeric lenses above are broad category frames, not validated Harmonic-specific market sizes.
    claimRefs: [CM002, CM006, CM007, CM008, CM013, CM014]
  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Buyer
      - User
      - Payer
      - Workflow
      - Budget owner
      - Adoption trigger
    rows:
      - - Formal methods and research labs
        - Research or formalization lead
        - Mathematicians, researchers, Lean contributors
        - Lab, grant, or OSS sponsor
        - Prove theorems and contribute library-ready verified code
        - Research tooling budget
        - Need machine-checkable reasoning instead of plausible text
      - - Enterprise software verification
        - VP engineering or verification lead
        - Developers, verification engineers
        - CTO or platform engineering organization
        - Verify existing code or generate provably correct components
        - Engineering tools or reliability budget
        - Cost of defects or audit failure exceeds workflow friction
      - - Financial and blockchain infrastructure
        - Engineering or security lead
        - Smart-contract engineers, quant developers
        - CTO, CISO, or protocol foundation
        - Validate code integrity and logic in economically sensitive systems
        - Security or platform budget
        - High direct loss from logic errors
      - - Aerospace and other safety-critical systems
        - Chief engineer or safety lead
        - Systems and controls engineers
        - Engineering quality or safety program
        - Verify control logic and other no-margin-for-error software
        - Safety or certification tooling budget
        - Regulatory, reliability, or mission-failure risk
    notes: Buyer and payer roles are inferred from cited use cases because no retained source discloses signed customer logos, pricing, or procurement paths.
    claimRefs: [CM003, CM004, CM005, CM009, CM010, CM011]
