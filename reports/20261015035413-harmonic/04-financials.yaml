        - Pilot or annual contract
        - Roadmap only; no executed pilots publicly named
        - Low confidence
        - Named pilots, ACV ranges, and procurement timelines
      - - Government / public-sector work
        - Third-party roadmap cites government contracts as a possible channel
        - Project contract
        - Positioning only; no awards disclosed
        - Low confidence
        - RFP pipeline, awards, and compliance requirements
    notes: Public evidence distinguishes free beta access from possible future monetization; rows three and four are third-party commercialization hypotheses, not confirmed booked revenue.
    claimRefs:
      - CI005
      - CI006
      - CI009
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source basis
    rows:
      - - Aristotle public API beta
        - Free
        - Public list access only
        - Usage caps, support levels, and conversion rates unknown
        - Growth Engineer; Entrepreneur Loop
      - - Aristotle iOS beta waitlist
        - No public price
        - No public list price
        - Monetization timing and attach rate unknown
        - Growth Engineer
      - - Enterprise pricing
        - Undisclosed
        - No realized pricing publicly evidenced
        - Discount policy, annual minimums, and revenue recognition unknown
        - Growth Engineer
      - - Future enterprise monetization
        - Usage-based pricing / pilots / support / government contracts
        - Roadmap, not realized pricing
        - Contract structure and mix unproven
        - Idea Usher
    notes: This table separates public list pricing from speculative monetization routes; absence of disclosed paid pricing should not be treated as evidence of absent demand.
    claimRefs:
      - CI005
      - CI006
      - CI009
      - CI012
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue / ARR
        - Not publicly disclosed
        - Low
        - Blocks any multiple-based underwriting and conversion analysis
        - Monthly revenue bridge, ARR definition, and cohort history
      - - Gross margin
        - Not publicly disclosed
        - Low
        - Compute-heavy verification workloads may materially affect margin path
        - Gross margin by inference workload and customer type
      - - CAC / payback / sales cycle
        - Not publicly disclosed
        - Low
        - Needed to judge whether technical interest can scale efficiently
        - Funnel metrics, win rates, and payback by segment
      - - Cash / burn / runway
        - Not publicly disclosed
        - Low
        - Capital adequacy cannot be judged from funding raised alone
        - Cash balance, monthly burn, and runway under base / hiring cases
      - - Named enterprise customer proof
        - No named enterprise customers publicly announced
        - Medium
        - Demand quality is unclear without references or concentration data
        - Top customers, pilot outcomes, and referenceability
    notes: Null or undisclosed metrics are substantive diligence blockers rather than zeros; the public record is strongest on fundraising and weakest on operating economics.
    claimRefs:
      - CI007
      - CI008
      - CI012
      - CI013
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Public evidence shows a bridge from free beta access and proof-verified usage into future enterprise monetization, with compute and training costs likely consuming a significant share of the capital raised.
    data:
      nodes:
        - label: Free API beta
          detail: Public access exists, but pricing is free rather than monetized.
          claimRefs:
            - CI005
            - CI006
        - label: Early researcher / developer adoption
          detail: Public descriptions cite mathematicians and quantitative researchers rather than named enterprise accounts.
          claimRefs:
            - CI008
        - label: Verified proof / code output
          detail: The core value proposition is mechanically checked reasoning for high-stakes workloads.
          claimRefs:
            - CI004
            - CI011
        - label: Target enterprise deployments
          detail: Public use-case narratives emphasize finance, aerospace, blockchain, and other safety-critical settings.
          claimRefs:
            - CI004
            - CI011
        - label: Future paid contracts
          detail: Third-party commercialization paths point to usage pricing, pilots, subscriptions, and support rather than already disclosed paid contracts.
          claimRefs:
            - CI009
            - CI012
        - label: Training and inference compute spend
          detail: Scaling formal-verification models appears capital intensive.
          claimRefs:
            - CI014
      edges:
        - from: Free API beta
          to: Early researcher / developer adoption
          label: acquires users
          detail: Current public access prioritizes usage and trust-building over immediate monetization.
          claimRefs:
            - CI005
            - CI006
        - from: Early researcher / developer adoption
          to: Verified proof / code output
          label: validates workflow
          detail: Public users test difficult proof and verification use cases.
          claimRefs:
            - CI008
            - CI011
        - from: Verified proof / code output
          to: Target enterprise deployments
          label: supports high-stakes use cases
          detail: Company and third-party narratives emphasize safety-critical deployments.
          claimRefs:
            - CI004
            - CI011
        - from: Target enterprise deployments
          to: Future paid contracts
          label: monetization path
          detail: Public pricing is absent, so paid conversion remains a future step rather than a proven current state.
          claimRefs:
            - CI006
            - CI009
        - from: Future paid contracts
          to: Training and inference compute spend
          label: must cover
          detail: Commercial success must outrun compute and model-scaling demands.
          claimRefs:
            - CI014
    approximationNotes: Directional bridge only; public sources do not disclose conversion rates, realized prices, contract sizes, or gross margins.
    claimRefs:
      - CI005
      - CI006
      - CI009
      - CI014
