  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue-disclosure
      missingEvidence: Audited or board-reported revenue, ARR (if used), and customer conversion history from beta usage into paid contracts.
      whyItMatters: Without revenue disclosure, valuation framing and payback analysis cannot be anchored to realized demand.
      diligencePath: Request monthly revenue by product, ARR definitions, contract start dates, and cohort conversion from free API users to paid enterprise accounts.
      relatedQuestionRefs:
        - QI003
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: unit-economics-gap
      missingEvidence: Gross margin by workload, CAC, sales cycle, win rate, and realized ACV by segment.
      whyItMatters: The company may have strong technical demand, but the public record does not show whether that demand converts efficiently into durable enterprise economics.
      diligencePath: Request funnel metrics, sales-cycle distributions, pricing realization, support burden, and gross margin by research, developer, and enterprise customer cohorts.
      relatedQuestionRefs:
        - QI005
        - QI006
      relatedTableRefs:
        - TI003
    - type: private-evidence-only
      severity: material
      topic: liquidity-gap
      missingEvidence: Current cash balance, monthly net burn, hiring plan, and runway under base and accelerated compute-spend scenarios.
      whyItMatters: Funding raised is not the same as cash available, and compute-heavy model development can compress runway even after large venture rounds.
      diligencePath: Request treasury position, monthly burn bridge, committed infrastructure spend, and next-round trigger metrics from management.
      relatedQuestionRefs:
        - QI008
      relatedTableRefs:
        - TI003
    - type: access-blocked
      severity: minor
      topic: official-web-disclosures
