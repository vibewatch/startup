evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: public revenue / ARR disclosure
    missingEvidence: Audited revenue, ARR, bookings, or paid-pilot disclosures tied to a date range.
    whyItMatters: >-
      Financing milestones alone do not show whether Harmonic has converted research demand into durable commercial
      revenue.
    diligencePath: Request management revenue bridge, paid-customer count, and any enterprise pilot conversion metrics.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: public customer and headcount disclosure
    missingEvidence: Current headcount, current employee geography, and named or counted customers using Aristotle in production.
    whyItMatters: >-
      Without headcount and customer counts, the chapter cannot test hiring intensity, go-to-market traction, or capital
      efficiency.
    diligencePath: Request org-chart snapshots, payroll/headcount roll-forward, and a customer reference list or usage cohort.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: Leadership and founder table coverage
    missingEvidence: A full executive bench and role map below the two co-founders.
    whyItMatters: >-
      Public founder profiles do not reveal whether product, sales, finance, and research leadership are institutionally
      deep or founder-concentrated.
    diligencePath: Request a current leadership roster, reporting lines, and any post-Series C executive hires.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: Stakeholder or investor map coverage
    missingEvidence: Current board roster, cap table, observer rights, and major ownership percentages.
    whyItMatters: >-
      Funding rounds identify sponsors, but not how control, veto rights, and follow-on financing leverage are actually
      distributed.
    diligencePath: >-
      Request the board matrix, post-money ownership schedule, and all investor side-letter or governance-right
      summaries.
    relatedQuestionRefs:
      - QO006
      - QO010
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      Independent 2026 TAM, SAM, or SOM work that isolates formal-reasoning AI or proof-verification software rather
      than broad reasoning-model categories.
    whyItMatters: >-
      Without a defensible denominator, the market-size case behind valuation is still narrative-heavy and difficult to
      benchmark.
    diligencePath: >-
      Obtain third-party analyst or public-company segmentation that isolates formal verification or reasoning tools,
      then reconcile it to Harmonic's named workflows.
    relatedQuestionRefs:
      - QM002
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Named paid deployments, contract sizes, conversion data from the free API or app, or vertical-level pipeline
      metrics.
    whyItMatters: These data are required to turn a technical wedge into a credible SAM, SOM, and revenue-ramp story.
    diligencePath: Request customer references, pilot counts, ACV ranges, and monetization metrics by vertical from management.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: buyer-payer
    missingEvidence: >-
      Public pricing, procurement, or budget-owner evidence for aerospace, finance, or software-verification
      deployments.
    whyItMatters: The user base is visible, but the true buyer and willingness-to-pay remain inferred rather than verified.
    diligencePath: >-
      Validate procurement paths through customer interviews, RFPs, or public case studies that show who signs and funds
      a deployment.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: enterprise-adoption
    missingEvidence: Named paying customers, contract values, and cohort conversion from free API users into paid deployments.
    whyItMatters: >-
      Without real customer and pricing evidence, the chapter cannot verify switching costs, pricing power, or whether
      verified workflows are sticky.
    diligencePath: >-
      Request customer references, pilot-to-production conversion data, and pricing sheets segmented by developer,
      research, and enterprise accounts.
    relatedQuestionRefs:
      - QP007
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-breadth
    missingEvidence: >-
      Third-party head-to-head software-verification or enterprise-proof benchmarks that compare Harmonic against
      OpenAI, Google/DeepMind, and manual formal-methods workflows.
    whyItMatters: IMO headlines and company-selected examples do not prove who owns the buyer workflow that matters commercially.
    diligencePath: >-
      Ask for independent benchmark reports or customer case studies showing verified deployment outcomes, not only
      olympiad or research milestones.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: >-
      Audited or board-reported revenue, ARR (if used), and customer conversion history from beta usage into paid
      contracts.
    whyItMatters: Without revenue disclosure, valuation framing and payback analysis cannot be anchored to realized demand.
    diligencePath: >-
      Request monthly revenue by product, ARR definitions, contract start dates, and cohort conversion from free API
      users to paid enterprise accounts.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: Gross margin by workload, CAC, sales cycle, win rate, and realized ACV by segment.
    whyItMatters: >-
      The company may have strong technical demand, but the public record does not show whether that demand converts
      efficiently into durable enterprise economics.
    diligencePath: >-
      Request funnel metrics, sales-cycle distributions, pricing realization, support burden, and gross margin by
      research, developer, and enterprise customer cohorts.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity-gap
    missingEvidence: >-
      Current cash balance, monthly net burn, hiring plan, and runway under base and accelerated compute-spend
      scenarios.
    whyItMatters: >-
      Funding raised is not the same as cash available, and compute-heavy model development can compress runway even
      after large venture rounds.
    diligencePath: >-
      Request treasury position, monthly burn bridge, committed infrastructure spend, and next-round trigger metrics
      from management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: access-blocked
    severity: minor
    topic: official-web-disclosures
    missingEvidence: Quoteable current website text for official pricing and newsroom pages in the assigned prefetched text bundle.
    whyItMatters: >-
      The assigned official homepage and newsroom prefetched text rendered as loading placeholders, which limited direct
      quote extraction from current first-party web pages.
    diligencePath: >-
      Re-run first-party page capture with a render path that preserves readable text or request PDF / screenshot copies
      of current product and funding pages from management.
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: Public pricing, packaging, rate limits, and enterprise support terms for Aristotle.
    whyItMatters: >-
      Product maturity cannot be underwritten cleanly if the company has not disclosed how the current beta converts
      into a paid SKU.
    diligencePath: Request current pricing sheets, pilot-to-paid conversion data, API usage bands, and standard support terms.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE001
      - TE002
  - type: missing-source
    severity: material
    topic: trust-controls
    missingEvidence: Public security, privacy, compliance, or uptime documentation tied to Aristotle deployments.
    whyItMatters: >-
      Formal proof checking addresses answer correctness, but enterprise adoption also depends on operational controls,
      auditability, and data handling assurances.
    diligencePath: >-
      Request trust-center materials, security architecture, privacy terms, incident history, certifications, and
      uptime/SLO documentation.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named production deployments, support references, and independently documented customer outcomes.
    whyItMatters: >-
      Current evidence shows technical capability and beta availability, but not repeatable enterprise delivery under
      real production constraints.
    diligencePath: >-
      Request named customer references, deployment case studies, renewal or usage metrics, and post-deployment support
      artifacts.
    relatedQuestionRefs:
      - QE006
      - QE007
    relatedTableRefs:
      - TE001
      - TE002
  - type: private-evidence-only
    severity: material
    topic: named-customer-proof
    missingEvidence: Named enterprise customer references with deployment scope, contract status, and customer-quoted outcomes.
    whyItMatters: >-
      Without named production references, public proof of real enterprise adoption remains weak and investors cannot
      distinguish pilots from durable rollouts.
    diligencePath: >-
      Request three reference calls or redacted customer case studies that specify live use case, buyer, contract form,
      and measured outcome.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: retention
    missingEvidence: NRR, GRR, churn, renewal rate, contract length, or cohort-retention disclosure.
    whyItMatters: >-
      Retention is the clearest public test of whether Harmonic's research-led adoption converts into durable customer
      value.
    diligencePath: >-
      Ask management for cohort tables by start year and segment, plus renewal and churn definitions consistent with
      SaaS reporting.
    relatedQuestionRefs:
      - QU004
      - QU005
    relatedTableRefs:
      - TU002
  - type: missing-source
    severity: material
    topic: concentration
    missingEvidence: Top-customer share, partner-channel mix, and revenue concentration by account or segment.
    whyItMatters: >-
      A few lighthouse accounts or a single partner could overstate demand quality and understate downside concentration
      risk.
    diligencePath: >-
      Request the top-10 customer list with revenue share, deployment stage, renewal status, and any reseller or channel
      contribution.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU001
  - type: enumeration-incomplete
    severity: minor
    topic: usage-metrics
    missingEvidence: >-
      API query volumes, app downloads, active-user counts, and self-serve-to-enterprise conversion rates from company
      systems of record.
    whyItMatters: Access surfaces alone do not show whether the funnel is compounding or merely generating curiosity traffic.
    diligencePath: >-
      Ask for monthly active users, API-call trends, conversion by cohort, and the definition behind any reported usage
      metric.
    relatedQuestionRefs:
      - QU002
      - QU007
    relatedTableRefs:
      - TU002
      - TU003
  - type: missing-source
    severity: material
    topic: compliance-disclosure
