      - number: '2.4'
        title: 竞争格局与公开基准
        blocks:
          - type: paragraph
            body: >-
              BharatPe 面对的是分层竞争场，而不是一个整齐的单一品类。PhonePe 和 Paytm 通过 QR、消费者分发和网关产品压制商户获客。PayU 和 CCAvenue 仍是广泛的结账入口既有玩家。Pine
              Labs 在以设备或全渠道受理作为切入点的场景里仍然重要。商户开始出口或需要更复杂编排时，Adyen、Stripe 和 PayPal 抬高了企业级可靠性和全球触达的天花板。RBI
              授权数据让拥挤程度变得可见，因为多家在线聚合商和相邻玩家都在持牌框架下运营，而不是靠专有轨道。公开估值基准给出第二层启示。截至 2026 年 8 月，CompaniesMarketCap 显示
              Paytm、Fiserv、Adyen 和 PayPal 之间差距很大。这种分化意味着，投资者会尖锐地区分本土商户交易量叙事和更多元、盈利的处理商模型。因此，BharatPe 所在市场很大，但并不是原始 UPI
              普及率单独就能保证定价权或高估值的市场。
