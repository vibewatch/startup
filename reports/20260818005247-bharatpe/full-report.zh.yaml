      - number: '8.2'
        title: 可比公司与倍数压缩
        blocks:
          - type: paragraph
            body: >-
              可比公司集合很重要，因为 BharatPe 现在夹在两个完全不同的估值世界之间。上沿是 PhonePe，它展示了印度支付品类龙头能拿到什么定价：收入大得多、UPI 份额高得多，即使有 IPO
              时间风险，私募估值区间仍然健康。上市可比公司这一端，Paytm、Pine Labs 和 MobiKwik
              说明，披露加深、投资人从宽泛生态叙事转向耐久盈利能力后，印度金融科技倍数会很快被压缩。按增长和战略范围看，BharatPe
              比最弱的上市可比公司更好；但把隐含收入倍数算进去，它相对同一组公司并不便宜。这就是估值的核心矛盾：BharatPe
              理应比更小或更弱的同行有溢价，但当前价格已经要求投资人承销高于平均水平的执行，而不只是平均延续。实际含义是，倍数已经假设下一阶段证据会按时到来。
