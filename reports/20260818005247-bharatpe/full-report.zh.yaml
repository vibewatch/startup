              基础上，Paytm 的商户平台横跨线上线下扩张，Razorpay 展示出明显更宽的产品面，全球处理商则统治信任和跨境触达的高端。公开来源没有显示出某项 BharatPe
              能力，是同行不可能复制的；也没有显示已实现定价、商户流失或赢单 / 输单数据，足以证明隐藏锁定。BharatPe
              最强的竞争案例因此不是硬护城河，而是在特定客户切片里的强定位匹配：这类线下商户重视把收款、设备和合作伙伴金融放在一段以印度为中心的关系里。这种匹配仍可能有商业意义，但它只是细分优势，不足以证明今天存在不可撼动的品类领先；公开记录也还没有显示，当商户开始要求更宽的对账、经常性账单或跨境能力时，这种优势还能继续存在。
