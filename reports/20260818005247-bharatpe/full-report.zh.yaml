            title: 印度支付市场很大，但 BharatPe 的真正机会在商户工作流切口
            body: 最强的市场结论是，QR 牵引的数字化让商户获客既便宜又广泛，但现在创造价值要靠在这个基础上叠加设备、结算工具和信贷产品。因此，BharatPe 的产品方向与市场演进方式一致。
