  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类别
        blocks:
          - type: paragraph
            body: >-
              BharatPe 并不在一个干净的单一品类里竞争。它的真实重叠横跨商户 QR 收款、设备牵引的银行卡受理、合作伙伴连接信贷，以及简单的商户金融工作流。这意味着竞品集合包括 PhonePe、Paytm
              这类直接商户金融科技同行，Razorpay、PayU 这类更宽的印度支付栈，Pine Labs 这类设备和全渠道玩家，CCAvenue 这类老牌网关既有玩家，MobiKwik
              这类相邻钱包牵引玩家，以及当商户需要出口或企业功能时的 Adyen、Stripe、PayPal 等全球处理商。现状方案同样重要：许多印度小商户仍可用银行
              QR、单一设备伙伴或工具拼盘解决问题，而不必上一个平台。因此，BharatPe 的竞争问题不是某一个对手会不会在所有场景替代它；而是商户买方能否用分发更强或价格更好的替代方案，拼出同等能力。
