      - number: '1.3'
        title: 财务扭转与资本信号
        blocks:
          - type: paragraph
            body: >-
              公开层面对 BharatPe 财务的可见度仍主要来自媒体，而不是密集的监管文件，但方向比两年前清楚得多。三家媒体一致指向 FY24 经营收入 Rs 1,426 crore，较 Rs 1,029 crore 增长
              39%，同时称亏损大幅收窄。Business Standard 将 FY24 EBITDA 亏损定在 Rs 209 crore；该媒体和 The Economic Times 都强调 BharatPe 在
              2024 年 10 月转为 EBITDA 为正。随后的 FY25 图景更强。Entrackr、Business Standard 和 VCCircle 均报道 FY25 经营收入为 Rs 1,667
              crore，调整后税前利润为 Rs 6 crore，不含 ESOP 费用的 EBITDA 利润为 Rs 141 crore。资本市场证据更薄，但 2025 年老股交易是有用的估值锚。Finance
              Outlook、Entrackr 和 CIOL 都把这笔交易定在约 $2.85 billion，意味着即便经历治理动荡和较弱的私募市场背景，BharatPe 仍守住了独角兽地位。
