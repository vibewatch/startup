  - id: TV005
    title: 投资逻辑破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 新融资低于当前估值标记
        - 下调估值轮，或结构明显偏重的内部人轮
        - 削弱老股交易奠定持久公允价值的说法
        - 立场从观察转向放弃
      - - 亏损或烧钱再次恶化
        - FY26 或 FY27 经审计结果较 FY25 方向恶化
        - 打破转型改善测算，压缩估值走廊
        - 下调估值区间和信心
      - - 信贷或合作方集中度出现负面意外
        - 贷款批次偏弱、贷款方集中度高或合作方中断
        - 把商户变现优势变成脆弱点
        - 提高折现率，并要求新的基准情景
      - - 客户摩擦证据加深
        - 扣留资金或客服失败增多，SLA 没有改善
        - 损害留存和商户质量假设
        - 把规模视为质量低于表面数量所暗示
      - - 监管或 PA 执行失足
        - 整改、入驻暂停或变现慢于预期
        - 拿掉乐观情景中的核心上行支柱
        - 下调乐观情景区间和整体建议
    notes: 否决触发项聚焦会直接损害估值案例的事件，而不是泛泛的运营挫折。
    claimRefs:
      - CV031
      - CV032
      - CV035
      - CV038
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人 / 尽调路径
    rows:
      - - IPO 前融资条款
        - 轮次规模、价格、结构，以及任何优先权或清算保护
        - 不知道下一笔资金是否认可，当前估值标记很难测算
        - 向管理层和领投方索取融资材料
      - - FY26 中期与审计更新
        - 当年收入、EBITDA、现金和营运资本趋势
        - 需要判断 FY25 是一次性清理，还是可持续的新运行率
        - 索取经审计管理账和董事会材料
      - - 信贷质量与贷款方组合
        - NPA 批次、复借用户队列、DLG / 非 DLG 组合、合作方集中度
        - 信贷不透明是当前估值显得偏高的最大原因之一
        - 审阅贷款方看板和批次曲线
      - - 商户质量与留存
        - 活跃商户、付费商户、设备留存、附着率、投诉结案
        - 只有规模没有质量，可能掩盖薄弱经济性
        - 索取队列分析和客户成功看板
      - - 治理证据
        - 内部控制、董事会委员会报告、和解后的审计发现
        - 需要检验修复是否可衡量，而不只是叙事
        - 审阅内部审计产出和董事会治理材料
    notes: 这些尽调事项是从观察转向可投资、且对价格敏感决策所需的最低材料包。
    claimRefs:
      - CV031
      - CV032
      - CV036
      - CV039
      - CV040
      - CV041
      - CV042
