      - CR035
      - CR038
      - CR040
      - CR042
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: BharatPe 的运营栈不只靠自有 app 和商户网络，还依赖多个外部节点。
    data:
      nodes:
        - id: bp
          label: BharatPe 核心
          description: 商户、消费者、贷款和 PA 触点。
        - id: rbi
          label: RBI
          description: 授权和监管机构。
        - id: banks
          label: 银行 / 收单机构
          description: 退款、结算和支付执行。
        - id: nbfc
          label: NBFC / 贷款合作伙伴
          description: 信贷审核和资金。
        - id: unity
          label: Unity SFB
          description: 合作银行与 TSP 关联的信任叙事。
        - id: merch
          label: 商户 / 用户
          description: 使用和变现基础。
      edges:
        - to: bp
          label: 授权 / 监督
          from: rbi
        - to: bp
          label: 退款 / 结算
          from: banks
        - to: bp
          label: 贷款资金 / 审核
          from: nbfc
        - to: bp
          label: TSP 和银行合作
          from: unity
        - to: merch
          label: 服务交付
          from: bp
        - to: bp
          label: 使用、留存、收入
          from: merch
    claimRefs:
      - CR021
      - CR022
      - CR026
      - CR027
      - CR040
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 当前判断来自真实估值锚和改善中的经济性，但被风险与披露折价抵消。
    data:
      nodes:
        - id: anchor
          label: 真实老股交易锚
          description: $2.85B 交易确认了一个活跃的私募估值标记。
        - id: econ
          label: FY25 经济性改善
          description: 收入增长，亏损大幅收窄。
        - id: risk
          label: 剩余折价
          description: 治理、信用、合作伙伴和客户摩擦风险仍在。
        - id: comp
          label: 公开可比公司约束
          description: Paytm、Pine Labs 和 MobiKwik 把倍数约束在现实区间。
        - id: view
          label: 观察 / 偏高
          description: 公司质地尚可，但当前标记还不足以构成明确买入。
      edges:
        - to: view
          label: 支撑底部
          from: anchor
        - to: view
          label: 支撑上行
          from: econ
        - to: view
          label: 压住倍数
          from: risk
        - to: view
          label: 划定区间
          from: comp
    claimRefs:
      - CV001
      - CV005
      - CV026
      - CV039
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 倍数约束只要小幅变化，估值区间就会被拉得很宽，因为 BharatPe 夹在高估值私募叙事和受压缩的公开可比公司之间。
    data:
      series:
        - id: bear
          label: 悲观倍数口径
          points:
            - label: 8x FY25 类收入倍数口径
              value: 1600
            - label: 10x FY25 类收入倍数口径
              value: 2000
        - id: base
          label: 基准倍数口径
          points:
            - label: 12x FY25 类收入倍数口径
              value: 2400
            - label: 14x FY25 类收入倍数口径
              value: 2800
        - id: bull
          label: 乐观倍数口径
          points:
            - label: 16x FY25 类收入倍数口径
              value: 3200
            - label: 18x FY25 类收入倍数口径
              value: 3600
    approximationNotes: 柱形条是按收入倍数逻辑算出的方向性估值输出，单位为 US$ millions；它们展示敏感性，不声称是精确的公允价值模型。
    claimRefs:
      - CV026
      - CV033
      - CV034
      - CV035
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前标记接近可能的基准区间顶部，只有倍数证据缺口补上后才有上行空间。
    data:
      items:
        - label: 乐观情景
          low: 3.2
          mid: 3.4
          high: 3.6
          unit: US$ bn
        - label: 基准情景
          low: 2.5
          mid: 2.75
          high: 3
          unit: US$ bn
        - label: 悲观情景
          low: 1.8
          mid: 2.05
          high: 2.3
          unit: US$ bn
    approximationNotes: 这些区间是启发式情景输出，不是 DCF 精度；目前公开证据没有披露搭建更精细模型所需的输入。
    claimRefs:
      - CV033
      - CV034
      - CV035
      - CV039
      - CV042
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 与当前判断最相关的公开事实，浓缩成一张记分卡。
    data:
      items:
        - label: 最新估值锚
          value: '2.85'
          unit: US$ bn
        - label: FY25 运营收入
          value: '1667'
          unit: ₹ cr
        - label: FY25 净亏损
          value: '88'
          unit: ₹ cr
        - label: 商户网络
          value: 17+
          unit: mn
        - label: 当前建议
          value: track
        - label: 估值判断
          value: stretched
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV039
      - CV042
