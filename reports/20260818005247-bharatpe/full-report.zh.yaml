            body: >-
              BharatPe 已不再处于创始人危机的急性阶段，但也没有完全走出。最强公开证据显示，Grover
              冲突通过和解和撤回结束，而不是通过实体裁决最终证明某一方指控成立。这一点重要，因为公司可以合理地说争端在运营层面已经过去，但投资者仍必须接受底层事实上的证明缺口。风险已经从主动诉讼收窄为残余可信度和尽调问题。BharatPe
              X 获得 RBI 最终授权是真正的正面因素，因为它降低了二元牌照风险，也释放出比危机年份更好的运营纪律信号。同时，受 RBI 监管的规模并不会抹去治理历史；它只是提高了 BharatPe
              在扩展到更严格监管的支付和信贷入口时必须持续满足的标准。这意味着新的承销应少问 BharatPe 能否讲出复苏故事，多问这个故事能否同时经受监管者、客户和合作伙伴审视。
