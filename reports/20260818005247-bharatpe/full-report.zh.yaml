              450+ 城市；ANI 在 2026 年 3 月重复了 1.7 crore 的规模。Unity 更早但仍有用的合作伙伴文件显示了规模故事如何随时间推进：历史商户数量小得多，但地理野心相似。因此，顶层问题不是
              BharatPe 有没有达到规模，而是这些规模中有多少是活跃、已变现、重复且跨分层耐久的。
