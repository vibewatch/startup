  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型与 FY25 拐点
        blocks:
          - type: paragraph
            body: >-
              BharatPe 的财务模型比简单 QR 收单故事更宽，但公开记录显示，不同收入引擎质量不均。官网仍以规模和商户效用开头：支付 TPV、大商户基础、免费 QR 收款、设备产品和商业贷款撮合。这意味着收入问题不在于
              BharatPe 是否有多个入口，而在于哪些入口真正变现，哪些只是低成本获客。最清晰的 FY25 证据显示，公司确实搭出了真实收入基础。独立媒体一致指向约 ₹1,667 crore 经营收入，以及约 ₹1,734
              crore 总收入或总收益。Entrackr 给出了最有用的结构细节，称服务费收入是主导驱动，占经营收入 77.6%，NBFC 收入升至 ₹211 crore。ET 的管理层访谈也方向一致，称 FY25 约
              ₹1,000 crore 收入来自金融服务。浮现出的图景是：公司把支付、设备和信贷一起使用，最高变现权重大概率落在更宽的金融服务和费用栈，而不是单纯商品化 QR 发起。
