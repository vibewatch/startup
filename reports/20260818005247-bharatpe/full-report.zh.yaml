      - number: '4.2'
        title: 成本结构与单位经济
        blocks:
          - type: paragraph
            body: >-
              这次扭转在财务上有意义，但改善质量仍需谨慎处理。BharatPe 从 FY24 明显亏损基线，走到多个来源称调整后盈利的 FY25。可是指标对定义很敏感。净亏损仍约 ₹88 crore，调整后 PBT 报道为
              ₹6 crore，剔除 ESOP 的 EBITDA 报道约 ₹141 crore；Entrackr 还单独给出更窄的报告 EBITDA ₹47 crore，以及调整后 EBITDA ₹195.5
              crore。这并非矛盾，更像披露警示：剔除哪些调整项，会显著改变利润标题。成本细节同时支持正面和谨慎两种看法。约 ₹391 crore 的处理成本、约 ₹360 crore
              的员工福利，以及大幅降低的广告费用显示出纪律。但 Angel One 也报道金融担保成本大幅上升，而当增长越来越依赖贷款和信贷相关产品时，这类信号正可能变得重要。因此，公开数据足以说明 BharatPe
              不再是失控烧钱故事，但还不足以宣称公司已有干净的稳态利润率或按产品线归一化的单位经济。
