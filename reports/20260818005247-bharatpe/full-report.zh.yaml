      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              BharatPe
              市场里的买方并不统一。最小的线下商户中，经济买方通常是店主，选择最省事的数字支付受理方式；日常用户可能是商户本人、收银员或管理收款的家庭成员。随着商户成熟度提高，财务和运营负责人会更在意结算、仪表盘质量、支持和对账。BharatPe
              自身组合暗示了一条采用路径：先从支付受理切入，再试图扩展到设备、贷款、卡和消费者联动互动。公司商户与消费者入口，加上 Unity 卡合作，支持这一解读：BharatPe
              想把一个支付触点变成更宽的经营关系。因此，买方扩张很关键。商户希望减少供应商并获得一定信贷入口时，平台最强；商户只需要最低成本 QR 贴纸时，平台优势就弱得多。
            claimRefs:
