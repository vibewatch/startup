  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品地图与客户任务
        blocks:
          - type: paragraph
            body: >-
              公众仍把 BharatPe 和 QR 贴纸联系在一起，但公司的产品面已经异常宽。保留的官方和市场页面显示出两个重叠产品族。一个是商户优先：QR 收款、银行卡或 POS 设备、音箱，以及现在作为捆绑硬件终端的
              BharatPe One。第二个更偏消费者和金融工具：BharatPe UPI、账单支付、信用卡账单支付、贷款、投资，以及 RuPay 连接的 EMI
              卡。实践中，这两类并不是割裂世界。商户栈低成本获取交易意图，消费者和信贷入口则试图提高钱包份额和变现深度。因此，BharatPe 不像单 SKU
              支付工具，更像一个从线下收款起步、再分叉到相邻金融任务的工作流平台。尽调里的关键点是，产品地图现在已经足够连贯，可以按用户任务描述：收钱、确认收款、对账、获得信贷、支付账单，并越来越多通过 BharatPeX
              运行在线或应用内 UPI 体验。
