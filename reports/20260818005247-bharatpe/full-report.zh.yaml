  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值锚点与证据质量
        blocks:
          - type: paragraph
            body: >-
              BharatPe 的估值讨论，不是从过时的头条数字开始，而是从一笔真实且近期的交易开始：据报道一笔老股交易按 $2.85 billion
              定价。对尽调来说，这是有意义优势，因为它给了投资人一个实际市场出清参照。但这个参照的质量仍有边界。交易看起来验证的是稳定，而不是重估；交易发生时，市场叙事围绕治理清理、盈利改善和 IPO
              前定位。换句话说，这个价格锚可信，但不能自动等同便宜。FY25 财务改善当然加分，尤其是经营收入跳到 ₹1,667
              crore、亏损大幅收窄。但关键问题是，这种改善配不配享受更高估值倍数，还是只是守住原来的独角兽价格。现有证据更支持后一种解读：BharatPe
              已经稳定下来，也可投资，但仅凭公开信息看，并不明显低估。投资人买的是一个更干净的故事，但真正完整的证据包还没到手。
