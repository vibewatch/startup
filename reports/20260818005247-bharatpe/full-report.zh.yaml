      - number: '2.5'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              BharatPe 最大的结构性驱动，是印度继续以极高速度推动商户支付数字化，尤其靠 UPI 和 QR
              基础设施。这带来一个很大的商户漏斗，后续可能购买设备、信贷或其他资金流转工具。但同一组证据也解释了为什么市场质量比市场规模更难。UPI
              的主导地位最强的是高频零售流，而不是天然支撑丰厚支付经济性的高金额品类。竞品重叠很广，价格透明度在上升，RBI
              也收紧了数字贷款和亏损分担规则，正好覆盖金融科技公司常用来拓宽利润率的嵌入式信贷邻近业务。结果是，这个市场奖励工作流深度、合规质量和合作伙伴执行，而不是单纯的轨道接入。BharatPe
              的战略逻辑适配这种环境，但公开记录仍未充分揭示费率、活跃商户或产品级利润率，无法证明公司今天到底变现了多少市场。
