      - number: '8.4'
        title: 尽调问题与破坏投资逻辑的信号
        blocks:
          - type: paragraph
            body: >-
              下一步真正该推动投委会的，不是又一轮关于印度金融科技的大叙事，而是一小组非常具体的证明。第一，投资人需要看清未来经济性：经审计的 FY26 轨迹、现金需求，以及任何 IPO
              前定价或优先权条款。第二，需要判断商户驱动模式是高质量还是只是高体量，证据包括合作伙伴集中度、信贷批次表现和复借人耐久度。第三，需要看到治理修复已经可计量，而不只是口号。公开资料在这些问题上太薄，不能支撑虚假的精确。正确纪律是把破坏投资逻辑的信号先定义清楚：如果亏损再次扩大、客户摩擦证据加深、合作伙伴风险被证明集中，或下一轮融资把价格向下重置，偏高的私募价格就不再值得享受信任红利。
