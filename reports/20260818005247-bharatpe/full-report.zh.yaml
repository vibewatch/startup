      - number: '4.4'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              财务结论偏建设性，但不干净。BharatPe 显然在 FY24 到 FY25 之间完成了真实经营重置：收入继续增长，净亏损大幅收窄，调整后盈利转正，外部投资者仍愿意在老股交易中按约 $2.85 billion
              给公司定价。这是故事的最强版本，并且支撑充分。较弱的一面在披露质量。公开来源仍无法干净核对累计融资，不披露月度烧钱或现金跑道，不给出按支付轨道划分的已实现费率，也不展示产品级贡献利润率或按队列的贷款损失表现。换句话说，公开证据足以承销动能，但不足以高精度承销内在价值。因此，投资者应把
              BharatPe 视为一家已有规模、财务纪律改善、变现路径越来越偏贷款、资本入口可信的金融科技公司；但在假设调整后利润能转化为耐久、充分归一化的自由现金流质量之前，仍应坚持要求更深的尽调包。
