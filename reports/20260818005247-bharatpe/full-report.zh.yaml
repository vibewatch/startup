    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、商户规模与产品栈
        blocks:
          - type: paragraph
            body: >-
              BharatPe 现在把自己定位为商户优先的支付和金融服务平台，并已扩展成更宽的双边金融科技栈。最清晰的当下事实来自官网和相邻官方渠道：公司称服务超过 17 million 商户伙伴，覆盖 450
              多个城市，累计处理超过 Rs 1,700 billion 支付 TPV，并促成超过 Rs 14,600 crore 商业贷款。上述页面也说明 BharatPe 不是只有一个 QR 产品。现有组合包括
              BharatPe QR、BharatPe One、BharatPe Swipe、BharatPe Speaker、BharatPe UPI、信用卡账单支付、公用事业账单支付，以及个人贷款 / 卡产品。Inc42
              的 2026 公司档案和 Unity Bank 的合作伙伴材料，都把法律实体锚定在 Resilient Innovations，并确认 2018 年创立。合在一起，证据足以把 BharatPe
              描述为一个已有规模的印度商户支付平台：它有意从线下 UPI 收款，延伸到 POS 设备、贷款分发和消费者侧支付工具。
