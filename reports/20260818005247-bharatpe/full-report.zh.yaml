      - number: '1.4'
        title: 受监管合作、技术信号与待解事项
        blocks:
          - type: paragraph
            body: >-
              BharatPe 当前模式仍依赖合作伙伴，尤其是在单纯支付品牌无法自供受监管资产负债表的领域。Unity Small Finance Bank 的信用卡材料显示，BharatPe
              与合作银行一起分发受监管信贷，并明确把 Resilient Innovations 标识为品牌背后的核心实体。这一点重要，因为后续贷款和信贷主张应被理解为生态能力，而不是 BharatPe
              拥有银行牌照的证明。技术信号比治理披露更可信。BharatPe Tech 称公司拥有超过 200 名工程师；Coralogix 案例研究则描述，随着交易和商户规模增长，公司从自建 Elasticsearch
              可观测性栈迁出。这些来源支持一个判断：BharatPe
              现在确实以平台规模运营，基础设施复杂度也不低。主要尽调缺口在别处：当前董事会构成没有透明发布；融资总额会因是否计入债务而不同；公司仍未公开区分注册商户和月活跃商户。
