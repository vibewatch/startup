  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - PhonePe
        - FY26 收入 ₹7,920 crore；估值参考 ~$12B 至 ~$15B
        - 规模大得多的私营龙头上限可比
        - 最适合对照印度 UPI 及相邻金融科技野心
        - 用户基础和市场份额远大于 BharatPe
      - - Paytm
        - FY25 收入 ₹6,900 crore；市值 ~$10.59B；EV ~₹867.69B
        - 上市商户支付与金融分销可比公司
        - 展示深度披露和公开市场审视的样子
        - 转型历史和上市公司流动性不同
      - - Pine Labs
        - 收入 ~₹2,832 crore；EV ~₹109.80B；市值 ~₹187.65B
        - 上市商户支付基础设施可比公司
        - 可用于约束商户和支付基础设施估值
        - 地域、产品组合和上市市场动态不同
      - - MobiKwik
        - FY25 总收入 ₹1,192 crore；市值 ~₹15.97B
        - 规模较小的上市消费者支付与信贷可比公司
        - 可作为印度金融科技倍数压缩的低端参照
        - 规模远小于 BharatPe，业务宽度也更弱
    notes: 可比行用于框出估值走廊，不是机械算出公允价值。
    enumerationScope:
      coverage: partial
      basis: >-
        The table covers the most visible Indian fintech comparables accessible from retained public sources, but it
        excludes private comp nuances such as preference stack, secondary liquidity terms, and non-public peer
        financials.
