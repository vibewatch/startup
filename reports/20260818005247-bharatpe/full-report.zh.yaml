      - number: '2.2'
        title: 市场规模与基础设施
        blocks:
          - type: paragraph
            body: >-
              印度数字支付基数巨大，但不同轨道之间的经济价值分布并不均匀。RBI 2025 年 12 月 Payment Systems Report 称，CY2025 总支付交易量达到 26,819 crore，金额为 Rs
              3,215 lakh crore；数字支付占交易量 99.8%、占金额 97.8%。按使用量看，UPI 是主导零售轨道：在 H2 CY2025，它占交易量 85.5%，但只占交易金额 9.5%。UPI 交易量从
              CY2021 的 3,873 crore 增至 CY2025 的 22,828 crore，金额从 Rs 72 lakh crore 增至 Rs 300 lakh crore，平均客单价降至 Rs
              1,313。受理基础设施更能说明 BharatPe 相关机会。到 2025 年底，RBI 记录了 7,313.65 lakh 个 UPI QR 码，而 POS 终端只有 114.75 lakh
              台。这个差距解释了为什么在印度，低成本 QR 牵引的商户获客已经比硬件优先部署更具结构性重要性。
