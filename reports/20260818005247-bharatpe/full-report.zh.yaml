      - number: '5.2'
        title: 架构、集成与基础设施
        blocks:
          - type: paragraph
            body: >-
              公开记录支撑了一个比泛泛金融科技营销更具体的运营模型。BharatPe One 报道展示了现场终端层：基于 Android 的设备、QR、银行卡受理、音箱、连接能力，以及商户边缘的交易仪表盘。App Store
              列表展示了消费者层：UPI、账单支付、贷款、UPI 上信用卡、奖励，以及绑定 NPCI 式认证的权限。BharatPeX 报道补上企业层：支付网关、收款和付款、应用内 UPI
              流程、专门实施小组，以及回答技术和监管问题的 AI 助手。不过，最强的基础设施证据来自 Unity SFB 关系。多个来源称，BharatPe 是 Unity 的技术服务提供商，管理核心 UPI
              交易处理层，并通过 Unity-PSP 和 BharatPe-TSP 安排支持 Jar 等第三方金融科技工作流。这意味着 BharatPe 不只是发布 App
