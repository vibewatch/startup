      - number: '1.2'
        title: 领导层重置与治理历史
        blocks:
          - type: paragraph
            body: >-
              看 BharatPe 的公司概况，绕不开 Ashneer Grover 时代之后的治理重置。Reuters 报道，Grover 在 2022 年 3 月辞去董事总经理和董事职务，此前他与 Kotak
              Mahindra Bank 发生高度公开的争端；Reuters 2022 年 5 月的另一篇报道又称，在投资者和媒体审视加剧后，BharatPe
              计划推进治理整改并解雇员工。现任管理层一直试图把叙事往前推。Hindustan Times 和 The Economic Times 均报道，BharatPe 于 2024 年 4 月任命 Nalin Negi
              为正式 CEO；在 Suhail Sameer 于 2023 年 1 月离任后，Negi 已先后担任 CFO 和临时 CEO。Negi
              公开表述本身很关键：他强调持续盈利、扩大贷款业务和推出新的商户中心产品，而不是重回不惜代价换增长。结论是，BharatPe
              现在有了更清晰的经营负责人，但公开记录对高管叙事的支撑仍强于对完整法定董事会构成、委员会或控制权安排的披露。
