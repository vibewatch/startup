      - number: '8.3'
        title: 情景假设与投资建议
        blocks:
          - type: paragraph
            body: >-
              BharatPe
              的乐观情景不难想象。盈利改善，监管准备度增强，公司仍能靠支付、设备、借贷以及现在的支付聚合，从商户关系里继续变现。问题是，当前价格已经给了这部分上行不少信用。基准情景下，投资人必须问：如果没有实质性披露升级，也没有经济性再跨一档，接下来还能赢多少。答案是仍有一些上行，但不足以在公开证据基础上给出明确买入。悲观情景也很具体。如果市场开始把
              BharatPe
              按带有治理包袱、服务风险外溢和信贷不透明度的上市金融科技公司来定价，公允价值区间可能明显低于老股交易价格。因此，今天正确结论是观察，置信度中等，估值姿态偏高。买入结论需要更低进入价格，或明显更强的证据。
