      - number: '4.3'
        title: 资本充足性、融资与信贷强度
        blocks:
          - type: paragraph
            body: >-
              BharatPe 的资本故事比其 2022 年声誉暗示的更好，但仍无法靠公开材料完全审计。正面看，Entrackr 报道 FY25 末公司有 ₹2,685 crore 流动资产、₹872 crore
              现金和银行余额；同期报道也指向持续获得债务和老股资本。FY25，公司从 Neo Group 和 Trifecta Capital 获得 ₹125 crore 债务融资，另有一笔家族办公室买入公司 2.6%
              股权的老股交易。多家媒体把这笔老股交易估值放在 $2.85 billion，说明私募投资者仍给这家公司独角兽级价值。与此同时，管理层公开讨论另一轮约 $100 million 融资，并把 IPO
              时间与持续盈利挂钩。信贷强度现在也更重要。ET 2025 年 8 月访谈指向 8 家贷款伙伴、约 ₹1,300 crore AUM，以及 ₹1.2 lakh 平均无抵押票面；2026 年品牌重塑报道称
              BharatPe Capital 现在运营超过 ₹1,750 crore 的贷款账簿，年放款约 ₹3,500 crore。这支撑了信贷正在放大的乐观情景，但也意味着承销 BharatPe
              已不只是看支付指标：投资者还必须接受资产负债表邻近风险、融资连续性和组合质量，而公开来源仍未充分提供这些信息。
