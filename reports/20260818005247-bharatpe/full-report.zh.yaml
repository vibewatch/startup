  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              BharatPe 的可服务市场比 UPI QR 收款更宽，但比整个印度支付系统更窄。公司最相关的场景，是商户需要一套经营组合：QR 收款、银行卡收款、简单设备部署、对账，以及相邻信贷或忠诚度产品。BharatPe
              官方渠道和 Unity 合作证据显示，平台经济逻辑落在商户工作流层，而不是国家支付轨道层。这个区分很重要，因为印度支付系统数字很大，但相当多价值沉在 RTGS、NEFT 或其他 BharatPe
              无法直接变现的流里。现实替代方案也很碎片化。商户可以继续使用银行 QR、单功能网关、POS
              专家，或在更小业态里维持现金占比较高的流程。只有当痛点跨越多个工作流，且商户便利性或营运资金获取足以支撑平台关系时，BharatPe 才会赢。
            claimRefs:
              - CM009
              - CM010
              - CM022
              - CM024
