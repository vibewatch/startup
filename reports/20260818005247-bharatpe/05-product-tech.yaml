- id: deployment-reliability-and-trust-controls
  title: Deployment, reliability, and trust controls
  body: 'Deployment evidence is mixed but directionally positive. BharatPe One was described as rolling first into about 100 cities, then scaling toward 450 cities, while older device coverage and the Unity partner PDF give some support for a substantial POS footprint. Reliability evidence is stronger than many private fintechs offer. Unity SFB’s 100% UPI success rate in NPCI-linked reporting, with zero technical and business declines, is a meaningful external proof point that BharatPe can run payment infrastructure with high availability and throughput. Trust evidence is more uneven. The App Store listing discloses authentication logic, permissions, linked-data categories, release notes, provider identity, and customer-support email. Review evidence, however, shows the lived experience is not uniformly excellent: users praise ease of use, QR convenience, and smart-speaker workflows, but also report occasional glitches, delayed settlements, support frustration, and limited-region issues.
    That combination suggests the core platform can perform at scale under the hood while the day-to-day service layer still has room to mature.'
