chapter:
  number: 5
  title: Product & Technology
  summary: 'BharatPe has evolved from a QR-led merchant tool into a broader offline-to-online payments and financial-services stack. The strongest supported product facts are the breadth of its merchant and consumer modules, the bundled BharatPe One device, the enterprise-oriented BharatPeX launch, and the Unity TSP role that provides real public evidence of infrastructure execution. The main gap is inspectability: BharatPe’s operational depth is visible through outcomes and partners, but its public developer surface, security documentation, and status transparency are still thin.'
sections:
- id: product-map-and-customer-jobs
  title: Product map and customer jobs
  body: 'BharatPe’s product surface is unusually broad for a company still publicly associated with QR stickers. The retained official and marketplace surfaces show two overlapping product families. One is merchant-first: QR acceptance, card or POS devices, speakers, and now BharatPe One as a bundled hardware endpoint. The second is broader consumer and financial utility: BharatPe UPI, bill pay, credit-card bill payment, loans, investments, and a RuPay-linked EMI card. In practice, these are not separate worlds. The merchant stack acquires transaction intent cheaply, while the consumer and credit surfaces try to increase wallet share and monetization depth. That makes BharatPe less like a single-SKU payment tool and more like a workflow platform that starts with offline acceptance and then branches into adjacent financial tasks. The key point for diligence is that the product map is now coherent enough to describe by user job: accept money, confirm payment, reconcile activity, access credit,
    pay bills, and increasingly run online or in-app UPI experiences through BharatPeX.'
