- id: architecture-integration-and-infrastructure
  title: Architecture, integration, and infrastructure
  body: 'The public record supports a more specific operating model than generic fintech marketing usually allows. BharatPe One coverage shows the field endpoint layer: Android-based devices, QR, card acceptance, speakers, connectivity, and transaction dashboards at the merchant edge. The App Store listing shows the consumer layer: UPI, bill payments, loans, credit-card-on-UPI, rewards, and permissions tied to NPCI-style authentication. BharatPeX coverage adds the enterprise layer: a payment gateway, collections and payouts, in-app UPI flows, a dedicated implementation squad, and an AI assistant that answers technical and regulatory questions. The strongest infrastructure evidence, however, comes from the Unity SFB relationship. Multiple sources say BharatPe acts as technology service provider for Unity, manages the core UPI transaction-processing layer, and supports third-party fintech workflows such as Jar through the Unity-PSP and BharatPe-TSP arrangement. That means BharatPe is not just
    shipping apps and devices; it is also operating important middle-layer payment infrastructure, even though it still does not expose a clean public developer API or SDK surface.'
