callouts:
- calloutType: strength
  title: India’s payments market is huge, but BharatPe’s real opportunity is the merchant workflow wedge
  body: The strongest market takeaway is that QR-led digitisation has made merchant acquisition cheap and broad, but value creation now depends on layering devices, settlement tools, and credit products around that base. BharatPe’s product direction is therefore aligned with the way the market is evolving.
  claimRefs:
  - CM007
  - CM009
  - CM024
  - CM038
- calloutType: risk
  title: Rail ubiquity and regulatory tightening make the market attractive but not automatically profitable
  body: UPI’s scale is undeniable, yet it is precisely that ubiquity that turns raw payment acceptance into a commoditised layer. BharatPe still has to prove that partner-bank credit, device attach rates, and merchant support can overcome zero-MDR pressure and the tighter digital-lending rulebook.
  claimRefs:
  - CM029
  - CM031
  - CM033
  - CM034
  - CM039
  - CM041
