tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or workflow
  - Excluded spend
  - Buyer / payer
  - Relevance to BharatPe
  rows:
  - - Merchant QR acceptance
    - In-store UPI collections and settlement visibility
    - Wholesale bank transfers with no merchant UI
    - Merchant owner / merchant entity
    - Core acquisition wedge for BharatPe
  - - Card acceptance and offline devices
    - POS/card processing, device uptime, queue speed
    - Pure QR-only software with no device layer
    - Store operator / owner
    - Important for BharatPe Swipe and BharatPe One expansion
  - - Merchant credit distribution
    - Working-capital or card-linked credit products sold through payment relationship
    - Standalone unsecured consumer lending unrelated to merchants
    - Merchant owner / partner bank
    - Adjacency that can raise monetisation beyond payments
  - - Consumer-linked UPI and bill-pay utilities
    - App-led UPI, bill pay, card bill payment, rewards touchpoints
    - General banking products with no BharatPe relationship
    - Consumer / BharatPe app user
    - Engagement and cross-sell support, not the whole TAM
  - - Settlement and reconciliation workflow
    - Transaction visibility, dashboards, support, issue resolution
    - Core-bank treasury systems with no merchant product layer
    - Merchant owner / finance lead
    - Helps explain platform stickiness versus simple rail access
  - - Omnichannel or exporter payments
    - Gateway, cross-border, or enterprise needs
    - Pure remittance flows outside merchant commerce
    - Finance lead / larger merchant
    - Less core than offline UPI but relevant at the upper end
  notes: Defines BharatPe’s monetisable market around merchant workflows rather than the full value of India’s payment rails.
