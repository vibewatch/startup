- id: growth-drivers-and-constraints
  title: Growth Drivers and Constraints
  body: The biggest structural driver for BharatPe is that India continues to digitise merchant payments at extraordinary speed, especially through UPI and QR infrastructure. That creates a very large funnel of merchants who may later buy devices, credit, or other money-movement tools. But the same evidence base also shows why market quality is harder than market size. UPI’s dominance is strongest in high-frequency retail flows, not in the large-value categories that automatically support rich payment economics. Rival product overlap is broad, pricing transparency is rising, and RBI has tightened digital-lending and loss-sharing rules around the very kinds of embedded-credit adjacencies that fintechs often use to widen margins. The result is a market that rewards workflow depth, compliance quality, and partner execution more than plain rail access. BharatPe’s strategic logic fits that environment, but the public record still does not reveal enough about take rates, active merchants, or product-level
    margins to prove how much of the market it monetises today.
  claimRefs:
  - CM031
  - CM032
