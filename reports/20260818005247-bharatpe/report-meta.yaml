  topStrengths:
    - Real merchant and geographic scale with 17M+ merchants and 450+ city presence.
    - FY25 operating momentum improved materially, with higher revenue and much narrower losses.
    - RBI payment-aggregator authorisation adds regulatory credibility and expands monetisation options.
    - Merchant-led monetisation plus devices, lending, and payments infrastructure creates multiple upside levers.
    - A real secondary transaction provides a better current valuation anchor than most private startups offer.
  topRisks:
    - Governance legacy still warrants a discount because the prior dispute ended via settlement, not adjudication.
    - Current valuation implies a demanding multiple versus most public Indian fintech comparables.
    - Credit-quality, partner concentration, and current-year cash/earnings data remain under-disclosed.
    - Customer-friction and low switching costs can erode merchant-quality economics faster than headline scale suggests.
    - Pre-IPO financing terms and preference-stack details are not public.
  unresolvedGaps:
    - FY26 interim or audited financial trajectory, including cash, EBITDA, and working-capital trend.
    - Lender concentration, NPA and vintage data, repeat-borrower durability, and DLG versus non-DLG mix.
    - Cap-table rights, liquidation preferences, and terms of any proposed pre-IPO financing.
    - Active-versus-registered merchant quality, device retention, and complaint-resolution performance.
