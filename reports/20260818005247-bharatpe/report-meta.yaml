  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO009, CO023, CV001, CV003, CV010, CV028]
summary:
  headline: >-
    BharatPe now looks operationally healthier than its governance-era reputation, but the current
    private valuation already prices in much of that recovery before the hardest diligence questions
    are publicly answered.
