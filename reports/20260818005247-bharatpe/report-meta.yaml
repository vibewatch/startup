companyProfile:
  summary: >-
    BharatPe is a New Delhi-headquartered merchant fintech founded in 2018 that built its initial
    wedge around interoperable UPI QR acceptance for Indian merchants and has since expanded into POS
    devices, lending distribution, consumer bill-pay and UPI flows, and a newly authorised online
    payment-aggregator business. Public evidence supports real scale, a much stronger FY25 operating
    profile, and credible regulatory progress, but still leaves important diligence gaps around credit
    quality, partner concentration, governance proof, and current financing terms.
  founders:
    - name: Ashneer Grover
      role: Co-founder
      background: >-
        Early BharatPe leader associated with the company’s rapid scaling phase and later removed from
        management during the governance crisis that reshaped the company’s control narrative.
      claimRefs: [CO002, CR001]
    - name: Shashvat Nakrani
      role: Co-founder
      background: >-
        Co-founded BharatPe in 2018 and remains part of the company’s founding identity as the business
        evolved from merchant QR acceptance into a broader fintech stack.
      claimRefs: [CO002]
  foundedDate: '2018-01-01'
  foundingLocation: Delhi, India
  headquarters: New Delhi, India
  productSummary: >-
    BharatPe QR, BharatPe One, BharatPe Swipe, BharatPe Speaker, merchant lending and partner-bank
    credit products, BharatPe UPI and bill-pay surfaces, plus BharatPe X for online payment aggregation.
  customerFocus: >-
    Indian offline merchants, SMBs, credit-seeking merchant cohorts, consumer bill-pay and UPI users,
    and emerging enterprise or platform-style payment clients.
  businessModel: >-
    Merchant acquisition through payments and devices, monetisation through service fees, lending and
    cross-sell, partner-bank and NBFC-enabled financial distribution, and expanding online payments
    infrastructure under an RBI-authorised PA arm.
  stage: late-stage private / likely pre-IPO candidate but still privately disclosed
  fundingStatus: >-
    Public sources confirm a live $2.85 billion secondary valuation anchor and continued investor
    interest, but total funding tallies differ across databases and media depending on debt treatment,
