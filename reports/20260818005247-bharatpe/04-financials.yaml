    - List signal only; realized economics undisclosed
    - Multi-app QR acceptance for merchants
    - Cross-sell take rate, settlement economics, support cost
    - Free QR helps acquisition but pushes monetization into adjacencies
  - - BharatPe Swipe / One
    - Commercial terms not publicly disclosed
    - Realized pricing undisclosed
    - Card and QR acceptance via device
    - Hardware margin, rental terms, servicing costs
    - Device economics likely matter more than the landing page reveals
  - - Merchant loans
    - No public rate-card or revenue-share disclosure
    - Realized economics undisclosed
    - Merchant credit through partners and in-house NBFC
    - Yield, credit cost, guarantee fee, recovery profile
