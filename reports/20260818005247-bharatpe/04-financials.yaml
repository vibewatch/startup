callouts:
- calloutType: insight
  title: The core financial improvement is corroborated across many outlets
  body: Multiple independent sources converge on FY25 operating revenue of about ₹1,667 crore, total revenue of about ₹1,734 crore, and adjusted PBT of ₹6 crore, so the turnaround is not a single-source artifact.
