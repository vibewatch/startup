    - Promotional or packaged pricing signal, not a full economics view
    - RuPay-on-UPI card, EMI conversion, rewards
    - Interchange split, revolve behavior, funding cost, default profile
    - Good consumer-acquisition signal, weak public margin transparency
  - - Consumer app loans and cards
    - Public product availability only
    - Realized pricing undisclosed
