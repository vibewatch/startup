chapter:
  number: 4
  title: Financials
  summary: 'BharatPe’s FY25 financial picture is materially better than its 2022-2024 reputation, but the quality of that improvement is still only partly disclosed. The strongest supported facts are revenue from operations of about ₹1,667 crore, total revenue near ₹1,734 crore, net loss narrowing to about ₹88 crore, adjusted PBT of ₹6 crore, and a lending-heavy revenue mix that increasingly drives the model. The main blocker is disclosure quality: profitability definitions vary across outlets, funding totals do not reconcile cleanly, and public sources still do not provide burn, runway, realized take rates, or cohort-level credit losses.'
sections:
- id: revenue-model-and-fy25-inflection
  title: Revenue model and FY25 inflection
  body: 'BharatPe’s financial model is broader than a simple QR-acquiring story, but the public record shows that the revenue engines are uneven in quality. The homepage still leads with scale and merchant utility: payments TPV, a large merchant base, free QR acceptance, device products, and business-loan facilitation. That means the revenue question is not whether BharatPe has multiple surfaces, but which of those surfaces actually monetize and which merely acquire merchants cheaply. The clearest FY25 evidence says the company did create a real top-line base. Independent outlets converge on revenue from operations of roughly ₹1,667 crore and total revenue or total income of about ₹1,734 crore. Entrackr adds the most useful mix detail, saying service-fee income was the dominant driver at 77.6% of operating revenue and that NBFC income rose to ₹211 crore. ET’s management interview pushes the same directionally, with roughly ₹1,000 crore of FY25 revenue attributed to financial services. The
    picture that emerges is a company using payments, devices, and credit together, with the highest monetization weight seemingly sitting in the broader financial-services and fee stack rather than in commoditized QR initiation alone.'
