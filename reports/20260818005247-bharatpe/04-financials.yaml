- id: capital-adequacy-financing-and-credit-intensity
  title: Capital adequacy, financing, and credit intensity
  body: 'The capital story is better than BharatPe’s 2022 reputation might suggest, but it is still not fully auditable from public material. On the positive side, Entrackr reports ₹2,685 crore of current assets and ₹872 crore of cash and bank balances at the FY25 close, while contemporaneous coverage points to continuing access to debt and secondary capital. FY25 saw a ₹125 crore debt raise from Neo Group and Trifecta Capital, plus a secondary transaction in which family offices bought 2.6% of the company. Several outlets place that secondary at a $2.85 billion valuation, showing that private investors still ascribe unicorn-level value to the business. At the same time, management is openly discussing another funding round of about $100 million and linking IPO timing to sustained profitability. Credit intensity also matters more now. ET’s August 2025 interview points to eight lending partners, around ₹1,300 crore of AUM, and ₹1.2 lakh average unsecured ticket sizes, while 2026 rebrand coverage
    says BharatPe Capital now runs a loan book above ₹1,750 crore and annual disbursals of roughly ₹3,500 crore. That supports the bull case that credit is scaling, but it also means underwriting BharatPe now requires more than just payments metrics: it requires comfort with balance-sheet-adjacent risk, funding continuity, and portfolio quality that public sources still do not fully provide.'
