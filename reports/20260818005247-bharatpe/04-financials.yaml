- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is constructive but not clean. BharatPe clearly achieved a real operating reset between FY24 and FY25: revenue rose again, net loss narrowed sharply, adjusted profitability turned positive, and external investors were still willing to price the company at around $2.85 billion in secondary trading. That is the strongest version of the story and it is well supported. The weaker version is about disclosure quality. Public sources still do not reconcile total funding cleanly, do not disclose monthly burn or runway, do not give realized take rates by payment rail, and do not show product-level contribution margins or loan-loss performance by cohort. In other words, public evidence is good enough to underwrite momentum, but not good enough to underwrite intrinsic value with high precision. Investors should therefore treat BharatPe as a scaled fintech with improving financial discipline, a lending-heavy monetization path, and credible capital access—but still insist
    on a deeper diligence pack before assuming that adjusted profit translates into durable, fully normalized free-cash-flow quality.'
