  evidenceGaps:
  - type: missing-source
    severity: material
    topic: monthly-burn-and-runway
    missingEvidence: Public sources do not disclose BharatPe’s monthly burn, runway, cash-consumption cadence, or downside liquidity scenarios.
    whyItMatters: Visible cash and current-assets figures cannot be turned into a reliable financing-risk view without burn and runway data.
    diligencePath: Request monthly cash-flow statements, board cash dashboards, budget-versus-actuals, and base/downside runway cases.
    relatedQuestionRefs:
    - QI017
    - QI023
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: realized-unit-economics-and-credit-quality
    missingEvidence: Realized take rates by rail, device contribution margins, loan-loss vintages, NPA ratios, guarantee economics, and product-level contribution margins remain private.
    whyItMatters: BharatPe’s current story is increasingly lending-heavy and definition-sensitive, so adjusted profitability is not enough without cohort-level credit and margin detail.
    diligencePath: Collect segment P&Ls, TPV-to-net-revenue bridges, NPA dashboards, recovery data, and provisioning policy by product cohort.
    relatedQuestionRefs:
    - QI012
    - QI021
    - QI024
    relatedTableRefs:
    - TI001
    - TI002
    - TI003
  - type: missing-source
    severity: material
    topic: funding-history-reconciliation
    missingEvidence: Public sources do not reconcile BharatPe’s total funding cleanly across equity, venture debt, debt, and secondary transactions.
    whyItMatters: Without a reconciled funding history, investors cannot model dilution, capital efficiency, or true dependence on external financing accurately.
    diligencePath: Reconcile every primary and secondary round against company cap-table records, board approvals, and lender documentation.
