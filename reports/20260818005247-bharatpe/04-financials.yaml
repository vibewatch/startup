  rows:
  - - Merchant service-fee income
    - Processing charges, loan commissions, and device-related fees
    - Transaction / merchant / device
    - ₹1,456 crore in FY25; 77.6% of operating revenue
    - Medium-high
    - Break out payment-processing take rate versus lending commissions and rental income
  - - NBFC lending income
    - Income generated by Trillionloans or BharatPe Capital
    - Loan book / interest or fee income
    - ₹211 crore in FY25 versus ₹165 crore in FY24
    - Medium
