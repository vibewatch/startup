- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact on underwriting
  - Exact diligence path
  rows:
  - - Monthly burn and runway
    - Without burn, the visible cash number cannot be turned into a financing-risk view
    - Request monthly cash-flow statement, budget versus actuals, and downside runway cases
  - - Realized take rates by rail and merchant segment
    - Free QR makes list pricing meaningless without realized fee data
    - Collect TPV, MDR, and net-revenue rates by UPI, cards, devices, and online PA
  - - Product-level contribution margins
    - Adjusted profitability can hide weak sub-business economics
    - Ask for segment P&Ls across payments, devices, lending, consumer, and BharatPe X
  - - Credit quality by cohort
    - Loan-book growth is less useful without NPA, delinquency, and recovery data
    - Review monthly delinquency vintages, guarantees, write-offs, and provisioning policy
  - - Funding and cap-table reconciliation
    - Public funding totals conflict, clouding dilution and capital-history analysis
    - Reconcile all equity, debt, and secondary transactions against board-approved records
  - - Customer concentration and retention by monetized cohort
    - A large merchant base does not prove durable high-quality revenue
    - Request paying-merchant cohorts, repeat-borrower cohorts, and top-customer concentration
  notes: These are the highest-priority blockers to converting BharatPe’s public turnaround story into a high-confidence underwriting model.
