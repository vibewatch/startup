  - CI015
  - CI017
- calloutType: risk
  title: Lending is becoming more central just as disclosure remains incomplete
  body: The public record now clearly points to material AUM and loan-book growth, but it still does not disclose NPA behavior, reserve policy, or cohort losses in enough depth to underwrite credit risk confidently.
  claimRefs:
