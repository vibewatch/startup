  - - QR acceptance and core payments
    - Merchant acquisition and ongoing transaction activity
    - Merchant / transaction
    - Massive scale is visible, but direct realized monetization is not disclosed and QR is marketed as free
    - Medium-low
    - Provide realized net take rates by rail and merchant cohort
  - - POS devices and speakers
    - Machine sale, rental, servicing, or blended processing economics
    - Machine / merchant / transaction
    - Publicly live; Unity PDF says POS processes ₹27,000 crore annually on 125,000+ machines
    - Medium
    - Separate hardware revenue, rental income, servicing cost, and device attach rates
  - - Consumer financial services
    - Credit card, bill payment, personal loans, and consumer app monetization
    - User / card / loan
    - Products are live, but revenue contribution is not public
