      - number: '4.2'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The turnaround looks financially meaningful, but the quality of the improvement still needs careful
              handling. BharatPe moved from a visibly lossmaking FY24 baseline into an FY25 year that multiple sources
              describe as adjusted-profit positive. Yet the metrics are definition-sensitive. Net loss is still about
              ₹88 crore, adjusted PBT is reported at ₹6 crore, ex-ESOP EBITDA is reported around ₹141 crore, and
              Entrackr separately shows an even narrower reported EBITDA of ₹47 crore alongside adjusted EBITDA of
              ₹195.5 crore. That is not a contradiction so much as a disclosure warning: profit headlines change
              materially depending on which adjustments are stripped out. Cost detail supports both the positive and the
              cautionary case. Processing costs of roughly ₹391 crore, employee benefits around ₹360 crore, and
              drastically lower advertising expense show discipline. But Angel One also reports a sharp jump in
              financial-guarantee costs, exactly the kind of signal that can matter when growth increasingly leans on
              lending and credit-linked products. Public data is therefore enough to say BharatPe is no longer a
              runaway-burn story, but not enough to claim clean steady-state margins or normalized unit economics by
