      - number: '1.4'
        title: Regulated Partnerships, Technology Signals, and Open Items
        blocks:
          - type: paragraph
            body: >-
              BharatPe’s current model still depends on partnerships in areas where a pure payments brand cannot
              self-supply a regulated balance sheet. The Unity Small Finance Bank credit-card materials show BharatPe
              distributing regulated credit alongside a partner bank and explicitly identify Resilient Innovations as
              the core entity behind the brand. That matters because later lending and credit claims should be read as
              ecosystem capabilities, not proof of a BharatPe-owned bank charter. The technology signal is more credible
              than the governance disclosure. BharatPe Tech says the company has more than 200 engineers, while
              Coralogix’s case study describes a migration away from an in-house Elasticsearch observability stack as
              transaction and merchant volumes grew. Those sources support the view that BharatPe now operates with real
              platform scale and non-trivial infrastructure complexity. The main diligence gaps are elsewhere: current
              board composition is not transparently published, funding totals differ depending on whether debt is
              included, and the company still does not publicly separate registered merchants from active monthly
              merchants.
