  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Merchant Scale, and Product Stack
        blocks:
          - type: paragraph
            body: >-
              BharatPe today presents itself as a merchant-first payments and financial-services platform that has
              expanded into a broader two-sided fintech stack. The clearest current ground-truth comes from the official
              homepage and adjacent official surfaces: the company says it serves more than 17 million merchant
              partners, operates across 450-plus cities, has processed more than Rs 1,700 billion of payment TPV, and
              has facilitated more than Rs 14,600 crore of business loans. Those same surfaces also show that BharatPe
              is not just one QR product. The live portfolio spans BharatPe QR, BharatPe One, BharatPe Swipe, BharatPe
              Speaker, BharatPe UPI, credit-card bill payments, utility bill payments, and personal-loan/card products.
              Inc42’s 2026 company profile and Unity Bank’s partner materials both anchor the legal entity around
              Resilient Innovations and the 2018 founding year. Taken together, the evidence supports describing
              BharatPe as a scaled Indian merchant-payments platform that has deliberately extended from offline UPI
              acceptance into POS devices, lending distribution, and consumer-side payment utilities.
