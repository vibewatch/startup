  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Governance, legal, and regulatory overhang
        blocks:
          - type: paragraph
            body: >-
              BharatPe is no longer in the acute phase of its founder crisis, but it is also not fully past it. The
              strongest public evidence says the Grover conflict ended through settlement and withdrawal, not through a
              merits finding that would conclusively validate one side’s allegations. That matters because the company
              can legitimately say the dispute is behind it operationally, while investors still have to accept a proof
              gap on the underlying facts. The risk has narrowed from active litigation into a residual credibility and
              diligence problem. RBI final authorisation for BharatPe X is a real positive because it reduces binary
              licensing risk and signals better operating discipline than in the crisis years. At the same time,
              RBI-regulated scale does not erase governance history; it simply raises the standard BharatPe must now
              keep meeting as it expands into more tightly supervised payment and credit surfaces. That means fresh
              underwriting should focus less on whether BharatPe can tell a recovery story and more on whether that
              story now survives regulator, customer, and partner scrutiny at the same time.
            claimRefs:
