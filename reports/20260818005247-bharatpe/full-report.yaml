            body: >-
              The public record supports a more specific operating model than generic fintech marketing usually allows.
              BharatPe One coverage shows the field endpoint layer: Android-based devices, QR, card acceptance,
              speakers, connectivity, and transaction dashboards at the merchant edge. The App Store listing shows the
              consumer layer: UPI, bill payments, loans, credit-card-on-UPI, rewards, and permissions tied to NPCI-style
