  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Valuation anchor and evidence quality
        blocks:
          - type: paragraph
            body: >-
              BharatPe’s valuation discussion starts from a real, recent transaction rather than a stale headline: a
              secondary deal reported at $2.85 billion. That is a meaningful advantage in diligence because it gives
              investors an actual market-clearing reference point. But the quality of that reference still has limits.
              The transaction appears to confirm stability, not rerating, and it happened alongside a narrative of
              governance clean-up, improving profitability, and pre-IPO positioning. In other words, the mark is
              credible but not automatically cheap. FY25 financial improvement clearly helps, especially the jump to
              ₹1,667 crore of operating revenue and sharply narrower losses. Yet the key question is whether that
              improvement deserves a premium multiple or merely preserves the old unicorn mark. The evidence today
              supports the latter interpretation more strongly than the former: BharatPe looks stabilized and
              investable, but not obviously underpriced on public information alone. Investors are paying for a cleaner
              story before they have a truly complete proof pack.
            claimRefs:
              - CV001
              - CV002
              - CV003
