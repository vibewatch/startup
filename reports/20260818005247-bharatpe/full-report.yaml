      - number: '2.3'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The buyer is not uniform across BharatPe’s market. For the smallest offline merchants, the economic buyer
              is usually the proprietor choosing the easiest route to accept digital payments. The day-to-day user may
              be the merchant, a cashier, or a family member managing collections. As merchant sophistication rises,
              finance and operations owners start to care more about settlement, dashboard quality, support, and
              reconciliation. BharatPe’s own mix suggests an adoption path that starts with payment acceptance and then
              tries to expand into devices, loans, cards, and consumer-linked engagement. The company’s merchant and
              consumer surfaces, together with the Unity card partnership, support this interpretation: BharatPe is
              trying to turn one payments touchpoint into a broader operating relationship. That makes buyer expansion
              critical. The platform is strongest when the merchant wants fewer vendors and some access to credit, not
              when the merchant only needs the lowest-cost QR sticker.
