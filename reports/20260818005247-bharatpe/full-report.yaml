      - number: '7.3'
        title: Partner, credit, and model dependence
        blocks:
          - type: paragraph
            body: >-
              BharatPe’s model increasingly looks like an orchestration business: it sits between merchants, consumers,
              partner banks, NBFCs, network rails, and now RBI-regulated payment-aggregator infrastructure. That creates
              breadth, but also multiple failure points. Public sources make clear that lending depends on financial
              partners, refunds depend on acquiring banks and networks, and the infrastructure story is intertwined with
              Unity SFB and BharatPe’s TSP role. Even the revenue model increases concentration risk because
              merchant-side monetisation still appears to drive most of the economics. The result is that BharatPe’s
              strongest growth loops also create the sharpest downside transmission. If support quality weakens, partner
              relationships wobble, or credit economics disappoint, the effects can hit adoption, monetisation, and
              valuation together. What the public record still does not reveal is concentration by partner, geography,
              loan vintage, or product cohort, which keeps this risk bucket only partially measurable.
            claimRefs:
