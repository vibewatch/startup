            body: >-
              The financial verdict is constructive but not clean. BharatPe clearly achieved a real operating reset
              between FY24 and FY25: revenue rose again, net loss narrowed sharply, adjusted profitability turned
              positive, and external investors were still willing to price the company at around $2.85 billion in
              secondary trading. That is the strongest version of the story and it is well supported. The weaker version
              is about disclosure quality. Public sources still do not reconcile total funding cleanly, do not disclose
              monthly burn or runway, do not give realized take rates by payment rail, and do not show product-level
