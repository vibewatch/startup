      - number: '7.2'
        title: Operational, customer, and compliance risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk is unusually important for BharatPe because the product promise is convenience and speed,
              but the company’s own legal documents leave room for delays, manual intervention, and third-party
              bottlenecks. Public grievance pages promise ten-business-day complaint handling, yet the same materials
              warn that banks, networks, regulators, and system failures can extend refunds or resolution. That gap
              between stated intent and admitted process complexity matters more in a zero-MDR, highly substitutable UPI
              market than it would in a sticky enterprise software business. Customer-proof sources add enough adverse
              evidence to treat this as more than noise: withheld funds, delayed bill-pay resolution, and glitch
              complaints appear often enough to remain on the risk register. The privacy layer also deserves attention.
              BharatPe’s public policies show a broad data-collection and data-sharing surface, while third-party policy
              reviewers still see middling readiness rather than best-in-class transparency.
