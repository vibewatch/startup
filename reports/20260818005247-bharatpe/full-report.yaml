  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              BharatPe’s addressable market is broader than UPI QR acceptance, but narrower than the entire Indian
              payments system. The company is most relevant where merchants need an operating bundle that combines QR
              collections, card acceptance, simple device deployment, reconciliation, and access to adjacent credit or
              loyalty products. Official BharatPe surfaces and the Unity partnership evidence show that the platform’s
              economic logic sits at the merchant workflow layer, not at the level of national payment rails. That
              distinction matters because India’s payment-system numbers are huge, but much of that value sits in RTGS,
              NEFT, or other flows that BharatPe does not directly monetise. The practical substitutes are also
              fragmented. Merchants can keep using bank QR solutions, a single-function gateway, a POS specialist, or
              even cash-heavy workflows in smaller formats. BharatPe wins only when the pain point spans more than one
              workflow and when merchant convenience or working-capital access matters enough to justify a platform
              relationship.
            claimRefs:
              - CM009
              - CM010
              - CM022
              - CM024
              - CM037
