  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The current call flows from a real valuation anchor plus improving economics, offset by risk and disclosure
      discounts.
    data:
      nodes:
        - id: anchor
          label: Real secondary anchor
          description: $2.85B transaction confirms a live private mark.
        - id: econ
          label: Better FY25 economics
          description: Revenue up and losses much narrower.
        - id: risk
          label: Residual discounts
          description: Governance, credit, partner, and customer-friction risk remain.
        - id: comp
          label: Public comp discipline
          description: Paytm, Pine Labs, and MobiKwik keep multiples grounded.
        - id: view
          label: Track / stretched
          description: Reasonable company, but not yet a clear buy at the current mark.
      edges:
        - to: view
          label: supports floor
          from: anchor
        - to: view
          label: supports upside
          from: econ
        - to: view
          label: caps multiple
          from: risk
        - to: view
          label: sets corridor
          from: comp
