            body: >-
              BharatPe’s financial model is broader than a simple QR-acquiring story, but the public record shows that
              the revenue engines are uneven in quality. The homepage still leads with scale and merchant utility:
              payments TPV, a large merchant base, free QR acceptance, device products, and business-loan facilitation.
