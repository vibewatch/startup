      - number: '1.2'
        title: Leadership Reset and Governance History
        blocks:
          - type: paragraph
            body: >-
              The company overview cannot be separated from the governance reset that followed the Ashneer Grover era.
              Reuters reported Grover’s March 2022 resignation as managing director and board director after a very
              public dispute with Kotak Mahindra Bank, and a second Reuters dispatch in May 2022 said BharatPe planned a
              governance overhaul and employee dismissals after investor and media scrutiny intensified. Current
              management has worked to move the story forward. Hindustan Times and The Economic Times both reported that
              BharatPe made Nalin Negi its permanent CEO in April 2024 after he had already served as CFO and interim
              CEO following Suhail Sameer’s January 2023 exit. Negi’s own public framing is important: he emphasised
              sustained profitability, scaling lending, and new merchant-centric products rather than a return to
              headline growth at any cost. The upshot is that BharatPe now has a clearer operating leader, but the
              public record is still much stronger on executive narrative than on full statutory board composition,
              committees, or control rights.
            claimRefs:
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
              - CO015
