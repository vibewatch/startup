              BharatPe’s customer picture is broader than a single merchant count implies. The public surfaces and
              review platforms together show at least five distinct customer groupings: offline micro-merchants using QR
              and devices, somewhat larger offline SMBs using richer payment hardware, consumers using the BharatPe app
              for UPI and bill pay, credit-seeking merchants borrowing through BharatPe-linked channels, and newer
              enterprise-style payment clients targeted by BharatPeX. The headline adoption proof is strong on breadth.
              BharatPe’s homepage says 17+ million merchant partners across 450+ cities, and ANI repeated the 1.7 crore
              scale in March 2026. Older but still useful partner documentation from Unity shows how the scale story has
              progressed over time, with far smaller historic merchant counts but similar geographic ambition. That
              means the top-line story is not whether BharatPe reached scale; it is how much of that scale is active,
