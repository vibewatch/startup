  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      BharatPe’s most material residual risks cluster around governance legacy, partner dependence, customer friction,
      and compliance execution.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Governance legacy
          values:
            - label: medium
              tone: warning
              detail: Acute phase ended but proof gap remains
            - label: high
              tone: negative
              detail: Can affect fundraising and trust
            - label: medium
              tone: neutral
              detail: Governance reset visible
            - label: high
              tone: negative
              detail: Still central diligence theme
        - label: PA / regulatory execution
          values:
