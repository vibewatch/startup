  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product map and customer jobs
        blocks:
          - type: paragraph
            body: >-
              BharatPe’s product surface is unusually broad for a company still publicly associated with QR stickers.
              The retained official and marketplace surfaces show two overlapping product families. One is
              merchant-first: QR acceptance, card or POS devices, speakers, and now BharatPe One as a bundled hardware
              endpoint. The second is broader consumer and financial utility: BharatPe UPI, bill pay, credit-card bill
              payment, loans, investments, and a RuPay-linked EMI card. In practice, these are not separate worlds. The
              merchant stack acquires transaction intent cheaply, while the consumer and credit surfaces try to increase
              wallet share and monetization depth. That makes BharatPe less like a single-SKU payment tool and more like
              a workflow platform that starts with offline acceptance and then branches into adjacent financial tasks.
              The key point for diligence is that the product map is now coherent enough to describe by user job: accept
              money, confirm payment, reconcile activity, access credit, pay bills, and increasingly run online or
              in-app UPI experiences through BharatPeX.
