      - number: '3.4'
        title: Moat Durability and Adverse Evidence
        blocks:
          - type: paragraph
            body: >-
              The adverse evidence does not say BharatPe is weak; it says the moat is conditional. The company still has
              a credible merchant-first brand, a large public merchant count, and credit adjacency that can matter for
              offline SMEs. But PhonePe is adding card-enabled hardware to its QR base, Paytm’s merchant platform is
              scaling across online and offline, Razorpay offers a visibly wider product surface, and global processors
              dominate the high end of trust and cross-border reach. Public sources do not show a single BharatPe
              capability that peers cannot plausibly copy. They also do not show realized pricing, merchant churn, or
              win-loss data that would prove hidden lock-in. The best competitive case for BharatPe is therefore not a
              hard moat but a strong positioning fit in a specific customer slice: offline merchants that value one
              India-centric relationship across acceptance, devices, and partner-linked finance. That fit can still
              matter commercially, but it is a segment advantage rather than proof of an unassailable category lead
              today, either. and the public record does not yet show that it survives once merchants begin to demand
              broader reconciliation, recurring billing, or cross-border capabilities.
            claimRefs:
              - CP021
              - CP029
              - CP030
              - CP032
              - CP033
              - CP034
              - CP035
              - CP037
