      - number: '8.3'
        title: Scenario underwriting and recommendation
        blocks:
          - type: paragraph
            body: >-
              The bull case for BharatPe is not hard to imagine. Profitability has improved, regulatory readiness has
              strengthened, and the company still has multiple ways to monetise merchant relationships through payments,
              devices, lending, and now payment aggregation. The problem is that the current mark already gives
              meaningful credit for that upside. A base-case investor therefore has to ask what is left to win from here
              without a material disclosure upgrade or another step-change in economics. The answer is: some upside
              remains, but not enough to justify a clean buy on public evidence. The bear case is also tangible. If the
              market starts valuing BharatPe more like a public fintech with governance baggage, service-risk leakage,
              and credit opacity, the fair value range can fall meaningfully below the secondary mark. That is why the
              correct call today is track, with medium confidence and a stretched valuation stance. A buy case would
              need either a lower entry price or materially better evidence.
