      - number: '8.2'
        title: Comparable set and multiple compression
        blocks:
          - type: paragraph
            body: >-
              The comparable set matters because BharatPe now sits between two very different valuation worlds. At the
              upper end, PhonePe shows what a category-defining Indian payments platform can command: far more revenue,
              much higher UPI share, and a still-healthy private valuation range despite IPO timing risk. At the
              public-comp end, Paytm, Pine Labs, and MobiKwik demonstrate that Indian fintech multiples can compress
              quickly once disclosure is deeper and investors focus on durable profitability rather than broad ecosystem
              narratives. BharatPe screens better than the weakest public comp set on growth and strategic scope, but it
              does not screen cheap versus those same companies once its implied revenue multiple is considered. That
              tension is the central valuation fact: BharatPe deserves a premium to smaller or weaker peers, yet the
              current mark already asks investors to underwrite above-average execution, not merely average
              continuation. In practical terms, the multiple already assumes the next stage of proof arrives on
              schedule.
