      - number: '2.2'
        title: Market Size and Infrastructure
        blocks:
          - type: paragraph
            body: >-
              India’s digital-payments base is enormous, but the distribution of economic value across rails is uneven.
              RBI’s December 2025 Payment Systems Report says total payment transactions reached 26,819 crore in CY2025
              with value of Rs 3,215 lakh crore, while digital payments accounted for 99.8% of volume and 97.8% of
              value. UPI is the dominant retail rail by usage: in H2 CY2025 it represented 85.5% of transaction volume,
              yet only 9.5% of transaction value. UPI transactions grew from 3,873 crore in CY2021 to 22,828 crore in
              CY2025, while value rose from Rs 72 lakh crore to Rs 300 lakh crore and average ticket size fell to Rs
              1,313. Acceptance infrastructure tells the more BharatPe-relevant story. By end-2025 RBI recorded 7,313.65
              lakh UPI QR codes versus only 114.75 lakh POS terminals. That gap explains why low-cost QR-led merchant
              acquisition has become structurally more important than hardware-first deployment in India.
            claimRefs:
