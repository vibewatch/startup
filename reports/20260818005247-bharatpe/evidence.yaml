evidenceGaps:
  - type: missing-source
    severity: material
    topic: board-structure
    missingEvidence: A current official board-and-committee roster naming directors, committee charters, and control rights.
    whyItMatters: >-
      The public evidence is adequate on the CEO transition but weak on durable governance architecture after the
      founder crisis.
    diligencePath: Request the latest board pack, committee charters, and current MCA-derived director list from management.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding-reconciliation
    missingEvidence: >-
      A reconciled lifetime funding schedule splitting equity, venture debt, structured facilities, and secondary
      transactions.
    whyItMatters: >-
      Public databases and news reports diverge materially on how much capital BharatPe has raised and what counts as
      funding versus secondary liquidity.
    diligencePath: >-
      Obtain the cap table, financing timeline, debt schedule, and latest shareholder register from the company and
      investors.
    relatedQuestionRefs:
      - QO020
      - QO026
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: merchant-definition
    missingEvidence: A management definition of active, transacting, and registered merchants with cohort and geography breakouts.
    whyItMatters: >-
      Headline merchant counts are useful for scale signalling but not sufficient for underwriting retention,
      monetisation, or sales efficiency.
    diligencePath: Ask for monthly active merchants, transacting merchants, and cohort retention by city tier and product.
    relatedQuestionRefs:
      - QO027
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: active-merchant-share
    missingEvidence: >-
      A public or management-verified count of BharatPe active monthly merchants, transacting merchants, and
      payment-share inside offline UPI acceptance.
    whyItMatters: >-
      Registered merchant counts are directionally useful but do not reveal real market share, cohort quality, or
      monetisation power.
    diligencePath: Request active merchant counts, monthly transacting cohorts, and offline UPI share by city tier from management.
    relatedQuestionRefs:
      - QM024
      - QM026
  - type: private-evidence-only
    severity: material
    topic: segment-unit-economics
    missingEvidence: >-
      Take rates, device economics, support costs, and contribution margins by QR, card POS, lending, and partner-bank
      products.
    whyItMatters: The market is large, but valuation and profitability depend on where BharatPe actually earns durable margins.
    diligencePath: Ask for segment P&Ls, blended MDR by rail, device attach economics, and partner-bank revenue shares.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM004
  - type: stale
    severity: minor
    topic: sizing-precision
    missingEvidence: >-
      A cleaner public SAM estimate for the merchant-acquiring layer that excludes wholesale payment rails and
      non-monetised consumer flows.
    whyItMatters: Available sources are excellent on macro infrastructure and weak on the exact monetisable wedge.
    diligencePath: Build a bottom-up SAM from active merchants, average GPV, product attach rates, and take rates.
    relatedQuestionRefs:
      - QM023
  - type: missing-source
    severity: material
    topic: switching-and-churn
    missingEvidence: >-
      Merchant win-loss, switching, churn, or multi-homing data across BharatPe, PhonePe, Paytm, Razorpay, and Pine
      Labs.
    whyItMatters: >-
      Public marketing surfaces show overlap, but they do not prove whether merchants actually switch or stay once
      multiple products are live.
    diligencePath: Request cohort retention, win-loss notes, and competitive-displacement data by merchant segment.
    relatedQuestionRefs:
      - QP020
      - QP024
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Negotiated MDRs, device subsidies, partner-bank economics, and attach-rate revenue by competitor and segment.
    whyItMatters: List pages and marketing claims are not enough to judge real pricing power or gross-margin durability.
    diligencePath: Collect merchant contracts, realised take rates, and device economics across representative cohorts.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: stale
    severity: minor
    topic: future-entrants
    missingEvidence: >-
      A clearer public view on whether banks, super-apps, or other fintechs are preparing new merchant-acquiring pushes
      in 2026-2027.
    whyItMatters: >-
      Current peers are visible, but the next wave of entrant pressure may come from adjacent classes rather than
      today’s named rivals.
    diligencePath: Monitor RBI authorisation updates, bank launches, and merchant-acquiring announcements over the next 12 months.
    relatedQuestionRefs:
      - QP026
  - type: missing-source
    severity: material
    topic: monthly-burn-and-runway
    missingEvidence: >-
      Public sources do not disclose BharatPe’s monthly burn, runway, cash-consumption cadence, or downside liquidity
      scenarios.
    whyItMatters: >-
      Visible cash and current-assets figures cannot be turned into a reliable financing-risk view without burn and
      runway data.
    diligencePath: >-
      Request monthly cash-flow statements, board cash dashboards, budget-versus-actuals, and base/downside runway
      cases.
    relatedQuestionRefs:
      - QI017
      - QI023
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: realized-unit-economics-and-credit-quality
    missingEvidence: >-
      Realized take rates by rail, device contribution margins, loan-loss vintages, NPA ratios, guarantee economics, and
