- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Free payments into lending and cards
    - Low switching costs in zero-MDR UPI
    - Could weaken monetized retention if credit attach is low
    - Request attach rates from payments into lending/cards
  - - Tier-2 / tier-3 merchant expansion
    - Partner-bank and regulatory dependence
    - Growth may depend on RBI, banks, and field support execution
    - Review partner concentration and city-level onboarding economics
  - - Consumer-to-merchant cross engagement
    - Weak proof of durable repeat behaviour
    - Rewards may raise activity without improving loyalty
    - Request repeat-payer, repeat-bill-pay, and rewards-redemption cohorts
  - - Enterprise / BharatPeX expansion
    - Named live customer proof still thin
    - Hard to underwrite the enterprise motion
    - Request live client list, TPV, and churn data
  - - Jar / Unity-style platform dependence
    - Channel concentration not quantified
    - A few successful partners could mask concentrated exposure
    - Map partner TPV, rev share, and concentration by account
  notes: Expansion logic is visible, but public materials still do not quantify which loops produce durable high-value customers.
