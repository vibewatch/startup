  rows:
  - - Micro merchant / kirana
    - Owner / cashier / merchant
    - QR acceptance and daily collections
    - Very large; core BharatPe base
    - Acquisition wedge for all other products
    - Active and paying-merchant ratio unknown
  - - Offline SMB / local chain
    - Owner or ops lead / store staff / merchant
    - QR plus card, device, speaker
    - Material but undisclosed
    - Higher attach-potential for devices and credit
    - No segment revenue split
  - - Consumer app user
    - Consumer / consumer / consumer
    - UPI, bills, rewards, loans, cards
    - Large rating base, but MAU undisclosed
    - Cross-engagement and brand extension
    - No active-user or cohort data
  - - Credit-seeking merchant
    - Owner / owner / merchant
    - Working-capital or merchant lending
    - Material by revenue signals
    - Higher monetization via lending
    - NPA and repeat-borrower data undisclosed
  - - Enterprise / fintech client
    - Payment team / operations / enterprise
    - BharatPeX and in-app UPI workflows
    - Early and not quantified
    - Potentially higher-value expansion path
    - No named live customer list
  notes: Segments reflect observable user and buyer patterns, not a full internal CRM taxonomy.
