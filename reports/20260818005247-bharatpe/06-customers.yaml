- id: expansion-loops-and-concentration-risks
  title: Expansion loops and concentration risks
  body: 'The expansion case for BharatPe is credible, but concentration is still opaque. Public evidence suggests a classic land-and-expand motion: acquire merchants with free payments, deepen the relationship with devices, then add loans, cards, investments, consumer app services, or even enterprise payment workflows. Geography matters too. ET BFSI and CNBC both say BharatPeX will deepen presence in tier-2 and tier-3 markets, while older consumer-app launch commentary explicitly framed the next UPI wave as coming from “Bharat.” These are sensible expansion vectors, and they fit the company’s historical merchant-first strategy. The harder problem is concentration and dependence, especially once growth claims are translated into actual recurring revenue quality. Public sources do not reveal top-customer exposure, channel concentration, or contract economics. They do, however, show dependence on partners and platforms such as Unity, bank coordination, RBI approvals, app stores, and third-party
    infrastructure relationships. The result is an asymmetric picture: expansion logic is visible, but concentration and dependency risk are not sufficiently quantified in public materials.'
