- id: retention-satisfaction-and-complaint-patterns
  title: Retention, satisfaction, and complaint patterns
  body: 'The retention story is the weakest part of BharatPe’s customer evidence. Public sources do not provide NRR, GRR, renewal rates, cohort retention, or contract lengths. What they do provide is a mixed satisfaction picture. The App Store’s 3.9 rating on a large review base is directionally positive, and G2 or GetApp show users who appreciate convenience, QR acceptance, and credit access. But these do not prove durability. The same sources also surface recurring issues: pending bill payments, poor waiver handling, aggressive collections, delayed credits, glitches, slow support, and regional limitations. ConsumerComplaints.in is even harsher, showing merchants alleging blocked settlements, withheld POS funds, unresolved swipe-device errors, and speaker refund disputes. These are not enough to quantify churn, but they are enough to say customer experience risk exists alongside scale. BharatPe looks widely adopted, yet still vulnerable to service-quality friction that could matter disproportionately
    in a low-switching-cost ecosystem.'
  claimRefs:
