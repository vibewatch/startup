- id: TU006
  title: Customer friction evidence table
  columns:
  - Friction type
  - Public evidence
  - Segment affected
  - Why it matters
  - Diligence ask
  rows:
  - - Blocked settlements / withheld funds
    - Repeated complaint-portal cases
    - Merchants
    - Directly threatens trust and merchant continuity
    - Provide settlement-block policy, appeal times, and false-positive rates
  - - Delayed or failed bill payments
    - App Store complaints
    - Consumers
    - Can damage repeat usage in bill-pay flows
    - Provide pending-payment and refund-resolution SLA data
  - - Aggressive collections / waiver disputes
    - App Store complaints
    - Consumer credit users
    - Raises support and reputation risk in lending products
    - Audit collection scripts and grievance-resolution metrics
  - - Technical glitches / downtime
    - G2 review evidence
    - Merchants and app users
    - Low switching costs make reliability issues more costly
    - Provide incident frequency and uptime history
  - - Weak customer support responsiveness
    - G2, Software Advice, ConsumerComplaints
    - All segments
    - Support quality can erase adoption gains
    - Provide first-response and resolution-time metrics
  notes: The table intentionally captures adverse evidence because customer durability cannot be judged from growth claims alone.
