- id: proof-of-real-usage-and-customer-workflows
  title: Proof of real usage and customer workflows
  body: 'The customer proof in retained sources is more substantial than simple logo pages, but it is uneven. The most concrete evidence comes from active-use narratives. App-store listings and reviews describe real bill-payment, QR, loan, and rewards usage; G2 users describe everyday small-business payment and credit workflows; and complaint-portal posts describe live settlement and swipe-machine issues rather than hypothetical product tests. Those are all production-like signals. Super Over adds a lighter but still useful loyalty proof: merchants and consumers transacted to earn Zillion Coins, and the company framed the campaign as engagement with a live community rather than pure awareness marketing. Meanwhile, enterprise or platform proof is still early: BharatPeX is clearly aimed at ecommerce, fintech, and enterprise customers, and Jar’s use of the Unity-PSP plus BharatPe-TSP setup shows at least one concrete partner-linked deployment path. Overall, the evidence supports real usage
    across segments, but stronger named production case studies and quantified outcomes remain limited.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU017
  - CU018
  - CU029
