- id: capability-and-pricing-overlap
  title: Capability and Pricing Overlap
  body: The retained competitor surfaces show that product overlap is now material. PhonePe combines QR, gateway, recurring payments, and SmartPOD hardware. Paytm sells gateway acceptance, financing-linked features, and merchant devices at massive scale. Razorpay is even broader, with 100-plus payment methods, recurring billing, POS, and RazorpayX banking workflows. Pine Labs still matters for hardware and omnichannel infrastructure, while PayU and CCAvenue remain viable checkout incumbents. Public pricing is also less opaque than it used to be. PhonePe explicitly says there are no setup fees or hidden charges, and Stripe keeps a simple public commercial posture for global payment services. BharatPe’s challenge is that many merchants will compare not just product feature checklists but how easy it is to get started, how transparent pricing looks, and whether a competing platform already solves more than one workflow in the same relationship.
