chapter:
  number: 3
  title: Competitors
  summary: 'BharatPe competes from a credible offline-merchant and credit-adjacent position, but the field is crowded and converging. The strongest adverse evidence is distribution: PhonePe and Paytm disclose much larger merchant footprints, Razorpay shows the broadest workflow stack, and global processors dominate the high end of trust and cross-border capability.'
sections:
- id: landscape-and-competitor-classes
  title: Landscape and Competitor Classes
  body: 'BharatPe does not compete in a single clean category. Its actual overlap spans merchant QR acceptance, device-led card acceptance, partner-linked credit, and simple merchant-finance workflows. That means the rival set includes direct merchant-fintech peers such as PhonePe and Paytm, broader Indian payment stacks such as Razorpay and PayU, device and omnichannel players such as Pine Labs, older gateway incumbents such as CCAvenue, adjacent wallet-led players such as MobiKwik, and global processors such as Adyen, Stripe, and PayPal when merchants need export or enterprise functionality. The status quo option also matters: many small Indian merchants can still solve the problem with a bank QR, a single device partner, or a patchwork of tools rather than one platform. BharatPe’s competitive question is therefore not whether one rival replaces it everywhere; it is whether merchant buyers can assemble equivalent capabilities from better-distributed or better-priced alternatives.'
