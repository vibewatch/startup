- id: distribution-power-switching-and-lock-in
  title: Distribution Power, Switching, and Lock-In
  body: Distribution power is not evenly distributed across this field. PhonePe and Paytm disclose merchant networks that are materially larger than BharatPe’s public 17 million figure, and those scale claims matter because payment products often spread by trust, habit, and default app presence rather than by differentiated APIs alone. BharatPe still has meaningful offline-SME relevance, but the evidence does not suggest structurally high switching costs at the low end. QR acceptance is cheap to adopt, competing devices increasingly bundle similar capabilities, and multi-homing is a plausible merchant behaviour where one provider is used for QR, another for cards, and another for credit. Lock-in improves only when the merchant uses more workflows—reconciliation, device management, recurring payments, or partner-bank credit—inside the same stack. That favors breadth players and better-distributed consumer brands, not just early offline merchant footholds.
  claimRefs:
  - CP004
  - CP005
