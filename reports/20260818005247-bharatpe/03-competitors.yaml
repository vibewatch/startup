callouts:
- calloutType: risk
  title: PhonePe and Paytm are the most direct distribution threats
  body: Both companies disclose much larger merchant footprints than BharatPe and are pushing deeper into the same offline-merchant upgrade path via devices, gateway features, and consumer-linked ecosystem leverage. That is the clearest adverse evidence against a simple BharatPe scale moat.
  claimRefs:
  - CP004
  - CP007
  - CP008
  - CP024
  - CP029
- calloutType: strength
  title: BharatPe still has a credible fit in offline SMEs that want one India-centric relationship
  body: The retained evidence still supports a real BharatPe value proposition for smaller merchants that want QR acceptance, device-led card acceptance, and partner-linked finance in one relationship. The issue is not relevance; it is how durable that fit remains once better-distributed peers converge on the same offer.
  claimRefs:
  - CP001
  - CP021
  - CP035
