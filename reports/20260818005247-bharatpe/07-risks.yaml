chapter:
  number: 7
  title: Risks
  summary: BharatPe’s residual risk profile is no longer dominated by immediate survival questions; it is dominated by proof questions. The biggest issues are the incomplete evidentiary closure of the governance saga, the heavier compliance burden that comes with RBI-authorised expansion, the partner-heavy architecture of lending and payments, and recurring customer-friction signals in a low-switching-cost market. Mitigations are real, but they are not yet enough to call the risk stack clean.
sections:
- id: governance-legal-and-regulatory-overhang
  title: Governance, legal, and regulatory overhang
  body: BharatPe is no longer in the acute phase of its founder crisis, but it is also not fully past it. The strongest public evidence says the Grover conflict ended through settlement and withdrawal, not through a merits finding that would conclusively validate one side’s allegations. That matters because the company can legitimately say the dispute is behind it operationally, while investors still have to accept a proof gap on the underlying facts. The risk has narrowed from active litigation into a residual credibility and diligence problem. RBI final authorisation for BharatPe X is a real positive because it reduces binary licensing risk and signals better operating discipline than in the crisis years. At the same time, RBI-regulated scale does not erase governance history; it simply raises the standard BharatPe must now keep meeting as it expands into more tightly supervised payment and credit surfaces. That means fresh underwriting should focus less on whether BharatPe can tell a
    recovery story and more on whether that story now survives regulator, customer, and partner scrutiny at the same time.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR006
  - CR007
  - CR008
  - CR030
  - CR036
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: operational-customer-and-compliance-risks
  title: Operational, customer, and compliance risks
  body: 'Operational risk is unusually important for BharatPe because the product promise is convenience and speed, but the company’s own legal documents leave room for delays, manual intervention, and third-party bottlenecks. Public grievance pages promise ten-business-day complaint handling, yet the same materials warn that banks, networks, regulators, and system failures can extend refunds or resolution. That gap between stated intent and admitted process complexity matters more in a zero-MDR, highly substitutable UPI market than it would in a sticky enterprise software business. Customer-proof sources add enough adverse evidence to treat this as more than noise: withheld funds, delayed bill-pay resolution, and glitch complaints appear often enough to remain on the risk register. The privacy layer also deserves attention. BharatPe’s public policies show a broad data-collection and data-sharing surface, while third-party policy reviewers still see middling readiness rather than best-in-class
    transparency.'
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
