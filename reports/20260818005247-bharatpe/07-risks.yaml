- id: people-execution-and-kill-criteria
  title: People, execution, and kill criteria
  body: 'The remaining question for BharatPe is not whether management can tell a turnaround story; it is whether management can prove durable control over a more complex company. Leadership messaging, RBI approval, and a visible grievance structure are all useful mitigations, but they do not eliminate the need for hard monitoring. Investors should watch for evidence that governance clean-up becomes measurable governance proof: stable regulator relationships, no new public legal flare-ups, improving complaint-resolution outcomes, and cleaner disclosure on credit quality and partner concentration. The risk to underwrite is not simply another scandal. It is more subtle: product sprawl, ecosystem dependence, and service friction could keep BharatPe looking strategically ambitious while muting conversion of scale into resilient economics. That is why the most important diligence asks now are operational dashboards, partner-exposure maps, and evidence that customer trust improves faster than
    complexity rises. Investors should also demand quarterly proof that control depth is growing faster than product breadth.'
  claimRefs:
  - CR031
  - CR037
  - CR038
  - CR039
  - CR041
  - CR042
