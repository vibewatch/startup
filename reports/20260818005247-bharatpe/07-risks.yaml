- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Governance re-escalation
    - New public litigation, regulator notice, or board-level dispute
    - Any material new case tied to control failure
    - Pause upside underwriting until scope and root cause are clear
  - - Customer-service deterioration
    - Complaint backlog, SLA miss, or withheld-fund escalation
    - Sustained misses versus 10-business-day promise or repeated high-severity cases
    - Cut confidence in retention and merchant-quality assumptions
  - - Partner concentration shock
    - Loss or weakening of a major bank / NBFC / rail relationship
    - Any partner disruption affecting lending, refunds, or settlement quality
    - Rework base-case growth and operational-risk assumptions
  - - Credit underperformance
    - Worsening vintages or NPA disclosures once provided
    - Meaningful deterioration in repeat-borrower or loss metrics
    - Apply larger governance and credit discount to valuation
  - - PA / compliance strain
    - RBI or payments-control remediation request
    - Any formal remediation, onboarding pause, or adverse supervisory signal
    - Shift case from execution story to compliance-repair story
  - - Product-sprawl execution miss
    - Low attach, weak retention, or stalled monetisation from new surfaces
    - Cross-sell fails to offset support and complexity burden
    - Treat breadth as cost center rather than moat
  notes: Kill criteria are written so they can be checked in follow-up diligence rather than debated abstractly.
