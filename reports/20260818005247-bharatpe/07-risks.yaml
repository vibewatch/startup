  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-proof-and-settlement-economics
    missingEvidence: Public sources do not disclose the full settlement documents, exact economic split between trusts, board remediation scorecards, or all post-settlement governance controls.
    whyItMatters: Investors can see legal closure but cannot fully test whether governance repair is cosmetic or durable.
    diligencePath: Request settlement documents, board committee minutes, procurement-control changes, and post-2024 internal audit outputs.
    relatedQuestionRefs:
    - QR005
    - QR025
    - QR030
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: operational-sla-and-incident-history
    missingEvidence: Public materials do not disclose complaint volumes, achieved SLAs, false-positive settlement-block rates, uptime histories, or incident postmortems.
    whyItMatters: Operational friction may be an isolated symptom or a structural retention risk; without dashboards, outside observers cannot tell.
    diligencePath: Review monthly complaint dashboards, ticket aging, incident logs, refund aging buckets, and ombudsman escalations by product.
    relatedQuestionRefs:
    - QR022
    - QR026
    - QR027
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-and-credit-concentration
    missingEvidence: Public sources do not quantify partner concentration by TPV, revenue, geography, or lender, and they do not disclose loan-vintage, NPA, or repeat-borrower performance metrics.
    whyItMatters: The company’s biggest model risk sits at the intersection of partner dependence and credit opacity, yet both are only partially visible publicly.
    diligencePath: Request lender-wise and partner-wise TPV/revenue, top-partner concentration, delinquency ladders, vintage curves, and repeat-borrower cohorts.
    relatedQuestionRefs:
    - QR023
    - QR024
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: moderate
    topic: people-and-control-organisation
    missingEvidence: Public sources do not map current compliance headcount, control ownership, post-crisis attrition, or launch-governance processes across product lines.
    whyItMatters: Execution risk depends on whether BharatPe staffed control functions at the same pace as it expanded product and regulatory scope.
    diligencePath: Request compliance org charts, attrition trends, open senior hires, launch-approval gates, and board risk reporting packs.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR004
