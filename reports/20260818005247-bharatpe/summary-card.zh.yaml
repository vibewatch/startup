  topStrengths:
    - 商户和地域规模真实，覆盖 17M+ 商户、450+ 城市。
    - FY25 经营势头明显改善，收入提高，亏损大幅收窄。
    - RBI 支付聚合商授权增强了监管可信度，也拓宽了变现选项。
    - 商户驱动变现叠加设备、贷款和支付基础设施，形成多条上行杠杆。
    - 真实老股交易给出了当前估值锚，比多数私营创业公司更清晰。
  topRisks:
    - 既往治理问题仍应折价，因为此前争议以和解而非裁决收尾。
    - 相比多数印度上市 fintech 可比公司，当前估值隐含倍数要求偏高。
    - 信贷质量、合作方集中度和本年度现金 / 盈利数据披露仍不足。
    - 客户摩擦和低切换成本，可能比表面规模叙事暗示得更快侵蚀商户质量经济性。
    - Pre-IPO 融资条款和优先股堆叠细节未公开。
  unresolvedGaps:
