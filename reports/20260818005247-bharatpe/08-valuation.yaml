- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Fresh financing below current mark
    - Down-round or materially structured insider round
    - Undercuts claim that secondary established durable fair value
    - Shift stance from track toward pass
  - - Losses or cash burn worsen again
    - FY26 or FY27 audited deterioration versus FY25 direction
    - Breaks turnaround underwriting and compresses valuation corridor
    - Cut valuation range and confidence
  - - Credit or partner concentration surprises
    - Weak vintages, heavy lender concentration, or partner disruption
    - Turns merchant monetisation strength into fragility
    - Increase discount rate and require new base case
  - - Customer-friction evidence deepens
    - More withheld-fund or support failures without better SLAs
    - Damages retention and merchant-quality assumptions
    - Treat scale as lower quality than headline counts imply
  - - Regulatory or PA execution stumble
    - Remediation, onboarding pause, or slower-than-expected monetisation
    - Removes a core upside pillar from the bull case
    - Lower bull-case range and overall recommendation
  notes: Kill triggers focus on events that directly impair the valuation case rather than generic operational setbacks.
  claimRefs:
  - CV031
  - CV032
  - CV035
  - CV038
  - CV041
  - CV042
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Pre-IPO financing terms
    - Round size, price, structure, and any preference or liquidation protections
    - Current mark is hard to underwrite without knowing whether the next money agrees
    - Request financing materials from management and lead investors
  - - FY26 interim and audited updates
    - Current-year revenue, EBITDA, cash, and working-capital trend
    - Need to know whether FY25 was a one-year clean-up or a durable new run-rate
    - Request audited management accounts and board packs
  - - Credit quality and lender mix
    - NPA vintages, repeat-borrower cohorts, DLG / non-DLG mix, partner concentration
    - Credit opacity is one of the biggest reasons the current mark feels stretched
    - Review lender dashboards and vintage curves
  - - Merchant quality and retention
    - Active merchants, paying merchants, device retention, attach rates, complaint closure
    - Scale without quality can hide weak economics
    - Request cohort analysis and customer-success dashboards
  - - Governance proof
    - Internal controls, board committee reporting, audit findings after settlement
    - Need to test whether repair is measurable rather than narrative-only
    - Review internal audit outputs and board governance materials
  notes: These asks are the minimum package needed to move from track to an investable price-sensitive decision.
