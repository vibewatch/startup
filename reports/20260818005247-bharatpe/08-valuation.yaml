- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - PhonePe
    - FY26 revenue ₹7,920 crore; valuation references ~$12B to ~$15B
    - Upper-bound private leader comp with much larger scale
    - Best comparator for Indian UPI and adjacent fintech ambition
    - Far larger user base and market share than BharatPe
  - - Paytm
    - FY25 revenue ₹6,900 crore; market cap ~$10.59B; EV ~₹867.69B
    - Public merchant-payments and financial-distribution comp
    - Shows what deep disclosure and public-market scrutiny look like
    - Different transition history and listed-company liquidity
  - - Pine Labs
    - Revenue ~₹2,832 crore; EV ~₹109.80B; market cap ~₹187.65B
    - Public merchant-payments infrastructure comp
    - Useful for merchant and payments-infrastructure valuation discipline
    - Different geography, product mix, and listed-market dynamics
  - - MobiKwik
    - FY25 total income ₹1,192 crore; market cap ~₹15.97B
    - Smaller public consumer-payments and credit comp
    - Useful lower-band comp for Indian fintech multiple compression
    - Much smaller scale and weaker breadth than BharatPe
  notes: Comparable rows are intended to frame a corridor, not produce a mechanical fair value.
  enumerationScope:
    coverage: partial
    basis: The table covers the most visible Indian fintech comparables accessible from retained public sources, but it excludes private comp nuances such as preference stack, secondary liquidity terms, and non-public peer financials.
