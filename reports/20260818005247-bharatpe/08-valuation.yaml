- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What supports it
  - What would change the view
  rows:
  - - Turnaround is real
    - FY25 revenue growth, narrower losses, PA authorisation, domestic secondary demand
    - Need audited continuation into FY26 and cleaner disclosure to upgrade conviction
  - - Merchant network is an under-monetised asset
    - Large merchant base, device footprint, partner-lending and PA cross-sell
    - Need proof that attach and retention improve, not just reach
  - - Governance risk is receding
    - Founder dispute settled and new management narrative is stronger
    - Need evidence that repair is independently visible, not just described
  - - Current mark is full
    - Implied multiple is demanding versus most public comps
    - Would soften if a new round or public filing validates a higher-quality earnings base
  - - PhonePe sets upper-bound optimism
    - Large Indian payments platforms can still command strong value
    - BharatPe needs more scale and disclosure to deserve that tier
  notes: The anti-thesis section focuses on what would actually move the investment call rather than abstract pros and cons.
