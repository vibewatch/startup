- id: diligence-asks-and-thesis-breaks
  title: Diligence asks and thesis-breaks
  body: 'What should move the investment committee next is not another broad market narrative about Indian fintech. It is a short list of very specific proofs. First, investors need clarity on forward economics: audited FY26 trajectory, cash needs, and any pre-IPO pricing or preference terms. Second, they need to understand whether the merchant-led model is high quality or simply high volume by seeing partner concentration, credit-vintage performance, and repeat-borrower durability. Third, they need to see whether governance repair is now measurable rather than rhetorical. Public sources are simply too thin on those points to justify false precision. The right discipline is to define thesis-breaks clearly: if losses widen again, if customer-friction evidence deepens, if partner risk proves concentrated, or if the next financing resets price down, the stretched private mark no longer deserves the benefit of the doubt.'
