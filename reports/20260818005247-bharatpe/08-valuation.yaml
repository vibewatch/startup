- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Profitability persists, PA/TPAP monetises, governance discount keeps compressing, and pre-IPO demand clears at or above current mark
    - $3.2B-$3.6B can be defended if execution becomes cleaner and disclosure expands
    - Still vulnerable to fintech market sentiment or regulatory surprises
    - Possible, but requires multiple execution gates to clear
  - - Base
    - FY25 improvement holds, but disclosure remains partial and multiple stays disciplined
    - Current $2.85B mark is roughly fair to slightly stretched, with only limited upside
    - Any wobble in support, credit, or partner quality can erase the cushion
    - Most plausible from current public evidence
  - - Bear
    - Growth slows, losses re-expand, or governance / customer / credit questions worsen
    - Fair value drifts toward roughly $1.8B-$2.3B as investors use harder public-comp discounts
    - Public and private market mood can shift quickly against opaque fintech stories
    - Credible if next financing or audit disappoints
  notes: Scenarios are expressed as valuation ranges rather than exact return models because too many decisive inputs remain private.
