- id: financial-turnaround-and-capital-signals
  title: Financial Turnaround and Capital Signals
  body: Public financial visibility on BharatPe is still media-mediated rather than filing-rich, but the direction of travel is much clearer than it was two years ago. Three outlets converged on FY24 operating revenue of Rs 1,426 crore, up 39% from Rs 1,029 crore, while also describing sharp loss reduction. Business Standard pegged FY24 EBITDA loss at Rs 209 crore and both it and The Economic Times highlighted that BharatPe turned EBITDA positive in October 2024. The subsequent FY25 picture is stronger still. Entrackr, Business Standard, and VCCircle all reported operating revenue of Rs 1,667 crore for FY25, with Rs 6 crore of adjusted profit before tax and Rs 141 crore of EBITDA profit excluding ESOP expense. Capital-market evidence is thinner, but the 2025 secondary is a useful valuation anchor. Finance Outlook, Entrackr, and CIOL all placed that transaction at roughly $2.85 billion, implying that BharatPe preserved its unicorn status even after governance turmoil and a weaker private-market
    backdrop.
