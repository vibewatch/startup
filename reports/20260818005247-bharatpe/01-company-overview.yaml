callouts:
- calloutType: strength
  title: The operating story is now turnaround plus breadth, not just QR growth
  body: The strongest current pattern is that BharatPe has paired genuine top-line scale with a visibly broader product stack. Merchant acceptance, POS devices, lending, and consumer utilities now coexist inside the same brand, and FY24-FY25 coverage points to improving profitability rather than pure growth spending.
  claimRefs:
  - CO007
  - CO016
  - CO020
  - CO021
  - CO022
- calloutType: risk
  title: Governance scars still matter because disclosure remains thinner than the operating narrative
  body: Management has made the story more investable than it was in 2022, but the public record remains stronger on recovery messaging than on hard governance architecture. That means the legacy scandal still matters in diligence, especially when combined with incomplete cap-table and board-composition disclosure.
  claimRefs:
  - CO013
  - CO014
  - CO015
  - CO026
  - CO029
