- id: comparable-valuation-frame
  title: Comparable valuation frame and relative multiple discipline
  body: 'The comp set argues for nuance rather than for copy-paste multiple math. Carvana shows what the market will sometimes pay for a scaled, technology-forward used-car platform when growth and strategic scarcity are in favor; AUTO1 shows how public investors can still value a large, profitable used-car platform at a much lower sales multiple; CarTrade shows that a profitable, India-listed marketplace can command a rich earnings frame even at a much smaller revenue base; and Spinny shows that private Indian peers are not immune to valuation reset. Read together, these datapoints place CARS24 somewhere between the extremes. Its 2021 mark looks far richer than current AUTO1-like public discipline and richer than recent Spinny private rounds, but still below Carvana’s premium public lens. The implication is simple: the company may deserve a premium, but the premium has to be defended by cleaner profitability and disclosure rather than by narrative alone. That spread is exactly why entry
    discipline matters more than headline admiration: the same sector can clear at very different prices depending on reporting quality, profitability, and investor confidence in governance.'
