  title: Valuation
summary: 'CARS24 remains investment-worthy to follow, but the public-evidence valuation call is still track / research-more: the business is improving fast enough to defend a serious premium lens, yet the last external valuation anchor is stale and too many price-critical disclosures remain private.'
sections:
- id: recommendation-and-price-context
  title: Recommendation, confidence, and current price context
  body: 'Public evidence supports following CARS24 closely, but not issuing a price-insensitive buy against the stale $3.3 billion round headline. The business clearly matters: statutory revenue has already been near the billion-dollar mark, FY26 adjusted economics improved materially, Q4 turned profitable, and management continues to push retail mix, lending, and ownership services into a broader vehicle-ownership platform. But the valuation anchor is old, the most recent support capital came from the Singapore parent rather than from a new external lead investor, and public evidence still does not show a filed DRHP, a fresh audited FY26 bridge, or a full cap-table/preference picture. That means the correct posture is track / research-more with medium confidence and a stretched-to-fair stance. The company is not obviously overvalued in the abstract; it is simply not publicly transparent enough to treat the 2021 mark as today’s clearing price.'
  claimRefs:
