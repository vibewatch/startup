- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Case
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Profitability remains positive, listing prep advances, and lending quality stays controlled
    - A $3.5B-$5.0B range becomes arguable as Cars24 defends or exceeds its old mark
    - Execution at scale, governance bandwidth, and credit normalization
    - Audited bridge, cleaner complaint trend, visible DRHP progress
  - - Base
    - FY26 improvement holds but disclosure stays incomplete
    - A $2.5B-$3.5B range keeps the old mark plausible but not clearly cheap
    - Stale mark, opacity, and public-comp discipline limit upside
    - Mixed but improving operating signals with no decisive new price discovery
  - - Bear
    - Private comps reset lower or operating leverage fades
    - A $1.4B-$2.2B range becomes more appropriate
    - Leadership / listing slippage, margin reversal, or credit stress
    - Spinny-like reset, higher risk premium, and weak disclosure
  - - Strategic optionality overlay
    - Ownership services and financing deepen engagement without full recurring-revenue visibility
    - Can support better exit outcomes, but not precise multiples on its own
    - Optionality may disappoint if attach rates or retention are weak
    - Cross-sell metrics and repeat usage improve visibly
  notes: Scenario ranges are estimated bands inferred from public evidence, not quoted transactions or management guidance.
