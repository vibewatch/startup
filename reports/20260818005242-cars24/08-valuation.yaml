    - AUTO1 trades much lower on sales; Spinny repriced lower; CarTrade gets paid for profits
    - Evidence that Cars24 can match or exceed public-comp profitability quality
  - - 'Anti-thesis: capital intensity still matters'
    - Annual return and lending posture show balance-sheet dependence
    - Cleaner cash conversion and more transparent funding structure
  notes: The table distinguishes strategic quality from price proof.
