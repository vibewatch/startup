- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Listing-readiness slippage
    - No visible filing progress while management still frames an IPO window
    - Turns valuation support from near-term catalyst into narrative risk
    - Cut confidence and insist on lower entry price
  - - Profitability reversal
    - FY27 operating leverage backslides after FY26 / Q4 inflection
    - Weakens the main argument for defending a premium mark
    - Move toward bear-case pricing
  - - Loan-book deterioration
    - Credit quality or funding dependence worsens without better disclosure
    - Damages both earnings quality and risk rating
    - Increase discount rate or pause investment
  - - Persistent complaint / trust friction
    - Customer-friction evidence does not normalize as scale rises
    - Undermines the ownership-platform expansion story
    - Reduce LTV assumptions and support a lower range
  - - Governance / capital-structure opacity
    - Cap-table, preference, or dilution terms remain unclear late in process
    - Makes downside hard to underwrite even if topline stays large
    - Limit participation until terms are visible
  notes: Triggers are meant to be monitored against concrete milestones, not impressionistic sentiment.
  claimRefs:
  - CV025
  - CV026
  - CV034
  - CV040
  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited FY26/FY27 bridge
    - Statutory revenue, gross profit, EBITDA, cash flow, and segment mix
    - Needed to translate the stale mark into a current denominator
    - Finance team / auditor pack
  - - Capital structure
    - Preference stack, liquidation overhang, dilution, and employee option refresh
    - Downside protection and entry price cannot be judged without it
    - Legal + finance diligence
  - - Loan-book quality
    - Vintage losses, co-lending share, recoveries, and funding covenants
    - Lending is both upside and risk amplifier
    - NBFC management + credit pack
  - - Customer quality
    - Repeat-buyer share, seller re-entry, ownership-service monetization, complaint normalization
    - Optionality only matters if it sticks and monetizes
    - Ops + product analytics pack
  - - IPO readiness
    - Reverse-flip status, DRHP timeline, board committees, and advisers
    - Catalyst timing matters to exit path and valuation support
    - CFO / counsel / bankers
  notes: These asks are the minimum package for moving from narrative diligence to committee-grade underwriting.
