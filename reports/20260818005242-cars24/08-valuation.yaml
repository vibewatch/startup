- id: scenario-logic-and-price-sensitivity
  title: Bull, base, and bear scenario logic under explicit uncertainty
  body: Scenario thinking is possible here, but false precision is not. The public evidence is good enough to define direction, not exact entry price. The bull case assumes that FY26 profitability is the start of a durable shift rather than a one-quarter milestone, that loan-book quality stays controlled as the business scales, that DRHP preparation becomes visible, and that ownership-services cross-sell lifts lifetime value without forcing more balance-sheet stress. The base case assumes those improvements continue but disclosure remains incomplete, making the last round look plausible yet still hard to underwrite confidently. The bear case assumes that peer valuation pressure, governance or listing delays, or a reversal in operating leverage drive the market to reset the business closer to current Indian-peer levels. Because the last true external price discovery is old, the valuation call must remain price-sensitive and milestone-sensitive.
