- id: what-could-change-the-view
  title: What could change the competitive view
  body: 'The most important competitive open questions are about economics, not only features. CARS24 can look stronger than rivals on product breadth and still underperform if customer acquisition, refurbishment, financing losses, or working-capital intensity are worse than peers. Likewise, traffic-led businesses can look weaker on trust and still outperform if their customer-acquisition costs and monetization depth are much better. The retained evidence therefore supports a balanced view: CARS24 is one of the strongest full-stack used-car platforms in India, but no single operator can yet be treated as permanently dominant.

    Three developments would change the view fastest. First, a public disclosure of city-level unit economics could show whether CARS24''s broader stack really compounds or merely adds complexity. Second, deeper evidence on how much dealer rails versus owned retail drive volume could change the assessment of its operating leverage versus Spinny. Third, if OEM-certified or public-market competitors materially improve digital convenience and credit distribution, some of CARS24''s practical differentiation could compress. For now, CARS24 looks well positioned, widely scoped, and competitively challenged rather than competitively secure.'
