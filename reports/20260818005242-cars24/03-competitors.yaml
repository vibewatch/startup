  evidenceGaps:
  - type: missing-disclosure
    severity: material
    question: What are CARS24's channel-specific unit economics versus Spinny, listings-led platforms, and OEM-certified programs.
    impact: Public feature comparisons are informative, but competitive durability ultimately depends on CAC, refurbishment cost, financing losses, and retention economics by channel.
    nextStep: Seek IPO filings, lender disclosures, or management commentary that separates retail, dealer, marketplace, and ownership-service contribution margins.
    relatedClaimRefs:
    - CP026
    - CP029
    - CP030
    - CP034
    relatedTableRefs:
    - TP004
    relatedFigureRefs:
    - FP004
  - type: missing-disclosure
    severity: moderate
    question: What is the exact overlap between CARS24's owned inventory, marketplace inventory, and dealer-rail transactions.
    impact: Competitive breadth can be overstated if raw inventory or user counts are compared without knowing which transactions are directly controlled by CARS24.
    nextStep: Seek channel-mix disclosures in future public materials or filings.
    relatedClaimRefs:
    - CP014
    - CP015
    - CP030
    relatedTableRefs:
    - TP003
    relatedFigureRefs:
    - FP001
