  title: Risks
summary: 'CARS24’s public risk profile is medium-high: the company is clearly improving operationally, but the remaining risk stack still sits in lending conduct, complaint handling, RC-transfer execution, partner concentration opacity, and IPO-transition governance rather than in market demand.'
sections:
- id: ranked-risk-register
  title: Evidenced risk ranking and why the stack is still medium-high
  body: 'The highest-value risk question for CARS24 is not whether the business has demand; public evidence already shows large user reach, meaningful loan disbursals, a nationwide seller-and-partner footprint, and a first profitable quarter in Q4 FY26. The issue is whether legal, regulatory, service-quality, and capital needs remain controlled as the company pushes toward IPO readiness. The public record points to a medium-high risk stack: lending rules are tightening, complaint handling is becoming more formalized under RBI directions, transfer and refund flows can still be slow, and the company remains operationally dense because transactions, refurbishment, financing, and ownership services are tied together. Importantly, the evidence does not show a headline enforcement crisis. Instead it shows a business improving quickly while still carrying consumer-protection, balance-sheet, and execution exposures that an investor should convert into document requests and threshold triggers rather
    than hand-wave away. The ranking should therefore be treated as an underwriting dashboard: if backlog, complaint quality, funding dependence, or listing readiness deteriorate together, risk severity steps up quickly even if volume still looks healthy.'
  claimRefs:
  - CR001
  - CR002
  - CR007
  - CR008
  - CR009
  - CR014
  - CR016
  - CR041
  - CR042
  tableRefs: []
