- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Customer-trust breakdown
    - RC-transfer or refund backlog
    - Median completion time worsens or complaint velocity rises for two quarters
    - Pause conviction and require root-cause review before new capital
  - - Lending-control deterioration
    - Asset-quality or complaint slippage
    - Default / collection indicators worsen without improved disclosure
    - Increase discount rate and cap exposure until underwriting is clearer
  - - Governance slippage
    - IPO milestones move without better disclosure
    - No visible filing progress plus continued leadership churn
    - Treat listing story as aspirational and cut valuation support
  - - Partner concentration
    - Hidden dependency on a few dealers or cities
    - Top-partner or top-city exposure proves too high
    - Haircut liquidity and transaction-growth assumptions
  - - Operational reversal after AI gains
    - Costs re-accelerate or exception handling spikes
    - FY27 operating leverage stalls despite higher automation
    - Assume weaker margin durability and tougher downside case
  notes: Kill criteria convert the public risk stack into measurable monitoring rules.
