- id: regulatory-legal-and-consumer-protection
  title: Regulatory, legal, and consumer-protection exposure
  body: 'CARS24’s legal and regulatory risk is concentrated in conduct, disclosures, complaint redress, and transaction execution rather than in a visibly broken license. The public terms, privacy policy, and security-program terms show a broad digital perimeter that spans the commerce site, app surfaces, and loans24-related data handling. That matters because the RBI’s digital-lending and internal-ombudsman directions make disclosure quality, grievance escalation, and customer treatment part of the operating model for any NBFC-linked lending flow. The adverse side is equally concrete. Cars24’s own RC-transfer and seller-protection pages show that transfer completion is a critical trust promise, while a 2026 consumer-law case note and complaint boards preserve examples where delays or partner failures created liability exposure for prior owners. In practice, this means the regulatory/legal risk is not abstract: it sits inside customer workflows that can spill into complaints, social trust,
    and eventual public-market diligence.'
  claimRefs:
