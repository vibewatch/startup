      - number: '5.2'
        title: AI, Inspection, and Operating Architecture
        blocks:
          - type: paragraph
            body: >-
              Public architecture evidence is strongest where CARS24 talks about operational layers instead of
              code-level systems. The AI quarterly report, Business Today, Business Standard, and the quality-benchmarks
              article together describe a stack that connects customer conversations, inspection and pricing, lending
              workflows, document intelligence, and hub operations. By AMJ 2026 the company said 80% of inspections and
              65% of loan disbursals were AI-led, with millions of workflow executions and document-processing events
              feeding the same operating model. That makes the product stack meaningfully more technical than a
              classifieds site, because valuation, underwriting, support, and inspection all depend on shared data and
              model outputs.


              Still, the public record remains an operating-architecture map rather than a software-architecture
              diagram. We can verify data scale, workflow automation, tooling intensity, and AI-assisted engineering; we
              cannot verify cloud design, data-rights governance, uptime, API boundaries, or model-evaluation controls.
              The company’s strongest defensible asset appears to be long-lived inspection and transaction data joined
              to a physical hub network, not a publicly documented developer platform. Investors should therefore
              underwrite CARS24 as data-rich and automation-heavy, but not yet as a transparently disclosed software
              platform with public-grade technical artifacts.
