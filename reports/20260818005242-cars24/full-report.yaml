              take materially longer than cash returns, and loan-linked refunds can run 25 to 30 business days. Those
              details are valuable because they show the company knows which parts of the journey create trust or
              frustration.


              The counterpoint is that complaint intensity remains visible enough to matter. ConsumerComplaints,
              JustUseApp, Google Play comments, and Trustpilot all preserve reports of delayed RC transfers, pricing
