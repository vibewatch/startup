      - number: '3.3'
        title: Distribution power, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Distribution power in this market does not belong to one model alone. CARS24 claims major demand scale,
              dealer reach, and multiple monetization engines, but the retained competitor evidence shows equally real
              substitute strengths elsewhere. CarWale advertises more than 110,000 used-car listings and more than 3.5
              million monthly used-car buyers. OLX advertises more than 311,000 used-car listings and emphasizes direct
              seller chat. CarDekho advertises more than 57,000 used cars while remaining embedded in a broader new-car
              and content ecosystem. Maruti Suzuki True Value says it has 652 outlets across 334 cities and more than
              six million customers, which is a meaningful physical-network trust advantage. CarTrade Tech reports
              massive yearly unique-user scale across CarWale and OLX India, illustrating how distribution can be built
              without carrying every car on balance sheet.

              CARS24's moat is therefore narrower than the top-line brand suggests. It depends on whether inspection
              depth, financing access, ownership services, and dealer rails create more customer willingness to transact
              through CARS24 than through cheaper or more familiar alternatives. Those are meaningful switching costs,
              but they are not impregnable. OEM programs can compete on trust, classifieds can compete on breadth and
              price discovery, and Spinny can compete on controlled curation. CARS24's moat is strongest where buyers
              value convenience and certainty over negotiation, and weakest where assortment, lowest price, or
              single-brand service comfort dominate.
            claimRefs:
              - CP019
              - CP020
              - CP021
              - CP022
              - CP023
