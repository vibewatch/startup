  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and headline size
        blocks:
          - type: paragraph
            body: >-
              CARS24 participates in the organized slice of India's used-car market, not in the full universe of every
              peer-to-peer, brokered, or informal lot transaction. That distinction matters because headline market-size
              figures are easy to overstate if they ignore the real bottlenecks that formal retail must solve: trusted
              inspections, financing access, title transfer, refurbishment, intercity logistics, and post-sale service.
              Mordor Intelligence sizes the India used-car market at about $36.39 billion in 2025 and $41.74 billion in
              2026, with a 14.72% CAGR through 2031, while IMARC publishes a somewhat larger 2025 base of $40.43
              billion. These estimates are directionally useful, but they cover a market where unorganized or offline
              channels still remain dominant in several retained sources.

              For CARS24, the more relevant signal is not just total used-car spend but migration toward organized,
              certified, financed, digitally discoverable transactions. Redseer frames trust deficit and intermediation
              complexity as the category's core structural inefficiencies, while CRISIL-based reporting shows scale is
              now large enough that organized players can plausibly reach operating breakeven if growth persists.
              Investors should therefore treat TAM as a boundary condition and organized-share migration as the real
              underwriting variable. CARS24 does not need to own the whole market to justify scale; it needs to own the
              highest-frequency, financeable, trust-sensitive part of that market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM007
              - CM018
