    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform model, and footprint
        blocks:
          - type: paragraph
            body: >-
              CARS24 should be underwritten as more than a used-car classifieds brand. Across its investor-relations
              page, operating updates, and app disclosures, the company now presents itself as an AI-native
              auto-ownership platform spanning car buying, selling, financing, ownership services, and eventual resale.
              That framing matters because the public operating system is deliberately wider than a single consumer
              retail funnel: Cars24 says it monetises vehicle transactions, financing solutions, and ownership services
              while using one stack across India, the UAE, and Australia. Official documents also show the group still
              has a more complex international legal footprint than the front-end India brand suggests, with
              subsidiaries in Southeast Asia, the UAE, Saudi Arabia, and Australia under Singapore parent Global Car
              Group. The most durable conclusion for later chapters is that Cars24 is a vertically integrated,
              data-heavy consumer marketplace with meaningful physical and financial infrastructure, not a pure
              lead-generation site.
