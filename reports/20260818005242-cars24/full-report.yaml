      - number: '7.3'
        title: Operational, capital, and platform-stack risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, CARS24 still looks like a heavy-lift system disguised by better software. The FY25 annual
              return shows meaningful borrowings and a cash profile that is much tighter once fixed deposits are
              separated from cash equivalents. H1 and H2 FY26 materials show the economic case improving through retail
              mix, lending, and AI-led efficiency, but that same evidence also highlights how many moving parts the
              company must keep in sync: inspections, refurbishment, financing, support, RC transfer, and cross-country
              platform reuse. Official pages on returns, warranty, and support show the company understands where trust
              breaks; they also reveal the time and process complexity that can surface when edge cases occur. AI is
              clearly mitigating some of this load—costs and process times have improved—but automation does not
              eliminate operational risk. It simply changes the failure modes from purely manual bottlenecks toward
              exception handling, partner quality, and model-governed decision control.
