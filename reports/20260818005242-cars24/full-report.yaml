  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and archetypes
        blocks:
          - type: paragraph
            body: >-
              CARS24 competes in a landscape that is broader than a simple list of venture-backed inventory peers. The
              retained source pack shows at least four meaningful competitor classes. First are direct full-stack online
              used-car retailers such as Spinny, which overlap closely with CARS24 on inspection, certification,
              financing, delivery, and post-purchase promises. Second are discovery-led and traffic-first models such as
              CarWale, CarTrade, OLX, and parts of CarDekho, which can reach customers at lower asset intensity because
              they do not always need to own or refurbish inventory. Third are OEM-certified programs such as Maruti
              Suzuki True Value, which compete on brand trust, service networks, and standardized inspection. Fourth are
              hybrid ecosystem players that use used cars as one product line inside a wider auto-media, financing, or
              services stack.

              This matters because buyers can solve the same job in multiple ways. They can choose a trust-heavy
              inventory platform, browse a huge listings universe, or stay inside an OEM-certified ecosystem. CARS24
              therefore wins only when its inspection, financing, and ownership stack is valued more than lower prices,
              wider raw listings inventory, or the reassurance of an OEM badge. The competitive question is not who has
              the best brochure; it is which model converts trust into repeatable economics without losing too much
              breadth or price competitiveness.
            claimRefs:
