      - number: '3.2'
        title: Capability, pricing, and model differences
        blocks:
          - type: paragraph
            body: >-
              The sharpest direct comparison is between CARS24 and Spinny. Official CARS24 materials emphasize a
              300-point inspection, AI-driven fixed pricing, 30-day return rights, buyback, legal support, financing,
              and ownership services. Spinny presents a narrower but highly trust-oriented promise centered on a
              200-point inspection, certification, warranty, finance, and money-back coverage. That makes CARS24 appear
              broader and more ecosystem-oriented, while Spinny appears more controlled and retail-pure. Neither model
              is obviously superior in all contexts. CARS24 potentially wins on assortment breadth, dealer rails, and
              ancillary monetization; Spinny can look simpler and more tightly curated.

              Other competitors attack from different angles. CarWale, OLX, and CarDekho compete by aggregating huge
              listing pools and buyer traffic, which can reduce acquisition costs and satisfy bargain-seeking shoppers
              who do not require a platform-controlled inventory journey. True Value competes on OEM trust and physical
              footprint. CarTrade Tech adds disclosure and public-market discipline to a lighter, traffic-led model
              while still pushing deeper into used-auto tools and financing partnerships. The relevant conclusion is
              that CARS24 is not just fighting one lookalike; it is fighting multiple business models with different
              cost structures and trust claims.
