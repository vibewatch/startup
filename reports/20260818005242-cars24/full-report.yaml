  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              CARS24 should be modeled as a multi-lane vehicle-ownership platform, not as a single buy-sell webpage. The
              official Why Cars24 and buying-transparency surfaces show at least three distinct commerce rails:
              owned-stock retail, verified direct-seller marketplace inventory, and dealer-facing auction or partner
              channels. Those rails are then surrounded by financing, warranties, RC-transfer support, FASTag, challan,
              and inspection products that keep users inside the same ecosystem after the initial transaction. This
              matters because the product promise is not just discovery; it is reduced uncertainty across inspection,
              paperwork, financing, and post-sale protection.


              The workflow evidence is also concrete. Buyers are shown quality-checked inventory, AI-linked pricing,
              inspection reports, warranty options, and a 30-day return or repair envelope. Sellers can book
              inspections, receive digital valuation guidance, and rely on RC-transfer and legal-support promises after
              handover. Dealers are pushed into a separate operating flow through the partner app and onboarding pages,
              where daily auctions, buyback, financing, paperwork, and transparent bidding are emphasized. The result is
              a broad product surface that monetizes through transaction control, trust tooling, and service attachment
              instead of traffic alone.
