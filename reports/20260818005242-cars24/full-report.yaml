      - number: '7.4'
        title: People, governance, and measurable thesis-breakers
        blocks:
          - type: paragraph
            body: >-
              The governance question is less about founder charisma and more about whether leadership bandwidth stays
              intact through an IPO-style transition. The Economic Times and IPO-oriented coverage together show three
              overlapping pressures: executive churn, reverse-flip or domicile work, and restructuring of non-core bets
              while the company tries to prove profitability. Those steps can be rational, but they also compete for
              management attention exactly when customer service, lending controls, and disclosure discipline must
              improve. The right response is not to mark the company uninvestable; it is to define kill criteria. If
              DRHP filing keeps slipping, if complaint intensity does not fall, if partner concentration or default
              curves remain opaque, or if profitability improvement reverses once growth accelerates, the thesis should
              be haircut quickly. Conversely, if the company proves cleaner complaint resolution, better lending
              disclosures, and smoother listing preparation, the same current risk stack can compress meaningfully.
