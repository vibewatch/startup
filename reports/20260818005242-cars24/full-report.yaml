      - number: '5.3'
        title: Embedded Finance, Dealer Tools, and Ownership Services
        blocks:
          - type: paragraph
            body: >-
              CARS24’s product scope increasingly stretches beyond the moment a vehicle is bought or sold. Loans24 now
              markets used-car loans, loan-against-car, personal loans, and top-up products through a separate but
              company-linked digital surface, while the main app description explicitly adds FASTag, challan payments,
              RC transfer, GPS tracking, insurance, roadside assistance, and scrapping services. The dealer app and
              onboarding pages show a different monetization lane again: business partners can bid on thousands of
              auctions per day, access buyback and financing tools, obtain detailed inspection reports, and use
              RC-transfer support. That breadth is strategically important because it deepens lifetime value and gives
              the company more ways to monetize the same vehicle and customer relationship.


              The important product insight is that these services are not random add-ons. Financing lowers purchase
              friction, RC-transfer support reduces seller anxiety, dealer tooling increases liquidity, and ownership
              services create recurring engagement after the car changes hands. In practice that means CARS24 is
              assembling a vehicle-ownership operating system around the transaction. The weakness is that monetization
              depth, attach rates, and failure rates across these side-services are still mostly undisclosed. Public
              evidence shows the lanes exist and are being productized; it does not yet show how much of the installed
              base actually uses each lane or how profitable each lane is after support and compliance costs.
