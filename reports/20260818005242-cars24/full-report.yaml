      - number: '8.4'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is improving, but still unproven in public artifacts. The company talks like an IPO
              candidate and recent coverage frames profitability, restructuring, and domicile work as part of that
              transition. Yet investors still need the diligence package that would convert that story into
              committee-grade underwriting: audited FY26/FY27 bridge, retail versus wholesale economics, full loan-book
              performance, capital structure and preference stack, partner concentration, complaint normalization, and a
              visible listing timetable. Until those items are surfaced, the smartest decision is to stay engaged and
              disciplined. The upside case is real enough to merit attention, but the downside case is also real if
              profitability stalls or if the price is still anchored to a 2021 narrative rather than to current
              risk-adjusted proof. Good governance here means demanding milestones before expanding valuation
              confidence. It also means insisting that any apparent urgency around a listing should improve disclosure,
              not substitute for it.
