companyProfile:
  summary: >-
    CARS24 was founded in 2015 in Gurugram and has grown from a used-car transaction platform into a broader
    auto-ownership stack that combines retail, auctions, financing, and post-purchase services. Public evidence shows
    meaningful scale across India plus international operating exposure, large user reach, a large dealer network, and
    real FY26 profitability improvement. The main underwriting question is no longer whether the business is real; it is
    whether current disclosure quality, governance clarity, and lending transparency are sufficient to support the stale
    2021 valuation anchor with confidence.
