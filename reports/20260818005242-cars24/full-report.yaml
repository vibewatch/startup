      - number: '5.5'
        title: Product-Tech Verdict and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The retained evidence is strong enough to say CARS24 has a real and unusually broad product stack for a
              used-car company. It spans buyer and seller workflows, owned and marketplace inventory, dealer liquidity,
              loans, inspection, warranty, PDI, and ownership services, while simultaneously pushing AI into inspection,
              lending, support, and engineering. That is a substantive operating moat if the data and workflow loops
              keep compounding. The company does not look like a thin lead-generation layer anymore.


              The remaining problem is disclosure quality. The public pack proves breadth and automation better than it
              proves durability, security maturity, service reliability, or technical defensibility. There is no public
              status page, no audit-grade security certification set, no disclosed defect-rate or claim-rate series for
              inspection and warranty promises, and no clear architecture detail showing how far the AI layer is
              proprietary versus assembled from vendor tooling. Investors can therefore underwrite CARS24 as a
              data-heavy, operations-backed product platform with genuine workflow control, but not yet as a fully
              transparent software moat. The biggest next diligence step is to verify whether the company’s public trust
              promises survive adverse edge cases at scale.
