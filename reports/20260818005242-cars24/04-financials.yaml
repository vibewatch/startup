- id: balance-sheet-lending-and-capital-needs
  title: Balance sheet, lending exposure, and capital adequacy
  body: 'CARS24 remains capital intensive because it finances inventory, lending, refurbishment, and category expansion at the same time. The FY25 annual return reports $182.4 million of cash and fixed deposits, but only about $10.4 million counted as cash and cash equivalents in the cash-flow statement once short-term fixed deposits are stripped out. Group borrowings still totaled about $127.4 million at March 2025, with additional undrawn borrowing facilities of roughly $50.6 million. Loans and advances remained large at about $135.0 million, and the filing says the loan portfolio is predominantly used-vehicle finance in India secured by hypothecation of financed cars. This is not a capital-light balance sheet.

    The lending business is strategically important because it acts both as a conversion tool and as a stand-alone profit pool. H1 FY26 materials describe LOANS24 as a strong profit pool with improving asset quality, while H2 FY26 materials say co-lending allows the book to grow several times over without requiring equivalent equity. That is financially attractive, but it also means Cars24''s investment case depends partly on underwriting quality and funding structure, not only on used-car demand. The August 2025 parent infusion of Rs 345.2 crore should therefore be read as supportive but also as a reminder that the company still needs balance-sheet flexibility while moving toward IPO readiness.'
