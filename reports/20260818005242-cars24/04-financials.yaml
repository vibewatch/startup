- id: verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'On the evidence retained so far, CARS24''s financial verdict is constructive but not yet public-market clean. The positive case is real: group revenue is already very large; FY26 adjusted net revenue grew; losses narrowed sharply; retail mix improved; lending appears to be scaling without obvious credit blowups; and AI-led automation is visibly attacking cost drivers across inspections, disbursals, customer support, and engineering. Those are not superficial changes. They are the kinds of operating improvements that can move a late-stage private company from pure growth dependence toward a more durable earnings story.

    But the remaining gaps still matter. The company does not disclose city-level contribution margins, full cash-burn math, channel-level take rates, or the precise profitability mix between wholesale, retail, marketplace, lending, and ownership services. External reporting also uses overlapping but not identical labels such as revenue, adjusted net revenue, EBITDA loss, and operating loss, which makes outside triangulation harder. Investors should therefore treat the business as clearly improving yet still diligence-heavy: better than a blind-growth story, but not transparent enough to underwrite with public-equity precision today.'
