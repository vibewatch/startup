chapter:
  number: 4
  title: Financials
  summary: CARS24 has already reached billion-dollar-equivalent group revenue scale, but the public record still describes a capital-intensive operating model that relies on inventory turns, lending economics, and cost discipline rather than on software-like recurring margins. Official FY25 and FY26 materials show clear profitability improvement and a first profitable quarter in Q4 FY26, yet also preserve meaningful disclosure gaps around channel-level contribution margins, cash burn, and the exact economics of the hybrid marketplace-plus-lending model.
sections:
- id: revenue-and-mix
  title: Revenue model, scale, and mix
  body: 'CARS24 should be modeled financially as a transaction-heavy operating business, not as a thin classifieds layer. The FY25 annual return shows group revenue from contracts with customers of about $934.9 million, down from roughly $1.0 billion in FY24, while the H1 and H2 FY26 performance updates show management increasingly steering investors toward adjusted net revenue rather than raw GMV. That shift matters because the business now combines vehicle transactions, financing origination, and vehicle-ownership services under one stack. The company explicitly says some marketplace transactions close off-platform even when Cars24 still earns commissions, value-added services, or financing income, which means raw GMV alone increasingly understates the monetized workflow.

    Independent FY24 India-business reporting fills in the operational texture. Cars24 said FY24 India revenue reached roughly Rs 6,917 crore, with more than 200,000 cars sold and most revenue still tied to core car-selling activity. Ancillary revenue from financial services, insurance assistance, warranties, parking, and service fees is growing, but the revenue engine remains highly linked to inventory throughput, pricing, financing attach, and post-sale service monetization. The financial conclusion is that CARS24 is evolving into a broader ownership platform, yet its earnings quality is still fundamentally anchored in large-scale auto commerce.'
