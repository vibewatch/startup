- id: profitability-and-unit-economics
  title: Profitability path and unit-economics signals
  body: 'The strongest positive in CARS24''s recent financial profile is the speed of profitability improvement across FY26. Official H1 FY26 materials report adjusted net revenue of about Rs 651 crore with adjusted EBITDA loss of Rs 162 crore. By H2 FY26, adjusted net revenue rose to about Rs 760 crore and adjusted EBITDA loss narrowed to Rs 38 crore, while Q4 FY26 became the first profitable quarter in company history at about Rs 20 crore of adjusted EBITDA. Management also says retail mix and value-added service attach are doing much of the work: retail now contributes more than half of transaction GMV, and H2 retail GMV crossed Rs 2,400 crore with materially better margins than wholesale.

    Even so, the public record is still incomplete for a true unit-economics model. We can see direction of travel—higher retail share, better GPU, stronger lending contribution, and meaningful AI-led cost savings—but we still cannot cleanly bridge gross profit per car, contribution margin by city, or the true cash payback period by cohort. Independent India-entity reporting also shows a bumpier transition from FY24 to FY25, where revenue declined and losses widened at the local level before FY26 improvements emerged in the official operating updates. The right interpretation is improving economics with unresolved transparency, not completed margin maturity.'
