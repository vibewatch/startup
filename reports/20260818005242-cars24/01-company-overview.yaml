company:
  name: CARS24
chapter:
  number: 1
  title: Company Overview
  summary: CARS24 is a Gurugram-founded used-car platform that has evolved into a broader AI-native auto-ownership stack spanning retail, auctions, financing, and ownership services across India and several international markets. Official 2025-2026 materials show a company that reached its first profitable quarter in Q4 FY26 and still commands meaningful user, dealer, and financing scale, but public governance detail remains materially thinner than the operating and product narrative.
sections:
- id: identity-platform-and-footprint
  title: Identity, platform model, and footprint
  body: 'CARS24 should be underwritten as more than a used-car classifieds brand. Across its investor-relations page, operating updates, and app disclosures, the company now presents itself as an AI-native auto-ownership platform spanning car buying, selling, financing, ownership services, and eventual resale. That framing matters because the public operating system is deliberately wider than a single consumer retail funnel: Cars24 says it monetises vehicle transactions, financing solutions, and ownership services while using one stack across India, the UAE, and Australia. Official documents also show the group still has a more complex international legal footprint than the front-end India brand suggests, with subsidiaries in Southeast Asia, the UAE, Saudi Arabia, and Australia under Singapore parent Global Car Group. The most durable conclusion for later chapters is that Cars24 is a vertically integrated, data-heavy consumer marketplace with meaningful physical and financial infrastructure,
    not a pure lead-generation site.'
