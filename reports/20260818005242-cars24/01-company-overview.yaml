- id: channel-scale-customer-signals-and-cautions
  title: Channel scale, customer signals, and cautionary evidence
  body: The current public record is unusually rich on channel breadth and unusually mixed on customer trust outcomes. Official partner materials describe a large dealer-facing network with thousands of channel partners, hundreds of branches, auction access, RC-transfer support, and financing programs, which reinforces Cars24’s claim that it operates both consumer and dealer rails rather than a narrow B2C storefront. The company’s curated testimonials and app-store copy also emphasize financing speed, quality inspection, return policies, and easy paperwork. But that positive proof is not the whole story. User complaints and 2025 layoff coverage indicate that Cars24 still carries meaningful execution risk around documentation, support, and adjacent bets. The adverse signals are specific enough to matter—particularly RC transfer delays, payment disputes, and strategic retrenchment from non-core experiments—yet not broad enough to negate the evidence of category scale. Later chapters should
    therefore treat Cars24’s trust proposition as real, commercially differentiated, highly scaled, resilient, and still operationally fragile.
  claimRefs:
