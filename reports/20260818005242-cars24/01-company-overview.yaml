- id: leadership-and-governance
  title: Founders, leadership transition, and governance visibility
  body: 'The retained evidence makes Vikram Chopra the clearest current control and strategy anchor, but it does not yet provide a public-company grade governance pack. Older high-reputation coverage and current company materials align that Cars24 was founded by Vikram Chopra, Mehul Agrawal, Ruchit Agarwal, and Gajendra Jangid. In 2026, however, the public narrative shifted: the investor-relations page says Mehul and Gajendra stepped down from executive roles while remaining economically and strategically involved, with Mehul staying on the board and Gajendra continuing as a brand adviser. The FY25 annual return gives a formal director list for the Singapore holdco, which is helpful but still incomplete for diligence because it does not disclose committee structure, investor-rights architecture, or the preference stack in a way that would let investors fully map control, veto rights, or succession design. The right read-through is founder continuity plus improving delegation, but still under-disclosed
    governance, especially around committees and investor controls.'
