- id: capital-history-and-financial-inflection
  title: Capital history and operating inflection
  body: 'Cars24’s capital history shows a company that scaled aggressively in 2021, then spent 2024-2026 proving that the model could move toward profit without surrendering category ambition. High-reputation reporting places the September 2021 round at roughly $450 million and the December 2021 round at another $400 million, which pushed the valuation to $3.3 billion and funded expansion, refurbishment infrastructure, and lending. The more recent story is less about outside capital and more about internal operating leverage. Official H1 and H2 FY26 letters report sequential improvement in adjusted net revenue, major loan-disbursal growth, and the company’s first profitable quarter in Q4 FY26. Annual-return filings also show that the group still carries meaningful borrowings and negative accumulated earnings even as liquidity remains material. That mix supports a balanced view: Cars24 has genuine scale and clear profitability progress, but the equity story still relies on sustained execution
    rather than on fully resolved balance-sheet or disclosure risk.'
