      - number: '5.3'
        title: 嵌入式金融、经销商工具与车主服务
        blocks:
          - type: paragraph
            body: >-
              CARS24 的产品范围越来越超出车辆买卖那一刻。Loans24 现在通过单独但与公司相连的数字界面营销二手车贷款、车辆抵押贷款、个人贷款和追加贷款产品；主 App 描述也明确加入 FASTag、罚单缴费、RC
              过户、GPS 追踪、保险、道路救援和报废服务。经销商 App 和入驻页面又展示了另一条变现通道：商业伙伴每天可以竞拍数千场拍卖，使用回购和融资工具，获取详细检测报告，并使用 RC
              过户支持。广度有战略意义，因为它加深客户终身价值，也让公司围绕同一辆车和同一段客户关系有更多变现方式。

              关键产品洞察是，服务组合不是随机附加项。融资降低购买摩擦，RC 过户支持减少卖家焦虑，经销商工具提升流动性，车主服务在车辆易手后创造复用接触。实际效果是，CARS24
              正围绕交易拼装一套车辆拥有操作系统。弱点在于，旁路服务的变现深度、挂钩率和失败率大多仍未披露。公开证据显示各条通道存在且正在产品化；但还没有显示装机基础中到底有多少使用每条通道，或每条通道扣除支持和合规成本后有多赚钱。
