            body: >-
              最强采用证据位于官方运营更新和面向客户的产品页面交叉处。H1 FY26 材料称，公司主要地理市场的月活受众超过 11 million；H2 FY26 和 Business Today
              又把这个图景扩展到更宽的车主服务层，约 3.5 crore 到 3.8 crore 月度用户围绕保险、历史查询、融资、FASTag 和合规互动。经销商和卖家界面又增加一个增长信号：CARS24 称现在支持
              20,000-plus 名认证竞买人、4,000-plus 名渠道伙伴、过去一年售出 50,000-plus 辆伙伴挂钩车辆，并在印度数百个城市提供支持或分支覆盖。

              数字有意义，但它们使用的分母不同。MAU、独立用户、经销商、渠道伙伴、贷款和售车量不能互换。后期投资者应把采用图景理解为规模明确很大，但定义并不均匀。公司有足够公开规模证明真实需求，以及车主生命周期中的重复触点；但还没有足够分层披露说明到底有多少用户转成复购买家、多少卖家后来再进入买家池，或月度车主服务流量中有多少变现为持久收入。
