      - number: '8.2'
        title: 可比估值框架和相对倍数纪律
        blocks:
          - type: paragraph
            body: >-
              可比公司组要求细看，而不是直接复制倍数。Carvana 说明，当增长和战略稀缺性占优时，市场有时会为规模化、技术驱动的二手车平台支付高价；AUTO1
              说明，即使是大型盈利二手车平台，公开市场投资人也可能只给低得多的收入倍数；CarTrade 说明，盈利的印度上市交易平台 即便收入基数小得多，也能拿到较高的盈利估值框架；Spinny
              则说明，印度私募同业也躲不开估值重置。合起来看，这些数据点把 CARS24 放在两个极端之间。它的 2021 年标记远高于当前 AUTO1 式公开市场纪律，也高于 Spinny 最近私募轮次，但仍低于
              Carvana
              的高溢价公开市场视角。结论很简单：公司也许配得上溢价，但溢价必须靠更干净的盈利能力和披露来防守，不能只靠叙事。正因为价差如此大，入场纪律比被头条估值吸引更重要：同一赛道会因报告质量、盈利能力和投资人对治理的信心不同，出清在很不一样的价格。
