      - number: '1.4'
        title: 渠道规模、客户信号与警示证据
        blocks:
          - type: paragraph
            body: >-
              当前公开记录在渠道广度上异常丰富，在客户信任结果上却异常混杂。官方伙伴材料描述了庞大的经销商网络：数千名渠道伙伴、数百家分支、拍卖准入、RC 过户支持和融资项目。材料强化了 Cars24
              的主张：公司运营的是消费者和经销商双通道，而不是狭窄的 B2C 门店。公司筛选后的客户证言和 App 商店文案也强调融资速度、质量检测、退货政策和简化文书。但正面证据并不是全部。用户投诉和 2025
              年裁员报道显示，Cars24 在文档、支持和相邻业务押注上仍有实质执行风险。反向信号具体到足以影响判断，尤其是 RC
              过户延迟、付款纠纷，以及从非核心实验中战略收缩；但范围还不足以否定品类规模证据。因此，后续章节应把 Cars24 的信任主张视为真实、商业上有差异化、规模很大、韧性较强，但运营上仍脆弱。
