      - number: '2.3'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              印度二手车市场的需求逻辑很强，因为多个驱动因素彼此强化。新车涨价和 Bharat Stage VI
              合规成本把许多家庭推向二手库存；二手车销量增速已经高于新车；数字发现和融资减少了过去让买家留在不透明本地渠道里的摩擦。基于 CRISIL 的报道称，FY26 二手车销量应超过 6 million
              辆；Autocar-Spinny 的研究则显示，折旧曲线和融资可得性让二手车越来越像理性选择，而不是次优选择。Redseer 和 IMARC
              又补了一层：更短的换车周期、中产阶级出行需求增长，以及二线、三线城市采用加深，都可以扩大可触达池。

              但采用路径并不顺滑。多份留存来源强调，组织化玩家在赚取稳定回报之前，仍要先吸收客户获取、物流、翻新、技术和营运资本上的重成本。CRISIL 预计六家组织化玩家将在约 12 到 18
              个月内达到运营盈亏平衡；但同一证据也说，在此之前，流动性和及时融资仍很关键。因此，市场可以同时结构性诱人、运营上不留情面：庞大需求并不会消除把非正式销量转化为可盈利、可重复正规交易的执行风险。
