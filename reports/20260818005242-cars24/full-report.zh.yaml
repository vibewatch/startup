      - number: '5.4'
        title: 信任、安全、合规与用户反馈
        blocks:
          - type: paragraph
            body: >-
              信任基础设施是 CARS24 产品故事的核心，因为印度二手车交易背着质量不确定、文件风险和售后纠纷。官方界面显示，公司试图控制这些信任关键步骤：300 点检测、CarTruth
              PDI、终身和限期保修产品、Seller Kavach 责任覆盖、实时 RC 过户可见度，以及覆盖网页、移动端、API
              和后端服务的公开安全披露计划。对一家后期市场平台来说，上述控制信号有意义，因为它的产品依赖消费者相信检测报告和文书支持。

              但外部反馈清楚表明，信任执行仍不均匀。Google Play、ConsumerComplaints、JustUseApp 和 Trustpilot 都保留了负面用户报告，内容包括 RC
              过户延迟、线上报价与实际定价差异、退款摩擦、保修覆盖争议和售后服务不一致。Google Play 还披露，App 可能共享或收集多类个人数据，并称 App
              数据未加密；对一个越来越处理金融和文档工作流的平台而言，属于明显的产品信任瑕疵。正确解读不是信任栈是假的，而是控制界面真实存在，但结果仍嘈杂到足以让尽调测试解决速度、异常处理和政策执行，而不是依赖表面承诺。
