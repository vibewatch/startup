      - number: '4.3'
        title: 资产负债表、放贷敞口与资本充足性
        blocks:
          - type: paragraph
            body: >-
              CARS24 仍是资本密集型企业，因为它同时为库存、放贷、翻新和品类扩张提供资金。FY25 年度申报显示，现金和定期存款为 $182.4 million；但剔除短期定存后，现金流量表中列为现金及现金等价物的只有约
              $10.4 million。2025 年 3 月，集团借款仍约 $127.4 million，另有约 $50.6 million 未提取借款额度。贷款和垫款仍很大，约 $135.0
              million；申报文件称，贷款组合主要是印度二手车融资，并以被融资车辆抵押作担保。这不是轻资本资产负债表。

              放贷业务具有战略重要性，因为它既是转化工具，也是独立利润池。H1 FY26 材料称 LOANS24 是资产质量改善中的强利润池；H2 FY26
              材料称，共同放贷让账簿可以增长数倍，而不需要等比例股本。结构在财务上有吸引力，但也意味着 Cars24 的投资案例部分取决于承销质量和资金结构，而不只是二手车需求。2025 年 8 月母公司注资 Rs 345.2
              crore 因此应被解读为支撑项，同时也提醒投资者：公司迈向 IPO 准备时仍需要资产负债表弹性。
