      - number: '8.3'
        title: 显性不确定性下的乐观、基准和悲观情景逻辑
        blocks:
          - type: paragraph
            body: >-
              这里可以做情景思考，但不能装出精确。公开证据足以判断方向，不足以给出精确入场价。乐观情景假设，FY26 盈利不是单季里程碑，而是持久转向的起点；贷款账簿质量在业务放大时仍受控；DRHP
              准备变得可见；车主服务交叉销售抬高客户终身价值，同时不迫使资产负债表承受更多压力。基准情景假设这些改善继续推进，但披露仍不完整，因此上一轮估值看起来说得通，却仍难以高置信度承销。悲观情景假设，同业估值压力、治理或上市延误，或经营杠杆反转，推动市场把公司重置到更接近当前印度同业的水平。由于上一次真实外部价格发现已经很久，估值判断必须继续对价格和里程碑敏感。
