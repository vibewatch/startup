      - number: '1.3'
        title: 资本历史与运营拐点
        blocks:
          - type: paragraph
            body: >-
              Cars24 的资本历史显示，公司在 2021 年激进扩张，随后在 2024-2026 年证明模型可以向盈利靠拢，同时不放弃品类野心。高可信报道称，2021 年 9 月一轮融资约 $450
              million，2021 年 12 月又融资 $400 million，把估值推到 $3.3 billion，并为扩张、翻新基础设施和放贷提供资金。近期故事不再主要围绕外部资本，而是围绕内部运营杠杆。官方 H1
              和 H2 FY26 信件披露，调整后净收入环比改善，贷款发放大幅增长，公司在 Q4 FY26
              实现历史上首个盈利季度。年度申报还显示，尽管流动性仍然可观，集团仍背着有意义的借款，累计收益也为负。组合支持一个平衡判断：Cars24
              有真实规模，也有明确盈利进展；但股权故事仍依赖持续执行，而不是资产负债表或披露风险已经完全解决。
