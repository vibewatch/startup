      - number: '2.2'
        title: 买家、用户与渠道分层
        blocks:
          - type: paragraph
            body: >-
              印度二手车买家不是一种同质画像。留存来源持续指向几个不同子群：首次购车者、看重性价比的升级买家、大城市便利型买家，以及在二线或三线城市寻找可负担个人出行的家庭。Mobility Intelligence
              Report 称，约 80% 到 82% 的二手车买家是首次车主，比例本身强化了一个判断：二手车品类是汽车拥有的入口，而不只是发烧友的替换渠道。融资可得性会实质改变谁能买车：留存研究显示，过去五年渗透率从 16%
              翻倍至 32%，组织化平台上近 60% 的交易带有融资。因此，承销、贷款方合作和价格透明度是市场的核心特征，不是可有可无的附加项。

              渠道设计和买家类型同样重要。线下和非正式路径仍主导许多交易，但官方竞品页面显示，组织化市场已有几种可行格式：OLX、CarWale 和 CarDekho 以列表驱动发现；Maruti Suzuki True
              Value 靠 OEM 认证建立信任；CARS24 或 Spinny 做全栈认证零售。每条路径都在解决同一消费者任务的不同版本。对 CARS24 的市场含义是，它竞争的不只是其他 VC
              支持的平台，还包括庞大的列表池和密集的 OEM 支持经销商网络；对手本来就有很强的本地信任和供给入口。
