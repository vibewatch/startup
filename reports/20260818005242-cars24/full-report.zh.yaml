  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与主要原型
        blocks:
          - type: paragraph
            body: >-
              CARS24 所处的竞争格局，不是简单列出几个 VC 支持的库存型同行。留存来源包显示，至少有四类有意义的竞争者。第一类是直接的全栈线上二手车零售商，例如 Spinny，它在检测、认证、融资、交付和购后承诺上与
              CARS24 高度重叠。第二类是发现驱动、流量优先的模式，例如 CarWale、CarTrade、OLX 和 CarDekho 的一部分；它们不一定需要拥有或翻新库存，因此能以更低资产强度触达客户。第三类是
              OEM 认证项目，例如 Maruti Suzuki True Value，靠品牌信任、服务网络和标准化检测竞争。第四类是混合生态玩家，把二手车作为更宽的汽车媒体、融资或服务栈中的一条产品线。

              买家可以用多种方式完成同一任务，竞争含义因此变大。他们可以选择信任更重的库存平台，也可以浏览巨大的列表宇宙，或留在 OEM 认证生态内。因此，只有当买家认为 CARS24
              的检测、融资和车主服务栈，比更低价格、更宽原始列表库存或 OEM 徽章带来的安心更有价值时，CARS24 才能赢。竞争问题不是谁的宣传册最好看；而是哪种模型能把信任转成可重复经济，同时不牺牲太多广度或价格竞争力。
