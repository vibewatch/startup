      - CR031
      - CR035
      - CR038
      - CR039
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: CARS24 有真实规模，经济性也在改善，但价格发现陈旧、披露缺口仍在，建议仍停留在观察 / 继续研究。
    data:
      nodes:
        - id: n1
          label: $3.3B 旧锚点
          detail: 2021 年外部轮融资很强，但已经陈旧
        - id: n2
          label: 规模是真实的
          detail: 历史收入接近 $1B，FY26 经济性也在改善
        - id: n3
          label: 有可选性
          detail: 零售占比、贷款和用车服务可以加深变现
        - id: n4
          label: 披露缺口仍在
          detail: 没有新的公开价格发现，未见 DRHP，股权结构细节不完整
        - id: n5
          label: 同业约束很重要
          detail: AUTO1、CarTrade、Carvana 和 Spinny 划出一个很宽但有用的区间
        - id: n6
          label: 建议：观察
          detail: 保持跟踪，但买入前必须看到更强证据
      edges:
        - from: n1
          to: n6
        - from: n2
          to: n6
        - from: n3
          to: n6
        - from: n4
          to: n6
        - from: n5
          to: n6
    approximationNotes: 逻辑链反映留存公开证据和明确的缺失数据约束。
    claimRefs:
      - CV001
      - CV007
      - CV025
      - CV027
      - CV028
      - CV038
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最大敏感项是分母可见性、贷款质量、治理准备度和利润率韧性。
    data:
      items:
        - label: 法定收入 / 盈利可见性
          value: 10
        - label: 贷款账簿质量和资金结构
          value: 9
        - label: 上市准备度和治理清晰度
          value: 9
        - label: 零售占比和利润率韧性
          value: 8
        - label: 投诉 / 信任正常化
          value: 8
        - label: 交叉销售可选性兑现
          value: 7
        - label: 市场增长顺风
          value: 6
    approximationNotes: 0-10 序数投资测算敏感度，不是公司披露指标。
