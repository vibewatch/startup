      - number: '4.4'
        title: 财务结论与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              按目前留存证据，CARS24 的财务结论偏建设性，但还没有达到公开市场可承销的清洁度。正面案例是真实的：集团收入已经很大；FY26
              调整后净收入增长；亏损大幅收窄；零售结构改善；放贷看起来在扩张且没有明显信用爆雷；AI
              驱动的自动化正在明显打击检测、放款、客户支持和工程等成本驱动项。这类变化不是表层变化，足以把一家后期私营公司从纯增长依赖，推向更持久的盈利叙事。

              但剩余缺口仍很重要。公司不披露城市级贡献利润、完整现金消耗计算、渠道级抽佣率，也不披露批发、零售、市场、放贷和车主服务之间的精确盈利结构。外部报道还使用彼此重叠但并不完全相同的标签，例如收入、调整后净收入、EBITDA
              亏损和运营亏损，外部三角验证因此更难。因此，投资者应把这门生意视为明确改善但仍很吃尽调：它好过盲目增长故事，但今天还不够透明，无法用公开股权的精度承销。
