      - number: '2.4'
        title: 对 CARS24 市场位置的启示
        blocks:
          - type: paragraph
            body: >-
              具体到 CARS24，市场章节给出的结论很实际：成功更多取决于赢下品类正规化，而不只是参与一个大品类。章节级别最强支撑来自 Redseer、CARS24 自己的投资者材料、基于 CRISIL
              的报道和官方竞品页面。来源合在一起指向一个市场：信任、融资和供给聚合仍是最大的转化杠杆。CARS24
              自己的投资逻辑也很明确：可负担性更多受二手车信贷和标准化估值约束，而不是受购买意愿约束；其介绍材料还认为，全栈数字优先玩家目前仍只控制很小一部分市场。组合本身令人鼓舞，因为它意味着只要执行保持克制，份额提升仍有空间。

              同时，留存证据并不足以让人对 CARS24 真实 SAM 或近期份额上限给出虚假精确度。已发布的组织化份额估算差异很大，城市级可变现队列的公开数据偏薄，竞争性组织化路径现在包括列表巨头、OEM
              认证项目和逐渐成熟的全栈同行。正确结论是建设性但自律：印度二手车市场足够大，可以容纳多个规模化赢家；但只有那些把融资、检测和物流转成持久单位经济、且不在 IPO
              准备完成前耗尽资本的平台，才应获得后期私募或公开市场溢价。
