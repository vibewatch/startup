      - number: '6.3'
        title: 具名客户与伙伴证据
        blocks:
          - type: paragraph
            body: >-
              CARS24 的公开客户证据多于许多后期私营市场平台，但仍高度依赖轶事。公司自有客户证言页面保留了具名买家和卖家的引述，例如 Arjun 强调零首付轻松融资和一天放款，Rutil Suthar
              称赞文书处理和交付支持。伙伴侧，经销商入驻页面引用 Bangalore 的 Superior Motors，称 Unnati 融资项目帮助其两年内增长约
              200%。独立评论界面则提供反向证据，而不只是促销证据：具名 Google Play、Trustpilot 和投诉板用户描述了顺利交易，也描述了围绕定价、RC 过户和支持的痛苦故障。

              组合有用，因为它证明产品在真实生活中被 B2C 和 B2B
              两端使用。只是，具名证据还不是企业级参考证据。它很少披露交易价值、复购频率、留存时长或经济性。最强的具名参考大多是单个轶事，而不是队列摘要。正确的尽调结论是，公开客户证据真实且近期，但在客户证言质感上远强于可用于决策的留存或扩张计算。
