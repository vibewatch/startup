  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与付费方
        blocks:
          - type: paragraph
            body: >-
              CARS24 的客户基础最好理解为多边网络，其中买家、用户和付费方角色不同，而不是一个单一“购车者”群体。在需求侧，最可见的分层是零售二手车买家、需要融资帮助的首次购车者，以及使用 FASTag、RC
              过户、罚单缴费和合规工具等购后服务的车主。在供给侧，核心分层是希望快速变现、降低文书风险的个人卖家，以及需要拍卖库存、融资和文档支持的经销商或渠道伙伴。各群体使用不同界面，但公司越来越试图把它们留在同一个操作系统内。

              结构很重要，因为收入质量和客户耐久性可能因分层而异。零售买家可以带来融资、保修和车主服务挂钩。卖家加深供给，之后也可能转成买家。经销商伙伴提供流动性和规模，但也带来渠道依赖。车主服务用户某个月可能不买也不卖车，却仍与品牌保持互动。因此，公开证据支持一张宽客户地图，但还不能把用户数干净桥接到按分层划分的已变现复购队列。
