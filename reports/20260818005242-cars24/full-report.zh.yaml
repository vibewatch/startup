      - number: '8.4'
        title: 退出准备度、投资逻辑失效触发器和最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度在改善，但公开材料还没有证明到位。公司的口径像 IPO 候选人，近期报道也把盈利、重组和注册地调整放进这一过渡里。但投资人仍需要一整套能把故事转成投委会级承销的尽调包：经审计的 FY26/FY27
              桥接、零售与批发经济性、完整贷款账簿表现、资本结构和优先股堆叠、合作伙伴集中度、投诉正常化，以及可见的上市时间表。在这些事项浮出水面之前，最聪明的决定是保持参与，同时守住纪律。上行情景足够真实，值得关注；但如果盈利停滞，或价格仍锚定
              2021 年叙事而不是当前风险调整后的证明，下行情景也同样真实。这里的好治理意味着，扩大估值信心之前先要求里程碑；也意味着，任何围绕上市的表面紧迫感都应改善披露，而不是替代披露。
