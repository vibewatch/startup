      - number: '7.4'
        title: 人员、治理和可量化的投资逻辑失效点
        blocks:
          - type: paragraph
            body: >-
              治理问题的核心不是创始人魅力，而是 IPO 式过渡期里管理层带宽能否守住。The Economic Times 和 IPO
              相关报道合在一起，指向三重压力：高管流动、反向翻转或注册地调整，以及公司一边证明盈利能力、一边重组非核心押注。这些动作可以是理性的，但也会在客服、贷款控制和披露纪律最需要改善时，争夺管理层注意力。正确做法不是把公司打成不可投，而是先设否决条件。如果
              DRHP
              递交持续延后，如果投诉强度不下降，如果合作伙伴集中度或违约曲线仍不透明，或者增长提速后一旦盈利改善反转，投资逻辑就应快速下调。反过来，如果公司能证明投诉处理更干净、贷款披露更好、上市准备更顺，当前这组风险也能明显压缩。
