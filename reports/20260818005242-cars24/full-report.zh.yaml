              从运营看，CARS24 仍像一个靠更好软件包装起来的重运营系统。FY25 年报显示，借款规模不小；把定期存款从现金等价物中剥离后，现金画像更紧。FY26 H1 和 H2 材料显示，零售占比、贷款和 AI
              提效正在改善经济性，但同一批证据也凸显，公司必须让很多环节同步运转：检测、整备、融资、客服、RC
