      - number: '3.2'
        title: 能力、定价与模式差异
        blocks:
          - type: paragraph
            body: >-
              最锋利的直接比较在 CARS24 和 Spinny 之间。官方 CARS24 材料强调 300 点检测、AI 驱动固定定价、30 天退货权、回购、法律支持、融资和车主服务。Spinny
              的承诺更窄，但高度围绕信任：200 点检测、认证、保修、金融和退款保障。因此，CARS24 看起来更宽、更生态化；Spinny 看起来更可控、更纯零售。两个模型都不是在所有场景中明显更优。CARS24
              可能在车源广度、经销商通道和附属变现上胜出；Spinny 则可能显得更简单、筛选更紧。

              其他竞争者从不同角度进攻。CarWale、OLX 和 CarDekho 靠聚合巨大列表池和买家流量竞争，做法可以降低获客成本，也能满足不需要平台控制库存旅程、只想找便宜车的购物者。True Value 靠 OEM
              信任和线下网点竞争。CarTrade Tech 给更轻、流量驱动的模型加入披露和公开市场纪律，同时继续向二手车工具和融资伙伴关系加深。结论是，CARS24
              不是只在打一家长得像自己的公司；它同时对抗多个业务模型，而这些模型有不同成本结构和信任主张。
