  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 有证据支撑的风险排序，以及为何风险栈仍为中高
        blocks:
          - type: paragraph
            body: >-
              对 CARS24 来说，最高价值的风险问题不是业务有没有需求；公开证据已经显示庞大用户触达、有意义的贷款发放、全国性卖家和伙伴版图，以及 Q4 FY26 首个盈利季度。问题在于，当公司推进 IPO
              准备时，法律、监管、服务质量和资本需求是否仍受控。公开记录指向一个中高风险栈：放贷规则在收紧，投诉处理在 RBI
              指引下变得更正式，过户和退款流程仍可能很慢；而且公司运营密度高，因为交易、翻新、融资和车主服务绑在一起。重要的是，证据并未显示重大执法危机；它显示的是一家快速改善的企业，仍背着消费者保护、资产负债表和执行敞口。投资者应把上述敞口转成文件要求和阈值触发，而不是一笔带过。因此，风险排序应被视为承销仪表盘：如果积压、投诉质量、融资依赖或上市准备同时恶化，即使销量看起来仍健康，风险严重度也会迅速上升。
