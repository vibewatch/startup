  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              CARS24 应被建模为多车道的车辆拥有平台，而不是单一买卖网页。官方 Why Cars24
              和购车透明度页面至少展示了三条不同交易通道：自有库存零售、经过验证的直接卖家市场库存，以及面向经销商的拍卖或伙伴渠道。三条通道外面又包着融资、保修、RC
              过户支持、FASTag、罚单缴费和检测产品，把用户在初始交易之后继续留在同一生态内。关键在于，产品承诺不只是发现，而是减少检测、文书、融资和售后保护中的不确定性。

              工作流证据也很具体。买家看到的是质量检查后的库存、AI 关联定价、检测报告、保修选项，以及 30 天退货或维修窗口。卖家可以预约检测、获得数字估值指引，并在交车后依靠 RC 过户和法律支持承诺。经销商通过伙伴
              App 和入驻页面进入单独运营流程，其中强调每日拍卖、回购、融资、文书和透明竞价。结果是一张宽产品界面，靠交易控制、信任工具和服务挂钩变现，而不是只靠流量。
