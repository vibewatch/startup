        - 私募可比公司继续下修，或经营杠杆消退
        - $1.4B-$2.2B 区间更合适
        - 领导层 / 上市节奏延误、利润率反转或信贷压力
        - 类似 Spinny 的重估、更高风险溢价和薄弱披露
      - - 战略可选性叠加
        - 车主服务和融资加深用户参与，但经常性收入可见度仍不完整
        - 能支撑更好的退出结果，但单靠它无法给出精确倍数
        - 如果附加销售率或留存偏弱，可选性可能落空
        - 交叉销售指标和复购明显改善
    notes: 情景区间是基于公开证据推导的估计带，不是已报价交易或管理层指引。
    claimRefs:
      - CV028
      - CV031
      - CV035
      - CV036
      - CV037
      - CV042
  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考价值
      - 局限
    rows:
      - - CARS24（2021 轮）
        - 私募融资定价
        - $3.3B 名义估值
        - 公司自身锚点和战略基准
        - 旧定价；近期没有外部轮次刷新
      - - Spinny（2025 年 3 月）
        - 私募融资定价
        - $1.7B-$1.8B
        - 最接近的印度二手车私募可比公司
        - 业务组合不同，且随后估值重置
      - - Spinny（2026 轮）
        - 私募融资定价
        - $1.4B-$1.5B
        - 显示当前私募市场更谨慎
        - 新股和老股交易混合；仍是私营公司且不透明
      - - CarTrade Tech（2026 年上市公司）
        - 印度上市可比公司
        - ~INR 134.05B 市值；~16.6x 收入；~62.8x 盈利口径
        - 显示印度市场愿意为有盈利质量的平台型公司支付什么价格
        - 规模更小、资产更轻，结构也不同
      - - AUTO1（2026 年上市公司）
        - 欧洲上市可比公司
        - ~$5.30B 市值；~0.5x 收入
        - 可反映规模化二手车公司的公开市场估值纪律
        - 地域、资本市场和盈利画像不同
      - - Carvana（2026 年上市公司）
        - 美国上市可比公司
        - ~$104.29B 市值；~4.6x 收入
        - 全栈模式的高端溢价基准
        - 公开市场溢价异常高，规模也大得多
    notes: 列举范围有限：这是示例性可比公司组，不是对所有相关汽车、市场平台或金融科技基准的穷尽清单。
