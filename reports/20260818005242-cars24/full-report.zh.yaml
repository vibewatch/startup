      - number: '4.2'
        title: 盈利路径与单位经济信号
        blocks:
          - type: paragraph
            body: >-
              CARS24 近期财务画像中最强的正面因素，是 FY26 盈利能力改善的速度。官方 H1 FY26 材料披露，调整后净收入约 Rs 651 crore，调整后 EBITDA 亏损 Rs 162 crore。到
              H2 FY26，调整后净收入升至约 Rs 760 crore，调整后 EBITDA 亏损收窄至 Rs 38 crore；Q4 FY26 则成为公司历史上首个盈利季度，调整后 EBITDA 约 Rs 20
              crore。管理层还表示，零售结构和增值服务挂钩承担了大量改善任务：零售现在贡献超过一半交易 GMV，H2 零售 GMV 超过 Rs 2,400 crore，利润率明显好于批发。

              即便如此，公开记录仍不足以搭出真正的单位经济模型。我们能看到方向：更高零售占比、更好的 GPU、更强的放贷贡献，以及 AI
              带来的显著成本节约；但仍无法干净桥接单车毛利、城市级贡献利润，或按队列计算的真实现金回本周期。独立印度实体报道也显示，FY24 到 FY25 的过渡更颠簸：本地层面收入下降、亏损扩大，随后 FY26
              的官方运营更新才体现改善。正确解读是经济性在改善但透明度未解决，而不是利润率已经成熟。
