  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、规模与结构
        blocks:
          - type: paragraph
            body: >-
              财务建模应把 CARS24 当作交易很重的运营型业务，而不是薄薄一层分类信息。FY25 年度申报显示，集团来自客户合同的收入约为 $934.9 million，低于 FY24 约 $1.0 billion；H1
              和 H2 FY26 业绩更新则显示，管理层越来越把投资者引向调整后净收入，而不是原始
              GMV。转向很重要，因为业务现在把车辆交易、融资发起和车主服务放在同一套栈下。公司明确表示，部分市场交易即便在平台外闭合，Cars24 仍能赚取佣金、增值服务或融资收入，因此只看原始 GMV
              会越来越低估已变现工作流。

              独立的 FY24 印度业务报道补上了运营肌理。Cars24 称 FY24 印度收入约达 Rs 6,917 crore，卖出超过 200,000
              辆车，大多数收入仍绑定核心卖车活动。来自金融服务、保险协助、保修、停车和服务费的附属收入在增长，但收入引擎仍高度依赖库存周转、定价、融资挂钩和售后服务变现。财务结论是，CARS24
              正在演进成更宽的车主平台，但其盈利质量本质上仍锚定大规模汽车交易。
