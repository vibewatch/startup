      - number: '5.2'
        title: AI、检测与运营架构
        blocks:
          - type: paragraph
            body: >-
              CARS24 谈运营层而不是代码级系统时，公开架构证据最强。AI 季报、Business Today、Business Standard
              和质量基准文章共同描述了一套栈：它连接客户对话、检测和定价、放贷工作流、文档智能与枢纽运营。到 AMJ 2026，公司称 80% 的检测和 65% 的贷款发放由 AI
              主导，并有数百万次工作流执行和文档处理事件喂入同一运营模型。于是产品栈明显比分类信息网站更技术化，因为估值、承销、支持和检测都依赖共享数据和模型输出。

              不过，公开记录仍是一张运营架构图，而不是软件架构图。我们可以验证数据规模、工作流自动化、工具密度和 AI 辅助工程；但无法验证云设计、数据权利治理、正常运行时间、API
              边界或模型评估控制。公司最强的可防守资产看起来是长期积累的检测和交易数据，并与线下枢纽网络连接起来，而不是一个公开记录充分的开发者平台。因此，投资者应把 CARS24
              按数据丰富、自动化很重来承销，但还不能按一个披露透明、有公开级技术材料的软件平台来承销。
