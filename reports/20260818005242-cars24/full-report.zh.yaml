      - number: '5.5'
        title: 产品技术结论与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              留存证据足以说明，CARS24 对一家二手车公司而言有真实且异常宽的产品栈。它覆盖买家和卖家工作流、自有和市场库存、经销商流动性、贷款、检测、保修、PDI 和车主服务，同时把 AI
              推入检测、放贷、支持和工程。如果数据与工作流循环继续复利，这就是实质性运营护城河。公司看起来已经不再是薄薄的获客线索层。

              剩下的问题是披露质量。公开资料证明广度和自动化，比证明耐久性、安全成熟度、服务可靠性或技术可防守性更有力。没有公开状态页，没有审计级安全认证组合，没有披露检测和保修承诺的缺陷率或索赔率序列，也没有清晰架构细节说明
              AI 层到底有多少自研、多少由供应商工具拼装。投资者因此可以把 CARS24
              按数据密集、运营支撑的产品平台来承销，并承认它有真实工作流控制；但还不能把它当作完全透明的软件护城河。最大下一步尽调，是验证公司公开信任承诺在大规模反向边缘案例下是否仍撑得住。
