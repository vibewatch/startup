      - number: '3.3'
        title: 分发能力、切换成本与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              市场分发能力不只属于一种模型。CARS24 声称拥有庞大需求规模、经销商触达和多个变现引擎，但留存竞品证据显示，其他地方也有同样真实的替代强项。CarWale 宣传超过 110,000 条二手车列表和超过 3.5
              million 月度二手车买家。OLX 宣传超过 311,000 条二手车列表，并强调直接卖家聊天。CarDekho 宣传超过 57,000 辆二手车，同时仍嵌在更宽的新车和内容生态中。Maruti Suzuki
              True Value 称其在 334 个城市有 652 个网点、超过 six million 名 客户，构成有意义的线下网络信任优势。CarTrade Tech 披露 CarWale 和 OLX India
              每年有海量独立用户，说明分发可以不靠把每辆车都背在资产负债表上建立起来。

              因此，CARS24 的护城河比头部品牌看上去更窄。它取决于检测深度、融资准入、车主服务和经销商通道，能否让客户更愿意通过 CARS24
              交易，而不是选择更便宜或更熟悉的替代方案。上述切换成本有意义，但并非攻不破。OEM 项目可以在信任上竞争，分类信息可以在广度和价格发现上竞争，Spinny 可以在可控筛选上竞争。CARS24
              的护城河在买家看重便利和确定性胜过议价时最强；在买家更看重车源、最低价或单一品牌服务舒适度时最弱。
