  - id: TV005
    title: 投资逻辑破裂和止损触发表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 上市准备延误
        - 管理层仍给出 IPO 窗口，但看不到申报进展
        - 上市从短期估值催化变成叙事风险
        - 下调信心，坚持更低进入价格
      - - 盈利反转
        - FY26 / Q4 拐点后，FY27 经营杠杆回落
        - 削弱支撑溢价估值的核心论据
        - 转向悲观情景定价
      - - 贷款账簿恶化
        - 披露没有改善，信贷质量或资金依赖反而恶化
        - 同时伤害盈利质量和风险评级
        - 提高折现率或暂停投资
      - - 投诉 / 信任摩擦持续
        - 规模上升后，客户摩擦证据仍未正常化
        - 削弱车主服务平台扩张叙事
        - 下调 LTV 假设，支持更低估值区间
      - - 治理 / 资本结构不透明
        - 流程后期，股权结构表、优先权或稀释条款仍不清楚
        - 即便收入规模仍大，下行情景也难以承销
        - 条款清晰前限制参与
    notes: 触发项要对照具体里程碑监测，而不是跟着模糊情绪走。
    claimRefs:
      - CV025
      - CV026
      - CV034
      - CV040
      - CV041
  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计的 FY26/FY27 衔接表
        - 法定收入、毛利、EBITDA、现金流和分部结构
        - 需要它把旧估值换算到当前分母
        - 财务团队 / 审计师资料包
      - - 资本结构
        - 优先股堆叠、清算压力、稀释和员工期权刷新
        - 没有它，就无法判断下行保护和进入价格
        - 法务 + 财务尽调
      - - 贷款账簿质量
        - 分年份损失、联合放贷占比、回收率和融资契约
        - 放贷既放大上行，也放大风险
        - NBFC 管理层 + 信贷资料包
      - - 客户质量
        - 复购买家占比、卖家再次入场、车主服务变现、投诉正常化
        - 可选性只有留得住、变得现才有意义
        - 运营 + 产品分析资料包
      - - IPO 准备度
        - 反向迁册状态、DRHP 时间表、董事会委员会和顾问
        - 催化剂时点会影响退出路径和估值支撑
        - CFO / 法律顾问 / 银行家
    notes: 这些请求是从叙事型尽调推进到投委会级承销的最低资料包。
    claimRefs:
