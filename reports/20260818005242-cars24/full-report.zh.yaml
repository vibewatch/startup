  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与表面规模
        blocks:
          - type: paragraph
            body: >-
              CARS24
              参与的是印度二手车市场中组织化的那一部分，而不是所有点对点、经纪撮合或非正式车场交易的总和。市场边界很重要，因为如果忽略正规零售必须解决的真实瓶颈，表面市场规模很容易被夸大：可信检测、融资准入、产权转移、翻新、城际物流和售后服务。Mordor
              Intelligence 估算印度二手车市场 2025 年约为 $36.39 billion、2026 年约为 $41.74 billion，到 2031 年 CAGR 为 14.72%；IMARC 给出的
              2025 年基数略大，为 $40.43 billion。估算在方向上有用，但它们覆盖的市场，在多份留存来源中仍由非组织化或线下渠道主导。

              对 CARS24 来说，更有用的信号不只是二手车总支出，而是交易向组织化、认证化、可融资、可线上发现的形态迁移。Redseer 把信任缺口和中介复杂度定义为品类核心结构性低效；基于 CRISIL
              的报道则显示，规模已经大到足以让组织化玩家在增长延续时有望达到运营盈亏平衡。因此，投资者应把 TAM 当作边界条件，把组织化份额迁移当作真正的承销变量。CARS24
              不需要拥有整个市场来证明规模；它需要拥有其中交易频次最高、可融资、对信任最敏感的部分。
