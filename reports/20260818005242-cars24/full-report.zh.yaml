        title: 创始人、领导层交接与治理可见度
        blocks:
          - type: paragraph
            body: >-
              留存证据让 Vikram Chopra 成为当前最清晰的控制权和战略锚点，但还没有给出上市公司级别的治理资料包。早期高可信报道和现有公司材料都指向同一件事：Cars24 由 Vikram Chopra、Mehul
              Agrawal、Ruchit Agarwal 和 Gajendra Jangid 创立。不过到了 2026 年，公开叙事发生变化：投资者关系页面称 Mehul 和 Gajendra
              已卸任高管角色，但仍在经济利益和战略上参与公司；Mehul 留任董事会，Gajendra 继续担任品牌顾问。FY25
              年度申报给出了新加坡控股公司的正式董事名单，名单本身有帮助；但对尽调仍不完整，因为它没有披露委员会结构、投资者权利架构或优先股堆叠，投资者还无法完整画出控制权、否决权和接班设计。正确解读是：创始人仍有延续性，授权分工在改善，但治理披露仍不足，尤其是委员会和投资者控制权。
