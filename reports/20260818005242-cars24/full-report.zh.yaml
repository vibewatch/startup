      - number: '6.4'
        title: 满意度、支持与复用信号
        blocks:
          - type: paragraph
            body: >-
              公开满意度证据方向偏正面，但远不干净。公司可以指向非常大的评论足迹，包括数十万条 Google Play 评论、数千页 Trustpilot 评价、具名客户证言，以及以 App 为中心的支持承诺，例如
              24/7/365 协助和 RC 过户通知。产品页面还定义了明确服务时间线，例如带融资的退货可能比现金退货耗时长得多，贷款相关退款可能需要 25 到 30
              个工作日。细节有价值，因为它们显示公司知道旅程中哪些环节会创造信任或挫败感。

              反面是，投诉强度仍清晰到足以影响判断。ConsumerComplaints、JustUseApp、Google Play 评论和 Trustpilot 都保留了 RC
              过户延迟、检测后定价不匹配、退款或支持摩擦，以及对保修覆盖或售后响应不满的报告。公开满意度因此呈现分化：工作流顺畅时，许多客户看起来满意；但边缘案例产生的摩擦足以让复购意愿和推荐质量按体验队列大幅分化。没有披露
              NPS、复购率或续约曲线时，支持质量仍是关键代理变量，而不是已经解决的尽调问题。
