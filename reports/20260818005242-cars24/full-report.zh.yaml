      - number: '6.5'
        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              CARS24 最强的扩张论点，是关系不会在初始二手车交易完成时结束。Business Today 的车主旅程框架、H2 FY26 车主服务受众，以及融资、RC 过户、FASTag
              和售后支持产品页，都指向一个有意为之的尝试：围绕车辆建立先落地、再扩张的循环。买家可以成为金融用户，车主可以成为 FASTag
              或合规用户，卖家之后可以成为买家，经销商也可以加深使用库存、回购和融资工具。客户模型因此宽于一次性交易，也提高了复用互动的概率。

              最大集中度风险同样清楚。大多数公开客户证据以印度为中心；经销商网络、城市覆盖、RC 过户流程、Aadhaar 和 PAN
              提及，以及大多数投诉，都处在印度特定运营通道内。经销商流动性对卖方价值创造也看起来很关键，因此渠道伙伴质量和消费者需求同样重要。最后，公司不披露头部客户集中度、复购买家占比、NRR
              式指标，或可靠的交叉销售转化率。公开案例支持强扩张意图，但还没有实测证明客户耐久性或集中度韧性。
