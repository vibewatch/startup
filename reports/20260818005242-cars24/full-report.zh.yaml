      - number: '3.4'
        title: 什么会改变竞争判断
        blocks:
          - type: paragraph
            body: >-
              最重要的竞争未解问题在经济性，而不只是功能。CARS24
              可以在产品广度上看起来强于对手；但如果获客、翻新、融资损失或营运资本强度比同行更差，仍可能表现落后。同样，流量驱动企业在信任上看起来较弱；但如果获客成本和变现深度好得多，仍可能跑赢。留存证据因此支持一个平衡判断：CARS24
              是印度最强的全栈二手车平台之一，但还不能把任何单一运营商视为永久主导者。

              三个变化会最快改变判断。第一，公开披露城市级单位经济，可以说明 CARS24 更宽的服务栈究竟是在复利，还是只是在增加复杂度。第二，若有更深证据说明经销商通道和自有零售各自驱动多少销量，可能会改变对其相对
              Spinny 运营杠杆的判断。第三，如果 OEM 认证或公开市场竞争者明显改善数字便利性和信贷分发，CARS24 的部分实际差异化可能被压缩。眼下，CARS24
              看起来位置不错、覆盖面广，但仍受竞争挑战，而不是竞争上已经稳固。
