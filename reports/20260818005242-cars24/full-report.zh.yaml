    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、平台模式与版图
        blocks:
          - type: paragraph
            body: >-
              CARS24 不应只按二手车分类信息品牌来承销。看它的投资者关系页面、运营更新和 App 披露，公司现在把自己定位成一个 AI
              原生汽车拥有平台，覆盖买车、卖车、融资、车主服务和最终转售。定位很关键，因为公开呈现的运营系统刻意宽于单一消费者零售漏斗：Cars24
              称，公司用同一套栈覆盖印度、阿联酋和澳大利亚，并从车辆交易、融资方案和车主服务中变现。官方文件也显示，集团的国际法律版图仍比前端印度品牌看上去更复杂：新加坡母公司 Global Car Group
              旗下在东南亚、阿联酋、沙特阿拉伯和澳大利亚都有子公司。给后续章节最稳妥的结论是，Cars24 是一个垂直整合、数据密集的消费级市场平台，背后有实质性的线下和金融基础设施，而不是单纯的获客线索网站。
