  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议、置信度与当前定价背景
        blocks:
          - type: paragraph
            body: >-
              公开证据支持继续紧密跟踪 CARS24，但不支持不看价格、直接按过时的 $3.3 billion 轮次标题买入。业务本身显然重要：法定口径收入已接近十亿美元，FY26 调整后经济性明显改善，Q4
              转为盈利，管理层还在把零售占比、贷款和车主服务推进成更宽的汽车拥有平台。但估值锚点已经陈旧，最近的支持性资本来自新加坡母公司，而不是新的外部领投方；公开证据也仍未显示已递交的 DRHP、最新经审计 FY26
              桥接，或完整的股权结构表 / 优先股图景。因此，正确姿态是观察 / 继续研究，置信度为中，估值立场介于偏高到合理。公司并非抽象意义上明显高估；只是公开透明度还不够，不能把 2021 年标记当作今天的出清价格。
