- id: buyer-user-and-channel-segmentation
  title: Buyer, user, and channel segmentation
  body: 'India''s used-car buyer is not one homogenous persona. Retained sources consistently point to first-time owners, value-conscious upgraders, metro convenience buyers, and tier-2 or tier-3 households seeking affordable personal mobility as distinct subsegments. The Mobility Intelligence Report says roughly 80% to 82% of used-car buyers are first-time owners, which reinforces that the category is an on-ramp to car ownership rather than merely a replacement channel for enthusiasts. Financing availability materially changes who can buy: penetration doubled from 16% to 32% over the last five years in the retained study, and nearly 60% of transactions on organized platforms are financed. That makes underwriting, lender partnerships, and price transparency central market features rather than optional add-ons.

    Channel design matters just as much as buyer type. Offline and informal routes still dominate many transactions, but official competitor pages show several viable organized formats: listings-led discovery at OLX, CarWale, and CarDekho; OEM-certified trust at Maruti Suzuki True Value; and full-stack certified retail at CARS24 or Spinny. Each route solves a different version of the same consumer job. The market implication for CARS24 is that it is competing not only against other venture-backed platforms but also against massive listing pools and dense OEM-backed dealer networks that already have strong local trust and supply access.'
