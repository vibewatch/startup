  evidenceGaps:
  - type: conflicting-data
    severity: material
    question: What is the best-supported current organized versus unorganized market split for India's used-car market.
    impact: Publisher estimates conflict materially enough that any single organized-share number would create false precision in CARS24's market model.
    nextStep: Reconcile 2026 or FY26 segmentation from a transparent primary survey or rating-agency dataset with definitions for vendor type versus sales channel.
    relatedClaimRefs:
    - CM005
    - CM008
    - CM026
    - CM040
    relatedTableRefs:
    - TM002
    relatedFigureRefs:
    - FM002
  - type: missing-disclosure
    severity: moderate
    question: What is CARS24's disclosed city-level serviceable market within the organized, financed segment.
    impact: The chapter can bound national TAM and category structure, but it cannot precisely size CARS24's city-density-driven SAM without more geography-specific disclosures.
    nextStep: Look for internal deck detail or future public filings that break out city coverage, contribution density, or financing attach by market cluster.
    relatedClaimRefs:
    - CM028
    - CM035
    - CM036
    relatedFigureRefs:
    - FM001
