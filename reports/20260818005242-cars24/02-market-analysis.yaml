- id: growth-drivers-and-constraints
  title: Growth drivers and adoption constraints
  body: 'The demand case for India''s used-car market is strong because several drivers reinforce one another. New-car inflation and Bharat Stage VI compliance costs push many households into pre-owned inventory; used-car volume is already growing faster than new-car volume; and digital discovery plus financing reduce the friction that historically kept buyers in opaque local channels. CRISIL-based reporting says used-car volumes should surpass 6 million units in FY26, while the Autocar-Spinny work shows that depreciation curves and financing availability increasingly make used vehicles feel like rational rather than second-best choices. Redseer and IMARC add another layer: shorter replacement cycles, growing middle-class mobility demand, and deeper tier-2 and tier-3 adoption can all expand the addressable pool.

    But the adoption path is not frictionless. Several retained sources stress that organized players still absorb heavy costs in customer acquisition, logistics, refurbishment, technology, and working capital before they earn steady returns. CRISIL expects six organized players to reach operating breakeven in roughly 12 to 18 months, yet the same evidence says liquidity and timely fund-raising remain critical until then. The market can therefore be both structurally attractive and operationally unforgiving: large demand does not remove the execution risk of converting informal volume into profitable, repeatable formal transactions.'
