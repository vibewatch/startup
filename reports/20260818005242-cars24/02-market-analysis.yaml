chapter:
  number: 2
  title: Market Analysis
  summary: India's used-car market is large, structurally underpenetrated, and still highly fragmented, but CARS24's real opportunity sits inside the narrower organized, trust-led, finance-enabled segment rather than inside all informal used-car trades. Retained 2025-2026 sources support a constructive demand outlook—more than 6 million used cars expected in FY26, used-car sales already larger than new-car sales, and organized platforms growing faster than the category—while also showing material uncertainty around organized-share estimates, persistent local-dealer power, and the capital intensity required to formalize the market.
sections:
- id: market-boundary-and-size
  title: Market boundary and headline size
  body: 'CARS24 participates in the organized slice of India''s used-car market, not in the full universe of every peer-to-peer, brokered, or informal lot transaction. That distinction matters because headline market-size figures are easy to overstate if they ignore the real bottlenecks that formal retail must solve: trusted inspections, financing access, title transfer, refurbishment, intercity logistics, and post-sale service. Mordor Intelligence sizes the India used-car market at about $36.39 billion in 2025 and $41.74 billion in 2026, with a 14.72% CAGR through 2031, while IMARC publishes a somewhat larger 2025 base of $40.43 billion. These estimates are directionally useful, but they cover a market where unorganized or offline channels still remain dominant in several retained sources.

    For CARS24, the more relevant signal is not just total used-car spend but migration toward organized, certified, financed, digitally discoverable transactions. Redseer frames trust deficit and intermediation complexity as the category''s core structural inefficiencies, while CRISIL-based reporting shows scale is now large enough that organized players can plausibly reach operating breakeven if growth persists. Investors should therefore treat TAM as a boundary condition and organized-share migration as the real underwriting variable. CARS24 does not need to own the whole market to justify scale; it needs to own the highest-frequency, financeable, trust-sensitive part of that market.'
