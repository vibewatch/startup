  severity: material
  question: What is the actual software and infrastructure architecture behind the AI workflow layer, including model governance, cloud dependencies, API boundaries, and uptime instrumentation.
  impact: The public pack proves operational AI usage and data scale, but not the technical durability or proprietary depth of the software stack.
  nextStep: Request architecture diagrams, model-evaluation processes, vendor dependency maps, incident history, and internal service-level objectives for the product and data platforms.
