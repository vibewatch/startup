- id: TE003
  title: Technology / operating architecture table
  enumeration: false
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Conversation AI layer
    - Handles voicebots, chatbots, and conversation intelligence across buying, selling, and financing
    - Access to historical conversation data and workflow orchestration
    - Low-quality automation or weak escalation could damage conversion or service trust
  - - Inspection and pricing data layer
    - Converts car-health data, transaction history, and diagnostics into valuations and quality benchmarks
    - Large proprietary inspection and transaction corpus plus diagnostics tooling
    - Model drift or biased benchmarks could misprice inventory and worsen trust
  - - Lending workflow layer
    - Automates eligibility, disbursals, document checks, and partner handoffs
    - Underwriting logic, document AI, and lending partners
    - Credit mistakes or compliance failures can hit both product trust and P&L
  - - Operator control plane
    - Runs hub validation, documents, attendance, and workflow execution across physical operations
    - Hub processes, human adoption, and workflow instrumentation
    - Operational inconsistency can nullify software-side efficiency gains
  - - Dealer and partner tooling
    - Enables auctions, one-click buy, buyback, financing, and support for channel partners
    - Accurate inspection reports, inventory feeds, and partner servicing
    - If partner tools are noisy, supply liquidity and partner trust can deteriorate
  - - Trust and legal support layer
    - Wraps warranties, Seller Kavach, RC transfer, security disclosures, and bug reporting around core commerce
    - Policy enforcement, legal-support capacity, and documentation accuracy
    - Public promises create liability if service recovery or coverage logic lags
  notes: This is an operating-architecture view assembled from retained sources. It does not imply a complete internal systems diagram.
