- id: trust-safety-compliance-and-user-feedback
  title: Trust, Safety, Compliance, and User Feedback
  body: 'Trust infrastructure is central to the CARS24 product story because used-car commerce in India is burdened by quality uncertainty, document risk, and post-sale disputes. Official surfaces show the company trying to control those trust-critical steps through 300-point inspections, CarTruth PDI, lifetime and limited-period warranty products, Seller Kavach liability coverage, real-time RC-transfer visibility, and a public security disclosure program that covers web, mobile, APIs, and backend services. Those are meaningful control signals, especially for a late-stage marketplace whose product depends on consumers believing inspection reports and paperwork support.


    But external feedback makes clear that trust execution is still uneven. Google Play, ConsumerComplaints, JustUseApp, and Trustpilot all preserve negative user reports about delayed RC transfers, pricing deltas versus online quotes, refund friction, warranty-coverage disputes, and post-sale service inconsistency. Google Play also discloses that the app may share or collect multiple categories of personal data and states the app data is not encrypted, which is a notable product-trust blemish for a platform that increasingly handles finance and documentation workflows. The right read is not that the trust stack is fake; it is that the control surface is real, but outcomes still look noisy enough that diligence should test resolution speed, exception handling, and policy adherence rather than relying on headline promises.'
  claimRefs:
