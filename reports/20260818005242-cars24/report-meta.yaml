  topStrengths:
    - CARS24 already operates at large scale, with historical group revenue near the billion-dollar mark and verified user, dealer, and loan activity.
    - FY26 evidence shows real operating improvement through retail mix, lending contribution, AI-led efficiency, and a first profitable quarter in Q4.
    - The platform is broader than a used-car listing site, creating optionality through financing and ownership services beyond the initial transaction.
  topRisks:
    - The last major external valuation mark is stale, while cap-table, preference, and audited FY26 bridge details remain private.
    - Lending, complaint handling, RC-transfer execution, and partner concentration still need deeper diligence before aggressive underwriting.
    - IPO readiness, governance bandwidth, and reverse-flip or filing milestones remain visible but not yet publicly complete.
  unresolvedGaps:
    - Current cap table, liquidation preferences, dilution, and any secondary-sale overhang remain the main price-protection blind spots.
    - Full loan-book quality, co-lending economics, partner concentration, and complaint-normalization metrics are still missing.
    - Audited FY26/FY27 bridge and a visible DRHP or equivalent listing-readiness package are still required to move from track to buy.
