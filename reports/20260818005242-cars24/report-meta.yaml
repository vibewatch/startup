  foundingLocation: Gurugram, Haryana, India
  headquarters: Gurugram, Haryana, India
  productSummary: >-
    CARS24 sells inspected used cars through owned-stock retail and verified direct-seller inventory,
    supports supply and liquidity through auctions and dealer rails, originates vehicle loans through its
    financing stack, and extends engagement with RC-transfer, FASTag, compliance, warranty, and other
    vehicle-ownership services.
  customerFocus: >-
    Retail used-car buyers, private sellers, dealer and channel partners, loan borrowers, and vehicle owners
    using post-purchase services across India-led auto-ownership workflows.
  businessModel: >-
    Integrated C2B2C plus marketplace model with revenue from vehicle transactions, lending, value-added
    ownership services, and related ancillary monetization rather than from classifieds fees alone.
  stage: late-stage private / IPO-prep
  fundingStatus: >-
    Last major external valuation anchor remains the December 2021 round at $3.3B; more recent visible
    funding is a Rs 345.2 crore August 2025 parent infusion that supports working capital and IPO
    preparations rather than fresh outside price discovery.
