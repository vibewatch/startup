- id: TU006
  title: Support friction and adverse evidence table
  enumeration: false
  columns:
  - Issue pattern
  - Evidence surface
  - Representative example
  - What it implies
  rows:
  - - Delayed RC transfer
    - Consumer complaint boards and app-store reviews
    - Sellers report months-long lag with continuing liability concerns
    - Post-sale paperwork remains a real trust risk despite strong official promises
  - - Pricing mismatch after inspection
    - Google Play and complaint boards
    - Users describe initial AI quote or listing fee expectations diverging from final offer mechanics
    - Top-of-funnel trust can be damaged if pricing explanation is weak
  - - Refund or fee friction
    - Consumer complaint boards
    - Complaints mention withheld fees, inspection charges, or delayed refunds
    - Edge cases may have materially worse experience than marketing copy implies
  - - Warranty or after-sales dissatisfaction
    - Trustpilot and JustUseApp
    - Some buyers praise support while others say warranty coverage or response quality disappointed them
    - Satisfaction likely bifurcates sharply between clean and problem cases
  - - UX or product-flow frustration
    - Google Play reviews
    - Users complain about rediscovering listings and limited context inside contact-seller workflows
    - Large review counts do not mean product polish is solved
  notes: Adverse evidence clusters around post-sale support, RC transfer, and expectation management more than around basic discovery.
