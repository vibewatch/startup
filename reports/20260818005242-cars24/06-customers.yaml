- id: named-customer-and-partner-proof
  title: Named Customer and Partner Proof
  body: 'CARS24 has more public customer proof than many late-stage private marketplaces, but it is still heavily anecdotal. The company’s own testimonial pages preserve named buyer and seller quotes such as Arjun, who highlights easy finance with zero down payment and one-day loan processing, and Rutil Suthar, who praises paperwork handling and delivery support. On the partner side, the dealer-onboarding page quotes Superior Motors in Bangalore, which says the Unnati funding program helped it grow roughly 200 percent over two years. Independent review surfaces add adversarial proof rather than only promotional proof: named Google Play, Trustpilot, and complaint-board users describe both smooth transactions and painful breakdowns around pricing, RC transfer, and support.


    That mix is useful because it proves the product is used in real life across both B2C and B2B channels. Still, the named proof is not enterprise-grade reference evidence. It rarely discloses transaction value, repeat frequency, retention duration, or economics. Most of the strongest named references are single anecdotes rather than cohort summaries. The right diligence conclusion is that public customer proof is real and recent, but still much stronger on testimonial texture than on decision-grade retention or expansion math.'
