company:
  name: CARS24
chapter:
  number: 6
  title: Customers
summary: CARS24’s public customer surface shows a broad, India-led multi-sided network rather than a single buyer cohort. The strongest verified segments are retail buyers, private sellers, dealer partners, loan borrowers, and ownership-services users who stay in the ecosystem after purchase for RC, FASTag, compliance, or financing needs. Adoption proof is meaningful—millions of monthly users, tens of thousands of dealer and borrower interactions, and large review footprints—but retention, repeat purchase, and cohort durability are still disclosed far less clearly than top-of-funnel reach.
sections:
- id: customer-segments-and-who-pays
  title: Customer Segments and Who Pays
  body: 'CARS24’s customer base is best understood as a multi-sided network with different buyer, user, and payer roles rather than as a single “car buyer” audience. On the demand side, the most visible segments are retail used-car buyers, first-time car buyers looking for financing help, and vehicle owners using post-purchase services such as FASTag, RC transfer, challan, and compliance utilities. On the supply side, the core segments are private sellers who want quick liquidation with lower paperwork risk and dealer or channel partners who need auction inventory, financing, and documentation support. These groups interact with different surfaces, but the company increasingly tries to keep them inside one operating system.


    That structure matters because revenue quality and customer durability likely vary by segment. Retail buyers can generate financing, warranty, and ownership-service attach. Sellers deepen supply and can later convert into buyers. Dealer partners provide liquidity and scale, but they also create channel dependence. Ownership-services users may never buy or sell a car in a given month, yet they keep engaging with the brand. The public evidence therefore supports a broad customer map, but not yet a clean segmentation bridge from user counts to monetized repeat cohorts by segment.'
