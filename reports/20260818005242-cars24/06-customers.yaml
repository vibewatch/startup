- id: adoption-and-usage-trajectory
  title: Adoption and Usage Trajectory
  body: 'The strongest adoption evidence sits at the intersection of official operating updates and customer-facing product pages. H1 FY26 materials put the monthly active audience above 11 million across the company’s major geographies, while H2 FY26 and Business Today expand that picture into a broader ownership-services layer with 3.5 crore to 3.8 crore monthly users engaging around insurance, history checks, financing, FASTag, and compliance. The dealer and seller surfaces add another growth signal: CARS24 says it now supports 20,000-plus verified bidders, 4,000-plus channel partners, 50,000-plus partner-linked cars sold in the last year, and support or branch presence across hundreds of Indian cities.


    These numbers are meaningful, but they also use different denominators. MAUs, unique users, dealers, channel partners, loans, and cars sold are not interchangeable. A late-stage investor should therefore read the adoption picture as clearly large but unevenly defined. The company has enough public scale to prove real demand and repeat touchpoints across the ownership lifecycle, yet not enough segment-level disclosure to show exactly how many users turn into repeat buyers, how many sellers later re-enter as buyers, or how much of the monthly ownership-services traffic monetizes into durable revenue.'
