- id: TU005
  title: Expansion and concentration risk table
  enumeration: false
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - Finance attach
    - Borrowers can deepen engagement beyond the vehicle purchase
    - If credit quality deteriorates, customer economics and trust both suffer
    - Request attach rates, approval rates, repeat borrowing, and losses by cohort
  - - Ownership services
    - FASTag, compliance, documentation, and support create recurring contact points
    - Large user counts may overstate paying-user depth
    - Request paying-user share, ARPU, and repeat-service frequency
  - - Dealer ecosystem
    - More bidders and partners can improve seller liquidity and pricing
    - Heavy dependence on dealer activity may create channel concentration or regional weakness
    - Request top-partner concentration, auction participation rates, and inactive-partner share
  - - India city footprint
    - Dense national coverage helps supply and support availability
    - Public customer evidence remains overwhelmingly India-centric
    - Request geography split for MAUs, GMV, and service complaints by country
  - - Seller protection and RC-transfer support
    - Post-sale trust can create referrals and repeat usage
    - If RC-transfer execution breaks, brand damage can be severe and persistent
    - Request SLA attainment, backlog, and legal-case volumes
  - - Hybrid D2C plus marketplace model
    - Broader selection can improve buyer conversion and seller liquidity
    - Different listing types may produce different trust or return behaviors
    - Request conversion, refund, and dispute rates by owned-stock versus direct-seller inventory
  notes: Expansion logic is visible in the product surface, but the public record does not yet quantify the conversion from cross-sell intent into durable retained revenue.
