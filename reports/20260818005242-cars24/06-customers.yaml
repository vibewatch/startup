tables:
- id: TU001
  title: Customer segmentation table
  enumeration: false
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Gap
  rows:
  - - Retail used-car buyers
    - Buyer and payer
    - Buy inspected used cars with financing, warranty, and RC support
    - Large national cohort; 11M+ MAUs and 3 of 4 retail buyers first-time by company claim
    - Core GMV, financing attach, warranty, and ownership-service cross-sell
    - No public repeat-buyer share or cohort retention
  - - Private sellers
    - Supplier, user, and indirect payer via optional services
    - Get AI valuation, home inspection, auction bidding, instant payment, and RC transfer
    - 250+ city support and 20,000+ bidder network cited publicly
    - Feeds inventory and brand trust; can later re-enter as buyer
    - No public seller NPS, seller repeat listing rate, or average sale cycle by city
  - - Dealer / channel partners
    - Buyer, liquidity partner, and financing user
    - Bid in auctions, buyback, financing, paperwork, and delivery support
    - 4,000+ channel partners; 50,000+ cars sold in last year; 20,000+ verified bidders
    - Critical for supply liquidity and seller price discovery
    - No public churn, share-of-wallet, or dealer concentration data
  - - Loan borrowers
    - Buyer-user and borrower-payer
    - Use used-car loans, loan-against-car, or personal loans
    - 19,889 H1 loans and 29,733 H2 loans disclosed
    - High attach-value segment; may deepen retention beyond the car purchase
    - Approval, default, and repeat-borrow rate are private
  - - Ownership-services users
    - User and payer for post-sale utilities
    - Use FASTag, compliance, documentation, history checks, and related services
    - 3.5Cr to 3.8Cr monthly users in public 2026 sources
    - Creates recurring engagement and expansion loops after transaction
    - Monetization per user and repeat-service frequency are not disclosed
  - - International retail users
    - Buyer and user outside India
    - Use retail and ownership flows in UAE and other geographies mentioned in official materials
    - Officially present but much less quantified than India
    - Adds brand breadth and optional diversification
    - Public customer proof outside India is thin and review-heavy
  notes: The segmentation table separates who buys, who supplies, and who stays engaged after the sale. Scale figures use different denominators and should not be summed.
