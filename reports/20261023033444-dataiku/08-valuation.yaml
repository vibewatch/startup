slug: dataiku
runDate: 2026-10-23
company:
  name: Dataiku
chapter:
  number: 8
  title: Valuation
  summary: Dataiku has credible late-stage enterprise software traction and a durable governance-oriented product position, but public valuation evidence is anchored to a December 2022 private mark and lacks current audited profitability, retention, and capitalization detail. The evidence supports a track stance with disciplined entry requirements rather than a buy at an unobserved price.
sections:
  - id: decision
    title: Recommendation and valuation stance
    body: >-
      The public record supports a track recommendation with medium confidence and high risk.
      Dataiku reported $350M+ ARR in October 2025, more than 750 organizations, and more than
      1,250 employees, while Sacra estimated $342.5M ARR in September 2025. Those figures show
      meaningful scale, but they are not audited financial statements and do not disclose gross
      margin, net retention, cash generation, or customer concentration. The last disclosed
      post-money valuation in the retained evidence is $3.7B from the December 2022 Series F;
      the $4.6B August 2021 Series E provides a clear precedent for multiple compression rather
      than a current mark. Comparing either historical valuation with later estimated ARR would
      mix periods and would not establish a current transaction multiple. The retained evidence
      is therefore insufficient to justify a buy without current financing terms, preference
      structure, and evidence that growth and margins support the price.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001]
  - id: thesis
    title: Investment thesis and anti-thesis
    body: >-
      The thesis is that Dataiku can monetize the coordination layer around enterprise AI:
      its official product page describes a governed system combining analytics, models, and
      agents, while an independent SiliconANGLE report describes a move toward an orchestration
      layer for enterprise-grade AI agents. This positioning is commercially relevant because the
      platform spans technical and business users and is designed to operate across existing
      data environments. The anti-thesis is that hyperscalers, data platforms, and specialist
      tools can absorb these functions, leaving a neutral layer with pricing pressure and high
      implementation requirements. Sacra's independent analysis describes subscription pricing
      based on users and compute and identifies competition from DataRobot, Alteryx, Databricks,
      and cloud ML platforms, but it also warns that public information is incomplete and not
      investment advice. The valuation therefore depends on proving durable expansion, efficient
      deployment, and a defensible position above infrastructure-native alternatives.
    claimRefs: [CV005, CV006, CV007, CV008]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenarios, entry discipline, and diligence
    body: >-
      A scenario framework is more defensible than a single target because the public evidence
      does not establish a current price, audited revenue, margin profile, retention, or dilution
      and preference terms. The bull case requires verified ARR growth, strong retention, healthy
      gross margin, and evidence that agent governance expands wallet share without proportional
      services intensity. The base case assumes continued enterprise adoption but a fair private
      mark, with an entry that requires negotiated terms and a margin of safety. The bear case is
      a down-round or multiple reset if growth decelerates, cloud and platform vendors bundle
      comparable controls, or implementation economics remain heavy. Exit readiness should be
      treated as conditional: Sacra reports a potential U.S. IPO process, but that is a secondary
      report and not a filing or commitment. Before investing, request audited financials, a
      current cap table, liquidation preferences, ARR bridge, cohort retention, gross margin,
      services mix, customer concentration, cash and burn, and current financing terms.
    claimRefs: [CV009, CV010, CV011, CV012]
    tableRefs: [TV003]
    figureRefs: [FV001]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Public evidence, Assessment, Decision implication]
    rows:
      - [Recommendation, "Scale and product evidence are credible; current price is not public", "Track", "Do not underwrite a buy without current terms"]
      - [Confidence, "ARR and customer figures are reported or estimated, not audited", "Medium", "Require financial verification"]
      - [Risk rating, "Private-company disclosure, competition, and preference terms remain uncertain", "High", "Use a material diligence reserve"]
      - [Valuation stance, "$3.7B December 2022 post-money is the latest retained disclosed mark", "Indeterminate; historical reference only", "Demand a margin of safety and updated capitalization evidence"]
    notes: Public evidence mixes company-reported figures, independent estimates, and historical financing disclosures; no current transaction price or audited financial statements were retained.
    claimRefs: [CV001, CV002, CV003, CV004]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["Governed orchestration can be a durable control layer", "Dataiku describes governance across analytics, models, and agents; SiliconANGLE reports an orchestration focus", "Independent customer evidence of repeatable production value and expansion", "Supports tracking the category position"]
      - ["Scale can support enterprise monetization", "$350M+ ARR and 750+ organizations were reported in October 2025", "Audited ARR bridge, retention cohorts, and customer concentration", "Scale is promising but not investment-grade proof alone"]
      - ["Neutral-layer economics may face platform pressure", "Sacra identifies Databricks, cloud ML services, DataRobot, and Alteryx as alternatives", "Win-loss data, pricing power, and gross-margin durability", "Requires conservative multiple and moat underwriting"]
      - ["Private valuation can reset", "$4.6B in 2021 fell to a $3.7B Series F post-money in 2022", "Current round terms and evidence of multiple recovery", "Treat downside and preference overhang as material"]
    notes: Comparisons describe strategic alternatives, not directly comparable public-company valuation benchmarks; the historical marks are financing post-money values and not current fair value.
    claimRefs: [CV003, CV005, CV006, CV007, CV008]
  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "ARR growth remains strong; retention and gross margin verify enterprise software quality; agent governance expands spend", "Upside requires a current valuation that remains reasonable versus verified ARR and durable margins", "Platform bundling, execution, services intensity", "Low-to-medium; evidence needed"]
      - [Base, "Enterprise adoption continues; current price is fair but disclosure remains incomplete", "Track until terms, cap table, preferences, and audited economics permit a risk-adjusted entry", "Unknown cash burn, dilution, customer concentration", "Medium; most consistent with retained evidence"]
      - [Bear, "Growth slows or implementation burden remains high; cloud and data platforms bundle substitutes", "Down-round or multiple compression; preserve capital and avoid forced entry", "Commercialization failure, preference overhang, liquidity", "Material downside; no public probability"]
      - [Entry gate, "Verified current financing and audited or diligence-grade operating metrics", "Buy only after price, dilution, preferences, and return path are observable", "Incomplete disclosure", "Unresolved"]
    notes: These are qualitative scenarios, not forecasts or probability-weighted valuations; public evidence does not support precise price targets or probabilities.
    claimRefs: [CV009, CV010, CV011, CV012]
