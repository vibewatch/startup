        - id: diligence
          label: "Verify economics and capitalization"
        - id: decision
          label: "Track with disciplined entry"
      edges:
        - from: scale
          to: product
        - from: product
          to: valuation
        - from: risks
          to: valuation
        - from: valuation
          to: diligence
        - from: diligence
          to: decision
    claimRefs: [CV001, CV005, CV007, CV009]
callouts:
  - calloutType: recommendation
    title: Track, do not buy on public evidence alone
    body: The company has credible scale and a relevant control-plane thesis, but the latest retained valuation is historical and the economics required for a price-sensitive buy call are not public.
    claimRefs: [CV001, CV003, CV004, CV012]
  - calloutType: risk
    title: The key risk is evidence quality, not only product competition
    body: Current cash, burn, retention, margins, concentration, cap-table terms, and liquidation preferences remain unresolved; these can change both return potential and downside protection.
    claimRefs: [CV004, CV007, CV011]
