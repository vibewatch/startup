company:
  name: Dataiku
chapter:
  number: 2
  title: Market Analysis
  summary: "Dataiku addresses an enterprise AI operating layer spanning data preparation, analytics, machine learning, deployment, and governance. The market is attractive but heterogeneous: buyer value depends on data readiness, workflow criticality, and trust controls, while public market estimates mix adjacent categories and should not be treated as a single TAM."
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      The relevant market is enterprise AI and analytics infrastructure that helps
      organizations prepare data, build and deploy models or agents, and govern those
      workflows across cloud, on-premises, and multi-vendor environments. Dataiku's
      own positioning describes an orchestration layer for building, deploying, and
      governing AI, while AWS Marketplace describes a single governed system spanning
      analytics, machine learning, and AI agents (SM004, SM005). Independent product
      coverage similarly describes an end-to-end data and AI platform with visual and
      coded workflows, deployment, monitoring, and governance (SM007). This boundary
      includes platform software and directly attached implementation or managed-service
      spend, but excludes foundation-model consumption, general cloud infrastructure,
      standalone BI visualization, and bespoke consulting unless they are purchased as
      part of operating the platform. The practical substitutes are fragmented stacks:
      spreadsheets and SQL for analysts, notebooks and Databricks for data scientists,
      Alteryx or ETL tools for preparation, and Tableau or Power BI for visualization.
      A CIO demonstration reports that teams otherwise work in siloed tools and email
      spreadsheets between analysts, engineers, and data scientists (SM006). The
      implication is that Dataiku competes for consolidation and governance budgets,
      not only for a narrowly defined MLOps line item.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and market momentum
    body: >-
      Public sizing is directionally positive but not directly additive. MarketsandMarkets
      lists an AI Studio market of $32.7 billion by 2029 at a 38.4% CAGR, an AI
      governance market of $5.78 billion by 2029 at a 45.3% CAGR, and an AI platform
      market rising from about $18.22 billion in 2025 to more than $94.31 billion in
      2030 at about 38.9% CAGR (SM010). These categories overlap in platform,
      governance, MLOps, analytics, and application-development spend, so they are
      upper-bound reference lenses rather than a defensible Dataiku TAM. A narrower
      adoption lens is more decision-useful: Deloitte's poll found only 13.5% of
      finance and accounting respondents said their organizations were already using
      agentic AI, while 33.6% were building or planning adoption (SM011). Academic
      evidence is also early-stage: a study of 16 practitioners from 12 companies
      found reported production practices at maturity levels 1-3 and recurring barriers
      around context, proprietary data, qualification, and confidentiality (SM008).
      Dataiku's addressable opportunity therefore expands with governance and
      orchestration needs, but conversion depends on enterprises moving from pilots
      into repeatable, measured production workflows.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-drivers-constraints
    title: Buyer segments, adoption path, and constraints
    body: >-
      The primary buyer is an enterprise data or AI leader who owns platform
      standardization and governance; data engineering and data science are the core
      users, while business analysts consume governed outputs and domain leaders own
      the operating budget. The buyer map is consequently organized around workflow
      maturity rather than company size. Early adopters can justify a shared platform
      when siloed tooling, audit requirements, or repeated deployment work creates
      measurable friction. The adoption trigger is strongest where a workflow has a
      clear baseline, high volume, and defined human escalation path. Dataiku's
      platform coverage and the FirstMark launch narrative emphasize connecting data,
      models, agents, and business rules in a governed environment (SM004, SM001).
      The principal constraints are trust, integration, talent, and unclear economics:
      Deloitte identifies trust as the leading barrier at 21.3%, followed by
      integration at 20.1% and skilled personnel at 13.5% (SM011). A separate
      deployment analysis says early costs are higher and less predictable than
      projected, with recurring connector, monitoring, and incident-response costs
      (SM009). This makes ROI proof, interoperability, and governance evidence central
      to sales cycles and valuation durability; broad market growth alone does not
      establish Dataiku's SAM or SOM.
    claimRefs: [CM010, CM011, CM012, CM013, CM014]
    tableRefs: [TM003]
callouts:
  - calloutType: insight
    title: The investable market is governance-constrained, not merely model-constrained
    body: >-
      Dataiku's strongest market wedge is the coordination and control layer around
      enterprise AI, but adoption remains gated by data readiness, trust, integration,
      and proof of measurable workflow outcomes.
    claimRefs: [CM002, CM009, CM013, CM014]
  - calloutType: risk
    title: Published market forecasts are overlapping upper bounds
    body: >-
      AI Studio, AI governance, and AI platform forecasts use overlapping category
      definitions; they support category momentum but cannot be summed into Dataiku's
      addressable market.
    claimRefs: [CM005, CM006, CM007]
