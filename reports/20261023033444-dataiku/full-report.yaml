chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and operating model
        blocks:
          - type: paragraph
            body: >-
              Dataiku was founded in Paris in 2013, and retained current descriptions place its operating base in New
              York City. Its platform spans data preparation, analytics, machine learning, deployment, monitoring, and
              AI governance for both technical and business users. That breadth is consistent across independent
              profiles, a CIO executive demonstration, review material, and company-issued marketplace copy. The
              commercial model is described as enterprise subscription software, with annual or multi-year contracts
              supplemented by implementation and training. The evidence therefore supports a one-line identity as a
              governed enterprise AI orchestration platform, not a foundation-model developer or cloud infrastructure
              provider. Exact pricing, services mix, and contract economics remain private.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO013
              - CO015
      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Capital.com identifies Florian Douetteau, Clément Stenac, Marc Batty, and Thomas Cabrol as the four
              founders. SiliconANGLE's March 2026 reporting identifies Douetteau as co-founder and chief executive and
              Stenac as co-founder and chief technology officer, tying both founders directly to the latest product
              strategy. That continuity is a strength because the company's move from collaborative data science toward
              governed agent orchestration has clear founder sponsorship. It is also a concentration risk: the retained
              pool does not provide a complete current executive roster, board committee structure, succession plan, or
              delegated decision-rights map. Governance quality and operating depth therefore remain only partially
              observable.
            claimRefs:
              - CO010
              - CO012
