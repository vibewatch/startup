  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is enterprise AI and analytics infrastructure that helps organizations prepare data,
              build and deploy models or agents, and govern those workflows across cloud, on-premises, and multi-vendor
              environments. Dataiku's own positioning describes an orchestration layer for building, deploying, and
              governing AI, while AWS Marketplace describes a single governed system spanning analytics, machine
              learning, and AI agents (SM004, SM005). Independent product coverage similarly describes an end-to-end
              data and AI platform with visual and coded workflows, deployment, monitoring, and governance (SM007). This
              boundary includes platform software and directly attached implementation or managed-service spend, but
              excludes foundation-model consumption, general cloud infrastructure, standalone BI visualization, and
              bespoke consulting unless they are purchased as part of operating the platform. The practical substitutes
              are fragmented stacks: spreadsheets and SQL for analysts, notebooks and Databricks for data scientists,
              Alteryx or ETL tools for preparation, and Tableau or Power BI for visualization. A CIO demonstration
              reports that teams otherwise work in siloed tools and email spreadsheets between analysts, engineers, and
              data scientists (SM006). The implication is that Dataiku competes for consolidation and governance
              budgets, not only for a narrowly defined MLOps line item.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and market momentum
        blocks:
          - type: paragraph
            body: >-
              Public sizing is directionally positive but not directly additive. MarketsandMarkets lists an AI Studio
              market of $32.7 billion by 2029 at a 38.4% CAGR, an AI governance market of $5.78 billion by 2029 at a
              45.3% CAGR, and an AI platform market rising from about $18.22 billion in 2025 to more than $94.31 billion
              in 2030 at about 38.9% CAGR (SM010). These categories overlap in platform, governance, MLOps, analytics,
              and application-development spend, so they are upper-bound reference lenses rather than a defensible
              Dataiku TAM. A narrower adoption lens is more decision-useful: Deloitte's poll found only 13.5% of finance
              and accounting respondents said their organizations were already using agentic AI, while 33.6% were
              building or planning adoption (SM011). Academic evidence is also early-stage: a study of 16 practitioners
              from 12 companies found reported production practices at maturity levels 1-3 and recurring barriers around
              context, proprietary data, qualification, and confidentiality (SM008). Dataiku's addressable opportunity
              therefore expands with governance and orchestration needs, but conversion depends on enterprises moving
              from pilots into repeatable, measured production workflows.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.3'
        title: Buyer segments, adoption path, and constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is an enterprise data or AI leader who owns platform standardization and governance;
              data engineering and data science are the core users, while business analysts consume governed outputs and
              domain leaders own the operating budget. The buyer map is consequently organized around workflow maturity
              rather than company size. Early adopters can justify a shared platform when siloed tooling, audit
              requirements, or repeated deployment work creates measurable friction. The adoption trigger is strongest
              where a workflow has a clear baseline, high volume, and defined human escalation path. Dataiku's platform
              coverage and the FirstMark launch narrative emphasize connecting data, models, agents, and business rules
              in a governed environment (SM004, SM001). The principal constraints are trust, integration, talent, and
              unclear economics: Deloitte identifies trust as the leading barrier at 21.3%, followed by integration at
              20.1% and skilled personnel at 13.5% (SM011). A separate deployment analysis says early costs are higher
              and less predictable than projected, with recurring connector, monitoring, and incident-response costs
              (SM009). This makes ROI proof, interoperability, and governance evidence central to sales cycles and
              valuation durability; broad market growth alone does not establish Dataiku's SAM or SOM.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is governance-constrained, not merely model-constrained
            body: >-
              Dataiku's strongest market wedge is the coordination and control layer around enterprise AI, but adoption
              remains gated by data readiness, trust, integration, and proof of measurable workflow outcomes.
            calloutType: insight
            claimRefs:
              - CM002
              - CM009
              - CM013
              - CM014
          - type: callout
            title: Published market forecasts are overlapping upper bounds
            body: >-
              AI Studio, AI governance, and AI platform forecasts use overlapping category definitions; they support
              category momentum but cannot be summed into Dataiku's addressable market.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Dataiku is not confined to a single peer set. Its broadest direct comparison is with end-to-end enterprise
              AI platforms, while Databricks competes from a data-platform base and H2O.ai and DataRobot represent more
              specialist AI and AutoML alternatives. Alteryx and manual combinations of spreadsheets, SQL, notebooks,
              and point tools remain substitutes for narrower analytics workflows. Internal builds using open-source
              orchestration frameworks are another credible option for technically mature buyers. Dataiku's own field
              demonstration names Excel, Alteryx, Tableau Data Prep, SQL scripts, notebooks, and Databricks as the
              fragmented status quo it seeks to consolidate, so the relevant market includes both vendor displacement
              and toolchain consolidation rather than only head-to-head platform replacement.
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.2'
        title: Capability and positioning
        blocks:
          - type: paragraph
            body: >-
              Dataiku's strongest supported position is between business accessibility and enterprise control. The
              platform combines visual workflows with Python, R, and SQL, works over existing data locations, and
              promotes centralized governance across analytics, models, and agents. Independent review evidence broadly
              supports the accessibility thesis, but also records a learning curve, workflow complexity, performance
              variability, and implementation friction. Databricks brings a much larger integrated data and AI estate,
              while H2O.ai combines an open-source framework with proprietary applications. The positioning map is an
              analyst ordinal synthesis of these qualitative facts, not a benchmark or measured product score; cells
              lacking direct evidence are marked unknown.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP009
              - CP012
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP009
              - CP012
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP004
              - CP009
              - CP012
              - CP013
              - CP014
      - number: '3.3'
        title: Pricing, switching costs, and distribution
        blocks:
          - type: paragraph
            body: >-
              Public pricing evidence is weakest where enterprise buyers most need comparability. The AWS Marketplace
              listing uses one contract-based Units dimension but does not define a public unit mapping or price, while
              Databricks uses consumption-based Databricks Units tied to workload usage. No current, comparable public
              price was available in the assigned evidence for H2O.ai, DataRobot, or Alteryx. Dataiku can gain switching
              cost when visual flows, governance policy, deployment processes, and mixed-user collaboration become
              embedded; a G2 reviewer explicitly described moving workflows from Alteryx. Conversely, Dataiku's
              push-down model leaves underlying data in customer infrastructure, which reduces data-residency lock-in
              even as workflow and governance configuration create process lock-in.
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP008
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
              - CP012
              - CP014
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The moat is therefore workflow and governance integration rather than exclusive ownership of data or
              models. Dataiku's 2026 roadmap extends the control plane into agent monitoring, business-led agent
              creation, and reasoning systems, which could deepen enterprise standardization if these products become
              operationally central. The adverse case is platform convergence: Databricks is adding governed agents and
              business-user interfaces, hyperscalers already own infrastructure distribution, and Dataiku itself
              describes capable open-source orchestration frameworks. Customer evidence also shows that cost, setup
              complexity, access controls, large-workflow performance, and onboarding can erode the benefit of
              consolidation. Durable differentiation must be tested through win/loss data, realized implementation time,
              renewal behavior, and migration cost rather than feature breadth alone.
            claimRefs:
              - CP003
              - CP004
              - CP009
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-functional standardization is the core wedge
            body: >-
              Dataiku can replace fragmented analyst, engineering, and data-science tools without requiring all users to
              adopt the same coding interface or move the underlying data.
            calloutType: strength
            claimRefs:
              - CP001
              - CP002
              - CP012
          - type: callout
            title: Breadth is becoming table stakes
            body: >-
              Databricks, hyperscalers, and open-source frameworks are expanding into governed agents and easier
              interfaces, while review evidence shows that Dataiku itself carries cost, setup, learning-curve, and
              performance friction.
            calloutType: risk
            claimRefs:
              - CP004
              - CP009
              - CP013
              - CP014
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Dataiku's public monetization evidence points to annual subscription access to Data Science Studio and
              related capabilities, supplemented by professional services, ecosystem partnerships, and marketplace
              add-ons. Sacra estimates $342.5M of ARR in September 2025, up from $300M at the end of 2024; that is an
              analyst estimate, not audited revenue. Sacra separately reports roughly 500 customers and states
              approximately $500K of average ARR per customer at the end of 2023, a historical metric that should not be
              treated as a current cohort denominator. AWS Marketplace confirms a contract-based “Units” dimension but
              says neither the unit definition nor price is published. Revenue recognition, renewal rates, services mix,
              implementation revenue, and concentration remain unverified.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI004
              - CI005
              - CI012
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI004
              - CI005
              - CI006
              - CI008
              - CI013
              - CI014
      - number: '4.2'
        title: Pricing architecture and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              Dataiku does not publish a standard paid price list. A 2026 pricing review identifies a no-cost
              self-hosted Free Edition and a 14-day hosted trial, while paid deployments route to a sales conversation
              and are shaped by deployment model, role-based seats, governance, LLM Mesh access, organization size,
              integrations, and support. AWS Marketplace independently describes pricing as based on contract duration
              and terms, with additional AWS infrastructure costs possible, but does not define a unit price. These
              facts imply a high-touch enterprise sales motion with scope-based quoting and potentially material
              implementation or cloud-cost pass-through. Public sources do not establish sales-cycle length, CAC,
              payback, win rates, discounting, partner-sourced pipeline, or realized net price, so a sales-efficiency
              conclusion would be speculative.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
      - number: '4.3'
        title: Cost structure and capital adequacy
        blocks:
          - type: paragraph
            body: >-
              The available evidence describes a software platform that can run above customer infrastructure, with
              compute pushed to external engines or customer environments and additional cloud charges possible. That
              architecture may reduce owned-infrastructure intensity, but it does not establish Dataiku's gross margin
              because hosting, support, implementation labor, research and development, stock compensation, and
              third-party model costs are undisclosed. Capital.com reports that Dataiku began preparing for a potential
              U.S. IPO after hiring banks, but IPO preparation is not cash and does not establish financing
              availability. No assigned source reports cash on hand, burn, debt, liquidation preferences, or a
              next-round trigger. Capital adequacy is therefore a material diligence blocker rather than a quantified
              conclusion.
            claimRefs:
              - CI008
              - CI012
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI002
              - CI003
              - CI010
              - CI013
              - CI014
              - CI015
              - CI016
              - CI018
      - number: '4.4'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Dataiku has the profile of a scaled enterprise software asset: recurring subscription mechanics,
              large-account positioning, a broad governed platform, and estimated ARR growth through September 2025. The
              underwriting case remains constrained by information asymmetry. Current ARR is an estimate, the latest
              customer denominator is historical, and negotiated contracts leave units, discounts, renewal economics,
              and realized price private. A peer data point from DataRobot also relies on third-party estimates with
              nonmatching revenue and headcount dates, so it cannot substitute for Dataiku unit economics. The financial
              stance remains track pending an ARR bridge, retention cohorts, gross-margin bridge, services split, cash
              and burn schedules, debt terms, and concentration.
            claimRefs:
              - CI002
              - CI003
              - CI009
              - CI013
              - CI014
              - CI015
              - CI016
              - CI018
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recurring enterprise monetization is plausible
            body: >-
              Public descriptions consistently characterize Dataiku as subscription software sold to large
              organizations, with reported ARR estimates and a contract-based marketplace route. This supports a
              recurring-revenue hypothesis, but not audited revenue quality.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI006
          - type: callout
            title: Cash and margin visibility are insufficient
            body: >-
              No assigned source reports current cash, burn, gross margin, net retention, debt, or services mix. Those
              omissions prevent a defensible runway or margin-path calculation.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI018
          - type: callout
            title: Underwrite only after private diligence
            body: >-
              Request customer-level cohort data, contract and renewal terms, realized price by role and deployment,
              cost-to-serve, cash and burn schedules, and financing obligations before relying on valuation or growth
              claims.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI018
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product workflow and user surface
        blocks:
          - type: paragraph
            body: >-
              Dataiku is delivered as an enterprise platform for moving from data access and preparation through model
              development, deployment, and monitoring. A CIO demonstration describes access for coders and non-coders
              across cloud, on-premises, and other locations, while stating that the platform supports analysis, machine
              learning, and generative AI in one governed user interface. The same demonstration says Dataiku operates
              as a UI layer over existing data sources rather than requiring large datasets to be moved, and describes a
              browser-based experience hosted in the cloud, a VPC, or on-premises. That is a coherent workflow thesis
              for enterprises with heterogeneous estates, but the public material does not quantify implementation time,
              deployment success rates, or realized customer outcomes.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE010
              - CE011
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE010
              - CE011
      - number: '5.2'
        title: Architecture, deployment, and operating model
        blocks:
          - type: paragraph
            body: >-
              The current DSS 15 developer guide groups five capabilities—agentic AI, machine learning, modern
              analytics, orchestration, and governance—inside one enterprise platform. It describes visual and code
              agents, an LLM Mesh for provider routing and quotas, a unified Flow and deployment automation, model
              registries, lineage, explainability, and monitoring. AWS Marketplace materials add concrete infrastructure
              dependencies: elastic compute powered by Amazon EKS for Python, R, and Spark, integrations with SageMaker
              and Comprehend, and an LLM Mesh connection to Amazon Bedrock. Dataiku's documentation site also exposes a
              developer guide, API reference, Academy, and community, while the public Python client repository confirms
              a public DSS API client. These are observable integration surfaces, not proof of uptime, scale limits, or
              customer-specific architecture.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE010
      - number: '5.3'
        title: Differentiation, trust, and technical diligence
        blocks:
          - type: paragraph
            body: >-
              Dataiku's differentiation is the combination of a shared workflow for technical and business users with
              centralized governance across data, models, LLMs, and agents. Dataiku Govern describes registries for
              bundles, models, and LLMs, documented approval workflows, sign-off rules, audit timelines, and
              notifications. Independent marketplace and review material supports a broad multi-vendor and hybrid
              deployment proposition, but also leaves commercial and operational diligence open: AWS lists unit-based
              billing whose mapping is set by quote, and marketplace review text includes a complaint that the product's
              unique capabilities can be confusing compared with similar platforms. A synthesized review page also
              reports slow performance for large datasets and complex scenarios. Those signals make workload
              benchmarking, reference calls, access-control testing, and a full pricing/ implementation schedule
              necessary before treating the architecture as proven at scale.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad enterprise control plane
            body: >-
              Dataiku has unusually broad documented coverage from agent creation through deployment, governance, and
              monitoring, with explicit support for mixed technical skill levels and multi-vendor infrastructure.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Scale and commercial proof remain incomplete
            body: >-
              Public material does not establish workload performance, reliability, realized deployment outcomes, or
              transparent realized pricing; external review signals warrant a controlled benchmark and reference
              diligence.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer, user, and deployment segments
        blocks:
          - type: paragraph
            body: >-
              Dataiku's customer model is enterprise-wide rather than confined to one technical persona. The platform is
              described as serving data scientists, engineers, analysts, business users, and domain experts, with use
              spanning predictive maintenance, fraud detection, demand forecasting, and other operational analytics.
              This supports a segmentation thesis in which the economic buyer is likely an enterprise data or technology
              organization, while adoption depends on analysts and domain teams being able to use the same governed
              workspace. The evidence does not disclose customer-level revenue bands, seat counts, geography mix, or
              payer-versus-user splits, so scale should not be inferred from logos or a broad organization count.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.2'
        title: Adoption trajectory and named customer proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence indicates a sizable enterprise footprint, but it does not establish an auditable
              active-account or deployment trajectory. Reuters reports more than 700 organizations and names Johnson &
              Johnson, Toyota, General Electric, and BNP Paribas; Capital.com repeats the greater-than-700 figure and
              gives the same examples. Dataiku's own surface adds a different scale signal—"more than 600 companies" and
              tens of thousands of people with measurable return on AI—while Forbes reports more than 700 organizations
              and lists LVMH, Morgan Stanley, Michelin, and Novartis. These are useful reference points, but differing
              dates, definitions, and issuers prevent treating them as one reconciled customer KPI.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Durability, expansion, and procurement friction
        blocks:
          - type: paragraph
            body: >-
              Dataiku's product positioning is compatible with land-and-expand behavior: it can begin with a team or use
              case and extend across analytics, machine learning, generative AI, deployment, monitoring, and governance.
              AWS Marketplace describes contract-based Units pricing with a negotiated quantity and term, while reviews
              show both cross-functional value and friction. One reviewer says the platform lets data scientists,
              business users, and analysts work on one visual platform; the same review reports that setup may be
              difficult and the product may be expensive. Other review excerpts mention comparisons with Alteryx,
              confusion about differentiated capabilities, and missing niche data sources. No public source in this pool
              reports NRR, GRR, churn, renewal rates, contract length, cohort expansion, or customer concentration.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
      - number: '6.4'
        title: Adoption loop and unresolved customer diligence
        blocks:
          - type: paragraph
            body: >-
              The observable customer journey runs from connecting existing data, through collaborative preparation and
              modeling, to deployment, monitoring, and governance. That sequence is reinforced by independent product
              coverage, an AWS marketplace listing, customer-review excerpts, and Dataiku's own platform description.
              The commercial implication is positive if one governed workflow creates multiple internal stakeholders and
              recurring operational dependence; the risk is that implementation complexity, infrastructure requirements,
              services intensity, and procurement friction may slow expansion or make the platform heavier than a point
              solution. The available sources do not provide customer-level outcome baselines, renewal cohorts,
              implementation duration, services mix, or concentration data, so those remain material diligence asks.
            claimRefs:
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise breadth is credible but not fully measurable
            body: >-
              Independent reporting and secondary market coverage both cite more than 700 organizations, while Dataiku
              describes more than 600 companies and tens of thousands of people; the difference in definitions and dates
              prevents a clean growth series.
            calloutType: strength
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: callout
            title: Retention remains the key customer diligence gap
            body: >-
              No assigned source discloses NRR, GRR, churn, renewal, contract length, cohort expansion, or customer
              concentration, and marketplace reviews surface setup, price, comparison, and niche-data-source friction.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Dataiku sells governance into a market where the rules are becoming operational rather than aspirational.
              The European Commission says high-risk AI systems will require risk assessment, dataset quality, logging,
              documentation, human oversight, robustness, cybersecurity, and accuracy obligations, with high-risk use
              cases applying from December 2027 under the current implementation timeline. That creates demand for
              controls but also raises the cost of proving that a customer's particular deployment is compliant.
              Dataiku's public product materials describe governance, lineage, monitoring, and agent oversight, yet the
              available evidence does not establish that these features satisfy every jurisdictional obligation or that
              Dataiku is itself the regulated provider or deployer in each customer arrangement. The most important
              legal diligence is therefore a product-to-obligation mapping by deployment model, jurisdiction, and use
              case, rather than assuming that a governance label is a compliance certification. The FTC legal library
              illustrates the breadth and pace of privacy, competition, and consumer-protection enforcement generally;
              it does not identify a Dataiku matter, so no company-specific enforcement conclusion is warranted.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              The operating model is inherently complex: Dataiku presents a single interface over cloud, on-premises,
              databases, data warehouses, model environments, and third-party agent frameworks. That breadth can reduce
              data movement, but it also creates failure modes at connectors, permissions, model behavior, deployment
              orchestration, and monitoring boundaries. A company-hosted demonstration says Dataiku tracks users' access
              to data sources, models, and LLMs, while the AWS listing states that infrastructure costs may be
              additional and that AWS does not warrant vendor-supplied product content. Those statements support the
              existence of controls and a clear shared-responsibility boundary, not an absence of incidents. The new
              agent products are also a delivery risk: independent coverage describes Agent Management as not yet
              available at the time of reporting and places other capabilities on a 2026 launch schedule. The practical
              kill criteria are measurable: unresolved critical security findings, material data leakage, repeated
              model-drift or cost-overrun alerts without closure, or launch slippage that prevents referenceable
              production deployments.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR009
              - CR011
              - CR012
      - number: '7.3'
        title: Partner and financial dependencies
        blocks:
          - type: paragraph
            body: >-
              Dataiku's value proposition depends on an ecosystem rather than a self-contained stack. AWS Marketplace
              describes integrations with S3, Redshift, RDS, EKS, SageMaker, Comprehend, Bedrock, and
              customer-controlled deployment choices, while current industry coverage describes monitoring across AWS,
              Snowflake, Databricks, and Google environments. This expands addressable use cases but increases exposure
              to platform APIs, cloud economics, procurement channels, and competing control planes. Commercial opacity
              compounds that risk: the AWS listing uses a contract-based Units measure, does not publish the unit
              definition or price, and says buyers must obtain a quote; additional AWS infrastructure costs may apply.
              Public review evidence is useful as a signal of user experience but is not a substitute for retention,
              concentration, margin, or cash data. A financing or IPO process was reported in 2025, and the prior 2022
              round and valuation were reported by Reuters-syndicated coverage, but those facts do not show current
              liquidity or runway. Diligence should obtain partner-sourced pipeline, renewal and churn by deployment
              type, cloud-cost pass-through, cash and burn, and concentration by top customers and providers before
              treating ecosystem breadth as resilience.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Thesis-break triggers
            body: >-
              Escalate the risk rating if Dataiku cannot evidence production-grade controls for regulated deployments,
              experiences a material security or privacy incident, misses the new-product roadmap without referenceable
              customers, or loses portability across major cloud and data platforms.
            calloutType: risk
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR009
              - CR011
          - type: callout
            title: Evidence boundary
            body: >-
              The retained public record does not disclose Dataiku's current cash, burn, gross margin, retention,
              customer concentration, incident history, or complete legal docket; these remain diligence requirements
              rather than inferred positives.
            calloutType: assumption
            claimRefs:
              - CR004
              - CR007
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The public record supports a track recommendation with medium confidence and high risk. Dataiku reported
              $350M+ ARR in October 2025, more than 750 organizations, and more than 1,250 employees, while Sacra
              estimated $342.5M ARR in September 2025. Those figures show meaningful scale, but they are not audited
              financial statements and do not disclose gross margin, net retention, cash generation, or customer
              concentration. The last disclosed post-money valuation in the retained evidence is $3.7B from the December
              2022 Series F; the $4.6B August 2021 Series E provides a clear precedent for multiple compression rather
              than a current mark. Comparing either historical valuation with later estimated ARR would mix periods and
              would not establish a current transaction multiple. The retained evidence is therefore insufficient to
              justify a buy without current financing terms, preference structure, and evidence that growth and margins
              support the price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Dataiku can monetize the coordination layer around enterprise AI: its official product
              page describes a governed system combining analytics, models, and agents, while an independent
              SiliconANGLE report describes a move toward an orchestration layer for enterprise-grade AI agents. This
              positioning is commercially relevant because the platform spans technical and business users and is
              designed to operate across existing data environments. The anti-thesis is that hyperscalers, data
              platforms, and specialist tools can absorb these functions, leaving a neutral layer with pricing pressure
              and high implementation requirements. Sacra's independent analysis describes subscription pricing based on
              users and compute and identifies competition from DataRobot, Alteryx, Databricks, and cloud ML platforms,
              but it also warns that public information is incomplete and not investment advice. The valuation therefore
              depends on proving durable expansion, efficient deployment, and a defensible position above
              infrastructure-native alternatives.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
      - number: '8.3'
        title: Scenarios, entry discipline, and diligence
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single target because the public evidence does not
              establish a current price, audited revenue, margin profile, retention, or dilution and preference terms.
              The bull case requires verified ARR growth, strong retention, healthy gross margin, and evidence that
              agent governance expands wallet share without proportional services intensity. The base case assumes
              continued enterprise adoption but a fair private mark, with an entry that requires negotiated terms and a
              margin of safety. The bear case is a down-round or multiple reset if growth decelerates, cloud and
              platform vendors bundle comparable controls, or implementation economics remain heavy. Exit readiness
              should be treated as conditional: Sacra reports a potential U.S. IPO process, but that is a secondary
              report and not a filing or commitment. Before investing, request audited financials, a current cap table,
              liquidation preferences, ARR bridge, cohort retention, gross margin, services mix, customer concentration,
              cash and burn, and current financing terms.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV009
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not buy on public evidence alone
            body: >-
              The company has credible scale and a relevant control-plane thesis, but the latest retained valuation is
              historical and the economics required for a price-sensitive buy call are not public.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV012
          - type: callout
            title: The key risk is evidence quality, not only product competition
            body: >-
              Current cash, burn, retention, margins, concentration, cap-table terms, and liquidation preferences remain
              unresolved; these can change both return potential and downside protection.
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV011
