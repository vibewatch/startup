            tableRef: TO002
            claimRefs:
              - CO010
              - CO012
      - number: '1.3'
        title: Capital history, scale, and stakeholder structure
        blocks:
          - type: paragraph
            body: >-
              The late-stage financing is directionally clear but not identical across sources. Tracxn records a $204
              million Series F on November 25, 2022 at a $3.7 billion post-money valuation, while Reuters describes a
              $200 million Series F in December 2022 at the same valuation. These should be treated as conflicting
              representations of one round until primary closing documents reconcile amount and date. Tracxn also
              reports $1.04 billion of total funding across nine rounds, a database figure that is not equivalent to
              cash currently available. Reuters reported more than 700 customer organizations and about $300 million of
              annualized recurring revenue in January 2025; Sacra later estimated $342.5 million of ARR in September
              2025. Neither figure is audited revenue.
            claimRefs:
              - CO005
              - CO006
              - CO008
              - CO009
              - CO013
              - CO015
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
