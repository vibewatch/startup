              - CO006
              - CO007
              - CO016
      - number: '1.4'
        title: Milestones, public-market option, and diligence limits
        blocks:
          - type: paragraph
            body: >-
              Reuters reported in October 2025 that Dataiku had hired Morgan Stanley, Citigroup, and other banks to
              prepare for a possible first-half 2026 IPO, while explicitly warning that timing could change. The
              retained pool does not establish that an offering occurred or that a public filing is active as of the run
              date. In March 2026, SiliconANGLE reported a Platform for AI Success expansion built around Agent
              Management, Cobuild, and Reasoning Systems, reinforcing the shift toward governed agent orchestration.
              Independent adverse analysis provides an important market constraint: enterprise agent adoption depends on
              data cleanup, integration, governance, and organizational change and may mature more slowly than the
              product cycle implies. Current audited revenue, margins, retention, cash, burn, customer concentration,
              and complete legal or regulatory status are not established by the assigned evidence.
