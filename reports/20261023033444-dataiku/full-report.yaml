        - >-
          ARR growth remains strong; retention and gross margin verify enterprise software quality; agent governance
          expands spend
        - Upside requires a current valuation that remains reasonable versus verified ARR and durable margins
        - Platform bundling, execution, services intensity
        - Low-to-medium; evidence needed
      - - Base
        - Enterprise adoption continues; current price is fair but disclosure remains incomplete
        - Track until terms, cap table, preferences, and audited economics permit a risk-adjusted entry
        - Unknown cash burn, dilution, customer concentration
        - Medium; most consistent with retained evidence
      - - Bear
        - Growth slows or implementation burden remains high; cloud and data platforms bundle substitutes
        - Down-round or multiple compression; preserve capital and avoid forced entry
        - Commercialization failure, preference overhang, liquidity
        - Material downside; no public probability
      - - Entry gate
        - Verified current financing and audited or diligence-grade operating metrics
        - Buy only after price, dilution, preferences, and return path are observable
        - Incomplete disclosure
        - Unresolved
    notes: >-
      These are qualitative scenarios, not forecasts or probability-weighted valuations; public evidence does not
      support precise price targets or probabilities.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
