  - id: FU001
    title: Customer journey from data access to expansion
    type: journey-map
    summary: >-
      Dataiku's customer journey links initial data access and collaborative preparation to governed deployment,
      monitoring, and broader enterprise use.
    data:
      nodes:
        - id: access
          label: Connect existing data
          details: >-
            Cloud, on-premises, SQL, object storage, and other sources; data remains in its source in the CIO
            demonstration.
        - id: collaborate
          label: Prepare and model collaboratively
          details: Analysts, engineers, and data scientists use visual workflows plus Python, R, SQL, and ML tooling.
        - id: deploy
          label: Deploy operational workflows
          details: >-
            Models, reports, applications, and APIs can be moved toward production; public customer-level deployment
            rates are unavailable.
        - id: govern
          label: Monitor and govern
          details: >-
            Permissions, lineage, monitoring, sign-off, drift detection, and AI governance are described across the
            sources.
        - id: expand
          label: Extend across teams and use cases
          details: >-
            Potential expansion surface spans analytics, ML, generative AI, agents, and governance; NRR and cohort
            expansion are not disclosed.
        - id: renew
          label: Renew and deepen
          details: Renewal, cohort expansion, and concentration are not disclosed and require customer-level diligence.
