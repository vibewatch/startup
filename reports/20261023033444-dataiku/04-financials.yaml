schemaVersion: "report-v2"
artifact: financials
slug: dataiku
runDate: 2026-10-23
company:
  name: Dataiku
chapter:
  number: 4
  title: Financials
  summary: Dataiku appears to monetize a large-enterprise subscription platform through negotiated contracts rather than transparent list pricing. Public evidence supports recurring-revenue scale, but current cash, margins, retention, realized pricing, and revenue mix remain unavailable for underwriting.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: Dataiku's public monetization evidence points to annual subscription access to Data Science Studio and related capabilities, supplemented by professional services, ecosystem partnerships, and marketplace add-ons. Sacra estimates $342.5M of ARR in September 2025, up from $300M at the end of 2024; that is an analyst estimate, not audited revenue. Sacra separately reports roughly 500 customers and states approximately $500K of average ARR per customer at the end of 2023, a historical metric that should not be treated as a current cohort denominator. AWS Marketplace confirms a contract-based “Units” dimension but says neither the unit definition nor price is published. Revenue recognition, renewal rates, services mix, implementation revenue, and concentration remain unverified.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-sales-efficiency
    title: Pricing architecture and sales efficiency
    body: Dataiku does not publish a standard paid price list. A 2026 pricing review identifies a no-cost self-hosted Free Edition and a 14-day hosted trial, while paid deployments route to a sales conversation and are shaped by deployment model, role-based seats, governance, LLM Mesh access, organization size, integrations, and support. AWS Marketplace independently describes pricing as based on contract duration and terms, with additional AWS infrastructure costs possible, but does not define a unit price. These facts imply a high-touch enterprise sales motion with scope-based quoting and potentially material implementation or cloud-cost pass-through. Public sources do not establish sales-cycle length, CAC, payback, win rates, discounting, partner-sourced pipeline, or realized net price, so a sales-efficiency conclusion would be speculative.
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
    tableRefs: [TI002]
  - id: cost-structure-and-capital-adequacy
    title: Cost structure and capital adequacy
    body: The available evidence describes a software platform that can run above customer infrastructure, with compute pushed to external engines or customer environments and additional cloud charges possible. That architecture may reduce owned-infrastructure intensity, but it does not establish Dataiku's gross margin because hosting, support, implementation labor, research and development, stock compensation, and third-party model costs are undisclosed. Capital.com reports that Dataiku began preparing for a potential U.S. IPO after hiring banks, but IPO preparation is not cash and does not establish financing availability. No assigned source reports cash on hand, burn, debt, liquidation preferences, or a next-round trigger. Capital adequacy is therefore a material diligence blocker rather than a quantified conclusion.
    claimRefs: [CI008, CI012, CI013, CI014, CI015]
    tableRefs: [TI003]
  - id: financial-underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      Dataiku has the profile of a scaled enterprise software asset: recurring
      subscription mechanics, large-account positioning, a broad governed platform,
      and estimated ARR growth through September 2025. The underwriting case remains
      constrained by information asymmetry. Current ARR is an estimate, the latest
      customer denominator is historical, and negotiated contracts leave units,
      discounts, renewal economics, and realized price private. A peer data point from
      DataRobot also relies on third-party estimates with nonmatching revenue and
      headcount dates, so it cannot substitute for Dataiku unit economics. The financial
      stance remains track pending an ARR bridge, retention cohorts, gross-margin
      bridge, services split, cash and burn schedules, debt terms, and concentration.
    claimRefs: [CI002, CI003, CI009, CI013, CI014, CI015, CI016, CI018]
callouts:
  - calloutType: strength
    title: Recurring enterprise monetization is plausible
    body: Public descriptions consistently characterize Dataiku as subscription software sold to large organizations, with reported ARR estimates and a contract-based marketplace route. This supports a recurring-revenue hypothesis, but not audited revenue quality.
    claimRefs: [CI001, CI002, CI006]
  - calloutType: risk
    title: Cash and margin visibility are insufficient
    body: No assigned source reports current cash, burn, gross margin, net retention, debt, or services mix. Those omissions prevent a defensible runway or margin-path calculation.
    claimRefs: [CI013, CI014, CI015, CI018]
  - calloutType: recommendation
    title: Underwrite only after private diligence
    body: Request customer-level cohort data, contract and renewal terms, realized price by role and deployment, cost-to-serve, cash and burn schedules, and financing obligations before relying on valuation or growth claims.
    claimRefs: [CI013, CI014, CI015, CI018]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit or basis, Current value/status, Quality, Diligence ask]
    rows:
      - [Core platform subscription, "Annual or multi-year platform access", "Users, deployment, and compute scale", "Sacra estimates $342.5M ARR in Sep 2025", "Third-party estimate; ARR is not audited revenue", "Reconcile ARR to recognized and deferred revenue"]
      - [Professional services, "Consulting, onboarding, training, and integration", "Project or service engagement", "Existence reported; amount unknown", "Third-party business-model description", "Disclose services revenue, utilization, and margin"]
      - [Ecosystem partnerships, "Cloud and data-platform co-selling", "Partner-sourced opportunity or contract", "Existence reported; economics unknown", "Third-party business-model description", "Disclose sourced pipeline, fees, and attribution"]
      - [Marketplace add-ons, "Templates, applications, and plug-ins", "Add-on purchase", "Existence reported; revenue unknown", "Third-party business-model description", "Disclose attach rate, take rate, and margin"]
      - [Agent products, "Standalone Agent Management plus broader platform products", "Contracted product or capability", "Launch and availability disclosed; price unknown", "Company-issued release corroborated by news coverage", "Disclose packaging, incremental ACV, and adoption"]
    notes: "Values mix analyst estimates and qualitative public descriptions; ARR is not revenue, and null or unknown fields require private-company diligence."
    claimRefs: [CI001, CI002, CI004, CI005, CI012]
  - id: TI002
    title: Pricing and monetization mechanics
    columns: [Pricing surface, Published price or rule, List versus realized, Economics implication, Unknown requiring diligence]
    rows:
      - [Free Edition, "No cost; self-hosted; no time limit", "Published entry option", "Low-friction evaluation but limited monetization", "Conversion rate and feature limits in paid cohorts"]
      - [Hosted trial, "14 days; cloud hosted; up to 2 users in the cited FAQ", "Published trial terms", "Supports product evaluation without a disclosed price", "Trial-to-paid conversion and post-trial seat expansion"]
      - [Paid Dataiku plans, "Custom quote through sales", "List price unavailable", "Scope-based enterprise pricing may support value capture", "Discounts, annual minimums, renewal uplift, and realized ACV"]
      - [AWS Marketplace route, "Contract duration and terms; quantity measured in undefined Units", "Contract rule, not a price", "Can simplify procurement but leaves unit economics opaque", "Unit definition, AWS take rate, and infrastructure pass-through"]
      - [Peer comparison, "Alteryx, Databricks, KNIME, and Prophecy publish different price constructs", "Competitor list prices are not Dataiku realized prices", "Dataiku's opacity may reflect enterprise scoping", "Win/loss pricing and buyer switching threshold"]
    notes: "The table intentionally separates published pricing mechanics from realized revenue; competitor prices are contextual only and cannot be used as Dataiku benchmarks."
    claimRefs: [CI006, CI007, CI008, CI009, CI010]
  - id: TI003
    title: Unit economics and capital adequacy
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, "$342.5M in Sep 2025", "Medium; Sacra estimate", "Indicates recurring scale but not audited revenue", "Provide ARR bridge by cohort, product, geography, and currency"]
      - [ARR growth, "$300M end-2024 to $342.5M Sep-2025", "Medium; same analyst estimate", "Directional growth signal over a non-identical period basis", "Reconcile bookings, billings, revenue, and FX"]
      - [Average ARR per customer, "Approximately $500K at end-2023", "Medium; stated by Sacra", "Suggests enterprise ACV potential", "Provide current distribution, concentration, and renewal cohorts"]
      - [Gross margin, null, "Unavailable", "Determines software scalability and valuation support", "Provide hosting, support, services, and infrastructure cost bridge"]
      - [Peer scale reference, "DataRobot revenue $285M Oct-2024 estimate; 869 employees Apr-2026 estimate", "Low; third-party estimates with mismatched dates", "Provides only directional context, not a comparable productivity ratio", "Use audited same-period peer revenue and headcount"]
      - [Cash and runway, null, "Unavailable", "Determines financing dependency and downside risk", "Provide latest cash, burn, debt, and minimum-liquidity schedule"]
      - [CAC / payback, null, "Unavailable", "Tests whether growth is efficiently purchased", "Provide fully loaded S&M spend, new ARR, churn, and payback"]
    notes: "Null means no usable public value was found in the assigned successful sources; no zero or proxy is substituted."
    claimRefs: [CI002, CI003, CI010, CI013, CI014, CI015, CI016, CI018]
