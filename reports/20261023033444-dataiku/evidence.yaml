evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: >-
      Current audited financial statements, ARR bridge, gross margin, retention, cash balance, burn, debt, and customer
      concentration.
    whyItMatters: >-
      These metrics determine whether reported scale converts into durable, capital-efficient recurring economics and
      whether financing proceeds remain available.
    diligencePath: >-
      Request audited financials or a quality-of-earnings package, a cohort ARR reconciliation, cash and debt schedules,
      and customer concentration under NDA.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: leadership
    missingEvidence: A complete current executive roster, board and committee map, delegated authority structure, and succession plan.
    whyItMatters: >-
      The visible founder roles do not establish operating depth, independent oversight, or reduced key-person
      dependence.
    diligencePath: >-
      Obtain a current organization chart, board materials, committee charters, and named succession owners from
      management.
    relatedQuestionRefs:
      - QO002
      - QO003
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      Primary closing documents reconciling the $200 million December 2022 Reuters description and Tracxn's $204 million
      November 2022 record.
    whyItMatters: The difference affects precise financing history, total-raised calculations, and cap-table analysis.
    diligencePath: Review the Series F closing statement, capitalization ledger, securities terms, and any secondary component.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
      - TO003
  - type: stale
    severity: material
    topic: IPO
    missingEvidence: >-
      A current primary filing or company statement confirming whether the reported IPO process advanced, paused, or
      ended.
    whyItMatters: >-
      Liquidity timing, disclosure obligations, and valuation context differ materially between private preparation and
      an active public offering.
    diligencePath: >-
      Check current SEC filings and obtain a management update on bank mandates, board authorization, and target
      timetable.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: A current, independently defined Dataiku-specific SAM and SOM by geography, segment, and spend category.
    whyItMatters: >-
      Overlapping category forecasts show momentum but cannot support a company-specific market-share or valuation
      conclusion.
    diligencePath: >-
      Request management's market model, segmentation assumptions, win rates, and bottom-up account universe, then
      reconcile it to external category definitions.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: buyer-economics
    missingEvidence: Segment-level ACV, sales-cycle length, implementation burden, renewal, and partner-sourced pipeline data.
    whyItMatters: Adoption interest and category growth do not establish Dataiku's monetization efficiency or durable share.
    diligencePath: Obtain cohort-level bookings, implementation hours, renewal and expansion data by customer segment under NDA.
    relatedQuestionRefs:
      - QM010
  - type: conflicting-data
