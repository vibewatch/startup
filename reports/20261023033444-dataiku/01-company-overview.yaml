company:
  name: Dataiku
chapter:
  number: 1
  title: Company Overview
  summary: Dataiku is a Paris-founded, New York-based enterprise AI platform vendor whose reported scale reached more than 700 organizations and at least $300 million of annualized recurring revenue in 2025. The company has a credible late-stage profile, but financing databases disagree on the precise Series F amount and current audited economics, governance detail, and IPO status remain unavailable.
sections:
  - id: identity-and-platform
    title: Identity, product, and operating model
    body: >-
      Dataiku was founded in Paris in 2013, and retained current descriptions
      place its operating base in New York City. Its platform spans data
      preparation, analytics, machine learning, deployment, monitoring, and AI
      governance for both technical and business users. That breadth is
      consistent across independent profiles, a CIO executive demonstration,
      review material, and company-issued marketplace copy. The commercial
      model is described as enterprise subscription software, with annual or
      multi-year contracts supplemented by implementation and training. The
      evidence therefore supports a one-line identity as a governed enterprise
      AI orchestration platform, not a foundation-model developer or cloud
      infrastructure provider. Exact pricing, services mix, and contract
      economics remain private.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      Capital.com identifies Florian Douetteau, Clément Stenac, Marc Batty, and
      Thomas Cabrol as the four founders. SiliconANGLE's March 2026 reporting
      identifies Douetteau as co-founder and chief executive and Stenac as
      co-founder and chief technology officer, tying both founders directly to
      the latest product strategy. That continuity is a strength because the
      company's move from collaborative data science toward governed agent
      orchestration has clear founder sponsorship. It is also a concentration
      risk: the retained pool does not provide a complete current executive
      roster, board committee structure, succession plan, or delegated
      decision-rights map. Governance quality and operating depth therefore
      remain only partially observable.
    claimRefs: [CO010, CO012]
    tableRefs: [TO002]
  - id: capital-and-scale
    title: Capital history, scale, and stakeholder structure
    body: >-
      The late-stage financing is directionally clear but not identical across
      sources. Tracxn records a $204 million Series F on November 25, 2022 at a
      $3.7 billion post-money valuation, while Reuters describes a $200 million
      Series F in December 2022 at the same valuation. These should be treated
      as conflicting representations of one round until primary closing
      documents reconcile amount and date. Tracxn also reports $1.04 billion of
      total funding across nine rounds, a database figure that is not equivalent
      to cash currently available. Reuters reported more than 700 customer
      organizations and about $300 million of annualized recurring revenue in
      January 2025; Sacra later estimated $342.5 million of ARR in September
      2025. Neither figure is audited revenue.
    claimRefs: [CO005, CO006, CO008, CO009, CO013, CO015, CO016]
    tableRefs: [TO003]
  - id: milestones-and-diligence
    title: Milestones, public-market option, and diligence limits
    body: >-
      Reuters reported in October 2025 that Dataiku had hired Morgan Stanley,
      Citigroup, and other banks to prepare for a possible first-half 2026 IPO,
      while explicitly warning that timing could change. The retained pool does
      not establish that an offering occurred or that a public filing is active
      as of the run date. In March 2026, SiliconANGLE reported a Platform for AI
      Success expansion built around Agent Management, Cobuild, and Reasoning
      Systems, reinforcing the shift toward governed agent orchestration.
      Independent adverse analysis provides an important market constraint:
      enterprise agent adoption depends on data cleanup, integration,
      governance, and organizational change and may mature more slowly than the
      product cycle implies. Current audited revenue, margins, retention, cash,
      burn, customer concentration, and complete legal or regulatory status are
      not established by the assigned evidence.
    claimRefs: [CO007, CO011, CO014]
    figureRefs: [FO001]
