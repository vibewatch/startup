callouts:
  - calloutType: strength
    title: Governed orchestration is the strategic through-line
    body: "Current product evidence consistently positions Dataiku as a shared, governed layer connecting data, analytics, machine learning, and enterprise AI agents across technical and business users."
    claimRefs: [CO003, CO011]
  - calloutType: risk
    title: Scale and liquidity evidence remain non-audited
    body: "Series F sources disagree on amount and timing, the IPO report was conditional, and the available ARR signals are reported or estimated rather than audited accounting revenue."
    claimRefs: [CO005, CO006, CO007, CO009, CO015]
  - calloutType: insight
    title: Agentic demand depends on enterprise readiness
    body: "The product expansion addresses a real orchestration and governance problem, but independent adverse analysis argues that data, integration, security, and organizational groundwork can make broad agent adoption a long transition."
    claimRefs: [CO011, CO014]
