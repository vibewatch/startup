      - ["Compute and orchestration", "Execute pipelines, agents, and models", "EKS plus Python, R, Spark, and native cloud services", "Capacity and cost may vary with workload and deployment topology"]
      - ["Model and agent services", "Build, route, deploy, and monitor AI assets", "LLM providers, SageMaker, Bedrock, and other model services", "Provider changes and evaluation quality can create operational drift"]
      - ["Governance control plane", "Register assets and enforce approvals", "Customer policies, registries, lineage, and sign-off workflows", "Configuration quality and adoption determine control effectiveness"]
    notes: "Dependencies are explicit in the retained technical and marketplace descriptions; no source supplies a complete reference architecture, SLA, or total-cost model."
    claimRefs: [CE005, CE006, CE007, CE008, CE010]
