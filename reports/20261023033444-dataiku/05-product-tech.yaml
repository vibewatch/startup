company:
  name: Dataiku
chapter:
  number: 5
  title: Product & Technology
  summary: Dataiku presents a broad enterprise control plane spanning analytics, machine learning, agents, orchestration, and governance. The strongest evidence is its current DSS 15 documentation and developer materials; external coverage and marketplace reviews support the multi-environment positioning but flag scale-performance and pricing-transparency questions.
sections:
  - id: product-workflow
    title: Product workflow and user surface
    body: >-
      Dataiku is delivered as an enterprise platform for moving from data access and preparation
      through model development, deployment, and monitoring. A CIO demonstration describes access
      for coders and non-coders across cloud, on-premises, and other locations, while stating that
      the platform supports analysis, machine learning, and generative AI in one governed user
      interface. The same demonstration says Dataiku operates as a UI layer over existing data
      sources rather than requiring large datasets to be moved, and describes a browser-based
      experience hosted in the cloud, a VPC, or on-premises. That is a coherent workflow thesis
      for enterprises with heterogeneous estates, but the public material does not quantify
      implementation time, deployment success rates, or realized customer outcomes.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-operations
    title: Architecture, deployment, and operating model
    body: >-
      The current DSS 15 developer guide groups five capabilities—agentic AI, machine learning,
      modern analytics, orchestration, and governance—inside one enterprise platform. It describes
      visual and code agents, an LLM Mesh for provider routing and quotas, a unified Flow and
      deployment automation, model registries, lineage, explainability, and monitoring. AWS
      Marketplace materials add concrete infrastructure dependencies: elastic compute powered by
      Amazon EKS for Python, R, and Spark, integrations with SageMaker and Comprehend, and an
      LLM Mesh connection to Amazon Bedrock. Dataiku's documentation site also exposes a developer
      guide, API reference, Academy, and community, while the public Python client repository
      confirms a public DSS API client. These are observable integration surfaces, not proof of
      uptime, scale limits, or customer-specific architecture.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: differentiation-and-risks
    title: Differentiation, trust, and technical diligence
    body: >-
      Dataiku's differentiation is the combination of a shared workflow for technical and
      business users with centralized governance across data, models, LLMs, and agents. Dataiku
      Govern describes registries for bundles, models, and LLMs, documented approval workflows,
      sign-off rules, audit timelines, and notifications. Independent marketplace and review
      material supports a broad multi-vendor and hybrid deployment proposition, but also leaves
      commercial and operational diligence open: AWS lists unit-based billing whose mapping is
      set by quote, and marketplace review text includes a complaint that the product's unique
      capabilities can be confusing compared with similar platforms. A synthesized review page
      also reports slow performance for large datasets and complex scenarios. Those signals make
      workload benchmarking, reference calls, access-control testing, and a full pricing/
      implementation schedule necessary before treating the architecture as proven at scale.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: []
callouts:
  - calloutType: strength
    title: Broad enterprise control plane
    body: Dataiku has unusually broad documented coverage from agent creation through deployment, governance, and monitoring, with explicit support for mixed technical skill levels and multi-vendor infrastructure.
    claimRefs: [CE005, CE006, CE007]
  - calloutType: risk
    title: Scale and commercial proof remain incomplete
    body: Public material does not establish workload performance, reliability, realized deployment outcomes, or transparent realized pricing; external review signals warrant a controlled benchmark and reference diligence.
    claimRefs: [CE012, CE013, CE014]
