  evidenceGaps:
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: Public uptime, incident history, latency, throughput, and production-scale benchmark results for representative Dataiku workloads.
      whyItMatters: The platform's value depends on operating complex pipelines and models reliably, but the retained sources describe capabilities rather than measured service performance.
      diligencePath: Request customer references, SLA and incident summaries, and run a benchmark covering interactive, batch, and model-serving workloads.
      relatedQuestionRefs: [QE007]
    - type: private-evidence-only
      severity: material
      topic: implementation
      missingEvidence: Customer-specific implementation effort, services mix, adoption depth, and production deployment outcomes.
      whyItMatters: A broad feature surface can carry substantial integration and change-management cost that public product pages do not quantify.
      diligencePath: Obtain a representative statement of work, time-to-production data, services invoices, and reference calls from comparable enterprises.
      relatedQuestionRefs: [QE005, QE007]
    - type: missing-source
      severity: material
      topic: security
      missingEvidence: Independent security certifications, penetration-test scope, privacy controls, and evidence that governance policies block noncompliant deployment in practice.
      whyItMatters: Governance descriptions are company claims and do not independently establish control effectiveness for regulated workloads.
      diligencePath: Request current certifications, SOC reports, DPA, penetration-test summary, and a controlled policy-enforcement demonstration.
      relatedQuestionRefs: [QE006, QE008]
    - type: missing-source
      severity: minor
      topic: pricing
      missingEvidence: Realized pricing by deployment size, unit definition, discounts, and implementation fees.
      whyItMatters: Quoted unit pricing prevents a buyer from estimating total cost or comparing the platform with alternatives from public information.
      diligencePath: Obtain a multi-year quote with units, usage assumptions, support, cloud infrastructure, and professional-services line items.
      relatedQuestionRefs: [QE008]
