artifact: risks
slug: dataiku
runDate: 2026-10-23
company:
  name: Dataiku
chapter:
  number: 7
  title: Risks
  summary: Dataiku's central risk is execution at the intersection of enterprise AI governance, changing regulation, and multi-cloud dependency. Public evidence shows a credible governance product direction and useful deployment controls, but also leaves material uncertainty around regulatory coverage, pricing exposure, production reliability, and partner concentration.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Dataiku sells governance into a market where the rules are becoming operational rather than aspirational. The European Commission says high-risk AI systems will require risk assessment, dataset quality, logging, documentation, human oversight, robustness, cybersecurity, and accuracy obligations, with high-risk use cases applying from December 2027 under the current implementation timeline. That creates demand for controls but also raises the cost of proving that a customer's particular deployment is compliant. Dataiku's public product materials describe governance, lineage, monitoring, and agent oversight, yet the available evidence does not establish that these features satisfy every jurisdictional obligation or that Dataiku is itself the regulated provider or deployer in each customer arrangement. The most important legal diligence is therefore a product-to-obligation mapping by deployment model, jurisdiction, and use case, rather than assuming that a governance label is a compliance certification. The FTC legal library illustrates the breadth and pace of privacy, competition, and consumer-protection enforcement generally; it does not identify a Dataiku matter, so no company-specific enforcement conclusion is warranted.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-quality-security
    title: Operational, quality, and security exposure
    body: >-
      The operating model is inherently complex: Dataiku presents a single interface over cloud, on-premises, databases, data warehouses, model environments, and third-party agent frameworks. That breadth can reduce data movement, but it also creates failure modes at connectors, permissions, model behavior, deployment orchestration, and monitoring boundaries. A company-hosted demonstration says Dataiku tracks users' access to data sources, models, and LLMs, while the AWS listing states that infrastructure costs may be additional and that AWS does not warrant vendor-supplied product content. Those statements support the existence of controls and a clear shared-responsibility boundary, not an absence of incidents. The new agent products are also a delivery risk: independent coverage describes Agent Management as not yet available at the time of reporting and places other capabilities on a 2026 launch schedule. The practical kill criteria are measurable: unresolved critical security findings, material data leakage, repeated model-drift or cost-overrun alerts without closure, or launch slippage that prevents referenceable production deployments.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: partners-financial-dependencies
    title: Partner and financial dependencies
    body: >-
      Dataiku's value proposition depends on an ecosystem rather than a self-contained stack. AWS Marketplace describes integrations with S3, Redshift, RDS, EKS, SageMaker, Comprehend, Bedrock, and customer-controlled deployment choices, while current industry coverage describes monitoring across AWS, Snowflake, Databricks, and Google environments. This expands addressable use cases but increases exposure to platform APIs, cloud economics, procurement channels, and competing control planes. Commercial opacity compounds that risk: the AWS listing uses a contract-based Units measure, does not publish the unit definition or price, and says buyers must obtain a quote; additional AWS infrastructure costs may apply. Public review evidence is useful as a signal of user experience but is not a substitute for retention, concentration, margin, or cash data. A financing or IPO process was reported in 2025, and the prior 2022 round and valuation were reported by Reuters-syndicated coverage, but those facts do not show current liquidity or runway. Diligence should obtain partner-sourced pipeline, renewal and churn by deployment type, cloud-cost pass-through, cash and burn, and concentration by top customers and providers before treating ecosystem breadth as resilience.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns: [Rule / case, Jurisdiction, Status, Likelihood, Severity, Mitigation, Residual exposure, Diligence path]
    rows:
      - ["EU AI Act high-risk obligations", "European Union", "High-risk obligations scheduled for sensitive use cases from 2027; governance and GPAI rules already apply on the Commission timeline", "Medium", "High", "Map controls, logging, documentation, human oversight, cybersecurity, and accuracy to each deployment", "High until product-to-obligation coverage is evidenced", "Obtain legal matrix by use case, customer role, and jurisdiction"]
      - ["AI transparency and GPAI obligations", "European Union", "Transparency rules and GPAI governance are on the Commission's stated 2026 implementation path", "Medium", "High", "Maintain model/vendor inventory, content disclosures, traceability, and escalation ownership", "Medium-high because third-party models and agents change", "Review DPA, model cards, audit logs, and responsibility allocation"]
      - ["Privacy, competition, and consumer-protection enforcement", "United States / cross-border", "FTC Legal Library records hundreds of active and historical matters across these categories; no Dataiku-specific matter is identified in the retained page", "Low-medium", "Medium", "Maintain privacy, security, marketing-claim, and competition review processes", "Unknown; absence from this page is not proof of absence", "Run counsel-led litigation, regulator, sanctions, and IP searches"]
    notes: "Rows synthesize the European Commission and FTC pages with Dataiku product and marketplace descriptions; regulatory applicability is use-case-specific, and null or unknown company status is not treated as clearance."
    enumerationScope:
      coverage: partial
      basis: "Public regulatory framework and enforcement-page review available on 2026-10-23; not a complete docket or legal opinion"
    claimRefs: [CR001, CR002, CR003, CR004]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Connector, permission, or lineage failure across hybrid data estates", "Medium", "High", "Documented controls and catalog visibility are evidenced, but independent control testing is unavailable", "Medium-high", "No public uptime, incident, recovery-time, or connector-error history"]
      - ["Agent or model drift produces incorrect decisions or policy violations", "Medium-high", "High", "Agent monitoring and KPI concepts are described; production performance evidence is limited", "High", "No public drift alert rates, false-positive rates, or remediation SLAs"]
      - ["Security or privacy incident involving data, models, or LLMs", "Medium", "High", "Governance and access tracking are described; certification and incident evidence are not retained here", "High", "Obtain SOC reports, penetration results, breach history, and customer notification procedures"]
      - ["New agent products launch late or fail to reach production quality", "Medium", "High", "Roadmap dates and controlled visual review are described by company and trade coverage", "Medium-high", "Verify availability, reference customers, adoption, defect backlog, and support capacity"]
    notes: "Likelihood and residual exposure are analytical risk ratings anchored to the retained product, regulatory, and marketplace evidence; they are not incident-rate estimates. Unknown public evidence is preserved as an explicit gap."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty, Role, Concentration, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Cloud infrastructure and AI services", "AWS", "Marketplace, compute, storage, SageMaker, Bedrock, and managed deployment path", "Material but not quantified", "Pricing, API, service, or procurement change raises cost or disrupts workloads", "High", "Hybrid, on-premises, and multi-cloud deployment claims", "Medium-high; customer-specific portability is unverified"]
      - ["External data, model, and agent platforms", "Snowflake, Databricks, Google and others", "Connectors and cross-platform agent monitoring", "Material but not quantified", "API changes, access restrictions, or competing control planes reduce functionality", "High", "Governed connective layer and multi-platform visibility are described", "High until contract and compatibility evidence is reviewed"]
      - ["Enterprise procurement and implementation channel", "Customers, partners, and service teams", "Contract-based quoting, expert services, and customer deployment", "Unknown", "Long implementation, services dependence, or renewal friction compresses cash conversion", "Medium-high", "Marketplace route, training, and expert services are available", "High because pricing, services mix, and concentration are undisclosed"]
    notes: "The dependency set is a partial public-evidence register, not a complete supplier list. Concentration is marked unknown or material-but-unquantified where no denominator or contract disclosure was available."
    claimRefs: [CR010, CR011, CR012, CR013]
figures:
