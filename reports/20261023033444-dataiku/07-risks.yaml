      rows:
        - label: EU deployment compliance
          values: ["Medium", "High", "Partial", "High"]
        - label: Agent/model drift
          values: ["Medium-high", "High", "Partial", "High"]
        - label: Security/privacy incident
          values: ["Medium", "High", "Unverified", "High"]
        - label: Cloud/API dependency
          values: ["Medium", "High", "Partial", "Medium-high"]
        - label: Pricing and services opacity
          values: ["Medium", "Medium-high", "Low", "Medium-high"]
        - label: Roadmap execution
          values: ["Medium", "High", "Early", "Medium-high"]
    approximationNotes: "Qualitative ratings are evidence-constrained judgments; they do not represent measured incident probabilities."
    claimRefs: [CR002, CR006, CR007, CR009, CR011, CR012]
callouts:
  - calloutType: risk
    title: Thesis-break triggers
    body: Escalate the risk rating if Dataiku cannot evidence production-grade controls for regulated deployments, experiences a material security or privacy incident, misses the new-product roadmap without referenceable customers, or loses portability across major cloud and data platforms.
    claimRefs: [CR002, CR006, CR007, CR009, CR011]
  - calloutType: assumption
    title: Evidence boundary
    body: The retained public record does not disclose Dataiku's current cash, burn, gross margin, retention, customer concentration, incident history, or complete legal docket; these remain diligence requirements rather than inferred positives.
    claimRefs: [CR004, CR007, CR013]
