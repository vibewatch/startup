figures:
  - id: FP001
    title: Competitive positioning by accessibility and governed platform breadth
    type: quadrant
    summary: >-
      Dataiku occupies the high-accessibility, high-breadth position in this
      evidence-bounded ordinal synthesis, while integrated platforms and internal
      builds trade ease of use for infrastructure or engineering control.
    data:
      xAxis:
        label: "Business-user accessibility (1 low, 5 high)"
        min: 1
        max: 5
      yAxis:
        label: "Governed platform breadth (1 narrow, 5 broad)"
        min: 1
        max: 5
      points:
        - label: Dataiku
          x: 5
          y: 5
          detail: "Visual and coded workflows spanning analytics, ML, agents, and governance; onboarding remains nontrivial."
        - label: Databricks
          x: 2
          y: 5
          detail: "Very broad governed data-and-AI platform with a more technical core, despite expanding business interfaces."
        - label: H2O.ai
          x: 3
          y: 4
          detail: "Open-source ML framework plus proprietary applications and AI Cloud."
        - label: Alteryx
          x: 5
          y: 2
          detail: "Highly visual analytics and ETL substitute; assigned evidence supports narrower deployment breadth."
        - label: Hyperscaler stack
          x: 2
          y: 4
          detail: "Broad native services with infrastructure distribution, but buyers assemble the user and governance layer."
        - label: Internal build
          x: 1
          y: 3
          detail: "Maximum component choice with accessibility, governance, and support engineered internally."
    approximationNotes: >-
      Analyst-authored 1–5 ordinal scores synthesize retained qualitative evidence;
      they are not measured benchmarks, product test results, or value-proportional
      estimates.
    claimRefs: [CP001, CP004, CP009, CP012, CP013, CP014]
callouts:
  - calloutType: strength
    title: Cross-functional standardization is the core wedge
    body: >-
      Dataiku can replace fragmented analyst, engineering, and data-science tools
      without requiring all users to adopt the same coding interface or move the
      underlying data.
    claimRefs: [CP001, CP002, CP012]
  - calloutType: risk
    title: Breadth is becoming table stakes
    body: >-
      Databricks, hyperscalers, and open-source frameworks are expanding into
      governed agents and easier interfaces, while review evidence shows that
      Dataiku itself carries cost, setup, learning-curve, and performance friction.
    claimRefs: [CP004, CP009, CP013, CP014]
