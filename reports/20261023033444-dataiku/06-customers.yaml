    notes: "Segments synthesize role and workflow descriptions from Dataiku, AWS Marketplace, CIO, and independent coverage; no source discloses payer mix, revenue bands, seat counts, or segment penetration."
    claimRefs: [CU001, CU002, CU003, CU004]
