      - [Organizations served, ">700", "Reuters report; timing described alongside 2025 ARR", "High", "Independent corroboration of broad footprint", "No cohort, geography, or revenue concentration disclosed"]
      - [People using Dataiku, "Tens of thousands", "Dataiku page; undated page copyright 2013–2024", "Medium", "Suggests multi-role usage beyond a single team", "No active-user, paid-seat, or organization denominator"]
      - [Companies with measurable ROAI, ">600", "Dataiku page; undated page copyright 2013–2024", "Medium", "Supports claimed outcome orientation", "Company-controlled claim; outcome methodology and denominator absent"]
      - [Marketplace rating, "4.4/5 from 276 ratings", "AWS Marketplace page accessed 2026-10-23", "Medium", "Provides directional customer sentiment", "Review population and renewal linkage are not disclosed"]
      - [Five-star share, "61%", "AWS Marketplace page accessed 2026-10-23", "Medium", "Shows a favorable review distribution", "Not a retention, production-use, or cohort metric"]
      - [Four-star share, "32%", "AWS Marketplace page accessed 2026-10-23", "Medium", "Shows additional positive review density", "Not a retention, production-use, or cohort metric"]
      - [Public retention metrics, null, "Assigned pool", "Low", "Prevents a verified durability conclusion", "NRR, GRR, churn, renewal, contract length, expansion, and concentration are undisclosed"]
    notes: "Counts are not reconciled into a time series: the sources use different dates, definitions, and issuers, and none supplies active-account, cohort, seat, or utilization denominators."
    claimRefs: [CU005, CU006, CU007, CU008]
  - id: TU003
    title: Named customer proof table
    enumerationScope:
      coverage: sample
      basis: "Named organizations explicitly identified in 2025-2026 public company coverage and market reporting"
    columns: [Customer, Segment or geography, Publicly described use, Production versus pilot, Outcome or reference quality, Limitation]
    rows:
      - [Johnson & Johnson, "Large enterprise; sector not specified in cited excerpt", "Dataiku customer example", "Not specified", "Named by Reuters and Capital.com", "No deployment scope, outcome, renewal, or quote"]
      - [Toyota, "Large enterprise; sector not specified in cited excerpt", "Dataiku customer example", "Not specified", "Named by Reuters and Capital.com", "No deployment scope, outcome, renewal, or quote"]
      - [General Electric, "Large enterprise; sector not specified in cited excerpt", "Dataiku customer example", "Not specified", "Named by Reuters and Capital.com", "No deployment scope, outcome, renewal, or quote"]
      - [BNP Paribas, "Large enterprise; financial services", "Dataiku customer example", "Not specified", "Named by Reuters and Capital.com", "No deployment scope, outcome, renewal, or quote"]
    notes: "This is a representative named-reference sample, not an exhaustive customer list. Logos and names establish public reference quality only; they do not prove current production deployment or retention."
    claimRefs: [CU009, CU010, CU011, CU012]
figures:
  - id: FU001
    title: Customer journey from data access to expansion
    type: journey-map
    summary: Dataiku's customer journey links initial data access and collaborative preparation to governed deployment, monitoring, and broader enterprise use.
    data:
      nodes:
        - id: access
          label: Connect existing data
          details: "Cloud, on-premises, SQL, object storage, and other sources; data remains in its source in the CIO demonstration."
        - id: collaborate
          label: Prepare and model collaboratively
          details: "Analysts, engineers, and data scientists use visual workflows plus Python, R, SQL, and ML tooling."
        - id: deploy
          label: Deploy operational workflows
          details: "Models, reports, applications, and APIs can be moved toward production; public customer-level deployment rates are unavailable."
        - id: govern
          label: Monitor and govern
          details: "Permissions, lineage, monitoring, sign-off, drift detection, and AI governance are described across the sources."
        - id: expand
          label: Extend across teams and use cases
          details: "Potential expansion surface spans analytics, ML, generative AI, agents, and governance; NRR and cohort expansion are not disclosed."
        - id: renew
          label: Renew and deepen
          details: "Renewal, cohort expansion, and concentration are not disclosed and require customer-level diligence."
    approximationNotes: "The stages are an evidence-based operating sequence, not a measured conversion funnel; no stage counts or conversion rates are available."
    claimRefs: [CU001, CU002, CU014, CU015, CU016]

callouts:
  - calloutType: strength
    title: Enterprise breadth is credible but not fully measurable
    body: "Independent reporting and secondary market coverage both cite more than 700 organizations, while Dataiku describes more than 600 companies and tens of thousands of people; the difference in definitions and dates prevents a clean growth series."
    claimRefs: [CU005, CU006, CU007, CU008]
  - calloutType: risk
    title: Retention remains the key customer diligence gap
    body: "No assigned source discloses NRR, GRR, churn, renewal, contract length, cohort expansion, or customer concentration, and marketplace reviews surface setup, price, comparison, and niche-data-source friction."
    claimRefs: [CU010, CU011, CU012, CU013]

