schemaVersion: "report-v2"
artifact: customers
slug: dataiku
runDate: 2026-10-23
company:
  name: Dataiku
chapter:
  number: 6
  title: Customers
  summary: Dataiku has credible enterprise adoption signals, including more than 700 organizations cited by Reuters and Capital.com and named large-company use cases, but public evidence is stronger for customer breadth and workflow fit than for active usage, retention, expansion, or concentration. Recent marketplace and review evidence shows cross-functional appeal alongside implementation, pricing, comparison, and niche-data-source friction.
sections:
  - id: customer-segments
    title: Buyer, user, and deployment segments
    body: Dataiku's customer model is enterprise-wide rather than confined to one technical persona. The platform is described as serving data scientists, engineers, analysts, business users, and domain experts, with use spanning predictive maintenance, fraud detection, demand forecasting, and other operational analytics. This supports a segmentation thesis in which the economic buyer is likely an enterprise data or technology organization, while adoption depends on analysts and domain teams being able to use the same governed workspace. The evidence does not disclose customer-level revenue bands, seat counts, geography mix, or payer-versus-user splits, so scale should not be inferred from logos or a broad organization count.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named customer proof
    body: Public evidence indicates a sizable enterprise footprint, but it does not establish an auditable active-account or deployment trajectory. Reuters reports more than 700 organizations and names Johnson & Johnson, Toyota, General Electric, and BNP Paribas; Capital.com repeats the greater-than-700 figure and gives the same examples. Dataiku's own surface adds a different scale signal—"more than 600 companies" and tens of thousands of people with measurable return on AI—while Forbes reports more than 700 organizations and lists LVMH, Morgan Stanley, Michelin, and Novartis. These are useful reference points, but differing dates, definitions, and issuers prevent treating them as one reconciled customer KPI.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
  - id: retention-and-expansion
    title: Durability, expansion, and procurement friction
    body: >-
      Dataiku's product positioning is compatible with land-and-expand behavior: it can begin with a team or use case and extend across analytics, machine learning, generative AI, deployment, monitoring, and governance. AWS Marketplace describes contract-based Units pricing with a negotiated quantity and term, while reviews show both cross-functional value and friction. One reviewer says the platform lets data scientists, business users, and analysts work on one visual platform; the same review reports that setup may be difficult and the product may be expensive. Other review excerpts mention comparisons with Alteryx, confusion about differentiated capabilities, and missing niche data sources. No public source in this pool reports NRR, GRR, churn, renewal rates, contract length, cohort expansion, or customer concentration.
    claimRefs: [CU010, CU011, CU012, CU013]
  - id: customer-journey-and-gaps
    title: Adoption loop and unresolved customer diligence
    body: The observable customer journey runs from connecting existing data, through collaborative preparation and modeling, to deployment, monitoring, and governance. That sequence is reinforced by independent product coverage, an AWS marketplace listing, customer-review excerpts, and Dataiku's own platform description. The commercial implication is positive if one governed workflow creates multiple internal stakeholders and recurring operational dependence; the risk is that implementation complexity, infrastructure requirements, services intensity, and procurement friction may slow expansion or make the platform heavier than a point solution. The available sources do not provide customer-level outcome baselines, renewal cohorts, implementation duration, services mix, or concentration data, so those remain material diligence asks.
    claimRefs: [CU014, CU015, CU016]
    figureRefs: [FU001]

