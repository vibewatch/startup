  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Revenue, ARR, and profitability data
    missingEvidence: Spring Health has never publicly disclosed ARR, revenue, or margin metrics. No SEC Form D filings were found under its known corporate names in EDGAR.
    whyItMatters: Without revenue data, investors cannot evaluate capital efficiency, burn rate, or path to profitability at a $3.3B valuation.
    diligencePath: Request cap table, revenue schedule, and P&L from data room; check Delaware Secretary of State or SEC EDGAR for any undisclosed Form D filings.
  - type: private-evidence-only
    severity: moderate
    topic: Series D round absence or undisclosed details
    missingEvidence: The company references a Series E (April 2024) with no publicly confirmed Series D, creating an unexplained two-year gap from Series C (2022).
    whyItMatters: A missing or undisclosed Series D could indicate a down-round, bridge financing, or significant dilution not reflected in the $3.3B headline.
    diligencePath: Request full cap table and all financing documents from data room; cross-check against Delaware corporate filings.
    relatedQuestionRefs:
    - QO010
  - type: private-evidence-only
    severity: moderate
    topic: Full board and governance rights completeness
    missingEvidence: While Tiger Global, Kinnevik, and William Blair are identified as investors, exact board seats, voting agreements, liquidation preferences, and anti-dilution provisions are not publicly disclosed.
    whyItMatters: Governance rights and board composition materially affect investor alignment, control risk, and exit path flexibility.
    diligencePath: Request company bylaws, shareholder agreement, and board composition disclosure in data room.
    relatedQuestionRefs:
    - QO005
    relatedTableRefs:
    - TO002
    - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone Table completeness (TO004)
    missingEvidence: Internal product milestones, team growth events, regulatory interactions beyond Knox-Keene, and governance decisions are not publicly documented.
    whyItMatters: A fuller chronology would aid diligence on schedule adherence, adverse events, and strategic pivots.
    diligencePath: Request board minutes, product roadmap history, and regulatory correspondence log in data room.
    relatedTableRefs:
    - TO004
