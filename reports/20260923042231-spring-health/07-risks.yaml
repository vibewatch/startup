    - NQTL parity analysis; employer plan design
    - High
    - Partial – compliance asserted; NQTL analysis requirements new for 2024
    - Spring Health's clinical model supports parity; no specific NQTL documentation disclosed
    - Request MHPAEA compliance attestation and NQTL analysis from data room
  - - HIPAA Privacy and Security Rules (HHS OCR)
    - PHI handling; Business Associate Agreement
    - High
