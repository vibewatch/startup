    statement: Spring Health is a HIPAA Business Associate (BA) for employer health plan sponsors. A breach of PHI at Spring Health's 20M covered lives scale would trigger the HHS OCR Breach Notification Rule, require notification to affected individuals and the media, and could result in OCR civil money penalties up to $1.9M per violation category per year.
