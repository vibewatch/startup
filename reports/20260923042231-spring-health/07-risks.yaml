- id: SR002
  title: Legal and Liability Risk
  body: 'Spring Health''s clinical delivery model—placing licensed providers in the care of members with severe mental health conditions—creates direct liability exposure for clinical negligence and inadequate supervision. Unlike software platforms that disclaim clinical liability, Spring Health operates as an organized healthcare delivery system with contracted providers, outcomes accountability, and ROI guarantees—each of which creates obligations that pure-tech platforms do not carry.

    The most significant emerging legal risk is AI clinical liability. Guide AI''s proactive continuous care model involves an AI system making unsolicited suggestions to members about their mental health care. If Guide AI fails to detect a crisis signal, provides incorrect guidance, or delays a member''s access to emergency care, Spring Health could face professional liability claims—either directly or through indemnification of its provider network. The VERA-MH safety framework addresses the chatbot suicidal ideation risk, but Guide''s proactive model is not covered by any published safety standard.

    The FTC BetterHelp consent order (2023) created a legal precedent that mental health data shared with advertising platforms—even with user disclosure—violates FTC Section 5. Spring Health''s use of analytics vendors, remarketing pixels, and employer analytics dashboards must be structured to avoid the BetterHelp violation pattern: sharing member mental health status, treatment history, or engagement data with third parties for non-treatment purposes without express informed consent.

    The 42 CFR Part 2 federal regulations (Confidentiality of Substance Use Disorder Patient Records) impose additional consent requirements for sharing SUD treatment records beyond standard HIPAA. Spring Health''s Specialty Care SUD pathways must comply with Part 2 on data sharing with employer analytics dashboards—an area where many digital health companies have encountered unexpected compliance complexity.

    '
