    - SR006
    confidence: high
    freshness: current
  - id: CR005
    statement: 42 CFR Part 2 (SAMHSA) imposes stricter-than-HIPAA consent requirements for the use and disclosure of substance use disorder treatment records. Spring Health's Specialty Care SUD pathways (launched 2023) create a direct 42 CFR Part 2 compliance obligation for any data sharing of SUD member records with employer analytics dashboards—a requirement Spring Health has not publicly addressed.
