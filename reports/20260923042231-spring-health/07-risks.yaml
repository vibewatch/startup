  claims:
  - id: CR001
    statement: The MHPAEA 2024 final rule (effective for plan years starting January 2025) requires employer-sponsored health plans using Spring Health to conduct formal comparative NQTL analyses for mental health and substance use disorder benefits—a new compliance obligation that directly implicates Spring Health's prior authorization, utilization management, and network adequacy protocols.
    type: third-party-reported
    topic: regulatory
    sourceRefs:
    - SR001
    - SR014
    confidence: high
    freshness: current
  - id: CR002
    statement: MHPAEA enforcement by the DOL Employee Benefits Security Administration (EBSA) and HHS has increased substantially in 2023–2025; the 2024 final rule gives enforcement agencies direct authority to require employers to produce NQTL analysis documentation—creating a new compliance workflow for Spring Health's employer clients.
    type: third-party-reported
    topic: regulatory
    sourceRefs:
    - SR001
    - SR014
    confidence: high
    freshness: current
  - id: CR003
    statement: Spring Health's telehealth-first model and <2 day time-to-appointment standard actually support MHPAEA network adequacy parity—a favorable compliance position—but its utilization management criteria and prior authorization practices for specialty care must be analyzed to ensure they are no more restrictive than the employer's medical/surgical utilization management.
    type: inferred
    topic: regulatory
    sourceRefs:
    - SR001
    - SR006
    confidence: medium
    freshness: current
  - id: CR004
    statement: Spring Health operates under the California Knox-Keene Health Care Service Plan Act following its 2025 license, subjecting its California health plan operations to DMHC oversight—including solvency requirements, member grievance and appeals processes, and network adequacy standards specific to managed care plans.
    type: company-claimed
    topic: regulatory
    sourceRefs:
