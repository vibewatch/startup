    - Request BAA template, incident response plan, OCR audit history
  - - FTC Act Section 5 (Mental Health Data)
    - Third-party data sharing with advertisers/analytics
    - High
    - Unknown – Spring Health has not disclosed data sharing practices with third parties
    - VERA-MH zero-retention policy stated for AI training; no disclosure of analytics vendor practices
    - Request data flow diagram and third-party data sharing disclosures
  - - California Knox-Keene Act (DMHC)
    - CA health plan operations; solvency; grievance/appeals
    - Medium-High
    - Licensed 2025; compliance expected from licensure
    - Knox-Keene license obtained; DMHC oversight applies
    - Monitor DMHC filings and any grievance or enforcement actions
  - - 42 CFR Part 2 (SUD Records Confidentiality)
    - SUD pathway data sharing with employer analytics
    - Medium
    - Unknown – Spring Health's SUD Specialty Care pathway is relatively new
    - Specialty Care SUD launched 2023; Part 2 compliance not publicly addressed
    - Request SUD data handling procedures and Part 2 consent framework
  - - MHPAEA Network Adequacy (access standards)
    - Time-to-appointment, geographic access, telehealth parity
    - Medium
    - Spring Health reports <2 day access; telehealth-first model addresses geographic access
    - JAMA study and platform metrics confirm access; NQTL analysis for network adequacy required
    - Request network adequacy analysis and provider-to-member ratios
