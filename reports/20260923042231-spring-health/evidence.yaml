evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Revenue, ARR, and profitability data
    missingEvidence: >-
      Spring Health has never publicly disclosed ARR, revenue, or margin metrics. No SEC Form D filings were found under
      its known corporate names in EDGAR.
    whyItMatters: >-
      Without revenue data, investors cannot evaluate capital efficiency, burn rate, or path to profitability at a $3.3B
      valuation.
    diligencePath: >-
      Request cap table, revenue schedule, and P&L from data room; check Delaware Secretary of State or SEC EDGAR for
      any undisclosed Form D filings.
  - type: private-evidence-only
    severity: moderate
    topic: Series D round absence or undisclosed details
    missingEvidence: >-
      The company references a Series E (April 2024) with no publicly confirmed Series D, creating an unexplained
      two-year gap from Series C (2022).
    whyItMatters: >-
      A missing or undisclosed Series D could indicate a down-round, bridge financing, or significant dilution not
      reflected in the $3.3B headline.
    diligencePath: Request full cap table and all financing documents from data room; cross-check against Delaware corporate filings.
    relatedQuestionRefs:
      - QO010
  - type: private-evidence-only
    severity: moderate
    topic: Full board and governance rights completeness
    missingEvidence: >-
      While Tiger Global, Kinnevik, and William Blair are identified as investors, exact board seats, voting agreements,
      liquidation preferences, and anti-dilution provisions are not publicly disclosed.
    whyItMatters: >-
      Governance rights and board composition materially affect investor alignment, control risk, and exit path
      flexibility.
    diligencePath: Request company bylaws, shareholder agreement, and board composition disclosure in data room.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: Milestone Table completeness (TO004)
    missingEvidence: >-
      Internal product milestones, team growth events, regulatory interactions beyond Knox-Keene, and governance
      decisions are not publicly documented.
    whyItMatters: A fuller chronology would aid diligence on schedule adherence, adverse events, and strategic pivots.
    diligencePath: Request board minutes, product roadmap history, and regulatory correspondence log in data room.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: Exact digital-first platform market penetration rate (percentage of SAM captured)
    missingEvidence: >-
      No independent analyst has published a confirmed market penetration rate for digital employer mental health
      platforms (Spring Health, Lyra, Modern Health combined) as a share of the ~40,000 qualifying US employer groups.
    whyItMatters: >-
      The current <2% penetration estimate is analyst-inferred; actual penetration could be higher or lower depending on
      employer group definition and channel partner attribution.
    diligencePath: >-
      Request Spring Health's internal win-rate data, pipeline conversion rate, and competitive win/loss analysis from
      data room.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: moderate
    topic: Telehealth reimbursement permanence risk post-2025
    missingEvidence: >-
      CMS had extended telehealth flexibilities through the end of 2025; permanent regulatory status for behavioral
      health telehealth beyond 2025 is not yet confirmed.
    whyItMatters: >-
      If CMS rolls back telehealth reimbursement parity for behavioral health, Spring Health's national virtual care
      model could face coverage gaps for Medicare/Medicaid populations and reduce its health plan addressable market.
    diligencePath: Monitor CMS OPPS/PFS 2026 proposed rules; request Spring Health's regulatory risk assessment from data room.
  - type: private-evidence-only
    severity: moderate
    topic: Cross-country behavioral health spending comparison as share of GDP
    missingEvidence: >-
      WHO Mental Health Atlas 2024 data on country-level spending was referenced but not accessible in full text; OECD
      cross-country comparison was not successfully fetched.
    whyItMatters: >-
      Cross-country data would establish relative underfunding of US behavioral health relative to GDP and validate
      global market expansion opportunity beyond the US.
    diligencePath: >-
      Access WHO Mental Health Atlas 2024 or OECD Health Data report for country-level behavioral health spend as % of
      total health expenditure.
  - type: private-evidence-only
    severity: material
    topic: Spring Health vs. Lyra Head-to-Head Win/Loss Data
    missingEvidence: >-
      Spring Health has not disclosed its competitive win/loss rate against Lyra Health or Modern Health. No independent
      analyst has published a direct head-to-head comparison.
    whyItMatters: >-
      Win/loss data is the most direct evidence of competitive strength; its absence means the competitive moat analysis
      rests entirely on feature comparison and clinical evidence rather than observed market outcomes.
    diligencePath: >-
      Request CRM win/loss data by competitor in data room; ask for pipeline conversion rate against Lyra-incumbent
      accounts.
  - type: private-evidence-only
    severity: moderate
    topic: Independent comparative NPS or member satisfaction scores across competitors
    missingEvidence: >-
      No independent analyst has published NPS or member satisfaction scores comparing Spring Health, Lyra, and Modern
      Health on standardized measures. Company-reported scores are not cross-comparable.
    whyItMatters: >-
      Member satisfaction is a renewal driver; if Lyra or Modern Health achieves higher employee NPS, it undermines
      Spring Health's premium pricing.
    diligencePath: >-
      Request member NPS data by cohort and employer size from Spring Health data room; compare to Lyra's published NPS
      claims.
  - type: missing-source
    severity: moderate
    topic: Lyra Health post-2022 valuation update
    missingEvidence: >-
      Lyra Health's last confirmed valuation is $4.8B (2022 Series F). No 2023-2026 financing event or secondary market
      transaction has been reported. Current valuation is unknown.
    whyItMatters: >-
      If Lyra has raised at a higher valuation, the competitive capital intensity race has intensified; if Lyra is
      struggling to fundraise, it signals market repricing.
    diligencePath: Monitor Lyra fundraising news; check PitchBook/CB Insights for secondary market data on Lyra equity.
  - type: private-evidence-only
    severity: material
    topic: Revenue, ARR, gross margin, and operating cash flow
    missingEvidence: >-
      Spring Health has never disclosed any financial performance metric. No SEC Form D filings found in EDGAR. Actual
      ARR, burn rate, and gross margin are fully private.
    whyItMatters: >-
      At a $3.3B valuation, investors need revenue data to calculate a meaningful multiple and assess path to
      profitability or exit.
    diligencePath: Request full P&L, revenue schedule, cohort retention data, and LTV:CAC analysis in data room.
    relatedQuestionRefs:
      - QI005
      - QI006
      - QI007
  - type: private-evidence-only
    severity: material
    topic: Series D existence, terms, and cap table completeness
    missingEvidence: >-
      No Series D has been publicly confirmed. Total raised of $488M+ may be understated if an undisclosed bridge or
      extension occurred between 2022 and 2024.
    whyItMatters: >-
      An undisclosed Series D with anti-dilution provisions, participating preferred, or down-round terms could
      materially affect the effective valuation and exit economics.
    diligencePath: Request complete cap table, all security issuances, and board resolutions since 2022 in data room.
  - type: private-evidence-only
    severity: moderate
    topic: Alma combination financial terms and balance sheet impact
    missingEvidence: >-
      Spring Health disclosed the Alma combination completion but not deal structure, purchase price, or integration
      cost. Goodwill, acquisition cost, and post-combination P&L impact are unknown.
    whyItMatters: >-
      An overpriced acquisition could burden the balance sheet; unfavorable earn-out or stock terms could dilute
      employees and existing investors.
    diligencePath: Request merger agreement, valuation opinion, and post-combination budget in data room.
    relatedQuestionRefs:
      - QI009
  - type: private-evidence-only
    severity: material
    topic: PMH engine architecture, training data, model performance metrics
    missingEvidence: >-
      Spring Health has not published model cards, accuracy benchmarks, disparity analyses, or technical architecture
      documentation for the PMH engine. The JAMA 2025 study describes clinical instruments but not ML methodology.
    whyItMatters: >-
      Enterprise buyers and health plan regulators increasingly require AI model transparency (accuracy, bias,
      explainability). Absence limits scrutiny of whether the PMH engine performs equitably across demographic groups.
    diligencePath: Request model card, disparity analysis by race/gender/language, and clinical validation study from data room.
  - type: missing-source
    severity: moderate
    topic: No public GitHub presence or API documentation
    missingEvidence: >-
      Spring Health has no publicly identified GitHub organization beyond VERA-MH's website. No developer portal, API
      docs, or SDK is published. Engineering stack is inferred from job postings and FHIR compliance signals only.
    whyItMatters: >-
      Absence of developer-facing infrastructure limits third-party integration options and signals that the platform is
      sold via enterprise contracts rather than developer-led growth—a structural constraint on the health plan channel
      requiring open API standards.
    diligencePath: >-
      Request API documentation and architecture diagram from data room. Confirm whether a private developer portal
      exists.
  - type: private-evidence-only
    severity: moderate
    topic: AI clinical validation results for Guide and Continuous Care
    missingEvidence: >-
      VERA-MH covers chatbot AI safety for suicidal ideation but was not validated against Guide AI's proactive nudge
      model specifically. No published clinical trial or evaluation of Guide AI's efficacy or safety has been
      identified.
    whyItMatters: >-
      Guide AI's continuous care model creates a new risk profile—proactive AI suggestions could cause harm or miss
      crisis signals in ways that the VERA-MH standard does not cover.
    diligencePath: >-
      Request clinical validation study for Guide AI from the company; evaluate against VERA-MH rubric for proactive AI
      models.
  - type: private-evidence-only
    severity: material
    topic: Customer net revenue retention (NRR), annual renewal rate, and churn
    missingEvidence: >-
      Spring Health has not disclosed any NRR, renewal rate, or churn metric. Absent these metrics, the durability of
      the 450+ employer client base cannot be independently assessed.
    whyItMatters: >-
      Enterprise SaaS viability depends heavily on NRR. A company with 450 clients growing fast via new logos but losing
      existing clients at 20–30% annually would have very different economics than one with 90%+ NRR.
    diligencePath: Request cohort retention analysis by contract year, renewal waterfall, and churn attribution from data room.
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: moderate
    topic: Named customer contract values, ACV, and multi-year renewal terms
    missingEvidence: >-
      No named customer has disclosed their annual contract value with Spring Health. Microsoft, Target, and JPMorgan
      are among the world's largest employers; their actual PEPM rates and ACV with Spring Health are commercially
      sensitive and not disclosed.
    whyItMatters: >-
      Revenue concentration in top accounts affects valuation and risk; if top 5 accounts = 30%+ of ARR, churn of even
      one would materially affect financial performance.
    diligencePath: Request top-10 account revenue concentration analysis from data room.
  - type: missing-source
    severity: moderate
    topic: JAMA study data reproducibility across diverse employer populations
    missingEvidence: >-
      The JAMA 2025 study is observational and may reflect selection bias (engaged members have better outcomes). No
      randomized controlled trial with a pre-registration has been published for Spring Health's clinical model. Stat
      News and Fierce Healthcare have raised these methodological concerns.
    whyItMatters: >-
      If the ROI is not reproducible across geographically dispersed, lower-utilization employers (the majority of the
      450+ base), the JAMA study overstates the expected return for the average customer.
    diligencePath: >-
      Request break-out of JAMA study by employer size, vertical, and utilization rate cohort. Commission independent
      actuarial review of full customer population outcomes.
    relatedQuestionRefs:
      - QU006
  - type: private-evidence-only
    severity: material
    topic: Spring Health's data sharing practices with third-party analytics and marketing vendors
    missingEvidence: >-
      Spring Health has not publicly disclosed which third-party analytics or marketing vendors receive member
      engagement data. Post-BetterHelp FTC precedent makes this a material compliance question.
    whyItMatters: >-
      If Spring Health uses standard analytics SDKs that transmit member engagement data to advertising platforms, the
      FTC BetterHelp precedent creates direct regulatory exposure.
    diligencePath: Request data flow diagram, third-party data sharing inventory, and privacy counsel opinion on FTC Act compliance.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR006
  - type: missing-source
    severity: material
    topic: MHPAEA NQTL compliance analysis for Spring Health's utilization management protocols
    missingEvidence: >-
      Spring Health has not disclosed any MHPAEA comparative NQTL analysis. The 2024 final rule requires plan sponsors
      to document that Spring Health's utilization management criteria are no more restrictive than medical/surgical
      equivalents.
    whyItMatters: >-
      Employer clients bear the primary MHPAEA compliance obligation; if Spring Health's protocols create parity
      violations, employer clients face DOL enforcement risk—and will pressure Spring Health to modify protocols.
    diligencePath: >-
      Commission independent MHPAEA NQTL analysis covering prior authorization, utilization management, and network
      adequacy protocols.
    relatedQuestionRefs:
      - QR005
      - QR006
  - type: private-evidence-only
    severity: moderate
    topic: ROI guarantee compensation terms and actuarial reserve
    missingEvidence: >-
      Spring Health has not disclosed the compensation mechanism for failing to deliver the guaranteed ROI, nor an
      actuarial reserve or insurance backing for the guarantee. The financial liability could be material if multiple
      employer cohorts underperform.
    whyItMatters: >-
      If the guarantee creates a cash payment obligation and multiple employer cohorts miss the 3× Year 3 target, the
      unquantified liability could be a material balance sheet item.
    diligencePath: Request guarantee contract terms, reserve policy, and actuarial basis from data room.
  - type: private-evidence-only
    severity: critical
