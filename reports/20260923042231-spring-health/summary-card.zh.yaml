summary:
  headline: >
    Spring Health 是一家 AI 原生心理健康平台，拥有极具说服力的临床实证与广泛的企业端分销网络。公司 2026 年的最新进展显示其覆盖人群进一步扩大、敲定了收购 Alma 的路径，并通过 Guide AI
    持续拓展产品边界；但由于公司仍未公开披露 ARR、留存率、毛利率以及足以支撑精准估值承销的合规与责任细节，本次维持「观察」评级，适合看好赛道龙头、但建仓前仍需进一步尽调的投资机构。
