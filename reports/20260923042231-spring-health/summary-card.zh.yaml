  topStrengths:
    - JAMA 2025 年同行评审的疗效实证与 Validation Institute 的成本节约认证，构成了雇主心理健康领域最过硬的临床背书
    - 170M+ 人群覆盖与 450+ 家直签雇主客户，建立了庞大的分销触达与高黏性的福利合作关系
    - MHPAEA 监管执法趋严，叠加雇主对可量化疗效的迫切需求，推动心理健康福利始终位列采购议程前列
    - 达成 Alma 收购协议，叠加健康险计划渠道的延展性，拓宽了公司在核心雇主自费之外的市场路径
    - Guide AI、VERA-MH 与 Atlas 在诊疗导航、安全合规及疗效量化维度持续保持差异化
  topRisks:
    - ARR、NRR、毛利率及 EBITDA 均未公开披露，一级市场估值依然依赖分析师估算而非官方数据
    - MHPAEA NQTL 合规与相关对比分析不够透明，导致雇主客户与监管风险缺乏充分量化
    - Guide AI 等 AI 功能持续带来临床责任与隐私合规疑虑，公司尚未对此做公开的量化披露
    - 若二级市场对雇主心理健康赛道的估值偏好压缩至上市公司乘数，仍存在实质性的对标估值下修风险
    - 心理健康服务数据高度敏感，来自雇主的数据共享与隐私审查风险不容忽视
  unresolvedGaps:
    - 未披露 ARR、NRR、毛利率及 EBITDA；财务估值仍完全依赖第三方估算而非官方披露
    - 未披露股权结构表（cap table）、清算优先权与优先股堆叠以及各轮股份分配瀑布，难以承销退出时的普通股回报
    - 针对利用度管理、事先授权与网络充足性协议的 MHPAEA NQTL 对比分析依然不透明
    - 尚未公开披露针对 Guide AI 临床责任的法律意见书及相应商业保险承保限额
    - 健康险渠道的经济模型（PMPM、CAC、NRR）尚未披露，而这正是支撑乐观情景的核心
    - 2026 年宣布收购后，仍未披露 Alma 的业务整合协同时间表及预计贡献的 ARR
