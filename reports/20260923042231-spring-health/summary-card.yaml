  topStrengths:
    - >-
      JAMA 2025 peer-reviewed outcomes evidence and Validation Institute savings validation are the strongest clinical
      proof points in employer mental health
    - >-
      170M+ access footprint and 450+ direct employer accounts create broad distribution coverage and sticky benefits
      relationships
    - >-
      MHPAEA enforcement and employer demand for measurable outcomes keep mental health benefits high on the benefits
      agenda
    - >-
      Alma acquisition agreement and health-plan channel optionality broaden the company's route to market beyond the
      core employer motion
    - Guide AI, VERA-MH, and Atlas keep Spring Health differentiated on care navigation, safety, and measurement
  topRisks:
    - >-
      ARR, NRR, gross margin, and EBITDA remain undisclosed, so private-market valuation still depends on analyst
      estimates rather than company disclosure
    - >-
      MHPAEA NQTL compliance and related comparative analyses remain opaque, leaving employer-client and regulatory risk
      under-quantified
    - >-
      Guide AI and other AI-powered features create continuing clinical-liability and privacy questions that the company
      has not publicly quantified
    - >-
      Public comparable re-rating risk remains real if investor appetite for employer mental health compresses toward
      public-market multiples
    - >-
      Employer data-sharing and privacy scrutiny continues to matter because mental-health engagement data is highly
      sensitive
  unresolvedGaps:
    - >-
      ARR, NRR, gross margin, and EBITDA not disclosed; all financial valuation still depends on third-party estimates
      rather than company disclosure
    - >-
      Cap table, liquidation preference stack, and share class waterfall remain undisclosed; common-equity returns in an
      exit remain difficult to underwrite
    - >-
      MHPAEA NQTL comparative analysis for Spring Health's utilization management, prior authorization, and network
      adequacy protocols remains opaque
    - >-
      Guide AI clinical liability legal opinion and corresponding insurance coverage limits have not been publicly
      disclosed
    - Health-plan channel economics (PMPM, CAC, NRR) remain undisclosed and are still central to the bull case
    - >-
      Alma integration synergy timeline and projected ARR contribution remain undisclosed after the 2026 acquisition
      announcement
