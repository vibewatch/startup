- id: KM003
  type: insight
  title: Provider shortage constrains the entire digital behavioral health sector
  body: 'The US faces a shortage of 7,000+ psychiatrists and a broader clinician gap that affects all digital mental health platforms equally. Spring Health''s 10,000+ provider network is a meaningful asset, but adding providers faster than competitors is a supply-constrained arms race. Platforms that solve quality—not just volume—will win. Spring Health''s precision matching model claims to reduce provider mis-match, but the underlying provider scarcity is a structural headwind for the entire sector''s growth rate.

    '
