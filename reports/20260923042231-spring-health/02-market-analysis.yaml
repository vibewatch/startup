  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Exact digital-first platform market penetration rate (percentage of SAM captured)
    missingEvidence: No independent analyst has published a confirmed market penetration rate for digital employer mental health platforms (Spring Health, Lyra, Modern Health combined) as a share of the ~40,000 qualifying US employer groups.
    whyItMatters: The current <2% penetration estimate is analyst-inferred; actual penetration could be higher or lower depending on employer group definition and channel partner attribution.
    diligencePath: Request Spring Health's internal win-rate data, pipeline conversion rate, and competitive win/loss analysis from data room.
    relatedQuestionRefs:
    - QM006
  - type: missing-source
    severity: moderate
    topic: Telehealth reimbursement permanence risk post-2025
    missingEvidence: CMS had extended telehealth flexibilities through the end of 2025; permanent regulatory status for behavioral health telehealth beyond 2025 is not yet confirmed.
    whyItMatters: If CMS rolls back telehealth reimbursement parity for behavioral health, Spring Health's national virtual care model could face coverage gaps for Medicare/Medicaid populations and reduce its health plan addressable market.
    diligencePath: Monitor CMS OPPS/PFS 2026 proposed rules; request Spring Health's regulatory risk assessment from data room.
  - type: private-evidence-only
    severity: moderate
    topic: Cross-country behavioral health spending comparison as share of GDP
    missingEvidence: WHO Mental Health Atlas 2024 data on country-level spending was referenced but not accessible in full text; OECD cross-country comparison was not successfully fetched.
    whyItMatters: Cross-country data would establish relative underfunding of US behavioral health relative to GDP and validate global market expansion opportunity beyond the US.
    diligencePath: Access WHO Mental Health Atlas 2024 or OECD Health Data report for country-level behavioral health spend as % of total health expenditure.
