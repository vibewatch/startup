callouts:
- id: KM001
  type: strength
  title: Mental health parity regulation is the biggest enterprise sales catalyst
  body: 'The DOL/HHS/Treasury 2024 final rule under the Mental Health Parity and Addiction Equity Act requires employers to demonstrate that their behavioral health benefits are equivalent to medical/surgical coverage—a requirement that most legacy EAP products structurally fail. This compliance imperative is driving large employers to evaluate Spring Health as a replacement, independent of ROI arguments. Regulatory tailwind is a structural market driver that competes on mandatory action, not optional upgrade.

    '
