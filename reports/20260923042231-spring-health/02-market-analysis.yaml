- id: KM002
  type: risk
  title: Spring Health serves <3% of its SAM; scaling beyond 450 employers is unproven
  body: 'With 450+ direct employers in a SAM of ~40,000 groups with 500+ employees, Spring Health has penetrated less than 2% of its primary market. While this demonstrates significant upside, the company''s growth model has yet to prove whether it can scale beyond its current blue-chip anchor accounts into the mid-market, where HR departments are smaller and price sensitivity is higher. The company''s disclosed 27,000 channel-partner groups provide volume coverage, but unit economics in channel relationships may differ from direct sales.

    '
