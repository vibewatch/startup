- id: SM002
  title: TAM, SAM, and SOM Sizing
  body: 'Total Addressable Market (TAM): The global behavioral health market was estimated at $95– $105B in 2022 and is projected to reach approximately $177B by 2030 at a 7–8% CAGR. US behavioral health total direct spending was estimated at approximately $280B in 2022, representing the single largest national market globally. Within the US, employer-sponsored insurance covers approximately 165 million Americans under employment-based health plans (KFF 2024 Employer Health Benefits Survey). The employer mental health spend is approximately $182–$220 per employee per year across benefits (inclusive of EAP and behavioral health carve-outs), implying a US employer TAM of $30–$36B annually.

    Serviceable Addressable Market (SAM): Spring Health targets mid-to-large employers (500+ employees) and national health plans. The US has approximately 40,000–45,000 employer groups with 500+ employees, covering ~95 million workers. At a conservative $150 PEPM potential for a comprehensive mental health platform, the Spring Health SAM is approximately $17–$20B per year. The digital-first employer mental health platforms (Spring Health, Lyra, Modern Health combined) have penetrated fewer than 10% of this SAM as of 2025.

    Serviceable Obtainable Market (SOM): Spring Health serves 450+ direct employer clients and 27,000 channel partner groups covering 20M+ lives as of 2025. At a mid-range PEPM of $30– $50 and 20M covered lives, this implies ~$7.2B–$12B annual implied revenue potential if fully activated—with actual ARR undisclosed.

    A contradictory estimate exists: the Mental Health Apps market (MarketsandMarkets 2026) is valued at $9.94B in 2025 and projected to reach $22.73B by 2030. This is a narrower digital-only slice; Spring Health''s market includes traditional EAP replacement and health plan contracting which is larger.

    '
