  type: risk
  title: Public Comp Re-Rating Risk Is Material
  body: 'Accolade, Talkspace, and Teladoc all trade at 1–3× ARR — roughly 80–90% below their 2021 peak multiples. Spring Health''s $3.3B at 11–25× ARR requires sustained premium to public comps. If mental health tech re-rates further or Spring Health''s growth trajectory disappoints, a down-round at 2025–2026 fundraise or IPO is plausible.

    '
