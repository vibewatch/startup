- id: KV001
  type: insight
  title: Clinical Proof Is Real — Financial Proof Is Missing
  body: 'Spring Health is unusual in having genuine peer-reviewed clinical evidence (JAMA 2025) for outcomes that most digital health companies assert only in press releases. The JAMA RCT showing 1.9× ROI and 50% lower hospitalization rates is a defensible moat. The missing piece is financial: ARR, NRR, and unit economics are fully opaque, making precise valuation impossible without a data room.

