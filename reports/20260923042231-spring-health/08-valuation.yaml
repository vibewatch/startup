  evidenceGaps:
  - type: private-evidence-only
    severity: critical
    topic: Spring Health ARR, NRR, and unit economics
    missingEvidence: Spring Health has not disclosed ARR, NRR, gross margin, EBITDA, or any financial metric. All valuation analysis depends on analyst estimates with a $130–300M ARR range.
    whyItMatters: The entire investment recommendation depends on the actual ARR. Without confirmation, the multiple range spans from unjustifiable (33× at $100M) to reasonable (11× at $300M). This is the single largest evidence gap in the entire diligence.
    diligencePath: 'Data room: audited ARR, revenue recognition schedule, gross margin by channel, NRR cohort analysis.'
    relatedQuestionRefs:
    - QV001
    - QV006
    - QV007
    - QV008
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: Cap table, liquidation preference stack, and share class waterfall
    missingEvidence: Spring Health has not disclosed its cap table, share class structure, liquidation preferences, or participation rights. At $3.3B valuation with $488M raised, the preference stack could materially reduce common equity returns in a sub-$5B exit.
    whyItMatters: Preferred liquidation preferences and participation rights are standard in late-stage venture; without understanding the waterfall, the $3.3B headline valuation does not translate directly to common shareholder returns.
    diligencePath: Cap table model from CFO; Series E term sheet; legal review of certificate of incorporation.
    relatedQuestionRefs:
    - QV010
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: Health plan channel economics (PMPM and margin)
    missingEvidence: Spring Health's health plan channel economics — PMPM, CAC, gross margin — are not disclosed. Knox-Keene license and Point32Health partnership signal entry but economic terms are unknown.
    whyItMatters: Health plan PMPM is typically significantly lower than employer direct PMPM; if health plan economics are materially dilutive, the bull case revenue model requires revision.
    diligencePath: 'Data room: health plan contract terms, PMPM data by channel, gross margin by channel.'
    relatedQuestionRefs:
    - QV006
    relatedTableRefs:
    - TV003
  - type: missing-source
    severity: moderate
    topic: Independent analyst valuation model with ARR confirmation
    missingEvidence: No investment bank or institutional research provider has published a Spring Health ARR estimate with disclosed methodology. Rock Health, CB Insights, and PitchBook track funding but do not publish revenue models.
    whyItMatters: Absence of analyst ARR confirmation widens the valuation uncertainty interval beyond what is typical for a $3.3B company approaching IPO.
    diligencePath: Commission independent revenue model or seek secondary-market comparable transaction analysis.
    relatedQuestionRefs:
    - QV001
    relatedTableRefs:
    - TV004
