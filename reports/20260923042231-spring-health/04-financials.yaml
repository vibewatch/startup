- id: SI002
  title: Revenue Model and Unit Economics Estimate
  body: 'Spring Health generates revenue primarily through PEPM (per employee per month) subscription fees charged to employers for access to the Spring Health mental health benefits platform. Health plan channel revenue, introduced via the Knox-Keene license (2025), follows a capitation or PMPM model; this is early-stage revenue as of the run date. The Alma combination (2025) adds consumer marketplace revenue through Alma''s therapist marketplace, a different unit economics profile with potentially lower ARPU and higher churn than the enterprise PEPM core.

    Implied ARR estimate (analyst-inferred): 20M covered lives × $30–50 PEPM × 12 months would imply $7.2B–$12B theoretical ceiling ARR if all covered lives were active subscribers at full commercial rates. However, covered lives include channel-partner groups where per-life PEPM may be significantly lower, and not all covered employees actively engage. A more conservative estimate using 450 direct employer clients at $150–300 PEPY (per employee per year) and an assumed average headcount of 2,000 employees per client implies $135M–$270M ARR from direct employer contracts—broadly consistent with a high-growth Series E stage company.

    Unit economics remain entirely private. No gross margin, CAC, LTV, or payback period data has been disclosed. Provider network costs (10,000+ licensed providers), customer success headcount (1,001–5,000 employees), and technology costs are all substantive expense items whose scale versus revenue is unknown.

    '
