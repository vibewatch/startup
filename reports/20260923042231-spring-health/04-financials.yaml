- id: KI002
  type: risk
  title: No SEC Form D filings found; Series D absence creates cap table uncertainty
  body: 'SEC EDGAR returned no Form D filings under Spring Health, Inc. or known entity names. While private companies often claim state-level Reg D exemptions, the absence of any federal filing is unusual for a company of this scale. More importantly, no Series D has been publicly confirmed between the 2022 Series C and April 2024 Series E—a two-year gap during which the company could have raised an undisclosed bridge, extension, or venture debt facility. Cap table uncertainty requires data room verification.

    '
