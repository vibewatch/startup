- id: SI003
  title: Capital Adequacy and Financial Risk Assessment
  body: 'The April 2024 Series E ($100M) is the last confirmed financing event. With no subsequent capital announcement through the run date (May 2026), the company has been operating on existing capital for approximately 13 months. Given typical Series E company burn rates of $5–15M per month for a company of Spring Health''s scale, the residual runway from the Series E at the run date is 7–20 months—suggesting either the company is approaching a new capital raise, has achieved near-breakeven operations, or has additional undisclosed capital sources (e.g., debt facility, revenue-based financing).

    The $3.3B valuation at Series E implies a return expectation of $10B+ for a 3× return at exit. At Spring Health''s estimated ARR range ($135M–$270M), the revenue multiple implied by the valuation is approximately 12–24×. This is a premium that requires sustained growth of 40%+ annually to maintain—a high bar given the current employer benefits renewal cycle and competition from Lyra and Optum.

    Alma combination financial risks: The combination with Alma introduces consumer-facing revenue, which historically has higher churn, lower ARPU, and different regulatory cost profiles (Knox-Keene) than Spring Health''s enterprise core. Integration costs were not disclosed. The combination appears strategic (market expansion) rather than financial (accretive), suggesting near-term margin dilution is likely.

    CFO board appointment (Dipak Golechha, Palo Alto Networks CFO) in 2025 is a governance strengthening signal typically associated with IPO preparation or large late-stage round preparation—potentially signaling a capital event within 12–24 months of the run date.

    '
