- id: KI001
  type: risk
  title: Revenue is entirely undisclosed – $3.3B valuation rests on unverified financials
  body: 'Spring Health has never disclosed ARR, revenue, margins, or unit economics. The $3.3B valuation implies $9.9B+ exit value for a 3× VC return—requiring either IPO or strategic acquisition at a premium. Without verifying revenue, the valuation is purely based on market positioning, clinical proof, and growth trajectory. At an estimated $135–360M implied ARR, the revenue multiple ranges from 9×–24×—well above public SaaS healthcare comps (5–10×) and requiring sustained 40%+ annual growth to maintain.

    '
