company:
  name: Spring Health
chapter:
  order: 4
  number: 4
  title: Financials
  summary: 'Spring Health is a private company that has never disclosed revenue, ARR, margins, or unit economics. Its financial profile is reconstructable only from disclosed financing events: $488M+ raised across Series A–E (2020–2024); last confirmed valuation $3.3B (April 2024); no SEC Form D filings identified in EDGAR. The company''s revenue model is PEPM subscription from employer clients and health plans, with PEPM rates estimated at $30–50 for direct employer accounts. With 20M+ covered lives, the theoretical ARR ceiling is $7–12B—but actual PEPM realization, employer conversion rates, and churn are unknown. Capital adequacy appears sufficient for a 24–36 month runway based on the April 2024 $100M Series E and absence of a capital raise through the run date. The largest financial risk is undisclosed burn rate against a $3.3B valuation premium that requires continued high growth. The Alma combination (2025) introduces integration cost and potential revenue dilution from a consumer-facing
    marketplace model with different unit economics.

    '
sections:
- id: SI001
  title: Funding History and Valuation
  body: 'Spring Health has raised $488M+ across five disclosed rounds. Series A: $22M (2020, Kinnevik and Work-Bench); Series B: $76M (2021, Tiger Global); Series C: $190M (2022, Tiger Global, post-money valuation $2B); Series D: Not publicly confirmed; Series E: $100M (April 2024, post-money valuation $3.3B per Fortune exclusive). The gap between Series C and Series E—approximately two years with no confirmed Series D—may reflect an undisclosed bridge, an unlabeled extension round, or simply that the company did not require additional capital between 2022 and 2024.

    The $3.3B Series E valuation represents a 65% step-up from the $2B Series C valuation, achieved over approximately two years of operations. This implies the company has been growing fast enough to justify a premium relative to the broader digital health repricing that affected most venture-backed companies in 2022–2023. No SEC Form D filings were identified in EDGAR under Spring Health, Inc., Spring Health Benefits, or related entity names—which may reflect Delaware-level state exemptions rather than no capital raise.

    Investor profile: Tiger Global (led Series B and C), Kinnevik (led Series A), William Blair. Dipak Golechha (CFO, Palo Alto Networks) joined the board in 2025, signaling preparation for a potential public offering or large institutional financing event.

    '
