        - $3.3B 估值，累计融资 $488M，10,000+ 名服务者，覆盖 20M+ 人群
        - 大型雇主（450+ 家）、健康险计划、渠道
        - JAMA 验证的临床效果、ROI 承诺兜底、精准 AI 匹配、Alma 离职延续服务
        - 不适用（标的公司）
      - - Lyra Health
        - 数字化优先的心理咨询平台
        - $4.8B 估值（2022 年），F 轮融资 $235M，30,000+ 名服务者，覆盖 20M+ 人群
        - 大型企业客户（Facebook/Meta、Uber、Morgan Stanley）
        - 最大规模的服务者网络；2025 年 10 月上线临床级 AI；打通 Workday；具备国际化能力（瑞士）
        - 缺乏 JAMA 等同水平的同行评议顶刊论文；偏重心理咨询；无 ROI 承诺兜底
      - - Modern Health
        - 以心理辅导为主的平台
        - $1.17B 估值，累计融资 $170M+，覆盖 70+ 个国家
        - 中大型雇主，主打国际化市场
        - 全球化覆盖；心理辅导 + 数字化 + 团体活动；服务形态多样；女性创办的品牌号召力
        - 偏向心理辅导限制了重症与精神科定位；临床循证依据储备较薄弱
      - - Optum Behavioral Health
        - 传统医保控费型心理健康 / EAP 巨头
        - UHG 旗下子公司（市值约 $500B），覆盖 30M+ 商业保险会员
        - 签订 UHC/OptumRx 合同的所有雇主客户
        - 险企深度协同、覆盖面广、理赔与索赔主张数据沉淀深厚、行政管理基础设施完善
        - 使用率仅 5–8%，沿袭传统 EAP 模式，作为保险公司存在利益冲突
      - - Magellan/Centene BH
        - 独立外包型医保心理健康服务商（Carve-out）
        - Centene 旗下子公司；心理健康年收入 $8B+
        - Medicaid、商业健康险计划
        - Medicaid 根基深厚、物质滥用诊疗能力强、深耕公共部门
        - 用户体验较差、数字化互动不足、缺乏临床精准匹配工具
      - - Talkspace
        - 远程心理咨询（上市企业）
        - 'NASDAQ: TALK，约 $170M 收入（2024 年），市值约 $300M'
        - C 端消费者 + 部分雇主
        - 公开市场远程心理咨询先驱；主打异步图文咨询
        - 雇主方案中未打包精神科与心理辅导；面临 FTC 调查；利润率承压；无法完全替代传统 EAP
      - - BetterHelp（Teladoc 旗下）
        - C 端远程心理咨询
        - Teladoc 旗下子公司；峰值用户量约 6M+
        - C 端自费用户
        - C 端咨询接诊量最大；价格亲民
        - 无雇主系统集成；面临 FTC 数据隐私调查；缺乏临床量化评估标准
      - - Headspace
        - C 端泛健康 + 雇主福利
        - 2022 年与 Ginger 合并；D 轮；员工约 1,000 人
        - C 端泛健康 + 中型企业雇主
        - 品牌影响力强；消费级产品体验；正念冥想底蕴
        - 精神科与临床诊疗纵深不足；合并 Ginger 后仍在转型期；无法完全替代传统 EAP
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Eight competitors enumerated across three tiers: digital-first platforms (Lyra, Modern Health), managed BH
        incumbents (Optum, Magellan), and point solutions (Talkspace, BetterHelp, Headspace). Sources include company
        websites, BuiltIn profiles, press coverage, and SEC filings for Talkspace.
      relatedTableRefs: []
