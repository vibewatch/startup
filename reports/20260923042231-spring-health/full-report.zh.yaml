      - number: '5.4'
        title: 专题展板
        blocks:
          - type: callout
            title: VERA-MH 开源框架树立 Spring Health 作为 AI 安全标准制定者的地位
            body: >
              Spring Health 选择将 VERA-MH 作为开源 AI 安全评测工具公开发布，而非封闭自用，体现出深谋远虑的开发者生态打法。通过主导编制业内首个评估心理健康生成式 AI 对话机器人的临床标准并在
              vera-mh.com 免费开放，Spring Health 确立了自身在行为健康负责任 AI 领域的标杆地位。这一策略借鉴了 Google 和 Microsoft
              开源安全框架的做法，通过树立自己产品本就能达标的行业规范，既赢得了监管与公关主动权，也为企业级大客户采购释放出强烈的信任信号。
