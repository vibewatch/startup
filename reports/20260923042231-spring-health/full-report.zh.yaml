  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心技术架构与自研 AI 引擎
        blocks:
          - type: paragraph
            body: >
              Spring Health 的底层核心技术为精准心理健康医疗（PMH）引擎——一套依托临床成效数据训练的机器学习系统，能为每名会员生成量身定制的诊疗方案。该模型吸收权威临床量表问卷结果（用于抑郁评估的
              PHQ-9、焦虑评估的 GAD-7，以及自研的职业倦怠/压力指数），并将其精准映射至 13 条既定诊疗路径之一——从数字化练习到精神科药物管理全覆盖。这种基于 AI
              的智能匹配能力，与提供无差别服务或完全依赖会员自行摸索的传统 EAP 厂商拉开了根本差距。

              该平台遵循 FHIR R4 标准构建，支持与商业健康险计划及电子病历（EHR）系统进行双向数据交互——这是 2025 年开拓 Knox-Keene 健康险渠道的核心架构前提。自研推荐引擎 Atlas（2022
              年推出）提供实时医生与咨询师匹配，将多数会员的首诊预约等待时间压缩至 2 天以内。Guide（2025 年上线）是一款 AI 驱动的照护导航工具，能在两次就诊间歇主动向会员提示最适合的下一步康复动作——使
              Spring Health 得以确立持续照护平台的定位，而非断点式的单次看诊服务。

              公司与临床专家委员会于 2024 年共同开发的 VERA-MH 开源 AI 安全评测框架，是业内首个针对心理健康场景中生成式
              AI（GenAI）应对自杀意念表现制定的公开评估标准。将其开源发布兼顾了安全规范确立与开发者生态布局——让 Spring Health 成为标准制定者，而非被动套用第三方 AI 安全框架的跟从者。
