  - id: TV006
    title: 最终尽调诉求表
    description: |
      Top diligence questions that must be answered in the data room before full investment conviction on Spring Health.
    columns:
      - 主题
      - 缺失证据
      - 关键影响
      - 责任方 / 尽调路径
    rows:
      - - ARR 与收入构成
        - 按渠道（雇主直销、渠道伙伴、健康保险计划）拆分的年经常性收入；按客户年份队列（2020–2024 年）拆分的净留存率
        - 整套估值逻辑全系于 ARR；若无确切数据，分析师给出的 $130–300M 区间过宽，根本无法支撑任何估值倍数
        - CFO 数据室；经审计财务报表或管理层报表；投资人通报信
      - - MHPAEA NQTL 对比分析
        - Spring Health 针对使用率管理、预先授权及网络充实度，与内外科对应项目对比的 NQTL 分析
        - 雇主客户承担 MHPAEA 首要合规责任；Spring Health 的方案若违规，雇主将面临 DOL 处罚，并被迫修改甚至终止合同
        - 总法律顾问与合规团队；独立 MHPAEA 法律顾问复审
      - - Guide AI 临床责任与保险
        - Guide AI 临床决策支持法律意见书（涉及非法行医、FDA SaMD、过失侵权）；过失与疏漏责任险 / 医疗事故险的保额与保障范围
        - Guide 的主动干预建议一旦对患者造成伤害，责任可能上升至公司实体层面；ROI 兜底保障机制与主动触达模式更放大了该风险敞口
        - 首席医疗官；法律顾问；保险经纪人；临床顾问委员会
      - - 渠道经济模型与客户队列数据
        - 按 12/24/36 个月队列拆分的雇主端 PMPM、雇主 CAC、回本周期及客户维度 NRR；健康险端 PMPM 与合同条款
        - 渠道经济模型决定可持续增速与毛利率底线；健康险端经济模型极可能与雇主端存在实质差异
        - CFO 与销售运营数据室；商务团队宣讲材料
      - - 股权结构表与清算优先权堆叠
        - Series A–E 各轮股份类别、清算优先权、反稀释条款、棘轮机制与参与分配权；完全稀释后总股本
        - 在 $3.3B 估值下，若退出估值低于 $5B，优先股优先清算权堆叠将吃掉大笔收益；普通股回报高度取决于资本结构
        - 法务；CFO 提供的股权结构表模型；Series E 条款清单披露信息
      - - Alma 整合进展与协同计划
        - 2025 年收购后的整合里程碑、Alma 带来的 ARR 贡献、技术整合路线图以及协同效应预期时间表
        - 并购风险显著；整合失利曾导致 Teladoc 减值超 $13B，其他买家也损失惨重；尚不明确 Alma 的 ARR 究竟是纯增量还是造成业务蚕食
        - 整合项目管理办公室（PMO）；产品与工程主管；Alma 存量客户留存数据
