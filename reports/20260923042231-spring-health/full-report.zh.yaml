      - number: '8.2'
        title: 可比公司估值分析
        blocks:
          - type: paragraph
            body: >
              二级市场心理健康及远程医疗可比公司提供了一个低迷的市场锚位。截至 2024 年第四季度，Accolade（ACCD）年收入约 $360M，交易倍数仅约 1.4× ARR，较 2021 年的 15–20× ARR
              大幅缩水。Talkspace（TALK）截至 2025 年第一季度收入约 $110M，估值倍数约 2.9× ARR。Teladoc Health（TDOC）2023 年收入 $2.6B，估值仅约 1.3×
              收入，在累计计提 Livongo 高达 $13.4B 的商誉减值后，估值仅为 2021 年峰值的一小部分。公开市场可比标的释放的信号十分明确：凡是未能证明清晰盈利路径或差异化疗效的公司，2021
              年数字健康领域的估值泡沫已完全破灭。一级市场可比公司虽处于不同梯队，但在老股交易市场和基金净值（NAV）中面临相似的下调压力。Lyra Health 上一次估值为 2022 年 Series F 的
              $4.8B，此后未公开披露新融资，意味着基金净值已大幅减记。Modern Health 在 2021 年录得的 $1.17B 估值峰值同样显得过时。Spring Health 相对公开可比公司的溢价，来自其
              2025 年 JAMA 同行评审 RCT 疗效证据、雇主 SaaS 客户粘性以及 ROI 履约保证——这些均是上市公司所欠缺的要素——但该溢价能否站稳，仍高度取决于实际 ARR 数据的核实。
