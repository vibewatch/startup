      - number: '4.2'
        title: 收入模型与单客经济模型测算
        blocks:
          - type: paragraph
            body: >
              Spring Health 的收入主要来自按每人每月（PEPM）向雇主收取的心理健康福利平台订阅费。2025 年取得 Knox-Keene 牌照后引入的健康险渠道收入采用按人头付费（Capitation）或
              PMPM 模式，截至报告生成期仍处于起步阶段。2025 年与 Alma 合并后新增了来自咨询师撮合交易市场的 C 端收入，其单客经济模型与企业端核心 PEPM 截然不同，可能呈现 ARPU
              更低且流失率更高的特征。

              隐含 ARR 测算（分析师推断）：若所有覆盖人群均为按全额商业费率付费的活跃订阅者，20M 覆盖人群 × $30–$50 PEPM × 12 个月将得出 $7.2B–$12B 的理论上限
              ARR。但覆盖人群包含渠道合作伙伴群体，其单人 PEPM 可能远低于此，且并非所有在保员工都会实际使用服务。若采取更谨慎的测算逻辑：按 450 家直签雇主客户、每家企业假定平均 2,000
              名员工、按每人每年（PEPY）$150–$300 计算，直签雇主合同带来的 ARR 约为 $135M–$270M——与处于高增长阶段的 Series E 轮企业体量大致吻合。

              公司单客经济数据完全保密。毛利率、获客成本（CAC）、客户终身价值（LTV）及回本周期数据均未对外公开。医疗服务网络支出（超 10,000 名持证服务人员）、客户成功团队人力（员工 1,001–5,000
              人）以及技术研发支出均为大额刚性成本项，其占营收比重目前尚不得而知。
