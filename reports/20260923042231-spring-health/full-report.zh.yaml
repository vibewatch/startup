  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历程与估值演变
        blocks:
          - type: paragraph
            body: >
              Spring Health 五轮公开融资累计超过 $488M。Series A 轮：$22M（2020 年，Kinnevik 与 Work-Bench 参投）；Series B 轮：$76M（2021
              年，Tiger Global 领投）；Series C 轮：$190M（2022 年，Tiger Global 领投，投后估值 $2B）；Series D 轮：未公开确认；Series E
              轮：$100M（2024 年 4 月，《财富》独家报道，投后估值 $3.3B）。Series C 与 Series E 之间相隔约两年且缺乏确证的 Series D
              轮，可能反映出存在未公开的过桥贷款、未标明的追加轮，抑或公司在 2022 至 2024 年间无需额外资金注入。

              Series E 轮 $3.3B 的估值较 Series C 轮的 $2B 跃升 65%，历经约两年业务运营得以实现。这表明在 2022–2023
              年大多数风投支持企业经历数字医疗估值大幅回调的背景下，公司仍维持了足以支撑估值溢价的稳健增速。在 SEC EDGAR 系统中以 Spring Health, Inc.、Spring Health Benefits
              或已知关联实体名称均未检索到 Form D 备案文件——这或源于公司适用了特拉华州级豁免，并不代表未发生募资。

              投资方结构：Tiger Global（领投 Series B 与 C 轮）、Kinnevik（领投 Series A 轮）及 William Blair。Palo Alto Networks 首席财务官
              Dipak Golechha 于 2025 年加入董事会，释放出公司在为潜在 IPO 或大型机构级融资做准备的信号。
