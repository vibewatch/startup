      - number: '7.3'
        title: 业务、财务与竞争风险
        blocks:
          - type: paragraph
            body: >
              Spring Health 的财务风险集中在四项相互交织的挑战：ROI 兜底责任、盈利路径、估值可持续性以及退出流动性。ROI 保证（第 3 年达
              3×）带来了一笔未量化的或有负债：若任何雇主群体的临床成效未达预期，Spring Health 必须补偿雇主——可能采取延长合同、折抵服务费或直接现金支付的方式。这项保证背后的精算依据并未公开。如果 JAMA
              研究的 ROI 无法在低利用率或更高重症程度的雇主群体中复现，赔付金额可能超出预期并侵蚀利润率。

              来自 Optum 的竞争风险在短期内最为致命：作为 UnitedHealth 的子公司，Optum 拥有覆盖超过 95M 会员的行为健康网络、全面的平权合规能力、Epic EHR
              深度整合以及健康险分发渠道——这些优势是 Spring Health 目前规模无法匹敌的。加上 Lyra 拓展临床业务（在 2023–2024 年增加 EAP 替代功能）以及 Modern Health
              完成独角兽轮融资（估值 $1.17B），意味着雇主心理健康平台的高端市场已有三家资金充裕的竞品直接瞄准 Spring Health 的核心客群。

              与 Alma 的合并带来了整合执行风险：Spring Health 必须把 Alma 的 C 端撮合平台模式（独立咨询师、自费/保险账单、C 端界面）与自身的临床级企业平台（雇主
              PEPM、循证诊疗路径、Compass EHR）深度打通。两套截然不同的技术栈、服务提供方类型和商业模式相互融合，构成重大的运营风险。一旦合并拖慢产品研发或分散工程资源，公司在雇主渠道的竞争地位可能会被削弱。

              外部风险还包括数字健康行业的市场周期：2022–2023 年数字健康估值大幅重估，虽然淘汰了几家腰部竞品，但也压低了 IPO 估值倍数。Spring Health 高达 $3.3B
              的估值，要么依赖一级市场持续给予溢价倍数（意味着需要以 $5–10B+ 估值完成 Series F 或 IPO），要么拿出扎实的运营数据，在更保守的退出倍数下支撑现有估值溢价。
