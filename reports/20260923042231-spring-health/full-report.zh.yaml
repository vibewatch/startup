      - number: '6.2'
        title: 客户成效实证与 ROI 验证
        blocks:
          - type: paragraph
            body: >
              Spring Health 面向客户的价值主张由四项独立或半独立的实证研究提供支撑。首先，Wellstar Health System 标杆案例（由 Spring Health 于 2023 年发布）记录了
              Wellstar 员工及其家属每投入 $1 带来 $4.30 成本节约——即 4.3× ROI——这是迄今公布的最详尽的单一雇主成效案例。其次，发表于《JAMA Network Open》的 2025
              年同行评审独立研究，对涵盖约 100,000 名参保会员的大型雇主队列进行了追踪，证实了 1.9× ROI、住院费用降低 50%，以及抑郁症平均康复周期仅需 5.9 周。

              第三，Validation Institute 2025 年出具的认证证实，Spring Health 雇主客户群体的心理健康支出实现了 21%
              的净成本节约——该结论基于对理赔数据的精算分析，而非问卷自述。第四，URAC 三重认证（临床医疗、危机干预项目及身心健康）提供了来自独立认证权威机构的照护质量背书，形成与成效实证研究互补的制度性证明。

              平台级核心指标（由 Spring Health 自主披露）：临床改善率达 92%；推荐医疗服务方会员留存率达 95%；心理健康状况改善率达 67%（来自雇主背书证言）；某匿名企业上线首月参保率达
              25%；服务人员满意度达 90%。上述数据属于未公开测算方法的自述指标；JAMA 与 Validation Institute 的研究为其中部分数据提供了独立交叉验证。
