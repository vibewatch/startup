chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、商业模式与产品平台
        blocks:
          - type: paragraph
            body: >
              Spring Health 是一家总部位于纽约的精准心理健康福利服务商，由 CEO April Koh 与总裁 Adam Chekroud 于 2016 年创立，使命是「消除心理健康的一切障碍」。公司采用 B2B
              订阅模式——按每人每月（PEPM）向自保雇主与健康险计划销售行为健康福利方案。员工及其家属无需自付即可享受服务。截至 2025 年，Spring Health 在全球覆盖超过 20M 人群，服务 450
              多家直签雇主，并借助渠道合作伙伴触达另外 27,000 个企业客户群体。


              公司的核心差异化在于「精准心理健康医疗（Precision Mental Healthcare）」——一套专有 AI 系统，会员只需花 3–5 分钟完成测评，系统即可筛查 12
              种以上心理健康状况，并自动将其分流至最佳诊疗方案：数字化自主练习、心理健康教练辅导、线上或面对面心理咨询、精神科诊疗与药物管理、员工心理援助（EAP）服务，或是复杂疾病专科护理。会员首诊预约可在 1
              天内完成。产品矩阵包括：SpringLife（个人与家庭福利）、SpringWorks（管理者心理健康）、Guide（AI 持续照护助手，2025 年上线）、Compass（专属医疗服务方
              EHR）、Atlas（雇主端 ROI 分析）以及 Specialty Care（涵盖成瘾、PTSD、进食障碍、重度情绪与焦虑障碍）。LinkedIn 数据显示公司员工规模在 1,001–5,000
              人之间，在纽约、旧金山、盐湖城和西雅图设有办公枢纽。
