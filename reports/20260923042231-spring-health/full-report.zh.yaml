      - number: '1.2'
        title: 创始人、管理层、科学顾问与公司治理
        blocks:
          - type: paragraph
            body: >
              CEO 兼联合创始人 April Koh 曾就职于 McKinsey 与 Google；其创立初衷源自家人经历心理健康困境的切身体会。总裁兼联合创始人 Adam Chekroud
              拥有牛津大学计算神经科学博士学位，曾任耶鲁大学医学院研究员，在抗抑郁治疗方案选择的预测分析领域发表过开创性论文，这构成了精准心理健康医疗的科学内核。Arielle Mortimer 于 2024
              年出任首席运营官。Palo Alto Networks 首席财务官 Dipak Golechha 于 2025
              年加入董事会，体现出企业级科技投资界的认可。除上述高管外，公开渠道未见其他高管披露，关键人风险高度集中于两位创始人身上——二人在科研、临床与融资层面的双重核心角色极难替代。


              Spring Health 的科学顾问委员会阵容豪华，汇聚多位顶尖学者：John Krystal 医学博士（耶鲁大学医学院精神医学系主任、耶鲁-纽黑文卫生系统精神医学主管，因氯胺酮治疗抑郁症研究闻名）；Myrna
              Weissman 博士（哥伦比亚大学教授，抑郁症人际心理疗法开发者）；Nikolaos Koutsouleris 医学博士（慕尼黑大学教授，精神医学机器学习专家）；Svetha Venkatesh
              博士（迪肯大学教授，模式识别与数据分析专家）；以及 Martin Paulus 医学博士（桂冠大脑研究所科学总监）。这支国际公认的学术级精神医学专家阵容，为公司建立了雇主福利平台中少有的临床公信力。
