      - number: '7.2'
        title: 法律与责任风险
        blocks:
          - type: paragraph
            body: >
              Spring Health 的临床交付模式安排持证执业人员为重度心理健康患者提供诊疗服务，因而直接面临临床疏忽和监管不力的责任风险。与声明免除临床责任的纯软件平台不同，Spring Health
              作为一个有组织的医疗交付体系运营，旗下拥有签约执业人员，承担疗效问责，并提供 ROI 兜底——每一项都带来了纯科技平台无需承担的法律义务。

              最显著的新兴法律风险是 AI 临床责任。Guide AI 采用主动连续照护模式，由 AI 系统主动向会员提出心理健康干预建议。如果 Guide AI
              遗漏危机信号、给出错误指导，或延误会员获取紧急救治的时机，Spring Health 可能面临专业责任索赔主张——无论是直接被起诉，还是通过对旗下执业人员网络的补偿追偿。VERA-MH
              安全框架规范了聊天机器人的自杀意念风险，但 Guide 这种主动推送模式尚未被任何已发布的安全标准所覆盖。

              FTC 对 BetterHelp 的同意令（2023 年）确立了法律先例：即便征得用户同意，与广告平台共享心理健康数据依然违反 FTC 法案第 5 条。Spring Health
              在使用分析供应商、再营销像素和雇主分析看板时，必须严格规避 BetterHelp 的违规模式：未经明确知情同意，不得出于非诊疗目的向第三方共享会员的心理健康状况、诊疗记录或互动数据。

              联邦法规 42 CFR Part 2（《物质使用障碍患者记录保密规定》）在标准 HIPAA 之外，对共享物质使用障碍（SUD）诊疗记录提出了更严格的知情同意要求。Spring Health 的 Specialty
              Care SUD 路径在向雇主分析看板共享数据时，必须符合 Part 2 的规定——许多数字健康公司都曾在此类合规复杂性上遇到意外阻碍。
