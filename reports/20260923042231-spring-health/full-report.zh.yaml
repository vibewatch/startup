            title: Guide 将 AI 延伸至看诊间歇的持续照护，临床准确性风险随之增加
            body: >
              Guide AI 的持续照护模式根据互动信号在问诊间歇主动轻推会员，这也滋生出新的临床与法律责任风险。如果 AI
              在两次就诊期间误判会员心理状态、未能及时上报危机信号，或在高危时刻提供了不恰当的引导，可能会造成直接的临床伤害。VERA-MH 虽然规范了针对自杀意念的对话机器人安全，但该标准主要针对面向消费者的
