  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与业务边界
        blocks:
          - type: paragraph
            body: >
              Spring Health 将美国雇主出资型行为健康福利市场作为核心主战场，同时在 2025 年取得 Knox-Keene 牌照后，延伸切入规模更大的管理型行为健康市场（涵盖商业健康险计划、Medicaid 及
              Medicare Advantage）。

              该市场由四大支出板块构成：(1) 传统 EAP（员工心理援助计划）——以电话咨询为主，平均使用率仅 5–8%；(2) 传统独立心理健康管理方案（Carve-outs）——由 Magellan、Optum 或
              Beacon 等经办，成本高昂且就医体验落后；(3) 数字原生单点/平台方案（Spring Health、Lyra、Modern Health）——以临床可量化成效替代传统 EAP 的全光谱平台；(4) C
              端自费 App（Headspace、Calm、BetterHelp）——针对轻度需求，缺乏雇主端系统集成。Spring Health 属于第 3 板块，正在蚕食并替代第 1 和第 2 板块的原有合同。

              截至 2026 年，不属于 Spring Health 目标市场的领域包括：精神科住院治疗、封闭式物质成瘾康复、临床药物试验以及未与雇主签约的纯 C 端心理健康 App。与 Alma
              的合并带来了混合形态：为离职会员提供面向消费者的心理咨询师交易市场，但这属于辅助渠道，并非核心收入支柱。
