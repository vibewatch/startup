      - number: '8.5'
        title: 核心尽调诉求
        blocks:
          - type: paragraph
            body: >
              在对 Spring Health 形成最终投资判断前，数据室中优先级最高的五项尽调清单围绕全部 8 个尽调章节中最核心的证据缺口展开。第一也是最关键的：按雇主入驻年份（2020–2024 年）划分的
              ARR、总收入及净收入留存率（NRR），因为整个估值逻辑完全取决于能否将 ARR 核实在分析师估算的 $130–300M 区间之内；第二：Spring Health 利用度管理、预先授权及网络充分性方案的
              MHPAEA 非量化治疗限制（NQTL）对比分析，因雇主客户承担 MHPAEA 首要合规责任，任何平权违规认定都会导致合同修改或终止；第三：针对 Guide AI 临床责任的法律意见书（涉及非法行医、FDA
              医疗器械软件 SaMD 分类、各州心理健康执业法案）及对应的职业疏忽责任险（E&O）与医疗差错责任险保额上限；第四：渠道经济模型——健康险人均月费（PMPM）、获客成本（CAC）回本周期，以及按 12、24、36
              个月队列划分的账户级 NRR，以确认健康险渠道的经济效益相较雇主直销是增厚还是摊薄；第五：涵盖 Series A 至 E 的股权结构表（cap
              table）与清算优先权偿付瀑布，包括反稀释条款及参与分配权，因为在融资总额达 $488M、估值 $3.3B 的情况下，在任何低于 $5B 的退出情景中，优先股堆叠都将严重影响普通股股东的回报水平。
