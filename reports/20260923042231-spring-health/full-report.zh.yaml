  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              雇主心理健康平台市场呈现三层竞争格局。第一梯队（数字原生平台）：Spring Health、Lyra Health 与 Modern Health
              是面向大型雇主提供全光谱心理健康平台的三家风投支持独角兽。三家均宣称具备同行评审临床实证，均采用 PEPM 订阅收费模式，且均聚焦 Fortune 500 强及 500 人以上的大中型企业。

              第二梯队（管理型行为健康机构 / 传统 EAP 巨头）：Optum Behavioral Health（隶属 UnitedHealth Group）、Magellan Health（隶属
              Centene）、Beacon Health Options（隶属 Anthem）以及 ComPsych 掌握着现存大部分雇主 EAP
              与管理型行为健康存量合同。这类传统巨头具备深厚的保司协同、成熟的行政服务基建与高昂的迁移成本，但普遍存在员工使用率低（仅 5–8%）、缺乏临床成效量化及用户体验陈旧等通病。

              第三梯队（单点工具与 C 端 App）：Headspace、Calm、Talkspace、BetterHelp 以及冥想助眠类应用主打轻度泛健康需求。Talkspace（NASDAQ 上市）虽面向 C
              端及部分雇主提供服务，但单客经济模型持续承压。BetterHelp（Teladoc 旗下子公司）按订阅规模算虽是最大的 C 端远程心理咨询平台，但欠缺雇主端深度集成能力，并曾因数据隐私合规问题遭到 FTC 调查。

              Spring Health 稳居第一梯队的高端位置：拥有经 JAMA 权威认证的临床实证、极其严格的医疗服务方准入标准、完整的传统 EAP 替代能力，以及业内唯一的 ROI 兜底保障机制。其 PEPM
              定价虽高于第二梯队传统厂商，却能拿出可量化、显著领先的临床成效。
