      - number: '1.3'
        title: 融资历史、估值与关键里程碑
        blocks:
          - type: paragraph
            body: >
              Spring Health 公开的风险投资累计超过 $488M。已确认轮次包括：Series A 轮（$22M，2020 年，Kinnevik/Work-Bench 参投）；Series B
              轮（$76M，2021 年，Tiger Global 领投）；Series C 轮（$190M，2022 年，Tiger Global 领投，投后估值 $2B）；以及 Series E 轮（$100M，2024
              年 4 月，《财富》独家报道，投后估值 $3.3B）。目前没有任何公开确认的 Series D 轮，期间存在两年的空白期且原因不明。主要投资方包括 Tiger Global、Kinnevik 与 William
              Blair。


              截至研究窗口的核心数据：估值 $3.3B（2024 年 4 月）；公开累计融资超 $488M；覆盖人群超 20M；签约医疗服务提供方超 10,000 家；直签雇主超 450 家；员工 1,001–5,000
              人；收入未披露。研究窗口内关键进展（2024-05-07 之后）：Validation Institute 于 2025 年出具第三方认证，证实其为心理健康支出带来 21% 净成本节省；《JAMA Network
              Open》于 2025 年刊发同行评审研究，证实 1.9× ROI 及住院费用降低 50%——这是数字行为健康市场中最坚实的独立临床实证；2025 年完成与 Alma
              合并，打造出贯穿早期干预至长期支持的首个终身心理健康平台；2025 年取得加州 Knox-Keene 管理型行为健康牌照，打开健康险管理型医疗市场；2025 年推出 Guide AI 助手；2025 年 Palo
              Alto Networks 首席财务官 Dipak Golechha 加入董事会；入选 TIME100 Most Influential Companies 2026。


              竞争格局背景：Spring Health 打造了一体化全光谱平台，把数字化自我照护、健康教练辅导、心理咨询、精神科诊疗、EAP 与专科护理整合进单一方案，与仅覆盖一两类照护模式的竞品形成鲜明对比。同行评审的
              JAMA 实证加上承诺保障 ROI 机制，更是传统纯 EAP 服务商公开层面无法企及的差异化壁垒。
