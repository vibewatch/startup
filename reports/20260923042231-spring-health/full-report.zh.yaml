  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管风险全景
        blocks:
          - type: paragraph
            body: >
              Spring Health 所处的监管环境极其严苛，横跨联邦心理健康平权法案、HIPAA、加州 Knox-Keene 州级保险监管，以及新兴的联邦临床 AI 政策。每一层监管都带有合规义务，一旦违规，Spring
              Health 及其雇主客户都将面临执法处罚、福利方案重构以及声誉受损。

              《心理健康平权与成瘾平等法案》（MHPAEA）是运营层面影响最深的监管要求。劳工部、卫生与公众服务部以及财政部（DOL/HHS/Treasury）联合发布的 2024
              年最终规则，要求健康险和雇主福利计划必须确保：对心理健康与物质使用障碍（MH/SUD）福利适用的非量化治疗限制（NQTL，如预先授权、利用度管理标准、网络充分性），其限制程度不得严于对可比内外科福利适用的标准。Spring
              Health 的核心产品（按人头每月收费的 PEPM 雇主福利）直接嵌入用人单位的 MH/SUD 福利设计中；2024 年 MHPAEA 规则要求方案发起人开展并记录 NQTL 对比分析，这可能迫使 Spring
              Health 调整其利用度管理实践。

              HIPAA 隐私与安全规则同样约束 Spring Health，因为它是雇主赞助健康险计划的商业伙伴（BA）。HHS 民权办公室（OCR）负责执行 HIPAA，对每类违规行为每年最高可处以 $1.9M
              的民事罚款。在 Spring Health 覆盖 20M 参保人的规模下，会员受保护健康信息（PHI）一旦发生泄露，就会触发 OCR 违规通报规则，要求通知媒体，并带来巨大的声誉风险。FTC 针对
              BetterHelp 的和解裁决（2023 年）确立了一项先例：与第三方广告商共享心理健康数据违反《联邦贸易委员会法》——这一先例直接适用于 Spring Health 与营销及分析供应商之间的数据合作。

              2025 年取得牌照后，加州《Knox-Keene 医疗保健服务计划法案》开始适用于 Spring Health。加州管理医疗保健局（DMHC）负责监管 Spring Health
              在加州的健康险运营，涵盖偿付能力、申诉与上诉、接诊标准以及网络充分性要求——这在联邦 MHPAEA 和 HIPAA 义务之上，又叠加了一层州级合规重担。
