      - number: '8.3'
        title: 情景分析与概率加权回报
        blocks:
          - type: paragraph
            body: >
              乐观情景：Spring Health 借助新获得的 Knox-Keene 牌照拓展健康险渠道、将首个大单 Point32Health 复制到更多险资计划、依托 Generation Investment
              Management 的英国网络发力国际市场，并逐步释放 Specialty Care（物质使用障碍）的收入潜力，推动 ARR 在 2026–2027 年提速至 $400–500M。若按 $450M 的 ARR
              运行率给予 15–20× 倍数，估值可达 $6.75–9B，意味着较 Series E $3.3B 入场点获得 2–3×
              的回报。该情景成立的前提是拿下多家大型险资客户并保持强劲的雇主留存率——逻辑成立，但高度取决于执行力。基准情景：ARR 达到 $200–300M，雇主渠道保持 30–40%
              的年化增速，健康险渠道贡献有限，临床验证数据支撑 12–15× 的远期倍数，对应估值 $2.4–4.5B，回报大致持平到微幅盈利。悲观情景：受 MHPAEA 监管执法阻力、PBM
              及险资自建心理健康网络的竞争挤压，以及服务方成本上涨影响，ARR 年复合增长率跌破 20%，估值倍数压缩至类似低迷上市公司的 4–6×，对应估值 $520–780M——较入场估值大幅缩水 75–85%。如果
              FTC 数据风险与 AI 临床责任同时爆发，引发大企业销售冻结和高昂的监管整改成本，悲观情景完全可能发生。
