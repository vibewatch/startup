        - $3–4.5B
        - 持平至 1.4 倍
        - ARR 增长略逊预期；受上市公司估值承压拖累
        - 与当前证据最为吻合——覆盖 2000 万人、450 多家雇主、$3.3B 估值背书
      - - 悲观情景
        - 雇主端流失加剧（PBM/健康险计划收回自研自营）；ARR 增速低于 20%；同业可比公司估值回调至 4–6 倍 ARR；被迫重组或折价抛售并购
