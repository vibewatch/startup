      - 隐含 ARR（2027 年）
      - 隐含估值
      - 较 $3.3B 预期回报
      - 关键风险
      - 概率信号
    rows:
      - - 乐观情景
        - 健康险渠道迅速起量（拿下 5–10 家大型健康险客户）；ARR 复合年增长率达 60% 以上；Alma 整合协同效应超预期；2026 年以 20 倍 ARR 估值 IPO
        - $500M+
        - $7.5–10B
        - 2.3–3 倍（IPO 或 Pre-IPO 老股交易）
        - 支付方压价，IPO 市场窗口关闭
        - 逻辑可信，但需要在 2025–2026 年宣布拿下 3 家以上健康险客户
      - - 基准情景
        - 雇主渠道维持 30–40% 复合年增长；健康险渠道推进平稳（斩获 1–2 家）；ARR 达 $200–300M；2026–2028 年以 12–18 倍 ARR 推进 IPO 或战略并购
