  - id: TV003
    title: 乐观 / 基准 / 悲观情景分析表
    description: >
      Three scenarios for Spring Health's valuation by 2027–2028 with assumptions, valuation/return logic, key risks,
      and probability signal.
    columns:
      - 情景
