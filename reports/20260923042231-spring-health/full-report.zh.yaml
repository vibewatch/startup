  - id: TV004
    title: 可比公司估值表
    description: >
      Selected public and private comparable companies with valuation metrics for Spring Health multiple triangulation
      as of 2025–2026.
    columns:
      - 可比对象
      - 类型
      - 指标
      - 估值倍数 / 估值
      - 对 Spring Health 的参考意义
      - 局限性
    rows:
      - - Accolade (ACCD)
        - 上市
        - 约 $360M ARR；约 $500M 市值
        - 约 1.4 倍 ARR
        - 雇主端导医分流 + 行为健康；采用类似的 B2B2C 雇主分发模式
        - 临床成效证据偏弱；二级市场估值处于受压状态；增速较低；缺乏同行评议的 RCT 研究
      - - Talkspace (TALK)
        - 上市
        - 约 $110M ARR；约 $320M 市值（2025 年）
        - 约 2.9 倍 ARR
        - 面向雇主的 EAP / 心理治疗报销覆盖；符合 HIPAA 的心理健康平台
        - C 端占比较高；无雇主端 ROI 兜底承诺；缺少分流导医层；客户粘性偏低
      - - Teladoc Health (TDOC)
        - 上市
        - 约 $2.6B 营收；约 $3.5B 市值
        - 约 1.3 倍市销率（P/S）
        - 通过并购 Livongo 与 BetterHelp 建立起大规模雇主端行为健康服务
        - 非纯心理健康标的；对 Livongo 计提 $13.4B 商誉减值；估值倍数持续下滑；存在业务整合难题
      - - Lyra Health
        - 非上市
        - $4.8B 估值（2022 年 Series F 轮）；未披露 ARR
        - 约 15–30 倍估算 ARR（按 2022 年市场环境）
        - 最直接竞品；相似的雇主导医模型；相似的临床实证主张
        - 上一轮融资发生在估值挤泡沫前；缺乏对标 JAMA 的研究实证；到 2024 年账面估值很可能已缩水
      - - Modern Health
        - 非上市
