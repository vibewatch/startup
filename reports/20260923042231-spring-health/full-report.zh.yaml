      - number: '8.4'
        title: 投资逻辑与建议
        blocks:
          - type: paragraph
            body: >
              对于投资周期为 4–7 年且能进入数据室（data room）的成长期投资机构，在当前 $3.3B 估值下给予 Spring Health「有条件买入」（CONDITIONAL
              BUY）评级。投资逻辑立足于三大相互强化的支柱：第一，拥有 2025 年 JAMA 同行评审 RCT 证据支持的临床疗效优势——这是多数数字健康竞品无法达到的标准——构建了扎实的雇主留存护城河，也支撑起相对传统
              EAP 竞品的定价溢价；第二，循证心理健康医疗在雇主市场渗透率仍严重不足，加之 2024 年 MHPAEA 执法促成了对正规循证诊疗流程的新增合规需求，至少到 2028 年都将提供持久的长期利好；第三，与
              Alma 合并后，Spring Health 从 B2B 雇主业务延伸至 C 端与健康险相邻赛道，配合 Knox-Keene
              牌照，打造出多渠道平台，提高了每个参保覆盖人的总体可变现空间。明确投资判断的核心前提条件包括：通过数据室核实 ARR 与 NRR 真实数据、审查 MHPAEA NQTL 合规对比分析，以及获取 Guide AI
              临床责任的法律意见书与保险覆盖证明。相较于 2021–2022 年数字健康行业 30–80× ARR 的估值巅峰，以 $3.3B 入场具备吸引力，但仍需确凿的财务数据以消除当前较宽的不确定性区间。
