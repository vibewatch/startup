      - number: '3.2'
        title: 重点竞品逐一对比
        blocks:
          - type: paragraph
            body: >
              Lyra Health（核心直接竞品）：2015 年创立，总部位于加州伯灵格姆。按医疗服务网络规模算是最大的数字心理健康竞品（签约医生与咨询师超 30,000 名，Spring Health 约为 10,000
              名）。覆盖超 20M 人群，大型标杆企业客户包括 Facebook/Meta、Uber、eBay 与 Morgan Stanley 等。最新公开估值 $4.8B（2022 年 Series F 轮，融资
              $235M）。2025 年 Lyra 推出临床级 AI 平台、收购专注儿科的 Bend Health，并与 Workday Wellness 达成集成合作。Lyra
              设立了瑞士办事处以覆盖跨国雇主。核心短板：临床循证厚度稍逊——截至 2026 年未见能比肩 JAMA 级别的权威刊发成果；且起源于心理咨询的基因，使其在健康教练、EAP 与专科护理的一体化深度上不及 Spring
              Health。

              Modern Health（次要直接竞品）：2017 年创立，总部位于旧金山。投资方包括 Kleiner Perkins、Founders Fund、John Doerr、Y Combinator 及
              Battery Ventures。估值 $1.17B，累计融资超 $170M。由 Alyson Watson
              创立，是全美女创始人独资团队中最快跻身独角兽的企业。以心理教练为核心并辅以多模态支持（教练辅导、数字化内容、群体互助）；服务全球雇主，海外咨询师网络覆盖 70
              多个国家。核心短板：偏向轻度教练服务的定位，在应对重度精神障碍及药物治疗需求时号召力不足。

              Optum Behavioral Health（统治级传统巨头）：隶属 UnitedHealth Group（NYSE: UNH，市值约 $500B）。通过 Emotional Wellbeing
              Solutions EAP 与管理型医疗 Carve-out 方案，为 30M 多名商业保险参保人经办行为健康福利。与 OptumRx、UHC 及主要医院网络高度协同。核心短板：使用率低下（受传统 EAP
              模式拖累）、数字化互动能力孱弱，且保司母体背景让雇主容易对其产生利益冲突戒心。

              Talkspace：上市公司（NASDAQ: TALK）。2024 年收入约 $170M。雇主方案中仅包含远程心理咨询，未纳入精神科诊疗与教练服务。当前市值约
              $300M。长期饱受利润承压与咨询师高流失率困扰。FTC 在 2023–2024 年就其数据隐私操作展开调查，形成了不利的监管阴影。并不具备完全替代传统 EAP 的产品力。
