      - number: '6.3'
        title: 客户获取、留存与竞品替代
        blocks:
          - type: paragraph
            body: >
              Spring Health 最主要的获客渠道，是面向 500 人以上企业的 HR 和福利主管做大企业直销。公司公开承诺到第 3 年提供 3× ROI 履约保证（第 2 年达 2×，第 1
              年收支平衡）——这笔带财务背书的成效承诺降低了 HR 采购风险，也让 Spring Health 区别于那些只做效果跟踪却不给财务兜底的竞品。这种保证机制带来了筛选效应：只有员工规模足够大、ROI
              测算具备统计学意义的客户才会签约，可能导致公开的客户画像偏向参保员工超 2,000 人的大型雇主。

              渠道合作路线（覆盖 27,000 多个团体）主要由第三方管理机构（TPA）合作关系（如 2025 年的 Stonebrook Risk
              Solutions）、福利经纪人以及健康险对接拉动。Point32Health 在 2025 年选定 Spring Health 作为其行为健康福利合作伙伴，是公司目前公开的最大单笔健康险客户突破，表明
              Knox-Keene 模式在商业上能够跑通。

              客户留存信号强劲，但多为自报口径：URAC 认证要求意味着服务质量标准需要持续维持；截至评估基准日，Wellstar 和 JPMorgan 均未公开宣布终止合作。雇主客户证言记录了对传统 EAP
              供应商的替代（取代 Optum、Lyra，属于存量预算替换而非新增开支），但公司并未披露净收入留存率（NRR）。
