            body: >
              FTC 在 2023 年对 BetterHelp 下达的同意令确立了明确规则：将心理健康状况、互动记录或诊疗数据共享给广告平台，即便已在隐私政策中披露，依然违反《联邦贸易委员会法》。Spring Health
