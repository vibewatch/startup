  - id: TV005
    title: 逻辑破裂与清仓止损触发条件表
    description: >
      Material events or thresholds that would break the bull or base investment thesis for Spring Health, with
      transmission logic and action implication.
    columns:
      - 触发条件
      - 阈值
      - 对投资逻辑的影响传导
      - 行动含义
    rows:
      - - 实证 ARR 确认低于 $100M
        - 若经审计 ARR < $100M，在 $3.3B 估值下隐含倍数超 33 倍——相对仅 2–3 倍的上市公司完全站不住脚
        - 存在根本性高估；任何增长率都无法在 5 年内填平与可比上市公司的估值差距
        - 不予投资；下调预期；密切关注重组信号
      - - 雇主年度客户数总流失率 > 15%
        - 雇主账户年度流失率持续超过 15%，标志着产品与市场匹配度（PMF）遭遇结构性动摇
        - NRR 极可能跌破 90%；增长将完全依赖新签客户；ARR 天花板显现
        - 有条件不予投资，视客户流失根因分析结果而定
      - - FTC 采取重大执法行动（AI 数据共享违规）
        - FTC 就未经授权共享心理健康数据对 Spring Health 提起投诉或下达和解同意令
        - Guide AI 被叫停；企业级销售陷入停滞；和解成本高昂；面临集体诉讼风险
        - 立即复审；若确认存在收入中断风险则清仓离场
      - - MHPAEA 执法认定 Spring Health 服务方案违背平价原则
        - DOL EBSA 审计认定 Spring Health 的利用度管理构成歧视性 NQTL
        - 雇主客户被迫调整或弃用 Spring Health 方案设计；引发连锁流失
        - 有条件抛售；在审计裁定后持续观察雇主 6 个月内的续约动态
      - - 下一轮融资估值大幅下调（折价融资幅度 > 30%）
        - Spring Health 以 $2.3B 或更低估值完成新一轮融资
        - 表明其增长或盈利指标从根本上未达 Series E 轮时的预期承诺
        - 审查反稀释条款；需重估投资逻辑；开启新一轮尽调
      - - Guide AI 出现临床不良事件并引发监管介入
        - 州医事委员会或 FDA 针对 Guide 所致临床伤害采取执法行动
        - AI 产品叫停；需计提责任准备金；雇主客户可能解约
        - 立即评估风险；视严重程度与波及范围，极可能颠覆投资逻辑
