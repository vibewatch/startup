  - id: TM004
    title: 增长驱动因素与制约条件
    description: |
      Structural market forces affecting Spring Health's growth outlook over the 2024–2030 window.
    columns:
      - 驱动因素 / 制约条件
      - 影响方向
      - 起效时间
      - 对 Spring Health 的影响
      - 尽调追问要点
    rows:
      - - 心理健康发病率（全美成年人中占 23.4%，约五分之一）
        - 顺风
        - 持续存在 / 结构性
        - 雇主无法回避；每家大型雇主都有患有轻度至重度心理疾病（AMI）的员工
        - 无须专门核查；NAMI/NIMH 公开数据已证实
      - - 心理健康平权最终规则（2024 年 MHPAEA）
        - 顺风（监管驱动）
        - 2024–2026 年执法落地
        - 雇主须出具心理健康保障同等可及的证明文件；传统 EAP 无法满足合规要求
        - 向 Spring Health 销售团队核实 MHPAEA 合规审计相关的获客线索储备
      - - 后疫情时代远程医疗常态化
        - 顺风
        - 长期常态
        - 线上诊疗接受度提升，打通了 Spring Health 全国服务者网络的地域限制
        - 关注 CMS 在 2025–2026 年针对远程医疗永久性政策的裁定
      - - 劳动力诉求（Z 世代 / 千禧一代倾向）
        - 顺风
        - 2024–2030
        - 75% 的 Z 世代曾因心理健康原因离职；心理健康福利已成为招聘与留才的关键杠杆
        - 借助雇主调研或 HR 合作伙伴数据核实实际需求
      - - 医疗资源短缺（精神科医生缺口达 7,000+ 名）
        - 逆风
        - 2024–2030
        - 限制了 Spring Health 在保持服务品质不被稀释的前提下扩充 10,000+ 名网络的能力
        - 要求在 Data Room 中提供服务者网络扩张计划与流失率数据
      - - 雇主预算收紧 / CFO 态度审慎
        - 逆风
        - 2024–2026 年潜在衰退情景
        - 福利预算属于非刚性支出；ROI 承诺虽能降低顾虑，但无法彻底消除风险
        - 在 Data Room 中核查合同续约率与流失数据
      - - 隐私顾虑与病耻感（对雇主掌握数据的担忧）
        - 逆风
        - 持续存在
        - 抑制自发使用意愿；Spring Health 靠 HIPAA 级数据隔离来解决
        - 向 HIPAA 隐私合规官核实数据防火墙架构
      - - 数字医疗平台行业整合
        - 多空交织
        - 2024–2027
        - 并购可能催生体量更大的合并竞品；合并 Alma 则加固了 Spring Health 自身的护城河
        - 跟踪 Lyra / Modern Health 的融资与合作动态
