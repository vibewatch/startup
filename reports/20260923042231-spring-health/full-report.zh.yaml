      - number: '2.2'
        title: TAM、SAM 与 SOM 市场空间测算
        blocks:
          - type: paragraph
            body: >
              总可用市场（TAM）：2022 年全球行为健康市场规模估算为 $95B–$105B，预计到 2030 年将以 7–8% 的年均复合增长率（CAGR）增至约 $177B。2022 年美国行为健康直接总支出估算约
              $280B，是全球规模最大的单一国家市场。在美国本土，根据 KFF 2024 年雇主健康福利调查，基于就业的雇主出资型健康险覆盖约 1.65 亿美国人。雇主在各项福利中为每名员工每年支出的心理健康费用约为
              $182–$220（包含 EAP 与行为健康独立管理方案），折算对应的美国雇主端 TAM 每年达 $30B–$36B。

              可服务市场（SAM）：Spring Health 主要瞄准大中型雇主（员工规模 500 人以上）及全美商业健康险计划。美国员工 500 人以上的雇主群体约有 40,000–45,000 家，覆盖约 9500
              万在职员工。按综合心理健康平台保守测算的 $150 PEPM 潜力估算，Spring Health 对应的 SAM 每年约 $17B–$20B。截至 2025 年，数字原生雇主心理健康平台（Spring
              Health、Lyra 与 Modern Health 合计）渗透该 SAM 的比例仍不足 10%。

              可获取市场（SOM）：截至 2025 年，Spring Health 服务 450 多家直签雇主客户及 27,000 个渠道合作伙伴群体，覆盖超 20M 人群。若按中位区间 $30–$50 PEPM 及 20M
              覆盖人群且全员完全激活测算，理论隐含年收入潜力约 $7.2B–$12B——实际 ARR 则未对外公开。

              市场上也存在口径更窄的测算：MarketsandMarkets 2026 年报告将心理健康 App 市场规模定在 2025 年 $9.94B，预计到 2030 年增至
              $22.73B。这仅代表纯数字化软件的细分领域；Spring Health 的实际阵地包含规模更大的传统 EAP 替代及商业健康险签约市场。
