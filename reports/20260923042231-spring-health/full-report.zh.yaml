  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 已披露客户群体与客群画像
        blocks:
          - type: paragraph
            body: >
              Spring Health 已披露的客户名册横跨多个大型企业垂直行业。标杆客户包括 Microsoft（科技，数万名全球员工）、Target（零售，400,000 名员工）、J.P. Morgan
              Chase（金融，约 300,000 名员工）、Delta Airlines（交通运输，约 95,000 名员工）、Wawa（食品便利零售，45,000 多名员工）以及 Wellstar Health
              System（佐治亚州医疗系统，24,000 多名员工）。上述确证客户合计估算覆盖超 900,000 名直保员工，构成了支撑其 $3.3B 估值阶段典型的企业级福利平台蓝筹标杆客群。

              其行业分布极其广泛多元：涵盖医疗卫生系统（Wellstar）、金融服务（JPMorgan）、前沿科技（Microsoft）、连锁零售（Target、Wawa）及航空运输（Delta）。这种跨行业分散化有效平抑了单一行业的集中度风险；从公开客户构成来看，没有哪个行业在收入中的占比超过
              20–30%。此外，Hearst（传媒出版）与 Point32Health（商业健康险计划）也属于公开确认客户，表明其影响力已渗透进传媒与管理型医疗渠道。

              雇主渠道由 450 多家直签客户与 27,000 多个渠道合作伙伴群体构成。20M 覆盖人群中的绝大多数来自渠道合作板块（包括 TPA、健康险计划、员工福利经纪人），Spring Health
              在该群体中的单人创收远低于直签雇主。获客模式以主动出击的企业级直销为主，辅以福利经纪人与 TPA 渠道引荐。
