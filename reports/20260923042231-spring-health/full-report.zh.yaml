            title: 心理健康平权监管成为企业端最大的销售催化剂
            body: >
              美国劳工部、卫生与公众服务部及财政部根据《精神卫生平价和成瘾均等法案》发布的 2024 年最终规则，要求雇主拿出实证，证明其行为健康福利与内外科保障处于同等水平——传统 EAP
              绝大多数在制度设计上就达不到该要求。这一刚性合规要求正推动大型雇主主动考察 Spring Health 以寻求替代，甚至独立于 ROI
              逻辑之外。监管东风属于结构性市场驱动力，把原本可选的福利升级转变为必须执行的法定动作。
