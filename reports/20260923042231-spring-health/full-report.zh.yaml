      - number: '5.2'
        title: 产品矩阵与临床业务流程
        blocks:
          - type: paragraph
            body: >
              Spring Health 围绕雇主福利部署模式搭建了模块化产品体系。SpringWorks 是面向雇主端的配置与数据分析平台，为 HR 管理员提供员工参与度报告、使用率数据及 ROI
              仪表盘。SpringLife 是面向会员的移动端与 Web 端应用，员工可通过该入口完成测评、预约诊疗、开展数字化练习并与 Guide AI 互动。Compass EHR 是 Spring Health
              专为行为健康量身打造的自研电子病历系统，支持在整个服务网络内实现结构化临床文书录入、成效追踪以及诊疗协同。

              Specialty Care（2023 年推出）针对重度复杂疾病——包括进食障碍、物质使用障碍（SUD）、ADHD、强迫症（OCD）及重度抑郁症——配备专科专家与个案管理，提供专项诊疗路径。这推动平台从单纯替代
              EAP 升级为全方位的行为健康管理（BHM）服务商。2022 年对 Bloom 内容的收购为 SpringLife App 补充了数字化自主疗愈内容（包括数字化认知行为疗法
              dCBT、正念冥想、减压模块），降低了轻度需求会员对即时真人看诊的依赖。

              2025 年与 Alma 的合并补齐了 C 端撮合交易层：Alma 覆盖全美 50 州的超 10,000 名独立心理咨询师资源现已接入
              SpringLife，将服务触角从直签雇主保障网络外延至无需雇主出资、寻求自费或商业医保报销就医的个人群体。
