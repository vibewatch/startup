        - 高
        - 声明符合 HIPAA 合规；声称推行 AI 零数据留存政策
        - 未披露 OCR 执法行动；须与雇主方案发起方签署 BAA
        - 索取 BAA 模板、应急响应预案及 OCR 审计记录
      - - 《联邦贸易委员会法》第 5 条（心理健康数据）
        - 与广告商 / 分析机构共享第三方数据
        - 高
        - 未知 – Spring Health 尚未公开与第三方的具体数据共享行为
        - 声明在 AI 训练中推行 VERA-MH 零数据留存政策；但未披露分析供应商的具体做法
        - 索取数据流向图及第三方数据共享披露文件
      - - 加州 Knox-Keene 法案（DMHC）
        - 加州健康险计划运营；偿付能力；申诉 / 上诉
        - 中高
        - 2025 年获批牌照；持牌即须满足合规预期
        - 已取得 Knox-Keene 牌照；受 DMHC 监管约束
        - 监测 DMHC 备案文件及潜在的申诉或执法行动
      - - 42 CFR Part 2（物质使用障碍记录保密规定）
        - 物质使用障碍（SUD）路径数据与雇主分析端共享
        - 中
        - 未知 – Spring Health 的 SUD 专科护理路径推出时间尚短
        - 专科护理 SUD 于 2023 年上线；尚未公开说明 Part 2 合规情况
        - 索取 SUD 数据处理规程及 Part 2 知情同意架构
      - - MHPAEA 网络充分性（就医准入标准）
        - 预约等待时间、地理覆盖范围、远程医疗平价
        - 中
        - Spring Health 报告等待时间 <2 天；远程医疗优先模式解决了地理准入障碍
        - JAMA 研究与平台指标证实了就医准入速度；但网络充分性仍需 NQTL 分析
