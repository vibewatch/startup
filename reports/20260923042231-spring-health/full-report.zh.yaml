companyProfile:
  summary: >
    Spring Health 是一家总部位于纽约的 AI 原生全球心理健康平台，2016 年由 CEO April Koh 与总裁 Adam Chekroud
    创立。公司提供垂直一体化心理健康技术与服务栈——包括雇主福利、SpringLife 会员入口、Guide AI 智能导航、Compass 医疗服务提供方工具、Atlas 数据分析及 Specialty Care
    专科护理；官方称全球超过 1.7 亿人可通过雇主、健康险计划及渠道合作伙伴获得 Spring Health 服务。Spring Health 在临床成效上的差异化优势，源于 2025 年《JAMA Network
    Open》同行评审研究以及 2025 年 Validation Institute 认证，两项研究均证实其能带来显著临床改善与净成本结余。公司于 2026 年 1 月宣布达成收购 Alma 的协议，2026 年上线
    Guide，并入选 TIME100 Most Influential Companies 2026。2024 年 7 月，Spring Health 完成由 Generation Investment Management 领投的
    $100M Series E 轮融资，估值达 $3.3B；公开累计融资额约 $474M。公司尚未公开披露收入与 ARR。
