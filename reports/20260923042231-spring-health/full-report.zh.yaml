  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与分析框架
        blocks:
          - type: paragraph
            body: >
              2024 年 4 月，Spring Health 完成由英国长周期影响力投资机构 Generation Investment Management 领投的 $100M Series E 融资，投后估值达到
              $3.3B。这使其成为当时美国估值最高的独立雇主心理健康福利公司，也是全球仅次于 Lyra Health（2022 年 $4.8B
              融资）的第二大心理健康独角兽。公司一直拒绝披露年经常性收入（ARR）、毛利率或任何财务指标，因此必须依赖倍数法测算估值。根据 20M 参保覆盖人数，结合 450 多家直销雇主客户与 27,000
              个渠道合作团体综合测算出的每位会员每月 $3–8（PEPM）预估费率，独立分析师推算其 ARR 约在 $130–300M 之间——如此宽的区间反映出高度的不确定性。以 Series E $3.3B
              投后估值计算，隐含的 ARR 估值倍数约为 11–25×，这与具备持久经常性雇主收入、通过同行评审证实临床 ROI、且拥有降低流失风险的合同兜底结构的高增长企业级 SaaS
              估值水平相符；但因缺乏财务透明度，目前尚无法支撑更精准的估值倍数测算。
