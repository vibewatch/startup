      - number: '3.3'
        title: 竞争护城河与风险评估
        blocks:
          - type: paragraph
            body: >
              Spring Health 构筑的防御壁垒：(1) JAMA 实证成效——2025 年刊发于《JAMA Network
              Open》的研究构成了赛道内最高规格的独立临床实证，尚无直接竞品在同等规模下取得相当的同行评审背书。(2) ROI 兜底承诺——第 3 年实现 3× ROI 的合同条款，是任何传统 EAP
              厂商无法跟进的差异化优势。(3) 精准 AI 匹配——依托大规模临床成效数据训练的自研算法，形成了「会员量增加带动匹配模型持续进化」的数据飞轮。(4) 完整替代
              EAP——唯一在单一产品内打通数字化自主照护到专科精神诊疗全路径的平台。(5) 合并 Alma——带来了离职后转入消费端市场的延续能力，截至 2026 年未见竞品能跟进复制。

              护城河侵蚀风险：(1) Lyra 于 2025 年 10 月发布「临床级 AI」，表明其正全力正面进攻 Spring Health 的精准匹配优势。(2) Optum 庞大的体量与保司协同形成捆绑销售机制，可能将
              Spring Health 挡在选购了 UnitedHealthcare 医保方案的企业合同之外。(3) Modern Health 覆盖 70 多个国家的全球网络，在争夺 Spring Health
              尚难全球覆盖的跨国雇主时可能起到决定性作用。(4) 行业层面广泛质疑数字心理健康有效性的荟萃分析（Fierce Healthcare 2025 年报道），对整个赛道形成无差别冲击，并不因 Spring
              Health 单独具备临床实证而有所幸免。
