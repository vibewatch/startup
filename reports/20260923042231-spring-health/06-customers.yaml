- id: SU003
  title: Customer Acquisition, Retention, and Competitive Displacement
  body: 'Spring Health''s primary customer acquisition channel is direct enterprise sales to HR and benefits leaders at organizations with 500+ employees. The company has disclosed a guaranteed 3× ROI commitment by Year 3 (with 2× by Year 2 and cost neutrality in Year 1)—a financially backed performance guarantee that reduces procurement risk for HR buyers and differentiates Spring Health from competitors offering outcome-tracking but no financial guarantee. This guarantee creates a selection effect: only customers with sufficient population density for statistically meaningful ROI measurement would commit, which may bias the disclosed customer base toward large employers with 2,000+ enrolled employees.

    The channel-partner route (27,000+ groups) is driven by TPA relationships (Stonebrook Risk Solutions, 2025), benefits brokers, and health plan integrations. Point32Health''s selection of Spring Health (2025) as its behavioral health benefits partner represents the most significant health plan customer win publicly disclosed, signaling that the Knox-Keene model is commercially viable.

    Customer retention signals are strong but self-reported: the URAC accreditation requirement implies ongoing quality standards maintenance; Wellstar and JPMorgan have not publicly announced a departure (as of the run date). Competitive displacement from legacy EAP vendors (Optum, Lyra as replacement rather than as de novo spend) is documented in the employer testimonials but net revenue retention rate is not disclosed.

    '
