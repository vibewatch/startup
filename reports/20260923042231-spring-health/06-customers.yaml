- dimension: figureType
  reason: 'Planned figure types (funnel, flow, matrix, cohort) were substituted with bar charts because Spring Health does not disclose funnel metrics (lead-to-customer conversion), cohort retention data, or visual process flows for customer acquisition. Bar charts effectively represent customer scale growth, outcome metrics, and evidence quality tier. No funnel data, matrix comparison data, or cohort data is available from public sources; this substitution is the most appropriate representation given the evidence available and is documented in evidenceGaps.

    '
