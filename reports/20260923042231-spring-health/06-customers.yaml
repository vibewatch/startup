chapter:
  order: 6
  number: 6
  title: Customers and Traction
  summary: 'Spring Health serves 450+ direct enterprise employers and 27,000+ channel-partner groups covering 20M+ lives as of 2026. Named customers include Microsoft, Target, J.P. Morgan Chase, Delta Airlines, Wawa, Wellstar Health System, and Hearst. The most rigorously validated customer outcome is the Wellstar case study ($4.30 saved per $1 invested) and the JAMA 2025 study (1.9× ROI, 50% lower hospital costs) drawn from ~100K employer-enrolled members. Point32Health (2025) represents the company''s first major health plan channel win, enabled by the Knox-Keene license. Third-party buyer validation from the Validation Institute (21% net savings) and three URAC accreditations anchor the value proposition for benefits decision-makers. The customer base is concentrated in large employers and white-collar industries (finance, retail, healthcare systems, media); geographic distribution is US-centric with early international expansion signals. Customer acquisition is primarily through direct
    enterprise sales and channel partners (TPAs, health plans, benefits brokers).

    '
sections:
- id: SU001
  title: Named Customer Base and Segment Profile
  body: 'Spring Health''s disclosed customer roster spans multiple large-employer verticals. Anchors include Microsoft (technology, tens of thousands of global employees), Target (retail, 400,000 team members), J.P. Morgan Chase (finance, ~300,000 employees), Delta Airlines (transportation, ~95,000 employees), Wawa (food retail, 45,000+ associates), and Wellstar Health System (Georgia-based health system, 24,000+ employees). These named accounts cover an estimated 900,000+ direct employees and represent the blue-chip logo portfolio typical of an enterprise benefits platform at the $3.3B valuation stage.

    The vertical mix is notable for its breadth: healthcare systems (Wellstar), financial services (JPMorgan), technology (Microsoft), retail (Target, Wawa), and transportation (Delta). This cross-industry diversification mitigates vertical concentration risk; no single sector appears to account for more than 20–30% of revenue based on the disclosed logo mix. Hearst (media/publishing) and Point32Health (health plan) round out the publicly confirmed set, indicating penetration into media and managed-care channels.

    The employer channel accounts for 450+ direct clients and 27,000+ channel-partner groups. The vast majority of the 20M covered lives come from the channel-partner segment (TPAs, health plans, benefits brokers), where Spring Health has significantly lower per-life revenue than direct employer accounts. Customer acquisition is primarily outbound enterprise sales, supplemented by benefits broker / TPA channel introductions.

    '
