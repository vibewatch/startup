- id: KU002
  type: risk
  title: Named customer testimonials lack specific ROI data; JAMA study population may not be representative
  body: 'Six of eight named customers have no specific outcome metric publicly disclosed—only the Wellstar case study and JAMA 2025 include quantified ROI figures. The JAMA study population (~100K employer-enrolled members) is a subset of Spring Health''s full customer base; extrapolating its 1.9× ROI to all 450+ employer clients assumes consistent clinical implementation across organizations with different workforce demographics, mental health prevalence, and engagement incentives. A benefits buyer who reads the JAMA ROI as universally applicable to their specific population may overstate the expected return.

    '
