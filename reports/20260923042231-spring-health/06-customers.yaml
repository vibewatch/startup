- id: SU002
  title: Customer Outcomes Evidence and ROI Validation
  body: 'Spring Health''s customer value proposition is anchored by four independent or semi-independent validation studies. First, the Wellstar Health System case study (published by Spring Health, 2023) documented $4.30 saved per $1 invested by Wellstar employees and their families—a 4.3× ROI—representing the most granular single-employer outcome published. Second, the JAMA Network Open 2025 study, peer-reviewed and independent, demonstrated 1.9× ROI, 50% lower hospital costs, and 5.9-week average recovery time for depression across a large employer cohort of approximately 100,000 enrolled members.

    Third, the Validation Institute 2025 certification validated 21% net savings on mental health spend across Spring Health''s employer client base—applying actuarial methods to claims data rather than self-reported surveys. Fourth, the URAC triple accreditation (clinical care, crisis programs, and wellness) provides quality-of-care validation from an independent accreditation body rather than an outcomes study.

    Platform-level metrics (disclosed by Spring Health): 92% clinical improvement rate; 95% member retention with Spring Health-recommended provider; 67% member improvement in mental health conditions (employer testimonial); 25% enrollment within first 30 days at one unnamed employer; 90% provider satisfaction rating. These are self-reported metrics whose methodology is not disclosed; the JAMA and Validation Institute studies provide independent corroboration for a subset of these claims.

    '
