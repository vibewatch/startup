  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Customer net revenue retention (NRR), annual renewal rate, and churn
    missingEvidence: Spring Health has not disclosed any NRR, renewal rate, or churn metric. Absent these metrics, the durability of the 450+ employer client base cannot be independently assessed.
    whyItMatters: Enterprise SaaS viability depends heavily on NRR. A company with 450 clients growing fast via new logos but losing existing clients at 20–30% annually would have very different economics than one with 90%+ NRR.
    diligencePath: Request cohort retention analysis by contract year, renewal waterfall, and churn attribution from data room.
    relatedTableRefs:
    - TU001
  - type: private-evidence-only
    severity: moderate
    topic: Named customer contract values, ACV, and multi-year renewal terms
    missingEvidence: No named customer has disclosed their annual contract value with Spring Health. Microsoft, Target, and JPMorgan are among the world's largest employers; their actual PEPM rates and ACV with Spring Health are commercially sensitive and not disclosed.
    whyItMatters: Revenue concentration in top accounts affects valuation and risk; if top 5 accounts = 30%+ of ARR, churn of even one would materially affect financial performance.
    diligencePath: Request top-10 account revenue concentration analysis from data room.
  - type: missing-source
    severity: moderate
    topic: JAMA study data reproducibility across diverse employer populations
    missingEvidence: The JAMA 2025 study is observational and may reflect selection bias (engaged members have better outcomes). No randomized controlled trial with a pre-registration has been published for Spring Health's clinical model. Stat News and Fierce Healthcare have raised these methodological concerns.
    whyItMatters: If the ROI is not reproducible across geographically dispersed, lower-utilization employers (the majority of the 450+ base), the JAMA study overstates the expected return for the average customer.
    diligencePath: Request break-out of JAMA study by employer size, vertical, and utilization rate cohort. Commission independent actuarial review of full customer population outcomes.
    relatedQuestionRefs:
    - QU006
