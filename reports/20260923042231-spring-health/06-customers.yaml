callouts:
- id: KU001
  type: insight
  title: JAMA and Validation Institute provide the strongest independent customer ROI evidence
  body: 'Spring Health is unusual among employer mental health platforms in having two independent validation studies—JAMA Network Open (peer-reviewed, 2025) and the Validation Institute actuarial certification (2025)—that corroborate company-stated ROI claims. Most competitors rely on internal studies or self-reported satisfaction metrics. The existence of independent, methodologically distinct validations (RCT-style clinical study vs. actuarial claims analysis) significantly de-risks the customer value proposition for enterprise procurement teams that require evidence-based benefit selection.

    '
  claimRefs:
