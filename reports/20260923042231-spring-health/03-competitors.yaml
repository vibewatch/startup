- id: KP002
  type: risk
  title: Lyra's 3× larger provider network and AI launch are material competitive threats
  body: 'Lyra Health''s 30,000+ provider network is three times the size of Spring Health''s 10,000+. For large enterprise buyers who prioritize access breadth over precision matching, Lyra may win on network size alone. Lyra''s October 2025 clinical-grade AI launch directly attacks Spring Health''s precision AI differentiation narrative. If Lyra produces peer-reviewed evidence for its AI model within 12-18 months, Spring Health''s clinical moat narrows significantly. This is the most time-sensitive competitive risk in the portfolio.

    '
