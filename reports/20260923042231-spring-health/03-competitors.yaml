- id: KP003
  type: risk
  title: Optum's bundled insurer relationships are a structural displacement barrier
  body: 'Optum Behavioral Health''s EAP and managed care products are bundled with UnitedHealthcare health plan contracts covering tens of millions of employees. When an employer''s health plan is through UHC, behavioral health benefits may be auto-included in the contract— creating a bundled purchasing barrier that Spring Health''s superior outcomes cannot always overcome. This is particularly acute in mid-market employers where CFOs default to the bundled UHC offer rather than evaluating standalone digital-first platforms.

    '
