callouts:
- id: KP001
  type: strength
  title: JAMA validation + guaranteed ROI is Spring Health's most defensible moat
  body: 'No Tier 1 digital competitor (Lyra, Modern Health) offers both a peer-reviewed JAMA- published outcomes study and a contractual ROI guarantee. This two-part evidence stack converts behavioral health from a compliance cost to a CFO-quantifiable investment—an enterprise buying argument that competitors cannot quickly replicate without generating equivalent clinical evidence. Lyra''s AI launch signals awareness of this moat; monitoring whether Lyra commissions a comparable JAMA study should be a key competitive watch indicator.

    '
