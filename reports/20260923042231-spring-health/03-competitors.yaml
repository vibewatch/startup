- id: SP002
  title: Head-to-Head Competitive Comparison
  body: 'Lyra Health (primary competitor): Founded 2015, HQ Burlingame, CA. Largest digital MH competitor by provider network (30,000+ vs. Spring Health''s 10,000+). Serves 20M+ people across large enterprise clients including Facebook/Meta, Uber, eBay, and Morgan Stanley. Last known valuation: $4.8B (2022 Series F, $235M raised). In 2025, Lyra launched a clinical-grade AI platform, acquired Bend Health (pediatric focus), and formed a Workday Wellness integration partnership. Lyra covers employers internationally (Switzerland office). Key weakness: narrower clinical evidence base—no JAMA equivalent publication as of 2026—and therapy-focused origin limits the breadth of Spring Health''s coaching + EAP + specialty care stack.

    Modern Health (secondary competitor): Founded 2017, HQ San Francisco. Backed by Kleiner Perkins, Founders Fund, John Doerr, Y Combinator, Battery Ventures. $1.17B valuation, raised $170M+. Founded by Alyson Watson; fastest entirely female-founded US company to unicorn status. Coaching-first approach with multi-modal support (coaching, digital, group); serves global employers with international provider reach in 70+ countries. Key weakness: coaching- forward positioning may limit appeal for high-acuity cases and psychiatric needs.

    Optum Behavioral Health (dominant incumbent): Part of UnitedHealth Group (NYSE: UNH, ~$500B market cap). Manages behavioral health benefits for 30M+ commercial plan members via the Emotional Wellbeing Solutions EAP and managed care carve-out. Integrated with OptumRx, UHC, and major hospital networks. Key weaknesses: low utilization (EAP-model), limited digital engagement, and conflict-of-interest perception from insurer ownership.

    Talkspace: Public company (NASDAQ: TALK). Revenue ~$170M (2024). Teletherapy-only, no psychiatry or coaching in the employer bundle. Market cap ~$300M. Has struggled with margin pressure and therapist churn. FTC investigation (2023-2024) into data privacy practices adds adverse regulatory overhang. Not a full-spectrum EAP replacement.

    '
