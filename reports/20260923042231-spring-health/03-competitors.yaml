- id: SP003
  title: Competitive Moat and Risk Assessment
  body: 'Spring Health''s defensible advantages: (1) JAMA-validated outcomes—the 2025 JAMA Network Open publication is the highest tier of independent clinical proof in the sector; no direct competitor has equivalent peer-reviewed validation at this scale. (2) Guaranteed ROI commitment—3× ROI by Year 3 is a contractual differentiation no legacy EAP provider matches. (3) Precision AI matching—proprietary algorithm trained on clinical outcomes at scale; this creates a data flywheel where more members improve the matching model. (4) Full EAP replacement—the only platform with care pathways from digital self-care through specialist psychiatry in one integrated product. (5) Alma combination—adding consumer-market continuity that no competitor has replicated as of 2026.

    Moat erosion risks: (1) Lyra''s AI launch (October 2025) with "clinical-grade AI" signals that Lyra is aggressively attacking Spring Health''s precision matching advantage. (2) Optum''s scale and insurer integration create a bundled purchasing dynamic that could block Spring Health from UnitedHealth-covered employer contracts. (3) Modern Health''s international reach (70+ countries) may be decisive for multinationals that Spring Health cannot yet serve globally. (4) Meta-analyses questioning digital mental health efficacy broadly (Fierce Healthcare 2025) create category-level headwinds that do not respect Spring Health''s specific clinical validation.

    '
