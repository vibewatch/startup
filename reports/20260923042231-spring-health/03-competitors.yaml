  rows:
  - - JAMA-validated outcomes (2025)
    - Lyra or competitor commissions equivalent peer-reviewed study within 12-18 months
    - Medium
    - Confirm Spring Health has additional studies in pipeline; check JAMA editorial calendar for competitor submissions
  - - Precision AI provider matching
    - Lyra's Oct 2025 'clinical-grade AI' launch directly attacks this claim
    - High
    - Request matching algorithm performance benchmarks; verify JAMA study used precision matching vs. standard matching
  - - Guaranteed 3× ROI by Year 3
    - Contractual ROI guarantee could trigger payout if economy weakens or utilization drops
    - Medium-High
    - Request actuarial analysis of guarantee exposure in data room; confirm reserve policy
  - - Alma combination (consumer continuity)
    - No competitor has replicated this; but Lyra/Modern Health could build similar marketplace
    - Low-Medium
    - Monitor Lyra and Modern Health M&A pipeline; confirm Alma retention data post-combination
  - - 10,000+ provider network quality
    - Lyra has 30,000+ providers—3× larger; quality dilution risk in scaling
    - High
    - Request provider credentialing standards, network attrition rate, and patient satisfaction NPS by provider tier
  - - Full EAP replacement capability
    - Optum bundles BH with health plan contracts; large employers may not switch even with better outcomes
    - High
    - Review number of Spring Health wins against Optum-enrolled employer accounts; confirm competitive win rate
  - - Knox-Keene health plan contracting
    - Health plan market is new for Spring Health; incumbents (Magellan, Beacon, Optum) have 20+ years of NCQA accreditation history
    - Medium
    - Confirm CA health plan contract pipeline post-Knox-Keene; request NCQA accreditation timeline
