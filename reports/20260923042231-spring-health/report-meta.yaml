  headquarters: New York, NY
  productSummary: |
    Spring Health's product suite spans five layers: (1) employer benefits administration with
    smart matching and employer analytics; (2) Guide AI — proactive AI-driven mental health
    navigation that identifies at-risk members and prompts evidence-based care pathways before
    crisis; (3) Atlas — longitudinal outcomes tracking platform; (4) Compass — provider-facing
    EHR and clinical documentation tool; (5) Specialty Care — substance use disorder (SUD) and
    complex mental health programs. The Alma acquisition adds a consumer therapist marketplace
    with a large in-network therapist base. Spring Health also provides SpringLife (member-facing
    app, self-guided tools). The guaranteed ROI model remains the primary commercial
    differentiation.
  customerFocus: >-
    B2B enterprise employers and health plans; more than 450 direct employer accounts, plus channel-partner distribution
    and consumer access via Alma
  businessModel: >-
