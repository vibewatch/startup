companyProfile:
  summary: |
    Spring Health is a New York City–based AI-native global mental health platform founded in
    2016 by CEO April Koh and President Adam Chekroud. The company offers a vertically integrated
    mental health stack — employer benefits, SpringLife member access, Guide AI navigation,
    Compass provider tooling, Atlas analytics, and Specialty Care — and says more than 170 million
    people worldwide can access Spring Health through employers, health plans, and channel
    partners. Spring Health's clinical outcomes differentiation is anchored by a 2025 JAMA
    Network Open peer-reviewed study and a 2025 Validation Institute certification confirming
    meaningful clinical improvement and net savings. The company announced an Alma acquisition
    agreement in January 2026, launched Guide in 2026, and was named to TIME100 Most Influential
    Companies 2026. Spring Health raised $100M at a $3.3B valuation in July 2024 (Series E,
    led by Generation Investment Management); disclosed total funding is approximately $474M.
    Revenue and ARR are not publicly disclosed.
  foundedDate: '2016-01-01'
