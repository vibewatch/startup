summary:
  headline: |
    Spring Health is an AI-native mental health platform with unusually strong clinical proof and
    broad enterprise distribution. The company’s 2026 refresh reflects a larger access footprint,
    a completed Alma acquisition path, and continued product expansion through Guide AI, but it
    still lacks public disclosure on ARR, retention, gross margin, and the liability/compliance
    details that would let investors underwrite a precise valuation. The result is a track
    recommendation for investors who want exposure to the category leader but need more diligence
    before sizing an entry.
