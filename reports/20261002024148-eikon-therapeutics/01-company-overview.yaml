company:
  name: "Eikon Therapeutics"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Eikon Therapeutics, Inc. (Nasdaq: EIKN) is a clinical-stage biopharmaceutical company applying proprietary single-molecule tracking (SMT) microscopy alongside licensed clinical assets to oncology drug discovery and development. Founded in Hayward, California and now headquartered in Millbrae, Eikon advanced its lead licensed TLR7/8 dual-agonist EIK1001 into Phase 2/3 trials and PARP1-selective inhibitor EIK1003 into Phase 1/2 trials, while maintaining $596.0 million in cash, cash equivalents, and marketable securities as of March 31, 2026."
sections:
  - id: "corporate-identity-and-leadership"
    title: "Corporate Identity, Platform Foundation, and Governance"
    body: "Eikon Therapeutics, Inc. is a clinical-stage biopharmaceutical company dedicated to developing innovative medicines for serious unmet medical needs, with an initial strategic focus on oncology. Founded in California, the company initially established corporate operations in Hayward before moving into its primary headquarters facility in Millbrae in April 2025. Eikon's foundational scientific platform applies super-resolution live-cell microscopy and single-molecule tracking (SMT) to measure the real-time movement and interactions of individual proteins inside living cells, integrating advanced optics, automated robotics, medicinal chemistry, and high-performance computing.\n\nExecutive leadership is headed by Chief Executive Officer and Board Chair Roger M. Perlmutter, M.D., Ph.D., formerly Executive Vice President and President of Merck Research Laboratories. The senior management team includes Chief Medical Officer Roy Baynes, M.D., Ph.D. (former SVP and Head of Global Clinical Development at Merck), Chief Financial Officer Alfred 'Freddie' Bowie, Jr., Ph.D. (formerly VP of Corporate and Business Development at Veracyte), Chief Scientific Officer Daniel Anderson, Ph.D. (formerly VP of Biology at Recursion Pharmaceuticals), and Chief Technical Officer Russ Berman (formerly VP of Engineering at Pacific Biosciences). Governance and early institutional backing are closely tied to founding venture investors, with key board and insider trading roles held by The Column Group, Lux Capital, and Foresite Capital."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
      - "CO013"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-balance-sheet"
    title: "Financing History, Public Listing, and Liquidity Position"
    body: "Eikon Therapeutics raised over $668 million across its early private venture rounds, including a $517.8 million Series B financing closed in early 2022 led by T. Rowe Price Associates alongside sovereign wealth and crossover institutions including CPP Investments, EcoR1 Capital, UC Investments, ADIA, StepStone Group, and General Catalyst. The company later completed a public listing on the Nasdaq Global Market under the ticker EIKN. Effective June 26, 2026, Eikon was officially reconstituted into the Russell 3000 Index, broadening institutional index ownership among managers including FMR LLC, BlackRock, and Merck & Co.\n\nFrom a balance sheet perspective, Eikon reported holding $596.0 million in cash, cash equivalents, and marketable securities as of March 31, 2026. Management has guided that this liquidity position is expected to fund planned clinical and operational activities into the second half of 2027. First-quarter 2026 research and development expenses reached $70.0 million, up 24% year-over-year from $56.6 million in the prior-year period, driven by expanding late-stage clinical trials and a $5.0 million development milestone paid to licensor Impact Therapeutics (Shanghai) Inc. First-quarter general and administrative expenses were $17.3 million, yielding an overall quarterly net loss attributable to common stockholders of $83.0 million."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
    tableRefs:
      - "TO001"
      - "TO003"
  - id: "pipeline-evolution-and-milestones"
    title: "Clinical Pipeline Evolution and Strategic Development Milestones"
    body: "Eikon's corporate strategy combines internally discovered assets derived from its proprietary SMT microscopy platform with clinically advanced in-licensed assets. The clinical pipeline is led by three priority oncology programs: EIK1001, EIK1003, and EIK1005. Lead asset EIK1001 is an investigational, systemically administered dual-agonist of Toll-like receptors 7 and 8 (TLR7/8). In its Phase 2 TeLuRide-005 trial in first-line stage 4 non-small cell lung cancer (NSCLC) in combination with pembrolizumab and chemotherapy, EIK1001 demonstrated a 63.1% objective response rate (ORR) and a 90.8% disease control rate (DCR) across 65 efficacy-evaluable patients as of the May 4, 2026 data cutoff.\n\nEIK1003 is an investigational, highly selective PARP1 inhibitor licensed from Impact Therapeutics designed to spare PARP2 signaling to reduce hematologic toxicity. In the Phase 1/2 EIK1003-001 study, EIK1003 achieved a 14.3% ORR as monotherapy (Cohort 1A, n=49) and a 24.5% ORR in combination with weekly paclitaxel (Cohort 1C, n=53) across advanced solid tumor cohorts. The third lead program, EIK1005, is an internally discovered WRN helicase inhibitor targeting microsatellite instability-high (MSI-H) tumors that commenced Phase 1/2 clinical dosing in February 2026. However, Eikon continues to incur substantial operating cash outflows and recurring quarterly net losses ($83.0 million in Q1 2026), and corporate disclosures maintain warnings that ongoing operations will require substantial additional financing before commercialization."
