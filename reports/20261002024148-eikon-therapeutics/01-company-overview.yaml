callouts:
  - calloutType: "insight"
    title: "Strategic Balance Between Platform Chemistry and In-Licensed Clinical Assets"
    body: "While Eikon was founded on Nobel Prize-winning single-molecule tracking microscopy to measure protein dynamics in live cells, its most advanced clinical milestones (EIK1001 and EIK1003) were in-licensed. The advancement of internally optimized WRN inhibitor EIK1005 into Phase 1/2 represents the first clinical test of its proprietary platform-derived chemistry."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO013"
      - "CO014"
  - calloutType: "risk"
    title: "Commercial Runway Dependency and High Capital Intensity"
    body: "With a quarterly net loss of $83.0 million and an active cash position of $596.0 million, Eikon operates with approximately six quarters of cash runway extending into second-half 2027. Clinical success in late-stage trials is required to maintain valuation and access additional public or partnered capital."
    claimRefs:
      - "CO009"
      - "CO011"
      - "CO016"
