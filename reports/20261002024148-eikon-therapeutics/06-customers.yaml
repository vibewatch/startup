company:
  name: "Eikon Therapeutics"
chapter:
  number: 6
  title: "Customers"
  summary: "Eikon remains a clinical-stage biopharmaceutical company rather than a commercial customer business: the reviewed evidence identifies trial participants, investigators, and scientific audiences, but no named paying customers or commercial adoption metrics. Trial enrollment and program progression provide the only supportable adoption proxies, while retention, pricing, procurement, and concentration remain material diligence gaps."
sections:
  - id: "stakeholder-segmentation"
    title: "Stakeholders, users, and future payers"
    body: >-
      Eikon is not presently evidenced as a commercial customer business. Company-issued material
      describes a late-stage clinical biopharmaceutical developer, while an independent competitive
      profile states that Eikon is not yet selling a drug. The relevant current populations are
      therefore clinical-trial participants who receive investigational therapies, investigators and
      sites that execute protocols, and scientific or regulatory audiences that evaluate resulting
      evidence. Eikon's recruiting page identifies patients as the intended beneficiary, but that
      mission statement is not proof of a paying account. Likewise, the official homepage and
      Foresite's portfolio profile emphasize biology, clinical-stage programs, and treatment discovery,
      not a marketed service. Future prescribers, provider systems, and payers remain prospective
      stakeholders rather than demonstrated customers in this source set.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
  - id: "clinical-adoption"
    title: "Clinical adoption proxies"
    body: >-
      Because there is no disclosed marketed product, adoption must be measured narrowly through
      enrollment and trial progression rather than accounts, purchases, or utilization revenue.
      TeLuRide-005 had completed enrollment by the March 2026 update. By August, an independent data
      monitoring committee had selected a TeLuRide-006 dose for expansion and recommended that the
      study continue, while TeLuRide-008 had dosed its first patient. EIK1003 Cohort 1D had completed
      site selection and was enrolling, and EIK1005 had dosed its first Phase 1/2 participant in
      January. Seven accepted ESMO abstracts indicate scientific dissemination across four candidates,
      not customer demand. The disclosures do not provide a consolidated participant denominator,
      active-site count, repeat-use cohort, or comparable utilization series, so the trajectory is a
      milestone chronology rather than a commercial growth curve.
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU002"
  - id: "named-proof"
    title: "Named proof is clinical, not commercial"
    body: >-
      No retained source identifies a named paying customer, production deployment, purchase volume,
      commercial contract, or customer outcome. The strongest named proof consists instead of
      identified clinical programs and their participant populations. The company-issued release
      distributed by Nasdaq describes pembrolizumab-containing study regimens, but it does not disclose
      a customer relationship, economic terms, or a commercial commitment with pembrolizumab's owner;
      those facts should not be inferred. Toarn separately explains why standard B2B review platforms
      are not applicable and warns that available public sentiment evidence is thin. The assigned
      Zippia page is also unsuitable as customer proof because its disclosed data provenance concerns
      employment data rather than product use. The named-proof table therefore labels every row as a
      clinical proxy and explicitly avoids converting trial activity into customer validation.
    claimRefs:
      - "CU012"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
  - id: "durability-and-concentration"
    title: "Durability, expansion, and concentration remain unmeasured"
    body: >-
      The reviewed materials do not report product revenue, customer count, net or gross retention,
      churn, renewal rates, contract duration, cohort expansion, satisfaction, pricing, or procurement
      cycle. They also do not identify top-customer exposure, channel concentration, or commercial
      partner dependence. Trial continuation and additional cohorts demonstrate ongoing clinical
      execution, but they are not substitutes for renewal or land-and-expand evidence. This distinction
      matters because the eventual commercial pathway will depend on approval, prescribing behavior,
      reimbursement, access, and supply arrangements that are not established in the assigned pool.
      The journey map separates observed research and trial stages from explicitly prospective
      regulatory and commercial stages; it should not be read as a forecast of approval or adoption.
      Diligence should seek private contracting, market-access, and concentration schedules before
      attributing customer durability to the clinical milestones.
    claimRefs:
      - "CU013"
      - "CU016"
    figureRefs:
      - "FU001"
