evidenceGaps:
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: Audited exact headcount breakdown across administrative, clinical, and engineering functions for Q3 2026.
    whyItMatters: >-
      Enables precise estimation of fixed personnel burn rate vs. clinical contract research organization (CRO) trial
      expenditures.
    diligencePath: Review subsequent Form 10-Q filing or query investor relations regarding current full-time employee headcount.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-enumeration-scope
    missingEvidence: >-
      Comprehensive roster of all corporate vice presidents and scientific advisory board members beyond top executive
      officers.
    whyItMatters: >-
      Identifies potential bench strength and retention risks across specialized microscopy optics and computational
      chemistry divisions.
    diligencePath: Review annual proxy statement (Def 14A) or full Form 10-K exhibit listings for complete executive roster.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-enumeration-scope
    missingEvidence: >-
      Exhaustive institutional share registry detailing exact share counts, warrants, and lock-up agreements across all
      pre-IPO syndicate funds.
    whyItMatters: Clarifies secondary market overhang and institutional lock-up expiration timing on post-IPO float dynamics.
    diligencePath: Aggregate Schedule 13D/13G filings and subsequent 13F quarterly institutional disclosure records.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Indication-level patient populations, geography, treatment eligibility, expected price, duration, competitive
      share, and probability-adjusted uptake needed for TAM, SAM, and SOM.
    whyItMatters: >-
      Without these denominators, a product-market estimate would create false precision and could overstate the
      economic opportunity.
    diligencePath: >-
      Obtain management's indication-level commercial model and reconcile it to epidemiology, treatment guidelines,
      comparable launch curves, and payer research.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-and-payer-gap
    missingEvidence: >-
      External platform customers, partnering discussions, contract economics, budget owners, procurement criteria,
      reimbursement assumptions, and willingness-to-pay evidence.
    whyItMatters: >-
      These facts determine whether the platform has an external market and whether eventual medicines can convert
      clinical benefit into reimbursed demand.
    diligencePath: >-
      Review data-room contracts and pipeline, interview business-development leadership and prospective partners, and
      commission indication-specific payer research.
    relatedQuestionRefs:
      - QM005
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: valuation-dispersion
    missingEvidence: >-
      A date-aligned capitalization table and audited quarter-end cash reconciliation covering share count, restricted
      cash, debt, commitments, and post-period financing.
    whyItMatters: >-
      Market capitalization and cash snapshots use different dates and cannot establish enterprise value, runway, or
      operating-market demand without reconciliation.
    diligencePath: >-
      Reconcile SEC filings and transfer-agent share counts to same-day market data and management's cash runway model
      before using valuation ratios.
    relatedQuestionRefs:
      - QM004
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: platform-clinical-validation
    missingEvidence: >-
      Phase 1/2 clinical efficacy, biomarker response data, and safety characterization for Eikon's first internally
      discovered SMT candidate EIK1005.
    whyItMatters: >-
      Until internally derived candidates demonstrate human therapeutic activity, Eikon's clinical valuation remains
      driven by in-licensed assets rather than proof of platform discovery superiority.
    diligencePath: >-
      Review preliminary pharmacokinetic and dose-escalation results scheduled for presentation at ESMO Congress in
      October 2026.
    relatedQuestionRefs:
      - QP007
  - type: private-evidence-only
    severity: material
    topic: pricing-and-unit-economics
    missingEvidence: >-
      Product pricing, realized gross-to-net assumptions, customer or account economics, launch sales-cycle assumptions,
      CAC, and payback are not disclosed in the assigned public evidence.
    whyItMatters: Without commercial assumptions, revenue quality, gross margin, and sales efficiency cannot be underwritten.
    diligencePath: >-
      Obtain indication-level launch models, payer and channel assumptions, CMC costs, and account-level commercial
      forecasts from management.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: >-
      The assigned evidence does not establish debt, lease, covenant, collateral, maturity, or remaining
      licensed-program obligation schedules.
    whyItMatters: Headline liquidity may overstate deployable capital if cash is restricted or contractual claims are material.
    diligencePath: Review the latest filed balance-sheet notes, debt and lease agreements, and all milestone and royalty schedules.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: cash-runway
    missingEvidence: No program-level monthly cash forecast or Q2 cash-flow statement was present in the assigned pool.
    whyItMatters: >-
      Management's runway date cannot be independently sensitivity-tested against trial timing, enrollment, milestone,
      and manufacturing scenarios.
    diligencePath: Obtain the Q2 cash-flow statement and management's monthly base, upside, and downside forecasts by program.
    relatedQuestionRefs:
      - QI005
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: clinical-efficacy
    missingEvidence: >-
      Patient-level response data and hazard ratios from the unblinded DMC interim analysis of TeLuRide-006 remain
      confidential.
    whyItMatters: >-
      Binary clinical trial efficacy in melanoma represents the primary driver of near-term enterprise value and
      regulatory approval.
    diligencePath: >-
      Review public presentations of TeLuRide-006 registrational findings at upcoming medical congresses or regulatory
      filings.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: platform-validation
    missingEvidence: >-
      Peer-reviewed publications or public disclosures directly tracing a clinical-stage molecule from de novo SMT
      screening into human trials.
    whyItMatters: >-
      Validates whether the proprietary optical microscopy platform can consistently generate viable clinical drugs
      independently of in-licensing.
    diligencePath: >-
      Request translational drug discovery case studies and target-to-lead campaign metrics under confidential
      diligence.
    relatedQuestionRefs:
      - QE001
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: >-
      Commercialization plans covering pricing, reimbursement, procurement cycles, expected prescribing behavior, and
      repeat-use or persistence assumptions.
    whyItMatters: Without these inputs, trial progress cannot be translated into durable commercial adoption or expansion.
    diligencePath: >-
      Request target product profiles, payer research, market-access workplans, pricing studies, and any
      launch-readiness dashboards from management.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: concentration-and-expansion
    missingEvidence: >-
      Counterparty schedule identifying trial-supply dependencies, future channels, procurement constraints, and modeled
      top-account or payer concentration.
    whyItMatters: Concentrated access or supply dependencies could impair launch execution even if clinical programs succeed.
    diligencePath: >-
      Review material agreements, clinical-supply contracts, channel strategy, payer concentration scenarios, and
      procurement lead-time assumptions.
    relatedQuestionRefs:
      - QU010
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A verified roster of named paying customers, production deployments, contract dates, commercial outcomes, and
      reference permissions.
    whyItMatters: >-
      The public pool supports clinical milestones only and cannot establish real commercial adoption or customer
      reference quality.
    diligencePath: >-
      Ask management for a customer or launch-partner reference list and validate each entry directly with the named
      counterparty.
    relatedQuestionRefs:
      - QU004
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: legal-and-regulatory-records
    missingEvidence: >-
      Primary court, regulator, patent-office, privacy, sanctions, enforcement, and inspection records for relevant
      jurisdictions.
    whyItMatters: The assigned sources cannot establish incident history, approval posture, clean title, or absence of enforcement.
    diligencePath: >-
      Search primary agency and court systems, reconcile entity aliases, and obtain a management representation schedule
      with counsel confirmation.
    relatedQuestionRefs:
      - QR002
      - QR007
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: ip-and-license-risk
    missingEvidence: >-
      Executed license agreements, amendments, patent schedules, assignment chain, territory and field rights, payment
      obligations, encumbrances, and claim-level freedom-to-operate analysis.
    whyItMatters: Rights defects or economic burdens could constrain development, commercialization, partnering, or asset value.
    diligencePath: >-
      Review the data-room contract set and patent-family schedule with specialist IP counsel before underwriting
      program ownership or economics.
    relatedQuestionRefs:
      - QR004
      - QR007
    relatedTableRefs:
      - TR001
      - TR003
  - type: private-evidence-only
    severity: material
    topic: operations-quality-and-security
    missingEvidence: >-
      Clinical site performance, protocol deviations, inspection findings, CMC comparability, supplier concentration,
      batch history, incident logs, cybersecurity controls, uptime, backup, and disaster-recovery testing.
    whyItMatters: >-
      Public milestone announcements do not establish the reliability or resilience required for parallel global
      development programs.
    diligencePath: >-
      Obtain quality-system dashboards, vendor and supplier maps, audit reports, business-continuity tests, security
      assurance, and management remediation logs.
    relatedQuestionRefs:
      - QR003
      - QR006
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: liquidity-and-financing
    missingEvidence: >-
      A reconciled cash-flow forecast, committed clinical spend, covenant and financing terms, milestone obligations,
      and downside runway sensitivities.
    whyItMatters: >-
      Cash and securities, accounting loss, and quarter-end balance changes do not by themselves measure cash burn or
      financing need.
    diligencePath: >-
      Reconcile quarterly cash flows to the development plan and model base and downside financing dates under
      enrollment, trial, and milestone scenarios.
