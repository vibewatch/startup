      - number: '7.4'
        title: 缓解措施、监控指标与投资逻辑破损触发点
        blocks:
          - type: paragraph
            body: >-
              披露的最有效临床风险缓解举措为分阶段治理：独立委员会在扩增试验前对 TeLuRide-006
              进行审阅并敲定了给药方案。但这无法规避临床终点失败的风险；若注册临床证据未能展现出具备临床意义的获益，或安全性问题阻碍了既定联合用药方案，原投资逻辑即告破损。若披露的流动资金或指引无法在不借助高稀释性融资的前提下支撑现有研发计划至少
              12
              个月，融资风险将迅速激化。许可风险方面，若尽调发现缺失特定适应症领域或地域权利、背负过重义务或存在未解决的自由实施（FTO）问题，也将击碎投资逻辑。运营风险则需数据室底层证据核实：包括临床试验入组与脱落情况、核查历史、CMC
              可比性、供应商集中度、事故日志、容灾备份及安全合规控制。在审阅上述记录前，风险缓解成熟度只能暂时搁置观察，不可直接预设成立。
