      - CE005
      - CE008
      - CE009
  - id: FU001
    title: 从既有实据到前瞻预期的利益相关方链条
    type: journey-map
    summary: 现有实据仅能支撑科研推进与临床试验落地，审评审批获批与商业化落地仍属前瞻预期。
