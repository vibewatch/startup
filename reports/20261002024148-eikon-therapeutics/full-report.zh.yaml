            body: >-
              所给证据支持的是“尚未产生收入”的判断，无法证明存在成熟的收入模式。Trendlyne 报道 2026 年 6 月季度收入为 $0 million，Seeking Alpha 显示 2026
              财年的市场一致预期收入为 $0.00 [CI001, CI002]。两个平台均未确立产品定价、客户合同、合作款项、特许权使用费或按业务拆分的已确认收入。Eikon
              自身的公告主要阐述临床管线与开支，而非商业销售。因此，无法从公开证据中计算出
              ARR、GMV、获客成本、回本周期及毛利率，这些指标应明确列为证据缺口，切忌生硬套用软件公司分析模型。未来任何产品销售、技术许可、里程碑款项或特许权收益均具或有性质，只有拿到具体协议证据，才能纳入投资判断。
