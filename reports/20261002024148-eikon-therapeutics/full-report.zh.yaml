      - number: '8.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 投资建议立场：列入观察，有待关键临床验证
            body: >-
              上市后 Eikon 估值从 $3.6B 骤降至不足 $1.0B，大幅降低了长期生物技术投资者的入场倍数风险。但鉴于单季度净亏损逼近 $88.4M，且核心资产 EIK1001 在晚期黑色素瘤与 NSCLC
              中具有显著的非此即彼风险特征，在独立注册临床数据证实其治疗窗之前，仍应暂缓配置资本。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
          - type: callout
            title: 流血轮重定价阴影与资金耗尽时间线
            body: >-
              Eikon 于 2025 年 2 月完成的 Series D 轮融资涉及对 Series B-1 和 Series C-1 股份以每股 $5.84 进行流血轮重定价。尽管 2026 年 2 月的 IPO
              募资总额达 $381.2M，但若无新增融资，以目前每年 $350M+ 的年化运营开支速率测算，现有的 $531.2M 现金储备将在 2027 年底前完全耗尽。
