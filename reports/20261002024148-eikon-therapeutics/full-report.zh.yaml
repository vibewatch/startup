  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              可投资市场的边界应限定在肿瘤药物研发以及未来的成药销售或商业合作收益。Eikon 明确初期重心为肿瘤学，一方面基于单分子追踪开发自研疗法，另一方面通过外部引进补充管线。这使得宽泛的“AI
              制药”测算只能视作相邻领域，而非可靠的收入来源：现有留存资料未显示 Eikon
              向外部客户销售软件、显微成像通量、数据或平台使用权。因此，相关替代方案包括传统药物发现、同机制的竞品临床资产、其他引进管线，以及药企买方资助其他肿瘤候选药物的决定。被纳入公开市场指数属于资本市场通道，不能证明终端市场存在真实需求。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM014
