      - number: '3.3'
        title: 商业化模式、资本护城河与替代风险
        blocks:
          - type: paragraph
            body: >-
              Eikon 的商业化路径与 SaaS 或技术生物平台授权同行截然不同。Eikon
              将其高通量单分子成像平台作为重资产仪器完全在内部运转，不向外部药企合作伙伴销售任何软件订阅、仪器设备或平台分级使用权。其商业价值的兑现，完全依赖将内部候选药物推进临床试验、冲刺监管批准或最终实现并购退出。截至
              2026 年 6 月 30 日，公司持有现金、现金等价物及有价证券 $531.2 million；在 2026 年 2 月完成 $381 million 的纳斯达克 IPO 之后，管理层预计现金跑道可维持至
              2027 年下半年。尽管如此，金融分析师仍指出其面临显著的被替代与股权稀释风险：2026 年 Q2 季度研发支出达 $75.5 million，而 EIK1001 针对黑色素瘤与 NSCLC 的关键 Phase
              2/3 注册试验读数要到 2027 年才会揭晓。
