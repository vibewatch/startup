      - number: '2.3'
        title: 买方、用户与支付方图谱
        blocks:
          - type: paragraph
            body: >-
              所获资料支持的是临床开发模式，而非传统客户转化漏斗。患者与临床医生是获批药物的最终使用者或受益者，而目前由 Eikon
              承担研发开支，资金方提供资本。潜在药企合作方或授权对象未来可能成为交易对手，但留存证据未指明任何平台客户、合同价格、采购负责人、医保报销路径或外部平台收入。在公司内部，药物发现科学家与临床团队是平台的使用者，管理层与董事会负责分配研发资金。区分这一差异非常关键，因为投资者认购、指数纳入以及分析师目标价虽能改善融资条件，却不能证明产品已被采纳，也不代表支付方愿意为药品提供报销。
