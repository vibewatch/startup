      - number: '3.2'
        title: 管线差异化、靶点特征与临床竞争
        blocks:
          - type: paragraph
            body: >-
              Eikon 临床管线面临的直接竞争主要集中在靶向肿瘤免疫及 DNA 损伤修复通路。在实体瘤领域，领跑临床资产 EIK1001 属于全身给药的 TLR 7/8 双重激动剂，旨在激活天然免疫与获得性免疫，目前正处于
              Phase 2/3 临床阶段，联合 pembrolizumab 评估治疗晚期黑色素瘤（TeLuRide-006）及 4 期非小细胞肺癌（TeLuRide-005 和 TeLuRide-008）。在 PARP
              抑制剂赛道，Eikon 推进 EIK1003 以及具备中枢神经系统（CNS）穿透力的 EIK1004，两款候选药均为避开 PARP2 的选择性 PARP1 抑制剂，设计上旨在规避第一代 pan-PARP
              广谱抑制剂的血液学毒性，并实现与 paclitaxel 等化疗药物接近全剂量的联合用药。与此同时，Eikon 首款平台自研候选分子 EIK1005（靶向 MSI-H 肿瘤的 WRN 解旋酶抑制剂）于 2026 年
              1 月进入 Phase 1/2 剂量递增阶段，标志着其面对合成致死赛道竞品时，正式拉开了临床平台验证的序幕。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
