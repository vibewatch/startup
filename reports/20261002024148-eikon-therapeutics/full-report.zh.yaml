      - number: '5.2'
        title: 信息学基础设施、AI/ML 工具与数据自动化
        blocks:
          - type: paragraph
            body: >-
              持续进行超分辨率显微成像产生了海量图像数据集，必须由稳健的信息学生态系统与计算流水线来承载 [CE002, CE005]。Eikon 的数字化架构将 Dotmatics、CDD Vault
              等商用实验室信息管理系统（LIMS）和电子实验记录本（ELN），与 Mosaic 等化合物样品库存管理系统相打通 [CE005, CE006]。下游分析处理依托企业级数据湖和数据仓库架构，借助
              Databricks 运行提取、转换与加载（ETL）自动化流程及高阶机器学习建模 [CE005, CE006]。底层技术基础设施采用 AWS 云计算服务，并通过 Docker 管理容器化微服务 [CE005,
              CE007]。Eikon 的科学软件工程引入了专门的智能体工作流与大语言模型（LLM）自动化工具，借此简化研发数据规整并加速数据驱动的生物学决策 [CE005,
              CE007]。仪器控制与数据采集系统直连中央数据平台，确保所有研发管线的数据完整性、血缘追踪与自动化检测定量分析 [CE004, CE005]。
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
