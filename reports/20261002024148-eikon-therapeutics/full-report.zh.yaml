              Eikon
              同时推进注册临床与早期管线，对临床运营、试验中心、供应商、质量体系和资金提出了更高要求。公开留存资料记录了试验里程碑，但并未提供可审计的系统正常运行时间、网络安全、生产质量、供应集中度或平台性能指标。许可协议与对外合作的延续性同样关键：Eikon
              在 5 月的演示材料中，将维持协议效力及履行相关财务义务归为前瞻性事项。公司组织的意见领袖（KOL）活动透露，出镜医生是领取报酬的 Eikon 顾问；Markets Insider
              的转载也无法让该通稿变为独立客观证据。这些限制使得执行落地与证据独立性方面的风险缓解措施仅具有部分成熟度。
