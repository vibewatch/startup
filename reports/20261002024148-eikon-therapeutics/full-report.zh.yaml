      - number: '1.2'
        title: 融资历程、公开上市与流动性状况
        blocks:
          - type: paragraph
            body: >-
              Eikon Therapeutics 在早期私募风投阶段累计融资超 $668 million；其中包括 2022 年初完成由 T. Rowe Price Associates 领投的 $517.8 million
              Series B 轮融资，跟投方包括 CPP Investments、EcoR1 Capital、UC Investments、ADIA、StepStone Group 及 General Catalyst
              等主权财富基金与交叉投资机构。公司随后在纳斯达克全球精选市场挂牌上市，股票代码为 EIKN。2026 年 6 月 26 日起，Eikon 正式纳入 Russell 3000 指数，进一步拓宽了 FMR
              LLC、BlackRock 及 Merck & Co. 等机构管理人的指数持股广度。


              资产负债表方面，截至 2026 年 3 月 31 日，Eikon 披露持有现金、现金等价物及有价证券 $596.0 million。管理层指引称，现有流动性预计可支撑计划中的临床与运营开支直至 2027
              年下半年。2026 年第一季度研发费用达 $70.0 million，较上年同期的 $56.6 million 同比增长 24%，增长主要源于后期临床试验规模扩大，以及向许可转让方 Impact
              Therapeutics (Shanghai) Inc. 支付的 $5.0 million 研发里程碑款项。第一季度一般与行政管理费用为 $17.3 million，归属于普通股股东的季度净亏损共计 $83.0
              million。
