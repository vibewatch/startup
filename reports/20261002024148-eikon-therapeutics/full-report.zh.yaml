  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 生物物理平台与肿瘤临床双维竞争格局
        blocks:
          - type: paragraph
            body: >-
              Eikon Therapeutics 在生物技术领域兼具双重定位，横跨前沿平台发现技术与临床阶段肿瘤药物开发。在药物发现生物学领域，Eikon
              首创基于超分辨率活细胞荧光显微成像的单分子追踪（SMT）技术，为生成化学、计算机模拟计算与固定细胞表型组学提供了光学维度的生物物理替代方案。然而，外部竞品对标表明，Eikon
              当下的临床势头高度依赖外部收购或许可引进的候选药物，而非自身成像引擎发现的分子。相比 Recursion Pharmaceuticals、Relay Therapeutics 及 Schrodinger
              等推进平台自主衍生管线的同行，Eikon 的领头临床项目——包括 EIK1001 以及 PARP1 抑制剂 EIK1003 和 EIK1004——均从外部合作伙伴处引进。这在战略上造成双重割裂：Eikon
              既要以后期肿瘤开发者的身份下场竞争，又承担着早期发现平台的资本开销与估值叙事。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
