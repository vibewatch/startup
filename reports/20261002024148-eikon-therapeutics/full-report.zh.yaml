    title: 合作伙伴 / 外部依赖风险登记册
    columns:
      - 依赖项
      - 交易对手 / 角色
      - 集中度证据
      - 潜在失效情景
      - 发生后影响
      - 缓解对策
      - 残余风险敞口
    rows:
      - - 许可协议与合作关系存续性
        - 涉及的具体协议与合作方须经虚拟数据室（Data Room）核实
        - 公司路演材料将协议维持及付款义务列为前瞻性事项
        - 权益失效、商业纠纷、合同违约或经济条款恶化
        - 高
        - 合同履行节点日历、付款合规审批、知情同意梳理及违约补救跟踪
        - 审阅底层合同与权利负担前残余风险偏高
      - - 临床联用与临床试验中心生态体系
        - 免疫检查点疗法供应商、研究者、CRO、临床试验中心及供应商
        - 未量化
        - 药物获取受阻、质量瑕疵、入组迟滞或跨机构协同失效
        - 高
        - 引入合规备选方、强化现场监查、订立供药保障协议及动态跟踪入组进度
        - 中高；所获材料未包含具体合同与备用冗余方案
      - - 资本提供方 / 资金来源
        - 公开市场股权融资及其他未来融资渠道
        - 截至 6 月 30 日账面现金 $531.2 million；官方指引资金跑道可支撑至 2027 年下半年
        - 在达成重大价值拐点前被迫融资，或接受不利融资条款
        - 若现金跑道缩短则影响致命
        - 依据里程碑动态控制开支、制定融资方案及预设 12 个月流动性预警线
        - 鉴于公司已公开披露后续资金需求，残余风险偏高
      - - KOL 及外部学术背书公信力
        - 重点合作的临床顾问专家及公司主导的对外宣介
        - 已披露顾问薪酬合作关系；联合通稿本质仍属公司官方发布
        - 商业宣传性质材料被误认为独立学术验证
        - 中
        - 利益冲突披露与独立的同行评议学术佐证
        - 在完成非赞助类独立证据审阅前残余风险居中
    notes: 现有资料未对交易对手集中度、合同经济条款及备用冗余做出量化。现金与有价证券代表流动性储备，并非 ARR、营业收入，亦不能直接等同于季度资金消耗率。
