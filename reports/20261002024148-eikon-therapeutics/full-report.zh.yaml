              - CV009
              - CV014
      - number: '8.2'
        title: 情景分析、催化事件与核心尽调逻辑
        blocks:
          - type: paragraph
            body: >-
              评估 Eikon Therapeutics 需要在差异化的高通量生物物理发现平台与其后期肿瘤临床试验的高资本消耗之间权衡。乐观情景认为，核心资产 EIK1001（处于晚期黑色素瘤与一线 NSCLC 的 Phase
              2/3 注册试验阶段的全身给药 TLR 7/8 双重激动剂）在联合抗 PD-1 基石药物 pembrolizumab 时能够展现出持久的临床缓解，从而验证 Eikon 平台的有效性。此外，具中枢神经渗透性的
              PARP1 抑制剂 EIK1004 与 WRN 抑制剂 EIK1005 的早期 Phase 1/2 临床数据，有望进一步证实更广阔的管线期权价值。相对而言，反向逻辑强调 Eikon
              仍是一家处于临床早中期的生物科技公司，商业产品销售收入为零，单季净亏损超 $88M，且极度依赖非此即彼的注册临床试验读数结果。若 TeLuRide-006 或 TeLuRide-008
              未能证明相较标准免疫疗法具有更优的无进展生存期，Eikon 在 2028 年商业化前将面临估值倍数严重收缩、股权稀释风险攀升以及资产负债表告急。下行触发因素包括：独立数据监查委员会判定临床试验无效、全身性 TLR
              激活引发严重安全性负担，以及无法以低稀释估值获取股权资本。
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
