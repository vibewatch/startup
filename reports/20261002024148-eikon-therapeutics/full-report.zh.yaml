chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、平台底座与治理架构
        blocks:
          - type: paragraph
            body: >-
              Eikon Therapeutics, Inc. 是一家临床阶段生物制药公司，致力于针对重大未满足医疗需求开发创新药，初期战略重心放在肿瘤领域。公司创立于加利福尼亚州，最初在 Hayward 开展运营，后于
              2025 年 4 月迁至位于 Millbrae 的总部主园区。Eikon
              的底层科学平台采用超分辨率活细胞显微技术与单分子追踪（SMT），实时测定活细胞内单个蛋白质的运动轨迹与相互作用，融合了尖端光学、自动化机器人、药物化学及高性能计算。


              管理团队由首席执行官兼董事会主席 Roger M. Perlmutter（医学博士、哲学博士）领衔，其曾任 Merck 执行副总裁兼 Merck 研究实验室总裁。高级管理团队成员包括：首席医疗官 Roy
              Baynes（医学博士、哲学博士，曾任 Merck 高级副总裁兼全球临床开发主管）、首席财务官 Alfred 'Freddie' Bowie, Jr.（哲学博士，曾任 Veracyte
              企业与业务发展副总裁）、首席科学官 Daniel Anderson（哲学博士，曾任 Recursion Pharmaceuticals 生物学副总裁），以及首席技术官 Russ Berman（曾任 Pacific
              Biosciences 工程副总裁）。公司治理架构与早期机构支持深度绑定创始风投机构，The Column Group、Lux Capital 及 Foresite Capital
              在董事会及内部人持股中占据核心席位。
