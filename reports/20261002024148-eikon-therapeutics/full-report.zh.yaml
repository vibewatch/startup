      - number: '2.4'
        title: 采纳驱动因素、制约条件与估值关联
        blocks:
          - type: paragraph
            body: >-
              临床证据是推动采纳的首要催化剂。Seeking Alpha 报道称 EIK1001 在 NSCLC 中实现了 63.1%
              的客观缓解率且安全性良好，但也指出市场反应平淡；该表述属于分析师总结，无法替代对试验本身数据的严格审阅。反之，GuruFocus 转述了 Wedbush 的观点，指出全身性 TLR7/8
              激动剂在历史上疗效受限且治疗窗狭窄，而选择性 PARP1 管线切入的也是高度同质化的赛道。Eikon
              自身发布的通稿也列举了运营历史有限、持续亏损、需追加资金、研发失败、监管以及知识产权等多重风险。在尚未出现商业化支付方之前，这些制约因素可能延缓合作达成、拉高差异化证明门槛，并压低企业估值。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
