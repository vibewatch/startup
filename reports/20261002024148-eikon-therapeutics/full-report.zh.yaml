      - number: '1.3'
        title: 临床管线演进与战略开发里程碑
        blocks:
          - type: paragraph
            body: >-
              Eikon 的发展战略将专有 SMT 显微成像平台自主发现的分子与处于较成熟临床阶段的外部引进资产相结合。临床管线以三条优先推进的肿瘤项目为主导：EIK1001、EIK1003 与 EIK1005。核心在研资产
              EIK1001 是一款全身给药的 Toll 样受体 7 和 8（TLR7/8）双重激动剂。截至 2026 年 5 月 4 日的数据截止日，在联合 pembrolizumab 与化疗一线治疗 4
              期非小细胞肺癌（NSCLC）的 Phase 2 TeLuRide-005 试验中，EIK1001 在 65 例可评估疗效的患者中实现了 63.1% 的客观缓解率（ORR）与 90.8% 的疾病控制率（DCR）。


              EIK1003 是一款自 Impact Therapeutics 引进的高选择性在研 PARP1 抑制剂，设计上避开 PARP2 信号通路以降低血液学毒性。在晚期实体瘤的 Phase 1/2
              EIK1003-001 研究中，EIK1003 单药治疗组（Cohort 1A，n=49）取得 14.3% 的 ORR，联合每周 paclitaxel 组（Cohort 1C，n=53）取得 24.5% 的
              ORR。第三项核心管线 EIK1005 为针对微卫星高度不稳定（MSI-H）肿瘤的自研 WRN 解旋酶抑制剂，于 2026 年 2 月启动 Phase 1/2 临床给药。然而，Eikon
              持续产生大额经营现金流出与季度净亏损（2026 年 Q1 达 $83.0 million），公司官方披露亦反复预警：在实现商业化前，后续运营仍需大量追加资金。
