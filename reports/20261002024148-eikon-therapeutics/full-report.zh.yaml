        blocks:
          - type: paragraph
            body: >-
              临床疗效与监管执行风险居于首位：Eikon 自身将候选药物失败以及对现有管线的依赖列为重大不确定性，独立评论也指出管线的理论差异化仍须转化为持久的人体临床疗效。资金可获得性风险位列第二：截至 2026 年 6 月
              30 日，公司披露持有现金、现金等价物及有价证券 $531.2 million，第二季度净亏损达 $88.4 million，而其自述现金跑道仅能维持至 2027 年下半年。3 月 31 日至 6 月 30
              日季度末资金减少 $64.8 million 属于资产负债表变动，并非衡量实际现金消耗的指标。紧随其后的是知识产权、许可授权链条以及多项试验并行执行的风险，原因在于公开证据并未确立专利保护范围、权利负担、CMC
              生产就绪度或内控成熟度。
