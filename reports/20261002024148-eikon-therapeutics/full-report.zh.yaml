      - - EIK1001
        - TLR7 / TLR8 双重激动剂
        - 晚期黑色素瘤（一线）与晚期 NSCLC
        - Phase 2/3 注册性临床（TeLuRide-006、TeLuRide-008）
        - 全身性固有/适应性双重免疫激活联合 PD-(L)1 阻断
        - 数据监查委员会（DMC）选定 0.60 mg/m2 剂量，但详细疗效数据仍处于未揭盲/保密状态
      - - EIK1003
        - PARP1 选择性小分子抑制剂
        - 乳腺癌、卵巢癌及前列腺癌
