      nodes:
        - label: 1. 平台研发探索
          detail: 利用单分子成像技术发现潜在候选疗法；此阶段属于科研投入，而非客户采购部署。
          touchpoints:
            - Eikon research teams
            - Pipeline candidates
        - label: 2. 试验中心激活
          detail: 研究者与试验中心筹备试验方案并规划受试队列；EIK1003 旗下已有一组队列完成中心选定。
          touchpoints:
            - Investigators
            - Clinical sites
        - label: 3. 受试者入组
          detail: 患者开始接受试验药物治疗；TeLuRide-005 已通报完成全部受试者入组。
          touchpoints:
            - Screening
            - Dosing
        - label: 4. 临床监测与数据披露
          detail: 借助数据监查与学术会议披露评估进展；TeLuRide-006 在中期评估后获准继续推进。
          touchpoints:
            - Independent DMC
            - Scientific congresses
        - label: 5. 监管审批裁决
          detail: 监管获批属未来审批节点，所获材料无法证实其确定性。
          touchpoints:
            - Regulatory review
            - Benefit-risk assessment
        - label: 6. 商业准入与放量
          detail: 处方开具、医保报销准入、医院采购及重复用药仍属前瞻预期，目前缺乏实据衡量。
          touchpoints:
            - Providers
            - Payers
    approximationNotes: 仅作为逻辑分析推演序列：阶段 1 至 4 概括了公开可查的既有实据，阶段 5 至 6 明确属于前瞻预估，并不等同于必然获批或实现商业化推广。
    claimRefs:
