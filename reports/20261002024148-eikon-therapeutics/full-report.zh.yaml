      - number: '5.3'
        title: 临床开发管线、试验执行与双轨策略
        blocks:
          - type: paragraph
            body: >-
              Eikon 的长期企业差异化壁垒虽立足于专有单分子追踪平台，但其近期商业估值与临床推进时间表却主要由外部引进的临床阶段肿瘤项目驱动 [CE008, CE009]。核心资产 EIK1001 属于全身给药的 Toll
              样受体（TLR）7/8 双重激动剂，旨在同时激活天然与获得性抗肿瘤免疫应答 [CE009, CE010]。在一线治疗晚期皮肤黑色素瘤的全球 Phase 2/3 TeLuRide-006
              注册临床研究中，独立数据监查委员会建议选择 0.60 mg/m2 作为联合 pembrolizumab 推进的单一推荐剂量 [CE009, CE010]。在非小细胞肺癌领域，EIK1001 分别在 Phase 2
              TeLuRide-005 研究及 Phase 2/3 TeLuRide-008 注册试验中，联合 pembrolizumab 与化疗接受评估 [CE008, CE011]。除 EIK1001 外，Eikon
              还在推进高选择性 PARP1 抑制剂 EIK1003 及可穿透中枢神经系统的 EIK1004；两款分子均避开 PARP2，以支持与全剂量化疗联用 [CE008, CE012]。平台自研候选分子包括处于 Phase
              1/2、针对 MSI-H 肿瘤的 Werner 解旋酶抑制剂 EIK1005，以及目标推进新药临床试验申请（IND）的雄激素受体拮抗剂 EIK1006 [CE008, CE013]。截至 2026 年 6 月
              30 日，Eikon 持有现金、现金等价物及有价证券 $531.2 million，可提供维持至 2027 年下半年的资金跑道以执行上述临床试验 [CE008, CE014]。
            claimRefs:
