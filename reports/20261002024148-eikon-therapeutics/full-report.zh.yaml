              现有证据未显示 Eikon 具备商业化客户业务。公司官方材料将其界定为后期临床生物制药开发商，独立竞品分析亦指出 Eikon
              尚未开始销售药品。因此当前阶段的关联群体仅为：接受试验疗法的临床试验受试者、执行试验方案的研究者与临床中心，以及评估临床证据的科学界与监管机构。Eikon
              的招聘主页将患者列为预期受益人，但这一愿景陈述并非付费客户存在的凭据。同样，官方主页与 Foresite
              投资组合专页侧重的是前沿生物学、临床阶段管线及疗法发现，而非上市商业化服务。在本资料集中，未来的处方医生、医疗机构体系与医保/商保支付方仍属于潜在利益相关方，而非已得到验证的客户。
