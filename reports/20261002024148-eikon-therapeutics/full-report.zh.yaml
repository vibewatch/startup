  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 活细胞单分子追踪显微成像与药物发现平台
        blocks:
          - type: paragraph
            body: >-
              Eikon 的药物发现平台脱胎于科学联合创始人获诺贝尔奖的超分辨率荧光显微成像技术创新 [CE001]。其核心运作机制是在分子级分辨率下，测定活细胞内蛋白质的运动与实时动力学 [CE001,
              CE002]。传统药物发现方法多依赖生化结合实验或纯化蛋白的静态结构成像，无法捕捉完整细胞环境下的动态蛋白-蛋白相互作用与瞬态结合状态 [CE001, CE003]。Eikon
              实时追踪活体人类细胞内带有荧光标记的单个蛋白质分子，借此探查传统方法难以攻克或“不可成药”的靶点类别 [CE001,
              CE002]。运转这套发现引擎需要全套自研自建的高通量光学仪器、精密运动控制系统及高速数据采集硬件 [CE002,
              CE004]。该工程架构整合了先进光机组件、自动化机械臂微孔板进样及带高速接口的高密度印刷电路板组件，用于采集海量生物数据流 [CE004,
              CE005]。这一硬件层直接接入高内涵数据集处理流水线，能够针对数千种化合物扰动，规模化定量分析单分子轨迹动力学 [CE002, CE005]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
