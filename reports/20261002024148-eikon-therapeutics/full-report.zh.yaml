      - number: '7.2'
        title: 监管、法律与知识产权风险敞口
        blocks:
          - type: paragraph
            body: >-
              TeLuRide-006 独立数据监查委员会选定了一种给药方案并建议继续推进黑色素瘤研究，这属于流程里程碑，并非获得批准或最终疗效确立的证据。TeLuRide-008 于 2026 年 7
              月完成首例患者给药，EIK1006 仍处于预期的年底 IND 申报阶段，并未披露获批批件。Eikon 自身的风险提示涵盖法律、监管和知识产权风险，以及候选药物在研发中失败的可能性。PatSnap
              也仅给出了初筛级别的知识产权评述，尚待对物质组成、授权地域、第三方许可及自由实施（FTO）进行核实。现有资料中未收录能弥补这些缺口的法院、监管机构、专利局原始卷宗或完整许可链记录，因此不能推定不存在侵权纠纷或产权完全清晰。
