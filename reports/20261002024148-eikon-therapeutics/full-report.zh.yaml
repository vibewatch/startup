  - id: FE001
    title: Eikon 药物发现与临床转化技术架构全景
    type: stack
    summary: 涵盖定制光学仪器硬件、云端数据工程及临床管线推进的一体化技术架构。
    data:
      layers:
        - label: 临床转化层
          detail: 全球多中心肿瘤注册临床试验与临床资产开发
          modules:
            - TeLuRide-006 黑色素瘤 2/3 期临床
            - TeLuRide-008 NSCLC 2/3 期临床
          outputs:
            - 1/2 期 PARP1 项目（EIK1003/EIK1004）
            - 1/2 期 Werner 解旋酶抑制剂（EIK1005）
        - label: 生物信息与 AI 计算层
          detail: 数据湖仓、AI Agent 流水线与自动化科研工作流
          modules:
            - Databricks 湖仓分析与自动化 ETL
            - Dotmatics 与 CDD Vault LIMS/ELN 系统集成
          outputs:
            - Mosaic 化合物与样本库管理
            - 面向科研工作流的 LLM 智能体工具
        - label: 仪器与物理硬件层
          detail: 定制超分辨率显微成像系统与生物样本自动化采集
          modules:
            - 单分子追踪（SMT）活细胞光学显微镜
            - 自动化机械运动控制与高密度 PCBA 硬件
          outputs:
            - 高通量多孔板成像与图像遥测
            - 基于 FPGA 的采集系统与高速 DDR 内存接口
        - label: 化学与生物标记层
          detail: 荧光探针化学与工程化工程细胞系构建
          modules:
            - 细胞穿透性荧光染料与分子标签
            - 工程化 HaloTag 与 SNAP-tag 融合蛋白
          outputs:
            - 活细胞内化学计量学靶点标记
            - 高信噪比细胞内成像
        - label: 数据湖仓与云端数据摄入层
          detail: 高可扩展云存储与 ETL 基础设施
          modules:
            - AWS 云计算基础设施与 Docker 微服务
            - 关系型、文档型及图数据库存储体系
          outputs:
            - 多源统一试验数据集
            - 海量显微成像原始数据归档库
        - label: 转化治理与临床运营层
          detail: 监管合规、数据监查与临床试验全流程质控
          modules:
            - 独立数据监查委员会（DMC）全程督导
            - 全球多中心临床试验网络与 CRO 协同调度
          outputs:
            - 注册临床试验方案与 FDA/EMA 申报文件
            - 给药剂量选定与安全性拓展决策
