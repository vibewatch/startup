              - CE001
              - CE008
              - CE009
          - type: callout
            title: 后期注册管线的转化风险与现金消耗
            body: >-
              多项 Phase 2/3 注册试验（TeLuRide-006 与 TeLuRide-008）与早期管线同步推进，将 2026 年 Q2 的季度研发支出推高至 $75.5 million。虽然 $531.2
              million 的流动资金可将跑道维持至 2027 年底，但若黑色素瘤或肺癌项目读数不及预期，将在平台自研项目达成临床概念验证之前直接打击资本使用效率。
            calloutType: risk
