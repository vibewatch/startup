  - id: TV002
    title: 核心看多与看空逻辑剖析
    columns:
      - 维度
      - 核心论点
      - 逻辑证伪或转向条件
    rows:
      - - 平台技术与研发管线（看多）
        - 超分辨率单分子追踪（SMT）与前沿 AI 工程技术协同加速了高选择性靶点的发现，代表管线包括 EIK1003/EIK1004（PARP1）与 EIK1005（WRN）。
        - 自主研发临床候选分子未能展现出相较竞品管线的明显临床安全性或治疗指数优势。
      - - 核心先导资产疗效（看多）
        - 核心先导项目 EIK1001 展现出全身性 TLR 7/8 激活效应，并在晚期黑色素瘤及 NSCLC 中与帕博利珠单抗（pembrolizumab）表现出协同联用疗效。
        - 推进中的注册临床试验 TeLuRide-006 或 TeLuRide-008 遭遇试验叫停或客观缓解率未达治疗阈值。
      - - 融资与股权稀释（看空）
        - 估值从一级市场顶峰的 36 亿美元大幅缩水至 IPO 时的 9.717 亿美元，反映出二级市场的强烈审慎情绪与降价重组态势。
        - 达成具有实质收益的非稀释性跨国药企商业授权合作，或在关键数据公布后迎来市场持续估值重塑。
      - - 资金消耗与执行交付（看空）
        - 2026 年第二季度单季运营支出达 $93.4M、净亏损达 $88.4M，迫使其必须在 2027 年下半年之前开展大规模股权再融资。
        - 管理费用大幅压降，或注册临床进度显著提速使得申报获批时间表大幅提前。
    notes: 评估框架围绕多资产临床推进成效与高额运营消耗及既往资本重组历史的权衡展开。
    claimRefs:
      - CV002
      - CV004
      - CV005
      - CV009
      - CV011
      - CV012
      - CV013
  - id: TV003
    title: 乐观、基准与悲观情景推演预测
    columns:
      - 评估情景
      - 核心运营假设
      - 估值与投资回报逻辑
      - 核心风险与下行诱因
      - 概率信号
    rows:
      - - 乐观情景
        - TeLuRide-006 在黑色素瘤试验中展现出具有统计学显著性的 PFS 改善；EIK1003 确定 2 期推荐剂量；EIK1006 获批 IND。
        - 估值重塑至 $2.5B–$3.5B（对应 2.5x–3.5x 上行空间），反映出商业化风险显著释放及潜在并购溢价预期。
        - 全球多中心临床扩展受阻于监管审批，或联用组出现意外的免疫毒性反应。
        - 25%
      - - 基准情景
        - TeLuRide-006 稳步推进至注册临床终点；EIK1001 联用展现温和的增量获益；资金跑道维持至 2027 年年中。
        - 估值稳定在 $900m–$1.3b 区间；公司开展小规模增发再融资以支撑至 2028 年数据读出。
        - 欧洲或全球临床试验中心执行延误；面临其他新型免疫激动剂的竞争性挤压。
        - 50%
      - - 悲观情景
        - 独立 DMC 提示 TeLuRide-006 试验无效或存在安全性缺陷；季度资金消耗加速突破 1 亿美元；在低于 5 亿美元市值水平下被迫大幅稀释股权。
        - 估值跌破账面现金价值（降至 $300m–$500m，对应逾 50% 下行空间）；被迫进行折价重组或纾困资本运作。
        - 肿瘤 3 期临床遭遇非成即败的彻底失败；核心 SMT 平台未能转化出切实可行的临床资产。
        - 25%
    notes: 情景区间模型基于临床研发里程碑推演未来 12 至 24 个月投资周期内的股权估值倍数。
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
