      - number: '8.3'
        title: 投资建议与结构化决策逻辑
        blocks:
          - type: paragraph
            body: >-
              基于当前的临床推进进度、流动性储备及公开市场估值水平，对 Eikon Therapeutics 的投资立场定为观察（track），置信度评级为中（medium）。当前约 $971.7M 的企业估值扣除
              $531.2M 现金及有价证券缓冲垫后，隐含企业价值（EV）约为
              $440M，反映出市场对管线商业化的预期较低。尽管这一折价在注册试验顺利达成里程碑时蕴含非对称上行空间，但短期内的入场纪律要求必须等待主要肿瘤学术会议公布完整临床数据集以及独立监查委员会的验证结论。该决策框架综合衡量了科学平台验证、注册临床推进里程碑与流动性跑道，对照未来潜在的股权稀释压力进行审视。核心投资逻辑破损触发点包括：EIK1001
              门诊给药出现无法控制的全身免疫相关不良反应、黑色素瘤或 NSCLC 中期疗效读数不及预期，或是在未达成非稀释性商业合作的前提下现金储备跌破 4 个季度的运营消耗（$300M）。
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
