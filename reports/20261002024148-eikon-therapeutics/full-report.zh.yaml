      - number: '5.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 双轨战略使近期估值脱钩于发现平台验证
            body: >-
              Eikon 采取了分轨运营模式：尽管专有单分子追踪显微成像平台构成了其底层知识产权壁垒，但近期企业价值却几乎完全绑定在 EIK1001、EIK1003 等外部引进临床资产上。这种架构在等待早期发现阶段 SMT
              项目成熟的同时，提供了立即可触达的临床里程碑。
            calloutType: insight
