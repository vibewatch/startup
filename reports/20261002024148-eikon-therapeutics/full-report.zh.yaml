    title: 投资建议逻辑决策链
    type: flow
    summary: 从资本结构与临床实据推导至最终跟踪观察建议的递进评估路径。
    data:
      nodes:
        - id: N1
          label: 资金储备：$531.2M 现金
          status: strong
          detail: 按每季度约 $93M 的运营支出计算，资金跑道可支撑至 2027 年下半年
        - id: N2
          label: 估值重构：9.717 亿美元 IPO
          status: neutral
          detail: 较 36 亿美元一级市场顶峰估值下滑 73%；已充分计入悲观预期
        - id: N3
          label: 关键注册临床试验推进
          status: pending
          detail: TeLuRide-006 黑色素瘤 2/3 期及 TeLuRide-008 NSCLC 试验持续开展
        - id: N4
          label: 疗效与安全性二元结果风险
          status: adverse
          detail: TLR 7/8 全身性毒性隐忧，且缺乏已揭盲的关键临床有效性数据
        - id: N5
          label: 决策结论：跟踪观察（中等置信度）
          status: recommendation
          detail: 维持观察立场，静待 ESMO/ASCO 等关键学术会议披露突破性疗效数据
        - id: N6
          label: 逻辑证伪与买卖决策触发条件
          status: monitoring
          detail: 若证实 3 期 PFS 显著改善则考虑建仓；若 DMC 提示无效（Futility）则减仓或规避
