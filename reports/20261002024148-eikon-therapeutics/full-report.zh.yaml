  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资轨迹与公开市场估值背景
        blocks:
          - type: paragraph
            body: >-
              Eikon Therapeutics 经历了一次剧烈的私募向公开市场过渡，在走向公开市场前经历了大幅度的流血轮（down-round）估值调整。公司于 2019 年基于诺贝尔奖得主 Eric Betzig
              开创的超分辨率活细胞显微成像技术成立，曾吸引广泛的机构背书，在私募风投阶段累计筹资超 $1.1B。然而，在 2023 年 5 月达到 $3.6B 的私募估值高点后，公司遭遇严峻的估值挤压，于 2025 年 2
              月完成 $350.7M 的 Series D 轮首关，调整后的投后估值为 $1.85B，相比 Series C 的峰值折让约 49%。本次资本重组涉及对早期轮次股份的流血轮重定价调整，将 Series B-1 和
              Series C-1 股份价格重置为与 Series D 相同的每股 $5.84。2026 年 2 月 5 日，Eikon 以股票代码 EIKN 登陆纳斯达克，IPO 募资 $381.2M，隐含估值为
              $971.7M，相比 2023 年的峰值累计估值缩水超 73%。包括 Forge Global 和 EquityZen 在内的二级市场流动性平台曾撮合 IPO 前的老股转让，但上市后市场定价已回落至低于
              $1.0B 的基线附近。截至 2026 年第二季度末，Eikon 维持着 $531.2M 的流动资金储备，对照约 $93.4M 的季度运营消耗，可确保资产负债表在 2027 年下半年前保持稳定。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
