      - number: '3.4'
        title: 重点图表
        blocks:
          - type: callout
            title: 对引进临床资产的非对称依赖
            body: >-
              Eikon 的商业价值与其核心平台严重脱钩：驱动近期注册催化事件的核心资产（EIK1001、EIK1003、EIK1004）全部来自外部收购或许可引进。一旦 EIK1001 在黑色素瘤或 NSCLC
              注册试验中遭遇疗效或安全性阻碍，在内部 SMT 平台产出成熟临床候选药物之前，投资者就将面临立竿见影的估值减记。
            calloutType: risk
            claimRefs:
              - CP001
              - CP005
              - CP014
