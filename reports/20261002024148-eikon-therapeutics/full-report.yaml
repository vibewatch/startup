chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Platform Foundation, and Governance
        blocks:
          - type: paragraph
            body: >-
              Eikon Therapeutics, Inc. is a clinical-stage biopharmaceutical company dedicated to developing innovative
              medicines for serious unmet medical needs, with an initial strategic focus on oncology. Founded in
              California, the company initially established corporate operations in Hayward before moving into its
              primary headquarters facility in Millbrae in April 2025. Eikon's foundational scientific platform applies
              super-resolution live-cell microscopy and single-molecule tracking (SMT) to measure the real-time movement
              and interactions of individual proteins inside living cells, integrating advanced optics, automated
              robotics, medicinal chemistry, and high-performance computing.


              Executive leadership is headed by Chief Executive Officer and Board Chair Roger M. Perlmutter, M.D.,
              Ph.D., formerly Executive Vice President and President of Merck Research Laboratories. The senior
              management team includes Chief Medical Officer Roy Baynes, M.D., Ph.D. (former SVP and Head of Global
              Clinical Development at Merck), Chief Financial Officer Alfred 'Freddie' Bowie, Jr., Ph.D. (formerly VP of
              Corporate and Business Development at Veracyte), Chief Scientific Officer Daniel Anderson, Ph.D. (formerly
              VP of Biology at Recursion Pharmaceuticals), and Chief Technical Officer Russ Berman (formerly VP of
              Engineering at Pacific Biosciences). Governance and early institutional backing are closely tied to
              founding venture investors, with key board and insider trading roles held by The Column Group, Lux
              Capital, and Foresite Capital.
            claimRefs:
