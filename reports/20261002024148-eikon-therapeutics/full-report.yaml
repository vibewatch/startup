      - number: '6.2'
        title: Clinical adoption proxies
        blocks:
          - type: paragraph
            body: >-
              Because there is no disclosed marketed product, adoption must be measured narrowly through enrollment and
              trial progression rather than accounts, purchases, or utilization revenue. TeLuRide-005 had completed
              enrollment by the March 2026 update. By August, an independent data monitoring committee had selected a
              TeLuRide-006 dose for expansion and recommended that the study continue, while TeLuRide-008 had dosed its
              first patient. EIK1003 Cohort 1D had completed site selection and was enrolling, and EIK1005 had dosed its
              first Phase 1/2 participant in January. Seven accepted ESMO abstracts indicate scientific dissemination
              across four candidates, not customer demand. The disclosures do not provide a consolidated participant
              denominator, active-site count, repeat-use cohort, or comparable utilization series, so the trajectory is
              a milestone chronology rather than a commercial growth curve.
