  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market should be bounded around oncology drug development and eventual medicine sales or
              partnering economics. Eikon describes an initial oncology focus, with internally derived therapies
              developed through single-molecule tracking and additional assets obtained through in-licensing. That makes
              broad "AI drug discovery" estimates an adjacency rather than a defensible revenue pool: the assigned
              materials do not show that Eikon sells software, microscopy capacity, data, or platform access to external
              customers. Relevant substitutes therefore include conventional drug discovery, competing clinical assets
              in the same mechanisms, in-licensed programs, and the decision by a pharmaceutical buyer to fund another
              oncology candidate. Public-equity index membership is a capital-market channel, not evidence of end-market
              demand.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM014
