  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Trajectory and Public Market Valuation Context
        blocks:
          - type: paragraph
            body: >-
              Eikon Therapeutics completed a significant private-to-public transition, marked by aggressive down-round
              adjustments before entering the public markets. Founded in 2019 around super-resolution live-cell
              microscopy pioneered by Nobel laureate Eric Betzig, Eikon attracted extensive institutional backing,
              raising over $1.1B in private venture funding. However, after achieving a private valuation of $3.6B in
              May 2023, the company faced substantial valuation compression, closing an initial $350.7M Series D round
              in February 2025 at an adjusted post-money valuation of $1.85B, representing an approximate 49% haircut
              from its Series C peak. This recapitalization included down-round adjustments across earlier share series,
              resetting Series B-1 and Series C-1 share pricing to parity with Series D at $5.84 per share. On February
              5, 2026, Eikon listed on the NASDAQ under ticker EIKN, completing an initial public offering that raised
              $381.2M at an implied valuation of $971.7M, marking a total private-to-public valuation decline of over
              73% from its 2023 peak. Secondary market liquidity platforms including Forge Global and EquityZen
              facilitated pre-IPO shareholder trading, but post-IPO market pricing has settled near the sub-$1.0B
              baseline. As of the end of second quarter 2026, Eikon maintained $531.2M in liquid capital against a
              quarterly operating burn of approximately $93.4M, providing balance sheet stability through the second
              half of 2027.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
