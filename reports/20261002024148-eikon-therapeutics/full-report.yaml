  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Stakeholders, users, and future payers
        blocks:
          - type: paragraph
            body: >-
              Eikon is not presently evidenced as a commercial customer business. Company-issued material describes a
              late-stage clinical biopharmaceutical developer, while an independent competitive profile states that
              Eikon is not yet selling a drug. The relevant current populations are therefore clinical-trial
              participants who receive investigational therapies, investigators and sites that execute protocols, and
              scientific or regulatory audiences that evaluate resulting evidence. Eikon's recruiting page identifies
              patients as the intended beneficiary, but that mission statement is not proof of a paying account.
              Likewise, the official homepage and Foresite's portfolio profile emphasize biology, clinical-stage
              programs, and treatment discovery, not a marketed service. Future prescribers, provider systems, and
              payers remain prospective stakeholders rather than demonstrated customers in this source set.
            claimRefs:
