      - number: '2.4'
        title: Adoption drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Clinical evidence is the principal adoption trigger. Seeking Alpha reported a 63.1% objective response
              rate for EIK1001 in NSCLC with favorable safety, but also described a muted market response; this is an
              analyst summary rather than a substitute for trial-level review. Conversely, GuruFocus relayed Wedbush's
              view that systemic TLR7/8 agonists have historically faced limited effectiveness and a narrow therapeutic
              window, and that selective PARP1 programs enter a saturated field. Eikon's own syndicated release also
              lists limited operating history, continuing losses, additional-funding needs, development failure,
              regulation, and intellectual property as risks. These constraints can delay partnering, raise the proof
              threshold for differentiation, and compress valuation before any commercial payer exists.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM013
