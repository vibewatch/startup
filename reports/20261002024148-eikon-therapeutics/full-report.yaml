  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Clinical efficacy and regulatory execution rank first because Eikon itself identifies candidate failure
              and dependence on current programs as material uncertainties, while independent commentary says the
              pipeline's theoretical differentiation still must translate into durable human outcomes. Capital
              availability ranks second: the company reported $531.2 million of cash, cash equivalents, and marketable
              securities at June 30, 2026 and a second-quarter net loss of $88.4 million, while describing runway only
              into the second half of 2027. The $64.8 million quarter-end decline from March 31 to June 30 is a
              balance-sheet movement, not a cash-burn measure. IP, license-chain, and multi-trial execution risks follow
              because public evidence does not establish patent scope, encumbrances, CMC readiness, or control maturity.
            claimRefs:
