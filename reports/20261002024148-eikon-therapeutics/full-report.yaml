              the melanoma study continue, which is a process milestone rather than evidence of approval or final
              efficacy. TeLuRide-008 dosed its first patient in July 2026, and EIK1006 remained an expected year-end IND
              submission rather than a disclosed clearance. Eikon's own risk language covers legal, regulatory, and
