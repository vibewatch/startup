  - id: TV003
    title: Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario
      - Key Operational Assumptions
      - Valuation & Return Logic
      - Key Risks & Downside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          TeLuRide-006 demonstrates statistically significant PFS improvement in melanoma; EIK1003 Phase 2 dose
          confirmed; IND cleared for EIK1006.
        - >-
          Valuation re-rates to $2.5B–$3.5B (2.5x–3.5x upside), reflecting commercial de-risking and potential M&A
          buyout interest.
        - Regulatory delay in global trial expansion or unexpected immune toxicity in combinatorial cohorts.
        - 25%
      - - Base Case
        - >-
          TeLuRide-006 continues through registrational endpoints; EIK1001 combination shows modest incremental benefit;
          cash runway sustained into mid-2027.
        - >-
          Valuation stabilizes in the $900M–$1.3B range; company conducts modest secondary equity offering to bridge to
          2028 readouts.
        - >-
          Execution delays in European or global clinical trial sites; competitive displacement by alternative immune
          agonists.
        - 50%
      - - Bear Case
        - >-
          Independent DMC flags futility or safety liabilities in TeLuRide-006; cash burn accelerates beyond
          $100M/quarter; equity dilution under $500M market cap.
        - >-
          Valuation collapses below cash value ($300M–$500M, >50% downside); distressed recapitalization or
          restructuring required.
        - >-
          Complete binary failure in Phase 3 oncology trial; failure of core SMT platform to yield viable clinical
          assets.
        - 25%
    notes: >-
      Scenario ranges model equity valuation multiples over a 12-to-24 month investment horizon based on clinical
      development milestones.
