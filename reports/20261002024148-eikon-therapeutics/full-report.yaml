      - number: '5.2'
        title: Informatics Infrastructure, AI/ML Tooling, and Data Automation
        blocks:
          - type: paragraph
            body: >-
              The immense volume of image datasets produced by continuous super-resolution microscopy necessitates a
              robust informatics ecosystem and computational pipeline [CE002, CE005]. Eikon's digital architecture
              integrates commercial laboratory information management systems (LIMS) and electronic lab notebooks (ELN),
              including Dotmatics and CDD Vault, with compound sample inventory systems like Mosaic [CE005, CE006].
              Downstream analytical processing relies on enterprise data lake and data warehouse architectures,
              utilizing Databricks for extract, transform, and load (ETL) automation and advanced machine learning
              modeling [CE005, CE006]. The technical infrastructure utilizes AWS cloud computing services and
              containerized microservices managed via Docker [CE005, CE007]. Scientific software engineering at Eikon
              incorporates specialized agentic workflows and large language model (LLM) automation tools to streamline
              research data harmonization and accelerate data-driven biological decision-making [CE005, CE007].
              Instrument control and data acquisition systems interface directly with the centralized data platform to
              ensure data integrity, lineage tracking, and automated assay quantification across all research pipelines
              [CE004, CE005].
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE003
            claimRefs:
