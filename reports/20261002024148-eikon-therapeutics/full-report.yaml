  - id: FE001
    title: Eikon Drug Discovery and Clinical Translation Technology Stack
    type: stack
    summary: >-
      Integrated technological architecture spanning custom optical instrumentation, cloud data engineering, and
      clinical pipeline execution.
    data:
      layers:
        - label: Clinical Translation Layer
          detail: Global registrational oncology trials and clinical asset development
          modules:
            - TeLuRide-006 Phase 2/3 Melanoma
            - TeLuRide-008 Phase 2/3 NSCLC
          outputs:
            - Phase 1/2 PARP1 programs (EIK1003/EIK1004)
            - Phase 1/2 Werner helicase inhibitor (EIK1005)
        - label: Informatics & AI Computational Layer
          detail: Data lakehouse, AI agentic pipelines, and automated research workflows
          modules:
            - Databricks lakehouse analytics & ETL automation
            - Dotmatics & CDD Vault LIMS/ELN integration
          outputs:
            - Mosaic compound and sample inventory management
            - LLM-powered agentic tools for scientific workflows
        - label: Instrumentation & Physical Hardware Layer
          detail: Custom super-resolution microscopy and automated biological acquisition
          modules:
            - Single-molecule tracking (SMT) live-cell optical microscopes
            - Automated robotic motion control and high-density PCBAs
          outputs:
            - High-throughput multi-well imaging and image telemetry
            - FPGA-based acquisition systems and high-speed DDR memory interfaces
        - label: Chemical & Biological Tagging Layer
          detail: Fluorescent probe chemistry and engineered cell lines
          modules:
            - Cell-permeable fluorescent dyes and tags
            - Engineered HaloTag and SNAP-tag protein fusions
          outputs:
            - Stoichiometric target labeling in living cells
            - High signal-to-noise intracellular imaging
        - label: Data Lakehouse & Cloud Ingestion Layer
          detail: Scalable cloud storage and ETL infrastructure
          modules:
            - AWS cloud compute infrastructure and Docker microservices
            - Relational, document, and graph database storage
          outputs:
            - Harmonized multi-source experimental datasets
            - High-volume microscopy raw image archives
        - label: Translational Governance & Clinical Operations Layer
          detail: Regulatory compliance, data monitoring, and clinical trial oversight
          modules:
            - Independent Data Monitoring Committee (DMC) oversight
            - Global multicenter clinical trial networks and CRO coordination
          outputs:
            - Registrational trial protocols and FDA/EMA filings
            - Dose selection and safety expansion decisions
