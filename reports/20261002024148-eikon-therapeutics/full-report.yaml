      - number: '3.3'
        title: Commercialization Models, Capital Moats, and Displacement Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Eikon's commercial strategy diverges sharply from SaaS or tech-bio platform licensing peers. Eikon
              operates its high-throughput single-molecule imaging platform exclusively in-house as capital-intensive
              instrumentation, selling no software subscriptions, instruments, or platform access tiers to external
              pharmaceutical partners. Instead, commercial value realization depends entirely on advancing internal drug
              candidates through clinical trials toward regulatory approval or corporate buyouts. With $531.2 million in
              cash, cash equivalents, and marketable securities as of June 30, 2026, management projects cash runway
              into the second half of 2027 following its $381 million February 2026 Nasdaq IPO. Nevertheless, financial
              analysts flag substantial displacement and dilution risks, noting that quarterly R&D expenditure reached
              $75.5 million in Q2 2026 while pivotal Phase 2/3 registrational readouts for EIK1001 in melanoma and NSCLC
              remain unread until 2027.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Asymmetric Dependence on In-Licensed Clinical Assets
            body: >-
              Eikon's commercial value is heavily decoupled from its core platform: the lead assets driving near-term
              registrational catalysts (EIK1001, EIK1003, EIK1004) were acquired or in-licensed externally. If EIK1001
              encounters efficacy or safety headwinds in registrational melanoma or NSCLC trials, investors will face
              immediate valuation impairment before the internal SMT platform can deliver mature clinical candidates.
