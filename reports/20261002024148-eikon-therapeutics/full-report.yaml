      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual-Track Strategy Decouples Near-Term Valuation from Discovery Platform Validation
            body: >-
              Eikon operates under a bifurcated operating model: while its proprietary single-molecule tracking
              microscopy platform represents its foundational intellectual property, its near-term enterprise value is
              overwhelmingly tethered to in-licensed clinical assets like EIK1001 and EIK1003. This structure provides
              immediate clinical milestones while discovery-stage SMT programs mature.
            calloutType: insight
            claimRefs:
              - CE001
              - CE008
              - CE009
          - type: callout
            title: Translational Risk and Cash Burn Across Late-Stage Registrational Programs
            body: >-
              Operating multiple registrational Phase 2/3 trials (TeLuRide-006 and TeLuRide-008) alongside early-stage
              pipeline assets drove quarterly R&D expenditure to $75.5 million in Q2 2026. With $531.2 million in
              liquidity providing runway into late 2027, negative binary readouts in melanoma or lung cancer would
              impair capital efficiency before platform programs reach clinical proof-of-concept.
            calloutType: risk
            claimRefs:
              - CE008
