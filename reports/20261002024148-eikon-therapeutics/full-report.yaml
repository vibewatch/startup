    title: Eikon Therapeutics Corporate and Clinical Development Milestone Timeline
    type: timeline
    summary: >-
      Chronological progression of Eikon Therapeutics from private Series B capitalization to late-stage oncology
      clinical readouts and Russell 3000 reconstitution.
    data:
      items:
        - date: 2022-01
          label: Series B Financing Closed
          detail: >-
            Closed $517.8 million Series B financing led by T. Rowe Price, bringing total private capital raised to over
            $668 million.
          tone: positive
        - date: 2025-04
          label: Headquarters Relocation
          detail: >-
            Occupied new corporate headquarters facility in Millbrae, California, expanding laboratories and
            high-throughput imaging biofactory.
          tone: neutral
        - date: 2026-02
          label: EIK1005 Clinical Trial Dosing
          detail: >-
            Initiated first-in-human clinical dosing in Phase 1/2 study of internally discovered WRN helicase inhibitor
            EIK1005 for MSI-H tumors.
          tone: positive
        - date: 2026-03
          label: TeLuRide-005 Enrollment Completion
          detail: >-
            Completed enrollment of 72 patients across non-squamous and squamous cohorts in Phase 2 trial of EIK1001 in
            advanced NSCLC.
          tone: positive
        - date: 2026-03
          label: Q1 Financial Results Reported
          detail: >-
            Reported $596.0M in cash and equivalents, $70.0M in R&D expenses, and a net loss of $83.0M for the quarter
            ended March 31, 2026.
          tone: neutral
        - date: 2026-05
          label: EIK1003 Phase 2 Milestone
          detail: >-
            Paid $5.0 million milestone to Impact Therapeutics upon successful advancement of selective PARP1 inhibitor
            EIK1003 into Phase 2 development.
          tone: neutral
        - date: 2026-05
          label: ASCO 2026 Clinical Data Readouts
          detail: >-
            Presented clinical data showing 63.1% ORR and 90.8% DCR for EIK1001 in NSCLC, and 24.5% ORR for EIK1003 with
            paclitaxel in solid tumors.
          tone: positive
        - date: 2026-06
          label: Russell 3000 Index Inclusion
          detail: >-
            Officially reconstituted into the broad-market Russell 3000 Index effective June 26, 2026, broadening
            institutional ownership base.
          tone: positive
