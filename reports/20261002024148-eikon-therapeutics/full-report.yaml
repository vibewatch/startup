              development window, while the public pool does not resolve future trial enrollment costs, commercial
              manufacturing economics, milestone and royalty schedules, debt or lease covenants, or launch pricing.
              Accordingly, the runway claim should be sensitivity-tested against program-level cash budgets and
              milestone timing. A financing conclusion beyond management's stated horizon would be speculative without a
              full cash-flow forecast and contractual obligations schedule.
