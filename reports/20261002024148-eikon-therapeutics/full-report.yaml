      - number: '6.4'
        title: Durability, expansion, and concentration remain unmeasured
        blocks:
          - type: paragraph
            body: >-
              The reviewed materials do not report product revenue, customer count, net or gross retention, churn,
              renewal rates, contract duration, cohort expansion, satisfaction, pricing, or procurement cycle. They also
              do not identify top-customer exposure, channel concentration, or commercial partner dependence. Trial
              continuation and additional cohorts demonstrate ongoing clinical execution, but they are not substitutes
              for renewal or land-and-expand evidence. This distinction matters because the eventual commercial pathway
              will depend on approval, prescribing behavior, reimbursement, access, and supply arrangements that are not
              established in the assigned pool. The journey map separates observed research and trial stages from
              explicitly prospective regulatory and commercial stages; it should not be read as a forecast of approval
              or adoption. Diligence should seek private contracting, market-access, and concentration schedules before
              attributing customer durability to the clinical milestones.
