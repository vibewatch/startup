      - number: '1.2'
        title: Financing History, Public Listing, and Liquidity Position
        blocks:
          - type: paragraph
            body: >-
              Eikon Therapeutics raised over $668 million across its early private venture rounds, including a $517.8
              million Series B financing closed in early 2022 led by T. Rowe Price Associates alongside sovereign wealth
              and crossover institutions including CPP Investments, EcoR1 Capital, UC Investments, ADIA, StepStone
              Group, and General Catalyst. The company later completed a public listing on the Nasdaq Global Market
              under the ticker EIKN. Effective June 26, 2026, Eikon was officially reconstituted into the Russell 3000
              Index, broadening institutional index ownership among managers including FMR LLC, BlackRock, and Merck &
              Co.


              From a balance sheet perspective, Eikon reported holding $596.0 million in cash, cash equivalents, and
              marketable securities as of March 31, 2026. Management has guided that this liquidity position is expected
              to fund planned clinical and operational activities into the second half of 2027. First-quarter 2026
              research and development expenses reached $70.0 million, up 24% year-over-year from $56.6 million in the
              prior-year period, driven by expanding late-stage clinical trials and a $5.0 million development milestone
              paid to licensor Impact Therapeutics (Shanghai) Inc. First-quarter general and administrative expenses
              were $17.3 million, yielding an overall quarterly net loss attributable to common stockholders of $83.0
              million.
