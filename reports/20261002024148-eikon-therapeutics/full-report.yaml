      - number: '1.3'
        title: Clinical Pipeline Evolution and Strategic Development Milestones
        blocks:
          - type: paragraph
            body: >-
              Eikon's corporate strategy combines internally discovered assets derived from its proprietary SMT
              microscopy platform with clinically advanced in-licensed assets. The clinical pipeline is led by three
              priority oncology programs: EIK1001, EIK1003, and EIK1005. Lead asset EIK1001 is an investigational,
              systemically administered dual-agonist of Toll-like receptors 7 and 8 (TLR7/8). In its Phase 2
              TeLuRide-005 trial in first-line stage 4 non-small cell lung cancer (NSCLC) in combination with
              pembrolizumab and chemotherapy, EIK1001 demonstrated a 63.1% objective response rate (ORR) and a 90.8%
              disease control rate (DCR) across 65 efficacy-evaluable patients as of the May 4, 2026 data cutoff.


              EIK1003 is an investigational, highly selective PARP1 inhibitor licensed from Impact Therapeutics designed
              to spare PARP2 signaling to reduce hematologic toxicity. In the Phase 1/2 EIK1003-001 study, EIK1003
              achieved a 14.3% ORR as monotherapy (Cohort 1A, n=49) and a 24.5% ORR in combination with weekly
              paclitaxel (Cohort 1C, n=53) across advanced solid tumor cohorts. The third lead program, EIK1005, is an
              internally discovered WRN helicase inhibitor targeting microsatellite instability-high (MSI-H) tumors that
              commenced Phase 1/2 clinical dosing in February 2026. However, Eikon continues to incur substantial
              operating cash outflows and recurring quarterly net losses ($83.0 million in Q1 2026), and corporate
              disclosures maintain warnings that ongoing operations will require substantial additional financing before
              commercialization.
