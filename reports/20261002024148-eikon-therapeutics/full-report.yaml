      - number: '2.3'
        title: Buyer, user, and payer map
        blocks:
          - type: paragraph
            body: >-
              The sources support a clinical-development model, not a conventional customer funnel. Patients and
              clinicians would ultimately use or benefit from approved medicines, while Eikon presently bears
              development costs and capital providers fund the company. Potential pharmaceutical partners or licensees
              could become economic counterparties, but the assigned evidence names no platform customer, contract
              price, procurement owner, reimbursement path, or external platform revenue. Internally, discovery
              scientists and clinical teams are the platform users; management and the board allocate research capital.
              This distinction matters because investor demand, index inclusion, and analyst price targets can improve
              financing access without demonstrating product adoption or a payer's willingness to reimburse a drug.
