      - number: '7.4'
        title: Mitigations, monitors, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The most useful disclosed clinical mitigation is staged governance: an independent committee reviewed
              TeLuRide-006 and selected a regimen before expansion. That does not mitigate endpoint failure, so the
              thesis breaks if registrational evidence fails to show a clinically meaningful benefit or if safety
              prevents intended combinations. Financing risk becomes acute if reported liquidity or guidance no longer
              supports at least twelve months of the active development plan without highly dilutive capital. License
              risk becomes thesis-breaking if diligence finds missing field or territory rights, burdensome obligations,
              or unresolved freedom to operate. Operating risk requires data-room proof: trial enrollment and
              discontinuations, inspection history, CMC comparability, vendor concentration, incident logs, disaster
              recovery, and security controls. Until those records are reviewed, mitigation maturity should remain
              provisional rather than assumed.
