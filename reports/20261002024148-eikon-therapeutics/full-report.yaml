      - number: '6.3'
        title: Named proof is clinical, not commercial
        blocks:
          - type: paragraph
            body: >-
              No retained source identifies a named paying customer, production deployment, purchase volume, commercial
              contract, or customer outcome. The strongest named proof consists instead of identified clinical programs
              and their participant populations. The company-issued release distributed by Nasdaq describes
              pembrolizumab-containing study regimens, but it does not disclose a customer relationship, economic terms,
              or a commercial commitment with pembrolizumab's owner; those facts should not be inferred. Toarn
              separately explains why standard B2B review platforms are not applicable and warns that available public
              sentiment evidence is thin. The assigned Zippia page is also unsuitable as customer proof because its
              disclosed data provenance concerns employment data rather than product use. The named-proof table
              therefore labels every row as a clinical proxy and explicitly avoids converting trial activity into
              customer validation.
