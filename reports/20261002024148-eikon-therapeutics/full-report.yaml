      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              The near-term financial case is liquidity-backed clinical execution, not revenue quality or demonstrated
              unit economics. The Q2 statement bridges a $93.4 million operating loss to an $88.4 million net loss
