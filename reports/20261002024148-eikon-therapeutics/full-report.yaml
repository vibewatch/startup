  - id: TV002
    title: Thesis and Anti-Thesis Analysis
    columns:
      - Dimension
      - Core Argument
      - What Would Change the View
    rows:
      - - Platform & Pipeline (Bull)
        - >-
          Super-resolution single-molecule tracking and advanced AI engineering accelerate discovery of selective
          targets such as EIK1003/EIK1004 (PARP1) and EIK1005 (WRN).
        - >-
          Failure of internally derived clinical candidates to show distinct clinical safety or therapeutic index
          advantages over competitor pipelines.
      - - Lead Asset Efficacy (Bull)
        - >-
          Lead program EIK1001 demonstrates systemic TLR 7/8 activation and synergistic combination efficacy with
          pembrolizumab across advanced melanoma and NSCLC.
        - Trial halts or sub-therapeutic response rates in ongoing TeLuRide-006 or TeLuRide-008 registrational studies.
      - - Financing & Dilution (Anti-Thesis)
        - >-
          Steep valuation reset from $3.6B peak private round to $971.7M IPO demonstrates severe public market
          skepticism and down-round restructuring.
        - >-
          Successful non-dilutive biopharma commercial licensing partnerships or sustained market re-rating following
          pivotal data.
      - - Cash Burn & Execution (Anti-Thesis)
        - >-
          Quarterly operating expenses of $93.4M and net loss of $88.4M in Q2 2026 necessitate large-scale equity
          refinancing before 2H 2027.
        - >-
          Material reduction in G&A overhead or acceleration of registrational timelines enabling earlier regulatory
          submissions.
