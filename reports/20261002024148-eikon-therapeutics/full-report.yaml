  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Live-Cell Single-Molecule Tracking Microscopy and Discovery Platform
        blocks:
          - type: paragraph
            body: >-
              Eikon's discovery platform is built on innovations originating from its scientific co-founders' Nobel
              Prize-winning super-resolution fluorescence microscopy work [CE001]. The core operating model measures
              protein movement and real-time kinetics in living cells at molecular resolution [CE001, CE002].
              Traditional drug discovery methods often rely on biochemical binding assays or static structural imaging
              of purified proteins, which fail to capture dynamic protein-protein interactions and transient binding
              states within intact cellular environments [CE001, CE003]. By tracking individual fluorescently tagged
              protein molecules in real time across living human cells, Eikon seeks to interrogate otherwise intractable
              or 'undruggable' target classes [CE001, CE002]. Operating this discovery engine requires custom
              high-throughput optical instrumentation, precision motion control, and high-speed data acquisition
              hardware designed and built in-house [CE002, CE004]. The engineering architecture integrates advanced
              optomechanical assemblies, automated robotic plate handling, and high-density printed circuit board
              assemblies with high-speed interfaces to capture massive biological data streams [CE004, CE005]. This
              hardware layer feeds directly into high-content dataset processing pipelines capable of quantifying
              single-molecule trajectory dynamics at scale across thousands of compound perturbations [CE002, CE005].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
