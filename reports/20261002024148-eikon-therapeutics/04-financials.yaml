company:
  name: "Eikon Therapeutics"
chapter:
  number: 4
  title: "Financials"
  summary: "Eikon is pre-commercial: independent market-data pages report no revenue, while the company's unaudited Q2 2026 results show $93.4 million of operating expenses and an $88.4 million net loss. The $531.2 million June liquidity balance and management's runway guidance into the second half of 2027 provide time, but not evidence of self-funding; pricing, gross margin, debt terms, and trial-level cash requirements remain underwriting gaps."
sections:
  - id: "revenue-model-and-commercial-status"
    title: "Revenue Model, Commercialization Posture, and Pre-Revenue Economics"
    body: "The assigned evidence supports a pre-revenue conclusion, not a mature revenue model. Trendlyne reports $0 million of quarterly revenue for June 2026, and Seeking Alpha displays a $0.00 consensus revenue estimate for fiscal 2026 [CI001, CI002]. Neither page establishes product pricing, customer contracts, collaboration receipts, royalties, or recognized revenue by stream. Eikon's own releases describe clinical programs and expenses rather than commercial sales. Therefore ARR, GMV, customer acquisition cost, payback, and gross margin cannot be calculated from the public evidence and should remain explicit gaps rather than being forced into a software-style model. Any future product, licensing, milestone, or royalty economics remain contingent and require agreement-level evidence before underwriting."
    claimRefs:
      - "CI001"
      - "CI002"
    tableRefs:
      - "TI001"
  - id: "operating-expenses-and-cost-structure"
    title: "Operating Expense Trajectory, R&D Clinical Intensity, and Cost Structure"
    body: "Clinical development is the dominant reported cost center. Q2 2026 R&D expense was $75.5 million versus $69.2 million a year earlier, and management attributed the increase principally to $12.8 million of higher direct R&D expense as trial activity advanced, plus $1.7 million of higher compensation [CI003, CI004]. Q2 G&A was $17.9 million versus $40.5 million in Q2 2025; the comparison is distorted by prior-year property and lease impairments, so the 56% decline should not be treated as a sustainable efficiency gain [CI005]. Total operating expense was $93.4 million for Q2 and $180.7 million for the first half [CI006]. A separate $5.0 million Q1 development milestone to Impact Therapeutics illustrates that licensed-program obligations can create lumpy costs beyond recurring payroll and trial spend [CI007]."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
    tableRefs:
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "capital-adequacy-and-financing-dependency"
    title: "Liquidity Position, Accounting Losses, and Capital Adequacy"
    body: "Cash, cash equivalents, and marketable securities declined from $596.0 million at March 31, 2026 to $531.2 million at June 30, a $64.8 million change in the reported liquidity balance [CI011, CI012, CI013]. That change is not interchangeable with cash burn because the pool lacks a Q2 cash-flow statement and because purchases and maturities of marketable securities can change balance-sheet classifications. Q2 net loss was $88.4 million and first-half net loss was $171.4 million; both are accounting losses, not cash-use measures [CI008, CI009]. Trendlyne separately reports 2025 cash from operating activities of negative $188.5 million, which is historical and should be reconciled to the filed statements before scenario use [CI015]. Management expects current liquidity to fund operations into the second half of 2027, but that remains company guidance rather than a committed financing facility [CI014]."
    claimRefs:
      - "CI008"
      - "CI009"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial Verdict and Diligence Blockers"
    body: "The near-term financial case is liquidity-backed clinical execution, not revenue quality or demonstrated unit economics. The Q2 statement bridges a $93.4 million operating loss to an $88.4 million net loss largely through $5.0 million of net interest income [CI010, CI016]. The cash balance creates a finite development window, while the public pool does not resolve future trial enrollment costs, commercial manufacturing economics, milestone and royalty schedules, debt or lease covenants, or launch pricing. Accordingly, the runway claim should be sensitivity-tested against program-level cash budgets and milestone timing. A financing conclusion beyond management's stated horizon would be speculative without a full cash-flow forecast and contractual obligations schedule."
    claimRefs:
      - "CI010"
      - "CI014"
      - "CI016"
