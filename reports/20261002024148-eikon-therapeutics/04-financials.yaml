callouts:
  - calloutType: "risk"
    title: "Runway Is Guidance, Not Financing Certainty"
    body: "Management's runway guidance extends into the second half of 2027, but the assigned evidence does not disclose the program-level cash forecast, debt capacity, covenant headroom, or milestone schedule behind that statement. Downside cases should therefore test clinical timing and cost changes without assuming that accounting net loss equals cash burn."
    claimRefs:
      - "CI009"
      - "CI014"
      - "CI015"
  - calloutType: "insight"
    title: "No Revenue-Quality Conclusion Yet"
    body: "Reported and consensus revenue are zero, so there is no observed mix, recurrence, pricing realization, or gross margin to score. Financial diligence should keep those fields null until contracts, launch assumptions, and manufacturing economics are available."
    claimRefs:
      - "CI001"
      - "CI002"
