callouts:
  - calloutType: "risk"
    title: "Asymmetric Dependence on In-Licensed Clinical Assets"
    body: "Eikon's commercial value is heavily decoupled from its core platform: the lead assets driving near-term registrational catalysts (EIK1001, EIK1003, EIK1004) were acquired or in-licensed externally. If EIK1001 encounters efficacy or safety headwinds in registrational melanoma or NSCLC trials, investors will face immediate valuation impairment before the internal SMT platform can deliver mature clinical candidates."
    claimRefs:
      - "CP001"
      - "CP005"
      - "CP014"
