    title: "Recommendation Stance: Track Pending Pivotal Clinical Verification"
    body: "Eikon's dramatic valuation reduction from $3.6B to under $1.0B post-IPO substantially de-risks entry multiples for long-term biotechnology investors. However, given quarterly net losses approaching $88.4M and the binary risk profile of lead asset EIK1001 in advanced melanoma and NSCLC, capital commitment should remain deferred until independent registrational data validate the therapeutic index."
    claimRefs:
      - "CV003"
      - "CV005"
      - "CV009"
      - "CV010"
  - calloutType: "risk"
    title: "Down-Round Overhang and Liquidity Depletion Horizon"
    body: "Eikon's Series D round in February 2025 involved down-round repricing across Series B-1 and Series C-1 shares at $5.84 per share. While the February 2026 IPO provided $381.2M in gross proceeds, current cash reserves of $531.2M will be fully depleted by late 2027 at the current $350M+ annualized operational run rate without additional financing."
