      - [GuruFocus, "2026-02-26", United States, "$803.83M market capitalization", null, "Third-party market-data snapshot", Medium, "Capital-market value; not market size"]
      - [Kalkine, "2026-03-19", United States, "$635.14M market capitalization", null, "Third-party intraday article snapshot", Low, "Article contains generic sector commentary"]
      - [Seeking Alpha, "2026-06-12", United States, "$596M cash; runway into 2027", null, "Independent analyst summary", Medium, "Paywalled excerpt; not addressable demand"]
      - [Yahoo Finance, "2026-10-01", United States, "$401.363M intraday market capitalization", null, "Delayed public-market quote", Medium, "Point-in-time equity value"]
      - [Yahoo Finance, "Most recent quarter shown 2026-10-01", United States, "$531.18M total cash", null, "Delayed financial-data snapshot", Medium, "Cash is not revenue, TAM, or available budget after obligations"]
    notes: >-
      Values preserve each publisher's metric, date, and denomination. No CAGR was available in the
      assigned evidence; market capitalization, cash, and runway are valuation or financing lenses,
      not substitutes for product-market sizing.
    claimRefs: [CM002, CM004, CM005, CM006, CM007, CM012]
  - id: TM003
    title: Segment, buyer, user, and payer map
    columns:
      - Segment
      - Buyer
      - User or beneficiary
      - Payer or capital source
      - Workflow and budget owner
      - Adoption trigger
    rows:
      - [Internal drug discovery, "Eikon R&D leadership", "Discovery scientists", "Corporate cash and equity capital", "R&D portfolio allocation", "More informative target or molecule decisions"]
      - [Clinical oncology programs, "Eikon clinical leadership", "Investigators and patients", "Corporate capital; future payer not evidenced", "Clinical-development budget", "Safety, efficacy, and regulatory progress"]
      - [Potential partnering, "Pharmaceutical business-development team", "Partner development organization", "Partner licensing and development budget", "Business development; no counterparty evidenced", "Differentiated clinical or platform proof"]
      - [Commercial medicine, "Healthcare system or prescriber", "Patients and clinicians", "Insurer, government, or patient; not evidenced", "Reimbursement and formulary process", "Approval, comparative value, access, and trust"]
      - [Public equity financing, "Institutional and retail investor", "Company capital base", "Investor portfolio", "Investment allocation rather than procurement", "Clinical catalysts, liquidity, and risk-adjusted return"]
    notes: >-
      This is a role map, not a verified customer list. External platform customers, contracts,
      reimbursement, pricing, and commercial budget owners remain unverified in the assigned pool.
    claimRefs: [CM001, CM003, CM011, CM013, CM014, CM015, CM016]
