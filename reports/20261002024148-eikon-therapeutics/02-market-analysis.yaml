      - [In-licensed oncology assets, "License and clinical-development economics", "Assets outside Eikon's pipeline", "Eikon capital allocator and potential partner", "Alternative route into the pipeline"]
      - [AI drug discovery, "Only overlap directly used in Eikon's development workflow", "Broad third-party AI software revenue", "No external Eikon platform buyer identified", "Adjacency, not a supported TAM"]
      - [Public biotechnology capital, "Equity financing and institutional ownership", "Drug sales and customer demand", "Public investors and index-tracking funds", "Funding channel, not operating market"]
    notes: >-
      Boundary is synthesized from company-issued positioning and independent analyst coverage;
      no source in the assigned pool quantifies included spend, external platform pricing, or payers.
    claimRefs: [CM001, CM002, CM008, CM014, CM016]
