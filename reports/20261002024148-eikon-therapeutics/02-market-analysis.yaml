        - label: Oncology TAM
          value: "Not evidenced"
          detail: "No methodology-based total market estimate appears in the assigned pool."
        - label: Eikon SAM
          value: "Not evidenced"
          detail: "No indication, geography, price, eligible population, or payer model supports a serviceable market."
        - label: Eikon SOM
          value: "Not evidenced"
          detail: "No approved product, external customer count, market share, or conversion basis is provided."
        - label: October 1 market capitalization
          value: 401.363
          unit: "$M"
          detail: "Yahoo Finance intraday market capitalization; not operating-market size."
        - label: Most-recent-quarter cash
          value: 531.18
          unit: "$M"
          detail: "Yahoo Finance total cash; funding capacity is not cash available without qualification."
        - label: October 1 closing share price
          value: 7.41
          unit: "$ per share"
          detail: "Yahoo Finance delayed close; a public-market signal rather than buyer demand."
    approximationNotes: >-
      No arithmetic transformation is applied. Dates, units, and publisher labels are retained;
      unsupported TAM, SAM, and SOM layers are shown as gaps rather than estimated values.
    claimRefs: [CM002, CM004, CM005, CM006, CM016]
callouts:
  - calloutType: risk
    title: Do not capitalize a generic AI-drug-discovery TAM
    body: >-
      The retained evidence does not show that Eikon sells its platform externally. Until pricing,
      customers, contracts, or licensing economics are produced, valuation should be tied to
      program-level clinical outcomes and financing capacity rather than a broad software multiple.
    claimRefs: [CM002, CM003, CM009, CM010, CM016]
