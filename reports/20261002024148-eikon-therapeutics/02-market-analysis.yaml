  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing-gap
      missingEvidence: >-
        Indication-level patient populations, geography, treatment eligibility, expected price,
        duration, competitive share, and probability-adjusted uptake needed for TAM, SAM, and SOM.
      whyItMatters: >-
        Without these denominators, a product-market estimate would create false precision and
        could overstate the economic opportunity.
      diligencePath: >-
        Obtain management's indication-level commercial model and reconcile it to epidemiology,
        treatment guidelines, comparable launch curves, and payer research.
      relatedQuestionRefs: [QM003, QM008]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: buyer-and-payer-gap
      missingEvidence: >-
        External platform customers, partnering discussions, contract economics, budget owners,
        procurement criteria, reimbursement assumptions, and willingness-to-pay evidence.
      whyItMatters: >-
        These facts determine whether the platform has an external market and whether eventual
        medicines can convert clinical benefit into reimbursed demand.
      diligencePath: >-
        Review data-room contracts and pipeline, interview business-development leadership and
        prospective partners, and commission indication-specific payer research.
      relatedQuestionRefs: [QM005, QM006]
      relatedTableRefs: [TM003]
    - type: conflicting-data
      severity: material
      topic: valuation-dispersion
      missingEvidence: >-
        A date-aligned capitalization table and audited quarter-end cash reconciliation covering
        share count, restricted cash, debt, commitments, and post-period financing.
      whyItMatters: >-
        Market capitalization and cash snapshots use different dates and cannot establish enterprise
        value, runway, or operating-market demand without reconciliation.
      diligencePath: >-
        Reconcile SEC filings and transfer-agent share counts to same-day market data and management's
        cash runway model before using valuation ratios.
      relatedQuestionRefs: [QM004, QM008]
      relatedTableRefs: [TM002]
