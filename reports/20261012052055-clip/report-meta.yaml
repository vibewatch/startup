companyProfile:
  summary: >-
    Clip is a late-stage private Mexican SMB payments platform founded in 2012 and headquartered in Mexico City. It
    sells POS hardware, digital payment links, online checkout, merchant lending, and a consumer wallet, monetizing
    through transaction fees, hardware, and adjacent financial services while maintaining opaque audited financial
    disclosure.
