callouts:
  - calloutType: insight
    title: 'The Flat $2.0B Valuation Defense: Growth Durability vs. Recapitalization Risk'
    body: Clip's $100M capital injection in June 2024 from Morgan Stanley Tactical Value at an unchanged $2.0B post-money valuation signals institutional conviction, but also reflects a structured valuation defense in a tighter Latin American VC market. While maintaining the headline unicorn price avoids public down-round stigma, potential senior liquidation preference overhang and lack of audited profitability data reinforce our recommendation to track the asset and require verified financial statements before new capital deployment.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV014
