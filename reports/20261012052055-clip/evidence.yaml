evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-unit-economics
    missingEvidence: >-
      Audited annual financial statements disclosing total payment volume (TPV), net take rate, gross profit, operating
      expenses, and cash burn.
    whyItMatters: >-
      Without audited financials or disclosed take rates, whole-company unit economics and underlying cash runway cannot
      be independently verified from public disclosures alone.
    diligencePath: >-
      Request audited 2024-2025 financial statements, audited revenue recognition schedules, and cohort-level take-rate
      reports during formal management diligence.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: capitalization-table-and-governance-representation
    missingEvidence: >-
      Comprehensive shareholder register, voting power distribution, preferred liquidation preferences, and formal board
      of directors composition.
    whyItMatters: >-
      Secondary liquidity terms, debt seniorities, and exact investor equity ownership percentages remain private,
      leaving control and preference overhang unverified.
    diligencePath: >-
      Obtain the certified capitalization table, series-specific investor rights agreements, and current board seat
      resolutions.
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: audited-tpv-and-take-rate
    missingEvidence: >-
      Audited figures for Total Payment Volume (TPV), net take rate, active terminal counts, and merchant cohort churn
      rates.
    whyItMatters: >-
      Without audited transaction volume and cohort retention disclosures, total market share and monetization quality
      cannot be independently verified.
    diligencePath: Request audited 2024-2025 financial statements and cohort retention disclosures from Clip management.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: merchant-retention-and-multi-homing
    missingEvidence: >-
      Audited merchant churn rates, active device utilization ratios, and terminal multi-homing metrics across micro and
      SMB merchant cohorts.
    whyItMatters: >-
      Without merchant cohort retention data, assessing Clip's terminal lock-in and true defensibility against Mercado
      Pago and bank acquirers remains speculative.
    diligencePath: >-
      Request anonymized merchant cohort retention tables, monthly active terminal counts, and secondary terminal
      displacement rates in data room.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: blocking
    topic: financial-statements
    missingEvidence: >-
      Audited financial statements for fiscal years 2024-2025 showing TPV, net revenue, cost of services, and operating
      profit.
    whyItMatters: >-
      Without audited financial statements, underwriting Clip's path to profitability and unit gross margins remains
      speculative.
    diligencePath: Obtain audited financial statements and board-approved management accounts under non-disclosure agreement.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cash-burn-and-runway
    missingEvidence: Current cash on balance sheet, monthly cash burn trajectory, and capital expenditure breakdown.
    whyItMatters: >-
      Determines how long the US$500 million 2026 financing will sustain digital wallet deployment and regulatory
      capital requirements.
    diligencePath: Request monthly treasury reports and forward cash runway models during confirmatory diligence.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: hardware-failure-and-firmware-telemetry
    missingEvidence: >-
      Audited telemetry regarding POS terminal hardware component failure rates, average device operating lifespans, and
      Over-the-Air (OTA) firmware update success rates.
    whyItMatters: >-
      Terminal reliability and hardware replacement cycles directly dictate hardware gross margins and merchant
      satisfaction in retail locations.
    diligencePath: >-
      Request engineering support logs, device RMA warranty claim records, and fleet management telemetry dashboards
      from Clip operations.
  - type: private-evidence-only
    severity: material
    topic: system-uptime-and-latency-benchmarks
    missingEvidence: >-
      Historical SLA compliance documentation, transaction latency distributions, and peak-hour incident post-mortems
      across domestic clearing switches.
    whyItMatters: >-
      Payment gateway downtime during retail shopping events immediately results in merchant transaction churn and lost
      interchange revenues.
    diligencePath: Obtain third-party status page history, cloud architecture runbooks, and payment gateway SLA audit reports.
  - type: private-evidence-only
    severity: material
    topic: cohort-retention-and-churn-rates
    missingEvidence: >-
      Audited merchant retention, net revenue retention (NRR), gross revenue retention (GRR), and active device churn
      rates by annual merchant cohort.
    whyItMatters: >-
      Without cohort-level retention or churn disclosures, it is impossible to verify whether top-line merchant growth
      reflects durable compounding adoption or high customer acquisition cost churn replacement.
    diligencePath: >-
      Request private merchant cohort retention tables and terminal deactivation statistics broken down by merchant size
      and vintage from management.
    relatedQuestionRefs:
      - QU009
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive census of enterprise and mid-market named merchant customer contracts and verified transaction
      volume by account.
    whyItMatters: >-
      Public merchant proof is restricted to qualitative SMB testimonials and aggregate brand statistics, leaving
      customer concentration and top-tier merchant volume unverified.
    diligencePath: >-
      Obtain an anonymized customer concentration schedule showing top 20 merchant gross processing volumes and contract
      renewal provisions.
    relatedQuestionRefs:
      - QU001
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: regulatory-legal
    missingEvidence: >-
      Product-by-product authorization matrix, legal-entity map, regulator correspondence, litigation schedule, privacy
      assessments, compliance audits, and incident register.
    whyItMatters: >-
      These materials determine whether Clip may lawfully and safely operate its expanded payment, wallet, savings, data
      and credit surfaces.
    diligencePath: >-
      Require Mexican regulatory counsel to reconcile products, entities, licenses, sponsor arrangements and open
      matters, then review board and audit-committee incident records.
    relatedQuestionRefs:
      - QR001
      - QR002
      - QR008
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: operating-resilience
    missingEvidence: >-
      Uptime, recovery tests, fraud and chargeback losses, credit vintages, model validation, customer complaints,
      security testing, and material-incident history.
    whyItMatters: >-
      Public product claims do not quantify the loss and resilience profile created by card-not-present, wallet and
      credit activity.
    diligencePath: >-
      Review monthly operating and risk packs, incident postmortems, penetration tests, disaster-recovery results, loss
      cohorts and risk-limit exceptions.
    relatedQuestionRefs:
      - QR002
      - QR004
      - QR008
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: financial-resilience
    missingEvidence: >-
      Audited revenue, gross profit, contribution margin, burn, cash, debt, committed facilities, working capital, and
      product-level unit economics.
    whyItMatters: >-
      Funding raised and transaction pricing do not establish cash availability, profitability, runway, or capacity to
      absorb fraud and credit losses.
    diligencePath: >-
      Reconcile audited statements to bank balances, cap table, debt agreements, board budgets and product-level cohort
      economics.
    relatedQuestionRefs:
      - QR005
      - QR007
      - QR008
    relatedTableRefs:
      - TR002
      - TR003
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: >-
      Critical-vendor inventory, spend and transaction concentration, SLAs, termination rights, portability,
      sponsor-bank dependencies, and tested substitutes.
    whyItMatters: Named partners establish ecosystem breadth but not continuity if a critical counterparty withdraws or fails.
    diligencePath: >-
      Inspect contracts and concentration reports, identify single points of failure, and witness failover or migration
      tests for every critical dependency.
    relatedQuestionRefs:
      - QR003
      - QR008
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: audited financials and unit economics
    missingEvidence: >-
      Audited FY2024-2025 financial statements specifying total payment volume (TPV), net take rate, gross profit
      margin, and net income.
    whyItMatters: >-
      Without audited figures, Clip's estimated $173M revenue run-rate and implied ~11.6x revenue multiple cannot be
      verified against historical cash burn or EBITDA profitability.
    diligencePath: >-
      Request audited financial statements and board-approved management accounts during confirmatory diligence under
      NDA.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
      - TV003
  - type: private-evidence-only
    severity: material
    topic: liquidation preference and cap table structure
    missingEvidence: >-
      Full cap table and shareholder agreement details revealing seniority, participating liquidation preferences, or
      guaranteed return hurdles from the Morgan Stanley Tactical Value $100M round.
    whyItMatters: >-
      Senior structured terms or preference overhang could substantially impair common shareholder recovery in downside
      or sub-$2.0B exit scenarios.
    diligencePath: >-
      Review certificate of incorporation, series term sheets, and investor rights agreements with company legal
      counsel.
    relatedQuestionRefs:
      - QV009
    relatedTableRefs:
      - TV001
