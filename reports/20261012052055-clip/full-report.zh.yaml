              Clip，目标是把未充分银行化的消费者接入正规金融机制，并提供数字账户、储蓄工具和基于交易的信贷（CE010）。平台利用交易遥测生成信用评分洞察，并用长期 POS
              现金流数据，在没有传统征信记录的情况下评估未开户零售商的商户现金预支和营运资金资格（CE011）。为提高用户采用率和金融素养，Clip 与 TelevisaUnivision
