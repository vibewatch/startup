        title: 伙伴、平台与执行依赖
        blocks:
          - type: paragraph
            body: >-
              扩张策略依赖广泛的外部系统：第三方报道提到 Ant International、Mastercard 和 TelevisaUnivision 参与 Mi Clip 上线；历史公司公告则称有 19
              多家银行和伙伴支持支付受理。2024 年投资还来自 Morgan Stanley 管理的基金及另一家投资者，Clip
              称资金将加速产品开发。这些事实说明公司能获得资本和有能力的交易对手，却不说明可替代性、服务水平、集中度、终止权或后续资金承诺。投资尽调应取得关键供应商地图，以及按交易对手拆分的收入 /
              成本暴露。若失去必要的发起方、网络、云服务或钱包技术伙伴而没有经过测试的替代方案，或依赖新资本维持日常运营，应停止追加资本。
            claimRefs:
              - CR005
              - CR007
              - CR009
              - CR013
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR007
