      - CV010
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 运营假设
      - 隐含估值 / 倍数
      - 关键风险与下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - CAGR 超过 35%，TPV 加速；借助 Belvo 扩张信贷；Mi Clip 钱包成功获得采用。
        - $2.8B - $3.5B（7.0x - 8.8x 远期收入）
        - 消费者钱包采用受阻；宏观下行期间信贷评估失误。
        - 25%
      - - 基准情景
        - 年收入增长 20% - 25%，3.6% 收取率稳定，PrestaClip 有纪律地铺开。
        - $1.8B - $2.2B（5.5x - 6.5x 远期收入）
        - 金融科技估值倍数压缩；Nubank 和 Revolut 带来的竞争性获客成本上升。
        - 50%
      - - 悲观情景
        - 增长放缓至低于 15%，PrestaClip 核销增加，收单竞争挤压利润率。
        - $1.0B - $1.4B（3.5x - 4.5x 远期收入）
        - 高级优先权悬压抹去初级股权价值；需要通过下轮融资重组资本结构。
        - 25%
    notes: 情景以 3 年潜在结果为模型，采用与公开及私有拉美金融科技可比公司一致的收入倍数。
    claimRefs:
      - CV011
      - CV012
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 关键运营、资本化和产品里程碑，展示 Clip 从 2012 年成立到 2026 年推出钱包的演进。
    data:
      items:
        - label: 2012 — 在墨西哥城成立
          detail: Clip 由 Adolfo Babatz 创立，为服务不足的墨西哥商户提供移动刷卡设备。
          tone: neutral
        - label: 2013 — 首轮外部融资
          detail: 获得初始风险资本融资，用于启动商业运营并搭建自有银行卡处理技术。
          tone: positive
        - label: 2020 — 收购 Swap
          detail: 收购电子支付机构 Swap，整合钱包能力和数字支付基础设施。
          tone: positive
        - label: 2021 — 通过 D 轮融资成为独角兽
          detail: 完成由 SoftBank 和 Viking Global 领投的 2.5 亿美元融资，估值达到 20 亿美元，成为墨西哥首家支付独角兽。
          tone: positive
        - label: 2024 — $100m D 轮追加融资
          detail: 从 Morgan Stanley Tactical Value 和一家西海岸共同基金获得 1 亿美元，估值维持在 20 亿美元不变。
          tone: positive
        - label: 2025 — BrandZ 墨西哥品牌前 30
          detail: 在 Kantar BrandZ 最具价值的 30 个墨西哥品牌中，Clip 是最年轻的品牌，也是唯一一家金融科技公司，品牌价值为 9.83 亿美元。
          tone: positive
        - label: 2025 — Belvo Open Finance 联盟
          detail: 将 Belvo 的就业数据和自动账户扣款整合进 PrestaClip，扩大面向未开户商户的贷款业务。
          tone: opportunity
        - label: 2026 — 推出 Mi Clip 数字钱包
          detail: 与 Ant International、Mastercard 和 TelevisaUnivision 合作推出消费者数字钱包，着手应对墨西哥现金交易占主导的现状。
          tone: positive
    approximationNotes: 里程碑综合自已验证的公司新闻稿、Morgan Stanley 披露和合作伙伴发布内容。
    claimRefs:
      - CO001
      - CO006
      - CO007
      - CO010
      - CO011
