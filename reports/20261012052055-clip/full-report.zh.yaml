      - number: '2.3'
        title: 增长驱动、基础设施合作与运营约束
        blocks:
          - type: paragraph
            body: >-
              Clip 的市场扩张由智能手机广泛普及、消费者转向数字钱包及生态合作等结构性顺风推动。为支撑规模化，公司与 Ant International 合作，获得 AI 驱动的支付基础设施和 El Buen Fin
              等大型零售活动的高并发处理能力；与 Mastercard 合作，推进支付网络互操作和规划中的跨境汇款；与 TelevisaUnivision 合作，扩大全国媒体覆盖并开展金融教育。Kantar BrandZ 对
              Clip 的独立消费者认知也强化了品牌分发，估计其 2025 年品牌价值约为 $983 million。但公司仍受多重运营约束：商户对处理费高度敏感，非正式零售偏好难以追踪的现金，Mercado Pago、Nu
              Mexico 等资金充足的区域平台竞争激烈，同时还要承担 CNBV 监管下的合规义务。
            claimRefs:
              - CM013
