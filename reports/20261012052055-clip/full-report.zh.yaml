  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、可触达支出与现金替代
        blocks:
          - type: paragraph
            body: >-
              Clip 瞄准墨西哥商业支付生态，重点服务长期游离于传统银行体系之外的中小企业。商业机会来自现金替代：在整个经济中，现金仍是主导交易媒介。行业分析师引用的 2024 年官方 ENIF 调查基准显示，500
              Mexican pesos 以下的零售购买中约 85% 使用实体现金完成，近 40% 的墨西哥成年人无法获得正规金融服务。从宏观看，尽管墨西哥是全球人口第十多的国家，约 80%
              的个人消费支出仍以现金完成。Clip 以自有硬件和软件生态——从低门槛读卡器、触摸屏智能终端到远程结账链接——承接从非正式实体现金流向数字结算渠道的交易支出。
            claimRefs:
