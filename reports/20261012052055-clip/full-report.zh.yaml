  - id: TV002
    title: 正反论点表
    columns:
      - 投资维度
      - 核心论点
      - 反论点 / 脆弱点
      - 什么会改变判断
    rows:
      - - 商户分发
        - 超过 75% 的商户此前只收现金，因此 Clip 在 SMB 中拥有主导性的品牌认知。
        - 竞争对手激进的终端折扣可能拖慢新增商户，并削弱定价权。
        - 商户净新增持续为正，且可验证的商户留存队列超过 85%。
      - - 产品变现
        - 卡、代金券和分期融资统一采用透明的 3.6% + IVA 收取率。
        - 新银行提供捆绑收单服务，带来的价格竞争可能压缩收取率。
        - 软件订阅费和支付以外的经常性收入得到验证并扩大。
      - - 信贷扩张
        - PrestaClip 利用 Belvo Open Finance 的就业数据，为未开户商户提供信贷评估。
        - 缺少完整银行牌照会推高融资成本，也使 Clip 暴露于信贷周期违约。
        - 第三方审计验证成熟队列的累计贷款损失率持续低于 5.0%。
      - - 平台生态
        - Mi Clip 消费者钱包与 Ant International、Mastercard 合作，具备闭环交易潜力。
        - 消费者钱包的采用需要大量获客支出和媒体补贴。
        - 能够量化、且直接源自 Mi Clip 消费者生态的交易量。
    notes: 将商业增长证据与结构性估值和市场风险综合对照。
