  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与直接同业生态
        blocks:
          - type: paragraph
            body: >-
              墨西哥数字支付和商户收单生态已从银行主导的双寡头，变成专业金融科技收单机构、激进数字银行集团和根深蒂固的传统银行网络混战的市场。Clip 自 2012
              年成立以来，按服务商户数已成为该国最大的数字支付和商业赋能平台，用自有硬件读卡器叠加商户软件和数字服务。但 MercadoLibre 的金融科技部门 Mercado Pago
              借助庞大的电商平台和消费者生态，交叉销售商户支付终端及营运资金，正加剧竞争。与此同时，Nu Mexico 等数字银行颠覆者持续积累数百万消费者存款账户，形成相邻分发能力，威胁传统商户收单边界。Clip
              依靠投资者联合体，以及与 Banorte、Televisa 等本土伙伴的战略协同，来强化商户分发渠道，对抗灵活的金融科技同业和传统商业银行收单机构；其资本支持包括 Morgan Stanley Tactical
              Value 2024 年提供的 $100 million 融资。
            claimRefs:
              - CP001
              - CP003
              - CP006
              - CP010
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
