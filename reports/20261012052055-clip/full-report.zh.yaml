          actor: 交易中的商户与消费者
          touchpoints:
            - 线下面对面非接触式、芯片卡和 Tap to Pay 卡交易处理
            - 通过社交消息生成远程支付链接，收取透明的 3.6% 加增值税费用
        - label: 获取营运资金
          stage: 融资与增值
          actor: 活跃 Clip 商户
          touchpoints:
            - 根据行为交易历史评估自动发出的信贷报价
            - 预批准的商户现金预支通过每日销售应收款自动偿还
        - label: 消费者数字钱包采用
          stage: 双边网络参与
          actor: 零售消费者与商户
          touchpoints:
            - 与 Ant International 和 Mastercard 共同推出 Mi Clip 消费者钱包应用
            - 数字储蓄和点对点转账绕开传统实体现金交易
        - label: 商业生态扩张与留存
          stage: 平台扩张
          actor: 成熟的多渠道商户
          touchpoints:
            - 目录管理、运营报告软件和多设备部署
            - 跨境支付受理及机构合作伙伴分发集成
  - id: FR001
    title: 剩余风险热力图
    type: matrix
    summary: 对六类有证据支持或明确界定缺口的风险，定性评估其影响、可能性和缓解措施成熟度。
    data:
