chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、业务覆盖与核心商业模式
        blocks:
          - type: paragraph
            body: >-
              Clip 由 Adolfo Babatz 于 2012 年创立，总部位于墨西哥城，是墨西哥面向中小企业的头部商户收单与数字商业赋能平台。公司要解决的是金融普惠的结构性障碍：在这个国家，现金长期占小型商业交易的
              85% 以上。Clip 的产品覆盖专用移动 POS 终端，包括 Clip Plus 2、Clip Total 3、Clip Ultra 和桌面式 Clip Stand 2，也包括远程数字支付链接和在线结账
              API。平台取消强制月租；数字支付链接收取 3.6% 加增值税的透明交易佣金，实体终端的促销费率则从 2.99% 加固定费用起，并即时结算至 Clip Cuenta 账户。作为后期私营金融科技公司，Clip
              在墨西哥城和布宜诺斯艾利斯设有跨境工程及商业团队，区域员工规模估计超过 1,400 人。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO006
              - CO007
              - CO009
              - CO013
      - number: '1.2'
        title: 管理层、治理与组织结构
        blocks:
          - type: paragraph
            body: >-
              Clip 的公司治理和战略执行由创始人兼 CEO Adolfo Babatz 主导。他在 2012 年创办 Clip 前曾负责 PayPal Mexico 的客户关系。Babatz
              仍深度影响产品方向、监管沟通和机构投资者关系，并担任公司的主要运营发言人。首席营销官 Armando Areias 负责商业品牌定位和商户营销；其多渠道获客活动帮助 Clip 进入 2025 年 Kantar
              BrandZ 墨西哥最具价值品牌前 30 名，也是其中唯一一家金融科技初创公司，估计品牌价值为 $983 million。外部治理和机构监督则通过董事会层面对接知名成长型股权伙伴得到加强，包括 Morgan
              Stanley Tactical Value（MSTV）董事总经理兼联席主管 Pedro Teixeira；该公司 2024 年联合领投融资后，他加入了 Clip
              的机构投资者联合体。这套治理结构把墨西哥非正式零售业的高速创业执行，与华尔街级别的财务及合规尽调结合起来。
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO010
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: 资本化轨迹、估值基准与投资者联合体
        blocks:
          - type: paragraph
            body: >-
              Clip 的资本化历史体现出顶级风险投资和机构私募股权联合体的持续支持。2021 年 6 月，公司完成由 SoftBank Latin America Fund 和 Viking Global Investors
              领投的 $250 million 融资，投后估值约 $2.0 billion，成为独角兽。2023—2024 年后期金融科技估值在全球普遍收缩之际，Clip 仍于 2024 年 6 月拿到 $100
              million 的 D 轮扩展融资。该轮由 Morgan Stanley Tactical Value 管理的投资基金与一家知名西海岸共同基金管理公司联合领投，成功守住 Clip $2.0 billion
              的投后估值基准。Clip 的股权结构表还包括 Ribbit Capital、General Atlantic、Goldman Sachs、Dalus Capital 和 Alta Ventures
              等顶级风投，以及 Banorte、Televisa 等本土战略巨头。Tracxn 等第三方数据库估计，公司 12 次融资累计募资达 $997 million；但公开公司披露只正式记录了截至 2024 年 D
              轮的核心股权融资，精确的清算优先权分配顺序和股权结构优先级仍需私下尽调确认。
            claimRefs:
              - CO006
              - CO007
              - CO008
              - CO009
