      - - 决策含义
        - 保持纪律
        - 在提供经审计的 FY2024-2025 财务报表和 PrestaClip 贷款损失账龄数据前，不投入资本。
    notes: 评估基于截至 2026 年 10 月的主要投资公告和二级市场可比数据。
