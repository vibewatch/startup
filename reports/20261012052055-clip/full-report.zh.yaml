      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 结构性现金替代是核心市场驱动
            body: Clip 的总可触达扩张根本上取决于替代现金，而不是挤走既有传统 POS 基础设施。墨西哥个人消费支出中 80% 以现金完成，500 MXN 以下购买中 85% 以纸钞结算；低摩擦收单由此释放出大量线下支出。
