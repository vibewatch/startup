  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品组合与商户工作流赋能
        blocks:
          - type: paragraph
            body: >-
              Clip
              提供一套多产品商业平台，专门把墨西哥现金主导的零售环境接入数字支付。商户先通过移动应用自行注册，无需传统银行材料，几分钟内即可受理借记卡、信用卡和餐饮代金券（vales）（CE001）。除实体刷卡受理外，Clip
              还用数字支付链接（Links de Pago）扩展商户能力，让企业无需固定硬件即可通过消息平台和社交网络销售（CE002）。这种数字模式下，借记卡、信用卡、代金券卡和现金支付点统一收取 3.6%
              加墨西哥增值税（IVA）（CE003）。为帮助小型零售商处理更大金额的交易，Clip 的数字工作流接入最长 24 个月的分期融资（Meses sin Intereses，即
