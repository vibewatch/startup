      - number: '1.4'
        title: 运营沿革、战略合作与市场逆风
        blocks:
          - type: paragraph
            body: >-
              Clip 的扩张路径已从单一读卡器逐步延伸为连接商户、贷款方和零售消费者的多产品金融生态。2020 年收购电子支付机构 Swap 是关键里程碑，为公司带来自有数字钱包基础设施和支付处理能力。2025 年 7
              月，Clip 将 Belvo 的开放金融数据套件接入 PrestaClip 信贷产品，利用经验证的就业指标和自动银行开户信息，进一步增强商户贷款能力，直接应对影响 30% 墨西哥贷款申请人的传统征信拒绝。2026
              年 6 月，Clip 与 Ant International、Mastercard 和 TelevisaUnivision 战略合作，推出 Mi Clip
              消费者数字钱包，启动迄今最大规模的生态扩张。但消费者业务仍面对强劲结构性逆风：墨西哥 500 pesos 以下的小额零售交易中，现金占比仍为 85%；Mercado Pago 和 Nu Mexico
              等区域金融科技巨头也在争夺相同的消费者和商户支付场景。
            claimRefs:
              - CO011
              - CO012
              - CO014
