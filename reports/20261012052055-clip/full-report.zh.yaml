            body: Clip 声称，墨西哥新数字商户中每三家有两家选择其终端；但 Mercado Pago 和 Nu Mexico 等资本充足的金融科技公司正积极扩张拉美支付业务，可能在价格敏感的小微商户中带来费率竞争和留存风险。
            calloutType: risk
