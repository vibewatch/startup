              - CP010
              - CP013
      - number: '3.2'
        title: 产品架构与能力差异化
        blocks:
          - type: paragraph
            body: >-
              墨西哥商户收单的差异化已从基础刷卡硬件转向整合软件和金融服务的生态。早期竞争集中于低价加密狗，如今商户需要全渠道受理、快速结算和配套金融工具。Clip 因此从实体 POS
              读卡器扩展到数字结账链接、远程账单、商户现金预支，以及 2025 年初上线的 Android Tap to Pay。为抵御 Mercado Pago 等综合金融科技平台，Clip 又于 2026 年 6 月推出
              Mi Clip 数字钱包，将消费者和商户账户与 Ant International、Mastercard 提供的支付基础设施连接起来。这种双边架构试图把线下商户 POS
              受理与消费者数字钱包打通，直接对抗区域科技巨头的完整闭环生态，同时保持无月租的易用商业框架。
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP006
              - CP007
              - CP008
      - number: '3.3'
        title: 定价透明度、单位费率与分发
        blocks:
          - type: paragraph
            body: >-
              商业定价既是 Clip 最大的获客引擎，也是其面对企业级收单巨头的脆弱点。Clip 对信用卡、借记卡、代金券和现金支付统一收取 3.6%
              加增值税的透明固定交易佣金，完全取消传统商业银行设置的设备月租、最低交易量和复杂 interchange-plus 费率表。此外，Clip 允许商户提供最长 24 个月的免息分期（Meses Sin
              Intereses，即 MSI），这是墨西哥高客单价零售交易的重要销售转化工具。但固定费率也带来逆向选择：对缺乏正规银行记录的小微商户和非正式商贩极具吸引力，其 3.6% 费率却对能从商业银行伙伴拿到低于
              2.0% 综合 interchange 费率的大型高交易量零售商缺乏竞争力。由于 Clip 不设置长期合同锁定或终端续费，交易规模扩大后，商户几乎可以零摩擦地多平台经营，或把交易量转向单位费率更低的竞争者。
            claimRefs:
              - CP004
              - CP005
              - CP011
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP005
              - CP011
      - number: '3.4'
        title: 护城河持久性、终端多平台经营与现金替代
        blocks:
          - type: paragraph
            body: >-
              评估 Clip 的长期竞争持久性，需要看两条战线：同业金融科技的替代，以及实体现金的结构性替代。在金融科技战线上，Clip 拥有显著品牌资产；Kantar BrandZ
              将其评为墨西哥最具价值的金融科技品牌，估计品牌价值 $983 million，同时其硬件已广泛铺入全国夫妻店。但城市零售中的商户终端多平台经营仍很普遍，店主常把 Clip 和 Mercado Pago
              设备并排摆放，以利用不同的刷卡促销或临时免手续费活动。更根本的是，Clip 在墨西哥经济中的主要竞争对手不是另一套软件，而是现金。按 2024 年官方 ENIF 基准，约 40%
              的墨西哥成年人未被正规金融机构覆盖，500 pesos 以下交易中 85% 以实体货币结算，市场机会仍取决于数字化转化速度。Clip 的护城河最终取决于：在激进金融科技公司的资产负债表和交易利润商品化侵蚀独立
              POS 经济性之前，其不断扩大的软件、Tap to Pay 和数字钱包生态能否筑起切换壁垒。
