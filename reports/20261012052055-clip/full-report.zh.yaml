  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与商户定价结构
        blocks:
          - type: paragraph
            body: >-
              Clip 通过交易处理费、自有 POS 终端硬件和远程数字结账工具，为墨西哥商业数字化变现。核心收入引擎是对有卡和无卡交易收取商户折扣率。对于数字支付，Clip 披露普通交易统一收取 3.6%
              加增值税（IVA）的标准不可议价佣金，适用于信用卡、借记卡、代金券卡和现金支付方式，且不要求月度维护租金。为覆盖不同零售渠道的商户交易，Clip 部署 Clip Mini、Clip Pro 2 和 Clip
              Stand 等 POS 硬件，并配套现金盒和打印机，让小型零售商在同一运营终端管理现金和数字支付收据。虽然目录交易价格透明公开，但 Clip 的实际综合费率、综合收单利差和 interchange
              利差均未公开，交易层面的单位毛利因此存在信息缺口。
