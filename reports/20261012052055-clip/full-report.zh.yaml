      - number: '2.2'
        title: 商户买家分层、支付渠道与收入机制
        blocks:
          - type: paragraph
            body: >-
              Clip 平台的主要买家包括个体经营者、专业服务提供商、社区零售店和成长中的餐饮住宿商户。在接入 Clip 前，参与商户中超过 75% 只收现金，且没有与商业银行建立商户收单关系。Clip
              取消设备月租和复杂的信贷审核材料，只需下载移动应用并完成简单数字注册，降低了采用门槛。对于无卡交易和远程交易，Clip 对信用卡、借记卡和代金券交易统一收取 3.6% 加增值税（IVA），并通过 19
              多家银行合作伙伴提供快速结算和分期融资（Meses Sin Intereses，即 MSI）。除线下和线上受理外，Clip 还借助收购 Swap 获得的 IFPE
              牌照，直接向商户经营者和消费者扩展钱包服务、转账和借记账户。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
