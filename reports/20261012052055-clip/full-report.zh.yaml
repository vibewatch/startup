  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 按顺序搭建决策框架，将商户覆盖和收入模式连接到估值门槛与最终建议。
    data:
      nodes:
        - id: merchant-scale
          label: 1. 商户规模：75% 以上现金转化与广泛 SMB 分发
        - id: revenue-model
          label: 2. 收入模式：3.6% + IVA 收取率与多产品铺开
        - id: credit-underwriting
          label: 3. 信贷扩张：通过 Belvo Open Finance 进行 PrestaClip 信贷评估
        - id: competitive-threats
          label: 4. 竞争格局：持牌银行（Nubank、Revolut）带来的压力
        - id: valuation-overhang
          label: 5. 估值摩擦：$2.0B 估值（收入 11.6x）与优先权悬压
        - id: final-recommendation
          label: 6. 最终立场：RESEARCH-MORE，中等信心
      edges:
        - from: merchant-scale
          to: revenue-model
        - from: revenue-model
          to: credit-underwriting
        - from: credit-underwriting
          to: competitive-threats
        - from: competitive-threats
          to: valuation-overhang
        - from: valuation-overhang
          to: final-recommendation
