  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Addressable Spend, and Cash Displacement
        blocks:
          - type: paragraph
            body: >-
              Clip targets Mexico's commercial payments ecosystem, focusing on small and medium-sized businesses (SMBs)
              that have historically operated outside the traditional banking perimeter. The commercial opportunity is
              defined by cash displacement across an economy where cash remains the dominant transaction medium.
              According to official 2024 ENIF survey benchmarks cited by industry analysts, approximately 85% of retail
              purchases under 500 Mexican pesos are completed using physical cash, and nearly 40% of Mexican adults lack
              access to formal financial services. On a macro level, approximately 80% of Mexico's total Personal
              Consumption Expenditure (PCE) is conducted in cash, despite Mexico being the tenth most populous country
              globally. Clip positions its proprietary hardware and software ecosystem—spanning low-barrier card
              readers, touch-screen smart terminals, and remote checkout links—to capture transactional spend migrating
              from informal physical currency into digital settlement channels.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM008
              - CM010
              - CM012
              - CM013
          - type: figure
            figureRef: FM001
            claimRefs:
