      - number: '4.2'
        title: Capital Adequacy and Financing History
        blocks:
          - type: paragraph
            body: >-
              Clip has historically relied on external venture equity and growth capital to finance hardware
              distribution, digital payment infrastructure, and customer acquisition. Following its 2021 Series D
              valuation of approximately US$2 billion, Clip raised a US$100 million round in June 2024 co-led by Morgan
              Stanley Tactical Value (MSTV) and a prominent West Coast mutual fund manager, which valued Clip in line
              with its 2021 Series D level. In June 2026, Clip announced a US$500 million investment from undisclosed
              investors to capitalize the launch of its Mi Clip digital wallet and fund payment expansion, which lifted
              company valuation benchmarks above US$2.5 billion. Concurrently, regulatory authorization granted by
              Mexico's National Banking and Securities Commission (CNBV) allows Clip to operate under corporate name
              Clip AI as an Electronic Payment Funds Institution (IFPE). Despite these substantial equity inflows, Clip
              has not published audited cash flow statements, monthly cash burn figures, balance-sheet cash reserves, or
              customer credit default rates, leaving forward operational runway dependent on external management
              disclosures.
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.3'
        title: Unit Economics and Financial Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              Evaluating Clip's standalone unit economics is constrained by the company's private disclosure profile.
              Key operational metrics—including Total Payment Volume (TPV), net revenue retention (NRR), customer
              acquisition cost (CAC), hardware payback periods, and credit provisioning—are not published in regulatory
              filings or investor reports. While Clip claims significant brand value and broad adoption among
              cash-dependent micro-merchants who historically had no digital payment acceptance, the company does not
              disclose merchant churn or cohort retention. Furthermore, Clip operates in a structural cash economy where
              85% of purchases below MX$500 are conducted in physical cash, presenting both a vast market conversion
              opportunity and sustained operational friction against incumbent cash usage. Underwriting Clip requires
              dedicated diligence access to historical audited financial statements, payment gateway unit economics, and
              merchant cohort repayment records.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI005
              - CI006
              - CI007
              - CI013
              - CI014
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Omoditization and Lack of Audited Financials
            body: >-
              Clip continues to raise equity rounds at multi-billion dollar valuations without public transparency into
              gross processing margins, unit economics, or whole-company operating profitability. Investors must
              recognize that list transaction fees of 3.6% do not indicate realized margin, and significant equity
              capital is required to support hardware subsidization and digital wallet adoption.
            calloutType: risk
            claimRefs:
              - CI002
              - CI007
              - CI013
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Portfolio and Merchant Workflow Enablement
        blocks:
          - type: paragraph
            body: >-
              Clip delivers a multi-product commerce platform designed specifically to bridge Mexico's cash-dominated
              retail landscape into digital payments. The company's customer workflow begins with self-onboarding via
              mobile application, eliminating traditional banking paperwork and enabling merchants to accept debit,
              credit, and food vouchers (vales) within minutes (CE001). Beyond physical card acceptance, Clip extends
              merchant functionality through digital payment links (Links de Pago), allowing businesses to sell via
              messaging platforms and social networks without fixed hardware (CE002). Transactions under this digital
              model carry a flat standard pricing structure of 3.6% plus Mexican VAT (IVA) across debit, credit, voucher
              cards, and cash payment points (CE003). To facilitate larger transaction sizes for small retailers,
              Clip'ter digital workflow integrates installment financing (Meses sin Intereses or MSI) spanning up to 24
              monthly installments (CE004). This merchant suite is supported by proprietary antifraud technology
              designed to mitigate chargeback risks in emerging digital commerce channels (CE005).
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
