  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Key operational, capitalization, and product milestones in Clip's evolution from 2012 founding to 2026 wallet
      launch.
    data:
      items:
        - label: 2012 — Foundation in Mexico City
          detail: Clip is founded by Adolfo Babatz to provide mobile card readers to underserved Mexican merchants.
          tone: neutral
        - label: 2013 — First External Funding Round
          detail: >-
            Secured initial venture capital financing to launch commercial operations and build proprietary
            card-processing tech.
          tone: positive
        - label: 2020 — Acquisition of Swap
          detail: >-
            Acquired electronic payments institution Swap, integrating wallet capabilities and digital payments
            infrastructure.
          tone: positive
        - label: 2021 — Unicorn Status via Series D
          detail: >-
            Closed a $250 million round led by SoftBank and Viking Global, achieving a $2 billion valuation as Mexico's
            first payments unicorn.
          tone: positive
        - label: 2024 — $100M Series D Extension
          detail: >-
            Secured $100 million from Morgan Stanley Tactical Value and a West Coast mutual fund at an unchanged $2
            billion valuation.
          tone: positive
        - label: 2025 — BrandZ Top-30 Mexican Brand
          detail: >-
            Ranked as the youngest brand and only fintech in Kantar BrandZ's 30 Most Valuable Mexican Brands with a
            $983M brand value.
          tone: positive
        - label: 2025 — Belvo Open Finance Alliance
          detail: >-
            Integrated Belvo's employment data and automated account debits into PrestaClip to expand unbanked merchant
            lending.
          tone: opportunity
        - label: 2026 — Mi Clip Digital Wallet Launch
          detail: >-
            Partnered with Ant International, Mastercard, and TelevisaUnivision to launch consumer digital wallet
            tackling Mexico's cash dominance.
          tone: positive
    approximationNotes: >-
