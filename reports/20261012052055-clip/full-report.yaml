  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Six-stage merchant lifecycle from zero-barrier hardware acquisition to multi-product digital commerce expansion.
    approximationNotes: >-
      Representative workflow synthesized from official onboarding flows, payment link interfaces, and digital wallet
      expansion initiatives.
    claimRefs:
      - CU003
      - CU011
      - CU012
      - CU013
      - CU014
    data:
      items:
        - label: Discovery & Hardware Acquisition
          stage: Awareness & Purchase
          actor: Micro & Small Business Owner
          touchpoints:
            - Retail partner stores and direct digital purchase without formal bank branch visit
            - Immediate low-cost card reader availability without fixed monthly rental fee
        - label: Zero-Barrier Merchant Onboarding
          stage: Activation
          actor: Informal or First-Time Merchant
          touchpoints:
            - Mobile application registration via smartphone without complex commercial registry requirements
            - Rapid merchant verification enabling immediate transaction readiness
        - label: Omnichannel Payment Acceptance
          stage: Core Utilization
          actor: Transacting Merchant & Consumer
          touchpoints:
            - In-person contactless, chip, and Tap to Pay card processing
            - Remote payment links generated via social messaging with transparent 3.6% plus VAT fee
        - label: Working Capital Access
          stage: Financing & Value-Add
          actor: Active Clip Merchant
          touchpoints:
            - Automated credit offers evaluated via behavioral transaction history
            - Pre-approved merchant cash advances repaid automatically through daily sales receivables
        - label: Consumer Digital Wallet Adoption
          stage: Two-Sided Network Engagement
          actor: Retail Consumer & Merchant
          touchpoints:
            - Mi Clip consumer wallet application launched with Ant International and Mastercard
            - Digital savings and peer-to-peer transfers bypassing traditional physical cash transactions
        - label: Commerce Ecosystem Expansion & Retention
          stage: Platform Expansion
          actor: Mature Multichannel Merchant
          touchpoints:
            - Catalog management, operational reporting software, and multi-device deployment
            - Cross-border payment acceptance and institutional partner distribution integrations
