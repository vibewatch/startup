              - CM002
              - CM003
              - CM004
              - CM007
      - number: '2.2'
        title: Merchant Buyer Segmentation, Payment Channels, and Revenue Mechanics
        blocks:
          - type: paragraph
            body: >-
              The primary buyers across Clip's platform are independent sole proprietors, professional service
              providers, neighborhood retail shops, and growing hospitality venues. Before onboarding to Clip, over 75%
              of participating merchants transacted exclusively in cash and possessed no merchant-acquiring relationship
              with commercial banks. Clip lowers adoption friction by eliminating recurring monthly device rentals and
              complex underwriting paperwork, requiring only a mobile application download and simple digital
              registration. For card-not-present and remote transactions, Clip charges a standardized commission of 3.6%
              plus Value Added Tax (IVA) across credit, debit, and voucher transactions, while offering merchants
              settlement speed and installment financing (Meses Sin Intereses, or MSI) across more than 19 banking
              partners. In addition to in-person and online acceptance, Clip leverages an IFPE license obtained via its
              acquisition of Swap to expand wallet services, wire transfers, and debit accounts directly to merchant
              operators and consumers.
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
      - number: '2.3'
        title: Growth Drivers, Infrastructure Partnerships, and Operating Constraints
        blocks:
          - type: paragraph
            body: >-
              Clip's market expansion is driven by structural tailwinds including widespread smartphone penetration,
              consumer migration toward digital wallets, and ecosystem partnerships. To support its scale, Clip has
              partnered with Ant International for AI-powered payment infrastructure and high-volume processing during
              major retail events like El Buen Fin, Mastercard for payment network interoperability and planned
              cross-border remittances, and TelevisaUnivision for national media reach and financial literacy
              initiatives. Furthermore, independent consumer recognition has reinforced brand distribution, with Kantar
              BrandZ estimating Clip's brand value at approximately $983 million in 2025. However, the business faces
              significant operating constraints, including high merchant price sensitivity to processing fees, informal
              retail preference for untraceable cash, intense competitive rivalry from well-funded regional platforms
              like Mercado Pago and Nu Mexico, and regulatory compliance obligations under CNBV oversight.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Cash Displacement as Core Market Driver
            body: >-
              Clip's total addressable expansion is fundamentally tied to cash displacement rather than dislodging
              established legacy point-of-sale infrastructure. With 80% of Mexico's personal consumption expenditure
              occurring in cash and 85% of purchases below 500 MXN settling in physical bills, low friction acquiring
              unlocks substantial offline spend.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM004
          - type: callout
            title: Competition for Underbanked Merchants and Margin Pressures
            body: >-
              While Clip claims that two out of three new digital merchants in Mexico select its terminals,
              well-capitalized fintechs such as Mercado Pago and Nu Mexico are aggressively expanding in Latin American
              payments, creating potential fee competition and retention risks across price-sensitive micro-merchants.
            calloutType: risk
            claimRefs:
