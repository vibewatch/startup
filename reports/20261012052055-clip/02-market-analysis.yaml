callouts:
  - calloutType: "insight"
    title: "Structural Cash Displacement as Core Market Driver"
    body: "Clip's total addressable expansion is fundamentally tied to cash displacement rather than dislodging established legacy point-of-sale infrastructure. With 80% of Mexico's personal consumption expenditure occurring in cash and 85% of purchases below 500 MXN settling in physical bills, low friction acquiring unlocks substantial offline spend."
    claimRefs:
      - "CM001"
      - "CM002"
      - "CM004"
  - calloutType: "risk"
    title: "Competition for Underbanked Merchants and Margin Pressures"
    body: "While Clip claims that two out of three new digital merchants in Mexico select its terminals, well-capitalized fintechs such as Mercado Pago and Nu Mexico are aggressively expanding in Latin American payments, creating potential fee competition and retention risks across price-sensitive micro-merchants."
    claimRefs:
      - "CM004"
      - "CM014"
      - "CM016"
