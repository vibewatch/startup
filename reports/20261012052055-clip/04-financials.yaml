callouts:
  - calloutType: "risk"
    title: "Structural Omoditization and Lack of Audited Financials"
    body: "Clip continues to raise equity rounds at multi-billion dollar valuations without public transparency into gross processing margins, unit economics, or whole-company operating profitability. Investors must recognize that list transaction fees of 3.6% do not indicate realized margin, and significant equity capital is required to support hardware subsidization and digital wallet adoption."
    claimRefs:
