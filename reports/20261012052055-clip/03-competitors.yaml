callouts:
  - calloutType: insight
    title: 'The Cash Moat: Physical Currency as Chief Competitor'
    claimRefs:
      - CP002
      - CP014
    body: While digital competitors like Mercado Pago capture market attention, physical cash remains the predominant transaction mechanism in Mexico, accounting for 85% of purchases under 500 pesos. Clip's growth trajectory depends as much on converting cash transactions to digital payments as on winning share from rival fintechs.
  - calloutType: risk
    title: Merchant Multi-Homing and Terminal Commoditization
    claimRefs:
      - CP004
      - CP011
      - CP012
    body: Zero monthly terminal rentals reduce merchant friction but drastically lower switching costs. Mexican merchants frequently operate multiple payment terminals side-by-side, creating ongoing commission fee pressure as fintech rivals and digital banking giants expand their merchant acquiring suites.
