    title: "Strategic Friction in Cash-to-Digital Conversion"
    body: "While Clip's hardware and zero-rental onboarding remove initial setup friction for micro-merchants, converting high-frequency micro-transactions remains constrained by deeply entrenched physical cash habits, with 85% of purchases under 500 pesos settled in cash across Mexico."
    claimRefs:
      - "CU001"
      - "CU012"
  - calloutType: "risk"
    title: "Competitive Incursion from Scaled Fintech Ecosystems"
    body: "Clip's core SMB merchant base faces mounting competitive targeting from well-capitalized digital ecosystems such as Mercado Pago and Nu Mexico, elevating potential terminal churn risk in the absence of proprietary locked-in vertical software workflows."
    claimRefs:
      - "CU013"
