      - number: '4.4'
        title: 资本充足性、现金跑道与尽调结论
        blocks:
          - type: paragraph
            body: >-
              从资产负债表看，Also 融资势头异常强劲，但伴随着显著的执行和估值风险。公司于 2025 年 3 月从 Rivian 分拆时获得 $150 million 种子轮和 Series A 融资，随后在 2026
              年春获得 Greenoaks 领投的 $200 million Series C，紧接着于 2026 年 8 月获得 Prysm Capital 领投的 $150 million Series
              D。短短不到十七个月内，Also 通过四轮融资累计获得 $455 million 股权资本，私人估值升至 $1 billion 以上。这一快速资本积累为 TM-B
              扩产和支持最初的商业车队承诺提供了充裕的近期跑道。然而，投资判断仍然谨慎。尽管公司没有自动运营商业收入，已交付消费自行车带来的实际收入也很少，市场仍按自动配送技术平台而非初创硬件制造商为其定价。开发自动软件的同时扩大精密电动车制造，会持续消耗大量运营现金。历史上的微出行项目反复证明，保修索赔、关税波动和折扣压力会迅速压薄硬件毛利率。确认当前估值水平下的资本充足性之前，尽调应重点核查经审计现金消耗、单位毛利率数据、DoorDash
              商业合同最低承诺及 Series C/D 清算优先权结构。
            claimRefs:
