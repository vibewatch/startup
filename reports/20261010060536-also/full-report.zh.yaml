  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 展示客户需求、零售渠道和商业合作如何转化为硬件收入及长期经营现金贡献。
    data:
      nodes:
        - label: DTC 预订单与预订
          detail: 在 RideAlso.com 提交的在线车辆预订
          tone: neutral
        - label: Rivian 展厅与在线销售
          detail: Rivian 零售店带来的商业曝光与客户转化
          tone: positive
        - label: TM-B 硬件组装与交付
          detail: 首批 Launch Edition 发货，确认 $4,500 的标价 ASP
          tone: neutral
        - label: 去中心化 Velofix 移动服务
          detail: 面向消费者的上门组装、维护和保修支持
          tone: neutral
        - label: 企业车队部署
          detail: 与 Amazon 和 DoorDash 签订商业电动货运四轮车供货协议
          tone: positive
        - label: 自动驾驶平台集成
          detail: 与 DoorDash Labs 合作研发城市最后一公里配送
          tone: positive
        - label: 目标毛利率与现金生成
          detail: 扣除零部件 BOM、移动服务管理开销和 AV 软件烧钱后的净贡献
          tone: warning
    claimRefs:
      - CI002
      - CI004
      - CI005
      - CI010
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 面向消费和商业小型电动车，纵向整合硬件、动力总成、计算、自动驾驶、车队远程信息处理和安全控制，共分六层产品与技术架构。
    approximationNotes: 架构分层依据公司披露和商业合作规格；内部子系统接口属于专有信息。
    claimRefs:
      - CE002
      - CE005
      - CE010
      - CE011
      - CE012
    data:
      layers:
        - label: 应用与商业服务层
          detail: 面向消费者和骑手的界面、DoorDash 配送集成，以及 Amazon 车队远程信息调度。
          modules:
            - 消费者移动应用与遥测
            - DoorDash 商户与配送员集成
            - 商业车队调度控制台
        - label: 自动驾驶与感知层
          detail: 与 DoorDash Labs 共同开发低速城市自动驾驶软件、传感器融合和导航算法。
          modules:
            - 多传感器融合（摄像头、雷达）
            - 低速运动规划器
            - 路缘与自行车道导航
        - label: 车辆软件与互联 OS 层
          detail: 自研电子控制单元（ECU）固件、电机控制算法、遥测和空中（OTA）更新管理。
          modules:
            - 中央车辆控制器固件
            - OTA 软件更新流水线
            - 实时远程信息与诊断
        - label: 推进与动力总成层
          detail: 适配两轮和四轮车型的模块化电机、驱动控制单元和扭矩传递机制。
          modules:
            - 高效电驱单元
            - 模块化电机逆变器
            - 双轨扭矩传递
        - label: 储能与电池管理层
          detail: 集成热失控缓解机制和电池管理系统（BMS）的高密度锂离子电池组。
          modules:
            - 模块化锂离子电池舱
            - 智能电池管理系统（BMS）
            - 热失控缓解与安全充电逻辑
        - label: 底盘、结构与安全硬件层
          detail: 轻量化结构铝制车架、液压制动系统、货舱外壳和 Alpha Wave 防护设备。
          modules:
            - 挤压铝制一体式车架
            - 液压碟刹组件
            - Alpha Wave 集成安全系统
  - id: FU001
    title: 客户采用与商业扩张旅程图
    type: journey-map
    summary: 展示客户从最初接触商业试点、联合开发车辆到车队规模化部署的旅程阶段。
    data:
      items:
        - label: 1. 战略联合开发与合作伙伴投资
          touchpoints:
            - DoorDash C 轮战略投资（00M 轮）
            - DoorDash Labs 联合创始人 Stanley Tang 加入董事会，任观察员
        - label: 2. 基础设施与车型规格
          touchpoints:
            - 针对自行车道、路缘和路肩打造的专用电动车
            - 基于 Rivian 电气架构的软硬件集成
        - label: 3. 车队测试与多车型试点
          touchpoints:
            - Amazon 货运配送四轮车在欧洲和美国车队开展试验
            - DoorDash 在高密度城市区域联合开发自动驾驶车辆
        - label: 4. 消费者预订与配置发布
          touchpoints:
            - TM-B Launch Edition 首批发货给美国消费者预订用户
            - TM-B Performance 和 Standard 版本开放配置门户
        - label: 5. 商业车队推出与产能扩张
          touchpoints:
            - 由 2026 年 8 月 50M D 轮融资支持商业规模化
            - 2026 年秋季向更广泛的 TM-B 产品线客户首次交付
        - label: 6. 长期自动驾驶车队网络集成
          touchpoints:
            - 同时部署多种有人驾驶和自动驾驶小型电动车车型
            - 接入运营商调度网络和最后一公里路线基础设施
    approximationNotes: 这些阶段代表 Also 截至 2026 年 8 月公开的商业路线图和已公布的客户部署阶段。
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 按发生可能性和残余影响严重程度映射主要风险维度。
    approximationNotes: 可能性和影响等级根据公开的交付延迟、架构复杂性和市场结构定性推导。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 严重影响
      rows:
        - label: 高可能性
          values:
            - 脚踏感不熟悉
            - 市政自行车道限速摩擦
            - 供应链电子元件短缺
            - 维修网络稀缺
        - label: 中等可能性
          values:
            - 配件与车架成本摩擦
            - DoorDash 转向商业自动驾驶
            - 收入前估值倍数收缩
            - 电驱系统完全耗竭
        - label: 低可能性
          values:
            - Rivian 直接否认零售关系
            - 专利侵权诉讼
            - OTA 车队软件变砖
            - 灾难性电池安全召回
        - label: 极低可能性
          values:
            - 轻微漆面缺陷
            - 包装纸板擦痕
            - 基础工具包短缺
            - 微型出行市场全面禁令
        - label: 理论可能性
          values:
            - 装饰贴花脱落
            - 车铃轻微异响
            - 反光片错位
            - 全球铝禁运
        - label: 可忽略可能性
          values:
            - 支架橡胶磨损
            - 包装胶带撕裂
            - 手册印刷错字
            - 全球互联网中断
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR007
      - CR009
      - CR010
      - CR013
  - id: FV001
    title: 建议决策框架
    type: flow
    summary: 依次评估资本实力、商业锚点、运营风险和估值纪律，最终得出“需要更多研究”的建议。
    data:
      nodes:
        - id: capital-infusion
          label: D 轮资本注入（2026 年 8 月融资 $150M；累计资本 $455M）
        - id: commercial-partnerships
          label: 战略商业锚点（DoorDash 自动配送与 Amazon 货运四轮车）
        - id: execution-friction
          label: 硬件制造执行（TM-B 首次交付错过春季和 7 月目标）
        - id: valuation-discipline
          label: 估值评估（收入前运营估值 $1B+，内部人投资团集中）
        - id: risk-posture
          label: 残余风险评级（运营、供应链和监管风险均高）
        - id: final-recommendation
          label: 投资决策（需要更多研究：入场前跟踪产能爬坡和单位经济性）
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV007
      - CV011
      - CV012
