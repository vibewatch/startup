  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品组合与客户工作流集成
        blocks:
          - type: paragraph
            body: >-
              ALSO 开发适用于高密度城市环境的小型电动车；在这类环境中，全尺寸汽车会遭遇严重拥堵。核心产品线覆盖消费级微出行和商业物流，以 TM-B 电动自行车及 TM-Q 商业配送四轮车为核心。TM-B
              是一款高端助力两轮车，车架、电池和动力系统一体化，提供 Launch Edition、Performance 和 Standard 三种配置，起售价 $3,500，Launch 配置最高
              $4,500。数月的零部件短缺使交付超过原定春季时间表后，ALSO 于 2026 年 8 月开始向客户交付 TM-B Launch Edition，同时开放后续车型预订配置。针对商业车队运营商，ALSO
              设计了四轮货运车 TM-Q，载荷超过 400 磅，同时可在指定自行车道和邻近行人基础设施中运行。除直接消费销售外，ALSO 还与 Amazon
              达成协议，为其欧洲和美国城市配送业务供应商业货运四轮车；不过，公司目前已验证的交付足迹仍局限于首批零售电动自行车。
