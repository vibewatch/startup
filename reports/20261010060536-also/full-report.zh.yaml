        - 商业交付摩擦与时间线延误
        - TM-B Launch Edition 因原材料和电子零部件瓶颈，未能达到 2026 年春季及 7 月交付目标。
        - 证明持续产能超过每月 1,000 台，且现场缺陷率可忽略。
      - - 反论
        - 激进估值与尚未产生收入的现实
        - 累计融资 $455M，私募估值却超过 $1B，但没有经审计的毛利率或消费者交付规模。
        - 披露单位产品毛利率为正，并有非内部人的机构成长型投资者参与。
