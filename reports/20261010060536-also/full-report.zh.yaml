companyProfile:
  summary: >-
    Also 是 Rivian 分拆出来的公司，设计高端微出行产品和小型电动车，由 Rivian 前未来项目负责人 Chris Yu 领导，并持续获得 RJ Scaringe 的战略影响力支持。公司一边销售 TM-B
    消费级电动自行车，一边与 DoorDash、Amazon 这两个战略锚点合作，推进商用自动配送和货运四轮车平台。
  foundingLocation: Palo Alto, California, USA
  headquarters: Palo Alto, California, USA
