      - number: '4.3'
        title: 成本结构、物料清单与单位经济性
        blocks:
          - type: paragraph
            body: >-
              Also 硬件的经济可行性取决于能否以足够低的单位成本制造复杂、垂直整合的小型电动车，从而获得正的毛贡献利润率。Also 的产品架构与依赖亚洲现成零部件目录的传统微出行组装商截然不同。公司开发了专有
              DreamRide 驱动系统，采用软件定义的电机控制和再生脚踏，并配合车规级电池组、最高 240 瓦的 USB-C 快充以及集成式 Portal
              数字触摸屏。垂直整合能带来产品差异化，却也造成沉重的物料清单（BOM）成本负担和更长的开发周期。2025 年末至 2026 年初，制造和交付执行困难，首批 TM-B Launch Edition
              发货前出现数月延迟，直到 2026 年年中才开始发运。此外，依赖专有电子设备、特殊车架和集成计算机，也带来售后维护负担。传统独立自行车零售商常因缺少诊断工具和替换件而拒绝维修专有电动自行车，迫使 Also 通过
              Velofix 合作承担服务成本。在未披露分项零部件成本、保修准备金或电池电芯采购价格的情况下，投资者无法验证 $4,500 零售价能否带来可持续的正毛利。
            claimRefs:
