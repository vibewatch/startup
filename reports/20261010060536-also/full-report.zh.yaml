      - number: '1.3'
        title: 商业爬坡、供应链扰动与运营指标
        blocks:
          - type: paragraph
            body: >-
              Also 的商业产品路线覆盖消费级微出行车辆、车队配送四轮车和自动配送硬件。公司的首款消费产品 TM-B 电动自行车搭载专有的“DreamRide”线控脚踏系统，宣称扭矩为 180 Nm；标准版零售价为
              $3,500，Launch Edition 售价为 $4,500。但全球供应链中断和电子元件短缺带来执行障碍，迫使公司将首次交付推迟到原定 2026
              年春季之后。延期引发社区论坛上的客户不满，并导致预订取消；Launch Edition 直到 2026 年 7 月下旬才从制造商发往美国仓库。除此之外，Also
              尚未披露商业收入运行率、客户车队数量或员工人数，体现出一家仍处早期阶段的硬件公司，其长期企业估值仍取决于尚未验证的自动化执行能力。
