              - CR010
      - number: '7.3'
        title: 交易对手依赖与估值韧性
        blocks:
          - type: paragraph
            body: >-
              Also 的商业扩张战略高度依赖关键企业关系和大额资本注入。在商业配送领域，Also 与 DoorDash 达成多年商业合作并获得战略资金，用于部署小型自动配送车辆；DoorDash Labs 管理层还加入
              Also 董事会担任观察员 [CR005, CR006]。这一商业联盟提供了标志性部署验证场，但 DoorDash
              同时保有内部自动化部门，在亚利桑那州测试自有可上道路配送机器人“Dot”，可能造成利益协调和渠道冲突 [CR005]。资本方面，Also 于 2026 年 8 月完成 $150 million Series
              D，由 Prysm Capital 领投，Eclipse、Greenoaks 和 MVP Ventures 参与，使披露融资总额升至 $455 million [CR009, CR013, CR014]。虽然
              Prysm 和现有支持者展现出强烈的持续信心，但投资者联盟仍集中于早期 Rivian 支持者，没有新的跨界成长型领投者 [CR013, CR014]。在实现规模化量产前私人估值基准已超过 $1
              billion，如果商业交付或单位毛利率落后计划，Also 将面临利润率压缩和下轮融资敏感性 [CR005, CR013, CR014]。
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR013
              - CR014
