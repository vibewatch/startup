        - 工程血统与平台复用性
        - 由 Chris Yu 和 RJ Scaringe 领导的 Rivian 分拆工程团队，在 TM-B 与 TM-Q 之间复用通用电动车模块化架构。
        - 证明共享零部件降低了成本，且多个车型的子组件均按时交付。
      - - 正论
        - 战略性一级商业锚点
        - 与 DoorDash（自动驾驶电动车）和 Amazon（货运四轮车）建立商业配送合作，锁定最后一公里需求。
        - 将试点协议转为具有约束力的高量商业生产合同，并附带最低采购承诺。
