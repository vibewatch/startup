            body: >-
              从概念设计过渡到商业规模硬件制造，会给 ALSO 带来急剧的运营风险。公司首次消费产品上市时遭遇明显摩擦：全球原材料受限和电子元件供应短缺导致 TM-B 延迟数月交付。ALSO 按客户条款要求预订时全额支付
              $4,500，条款明确不承诺交付日期，并以不可抗力条款免除供应链短缺责任；客户因此愈发不满，开始取消订单，公司不得不提供免费防护装备和商店积分等补偿。虽然 ALSO 于 2026 年通过 Series C 和
              Series D 累计获得 $350 million
              资本，用于扩张制造和开发自动化能力，但产量、单位物料清单和毛利率状况仍完全未披露。对尽调投资判断而言，关键技术风险包括持续的零部件采购依赖、电池组安全认证，以及在密集交通中尚未验证的自动车队可靠性。
