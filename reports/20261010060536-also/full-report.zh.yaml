      - number: '4.2'
        title: 分销渠道与市场进入经济性
        blocks:
          - type: paragraph
            body: >-
              Also 的市场进入策略避开传统独立自行车经销商网络，转而采用直销数字门户，并借助 Rivian 的企业实体网络开展线下零售。通过与少数股东 Rivian 的合作，Also 在美国各地 Rivian
              的实体展厅和数字门店展示 TM-B 车辆。这个协同渠道让 Also 能立即触达富裕且愿意接受电动车的买家群体，无需承担建设独立门店的巨额资本开支。为解决售后交付和组装问题，Also 与移动自行车服务运营商
              Velofix 建立运营合作，直接把组装好的车辆送到客户家中，并提供本地维护。企业端的商业分销则由与 Amazon、DoorDash 的战略协议支撑。该 DoorDash 合作于 2026 年春建立，与
              DoorDash 对 Also $200 million Series C 的战略股权投资同时进行，重点是在密集路缘和自行车道环境开发并试点专用自动配送车辆。在这一安排下，DoorDash Labs 负责人
              Stanley Tang 加入 Also 董事会担任观察员，把客户工作流反馈直接纳入产品治理。但实际渠道利润率、Rivian 收入分成和 Amazon 批量定价折扣仍未披露。
