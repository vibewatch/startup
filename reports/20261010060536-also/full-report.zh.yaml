              - CR013
      - number: '7.2'
        title: 运营复杂性与虚拟传动可靠性
        blocks:
          - type: paragraph
            body: >-
              运营和制造执行是 Also 近期最直接的风险。TM-B Launch Edition 曾出现严重交付延迟，交付窗口从原定 2026 年春季推迟到夏末和秋季 [CR003,
              CR004]。管理层承认，原材料和电子元件需求在全行业激增，扰乱了组装爬坡所需的关键子部件 [CR003, CR004]。与使用标准机械传动系统（链条、变速器和飞轮）的传统自行车不同，Also 的专有
              DreamRide 架构是串联混合式线控脚踏系统 [CR001, CR007]。脚踏动作会带动电子发电机，为电池和电机控制器供电，而不是直接转动后轮 [CR001,
              CR007]。这消除了机械链条维护，但也使故障模式全部转移到软件、传感器、电机控制器和电池管理电子设备上 [CR001, CR007,
              CR010]。由于没有直接的机械备用方案，电池耗尽或电子故障会让骑行者无法像传统自行车那样踩踏 [CR001, CR010]。此外，传统本地自行车维修店缺少专用诊断设备和专有备件，迫使 Also
              建立自己的专用服务基础设施 [CR001, CR008]。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR010
