  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、功能范围与支出分类
        blocks:
          - type: paragraph
            body: >-
              Also 位于商业末端配送平台、低速自动物流和高端消费级微出行的交汇处。公司的硬件架构以搭载虚拟传动技术的 TM-B 消费级电动自行车和 TM-Q
              商业配送四轮车为代表，专门利用城市道路路肩、路缘和指定自行车道；在这些空间里，全尺寸商业厢式车会遭遇高额停车罚单、路缘拥堵和低运营速度。纳入的可服务支出包括末端配送车硬件采购、自动配送载荷平台和高端城市消费出行设备。相反，市场边界严格排除长途商业货运、可上高速公路的电动乘用车、全尺寸包裹配送厢式车，以及缺乏商业车队遥测或汽车级软件集成的低价无品牌通勤微出行产品。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场规模、受限可服务视角与运营商经济性
        blocks:
          - type: paragraph
            body: >-
              评估 Also
              的总可寻址市场，需要把高层级物流和城市交通支出拆成受运营条件约束的层级。全球末端配送虽代表数千亿美元规模的全球物流支出，但可触达的可服务市场受限于具备充足自行车道基础设施、商户密集分布和有利城市微出行法规的城市路线。DoorDash
              等商业物流运营商拥有强烈动力部署小于汽车的电动平台，以降低每单人工和燃油支出；DoorDash 在美国的月活用户中，超过 30% 会在餐厅之外订购杂货和零售品类。对 Also
              而言，近期可服务性受制造交付节奏和自动运营监管许可限制，因此初始可获得市场集中在试点城市区域。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
