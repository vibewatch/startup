              - CP004
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP010
      - number: '3.3'
        title: 定价结构与多归属切换成本
        blocks:
          - type: paragraph
            body: >-
              微出行和车队配送的商业包装，在消费零售渠道与企业物流合同之间差异很大。对消费者而言，Also 的 TM-B 售价在 $3,500 至 $4,500
              之间，定位于高端发烧友和通勤市场，与传统自行车品牌的高端助力车并列。在商业车队市场，Also 通过企业共同开发和设备供应合同开展业务，例如与 DoorDash、Amazon
              的战略协议。为避免被单一供应商锁定，车队运营商往往同时开展多归属试点，合作对象包括传统厢式车制造商、内部机器人项目和第三方自动硬件供应商。由于没有专有充电或软件集成，车辆硬件供应商之间的切换成本仍低，Also
              的定价韧性取决于能否实实在在降低每次配送的总成本。虽然 Also 完成了由 Prysm Capital 领投的 $150 million Series
              D，以加速自动化平台，但底层单位经济性和企业合作伙伴的合同数量承诺仍未披露，长期硬件毛利和车队运营成本仍存疑问。
            claimRefs:
              - CP004
              - CP007
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP007
              - CP012
              - CP014
      - number: '3.4'
        title: 护城河持久性与自动化替代风险
        blocks:
          - type: paragraph
            body: >-
              Also 的竞争护城河建立在三根支柱上：覆盖消费和商业车型的专有共用车辆架构、继承自 Rivian 的知识产权和软件协同，以及接触锚定企业合作伙伴的商业渠道。TM-B 电动自行车、TM-Q
              四轮车和自动配送原型车共用电气及软件架构，使 Also
              能够在不同市场分摊核心工程投入。但硬件商品化、现有厂商反击和执行延迟，都对护城河的持久性构成重大威胁。历史上的微出行项目经常因单车硬件利润薄于预期而快速耗尽资本；Also 的私人市场估值超过 $1
              billion，使这一风险进一步放大。此外，制造执行仍是关键脆弱点：TM-B Launch Edition 的客户交付延迟数月，直到 2026 年年中才开始初步履约。如果低速自动配送机器人比 Also
              更快获得监管许可并实现可靠运行，而 Also 尚未完成国内规模化制造，灵活的自动软件新进入者与代工制造商组合可能取代 Also 在商业配送车队中的专有硬件。
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 估值与商业足迹的背离
            body: >-
              Also 估值超过 $1 billion，反映出市场以激进倍数将其定价为自动配送技术提供商，而不是电动自行车制造商。旗舰 TM-B
              经历数月初始交付延迟，商业四轮车平台仍处于企业早期试点；如果自动车队部署周期拉长，这一估值基准将带来显著下行风险。
            calloutType: risk
            claimRefs:
              - CP006
              - CP009
              - CP012
          - type: callout
            title: 相比人行道和道路方案的自行车道优势
            body: >-
              Also 开发可承载超过 400
              磅、同时在自行车道和道路路肩运行的车辆，瞄准了慢速人行道配送机器人与受交通限制的全尺寸配送厢式车之间的基础设施最佳位置。要维持这一优势，公司必须保住自行车道基础设施的监管准入，并扩大自动驾驶安全验证。
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP005
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与变现模式
        blocks:
          - type: paragraph
            body: >-
              Also 运营多层次商业模式，以高端电动微出行硬件为核心，并叠加商业车队供应、消费信贷合作和经常性软件服务。消费业务的基石是旗舰 TM-B 电动自行车，标价 $4,500。该价格使 Also
              明确处于消费级微出行市场的高端，远高于通常售价 $1,500 至 $2,500 的大众通勤电动自行车。为降低消费者的前期购买门槛，Also 与 Chase Slate 合作提供 0%
              的首期融资结构，把客户现金支出转为月度分期，同时依赖金融机构进行信用评估。除消费级两轮车外，Also 还设计了四轮助力平台，具体包括消费和商业配置的
              TM-Q。商业变现瞄准高密度城市物流，通过车队供应协议实现；Also 与 Amazon
              多年合作，在北美和欧洲配送枢纽部署定制电动货运四轮车就是一例。虽然标价和首批预订已公开，但实际收入质量仍不确定，因为早期发货仅限 Launch Edition，批量商业交付预计要到 2026 年末才会开始。
