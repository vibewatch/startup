      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 虚拟传动系统的脆弱性
            body: >-
              Also 的 DreamRide
              线控脚踏系统消除了标准链条维护，却引入单点故障风险：如果电池管理、传感器或电力电子设备发生故障，自行车就无法像传统自行车一样踩踏。没有成熟的全国独立维修网络，也就不可能进行路边机械应急。
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR010
          - type: callout
            title: 独角兽估值下的资本纪律
            body: >-
              $150 million Series D 融资将 Also 的运营跑道延长至 2027 年，但 $1 billion-plus
              估值早在公司证明批量制造或正单位经济性之前就已确立。在多种车型（电动自行车、四轮车和自动机器人）同时扩张，会加剧现金消耗风险。
            calloutType: insight
            claimRefs:
              - CR009
              - CR013
              - CR014
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与核心反论
        blocks:
          - type: paragraph
            body: >-
              Also 的核心投资逻辑是利用 Rivian 的工程血统和共用模块化架构，同时捕捉高毛利消费级微出行需求与高数量商业末端配送合同。公司从 Rivian 分拆出来，获得创始人 RJ Scaringe
              支持，由前未来项目负责人 Chris Yu 领导，并已开发共用的电池、电子设备和 DreamRide 线控脚踏子系统，覆盖两轮电动自行车和四轮货运车。与一级运营商的商业合作——包括 Amazon
              的货运四轮车配送，以及 DoorDash 的自动配送车辆共同开发——提供了显著商业验证和封闭部署渠道。但核心反论在于，复杂硬件规模化带来严重的制造和执行风险。由于电子元件和原材料供应链瓶颈，Also 未能达到旗舰
              $4,500 TM-B Launch Edition 在 2026 年春季和 7
              月的两个交付目标，暴露出早期运营脆弱性。此外，微出行硬件利润率历来容易受到保修索赔、固件问题和供应商通胀影响；如果量产成本无法支撑高端零售价，下行风险将进一步扩大。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: 估值背景、融资历史与投资者集中度
        blocks:
          - type: paragraph
            body: >-
              Also 的资本轨迹体现出收入产生前的激进资本化：公司在 2025 年 3 月分拆后的十七个月内，通过四轮机构融资累计筹集 $455 million。2026 年 8 月的 Series D 注入 $150
              million，此前公司在 2026 年春完成 $200 million Series C，使私人估值维持在 $1 billion 以上。值得注意的是，Series D 由重复投资者 Prysm Capital
              领投，现有投资者 Eclipse、Greenoaks 和 MVP Ventures 跟投，没有新增外部成长型领投者。顶级风投机构持续参投，说明内部投资者对 Also
              自动化路线有很强信心；但独立市场观察人士指出，一家尚未产生收入的硬件公司的 $1 billion-plus
              估值偏高，定价依据是自动配送车队的投机性未来承诺，而不是已经实现的运营现金流。大量资本涌入可能为未来股权持有人带来清算优先权的悬置负担，因此商业单车数量真正落地前，潜在投资者必须严格控制估值纪律。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV011
              - CV012
      - number: '8.3'
        title: 情景建模：乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              对尚未产生收入的硬件平台而言，潜在经营结果分化很大，估值必须放在明确的概率情景下分析。乐观情景中，Also 解决 TM-B 早期制造瓶颈，将月度出货量推高至 2026 年末，并把 DoorDash 和
              Amazon 的试点成功转化为数千台级的商业部署，从而在 24 至 36 个月内支撑 $2.5b 至 $3.5b 的企业估值。基准情景中，消费者对电动自行车的采用温和推进，
              单位毛利为正但幅度有限；自动驾驶车辆部署到 2027 年仍局限于受控试点，估值维持在约 $800m 至 $1.2b，并需要追加股权融资。悲观情景中，供应链反复中断拖慢 TM-B
              系列生产，消费者取消订单增加，自动驾驶商业测试无法证明单位配送成本具备优势，最终导致试点终止，并被迫以 $300m 至 $500m 的下行轮估值重组资本。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: 建议框架、退出准备度与尽调标准
        blocks:
          - type: paragraph
            body: >-
              综合实证证据，明确建议继续研究，同时将风险评为高、估值姿态视为偏高。Also 拥有出色的技术工程人才和一线商业关系，但在系列化生产得到验证、毛利经过审计之前，以 $1b
              以上估值入场，会让投资者暴露于尚未定价的重大下行风险。明确的论点失效触发因素包括：月度产量持续低于运营计划、客户保修或安全召回，或 DoorDash 停止联合自动驾驶测试。
              潜在投资者应把任何未来出资建立在严格尽调要求之上：经审计的物料清单证明 TM-B 和 TM-Q 均有正贡献毛利； 车队合作伙伴签署具有约束力的最低商业采购协议；以及完整看清 Series C 和 Series D
              的高级清算优先权。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV012
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: Series D 内部人财团集中度
            body: >-
              Also 的 $150M Series D 轮由 Prysm Capital 领投，现有内部投资者 Eclipse、Greenoaks 和 MVP Ventures 参与，明显没有新的外部成长型领投方。
              内部人的投入显示其对自动驾驶技术路线高度确信，但封闭的投资财团也说明，公开市场和跨界成长型投资者尚未验证 $1B+ 的未收入估值基准。
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV011
          - type: callout
            title: 入场纪律与论点失效触发因素
            body: >-
              新投资者应坚持严格的入场纪律，在 Also 证明 TM-B 消费级电动自行车的单位毛利为正，并将 DoorDash 自动驾驶试点转为商业车队部署之前， 暂缓配置资金。若 TM-B 的交付运行速率到 2027
              年初仍达不到目标规模，或供应链瓶颈迫使公司紧急重组资本，即构成论点失效触发因素。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV012
              - CV014
