    columns:
      - 情景
      - 核心假设
      - 估值 / 回报逻辑
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 乐观情景
        - TM-B 在 2026 年顺利放量；DoorDash 和 Amazon 试点转为数千台规模的商业部署；毛利率超过 25%。
        - 高毛利的软件驱动车队运营和自动配送溢价支撑 $2.5B–$3.5B 企业价值。
        - 20%
        - 市政部门快速批准自动配送四轮车，一级企业订单簿持续扩大。
      - - 基准情景
        - 消费者电助力自行车交付缓慢推进，单位利润有限；自动配送试点到 2027 年仍停留在测试台阶段。
        - $800M–$1.2B 估值，需要过桥资金或追加股权轮，并带来中等程度的投资者稀释。
        - 55%
        - 供应链摩擦持续，TM-Q 批量生产延迟，监管认证周期拉长。
      - - 悲观情景
        - 严重制造瓶颈再现；DoorDash 自动驾驶项目停滞；消费者在 $3,500–$4,500 价位的硬件需求转弱。
        - 多个车型项目同时大量烧钱，导致 $300M–$500M 下轮融资或资本重组。
        - 25%
        - 商业车队合作取消、电池安全受到监管审查，或无法在现有内部人之外组建 E 轮银团。
    notes: 这些情景根据制造执行、商业化里程碑和资本可得性，建模未来 24 个月的潜在回报结果。
    claimRefs:
      - CV001
      - CV003
      - CV005
      - CV009
      - CV010
      - CV013
      - CV014
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 从 2022 年在 Rivian 内部孵化，到 2026 年 D 轮后的自动驾驶扩张，公司在企业发展、融资、产品和运营上的关键里程碑。
    approximationNotes: 日期来自 2022—2026 年的公开公告和媒体报道；商业规模交付仍待完成。
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO008
      - CO009
      - CO012
      - CO013
      - CO014
    data:
      items:
        - label: 2022：Rivian 内部孵化
          detail: CEO RJ Scaringe 发起内部秘密项目，开发互补型小型电动车；早期曾与 Jony Ive 的 LoveFrom 工作室合作设计。
          tone: neutral
          date: '2022'
          claimRefs:
            - CO001
        - label: 2025 年 3 月：公司分拆
          detail: Also 从 Rivian 分拆为独立初创公司，获得 Eclipse $105M-$150M 支持；Rivian 保留少数股权和董事席位。
          tone: positive
          date: 2025-03
          claimRefs:
            - CO002
        - label: 2025 年 10 月：产品线发布
          detail: Also 发布首款消费产品 TM-B 电助力自行车，搭载 DreamRide 线控脚踏系统（$3,500-$4,500），同时展示商业四轮车原型。
          tone: neutral
          date: 2025-10
          claimRefs:
            - CO012
        - label: 2026 年 3 月：DoorDash 合作与 C 轮
          detail: 完成由 Greenoaks 领投、Prysm Capital 和 DoorDash 参与的 $200M C 轮融资；以 $1B 估值签订多年商业自动配送协议。
          tone: positive
          date: 2026-03
          claimRefs:
            - CO007
            - CO009
        - label: 2026 年春季：TM-B 生产延迟
          detail: 全球供应链瓶颈和电子零部件短缺，迫使首次春季交付推迟到夏季，并引发预订取消。
          tone: warning
          date: 2026-05
          claimRefs:
            - CO013
        - label: 2026 年 7 月：首次工厂发货
          detail: TM-B Launch Edition 电助力自行车离开工厂，运往美国仓库，以在 8 月至 9 月履行延迟的客户预订单。
          tone: neutral
          date: 2026-07
          claimRefs:
            - CO013
            - CO014
        - label: 2026 年 8 月：$150M D 轮融资
          detail: Prysm Capital 联合 Eclipse、Greenoaks 和 MVP Ventures 领投 $150M D 轮，将累计融资推至 $455M，加速自动驾驶平台开发。
          tone: positive
          date: 2026-08
          claimRefs:
            - CO006
            - CO008
        - label: 2026 年秋季：商业车队与自动驾驶扩张
          detail: TM-B Performance 和 Standard 车型开放预订及配置；Amazon 商业四轮车和 DoorDash 自动驾驶车辆的开发同步提速。
          tone: neutral
          date: 2026-09
          claimRefs:
            - CO008
            - CO012
  - id: FM001
    title: 受限可触达市场规模层级
    type: pyramid
    summary: 将最后一公里配送物流的总体机会逐层拆解，落到可服务、可获取的小型电动车细分市场，构成概念市场金字塔。
    data:
      items:
        - label: 最后一公里物流总支出
          value: 100
          valueNote: 覆盖所有车型和城市配送模式的宏观支出
        - label: 城市密集混合用途配送支出
          value: 45
          valueNote: 集中在核心都市区和高密度郊区的配送
        - label: 自行车道与路肩可达配送
          value: 20
          valueNote: 小型电动车可导航通行的路线
        - label: 商业货运四轮车与小型电动车车队硬件
          value: 8
          valueNote: 企业车队为专用货运平台配置的采购
        - label: 自动驾驶最后一公里配送平台支出
          value: 4
          valueNote: 用于自动化低速城市投递的平台支出
        - label: 近期合作伙伴可获取部署量（DoorDash / 试点枢纽）
          value: 1
          valueNote: 合同合作伙伴网络内直接可获得的初始商业路线量
    approximationNotes: 数值反映从 100 降至 1 的指数化概念市场范围，用于展示 6 层结构性 TAM/SAM/SOM 漏斗约束；绝对规模取决于商业试点的放量。
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 对比微型出行、机器人和商业车队同业，评估载荷适应性与自动驾驶准备度，呈现战略定位。
    approximationNotes: 根据披露报告中的载荷能力和自动驾驶运营准备度，采用 1–10 的序数评分。
    xAxisLabel: 载荷与车队适应性（1 = 轻型消费 / 人行道，10 = 重型货运 / 厢式车）
    yAxisLabel: 自动驾驶准备度（1 = 手动 / 仅有人驾驶，10 = 已部署道路自动驾驶）
