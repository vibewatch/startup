      - number: '2.3'
        title: 买方细分、预算归属与采用约束
        blocks:
          - type: paragraph
            body: >-
              企业商业物流车队与直接面向消费者的城市通勤者，采用逻辑截然不同。企业买方包括按需配送平台、即时商务运营商和包裹物流网络，预算由车队运营、末端物流负责人及寻求扩大运营利润率的创新实验室掌握。采用触发因素主要是降低单次出行成本、压低车辆全生命周期拥有成本以及绕开路缘拥堵。消费端通过直销零售渠道获客，需求来自高端城市交通效用，但高单价（标准版
              TM-B 为 $3,500，Launch 版本最高 $4,500）和生产爬坡延迟会限制采用。两个细分市场都受电池安全认证标准、公共充电可达性和自动驾驶监管许可约束，这些因素决定了多年的采用轨迹。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 消费硬件与企业车队自动化的结构性分化
            body: >-
              Also 的商业逻辑连接了两种截然不同的市场动态：直接面向消费者销售的电动自行车（$3,500-$4,500），靠单车销售带动利润却面临执行延迟；以及与 DoorDash
              合作的企业自动配送，其商业规模取决于自动驾驶软件可靠性和城市自行车道运营。与 DoorDash 的多年商业合同提供了一个封闭的运营验证场，使 Also 区别于纯消费级微出行同行。
            calloutType: insight
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM012
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Also 通过多种车型形态布局城市出行和末端配送，横跨多个竞争类别。在消费级微出行领域，公司的旗舰 TM-B 电动自行车直接与 Specialized、Trek
              等成熟厂商的高端电动自行车及各类直销替代品竞争。在商业货物运输领域，Also 的 TM-Q 四轮车和自动配送车辆面向高密度城市走廊；全尺寸货运厢式车在这些区域会遭遇严重拥堵、停车罚单和道路阻力。同时，Also
              还面临自动人行道配送机器人的新兴竞争，这些机器人人工成本低，却受速度严重受限、载货能力极小的影响。通过让四轮平台在自行车道、道路路肩和路缘空间内运行，Also
              希望占据一种独特的运营空间，把轻型商用车的载荷能力与微出行硬件的绕行能力结合起来。Rivian 汽车业务利益相关方最初对这一电动微出行分拆项目能否相对于资本需求创造可观企业价值持怀疑态度。但 Also
              扩展到自动配送系统后，已重新定位为快速演变的自动化物流领域的直接参与者。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP008
              - CP010
              - CP013
      - number: '3.2'
        title: 竞争者画像与能力评估
        blocks:
          - type: paragraph
            body: >-
              将 Also 与现有出行和物流方案比较，可以看到速度、载荷能力和监管定位上的明显取舍。企业承运商运营的传统电动配送厢式车可提供超过 1,000
              磅的巨大容积，但车身尺寸使其无法进入自行车道，并造成显著的城市配送瓶颈。相反，Starship Technologies 或 Serve Robotics 等运营商的自动人行道车辆以每小时 4 至 6
              英里的速度穿行于行人空间，载荷通常限制在 50 磅以内。DoorDash 通过 DoorDash Labs
              推进内部机器人战略，在凤凰城都会区测试可上道路的“Dot”配送机器人，集成激光雷达、雷达和摄像头传感器套件，最高时速可达 20 英里。Also 的商业四轮车宣称载荷超过 400
              磅，同时仍能灵活穿行指定自行车道和路缘基础设施。与大型物流运营商的战略合作支撑了这一能力路线：DoorDash 已完成股权投资，并与 Also 签署多年商业共同开发协议以打造专用自动配送车辆；Amazon
              则已就商业四轮车供应建立合作。借助 Rivian 基于基础模型的自动化能力和集中式计算架构，Also 获得了传统自行车及微出行制造商无法在内部匹敌的软件能力。
            claimRefs:
              - CP001
