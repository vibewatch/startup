            body: >-
              Also 的商业验证几乎完全建立在两个一级企业合作伙伴之上：DoorDash 负责自动末端配送，Amazon
              负责商业配送四轮车。由于两项计划都仍处于共同开发和早期测试阶段，而非合同约束下的批量部署，DoorDash 或 Amazon 的任何试点失败或战略转向，都可能严重削弱 Also 的商业采用逻辑。
            calloutType: risk
            claimRefs:
              - CU005
              - CU007
              - CU013
              - CU014
          - type: callout
            title: B2B 车队与 B2C 高端消费战略的分叉
            body: >-
              Also 正执行双重市场进入战略：用高价 ,500–,500
              电动自行车带来近期消费收入，同时布局长期高数量的企业配送车队部署。虽然这一策略利用了统一的底层电动车架构，却也迫使创业公司同时管理分散的消费直销履约和复杂的企业自动化集成。
            calloutType: insight
            claimRefs:
              - CU001
              - CU003
              - CU008
              - CU010
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规环境
        blocks:
          - type: paragraph
            body: >-
              Also 的商业足迹覆盖消费级电动自行车（TM-B）和规划中的商业微出行平台（TM-Q 及自动配送机器人）。在消费市场，TM-B 作为 3 级电动自行车销售，助力速度最高可达 28 mph
              [CR001]。但各地司法辖区对油门操作、自行车道准入、步道使用和载客经常适用不同规则 [CR001, CR002]。电动自行车以超过 20 mph
              的速度运行，或在模块化车架上载客，会在不同城市边界产生合规摩擦；当地交通主管部门可能限制高速微出行 [CR002]。此外，UL 2849 认证等严格电池安全标准和城市消防法规，是消费和车队采用的强制门槛
              [CR002, CR011]。在自动末端配送中，Also 与 DoorDash 的合作目标覆盖人行道、自行车道和路缘交通 [CR005,
              CR006]。这些“中间地带”缺乏统一的联邦监管框架，需要应对各城市自动配送许可和速度限制组成的碎片化规则 [CR005, CR006, CR012]。
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR011
              - CR012
