      - number: '5.2'
        title: 模块化车辆架构与运营平台
        blocks:
          - type: paragraph
            body: >-
              ALSO 的核心工程策略是打造垂直整合的共用电动车架构，以支持多种车型形态，而无需重新设计底层子系统。该项目最初由 RJ Scaringe 在 Rivian 内部以秘密研发项目形式孵化；ALSO 从
              Apple、Tesla、Google 和 Specialized 招募工程负责人，开发专有电机控制器、电池管理系统和电子控制单元。ALSO
              不把消费级两轮电动自行车、商业四轮车和自动配送舱视为彼此独立的硬件项目，而是在整个产品组合中共用电池模块、电力电子设备和固件。这一统一架构提供软件遥测、空中固件更新和集成安全系统，例如定制 Alpha Wave
              防护装备。此外，共用平台还是 ALSO 自动配送路线的物理和电气基础，使感知传感器套件及线控系统能够快速集成到低速车辆底盘上。
