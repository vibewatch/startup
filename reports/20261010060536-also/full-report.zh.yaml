      - number: '5.3'
        title: 城市微出行工作流与商业配送应用
        blocks:
          - type: paragraph
            body: >-
              城市物流工作流越来越受路缘拥堵、双排停车罚单和道路堵塞拖累，传统厢式车配送的经济性因此恶化。ALSO
              专门把小型电动车定位在道路与人行道基础设施之间的过渡区域，包括自行车道、道路路肩和路缘装卸区；传统货运厢式车无法在这些区域高效运行。在商业末端食品和包裹配送领域，ALSO 在 Series C
              融资期间获得战略投资，并与 DoorDash 达成多年商业协议。该合作将 ALSO 的专用小型电动车底盘与 DoorDash Labs 的自动系统结合，在高密度都市环境测试无人配送。商业运营商计划部署载荷额定
              400 磅的紧凑四轮和两轮车型，以降低单次配送成本、绕开车辆交通延误。但商业部署仍处于共同开发测试阶段，完全自动化还要面对行人互动、路缘几何和城市监管许可等复杂边界情况。
