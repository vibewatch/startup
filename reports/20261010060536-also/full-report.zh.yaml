chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、Rivian 渊源与管理层
        blocks:
          - type: paragraph
            body: >-
              Also, Inc. 最初于 2022 年在 Rivian Automotive 内部以保密的秘密研发项目形式孵化，由 CEO RJ Scaringe
              负责。为解决全尺寸电动探险车之外的城市出行问题，Scaringe 组建工程与设计团队，从 Apple、Google、Specialized 和 Tesla 招募人才，并与 Jony Ive 的 LoveFrom
              设计工作室合作开发早期车型概念。2025 年 3 月，Rivian 正式将该实体分拆为独立企业，同时保留少数股权和董事会席位。公司总部位于加州帕洛阿尔托，由联合创始人兼总裁 Chris Yu 领导；他此前担任
              Rivian 未来项目副总裁，负责基于共用车辆架构推进工程和运营规模化。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
