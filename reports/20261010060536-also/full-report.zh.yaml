      - number: '1.2'
        title: 资本化进程、估值与战略联盟
        blocks:
          - type: paragraph
            body: >-
              Also 采取了激进的机构融资策略，独立运营后的十八个月内累计完成 $455 million 股权融资。2026 年春，公司完成由 Greenoaks 领投的 $200 million Series
              C，Prysm Capital 参与，DoorDash 也作出战略股权承诺，公司投后估值达到 $1 billion。与此同时，Also 与 DoorDash
              达成多年商业合作，共同开发面向高密度城市走廊的专用自动配送车辆；DoorDash Labs 负责人 Stanley Tang 加入 Also 董事会，担任观察员。2026 年 8 月，Also 完成由 Prysm
              Capital 的 Jay Park 领投的 $150 million Series D，Eclipse Capital、Greenoaks 和 MVP Ventures 继续参投，估值升至 $1 billion
              以上，用于加速自动驾驶车辆平台部署。
