chapter:
  number: 4
  title: "Financials"
  summary: "Also operates as a pre-revenue to early-shipping EV micromobility manufacturer with $455M in total funding and a $1B+ private valuation, pairing a $4,500 consumer e-bike list price with commercial delivery fleet partnerships with Amazon and DoorDash. However, absence of unit-level gross margins, undisclosed hardware bill-of-materials costs, and heavy R&D burn for autonomous driving platforms present substantial diligence hurdles for new investors."
sections:
  - id: "revenue-streams-and-pricing-model"
    title: "Revenue Streams and Monetization Model"
    body: "Also operates a multi-tiered commercial model centered on premium electric micromobility hardware, augmented by commercial fleet supply, consumer credit partnerships, and recurring software services. The cornerstone of the consumer business is the flagship TM-B electric bike, which carries a list price of $4,500. This places Also squarely in the premium tier of the consumer micromobility market, well above mass-market commuter e-bikes that typically retail between $1,500 and $2,500. To soften consumer upfront acquisition barriers, Also partnered with Chase Slate to offer a 0% introductory financing structure, effectively shifting customer cash outlays into monthly installments while relying on financial institution credit underwriting. In addition to consumer two-wheelers, Also has designed four-wheel pedal-assist platforms, specifically the TM-Q in both consumer and commercial configurations. Commercial monetization targets high-density urban logistics through fleet supply agreements, demonstrated by Also's multi-year collaboration with Amazon to deploy custom e-cargo quads across North American and European delivery hubs. While list pricing and initial pre-orders have been publicly disclosed, realized revenue quality remains uncertain because early shipments are limited to the Launch Edition, with volume commercial deliveries not expected until late 2026."
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"

  - id: "distribution-channels-and-gtm-economics"
    title: "Distribution Channels and Go-To-Market Economics"
    body: "Also's go-to-market strategy avoids traditional independent bicycle dealer networks, opting instead for a direct-to-consumer digital portal combined with physical retail leverage from Rivian's corporate footprint. Through its partnership with minority shareholder Rivian, Also features its TM-B vehicles in Rivian physical showrooms and digital storefronts across the United States. This symbiotic channel gives Also immediate access to an affluent, EV-receptive buyer demographic without incurring the massive capital expense of building dedicated standalone retail stores. To solve the post-sale delivery and assembly challenge, Also established an operational partnership with Velofix, a mobile bicycle service operator, to deliver assembled vehicles directly to customers' homes and provide localized maintenance. On the enterprise side, Also's commercial distribution is anchored by strategic agreements with Amazon and DoorDash. The DoorDash collaboration, established in spring 2026 alongside DoorDash's strategic equity investment in Also's $200 million Series C round, focuses on developing and piloting purpose-built autonomous delivery vehicles for dense curbside and bike-lane environments. As part of this arrangement, DoorDash Labs leader Stanley Tang joined Also's board as an observer, embedding customer workflow feedback directly into product governance. However, realized channel margins, Rivian revenue-share splits, and Amazon volume pricing discounts remain undisclosed."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI008"
      - "CI010"
      - "CI015"
    tableRefs:
      - "TI002"
    figureRefs:
      - "FI001"

  - id: "cost-structure-and-unit-economics"
    title: "Cost Structure, Bill of Materials, and Unit Economics"
    body: "The economic viability of Also's hardware hinges on its ability to manufacture complex, vertically integrated small EVs at unit costs that yield positive gross contribution margins. Also's product architecture differs sharply from conventional micromobility assemblers who rely on off-the-shelf Asian component catalogs. Instead, Also developed its proprietary DreamRide drive system, featuring software-defined motor control and regenerative pedaling, paired with vehicle-grade battery packs, USB-C fast charging up to 240 watts, and an integrated digital Portal touchscreen display. While this vertical integration allows product differentiation, it creates a heavy bill of materials (BOM) cost burden and prolonged development cycles. Manufacturing and delivery execution proved challenging during late 2025 and early 2026, resulting in multi-month delivery delays for the initial TM-B Launch Edition before shipments commenced in mid-2026. Furthermore, reliance on proprietary electronics, specialized frames, and integrated computers introduces post-sale maintenance liabilities. Traditional independent bicycle retailers frequently decline to service proprietary e-bikes due to lack of diagnostic tooling and replacement parts, forcing Also to shoulder service costs through its Velofix partnership. Without disclosure of itemized component costs, warranty reserves, or battery cell procurement pricing, investors cannot verify whether the $4,500 retail price delivers sustainable positive gross margins."
    claimRefs:
      - "CI001"
      - "CI007"
      - "CI009"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"

  - id: "capital-adequacy-and-financial-verdict"
    title: "Capital Adequacy, Cash Runway, and Diligence Verdict"
    body: "From a balance sheet perspective, Also exhibits extraordinary capital-raising momentum coupled with substantial execution and valuation risk. Following its March 2025 spinout from Rivian with $150 million in seed and Series A funding, the company secured a $200 million Series C led by Greenoaks in spring 2026, followed quickly by a $150 million Series D led by Prysm Capital in August 2026. In total, Also has amassed $455 million in equity capital across four financing rounds in under seventeen months, lifting its private valuation above $1 billion. This rapid capital accumulation provides comfortable near-term runway to finance TM-B production scale-up and support initial commercial fleet commitments. Nevertheless, the financial underwriting verdict remains cautious. Also is priced as an autonomous delivery technology platform rather than a nascent hardware manufacturer, despite having no commercial revenue from autonomous operations and minimal realized revenue from shipped consumer bikes. Developing autonomous software while simultaneously scaling precision EV manufacturing demands heavy ongoing operating cash burn. Historical micromobility ventures consistently demonstrated that hardware margins thin rapidly under warranty claims, tariff fluctuations, and discounting pressure. Diligence must focus on audited cash burn, unit-level gross margin data, DoorDash commercial contract minimums, and Series C/D liquidation preference structures before confirming capital adequacy at current valuation levels."
    claimRefs:
      - "CI001"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
