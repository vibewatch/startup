chapter:
  number: 3
  title: "Competitors"
  summary: "Also operates across a split competitive landscape comprising premium consumer e-bikes, low-speed delivery robotics, and status-quo fleet vans, attempting to occupy an intermediate bike-lane operating niche with modular driven and autonomous form factors. Backed by $455 million in funding, including strategic participation from DoorDash and Amazon commercial agreements, Also claims structural cost and speed advantages in dense urban corridors. However, its $1 billion-plus valuation prices in high-volume autonomous deployment, while initial TM-B e-bike shipments suffered months of delays and long-term enterprise delivery economics remain unproven against incumbent logistics fleets."
sections:
  - id: "competitive-landscape-and-substitutes"
    title: "Competitive Landscape and Status-Quo Substitutes"
    body: "Also addresses urban mobility and last-mile delivery through a multi-form-factor strategy that intersects several distinct competitive categories. In consumer micromobility, the company's flagship TM-B e-bike competes directly against premium electric bicycles from established manufacturers such as Specialized and Trek, as well as direct-to-consumer alternatives. In commercial goods transport, Also's TM-Q quad and autonomous delivery vehicles target dense urban corridors where full-size cargo vans encounter severe congestion, parking citations, and roadway friction. Simultaneously, Also faces emerging competition from autonomous sidewalk delivery robots, which offer low labor costs but suffer from severe speed limitations and minimal cargo capacity. By positioning its four-wheel platforms to operate within bike lanes, road shoulders, and curbside spaces, Also seeks to capture a distinct operational envelope that combines the payload volume of light commercial vehicles with the bypass capabilities of micromobility hardware. Initial market reaction from Rivian automotive stakeholders reflected skepticism regarding whether an electric micromobility spinoff could generate substantial enterprise value relative to capital requirements. However, Also's expansion into autonomous delivery systems has repositioned the venture as a direct participant in the rapidly evolving automated logistics landscape."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP003"
      - "CP008"
    figureRefs:
      - "FP001"

  - id: "competitor-profiles-and-capability-matrix"
    title: "Competitor Profiles and Capability Assessment"
    body: "Evaluating Also against existing mobility and logistics solutions reveals stark operational tradeoffs across speed, payload capacity, and regulatory positioning. Traditional electric delivery vans operated by enterprise carriers provide massive volume exceeding 1,000 pounds, but their physical footprint excludes them from bike lanes and creates significant urban delivery bottlenecks. Conversely, autonomous sidewalk rovers operated by players such as Starship Technologies or Serve Robotics navigate pedestrian spaces at 4 to 6 miles per hour with payloads generally restricted to under 50 pounds. DoorDash has pursued an internal robotics strategy through DoorDash Labs, testing its road-capable 'Dot' delivery robot in the Phoenix metropolitan area with integrated lidar, radar, and camera sensor suites at speeds up to 20 miles per hour. Also's commercial quad platform claims a payload threshold exceeding 400 pounds while retaining the agility to navigate designated cycling and curb infrastructure. Strategic partnerships with major logistics operators underpin this capability strategy: DoorDash completed an equity investment and executed a multi-year commercial co-development agreement with Also to build purpose-built autonomous delivery vehicles, while Amazon established agreements for commercial quad vehicle supply. Leveraging Rivian's foundation model autonomy and centralized compute architecture provides Also with software capabilities that traditional bicycle and micromobility manufacturers cannot match in-house."
    claimRefs:
      - "CP001"
      - "CP003"
      - "CP004"
      - "CP005"
      - "CP007"
      - "CP010"
    tableRefs:
      - "TP001"
      - "TP002"

  - id: "packaging-pricing-and-switching-dynamics"
    title: "Pricing Structures and Multi-Homing Switching Costs"
    body: "Commercial packaging in micromobility and fleet delivery diverges significantly between consumer retail channels and enterprise logistics contracts. For consumer buyers, Also's TM-B lists between $3,500 and $4,500, positioning the vehicle in the premium enthusiast and commuter segment alongside high-end pedal-assist bikes from legacy cycling brands. In commercial fleet markets, Also engages through enterprise co-development and equipment supply contracts, such as its strategic agreements with DoorDash and Amazon. Fleet operators exhibit pronounced multi-homing behavior, maintaining concurrent pilots with conventional van manufacturers, internal robotics projects, and third-party autonomous hardware providers to avoid vendor lock-in. Because switching costs between vehicle hardware vendors remain low in the absence of proprietary charging or software integration, Also's pricing durability relies on delivering measurable reductions in total cost per delivery trip. While Also closed a $150 million Series D financing round led by Prysm Capital to accelerate its autonomous platform, the underlying unit economics and contractual volume commitments with its enterprise partners remain undisclosed, leaving open questions regarding long-term hardware gross margins and fleet operating costs."
    claimRefs:
      - "CP004"
      - "CP007"
      - "CP012"
      - "CP013"
      - "CP014"
    tableRefs:
      - "TP003"

  - id: "moat-durability-and-displacement-risks"
    title: "Moat Durability and Autonomous Displacement Risks"
    body: "Also's competitive moat is anchored in three pillars: its proprietary shared vehicle architecture spanning consumer and commercial form factors, intellectual property and software synergies inherited from Rivian, and commercial access to anchor enterprise partners. Utilizing a common electrical and software architecture across the TM-B e-bike, TM-Q quad, and autonomous delivery prototypes allows Also to amortize core engineering investments across disparate market segments. Nonetheless, the durability of this moat faces substantial threats from hardware commoditization, incumbent response, and execution delays. Historical micromobility ventures frequently suffered from rapid capital depletion when unit hardware margins proved thinner than projected, a risk heightened by Also's private market valuation exceeding $1 billion. Furthermore, manufacturing execution remains a critical vulnerability: customer deliveries of the TM-B Launch Edition were delayed by several months before initial fulfillment began in mid-2026. If low-speed autonomous delivery robotics achieve regulatory clearance and reliability faster than Also can ramp scaled domestic manufacturing, nimble autonomous software entrants paired with contract manufacturers could displace Also's proprietary hardware in commercial delivery fleets."
    claimRefs:
      - "CP006"
      - "CP008"
      - "CP009"
      - "CP010"
      - "CP012"

