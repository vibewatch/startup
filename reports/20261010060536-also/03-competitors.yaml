callouts:
  - calloutType: "risk"
    title: "Valuation Divergence from Commercial Footprint"
    body: "Also's valuation exceeding $1 billion reflects an aggressive multiple that prices the business as an autonomous delivery technology provider rather than an e-bike manufacturer. With the flagship TM-B having suffered months of initial delivery delays and commercial quad platforms still in early enterprise pilots, the valuation benchmark creates significant downside exposure if autonomous fleet deployment timelines lengthen."
    claimRefs:
      - "CP006"
      - "CP009"
      - "CP012"
  - calloutType: "insight"
    title: "Bike Lane Advantage over Sidewalk and Road Solutions"
    body: "By developing vehicles capable of carrying over 400 pounds while operating inside bike lanes and road shoulders, Also targets the infrastructure sweet spot between slow sidewalk delivery robots and traffic-constrained full-size delivery vans. Sustaining this advantage requires maintaining regulatory access to bike infrastructure while scaling autonomous safety validation."
    claimRefs:
      - "CP001"
      - "CP004"
      - "CP005"

