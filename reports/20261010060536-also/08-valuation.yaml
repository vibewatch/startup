    title: "Insider Syndicate Concentration at Series D"
    body: "Also's $150M Series D round was led by Prysm Capital with participation from existing insiders Eclipse, Greenoaks, and MVP Ventures, notably lacking a new external lead growth investor. While insider commitment signals strong conviction in the autonomous technology roadmap, the closed syndicate highlights that public and cross-over growth investors have not yet validated the $1B+ pre-revenue valuation benchmark."
    claimRefs:
      - "CV001"
      - "CV005"
      - "CV011"
  - calloutType: "recommendation"
    title: "Entry Discipline and Thesis-Break Triggers"
    body: "New investors should maintain strict entry discipline, deferring capital allocation until Also proves positive unit gross margins on the TM-B consumer e-bike and transitions DoorDash autonomous pilots into commercial fleet deployments. A thesis-break trigger would be established if TM-B delivery run-rates fail to achieve target scale by early 2027 or if supply-chain bottlenecks force an emergency recapitalization."
    claimRefs:
      - "CV007"
      - "CV012"
      - "CV014"
