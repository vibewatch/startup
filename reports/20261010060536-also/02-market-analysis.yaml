    body: "Also's commercial thesis bridges two disparate market dynamics: direct-to-consumer e-bikes ($3,500-$4,500) where unit sales drive margin but face execution delays, and enterprise autonomous delivery (partnered with DoorDash) where commercial scale hinges on autonomous software reliability and municipal bike-lane operations. The multi-year commercial contract with DoorDash provides a captive operational proving ground that distinguishes Also from pure-play consumer micromobility peers."
