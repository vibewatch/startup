callouts:
  - calloutType: "risk"
    title: "The Virtual Drivetrain Vulnerability"
    body: "Also's DreamRide pedal-by-wire system eliminates standard chain maintenance but introduces a single-point-of-failure risk: if battery management, sensors, or power electronics fail, the bike cannot be pedaled like a conventional bicycle. Without an established nationwide independent repair network, roadside mechanical fallback is impossible."
    claimRefs:
      - "CR001"
      - "CR007"
      - "CR010"
  - calloutType: "insight"
    title: "Capital Discipline at Unicorn Valuation"
    body: "Securing $150 million in Series D funding extends Also's operating runway into 2027, but the $1 billion-plus valuation was established before demonstrating volume manufacturing or positive unit economics. Premature expansion across multiple simultaneous form factors (e-bikes, quads, and autonomous robots) heightens cash burn risk."
    claimRefs:
      - "CR009"
      - "CR013"
      - "CR014"
