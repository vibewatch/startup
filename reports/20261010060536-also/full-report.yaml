  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: >-
      Vertically integrated six-layer product and technology architecture spanning hardware, powertrain, compute,
      autonomy, fleet telematics, and safety controls across consumer and commercial small EVs.
    approximationNotes: >-
      Architectural layers reflect company disclosures and commercial partnership specifications; internal subsystem
      interfaces are proprietary.
    claimRefs:
      - CE002
      - CE005
      - CE010
      - CE011
      - CE012
    data:
      layers:
        - label: Application & Commercial Service Layer
          detail: Consumer rider interface, DoorDash delivery integration, and Amazon fleet telematics dispatch.
          modules:
            - Consumer Mobile App & Telemetry
            - DoorDash Merchant & Courier Integration
            - Commercial Fleet Dispatch Console
        - label: Autonomous Driving & Perception Layer
          detail: Low-speed urban autonomy software, sensor fusion, and navigation algorithms co-developed with DoorDash Labs.
          modules:
            - Multi-Sensor Fusion (Camera, Radar)
            - Low-Speed Motion Planner
            - Curbside & Bike Lane Navigation
        - label: Vehicle Software & Connected OS Layer
          detail: >-
            In-house electronic control unit (ECU) firmware, motor control algorithms, telemetry, and Over-the-Air (OTA)
            update management.
          modules:
            - Central Vehicle Controller Firmware
            - OTA Software Update Pipeline
            - Real-Time Telematics & Diagnostics
        - label: Propulsion & Powertrain Layer
          detail: >-
            Modular electric motors, drive controller units, and torque delivery mechanisms adapted across 2-wheel and
            4-wheel form factors.
          modules:
            - High-Efficiency Electric Drive Unit
            - Modular Motor Inverter
            - Dual-Track Torque Delivery
        - label: Energy Storage & Battery Management Layer
          detail: >-
            High-density lithium-ion battery packs with integrated thermal runaway mitigation and battery management
            systems (BMS).
          modules:
            - Modular Li-ion Battery Enclosure
            - Intelligent Battery Management System (BMS)
            - Thermal Mitigation & Safe Charging Logic
        - label: Chassis, Structural & Safety Hardware Layer
          detail: >-
            Lightweight structural aluminum frames, hydraulic braking systems, cargo enclosures, and Alpha Wave
            protective equipment.
          modules:
            - Extruded Aluminum Unibody Frame
            - Hydraulic Disc Braking Assembly
            - Alpha Wave Integrated Safety System
