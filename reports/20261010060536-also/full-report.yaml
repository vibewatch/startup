      - number: '1.3'
        title: Commercial Ramp, Supply Chain Disruptions, and Operating Metrics
        blocks:
          - type: paragraph
            body: >-
              Also's commercial product roadmap encompasses consumer micromobility vehicles, fleet delivery quads, and
              autonomous delivery hardware. The company's inaugural consumer product, the TM-B electric bike, features a
              proprietary 'DreamRide' pedal-by-wire system, 180 Nm claimed torque, and retail pricing of $3,500 for the
              standard edition and $4,500 for the Launch Edition. However, execution hurdles emerged when global supply
              chain disruptions and electronic component shortages forced the company to delay initial deliveries past
              its original spring 2026 window. These delays generated vocal customer discontent on community forums and
              triggered pre-order reservation cancellations before Launch Edition units finally shipped from
              manufacturers to US warehouses in late July 2026. Furthermore, Also does not disclose commercial revenue
              run-rates, customer fleet volumes, or employee census figures, reflecting an early-stage hardware profile
              where long-term enterprise valuation hinges on unproven autonomous execution.
