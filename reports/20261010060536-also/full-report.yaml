  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Functional Scope, and Spend Classification
        blocks:
          - type: paragraph
            body: >-
              Also operates at the structural intersection of commercial last-mile delivery platforms, low-speed
              autonomous logistics, and premium consumer micro-mobility. The company's hardware architecture—exemplified
              by the TM-B consumer e-bike with virtual drivetrain technology and the TM-Q commercial delivery quad—is
              deliberately designed to exploit urban roadway shoulders, curbsides, and designated bicycle lanes where
              full-sized commercial vans face prohibitive parking citations, curb congestion, and low operational
              speeds. The included addressable spend encompasses last-mile courier hardware procurement, autonomous
              delivery payload platforms, and premium consumer urban mobility equipment. Conversely, the market boundary
              strictly excludes long-haul commercial freight, highway-capable electric passenger vehicles, full-sized
              parcel distribution vans, and low-cost unbranded commuter micro-mobility solutions lacking commercial
              fleet telemetry or automotive-grade software integration.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Market Sizing, Constrained Addressable Lenses, and Operator Economics
        blocks:
          - type: paragraph
            body: >-
              Evaluating Also's total addressable market requires decomposing high-level logistics and urban
              transportation spend into operationally constrained tiers. While global last-mile delivery represents a
              multi-hundred-billion-dollar global logistics expenditure, the accessible serviceable market is bounded by
              urban routes possessing adequate bicycle lane infrastructure, dense merchant clustering, and favorable
              municipal micro-mobility regulations. Commercial logistics operators such as DoorDash, where over 30% of
              US monthly active users order across grocery and retail categories beyond restaurants, possess intense
              commercial incentives to deploy smaller-than-car electric platforms to lower per-drop labor and fuel
              expenses. For Also, near-term serviceability is constrained by manufacturing delivery cadences and
              municipal regulatory clearance for autonomous operations, establishing an initial serviceable obtainable
              market concentrated in pilot urban zones.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
