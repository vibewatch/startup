      - number: '7.2'
        title: Operational Complexity and Virtual Drivetrain Reliability
        blocks:
          - type: paragraph
            body: >-
              Operational and manufacturing execution represents the most immediate near-term hazard for Also. The
              company experienced significant delivery delays on the TM-B Launch Edition, pushing deliveries from the
              original spring 2026 window into late summer and autumn [CR003, CR004]. Management acknowledged that an
              industry-wide spike in demand for raw materials and electronic components disrupted critical subcomponents
              required for the assembly ramp-up [CR003, CR004]. Unlike traditional bicycles utilizing standard
              mechanical drivetrains (chains, derailleurs, and cassettes), Also's proprietary DreamRide architecture is
              a series-hybrid pedal-by-wire system [CR001, CR007]. Pedaling turns an electronic generator that powers a
              battery and motor controller rather than turning the rear wheel directly [CR001, CR007]. This eliminates
              mechanical chain maintenance but shifts failure modes entirely into software, sensors, motor controllers,
              and battery management electronics [CR001, CR007, CR010]. Because there is no direct mechanical backup, a
              depleted battery or electrical failure leaves the rider without conventional pedaling capability [CR001,
              CR010]. Furthermore, conventional local bike repair shops lack specialized diagnostics and proprietary
              spares, forcing Also to establish its own dedicated service infrastructure [CR001, CR008].
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR007
              - CR008
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
