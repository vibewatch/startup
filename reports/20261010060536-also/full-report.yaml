      - number: '6.4'
        title: Customer Concentration, Retention, and Durability Risks
        blocks:
          - type: paragraph
            body: >-
              Also faces substantial customer concentration and commercial durability risks given that its commercial
              viability relies almost entirely on DoorDash and Amazon. DoorDash maintains an internal autonomy division
              and has concurrently tested alternative robotic platforms, such as its Dot delivery robot in Arizona,
              without clarifying how Also's vehicles fit within its broader autonomous roadmap. Neither DoorDash nor
              Amazon has publicly disclosed binding volume purchase commitments, multi-year minimum purchase guarantees,
              or fleet rollout schedules. Commercial channel diligence also notes that European IT distributor ALSO
              Holding AG operates an unrelated technology reseller network, distinct from Also's vehicle operations.
              Because Also is still ramping initial production and piloting autonomous capabilities, the company
              possesses no historical net revenue retention (NRR), gross retention rate (GRR), or customer cohort churn
              metrics. Until autonomous delivery vehicles operate commercially at scale, Also's  billion-plus valuation
              represents a bet on development velocity rather than proven customer retention.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration Risk in Pre-Production Commercial Partnerships
            body: >-
              Also's commercial validation rests almost entirely on two tier-one enterprise partnerships: DoorDash for
              autonomous last-mile delivery and Amazon for commercial delivery quads. Because both programs remain in
              co-development and early testing rather than contractual volume deployment, any pilot failure or strategy
              shift by DoorDash or Amazon would substantially impair Also's commercial adoption thesis.
            calloutType: risk
            claimRefs:
              - CU005
              - CU007
              - CU013
              - CU014
          - type: callout
            title: Bifurcated B2B Fleet and B2C Premium Consumer Strategy
            body: >-
              Also is executing a dual go-to-market strategy that balances near-term consumer revenue from high-priced
              ,500–,500 e-bikes with long-term high-volume enterprise delivery fleet deployments. While this leverages a
              unified underlying electric vehicle architecture, it simultaneously forces the startup to manage disparate
              consumer direct-to-consumer fulfillment and complex enterprise autonomy integrations.
            calloutType: insight
            claimRefs:
              - CU001
              - CU003
              - CU008
