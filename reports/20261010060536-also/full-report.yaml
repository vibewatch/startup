      - number: '5.4'
        title: Manufacturing Execution, Supply Chain Friction, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Transitioning from concept design to commercial-scale hardware manufacturing presents acute operational
              risks for ALSO. The company's initial consumer launch experienced substantial friction when TM-B
              deliveries were delayed by several months due to global raw material constraints and electronic component
              supply shortages. Because ALSO required full $4,500 upfront payments upon reservation under customer terms
              that expressly disclaimed delivery dates and excused supply chain shortages via force majeure clauses,
              customer frustration escalated, prompting cancellations and requiring remedial concessions such as free
              protective gear and store credits. Although ALSO secured $350 million in capital across Series C and
              Series D rounds in 2026 to finance manufacturing scale and autonomous development, its production volumes,
              unit bill of materials, and gross margin profiles remain entirely undisclosed. For diligence underwriters,
              key technical risks include ongoing component procurement dependencies, battery pack safety
              certifications, and unverified autonomous fleet reliability in dense traffic.
            claimRefs:
              - CE001
              - CE007
              - CE008
              - CE009
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Unified EV Architecture Across Diverse Urban Form Factors
            body: >-
              ALSO leverages a shared electric vehicle architecture across its consumer TM-B e-bike and commercial TM-Q
              cargo quad platforms. By engineering core propulsion, battery systems, and electronic control units to
              span both two-wheel and four-wheel form factors, the company avoids redesigning foundational systems for
              each vehicle type, accelerating time-to-market for future autonomous delivery models.
            calloutType: strength
            claimRefs:
              - CE002
              - CE005
              - CE010
          - type: callout
            title: Execution and Supply Chain Fragility in Hardware Commercialization
            body: >-
              Initial shipments of the TM-B Launch Edition were delayed by several months due to raw material and
              electronic component bottlenecks, prompting customer cancellations and forcing ALSO to issue compensation
              packages. While customer terms require full upfront payment without guaranteed delivery dates, reliance on
              specialized global component suppliers poses ongoing operational vulnerability as ALSO scales production
              to commercial fleets.
            calloutType: risk
            claimRefs:
              - CE001
              - CE007
              - CE013
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Also targets two distinct customer segments: enterprise logistics fleet operators and premium urban
              consumer commuters. The enterprise segment is characterized by institutional delivery platforms seeking
              purpose-built small electric vehicles to navigate dense urban centers where traditional delivery vans face
              congestion, parking constraints, and high cost per trip. These commercial buyers require vehicle platforms
              capable of operating legally and efficiently in road-adjacent spaces, including bike lanes, shoulders, and
              curbsides, while carrying substantial cargo payloads. In contrast, the consumer segment targets individual
              urban commuters purchasing premium electric pedal-assist bicycles priced from ,500 to ,500. This consumer
              cohort prioritizes automotive-grade design, proprietary powertrain technology, and software connectivity
              inherited from Also's incubation within Rivian.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
