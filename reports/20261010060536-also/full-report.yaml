      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption dynamics diverge sharply between enterprise commercial logistics fleets and direct-to-consumer
              urban commuters. Enterprise buyers comprise on-demand delivery platforms, instant-commerce operators, and
              parcel logistics networks where budget authority sits with fleet operations, last-mile logistics
              directors, and innovation labs seeking operating margin expansion. Adoption triggers center on reducing
              cost per trip, lowering vehicle total cost of ownership, and bypassing curb congestion. Consumer adoption,
              directed through direct-to-consumer retail channels, is driven by premium urban transportation utility but
              constrained by high unit pricing ($3,500 for the standard TM-B up to $4,500 for launch variants) and
              production ramp delays. Across both segments, battery safety certification standards, public charging
              accessibility, and autonomous regulatory clearance represent gating constraints governing multi-year
              adoption trajectories.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Divergence Between Consumer Hardware and Enterprise Fleet Autonomy
            body: >-
              Also's commercial thesis bridges two disparate market dynamics: direct-to-consumer e-bikes ($3,500-$4,500)
              where unit sales drive margin but face execution delays, and enterprise autonomous delivery (partnered
              with DoorDash) where commercial scale hinges on autonomous software reliability and municipal bike-lane
              operations. The multi-year commercial contract with DoorDash provides a captive operational proving ground
              that distinguishes Also from pure-play consumer micromobility peers.
            calloutType: insight
            claimRefs:
