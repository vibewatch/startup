      - number: '5.2'
        title: Modular Vehicle Architecture and Operating Platform
        blocks:
          - type: paragraph
            body: >-
              ALSO's core engineering strategy centers on a vertically integrated, shared electric vehicle architecture
              intended to support multiple form factors without redesigning foundational subsystems. Originally
              incubated as a skunkworks initiative inside Rivian by RJ Scaringe, ALSO recruited engineering leadership
              from Apple, Tesla, Google, and Specialized to develop proprietary motor controllers, battery management
              systems, and electronic control units. Rather than treating two-wheel consumer e-bikes, commercial quads,
              and autonomous delivery pods as independent hardware programs, ALSO utilizes common battery modules, power
              electronics, and firmware across its entire portfolio. This unified architecture provides software
              telemetry, over-the-air firmware updates, and integrated safety systems such as custom Alpha Wave
              protective equipment. Furthermore, the shared platform serves as the physical and electrical foundation
              for ALSO's autonomous delivery roadmap, enabling rapid integration of perception sensor suites and
              drive-by-wire controls onto low-speed vehicle chassis.
