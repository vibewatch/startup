      - number: '4.2'
        title: Distribution Channels and Go-To-Market Economics
        blocks:
          - type: paragraph
            body: >-
              Also's go-to-market strategy avoids traditional independent bicycle dealer networks, opting instead for a
              direct-to-consumer digital portal combined with physical retail leverage from Rivian's corporate
              footprint. Through its partnership with minority shareholder Rivian, Also features its TM-B vehicles in
              Rivian physical showrooms and digital storefronts across the United States. This symbiotic channel gives
              Also immediate access to an affluent, EV-receptive buyer demographic without incurring the massive capital
              expense of building dedicated standalone retail stores. To solve the post-sale delivery and assembly
              challenge, Also established an operational partnership with Velofix, a mobile bicycle service operator, to
              deliver assembled vehicles directly to customers' homes and provide localized maintenance. On the
              enterprise side, Also's commercial distribution is anchored by strategic agreements with Amazon and
              DoorDash. The DoorDash collaboration, established in spring 2026 alongside DoorDash's strategic equity
              investment in Also's $200 million Series C round, focuses on developing and piloting purpose-built
              autonomous delivery vehicles for dense curbside and bike-lane environments. As part of this arrangement,
              DoorDash Labs leader Stanley Tang joined Also's board as an observer, embedding customer workflow feedback
              directly into product governance. However, realized channel margins, Rivian revenue-share splits, and
              Amazon volume pricing discounts remain undisclosed.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI008
              - CI010
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI003
