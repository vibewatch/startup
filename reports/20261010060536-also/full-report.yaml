      - number: '6.2'
        title: Enterprise Deployments and Commercial Partnerships
        blocks:
          - type: paragraph
            body: >-
              Also's commercial deployment strategy is anchored by two flagship enterprise accounts: DoorDash and
              Amazon. Following a 00 million Series C financing in early 2026, Also entered into a multi-year commercial
              agreement with DoorDash to co-develop and deploy purpose-built autonomous delivery vehicles at scale. As
              part of this strategic alliance, DoorDash Co-Founder and Head of DoorDash Labs Stanley Tang joined the
              partnership in an observer capacity, giving DoorDash board-level visibility into co-development
              milestones. In parallel, Also established a commercial vehicle supply relationship with Amazon for a
              heavy-duty commercial cargo delivery quad capable of carrying over 400 pounds of payload in bike lanes for
              European and U.S. fleet trials. However, both enterprise programs remain in co-development and early
              testing rather than binding volume fleet operations, leaving contractual conversion and deployment
              timelines unverified.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
