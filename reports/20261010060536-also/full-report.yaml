      - number: '4.3'
        title: Cost Structure, Bill of Materials, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The economic viability of Also's hardware hinges on its ability to manufacture complex, vertically
              integrated small EVs at unit costs that yield positive gross contribution margins. Also's product
              architecture differs sharply from conventional micromobility assemblers who rely on off-the-shelf Asian
              component catalogs. Instead, Also developed its proprietary DreamRide drive system, featuring
              software-defined motor control and regenerative pedaling, paired with vehicle-grade battery packs, USB-C
              fast charging up to 240 watts, and an integrated digital Portal touchscreen display. While this vertical
              integration allows product differentiation, it creates a heavy bill of materials (BOM) cost burden and
              prolonged development cycles. Manufacturing and delivery execution proved challenging during late 2025 and
              early 2026, resulting in multi-month delivery delays for the initial TM-B Launch Edition before shipments
              commenced in mid-2026. Furthermore, reliance on proprietary electronics, specialized frames, and
              integrated computers introduces post-sale maintenance liabilities. Traditional independent bicycle
              retailers frequently decline to service proprietary e-bikes due to lack of diagnostic tooling and
              replacement parts, forcing Also to shoulder service costs through its Velofix partnership. Without
              disclosure of itemized component costs, warranty reserves, or battery cell procurement pricing, investors
              cannot verify whether the $4,500 retail price delivers sustainable positive gross margins.
            claimRefs:
              - CI001
              - CI007
              - CI009
              - CI010
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI003
              - CI010
              - CI012
              - CI014
      - number: '4.4'
        title: Capital Adequacy, Cash Runway, and Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              From a balance sheet perspective, Also exhibits extraordinary capital-raising momentum coupled with
              substantial execution and valuation risk. Following its March 2025 spinout from Rivian with $150 million
              in seed and Series A funding, the company secured a $200 million Series C led by Greenoaks in spring 2026,
              followed quickly by a $150 million Series D led by Prysm Capital in August 2026. In total, Also has
              amassed $455 million in equity capital across four financing rounds in under seventeen months, lifting its
              private valuation above $1 billion. This rapid capital accumulation provides comfortable near-term runway
              to finance TM-B production scale-up and support initial commercial fleet commitments. Nevertheless, the
              financial underwriting verdict remains cautious. Also is priced as an autonomous delivery technology
              platform rather than a nascent hardware manufacturer, despite having no commercial revenue from autonomous
              operations and minimal realized revenue from shipped consumer bikes. Developing autonomous software while
              simultaneously scaling precision EV manufacturing demands heavy ongoing operating cash burn. Historical
              micromobility ventures consistently demonstrated that hardware margins thin rapidly under warranty claims,
              tariff fluctuations, and discounting pressure. Diligence must focus on audited cash burn, unit-level gross
              margin data, DoorDash commercial contract minimums, and Series C/D liquidation preference structures
              before confirming capital adequacy at current valuation levels.
            claimRefs:
              - CI001
              - CI012
              - CI013
              - CI014
              - CI015
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hardware Margin Compression and Service Liabilities
            body: >-
              Also's proprietary DreamRide drive architecture and vehicle-grade electronics elevate bill-of-materials
              costs while limiting third-party bike shop serviceability, creating recurring warranty obligations that
              could erode gross margins below venture underwriting thresholds.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: callout
            title: Autonomous Valuation Premium vs. Hardware Revenue Reality
            body: >-
              Prysm Capital and Greenoaks have valued Also above $1 billion across $455 million in total equity funding,
              reflecting a valuation multiple driven by future autonomous delivery fleet software rather than near-term
              unit sales of its $4,500 TM-B electric bike.
            calloutType: insight
            claimRefs:
