figures:
  - id: FO001
    title: Company Milestone Timeline
    type: timeline
    summary: >-
      Key corporate, financing, product, and operational milestones from Rivian incubation in 2022 through Series D
      autonomous expansion in 2026.
    approximationNotes: >-
      Dates reflect public announcements and media reporting across 2022-2026; commercial volume deliveries remain
      pending.
    claimRefs:
      - CO001
      - CO002
      - CO006
      - CO007
      - CO008
      - CO009
      - CO012
      - CO013
      - CO014
    data:
      items:
        - label: '2022: Internal Incubation at Rivian'
          detail: >-
            CEO RJ Scaringe initiates internal skunkworks project to develop complementary small electric vehicles;
            early design collaboration with Jony Ive's LoveFrom studio.
          tone: neutral
          date: '2022'
          claimRefs:
            - CO001
        - label: 'March 2025: Corporate Spinout'
          detail: >-
            Also spins out from Rivian as an independent startup backed by $105M-$150M from Eclipse, with Rivian
            maintaining a minority stake and board seat.
          tone: positive
          date: 2025-03
          claimRefs:
            - CO002
        - label: 'October 2025: Product Line Unveiling'
          detail: >-
            Also reveals inaugural consumer product, the TM-B e-bike with DreamRide pedal-by-wire system
            ($3,500-$4,500), alongside commercial quad prototypes.
          tone: neutral
          date: 2025-10
          claimRefs:
            - CO012
        - label: 'March 2026: DoorDash Partnership & Series C'
          detail: >-
            Closes $200M Series C led by Greenoaks with Prysm Capital and DoorDash; enters multi-year commercial
            autonomous delivery agreement at a $1B valuation.
          tone: positive
          date: 2026-03
          claimRefs:
            - CO007
            - CO009
        - label: 'Spring 2026: TM-B Production Delays'
          detail: >-
            Global supply chain bottlenecks and electronic component shortages force postponement of initial spring
            deliveries to summer, prompting reservation cancellations.
          tone: warning
          date: 2026-05
          claimRefs:
            - CO013
        - label: 'July 2026: Initial Factory Shipments'
          detail: >-
            Launch Edition TM-B e-bikes leave manufacturing facility bound for US warehouse to fulfill delayed customer
            pre-orders between August and September.
          tone: neutral
          date: 2026-07
          claimRefs:
            - CO013
            - CO014
        - label: 'August 2026: $150M Series D Financing'
          detail: >-
            Prysm Capital leads $150M Series D round with Eclipse, Greenoaks, and MVP Ventures, bringing cumulative
            funding to $455M to accelerate autonomous platform development.
          tone: positive
          date: 2026-08
          claimRefs:
            - CO006
            - CO008
        - label: 'Fall 2026: Commercial Fleet & Autonomous Expansion'
          detail: >-
            Pre-order and configuration access opens for TM-B Performance and Standard models while development
            accelerates on Amazon commercial quads and DoorDash autonomous vehicles.
          tone: neutral
          date: 2026-09
          claimRefs:
            - CO008
            - CO012
