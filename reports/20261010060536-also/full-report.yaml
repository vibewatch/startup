  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Portfolio and Customer Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              ALSO develops small-format electric vehicles designed to operate within dense urban environments where
              full-sized automobiles face severe congestion. The core product lineup spans consumer micromobility and
              commercial logistics, anchored by the TM-B electric bicycle and the TM-Q commercial delivery quad. The
              TM-B is a premium pedal-assist two-wheeler featuring an integrated frame, battery, and powertrain, offered
              in Launch Edition, Performance, and Standard trims with pricing starting at $3,500 and reaching $4,500 for
              launch configurations. Following months of component shortages that pushed fulfillment past its initial
              spring schedule, ALSO initiated customer shipments of the TM-B Launch Edition in August 2026 while opening
              pre-order configurations for subsequent models. For commercial fleet operators, ALSO designed the TM-Q
              four-wheel cargo vehicle, engineered to transport payloads exceeding 400 pounds while fitting within
              designated bike lanes and pedestrian-adjacent infrastructure. In addition to direct consumer sales, ALSO
              secured an agreement to supply commercial cargo quads to Amazon for European and U.S. urban delivery
              operations, though the company's currently verified delivery footprint remains confined to initial retail
              e-bike batches.
