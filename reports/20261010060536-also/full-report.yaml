  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Landscape
        blocks:
          - type: paragraph
            body: >-
              Also's commercial footprint spans consumer e-bikes (TM-B) and planned commercial micro-mobility platforms
              (TM-Q and autonomous delivery bots). In the consumer market, the TM-B is marketed as a Class 3 electric
              bicycle with pedal-assist speeds reaching up to 28 mph [CR001]. However, local jurisdictions frequently
              apply divergent rules regarding throttle operation, bike lane access, trail usage, and passenger
              transportation [CR001, CR002]. Operating an e-bike above 20 mph or carrying passengers on modular frames
              introduces compliance friction across municipal boundaries where local transit authorities may restrict
              high-speed micromobility [CR002]. Furthermore, stringent battery safety standards such as UL 2849
              certification and municipal fire code regulations represent mandatory thresholds for consumer and fleet
              adoption [CR002, CR011]. In autonomous last-mile delivery, Also's partnership with DoorDash targets
              sidewalk, bike lane, and curbside transit [CR005, CR006]. These 'in-between' spaces lack standardized
              federal regulatory frameworks and require navigating a fragmented patchwork of municipal autonomous
              delivery permits and speed restrictions [CR005, CR006, CR012].
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR011
              - CR012
