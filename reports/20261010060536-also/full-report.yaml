  - id: TV002
    title: Thesis and Anti-Thesis Matrix
    columns:
      - Stance
      - Pillar / Argument
      - Key Evidence
      - What Would Change View
    rows:
      - - Thesis
        - Engineering Pedigree and Platform Reusability
        - >-
          Rivian spinout engineering team led by Chris Yu and RJ Scaringe leveraging common EV modular architecture
          across TM-B and TM-Q.
        - Proof of shared component cost reductions and on-time sub-assembly delivery across multiple form factors.
      - - Thesis
        - Strategic Tier-1 Commercial Anchors
        - >-
          Commercial delivery partnerships with DoorDash (autonomous EVs) and Amazon (cargo quad) offering captive
          last-mile demand.
        - >-
          Conversion of pilot agreements into binding, high-volume commercial production contracts with minimum purchase
          commitments.
      - - Anti-Thesis
        - Commercial Delivery Friction and Timeline Delays
        - >-
          TM-B Launch Edition missed spring and July 2026 delivery targets due to raw material and electronic component
          bottlenecks.
        - Demonstrated sustained production run-rate exceeding 1,000 units per month with negligible field defect rates.
      - - Anti-Thesis
        - Aggressive Valuation vs Pre-Revenue Reality
        - >-
          $1B+ private valuation on $455M cumulative capital raised without audited gross margin or consumer delivery
          scale.
        - >-
          Disclosure of positive unit-level gross contribution margins and non-insider institutional growth investor
          participation.
    notes: >-
      Evaluation contrasts official product and partnership roadmaps against independent reports on delivery milestones
      and valuation skepticism.
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 'Scenario Analysis: Bull, Base, and Bear Cases'
    columns:
      - Scenario
      - Core Assumptions
      - Valuation / Return Logic
      - Probability Signal
      - Downside / Upside Triggers
    rows:
      - - Bull Case
        - >-
          TM-B scales smoothly in 2026; DoorDash and Amazon pilots transition into commercial multi-thousand unit
          deployments; gross margin tops 25%.
        - >-
          $2.5B–$3.5B enterprise value supported by high-margin software-enabled fleet operations and autonomous
          delivery premium.
        - 20%
        - Rapid municipal approval for autonomous delivery quads and expanding tier-1 enterprise order books.
      - - Base Case
        - >-
          Consumer e-bike deliveries progress slowly with modest unit margins; autonomous delivery pilots remain in
          testbed status through 2027.
        - >-
          $800M–$1.2B valuation mark requiring bridge capital or additional equity rounds with moderate investor
          dilution.
        - 55%
        - >-
          Continued supply-chain friction, delayed mass production of TM-Q, and extended regulatory certification
          timelines.
      - - Bear Case
        - >-
          Severe manufacturing bottlenecks recur; DoorDash autonomous project stalls; consumer hardware demand softens
          at $3,500–$4,500 price point.
        - >-
          $300M–$500M down-round or recapitalization driven by heavy capital burn across multiple simultaneous vehicle
          programs.
        - 25%
        - >-
          Cancellation of commercial fleet partnerships, battery safety regulatory scrutiny, or inability to syndicate
          Series E beyond existing insiders.
    notes: >-
      Scenarios model potential 24-month return outcomes based on manufacturing execution, commercialization milestones,
      and capital availability.
    claimRefs:
