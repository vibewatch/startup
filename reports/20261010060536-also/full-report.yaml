chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Rivian Heritage, and Executive Leadership
        blocks:
          - type: paragraph
            body: >-
              Also, Inc. was originally incubated in 2022 as a confidential skunkworks initiative within Rivian
              Automotive under the direction of Chief Executive Officer RJ Scaringe. Seeking to address urban mobility
              beyond full-sized electric adventure vehicles, Scaringe organized an engineering and design group that
              recruited talent from Apple, Google, Specialized, and Tesla, collaborating with Jony Ive's LoveFrom design
              studio on early vehicle concepts. In March 2025, Rivian formally spun out the entity as an independent
              enterprise, retaining a minority equity stake and board representation. Headquartered in Palo Alto,
              California, the company is led by Co-Founder and President Chris Yu, previously Rivian's Vice President of
              Future Programs, who directs engineering and operational scaling across common vehicle architectures.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO010
              - CO011
      - number: '1.2'
        title: Capitalization Trajectory, Valuation, and Strategic Alliances
        blocks:
          - type: paragraph
            body: >-
              Also has pursued an aggressive institutional capitalization strategy, raising $455 million in total equity
              financing within eighteen months of corporate independence. In spring 2026, the company completed a $200
              million Series C round led by Greenoaks, with participation from Prysm Capital and a strategic equity
              commitment from DoorDash, establishing a $1 billion post-money valuation mark. Alongside this financing,
              Also entered into a multi-year commercial collaboration with DoorDash to co-develop purpose-built
              autonomous delivery vehicles for dense urban corridors, with DoorDash Labs Head Stanley Tang joining
              Also's board as an observer. In August 2026, Also expanded its syndicate by closing a $150 million Series
              D financing round led by Prysm Capital's Jay Park, with continued participation from Eclipse Capital,
              Greenoaks, and MVP Ventures, lifting its valuation above $1 billion to accelerate autonomous vehicle
              platform deployment.
            claimRefs:
              - CO006
