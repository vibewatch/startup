              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Virtual Drivetrain Vulnerability
            body: >-
              Also's DreamRide pedal-by-wire system eliminates standard chain maintenance but introduces a
              single-point-of-failure risk: if battery management, sensors, or power electronics fail, the bike cannot
              be pedaled like a conventional bicycle. Without an established nationwide independent repair network,
              roadside mechanical fallback is impossible.
            calloutType: risk
            claimRefs:
              - CR001
              - CR007
              - CR010
          - type: callout
            title: Capital Discipline at Unicorn Valuation
            body: >-
              Securing $150 million in Series D funding extends Also's operating runway into 2027, but the $1
              billion-plus valuation was established before demonstrating volume manufacturing or positive unit
              economics. Premature expansion across multiple simultaneous form factors (e-bikes, quads, and autonomous
              robots) heightens cash burn risk.
            calloutType: insight
            claimRefs:
              - CR009
              - CR013
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Core Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Also rests on its ability to leverage Rivian engineering pedigree and a
              shared modular architecture to capture both high-margin consumer micromobility demand and high-volume
              commercial last-mile delivery contracts. Spun out from Rivian with backing from founder RJ Scaringe and
              led by former future-programs executive Chris Yu, Also has engineered common battery, electronics, and
              pedal-by-wire DreamRide subsystems that deploy across both two-wheel e-bikes and four-wheel cargo quads.
              Commercial partnerships with tier-1 operators, including Amazon for cargo quad delivery and DoorDash for
              autonomous delivery vehicle co-development, provide significant commercial validation and captive
              deployment channels. However, the foundational anti-thesis centers on acute manufacturing and execution
              risks inherent in scaling complex hardware. Also missed both its spring and July 2026 delivery targets for
              the flagship $4,500 TM-B Launch Edition due to supply-chain bottlenecks in electronic components and raw
              materials, demonstrating early operational fragility. Furthermore, hardware margins in micromobility are
              historically vulnerable to warranty claims, firmware issues, and supplier inflation, creating downside
              risk if mass production costs fail to support the premium retail pricing.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV007
              - CV008
      - number: '8.2'
        title: Valuation Context, Financing History, and Syndicate Concentration
        blocks:
          - type: paragraph
            body: >-
              Also's capital trajectory reflects aggressive capitalization ahead of revenue generation, with the company
              raising $455 million across four institutional rounds within seventeen months of its March 2025 spinout.
              The August 2026 Series D round injected $150 million, following a $200 million Series C closed in spring
              2026, sustaining Also's private valuation mark above $1 billion. Notably, the Series D syndicate was led
              by repeat backer Prysm Capital alongside existing investors Eclipse, Greenoaks, and MVP Ventures, without
              adding a new external lead growth investor. While repeat participation from top-tier venture firms signals
              strong insider conviction in Also's autonomous roadmap, independent market observers note that a $1
              billion-plus valuation for a pre-revenue hardware company is stretched and prices the business on the
              speculative future promise of autonomous delivery fleets rather than realized operating cash flows. The
              heavy capital influx creates potential liquidation preference overhang for future equity holders,
              requiring strict valuation discipline for prospective investors until commercial unit volumes materialize.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV009
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV011
              - CV012
      - number: '8.3'
        title: 'Scenario Modeling: Bull, Base, and Bear Cases'
        blocks:
          - type: paragraph
            body: >-
              Given the wide dispersion of potential operating outcomes for pre-revenue hardware platforms, valuation
              must be analyzed across explicit probabilistic scenarios. In the bull case, Also resolves early TM-B
              manufacturing bottlenecks, ramps monthly shipments through late 2026, and successfully converts DoorDash
              and Amazon pilots into multi-thousand-unit commercial deployments, justifying an enterprise valuation of
              $2.5 billion to $3.5 billion within 24 to 36 months. In the base case, consumer e-bike adoption proceeds
              moderately with positive but modest unit gross margins, while autonomous vehicle deployments remain
              restricted to controlled pilot testing through 2027, maintaining valuation around the $800 million to $1.2
              billion range and necessitating additional equity financing. In the bear case, recurring supply-chain
              disruptions stall TM-B series production, consumer order cancellations rise, and autonomous commercial
              testing fails to demonstrate favorable unit delivery costs, leading to pilot terminations and forcing a
              down-round recapitalization at $300 million to $500 million.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV010
              - CV013
              - CV014
      - number: '8.4'
        title: Recommendation Framework, Exit Readiness, and Diligence Criteria
        blocks:
          - type: paragraph
            body: >-
              Synthesizing the empirical evidence leads to a definitive recommendation of research-more, accompanied by
              a high risk rating and a stretched valuation posture. Although Also possesses exceptional technical
              engineering talent and Tier-1 commercial relationships, entering at a $1 billion-plus valuation before
              verified series manufacturing and audited gross margins exposes investors to severe unpriced downside.
              Clear thesis-break triggers include sustained monthly production rates falling below operational plans,
              customer warranty or safety recalls, or DoorDash discontinuing joint autonomous testing. Prospective
              investors should condition any future capital commitment on rigorous diligence requests: audited bills of
              materials showing positive contribution margin across TM-B and TM-Q, binding minimum commercial purchase
              agreements from fleet partners, and full visibility into Series C and Series D senior liquidation
              preferences.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV011
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Insider Syndicate Concentration at Series D
            body: >-
              Also's $150M Series D round was led by Prysm Capital with participation from existing insiders Eclipse,
              Greenoaks, and MVP Ventures, notably lacking a new external lead growth investor. While insider commitment
              signals strong conviction in the autonomous technology roadmap, the closed syndicate highlights that
              public and cross-over growth investors have not yet validated the $1B+ pre-revenue valuation benchmark.
            calloutType: risk
            claimRefs:
              - CV001
              - CV005
              - CV011
          - type: callout
            title: Entry Discipline and Thesis-Break Triggers
            body: >-
              New investors should maintain strict entry discipline, deferring capital allocation until Also proves
              positive unit gross margins on the TM-B consumer e-bike and transitions DoorDash autonomous pilots into
              commercial fleet deployments. A thesis-break trigger would be established if TM-B delivery run-rates fail
              to achieve target scale by early 2027 or if supply-chain bottlenecks force an emergency recapitalization.
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV012
              - CV014
