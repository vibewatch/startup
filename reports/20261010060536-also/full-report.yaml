      - number: '6.3'
        title: Consumer Adoption Trajectory and Production Milestones
        blocks:
          - type: paragraph
            body: >-
              In the consumer channel, adoption is paced by manufacturing execution on the TM-B electric bike. Following
              multi-month production delays that postponed initial fulfillment, Also commenced deliveries of the TM-B
              Launch Edition to U.S. customers in mid-2026. Alongside initial Launch Edition handoffs, the company
              opened online pre-orders and vehicle configuration access for its Performance and Standard trim models,
              projecting initial customer deliveries in fall 2026. While commercial shipment represents a critical
              milestone in transitioning from pre-production hardware development to customer fulfillment, Also has not
              disclosed reservation counts, deposit conversion rates, or cumulative unit shipments. Market reception
              remains constrained by the ,500 to ,500 price point in a broader micromobility market that has
              historically suffered from compressed hardware margins.
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
