  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Also addresses urban mobility and last-mile delivery through a multi-form-factor strategy that intersects
              several distinct competitive categories. In consumer micromobility, the company's flagship TM-B e-bike
              competes directly against premium electric bicycles from established manufacturers such as Specialized and
              Trek, as well as direct-to-consumer alternatives. In commercial goods transport, Also's TM-Q quad and
              autonomous delivery vehicles target dense urban corridors where full-size cargo vans encounter severe
              congestion, parking citations, and roadway friction. Simultaneously, Also faces emerging competition from
              autonomous sidewalk delivery robots, which offer low labor costs but suffer from severe speed limitations
              and minimal cargo capacity. By positioning its four-wheel platforms to operate within bike lanes, road
              shoulders, and curbside spaces, Also seeks to capture a distinct operational envelope that combines the
              payload volume of light commercial vehicles with the bypass capabilities of micromobility hardware.
              Initial market reaction from Rivian automotive stakeholders reflected skepticism regarding whether an
              electric micromobility spinoff could generate substantial enterprise value relative to capital
              requirements. However, Also's expansion into autonomous delivery systems has repositioned the venture as a
              direct participant in the rapidly evolving automated logistics landscape.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
