              - CR007
              - CR008
              - CR010
      - number: '7.3'
        title: Counterparty Dependence and Valuation Resilience
        blocks:
          - type: paragraph
            body: >-
              Also's commercial expansion strategy relies heavily on key enterprise relationships and substantial
              capital infusions. In commercial delivery, Also entered a multi-year commercial collaboration and received
              strategic funding from DoorDash to deploy small autonomous delivery vehicles, with DoorDash Labs
              leadership joining Also's board as an observer [CR005, CR006]. While this commercial alliance provides a
              marquee deployment proving ground, DoorDash simultaneously maintains an internal autonomy division testing
              its own road-capable delivery robot ('Dot') in Arizona, creating potential alignment and channel conflicts
              [CR005]. On the capital side, Also completed a $150 million Series D financing in August 2026 led by Prysm
              Capital alongside Eclipse, Greenoaks, and MVP Ventures, lifting total disclosed funding to $455 million
              [CR009, CR013, CR014]. Although Prysm and existing backers demonstrated strong repeat conviction, the
              syndicate remains concentrated among early Rivian backers without new crossover growth leads [CR013,
              CR014]. With a private valuation benchmark exceeding $1 billion before achieving scaled volume production,
              Also faces margin compression and down-round sensitivity if commercial deliveries or unit gross margins
              lag plan [CR005, CR013, CR014].
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
