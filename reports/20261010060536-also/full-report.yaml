      - number: '3.3'
        title: Pricing Structures and Multi-Homing Switching Costs
        blocks:
          - type: paragraph
            body: >-
              Commercial packaging in micromobility and fleet delivery diverges significantly between consumer retail
              channels and enterprise logistics contracts. For consumer buyers, Also's TM-B lists between $3,500 and
              $4,500, positioning the vehicle in the premium enthusiast and commuter segment alongside high-end
              pedal-assist bikes from legacy cycling brands. In commercial fleet markets, Also engages through
              enterprise co-development and equipment supply contracts, such as its strategic agreements with DoorDash
              and Amazon. Fleet operators exhibit pronounced multi-homing behavior, maintaining concurrent pilots with
              conventional van manufacturers, internal robotics projects, and third-party autonomous hardware providers
              to avoid vendor lock-in. Because switching costs between vehicle hardware vendors remain low in the
              absence of proprietary charging or software integration, Also's pricing durability relies on delivering
              measurable reductions in total cost per delivery trip. While Also closed a $150 million Series D financing
              round led by Prysm Capital to accelerate its autonomous platform, the underlying unit economics and
              contractual volume commitments with its enterprise partners remain undisclosed, leaving open questions
              regarding long-term hardware gross margins and fleet operating costs.
            claimRefs:
              - CP004
              - CP007
              - CP012
              - CP013
              - CP014
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP007
              - CP012
              - CP014
      - number: '3.4'
        title: Moat Durability and Autonomous Displacement Risks
        blocks:
          - type: paragraph
            body: >-
              Also's competitive moat is anchored in three pillars: its proprietary shared vehicle architecture spanning
              consumer and commercial form factors, intellectual property and software synergies inherited from Rivian,
              and commercial access to anchor enterprise partners. Utilizing a common electrical and software
              architecture across the TM-B e-bike, TM-Q quad, and autonomous delivery prototypes allows Also to amortize
              core engineering investments across disparate market segments. Nonetheless, the durability of this moat
              faces substantial threats from hardware commoditization, incumbent response, and execution delays.
              Historical micromobility ventures frequently suffered from rapid capital depletion when unit hardware
              margins proved thinner than projected, a risk heightened by Also's private market valuation exceeding $1
              billion. Furthermore, manufacturing execution remains a critical vulnerability: customer deliveries of the
              TM-B Launch Edition were delayed by several months before initial fulfillment began in mid-2026. If
              low-speed autonomous delivery robotics achieve regulatory clearance and reliability faster than Also can
              ramp scaled domestic manufacturing, nimble autonomous software entrants paired with contract manufacturers
              could displace Also's proprietary hardware in commercial delivery fleets.
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP010
              - CP012
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Valuation Divergence from Commercial Footprint
            body: >-
              Also's valuation exceeding $1 billion reflects an aggressive multiple that prices the business as an
              autonomous delivery technology provider rather than an e-bike manufacturer. With the flagship TM-B having
              suffered months of initial delivery delays and commercial quad platforms still in early enterprise pilots,
              the valuation benchmark creates significant downside exposure if autonomous fleet deployment timelines
              lengthen.
            calloutType: risk
            claimRefs:
              - CP006
              - CP009
              - CP012
          - type: callout
            title: Bike Lane Advantage over Sidewalk and Road Solutions
            body: >-
              By developing vehicles capable of carrying over 400 pounds while operating inside bike lanes and road
              shoulders, Also targets the infrastructure sweet spot between slow sidewalk delivery robots and
              traffic-constrained full-size delivery vans. Sustaining this advantage requires maintaining regulatory
              access to bike infrastructure while scaling autonomous safety validation.
            calloutType: insight
            claimRefs:
              - CP001
              - CP004
              - CP005
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Monetization Model
        blocks:
          - type: paragraph
            body: >-
              Also operates a multi-tiered commercial model centered on premium electric micromobility hardware,
              augmented by commercial fleet supply, consumer credit partnerships, and recurring software services. The
              cornerstone of the consumer business is the flagship TM-B electric bike, which carries a list price of
              $4,500. This places Also squarely in the premium tier of the consumer micromobility market, well above
              mass-market commuter e-bikes that typically retail between $1,500 and $2,500. To soften consumer upfront
              acquisition barriers, Also partnered with Chase Slate to offer a 0% introductory financing structure,
              effectively shifting customer cash outlays into monthly installments while relying on financial
              institution credit underwriting. In addition to consumer two-wheelers, Also has designed four-wheel
              pedal-assist platforms, specifically the TM-Q in both consumer and commercial configurations. Commercial
              monetization targets high-density urban logistics through fleet supply agreements, demonstrated by Also's
              multi-year collaboration with Amazon to deploy custom e-cargo quads across North American and European
              delivery hubs. While list pricing and initial pre-orders have been publicly disclosed, realized revenue
              quality remains uncertain because early shipments are limited to the Launch Edition, with volume
              commercial deliveries not expected until late 2026.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
