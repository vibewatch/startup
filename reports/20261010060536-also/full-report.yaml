      - number: '5.3'
        title: Urban Micro-Mobility Workflow and Commercial Delivery Applications
        blocks:
          - type: paragraph
            body: >-
              Urban logistics workflows are increasingly bottlenecked by curbside congestion, double parking citations,
              and roadway gridlock that degrade traditional van delivery economics. ALSO positions its small electric
              vehicles specifically for the transition zone between roadway and sidewalk infrastructure, including bike
              lanes, road shoulders, and curbside loading areas where conventional cargo vans cannot efficiently
              operate. In commercial last-mile food and parcel delivery, ALSO established a multi-year commercial
              agreement with DoorDash alongside a strategic investment during its Series C round. The partnership pairs
              ALSO's purpose-built small EV chassis with DoorDash Labs autonomous systems to test driverless delivery in
              dense metropolitan environments. By deploying compact four-wheel and two-wheel form factors with 400-pound
              payload ratings, commercial operators aim to reduce per-trip delivery costs and bypass vehicular traffic
              delays. However, commercial deployment remains in co-development testing, with full autonomy facing
              complex edge cases around pedestrian interactions, curb geometry, and municipal regulatory permissions.
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE008
              - CE010
              - CE011
