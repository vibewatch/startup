      - number: '3.2'
        title: Competitor Profiles and Capability Assessment
        blocks:
          - type: paragraph
            body: >-
              Evaluating Also against existing mobility and logistics solutions reveals stark operational tradeoffs
              across speed, payload capacity, and regulatory positioning. Traditional electric delivery vans operated by
              enterprise carriers provide massive volume exceeding 1,000 pounds, but their physical footprint excludes
              them from bike lanes and creates significant urban delivery bottlenecks. Conversely, autonomous sidewalk
              rovers operated by players such as Starship Technologies or Serve Robotics navigate pedestrian spaces at 4
              to 6 miles per hour with payloads generally restricted to under 50 pounds. DoorDash has pursued an
              internal robotics strategy through DoorDash Labs, testing its road-capable 'Dot' delivery robot in the
              Phoenix metropolitan area with integrated lidar, radar, and camera sensor suites at speeds up to 20 miles
              per hour. Also's commercial quad platform claims a payload threshold exceeding 400 pounds while retaining
              the agility to navigate designated cycling and curb infrastructure. Strategic partnerships with major
              logistics operators underpin this capability strategy: DoorDash completed an equity investment and
              executed a multi-year commercial co-development agreement with Also to build purpose-built autonomous
              delivery vehicles, while Amazon established agreements for commercial quad vehicle supply. Leveraging
              Rivian's foundation model autonomy and centralized compute architecture provides Also with software
              capabilities that traditional bicycle and micromobility manufacturers cannot match in-house.
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
