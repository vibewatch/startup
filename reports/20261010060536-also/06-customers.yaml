callouts:
- calloutType: risk
  title: Concentration Risk in Pre-Production Commercial Partnerships
  body: 'Also''s commercial validation rests almost entirely on two tier-one enterprise partnerships: DoorDash for autonomous
    last-mile delivery and Amazon for commercial delivery quads. Because both programs remain in co-development and early
    testing rather than contractual volume deployment, any pilot failure or strategy shift by DoorDash or Amazon would substantially
    impair Also''s commercial adoption thesis.'
  claimRefs:
  - CU005
  - CU007
  - CU013
  - CU014
- calloutType: insight
  title: Bifurcated B2B Fleet and B2C Premium Consumer Strategy
  body: Also is executing a dual go-to-market strategy that balances near-term consumer revenue from high-priced ,500–,500
    e-bikes with long-term high-volume enterprise delivery fleet deployments. While this leverages a unified underlying electric
    vehicle architecture, it simultaneously forces the startup to manage disparate consumer direct-to-consumer fulfillment
    and complex enterprise autonomy integrations.
  claimRefs:
  - CU001
  - CU003
  - CU008
  - CU010
