company:
  name: Also
chapter:
  number: 6
  title: Customers
  summary: Also operates a bifurcated commercial customer model targeting high-volume enterprise logistics fleets and premium
    direct-to-consumer commuters. Enterprise adoption is anchored by multi-year co-development and deployment partnerships
    with DoorDash and Amazon for small-footprint delivery EVs, while consumer adoption centers on the TM-B e-bike lineup (,500–,500)
    where customer deliveries commenced in mid-2026 following multi-month launch delays. The company exhibits extreme commercial
    customer concentration and pre-revenue execution risk across its flagship accounts.
sections:
- id: customer-segmentation-and-buyer-profiles
  title: Customer Segmentation and Buyer Profiles
  body: 'Also targets two distinct customer segments: enterprise logistics fleet operators and premium urban consumer commuters.
    The enterprise segment is characterized by institutional delivery platforms seeking purpose-built small electric vehicles
    to navigate dense urban centers where traditional delivery vans face congestion, parking constraints, and high cost per
    trip. These commercial buyers require vehicle platforms capable of operating legally and efficiently in road-adjacent
    spaces, including bike lanes, shoulders, and curbsides, while carrying substantial cargo payloads. In contrast, the consumer
    segment targets individual urban commuters purchasing premium electric pedal-assist bicycles priced from ,500 to ,500.
    This consumer cohort prioritizes automotive-grade design, proprietary powertrain technology, and software connectivity
    inherited from Also''s incubation within Rivian.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
- id: enterprise-deployments-and-commercial-partnerships
  title: Enterprise Deployments and Commercial Partnerships
  body: 'Also''s commercial deployment strategy is anchored by two flagship enterprise accounts: DoorDash and Amazon. Following
    a 00 million Series C financing in early 2026, Also entered into a multi-year commercial agreement with DoorDash to co-develop
    and deploy purpose-built autonomous delivery vehicles at scale. As part of this strategic alliance, DoorDash Co-Founder
    and Head of DoorDash Labs Stanley Tang joined the partnership in an observer capacity, giving DoorDash board-level
    visibility into co-development milestones. In parallel, Also established a commercial
    vehicle supply relationship with Amazon for a heavy-duty commercial cargo delivery quad capable of carrying over 400 pounds
    of payload in bike lanes for European and U.S. fleet trials. However, both enterprise programs remain in co-development
    and early testing rather than binding volume fleet operations, leaving contractual conversion and deployment timelines
    unverified.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU003
  figureRefs:
  - FU001
- id: consumer-adoption-and-delivery-trajectory
  title: Consumer Adoption Trajectory and Production Milestones
  body: In the consumer channel, adoption is paced by manufacturing execution on the TM-B electric bike. Following multi-month
    production delays that postponed initial fulfillment, Also commenced deliveries of the TM-B Launch Edition to U.S. customers
    in mid-2026. Alongside initial Launch Edition handoffs, the company opened online pre-orders and vehicle configuration
    access for its Performance and Standard trim models, projecting initial customer deliveries in fall 2026. While commercial
    shipment represents a critical milestone in transitioning from pre-production hardware development to customer fulfillment,
    Also has not disclosed reservation counts, deposit conversion rates, or cumulative unit shipments. Market reception remains
    constrained by the ,500 to ,500 price point in a broader micromobility market that has historically suffered from compressed
    hardware margins.
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  tableRefs:
  - TU002
- id: customer-concentration-and-durability-risks
  title: Customer Concentration, Retention, and Durability Risks
  body: Also faces substantial customer concentration and commercial durability risks given that its commercial viability
    relies almost entirely on DoorDash and Amazon. DoorDash maintains an internal autonomy division and has concurrently tested
    alternative robotic platforms, such as its Dot delivery robot in Arizona, without clarifying how Also's vehicles fit within
    its broader autonomous roadmap. Neither DoorDash nor Amazon has publicly disclosed binding volume purchase commitments,
    multi-year minimum purchase guarantees, or fleet rollout schedules. Commercial channel diligence also notes that European
    IT distributor ALSO Holding AG operates an unrelated technology reseller network, distinct from Also's vehicle operations.
    Because Also is still ramping initial production and piloting autonomous capabilities, the company possesses no historical
    net revenue retention (NRR), gross retention rate (GRR), or customer cohort churn metrics. Until autonomous delivery vehicles
    operate commercially at scale, Also's  billion-plus valuation represents a bet on development velocity rather than proven
    customer retention.
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
