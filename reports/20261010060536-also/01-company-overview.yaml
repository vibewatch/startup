chapter:
  number: 1
  title: "Company Overview"
  summary: "Spun out from Rivian in March 2025, Also is a Palo Alto-based micromobility and small electric vehicle manufacturer developing the TM-B consumer e-bike and autonomous delivery platforms in partnership with DoorDash and Amazon. Following a $150 million Series D financing in August 2026 led by Prysm Capital, the company has raised $455 million in total equity at a valuation above $1 billion, yet faces execution risks after supply chain bottlenecks delayed inaugural TM-B deliveries into late summer 2026."
sections:
  - id: "corporate-identity-and-origins"
    title: "Corporate Identity, Rivian Heritage, and Executive Leadership"
    body: "Also, Inc. was originally incubated in 2022 as a confidential skunkworks initiative within Rivian Automotive under the direction of Chief Executive Officer RJ Scaringe. Seeking to address urban mobility beyond full-sized electric adventure vehicles, Scaringe organized an engineering and design group that recruited talent from Apple, Google, Specialized, and Tesla, collaborating with Jony Ive's LoveFrom design studio on early vehicle concepts. In March 2025, Rivian formally spun out the entity as an independent enterprise, retaining a minority equity stake and board representation. Headquartered in Palo Alto, California, the company is led by Co-Founder and President Chris Yu, previously Rivian's Vice President of Future Programs, who directs engineering and operational scaling across common vehicle architectures."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-stakeholder-governance"
    title: "Capitalization Trajectory, Valuation, and Strategic Alliances"
    body: "Also has pursued an aggressive institutional capitalization strategy, raising $455 million in total equity financing within eighteen months of corporate independence. In spring 2026, the company completed a $200 million Series C round led by Greenoaks, with participation from Prysm Capital and a strategic equity commitment from DoorDash, establishing a $1 billion post-money valuation mark. Alongside this financing, Also entered into a multi-year commercial collaboration with DoorDash to co-develop purpose-built autonomous delivery vehicles for dense urban corridors, with DoorDash Labs Head Stanley Tang joining Also's board as an observer. In August 2026, Also expanded its syndicate by closing a $150 million Series D financing round led by Prysm Capital's Jay Park, with continued participation from Eclipse Capital, Greenoaks, and MVP Ventures, lifting its valuation above $1 billion to accelerate autonomous vehicle platform deployment."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
    tableRefs:
      - "TO003"
  - id: "commercial-execution-and-operating-milestones"
    title: "Commercial Ramp, Supply Chain Disruptions, and Operating Metrics"
    body: "Also's commercial product roadmap encompasses consumer micromobility vehicles, fleet delivery quads, and autonomous delivery hardware. The company's inaugural consumer product, the TM-B electric bike, features a proprietary 'DreamRide' pedal-by-wire system, 180 Nm claimed torque, and retail pricing of $3,500 for the standard edition and $4,500 for the Launch Edition. However, execution hurdles emerged when global supply chain disruptions and electronic component shortages forced the company to delay initial deliveries past its original spring 2026 window. These delays generated vocal customer discontent on community forums and triggered pre-order reservation cancellations before Launch Edition units finally shipped from manufacturers to US warehouses in late July 2026. Furthermore, Also does not disclose commercial revenue run-rates, customer fleet volumes, or employee census figures, reflecting an early-stage hardware profile where long-term enterprise valuation hinges on unproven autonomous execution."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
