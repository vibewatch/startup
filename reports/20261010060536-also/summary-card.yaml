  topStrengths:
    - Rivian engineering pedigree and continuing strategic alignment.
    - DoorDash and Amazon provide credible commercial validation for autonomous and fleet use cases.
    - Series D financing extends runway and reinforces insider conviction.
    - TM-B shipments have begun, proving the product has moved beyond pure prototype status.
  topRisks:
    - Hardware manufacturing and supply-chain execution remain fragile.
    - Unit economics and gross margins are still undisclosed.
    - Capital structure and valuation are stretched for a pre-revenue hardware company.
    - Commercial partner concentration leaves the thesis sensitive to DoorDash and Amazon execution.
  unresolvedGaps:
