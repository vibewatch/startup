chapter:
  number: 5
  title: "Product & Technology"
  summary: "Also develops lightweight electric vehicles built on a shared modular architecture spanning the consumer TM-B e-bike, commercial TM-Q cargo quad, and an autonomous delivery platform co-developed with DoorDash. While early customer deliveries commenced in August 2026 following supply chain delays, Also remains primarily a pre-scale hardware company with unverified autonomous road testing and commercial production economics."
sections:
  - id: sec-product-overview
    title: "Product Portfolio and Customer Workflow Integration"
    body: "ALSO develops small-format electric vehicles designed to operate within dense urban environments where full-sized automobiles face severe congestion. The core product lineup spans consumer micromobility and commercial logistics, anchored by the TM-B electric bicycle and the TM-Q commercial delivery quad. The TM-B is a premium pedal-assist two-wheeler featuring an integrated frame, battery, and powertrain, offered in Launch Edition, Performance, and Standard trims with pricing starting at $3,500 and reaching $4,500 for launch configurations. Following months of component shortages that pushed fulfillment past its initial spring schedule, ALSO initiated customer shipments of the TM-B Launch Edition in August 2026 while opening pre-order configurations for subsequent models. For commercial fleet operators, ALSO designed the TM-Q four-wheel cargo vehicle, engineered to transport payloads exceeding 400 pounds while fitting within designated bike lanes and pedestrian-adjacent infrastructure. In addition to direct consumer sales, ALSO secured an agreement to supply commercial cargo quads to Amazon for European and U.S. urban delivery operations, though the company's currently verified delivery footprint remains confined to initial retail e-bike batches."
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE013
      - CE014
    tableRefs:
      - TE001
  - id: sec-architecture
    title: "Modular Vehicle Architecture and Operating Platform"
    body: "ALSO's core engineering strategy centers on a vertically integrated, shared electric vehicle architecture intended to support multiple form factors without redesigning foundational subsystems. Originally incubated as a skunkworks initiative inside Rivian by RJ Scaringe, ALSO recruited engineering leadership from Apple, Tesla, Google, and Specialized to develop proprietary motor controllers, battery management systems, and electronic control units. Rather than treating two-wheel consumer e-bikes, commercial quads, and autonomous delivery pods as independent hardware programs, ALSO utilizes common battery modules, power electronics, and firmware across its entire portfolio. This unified architecture provides software telemetry, over-the-air firmware updates, and integrated safety systems such as custom Alpha Wave protective equipment. Furthermore, the shared platform serves as the physical and electrical foundation for ALSO's autonomous delivery roadmap, enabling rapid integration of perception sensor suites and drive-by-wire controls onto low-speed vehicle chassis."
    claimRefs:
      - CE002
      - CE005
      - CE010
      - CE011
      - CE012
    tableRefs:
      - TE003
    figureRefs:
      - FE001
  - id: sec-use-cases-commercial
    title: "Urban Micro-Mobility Workflow and Commercial Delivery Applications"
    body: "Urban logistics workflows are increasingly bottlenecked by curbside congestion, double parking citations, and roadway gridlock that degrade traditional van delivery economics. ALSO positions its small electric vehicles specifically for the transition zone between roadway and sidewalk infrastructure, including bike lanes, road shoulders, and curbside loading areas where conventional cargo vans cannot efficiently operate. In commercial last-mile food and parcel delivery, ALSO established a multi-year commercial agreement with DoorDash alongside a strategic investment during its Series C round. The partnership pairs ALSO's purpose-built small EV chassis with DoorDash Labs autonomous systems to test driverless delivery in dense metropolitan environments. By deploying compact four-wheel and two-wheel form factors with 400-pound payload ratings, commercial operators aim to reduce per-trip delivery costs and bypass vehicular traffic delays. However, commercial deployment remains in co-development testing, with full autonomy facing complex edge cases around pedestrian interactions, curb geometry, and municipal regulatory permissions."
    claimRefs:
      - CE003
      - CE004
      - CE007
      - CE008
      - CE010
      - CE011
    tableRefs:
      - TE002
  - id: sec-production-risks
    title: "Manufacturing Execution, Supply Chain Friction, and Diligence Blockers"
    body: "Transitioning from concept design to commercial-scale hardware manufacturing presents acute operational risks for ALSO. The company's initial consumer launch experienced substantial friction when TM-B deliveries were delayed by several months due to global raw material constraints and electronic component supply shortages. Because ALSO required full $4,500 upfront payments upon reservation under customer terms that expressly disclaimed delivery dates and excused supply chain shortages via force majeure clauses, customer frustration escalated, prompting cancellations and requiring remedial concessions such as free protective gear and store credits. Although ALSO secured $350 million in capital across Series C and Series D rounds in 2026 to finance manufacturing scale and autonomous development, its production volumes, unit bill of materials, and gross margin profiles remain entirely undisclosed. For diligence underwriters, key technical risks include ongoing component procurement dependencies, battery pack safety certifications, and unverified autonomous fleet reliability in dense traffic."
    claimRefs:
      - CE001
      - CE007
      - CE008
      - CE009
      - CE014
