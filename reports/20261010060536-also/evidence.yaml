      Amazon.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: autonomous-delivery-contracts
    missingEvidence: >-
      Specific unit volume commitments, revenue-sharing terms, and commercial deployment milestones under the multi-year
      DoorDash autonomous delivery agreement.
    whyItMatters: >-
      Without contractually guaranteed fleet deployment numbers, Also's $1 billion valuation rests on prospective
      autonomous capability rather than committed commercial revenues.
    diligencePath: >-
