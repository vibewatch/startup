evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited financial statements, commercial revenue run-rate figures, customer fleet delivery counts, and official
      employee census breakdown.
    whyItMatters: >-
      As a privately held hardware venture with a $1 billion valuation, lack of unit-level margin disclosures and cash
      burn rates obscures capital efficiency and future runway requirements.
    diligencePath: >-
      Request private financial statements, management accounts, unit bill-of-materials economics, and signed fleet
      purchase order schedules during formal diligence.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: doordash-commercial-terms
    missingEvidence: >-
      Granular commercial contract terms, unit volume commitments, deployment schedules, and pricing terms under the
      DoorDash multi-year agreement.
    whyItMatters: >-
      Directly determines the near-term obtainable market size (SOM) and revenue ramp for Also's commercial vehicle
      platform.
    diligencePath: >-
      Review master commercial service agreements, vehicle supply purchase orders, or partner regulatory pilot filings
      in target municipal deployment zones.
    relatedQuestionRefs:
      - QM007
  - id: GM002
    type: missing-source
    severity: material
    topic: amazon-quad-procurement
    missingEvidence: Contracted supply volumes, delivery timelines, and geographic deployment scope for the Amazon cargo quad program.
    whyItMatters: Validates enterprise cargo quad adoption beyond food delivery into broader parcel logistics TAM.
    diligencePath: >-
