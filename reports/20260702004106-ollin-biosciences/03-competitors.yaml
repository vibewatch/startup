    {
      "id": "moat-and-risk",
      "title": "Moat durability and competitive risk",
      "body": "The moat picture is mixed. Ollin has a credible early differentiation narrative and some mechanism/IP support, but the incumbents own scale, labels, and installed-base trust today. Outlook demonstrates how hard retina approval can still be even for a lower-cost familiar mechanism, and Apellis shows that adjacent retina players can deepen account relationships without being direct anti-VEGF substitutes. The real underwriting question is whether Ollin's phase 3 program can convert a small-sample edge into first-line prescribing behavior before incumbents or low-cost alternatives blunt the advantage.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences competitors summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences competitors summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences competitors summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences competitors summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
