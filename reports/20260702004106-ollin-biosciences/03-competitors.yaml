  "sections": [
    {
      "id": "landscape-classes",
      "title": "Landscape classes and who actually competes",
      "body": "Ollin sits inside a layered retina landscape rather than a single peer set. The direct premium-biologic comparison is Roche/Genentech's Vabysmo and Regeneron's Eylea franchise. The lower-cost substitute set is compounded Avastin plus ophthalmic biosimilars, while Outlook is trying to formalize ophthalmic bevacizumab under a label. Apellis matters as a retina call-point competitor, but not as a direct DME/wet-AMD anti-VEGF substitute. Scale markers make the asymmetry obvious: Ollin is challenging incumbents with far deeper balance sheets, broader organizations, and already-commercial labels.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences competitors summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences competitors summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences competitors summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences competitors summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
