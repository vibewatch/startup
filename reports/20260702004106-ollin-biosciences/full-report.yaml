      - number: '1.4'
        title: Milestones, clinical arc, and the next inflection
        blocks:
          - type: paragraph
            body: >-
              Ollin’s chronology is compact but high signal. The company says it was established in 2023, emerged
              publicly in September 2025 with financing and two bispecific programs, disclosed positive Week-12 JADE
              topline data in January 2026, published 20-week final data in March 2026, previewed additional conference
              presentations in April 2026, and then closed a $330 million Series B in June 2026. That sequence matters
              because it shows a company compressing a large amount of development, capital formation, and external
              signaling into a short public window.


              The central next milestone is not another financing headline but the transition into global Phase 3 for
              OLN324 in DME and wet AMD. Public sources show the company has already completed key FDA and EMA
              interactions and intends to start pivotal studies in the second half of 2026. That makes the current state
              of play clear: Ollin is no longer simply a launch-stage story. It is now a late-clinical private biotech
              whose valuation, strategy, and future financing flexibility will increasingly hinge on whether phase 3
              execution matches the promise of the phase 1b narrative.


