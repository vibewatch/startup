        - id: j2
          label: Clinical evaluation by prescribers / KOLs
          detail: Physicians compare DME and wAMD results against faricimab/Eylea standards and assess safety durability.
          tone: positive
        - id: j3
          label: Phase 3 participation and evidence accumulation
          detail: Sites, investigators, and patients create the main current adoption proof before launch.
          tone: positive
        - id: j4
          label: Regulatory approval and reimbursement gate
          detail: Even strong clinical proof must clear label, prior-auth, and buy-and-bill economics barriers.
          tone: warning
        - id: j5
          label: Initial prescribing / injection use
          detail: First commercial use will likely start in DME-leading retina accounts if access and data line up.
          tone: neutral
        - id: j6
          label: Repeat dosing / account expansion
