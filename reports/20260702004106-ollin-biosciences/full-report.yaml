  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Asset map and product architecture
        blocks:
          - type: paragraph
            body: >-
              Ollin's public product map is unusually concentrated for a company already raising a $330 million phase 3
              round. OLN324 is the center of gravity: a VEGF/Ang2 bispecific for DME and wAMD positioned as a
              best-in-class challenger to faricimab. OLN102 broadens the pipeline into thyroid eye disease, but remains
              preclinical, so the practical architecture today is an asset-centric retina program supported by licensing
              relationships, KOLs, and regulatory execution rather than a broadly disclosed in-house platform or
              manufacturing stack.


              Public evidence nevertheless anchors the chapter on a small set of durable facts: Ollin is an
              asset-centric ophthalmology biotech whose disclosed product stack is dominated by OLN324, a
              next-generation VEGF/Ang2 bispecific now positioned for phase 3 after head-to-head phase 1b data in DME
              and wAMD. Public evidence supports differentiated molecule design and clinical signal, but manufacturing,
              CMC, and quality-system detail remain largely undisclosed, and the nearest public practitioner signal is
              clinician/trade-surface coverage rather than a true technical or developer surface. The chapter therefore
              emphasizes what the current public record proves and where diligence still depends on private company
              materials.


