  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Ollin is not attacking all of ophthalmology. The relevant market boundary is the chronic anti-VEGF
              treatment pool inside wet AMD and DME, plus the substitute set that shapes price expectations and
              prescribing behavior. Disease-burden sources show both conditions matter clinically, while retina-market
              sources show physicians already choose among branded biologics, biosimilars, and off-label compounded
              bevacizumab. That means the real comparison set is premium biologic efficacy versus a lower-cost
              substitute ladder, not simply whether retinal disease is common.


