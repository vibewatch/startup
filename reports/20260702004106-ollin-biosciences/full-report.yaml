      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The available sizing evidence is directional, not fully precise. Ollin cites a $15 billion retina market,
              and payer commentary shows that a single branded anti-VEGF product can represent multi-billion-dollar
              historical Medicare spend. Those data points support a large commercial prize, but they do not produce a
              clean SAM or SOM for a new entrant focused on DME and wet AMD. The right draft posture is to preserve
              multiple public lenses, state their limits explicitly, and avoid pretending that broad market rhetoric
              equals underwritten demand.


