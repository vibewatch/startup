      - number: '3.3'
        title: Pricing pressure, switching, and channel economics
        blocks:
          - type: paragraph
            body: >-
              The commercial fight is unlikely to be won on mechanism alone. AJMC's payer lens shows Eylea historically
              dominated spend while Vabysmo could carry the highest cost per claim, and the biosimilar literature points
              to meaningful downward price pressure on premium anti-VEGF brands. At the same time, low-cost compounded
              Avastin remains the practical floor in many decision paths. That means Ollin probably needs enough
              efficacy or durability to justify premium adoption, because public evidence does not show a clean way to
              beat the market on price.


