  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer / user / payer map
        blocks:
          - type: paragraph
            body: >-
              Because Ollin is precommercial, the relevant customer analysis starts with who would buy, use, and pay for
              OLN324 rather than with closed revenue accounts. The future economic buyer is the retina-specialist clinic
              operating inside a buy-and-bill reimbursement model; the user is the retina physician and patient
              population living with DME or wAMD; and payer behavior will determine whether a differentiated molecule
              can overcome cheaper Avastin and biosimilar options. That structure makes payer access as important as
              clinical enthusiasm.


              Public evidence nevertheless anchors the chapter on a small set of durable facts: Ollin is still
              precommercial, so the public “customer” story is really a buyer-user-payer map plus clinician- and
              patient-facing proof rather than paying-customer adoption. The best evidence today is retina-specialist
              validation, U.S. JADE-site participation, and the size of DME/wAMD treatment populations; the biggest
              diligence finding is that no public source proves paying accounts, reimbursement wins, retention, or
              revenue durability yet. The chapter therefore emphasizes what the current public record proves and where
              diligence still depends on private company materials.


