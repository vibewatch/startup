  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, confidence, and price discipline
        blocks:
          - type: paragraph
            body: >-
              A public-only investor should stop short of a buy call. Ollin has momentum, but there is still no public
              round valuation, ownership structure, preference stack, revenue, margin, or runway disclosure. The right
              output is research-more, not because the company looks weak, but because the public evidence does not let
              you judge whether the price is attractive.


              Public evidence nevertheless anchors the chapter on a small set of durable facts: Ollin has an attractive
              clinical and financing story, but public evidence still does not disclose post-money valuation, cap-table
              terms, cash, burn, revenue, or margins. The public-only call should stay research-more, with low
              confidence, high risk, and valuation stance unknown. The chapter therefore emphasizes what the current
              public record proves and where diligence still depends on private company materials.


