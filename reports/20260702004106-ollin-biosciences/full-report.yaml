      - number: '1.3'
        title: Capital base, investor quality, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              The capital story is what most clearly separates Ollin from a typical young private biotech. The company
              launched publicly with $100 million and then, less than a year later, disclosed an oversubscribed $330
              million Series B. That implies $430 million of publicly supportable financing and puts the company in a
              category of private biotech that can plausibly fund pivotal development without immediately returning to
              the market. The investor list is also meaningful: ARCH and TCGX lead, while a16z Bio+Health, Blackstone
              Multi-Asset Investing, RA Capital, T. Rowe, CPP, Commodore, Mubadala, and Monograph widen the syndicate
              into crossover, sovereign, and institutional territory.


              What this does not solve is transparency. The same public materials that are generous on funding and
              optimistic on product milestones are almost silent on current revenue, headcount, cash balance, burn rate,
              and valuation. That means the overview can conclude that Ollin is well financed and institutionally
              validated, but not that it is economically underwritten from public evidence alone.


