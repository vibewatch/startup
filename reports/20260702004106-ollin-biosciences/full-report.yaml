      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              This market is growing, but it is not frictionless. Aging, diabetes, and the chronic need for retinal
              treatment support demand, yet the competitive field is crowded and regulators still require disciplined
              evidence. Biosimilars and Avastin create cost pressure, and state substitution rules plus clinic workflow
              constraints slow apparently rational switching. Ollin's early JADE results create a plausible durability
              narrative, but the company still needs phase 3 and payer-relevant evidence before that narrative can
              reliably overcome incumbent trust and low-cost substitutes.


