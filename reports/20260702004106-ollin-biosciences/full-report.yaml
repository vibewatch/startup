      - number: '3.4'
        title: Moat durability and competitive risk
        blocks:
          - type: paragraph
            body: >-
              The moat picture is mixed. Ollin has a credible early differentiation narrative and some mechanism/IP
              support, but the incumbents own scale, labels, and installed-base trust today. Outlook demonstrates how
