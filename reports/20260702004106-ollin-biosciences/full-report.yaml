  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - DME registrational miss
        - Phase 3 efficacy readout
        - No clinically persuasive superiority or clean noninferiority versus standard comparator
        - Re-rate product thesis and likely valuation support downward
      - - wAMD commercial-thesis erosion
        - Phase 3 wAMD readout
        - Parity without clear durability or safety edge
        - Treat wAMD as optionality rather than core launch pillar
      - - Class-safety event
        - Serious IOI / vasculitis / occlusion signal
        - Any recurrent or severe inflammatory cluster attributable to OLN324
        - Pause launch underwriting and require full risk-mitigation review
      - - Payer-access failure
        - Coverage / ASP strategy review
        - No viable reimbursement position versus Avastin / biosimilar anchors
        - Assume slower uptake and materially lower realized pricing
      - - IP / licensing shock
        - Legal diligence update
        - Blocking patent issue, adverse license term, or collaboration impairment
        - Move to thesis-break review and recut launch probability
    notes: Kill criteria are framed as concrete monitoring thresholds, not as generic caution statements.
