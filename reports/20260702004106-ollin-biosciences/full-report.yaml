      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership depth is a visible strength, but it is also a dependency. Jason Ehrlich appears across every
              reviewed source as the co-founder and chief executive officer, making him not only the operating leader
              but also the most important external narrator of the company’s scientific, fundraising, and strategic
              case. Public launch coverage adds a governance layer that is clearly venture-linked rather than purely
              founder-controlled: Paul Berns chairs the board, Brian Cuneo bridges operating and investor roles through
              ARCH Venture Partners, and the launch disclosures show a board populated by experienced venture,
              company-building, and healthcare figures.


              The scientific advisory board is equally notable. Wykoff, Khanani, Eichenbaum, Chang, Singh, Sheth, and
              Dandekar collectively give the company strong retina-clinician credibility. That matters because OLN324’s
              go-to-market logic depends on physician switching in a specialist market. At the same time, public
              governance disclosures stop well short of cap-table control detail. Outside materials show who is in the
              room, but not how voting power, protective provisions, or observer rights are allocated.


              Public evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences is an
