  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape classes and who actually competes
        blocks:
          - type: paragraph
            body: >-
              Ollin sits inside a layered retina landscape rather than a single peer set. The direct premium-biologic
              comparison is Roche/Genentech's Vabysmo and Regeneron's Eylea franchise. The lower-cost substitute set is
              compounded Avastin plus ophthalmic biosimilars, while Outlook is trying to formalize ophthalmic
              bevacizumab under a label. Apellis matters as a retina call-point competitor, but not as a direct
              DME/wet-AMD anti-VEGF substitute. Scale markers make the asymmetry obvious: Ollin is challenging
              incumbents with far deeper balance sheets, broader organizations, and already-commercial labels.


