  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked top risks
        blocks:
          - type: paragraph
            body: >-
              The highest-risk cluster around Ollin is cumulative: phase 3 execution, eventual label strength,
              reimbursement, and competitive conversion all need to go right for a precommercial company built around
              one primary retina asset. Positive phase 1b data and fresh capital lower immediate financing stress, but
              they do not eliminate the need for strong DME replication, credible wAMD positioning, clean safety, and
              rapid regulatory execution. The market is forgiving of interesting science, but not of ambiguous
              registrational outcomes.


              Public evidence nevertheless anchors the chapter on a small set of durable facts: The dominant Ollin risk
              is not whether the science is interesting, but whether a precommercial, partner-dependent retina company
              can convert promising phase 1b signal into clean phase 3 data, regulatory approval, reimbursement, and
              scalable launch execution. Public evidence highlights meaningful regulatory, IP/legal, safety, payer, and
              partner-dependency exposures; the biggest diligence gaps remain freedom-to-operate, CMC readiness, and
              commercial launch infrastructure. The chapter therefore emphasizes what the current public record proves
              and where diligence still depends on private company materials.


