companyProfile:
  summary: >-
    Ollin Biosciences is an Austin-based private ophthalmology biotech that emerged publicly in 2025 with a two-asset
    bispecific antibody pipeline and then raised a $330 million Series B in June 2026. Its lead program, OLN324, targets
    diabetic macular edema and wet age-related macular degeneration, while OLN102 targets thyroid eye disease and
    Graves’ disease. The company appears to be pursuing an asset-centric development model built around licensed
    biology, retina-focused clinical execution, and heavyweight venture and crossover backing rather than current
    commercial revenue.
