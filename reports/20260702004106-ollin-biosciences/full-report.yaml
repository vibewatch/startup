      - number: '2.3'
        title: Buyer, user, payer, and economics map
        blocks:
          - type: paragraph
            body: >-
              Retina specialists and their clinics are the immediate users and operational buyers, but the payer context
              strongly influences product mix. AAO and NEI sources emphasize a chronic treatment journey with repeated
              injections and follow-up, while payer commentary highlights WAC, ASP, substitution rules, and step-through
              behavior. In practice, Ollin will need a physician-level efficacy story and a payer-level economic story
              at the same time. Without both, the market can remain clinically attractive but commercially harder to
              crack than broad prevalence numbers suggest.


