      - number: '3.2'
        title: Product and label positioning
        blocks:
          - type: paragraph
            body: >-
              Ollin's pitch is clinical differentiation. JADE suggests stronger anatomic control, a possible durability
              edge, and a clean early safety signal versus faricimab. But the incumbents still start ahead on label
              breadth and routine clinical familiarity. Vabysmo already spans nAMD, DME, and RVO. Eylea and Eylea HD
              offer established aflibercept pathways with interval-extension narratives. LYTENAVA tries to make
              bevacizumab easier to buy under a formal label. Ollin therefore enters as a potentially better molecule,
              but not yet a de-risked commercial product.


