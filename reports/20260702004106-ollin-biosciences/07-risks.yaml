    {
      "id": "regulatory-legal-and-safety",
      "title": "Regulatory, legal, and safety exposure",
      "body": "Public sources support several non-trivial hard risks. First, retina programs are operationally demanding and endpoint-sensitive under FDA guidance. Second, the injection-based anti-VEGF class carries well-established clinical risks that can rapidly impair uptake if seen in real-world pharmacovigilance. Third, the patent and licensing picture is opaque: there is clearly active VEGF/Ang2 IP in the field, yet Ollin does not publicly show how much freedom-to-operate or exclusivity it actually controls.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: The dominant Ollin risk is not whether the science is interesting, but whether a precommercial, partner-dependent retina company can convert promising phase 1b signal into clean phase 3 data, regulatory approval, reimbursement, and scalable launch execution. Public evidence highlights meaningful regulatory, IP/legal, safety, payer, and partner-dependency exposures; the biggest diligence gaps remain freedom-to-operate, CMC readiness, and commercial launch infrastructure. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: The dominant Ollin risk is not whether the science is interesting, but whether a precommercial, partner-dependent retina company can convert promising phase 1b signal into clean phase 3 data, regulatory approval, reimbursement, and scalable launch execution. Public evidence highlights meaningful regulatory, IP/legal, safety, payer, and partner-dependency exposures; the biggest diligence gaps remain freedom-to-operate, CMC readiness, and commercial launch infrastructure. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
