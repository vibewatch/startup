    {
      "id": "dependencies-and-kill-criteria",
      "title": "Dependencies, mitigations, and kill criteria",
      "body": "Even if the biology remains sound, Ollin is dependent on external counterparties and opaque infrastructure: licensors, retina investigators, regulators, manufacturing partners, investors, and payers all sit on the critical path. That means diligence should define explicit kill criteria: a DME phase 3 miss, any serious inflammatory signal, unresolved IP challenge, or reimbursement strategy that cannot defend against Avastin and biosimilars should materially change underwriting. Public evidence is strong enough to rank these risks, but not yet strong enough to dismiss them.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: The dominant Ollin risk is not whether the science is interesting, but whether a precommercial, partner-dependent retina company can convert promising phase 1b signal into clean phase 3 data, regulatory approval, reimbursement, and scalable launch execution. Public evidence highlights meaningful regulatory, IP/legal, safety, payer, and partner-dependency exposures; the biggest diligence gaps remain freedom-to-operate, CMC readiness, and commercial launch infrastructure. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: The dominant Ollin risk is not whether the science is interesting, but whether a precommercial, partner-dependent retina company can convert promising phase 1b signal into clean phase 3 data, regulatory approval, reimbursement, and scalable launch execution. Public evidence highlights meaningful regulatory, IP/legal, safety, payer, and partner-dependency exposures; the biggest diligence gaps remain freedom-to-operate, CMC readiness, and commercial launch infrastructure. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
