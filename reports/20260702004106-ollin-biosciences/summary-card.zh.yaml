  topStrengths:
    - Ollin 为一家私有眼科 biotech 拼出了罕见融资底座：公开披露资本 $430M，投资人阵容质量高。
    - OLN324 已披露相对 faricimab 的 DME 消液数据令人鼓舞，并已被定位为 2026 年下半年启动全球 Phase 3 开发。
    - 管理层、董事会和科学顾问披露显示，公司在视网膜开发上可信度高，也接触得到相关专科网络。
  topRisks:
    - 公司仍是私有、尚无收入的 biotech，没有公开披露现金、burn、runway、员工数或估值。
    - OLN324 仍需把早期头对头临床信号转化为关键试验成功，并正面挑战根基深的 anti-VEGF 既有产品。
    - 视网膜疾病未来定价、报销和上市采用，可能受 biosimilar、支付方管控和现有品牌标准挤压。
  unresolvedGaps:
    - Series B 投后估值、证券条款和 cap table 集中度仍未披露。
    - 当前现金余额、burn rate、runway 和项目级支出无法从公开资料获取。
    - 公开资料没有收入、员工数或上市准备度指标，无法检验商业化能力。
    - 与 Innovent 和 VelaVigo 的合作经济条款披露不足，难以建模版税、里程碑或成本分摊漏损。
