  topStrengths:
    - >-
      Ollin has assembled a rare financing base for a private ophthalmology biotech, with $430M of publicly disclosed
      capital and a high-quality investor syndicate.
    - >-
      OLN324 has disclosed encouraging DME drying data versus faricimab and is already being positioned for global Phase
      3 development in H2 2026.
    - >-
      Leadership, board, and scientific advisory disclosures suggest strong retina-development credibility and access to
      relevant specialist networks.
  topRisks:
    - >-
      The company remains a private, pre-revenue biotech with no public cash, burn, runway, headcount, or valuation
      disclosure.
    - >-
      OLN324 still must convert early head-to-head clinical promise into successful pivotal execution against entrenched
      anti-VEGF incumbents.
    - >-
      Future pricing, reimbursement, and launch adoption in retinal disease could be pressured by biosimilars, payer
      controls, and existing branded standards.
  unresolvedGaps:
    - Series B post-money valuation, security terms, and cap-table concentration remain undisclosed.
    - Current cash balance, burn rate, runway, and program-level spending are not available from public sources.
    - No public revenue, headcount, or launch-readiness metrics are available to test commercialization capacity.
    - >-
      Partner economics with Innovent and VelaVigo are not sufficiently disclosed to model royalties, milestones, or
      cost-sharing leakage.
