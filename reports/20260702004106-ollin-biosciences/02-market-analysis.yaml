    {
      "id": "adoption-constraints",
      "title": "Growth drivers and adoption constraints",
      "body": "This market is growing, but it is not frictionless. Aging, diabetes, and the chronic need for retinal treatment support demand, yet the competitive field is crowded and regulators still require disciplined evidence. Biosimilars and Avastin create cost pressure, and state substitution rules plus clinic workflow constraints slow apparently rational switching. Ollin's early JADE results create a plausible durability narrative, but the company still needs phase 3 and payer-relevant evidence before that narrative can reliably overcome incumbent trust and low-cost substitutes.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
