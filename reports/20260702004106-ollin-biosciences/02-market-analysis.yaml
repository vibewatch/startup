      "id": "sizing-lenses",
      "title": "Evidence-constrained sizing lenses",
      "body": "The available sizing evidence is directional, not fully precise. Ollin cites a $15 billion retina market, and payer commentary shows that a single branded anti-VEGF product can represent multi-billion-dollar historical Medicare spend. Those data points support a large commercial prize, but they do not produce a clean SAM or SOM for a new entrant focused on DME and wet AMD. The right draft posture is to preserve multiple public lenses, state their limits explicitly, and avoid pretending that broad market rhetoric equals underwritten demand.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
