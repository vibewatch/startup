    {
      "id": "market-boundary",
      "title": "Market boundary and status-quo substitutes",
      "body": "Ollin is not attacking all of ophthalmology. The relevant market boundary is the chronic anti-VEGF treatment pool inside wet AMD and DME, plus the substitute set that shapes price expectations and prescribing behavior. Disease-burden sources show both conditions matter clinically, while retina-market sources show physicians already choose among branded biologics, biosimilars, and off-label compounded bevacizumab. That means the real comparison set is premium biologic efficacy versus a lower-cost substitute ladder, not simply whether retinal disease is common.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences market analysis summary. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
