      "id": "underwriting-gaps-and-financial-verdict",
      "title": "Underwriting gaps and financial verdict",
      "body": "The core blocker is not access to capital but lack of operating disclosure. Public materials do not provide revenue, ARR, cash, burn, runway, gross margin, headcount, or partnership economics, so a forward financial model would rely almost entirely on unverified assumptions.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Public evidence supports a well-capitalized but still pre-revenue clinical-stage biotech: Ollin launched with $100M and added a $330M Series B for Phase 3 OLN324 and OLN102 clinical advancement, but public materials do not disclose revenue, ARR, gross margin, current cash, burn, runway, or headcount. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Public evidence supports a well-capitalized but still pre-revenue clinical-stage biotech: Ollin launched with $100M and added a $330M Series B for Phase 3 OLN324 and OLN102 clinical advancement, but public materials do not disclose revenue, ARR, gross margin, current cash, burn, runway, or headcount. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Public evidence supports a well-capitalized but still pre-revenue clinical-stage biotech: Ollin launched with $100M and added a $330M Series B for Phase 3 OLN324 and OLN102 clinical advancement, but public materials do not disclose revenue, ARR, gross margin, current cash, burn, runway, or headcount. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
