    "summary": "Public evidence supports a well-capitalized but still pre-revenue clinical-stage biotech: Ollin launched with $100M and added a $330M Series B for Phase 3 OLN324 and OLN102 clinical advancement, but public materials do not disclose revenue, ARR, gross margin, current cash, burn, runway, or headcount."
