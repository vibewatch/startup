      - number: '7.2'
        title: 监管、法律与安全暴露
        blocks:
          - type: paragraph
            body: >-
              公开资料支持几个不可忽视的硬风险。第一，在 FDA 指引下，视网膜项目执行要求高，终点也敏感。第二，注射型 anti-VEGF
              类别已有明确临床风险；如果真实世界药物警戒中出现相关信号，采用速度可能很快受损。第三， 专利与授权图景不透明：VEGF/Ang2 领域显然存在活跃 IP，但 Ollin
              没有公开说明自己实际掌握多少自由实施权或独占性。


              公开证据仍把本章锚在少数稳定事实上：Ollin 的核心风险不是科学是否有意思，而是一家商业化前、依赖伙伴的视网膜公司， 能否把有希望的 1b 期信号转成干净的 3
              期数据、监管批准、支付覆盖和可规模化的上市执行。公开证据显示， 监管、IP/法律、安全、支付方和伙伴依赖风险都不轻；最大的尽调缺口仍是自由实施权、CMC 准备度和商业上市基础设施。
              因此，本章重点区分当前公开记录已经证明了什么，以及哪些判断仍取决于公司私有材料。


