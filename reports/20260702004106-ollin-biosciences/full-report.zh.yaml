  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 资产地图与产品架构
        blocks:
          - type: paragraph
            body: >-
              Ollin 的公开产品地图对一家已融资 $330M 3 期轮的公司来说异常集中。OLN324 是重心：面向 DME 和 wAMD 的 VEGF/Ang2 双特异性抗体，定位为挑战 faricimab
              的同类最优候选。OLN102 把管线拓展到甲状腺眼病，但仍处临床前； 因此，今天的实际架构是一项资产中心型视网膜项目，靠授权关系、KOL 和监管执行支撑，而不是一个广泛披露的内部平台或制造栈。


              公开证据仍把本章锚定在几条耐久事实：Ollin 是资产中心型眼科生物科技公司，披露的产品栈由 OLN324 主导； OLN324 是下一代 VEGF/Ang2 双特异性抗体，在 DME 和 wAMD 1b
