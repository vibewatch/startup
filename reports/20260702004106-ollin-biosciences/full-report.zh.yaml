  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争层级与真正对手
        blocks:
          - type: paragraph
            body: >-
              Ollin 处在分层视网膜格局里，而不是一个单一同业集合。直接的高端生物制剂比较对象是 Roche/Genentech 的 Vabysmo 和 Regeneron 的 Eylea 产品线。低成本替代集合是配制
              Avastin 加眼科生物类似药，Outlook 则试图把眼科 bevacizumab 纳入正式标签。 Apellis 作为视网膜科室触点竞争者重要，但不是 DME / 湿性 AMD anti-VEGF
              的直接替代品。规模指标让不对称很明显： Ollin 挑战的是资产负债表更厚、组织更宽、标签已经商业化的在位者。


