companyProfile:
  summary: >-
    Ollin Biosciences 是一家总部位于 Austin 的私营眼科生物科技公司，2025 年进入公众视野，拥有两项双特异性抗体管线， 并在 2026 年 6 月完成 $330M B 轮融资。核心项目 OLN324
    瞄准糖尿病性黄斑水肿和湿性年龄相关性黄斑变性， OLN102 则面向甲状腺眼病和 Graves 病。公司看起来走的是资产中心型开发路线：围绕授权生物学、视网膜临床执行、 重磅风投和交叉基金支持搭建，而不是靠当前商业收入支撑。
