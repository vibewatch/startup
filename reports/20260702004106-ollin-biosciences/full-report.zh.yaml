          tone: positive
        - id: j3
          label: 3 期参与和证据积累
          detail: 上市前，试验中心、研究者和患者参与，提供当前最主要的采用信号。
          tone: positive
        - id: j4
          label: 监管批准和报销闸口
          detail: 即便临床证据强，也必须越过标签、事先授权和 buy-and-bill 经济性障碍。
          tone: warning
        - id: j5
          label: 初始处方 / 注射使用
          detail: 若准入和数据对齐，首次商业使用可能会从 DME 领先的视网膜科客户启动。
          tone: neutral
        - id: j6
          label: 重复给药 / 客户扩展
          detail: 扩展取决于持久性、医生信心和支付方支持；目前还没有公开证据。
          tone: warning
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU007
      - CU010
    approximationNotes: 旅程图是方向性的，也刻意保持商业化前视角；它展示证据如何转化为采用，而不是描述现有收入引擎。
  - id: FU002
    title: 从试验证据到商业使用的采用流
    type: flow
    layout: standard
    summary: OLN324 从 KOL/试验证据走向未来商业采用的逻辑链条。
    data:
      nodes:
        - id: proof
          label: JADE 头对头数据发布
        - id: kols
          label: 具名视网膜专科医生验证
        - id: pivotal
          label: 3 期中心启动和执行
        - id: reg
          label: 批准 / 标签结果
        - id: payer
          label: 报销 / 处方集接受
        - id: first
          label: 初始商业处方
        - id: repeat
          label: 重复给药和客户扩展
      edges:
        - from: proof
          to: kols
          label: 解读和倡导
        - from: kols
          to: pivotal
          label: 试验参与和可信度
        - from: pivotal
          to: reg
          label: 注册性证据
        - from: reg
          to: payer
          label: 报销覆盖谈判
        - from: payer
          to: first
          label: 诊所经济性可行
        - from: first
          to: repeat
          label: 持久性 + 医生信心
    claimRefs:
      - CU004
      - CU005
      - CU007
      - CU011
    approximationNotes: 该流程省略数值转化率，因为目前没有公开漏斗或采用分母。
