  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Ollin 并没有进攻整个眼科市场。相关市场边界是湿性 AMD 和 DME 内部的慢性 anti-VEGF 治疗池，
              以及塑造价格预期和处方行为的一组替代品。疾病负担来源显示两种疾病都有临床重要性；视网膜市场来源则显示， 医生已在品牌生物制剂、生物类似药和超说明书配制 bevacizumab
              之间选择。因此，真正的比较对象是高端生物制剂疗效与低成本替代阶梯， 而不只是视网膜疾病是否常见。


              公开证据仍把本章锚定在几条耐久事实：Ollin Biosciences 市场分析摘要。因此，本章强调当前公开记录能证明什么， 以及尽调仍需依赖私人公司材料的地方。


