      - number: '7.3'
        title: 依赖项、缓释措施和否决标准
        blocks:
          - type: paragraph
            body: >-
              即使生物学逻辑仍成立，Ollin 也受外部对手方和不透明基础设施牵制：授权方、视网膜研究者、监管机构、生产伙伴、 投资人和支付方都在关键路径上。因此尽调应设定明确的否决标准：DME 3
              期失利、任何严重炎症信号、悬而未决的 IP 挑战，或无法顶住 Avastin 和生物类似药的报销策略，都应显著改变投资测算。公开证据足以给这些风险排序， 但还不足以排除它们。


              公开证据仍把本章锚在少数稳定事实上：Ollin 的核心风险不是科学是否有意思，而是一家商业化前、依赖伙伴的视网膜公司， 能否把有希望的 1b 期信号转成干净的 3
              期数据、监管批准、支付覆盖和可规模化的上市执行。公开证据显示， 监管、IP/法律、安全、支付方和伙伴依赖风险都不轻；最大的尽调缺口仍是自由实施权、CMC 准备度和商业上市基础设施。
              因此，本章重点区分当前公开记录已经证明了什么，以及哪些判断仍取决于公司私有材料。


