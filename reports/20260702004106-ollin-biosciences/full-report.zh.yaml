        blocks:
          - type: paragraph
            body: >-
              只看公开资料的投资人不应直接给出买入结论。Ollin 有势能，但估值、股权结构、优先权栈、收入、利润率或现金跑道都没有公开披露。 更合理的输出是继续研究：不是因为公司显弱，而是公开证据不足以判断价格是否有吸引力。


              公开证据仍把本章锚在少数稳定事实上：Ollin 的临床和融资故事有吸引力，但公开证据仍未披露投后估值、股权结构条款、
              现金、烧钱速度、收入或利润率。只看公开资料，结论应保持继续研究，信心低、风险高、估值立场未知。因此， 本章重点区分当前公开记录已经证明了什么，以及哪些判断仍取决于公司私有材料。


