              这个市场在增长，但阻力不小。老龄化、糖尿病和视网膜慢性治疗需求支撑需求；但竞争格局拥挤，监管仍要求严谨证据。 生物类似药和 Avastin
              带来成本压力，州级替代规则加上诊所工作流约束，会放慢看似理性的换药。Ollin 早期 JADE 结果给出一个可信的持久性叙事， 但在这套叙事能稳定压过在位者信任和低成本替代品之前，公司还需要 3
