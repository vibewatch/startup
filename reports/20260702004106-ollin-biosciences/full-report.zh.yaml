  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 购买方 / 使用方 / 付款方地图
        blocks:
          - type: paragraph
            body: >-
              因为 Ollin 尚未商业化，客户分析应先看谁会购买、使用并为 OLN324 付费，而不是从已成交收入账户开始。未来经济买方是 先买后报式报销模式下运营的视网膜专科诊所；使用者是视网膜医生以及患有 DME 或
              wAMD 的患者群体；付款方行为将决定差异化分子能否压过更便宜的 Avastin 和生物类似药。这种结构让付款方准入与临床热情同等重要。


              公开证据仍把本章锚定在几条耐久事实：Ollin 仍未商业化，因此公开“客户”故事其实是购买方—使用方—付款方地图， 加上面向临床医生和患者的证明，而不是付费客户采用。今天最好的证据是视网膜专科医生背书、美国
              JADE 站点参与， 以及 DME/wAMD 治疗人群规模；最大的尽调发现是，还没有公开来源证明付费账户、报销胜利、留存或收入持久性。 因此，本章强调当前公开记录能证明什么，以及尽调仍需依赖私人公司材料的地方。


