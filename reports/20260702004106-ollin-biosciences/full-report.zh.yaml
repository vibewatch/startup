  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 强公司信号与薄弱公开价格支持相撞，推导出当前建议。
    data:
      nodes:
        - label: 大品类
        - label: 临床雄心
        - label: $430M 已披露融资
        - label: 缺少估值 / 现金 / 利润率数据
        - label: 高风险 / 低置信度
        - label: 建议：继续研究
      edges:
        - from: Large category
          to: 'Recommendation: research-more'
        - from: Clinical ambition
          to: 'Recommendation: research-more'
        - from: $430M disclosed financing
          to: 'Recommendation: research-more'
        - from: Missing valuation / cash / margin data
          to: High risk / low confidence
        - from: High risk / low confidence
          to: 'Recommendation: research-more'
    claimRefs:
