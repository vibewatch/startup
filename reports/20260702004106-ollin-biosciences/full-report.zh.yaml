      - number: '1.3'
        title: 资本基础、投资人质量与披露边界
        blocks:
          - type: paragraph
            body: >-
              资本故事最能把 Ollin 和典型年轻私营生物科技公司拉开。公司公开亮相时带着 $100M；不到一年后，又披露一轮超额认购的 $330M B 轮。这意味着公开证据可支撑的融资总额为
              $430M，也把公司放进一类私营生物科技公司：有可能不立刻回到市场， 也能为关键性开发融资。投资人名单同样有分量：ARCH 和 TCGX 领投，a16z Bio+Health、Blackstone
              Multi-Asset Investing、 RA Capital、T. Rowe、CPP、Commodore、Mubadala 和 Monograph 把财团拓宽到交叉基金、主权资本和机构资金。


              但透明度并没有因此解决。公开材料对融资和产品里程碑写得慷慨且乐观，却几乎不谈当前收入、员工规模、现金余额、烧钱速度和估值。 因此，概览可以判断 Ollin
              资金充足、得到机构验证，但不能仅凭公开证据说经济模型已经被承保。


              公开证据仍把本章锚定在几条耐久事实：Ollin Biosciences 是一家总部位于 Austin 的临床阶段眼科生物科技公司， 2025 年公开亮相，到 2026 年中已披露融资 $430M；在 OLN324
