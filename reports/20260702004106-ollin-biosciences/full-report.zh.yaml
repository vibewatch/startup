        title: 定价压力、换药与渠道经济性
        blocks:
          - type: paragraph
            body: >-
              商业战不太可能只靠机制获胜。AJMC 的付款方视角显示，Eylea 历史上主导支出，Vabysmo 可能有最高单次理赔成本； 生物类似药文献则指向对高端 anti-VEGF
              品牌的显著降价压力。与此同时，低成本配制 Avastin 在许多决策路径中仍是实用底价。 因此，Ollin 大概率需要足够疗效或持久性来支撑高端采用，因为公开证据看不到一条靠价格打赢市场的干净路径。


