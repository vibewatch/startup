          high: 328.5
        - label: Ollin 已披露融资基数（USDbn）
          low: 0.43
          mid: 0.43
          high: 0.43
    claimRefs:
      - CV001
      - CV005
    approximationNotes: 中点采用 Regeneron 作为公开参考中的中位样本；这并不意味着 Ollin 的公允价值。
