            body: >-
              Ollin 的卖点是临床差异化。JADE 显示，相比 faricimab，它可能有更强解剖控制、持久性优势和干净的早期安全信号。 但在位者在标签广度和日常临床熟悉度上仍起跑领先。Vabysmo 已覆盖
              nAMD、DME 和 RVO。Eylea 和 Eylea HD 提供成熟的 aflibercept 路径，并配有延长给药间隔叙事。LYTENAVA 试图让 bevacizumab
              在正式标签下更容易采购。因此，Ollin 进入时可能是一款更好的分子， 但还不是已去风险的商业产品。


