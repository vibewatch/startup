chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与资产中心模式
        blocks:
          - type: paragraph
            body: >-
              Ollin 作为一家年轻私营生物科技公司，公开身份少见地清晰。已审阅来源口径一致：这是一家总部位于 Texas Austin
              的临床阶段眼科公司，聚焦威胁视力的疾病；同时，这些资料也说明，公司不是孵化宽口径内部发现引擎， 而是围绕获取并推进外部创新搭建。这个差异很关键，因为它决定后续章节的底色：公司当下的护城河，
              不在一个可见的自有平台，而在挑选差异化双特异性资产、用视网膜开发经验包起来，并用强融资把资产推过关键性里程碑。


              这个模式第一次公开落地，是两项资产组合。OLN324 是核心，瞄准公司叙事里披露的最大机会：DME 和湿性 AMD 中的视网膜血管疾病。 OLN102 提供第二条临床期权价值，面向甲状腺眼病和 Graves
              病，但阶段更早、验证更少。因此，公司概览应把 Ollin 看作一家核心资产驱动的公司， 旁边有一个有意义的相邻期权，而不是宽平台眼科集团。


              公开证据仍把本章锚定在几条耐久事实：Ollin Biosciences 是一家总部位于 Austin 的临床阶段眼科生物科技公司， 2025 年公开亮相，到 2026 年中已披露融资 $430M；在 OLN324
              针对 DME 和湿性 AMD、相对 faricimab 的正面对照 1b 期数据表现积极之后，公司正在筹备全球 3 期开发。公司管线集中在两项资产，背后有重磅投资人与视网膜临床医生网络，
              但估值、现金、烧钱速度、收入和员工规模仍不透明。因此，公司概览对融资实力和产品动能给出明确正面判断，同时仍要求尽调把若干经济与治理基本面列为未解项。
