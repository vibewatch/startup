  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的主要风险
        blocks:
          - type: paragraph
            body: >-
              围绕 Ollin 的最高风险簇是累积性的：3 期执行、最终标签强度、报销和竞争转化都要跑通，这家围绕一项核心视网膜资产搭建的未商业化公司才成立。 积极的 1b 期数据和新资本降低了短期融资压力，但没有消除强
              DME 复现、可信 wAMD 定位、干净安全性和快速监管执行的要求。 市场会包容有意思的科学，但不会包容模糊的注册性结果。


              公开证据仍把本章锚定在几条耐久事实：Ollin 的主导风险不在科学是否有意思，而在一家尚未商业化、依赖伙伴的视网膜公司， 能否把积极的 1b 期信号转化为干净的 3
              期数据、监管批准、报销和可扩展上市执行。公开证据凸显监管、IP / 法务、安全、付款方和伙伴依赖等实质风险； 最大的尽调缺口仍是自由实施权、CMC
              就绪度和商业上市基础设施。因此，本章强调当前公开记录能证明什么，以及尽调仍需依赖私人公司材料的地方。


