      - CU005
      - CU008
      - CU009
      - CU011
    approximationNotes: 评级是定性判断，并明确区分面向临床医生的证据与真正付费客户证据。
  - id: FR001
    title: Ollin 风险热力图
    type: matrix
    layout: wide
    summary: 当前公开缓释因素下，Ollin 残余风险中信号最强的几类定性热力图。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 残余敞口
