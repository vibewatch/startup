        title: 临床工作流契合度与差异化
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 OLN324 从机制到工作流的叙事闭环。疗法嵌入视网膜专科医生已用于 DME 和 wAMD 的同一玻璃体内 anti-VEGF 治疗循环， 但 Ollin 认为，更高 Ang2
              效价、更高摩尔剂量和更小分子格式，会带来更快干燥、更持久疾病控制，并可能具备一线替代潜力。 披露的 1b 期信号在 DME 最强；wAMD 看起来有希望，但优效性没有那么板上钉钉，这会影响尽调中如何界定产品。


