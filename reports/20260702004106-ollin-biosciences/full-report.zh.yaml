      - number: '2.3'
        title: 购买方、使用方、付款方与经济性地图
        blocks:
          - type: paragraph
            body: >-
              视网膜专科医生及其诊所是直接使用者和运营购买方，但付款方环境会强烈影响产品组合。AAO 和 NEI 来源强调反复注射与随访构成的慢性治疗旅程， 付款方评论则突出
              WAC、ASP、替代规则和阶梯治疗行为。实践中，Ollin 需要同时讲清医生层面的疗效故事和付款方层面的经济性故事。 两者缺一，市场即使临床上有吸引力，也会比广泛患病率数字暗示的更难打开。


