      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              领导层厚度是可见优势，也是一种依赖。Jason Ehrlich 在所有已审阅来源中都以联合创始人兼 CEO 身份出现，
              他既是运营负责人，也是公司科学、融资和战略故事最重要的对外讲述者。公开发布报道还补上一层明显与风投绑定、而非纯创始人控制的治理结构： Paul Berns 担任董事长，Brian Cuneo 通过 ARCH
              Venture Partners 连接运营和投资人角色，发布披露显示董事会汇集了有经验的风投、 公司搭建者和医疗健康人士。


              科学顾问委员会同样突出。Wykoff、Khanani、Eichenbaum、Chang、Singh、Sheth 和 Dandekar 合在一起， 给公司带来强视网膜临床医生信用。这很重要，因为 OLN324
              的上市逻辑取决于专科市场里的医生换药。与此同时，公开治理披露远未触及股权表控制细节。 外部材料显示谁坐在桌边，但没有说明投票权、保护性条款或观察员权利如何分配。


              公开证据仍把本章锚定在几条耐久事实：Ollin Biosciences 是一家总部位于 Austin 的临床阶段眼科生物科技公司， 2025 年公开亮相，到 2026 年中已披露融资 $430M；在 OLN324
              针对 DME 和湿性 AMD、相对 faricimab 的正面对照 1b 期数据表现积极之后，公司正在筹备全球 3 期开发。公司管线集中在两项资产，背后有重磅投资人与视网膜临床医生网络，
              但估值、现金、烧钱速度、收入和员工规模仍不透明。因此，公司概览对融资实力和产品动能给出明确正面判断，同时仍要求尽调把若干经济与治理基本面列为未解项。
