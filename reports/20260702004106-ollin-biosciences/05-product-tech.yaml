    {
      "id": "readiness-and-gaps",
      "title": "Readiness, compliance, and unresolved technical gaps",
      "body": "The regulatory path is advancing, but public technical readiness disclosure is thin. Ollin says FDA and EMA interactions have occurred and phase 3 is next, yet there is still no meaningful public CMC detail, no disclosed manufacturing network, and no visible quality-system or pharmacovigilance surface beyond class-standard injection safety references. Even the closest substitute for a developer signal is clinician-trade coverage and conference presentations, which is directionally useful but not equivalent to open technical proof.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin is an asset-centric ophthalmology biotech whose disclosed product stack is dominated by OLN324, a next-generation VEGF/Ang2 bispecific now positioned for phase 3 after head-to-head phase 1b data in DME and wAMD. Public evidence supports differentiated molecule design and clinical signal, but manufacturing, CMC, and quality-system detail remain largely undisclosed, and the nearest public practitioner signal is clinician/trade-surface coverage rather than a true technical or developer surface. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin is an asset-centric ophthalmology biotech whose disclosed product stack is dominated by OLN324, a next-generation VEGF/Ang2 bispecific now positioned for phase 3 after head-to-head phase 1b data in DME and wAMD. Public evidence supports differentiated molecule design and clinical signal, but manufacturing, CMC, and quality-system detail remain largely undisclosed, and the nearest public practitioner signal is clinician/trade-surface coverage rather than a true technical or developer surface. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
