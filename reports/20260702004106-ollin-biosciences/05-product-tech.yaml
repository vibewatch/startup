    "number": 5,
    "title": "Product & Technology",
    "summary": "Ollin is an asset-centric ophthalmology biotech whose disclosed product stack is dominated by OLN324, a next-generation VEGF/Ang2 bispecific now positioned for phase 3 after head-to-head phase 1b data in DME and wAMD. Public evidence supports differentiated molecule design and clinical signal, but manufacturing, CMC, and quality-system detail remain largely undisclosed, and the nearest public practitioner signal is clinician/trade-surface coverage rather than a true technical or developer surface."
