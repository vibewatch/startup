    {
      "id": "leadership-and-governance",
      "title": "Leadership, governance, and key-person dependence",
      "body": "Leadership depth is a visible strength, but it is also a dependency. Jason Ehrlich appears across every reviewed source as the co-founder and chief executive officer, making him not only the operating leader but also the most important external narrator of the company’s scientific, fundraising, and strategic case. Public launch coverage adds a governance layer that is clearly venture-linked rather than purely founder-controlled: Paul Berns chairs the board, Brian Cuneo bridges operating and investor roles through ARCH Venture Partners, and the launch disclosures show a board populated by experienced venture, company-building, and healthcare figures.\n\nThe scientific advisory board is equally notable. Wykoff, Khanani, Eichenbaum, Chang, Singh, Sheth, and Dandekar collectively give the company strong retina-clinician credibility. That matters because OLN324’s go-to-market logic depends on physician switching in a specialist market. At the same time, public governance disclosures stop well short of cap-table control detail. Outside materials show who is in the room, but not how voting power, protective provisions, or observer rights are allocated.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences is an Austin-based clinical-stage ophthalmology biotech that publicly emerged in 2025, raised $430 million of disclosed financing by mid-2026, and is now preparing global Phase 3 development for OLN324 after promising head-to-head Phase 1b data against faricimab in DME and wet AMD. The company pairs a concentrated two-asset pipeline with a heavyweight investor and retina-clinician network, but it remains opaque on valuation, cash, burn, revenue, and headcount. That leaves the company overview clearly positive on financing strength and product momentum, while still forcing diligence to treat several economic and governance basics as unresolved.",
