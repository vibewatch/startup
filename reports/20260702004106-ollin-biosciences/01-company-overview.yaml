    {
      "id": "capital-base-and-scale",
      "title": "Capital base, investor quality, and disclosure limits",
      "body": "The capital story is what most clearly separates Ollin from a typical young private biotech. The company launched publicly with $100 million and then, less than a year later, disclosed an oversubscribed $330 million Series B. That implies $430 million of publicly supportable financing and puts the company in a category of private biotech that can plausibly fund pivotal development without immediately returning to the market. The investor list is also meaningful: ARCH and TCGX lead, while a16z Bio+Health, Blackstone Multi-Asset Investing, RA Capital, T. Rowe, CPP, Commodore, Mubadala, and Monograph widen the syndicate into crossover, sovereign, and institutional territory.\n\nWhat this does not solve is transparency. The same public materials that are generous on funding and optimistic on product milestones are almost silent on current revenue, headcount, cash balance, burn rate, and valuation. That means the overview can conclude that Ollin is well financed and institutionally validated, but not that it is economically underwritten from public evidence alone.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences is an Austin-based clinical-stage ophthalmology biotech that publicly emerged in 2025, raised $430 million of disclosed financing by mid-2026, and is now preparing global Phase 3 development for OLN324 after promising head-to-head Phase 1b data against faricimab in DME and wet AMD. The company pairs a concentrated two-asset pipeline with a heavyweight investor and retina-clinician network, but it remains opaque on valuation, cash, burn, revenue, and headcount. That leaves the company overview clearly positive on financing strength and product momentum, while still forcing diligence to treat several economic and governance basics as unresolved.",
