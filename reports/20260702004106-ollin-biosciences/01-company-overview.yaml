  "chapter": {
    "number": 1,
    "title": "Company Overview",
    "summary": "Ollin Biosciences is an Austin-based clinical-stage ophthalmology biotech that publicly emerged in 2025, raised $430 million of disclosed financing by mid-2026, and is now preparing global Phase 3 development for OLN324 after promising head-to-head Phase 1b data against faricimab in DME and wet AMD. The company pairs a concentrated two-asset pipeline with a heavyweight investor and retina-clinician network, but it remains opaque on valuation, cash, burn, revenue, and headcount. That leaves the company overview clearly positive on financing strength and product momentum, while still forcing diligence to treat several economic and governance basics as unresolved."
  },
  "sections": [
    {
      "id": "identity-and-asset-model",
      "title": "Identity, headquarters, and asset-centric model",
      "body": "Ollin’s public identity is unusually clear for a young private biotech. Reviewed sources consistently describe a clinical-stage ophthalmology company headquartered in Austin, Texas and focused on vision-threatening diseases, but they also make clear that the company was built around acquiring and advancing outside innovations rather than incubating a broad in-house discovery engine. That distinction matters because it colors every later chapter: the company’s moat today is less about a visible proprietary platform and more about picking differentiated bispecific assets, wrapping them in retina-specific development expertise, and financing them aggressively through pivotal milestones.\n\nThe first public portfolio expression of that model is a two-asset stack. OLN324 is the centerpiece and targets the largest disclosed opportunity set inside the company narrative: retinal vascular disease in DME and wet AMD. OLN102 creates a second clinical-option value path in thyroid eye disease and Graves’ disease, but it is earlier and less proven. As a result, the company overview should be read as a lead-asset company with one meaningful adjacent option rather than a broad multi-platform ophthalmology conglomerate.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin Biosciences is an Austin-based clinical-stage ophthalmology biotech that publicly emerged in 2025, raised $430 million of disclosed financing by mid-2026, and is now preparing global Phase 3 development for OLN324 after promising head-to-head Phase 1b data against faricimab in DME and wet AMD. The company pairs a concentrated two-asset pipeline with a heavyweight investor and retina-clinician network, but it remains opaque on valuation, cash, burn, revenue, and headcount. That leaves the company overview clearly positive on financing strength and product momentum, while still forcing diligence to treat several economic and governance basics as unresolved.",
