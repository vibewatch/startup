      "id": "proof-of-adoption",
      "title": "What counts as adoption proof today",
      "body": "The most honest current adoption proof is not paying-customer evidence but clinician-facing and patient-facing proof. Named retina specialists appear in launch coverage, public study presentations, and Ophthalmology Times reporting, and JADE itself demonstrates that U.S. sites and patients were willing to enroll in a head-to-head trial against the market leader. That is valuable signal, but it still sits upstream of commercialization and should not be mistaken for production revenue traction.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin is still precommercial, so the public “customer” story is really a buyer-user-payer map plus clinician- and patient-facing proof rather than paying-customer adoption. The best evidence today is retina-specialist validation, U.S. JADE-site participation, and the size of DME/wAMD treatment populations; the biggest diligence finding is that no public source proves paying accounts, reimbursement wins, retention, or revenue durability yet. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin is still precommercial, so the public “customer” story is really a buyer-user-payer map plus clinician- and patient-facing proof rather than paying-customer adoption. The best evidence today is retina-specialist validation, U.S. JADE-site participation, and the size of DME/wAMD treatment populations; the biggest diligence finding is that no public source proves paying accounts, reimbursement wins, retention, or revenue durability yet. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
