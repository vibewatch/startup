    {
      "id": "durability-and-commercial-gaps",
      "title": "Durability proxies and unresolved commercial gaps",
      "body": "Ollin does have an early durability proxy in retreatment-free follow-up, but it has no public retention, renewal, concentration, or satisfaction metrics in the commercial sense. That is normal for a phase 3-bound biotech, yet it means customer diligence must be explicit: price, reimbursement, formulary access, physician conversion behavior, and early account concentration are all still blind spots. OLN102 is even earlier and contributes no usable customer proof yet.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin is still precommercial, so the public “customer” story is really a buyer-user-payer map plus clinician- and patient-facing proof rather than paying-customer adoption. The best evidence today is retina-specialist validation, U.S. JADE-site participation, and the size of DME/wAMD treatment populations; the biggest diligence finding is that no public source proves paying accounts, reimbursement wins, retention, or revenue durability yet. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin is still precommercial, so the public “customer” story is really a buyer-user-payer map plus clinician- and patient-facing proof rather than paying-customer adoption. The best evidence today is retina-specialist validation, U.S. JADE-site participation, and the size of DME/wAMD treatment populations; the biggest diligence finding is that no public source proves paying accounts, reimbursement wins, retention, or revenue durability yet. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
