    "title": "Customers",
    "summary": "Ollin is still precommercial, so the public “customer” story is really a buyer-user-payer map plus clinician- and patient-facing proof rather than paying-customer adoption. The best evidence today is retina-specialist validation, U.S. JADE-site participation, and the size of DME/wAMD treatment populations; the biggest diligence finding is that no public source proves paying accounts, reimbursement wins, retention, or revenue durability yet."
