evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Series B post-money valuation and security terms.
    whyItMatters: Public financing size alone does not reveal entry price or dilution dynamics.
    diligencePath: Request the Series B term sheet or a cap-table summary from management.
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue, cash, burn, runway, and headcount.
    whyItMatters: These are the core metrics needed to underwrite a private biotech beyond milestone enthusiasm.
    diligencePath: Request the latest board deck or monthly operating report.
  - type: missing-source
    severity: minor
    topic: Leadership and founder table coverage
    missingEvidence: Detailed board committee structure, founder ownership, observer rights, and delegated authority.
    whyItMatters: Visible leadership names do not reveal how governance authority is actually allocated.
    diligencePath: Review board materials, governance charters, and the cap table.
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: Stakeholder or investor map coverage
    missingEvidence: Investor ownership percentages, liquidation preferences, and formal board or observer rights.
    whyItMatters: The public investor list is directionally useful but not sufficient to assess control or dilution risk.
    diligencePath: Request the financing documents and investor-rights summary.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: Milestone table coverage
    missingEvidence: Cross-check of exact internal decision dates and milestone gating logic behind the public chronology.
    whyItMatters: >-
      The milestone table is complete for public announcements but still partial on internal gating dates that could
      affect execution confidence.
    diligencePath: Request the program plan that links public milestones to internal development gates.
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: sam-som-sizing
    missingEvidence: A treated-patient and reimbursement-based SAM/SOM model for DME and wet AMD by launch geography.
    whyItMatters: Broad market rhetoric does not show how much branded anti-VEGF demand a new entrant can realistically capture.
    diligencePath: >-
      Pull 2026 treated-patient, payer-mix, and channel-spend data from claims databases, specialty pharmacy datasets,
      or management materials.
  - type: missing-source
    severity: material
    topic: net-pricing
    missingEvidence: Net price, rebate, and buy-and-bill economics across Vabysmo, Eylea, Avastin, and biosimilars.
    whyItMatters: List-price or spend proxies do not reveal the real economic hurdle for Ollin adoption.
    diligencePath: >-
      Request payer and clinic reimbursement decks or third-party channel data covering net ASP and gross-to-net
      dynamics.
  - type: private-evidence-only
    severity: material
    topic: real-world-retreatment
    missingEvidence: >-
      Independent real-world retreatment and persistence data for current anti-VEGF regimens in the exact target
      segments.
    whyItMatters: >-
      Ollin's durability story only matters commercially if current retreatment burden is materially painful in
      practice.
    diligencePath: Obtain registry or claims evidence on injection cadence, drop-off, and switching by diagnosis and payer type.
  - type: stale
    severity: minor
    topic: historical-spend-lenses
    missingEvidence: >-
      More recent branded anti-VEGF spend concentration data than the historical 2020 and 2022 lenses cited in public
      commentary.
    whyItMatters: >-
      The market is moving quickly as Vabysmo, Eylea HD, biosimilars, and pending bevacizumab options change the spend
      mix.
    diligencePath: Refresh with 2025-2026 Part B, commercial-claims, or channel checks.
  - type: conflicting-data
    severity: minor
    topic: biosimilar-discount
    missingEvidence: A reconciled view of actual realized biosimilar discounts versus originators in retina.
    whyItMatters: >-
      Public summaries cite both 20-40% cost reduction and pricing around 40% of originator price, which materially
      changes how much room premium entrants have.
    diligencePath: >-
      Triangulate 2026 WAC, ASP, and contracting data by molecule and channel instead of relying on review-level
      summaries.
  - type: missing-source
    severity: material
    topic: net-pricing-and-rebates
    missingEvidence: >-
      Apples-to-apples net pricing, rebates, and buy-and-bill spread across Vabysmo, Eylea, Avastin, biosimilars, and
      any future Ollin launch.
    whyItMatters: >-
      Public list or spend proxies do not reveal what a physician or payer is actually optimizing for when deciding to
      switch.
    diligencePath: >-
      Obtain 2026 payer contracting, specialty distributor, or clinic economics data rather than relying on public
      summaries.
  - type: private-evidence-only
    severity: material
    topic: phase3-conversion-risk
    missingEvidence: >-
      Independent validation that JADE's small-sample efficacy and durability signals will convert into Phase 3 and
      commercial prescribing advantage.
    whyItMatters: Ollin's differentiation thesis currently rests on early company-reported data against one incumbent benchmark.
