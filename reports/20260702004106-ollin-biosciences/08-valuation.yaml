      "id": "scenario-frame-and-final-diligence",
      "title": "Scenario frame and final diligence asks",
      "body": "The upside case is a differentiated Phase 3 ophthalmology entrant that can capture a slice of a large existing market and earn a premium financing or exit outcome after more data. The downside case is clinical slippage, payer pressure, or a financing reset before commercialization. Because pricing and cap-table evidence are missing, the most honest scenario work remains qualitative and milestone-based.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin has an attractive clinical and financing story, but public evidence still does not disclose post-money valuation, cap-table terms, cash, burn, revenue, or margins. The public-only call should stay research-more, with low confidence, high risk, and valuation stance unknown. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.\n\nPublic evidence nevertheless anchors the chapter on a small set of durable facts: Ollin has an attractive clinical and financing story, but public evidence still does not disclose post-money valuation, cap-table terms, cash, burn, revenue, or margins. The public-only call should stay research-more, with low confidence, high risk, and valuation stance unknown. The chapter therefore emphasizes what the current public record proves and where diligence still depends on private company materials.",
