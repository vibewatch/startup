  - id: TI003
    title: Public financial and unit-economics signals
    columns:
      - Metric
      - Reported value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["2024 revenue", "RMB 1.97 billion", Medium, Establishes public scale, "Audited revenue and recognition bridge"]
      - ["H1 2025 revenue", "RMB 1.51 billion; +97.6% YoY", Medium, Indicates continued growth, "Monthly revenue and delivery reconciliation"]
      - ["2022-H1 2025 cumulative loss", "RMB 1.70 billion", Medium, Shows losses persisted through scaling, "EBITDA, operating cash flow, and noncash bridge"]
      - ["Cash and equivalents at 2025-06-30", "RMB 593 million", Medium, Starting point for liquidity review, "Bank statements, restrictions, and post-period movements"]
      - ["Assets and liabilities at 2025-06-30", "RMB 3.92 billion assets; RMB 5.54 billion liabilities", Medium, Signals balance-sheet pressure, "Debt, payables, maturities, covenants, and guarantees"]
      - ["R&D spending", "RMB 352m (2023); RMB 365m (2024); RMB 179m (H1 2025)", Medium, Material cost of technology roadmap, "Capitalized development and program-level returns"]
    notes: "Amounts are third-party reports of regulatory disclosures; accounting loss is not cash burn, and no runway is inferred."
    claimRefs: [CI001, CI002, CI008, CI009, CI010, CI011]
