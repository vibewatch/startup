callouts:
  - calloutType: risk
    title: Do not equate accounting loss with cash burn
    body: >-
      RMB 593 million of reported cash cannot support a reliable runway calculation
      without operating cash flow, working-capital, capex, debt-service, and restricted-cash data.
    claimRefs: [CI008, CI009, CI010]
  - calloutType: insight
    title: Software upside is not yet demonstrated revenue quality
    body: >-
      ADAS adoption and smart-logistics trials indicate monetization surfaces, but public
      sources do not establish ARPU, renewals, recognized software revenue, or margin.
    claimRefs: [CI004, CI013]
