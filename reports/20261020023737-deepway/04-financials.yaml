company:
  name: DeepWay
chapter:
  number: 4
  title: Financials
  summary: >-
    DeepWay's public financial profile is that of a fast-scaling but still loss-making
    vehicle manufacturer: truck sales contribute more than 99% of revenue, while smart
    logistics remains in free trial. Revenue and deliveries have grown quickly, but
    balance-sheet pressure and missing cash-flow, margin, and unit-economics disclosures
    prevent a defensible runway or normalized profitability estimate.
sections:
  - id: revenue-architecture
    title: Revenue architecture is concentrated in truck hardware
    body: >-
      DeepWay's disclosed revenue base is overwhelmingly transactional rather than
      recurring. New-energy heavy-truck sales represented more than 99% of revenue in
      the reported periods, parts contributed less than 1%, and smart logistics
      solutions were still offered on a free-trial basis without income. Public
      descriptions also mention vehicle-management, financing-support, and used-vehicle
      services, but no source allocates revenue to those activities. Reported retail
      prices of RMB 470,000-RMB 700,000 including VAT establish a list-price envelope,
      not realized average selling price, net revenue, or gross profit. The revenue
      quality therefore remains hardware-led and dependent on deliveries, with software
      and services representing unproven monetization options rather than current
      recurring revenue.
    claimRefs: [CI003, CI004, CI005, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: pricing-and-go-to-market
    title: Pricing and go-to-market evidence is public only at the edges
    body: >-
      The available evidence points to direct fleet sales and partnership-led expansion.
      DeepWay's first delivered vehicles went to XuRi DongSheng for CATL logistics work,
      showing an enterprise deployment route, while its European plan contemplates
      licensing technology to established local brands and eventually manufacturing
      locally. Neither route discloses sales-cycle length, channel margin, customer
      acquisition cost, payment terms, discounts, or renewal economics. An aggregated
      source reports an ADAS subscription rate above 30% alongside more than 6,000
      L2-equipped vehicle deliveries, but it does not define the subscription-rate
      denominator or disclose price and recurring revenue. Those limitations make the
      evidence useful for mapping monetization mechanisms, not for underwriting sales
      efficiency.
    claimRefs: [CI013, CI014, CI015]
    tableRefs: [TI002]
  - id: scale-costs-and-operating-leverage
    title: Scale is rising faster than demonstrated operating leverage
    body: >-
      Reported revenue rose from RMB 426 million in 2023 to RMB 1.97 billion in 2024,
      and first-half 2025 revenue reached RMB 1.51 billion, up 97.6% year over year.
      Deliveries also progressed from 509 units in 2023 to 3,002 in 2024 and 8,020 in
      2025. That scale has not yet produced profitability: one independent report says
      DeepWay remained unprofitable after more than 12,000 cumulative deliveries, while
      another reports RMB 1.70 billion of cumulative accounting losses from 2022 through
      first-half 2025. R&D remained substantial, and management's planned vertical
      integration targets three-electric systems that reportedly represent about 60% of
      manufacturing cost. Public data still omit gross margin, warranty burden, battery
      procurement economics, and factory capex, so the margin path cannot be quantified.
    claimRefs: [CI001, CI002, CI006, CI007, CI008, CI011, CI012]
    tableRefs: [TI003]
  - id: capital-adequacy-and-verdict
    title: Capital adequacy cannot be reduced to a public runway estimate
    body: >-
      At June 30, 2025, reported liabilities of RMB 5.54 billion exceeded assets of
      RMB 3.92 billion, while cash and cash equivalents were RMB 593 million. Those
      figures show balance-sheet strain, but accounting losses are not cash burn and
      funding raised is not cash available. The public record does not disclose operating
      cash flow, committed factory capex, working-capital seasonality, debt maturities,
      project-finance obligations, or restricted cash, so a precise runway would be
      invented. The financial verdict is therefore mixed: delivery and revenue momentum
      demonstrate commercial traction, but revenue remains low-diversity hardware income,
      software monetization is nascent, and the cost of reaching durable margin is
      unquantified. Underwriting requires management accounts, bank statements, debt
      schedules, cohort-level pricing, and a reconciled cash plan.
    claimRefs: [CI003, CI004, CI007, CI008, CI009, CI010, CI012]
