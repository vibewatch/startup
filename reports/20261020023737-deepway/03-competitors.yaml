company:
  name: DeepWay
chapter:
  number: 3
  title: Competitors
  summary: >-
    DeepWay competes through a purpose-built electric-truck platform, progressive assisted-driving
    deployment, and potential technology licensing, but larger Chinese rivals retain pricing and
    battery-procurement advantages. European expansion also starts behind peers that already have
    local assembly or industrial partners, while comparable peer pricing and independent autonomy
    benchmarks remain unavailable in the assigned evidence.
sections:
  - id: competitive-landscape
    title: Competitive landscape and routes to market
    body: >-
      DeepWay sits between electric-truck manufacturers and autonomous-freight technology vendors:
      it sells complete trucks today while offering three possible European routes—finished-vehicle
      export, production with a local manufacturer, or technology licensing to an established
      brand. That flexibility is strategically useful, but it is not yet equivalent to local
      presence. Management said DeepWay had no European base and still needed after-sales,
      charging, financing, and leasing partners. At the same 2026 industry event, BYD described a
      European heavy-truck launch followed by local manufacturing, Sinotruk and SuperPanther
      highlighted Austrian assembly with Steyr Automotive, and Sany emphasized cooperation with
      Putzmeister. DeepWay therefore faces direct products, incumbent industrial networks, and a
      licensing alternative that could reduce capital intensity but also place customer ownership
      with partners. Reported sales of more than 13,000 trucks by April 2026 establish commercial
      scale, although Dealroom's broad valuation range is not a peer benchmark.
    claimRefs:
      - CP004
      - CP005
      - CP006
      - CP007
      - CP011
    tableRefs:
      - TP001
    figureRefs:
      - FP001
  - id: capability-and-economics
    title: Capability, product economics, and operating model
    body: >-
      DeepWay's differentiation rests on forward-designed electric architecture, assisted-driving
      integration, and greater control of batteries, e-axles, and power electronics. Public
      specifications indicate meaningful product evolution: the 2021 Xingtu release described
      300 kilometers at a full 49-ton load, while a 2026 report described roughly 400 kilometers
      at the same rated gross weight for the 600 kWh Star. Those figures are different generations
      and configurations, not a controlled competitor benchmark. A Gasgoo report also relayed a
      company demonstration claiming 10% lower energy use and 22% better charging efficiency than
      a converted electric truck; the absence of an independent test limits underwriting value.
      Pricing is clearer only for DeepWay: two sources place recommended vehicle prices at
      RMB 470,000–700,000 including VAT. Peer transaction prices, discounts, battery ownership,
      financing, maintenance, and realized total cost of ownership were not disclosed, so the
      matrix marks unsupported comparisons as unknown rather than assigning winners.
    claimRefs:
      - CP008
      - CP013
      - CP014
      - CP015
      - CP016
    tableRefs:
      - TP002
  - id: moat-and-displacement-risk
    title: Moat durability and displacement risk
    body: >-
      The core competitive tension is that DeepWay is integrating vertically from a weaker
      purchasing position. Its international executive acknowledged that larger Chinese rivals
      use scale to price lower and that DeepWay has less negotiating power with suppliers,
      including battery vendors. The company does not own Chinese manufacturing plants and relies
      on contract manufacturers, while three-electric systems were reported to represent about
      60% of manufacturing cost. Bringing those systems in-house may improve control, but it also
      concentrates execution risk in a low-margin hardware model. Software monetization is not yet
      proven: a 2025 report said smart-logistics solutions remained in free trial and generated no
      income. Even basic scale evidence requires reconciliation, with one source reporting about
      6,400 vehicles in 2024 while another reports 3,002 deliveries. The defensible near-term moat
      is therefore integration and accumulated operating data, not demonstrated autonomous-driving
      superiority, exclusive distribution, or independently validated cost leadership.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP009
      - CP010
      - CP012
      - CP013
    tableRefs:
      - TP003
