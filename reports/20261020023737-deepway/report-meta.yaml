  topStrengths:
    - Reported FY2025 deliveries of 8,020 trucks demonstrate commercialization beyond pilot scale.
    - FY2025 operating revenue reached a reported RMB 3.961 billion.
    - The 2026 pre-IPO financing phase shows continued access to institutional and strategic capital.
    - >-
      Integration of vehicle engineering with Baidu-derived autonomy technology provides differentiated product
      optionality.
  topRisks:
    - Gross margin remained in the low single digits while the company continued to report material losses.
    - Reported June 2025 liabilities exceeded assets, and current unrestricted cash and runway are not public.
    - Supplier, customer, contract-manufacturing, and Baidu technology dependencies are concentrated.
    - Current valuation, dilution, preference terms, and IPO economics remain undisclosed.
    - Safety, cybersecurity, driverless authorization, and overseas homologation evidence is incomplete.
  unresolvedGaps:
    - >-
      Obtain the current fully diluted capitalization table, post-money valuation, preference stack, and proposed IPO
      terms.
    - >-
      Reconcile unrestricted cash, debt, working capital, operating cash flow, capital expenditure, and runway after the
      2026 financing.
    - >-
      Verify truck gross margin, battery and warranty economics, realized pricing, and paid software ARPU, renewals, and
      revenue.
    - >-
      Review supplier and customer concentration, contract-manufacturing continuity, and Baidu license economics and
      change-of-control rights.
    - >-
      Obtain permit-level autonomy scope, safety and incident data, cybersecurity assurance, recalls, and
      market-by-market homologation.
