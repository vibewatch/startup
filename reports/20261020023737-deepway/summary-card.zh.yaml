  topStrengths:
    - 据报道，FY2025 交付 8,020 辆卡车，说明商业化已超出试点规模。
    - 据报道，FY2025 经营收入达到 RMB 3.961 billion。
    - 2026 年 IPO 前融资阶段显示，公司仍能获得机构资本和战略资本。
    - 车辆工程与源自 Baidu 的自动驾驶技术相结合，为产品带来差异化选择。
  topRisks:
    - 毛利率仍处于个位数低段，公司同时持续报告重大亏损。
    - 据报道，2025 年 6 月负债超过资产；当前不受限现金和现金 runway 尚无公开信息。
    - 公司对供应商、客户、合同制造和 Baidu 技术的依赖较为集中。
    - 当前估值、稀释、优先权条款和 IPO 经济条件仍未披露。
    - 安全、网络安全、无人驾驶许可和海外型式认证证据并不完整。
  unresolvedGaps:
    - 获取当前完全摊薄股权结构表、投后估值、优先股堆叠和拟议 IPO 条款。
    - 核对 2026 年融资后的不受限现金、债务、营运资金、经营现金流、资本开支和 runway。
    - 核实卡车毛利率、电池和保修经济性、实际成交价格，以及付费软件 ARPU、续费和收入。
    - 审查供应商和客户集中度、合同制造的持续性，以及 Baidu 许可的经济条件和控制权变更权利。
    - 获取许可层面的自动驾驶范围、安全和事故数据、网络安全保障、召回记录，以及逐市场型式认证信息。
