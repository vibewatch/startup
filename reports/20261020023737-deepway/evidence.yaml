evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A current financing document or prospectus showing share count, security terms, and fully diluted pre-money and
      post-money valuation.
    whyItMatters: >-
      The RMB 5.4 billion 2025 indicator and Dealroom's US$1–2.5 billion 2026 range use different dates and undisclosed
      methods, so neither establishes a precise current valuation.
    diligencePath: >-
      Obtain the latest HKEX application proof, pre-IPO subscription agreements, capitalization table, and valuation
      bridge.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: company-scale
    missingEvidence: A dated HR roster and CRM or audited customer schedule defining active employees and unique paying customers.
    whyItMatters: >-
      Dealroom displays both fewer than 100 staff and 22 total headcount, while no current reconciled customer count is
      available.
    diligencePath: >-
      Request payroll-backed headcount by function and geography plus a deduplicated customer list reconciled to FY2025
      revenue.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-governance
    missingEvidence: Complete board, committee, observer, tenure, succession, and related-party governance records.
    whyItMatters: >-
      Named executives show functional coverage but do not reveal oversight independence or founder and
      strategic-investor control mechanisms.
    diligencePath: Review the articles, shareholder agreement, board minutes, committee charters, and management succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: funding-history
    missingEvidence: >-
      A round-by-round, fully diluted capitalization table reconciling the 11-round total with 2026 pre-IPO proceeds and
      any secondary transfers or debt.
    whyItMatters: >-
      Public totals may overlap and do not establish dilution, liquidation preferences, current cash, or investor
      control rights.
    diligencePath: >-
      Obtain closing sets, bank receipts, debt schedules, secondary-transfer records, and the current fully diluted cap
      table.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: software-monetization
    missingEvidence: >-
      Audited software revenue by period, subscription launch date, ARPU, attach rate definition, gross margin, and
      renewal cohorts.
    whyItMatters: >-
      The evidence does not reconcile a free trial through the first half of 2025 with later recurring-revenue
      reporting, so a software SAM and valuation premium cannot be underwritten.
    diligencePath: >-
      Obtain the latest prospectus revenue note and management cohort export, then reconcile billed subscriptions to
      vehicle deliveries by quarter.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An original market dataset and a DeepWay-specific SAM/SOM segmented by route type, buyer budget, geography,
      charging access, and replacement cycle.
    whyItMatters: >-
      Headline China forecasts do not show the portion serviceable by DeepWay's current range, channels, price points,
      and production capacity.
    diligencePath: >-
      Acquire the original CIC market study and build a route-level bottom-up model from fleet replacement volumes,
      qualified lanes, and dealer reach.
    relatedQuestionRefs:
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: peer-pricing
    missingEvidence: >-
      Comparable transaction prices, discounts, battery ownership, financing, warranty, maintenance, and service terms
      for DeepWay and named truck competitors.
    whyItMatters: List price alone cannot establish price leadership, switching cost, or fleet-level total cost of ownership.
    diligencePath: >-
      Obtain current fleet quotes and contract schedules for matched routes, payloads, battery ownership models, service
      levels, and financing terms.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: independent-benchmark
    missingEvidence: >-
      Independent matched-route tests of range, energy use, charging uptime, assisted-driving safety, disengagements,
      and total cost against current competitor models.
    whyItMatters: >-
      Company demonstrations and configuration-specific specifications do not establish durable technical or economic
      superiority.
