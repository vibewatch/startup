      - [Risk rating, High, "Reported losses and June 2025 liabilities above assets create financing and execution sensitivity.", "Require downside protection and verified liquidity."]
      - [Valuation stance, Indeterminate, "The latest round size is public; its post-money valuation and preferences are not.", "No defensible current price or target return."]
      - [Entry discipline, "Terms-gated", "A historical August 2025 implied valuation above RMB 5.4 billion is not a current-round mark.", "Re-underwrite only with the 2026 cap table and security terms."]
    notes: "Analyst decision framework based only on retained public evidence; labels are judgments, not disclosed company ratings or investment terms."
    claimRefs: [CV001, CV003, CV006, CV007, CV008, CV016]
  - id: TV002
    title: Thesis, anti-thesis, and view-change tests
    columns:
      - Side
      - Evidence-backed argument
      - What would strengthen or reverse the view
    rows:
      - [Thesis, "Approximately 6,400 cumulative deliveries by June 2025 demonstrate more than pilot-scale commercialization.", "Audited delivery quality, repeat orders, and positive gross-margin progression."]
      - [Thesis, "Approximately RMB 1.5 billion of H1 2025 revenue demonstrates meaningful product demand.", "Revenue mix showing durable software or service contribution and cash conversion."]
      - [Thesis, "The $310 million pre-IPO phase demonstrates continued access to institutional and strategic capital.", "Disclosed round terms without punitive preferences or excessive dilution."]
      - [Anti-thesis, "DeepWay reported a 2024 net loss of RMB 675 million and an H1 2025 net loss of RMB 371 million.", "A sustained audited path to operating profitability would weaken this concern."]
      - [Anti-thesis, "June 2025 reported liabilities exceeded assets, while current unrestricted cash after the 2026 financing is not disclosed.", "Verified net cash, working-capital headroom, and a preference waterfall."]
      - [Anti-thesis, "The public comparable set is too heterogeneous to support a direct revenue-multiple valuation.", "Segment-normalized peers with comparable margins, geography, and autonomy revenue."]
    notes: "Financial losses are accounting results, not a cash-burn measure; financing proceeds are not treated as cash available."
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV008, CV012]
  - id: TV003
    title: Bull, base, and bear underwriting cases
    columns:
      - Case
      - Evidence-backed assumptions
      - Valuation and return logic
      - Probability signal
      - Decision trigger
    rows:
      - [Bull, "Delivery scale converts into materially better margins; paid autonomy expands; the 2026 financing supports commercialization through IPO.", "No numeric public-evidence range is supportable; test an upper bound only after normalized recurring revenue and post-money capitalization are disclosed.", "Do not assign a probability until audited margin and subscription cohorts are available.", "Reconsider an investment after verified software economics, narrowing losses, and non-punitive terms."]
      - [Base, "Truck revenue continues growing while losses narrow gradually and autonomy remains an emerging rather than dominant revenue stream.", "Use the historical above-RMB 5.4 billion mark only as context, then rebase on current net cash, dilution, and industrial-quality peer economics.", "Current evidence supports monitoring, not a quantified probability.", "Maintain track status until current round and IPO terms permit a return calculation."]
      - [Bear, "Losses persist, balance-sheet pressure remains, and follow-on capital or IPO access comes with adverse dilution or preferences.", "No reliable equity floor is public because net debt and the preference waterfall are unknown.", "Risk rises if audited results fail to show margin improvement or if listing timing slips.", "Pass if terms subordinate new money or if liquidity cannot cover the operating plan."]
    notes: "Scenarios are conditional diligence cases, not forecasts; no valuation range, probability, hold period, or return target is asserted without missing transaction and financial inputs."
    claimRefs: [CV003, CV006, CV007, CV008, CV012, CV014, CV016]
