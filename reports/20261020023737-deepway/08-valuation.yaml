company:
  name: DeepWay
chapter:
  number: 8
  title: Valuation
  summary: >-
    DeepWay's $310 million pre-IPO financing and commercial delivery scale support continued monitoring, but reported losses, balance-sheet pressure, and undisclosed 2026 round pricing prevent a defensible invest-now valuation. The evidence supports a track/research-more recommendation with high risk and an indeterminate valuation stance until current capitalization, preferences, cash, and unit economics are verified.
sections:
  - id: decision-frame
    title: Decision frame and recommendation
    body: >-
      The investment case combines real commercial scale with weak price discovery. Independent coverage reports roughly 6,400 truck deliveries by June 2025 and approximately RMB 1.5 billion of first-half 2025 revenue, while multiple reports confirm a $310 million pre-IPO financing phase in 2026. Those facts establish operating momentum and access to capital, not investability at any price. DeepWay also remained loss-making, and the retained evidence does not disclose the latest post-money valuation or security terms. The appropriate public-evidence decision is therefore track/research-more rather than invest now. Confidence is medium-low and risk is high because the recommendation is directionally supported but cannot be converted into a risk-adjusted entry price or target return.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-price
    title: Financing context, price opacity, and dilution
    body: >-
      The second 2026 pre-IPO tranche brought the phase total to $310 million, with Stone Venture or Stone Capital, NGS Super, Xiamen Guosheng Fund, ABC Impact, and Nanjing Ronghe Capital named across coverage. Reporting says the proceeds are intended for operations, autonomous-driving research, and international expansion; funding raised is not the same as unrestricted cash available. A November 2025 article reported an August 2025 share price near RMB 38.94 and an implied valuation above RMB 5.4 billion, but that historical mark does not establish the 2026 round price. Aggregate funding databases also diverge sharply because of different coverage and vintages. Current ownership, fully diluted share count, liquidation preferences, anti-dilution rights, debt, and IPO primary-versus-secondary mix remain open diligence items.
    claimRefs: [CV001, CV002, CV006, CV007, CV008, CV009, CV010]
    tableRefs: [TV002]
  - id: scenarios-and-comparables
    title: Scenario discipline and comparable evidence
    body: >-
      Public comparables provide context but not a valuation answer. Multiples selected a mixed set of passenger-EV, industrial, and private vehicle companies and displayed revenue multiples spanning 0.8x to 13.1x; Tracxn instead emphasized autonomous-trucking and commercial-vehicle peers. That dispersion reflects materially different margin structures, technology exposure, geography, capital intensity, and maturity. Applying any one multiple to DeepWay's revenue would create false precision before normalized revenue, gross margin, net cash, dilution, and recurring software economics are known. The bull, base, and bear cases below are therefore conditional underwriting cases rather than price targets, and no quantitative probability is assigned.
    claimRefs: [CV004, CV011, CV012, CV013, CV014]
    tableRefs: [TV003]
  - id: exit-readiness
    title: Exit readiness and thesis-break diligence
    body: >-
      A planned Hong Kong Chapter 18C listing is an exit pathway, not evidence of completed liquidity. The 2026 financing broadens the investor base and may bridge the company toward listing, while Baidu's 17.28% reported stake and Apollo relationship remain strategically relevant. However, the public record does not establish IPO timing, offer valuation, lockups, preference conversion, or the split between primary proceeds and shareholder liquidity. The recommendation should improve only after audited current financials show narrowing losses, disclosed software economics demonstrate recurring value beyond truck sales, and round or IPO terms permit a normalized return analysis. The thesis breaks if losses and balance-sheet pressure persist without credible margin expansion, or if financing terms transfer disproportionate downside to new investors.
    claimRefs: [CV003, CV006, CV008, CV014, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Price discipline is the decision
    body: >-
      Track DeepWay, but do not convert the $310 million financing headline into an implied valuation, cash balance, or return case. Require the current capitalization table, preference stack, net cash, audited 2026 performance, and IPO terms before underwriting an entry.
    claimRefs: [CV001, CV006, CV008, CV016]
