runDate: 2026-10-20
company:
  name: DeepWay
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    DeepWay sells into China's rapidly expanding new-energy heavy-truck market,
    where 2025 sales reached 231,100 units and published 2030 forecasts cluster
    around CNY 250-256 billion. Its reachable market is narrower than those
    headline figures: fleet buyers must accept route-range and infrastructure
    constraints, while the extent of paid software adoption remains unresolved.
sections:
  - id: market-boundary
    title: Market boundary and status quo
    body: >-
      DeepWay's core market is purpose-built battery-electric heavy-duty trucks
      for highway freight fleets, with intelligent-driving capability embedded
      in the vehicle. That boundary excludes passenger autonomy, light commercial
      vehicles, stand-alone robotaxi software, and charging infrastructure not
      bundled with a truck sale. It also prevents the broader autonomous-driving
      opportunity from being treated as DeepWay's current addressable revenue
      pool: more than 99% of reported revenue has come from truck sales. The
      status quo is the diesel heavy truck, and the buyer's economic comparison
      is anchored in fuel and driver costs rather than software features alone.
      Public pricing of CNY 470,000-700,000 including VAT confirms an enterprise
      capital-purchase motion aimed at logistics and bulk-transport operators.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses
    body: >-
      The strongest available top-down lens is China's new-energy heavy-truck
      market, not global autonomous freight. One secondary source reports 231,100
      units sold in 2025, up 182%, with 28.89% penetration. Two published 2030
      outlooks are directionally consistent but not identical: one points to
      more than 50% penetration and a market above CNY 250 billion, while a CIC
      forecast cited by another publisher gives 53.5% penetration and CNY 255.8
      billion at a 33.3% CAGR. These are forecasts relayed through secondary
      outlets, so they define a range rather than an audited TAM. DeepWay's 8,020
      deliveries and approximately 3.4% share in 2025 provide a bottom-up company
      anchor, but do not establish a durable SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyer-and-adoption
    title: Buyer, user, payer, and adoption path
    body: >-
      The economic buyer is generally a fleet owner, logistics enterprise, or
      industrial transport contractor; drivers and dispatch teams are the users,
      while procurement or operations leaders control the vehicle and energy
      budget. Evidence spans express and third-party logistics customers as well
      as an industrial deployment: DeepWay delivered 100 trucks to Yuanchi New
      Energy for logistics serving Baowu Steel's Taiyuan operation. Adoption is
      therefore route-led. Fleets first validate payload, range, charging or
      swapping access, uptime, safety, and total cost on repeatable lanes, then
      expand vehicle counts. Reported paid take-up above 30% for intelligent
      driving functions suggests a software upsell path, but the evidence does
      not disclose price, cohort retention, or revenue contribution.
    claimRefs: [CM010, CM011, CM012, CM013]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation
    title: Drivers, constraints, and valuation relevance
    body: >-
      Electrification penetration, fleet pressure to reduce energy expense, and
      the possibility of lowering driver-related costs support adoption. Against
      those drivers, a 49-ton truck configuration with a reported 300 km
      single-charge range makes route design and battery-swap access material
      gating factors rather than implementation details. Company-level economics
      are another constraint: 2025 revenue reached CNY 3.96 billion, but net loss
      was CNY 649 million. Software monetization is also unresolved. One source
      says smart-logistics solutions were still in free trial through the first
      half of 2025, while later reporting says recurring subscription revenue had
      begun. Without software ARPU, renewal cohorts, contribution margin, or a
      reconciled launch date, valuation should be tied primarily to truck-market
      penetration and hardware economics, with software treated as upside rather
      than a proven market layer.
    claimRefs: [CM004, CM013, CM014, CM015, CM016]
