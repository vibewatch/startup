      - [BigGo Finance; 2026 forecast, China new-energy heavy trucks, "Not stated", "35% penetration", Industry-institution forecast relayed by publisher, Low-to-medium; no named forecast institution]
      - [BigGo Finance; 2030 forecast, China new-energy heavy trucks, "Above CNY 250bn", "Above 50% penetration", Industry-institution forecast relayed by publisher, Low-to-medium; directional threshold]
      - [CIC via ChinaBizInsider; 2030 forecast, China new-energy heavy trucks, "CNY 255.8bn", "53.5% penetration; 33.3% CAGR", Consulting forecast quoted by publisher, Medium; original report not in assigned evidence]
      - [DeepWay; 2025 actual, China new-energy heavy trucks, "8,020 deliveries", "Ninth by volume; about 3.4% share", Prospectus-derived figures relayed by publishers, Medium; share appears in one profile]
    notes: >-
      Values retain each publisher's period, unit, and forecast basis. The rows
      are separate lenses and must not be summed into TAM, SAM, or SOM.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Segment and buyer map
    columns: [Segment, Buyer, User, Payer or budget owner, Workflow, Adoption trigger]
    rows:
      - [Express and third-party logistics, Fleet procurement and operations leadership, Drivers dispatchers and safety teams, Fleet capex and transport operations, Long-haul trunk and regional collection routes, Route-level energy savings uptime and safety]
      - [Industrial closed-loop logistics, Industrial shipper or contracted fleet, Drivers and site logistics teams, Plant logistics or contractor fleet budget, Repeated freight between industrial facilities, Predictable lane charging payload and reliability]
      - [Bulk transport, Fleet owner or bulk-logistics enterprise, Drivers and dispatch teams, Vehicle procurement and energy budget, High-utilization bulk freight routes, Total cost versus diesel and route range]
      - [Intelligent-driving feature subscribers, Existing DeepWay fleet operator, Driver and fleet-control team, Safety or operations software budget, L2 assistance on operating vehicles, Demonstrated safety efficiency and acceptable subscription price]
      - [Future L4 freight operators, Large fleet or dedicated-route operator, Remote operations and dispatch teams, Automation and fleet transformation budget, Constrained repeatable autonomous routes, Regulatory approval redundancy and labor-cost removal]
    notes: >-
      Buyer roles are analytical mappings from reported customer deployments and
      product economics. Public evidence does not disclose named budget owners,
      procurement cycles, or software subscription prices.
    claimRefs: [CM003, CM004, CM010, CM011, CM012, CM013]
figures:
  - id: FM001
    title: Market-to-company sizing evidence ladder
    type: pyramid
    summary: >-
      Six non-additive published metrics narrow from China market forecasts to
      DeepWay's observed 2025 delivery base.
    data:
      items:
        - label: China market value forecast (CIC), 2030
          value: 255.8
          unit: CNY bn
          note: Forecast cited by ChinaBizInsider
        - label: China market value forecast (industry institutions), 2030
          value: 250
          unit: CNY bn+
          note: Directional threshold reported by BigGo Finance
        - label: China new-energy truck penetration (CIC), 2030
          value: 53.5
          unit: "%"
          note: Forecast cited by ChinaBizInsider
        - label: China new-energy truck penetration (industry institutions), 2030
          value: 50
          unit: "%+"
          note: Directional threshold reported by BigGo Finance
        - label: China new-energy heavy-truck sales, 2025
          value: 231100
          unit: trucks
          note: Annual sector sales reported by BigGo Finance
        - label: DeepWay deliveries, 2025
          value: 8020
          unit: trucks
          note: Company deliveries reported by CnEVPost and BitAuto
    approximationNotes: >-
      This is an evidence ladder, not a proportional funnel. It mixes market
      value, penetration, and unit-volume lenses and does not imply that one row
      is a mathematical subset of the preceding row. "+" values are publisher
      thresholds, not point estimates.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM016]
callouts:
  - calloutType: risk
    title: Software TAM is not yet evidenced
    body: >-
      Public sources conflict on when paid recurring software revenue began and
      disclose neither ARPU nor retention, so a separate software SAM or SOM
      would create false precision.
    claimRefs: [CM015, CM016]
