schemaVersion: "report-v2"
artifact: customers
slug: deepway
runDate: 2026-10-20
company:
  name: DeepWay
chapter:
  number: 6
  title: Customers
  summary: >-
    DeepWay has moved beyond pilot-only evidence: public sources report multi-year vehicle delivery growth,
    several named logistics deployments, and a decline in top-five customer revenue concentration. The evidence
    remains much weaker on renewals, customer-level economics, contract durability, and independently verified
    operating outcomes, so adoption scale should not be treated as proven retention.
sections:
  - id: customer-base-and-buying-surface
    title: Customer base and buying surface
    body: >-
      DeepWay is principally a business-to-business vehicle vendor serving logistics and supply-chain operators,
      with Bitauto additionally describing bulk-transport clients as a target segment. Public material frames the
      core purchase around an intelligent electric heavy truck for freight operations, while Dealroom reports an
      adjacent service layer spanning vehicle and driver management, financing support, and used-vehicle disposal.
      That combination suggests a buying process involving fleet operations, finance, and asset management rather
      than an individual driver alone. However, the allocated sources do not identify the payer, procurement owner,
      contract term, or revenue contribution by geography, route type, fleet size, or vertical. The segmentation is
      therefore useful for locating the buyer problem, but it is not a revenue-quality segmentation.
    claimRefs: [CU001, CU002, CU003, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-named-deployments
    title: Adoption trajectory and named deployment proof
    body: >-
      Reported deliveries rose from 509 vehicles in 2023 to 3,002 in 2024 and 8,020 in 2025, while a separate
      account says DeepWay delivered about 6,400 vehicles to 311 customers in 2024. Named evidence includes the
      May 2023 handover to XuRi DongSheng for CATL logistics work, a reported 22-vehicle first tranche from a
      72-unit Xinjiang Silk Road order, and 50 intelligent electric trucks delivered to ANE Logistics in June
      2026. These records demonstrate physical fleet deployment rather than logo-only marketing. They do not,
      however, provide customer invoices, utilization by cohort, acceptance criteria, realized savings, or
      repeat-order attribution. A demonstration journey and company-distributed mileage figures show operational
      activity, but neither establishes customer-level return on investment.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU010, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      The strongest durability-adjacent evidence is indirect. Bitauto reports that the top five customers'
      revenue share fell from 82.5% in 2023 to 39.5% in 2025, which is consistent with a broader customer base
      and lower concentration, but the source does not disclose the denominator, customer identities, or whether
      existing accounts expanded. Baidu Baike lists ANE Logistics, STO, and Maersk as recipients of intelligent
      products and reports more than 6,000 L2-equipped vehicle deliveries with a subscription rate above 30% by
      December 2025. Those figures indicate an attach opportunity, not renewal durability. No allocated source
      discloses gross or net revenue retention, churn, renewal rates, contract duration, cohort behavior, customer
      satisfaction, or the revenue contribution of repeat purchases.
    claimRefs: [CU009, CU011, CU014, CU016]
  - id: commercial-quality-and-diligence-implications
    title: Commercial quality and diligence implications
    body: >-
      Customer scale is currently monetized overwhelmingly through hardware. ChinaBizInsider reports that
      new-energy heavy-truck sales represented more than 99% of revenue during the periods it reviewed, while
      smart-logistics solutions remained in a free-trial phase and generated no income. That mix limits the
      evidence for a recurring software expansion loop even though assisted-driving subscriptions and operational
      mileage are reported. The next diligence step is not another logo count: it is a customer-level bridge from
      order to delivery, active utilization, repeat purchase, paid software attachment, renewal, and contribution
      margin. Without that bridge, the investment case should credit demonstrated vehicle adoption and improving
      concentration while treating retention, software conversion, and customer economics as material open risks.
    claimRefs: [CU011, CU012, CU013, CU014, CU015, CU016]
tables:
  - id: TU001
    title: Customer segmentation and buying surface
    columns:
      - Segment
      - Buyer / user / payer evidence
      - Primary use case
      - Scale or strategic value
      - Evidence gap
    rows:
      - - Logistics and supply-chain enterprises
        - Fleet operators are identified as truck purchasers; the exact procurement owner and payer are undisclosed.
        - Highway and regional freight transport
        - Core reported customer category
        - No revenue split, fleet-size bands, or contract terms
      - - Bulk-transport clients
        - Bitauto identifies bulk-transport clients as a primary B-end target.
        - High-load freight routes
        - Extends the addressable fleet base beyond parcel logistics
        - No named revenue contribution or repeat-purchase data
      - - Express freight operators
        - ANE Logistics received a 50-truck deployment; STO is also named in published customer lists.
        - Cross-regional trunk and collection/distribution routes
        - Provides a visible 2026 deployment surface
        - Customer-verified utilization and savings are unavailable
      - - Intelligent-driving adopters
        - Operators can attach L2 assistance to delivered vehicles.
        - Assisted freight driving and fleet operations
        - More than 6,000 equipped deliveries and an above-30% reported subscription rate
        - Paid conversion, renewal, ARPU, and cohort retention are undisclosed
    notes: >-
      Segments synthesize allocated public sources; customer economics, payer identity, contract terms, and
      revenue-band denominators are unavailable rather than assumed.
    claimRefs: [CU001, CU002, CU003, CU008, CU009, CU012, CU014]
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Period
      - Confidence
      - Implication
      - Missing denominator or limitation
    rows:
      - - Vehicle deliveries
        - 509; 3,002; 8,020
        - 2023; 2024; 2025
        - Medium
        - Indicates rapid scaling of physical deployments
        - No cancellations, returns, or repeat-buyer split
      - - Customers served
        - 311 customers and approximately 6,400 vehicles
        - 2024
        - Medium
        - Shows adoption across more than a handful of fleets
        - Customer definition and active-customer denominator are not disclosed
      - - L2-equipped deliveries and subscription
        - More than 6,000 vehicles; subscription rate above 30%
        - By December 2025
        - Low
        - Suggests an assisted-driving attach surface
        - Paid status, denominator definition, ARPU, and renewal are not disclosed
      - - Intelligent-driving operational mileage
        - More than 100 million km reported in 2024-era coverage and more than 200 million km by December 2025
        - 2024-2025
        - Low
        - Indicates growing real-world vehicle operation
        - Company/partner-distributed figures lack independent audit and customer-level attribution
    notes: >-
      Values retain their source periods and denominators; mileage and subscription figures are company- or
      partner-distributed and are not presented as independently audited customer outcomes.
    claimRefs: [CU004, CU005, CU014, CU015]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / operator
      - Segment
      - Deployment or use case
      - Evidence stage
      - Reported outcome
      - Limitation
    rows:
      - - XuRi DongSheng / CATL logistics
        - Supply-chain and battery logistics
        - Initial Xingchen fleet for CATL transportation tasks
        - Physical handover in May 2023
        - A 49-ton demonstration vehicle completed a reported 1,119-km journey
        - Demonstration evidence does not disclose customer ROI or repeat purchase
      - - Xinjiang Silk Road Supply Chain
        - Regional and coal logistics
        - First 22 vehicles from a reported 72-unit order
        - Physical delivery reported in December 2024
        - Deployment described for difficult regional routes
        - Evidence is a low-reputation synthesis without contract-value disclosure
      - - ANE Logistics
        - Express freight
        - 50 intelligent electric trucks for cross-regional and medium-long routes
        - Physical delivery reported in June 2026
        - Published route coverage includes East-to-South China and Zhengzhou-area operations
        - No customer-issued utilization, savings, or renewal evidence
      - - STO / Maersk
        - Express and international logistics
        - Identified as recipients of intelligent products
        - Named deployment claim
        - Broadens the reported customer set
        - Fleet count, production status, timing, and outcomes are not disclosed
    notes: >-
      This is a sample of named deployments visible in the assigned public evidence, not an exhaustive customer
      list; production status and outcomes are stated only where the source provides them.
    enumerationScope:
      coverage: sample
      basis: >-
        Named customers and operators appearing in successful prefetched sources allocated to the customers
        chapter through the 2026-10-20 run.
    claimRefs: [CU006, CU007, CU008, CU009, CU010]
figures:
  - id: FU001
    title: Customer adoption and expansion evidence chain
    type: journey-map
    summary: >-
      Public evidence reaches delivery and assisted-driving attachment, but the renewal and unit-economics links
      remain undisclosed.
    data:
      items:
        - label: Fleet need
          detail: Logistics and bulk-transport operators evaluate electric heavy trucks for freight operations.
          touchpoints:
            - Route and payload requirements
            - Fleet total-cost review
        - label: Vehicle procurement
          detail: Truck purchases may be paired with financing, vehicle management, and disposal support.
          touchpoints:
            - Fleet procurement
            - Financing support
        - label: Initial deployment
          detail: Named handovers provide evidence of physical vehicles entering customer operations.
          touchpoints:
            - Vehicle acceptance
            - Route assignment
        - label: Operational utilization
          detail: Demonstration journeys and aggregate mileage indicate use, without customer-level audit.
          touchpoints:
            - Fleet monitoring
            - Route operations
        - label: Assisted-driving attachment
          detail: L2-equipped deliveries create a software attachment surface, but paid conversion is unclear.
          touchpoints:
            - Feature activation
            - Driver assistance
        - label: Expansion and renewal
          detail: Broader named-customer coverage and lower concentration are visible, while repeat purchase and renewal remain gaps.
          touchpoints:
            - Additional vehicles
            - Subscription renewal
    approximationNotes: >-
      The ordered stages are an analytical evidence chain, not a measured conversion funnel; no conversion rates
      or stage populations are inferred.
    claimRefs: [CU002, CU003, CU006, CU011, CU014, CU015]
callouts:
  - calloutType: risk
    title: Delivery growth is not retention evidence
    body: >-
      The allocated sources do not disclose renewal, churn, contract duration, paid software cohorts, or
      customer-level economics, so vehicle delivery growth should not be converted into a retention assumption.
    claimRefs: [CU005, CU013, CU016]
