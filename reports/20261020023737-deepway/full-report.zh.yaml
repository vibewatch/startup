            body: >-
              公开证据支持中国四个地区的自动驾驶测试许可和编队行驶商业货运试点，但这些事实不能证明已获得不受限制的无人驾驶商业许可。Baidu 2021 年发布公告称，第一代卡车计划在 2024 至 2026
              年间于高速公路线路达到 L4 能力；后续证据仍强调 L2
              系统、许可和试点。这一差距是商业化和执行风险，而不是技术失败的证明。指定证据池没有足够的监管机构、法院、召回或事故记录，无法确认不存在诉讼、执法行动、安全缺陷、网络事件或海外型式认证障碍。尽调必须取得许可层面的范围、安全论证证据、脱离接管和事故日志、召回与保修数据、隐私和网络安全评估，以及逐国审批。任何严重安全事件、许可暂停、无法取得海外型式认证，或在没有付费自动驾驶部署的情况下反复延期，都会触发投资逻辑失效。
            claimRefs:
              - CR013
              - CR014
