            body: 在直接取得合同、许可、安全、集中度、保修和现金流证据前，维持高剩余风险；新闻报道和发行人关联描述无法填补这些缺口。
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
