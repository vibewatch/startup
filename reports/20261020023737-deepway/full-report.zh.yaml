      - number: '4.4'
        title: 资本充足性不能简化为公开现金跑道估算
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年 6 月 30 日，报告负债 RMB 5.54 billion 高于 RMB 3.92 billion 的资产，现金及现金等价物为 RMB 593
              million。这些数字显示资产负债表承压，但会计亏损不是烧钱速度，已募集资金也不是可用现金。公开记录没有披露经营现金流、已承诺的工厂资本开支、营运资金季节性、债务到期日、项目融资义务或受限现金，因此精确现金跑道只能是臆测。财务结论因此是混合的：交付和收入势头证明商业牵引力，但收入仍是多样性低的硬件收入，软件变现尚处早期，达到持久利润率的成本也未量化。投资评估需要管理账、银行流水、债务明细、队列层面的定价和经调和的现金计划。
