              - CM009
              - CM016
      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方通常是车队所有者、物流企业或工业运输承包商；司机和调度团队是用户，采购或运营负责人掌控车辆及能源预算。证据覆盖快递和第三方物流客户，也包括工业部署：DeepWay 向 Yuanchi New Energy
              交付 100 辆卡车，用于服务 Baowu Steel
              的太原业务。因此，采用路径由运输线路驱动。车队先在可重复线路上验证载重、续航、充电或换电可达性、正常运行时间、安全性和总成本，再扩大车辆数量。据报道，智能驾驶功能的付费采用率超过
              30%，显示出软件增购路径；但证据未披露价格、队列留存或收入贡献。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              电动化渗透、车队降低能源支出的压力，以及降低司机相关成本的可能性，都支持采用。与这些驱动因素相对，49 吨车型据报道单次充电续航 300
              km，因此线路设计和换电可达性是实质性门槛，而非实现细节。公司层面的经济性也是约束：2025 年收入达到 CNY 3.96 billion，但净亏损为 CNY 649
              million。软件变现同样尚未解决。一份资料称智慧物流解决方案在 2025 年上半年仍处于免费试用；后续报道则称经常性订阅收入已经开始。在缺少软件
              ARPU、续费队列、贡献毛利率或可调和的上线日期前，估值应主要锚定卡车市场渗透率和硬件经济性，把软件视为上行空间，而非已验证的市场层。
            claimRefs:
              - CM004
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 软件 TAM 尚无证据支撑
            body: 公开来源对于付费经常性软件收入何时开始存在冲突，且既未披露 ARPU，也未披露留存；单独测算软件 SAM 或 SOM 会制造虚假的精确度。
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场路径
        blocks:
          - type: paragraph
            body: >-
              DeepWay
              处在电动卡车制造商与自动驾驶货运技术供应商之间：公司今天销售整车，同时提供三条潜在的欧洲路径——整车出口、与当地制造商合作生产，或向成熟品牌授权技术。这种灵活性在战略上有用，但还不等于拥有本地存在。管理层表示
              DeepWay 尚无欧洲基地，仍需要售后、充电、融资和租赁合作伙伴。在同一场 2026 年行业活动上，BYD 介绍了先在欧洲推出重卡、再进行本地制造的计划；Sinotruk 和 SuperPanther 强调与
              Steyr Automotive 在奥地利组装；Sany 则强调与 Putzmeister 合作。因此，DeepWay
              同时面对直接产品竞争、成熟工业网络，以及可降低资本强度但也可能把客户所有权交给合作伙伴的授权替代方案。据报道，截至 2026 年 4 月已销售超过 13,000 辆卡车，证明具备商业规模，但 Dealroom
              的宽泛估值区间不能作为同行基准。
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP007
      - number: '3.2'
        title: 能力、产品经济性与运营模式
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的差异化来自前向设计的电动架构、驾驶辅助集成，以及对电池、电驱桥和功率电子的更强控制。公开规格显示产品在持续演进：2021 Xingtu 发布时称满载 49 吨可行驶 300
              kilometers；2026 年一篇报道则称 600 kWh Star 在同等额定总重量下约可行驶 400 kilometers。这些数字对应不同代际和配置，不是受控的竞品对标。Gasgoo
              还转述了一项公司演示，称其能耗比改装电动车低 10%，充电效率高 22%；缺少独立测试限制了这一说法的投资评估价值。DeepWay 的定价仅在这一点上更清楚：两份资料将含增值税的建议车价定为 RMB
              470,000–700,000。同行成交价、折扣、电池所有权、融资、维护和实际总拥有成本均未披露，因此矩阵将无支撑的比较标为未知，而不是判定胜负。
            claimRefs:
              - CP008
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP014
              - CP015
      - number: '3.3'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              核心竞争张力在于：DeepWay 正从较弱的采购位置出发进行纵向整合。公司国际业务高管承认，更大的中国竞争对手依靠规模压低价格，而 DeepWay
              对供应商（包括电池供应商）的议价能力更弱。公司不拥有中国制造工厂，依赖合同制造商；据报道，三电系统约占制造成本的
              60%。将这些系统收归内部可能提升控制力，但也会把执行风险集中在低毛利硬件模式中。软件变现尚未证明：2025 年一份报告称智慧物流解决方案仍处于免费试用且没有收入。即便是基本规模证据也需要调和：一份资料称
              2024 年约有 6,400 辆车，另一份则报告交付 3,002 辆。因此，近期可辩护的护城河是集成能力和积累的运营数据，而不是已证明的自动驾驶优势、独家分销或独立验证的成本领先。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP012
              - CP014
      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: 规模是眼下的护城河检验
            body: DeepWay 自己的高管表示，更大的中国竞争对手依靠更高规模定价，并以更强势的方式与电池供应商谈判；因此，在纵向整合成为持久护城河之前，必须先抵消结构性的采购劣势。
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP013
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入结构集中在卡车硬件
        blocks:
          - type: paragraph
            body: >-
              DeepWay 披露的收入基础绝大部分是交易型，而非经常性收入。报告期内，新能源重卡销售贡献超过 99% 的收入，零部件贡献不足
              1%，智慧物流解决方案仍以免费试用形式提供且没有收入。公开描述还提到车辆管理、融资支持和二手车服务，但没有来源将收入分配到这些活动。含增值税的报告零售价 RMB 470,000-RMB 700,000
              只能确定标价区间，不能代表实际平均售价、净收入或毛利。因此，收入质量仍由硬件主导并依赖交付；软件和服务是尚未验证的变现选项，而不是当前的经常性收入。
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
