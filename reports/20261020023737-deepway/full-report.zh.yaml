chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              DeepWay 于 2020 年由 Baidu 和 Lionbridge
              合资成立，目前将总部设在合肥。公司英文官网将使命表述为推动重型运输电动化；第三方资料则将其描述为一家面向物流和供应链运营商，设计并销售前向设计智能电动卡车的企业。据公开信息，含增值税的价格为 RMB
              470,000–700,000。这本质上仍是车辆硬件生意：BitAuto 报告 2025 年营业收入为 RMB 3.961 billion，且新能源重卡销售持续贡献超过 99%
              的收入。因此，软件和自动驾驶的潜在空间不能视为已被验证的经常性收入基础。
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
