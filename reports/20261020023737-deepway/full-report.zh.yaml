              - CO014
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人、董事长兼 CEO Wan Jun 通过 Lionbridge 积累了直接的物流市场经验；公开资料还称他是 DeepWay 的实际控制人，直接及间接持股
              26.22%。已披露的运营团队覆盖自动驾驶、车辆工程、商业化和财务：Tian Shan 任 CTO，Tan Changyu 任总工程师，Xu Shangshang 任 CMO，Wang Jia 任
              CFO。这套配置兼具创始人与市场的契合度及职能覆盖，但指定证据池没有披露董事会构成、委员会架构、保护性条款或继任规划。因此，创始人控制权集中以及与 Baidu 的技术关系，仍是重要治理尽调事项。
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: 资本、规模与财务风险
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的规模明显加速：BitAuto 报告 2025 年交付 8,020 辆卡车，同比增长 167%，在中国新能源重卡市场占有率为 3.4%，排名第九。资本记录则不够清晰。2025 年 11
              月的一篇报道称 11 轮融资累计 RMB 1.96 billion，后续资料则称 2026 年两轮 IPO 前融资合计超过 US$310
              million；两者的重叠和口径尚未调和。估值指标也因日期和方法不同而不一致。财务风险仍然很高：一份报告计算 2022 年至 2025 年上半年的累计亏损为 RMB 1.70 billion；截至 2025 年
              6 月 30 日，负债 RMB 5.54 billion，高于 RMB 3.92 billion 的资产，现金为 RMB 593 million。
