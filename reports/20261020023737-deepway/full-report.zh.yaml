  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 证据链从已证明的规模，导向一个受条款约束的跟踪决定，而不是立即投资估值。
    data:
      nodes:
        - id: scale
          label: 商业规模
          detail: 约 6,400 辆交付，以及 2025 年上半年 RMB 1.5 billion 收入。
        - id: loss
          label: 亏损情况
          detail: 据报道，会计亏损仍然严重。
        - id: capital
          label: 融资渠道
          detail: 2026 年完成 $310 million Pre-IPO 阶段融资。
        - id: opacity
          label: 价格不透明
          detail: 当前投后估值和优先权条款未公开。
        - id: risk
          label: 高承销风险
          detail: 资产负债表、稀释、利润率和退出条款仍需尽调。
        - id: decision
          label: 跟踪 / 继续研究
          detail: 公开证据不足以支持立即投资的价格或目标回报。
    approximationNotes: 该流程是定性的、按顺序展开；不赋予权重或概率，也不提供估值。
