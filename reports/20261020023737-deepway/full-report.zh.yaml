  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策框架与建议
        blocks:
          - type: paragraph
            body: >-
              这项投资逻辑同时具备真实商业规模和疲弱的价格发现。独立报道显示，截至 2025 年 6 月交付约 6,400 辆卡车，2025 年上半年收入约为 RMB 1.5 billion；多份报道确认 2026 年存在
              $310 million 的 IPO 前融资阶段。这些事实证明运营势头和融资能力，并不代表任何价格都值得投资。DeepWay
              仍在亏损，保留的证据也没有披露最新的投后估值或证券条款。因此，基于公开证据的合适决定是观察/继续研究，而不是现在投资。信心为中低，风险为高，因为建议方向上有依据，但无法转化为风险调整后的入场价格或目标回报。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV008
              - CV016
      - number: '8.2'
        title: 融资背景、价格不透明与稀释
        blocks:
          - type: paragraph
            body: >-
              2026 年第二轮 IPO 前融资使该阶段累计金额达到 $310 million，报道中点名 Stone Venture 或 Stone Capital、NGS Super、Xiamen Guosheng
              Fund、ABC Impact 和 Nanjing Ronghe Capital。报道称，资金将用于运营、自动驾驶研究和国际扩张；募集资金不等于不受限制的可用现金。2025 年 11 月的一篇文章称，2025 年
              8 月股价接近 RMB 38.94，隐含估值超过 RMB 5.4 billion，但这一历史价格不能确定 2026
              年融资价格。由于覆盖范围和数据年份不同，各融资数据库的累计金额也存在明显差异。当前持股、完全摊薄股数、清算优先权、反稀释权利、债务，以及 IPO 新股与老股的比例，仍是未决尽调事项。
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV012
      - number: '8.3'
        title: 情景纪律与可比公司证据
        blocks:
          - type: paragraph
            body: >-
              公开可比公司能提供背景，但不能直接给出估值答案。Multiples 选取了乘用电动车、工业企业和私人车辆公司组成的混合样本，展示的收入倍数从 0.8x 到 13.1x；Tracxn
              则强调自动驾驶卡车和商用车同行。这种分散反映了利润率结构、技术暴露、地域、资本强度和成熟度的显著差异。在标准化收入、毛利率、净现金、稀释程度和经常性软件经济性明确前，把任何一个倍数套到 DeepWay
              收入上都会制造虚假精确度。因此，下方乐观、基准和悲观情景是有条件的投资评估情景，而不是价格目标，也不赋予量化概率。
            claimRefs:
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: 退出准备度与投资逻辑失效尽调
        blocks:
          - type: paragraph
            body: >-
              计划中的香港 Chapter 18C 上市是一条退出路径，不是流动性已经实现的证据。2026 年融资扩大了投资者基础，可能帮助公司走向上市；Baidu 报告持股 17.28% 及 Apollo
              关系仍具有战略意义。但公开记录没有确定 IPO
              时间、发行估值、锁定期、优先权转换，或新股募集资金与股东流动性的比例。只有在经审计的当前财务报表显示亏损收窄、披露的软件经济性证明卡车销售之外的经常性价值，且融资轮或 IPO
              条款允许标准化回报分析后，建议才应改善。如果亏损和资产负债表压力持续而没有可信的利润率扩张，或融资条款把不成比例的下行风险转给新投资者，投资逻辑就会失效。
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 价格纪律就是决策
            body: 观察 DeepWay，但不要把 $310 million 融资标题转化为隐含估值、现金余额或回报情景。在评估入场前，要求取得当前股权结构表、优先股堆叠、净现金、经审计的 2026 年业绩和 IPO 条款。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV016
