              - CI005
              - CI013
              - CI015
              - CI016
      - number: '4.2'
        title: 定价与市场进入证据只在边缘可见
        blocks:
          - type: paragraph
            body: >-
              现有证据指向直接车队销售和伙伴驱动的扩张。DeepWay 首批交付车辆发往 XuRi DongSheng，用于 CATL
              物流业务，显示出企业部署路径；其欧洲计划则考虑向当地成熟品牌授权技术，最终在当地制造。两条路径都没有披露销售周期、渠道利润、获客成本、付款条件、折扣或续费经济性。一份汇总资料称 ADAS 订阅率超过 30%，且
              L2 车辆交付超过 6,000 辆，但没有定义订阅率分母，也没有披露价格和经常性收入。因此，这些证据适合用来描绘变现机制，不足以评估销售效率。
