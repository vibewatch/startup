      - number: '7.4'
        title: 监测计划与投资含义
        blocks:
          - type: paragraph
            body: >-
              风险计划应以里程碑为核心，而不是依赖叙述。季度监测应分别跟踪卡车毛利率、保修成本、营运资金占用、付费软件收入、客户和供应商集中度、OEM
              产能及安全事件。自动驾驶监测应区分测试许可、有人监督试点、付费编队运营和无人驾驶商业授权；单看里程不能证明部署安全或盈利。只有在型式认证、本地服务覆盖和重复付费交付得到记录后，国际扩张才应计入投资判断。市场本身高度集中：一份
              2025 年资料称，前五大厂商占中国新能源重卡市场的 71%，这提高了 DeepWay 在成本和服务差异化上的门槛。投资上，在利润率、依赖、监管和经常性软件证据同时改善前，应维持高剩余风险评级，而不能把计划中的
              IPO 或 IPO 前融资当作现金跑道充足的证明。
            claimRefs:
