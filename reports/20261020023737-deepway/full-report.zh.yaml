      - CI016
  - id: FE001
    title: 产品成熟度与依赖栈
    type: stack
    summary: 商业证据最充分的是已交付的车辆硬件和 L2 辅助驾驶；更高阶自动驾驶依赖 Baidu 技术，独立验证也更少。
    data:
      layers:
        - label: 货运流程
          detail: 长途和中程车队运营
          items:
            - Xingchen 干线与支线运输
            - Xingtu 中短途运输
        - label: 车辆平台
          detail: 专用电动重卡架构
          items:
            - 集成式电池与底盘
            - 跨域电子电气架构
        - label: 能源与动力
          detail: 三电系统与路线能源选项
          items:
            - 电池与电驱
            - 电子控制与换电
        - label: 辅助驾驶
          detail: 公开描述中最成熟的智能化层
          items:
            - 天玑随行 L2 辅助驾驶
            - 传感器与车载计算栈
        - label: 更高阶自动化
          detail: 仍在逐步开发，尚未验证为全车队 L4
          items:
            - 天玑沿行编队行驶
            - 天玑独行单车自动驾驶
        - label: 运营与外部基础
          detail: 建立在授权自动驾驶基础上的车队软件
          items:
            - 天枢 IoT 运营平台
            - Baidu Apollo 白盒技术依赖
    approximationNotes: 层级顺序表示功能依赖和公开成熟度，不代表成本、价值或技术完整性，也不是量化的就绪度尺度。
    claimRefs:
      - CE006
      - CE007
      - CE008
      - CE009
      - CE010
      - CE011
      - CE014
  - id: FU001
    title: 客户采用与扩张证据链
    type: journey-map
    summary: 公开证据已覆盖交付和辅助驾驶装配，但续费与单位经济性环节仍未披露。
    data:
      items:
        - label: 车队需求
          detail: 物流和大宗运输运营商会评估电动重卡，用于货运运营。
          touchpoints:
            - 路线与载荷要求
            - 车队总成本评估
        - label: 车辆采购
          detail: 卡车采购可能与融资、车辆管理和处置支持打包。
          touchpoints:
            - 车队采购
            - 融资支持
        - label: 初始部署
          detail: 有明确客户名称的交车，证明实体车辆已进入客户运营。
          touchpoints:
            - 车辆验收
            - 路线分配
        - label: 运营使用
          detail: 示范行程和累计里程显示车辆在使用，但没有客户层面的审计。
          touchpoints:
            - 车队监控
            - 路线运营
        - label: 辅助驾驶装配
          detail: 配备 L2 的交付创造了软件附着面，但付费转化尚不明确。
          touchpoints:
            - 功能启用
            - 驾驶辅助
        - label: 扩张与续费
          detail: 可见的具名客户覆盖范围扩大、集中度下降，但复购和续费仍是空白。
          touchpoints:
            - 新增车辆
            - 订阅续费
    approximationNotes: 这些有序阶段是分析性的证据链，不是测量得到的转化漏斗；不推断转化率或各阶段规模。
    claimRefs:
      - CU002
      - CU003
      - CU006
      - CU011
      - CU014
      - CU015
  - id: FR001
    title: 风险热力图：披露的缓释措施之后的剩余敞口
    type: matrix
    summary: 财务模型和供应链风险仍是最直接的重大敞口；在完成一手尽调前，自动驾驶和制造风险仍处于高位。
