      - number: '4.3'
        title: 规模增长快于已证明的经营杠杆
        blocks:
          - type: paragraph
            body: >-
              报告收入从 2023 年的 RMB 426 million 增至 2024 年的 RMB 1.97 billion，2025 年上半年收入达到 RMB 1.51 billion，同比增长 97.6%。交付量也从
              2023 年的 509 辆增至 2024 年的 3,002 辆和 2025 年的 8,020 辆。但这个规模尚未带来盈利：一份独立报告称，累计交付超过 12,000 辆后 DeepWay 仍未盈利；另一份则称
              2022 年至 2025 年上半年累计会计亏损为 RMB 1.70 billion。研发投入仍然很高，管理层规划的纵向整合瞄准据报道约占制造成本 60%
              的三电系统。公开数据仍未披露毛利率、保修负担、电池采购经济性和工厂资本开支，因此无法量化利润率路径。
