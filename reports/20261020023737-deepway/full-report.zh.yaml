            body: >-
              规模增长很快，多份资料报告 2025 年交付 8,020 辆，但规模也放大了采购、保修、制造和服务执行风险。2024 年前五大供应商据报道占采购额 92%，最大供应商超过 60%；前五大客户贡献 51%
              的收入，最大客户接近 25%。DeepWay 还依赖 Jianghuai 和 Shandong Leichi 进行合同制造，引用招股书的资料称公司没有自己的生产许可证。Baidu
              的技术许可加快了开发，但也围绕核心差异化形成战略依赖。因此，缓释效果应通过有约束力的双供应商计划、供应商变更认证、可执行的 OEM 产能和质量条款、软件托管或业务连续性权利，以及客户集中度报告来检验。若失去
              Baidu 权利、OEM 出现重大中断，或在下一次重大放量前无法降低单一供应商暴露，运营逻辑就会被击穿。
