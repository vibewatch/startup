  - id: TV002
    title: 论点、反论点与判断改变测试
    columns:
      - 立场
      - 有证据支持的论点
      - 哪些事实会强化或逆转判断
    rows:
      - - 论点
        - 截至 2025 年 6 月累计交付约 6,400 辆，说明商业化已超出试点规模。
        - 经审计的交付质量、复购订单，以及毛利率持续改善。
      - - 论点
        - 2025 年上半年收入约为 RMB 1.5 billion，说明产品需求已有实质规模。
        - 收入结构显示软件或服务贡献可持续，并能转化为现金。
      - - 论点
        - $310 million 的 Pre-IPO 阶段融资，说明公司仍能获得机构资本和战略资本。
        - 披露的轮次条款不含惩罚性优先权，也没有过度稀释。
      - - 反论点
        - DeepWay 据报 2024 年净亏损 RMB 675 million，2025 年上半年净亏损 RMB 371 million。
        - 若经审计结果显示公司持续走向经营盈利，这一担忧会减弱。
      - - 反论点
        - 2025 年 6 月，据报道负债超过资产；2026 年融资后的当前非受限现金尚未披露。
        - 经核实的净现金、营运资金余量，以及优先权瀑布。
      - - 反论点
        - 公开可比公司集合异质性太高，无法支持直接收入倍数估值。
        - 按分部标准化、且利润率、地理市场和自动驾驶收入可比的同行。
    notes: 财务亏损是会计结果，不等同于现金消耗；融资所得不视为可用现金。
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV005
      - CV006
      - CV008
      - CV012
  - id: TV003
    title: 乐观、基准与悲观承销情景
    columns:
      - 情景
      - 有证据支持的假设
      - 估值与回报逻辑
      - 概率信号
      - 决策触发条件
    rows:
      - - 乐观
        - 交付规模转化为显著更高的利润率；付费自动驾驶业务扩大；2026 年融资支持公司商业化直至 IPO。
        - 公开证据不足以支撑数值化区间；只有在标准化经常性收入和投后资本结构披露后，才测试上限。
        - 在经审计的利润率和订阅客户群数据可得前，不赋予概率。
        - 软件经济性得到核实、亏损收窄且条款不具惩罚性后，重新考虑投资。
      - - 基准
        - 卡车收入继续增长，亏损逐步收窄，而自动驾驶仍是新兴收入来源，不会成为主导。
        - 仅将历史上高于 RMB 5.4 billion 的估值作为背景，再根据当前净现金、稀释程度和工业领域可比公司的经济性重新定基。
        - 当前证据支持持续跟踪，不支持量化概率。
        - 在当前轮次和 IPO 条款足以计算回报前，维持跟踪状态。
      - - 悲观
        - 亏损持续，资产负债表压力不减，后续资本或 IPO 渠道伴随不利稀释或优先权条款。
        - 由于净债务和优先权瀑布未知，公开信息无法支持可靠的股权底价。
        - 若经审计结果未显示利润率改善，或上市时间推迟，风险上升。
        - 若条款使新资金处于次级，或流动性无法覆盖运营计划，则放弃。
    notes: 这些是有条件的尽调情景，不是预测；在交易和财务输入尚缺的情况下，不主张任何估值区间、概率、持有期或回报目标。
    claimRefs:
      - CV003
      - CV006
      - CV007
      - CV008
      - CV012
      - CV014
      - CV016
