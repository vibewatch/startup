  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状
        blocks:
          - type: paragraph
            body: >-
              DeepWay 的核心市场是面向高速公路货运车队的专用纯电重卡，车辆内置智能驾驶能力。这个边界不包括乘用车自动驾驶、轻型商用车、独立的 Robotaxi
              软件，也不包括未与卡车销售捆绑的充电基础设施。它也避免把更广泛的自动驾驶机会直接当成 DeepWay 当前可触达的收入池：报告收入中超过 99%
              来自卡车销售。现状仍是柴油重卡，买方比较的经济账主要看燃料和司机成本，而不是单看软件功能。含增值税的公开价格 CNY 470,000-700,000，说明这是一笔面向物流及大宗运输运营商的企业级资本采购。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: 多重市场规模视角
        blocks:
          - type: paragraph
            body: >-
              最有力的自上而下视角是中国新能源重卡市场，而不是全球自动驾驶货运市场。一份二手资料称，2025 年销量为 231,100 辆，同比增长 182%，渗透率为 28.89%。两份已发布的 2030
              年展望方向一致但并不相同：一份预计渗透率超过 50%、市场规模超过 CNY 250 billion；另一家出版物引用的 CIC 预测则给出 53.5% 的渗透率和 CNY 255.8 billion
              的市场规模，对应 33.3% 的 CAGR。这些都是经由二手渠道转述的预测，只能定义区间，不能当作经审计的 TAM。DeepWay 2025 年交付 8,020 辆、约占 3.4%
              的市场份额，提供了自下而上的公司锚点，但尚不足以证明持久的 SOM。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
