  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与财务模型暴露
        blocks:
          - type: paragraph
            body: >-
              最大的剩余风险，是在软件收入尚未形成实质规模前，扩大资本密集型卡车制造业务的经济性。独立报道将 2025 年收入定为 RMB3.96 billion、全年亏损定为 RMB649 million；另一份 2025
              年资料则称 2022 年至 2025 年上半年累计亏损 RMB1.70 billion。截至 2025 年 6 月 30 日，报告负债 RMB5.54 billion 高于 RMB3.92 billion
              的资产，现金及现金等价物为 RMB593 million。这些是会计和资产负债表指标，不是烧钱速度或现金跑道。毛利率从 2023 年的 0.4% 提升至 2025 年上半年的 2.9%，但超过 99%
              的收入仍来自卡车销售，智慧物流解决方案仍处于免费试用。缓释措施是严格降低制造成本，并把软件试用转成付费收入；失效标准是毛利率持续处于低个位数，同时亏损继续或日常运营再次依赖外部融资。
