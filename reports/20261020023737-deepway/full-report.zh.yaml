      - number: '1.4'
        title: 里程碑与尽调立场
        blocks:
          - type: paragraph
            body: >-
              即使具体估算并不一致，运营时间线仍然连贯：DeepWay 于 2020 年成立，2021 年发布首款卡车，2022–2024 年连续完成机构轮融资，2023 年 5 月首次批量交付，并于 2023 年 11
              月将总部迁至合肥。到 2025 年，公司报告全年交付 8,020 辆；2026 年 IPO
              前融资则确认其已在准备后期资本市场运作。由此有两点结论。第一，公司已经从原型阶段跨入有实质规模的车辆交付。第二，证据基础仍主要由公司关联发布、商业资料和二手报道构成，而非当前招股书或经审计的股权结构表，因此，确切持股、估值、现金可用性、客户数和员工数仍需一手文件核验。
