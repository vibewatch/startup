chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              DeepWay was established in 2020 as a joint venture between Baidu and Lionbridge and now identifies Hefei
              as its headquarters. The company’s official English pages frame its purpose as electrifying heavy-duty
              transport, while third-party profiles describe a business centered on designing and selling
              forward-defined intelligent electric trucks to logistics and supply-chain operators. Public pricing is
              reported at RMB 470,000–700,000 including VAT. This remains predominantly a vehicle-hardware business:
              BitAuto reports RMB 3.961 billion of 2025 operating revenue and says new-energy heavy-truck sales
              consistently supplied more than 99% of revenue. Accordingly, software and autonomous-driving optionality
              should not be treated as a proven recurring-revenue base.
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO005
              - CO006
              - CO007
              - CO008
              - CO011
              - CO012
              - CO013
              - CO014
      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder, chairman, and CEO Wan Jun brings direct logistics-market experience through Lionbridge; public
              profiles also describe him as DeepWay’s actual controller with a 26.22% direct and indirect holding. The
              named operating bench covers autonomy, vehicle engineering, commercialization, and finance: Tian Shan is
              identified as CTO, Tan Changyu as chief engineer, Xu Shangshang as CMO, and Wang Jia as CFO. That mix
              supports founder-market fit and functional coverage, but public evidence in the assigned pool does not
              disclose board composition, committee structure, protective provisions, or succession planning. The
              concentration of founder control and the Baidu technology relationship therefore remain material
              governance diligence items.
            claimRefs:
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO004
      - number: '1.3'
        title: Capital, scale, and financial risk
        blocks:
          - type: paragraph
            body: >-
              DeepWay’s scale accelerated materially: BitAuto reports 8,020 truck deliveries in 2025, up 167% year over
              year, with a 3.4% share and ninth place in China’s new-energy heavy-truck market. The capital record is
              less clean. A November 2025 report cited RMB 1.96 billion across 11 rounds, while later sources describe
              two 2026 pre-IPO financings totaling more than US$310 million; overlap and scope are not reconciled.
              Valuation indicators also differ by date and method. Financial risk remains substantial: one report
              calculates RMB 1.70 billion of cumulative losses from 2022 through first-half 2025, and at June 30, 2025
              reports liabilities of RMB 5.54 billion against RMB 3.92 billion of assets and RMB 593 million of cash.
            claimRefs:
              - CO008
              - CO009
              - CO010
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
              - CO003
              - CO011
              - CO012
      - number: '1.4'
        title: Milestones and diligence posture
        blocks:
          - type: paragraph
            body: >-
              The operating chronology is coherent even where point estimates are not. DeepWay moved from formation in
              2020 to a first truck unveiling in 2021, successive institutional rounds in 2022–2024, first batch
              delivery in May 2023, and a Hefei headquarters move in November 2023. By 2025 it reported 8,020 annual
              deliveries, and 2026 pre-IPO financing confirms late-stage capital-market preparation. Two implications
              follow. First, the company has crossed from prototype to material vehicle shipments. Second, the evidence
              base is still dominated by company-linked releases, commercial profiles, and secondary reporting rather
              than a current prospectus or audited cap table, so exact ownership, valuation, cash availability, customer
              count, and headcount require primary-document verification.
            claimRefs:
              - CO001
              - CO002
              - CO008
              - CO011
              - CO012
              - CO015
              - CO016
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO002
              - CO008
              - CO011
              - CO012
              - CO015
              - CO016
      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercialization is beyond prototype stage
            body: >-
              The 2023 first delivery and reported 8,020 deliveries in 2025 indicate material hardware
              commercialization, even though the evidence does not independently reconcile registrations, recognized
              revenue, and end-customer deployment.
            calloutType: strength
            claimRefs:
              - CO008
              - CO016
          - type: callout
            title: Capital-market readiness does not remove balance-sheet risk
            body: >-
              Pre-IPO financing and reported growth coexist with cumulative accounting losses and a June 2025 balance
              sheet where reported liabilities exceeded assets; funding raised should not be read as cash available.
            calloutType: risk
            claimRefs:
