              - CU007
              - CU008
              - CU009
              - CU010
      - number: '6.3'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The strongest durability-adjacent evidence is indirect. Bitauto reports that the top five customers'
              revenue share fell from 82.5% in 2023 to 39.5% in 2025, which is consistent with a broader customer base
              and lower concentration, but the source does not disclose the denominator, customer identities, or whether
              existing accounts expanded. Baidu Baike lists ANE Logistics, STO, and Maersk as recipients of intelligent
              products and reports more than 6,000 L2-equipped vehicle deliveries with a subscription rate above 30% by
              December 2025. Those figures indicate an attach opportunity, not renewal durability. No allocated source
              discloses gross or net revenue retention, churn, renewal rates, contract duration, cohort behavior,
              customer satisfaction, or the revenue contribution of repeat purchases.
            claimRefs:
              - CU009
              - CU011
              - CU014
              - CU016
      - number: '6.4'
        title: Commercial quality and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Customer scale is currently monetized overwhelmingly through hardware. ChinaBizInsider reports that
              new-energy heavy-truck sales represented more than 99% of revenue during the periods it reviewed, while
              smart-logistics solutions remained in a free-trial phase and generated no income. That mix limits the
              evidence for a recurring software expansion loop even though assisted-driving subscriptions and
              operational mileage are reported. The next diligence step is not another logo count: it is a
              customer-level bridge from order to delivery, active utilization, repeat purchase, paid software
              attachment, renewal, and contribution margin. Without that bridge, the investment case should credit
              demonstrated vehicle adoption and improving concentration while treating retention, software conversion,
              and customer economics as material open risks.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Delivery growth is not retention evidence
            body: >-
              The allocated sources do not disclose renewal, churn, contract duration, paid software cohorts, or
              customer-level economics, so vehicle delivery growth should not be converted into a retention assumption.
            calloutType: risk
            claimRefs:
              - CU005
              - CU013
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk ranking and financial-model exposure
        blocks:
          - type: paragraph
            body: >-
              The highest residual risk is the economics of scaling a capital-intensive truck manufacturer before
              software revenue is material. Independent reporting puts 2025 revenue at RMB3.96 billion but the annual
              loss at RMB649 million, while a separate 2025 account describes cumulative losses of RMB1.70 billion from
              2022 through the first half of 2025. At 30 June 2025, reported liabilities of RMB5.54 billion exceeded
              RMB3.92 billion of assets and cash and cash equivalents were RMB593 million. These are accounting and
              balance-sheet measures, not cash burn or runway. Gross margin improved from 0.4% in 2023 to 2.9% in the
              first half of 2025, but more than 99% of revenue still came from truck sales and smart-logistics solutions
              remained in free trial. The mitigation is disciplined manufacturing cost reduction and conversion of
              software trials into paid revenue; the kill criterion is sustained low-single-digit gross margin alongside
              continued losses or renewed dependence on external financing for ordinary operations.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR016
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR008
              - CR010
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR015
      - number: '7.2'
        title: Operational and dependency concentration
        blocks:
          - type: paragraph
            body: >-
              Scale has grown quickly, with multiple sources reporting 8,020 deliveries in 2025, but scale amplifies
              procurement, warranty, manufacturing, and service execution risk. In 2024 the top five suppliers
              reportedly represented 92% of procurement and the largest supplier more than 60%; the top five customers
              represented 51% of revenue and the largest nearly 25%. DeepWay also relied on contract manufacturing by
              Jianghuai and Shandong Leichi and lacked its own production license in the cited prospectus-based account.
              Baidu's technology license accelerates development but creates a strategic dependency around a core
              differentiator. Mitigation should therefore be tested through binding dual-source plans, supplier-change
              qualification, enforceable OEM capacity and quality terms, software escrow or continuity rights, and
              customer-concentration reporting. A loss of Baidu rights, a material OEM interruption, or failure to
              reduce single- supplier exposure before the next major volume step would break the operating thesis.
            claimRefs:
              - CR001
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
      - number: '7.3'
        title: Legal, regulatory, safety, and autonomy exposure
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports autonomous-driving test permits in four Chinese regions and commercial cargo
              pilots for platooning, but those facts do not establish unrestricted driverless commercial approval. A
              2021 Baidu release said the first truck generation was designed to reach L4 capability on highway routes
              between 2024 and 2026; later evidence still emphasizes L2 systems, permits, and pilots. That gap is a
              commercialization and execution risk rather than proof that the technology failed. The assigned pool
              contains no regulator, court, recall, or incident record sufficient to confirm the absence of litigation,
              enforcement, safety defects, cyber incidents, or overseas homologation barriers. Diligence must obtain
              permit-level scope, safety-case evidence, disengagement and incident logs, recall and warranty data,
              privacy and cybersecurity assessments, and country-by-country approvals. Any serious safety event, license
              suspension, inability to secure overseas homologation, or repeated slippage without paid autonomous
              deployments is a thesis-break trigger.
            claimRefs:
              - CR013
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.4'
        title: Monitoring plan and investment implications
        blocks:
          - type: paragraph
            body: >-
              The risk program should be milestone-based rather than narrative-based. Quarterly monitoring should
              separate truck gross margin, warranty cost, working-capital absorption, paid software revenue,
              concentration by customer and supplier, OEM throughput, and safety events. Autonomy monitoring should
              distinguish test permits, supervised pilots, paid platooning operations, and driverless commercial
              authorization; kilometers alone are not proof of safe or profitable deployment. International expansion
              should be credited only after homologation, local service coverage, and repeat paid deliveries are
              documented. The market itself is concentrated: one 2025 account said the five largest vendors held 71% of
              China's new-energy heavy-truck market, which raises the threshold for DeepWay's cost and service
              differentiation. The investment implication is to retain a high residual risk rating until margin,
              dependency, regulatory, and recurring-software evidence improves together, rather than treating the
              planned IPO or pre-IPO financing as proof of adequate runway.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Capital raised is not runway
            body: >-
              The reported US$310 million pre-IPO financing supports operations, technology, and overseas expansion, but
              no public cash-flow bridge in the assigned evidence establishes how long that capital lasts.
            calloutType: risk
            claimRefs:
              - CR016
          - type: callout
            title: Primary diligence must precede risk reduction
            body: >-
              Keep residual risk high until contract, permit, safety, concentration, warranty, and cash-flow evidence is
              obtained directly; press coverage and issuer-linked descriptions cannot close those gaps.
            calloutType: recommendation
            claimRefs:
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision frame and recommendation
        blocks:
          - type: paragraph
            body: >-
              The investment case combines real commercial scale with weak price discovery. Independent coverage reports
              roughly 6,400 truck deliveries by June 2025 and approximately RMB 1.5 billion of first-half 2025 revenue,
              while multiple reports confirm a $310 million pre-IPO financing phase in 2026. Those facts establish
              operating momentum and access to capital, not investability at any price. DeepWay also remained
              loss-making, and the retained evidence does not disclose the latest post-money valuation or security
              terms. The appropriate public-evidence decision is therefore track/research-more rather than invest now.
              Confidence is medium-low and risk is high because the recommendation is directionally supported but cannot
              be converted into a risk-adjusted entry price or target return.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV007
              - CV008
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV008
              - CV016
      - number: '8.2'
        title: Financing context, price opacity, and dilution
        blocks:
          - type: paragraph
            body: >-
              The second 2026 pre-IPO tranche brought the phase total to $310 million, with Stone Venture or Stone
              Capital, NGS Super, Xiamen Guosheng Fund, ABC Impact, and Nanjing Ronghe Capital named across coverage.
              Reporting says the proceeds are intended for operations, autonomous-driving research, and international
              expansion; funding raised is not the same as unrestricted cash available. A November 2025 article reported
              an August 2025 share price near RMB 38.94 and an implied valuation above RMB 5.4 billion, but that
              historical mark does not establish the 2026 round price. Aggregate funding databases also diverge sharply
              because of different coverage and vintages. Current ownership, fully diluted share count, liquidation
              preferences, anti-dilution rights, debt, and IPO primary-versus-secondary mix remain open diligence items.
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV012
      - number: '8.3'
        title: Scenario discipline and comparable evidence
        blocks:
          - type: paragraph
            body: >-
              Public comparables provide context but not a valuation answer. Multiples selected a mixed set of
              passenger-EV, industrial, and private vehicle companies and displayed revenue multiples spanning 0.8x to
              13.1x; Tracxn instead emphasized autonomous-trucking and commercial-vehicle peers. That dispersion
              reflects materially different margin structures, technology exposure, geography, capital intensity, and
              maturity. Applying any one multiple to DeepWay's revenue would create false precision before normalized
              revenue, gross margin, net cash, dilution, and recurring software economics are known. The bull, base, and
              bear cases below are therefore conditional underwriting cases rather than price targets, and no
              quantitative probability is assigned.
            claimRefs:
              - CV004
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV006
              - CV007
              - CV008
              - CV012
              - CV014
              - CV016
      - number: '8.4'
        title: Exit readiness and thesis-break diligence
        blocks:
          - type: paragraph
            body: >-
              A planned Hong Kong Chapter 18C listing is an exit pathway, not evidence of completed liquidity. The 2026
              financing broadens the investor base and may bridge the company toward listing, while Baidu's 17.28%
              reported stake and Apollo relationship remain strategically relevant. However, the public record does not
              establish IPO timing, offer valuation, lockups, preference conversion, or the split between primary
              proceeds and shareholder liquidity. The recommendation should improve only after audited current
              financials show narrowing losses, disclosed software economics demonstrate recurring value beyond truck
              sales, and round or IPO terms permit a normalized return analysis. The thesis breaks if losses and
              balance-sheet pressure persist without credible margin expansion, or if financing terms transfer
              disproportionate downside to new investors.
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price discipline is the decision
            body: >-
              Track DeepWay, but do not convert the $310 million financing headline into an implied valuation, cash
              balance, or return case. Require the current capitalization table, preference stack, net cash, audited
              2026 performance, and IPO terms before underwriting an entry.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV008
              - CV016
