  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              DeepWay's core market is purpose-built battery-electric heavy-duty trucks for highway freight fleets, with
              intelligent-driving capability embedded in the vehicle. That boundary excludes passenger autonomy, light
              commercial vehicles, stand-alone robotaxi software, and charging infrastructure not bundled with a truck
              sale. It also prevents the broader autonomous-driving opportunity from being treated as DeepWay's current
              addressable revenue pool: more than 99% of reported revenue has come from truck sales. The status quo is
              the diesel heavy truck, and the buyer's economic comparison is anchored in fuel and driver costs rather
              than software features alone. Public pricing of CNY 470,000-700,000 including VAT confirms an enterprise
              capital-purchase motion aimed at logistics and bulk-transport operators.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM013
      - number: '2.2'
        title: Multiple sizing lenses
        blocks:
          - type: paragraph
            body: >-
              The strongest available top-down lens is China's new-energy heavy-truck market, not global autonomous
              freight. One secondary source reports 231,100 units sold in 2025, up 182%, with 28.89% penetration. Two
              published 2030 outlooks are directionally consistent but not identical: one points to more than 50%
              penetration and a market above CNY 250 billion, while a CIC forecast cited by another publisher gives
              53.5% penetration and CNY 255.8 billion at a 33.3% CAGR. These are forecasts relayed through secondary
              outlets, so they define a range rather than an audited TAM. DeepWay's 8,020 deliveries and approximately
              3.4% share in 2025 provide a bottom-up company anchor, but do not establish a durable SOM.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM016
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is generally a fleet owner, logistics enterprise, or industrial transport contractor;
              drivers and dispatch teams are the users, while procurement or operations leaders control the vehicle and
              energy budget. Evidence spans express and third-party logistics customers as well as an industrial
              deployment: DeepWay delivered 100 trucks to Yuanchi New Energy for logistics serving Baowu Steel's Taiyuan
              operation. Adoption is therefore route-led. Fleets first validate payload, range, charging or swapping
              access, uptime, safety, and total cost on repeatable lanes, then expand vehicle counts. Reported paid
              take-up above 30% for intelligent driving functions suggests a software upsell path, but the evidence does
              not disclose price, cohort retention, or revenue contribution.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Electrification penetration, fleet pressure to reduce energy expense, and the possibility of lowering
              driver-related costs support adoption. Against those drivers, a 49-ton truck configuration with a reported
              300 km single-charge range makes route design and battery-swap access material gating factors rather than
              implementation details. Company-level economics are another constraint: 2025 revenue reached CNY 3.96
              billion, but net loss was CNY 649 million. Software monetization is also unresolved. One source says
              smart-logistics solutions were still in free trial through the first half of 2025, while later reporting
              says recurring subscription revenue had begun. Without software ARPU, renewal cohorts, contribution
              margin, or a reconciled launch date, valuation should be tied primarily to truck-market penetration and
              hardware economics, with software treated as upside rather than a proven market layer.
            claimRefs:
              - CM004
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Software TAM is not yet evidenced
            body: >-
              Public sources conflict on when paid recurring software revenue began and disclose neither ARPU nor
              retention, so a separate software SAM or SOM would create false precision.
            calloutType: risk
            claimRefs:
              - CM015
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and routes to market
        blocks:
          - type: paragraph
            body: >-
              DeepWay sits between electric-truck manufacturers and autonomous-freight technology vendors: it sells
              complete trucks today while offering three possible European routes—finished-vehicle export, production
              with a local manufacturer, or technology licensing to an established brand. That flexibility is
              strategically useful, but it is not yet equivalent to local presence. Management said DeepWay had no
              European base and still needed after-sales, charging, financing, and leasing partners. At the same 2026
              industry event, BYD described a European heavy-truck launch followed by local manufacturing, Sinotruk and
              SuperPanther highlighted Austrian assembly with Steyr Automotive, and Sany emphasized cooperation with
              Putzmeister. DeepWay therefore faces direct products, incumbent industrial networks, and a licensing
              alternative that could reduce capital intensity but also place customer ownership with partners. Reported
              sales of more than 13,000 trucks by April 2026 establish commercial scale, although Dealroom's broad
              valuation range is not a peer benchmark.
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP011
          - type: table
            tableRef: TP001
            claimRefs:
              - CP004
              - CP005
              - CP006
              - CP007
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP005
              - CP007
      - number: '3.2'
        title: Capability, product economics, and operating model
        blocks:
          - type: paragraph
            body: >-
              DeepWay's differentiation rests on forward-designed electric architecture, assisted-driving integration,
              and greater control of batteries, e-axles, and power electronics. Public specifications indicate
              meaningful product evolution: the 2021 Xingtu release described 300 kilometers at a full 49-ton load,
              while a 2026 report described roughly 400 kilometers at the same rated gross weight for the 600 kWh Star.
              Those figures are different generations and configurations, not a controlled competitor benchmark. A
              Gasgoo report also relayed a company demonstration claiming 10% lower energy use and 22% better charging
              efficiency than a converted electric truck; the absence of an independent test limits underwriting value.
              Pricing is clearer only for DeepWay: two sources place recommended vehicle prices at RMB 470,000–700,000
              including VAT. Peer transaction prices, discounts, battery ownership, financing, maintenance, and realized
              total cost of ownership were not disclosed, so the matrix marks unsupported comparisons as unknown rather
              than assigning winners.
            claimRefs:
              - CP008
              - CP013
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP014
              - CP015
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              The core competitive tension is that DeepWay is integrating vertically from a weaker purchasing position.
              Its international executive acknowledged that larger Chinese rivals use scale to price lower and that
              DeepWay has less negotiating power with suppliers, including battery vendors. The company does not own
              Chinese manufacturing plants and relies on contract manufacturers, while three-electric systems were
              reported to represent about 60% of manufacturing cost. Bringing those systems in-house may improve
              control, but it also concentrates execution risk in a low-margin hardware model. Software monetization is
              not yet proven: a 2025 report said smart-logistics solutions remained in free trial and generated no
              income. Even basic scale evidence requires reconciliation, with one source reporting about 6,400 vehicles
              in 2024 while another reports 3,002 deliveries. The defensible near-term moat is therefore integration and
              accumulated operating data, not demonstrated autonomous-driving superiority, exclusive distribution, or
              independently validated cost leadership.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP007
              - CP008
              - CP012
              - CP014
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale is the immediate moat test
            body: >-
              DeepWay's own executive says larger Chinese rivals price from greater scale and negotiate more strongly
              with battery suppliers, so vertical integration must offset a structural purchasing disadvantage before it
              can become a durable moat.
            calloutType: risk
            claimRefs:
              - CP001
              - CP002
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture is concentrated in truck hardware
        blocks:
          - type: paragraph
            body: >-
              DeepWay's disclosed revenue base is overwhelmingly transactional rather than recurring. New-energy
              heavy-truck sales represented more than 99% of revenue in the reported periods, parts contributed less
              than 1%, and smart logistics solutions were still offered on a free-trial basis without income. Public
              descriptions also mention vehicle-management, financing-support, and used-vehicle services, but no source
              allocates revenue to those activities. Reported retail prices of RMB 470,000-RMB 700,000 including VAT
              establish a list-price envelope, not realized average selling price, net revenue, or gross profit. The
              revenue quality therefore remains hardware-led and dependent on deliveries, with software and services
              representing unproven monetization options rather than current recurring revenue.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI016
          - type: table
            tableRef: TI001
            claimRefs:
              - CI003
              - CI004
              - CI016
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI013
              - CI015
              - CI016
      - number: '4.2'
        title: Pricing and go-to-market evidence is public only at the edges
        blocks:
          - type: paragraph
            body: >-
              The available evidence points to direct fleet sales and partnership-led expansion. DeepWay's first
              delivered vehicles went to XuRi DongSheng for CATL logistics work, showing an enterprise deployment route,
              while its European plan contemplates licensing technology to established local brands and eventually
              manufacturing locally. Neither route discloses sales-cycle length, channel margin, customer acquisition
              cost, payment terms, discounts, or renewal economics. An aggregated source reports an ADAS subscription
              rate above 30% alongside more than 6,000 L2-equipped vehicle deliveries, but it does not define the
              subscription-rate denominator or disclose price and recurring revenue. Those limitations make the evidence
              useful for mapping monetization mechanisms, not for underwriting sales efficiency.
            claimRefs:
              - CI013
              - CI014
              - CI015
          - type: table
            tableRef: TI002
            claimRefs:
              - CI005
              - CI013
              - CI014
              - CI015
      - number: '4.3'
        title: Scale is rising faster than demonstrated operating leverage
        blocks:
          - type: paragraph
            body: >-
              Reported revenue rose from RMB 426 million in 2023 to RMB 1.97 billion in 2024, and first-half 2025
              revenue reached RMB 1.51 billion, up 97.6% year over year. Deliveries also progressed from 509 units in
              2023 to 3,002 in 2024 and 8,020 in 2025. That scale has not yet produced profitability: one independent
              report says DeepWay remained unprofitable after more than 12,000 cumulative deliveries, while another
              reports RMB 1.70 billion of cumulative accounting losses from 2022 through first-half 2025. R&D remained
              substantial, and management's planned vertical integration targets three-electric systems that reportedly
              represent about 60% of manufacturing cost. Public data still omit gross margin, warranty burden, battery
              procurement economics, and factory capex, so the margin path cannot be quantified.
            claimRefs:
              - CI001
              - CI002
              - CI006
              - CI007
              - CI008
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI008
              - CI009
              - CI010
              - CI011
      - number: '4.4'
        title: Capital adequacy cannot be reduced to a public runway estimate
        blocks:
          - type: paragraph
            body: >-
              At June 30, 2025, reported liabilities of RMB 5.54 billion exceeded assets of RMB 3.92 billion, while cash
              and cash equivalents were RMB 593 million. Those figures show balance-sheet strain, but accounting losses
              are not cash burn and funding raised is not cash available. The public record does not disclose operating
              cash flow, committed factory capex, working-capital seasonality, debt maturities, project-finance
              obligations, or restricted cash, so a precise runway would be invented. The financial verdict is therefore
              mixed: delivery and revenue momentum demonstrate commercial traction, but revenue remains low-diversity
              hardware income, software monetization is nascent, and the cost of reaching durable margin is
              unquantified. Underwriting requires management accounts, bank statements, debt schedules, cohort-level
              pricing, and a reconciled cash plan.
            claimRefs:
              - CI003
              - CI004
              - CI007
              - CI008
              - CI009
              - CI010
              - CI012
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not equate accounting loss with cash burn
            body: >-
              RMB 593 million of reported cash cannot support a reliable runway calculation without operating cash flow,
              working-capital, capex, debt-service, and restricted-cash data.
            calloutType: risk
            claimRefs:
              - CI008
              - CI009
              - CI010
          - type: callout
            title: Software upside is not yet demonstrated revenue quality
            body: >-
              ADAS adoption and smart-logistics trials indicate monetization surfaces, but public sources do not
              establish ARPU, renewals, recognized software revenue, or margin.
            calloutType: insight
            claimRefs:
              - CI004
              - CI013
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product lines and customer workflow
        blocks:
          - type: paragraph
            body: >-
              DeepWay's public product map centers on the Xingchen line for long-distance trunk and branch transport and
              the shorter-wheelbase Xingtu line for mid- and short-distance freight. This is a delivered hardware
              business rather than a software-only autonomy proposition: the first Xingchen fleet was handed over in May
              2023 for logistics supporting CATL, while later sources describe Xingchen II and Xingtu as the current
              vehicle families. The customer workflow joins truck procurement, route-specific energy configuration,
              assisted highway driving, and fleet monitoring. The evidence does not establish that every named
              configuration is available in every geography, and English-language sources render model and system names
              inconsistently. Therefore, the matrix below treats use-case coverage as reported positioning rather than a
              complete SKU catalog.
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE013
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE008
              - CE010
              - CE016
      - number: '5.2'
        title: Architecture, control stack, and dependencies
        blocks:
          - type: paragraph
            body: >-
              The architecture is vertically integrated at the vehicle layer but externally dependent at the autonomy
              foundation. DeepWay claims a forward-designed battery-chassis platform, cross-domain electronic/electrical
              architecture, a 450 kWh pack, and rapid battery swapping; it also reports in-house battery,
              electric-drive-axle, and electronic-control capabilities. Above the vehicle sits the Tianji driving matrix
              and Tianshu fleet-operations layer. Baidu is a strategic dependency rather than an independent technology
              benchmark: an independent report describes an exclusive commercial-vehicle white-box license that lets
              DeepWay modify Apollo source code. This access may accelerate development, but public evidence does not
              disclose license durability, change-of-control terms, compute hardware sourcing, or the division of safety
              responsibility between Baidu and DeepWay.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
              - CE014
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
              - CE014
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE011
              - CE014
      - number: '5.3'
        title: Maturity, safety, and roadmap risk
        blocks:
          - type: paragraph
            body: >-
              Product maturity is uneven across layers. Vehicle delivery and L2 assisted driving have the clearest
              evidence, while platooning and single-vehicle L4 remain a progressive roadmap. The 2021 launch release
              targeted L4 capability between 2024 and 2026, but newer descriptions still distinguish standard L2
              assistance from future platooning and unmanned operation; the older date target should not be treated as
              proof of current L4 commercialization. A secondary reference reports ISO 21448 process certification, yet
              the assigned evidence provides no independent safety-case audit, disengagement data, recall history,
              uptime series, penetration test, privacy assessment, or incident register. Likewise, the absence of a
              recorded public incident in this pool is not evidence that no incident occurred. Investment diligence
              should condition any autonomy premium on primary documentation and fleet-level operating data.
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE012
              - CE015
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: L4 remains a diligence milestone, not a verified current capability
            body: >-
              Public sources show a historical L4 target and a current progression from standard L2 toward platooning
              and single-vehicle autonomy, but not independently verified production-scale L4 operation.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE009
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and buying surface
        blocks:
          - type: paragraph
            body: >-
              DeepWay is principally a business-to-business vehicle vendor serving logistics and supply-chain operators,
              with Bitauto additionally describing bulk-transport clients as a target segment. Public material frames
              the core purchase around an intelligent electric heavy truck for freight operations, while Dealroom
              reports an adjacent service layer spanning vehicle and driver management, financing support, and
              used-vehicle disposal. That combination suggests a buying process involving fleet operations, finance, and
              asset management rather than an individual driver alone. However, the allocated sources do not identify
              the payer, procurement owner, contract term, or revenue contribution by geography, route type, fleet size,
              or vertical. The segmentation is therefore useful for locating the buyer problem, but it is not a
              revenue-quality segmentation.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU012
          - type: table
            tableRef: TU001
            claimRefs:
