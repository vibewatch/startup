  - id: TV003
    title: Bull, base, and bear underwriting cases
    columns:
      - Case
      - Evidence-backed assumptions
      - Valuation and return logic
      - Probability signal
      - Decision trigger
    rows:
      - - Bull
        - >-
          Delivery scale converts into materially better margins; paid autonomy expands; the 2026 financing supports
          commercialization through IPO.
        - >-
          No numeric public-evidence range is supportable; test an upper bound only after normalized recurring revenue
          and post-money capitalization are disclosed.
        - Do not assign a probability until audited margin and subscription cohorts are available.
        - Reconsider an investment after verified software economics, narrowing losses, and non-punitive terms.
      - - Base
        - >-
          Truck revenue continues growing while losses narrow gradually and autonomy remains an emerging rather than
          dominant revenue stream.
        - >-
          Use the historical above-RMB 5.4 billion mark only as context, then rebase on current net cash, dilution, and
          industrial-quality peer economics.
        - Current evidence supports monitoring, not a quantified probability.
        - Maintain track status until current round and IPO terms permit a return calculation.
      - - Bear
        - >-
          Losses persist, balance-sheet pressure remains, and follow-on capital or IPO access comes with adverse
          dilution or preferences.
        - No reliable equity floor is public because net debt and the preference waterfall are unknown.
        - Risk rises if audited results fail to show margin improvement or if listing timing slips.
        - Pass if terms subordinate new money or if liquidity cannot cover the operating plan.
    notes: >-
      Scenarios are conditional diligence cases, not forecasts; no valuation range, probability, hold period, or return
      target is asserted without missing transaction and financial inputs.
    claimRefs:
      - CV003
