          label: Series A
          detail: Public profiles report a RMB 460 million Series A financing.
          tone: positive
          claimRefs:
            - CO011
        - date: 2023-03
          label: Series A+
          detail: Public profiles report a RMB 770 million Series A+ financing.
          tone: positive
          claimRefs:
            - CO011
        - date: 2023-05
          label: First batch delivery
          detail: The first batch of intelligent electric heavy trucks was delivered in Hefei for logistics operations.
          tone: positive
          claimRefs:
            - CO016
        - date: 2023-11
          label: Hefei headquarters
          detail: Public profiles place the headquarters move to Hefei in November 2023.
          tone: neutral
          claimRefs:
            - CO002
        - date: 2024-12
