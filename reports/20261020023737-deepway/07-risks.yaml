callouts:
  - calloutType: "risk"
    title: "Capital raised is not runway"
    body: >-
      The reported US$310 million pre-IPO financing supports operations, technology,
      and overseas expansion, but no public cash-flow bridge in the assigned evidence
      establishes how long that capital lasts.
    claimRefs: [CR016]
  - calloutType: "recommendation"
    title: "Primary diligence must precede risk reduction"
    body: >-
      Keep residual risk high until contract, permit, safety, concentration, warranty,
      and cash-flow evidence is obtained directly; press coverage and issuer-linked
      descriptions cannot close those gaps.
    claimRefs: [CR005, CR006, CR009, CR010, CR011, CR012, CR014]
