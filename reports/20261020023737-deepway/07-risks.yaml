company:
  name: "DeepWay"
chapter:
  number: 7
  title: "Risks"
  summary: >-
    DeepWay's principal investment risks are financial-model fragility, concentrated
    suppliers and customers, outsourced licensed production, and an autonomy roadmap
    whose commercial proof remains behind the original ambition. Public evidence shows
    rapid delivery growth, but it does not close legal, safety, cyber, or overseas
    homologation diligence.
sections:
  - id: "risk-ranking-and-financial-model"
    title: "Risk ranking and financial-model exposure"
    body: >-
      The highest residual risk is the economics of scaling a capital-intensive truck
      manufacturer before software revenue is material. Independent reporting puts
      2025 revenue at RMB3.96 billion but the annual loss at RMB649 million, while a
      separate 2025 account describes cumulative losses of RMB1.70 billion from 2022
      through the first half of 2025. At 30 June 2025, reported liabilities of RMB5.54
      billion exceeded RMB3.92 billion of assets and cash and cash equivalents were
      RMB593 million. These are accounting and balance-sheet measures, not cash burn or
      runway. Gross margin improved from 0.4% in 2023 to 2.9% in the first half of 2025,
      but more than 99% of revenue still came from truck sales and smart-logistics
      solutions remained in free trial. The mitigation is disciplined manufacturing
      cost reduction and conversion of software trials into paid revenue; the kill
      criterion is sustained low-single-digit gross margin alongside continued losses
      or renewed dependence on external financing for ordinary operations.
    claimRefs: [CR002, CR003, CR004, CR005, CR006, CR007, CR008, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: "operational-and-dependency-concentration"
    title: "Operational and dependency concentration"
    body: >-
      Scale has grown quickly, with multiple sources reporting 8,020 deliveries in
      2025, but scale amplifies procurement, warranty, manufacturing, and service
      execution risk. In 2024 the top five suppliers reportedly represented 92% of
      procurement and the largest supplier more than 60%; the top five customers
      represented 51% of revenue and the largest nearly 25%. DeepWay also relied on
      contract manufacturing by Jianghuai and Shandong Leichi and lacked its own
      production license in the cited prospectus-based account. Baidu's technology
      license accelerates development but creates a strategic dependency around a core
      differentiator. Mitigation should therefore be tested through binding dual-source
      plans, supplier-change qualification, enforceable OEM capacity and quality terms,
      software escrow or continuity rights, and customer-concentration reporting. A
      loss of Baidu rights, a material OEM interruption, or failure to reduce single-
      supplier exposure before the next major volume step would break the operating
      thesis.
    claimRefs: [CR001, CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
  - id: "legal-regulatory-and-autonomy"
    title: "Legal, regulatory, safety, and autonomy exposure"
    body: >-
      Public evidence supports autonomous-driving test permits in four Chinese regions
      and commercial cargo pilots for platooning, but those facts do not establish
      unrestricted driverless commercial approval. A 2021 Baidu release said the first
      truck generation was designed to reach L4 capability on highway routes between
      2024 and 2026; later evidence still emphasizes L2 systems, permits, and pilots.
      That gap is a commercialization and execution risk rather than proof that the
      technology failed. The assigned pool contains no regulator, court, recall, or
      incident record sufficient to confirm the absence of litigation, enforcement,
      safety defects, cyber incidents, or overseas homologation barriers. Diligence
      must obtain permit-level scope, safety-case evidence, disengagement and incident
      logs, recall and warranty data, privacy and cybersecurity assessments, and
      country-by-country approvals. Any serious safety event, license suspension,
      inability to secure overseas homologation, or repeated slippage without paid
      autonomous deployments is a thesis-break trigger.
    claimRefs: [CR013, CR014]
    tableRefs: [TR001]
  - id: "monitoring-and-investment-implications"
    title: "Monitoring plan and investment implications"
    body: >-
      The risk program should be milestone-based rather than narrative-based. Quarterly
      monitoring should separate truck gross margin, warranty cost, working-capital
      absorption, paid software revenue, concentration by customer and supplier, OEM
      throughput, and safety events. Autonomy monitoring should distinguish test
      permits, supervised pilots, paid platooning operations, and driverless commercial
      authorization; kilometers alone are not proof of safe or profitable deployment.
      International expansion should be credited only after homologation, local service
      coverage, and repeat paid deliveries are documented. The market itself is
      concentrated: one 2025 account said the five largest vendors held 71% of China's
      new-energy heavy-truck market, which raises the threshold for DeepWay's cost and
      service differentiation. The investment implication is to retain a high residual
      risk rating until margin, dependency, regulatory, and recurring-software evidence
      improves together, rather than treating the planned IPO or pre-IPO financing as
      proof of adequate runway.
    claimRefs: [CR008, CR009, CR010, CR011, CR013, CR014, CR015, CR016]
