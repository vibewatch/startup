      - Diligence gap
    rows:
      - [Xingchen / Xingchen II, Long-haul logistics fleet, Batch delivery since 2023; later-generation product reported, Forward-designed electric heavy-truck platform, Current configuration and region-by-region homologation]
      - [Xingtu, Mid- and short-distance freight fleet, Launched in 2025 according to secondary sources, Short-wheelbase route-specific configuration, Independent operating-cost and payload benchmark]
      - [Tianji driving matrix, Fleet driver and operations manager, L2 assistance reported as standard; platooning and solo autonomy are progressive tracks, Shared progression from assistance to higher automation, Production deployment count and validated operational-design domain]
      - [Tianshu operations platform, Fleet operations manager, Publicly described platform; monetization not established in the cited financial period, IoT data and charging or operations optimization, Active-user count service levels and paid conversion]
    notes: >-
      Product names and maturity are normalized from the assigned sources; translations vary, and
      the table does not imply that all configurations are simultaneously offered in every market.
    claimRefs: [CE001, CE002, CE008, CE009, CE010, CE012]
  - id: TE002
    title: Workflow and use-case evidence
    columns:
      - User job
      - Current workflow
      - DeepWay solution
      - Measurable evidence
      - Limitation
    rows:
      - [Long-haul freight, Procure truck and plan charging or swapping around trunk routes, Xingchen electric tractor with route energy options, First fleet delivered for CATL logistics in 2023, No independent fleet-wide uptime or cost series]
      - [Mid-distance collection and distribution, Match vehicle dimensions and battery capacity to shorter routes, Xingtu short-wheelbase product, Product launch and positioning reported by secondary sources, No route-level utilization or realized efficiency dataset]
      - [Assisted highway driving, Driver remains responsible while using assistance functions, Standard L2 functions within the Tianji matrix, Lane keeping following and adaptive speed functions are reported, No independent disengagement or intervention rate]
      - [Fleet monitoring and control, Operations staff coordinate vehicles and industrial workflows, Cockpit SOA V2X and cloud operations layers, Real-time monitoring and industrial IoT integration reported at first delivery, No public service-level availability or cybersecurity audit]
    notes: >-
      Benefits are limited to reported functions and observed deployment context; unavailable
      denominators and independent outcome measurements are stated explicitly.
    claimRefs: [CE002, CE008, CE010, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns:
      - Layer or component
      - Role
      - Key dependency
      - Principal risk
    rows:
      - [Forward-designed vehicle platform, Carries battery drivetrain sensors and freight payload, DeepWay vehicle engineering and manufacturing partners, Durability and maintenance performance are not independently benchmarked]
      - [Three-electric systems, Battery electric drive and electronic control, Internal component development plus cell and semiconductor supply, Cost safety yield and supplier concentration are undisclosed]
      - [Apollo and Tianji intelligence, Perception planning driver assistance and autonomy progression, Baidu white-box commercial-vehicle license and onboard compute, License continuity safety accountability and L4 validation]
      - [Tianshu and V2X operations, Fleet data monitoring charging planning and industrial integration, Connectivity cloud algorithms and customer systems, Uptime privacy cyber controls and integration effort are not public]
    notes: >-
      Architecture is reconstructed only from assigned public descriptions; undisclosed interfaces,
      suppliers, safety mechanisms, and contractual dependencies remain diligence items.
    claimRefs: [CE005, CE006, CE009, CE010, CE011, CE014, CE016]
figures:
  - id: FE001
    title: Product maturity and dependency stack
    type: stack
    summary: >-
      The commercially evidenced base is delivered vehicle hardware and L2 assistance, while upper
      autonomy layers depend on Baidu technology and remain less independently verified.
    data:
      layers:
        - label: Freight workflow
          detail: Long-haul and mid-distance fleet operations
          items:
            - Xingchen trunk and branch transport
            - Xingtu mid- and short-distance transport
        - label: Vehicle platform
          detail: Purpose-built electric heavy-truck architecture
          items:
            - Integrated battery and chassis
            - Cross-domain electronic and electrical architecture
        - label: Energy and propulsion
          detail: Three-electric systems and route energy options
          items:
            - Battery and electric drive
            - Electronic control and battery swapping
        - label: Assisted driving
          detail: Most mature publicly described intelligence layer
          items:
            - Tianji Suixing L2 assistance
            - Sensor and onboard-compute stack
        - label: Higher automation
          detail: Progressive development rather than verified fleet-wide L4
          items:
            - Tianji Yanxing platooning
            - Tianji Duxing single-vehicle autonomy
        - label: Operations and external foundation
          detail: Fleet software above a licensed autonomy base
          items:
            - Tianshu IoT operations platform
            - Baidu Apollo white-box technology dependency
    approximationNotes: >-
      Layer order represents functional dependency and public maturity, not cost, value, or
      technical completeness; it is not a quantitative readiness scale.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011, CE014]
