artifact: product-tech
slug: deepway
runDate: 2026-10-20
company:
  name: DeepWay
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    DeepWay has moved beyond a concept vehicle into delivered, purpose-built electric heavy trucks,
    with a product stack spanning vehicle hardware, self-developed three-electric components,
    assisted-driving software, and fleet operations. The strongest public evidence supports
    commercial L2-enabled products and a differentiated Baidu technology dependency; L4 maturity,
    fleet reliability, cybersecurity, and independently benchmarked efficiency remain open.
sections:
  - id: product-lines-and-workflows
    title: Product lines and customer workflow
    body: >-
      DeepWay's public product map centers on the Xingchen line for long-distance trunk and branch
      transport and the shorter-wheelbase Xingtu line for mid- and short-distance freight. This is
      a delivered hardware business rather than a software-only autonomy proposition: the first
      Xingchen fleet was handed over in May 2023 for logistics supporting CATL, while later sources
      describe Xingchen II and Xingtu as the current vehicle families. The customer workflow joins
      truck procurement, route-specific energy configuration, assisted highway driving, and fleet
      monitoring. The evidence does not establish that every named configuration is available in
      every geography, and English-language sources render model and system names inconsistently.
      Therefore, the matrix below treats use-case coverage as reported positioning rather than a
      complete SKU catalog.
    claimRefs: [CE001, CE002, CE008, CE013]
    tableRefs: [TE001, TE002]
  - id: architecture-and-dependencies
    title: Architecture, control stack, and dependencies
    body: >-
      The architecture is vertically integrated at the vehicle layer but externally dependent at
      the autonomy foundation. DeepWay claims a forward-designed battery-chassis platform,
      cross-domain electronic/electrical architecture, a 450 kWh pack, and rapid battery swapping;
      it also reports in-house battery, electric-drive-axle, and electronic-control capabilities.
      Above the vehicle sits the Tianji driving matrix and Tianshu fleet-operations layer. Baidu is
      a strategic dependency rather than an independent technology benchmark: an independent
      report describes an exclusive commercial-vehicle white-box license that lets DeepWay modify
      Apollo source code. This access may accelerate development, but public evidence does not
      disclose license durability, change-of-control terms, compute hardware sourcing, or the
      division of safety responsibility between Baidu and DeepWay.
    claimRefs: [CE003, CE004, CE005, CE006, CE009, CE010, CE011, CE014, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-safety-and-roadmap
    title: Maturity, safety, and roadmap risk
    body: >-
      Product maturity is uneven across layers. Vehicle delivery and L2 assisted driving have the
      clearest evidence, while platooning and single-vehicle L4 remain a progressive roadmap. The
      2021 launch release targeted L4 capability between 2024 and 2026, but newer descriptions still
      distinguish standard L2 assistance from future platooning and unmanned operation; the older
      date target should not be treated as proof of current L4 commercialization. A secondary
      reference reports ISO 21448 process certification, yet the assigned evidence provides no
      independent safety-case audit, disengagement data, recall history, uptime series, penetration
      test, privacy assessment, or incident register. Likewise, the absence of a recorded public
      incident in this pool is not evidence that no incident occurred. Investment diligence should
      condition any autonomy premium on primary documentation and fleet-level operating data.
    claimRefs: [CE007, CE008, CE009, CE012, CE015]
callouts:
  - calloutType: risk
    title: L4 remains a diligence milestone, not a verified current capability
    body: >-
      Public sources show a historical L4 target and a current progression from standard L2 toward
      platooning and single-vehicle autonomy, but not independently verified production-scale L4
      operation.
    claimRefs: [CE007, CE008, CE009]
