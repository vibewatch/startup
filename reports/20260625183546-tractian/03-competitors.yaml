callouts:
  - calloutType: risk
    title: Augury's CMMS Partnership Strategy Narrows Tractian's Integration Moat
    body: >-
      Augury has announced integrations with MaintainX and Limble—the same CMMS platforms Tractian
      integrates with—creating a functional near-equivalent to Tractian's sensor-plus-CMMS bundle from
      the enterprise buyer's perspective. If Augury deepens these partnerships to co-branded or bundled
      subscriptions, Tractian's claim that "competitors stop at detection" becomes materially weaker.
      Diligence should assess whether Augury is building toward a native CMMS layer through acquisition
      or deeper product partnership.
    claimRefs:
      - CP005
      - CP034

  - calloutType: insight
    title: Tractian Occupies a Unique Quadrant But Faces Pincer Competition
    body: >-
      No single direct competitor today bundles proprietary hazardous-location-rated sensors, a full
      CMMS, and fault-specific AI diagnostics in one subscription. That combination is Tractian's
      structural advantage. But it faces pincer pressure from two directions simultaneously: Augury
      moving right on the capability axis by deepening CMMS integrations, and Fiix/MaintainX/IBM
      Maximo moving up on the AI axis by adding AI-powered PdM modules. The window for Tractian's
      unique position may compress faster in enterprise accounts than in mid-market factories.
    claimRefs:
      - CP001
      - CP006
      - CP013
      - CP030

  - calloutType: assumption
    title: Multi-Homing Risk Is Unquantified
    body: >-
      Public evidence does not confirm or deny whether large enterprise customers deploy both Tractian
      and Augury simultaneously (e.g., Augury on critical assets, Tractian on balance-of-plant). If
      multi-homing is common, Tractian's per-customer revenue ceiling is lower than a single-vendor
      deployment would suggest, and the switching cost narrative weakens. This gap requires primary
      research with enterprise customers.
    claimRefs:
      - CP007
      - CP044

