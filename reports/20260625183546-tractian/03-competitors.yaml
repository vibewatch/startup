  - id: switching-costs-moat-and-displacement-risk
    title: Switching Costs, Lock-In, Moat Durability, and Displacement Risk
    body: >-
      Tractian's moat operates at two reinforcing layers. The first is hardware lock-in: the Smart Trac
      sensors are proprietary wireless devices whose data protocol feeds Tractian's cloud platform
      exclusively; replacing Tractian means physically removing and replacing sensors across potentially
      thousands of asset mount points. For a customer with 200 monitored assets, sensor re-deployment
      alone represents a multi-day installation project. The second layer is co-mingled CMMS and sensor
      data inside TracOS: asset histories, vibration baselines, FMEA records, and work order histories
      accumulate in Tractian's platform over time. Migrating away requires exporting both the CMMS
      dataset and the condition monitoring history—a process that is possible in principle (Tractian
      offers data export) but operationally costly and disruptive. IBM Maximo's installed base illustrates
      how powerful this data stickiness can be: enterprise EAM customers rarely migrate because years of
      customization, workflow configuration, and asset data are embedded in the platform.

      The most credible displacement vectors are, in descending probability. First, Augury's deepening
      CMMS partnerships (MaintainX, Limble) close the detection-to-execution gap that is Tractian's
      primary structural claim; if Augury adds a native or tightly co-branded CMMS layer, the moat
      narrows significantly. Second, Rockwell Automation's Fiix distribution advantage inside Rockwell
      OT/PLC-heavy factories could block Tractian's entry at those sites by bundling FactoryTalk Optix
      predictive triggers into the existing Fiix subscription. Third, established industrial OEMs
      (Emerson AMS, SKF) have field service contracts and reliability relationships at the largest
      plants that create an incumbent access advantage Tractian must overcome through direct
      relationship-building rather than digital-self-serve. Fourth, multi-homing risk—enterprise
      customers deploying Augury on critical assets and Tractian on balance-of-plant—is a real scenario
      without public evidence either way, leaving the per-customer revenue ceiling unclear. Tractian's
      published 15%-undercut guarantee against competitor CMMS quotes is an adverse margin signal,
      suggesting CMMS pricing is already contested and may compress further as the market matures. The
      data network effect (3.5B+ training samples) is a meaningful but not unassailable advantage:
      Augury reports 1.1B+ hours of machine monitoring data and has comparable asset-type coverage.
