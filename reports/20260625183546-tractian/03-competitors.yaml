  - id: direct-peers-ai-native-pdm
    title: Direct Peers — AI-Native Predictive Maintenance Vendors
    body: >-
      Augury is Tractian's most closely matched direct peer and the most richly funded AI-native
      predictive maintenance company in the market. Founded in Israel in 2011 by Gal Shaul and Saar
      Yoskovitz, Augury reached unicorn status in 2021 with a $180M Series E and added a $75M Series F
      in 2025, bringing its confirmed disclosed capital to at least $255M excluding earlier rounds. The
      platform monitors more than 300,000 machines across 40+ countries, drawing on 1.1 billion-plus
      hours of machine monitoring data. Augury's Machine Health product covers 200+ asset types and
      integrates with SAP PM, IBM Maximo, Infor EAM, MaintainX, and Limble through partner-built
      connectors, but it does not include a native CMMS or work order execution layer—customers must
      maintain a separate CMMS subscription to close the detection-to-action loop. Augury's Halo R4000
      sensor captures triaxial vibration, temperature, and magnetic flux but does not carry ATEX or
      IECEx certification for hazardous locations; very-low-RPM equipment (1–150 RPM) requires a
      separate Halo U2000 ultrasonic sensor, expanding the hardware footprint. Augury's diagnostic model
      combines algorithmic AI with human analyst review, which Tractian's comparison blog frames as a
      throughput constraint as asset counts scale. A Forrester Total Economic Impact study commissioned
      by Augury found 310% ROI and $20.1M net present value for a composite customer over three years,
      with payback in under six months. Critically, Augury claims it serves more Fortune 500 companies
      than any other vendor in the predictive maintenance space, a position that Tractian's 1,500-site
      customer count does not directly refute since Tractian's footprint skews toward mid-market
      manufacturers. This Fortune 500 penetration gap is the most important adverse competitive signal
      for Tractian in the enterprise segment.

      KCF Technologies reports that 1,000+ manufacturing locations trust its SMARTdiagnostics platform
      and that customers achieve on average 10x ROI, though independent verification of these figures is
      not publicly available. Like Augury, KCF does not include a native CMMS; multi-sensor coverage on
      a single asset requires its IoT HUB architecture. Waites delivers analyst-validated condition
      monitoring with IP69K and C1D1-rated sensors, operating entirely within the OT layer without PLC
      or IT access, validating every alert through CAT-certified vibration analysts before delivery.
      Siemens Senseye is a software-only platform—no proprietary sensors—that ingests data from
      existing historian and IoT infrastructure, adding a generative AI Copilot for conversational
      predictive analysis; it is strongest inside Siemens automation environments. Nanoprecise offers
      an AI-based predictive maintenance platform with SOC 2 Type II compliance and cellular or WiFi
      connectivity, targeting similar industrial verticals at smaller disclosed scale. Tractian's
      published comparison against these peers highlights the multi-modal Smart Trac Ultra sensor
      (IP69K, ATEX, IECEx, NFPA 70 C1D1, 64kHz vibration plus 200kHz ultrasound in one device) and
      the closed-loop Auto Diagnosis layer as structural differentiators, framing the absence of a
      native CMMS in every peer as the gap its bundle closes.
