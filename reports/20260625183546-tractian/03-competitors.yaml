  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Threat Vector
      - Severity
      - Mitigation or Diligence Ask
    rows:
      - - "Proprietary hardware lock-in (Smart Trac data feeds only Tractian)"
        - Customer migrates to open-protocol sensor; OEM standardizes on interoperable hardware
        - Medium
        - Verify customer contracts for sensor portability provisions; assess whether CSAM hardware export terms exist
      - - "Co-mingled CMMS + sensor data (TracOS + Smart Trac asset history)"
        - Switching requires simultaneous CMMS migration and sensor re-deployment; high friction
        - High (strength)
        - Confirm whether CMMS data export via open API is contractually guaranteed; audit migration path complexity
      - - "Augury closes CMMS gap via MaintainX and Limble partnerships"
        - If Augury and MaintainX deepen to a co-branded or bundled offering, Tractian's integration advantage erodes
        - High (threat)
        - Monitor Augury + MaintainX integration depth; track whether Augury licenses or acquires CMMS IP
      - - "Data network effect (3.5B+ training samples, AI improves with scale)"
        - Augury reports 1.1B+ hours of machine data; Emerson and SKF have decades of industrial data
        - Medium
        - Request independent diagnostic accuracy benchmarks; compare false-positive/negative rates across asset types
      - - "Fiix / Rockwell OT channel blocks Tractian entry at Rockwell-heavy factories"
        - Fiix bundled with Rockwell FactoryTalk Optix at Rockwell OT sites creates embedded PdM capability
        - Medium-High
        - Map target customer Rockwell OT footprint; assess win rate at Rockwell-heavy vs neutral sites
      - - "LTE/cellular connectivity (works without plant Wi-Fi)"
        - 5G private network and campus Wi-Fi expansion reduces LTE as a differentiator over time
        - Low-Medium
        - Track telco infrastructure deployment at key customer verticals; monitor competitor LTE adoption
      - - "15% undercut price guarantee on CMMS"
        - Explicit price guarantee signals CMMS commoditization and future margin compression
        - High (adverse)
        - Assess gross margin on CMMS tier alone; determine whether sensor revenue cross-subsidizes CMMS pricing
    notes: >-
      Severity ratings are based on publicly available evidence and competitive signals as of June 2026;
      they are not independently validated assessments. "High (strength)" indicates a moat claim with
      strong public evidence; "High (threat)" and "High (adverse)" indicate a competitive vector with
      material displacement potential. Diligence asks are forward-looking and require private data or
      direct customer interviews to resolve.
