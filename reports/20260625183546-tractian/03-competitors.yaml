  - id: cmms-incumbents-and-adjacent-platforms
    title: CMMS Incumbents and Adjacent Platforms
    body: >-
      The CMMS competitive layer is heavily fragmented with well over 200 products on G2 as of
      June 2026. Fiix, a subsidiary of Rockwell Automation (founded 1903), occupies the top G2 ranking
      in the predictive maintenance and CMMS categories by user volume, with 59% of its reviewer base
      in the mid-market. Fiix's core CMMS does not include proprietary IoT sensors, but the company
      added a FactoryTalk Optix integration to enable condition-based maintenance triggers from
      connected equipment, representing a partial convergence toward the Tractian model. Fiix's deeper
      strategic advantage comes from its parent company: Rockwell Automation's FactoryTalk portfolio
      is embedded in a large share of the North American plant-floor OT install base, giving Fiix a
      distribution and trust channel that Tractian must overcome through direct enterprise selling.

      IBM Maximo Application Suite is the dominant enterprise EAM platform, spanning maintenance
      management, asset inspection, field service, inventory optimization, reliability-centered
      maintenance, and condition-based maintenance. It starts at approximately $40,000 per year for
      the Essentials tier under a credit-based AppPoints licensing model and is available as SaaS,
      on-premises, or hybrid. Maximo's full EAM+APM+RCM stack has accumulated years of customization,
      asset data records, work order histories, and ERP integrations at enterprise customers, creating
      structural switching costs that protect its installed base from Tractian displacement. Maximo
      does not include proprietary sensors and requires separate sensor infrastructure or third-party
      integrations to enable predictive AI. For mid-market CMMS-only buyers, MaintainX prices its
      platform at $0 (Basic), $20/user/month (Essential), and $65/user/month (Premium), positioning
      itself as an AI-powered mobile-first CMMS for the deskless workforce without proprietary sensors
      at any self-service tier. UpKeep prices at $24/user/month (Essential) and $55/user/month
      (Premium) and offers basic IoT sensors (temperature, humidity, vibration, current) as a
      paid add-on, but those sensors lack IP69K or ATEX certification for hazardous locations. Limble
      CMMS offers a tiered SaaS model with IoT sensor integrations as an add-on and SOC II Type II
      compliance.

      Tractian's CMMS pricing—$60/user/month (Standard, minimum 5 users) and $100/user/month
      (Enterprise, minimum 10 users)—sits above MaintainX Premium ($65) and UpKeep Premium ($55) on a
      per-seat basis, with the premium justified by integrated AI diagnostics and Tractian's published
      15%-undercut guarantee against competitor CMMS quotes as an explicit pricing pressure signal.
      The CMMS market fragmentation documented on G2 confirms that differentiation on work order
      management alone is increasingly difficult; Tractian must consistently demonstrate that the
      sensor-to-CMMS-to-APM bundle justifies the combined subscription cost rather than competing
      on CMMS price alone.
