  topStrengths:
    - Integrated hardware, software, and AI stack gives Tractian a clearer product wedge than sensor-only or CMMS-only peers.
    - Public customer proof includes named enterprise accounts and quantified ROI from multi-site industrial deployments.
    - Series B and Series C financing plus Atlanta talent concentration support continued category expansion.
  topRisks:
    - ARR, gross margin, burn, and cap-table terms are not publicly disclosed, limiting valuation confidence.
    - Headcount, customer-scale, and valuation metrics vary by source and should be treated as ranges rather than hard facts.
    - Proprietary hardware dependence, supply-chain opacity, and product-adoption friction could pressure margin and expansion durability.
  unresolvedGaps:
