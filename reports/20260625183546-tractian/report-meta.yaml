  foundingLocation: São Paulo, Brazil
  headquarters: Atlanta, GA, USA
  productSummary: Smart Trac sensors, TracOS CMMS/EAM workflows, and Energy Trac monitoring packaged as an Industrial Copilot for predictive maintenance and reliability teams.
  customerFocus: Asset-heavy manufacturers across food and beverage, automotive, mining and metals, chemicals, oil and gas, agriculture, consumer goods, and pulp and paper.
  businessModel: Hardware-plus-software subscription and platform model with proprietary sensors, industrial monitoring, and maintenance workflow software sold directly to enterprise plants.
