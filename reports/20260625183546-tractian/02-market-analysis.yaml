  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: SAM and SOM sizing
      missingEvidence: >-
        Tractian's internal SAM definition by target factory count, average ARR per factory,
        and planned geographic expansion scope. No public source provides these figures.
      whyItMatters: >-
        Without Tractian's private SAM/SOM framing, any valuation model must rely on analyst
        top-down estimates with wide uncertainty ranges. The 2x divergence between Mordor and Allied
        top-down numbers compounds to large valuation swings without an anchor from the company.
      diligencePath: >-
        Request Tractian management's internal factory-count target by segment and region,
        current average contract value by factory size, and projected penetration rate assumptions
        for the Americas and international markets.
      relatedQuestionRefs:
        - QM024

    - type: missing-source
      severity: material
      topic: market sizing methodology
      missingEvidence: >-
        Full scope definitions and inclusion criteria for Mordor Intelligence's and Allied Market
        Research's predictive maintenance market reports; both are behind paywalls.
      whyItMatters: >-
        The 2x+ spread between the two analysts' projections cannot be reconciled without
        knowing whether each includes hardware, services, adjacent condition monitoring, or
        energy management in their PdM TAM boundary.
      diligencePath: >-
        Procure one or both full analyst reports; alternatively, request from Tractian whether
        their internal market sizing uses a purchased analyst study and which firm's methodology
        they consider most accurate.
      relatedQuestionRefs:
        - QM001
        - QM002
        - QM025

    - type: conflicting-data
      severity: material
      topic: market sizing
      missingEvidence: >-
        A reconciliation of Allied Market Research's $162.1B 2033 projection versus Mordor
        Intelligence's $82.17B 2031 projection; both firms appear credible but the scope
        difference is not publicly explained.
      whyItMatters: >-
        The estimate range is so wide that a financial model anchored to one number and evaluated
        against the other would show a 2–4x valuation swing. The market must be sized more
        precisely before a credible bull/bear case can be constructed.
      diligencePath: >-
        Ask Tractian for their own market sizing reference and scope; compare against published
        analyst definitions for CAGR base and terminal period; check MarketsandMarkets for a
        third data point that can triangulate between the two.
      relatedQuestionRefs:
        - QM002
        - QM015

    - type: missing-source
      severity: minor
      topic: predictive maintenance adoption failures
      missingEvidence: >-
        Documented cases of failed predictive maintenance deployments, customer churn due
        to implementation complexity, or AI model liability incidents. Most available sources
        are promotional or positive-outcome case studies.
      whyItMatters: >-
        Adoption constraints are quantified in aggregate by Mordor (−1.5% to −2.8% CAGR),
        but specific failure modes and post-deployment churn data are not publicly available,
        making it difficult to assess Tractian's retention profile independently.
      diligencePath: >-
        Review G2 negative reviews for Tractian and competitors; request customer NPS and
        churn data from Tractian; check industry forums and maintenance engineering communities
        for post-deployment case failures.
      relatedQuestionRefs:
        - QM023

    - type: stale
      severity: minor
      topic: Latin America market sizing
      missingEvidence: >-
        A standalone market sizing for predictive maintenance adoption in Latin America, particularly
        Brazil and Mexico where Tractian has significant presence.
      whyItMatters: >-
        Tractian's founding base and significant customer concentration is in LATAM; the Americas
        SAM calculation above uses North American weight as a proxy, which may materially understate
        or overstate the LATAM contribution.
      diligencePath: >-
        Request LATAM-specific segment data from analyst firms; check Brazilian manufacturing
        industry association (ABIMAQ) publications; ask Tractian for their internal LATAM factory-count
        estimate by industry vertical.
      relatedQuestionRefs:
        - QM024

