  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation
    body: >-
      The decision architecture for predictive maintenance technology is multi-layered, and conflating
      buyer, user, and payer leads to inaccurate sales-cycle assumptions. The end user is typically a
      reliability engineer or maintenance manager who lives with the operational pain: unplanned
      downtime, equipment failure root-cause analysis, and spare-parts forecasting. This person champions
      the technology internally, runs the pilot, and advocates for broader rollout. The economic buyer—
      the person who approves the purchase—is usually the plant director, VP of operations, or (for
      smaller sites) the plant manager. They care about total cost of ownership, integration with
      existing CMMS platforms, and measurable ROI in reduced downtime or labor hours. The payer in
      the budget model is typically the maintenance and operations budget for smaller deployments,
      but for enterprise-wide rollouts crossing capital thresholds, the CFO or COO becomes involved,
      and a business-case analysis comparing sensor subscription costs to avoided downtime costs
      becomes the approval gate. Segment behavior differs materially by industry. In automotive
      and food-and-beverage, just-in-time production means a single line stoppage has immediate
      upstream and downstream cost consequences, creating strong urgency for condition-based
      monitoring on rotating equipment. In mining, oil-and-gas, and chemicals, the assets are
      larger (turbines, compressors, pumps), more remote, and have replacement lead times measured
      in months rather than weeks. In these segments, the ROI is highest but the integration
      complexity is also greatest. In manufacturing SMEs, per-asset subscription pricing is the
      enabling pricing model: Mordor notes that SMEs pilot for $50–100 per asset per month and
      typically achieve positive ROI within 12–18 months. Tractian targets 1,500 US and global
      manufacturers and has CMRP/CAT-certified experts supporting installation and training, a
      service model that addresses the change-management and skills-gap constraints that hold back
      many mid-market buyers.
