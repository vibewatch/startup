company:
  name: Tractian
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Tractian operates at the intersection of predictive maintenance, industrial AI, condition monitoring,
    and CMMS—a cluster of markets estimated collectively above $80B in 2026 depending on scope. The
    predictive maintenance sub-market alone carries 30%+ CAGR projections from multiple analysts, though
    estimates diverge substantially: Mordor Intelligence places the 2026 global market at $18.9B while
    Allied Market Research's higher CAGR from a $10.1B 2023 base implies a markedly different 2033
    terminal size. Buyers and users are distinct—reliability engineers request and champion, while plant
    directors and CFOs approve budgets—and adoption is fastest in food-and-beverage, automotive, and
    mining where downtime costs are highest. Skilled-talent shortages, legacy-system integration
    complexity, and data-security concerns collectively suppress analyst growth rates by roughly 5–6
    percentage points and explain why factory penetration globally remains well below 20%.

sections:
  - id: market-boundary
    title: Market Boundary, Adjacencies, and Status-Quo Substitutes
    body: >-
      Tractian's addressable spending sits at the overlap of four distinct but reinforcing categories.
      The core is predictive maintenance: the deployment of sensors, data pipelines, and AI analytics
      to anticipate equipment failures before they occur, displacing both reactive repair (fix after
      failure) and calendar-based preventive maintenance (scheduled service regardless of actual
      condition). Adjacent to the core is the broader CMMS and EAM software layer, which manages work
      orders, asset inventories, and maintenance scheduling. Even companies that never deploy predictive
      sensors typically use CMMS software, and the trend in 2025–2026 is to embed condition-based
      intelligence directly into that workflow layer rather than run it as a separate system. A third
      adjacency is industrial energy management: as plants integrate energy consumption data with asset
      health data, the monitoring and analytics infrastructure overlaps significantly. The fourth
      adjacency is industrial AI broadly—the application of machine-learning inference to factory
      operations, of which predictive maintenance is the highest-ROI and most rapidly adopted use case.
      Status-quo substitutes that Tractian displaces include OEM service contracts (where the equipment
      manufacturer runs periodic inspection visits), manual vibration checks by reliability technicians
      (handheld or walk-around instruments), and time-based preventive maintenance schedules embedded
      in existing CMMS records. The boundary exclusions relevant to sizing are: pure ERP/MES systems
      with no maintenance module, general IT infrastructure, new equipment capital expenditure, and
      labor costs of maintenance technicians themselves. Tractian's platform spans the core and
      CMMS adjacency directly, and connects to the energy adjacency through its Energy Trac module,
      making the total boundary wider than a pure PdM-only sizing would suggest.
