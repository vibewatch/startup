callouts:
  - calloutType: risk
    title: Analyst Estimate Spread Is Too Wide to Anchor Valuation
    body: >-
      The 2x+ divergence between Mordor Intelligence's $82B 2031 projection and Allied Market
      Research's $162B 2033 projection for the predictive maintenance market means that any
      valuation model anchoring to a single analyst TAM figure imports significant uncertainty.
      Neither firm discloses full scope definitions publicly, and the difference in base-year
      size ($10.1B vs $14.09B in 2023–2025) suggests the two studies are measuring different
      segments. Investors should triangulate with bottom-up factory-count and per-factory ARR
      assumptions rather than relying on top-down analyst figures alone.
    claimRefs:
      - CM003
      - CM005

  - calloutType: insight
    title: SME Segment Is the Fastest-Growing Opportunity but Carries Churn Risk
    body: >-
      Mordor Intelligence identifies SMEs as growing at a 36.2% CAGR to 2031 versus large
      enterprises at a lower rate, with subscription pricing ($50–100/asset/month) as the
      enabling mechanism. This is directionally consistent with Tractian's go-to-market emphasis
      on ease of deployment and white-glove support. However, SME accounts typically have
      smaller total contract values, higher churn sensitivity to economic cycles, and less
      institutional ownership of the technology decision. The 2024 IoT hardware spending
      deceleration observed by IoT Analytics—driven partly by SME procurement freezes—is
      a preview of this risk.
    claimRefs:
      - CM010
      - CM018

  - calloutType: assumption
    title: SAM and SOM Estimates Cannot Be Isolated from Public Data
    body: >-
