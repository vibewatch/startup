  - id: named-customer-proof
    title: Named Customer Proof and Deployment Outcomes
    body: >
      Tractian's case-study library contains nine individually published production deployments,
      with documented financial and operational outcomes in every case. The strongest evidence
      comes from Ingredion's North Kansas City plant ($1M in production savings, $223K in
      maintenance savings, 168 hours of avoided downtime from a single site), Whirlpool ($1M+
      in avoided costs, 95% vibration-point coverage, 85% AI-alert validation rate), and
      Unilever's Latin America plant ($700K+ in protected losses and 19 failures anticipated
      in just 112 days). ICL, a food-grade phosphate supplier, achieved a 41% OEE improvement
      and recovered more than 400 tons of production output per year by eliminating one full
      annual shutdown.


      The Bosch case study is distinctive because Bosch built a proprietary AI tool—called
      mAIntenance—on top of Tractian's sensor stream, delivering 29% fewer recurring failures
      and a 17% increase in planned maintenance. This demonstrates that larger enterprise
      customers can layer custom logic onto Tractian's data layer, expanding the platform's
      role beyond out-of-box diagnostics. Pirelli's deployment at a 2,800-person tire
      manufacturing plant resulted in a 98% alert check-in rate and zero breakdowns on
      monitored exhaust systems—an organizational adoption outcome that is rare in industrial
      IoT deployments.


      All published case studies describe production-grade deployments rather than proof-of-concept
      pilots. Customer testimonials are attributed to named individuals with identified roles
      (Maintenance Manager, Reliability Engineer, Operations Director), which raises evidence
      quality above anonymous review snippets. The principal limitation is that all nine
      published case studies originate from official Tractian company pages; no independent
      third-party audit of outcomes has been published. The Sherwin-Williams and Danone case
      studies are more recent additions and show consistent outcome structure, implying a
      standardized commercial documentation process.
