        - Multi-site rollout documented for Ingredion, Unilever, ICL, Pirelli; sensor density grows over time
        - Positive — suggests NRR > 100% if representative
        - Official case studies; 4 documented expansions
        - Request % of ARR from expansions vs new accounts
      - - Top-customer concentration
        - No revenue share data; named marquee customers are global enterprises that likely contribute outsized ACV
        - Material risk — if top 5 customers represent >50% ARR, a single churn would be severe
        - Not disclosed
