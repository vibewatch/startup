  - id: adoption-trajectory
    title: Adoption Trajectory, Scale, and Channel
    body: >
      Public signals triangulate a genuine and rapid customer-count expansion. The December
      2024 Series C announcement confirmed more than 500 customers, more than 1,000 factories,
      and more than 100,000 sensors in the field. The GetApp and homepage counts, updated
      as of June 2026, report 1,500 manufacturers—representing roughly a three-fold increase
      in stated customer count over three years. The sensor base of 100,000-plus units at the
      time of the Series C signals that even the 2024 cohort had already achieved material
      per-customer density, with an implied average of roughly 200 sensors per customer if
      500 customers each ran 1,000+ factory deployments. These ratios reinforce the multi-asset,
      multi-site deployment model described in individual case studies.


      Third-party growth recognition is consistent with the customer-count trajectory:
      Tractian ranked #24 on Deloitte's 2025 Technology Fast 500 for North America and #13
      on the 2026 Inc. Regionals Southeast list. The Inc. ranking methodology relies on
      verified revenue growth from 2022 to 2024, providing some independent triangulation
      on revenue-side expansion even absent disclosed ARR figures.


      Tractian's go-to-market model is entirely direct sales with no publicly disclosed
      reseller, distribution, or partner channel program. Acquisition begins with an inbound
      or outbound demo request, followed by a consultative discovery process, then on-site
      sensor installation by CMRP/CAT-certified Tractian field engineers. The white-glove
      deployment model eliminates self-serve friction but constrains customer acquisition
      speed to the capacity of the internal sales and implementation teams. No public
      evidence of a partner-led or marketplace-driven channel exists as of June 2026.
