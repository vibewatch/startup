callouts:
  - calloutType: strength
    title: Production-Grade Named Customer Proof Across Verticals
    body: >
      Nine individually published case studies with named contributors, specific financial
      outcomes, and traceable deployment details provide stronger-than-typical evidence quality
      for a private growth-stage company. Outcomes are consistent in structure (hours avoided,
      dollars saved, OEE or coverage percentage) and span food, automotive, chemical, appliance,
      coatings, and tire manufacturing—demonstrating cross-vertical applicability rather than
      single-segment depth.
    claimRefs:
      - CU017
      - CU021
      - CU023
      - CU025
      - CU027

  - calloutType: risk
    title: NRR, GRR, and Concentration Data Entirely Absent
    body: >
      No retention, renewal, or concentration metric is publicly available. The absence of
      NRR/GRR data means an investor cannot distinguish strong structural stickiness
      (switching costs, deep integration) from early-adopter enthusiasm that has not yet
      been tested through renewal cycles. The land-and-expand signals are encouraging but
      anecdotal. Until a private data room confirms NRR, the quality of recurring revenue
      cannot be underwritten.
    claimRefs:
      - CU032
      - CU038

  - calloutType: insight
    title: Four Documented Multi-Site Expansions Signal NRR Above 100%
    body: >
      Ingredion (US/CAN fleet), Unilever (second wave within one quarter), ICL (three-phase
      rollout), and Pirelli (expanding asset coverage) all show within-account growth after
      initial deployment. If this pattern holds across the 1,500-manufacturer base, NRR likely
      exceeds 100%—but this inference cannot be confirmed without disclosed cohort data.
    claimRefs:
      - CU034
      - CU035
      - CU036
      - CU037

