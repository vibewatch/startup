company:
  name: Tractian
chapter:
  number: 6
  title: Customers
  summary: >
    Tractian's customer base spans 1,500 U.S. and global manufacturers across ten industrial
    verticals, growing roughly three-fold since its 2023 Series B milestone. Named customer
    case studies for Ingredion, Whirlpool, Bosch, ICL, Pirelli, Unilever, Sherwin-Williams, and
    Danone document concrete, production-grade outcomes ranging from $700K to $1M+ in avoided
    losses per facility. Expansion signals are strong—several customers have progressed from
    single-plant pilots to multi-site rollouts—but NRR, GRR, and concentration data remain
    entirely undisclosed, leaving retention durability as the principal evidence gap in the
    customer chapter.

sections:
  - id: customer-segmentation
    title: Customer Segmentation and Market Reach
    body: >
      Tractian's stated customer base reached 1,500 U.S. and global manufacturers as of June
      2026, up from more than 500 customers at the December 2024 Series C announcement and a
      roughly equivalent 500-plus count in 2023. The platform serves ten named industry
      verticals on the official website—Automotive & Parts, Fleet, Manufacturing, Oil & Gas,
      Chemical, Food & Beverage, Mills & Agriculture, Facilities, Heavy Equipment, and Mining &
      Metals—reflecting deliberate breadth across asset-heavy industrial environments.


      By reviewer distribution on GetApp (85 verified reviews), the top engaged segments are
      Mechanical or Industrial Engineering, Food & Beverages, Automotive, and Mining & Metals.
      This signals that food and beverage and automotive sub-verticals are the best-developed
      customer cohorts and likely produce the most mature case-study proof.


      Three buyer archetypes emerge from the evidence: reliability engineers and maintenance
      supervisors who configure and consume sensor diagnostics (the primary user); plant
      operations managers who approve capital and expansion decisions (the economic buyer);
      and IT/OT teams who manage data governance and ERP integration (a secondary influencer
      gating Enterprise and Bundle deployments). All three must be engaged during a typical
      enterprise evaluation.


      Geographic footprint is concentrated in Brazil (founding market), the United States
      (current HQ in Atlanta), and Mexico. The Unilever and Danone case studies document
      Latin American plant deployments. The Pirelli and ICL case studies are consistent with
      European or global chemical/automotive environments, though Tractian does not publish
      a formal country-by-country breakdown. Three pricing tiers—Standard ($60/user/month,
      5+ users), Enterprise ($100/user/month, 10+ users), and Bundle (CMMS plus sensors,
      custom pricing)—target different organizational sizes, with hardware always sold
      alongside the software stack rather than as a standalone sensor subscription.
