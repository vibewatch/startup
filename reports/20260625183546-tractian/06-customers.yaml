  - id: concentration-risk-procurement
    title: Concentration Risk, Procurement Friction, and Adverse Signals
    body: >
      Concentration risk is entirely opaque: Tractian discloses no top-customer revenue share,
      no customer-cohort revenue breakdown, and no contract-length or renewal-rate data.
      Given that named case studies involve very large global manufacturers (Bosch, Unilever,
      Danone, Whirlpool, Ingredion), it is plausible that a small number of enterprise
      accounts contribute a disproportionate share of ARR, especially for Bundle-tier
      deployments where hardware and multi-seat software combine. Until disclosed, concentration
      risk cannot be quantified.


      Procurement friction surfaces in independent reviews. The Coast App review—authored
      by a competing CMMS provider and therefore directionally adverse but grounded in
      documented user feedback—identifies three friction points: the mobile application
      is described by a G2 enterprise reviewer as "very complicated in phones," the mobile
      app had only 33 App Store ratings and 8 Google Play reviews as of March 2026 (suggesting
      limited direct user uptake through the app stores), and advanced customization features
      such as SSO, ERP integration, and custom fields are gated to the Enterprise tier.
      This combination of mobile friction and enterprise gating creates adoption risk for
      mid-market accounts or those with technology-wary field technicians.


      A secondary friction point is the absence of any self-serve or free-trial path. Every
      new customer must begin with a sales conversation and then commit to white-glove hardware
      installation. This limits the expansion of the top-of-funnel and makes win rates heavily
      dependent on enterprise sales cycles, which are typically long in asset-heavy industrial
      verticals. ISO 27001 and SOC 2 Type II certifications (reported by GetApp) reduce
      security-review friction for enterprise procurement, partially offsetting the sales-cycle
      challenge.
