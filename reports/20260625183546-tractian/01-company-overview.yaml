  - - Georgia Tech / Atlanta talent ecosystem
    - Non-investor stakeholder
    - Repeatedly cited by management as a reason for concentrating headquarters and engineering recruiting in Atlanta.
    - Test whether the talent pipeline is a durable edge or mainly a branding narrative.
