company:
  name: Tractian
chapter:
  number: 1
  title: Company Overview
  summary: Tractian is a 2019-founded industrial AI company that combines proprietary sensors, CMMS/EAM software, energy monitoring, and AI diagnostics into what it calls an Industrial Copilot for asset-heavy manufacturers. Public evidence supports strong growth, a move of corporate gravity to Atlanta, and a meaningful capital base led by Sapphire Ventures, but it also shows under-disclosure around board composition, exact post-Series-C valuation, and current headcount. The best-supported view is a fast-scaling private industrial software and hardware company with credible customer proof and real market traction, but with several headline metrics still best treated as ranges rather than precise facts.
sections:
- id: identity-product-and-mission
  title: Identity, Mission, and Product Scope
  body: Tractian presents itself as an industrial operating-system company rather than a single-purpose sensor vendor or basic CMMS. Across its English and Portuguese company pages, it says the mission is to eliminate industrial downtime worldwide and to bridge the gap between humans and machines on the shop floor. That framing matters because the company is not only selling predictive maintenance alerts. The fetched product pages show a broader stack that combines Smart Trac condition-monitoring sensors, TracOS CMMS/EAM workflows, and Energy Trac monitoring into one operating layer for maintenance and reliability teams. Official copy repeatedly describes this bundle as an Industrial Copilot, while Y Combinator compresses the idea even further by calling Tractian physical AI for asset-heavy industries. The current product and sector footprint is therefore best understood as a vertically integrated hardware-plus-software platform focused on food and beverage, automotive, mining and metals,
    chemicals, agriculture, consumer goods, oil and gas, and pulp and paper plants where downtime carries disproportionate operational cost.
  claimRefs:
