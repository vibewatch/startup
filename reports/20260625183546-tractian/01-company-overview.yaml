- id: founders-leadership-and-geography
  title: Founders, Leadership, and Geographic Center of Gravity
  body: 'The public founder record is unusually consistent on names even if it is less consistent on titles. AJC, the Forbes profile, and Tractian’s own founder-recognition page all identify Igor Marinelli, Gabriel Lima, and Leonardo Vieira as the founding trio. Igor is the clearest current executive anchor: the company’s about page names him CEO and founder, and independent coverage quotes him as the principal spokesperson on strategy, talent, and industrial mission. Gabriel and Leonardo are also clearly part of the founding team, but the fetched material shows titles shifting by context: a 2024 founder-recognition post calls Gabriel a co-CEO and Leonardo the Mexico CEO, while newer public-facing company pages emphasize Igor rather than a full C-suite roll call. Geography is also important to get right. Tractian’s official materials already called it Atlanta-based in late 2024, with offices in Mexico City and São Paulo, and AJC later showed why Atlanta became central: early hiring ties
    to Georgia Tech and a 2026 headquarters move to the Coda building that tripled local office space. The company is therefore best described as Atlanta-headquartered with Brazilian roots and a cross-Americas operating footprint.'
  claimRefs:
