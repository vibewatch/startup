- id: scale-signals-milestones-and-watchpoints
  title: Scale Signals, Milestones, and Current Watchpoints
  body: 'Public traction signals are real, but they are not perfectly harmonized across sources. The strongest operational proof comes from the 2024 Forbes funding article, which said Tractian had more than 100,000 sensors in the field across more than 1,000 factories and 500 customers including Bosch, Kraft Heinz, Carrier, and Hyundai. Atlwire repeated the factory and sensor figures in 2026, while the older 2023 valuation post and the Forbes AI 50 announcement both described a 500-plus customer base. At the same time, the homepage now says the company is trusted by 1,500 U.S. and global manufacturers, suggesting a broader top-of-funnel or site-count framing rather than a directly comparable logo count. Headcount is even less tidy: Forbes cited 400 employees in late 2024, AJC and Atlwire cited about 500 workers in early 2026, and Tracxn’s employee-trend page showed 864 employees in May 2026. Those ranges still support a rapid-scaling company, and the milestones reinforce that view: Forbes
    AI 50 recognition, a strong Inc. Regionals ranking, expansion hiring across software, hardware, and AI, and customer case studies such as Yara and Ingredion that show real deployment value. The main watchpoints are not lack of traction but under-disclosed metrics, inconsistent workforce signals, and product-adoption friction visible in independent reviews.'
