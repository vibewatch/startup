callouts:
- calloutType: strength
  title: Integrated hardware plus workflow software is a real differentiation, not just a slogan
  body: 'The company’s public materials and independent reviews point to the same core distinction: Tractian sells sensors, monitoring, work-order workflows, and energy management as one system. That integration helps explain why customer proof often emphasizes faster rollout, real-time insight, and meaningful ROI rather than generic AI language.'
  claimRefs:
  - CO005
  - CO006
  - CO035
  - CO036
  - CO037
- calloutType: risk
  title: Scale is credible, but several headline metrics are still better treated as ranges
  body: Tractian clearly has meaningful customers, capital, and geographic expansion. The diligence issue is precision, not existence. Public materials disagree on headcount, round lifetime totals are rounded differently, and later valuation estimates are third-party rather than company-confirmed post-money disclosures. A private investor should therefore request a clean cap table, current employee count, and board documentation before relying on any single headline number.
  claimRefs:
  - CO018
