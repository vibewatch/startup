companyProfile:
  summary: >-
    Tractian 是一家总部位于 Atlanta 的工业 AI 公司，把自研状态监测传感器、维护工作流、能源监控和 AI 诊断整合到一个平台，面向资产密集型工厂，帮助减少计划外停机。公司由 Igor
    Marinelli、Gabriel Lima 和 Leonardo Vieira 于 2019 年创立，先在巴西、墨西哥和美国扩张，并于 2024 年 12 月完成 Sapphire Ventures 领投的 $120
    million Series C。公开证据支持其客户采用已有实质规模、产品差异化较强，但详细财务披露仍然稀少。
