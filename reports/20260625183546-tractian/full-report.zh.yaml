      - number: '1.2'
        title: 创始人、领导层与地理重心
        blocks:
          - type: paragraph
            body: >-
              公开创始人记录在姓名上异常一致，即使头衔并不总一致。AJC、Forbes 画像和 Tractian 自己的创始人认可页面都把 Igor Marinelli、Gabriel Lima 和 Leonardo
              Vieira 列为创始三人组。Igor 是当前最清晰的管理锚点：公司关于页面称其为 CEO 和创始人，独立报道也引用他作为战略、人才和工业使命上的主要发言人。Gabriel 和 Leonardo
              也明确属于创始团队，但抓取材料显示，头衔会随语境变化：一篇 2024 年创始人认可文章称 Gabriel 为 co-CEO、Leonardo 为墨西哥 CEO，而更新的对外公司页面更突出 Igor，并没有完整列出
              C-suite。地理位置也需要说准。Tractian 官方材料在 2024 年底已称其总部位于 Atlanta，并在 Mexico City 和 São Paulo 设有办公室；AJC 后来解释了 Atlanta
              为何成为中心：早期招聘与 Georgia Tech 有联系，2026 年总部迁至 Coda 大楼，本地办公面积扩大至三倍。因此，公司最准确的描述是：总部位于 Atlanta，根在巴西，运营足迹横跨美洲。
