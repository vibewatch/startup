      - number: '7.3'
        title: 网络安全、运营与供应链风险
        blocks:
          - type: paragraph
            body: >-
              Tractian 的安全状态以 ISO 27001 认证和 SOC 2 Type II 审计为锚点；这些是有意义的可信度信号，但本身不能排除数据泄露或平台宕机。公司托管软件 SLA 承诺 99.70%
              月度可用性，但排除了运营商网络故障、不可抗力、客户基础设施问题和外部云服务商宕机——也就是说，在最可能影响分布式工厂现场监测系统的故障场景中，Tractian
              的合同补救仅限于延长许可天数，没有金钱赔偿。Tractian 的 DPA 承认 data-security incidents 概念，并承诺在确认泄露后 72 小时内通知客户；但没有公开 bug-bounty
              项目或已披露渗透测试结果，外界很难独立评估攻击面暴露。

              供应链方面，Tractian 自行设计并制造 Smart Trac Ultra 传感器，内含 4G/LTE 无线电、锂电池（默认设置下 3–5 年寿命）和 IP69K
              等级外壳中的多频振动传感。这种专有制造模式类似 Samsara 在 fiscal 2026 10-K 中描述的情形：其关键 IoT 组件依赖联合设计制造商和供应商，因此产生集中度风险。Samsara
              明确披露，多个财年里经历了与硅芯片市场条件相关的组件短缺。Tractian 没有披露合同制造伙伴、半导体供应商或库存缓冲，因此其组件集中度风险严重性无法验证。4G/LTE
              依赖是一项结构性运营风险：接收器只能保存一天的备份传感器读数，意味着多日运营商中断会在客户工厂现场造成监测缺口。

              硬件 AI 系统的产品责任风险也值得关注。假阴性——AI 未能标记正在发展的轴承或电机故障——可能导致客户现场出现非计划停机、安全事件或财产损失。Tractian
              的保修政策明确否认对“uninterrupted, error-free service or the completeness and accuracy of analytics derived from
              customer data”承担责任。独立评论者（Coast App、GetApp）提到偶发卡顿，并指出频谱分析导航复杂；另有一位评论者明确提到，大规模部署传感器资产时存在专有锁定风险。如果 AI
              准确性在规模化后未达到客户预期，这些运营风险可能影响续约率。
