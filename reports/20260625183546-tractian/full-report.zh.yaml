      - number: '2.2'
        title: 市场规模：多重视角与相互冲突的分析师估算
        blocks:
          - type: paragraph
            body: >-
              对 Tractian 相关的规模测算有三种镜头：预测性维护软件和硬件市场（最窄）、CMMS 和 EAM 市场（相邻），以及企业 IoT / 工业 AI 市场（最宽）。第一类市场的分析师估算差异很大。Mordor
              Intelligence 将 2025 年全球预测性维护市场估为 $14.09 billion，预计 2026 年增长至 $18.9 billion，并以 34.14% CAGR 到 2031 年达到
              $82.17 billion。Allied Market Research 的起点不同：2023 年为 $10.1 billion，以 32.2% CAGR 增至 2033 年 $162.1 billion。若从
              2023 年按 Allied 的 32.2% 增速复利，其隐含 2026 年规模接近 $23 billion，高于 Mordor 的 2026
              年估算，说明两者对纳入的硬件、服务和行业垂直范围假设显著不同。两家公司都没有免费披露完整纳入标准，因此这些估算应被视为可能区间的上下界，而不是共识。CMMS 子市场小得多，也更成熟：Mordor 将 2025
              年全球 CMMS 市场估为 $1.40 billion，并以温和的 9% CAGR 增至 2030 年 $2.15 billion。这个对比说明，Tractian 的长期收入机会主要在规模更大、增长更快的 PdM
              和工业 AI 层，而不是增速较慢的独立 CMMS 细分市场。能源管理系统市场代表第三个潜在收入池：Mordor 估计其 2025 年为 $63.64 billion，以 15.48% CAGR 增至 2031 年
              $150.83 billion，其中制造业占 31%。自下而上的视角在缺少私人数据时更难执行。企业 IoT 市场可作为天花板校验：IoT Analytics 将 2023 年企业 IoT 总支出估为 $269
              billion，年增速 15%，其中流程自动化和资产性能优化按采用率位列前两大用例。这些宽口径数字提醒分析师，狭义 PdM 市场估算只捕捉软件和硬件层，并没有覆盖 IoT
              驱动维护产生的更广运营价值。仅凭公开数据，无法隔离 SAM 和 SOM；除非知道 Tractian 内部目标工厂数和单厂收入假设。证据缺口章节记录了私人尽调需要补齐哪些材料。
