    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与产品边界
        blocks:
          - type: paragraph
            body: >-
              Tractian 把自己定位为工业操作系统公司，而不是单一用途传感器厂商或基础
              CMMS。其英文和葡萄牙语公司页面都称，使命是消除全球工业停机，并打通车间里人与机器之间的断层。这个叙事很关键，因为公司卖的不只是预测性维护告警。抓取到的产品页面显示，它的技术栈更宽：Smart Trac
              状态监测传感器、TracOS CMMS/EAM 工作流和 Energy Trac 监控，被整合成维护和可靠性团队的一层操作系统。官方文案反复把这套组合称为 Industrial Copilot，Y
              Combinator 则把说法进一步压缩为面向资产密集型行业的 physical
              AI。因此，当前产品和行业覆盖最适合被理解为一个垂直整合的硬件加软件平台，聚焦食品饮料、汽车、采矿与金属、化工、农业、消费品、油气、纸浆与造纸等工厂；在这些场景里，停机带来的运营成本不成比例地高。
