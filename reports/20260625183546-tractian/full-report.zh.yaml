      - number: '3.3'
        title: CMMS 既有厂商与相邻平台
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 6 月，CMMS 竞争层高度碎片化，G2 上已有远超 200 个产品。Fiix 是 Rockwell Automation（1903 年创立）的子公司，按用户量位居 G2 预测性维护和
              CMMS 类别榜首，评论者中 59% 来自中端市场。Fiix 的核心 CMMS 不包含自研 IoT 传感器，但公司新增了 FactoryTalk Optix 集成，可基于联网设备触发状态维护，代表向
              Tractian 模式的部分趋同。Fiix 更深的战略优势来自母公司：Rockwell Automation 的 FactoryTalk 产品组合嵌入北美大量车间 OT 安装基础，给 Fiix 带来一个
              Tractian 必须靠企业直营销售去突破的分发和信任渠道。

              IBM Maximo Application Suite 是主导性的企业 EAM 平台，覆盖维护管理、资产检查、现场服务、库存优化、以可靠性为中心的维护和基于状态的维护。其 Essentials 层每年约
              $40,000 起，采用基于 credit 的 AppPoints 授权模式，并可作为 SaaS、本地部署或混合部署使用。Maximo 的完整 EAM+APM+RCM
              栈在企业客户处沉淀了多年定制、资产数据记录、工单历史和 ERP 集成，形成结构性切换成本，保护其安装基础免于被 Tractian 替代。Maximo
              不包含自研传感器，需要单独的传感器基础设施或第三方集成来启用预测 AI。对中端 CMMS-only 买家，MaintainX 的平台价格为 $0（Basic）、$20/user/month（Essential）和
              $65/user/month（Premium），定位为面向无桌面员工的 AI-powered mobile-first CMMS，在任何自助服务层都没有自研传感器。UpKeep 定价为
              $24/user/month（Essential）和 $55/user/month（Premium），并将基础 IoT 传感器（温度、湿度、振动、电流）作为付费 add-on 提供，但这些传感器缺少危险场所
              IP69K 或 ATEX 认证。Limble CMMS 提供分层 SaaS 模式，IoT 传感器集成作为 add-on，并具备 SOC II Type II 合规。

              Tractian 的 CMMS 定价——$60/user/month（Standard，至少 5 名用户）和 $100/user/month（Enterprise，至少 10 名用户）——按席位高于
              MaintainX Premium（$65）和 UpKeep Premium（$55）。这部分溢价由集成 AI 诊断支撑，而 Tractian 公开承诺比竞争对手 CMMS 报价低
              15%，则是明确的定价压力信号。G2 记录的 CMMS 市场碎片化确认，单靠工单管理做差异化越来越难；Tractian 必须持续证明，sensor-to-CMMS-to-APM
              套件值得客户支付合并后的订阅成本，而不是只在 CMMS 价格上竞争。
