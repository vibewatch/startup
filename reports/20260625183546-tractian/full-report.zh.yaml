      - number: '5.6'
        title: 图表与证据
        blocks:
          - type: callout
            title: 垂直整合形成持久的软硬件护城河
            body: >-
              Tractian 是少数几家工业维护平台之一：自研传感器，掌控无线协议，运行专有 AI 故障分类，并交付
              CMMS——全部装进一个系统。这种紧耦合带来复合数据优势（每次部署都会增加带标签训练数据）、随传感器渗透率提高而加深的切换成本，以及可进入危险场所的市场（ATEX/IECEx/NFPA
              认证）；没有硬件认证的竞争对手无法服务这些场景。
            calloutType: strength
            claimRefs:
              - CE033
              - CE034
              - CE035
              - CE036
          - type: callout
            title: 专有耦合既是护城河，也是锁定风险
            body: >-
              推动差异化的同一套软硬件整合，也为客户制造了有记录的供应商锁定风险。Coast App 的独立评测明确称：“investing heavily in Tractian sensors leads to heavy
              reliance on Tractian's proprietary software, which limits flexibility and drives up costs if you need to
              switch providers.” 专有 915 MHz 协议阻止第三方传感器替换。这一动态有利于 Tractian 的净收入留存，但在有正式技术多元化政策的大型企业中会成为销售摩擦点。
            calloutType: risk
            claimRefs:
              - CE011
              - CE014
              - CE034
              - CE045
          - type: callout
            title: 移动 UX 与开发者接口缺口是运营风险
            body: >-
              Tractian 的移动应用在多个独立评论来源中持续收到负面反馈：截至 2026 年 3 月，App Store 只有 33 条评分，Google Play 只有 8 条评分；一位具名 G2 评论者称手机 UI
              “very complicated”。平台核心价值主张包含工厂现场技术员的移动执行，移动 UX 偏弱会带来部署摩擦。没有公开 API、SDK 或开发者文档，也限制了企业客户独立构建自定义集成的能力。
            calloutType: risk
            claimRefs:
              - CE008
              - CE009
              - CE024
              - CE025
          - type: callout
            title: IP 申请状态和 AI 模型准确性尚未验证
            body: >-
              本次研究期间，在公开数据库中没有发现 Tractian 核心传感器诊断或 AI 分类技术的已授权专利。Auto Diagnosis
              准确率、误报频率和模型漂移管理实践均未公开披露。两项缺口都对投资决策重要，应通过向公司直接提出尽调请求来解决。
            calloutType: assumption
            claimRefs:
              - CE036
              - CE037
              - CE039
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与市场覆盖
        blocks:
          - type: paragraph
            body: >
              Tractian 称，截至 2026 年 6 月，其客户基础已达到 1,500 家美国及全球制造商；2024 年 12 月 Series C 公告时为 500 多家客户，2023 年也大致为
              500+。官网列出十个具名行业垂直：Automotive & Parts、Fleet、Manufacturing、Oil & Gas、Chemical、Food & Beverage、Mills &
              Agriculture、Facilities、Heavy Equipment、Mining & Metals，显示公司有意覆盖资产密集型工业环境的宽广范围。


              按 GetApp 评论者分布（85 条已验证评论），参与度最高的细分市场是 Mechanical or Industrial Engineering、Food & Beverages、Automotive 和
              Mining & Metals。这说明食品饮料和汽车子垂直是发展最成熟的客户 cohort，也可能产出最成熟的案例证据。


              证据中出现三类买方画像：配置并使用传感器诊断的可靠性工程师和维护主管（主要用户）；批准资本投入和扩张决策的工厂运营经理（经济买方）；以及管理数据治理和 ERP 集成的 IT/OT 团队（影响 Enterprise
              和 Bundle 部署的次级把关人）。典型企业评估中，三类角色都必须被拉进来。


              地理足迹集中在巴西（创始市场）、美国（当前总部在 Atlanta）和墨西哥。Unilever 和 Danone 案例记录了拉美工厂部署。Pirelli 和 ICL 案例与欧洲或全球化工 / 汽车环境一致，但
              Tractian 没有发布正式的逐国拆分。三个价格层——Standard（$60/user/month，5+ users）、Enterprise（$100/user/month，10+ users）和
              Bundle（CMMS 加传感器，自定义定价）——面向不同组织规模；硬件始终与软件栈一起销售，而不是作为独立传感器订阅销售。
