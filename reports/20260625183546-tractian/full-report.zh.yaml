      - number: '4.3'
        title: 成本结构、毛利率驱动因素与资本强度
        blocks:
          - type: paragraph
            body: >-
              Tractian 的成本结构有三层，在纯 SaaS 工业平台中并不常见，会形成利润率压力。第一层也是最重要的一层，是硬件制造 COGS。Smart Trac Ultra 传感器由 Tractian
              制造，采用自研硬件设计，并整合 4G/LTE 连接、超声和振动感知、IP69K 密封以及危险场所认证（ATEX、IECEx、NFPA Class 1 Div 1）。这种 ruggedization
              和认证水平意味着单台生产成本不低，且无法像软件毛利率那样快速随规模改善。工业 IoT 传感器毛利率通常在 30% 到 55% 之间，纯 SaaS 则为 70%–80%+。Tractian
              未公开综合毛利率，但硬件收入占比决定了合并利润率会比纯软件基准低多少。


              与 Tractian 轨迹最可比的上市公司基准是 Samsara，它运营 IoT connected-operations 软件，采用硬件加软件收入模式。Samsara 2026 财年收入
              $1,619M，毛利率为 76.74%。不过，Samsara 在规模曲线上走得更远——制造单台成本随产量下降，软件成为主导收入贡献者。Tractian 当前阶段很可能硬件收入占比更高，因此综合毛利率低于
              Samsara 基准，但确切比例仍是未解决缺口。


              第二层成本是研发。Tractian 在 2024 年 12 月 Series C 公告中披露，拥有 200 多名工程师专注数据、软件和硬件研发，并在 2024 年提交 12 项专利。对一家总员工数在
              400–864 人之间的公司，这种研发强度意味着研发费用在成本基础中占比不成比例地高。第三层成本是现场服务交付：CMRP/CAT 认证实施团队、客户成功资源和白手套 onboarding，都是 GTM
              模式的核心。这些成本部分资本化进客户获取，也会作为软件侧收入成本流出。传感器制造 tooling 和网络基础设施的资本开支构成第四个大体未披露的成本元素。合起来，这四层让 Tractian 即使在规模化后，相比纯
              SaaS 同行仍是资本密集型业务，在 2025–2026 年增长阶段尤其如此。
