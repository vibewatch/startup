  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Tractian 可触达支出位于四个不同但相互强化的类别交汇处。核心是预测性维护：部署传感器、数据管道和 AI
              分析，在设备故障发生前预判风险，从而替代反应式维修（故障后修复）和按日历执行的预防性维护（不看实际状态，按计划保养）。核心旁边是更宽的 CMMS 和 EAM
              软件层，管理工单、资产清单和维护排程。即使从不部署预测性传感器的公司，通常也会使用 CMMS 软件；2025–2026
              年的趋势是把基于状态的智能直接嵌入这层工作流，而不是作为独立系统运行。第三个相邻领域是工业能源管理：工厂把能耗数据与资产健康数据整合后，监控和分析基础设施高度重叠。第四个相邻领域是广义工业
              AI，即把机器学习推理用于工厂运营，其中预测性维护是 ROI 最高、采用最快的用例。Tractian 替代的现状方案包括 OEM
              服务合同（设备制造商定期上门巡检）、可靠性技师手工振动检查（手持或巡检仪器），以及嵌在既有 CMMS 记录里的基于时间的预防性维护计划。与市场规模测算相关的边界排除项包括：没有维护模块的纯 ERP/MES
              系统、通用 IT 基础设施、新设备资本开支，以及维护技师本身的人工成本。Tractian 平台直接覆盖核心和 CMMS 相邻领域，并通过 Energy Trac 模块连接能源相邻领域，因此总边界比纯 PdM
              测算更宽。
