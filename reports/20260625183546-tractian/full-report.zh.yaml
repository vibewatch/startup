              没有公开来源提供 Tractian 专属 SAM 或 SOM 数字。本章金字塔图使用推导出的美洲制造业 PdM SAM 和推断 SOM 代理，应被视为示意性基准，而不是公司确认数字。与 Tractian
              管理层开展私人尽调，包括了解其内部目标工厂数和实际单厂 ARR，将显著提高两项数字的清晰度。
