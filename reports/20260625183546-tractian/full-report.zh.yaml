        - 投资逻辑破裂；任何投资前必须通过资料室确认烧钱速度
      - - 数据泄露 / 网络安全
        - 披露泄露、GDPR/LGPD 监管问询，或 FTC/州检察长行动
        - 已确认在具名企业客户发生任何重大泄露
        - 立即复盘投资逻辑；审查赔偿结构和保险覆盖
      - - 监管处罚
        - ANPD 罚款、GDPR 监管决定，或 CRA 不合规通知
        - 任何罚金超过 $1M 等值的处罚
        - 评估复发风险；若属系统性问题，则下调评级以规避
      - - CEO 离任
        - Igor Marinelli 宣布离任，且未任命内部继任者
        - 任何投资后 24 个月内离任
        - 重新评估管理层梯队；根据继任者质量决定推迟或退出
      - - 供应链中断
        - 公开宣布传感器交付延迟，并影响多个客户
        - 延迟持续多个季度，导致客户部署积压超过 10%
        - 调查组件策略；若未缓释，将削弱近期收入可靠性
      - - 估值重置（down-round）
