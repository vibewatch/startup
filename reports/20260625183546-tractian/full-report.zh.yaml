      - number: '8.3'
        title: 可比公司组与市场基准
        blocks:
          - type: paragraph
            body: >-
              最接近的公开可比公司是 Samsara（NYSE: IOT）。它运营工业 IoT 互联运营平台，组合硬件 IoT 设备和云订阅。截至 2026 年 1 月 31 日，Samsara 报告 2026 财年收入
              $1,618.6 million（同比增长 29.6%）、毛利率 76.74%、12,000+ 名 Core Customers（每名 ARR 至少 $25,000），以及 3,194 名大型客户（每名 ARR
              超过 $100,000）。没有单一客户超过 ARR 的 2%。截至 2026 年 6 月 25 日，Samsara 市值约 $16.89 billion，企业价值约 $17.47 billion，对应约
              10.8x 的 trailing EV/收入倍数。分析师对 Samsara 的一致评级为「Buy」，12 个月平均目标价 $44.78，较 6 月 25 日 $28.98 收盘价约有 54%
              上行空间——说明市场认为当前 Samsara 倍数相对长期公允价值被压缩。Samsara 向 SEC 提交、截至 2026 年 1 月 31 日期间的 10-K 确认收入 $1,618.6 million、净亏损
              $9.1 million，显示规模化后已接近盈亏平衡。

              AspenTech（AZPN）于 2025 年 3 月被 Emerson 收购，最后交易市值约 $16.73 billion，FY2024 收入 $1.127 billion，隐含交易 EV/收入约
              14.8x。PTC（NASDAQ: PTC）2026 年 6 月市值约 $13 billion，TTM 收入约 $2.998 billion，隐含约 4.3x EV/收入。Rockwell
              Automation（NYSE: ROK）2026 年 6 月市值 $53.34 billion，FY2025 收入约 $8.3 billion，隐含约 6.4x EV/收入。私营同业中，Augury 截至
              2025 年 $75 million Series F 后累计融资约 $255 million，面向企业可靠性，拥有超过 3.1 billion 小时机器数据；没有确认的公开估值。

              套用到 Tractian，公开可比区间（4x–15x EV/收入）跨度很大，因为它混合了低增长工业集团（Rockwell 4–6x）、高增长纯 SaaS（Samsara 10–12x）和 M&A
              溢价（AspenTech 15x）。若一家公司增速超过 50% 且带有硬件成分，增长调整后的 7–12x 区间，按 Growjo 的 $109 million 收入估算，对应公允价值约 $750 million
              至 $1.3 billion；如果收入估计和增长率准确，$722.9 million 标记大致落在公允价值低端。
