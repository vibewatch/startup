      - number: '3.5'
        title: 切换成本、锁定、护城河耐久度与替代风险
        blocks:
          - type: paragraph
            body: >-
              Tractian 的护城河在两层相互强化。第一层是硬件锁定：Smart Trac 传感器是自研无线设备，其数据协议只接入 Tractian 云平台；替换 Tractian
              意味着要在可能数千个资产安装点上物理拆除并更换传感器。对拥有 200 个被监控资产的客户，仅重新部署传感器就是一个多日安装项目。第二层是 TracOS 内混合的 CMMS
              和传感器数据：资产历史、振动基线、FMEA 记录和工单历史会随着时间积累在 Tractian 平台中。迁出需要同时导出 CMMS 数据集和状态监测历史——原则上可行（Tractian
              提供数据导出），但运营上成本高且扰动大。IBM Maximo 的安装基础说明了这种数据粘性可以多强：企业 EAM 客户很少迁移，因为多年定制、工作流配置和资产数据已经嵌入平台。

              最可信的替代向量按概率从高到低排列如下。第一，Augury 深化 CMMS 合作（MaintainX、Limble），会补上检测到执行的缺口，而这个缺口正是 Tractian 的核心结构性主张；如果 Augury
              增加原生或紧密联合品牌的 CMMS 层，护城河会显著变窄。第二，Rockwell Automation 的 Fiix 在 Rockwell OT/PLC 占比高的工厂内部有分发优势，可能通过把
              FactoryTalk Optix 预测触发器打包进既有 Fiix 订阅，阻挡 Tractian 进入这些站点。第三，成熟工业 OEM（Emerson
              AMS、SKF）在最大型工厂拥有现场服务合同和可靠性关系，形成既有接入优势；Tractian 必须靠直接关系建设去突破，而不是靠数字自助服务。第四，multi-homing
              风险是真实场景——企业客户可能在关键资产上部署 Augury、在 balance-of-plant 上部署 Tractian——但公开证据无法确认或否定，因此单客户收入天花板不清楚。Tractian
              公开承诺比竞争对手 CMMS 报价低 15%，是一个反向利润率信号，说明 CMMS 定价已在竞争，并可能随市场成熟进一步压缩。数据网络效应（3.5B+ 训练样本）有意义，但并非不可攻破：Augury 报告拥有
              1.1B+ 小时机器监控数据，并有可比的资产类型覆盖。
            claimRefs:
              - CP019
              - CP030
