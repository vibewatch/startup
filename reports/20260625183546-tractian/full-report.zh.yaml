          note: 未披露已确认 ARR、NRR、毛利率或烧钱速度
        - label: 竞争护城河
          value: 6
          note: 数据飞轮优势真实存在，但并非不可攻破；已有价格竞争迹象
        - label: 管理层与执行
          value: 7
          note: 双 CEO 创始人；CMRP/CAT 认证部署团队；规模化速度快
        - label: 估值支撑
          value: 5
          note: 隐含 EV/Revenue 约 6.6x，相比可比公司处于合理至偏低，但基于未经验证的收入
        - label: 风险调整后确信度
          value: 4
          note: 优先权悬顶、硬件利润率拖累和财务不透明限制确信度
    approximationNotes: 评分是研究作者基于截至 2026 年 6 月公开证据作出的定性评估。它们不是量化模型，也不应被理解为投资建议。财务透明度评分反映一手财务披露完全缺失；若出现任何经审计财务披露，该分数会显著改善。
