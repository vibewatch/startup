        - 公开或经确认的私下 down-round 公告
        - 审查反稀释条款；重新评估入场价格假设
      - - EU CRA 不合规
        - 未能履行 2026 年 9 月面向联网 IoT 硬件的报告义务
        - EU 市场限制 Smart Trac 传感器准入
        - 评估 EU 收入敞口和合规整改时间表
