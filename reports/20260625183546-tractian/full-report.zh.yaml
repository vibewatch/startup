      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              2024 年 12 月的 Series C 融资完成 $120M。按 Premier Alternatives 对该轮的跟踪，Tractian 已披露累计融资约 $186.2M；若按媒体报道采用的取整口径，则约为
              $196M–$200M。Premier Alternatives 将 12 月 5 日交割时的投后估值定为 $722.9M，隐含资本效率约 3.88x。官方 Series C 博文称，资金将用于加速制造业 AI
              创新并扩大全球覆盖，同时继续扩充 200 多人的工程团队，并在 go-to-market 岗位新增招聘。


              公司没有公开现金余额、烧钱速度或 runway。按公开代理指标估算：一家 500 人规模的工业 AI 公司，重投研发、跨地域运营，又采用高接触度现场服务模式，月度运营成本通常在
              $5M–$12M，具体取决于薪酬水平和硬件产量。若落在该区间低端，$120M 新增一级资本可从 2024 年 12 月交割后支撑约 10–24 个月 runway，对应下一次融资触发窗口在 2025 年 10
              月至 2026 年 12 月之间。到本报告 2026 年 6 月运行日，公开报道中没有 Series D 或 bridge 消息，这与两种情形一致：公司要么在 Series C
              额度内谨慎管理，要么已有未披露融资事件。此前轮次也提供背景：2023 年 8 月 Series B 融得 R$230M 一级资本（按 2023 年中汇率约 $46M）外加 R$50M 二级交易；因此 Series
              C 是 Tractian 历史上规模最大的单次一级资本事件，且明显表明管理层选择激进扩张，而非用精简预算过桥到盈利。


              本章审阅的公开来源中，没有披露任何债务额度、收入型融资或项目融资义务。2023 年 Series B 博文称，Series B 之前累计资本约为 R$380M（一级资本加二级交易）；折算后再加上 $120M
              Series C，意味着资产负债表以风投资本和股权融资为主。从公开证据看，未见明显项目融资或债务包袱。
