      - number: '7.5'
        title: 合作伙伴、平台、人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Tractian 的合作伙伴和平台风险集中在三组依赖。第一是云基础设施：DPA 提到 Sub-Processors，确认 Tractian 依赖第三方云服务商托管；按巴西起家的 SaaS 公司行业惯例，最可能是
              AWS 或 GCP，但 Tractian 没有公开披露云服务商。主要云服务商宕机或调价，会影响 Tractian 的平台可用性和成本结构。第二是蜂窝运营商：4G/LTE
              连接模式意味着，运营商网络宕机或覆盖缺口——SLA 明确把这类情形排除在正常运行时间保证之外——可能让客户设备无人监测。在巴西和墨西哥等新兴市场制造基地，运营商可靠性差异较大，这一风险尤其突出。第三是
              CMRP/CAT 认证现场工程师：白手套式部署需要专业劳动力；如果认证维护工程师的招聘扩张快过认证管线供给，部署速度可能被封顶。

              关键人物风险集中在 CEO Igor Marinelli 身上。他是 Tractian 主要的投资者关系发言人、战略声音，也是外界最容易识别的公司面孔。Gabriel Lima 和 Leonardo Vieira
              承担跨美洲的高级职责，但在独立报道中出现得不如 Igor 稳定。公开材料没有披露 CFO、CPO 或 CTO 的姓名，外部很难判断高管梯队是否足够深，能否支撑下一阶段扩张或潜在公开市场准备。18 个月内员工数从
              400 人增至约 864 人，也带来组织执行风险：文化稀释、入职质量、现场工程师培训与认证管线扩张，都会在高速增长下变难。Gartner
              的供应链风险分类明确把第三方依赖和人才集中列为技术公司快速扩张期的核心运营风险类别。
