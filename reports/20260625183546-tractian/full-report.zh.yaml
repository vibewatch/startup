      - number: '8.2'
        title: 融资与估值背景
        blocks:
          - type: paragraph
            body: >-
              Tractian 的资本化历史呈连续融资、风险资本占比高的特征。公司完成了 Next47 领投的 Series A；2023 年 8 月完成 Series B，据报估值 R$1 billion（按 2023 年中
              BRL/USD 汇率约 $200–$210 million），其中 R$230 million 为 primary 新融资、R$50 million 为 secondary 老股转让；2024 年 12 月完成
              $120 million Series C，由 Sapphire Ventures 领投，General Catalyst、Next47 和 NGP Capital 参投。Premier Alternatives
              将 2024 年 12 月 5 日交割时的 Series C 投后估值标为 $722.9 million。按 Premier Alternatives 的轮次级跟踪，已披露累计融资为 $186.2
              million；按更粗略的媒体报道口径，约 $196–$200 million。公司和任何投资人都没有发布确认的投后估值或股权条款清单；所有估值标记都是第三方估算。

              在 $722.9 million 标记下，资本效率比约为 3.88x（EV 除以累计融资），符合一家成长阶段 Series C 公司把资本积极投向硬件制造、多地域销售人力和研发后的状态。对照 Growjo 对
              $109.1 million 收入的算法估计，隐含 EV/收入倍数约为 6.6x——明显低于 Samsara 截至 2026 年 6 月交易的 10–12x，但也反映 Tractian
              阶段更早，且硬件收入带来结构性低毛利。任何 secondary 买方或 Series D 投资人都应把 $722.9 million 视为参考点，使用前必须获得公司确认，不能直接当作底价或上限。Forbes
              公司页截取的是 Series C 前快照（截至 2024 年 4 月），显示累计融资 $65 million、估值 $205 million，确认了截至 2024 年 12 月的快速多轮重定价。
