  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险画像与严重性概览
        blocks:
          - type: paragraph
            body: >-
              Tractian 的风险画像符合一家快速扩张的工业 AI 公司特征：它把专有硬件制造与跨司法辖区 SaaS
              运营结合在一起，因此资本密集、受数据主权约束，并在公司仅部分披露的层面上技术依赖第三方基础设施。公开证据支持成长阶段投资者按以下严重性排序。财务和资本充足性风险最高，因为公司未披露 ARR、毛利率或烧钱速度，而
              2024 年 12 月 Series C 资金支撑的是跨 Atlanta、São Paulo 和 Mexico City 的激进全球扩张，且看不到已确认后续融资事件。监管和数据隐私风险排第二；Tractian
              明确管理巴西 LGPD、欧盟 GDPR、美国 CCPA/CPRA 和墨西哥 LFPDPPP 的多司法辖区合规，同时新的 IoT 专项监管制度——EU Cyber Resilience Act 和 EU AI
              Act——将在 2026 年进入活跃执行窗口。供应链和硬件制造风险排第三：公司设计并制造带锂电池、4G/LTE 无线电和危险场所认证的专有传感器，依赖半导体组件市场；Samsara 在其 fiscal 2026
              10-K 中明确把该市场波动列为重大风险。网络安全风险在结构上很重要，因为 Tractian
              从客户工厂现场摄入敏感运营技术数据；若在大型企业客户处发生泄露或长时间宕机，即使概率低，严重性也会很高。关键人物和执行风险——尤其是 CEO Igor Marinelli
              过重的公众角色——构成第一梯队尾部，其后是对蜂窝运营商和云基础设施提供商的 partner/platform
              依赖。公开来源中没有发现不利监管事件、活跃诉讼或确认的数据泄露，这是一个有意义的正面基线。公司作为私营企业且运营披露不足，使每个领域的剩余风险都被抬高。
