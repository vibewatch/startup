      - number: '8.4'
        title: 牛市、基准与熊市情景
        blocks:
          - type: paragraph
            body: >-
              牛市情景假设 Tractian 到 2028 年维持 80–100% 年收入增长，ARR 达到 $400–$500 million，随着软件 ARR 逐渐跑赢硬件传感器收入，混合毛利率达到 60–65%，并以
              10–12x 收入倍数完成 IPO 或战略收购退出。在这些假设下，退出估值为 $4–$6 billion，以 $722.9 million 参考价持有 4 年，对应 5–8x
              回报。该情景需要：（a）没有以明显更低估值完成 Series D 融资；（b）NRR 高于 110%；（c）在北美企业市场成功打入 $100,000+ ACV 层级；（d）没有不利监管或供应链冲击。

              基准情景假设到 2028 年收入增长 50–70%，ARR 达到 $200–$300 million，毛利率 50–60%，并在 2028–2029 年前后以 8–10x 收入完成战略收购退出。退出估值约为
              $1.6–$3 billion，相对 $722.9 million 隐含 2–4x 回报。该情景需要公司继续保持市场领先，跑通 Atlanta 总部枢纽，并且主要竞争对手没有在一体化传感器 + CMMS
              模型上快速趋同。

              熊市情景假设收入增长放缓至 40% 以下（与实施复杂度和硬件周期约束相符），公司为了筹集 Series D 资本被迫降价融资，并在 2028 年前后以 4–6x 收入、$300–$500 million ARR
              退出。按这些数字，退出估值为 $1.2–$3 billion，但五轮融资形成的清算优先权堆栈可能吃掉其中大部分，让以 $722.9 million
              投后标记进入的普通股获得接近零或负回报。熊市最可能的单一触发因素，是北美企业渗透慢于预期，同时如果 IPO 市场到 2028 年仍对工业 AI 关闭，风险退出窗口被压缩。
            claimRefs:
              - CV033
              - CV034
              - CV036
              - CV037
              - CV038
              - CV040
              - CV041
              - CV042
              - CV043
          - type: table
            tableRef: TV003
            claimRefs:
              - CV033
              - CV034
              - CV038
              - CV043
          - type: table
            tableRef: TV005
            claimRefs:
              - CV033
              - CV034
              - CV038
              - CV041
      - number: '8.5'
        title: 退出准备度、建议与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Tractian 的退出准备度有条件成立。正面看，公司有具备公开市场关系的机构投资人背书，2026 年入选 Forbes AI 50，在 Atlanta 科技走廊设有明确总部，拥有可识别企业 logo
              的真实客户群，产品架构也能为 Rockwell Automation、Emerson、Honeywell 或寻求 AI-native 预测性维护能力的工业集团带来战略增益。与这些优势相对，公开证据并不支持公司在
              ARR 至少达到 $500 million 前具备 IPO 准备度：Samsara IPO 为规模化工业 IoT 设定了实用基准，而 Tractian 当前规模只是 Samsara 2021
              年上市时的一小部分。近期最可能的退出不是 IPO，而是战略收购或大型 secondary 交易。

              最终建议是中等置信度的「research-more」，风险评级为「high」，估值立场为「unknown」。战略论点有证据支撑；如果 Growjo
              的收入估计方向正确，可比公司组显示定价公允到有吸引力；投资人财团也可信。但在投资人拿到以下材料之前，建议不能上调到「track」或「buy」：（1）经审计或审阅的财务报表，拆分披露
              ARR、NRR，以及硬件和软件毛利率；（2）干净股权结构表，列明所有清算优先权、反稀释条款和董事会观察员权利；（3）前 10 大客户收入集中度和合同续约时间线；（4）董事会确认的烧钱速度和 Series D
              跑道计划。缺少这些材料，任何高于 $722.9 million 参考估值的进入价格都带有无法量化的下行风险，纪律严明的投资人不应接受。
            claimRefs:
              - CV006
              - CV033
              - CV034
              - CV037
              - CV038
              - CV041
              - CV042
              - CV043
          - type: table
            tableRef: TV006
            claimRefs:
              - CV026
              - CV037
              - CV038
      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 建议——中等置信度下继续研究
            body: >-
              战略论点可信；如果 Tractian 收入位于 $100–150 million 区间且增速 50–80%，可比公司组显示 $722.9 million
              参考标记下的定价公允到有吸引力。不过，完全缺少一手财务披露，让任何价格敏感的投资判断都无法成立。任何按 $722.9 million 参考估值或更高价格进入，都应以收到经审计或审阅的财务报表、股权结构条款和
              NRR 数据为条件。在这些材料到位前，正确姿态是「research-more」：监控公司，继续建立投资人和客户参考，只在财务披露后再承诺资金。
            calloutType: recommendation
            claimRefs:
              - CV026
              - CV037
              - CV038
          - type: callout
            title: 优先权负担是回报最大的结构性风险
            body: >-
              公司已完成五轮融资且未披露股权结构条款，按 secondary 或 Series D 市场价格进入的投资人，如果没有完整清算优先权明细，就无法建模退出收益分配。如果此前轮次带有 1x
              非参与清算优先权，优先权总额可能达到 $120–$200 million，在普通股参与前吃掉 $722.9 million 退出价值的 16–28%。如果任何轮次带有 2x
              清算优先权或加权平均反稀释，普通股在平价或温和退出中的受损会明显更严重。这是可以通过尽调解决的问题，但不应被假设为不存在的风险。
            calloutType: risk
            claimRefs:
              - CV007
              - CV038
          - type: callout
            title: 关键假设——Growjo 收入估计方向上合理但未经验证
            body: >-
              本章最常引用的收入代理指标——Growjo 对 Tractian 年收入 $109.1 million
              的算法估计——来自基于员工和网络信号的建模，并非来自财务申报或公司披露。这里仅把它作为方向上合理的数量级估算。如果实际 ARR 明显更低（例如 $50–70 million），参考估值下的 EV/收入倍数会上升到
              10–14x，吸引力下降。如果 ARR 明显更高（例如 $150–200 million），倍数会压缩到 4–5x，非常有吸引力。因此，投资确信度关键取决于能否拿到实际收入数字。
            calloutType: assumption
            claimRefs:
              - CV022
              - CV025
              - CV026
