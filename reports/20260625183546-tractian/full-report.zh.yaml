      - number: '6.4'
        title: 留存、持久性与扩张信号
        blocks:
          - type: paragraph
            body: >
              任何公开来源中都没有 Tractian 的 NRR、GRR、平均合同长度或已发布流失率。这是投资者评估经常性收入质量时的重大证据缺口。唯一代理数据来自公司声称的汇总基准——平均四个月内回本、资产可用性平均提升
              11%——两者都无法独立验证。


              尽管缺少正式留存指标，多项结构性信号显示产品有粘性。第一，专有硬件层带来切换成本：传感器实物安装在工厂资产上，更换意味着重新部署硬件、重新培训技术员，并重建需要数月形成的机器学习基线。第二，至少四个案例记录了既有客户账户内扩张：Ingredion
              在 North Kansas City 初始部署后，正扩展到完整 US/CAN footprint；Unilever 在一个季度内从初始资产扩张到第二波 24 个新增资产；ICL 进入第三阶段部署，并计划
              CMMS 集成和 ISO 55001 认证；Pirelli 将覆盖范围从最初 rollout 延伸到更多设备类别。这些账户内扩张信号指向 land-and-expand 动作；若具有代表性，则意味着 NRR
              明显高于 100%，但证据仍是轶事而非统计。


              独立评论平台的满意度评分持续较高：GetApp 在 85 条已验证评论中给 Tractian 4.8 的整体评分，易用性 4.9，性价比 4.6。SoftwareAdvice 在同一评论面板上显示相同的 4.8
              整体评分。这些分数没有捕捉到评论前已经流失的客户，存在幸存者偏差，但确实印证已部署客户中的活跃用户满意度。
