      - number: '6.3'
        title: 采用轨迹、规模与渠道
        blocks:
          - type: paragraph
            body: >
              公开信号共同指向真实且快速的客户数扩张。2024 年 12 月 Series C 公告确认，公司有 500 多家客户、1,000 多座工厂和 100,000 多个现场传感器。GetApp 与官网截至 2026 年
              6 月更新的口径显示为 1,500 家制造商，意味着三年内披露客户数大约增长三倍。Series C 时 100,000+ 台传感器的基础说明，即使 2024 年 cohort 已经达到可观的单客户密度；若 500
              家客户共同运行 1,000+ 个工厂部署，隐含平均每客户约 200 个传感器。这些比率强化了个别案例中描述的多资产、多站点部署模型。


              第三方增长认可与客户数轨迹一致：Tractian 在 Deloitte 2025 Technology Fast 500 North America 中排名 #24，在 2026 Inc. Regionals
              Southeast 榜单中排名 #13。Inc. 排名方法依赖 2022 至 2024 年经验证的收入增长；即使没有披露 ARR 数据，也为收入端扩张提供了一定独立交叉验证。


              Tractian 的 go-to-market 模型完全是直销，没有公开披露经销商、分销或合作伙伴渠道项目。获客从 inbound 或 outbound demo 请求开始，随后进入咨询式 discovery
              流程，再由 CMRP/CAT 认证的 Tractian 现场工程师到场安装传感器。高接触度部署模式消除了自助式摩擦，但把获客速度限制在内部销售和实施团队产能之内。截至 2026 年 6
              月，没有公开证据显示存在伙伴主导或 marketplace 驱动的渠道。
