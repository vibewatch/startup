      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              预测性维护技术的决策结构是多层的；把买方、用户和付款方混为一谈，会导致销售周期假设失真。最终用户通常是可靠性工程师或维护经理，他们每天承受运营痛点：计划外停机、设备故障根因分析和备件预测。这个人会在内部
              champion 技术、推进试点，并推动更大范围铺开。经济买方——批准采购的人——通常是工厂厂长、运营 VP，或在较小站点由工厂经理担任。他们关心总体拥有成本、与既有 CMMS
              平台整合，以及在减少停机或工时上的可衡量 ROI。预算模型里的付款方，在较小部署中通常是维护和运营预算；但企业级铺开一旦跨过资本门槛，CFO 或 COO
              会介入，传感器订阅成本与避免停机成本之间的商业案例分析就成了审批闸门。不同行业的分段行为差异很大。汽车和食品饮料实行准时制生产，一条产线停摆会立即带来上下游成本后果，因此对旋转设备的基于状态监控有很强紧迫性。采矿、油气和化工的资产更大（涡轮机、压缩机、泵）、更偏远，更换交期以月而非周计；这些细分市场
              ROI 最高，但整合复杂度也最大。在制造业 SME 中，按资产订阅定价是让项目跑起来的定价模式：Mordor 指出，SME 以每资产每月 $50–100 试点，通常在 12–18 个月内取得正
              ROI。Tractian 面向 1,500 家美国和全球制造商，并由 CMRP/CAT 认证专家支持安装和培训；这种服务模式针对的是许多中端买家推进时卡住的变革管理和技能缺口。
