      - number: '7.2'
        title: 监管、法律与数据隐私风险
        blocks:
          - type: paragraph
            body: >-
              对一家 Series C 公司而言，Tractian 的监管足迹异常复杂：它同时面对硬件的工业安全监管、云平台的数据隐私法律，以及刚进入执行窗口的新兴 AI 治理框架。公司发布的 Privacy Policy
              明确承认 LGPD（巴西）、GDPR（欧盟和 EEA）、CCPA 与 CPRA（加州）以及 LFPDPPP（墨西哥）下的合规义务。Data Processing Addendum 承诺 Tractian 在
              GDPR 下作为数据处理方运营，并纳入用于国际传输的 EU Standard Contractual Clauses，至少说明法律团队意识到跨境数据义务。巴西 ANPD 仍在建立执法记录，但可对 LGPD
              违规处以最高达巴西实体收入 2% 的罚款；Tractian Tecnologia Ltda. 仍是按公司创立来源计算最大的非美国子公司。

              工业 AI 监管方面，EU AI Act 已随其基于风险的框架生效。部署在关键基础设施中的 AI 安全部件——预测性维护 AI
              若运行在食品安全、化工和能源工厂机械上，合理可能落入这一类别——被归为高风险，在投放欧盟市场前需要合格评定、技术文档和上市后监测。另一个制度是 EU Cyber Resilience Act，已于 2024 年
              12 月生效，面向带数字元素产品制造商的报告义务将在 2026 年 9 月开始适用。Tractian 的 Smart Trac 传感器正是 CRA 针对的连接型 IoT 硬件设备。CFIUS 仍是背景风险：尽管
              Tractian 现在总部在 Atlanta，但其巴西出生的创始团队和巴西子公司意味着，未来大额美国投资者 tranche 或战略收购，可能需要在扩大的 FIRRMA 范围下接受 CFIUS 审查。公司的
              Master License and Services Agreement 明确要求 Tractian 执行的安装遵守 OSHA，这在现场工程师进入潜在危险制造环境时带来工作场所责任敞口。

              截至运行日，公开记录中没有发现针对 Tractian 的活跃监管执法、诉讼或 IP 争议。没有可见诉讼是正面信号，但公司私营状态和巴西法律登记透明度有限，意味着尽调必须包括覆盖三大运营司法辖区的正式法律清查。
