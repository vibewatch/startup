  - id: TV002
    title: 投资论点 vs. 反论点
    columns:
      - 论点
      - 支撑证据
      - 何种情况会改变判断
    rows:
      - - 庞大但渗透不足的 MRO 市场，叠加 AI 顺风
        - 全球制造业停机在美国每年造成 $50B 成本；使用 AI 状态监测的工厂少于 15%
        - 市场增长停滞，或竞争性免费 / 开源平台让品类商品化
      - - 自有硬件传感器带来专有数据飞轮
        - 现场 100,000+ 个传感器生成时间序列数据集，竞争对手难以复制
        - 开放传感器标准或第三方传感器聚合，让竞争对手取得数据平价
      - - 企业客户验证，且拥有全球头部 logo
        - Bosch、Kraft Heinz、Caterpillar、Goodyear、Stellantis、Whirlpool 均由官方和第三方来源确认
        - 流失两个或更多锚定客户，或公开案例研究被撤回
      - - 机构投资人财团具备企业软件履历
        - Sapphire Ventures、General Catalyst、Next47、NGP Capital 均确认为 Series C 参与方
        - Series D down-round 或投资人 markdown 将发出基本面表现不佳信号
      - - 公开市场可比公司（Samsara）证明该品类规模化后退出上限超过 $10B
        - 截至 2026 年 6 月，Samsara ARR 为 $1.6B，毛利率 76%，市值 $16.9B
        - 工业 IoT 板块估值倍数压缩，或 IPO 窗口长期关闭
      - - 硬件依赖使毛利率低于纯 SaaS 可比公司
        - Tractian 将一次性传感器收入与经常性 SaaS 混合；Samsara 订阅收入占比 98%
        - 只有 Tractian 披露硬件毛利率 >40% 且软件占比提高，才能扭转判断
      - - 没有经审计财务数据；所有财务代理指标均为算法估计
        - Growjo 估算收入 $109M；没有一手来源披露 ARR、NRR 或毛利率
        - 披露经审计财务数据或正式提交 S-1，可弥合这一缺口
      - - 优先权堆栈和反稀释条款会在下行情境压缩普通股价值
        - 五轮风险融资；清算优先权未披露，但推定为全棘轮或 1x
        - IPO 情境下全部转换为普通股，可移除优先权悬置
    notes: 论点行代表一手和独立来源给出的肯定性证据；反论点行则列出已识别的风险和结构性约束。claimRefs 中的证据引用覆盖双方。
