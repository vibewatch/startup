              截至 2026-06-25，公开记录中未发现涉及 Tractian 的监管执法、数据泄露、重大客户流失、IP
              纠纷或诉讼。缺失此类记录是重要正面信号，但它更多反映公司仍为私营状态，以及巴西法律登记透明度有限，并不保证记录完全干净。形成任何结论前，必须在美国、巴西和墨西哥完成正式法律清查。
