      - number: '5.5'
        title: 信任、安全、合规与质量
        blocks:
          - type: paragraph
            body: >-
              Tractian 的安全与合规状态只有部分披露。OEE 产品页明确列出 SOC 2 Type II 审计和 ISO 27001 认证；对于处理工业生产数据的 B2B SaaS 平台，这些是行业标准基线控制。ISO
              27001 认证说明公司建立了正式的信息安全管理体系；SOC 2 Type II 则记录安全控制在持续观察期内的运行有效性，而非某个时间点的评估。Ingredion 案例研究中，该公司 IT
              总监对数据安全给出明确背书：“The fact that the data are processed outside our network gives us a lot of security.”

              Smart Trac 传感器上的 ATEX（欧洲）、IECEx（国际）和
              NFPA（美国）认证，约束危险气氛（可燃气体、粉尘、蒸气）中的电气安全和本质安全。这些硬件认证不是数据安全认证，但对目标垂直领域的产品责任和可保险性至关重要。传感器接收器的 IP69K
              等级证明其可抵御食品饮料工厂常见的高压、高温水射流清洗。

              质量缺口仍然存在。Tractian 导航中引用的 Trust Center 无法通过直接 URL 公开访问，因此无法独立验证安全控制文档的范围、深度和时效性。SOC 2
              报告期、认证审计方和被评估系统范围未公开披露。本次研究期间没有发现公开数据泄露、监管执法或产品召回。移动应用评论样本很薄（截至 2026 年 3 月，App Store 33 条评分、Google Play 8
              条评分），使得大规模生产可靠性难以评估。独立质量评论给 CMMS 平台在 Software Advice 上的整体评分为 4.8/5，但特别指出移动体验是最弱维度。
            claimRefs:
