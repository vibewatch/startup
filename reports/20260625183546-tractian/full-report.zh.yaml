      - number: '4.5'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >-
              Tractian 的公开牵引力在运营层面很强，但财务披露很薄。2024 年 12 月 Series C 公告确认，公司拥有 500 多家客户、1,000 多座工厂和 100,000 多个现场传感器。到 2026
              年中，官网引用 1,500 家美国及全球制造商，但这一更宽口径可能把活跃试点或承诺度较低的站点级合作也纳入其中。客户 ROI 证据来自公司，而非独立审计：案例库重点展示 Ingredion（单厂节省
              $1M+）、Yara（三个月内 ROI 达 700%），以及一项跨公司调研，称平均 ROI 为 383%、停机时间减少 43%。这些证据方向上有说服力，但没有第三方验证。


              与这些运营证据相比，财务缺口几乎是全覆盖。本报告审阅的官方公告、新闻稿或面向投资者材料中，没有任何 ARR、MRR 或收入数据。毛利率、经营利润率或 EBITDA
              均未披露。客户集中度数据（前十大客户收入占比）、NRR、总续约率或流失率没有公开。合同 backlog、平均合同价值或合同期限也未披露。因此，投资者只能靠运营代理指标——客户数、传感器规模、案例研究中的 ROI
              主张——来承销收入质量，而不是靠已披露收入指标。公开可比公司提示了经济模型的可能方向：Samsara 创立八年后达到 76.74% 毛利率和 $1.6B
              收入，但它所处的车队与运营大类比纯工业维护扩张更快。Tractian 的工业聚焦意味着客户基础更可防守，但每座已部署工厂的增长天花板也可能更低。
