  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Tractian 公开的 CMMS 定价呈现清晰的三层架构。Standard 计划起价为每用户每月 $60，按年计费，至少五名用户，对应最低合同额约每年 $3,600。Enterprise 计划起价为每用户每月
              $100，按年计费，至少十名用户，最低合同额为每年 $12,000，并把高级能力——SSO、自定义实体、Power BI connector、ERP 集成和专属客户经理——放在更高层级之后。Bundle 计划把
              CMMS 与 Smart Trac Ultra 状态监测传感器合并，采用需要销售沟通的自定义定价；这通常是资产密集型制造商同时部署硬件和软件时最常见的入口。Tractian 明确宣传一项「比竞争对手价格低
              15%」促销，面向 CMMS 迁移转化，释放的信号是中端市场存在活跃价格竞争，而非纯溢价定价姿态。


              除 CMMS 外，Tractian 还通过硬件传感器销售创收。Smart Trac Ultra 未公开标价；客户需向销售团队询价，销售团队包括支持安装和初始配置的 CMRP/CAT
              认证专家。这形成了结构性差异化的收入组合：软件部分是经常性、按席位收费，硬件部分则近似资本品，并可能推高初始交易规模。能源管理模块 Energy Trac 的价格同样未披露。三类收入流——CMMS SaaS
              订阅、硬件传感器销售，以及嵌在白手套部署模式中的专业服务——组合运转。没有免费试用或 freemium 层，意味着自助渠道被排除，客户获取集中在高接触的直营销售模式。对机构投资者而言，公开定价确认了软件层的
              land-and-expand SaaS 机制，但经常性收入与一次性硬件收入在总收入中的比例，是一个重要未披露缺口。
