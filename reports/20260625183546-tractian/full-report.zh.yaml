  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与品类地图
        blocks:
          - type: paragraph
            body: >-
              Tractian 可触达的竞争场域横跨五个不同类别，对应不同采购路径、预算所有者和切换壁垒。第一类也是最可直接比较的，是 AI-native 预测性维护初创公司：以自研无线传感器和 AI
              诊断为创始产品的公司，包括 Augury、KCF Technologies、Waites、Nanoprecise 和 Siemens Senseye。这些厂商与 Tractian
              服务同一类客户——资产密集型制造商里的可靠性工程师——并在传感器规格、AI 准确性和服务模式上竞争。第二类是独立 CMMS 平台：Fiix（Rockwell
              Automation）、MaintainX、UpKeep 和 Limble，它们处理工单管理和预防性维护排程，但不捆绑传感器。当客户想要集成状态监控时，Tractian 作为替代方案与这些平台竞争；当 CMMS
              客户想添加预测智能时，Tractian 又作为传感器叠加层竞争。第三类是全套 EAM 和 APM 既有厂商，主要是 IBM Maximo；其企业覆盖和 ERP 集成创造了与 Tractian
              直营销售动作完全不同的采购路径。第四类是工业 OEM 集团——Emerson AMS 和 SKF——它们在最大型工厂拥有数十年的传感器安装基础和现场服务关系。第五类是现状本身：遗留 CMMS
              记录中的基于时间的预防性维护计划、可靠性技师用手持仪器做人工振动检查，以及设备制造商按固定费用定期巡检的 OEM 服务合同。内部自建路径——把 best-of-breed 传感器、独立 CMMS
              和分析层串起来——对拥有专门可靠性工程资源的大企业来说也是真实替代方案。每一类都意味着不同的威胁向量，也意味着 Tractian 面临不同的切换成本动态。
