      - number: '7.7'
        title: 附录
        blocks:
          - type: callout
            title: 资本跑道是核心问题
            body: >-
              Tractian 没有披露 ARR、烧钱速度或资本跑道。按 $120M 融资和 $5–12M/月的估算烧钱速度，2024 年 12 月交割后的跑道约 10–24 个月，窗口将在 2025 年 Q4 至 2026
              年 Q4 之间耗尽。任何在 2025 年 Q3 之后交割的投资人，都必须把经核实的烧钱速度和跑道数据列为不可谈判的交割条件。硬件 + SaaS
              模型在运营现金消耗之外还要占用库存和资本开支现金，因此跑道估算的低端更可信。
