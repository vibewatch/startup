      - 方向
      - 时点
      - 对 Tractian 的影响
      - 尽调问题
    rows:
      - - 停机成本（每小时 $50K–$200K）
        - 驱动 ↑
        - 当前；精益库存让压力加速
        - 资产密集型工厂的可靠性买方有很强 ROI 依据
        - 用第三方验证 Tractian 客户降低停机时间的案例研究
      - - 备件交期（6–18 个月）
        - 驱动 ↑
        - 2022 年以来维持高位；复杂部件呈结构性问题
        - 漏报故障预测的财务代价被抬高
        - 跟踪交期正常化是否削弱紧迫性叙事
      - - 传感器成本下降和无线网状网络
        - 驱动 ↑
        - 持续发生；无线安装成本较有线最高可降 60%
        - 降低存量工厂部署和 SME 试点的进入门槛
        - 按单项资产确认 Tractian 相对老牌厂商的物料清单优势
      - - AI 模型准确率提升（85–95% 精度，提前 30–60 天）
        - 驱动 ↑
        - 当前；研发持续迭代
        - 建立用户信任，并推动试点扩展到多站点铺开
        - 获取供应商自报之外的独立基准数据
      - - Industry 4.0 强制要求与政府数字化计划
        - 驱动 ↑
        - 政策驱动；采纳周期 2–5 年
        - 支撑企业交易动能；降低内部审批阻力
        - 结合 Tractian 地域分布，专门评估拉美政策环境
      - - 熟练人才短缺（对 CAGR 影响 −1.9%）
        - 约束 ↓
        - 中期（2–4 年）；结构性
        - 限制部署速度；Tractian 的高服务强度支持模式可部分抵消
        - 尽调：流失账户中有多少把技能错配列为退出原因？
      - - 数据安全与隐私缺口（对 CAGR 影响 −2.8%）
        - 约束 ↓
        - 短至中期；适用 EU GDPR 和 NERC CIP
        - 受监管行业的 IT/OT 安全审查拉长销售周期
        - 审查 Tractian 的 SOC 2、ISO 27001 或同等认证
      - - 遗留协议互操作（对 CAGR 影响 −1.5%）
        - 约束 ↓
        - 当前；改造周期跨多年
        - 存量工厂的集成成本可能超过传感器硬件成本
        - 评估 Tractian 的 OPC-UA / MQTT / PLC 集成库深度
    notes: 驱动和约束百分比来自 Mordor Intelligence 的制约因素影响模型；它们是方向性估计，并非对已发布基础 CAGR 的可相加调整。「影响」和「尽调问题」列反映分析师判断，而非公司披露。
