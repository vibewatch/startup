      - number: '5.2'
        title: 平台架构：硬件、软件与 AI
        blocks:
          - type: paragraph
            body: >-
              Tractian 的平台在架构上很有辨识度：从 silicon 到 SaaS，整条技术栈都由自己掌控。硬件层是 Smart Trac
              传感器家族，由公司内部设计和制造。传感器监测振动（加速度计）、温度、运行时间（运动检测）和 RPM（编码器）；接收器具备 IP69K 等级，可用于严苛冲洗环境。无线通信采用专有 915 MHz 协议，宣称视距范围
              3,300 英尺，省去了多数竞品需要的网关基础设施。危险场所认证（ATEX、IECEx、NFPA）允许其部署在炼油厂、化工厂和粮食处理设施等需要本质安全设备的场景。电池续航标称为 3–5
              年，降低传感器部署的维护负担。轴承库可自动计算轴承通过频率，无需人工参数化。

              连接与云层通过 TLS 加密传输接收传感器数据，必要时使用 LTE。OEE 产品页明确称，运营经过 SOC 2 Type II 审计并获得 ISO 27001 认证。数据在客户网络外的 Tractian
              云基础设施中处理——Ingredion 的 IT 总监将这一设计称为相对网内部署的安全差异点。平台将实时数据摄入机器健康仪表盘，集中呈现一座设施内的资产状态。

              AI 引擎位于云数据层之上，驱动两条关键工作流。Auto Diagnosis™ 将故障分类模型用于传感器流，识别具体故障模式（轴承缺陷、不平衡、错位、松动及 70
              多种其他模式），并分配严重性评分。当故障达到阈值时，AI 引擎会在 TracOS 中自动创建工单，并嵌入 AI 推荐的 SOP 和备件建议。互补的 Asset GPT 能自动补全数据表、电机手册和轴承目录；AI
              转写层则把现场语音更新转为结构化文本，用于闭环记录。

              TracOS 软件栈提供工单管理、预防性维护排程（按时间、仪表和运行时间触发）、备件库存、带语音消息和文件附件的团队沟通，以及实时仪表盘。企业层客户可获得自定义实体、SSO 和用于实时分析集成的 Power BI
              连接器。公开集成目录包括 Oracle NetSuite、SAP、IBM Maximo、Power BI 和 UpKeep；CMMS 页面称其兼容 Excel 和其他既有客户系统。OEE
              模块新增数字化质量检查、废品报告和与实时生产数据相连的缺陷跟踪。

              Tractian 的 GitHub 组织（github.com/tractian，169 名关注者）显示其移动应用栈基于 Flutter；Flutter framework 包、AppAuth 以及 iOS 和
              Android 后台定位插件的 fork 也验证了这一点。该组织有 6 个公开仓库，其中 5 个是 fork，1 个是招聘挑战仓库。没有开源传感器固件、AI 模型库或 API
              SDK，说明核心差异化——传感器固件、故障分类模型和云数据管线——都保持专有，且没有公开开发者接口。
