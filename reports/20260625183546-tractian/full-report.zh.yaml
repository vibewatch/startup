      - number: '3.2'
        title: 直接同行——AI-Native 预测性维护厂商
        blocks:
          - type: paragraph
            body: >-
              Augury 是与 Tractian 最接近的直接同行，也是市场上融资最充足的 AI-native 预测性维护公司。Augury 由 Gal Shaul 和 Saar Yoskovitz 于 2011
              年在以色列创立，2021 年凭 $180M Series E 跻身独角兽，并在 2025 年追加 $75M Series F；不计更早轮次，其已确认披露资本至少为 $255M。该平台监控 40+ 个国家的
              300,000 多台机器，基于超过 1.1 billion 小时的机器监控数据。Augury 的 Machine Health 产品覆盖 200+ 种资产类型，并通过合作伙伴构建的连接器与 SAP PM、IBM
              Maximo、Infor EAM、MaintainX 和 Limble 集成，但它不包含原生 CMMS 或工单执行层——客户必须保留单独的 CMMS 订阅，才能闭合从检测到行动的回路。Augury 的 Halo
              R4000 传感器采集三轴振动、温度和磁通量，但没有危险场所 ATEX 或 IECEx 认证；超低转速设备（1–150 RPM）需要单独的 Halo U2000 超声传感器，从而扩大硬件足迹。Augury
              的诊断模型将算法 AI 与人工分析师复核结合，Tractian 的对比博客将其描述为资产数量扩大时的吞吐约束。Augury 委托 Forrester 做的 Total Economic Impact
              研究发现，复合客户三年 ROI 为 310%、净现值 $20.1M，回本期不到六个月。关键在于，Augury 声称其服务的 Fortune 500 公司多于预测性维护领域任何其他厂商；Tractian 的
              1,500 站点客户数并不能直接反驳这一点，因为 Tractian 的足迹更偏中端制造商。这个 Fortune 500 渗透差距，是 Tractian 在企业细分市场最重要的反向竞争信号。

              KCF Technologies 报告称，1,000+ 个制造地点信任其 SMARTdiagnostics 平台，客户平均取得 10x ROI，不过这些数字没有公开独立验证。与 Augury 一样，KCF
              不包含原生 CMMS；单一资产的多传感器覆盖需要其 IoT HUB 架构。Waites 提供由分析师验证的状态监测，配备 IP69K 和 C1D1 评级传感器，完全在 OT 层内运行，不需要 PLC 或 IT
              访问，并在发送前由 CAT 认证振动分析师验证每一个告警。Siemens Senseye 是纯软件平台——没有自研传感器——从既有 historian 和 IoT 基础设施摄取数据，并加入生成式 AI
              Copilot 做对话式预测分析；它在 Siemens 自动化环境内最强。Nanoprecise 提供基于 AI 的预测性维护平台，具备 SOC 2 Type II 合规和 cellular 或 WiFi
              连接，面向类似工业垂直，但披露规模较小。Tractian 公开对标这些同行时，突出多模态 Smart Trac Ultra 传感器（IP69K、ATEX、IECEx、NFPA 70 C1D1，64kHz 振动加
              200kHz 超声整合在一个设备中）和闭环 Auto Diagnosis 层作为结构性差异，并把所有同行缺少原生 CMMS 描述为其套件所填补的缺口。
