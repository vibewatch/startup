      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Tractian 的 go-to-market 在结构上是高接触、企业直营。定价模式没有 freemium 或自助路径，意味着每个新客户都从销售沟通开始。公司派出 CMRP/CAT 认证现场专家做现场安装和
              onboarding，这带来白手套服务交付成本，但也从第一天起形成粘性数据关系。商业动能的公开代理信号为正：Inc. Regionals Southeast 在 2026 年 6 月将 Tractian
              按增长轨迹排第 13 位；2024 年入选 Forbes AI 50 也在企业买方层面增加了品类可见度。


              公开证据中最具体的 land-and-expand 信号是 Ingredion 部署：它从一家工厂开始，扩张 17 次，覆盖四个国家的十多家工厂。这条路径——从约 770 个被监控资产的试点，到多国企业级
              mandate——展示了 GTM 论点：先在痛点站点拿下试点，证明可衡量 ROI，再横向扩展到客户的全球设施网络。Yara 报告称单一工厂三个月内取得 700% ROI，随后扩展到 Yara Brazil
              全部四家工厂，并最终覆盖所有 4,200 名协作者。一项针对 200 多家延长 Tractian 部署公司的调查显示，平均投资回报为 383%，停机减少 43%，可用性提升
              16%。这些指标由公司提供，并非第三方审计，但可以校准管理层在销售对话中使用的 ROI 叙事。


              公司没有公开披露 CAC、LTV、回本期或 NRR。CAC 强度的唯一代理指标是：截至 2026 年初，公司在 Atlanta、São Paulo 和 Mexico City 约有 500 名员工，高于 2024
              年底的 400 人；白手套交付模式暗示其中有相当一部分销售和客户成功资源。General Catalyst 自 2023 年起投资该公司，并明确称 Tractian 具备「multi-billion-dollar
              potential business」，同时强调客户喜爱是关键差异化信号，但没有提供量化单位经济。
