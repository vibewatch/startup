  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              Tractian 的牛市论点建立在五个彼此强化的支柱上。第一，全球工业预测性维护和 MRO 软件市场规模大，且结构性渗透不足：仅美国制造业停机每年估计就造成 $50 billion 损失，部署任何 AI
              驱动状态监测的重资产工厂不到 15%。第二，Tractian 的硬件 + 软件一体化模型形成自有数据飞轮——每个已安装传感器都会贡献振动、温度和运行时间序列数据，让 AI
              模型相对纯软件在位厂商的准确性优势不断累积。第三，公司能吸引并留住 Bosch、Kraft Heinz、Caterpillar、John Deere、Goodyear、Stellantis 和
              Whirlpool，说明真实企业需求已经超出试点部署。第四，Series C 投资人 Sapphire Ventures、General Catalyst、Next47 和 NGP Capital
              都是有强企业软件记录的机构投资人，说明该轮融资前经过了专业级尽调。第五，Samsara（NYSE: IOT）这个公开市场可比公司显示，采用硬件 + 软件模型的工业 IoT 平台在规模化后可以做到 $1.6
              billion ARR、76% 毛利率和 $17 billion 企业价值，证明这一类别的退出天花板真实存在。

              反向论点集中在证据缺口和结构性约束，它们限制了价格确信度。公司没有披露经审计收入、ARR、NRR 或毛利率；以 $722.9 million
              参考标记或更高价格进入的投资人，只能靠运营代理指标承销财务质量。硬件依赖会结构性地把混合毛利率压到纯 SaaS 可比公司以下：Samsara 以 10–12x 收入交易，部分原因是 98%
              收入为纯订阅；Tractian 的传感器硬件收入很可能压低这一比例。相对竞争对手 CMMS 报价低 15%
              的价格保证，是负面的利润率信号，指向价格竞争而非定价权。产品评论提到移动应用摩擦和频谱分析导航复杂度，是早期流失指标。客户集中风险无法量化。五轮风险融资形成的优先权堆栈，可能在下行情景或退出估值持平时显著拖累普通股回报。
