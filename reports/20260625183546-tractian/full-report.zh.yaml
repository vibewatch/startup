      - number: '6.2'
        title: 具名客户证据与部署结果
        blocks:
          - type: paragraph
            body: >
              Tractian 的案例研究库包含九个单独发布的生产部署案例，每个案例都有记录的财务和运营结果。最强证据来自 Ingredion 的 North Kansas City 工厂（单站点节省 $1M
              生产成本、$223K 维护成本，避免 168 小时停机）、Whirlpool（避免 $1M+ 成本，振动点覆盖率 95%，AI 警报验证率 85%），以及 Unilever 拉美工厂（保护 $700K+
              损失，并在短短 112 天内提前发现 19 起故障）。食品级磷酸盐供应商 ICL 通过取消一次完整年度停机，实现 41% OEE 提升，并每年恢复 400 多吨产出。


              Bosch 案例很有辨识度：Bosch 在 Tractian 的传感器流之上构建了自有 AI 工具 mAIntenance，带来重复故障减少 29%、计划性维护增加 17%。这说明大型企业客户可以在
              Tractian 数据层上叠加自定义逻辑，让平台角色超出开箱即用诊断。Pirelli 在一座 2,800 人轮胎制造工厂的部署，实现 98% 警报 check-in 率，并让被监测排气系统零故障停机——这是工业
              IoT 部署中少见的组织采用结果。


              所有已发布案例都描述生产级部署，而非概念验证试点。客户证言来自具名个人并标注角色（Maintenance Manager、Reliability Engineer、Operations
              Director），证据质量高于匿名评论片段。主要限制是，九个已发布案例全部来自 Tractian 官方公司页面；没有独立第三方审计结果公开发布。Sherwin-Williams 和 Danone
              案例是较新的补充，且结果结构一致，说明公司已形成标准化商业文档流程。
