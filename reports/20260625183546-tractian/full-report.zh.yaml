      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 分析师估算分歧过大，不能作为估值锚点
            body: >-
              Mordor Intelligence 对预测性维护市场 2031 年 $82B 的预测，与 Allied Market Research 对 2033 年 $162B 的预测相差超过 2 倍；任何把单一分析师
              TAM 数字作为锚点的估值模型，都会把大量不确定性带进来。两家公司都没有公开完整范围定义，基准年规模差异（2023–2025 年 $10.1B 对
              $14.09B）也说明两项研究测量的是不同细分市场。投资者应结合自下而上的工厂数和单厂 ARR 假设三角校验，而不是只依赖自上而下的分析师数字。
            calloutType: risk
            claimRefs:
              - CM003
              - CM005
          - type: callout
            title: SME 细分市场增长最快，但带来流失风险
            body: >-
              Mordor Intelligence 认为 SME 到 2031 年 CAGR 为 36.2%，高于大型企业，订阅定价（$50–100/asset/month）是推动采用的机制。这与 Tractian
              在进入市场上强调易部署和白手套支持的方向一致。不过，SME 账户通常总合同价值更小，对经济周期的流失敏感度更高，对技术决策的组织归属也更弱。IoT Analytics 观察到的 2024 年 IoT
              硬件支出放缓——部分由 SME 采购冻结推动——就是这一风险的预演。
            calloutType: insight
