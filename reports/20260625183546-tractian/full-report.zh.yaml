        - 按市值重估；加仓前完整重评论点
      - - 任何披露期间客户流失超过收入 10%
        - NRR 低于 90%（相当于扣除扩张后的毛流失 >10%）
        - 削弱粘性数据飞轮论点；降低 LTV/CAC；说明产品市场匹配倒退
        - 紧急开展客户背调；考虑退出
      - - 硬件供应链中断导致发货延迟超过 90 天
        - 关键传感器组件短缺，暂停新部署
        - 冻结新增 ARR 预订；客户被困在旧告警阈值上；给竞争对手切入机会
        - 评估持续时间；若超过 1 个季度，则降低持仓
      - - 流失两个或更多锚定企业客户（Bosch、Kraft Heinz、Caterpillar 等）
        - 公开撤回具名客户背书，或确认合同不续约
        - 直接削弱客户验证论点；说明更广企业客群存在流失风险
        - 重新访谈其余背调客户；问题未解决前不要继续推进
      - - 监管行动阻断关键地区的数据采集
        - EU AI Act 执法、CFIUS 审查阻断美国运营，或巴西 LGPD 执法
        - 限制可部署地区，增加合规负担，可能迫使数据本地化
        - 评估地理收入集中度；进一步承诺前建模影响
    notes: 阈值是基于类似工业 IoT 公司风险因素搭建的尽调框架。截至 2026 年 6 月运行日，上述触发项均未发生；对于已持仓或考虑持仓的投资人，它们都是前瞻性监测标准。
    claimRefs:
      - CV033
      - CV034
      - CV038
      - CV041
  - id: TV006
    title: 最终尽调问题
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 和收入结构
        - 已确认的年度经常性收入、硬件与软件收入拆分，以及最近一个完整财年的收入增速
        - 缺少 ARR，任何收入倍数都无法验证；硬件 / 软件结构决定综合毛利率和倍数压缩风险
        - 公司；要求提供经审计或审阅的财务数据或董事会材料
      - - NRR 和流失
        - Series C 交割前 12 个月的净收入留存率、总续约率和平均合同价值
        - NRR 是预测 SaaS 企业价值最有力的单一指标；低于 100% 会击穿牛市情境
        - 公司；向财务或 CFO 要求 cohort 留存分析
      - - 分业务毛利率
        - 硬件毛利率、软件 / SaaS 毛利率和综合毛利率；销售成本组成
        - 决定毛利率改善轨迹是否可实现；DCF 或按毛利率定倍数框架都需要该数据
        - 公司；要求提供含 COGS 明细的利润表
      - - 股权结构表和优先权条款
        - 截至 Series C 交割时的完整股权结构表，包括所有清算优先权、反稀释条款、pay-to-play 条款和董事会权利
        - 下行或平退出时，优先权悬置是普通股回报归零的主要机制
        - 公司；向法律顾问要求股权结构表和各轮 term sheet
      - - 客户集中度
        - 前十大客户收入占比、最大单一客户 ARR，以及未来 24 个月合同续约时间表
        - 集中度风险尚未量化；若前三大客户占 ARR >30%，流失风险具有相关性且不对称
        - 公司；向销售运营或财务要求客户收入明细
      - - 烧钱速度和 Series D runway
        - 月度现金消耗、最近月末现金余额，以及董事会批准的 runway 计划
        - 决定 Series D 的紧迫性和定价议价能力；runway 低于 12 个月会带来不利条款下的稀释风险
        - 公司；要求提供资金报告和董事会批准的运营计划
      - - 各轮清算优先权堆栈
        - 按参考估值、假设清算口径计算，全部五轮融资对应的清算优先权总金额
        - 量化普通股参与前优先权持有人取得的确切美元金额；这是回报建模的必要输入
        - 对所有系列 term sheet 做法律尽调
    notes: 所有项目都是成长阶段 Series C 私营公司投资前的标准尽调请求。缺少任一项目都构成重大缺口；若第 1–4 项同时缺失，投资人应完全推迟承诺出资。
    claimRefs:
      - CV026
      - CV037
      - CV038
