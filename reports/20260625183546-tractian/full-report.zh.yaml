        title: 资本基础、投资方与估值模糊性
        blocks:
          - type: paragraph
            body: >-
              Tractian 的融资历史足以支撑严肃的成长阶段叙事，但透明度不足以支撑投资者可能二手听到的每一个标题式说法。记录最充分的当前事件是 2024 年 12 月 Series C：官方公告和 Forbes
              报道都显示，该轮为 $120 million，由 Sapphire Ventures 领投，General Catalyst、Next47 和 NGP Capital 参投。Tracxn
              融资页面称公司五轮累计融资 $196 million，Forbes 和 AJC 则四舍五入称约 $200 million。差异在经济意义上不大，但再次说明公开摘要往往应按约数处理。估值更复杂。Tractian
              2023 年 8 月一篇文章明确称 Series B 将公司定价为 R$1 billion，但后续第三方美元估算在 Series C 和 2026 年初总部搬迁时大致聚集在 $720 million 至 $723
              million。抓取到的公开来源中，没有任何一个以公司自己的说法直接披露 2024 年 12 月 post-money 估值。因此，公司显然有动能和资本，但仅靠公开证据，确切估值标记和治理条款仍部分不透明。
