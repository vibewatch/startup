    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Tractian 面向资产密集型制造商的可靠性工程师和维护经理，覆盖食品饮料、汽车、油气、矿业、化工、纸浆造纸等行业。这些客户用被动维修和按日历排程的预防性维护混合管理设备健康。核心 job-to-be-done
              是在机器故障造成非计划停机前发现风险，派出带着正确流程的技术员，并为审计和分析记录维修过程。Tractian 的平台覆盖这条工作流的端到端，而不是只服务维护周期中的单一点。

              平台分为三条产品线。Smart Trac 是状态监测传感器和 AI 诊断层：设备夹装在旋转设备上，通过专有无线协议传输振动、温度、运行时间和 RPM 数据，并在设备端和云端运行 Fault-Finding
              Auto Diagnosis™，识别 75+ 种已编目的故障模式——包括轴承缺陷、不平衡、错位和松动——在它们升级为故障前预警。TracOS 是 AI 驱动的
              CMMS/EAM，管理工单、预防性维护计划、备件库存和团队沟通；Smart Trac 发现异常后，TracOS 会自动生成带优先级的工单，并嵌入 AI 推荐的标准作业程序。Tractian OEE
              将平台延伸到生产监测，用直接贴装或插接到机器上的夹装与插入式传感器，或接入模拟 / 数字输入、PLC 和电流读数，跟踪可用性、性能和质量。

              客户案例记录了可量化的工作流影响：Ingredion 在一个拥有 6,000 多项资产的设施内部署 770+ 个 Smart Trac 传感器，第一年避免 700 小时故障停机；该工厂 IT
              总监指出，数据在客户网络外处理，且 Tractian 提供了完整 IT/安全文档。Yara 展示了跨国际工厂的传感器部署扩大 17×。Tractian 自报的汇总调研（基于 200+ 家公司）称 ROI 为
              383%、资产可用性提升 16%、停机时间减少 43%；这些数字由公司报告，缺乏独立审计确认。

              独立评论平台对核心制造维护用例的评分持续较高（Software Advice 4.8/5.0，Coast App 27/35），但指出三项限制：移动应用评价偏弱（截至 2026 年 3 月，Apple App
              Store 33 条评分、Google Play 8 条评分，一位 G2 评论者称手机界面“very complicated”）；自定义实体和 SSO 等企业级功能被锁在最高价格层；专有软硬件耦合让客户更换
              CMMS 供应商时承担显著切换成本。
