      - number: '6.5'
        title: 集中度风险、采购摩擦与不利信号
        blocks:
          - type: paragraph
            body: >
              集中度风险完全不透明：Tractian 没有披露前大客户收入占比、客户 cohort
              收入拆分、合同期限或续约率数据。考虑到具名案例涉及非常大型的全球制造商（Bosch、Unilever、Danone、Whirlpool、Ingredion），少数企业账户贡献不成比例的 ARR
              是合理可能的，尤其是在硬件与多席位软件组合的 Bundle 层部署中。披露前，集中度风险无法量化。


              独立评论中出现采购摩擦。Coast App 评测由一家竞争性 CMMS 供应商撰写，因此方向上偏不利，但基于有记录的用户反馈；它指出三项摩擦：一位 G2 企业评论者称移动应用在手机上“very
              complicated in phones”；截至 2026 年 3 月，移动应用只有 33 条 App Store 评分和 8 条 Google Play
              评论（说明通过应用商店的直接用户采用有限）；SSO、ERP 集成和自定义字段等高级定制功能被锁定在 Enterprise 层。移动摩擦加企业功能门槛，会给中端市场客户或技术敏感型现场技术员带来采用风险。


              次级摩擦是没有任何自助或免费试用路径。每个新客户都必须从销售对话开始，然后承诺高接触度硬件安装。这限制了漏斗顶部扩张，也让 win rate
              高度依赖企业销售周期；在资产密集型工业垂直中，这类周期通常很长。GetApp 报告的 ISO 27001 和 SOC 2 Type II 认证降低了企业采购中的安全审查摩擦，部分抵消销售周期挑战。
