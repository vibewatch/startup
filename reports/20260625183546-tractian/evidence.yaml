evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Current board composition, voting control, and investor-protection terms for the Series C and earlier rounds.
    whyItMatters: Governance rights shape control, dilution protection, and downside outcomes for any new investor.
    diligencePath: >-
      Request the latest cap table, board observer schedule, investor rights agreement, and post-Series-C organizational
      chart from management.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: valuation-disclosure
    missingEvidence: Exact post-money valuation and security terms for the December 2024 Series C.
    whyItMatters: Entry price and preference stack cannot be underwritten confidently from public funding headlines alone.
    diligencePath: >-
      Request the signed term sheet, financing closing memo, and any board materials showing price per share and
      liquidation preferences.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A single management-confirmed current employee count reconciled against third-party scraping sources.
    whyItMatters: Team scale is a core maturity signal and influences sales capacity, support coverage, and burn assumptions.
    diligencePath: Request a current HRIS export or finance-approved headcount table by function and geography.
    relatedQuestionRefs:
      - QO017
    relatedTableRefs:
      - TO001
  - type: stale
    severity: minor
    topic: scale-metrics
    missingEvidence: A clean definition for whether customer-scale headlines refer to logos, plants, sites, or monitored manufacturers.
    whyItMatters: Different denominators can overstate or understate commercial traction if treated as directly comparable.
    diligencePath: Request managements KPI glossary covering customers, sites, plants, sensors, and active deployments.
    relatedQuestionRefs:
      - QO016
      - QO024
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO002 leadership coverage
    missingEvidence: A complete executive bench and formal board roster tied to the founder table.
    whyItMatters: The founder table is intentionally partial and does not show the full operating bench or governance overlay.
    diligencePath: Request a current leadership roster and board list to extend the founder table beyond the three public founders.
    relatedQuestionRefs:
      - QO008
      - QO009
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone completeness
    missingEvidence: A full internal chronology of product launches, financings, and commercial wins beyond the public highlights.
    whyItMatters: >-
      The milestone table is a public chronology of record, but private diligence may need denser sequencing for
      execution analysis.
    diligencePath: >-
      Request managements historical KPI deck or timeline appendix to reconcile every major launch, financing, and
      geographic expansion event.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: SAM and SOM sizing
    missingEvidence: >-
      Tractian's internal SAM definition by target factory count, average ARR per factory, and planned geographic
      expansion scope. No public source provides these figures.
    whyItMatters: >-
      Without Tractian's private SAM/SOM framing, any valuation model must rely on analyst top-down estimates with wide
      uncertainty ranges. The 2x divergence between Mordor and Allied top-down numbers compounds to large valuation
      swings without an anchor from the company.
    diligencePath: >-
      Request Tractian management's internal factory-count target by segment and region, current average contract value
      by factory size, and projected penetration rate assumptions for the Americas and international markets.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: market sizing methodology
    missingEvidence: >-
      Full scope definitions and inclusion criteria for Mordor Intelligence's and Allied Market Research's predictive
      maintenance market reports; both are behind paywalls.
    whyItMatters: >-
      The 2x+ spread between the two analysts' projections cannot be reconciled without knowing whether each includes
      hardware, services, adjacent condition monitoring, or energy management in their PdM TAM boundary.
    diligencePath: >-
      Procure one or both full analyst reports; alternatively, request from Tractian whether their internal market
      sizing uses a purchased analyst study and which firm's methodology they consider most accurate.
    relatedQuestionRefs:
      - QM001
      - QM002
      - QM025
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: >-
      A reconciliation of Allied Market Research's $162.1B 2033 projection versus Mordor Intelligence's $82.17B 2031
      projection; both firms appear credible but the scope difference is not publicly explained.
    whyItMatters: >-
      The estimate range is so wide that a financial model anchored to one number and evaluated against the other would
      show a 2–4x valuation swing. The market must be sized more precisely before a credible bull/bear case can be
      constructed.
    diligencePath: >-
      Ask Tractian for their own market sizing reference and scope; compare against published analyst definitions for
      CAGR base and terminal period; check MarketsandMarkets for a third data point that can triangulate between the
      two.
    relatedQuestionRefs:
      - QM002
      - QM015
  - type: missing-source
    severity: minor
    topic: predictive maintenance adoption failures
    missingEvidence: >-
      Documented cases of failed predictive maintenance deployments, customer churn due to implementation complexity, or
      AI model liability incidents. Most available sources are promotional or positive-outcome case studies.
    whyItMatters: >-
      Adoption constraints are quantified in aggregate by Mordor (−1.5% to −2.8% CAGR), but specific failure modes and
      post-deployment churn data are not publicly available, making it difficult to assess Tractian's retention profile
      independently.
    diligencePath: >-
      Review G2 negative reviews for Tractian and competitors; request customer NPS and churn data from Tractian; check
      industry forums and maintenance engineering communities for post-deployment case failures.
    relatedQuestionRefs:
      - QM023
  - type: stale
    severity: minor
    topic: Latin America market sizing
    missingEvidence: >-
      A standalone market sizing for predictive maintenance adoption in Latin America, particularly Brazil and Mexico
      where Tractian has significant presence.
    whyItMatters: >-
      Tractian's founding base and significant customer concentration is in LATAM; the Americas SAM calculation above
      uses North American weight as a proxy, which may materially understate or overstate the LATAM contribution.
    diligencePath: >-
      Request LATAM-specific segment data from analyst firms; check Brazilian manufacturing industry association
      (ABIMAQ) publications; ask Tractian for their internal LATAM factory-count estimate by industry vertical.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: multi-homing
    missingEvidence: >-
      Customer interviews or independent industry surveys confirming or denying whether large enterprise accounts deploy
      both Augury and Tractian simultaneously (e.g., Augury on critical assets and Tractian on balance-of-plant) and, if
      so, the typical per-customer wallet allocation between vendors.
    whyItMatters: >-
      If multi-homing is common among enterprise customers, Tractian's per-customer revenue ceiling is structurally
      lower than full-site deployments would suggest, and the switching cost narrative weakens. This affects both growth
      and retention modeling.
    diligencePath: >-
      Survey 20+ enterprise customers with 100+ monitored assets; specifically ask whether any other PdM vendor is
      running in the same facility and what drives the split.
    relatedQuestionRefs:
      - QP019
  - type: private-evidence-only
    severity: material
    topic: augury-competitive-scale
    missingEvidence: >-
      Independent verification of Augury's claim to serve "the most Fortune 500 companies of any vendor in the PdM
      space" and a comparable enterprise customer count for Tractian; neither company discloses an audited named
      customer list.
    whyItMatters: >-
      The Fortune 500 penetration gap, if real, indicates Augury holds higher brand trust at the enterprise tier where
      procurement budgets and multi-site deployments are largest; this is a critical factor for Tractian's long-term
      enterprise growth trajectory.
    diligencePath: >-
      Request Tractian's full named customer list and categorize by Fortune 500 / Global 2000 status; benchmark against
      Augury's publicly named references; cross-reference both lists against industry conference sponsor/participant
      rosters.
    relatedQuestionRefs:
      - QP007
      - QP016
  - type: missing-source
    severity: minor
    topic: oem-bundled-product-launch
    missingEvidence: >-
      Public announcement or product page confirming that Emerson, SKF, or ABB has launched a self-service
      software-first bundled predictive maintenance subscription targeting mid-market manufacturers in 2025–2026,
      comparable to Tractian's sensor-plus-CMMS bundle.
    whyItMatters: >-
      If a major OEM bundles sensors with a modern software subscription at mid-market pricing, it could replicate
      Tractian's value proposition with a trusted brand and existing field service relationships, compressing Tractian's
      addressable market from above.
    diligencePath: >-
      Monitor Emerson, SKF, and ABB product release cadence and pricing pages; check whether any OEM has launched a
      per-site or per-asset subscription model with integrated software.
