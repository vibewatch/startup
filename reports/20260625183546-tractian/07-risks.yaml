callouts:
  - calloutType: risk
    title: Capital Runway Is the #1 Pre-Investment Gate
    body: >-
      Tractian has not disclosed ARR, burn rate, or capital runway. The estimated burn of $5–12M/month
      on a $120M raise implies roughly 10–24 months of runway from December 2024 close—a window that
      expires between Q4 2025 and Q4 2026. Any investor closing post-Q3 2025 must obtain verified burn
      and runway data as a non-negotiable condition of close. The hardware-plus-SaaS model adds inventory
      and capex cash demands on top of operating cash burn, making the lower end of the runway estimate
      more plausible.
    claimRefs:
      - CR027
      - CR028
      - CR030
      - CR040

  - calloutType: assumption
    title: No Confirmed Adverse Events as of Run Date
    body: >-
      No regulatory enforcement actions, data breaches, significant customer losses, IP disputes, or
      litigation involving Tractian were identified in public records as of 2026-06-25. This absence is
      a material positive signal, but it reflects the company's private status and Brazilian legal-registry
      opacity rather than a guaranteed clean record. Formal legal-clearance reviews across US, Brazil,
      and Mexico are required before drawing any conclusions.
    claimRefs:
      - CR048

  - calloutType: recommendation
    title: Critical Diligence Asks Before Commitment
    body: >-
      Five disclosures are required before any investment commitment: (1) audited or management-reviewed
      financial statements showing ARR, gross margin, and burn rate; (2) cap-table and liquidation
      preference structure; (3) legal-clearance certificates from US, Brazilian, and Mexican counsel;
      (4) contract-manufacturing and component-supplier identity with inventory-buffer data; and (5)
      EU Cyber Resilience Act compliance roadmap for Smart Trac sensors ahead of the September 2026
      reporting deadline.
    claimRefs:
      - CR004
      - CR027
      - CR036
      - CR039
      - CR047
      - CR050

