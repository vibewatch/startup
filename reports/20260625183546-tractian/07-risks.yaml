  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial opacity capital risk
      missingEvidence: >-
        ARR, gross margin, monthly burn rate, and confirmed capital runway after the December 2024
        Series C; Tractian has not disclosed any of these metrics in public materials.
      whyItMatters: >-
        Without burn rate and runway data, it is impossible to assess whether Tractian can reach the
        next financing milestone or cash-flow breakeven, making capital-adequacy risk the single most
        material unresolved gap for any investor.
      diligencePath: >-
        Request audited or management-reviewed financial statements showing monthly P&L, cash flow,
        and 12-month runway projection from the CFO or finance team in the data room.
      relatedQuestionRefs:
        - QR008
        - QR027

    - type: private-evidence-only
      severity: blocking
      topic: supply chain hardware manufacturing
      missingEvidence: >-
        Identity of contract manufacturers and semiconductor component suppliers for Smart Trac Ultra
        sensors, inventory buffer levels, and supplier-diversity documentation.
      whyItMatters: >-
        Without supplier identity and concentration data, the supply-chain disruption risk cannot be
        quantified; a single-source component dependency analogous to those Samsara documents would
        represent a material revenue-delivery risk.
      diligencePath: >-
        Request supplier list, single-source vs. dual-source analysis, and inventory-buffer schedule
        from operations or supply-chain team; verify against contract-manufacturing agreements.
      relatedQuestionRefs:
        - QR012

    - type: missing-source
      severity: material
      topic: customer concentration risk
      missingEvidence: >-
        Top-10 customer revenue concentration, dollar-based net revenue retention, and gross revenue
        retention by customer cohort are entirely absent from public disclosures.
      whyItMatters: >-
        Customer concentration risk directly affects revenue predictability; without NRR/GRR data,
        it is impossible to assess whether the land-and-expand model is delivering durable expansion
        or whether a few anchor logos dominate ARR.
      diligencePath: >-
        Request top-10 customer revenue share (% of ARR), cohort-level NRR and GRR, and
        multi-site expansion data by named customer in the data room.
      relatedQuestionRefs:
        - QR025

    - type: private-evidence-only
      severity: material
      topic: IP patent portfolio
      missingEvidence: >-
        Confirmation of patent grants (vs. filings) for Smart Trac and Auto Diagnosis technology;
        no granted patents were found in public patent databases during this research run.
      whyItMatters: >-
        A patent portfolio consisting only of pending applications provides weaker IP protection than
        granted patents; competitors could argue prior art or design around pending claims if enforcement
        were sought.
      diligencePath: >-
        Request full patent-filing list with grant status, jurisdiction, and claims scope; engage IP
        counsel to assess freedom-to-operate and enforceability of key claims.
      relatedQuestionRefs:
        - QR009

    - type: missing-source
      severity: material
      topic: SLA benchmark comparison
      missingEvidence: >-
        No direct comparison of Tractian's 99.70% SLA against peer CMMS or industrial IoT platforms
        (e.g., Augury, Samsara, IBM Maximo) was available in public sources.
      whyItMatters: >-
        If 99.70% is below the industry standard (many enterprise SaaS companies offer 99.9% or
        higher), this represents a competitive disadvantage and a customer-stickiness risk.
      diligencePath: >-
        Review competitor SLA terms; request Tractian's historical uptime data and service-credit
        issuance history to benchmark against claimed guarantee.
      relatedQuestionRefs:
        - QR017

    - type: missing-source
      severity: material
      topic: regulatory legal history enforcement
      missingEvidence: >-
        Tractian's litigation history, regulatory correspondence, and enforcement records across US,
        Brazil, and Mexico are not available in public sources due to the company's private status
        and Brazilian legal-registry opacity. The TR002 regulatory register cannot be confirmed as
        exhaustive without formal legal-clearance reviews.
      whyItMatters: >-
        The regulatory risk register (TR002) covers identified obligations but cannot confirm whether
        active enforcement inquiries, ANPD correspondence, or pending litigation exist in non-public
        records, creating a material gap in the legal due-diligence picture.
      diligencePath: >-
        Engage legal counsel in each operating jurisdiction (US, Brazil, Mexico) to conduct litigation
        search, ANPD/INAI correspondence review, and general legal clearance before investment close.
      relatedQuestionRefs:
        - QR001
        - QR020
      relatedTableRefs:
        - TR002

