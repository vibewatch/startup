        - Multi-site expansion model reduces single-account concentration over time
        - Medium
    notes: >-
      Counterparty names for cloud infrastructure and component suppliers are not publicly disclosed by
      Tractian; entries are based on industry-standard inference and analogous disclosures from Samsara's
      10-K. Customer anchor-concentration data is unavailable from public sources.
