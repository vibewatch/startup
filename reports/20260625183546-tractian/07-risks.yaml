      - CR032
      - CR033
      - CR036
      - CR039
      - CR041
      - CR044

  - id: TR006
    title: Mitigation and Kill Criteria Table
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Capital adequacy
        - Series D announcement or confirmed bridge / venture debt
        - No new financing by Q4 2026 given estimated ~12-month post-Series-C runway
        - Thesis-break; require data-room burn confirmation before any investment
      - - Data breach / cybersecurity
        - Disclosure of breach, GDPR/LGPD supervisory inquiry, or FTC/state-AG action
        - Any confirmed material breach at a named enterprise customer
        - Immediate thesis review; indemnity structure and insurance coverage review
      - - Regulatory sanction
        - ANPD fine, GDPR supervisory decision, or CRA non-compliance notice
        - Any sanction with monetary penalty exceeding $1M equivalent
        - Assess recurrence risk; if systemic, downgrade to avoid
      - - CEO departure
        - Igor Marinelli departure announcement without internal successor named
        - Departure within 24 months of any investment
        - Reassess leadership bench; defer or exit depending on successor caliber
      - - Supply-chain disruption
        - Public announcement of sensor delivery delay affecting multiple customers
        - Multi-quarter delay causing >10% customer deployment backlog
        - Investigate component strategy; if unmitigated, reduces near-term revenue reliability
      - - Valuation reset (down-round)
        - Next financing round at valuation materially below $722.9M (e.g., >20% haircut)
        - Public or confirmed-private down-round announcement
        - Review anti-dilution provisions; reassess entry-price thesis
      - - EU CRA non-compliance
        - Failure to meet September 2026 reporting obligations for connected IoT hardware
        - EU market-access restriction on Smart Trac sensors
        - Assess EU revenue exposure and compliance remediation timeline
    notes: >-
      Trigger thresholds are illustrative and investor-specific; actual kill-criteria levels depend on
      position size, vintage, and fund mandate. "Thesis-break" implies that continued investment or
      increased exposure should be paused pending formal reassessment. Monitoring frequency should be
      quarterly for financial/capital triggers and event-driven for regulatory and cybersecurity triggers.
    claimRefs:
      - CR010
      - CR013
      - CR026
      - CR039
      - CR046
      - CR048

  - id: TR007
    title: Thesis-Break Triggers and Diligence Asks
    columns:
      - Category
      - Thesis-Break Trigger
      - Diligence Ask
      - Priority
    rows:
      - - Financial
        - ARR growth below 50% YoY or gross margin below 40% confirmed
        - Audited or management-reviewed income statement; burn and runway schedule
        - Critical
      - - Financial
        - Next round at valuation below $550M (>25% haircut to Dec 2024 mark)
        - Cap-table, preference-stack, and anti-dilution terms from data room
        - Critical
      - - Regulatory
        - ANPD or GDPR supervisory enforcement with material fine against any Tractian entity
        - Legal-clearance certificate from Brazilian, EU, and US counsel; LGPD audit report
        - High
      - - Regulatory
        - EU market denial for Smart Trac sensors due to CRA non-compliance post-Sep 2026
        - CRA gap assessment and compliance roadmap from product/legal team
        - High
      - - Cybersecurity
        - Confirmed material data breach at enterprise customer exposing OT process data
        - Incident-response plan; SOC 2 Type II summary; cyber-insurance policy
        - High
      - - Supply Chain
        - Disclosed single-source silicon component with >12-week lead time and no buffer
        - Supplier-diversity plan; inventory-buffer levels; backup-supplier qualification
        - High
      - - Key Person
        - CEO departure; no COO or CFO named to assume operational continuity
        - C-suite succession plan; employment agreements with vesting provisions
        - High
      - - Competition
        - Samsara or Augury launches direct CMMS product at Tractian's price point
        - Competitive win-loss data; customer-retention evidence post-competitive encounters
        - Medium
    notes: >-
      "Thesis-break" triggers represent conditions that would require formal investment-committee
      reassessment rather than routine monitoring adjustment. Priority (Critical/High/Medium) reflects the
      severity and reversibility of the event if it occurs. All diligence asks are recommended for
      completion before committing capital, regardless of trigger status.
    claimRefs:
      - CR026
      - CR028
      - CR039
      - CR041
      - CR042
      - CR048

