  - id: regulatory-legal-and-data-privacy-risk
    title: Regulatory, Legal, and Data-Privacy Risk
    body: >-
      Tractian's regulatory footprint is unusually complex for a Series C company because it
      simultaneously faces industrial-safety regulation for its hardware, data-privacy law for its
      cloud platform, and emerging AI-governance frameworks that are just entering enforcement
      windows. The company's published Privacy Policy explicitly acknowledges compliance obligations
      under LGPD (Brazil), GDPR (EU and EEA), CCPA and CPRA (California), and LFPDPPP (Mexico). The
      Data Processing Addendum commits Tractian to operate as a data processor under GDPR and includes
      EU Standard Contractual Clauses for international transfers, signaling at least a legal-team
      awareness of cross-border data obligations. The ANPD in Brazil, which is still building its
      enforcement track record, could impose fines of up to 2% of Brazilian-entity revenue on LGPD
      violations, and Tractian Tecnologia Ltda. remains the largest non-US subsidiary by original
      company founding.

      On the industrial-AI regulatory front, the EU AI Act entered into force with its risk-based
      framework. AI safety components deployed in critical infrastructure—a category that plausibly
      covers predictive-maintenance AI operating on food-safety, chemical, and energy-plant machinery—
      are classified as high-risk, requiring conformity assessments, technical documentation, and
      post-market monitoring before placement on the EU market. Separately, the EU Cyber Resilience
      Act entered force in December 2024 with reporting obligations for manufacturers of products with
      digital elements becoming operative in September 2026. Tractian's Smart Trac sensors are precisely
      the type of connected IoT hardware device the CRA targets. CFIUS remains a background risk: although
      Tractian is now Atlanta-headquartered, its Brazilian-born founding team and Brazilian subsidiary
      mean future large US-investor tranches or strategic acquisitions may warrant CFIUS review under the
      expanded FIRRMA scope. The company's Master License and Services Agreement explicitly requires
      OSHA compliance for Tractian-performed installations, which creates worksite liability exposure
      when field engineers enter potentially hazardous manufacturing environments.

      No active regulatory enforcement, litigation, or IP dispute against Tractian was identified in
      public records as of the run date. The absence of visible litigation is a positive signal, but
      the company's private status and Brazilian legal-registry opacity means diligence must include a
      formal legal-clearance review covering all three operating jurisdictions.
