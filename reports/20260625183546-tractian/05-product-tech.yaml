  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: IP
    missingEvidence: >-
      Granted patent numbers, filing jurisdictions, and scope of IP protection for
      Smart Trac sensor hardware, proprietary 915 MHz protocol, and Auto Diagnosis™
      fault classification technology.
    whyItMatters: >-
      Without confirmed patent coverage, the technology moat may rest entirely on
      trade secrets, which are harder to value and more vulnerable to reverse
      engineering or parallel innovation by well-funded competitors.
    diligencePath: >-
      Request IP schedule from Tractian during commercial due diligence; search USPTO,
      EPO, INPI (Brazil), and PCT filings under Tractian and inventor names.
    relatedQuestionRefs:
    - QE012

  - type: private-evidence-only
    severity: material
    topic: AI-accuracy
    missingEvidence: >-
      Auto Diagnosis model accuracy metrics, false-positive and false-negative rates
      across failure modes, model training data composition, and model drift
      management / retraining frequency.
    whyItMatters: >-
      If Auto Diagnosis generates excessive false positives, customer trust in
      automated work orders erodes; if it misses critical failure modes, the value
      proposition for preventing unplanned downtime breaks down.
    diligencePath: >-
      Request model performance benchmarks, confusion matrix across top-10 failure
      modes, and customer-reported false-positive rate from product team in due
      diligence; seek independent third-party validation or published benchmark study.
    relatedQuestionRefs:
    - QE026

  - type: private-evidence-only
    severity: material
    topic: roadmap
    missingEvidence: >-
      Formal 2026–2027 product roadmap covering planned releases, new capabilities,
      hardware next-generation, and API/developer-surface strategy.
    whyItMatters: >-
      Without roadmap visibility, investors cannot assess feature velocity, competitive
      response capability, or the company's strategy for closing documented gaps
      (mobile UX, developer API, OEE scale validation).
    diligencePath: >-
      Request product roadmap briefing and Q2 2026 release notes from Tractian in
      due diligence. Review LinkedIn job postings for engineering role signals.
    relatedQuestionRefs:
    - QE025

  - type: private-evidence-only
    severity: minor
    topic: real-world-range
    missingEvidence: >-
      Real-world (non-line-of-sight) 915 MHz wireless communication range in
      metal-rich factory environments with walls, machinery, and interference.
    whyItMatters: >-
      The 3,300 ft spec is LoS only; real-world factory range may be materially
      shorter, affecting receiver placement and installation costs at large facilities.
    diligencePath: >-
      Request field deployment data on receiver density per 1,000 sq ft from
      customer case studies; pilot benchmark at candidate deployment site.
    relatedQuestionRefs:
    - QE018

  - type: private-evidence-only
    severity: minor
    topic: developer-API
    missingEvidence: >-
      Public REST API, SDK, or integration documentation for enterprise customers
      who want to build custom integrations beyond the listed connectors.
    whyItMatters: >-
      Large enterprise customers with bespoke IT environments may require API access
      to integrate Tractian data into proprietary systems; absence of a public API
      signals a potential adoption barrier.
    diligencePath: >-
      Request API documentation from Tractian sales engineering team; verify whether
      a documented developer program or partner integration framework exists.
    relatedQuestionRefs:
    - QE024

  - type: private-evidence-only
    severity: minor
