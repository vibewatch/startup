- id: trust-security-compliance-quality
  title: Trust, Security, Compliance, and Quality
  body: >-
    Tractian's security and compliance posture is partially disclosed. The OEE
    product page explicitly states SOC 2 Type II audit and ISO 27001 certification,
    which are the industry-standard baseline controls for a B2B SaaS platform handling
    industrial production data. The ISO 27001 certification signals a formal
    information security management system, while SOC 2 Type II documents operational
    effectiveness of security controls over a sustained observation period rather than
    a point-in-time assessment. The Ingredion case study includes an explicit
    endorsement from that company's IT director specifically on data security: "The
    fact that the data are processed outside our network gives us a lot of security."

    ATEX (European), IECEx (international), and NFPA (U.S.) certifications on the
    Smart Trac sensor govern electrical safety and intrinsic safety in hazardous
    atmospheres (flammable gases, dusts, vapors). These hardware certifications are
    not data-security certifications but are material for product liability and
    insurability in targeted verticals. The IP69K rating on the sensor receiver
    certifies resistance to high-pressure, high-temperature water jet cleaning
    common in food and beverage plants.

    Quality gaps remain. The Trust Center referenced in Tractian's navigation is not
    publicly accessible by direct URL, so the scope, depth, and recency of documented
    security controls cannot be independently verified. The SOC 2 report period, the
    certifying auditor, and the scope of assessed systems are not publicly disclosed.
    No public breach, regulatory enforcement action, or product recall was identified
    during this research run. The mobile app's thin review footprint (33 App Store
    ratings, 8 Google Play ratings as of March 2026) makes it difficult to assess
    production reliability at scale. Independent quality reviews rate the CMMS
    platform 4.8/5 overall on Software Advice but specifically flag the mobile
    experience as the weakest dimension.

