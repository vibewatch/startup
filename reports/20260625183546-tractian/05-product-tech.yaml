callouts:
- calloutType: strength
  title: Vertical Integration Creates Durable Hardware-Software Moat
  body: >-
    Tractian is one of a very small number of industrial maintenance platforms that
    designs its own sensors, owns its wireless protocol, runs proprietary AI fault
    classification, and delivers the CMMS — all in one system. This tight coupling
    generates a compounding data advantage (every deployment adds labeled training
    data), meaningful switching costs that increase with sensor penetration, and an
    addressable market in hazardous locations (ATEX/IECEx/NFPA certified) that
    competitors without hardware certifications cannot serve.
  claimRefs:
  - CE033
  - CE034
  - CE035
  - CE036

- calloutType: risk
  title: Proprietary Coupling Is Both Moat and Lock-In Risk
  body: >-
    The same hardware-software integration that drives differentiation also creates a
    documented vendor lock-in risk for customers. Coast App's independent review
    explicitly states: "investing heavily in Tractian sensors leads to heavy reliance
    on Tractian's proprietary software, which limits flexibility and drives up costs
    if you need to switch providers." The proprietary 915 MHz protocol prevents
    third-party sensor substitution. This dynamic is a positive for Tractian's net
    revenue retention but a sales friction point in large enterprises that have formal
    technology diversification policies.
  claimRefs:
  - CE011
  - CE014
  - CE034
  - CE045

- calloutType: risk
  title: Mobile UX and Developer-Surface Gaps Are Operational Risks
  body: >-
    Tractian's mobile app received persistent negative feedback in multiple
    independent review sources: it had only 33 App Store ratings and 8 Google Play
    ratings as of March 2026, and a named G2 reviewer described the phone UI as
    "very complicated." For a platform whose core value proposition involves
    technician mobile execution on the plant floor, weak mobile UX is a deployment
    friction risk. The lack of a public API, SDK, or developer documentation also
    limits enterprise customers' ability to build custom integrations independently.
  claimRefs:
  - CE008
  - CE009
  - CE024
  - CE025

- calloutType: assumption
  title: IP Filing Status and AI Model Accuracy Are Unverified
  body: >-
    No granted patents for Tractian's core sensor diagnostics or AI classification
    technology were identified in public databases during this research run. The
    Auto Diagnosis accuracy rate, false-positive frequency, and model drift management
    practices are not publicly disclosed. Both gaps are material for an investment
    decision and should be addressed via direct diligence requests to the company.
  claimRefs:
  - CE036
  - CE037
  - CE039

