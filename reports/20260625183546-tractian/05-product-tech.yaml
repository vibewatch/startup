chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Tractian delivers an integrated industrial AI platform combining proprietary
    IoT sensors (Smart Trac), AI-powered CMMS (TracOS), and OEE production
    monitoring, marketed collectively as an Industrial Copilot. The sensor
    hardware is ATEX/IECEx/NFPA-certified, operates over a proprietary 915 MHz
    wireless protocol, and runs Auto Diagnosis™ across 75+ catalogued failure
    modes. The software layer connects to SAP, Oracle NetSuite, IBM Maximo, and
    UpKeep, and the cloud operations are audited under SOC 2 Type II with ISO
    27001 certification. The strongest verified technical differentiator is the
    tight hardware-software integration that auto-generates prioritized work orders
    from sensor anomalies; the main documented risk is vendor lock-in from that
    same proprietary coupling, combined with a mobile UX that receives recurring
    criticism in independent reviews.

sections:
- id: product-definition-and-customer-workflow
  title: Product Definition and Customer Workflow
  body: >-
    Tractian targets reliability engineers and maintenance managers at asset-heavy
    manufacturers — food and beverage, automotive, oil and gas, mining, chemicals,
    and pulp and paper — who manage equipment health through a mix of reactive
    repairs and calendar-based preventive schedules. The core customer job-to-be-done
    is detecting machine failure before it forces an unplanned shutdown, dispatching
    a technician with the right procedure, and documenting the repair for audit and
    analytics. Tractian's platform addresses that workflow end-to-end rather than
    serving a single point in the maintenance cycle.

    The platform is organized into three product lines. Smart Trac is the
    condition-monitoring sensor and AI diagnostics layer: the device clips onto
    rotating equipment, streams vibration, temperature, runtime, and RPM data over a
    proprietary wireless protocol, and runs Fault-Finding Auto Diagnosis™ on-device
    and in the cloud to detect 75+ catalogued failure modes — including bearing
    defects, imbalance, misalignment, and looseness — before they escalate to
    failures. TracOS is the AI-powered CMMS/EAM that manages work orders, preventive
    maintenance schedules, parts inventory, and team communication; when Smart Trac
    detects an anomaly, TracOS automatically generates a prioritized work order with
    embedded AI-recommended standard operating procedures. Tractian OEE extends the
    platform to production monitoring, tracking availability, performance, and quality
    using clip-on and clip-in sensors that attach directly to machines or tap into
    analog/digital inputs, PLCs, and current readings.

    Customer case studies document measurable workflow impact: Ingredion deployed
    770+ Smart Trac sensors across a facility with over 6,000 assets and avoided
    700 hours of breakdowns in the first year, with the plant's IT director noting
    that data are processed outside the customer's network and that full IT/security
    documentation was provided. Yara demonstrated a 17× expansion in sensor
    deployments across international plants. Tractian's self-reported survey
    aggregate (based on 200+ companies) claims 383% ROI, 16% improvement in asset
    availability, and 43% reduction in downtime; these figures are company-reported
    and lack independent audited confirmation.

    Independent review platforms consistently score the platform highly (4.8/5.0 on
    Software Advice, 27/35 on Coast App) for the core manufacturing maintenance use
    case while flagging three limitations: the mobile app is rated weak (33 Apple App
    Store ratings and 8 Google Play ratings as of March 2026, with one G2 reviewer
    describing the phone interface as "very complicated"); enterprise-only features
    such as custom entities and SSO are gated behind the top pricing tier; and the
    proprietary hardware-software coupling creates meaningful switching costs if a
    customer wants to change CMMS vendors.

