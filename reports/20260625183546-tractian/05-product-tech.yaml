- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User Job
  - Current Workflow (Without Tractian)
  - Tractian Solution
  - Measurable Benefit (Source)
  - Limitation
  rows:
  - - Detect bearing failure before breakdown
    - Manual vibration rounds with handheld analyser; scheduled every 30-90 days
    - Smart Trac streams 24/7; Auto Diagnosis flags bearing failure mode with severity score
    - 43% reduction in downtime (self-reported); 700 breakdown-hours avoided at Ingredion
    - Self-reported metric; independent accuracy benchmark not published
  - - Generate and assign maintenance work order
    - Technician observes fault, phones supervisor, supervisor creates paper or CMMS ticket manually
    - Auto Diagnosis triggers TracOS work order automatically with AI-recommended SOPs
    - Technician receives push alert with embedded procedure, eliminating relay delay
    - Real-world false-positive rate for auto-generated work orders not publicly disclosed
  - - Monitor production line OEE
    - Manual shift logs, separate SCADA/MES system, or no real-time tracking
    - Tractian OEE clip-on sensor captures cycle times; operator labels downtime events on mobile app
    - Claimed 20% less idle time, 57% increased uptime utilization, 12% fewer defects
    - Claims are self-reported by Tractian; no audited third-party study published
  - - Manage spare parts inventory
    - Separate spreadsheet or legacy CMMS; parts stockouts cause repair delays
    - TracOS parts inventory with automatic reorder suggestions based on work order history
    - Centralized view of parts consumption and cost per repair; reduces emergency orders
    - Accuracy of AI reorder recommendations vs. actual consumption unknown
  - - Conduct compliance-grade maintenance audit
    - Paper-based or legacy CMMS records, manual retrieval for auditor
    - TracOS documents all work orders, procedures, photos, and sign-offs; audit trail automated
    - 24/7 log of sensor readings provides timestamped evidence for equipment history
    - Regulatory compliance certifications beyond SOC 2 / ISO 27001 not confirmed
