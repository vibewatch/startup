slug: tractian
runDate: "2026-06-25"
company:
  name: Tractian
chapter:
  number: 4
  title: Financials
  summary: >-
    Tractian monetizes through three interlocking streams: per-user CMMS software subscriptions starting at
    $60/user/month, proprietary Smart Trac Ultra hardware sensors at undisclosed custom pricing, and bundled
    hardware-software packages. Public evidence establishes a $120M Series C in December 2024 at a roughly
    $722.9M post-money valuation, yet leaves ARR, gross margin, burn rate, and unit economics entirely
    undisclosed. Benchmarking Samsara's 76.74% FY2026 gross margin as the mature industrial-IoT target,
    Tractian's hardware-burdened blended margin is likely materially lower today. Capital adequacy beyond
    mid-2026 hinges on a next financing event whose trigger, terms, and dilution constitute the primary
    financial diligence blocker for any new investor.
sections:
  - id: revenue-model-pricing
    title: Revenue Model and Pricing Architecture
    body: >-
      Tractian's published CMMS pricing draws a clear three-tier architecture. The Standard plan starts at
      $60 per user per month, billed annually, with a minimum of five users, yielding a floor contract of
      roughly $3,600 per year. The Enterprise plan starts at $100 per user per month, billed annually, with
      a minimum of ten users, setting a floor of $12,000 per year and gating advanced capabilities—SSO,
      custom entities, Power BI connector, ERP integration, and a dedicated account manager—behind that
      higher tier. A Bundle plan combines the CMMS with Smart Trac Ultra condition-monitoring sensors at
      custom pricing that requires a sales conversation, which is the most common entry point for
      asset-heavy manufacturers deploying both hardware and software. Tractian explicitly advertises a
      "beat competitor pricing by 15%" promotion aimed at CMMS migration conversions, signaling active
      price competition in the mid-market rather than a pure premium-pricing posture.


      Beyond the CMMS, Tractian generates revenue from hardware sensor sales. Smart Trac Ultra pricing is
      not publicly listed; customers request a quote from a sales team that includes CMRP/CAT-certified
      experts who support installation and initial configuration. This creates a structurally differentiated
      revenue mix: the software component is recurring and per-seat, while the hardware component is
      capital-like and likely drives initial deal size. Energy Trac, the energy-management module, pricing
      is also undisclosed. Three revenue streams—CMMS SaaS subscriptions, hardware sensor sales, and
      professional services embedded in the white-glove deployment model—operate in combination. The
      absence of a free trial or freemium tier eliminates a self-serve channel and concentrates customer
      acquisition on a high-touch, direct sales model. For institutional investors, the published pricing
      confirms a land-and-expand SaaS mechanic in the software layer, but the extent of recurring vs.
      one-time hardware contribution to total revenue is a material undisclosed gap.
    claimRefs:
