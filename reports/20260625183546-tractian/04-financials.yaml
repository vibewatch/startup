  - id: gtm-sales-efficiency
    title: GTM Motion and Sales Efficiency Proxies
    body: >-
      Tractian's go-to-market is structurally high-touch and enterprise-direct. The pricing model has no
      freemium or self-serve path, meaning every new customer begins with a sales conversation. The company
      deploys CMRP/CAT-certified field experts for on-site installation and onboarding, which creates a
      white-glove service delivery cost but also generates sticky data relationships from day one. Public
      proxy signals for commercial momentum are positive: Inc. Regionals Southeast ranked Tractian number
      13 on its growth trajectory in June 2026, and the Forbes AI 50 inclusion in 2024 added category
      visibility at the enterprise buyer level.


      The most tangible land-and-expand signal in public evidence is the Ingredion deployment, which
      started at one plant and expanded 17 times to more than ten plants across four countries. That
      trajectory—from a pilot with roughly 770 monitored assets to a multi-country corporate mandate—
      illustrates the GTM thesis: close a pilot at a pain-point site, demonstrate measurable ROI, then
      expand laterally across the customer's global facility network. Yara reported 700% ROI in under three
      months at a single plant, which then justified expansion to all four of Yara Brazil's plants and
      ultimately all 4,200 collaborators. A survey of more than 200 companies with extended Tractian
      deployments showed a 383% average return on investment, 43% reduction in downtime, and a 16%
      availability improvement. These metrics are company-provided rather than third-party audited, but
      they calibrate the ROI story management uses in sales conversations.


      No CAC, LTV, payback period, or NRR figure is publicly disclosed. The only proxy for CAC intensity
      is the observation that the company employed approximately 500 workers across Atlanta, São Paulo, and
      Mexico City as of early 2026—growing from 400 in late 2024—with a substantial sales and customer
      success component implied by the white-glove delivery model. General Catalyst, which invested from
      2023 onward, explicitly described Tractian as having a "multi-billion-dollar potential business" and
      emphasized customer love as the key differentiating signal, but provided no quantified unit economics.
    claimRefs:
