figures:
  - id: FI001
    title: Revenue Model Bridge
    type: flow
    layout: wide
    summary: >-
      Shows how manufacturing customer activity converts through Tractian's three revenue streams into
      software subscriptions, hardware sales, and service-delivery revenue.
    data:
      nodes:
