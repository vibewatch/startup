callouts:
  - calloutType: risk
    title: Comprehensive financial opacity is the primary diligence blocker
    body: >-
      No ARR, gross margin, burn rate, NRR, or unit economics figure is publicly disclosed. An investor
      must rely entirely on operational proxies (customer count, sensor volume, case study ROI claims) to
      underwrite revenue quality. For any investment decision above a threshold materiality, this opacity
      demands a structured data room before commitment and makes the current public record insufficient
      for underwriting alone.
    claimRefs:
      - CI033
      - CI034
      - CI035
      - CI036
      - CI041

  - calloutType: strength
    title: Land-and-expand evidence is the strongest available financial signal
    body: >-
      The Ingredion deployment grew 17x from a single plant to 10+ plants across 4 countries. Yara
      expanded after a 700% ROI result at one site. These case studies are company-provided, not audited,
      but they illustrate a repeatable expansion mechanic that, if represented in the cohort-level NRR,
      would produce compelling LTV economics for an enterprise-focused industrial software business.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI015

  - calloutType: insight
    title: Samsara public comp sets a plausible but challenging gross margin target
    body: >-
      Samsara reached 76.74% gross margin in FY2026 on $1.6B in revenue, but it has operated for longer
      and its connected-operations platform skews more toward software than Tractian's hardware-heavy
      bundle. Tractian can plausibly reach 70%+ blended gross margin if software subscriptions grow faster
      than sensor shipments and manufacturing costs improve with scale. The timeline to that margin profile
      is the key financial modeling uncertainty and should be the first quantitative question asked in any
      Series D or secondary diligence process.
    claimRefs:
      - CI022
      - CI023
      - CI024
      - CI042

  - calloutType: assumption
    title: Burn and runway estimates are low-confidence proxies only
    body: >-
      Monthly burn of $5–12M and Series C runway of 10–24 months are estimated from public headcount data
      and industry benchmarks, not from any Tractian financial disclosure. The wide range reflects
      genuine uncertainty. Investors should treat these figures as scenario bounds for planning purposes
      only, not as verified facts.
    claimRefs:
      - CI030
      - CI031
      - CI043

