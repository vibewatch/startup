  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: arr
      missingEvidence: Current ARR and trailing 12-month ARR growth rate with quarterly progression
      whyItMatters: Without ARR, no revenue multiple or growth rate can be calculated; any valuation analysis is speculative
      diligencePath: Request audited or management-certified ARR from the Series C data room or directly from CFO in Series D diligence
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: Blended gross margin and hardware vs. software gross margin breakdown
      whyItMatters: Tractian's capital intensity story depends critically on whether hardware margin drag is temporary or structural
      diligencePath: Request income statement or gross profit bridge separated by software subscription COGS and hardware COGS from the last three fiscal years
      relatedQuestionRefs:
        - QI011
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: nrr
      missingEvidence: Net revenue retention rate by customer cohort, gross retention rate, and churn metrics
      whyItMatters: High NRR (above 120 percent) is the primary validator of the land-and-expand thesis signaled by the Ingredion and Yara case studies; cohort-level data would either confirm or undermine this premise
      diligencePath: Request NRR by annual cohort (2021, 2022, 2023, 2024) with expansion revenue separated from new logo revenue
      relatedQuestionRefs:
        - QI009
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Customer acquisition cost, average contract value by tier, median sales cycle length, and LTV/CAC ratio
      whyItMatters: White-glove enterprise sales with field deployment creates potentially elevated CAC; without this data, capital efficiency and payback cannot be assessed
      diligencePath: Request sales and marketing expense per new logo acquired and per dollar of ARR added for the past two fiscal years
      relatedQuestionRefs:
        - QI008
        - QI015
      relatedTableRefs:
        - TI003

    - type: private-evidence-only
      severity: material
      topic: burn-rate
      missingEvidence: Monthly operating burn rate, cash position post-Series C, and runway projection
      whyItMatters: The $120M Series C runway depends on burn rate; at $8–10M per month, the company may already be in or near Series D window; without this data, financing dependency risk cannot be quantified
      diligencePath: Request last audited income statement, cash flow statement, and management guidance on anticipated next financing trigger
      relatedQuestionRefs:
        - QI020
        - QI029
      relatedTableRefs:
        - TI004

    - type: private-evidence-only
      severity: material
      topic: hardware-revenue-mix
      missingEvidence: Hardware revenue as a percentage of total revenue by fiscal year, and sensor average selling price
      whyItMatters: Hardware share determines the blended gross margin trajectory; knowing the trend toward software-dominant revenue is essential to the margin path thesis
      diligencePath: Request revenue breakdown by software subscription, hardware, and services for at least the past three fiscal years
      relatedQuestionRefs:
        - QI003
        - QI013
      relatedTableRefs:
        - TI001

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-10 customer revenue concentration as a percentage of total revenue
      whyItMatters: Named enterprise customers (Bosch, Kraft Heinz, Carrier, Hyundai, Yara, Ingredion) could represent concentrated revenue risk that is not visible from public mentions alone
      diligencePath: Request customer concentration disclosure showing revenue from top 1, 3, and 10 customers as a percentage of total ARR
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: minor
      topic: contract-terms
      missingEvidence: Standard contract duration, renewal terms, payment schedule (annual vs. multi-year), and early-termination provisions
      whyItMatters: Multi-year locked contracts with upfront payment would materially improve working capital and reduce churn risk; annual contracts would expose more of the ARR to annual renewal risk
      diligencePath: Request standard contract template and distribution of contract durations across the active subscriber base
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI001

