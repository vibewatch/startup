  - id: TI003
    title: Unit Economics Table
    columns:
      - Metric
      - Value / estimate
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - ARR (Annual Recurring Revenue)
        - Not publicly disclosed
        - "N/A — private"
        - Primary revenue quality indicator for a subscription-oriented model
        - Request current ARR and trailing 12-month ARR growth rate at the next investor call or data room
      - - Gross margin (blended)
        - Not publicly disclosed; estimated 50–70% based on hardware/software mix and public comps
        - Low — estimated only; wide range reflects hardware proportion uncertainty
        - Determines whether unit economics support a capital-efficient scale path
        - Disclose blended gross margin with hardware and software broken out separately; provide cost of goods sold by segment
      - - Net Revenue Retention (NRR)
        - Not publicly disclosed
        - "N/A — private"
        - High NRR (>120%) would validate expansion revenue from multi-plant rollouts like Ingredion
        - Request trailing NRR or gross revenue retention across the 2023–2025 cohorts
      - - Customer Acquisition Cost (CAC)
        - Not publicly disclosed
        - "N/A — private"
        - High-touch enterprise sales with field service creates potentially elevated CAC relative to self-serve SaaS peers
        - Request blended sales and marketing expense per new logo and payback period in months
      - - LTV / CAC ratio
        - Not publicly disclosed
        - "N/A — private"
        - Core venture-underwriting metric for subscription businesses
        - Derivable from ARR, NRR, churn rate, and blended CAC; request all four inputs
      - - Average Contract Value (ACV)
        - Estimated $12,000–$50,000+ for CMMS; bundle contracts likely higher
        - Low — estimated from list price floors only
        - Drives revenue per sales rep productivity and determines whether the model supports enterprise-level AE compensation
        - Disclose average ACV and distribution between Standard, Enterprise, and Bundle tiers
      - - Hardware gross margin
        - Not publicly disclosed; industry benchmark for industrial IoT sensors is approximately 30–55%
        - Low — industry benchmark only; Tractian-specific unknown
        - Hardware margin drag determines the timeline to a SaaS-comparable blended margin profile
        - Request hardware gross margin as a percentage of hardware-tier revenue
      - - Monthly burn rate
        - Not publicly disclosed; estimated $5–12M per month based on employee count and function mix
        - Low — estimated from public headcount proxy
        - Determines runway from the $120M Series C and urgency of next financing event
        - Disclose current monthly operating burn including R&D, S&M, COGS, and G&A
    notes: >-
