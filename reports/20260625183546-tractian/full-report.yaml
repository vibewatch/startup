      - number: '6.4'
        title: Retention, Durability, and Expansion Signals
        blocks:
          - type: paragraph
            body: >
              No NRR, GRR, average contract length, or published churn figure is available for Tractian in any public
              source. This is a material evidence gap for an investor assessing recurring-revenue quality. The only
              proxy data comes from company-claimed aggregate benchmarks—payback in under four months on average and an
              11% average increase in asset availability—neither of which is independently verifiable.


              Despite the absence of formal retention metrics, multiple structural signals suggest stickiness. First,
              the proprietary hardware layer creates a switching cost: sensors are physically installed on plant assets,
              and replacing them means re-deploying hardware, re-training technicians, and rebuilding the
              machine-learning baseline that develops over months. Second, expansion within existing customer accounts
              is documented in at least four case studies: Ingredion is scaling across its full US/CAN footprint after
              its initial North Kansas City deployment; Unilever expanded within one quarter from initial assets to a
              second wave of 24 additional assets; ICL is entering its third deployment phase with CMMS integration and
              ISO 55001 certification planned; and Pirelli is extending coverage to additional equipment categories
              beyond the initial rollout. These within-account expansion signals point toward a land-and-expand motion
              that, if representative, implies NRR well above 100%—but the evidence is anecdotal rather than
              statistical.


              Satisfaction scores from independent review platforms are consistently high: GetApp rates Tractian at 4.8
              overall with 4.9 for ease of use and 4.6 for value for money across 85 verified reviews. SoftwareAdvice
              shows an equivalent 4.8 overall on the same review panel. These scores do not capture customers who
              churned before reviewing, creating survivorship bias, but they do corroborate active user satisfaction
              among the deployed base.
