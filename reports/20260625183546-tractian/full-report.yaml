              - CI015
          - type: callout
            title: Samsara public comp sets a plausible but challenging gross margin target
            body: >-
              Samsara reached 76.74% gross margin in FY2026 on $1.6B in revenue, but it has operated for longer and its
              connected-operations platform skews more toward software than Tractian's hardware-heavy bundle. Tractian
              can plausibly reach 70%+ blended gross margin if software subscriptions grow faster than sensor shipments
