      - number: '2.2'
        title: 'Market Sizing: Multiple Lenses and Conflicting Analyst Estimates'
        blocks:
          - type: paragraph
            body: >-
              Three distinct sizing lenses are relevant to Tractian: the predictive maintenance software and hardware
              market (narrowest), the CMMS and EAM market (adjacent), and the enterprise IoT/industrial AI market
              (broadest). Analyst estimates for the first of these differ substantially. Mordor Intelligence values the
              global predictive maintenance market at $14.09 billion in 2025, projecting growth to $18.9 billion in 2026
              and $82.17 billion by 2031 at a 34.14% CAGR. Allied Market Research takes a different starting point:
              $10.1 billion in 2023, growing at 32.2% CAGR to $162.1 billion by 2033. When Allied's 32.2% rate is
              compounded from 2023, its implied 2026 size approaches $23 billion—higher than Mordor's 2026
              estimate—suggesting materially different scope assumptions around included hardware, services, and
              industry verticals. Neither firm discloses the full inclusion criteria for free, so the estimates should
              be treated as bracketing the probable range rather than as a consensus view. The CMMS sub-market is far
              smaller and more mature: Mordor puts the 2025 global CMMS market at $1.40 billion, growing at a modest 9%
              CAGR to $2.15 billion by 2030. This contrast highlights that Tractian's long-run revenue opportunity lies
              primarily in the larger, faster-growing PdM and industrial-AI layer rather than the slower-growth
              standalone CMMS segment. The energy management systems market represents a third potential revenue pool:
              Mordor values it at $63.64 billion in 2025 growing to $150.83 billion by 2031 at 15.48% CAGR, with
              manufacturing holding 31% share. A bottom-up lens is harder to execute without private data. The
              enterprise IoT market provides a ceiling check: IoT Analytics valued total enterprise IoT spending at $269
              billion in 2023, growing 15% annually, with process automation and asset performance optimization ranked
              among the top two use cases by adoption rate. These broad numbers remind analysts that the narrow PdM
              market estimates capture only the software and hardware layer, not the broader operational value that
              IoT-enabled maintenance generates. SAM and SOM isolation are not possible from public data alone without
              knowing Tractian's internal factory-count targets and per-factory revenue assumptions; the evidence gaps
              section documents what private diligence would be needed.
