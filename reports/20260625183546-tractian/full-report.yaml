            title: Comprehensive financial opacity is the primary diligence blocker
            body: >-
              No ARR, gross margin, burn rate, NRR, or unit economics figure is publicly disclosed. An investor must
              rely entirely on operational proxies (customer count, sensor volume, case study ROI claims) to underwrite
              revenue quality. For any investment decision above a threshold materiality, this opacity demands a
              structured data room before commitment and makes the current public record insufficient for underwriting
              alone.
            calloutType: risk
