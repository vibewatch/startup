        - Auto Diagnosis AI
      rows:
        - label: Hardware maturity
          values:
            - High — ATEX/IECEx/NFPA; IP69K; 3–5yr battery; 3,300 ft range; proprietary protocol
            - N/A — software-only
            - Medium — clip-on sensor; PLC-free; no published field validation at scale
            - N/A — software-only
        - label: AI depth
          values:
            - Medium — Auto Diagnosis on-device/cloud; 75+ fault modes triggers CMMS
            - Medium — AI work order prioritization; PM interval optimization; AI transcription
            - Medium — AI identifies slowdowns and micro-stops; operator annotation loop
            - High — core AI engine; bearings library; Asset GPT; continuous retraining
        - label: Software completeness
          values:
            - Medium — sensor config and dashboards; limited standalone without TracOS
            - High — WO, PM, inventory, team comms, reporting; Enterprise SSO; Power BI
            - Medium — OEE dashboard; digital quality; shift accountability
            - Medium — fault classification; severity scoring; not independently deployable
        - label: Integration breadth
          values:
            - Medium — native TracOS integration; enterprise SAP/Maximo via TracOS
            - High — SAP, NetSuite, Maximo, UpKeep, Power BI, Excel; CMMS enrichment mode
            - Low — limited public integration details beyond Tractian platform
            - Low — internal to platform; no external AI model API disclosed
        - label: Compliance / certifications
          values:
