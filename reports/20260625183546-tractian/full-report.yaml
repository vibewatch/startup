      - number: '3.4'
        title: Industrial OEM Conglomerates and Adjacent IIoT Platforms
        blocks:
          - type: paragraph
            body: >-
              Emerson's AMS Reliability Solutions business delivers AI-driven machinery health analytics, field device
              management, and workflow orchestration for enterprise manufacturers, drawing on decades of industrial
              instrumentation heritage and a global OEM distribution channel. AMS covers vibration, field device
              diagnostics, condition monitoring, and predictive AI but is not a standalone CMMS; it is positioned as an
              enterprise reliability platform sold through Emerson's direct field organization and system integrators.
              SKF's condition monitoring portfolio covers wired online monitoring, protection systems, wireless systems,
              and portable devices, primarily serving rotating equipment reliability through SKF's global distributor
              network of bearing and power transmission specialists. SKF brings deep asset-type expertise and an
              established reseller footprint at large plants, but its condition monitoring products are not bundled with
              a CMMS or a self-service digital subscription model comparable to Tractian's.

              Samsara is a publicly traded industrial IoT company (IPO 2021) that provides AI-driven vehicle and fleet
              management, predictive maintenance for vehicles, and connected operations. While Samsara's platform
              includes predictive maintenance features, its core use case addresses vehicle telematics and commercial
              fleet operations rather than rotating equipment health inside manufacturing plants; the competitive
              overlap with Tractian is limited to facilities that manage both mobile assets and fixed-plant equipment.
              AspenTech's asset performance management software targets the heavy process industries—chemicals, oil and
              gas, energy generation—through its Aspen Mtell predictive analytics product; its primary segment is
              largely non-overlapping with Tractian's manufacturing-focused mid-market footprint. PTC's ThingWorx
              industrial IoT platform was spun off from PTC to form Velotic as of mid-2026, functioning as a broad IIoT
              development and integration platform rather than a purpose-built predictive maintenance or CMMS solution;
              it competes in the connectivity and development-platform layer, not the out-of-box sensor-to-CMMS bundle
              Tractian sells. Verdantix, an independent industrial asset management analyst firm, tracks the industrial
              AI analytics software market and forecasts growth from approximately $3.2 billion in 2025 to $9.3 billion
              by 2031 at roughly 20% CAGR, a dynamic that attracts new entrants and further reduces incumbents' ability
              to ignore the market.
