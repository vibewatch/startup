      - number: '7.3'
        title: Cybersecurity, Operational, and Supply Chain Risk
        blocks:
          - type: paragraph
            body: >-
              Tractian's security posture is anchored by ISO 27001 certification and a SOC 2 Type II audit, which are
              meaningful credibility signals but do not by themselves preclude a data breach or platform outage. The
              company's hosted software SLA commits to 99.70% monthly availability, but carves out carrier-network
              failures, force majeure, customer-infrastructure issues, and external cloud-provider outages—meaning that
              in the failure scenarios most likely to affect a distributed factory-floor monitoring system, Tractian's
              contractual remedies are limited to license-day extensions with no monetary compensation. Tractian's DPA
              acknowledges the concept of data-security incidents and commits to notifying the client within 72 hours of
              a confirmed breach, but the absence of a public bug-bounty program or disclosed penetration-test results
              makes it difficult to independently assess attack-surface exposure.

              On the supply chain side, Tractian designs and manufactures its own Smart Trac Ultra sensors,
              incorporating 4G/LTE radios, lithium batteries (3–5 year life on default settings), and multi-frequency
              vibration sensing in an IP69K-rated enclosure. This proprietary manufacturing model—analogous to what
              Samsara describes in its fiscal 2026 10-K as its dependence on joint design manufacturers and suppliers
              for critical IoT components—creates concentration risk. Samsara explicitly discloses experiencing
              component shortages tied to silicon-chip market conditions over multiple fiscal years. Tractian has not
              disclosed its contract-manufacturing partners, semiconductor suppliers, or inventory buffers, so the
              severity of its component concentration risk is unverifiable. The 4G/LTE dependency is a structural
              operational risk: the receivers hold only one day of backup sensor readings, meaning a multi-day carrier
              outage would create monitoring gaps on customer factory floors.

              Product-liability risk for hardware AI systems also warrants attention. A false negative—the AI failing to
              flag a developing bearing or motor failure—could result in unplanned downtime, safety incident, or
              property damage at a customer site. Tractian's warranty policy explicitly disclaims liability for
              "uninterrupted, error-free service or the completeness and accuracy of analytics derived from customer
              data." Independent reviewers (Coast App, GetApp) noted occasional slowness and flagged spectral-analysis
              navigation complexity, and one reviewer explicitly cited the risk of proprietary lock-in when deploying
              large sensor estates. These are operational risks that could affect renewal rates if AI accuracy does not
              meet customer expectations at scale.
