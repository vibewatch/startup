      - number: '7.6'
        title: Mitigations, Monitoring Indicators, and Kill Criteria
        blocks:
          - type: paragraph
            body: >-
              Tractian's documented mitigations are reasonable for a Series C company but leave several high-severity
              gaps unaddressed in public materials. On the regulatory side, the DPA, Privacy Policy, and MSA together
              form a legally coherent privacy-compliance framework across LGPD, GDPR, and CCPA. ISO 27001 and SOC 2 Type
              II provide credible cybersecurity credibility signals. ATEX, IECEx, and NFPA certifications address the
              most acute hardware-safety regulatory requirements. The SLA's 99.70% uptime commitment, while limited in
              remedy scope, at least establishes a published service benchmark. Battery backup in receivers (one day)
              partially mitigates short-term carrier outages.

              The most significant mitigation gaps are financial opacity (no confirmed capital adequacy window),
              supply-chain concentration (no disclosed contract manufacturer or component-supplier diversification
              data), and key-person risk (no publicly named CFO or COO). Monitoring indicators for investors should
              include: (a) headcount growth trajectory vs. revenue signals as a proxy for burn efficiency; (b) any
              regulatory enforcement notice from ANPD, GDPR supervisory authority, or FTC/state AG; (c) any reported
              platform outage or security incident at a named enterprise customer; (d) Series D announcement or bridge
              financing as capital-adequacy signal; and (e) patent grant confirmations as IP-moat signal vs.
              trade-secret dependence.

              Thesis-break triggers—events that would materially undermine the investment thesis—include: an unmitigated
              data breach at a major customer exposing operational-technology data; a regulatory sanction from ANPD or a
              GDPR supervisory authority carrying material financial penalties; a confirmed supply-chain disruption
              causing multi-quarter sensor delivery delays; a CEO departure without a credible successor announcement;
              or a next financing round at a valuation materially below the $722.9M December 2024 mark. Each of these
              would require immediate thesis reassessment rather than routine monitoring.
