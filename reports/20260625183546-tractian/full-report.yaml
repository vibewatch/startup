  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk Profile and Severity Overview
        blocks:
          - type: paragraph
            body: >-
              Tractian's risk profile is characteristic of a fast-scaling industrial AI company that combines
              proprietary hardware manufacturing with a multi-jurisdiction SaaS operation: capital-intensive,
              data-sovereign, and technically dependent on third-party infrastructure in ways the company only partially
              discloses. Public evidence supports the following severity ordering for a growth-stage investor. Financial
              and capital-adequacy risk ranks highest because the company has not disclosed ARR, gross margin, or burn
              rate, and the December 2024 Series C funds an aggressive global expansion across Atlanta, São Paulo, and
              Mexico City with no confirmed follow-on financing event in sight. Regulatory and data-privacy risk ranks
              second; Tractian explicitly manages multi-jurisdiction compliance across Brazil LGPD, EU GDPR, US
              CCPA/CPRA, and Mexico LFPDPPP, and new IoT-specific regulatory regimes—the EU Cyber Resilience Act and the
              EU AI Act—are entering active enforcement windows in 2026. Supply-chain and hardware manufacturing risk
              ranks third: the company designs and manufactures proprietary sensors with lithium batteries, 4G/LTE
              radios, and hazardous-location certifications, making it dependent on semiconductor component markets
              whose volatility Samsara explicitly documents as a material risk in its fiscal 2026 10-K. Cybersecurity
              risk is structurally significant because Tractian ingests sensitive operational-technology data from
              customer factory floors; a breach or extended outage at a major enterprise customer would be high-severity
              even if low-probability. Key-person and execution risk—particularly CEO Igor Marinelli's outsized public
              role—rounds out the top tier, followed by partner/platform dependency on cellular carriers and cloud
              infrastructure providers. No adversarial regulatory event, active litigation, or confirmed data breach was
              identified in public sources, which is a meaningful baseline positive. Residual risk in every domain is
              elevated by the company's private, under-disclosed operating posture.
