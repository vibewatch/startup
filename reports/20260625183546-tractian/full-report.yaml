  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Adjacencies, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Tractian's addressable spending sits at the overlap of four distinct but reinforcing categories. The core
              is predictive maintenance: the deployment of sensors, data pipelines, and AI analytics to anticipate
              equipment failures before they occur, displacing both reactive repair (fix after failure) and
              calendar-based preventive maintenance (scheduled service regardless of actual condition). Adjacent to the
              core is the broader CMMS and EAM software layer, which manages work orders, asset inventories, and
              maintenance scheduling. Even companies that never deploy predictive sensors typically use CMMS software,
              and the trend in 2025–2026 is to embed condition-based intelligence directly into that workflow layer
              rather than run it as a separate system. A third adjacency is industrial energy management: as plants
              integrate energy consumption data with asset health data, the monitoring and analytics infrastructure
              overlaps significantly. The fourth adjacency is industrial AI broadly—the application of machine-learning
              inference to factory operations, of which predictive maintenance is the highest-ROI and most rapidly
              adopted use case. Status-quo substitutes that Tractian displaces include OEM service contracts (where the
              equipment manufacturer runs periodic inspection visits), manual vibration checks by reliability
              technicians (handheld or walk-around instruments), and time-based preventive maintenance schedules
              embedded in existing CMMS records. The boundary exclusions relevant to sizing are: pure ERP/MES systems
              with no maintenance module, general IT infrastructure, new equipment capital expenditure, and labor costs
              of maintenance technicians themselves. Tractian's platform spans the core and CMMS adjacency directly, and
              connects to the energy adjacency through its Energy Trac module, making the total boundary wider than a
              pure PdM-only sizing would suggest.
