      - number: '8.5'
        title: Exit Readiness, Recommendation, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Tractian's exit readiness is conditional. On the positive side, the company has institutional backers with
              public-market relationships, a Forbes AI 50 listing in 2026, a named headquarters in Atlanta's technology
              corridor, a real customer base with recognizable enterprise logos, and a product architecture that would
              be strategically accretive to Rockwell Automation, Emerson, Honeywell, or an industrial conglomerate
              seeking AI-native predictive maintenance capabilities. Against those strengths, public evidence does not
              support an IPO readiness claim before the company reaches at least $500 million in ARR: the Samsara IPO
              set a practical benchmark for industrial IoT at scale, and Tractian's current scale is a fraction of
              Samsara's at its 2021 listing. The most probable near-term exit is a strategic acquisition or a large
              secondary transaction, not an IPO.

              The final recommendation is "research-more" at medium confidence with a "high" risk rating and "unknown"
              valuation stance. The strategic thesis is evidence-supported, the comparable set suggests
              fair-to-attractive pricing if Growjo's revenue estimate is directionally correct, and the investor
              syndicate is credible. But the recommendation cannot move to "track" or "buy" until the investor receives:
              (1) audited or reviewed financial statements with ARR, NRR, and gross margin broken out by hardware and
              software; (2) a clean cap table with all liquidation preferences, anti-dilution provisions, and
              board-observer rights; (3) the top-10 customer revenue concentration and contract renewal timeline; and
              (4) a board-confirmed burn rate and Series D runway plan. Absent these, any entry above the $722.9 million
              reference valuation carries unquantifiable downside risk that a disciplined investor should not accept.
            claimRefs:
              - CV006
              - CV033
              - CV034
              - CV037
              - CV038
              - CV041
              - CV042
              - CV043
          - type: table
            tableRef: TV006
