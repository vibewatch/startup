      - number: '7.5'
        title: Partner, Platform, People, and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Tractian's partner and platform risks center on three dependency clusters. First, cloud infrastructure:
              the DPA's reference to Sub-Processors confirms that Tractian relies on third-party cloud providers for
              hosting—most likely AWS or GCP based on industry norms for Brazilian-origin SaaS companies, though
              Tractian does not publicly disclose its cloud provider. A major cloud-provider outage or pricing change
              would affect Tractian's platform availability and cost structure. Second, cellular carriers: the 4G/LTE
              connectivity model means outages or coverage gaps in carrier networks—specifically flagged in the SLA as
              excluded from the uptime guarantee—could leave customer equipment unmonitored. This risk is especially
              salient in emerging-market manufacturing sites in Brazil and Mexico where carrier reliability varies.
              Third, CMRP/CAT-certified field engineers: the white-glove deployment model requires access to a
              specialized workforce; scaling hiring of certified maintenance engineers faster than the certification
              pipeline produces them could cap deployment velocity.

              Key-person risk is concentrated in CEO Igor Marinelli, who is Tractian's primary investor relations
              spokesperson, strategic voice, and the most publicly identifiable face of the company. Gabriel Lima and
              Leonardo Vieira hold senior cross-Americas roles but are less consistently featured in independent
              coverage. The absence of a disclosed CFO, CPO, or CTO (by name in public materials) makes it difficult to
              assess whether the executive bench is deep enough to sustain a next-stage scaling phase or a potential
              public-market preparation. The rapid headcount growth—from 400 to approximately 864 employees in 18
              months—creates organizational execution risk: cultural dilution, onboarding quality, and the scaling of
              the training-and-certification pipeline for field engineers all become more difficult at speed. Gartner's
              supply-chain risk taxonomy explicitly identifies third-party dependency and talent concentration as top
              operational risk categories for technology companies undergoing rapid scale-up.
