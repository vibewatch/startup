      - number: '5.2'
        title: 'Platform Architecture: Hardware, Software, and AI'
        blocks:
          - type: paragraph
            body: >-
              Tractian's platform is architecturally distinctive in that it owns the full stack from silicon to SaaS.
              The hardware layer is the Smart Trac sensor family, designed and manufactured in-house. The sensor
              monitors vibration (accelerometer), temperature, runtime (motion detection), and RPM (encoder); it
              includes an IP69K- rated receiver for hostile wash-down environments. The wireless communication uses a
              proprietary 915 MHz protocol with a claimed 3,300-foot line-of-sight range, eliminating the gateway
              infrastructure required by most competing systems. Hazardous-location certifications (ATEX, IECEx, NFPA)
              allow deployment in refineries, chemical plants, and grain-handling facilities where intrinsically safe
              equipment is required. Battery autonomy is stated as 3–5 years, which reduces maintenance overhead for
              sensor deployments. The bearings library enables automatic calculation of bearing pass frequencies without
              manual parameterization.

              The connectivity and cloud layer receives sensor data over TLS-encrypted transmission and LTE where
              required. The OEE product page explicitly states that operations are audited under SOC 2 Type II and
              certified to ISO 27001. Data are processed in Tractian's cloud infrastructure outside the customer's
              network — a design choice that Ingredion's IT director cited as a security differentiator versus
              in-network deployments. The platform provides real-time data ingestion into machine health dashboards that
              centralize asset status across a facility.

              The AI engine sits above the cloud data layer and drives two key workflows. Auto Diagnosis™ applies fault
              classification models to sensor streams to identify specific failure modes (bearing defects, imbalance,
              misalignment, looseness, and over 70 additional patterns) and assigns severity scores. When a fault
              reaches a threshold, the AI engine triggers automatic work order creation in TracOS with embedded
              AI-recommended SOPs and parts suggestions. A complementary Asset GPT capability autocompletes data sheets,
              motor manuals, and bearing catalogs, and an AI transcription layer converts spoken field updates into
              structured text for closed-loop documentation.

              The TracOS software stack provides work order management, preventive maintenance scheduling (time-,
              meter-, and runtime-triggered), parts inventory, team communication with voice messaging and file
              attachments, and real-time dashboards. Enterprise-tier customers gain custom entities, SSO, and a Power BI
              connector for live analytics integration. The stated integration catalog includes Oracle NetSuite, SAP,
              IBM Maximo, Power BI, and UpKeep; the CMMS page describes compatibility with Excel and other existing
              customer systems. The OEE module adds digital quality inspections, scrap reporting, and defect tracking
              linked to live production data.

              Tractian's GitHub organization (github.com/tractian, 169 followers) reveals a Flutter-based mobile app
              stack, confirmed by forks of Flutter framework packages, AppAuth, and background-location plugins for iOS
              and Android. The organization has 6 public repositories, of which 5 are forks and 1 is a hiring challenges
              repository. The absence of open-source sensor firmware, AI model libraries, or API SDKs confirms that core
              differentiation — the sensor firmware, fault classification models, and cloud data pipeline — is kept
              proprietary with no public developer surface.
