    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Tractian presents itself as an industrial operating-system company rather than a single-purpose sensor
              vendor or basic CMMS. Across its English and Portuguese company pages, it says the mission is to eliminate
              industrial downtime worldwide and to bridge the gap between humans and machines on the shop floor. That
              framing matters because the company is not only selling predictive maintenance alerts. The fetched product
              pages show a broader stack that combines Smart Trac condition-monitoring sensors, TracOS CMMS/EAM
              workflows, and Energy Trac monitoring into one operating layer for maintenance and reliability teams.
              Official copy repeatedly describes this bundle as an Industrial Copilot, while Y Combinator compresses the
              idea even further by calling Tractian physical AI for asset-heavy industries. The current product and
              sector footprint is therefore best understood as a vertically integrated hardware-plus-software platform
              focused on food and beverage, automotive, mining and metals, chemicals, agriculture, consumer goods, oil
              and gas, and pulp and paper plants where downtime carries disproportionate operational cost.
