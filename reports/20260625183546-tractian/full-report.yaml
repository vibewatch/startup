      - number: '4.5'
        title: Public Traction Versus Private-Metric Gaps
        blocks:
          - type: paragraph
            body: >-
              Tractian's publicly visible traction is operationally strong but financially thin. The December 2024
              Series C announcement confirmed more than 500 customers, more than 1,000 factories, and more than 100,000
              sensors in the field. By mid-2026 the homepage cited 1,500 U.S. and global manufacturers, though this
              broader framing may include active-trial or less committed site-level engagements alongside contracted
              accounts. Customer ROI evidence is company-provided rather than independently audited: the case study
              library prominently features Ingredion ($1M+ savings at a single plant), Yara (700% ROI in under three
              months), and a cross-company survey showing 383% average ROI and 43% downtime reduction. These are
              directionally compelling but not third-party verified.


              Against this operational evidence, the financial gaps are comprehensive. No ARR, MRR, or revenue figure
              has appeared in any official announcement, press release, or investor-facing material reviewed for this
              report. No gross margin, operating margin, or EBITDA figure is disclosed. No customer concentration data
              (top-ten customer revenue share), NRR, gross renewal rate, or churn figure is public. No contracted
              backlog, average contract value, or contract duration is disclosed. The result is that an investor must
              underwrite revenue quality on the basis of operational proxies—customer count, sensor volume, case-study
              ROI claims—rather than on reported revenue metrics. The public comp suggests where the economics could go:
              Samsara reached 76.74% gross margin and $1.6B in revenue eight years post-founding, but it operates in a
              broader fleet-and-operations category that scales faster than pure-industrial maintenance. Tractian's
              industrial focus implies both a more defensible customer base and a potentially lower growth ceiling per
              installed factory.
