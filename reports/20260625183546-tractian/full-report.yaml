      - number: '5.3'
        title: Deployment, Integration, Reliability, Support, and Roadmap
        blocks:
          - type: paragraph
            body: >-
              Tractian describes its deployment as minimal-training-required, with a simple data-import tool for
              spreadsheets and existing systems. The company provides white-glove onboarding through a team of
              maintenance specialists that guides new customers through sensor installation and CMMS configuration. A
              dedicated account manager is available only on the Enterprise plan; Standard-plan customers access support
              via 24/7 email and live chat, plus Tractian Academy on-demand training. A Trust Center page is documented
              (referenced on the CMMS solution page and in the Coast App review) though it was not publicly reachable by
              direct URL during this research run.

              The integration model allows Tractian to operate as a standalone CMMS or as a sensor+analytics enrichment
              layer feeding a customer's existing CMMS. The OEE page and CMMS page both confirm that data flow securely
              to the cloud via TLS and LTE, with no customer-side gateway required for condition monitoring. The CMMS
              enrichment mode — where Tractian sensors feed work orders into a third-party CMMS such as SAP or Maximo —
              is positioned for enterprises that have made long-standing investments in incumbent platforms.

              The reliability model rests on continuous 24/7 sensor collection with AI-triggered work orders replacing
              fixed inspection schedules. The U.S. Department of Energy's O&M Best Practices Guide estimates that a
              functional predictive maintenance program provides 8–12% cost savings over a preventive-only program;
              Tractian's own content cites this benchmark. Sensor uptime and platform SLA details are not publicly
              disclosed, representing a diligence gap.

              Roadmap disclosure is limited. Tractian's 2026 moves — a new Atlanta headquarters at the Coda building, a
              Fast Track hiring program, and the OEE module expansion — are the main observable signals. The Forbes AI
              50 recognition and Verdantix Smart Innovators designation suggest continued investment in AI capabilities.
              No formal 2026–2027 product roadmap has been published. The most forward-looking indication is the
              continued hiring for AI engineering, sensor hardware, and platform software roles visible in the careers
              page.
