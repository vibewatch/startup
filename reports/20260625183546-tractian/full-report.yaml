      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              The December 2024 Series C closed at $120M, bringing Tractian's total disclosed capital raised to
              approximately $186.2M per Premier Alternatives' tracking of the round, or roughly $196M–$200M under the
              rounder figures used in press coverage. Premier Alternatives placed the post-money valuation at $722.9M as
              of the December 5 close date, implying a capital efficiency ratio of approximately 3.88x. The official
              Series C blog post identified use of proceeds as accelerating manufacturing AI innovation and expanding
              global reach, supported by continued scaling of the 200-plus engineering team and new hiring in
              go-to-market functions.


              No cash position, burn rate, or runway figure is publicly disclosed. Estimating from publicly available
              proxies: a 500-employee company in industrial AI with heavy R&D investment, multi-geography operations,
              and a white-glove field service model would typically carry a monthly operating cost structure of $5M–$12M
              depending on compensation levels and hardware production volume. At the lower end of that range, $120M of
              new primary capital provides approximately ten to twenty-four months of runway from the December 2024
              close, which would place the next financing trigger window between October 2025 and December 2026. This is
              consistent with no announced Series D or bridge in public coverage through the June 2026 run date of this
              report—suggesting either the company is managing carefully within the Series C allocation, or an
              undisclosed financing event has occurred. The prior rounds also provide context: the Series B in August
              2023 raised R$230M primary (approximately $46M at mid-2023 exchange rates) plus R$50M secondary, meaning
              the Series C was the largest single primary capital event by a substantial margin and signals management's
              intent to scale aggressively rather than bridge to profitability on a lean budget.


              No debt facilities, revenue-based financing, or project-finance obligations have been disclosed in any
              public source reviewed for this chapter. The 2023 Series B blog noted that total pre-Series-B cumulative
              capital was approximately R$380M (primary plus secondary), which upon conversion and the addition of the
              $120M Series C implies a venture-heavy, equity-financed balance sheet with no obvious project-finance or
              debt overhang visible from public evidence.
