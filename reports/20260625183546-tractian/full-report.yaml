            title: Proprietary Coupling Is Both Moat and Lock-In Risk
            body: >-
              The same hardware-software integration that drives differentiation also creates a documented vendor
              lock-in risk for customers. Coast App's independent review explicitly states: "investing heavily in
              Tractian sensors leads to heavy reliance on Tractian's proprietary software, which limits flexibility and
              drives up costs if you need to switch providers." The proprietary 915 MHz protocol prevents third-party
              sensor substitution. This dynamic is a positive for Tractian's net revenue retention but a sales friction
              point in large enterprises that have formal technology diversification policies.
