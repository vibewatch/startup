          - type: callout
            title: Land-and-expand evidence is the strongest available financial signal
            body: >-
              The Ingredion deployment grew 17x from a single plant to 10+ plants across 4 countries. Yara expanded
              after a 700% ROI result at one site. These case studies are company-provided, not audited, but they
              illustrate a repeatable expansion mechanic that, if represented in the cohort-level NRR, would produce
              compelling LTV economics for an enterprise-focused industrial software business.
            calloutType: strength
            claimRefs:
              - CI012
              - CI013
