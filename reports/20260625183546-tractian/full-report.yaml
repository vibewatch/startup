      - number: '8.4'
        title: Bull, Base, and Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull scenario assumes Tractian sustains 80–100 percent annual revenue growth through 2028, reaches
              $400–$500 million in ARR, achieves 60–65 percent blended gross margins as software ARR increasingly
              outpaces hardware sensor revenue, and executes an IPO or strategic acquisition at a 10–12x revenue
              multiple. At those assumptions, the exit valuation is $4–$6 billion, implying a 5–8x return on the $722.9
              million reference price over a 4-year hold. This scenario requires: (a) no Series D financing at a
              materially lower valuation, (b) NRR above 110 percent, (c) successful North American enterprise
              penetration at the $100,000-plus ACV tier, and (d) no adverse regulatory or supply-chain disruption.

              The base scenario assumes 50–70 percent revenue growth through 2028, reaching $200–$300 million in ARR,
              50–60 percent gross margins, and a strategic-acquisition exit at 8–10x revenue around 2028–2029. Exit
              valuation would be approximately $1.6–$3 billion, implying a 2–4x return on $722.9 million. This requires
              continued market leadership, execution on the Atlanta headquarters hub, and no major competitor
              convergence on the integrated sensor-plus-CMMS model.

              The bear scenario posits revenue growth decelerating below 40 percent (consistent with implementation
              complexity and hardware cycle constraints), a down round to raise Series D capital, and an exit at 4–6x
              revenue around 2028 at $300–$500 million ARR. At those numbers, exit valuation is $1.2–$3 billion, but the
              liquidation-preference stack from five rounds may consume most of that, yielding near-zero or negative
              returns on a common-equity entry at the $722.9 million post-money mark. The most likely single trigger for
              the bear case is the combination of slower-than-expected enterprise penetration in North America and a
              compressed venture exit window if the IPO market remains closed for industrial AI through 2028.
            claimRefs:
              - CV033
