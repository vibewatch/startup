      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The most powerful structural driver for predictive maintenance adoption is the cost of downtime. Mordor
              Intelligence cites unexpected line stoppages at $50,000–$200,000 per hour for high-volume manufacturers,
              and power-generation forced outages at over $2 million per day. Combined with spare-part replacement lead
              times that have stretched to 6–18 months for industrial components since 2022, the financial urgency for
              failure-prediction capability has never been stronger. A second driver is the dramatic improvement in
              sensor economics and AI model accuracy. Wireless mesh sensor networks cut installation costs up to 60%
              compared with wired equivalents, removing the capital barrier for brownfield deployments. AI models for
              bearing, pump, and motor failure prediction now achieve 85–95% precision on 30–60 day lead times per
              Mordor's industry review, compared with sub-50% precision from older statistical approaches. Cloud-native
              subscription architectures (66.55% of the PdM market by 2025) reduce total cost of ownership 30–50% versus
              on-premise builds, enabling multi-site rollouts without proportional hardware scaling. Third, Industry 4.0
              regulatory and policy pressure—including national digitization programs in Europe, North America, and
              Asia—is accelerating enterprise technology adoption: McKinsey found that 90% of manufacturing executives
              planned to invest in talent for digitization post-2020, and the 2026 Plant Engineering study confirms
              manufacturers have decisively shifted to digital-first maintenance models. Against these tailwinds sit
              four material constraints. Data-security and privacy concerns subtract approximately 2.8 percentage points
              from achievable CAGR in Mordor's restraint model, particularly for sites with OT/IT network segmentation
              requirements. The skilled-talent shortage for PdM implementation (requiring hybrid mechanical/data-science
              expertise) subtracts 1.9 points. Legacy protocol interoperability between sensors and OT systems subtracts
              1.5 points. AI model drift and liability risk (who owns a false negative that leads to a missed failure?)
              subtract another 1.2 points. IoT Analytics' 2023–2024 data adds a cautionary note: enterprise IoT hardware
              spending grew only around 5% in 2024 as customers prioritized software and delayed new sensor
              procurement—a pattern consistent with the observation that large enterprises with existing sensor estates
              are upgrading analytics software while SMEs face initial capital barriers. The combined picture is a
              market with strong structural tailwinds and genuine near-term friction: growth is real but not
              frictionless.
