companyProfile:
  summary: >-
    Tractian is an Atlanta-headquartered industrial AI company that combines proprietary condition-monitoring sensors,
    maintenance workflows, energy monitoring, and AI diagnostics into one platform aimed at reducing unplanned downtime
    in asset-heavy plants. The company was founded in 2019 by Igor Marinelli, Gabriel Lima, and Leonardo Vieira, scaled
    first across Brazil, Mexico, and the United States, and raised a $120 million Series C in December 2024 led by
    Sapphire Ventures. Public evidence supports meaningful customer adoption and strong product differentiation, but
    detailed financial disclosure remains sparse.
