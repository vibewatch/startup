  - id: FV002
    title: Valuation Sensitivity — EV/Revenue Multiple at Different Revenue Levels
    type: bar
    layout: standard
    summary: >-
      Sensitivity of the implied EV/Revenue multiple at the $722.9M reference valuation across five Tractian annual
      revenue scenarios; dotted lines show Samsara and AspenTech acquisition benchmarks.
    data:
      items:
        - label: $50M ARR scenario
          value: 14.5
          note: Above AspenTech M&A benchmark; stretched if growth <80%
        - label: $75M ARR scenario
          value: 9.6
          note: In line with Samsara (10.8x); fair for >70% growth
        - label: $109M ARR scenario (Growjo est.)
          value: 6.6
          note: Below Samsara; attractive if growth >60%
        - label: $150M ARR scenario
          value: 4.8
          note: Well below comps; highly attractive if achievable
        - label: $200M ARR scenario
          value: 3.6
          note: Deeply attractive; scenario requires >80% YoY from Growjo baseline
    approximationNotes: >-
      Revenue denominator is hypothetical except for the $109M Growjo algorithmic estimate, which is itself unverified.
      EV numerator is fixed at $722.9M Premier Alternatives estimate. Actual multiples depend on confirmed revenue and
      EV at the time of any transaction.
