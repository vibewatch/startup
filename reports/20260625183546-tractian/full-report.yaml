              Tractian's mobile app received persistent negative feedback in multiple independent review sources: it had
              only 33 App Store ratings and 8 Google Play ratings as of March 2026, and a named G2 reviewer described
              the phone UI as "very complicated." For a platform whose core value proposition involves technician mobile
              execution on the plant floor, weak mobile UX is a deployment friction risk. The lack of a public API, SDK,
