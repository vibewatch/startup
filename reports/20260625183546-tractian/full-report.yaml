  - id: FE004
    title: Tractian Product Maturity / Capability Map
    type: matrix
    layout: wide
    summary: >-
      Capability assessment across Tractian's four main product modules on five dimensions: hardware maturity, AI depth,
      software completeness, integration breadth, and compliance coverage.
    data:
      columns:
