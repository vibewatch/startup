              - CV038
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation — Research-More at Medium Confidence
            body: >-
              The strategic thesis is credible and the comparable-company set suggests fair-to-attractive pricing at the
              $722.9 million reference mark if Tractian's revenue is in the $100–150 million range with 50–80 percent
              growth. However, the complete absence of primary-source financial disclosure makes a price-sensitive
              investment call impossible. Any entry at or above the $722.9 million reference valuation should be
              conditioned on receipt of audited or reviewed financial statements, cap-table terms, and NRR data. Until
              those items are in hand, the correct posture is "research-more": monitor the company, continue developing
              investor and customer references, and commit only upon financial disclosure.
            calloutType: recommendation
            claimRefs:
              - CV026
              - CV037
              - CV038
          - type: callout
            title: Preference Overhang is the Largest Structural Risk to Returns
            body: >-
              With five financing rounds and no disclosed cap-table terms, an investor entering at secondary or Series D
              market pricing cannot model the distribution of exit proceeds without the full liquidation-preference
              schedule. If prior rounds carry 1x non-participating preferences, the aggregate preference dollar amount
              could be $120–$200 million, absorbing 16–28 percent of a $722.9 million exit value before common equity
              participates. If any round carries a 2x liquidation preference or weighted-average anti-dilution, the
              impairment to common equity in a flat or moderate exit is materially worse. This is a solvable diligence
              problem but not a risk that should be assumed away.
            calloutType: risk
            claimRefs:
              - CV007
              - CV038
          - type: callout
            title: Key Assumption — Growjo Revenue Estimate is Directionally Plausible but Unverified
            body: >-
              The most-cited revenue proxy used in this chapter—Growjo's algorithmic estimate of $109.1 million annual
              revenue for Tractian—is derived from employment-based and web-signal modeling, not from financial filings
              or disclosures. It is treated here as a directionally plausible order-of-magnitude estimate only. If
              actual ARR is materially lower (for example, $50–70 million), the EV/Revenue multiple at the reference
              valuation rises to 10–14x, which is less compelling. If ARR is materially higher (for example, $150–200
              million), the multiple compresses to 4–5x, which would be highly attractive. The investment conviction
              therefore hinges critically on obtaining the actual revenue figure.
            calloutType: assumption
            claimRefs:
              - CV022
              - CV025
              - CV026
