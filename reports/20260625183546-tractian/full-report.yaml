  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Category Map
        blocks:
          - type: paragraph
            body: >-
              Tractian's addressable competitive field spans five distinct categories that map onto different purchase
              pathways, budget owners, and switching barriers. The first and most directly comparable category is
              AI-native predictive maintenance startups: companies that built proprietary wireless sensors and AI
              diagnostics as their founding product, including Augury, KCF Technologies, Waites, Nanoprecise, and
              Siemens Senseye. These vendors share Tractian's customer type—reliability engineers at asset-heavy
              manufacturers—and compete on sensor specifications, AI accuracy, and service model. The second category is
              standalone CMMS platforms: Fiix (Rockwell Automation), MaintainX, UpKeep, and Limble, which handle work
              order management and preventive maintenance scheduling without bundled sensors. Tractian competes against
              these platforms both as a replacement when customers want integrated condition monitoring and as a sensor
              overlay when CMMS customers want to add predictive intelligence. The third category is full-suite EAM and
              APM incumbents, principally IBM Maximo, whose enterprise footprint and ERP integrations create a
              procurement pathway entirely different from Tractian's direct sales motion. The fourth category is
              industrial OEM conglomerates—Emerson AMS and SKF—that have decades of installed sensors and field service
              relationships at the largest plants. The fifth category is the status quo itself: time-based preventive
              maintenance schedules in legacy CMMS records, manual vibration checks by reliability technicians with
              handheld instruments, and OEM service contracts where equipment manufacturers conduct periodic inspection
              visits on a fixed-fee basis. The internal build path—wiring together best-of-breed sensors, a separate
              CMMS, and an analytics layer—also represents a real alternative for large enterprises with dedicated
              reliability engineering resources. Each category implies a different threat vector and a different
              switching cost dynamic for Tractian.
