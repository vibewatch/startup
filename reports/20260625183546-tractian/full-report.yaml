      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Tractian's cost structure has three distinct layers that create margin pressure uncommon in a pure-SaaS
              industrial platform. The first and most significant layer is hardware manufacturing COGS. Smart Trac Ultra
              sensors are manufactured by Tractian, use proprietary hardware design, and incorporate 4G/LTE
              connectivity, ultrasound and vibration sensing, IP69K sealing, and hazardous- location certifications
              (ATEX, IECEx, NFPA Class 1 Div 1). This level of ruggedization and certification implies material per-unit
              production cost that does not scale as quickly as software gross margin. Industrial IoT sensor gross
              margins typically range from 30% to 55% depending on volumes, versus 70%–80%+ for pure SaaS. Tractian's
              blended gross margin is not publicly disclosed, but the hardware proportion of revenue determines how far
              the consolidated margin sits below a software-only benchmark.


              The public-company benchmark most comparable to Tractian's trajectory is Samsara, which operates
              IoT-connected-operations software with a hardware-plus-software revenue model. Samsara reported a 76.74%
              gross margin in fiscal year 2026 on revenue of $1,619M. However, Samsara is materially further along its
              scale curve—where manufacturing cost-per-unit falls with volume and software becomes the dominant revenue
              contributor. Tractian at its current stage likely carries a higher hardware-revenue share and therefore a
              lower blended gross margin than Samsara's benchmark, though the exact ratio is an unresolved gap.


              The second cost layer is research and development. Tractian disclosed 200-plus engineers dedicated to R&D
              across data, software, and hardware as of the December 2024 Series C announcement, and filed 12 patents in
              2024. For a company with 400–864 total employees, that R&D intensity implies R&D expense is a
              disproportionate share of the cost base. The third cost layer is field service delivery: the
              CMRP/CAT-certified implementation team, customer success resources, and white-glove onboarding that are
              central to the GTM model. These are capitalized partially into customer acquisition but also flow through
              as cost of revenue on the software side. Capital expenditure for sensor manufacturing tooling and network
              infrastructure represents a fourth, largely undisclosed cost element. Together, these four layers make
              Tractian a capital-intensive business relative to pure-SaaS peers even at scale, and particularly so in
              the 2025–2026 growth phase.
