  - id: financing-and-valuation-context
    title: Financing and Valuation Context
    body: >-
      Tractian's capitalization history is sequential and venture-heavy. The company raised a Series A
      led by Next47, a Series B in August 2023 at a reported R$1 billion valuation (approximately
      $200–$210 million at mid-2023 BRL/USD rates) with R$230 million primary and R$50 million
      secondary, and a Series C in December 2024 for $120 million led by Sapphire Ventures with
      General Catalyst, Next47, and NGP Capital participating. Premier Alternatives placed the Series
      C post-money valuation at $722.9 million as of the December 5, 2024 close. Total disclosed
      lifetime capital raised is $186.2 million per Premier Alternatives' round-level tracking, or
      roughly $196–$200 million under the rounder press-coverage figures. Neither the company nor any
      investor has published a confirmed post-money valuation or cap-table term sheet; all valuation
      marks are third-party estimates.

      The capital efficiency ratio at the $722.9 million mark is approximately 3.88x (EV divided by
      total capital raised), which is consistent with a growth-stage Series C company that has
      deployed capital aggressively into hardware manufacturing, multi-geography sales headcount, and
      R&D. Against Growjo's algorithmic revenue estimate of $109.1 million, the implied EV/revenue
      multiple is approximately 6.6x—materially below the 10–12x at which Samsara trades as of
      June 2026 but reflective of the fact that Tractian is earlier stage and carries hardware
      revenue with structurally lower margins. Any secondary buyer or Series D investor should treat
      $722.9 million as a reference point requiring company-confirmed verification before use as a
      floor or ceiling. The Forbes company page captured a pre-Series-C snapshot (as of April 2024)
      showing total raised of $65 million at a $205 million valuation, confirming rapid multi-round
      re-pricing through December 2024.
