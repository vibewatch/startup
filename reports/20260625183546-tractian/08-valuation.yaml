  - id: TV002
    title: Investment Thesis vs. Anti-Thesis
    columns:
      - Argument
      - Supporting evidence
      - What would change the view
    rows:
      - - Large, underpenetrated MRO market with AI tailwind
        - Global manufacturing downtime costs $50B/yr in the US; fewer than 15% of plants use AI condition monitoring
        - Market growth stalls or competing free/open-source platforms commoditize the category
      - - Proprietary data flywheel from owned hardware sensors
        - 100,000+ sensors in field create time-series dataset competitors cannot easily replicate
        - Open sensor standards or third-party sensor aggregation enable competitive data parity
      - - Enterprise customer proof with global marquee logos
        - Bosch, Kraft Heinz, Caterpillar, Goodyear, Stellantis, Whirlpool confirmed in official and third-party sources
        - Loss of two or more anchor customers or public case-study withdrawals
      - - Institutional investor syndicate with enterprise software track record
        - Sapphire Ventures, General Catalyst, Next47, NGP Capital all confirmed Series C participants
        - Down-round Series D or investor markdown would signal fundamental underperformance
      - - Public-market comp (Samsara) confirms $10B+ exit ceiling for this category at scale
        - Samsara at $1.6B ARR, 76% gross margin, $16.9B market cap as of June 2026
        - Multiple compression in industrial IoT sector or long IPO closure window
      - - Hardware dependency limits gross margin relative to pure-SaaS comps
        - Tractian blends one-time sensor revenue with recurring SaaS; Samsara 98% subscription mix
        - Only reversed if Tractian reports hardware gross margin >40% and growing software share
      - - No audited financials; all financial proxies are algorithmic estimates
        - Growjo estimates $109M revenue; no primary-source ARR, NRR, or gross margin disclosed
        - Disclosure of audited financials or formal S-1 filing would close this gap
      - - Preference stack and anti-dilution provisions compress common equity value in downside
        - Five venture rounds; liquidation preferences unstated but presumed full-ratchet or 1x
        - Full common equity conversion in IPO scenario removes preference overhang
    notes: >-
      Thesis rows represent affirming evidence from primary and independent sources;
      anti-thesis rows are identified risks and structural constraints. Evidence citations in
      claimRefs cover both sides.
