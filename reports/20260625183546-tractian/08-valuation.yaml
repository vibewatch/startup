  - id: TV005
    title: Thesis-Break and Kill Triggers
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Revenue growth below 40% YoY (confirmed)
        - Audited ARR growth rate falls below 40% in any disclosed period
        - Invalidates growth-premium justification for 7–12x EV/Revenue; bear case becomes base
        - Re-price or exit; do not advance to Series D or new secondary purchase
      - - Down-round Series D financing
        - Series D prices below $722.9M post-money Series C reference
        - Signals either overpriced Series C or material business deterioration; preference stack grows
        - Mark-to-market; reassess thesis entirely before adding position
      - - Customer churn exceeds 10% of revenue in any disclosed period
        - NRR falls below 90% (equivalent to gross churn >10% net of expansion)
        - Undermines sticky-data-flywheel thesis; reduces LTV/CAC; signals product-market fit regression
        - Conduct emergency customer reference check; consider exit
      - - Hardware supply-chain disruption causing shipment delays exceeding 90 days
        - Major sensor component shortfall pausing new deployments
        - Freezes new ARR bookings; strands customers on legacy alert thresholds; enables competitor switching
        - Assess duration; if >1 quarter, reduce position
      - - Loss of two or more anchor enterprise customers (Bosch, Kraft Heinz, Caterpillar, etc.)
        - Public withdrawal of named customer reference or confirmed contract non-renewal
        - Directly undermines customer-proof thesis; signals churn risk in broader enterprise segment
        - Re-interview remaining references; do not continue without resolution
      - - Regulatory action blocking data collection in key geography
        - EU AI Act enforcement action, CFIUS review blocking US operations, or LGPD enforcement in Brazil
        - Restricts deployable geography, increases compliance burden, may force data localization
        - Assess geographic revenue concentration; model impact before further commitment
    notes: >-
      Thresholds are diligence constructs based on analogous industrial IoT company risk factors.
      None of these triggers have fired as of the June 2026 run date; all are prospective monitoring
      criteria for an investor holding or considering the position.
    claimRefs:
      - CV033
      - CV034
      - CV038
      - CV041

  - id: TV006
    title: Final Diligence Asks
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - ARR and revenue mix
        - Confirmed annual recurring revenue, hardware vs. software revenue split, and revenue growth rate for the most recent completed fiscal year
        - Without ARR, no revenue multiple can be validated; hardware/software mix determines blended margin and multiple compression risk
        - Company; request audited or reviewed financials or board deck
      - - NRR and churn
        - Net revenue retention rate, gross renewal rate, and average contract value for the 12 months prior to Series C close
        - NRR is the single most predictive metric for SaaS enterprise value; a figure below 100% collapses the bull case
        - Company; request cohort retention analysis from finance or CFO
      - - Gross margin by segment
        - Hardware gross margin, software/SaaS gross margin, and blended gross margin; cost of goods sold components
        - Determines whether margin improvement trajectory is achievable; necessary for DCF or multiple-on-margin framework
        - Company; request income statement with COGS detail
      - - Cap table and preference terms
        - Full capitalization table as of Series C close including all liquidation preferences, anti-dilution provisions, pay-to-play terms, and board rights
        - Preference overhang is the primary mechanism by which common equity returns are zeroed in downside or flat exits
        - Company; request capitalization table and series term sheets from legal counsel
      - - Customer concentration
        - Top-10 customer revenue share, largest single customer ARR, and contract renewal schedule for next 24 months
        - Unquantified concentration risk; if top-3 customers represent >30% of ARR, churn risk is correlated and asymmetric
        - Company; request customer revenue schedule from sales operations or finance
      - - Burn rate and Series D runway
        - Monthly cash burn, cash on hand as of most recent month-end, and board-approved runway plan
        - Determines urgency and pricing leverage for Series D; runway below 12 months creates dilution risk at unfavorable terms
        - Company; request treasury report and board-approved operating plan
      - - Liquidation preference stack from all rounds
        - Total liquidation preference dollar amount from all five rounds on an as-if-liquidated basis at the reference valuation
        - Quantifies the exact dollar figure preference holders receive before common equity participates; essential for return modeling
        - Legal due diligence on all series term sheets
    notes: >-
      All items are standard pre-investment diligence requests for a growth-stage Series C private
      company. Absence of any one item is a material gap; absence of items 1–4 together should
      cause an investor to defer commitment entirely.
    claimRefs:
      - CV026
      - CV037
      - CV038

