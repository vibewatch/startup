  - id: comparable-set-and-market-benchmarks
    title: Comparable Set and Market Benchmarks
    body: >-
      The closest public comparable is Samsara (NYSE: IOT), which operates an industrial IoT
      connected-operations platform with hardware IoT devices and cloud subscriptions. As of
      January 31, 2026, Samsara reported $1,618.6 million in fiscal-year 2026 revenue (29.6 percent
      YoY growth), a 76.74 percent gross margin, 12,000-plus Core Customers each generating at least
      $25,000 in ARR, and 3,194 large customers each exceeding $100,000 in ARR. No single customer
      exceeded 2 percent of ARR. As of June 25, 2026, Samsara's market capitalization was
      approximately $16.89 billion and enterprise value approximately $17.47 billion, implying a
      trailing EV/revenue multiple of approximately 10.8x. Analyst consensus for Samsara is "Buy"
      with a 12-month average price target of $44.78, representing approximately 54 percent upside
      from the June 25 closing price of $28.98—suggesting the market views current Samsara multiples
      as compressed relative to long-run fair value. The Samsara 10-K filed with the SEC for the
      period ending January 31, 2026 confirms revenue of $1,618.6 million and net loss of $9.1
      million, reflecting near-breakeven at scale.

      AspenTech (AZPN) was acquired by Emerson in March 2025 at a last-traded market cap of
      approximately $16.73 billion on FY2024 revenue of $1.127 billion, implying a transaction
      EV/revenue of approximately 14.8x. PTC (NASDAQ: PTC) carries a June 2026 market cap of
      approximately $13 billion on TTM revenue of approximately $2.998 billion, implying approximately
      4.3x EV/revenue. Rockwell Automation (NYSE: ROK) has a June 2026 market cap of $53.34 billion
      on FY2025 revenue of approximately $8.3 billion, implying approximately 6.4x EV/revenue.
      Among private peers, Augury has raised approximately $255 million through a $75 million Series
      F in 2025 and targets enterprise reliability at over 3.1 billion hours of machine data; no
      confirmed public valuation exists.

      Applied to Tractian, the public-comp range (4x–15x EV/revenue) spans an enormous spread
      because it blends slow-growth industrial conglomerates (Rockwell at 4–6x) with high-growth pure
      SaaS (Samsara at 10–12x) and M&A premiums (AspenTech at 15x). A growth-adjusted bracket of
      7–12x for a company growing faster than 50 percent with a hardware component places fair value
      at approximately $750 million to $1.3 billion on Growjo's $109 million revenue estimate—which
      brackets the $722.9 million mark as roughly at the low end of fair value if the revenue estimate
      and growth rate are accurate.
