company:
  name: Leju Robotics
chapter:
  number: 6
  title: Customers
  summary: >-
    Leju's 2025 adoption was led by data-collection and research/education demand rather than
    scaled industrial production. Public evidence shows rapid unit growth and several deployment
    signals, but it does not disclose retention, repeat-purchase, contract-duration, or
    customer-concentration metrics.
sections:
  - id: customer-mix
    title: Customer mix is broad in use case but concentrated in pre-scale demand
    body: >-
      Leju's disclosed 2025 Kuavo revenue mix points to four distinct buyer contexts rather than
      one mature end market. Data-collection centers represented 45% of Kuavo revenue, followed by
      research and education at 32.5%, commercial services at 18.7%, and industrial manufacturing
      at only 3.88%. The first two categories therefore supplied most current demand, while factory
      use remained an early-stage option rather than the economic center of the installed base.
      Smaller Roban and Aelos products add a separate education channel: reported 2025 volumes of
      91 and 3,988 units, respectively, show that unit counts across the portfolio are not
      comparable without separating full-size, mid-size, and small educational robots. The
      segmentation table preserves those distinctions, and the journey map shows the different
      adoption surfaces without implying that every buyer follows one conversion funnel.
    claimRefs: [CU003, CU006, CU007, CU008, CU013, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Unit acceleration came with lower pricing and incomplete deployment denominators
    body: >-
      Kuavo unit sales reportedly rose from 32 in 2024 to 577 in 2025, while Kuavo revenue reached
      RMB 178 million and 69.5% of company revenue. That is strong shipment evidence, but it is not
      the same as active production use: the sources do not disclose how many units were operating,
      utilization by task, repeat orders, or the number of distinct customer organizations.
      Moreover, the reported 25.56% decline in average selling price means volume growth cannot be
      read as unchanged willingness to pay. Third-party directories add current commercial signals
      but conflict in maturity: one records no public ordering listing for the tracked Kuavo model,
      another gives an indicative USD 38,000-150,000 quotation range, and a separate product
      directory labels KUAVO 5-W as in production. The trajectory table therefore separates
      disclosed company metrics from unverified procurement listings.
    claimRefs: [CU001, CU002, CU005, CU009, CU010, CU014]
    tableRefs: [TU002]
  - id: deployment-proof
    title: Deployment evidence ranges from named POC to unnamed operating claims
    body: >-
      The strongest named industrial proof in the retained evidence is a 2025 Kuavo 4 Pro
      proof-of-concept at a FAW factory for tote handling and picking. The source explicitly
      characterizes industrial manufacturing as an early-stage use case, so the trial should not
      be upgraded into a production rollout or repeat order. A separate October 2026 article
      reports 15 robots on an automotive-parts loading line, a 98% success rate, and 1,000 hours of
      continuous operation, but it does not identify the customer or link the metric to primary
      test documentation. Commercial guidance and education references are also third-party
      descriptions rather than customer-issued case studies. The proof table therefore records
      identity, production status, reported outcome, and limitation separately instead of treating
      every mention as equivalent customer validation.
    claimRefs: [CU004, CU011, CU012]
    tableRefs: [TU003]
  - id: durability-and-expansion
    title: Durability and expansion remain the central customer diligence gap
    body: >-
      Public evidence does not establish gross or net revenue retention, churn, renewal rates,
      contract duration, repeat-purchase behavior, satisfaction, top-customer concentration, or
      channel economics. Leju's education-era direct and non-direct network may lower access and
      service friction for institutional buyers, but channel reuse is not evidence that full-size
      deployments renew or expand. The disclosed use-case concentration also matters: 45% of 2025
      Kuavo revenue came from data collection, while the industrial share was 3.88%. In parallel,
      adverse industry reporting warns that Chinese humanoid capacity can run ahead of viable
      commercial demand. The underwriting case should therefore require customer-level order
      histories, active-unit and utilization cohorts, renewal or reorder evidence, and revenue
      concentration schedules before assigning durable land-and-expand economics.
    claimRefs: [CU003, CU007, CU015, CU016]
