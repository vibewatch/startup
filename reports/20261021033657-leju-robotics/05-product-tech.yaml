company:
  name: "Leju Robotics"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Leju's product surface spans full-size KUAVO humanoids, a wheeled KUAVO
    configuration, and smaller education products, with third-party descriptions
    pointing to a vertically integrated mobility, perception, OpenHarmony-based
    control, and imitation-learning stack. The evidence is substantially weaker
    on certified safety, configuration-specific reliability, customer outcomes,
    support obligations, public developer activity, and whether current maturity
    is best described as commercial or prototype.
sections:
  - id: "product-portfolio-and-workflows"
    title: "Portfolio breadth is visible, but availability is not"
    body: >-
      The externally visible portfolio is broader than a single walking demo.
      Multiple specialist directories identify KUAVO as Leju's full-size humanoid
      family, with bipedal and wheeled configurations, while a supplier profile
      also describes AELOS education robots and the smaller PANDO coding line.
      The customer workflow differs by configuration: bipedal KUAVO is positioned
      for embodied-AI research and task development; KUAVO 5-W replaces legs with
      an omnidirectional base for longer-duration industrial or service mobility;
      and AELOS targets programming instruction and competitions. This breadth
      does not establish purchase availability. ui44 tracked one active KUAVO
      record but no available listing or numeric price, and BehindRobotics called
      the series a prototype. Product diligence therefore needs a configuration
      list tied to orderability, supported tasks, warranties, and deployment
      acceptance criteria rather than a blended family-level specification.
    claimRefs: [CE001, CE005, CE007, CE009, CE011, CE012, CE013]
    tableRefs: [TE001, TE002]
  - id: "architecture-and-differentiation"
    title: "The differentiation thesis is vertical integration across body, control, and learning"
    body: >-
      Available descriptions point to an integrated architecture rather than a
      standalone robot shell. At the physical layer, Leju is associated with
      high-torque joint modules, bipedal locomotion, and a wheeled alternative.
      Perception and navigation descriptions add depth cameras, LiDAR, multimodal
      sensing, obstacle handling, and 3D SLAM. Above that, sources describe
      KaihongOS, derived from OpenHarmony, plus real-time control and large-model
      integration. The most strategically relevant layer is the reported
      teleoperation-to-imitation-learning pipeline: operators collect task data,
      GPU infrastructure trains skills, and trained packages return to the robot.
      If configuration-specific interfaces and training economics are validated,
      this stack could shorten adaptation across tasks. The current evidence does
      not isolate which components are proprietary, production-ready, open to
      customers, or dependent on Huawei, NVIDIA, or other external suppliers.
    claimRefs: [CE003, CE006, CE010, CE011, CE015]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: "maturity-deployment-and-support"
    title: "Market-facing activity is evident; production maturity remains unresolved"
    body: >-
      Leju is not operating in private-only development: The Robot Report recorded
      KUAVO's presence at Automation World 2026, and Humanoid Index labels the
      company commercial. Other records describe intended manufacturing,
      logistics, research, retail, and service uses, and one sourcing directory
      lists a wide quotation range and a 60-90 day lead time. These indicators are
      evidence of market engagement, not proof of repeatable production economics
      or field reliability. The same pool contains a direct maturity conflict:
      BehindRobotics labels KUAVO a prototype, while ui44 reports no currently
      available listing. No retained source supplies configuration-level order
      history, acceptance-test results, mean time between failures, support
      response times, warranty reserves, upgrade policy, or a dated roadmap.
      Underwriting should treat current maturity as configuration-dependent until
      Leju reconciles these external labels with signed orders and fleet records.
    claimRefs: [CE002, CE005, CE007, CE008, CE012, CE013]
  - id: "trust-safety-and-technical-risk"
    title: "Safety and operational proof lag the breadth of technical claims"
    body: >-
      Trust and safety disclosures are the largest product-technology weakness in
      the assigned evidence. Humanoid.Guide says KUAVO 5-W is intended for shared
      industrial and service spaces and references EMC testing, but explicitly
      notes that no collaborative-safety certification was published. A separate
      technical profile lists no published environmental ratings, battery
      capacity, runtime, charge time, payload, grip force, or sensor layout for
      the family it describes. Those omissions matter because safe coexistence,
      duty cycle, manipulation envelope, and maintenance burden determine whether
      a humanoid can replace or merely supplement fixed automation. The pool also
      contains no public repository, package telemetry, issue tracker, security
      documentation, incident history, or practitioner-community signal. This is
      not evidence that incidents or controls are absent; it means architecture,
      cybersecurity, privacy, quality management, and field reliability require
      direct documentary diligence.
    claimRefs: [CE004, CE006, CE014]
callouts:
  - calloutType: "insight"
    title: "Configuration-specific diligence is essential"
    body: >-
      KUAVO family-level descriptions combine bipedal and wheeled products with
      materially different mobility, runtime, safety, and deployment assumptions;
      underwriting should be performed against the exact bill of materials and
      software release offered to each customer.
    claimRefs: [CE003, CE011]
  - calloutType: "risk"
    title: "Commercial status is not independently settled"
    body: >-
      One external index labels Leju commercial, another catalog labels KUAVO a
      prototype, and a third records no available purchase listing. Signed-order,
      delivery, acceptance, and active-fleet evidence is needed to resolve the
      discrepancy.
    claimRefs: [CE005, CE012, CE013]
