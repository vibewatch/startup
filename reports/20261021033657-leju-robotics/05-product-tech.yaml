    columns:
      - "Layer / component"
      - "Role"
      - "Reported dependency"
      - "Principal risk"
    rows:
      - ["Mobility and actuation", "Bipedal walking or wheeled movement plus upper-body manipulation", "Leju joint modules, planetary reducers, frame, and configuration-specific hands", "Family-level torque and speed figures may not apply to the delivered configuration"]
      - ["Perception and navigation", "Environmental sensing, mapping, obstacle handling, and task positioning", "Depth cameras, LiDAR, multimodal sensor fusion, and 3D SLAM are described", "Sensor models, coverage, failure modes, and environmental limits are unpublished"]
      - ["Control, compute, and operating system", "Real-time robot control and local AI execution", "KaihongOS/OpenHarmony, industrial computer, and an NVIDIA edge module are reported", "Versioning, patching, component availability, and cybersecurity controls are undocumented"]
      - ["Data and skill-learning pipeline", "Collect demonstrations, train imitation-learning models, and deploy task skills", "VR teleoperation, GPU servers, and model integrations including Huawei Pangu and Doubao are reported", "Dataset rights, training cost, benchmark validity, monitoring, and rollback are unpublished"]
    notes: >-
      Architecture is reconstructed from third-party descriptions; component
      ownership, exact interfaces, supplied versions, and certification boundaries remain unverified.
    claimRefs: [CE003, CE004, CE006, CE010, CE014, CE015]
