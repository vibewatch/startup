company:
  name: Leju Robotics
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    China humanoid robotics is moving from demonstrations toward external sales, with Morgan
    Stanley forecasting 50,000 China shipments and a $2 billion market in 2026. Leju addresses
    several buyer groups, but the available evidence does not isolate a company-specific SAM,
    obtainable share, standardized price, or buyer-level adoption economics.
sections:
  - id: market-boundary
    title: Market boundary and substitutes
    body: >-
      Leju participates in a layered robotics market rather than one homogeneous humanoid TAM.
      Its relevant core is full-size humanoid platforms sold for industrial, commercial-service,
      research, and embodied-AI workflows; education robots and coding toys are adjacent product
      categories with different users, budgets, and performance requirements. The practical
      boundary therefore includes robot hardware, task integration, deployment support, and
      developer tooling where these are purchased with a Leju platform, but excludes conventional
      fixed automation, standalone AI software, prototypes not sold externally, and broad
      consumer-toy spending from the core humanoid opportunity. Status-quo substitutes include
      fixed industrial automation, purpose-built mobile robots, human labor, and continued pilot
      work instead of production deployment. Treating all of those categories as one market would
      overstate Leju's directly serviceable demand.
    claimRefs: [CM001, CM002, CM003, CM010, CM015]
    tableRefs: [TM001]
  - id: evidence-constrained-sizing
    title: Evidence-constrained sizing
    body: >-
      The strongest retained sizing evidence is Morgan Stanley's China external-sales forecast,
      reported by CNBC: 50,000 humanoid shipments and a $2 billion market in 2026, rising to
      446,000 units and $15 billion by 2030. The dollar endpoints imply roughly 65.5% annualized
      growth over four years, but that is a derived rate rather than a published CAGR. The
      forecast explicitly excludes prototypes, pre-order trials, and internal-use production,
      making it narrower and more investable than headline production counts. Omdia's estimate of
      about 13,000 humanoids shipped worldwide in 2025 provides a separate historical unit lens,
      not a directly comparable dollar denominator. None of the retained sources allocates the
      China forecast to Leju or discloses Leju's obtainable share, so a company-specific SAM and
      SOM remain unquantified.
    claimRefs: [CM004, CM005, CM006, CM007, CM008, CM009, CM010, CM016]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-and-adoption-path
    title: Buyers, users, payers, and adoption path
    body: >-
      The evidence indicates distinct adoption paths by segment. Industrial manufacturers and
      logistics operators are the likely economic buyers for material-handling or production
      tasks, while plant automation teams and frontline operators are the users. Commercial
      service deployments place the robot in exhibitions, retail, banks, and guidance settings,
      where operations or customer-experience budgets are the likely funding source. Universities,
      laboratories, and schools buy research or education platforms for developers, faculty, and
      students. Sacra describes industrial sales as direct enterprise relationships with pilots
      and systems-integrator participation, whereas education sales use distributor networks.
      Those paths imply that technical fit alone is insufficient: the buyer must also fund
      integration, workflow design, safety review, training, and maintenance.
    claimRefs: [CM001, CM002, CM003, CM015]
    tableRefs: [TM003]
  - id: drivers-constraints-and-valuation-relevance
    title: Growth drivers, constraints, and valuation relevance
    body: >-
      Commercial verification, policy support, and supply-chain feedback are the principal
      industry accelerants identified in the retained independent reporting. Chinese manufacturers
      are scaling into factories, logistics, retail, and service settings, while policy support
      lowers financing and operating friction. Against that, market timing remains uncertain,
      overseas expansion faces geopolitical and trade constraints, and published product pricing
      is not standardized. One directory records no public numeric MSRP and no currently available
      listing, while other directories show non-comparable indications around $50,000 and
      $38,000-$150,000. These are configuration clues, not a validated price curve. For
      valuation, industry growth should therefore be discounted until diligence establishes
      repeatable production deployments, customer-funded integration, realized selling prices,
      service costs, and Leju's share of external sales.
    claimRefs: [CM011, CM012, CM013, CM014, CM016]
