callouts:
  - calloutType: risk
    title: Industry growth is not Leju market share
    body: >-
      The $15 billion 2030 forecast is an industry external-sales estimate. Applying it directly
      to Leju without segment eligibility, realized pricing, win rates, and deployment retention
      would create a false-precision SOM.
    claimRefs: [CM006, CM010, CM016]
