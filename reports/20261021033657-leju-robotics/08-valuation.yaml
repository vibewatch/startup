callouts:
  - calloutType: "recommendation"
    title: "Price is the gating variable"
    body: >-
      Leju may be a credible company at an unattractive price. Without the IPO offer price, fully diluted ownership, preference stack, and prospectus-grade forecast bridge, public evidence supports continued diligence rather than a return claim.
    claimRefs: [CV001, CV015, CV016]
  - calloutType: "risk"
    title: "Do not equate sector forecasts with Leju economics"
    body: >-
      A fast-growing China humanoid market can coexist with weak company-level margins, negative cash flow, deployment concentration, and multiple compression.
    claimRefs: [CV004, CV008, CV010, CV011]
