evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A complete named executive and board roster, ownership percentages, committee structure, related-party register,
      and delegated authorities.
    whyItMatters: Without these records, key-person dependence, investor control, conflicts, and succession risk cannot be assessed.
    diligencePath: >-
      Request the capitalization table, articles, board minutes, executive organization chart, related-party register,
      and current employment agreements.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named customers, contracts, paid deployment counts, retention, repeat purchases, acceptance criteria, and the raw
      record behind the reported automotive trial.
    whyItMatters: >-
      Unit shipments and an unnamed deployment cannot establish repeatable demand, concentration, or production
      economics.
    diligencePath: >-
      Obtain a customer-level revenue cohort, signed contracts, invoice samples, acceptance reports, renewal or
      repeat-order data, and permissioned customer references.
    relatedQuestionRefs:
      - QO005
      - QO008
  - type: missing-source
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited annual financial statements, operating cash flow, cash balance, debt, round proceeds received, and
      post-round capitalization.
    whyItMatters: Reported revenue, accounting loss, and funding raised do not establish cash burn, liquidity, ownership, or runway.
    diligencePath: >-
      Review the filed prospectus and audited statements, reconcile bank receipts to financing documents, and obtain
      monthly cash and debt schedules.
    relatedQuestionRefs:
      - QO003
      - QO005
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholders
    missingEvidence: >-
      The full shareholder register, all financing participants, exact ownership stakes, preferences, board rights, and
      complete external-investment schedule.
    whyItMatters: >-
      The selected stakeholder map cannot resolve control, dilution, related-party exposure, or uncalled investment
      commitments.
    diligencePath: >-
      Reconcile the legal shareholder register, round documents, and investee ledger to the reported financing and
      external-investment history.
    relatedQuestionRefs:
      - QO003
      - QO008
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: Leju sales pipeline by segment and geography, realized selling prices, win rates, and externally shipped units.
    whyItMatters: Without these denominators, an industry forecast cannot be converted into a defensible Leju SAM or SOM.
    diligencePath: >-
      Obtain management pipeline exports, signed orders, shipment records, and realized-price data; reconcile them to
      audited revenue.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Current official list prices, configuration-level quotations, integration fees, maintenance costs, and gross
      margins.
    whyItMatters: Third-party indications are not comparable enough to establish buyer ROI or a revenue-per-unit model.
    diligencePath: >-
      Request current quotations for matched KUAVO configurations and customer invoices with hardware, software,
      integration, and service separated.
    relatedQuestionRefs:
      - QM006
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: buyer-segments
    missingEvidence: >-
      Customer procurement records identifying economic buyer, budget owner, pilot duration, conversion criteria, and
      renewal or expansion behavior.
    whyItMatters: Use-case lists show technical applicability but do not prove repeatable customer-funded adoption.
    diligencePath: >-
      Interview reference customers and inspect pilot-to-production conversion, procurement approvals, deployment
      utilization, and repeat orders.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: conflicting-data
    severity: material
    topic: market-size
    missingEvidence: >-
      Full Morgan Stanley and Omdia methodologies with consistent definitions for shipment, external sale, geography,
      and product eligibility.
    whyItMatters: >-
      The retained forecasts use different periods and denominators and cannot be blended into one trend line without
      methodology detail.
    diligencePath: >-
      Acquire the underlying market reports and reconcile category definitions, exclusions, shipment recognition, and
      forecast assumptions.
    relatedQuestionRefs:
      - QM002
      - QM003
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level renewal, repeat-order, integration-cost, multi-homing and replacement data across KUAVO
      deployments.
    whyItMatters: >-
      Without observed retention and migration costs, product breadth cannot be translated into durable customer lock-in
      or pricing power.
    diligencePath: >-
      Obtain cohort-level repeat purchase data, interview at least three production users, and review integration and
      support contracts for termination and portability terms.
    relatedQuestionRefs:
      - QP006
  - type: missing-source
    severity: material
    topic: substitutes-and-entrants
    missingEvidence: >-
      Comparable cost, cycle-time and reliability evidence for internal builds, fixed automation, delayed adoption and
      likely new humanoid entrants.
    whyItMatters: A humanoid-only peer set can overstate KUAVO's differentiation and miss the buyer's lowest risk alternative.
    diligencePath: >-
      Collect buyer RFPs and total-cost models, then benchmark the same workflow against fixed automation, internal
      integration and at least two newly launched platforms.
    relatedQuestionRefs:
      - QP010
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      CAC, sales cycle, channel fees, sales compensation, contribution margin, payback, repeat purchases, utilization,
      and service burden by customer and deployment type.
    whyItMatters: Without cohort-level economics, unit growth cannot be translated into scalable gross profit or cash payback.
    diligencePath: >-
      Obtain CRM cohort exports, signed-order and invoice data, costed bills of material, field service logs, and
      customer-level contribution-margin schedules.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cost-structure
    missingEvidence: >-
      Audited COGS, gross margin, inventory turns, capex, warranty accruals, rework, installation, support, and
      working-capital data.
    whyItMatters: >-
      Hardware scale can consume cash even when unit deliveries grow, and public product pages do not quantify that
      exposure.
    diligencePath: >-
      Review audited financial statements, monthly management accounts, inventory aging, purchase commitments, warranty
      reserves, and SKU-level standard versus actual costs.
    relatedQuestionRefs:
      - QI005
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, debt and project-finance obligations, committed capex, inventory funding,
      use of proceeds, downside runway, and next-round triggers.
    whyItMatters: >-
      Historical financing raised cannot determine current liquidity or the amount and timing of additional capital
      required.
    diligencePath: >-
      Reconcile financing proceeds to current cash, inspect debt and obligation schedules, and model monthly liquidity
      under base, delay, margin-compression, and downside cases.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: developer ecosystem
    missingEvidence: >-
      Public repository activity, package usage, release history, issue traffic, practitioner discussion, or another
      credible developer-signal proxy.
    whyItMatters: >-
      Without a public ecosystem signal, integration friction, external adoption, documentation quality, and the
      durability of claimed openness cannot be assessed.
    diligencePath: >-
      Request customer SDK documentation and release logs, then interview at least three unaffiliated integrators or
      research users about deployment experience.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: workflow outcomes
    missingEvidence: >-
      Customer-controlled before-and-after measures for throughput, intervention rate, uptime, task success, labor
      savings, learning time, or service outcomes.
    whyItMatters: >-
      Product descriptions establish intended workflows but not economic or operational superiority over fixed
      automation or manual work.
    diligencePath: >-
      Obtain configuration-specific pilot logs and customer acceptance reports with denominators, comparison baselines,
      operating periods, and exception counts.
    relatedQuestionRefs:
      - QE010
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: safety and reliability gaps
    missingEvidence: >-
      Official certificates, hazard analysis, cybersecurity architecture, privacy controls, incident history,
      environmental limits, and fleet reliability records.
    whyItMatters: >-
      Safe human coexistence, insurability, support cost, and deployment approval depend on controls and field evidence
      that catalog descriptions cannot establish.
    diligencePath: >-
      Review the certification file, bill of materials, software-update policy, penetration-test summary, FMEA, warranty
      data, and fleet maintenance history.
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Customer-level revenue schedules, order histories, active-unit cohorts, renewal or reorder rates, contract
      duration, churn, and satisfaction evidence.
    whyItMatters: >-
      Without these denominators, shipment acceleration cannot establish durable adoption, expansion economics, or
      concentration resilience.
    diligencePath: >-
      Request a customer cohort export reconciled to invoices, including annual revenue, units ordered, active units,
      use case, deployment status, renewals, and cancellations for 2024-2026.
    relatedQuestionRefs:
