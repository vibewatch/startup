chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Leju Robotics was founded in Shenzhen in 2016 by Leng Xiaokun with partners from the Harbin Institute of
              Technology Robot Club. The retained evidence describes a privately held, B2B manufacturer whose revenue
              model is primarily product sales. KUAVO is the central full-size humanoid platform, with bipedal, wheeled,
              and application-oriented variants aimed at industrial tasks, research, education, and service settings.
              RobotToday dates the KUAVO unveiling to December 2023, while two supplier-oriented profiles report that
              the company delivered its hundredth full-size humanoid during 2025. These profiles help establish product
              identity and milestones, but they are not independent proof of customer acceptance or realized deployment
              economics.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Financing, scale, and IPO posture
        blocks:
          - type: paragraph
            body: >-
              The strongest current financial narrative comes from 36Kr's authorized republication of IT Juzi analysis.
              It reports revenue rising from RMB 54 million in 2023 to RMB 258 million in 2025, with 577 KUAVO units
              contributing about RMB 178 million, or nearly 70% of the 2025 total. Growth did not eliminate financial
              pressure: the same source reports more than RMB 170 million of cumulative net loss over three years and a
              gross-margin decline from 50.45% to 40.78%. Multiples reports USD 248 million raised across three rounded
              funding rounds. These currencies are not converted or combined, and neither funding raised nor a planned
              IPO raise should be treated as cash available.
            claimRefs:
              - CO006
              - CO007
              - CO008
