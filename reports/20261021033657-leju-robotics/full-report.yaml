  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Leju participates in a layered robotics market rather than one homogeneous humanoid TAM. Its relevant core
              is full-size humanoid platforms sold for industrial, commercial-service, research, and embodied-AI
              workflows; education robots and coding toys are adjacent product categories with different users, budgets,
              and performance requirements. The practical boundary therefore includes robot hardware, task integration,
              deployment support, and developer tooling where these are purchased with a Leju platform, but excludes
              conventional fixed automation, standalone AI software, prototypes not sold externally, and broad
              consumer-toy spending from the core humanoid opportunity. Status-quo substitutes include fixed industrial
              automation, purpose-built mobile robots, human labor, and continued pilot work instead of production
              deployment. Treating all of those categories as one market would overstate Leju's directly serviceable
              demand.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM015
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The strongest retained sizing evidence is Morgan Stanley's China external-sales forecast, reported by
              CNBC: 50,000 humanoid shipments and a $2 billion market in 2026, rising to 446,000 units and $15 billion
              by 2030. The dollar endpoints imply roughly 65.5% annualized growth over four years, but that is a derived
              rate rather than a published CAGR. The forecast explicitly excludes prototypes, pre-order trials, and
              internal-use production, making it narrower and more investable than headline production counts. Omdia's
              estimate of about 13,000 humanoids shipped worldwide in 2025 provides a separate historical unit lens, not
              a directly comparable dollar denominator. None of the retained sources allocates the China forecast to
              Leju or discloses Leju's obtainable share, so a company-specific SAM and SOM remain unquantified.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM010
              - CM015
              - CM016
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates distinct adoption paths by segment. Industrial manufacturers and logistics
              operators are the likely economic buyers for material-handling or production tasks, while plant automation
              teams and frontline operators are the users. Commercial service deployments place the robot in
              exhibitions, retail, banks, and guidance settings, where operations or customer-experience budgets are the
              likely funding source. Universities, laboratories, and schools buy research or education platforms for
              developers, faculty, and students. Sacra describes industrial sales as direct enterprise relationships
              with pilots and systems-integrator participation, whereas education sales use distributor networks. Those
              paths imply that technical fit alone is insufficient: the buyer must also fund integration, workflow
              design, safety review, training, and maintenance.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM015
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Commercial verification, policy support, and supply-chain feedback are the principal industry accelerants
              identified in the retained independent reporting. Chinese manufacturers are scaling into factories,
              logistics, retail, and service settings, while policy support lowers financing and operating friction.
              Against that, market timing remains uncertain, overseas expansion faces geopolitical and trade
              constraints, and published product pricing is not standardized. One directory records no public numeric
              MSRP and no currently available listing, while other directories show non-comparable indications around
              $50,000 and $38,000-$150,000. These are configuration clues, not a validated price curve. For valuation,
              industry growth should therefore be discounted until diligence establishes repeatable production
              deployments, customer-funded integration, realized selling prices, service costs, and Leju's share of
              external sales.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Industry growth is not Leju market share
            body: >-
              The $15 billion 2030 forecast is an industry external-sales estimate. Applying it directly to Leju without
              segment eligibility, realized pricing, win rates, and deployment retention would create a false-precision
              SOM.
            calloutType: risk
            claimRefs:
              - CM006
              - CM010
              - CM016
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: A top-four shipment position in a fragmented field
        blocks:
          - type: paragraph
            body: >-
              TMTPost reports that Leju sold 577 KUAVO units in 2025, up from 32 in 2024, and that both Omdia and
              Counterpoint Research ranked it fourth globally behind Unitree, AgiBot and UBTECH. That establishes
              meaningful shipment scale, but not category leadership: the same reporting places Leju's 2025 revenue at
              RMB 258 million versus RMB 1.708 billion for profitable Unitree. Leju's own site spans research, business
              service, industrial and training-ground solutions, while independent directories describe bipedal, wheeled
              and application-specific KUAVO variants. The direct set therefore includes Chinese full-size humanoid
              peers; adjacent choices include research platforms and service robots. Fixed automation, internal
              integration and delaying deployment remain buyer alternatives, but the assigned public evidence does not
              quantify their economics, so they are treated as unscored substitutes rather than asserted competitors.
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP008
              - CP009
              - CP014
              - CP015
      - number: '3.2'
        title: Product breadth is visible; deployment comparability is not
        blocks:
          - type: paragraph
            body: >-
              Leju's visible differentiation is platform breadth and its OpenHarmony-based software association, not a
              independently verified performance lead. Third-party listings describe 4.6 km/h omnidirectional movement
              and 360 N m peak joint torque, while the KUAVO 5-W listing adds a wheeled base, 40 degrees of freedom and
              a six-hour runtime. These specifications are useful for configuration screening, but they do not form a
              neutral benchmark and vary by model. Commercialization labels also differ: one database calls the base
              KUAVO pre-commercial, another labels the family a prototype, Humanoid.Guide calls the 5-W in production,
              and Sourcebotics quotes a lead time. Buyers therefore face variant-specific integration and verification
              work. The lack of a published collaborative-safety certification is especially important for shared
              industrial spaces and prevents a clean trust or regulatory comparison with peers.
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP016
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
              - CP007
              - CP015
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP015
              - CP016
      - number: '3.3'
        title: Price is a weapon, but public packaging is opaque
        blocks:
          - type: paragraph
            body: >-
              The strongest adverse signal is price-led expansion. TMTPost reports that KUAVO's average selling price
              fell 25.56% in 2025 as Leju pursued a more aggressive market-pricing strategy. Public list-price evidence
              is not comparable: ui44 records no official MSRP, RobotOverflow says Kuavo pricing is undisclosed,
              Sourcebotics publishes a wide USD 38,000-150,000 range, and Humanoid.Guide lists USD 80,000 for the 5-W.
              These may reflect different variants, accessories, support and commercial terms rather than true price
              disagreement. Leju can reuse education-market direct and indirect channels, but the reported 2025
              application mix was led by data collection, with industrial manufacturing only 3.88% of KUAVO revenue. The
              available evidence therefore supports quotation-led packaging and early channel leverage, not a
              standardized mass-market price advantage.
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP011
              - CP012
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP004
              - CP010
              - CP015
              - CP016
      - number: '3.4'
        title: Scale learning is plausible, but component and proof gaps weaken durability
        blocks:
          - type: paragraph
            body: >-
              Leju's shipment acceleration, rapid product iteration and access to education and data-collection buyers
              can create learning effects, yet public evidence does not show durable lock-in or proprietary
              distribution. TMTPost reports that an FAW deployment remained at the proof-of-concept stage and that one
              supplier provided 82.82% of Leju's joint-module purchases in 2025. The same source contrasts this
              dependence with Unitree's higher internal production of mature joint modules and dexterous hands. That
              combination exposes Leju to component bargaining power and to peers that can capture more hardware margin.
              The principal displacement risk is not merely a faster robot; it is a rival that pairs comparable motion
              with verified industrial reliability, safety certification, lower component dependence and a clearer total
              cost of ownership. Customer retention, switching costs, multi-homing and internal-build economics remain
              private-evidence gaps.
            claimRefs:
              - CP008
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Shipment rank does not prove a durable moat
            body: >-
              The 2025 volume surge coincided with a 25.56% average-price reduction, early industrial proof-of-concept
              work and concentrated joint-module sourcing. Underwriting should separate adoption bought through pricing
              from repeatable product pull.
            calloutType: risk
            claimRefs:
              - CP008
              - CP010
              - CP012
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Commercial model and pricing
        blocks:
          - type: paragraph
            body: >-
              The visible commercial model is primarily configured robot sales rather than a disclosed subscription or
              usage-based model. RoboAtlas describes KUAVO configurations for research, education, industrial, and other
              deployment scenarios, while independent product directories show materially different price observations:
              Origin of Bots estimates $50,000–$150,000, Sourcebotics lists $38,000–$150,000, Humanoid.Guide lists
              $80,000 for KUAVO 5-W, and Humanoid Press cites about $50,000. These are third-party list or sourcing
              indications, not realized average selling prices, contracted consideration, or recognized revenue.
              Sourcebotics also lists a one-unit minimum order and a 60–90 day lead time, consistent with a
              configuration-and-quotation motion. No retained source discloses discounting, payment terms, service
              attach, warranty revenue, channel economics, or revenue-recognition policy.
            claimRefs:
