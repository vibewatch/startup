      - Valuation / return logic
      - Downside trigger or probability signal
    rows:
      - - Bull
        - >-
          Repeat industrial orders, customer-verified reliability, improving gross margin, and a clean security
          structure.
        - Supportable only if the IPO price leaves upside to a peer-adjusted exit value after dilution.
        - Audited growth plus falling operating cash outflow and customer-level repeat-order evidence.
      - - Base
        - Growth continues, but losses and deployment-economics opacity persist.
        - No point range; require a discount for execution, illiquidity, and incomplete pricing evidence.
        - Revenue scales while operating cash flow remains negative and deployments remain lightly verified.
      - - Bear
        - Commercialization slows, public robotics multiples compress, or geopolitical constraints impair expansion.
        - Capital loss is plausible if an aggressive IPO valuation meets weaker growth or further dilution.
        - Missed deployment milestones, worsening cash use, down-round terms, or export/compliance restrictions.
    notes: >-
      These are qualitative underwriting conditions, not probability-weighted valuations; missing offer price, share
      count, preference terms, and forecast financials prevent numerical scenario outputs.
    claimRefs:
      - CV004
      - CV008
      - CV010
      - CV011
      - CV014
      - CV015
      - CV016
