      - number: '4.2'
        title: Traction and delivery economics
        blocks:
          - type: paragraph
            body: >-
              Public traction is stronger at the unit and deployment level than at the accounting level. Origin of Bots
              reports that KUAVO sales increased from 32 units in 2024 to 577 in 2025, while RobotToday reports delivery
              of the hundredth full-size humanoid in 2025; the different scopes and issuer quality prevent treating
              those figures as a single reconciled shipment series. China Technology Review separately reports 15
              humanoids operating on an automotive-parts loading line with a 98% success rate over 1,000 continuous
              hours. That deployment is a useful operating proof point, but it does not disclose contract value, labor
              substitution, uptime penalties, maintenance expense, utilization, or gross profit. The evidence therefore
              supports demand and technical-delivery proxies, not CAC payback or contribution margin.
            claimRefs:
              - CI009
              - CI011
              - CI012
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI015
      - number: '4.3'
        title: Capital adequacy and cash visibility
        blocks:
          - type: paragraph
            body: >-
              RoboAtlas reports a nearly CNY 1.5 billion, approximately $200 million, pre-IPO financing in October 2025.
              That amount is historical capital raised; it is not cash on hand, operating cash flow, or runway as of the
              report date. None of the retained financial evidence provides a balance-sheet cash figure, monthly or
              annual burn, debt balance, committed capex, inventory financing, planned use of proceeds, or a next-round
              trigger. Hardware production, inventory, integration, and support can create meaningful working-capital
              needs, but the available pages do not quantify them. Underwriting capital adequacy therefore requires
              management accounts, cash reconciliation from the financing close, debt schedules, inventory aging,
              committed purchase obligations, and a monthly liquidity plan.
            claimRefs:
              - CI010
              - CI015
      - number: '4.4'
        title: Underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Revenue quality cannot yet be rated above preliminary. Multiple external price points and a quote-led
              ordering path indicate commercial intent, while shipment and factory-deployment reports indicate activity
              beyond laboratory demonstrations. However, ui44 records no numeric price and no available listing for its
              tracked model, and Behind Robotics labels KUAVO as a prototype; those signals caution against equating
              product visibility with repeatable, currently purchasable volume. The decisive missing bridge is from
              units and deployments to booked revenue, collections, warranty and service costs, and gross profit.
              Investment underwriting should remain conditional on audited revenue by product, backlog conversion,
              customer concentration, gross-margin cohorts, cash burn, and scenario-specific unit economics.
            claimRefs:
              - CI006
              - CI007
              - CI013
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Funding raised is not runway
            body: >-
              The reported 2025 pre-IPO financing does not establish current cash availability. Capital adequacy remains
              unquantified without cash, burn, debt, inventory, capex, and obligation data.
            calloutType: risk
            claimRefs:
              - CI010
              - CI015
          - type: callout
            title: Gate underwriting on the accounting bridge
            body: >-
              Require invoice-to-cash reconciliation, gross margin by SKU and cohort, backlog conversion, warranty and
              field-service costs, customer concentration, and downside liquidity scenarios before assigning a
              revenue-quality or runway conclusion.
            calloutType: recommendation
            claimRefs:
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio breadth is visible, but availability is not
        blocks:
          - type: paragraph
            body: >-
              The externally visible portfolio is broader than a single walking demo. Multiple specialist directories
              identify KUAVO as Leju's full-size humanoid family, with bipedal and wheeled configurations, while a
              supplier profile also describes AELOS education robots and the smaller PANDO coding line. The customer
              workflow differs by configuration: bipedal KUAVO is positioned for embodied-AI research and task
              development; KUAVO 5-W replaces legs with an omnidirectional base for longer-duration industrial or
              service mobility; and AELOS targets programming instruction and competitions. This breadth does not
              establish purchase availability. ui44 tracked one active KUAVO record but no available listing or numeric
              price, and BehindRobotics called the series a prototype. Product diligence therefore needs a configuration
              list tied to orderability, supported tasks, warranties, and deployment acceptance criteria rather than a
              blended family-level specification.
            claimRefs:
              - CE001
              - CE005
              - CE007
              - CE009
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE001
