  - id: FR001
    title: Residual-risk heatmap and mitigation lens
    type: matrix
    summary: >-
      Six thesis-critical risks ranked by impact, evidence-based likelihood, mitigation maturity, and residual exposure
      as of the run date.
    data:
      columns:
        - Impact
        - Likelihood signal
        - Mitigation maturity
        - Residual exposure
      rows:
        - label: Industrial safety and certification
          values:
            - label: High
              detail: Factory acceptance and injury liability can be deployment-gating.
            - label: Unknown
              detail: No primary certification or incident record was allocated.
            - label: Not evidenced
            - label: High
        - label: Fleet reliability and quality
          values:
            - label: High
            - label: Medium
              detail: A recent reported trial is positive but lacks customer-issued corroboration.
            - label: Emerging
            - label: High
        - label: Industrial conversion and customer concentration
          values:
            - label: High
            - label: Medium-high
              detail: Research and education remain the clearest publicly described base.
            - label: Early
            - label: High
        - label: Manufacturing and component scale-up
          values:
            - label: High
            - label: Medium
              detail: Design capacity and category shortages are reported; realized yield is undisclosed.
            - label: Planned
            - label: High
        - label: Huawei / OpenHarmony dependency
          values:
            - label: Medium-high
            - label: Medium
            - label: Partial
              detail: Ecosystem alignment exists, but portability evidence is missing.
            - label: Medium-high
        - label: Geopolitical and overseas procurement
          values:
            - label: High
            - label: Medium
              detail: Category-level reporting identifies trade tension as a significant headwind.
            - label: Unknown for Leju
            - label: Medium-high
