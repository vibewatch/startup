        title: Leadership and governance visibility
        blocks:
          - type: paragraph
            body: >-
              Public leadership evidence in the assigned pool is notably sparse. Leng Xiaokun is identified as founder
              and legal representative, and 36Kr says he founded the company with partners from the Harbin Institute of
              Technology Robot Club. The retained sources do not name those partners, a broader executive team,
              directors, board committees, or control rights. This creates a key-person and governance diligence issue
              rather than evidence that such structures do not exist. A complete management roster, capitalization
              table, related-party register, and board materials are required to assess succession, investor influence,
