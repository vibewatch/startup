      - CR004
      - CR011
      - CR013
      - CR014
      - CR015
      - CR016
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Evidence moves from market opportunity through company proof and unresolved price inputs to a research-more
      decision.
    data:
      nodes:
        - id: market
          label: Market tailwind
          detail: Morgan Stanley forecast 50,000 China humanoid shipments and a USD 2 billion market in 2026.
        - id: growth
          label: Company growth
          detail: Prospectus-derived reporting put 2025 revenue at RMB 258 million, with Kuavo as the main revenue line.
        - id: proof
          label: Commercial proof
          detail: >-
            A reported industrial deployment is promising but lacks customer-issued verification in the assigned
            evidence.
        - id: economics
          label: Economics gap
          detail: Leju remained loss-making and operating cash flow negative in 2025.
        - id: price
          label: Price gap
          detail: Offer price, fully diluted capitalization, preferences, and consistent product pricing are unavailable.
        - id: decision
          label: Research more
          detail: High risk and stretched or unsupported until price-setting and primary diligence evidence is obtained.
    approximationNotes: >-
      The flow is qualitative and ordered; it does not assign probabilities, conversion rates, or numerical valuation
      weights.
    claimRefs:
      - CV002
      - CV004
      - CV010
      - CV014
      - CV015
      - CV016
